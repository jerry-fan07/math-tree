unit: quant-games.market-making-game
opening: >
  This unit is the canonical trading-interview set piece: "make me a market
  on X." Every earlier unit in this program feeds into it — fair value, the
  Fermi machinery for building an estimate, confidence intervals, Bayesian
  updating, the Kelly criterion — and this is where you show you can run all
  of it live, under a clock, against a counterparty who already knows the
  answer. The arc runs from the rules of play and the mechanics of a clean
  quote, through pricing the centre and the width, into what happens once
  trades start arriving: updating on flow, adverse selection, inventory risk
  and the skew that manages it, sizing discipline, and the calibration that
  tells you whether your stated confidence is honest. It closes with a full
  worked session and a note on what the game keeps from, and drops from,
  real market making.
lessons:
  - node: quant-games.market-making-game.protocol
    hook: >
      This is the single most common shape a trading interview takes, and
      the obligation is the whole test: naming a number is easy, standing
      behind two firm, tradeable prices is what actually gets graded.
    explanation: >
      The game turns a single-number estimate into a two-sided commitment.
      You state a bid $b$ and an ask $a$ with $b < a$, both good for a
      stated size, and you must honor whichever side the interviewer takes
      — buy from you at $a$, sell to you at $b$, or pass. That obligation is
      new next to a bare estimate: a single number can't be marked against
      anything once the truth arrives, but a firm two-sided price can,
      immediately, just by comparing it to what actually happened.

      Scoring makes the incentive explicit. A unit you bought at $b$ marks
      to $T-b$, a unit you sold at $a$ marks to $a-T$, a pass marks to $0$.
      Both formulas reward a price close to the truth and, more
      importantly, reward a price you were genuinely willing to trade at —
      there's no way to fake conviction here, because the interviewer, not
      you, decides which side gets hit.

      The interviewer typically trades more than once, re-quoting between
      fills, so this is really a short sequence of decisions rather than
      one number. Grading is mostly about process — a defensible centre, a
      width that matches your stated uncertainty, and updating that makes
      sense — which is exactly why the fastest way to fail is refusing to
      name a two-sided price at all, or quoting something absurd, which
      reads as not taking the exercise seriously rather than as caution.
    worked: >
      Quote $3800$ / $4600$, one lot, on the number of registered taxis in a
      large city. The interviewer buys from you, lifting the ask at $4600$.
      The truth is later revealed to be $5100$. Your fill marks to $a - T =
      4600 - 5100 = -500$ — a losing trade, but a legitimate one: you
      honored a price you'd committed to, and the score reflects exactly
      how far that price was from the truth.
    interview: >
      Expect the literal phrase "make me a market on X." The interviewer is
      listening for a genuine bid and ask, not a single guess, delivered
      with a size attached, and for whether you flinch at the idea that
      they get to choose which side to trade.
    pitfalls: >
      Refusing to quote at all, or offering a single number instead of two,
      fails immediately regardless of how good that number is. So does
      quoting and then hedging your commitment — "well, I'd probably trade
      around there" — since the whole exercise tests whether you'll
      actually stand behind a firm, tradeable price.
    recap: >
      A market-making answer is a firm bid and ask you're obliged to honor,
      scored against the truth once it's revealed — the obligation, not the
      number, is what's actually being tested.
    dialogue:
      - part: Two prices, and he picks
        teach: >
          The interviewer says: "Make me a market on the number of seats in
          the city's main concert hall." You answer "$1800$ at $2400$, one."
          He says: "I'll buy one." Later the hall turns out to hold $2150$
          seats.
      - ask: >
          What trade did you just do?
        choices:
          - text: >
              You bought one at $1800$.
            feedback: >
              $1800$ is your bid, the price at which you buy. He bought, so
              you were on the other side of his purchase: you sold, and you
              sold at the price you offered to sell at.
          - text: >
              You sold one at $2100$, the middle of your market.
            feedback: >
              Nobody trades at the middle. You named two firm prices and he
              took one of them as it stood; $2100$ was never on offer.
          - text: >
              You sold one at $2400$.
            correct: true
            feedback: >
              Right. "I buy" means he takes your ask, $2400$, and you are now
              short one. Traders call this *lifting* the offer.
          - text: >
              Nothing yet: you still get to agree to the trade.
            feedback: >
              The quote was the agreement. Saying "$1800$ at $2400$, one"
              committed you to both prices before he chose; backing out now
              is the one move the game does not allow.
        feedback: >
          The first price you say is the bid, where you buy; the second is the
          ask, where you sell. He chooses which, and you do not.
      - ask: >
          Score the unit you sold at $2400$ against the truth of $2150$.
        expects: "250"
        hint: >
          You received $2400$ for something worth $2150$.
        feedback: >
          A unit sold at $a$ scores $a - T = 2400 - 2150 = 250$. You sold it
          for more than it turned out to be worth.
      - ask: >
          Same quote, but suppose he had said "I'll sell you one" instead, and
          the hall held $2150$ seats. What would that unit score?
        expects: "350"
        hint: >
          Now you paid your bid for something worth $2150$.
        feedback: >
          He *hit* your bid: you bought at $b = 1800$ and the unit marks to
          $T - b = 2150 - 1800 = 350$. With the truth inside your market,
          either side he picks pays you.
      - ask: >
          Now suppose the hall held $2600$ seats and he had bought from you.
          What does the fill score?
        expects: "-200"
        hint: >
          Which price did you sell at, and is it above or below $2600$?
        feedback: >
          You sold at $2400$ something worth $2600$: $a - T = 2400 - 2600 =
          -200$. A truth outside your market is where losses come from, and he
          gets to choose the side that finds them.

      - part: Which replies count as a market
        teach: >
          Four candidates are asked for a market on the number of ferry
          crossings a harbour runs in a day. A says "about $300$". B says
          "$250$ at $350$, one". C says "$5$ at $5000$, one". D says "$250$
          to $350$, roughly, though I would not want to trade on it".
      - ask: >
          Which reply is a market the interviewer can actually play against?
        choices:
          - text: >
              A, because a single good number is the hardest part.
            feedback: >
              A single number cannot be traded against: there is no price at
              which he can buy and none at which he can sell. It is an
              estimate, and the game asks for a commitment.
          - text: >
              B.
            correct: true
            feedback: >
              Two firm prices, bid below ask, a size, and both sides open at
              once. Whatever the truth is, he can choose a side and the trade
              can be scored.
          - text: >
              D, since a range is the honest answer under uncertainty.
            feedback: >
              The range is fine; the disclaimer is fatal. "I would not want to
              trade on it" withdraws exactly the obligation the game tests, so
              there is nothing for him to choose.
        feedback: >
          B is the only reply he can trade with. A and D give him nothing to
          act on, each for a different reason.
      - ask: >
          C is two prices with the bid below the ask. Why does it still fail
          on the spot?
        choices:
          - text: >
              It is crossed, so he can trade both sides for free money.
            feedback: >
              Crossed means bid above ask. Here $5 < 5000$, so it is not
              crossed; the problem is the opposite of free money.
          - text: >
              No sensible truth lies outside it, so he never trades and it
              commits you to nothing.
            correct: true
            feedback: >
              Right. A market he would never trade against is a refusal to
              quote dressed as a quote. Wide is allowed; a width that no
              uncertainty you could name would justify is not.
          - text: >
              It does not fail; the widest market is the safest one.
            feedback: >
              Safe from losses, yes, and therefore safe from being graded. The
              exercise is to take a risk you can defend, and C takes none.
        feedback: >
          A joke market fails for the same reason a refusal does: nothing you
          said can be marked against the truth.
      - reflect: >
          B survived and A, C and D did not. Say exactly what you were
          checking about each reply.
        answer: >
          Whether it hands the interviewer a real choice he can be held to:
          two prices with the bid below the ask, firm for a stated size, both
          live at the same moment, close enough to the plausible truth that
          trading on them would mean something. A gives one price instead of
          two, D gives two but withdraws the commitment, and C commits to
          prices no one would ever trade at.
      - teach: >
          Those are the rules of play. You quote a bid $b$ and an ask $a$ with
          $b < a$, good for a stated size, both live at once. He sells to you
          at $b$, buys from you at $a$, or passes, and you honour whichever he
          picks. When the truth $T$ arrives, a unit bought at $b$ scores
          $T - b$, a unit sold at $a$ scores $a - T$, and a pass scores
          nothing. He may trade again, and you re-quote between trades. The
          grade is mostly on process: a defensible centre, a width matching
          your uncertainty, coherent updating.

      - part: A short session, scored
        ask: >
          On the ferry crossings, round 1 you quote $250$ / $310$ and he buys
          one. Round 2 you re-quote $290$ / $350$ and he sells you one. The
          truth is $330$. What is your total score?
        expects: "20"
        hint: >
          Score each fill separately against $330$, then add.
        feedback: >
          The sale at $310$ scores $310 - 330 = -20$; the purchase at $290$
          scores $330 - 290 = 40$. Total $-20 + 40 = 20$.
      - ask: >
          Had the truth been $500$ instead, what would that same session have
          scored?
        choices:
          - text: >
              Much worse: you sold at $310$ and the truth came in far above it.
            feedback: >
              The sale does score $310 - 500 = -190$, but the purchase now
              scores $500 - 290 = 210$. One fill's loss is the other's gain.
          - text: >
              Exactly $20$ again.
            correct: true
            feedback: >
              You sold one and bought one back, so you end with no position,
              and the score is the $310 - 290 = 20$ locked in between the two
              prices. The truth only matters for units you still hold.
          - text: >
              It cannot be scored until you know which round mattered more.
            feedback: >
              Every fill is scored on its own and added; no round is weighted.
              Do it: $-190 + 210 = 20$.
        feedback: >
          A sale and a purchase of the same size cancel against the truth. Your
          exposure to $T$ is the position you are left holding, which is why
          later questions about risk are questions about that position.
      - ask: >
          A candidate quotes "$260$ bid for one, and I will tell you my offer
          once you have decided whether to sell." Which rule does that break?
        choices:
          - text: >
              The bid must be below the ask.
            feedback: >
              There is no ask yet to compare with, so this rule is not what
              fails. Even an ask of $300$ named later would leave the real
              problem in place.
          - text: >
              Both sides must be live at the same moment.
            correct: true
            feedback: >
              Right. Holding the offer back until he has shown his hand lets
              you see his choice before committing to the other side. The
              whole point of a two-sided quote is that you cannot.
          - text: >
              The quote must carry a size.
            feedback: >
              He said "for one", so the size is there. What is missing is the
              second price at the moment he has to choose.
        feedback: >
          The game is a commitment made before you learn which way he wants to
          go. Say both prices and the size in one breath: "$260$ at $320$,
          one."

  - node: quant-games.market-making-game.clarify-the-quantity
    hook: >
      The ambiguity hiding in a casually phrased quantity is worth more
      than any spread you'll ever quote around it, and resolving it is the
      very first thing graded — before you've said a single price.
    explanation: >
      Spend the first several seconds only on units, scope, timing, and
      definition, not on estimating. A quantity phrased casually usually
      hides a fork worth a factor of two or more: metric or imperial, one
      city or a whole country, a current figure or a historical one.
      Guessing the wrong branch of that fork costs more than any spread
      discipline can recover, because you'd be quoting confidently around
      the wrong number entirely.

      The fix is one or two closed questions — phrased so a single word
      answers them — followed by committing. Two failure modes sit on
      either side of the right behaviour. Interrogating past the point of
      genuine ambiguity turns the opening of the game into stalling and
      reads as an inability to act under uncertainty. Quoting immediately
      and only asking for clarification after being traded against, so as
      to reinterpret the question in your favour, reads as worse than the
      bad fill itself — it looks like welching.

      Some ambiguity the interviewer will simply decline to resolve, on
      purpose. When that happens, stop asking: the ambiguity is genuine
      variance in the quantity you're pricing, and it belongs in your
      spread. Treating unresolved ambiguity as an unfair trick to complain
      about after the truth is revealed misreads what's being tested —
      whether you can price what you don't know, not whether you can argue
      your way out of it.
    worked: >
      "Make me a market on average rent in a major city." Two readings sit
      a factor apart: studio units average near $2200$ a month, one-
      bedrooms near $3400$ — a $55\%$ gap, wider than any spread worth
      quoting blind. One closed question, "one-bedroom, city-wide, current
      month?", resolves the fork; once confirmed, you build your Fermi
      estimate around one-bedrooms specifically instead of guessing which
      reading was meant.
    interview: >
      Expect the fork to be genuinely ambiguous on purpose. The
      interviewer is listening for one or two closed questions that
      resolve it quickly, then a clean commitment — not an open-ended
      "what do you mean by that?"
    pitfalls: >
      Asking more than one or two questions turns clarification into
      stalling. Quoting first and redefining the question after a bad fill
      reads as welching, not diligence. Treating an interviewer's refusal
      to clarify as unfair, rather than pricing it as width, misses the
      actual test.
    recap: >
      Resolve units, scope and timing with one or two closed questions
      before building any number — and price whatever ambiguity remains as
      width, not as a grievance.
    dialogue:
      - part: A good market on the wrong number
        teach: >
          "Make me a market on the distance from London to New York." You
          remember the flight is about $5570$ kilometres, so you say "$5300$
          at $5900$, one." He sells you one. Then he reveals the truth he had
          in mind: $3460$, in miles.
      - ask: >
          Score your fill.
        expects: "-1840"
        hint: >
          He sold, so you bought at your bid. The mark is $T - b$.
        feedback: >
          You bought at $5300$ something he scores as $3460$:
          $T - b = 3460 - 5300 = -1840$. That is more than three times the
          full $600$ width of your market.
      - ask: >
          Had he meant kilometres, with the truth $5570$, what would the same
          fill have scored?
        expects: "270"
        hint: >
          Same trade, same bid, a different $T$.
        feedback: >
          $T - b = 5570 - 5300 = 270$. Same quote, same trade, and a
          profitable one. Nothing about the market changed between the two
          answers except which quantity it was priced on.
      - ask: >
          So what actually went wrong?
        choices:
          - text: >
              The centre was badly estimated.
            feedback: >
              $5570$ kilometres is very close to right. Your estimate was fine;
              it was an estimate of something he was not asking about.
          - text: >
              The spread was too tight; a wider market would have saved you.
            feedback: >
              A market wide enough to cover both $3460$ and $5570$ runs from
              about $3300$ to $5800$, which says you have no idea of a distance
              you know well. Width is for genuine uncertainty, not for a
              question you never asked.
          - text: >
              You priced a different quantity from the one he scored.
            correct: true
            feedback: >
              Right. Kilometres against miles is a factor of $1.61$, and no
              sensible spread survives a factor of $1.61$. The loss was decided
              before you named a price.
          - text: >
              Nothing: he hid the units, so the loss is his fault.
            feedback: >
              He is allowed to say "distance" and leave the units open. Leaving
              them open was a test, and the test was whether you would notice.
        feedback: >
          A casually worded quantity often hides a fork wider than any spread
          you would quote. Guessing the branch stakes the whole trade on the
          guess.
      - reflect: >
          What could you have done in the first ten seconds, before any
          number, that makes the $-1840$ impossible — and what shape should it
          take so that it does not eat the clock?
        answer: >
          Ask about the fork directly, as a question one word can answer:
          "Miles or kilometres, straight-line distance?" A closed question
          resolves the ambiguity in one exchange and signals that you know
          where the danger is. An open question ("what do you mean by
          distance?") invites a lecture, and several questions in a row start
          to look like stalling.

      - part: Ask once, closed, then commit
        teach: >
          The technique is to pin the quantity down before quoting: units,
          scope, timing and definition. Spend the first ten seconds there, ask
          one or two closed questions, then commit. Asking until no
          uncertainty is left is not the game: the questions are for forks
          bigger than your spread, and the rest goes into the width.
      - ask: >
          "Make me a market on the volume of water in an Olympic swimming
          pool." Which opening is the right shape?
        choices:
          - text: >
              "What exactly do you mean by volume?"
            feedback: >
              Open-ended. It hands him the floor and invites a definition you
              did not need. Name the fork you see and let him pick a branch.
          - text: >
              "Cubic metres or litres?"
            correct: true
            feedback: >
              One closed question on the one fork that matters: the two units
              differ by a factor of $1000$, and a single word settles it.
          - text: >
              "Which pool, which depth, filled to the brim or to the line, and
              at what temperature?"
            feedback: >
              Four questions, three of which move the answer by a few percent,
              well inside any width you would quote. This is stalling, and it
              reads as not being able to act without certainty.
          - text: >
              No question: quote in litres and adjust if he meant cubic
              metres.
            feedback: >
              Adjusting after the trade is the welching failure. If the units
              could swing the answer a thousandfold, settle them before you
              quote.
        feedback: >
          Ask about forks that are bigger than your spread, in a form one word
          answers. Leave the small ones inside the width.
      - ask: >
          Back on the London to New York market: you quoted $5300$ / $5900$
          without asking, he sold to you, and now you say "I was obviously
          quoting kilometres, so the trade should be scored in kilometres."
          How does that land?
        choices:
          - text: >
              As a fair correction; the misunderstanding was mutual.
            feedback: >
              It was mutual before the trade. After it, only one of you
              benefits from the reinterpretation, and that is you.
          - text: >
              As welching: you are choosing the reading after seeing his side.
            correct: true
            feedback: >
              Right. A quote's meaning is fixed when you say it. Rewriting it
              once you know which way he traded is backing out of a trade, and
              it reads worse than the loss itself.
          - text: >
              As fine, provided you also offer to cancel the trade.
            feedback: >
              Cancelling is the same move. The obligation is to honour the
              price you named, on the quantity he meant; the time to settle
              the quantity was before you named it.
        feedback: >
          Clarifying is free before the quote and costs your credibility after
          it.

      - part: When he will not say
        teach: >
          "Make me a market on the weight of a grand piano, in kilograms." You
          see the fork: a baby grand is about $250$, a concert grand about
          $480$. You ask "baby or concert grand?" and he says: "Your call."
      - ask: >
          Treat the two readings as equally likely. Where should your centre
          sit?
        expects: "365"
        hint: >
          The expected value of a quantity that is $250$ or $480$ with equal
          chances.
        feedback: >
          $\frac{1}{2}(250) + \frac{1}{2}(480) = 365$. Neither reading is your
          best guess; the average of the two is.
      - ask: >
          Ignoring any uncertainty within each reading, what is the standard
          deviation of your belief about the weight?
        expects: "115"
        hint: >
          Each reading sits the same distance from $365$.
        feedback: >
          Both readings are $115$ from the centre, so every outcome deviates
          by exactly $115$ and the standard deviation is $115$. Your error
          within a reading, perhaps $\pm 30$, is small beside it.
      - ask: >
          So what does the market look like?
        choices:
          - text: >
              Tight around one reading, say $240$ / $260$, since he left the
              choice to you.
            feedback: >
              "Your call" means he will not tell you, not that you get to pick.
              If the truth is $480$, the tight market around $250$ loses $220$
              on a lift.
          - text: >
              Centred near $365$ and wide enough to carry the $\pm 115$ of
              ambiguity.
            correct: true
            feedback: >
              Right. Ambiguity he refuses to resolve is genuine variance in the
              number you are pricing, so it goes into the width.
          - text: >
              No market until he picks a reading.
            feedback: >
              He has declined once, deliberately. Asking again is the
              interrogation failure, and refusing to quote fails the game
              outright.
        feedback: >
          Resolved ambiguity disappears; unresolved ambiguity becomes width.
          Either way you quote, and you never argue about it after the reveal.
      - ask: >
          Which of these forks is not worth a question?
        choices:
          - text: >
              Whether "the population of Tokyo" means the city wards or the
              whole metropolitan area.
            feedback: >
              Roughly $10$ million against more than $35$ million. That fork is
              wider than any market, so ask.
          - text: >
              Whether "the length of a marathon" is wanted in miles or
              kilometres.
            feedback: >
              About $26$ against $42$, a factor of $1.61$. Exactly the London
              to New York trap; ask.
          - text: >
              Whether "the number of windows in this office tower" counts the
              two skylights on the roof.
            correct: true
            feedback: >
              Right. Two windows out of several hundred is far inside any width
              you would quote. Asking spends the clock and your credibility on
              nothing.
        feedback: >
          The test for a question is whether the fork is bigger than the
          spread you are about to quote. Said aloud, the whole move is one
          sentence: "Miles, straight line? Fine — $3300$ at $3700$, one."

  - node: quant-games.market-making-game.fair-value-first
    hook: >
      A centre you can't defend with an explicit chain of reasoning is a
      centre the interviewer can dismantle with one follow-up, so it has to
      exist, out loud, before any spread gets attached to it.
    explanation: >
      Fix the centre before touching the width, because the two decisions
      draw on different information: the centre comes from your best
      estimate of the quantity, the width from how uncertain that estimate
      is. Conflating them — widening because the arithmetic felt shaky, say
      — muddies both decisions at once. Build the centre by decomposing the
      unknown into factors you can anchor individually and multiplying them
      out, or, when there's no natural decomposition, by bracketing the
      quantity between a bound you're confident is too low and one you're
      confident is too high and averaging the two in log space.

      Say the chain out loud as you build it. An interviewer who hears
      "population, times a catchment ratio, times a conversion factor" can
      challenge one link — "why that ratio?" — and you revise just that
      link and recompute, instead of the whole estimate collapsing because
      you can't defend where it came from. A number produced with no stated
      chain is unimprovable: any challenge forces you to either invent a
      justification on the spot or abandon the number outright, and both
      read badly.

      Only once that centre is fixed do you turn to a spread. That's a
      separate decision, made from your uncertainty about the centre you
      just built, never from the centre's value itself.
    worked: >
      Estimate the number of dry cleaners in a city of $1.6$ million
      people. Decompose: about $800{,}000$ households, each dropping off
      clothes roughly every two weeks, or about $26$ times a year, giving
      $800{,}000 \times 26 = 20{,}800{,}000$ drop-offs annually. A single
      shop handling about $40{,}000$ drop-offs a year serves that volume,
      so the centre is $20{,}800{,}000 / 40{,}000 = 520$ dry cleaners.
    interview: >
      "Walk me through how you get there" wants the decomposition spoken
      aloud, factor by factor, and the ability to revise a single link when
      challenged — not a number that arrived fully formed.
    pitfalls: >
      A gut-feel centre with no stated chain is unimprovable and gets
      exposed by the first follow-up question. Widening the spread to
      cover discomfort with the arithmetic, instead of just fixing the
      estimate, confuses the two separate decisions this technique keeps
      apart.
    recap: >
      Build the centre first, out loud, by decomposition or bracketed
      bounds — the width is a second, separate decision made only once the
      centre is fixed.
    dialogue:
      - part: A market with nothing under it
        teach: >
          "Make me a market on the number of hair salons in a city of $2$
          million people." A candidate answers at once: "$1500$ at $2500$,
          one." The interviewer says: "People get their hair cut more often
          than you think."
      - ask: >
          What can the candidate sensibly do with that remark?
        choices:
          - text: >
              Move the market up by a few hundred to reflect it.
            feedback: >
              By how much, and why that much? With no chain behind $2000$
              there is no factor for "more often" to change, so any move is a
              second guess stacked on the first.
          - text: >
              Hold the market; a remark is not a trade.
            feedback: >
              Holding against pressure is right when the remark carries no
              information. This one might: it is a claim about a real input.
              The trouble is that the candidate cannot tell, because there is
              no input to compare it with.
          - text: >
              Nothing principled: there is no reasoning for the remark to
              act on.
            correct: true
            feedback: >
              Right. A number that arrived whole can only be kept or thrown
              away. Either choice is a guess, and the interviewer has just
              watched you make it.
        feedback: >
          A quote with no stated centre is unimprovable: every follow-up
          question exposes it, and none of them can make it better.
      - reflect: >
          What should exist, and be said out loud, before any price is named,
          so that the interviewer's remark costs you one small revision
          instead of the whole answer?
        answer: >
          A centre built from parts: an explicit chain such as people, times
          haircuts per person per year, divided by haircuts a salon can
          handle. Said aloud, it gives the interviewer a specific link to
          challenge and gives you a specific link to revise. The remark about
          haircut frequency then changes one factor, and you recompute in a
          few seconds.
      - teach: >
          That is the technique: fair value before spread. Never quote before
          you have a number, and get the number by decomposing the unknown
          into factors you can anchor and multiplying them out — or, when
          nothing decomposes, by bracketing it between a bound you are sure is
          too low and one you are sure is too high, and averaging them in log
          space. Say the chain aloud. Only then choose a width.
      - ask: >
          Build it. Two million people, each with about $6$ haircuts a year;
          a salon handles about $5000$ haircuts a year. What centre does the
          chain give?
        expects: "2400"
        hint: >
          Haircuts the city needs in a year, divided by haircuts one salon
          supplies.
        feedback: >
          $2{,}000{,}000 \times 6 = 12{,}000{,}000$ haircuts a year, and
          $12{,}000{,}000 / 5000 = 2400$ salons.
      - ask: >
          The interviewer pushes on one link: "Six a year is high; plenty of
          people go two or three times." You revise the frequency to $4$ and
          keep the rest. New centre?
        expects: "1600"
        hint: >
          Only one factor changed. Redo one multiplication.
        feedback: >
          $2{,}000{,}000 \times 4 / 5000 = 1600$. The challenge cost one
          multiplication, and you can say exactly why the number moved.

      - part: The centre and the width are different decisions
        ask: >
          You go back to $6$ a year and a centre of $2400$, but you are not
          confident in that frequency: it could honestly be anywhere from $4$
          to $8$. What should that doubt change?
        choices:
          - text: >
              The centre: shade it down to $2000$ to be safe.
            feedback: >
              Safe from what? If $2400$ is your best estimate, a market centred
              on $2000$ is one you believe is too low, and an interviewer who
              agrees with your arithmetic will buy your offer all day.
          - text: >
              The width, and only the width.
            correct: true
            feedback: >
              Right. The centre comes from your best estimate; the width comes
              from how unsure you are of it. Doubt about a factor is
              information of the second kind.
          - text: >
              Neither: once the chain is stated, the number is the number.
            feedback: >
              A chain makes your number defensible, not certain. The honest
              range of the frequency has to show up somewhere in the quote, and
              the width is where it goes.
        feedback: >
          Two decisions, two sources of information. Mixing them — moving the
          centre because you feel shaky — muddies both.
      - ask: >
          With the frequency anywhere from $4$ to $8$ a year and the rest of
          the chain fixed, what is the high end of the salon count?
        expects: "3200"
        hint: >
          Rerun the chain at $8$.
        feedback: >
          $2{,}000{,}000 \times 8 / 5000 = 3200$. The chain itself turns
          your doubt about one factor into a range, $1600$ to $3200$, around
          the centre — exactly the raw material the width will be built from.

      - part: When nothing decomposes
        teach: >
          "Make me a market on the number of described species of beetle."
          There is no chain of everyday factors here. You are sure it is more
          than $10{,}000$ and sure it is less than $1{,}000{,}000$.
      - ask: >
          Averaging those bounds in log space, what centre do you get?
        expects: "100000"
        hint: >
          The geometric mean: the square root of the product.
        feedback: >
          $\sqrt{10^{4} \times 10^{6}} = \sqrt{10^{10}} = 10^{5} = 100{,}000$.
          It sits a factor of $10$ from each bound.
      - ask: >
          A candidate centres at the plain average, $505{,}000$, instead. What
          is wrong with that?
        choices:
          - text: >
              Nothing: the arithmetic mean of the bounds is the expectation.
            feedback: >
              It would be if every value between the bounds were equally
              likely. Your doubt here is about the order of magnitude — tens
              of thousands or hundreds of thousands — and on that scale
              $505{,}000$ is not the middle.
          - text: >
              It is within a factor of $2$ of the top bound and a factor of
              $50$ above the bottom one.
            correct: true
            feedback: >
              Right. The plain average quietly bets the answer is near the
              ceiling. The geometric mean is equally far, in ratio, from both
              bounds you were confident of.
          - text: >
              It is too precise; round it to $500{,}000$.
            feedback: >
              Rounding is fine and changes nothing. The problem is where the
              centre sits relative to your belief, not how many digits it has.
        feedback: >
          When your uncertainty is multiplicative, the middle is the
          geometric middle. Said aloud: "More than ten thousand, less than a
          million, so I centre around a hundred thousand" — and then, and only
          then, a width.

  - node: quant-games.market-making-game.width-uncertainty
    hook: >
      Your spread is the one part of the quote where the interviewer can
      grade your self-knowledge directly — quote it too tight and you've
      announced "I know more than I do," in public, in a way that gets
      tested immediately.
    explanation: >
      Treat the half-width as roughly one standard deviation of your belief
      about the truth — the same object a confidence interval is built
      from — which puts about $68\%$ of your belief inside the market: wide
      enough to be honest, narrow enough to still function as a real quote.
      A centre with, say, $25\%$ relative uncertainty needs a spread
      reflecting a full quarter of the centre on each side, not a token few
      percent shaved off for appearances.

      Width is not a confidence signal in the sense that tighter is always
      better — a wide market you can defend, and then tighten as real
      information arrives, beats a tight one that gets run over on the
      first trade. What is a genuine mistake is arbitrary width: a spread
      you can't trace back to a stated uncertainty is exactly as unmoored
      as a centre with no decomposition behind it.

      Tighten only when something actually changes your uncertainty — a
      resolved ambiguity, a trade you can update on, a hint volunteered
      mid-question. Tightening because the interviewer asks "are you sure,
      can you do better" with no new information attached is selling
      optionality for free, and a good interviewer collects on it every
      time.
    worked: >
      A dry-cleaner estimate centred at $520$, with roughly $30\%$ relative
      uncertainty typical of a multi-factor Fermi build, needs a half-width
      of $0.3 \times 520 = 156$. Bounds of $520-156=364$ and $520+156=676$,
      rounded to sensible ticks, give a quote of $360$ / $680$.
    interview: >
      "How wide should that be?" wants the one-standard-deviation reasoning
      stated as an actual number — a named relative uncertainty times the
      centre — not "however wide feels safe."
    pitfalls: >
      Setting width from nerve rather than a named uncertainty is the
      single most common failure. Treating "tighter" as automatically "more
      confident" rather than as a claim that has to be earned by new
      information is the other.
    recap: >
      Half-width tracks roughly one standard deviation of your actual
      belief — wide is honest, arbitrary is not, and tightening needs a
      reason.
    dialogue:
      - part: Same belief, two markets
        teach: >
          Two candidates price the number of trees in a city park. Both build
          the same centre, $800$, and both would describe their belief as
          roughly normal with a standard deviation of $200$. Candidate A
          quotes $780$ / $820$. Candidate B quotes $600$ / $1000$.
      - ask: >
          Under that belief, what is the probability that the truth lands
          outside A's market? Use $\Pr(|Z| \le 0.1) \approx 0.08$.
        expects: "0.92"
        tolerance: 0.01
        hint: >
          A's half-width is $20$. How many standard deviations is that?
        feedback: >
          The half-width $20$ is $20 / 200 = 0.1$ standard deviations, so the
          truth lands inside with probability about $0.08$ and outside with
          probability $1 - 0.08 = 0.92$.
      - ask: >
          And outside B's market? Use $\Pr(|Z| \le 1) \approx 0.68$.
        expects: "0.32"
        tolerance: 0.01
        hint: >
          B's half-width is $200$.
        feedback: >
          $200 / 200 = 1$ standard deviation, so the truth is outside with
          probability $1 - 0.68 = 0.32$.
      - ask: >
          The interviewer knows the truth. What does A's market tell him?
        choices:
          - text: >
              That A is the stronger estimator, since A commits to a narrower
              range.
            feedback: >
              A and B hold the same belief. A's narrow market is not more
              knowledge; it is a claim to knowledge A does not have, and the
              truth falls outside it $92\%$ of the time.
          - text: >
              That A knows the count to within about $20$ trees, which A's own
              belief does not support.
            correct: true
            feedback: >
              Right. The width is a public statement about your uncertainty,
              and A's statement is false by a factor of ten. A counterparty
              who knows the truth trades against it on almost every round.
          - text: >
              Nothing: the width is a matter of style, and only the centre
              is graded.
            feedback: >
              The width is the part he grades most directly. With the same
              centre, A and B face a $92\%$ against a $32\%$ chance of being
              picked off on any given round.
        feedback: >
          Same centre, same belief, and the only difference is how honestly
          each width reports it.
      - reflect: >
          If the width is to be a statement you can defend rather than a
          mood, what should you read it off — and roughly how big should it
          be?
        hint: >
          B's market had something A's did not: a reason for its exact size.
        answer: >
          Read it off the spread of your own belief. Setting the half-width
          near one standard deviation makes the market contain the truth about
          two times in three, and it means you can name what the width
          encodes: "I think I'm good to about $200$." A width chosen by nerve,
          tight to look sharp or wide to feel safe, has no such sentence
          behind it.
      - teach: >
          That is width from uncertainty. Set the half-width near one standard
          deviation of your belief about $T$, which puts roughly a $68\%$
          chance of the truth inside your market. Wide is not weak: a wide
          market you can defend and then tighten beats a tight one you get run
          over in. Arbitrary width is weak, in either direction: be able to
          name the uncertainty the spread encodes.

      - part: Reading the width off a Fermi estimate
        ask: >
          A new estimate: centre $800$, and you judge one standard deviation
          of your belief to be about $30\%$ of it. What bid do you show?
        expects: "560"
        hint: >
          The half-width is $30\%$ of $800$.
        feedback: >
          $0.3 \times 800 = 240$, so the market is $800 - 240 = 560$ at
          $800 + 240 = 1040$.
      - ask: >
          Another centre of $800$ came out of a long Fermi chain, and you
          think it could be off by a factor of $2$ either way. Which market
          is honest?
        choices:
          - text: >
              $700$ / $900$
            feedback: >
              That is $\pm 12.5\%$. A factor of two is a $100\%$ miss on the
              high side and a $50\%$ miss on the low side; this market claims
              ten times more precision than you have.
          - text: >
              $400$ / $1200$
            feedback: >
              Symmetric in units, not in ratio: it reaches a factor of $2$
              below the centre but only a factor of $1.5$ above it. A truth of
              $1500$ is inside your belief and outside this market.
          - text: >
              $400$ / $1600$
            correct: true
            feedback: >
              Right. A factor of two each way is $800 / 2$ to $800 \times 2$.
              The market is lopsided in units because the error is
              multiplicative: the same ratio up and down.
        feedback: >
          Errors on a chain of multiplied factors are multiplicative, so the
          honest market is wide by a ratio. Its centre, $800$, is the geometric
          middle of $400$ and $1600$.

      - part: When the width is allowed to shrink
        ask: >
          You show $560$ / $1040$. The interviewer frowns: "That's very wide.
          Can you tighten it?" He offers nothing else. What do you do?
        choices:
          - text: >
              Tighten to $700$ / $900$ to show conviction.
            feedback: >
              Nothing you know changed between the two quotes. Tightening on
              request gives him a narrower, cheaper target for free; that is
              selling him an option and charging nothing.
          - text: >
              Hold $560$ / $1040$ and say what it encodes.
            correct: true
            feedback: >
              Right. "I'm good to about a third either way, so that's my
              market" answers the question and keeps the claim honest. A
              request carries no information about the trees.
          - text: >
              Widen, since the question suggests the market is wrong.
            feedback: >
              The question carries no information in either direction. If it
              justified widening, an equally insistent question could justify
              anything.
        feedback: >
          Pressure is not information. Hold a width you can name.
      - ask: >
          Which of these is a reason to tighten?
        choices:
          - text: >
              He tells you the park covers $40$ hectares, which you had been
              guessing at.
            correct: true
            feedback: >
              Right. A factor you were unsure of is now fixed, so your belief
              really is narrower and the width can follow it.
          - text: >
              He asks "are you sure?" a second time.
            feedback: >
              Asking twice carries no more information than asking once.
          - text: >
              You have been quoting for two minutes and want to look decisive.
            feedback: >
              That is nerve, and nerve is exactly what the width is not supposed
              to be read from.
        feedback: >
          Tighten on a resolved ambiguity, a trade, or a hint. Never on a mood.
      - ask: >
          With the park's area known, you rebuild: $40$ hectares at about $25$
          trees a hectare, and you now judge one standard deviation at $15\%$.
          What is the full width of your new market, bid to ask?
        expects: "300"
        hint: >
          New centre first, then $15\%$ of it on each side.
        feedback: >
          The centre is $40 \times 25 = 1000$ and the half-width
          $0.15 \times 1000 = 150$, so the market is $850$ / $1150$, a full
          width of $300$. Information moved the centre and narrowed the width,
          and each move has a reason you can say aloud.

  - node: quant-games.market-making-game.quote-hygiene
    hook: >
      These are the cheapest points in the whole game and the ones most
      often given away — a crossed market or a flinch at "are you sure?"
      reads as "doesn't actually trade," no matter how good the centre
      underneath it was.
    explanation: >
      Keep the bid strictly below the ask, state the quote bid-then-ask
      with size attached in one breath — "$360$ at $680$, one" — and round
      to sensible ticks. A quote like $364.2$ at $675.8$ claims a precision
      your Fermi estimate never had, and it slows down the one part of the
      exercise that should be instant.

      Answer within a few seconds. A long silence after "make me a market"
      is itself a signal of how confident you actually are, independent of
      the number you eventually give.

      Once quoted, hold it. "Are you sure?" carries no information about
      the truth — it's a test of nerve, not a hint — so moving the price in
      response teaches the interviewer that pressure works on you, and
      invites more of it. If you want to trade a smaller size than your
      first instinct, say so the moment you quote, never after being hit;
      changing size after the fact is the same flinch as changing price.
    worked: >
      A dry-cleaner market centred at $520$ with a half-spread of $156$
      gives bounds of $364$ and $676$. Quoted as "$676$ at $364$, one," the
      market is crossed — bid above ask — and hands over free money.
      Corrected and rounded, "$360$ at $680$, one" is the right quote. When
      the interviewer follows with "are you sure you don't want to tighten
      that up?", the answer is to hold $360$ / $680$, not to move it.
    interview: >
      "Are you sure?" is a scripted pressure test, not new information. The
      interviewer is watching for bid below ask, size stated up front, and
      a quote delivered without a long pause.
    pitfalls: >
      A crossed market — bid above ask — hands over free money outright.
      False precision signals a confidence you don't have. Moving price or
      size after being questioned or hit is a visible flinch.
    recap: >
      Bid below ask, size stated at the moment you quote, sensible ticks,
      and no movement in response to a question that carries no new
      information.
    dialogue:
      - part: One careless re-quote
        teach: >
          You are making a market on the number of bridges in a canal city.
          Round 1 you show "$380$ at $440$, one" and he passes. You decide
          your centre was low, start the new quote with a higher bid, and out
          of habit finish it the old way: "$460$ at $440$, one."
      - ask: >
          What can he do with that quote?
        choices:
          - text: >
              Nothing: a bid above the ask is not a valid market, so it does
              not count.
            feedback: >
              You said it, and he may hold you to it. A quote is honoured as
              spoken, mistakes included.
          - text: >
              Pick one side, as usual, and trade it.
            feedback: >
              He can, but why stop there? Both prices are live at the same
              moment, and here both are worth taking.
          - text: >
              Sell you one at $460$ and buy one from you at $440$, both at
              once.
            correct: true
            feedback: >
              Right. With the bid above the ask he can do both sides, and he
              will.
        feedback: >
          A crossed market — bid above ask — lets him trade against both
          prices together.
      - ask: >
          After both trades, how much has he made off you, whatever the number
          of bridges turns out to be?
        expects: "20"
        hint: >
          Score your two fills against an unknown $T$ and add them.
        feedback: >
          You bought at $460$, scoring $T - 460$, and sold at $440$, scoring
          $440 - T$. The sum is $-20$ for every $T$. A crossed market is the
          one quote that loses no matter what the truth is, and it usually
          ends the interview.

      - part: Saying it like a trader
        ask: >
          Your new centre is $470$ and your half-width about $60$. Which
          delivery is the clean one?
        choices:
          - text: >
              "$407.5$ at $532.5$, one."
            feedback: >
              Decimals on a quantity you know to about $\pm 60$ claim a
              precision you do not have, and they take longer to say.
          - text: >
              "Somewhere around $410$ to $530$."
            feedback: >
              No size and no commitment: it describes a range rather than
              offering two prices. He cannot trade on it.
          - text: >
              "$410$ at $530$, one."
            correct: true
            feedback: >
              Bid first, then ask, then size, in one breath. Nothing in it
              needs a follow-up question.
          - text: >
              "$530$ at $410$, one."
            feedback: >
              Right numbers in the wrong order. Bid comes first, so this says
              you buy at $530$ and sell at $410$ — crossed, as in round 2.
        feedback: >
          The standard order is bid, ask, size. A fixed order is also what
          catches a crossed quote before you say it.
      - ask: >
          With a half-width near $60$, what tick should your prices land on?
        choices:
          - text: >
              Tenths, so nothing is lost to rounding.
            feedback: >
              Rounding to $10$ moves a price by at most $5$, a twelfth of your
              uncertainty. Tenths pretend you can see detail your estimate
              does not contain.
          - text: >
              Tens.
            correct: true
            feedback: >
              Right. A tick small next to the half-width, and coarse enough
              that the quote says nothing you do not mean.
          - text: >
              Hundreds, to show you are not pretending to precision.
            feedback: >
              Rounding to $100$ could move a price by $50$, nearly your whole
              half-width. $400$ at $500$ would be a different market from the
              one you priced.
        feedback: >
          Pick a tick that is small next to the width: fine enough to keep
          the market you meant, coarse enough not to fake precision.
      - ask: >
          You have the centre and width worked out but take twenty seconds of
          silence before saying them. What has the silence told him?
        choices:
          - text: >
              Nothing; only the prices are graded.
            feedback: >
              He is reading everything, including how long it took. Twenty
              seconds after the work was done reads as doubt about it.
          - text: >
              That you are unsure of your own numbers.
            correct: true
            feedback: >
              Right. Hesitation is a signal about your confidence, and he can
              act on it, by pressing you or by trading.
          - text: >
              That you are careful, which counts in your favour.
            feedback: >
              Care belongs in building the estimate, out loud. Once it is
              built, the quote should come in a few seconds.
        feedback: >
          Do the thinking aloud, then deliver the quote promptly.

      - part: Holding the quote
        ask: >
          You say "$410$ at $530$, one." He lifts the $530$, and you add:
          "I meant a half." How does that land?
        choices:
          - text: >
              Fine: size is a detail, and you corrected it quickly.
            feedback: >
              Size is part of the price. Changing it once you know his side
              is the same as changing the price after the trade.
          - text: >
              As a flinch: the time to choose a smaller size was when you
              quoted.
            correct: true
            feedback: >
              Right. "$410$ at $530$, a half" would have been a perfectly good
              quote. Said after the lift, it reads as backing out.
          - text: >
              Fine, as long as you keep the price at $530$.
            feedback: >
              Keeping the price while halving the size still halves what he
              gets on a trade you had already agreed.
        feedback: >
          Size goes in the quote, before he chooses, never after.
      - reflect: >
          Before he trades again he leans in: "Are you sure about that?"
          Before you answer, say what that question tells you about the
          number of bridges, and what moving your price in response would
          teach him.
        answer: >
          Nothing about the bridges: he would ask the same question whether
          the truth were $200$ or $900$, so it is evidence of nothing. Moving
          the price would teach him that pressure works on you, and he would
          use it again to push you into a tighter or worse-placed market and
          then trade against it. The answer is to hold and, if asked, say what
          the width encodes.
      - teach: >
          Those are the quoting mechanics. Keep $b < a$. Say bid, ask, size, in
          that order and in one breath. Round to a tick small next to your
          width. Answer within a few seconds. Once quoted, honour it: do not
          move on a question, and if you want to trade smaller, say so in the
          quote, never after you have been hit.
      - ask: >
          Which of these changes to your prices is legitimate?
        choices:
          - text: >
              After he lifts $530$, quoting higher for the next round.
            correct: true
            feedback: >
              Right. A trade is information, and re-quoting between rounds is
              part of the game. You honoured the old quote; the new one is
              built on what the trade told you.
          - text: >
              After "are you sure?", tightening to $430$ / $510$.
            feedback: >
              A question is not information. This is the flinch the question
              exists to provoke.
          - text: >
              After he lifts $530$, saying the offer was really $550$.
            feedback: >
              That rewrites a quote he has already traded on. The old price is
              honoured as said; only the next quote can change.
        feedback: >
          Re-quote on trades, between rounds. Never on pressure, and never
          retroactively.

  - node: quant-games.market-making-game.mark-to-truth
    hook: >
      This is the arithmetic underneath every score you'll get, and it says
      something non-obvious: a fair value that's genuinely wrong can still
      earn you money, as long as whoever trades against you isn't choosing
      sides on purpose.
    explanation: >
      Write $V$ for your fair value and $s$ for your half-spread, so your
      quote is $V-s$ / $V+s$. Once the truth $T$ is known, selling a unit
      at the ask marks to $(V+s)-T$, which rearranges to $s-(T-V)$; buying a
      unit at the bid marks to $T-(V-s)$, which rearranges to $s+(T-V)$.
      Both fills reduce to the same shape: the half-spread you captured,
      adjusted by your mis-estimate $T-V$, with the sign of that adjustment
      flipping depending on which side got traded.

      If the counterparty's choice of side has nothing to do with the sign
      of $T-V$ — a coin flip, unrelated to your accuracy — the two signed
      adjustments cancel across many fills, and your expected score
      converges to exactly $s$ per trade, however badly $V$ missed. The
      entire economics of the game reduces to one question: is the side
      traded correlated with your error?

      When it is — when the counterparty only trades the side that's
      actually bad for you — no amount of averaging saves you; that
      correlation between the side traded and the sign of your error is
      adverse selection by name. When it isn't, the half-spread is yours,
      mis-estimate and all.
    worked: >
      $V=50$, $s=5$, quote $45$ / $55$. Truth turns out to be $58$, and the
      interviewer's side is a coin flip unrelated to it. Half the time he
      buys at $55$: score $= s-(T-V) = 5-8 = -3$. Half the time he sells to
      you at $45$: score $= s+(T-V) = 5+8 = 13$. Averaged over the coin
      flip, $0.5(-3)+0.5(13) = 5 = s$ exactly — despite $V$ missing the
      truth by $8$, uninformed flow still nets exactly the half-spread.
    interview: >
      "How do you actually make money on this?" wants this derivation
      ending in "half-spread minus selection," not a vague appeal to "the
      spread is my edge."
    pitfalls: >
      Assuming a wider spread always raises expected profit ignores that it
      only helps against uninformed flow. Forgetting that the sign of
      $T-V$ flips between a buy fill and a sell fill breaks the arithmetic.
    recap: >
      Every fill nets the half-spread minus your mis-estimate signed by the
      side traded — uninformed flow earns exactly $s$ regardless of how
      wrong $V$ was.
    dialogue:
      - part: Score both sides of one quote
        teach: >
          You make a market on the number of cars crossing a toll bridge in
          an hour. Your centre is $600$ and you quote $560$ / $640$, one. The
          truth, which you do not know yet, is $700$: you are $100$ low.
      - ask: >
          If he buys from you, what does the fill score?
        expects: "-60"
        hint: >
          He takes your ask. A unit sold at $a$ scores $a - T$.
        feedback: >
          $a - T = 640 - 700 = -60$. You sold below the truth.
      - ask: >
          If he sells to you instead, what does the fill score?
        expects: "140"
        hint: >
          He hits your bid. A unit bought at $b$ scores $T - b$.
        feedback: >
          $T - b = 700 - 560 = 140$. Being $100$ low hurts on one side and
          helps on the other.
      - ask: >
          Suppose he picked his side by tossing a coin before you had even
          quoted. What is your expected score on the trade?
        expects: "40"
        hint: >
          Average the two fills you just scored.
        feedback: >
          $\frac{1}{2}(-60) + \frac{1}{2}(140) = 40$ — exactly your
          half-spread, although your centre missed by $100$.
      - ask: >
          Now suppose the truth had been $450$, so your centre is $150$ too
          high, and he still tosses a coin. Before computing, what do you
          expect?
        choices:
          - text: >
              Much worse than $40$: the miss is bigger.
            feedback: >
              Compute it: lifted, $640 - 450 = 190$; hit, $450 - 560 = -110$.
              The average is $\frac{1}{2}(190) + \frac{1}{2}(-110) = 40$. The
              bigger miss made one side worse and the other better by the same
              amount.
          - text: >
              Exactly $40$ again.
            correct: true
            feedback: >
              Right: $\frac{1}{2}(640 - 450) + \frac{1}{2}(450 - 560) =
              \frac{1}{2}(190) + \frac{1}{2}(-110) = 40$.
          - text: >
              Better than $40$, since this time the error is on the other side.
            feedback: >
              Which side the error is on does not matter to a coin. The good
              fill is now the sale and the bad one the purchase; the average
              is still $\frac{1}{2}(190) + \frac{1}{2}(-110) = 40$.
        feedback: >
          Two different misses, the same expected score. Something in the
          arithmetic is cancelling.
      - reflect: >
          A miss of $100$ and a miss of $150$ both averaged to $40$ against
          the coin. What exactly cancels, and where does the $40$ come from?
        hint: >
          Write each fill as the half-spread plus or minus something.
        answer: >
          Each fill is the half-spread, $40$, adjusted by your error $T - V$:
          a sale gives up the error, a purchase collects it. The two sides
          carry the error with opposite signs, and a coin weights them
          equally, so the error drops out and only the half-spread is left.
          What survives is $s$; what cancels is your mistake.

      - part: Half-spread minus selection
        ask: >
          The load-bearing step is one substitution. A sale scores $a - T$;
          put $a = V + s$. What do you get?
        choices:
          - text: >
              $s + (T - V)$
            feedback: >
              That is the purchase. $V + s - T$ has $T$ with a minus sign, so
              the error $T - V$ enters subtracted: when the truth is above your
              centre, selling hurts.
          - text: >
              $s - (T - V)$
            correct: true
            feedback: >
              Right: $V + s - T = s - (T - V)$. The purchase is
              $T - (V - s) = s + (T - V)$, and the two differ only in the sign
              of the error.
          - text: >
              $(T - V) - s$
            feedback: >
              That has both signs flipped: it says a sale earns your error and
              pays the spread. Check it at $T = V$: a sale at $V + s$ must earn
              $+s$, not $-s$.
        feedback: >
          The sign of the error flips with the side; the spread does not.
      - teach: >
          That is the P&L decomposition. With fair value $V$ and half-spread
          $s$, a sale at $V + s$ scores $s - (T - V)$ and a purchase at
          $V - s$ scores $s + (T - V)$: every fill is the half-spread you
          captured, minus your error signed by the side traded. Against a
          coin, the signed errors cancel and your expected score is exactly
          $s$, however badly $V$ misses.
      - ask: >
          For the cancellation to work, what must his choice of side be
          independent of?
        choices:
          - text: >
              The width of your quote.
            feedback: >
              The width is $s$, and it survives either way. What has to be
              unrelated to his choice is the term that cancels, $T - V$.
          - text: >
              Whether the truth is above or below your centre.
            correct: true
            feedback: >
              Right. If he buys more often exactly when $T > V$, the
              $-(T - V)$ on the sale is weighted up when it is most negative,
              and the cancellation fails.
          - text: >
              Nothing: any rule for picking a side averages to $s$.
            feedback: >
              The rule "buy when the truth is above my ask" picks precisely
              the losing side for you every time. The rule matters; what
              matters about it is whether it knows $T$.
        feedback: >
          Independence from the sign of your error is the whole hypothesis.
          Every loss in this game comes from one place: correlation between
          the side he picks and the sign of $T - V$.

      - part: When the counterparty knows
        ask: >
          Back to $560$ / $640$ with the truth $700$. The interviewer knows
          the truth and picks whichever side pays him. What do you score?
        expects: "-60"
        hint: >
          Which side pays him when the truth is $700$?
        feedback: >
          He buys at $640$, and you score $s - (T - V) = 40 - 100 = -60$. The
          coin would have averaged in the $140$; he never lets you have it.
      - ask: >
          A candidate reasons: "Since flow pays me $s$ whatever my error, the
          accuracy of my centre does not matter." What is wrong?
        choices:
          - text: >
              Nothing; the decomposition shows exactly that.
            feedback: >
              It shows it for flow that ignores $T$. The interviewer knows $T$,
              and against him the full error is charged on the side he picks:
              $-60$ just now.
          - text: >
              The decomposition assumes your quote is symmetric about $V$.
            feedback: >
              Any quote is symmetric about its own midpoint, so call that $V$
              and the algebra goes through. That is not where the argument
              fails.
          - text: >
              Accuracy stops mattering only against flow that ignores $T$; an
              informed counterparty charges every unit of error.
            correct: true
            feedback: >
              Right. Uninformed flow pays the spread; informed flow collects
              the error. Your accuracy decides how much there is to collect.
        feedback: >
          Half-spread minus selection: the first term is yours, the second is
          set by how much he knows and how wrong you are.
      - ask: >
          Same truth of $700$, same informed counterparty, but you had quoted
          $480$ / $720$ — a half-spread of $120$ around the same centre. What
          do you score?
        expects: "0"
        hint: >
          Is either side profitable for him?
        feedback: >
          Buying at $720$ loses him $20$ and selling at $480$ loses him
          $220$, so he passes and you score $0$. With the truth inside the
          market, an informed counterparty has nothing to select. How much
          width buys that protection, against a mix of informed and
          uninformed flow, is the next question.

  - node: quant-games.market-making-game.adverse-selection
    hook: >
      A perfectly centred market can still lose money on every single fill
      it attracts — this is why, and it's the entire reason a spread
      exists.
    explanation: >
      A live two-sided quote is a pair of free options handed to whoever's
      on the other side: your bid is a put they can exercise by selling to
      you at $b$, your ask a call they can exercise by buying from you at
      $a$, both live at once, paid for by no one up front except you, via
      the spread you collect if they go unused.

      A counterparty who knows more about $T$ than your quote reflects
      exercises exactly the profitable option and lets the other expire —
      buys from you when $T$ exceeds $a$, sells to you when $T$ is below
      $b$, passes otherwise. Because of that filter, the fills you actually
      receive are not a representative sample of $T$: they're the specific
      slice where trading against you was worth it, so
      $\mathbb{E}[T \mid \text{lifted}]$ sits above the unconditional mean
      and $\mathbb{E}[T \mid \text{hit}]$ sits below it.

      Adverse selection is that gap between the conditional and
      unconditional expectation, and it's why being traded with is itself
      bad news about $T$ before you even see the number. The spread exists
      to be paid, in advance, for exactly this: quote too tight against
      genuinely informed flow and a market centred exactly right on average
      still loses on every fill it gets.
    worked: >
      $T$ is uniform on $[0,100]$, quote $40$ / $60$ — centred exactly on
      the true mean of $50$. A fully informed counterparty trades whenever
      profitable: lifts when $T>60$, hits when $T<40$. Conditional on a
      lift, $\mathbb{E}[T \mid T>60] = (60+100)/2 = 80$, so that fill marks
      to $60-80=-20$. Conditional on a hit, $\mathbb{E}[T \mid T<40] =
      (0+40)/2 = 20$, so that fill marks to $20-40=-20$ too. Every fill
      this market actually gets, despite being dead-on-average, marks to
      $-20$.
    interview: >
      "If your fair value is right on average, why would you ever lose
      money?" wants the free-option framing and the biased-sample answer —
      not "I wouldn't."
    pitfalls: >
      Assuming a correctly centred market can't lose is the core error
      adverse selection exists to correct. Treating "tight" and
      "well-quoted" as synonyms ignores that tight quotes are exactly what
      informed flow is most eager to trade against.
    recap: >
      Your quote is a pair of free options that a better-informed
      counterparty exercises selectively, so the fills you get are a biased
      sample of the truth even when your centre is exactly right.
    dialogue:
      - part: Centred exactly, and still losing
        teach: >
          A sealed envelope holds $10$, $50$ or $90$: $50$ with probability
          $\frac{1}{2}$, the other two with probability $\frac{1}{4}$ each, so
          its mean is $50$. You quote $45$ / $55$, one, centred exactly on that
          mean. The interviewer has looked inside, and he trades only when it
          pays him.
      - ask: >
          What is your expected score per round?
        expects: "-17.5"
        hint: >
          Go envelope by envelope: what does he do at $10$, at $50$, at $90$?
        feedback: >
          At $90$ he buys at $55$: you score $55 - 90 = -35$. At $10$ he sells
          at $45$: you score $10 - 45 = -35$. At $50$ neither side pays him, so
          he passes. Expected score $\frac{1}{4}(-35) + \frac{1}{2}(0) +
          \frac{1}{4}(-35) = -17.5$.
      - ask: >
          He has just bought from you. Given that, what is the expected value
          of the envelope?
        expects: "90"
        hint: >
          Which contents make buying at $55$ worth his while?
        feedback: >
          He only buys when the envelope holds $90$, so the expected contents
          given a lift are $90$, not $50$. The trade itself told you the
          answer.
      - ask: >
          Your centre was the true mean. Why are you losing?
        choices:
          - text: >
              The centre was wrong after all.
            feedback: >
              $50$ is the mean of the envelope, and no better centre exists
              before you see a trade. Move the centre and keep the width, and
              you still lose against him; only the amount changes.
          - text: >
              Bad luck; it averages out over many rounds.
            feedback: >
              Every fill you get scores $-35$. There is nothing to average
              against: the rounds where you would have done well are the
              rounds he passes.
          - text: >
              The only trades you get are the ones you did not want.
            correct: true
            feedback: >
              Right. He takes your offer exactly when the offer is too cheap
              and your bid exactly when it is too dear. Your fills are not a
              fair sample of the envelope.
        feedback: >
          Accuracy on average does not protect you from someone who chooses
          which rounds to trade.

      - part: Which fills are bad news
        teach: >
          Same envelope, same $45$ / $55$, three counterparties. Ana tosses a
          coin to choose a side. Ben always buys, whatever is inside. Cleo has
          looked, as before.
      - ask: >
          Whose purchase from you is evidence that the envelope is above
          $50$?
        choices:
          - text: >
              All three: any purchase means someone wanted it.
            feedback: >
              Ben buys on every round, including the ones holding $10$. His
              purchase happens whatever is inside, so it tells you nothing
              about what is inside.
          - text: >
              Ana's, since she chose to buy.
            feedback: >
              She chose with a coin. Her purchase is as likely with $10$
              inside as with $90$.
          - text: >
              Only Cleo's.
            correct: true
            feedback: >
              Right. Only Cleo's choice depends on the contents, so only her
              purchase moves the expected contents, all the way to $90$.
        feedback: >
          A trade is bad news exactly when the side chosen depends on the
          truth.
      - ask: >
          What is your expected score per round against Ben?
        expects: "5"
        hint: >
          You sell to him at $55$ every round, whatever the envelope holds.
        feedback: >
          $55 - \mathbb{E}[T] = 55 - 50 = 5$, your half-spread. Against flow
          that ignores the truth you earn the spread; against Cleo the same
          quote averages $-17.5$.
      - reflect: >
          Cleo's trades hurt and Ben's and Ana's did not. Say exactly what you
          were checking about each counterparty — in terms of the expected
          value of the envelope.
        answer: >
          Whether the expected contents, given that he or she traded a side,
          differ from the expected contents overall. For Ana and Ben,
          $\mathbb{E}[T \mid \text{lifted}] = \mathbb{E}[T] = 50$, so a lift is
          no news. For Cleo, $\mathbb{E}[T \mid \text{lifted}] = 90 > 50$: the
          lift itself is evidence the truth sits above your offer. That gap
          between the conditional and the unconditional mean is what costs you.
      - teach: >
          That gap is adverse selection. A two-sided quote hands the
          counterparty two free options, one on each side, both live at once
          and neither paid for. A better-informed counterparty exercises
          exactly the profitable one, so your fills are
          a biased sample: $\mathbb{E}[T \mid \text{lifted}] > \mathbb{E}[T]$
          and $\mathbb{E}[T \mid \text{hit}] < \mathbb{E}[T]$. Being traded
          with is itself evidence against you, and the spread is the premium
          you charge in advance to cover it.

      - part: A new counterparty, clause by clause
        ask: >
          From the counterparty's side, what is your offer at $55$?
        choices:
          - text: >
              A put struck at $55$.
            feedback: >
              A put is the right to *sell*. Your offer gives him the right to
              buy from you at $55$. The right to sell is what your bid gives him.
          - text: >
              A call struck at $55$.
            correct: true
            feedback: >
              Right. He may buy at $55$ and will do so exactly when the
              envelope is worth more. You were paid nothing up front for
              writing it, except the spread you hope to collect.
          - text: >
              Not an option at all, since you can re-quote next round.
            feedback: >
              Re-quoting changes the next option, not this one. While the quote
              stands, he holds the right without the obligation.
        feedback: >
          Two options, written for free, exercised only when they are in the
          money for him.
      - ask: >
          Dev has looked inside too, but he can only buy, never sell. He buys
          when buying pays and otherwise passes. Your expected score per round
          against Dev?
        expects: "-8.75"
        hint: >
          Only the envelope holding $90$ produces a trade.
        feedback: >
          He buys only at $90$, scoring you $55 - 90 = -35$ with probability
          $\frac{1}{4}$: $\frac{1}{4}(-35) = -8.75$. Half Cleo's damage,
          because only one of your two options is exposed to him.
      - ask: >
          Eli has looked inside, but his desk tells him to buy one every round
          regardless. Is Eli's purchase bad news about the envelope?
        choices:
          - text: >
              Yes: he knows the contents, so his trades are informed.
            feedback: >
              Knowing is not enough. He buys at $10$, at $50$ and at $90$
              alike, so $\mathbb{E}[T \mid \text{Eli buys}] = 50$ and you earn
              $55 - 50 = 5$, exactly as against Ben.
          - text: >
              No: his choice does not depend on what he knows.
            correct: true
            feedback: >
              Right. Adverse selection needs both halves — knowledge and a
              choice of side that uses it. Eli has the first without the
              second.
          - text: >
              Only on the rounds when the envelope holds $90$.
            feedback: >
              You cannot tell those rounds apart: he buys on every round, so
              a purchase looks the same whatever is inside.
        feedback: >
          What hurts is not who knows the truth but whether the side you get
          depends on it.

  - node: quant-games.market-making-game.spread-compensation
    hook: >
      This turns "how wide is wide enough" into an actual number instead of
      a feeling — the minimum half-spread that survives however much of
      your flow is genuinely informed.
    explanation: >
      Model the counterparty as a mixture: with probability $\alpha$
      they're informed and take an average $\delta$ of value from you when
      they trade; with probability $1-\alpha$ they trade for reasons
      unrelated to $T$. An uninformed fill nets the full half-spread $s$;
      an informed fill nets $s-\delta$. Averaging over the mixture,
      expected profit per trade is $(1-\alpha)s + \alpha(s-\delta) =
      s-\alpha\delta$.

      Breaking even needs $s \ge \alpha\delta$ — the minimum viable
      half-spread is the chance a counterparty is informed times what they
      take when they are, with nothing about your own confidence in $V$
      entering the formula at all. Two readings follow directly: your
      spread is set by the counterparty's information, not your own
      certainty, so two people with identical fair values should quote
      different widths if they face different flow; and as $\alpha$
      approaches $1$, no finite spread survives — the actual reason desks
      pull quotes entirely ahead of a scheduled announcement, rather than
      merely widening them.
    worked: >
      $\alpha=0.2$, $\delta=25$. Break-even half-spread is $s \ge 0.2
      \times 25 = 5$. Quoting exactly $s=5$ nets zero expected profit per
      trade; quoting $s=8$ nets $8-5=3$ expected profit per trade instead.
    interview: >
      "One in five people you quote actually know something and take $25$
      off you when they do — what's the least you can quote?" wants
      $\alpha\delta$ computed on the spot.
    pitfalls: >
      Setting the minimum spread to $\delta$ alone, instead of
      $\alpha\delta$, wildly over-widens by ignoring that $\delta$ is only
      realized on the informed fraction of fills. Treating $\alpha$ as a
      property of the market in general rather than of your own realistic
      flow is the other.
    recap: >
      Break-even half-spread is $\alpha\delta$ — the chance of informed
      flow times what it costs you — and no finite spread survives once
      $\alpha$ reaches $1$.
    dialogue:
      - part: Mixed flow at a half-spread of six
        teach: >
          You quote a half-spread of $6$ around your centre. Of the people
          trading with you, $3$ in $10$ have seen the answer, and when one of
          them trades he takes $30$ of value from you on average. The other
          $7$ in $10$ trade for reasons that have nothing to do with the
          quantity.
      - ask: >
          What does a fill against one of the informed traders score, on
          average?
        expects: "-24"
        hint: >
          You still collect the half-spread; then he takes his $30$.
        feedback: >
          $s - \delta = 6 - 30 = -24$. An uninformed fill, by contrast, scores
          the full half-spread, $6$.
      - ask: >
          What is your expected profit per trade?
        expects: "-3"
        hint: >
          Weight the uninformed fill and the informed fill by how often each
          happens.
        feedback: >
          $0.7(6) + 0.3(-24) = 4.2 - 7.2 = -3$. The uninformed seven pay you
          $4.2$, and the informed three take $7.2$.
      - ask: >
          You widen to a half-spread of $10$, and the flow stays the same.
          Expected profit per trade now?
        expects: "1"
        hint: >
          An uninformed fill now scores $10$ and an informed one
          $10 - 30$.
        feedback: >
          $0.7(10) + 0.3(10 - 30) = 7 - 6 = 1$. Widening by $4$ raised your
          expected profit by exactly $4$.
      - reflect: >
          Four more of half-spread bought exactly four more of expected profit.
          Write the expected profit as a function of the half-spread, and say
          which half-spread breaks even.
        hint: >
          Which fills pay you $s$, and which fills cost you the $30$?
        answer: >
          Every fill, informed or not, pays you the half-spread, so $s$
          arrives in full. The $30$ is lost only on the informed $30\%$ of
          fills, so it costs $0.3 \times 30 = 9$ per trade on average. Expected
          profit is $s - 9$, and you break even at a half-spread of $9$.
      - teach: >
          In general: with probability $\alpha$ the counterparty is informed
          and takes $\delta$ on average; otherwise he trades for reasons
          unrelated to $T$. Expected profit per trade is
          $(1 - \alpha)s + \alpha(s - \delta) = s - \alpha\delta$, so breaking
          even needs $s \ge \alpha\delta$. That is the spread that survives
          informed flow: the chance the counterparty is informed, times what
          he takes when he is.

      - part: Whose information sets the width
        ask: >
          A candidate says: "I'm very sure of my centre, so my break-even
          spread must be small." What does $s \ge \alpha\delta$ say?
        choices:
          - text: >
              He is right: confidence lowers the break-even spread directly.
            feedback: >
              Look at the formula: $\alpha$ is how often your counterparty is
              informed, $\delta$ what he takes. Your own confidence is in
              neither. It helps only if you really are accurate, which shrinks
              what the informed can take.
          - text: >
              The break-even spread depends on who is trading with you, not on
              how sure you feel.
            correct: true
            feedback: >
              Right. Two candidates with the same centre and the same
              certainty need different widths if they face different flow.
          - text: >
              The break-even spread is always zero for a correctly centred
              market.
            feedback: >
              A correctly centred market still loses to adverse selection on
              every informed fill. The informed take $\delta$ whatever the
              centre's average accuracy.
        feedback: >
          Feeling sure is not information about the counterparty. The width
          answers "how much do the people trading with me know?"
      - ask: >
          Another candidate faces your flow — $3$ in $10$ informed, $\delta =
          30$ — and sets his half-spread to $30$ "so the informed cannot
          hurt me". What is wrong with his reasoning?
        choices:
          - text: >
              He has forgotten that the $30$ is lost on only $3$ fills in $10$.
            correct: true
            feedback: >
              Right. The half-spread is collected on every fill, the $30$ only
              on the informed ones, so the cost to cover is
              $0.3 \times 30 = 9$, not $30$. He is over-wide by a factor of
              more than three.
          - text: >
              Nothing: matching $\delta$ is the conservative choice.
            feedback: >
              Conservative and wrong. At $s = 30$ he is charging every
              uninformed customer for a loss that only $30\%$ of fills cause;
              in any real competition for the flow, someone quoting $9$ takes
              it from him.
          - text: >
              He should have set it to $\delta$ divided by $1 - \alpha$.
            feedback: >
              That would be $30 / 0.7 \approx 43$, wider still. The uninformed
              do not cause the loss; they only subsidise it.
        feedback: >
          Break-even is $\alpha\delta$, not $\delta$: the loss is spread over
          all fills, and only some of them carry it.
      - ask: >
          "One in four of the people you quote has seen the answer, and each
          of them takes $72$ off you when he trades. What is the least
          half-spread you can quote?"
        expects: "18"
        hint: >
          The chance of an informed counterparty times what he takes.
        feedback: >
          $\alpha\delta = 0.25 \times 72 = 18$. Said aloud: "a quarter of the
          flow takes $72$, so the spread has to earn $18$ a trade — a
          half-spread of at least $18$, a full width of $36$."

      - part: When everyone knows
        ask: >
          Before a scheduled announcement the flow turns: $9$ in $10$ of your
          counterparties already know the number, taking $50$ each. What
          half-spread breaks even?
        expects: "45"
        hint: >
          Same formula, larger $\alpha$.
        feedback: >
          $0.9 \times 50 = 45$. One uninformed trader in ten is now
          subsidising nine informed ones, and the spread has to be almost as
          large as the whole informed take.
      - ask: >
          Now every counterparty knows: $\alpha = 1$. What half-spread breaks
          even?
        choices:
          - text: >
              $s = \delta$: just quote as wide as what they take.
            feedback: >
              The informed only trade when the truth is beyond your price, so
              whatever they take always exceeds your half-spread. Widen to
              $\delta$ and they trade less often, but every fill they make is
              still a loss: $s - \delta < 0$ on each one.
          - text: >
              None: with no uninformed fills, every trade loses.
            correct: true
            feedback: >
              Right. At $\alpha = 1$ the profit per trade is $s - \delta$, and an
              informed counterparty trades only when that is negative. The
              uninformed were the only source of the spread; without them
              there is nothing to earn.
          - text: >
              A small one, since uninformed traders no longer need
              subsidising.
            feedback: >
              The uninformed were not costing you anything; they were paying
              you. Removing them removes the only fills that earned the
              spread.
        feedback: >
          The model's edge case is the real-world rule.
      - ask: >
          So what does a desk do in the minute before a scheduled
          announcement?
        choices:
          - text: >
              Widens a little, to be safe.
            feedback: >
              Any finite width loses against flow that is all informed. A
              little wider only means losing a little less often.
          - text: >
              Pulls its quotes until the number is out.
            correct: true
            feedback: >
              Right. With $\alpha$ near $1$, not quoting is the only quote that
              does not lose. Once the number is public, $\alpha$ drops and the
              quotes come back.
          - text: >
              Tightens, to win more of the flow.
            feedback: >
              More of the flow is precisely what it does not want: almost all
              of it is informed.
        feedback: >
          The spread is a price for information you do not have. When nearly
          everyone has it, there is no price at which to sell it.

  - node: quant-games.market-making-game.update-on-flow
    hook: >
      A fill isn't the end of a round, it's a data point, and the single
      most diagnostic thing you can do next is what you do to the market
      immediately after — re-quote the same number, or move it.
    explanation: >
      Treat a fill as an observation and update via Bayes' rule: a lift on
      your ask is evidence $T$ sits above that ask, because a counterparty
      acting on information lifts exactly when that's true, so the right
      response is to shift the whole market up — re-centre — not repeat the
      same quote and hope for a round-trip in the other direction.

      How far to move depends on how informed you think the fill was.
      Treating it as fully informative, the new centre is the posterior
      mean conditional on the truth clearing that price, which for a
      diffuse belief sits materially above the price itself, not just
      barely above it. If there's a real chance the counterparty is trading
      noise, or testing your nerve rather than acting on information,
      shrink the move toward your old centre in proportion to that chance —
      a full re-centre on every fill overreacts to trades that carried no
      signal.

      One rule holds regardless of how much you shrink: never quote a new
      ask below the price you were just lifted at. Repeated lifts compound
      the same evidence and should compound the move in the same
      direction, not reset it.
    worked: >
      Quote $200$ / $240$, with a prior belief roughly uniform over
      $[150,350]$. The interviewer lifts the $240$ ask. Treating the fill
      as fully informative, the posterior for $T$ given $T>240$ is uniform
      on $[240,350]$, with mean $(240+350)/2=295$. Re-centring there, with
      a similar half-width of about $20$, gives a next quote of $275$ /
      $315$ — comfortably above the $240$ you were just lifted at.
    interview: >
      "He just bought your offer — what's your next quote?" wants an
      immediate re-centre computation stated out loud, not "I'd quote the
      same thing and see what happens."
    pitfalls: >
      Repeating an unchanged quote after a fill, hoping for a round-trip in
      the other direction, ignores the evidence the fill just gave you.
      Treating a single lift as certainty and swinging the whole market on
      one trade, instead of compounding evidence across repeated lifts,
      overreacts the other way.
    recap: >
      A lift says the truth is above your ask and a hit says it's below
      your bid — re-centre on the posterior implied by the fill, and never
      offer again below where you were just taken.
    dialogue:
      - part: He just bought your offer
        teach: >
          You are making a market on the number of floors in a city's tallest
          tower. You know it was built to one of three designs — $40$, $60$
          or $80$ floors — and you hold them equally likely, so your centre is
          $60$. You quote $55$ / $65$, one. He lifts the $65$.
      - ask: >
          What should your next quote look like?
        choices:
          - text: >
              $55$ / $65$ again, in the hope that he sells it back to you.
            feedback: >
              He just told you something about the tower by buying. Repeating
              the quote ignores it, and if he knows the answer he will simply
              buy again.
          - text: >
              $50$ / $70$: the same centre, wider, to be safe.
            feedback: >
              Wider in both directions treats the lift as noise about how sure
              you are. It was a signal about which way the truth lies, and the
              centre should follow it.
          - text: >
              Move the whole market up.
            correct: true
            feedback: >
              Right. A lift is evidence that the truth sits above your offer.
              The question is only how far up.
        feedback: >
          A trade is information about the truth, so it moves the centre.
      - ask: >
          Suppose he knows the answer and buys only when buying pays. What is
          your fair value now?
        expects: "80"
        hint: >
          Which of the three designs makes buying at $65$ worth his while?
        feedback: >
          Only $80$ floors is above $65$, so a fully informed lift means the
          tower has $80$ floors: $\mathbb{E}[T \mid T > 65] = 80$.
      - ask: >
          Now suppose that half the time he is informed and half the time he
          tosses a coin to pick a side. Before computing, where does your new
          fair value land?
        choices:
          - text: >
              At $80$: a lift is a lift.
            feedback: >
              If the lift might be a coin toss, it might say nothing about the
              tower. Moving all the way to $80$ treats a half-informed trade as
              a fully informed one.
          - text: >
              At $60$: a lift that might be a coin toss proves nothing.
            feedback: >
              It proves nothing, but it is still evidence. A lift is three
              times as likely when the tower has $80$ floors as when it has
              $40$, and evidence that does not prove still moves a belief.
          - text: >
              Between $60$ and $80$.
            correct: true
            feedback: >
              Right. The chance that the trade carried information sets how far
              toward $80$ you go.
        feedback: >
          How far to move depends on how informed you think the trade was.
      - reflect: >
          How would you compute exactly where between $60$ and $80$ to land?
          What does the lift tell you, as a number, for each of the three
          designs?
        hint: >
          For each design, how likely was a lift at $65$?
        answer: >
          Treat the lift as an observation and use Bayes' rule. For each
          design, work out the probability of a lift: at $80$ floors the
          informed half always buys and the coin buys half the time, so
          $0.5 + 0.25 = 0.75$; at $40$ or $60$ only the coin buys, $0.25$.
          Multiply each prior by its likelihood, normalise, and take the mean
          of the posterior.
      - teach: >
          That is updating on flow. A trade is an observation: run Bayes on
          it. A lift is likely when $T$ is well above your ask and unlikely
          when it is below, so the posterior shifts up and the whole market
          moves with it. If the counterparty is fully informed, the new centre
          is $\mathbb{E}[T \mid T > a]$; if he may be trading noise, shrink the
          move in proportion to that chance. Hard rule: never quote an ask
          below a price at which you were just lifted. Repeated lifts compound
          the evidence and the move.

      - part: The posterior, by hand
        ask: >
          With the half-informed, half-coin counterparty, what is the posterior
          probability that the tower has $80$ floors?
        expects: "3/5"
        hint: >
          The priors are equal, so the posterior is proportional to the
          likelihoods $0.25$, $0.25$ and $0.75$.
        feedback: >
          $\frac{0.75}{0.25 + 0.25 + 0.75} = \frac{0.75}{1.25} = \frac{3}{5}$.
          The other two designs get $\frac{1}{5}$ each.
      - ask: >
          What is your new fair value?
        expects: "68"
        hint: >
          The posterior mean, with weights $\frac{1}{5}$, $\frac{1}{5}$,
          $\frac{3}{5}$.
        feedback: >
          $\frac{1}{5}(40) + \frac{1}{5}(60) + \frac{3}{5}(80) = 8 + 12 + 48 =
          68$. Eight floors up from $60$, against twenty for a fully informed
          lift: the shrinkage is the chance that the lift was noise.
      - ask: >
          Why is any new offer below $65$ indefensible, however much of the
          flow you think is noise?
        choices:
          - text: >
              Because the lift proves the truth is above $65$.
            feedback: >
              It proves nothing if he might have tossed a coin; your posterior
              still gives $40$ and $60$ floors $\frac{1}{5}$ each. The rule
              does not rest on certainty.
          - text: >
              Because a lift can only raise your fair value, so offering below
              $65$ sells cheaper right after learning it is worth more.
            correct: true
            feedback: >
              Right. Whatever the mix, the lift is at least as likely when the
              truth is high, so the posterior mean cannot fall. Offering lower
              than he just paid is offering into your own evidence.
          - text: >
              It is not indefensible if your half-spread is wide enough.
            feedback: >
              Width is about uncertainty, not direction. A wide market whose
              offer sits below $65$ still sells for less than the price you
              just learned was too cheap.
        feedback: >
          After a lift, your next offer starts at or above the lifted price.

      - part: When the lifts keep coming
        ask: >
          You re-centre at $68$ and quote $63$ / $73$. He lifts again, with
          the same half-informed, half-coin mix. What is your fair value now?
        expects: "820/11"
        tolerance: 0.05
        hint: >
          Your prior is now $\frac{1}{5}$, $\frac{1}{5}$, $\frac{3}{5}$. An
          informed buyer lifts $73$ only if the tower has $80$ floors.
        feedback: >
          The likelihoods are again $0.25$, $0.25$, $0.75$. Posterior weights
          are proportional to $\frac{1}{5}(0.25)$, $\frac{1}{5}(0.25)$,
          $\frac{3}{5}(0.75)$, that is $0.05$, $0.05$, $0.45$, or $\frac{1}{11}$,
          $\frac{1}{11}$, $\frac{9}{11}$. The mean is
          $\frac{40 + 60 + 720}{11} = \frac{820}{11} \approx 74.5$. Each lift
          pushes you further up: two lifts together are stronger evidence
          than one.
      - ask: >
          A candidate facing the same mix re-quotes $75$ / $85$ straight after
          the *first* lift. What did he get wrong?
        choices:
          - text: >
              Nothing: moving decisively shows conviction.
            feedback: >
              Decisive about what? A centre of $80$ is the fully informed
              answer, $\mathbb{E}[T \mid T > 65]$, and he does not believe the
              flow is fully informed.
          - text: >
              He treated a possibly-noise trade as a certain one.
            correct: true
            feedback: >
              Right. With half the flow noise, one lift is worth a move to
              $68$, not $80$. The next lift, if it comes, takes him to about
              $74.5$; let the evidence compound instead of spending it all at
              once.
          - text: >
              He moved in the wrong direction.
            feedback: >
              Up is the right direction after a lift. The error is the size of
              the move.
        feedback: >
          Move with the evidence, by as much as the evidence is worth. Said
          aloud after a lift: "That tells me it's higher — I'm $63$ at $73$
          now."

  - node: quant-games.market-making-game.inventory-risk
    hook: >
      Two units of an uncertain quantity is a bigger bet than anything else
      you'll take in this interview, and unlike a real trading book, you
      have no way to hedge it away before the truth is revealed.
    explanation: >
      Inventory is your net position $q$ after fills — positive when
      you've bought more than you've sold, negative the other way —
      carried at the average price $\bar{p}$ you traded it at. Its mark,
      once $T$ is known, is $q(T-\bar{p})$: exposure scales linearly in
      both how large the position is and how wrong you turn out to be.

      Risk, as opposed to exposure, scales differently: the variance of
      that mark is $q^{2}\operatorname{Var}(T)$, quadratic in position
      size, so the standard deviation of your risk grows linearly in $|q|$
      even though the mark itself is linear — doubling your position
      doubles the dollar-scale risk you're carrying, which sounds modest
      until you remember it started from the single-unit uncertainty of a
      quantity you may only know to within a factor of two.

      A flat book, $q=0$, carries no mark risk at all, whatever your fair
      value happened to be. Every fill is therefore a deliberate decision
      to take on some of this risk, and the entire justification for
      quoting in the first place is being paid, via the half-spread, to
      take it.
    worked: >
      Short $3$ units at an average traded price of $210$, with per-unit
      uncertainty in $T$ carrying a standard deviation of $40$. The mark's
      standard deviation at $q=3$ is $|q| \times 40 = 120$ — three times
      the single-unit risk, since $\operatorname{Var}(\text{mark}) = q^{2}
      \times 40^{2} = 9 \times 1600 = 14400$ and $\sqrt{14400}=120$. If the
      truth turns out to be $T=250$, the actual mark is $q(T-\bar{p}) =
      -3(250-210) = -120$ — the unlucky tail of that risk realizing.
    interview: >
      "How much risk are you actually carrying after those three lifts?"
      wants $q$ and $\bar{p}$ tracked explicitly, and the quadratic-
      variance point named — not just "I'm short some."
    pitfalls: >
      Treating repeated fills on the same quantity as diversifying is
      wrong — every fill is exposed to the identical single truth $T$, so
      there's no law of large numbers across them. Tracking exposure,
      which is linear in $q$, while forgetting that risk is quadratic in
      $q$, understates how much a second or third fill actually costs.
    recap: >
      Inventory marks to $q(T-\bar{p})$ but its risk grows like $q^{2}$,
      and in this game it can't be hedged away before the reveal — every
      fill is a deliberate risk decision.
    dialogue:
      - part: Two sessions, two trades each
        teach: >
          Two sessions on the number of cash machines in a business district,
          where your belief is centred at $135$ with a standard deviation of
          $20$. In session A you sold one at $140$ and later bought one at
          $120$. In session B you sold one at $140$ and later sold another at
          $150$. The truth comes in at $200$.
      - ask: >
          What does session A score?
        expects: "20"
        hint: >
          Score each fill against $200$ and add.
        feedback: >
          The sale scores $140 - 200 = -60$, the purchase $200 - 120 = 80$, total
          $20$. Try any other truth and you get $20$ again: $140 - 120$.
      - ask: >
          What does session B score?
        expects: "-110"
        hint: >
          Two sales, each scored as $a - T$.
        feedback: >
          $(140 - 200) + (150 - 200) = -60 - 50 = -110$. Here the truth matters
          a great deal.
      - ask: >
          Which session was at risk from the reveal?
        choices:
          - text: >
              Both equally: each had two trades.
            feedback: >
              Session A's score was $20$ whatever the truth, so the reveal could
              not move it. Counting trades misses what each session left you
              holding.
          - text: >
              Session B only.
            correct: true
            feedback: >
              Right. A sold and bought back, ending with nothing. B sold twice
              and ended short two units, every one of them marked against the
              truth.
          - text: >
              Session A, since it traded both sides and could lose on either.
            feedback: >
              Trading both sides is what made A safe: the purchase cancelled the
              sale's exposure to $T$. Compute A at $T = 60$: $80 + (-60) = 20$.
        feedback: >
          What the reveal acts on is the position left after the fills.
      - ask: >
          Session B left you short two units. At what average price?
        expects: "145"
        hint: >
          The average of the two prices you sold at.
        feedback: >
          $(140 + 150) / 2 = 145$. Check: two units short at $145$ against a
          truth of $200$ is $-2(200 - 145) = -110$, the session's score.
      - reflect: >
          A's score was settled the moment it ended; B's waited on the truth.
          Say exactly what decides how far the reveal can move your score, and
          write B's score as a formula in $T$.
        answer: >
          The net position left after all the fills, and the average price it
          was traded at — not how many trades there were. Session A ends flat,
          so the truth cannot touch it. Session B is $-2$ units at $145$, so
          its score is $-2(T - 145)$: linear in the position, and as uncertain
          as $T$ itself, doubled.
      - teach: >
          That is inventory: your net position $q$ after fills, positive when
          long and negative when short, carried at average traded price
          $\bar{p}$. It marks to $q(T - \bar{p})$, so its variance is
          $q^{2}\operatorname{Var}(T)$ — exposure grows linearly in $q$, risk
          quadratically. A flat book carries no mark risk at all, so every
          fill is a decision to take some.

      - part: Measuring it
        ask: >
          Short two, with your belief about $T$ carrying a standard deviation
          of $20$: what is the standard deviation of your mark?
        expects: "40"
        hint: >
          The variance is $q^{2}\operatorname{Var}(T)$; take its square root.
        feedback: >
          $\operatorname{Var} = (-2)^{2} \times 20^{2} = 1600$, so the standard
          deviation is $\sqrt{1600} = 40$, which is $|q| \times 20$.
      - ask: >
          If you were short four instead of two, by what factor would the
          variance of your mark grow?
        expects: "4"
        hint: >
          Compare $q^{2}$ at $q = -4$ with $q^{2}$ at $q = -2$.
        feedback: >
          $16 / 4 = 4$. The variance quadruples while the standard deviation
          doubles, from $40$ to $80$. A second unit of position costs more
          risk than the first did.
      - part: Stacking, not diversifying
        ask: >
          A candidate short three says: "My three sales were on different
          rounds at different prices, so their errors partly cancel; I'm
          diversified." Is he?
        choices:
          - text: >
              Yes: three trades, so his standard deviation is
              $\sqrt{3} \times 20 \approx 35$.
            feedback: >
              The $\sqrt{3}$ rule needs three independent outcomes. All three
              sales are marked against the one truth $T$, so their errors move
              together, perfectly.
          - text: >
              No: all three are marked against the same $T$, so his standard
              deviation is $3 \times 20 = 60$.
            correct: true
            feedback: >
              Right. One truth, three units: $\operatorname{Var} =
              9 \times 400 = 3600$, standard deviation $60$. Different prices
              change $\bar{p}$, not the risk.
          - text: >
              Only partly: different prices spread the risk across rounds.
            feedback: >
              The prices fix where the position is marked from, $\bar{p}$.
              The uncertainty is all in $T$, and there is only one $T$.
        feedback: >
          Repeated fills on one quantity do not diversify. They stack.
      - ask: >
          Short two, with the reveal still to come, how can you get flatter?
        choices:
          - text: >
              Hedge with a trade in some related quantity.
            feedback: >
              A real desk could. Here the only instrument is the one being
              quoted, and the only counterparty is the interviewer.
          - text: >
              Get the interviewer to sell to you, on your bid.
            correct: true
            feedback: >
              Right. Your own quotes are the only way your position changes, so
              a short book gets flatter only when your bid is hit. How to make
              that more likely, without lying about your fair value, is the
              next question.
          - text: >
              You cannot; wait for the reveal.
            feedback: >
              You still quote every round. Each round is a chance to buy back,
              and you choose how attractive to make that chance.
        feedback: >
          The position is unhedgeable from outside and adjustable only through
          the next quote.

  - node: quant-games.market-making-game.quote-skewing
    hook: >
      Carrying a position changes what your next quote should say even
      when nothing new has been learned about the truth — this is the one
      adjustment that's about you, not about $T$.
    explanation: >
      Once you're carrying inventory, stop quoting symmetrically around
      fair value. Shift both sides in the same direction: toward making
      the trade that flattens you cheap for the counterparty, and the
      trade that extends your position expensive. Long a position, that
      means lowering both bid and ask — a lower ask invites the
      counterparty to buy from you and flatten you, a lower bid makes
      selling to you, and extending your long further, less attractive to
      them.

      Keep the two adjustments mentally separate, because they draw on
      different information. Re-centring on flow is informational — it
      happens because a fill told you something about the truth. Skewing
      is a risk adjustment layered on top of that, driven purely by $|q|$
      and by how much uncertainty you're still carrying, growing as either
      one grows. Widening one side alone instead of shifting the whole
      pair is the same instrument in different dress: pushing out the side
      you fear moves the midpoint of your quote away from it, which is a
      lean, just one that also costs you width.

      Skew is not a change of view about the quantity — you still believe
      your centre is right. You're leaning the quote to manage the
      position you already have, a distinct decision from believing the
      truth has moved.
    worked: >
      Long $2$ units at an average price of $150$, with a re-centred fair
      value still at $150$ and a half-spread of $15$ — symmetric would be
      $135$ / $165$. Being long, skew down by $10$ to encourage
      flattening: quote $125$ / $155$. The ask at $155$ is now more
      attractive to lift, flattening the position; the bid at $125$ is
      less attractive to hit, discouraging the counterparty from extending
      it.
    interview: >
      "Why would you quote a market that isn't centred on your own
      number?" wants the two-step answer — re-centre first from the flow,
      then lean the pair for the position — with the skew's size tied
      explicitly to how large $q$ is.
    pitfalls: >
      Folding the risk skew into the informational re-centre makes the two
      adjustments impossible to size separately. Widening one side alone
      is already a lean, since it moves the midpoint; stacking a full skew
      on top of it leans twice.
    recap: >
      Lean both quotes toward the trade that flattens you, by an amount
      growing with $|q|$ — a risk adjustment layered on top of, not
      instead of, the informational re-centre.
    dialogue:
      - part: Short two, and the next quote
        teach: >
          You are quoting the number of animal species in a city zoo. Two
          lifts have left you short two units, and after updating on them
          your fair value is $230$, with a standard deviation of $25$ left in
          your belief. Your half-spread is $15$, so the symmetric quote would
          be $215$ / $245$.
      - ask: >
          Short two, what is the standard deviation of your mark?
        expects: "50"
        hint: >
          $|q|$ times the standard deviation of your belief.
        feedback: >
          $2 \times 25 = 50$.
      - ask: >
          If he lifts the symmetric quote once more, leaving you short three,
          what does it become?
        expects: "75"
        hint: >
          Same rule, $|q| = 3$.
        feedback: >
          $3 \times 25 = 75$, a variance of $5625$ against $2500$ before. On a
          symmetric quote with uninformed flow, that lift is as likely as the
          hit that would flatten you to one.
      - reflect: >
          You would rather the next fill were a purchase, and you still believe
          $230$ is fair. What could you do to both prices to make a purchase
          more likely and a further sale less likely — and what should the
          size of that change depend on?
        hint: >
          Which of your two prices does a counterparty who sells to you care
          about, and which does a buyer care about?
        answer: >
          Move both prices up. A higher bid pays more to whoever sells to you,
          so a hit becomes more attractive; a higher ask charges more to
          whoever buys, so a lift becomes less attractive. The size should
          grow with how short you are and with how uncertain you still are,
          because together they set the risk you are trying to shed. Your
          belief about $230$ has not changed; you are pricing the position.
      - teach: >
          That is skewing against inventory. Carrying a position, stop quoting
          symmetrically: shift both prices in the direction that makes the
          trade you want cheap for him and the trade you fear expensive, by an
          amount growing with $|q|$ and with your remaining uncertainty.
      - ask: >
          Short two with a fair value of $230$ and a half-spread of $15$,
          which quote is skewed the right way?
        choices:
          - text: >
              $205$ / $235$
            feedback: >
              That leans down, which is the long book's skew. A cheaper offer
              invites another lift and makes you shorter still.
          - text: >
              $200$ / $260$
            feedback: >
              Wider on both sides, centred on $230$. It makes every fill less
              likely, including the purchase you want, and leans nowhere.
          - text: >
              $225$ / $255$
            correct: true
            feedback: >
              Right: both prices up by $10$. Selling to you at $225$ now pays
              him $10$ more than at $215$, and buying from you at $255$ costs
              him $10$ more.
        feedback: >
          Short, lean up; long, lean down. The pair moves together and the
          width stays.

      - part: Two adjustments, kept apart
        ask: >
          You show $225$ / $255$ and he hits the $225$: you are short one now.
          What should change in your next quote?
        choices:
          - text: >
              Only the skew, which shrinks because you are less short.
            feedback: >
              The skew does shrink, but the hit is also a trade, and a trade is
              information: a counterparty who might be informed just sold to
              you, which says the truth may be lower.
          - text: >
              Both: the centre moves down on the hit, and the skew shrinks with
              $|q|$.
            correct: true
            feedback: >
              Right. Two adjustments from two sources: the flow moves the
              centre, the position sets the lean. Keeping them apart is what
              lets you size each.
          - text: >
              Only the centre, since skew was a one-off for being short two.
            feedback: >
              You are still short one, so a smaller lean is still owed. The
              lean tracks the position round by round.
        feedback: >
          Re-centre on information, then lean on inventory, every round.
      - ask: >
          The hit moves your fair value down to $222$. Your rule is to lean by
          $5$ per unit of position, you are short one, and the half-spread
          stays $15$. What ask do you show?
        expects: "242"
        hint: >
          Centre, plus the lean for one unit short, plus the half-spread.
        feedback: >
          The leaned centre is $222 + 5 = 227$, so the quote is $212$ /
          $242$ and the ask is $242$. The centre came from the flow, the $5$
          from the position.
      - ask: >
          Back at short two, a candidate shows $215$ / $265$ instead of
          $225$ / $255$: he leaves the bid alone and pushes only the offer
          out. What has he done?
        choices:
          - text: >
              Nothing to do with skew; he just widened the market.
            feedback: >
              Look at the midpoint: $(215 + 265)/2 = 240$, ten above his fair
              value. Pushing out only the side you fear moves the middle away
              from it.
          - text: >
              The same lean in different dress, and a wider market with it.
            correct: true
            feedback: >
              Right. His midpoint sits at $240$, like $225$ / $255$, but he has
              paid for it with $20$ more width and a bid that does nothing to
              invite the purchase he wants.
          - text: >
              A better skew, since his bid still sits at fair value minus the
              half-spread.
            feedback: >
              Keeping the bid at $215$ is exactly what fails to attract the
              hit that would flatten him. It deters the lift but invites
              nothing.
        feedback: >
          One-sided widening is a lean. Do not stack a full skew on top of it.

      - part: How hard to lean
        ask: >
          Still short two at $230$, but the interviewer has just let slip that
          the answer is between $228$ and $232$. How hard should you lean now?
        choices:
          - text: >
              Harder than before: you are still short two.
            feedback: >
              The lean pays for risk, and risk is $|q|$ times your
              uncertainty. With the truth pinned to within $2$, two units
              short carries almost none.
          - text: >
              Barely at all.
            correct: true
            feedback: >
              Right. The standard deviation of your mark has fallen from $50$ to
              a couple of units. With little risk left there is little to pay
              to shed it.
          - text: >
              The same $10$: the lean is set by the position alone.
            feedback: >
              Position is half of it. The other half is how much you still do
              not know, and that has just collapsed.
        feedback: >
          The lean grows with $|q|$ and with your remaining uncertainty, and
          shrinks when either does.
      - ask: >
          Showing $225$ / $255$, the interviewer asks: "So what do you think
          it's worth?" What do you say?
        choices:
          - text: >
              "$240$" — the middle of the quote.
            feedback: >
              The middle of a skewed quote is your fair value plus the lean.
              Reporting it as your view says you have changed your mind about
              the zoo, when you have only changed your position.
          - text: >
              "$230$; I'm leaning up because I'm short two."
            correct: true
            feedback: >
              Right. One sentence that separates belief from risk, which is
              exactly what he is checking.
          - text: >
              "I'd rather not say while I'm carrying a position."
            feedback: >
              Saying it costs you nothing: he already knows your position, and
              a fair value you will not state reads as one you do not have.
        feedback: >
          A skewed quote with its reason stated aloud is a clear answer. A
          skewed quote without one looks like a change of view you cannot
          defend.

  - node: quant-games.market-making-game.size-discipline
    hook: >
      "One lot or five?" gets asked as often as the price itself, and
      raising your size right after a bad fill to look unbothered is the
      single most common way a small loss turns into a large one.
    explanation: >
      The repeated-bet structure that makes Kelly-style sizing the right
      frame here is exactly satisfied: each round is a fresh trade with its
      own edge and its own variance, and the interviewer keeps re-offering
      the same kind of bet as the session continues. The Kelly criterion
      balances the marginal growth from a bigger stake against the
      marginal risk of one; the same balance, worked out for a bet whose
      outcome is closer to continuous than a coin flip, lands on staking in
      proportion to edge over variance rather than the discrete
      odds-and-probability terms — the growth-optimal principle is
      identical, only the bet's shape has changed.

      The reason to shade down further than that number, rather than
      staking it exactly, is that the edge itself is an estimate here, not
      a known quantity the way it's assumed to be in the textbook setup.
      Overestimating the edge and staking to it costs growth asymmetrically
      — overbetting the true optimum is punished harder than underbetting
      it by the same amount — so on a genuinely uncertain edge, erring
      toward less size is the safer side of that asymmetry.

      Operationally: state your size the moment you quote, keep total
      exposure across the session small relative to how wrong you could
      plausibly be, and respond to rising uncertainty by cutting size
      rather than widening the spread without limit — an unboundedly wide
      market stops functioning as a market at all. The one move to avoid
      categorically is raising size right after being picked off in order
      to look confident: that raises the stake exactly when the fill was
      fresh evidence the edge estimate was wrong.
    worked: >
      Half-spread $8$, expected adverse-selection cost $5$, so per-trade
      edge is $3$; per-unit standard deviation of the mark is $10$, so
      variance is $100$. Edge over variance is $3/100 = 0.03$ — small
      enough on its own to rule out quoting size $5$ to sound aggressive.
      Shaded further for how uncertain the edge estimate itself is, the
      size that comes out the other end is $1$, not $5$.
    interview: >
      Listen for edge over variance named explicitly, the shading-down
      step stated as deliberate, and cutting size — rather than widening
      without limit — as the response to rising uncertainty.
    pitfalls: >
      Doubling size immediately after a loss to project confidence raises
      the stake exactly when the evidence turned against the edge. Quoting
      a size that merely sounds decisive, with no link back to edge over
      variance, makes the same error less visibly.
    recap: >
      Size from edge over variance, then shade down for how uncertain that
      edge estimate is — and never raise size right after a loss to save
      face.
    dialogue:
      - part: One lot or five
        teach: >
          You have quoted a half-spread of $10$, and you expect adverse
          selection to cost you about $6$ a fill on average. The mark on one
          unit has a standard deviation of about $20$. The interviewer asks:
          "Do you want to do that one, or five?"
      - ask: >
          What is your expected edge per unit traded?
        expects: "4"
        hint: >
          Half-spread minus selection.
        feedback: >
          $10 - 6 = 4$ per unit: what the spread earns, less what the informed
          fills take back.
      - ask: >
          At size five, what is the standard deviation of the mark on one
          fill?
        expects: "100"
        hint: >
          Every unit of a fill is marked against the same truth.
        feedback: >
          $5 \times 20 = 100$, a variance of $25 \times 400 = 10{,}000$. The
          expected edge went from $4$ to $20$; the variance went up
          twenty-five times.
      - ask: >
          Edge grows like the size and variance like its square. What does
          that say about choosing size?
        choices:
          - text: >
              Bigger is always better, since the edge grows with it.
            feedback: >
              The edge grows linearly but the variance grows quadratically, so
              past some size each extra unit adds more risk than it is worth.
              A positive edge says to trade, not to trade without limit.
          - text: >
              There is a best size, past which extra risk outweighs extra
              edge.
            correct: true
            feedback: >
              Right. A linear gain against a quadratic cost has an interior
              best point.
          - text: >
              Size does not matter, since edge per unit of risk stays the same.
            feedback: >
              Edge over standard deviation is the same at every size, $4/20 =
              20/100$, but what you lose to a bad run depends on how much you
              have on. Size decides how hard the variance bites.
        feedback: >
          Size is a separate decision from price, with its own optimum.
      - reflect: >
          This is a repeated favourable bet, and you have met a rule for how
          much to stake on one. What should the size be proportional to — and
          why would you then stake less than that rule says?
        hint: >
          The Kelly fraction balances edge against risk. Here the edge itself
          is a guess.
        answer: >
          Growth-optimal sizing for a bet with a roughly continuous outcome
          stakes in proportion to edge over variance — the Kelly rule in the
          form $\mu / \sigma^{2}$. Then you shade it down, because the edge here
          is an estimate on a quantity you know badly, and overbetting the
          true optimum costs growth faster than underbetting it by the same
          amount.
      - teach: >
          That is sizing the quote. Quote a size you can afford to be wrong
          about: stake in proportion to edge over variance, then take a
          fraction of that, because your estimate of the edge is unreliable.
          Attach the size to the quote, keep total exposure across the session
          small relative to how wrong you could be, and when uncertainty is
          largest, cut size rather than widening without limit.

      - part: Edge over variance
        ask: >
          On a second quantity your edge is again $4$ per unit, but the mark's
          standard deviation is only $10$. By what factor should your size
          there exceed your size on the first?
        expects: "4"
        hint: >
          Compare edge over variance: $4 / 20^{2}$ against $4 / 10^{2}$.
        feedback: >
          $4/100 = 0.04$ against $4/400 = 0.01$, a factor of $4$. Halving the
          standard deviation quarters the variance, so the same edge supports
          four times the size.
      - ask: >
          Model growth per round as $g(f) = f\mu - \frac{1}{2}f^{2}\sigma^{2}$,
          maximised at the Kelly size $f^{*} = \mu / \sigma^{2}$. What fraction
          of the maximum growth do you keep at half the Kelly size?
        expects: "3/4"
        hint: >
          Put $f = \frac{1}{2}f^{*}$ and $f = f^{*}$ into $g$ and divide.
        feedback: >
          At $f^{*}$, $g = \frac{\mu^{2}}{2\sigma^{2}}$. At $\frac{1}{2}f^{*}$,
          $g = \frac{\mu^{2}}{2\sigma^{2}} - \frac{\mu^{2}}{8\sigma^{2}} =
          \frac{3\mu^{2}}{8\sigma^{2}}$. The ratio is $\frac{3}{4}$: half the
          risk for three quarters of the growth.
      - ask: >
          Now suppose your true edge is half what you estimated, so staking
          "full Kelly" on your estimate actually puts you at twice the true
          Kelly size. What growth do you get?
        choices:
          - text: >
              Half the maximum, mirroring the half-Kelly case.
            feedback: >
              The curve is not symmetric in that sense. At $f = 2f^{*}$,
              $g = 2\frac{\mu^{2}}{\sigma^{2}} - 2\frac{\mu^{2}}{\sigma^{2}} = 0$.
          - text: >
              Zero.
            correct: true
            feedback: >
              Right: $g(2f^{*}) = 2f^{*}\mu - 2f^{*2}\sigma^{2} = 0$. Twice the
              right size takes the whole risk and earns no growth at all.
          - text: >
              More than the maximum, since you are trading more.
            feedback: >
              $f^{*}$ is the maximum by construction. Past it, the quadratic
              risk term wins: at $2f^{*}$ it has eaten all the growth.
        feedback: >
          Underbetting by half keeps three quarters of the growth; overbetting
          by double keeps none. With an edge you are unsure of, err small.

      - part: After a bad fill
        ask: >
          He lifts you, and his follow-up questions make it plain he knew the
          answer. You revise your expected adverse-selection cost from $6$ to
          $9$ a fill. With the variance unchanged, by what factor should your
          size shrink?
        expects: "4"
        hint: >
          The new edge is $10 - 9$. Size is proportional to edge over
          variance.
        feedback: >
          The edge falls from $4$ to $1$, so with the same variance the size
          falls by a factor of $4$. The fill was evidence that your edge is
          smaller than you thought.
      - ask: >
          Another candidate in the same spot doubles his size on the next
          quote, "to show I'm not rattled". What has he done?
        choices:
          - text: >
              Shown the composure the interviewer wants to see.
            feedback: >
              Composure is holding a quote you can defend. Raising the stake
              after evidence against your edge is the opposite of discipline,
              however calm it sounds.
          - text: >
              Raised the stake right after evidence that his edge was
              negative.
            correct: true
            feedback: >
              Right. The size rule says shrink; he went the other way by a
              factor of eight relative to it, to protect his image.
          - text: >
              Nothing wrong, as long as he also widens.
            feedback: >
              Widening may be warranted too, but it does not license more size.
              The evidence says his edge is smaller, and size follows edge.
        feedback: >
          Size follows edge. Never scale up to save face.
      - ask: >
          "Make me a market on the number of grains of sand in a beach
          bucket." You could be out by a factor of ten. What is the
          disciplined response?
        choices:
          - text: >
              An honest, wide market at small size, said as such.
            correct: true
            feedback: >
              Right. When uncertainty is largest, cut size and keep the market
              usable: "$10^{6}$ at $10^{8}$, one" is a quote he can trade, and
              small size caps the damage if the bracket is off.
          - text: >
              A huge market at normal size: $1$ at $10^{12}$, five.
            feedback: >
              Widening without limit stops being a market. Nothing he could do
              against it would ever be graded, which fails the exercise.
          - text: >
              A normal-width market at normal size, to look confident.
            feedback: >
              That claims a precision you do not have at a size you cannot
              afford to be wrong about. Both levers point the wrong way.
        feedback: >
          Uncertainty can be paid for in width or in size. Past a point, width
          stops working and size has to carry it.

  - node: quant-games.market-making-game.calibration
    hook: >
      This is the only part of the game graded across an entire session
      rather than one quote at a time, and it's the part interviewers
      actually log.
    explanation: >
      An interval is honest only if it hits at its advertised rate across
      many questions — a stated $90\%$ range should contain the truth
      about $90\%$ of the time, no more and no less. This is directly
      testable: log every interval you state and whether the truth landed
      inside it, and compute the hit rate once you have enough data
      points.

      Calibration is a property of a batch, never of a single quote — one
      interval either happens to contain the truth or it doesn't, and that
      single outcome says nothing about whether your process is sound.
      This is exactly why an interviewer who cares about calibration asks a
      whole series of estimation questions rather than one, and watches the
      pattern across the series rather than grading any individual answer.

      The fix, once you have a hit rate, is mechanical rather than a
      matter of trying harder: scale every stated width by a constant
      factor until the hit rate on a fresh batch lands near the target,
      then check again. There's no shortcut that skips the re-check — the
      factor that fixes one batch is only a starting guess for the next.
    worked: >
      Twenty stated $90\%$ intervals over a session, and $12$ of them
      contain the truth — a $60\%$ hit rate against a $90\%$ target,
      meaning the intervals ran meaningfully under-width. Widening every
      future interval by about $50\%$ as a first correction, logging the
      next $20$, and recomputing: landing near $18$ out of $20$ confirms
      the correction; landing at $14$ or $15$ says widen further still.
    interview: >
      "How would you know if your ranges are any good?" wants the
      batch-logging framing stated directly — hit rate against advertised
      rate, computed over many questions, never judged off one.
    pitfalls: >
      Judging your calibration off a single interval's outcome, good or
      bad, misreads what the test measures. Treating one round of
      rescaling as a permanent fix, instead of re-checking the hit rate on
      the next batch, assumes a correction that hasn't actually been
      confirmed.
    recap: >
      Score stated intervals against the truth over many questions — a
      $90\%$ interval should hit $90\%$ of the time, and widths get
      rescaled, mechanically, until it does.
    dialogue:
      - part: One interval, one miss
        teach: >
          Asked for a $90\%$ range on the height of the world's tallest
          waterfall, you say $600$ to $900$ metres. The truth is $979$. You
          missed.
      - ask: >
          What does that miss tell you about your $90\%$ ranges?
        choices:
          - text: >
              They run too narrow; widen them.
            feedback: >
              Maybe, but this miss cannot tell you. A perfectly honest $90\%$
              range misses one time in ten, and this could be that time.
          - text: >
              Very little on its own.
            correct: true
            feedback: >
              Right. One interval either contains the truth or it does not.
              Both outcomes are consistent with honest $90\%$ ranges, and with
              badly dishonest ones.
          - text: >
              That $90\%$ was the wrong confidence for this question.
            feedback: >
              The confidence is a claim about your process across questions,
              not about one question. A single outcome cannot confirm or
              refute it.
        feedback: >
          A single interval is not evidence about calibration in either
          direction.
      - ask: >
          Suppose your $90\%$ ranges are honest and you state $20$ of them on
          unrelated questions. How many misses do you expect?
        expects: "2"
        hint: >
          Each one misses with probability $0.1$.
        feedback: >
          $20 \times 0.1 = 2$. Two misses in twenty is exactly what honest
          ranges produce.
      - ask: >
          Still honest: what is the probability that at least one of your
          first $10$ ranges misses?
        expects: "0.651"
        tolerance: 0.001
        hint: >
          The complement is ten hits in a row.
        feedback: >
          $1 - 0.9^{10} = 1 - 0.349 = 0.651$. Even an honest quoter misses
          somewhere in ten questions about two times in three.
      - ask: >
          Over a session of $20$ questions, $9$ of your $90\%$ ranges contain
          the truth. Now what do you conclude?
        choices:
          - text: >
              Bad luck: a few misses are expected.
            feedback: >
              Two misses are expected; eleven is a different world. Honest
              $90\%$ ranges would almost never hit only $9$ of $20$.
          - text: >
              Your ranges run roughly half the width they should.
            correct: true
            feedback: >
              Right. A hit rate near $45\%$ against an advertised $90\%$ is the
              signature of ranges about half as wide as your real uncertainty.
          - text: >
              Your centres are badly placed; the widths are fine.
            feedback: >
              Placement and width both affect hits, but the cure is the same
              either way: honest ranges have to be wider than these. Widths are
              the lever that moves the hit rate.
        feedback: >
          Twenty questions can say what one cannot.
      - reflect: >
          One miss told you almost nothing and nine hits in twenty told you a
          lot. What is calibration a property of, and how would you test
          yours?
        answer: >
          Of a batch of intervals, never of one. Log every interval you state
          with its advertised confidence, record whether the truth landed
          inside, and compare the hit rate with the advertised rate once you
          have enough questions. That is exactly why interviewers ask a series
          of estimation questions and watch the pattern.
      - teach: >
          That is calibration: an interval is honest only if it hits at its
          advertised rate, so your $90\%$ ranges should contain the truth about
          $90\%$ of the time across many questions. It is testable, so test
          it. When the hit rate is off, multiply every width by a constant
          factor until it lands.

      - part: Fixing it by a factor
        teach: >
          You log ten questions. For each, you record how far the truth fell
          from your centre as a multiple of your stated half-width: $0.3$,
          $0.5$, $0.8$, $0.9$, $1.2$, $1.4$, $1.6$, $1.9$, $2.2$, $3.5$. A
          ratio of at most $1$ is a hit.
      - ask: >
          What was your hit rate?
        expects: "0.4"
        hint: >
          Count the ratios at most $1$.
        feedback: >
          Four ratios, $0.3$, $0.5$, $0.8$ and $0.9$, are at most $1$: a hit
          rate of $4/10 = 0.4$ against a target of $0.9$.
      - ask: >
          By what factor would you have had to multiply every half-width for
          $9$ of the $10$ to hit?
        expects: "2.2"
        hint: >
          Scaling every half-width by $c$ turns a hit into "ratio at most
          $c$".
        feedback: >
          Multiplying the half-widths by $c$ divides every ratio by $c$, so a
          question hits when its ratio is at most $c$. Nine of ten ratios are
          at most $2.2$, so $c = 2.2$. Your ranges were less than half as wide
          as your errors.
      - ask: >
          You widen every range by $2.2$ for the next batch. What then?
        choices:
          - text: >
              Nothing more: the factor is fitted, so you are calibrated now.
            feedback: >
              The factor was fitted to ten questions and is a first estimate
              of your bias. Fit on one batch, check on the next.
          - text: >
              Log the next batch and check its hit rate.
            correct: true
            feedback: >
              Right. The factor that fixes one batch is a starting guess for
              the next. Recheck, and adjust again if it misses.
          - text: >
              Widen only the ranges that missed last time.
            feedback: >
              Next time's questions are new ones. The bias is in how you set
              widths, so the fix is a constant factor on every width.
        feedback: >
          Fit, apply, recheck: calibration is a loop, not a correction made
          once.

      - part: Why the fix is mechanical
        ask: >
          A candidate with your ten-question log says: "I'll just concentrate
          harder and be more accurate." Why is that not a fix?
        choices:
          - text: >
              Effort cannot shrink your errors to fit the ranges; widening the
              ranges to fit your errors is in your control.
            correct: true
            feedback: >
              Right. How far off your estimates land is mostly set by what you
              know. How wide you quote is a choice, and it is the choice that
              was miscalibrated.
          - text: >
              It is a fix, and better than widening, since narrow ranges look
              stronger.
            feedback: >
              Narrow ranges that miss half the time look stronger only until
              they are scored. A trader whose stated confidence is wrong cannot
              be sized, however sharp his ranges look.
          - text: >
              It might work, but only on the questions he already missed.
            feedback: >
              The issue is not which questions he missed but the scale of
              every range he quotes, which effort does not touch.
        feedback: >
          Accuracy improves slowly; calibration improves the moment you
          rescale. Said aloud: "I log my ranges, and when they hit less than
          advertised I widen them all by a fixed factor and check again."

  - node: quant-games.market-making-game.overconfidence
    hook: >
      Before you've quoted a single market, the base rate already tells
      you which direction your first mistake will run — too tight, almost
      never too wide.
    explanation: >
      The default human error runs one way. Asked for $90\%$ ranges on
      general-knowledge quantities, people's stated intervals contain the
      truth only about $30\%$ to $50\%$ of the time — not slightly
      optimistic, but routinely half the width they'd need to be to
      actually hit their advertised rate.

      The mechanism is anchoring: the first number that comes to mind
      fixes a scale, and the outward adjustment from that anchor —
      widening the interval to actually cover your real uncertainty —
      stops far short of where it needs to. Two countermeasures work
      reliably against this: produce the bounds before committing to a
      point estimate, so the anchor doesn't get to fix the scale first, and
      ask what would have to be true for the answer to come out ten times
      larger than your instinct — if you can tell a coherent story for
      that, the bound was too close in.

      In this game the symptom is specific and recognizable: a market that
      looks impressively tight in the first round and then gets picked off
      from both sides as the session goes on, because the width never
      reflected the real uncertainty behind the centre in the first place.
    interview: >
      "Why would your first quote usually be too tight?" wants anchoring
      named as the mechanism, plus a concrete habit — bounds before the
      point estimate — not just an acknowledgment that people are
      overconfident.
    pitfalls: >
      Assuming this bias only applies to trivia-style questions, not to
      your own market-making numbers, misses the point entirely. Treating
      one deliberate widening as solved, rather than as a standing
      correction re-applied every session, undoes the fix.
    recap: >
      Stated $90\%$ intervals hit closer to $40\%$ because anchoring cuts
      the outward adjustment short — the practical correction is to widen
      deliberately, roughly by a factor of two, every session.
    dialogue:
      - part: A candidate's six ranges
        teach: >
          A candidate gives $90\%$ ranges on six quantities. Length of the
          Nile: $5000$ to $6000$ km (truth $6650$). Population of Australia:
          $20$ to $25$ million (about $27$). Distance to the Moon: $350$ to
          $420$ thousand km ($384$). Height of Kilimanjaro: $4500$ to $5500$
          m ($5895$). Year the Eiffel Tower opened: $1880$ to $1895$
          ($1889$). Diameter of the Earth: $10{,}000$ to $12{,}000$ km
          ($12{,}742$).
      - ask: >
          How many of the six ranges contain the truth?
        expects: "2"
        hint: >
          Check each truth against its range.
        feedback: >
          Only the Moon and the Eiffel Tower: $2$ of $6$, a hit rate of about
          $33\%$ on ranges advertised at $90\%$.
      - ask: >
          Is this candidate unusual?
        choices:
          - text: >
              Yes: most people's $90\%$ ranges hit close to $90\%$.
            feedback: >
              The opposite. Studied over many people and many questions, stated
              $90\%$ ranges on general-knowledge quantities typically hit only
              $30\%$ to $50\%$ of the time.
          - text: >
              No: $90\%$ ranges typically hit only $30\%$ to $50\%$ of the
              time.
            correct: true
            feedback: >
              Right. He is squarely typical, and so, by default, are you. The
              error is not random: it runs one way, too tight.
          - text: >
              Slightly: most people are a little too wide, to be safe.
            feedback: >
              Too wide is the rare error. The common one is ranges roughly half
              the width they need.
        feedback: >
          Overconfidence is the default, not a personal failing. Your first
          range is probably too tight.
      - part: Where the narrowness comes from
        ask: >
          He built each range by thinking of a number and going about $10\%$
          either side of it. Why does that come out too tight?
        choices:
          - text: >
              He simply did not know enough about these quantities.
            feedback: >
              Not knowing much is fine; it should produce a wide range. His
              ranges were narrow despite his ignorance, and that mismatch is
              the error.
          - text: >
              The first number fixed the scale, and the adjustment outward from
              it stopped too early.
            correct: true
            feedback: >
              Right. That is anchoring. The point estimate came first, and
              everything after was a modest nudge away from it.
          - text: >
              The questions were trick questions.
            feedback: >
              They are ordinary quantities. His misses were on the plain ones:
              the Nile, Kilimanjaro, the Earth.
        feedback: >
          The range inherited its width from the anchor, not from his
          uncertainty.
      - reflect: >
          If the first number you think of fixes the scale, what could you
          change about the order in which you build a range — or the question
          you ask yourself about it — to get out from under that anchor?
        answer: >
          Produce the bounds first, before any point estimate exists to anchor
          on: "surely more than this, surely less than that". Then stress each
          bound: what would have to be true for the answer to be ten times
          larger? If you can tell a plausible story, the bound is too close.
          Only then pick the centre.
      - teach: >
          That is why everyone's intervals are too tight. Stated $90\%$ ranges
          hit nearer $40\%$, roughly half the width they need, because the
          first estimate anchors the scale and the outward adjustment stops
          early. Countermeasures that work: bounds before the point estimate,
          and the ten-times question.

      - part: Where the correction holds, and where it overshoots
        ask: >
          Your instinctive range for some quantity is $400$ to $600$. Applying
          the rule of thumb, you double the half-width around the same centre.
          What is the new lower bound?
        expects: "300"
        hint: >
          Centre $500$, half-width $100$ before.
        feedback: >
          The half-width goes from $100$ to $200$, so the range becomes $300$
          to $700$.
      - ask: >
          A candidate decides that if wider is better, he will quote ten times
          wider than instinct on everything. What is wrong with that?
        choices:
          - text: >
              Nothing: wider can only raise the hit rate.
            feedback: >
              It raises the hit rate past $90\%$, which is the other
              miscalibration. A range that hits $99.9\%$ of the time advertised
              as $90\%$ is as dishonest as one that hits $40\%$.
          - text: >
              Overcorrecting is miscalibration too; the factor should come from
              your own log.
            correct: true
            feedback: >
              Right. The base rate says which way to lean by default. How far
              to lean is what logging and rescaling are for.
          - text: >
              Wide markets are never allowed in the game.
            feedback: >
              Wide markets you can defend are fine. Ten times instinct is a
              number nobody could defend, and it drifts toward a joke market.
        feedback: >
          The intuition gives the direction; your own data gives the size.
      - ask: >
          Over a session, your market is lifted on some questions and hit on
          others, almost every round trades, and almost every trade loses.
          What does that pattern suggest?
        choices:
          - text: >
              Your centres are biased one way.
            feedback: >
              A biased centre would be picked off from one side only, lifted
              every time if you are low. Fills from both sides point at the
              width.
          - text: >
              Your markets are too tight.
            correct: true
            feedback: >
              Right. When the truth keeps landing outside your quote on either
              side, the width is the problem: the overconfidence signature,
              played out in trades.
          - text: >
              The interviewer is trading at random.
            feedback: >
              Random flow would leave you winning about as often as losing,
              and earning the spread on average. Losing on nearly every fill
              means he is choosing sides that know where the truth is.
        feedback: >
          Picked off from both sides is the market version of a $40\%$ hit
          rate.

  - node: quant-games.market-making-game.worked-747
    hook: >
      A full session can end in a real loss even when every individual
      decision was defensible, and the useful thing to take from any
      worked session is which round the damage actually happened in.
    explanation: >
      A full session chains together the moves this unit teaches: pin down
      the quantity, build a fair value, size the width from actual
      uncertainty, then react to whatever the interviewer does through
      re-centring and, once you're carrying a position, skewing. Every
      later decision inherits the consequences of the earlier ones — a
      width that understated your real uncertainty in round one doesn't
      just cost that round, it forces every later re-centre and skew to
      work harder to contain the damage.

      This is why the single biggest lever in any session is the first
      quote's width, not the cleverness of the later updates. A market
      that's honestly wide from the start rarely gets run over more than
      once, because there's little room left between the quote and the
      truth for a second informed trade to exploit; a market that's too
      tight invites exactly the sequence of lifts or hits that then has to
      be managed round by round.

      Reading a session afterward, the useful question isn't whether the
      final score was good or bad — one session is far too short to say
      anything about your process, the same reason calibration is judged
      over a batch — but which specific decision, redone, would have
      stopped the bleeding earliest.
    worked: >
      "Make me a market on average annual snowfall in Chicago." Clarify:
      inches, at O'Hare, most recent full year. Fermi: certainly above
      $10$, certainly below $100$, so centre at $\sqrt{10 \cdot 100} \approx
      31.6$, call it $30$. Round 1, quote $27$ / $33$ — a tenth of the
      centre either way, tight for a bracket this wide. He lifts, leaving
      you short one at $33$. An informed lift says the truth is above $33$,
      so re-centre, modestly, to $36$. Round 2, symmetric would be $33$ /
      $39$, but short one you skew up to $35$ / $41$; he passes, since the
      truth sits inside that range. Truth: $38$. Score: $33-38=-5$, all of
      it from the single fill in round one — round two's re-centred,
      skewed market stopped the bleeding instead of adding to it.
    interview: >
      Across a multi-round session, the interviewer is watching whether
      each quote responds to what just happened — a repeated, unchanged
      quote after a fill reads as not having updated at all, regardless of
      how good the opening number was.
    pitfalls: >
      Reading a small final loss as proof the whole session went well
      ignores that the loss traces to one identifiable decision, not to
      bad luck spread evenly across every round. Reading a large final
      loss as proof every decision was wrong makes the same mistake in
      reverse — usually one round did the damage and the rest were
      reasonable given it.
    recap: >
      A session's score traces back to one or two specific decisions,
      almost always the first quote's width, rather than being evenly
      earned or lost across every round.
    dialogue:
      - part: Before the first price
        teach: >
          "Make me a market on the number of seats on an Airbus A380." You
          know two numbers are in play: airlines fit them out with roughly
          $500$ seats, but the certified maximum is $853$.
      - ask: >
          What do you say first?
        choices:
          - text: >
              "As fitted by a typical airline, or the certified maximum?"
            correct: true
            feedback: >
              Right. One closed question on a fork worth a factor of $1.7$. He
              answers: a typical airline fit-out.
          - text: >
              "$480$ at $520$, one," and sort out the definition if he trades.
            feedback: >
              If he meant the certified maximum, every price in that market
              is $300$ too low, and asking after he lifts reads as welching.
              The fork is wider than any spread; settle it first.
          - text: >
              "Which airline, which year, which cabin layout?"
            feedback: >
              Three questions where one would do. The fork that matters is
              typical against maximum; the rest is variance for your width.
        feedback: >
          Ten seconds on the definition, then commit.
      - ask: >
          You are sure a typical fit-out has more than $250$ seats and fewer
          than $1000$. Averaging those bounds in log space, where do you
          centre?
        expects: "500"
        hint: >
          The geometric mean of $250$ and $1000$.
        feedback: >
          $\sqrt{250 \times 1000} = \sqrt{250{,}000} = 500$, a factor of $2$
          from each bound.
      - ask: >
          Your bounds were ones you were sure of, a factor of $2$ either way.
          Which opening market is honest?
        choices:
          - text: >
              $480$ / $520$
            feedback: >
              That is $\pm 4\%$ on a quantity you could only bracket within a
              factor of $2$. It claims you know the cabin layout to a few rows.
          - text: >
              $350$ / $700$
            correct: true
            feedback: >
              Right: about a factor of $1.4$ each way, half the log distance to
              bounds you were sure of — roughly one standard deviation of a
              belief whose certain limits sit about two out.
          - text: >
              $250$ / $1000$
            feedback: >
              Those are the bounds you were *sure* of: a range you expect to
              contain the truth nearly always. A one-standard-deviation market
              sits well inside them.
        feedback: >
          The width is read off the same bracket that gave the centre.

      - part: The session with the tight market
        teach: >
          Suppose you had opened at $480$ / $520$ anyway. The truth he has in
          mind is $545$. Round 1: he lifts the $520$, and you are short one.
          You re-centre to $580$, lean up $5$ for the short, and with a
          half-spread of $20$ show $565$ / $605$. Round 2: he sells you one at
          $565$. Round 3 he passes.
      - ask: >
          What does the session score?
        expects: "-45"
        hint: >
          Score the sale at $520$ and the purchase at $565$ against $545$.
        feedback: >
          The sale scores $520 - 545 = -25$ and the purchase $545 - 565 =
          -20$, a total of $-45$. You end flat, having sold at $520$ and bought
          back at $565$.
      - ask: >
          Round 2 re-centred upward after a lift, exactly as the rule says. Why
          did it lose as well?
        choices:
          - text: >
              The re-centre went the wrong way.
            feedback: >
              Up was right: the lift said the truth was above $520$. It was,
              at $545$. The trouble is that after a tight opening you have no
              idea how far above, so the next quote is a guess he can pick off
              from the other side.
          - text: >
              Having learned little from the lift, the tight new market missed
              again, on the other side.
            correct: true
            feedback: >
              Right. A lift on a tight market only says "above $520$"
              somewhere in $520$ to $1000$. Your guess of $580$ overshot, and a
              $40$-wide market around it left the truth outside, below.
          - text: >
              Leaning up for the short was the error.
            feedback: >
              Without the lean the quote is $560$ / $600$, and he still sells
              at $560$ for a loss of $15$ instead of $20$. The lean added $5$;
              the miss came from elsewhere.
        feedback: >
          A tight market chased after a fill keeps being picked off, from
          whichever side the truth is on.
      - reflect: >
          Which single decision, redone, would have prevented both fills — and
          why could the careful updating in rounds 2 and 3 not repair it?
        answer: >
          The opening width. At $480$ / $520$ the truth was almost bound to
          land outside, so the first fill was close to certain, and it left
          you with a position and a vague signal. Every later quote then had
          to guess where in a wide range the truth sat, with a tight width
          that a guess could not support. Updating is only as good as the
          information the first quote let through.

      - part: The same session, quoted honestly
        ask: >
          Now you open at $350$ / $700$, with the truth again $545$. He passes.
          What does an informed pass tell you?
        choices:
          - text: >
              Nothing: no trade, no information.
            feedback: >
              A counterparty who knows the truth passes only when neither side
              pays him. His pass is evidence, just like a fill.
          - text: >
              That the truth lies between $350$ and $700$, so you may tighten.
            correct: true
            feedback: >
              Right. That is real information arriving, the one legitimate
              reason to narrow the market. You tighten to $450$ / $600$; the
              truth is inside, and he passes again.
          - text: >
              That your market is too wide and you should halve it at once.
            feedback: >
              He passed, which is information that the truth sits inside your
              bracket, not a complaint. Tighten by what the pass justifies, and
              keep a width you can still name.
        feedback: >
          An honest opening lets passes do the narrowing for you.
      - ask: >
          The honest session ends with no fills. By how much did it beat the
          tight session?
        expects: "45"
        hint: >
          No fills means a score of $0$.
        feedback: >
          $0 - (-45) = 45$, all of it decided by the opening width.
      - ask: >
          At the end, the interviewer asks the tight-session candidate: "What
          would you change?" Which answer shows he understood?
        choices:
          - text: >
              "I should have re-centred less aggressively in round 2."
            feedback: >
              Round 2 was a symptom. Without the round-1 fill there would have
              been no short to re-centre from.
          - text: >
              "Opening at $\pm 4\%$ on a factor-of-$2$ bracket was the error;
              everything after was chasing it."
            correct: true
            feedback: >
              Right. He names the round where the damage happened and why, in
              terms of the bracket he built himself.
          - text: >
              "I was unlucky that the truth was $545$."
            feedback: >
              A truth of $545$ sat comfortably inside his own bracket. The
              market claimed a precision the bracket never supported, and luck
              had nothing to do with that.
        feedback: >
          Read a session for the decision that, redone, stops the bleeding
          earliest — usually the first quote's width.

  - node: quant-games.market-making-game.game-vs-real-markets
    hook: >
      The natural next question after any session is whether this is
      actually the job, and knowing exactly what's been left out is what
      separates rehearsing a puzzle from understanding the business behind
      it.
    explanation: >
      The interview session keeps the decision logic of quoting intact:
      build a fair value, size a width from genuine uncertainty, re-centre
      when a fill teaches you something, skew when you're carrying a
      position, and expect your edge to be the spread minus whatever
      informed flow takes from you. Every one of those moves, run on a
      trading desk, is the same move, just executed continuously instead
      of across three or four rounds.

      What the interview version drops is the machinery around those
      decisions. A real market maker quotes continuously into a limit order
      book with queue priority rather than one private conversation, gets
      thousands of fills a day so the law of large numbers does real work
      that a handful of interview trades never can, hedges accumulated
      inventory in correlated instruments instead of sitting exposed until
      an announced truth arrives, and competes on latency for the right to
      be first to a new quote. None of that belongs to the decision logic
      being tested here — it belongs to market microstructure, a separate
      and much larger subject.

      The practical consequence: one bad session is weak evidence about
      your actual process, for the same reason a single missed interval
      doesn't indict your calibration — small samples are noisy regardless
      of whether the process behind them is sound. Treating the game as a
      party trick disconnected from the job it's meant to test misses the
      point just as badly.
    interview: >
      Asked directly how this differs from a real desk, name specifically
      what survives — the decision logic — against what's missing —
      continuous flow, hedging, latency, queue priority — rather than
      answering with a vague "it's simplified."
    pitfalls: >
      Treating three or four interview fills as if they diversify the way
      thousands of real fills do overstates what one session can tell you.
      Dismissing the whole exercise as disconnected from real trading
      misunderstands what it's actually rehearsing.
    recap: >
      The game keeps the decision logic of quoting — fair value, width,
      re-centring, skew, spread minus selection — and drops the machinery
      of continuous markets, which is exactly where market microstructure
      picks up.
    dialogue:
      - part: Same edge, different number of fills
        teach: >
          A candidate in an interview and a market maker on an exchange run
          the same economics on every fill: expected profit $2$, standard
          deviation $20$, fills independent. The candidate gets $4$ fills in
          a session. The market maker gets $10{,}000$ in a day.
      - ask: >
          Who is more likely to end with a loss?
        choices:
          - text: >
              Neither: the edge per fill is identical.
            feedback: >
              The expected profit per fill is identical; the chance of a losing
              total is not. That depends on how many fills the edge has to
              show through the noise.
          - text: >
              The market maker, since more trades means more chances to lose.
            feedback: >
              More trades means more losing trades, but also more winning ones,
              and the total's mean grows faster than its spread.
          - text: >
              The candidate.
            correct: true
            feedback: >
              Right. With four fills, the noise of a single fill swamps the
              edge. The next three questions put numbers on it.
        feedback: >
          Edge per fill is the same; what differs is how much of it survives
          the noise.
      - part: Putting numbers on the noise
        ask: >
          The candidate's session total has mean $4 \times 2 = 8$. What is its
          standard deviation?
        expects: "40"
        hint: >
          Independent fills: variances add.
        feedback: >
          Variance $4 \times 20^{2} = 1600$, so the standard deviation is
          $\sqrt{1600} = 40$, five times the mean.
      - ask: >
          Treating the total as normal, what is the chance the candidate's
          session loses money? Use $\Pr(Z < -0.2) \approx 0.42$.
        expects: "0.42"
        tolerance: 0.01
        hint: >
          How many standard deviations below the mean is zero?
        feedback: >
          Zero sits $(0 - 8)/40 = -0.2$ standard deviations from the mean, so
          the chance of a loss is about $0.42$. A sound process loses two
          sessions in five.
      - ask: >
          The market maker's daily total has mean $20{,}000$. How many of its
          standard deviations above zero is that?
        expects: "10"
        hint: >
          Its standard deviation is $\sqrt{10{,}000} \times 20$.
        feedback: >
          The standard deviation is $100 \times 20 = 2000$, so the mean is
          $20{,}000 / 2000 = 10$ standard deviations above zero. A losing day
          is practically impossible with this edge.
      - reflect: >
          Same decisions, same edge, and one loses two sessions in five while
          the other essentially never loses a day. What does that say about
          what one interview session can show — and so what is the interview
          actually grading?
        answer: >
          A single session is far too small a sample to show whether your
          process has an edge; the law of large numbers that makes the desk
          reliable never gets to work on four fills. So the interview grades
          the decisions themselves — a defensible centre, an honest width,
          coherent updating, a skew for inventory — because those are what
          the desk will run thousands of times a day.

      - part: What survives the compression
        teach: >
          That is what the game keeps and what it drops. Kept: quote around a
          fair value, take width from uncertainty, re-centre on flow, skew on
          inventory, and earn the spread minus what the informed take. That
          decision logic is the job. Dropped: the sheer number of fills, and
          the machinery a real exchange wraps around each decision — the
          subject of market microstructure.
      - ask: >
          A desk is short $200$ units of a stock late in the day. What can it
          do that you could not do when short two in the interview?
        choices:
          - text: >
              Skew its quotes up to attract buyers.
            feedback: >
              You did exactly that in the interview. Skewing is the decision
              logic, and it survives the compression unchanged.
          - text: >
              Buy a correlated instrument, such as an index future, to offset
              the risk now.
            correct: true
            feedback: >
              Right. In the game the only instrument is the one quoted and the
              position waits for the reveal. A desk can hedge immediately,
              outside its own quotes.
          - text: >
              Re-centre on what the fills taught it.
            feedback: >
              Also something you did in the interview. Updating on flow is the
              same move at any scale.
        feedback: >
          Hedging is machinery the game leaves out; skewing and re-centring
          are logic it keeps.
      - ask: >
          In the interview you could re-quote between rounds at no cost. On an
          exchange with queue priority, what does moving your bid usually cost
          you?
        choices:
          - text: >
              Nothing; a quote is a quote.
            feedback: >
              At a given price, orders fill in the order they arrived. Cancel
              and re-enter and you go to the back of that line.
          - text: >
              Your place in the queue at that price.
            correct: true
            feedback: >
              Right. That is microstructure the interview leaves out: re-quoting
              has a price, and so does being slow to re-quote when someone
              faster sees the news first.
          - text: >
              An exchange fee for every price you show.
            feedback: >
              Fee schedules vary and are not the point. The cost built into the
              market's design is lost priority.
        feedback: >
          The mechanics of when and how you get filled belong to market
          microstructure, not to the game.
      - ask: >
          A candidate says: "Real desks live on thousands of fills, so the
          interview's lessons about adverse selection don't carry over." What
          is wrong with that?
        choices:
          - text: >
              Nothing: four fills and ten thousand are different businesses.
            feedback: >
              The sample size differs; the economics of each fill do not. A
              desk loses to informed flow exactly as you did, just ten thousand
              times a day.
          - text: >
              Adverse selection is the central cost of real market making; the
              logic is the same, run at size.
            correct: true
            feedback: >
              Right. The spread that survives informed flow is the same
              calculation on a desk. Size makes its average reliable; it does
              not change what is being averaged.
          - text: >
              It is only wrong for slow markets with few fills.
            feedback: >
              The logic holds at any speed. Fast markets add latency and queues
              on top; they do not remove the informed trader.
        feedback: >
          The intuition that the game is "only a puzzle" fails exactly here:
          the decisions are the job, and the machinery is what is added
          around them.
