unit: quant-probability.geometric
opening: >
  Geometric probability trades sums and integrals for areas: once "uniformly
  at random" is translated into independent uniform coordinates, every
  question becomes a shape drawn in a square, cube or disc, and the answer is
  a ratio of measures. The chapter opens with the definitions that make this
  legal — a uniform point, and the correspondence between independent
  uniform draws and a uniform point in a box — then spends its center of
  gravity on the one reusable technique, probability as an area ratio, that
  powers the meeting problem, the broken-stick triangle, and Buffon's
  needle. It closes on the chapter's central warning, sharpened twice over —
  Bertrand's chord paradox and the two-stage broken stick, where identical
  words produce different answers because "uniform" was never pinned to one
  mechanism — before a final pair of circle problems reuses the same area
  trick to decide when a random triangle surrounds the center.
lessons:
  - node: quant-probability.geometric.uniform-point
    hook: >
      Every "a point is dropped at random on this region" problem is
      quietly asking you to trust that probability equals area — and that
      trust needs a definition before it can be used without flinching.
    explanation: >
      In one dimension, uniform meant a flat density $1/(b-a)$; the natural
      extension to a region $S$ with area or volume $|S|$ keeps the same
      idea — density stays flat at $1/|S|$ on $S$ and $0$ outside, so
      $\Pr(P \in A) = |A|/|S|$ for any subregion $A$. That is the classical
      model's favorable-over-total ratio translated from counting outcomes
      to measuring them: with no distinct outcomes left to count, length,
      area or volume stands in for cardinality.

      Two consequences follow immediately and are worth saying out loud,
      since interview problems lean on both constantly. Any single point,
      curve or lower-dimensional slice inside $S$ has measure $0$, hence
      probability $0$ — so whether a boundary is included or excluded never
      changes an answer, and corners can be rounded freely. And only the
      ratio $|A|/|S|$ matters: rescaling $S$ and $A$ together by any factor
      leaves the probability unchanged, so the answer never carries units —
      a probability computed on a unit square is identical to one computed
      on any similar region, however large.
    worked: >
      A point is dropped uniformly on the triangle with vertices $(0,0)$,
      $(4,0)$, $(0,4)$, area $8$. What's the probability it lands in the
      sub-triangle $x+y \le 2$, with vertices $(0,0)$, $(2,0)$, $(0,2)$,
      area $2$? The ratio is $2/8 = 1/4$.
    interview: >
      Told "a dart lands uniformly at random on this region," the
      interviewer wants an immediate reach for area ratios, not an attempt
      to set up a joint density integral from scratch — naming
      $\Pr(A) = |A|/|S|$ on sight is the tell they're listening for.
    pitfalls: >
      Treating boundaries as if they mattered — worrying over $\le$ versus
      $<$ — forgets that any curve has probability $0$. Applying the ratio
      rule to a region without finite positive measure, such as an
      unbounded strip or a degenerate sliver with zero area, breaks the
      definition outright.
    recap: >
      A uniform point turns probability into geometry:
      $\Pr(P \in A) = |A|/|S|$, a dimensionless ratio unaffected by
      rescaling, with every boundary free.
    steps:
      - teach: >
          In one dimension a uniform density is flat: $1/(b-a)$ everywhere on
          $(a,b)$. The natural extension to a region $S$ with area or volume
          $|S|$ keeps that same idea — density stays flat at $1/|S|$ on $S$ and
          $0$ outside.
      - teach: >
          That gives the definition: $P$ is uniform on $S$ when $\Pr(P \in A) =
          |A|/|S|$ for every subregion $A$. This is the classical model's
          favorable-over-total ratio, with length, area or volume standing in
          for a count of outcomes.
      - ask: >
          A point is dropped uniformly on a rectangular garden plot $12$ meters
          by $5$ meters, area $60$. What's the probability it lands within a
          $4$-by-$5$ flower bed occupying one corner, area $20$?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          Divide the flower bed's area by the whole plot's area — nothing about
          the shapes' positions matters, only the two areas.
        feedback: >
          The flower bed has area $20$, the plot has area $60$, so $\Pr = 20/60
          = 1/3$. Only the ratio counts, exactly as the definition says.
      - teach: >
          Two consequences follow immediately. Any single point or curve inside
          $S$ has measure $0$ and hence probability $0$, so whether a boundary
          is included or excluded never changes an answer. And only the ratio
          $|A|/|S|$ matters — rescaling $S$ and $A$ together leaves the
          probability unchanged.
      - ask: >
          A point is uniform on a disc of radius $7$. What's $\Pr$ that it lands
          exactly on a diameter line drawn through the center?
        expects: "0"
        hint: >
          A line segment has zero area inside a two-dimensional region — compare
          its measure to the disc's.
        feedback: >
          A diameter is a one-dimensional line inside a two-dimensional disc, so
          it has area $0$ and $\Pr = 0/(\pi \cdot 7^{2}) = 0$. Boundaries and
          slices never carry probability under a uniform point.
      - teach: >
          The ratio rule needs one hypothesis to hold: $S$ must have finite,
          nonzero measure. Without that, favorable-over-total has no total to
          divide by, or an infinite one.
      - ask: >
          Which of these regions can you *not* apply the ratio rule $\Pr(P \in
          A) = |A|/|S|$ to directly?
        choices:
          - text: >
              A closed disc of radius $5$
            feedback: >
              This has finite positive area $25\pi$, so the ratio rule applies
              directly — closed versus open makes no difference, since the
              boundary has probability $0$.
          - text: >
              An infinite half-plane
            correct: true
            feedback: >
              An infinite half-plane has infinite measure, so there is no finite
              total to divide by — the ratio rule needs $|S|$ finite and
              positive, and this region has neither.
          - text: >
              An open square of side $3$
            feedback: >
              This has finite positive area $9$; whether the square is open or
              closed doesn't matter, since its boundary has probability $0$
              either way.
        feedback: >
          The rule requires $S$ to have finite, nonzero measure. A disc or a
          square, open or closed, qualifies; an unbounded region like a half-
          plane does not.
      - teach: >
          A uniform point turns probability into measurement: no distribution to
          integrate, just a ratio of sizes. That's why every technique in this
          chapter starts by drawing a region and comparing areas.


  - node: quant-probability.geometric.independent-coordinates
    hook: >
      This is the sentence that lets you redraw "two random arrival times"
      as "one random point in a square" — every meeting problem, needle
      drop and stick-break later in this chapter leans on it without
      restating it.
    explanation: >
      If $X \sim U(a,b)$ and $Y \sim U(c,d)$ are independent, their joint
      density is the product of the marginals — that is what independence
      means for densities — and each marginal is already a constant,
      $1/(b-a)$ and $1/(d-c)$. The product is the constant
      $1/((b-a)(d-c))$ on the rectangle $[a,b] \times [c,d]$, and a constant
      density on a rectangle is exactly what a uniform point on that
      rectangle means. Independent uniform coordinates and a uniform point
      in a box are the same object, seen from two directions.

      The converse matters just as much in practice: given a uniform point
      in a rectangle, integrating its constant density over one
      coordinate's full range again produces a constant, so each
      coordinate is itself uniform, and the joint density still factors —
      hence independent. The same coordinate-by-coordinate argument
      extends to $n$ independent uniforms filling a box in $n$ dimensions.

      The equivalence is special to boxes. In a disc or a triangle, knowing
      $X$ restricts the feasible range of $Y$, so a uniform point there has
      dependent coordinates even though each one's own marginal density is
      easy to write down. The payoff of the box case is a translation
      you'll use constantly: "$k$ independent uniform times, positions or
      angles" is literally the same object as "one uniform point in a
      $k$-dimensional box."
    worked: >
      Let $X \sim U(0,2)$ and $Y \sim U(0,5)$, independent. Their joint
      density is $1/10$ on the rectangle $[0,2] \times [0,5]$, area $10$.
      For $\Pr(X<1, Y<3)$: as a product of independent events,
      $(1/2)(3/5) = 3/10$; as an area ratio, the favorable rectangle
      $[0,1] \times [0,3]$ has area $3$ out of $10$, giving $3/10$ again.
    interview: >
      "Two independent random times in $[0,T]$ — draw the picture" is
      asking for an immediate conversion to a uniform point in a
      $T \times T$ square; the interviewer is checking that the
      translation is automatic, not something re-derived from a joint
      density each time.
    pitfalls: >
      Applying the same "draw a square" move to two dependent quantities —
      a point and a reflection of itself, say — silently breaks the
      argument, since independence is a real hypothesis, not a formality.
      Assuming a uniform point in a disc has independent coordinates is the
      most common misuse of this equivalence.
    recap: >
      Independent uniform coordinates and a uniform point in a box are the
      same object — the box is what licenses drawing random times,
      positions or angles as a single point.
    steps:
      - teach: >
          If $X \sim U(a,b)$ and $Y \sim U(c,d)$ are independent, their joint
          density is the product of the marginals, and each marginal is already
          constant. The product $1/((b-a)(d-c))$ is itself constant on the
          rectangle $[a,b] \times [c,d]$ — exactly what a uniform point on that
          rectangle means.
      - teach: >
          The converse holds too: a uniform point in a rectangle has each
          coordinate uniform on its own range, and the joint density still
          factors, so the coordinates are independent. The same argument extends
          to $n$ independent uniforms filling a box in $n$ dimensions.
      - ask: >
          Let $X \sim U(0,4)$ and $Y \sim U(0,6)$, independent. What's $\Pr(X<3,
          Y<2)$?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          Compute it two ways: as a product of two independent events, or as a
          favorable rectangle's area over the total rectangle's area.
        feedback: >
          As a product, $(3/4)(2/6) = (3/4)(1/3) = 1/4$. As an area ratio, the
          favorable rectangle $[0,3]\times[0,2]$ has area $6$ out of a total
          area $24$, giving $6/24 = 1/4$ — the same answer both ways.
      - teach: >
          The equivalence is special to boxes. In a disc or a triangle, knowing
          $X$ restricts the feasible range of $Y$, so a uniform point there has
          dependent coordinates even though each coordinate's own marginal
          density is easy to write down.
      - ask: >
          For which of these regions does a uniform point have *independent*
          coordinates?
        choices:
          - text: >
              A uniform point in a rectangle
            correct: true
            feedback: >
              A rectangle is a product of two intervals, so the density factors
              as a product of the two marginals — exactly independence.
          - text: >
              A uniform point in a disc
            feedback: >
              Knowing $X$ restricts $Y$ to a range that shrinks as $|X|$ grows,
              so the coordinates are dependent even though each marginal is easy
              to write down alone.
          - text: >
              A uniform point in a triangle
            feedback: >
              Knowing $X$ restricts the feasible range of $Y$ here too — a
              triangle is not a product of two independent intervals.
        feedback: >
          The equivalence between independent coordinates and a uniform point
          holds only for boxes — rectangles, cubes, and their higher-dimensional
          analogues.
      - teach: >
          The payoff is a translation you'll use constantly through this
          chapter: '$k$ independent uniform times, positions or angles' is
          literally the same object as 'one uniform point in a $k$-dimensional
          box.' Redraw one as the other whenever it helps.
      - ask: >
          Three independent uniforms $X, Y, Z \sim U(0,3)$ fill a uniform point
          in a cube of side $3$. What's $\Pr(X<1, Y<1, Z<1)$?
        expects: "1/27"
        tolerance: 0.0005
        hint: >
          Either multiply the three one-dimensional probabilities, or divide the
          favorable sub-cube's volume by the total cube's volume.
        feedback: >
          As a product, $(1/3)^{3} = 1/27$. As a volume ratio, the favorable
          sub-cube has volume $1$ out of a total cube volume $27$, giving $1/27$
          again.
      - teach: >
          Keep the box requirement in mind before reaching for this shortcut.
          The moment a region stops being a product of intervals — a disc, a
          triangle, a simplex — the coordinates stop being independent, even
          though each one individually still looks uniform.


  - node: quant-probability.geometric.probability-as-area
    hook: >
      This four-step recipe is the one move every remaining example in
      this chapter runs; knowing the steps in order is worth more than
      knowing any single answer.
    explanation: >
      Every "at random" question with a continuum of outcomes reduces to
      the same sequence. Name the independent uniform quantities the
      mechanism actually produces — arrival times, break points, angles —
      one coordinate per quantity. Draw the region they jointly fill: a
      square for two uniform times on $[0,T]$, a cube for three, a
      rectangle in $(x,\theta)$ for a dropped needle's position and angle.
      Rewrite every condition in the problem as an inequality in those
      coordinates, turning the favorable event into a subregion bounded by
      lines or simple curves. Report the ratio of measures, favorable over
      total.

      Because only the ratio counts — the uniform point's scale invariance
      again — you are always free to rescale to the unit square or cube
      before computing, which keeps the arithmetic light. Two habits pay
      off repeatedly: try the complement first, since the excluded region
      is usually a pair of simple corner triangles rather than the awkward
      band or polygon you actually want, and check that the final answer is
      dimensionless, since a probability still carrying units of time or
      length signals a mistake in how the boundaries were drawn.
    worked: >
      Two independent measurements $X, Y \sim U(0,10)$. Find
      $\Pr(X+Y>15)$. The favorable region is itself a corner triangle,
      vertices $(10,5)$, $(5,10)$, $(10,10)$, legs $5$, area $12.5$, out of
      total area $100$. So $\Pr(X+Y>15) = 12.5/100 = 1/8 = 0.125$.
    interview: >
      "What's the probability two independent random numbers on $[0,L]$
      satisfy [some inequality]" is testing exactly this pipeline — state
      the coordinates and the region out loud before computing, since a
      correct picture with a small arithmetic slip scores far better than a
      guessed number.
    pitfalls: >
      Skipping the naming step and reasoning about probabilities before
      fixing coordinates is how sign errors and double-counted regions
      creep in. Rescaling the region without rescaling the condition to
      match silently changes the ratio.
    recap: >
      Name the coordinates, draw the region, turn the conditions into a
      subregion, and report the ratio — checking the complement and the
      units along the way.
    steps:
      - teach: >
          Every 'at random' question with a continuum of outcomes reduces to the
          same four moves. Name the independent uniform quantities the mechanism
          actually produces — arrival times, break points, angles — one
          coordinate per quantity.
      - teach: >
          Draw the region those coordinates jointly fill, rewrite every
          condition of the problem as an inequality in those coordinates, and
          report the ratio of measures, favorable over total. Because only the
          ratio counts, you're always free to rescale to the unit square or cube
          first, which keeps the arithmetic light.
      - ask: >
          Two independent measurements $X, Y \sim U(0,20)$. What's $\Pr(X+Y<8)$?
        expects: "2/25"
        tolerance: 0.0005
        hint: >
          The favorable region is a corner triangle at the origin with both legs
          equal to $8$.
        feedback: >
          The triangle with vertices $(0,0)$, $(8,0)$, $(0,8)$ has area $8^{2}/2
          = 32$, out of a total square area $20^{2} = 400$. So $\Pr = 32/400 =
          2/25$.
      - teach: >
          Two habits pay off on every one of these problems. Try the complement
          first — the excluded region is usually a pair of simple corner
          triangles rather than the awkward band or polygon you actually want.
      - ask: >
          A problem gives two independent uniforms on $[0, 37]$. Before setting
          up any inequalities, what's the move that keeps the arithmetic light?
        choices:
          - text: >
              Rescale the square to the unit square, solve there, then read off
              the ratio
            correct: true
            feedback: >
              Since only the ratio of areas ever matters, working in the unit
              square gives the identical answer with none of the $37$'s
              cluttering the algebra.
          - text: >
              Keep the original $37 \times 37$ square and carry the exact side
              length through every step
            feedback: >
              This works but multiplies every intermediate number by powers of
              $37$ for no benefit — the final ratio is unaffected by the
              rescaling you're avoiding.
          - text: >
              Convert the square into a circle of the same area to simplify the
              boundary
            feedback: >
              Changing the region's shape changes the problem being solved; only
              rescaling the same shape preserves it.
        feedback: >
          Because probability here is a ratio of measures, rescaling the whole
          picture to a unit square never changes the answer and removes clutter
          from the arithmetic.
      - teach: >
          The second habit: check that the final answer is dimensionless. A
          probability that still carries units of time or length signals a
          mistake in how the boundaries were drawn — most often a condition
          rescaled without rescaling the region to match.
      - ask: >
          Two independent measurements $X, Y \sim U(0,6)$. What's $\Pr(X+Y>10)$?
        expects: "1/18"
        tolerance: 0.0005
        hint: >
          Take the complement region: the corner triangle where $X+Y>10$ has
          both legs equal to $12-10$.
        feedback: >
          The corner triangle has legs $12-10=2$, area $2^{2}/2=2$, out of a
          total area $6^{2}=36$. So $\Pr = 2/36 = 1/18$.
      - teach: >
          Name the coordinates, draw the region, turn the conditions into a
          subregion, report the ratio — that four-step sequence is the only
          technique this entire chapter runs on repeat.


  - node: quant-probability.geometric.meeting-problem
    hook: >
      This is the area-ratio technique's flagship example, and
      interviewers reuse the exact numbers — $15$-minute wait, one-hour
      window — often enough that reciting $7/16$ without the underlying
      picture invites them to change the numbers on you.
    explanation: >
      Model the two arrival times as a uniform point $(X,Y)$ in a
      $T \times T$ square, using the coordinates-as-a-point translation.
      "They meet" means neither arrives more than the patience $t$ before
      the other has to leave, i.e. $|X-Y| \le t$ — a diagonal band
      straddling the line $X=Y$.

      Rather than integrate the band directly, take the complement.
      $Y-X>t$ and $X-Y>t$ are two triangles in opposite corners, each right
      isosceles with legs $T-t$, since one arrival must land in the final
      $T-t$ minutes strictly ahead of the other's entire range. Their
      combined area is $2 \cdot (T-t)^{2}/2 = (T-t)^{2}$, so
      $\Pr(\text{meet}) = 1 - (T-t)^{2}/T^{2}$.

      Keep this as a shape, not a formula: the meeting event is a band
      around a square's diagonal, and its width is set by twice the
      patience. Every later variant in this chapter — unequal patience, a
      different window length — is the same band, just with the corner
      triangles resized.
    worked: >
      Two colleagues each arrive at a uniformly random time within a
      $30$-minute window and wait $5$ minutes. Square side $T=30$,
      corner-triangle legs $T-t=25$, one triangle's area
      $25^{2}/2 = 312.5$, two triangles $625$, out of total area $900$.
      $\Pr(\text{meet}) = 1 - 625/900 = 275/900 = 11/36 \approx 0.3056$.
    interview: >
      "Two people plan to meet within an hour, each waiting $15$ minutes"
      is the canonical phrasing; the interviewer wants the band-in-a-square
      picture and the complement trick, not a memorized $7/16$ — change the
      window or the wait and you should redraw instantly.
    pitfalls: >
      Computing the band's area directly, as a hexagon-minus-triangles
      argument, is far more error-prone under time pressure than taking the
      two-corner complement. Using legs of $T$ instead of $T-t$ for the
      corner triangles is the most common slip.
    recap: >
      The meeting event is a band $|X-Y| \le t$ around a square's diagonal;
      excluding its two corner triangles of leg $T-t$ gives
      $\Pr(\text{meet}) = 1-(T-t)^{2}/T^{2}$, which is $7/16$ at $t=15$,
      $T=60$.
    steps:
      - teach: >
          This is the area-ratio technique's flagship example, and interviewers
          reuse the exact numbers — $15$-minute wait, one-hour window — often
          enough that reciting $7/16$ without the underlying picture invites
          them to change the numbers on you.
      - teach: >
          Model the two arrival times as a uniform point $(X,Y)$ in a $T \times
          T$ square. 'They meet' means neither arrives more than the patience
          $t$ before the other has to leave — $|X-Y| \le t$, a diagonal band
          straddling the line $X=Y$.
      - teach: >
          Rather than integrate the band directly, take the complement. $Y-X>t$
          and $X-Y>t$ are two right isosceles triangles in opposite corners,
          each with legs $T-t$, so their combined area is $(T-t)^{2}$ and
          $\Pr(\text{meet}) = 1-(T-t)^{2}/T^{2}$.
      - ask: >
          Two colleagues each arrive at a uniformly random time within a
          $50$-minute window and wait $10$ minutes. What's $\Pr(\text{meet})$?
        expects: "9/25"
        tolerance: 0.0005
        hint: >
          The corner triangles have legs $T-t = 50-10$.
        feedback: >
          $\Pr(\text{meet}) = 1-(1-10/50)^{2} = 1-(0.8)^{2} = 1-0.64 = 0.36 =
          9/25$.
      - ask: >
          Holding the window $T$ fixed, which change increases
          $\Pr(\text{meet})$?
        choices:
          - text: >
              Doubling the patience $t$
            correct: true
            feedback: >
              A larger $t$ shrinks the corner triangles' legs $T-t$, which
              shrinks the excluded area and raises $\Pr(\text{meet})$.
          - text: >
              Doubling the window $T$, with $t$ held fixed
            feedback: >
              A larger $T$ with $t$ fixed grows the legs $T-t$, growing the
              excluded corners and lowering $\Pr(\text{meet})$ — the opposite
              direction.
          - text: >
              Neither changes $\Pr(\text{meet})$
            feedback: >
              $\Pr(\text{meet}) = 1-(1-t/T)^{2}$ depends on the ratio $t/T$, and
              both changes move that ratio, just in opposite directions.
        feedback: >
          More patience relative to the window always helps; a longer window
          with the same patience always hurts, since what matters is the ratio
          $t/T$.
      - teach: >
          The most common slip is using legs of $T$ instead of $T-t$ for the
          corner triangles — remember each triangle is cut off by the line
          $X-Y=t$ (or $Y-X=t$), a distance $t$ inside the square's corner, not
          the corner itself.
      - ask: >
          For a window $T=25$ and patience $t=5$, what's the leg length of each
          corner triangle in the complement?
        choices:
          - text: >
              $5$
            feedback: >
              That's the patience $t$ itself, not the leg — the leg is what's
              left of the window once the patience is subtracted.
          - text: >
              $20$
            correct: true
            feedback: >
              The leg is $T-t = 25-5 = 20$: the corner triangle is cut off by
              the band's edge, a distance $t$ in from the square's corner along
              each side.
          - text: >
              $25$
            feedback: >
              That's the full window $T$, which would mean no band was ever
              subtracted — the corner triangles are strictly smaller than the
              square itself.
        feedback: >
          Each corner triangle has legs $T-t$, here $25-5=20$, giving
          $\Pr(\text{meet}) = 1-20^{2}/25^{2} = 1-400/625 = 9/25$.
      - teach: >
          Keep the picture, not the formula: the meeting event is a band around
          a square's diagonal, and its width is set by twice the patience. Every
          later variant in this chapter is the same band, just with the corner
          triangles resized.


  - node: quant-probability.geometric.waiting-window-general
    hook: >
      Once the meeting problem becomes a formula in $t/T$ rather than a
      fixed picture, two questions interviewers actually ask — "how much
      patience buys $50$-$50$ odds" and "what if the two people have
      different patience" — turn into algebra instead of new geometry.
    explanation: >
      Because only the ratio of areas ever mattered, rescale the
      $T \times T$ square to the unit square without loss: legs
      $(T-t)/T = 1-t/T$ turn the meeting problem's corner-triangle argument
      into $\Pr(\text{meet}) = 1-(1-t/T)^{2}$, a function of the single
      ratio $t/T$.

      Solving $1-(1-t/T)^{2} = 1/2$ for even odds gives
      $(1-t/T)^{2}=1/2$, so $1-t/T = 1/\sqrt{2}$ and
      $t/T = 1-1/\sqrt{2} \approx 0.293$ — patience needs to be roughly
      $29\%$ of the window, not half of it, for a coin-flip chance of
      meeting.

      When the two patiences differ — the earlier arrival waits $a$, the
      later one $b$ — the corner triangles stop being congruent: one has
      legs $T-a$, the other legs $T-b$, since each person's own patience
      sets how much of the other's arrival window is excluded on their
      side. Adding the two areas and dividing by $T^{2}$ gives
      $\Pr(\text{meet}) = 1-((T-a)^{2}+(T-b)^{2})/(2T^{2})$, which
      collapses back to the equal-patience formula when $a=b$.
    worked: >
      Two colleagues plan to meet within a $90$-minute window and each
      will wait $20$ minutes.
      $\Pr(\text{meet}) = 1-(1-20/90)^{2} = 1-(7/9)^{2} = 1-49/81 = 32/81
      \approx 0.3951$.
    interview: >
      "How long should each person wait for a $50/50$ chance of meeting"
      wants $t/T = 1-1/\sqrt{2} \approx 0.293$ stated directly, ideally
      with the corner-triangle picture named as where it came from, rather
      than a re-derivation from scratch.
    pitfalls: >
      Solving $(1-t/T)^{2}=1/2$ and taking the wrong root — $1-t/T$ must
      stay positive and below $1$ — gives an impossible ratio. Averaging
      two unequal patiences as $(a+b)/2$ and plugging into the
      equal-patience formula, instead of summing the two separate corner
      areas, gives the wrong number whenever $a \ne b$.
    recap: >
      $\Pr(\text{meet}) = 1-(1-t/T)^{2}$ depends only on patience as a
      fraction of the window — about $29\%$ buys even odds — and unequal
      patiences just resize the two corner triangles independently.
    steps:
      - teach: >
          Once the meeting problem becomes a formula in $t/T$ rather than a
          fixed picture, two questions turn into algebra instead of new
          geometry: how much patience buys even odds, and what happens when the
          two people have different patience.
      - teach: >
          Rescale the $T \times T$ square to the unit square without loss — legs
          $(T-t)/T = 1-t/T$ turn the corner-triangle argument into
          $\Pr(\text{meet}) = 1-(1-t/T)^{2}$, a function of the single ratio
          $t/T$.
      - ask: >
          A window $T=10$ minutes, patience $t=3$ minutes. What's
          $\Pr(\text{meet})$?
        expects: "51/100"
        tolerance: 0.0005
        hint: >
          Plug $t/T = 3/10$ into $1-(1-t/T)^{2}$.
        feedback: >
          $1-(1-3/10)^{2} = 1-(0.7)^{2} = 1-0.49 = 0.51 = 51/100$.
      - teach: >
          Solving $1-(1-t/T)^{2}=1/2$ for even odds gives $(1-t/T)^{2}=1/2$, so
          $1-t/T = 1/\sqrt{2}$ and $t/T = 1-1/\sqrt{2}$ — patience needs to be
          roughly $29\%$ of the window, not half of it.
      - ask: >
          To the nearest thousandth, what fraction of the window must the
          patience be for a $50$-$50$ chance of meeting?
        expects: "0.293"
        tolerance: 0.0005
        hint: >
          Compute $1 - 1/\sqrt{2}$.
        feedback: >
          $1/\sqrt{2} \approx 0.7071$, so $t/T = 1-0.7071 \approx 0.293$ —
          patience needs to be about $29\%$ of the window.
      - teach: >
          When the two patiences differ — the earlier arrival waits $a$, the
          later one $b$ — the corner triangles stop being congruent: one has
          legs $T-a$, the other legs $T-b$. Summing the two areas gives
          $\Pr(\text{meet}) = 1-((T-a)^{2}+(T-b)^{2})/(2T^{2})$.
      - ask: >
          A window $T=50$ minutes. One person waits $a=10$ minutes, the other
          $b=20$ minutes. What's $\Pr(\text{meet})$?
        expects: "1/2"
        tolerance: 0.0005
        hint: >
          Sum the two corner-triangle areas, $(T-a)^{2}/2$ and $(T-b)^{2}/2$,
          then divide by the full square's area.
        feedback: >
          $\Pr = 1-((50-10)^{2}+(50-20)^{2})/(2 \cdot 50^{2}) =
          1-(1600+900)/5000 = 1-2500/5000 = 1/2$.
      - teach: >
          Two traps sit close together here: taking the wrong root when solving
          $(1-t/T)^{2}=1/2$ (it must stay positive and below $1$), and averaging
          unequal patiences as $(a+b)/2$ instead of summing the two separate
          corner areas.


  - node: quant-probability.geometric.expected-separation
    hook: >
      Same square as the meeting problem, but now the interviewer wants a
      number rather than a yes/no event: "how far apart, on average, are
      two random arrival times" turns the corner-triangle picture into a
      full distribution.
    explanation: >
      Put $X, Y \sim U(0,1)$ independent and $D=|X-Y|$. The meeting
      problem's picture generalizes directly: $\{D>t\}$ is the same pair of
      corner triangles, now with legs $1-t$ for a general threshold, so
      $\Pr(D>t) = (1-t)^{2}$ for every $t$ in $[0,1]$ — the survival
      function of $D$. Differentiating (with the sign flip a survival
      function needs) gives density $f(t) = 2(1-t)$, decreasing linearly
      from $2$ at $t=0$ to $0$ at $t=1$.

      The mean follows fastest by integrating the tail rather than the
      density: for a nonnegative variable,
      $\mathbb{E}[D] = \int_{0}^{1} \Pr(D>t)\,dt = \int_{0}^{1}(1-t)^{2}\,dt
      = 1/3$ — a shortcut that avoids ever writing $t f(t)$.

      The same square answers two more questions for free. Since
      $\max(X,Y)+\min(X,Y) = X+Y$ has mean $1$ and $\max-\min=D$ has mean
      $1/3$, solving the pair gives $\mathbb{E}[\max] = 2/3$ and
      $\mathbb{E}[\min] = 1/3$. Rescaling to a $60$-minute window
      multiplies every length by $60$, so the mean gap there is $20$
      minutes.
    worked: >
      Two calls arrive independently and uniformly within an $8$-hour
      shift. Scaling to $t=3/8$,
      $\Pr(\text{gap}>3\text{ hours}) = (1-3/8)^{2} = (5/8)^{2} = 25/64
      \approx 0.3906$. The mean gap is $8/3 \approx 2.667$ hours.
    interview: >
      "What's the expected difference between two independent random times
      on $[0,T]$" wants $T/3$ stated immediately, with the tail-integral
      shortcut named as how you'd rederive it if pressed.
    pitfalls: >
      Integrating $t f(t)$ from scratch when the tail-integral shortcut
      $\int \Pr(D>t)\,dt$ is faster and less error-prone wastes time under
      pressure. Forgetting to rescale $D$'s mean by the window length $T$
      when the problem isn't stated on $[0,1]$ gives an answer off by a
      factor of $T$.
    recap: >
      The gap $D=|X-Y|$ between two uniform points has tail
      $\Pr(D>t)=(1-t)^{2}$ and mean $1/3$ — the meeting problem's band,
      integrated instead of just measured.
    steps:
      - teach: >
          Same square as the meeting problem, but now the interviewer wants a
          number rather than a yes/no event: how far apart, on average, are two
          random arrival times?
      - teach: >
          Put $X, Y \sim U(0,1)$ independent and $D=|X-Y|$. The meeting
          problem's corner triangles reappear directly: $\{D>t\}$ is that same
          pair, now with legs $1-t$, so $\Pr(D>t) = (1-t)^{2}$ for every $t$ in
          $[0,1]$ — the survival function of $D$, with density $f(t)=2(1-t)$.
      - teach: >
          The mean follows fastest by integrating the tail rather than the
          density: $\mathbb{E}[D] = \int_{0}^{1} \Pr(D>t)\,dt =
          \int_{0}^{1}(1-t)^{2}\,dt = 1/3$. The same square gives
          $\mathbb{E}[\max(X,Y)]=2/3$ and $\mathbb{E}[\min(X,Y)]=1/3$ for free,
          since $\max+\min=X+Y$ has mean $1$ and $\max-\min=D$ has mean $1/3$.
      - ask: >
          Two calls arrive independently and uniformly within a $40$-minute
          window. What's $\Pr(\text{gap}>10\text{ minutes})$?
        expects: "9/16"
        tolerance: 0.0005
        hint: >
          Rescale: the threshold as a fraction of the window is $10/40$, then
          apply $(1-t/T)^{2}$.
        feedback: >
          $\Pr(\text{gap}>10) = (1-10/40)^{2} = (0.75)^{2} = 0.5625 = 9/16$.
      - ask: >
          For that same $40$-minute window, what's the expected gap between the
          two calls?
        expects: "40/3"
        tolerance: 0.0005
        hint: >
          Rescale the unit-interval mean $1/3$ by the window length.
        feedback: >
          $\mathbb{E}[D]$ on $[0,1]$ is $1/3$; on a window of length $40$ every
          length scales by $40$, so the mean gap is $40/3 \approx 13.33$
          minutes.
      - teach: >
          Two traps: integrating $t f(t)$ from scratch when the tail-integral
          shortcut is faster, and forgetting to rescale $D$'s mean by the window
          length when the problem isn't stated on $[0,1]$ — either mistake is
          easy to make under time pressure.
      - ask: >
          For $X, Y \sim U(0,1)$ independent, what's $\mathbb{E}[\max(X,Y)]$?
        choices:
          - text: >
              $1/2$
            feedback: >
              That's the mean of a single uniform variable on $[0,1]$, not the
              mean of the larger of two — taking the max pulls the expectation
              up.
          - text: >
              $2/3$
            correct: true
            feedback: >
              Since $\max+\min=1$ in expectation and $\max-\min=1/3$ in
              expectation, solving the pair gives $\mathbb{E}[\max]=2/3$.
          - text: >
              $3/4$
            feedback: >
              This overshoots — $\max+\min$ has mean $1$ exactly, so $\max$ and
              $\min$ can't average $3/4$ and $1/4$ without breaking that
              identity given $\max-\min$'s mean of $1/3$.
        feedback: >
          $\mathbb{E}[\max(X,Y)]=2/3$ and $\mathbb{E}[\min(X,Y)]=1/3$ follow
          from the two identities $\max+\min=X+Y$ and $\max-\min=D$, with no
          separate integral needed.
      - teach: >
          The gap $D=|X-Y|$ is the meeting problem's band, read as a full
          distribution instead of a single yes/no event — same square, same
          corner triangles, one extra integral.


  - node: quant-probability.geometric.stick-triangle
    hook: >
      "Break a stick at two random points — what's the probability the
      three pieces form a triangle" punishes candidates who try to algebra
      through three separate inequalities instead of drawing the excluded
      regions.
    explanation: >
      Two uniform breaks $X,Y$ on $[0,1]$ give three pieces summing to
      $1$: $m=\min(X,Y)$, $M-m$, and $1-M$ where $M=\max(X,Y)$. Three
      positive lengths summing to a fixed total form a triangle exactly
      when no single piece reaches half the total — if one piece is at
      least half, the other two together can't exceed it, so that
      restatement, "no piece exceeds $1/2$," is the entire content of the
      problem.

      Translate each of the three failure conditions into a region of the
      $(X,Y)$ unit square. $m>1/2$ means both breaks landed in the right
      half — a quarter-square in one corner. $1-M>1/2$ means both landed
      in the left half — the opposite quarter-square. $M-m>1/2$ means the
      two breaks sit more than half the stick apart — the two corner
      triangles $|X-Y|>1/2$, together also a quarter of the square. These
      three regions are disjoint, since each pins down a different piece
      as the oversized one, and each has area $1/4$, so failure has
      probability $3/4$ and forming a triangle has probability exactly
      $1/4$.

      The boundary case where a piece equals exactly $1/2$ has probability
      $0$, so it never needs separate handling — the same reason
      boundaries never mattered for a uniform point in general.
    worked: >
      Rescale to a wire of length $12$, cut at two independent uniform
      points. No piece may exceed $6$. Each of the three excluded regions
      — both cuts right of $6$, both left of $6$, cuts more than $6$
      apart — has area $(12/2)^{2}=36$ in a total area $144$ square, three
      disjoint regions summing to $108$. The triangle-forming probability
      is $(144-108)/144 = 36/144 = 1/4$, unchanged from the unit stick,
      since only the ratio of areas ever mattered.
    interview: >
      "Break a stick in two places — probability of a triangle" wants
      "$1/4$, because no piece can exceed half" stated immediately, with
      the three-quarter-square picture offered as the justification.
    pitfalls: >
      Enumerating the triangle inequality's three separate conditions
      directly in $X,Y$ coordinates is far messier than the equivalent
      "no piece exceeds half" restatement. Missing that the three failure
      regions are disjoint, and double-counting an overlap that doesn't
      exist, is a common area-arithmetic slip.
    recap: >
      A stick broken at two uniform points forms a triangle with
      probability exactly $1/4$: no piece may exceed half, which excludes
      three disjoint quarters of the square.
    steps:
      - teach: >
          'Break a stick at two random points — what's the probability the three
          pieces form a triangle' punishes candidates who algebra through three
          separate inequalities instead of drawing the excluded regions.
      - teach: >
          Two uniform breaks $X,Y$ on $[0,1]$ give three pieces summing to $1$.
          Three positive lengths summing to a fixed total form a triangle
          exactly when no single piece reaches half the total — if one piece is
          at least half, the other two together can't exceed it.
      - teach: >
          Each of the three failure conditions is a quarter of the $(X,Y)$
          square: both breaks in the right half, both in the left half, or the
          two breaks more than half the stick apart. These three regions are
          disjoint, so failure has probability $3/4$ and forming a triangle has
          probability exactly $1/4$.
      - ask: >
          A carpenter saws a board of length $7$ meters at two independent
          random points. What's the probability the three pieces can be
          assembled into a triangular frame?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          The answer depends only on the ratio of areas in the unit square — it
          doesn't change with the stick's length.
        feedback: >
          Rescaling to a $7$-meter board changes every length by a factor of
          $7$, but only the ratio of the excluded area to the total ever
          mattered, so the probability is still $1/4$.
      - ask: >
          A stick of length $1$ is broken at $X=0.2$ and $Y=0.9$. Do the three
          pieces form a triangle?
        choices:
          - text: >
              Yes
            feedback: >
              The pieces are $0.2$, $0.7$, and $0.1$. The middle piece, $0.7$,
              exceeds half the stick, so the other two together ($0.3$) can't
              reach it — no triangle.
          - text: >
              No
            correct: true
            feedback: >
              With $m=0.2$ and $M=0.9$, the pieces are $0.2$, $0.7$, $0.1$;
              since $0.7>1/2$, that piece alone is too long for the other two to
              close the triangle.
        feedback: >
          With $m=0.2$ and $M=0.9$, the pieces are $0.2$, $0.7$, $0.1$; the
          $0.7$ piece exceeds $1/2$, landing this pair inside the excluded
          region $M-m>1/2$.
      - teach: >
          The most common slip is enumerating the triangle inequality's three
          separate conditions directly in $X,Y$ coordinates — far messier than
          the equivalent 'no piece exceeds half' restatement, and easy to
          double-count an overlap that doesn't actually exist among the three
          disjoint failure regions.
      - ask: >
          What's the probability that two uniform breaks do *not* leave pieces
          that form a triangle?
        expects: "3/4"
        tolerance: 0.0005
        hint: >
          It's the complement of the answer you already found.
        feedback: >
          Since forming a triangle has probability $1/4$, failing to has
          probability $1-1/4=3/4$ — the three disjoint quarter-square regions
          found above.
      - teach: >
          A stick broken at two uniform points forms a triangle with probability
          exactly $1/4$, unaffected by the stick's length, because only the
          ratio of areas in the unit square ever mattered.


  - node: quant-probability.geometric.stick-piece-lengths
    hook: >
      "What's the expected length of the biggest of the three pieces"
      tempts a symmetry answer of $1/2$ or $1/3$; the correct answer,
      $11/18$, is the standard trap for conflating "exchangeable" with
      "identically ranked."
    explanation: >
      The three spacings from the broken-stick picture — however dependent
      on each other — are exchangeable: no position among them is
      structurally favored by the breaking mechanism, so all three share
      the same mean, and since they sum to $1$, that shared mean must be
      $1/3$ each, with no integration required.

      Sorting destroys that symmetry. Picking "the shortest of the three"
      or "the longest of the three" is a selection rule, not a fixed
      piece, and selection is biased: the shortest spacing is pulled down
      because it was chosen for being small, and the longest is pulled up
      for the same reason in reverse — which is why
      $\mathbb{E}[\text{shortest}]=1/9$ and $\mathbb{E}[\text{longest}]=
      11/18$ sit far from the shared unsorted mean of $1/3$, while
      $\mathbb{E}[\text{middle}]=5/18$ lands close to it.

      The pattern extends to $n$ breaks: $n+1$ spacings each averaging
      $1/(n+1)$, the shortest averaging $1/(n+1)^{2}$ — squared down by
      the same selection bias — and the longest averaging
      $H_{n+1}/(n+1)$, inflated by the harmonic number. A single break
      ($n=1$) is the simplest case: two pieces average $1/2$ each, and the
      longer one averages $3/4$.
    worked: >
      Break a stick at $3$ independent uniform points ($n=3$), giving $4$
      spacings averaging $1/4$ each. The shortest spacing averages
      $1/16=0.0625$, and the longest averages
      $H_4/4=(1+1/2+1/3+1/4)/4=(25/12)/4=25/48\approx0.5208$ — already
      over half the stick, on average, from one competitively selected
      piece out of four.
    interview: >
      "What's the expected length of the longest of $n$ random pieces" is
      testing whether the harmonic-number answer $H_{n+1}/(n+1)$ is known
      to exist at all, versus defaulting to the naive, wrong $1/(n+1)$.
    pitfalls: >
      Assuming the sorted pieces share the unsorted mean $1/3$ (or
      $1/(n+1)$ generally) is the single most common error here — sorting
      is a biased selection, not a relabeling. Treating the three spacings
      as independent because they're exchangeable breaks any variance or
      joint calculation; they are exchangeable and dependent at once.
    recap: >
      Every piece averages $1/3$ by symmetry, yet sorting is biased: the
      longest of three averages $11/18$ and the shortest only $1/9$.
    steps:
      - teach: >
          'What's the expected length of the biggest of the three pieces' tempts
          a symmetry answer of $1/2$ or $1/3$; the correct answer, $11/18$, is
          the standard trap for conflating 'exchangeable' with 'identically
          ranked.'
      - teach: >
          The three spacings from two random breaks are exchangeable — no
          position among them is structurally favored — so they share the same
          mean, and since they sum to $1$, that shared mean must be $1/3$ each,
          with no integration required.
      - teach: >
          Sorting destroys that symmetry. Picking 'the shortest' or 'the
          longest' is a selection rule, not a fixed piece: the shortest is
          pulled down because it was chosen for being small, and the longest is
          pulled up for the same reason in reverse.
      - ask: >
          A stick is broken at a single uniform point, giving two pieces. What's
          the expected length of the longer piece?
        expects: "3/4"
        tolerance: 0.0005
        hint: >
          A single break's two pieces are $X$ and $1-X$; the longer one is
          $\max(X,1-X)$.
        feedback: >
          With one break, the two pieces average $1/2$ each unsorted, but the
          longer one, $\max(X,1-X)$, averages $3/4$ — sorting already inflates
          the mean with just two pieces.
      - ask: >
          For two independent uniform breaks (three pieces), what's the expected
          length of the *shortest* piece?
        expects: "1/9"
        tolerance: 0.0005
        hint: >
          The shortest piece is pulled well below the shared unsorted mean of
          $1/3$.
        feedback: >
          $\mathbb{E}[\text{shortest}] = 1/9$, far below the unsorted mean $1/3$
          — selecting for smallness biases the average down, well past the
          unsorted case.
      - teach: >
          The pattern extends to $n$ breaks: $n+1$ spacings each averaging
          $1/(n+1)$, the shortest averaging $1/(n+1)^{2}$, and the longest
          averaging $H_{n+1}/(n+1)$, the harmonic number inflating the average
          as more pieces compete.
      - ask: >
          The three spacings of a twice-broken stick are exchangeable, each
          averaging $1/3$. Does the *longest* spacing also average $1/3$?
        choices:
          - text: >
              Yes — exchangeability means every piece, sorted or not, shares the
              mean
            feedback: >
              Exchangeability gives the three *unsorted* spacings the same mean;
              sorting them into shortest/middle/longest is a selection rule that
              breaks this symmetry.
          - text: >
              No — sorting is a selection rule that biases the longest piece's
              average up, to $11/18$
            correct: true
            feedback: >
              Selecting 'the longest' picks out whichever spacing happened to be
              biggest on that trial, which systematically pulls its average
              above the shared unsorted mean of $1/3$.
          - text: >
              No — the three spacings aren't actually exchangeable
            feedback: >
              The spacings *are* exchangeable — no position is structurally
              favored by the breaking mechanism. That symmetry just doesn't
              survive sorting.
        feedback: >
          Exchangeable and dependent are compatible: the unsorted mean is $1/3$
          for each, but sorting is a biased selection, giving the longest a mean
          of $11/18$ and the shortest only $1/9$.
      - teach: >
          Every piece averages $1/3$ unsorted, by symmetry alone — but sorting
          turns a symmetric picture into a lopsided one, with the longest piece
          averaging nearly two-thirds of the stick.


  - node: quant-probability.geometric.stick-sequential-break
    hook: >
      "Break a stick, then break one of the pieces again" sounds like the
      same experiment as breaking it twice at once — it isn't, and the gap
      between $1/4$ and roughly $0.19$ or $0.39$ is exactly what an
      interviewer is probing by adding "in two stages" to the question.
    explanation: >
      Break once at $X \sim U(0,1)$, splitting the stick into a left piece
      of length $X$ and a right piece of length $1-X$. Always re-breaking
      the left piece uniformly along its own length, a triangle needs
      $X>1/2$ (so the untouched right piece is under half the stick) and
      the second break to land inside a window of length $1-X$ within a
      piece of length $X$, a conditional probability $(1-X)/X$.

      Integrating that conditional probability over $X$, weighted by its
      uniform density of $1$:
      $\Pr = \int_{1/2}^{1}(1-x)/x\,dx = [\ln x - x]_{1/2}^{1} =
      (0-1)-(-\ln 2-1/2) = \ln 2-1/2 \approx 0.193$ — the antiderivative
      $\ln x - x$ is the one load-bearing step.

      The mechanism is what changes the probability, not the words "break
      it twice at random": always re-breaking whichever piece happens to
      be longer, $L=\max(X,1-X)$ with density $2$ on $(1/2,1)$, gives a
      different integral and a different answer, $2\ln 2-1\approx0.386$ —
      roughly double the "always break left" answer, since operating on
      the longer piece systematically gives the second cut more room to
      balance the pieces.
    worked: >
      Suppose instead you always re-break the shorter piece, length
      $s=\min(X,1-X)$. The untouched piece then has length
      $1-s=\max(X,1-X)\ge 1/2$ always, so no matter where the second break
      lands, one piece is at least half the stick and the triangle
      inequality fails with probability $1$. This mechanism gives
      $\Pr(\text{triangle})=0$ exactly — the untouched longer piece alone
      kills every attempt.
    interview: >
      "Two-stage stick breaking" is a deliberate mechanism check: the
      interviewer wants the ambiguity noticed the moment a specific piece
      is singled out for the second cut, and the conditional-probability
      integral set up rather than the simultaneous-break answer $1/4$
      reused.
    pitfalls: >
      Reusing $1/4$ because the problem still says "break a stick at two
      random points" ignores that sequential re-breaking changes the
      sample space entirely. Treating the second break as uniform over the
      whole stick, rather than uniform within the chosen piece, misplaces
      the probability mass.
    recap: >
      Sequential breaking gives $\ln 2-1/2\approx0.193$ (re-break the left
      piece) or $2\ln 2-1\approx0.386$ (re-break the longer piece), and
      re-breaking the shorter piece gives exactly $0$ — the procedure, not
      the words, fixes the answer.
    steps:
      - teach: >
          'Break a stick, then break one of the pieces again' sounds like the
          same experiment as breaking it twice at once — it isn't, and the gap
          between $1/4$ and roughly $0.19$ or $0.39$ is exactly what an
          interviewer is probing by adding 'in two stages.'
      - teach: >
          Break once at $X \sim U(0,1)$, then always re-break the left piece
          uniformly along its own length. A triangle needs $X>1/2$ and the
          second break to land inside a window of length $1-X$ within a piece of
          length $X$ — a conditional probability $(1-X)/X$.
      - ask: >
          Integrating that conditional probability, $\int_{1/2}^{1}(1-x)/x\,dx$,
          to three decimals, what's $\Pr(\text{triangle})$ for the always-re-
          break-the-left-piece mechanism?
        expects: "0.193"
        tolerance: 0.0005
        hint: >
          The antiderivative of $(1-x)/x$ is $\ln x - x$; evaluate it at $1$ and
          at $1/2$.
        feedback: >
          $[\ln x - x]_{1/2}^{1} = (0-1)-(-\ln 2-1/2) = \ln 2-1/2 \approx
          0.193$.
      - teach: >
          Always re-breaking whichever piece happens to be *longer*,
          $L=\max(X,1-X)$ with density $2$ on $(1/2,1)$, gives a different
          integral entirely: $2\ln 2-1 \approx 0.386$, roughly double the
          always-break-left answer, since operating on the longer piece gives
          the second cut more room to balance the three lengths.
      - ask: >
          To three decimals, what's $\Pr(\text{triangle})$ for the always-re-
          break-the-longer-piece mechanism?
        expects: "0.386"
        tolerance: 0.0005
        hint: >
          The integral is $2\int_{1/2}^{1}(1-\ell)/\ell\,d\ell$, using the same
          antiderivative $\ln \ell - \ell$.
        feedback: >
          $2[\ln \ell - \ell]_{1/2}^{1} = 2(\ln 2-1/2) = 2\ln 2-1 \approx
          0.386$.
      - teach: >
          The trap is reusing $1/4$ because the problem still says 'break a
          stick at two random points' — sequential re-breaking changes the
          sample space entirely, and the specific piece chosen for the second
          cut is exactly what an ambiguous prompt is testing whether you'll
          notice.
      - ask: >
          If you always re-break whichever piece happens to be *shorter*, what's
          $\Pr(\text{triangle})$?
        choices:
          - text: >
              $0$
            correct: true
            feedback: >
              The untouched piece is then $\max(X,1-X) \ge 1/2$ always, so no
              matter where the second break lands, one piece is at least half
              the stick — the triangle inequality fails with probability $1$.
          - text: >
              $\ln 2-1/2 \approx 0.193$
            feedback: >
              That's the always-re-break-the-left-piece answer, a different
              mechanism from always re-breaking the shorter piece.
          - text: >
              $1/4$
            feedback: >
              That's the simultaneous two-break answer, which doesn't apply once
              the breaking happens sequentially in two stages.
        feedback: >
          Re-breaking the shorter piece leaves the longer piece untouched at
          length $\ge 1/2$, which alone is enough to kill every attempt at a
          triangle — $\Pr(\text{triangle})=0$ exactly.
      - teach: >
          Three mechanisms, three different answers from the same words: $\ln
          2-1/2$, $2\ln 2-1$, or exactly $0$. The procedure, not the phrase
          'break it twice,' fixes which one applies.


  - node: quant-probability.geometric.buffon
    hook: >
      "Design a physical experiment that estimates $\pi$" is standardly
      answered with Buffon's needle, and the real test is setting up the
      $(x,\theta)$ rectangle rather than quoting the formula from memory.
    explanation: >
      Two coordinates describe where a dropped needle lands: $x$, the
      distance from its center to the nearest line, uniform on $[0,d/2]$,
      and $\theta$, the acute angle it makes with the lines, uniform on
      $[0,\pi/2]$ and independent of $x$ — the pair is a uniform point in a
      $d/2$-by-$\pi/2$ rectangle, per the independent-coordinates
      translation. The needle crosses a line exactly when its
      half-length's vertical reach exceeds the distance to that line:
      $x \le (\ell/2)\sin\theta$.

      The favorable region sits under the curve $x=(\ell/2)\sin\theta$
      inside the rectangle, with area
      $\int_{0}^{\pi/2}(\ell/2)\sin\theta\,d\theta =
      (\ell/2)[-\cos\theta]_{0}^{\pi/2} = \ell/2$ — the one calculus step
      doing all the work, since sine's antiderivative evaluates cleanly at
      the quarter-turn. Dividing by the rectangle's total area
      $(\pi/2)(d/2)=\pi d/4$ gives $\Pr(\text{cross})=2\ell/(\pi d)$.

      The $\pi$ here comes purely from the rectangle's angle range, not
      from any circular geometry in the needle itself — which is exactly
      why the formula inverts cleanly: drop the needle $N$ times, count
      the crossing frequency $\hat{p}$, and
      $\pi \approx 2\ell/(d\hat{p})$ is a genuine, if slow-converging,
      Monte Carlo estimator.
    worked: >
      Take $\ell=3$, $d=5$, a needle shorter than the gap.
      $\Pr(\text{cross})=2(3)/(5\pi)=6/(5\pi)\approx0.3820$. If $1000$
      drops produce an observed crossing frequency of $0.38$, inverting
      gives $\pi \approx 2(3)/(5 \times 0.38) = 6/1.9 \approx 3.158$ — in
      the right neighborhood despite needing far more drops to tighten.
    interview: >
      "How would you estimate $\pi$ with a physical experiment" is
      answered with Buffon's needle; the interviewer listens for the
      $(x,\theta)$ rectangle and the $\sin\theta$ boundary curve, not just
      the formula $2\ell/(\pi d)$ recited cold.
    pitfalls: >
      Dropping the restriction $\ell \le d$ — needed so the needle can
      cross at most one line, keeping the crossing count a $0/1$ event —
      breaks the probability interpretation for a longer needle. Using the
      full angle range $[0,\pi]$ instead of the acute range $[0,\pi/2]$
      double-counts by symmetry and corrupts the area.
    recap: >
      The needle crosses a line with probability $2\ell/(\pi d)$, found as
      the area under $x=(\ell/2)\sin\theta$ inside the $(x,\theta)$
      rectangle — invertible into a Monte Carlo estimate of $\pi$.
    steps:
      - teach: >
          'Design a physical experiment that estimates $\pi$' is standardly
          answered with Buffon's needle, and the real test is setting up the
          $(x,\theta)$ rectangle rather than quoting the formula from memory.
      - teach: >
          Two coordinates describe where a dropped needle lands: $x$, the
          distance from its center to the nearest line, uniform on $[0,d/2]$,
          and $\theta$, the acute angle it makes with the lines, uniform on
          $[0,\pi/2]$ and independent of $x$. The needle crosses a line exactly
          when $x \le (\ell/2)\sin\theta$.
      - teach: >
          The favorable area sits under the curve $x=(\ell/2)\sin\theta$:
          $\int_{0}^{\pi/2}(\ell/2)\sin\theta\,d\theta = \ell/2$. Dividing by
          the rectangle's total area $(\pi/2)(d/2)=\pi d/4$ gives
          $\Pr(\text{cross})=2\ell/(\pi d)$.
      - ask: >
          A needle of length $\ell=4$ is dropped on lines spaced $d=6$ apart. To
          four decimals, what's $\Pr(\text{cross})$?
        expects: "0.4244"
        tolerance: 0.0005
        hint: >
          Plug $\ell=4$ and $d=6$ into $2\ell/(\pi d)$.
        feedback: >
          $2(4)/(6\pi) = 8/(6\pi) = 4/(3\pi) \approx 0.4244$.
      - ask: >
          If $\ell=7$ and $d=5$ — a needle longer than the gap — can $2\ell/(\pi
          d)$ still be read as a crossing *probability*?
        choices:
          - text: >
              Yes, the formula and its interpretation are unchanged
            feedback: >
              The derivation assumed a single crossing event; once $\ell>d$ the
              needle can cross more than one line, so the interpretation as a
              probability no longer holds.
          - text: >
              No — a longer needle can cross more than one line, so the crossing
              count is no longer a $0/1$ event
            correct: true
            feedback: >
              The restriction $\ell \le d$ is exactly what keeps 'crosses a
              line' a single event; past it, the formula still gives an expected
              *count*, not a probability.
          - text: >
              No — the integral $\int_{0}^{\pi/2}(\ell/2)\sin\theta\,d\theta$
              becomes undefined for $\ell>d$
            feedback: >
              The integral itself is still perfectly well defined for any $\ell$
              — what breaks is the *interpretation* of the result as a
              probability, not the calculus.
        feedback: >
          The restriction $\ell \le d$ is what keeps a crossing a single $0/1$
          event. Past it, the needle can cross more than once, and the same
          formula gives an expected count rather than a probability.
      - teach: >
          Because the $\pi$ here comes purely from the rectangle's angle range,
          the formula inverts cleanly: drop the needle $N$ times, count the
          crossing frequency $\hat p$, and $\pi \approx 2\ell/(d\hat p)$ is a
          genuine, if slow-converging, Monte Carlo estimator.
      - ask: >
          A needle with $\ell=2$ is dropped on lines spaced $d=4$ apart. Over
          $500$ drops the observed crossing frequency is $0.32$. What does
          inverting the formula estimate for $\pi$?
        expects: "3.125"
        tolerance: 0.0005
        hint: >
          Solve $\hat p = 2\ell/(\pi d)$ for $\pi$.
        feedback: >
          $\pi \approx 2\ell/(d\hat p) = 2(2)/(4 \times 0.32) = 4/1.28 = 3.125$
          — in the right neighborhood despite the slow convergence.
      - teach: >
          The needle crosses a line with probability $2\ell/(\pi d)$, found as
          the area under $x=(\ell/2)\sin\theta$ inside the $(x,\theta)$
          rectangle — and invertible, however slowly, into an estimate of $\pi$.


  - node: quant-probability.geometric.buffon-noodle
    hook: >
      "Does the needle have to be straight?" is the natural follow-up, and
      answering "no, only total length matters" with the linearity
      argument, not just the claim, is what separates memorization from
      understanding.
    explanation: >
      Approximate any rigid curve of length $\ell$ by a chain of short
      straight segments; the whole curve's crossing count is the sum of
      the segments' crossing counts. Expectation is additive over that sum
      regardless of dependence between the pieces — and here the pieces
      are about as dependent as random variables get, rigidly attached to
      one curve moving as a single random object — so the expected total
      is just the sum of each segment's expected crossings.

      Each short segment is effectively a tiny needle, whose expected
      crossing count is its own $2(\text{length})/(\pi d)$, since a short
      enough segment crosses at most once and expectation equals
      probability there. Summing those small lengths recovers the curve's
      total length $\ell$, so the expected crossing count is exactly
      $2\ell/(\pi d)$ for any shape, with no restriction $\ell \le d$ — a
      longer or curled curve can cross more than once, and the formula now
      counts crossings rather than a single crossing probability.

      The circle check pins the constant with no probability at all: a
      circle of diameter $d$ has circumference $\pi d$ and crosses every
      line placement at exactly two points, deterministically, so its
      expected count is exactly $2$ — and $2(\pi d)/(\pi d)=2$ matches on
      the nose.
    worked: >
      A small square wire loop has side $d/4$, so perimeter $\ell=d$.
      Expected crossings $=2d/(\pi d)=2/\pi\approx0.6366$ — identical to a
      straight needle of length $d$, even though the loop's actual
      crossing count on any given drop is random, $0$ or $2$, since a
      small convex loop either straddles a line or misses it entirely.
      Only the expectation, and only the length, is pinned down.
    interview: >
      "Does Buffon's formula need a straight needle" wants "no, only total
      length matters" stated with the segment-additivity argument, and the
      circle check volunteered as the sanity test.
    pitfalls: >
      Assuming the segments' crossings must be independent for expectation
      to add is backwards — additivity of expectation never needs
      independence, only additivity of the underlying quantity. Carrying
      the $\ell \le d$ restriction from the straight-needle case over to
      the noodle is unnecessary, since the noodle formula counts
      crossings, which can exceed $1$.
    recap: >
      Expected crossings for any rigid curve of length $\ell$ are
      $2\ell/(\pi d)$ regardless of shape, since expectation sums over
      tiny straight segments however dependent they are — the circle of
      diameter $d$, crossing twice always, pins the constant.
    steps:
      - teach: >
          'Does the needle have to be straight?' is the natural follow-up, and
          answering 'no, only total length matters' with the linearity argument,
          not just the claim, is what separates memorization from understanding.
      - teach: >
          Approximate any rigid curve of length $\ell$ by a chain of short
          straight segments; the whole curve's crossing count is the sum of the
          segments' crossing counts. Expectation is additive over that sum
          regardless of dependence between the pieces, however rigidly they're
          attached to one moving curve.
      - teach: >
          Each short segment is effectively a tiny needle, with expected
          crossings $2(\text{length})/(\pi d)$. Summing those lengths recovers
          the curve's total length $\ell$, so the expected crossing count is
          exactly $2\ell/(\pi d)$ for *any* shape, with no restriction $\ell \le
          d$.
      - ask: >
          A circle has diameter equal to the line spacing $d$. What's its
          expected number of crossings?
        expects: "2"
        hint: >
          A circle of diameter $d$ has circumference $\pi d$ and crosses every
          line placement at exactly two points, with no randomness at all.
        feedback: >
          Circumference is $\pi d$, and every placement of the circle crosses
          exactly two points deterministically, so $2(\pi d)/(\pi d)=2$ —
          matching the formula on the nose, with no probability involved.
      - ask: >
          A semicircular arc has diameter equal to the line spacing $d$. What's
          its expected number of crossings?
        expects: "1"
        hint: >
          The arc length of a semicircle of diameter $d$ is $\pi d/2$ — half the
          full circle's circumference.
        feedback: >
          The arc's length is $\pi(d/2) = \pi d/2$, so expected crossings are
          $2(\pi d/2)/(\pi d) = 1$ — half the full circle's count, matching its
          half length.
      - teach: >
          Assuming the segments' crossings must be independent for expectation
          to add is backwards — additivity of expectation never needs
          independence, only additivity of the underlying quantity being summed.
      - ask: >
          Why does the expected total crossing count add across the curve's tiny
          segments, even though those segments' crossing *events* are highly
          dependent — rigidly attached to one curve moving as a single random
          object?
        choices:
          - text: >
              Because linearity of expectation requires the pieces to be
              independent
            feedback: >
              Backwards — linearity of expectation holds for *any* collection of
              random variables, dependent or not; independence is never a
              requirement for a sum of expectations.
          - text: >
              Because expectation is additive over a sum regardless of
              dependence
            correct: true
            feedback: >
              Additivity of expectation only needs the *quantities* being summed
              to add up correctly — which they do here, since total crossings is
              exactly the sum of each segment's crossings.
          - text: >
              Because each segment's crossing count doesn't depend on the
              curve's overall shape
            feedback: >
              Each segment's own expected crossing count is set only by its own
              length, true — but that's not why the *sum* is valid; the sum is
              valid because expectation always adds, dependent pieces or not.
        feedback: >
          Linearity of expectation holds with no independence assumption at all
          — it's exactly why a formula this simple survives pieces this tangled
          together.
      - teach: >
          Expected crossings for any rigid curve of length $\ell$ are
          $2\ell/(\pi d)$ regardless of shape — the circle of diameter $d$,
          crossing twice on every drop with no randomness left, is what pins the
          constant down.


  - node: quant-probability.geometric.uniform-in-disc
    hook: >
      "Generate a uniform random point in a circle" is a live coding
      question as much as a probability one, and the standard wrong answer
      — sample the radius uniformly — is exactly what this density
      explains.
    explanation: >
      For $P$ uniform on a disc of radius $R$, apply the uniform-point
      definition directly to the sub-disc of radius $r$:
      $\Pr(D \le r) = (\text{area of radius-}r\text{ disc})/(\text{area of
      radius-}R\text{ disc}) = \pi r^{2}/\pi R^{2} = r^{2}/R^{2}$. That is
      $D=|P|$'s CDF; differentiating gives density $f(r)=2r/R^{2}$, which
      rises linearly rather than staying flat.

      The rise follows from the shape of the region alone: the
      circumference available at radius $r$ is $2\pi r$, growing linearly
      with $r$, so there is proportionally more room for a uniformly
      scattered point to land far from the center than close to it —
      density has to grow to match the growing area at each radius.

      Integrating $r$ against that density gives
      $\mathbb{E}[D]=\int_{0}^{R} r \cdot (2r/R^{2})\,dr = 2R/3$, and
      setting $r^{2}/R^{2}=1/2$ gives median $R/\sqrt{2}\approx0.707R$ —
      half the disc's probability mass sits in the outer $29\%$ of the
      radius. The angle is uniform on $[0,2\pi)$ and independent of $D$,
      by the same rotational symmetry that makes direction irrelevant to
      the disc's boundary.
    worked: >
      Take $R=6$. $\Pr(D\le3)=(3/6)^{2}=1/4$, the median is
      $6/\sqrt{2}=3\sqrt{2}\approx4.243$, and $\mathbb{E}[D]=2(6)/3=4$ —
      the average distance from center sits noticeably beyond the radius's
      midpoint, consistent with density growing outward.
    interview: >
      "Sample a uniform point in a disc" wants the inverse-CDF fix
      $r=R\sqrt{U}$ named on sight, plus the reason the naive
      $r\sim U(0,R)$ is wrong: it ignores the linearly growing density and
      crowds points near the center.
    pitfalls: >
      Sampling $r\sim U(0,R)$ directly is the standard bug, treating
      radius as if it carried the disc's uniform density when density
      actually grows as $2r/R^{2}$. Confusing the median $R/\sqrt{2}$ with
      the mean $2R/3$ — close in value but from different integrals — is
      the other common slip.
    recap: >
      Radius is not uniform on a uniform disc — density $2r/R^{2}$, mean
      $2R/3$, median $R/\sqrt{2}$ — which is why naive radius sampling
      crowds the center and the fix is $r=R\sqrt{U}$.
    steps:
      - teach: >
          'Generate a uniform random point in a circle' is a live coding
          question as much as a probability one, and the standard wrong answer —
          sample the radius uniformly — is exactly what this density explains.
      - teach: >
          For $P$ uniform on a disc of radius $R$, apply the ratio rule directly
          to the sub-disc of radius $r$: $\Pr(D \le r) = \pi r^{2}/\pi R^{2} =
          r^{2}/R^{2}$. Differentiating gives density $f(r)=2r/R^{2}$, rising
          linearly rather than staying flat — more circumference is available
          further out, so there's proportionally more room to land there.
      - ask: >
          For a disc of radius $R=10$, what's $\Pr(D \le 4)$?
        expects: "4/25"
        tolerance: 0.0005
        hint: >
          Apply $r^{2}/R^{2}$ directly.
        feedback: >
          $\Pr(D \le 4) = (4/10)^{2} = 16/100 = 4/25$.
      - teach: >
          Integrating $r$ against that density gives $\mathbb{E}[D]=2R/3$, and
          the median is $R/\sqrt{2}\approx0.707R$ — half the disc's probability
          mass sits in the outer $29\%$ of the radius. The angle is uniform on
          $[0,2\pi)$ and independent of $D$, by the same rotational symmetry.
      - ask: >
          For a disc of radius $R=10$, what's $\mathbb{E}[D]$, the expected
          distance from the center?
        expects: "20/3"
        tolerance: 0.0005
        hint: >
          Use $\mathbb{E}[D]=2R/3$.
        feedback: >
          $\mathbb{E}[D] = 2(10)/3 = 20/3 \approx 6.667$ — noticeably beyond the
          radius's midpoint of $5$, consistent with density growing outward.
      - teach: >
          The standard sampling bug is drawing $r \sim U(0,R)$ directly, which
          treats radius as though it carried the disc's flat density and crowds
          points near the center. The fix respects the true density $2r/R^{2}$
          instead.
      - ask: >
          Which transform of a uniform $U \sim U(0,1)$ gives a correctly-
          distributed radius for a uniform point in a disc of radius $R$?
        choices:
          - text: >
              $r = RU$
            feedback: >
              This is the standard bug — it makes $r$ itself uniform on $[0,R]$,
              which crowds points near the center since it ignores the density's
              linear growth with $r$.
          - text: >
              $r = R\sqrt{U}$
            correct: true
            feedback: >
              Setting $\Pr(R\sqrt{U} \le r) = \Pr(U \le r^{2}/R^{2}) =
              r^{2}/R^{2}$ matches the true CDF exactly.
          - text: >
              $r = RU^{2}$
            feedback: >
              This crowds points even more heavily near the center than the
              naive bug does, pushing probability the wrong direction entirely.
        feedback: >
          $r=R\sqrt{U}$ is the fix: it reproduces the CDF $r^{2}/R^{2}$ exactly,
          spreading points outward to match the disc's growing circumference.
      - teach: >
          Radius is not uniform on a uniform disc — density $2r/R^{2}$, mean
          $2R/3$, median $R/\sqrt{2}$ — which is exactly why naive radius
          sampling crowds the center.


  - node: quant-probability.geometric.bertrand-paradox
    hook: >
      "Draw a chord at random — what's the probability it's longer than
      the inscribed triangle's side" is the canonical
      answer-changes-with-the-mechanism question, and refusing to answer
      without naming a mechanism is itself the correct move.
    explanation: >
      All three classical mechanisms reduce to the same area-ratio
      technique in different coordinates. Fixing one endpoint and drawing
      the other uniformly on the circle makes chord length a function of a
      single uniform angle; the long-chord event is an arc, giving $1/3$.
      Picking a uniform radius direction, then a point uniform along it,
      with the chord perpendicular there, makes length a function of a
      single uniform distance from center; the long-chord event is an
      interval, giving $1/2$. Taking the chord's midpoint uniform in the
      disc makes length a function of the midpoint's distance from center
      via the disc's area ratio $r^{2}/R^{2}$, giving $1/4$.

      The second mechanism is worth connecting to a uniform point in a
      disc directly: "a uniform radius, then a uniform point along it" is
      exactly the naive, center-avoiding way to sample a disc point
      flagged there as a coding bug — except here it isn't a bug, because
      the mechanism legitimately defines "random chord" rather than
      attempting to sample a uniform disc point. The construction that
      under-samples the center for a uniform disc point is a perfectly
      valid, different experiment when the target object is a chord
      instead.

      All three answers are correct for the mechanism that produced them;
      there is no single "right" answer to "a random chord" until a
      physical procedure — a spinning arrow, a dropped straw, a dart aimed
      at the disc's interior — pins one down.
    worked: >
      What's the probability a random chord is longer than the circle's
      radius $R$ itself? Endpoint mechanism: central angle
      $\psi \sim U(0,\pi)$, chord $=2R\sin(\psi/2)$, and
      $\sin(\psi/2)>1/2$ holds for $\psi > \pi/3$, probability $2/3$.
      Radius mechanism:
      distance $x_{0}\sim U(0,R)$, condition $x_{0} < R\sqrt{3}/2$,
      probability $\sqrt{3}/2\approx0.866$. Midpoint mechanism:
      probability $(\sqrt{3}/2)^{2}=3/4$. Three mechanisms, three more
      distinct numbers — $2/3$, $\sqrt{3}/2$, $3/4$ — for the identical
      question.
    interview: >
      "What's the probability a random chord is longer than [some
      length]" should trigger "that depends on how the chord is
      generated" before any computation; naming two or three mechanisms
      with their differing answers is the strong response, silently
      picking one is the weak one.
    pitfalls: >
      Treating Bertrand's paradox as a trick with one "real" answer misses
      the point — all three are correct computations on their own sample
      space. Applying the disc's uniform-point density $r^{2}/R^{2}$ to
      the radius mechanism, which is uniform in $x_{0}$ directly rather
      than in $x_{0}^{2}$, swaps the two mechanisms' answers.
    recap: >
      The same words give $1/3$, $1/2$ or $1/4$ for the chord problem
      depending on the mechanism — endpoint, radius, or midpoint — because
      "at random" never specified a distribution by itself.
    steps:
      - teach: >
          'Draw a chord of a circle at random — what's the chance it's longer
          than the inscribed equilateral triangle's side' is the canonical
          answer-changes-with-the-mechanism question, and refusing to answer
          without naming a mechanism is itself the correct move.
      - teach: >
          Fix one endpoint and draw the other uniformly on the circle. Chord
          length is then a function of a single uniform central angle, and the
          long-chord event is the opposite $120^{\circ}$ arc — an arc, giving
          probability $1/3$.
      - ask: >
          Using the endpoint mechanism, what's the probability a random chord is
          longer than the side of the inscribed equilateral triangle?
        expects: "1/3"
        hint: >
          The favorable event is the second endpoint landing in a $120^{\circ}$
          arc out of the full $360^{\circ}$.
        feedback: >
          The opposite $120^{\circ}$ arc out of a full circle gives $120/360 =
          1/3$.
      - teach: >
          Pick a uniform radius direction, then a point uniform along it, with
          the chord perpendicular there — length is now a function of a single
          uniform distance from center, an interval, giving $1/2$. Or take the
          chord's midpoint uniform in the disc — length is a function of the
          midpoint's distance via the disc's area ratio, giving $1/4$.
      - ask: >
          Using the midpoint mechanism, what's the probability?
        expects: "1/4"
        hint: >
          The long-chord event is the midpoint falling inside a concentric disc
          of half the radius.
        feedback: >
          The chord is long exactly when its midpoint lies within $R/2$ of the
          center, an area ratio $(R/2)^{2}/R^{2} = 1/4$.
      - teach: >
          Notice the radius mechanism's 'uniform radius, then uniform point
          along it' is exactly the center-avoiding construction flagged
          elsewhere as a sampling bug for a uniform disc point — except here it
          isn't a bug, since the mechanism legitimately defines 'random chord'
          rather than attempting to sample a disc point.
      - ask: >
          Which mechanism makes chord length a function of a uniform distance
          from the center, giving probability $1/2$?
        choices:
          - text: >
              The endpoint mechanism
            feedback: >
              That mechanism makes length a function of a uniform *angle*,
              giving $1/3$, not a distance.
          - text: >
              The radius mechanism
            correct: true
            feedback: >
              A uniform point along a fixed radius direction is a uniform
              distance from the center, and the long-chord condition is an
              interval on that distance, giving $1/2$.
          - text: >
              The midpoint mechanism
            feedback: >
              That mechanism makes length a function of the midpoint's distance
              via an *area* ratio in the disc, giving $1/4$, not $1/2$.
        feedback: >
          The radius mechanism turns length into a function of a single uniform
          distance, and the long-chord event is a plain interval on that
          distance — $1/2$.
      - teach: >
          All three answers — $1/3$, $1/2$, $1/4$ — are correct for the
          mechanism that produced them. There is no single 'right' answer to 'a
          random chord' until a physical procedure pins one down.


  - node: quant-probability.geometric.specify-the-mechanism
    hook: >
      This is the sentence that turns a probability interview from a
      guessing game into a scored conversation: say out loud which
      quantity is being treated as uniform before computing anything.
    explanation: >
      Bertrand's chord and the two-stage broken stick are the same lesson
      told twice: a continuous "at random" claim only means something once
      the variable it's uniform in is named, and reparameterizing changes
      the answer because a nonlinear change of variable destroys
      uniformity. If $X$ is uniform and $Y=g(X)$ for nonlinear $g$, $Y$'s
      density is $1/|g'(g^{-1}(y))|$, which is generally not constant — so
      "uniform in $X$" essentially never implies "uniform in $g(X)$" once
      $g$ bends.

      A small check makes this concrete: if $\theta$ is uniform on
      $[0,\pi]$, is $\cos\theta$ uniform on $[-1,1]$? No — cosine is a
      nonlinear, monotonic map, and the resulting density on $[-1,1]$
      grows near the endpoints rather than staying flat, so values of
      $\cos\theta$ near $\pm1$ are more common than values near $0$, the
      opposite of what "uniform" suggests.

      The interview move that follows is explicit: state the mechanism
      being assumed — which physical action, drop, spin or cut, generates
      which uniform coordinate — before computing, and if the prompt is
      genuinely ambiguous, say so and commit to the version being solved.
      A stated physical procedure is what fixes the measure in the first
      place, which is why Buffon's needle has exactly one answer and
      Bertrand's chord has three.
    worked: >
      With $\theta \sim U(0,\pi)$, compute $\Pr(\cos\theta>0.5)$ two ways.
      Correctly: $\cos\theta>0.5$ exactly when $\theta<\pi/3$, so
      $\Pr(\theta<\pi/3)=(\pi/3)/\pi=1/3$. Incorrectly assuming
      $\cos\theta$ is itself uniform on $[-1,1]$: the fraction of $[-1,1]$
      above $0.5$ is $0.5/2=1/4$. The two answers, $1/3$ and $1/4$, differ
      because cosine concentrates probability near $\pm1$ rather than
      spreading it evenly.
    interview: >
      When a prompt says "at random" with no further qualifier, naming the
      mechanism before computing — and flagging genuine ambiguity rather
      than silently picking one — is exactly the behavior these paradox
      questions are screening for.
    pitfalls: >
      Assuming a monotonic transformation of a uniform variable stays
      uniform is the root error behind both Bertrand and the sequential
      stick break. Silently picking a mechanism without saying so loses
      credit even when the arithmetic that follows is correct, since the
      interviewer can't tell the ambiguity was understood.
    recap: >
      Name the sampling mechanism before computing: a nonlinear
      reparameterization changes what "uniform" means, and with it the
      answer.
    steps:
      - teach: >
          This is the sentence that turns a probability interview from a
          guessing game into a scored conversation: say out loud which quantity
          is being treated as uniform before computing anything.
      - teach: >
          A continuous 'at random' claim only means something once the variable
          it's uniform in is named. If $X$ is uniform and $Y=g(X)$ for a
          nonlinear $g$, $Y$'s density is generally not constant — so 'uniform
          in $X$' essentially never implies 'uniform in $g(X)$' once $g$ bends.
      - teach: >
          Near the ends of a nonlinear map's domain, $g$ often changes slowly,
          so a *wide* range of $X$ values crowds into a *narrow* range of $g(X)$
          values — that's exactly where probability piles up under the
          transformed variable, even though nothing piled up under the original
          one.
      - ask: >
          Let $\theta \sim U(0, \pi/2)$. What's $\Pr(\sin\theta > 0.5)$,
          computed correctly in $\theta$?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          $\sin\theta > 0.5$ exactly when $\theta > \pi/6$, since sine is
          increasing on this interval.
        feedback: >
          $\sin\theta>0.5 \iff \theta>\pi/6$, so $\Pr(\theta>\pi/6) =
          (\pi/2-\pi/6)/(\pi/2) = (\pi/3)/(\pi/2) = 2/3$.
      - ask: >
          For that same $\theta \sim U(0,\pi/2)$, what would you get for
          $\Pr(\sin\theta>0.5)$ if you (incorrectly) treated $\sin\theta$ as
          uniform on $[0,1]$?
        expects: "1/2"
        tolerance: 0.0005
        hint: >
          Under that wrong assumption, just take the fraction of $[0,1]$ lying
          above $0.5$.
        feedback: >
          The fraction of $[0,1]$ above $0.5$ is $0.5$, i.e. $1/2$ — different
          from the correct $2/3$, because $\sin\theta$ is not actually uniform
          on $[0,1]$.
      - teach: >
          The interview move is explicit: state the mechanism being assumed —
          which physical action generates which uniform coordinate — before
          computing, and if the prompt is genuinely ambiguous, say so and commit
          to the version being solved.
      - ask: >
          If $\theta \sim U(0,\pi)$, is $\cos\theta$ uniform on $[-1,1]$?
        choices:
          - text: >
              Yes, since $\theta$ itself is uniform
            feedback: >
              Uniformity in $\theta$ says nothing about uniformity in a
              nonlinear function of $\theta$ — cosine bends, so the density
              doesn't carry over.
          - text: >
              No — cosine is a nonlinear monotonic map, so probability
              concentrates near $\pm 1$ rather than staying flat
            correct: true
            feedback: >
              Cosine changes slowly near $\theta=0$ and $\theta=\pi$, so a wide
              range of $\theta$ crowds into values of $\cos\theta$ near $\pm1$,
              inflating the density there.
          - text: >
              No, because cosine is not monotonic on $[0,\pi]$
            feedback: >
              Cosine *is* monotonic (decreasing) on all of $[0,\pi]$ — the
              reason $\cos\theta$ fails to be uniform is the curvature of the
              map, not a failure of monotonicity.
        feedback: >
          A stated physical procedure is what fixes the measure in the first
          place, which is why Buffon's needle has exactly one answer and
          Bertrand's chord has three.
      - teach: >
          Name the sampling mechanism before computing: a nonlinear
          reparameterization changes what 'uniform' means, and with it the
          answer.


  - node: quant-probability.geometric.semicircle
    hook: >
      "What's the probability $n$ random points on a circle all fall
      within some semicircle" looks like it needs inclusion-exclusion over
      $n$ overlapping arcs — a disjointness trick collapses it to a
      one-line sum instead.
    explanation: >
      Place $n$ points independently and uniformly on a circle. For each
      point $i$, let $A_i$ be the event that all $n-1$ other points fall
      in the semicircle that starts at point $i$ and runs clockwise. Each
      other point independently has probability $1/2$ of landing in that
      specific semicircle, so $\Pr(A_i)=(1/2)^{n-1}$.

      The load-bearing step is that the $A_i$ are pairwise disjoint. If
      some semicircle does cover all $n$ points, its clockwise-most point
      is uniquely determined — call it the anchor — and only the event
      $A_i$ for that specific anchor can hold, since starting the
      semicircle at any other point either excludes the anchor itself or
      fails to be the clockwise-most valid choice. So "all points lie in
      some semicircle" is exactly the disjoint union of the $n$ events
      $A_i$.

      Disjoint events add:
      $\Pr(\text{all in one semicircle}) = \sum \Pr(A_i) = n \cdot
      (1/2)^{n-1} = n/2^{n-1}$. Coincident points have probability $0$, so
      the anchor is well defined with probability $1$, and the sum never
      has to worry about ties.
    worked: >
      For $n=5$ points, $\Pr(\text{all in one semicircle}) = 5/2^{4} =
      5/16 = 0.3125$ — already below the $n=3$ value of $3/4$, showing how
      fast the probability collapses as more points compete to land on
      the same side.
    interview: >
      "$n$ points dropped uniformly on a circle — probability they all fit
      in a semicircle" wants $n/2^{n-1}$ stated directly, with the
      anchor/disjointness argument as the one-line justification, rather
      than an attempted inclusion-exclusion over $n$ overlapping arcs.
    pitfalls: >
      Attempting inclusion-exclusion over the $n$ semicircle events,
      instead of noticing they're already disjoint, wastes time and
      invites an arithmetic error. Using $(1/2)^{n}$ instead of
      $(1/2)^{n-1}$ forgets that only the other $n-1$ points, not the
      anchor itself, need to be checked.
    recap: >
      $n$ uniform points on a circle all lie in one semicircle with
      probability $n/2^{n-1}$, found by summing $n$ disjoint "anchor"
      events rather than any inclusion-exclusion.
    steps:
      - teach: >
          'What's the probability $n$ random points on a circle all fall within
          some semicircle' looks like it needs inclusion-exclusion over $n$
          overlapping arcs — a disjointness trick collapses it to a one-line sum
          instead.
      - teach: >
          For each point $i$, let $A_i$ be the event that the other $n-1$ points
          all fall in the semicircle starting at point $i$ and running
          clockwise. Each other point independently has probability $1/2$ of
          landing there, so $\Pr(A_i)=(1/2)^{n-1}$.
      - teach: >
          The $A_i$ are pairwise disjoint: if some semicircle covers all $n$
          points, its clockwise-most point is uniquely determined as the anchor,
          so only the event $A_i$ for that specific anchor can hold. 'All points
          lie in some semicircle' is exactly the disjoint union of the $n$
          events $A_i$.
      - ask: >
          For $n=4$ points placed independently and uniformly on a circle,
          what's the probability all four lie in some semicircle?
        expects: "1/2"
        tolerance: 0.0005
        hint: >
          Use $n/2^{n-1}$.
        feedback: >
          $4/2^{3} = 4/8 = 1/2$.
      - ask: >
          For $n=6$ points, what's the probability all six lie in some
          semicircle?
        expects: "3/16"
        tolerance: 0.0005
        hint: >
          Use $n/2^{n-1}$.
        feedback: >
          $6/2^{5} = 6/32 = 3/16$.
      - teach: >
          Disjoint events add, so $\Pr(\text{all in one semicircle}) = \sum
          \Pr(A_i) = n \cdot (1/2)^{n-1} = n/2^{n-1}$. Coincident points have
          probability $0$, so the anchor is well defined and the sum never has
          to worry about ties.
      - ask: >
          Why are the events $A_i$ pairwise disjoint?
        choices:
          - text: >
              Because each other point independently has probability $1/2$ of
              landing in a given semicircle
            feedback: >
              That fact gives $\Pr(A_i)=(1/2)^{n-1}$ for each individual event —
              it doesn't by itself say anything about two different $A_i$'s
              overlapping.
          - text: >
              Because if a covering semicircle exists, its clockwise-most point
              uniquely anchors it, so only one $A_i$ can hold at a time
            correct: true
            feedback: >
              The anchor is uniquely determined whenever a covering semicircle
              exists, so at most one of the $n$ events $A_i$ can be true on any
              given outcome.
          - text: >
              Because the events are defined for different points $i$, so they
              can't overlap by definition
            feedback: >
              Being indexed by different points doesn't automatically make
              events disjoint — it's the unique-anchor argument that forces at
              most one $A_i$ to hold.
        feedback: >
          The clockwise-most point of any covering semicircle is unique, so at
          most one $A_i$ holds at a time — that's what lets the probabilities
          simply add.
      - teach: >
          $n$ uniform points on a circle all lie in one semicircle with
          probability $n/2^{n-1}$, found by summing $n$ disjoint anchor events
          rather than any inclusion-exclusion.


  - node: quant-probability.geometric.triangle-contains-centre
    hook: >
      "Does a random inscribed triangle contain the circle's center"
      sounds like a fresh geometry problem, but it is the semicircle
      result read backward through its complement — recognizing that is
      the entire solution.
    explanation: >
      Three points uniform on a circle form a triangle, and that triangle
      contains the center exactly when the three points do not all lie in
      a common semicircle. If all three bunch into some semicircle,
      everything sits to one side of the diameter bounding it, so the
      center — on the empty side — falls outside the triangle; if no
      semicircle contains all three, every direction from the center has a
      point beyond it, forcing the triangle to wrap around and enclose it.

      That equivalence turns the question into the complement of the
      $n=3$ semicircle probability already found:
      $\Pr(\text{contains center}) = 1-3/2^{2}=1-3/4=1/4$. No new area
      computation is needed, only the link between "surrounds the center"
      and "doesn't fit in a semicircle."

      The same complement argument scales to $n$ points: the convex hull
      of $n$ uniform points on the circle contains the center with
      probability $1-n/2^{n-1}$, already about $0.98$ by $n=10$ — a random
      polygon almost certainly surrounds the center once it has enough
      vertices. The analogous question for points scattered inside the
      disc, rather than on its boundary, is substantially harder — four
      uniform points in a disc are in convex position with probability
      $1-35/(12\pi^{2})\approx0.7045$, Sylvester's four-point problem —
      and is worth knowing exists rather than re-deriving.
    worked: >
      For $n=5$ points uniform on a circle,
      $\Pr(\text{convex hull contains center}) = 1-5/2^{4}=1-5/16=11/16=
      0.6875$ — already well above $1/2$ with just five points, against
      the exact $1/4$ for a triangle.
    interview: >
      "Does a random inscribed polygon contain the center" should
      immediately connect to the semicircle result via its complement;
      stating "$1$ minus the semicircle probability" cold is the tell that
      the two questions are seen as one.
    pitfalls: >
      Computing $\Pr(\text{contains center})$ via a fresh area integral,
      instead of recognizing it as the semicircle complement, redoes work
      that's already done. Reporting $n/2^{n-1}$ itself as the containment
      probability, rather than $1$ minus it, flips the answer.
    recap: >
      A random inscribed triangle contains the center with probability
      $1/4$, the semicircle probability's complement; the general
      $n$-point version is $1-n/2^{n-1}$.
    steps:
      - teach: >
          'Does a random inscribed triangle contain the circle's center' sounds
          like a fresh geometry problem, but it's the semicircle result read
          backward through its complement — recognizing that is the entire
          solution.
      - teach: >
          Three points uniform on a circle form a triangle containing the center
          exactly when the three points do *not* all lie in a common semicircle.
          If they bunch into one semicircle, the center sits on the empty side,
          outside the triangle; otherwise every direction from the center has a
          point beyond it, forcing the triangle to wrap around and enclose it.
      - teach: >
          That equivalence turns the question into the complement of the
          semicircle probability already found: $\Pr(\text{contains center}) =
          1-n/2^{n-1}$ for $n$ points on the circle. No new area computation is
          needed, only the link between 'surrounds the center' and 'doesn't fit
          in a semicircle.'
      - ask: >
          For $n=4$ points uniform on a circle, what's the probability their
          convex hull contains the center?
        expects: "1/2"
        tolerance: 0.0005
        hint: >
          Take $1$ minus the $n=4$ semicircle probability.
        feedback: >
          $1-4/2^{3} = 1-4/8 = 1-1/2 = 1/2$.
      - ask: >
          For $n=6$ points uniform on a circle, what's the probability their
          convex hull contains the center?
        expects: "13/16"
        tolerance: 0.0005
        hint: >
          Take $1$ minus the $n=6$ semicircle probability.
        feedback: >
          $1-6/2^{5} = 1-6/32 = 1-3/16 = 13/16$.
      - teach: >
          Two traps sit right next to each other here: reporting $n/2^{n-1}$
          itself as the containment probability instead of $1$ minus it, and
          using $(1/2)^{n}$ in place of $(1/2)^{n-1}$ inside that formula — both
          flip or shift the answer without looking obviously wrong.
      - ask: >
          For $n=6$ points, which computation gives $\Pr(\text{contains
          center})$?
        choices:
          - text: >
              $6/2^{5} = 3/16$ directly
            feedback: >
              That's the semicircle probability itself — the probability all six
              points *fail* to surround the center, not the containment
              probability.
          - text: >
              $1-6/2^{5} = 13/16$
            correct: true
            feedback: >
              This takes the complement of the semicircle probability, exactly
              as the equivalence requires: containment is 'not all in one
              semicircle.'
          - text: >
              $1-6/2^{6} = 29/32$
            feedback: >
              This uses $(1/2)^{n}$ instead of $(1/2)^{n-1}$ inside the
              semicircle probability — only the other $n-1$ points, not the
              anchor itself, need to land in the semicircle.
        feedback: >
          $\Pr(\text{contains center}) = 1-n/2^{n-1}$, here $1-6/32=13/16$ — the
          complement of the semicircle result, not the semicircle result itself.
      - teach: >
          A random inscribed triangle contains the center with probability $1/4$
          — the semicircle probability's complement — and the same complement
          argument scales to any $n$-point polygon.

