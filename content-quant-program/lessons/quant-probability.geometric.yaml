unit: quant-probability.geometric
opening: >
  Geometric probability trades sums and integrals for areas: once "uniformly
  at random" is translated into independent uniform coordinates, every
  question becomes a shape drawn in a square, cube or disc, and the answer is
  a ratio of measures. The chapter opens with the definitions that make this
  legal — a uniform point, and the correspondence between independent
  uniform draws and a uniform point in a box — then spends its center of
  gravity on the one reusable technique, probability as an area ratio, that
  powers the meeting problem, the broken-stick triangle, and Buffon's
  needle. It closes on the chapter's central warning, sharpened twice over —
  Bertrand's chord paradox and the two-stage broken stick, where identical
  words produce different answers because "uniform" was never pinned to one
  mechanism — before a final pair of circle problems reuses the same area
  trick to decide when a random triangle surrounds the center.
lessons:
  - node: quant-probability.geometric.uniform-point
    hook: >
      Every "a point is dropped at random on this region" problem is
      quietly asking you to trust that probability equals area — and that
      trust needs a definition before it can be used without flinching.
    explanation: >
      In one dimension, uniform meant a flat density $1/(b-a)$; the natural
      extension to a region $S$ with area or volume $|S|$ keeps the same
      idea — density stays flat at $1/|S|$ on $S$ and $0$ outside, so
      $\Pr(P \in A) = |A|/|S|$ for any subregion $A$. That is the classical
      model's favorable-over-total ratio translated from counting outcomes
      to measuring them: with no distinct outcomes left to count, length,
      area or volume stands in for cardinality.

      Two consequences follow immediately and are worth saying out loud,
      since interview problems lean on both constantly. Any single point,
      curve or lower-dimensional slice inside $S$ has measure $0$, hence
      probability $0$ — so whether a boundary is included or excluded never
      changes an answer, and corners can be rounded freely. And only the
      ratio $|A|/|S|$ matters: rescaling $S$ and $A$ together by any factor
      leaves the probability unchanged, so the answer never carries units —
      a probability computed on a unit square is identical to one computed
      on any similar region, however large.
    worked: >
      A point is dropped uniformly on the triangle with vertices $(0,0)$,
      $(4,0)$, $(0,4)$, area $8$. What's the probability it lands in the
      sub-triangle $x+y \le 2$, with vertices $(0,0)$, $(2,0)$, $(0,2)$,
      area $2$? The ratio is $2/8 = 1/4$.
    interview: >
      Told "a dart lands uniformly at random on this region," the
      interviewer wants an immediate reach for area ratios, not an attempt
      to set up a joint density integral from scratch — naming
      $\Pr(A) = |A|/|S|$ on sight is the tell they're listening for.
    pitfalls: >
      Treating boundaries as if they mattered — worrying over $\le$ versus
      $<$ — forgets that any curve has probability $0$. Applying the ratio
      rule to a region without finite positive measure, such as an
      unbounded strip or a degenerate sliver with zero area, breaks the
      definition outright.
    recap: >
      A uniform point turns probability into geometry:
      $\Pr(P \in A) = |A|/|S|$, a dimensionless ratio unaffected by
      rescaling, with every boundary free.
    dialogue:
      - part: A hailstone on a car park
        teach: >
          A car park is a rectangle $50$ metres by $20$. In one corner lies a
          square puddle $10$ metres on a side. A single hailstone lands
          somewhere in the car park, with no preference for any part of it
          over any other.
      - ask: >
          What is the probability the hailstone lands in the puddle?
        expects: "1/10"
        hint: >
          Compare how much of the car park the puddle takes up.
        feedback: >
          The puddle covers $10 \times 10 = 100$ square metres of a
          $50 \times 20 = 1000$ square-metre car park, so the probability is
          $100/1000 = 1/10$.
      - ask: >
          The corner puddle drains, and a new square puddle of the same size
          forms in the exact centre of the car park. What is the probability
          now?
        choices:
          - text: >
              More than $1/10$: the middle of a region gets hit more often.
            feedback: >
              That is a dart player aiming at the bullseye. "No preference for
              any part" means a central square and a corner square of the same
              size are equally likely, whatever the middle feels like.
          - text: >
              Still $1/10$.
            correct: true
            feedback: >
              Same area, same probability. Where the puddle sits never entered
              the computation.
          - text: >
              It cannot be known without a formula for how hail falls.
            feedback: >
              "No preference for any part" is that formula: a flat density.
              With it, location drops out and only size is left.
        feedback: >
          Position is irrelevant; only the size of the target region counts.
      - ask: >
          After more rain the puddle is an irregular blob whose area a
          surveyor measures at $35$ square metres. What is the probability the
          hailstone lands in it?
        expects: "7/200"
        tolerance: 0.0001
        feedback: >
          $35/1000 = 7/200 = 0.035$. Shape is as irrelevant as position: you
          needed the blob's area and nothing else about it.

      - part: What no preference has to mean
        teach: >
          A $2 \times 2$ tray is ruled into four unit cells. Three machines drop
          a ball bearing on it. Machine A picks a cell with probability $1/4$
          each, then a point in that cell with no preference. Machine B picks
          the bottom-left cell half the time and each other cell with
          probability $1/6$, then a point in it with no preference. Machine C
          picks a cell with probability $1/4$ each, then drops the ball at that
          cell's exact centre.
      - ask: >
          Which machine deserves to be called "a uniform point on the tray"?
        choices:
          - text: >
              Machine C: each cell gets its fair share, $1/4$.
            feedback: >
              The cells are fine, but a tiny disc of radius $0.1$ around each
              cell centre has total area $4\pi(0.01) \approx 0.13$, about $3\%$
              of the tray, and catches the ball every time. A region with
              almost no area gets probability $1$.
          - text: >
              Machine A
            correct: true
            feedback: >
              Each cell gets probability $1/4$, its share of the area, and
              inside a cell probability is spread by area too, so every region
              of the tray gets probability equal to its fraction of the tray.
          - text: >
              Machine B: every point of the tray can still be hit.
            feedback: >
              Being able to hit everything is not the same as having no
              preference. The bottom-left cell is $1/4$ of the tray and takes
              $1/2$ of the drops.
        feedback: >
          Only Machine A gives every region a probability equal to its share of
          the area.
      - reflect: >
          Machine C passed the check on all four cells and still failed. Say
          exactly what you must verify before calling a point uniform on a
          region, and why checking a few big pieces is not enough.
        answer: >
          For every subregion $A$ — big or small, any shape — the probability
          of landing in $A$ must equal $A$'s share of the whole, $|A|/|S|$.
          Checking four cells only tests four regions; Machine C hides its
          preference inside them, piling all its mass onto four points. The
          rule has to hold for all subregions at once, which is the same as
          saying the density is flat.
      - teach: >
          That is the definition. A point $P$ is uniform on a region $S$ of
          finite, nonzero measure $|S|$ — length, area or volume, whichever the
          dimension calls for — when $\Pr(P \in A) = |A|/|S|$ for every
          subregion $A \subseteq S$; its density is the constant $1/|S|$ on $S$
          and $0$ outside. It is the classical favourable-over-total ratio,
          with measuring in place of counting.

      - part: Testing the clauses one at a time
        ask: >
          The measure follows the dimension. A $12$-kilometre pipeline springs
          one leak, uniform along its length. Crews based at the two ends each
          handle anything within $2$ kilometres of their end. What is the
          probability the leak falls to one of them?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          The region is a segment, so its measure is a length.
        feedback: >
          The favourable set is two stretches of $2$ kilometres, total length
          $4$, out of $12$: $4/12 = 1/3$. Same rule, with length in place of
          area.
      - ask: >
          Back at the car park, with the corner puddle. What is the
          probability the hailstone lands exactly on the puddle's boundary,
          the four $10$-metre edges?
        expects: "0"
        hint: >
          How much area does a line segment have?
        feedback: >
          The edges are segments with total area $0$, so the probability is
          $0/1000 = 0$. Whether the puddle includes its edge or not cannot
          change any answer, which is why $<$ versus $\le$ never matters here.
      - ask: >
          A colleague redoes the corner-puddle problem with every length in
          feet instead of metres, multiplying each by about $3.28$. What
          happens to the answer?
        choices:
          - text: >
              It is multiplied by $3.28^{2} \approx 10.8$, since areas grow.
            feedback: >
              Both areas grow by $10.8$, the puddle's and the car park's, and
              the factor cancels in the ratio. Only a quantity with units would
              change.
          - text: >
              It is unchanged.
            correct: true
            feedback: >
              $|A|/|S|$ is a ratio of two areas measured in the same units, so
              it is a pure number. Rescaling both together never moves it.
          - text: >
              It now has units of one over square feet.
            feedback: >
              Square feet over square feet cancel. A probability that carries
              units means a boundary was drawn wrong somewhere.
        feedback: >
          Only the ratio matters: answers are dimensionless and survive any
          common rescaling, which is what lets you work on a unit square.

      - part: Regions that fail one clause
        ask: >
          A point is uniform on the car park's diagonal, the segment from the
          puddle's corner $(0,0)$ to the far corner $(50,20)$. What is the
          probability it lies inside the corner puddle $[0,10] \times [0,10]$?
        expects: "1/5"
        hint: >
          Measured as an area, the diagonal is nothing. Measure it as a length.
          Where does the line $y = 0.4x$ leave the puddle?
        feedback: >
          The diagonal is $y = 0.4x$, which stays inside the puddle until
          $x = 10$, where $y = 4$. Lengths along a straight line are
          proportional to the $x$-extent, so the share is $10/50 = 1/5$. As a
          region of the plane the diagonal has area $0$ and the ratio would be
          $0/0$; as a segment it has length, and the definition works in that
          dimension.
      - ask: >
          An interviewer says: "A point is dropped uniformly at random on an
          infinite tiled floor. What is the chance it lands on one particular
          tile?" What is wrong with the question?
        choices:
          - text: >
              Nothing: the answer is $0$, one tile out of infinitely many.
            feedback: >
              If each of the countably many tiles had probability $0$, the
              floor as a whole would have probability $0 + 0 + \cdots = 0$, not
              $1$. Zero for every tile is not a probability distribution.
          - text: >
              The floor has infinite area, so no constant density $1/|S|$
              exists.
            correct: true
            feedback: >
              The definition needs $|S|$ finite and nonzero. An infinite floor
              fails exactly that clause, and nothing else is wrong.
          - text: >
              Tiles have edges, and points on the edges cannot be assigned to a
              tile.
            feedback: >
              The edges have area $0$, so they would carry probability $0$ even
              if the rest worked. The boundary is never the problem.
        feedback: >
          Fails one clause: infinite measure. In practice such questions are
          rescued by reducing to one repeating tile, where the measure is finite
          and the definition applies again.


  - node: quant-probability.geometric.independent-coordinates
    hook: >
      This is the sentence that lets you redraw "two random arrival times"
      as "one random point in a square" — every meeting problem, needle
      drop and stick-break later in this chapter leans on it without
      restating it.
    explanation: >
      If $X \sim U(a,b)$ and $Y \sim U(c,d)$ are independent, their joint
      density is the product of the marginals — that is what independence
      means for densities — and each marginal is already a constant,
      $1/(b-a)$ and $1/(d-c)$. The product is the constant
      $1/((b-a)(d-c))$ on the rectangle $[a,b] \times [c,d]$, and a constant
      density on a rectangle is exactly what a uniform point on that
      rectangle means. Independent uniform coordinates and a uniform point
      in a box are the same object, seen from two directions.

      The converse matters just as much in practice: given a uniform point
      in a rectangle, integrating its constant density over one
      coordinate's full range again produces a constant, so each
      coordinate is itself uniform, and the joint density still factors —
      hence independent. The same coordinate-by-coordinate argument
      extends to $n$ independent uniforms filling a box in $n$ dimensions.

      The equivalence is special to boxes. In a disc or a triangle, knowing
      $X$ restricts the feasible range of $Y$, so a uniform point there has
      dependent coordinates even though each one's own marginal density is
      easy to write down. The payoff of the box case is a translation
      you'll use constantly: "$k$ independent uniform times, positions or
      angles" is literally the same object as "one uniform point in a
      $k$-dimensional box."
    worked: >
      Let $X \sim U(0,2)$ and $Y \sim U(0,5)$, independent. Their joint
      density is $1/10$ on the rectangle $[0,2] \times [0,5]$, area $10$.
      For $\Pr(X<1, Y<3)$: as a product of independent events,
      $(1/2)(3/5) = 3/10$; as an area ratio, the favorable rectangle
      $[0,1] \times [0,3]$ has area $3$ out of $10$, giving $3/10$ again.
    interview: >
      "Two independent random times in $[0,T]$ — draw the picture" is
      asking for an immediate conversion to a uniform point in a
      $T \times T$ square; the interviewer is checking that the
      translation is automatic, not something re-derived from a joint
      density each time.
    pitfalls: >
      Applying the same "draw a square" move to two dependent quantities —
      a point and a reflection of itself, say — silently breaks the
      argument, since independence is a real hypothesis, not a formality.
      Assuming a uniform point in a disc has independent coordinates is the
      most common misuse of this equivalence.
    recap: >
      Independent uniform coordinates and a uniform point in a box are the
      same object — the box is what licenses drawing random times,
      positions or angles as a single point.
    dialogue:
      - part: Two delays, one product
        teach: >
          Your bus is late by $X$ minutes, uniform on $[0,8]$. Your connecting
          train is late by $Y$ minutes, uniform on $[0,3]$. The two delays are
          independent.
      - ask: >
          What is the probability the bus is under $2$ minutes late and the
          train is more than $1$ minute late?
        expects: "1/6"
        tolerance: 0.0005
        hint: >
          One condition on each delay, and the delays are independent.
        feedback: >
          $\Pr(X < 2) = 2/8 = 1/4$ and $\Pr(Y > 1) = 2/3$; independence
          multiplies them: $(1/4)(2/3) = 1/6$.
      - ask: >
          You make the connection only if the bus is less late than the train,
          $X < Y$. Can the same multiplication give $\Pr(X < Y)$?
        choices:
          - text: >
              Yes: it is $1/2$ by symmetry, since the delays are independent.
            feedback: >
              Symmetry would need the two delays to have the same distribution.
              The bus can be up to $8$ minutes late and the train only $3$, so
              the bus is usually the later one.
          - text: >
              No: the condition ties $X$ to $Y$, so it is not one condition on
              each.
            correct: true
            feedback: >
              Multiplying works for "$X$ in this set and $Y$ in that set". The
              event $X < Y$ has no such split — whether a bus delay is small
              enough depends on the train's.
          - text: >
              Yes: $\Pr(X < 3) \cdot \Pr(Y > 0) = 3/8$.
            feedback: >
              That computes $\Pr(X < 3)$, which allows $X = 2.5$ with $Y = 1$.
              Replacing a linked condition by two separate ones changes the
              event.
        feedback: >
          The product rule handles rectangles of conditions. A condition that
          links the two variables needs another tool.
      - reflect: >
          You want to handle any condition linking $X$ and $Y$ at once. What
          single object could stand in for the pair, so that "$X < Y$" becomes
          something you can measure — and why would independence make that
          measuring easy?
        hint: >
          Plot the pair.
        answer: >
          The point $(X, Y)$ in the plane, living in the rectangle
          $[0,8] \times [0,3]$. Independence makes its joint density the
          product of the marginals, $1/8 \cdot 1/3$, which is constant. A
          constant density on a rectangle is a uniform point, so every event
          about the pair is a region and its probability is that region's area
          over $24$.
      - ask: >
          What is the joint density of $(X, Y)$ at the point $(5, 1)$?
        expects: "1/24"
        tolerance: 0.0001
        feedback: >
          Independence gives $f(x,y) = f_X(x) f_Y(y) = (1/8)(1/3) = 1/24$ — the
          same value at every point of the rectangle, which is $1$ over its
          area $8 \times 3 = 24$.
      - teach: >
          That is the proposition. Independent $X \sim U(a,b)$ and
          $Y \sim U(c,d)$ have joint density $1/((b-a)(d-c))$, constant on
          $[a,b] \times [c,d]$, so $(X,Y)$ is a uniform point in that rectangle.
          The same holds for $n$ independent uniforms and a box in
          $\mathbb{R}^{n}$. Two independent random delays are one random point.
      - ask: >
          Now compute $\Pr(X < Y)$ as an area.
        expects: "3/16"
        tolerance: 0.0005
        hint: >
          $X < Y$ is only possible when $X < 3$. For each train delay $y$, the
          bus delay must lie in $[0, y]$.
        feedback: >
          The region $x < y$ inside the rectangle is the triangle with corners
          $(0,0)$, $(0,3)$, $(3,3)$, legs $3$ and area $9/2$. Divided by $24$,
          $\Pr(X < Y) = 9/48 = 3/16$. You make the connection less than a fifth
          of the time.

      - part: Reading it backwards
        ask: >
          The converse is also true. A point $(X, Y)$ is uniform in the
          rectangle $[0,10] \times [0,4]$. What is $\Pr(X \le 3)$?
        expects: "3/10"
        tolerance: 0.0005
        hint: >
          The event is a strip of the rectangle: the full height, width $3$.
        feedback: >
          The strip $[0,3] \times [0,4]$ has area $12$ out of $40$, so the
          probability is $3/10$ — exactly $3$ out of the $10$ units of width.
          The $x$-coordinate on its own is $U(0,10)$.
      - ask: >
          What is $\Pr(X \le 3 \text{ and } Y \le 1)$?
        expects: "3/40"
        tolerance: 0.0001
        feedback: >
          The corner rectangle $[0,3] \times [0,1]$ has area $3$, so the
          probability is $3/40$. And $\Pr(X \le 3) \Pr(Y \le 1) =
          (3/10)(1/4) = 3/40$ — it factors.
      - ask: >
          Why does it factor for every pair of thresholds $s$ and $t$, not just
          these?
        choices:
          - text: >
              Because uniform random variables are always independent.
            feedback: >
              Two uniforms can be as dependent as you like: $Y = 4 - 0.4X$ is
              uniform on $[0,4]$ and completely determined by $X$. The shape of
              the region is doing the work, not uniformity.
          - text: >
              Because $\{X \le s, Y \le t\}$ is a rectangle of area $st$, and
              $st/40 = (s/10)(t/4)$.
            correct: true
            feedback: >
              The area of a rectangle is a product, and the total area is the
              product of the two side lengths. That is the whole reason a box
              gives independent coordinates.
          - text: >
              Because the rectangle is centred at the origin.
            feedback: >
              It is not — it sits in the first quadrant. Translating a region
              never affects whether its coordinates are independent.
        feedback: >
          A uniform point in a box has independent uniform coordinates, because
          areas of sub-boxes are products of side lengths.

      - part: Where the box breaks
        ask: >
          A point is uniform on an L-shaped region of area $3$: the rectangle
          $[0,2] \times [0,1]$ together with the square $[0,1] \times [1,2]$
          stacked on its left end. Each of $\Pr(X > 1)$ and $\Pr(Y > 1)$ is
          $1/3$. What is $\Pr(X > 1 \text{ and } Y > 1)$?
        expects: "0"
        hint: >
          Find the part of the L where both coordinates exceed $1$.
        feedback: >
          The square $[1,2] \times [1,2]$ is the missing corner of the L, so
          the event is empty and has probability $0$, not
          $(1/3)(1/3) = 1/9$. The coordinates are dependent: learning $X > 1$
          forces $Y < 1$.
      - ask: >
          What exactly went wrong for the L?
        choices:
          - text: >
              The point is not really uniform: the L has corners.
            feedback: >
              It is uniform: every subregion has probability equal to its area
              over $3$. Uniformity is fine; independence is what fails.
          - text: >
              The region is not a product of an $x$-interval and a $y$-interval,
              so the range of $Y$ depends on $X$.
            correct: true
            feedback: >
              For $X < 1$, $Y$ ranges over $[0,2]$; for $X > 1$, only over
              $[0,1]$. A uniform point in a disc or a triangle fails the same
              way.
          - text: >
              The area is $3$, not $1$, so the region should be rescaled first.
            feedback: >
              Rescaling never changes a probability or whether coordinates are
              independent. The shape is the problem, not the size.
        feedback: >
          Uniform in a box and independent coordinates are the same thing; off
          a product shape, the coordinates of a uniform point are dependent.
      - ask: >
          Now break the other hypothesis. $X \sim U(0,1)$ and $Y = 1 - X$, so
          each is uniform on $[0,1]$. Is $(X, Y)$ a uniform point in the unit
          square?
        choices:
          - text: >
              Yes: both coordinates are uniform on $[0,1]$.
            feedback: >
              Check a region. $\Pr(X < 1/2 \text{ and } Y < 1/2)$ would be
              $1/4$ for a uniform point, but here $Y < 1/2$ forces $X > 1/2$,
              so the probability is $0$.
          - text: >
              No: the pair lives on the line $x + y = 1$, which has area $0$.
            correct: true
            feedback: >
              All its probability sits on a segment of zero area. Uniform
              marginals are not enough; the proposition needs independence.
          - text: >
              Yes, after rescaling the square so the line fills it.
            feedback: >
              No rescaling turns a segment into a region with area. The pair
              is one-dimensional however you stretch it.
        feedback: >
          Both hypotheses carry weight: uniform marginals and independence
          together give a uniform point in the box, and dropping either loses
          it.

      - part: Three clocks in a cube
        ask: >
          Three traders log on at independent times, each uniform on $[0,1]$
          hours. Their times are a uniform point in the unit cube. What is the
          probability they log on in alphabetical order, $X < Y < Z$?
        expects: "1/6"
        tolerance: 0.0005
        hint: >
          Swapping two coordinates maps the cube to itself without changing
          volumes.
        feedback: >
          The six orderings carve the cube into six regions, each mapped onto
          any other by swapping coordinates, which preserves volume, and the
          ties have volume $0$. So each ordering has volume $1/6$. Said aloud:
          "independent uniforms are a uniform point in a cube, and the six
          orderings split it evenly".


  - node: quant-probability.geometric.probability-as-area
    hook: >
      This four-step recipe is the one move every remaining example in
      this chapter runs; knowing the steps in order is worth more than
      knowing any single answer.
    explanation: >
      Every "at random" question with a continuum of outcomes reduces to
      the same sequence. Name the independent uniform quantities the
      mechanism actually produces — arrival times, break points, angles —
      one coordinate per quantity. Draw the region they jointly fill: a
      square for two uniform times on $[0,T]$, a cube for three, a
      rectangle in $(x,\theta)$ for a dropped needle's position and angle.
      Rewrite every condition in the problem as an inequality in those
      coordinates, turning the favorable event into a subregion bounded by
      lines or simple curves. Report the ratio of measures, favorable over
      total.

      Because only the ratio counts — the uniform point's scale invariance
      again — you are always free to rescale to the unit square or cube
      before computing, which keeps the arithmetic light. Two habits pay
      off repeatedly: try the complement first, since the excluded region
      is usually a pair of simple corner triangles rather than the awkward
      band or polygon you actually want, and check that the final answer is
      dimensionless, since a probability still carrying units of time or
      length signals a mistake in how the boundaries were drawn.
    worked: >
      Two independent measurements $X, Y \sim U(0,10)$. Find
      $\Pr(X+Y>15)$. The favorable region is itself a corner triangle,
      vertices $(10,5)$, $(5,10)$, $(10,10)$, legs $5$, area $12.5$, out of
      total area $100$. So $\Pr(X+Y>15) = 12.5/100 = 1/8 = 0.125$.
    interview: >
      "What's the probability two independent random numbers on $[0,L]$
      satisfy [some inequality]" is testing exactly this pipeline — state
      the coordinates and the region out loud before computing, since a
      correct picture with a small arithmetic slip scores far better than a
      guessed number.
    pitfalls: >
      Skipping the naming step and reasoning about probabilities before
      fixing coordinates is how sign errors and double-counted regions
      creep in. Rescaling the region without rescaling the condition to
      match silently changes the ratio.
    recap: >
      Name the coordinates, draw the region, turn the conditions into a
      subregion, and report the ratio — checking the complement and the
      units along the way.
    dialogue:
      - part: A game with two random numbers
        teach: >
          You and a colleague each draw a number uniform on $[0,1]$,
          independently: yours is $X$, hers is $Y$. You win the round when your
          number is at least twice hers.
      - ask: >
          What is the probability you win, $\Pr(X \ge 2Y)$?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          Plot the pair $(X,Y)$ in the unit square and shade where
          $x \ge 2y$.
        feedback: >
          The pair is a uniform point in the unit square. The condition
          $y \le x/2$ is the triangle under the line $y = x/2$, with corners
          $(0,0)$, $(1,0)$, $(1,1/2)$: base $1$, height $1/2$, area $1/4$. The
          slow route integrates $\Pr(X \ge 2y) = 1 - 2y$ over
          $y \in [0, 1/2]$ and gets $1/2 - 1/4 = 1/4$ as well.
      - ask: >
          New rule: the round is a draw when the numbers are within a factor of
          $3$ of each other, $Y/3 \le X \le 3Y$. The draw region is a wedge
          between two lines through the origin. What is the quickest way to its
          area?
        choices:
          - text: >
              Integrate over $x$: for each $x$, $y$ runs from $x/3$ to $3x$.
            feedback: >
              The upper limit $3x$ leaves the square at $x = 1/3$, so the
              integral splits into two pieces with different limits. It works,
              and it is where errors creep in under pressure.
          - text: >
              Subtract the two corner triangles outside the wedge from $1$.
            correct: true
            feedback: >
              Outside the wedge are two thin triangles, one against each axis,
              each with legs $1$ and $1/3$. Two triangles are easier than one
              wedge.
          - text: >
              The wedge spans $3 - 1/3$ of the slopes, so the area is
              proportional to that.
            feedback: >
              Area is not proportional to the range of slopes: the steep
              triangle $y \ge 3x$ and the shallow one $y \le x/3$ have equal
              area although their slope ranges look nothing alike.
        feedback: >
          When the favourable region is an awkward middle band, its complement
          is usually a pair of simple corners.
      - ask: >
          What is the probability of a draw?
        expects: "2/3"
        tolerance: 0.0005
        feedback: >
          The triangle $y > 3x$ has corners $(0,0)$, $(0,1)$, $(1/3,1)$ and
          area $1/6$; the triangle $x > 3y$ is its mirror image, also $1/6$. So
          $\Pr(\text{draw}) = 1 - 1/6 - 1/6 = 2/3$.
      - reflect: >
          Look at what you did on both questions before any arithmetic. Write
          the procedure as a short list of steps you could apply to the next
          "two random numbers" question.
        answer: >
          Name the independent uniform quantities and make each a coordinate.
          Draw the box they fill — here the unit square. Rewrite every
          condition as an inequality in those coordinates, so the event becomes
          a region bounded by lines or curves. Report favourable area over
          total area, and if the region is an awkward middle, compute the easy
          corners outside it and subtract.

      - part: The technique, and its two habits
        teach: >
          That is probability as an area ratio. Name the independent uniforms,
          one coordinate each; draw the region they fill; turn every condition
          into an inequality; report the ratio of measures. Since only the ratio
          counts, you may rescale to the unit square first. Two habits pay:
          complement first, and check the answer is dimensionless.
      - ask: >
          $X$ and $Y$ are independent and uniform on $[0,3]$. What is
          $\Pr(X + Y < 2)$?
        expects: "2/9"
        tolerance: 0.0005
        hint: >
          If you rescale to the unit square, rescale the condition too.
        feedback: >
          The region $x + y < 2$ is a corner triangle with legs $2$ and area
          $2$, inside a square of area $9$, so the answer is $2/9$. Rescaled,
          it is $X' + Y' < 2/3$ in the unit square, area $(2/3)^{2}/2 = 2/9$.
          Rescaling the square while keeping "$< 2$" would give
          $1 - 0 = 1$, since every unit-square pair sums to less than $2$.
      - ask: >
          A candidate solving the same problem reports $\Pr(X + Y < 2) = 2$.
          What went wrong?
        choices:
          - text: >
              The triangle's area was computed wrongly.
            feedback: >
              The area is right: legs $2$ and $2$, half their product is $2$.
              The mistake is in what was done with it.
          - text: >
              The favourable area was never divided by the total area $9$.
            correct: true
            feedback: >
              Area $2$ has units of length squared; a probability has none.
              Dividing by the square's area $9$ cancels the units and gives
              $2/9$.
          - text: >
              Nothing: probabilities above $1$ are possible for continuous
              variables.
            feedback: >
              Densities can exceed $1$; probabilities cannot. An answer above
              $1$, or one that carries units, signals a missing division.
        feedback: >
          The dimension check catches this in one glance: a probability is a
          ratio of two measures of the same kind.

      - part: Curves and a third coordinate
        ask: >
          Back to $X, Y$ independent and uniform on $[0,1]$. What is
          $\Pr(Y < X^{2})$?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          The region lies under a parabola. Its area is one integral.
        feedback: >
          The favourable region is under the curve $y = x^{2}$:
          $\int_{0}^{1} x^{2}\,dx = 1/3$. A curved boundary costs one integral;
          the method is unchanged.
      - ask: >
          Three independent uniforms $X, Y, Z$ on $[0,1]$. What is
          $\Pr(X + Y + Z < 1)$?
        expects: "1/6"
        tolerance: 0.0005
        hint: >
          Three uniforms make a uniform point in the unit cube. The region is
          a corner of it.
        feedback: >
          The region is the corner tetrahedron with legs $1$, $1$, $1$ along
          the axes, whose volume is $1 \cdot 1 \cdot 1/6 = 1/6$. The cube's
          volume is $1$, so the probability is $1/6$.
      - ask: >
          And $\Pr(X + Y + Z < 1/2)$?
        expects: "1/48"
        tolerance: 0.0001
        hint: >
          The same tetrahedron, with every leg halved.
        feedback: >
          Halving every leg scales volume by $(1/2)^{3}$, so the volume is
          $(1/6)(1/8) = 1/48$. In three dimensions a threshold enters cubed.
      - teach: >
          Said in an interview: "Two independent uniforms, so a uniform point in
          the square; the condition is the region under this line; I will take
          the complement, which is two triangles." Saying the coordinates and
          the region aloud before computing is worth more than a fast number,
          because a correct picture survives an arithmetic slip.


  - node: quant-probability.geometric.meeting-problem
    hook: >
      This is the area-ratio technique's flagship example, and
      interviewers reuse the exact numbers — $15$-minute wait, one-hour
      window — often enough that reciting $7/16$ without the underlying
      picture invites them to change the numbers on you.
    explanation: >
      Model the two arrival times as a uniform point $(X,Y)$ in a
      $T \times T$ square, using the coordinates-as-a-point translation.
      "They meet" means neither arrives more than the patience $t$ before
      the other has to leave, i.e. $|X-Y| \le t$ — a diagonal band
      straddling the line $X=Y$.

      Rather than integrate the band directly, take the complement.
      $Y-X>t$ and $X-Y>t$ are two triangles in opposite corners, each right
      isosceles with legs $T-t$, since one arrival must land in the final
      $T-t$ minutes strictly ahead of the other's entire range. Their
      combined area is $2 \cdot (T-t)^{2}/2 = (T-t)^{2}$, so
      $\Pr(\text{meet}) = 1 - (T-t)^{2}/T^{2}$.

      Keep this as a shape, not a formula: the meeting event is a band
      around a square's diagonal, and its width is set by twice the
      patience. Every later variant in this chapter — unequal patience, a
      different window length — is the same band, just with the corner
      triangles resized.
    worked: >
      Two colleagues each arrive at a uniformly random time within a
      $30$-minute window and wait $5$ minutes. Square side $T=30$,
      corner-triangle legs $T-t=25$, one triangle's area
      $25^{2}/2 = 312.5$, two triangles $625$, out of total area $900$.
      $\Pr(\text{meet}) = 1 - 625/900 = 275/900 = 11/36 \approx 0.3056$.
    interview: >
      "Two people plan to meet within an hour, each waiting $15$ minutes"
      is the canonical phrasing; the interviewer wants the band-in-a-square
      picture and the complement trick, not a memorized $7/16$ — change the
      window or the wait and you should redraw instantly.
    pitfalls: >
      Computing the band's area directly, as a hexagon-minus-triangles
      argument, is far more error-prone under time pressure than taking the
      two-corner complement. Using legs of $T$ instead of $T-t$ for the
      corner triangles is the most common slip.
    recap: >
      The meeting event is a band $|X-Y| \le t$ around a square's diagonal;
      excluding its two corner triangles of leg $T-t$ gives
      $\Pr(\text{meet}) = 1-(T-t)^{2}/T^{2}$, which is $7/16$ at $t=15$,
      $T=60$.
    dialogue:
      - part: Two friends, fifty minutes
        teach: >
          Ann and Ben agree to meet at a station between 7:00 and 7:50.
          Each arrives at a uniformly random time in those $50$ minutes,
          independently, waits $10$ minutes for the other, and leaves.
      - ask: >
          A quick estimate: wherever Ann arrives, Ben must turn up within $10$
          minutes either side of her, a window of $20$ minutes out of $50$, so
          the answer is $2/5$. How does the true probability compare?
        choices:
          - text: >
              It is exactly $2/5$.
            feedback: >
              Only if Ann arrives in the middle stretch. If she arrives at
              7:02, Ben's window runs from 7:00 to 7:12 — $12$
              minutes, not $20$, because nothing happens before 7:00.
          - text: >
              It is more than $2/5$.
            feedback: >
              The ends of the hour can only cut Ben's window short, never
              stretch it, so every correction goes the same way: down.
          - text: >
              It is less than $2/5$.
            correct: true
            feedback: >
              Near either end of the $50$ minutes, part of Ben's $20$-minute
              window falls outside the meeting period. The estimate ignores
              those lost minutes.
        feedback: >
          The $20$-minute window is right in the middle and wrong at the edges,
          and the edges are where the estimate leaks.
      - ask: >
          Suppose Ann arrives at 7:03. What is the probability Ben meets
          her?
        expects: "13/50"
        tolerance: 0.0005
        hint: >
          Which arrival times for Ben are within $10$ minutes of 7:03, and
          still inside the $50$ minutes?
        feedback: >
          Ben must arrive between 7:00 and 7:13: $13$ minutes of $50$,
          so $13/50$. Before 7:00 is not available, which is the cut the
          quick estimate ignored.
      - reflect: >
          Ben's chance depends on where Ann lands, and averaging it over her
          arrival time means a formula with three cases. What picture would let
          you see every combination of the two arrival times at once, and what
          shape would "they meet" be in it?
        answer: >
          Plot Ann's time $X$ against Ben's time $Y$: two independent uniforms
          make a uniform point in a $50 \times 50$ square. "They meet" is
          $|X - Y| \le 10$, a band of width set by the patience running along
          the diagonal. The three cases are just where the band runs into the
          square's edges, and the picture handles them all at once.

      - part: The band and its corners
        teach: >
          So the answer is the band's share of the square's $2500$ square
          minutes. The band itself is a six-sided figure, awkward to measure
          directly. Outside it sit two corner triangles: one where Ben arrives
          more than $10$ minutes after Ann, $Y - X > 10$, and its mirror image,
          $X - Y > 10$.
      - ask: >
          How long are the legs of the triangle $Y - X > 10$?
        choices:
          - text: >
              $50$, the full side of the square.
            feedback: >
              The triangle's corner sits on the line $y = x + 10$, which meets
              the left side at $y = 10$, not $y = 0$. Using the full side is
              the most common slip here; it would make the answer $0$.
          - text: >
              $10$, the patience.
            feedback: >
              $10$ is how far the band reaches from the diagonal along an axis,
              which is the part being removed. The triangle is what is left of
              the side after it.
          - text: >
              $40$
            correct: true
            feedback: >
              For Ben to arrive more than $10$ minutes after Ann, Ann must
              arrive in the first $40$ minutes and Ben in the last $40$. The
              triangle runs from $(0,10)$ to $(0,50)$ to $(40,50)$.
        feedback: >
          The legs are window minus patience, $50 - 10 = 40$.
      - ask: >
          What is the combined area of the two corner triangles, in square
          minutes?
        expects: "1600"
        feedback: >
          Each triangle has area $40^{2}/2 = 800$, and there are two, so
          $1600$.
      - ask: >
          What is the probability Ann and Ben meet?
        expects: "9/25"
        tolerance: 0.0005
        feedback: >
          $1 - 1600/2500 = 1 - 16/25 = 9/25 = 0.36$, below the quick estimate
          of $0.40$, as you predicted. The $0.04$ is exactly the edge effect.

      - part: Change one number
        ask: >
          Same $50$ minutes, but each now waits $25$ minutes. What is the
          probability they meet?
        expects: "3/4"
        tolerance: 0.0005
        hint: >
          Redraw the corners: legs are window minus patience.
        feedback: >
          The corner triangles have legs $50 - 25 = 25$, combined area
          $25^{2} = 625$, so $\Pr = 1 - 625/2500 = 3/4$. Patience of half the
          window gives three chances in four.
      - ask: >
          Back to the original story. If each friend doubles their patience
          from $10$ to $20$ minutes, what happens to the meeting probability
          of $0.36$?
        choices:
          - text: >
              It doubles, to $0.72$.
            feedback: >
              The band's width doubles, but the corners it eats into shrink
              quadratically: legs go from $40$ to $30$, corners from $1600$ to
              $900$, and $1 - 900/2500 = 0.64$.
          - text: >
              It rises to $0.64$, less than double.
            correct: true
            feedback: >
              $1 - (30/50)^{2} = 1 - 9/25 = 16/25 = 0.64$. The extra patience
              buys less each time, because more of the band is already pressed
              against the square's edges.
          - text: >
              It rises to $0.56$, adding the same $0.20$ as each $10$ minutes
              adds.
            feedback: >
              The gain is not constant per minute: the first $10$ minutes buy
              $0.36$ and the next $10$ buy $0.28$. A probability bounded by
              $1$ cannot keep rising linearly.
        feedback: >
          The meeting probability is $1$ minus a square, so it is concave in
          the patience — each extra minute is worth less than the last.
      - teach: >
          In an interview, say it in this order: "Two independent uniform
          arrivals are a uniform point in the square; meeting is the band
          $|X - Y| \le t$ around the diagonal; its complement is two corner
          triangles with legs $T - t$." Then the number. Change the window or
          the patience and the same three sentences give the new answer.


  - node: quant-probability.geometric.waiting-window-general
    hook: >
      Once the meeting problem becomes a formula in $t/T$ rather than a
      fixed picture, two questions interviewers actually ask — "how much
      patience buys $50$-$50$ odds" and "what if the two people have
      different patience" — turn into algebra instead of new geometry.
    explanation: >
      Because only the ratio of areas ever mattered, rescale the
      $T \times T$ square to the unit square without loss: legs
      $(T-t)/T = 1-t/T$ turn the meeting problem's corner-triangle argument
      into $\Pr(\text{meet}) = 1-(1-t/T)^{2}$, a function of the single
      ratio $t/T$.

      Solving $1-(1-t/T)^{2} = 1/2$ for even odds gives
      $(1-t/T)^{2}=1/2$, so $1-t/T = 1/\sqrt{2}$ and
      $t/T = 1-1/\sqrt{2} \approx 0.293$ — patience needs to be roughly
      $29\%$ of the window, not half of it, for a coin-flip chance of
      meeting.

      When the two patiences differ — the earlier arrival waits $a$, the
      later one $b$ — the corner triangles stop being congruent: one has
      legs $T-a$, the other legs $T-b$, since each person's own patience
      sets how much of the other's arrival window is excluded on their
      side. Adding the two areas and dividing by $T^{2}$ gives
      $\Pr(\text{meet}) = 1-((T-a)^{2}+(T-b)^{2})/(2T^{2})$, which
      collapses back to the equal-patience formula when $a=b$.
    worked: >
      Two colleagues plan to meet within a $90$-minute window and each
      will wait $20$ minutes.
      $\Pr(\text{meet}) = 1-(1-20/90)^{2} = 1-(7/9)^{2} = 1-49/81 = 32/81
      \approx 0.3951$.
    interview: >
      "How long should each person wait for a $50/50$ chance of meeting"
      wants $t/T = 1-1/\sqrt{2} \approx 0.293$ stated directly, ideally
      with the corner-triangle picture named as where it came from, rather
      than a re-derivation from scratch.
    pitfalls: >
      Solving $(1-t/T)^{2}=1/2$ and taking the wrong root — $1-t/T$ must
      stay positive and below $1$ — gives an impossible ratio. Averaging
      two unequal patiences as $(a+b)/2$ and plugging into the
      equal-patience formula, instead of summing the two separate corner
      areas, gives the wrong number whenever $a \ne b$.
    recap: >
      $\Pr(\text{meet}) = 1-(1-t/T)^{2}$ depends only on patience as a
      fraction of the window — about $29\%$ buys even odds — and unequal
      patiences just resize the two corner triangles independently.
    dialogue:
      - part: Two open houses, one answer
        teach: >
          Two friends each arrive at a uniformly random time during a $3$-hour
          open house, independently, and each stays exactly $30$ minutes. They
          see each other if their arrival times are within $30$ minutes.
      - ask: >
          What is the probability they see each other?
        expects: "11/36"
        tolerance: 0.0005
        hint: >
          Work in minutes: a $180 \times 180$ square, corner triangles with
          legs $180 - 30$.
        feedback: >
          The two corners have combined area $150^{2}$, so
          $\Pr = 1 - (150/180)^{2} = 1 - 25/36 = 11/36 \approx 0.306$.
      - ask: >
          A second open house lasts $6$ hours, and each friend stays $1$ hour.
          Compared with $11/36$, the chance they see each other is
        choices:
          - text: >
              larger, because they have a whole hour to overlap.
            feedback: >
              The hour of overlap is set against a window twice as long. The
              corners have legs $5$ hours in a $6$-hour square, and
              $1 - (5/6)^{2}$ is $11/36$ again.
          - text: >
              the same.
            correct: true
            feedback: >
              Patience and window both doubled. The square and its corners are
              the same shape at twice the size, and a ratio of areas does not
              see the size.
          - text: >
              smaller, because the window is longer.
            feedback: >
              A longer window would hurt with the same patience, but the
              patience doubled too. Shrink the whole picture by $2$ and you are
              back at the first open house.
        feedback: >
          $(5/6)^{2} = (150/180)^{2}$: both problems are the same picture at
          different scales.
      - reflect: >
          Explain why the meeting probability can depend on the patience $t$
          and window $T$ only through $t/T$, and write the formula that comes
          out.
        answer: >
          Divide every length by $T$. The square becomes the unit square, the
          corner triangles get legs $1 - t/T$, and a ratio of areas is
          unchanged by rescaling both together. So
          $\Pr(\text{meet}) = 1 - (1 - t/T)^{2}$, a function of the single
          number $t/T$.
      - teach: >
          That is the general waiting window: with both arrivals uniform on
          $[0,T]$ and a common patience $t \le T$,
          $\Pr(\text{meet}) = 1 - (1 - t/T)^{2} = 2t/T - (t/T)^{2}$. The
          $2t/T$ is the quick band-width estimate, and the $(t/T)^{2}$ is what
          the square's edges take back.

      - part: Even money
        ask: >
          Before solving: what fraction $t/T$ of the window must each person
          be willing to wait for a $50\%$ chance of meeting?
        choices:
          - text: >
              $1/2$
            feedback: >
              Half the window gives $1 - (1/2)^{2} = 3/4$, well past even
              money. Patience pays quadratically at first.
          - text: >
              $1/4$
            feedback: >
              A quarter gives $1 - (3/4)^{2} = 7/16$, just short of $1/2$. The
              answer is a little more.
          - text: >
              A bit under $0.3$
            correct: true
            feedback: >
              Since $1/4$ falls just short and $1/2$ overshoots badly, the
              crossing sits a little above $1/4$.
        feedback: >
          The probability rises fast and then flattens, so even money comes
          well before half the window.
      - ask: >
          Solve $1 - (1 - t/T)^{2} = 1/2$ for $t/T$. Give four decimal places.
        expects: "0.2929"
        tolerance: 0.0005
        hint: >
          Take a square root, and keep the root that leaves $t/T$ between $0$
          and $1$.
        feedback: >
          $(1 - t/T)^{2} = 1/2$ gives $1 - t/T = 1/\sqrt{2}$, so
          $t/T = 1 - 1/\sqrt{2} \approx 0.2929$. The negative root,
          $1 - t/T = -1/\sqrt{2}$, would need a patience of $1.71$ windows.
      - ask: >
          For the $3$-hour open house, how many minutes must each friend stay
          for an even chance of seeing the other? Give one decimal place.
        expects: "52.7"
        tolerance: 0.1
        feedback: >
          $180 \times 0.2929 \approx 52.7$ minutes. Said aloud: "about $29\%$
          of the window".

      - part: When the patiences differ
        teach: >
          Now a $40$-minute window. If Ann arrives first she waits $16$
          minutes for Ben; if Ben arrives first he waits only $4$ minutes for
          Ann.
      - ask: >
          A colleague averages the patiences to $10$ and reports
          $1 - (1 - 10/40)^{2} = 7/16 = 0.4375$. Is that right?
        choices:
          - text: >
              Yes: on average each person waits $10$ minutes.
            feedback: >
              The corners are squares of their legs, and squaring does not
              commute with averaging. Equal patiences of $10$ cut two corners
              of legs $30$, area $900$ in total; the real corners have legs
              $24$ and $36$ and area $936$.
          - text: >
              No: use the smaller patience, $4$, since the meeting needs both.
            feedback: >
              Only one person waits in any given meeting — whoever arrived
              first. Ann's $16$ minutes still count whenever she is the early
              one.
          - text: >
              No: each patience sets its own corner, and the two corners must
              be computed separately.
            correct: true
            feedback: >
              Ann's patience trims the corner where Ben is late, and Ben's
              trims the other. The corners are no longer congruent.
        feedback: >
          The picture survives; the symmetry does not. Two different corners,
          two separate areas.
      - ask: >
          What is the area of the corner where Ben arrives more than $16$
          minutes after Ann, in square minutes?
        expects: "288"
        feedback: >
          The corner $Y - X > 16$ is a right isosceles triangle with legs
          $40 - 16 = 24$, area $24^{2}/2 = 288$.
      - ask: >
          What is the probability they meet?
        expects: "83/200"
        tolerance: 0.0005
        hint: >
          The other corner, $X - Y > 4$, has legs $40 - 4 = 36$.
        feedback: >
          The second corner has area $36^{2}/2 = 648$. Together the corners
          take $936$ of the $1600$-square-minute square, so
          $\Pr = 1 - 936/1600 = 664/1600 = 83/200 = 0.415$, below the averaged
          $0.4375$. In general,
          $\Pr = 1 - ((T-a)^{2} + (T-b)^{2})/(2T^{2})$.
      - ask: >
          Back to equal patience. Someone plugs $t = 90$ minutes into
          $1 - (1 - t/T)^{2}$ for a $60$-minute window. What is the true
          meeting probability?
        choices:
          - text: >
              $3/4$, what the formula returns.
            feedback: >
              $1 - (1 - 1.5)^{2} = 1 - 0.25 = 3/4$, but anyone who waits longer
              than the whole window cannot miss the other. The corners have
              legs $T - t < 0$, which means no corners at all.
          - text: >
              $1$
            correct: true
            feedback: >
              With $t \ge T$ the band covers the whole square, so they meet for
              certain. The formula holds only for $t \le T$.
          - text: >
              It is undefined: patience cannot exceed the window.
            feedback: >
              It can — a friend can be willing to wait $90$ minutes. The
              question is fine; the formula's hypothesis $t \le T$ is what
              fails.
        feedback: >
          The parabola $2r - r^{2}$ peaks at $r = t/T = 1$ and turns down after
          it, which no probability should do. Past $t = T$ the answer is $1$.


  - node: quant-probability.geometric.expected-separation
    hook: >
      Same square as the meeting problem, but now the interviewer wants a
      number rather than a yes/no event: "how far apart, on average, are
      two random arrival times" turns the corner-triangle picture into a
      full distribution.
    explanation: >
      Put $X, Y \sim U(0,1)$ independent and $D=|X-Y|$. The meeting
      problem's picture generalizes directly: $\{D>t\}$ is the same pair of
      corner triangles, now with legs $1-t$ for a general threshold, so
      $\Pr(D>t) = (1-t)^{2}$ for every $t$ in $[0,1]$ — the survival
      function of $D$. Differentiating (with the sign flip a survival
      function needs) gives density $f(t) = 2(1-t)$, decreasing linearly
      from $2$ at $t=0$ to $0$ at $t=1$.

      The mean follows fastest by integrating the tail rather than the
      density: for a nonnegative variable,
      $\mathbb{E}[D] = \int_{0}^{1} \Pr(D>t)\,dt = \int_{0}^{1}(1-t)^{2}\,dt
      = 1/3$ — a shortcut that avoids ever writing $t f(t)$.

      The same square answers two more questions for free. Since
      $\max(X,Y)+\min(X,Y) = X+Y$ has mean $1$ and $\max-\min=D$ has mean
      $1/3$, solving the pair gives $\mathbb{E}[\max] = 2/3$ and
      $\mathbb{E}[\min] = 1/3$. Rescaling to a $60$-minute window
      multiplies every length by $60$, so the mean gap there is $20$
      minutes.
    worked: >
      Two calls arrive independently and uniformly within an $8$-hour
      shift. Scaling to $t=3/8$,
      $\Pr(\text{gap}>3\text{ hours}) = (1-3/8)^{2} = (5/8)^{2} = 25/64
      \approx 0.3906$. The mean gap is $8/3 \approx 2.667$ hours.
    interview: >
      "What's the expected difference between two independent random times
      on $[0,T]$" wants $T/3$ stated immediately, with the tail-integral
      shortcut named as how you'd rederive it if pressed.
    pitfalls: >
      Integrating $t f(t)$ from scratch when the tail-integral shortcut
      $\int \Pr(D>t)\,dt$ is faster and less error-prone wastes time under
      pressure. Forgetting to rescale $D$'s mean by the window length $T$
      when the problem isn't stated on $[0,1]$ gives an answer off by a
      factor of $T$.
    recap: >
      The gap $D=|X-Y|$ between two uniform points has tail
      $\Pr(D>t)=(1-t)^{2}$ and mean $1/3$ — the meeting problem's band,
      integrated instead of just measured.
    dialogue:
      - part: Two emails, one gap
        teach: >
          Two emails arrive at independent, uniformly random times during a
          $45$-minute window. You want the typical time between them: the gap
          $D$, the absolute difference of the two arrival times.
      - ask: >
          First a probability you can already get. What is the chance the
          emails arrive more than $15$ minutes apart?
        expects: "4/9"
        tolerance: 0.0005
        hint: >
          It is the meeting problem's complement: two corner triangles.
        feedback: >
          The corners $|X - Y| > 15$ in the $45 \times 45$ square have legs
          $30$ and combined area $30^{2} = 900$, so
          $\Pr = 900/2025 = (30/45)^{2} = 4/9$.
      - ask: >
          A colleague argues the gap is uniform on $[0, 45]$, so it exceeds
          $15$ minutes with probability $2/3$ and averages $22.5$ minutes. Your
          $4/9$ disagrees. What does that say about gaps?
        choices:
          - text: >
              Small gaps are more likely than large ones.
            correct: true
            feedback: >
              A gap near $0$ can happen anywhere along the diagonal of the
              square; a gap near $45$ needs one email at the very start and the
              other at the very end. Large gaps live in thin corners.
          - text: >
              Gaps near the middle, about $22.5$ minutes, are the most likely.
            feedback: >
              The set of pairs with gap near $g$ is a pair of thin strips
              parallel to the diagonal, of length proportional to $45 - g$.
              Those strips are longest at $g = 0$ and shrink steadily.
          - text: >
              The colleague is right, and the $4/9$ has an error.
            feedback: >
              Check an extreme: a gap above $44$ minutes needs one email in the
              first minute and the other in the last: two corners of legs $1$,
              combined area $1$, probability $1/2025 \approx 0.0005$, far
              below the uniform $1/45 \approx 0.022$.
        feedback: >
          The gap is not uniform: its tail is a square, not a straight line.
      - ask: >
          Rescale the window to $[0,1]$. For a threshold $t$ in $[0,1]$, what
          is $\Pr(D > t)$?
        choices:
          - text: >
              $1 - t$
            feedback: >
              That is the uniform tail the colleague assumed. At $t = 1/3$ it
              gives $2/3$, not the $4/9$ you computed.
          - text: >
              $(1 - t)^{2}$
            correct: true
            feedback: >
              The two corners have legs $1 - t$ and combined area $(1-t)^{2}$.
              At $t = 1/3$ that is $4/9$, as before.
          - text: >
              $2t - t^{2}$
            feedback: >
              That is $\Pr(D \le t)$, the meeting probability — the band, not
              the corners.
          - text: >
              $1 - t^{2}$
            feedback: >
              That is $\Pr(\max(X,Y) > t)$, the complement of both arrivals
              landing below $t$. A different event from a large gap.
        feedback: >
          The meeting problem's picture, read with a variable patience, gives
          the whole tail of $D$ at once.
      - reflect: >
          You know $\Pr(D > t)$ for every $t$ but have not written down a
          density. How could you get $\mathbb{E}[D]$ directly from the tail?
        hint: >
          Write $D$ as the length of the set of $t$ in $[0,1]$ with $t < D$.
        answer: >
          For a nonnegative $D$, $D = \int_{0}^{1} \mathbf{1}\{D > t\}\,dt$,
          since the indicator is $1$ exactly for $t$ below $D$. Taking
          expectations inside the integral gives
          $\mathbb{E}[D] = \int_{0}^{1} \Pr(D > t)\,dt$: integrate the tail,
          and the density never has to appear.
      - teach: >
          That tail-integral identity, $\mathbb{E}[D] = \int_{0}^{\infty}
          \Pr(D > t)\,dt$ for any nonnegative $D$, is the fast route whenever
          the tail is the thing the picture hands you. Here the picture hands
          you $(1-t)^{2}$, and the density $2(1-t)$ — its negative derivative —
          is only needed if someone asks for it.
      - ask: >
          What is $\mathbb{E}[D]$ on the unit window?
        expects: "1/3"
        tolerance: 0.0005
        feedback: >
          $\int_{0}^{1} (1-t)^{2}\,dt = [-(1-t)^{3}/3]_{0}^{1} = 1/3$.
      - ask: >
          So what is the expected gap between the two emails, in minutes?
        expects: "15"
        feedback: >
          Every length scales by $45$, so $\mathbb{E}[D] = 45/3 = 15$ minutes,
          not the colleague's $22.5$.

      - part: More from the same square
        ask: >
          Still on $[0,1]$. Using $\max + \min = X + Y$ and
          $\max - \min = D$, what is $\mathbb{E}[\min(X,Y)]$?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          Subtract the two identities and take expectations.
        feedback: >
          $2\min = (X + Y) - D$, so
          $\mathbb{E}[\min] = (1 - 1/3)/2 = 1/3$, and then
          $\mathbb{E}[\max] = 1 - 1/3 = 2/3$. The three means split the unit
          interval into equal thirds.
      - ask: >
          What is $\operatorname{Var}(D)$?
        expects: "1/18"
        tolerance: 0.0005
        hint: >
          $D^{2} = (X - Y)^{2}$, so $\mathbb{E}[D^{2}]$ needs only
          $\mathbb{E}[X^{2}] = 1/3$ and independence.
        feedback: >
          $\mathbb{E}[D^{2}] = \mathbb{E}[X^{2}] - 2\mathbb{E}[X]\mathbb{E}[Y]
          + \mathbb{E}[Y^{2}] = 1/3 - 1/2 + 1/3 = 1/6$, so
          $\operatorname{Var}(D) = 1/6 - (1/3)^{2} = 1/18$.

      - part: Where independence was used
        ask: >
          Now $X \sim U(0,1)$ and $Y = 1 - X$, so each is still uniform on
          $[0,1]$. What is $\mathbb{E}|X - Y|$?
        expects: "1/2"
        tolerance: 0.0005
        hint: >
          $|X - Y| = |2X - 1|$. How is that distributed?
        feedback: >
          $|2X - 1|$ is uniform on $[0,1]$, so its mean is $1/2$, not $1/3$.
          The pair now sits on the anti-diagonal of the square rather than
          filling it, and the corner-triangle tail no longer applies. The
          $1/3$ needs independence, not just uniform marginals. In an
          interview: "two independent uniforms on $[0,T]$ sit $T/3$ apart on
          average — integrate the tail $(1-t)^{2}$".


  - node: quant-probability.geometric.stick-triangle
    hook: >
      "Break a stick at two random points — what's the probability the
      three pieces form a triangle" punishes candidates who try to algebra
      through three separate inequalities instead of drawing the excluded
      regions.
    explanation: >
      Two uniform breaks $X,Y$ on $[0,1]$ give three pieces summing to
      $1$: $m=\min(X,Y)$, $M-m$, and $1-M$ where $M=\max(X,Y)$. Three
      positive lengths summing to a fixed total form a triangle exactly
      when no single piece reaches half the total — if one piece is at
      least half, the other two together can't exceed it, so that
      restatement, "no piece exceeds $1/2$," is the entire content of the
      problem.

      Translate each of the three failure conditions into a region of the
      $(X,Y)$ unit square. $m>1/2$ means both breaks landed in the right
      half — a quarter-square in one corner. $1-M>1/2$ means both landed
      in the left half — the opposite quarter-square. $M-m>1/2$ means the
      two breaks sit more than half the stick apart — the two corner
      triangles $|X-Y|>1/2$, together also a quarter of the square. These
      three regions are disjoint, since each pins down a different piece
      as the oversized one, and each has area $1/4$, so failure has
      probability $3/4$ and forming a triangle has probability exactly
      $1/4$.

      The boundary case where a piece equals exactly $1/2$ has probability
      $0$, so it never needs separate handling — the same reason
      boundaries never mattered for a uniform point in general.
    worked: >
      Rescale to a wire of length $12$, cut at two independent uniform
      points. No piece may exceed $6$. Each of the three excluded regions
      — both cuts right of $6$, both left of $6$, cuts more than $6$
      apart — has area $(12/2)^{2}=36$ in a total area $144$ square, three
      disjoint regions summing to $108$. The triangle-forming probability
      is $(144-108)/144 = 36/144 = 1/4$, unchanged from the unit stick,
      since only the ratio of areas ever mattered.
    interview: >
      "Break a stick in two places — probability of a triangle" wants
      "$1/4$, because no piece can exceed half" stated immediately, with
      the three-quarter-square picture offered as the justification.
    pitfalls: >
      Enumerating the triangle inequality's three separate conditions
      directly in $X,Y$ coordinates is far messier than the equivalent
      "no piece exceeds half" restatement. Missing that the three failure
      regions are disjoint, and double-counting an overlap that doesn't
      exist, is a common area-arithmetic slip.
    recap: >
      A stick broken at two uniform points forms a triangle with
      probability exactly $1/4$: no piece may exceed half, which excludes
      three disjoint quarters of the square.
    dialogue:
      - part: Three pieces of a breadstick
        teach: >
          A $30$-centimetre breadstick snaps at two points, each uniform along
          its length and independent of the other. You want the probability
          that the three pieces can be laid out as a triangle.
      - ask: >
          Suppose the snaps land $4$ and $12$ centimetres from the left end.
          How long is the longest piece?
        expects: "18"
        feedback: >
          The pieces are $4$, $12 - 4 = 8$ and $30 - 12 = 18$.
      - ask: >
          Can $4$, $8$ and $18$ form a triangle?
        choices:
          - text: >
              Yes: any three positive lengths can be joined end to end.
            feedback: >
              Try it: lay the $18$ down and swing the $4$ and the $8$ up from
              its ends. Together they reach only $12$, so they never meet.
          - text: >
              No: $4 + 8 = 12$ is less than $18$.
            correct: true
            feedback: >
              The two short sides cannot span the long one. A triangle needs
              every side shorter than the other two combined.
          - text: >
              Yes, but only a very flat one.
            feedback: >
              A flat triangle needs the two short sides to add up to the long
              one exactly. Here they fall $6$ short.
        feedback: >
          The triangle inequality fails on the longest piece.
      - reflect: >
          The triangle inequality is three conditions, one per side. With three
          lengths that always sum to $30$, find a single condition that says
          all three at once.
        hint: >
          Side $a$ is shorter than the other two combined when
          $a < 30 - a$.
        answer: >
          Each condition reads $a < 30 - a$, that is $a < 15$. So the pieces
          form a triangle exactly when no piece reaches half the stick. One
          condition on the longest piece replaces three inequalities, and a
          failure always has exactly one culprit, since two pieces cannot both
          exceed half.
      - teach: >
          Rescale to a stick of length $1$ with breaks at $X$ and $Y$, and let
          $m = \min(X,Y)$ and $M = \max(X,Y)$. The pieces are $m$, $M - m$ and
          $1 - M$, and they form a triangle exactly when none exceeds $1/2$.
          Each way to fail is a region of the unit square.

      - part: Three regions in the square
        ask: >
          The left piece $m$ exceeds $1/2$. Where are the breaks?
        choices:
          - text: >
              At least one break is in the right half.
            feedback: >
              The left piece runs up to the first break. If either break were
              in the left half, $m$ would be at most $1/2$.
          - text: >
              Both breaks are in the right half.
            correct: true
            feedback: >
              The square $[1/2,1] \times [1/2,1]$, area $1/4$. By the mirror
              argument, the right piece exceeds $1/2$ exactly when both breaks
              are in the left half, another square of area $1/4$.
          - text: >
              The breaks are more than $1/2$ apart.
            feedback: >
              That makes the middle piece, $M - m$, too long — a different
              failure.
        feedback: >
          The two end pieces fail on two opposite quarter-squares.
      - ask: >
          What is the area of the region where the middle piece exceeds $1/2$?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          $M - m > 1/2$ is $|X - Y| > 1/2$.
        feedback: >
          $|X - Y| > 1/2$ is two corner triangles with legs $1/2$, each of area
          $1/8$, so $1/4$ in total — the meeting problem's corners with
          patience half the window.
      - ask: >
          To get the failure probability, can you simply add the three areas?
        choices:
          - text: >
              No: the regions overlap along the lines $x = 1/2$ and
              $y = 1/2$.
            feedback: >
              They touch along lines, which have area $0$. Touching boundaries
              never affect an area ratio.
          - text: >
              Yes: two pieces cannot both exceed half of a stick of length $1$.
            correct: true
            feedback: >
              The pieces sum to $1$, so at most one can exceed $1/2$. Each
              failure has one culprit, and the regions are disjoint.
          - text: >
              No: use inclusion–exclusion, subtracting the pairwise overlaps.
            feedback: >
              The overlaps would be outcomes where two pieces both exceed
              $1/2$, which need a total over $1$. Every overlap is empty.
        feedback: >
          Disjoint regions add.
      - ask: >
          What is the probability the three pieces of the breadstick form a
          triangle?
        expects: "1/4"
        tolerance: 0.0005
        feedback: >
          Failure covers $1/4 + 1/4 + 1/4 = 3/4$ of the square, so the
          triangle forms with probability $1 - 3/4 = 1/4$. The $30$ centimetres
          never mattered.

      - part: Reading the picture further
        ask: >
          The breadstick fails to make a triangle. What is the probability the
          middle piece is the culprit?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          Condition on the failure region.
        feedback: >
          The middle piece's region is $1/4$ out of a failure region of $3/4$,
          so $1/3$. Each of the three pieces is equally likely to be the one
          that is too long.
      - ask: >
          A colleague snaps the breadstick once at a uniform point, then snaps
          the resulting two-piece breadstick again at a point uniform along
          the whole original length, wherever that falls. Is the triangle
          probability still $1/4$?
        choices:
          - text: >
              No: breaking in two stages is a different mechanism.
            feedback: >
              Stages alone do not change anything. The second point is uniform
              on the whole stick and independent of the first, so the pair of
              break points is the same uniform point in the square.
          - text: >
              Yes: the two break points are still independent and uniform on
              the whole stick.
            correct: true
            feedback: >
              Order of breaking is irrelevant; the distribution of the pair of
              points is all the square sees.
          - text: >
              No: the second break is more likely to hit the longer piece.
            feedback: >
              It is — in proportion to length, which is exactly what a uniform
              point on the whole stick does. That is still the simultaneous
              mechanism.
        feedback: >
          The answer would change only if the second break were uniform along
          a chosen piece rather than along the whole stick. Said aloud: "a
          quarter: no piece may exceed half, and that rules out three disjoint
          quarters of the square".


  - node: quant-probability.geometric.stick-piece-lengths
    hook: >
      "What's the expected length of the biggest of the three pieces"
      tempts a symmetry answer of $1/2$ or $1/3$; the correct answer,
      $11/18$, is the standard trap for conflating "exchangeable" with
      "identically ranked."
    explanation: >
      The three spacings from the broken-stick picture — however dependent
      on each other — are exchangeable: no position among them is
      structurally favored by the breaking mechanism, so all three share
      the same mean, and since they sum to $1$, that shared mean must be
      $1/3$ each, with no integration required.

      Sorting destroys that symmetry. Picking "the shortest of the three"
      or "the longest of the three" is a selection rule, not a fixed
      piece, and selection is biased: the shortest spacing is pulled down
      because it was chosen for being small, and the longest is pulled up
      for the same reason in reverse — which is why
      $\mathbb{E}[\text{shortest}]=1/9$ and $\mathbb{E}[\text{longest}]=
      11/18$ sit far from the shared unsorted mean of $1/3$, while
      $\mathbb{E}[\text{middle}]=5/18$ lands close to it.

      The pattern extends to $n$ breaks: $n+1$ spacings each averaging
      $1/(n+1)$, the shortest averaging $1/(n+1)^{2}$ — squared down by
      the same selection bias — and the longest averaging
      $H_{n+1}/(n+1)$, inflated by the harmonic number. A single break
      ($n=1$) is the simplest case: two pieces average $1/2$ each, and the
      longer one averages $3/4$.
    worked: >
      Break a stick at $3$ independent uniform points ($n=3$), giving $4$
      spacings averaging $1/4$ each. The shortest spacing averages
      $1/16=0.0625$, and the longest averages
      $H_4/4=(1+1/2+1/3+1/4)/4=(25/12)/4=25/48\approx0.5208$ — already
      over half the stick, on average, from one competitively selected
      piece out of four.
    interview: >
      "What's the expected length of the longest of $n$ random pieces" is
      testing whether the harmonic-number answer $H_{n+1}/(n+1)$ is known
      to exist at all, versus defaulting to the naive, wrong $1/(n+1)$.
    pitfalls: >
      Assuming the sorted pieces share the unsorted mean $1/3$ (or
      $1/(n+1)$ generally) is the single most common error here — sorting
      is a biased selection, not a relabeling. Treating the three spacings
      as independent because they're exchangeable breaks any variance or
      joint calculation; they are exchangeable and dependent at once.
    recap: >
      Every piece averages $1/3$ by symmetry, yet sorting is biased: the
      longest of three averages $11/18$ and the shortest only $1/9$.
    dialogue:
      - part: A rope cut twice
        teach: >
          A $90$-centimetre rope is cut at two points, each uniform along its
          length and independent of the other, leaving a left piece, a middle
          piece and a right piece.
      - ask: >
          Which piece is longest on average?
        choices:
          - text: >
              The middle piece: it has a random point at both ends, so it can
              stretch both ways.
            feedback: >
              The end pieces also have one random end each, and a fixed end
              that is as far out as it can be. The two effects balance exactly.
          - text: >
              The end pieces: each one reaches all the way to an end of the
              rope.
            feedback: >
              The middle piece is bounded by two random points, but those are
              free to spread out. Nothing in the mechanism favours a position.
          - text: >
              None: all three have the same average length.
            correct: true
            feedback: >
              Two uniform cuts make the three gaps exchangeable — relabelling
              left, middle and right does not change their joint distribution.
        feedback: >
          The three pieces are statistically interchangeable.
      - ask: >
          What is the expected length of the middle piece, in centimetres?
        expects: "30"
        hint: >
          The three lengths always add to $90$.
        feedback: >
          The three means are equal and, by linearity, add to
          $\mathbb{E}[\text{total}] = 90$, so each is $30$.
      - reflect: >
          You found $30$ with no integral. Say exactly what you used, and
          whether it matters that the three lengths are strongly dependent.
        answer: >
          Two facts: the pieces are exchangeable, so their means are equal,
          and expectation is additive, so the means sum to the fixed total.
          Dependence is irrelevant — linearity of expectation holds for any
          random variables, and these three are as dependent as can be, since
          any two determine the third.

      - part: The longest piece is a different question
        ask: >
          Now cut a fresh $90$-centimetre rope at a single uniform point. Each
          piece averages $45$. What is the expected length of the longer
          piece?
        expects: "67.5"
        tolerance: 0.05
        hint: >
          On a rope of length $1$, the longer piece is $\max(X, 1-X)$. Where
          does it live, and how is it spread there?
        feedback: >
          On a unit rope, $\max(X, 1-X)$ is uniform on $[1/2, 1]$ — each value
          $\ell$ arises from $X = \ell$ or $X = 1 - \ell$ — so its mean is
          $3/4$. Scaled: $90 \times 3/4 = 67.5$ centimetres.
      - ask: >
          Both pieces average $45$, yet the longer one averages $67.5$. Why
          does the symmetry argument not reach it?
        choices:
          - text: >
              It does: $67.5$ is wrong and the longer piece averages $45$.
            feedback: >
              The longer piece is at least $45$ on every cut, and more than
              $45$ on almost every cut, so its average must exceed $45$.
          - text: >
              "The longer piece" is chosen after looking at the cut, so it is
              not one of the exchangeable labelled pieces.
            correct: true
            feedback: >
              Left and right are fixed labels and share a mean. "Longer" is a
              selection made from the outcome, and selecting the big one
              biases the mean up.
          - text: >
              The two pieces are dependent, and symmetry needs independence.
            feedback: >
              Symmetry used no independence at all — the left and right
              pieces of a single cut are perfectly dependent and still share
              the mean $45$.
        feedback: >
          Exchangeability gives the mean of each labelled piece. Sorting is a
          selection, and selections need their own computation.
      - ask: >
          On the single-cut rope, what is the expected length of the shorter
          piece, in centimetres?
        expects: "22.5"
        tolerance: 0.05
        feedback: >
          Shorter plus longer is $90$, so $90 - 67.5 = 22.5$. On a unit rope,
          $\min(X, 1-X)$ is uniform on $[0, 1/2]$ with mean $1/4$.
      - teach: >
          The pattern for $n$ uniform cuts of a unit stick: the $n + 1$ pieces
          each average $1/(n+1)$, the shortest averages $1/(n+1)^{2}$ and the
          longest averages $H_{n+1}/(n+1)$, where
          $H_{k} = 1 + 1/2 + \cdots + 1/k$. Your single cut checks it:
          $1/2^{2} = 1/4$ and $H_{2}/2 = (3/2)/2 = 3/4$. For two cuts the
          shortest averages $1/9$.

      - part: Back to two cuts
        ask: >
          On the $90$-centimetre rope cut twice, what is the expected length of
          the longest piece?
        expects: "55"
        tolerance: 0.05
        hint: >
          $H_{3} = 1 + 1/2 + 1/3$.
        feedback: >
          $H_{3}/3 = (11/6)/3 = 11/18$ of the rope, and $90 \times 11/18 = 55$
          centimetres. The biggest piece averages well over half the rope,
          though a "typical" piece is $30$.
      - ask: >
          And the expected length of the middle-sized piece?
        expects: "25"
        tolerance: 0.05
        hint: >
          Shortest, middle-sized and longest are still three pieces adding to
          $90$.
        feedback: >
          The shortest averages $90/9 = 10$, the longest $55$, and the three
          sorted lengths still sum to $90$, so the middle one averages
          $90 - 10 - 55 = 25$ centimetres — the only sorted piece close to the
          unsorted $30$.
      - ask: >
          Back to the three labelled pieces, each with mean $30$ and the same
          variance $v > 0$. What is the variance of left $+$ middle $+$ right?
        expects: "0"
        feedback: >
          The sum is always exactly $90$, so its variance is $0$. Had the
          pieces been independent it would be $3v > 0$. They are exchangeable
          and dependent at once — fine for means, fatal for anything that
          treats them as independent.
      - ask: >
          Pick a point on the rope, its exact middle at $45$ centimetres, and
          look at whichever piece contains it. Its expected length is
        choices:
          - text: >
              $30$: it is one of the three pieces.
            feedback: >
              Which piece contains the midpoint depends on the cuts, so this
              is another selection. Long pieces cover more of the rope, so they
              are more likely to be the one covering $45$.
          - text: >
              more than $30$.
            correct: true
            feedback: >
              It works out to $7/12$ of the rope, $52.5$ centimetres: if both
              cuts fall on one side the piece averages $2/3$, and if they
              straddle the midpoint it averages $1/2$. A random point lands in
              a long piece more often than a short one.
          - text: >
              less than $30$, since the middle is crowded with cuts.
            feedback: >
              The cuts are uniform; the middle is not more crowded than
              anywhere else. And the selection runs the other way — towards
              long pieces.
        feedback: >
          Labelled pieces share the mean $1/(n+1)$. Any piece picked by what
          the cuts did — longest, shortest, the one covering a given point —
          needs its own calculation. In an interview, name the selection
          before you quote a number.


  - node: quant-probability.geometric.stick-sequential-break
    hook: >
      "Break a stick, then break one of the pieces again" sounds like the
      same experiment as breaking it twice at once — it isn't, and the gap
      between $1/4$ and roughly $0.19$ or $0.39$ is exactly what an
      interviewer is probing by adding "in two stages" to the question.
    explanation: >
      Break once at $X \sim U(0,1)$, splitting the stick into a left piece
      of length $X$ and a right piece of length $1-X$. Always re-breaking
      the left piece uniformly along its own length, a triangle needs
      $X>1/2$ (so the untouched right piece is under half the stick) and
      the second break to land inside a window of length $1-X$ within a
      piece of length $X$, a conditional probability $(1-X)/X$.

      Integrating that conditional probability over $X$, weighted by its
      uniform density of $1$:
      $\Pr = \int_{1/2}^{1}(1-x)/x\,dx = [\ln x - x]_{1/2}^{1} =
      (0-1)-(-\ln 2-1/2) = \ln 2-1/2 \approx 0.193$ — the antiderivative
      $\ln x - x$ is the one load-bearing step.

      The mechanism is what changes the probability, not the words "break
      it twice at random": always re-breaking whichever piece happens to
      be longer, $L=\max(X,1-X)$ with density $2$ on $(1/2,1)$, gives a
      different integral and a different answer, $2\ln 2-1\approx0.386$ —
      roughly double the "always break left" answer, since operating on
      the longer piece systematically gives the second cut more room to
      balance the pieces.
    worked: >
      Suppose instead you always re-break the shorter piece, length
      $s=\min(X,1-X)$. The untouched piece then has length
      $1-s=\max(X,1-X)\ge 1/2$ always, so no matter where the second break
      lands, one piece is at least half the stick and the triangle
      inequality fails with probability $1$. This mechanism gives
      $\Pr(\text{triangle})=0$ exactly — the untouched longer piece alone
      kills every attempt.
    interview: >
      "Two-stage stick breaking" is a deliberate mechanism check: the
      interviewer wants the ambiguity noticed the moment a specific piece
      is singled out for the second cut, and the conditional-probability
      integral set up rather than the simultaneous-break answer $1/4$
      reused.
    pitfalls: >
      Reusing $1/4$ because the problem still says "break a stick at two
      random points" ignores that sequential re-breaking changes the
      sample space entirely. Treating the second break as uniform over the
      whole stick, rather than uniform within the chosen piece, misplaces
      the probability mass.
    recap: >
      Sequential breaking gives $\ln 2-1/2\approx0.193$ (re-break the left
      piece) or $2\ln 2-1\approx0.386$ (re-break the longer piece), and
      re-breaking the shorter piece gives exactly $0$ — the procedure, not
      the words, fixes the answer.
    dialogue:
      - part: One cut, then another
        teach: >
          A $1$-metre plank is sawn at a uniform point $X$. Then the left
          piece, of length $X$, is sawn again at a point uniform along that
          piece. You want the probability the three pieces form a triangle.
      - ask: >
          Before computing: is the answer the $1/4$ of two independent uniform
          cuts?
        choices:
          - text: >
              Yes: two cuts at random positions is two cuts at random
              positions.
            feedback: >
              The second cut is not uniform on the plank. It is confined to the
              left piece, and squeezed into a short piece whenever $X$ is
              small. Different distribution of cut points, different answer.
          - text: >
              No: the second cut is uniform on the left piece, not on the whole
              plank.
            correct: true
            feedback: >
              The pair of cut points is no longer a uniform point in the square,
              so the square's $1/4$ does not apply.
          - text: >
              Yes, because the triangle condition is still "no piece exceeds
              $1/2$".
            feedback: >
              The condition is the same; the probability of meeting it depends
              on how the cuts are distributed, and that changed.
        feedback: >
          Same words, a different mechanism. The condition carries over; the
          answer has to be recomputed.
      - ask: >
          Suppose the first cut lands at $X = 0.3$. What is the probability
          the second cut produces a triangle?
        expects: "0"
        feedback: >
          The right piece is $0.7$, untouched by the second cut, and it already
          exceeds $1/2$. No second cut can help, so the probability is $0$.
          Every $X < 1/2$ is a lost cause.
      - ask: >
          Suppose instead $X = 0.6$. The second cut lands at a point $Y$
          uniform on $[0, 0.6]$. What is the probability of a triangle?
        expects: "2/3"
        tolerance: 0.0005
        hint: >
          The right piece is $0.4$, fine. The left two pieces are $Y$ and
          $0.6 - Y$; both must be under $1/2$.
        feedback: >
          $Y < 0.5$ and $0.6 - Y < 0.5$, so $Y$ must lie in $(0.1, 0.5)$, a
          window of length $0.4$ inside a piece of length $0.6$:
          $0.4/0.6 = 2/3$.
      - reflect: >
          Generalise the last answer to any first cut $x > 1/2$, and say how
          you would combine the answers for different $x$ into one
          probability.
        answer: >
          The second cut must land in $(x - 1/2, 1/2)$, a window of length
          $1 - x$ inside a piece of length $x$, so the conditional probability
          is $(1 - x)/x$. For $x < 1/2$ it is $0$. Averaging over the uniform
          first cut gives $\int_{1/2}^{1} (1-x)/x\,dx$. The square is gone; a
          conditional probability, integrated, replaces it.
      - ask: >
          Evaluate $\int_{1/2}^{1} (1-x)/x\,dx$ to four decimal places.
        expects: "0.1931"
        tolerance: 0.0005
        hint: >
          $(1-x)/x = 1/x - 1$.
        feedback: >
          The antiderivative is $\ln x - x$, so the integral is
          $(0 - 1) - (\ln(1/2) - 1/2) = \ln 2 - 1/2 \approx 0.1931$. Always
          sawing the left piece makes a triangle less often than two
          simultaneous cuts.

      - part: Saw the longer piece instead
        ask: >
          New rule: after the first cut, saw whichever piece is longer, at a
          point uniform along it. Compared with $0.1931$, the triangle
          probability will be
        choices:
          - text: >
              lower: you keep cutting the piece that is already the problem.
            feedback: >
              Cutting the longer piece is exactly what fixes the problem — it
              is the only piece that might exceed $1/2$, and now it gets
              divided.
          - text: >
              higher.
            correct: true
            feedback: >
              The untouched piece is now the shorter one, always under $1/2$,
              so no first cut is a lost cause. Under the left-piece rule, half
              the first cuts were.
          - text: >
              the same, by symmetry between the pieces.
            feedback: >
              Symmetry would hold between "left" and "right", but "longer" is
              a choice made after seeing the cut, and it is a better choice.
        feedback: >
          The rule for picking the piece is part of the mechanism.
      - ask: >
          The first cut lands at $0.3$, so you saw the right piece, of length
          $0.7$. What is the probability of a triangle?
        expects: "3/7"
        tolerance: 0.0005
        hint: >
          The second cut is uniform on $[0.3, 1]$. Neither of the new pieces
          may exceed $1/2$.
        feedback: >
          A cut at $y$ makes pieces $y - 0.3$ and $1 - y$; both under $1/2$
          means $0.5 < y < 0.8$, a window of $0.3$ in a piece of $0.7$, so
          $3/7$. That is $(1 - \ell)/\ell$ with $\ell = 0.7$: the same formula,
          now applied to the longer piece's length $\ell$.
      - ask: >
          The longer piece has length $L = \max(X, 1 - X)$. How is $L$
          distributed?
        choices:
          - text: >
              Uniform on $[0, 1]$, like $X$.
            feedback: >
              $L$ can never be below $1/2$ — the longer of two pieces of a unit
              plank is at least half of it.
          - text: >
              Density $1$ on $[1/2, 1]$.
            feedback: >
              That carries total probability only $1/2$. Each value $\ell$
              comes from two first cuts, $X = \ell$ and $X = 1 - \ell$, so the
              density doubles.
          - text: >
              Uniform on $[1/2, 1]$, with density $2$.
            correct: true
            feedback: >
              Folding $[0,1]$ at $1/2$ stacks two uniform halves on top of each
              other: density $2$ on $[1/2, 1]$.
        feedback: >
          The longer piece is uniform on the upper half.
      - ask: >
          So what is the triangle probability under the longer-piece rule?
          Give four decimal places.
        expects: "0.3863"
        tolerance: 0.0005
        hint: >
          Integrate $(1 - \ell)/\ell$ against density $2$ on $[1/2, 1]$.
        feedback: >
          $\int_{1/2}^{1} 2(1-\ell)/\ell\,d\ell = 2(\ln 2 - 1/2) =
          2\ln 2 - 1 \approx 0.3863$ — exactly twice the left-piece answer,
          since every first cut now has a chance.

      - part: Which rule gives a quarter
        ask: >
          After the first cut, a piece is chosen and sawn at a point uniform
          along it. Which rule for choosing the piece gives back the $1/4$ of
          two simultaneous cuts?
        choices:
          - text: >
              Toss a fair coin between the two pieces.
            feedback: >
              By symmetry each side of the coin gives $\ln 2 - 1/2$, so the
              coin gives $0.1931$ as well. A fair coin ignores the lengths.
          - text: >
              Choose each piece with probability proportional to its length.
            correct: true
            feedback: >
              Picking a piece in proportion to its length and then a uniform
              point in it is the same as picking a uniform point on the whole
              plank. That is the simultaneous mechanism, so $1/4$.
          - text: >
              Always the longer piece.
            feedback: >
              That gives $2\ln 2 - 1 \approx 0.3863$. It over-favours the
              piece that needs cutting.
        feedback: >
          Three rules for the second cut, three answers: $0.1931$, $1/4$,
          $0.3863$. In an interview, the moment a specific piece is singled out
          for the second cut, say which rule you are pricing.


  - node: quant-probability.geometric.buffon
    hook: >
      "Design a physical experiment that estimates $\pi$" is standardly
      answered with Buffon's needle, and the real test is setting up the
      $(x,\theta)$ rectangle rather than quoting the formula from memory.
    explanation: >
      Two coordinates describe where a dropped needle lands: $x$, the
      distance from its center to the nearest line, uniform on $[0,d/2]$,
      and $\theta$, the acute angle it makes with the lines, uniform on
      $[0,\pi/2]$ and independent of $x$ — the pair is a uniform point in a
      $d/2$-by-$\pi/2$ rectangle, per the independent-coordinates
      translation. The needle crosses a line exactly when its
      half-length's vertical reach exceeds the distance to that line:
      $x \le (\ell/2)\sin\theta$.

      The favorable region sits under the curve $x=(\ell/2)\sin\theta$
      inside the rectangle, with area
      $\int_{0}^{\pi/2}(\ell/2)\sin\theta\,d\theta =
      (\ell/2)[-\cos\theta]_{0}^{\pi/2} = \ell/2$ — the one calculus step
      doing all the work, since sine's antiderivative evaluates cleanly at
      the quarter-turn. Dividing by the rectangle's total area
      $(\pi/2)(d/2)=\pi d/4$ gives $\Pr(\text{cross})=2\ell/(\pi d)$.

      The $\pi$ here comes purely from the rectangle's angle range, not
      from any circular geometry in the needle itself — which is exactly
      why the formula inverts cleanly: drop the needle $N$ times, count
      the crossing frequency $\hat{p}$, and
      $\pi \approx 2\ell/(d\hat{p})$ is a genuine, if slow-converging,
      Monte Carlo estimator.
    worked: >
      Take $\ell=3$, $d=5$, a needle shorter than the gap.
      $\Pr(\text{cross})=2(3)/(5\pi)=6/(5\pi)\approx0.3820$. If $1000$
      drops produce an observed crossing frequency of $0.38$, inverting
      gives $\pi \approx 2(3)/(5 \times 0.38) = 6/1.9 \approx 3.158$ — in
      the right neighborhood despite needing far more drops to tighten.
    interview: >
      "How would you estimate $\pi$ with a physical experiment" is
      answered with Buffon's needle; the interviewer listens for the
      $(x,\theta)$ rectangle and the $\sin\theta$ boundary curve, not just
      the formula $2\ell/(\pi d)$ recited cold.
    pitfalls: >
      Dropping the restriction $\ell \le d$ — needed so the needle can
      cross at most one line, keeping the crossing count a $0/1$ event —
      breaks the probability interpretation for a longer needle. Measuring
      $x$ from one particular line, uniform on $[0,d]$, and testing only
      that line forgets the needle can cross the line on its other side,
      and halves the answer.
    recap: >
      The needle crosses a line with probability $2\ell/(\pi d)$, found as
      the area under $x=(\ell/2)\sin\theta$ inside the $(x,\theta)$
      rectangle — invertible into a Monte Carlo estimate of $\pi$.
    dialogue:
      - part: A toothpick on floorboards
        teach: >
          A floor is laid with boards $12$ centimetres wide, so the cracks
          between them are parallel lines $12$ apart. A $6$-centimetre
          toothpick is dropped on it, landing anywhere and pointing any way.
          You want the probability it lies across a crack.
      - ask: >
          Which two numbers pin down whether it crosses, and are uniform and
          independent?
        choices:
          - text: >
              The positions of its two ends along the boards.
            feedback: >
              Those are four coordinates, tied together by the toothpick's
              fixed length: knowing one end restricts the other to a circle.
              Not independent, not a box.
          - text: >
              The distance from its centre to the nearest crack, and the acute
              angle it makes with the cracks.
            correct: true
            feedback: >
              The distance is uniform on $[0, 6]$ — half a board, since the
              nearest crack is never more than $6$ away — and the angle is
              uniform on $[0, \pi/2]$, independent of the distance. Sliding
              along the cracks changes nothing, so that coordinate drops out.
          - text: >
              The distance from its left end to the nearest crack, and its
              length.
            feedback: >
              The length is fixed at $6$, so it is not random. And the left end
              alone cannot say whether the toothpick reaches the crack; you
              need its direction too.
        feedback: >
          Two coordinates, $x$ for the centre's distance and $\theta$ for the
          angle, make a uniform point in the rectangle $[0,6] \times
          [0,\pi/2]$.
      - ask: >
          The centre lands $2$ centimetres from the nearest crack, with the
          toothpick at $30^{\circ}$ to the cracks. Does it cross?
        choices:
          - text: >
              Yes: its half-length $3$ is more than $2$.
            feedback: >
              That would hold if it pointed straight at the crack. At
              $30^{\circ}$ the half-length reaches only $3\sin 30^{\circ} =
              1.5$ towards the crack.
          - text: >
              No: it reaches only $1.5$ towards the crack.
            correct: true
            feedback: >
              The component of the half-length perpendicular to the cracks is
              $3 \sin\theta = 1.5$, short of $2$.
          - text: >
              It depends on where along the crack it landed.
            feedback: >
              The cracks are parallel and endless; sliding the toothpick along
              them changes nothing.
        feedback: >
          What counts is how far the half-toothpick reaches perpendicular to
          the cracks.
      - reflect: >
          Write the crossing condition as an inequality in $x$ and $\theta$,
          and describe the favourable region inside the rectangle.
        answer: >
          The toothpick crosses exactly when its half-length reaches the
          crack: $x \le 3\sin\theta$. In the rectangle $[0,6] \times
          [0,\pi/2]$ — $\theta$ across, $x$ up — that is the region under the
          sine curve $x = 3\sin\theta$, which rises from $0$ at $\theta = 0$
          to $3$ at $\theta = \pi/2$.

      - part: The area under a sine
        ask: >
          What is the area of the favourable region,
          $\int_{0}^{\pi/2} 3\sin\theta\,d\theta$?
        expects: "3"
        feedback: >
          $3[-\cos\theta]_{0}^{\pi/2} = 3(0 - (-1)) = 3$.
      - ask: >
          The rectangle has area $6 \cdot \pi/2 = 3\pi$. What is the
          probability the toothpick crosses a crack? Give four decimal places.
        expects: "0.3183"
        tolerance: 0.0005
        feedback: >
          $3/(3\pi) = 1/\pi \approx 0.3183$. The $\pi$ comes from the range of
          the angle, not from any circle.
      - ask: >
          Redo it with needle length $\ell$ and line spacing $d$, with
          $\ell \le d$. The probability of crossing is
        choices:
          - text: >
              $\ell/(\pi d)$
            feedback: >
              Check against the toothpick: $6/(12\pi) = 1/(2\pi)$, half the
              answer you just found. The favourable area is $\ell/2$, not
              $\ell/4$.
          - text: >
              $2\ell/(\pi d)$
            correct: true
            feedback: >
              Favourable area $\int_{0}^{\pi/2} (\ell/2)\sin\theta\,d\theta =
              \ell/2$, total $(d/2)(\pi/2) = \pi d/4$, ratio $2\ell/(\pi d)$.
              The toothpick: $12/(12\pi) = 1/\pi$.
          - text: >
              $\ell/d$
            feedback: >
              That would hold if the needle always lay perpendicular to the
              lines. Tilted needles reach less far, which is where the $2/\pi$
              comes from.
        feedback: >
          This is Buffon's needle: $\Pr(\text{cross}) = 2\ell/(\pi d)$, which
          is $2/\pi \approx 0.637$ when the needle is as long as the gap.

      - part: Testing the edges of the setup
        ask: >
          A colleague takes $\theta$ uniform on $[0, \pi]$ instead of
          $[0, \pi/2]$, measuring the angle all the way round. What happens to
          the answer?
        choices:
          - text: >
              It halves, since the total area doubles.
            feedback: >
              The total doubles, and so does the favourable area: $\sin\theta$
              on $[\pi/2, \pi]$ mirrors $[0, \pi/2]$. Both grow by $2$.
          - text: >
              Nothing: numerator and denominator both double.
            correct: true
            feedback: >
              $\int_{0}^{\pi} (\ell/2)\sin\theta\,d\theta = \ell$ against
              $(d/2)\pi$, still $2\ell/(\pi d)$. The acute range is a
              convenience, not a requirement.
          - text: >
              It doubles, because each angle is now counted twice.
            feedback: >
              The angle is still uniform; it just runs over a longer range.
              Favourable and total scale together.
        feedback: >
          Any symmetric range of angles works, as long as the favourable area
          and total area are taken over the same range.
      - ask: >
          A $20$-centimetre chopstick on the same $12$-centimetre boards:
          $2 \cdot 20/(12\pi) \approx 1.06$. What went wrong?
        choices:
          - text: >
              Nothing: long sticks cross with certainty, and the excess is
              rounding.
            feedback: >
              A chopstick lying along a board, parallel to the cracks, crosses
              nothing. The probability is below $1$, and $0.06$ is not
              rounding.
          - text: >
              The formula needs $\ell \le d$: for a longer stick the sine
              curve rises out of the rectangle.
            correct: true
            feedback: >
              With $\ell > d$ the curve $x = (\ell/2)\sin\theta$ climbs above
              the rectangle's top edge $x = d/2$, and integrating it counts
              area that is not there. The stick can also cross two cracks at
              once; what $2\ell/(\pi d)$ still measures is the expected
              number of crossings.
          - text: >
              The angle should be uniform on $[0, \pi]$ for a long stick.
            feedback: >
              As you just saw, the angle range never changes the answer. The
              length hypothesis is what failed.
        feedback: >
          A probability above $1$ means a hypothesis was dropped. Here it is
          $\ell \le d$.

      - part: Pi from a floor
        ask: >
          You drop the $6$-centimetre toothpick $500$ times on the
          $12$-centimetre boards and see $160$ crossings. What estimate of
          $\pi$ does that give?
        expects: "3.125"
        tolerance: 0.001
        hint: >
          Set the observed frequency equal to $2\ell/(\pi d)$ and solve for
          $\pi$.
        feedback: >
          $\hat{p} = 160/500 = 0.32$, so $\pi \approx 2\ell/(d\hat{p}) =
          12/(12 \times 0.32) = 3.125$. In an interview the answer to "how
          would you estimate $\pi$ by experiment" is this, with the
          $(x, \theta)$ rectangle and the sine curve named as where the
          formula comes from.


  - node: quant-probability.geometric.buffon-noodle
    hook: >
      "Does the needle have to be straight?" is the natural follow-up, and
      answering "no, only total length matters" with the linearity
      argument, not just the claim, is what separates memorization from
      understanding.
    explanation: >
      Approximate any rigid curve of length $\ell$ by a chain of short
      straight segments; the whole curve's crossing count is the sum of
      the segments' crossing counts. Expectation is additive over that sum
      regardless of dependence between the pieces — and here the pieces
      are about as dependent as random variables get, rigidly attached to
      one curve moving as a single random object — so the expected total
      is just the sum of each segment's expected crossings.

      Each short segment is effectively a tiny needle, whose expected
      crossing count is its own $2(\text{length})/(\pi d)$, since a short
      enough segment crosses at most once and expectation equals
      probability there. Summing those small lengths recovers the curve's
      total length $\ell$, so the expected crossing count is exactly
      $2\ell/(\pi d)$ for any shape, with no restriction $\ell \le d$ — a
      longer or curled curve can cross more than once, and the formula now
      counts crossings rather than a single crossing probability.

      The circle check pins the constant with no probability at all: a
      circle of diameter $d$ has circumference $\pi d$ and crosses every
      line placement at exactly two points, deterministically, so its
      expected count is exactly $2$ — and $2(\pi d)/(\pi d)=2$ matches on
      the nose.
    worked: >
      A small square wire loop has side $d/4$, so perimeter $\ell=d$.
      Expected crossings $=2d/(\pi d)=2/\pi\approx0.6366$ — identical to a
      straight needle of length $d$, even though the loop's actual
      crossing count on any given drop is random, $0$ or $2$, since a
      small convex loop either straddles a line or misses it entirely.
      Only the expectation, and only the length, is pinned down.
    interview: >
      "Does Buffon's formula need a straight needle" wants "no, only total
      length matters" stated with the segment-additivity argument, and the
      circle check volunteered as the sanity test.
    pitfalls: >
      Assuming the segments' crossings must be independent for expectation
      to add is backwards — additivity of expectation never needs
      independence, only additivity of the underlying quantity. Carrying
      the $\ell \le d$ restriction from the straight-needle case over to
      the noodle is unnecessary, since the noodle formula counts
      crossings, which can exceed $1$.
    recap: >
      Expected crossings for any rigid curve of length $\ell$ are
      $2\ell/(\pi d)$ regardless of shape, since expectation sums over
      tiny straight segments however dependent they are — the circle of
      diameter $d$, crossing twice always, pins the constant.
    dialogue:
      - part: A needle too long for the formula
        teach: >
          The floorboards are $12$ centimetres wide again. This time you drop a
          $24$-centimetre knitting needle, which can lie across two cracks at
          once. Let $N$ be the number of cracks it crosses.
      - ask: >
          Can Buffon's formula $2\ell/(\pi d)$ give $\Pr(N \ge 1)$ here?
        choices:
          - text: >
              Yes: $2 \cdot 24/(12\pi) \approx 1.27$.
            feedback: >
              A probability of $1.27$ is impossible. The formula assumed
              $\ell \le d$, so that the needle crosses at most once.
          - text: >
              No: the formula was derived for $\ell \le d$, and this needle is
              twice the spacing.
            correct: true
            feedback: >
              The derivation used "at most one crossing" to turn a count into a
              yes-or-no event. With $\ell = 2d$ that is gone.
          - text: >
              Yes, after capping it at $1$.
            feedback: >
              A needle lying parallel to the cracks crosses none, so
              $\Pr(N \ge 1) < 1$. Capping hides the problem rather than fixing
              it.
        feedback: >
          For a long needle the right question is not a probability but
          $\mathbb{E}[N]$, the expected number of crossings.
      - reflect: >
          Think of the knitting needle as two $12$-centimetre halves joined
          end to end. What can you say about $\mathbb{E}[N]$, and what do you
          not need to know about how the halves move together?
        answer: >
          Every crossing belongs to one half, so $N = N_1 + N_2$. Each half is
          a needle with $\ell = d$, crossing at most once, so
          $\mathbb{E}[N_i] = \Pr(N_i = 1) = 2/\pi$. Linearity gives
          $\mathbb{E}[N] = 4/\pi$, and it holds however dependent the halves
          are — they are welded together, and it does not matter.
      - ask: >
          What is $\mathbb{E}[N]$ for the knitting needle? Give four decimal
          places.
        expects: "1.2732"
        tolerance: 0.0005
        feedback: >
          $2/\pi + 2/\pi = 4/\pi \approx 1.2732$ — exactly the $1.27$ the
          formula gave. Read as an expected count, $2\ell/(\pi d)$ never needed
          $\ell \le d$.
      - ask: >
          A colleague objects: the two halves are rigidly attached, so if one
          crosses the other is more likely to as well, and adding their
          expectations is invalid. Is the objection right?
        choices:
          - text: >
              Yes: expectations add only for independent variables.
            feedback: >
              That is the rule for variances. $\mathbb{E}[N_1 + N_2] =
              \mathbb{E}[N_1] + \mathbb{E}[N_2]$ for any two variables, so
              the dependence changes the spread of $N$, never its mean.
          - text: >
              Partly: the sum is right only if the halves are at an angle.
            feedback: >
              The halves of a straight needle are perfectly aligned and as
              dependent as possible; linearity still holds.
          - text: >
              No: linearity of expectation needs no independence.
            correct: true
            feedback: >
              The halves' crossings are strongly dependent, and that affects
              how $N$ is distributed but not its average.
        feedback: >
          Linearity is the whole argument, and it is immune to dependence.
      - teach: >
          Push the cut further. Any rigid curve of length $\ell$ — bent,
          looped, coiled — is nearly a chain of tiny straight segments, each a
          short needle with expected crossings $2(\text{its length})/(\pi d)$.
          Adding them gives Buffon's noodle: the expected number of crossings
          is $2\ell/(\pi d)$ whatever the shape, with no restriction on $\ell$.

      - part: Bending and looping
        ask: >
          A $12$-centimetre wire is bent into a zigzag of three $4$-centimetre
          segments, at whatever angles you like. What is its expected number
          of crossings on the $12$-centimetre boards? Give four decimal places.
        expects: "0.6366"
        tolerance: 0.0005
        feedback: >
          Total length $12$, so $2 \cdot 12/(12\pi) = 2/\pi \approx 0.6366$ —
          the same as a straight $12$-centimetre needle. The angles never
          enter.
      - ask: >
          A circular hoop of diameter $12$ centimetres is dropped on the same
          boards. How many cracks does it cross, ignoring outcomes of
          probability $0$?
        expects: "2"
        hint: >
          The hoop is exactly as wide as a board.
        feedback: >
          Wherever its centre lands, the hoop spans exactly one board-width,
          so exactly one crack runs through its interior and cuts the circle
          in two points. $N = 2$ with probability $1$.
      - reflect: >
          Suppose you knew only that $\mathbb{E}[N] = c\,\ell$ for every rigid
          curve, with a constant $c$ that depends on $d$ but not on the shape.
          Use the hoop to find $c$.
        answer: >
          The hoop has length $\pi d$ and $N = 2$ always, so
          $c \cdot \pi d = 2$ and $c = 2/(\pi d)$. That recovers Buffon's
          formula with no integral at all: additivity says the answer is
          proportional to length, and one curve whose crossings you can count
          for certain pins the constant.

      - part: The mean is shape-free, the rest is not
        ask: >
          A straight wire of length $12\pi \approx 37.7$ centimetres has the
          same expected crossings as the hoop, $2$. Does it also cross at
          least one crack with probability $1$?
        choices:
          - text: >
              Yes: equal expectations, equal behaviour.
            feedback: >
              Expectation is one number. The straight wire lying along a board,
              parallel to the cracks, crosses none — something the hoop can
              never do.
          - text: >
              No: it can lie parallel to the cracks and cross none.
            correct: true
            feedback: >
              Its count ranges from $0$ up to $4$, averaging $2$; the hoop's is
              $2$ every time. Same mean, very different distributions.
          - text: >
              Yes, because it is longer than $3$ board widths.
            feedback: >
              Length guarantees crossings only if the orientation cooperates.
              Parallel to the cracks, any length crosses nothing.
        feedback: >
          The noodle theorem fixes the expected count and nothing else.
      - ask: >
          A small hoop of diameter $3$ centimetres is dropped on the
          $12$-centimetre boards. What is the probability it touches a crack?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          The small hoop crosses a crack either twice or not at all.
        feedback: >
          $\mathbb{E}[N] = 2 \cdot 3\pi/(12\pi) = 1/2$, and $N$ is $0$ or $2$,
          so $\Pr(N = 2) = 1/4$. Check directly: the hoop is cut when its
          centre is within $1.5$ of a crack, which is $3$ of every $12$
          centimetres, $1/4$. In an interview: "only the length matters, by
          linearity, and the circle of diameter $d$ checks the constant".


  - node: quant-probability.geometric.uniform-in-disc
    hook: >
      "Generate a uniform random point in a circle" is a live coding
      question as much as a probability one, and the standard wrong answer
      — sample the radius uniformly — is exactly what this density
      explains.
    explanation: >
      For $P$ uniform on a disc of radius $R$, apply the uniform-point
      definition directly to the sub-disc of radius $r$:
      $\Pr(D \le r) = (\text{area of radius-}r\text{ disc})/(\text{area of
      radius-}R\text{ disc}) = \pi r^{2}/\pi R^{2} = r^{2}/R^{2}$. That is
      $D=|P|$'s CDF; differentiating gives density $f(r)=2r/R^{2}$, which
      rises linearly rather than staying flat.

      The rise follows from the shape of the region alone: the
      circumference available at radius $r$ is $2\pi r$, growing linearly
      with $r$, so there is proportionally more room for a uniformly
      scattered point to land far from the center than close to it —
      density has to grow to match the growing area at each radius.

      Integrating $r$ against that density gives
      $\mathbb{E}[D]=\int_{0}^{R} r \cdot (2r/R^{2})\,dr = 2R/3$, and
      setting $r^{2}/R^{2}=1/2$ gives median $R/\sqrt{2}\approx0.707R$ —
      half the disc's probability mass sits in the outer $29\%$ of the
      radius. The angle is uniform on $[0,2\pi)$ and independent of $D$,
      by the same rotational symmetry that makes direction irrelevant to
      the disc's boundary.
    worked: >
      Take $R=6$. $\Pr(D\le3)=(3/6)^{2}=1/4$, the median is
      $6/\sqrt{2}=3\sqrt{2}\approx4.243$, and $\mathbb{E}[D]=2(6)/3=4$ —
      the average distance from center sits noticeably beyond the radius's
      midpoint, consistent with density growing outward.
    interview: >
      "Sample a uniform point in a disc" wants the inverse-CDF fix
      $r=R\sqrt{U}$ named on sight, plus the reason the naive
      $r\sim U(0,R)$ is wrong: it ignores the linearly growing density and
      crowds points near the center.
    pitfalls: >
      Sampling $r\sim U(0,R)$ directly is the standard bug, treating
      radius as if it carried the disc's uniform density when density
      actually grows as $2r/R^{2}$. Confusing the median $R/\sqrt{2}$ with
      the mean $2R/3$ — close in value but from different integrals — is
      the other common slip.
    recap: >
      Radius is not uniform on a uniform disc — density $2r/R^{2}$, mean
      $2R/3$, median $R/\sqrt{2}$ — which is why naive radius sampling
      crowds the center and the fix is $r=R\sqrt{U}$.
    dialogue:
      - part: Darts and a buggy simulation
        teach: >
          A circular target has radius $20$ centimetres. A dart lands
          uniformly on it, and $D$ is the dart's distance from the centre.
      - ask: >
          What is the probability the dart lands within $10$ centimetres of the
          centre?
        expects: "1/4"
        tolerance: 0.0005
        hint: >
          Compare the area of the inner disc with the area of the target.
        feedback: >
          $\pi \cdot 10^{2}/(\pi \cdot 20^{2}) = 100/400 = 1/4$. Half the
          radius, a quarter of the area.
      - ask: >
          A colleague simulates the dart by drawing a radius $r$ uniform on
          $[0, 20]$ and an angle uniform on $[0, 2\pi)$. In her simulation, the
          chance of landing within $10$ centimetres is $1/2$. What is going
          on?
        choices:
          - text: >
              Her simulation is right; the area argument double-counts the
              centre.
            feedback: >
              The area argument is the definition of a uniform point. Her
              simulation puts half of all darts in an inner disc that is only a
              quarter of the target, so it is the one with a preference.
          - text: >
              Her simulation crowds the darts toward the centre.
            correct: true
            feedback: >
              The inner disc gets half the darts with a quarter of the area.
              Equal radial steps cover very unequal areas: the ring from $19$
              to $20$ is $39$ times the area of the disc of radius $1$.
          - text: >
              Both are right; they answer the same question in different units.
            feedback: >
              $1/2$ and $1/4$ cannot both be the probability of one event. They
              are two different random points.
        feedback: >
          The distance from the centre of a uniform point is not uniform.
      - reflect: >
          For a uniform point in a disc of radius $R$, find $\Pr(D \le r)$,
          and say in one sentence why larger distances are more likely than
          smaller ones.
        answer: >
          The event $D \le r$ is the inner disc of radius $r$, so
          $\Pr(D \le r) = \pi r^{2}/(\pi R^{2}) = r^{2}/R^{2}$. Differentiating
          gives the density $2r/R^{2}$, which grows with $r$: there is more
          circumference, $2\pi r$, at larger radii, and a uniform point has no
          reason to prefer one bit of area over another.
      - teach: >
          That is the uniform point in a disc: $D$ has distribution function
          $r^{2}/R^{2}$ and density $2r/R^{2}$ on $[0, R]$, and the angle is
          uniform on $[0, 2\pi)$, independent of $D$. Radius is the one
          coordinate you must not draw uniformly.

      - part: Where the darts actually are
        ask: >
          What is $\mathbb{E}[D]$ on the $20$-centimetre target?
        expects: "40/3"
        tolerance: 0.005
        hint: >
          Integrate $r$ against the density $2r/R^{2}$.
        feedback: >
          $\int_{0}^{R} r \cdot 2r/R^{2}\,dr = 2R/3$, which is
          $40/3 \approx 13.33$ centimetres — past the halfway mark of $10$.
      - ask: >
          What is the median of $D$, in centimetres? Give two decimal places.
        expects: "14.14"
        tolerance: 0.005
        feedback: >
          $r^{2}/400 = 1/2$ gives $r = 20/\sqrt{2} \approx 14.14$. Half the
          darts land in the outer $5.86$ centimetres of the radius.
      - ask: >
          What fraction of the darts land in the outermost ring, between $18$
          and $20$ centimetres?
        expects: "19/100"
        tolerance: 0.0005
        feedback: >
          $1 - (18/20)^{2} = 1 - 0.81 = 0.19$. The outer tenth of the radius
          holds nearly a fifth of the darts.
      - ask: >
          How should the simulation draw $r$ to get a uniform point? Take $U$
          uniform on $[0, 1]$.
        choices:
          - text: >
              $r = 20U^{2}$
            feedback: >
              Squaring pushes values toward $0$, crowding the centre even more
              than $r = 20U$ did. The correction goes the other way.
          - text: >
              $r = 20\sqrt{U}$
            correct: true
            feedback: >
              $\Pr(20\sqrt{U} \le r) = \Pr(U \le r^{2}/400) = r^{2}/400$, the
              right distribution function. The alternative is to draw a point
              uniform in the enclosing square and reject it when it falls
              outside the disc.
          - text: >
              $r = 20U$, but with the angle drawn from $[0, \pi)$ instead.
            feedback: >
              The angle was never the problem; it is already uniform and
              independent of the distance. Only the radius is mis-drawn.
        feedback: >
          Invert the distribution function: $r = R\sqrt{U}$.

      - part: What is and is not independent
        ask: >
          For the uniform dart, which pair is independent?
        choices:
          - text: >
              The horizontal and vertical coordinates.
            feedback: >
              The disc is not a box: knowing the horizontal coordinate is
              $19$ forces the vertical one into $[-\sqrt{39}, \sqrt{39}]$.
          - text: >
              Neither pair.
            feedback: >
              The polar pair passes: a sector of angle $\alpha$ and radius $r$
              has area $\alpha r^{2}/2$, which factors into an angle part and a
              distance part.
          - text: >
              The distance $D$ and the angle.
            correct: true
            feedback: >
              The probability of a sector cut at radius $r$ is
              $(\alpha/2\pi)(r^{2}/R^{2})$, a product. Rotations do not change
              distances.
        feedback: >
          In polar coordinates the disc is a box, $[0, R] \times [0, 2\pi)$ —
          but a box with a non-uniform density in $r$.
      - ask: >
          Now a point uniform in a ball of radius $R$, in three dimensions.
          What is $\Pr(D \le R/2)$?
        expects: "1/8"
        tolerance: 0.0005
        hint: >
          Volume scales as the cube of the radius.
        feedback: >
          $(R/2)^{3}/R^{3} = 1/8$. In $d$ dimensions $\Pr(D \le r) =
          (r/R)^{d}$, so the mass rushes even harder toward the boundary. In
          an interview: "the radius has density $2r/R^{2}$, so draw
          $r = R\sqrt{U}$, not $r = RU$".


  - node: quant-probability.geometric.bertrand-paradox
    hook: >
      "Draw a chord at random — what's the probability it's longer than
      the inscribed triangle's side" is the canonical
      answer-changes-with-the-mechanism question, and refusing to answer
      without naming a mechanism is itself the correct move.
    explanation: >
      All three classical mechanisms reduce to the same area-ratio
      technique in different coordinates. Fixing one endpoint and drawing
      the other uniformly on the circle makes chord length a function of a
      single uniform angle; the long-chord event is an arc, giving $1/3$.
      Picking a uniform radius direction, then a point uniform along it,
      with the chord perpendicular there, makes length a function of a
      single uniform distance from center; the long-chord event is an
      interval, giving $1/2$. Taking the chord's midpoint uniform in the
      disc makes length a function of the midpoint's distance from center
      via the disc's area ratio $r^{2}/R^{2}$, giving $1/4$.

      The second mechanism is worth connecting to a uniform point in a
      disc directly: "a uniform radius, then a uniform point along it" is
      exactly the naive, center-crowding way to sample a disc point
      flagged there as a coding bug — except here it isn't a bug, because
      the mechanism legitimately defines "random chord" rather than
      attempting to sample a uniform disc point. The construction that
      over-samples the center for a uniform disc point is a perfectly
      valid, different experiment when the target object is a chord
      instead.

      All three answers are correct for the mechanism that produced them;
      there is no single "right" answer to "a random chord" until a
      physical procedure — a spinning arrow, a dropped straw, a dart aimed
      at the disc's interior — pins one down.
    worked: >
      What's the probability a random chord is longer than the circle's
      radius $R$ itself? Endpoint mechanism: central angle
      $\psi \sim U(0,\pi)$, chord $=2R\sin(\psi/2)$, and
      $\sin(\psi/2)>1/2$ holds for $\psi > \pi/3$, probability $2/3$.
      Radius mechanism:
      distance $x_{0}\sim U(0,R)$, condition $x_{0} < R\sqrt{3}/2$,
      probability $\sqrt{3}/2\approx0.866$. Midpoint mechanism:
      probability $(\sqrt{3}/2)^{2}=3/4$. Three mechanisms, three more
      distinct numbers — $2/3$, $\sqrt{3}/2$, $3/4$ — for the identical
      question.
    interview: >
      "What's the probability a random chord is longer than [some
      length]" should trigger "that depends on how the chord is
      generated" before any computation; naming two or three mechanisms
      with their differing answers is the strong response, silently
      picking one is the weak one.
    pitfalls: >
      Treating Bertrand's paradox as a trick with one "real" answer misses
      the point — all three are correct computations on their own sample
      space. Applying the disc's uniform-point density $r^{2}/R^{2}$ to
      the radius mechanism, which is uniform in $x_{0}$ directly rather
      than in $x_{0}^{2}$, swaps the two mechanisms' answers.
    recap: >
      The same words give $1/3$, $1/2$ or $1/4$ for the chord problem
      depending on the mechanism — endpoint, radius, or midpoint — because
      "at random" never specified a distribution by itself.
    dialogue:
      - part: A chord longer than eight
        teach: >
          A circle has radius $5$. An interviewer asks for the probability
          that a chord drawn at random is longer than $8$.
      - ask: >
          A chord whose closest point to the centre is at distance $h$ has
          length $2\sqrt{25 - h^{2}}$. The chord is longer than $8$ exactly
          when $h$ is less than what?
        expects: "3"
        feedback: >
          $2\sqrt{25 - h^{2}} > 8$ means $25 - h^{2} > 16$, so $h^{2} < 9$
          and $h < 3$. Long chords pass close to the centre.
      - ask: >
          Draw the chord this way: pick a direction from the centre, pick a
          point uniform along the radius in that direction, and draw the chord
          perpendicular to the radius there. What is the probability it is
          longer than $8$?
        expects: "3/5"
        tolerance: 0.0005
        feedback: >
          The chord's distance from the centre is the chosen point's,
          $h \sim U(0, 5)$, so $\Pr(h < 3) = 3/5$.
      - ask: >
          Another way: pick the chord's midpoint uniformly in the disc, and draw
          the chord with that midpoint. What is the probability it is longer
          than $8$?
        expects: "9/25"
        tolerance: 0.0005
        hint: >
          The midpoint's distance from the centre is $h$. How is the distance
          of a uniform point in a disc distributed?
        feedback: >
          The midpoint must land in the inner disc of radius $3$:
          $\pi \cdot 9/(\pi \cdot 25) = 9/25$.
      - ask: >
          Two careful computations, $3/5$ and $9/25$, for one question. Which
          is the mistake?
        choices:
          - text: >
              $3/5$: picking a point uniform along a radius is the classic
              sampling bug for a disc.
            feedback: >
              It is a bug when the goal is a uniform point in the disc. Here
              the goal is a chord, and "a uniform point along a random radius"
              is a perfectly good way to make one. It just is not the same way.
          - text: >
              $9/25$: a chord is a line, so its midpoint should not be drawn
              from an area.
            feedback: >
              Every chord except a diameter has a unique midpoint, so choosing
              the midpoint fixes the chord. Drawing it uniformly from the disc
              is a legitimate mechanism.
          - text: >
              Neither: they are answers to two different experiments.
            correct: true
            feedback: >
              Each is the exact probability for its own procedure. "A chord at
              random" did not say which procedure.
        feedback: >
          Both computations are right. The question was underspecified.
      - reflect: >
          Both mechanisms pick the chord through its distance $h$ from the
          centre. Explain why they disagree, using what you know about a
          uniform point in a disc.
        answer: >
          The radius mechanism makes $h$ uniform on $[0, 5]$. A uniform
          midpoint in the disc makes $h$ have density $2h/25$, piling up near
          the rim where there is more area. So the radius mechanism puts more
          chords near the centre — the long ones — and gives $3/5$ against
          $9/25$. "Uniform" was applied to two different variables.

      - part: A third mechanism
        ask: >
          Third way: fix one endpoint on the circle and take the other uniform
          on the circle. The central angle $\psi$ between them, folded into
          $[0, \pi]$, is uniform, and the chord has length
          $10\sin(\psi/2)$. What is the probability the chord is longer than
          $8$? Give four decimal places.
        expects: "0.4097"
        tolerance: 0.0005
        hint: >
          Solve $\sin(\psi/2) > 0.8$ for $\psi$ in $[0, \pi]$.
        feedback: >
          $\psi/2 > \arcsin 0.8 \approx 0.9273$, so $\psi > 1.8546$, and
          $\Pr = (\pi - 1.8546)/\pi \approx 0.4097$. Three mechanisms:
          $0.60$, $0.41$, $0.36$.
      - teach: >
          This is Bertrand's chord paradox. In its classical form the
          threshold is $R\sqrt{3}$, the side of the inscribed equilateral
          triangle, and the three mechanisms — random endpoints, random point
          on a radius, random midpoint — give $1/3$, $1/2$ and $1/4$. None is
          wrong. "At random" is not a distribution until a mechanism is named.
      - ask: >
          Check one classical value. With random endpoints on a circle of
          radius $R$, the chord beats $R\sqrt{3}$ exactly when the second
          endpoint lands in the arc of $120^{\circ}$ opposite the first. What
          is the probability?
        expects: "1/3"
        tolerance: 0.0005
        feedback: >
          $120^{\circ}$ out of $360^{\circ}$ is $1/3$. Endpoints of the
          inscribed triangle's side are $120^{\circ}$ apart, and any chord
          spanning more than that is longer.

      - part: When a procedure settles it
        ask: >
          A circle of radius $5$ is painted on a large floor, and you toss a
          long straw onto the floor from far away, keeping it only when it
          cuts the circle. Which mechanism does the toss produce?
        choices:
          - text: >
              Random endpoints: the straw meets the circle at two points.
            feedback: >
              The straw's two intersection points are a consequence, not the
              mechanism. A toss randomises the straw's position and direction,
              not where it meets the circle.
          - text: >
              Random point on a radius: the straw's distance from the centre
              is uniform.
            correct: true
            feedback: >
              A tossed line has a direction and an offset. The offset from the
              centre, among straws that cut the circle, is uniform on $[0, 5]$
              because the toss has no reason to prefer one offset to another.
              So the answer for this procedure is $3/5$.
          - text: >
              Random midpoint: the straw is equally likely to land anywhere.
            feedback: >
              The straw is equally likely to land at any offset, not with its
              midpoint on any area element of the disc. Offsets in $[0, 5]$
              are spread uniformly, which is the radius mechanism.
        feedback: >
          A physical procedure fixes the measure, and then there is one answer.
          In an interview, the strong response to "a random chord" names two
          or three mechanisms and their answers, and asks which is meant.


  - node: quant-probability.geometric.specify-the-mechanism
    hook: >
      This is the sentence that turns a probability interview from a
      guessing game into a scored conversation: say out loud which
      quantity is being treated as uniform before computing anything.
    explanation: >
      Bertrand's chord and the two-stage broken stick are the same lesson
      told twice: a continuous "at random" claim only means something once
      the variable it's uniform in is named, and reparameterizing changes
      the answer because a nonlinear change of variable destroys
      uniformity. If $X$ is uniform and $Y=g(X)$ for nonlinear $g$, $Y$'s
      density is $1/|g'(g^{-1}(y))|$, which is generally not constant — so
      "uniform in $X$" essentially never implies "uniform in $g(X)$" once
      $g$ bends.

      A small check makes this concrete: if $\theta$ is uniform on
      $[0,\pi]$, is $\cos\theta$ uniform on $[-1,1]$? No — cosine is a
      nonlinear, monotonic map, and the resulting density on $[-1,1]$
      grows near the endpoints rather than staying flat, so values of
      $\cos\theta$ near $\pm1$ are more common than values near $0$, the
      opposite of what "uniform" suggests.

      The interview move that follows is explicit: state the mechanism
      being assumed — which physical action, drop, spin or cut, generates
      which uniform coordinate — before computing, and if the prompt is
      genuinely ambiguous, say so and commit to the version being solved.
      A stated physical procedure is what fixes the measure in the first
      place, which is why Buffon's needle has exactly one answer and
      Bertrand's chord has three.
    worked: >
      With $\theta \sim U(0,\pi)$, compute $\Pr(\cos\theta>0.5)$ two ways.
      Correctly: $\cos\theta>0.5$ exactly when $\theta<\pi/3$, so
      $\Pr(\theta<\pi/3)=(\pi/3)/\pi=1/3$. Incorrectly assuming
      $\cos\theta$ is itself uniform on $[-1,1]$: the fraction of $[-1,1]$
      above $0.5$ is $0.5/2=1/4$. The two answers, $1/3$ and $1/4$, differ
      because cosine concentrates probability near $\pm1$ rather than
      spreading it evenly.
    interview: >
      When a prompt says "at random" with no further qualifier, naming the
      mechanism before computing — and flagging genuine ambiguity rather
      than silently picking one — is exactly the behavior these paradox
      questions are screening for.
    pitfalls: >
      Assuming a monotonic transformation of a uniform variable stays
      uniform is the root error behind both Bertrand and the sequential
      stick break. Silently picking a mechanism without saying so loses
      credit even when the arithmetic that follows is correct, since the
      interviewer can't tell the ambiguity was understood.
    recap: >
      Name the sampling mechanism before computing: a nonlinear
      reparameterization changes what "uniform" means, and with it the
      answer.
    dialogue:
      - part: A trip of sixty kilometres
        teach: >
          A courier drove $60$ kilometres. All you are told is that the trip
          took somewhere between $1$ and $2$ hours, every duration in that
          range equally likely.
      - ask: >
          What is the probability the trip took more than $1.5$ hours?
        expects: "1/2"
        tolerance: 0.0005
        feedback: >
          Duration uniform on $[1, 2]$, and $(2 - 1.5)/(2 - 1) = 1/2$.
      - ask: >
          A colleague describes the same trip differently: the average speed
          was between $30$ and $60$ kilometres per hour, every speed equally
          likely. By her description, what is the probability the trip took
          more than $1.5$ hours?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          A $60$-kilometre trip takes more than $1.5$ hours exactly when the
          speed is below what?
        feedback: >
          More than $1.5$ hours means a speed below $60/1.5 = 40$, and
          $\Pr(\text{speed} < 40) = (40 - 30)/(60 - 30) = 1/3$.
      - ask: >
          Both descriptions cover exactly the same set of possible trips. Which
          probability is right?
        choices:
          - text: >
              $1/2$: time is what was measured, so it is the natural variable.
            feedback: >
              Nothing in "every value equally likely" says which variable was
              meant. A speedometer reading would make speed just as natural.
          - text: >
              Each is right for its own assumption; the description never said
              which variable is uniform.
            correct: true
            feedback: >
              "Uniform in duration" and "uniform in speed" are two different
              distributions on the same set of trips, and they disagree about
              almost every event.
          - text: >
              $1/3$: speed is the cause, time the effect.
            feedback: >
              Causal language does not fix a distribution. Either variable can
              be uniform; the other then cannot be.
        feedback: >
          The set of outcomes was fixed. The distribution over it was not.
      - reflect: >
          Why can duration and speed not both be uniform? Point to what
          happens to equal stretches of time when you convert them to speeds.
        answer: >
          Speed is $60/\text{time}$, a nonlinear map. The first half-hour of
          the time range, $1$ to $1.5$ hours, becomes speeds $40$ to $60$, a
          stretch of $20$; the second half-hour, $1.5$ to $2$, becomes only
          $30$ to $40$, a stretch of $10$. Equal probability on equal time
          stretches puts unequal probability on equal speed stretches. A
          nonlinear change of variable destroys uniformity.
      - teach: >
          So in a continuous problem, "uniformly at random" says nothing until
          you name the variable it is uniform in. Linear rescalings preserve
          uniformity — hours to minutes, metres to feet — and nonlinear ones
          do not. Every paradox in this chapter is two people quietly choosing
          different variables.

      - part: Naming the variable in the paradoxes
        ask: >
          In Bertrand's random-midpoint mechanism, the chord's distance $h$
          from the centre is not uniform. Which quantity is?
        choices:
          - text: >
              $h^{2}$
            correct: true
            feedback: >
              $\Pr(h \le r) = r^{2}/R^{2}$, so $\Pr(h^{2} \le s) = s/R^{2}$: the
              square of the distance is uniform on $[0, R^{2}]$. The radius
              mechanism makes $h$ itself uniform instead.
          - text: >
              $\sqrt{h}$
            feedback: >
              Then $h$ would be a uniform squared, crowding midpoints toward
              the centre. A uniform midpoint does the opposite: it spreads by
              area, and area grows as $h^{2}$.
          - text: >
              The angle between the chord's endpoints.
            feedback: >
              That is the endpoints mechanism, which gives a third answer
              because it is uniform in yet another variable.
        feedback: >
          Three Bertrand mechanisms are uniform in three different variables —
          endpoint angle, $h$, $h^{2}$ — related nonlinearly, so three answers.
      - ask: >
          In the two-stage stick, the left piece of length $X$ is broken at a
          point uniform along it. Which variable has stopped being uniform,
          compared with two simultaneous breaks?
        choices:
          - text: >
              The first break $X$.
            feedback: >
              The first break is uniform on $[0, 1]$ in both mechanisms. The
              difference is all in the second.
          - text: >
              The total length of the stick.
            feedback: >
              The stick is always length $1$; nothing about it is random.
          - text: >
              The second break's position on the whole stick.
            correct: true
            feedback: >
              It is $X$ times a uniform, which piles up near the left end —
              uniform along the piece, not along the stick. That is why the
              answer moves from $1/4$ to $\ln 2 - 1/2$.
        feedback: >
          The words "break it at random" were the same; the variable they were
          uniform in was not.
      - ask: >
          Why does Buffon's needle have a single answer while Bertrand's chord
          has three?
        choices:
          - text: >
              Because a needle is straight and a chord is not.
            feedback: >
              A chord is straight too. Straightness has nothing to do with it.
          - text: >
              Because the needle problem describes a physical drop, which makes
              the centre's distance and the angle uniform.
            correct: true
            feedback: >
              Dropping a needle at random has an agreed meaning — no preferred
              position, no preferred direction — and that fixes the
              coordinates. "Draw a chord at random" names no procedure.
          - text: >
              Because the needle problem has only one random coordinate.
            feedback: >
              It has two, the distance and the angle. The point is that the
              procedure says which two, and that each is uniform.
        feedback: >
          A stated procedure — drop, spin, toss, cut — is what fixes the
          measure.

      - part: Saying it in the room
        ask: >
          An interviewer asks: "Pick a random number between $1$ and $100$.
          What is the chance its square root is below $5$?" You say you will
          take the number itself uniform on $[1, 100]$. What is your answer?
        expects: "8/33"
        tolerance: 0.0005
        feedback: >
          $\sqrt{x} < 5$ means $x < 25$, so $(25 - 1)/(100 - 1) = 24/99 =
          8/33 \approx 0.24$. Had the square root been uniform on $[1, 10]$,
          the answer would be $(5 - 1)/9 = 4/9$. State the variable first,
          then compute; if the question is genuinely ambiguous, say so and
          price the version you chose.


  - node: quant-probability.geometric.semicircle
    hook: >
      "What's the probability $n$ random points on a circle all fall
      within some semicircle" looks like it needs inclusion-exclusion over
      $n$ overlapping arcs — a disjointness trick collapses it to a
      one-line sum instead.
    explanation: >
      Place $n$ points independently and uniformly on a circle. For each
      point $i$, let $A_i$ be the event that all $n-1$ other points fall
      in the semicircle that starts at point $i$ and runs clockwise. Each
      other point independently has probability $1/2$ of landing in that
      specific semicircle, so $\Pr(A_i)=(1/2)^{n-1}$.

      The load-bearing step is that the $A_i$ are pairwise disjoint. If
      some semicircle does cover all $n$ points, its clockwise-most point
      is uniquely determined — call it the anchor — and only the event
      $A_i$ for that specific anchor can hold, since starting the
      semicircle at any other point either excludes the anchor itself or
      fails to be the clockwise-most valid choice. So "all points lie in
      some semicircle" is exactly the disjoint union of the $n$ events
      $A_i$.

      Disjoint events add:
      $\Pr(\text{all in one semicircle}) = \sum \Pr(A_i) = n \cdot
      (1/2)^{n-1} = n/2^{n-1}$. Coincident points have probability $0$, so
      the anchor is well defined with probability $1$, and the sum never
      has to worry about ties.
    worked: >
      For $n=5$ points, $\Pr(\text{all in one semicircle}) = 5/2^{4} =
      5/16 = 0.3125$ — already below the $n=3$ value of $3/4$, showing how
      fast the probability collapses as more points compete to land on
      the same side.
    interview: >
      "$n$ points dropped uniformly on a circle — probability they all fit
      in a semicircle" wants $n/2^{n-1}$ stated directly, with the
      anchor/disjointness argument as the one-line justification, rather
      than an attempted inclusion-exclusion over $n$ overlapping arcs.
    pitfalls: >
      Attempting inclusion-exclusion over the $n$ semicircle events,
      instead of noticing they're already disjoint, wastes time and
      invites an arithmetic error. Using $(1/2)^{n}$ instead of
      $(1/2)^{n-1}$ forgets that only the other $n-1$ points, not the
      anchor itself, need to be checked.
    recap: >
      $n$ uniform points on a circle all lie in one semicircle with
      probability $n/2^{n-1}$, found by summing $n$ disjoint "anchor"
      events rather than any inclusion-exclusion.
    dialogue:
      - part: Three cars on a circular track
        teach: >
          Three cars, A, B and C, are parked at independent, uniformly random
          points around a circular racetrack. You want the probability that
          all three sit within some half of the track.
      - ask: >
          Start with something smaller. What is the probability that B and C
          both lie in the half of the track running clockwise from A?
        expects: "1/4"
        tolerance: 0.0005
        feedback: >
          That half is fixed once A is placed, and B and C each land in it
          with probability $1/2$, independently: $(1/2)^{2} = 1/4$.
      - ask: >
          Is $1/4$ the answer to the full question?
        choices:
          - text: >
              Yes: if all three fit in a half, you can start the half at A.
            feedback: >
              Only if A is the first car of the bunch going clockwise. If B
              comes first, say B, then A, then C close together, the covering
              half starts at B, and the half clockwise from A may miss B.
          - text: >
              No: it is $1/4 + 1/4 = 1/2$, counting the half clockwise from A
              and the half anticlockwise from A.
            feedback: >
              Those two halves miss the case where A sits in the middle of the
              bunch, with B just behind it and C just ahead. All three fit in
              a half, and neither half starting at A holds both.
          - text: >
              No: the covering half could start at any of the three cars.
            correct: true
            feedback: >
              $1/4$ counts only the arrangements where A leads. B or C could
              lead just as well.
        feedback: >
          The event "all in some half" is bigger than "all in the half
          starting at A".
      - reflect: >
          When all three cars fit in some half, one of them is the natural
          place to start that half. Which one, and why does that mean the
          events "the half clockwise from A covers the others", the same from
          B, and the same from C can never happen together?
        answer: >
          Start at the car that comes first going clockwise through the bunch —
          the anchor. The half clockwise from the anchor covers the other two.
          The half clockwise from any other car misses the anchor, which lies
          more than half a lap clockwise from it. So exactly one car is an
          anchor, the three events are disjoint, and their probabilities
          add.
      - ask: >
          So what is the probability all three cars fit within some half of the
          track?
        expects: "3/4"
        tolerance: 0.0005
        feedback: >
          Three disjoint events, each with probability $1/4$: $3/4$. Ties
          between cars have probability $0$, so the anchor is always well
          defined.
      - teach: >
          For $n$ points uniform on a circle, let $A_i$ be the event that the
          other $n - 1$ points lie in the semicircle running clockwise from
          point $i$. Each $A_i$ has probability $(1/2)^{n-1}$, they are
          disjoint because a covering semicircle has a unique anchor, and their
          union is "all in some semicircle". So the probability is
          $n/2^{n-1}$.

      - part: More cars
        ask: >
          What does $n/2^{n-1}$ give for $n = 2$?
        expects: "1"
        feedback: >
          $2/2 = 1$. Two points always fit in a semicircle — draw the diameter
          just past one of them — so the formula passes its first sanity check.
      - ask: >
          Six cars on the track. What is the probability they all fit within
          some half?
        expects: "3/16"
        tolerance: 0.0005
        feedback: >
          $6/2^{5} = 6/32 = 3/16 \approx 0.19$. Each car's event is
          $(1/2)^{5}$, and six disjoint anchors.
      - ask: >
          A colleague writes $n \cdot (1/2)^{n}$ for $n$ cars. Where did the
          extra factor of $1/2$ come from?
        choices:
          - text: >
              From also requiring the anchor to land in its own half.
            correct: true
            feedback: >
              The anchor is at the start of the semicircle by construction; it
              is never at risk. Only the other $n - 1$ cars must land in the
              half, so the power is $n - 1$. Her formula gives $1/2$ at
              $n = 2$, failing the sanity check.
          - text: >
              From choosing a direction, clockwise or anticlockwise.
            feedback: >
              The events were defined with one direction, clockwise, and the
              anchor argument needs only one. Fixing the direction cost no
              factor.
          - text: >
              It is right, and $n/2^{n-1}$ double-counts.
            feedback: >
              $n/2^{n-1}$ gives $1$ for two points, which is right. The
              $n/2^{n}$ version gives $1/2$, which is not.
        feedback: >
          Power $n - 1$: the anchor is free, the rest must cooperate.
      - ask: >
          What is the smallest number of cars for which the probability of all
          fitting in some half drops below $1/20$?
        expects: "9"
        hint: >
          Compute $n/2^{n-1}$ for $n = 8$ and $n = 9$.
        feedback: >
          $n = 8$ gives $8/128 = 1/16 = 0.0625$, still above $0.05$;
          $n = 9$ gives $9/256 \approx 0.035$. So $9$. The denominator doubles
          with each car while the numerator creeps up by one.

      - part: Where the argument breaks
        ask: >
          Replace "half of the track" by "two thirds of the track". Does
          $n \cdot (2/3)^{n-1}$ give the probability that all $n$ cars fit
          within some two-thirds arc?
        choices:
          - text: >
              Yes: the anchor argument never used the size of the arc.
            feedback: >
              It did. Try $n = 3$: $3 \cdot (2/3)^{2} = 4/3$, more than $1$.
              Something is being counted more than once.
          - text: >
              No: with an arc longer than half, several cars can each be the
              start of a covering arc, so the events overlap.
            correct: true
            feedback: >
              Space three cars with gaps of $130^{\circ}$, $130^{\circ}$ and
              $100^{\circ}$: a $240^{\circ}$ arc starting at either car that
              follows a $130^{\circ}$ gap covers all three. Disjointness needed
              the arc to be at most half the circle, so that the anchor is
              unique.
          - text: >
              No, but only because the events are no longer independent.
            feedback: >
              Independence was never used to add the $A_i$; disjointness was.
              The events overlap now, and disjoint addition overcounts.
        feedback: >
          The load-bearing step is the unique anchor. In an interview: "$n$
          disjoint events, one per possible anchor, each $(1/2)^{n-1}$; so
          $n/2^{n-1}$".


  - node: quant-probability.geometric.triangle-contains-centre
    hook: >
      "Does a random inscribed triangle contain the circle's center"
      sounds like a fresh geometry problem, but it is the semicircle
      result read backward through its complement — recognizing that is
      the entire solution.
    explanation: >
      Three points uniform on a circle form a triangle, and that triangle
      contains the center exactly when the three points do not all lie in
      a common semicircle. If all three bunch into some semicircle,
      everything sits to one side of the diameter bounding it, so the
      center — on the empty side — falls outside the triangle; if no
      semicircle contains all three, every direction from the center has a
      point beyond it, forcing the triangle to wrap around and enclose it.

      That equivalence turns the question into the complement of the
      $n=3$ semicircle probability already found:
      $\Pr(\text{contains center}) = 1-3/2^{2}=1-3/4=1/4$. No new area
      computation is needed, only the link between "surrounds the center"
      and "doesn't fit in a semicircle."

      The same complement argument scales to $n$ points: the convex hull
      of $n$ uniform points on the circle contains the center with
      probability $1-n/2^{n-1}$, already about $0.98$ by $n=10$ — a random
      polygon almost certainly surrounds the center once it has enough
      vertices. The analogous question for points scattered inside the
      disc, rather than on its boundary, is substantially harder — four
      uniform points in a disc are in convex position with probability
      $1-35/(12\pi^{2})\approx0.7045$, Sylvester's four-point problem —
      and is worth knowing exists rather than re-deriving.
    worked: >
      For $n=5$ points uniform on a circle,
      $\Pr(\text{convex hull contains center}) = 1-5/2^{4}=1-5/16=11/16=
      0.6875$ — already well above $1/2$ with just five points, against
      the exact $1/4$ for a triangle.
    interview: >
      "Does a random inscribed polygon contain the center" should
      immediately connect to the semicircle result via its complement;
      stating "$1$ minus the semicircle probability" cold is the tell that
      the two questions are seen as one.
    pitfalls: >
      Computing $\Pr(\text{contains center})$ via a fresh area integral,
      instead of recognizing it as the semicircle complement, redoes work
      that's already done. Reporting $n/2^{n-1}$ itself as the containment
      probability, rather than $1$ minus it, flips the answer.
    recap: >
      A random inscribed triangle contains the center with probability
      $1/4$, the semicircle probability's complement; the general
      $n$-point version is $1-n/2^{n-1}$.
    dialogue:
      - part: Three beacons around a lake
        teach: >
          Three beacons are placed at independent, uniformly random points on
          the shore of a circular lake. A buoy floats at the lake's centre.
          You want the probability that the triangle of beacons encloses the
          buoy.
      - ask: >
          Measure positions as angles around the shore. Which set of beacons
          makes a triangle that encloses the buoy?
        choices:
          - text: >
              $0^{\circ}$, $100^{\circ}$, $170^{\circ}$
            feedback: >
              All three lie between $0^{\circ}$ and $170^{\circ}$, on one side
              of the diameter through $0^{\circ}$ and $180^{\circ}$. The whole
              triangle sits on that side and the centre, on the diameter, is
              left outside.
          - text: >
              $0^{\circ}$, $100^{\circ}$, $200^{\circ}$
            correct: true
            feedback: >
              The gaps around the shore are $100^{\circ}$, $100^{\circ}$ and
              $160^{\circ}$, none as large as $180^{\circ}$. No diameter has
              all three beacons on one side, and the triangle wraps around the
              centre.
          - text: >
              $20^{\circ}$, $60^{\circ}$, $190^{\circ}$
            feedback: >
              The gap from $190^{\circ}$ round to $20^{\circ}$ is
              $190^{\circ}$, more than half a lap, so the three fit in the
              half from $20^{\circ}$ to $200^{\circ}$. The centre is outside.
        feedback: >
          Only one of the three triangles has no gap of half a lap or more
          between consecutive beacons.
      - reflect: >
          State the condition you were checking in terms of semicircles, and
          say why it decides whether the centre is inside.
        answer: >
          The triangle contains the centre exactly when the three points do not
          all lie in a semicircle. If they do, the diameter bounding that
          semicircle has the whole triangle on one side, so the centre is not
          inside. If they do not, every line through the centre has beacons on
          both sides, so the triangle cannot avoid the centre.
      - teach: >
          So "the triangle contains the centre" is the complement of "the three
          points lie in some semicircle" — the boundary case, two points
          exactly opposite, has probability $0$. The semicircle count already
          prices the complement.
      - ask: >
          What is the probability the triangle of beacons encloses the buoy?
        expects: "1/4"
        tolerance: 0.0005
        feedback: >
          The three beacons lie in some semicircle with probability
          $3/2^{2} = 3/4$, so the triangle encloses the centre with probability
          $1 - 3/4 = 1/4$. Most random inscribed triangles are lopsided.
      - ask: >
          What is the probability the triangle has a right angle?
        choices:
          - text: >
              $1/4$, since a right triangle is the boundary between containing
              the centre and not.
            feedback: >
              The boundary is a single event — two beacons exactly opposite
              each other — and an exact coincidence of continuous positions has
              probability $0$.
          - text: >
              $0$: it needs two beacons exactly opposite, a single angle out of
              a continuum.
            correct: true
            feedback: >
              An inscribed triangle has a right angle only when one side is a
              diameter. That is a set of angle configurations with zero area,
              so the boundary case never needs separate handling.
          - text: >
              $3/4$, the probability of lying in a semicircle.
            feedback: >
              Lying in a semicircle makes the triangle obtuse, not right. The
              right-angled case sits exactly on the edge, with probability $0$.
        feedback: >
          Inscribed triangles: acute exactly when they contain the centre,
          obtuse when they do not, right with probability $0$. So a random
          inscribed triangle is acute with probability $1/4$.

      - part: More beacons
        ask: >
          With four beacons, what is the probability their quadrilateral
          encloses the buoy?
        expects: "1/2"
        tolerance: 0.0005
        feedback: >
          The four lie in a semicircle with probability $4/2^{3} = 1/2$, so
          the convex hull contains the centre with probability $1 - 1/2 = 1/2$.
      - ask: >
          And with six beacons?
        expects: "13/16"
        tolerance: 0.0005
        feedback: >
          $1 - 6/2^{5} = 1 - 3/16 = 13/16 \approx 0.81$. The general corollary
          is $1 - n/2^{n-1}$, already about $0.98$ at $n = 10$.
      - ask: >
          A colleague reports $3/4$ for the three-beacon triangle. What is the
          likeliest slip?
        choices:
          - text: >
              She used $(1/2)^{n}$ instead of $(1/2)^{n-1}$.
            feedback: >
              That slip gives $3/8$ for the semicircle and $5/8$ for the
              triangle. Her $3/4$ is a different error.
          - text: >
              She computed the triangle's area instead of a probability.
            feedback: >
              No area appears anywhere in the argument; only the semicircle
              count. The number $3/4$ is that count itself.
          - text: >
              She reported the semicircle probability itself instead of its
              complement.
            correct: true
            feedback: >
              $3/4$ is the chance the beacons fit in a semicircle, which is
              when the triangle misses the centre. Containing it is the other
              $1/4$.
        feedback: >
          Say which event the count prices before you subtract: fitting in a
          semicircle is the bad case.

      - part: Inside the lake instead of on the shore
        ask: >
          Now three buoys are scattered uniformly over the whole lake, not on
          the shore. What is the probability their triangle encloses the
          centre?
        choices:
          - text: >
              Smaller than $1/4$, since points near the centre make thin
              triangles.
            feedback: >
              Whether the centre is enclosed depends only on the directions of
              the three points from the centre, not on their distances. Pulling
              a point toward the centre along its ray never changes which side
              of a line through the centre it lies on.
          - text: >
              Still $1/4$: only the directions from the centre matter, and they
              are uniform and independent.
            correct: true
            feedback: >
              By rotational symmetry each buoy's direction is uniform on the
              circle, independently of the others, and the semicircle test uses
              directions alone. Same $1/4$.
          - text: >
              It cannot be computed by these methods; it is a hard open-ended
              problem.
            feedback: >
              The harder neighbour is a different question — whether four
              points in a disc form a convex quadrilateral, Sylvester's
              four-point problem, with answer $1 - 35/(12\pi^{2}) \approx
              0.7045$. Containing the centre needs only directions.
        feedback: >
          Containment of the centre is a statement about directions, so any
          distribution symmetric under rotation gives $1/4$. In an interview:
          "contains the centre means not in a semicircle, so $1 - 3/4 = 1/4$".
