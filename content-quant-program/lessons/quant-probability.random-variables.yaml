unit: quant-probability.random-variables
opening: >
  A random variable turns an experiment into a number, and everything you can
  ask about it is captured by one function: the CDF. This unit builds the
  toolkit for working with that function directly — classifying a law as
  discrete, continuous or mixed, reading off the pmf or pdf, inverting the CDF
  into quantiles and spotting symmetry for a free median, and turning an event
  into an indicator variable whose algebra converts counting into arithmetic.
  The second half is about transformations: solve $Y=g(X)$ by the CDF method
  when $g$ has no structure, specialise to a clean change-of-variables formula
  when $g$ is monotone, handle the affine case explicitly, and meet the
  probability integral transform tying every continuous law back to the
  uniform. It closes with the machinery for extremes — the min, the max, and
  the $k$-th smallest of $n$ independent draws — leaving expectation itself
  for the next unit.
lessons:
  - node: quant-probability.random-variables.rv
    hook: >
      Every interview question opens with an experiment described in words,
      and the first move — silently, before any formula — is deciding what
      number $X$ tracks; skip it and you'll compute the right arithmetic for
      the wrong quantity.
    explanation: >
      A random variable is not a random number in your hand — it is the rule
      that reads an outcome of the experiment and reports a number. The
      subtlety in the definition, that $\{X \le t\}$ must be an event for
      every $t$, is really the minimal requirement for $\Pr(X \le t)$ to make
      sense at all; in every interview setting, with a finite or countable
      $\Omega$, this holds automatically and is never the obstacle.

      The payoff of separating $X$ from $\Omega$ is that once the law — the
      map $B \mapsto \Pr(X \in B)$ — is pinned down, the underlying experiment
      can be forgotten entirely. Two variables built from completely
      different mechanisms are, for every probability question you'll ever
      ask, the same object the moment their laws agree. This is why later
      results are always stated in terms of the law of $X$, never in terms of
      how $\Omega$ was built.

      The practical habit: when a problem hands you a description, write down
      explicitly what $X$ measures and over what experiment, before reaching
      for a formula. A vague "let $X$ be the outcome" invites the exact
      modelling errors the sample-space discipline was built to prevent.
    worked: >
      Experiment A: flip a fair coin and let $X=1$ if heads, $0$ if tails.
      Experiment B: draw one card from a standard deck and let $Y=1$ if the
      card is red, $0$ if black. These live on totally different sample
      spaces — one has $2$ outcomes, the other $52$ — yet both give
      $\Pr(X=1)=\Pr(Y=1)=1/2$ and $\Pr(X=0)=\Pr(Y=0)=1/2$: the same law. Any
      probability question about $X$ has the identical numerical answer for
      $Y$, even though no outcome of the coin flip literally equals any card.
    interview: >
      Interviewers rarely ask "define a random variable" outright; they watch
      whether you name the experiment and the numeric rule together when
      restating their prompt — "let $X$ be the number of heads in three
      flips" said out loud before any counting starts is the signal they're
      listening for.
    pitfalls: >
      Treating $X$ as if it were the outcome itself (a card, a die face)
      rather than the number attached to it collapses the function/value
      distinction the rest of the subject depends on. Skipping past what $X$
      actually measures and jumping straight to a formula is the fastest way
      to answer a different question than the one asked.
    recap: >
      A random variable is the numeric readout of an outcome, and once its
      law is fixed the experiment that produced it is irrelevant.
    dialogue:
      - part: A bet on two tosses
        teach: >
          You toss a fair coin twice. You win $3$ dollars for every head and
          lose $2$ dollars for every tail, and $X$ is your net result. Before
          anything else, write down the four ways the tosses can fall and
          what $X$ is on each.
      - ask: >
          What is the probability that you finish ahead, $\Pr(X > 0)$?
        expects: "3/4"
        hint: >
          $HH$ pays $6$, $TT$ pays $-4$. Work out the two mixed outcomes.
        feedback: >
          $HH$ gives $6$, $HT$ and $TH$ each give $3 - 2 = 1$, and $TT$ gives
          $-4$. Three of the four equally likely outcomes leave you ahead, so
          $\Pr(X > 0) = 3/4$.
      - ask: >
          A colleague says: "$X$ takes three values, $6$, $1$ and $-4$, so
          $\Pr(X = 1) = 1/3$." What is wrong?
        choices:
          - text: >
              Nothing: the three values are equally likely by symmetry.
            feedback: >
              The values are not the outcomes. $X = 6$ needs both tosses
              heads, a quarter of the time; $X = 1$ happens on $HT$ and on
              $TH$, half the time. Equal probabilities belong to the four
              tosses, not to the three numbers.
          - text: >
              $\Pr(X = 1)$ is $1/4$, because $HT$ is a single outcome.
            feedback: >
              $HT$ is one outcome, but $TH$ also pays $1$. Counting only one
              of them misses half the event.
          - text: >
              $X = 1$ on two of the four equally likely outcomes, so
              $\Pr(X = 1) = 1/2$.
            correct: true
            feedback: >
              Right. Several outcomes can share one value, and the probability
              of the value is the total over all of them.
        feedback: >
          The fairness lives on the tosses. The number $X$ only inherits
          probabilities from them, by collecting every outcome that produces
          the same value.
      - reflect: >
          You found $\Pr(X > 0)$ and $\Pr(X = 1)$ without ever assigning a
          probability to a number directly. What were you actually computing
          the probability of, and what kind of object does that make $X$?
        hint: >
          Look at what you counted each time.
        answer: >
          Each time you collected the outcomes $\omega$ for which $X(\omega)$
          satisfied the condition, and took the probability of that set:
          $\{X > 0\} = \{HH, HT, TH\}$. So $X$ is not itself random in any
          mysterious way; it is a rule that reads an outcome and reports a
          number, and every statement about $X$ is a statement about a subset
          of $\Omega$.

      - part: The rule, and the events it carves out
        teach: >
          That rule is a random variable: a function $X : \Omega \to
          \mathbb{R}$, with $\{X \le t\}$ standing for $\{\omega : X(\omega) \le t\}$.
          The definition asks that this set be an event for every real $t$,
          which on a finite $\Omega$ is automatic. The assignment
          $B \mapsto \Pr(X \in B)$ is the law of $X$ — for the bet, mass $1/4$
          at $6$, $1/2$ at $1$, $1/4$ at $-4$.
      - ask: >
          Which set is $\{X \le 0\}$?
        choices:
          - text: >
              $\{HT, TH, TT\}$
            feedback: >
              $HT$ and $TH$ pay $1$, which is not at most $0$. This is
              $\{X \le 1\}$.
          - text: >
              The number $-4$
            feedback: >
              $-4$ is the value $X$ takes there. The event is the set of
              outcomes producing values at most $0$ — a subset of $\Omega$,
              not a number.
          - text: >
              $\{TT\}$
            correct: true
            feedback: >
              Only $TT$ produces a value at most $0$, so the event is
              $\{TT\}$ and its probability is $1/4$.
          - text: >
              $\emptyset$, since $0$ is not a value of $X$
            feedback: >
              $t$ need not be a value of $X$. The question is which outcomes
              give $X(\omega) \le 0$, and $TT$, giving $-4$, does.
        feedback: >
          $\{X \le t\}$ is defined for every real $t$, whether or not $X$ ever
          equals $t$; it changes only as $t$ crosses $-4$, $1$ and $6$.
      - ask: >
          What is $\Pr(-4 < X \le 1)$?
        expects: "1/2"
        hint: >
          Which outcomes give a value strictly above $-4$ and at most $1$?
        feedback: >
          The event is $\{HT, TH\}$: $TT$ is excluded by the strict
          inequality and $HH$ by the upper bound. Its probability is
          $2/4 = 1/2$.

      - part: A different experiment with the same law
        ask: >
          An urn holds four balls marked $6$, $1$, $1$ and $-4$. You draw one
          at random and $Y$ is its mark. What is $\Pr(Y = 1)$?
        expects: "1/2"
        hint: >
          Two of the four balls carry the mark $1$.
        feedback: >
          $2/4 = 1/2$ — the same as $\Pr(X = 1)$ for the bet.
      - ask: >
          How do $X$ (the coin bet) and $Y$ (the urn) compare?
        choices:
          - text: >
              They are the same random variable.
            feedback: >
              They are functions on different sample spaces — four toss
              sequences and four balls. No outcome of the coin is a ball, so
              they cannot be the same function.
          - text: >
              They cannot be compared, because they live on different
              sample spaces.
            feedback: >
              Their laws can be compared, and agree: mass $1/4$ at $6$, $1/2$
              at $1$, $1/4$ at $-4$. The underlying spaces never enter a
              question like $\Pr(Y > 0)$.
          - text: >
              Different variables with the same law, so every probability
              question has the same answer for both.
            correct: true
            feedback: >
              Right. Once the law is written down, the experiment behind it
              can be forgotten.
        feedback: >
          This is the payoff of the definition: problems are solved on the
          law, and any experiment producing that law will do — a coin, an
          urn, or a simulation.

      - part: Rules that fail to be random variables
        ask: >
          Back on the two tosses. Which proposed rule is not a random
          variable?
        choices:
          - text: >
              $V = 7$ on every outcome.
            feedback: >
              A constant is a perfectly good function into $\mathbb{R}$. It
              is a dull random variable, not a non-example.
          - text: >
              $W = 1/N$, where $N$ is the number of heads.
            correct: true
            feedback: >
              On $TT$, $N = 0$ and $W$ has no value. A random variable must
              attach a real number to every outcome, and this one leaves one
              outcome blank.
          - text: >
              $R = 1$ if the two tosses differ and $0$ otherwise.
            feedback: >
              $R$ is $1$ on $HT$ and $TH$ and $0$ on $HH$ and $TT$ — a number
              for every outcome, so a random variable.
        feedback: >
          The test is simple: does the rule produce one real number for each
          outcome? The other common failure is a rule whose output is not a
          number at all, such as "$X$ is the card drawn".
      - teach: >
          In an interview, say the function out loud before counting: "let
          $X$ be my net winnings over the two tosses, which is $6$, $1$, $1$
          or $-4$." It shows you know which outcomes collapse onto the same
          value, which is exactly where the colleague's $1/3$ went wrong.

  - node: quant-probability.random-variables.cdf
    hook: >
      Nearly every "at most / at least / between" probability question is
      answered by $F$ or $1-F$ directly — knowing which of the four defining
      properties is in play, on sight, is a baseline fluency check.
    explanation: >
      $F$ inherits monotonicity straight from monotonicity of $\Pr$:
      $\{X\le s\}\subseteq\{X\le t\}$ whenever $s\le t$, so $F(s)\le F(t)$.
      Right-continuity and the two limits are the same continuity-of-
      probability idea applied to shrinking or growing sequences of events —
      nothing new is invoked beyond what probability already guarantees.

      The more useful fact for computation is the jump identity:
      $F(t)-F(t^{-})$ is exactly $\Pr(X=t)$, because the interval
      $(t-1/n, t]$ shrinks down to the single point $\{t\}$ as $n\to\infty$.
      So reading $F$'s graph tells you everything — a flat stretch means
      those values are never taken, a jump means a point has positive mass,
      and a smooth climb means no single value stands out.

      Switching to $S(t)=1-F(t)$ is not just notation: for "how long until"
      and other tail questions, $S$ is the quantity that composes cleanly (it
      is what gets multiplied together for independent minima, met later in
      this unit), while $F$ is the natural one for "at most" questions.
    worked: >
      Flip a fair coin three times and let $X$ count the heads, so
      $\Pr(X=0)=1/8$, $\Pr(X=1)=3/8$, $\Pr(X=2)=3/8$, $\Pr(X=3)=1/8$. Then
      $F(1.5)=\Pr(X\le 1.5)=\Pr(X\le 1)=1/8+3/8=1/2$. Approaching $t=1$ from
      below, $F(1^{-})=\Pr(X<1)=\Pr(X=0)=1/8$, so the jump at $t=1$ is
      $F(1)-F(1^{-})=1/2-1/8=3/8$, matching $\Pr(X=1)$ exactly.
    interview: >
      A common ask is "sketch the CDF of [some described variable]" — the
      grader checks that jumps land at the right places with the right
      heights and the curve is flat everywhere else, not a smooth guess. A
      sharper follow-up: "why must $F$ be right-continuous" tests whether you
      can reproduce the shrinking-interval argument.
    pitfalls: >
      Computing a point probability as $F(t)-F(t-1)$ instead of the correct
      left-hand limit $F(t)-F(t^{-})$ silently uses the wrong gap whenever
      values aren't spaced by exactly $1$. Assuming $F$ is continuous by
      default, rather than checking for jumps first, misreads any variable
      with atoms.
    recap: >
      $F(t)=\Pr(X\le t)$ is monotone, right-continuous, and its jump at $t$
      equals $\Pr(X=t)$ — the one description that answers every probability
      question about $X$.
    dialogue:
      - part: A trade with three outcomes
        teach: >
          A trade closes with profit $X$, in thousands: $-1$ with probability
          $0.2$, $0.5$ with probability $0.5$, and $2$ with probability $0.3$.
          You want one function of a real number $t$ that can answer every
          question about it, so you start with $\Pr(X \le t)$.
      - ask: >
          What is $\Pr(X \le 1)$?
        expects: "0.7"
        hint: >
          Which of the three values are at most $1$?
        feedback: >
          The values $-1$ and $0.5$ are at most $1$, so
          $\Pr(X \le 1) = 0.2 + 0.5 = 0.7$.
      - ask: >
          Let $t$ run over every real number, from far below $-1$ to far
          above $2$. How many different values does $\Pr(X \le t)$ take?
        expects: "4"
        hint: >
          The answer changes only when $t$ passes one of the three values.
        feedback: >
          It is $0$ for $t < -1$, $0.2$ on $[-1, 0.5)$, $0.7$ on $[0.5, 2)$
          and $1$ from $2$ on: four values, a staircase with three steps.
      - reflect: >
          Someone hands you only that staircase, not the list of values and
          probabilities. How would you read off $\Pr(X = 0.5)$ from it, and
          what would it tell you about $\Pr(X = 1)$?
        hint: >
          What happens to the staircase as $t$ crosses $0.5$, and as it
          crosses $1$?
        answer: >
          Look at the step: just below $0.5$ the function is $0.2$, at $0.5$
          it is $0.7$, so the probability sitting exactly at $0.5$ is the
          jump, $0.7 - 0.2 = 0.5$. At $1$ the staircase is flat, so
          $\Pr(X = 1) = 0$. The height of each jump is the probability
          concentrated at that point, and flat stretches carry none.

      - part: The function that knows everything
        teach: >
          The function is the cumulative distribution function,
          $F(t) = \Pr(X \le t)$ for every real $t$. It never decreases, it
          runs from $0$ at $-\infty$ to $1$ at $+\infty$, and it is
          right-continuous. Intervals open on the left read straight off it,
          $\Pr(a < X \le b) = F(b) - F(a)$, and the jump at $t$,
          $F(t) - F(t^{-})$, is the atom $\Pr(X = t)$, where $F(t^{-})$ is the
          limit from the left.
      - ask: >
          Using only $F$, what is $\Pr(0 < X \le 2)$?
        expects: "0.8"
        hint: >
          $F(2) - F(0)$.
        feedback: >
          $F(2) - F(0) = 1 - 0.2 = 0.8$, which is the mass at $0.5$ and at
          $2$, as it should be.
      - ask: >
          At the jump $t = 0.5$ itself, which value does $F$ take?
        choices:
          - text: >
              $0.2$, the level just before the jump.
            feedback: >
              $F(0.5) = \Pr(X \le 0.5)$ includes the outcome $X = 0.5$, so
              the mass at $0.5$ is already counted. $0.2$ is $F(0.5^{-})$,
              the limit from the left.
          - text: >
              $0.45$, halfway up the step.
            feedback: >
              $F(0.5)$ is a probability, and no event has probability
              $0.45$ here: the possible sums of $0.2$, $0.5$ and $0.3$ are
              the only candidates.
          - text: >
              $0.7$, the level just after the jump.
            correct: true
            feedback: >
              Right: the closed dot sits at the top of each step. That is
              right-continuity, and it comes straight from the $\le$ in the
              definition.
        feedback: >
          Because $F$ uses $\le$, each jump is already complete at its own
          point. As $t$ decreases to $0.5$ the events $\{X \le t\}$ shrink to
          $\{X \le 0.5\}$, so $F(t) \to F(0.5)$ from the right.

      - part: Where the endpoints start to matter
        ask: >
          What is $\Pr(X \ge 0.5)$, in terms of $F$?
        choices:
          - text: >
              $1 - F(0.5) = 0.3$
            feedback: >
              $1 - F(0.5)$ is $\Pr(X > 0.5)$, which excludes the atom at
              $0.5$. With an atom there, $>$ and $\ge$ differ by $0.5$.
          - text: >
              $1 - F(0.5^{-}) = 0.8$
            correct: true
            feedback: >
              Right. $\{X \ge 0.5\}$ is the complement of $\{X < 0.5\}$, whose
              probability is the left limit $F(0.5^{-}) = 0.2$.
          - text: >
              $F(2) - F(0.5) = 0.3$
            feedback: >
              That is $\Pr(0.5 < X \le 2)$: open at $0.5$, so the atom there
              is again left out.
        feedback: >
          At a jump, strict and weak inequalities give different answers,
          and the difference is exactly the atom. Away from jumps they agree.
      - ask: >
          What is $\Pr(X > 0.5)$, the survival function $S(t) = 1 - F(t)$ at
          $t = 0.5$?
        expects: "0.3"
        feedback: >
          $S(0.5) = 1 - F(0.5) = 1 - 0.7 = 0.3$: only the value $2$ lies
          strictly above $0.5$. The survival function is the same
          information read from the right, and it is the natural handle for
          tail questions.
      - ask: >
          A colleague draws the staircase with each closed dot at the bottom
          of its jump, so his function gives $0.2$ at $t = 0.5$. What has he
          actually drawn?
        choices:
          - text: >
              $\Pr(X < t)$
            correct: true
            feedback: >
              Right. His function is left-continuous and misses the atom at
              each jump point. Every interval formula built from it shifts
              which endpoints are included.
          - text: >
              The same CDF; the dot placement is cosmetic.
            feedback: >
              The dot is a value of the function. His says
              $\Pr(X \le 0.5) = 0.2$, which is false: $X = 0.5$ has
              probability $0.5$ and lies in that event.
          - text: >
              $\Pr(X \ge t)$
            feedback: >
              That function decreases from $1$ to $0$. His still climbs from
              $0$ to $1$; it just counts each atom one instant late.
        feedback: >
          The convention is not decoration: $F(t) = \Pr(X \le t)$ includes
          the point, and the closed dot goes on top. In an interview sketch
          the grader checks jump locations, jump heights, flat stretches,
          and which end of each jump is filled.

  - node: quant-probability.random-variables.equality-in-distribution
    hook: >
      $X\sim Y$ is the single most misused symbol in the subject — reached
      for correctly it transfers an entire computation for free, reached for
      inside a sum or a difference it silently asserts something false.
    explanation: >
      Same distribution means $F_X=F_Y$, so every question of the form
      "$\Pr(X\in B)$" has the same answer as "$\Pr(Y\in B)$" — but that is a
      statement about two separate one-dimensional questions, never about how
      $X$ and $Y$ sit together. Two variables can satisfy $X\sim Y$ while
      being built to disagree at every single outcome, and the definition
      doesn't even require them to share a sample space.

      The forward use is powerful: if you can exhibit a relabelling of the
      experiment — a symmetry — that carries $X$ to $Y$ while preserving
      probabilities, then any distributional fact already known about one
      instantly applies to the other, with zero new computation. This is the
      engine behind every symmetry argument in the unit.

      The trap is applying $X\sim Y$ as though it licensed substituting $Y$
      for $X$ inside an expression involving both, such as a sum or a
      difference. Those quantities depend on the joint law, which equality in
      distribution says nothing about — two variables can share a law and yet
      have a sum that behaves nothing like twice that law.
    worked: >
      Let $X$ take the values $-1$ and $1$ each with probability $1/2$, and
      set $Y=-X$. Since $X$ is symmetric about $0$, $Y$ has the same two
      values with the same probabilities, so $X\sim Y$. But $X+Y=0$ always —
      $\Pr(X+Y=0)=1$ — while $2X$ takes the values $-2$ and $2$ each with
      probability $1/2$, so $\Pr(2X=0)=0$. Treating $X\sim Y$ as license to
      replace $Y$ by "another copy of $X$" inside the sum gives the wrong
      answer entirely — the two are not interchangeable inside an expression.
    interview: >
      A typical probe is "if $X$ and $Y$ have the same distribution, is
      $\operatorname{Var}(X+Y)$ the same as $\operatorname{Var}(2X)$" — the
      expected answer is no, not without a joint assumption like independence
      or $X=Y$, and producing a quick counterexample on the spot is what
      separates memorised from understood.
    pitfalls: >
      Substituting $Y$ for $X$ inside a sum, difference, or product because
      $X\sim Y$ ignores that those operations depend on the joint law, not
      the marginal one. Assuming equal distribution forces $X=Y$ pointwise
      conflates a very weak relation with a very strong one.
    recap: >
      Equal distribution means every marginal probability question about $X$
      and $Y$ agrees, and nothing about how the two move together — powerful
      used forwards through a symmetry, wrong used inside a sum.
    dialogue:
      - part: Three cards, two positions
        teach: >
          An ace, a king and a queen are shuffled and dealt face down into
          positions $1$, $2$, $3$, all six orders equally likely. $X$ is the
          position of the ace and $Y$ the position of the king.
      - ask: >
          What is $\Pr(Y \le 2)$?
        expects: "2/3"
        hint: >
          The king is equally likely to sit in each of the three positions.
        feedback: >
          The king lands in each position in two of the six orders, so
          $\Pr(Y \le 2) = 4/6 = 2/3$ — exactly the same as $\Pr(X \le 2)$,
          and for the same reason.
      - ask: >
          What is $\Pr(X = Y)$?
        expects: "0"
        hint: >
          Can two cards occupy one position?
        feedback: >
          Never: the ace and the king always sit in different positions, so
          $\Pr(X = Y) = 0$. Yet every question about $X$ alone has the same
          answer as the same question about $Y$ alone.

      - part: What the two positions share
        reflect: >
          $X$ and $Y$ disagree on every single deal, and still no question of
          the form "what is the probability that this one variable lands in
          that set" can tell them apart. What exactly do they have in common,
          and what does that common thing fail to record?
        hint: >
          Think about the staircase $\Pr(X \le t)$ for each.
        answer: >
          They have the same CDF: each is uniform on $\{1, 2, 3\}$, so
          $\Pr(X \in B) = \Pr(Y \in B)$ for every set $B$. What the CDF does
          not record is how the two move together — that they are never
          equal, that one being $1$ rules out the other being $1$. Sharing a
          law is a statement about each variable separately.
      - teach: >
          This is equality in distribution, written $X \sim Y$: $F_X = F_Y$
          everywhere, equivalently $\Pr(X \in B) = \Pr(Y \in B)$ for every
          set $B$. It does not need $X = Y$ anywhere, and the two need not
          even live on the same experiment. It is a statement about each
          variable alone and says nothing about their joint behaviour.
      - ask: >
          What is $\Pr(X + Y = 3)$ for the shuffled cards?
        expects: "1/3"
        hint: >
          The sum is $3$ only when the ace and the king take positions $1$
          and $2$ in some order.
        feedback: >
          The ace and king fill positions $1$ and $2$ (in either order) with
          the queen in $3$: two of the six orders, so $1/3$.
      - ask: >
          A candidate argues: "$Y \sim X$, so $X + Y$ behaves like $2X$, and
          $\Pr(2X = 3) = 0$." Another says: "replace $Y$ by an independent
          copy of $X$; that gives $2/9$." What is wrong?
        choices:
          - text: >
              The first is right; $1/3$ must be a counting error.
            feedback: >
              The count is two orders out of six, AKQ and KAQ, each giving
              $1 + 2 = 3$. $2X$ is always even, which is exactly why replacing
              $Y$ by $X$ fails: it assumes $X = Y$, which never happens here.
          - text: >
              The second is right, since a copy has the same law as $Y$.
            feedback: >
              An independent copy has the right law and the wrong joint
              behaviour. Independence would allow both cards in position
              $1$, which the deal forbids.
          - text: >
              Both replace $Y$ by something with the same law but a different
              relationship to $X$, and a sum depends on that relationship.
            correct: true
            feedback: >
              Right. $X \sim Y$ licenses swapping $Y$ for $X$ only in a
              question about $Y$ alone.
        feedback: >
          Three candidates for $Y$ — $Y$ itself, $X$, an independent copy —
          share one law and give three answers for $\Pr(X + Y = 3)$: $1/3$,
          $0$ and $2/9$. A sum reads the joint law, which $\sim$ never fixes.

      - part: Using a symmetry forwards
        teach: >
          Alice and Bob each toss four fair coins; $A$ and $B$ count their
          heads. You are told $\Pr(A = B) = 70/256$ and asked for
          $\Pr(A > B)$.
      - ask: >
          Why must $\Pr(A > B)$ equal $\Pr(B > A)$?
        choices:
          - text: >
              Because $A$ and $B$ always take the same value.
            feedback: >
              They usually differ — that is why the question is non-trivial.
              They are equal only with probability $70/256$.
          - text: >
              Because swapping the two players' tosses is a relabelling that
              preserves every probability and turns $A > B$ into $B > A$.
            correct: true
            feedback: >
              Right. Under that relabelling the pair $(A, B)$ has the same
              law as $(B, A)$, so any event and its mirror image have equal
              probability.
          - text: >
              Because $A \sim B$ on its own.
            feedback: >
              $A \sim B$ is about each count alone, and $\{A > B\}$ involves
              both. You need the pair $(A, B)$ to have the same law as
              $(B, A)$, which comes from the swap.
        feedback: >
          Equality in distribution transfers answers when you exhibit a
          probability-preserving relabelling of the whole experiment — here
          of the pair, not just of one coordinate.
      - ask: >
          What is $\Pr(A > B)$?
        expects: "93/256"
        hint: >
          The three events $A > B$, $A = B$, $A < B$ cover everything, and
          two of them have equal probability.
        feedback: >
          $2\Pr(A > B) + 70/256 = 1$, so
          $\Pr(A > B) = (256 - 70)/512 = 186/512 = 93/256$. No sum over sixteen
          pairs of counts was needed.

      - part: When the swap stops being free
        ask: >
          Now Bob's coins land heads with probability $0.6$. Does
          $\Pr(A > B) = (1 - \Pr(A = B))/2$ still hold?
        choices:
          - text: >
              Yes: the argument only used that the events cover everything.
            feedback: >
              It also used $\Pr(A > B) = \Pr(B > A)$, which came from the
              swap preserving probabilities. That is the step that breaks.
          - text: >
              No: swapping the players no longer preserves probabilities,
              because Bob's count now leans higher.
            correct: true
            feedback: >
              Right. $(A, B)$ no longer has the law of $(B, A)$, and Bob is
              more likely to be ahead than Alice.
          - text: >
              Yes, provided $A$ and $B$ are independent.
            feedback: >
              They are independent here, and it does not help. Independence
              is not symmetry: the two counts have different laws.
        feedback: >
          The symmetry move always has the same shape: name the relabelling,
          check it preserves probabilities, then transfer. In an interview,
          saying "by symmetry between the two players" is only credible
          once the two players are genuinely identical.

  - node: quant-probability.random-variables.discrete-vs-continuous
    hook: >
      The actual question buried in "classify this variable" is whether you
      sum or integrate to get a probability — misreading the CDF's shape here
      derails every calculation downstream.
    explanation: >
      Three shapes of $F$, three regimes. A step function means all the
      probability mass sits on countably many points — read $F$'s graph for
      the flat-then-jump pattern and you've found the discrete case without
      ever writing a pmf. A continuous $F$ means no single value carries
      positive probability, and in every interview case that continuity comes
      packaged with a density, so $F$ is an integral. A mix of both — some
      flat-then-jump segments alongside genuinely smooth climbing — is what
      any real-world payoff with a floor, cap, or knockout produces, since
      those mechanisms force a whole range of underlying outcomes onto one
      boundary value while leaving the interior untouched.

      The diagnostic habit is mechanical: before doing any arithmetic, ask
      whether the described random quantity can get stuck at a specific
      boundary value with positive probability. If yes, there's an atom and
      the law is at least partly discrete; wherever the quantity moves freely
      through a continuum with no such sticking point, that stretch is
      continuous. Most interview "distributions" that aren't a named
      textbook law are mixed for exactly this reason.
    worked: >
      A machine fails instantly with probability $0.3$; otherwise its failure
      time is uniform on $(0,5)$ years. Then $F(0)=0.3$ (the atom at $t=0$)
      and for $0<t\le 5$, $F(t)=0.3+0.7\cdot(t/5)$, climbing smoothly from
      $0.3$ to $1$. At $t=2$: $F(2)=0.3+0.7(2/5)=0.3+0.28=0.58$. The CDF has a
      jump of size $0.3$ at $0$ plus a smooth climb after — neither purely
      discrete nor purely continuous.
    interview: >
      Phrased as "is this random variable discrete, continuous, or neither"
      for a described payoff — the interviewer listens for you to check
      whether any single value can occur with positive probability before
      defaulting to "continuous" just because a range of numbers is involved.
    pitfalls: >
      Assuming any variable taking a continuum of values must be purely
      continuous ignores that caps, floors, and instant-failure scenarios
      routinely inject an atom into an otherwise continuous quantity. Trying
      to write a pmf for the continuous stretch of a mixed law, or a pdf for
      its atom, applies the wrong tool to each piece.
    recap: >
      Read the shape of $F$ — flat-then-jump is discrete, a smooth climb is
      continuous, and both together is the mixed case any capped or floored
      payoff produces.
    dialogue:
      - part: Three numbers from one bus stop
        teach: >
          Buses leave a stop every $10$ minutes and you arrive at a uniformly
          random moment, so your wait $W$ is uniform on $(0, 10)$. Two more
          numbers come from the same arrival: $N$, the number of buses that
          leave in the next $25$ minutes, and $T$, the time you actually stand
          there if you give up after $6$ minutes and take a cab.
      - ask: >
          What is $\Pr(N = 3)$?
        expects: "1/2"
        hint: >
          The buses leave at $W$, $W + 10$, $W + 20$, $W + 30$. When does the
          third one make it inside $25$ minutes?
        feedback: >
          The third bus leaves at $W + 20$, inside the window exactly when
          $W \le 5$; the fourth, at $W + 30$, never does. So $N$ is $3$ with
          probability $5/10 = 1/2$ and $2$ otherwise.
      - ask: >
          What is $\Pr(W = 5)$, the chance you wait exactly five minutes?
        expects: "0"
        hint: >
          Bound it by $\Pr(5 - h < W \le 5)$ and let $h$ shrink.
        feedback: >
          $\Pr(5 - h < W \le 5) = h/10$ for every small $h$, and that tends
          to $0$. No single value of $W$ carries any probability.
      - ask: >
          What is $\Pr(T = 6)$, the chance you stand there exactly six
          minutes?
        expects: "0.4"
        hint: >
          You stand exactly $6$ minutes whenever the bus has not come by
          then.
        feedback: >
          $T = 6$ whenever $W \ge 6$, which has probability $4/10 = 0.4$.
          One value of $T$ holds a lump of probability, even though $T$ also
          ranges over a whole interval.

      - part: What the three staircases look like
        reflect: >
          Sketch $\Pr(\cdot \le t)$ for $N$, for $W$ and for $T$. What
          feature of each picture did your last three answers read off, and
          what tells the three pictures apart?
        hint: >
          A point with positive probability shows up in the CDF as a jump.
        answer: >
          $N$'s CDF is a staircase: flat, then a jump of $1/2$ at $2$ and
          another at $3$, and all the probability sits on those two points.
          $W$'s climbs in a straight line from $0$ to $1$ with no jump
          anywhere, which is why $\Pr(W = 5) = 0$. $T$'s climbs at slope
          $1/10$ up to $0.6$ and then jumps by $0.4$ at $6$. Jumps are atoms;
          smooth climbing is probability spread thinly over an interval.
      - teach: >
          That is the classification. $X$ is discrete when $F$ is a step
          function whose jumps sit on a countable set and carry total
          probability $1$; continuous when $F$ is continuous, so every single
          value has probability $0$; mixed when $F$ both jumps and climbs.
          In practice a continuous $F$ is the integral of a density — the
          exceptions are curiosities that never reach an interview.
      - ask: >
          What is $\Pr(T \le 3)$?
        expects: "0.3"
        hint: >
          Below the cap, $T$ is just $W$.
        feedback: >
          For $t < 6$, $T \le t$ exactly when $W \le t$, so
          $\Pr(T \le 3) = 3/10 = 0.3$. The continuous stretch of a mixed law
          behaves like the underlying uniform; only the cap is special.

      - part: Classifying new variables
        ask: >
          $R$ is your wait $W$ rounded down to whole minutes. What kind of
          variable is $R$?
        choices:
          - text: >
              Continuous, because it is built from the continuous $W$.
            feedback: >
              Building from $W$ does not inherit continuity. $R$ takes only
              the values $0, 1, \dots, 9$, each with probability $1/10$, so
              its CDF is a staircase.
          - text: >
              Discrete.
            correct: true
            feedback: >
              Right: ten jumps of $1/10$, flat in between, total mass $1$ on
              the jump points.
          - text: >
              Mixed, because $W$ is continuous and rounding adds jumps.
            feedback: >
              A mixed law needs some smooth climbing left over. Rounding
              collapses every interval $[k, k+1)$ onto a single point, so no
              climbing survives.
        feedback: >
          The classification belongs to the CDF of the variable itself, not
          to whatever it was computed from.
      - ask: >
          $V$ is your wait measured in seconds, $V = 60W$. What kind of
          variable is $V$?
        choices:
          - text: >
              Continuous.
            correct: true
            feedback: >
              Right. $\Pr(V = v) = \Pr(W = v/60) = 0$ for every $v$, and the
              CDF climbs linearly from $0$ to $1$ over $(0, 600)$.
          - text: >
              Discrete, because seconds are counted in whole numbers.
            feedback: >
              Nothing here rounds. $V$ can be $37.25$ seconds; a change of
              units cannot create an atom.
          - text: >
              Mixed, because its CDF rises at a different rate from $W$'s.
            feedback: >
              A different slope is still a smooth climb. Mixed means a jump
              somewhere, and $V$ has none.
        feedback: >
          Rescaling a continuous variable leaves it continuous; only maps
          that pile an interval onto one point create atoms.
      - ask: >
          A colleague says $T$ must be continuous because it can take any
          value between $0$ and $6$. Which single fact refutes him?
        choices:
          - text: >
              $T$ never exceeds $6$.
            feedback: >
              A bounded range is compatible with continuity — $W$ itself is
              bounded by $10$.
          - text: >
              $T$ equals $W$ more than half the time.
            feedback: >
              True — $T = W$ with probability $0.6$ — but that supports him,
              if anything. It is the other $0.4$, all landing on one point,
              that decides the question.
          - text: >
              $\Pr(T = 6) = 0.4 > 0$.
            correct: true
            feedback: >
              Right. A continuous variable gives every single value
              probability $0$, and one positive atom is enough to break that.
        feedback: >
          Taking a continuum of values does not make a variable continuous.
          Before calling a payoff continuous, ask whether any one value can
          occur with positive probability — caps, floors and give-up rules
          are where those atoms come from.

  - node: quant-probability.random-variables.pmf
    hook: >
      Before any probability of a discrete variable can be computed, its pmf
      has to be written down explicitly — and checking a candidate table is
      legitimate is how you reverse-engineer an unknown weight under time
      pressure.
    explanation: >
      The pmf is nothing more than $F$'s jump heights, read one point at a
      time: $p(x)=F(x)-F(x^{-})$. Equivalently, and usually more directly in
      an interview, you build $p$ straight from the story — list every value
      the variable can take and assign each the probability of that outcome —
      without ever going through $F$ first.

      The two defining conditions, $p(x)\ge 0$ and $\sum_x p(x)=1$, are the
      entire legitimacy check, and running them in reverse is a standard
      move: if a story specifies probabilities only up to an unknown constant
      or a missing weight, normalisation alone pins it down.

      Once $p$ is written, every other probability about the variable is a
      sum over $p$: $\Pr(X\in B)=\sum_{x\in B}p(x)$. This is the discrete
      analogue of what integrating a density will do for continuous
      variables, and it's why a fully specified pmf answers every question
      about a discrete law in one line of arithmetic.
    worked: >
      A bag holds six balls numbered $1,2,2,3,3,3$; draw one uniformly. Let
      $X$ be the number drawn, so $p(1)=1/6$, $p(2)=2/6=1/3$, $p(3)=3/6=1/2$,
      and indeed $1/6+1/3+1/2=1$. The probability the draw is at least $2$ is
      $\Pr(X\ge 2)=p(2)+p(3)=1/3+1/2=5/6$.
    interview: >
      "Here's a description of a random process — write down its pmf" is the
      entry point to nearly every discrete probability question; the
      interviewer checks that you list values and weights cleanly and, if a
      parameter is unspecified, that you reach for normalisation to pin it
      down.
    pitfalls: >
      Forgetting to check a hand-built pmf actually sums to $1$ before using
      it lets an earlier arithmetic slip propagate silently through every
      later computation. Assigning probability to a value the variable
      literally cannot take (or omitting one it can) is the other common
      setup error.
    recap: >
      The pmf is the list of point probabilities — $F$'s jump heights read
      one at a time — and any nonnegative list summing to $1$ is a legitimate
      one.
    dialogue:
      - part: A model that only gives proportions
        teach: >
          A desk model for the number of orders $X$ that hit a quote in one
          minute says only this: $X$ is $0$, $1$, $2$ or $3$, and
          $\Pr(X = k)$ is proportional to $4 - k$.
      - ask: >
          What is $\Pr(X \ge 2)$?
        expects: "3/10"
        hint: >
          The weights $4, 3, 2, 1$ are proportions, not probabilities. What
          must they be divided by?
        feedback: >
          The weights sum to $10$, so $\Pr(X = k) = (4 - k)/10$: $0.4$, $0.3$,
          $0.2$, $0.1$. Then $\Pr(X \ge 2) = 0.2 + 0.1 = 3/10$.
      - ask: >
          Three other desks propose lists for $\Pr(X = 0), \dots, \Pr(X = 3)$.
          Which one can actually describe a random variable?
        choices:
          - text: >
              $0.4, 0.3, 0.2, 0.2$
            feedback: >
              These sum to $1.1$. Then $\Pr(X \in \{0,1,2,3\})$ would exceed
              $1$, though $X$ certainly lands in that set.
          - text: >
              $0.6, 0.5, 0.1, -0.2$
            feedback: >
              They sum to $1$, but $\Pr(X = 3) = -0.2$ is not a probability,
              and $\Pr(X \in \{0, 1\}) = 1.1$ would follow.
          - text: >
              $0.25, 0.25, 0.5, 0$
            correct: true
            feedback: >
              Right. A zero entry is allowed — it just says $3$ never happens.
              Every entry is nonnegative and the total is $1$.
        feedback: >
          Normalising is how the first model became usable; the other two
          lists fail checks that normalising alone would not catch.
      - reflect: >
          State the checks you ran on those lists, and say why each one is
          forced — what would go wrong in $\Pr(X \in B)$ if a list passed
          one and failed the other?
        answer: >
          Each entry must be at least $0$, and the entries must sum to $1$.
          The probability of any set of values is the sum of the entries in
          it, so a negative entry makes some set's probability negative or
          above $1$, and a total other than $1$ gives the certain event
          $\{X \in S\}$ a probability other than $1$. Those two conditions
          are all a list of point probabilities needs.

      - part: The list, named
        teach: >
          For a discrete $X$ with values in a countable set $S$, the list
          $p(x) = \Pr(X = x)$ is its probability mass function. It satisfies
          $p \ge 0$ and $\sum_{x \in S} p(x) = 1$, and it carries the whole
          law: $\Pr(X \in B) = \sum_{x \in B} p(x)$. The CDF is the staircase
          $F(t) = \sum_{x \le t} p(x)$, and going back, $p(x) = F(x) - F(x^{-})$
          is the jump at $x$.
      - ask: >
          For the order model, $p(k) = (4 - k)/10$, what is $F(1.5)$?
        expects: "0.7"
        hint: >
          Which values are at most $1.5$?
        feedback: >
          $F(1.5) = p(0) + p(1) = 0.4 + 0.3 = 0.7$. Between values the
          staircase is flat, so $F(1.5) = F(1)$.
      - ask: >
          Another variable's CDF is $0$ below $1$, jumps to $0.25$ at $1$,
          to $0.6$ at $2$, and to $1$ at $5$, flat in between. What is
          $p(2)$?
        expects: "0.35"
        hint: >
          The pmf at a point is the height of the jump there.
        feedback: >
          $p(2) = F(2) - F(2^{-}) = 0.6 - 0.25 = 0.35$. Reading $F(2) = 0.6$
          as the answer would count the mass at $1$ as well.

      - part: Countably many values, and none at all
        ask: >
          $Y$ takes the values $1, 2, 3, \dots$ with $p(k) = 2/3^{k}$. These
          sum to $1$. What is the probability that $Y$ is even?
        expects: "1/4"
        hint: >
          Sum $p(2) + p(4) + p(6) + \dots$ as a geometric series.
        feedback: >
          $\sum_{j \ge 1} 2/9^{j} = (2/9)/(1 - 1/9) = (2/9)(9/8) = 1/4$. A
          countable list works exactly like a finite one; the sums are series.
      - ask: >
          For a wait $W$ uniform on $(0, 10)$, a colleague writes
          $p(x) = 1/10$ for every $x$ in $(0, 10)$. What is wrong?
        choices:
          - text: >
              Nothing; the uniform weight is $1/10$.
            feedback: >
              $1/10$ is a rate per minute, not $\Pr(W = x)$. Summed over the
              uncountably many points of $(0, 10)$ it would be infinite, not
              $1$.
          - text: >
              The constant should be $1/11$, counting both endpoints.
            feedback: >
              Endpoints are not the issue; there is no finite or countable
              list of values to divide among.
          - text: >
              $W$ has no atoms: $\Pr(W = x) = 0$ for every $x$, and those
              zeros sum to $0$, not $1$.
            correct: true
            feedback: >
              Right. A pmf only exists when the probability sits on countably
              many points, and $W$ spreads it thinly over an interval.
        feedback: >
          The pmf is the tool for staircase CDFs. A continuous variable needs
          a different description, and a mixed one needs a pmf for its
          jumps and something else for its climb. In an interview, "list the
          values, list the weights, check they sum to one" is the sentence
          that opens every discrete problem.

  - node: quant-probability.random-variables.pdf
    hook: >
      The moment a problem describes a continuous quantity, the fastest path
      in is usually writing down $f$ and integrating — but that only works
      once you've confirmed $f$ is legitimate, and interviewers love asking
      for the missing normalising constant first.
    explanation: >
      A density turns probability into area: $\Pr(a\le X\le b)$ is the area
      under $f$ between $a$ and $b$, which is why $f\ge 0$ and total area $1$
      are the only two conditions a candidate density must satisfy — exactly
      analogous to the pmf's conditions, with sum replaced by integral.
      Differentiating the resulting $F$ recovers $f$ wherever $f$ is
      continuous, so integrate to get $F$ and differentiate to get $f$ are
      inverse operations on this class of variables.

      Because $\Pr(X=x)=0$ for a continuous variable, the inequality can be
      strict or weak at either endpoint with no effect on the answer — a fact
      worth using to simplify notation rather than tracking endpoint cases
      that don't matter.

      When a story specifies a density up to an unknown constant —
      "$f(x)=cx$ on some interval" — the normalisation condition
      $\int f = 1$ is the equation that solves for $c$, exactly the
      continuous analogue of pinning down a missing pmf weight.
    worked: >
      Find $c$ so that $f(x)=cx$ on $(0,4)$, $0$ elsewhere, is a valid
      density. Normalisation gives $\int_0^4 cx\,dx = c\cdot 16/2 = 8c = 1$,
      so $c=1/8$. Then $\Pr(1<X<3)=\int_1^3 (x/8)\,dx =
      \left[x^{2}/16\right]_1^3 = (9-1)/16 = 1/2$.
    interview: >
      The canonical ask is "for what constant is this a valid density"
      followed immediately by "now find $\Pr(a<X<b)$" — the interviewer
      watches whether normalisation and area-under-the-curve are both
      automatic, one right after the other, without prompting.
    pitfalls: >
      Integrating over the wrong support — missing part of a piecewise
      density, or including a region where $f$ is actually $0$ — under- or
      overstates the normalising constant. Assuming $F'(t)=f(t)$ holds
      everywhere, rather than only where $f$ is continuous, misses that
      kinked densities need care at the kink.
    recap: >
      A density turns probability into area under $f$: normalise so the
      total area is $1$, and $f$ is the derivative of $F$ wherever that
      derivative exists.
    dialogue:
      - part: A failure time with no atoms
        teach: >
          A server's time to failure $X$, in hours, has CDF $F(t) = t^{2}/9$
          for $0 \le t \le 3$, with $F = 0$ below $0$ and $F = 1$ above $3$.
          The CDF climbs without jumping.
      - ask: >
          What is $\Pr(1 < X \le 2)$?
        expects: "1/3"
        hint: >
          $F(b) - F(a)$.
        feedback: >
          $F(2) - F(1) = 4/9 - 1/9 = 3/9 = 1/3$.
      - ask: >
          What is $\Pr(X = 2)$?
        expects: "0"
        hint: >
          Is there a jump in $F$ at $2$?
        feedback: >
          $F$ is continuous at $2$, so the atom $F(2) - F(2^{-})$ is $0$.
          Every single value has probability $0$, which leaves the question
          of how to say where $X$ tends to fall.
      - ask: >
          Take a short window instead. What is $\Pr(2 < X \le 2.1)$, to four
          decimal places?
        expects: "0.0456"
        tolerance: 0.0005
        hint: >
          $(2.1^{2} - 2^{2})/9$.
        feedback: >
          $(4.41 - 4)/9 = 0.41/9 \approx 0.0456$. The same width near $0.5$
          gives only $(0.36 - 0.25)/9 \approx 0.0122$: windows near $2$ catch
          almost four times as much.
      - ask: >
          Divide by the width and shrink it: what does
          $\Pr(2 < X \le 2 + h)/h$ approach as $h \to 0$?
        expects: "4/9"
        tolerance: 0.0005
        hint: >
          That limit is a derivative of $F$.
        feedback: >
          $(F(2 + h) - F(2))/h \to F'(2) = 2 \cdot 2/9 = 4/9$. It is
          probability per hour near $2$, a rate rather than a probability.

      - part: Probability per unit length
        reflect: >
          Suppose you knew only that rate at every point, the function
          $x \mapsto F'(x) = 2x/9$ on $(0, 3)$, and not $F$. How would you
          get $\Pr(1 < X \le 2)$ back from it, and what two properties must
          any such rate function have?
        hint: >
          You got the rate by differentiating. Undo it.
        answer: >
          Integrate it: $\int_1^2 2x/9\,dx = (4 - 1)/9 = 1/3$, the same
          answer as before. Probabilities are areas under the rate, so the
          rate can never be negative (some area would be negative) and its
          total area must be $1$ (the certain event). Nothing caps the rate
          itself.
      - teach: >
          That rate is the probability density function. $X$ has density $f$
          when $\Pr(a \le X \le b) = \int_a^b f(x)\,dx$ for all $a \le b$,
          with $f \ge 0$ and total integral $1$. Then
          $F(t) = \int_{-\infty}^{t} f(x)\,dx$ and $F' = f$ wherever $f$ is
          continuous. Single points carry no probability, so $<$ and $\le$
          give the same answers.
      - ask: >
          A new variable $Y$ has $f(y) = c\,y^{2}$ on $(0, 2)$ and $0$
          elsewhere. What must $c$ be?
        expects: "3/8"
        hint: >
          The total area under $f$ is $1$.
        feedback: >
          $\int_0^2 c\,y^{2}\,dy = c \cdot 8/3 = 1$, so $c = 3/8$.
      - ask: >
          What is $\Pr(Y \ge 1)$?
        expects: "7/8"
        hint: >
          $F(y) = y^{3}/8$ on $(0, 2)$.
        feedback: >
          $\Pr(Y \ge 1) = 1 - \int_0^1 (3/8)y^{2}\,dy = 1 - 1/8 = 7/8$. With
          a density, $\ge$ and $>$ agree, so this is also $\Pr(Y > 1)$.

      - part: A density above one
        ask: >
          $f(1.9) = (3/8)(3.61) \approx 1.35$. What does that say?
        choices:
          - text: >
              $c$ is wrong: no probability can exceed $1$.
            feedback: >
              $f(1.9)$ is not a probability. The total area is exactly $1$,
              as you checked; a tall density over a short stretch is fine.
          - text: >
              $\Pr(Y = 1.9) \approx 1.35$, so the model is broken.
            feedback: >
              $\Pr(Y = 1.9) = 0$, as for every point. The density converts
              into probability only after multiplying by a width.
          - text: >
              Near $1.9$, $Y$ falls in a short window of width $h$ with
              probability about $1.35h$.
            correct: true
            feedback: >
              Right. A window of width $0.01$ there catches about $0.0135$.
              The density is per unit length, so it may exceed $1$.
        feedback: >
          Areas under $f$ are probabilities; values of $f$ are rates. The
          uniform law on $(0, 1/4)$ has density $4$ everywhere on its
          support, and nothing is wrong with it.
      - ask: >
          A colleague differentiates the server's $F$ and reports the density
          as $2x/9$ for every real $x$. What has he got wrong?
        choices:
          - text: >
              Nothing; $F' = 2x/9$.
            feedback: >
              Only on $(0, 3)$. Outside, $F$ is constant, so the density is
              $0$; his version is negative below $0$ and has infinite area.
          - text: >
              The support: $f(x) = 2x/9$ on $(0, 3)$ and $0$ elsewhere.
            correct: true
            feedback: >
              Right. A density is a formula plus the set where it holds, and
              most normalising errors come from integrating over the wrong
              set.
          - text: >
              The constant: it should be $2x/3$.
            feedback: >
              $\int_0^3 2x/3\,dx = 3$, not $1$. The constant $2/9$ is right;
              the range is what is missing.
        feedback: >
          In an interview the pair of questions "what constant makes this a
          density" and "now find this probability" comes as one; state the
          support first and both go through without a slip.

  - node: quant-probability.random-variables.density-not-probability
    hook: >
      Seeing $f(x)=3$ and concluding "that's impossible, probabilities can't
      exceed $1$" is a reflex that costs points immediately — a density and a
      probability are different kinds of quantity.
    explanation: >
      A density has units: probability per unit of $x$, not probability
      itself. Rescale the axis — measure the same quantity in cents instead
      of dollars — and every value of $f$ divides by $100$ even though
      nothing about the underlying randomness changed; only the total area
      under the curve, and ratios between two heights of the curve, are
      invariant. A bounded-looking density with values above $1$ is
      completely ordinary whenever the variable is concentrated on a short
      interval.

      Separately, $\Pr(X=x)=0$ for every single $x$ under a continuous law,
      and yet some value of $X$ occurs — probability zero is a statement
      about measure, not about possibility. "The closing price is exactly
      $100.00$" genuinely has probability $0$ while "within a cent of $100$"
      does not, and both facts are simultaneously true.

      A third consequence, worth flagging even without working it:
      conditioning on a probability-zero event can't use the ordinary ratio
      definition of conditional probability, since that ratio would divide by
      $0$ — it needs a limiting argument instead, developed once conditioning
      is covered properly.
    worked: >
      Let $X$ be a price change measured in dollars, uniform on $(0,0.1)$, so
      $f(x)=10$ throughout — already above $1$. Measuring the same quantity
      in cents, $Y=100X$ is uniform on $(0,10)$ with density $g(y)=1/10$.
      Despite the very different-looking heights, $\Pr(0.02<X<0.08)=10\times
      0.06=0.6$ exactly equals $\Pr(2<Y<8)=(1/10)\times 6=0.6$ — the
      probability is invariant even though the density values used to
      compute it are not.
    interview: >
      A quick probe is "I've computed a density of $4$ at some point — did I
      make an error" — the correct answer is that nothing is wrong yet, since
      only area needs checking, not any single height; a sharper follow-up
      asks you to name a specific event with probability exactly $0$ that
      could still happen.
    pitfalls: >
      Rejecting a computed density purely because a value exceeds $1$ throws
      out correct work. Reading "probability zero" as "cannot happen" leads
      to contradictions the moment a continuous variable is involved, since
      every one of its possible values individually has probability $0$.
    recap: >
      A density's numeric size depends on the units of $x$ and carries no cap
      at $1$; only area is invariant, and probability zero never means
      impossible for a continuous variable.
    dialogue:
      - part: Two desks, one return
        teach: >
          Desk A models tomorrow's return $R$ on a stock, in percent, with
          density $f(x) = (2 - \lvert x \rvert)/4$ on $(-2, 2)$, a triangle
          peaking at $f(0) = 1/2$. Desk B models exactly the same return but
          records it as a decimal, so a $1$ percent move is $0.01$.
      - ask: >
          Before computing anything: how high will desk B's density be at
          $0$?
        choices:
          - text: >
              The same, $1/2$: it is the same return.
            feedback: >
              The same return, but a different axis. Desk B's whole triangle
              sits on $(-0.02, 0.02)$, a hundred times narrower, and its area
              must still be $1$.
          - text: >
              Much higher than $1/2$.
            correct: true
            feedback: >
              Right. Squeeze the base by a factor of $100$ and the height must
              grow by $100$ to keep the area at $1$.
          - text: >
              Much lower, $1/200$: decimals are smaller numbers.
            feedback: >
              That would shrink the area to $1/10000$. Smaller numbers on the
              axis mean a narrower base, and a narrower base needs a taller
              curve.
        feedback: >
          The height of a density depends on how the axis is measured.
      - ask: >
          What is desk B's density at $0$?
        expects: "50"
        hint: >
          A window of width $0.002$ in decimals is a window of width $0.2$ in
          percent, and both must catch the same probability.
        feedback: >
          Near $0$, desk A gives a window of width $0.2$ about $(1/2)(0.2) =
          0.1$. Desk B must give its window of width $0.002$ the same $0.1$,
          so its height is $0.1/0.002 = 50$ — a hundred times desk A's.
      - ask: >
          Under desk B's model, what is the probability that the return is
          within one percentage point of $0$?
        expects: "3/4"
        hint: >
          The event is the same event as $\lvert R \rvert < 1$ under desk A,
          and two small triangles of area $1/8$ each lie outside it.
        feedback: >
          It is the same event, so the same probability: under desk A, each
          tail triangle from $1$ to $2$ has base $1$ and height $1/4$, area
          $1/8$, leaving $1 - 2/8 = 3/4$. Areas do not care about units.
      - ask: >
          Under desk A, how many times as likely is a return near $0$ as a
          return near $1$ percent, $f(0)/f(1)$? (Desk B's ratio at $0$ and
          $0.01$ comes out the same.)
        expects: "2"
        feedback: >
          $f(0)/f(1) = (1/2)/(1/4) = 2$. Desk B's heights are both multiplied
          by $100$, so the ratio is still $2$.

      - part: What a density's height means
        reflect: >
          One desk says $1/2$ and the other $50$ about the same point, and
          they agree on every probability and every ratio. What units does a
          density's value carry, and so which numbers drawn from a density
          can you report to someone without saying how the axis is measured?
        answer: >
          A density is probability per unit of $x$ — per percentage point
          for desk A, per unit of decimal return for desk B — so its height
          changes whenever the unit does, by exactly the conversion factor.
          Areas under it are pure probabilities and are unit-free, and a
          ratio of two heights cancels the units, reading as relative
          likelihood. A bare height like "the density is $50$" means nothing
          until you say per what.
      - teach: >
          So a density is a rate, not a probability. Its size depends on the
          units, it can be any nonnegative number, and only areas and ratios
          of heights survive a change of axis. A rate also says nothing about
          one exact point, because a point has no width.

      - part: Zero is not impossible
        ask: >
          Under desk A, what is $\Pr(R = 0.37)$, a return of exactly
          $0.37$ percent?
        expects: "0"
        feedback: >
          A single point has no width, so it catches no area: $0$, even
          though $f(0.37) \approx 0.41$ is far from $0$.
      - ask: >
          Every value of $R$ has probability $0$. What follows?
        choices:
          - text: >
              $R$ cannot take any particular value, so the model is
              contradictory.
            feedback: >
              Tomorrow the return will be some number, and that number had
              probability $0$ in advance. There is no contradiction:
              probability adds over countably many events, and an interval
              holds uncountably many points.
          - text: >
              Probability zero does not mean impossible: some value of
              probability zero always happens.
            correct: true
            feedback: >
              Right. "Exactly $0.37$" has probability $0$, while "within a
              hundredth of $0.37$" has probability about $0.008$, and both
              statements hold at once.
          - text: >
              The model should give each value a tiny positive probability
              instead.
            feedback: >
              Uncountably many values each with the same positive
              probability would add up to more than $1$ along any infinite
              sequence of them. Zero is forced.
        feedback: >
          For a continuous variable, impossible events have probability $0$,
          but so do many events that happen.
      - ask: >
          Desk A's analyst redefines $f(0) = 1000$ and leaves the triangle
          elsewhere unchanged. Which probability changes?
        choices:
          - text: >
              $\Pr(\lvert R \rvert < 1)$, since the peak is part of that
              interval.
            feedback: >
              Changing one point changes no area: the integral over
              $(-1, 1)$ is still $3/4$.
          - text: >
              None of them.
            correct: true
            feedback: >
              Right. A density is pinned down only up to its values at
              isolated points, which is why one reading of $f$ at one point
              has no probabilistic meaning on its own.
          - text: >
              $\Pr(R = 0)$, which becomes positive.
            feedback: >
              $\Pr(R = 0)$ is still an integral over a single point, which is
              $0$ whatever value $f$ takes there.
        feedback: >
          Heights are meaningful only as a continuous rate over
          neighbourhoods, never as one isolated reading.
      - ask: >
          A colleague asks: given that $R = 1$ exactly, what is the chance
          $R > 0$? Why can't you answer with $\Pr(R > 0 \text{ and } R = 1)
          / \Pr(R = 1)$?
        choices:
          - text: >
              You can: the ratio is $0$, since $\Pr(R > 0 \text{ and } R = 1) = 0$.
            feedback: >
              The denominator is also $0$, so the ratio is $0/0$, which has
              no value at all.
          - text: >
              The condition has probability $0$, so the ratio is $0/0$; the
              answer needs a limit over shrinking windows around $1$.
            correct: true
            feedback: >
              Right. Condition on $\lvert R - 1 \rvert < h$ and let $h$
              shrink; here the answer is plainly $1$, but the ratio formula
              cannot produce it.
          - text: >
              Because $R = 1$ is impossible.
            feedback: >
              It is possible — it is exactly as possible as any other value
              in $(-2, 2)$. It just has probability $0$.
        feedback: >
          Conditioning on an exact value of a continuous variable is a
          limiting statement, and it gets proper treatment once conditional
          probability is developed. For now: in an interview, a density of
          $50$ is never a red flag, and "probability zero" is never a
          synonym for "cannot happen".

  - node: quant-probability.random-variables.quantiles
    hook: >
      Median, percentile, and $\operatorname{VaR}$ are all the same object in
      different clothes — the quantile function — built specifically to
      survive the flats and jumps that break naively "solving $F(x)=u$".
    explanation: >
      Plain inversion of $F$ fails in two ways a definition has to route
      around. If $F$ jumps over $u$ — skips it entirely because of an atom —
      no $x$ solves $F(x)=u$ exactly, so the definition takes the smallest
      $x$ where $F$ has climbed at least to $u$, landing on the far side of
      the jump. If $F$ is flat at height $u$ over a stretch of $x$-values —
      because the variable never visits that stretch — many $x$'s would
      satisfy $F(x)=u$, so the definition takes the leftmost one, the
      infimum.

      The equivalence $q(u)\le x \iff u\le F(x)$ is what makes this
      well-behaved: it says $q$ and $F$ are still inverses in the only sense
      that matters, order-preserving, even though pointwise inversion breaks
      down. When $F$ happens to be continuous and strictly increasing, this
      collapses to the ordinary inverse function.

      Quantiles commute with increasing transformations — the median of
      $g(X)$ is $g$ of the median of $X$ — for exactly this reason: an
      increasing map sends "the point with $u$ fraction of the mass below it"
      to another point with the same fraction below it, since order is all
      that's tracked.
    worked: >
      A discrete variable has $p(0)=0.2$, $p(1)=0.5$, $p(2)=0.3$, so
      $F(0)=0.2$, $F(1)=0.7$, $F(2)=1$. The median $q(0.5)$ is the smallest
      $x$ with $F(x)\ge 0.5$: since $F(0)=0.2<0.5$ and $F(1)=0.7\ge 0.5$,
      $q(0.5)=1$. The same reasoning gives $q(0.6)=1$ too — $u=0.6$ lands in
      the same flat stretch, both mapping to the single value $x=1$.
    interview: >
      Given a table of values and probabilities, "find the median" or "find
      the $70$th percentile" is answered directly from the definition —
      cumulate probabilities until the target threshold is first reached or
      exceeded, then stop; the interviewer checks you don't try to solve an
      equation that a jump makes unsolvable.
    pitfalls: >
      Trying to solve $F(x)=u$ exactly for a discrete variable, rather than
      finding the smallest $x$ with $F(x)\ge u$, fails whenever $u$ isn't
      itself one of $F$'s jump values. Forgetting the strict order of the
      equivalence direction — using $q(u)<x$ instead of $q(u)\le x$ —
      misplaces boundary cases.
    recap: >
      $q(u)=\inf\{x:F(x)\ge u\}$ is the order-preserving inverse of $F$ that
      stays well defined through every jump and flat stretch $F$ has.
    dialogue:
      - part: Reading a CDF backwards
        teach: >
          A desk's one-day loss $L$, in millions, has CDF
          $F(x) = x^{2}/(1 + x^{2})$ for $x \ge 0$. Risk wants numbers of the
          form "the loss is at most this much with a given probability".
      - ask: >
          Which loss $x$ is exceeded only half the time — the $x$ with
          $F(x) = 1/2$?
        expects: "1"
        hint: >
          Solve $x^{2}/(1 + x^{2}) = 1/2$.
        feedback: >
          $2x^{2} = 1 + x^{2}$, so $x^{2} = 1$ and $x = 1$. Half the days lose
          at most one million.
      - ask: >
          Which loss is exceeded only one day in ten — the $x$ with
          $F(x) = 0.9$?
        expects: "3"
        hint: >
          Solve $x^{2} = 0.9(1 + x^{2})$.
        feedback: >
          $0.1x^{2} = 0.9$, so $x^{2} = 9$ and $x = 3$. For this loss you
          simply invert $F$.

      - part: When there is nothing to invert
        teach: >
          A second desk counts defaults $D$ in a small loan pool:
          $\Pr(D = 0) = 0.6$, $\Pr(D = 1) = 0.25$, $\Pr(D = 2) = 0.15$. Its
          CDF is a staircase with $F = 0.6$ on $[0, 1)$, $0.85$ on $[1, 2)$
          and $1$ from $2$ on.
      - ask: >
          Risk asks for the level of defaults that is not exceeded with
          probability $0.8$. What do you report?
        choices:
          - text: >
              There is none: no $x$ has $F(x) = 0.8$.
            feedback: >
              True that $F$ never equals $0.8$ — it jumps from $0.6$ to
              $0.85$ at $1$. But "at most $1$ default" already holds with
              probability $0.85 \ge 0.8$, so $1$ answers the question.
          - text: >
              $0.8$, interpolating between $0$ and $1$.
            feedback: >
              $D$ is a count and never equals $0.8$. And
              $\Pr(D \le 0.8) = 0.6$, short of the $0.8$ asked for.
          - text: >
              $1$, the smallest $x$ with $F(x) \ge 0.8$.
            correct: true
            feedback: >
              Right. At $x = 1$ the staircase first reaches $0.8$ or more.
          - text: >
              $2$, to be safe.
            feedback: >
              $2$ satisfies the requirement too, but so does $1$, which is
              smaller. A percentile asks for the least level that works.
        feedback: >
          At a jump, $F(x) = u$ has no solution; you take the first $x$ where
          $F$ reaches $u$.
      - ask: >
          Now the level not exceeded with probability $0.6$. Every $x$ in
          $[0, 1)$ has $F(x) = 0.6$. Which one do you report?
        choices:
          - text: >
              $0.5$, the middle of the flat stretch.
            feedback: >
              Any point of $[0, 1)$ solves $F(x) = 0.6$, so "the middle" is
              a convention, not an answer. The question asks for the least
              level that works.
          - text: >
              $0$.
            correct: true
            feedback: >
              Right. $F(0) = 0.6$ already, and nothing below $0$ works, so
              the smallest $x$ with $F(x) \ge 0.6$ is $0$.
          - text: >
              $1$, where the staircase moves next.
            feedback: >
              At $1$, $F$ is $0.85$, but $0$ already reached $0.6$. Moving to
              the next step overshoots.
        feedback: >
          A flat stretch gives $F(x) = u$ too many solutions, and the same
          rule as before picks one: the smallest.
      - reflect: >
          Write one rule for "the level not exceeded with probability $u$"
          that gives $3$ for the loss at $u = 0.9$, $1$ for the defaults at
          $u = 0.8$, and $0$ at $u = 0.6$. Why does it never fail to give an
          answer?
        hint: >
          Your answers at the jump and on the flat stretch had something in
          common.
        answer: >
          Take the smallest $x$ with $F(x) \ge u$. The set of such $x$ is
          never empty, because $F \to 1 > u$, and it is a half-line
          $[x_0, \infty)$ because $F$ never decreases. It contains its left
          end because $F$ is right-continuous. So the smallest element
          exists, at jumps and flats alike, and for a smooth strictly
          increasing $F$ it is just $F^{-1}(u)$.

      - part: The quantile function
        teach: >
          That rule is the quantile function,
          $q(u) = \inf\{x \in \mathbb{R} : F(x) \ge u\}$ for $u \in (0, 1)$.
          The median is $q(1/2)$, the quartiles are $q(0.25)$ and $q(0.75)$,
          and the defining equivalence is $q(u) \le x \iff u \le F(x)$. When
          $F$ is continuous and strictly increasing, $q = F^{-1}$. A loss
          quantile at $0.99$ is what a desk calls value-at-risk.
      - ask: >
          For the defaults, what is $q(0.85)$?
        expects: "1"
        hint: >
          Use $q(u) \le x \iff u \le F(x)$ with $x = 1$ and with $x = 0$.
        feedback: >
          $0.85 \le F(1) = 0.85$, so $q(0.85) \le 1$; $0.85 > F(0) = 0.6$, so
          $q(0.85) > 0$. Hence $q(0.85) = 1$. With $>$ in place of $\ge$ you
          would wrongly get $2$: the boundary case is decided by the $\ge$.
      - ask: >
          The desk reports the squared loss $L^{2}$ instead. What is the
          $90$th percentile of $L^{2}$?
        expects: "9"
        hint: >
          $L \le 3$ and $L^{2} \le 9$ are the same event, since $L \ge 0$.
        feedback: >
          $\Pr(L^{2} \le 9) = \Pr(L \le 3) = 0.9$, so the percentile is
          $3^{2} = 9$. Quantiles pass straight through an increasing map —
          no new CDF needed.
      - ask: >
          What is the $90$th percentile of $-L$, the desk's profit?
        choices:
          - text: >
              $-3$
            feedback: >
              $\Pr(-L \le -3) = \Pr(L \ge 3) = 0.1$, not $0.9$. Negation
              reverses order, so the top tail of $-L$ comes from the bottom
              tail of $L$.
          - text: >
              $3$
            feedback: >
              $-L$ is never positive. A percentile of $-L$ must be a value
              $-L$ can come near.
          - text: >
              $-1/3$
            correct: true
            feedback: >
              Right. $\Pr(-L \le -x) = \Pr(L \ge x)$, which is $0.9$ when
              $F(x) = 0.1$: $x^{2} = 1/9$, $x = 1/3$.
        feedback: >
          Quantiles commute with increasing maps and are reflected by
          decreasing ones: the $u$-quantile of $-L$ is minus the
          $(1 - u)$-quantile of $L$. In an interview, say "smallest $x$ with
          $F(x) \ge u$" and you are safe at every jump and flat.

  - node: quant-probability.random-variables.symmetric
    hook: >
      Spotting a reflection symmetry in the setup — swap heads and tails,
      swap two dice, negate a centered quantity — hands you the median for
      free, no integral or sum required.
    explanation: >
      Symmetry about $c$ says $c-X$ and $X-c$ share a law: reflecting the
      variable through $c$ changes nothing about its distribution. Because
      equality in distribution preserves every marginal probability,
      $\Pr(X>c)$ and $\Pr(X<c)$ must be equal to each other, and since they
      also add up to $1-\Pr(X=c)$, each is exactly half of that — which is
      precisely the definition of $c$ being a median.

      Spotting the symmetry is the whole skill: look for a relabelling of the
      underlying experiment — an exchange, a sign flip, a swap of two
      identically-behaving pieces — that leaves the story unchanged while
      sending $X$ to $2c-X$. If such a relabelling exists, the reflection
      identity follows immediately from equality in distribution, without
      touching the pmf or pdf at all.

      The quantile pairing $q(u)+q(1-u)=2c$, valid once $F$ is also strictly
      increasing, extends the same idea to every percentile, not just the
      median: the $10$th and $90$th percentiles average to $c$, and so on for
      any matched pair.
    worked: >
      Roll two fair dice and let $D$ be the first roll minus the second.
      Swapping which die is "first" negates $D$ while leaving the joint
      distribution of the two dice unchanged (they're iid), so $D\sim -D$:
      symmetric about $0$. Among the $36$ equally likely pairs, $D=0$ occurs
      for the $6$ pairs with equal faces, so $\Pr(D=0)=6/36=1/6$. By
      symmetry, $\Pr(D>0)=\Pr(D<0)=(1-1/6)/2=5/12$ — the median of $D$ is
      $0$, obtained without ever listing the full distribution of $D$.
    interview: >
      "What's the median of [some visibly balanced setup]" is answered by
      naming the relabelling that proves symmetry, then reading off the
      median as the center point — interviewers listen for the symmetry
      argument stated explicitly, not a guess that "it's probably the middle
      value".
    pitfalls: >
      Declaring a setup "symmetric" because it looks balanced, without naming
      the actual relabelling that swaps $X$ for $2c-X$, is an unjustified
      leap. Forgetting the atom term when $\Pr(X=c)>0$ gives tails of exactly
      $1/2$ each when they should be $(1-\Pr(X=c))/2$.
    recap: >
      If reflecting $X$ about $c$ leaves its law unchanged, $c$ is a median
      with equal tails on both sides — a computation-free answer the moment
      the relabelling is spotted.
    dialogue:
      - part: Three dice and no table
        teach: >
          Three fair dice are rolled and $S$ is their total, somewhere from
          $3$ to $18$. You are asked for $\Pr(S \ge 11)$ and you do not want
          to tabulate $216$ outcomes.
      - ask: >
          Warm up at the edges. What is $\Pr(S = 4)$?
        expects: "1/72"
        hint: >
          A total of $4$ needs two ones and a two. Where can the two go?
        feedback: >
          $(1,1,2)$, $(1,2,1)$, $(2,1,1)$: three outcomes of $216$, so
          $3/216 = 1/72$.
      - ask: >
          What is $\Pr(S = 17)$?
        expects: "1/72"
        hint: >
          A total of $17$ needs two sixes and a five.
        feedback: >
          $(6,6,5)$, $(6,5,6)$, $(5,6,6)$: again three, so $1/72$. The
          outcomes for $17$ look like the outcomes for $4$ seen from the
          other side.
      - reflect: >
          Explain why $\Pr(S = k) = \Pr(S = 21 - k)$ for every $k$, using a
          single operation you can apply to every roll of the three dice.
        hint: >
          Opposite faces of a die add to $7$.
        answer: >
          Replace each face $x$ by $7 - x$ — turn every die upside down. That
          map is a bijection of the $216$ equally likely outcomes onto
          themselves, so it preserves probabilities, and it sends a total of
          $S$ to $21 - S$. Hence $S$ and $21 - S$ have the same law:
          $S$ is symmetric about $10.5$, and each total $k$ is exactly as
          likely as its mirror $21 - k$.
      - ask: >
          So what is $\Pr(S \ge 11)$?
        expects: "1/2"
        hint: >
          $\{S \ge 11\}$ is the mirror image of $\{S \le 10\}$, and together
          they cover everything.
        feedback: >
          The flip carries $\{S \ge 11\}$ onto $\{S \le 10\}$, so the two have
          equal probability, and they partition the outcomes. Each is $1/2$
          — $108$ of the $216$ rolls — and no table was needed.

      - part: Symmetry about a centre
        teach: >
          $X$ is symmetric about $c$ when $X - c$ and $c - X$ have the same
          law. Then $c$ is a median, and the two tails mirror each other:
          $\Pr(X > c) = \Pr(X < c) = (1 - \Pr(X = c))/2$. For a continuous,
          strictly increasing $F$ the quantiles pair up as
          $q(u) + q(1 - u) = 2c$. The work is always in naming the relabelling
          that carries $X$ to $2c - X$.
      - ask: >
          What is the load-bearing step in proving $\Pr(X > c) = \Pr(X < c)$?
        choices:
          - text: >
              $X$ has a density that is symmetric about $c$.
            feedback: >
              That is one way symmetry shows up, but the dice have no
              density. The proof works for every law, atoms included.
          - text: >
              $\{X > c\} = \{X - c > 0\}$ and $\{X < c\} = \{c - X > 0\}$, and
              $X - c$ and $c - X$ have the same law, so they give the event
              "$> 0$" the same probability.
            correct: true
            feedback: >
              Right. Equality in distribution transfers the probability of
              one set, $(0, \infty)$, from one variable to the other, and
              nothing more is needed.
          - text: >
              The mean of $X$ is $c$.
            feedback: >
              A mean at $c$ says nothing about how the probability splits —
              a variable can have mean $c$ with $90$ percent of its mass
              below $c$.
        feedback: >
          The two tails are one event seen through two variables with the
          same law. Since $\Pr(X > c) + \Pr(X = c) + \Pr(X < c) = 1$, each
          tail is $(1 - \Pr(X = c))/2$.

      - part: Four dice, with an atom at the centre
        ask: >
          With four dice the total $T$ is symmetric about $14$, and
          $\Pr(T = 14) = 146/1296$. What is $\Pr(T > 14)$?
        expects: "575/1296"
        hint: >
          The centre now carries mass. Remove it, then split what is left.
        feedback: >
          $\Pr(T > 14) = (1 - 146/1296)/2 = (1296 - 146)/2592 = 1150/2592 =
          575/1296 \approx 0.444$. Answering $1/2$ forgets the atom.
      - ask: >
          You are also told $\Pr(T \le 11) = 310/1296$. What is
          $\Pr(12 \le T \le 16)$?
        expects: "169/324"
        hint: >
          Mirror $\{T \le 11\}$ about $14$.
        feedback: >
          The mirror of $\{T \le 11\}$ is $\{T \ge 17\}$, also $310/1296$. The
          middle is what is left: $1 - 620/1296 = 676/1296 = 169/324$. One
          tail priced the other.

      - part: Balanced-looking is not symmetric
        ask: >
          $Y$ takes the values $1$, $2$ and $6$ with probabilities $0.5$,
          $0.25$ and $0.25$. A colleague says its values span $1$ to $6$,
          so by symmetry the median is $3.5$. What is the median $q(1/2)$?
        expects: "1"
        hint: >
          Find the smallest $y$ with $\Pr(Y \le y) \ge 1/2$.
        feedback: >
          $\Pr(Y \le 1) = 0.5$ already, so $q(1/2) = 1$. Flipping about $3.5$
          would send $1$ to $6$, and $\Pr(Y = 1) = 0.5$ while
          $\Pr(Y = 6) = 0.25$: no relabelling carries $Y$ to $7 - Y$, and the
          symmetry was never there.
      - ask: >
          Now one of the three dice is loaded: six comes up half the time and
          each other face a tenth of the time. Is the total still symmetric
          about $10.5$?
        choices:
          - text: >
              Yes: the range is still $3$ to $18$.
            feedback: >
              The range is symmetric, the law is not. The loaded die is $6$
              half the time but $1$ only a tenth of the time, so
              turning it upside down changes probabilities.
          - text: >
              Yes, because the other two dice are still fair.
            feedback: >
              The flip has to act on every die at once. For the loaded die
              it swaps a face of probability $1/2$ with a face of probability
              $1/10$, and the total inherits that tilt.
          - text: >
              No: turning the loaded die over no longer preserves
              probabilities, and the total now leans high.
            correct: true
            feedback: >
              Right. The relabelling that proved the symmetry is the thing
              that broke, and with it the free median.
        feedback: >
          In an interview, "by symmetry" earns credit only with the map
          named: "turn every die over; that preserves the law and sends $S$ to
          $21 - S$, so the median is the centre."

  - node: quant-probability.random-variables.indicator
    hook: >
      Turning "how many of these $n$ events occur" from a case-by-case
      enumeration into a single sum is the most reused trick in the interview
      canon, and it starts here.
    explanation: >
      An indicator is the simplest possible random variable — a Bernoulli
      switch reporting whether $A$ happened — but its payoff is algebraic:
      because $\mathbf{1}\{A\}$ only ever takes the values $0$ and $1$, set
      operations on events become ordinary multiplication and subtraction on
      numbers. Intersection becomes a product, complement becomes "$1$
      minus," and squaring an indicator does nothing, since $0^2=0$ and
      $1^2=1$.

      The identity worth internalising is
      $\mathbf{1}\{A_1\cap A_2\}=\mathbf{1}\{A_1\}\mathbf{1}\{A_2\}$ — this
      holds as pure algebra for any two events, independent or not, because
      both sides are $1$ exactly when both indicators are $1$. Independence
      is a separate, stronger fact that lets you go further and say the
      probability of that product equals the product of the probabilities.

      The general pattern this unlocks: any count — how many components fail,
      how many cards match a suit, how many of $n$ trials succeed — is
      $N=\sum_i \mathbf{1}\{A_i\}$, turning "count how many things happen"
      into "add up $0$'s and $1$'s." Every variable also generates its own
      family of indicators, $\mathbf{1}\{X>t\}$, converting a question about
      $X$'s size into a question about an event.
    worked: >
      Flip a fair coin $3$ times; let $A_i$ be "flip $i$ is heads" and
      $N=\sum_{i=1}^{3}\mathbf{1}\{A_i\}$, the total number of heads. The
      algebra $\mathbf{1}\{A_1\}\mathbf{1}\{A_2\}\mathbf{1}\{A_3\}=
      \mathbf{1}\{A_1\cap A_2\cap A_3\}$ says $N=3$ exactly when all three
      indicators equal $1$ at once, so
      $\Pr(N=3)=\Pr(A_1\cap A_2\cap A_3)=(1/2)^3=1/8$ by independence of the
      flips — no separate enumeration of outcomes needed.
    interview: >
      Any prompt shaped like "how many of these $n$ [events] occur" is a cue
      to define $N$ as a sum of indicators immediately — the interviewer
      watches for that decomposition to appear before any attempt at a direct
      pmf, since the sum form is what the next unit's linearity trick
      exploits without needing independence.
    pitfalls: >
      The identity $\mathbf{1}\{A\cap B\}=\mathbf{1}\{A\}\mathbf{1}\{B\}$ is
      pure algebra and holds regardless of independence — but the
      probability statement $\Pr(A\cap B)=\Pr(A)\Pr(B)$ obtained by taking
      probabilities of both sides only holds once independence is separately
      established. Conflating the two lets an unjustified independence
      assumption slip in unnoticed.
    recap: >
      An indicator is a $0/1$ Bernoulli variable whose algebra turns
      intersection into multiplication and complement into subtraction, and
      every count is a sum of indicators.
    dialogue:
      - part: Two points on one roll
        teach: >
          You roll a fair die and score a point if the face is even, and
          another point if the face is at least $4$. $P$ is your total, $0$,
          $1$ or $2$.
      - ask: >
          What is $\Pr(P = 1)$?
        expects: "1/3"
        hint: >
          Go face by face: which faces earn exactly one of the two points?
        feedback: >
          Face $2$ is even but below $4$; face $5$ is at least $4$ but odd.
          Faces $4$ and $6$ score both, and $1$ and $3$ score neither. So
          $\Pr(P = 1) = 2/6 = 1/3$.
      - ask: >
          Multiply the two points instead: $B$ is (even point) times
          (at-least-$4$ point). What is $\Pr(B = 1)$?
        expects: "1/3"
        hint: >
          A product of two numbers that are each $0$ or $1$ is $1$ only when
          both are $1$.
        feedback: >
          $B = 1$ exactly on the faces scoring both points, $4$ and $6$:
          $2/6 = 1/3$. Multiplying the two scores computed "both".
      - ask: >
          A colleague computes $\Pr(B = 1)$ as
          $\Pr(\text{even}) \times \Pr(\text{at least } 4) = 1/4$. What is
          wrong?
        choices:
          - text: >
              Nothing: $B$ is a product, so its probability is a product.
            feedback: >
              $B$ is a product of the two scores on each roll, and that is
              pure algebra. Turning it into a product of probabilities would
              need the events to be independent, and they are not: among the
              even faces two of three are at least $4$, against one of two
              overall.
          - text: >
              He has the events wrong; both probabilities are $1/3$.
            feedback: >
              Each event has probability $3/6 = 1/2$. The events are right;
              the step from them to $1/4$ is what fails.
          - text: >
              The product of scores is exact, but multiplying probabilities
              assumes independence, which fails here.
            correct: true
            feedback: >
              Right. "Even" and "at least $4$" overlap in two faces, not the
              $1.5$ that independence would predict.
        feedback: >
          On every single roll, (score for $A$) times (score for $B$) is the
          score for "both". That identity costs nothing. Its probability is
          $\Pr(A \cap B)$, whatever that is.
      - reflect: >
          Each point is a variable equal to $1$ when its event happens and
          $0$ otherwise. Using only those two variables, write "neither point
          is scored" and "at least one point is scored", and say why your
          expressions are right on every face.
        hint: >
          $1 - (\text{score})$ is $1$ exactly when that point is missed.
        answer: >
          Write $a$ and $b$ for the two scores. "Neither" is $(1 - a)(1 - b)$,
          which is $1$ only when both scores are $0$. "At least one" is the
          complement, $1 - (1 - a)(1 - b) = a + b - ab$. On a face scoring
          both, $a + b = 2$ and subtracting $ab = 1$ brings it back to $1$ —
          the overlap counted twice is removed once. That is
          inclusion–exclusion, carried out on numbers instead of sets.

      - part: The variable that switches on with an event
        teach: >
          For an event $A$, the indicator $\mathbf{1}\{A\}$ is $1$ when $A$
          occurs and $0$ otherwise. Its law is Bernoulli: $p(1) = \Pr(A)$,
          $p(0) = 1 - \Pr(A)$. Its algebra is set algebra in disguise:
          $\mathbf{1}\{A\}^{2} = \mathbf{1}\{A\}$,
          $\mathbf{1}\{A \cap B\} = \mathbf{1}\{A\}\mathbf{1}\{B\}$,
          $\mathbf{1}\{A^{c}\} = 1 - \mathbf{1}\{A\}$, and every count of
          events that occur is a sum of indicators.
      - ask: >
          With $A$ = even and $C$ = at least $4$, what is
          $\Pr(\mathbf{1}\{A\} + \mathbf{1}\{C\} - \mathbf{1}\{A\}\mathbf{1}\{C\} = 1)$?
        expects: "2/3"
        hint: >
          That expression is the indicator of $A \cup C$.
        feedback: >
          It is $\mathbf{1}\{A \cup C\}$, so the probability is
          $\Pr(A \cup C) = 1/2 + 1/2 - 1/3 = 2/3$ — faces $2$, $4$, $5$, $6$.
      - ask: >
          A colleague writes $\mathbf{1}\{A \cup C\} = \mathbf{1}\{A\} + \mathbf{1}\{C\}$.
          What does his right side equal when the die shows $6$?
        expects: "2"
        feedback: >
          $6$ is even and at least $4$, so his sum is $1 + 1 = 2$ — not a
          $0/1$ value at all, so not an indicator. A sum of indicators counts
          events; it is the indicator of the union only when the events are
          disjoint.

      - part: Every variable is a pile of indicators
        ask: >
          Now let $X$ be the face shown and look at the six indicators
          $\mathbf{1}\{X > 0\}, \mathbf{1}\{X > 1\}, \dots, \mathbf{1}\{X > 5\}$.
          When the die shows $4$, how many of them equal $1$?
        expects: "4"
        hint: >
          $4 > t$ for which $t$ among $0, 1, \dots, 5$?
        feedback: >
          $4 > 0, 1, 2, 3$ and not $4 > 4$ or $4 > 5$: four of them.
      - ask: >
          So what is $\sum_{t=0}^{5} \mathbf{1}\{X > t\}$, as a random
          variable?
        choices:
          - text: >
              $X$ itself.
            correct: true
            feedback: >
              Right. On a face $x$, exactly the indicators with $t < x$ are
              on, and there are $x$ of them.
          - text: >
              The constant $6$.
            feedback: >
              On a $4$ only four of the six are $1$. The sum moves with $X$.
          - text: >
              $\mathbf{1}\{X > 0\}$, since the other indicators are contained
              in it.
            feedback: >
              The events are nested, but nesting does not make the sum
              collapse: on a $4$, four of them are on and the sum is $4$.
        feedback: >
          Any count — here the count of thresholds below $X$ — is a sum of
          indicators, and the family $\mathbf{1}\{X > t\}$ rebuilds $X$ from
          events. In an interview, "how many of these happen" is a cue to
          write $N = \sum_i \mathbf{1}\{A_i\}$ before anything else; the next
          unit turns that sum into an expectation with one line.

  - node: quant-probability.random-variables.mixed
    hook: >
      Any payoff with a cap, floor, or knockout produces exactly this shape,
      and the standard interview trap is analysing it as purely continuous —
      silently dropping the entire atom of probability sitting at the
      boundary.
    explanation: >
      The shape comes from a general mechanism worth naming: whenever a
      transformation sends an entire tail of the underlying variable's range
      to one boundary value while behaving one-to-one everywhere else, the
      transformed variable inherits an atom at that boundary equal to the
      tail probability, plus a continuous piece — rescaled but otherwise
      undistorted — on the interior. Capping does this by collapsing
      everything above the cap onto the cap itself; flooring collapses
      everything below the floor onto the floor.

      Computing with a mixed law is just bookkeeping: split any probability
      into the piece captured by the atom and the piece captured by the
      density, and add. The CDF itself is built the same direct way it always
      is — $\Pr(\text{transformed variable}\le t)$ — evaluated separately for
      $t$ below the boundary and at or past it.

      The instinct to build is checking, before any computation: does the
      described transformation ever send a whole range of outcomes to a
      single number? If so, that number carries an atom, and treating the
      whole law as purely continuous will understate probabilities at exactly
      that point.
    worked: >
      A contract pays $Y=\max(Z,1)$ where $Z$ is uniform on $(0,3)$ — a floor
      at $1$ instead of a cap. The atom is $\Pr(Y=1)=\Pr(Z\le 1)=1/3$. For
      $1\le t\le 3$, $F_Y(t)=\Pr(Z\le t)=t/3$, so $F_Y$ jumps to $1/3$ at
      $t=1$ and then climbs linearly to $1$ at $t=3$, giving a density of
      $1/3$ on $(1,3)$. The median solves $F_Y(t)=1/2$: since the jump only
      reaches $1/3<1/2$, the median sits in the continuous part,
      $t/3=1/2 \Rightarrow t=1.5$. And $\Pr(Y>2)=1-F_Y(2)=1-2/3=1/3$.
    interview: >
      The canonical framing is a payoff with a deductible or a cap —
      "describe the distribution of the insurer's payout" — and the
      interviewer wants immediate recognition of an atom at the boundary plus
      a rescaled continuous piece elsewhere, not an attempt to force one
      unified density or pmf over the whole range.
    pitfalls: >
      Computing probabilities as though the law were purely continuous
      silently drops the atom at the boundary, understating the probability
      of landing exactly there. Normalising the continuous piece on its own —
      integrating the density over just the interior and expecting it to hit
      $1$ — forgets that the atom carries the rest of the mass.
    recap: >
      A capped or floored payoff is a mixed law: an atom at the boundary
      equal to the collapsed tail probability, plus a rescaled continuous
      density on the interior, computed by splitting and adding.
    dialogue:
      - part: A bonus with a ceiling
        teach: >
          A trader's bonus is her desk's profit $Y$, uniform on $(0, 5)$
          million, but capped at $2$ million: she is paid $X = \min(Y, 2)$.
          Before quoting anything about $X$, find out where its probability
          sits.
      - ask: >
          What is $\Pr(X = 2)$?
        expects: "3/5"
        hint: >
          She is paid exactly the cap whenever the profit reaches it.
        feedback: >
          $X = 2$ exactly when $Y \ge 2$, which has probability $3/5$. More
          than half of all outcomes land on a single number.
      - ask: >
          What is $\Pr(X \le 1)$?
        expects: "1/5"
        hint: >
          Below the cap, $X$ and $Y$ coincide.
        feedback: >
          For $t < 2$, $\{X \le t\} = \{Y \le t\}$, so $F_X(1) = 1/5$. On
          $[0, 2)$ the CDF of $X$ is $t/5$.
      - ask: >
          Below the cap, $X$ has a density. What is its value on $(0, 2)$?
        expects: "1/5"
        hint: >
          Differentiate $t/5$.
        feedback: >
          $f_X(t) = 1/5$ on $(0, 2)$, holding $2/5$ of the probability. The
          other $3/5$ is the atom at $2$. Together $2/5 + 3/5 = 1$.
      - ask: >
          What kind of law is $X$?
        choices:
          - text: >
              Continuous, because it can take any value in $(0, 2]$.
            feedback: >
              A continuous law gives each point probability $0$, and
              $\Pr(X = 2) = 3/5$.
          - text: >
              Discrete, because so much of it sits at $2$.
            feedback: >
              A discrete law puts all its probability on countably many
              points. Here $2/5$ is spread over $(0, 2)$ with no atoms.
          - text: >
              Mixed: a density of $1/5$ on $(0, 2)$ plus an atom of $3/5$
              at $2$.
            correct: true
            feedback: >
              Right. The CDF climbs linearly to $2/5$ and then jumps to $1$.
        feedback: >
          Every cap does this: it gathers the whole upper tail of $Y$ into
          one point.

      - part: Probabilities that use both pieces
        ask: >
          What is $\Pr(X > 1.5)$?
        expects: "0.7"
        hint: >
          Add the stretch $(1.5, 2)$ to the atom.
        feedback: >
          $1 - F_X(1.5) = 1 - 1.5/5 = 0.7$: $0.1$ from the density on
          $(1.5, 2)$ and $0.6$ from the atom at $2$.
      - ask: >
          Which pair is right?
        choices:
          - text: >
              $\Pr(X \ge 2) = 3/5$ and $\Pr(X > 2) = 0$.
            correct: true
            feedback: >
              Right. The atom belongs to $\ge$ and not to $>$, and nothing
              lies above the cap.
          - text: >
              $\Pr(X \ge 2) = \Pr(X > 2) = 3/5$.
            feedback: >
              For a continuous variable $\ge$ and $>$ agree; at an atom they
              differ by the atom. $X$ never exceeds $2$, so $\Pr(X > 2) = 0$.
          - text: >
              $\Pr(X \ge 2) = 0$, since a single point has probability $0$.
            feedback: >
              That rule is for continuous variables. Here the single point
              $2$ carries $3/5$.
        feedback: >
          With a mixed law, write each probability as density part plus atom
          part, and decide every endpoint at the atom deliberately.

      - part: Where the median lands
        reflect: >
          You want the median of the bonus. On $[0, 2)$ the CDF is $t/5$,
          which never reaches $1/2$, and from $2$ on it is $1$. So
          $F_X(t) = 1/2$ has no solution. Where is the median, and why?
        hint: >
          Recall the definition of $q(u)$ as the smallest $x$ with
          $F(x) \ge u$.
        answer: >
          The median is $2$, the cap itself. $F_X$ jumps from $2/5$ to $1$
          at $2$, so $2$ is the smallest $t$ with $F_X(t) \ge 1/2$. In plain
          words: $\Pr(X < 2) = 2/5$ and $\Pr(X \le 2) = 1$, so half the
          probability is reached inside the atom. The typical bonus is the
          maximum one.
      - ask: >
          What is the $0.3$-quantile of $X$?
        expects: "1.5"
        hint: >
          $0.3$ is below the $2/5$ the continuous part reaches.
        feedback: >
          $t/5 = 0.3$ gives $t = 1.5$. Quantiles below $2/5$ come from the
          density part; every quantile from $2/5$ up to $1$ is the cap.
      - ask: >
          A colleague, uneasy with the atom, describes $X$ as uniform on
          $(0, 2)$ and quotes a median of $1$. What has he done?
        choices:
          - text: >
              Nothing serious: the cap only matters for extreme profits.
            feedback: >
              The cap binds $60$ percent of the time — it is the most likely
              outcome, not an extreme one.
          - text: >
              He spread the atom's $3/5$ over $(0, 2)$, moving most of the
              probability down from the cap.
            correct: true
            feedback: >
              Right. Uniform on $(0, 2)$ says $\Pr(X \le 1) = 1/2$; the truth
              is $1/5$. Dropping the atom moves the median from $2$ to $1$.
          - text: >
              His median is right but his density is wrong.
            feedback: >
              Both are wrong: the true $\Pr(X \le 1)$ is $1/5$, not $1/2$, so
              $1$ is not a median.
        feedback: >
          In an interview, describe a capped payoff in one sentence: "a flat
          density of $1/5$ up to $2$, holding $2/5$, and an atom of $3/5$ at
          the cap, so the median is the cap."

  - node: quant-probability.random-variables.cdf-method
    hook: >
      Whenever $g$ has a kink or isn't one-to-one — squares, absolute values,
      maxima — this is the fallback that always works, and interviewers
      reach for exactly such a $g$ to see whether you default to it instead
      of guessing at a shortcut.
    explanation: >
      The whole method is one sentence: $F_Y(y)=\Pr(g(X)\le y)$ is the
      probability that $X$ lands in whichever set of $x$-values satisfies
      $g(x)\le y$ — so the entire problem is finding that set correctly
      before any calculus happens. Once the set is written down as an
      interval or union of intervals in terms of $X$, its probability comes
      from $F_X$ or from integrating $f_X$, exactly as usual, and only after
      that is $F_Y$ differentiated, if a density is wanted at all.

      The step that actually requires care is that the set solving
      $g(x)\le y$ can change shape as $y$ moves through different ranges — a
      different algebraic description above one threshold than below it — so
      the range of $y$ has to be split into pieces before a single formula
      for $f_Y$ can be trusted. Skipping this and writing one global formula
      is the most common way this technique goes wrong.

      Compare this to what the monotone change-of-variables shortcut buys
      later: when $g$ is one-to-one, the preimage of $(-\infty,y]$ is always
      a single ray, and there's no casework — this method is what you fall
      back to exactly when that simplification isn't available.
    worked: >
      Let $X$ be uniform on $(-2,3)$, so $f_X(x)=1/5$ there, and $Y=|X|$,
      which ranges over $[0,3]$ and is not one-to-one. For $0\le y\le 2$,
      $\{-y\le X\le y\}$ sits entirely inside $(-2,3)$, giving
      $F_Y(y)=\Pr(-y\le X\le y)=2y/5$. But for $2<y\le 3$, $X$ can't go below
      $-2$, so the set is really $\{-2\le X\le y\}$, giving
      $F_Y(y)=(y+2)/5$ — a different formula past $y=2$ because the support
      is asymmetric. This gives $\Pr(Y>2.5)=1-F_Y(2.5)=1-4.5/5=0.1$.
    interview: >
      Given a non-monotone transform like $Y=X^2$, $Y=|X|$, or
      $Y=\min(X,c)$, the interviewer watches whether you write
      $F_Y(y)=\Pr(g(X)\le y)$ and solve for the correct set immediately,
      rather than guessing a shortcut formula that only applies to monotone
      $g$.
    pitfalls: >
      Writing a single formula for $F_Y$ across the whole range of $y$,
      without checking whether the shape of the solution set to $g(x)\le y$
      changes at some threshold, misses exactly the kind of asymmetric-
      support case above. Differentiating before fixing which range of $y$
      the formula is valid on produces a density with the wrong support.
    recap: >
      Solve $g(x)\le y$ for the exact set of $x$ it describes, get its
      probability from $F_X$, and only then differentiate — always
      available, and the only route when $g$ isn't monotone.
    dialogue:
      - part: Breaking a stick
        teach: >
          You break a stick of length $1$ at a point $U$ chosen uniformly
          along it, and $Y$ is the length of the shorter piece, so
          $Y = \min(U, 1 - U)$.
      - ask: >
          What is $\Pr(Y \le 0.1)$?
        expects: "0.2"
        hint: >
          Which break points $U$ leave a short piece of at most $0.1$? There
          are two stretches of them.
        feedback: >
          The short piece is at most $0.1$ when $U \le 0.1$ or $U \ge 0.9$:
          two stretches of length $0.1$, total $0.2$. The tempting $0.1$
          counts only the left end of the stick.
      - ask: >
          For a general $y$ between $0$ and $1/2$, what is $\Pr(Y \le y)$?
        choices:
          - text: >
              $y$
            feedback: >
              That is $\Pr(U \le y)$, one end of the stick. The break at
              $U \ge 1 - y$ also leaves a short piece of at most $y$.
          - text: >
              $2y$
            correct: true
            feedback: >
              Right: $\{Y \le y\} = \{U \le y\} \cup \{U \ge 1 - y\}$, two
              disjoint stretches of length $y$.
          - text: >
              $1 - 2y$
            feedback: >
              That is the middle stretch $(y, 1 - y)$, where the short piece
              is longer than $y$: it is $\Pr(Y > y)$.
        feedback: >
          So $F_Y(y) = 2y$ on $[0, 1/2]$: the shorter piece is uniform on
          $(0, 1/2)$.
      - ask: >
          What is $\Pr(Y \le 0.6)$?
        expects: "1"
        hint: >
          How long can the shorter piece be?
        feedback: >
          The shorter piece never exceeds $1/2$, so $\Pr(Y \le 0.6) = 1$.
          Plugging $0.6$ into $2y$ gives $1.2$, which is not a probability:
          the formula holds only on the range where you derived it.
      - reflect: >
          You found the law of $Y$ without any formula for transforming
          densities, and $\min(u, 1 - u)$ is not even one-to-one. What did you
          do, step by step, each time you computed $\Pr(Y \le y)$?
        answer: >
          Turn the question about $Y$ into a question about $U$: solve the
          inequality $\min(u, 1 - u) \le y$ for the set of $u$ it describes
          (here two end stretches), and measure that set with the law of
          $U$. That gives $F_Y$ on the range where $Y$ lives; outside it,
          $F_Y$ is $0$ or $1$. A density, if wanted, comes last, by
          differentiating. Nothing required $g$ to be invertible.

      - part: The CDF method
        teach: >
          That is the CDF method for $Y = g(X)$: write
          $F_Y(y) = \Pr(g(X) \le y)$, solve $g(x) \le y$ for the set of $x$,
          express its probability through $F_X$ or an integral of $f_X$, and
          only then differentiate if a density is wanted. It works for every
          $g$, and it is the tool of choice when $g$ folds, kinks or caps —
          squares, absolute values, minima. Fix the range of $y$ first.
      - ask: >
          The classic follow-up: what is the probability that the shorter
          piece is at most a third of the longer one?
        expects: "1/2"
        hint: >
          With $R = Y/(1 - Y)$, solve $y/(1 - y) \le 1/3$ for $y$.
        feedback: >
          $y/(1 - y) \le 1/3$ means $3y \le 1 - y$, so $y \le 1/4$. Then
          $\Pr(R \le 1/3) = \Pr(Y \le 1/4) = 2 \cdot 1/4 = 1/2$.
      - ask: >
          For $0 \le r \le 1$, what is $F_R(r) = \Pr(R \le r)$?
        choices:
          - text: >
              $r$
            feedback: >
              At $r = 1/3$ that gives $1/3$, but you just found $1/2$. The
              ratio is not uniform.
          - text: >
              $2r/(1 + r)$
            correct: true
            feedback: >
              Right. $R \le r$ means $Y \le r/(1 + r)$, and
              $F_Y(r/(1 + r)) = 2r/(1 + r)$. Check: $r = 1$ gives $1$.
          - text: >
              $r/(1 + r)$
            feedback: >
              That is the threshold for $Y$, not its probability. You still
              have to push it through $F_Y(y) = 2y$.
        feedback: >
          Same three moves as before: solve for the set, measure it, keep the
          range — here $R \in [0, 1]$ because the shorter piece never beats
          the longer.
      - ask: >
          Now differentiate. What is the density of $R$ at $r = 1$?
        expects: "1/2"
        hint: >
          $\frac{d}{dr}\,2r/(1 + r) = 2/(1 + r)^{2}$.
        feedback: >
          $f_R(r) = 2/(1 + r)^{2}$ on $(0, 1)$, so $f_R(1) = 2/4 = 1/2$. The
          density is $2$ near $0$ and falls to $1/2$ at $1$: lopsided breaks
          are common.

      - part: Range errors
        ask: >
          What is $\Pr(R \le 2)$?
        expects: "1"
        hint: >
          How large can the ratio of shorter to longer be?
        feedback: >
          $R \le 1$ always, so $\Pr(R \le 2) = 1$. The formula $2r/(1 + r)$
          at $r = 2$ gives $4/3$: it was derived for $r \le 1$ only.
      - ask: >
          A colleague computes the density of the shorter piece by
          differentiating $2y$ and reports $f_Y(y) = 2$ for all $y > 0$.
          What is wrong?
        choices:
          - text: >
              The derivative: it should be $1$, as for $U$.
            feedback: >
              $F_Y = 2y$ on $[0, 1/2]$, whose derivative is $2$. Folding the
              stick doubles the density.
          - text: >
              Nothing; a density may exceed $1$.
            feedback: >
              The height $2$ is fine. The trouble is "for all $y > 0$": that
              has infinite area.
          - text: >
              The range: $f_Y = 2$ on $(0, 1/2)$ and $0$ beyond.
            correct: true
            feedback: >
              Right. With the range attached, the area is $2 \cdot 1/2 = 1$.
        feedback: >
          Most CDF-method mistakes are range mistakes, made before the
          calculus starts. In an interview, say the range of $Y$ out loud
          before you solve anything.

  - node: quant-probability.random-variables.transformation
    hook: >
      Once $g$ is monotone the general CDF method collapses into a one-line
      formula — but only after the stretch factor $|g'|$ is divided in
      correctly, which is where the sign and the wrong evaluation point both
      like to slip in.
    explanation: >
      Picture probability mass sitting on the $x$-axis as $f_X(x)\,dx$ in a
      thin slice of width $dx$. A monotone $g$ relabels that slice onto the
      $y$-axis as a slice of width $|g'(x)|\,dx$ around $y=g(x)$ —
      stretching where $|g'|>1$, compressing where $|g'|<1$. Since the actual
      amount of probability in the slice can't change under a relabelling,
      $f_Y(y)\,dy$ must equal $f_X(x)\,dx$, and solving for $f_Y$ divides by
      that local stretch factor.

      This is exactly the monotone special case of the CDF method: because
      $g$ is one-to-one, the set $\{g(X)\le y\}$ is always a single ray in
      $x$ with no casework, which is what lets the formula skip straight to
      differentiation instead of splitting $y$ into ranges first.

      Two bookkeeping habits prevent the common errors: evaluate $f_X$ at
      $x=g^{-1}(y)$, not at $y$ itself, and take the absolute value of the
      derivative, since a decreasing $g$ would otherwise hand back a negative
      "density."
    worked: >
      Let $X$ be uniform on $(0,1)$ and $Y=X^{1/3}$, increasing, so $Y$ also
      ranges over $(0,1)$ with $g^{-1}(y)=y^3$ and $(g^{-1})'(y)=3y^2$. Then
      $f_Y(y)=f_X(y^3)\cdot 3y^2=1\cdot 3y^2=3y^2$ on $(0,1)$ — check:
      $\int_0^1 3y^2\,dy=1$. And $\Pr(Y>0.5)=\int_{0.5}^1 3y^2\,dy=
      \left[y^3\right]_{0.5}^1=1-0.125=0.875$.
    interview: >
      Given a strictly increasing or decreasing $g$, "find the density of
      $Y=g(X)$" is answered directly by the change-of-variables formula — the
      interviewer listens for the stretch-factor intuition stated out loud,
      plus the correct support for $Y$, not just a memorised formula plugged
      in mechanically.
    pitfalls: >
      Dropping the absolute value on $g'$ for a decreasing transform
      produces a negative density, an immediate sign that something's wrong.
      Evaluating $f_X$ at $y$ instead of at $x=g^{-1}(y)$ silently uses the
      wrong input whenever $g$ isn't the identity.
    recap: >
      For strictly monotone $g$,
      $f_Y(y)=f_X(g^{-1}(y))\,|(g^{-1})'(y)|$ — divide by the local stretch
      factor, evaluated at the right point, always as an absolute value.
    dialogue:
      - part: From speed to travel time
        teach: >
          A courier covers $1$ km at a speed $V$ that is uniform on $(1, 3)$
          km per minute, so $f_V = 1/2$ there. The travel time is $T = 1/V$
          minutes, somewhere between $1/3$ and $1$.
      - ask: >
          What is $\Pr(T \le 1/2)$?
        expects: "1/2"
        hint: >
          Translate the condition on $T$ into a condition on $V$.
        feedback: >
          $T \le 1/2$ exactly when $V \ge 2$, which has probability
          $(3 - 2)/2 = 1/2$.
      - ask: >
          For $1/3 \le t \le 1$, what is $F_T(t)$?
        choices:
          - text: >
              $(1/t - 1)/2$
            feedback: >
              That is $\Pr(V \le 1/t)$. Because $1/v$ decreases, $T \le t$
              corresponds to $V \ge 1/t$, the other end.
          - text: >
              $(3 - 1/t)/2$
            correct: true
            feedback: >
              Right: $\Pr(V \ge 1/t) = (3 - 1/t)/2$. At $t = 1/3$ it is $0$
              and at $t = 1$ it is $1$.
          - text: >
              $(t - 1/3)/(2/3)$, uniform on $(1/3, 1)$
            feedback: >
              That would make $\Pr(T \le 1/2) = 1/4$, but you found $1/2$.
              The reciprocal of a uniform is not uniform.
        feedback: >
          The CDF method, as before: the decreasing map flips the inequality,
          so $F_T(t) = 1 - F_V(1/t)$.
      - ask: >
          Differentiate. What is the density of $T$ at $t = 1/2$?
        expects: "2"
        hint: >
          $\frac{d}{dt}(3 - 1/t)/2 = 1/(2t^{2})$.
        feedback: >
          $f_T(t) = 1/(2t^{2})$, so $f_T(1/2) = 1/(2 \cdot 1/4) = 2$. The
          speed's density at the matching point, $v = 2$, was only $1/2$.

      - part: Where the factor of four came from
        reflect: >
          $f_T(1/2) = 2$ while $f_V(2) = 1/2$: four times larger. Take a
          short window of travel times around $1/2$, of width $h$. How wide
          is the matching window of speeds around $2$, and why does that
          explain the four?
        hint: >
          Near $t = 1/2$, how fast does $v = 1/t$ change with $t$?
        answer: >
          $v = 1/t$ has slope $-1/t^{2} = -4$ at $t = 1/2$, so a window of
          width $h$ in $t$ matches a window of width about $4h$ in $v$. The
          two windows are the same event, so they hold the same probability,
          $f_V(2) \cdot 4h = 2h$. Spread over width $h$, that is a density of
          $2$. The density is multiplied by the local stretch factor of the
          inverse map, and the sign of the slope is irrelevant.
      - teach: >
          That is the change-of-variables formula. If $X$ has density $f_X$
          on an interval $I$ and $g$ is strictly monotone and differentiable
          there with $g' \ne 0$, then $Y = g(X)$ has density
          $f_Y(y) = f_X(g^{-1}(y))\,\lvert (g^{-1})'(y) \rvert$ on $g(I)$,
          equivalently $f_X(x)/\lvert g'(x) \rvert$ at $x = g^{-1}(y)$. It is
          the CDF method with the differentiation done once and for all.
      - ask: >
          Use the formula: what is $f_T(0.8)$?
        expects: "0.78125"
        tolerance: 0.0005
        hint: >
          $x = g^{-1}(0.8) = 1.25$ and $\lvert g'(x) \rvert = 1/x^{2}$.
        feedback: >
          $f_V(1.25)/\lvert g'(1.25) \rvert = (1/2)/(1/1.5625) = 0.78125$,
          matching $1/(2 \cdot 0.64)$ from the CDF.
      - ask: >
          Why does the formula carry an absolute value?
        choices:
          - text: >
              For a decreasing $g$, $F_Y(y) = 1 - F_X(g^{-1}(y))$; its
              derivative has two minus signs, which the absolute value
              records.
            correct: true
            feedback: >
              Right. The minus from $1 - F_X$ and the negative slope of
              $g^{-1}$ cancel, and the absolute value lets one formula cover
              both directions.
          - text: >
              To make sure $f_Y$ integrates to $1$.
            feedback: >
              The derivative of a CDF integrates to $1$ automatically. The
              absolute value fixes a sign, not a total.
          - text: >
              It is a convention; the signed version gives the same answers.
            feedback: >
              The signed version gives $f_T(1/2) = -2$, a negative density.
        feedback: >
          Increasing $g$ and decreasing $g$ differ only in the sign of the
          slope, and densities do not care about direction.

      - part: When the map folds
        ask: >
          Now take $Y = \lvert V - 1.5 \rvert$, the gap between the speed and
          $1.5$. What is the density of $Y$ at $y = 0.25$?
        expects: "1"
        hint: >
          How many speeds give $Y = 0.25$? Use the CDF method:
          $\Pr(Y \le y)$ for small $y$.
        feedback: >
          For $y < 0.5$, $\{Y \le y\} = \{1.5 - y \le V \le 1.5 + y\}$, which
          has probability $2y/2 = y$, so $f_Y = 1$ there. Two speeds, $1.25$
          and $1.75$, map to $0.25$, and each contributes $1/2$.
      - ask: >
          A colleague applies the change-of-variables formula to that $Y$ and
          gets $1/2$ at $y = 0.25$. What went wrong?
        choices:
          - text: >
              He used the wrong stretch factor; $\lvert g' \rvert$ is $2$
              here.
            feedback: >
              $g(v) = \lvert v - 1.5 \rvert$ has slope $\pm 1$ away from $1.5$,
              so the stretch factor is $1$. The factor of two comes from
              somewhere else.
          - text: >
              The map is not monotone on $(1, 3)$, so the formula's
              hypothesis fails; he counted one of the two preimages.
            correct: true
            feedback: >
              Right. Where $g$ folds, each $y$ has several preimages and their
              contributions add. Above $y = 0.5$ only one survives, and there
              the density really is $1/2$.
          - text: >
              Nothing: the CDF-method answer of $1$ is the mistake.
            feedback: >
              Check it directly: $\Pr(Y \le 0.25) = \Pr(1.25 \le V \le 1.75)
              = 0.25$, which is what a density of $1$ near $0$ gives.
        feedback: >
          Check monotonicity before reaching for the formula; when it fails,
          fall back on the CDF method. In an interview, saying "density over
          the stretch factor, valid because $g$ is monotone here" shows you
          know both the formula and its hypothesis.

  - node: quant-probability.random-variables.linear-transformation
    hook: >
      This is the one change of variables you'll do without thinking —
      standardising $Z=(X-b)/a$ before reading off a table — so the sign flip
      that appears only when $a<0$ is exactly the detail worth having
      automatic.
    explanation: >
      An affine map is the simplest possible monotone transform: $g'(x)=a$
      is constant, so the stretch factor from the monotone change-of-
      variables formula is the same everywhere, and the density just gets
      divided by $|a|$ and shifted — no pointwise variation to track. That
      constancy is also why the effect on quantiles is so clean: shifting and
      rescaling the whole axis moves every quantile the identical way,
      $a\,q_X(u)+b$, except that a negative $a$ reverses which end of the
      distribution each quantile lands on, exactly what the $q_X(1-u)$ swap
      corrects for.

      The location-scale idea is this closure property elevated to a family:
      if every member of a family of laws is reachable from one reference
      member by shifting and rescaling, then solving one problem — usually
      for the standardised member with $b=0$ and $a=1$ — silently solves it
      for the whole family, since the answer for any other member is a
      shift-and-rescale of the reference answer. This is precisely why one
      table of standard values, looked up after standardising, serves every
      member of the family.
    worked: >
      Let $X$ be uniform on $(0,1)$ and $Y=-3X+5$, so $a=-3<0$, $b=5$. As $X$
      ranges over $(0,1)$, $Y$ ranges over $(2,5)$, decreasing, with density
      $f_Y(y)=\dfrac{1}{3}f_X\!\left(\dfrac{y-5}{-3}\right)=1/3$ on $(2,5)$ —
      still uniform, just stretched to length $3$. The median uses the $a<0$
      quantile rule: $q_Y(0.5)=a\,q_X(1-0.5)+b=-3(0.5)+5=3.5$, the midpoint
      of $(2,5)$ as expected by symmetry, and directly,
      $\Pr(Y<3)=\int_2^3(1/3)\,dy=1/3$.
    interview: >
      The standard application is "given $X$ is normal with mean $\mu$ and
      standard deviation $\sigma$, use the $Z$-table to find
      $\Pr(X<x_0)$" — the interviewer wants the standardisation
      $Z=(X-\mu)/\sigma$ produced automatically, table value looked up, then
      mapped back, with no hesitation over the direction of the shift.
    pitfalls: >
      Using $q_Y(u)=a\,q_X(u)+b$ unconditionally, without the $1-u$ swap when
      $a<0$, silently reverses which quantile you've actually computed.
      Dividing the density by $a$ instead of $|a|$ when $a$ is negative
      produces a formally negative density.
    recap: >
      Affine maps shift and rescale the CDF, quantiles, and density in
      lockstep — dividing the density by $|a|$ and reversing quantile order
      exactly when $a<0$ — which is why one standardised table covers a whole
      location-scale family.
    dialogue:
      - part: Celsius to Fahrenheit
        teach: >
          A weather desk forecasts tomorrow's high $C$, in degrees Celsius,
          with a continuous, strictly increasing CDF: median $20$, $10$th
          percentile $14$, $90$th percentile $25$, and density $f_C(20) = 0.05$
          per degree. A client wants everything in Fahrenheit,
          $H = 1.8C + 32$.
      - ask: >
          What is the median of $H$?
        expects: "68"
        hint: >
          $C \le 20$ and $H \le 1.8 \cdot 20 + 32$ are the same event.
        feedback: >
          $\Pr(H \le 68) = \Pr(C \le 20) = 1/2$, so the median is
          $1.8 \cdot 20 + 32 = 68$.
      - ask: >
          What is the $90$th percentile of $H$?
        expects: "77"
        feedback: >
          $1.8 \cdot 25 + 32 = 77$. An increasing map carries each quantile
          to the matching quantile.
      - ask: >
          What is the density of $H$ at $68$?
        choices:
          - text: >
              $0.05$, the same as for $C$ at $20$.
            feedback: >
              One Fahrenheit degree is only $1/1.8$ of a Celsius degree, so a
              one-degree window in $H$ catches less probability than a
              one-degree window in $C$.
          - text: >
              $0.05 \times 1.8 = 0.09$
            feedback: >
              That has the stretch backwards. A window of width $h$ in $H$ is
              a window of width $h/1.8$ in $C$, holding about $0.05h/1.8$.
          - text: >
              $0.05/1.8 \approx 0.0278$
            correct: true
            feedback: >
              Right. The scale stretches by $1.8$, so the density thins by
              $1.8$; the shift by $32$ changes nothing.
        feedback: >
          Quantiles move with the map; densities divide by the stretch.
      - ask: >
          The desk also publishes a cold index $K = 30 - C$. What is the
          $90$th percentile of $K$?
        choices:
          - text: >
              $30 - 25 = 5$
            feedback: >
              $\Pr(K \le 5) = \Pr(C \ge 25) = 0.1$. A decreasing map sends
              the top of $C$ to the bottom of $K$, so $5$ is the $10$th
              percentile of $K$.
          - text: >
              $30 - 14 = 16$
            correct: true
            feedback: >
              Right. $\Pr(K \le 16) = \Pr(C \ge 14) = 0.9$: the $90$th
              percentile of $K$ comes from the $10$th percentile of $C$.
          - text: >
              $30 + 25 = 55$
            feedback: >
              $K$ is at most $30$ minus a typical temperature; it sits well
              below $30$, never near $55$.
        feedback: >
          The sign of the scale decides which tail maps to which.

      - part: The rule for either sign
        reflect: >
          Write one rule that gives any quantile of $Y = aX + b$ from the
          quantiles of $X$, for $a > 0$ and for $a < 0$, and say what in the
          event $\{aX + b \le y\}$ makes the sign matter.
        hint: >
          Solve $ax + b \le y$ for $x$ when $a$ is negative.
        answer: >
          For $a > 0$, $\{aX + b \le y\} = \{X \le (y - b)/a\}$, so
          $q_Y(u) = a\,q_X(u) + b$. For $a < 0$, dividing by $a$ flips the
          inequality: $\{aX + b \le y\} = \{X \ge (y - b)/a\}$, an upper tail
          of $X$, so $q_Y(u) = a\,q_X(1 - u) + b$. The flip is the whole
          story; with a density the two cases merge into one formula with
          $\lvert a \rvert$.
      - teach: >
          For $Y = aX + b$ with $a \ne 0$: $F_Y(y) = F_X((y - b)/a)$ if
          $a > 0$, and $F_Y(y) = 1 - F_X(((y - b)/a)^{-})$ if $a < 0$. With a
          density, both give $f_Y(y) = f_X((y - b)/a)/\lvert a \rvert$.
          Quantiles are equivariant, with the order reversed for $a < 0$. A
          family closed under these maps is a location–scale family, which
          is why one standard table serves all of it.
      - ask: >
          What is the density of $K = 30 - C$ at $10$?
        expects: "0.05"
        hint: >
          $K = 10$ corresponds to $C = 20$, and $\lvert a \rvert = 1$.
        feedback: >
          $f_K(10) = f_C(20)/\lvert -1 \rvert = 0.05$. A reflection moves the
          density but does not thin it.

      - part: One table for a family
        ask: >
          $U$ is uniform on $(0, 1)$, and a delivery time $D$ is uniform on
          $(10, 50)$ minutes, so $D = 40U + 10$. What is the $0.3$-quantile of
          $D$?
        expects: "22"
        hint: >
          $q_U(0.3) = 0.3$.
        feedback: >
          $q_D(0.3) = 40 \cdot 0.3 + 10 = 22$. Every uniform is a shifted,
          scaled copy of $U$, so its quantiles are $U$'s, mapped.
      - ask: >
          $X$ is a fair die face and $Y = -X$. What is $\Pr(Y \le -3)$?
        expects: "2/3"
        hint: >
          $Y \le -3$ means $X \ge 3$. Is that the same as $X > 3$?
        feedback: >
          $\Pr(X \ge 3) = 4/6 = 2/3$. The tempting $1 - F_X(3) = 1/2$ is
          $\Pr(X > 3)$ and drops the atom at $3$ — which is why the $a < 0$
          formula uses the left limit $F_X(3^{-})$.
      - ask: >
          Why does the proposition insist on $a \ne 0$?
        choices:
          - text: >
              With $a = 0$, $Y = b$ is a constant: an atom of mass $1$, with
              no density, and the formula would divide by $0$.
            correct: true
            feedback: >
              Right. Every quantile of $Y$ is then $b$, and $q_Y(u) = 0 \cdot
              q_X(u) + b$ happens to survive, but $F_Y$ and $f_Y$ cannot be
              read off $X$'s.
          - text: >
              Only for convenience; $a = 0$ gives $f_Y = f_X$.
            feedback: >
              $Y = b$ takes one value with probability $1$. Nothing about it
              resembles $X$'s density.
          - text: >
              Because quantiles are undefined when $a = 0$.
            feedback: >
              Quantiles exist for every law, including a constant: each is
              $b$. What breaks is the density formula.
        feedback: >
          In an interview, "standardise, look it up, map back" is this
          proposition in five words; watch the sign of $a$ when you map back.

  - node: quant-probability.random-variables.pit
    hook: >
      "Why are p-values uniform under the null" is this theorem asked in
      applied language, and its reverse direction is literally how a
      computer turns a stream of uniform random numbers into a sample from
      any distribution you like.
    explanation: >
      The forward direction says $F$ is a universal translator: feed a
      continuous variable through its own CDF and, no matter how unevenly
      $X$'s probability mass is spread out, the result is spread perfectly
      evenly on $(0,1)$. The intuition is that $F$ measures "what fraction of
      $X$'s mass lies at or below this point," and that fraction, by
      construction, moves at a constant rate as you scan through the possible
      values — exactly what being uniform means. Continuity is what makes
      this exact rather than approximate: without it, whole chunks of
      probability sit on single points, and pushing those through $F$
      produces the same jumps in $U$ that were in $X$, rather than smoothing
      them away.

      The reverse direction is the more surprising half: it needs no
      continuity assumption on the target law at all. Feed a uniform
      variable through any quantile function $q$ and the output has exactly
      the CDF $F$ that $q$ came from — this works even to generate discrete
      or mixed samples, since $q$ was built to handle jumps and flats
      gracefully. This asymmetry — forward needs continuity, backward
      doesn't — is what makes simulation universal: one uniform generator,
      run through the right $q$, reaches any law at all.
    worked: >
      Let $X$ have CDF $F(x)=x^2$ on $(0,1)$ (density $f(x)=2x$), and set
      $U=F(X)=X^2$. Directly: $\Pr(U\le 0.3)=\Pr(X^2\le 0.3)=
      \Pr(X\le\sqrt{0.3})=F(\sqrt{0.3})=(\sqrt{0.3})^2=0.3$ — matching
      $\Pr(U\le 0.3)=0.3$ exactly as the uniform law predicts, for a variable
      whose own density was very much not flat.
    interview: >
      The applied phrasing is "why is a p-value uniformly distributed when
      the null hypothesis is true" — answered by naming the test statistic's
      own CDF as the transform, invoking continuity of that CDF under the
      null; the reverse-direction phrasing is "how would you sample from an
      arbitrary distribution given only a uniform random number generator,"
      answered with $q(U)$.
    pitfalls: >
      Applying the forward direction to a variable with any atoms — a
      discrete or mixed law — breaks the theorem, since $F(X)$ then inherits
      the same jumps $X$ had rather than smoothing to uniform. Assuming the
      reverse direction also needs continuity is the opposite mistake:
      $q(U)$ produces the correct law $F$ even when $F$ itself has jumps.
    recap: >
      Push a continuous variable through its own CDF and you always land on
      uniform; push a uniform variable through any quantile function and you
      land on any law you like, continuous or not.
    dialogue:
      - part: Ranking each day against the model
        teach: >
          A server's failure time $X$, in hours, has CDF $F(t) = t^{2}/9$ on
          $[0, 3]$. Each time it fails you record $R = F(X)$, the percentile
          rank of the observed time under the model: $R = 0.3$ means the
          failure came earlier than $70$ percent of what the model expects.
      - ask: >
          What fraction of failures will have rank $R \le 0.25$?
        expects: "1/4"
        hint: >
          $X^{2}/9 \le 0.25$ is a condition on $X$. Solve it.
        feedback: >
          $X^{2}/9 \le 0.25$ means $X \le 1.5$, and $F(1.5) = 2.25/9 = 0.25$.
          So $\Pr(R \le 0.25) = 1/4$.
      - ask: >
          What is $\Pr(R \le 0.64)$?
        expects: "0.64"
        hint: >
          Same move: find the $x$ with $x^{2}/9 = 0.64$.
        feedback: >
          $X \le 2.4$, and $F(2.4) = 5.76/9 = 0.64$. Twice now,
          $\Pr(R \le u) = u$.
      - ask: >
          Now rank the courier's speed $V$, uniform on $(1, 3)$, against its
          own CDF $F_V(v) = (v - 1)/2$. Predict $\Pr(F_V(V) \le 0.64)$.
        choices:
          - text: >
              $0.64$
            correct: true
            feedback: >
              Right: $F_V(V) \le 0.64$ means $V \le 2.28$, which has
              probability $1.28/2 = 0.64$.
          - text: >
              $0.32$, since the speed is spread over an interval of length $2$.
            feedback: >
              The length of the interval is already inside $F_V$. Ranking by
              the variable's own CDF removes every trace of its scale.
          - text: >
              It depends on the shape of the density.
            feedback: >
              The server's density $2t/9$ is far from flat and the speed's is
              flat, and both gave the same answer.
        feedback: >
          A rank computed with the variable's own CDF looks uniform whatever
          the law was.

      - part: Why every rank is uniform
        reflect: >
          For a general continuous CDF $F$, write the chain of equalities
          that turns $\Pr(F(X) \le u)$ into $u$, the one you did twice with
          numbers. Which step needs $F$ to be continuous?
        hint: >
          You solved $F(x) \le u$ for $x$; that is a quantile.
        answer: >
          $\Pr(F(X) \le u) = \Pr(X \le q(u)) = F(q(u)) = u$. The first step
          solves the inequality: $F(x) \le u$ holds for $x$ up to the
          $u$-quantile, give or take a flat stretch of $F$ at level $u$,
          which $X$ lands in with probability $0$. The last step, $F(q(u)) = u$, is where continuity
          enters: $F$ passes through every level with no jump over $u$, so at
          the quantile it hits $u$ exactly.
      - teach: >
          That is the probability integral transform. If $X$ has a continuous
          CDF $F$ — no atoms; $F$ need not be strictly increasing — then
          $F(X)$ is uniform on $[0, 1]$. The converse needs no continuity at
          all: if $U$ is uniform on $(0, 1)$, then $q(U)$ has CDF $F$, since
          $q(U) \le x \iff U \le F(x)$.
      - ask: >
          Which step fails first if $F$ has a jump?
        choices:
          - text: >
              $F(q(u)) = u$: at a jump, $F$ leaps past $u$ and lands above it.
            correct: true
            feedback: >
              Right. If $u$ falls inside a jump, $F(q(u)) > u$ and some levels
              are never taken by $F(X)$ at all.
          - text: >
              $\Pr(X \le q(u)) = F(q(u))$
            feedback: >
              That is the definition of the CDF, true for every law.
          - text: >
              The existence of $q(u)$.
            feedback: >
              $q(u) = \inf\{x : F(x) \ge u\}$ exists for every law, jumps and
              all.
        feedback: >
          Continuity is exactly what makes $F$ hit every level it crosses.

      - part: Where the forward direction breaks
        ask: >
          $X$ is a fair die face, $F$ its staircase CDF. What is
          $\Pr(F(X) \le 0.25)$?
        expects: "1/6"
        hint: >
          $F(X)$ takes only the values $1/6, 2/6, \dots, 1$.
        feedback: >
          $F(X) \le 0.25$ only when $F(X) = 1/6$, that is $X = 1$, with
          probability $1/6$, not $0.25$. $F(X)$ is uniform on six points, not
          on $[0, 1]$: the atoms survive the transform.
      - ask: >
          The reverse direction needs no continuity. To simulate a default
          count $D$ with $\Pr(D = 0) = 0.6$, $\Pr(D = 1) = 0.25$,
          $\Pr(D = 2) = 0.15$, you output $q(U)$. With what probability is the
          output $1$?
        expects: "0.25"
        hint: >
          $q(U) = 1$ for $U$ in the stretch where the staircase sits at
          $0.85$ after passing $0.6$.
        feedback: >
          $q(U) = 1$ exactly when $0.6 < U \le 0.85$, which has probability
          $0.25$. The quantile function cuts $(0, 1)$ into pieces with the
          right lengths, atoms included.
      - ask: >
          Which function turns a uniform $U$ into a failure time with the
          server's CDF $t^{2}/9$?
        choices:
          - text: >
              $U^{2}/9$
            feedback: >
              That is $F$ applied to $U$, the forward direction pointed the
              wrong way. Its values lie in $[0, 1/9]$, not $[0, 3]$.
          - text: >
              $3\sqrt{U}$
            correct: true
            feedback: >
              Right: solve $t^{2}/9 = u$ to get $q(u) = 3\sqrt{u}$. Then
              $\Pr(3\sqrt{U} \le t) = \Pr(U \le t^{2}/9) = t^{2}/9$.
          - text: >
              $3U$
            feedback: >
              That is uniform on $(0, 3)$, with $\Pr(3U \le 1.5) = 1/2$; the
              model says $1/4$.
        feedback: >
          Forward, $F$ turns a continuous law into a uniform; backward, $q$
          turns a uniform into any law. In an interview, "why is a p-value
          uniform under the null" and "how do you sample from $F$ with only a
          uniform generator" are these two directions.

  - node: quant-probability.random-variables.min-max
    hook: >
      Series and parallel systems in a reliability question are literally
      min and max in disguise — recognising that translation and multiplying
      survival functions or CDFs is the whole solution in one line.
    explanation: >
      The translation runs both ways and is worth having automatic: a series
      system works only if every component works, so its lifetime is the
      minimum of the component lifetimes, while a parallel system works if
      any single component works, so its lifetime is the maximum. "All $n$
      survive past $t$" is an intersection of $n$ independent events, and
      independent intersections multiply — that single fact is the entire
      content of both formulas, applied to $F_i(t)$ for the maximum (all
      below $t$) and to $1-F_i(t)$ for the minimum (all above $t$).

      The mnemonic worth keeping is "maxima multiply CDFs, minima multiply
      survival functions" — get the pairing backwards under time pressure and
      the formula for a series system silently becomes the one for a
      parallel system. Independence is not a technicality here; without it
      the intersection of "$X_i\le t$" events doesn't factor into a product
      at all, and the one-line formula is simply unavailable.
    worked: >
      Three independent components have $\Pr(\text{survive past } t_0)=
      0.9,\,0.8,\,0.7$. Wired in series (needs all three), the system
      survives past $t_0$ with probability $0.9\times 0.8\times 0.7=0.504$ —
      the minimum-survival product. Wired in parallel (needs at least one),
      the system survives with probability $1-(0.1)(0.2)(0.3)=1-0.006=0.994$
      — one minus the product of the failure probabilities, which is the
      maximum's CDF-complement written directly.
    interview: >
      The reliability framing — "what's the probability a series/parallel
      system of $n$ independent components is still working" — is asked
      almost verbatim; the interviewer listens for immediate recognition
      that series is the minimum and parallel is the maximum, followed by the
      one-line product, not a case-by-case enumeration.
    pitfalls: >
      Applying the product formula when components share a common point of
      failure (correlated, not independent) silently produces a number with
      no justification, since the intersection no longer factors. Swapping
      which formula goes with series versus parallel — multiplying survival
      probabilities for a parallel system, say — is the classic slip under
      time pressure.
    recap: >
      Series systems are the minimum of independent lifetimes and multiply
      survival probabilities; parallel systems are the maximum and multiply
      CDFs — both from independence alone.
    dialogue:
      - part: Three dice of different sizes
        teach: >
          You roll a four-sided, a six-sided and an eight-sided die together,
          each fair and independent of the others. $M$ is the largest face
          showing and $m$ the smallest.
      - ask: >
          What is $\Pr(M \le 3)$?
        expects: "9/64"
        hint: >
          The largest face is at most $3$ exactly when every face is.
        feedback: >
          All three must show at most $3$: $(3/4)(3/6)(3/8) = 27/192 = 9/64$.
          No list of $192$ outcomes needed.
      - ask: >
          What is $\Pr(M = 3)$?
        expects: "19/192"
        hint: >
          $\Pr(M = 3) = \Pr(M \le 3) - \Pr(M \le 2)$.
        feedback: >
          $\Pr(M \le 2) = (2/4)(2/6)(2/8) = 8/192$, so
          $\Pr(M = 3) = 27/192 - 8/192 = 19/192$. The CDF first, then a
          difference: the point probability of a maximum is a jump of its
          CDF.
      - ask: >
          A colleague computes $\Pr(m \le 3)$, the chance the smallest face is
          at most $3$, as $(3/4)(3/6)(3/8)$. What is wrong?
        choices:
          - text: >
              Nothing: the same product works for the minimum.
            feedback: >
              That product is "every die shows at most $3$", which is
              $\{M \le 3\}$. The smallest face is at most $3$ as soon as one
              die does.
          - text: >
              "The smallest is at most $3$" means "some die shows at most
              $3$", which does not factor; its complement, "every die shows
              more than $3$", does.
            correct: true
            feedback: >
              Right. $\Pr(m > 3) = (1/4)(3/6)(5/8)$, and you subtract that
              from $1$.
          - text: >
              He should add the three probabilities instead.
            feedback: >
              $3/4 + 3/6 + 3/8 > 1$. Adding counts the outcomes where several
              dice are small more than once.
        feedback: >
          "At least one" never factors directly; "all" does, under
          independence.
      - reflect: >
          Say why the maximum's CDF is a product of CDFs and the minimum's
          survival function is a product of survival functions. Translate
          $\{M \le t\}$ and $\{m > t\}$ into statements about every die, and
          say which hypothesis turns the intersection into a product.
        answer: >
          $M \le t$ says every die shows at most $t$:
          $\{M \le t\} = \bigcap_i \{X_i \le t\}$. $m > t$ says every die
          shows more than $t$: $\{m > t\} = \bigcap_i \{X_i > t\}$. Both are
          intersections, and independence turns the probability of an
          intersection into a product. The other two events, $M > t$ and
          $m \le t$, are unions — "some die" — and are reached through the
          complement.

      - part: Maxima multiply CDFs
        teach: >
          For independent $X_1, \dots, X_n$ with CDFs $F_i$: $F_M(t) =
          \prod_i F_i(t)$ and $\Pr(m > t) = \prod_i (1 - F_i(t))$, so
          $F_m(t) = 1 - \prod_i (1 - F_i(t))$. In the iid case,
          $F_M = F^{n}$ and $F_m = 1 - (1 - F)^{n}$, with densities
          $f_M = nF^{n-1}f$ and $f_m = n(1 - F)^{n-1}f$.
      - ask: >
          Back to the three dice: what is $\Pr(m \le 3)$?
        expects: "59/64"
        hint: >
          $\Pr(m > 3) = (1/4)(3/6)(5/8)$.
        feedback: >
          $\Pr(m > 3) = 15/192 = 5/64$, so $\Pr(m \le 3) = 59/64$. The
          four-sided die alone makes a small minimum very likely.
      - ask: >
          Three iid variables have CDF $F(t) = \sqrt{t}$ on $(0, 1)$, so
          $f(t) = 1/(2\sqrt{t})$. What is the density of their maximum at
          $t = 1/4$?
        expects: "3/4"
        hint: >
          $f_M = 3F^{2}f$, with $F(1/4) = 1/2$ and $f(1/4) = 1$.
        feedback: >
          $3 \cdot (1/2)^{2} \cdot 1 = 3/4$. Or differentiate $F_M(t) =
          t^{3/2}$ directly: $(3/2)t^{1/2} = (3/2)(1/2) = 3/4$.

      - part: Where independence did the work
        ask: >
          Now roll one six-sided die and look at its top face $X_1$ and its
          bottom face $X_2 = 7 - X_1$. Each is uniform on $1, \dots, 6$. What
          is $\Pr(\max(X_1, X_2) \le 3)$?
        expects: "0"
        hint: >
          Can both faces be at most $3$?
        feedback: >
          Top and bottom add to $7$, so one of them is at least $4$:
          $\Pr = 0$. The product formula would give $(1/2)(1/2) = 1/4$.
      - ask: >
          Which step of the product formula failed for the top and bottom
          faces?
        choices:
          - text: >
              $\{M \le 3\} = \{X_1 \le 3\} \cap \{X_2 \le 3\}$
            feedback: >
              That identity is about sets and holds for any two variables.
              The maximum is at most $3$ exactly when both are.
          - text: >
              $\Pr(X_1 \le 3) = 1/2$
            feedback: >
              Each face really is uniform; the individual CDFs are right.
          - text: >
              $\Pr(\{X_1 \le 3\} \cap \{X_2 \le 3\}) = \Pr(X_1 \le 3)\Pr(X_2 \le 3)$
            correct: true
            feedback: >
              Right. That factorisation is independence, and top and bottom
              faces are as dependent as two variables can be.
        feedback: >
          The set identity is free; the product is independence. In an
          interview, "maxima multiply CDFs, minima multiply survival
          functions, by independence" is the sentence, and the last two
          words are the ones being listened for.

  - node: quant-probability.random-variables.max-of-uniforms
    hook: >
      This is the standard shape of a "slowest of $n$ requests" or "worst of
      $n$ trials" question, and the headline fact — extremes crowd into the
      last $1/n$ of the range — is worth having as an instant sanity check on
      any answer.
    explanation: >
      Once $F_M=F^n$ is in hand from the general min-max formula, everything
      about the maximum is a matter of plugging into that single expression:
      raise the common CDF to the $n$-th power for a tail probability, and
      invert it — solve $F(t)^n=u$ for $t$ — for any quantile including the
      median.

      The crowding-toward-the-top behaviour is worth understanding, not just
      quoting: checking $F_M(t_0)$ for $t_0$ near the top of the range shows
      the maximum's probability mass concentrating in a shrinking window as
      $n$ grows — raising a number less than $1$ to a growing power drives it
      toward $0$ fast, so only points very near the top keep $F(t)^n$
      non-negligible. This is the general shape behind any "worst of many"
      question: the more independent draws, the tighter the extreme squeezes
      against the boundary.

      The recipe generalises past uniforms immediately: identify $F$ for the
      underlying variable, whatever its shape, and every fact about the
      maximum — tail probability, median, any percentile — follows from
      $F^n$ alone.
    worked: >
      Six users' request latencies are iid uniform on $(0,10)$ ms; let $M$ be
      the slowest. Then $F_M(t)=(t/10)^6$ on $(0,10)$, so
      $\Pr(M>9)=1-0.9^6=1-0.531441=0.468559$. The median solves
      $(t/10)^6=1/2$, giving $t=10\cdot(1/2)^{1/6}\approx 8.909$ ms — already
      close to the top of the range even at just $n=6$.
    interview: >
      "What's the probability the maximum of $n$ iid draws exceeds some
      threshold," or its applied version "the slowest of $n$ requests exceeds
      some latency target," is answered immediately with $1-F(t)^n$; the
      natural follow-up asks for a percentile, solved by inverting
      $F(t)^n=u$.
    pitfalls: >
      Using the minimum's formula $1-(1-F(t))^n$ for a maximum question, or
      vice versa, is the classic slip under time pressure — check which
      extreme is actually asked for before writing anything down. Applying
      $F^n$ to draws that aren't actually independent silently invalidates
      the whole computation.
    recap: >
      $\Pr(M>9)=0.468559$ and the median is about $8.909$ for six
      uniform-$(0,10)$ draws — the maximum's whole law reduces to $F^n$, with
      mass crowding toward the top as $n$ grows.
    dialogue:
      - part: Four bidders
        teach: >
          Four bidders privately value a painting, each value independent and
          uniform on $(0, 100)$ thousand. The auction's result is driven by
          $M$, the highest of the four values.
      - ask: >
          What is the probability that the highest value is above $80$?
        expects: "0.5904"
        tolerance: 0.0005
        hint: >
          Find $\Pr(M \le 80)$ first: every bidder must be at most $80$.
        feedback: >
          $\Pr(M \le 80) = 0.8^{4} = 0.4096$, so $\Pr(M > 80) = 0.5904$. One
          bidder alone clears $80$ only a fifth of the time; four of them
          clear it more often than not.
      - ask: >
          What is the probability that the lowest of the four values is below
          $20$?
        choices:
          - text: >
              $0.2^{4} = 0.0016$
            feedback: >
              That is the chance that all four are below $20$, which is
              $\Pr(M < 20)$. The lowest is below $20$ as soon as one bidder is.
          - text: >
              $0.5904$, the same as for the maximum above $80$.
            correct: true
            feedback: >
              Right. $\Pr(m < 20) = 1 - 0.8^{4}$ — and $100 - X_i$ is uniform
              too, so the lowest value below $20$ mirrors the highest above
              $80$ exactly.
          - text: >
              $4 \times 0.2 = 0.8$
            feedback: >
              Adding the four chances counts twice every outcome where two
              bidders are below $20$. Go through the complement: all four
              above $20$, with probability $0.8^{4}$.
        feedback: >
          The minimum of uniforms is the maximum seen in a mirror; one
          computation serves both.

      - part: Percentiles of the top value
        ask: >
          What is the median of $M$, in thousands? Give two decimal places.
        expects: "84.09"
        tolerance: 0.01
        hint: >
          Solve $(t/100)^{4} = 1/2$.
        feedback: >
          $t = 100 \cdot 2^{-1/4} \approx 84.09$. Half the time the top value
          is above $84$, though each single value is above $84$ only $16$
          percent of the time.
      - ask: >
          What is the $90$th percentile of $M$? Give two decimal places.
        expects: "97.40"
        tolerance: 0.01
        hint: >
          Solve $(t/100)^{4} = 0.9$.
        feedback: >
          $t = 100 \cdot 0.9^{1/4} \approx 97.40$. The top tenth of the law of
          $M$ is squeezed into the last $2.6$ thousand of the range.
      - ask: >
          What is $\Pr(90 < M \le 95)$? Give four decimal places.
        expects: "0.1584"
        tolerance: 0.0005
        hint: >
          $F_M(95) - F_M(90)$.
        feedback: >
          $0.95^{4} - 0.9^{4} = 0.8145 - 0.6561 = 0.1584$. A strip of width
          $5$ near the top holds almost $16$ percent of the maximum's law;
          the same strip holds $5$ percent of a single bidder's.
      - ask: >
          The density of $M$ is $f_M(t) = 4t^{3}/100^{4}$. How many times
          denser is it at $95$ than at $50$? Give three decimal places.
        expects: "6.859"
        tolerance: 0.001
        hint: >
          The constants cancel in the ratio.
        feedback: >
          $(95/50)^{3} = 1.9^{3} = 6.859$. The law of the maximum is piled up
          against the ceiling, the opposite of the flat law of each bidder.

      - part: More bidders, closer to the top
        ask: >
          With $100$ bidders, what is the probability that every value is at
          most $99$?
        expects: "0.3660"
        tolerance: 0.0005
        hint: >
          $0.99^{100}$.
        feedback: >
          $0.99^{100} \approx 0.3660$, close to $e^{-1} \approx 0.3679$. With
          $100$ bidders the top value is above $99$ almost two times in
          three.
      - reflect: >
          With $n$ bidders, roughly how far below $100$ does the highest
          value typically sit, and why does $0.99^{100}$ land so near
          $e^{-1}$?
        hint: >
          Write $99$ as $100(1 - c/n)$ with $c = 1$ and $n = 100$.
        answer: >
          $\Pr(M \le 100(1 - c/n)) = (1 - c/n)^{n}$, which tends to $e^{-c}$
          as $n$ grows. So the gap between the top value and $100$ is of
          order $100/n$: with $100$ bidders, a gap of about $1$. Each extra
          bidder is one more chance to land near the top, and the
          probability that all of them miss a strip of width $100c/n$ settles
          at $e^{-c}$.
      - ask: >
          With $1000$ bidders, roughly where is the median of the top value?
        choices:
          - text: >
              About $99.93$
            correct: true
            feedback: >
              Right: $100 \cdot 2^{-1/1000} \approx 100(1 - \ln 2/1000)
              \approx 99.93$. The gap is about $0.07$, of order $100/n$.
          - text: >
              About $99.0$
            feedback: >
              That is the scale for $100$ bidders. Ten times as many bidders
              shrink the gap tenfold.
          - text: >
              About $50$, since each value is centred there.
            feedback: >
              The median of one bidder's value is $50$. The maximum of a
              thousand is almost never anywhere near it.
        feedback: >
          In an interview: "$F_M = F^{n}$, so $\Pr(M > t) = 1 - (t/100)^{n}$,
          and any percentile comes from inverting $F^{n} = u$" — then add
          that the maximum crowds into the last $1/n$ of the range.

  - node: quant-probability.random-variables.order-statistics
    hook: >
      The $k$-th smallest of $n$ draws is asked about far more than just the
      min or the median — and the same binomial-counting derivation that
      produces the general density also hands you a self-check: setting
      $k=1$ or $k=n$ has to reproduce the min and max formulas already known.
    explanation: >
      The CDF form is the natural generalisation of "the minimum is above
      $t$" or "the maximum is below $t$": $X_{(k)}\le x$ says at least $k$ of
      the $n$ independent draws landed at or below $x$, and each does so with
      probability $F(x)$, so counting how many succeed out of $n$ independent
      Bernoulli trials with that success probability is literally a binomial
      tail — $\sum_{j\ge k}\binom{n}{j}F(x)^{j}(1-F(x))^{n-j}$.

      Differentiating (or arguing directly) gives the density as a three-way
      partition of the sample: one draw sits exactly at $x$ ($n$ choices for
      which one), $k-1$ of the remaining $n-1$ fall below it, and the rest
      fall above — a multinomial count that becomes the coefficient
      $n!/((k-1)!\,(n-k)!)$ multiplying $F(x)^{k-1}(1-F(x))^{n-k}f(x)$.

      Setting $k=n$ collapses this to $nF(x)^{n-1}f(x)$, the maximum's
      density, and $k=1$ collapses it to $n(1-F(x))^{n-1}f(x)$, the
      minimum's — exactly the min-max formulas as special cases, the fast
      way to sanity-check the general coefficient rather than re-deriving it
      from scratch each time.
    worked: >
      Let $X_1,X_2,X_3$ be iid with density $f(x)=2x$ on $(0,1)$, so
      $F(x)=x^2$. The middle order statistic $X_{(2)}$ has density
      $\dfrac{3!}{1!\,1!}F(x)(1-F(x))f(x)=6\cdot x^2(1-x^2)\cdot 2x=
      12x^3-12x^5$ on $(0,1)$ — check: $\int_0^1(12x^3-12x^5)\,dx=3-2=1$.
      Then $\Pr(X_{(2)}>1/2)=\int_{1/2}^1(12x^3-12x^5)\,dx=
      \left[3x^4-2x^6\right]_{1/2}^1=1-(3/16-2/64)=1-5/32=27/32$.
    interview: >
      The general ask — "find the density of the $k$-th smallest of $n$ iid
      draws" — is answered by sketching the binomial-count derivation, not
      reciting the formula from memory, and the interviewer often follows up
      by asking you to check it reduces correctly to the min or max case.
    pitfalls: >
      Swapping $k-1$ and $n-k$ in the exponents is the classic index slip,
      invisible when $k$ happens to make the formula symmetric (like the
      median of an odd sample) but glaring otherwise. Forgetting that $F$
      here need not be uniform — the formula holds for any continuous law,
      not just the textbook uniform case.
    recap: >
      The $k$-th order statistic's density,
      $\dfrac{n!}{(k-1)!(n-k)!}F^{k-1}(1-F)^{n-k}f$, comes from a binomial
      count of draws below the point, and reduces to the known min and max
      formulas at $k=1$ and $k=n$.
    dialogue:
      - part: Six sprinters and a qualifying time
        teach: >
          Six sprinters run independently, each with the same continuous law
          for their time, and each breaks $10.5$ seconds with probability
          $0.3$. A meet needs at least one time under $10.5$; a relay needs
          two.
      - ask: >
          What is the probability that the fastest time is at most $10.5$?
          Four decimal places.
        expects: "0.8824"
        tolerance: 0.0005
        hint: >
          The fastest time is the minimum. Use its survival function.
        feedback: >
          The fastest is above $10.5$ only if all six are:
          $1 - 0.7^{6} = 1 - 0.1176 = 0.8824$.
      - ask: >
          What is the probability that the second-fastest time is at most
          $10.5$? Four decimal places.
        expects: "0.5798"
        tolerance: 0.0005
        hint: >
          The second-fastest is under $10.5$ exactly when at least two
          sprinters are.
        feedback: >
          Count sprinters under $10.5$: that count is binomial with $n = 6$
          and $p = 0.3$. At least two:
          $1 - 0.7^{6} - 6(0.3)(0.7)^{5} = 1 - 0.1176 - 0.3025 = 0.5798$.
      - ask: >
          A colleague offers $\binom{6}{2}(0.3)^{2}(0.7)^{4} \approx 0.3241$
          for that probability. What did he compute?
        choices:
          - text: >
              The right answer; the binomial term for two is the probability
              of the second-fastest being under $10.5$.
            feedback: >
              If three sprinters are under $10.5$, the second-fastest is
              under too. His term leaves out three, four, five and six.
          - text: >
              The probability that exactly two are under $10.5$, which is
              only part of the event.
            correct: true
            feedback: >
              Right. "The second-fastest is under $10.5$" is "at least two
              are", a tail of the binomial, not one term.
          - text: >
              The probability that both of two named sprinters are under.
            feedback: >
              That would be $0.3^{2} = 0.09$. The $\binom{6}{2}$ and
              $0.7^{4}$ make his an "exactly two of six" count.
        feedback: >
          Order statistics turn into counting: $X_{(k)} \le x$ means at least
          $k$ of the $n$ draws are at most $x$, and each is, independently,
          with probability $F(x)$.

      - part: From a count to a density
        reflect: >
          Now the density. For the second-fastest time to land in a tiny
          window $[x, x + dx]$, what has to happen to each of the six
          sprinters, and in how many ways can the sprinters be assigned to
          those roles?
        hint: >
          Three roles: in the window, faster than $x$, slower than $x$.
        answer: >
          Exactly one sprinter in the window (probability about $f(x)\,dx$),
          exactly one faster (probability $F(x)$), and the other four slower
          (probability $(1 - F(x))^{4}$). Pick who is in the window, $6$ ways,
          and who is faster, $5$ ways: $30F(x)(1 - F(x))^{4}f(x)\,dx$. Two
          sprinters in one tiny window is an order smaller and drops out.
      - teach: >
          In general, for $n$ iid draws with CDF $F$ and density $f$, sorted
          $X_{(1)} \le \dots \le X_{(n)}$:
          $\Pr(X_{(k)} \le x) = \sum_{j=k}^{n} \binom{n}{j} F^{j}(1 - F)^{n-j}$,
          and $f_{(k)}(x) = \dfrac{n!}{(k-1)!\,(n-k)!}\,F^{k-1}(1 - F)^{n-k}f$.
          The constant counts the ways to choose who sits at $x$, who falls
          below and who above.
      - ask: >
          At a time $x$ where $F(x) = 0.3$ and $f(x) = 0.8$ per second, what
          is the density of the second-fastest time? Four decimal places.
        expects: "1.7287"
        tolerance: 0.0005
        hint: >
          $30 \cdot 0.3 \cdot 0.7^{4} \cdot 0.8$.
        feedback: >
          $30 \cdot 0.3 \cdot 0.2401 \cdot 0.8 \approx 1.7287$ per second. It
          is more than twice $f(x)$: the second-fastest of six is far more
          likely to sit at a fast time than a single sprinter is.
      - ask: >
          Why is the constant for $n = 6$, $k = 2$ equal to $30$ and not
          $\binom{6}{2} = 15$?
        choices:
          - text: >
              The sprinter at $x$ and the sprinter below it play different
              roles, so choosing them is ordered: $6 \cdot 5 = 30$.
            correct: true
            feedback: >
              Right. $\binom{6}{2}$ would choose an unordered pair and lose
              track of which of the two sits at $x$.
          - text: >
              It should be $15$; the $30$ double counts.
            feedback: >
              Swapping the sprinter at $x$ with the one below gives a
              different configuration, so nothing is counted twice. Check:
              with $15$ the density would integrate to $1/2$.
          - text: >
              The extra factor $2$ accounts for ties.
            feedback: >
              With a continuous law ties have probability $0$. The factor
              comes from the two distinct roles.
        feedback: >
          The constant is a multinomial count, $n!/((k-1)!\,1!\,(n-k)!)$:
          three labelled groups — below, at, above.

      - part: Checking the edges, and the hypotheses
        ask: >
          Put $k = n$ in the density formula. What do you get?
        choices:
          - text: >
              $nF^{n-1}f$, the density of the maximum.
            correct: true
            feedback: >
              Right: $n!/((n-1)!\,0!) = n$ and $(1 - F)^{0} = 1$. The
              minimum comes out at $k = 1$ the same way.
          - text: >
              $F^{n}$, the CDF of the maximum.
            feedback: >
              The formula is a density; $F^{n}$ is what it integrates to.
              Its derivative $nF^{n-1}f$ is what $k = n$ gives.
          - text: >
              $n(1 - F)^{n-1}f$
            feedback: >
              That is the minimum, $k = 1$. At $k = n$ every other draw is
              below, so the power falls on $F$.
        feedback: >
          The extremes are the cases $k = 1$ and $k = n$ of one formula.
      - ask: >
          On a windy day every time is slowed by the same random amount, so
          the six times are no longer independent. Which step breaks?
        choices:
          - text: >
              Nothing; each sprinter still has the same marginal law.
            feedback: >
              Same marginals are not enough. When the wind is strong, all six
              are slow together, and the count under $10.5$ is no longer a
              binomial.
          - text: >
              Only the density formula; the CDF form still holds.
            feedback: >
              The CDF form is where the binomial enters, and the binomial
              needs independence. Both forms fail together.
          - text: >
              The count of sprinters under $x$ stops being binomial, so the
              CDF form and the density both fail.
            correct: true
            feedback: >
              Right. Independence is what multiplies $F^{j}(1 - F)^{n-j}$;
              common shocks destroy it.
        feedback: >
          In an interview, derive the density by the window count — one at
          $x$, $k - 1$ below, $n - k$ above, times the number of ways —
          rather than reciting it; the derivation is what is being checked.

  - node: quant-probability.random-variables.uniform-order-statistics
    hook: >
      Uniform order statistics are the test case every textbook reaches for
      because $F(x)=x$ turns the general order-statistic formula into a pure
      polynomial — and the same simplification hands you a fast
      normalisation check worth knowing.
    explanation: >
      Substituting $F(x)=x$ into the general order-statistic density
      collapses $F^{k-1}(1-F)^{n-k}f$ to $x^{k-1}(1-x)^{n-k}$ exactly, with
      no composition left to untangle — this is why the uniform case is the
      one every formula gets checked against first, and it's also exactly
      the Beta family that reappears once named distributions are covered.

      There's a faster way to confirm such a density integrates to $1$ than
      expanding the polynomial term by term: the Beta integral identity
      $\int_0^1 x^{a-1}(1-x)^{b-1}\,dx=(a-1)!\,(b-1)!/(a+b-1)!$ for positive
      integers $a,b$ cancels the multinomial coefficient out front exactly,
      since that coefficient was built from the same factorials in the first
      place. Reaching for that identity instead of grinding through the
      antiderivative is both faster and less error-prone under time
      pressure.

      The general recipe carries over to any $k$ and $n$, not just the
      symmetric median case: write down the exponents $k-1$ and $n-k$
      directly from "how many of the other draws must fall below" versus
      "above," multiply by the matching multinomial coefficient, and the
      density is complete.
    worked: >
      Four independent uniform-$(0,1)$ draws; find the density of the second
      smallest, $X_{(2)}$. Here $n=4$, $k=2$:
      $f_{(2)}(x)=\dfrac{4!}{1!\,2!}x^{1}(1-x)^{2}=12x(1-x)^2$ on $(0,1)$ —
      check via the Beta identity, $\int_0^1 x(1-x)^2\,dx=1!\,2!/4!=2/24=
      1/12$, and $12\times 1/12=1$ exactly. Then
      $\Pr(X_{(2)}<0.25)=\int_0^{0.25}12x(1-x)^2\,dx=
      \left[6x^2-8x^3+3x^4\right]_0^{0.25}=67/256\approx 0.2617$.
    interview: >
      A direct ask, "what's the density of the second-smallest of four
      uniform draws," is answered by plugging $k=2$, $n=4$ into the general
      formula; a sharp follow-up, "how do you know it integrates to $1$
      without expanding it," is answered by naming the Beta-integral
      cancellation rather than grinding through the antiderivative.
    pitfalls: >
      Misassigning which exponent is $k-1$ and which is $n-k$ is far more
      visible here than in a symmetric-median case, since the two exponents
      are genuinely different numbers. Expanding the polynomial to check
      normalisation, rather than using the Beta-integral shortcut, wastes
      time and invites an arithmetic slip exactly when accuracy matters most.
    recap: >
      Under $F(x)=x$, the general order-statistic density becomes the pure
      polynomial $x^{k-1}(1-x)^{n-k}$ up to a multinomial constant — the Beta
      family — whose normalisation is confirmed fastest by the Beta-integral
      identity, not by expanding.
    dialogue:
      - part: A second-price auction
        teach: >
          Six bidders hold private values, independent and uniform on
          $(0, 1)$ million. The auction is second-price: the highest bidder
          wins and pays the second-highest value, $P$.
      - ask: >
          Sorting the six values from smallest to largest as
          $X_{(1)} \le \dots \le X_{(6)}$, which $k$ makes $P = X_{(k)}$?
        expects: "5"
        feedback: >
          The second-highest of six is the fifth smallest: $P = X_{(5)}$,
          with $k - 1 = 4$ values below it and $n - k = 1$ above.
      - ask: >
          What is $\Pr(P \le 0.9)$? Four decimal places.
        expects: "0.8857"
        tolerance: 0.0005
        hint: >
          $P \le 0.9$ means at least five of the six values are at most
          $0.9$.
        feedback: >
          Exactly five: $6(0.9)^{5}(0.1) = 0.35429$. All six: $0.9^{6} =
          0.53144$. Total $0.8857$.
      - ask: >
          The density of $P$ is $c\,x^{4}(1 - x)$ on $(0, 1)$. What is $c$?
        expects: "30"
        hint: >
          $n!/((k-1)!\,(n-k)!)$ with $n = 6$, $k = 5$.
        feedback: >
          $6!/(4!\,1!) = 720/24 = 30$: choose the bidder at $x$ ($6$ ways)
          and the one above it ($5$ ways).
      - ask: >
          A colleague writes the density as $30x(1 - x)^{4}$. What has he
          done?
        choices:
          - text: >
              Swapped the exponents: his is the density of the second-lowest
              value, $X_{(2)}$.
            correct: true
            feedback: >
              Right. The power on $x$ counts the draws below, $k - 1 = 4$;
              the power on $1 - x$ counts those above, $n - k = 1$.
          - text: >
              Nothing; the two forms are equal.
            feedback: >
              At $x = 0.9$ his gives $30 \cdot 0.9 \cdot 0.0001 = 0.0027$ and
              the right one gives $30 \cdot 0.6561 \cdot 0.1 \approx 1.97$.
              A price near the top is common, not rare.
          - text: >
              Used the wrong constant.
            feedback: >
              The constant $30$ is the same for both, because
              $6!/(4!\,1!) = 6!/(1!\,4!)$. The exponents are the problem.
        feedback: >
          Check exponents by the story: four bidders below the price, one
          above.

      - part: Where the price usually lands
        ask: >
          What is the density of $P$ at $x = 0.8$? Four decimal places.
        expects: "2.4576"
        tolerance: 0.0005
        feedback: >
          $30 \cdot 0.8^{4} \cdot 0.2 = 30 \cdot 0.4096 \cdot 0.2 = 2.4576$.
      - ask: >
          At which $x$ is the density $30x^{4}(1 - x)$ highest?
        expects: "0.8"
        hint: >
          Set the derivative $30(4x^{3} - 5x^{4})$ to $0$.
        feedback: >
          $4x^{3} = 5x^{4}$ gives $x = 4/5$. The most likely price sits at
          $(k - 1)/(n - 1) = 4/5$, which is where the $2.4576$ you just
          computed is the peak.
      - reflect: >
          Without expanding the polynomial, why must $\int_0^1 30x^{4}(1 - x)
          \,dx$ equal $1$? Say it as a statement about the six bidders, and
          what it tells you about $\int_0^1 x^{4}(1 - x)\,dx$.
        hint: >
          The formula came from a count over every way the price can land.
        answer: >
          $30x^{4}(1 - x)\,dx$ is the probability that the fifth-smallest
          value lands in $[x, x + dx]$, and the fifth-smallest lands
          somewhere in $(0, 1)$ for sure, so the total is $1$. Hence
          $\int_0^1 x^{4}(1 - x)\,dx = 1/30 = 4!\,1!/6!$. In general
          $\int_0^1 x^{a}(1 - x)^{b}\,dx = a!\,b!/(a + b + 1)!$, the Beta
          integral, and probability gives it for free.

      - part: The price against the top value
        ask: >
          What is $\Pr(P > 0.9)$, the chance the winner pays more than
          $0.9$ million? Four decimal places.
        expects: "0.1143"
        tolerance: 0.0005
        feedback: >
          $1 - 0.8857 = 0.1143$. The highest value exceeds $0.9$ with
          probability $1 - 0.9^{6} \approx 0.4686$, four times as often: the
          winner usually values the painting at more than $0.9$, but rarely
          pays it.
      - ask: >
          What is the probability that the second-lowest of the six values is
          below $0.1$?
        choices:
          - text: >
              $0.1143$, by mirroring.
            correct: true
            feedback: >
              Right. $1 - X_i$ is uniform too, and it turns the fifth-smallest
              into the second-smallest: $\Pr(X_{(2)} < 0.1) =
              \Pr(X_{(5)} > 0.9)$.
          - text: >
              $1 - 0.9^{6} \approx 0.4686$
            feedback: >
              That is the chance the lowest value is below $0.1$. The
              second-lowest needs at least two values below $0.1$.
          - text: >
              $0.8857$
            feedback: >
              That is $\Pr(X_{(5)} \le 0.9)$, whose mirror is
              $\Pr(X_{(2)} \ge 0.1)$ — the complement of what is asked.
        feedback: >
          For uniforms, $X_{(k)}$ and $1 - X_{(n+1-k)}$ have the same law. In
          an interview: "the price is the fifth of six uniforms, density
          $30x^{4}(1 - x)$, peaking at $0.8$" — then compute what is asked by
          counting how many values fall below the threshold.
