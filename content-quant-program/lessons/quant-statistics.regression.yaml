unit: quant-statistics.regression
opening: >
  Regression is the workhorse of the quant toolkit: one machine — minimize
  squared error — that produces the CAPM beta, the R² on a backtested signal,
  and the shrinkage behind ridge and lasso. This unit builds ordinary least
  squares three times over, as a calculus problem, as a projection, and as a
  covariance ratio, because each view answers a different interview question,
  then turns to what goes wrong in practice: collinear regressors, non-constant
  error variance, an omitted variable, and the reversion that fools you into
  crediting a treatment that did nothing. It closes with regularization, the
  standard fix once least squares alone starts overfitting.
lessons:
  - node: quant-statistics.regression.linear-model
    hook: >
      Interviewers ask "is this still linear regression?" about a fit that
      includes $x^{2}$ or $\log x$, and answering by looking at the shape of
      the curve instead of the parameters gets it wrong.
    explanation: >
      You already know that under squared-error loss the best predictor of
      $y$ from $x$ is the conditional mean $\mathbb{E}[y\mid x]$. The trouble
      is that this function can be anything — a kink, a cliff, a sine wave —
      and estimating an arbitrary function from finite data is hopeless.
      Linear regression is the concession: assume the unknown conditional
      mean is affine in the regressors and accept whatever approximation
      error that assumption costs. Under a bivariate normal law the
      assumption is exact; otherwise you are fitting the best affine
      approximation to a curved truth, which is still often the useful
      answer.

      The word "linear" describes the parameters, not the regressors. Stack a
      column of $x^{2}$, a column of $\log x$, or a column $x_1 x_2$ next to
      $x$ and the fitting problem is unchanged — still a sum of unknown
      coefficients times known numbers. What breaks linearity is a parameter
      entering nonlinearly, as in $y=\beta_0 e^{\beta_1 x}$, where no
      transformation of $x$ turns this back into a weighted sum of columns.
      Every observation becomes a row of the design matrix $X$, whose first
      column is ones for the intercept, and the model reads
      $y=X\beta+\varepsilon$ — the form every later result in this unit is
      built on.
    worked: >
      Fit implied volatility as a function of moneyness $m$ with curvature:
      $\text{ivol}=\beta_0+\beta_1 m+\beta_2 m^{2}+\varepsilon$. As a curve in
      $m$ this is a parabola, but stack columns $(1,m_i,m_i^{2})$ as $X$ and
      the fit is ordinary linear regression in $(\beta_0,\beta_1,\beta_2)$.
      Contrast a decay model $\text{ivol}=\beta_0 e^{-\beta_1 \tau}$: however
      $\tau$ is transformed, $\beta_1$ sits inside an exponent multiplying the
      data, so no column stacking linearizes it — it needs nonlinear least
      squares instead.
    interview: >
      "Regress $y$ on $x$" means fit this affine model by least squares.
      Asked whether a model with a squared or logged term is "still linear
      regression," the tell the interviewer wants is checking the parameters,
      not the shape of the fitted curve.
    pitfalls: >
      Treating "linear" as "the plotted relationship looks like a straight
      line" — a parabola in $x$ can be a linear model and a straight line in
      $\log x$ can come from a nonlinear one. Forgetting the target is a
      conditional mean: the model says nothing about individual $y_i$, only
      about $\mathbb{E}[y\mid x]$.
    recap: >
      Linear regression assumes the conditional mean is affine in the
      parameters, which is compatible with any transformation of the
      regressors themselves.
    dialogue:
      - part: A curved fit for market impact
        teach: >
          A desk models the market impact $y$ of an order, in basis points,
          against its size $q$, in thousands of shares. The proposal is
          $y = \beta_0 + \beta_1 q + \beta_2 q^{2} + \varepsilon$, and a first
          guess at the coefficients is $\beta_0 = 1$, $\beta_1 = 2$,
          $\beta_2 = 0.5$.
      - ask: >
          With those coefficients, what impact does the model predict for an
          order of $q = 4$?
        expects: "17"
        hint: >
          Put $q = 4$ into each of the three terms and add.
        feedback: >
          $1 + 2(4) + 0.5(16) = 1 + 8 + 8 = 17$ basis points.
      - ask: >
          Plotted against $q$, the model is a parabola. A colleague says that
          makes it nonlinear regression, so ordinary least squares is off the
          table. Is that right?
        choices:
          - text: >
              Yes: the fitted curve bends, and a linear model draws a straight
              line.
            feedback: >
              The shape in $q$ is not what the fit sees. Once the data are in,
              $q_i$ and $q_i^{2}$ are fixed numbers on each row; the only
              unknowns are the three $\beta$s, and they enter added up, each
              times a known number.
          - text: >
              No: the prediction $17 = 1 \cdot 1 + 2 \cdot 4 + 0.5 \cdot 16$ is
              a weighted sum of known numbers, with the coefficients as the
              weights.
            correct: true
            feedback: >
              Right. Change $\beta_2$ by $1$ and the prediction at $q = 4$
              moves by exactly $16$, whatever the other coefficients are —
              the unknowns act like coefficients in a linear equation.
          - text: >
              It depends on the data: if the fitted $\beta_2$ is near zero the
              model is linear, otherwise not.
            feedback: >
              Whether a model is linear is decided before any data arrive, by
              how the unknowns enter the formula. A large fitted $\beta_2$
              makes the curve bend more; it does not change the kind of
              fitting problem.
        feedback: >
          The bend lives in the regressor $q^{2}$, which you compute from the
          data. The coefficients still enter one at a time, each multiplying a
          number you already know.
      - reflect: >
          You are about to choose $\beta_0, \beta_1, \beta_2$ from data. As a
          function of those unknowns, what kind of formula is the prediction
          on each row, and why is that the property a fitting procedure cares
          about, rather than the shape of the curve in $q$?
        answer: >
          On row $i$ the prediction is $\beta_0 \cdot 1 + \beta_1 q_i +
          \beta_2 q_i^{2}$: known numbers times unknowns, added. The fitting
          procedure moves the unknowns, never the data, so all it ever sees is
          this weighted sum, and a weighted sum of unknowns is what makes the
          fit a system of linear equations with a closed-form answer. The
          curve's shape in $q$ is a fact about the regressors you chose, and
          you may choose them freely.

      - part: Linear in the coefficients
        teach: >
          That is the linear regression model:
          $y_i = \beta_0 + \beta_1 x_{i1} + \dots + \beta_k x_{ik} + \varepsilon_i$,
          with mean-zero errors $\varepsilon_i$ you never observe. "Linear"
          means linear in the $\beta$s; each $x_{ij}$ may be any number you
          compute from the data — $q$, $q^{2}$, $\log q$, a product of two
          inputs. Write each observation as a row of a design matrix $X$ whose
          first column is all ones, and the whole system reads
          $y = X\beta + \varepsilon$.
      - ask: >
          In the impact model, an order of $6$ thousand shares becomes one row
          of $X$. What number sits in that row's third column?
        expects: "36"
        hint: >
          The columns are, in order, the intercept, $q$ and $q^{2}$.
        feedback: >
          The row is $(1, 6, 36)$: the all-ones intercept entry, then $q = 6$,
          then $q^{2} = 36$. The third column is data, computed before the fit
          ever starts.
      - ask: >
          A colleague proposes a power law instead, $y = \beta_0 q^{\beta_1}$,
          with the noise multiplying rather than adding. Can it be fitted by
          linear regression?
        choices:
          - text: >
              No: $\beta_1$ sits in an exponent, so it is not a weight on a
              known column.
            feedback: >
              True of the formula as written, but you may transform $y$ as
              well as $q$. Take
              logs: $\log y = \log \beta_0 + \beta_1 \log q$ plus log-noise,
              which is a weighted sum of the columns $1$ and $\log q$.
          - text: >
              Yes: take logs, and $\log y = \log \beta_0 + \beta_1 \log q$ is
              linear in $\log \beta_0$ and $\beta_1$.
            correct: true
            feedback: >
              Right. After the transformation every unknown is a weight on a
              column you can compute. Add a constant, $y = \beta_0 + \beta_1
              q^{\beta_2}$, and no transformation untangles $\beta_2$ from the
              column it sits in.
          - text: >
              Yes, as it stands: $q^{\beta_1}$ is just another column.
            feedback: >
              You cannot write that column down until you know $\beta_1$. The
              unknown is inside the regressor, which is exactly what a linear
              model forbids — until logs pull it out.
        feedback: >
          The test is mechanical: after whatever transformation of the data you
          are willing to make, can every unknown be pulled out as a weight on a
          column computed from the data alone?
      - ask: >
          The desk tries a kinked model, $y = \beta_0 + \beta_1 q + \beta_2
          \lvert q - 5 \rvert$, with the kink at $5$ thousand shares. Is it a
          linear regression?
        choices:
          - text: >
              No: a kinked line is not a line.
            feedback: >
              The shape in $q$ is not the test. The kink sits at a known size,
              so $\lvert q_i - 5 \rvert$ is a column of numbers you compute
              before the fit, and $\beta_2$ simply weights it.
          - text: >
              Yes: $\lvert q_i - 5 \rvert$ is a known column, and all three
              coefficients enter as weights.
            correct: true
            feedback: >
              Right. A bent line with a fixed bend is still a linear model in
              its coefficients.
        feedback: >
          Known transformations of the data, however jagged, are just more
          columns.
      - ask: >
          Keep the kinked model, but now the desk wants the kink location
          estimated too: $y = \beta_0 + \beta_1 q + \beta_2 \lvert q - c \rvert$
          with $c$ unknown. Is it still a linear regression?
        choices:
          - text: >
              Yes: it has the same three terms as before.
            feedback: >
              Same terms, different unknowns. Before, $\lvert q_i - 5 \rvert$
              was a number; now $\lvert q_i - c \rvert$ depends on an unknown,
              so you cannot write the column down until you know $c$.
          - text: >
              No: $c$ sits inside a column, so that column cannot be computed
              from the data.
            correct: true
            feedback: >
              Right. Fix $c$ at any trial value and the rest is a linear fit;
              searching over $c$ as well is a nonlinear problem. That is the
              standard way such a model is fitted in practice.
          - text: >
              Yes, as long as $c$ turns out to lie inside the range of the
              observed sizes.
            feedback: >
              Where $c$ ends up does not change how it enters the formula. It
              is inside the absolute value, not a weight on a known column.
        feedback: >
          One formula, two different fitting problems, depending on which
          symbols are data and which are unknowns.

      - part: What the model claims about a single order
        ask: >
          Suppose the coefficients were exactly right, so the model's $17$
          basis points at $q = 4$ is the truth about such orders. Three orders
          of $4$ thousand shares then show impacts of $14$, $19$ and $21$. What
          do these numbers say about the model?
        choices:
          - text: >
              They refute it: the model said $17$, and none of the three is
              $17$.
            feedback: >
              The model never promised $17$ on any single order. Each $y_i$
              carries its own error $\varepsilon_i$; only the errors' mean is
              claimed to be zero.
          - text: >
              Nothing decisive: the model predicts the average impact at
              $q = 4$, and individual orders scatter around it.
            correct: true
            feedback: >
              Right. The target of the model is a conditional mean, so three
              scattered orders are the expected sight. A refutation would need
              orders at $q = 4$ whose average sits persistently away from
              $17$.
          - text: >
              They show the errors are not mean zero, since the three errors
              do not cancel.
            feedback: >
              Three draws of a mean-zero error rarely sum to exactly zero, just
              as three coin flips rarely split evenly. Mean zero is a statement
              about the long-run average, not about every small sample.
        feedback: >
          The model is a statement about $\mathbb{E}[y \mid q]$, not about any
          individual $y$.
      - ask: >
          For those three orders, what is the average of the errors
          $\varepsilon_i = y_i - 17$?
        expects: "1"
        hint: >
          Subtract $17$ from each impact, then average.
        feedback: >
          The errors are $-3$, $2$ and $4$, which sum to $3$, so their average
          is $3/3 = 1$. A small, nonzero average from three draws is exactly
          what mean-zero noise produces.
      - teach: >
          This is why the model is written for the conditional mean. You know
          the best predictor of $y$ under squared error is $\mathbb{E}[y \mid x]$;
          linear regression assumes that function is affine in the chosen
          regressors. Under a bivariate normal law that is exactly true;
          otherwise the fit is the best affine approximation to a curved
          truth, which is still often the useful answer.
      - ask: >
          An interviewer asks: "Is $y = \beta_0 + \beta_1 x + \beta_2 x^{3}$
          linear regression?" Which answer shows you know what the word
          means?
        choices:
          - text: >
              "Yes — it is linear in the $\beta$s; $x^{3}$ is just another
              column of the design matrix."
            correct: true
            feedback: >
              That is the ten-second answer: point at the parameters, then at
              the column. Saying "three columns, ones, $x$ and $x^{3}$" shows
              you could fit it.
          - text: >
              "No — a cubic in $x$ is a curve, not a line."
            feedback: >
              This answers a question about the plot. The interviewer is
              checking whether you look at the parameters, and here each one
              multiplies a known column.
          - text: >
              "Only if $x$ is small enough that the cubic term is negligible."
            feedback: >
              Size of $x$ changes how much the cubic term matters, not whether
              the coefficients enter linearly. They do for every $x$.
        feedback: >
          Look at the parameters, not the curve: a model is linear regression
          when it is a sum of unknown coefficients times known columns.

  - node: quant-statistics.regression.least-squares
    hook: >
      "Why minimize squared error and not absolute error?" is a standard
      follow-up, and "that's just what everyone does" does not survive it.
    explanation: >
      Given the linear model, you still need a rule for picking $b$ from
      data. Least squares chooses the $b$ minimizing the residual sum of
      squares $S(b)=\lVert y-Xb\rVert^{2}$, and three reasons make that
      particular criterion the default. First, $S$ is a convex quadratic in
      $b$: differentiate once, set the gradient to zero, and the stationary
      point is automatically the global minimum, with no local traps and no
      numerical search needed. Second, squared error is exactly the loss
      under which the conditional mean is the optimal predictor, so
      minimizing it targets the same $\mathbb{E}[y\mid x]$ the model assumes.
      Third, it produces a closed form, which absolute-error fitting does
      not.

      The cost of squaring is that large residuals are punished
      quadratically, so a single outlier can drag the whole fit toward
      itself — vertical distance only, which is also why regressing $y$ on
      $x$ and $x$ on $y$ give different lines. Minimizing
      $\sum_i \lvert y_i-b'x_i\rvert$ instead targets the conditional median
      rather than the mean, resists outliers far better, but has no closed
      form and needs an iterative solve. Knowing this trade explicitly is
      what separates "I use OLS" from "I chose OLS."
    worked: >
      Four points $(1,2),(2,4),(3,6),(4,20)$: the first three lie exactly on
      $y=2x$, and the fourth is an outlier. Least squares distorts the whole
      line to accommodate it, giving slope $28/5=5.6$ and intercept $-6$ — a
      fit that badly misses the first three points to shrink the fourth
      residual. Minimizing absolute deviations is satisfied by $y=2x$ itself:
      three residuals of $0$ and one of $12$, total absolute error $12$, and
      no nearby line does better, since nudging the line to shave the
      outlier's residual costs more at the other three points than it saves.
      Squared error would never accept that trade; absolute error does.
    interview: >
      "Why squared error, not absolute error?" tests whether you know the
      convexity and closed-form arguments, not just "least squares is
      standard." A follow-up, "what if my data has outliers?", is fishing for
      the median-robustness trade-off.
    pitfalls: >
      Assuming least squares is the only sensible loss. Forgetting that
      regressing $y$ on $x$ gives a different line than regressing $x$ on $y$
      because only vertical distance is penalized.
    recap: >
      Squared error is chosen for convexity, agreement with the conditional
      mean, and a closed form, at the cost of outlier sensitivity that
      absolute error would avoid.
    dialogue:
      - part: Three points and a crowd of lines
        teach: >
          Three days of data, signal $x$ against next-day return $y$:
          $(0, 1)$, $(1, 3)$ and $(2, 2)$. Analyst A draws the line
          $\hat{y} = 1.5 + 0.5x$. Analyst B draws the flat line $\hat{y} = 2$.
          Each says theirs is the better fit.
      - ask: >
          Measure line A's misses vertically, $y_i - \hat{y}_i$, keeping their
          signs. What do the three misses add up to?
        expects: "0"
        hint: >
          Line A predicts $1.5$, $2$ and $2.5$ at $x = 0, 1, 2$.
        feedback: >
          The misses are $1 - 1.5 = -0.5$, $3 - 2 = 1$ and $2 - 2.5 = -0.5$,
          which sum to $0$. Line B's misses, $-1$, $1$ and $0$, also sum to
          $0$.
      - ask: >
          Analyst C, to make a point, proposes the absurd line
          $\hat{y} = -8 + 10x$. What do its signed misses add up to?
        expects: "0"
        hint: >
          It predicts $-8$, $2$ and $12$.
        feedback: >
          The misses are $1 - (-8) = 9$, $3 - 2 = 1$ and $2 - 12 = -10$, and
          $9 + 1 - 10 = 0$. Any line through the average point $(1, 2)$ has
          signed misses summing to zero, however badly it fits.
      - reflect: >
          Signed misses let an absurd line score as well as a sensible one,
          because a big miss above cancels a big miss below. What would you do
          to each miss before adding them, so that no line can hide its
          errors — and is there more than one way to do it?
        answer: >
          Make every miss count as a cost whatever its sign: add up
          $\lvert y_i - \hat{y}_i \rvert$, or add up $(y_i - \hat{y}_i)^{2}$.
          Either way line C's $9$ and $-10$ now cost a lot instead of
          cancelling. The two choices are genuinely different criteria — they
          can rank the same lines differently and pick different winners —
          so choosing between them is a modelling decision, not a detail.

      - part: Squares, or absolute values
        ask: >
          Square line A's three misses and add them. What is the total?
        expects: "1.5"
        hint: >
          The misses are $-0.5$, $1$ and $-0.5$.
        feedback: >
          $0.25 + 1 + 0.25 = 1.5$.
      - ask: >
          The same total for line B, whose misses are $-1$, $1$ and $0$?
        expects: "2"
        feedback: >
          $1 + 1 + 0 = 2$. Under squared error A wins, $1.5$ against $2$.
      - ask: >
          Now add up absolute misses instead. Which line wins?
        choices:
          - text: >
              Line A, since it also won on squares.
            feedback: >
              A's absolute misses are $0.5 + 1 + 0.5 = 2$; B's are
              $1 + 1 + 0 = 2$. The criteria do not have to agree, and here
              they do not.
          - text: >
              Line B, because it hits one point exactly.
            feedback: >
              One exact hit is worth $0$ to B, but its other two misses are a
              full unit each. Total $2$ — the same as A's.
          - text: >
              Neither: they tie at $2$.
            correct: true
            feedback: >
              Right. A spreads its error as $0.5$, $1$, $0.5$; B concentrates
              it as $1$, $1$, $0$. Squaring penalizes the concentrated version
              more, so only squared error breaks the tie.
        feedback: >
          Squaring punishes large misses disproportionately: a miss of $1$
          costs four times a miss of $0.5$, where absolute error charges only
          twice as much.
      - teach: >
          Ordinary least squares picks the coefficients $b$ that minimize the
          residual sum of squares
          $S(b) = \sum_i (y_i - b_0 - b_1 x_{i1} - \dots - b_k x_{ik})^{2} = \lVert y - Xb \rVert^{2}$.
          Three reasons make squares the default. $S$ is a convex quadratic in
          $b$, so a stationary point is the global minimum, unique when the
          columns of $X$ are independent. Squared error is the loss under
          which the conditional mean is the best predictor, so the fit aims at
          the same $\mathbb{E}[y \mid x]$ the model describes. And it gives a
          closed form. Minimizing absolute misses instead aims at the
          conditional median and has no closed form.

      - part: What squaring costs
        ask: >
          A fourth day arrives at $(3, 9)$. Line A predicts $3$ there. How much
          does this one day add to line A's sum of squares?
        expects: "36"
        feedback: >
          The miss is $9 - 3 = 6$, and $6^{2} = 36$ — on top of $1.5$ from the
          first three days put together.
      - ask: >
          What share of line A's total cost does the new day carry, under
          squares and under absolute values?
        choices:
          - text: >
              About the same under both, since it is one day of four.
            feedback: >
              Under squares it is $36$ of $37.5$, about $96$ percent; under
              absolute values it is $6$ of $8$, $75$ percent. One day of four
              dominates both totals, and squares more.
          - text: >
              About $96$ percent under squares, $75$ percent under absolute
              values.
            correct: true
            feedback: >
              Right: $36/37.5 = 0.96$ and $6/8 = 0.75$. A least-squares fit
              will tilt hard toward that one point to shrink its square, which
              is why one bad print can move an OLS line and barely move an
              absolute-error fit.
          - text: >
              Less under squares, because squaring a miss below $1$ shrinks
              it.
            feedback: >
              True for misses below $1$, and that is exactly the problem: the
              small misses shrink while the miss of $6$ becomes $36$. The
              share of the big miss grows.
        feedback: >
          The price of convexity and a closed form is sensitivity to outliers.
          The absolute-error fit trades those conveniences for robustness.
      - ask: >
          A colleague fits the same data with the roles swapped, regressing
          signal on return. What does that fit minimize?
        choices:
          - text: >
              The same squared distances, so it gives the same line.
            feedback: >
              Least squares only ever measures misses in the variable being
              predicted. Swap the roles and it measures in a different
              direction, so the line is different in general.
          - text: >
              The squared perpendicular distances to the line.
            feedback: >
              Neither regression uses perpendicular distance. That criterion
              exists (total least squares), but it is a third problem.
          - text: >
              The squared horizontal distances, misses in $x$ — a different
              problem with a different answer.
            correct: true
            feedback: >
              Right. "Return on signal" and "signal on return" penalize
              different distances, and the two lines coincide only when the
              points lie exactly on one line.
        feedback: >
          Only vertical distance in the predicted variable is penalized, which
          makes regression asymmetric in its two variables.
      - ask: >
          An interviewer asks: "Why squared error rather than absolute
          error?" Which answer earns the follow-up rather than ending the
          conversation?
        choices:
          - text: >
              "Because that is the standard method."
            feedback: >
              It is the answer the question exists to catch. Standard is a
              reason only once you can say why it became standard.
          - text: >
              "Squares give a convex objective with a closed form and target
              the conditional mean; absolute error targets the median and is
              more robust to outliers, at the cost of an iterative solve."
            correct: true
            feedback: >
              That names the trade on both sides, which is what the follow-up
              about outliers is fishing for.
          - text: >
              "Absolute error can be negative, so it cannot be minimized."
            feedback: >
              Absolute values are never negative. Absolute error is minimized
              all the time; it just lacks a closed form.
        feedback: >
          Convexity, the conditional mean and a closed form on one side;
          robustness and the median on the other.

  - node: quant-statistics.regression.ols
    hook: >
      "Derive OLS on the whiteboard" is the single most common quant-stats
      interview task, and stalling at "set the gradient to zero" without
      finishing the algebra loses the point.
    explanation: >
      Differentiating $S(b)=\lVert y-Xb\rVert^{2}$ with respect to $b$ gives
      the gradient $-2X'(y-Xb)$; the least-squares objective is convex, so
      setting this to zero and solving is guaranteed to land on the global
      minimizer. That equation is $X'X\hat\beta=X'y$, the normal equations,
      solved by $\hat\beta=(X'X)^{-1}X'y$ whenever $X$ has full column rank.

      For a single regressor the two normal equations split apart cleanly.
      The first, $\sum_i(y_i-\hat\beta_0-\hat\beta_1 x_i)=0$, says the
      residuals average to zero, which forces the fitted line through
      $(\bar x,\bar y)$ — a useful check on any hand computation. Substituting
      $\hat\beta_0=\bar y-\hat\beta_1\bar x$ into the second normal equation
      and solving for $\hat\beta_1$ reduces the whole derivation to a recipe:
      centre both variables around their means, form the cross-products, and
      divide by the sum of squared deviations in $x$.
    worked: >
      Data $x=1,2,3,4,5$ and $y=2,4,5,4,5$: means $\bar x=3$, $\bar y=4$.
      Centre both and form the cross-products
      $(-2)(-2)+(-1)(0)+(0)(1)+(1)(0)+(2)(1)=6$, and the squared deviations
      $\sum_i(x_i-\bar x)^{2}=4+1+0+1+4=10$. The slope is $6/10=0.6$, and the
      intercept follows from $\hat\beta_0=\bar y-\hat\beta_1\bar x
      =4-0.6(3)=2.2$ — exactly the recipe the normal equations reduce to by
      hand.
    interview: >
      Be able to reproduce the gradient-to-normal-equations derivation cold,
      then reduce it to the centred-cross-product recipe the moment a single
      regressor is on the table.
    pitfalls: >
      Forgetting $X$ needs full column rank for $(X'X)^{-1}$ to exist. Losing
      the minus sign in the gradient, or forgetting the first normal equation
      forces the fit through $(\bar x,\bar y)$ — a free sanity check most
      candidates skip.
    recap: >
      Setting the gradient of the squared-error objective to zero gives the
      normal equations $X'X\hat\beta=X'y$, which for one regressor reduces to
      centre, cross-multiply, divide.
    dialogue:
      - part: Fitting a line by trial
        teach: >
          Three fills from one afternoon: order sizes $x = 1, 3, 5$ (thousand
          shares) and slippage $y = 2, 3, 7$ (basis points). You want the line
          $\hat{y} = b_0 + b_1 x$ with the smallest sum of squared misses
          $S(b_0, b_1)$.
      - ask: >
          Start crude: the flat line $\hat{y} = 4$, which ignores size. What
          is its $S$?
        expects: "14"
        hint: >
          The misses are $y_i - 4$.
        feedback: >
          The misses are $-2$, $-1$ and $3$, so $S = 4 + 1 + 9 = 14$.
      - ask: >
          Now fix the slope at $b_1 = 1$ and choose only the intercept. Which
          $b_0$ minimizes $S$?
        expects: "1"
        hint: >
          With the slope fixed, $y_i - x_i$ is a column of known numbers, and
          you are fitting a single constant to it.
        feedback: >
          The leftovers $y_i - x_i$ are $1$, $0$ and $2$. The constant that
          minimizes squared misses to them is their mean, $1$: set
          $dS/db_0 = -2\sum_i (y_i - x_i - b_0) = 0$ and solve.
      - ask: >
          Same question with the slope fixed at $b_1 = 2$. Which $b_0$ is
          best?
        expects: "-2"
        feedback: >
          The leftovers $y_i - 2x_i$ are $0$, $-3$ and $-3$, with mean $-2$.
          In both cases the best intercept is $\bar{y} - b_1 \bar{x}$:
          $4 - 1 \cdot 3 = 1$ and $4 - 2 \cdot 3 = -2$.
      - ask: >
          The two lines $\hat{y} = 1 + x$ and $\hat{y} = -2 + 2x$ are each the
          best possible for their slope. What do they have in common?
        choices:
          - text: >
              Nothing in particular; they have different slopes and
              intercepts.
            feedback: >
              Evaluate both at $x = 3$: $1 + 3 = 4$ and $-2 + 6 = 4$. They
              cross at a point you have met before.
          - text: >
              Both pass through $(\bar{x}, \bar{y}) = (3, 4)$.
            correct: true
            feedback: >
              Right. Choosing the intercept optimally forces the misses to
              average zero, which is the same as putting the line through the
              point of means. That holds for every slope, the best one
              included.
          - text: >
              Both have the same $S$, so the slope does not matter.
            feedback: >
              Line $1 + x$ has misses $0, -1, 1$ and $S = 2$; line
              $-2 + 2x$ has misses $2, -1, -1$ and $S = 6$. The slope matters a
              lot.
        feedback: >
          One condition is down: the best line goes through $(\bar{x}, \bar{y})$.
          The slope is still free.

      - part: Two derivatives, two equations
        reflect: >
          You pinned the intercept by setting the derivative of $S$ in $b_0$
          to zero. What would you do to pin the slope as well, and how many
          equations would you then be solving at once?
        hint: >
          $S$ is a function of two unknowns.
        answer: >
          Set the derivative in $b_1$ to zero too and solve both conditions
          together: two linear equations in two unknowns. Because $S$ is a
          convex quadratic, the point where both partial derivatives vanish is
          the global minimum, so there is no need to search over slopes one at
          a time.
      - teach: >
          In matrix form the gradient of $S(b) = \lVert y - Xb \rVert^{2}$ is
          $-2X'(y - Xb)$, and setting it to zero gives the normal equations
          $X'X\hat{\beta} = X'y$, so $\hat{\beta} = (X'X)^{-1}X'y$ whenever $X$
          has full column rank. With one regressor and an intercept they are
          two equations: $\sum_i (y_i - \hat{\beta}_0 - \hat{\beta}_1 x_i) = 0$,
          the condition you just found, and
          $\sum_i x_i (y_i - \hat{\beta}_0 - \hat{\beta}_1 x_i) = 0$.
      - ask: >
          Substitute $\hat{\beta}_0 = \bar{y} - \hat{\beta}_1 \bar{x}$ into the
          second equation and solve. Writing $\tilde{x}_i = x_i - \bar{x}$ and
          $\tilde{y}_i = y_i - \bar{y}$, what comes out?
        choices:
          - text: >
              $\hat{\beta}_1 = \sum_i x_i y_i / \sum_i x_i^{2}$
            feedback: >
              That is the slope of a line forced through the origin. It ignores
              the intercept, and on this data gives $46/35 \approx 1.31$
              instead of the true answer.
          - text: >
              $\hat{\beta}_1 = \sum_i \tilde{x}_i \tilde{y}_i / \sum_i \tilde{x}_i^{2}$
            correct: true
            feedback: >
              Right. After substituting, the bracket is
              $\tilde{y}_i - \hat{\beta}_1 \tilde{x}_i$, which sums to zero, so
              the leading $x_i$ can be replaced by $\tilde{x}_i$ for free:
              $\sum_i \tilde{x}_i(\tilde{y}_i - \hat{\beta}_1 \tilde{x}_i) = 0$.
              It is a regression through the origin on centred data.
          - text: >
              $\hat{\beta}_1 = \sum_i \tilde{y}_i / \sum_i \tilde{x}_i$
            feedback: >
              Centred values always sum to zero, so this is $0/0$. The slope
              needs the products of the deviations, not their sums.
        feedback: >
          Centre both variables, form the cross-products, divide by the sum of
          squared deviations in $x$. That is the whole hand recipe.

      - part: Centre, cross-multiply, divide
        ask: >
          Run the recipe on the three fills. What is $\hat{\beta}_1$?
        expects: "1.25"
        hint: >
          $\bar{x} = 3$ and $\bar{y} = 4$, so the centred values are
          $-2, 0, 2$ and $-2, -1, 3$.
        feedback: >
          Cross-products: $(-2)(-2) + (0)(-1) + (2)(3) = 4 + 0 + 6 = 10$.
          Squared deviations: $4 + 0 + 4 = 8$. Slope $10/8 = 1.25$ basis
          points per thousand shares.
      - ask: >
          And the intercept $\hat{\beta}_0$?
        expects: "0.25"
        feedback: >
          $\hat{\beta}_0 = \bar{y} - \hat{\beta}_1 \bar{x} = 4 - 1.25(3) = 0.25$.
      - ask: >
          Check it against the trial lines: what is $S$ for
          $\hat{y} = 0.25 + 1.25x$?
        expects: "1.5"
        hint: >
          The fitted values are $1.5$, $4$ and $6.5$.
        feedback: >
          Misses $0.5$, $-1$ and $0.5$, so $S = 0.25 + 1 + 0.25 = 1.5$ —
          against $14$ for the flat line, $2$ for $1 + x$ and $6$ for
          $-2 + 2x$. No line does better.

      - part: When the inverse does not exist
        ask: >
          For these fills the design matrix has rows $(1, 1)$, $(1, 3)$,
          $(1, 5)$, so $X'X$ has entries $n = 3$, $\sum_i x_i = 9$ and
          $\sum_i x_i^{2} = 35$. What is its determinant?
        expects: "24"
        hint: >
          The $2 \times 2$ matrix is $3, 9$ on top and $9, 35$ below.
        feedback: >
          $3 \cdot 35 - 9 \cdot 9 = 105 - 81 = 24$, which equals
          $n\sum_i (x_i - \bar{x})^{2} = 3 \cdot 8$. Nonzero, so the inverse
          exists and the slope is unique.
      - ask: >
          Suppose instead all three fills had been $3$ thousand shares, with
          the same slippages. What happens to the fit?
        choices:
          - text: >
              The slope comes out $0$: size does not vary, so it has no
              effect.
            feedback: >
              The recipe gives $0/0$, not $0$. Every line through $(3, 4)$
              fits equally well — slope $0$, slope $10$, anything — because the
              data never say what happens at another size.
          - text: >
              $X'X$ is singular: the size column is $3$ times the ones column,
              and the slope is not determined.
            correct: true
            feedback: >
              Right. The determinant is $n\sum_i (x_i - \bar{x})^{2} = 0$, the
              columns are dependent, and the normal equations have infinitely
              many solutions. Full column rank is exactly what was missing.
          - text: >
              Least squares still works, but the slope is very imprecise.
            feedback: >
              Very imprecise is what nearly constant sizes give. Exactly
              constant sizes give no unique answer at all.
        feedback: >
          The derivation needs one hypothesis, full column rank, and in simple
          regression that means the $x$ values are not all equal.
      - teach: >
          In an interview, write $S(b)$, differentiate to $-2X'(y - Xb)$, set
          it to zero, and say "normal equations, invertible when $X$ has full
          column rank". If the question has one regressor, switch at once to
          the recipe and say out loud that the line passes through the means.

  - node: quant-statistics.regression.fitted-residuals
    hook: >
      Mixing up "residual" and "error" is the standard slip, and it is the
      difference between something you computed and something you can never
      observe.
    explanation: >
      Once $\hat\beta$ solves the normal equations, the fitted values are
      $\hat y=X\hat\beta$ and the residuals are $e=y-\hat y$. Keep $e_i$ and
      $\varepsilon_i$ apart: $e_i$ is observed and produced by your fit,
      $\varepsilon_i$ is unobservable and produced by the world, and
      conflating the two is the most common terminology error in the
      subbranch.

      The normal equations say exactly $X'e=0$, so with an intercept in the
      model $\sum_i e_i=0$, $\sum_i x_{ij}e_i=0$ for every regressor $j$, and
      hence $\sum_i \hat y_i e_i=0$. That orthogonality is arithmetic, not an
      assumption — it holds even when the model is badly misspecified — which
      is why you can never test whether the true errors are uncorrelated with
      the regressors by correlating the residuals with them; the residuals
      are guaranteed orthogonal regardless. The error variance is estimated
      by $\hat\sigma^{2}=\sum_i e_i^{2}/(n-k-1)$, dividing by the degrees of
      freedom left after estimating $k+1$ coefficients.
    worked: >
      Continue the previous fit ($\hat\beta_0=2.2,\hat\beta_1=0.6$ on
      $x=1,\dots,5$). Fitted values are $2.8,3.4,4.0,4.6,5.2$, so residuals
      are $-0.8,0.6,1.0,-0.6,-0.2$. They sum to $0$, confirming $\sum_i
      e_i=0$. Squaring and summing gives $\sum_i e_i^{2}=2.4$; with $n=5$ and
      $k=1$ regressor, $\hat\sigma^{2}=2.4/(5-1-1)=0.8$.
    interview: >
      Asked "how would you check if the errors are correlated with $x$,"
      correlating the residuals with $x$ is a trap answer — that correlation
      is exactly zero by construction, so it tests nothing.
    pitfalls: >
      Treating residual orthogonality to the regressors as evidence the
      exogeneity assumption holds — it is mechanical, true even under
      misspecification. Dividing by $n$ instead of $n-k-1$ when estimating
      the error variance, which biases the estimate downward.
    recap: >
      Fitted values and residuals split $y$ by construction, with residuals
      exactly orthogonal to every regressor — arithmetic, never evidence.
    dialogue:
      - part: Two kinds of leftover
        teach: >
          A simulation where you know the truth: $y = 0.5 + x + \varepsilon$.
          Four draws come out as $x = 1, 2, 3, 4$ and $y = 1, 4, 3, 6$. You
          fit a line to those four points without being told the truth, and
          least squares returns $\hat{y} = 1.4x$, intercept $0$.
      - ask: >
          At $x = 2$, how far is the observed $y$ above the fitted line?
        expects: "1.2"
        feedback: >
          The fitted value is $1.4 \cdot 2 = 2.8$, and $4 - 2.8 = 1.2$.
      - ask: >
          At the same point, how far is the observed $y$ above the true line
          $0.5 + x$?
        expects: "1.5"
        feedback: >
          The true line gives $0.5 + 2 = 2.5$, and $4 - 2.5 = 1.5$. Two
          different leftovers for the same observation.
      - ask: >
          Outside a simulation, which of those two numbers could you actually
          compute?
        choices:
          - text: >
              The $1.5$, since the true line is what the model is about.
            feedback: >
              The true line needs $\beta_0$ and $\beta_1$, which no one hands
              you. Outside a simulation the $1.5$ is unknowable.
          - text: >
              The $1.2$: it needs only the data and the fitted line.
            correct: true
            feedback: >
              Right. The $1.2$ is produced by your fit; the $1.5$ is produced
              by the world and stays hidden.
          - text: >
              Both: with enough data the fitted line equals the true one.
            feedback: >
              With enough data the fitted line gets close to the true one, but
              on these four points it is $1.4x$, not $0.5 + x$, and the two
              leftovers differ.
        feedback: >
          The fitted values are $\hat{y} = X\hat{\beta}$ and the residuals are
          $e = y - \hat{y}$, observed and produced by the fit. The errors
          $\varepsilon_i$ are unobservable and produced by the world.
          Conflating the two is the standard slip.

      - part: Sums that come out zero
        ask: >
          The four residuals are $-0.4$, $1.2$, $-1.2$ and $0.4$. What is
          their sum?
        expects: "0"
        feedback: >
          $-0.4 + 1.2 - 1.2 + 0.4 = 0$.
      - ask: >
          The four true errors are $y_i - (0.5 + x_i)$. What is their sum?
        expects: "2"
        hint: >
          The true line gives $1.5$, $2.5$, $3.5$ and $4.5$.
        feedback: >
          The errors are $-0.5$, $1.5$, $-0.5$ and $1.5$, summing to $2$.
          Mean-zero errors do not have to sum to zero in a sample of four.
      - reflect: >
          The errors summed to $2$; the residuals summed to exactly $0$. Would
          the residuals have summed to zero for any data at all? Where does
          the zero come from?
        hint: >
          Think about the condition that picked the intercept.
        answer: >
          Always, whenever the model has an intercept. The fit chose
          $\hat{\beta}_0$ by setting the derivative of the squared misses in
          $b_0$ to zero, and that derivative is $-2\sum_i e_i$. The zero is a
          property of the fitting procedure, not of the world. The second
          normal equation does the same for $\sum_i x_i e_i$.
      - teach: >
          The normal equations say exactly $X'e = 0$: the residuals are
          orthogonal to every column of $X$. With an intercept that means
          $\sum_i e_i = 0$ and $\sum_i x_{ij} e_i = 0$ for every regressor $j$,
          and since $\hat{y}$ is a combination of those columns,
          $\sum_i \hat{y}_i e_i = 0$ as well. None of this is an assumption —
          it is arithmetic, true even for a badly wrong model.
      - ask: >
          Check the second condition on the four residuals: what is
          $\sum_i x_i e_i$?
        expects: "0"
        feedback: >
          $1(-0.4) + 2(1.2) + 3(-1.2) + 4(0.4) = -0.4 + 2.4 - 3.6 + 1.6 = 0$.
      - ask: >
          In this sample the true errors have $\sum_i x_i \varepsilon_i = 7$.
          Could any computation on the residuals have revealed that the
          errors lean with $x$?
        choices:
          - text: >
              Yes: correlate the residuals with $x$ and look for a nonzero
              value.
            feedback: >
              You just computed $\sum_i x_i e_i = 0$, and it will be zero for
              every data set. A check that cannot come out nonzero cannot
              detect anything.
          - text: >
              No: the fit absorbs any lean of the errors with $x$ into the
              slope, and the residuals are orthogonal to $x$ by construction.
            correct: true
            feedback: >
              Right. Here the errors lean upward with $x$ and the fitted slope
              rose from $1$ to $1.4$ to soak it up. Whether errors are
              uncorrelated with the regressors is an assumption you argue, not
              one you test with residuals.
          - text: >
              Yes, if the sample were larger than four points.
            feedback: >
              $X'e = 0$ holds at every sample size. More data shrinks the
              lean in the errors, but the residuals still cannot see it.
        feedback: >
          Residual orthogonality is mechanical, so it is never evidence about
          the errors.

      - part: How noisy is the world
        ask: >
          Estimate the error variance by $\hat{\sigma}^{2} = \sum_i e_i^{2}/(n - k - 1)$,
          with $n = 4$ observations and $k = 1$ regressor. What do you get?
        expects: "1.6"
        hint: >
          Square the four residuals $-0.4, 1.2, -1.2, 0.4$ and add.
        feedback: >
          $\sum_i e_i^{2} = 0.16 + 1.44 + 1.44 + 0.16 = 3.2$, and
          $3.2/(4 - 1 - 1) = 1.6$.
      - ask: >
          Why divide by $2$ rather than by the $4$ observations?
        choices:
          - text: >
              Because the residuals are forced to satisfy two linear
              conditions, so they are systematically smaller than the errors.
            correct: true
            feedback: >
              Right. Here $\sum_i e_i^{2} = 3.2$ while
              $\sum_i \varepsilon_i^{2} = 0.25 + 2.25 + 0.25 + 2.25 = 5$: the
              fit bent toward the noise. Each estimated coefficient uses up
              one degree of freedom, and $n - k - 1$ corrects for it.
          - text: >
              It is a convention; dividing by $4$ would be just as good.
            feedback: >
              Dividing by $4$ gives $0.8$, a systematic underestimate: the
              residuals were chosen to be as small as possible, so their
              squares understate the errors' squares.
          - text: >
              Because only two of the residuals are nonzero.
            feedback: >
              All four residuals are nonzero here. What matters is that two
              linear conditions tie them together, leaving two free.
        feedback: >
          Divide the residual sum of squares by $n - k - 1$, the degrees of
          freedom left after estimating $k + 1$ coefficients.

  - node: quant-statistics.regression.beta-cov-var
    hook: >
      "What is this stock's beta?" is answered by naming this exact formula,
      and most candidates only remember it as a finance fact, not as the OLS
      slope it literally is.
    explanation: >
      Solving the single-regressor normal equations gives
      $\hat\beta_1=\dfrac{\sum_i(x_i-\bar x)(y_i-\bar y)}{\sum_i(x_i-\bar
      x)^{2}}$, the sample covariance over the sample variance of $x$; the
      population version is
      $\beta_1=\operatorname{Cov}(x,y)/\operatorname{Var}(x)$. Written through
      the correlation instead, $\hat\beta_1=r\,s_y/s_x$: the slope is the
      correlation rescaled by the ratio of spreads, carrying the sign of the
      covariance and the units of $y$ per unit of $x$ — unlike correlation,
      which is unitless and bounded by $1$ in magnitude.

      A CAPM beta is nothing more than this identity applied to an asset's
      excess return regressed on the market's excess return. It is also worth
      internalizing that regressing $x$ on $y$ gives a different slope,
      $s_{xy}/s_y^{2}$, and the two slopes multiply to $r^{2}\le 1$, so the
      two regression lines coincide only when the fit is perfect.
    worked: >
      An asset's excess returns and the market's excess returns over four
      periods: market $-2,-1,1,2$ (mean $0$), asset $-3,0,2,5$ (mean $1$).
      Centre both: $\sum(x_i-\bar x)(y_i-\bar y)=(-2)(-4)+(-1)(-1)+(1)(1)
      +(2)(4)=18$, and $\sum(x_i-\bar x)^{2}=4+1+1+4=10$. The beta is
      $18/10=1.8$ — for every $1$ point the market moves, this asset moves
      $1.8$ points on average, an aggressive, high-beta name.
    interview: >
      "What is beta?" wants $\operatorname{Cov}(\text{asset},\text{market})
      /\operatorname{Var}(\text{market})$, stated as literally the OLS slope,
      not a separate finance formula.
    pitfalls: >
      Confusing beta with correlation — beta carries units and is unbounded,
      correlation is unitless and bounded by $1$. Assuming regressing $y$ on
      $x$ and $x$ on $y$ give reciprocal slopes; they don't, the product is
      $r^{2}$, not $1$, in general.
    recap: >
      The regression slope is $\operatorname{Cov}(x,y)/\operatorname{Var}(x)$,
      equally $r\,s_y/s_x$ — the identity behind every "beta" quoted on a
      desk.
    dialogue:
      - part: A beta from four days
        teach: >
          Four days of excess returns, in percent. The market $x$ did $-2$,
          $0$, $1$, $1$; a stock $y$ did $-3$, $1$, $0$, $6$. A risk manager
          wants the stock's beta: the slope from regressing the stock on the
          market.
      - ask: >
          Fit the slope by the hand recipe — centre, cross-multiply, divide.
          What is $\hat{\beta}_1$?
        expects: "2"
        hint: >
          $\bar{x} = 0$ and $\bar{y} = 1$.
        feedback: >
          Centred stock returns are $-4, 0, -1, 5$; the market is already
          centred. Cross-products $8 + 0 - 1 + 5 = 12$, squared deviations
          $4 + 0 + 1 + 1 = 6$, slope $12/6 = 2$.
      - ask: >
          Now forget regression and compute the sample covariance of market
          and stock, dividing by $n - 1 = 3$. What is it?
        expects: "4"
        feedback: >
          $s_{xy} = 12/3 = 4$ — the same cross-product sum, divided by $3$.
      - ask: >
          And the sample variance of the market, also dividing by $3$?
        expects: "2"
        feedback: >
          $s_x^{2} = 6/3 = 2$. The ratio $4/2 = 2$ is the slope again: the
          $n - 1$ appears top and bottom and cancels.
      - reflect: >
          That was one sample. Suppose in the population
          $y = \beta_0 + \beta_1 x + \varepsilon$ with $\varepsilon$
          uncorrelated with $x$. What could you do to both sides of that
          equation to isolate $\beta_1$, and what comes out?
        hint: >
          You want an operation that kills the constant and the error and
          keeps the $x$ term.
        answer: >
          Take the covariance of both sides with $x$. The constant has zero
          covariance with anything, $\operatorname{Cov}(x, \varepsilon) = 0$
          by assumption, and $\operatorname{Cov}(x, \beta_1 x) = \beta_1
          \operatorname{Var}(x)$. So $\operatorname{Cov}(x, y) = \beta_1
          \operatorname{Var}(x)$ and $\beta_1 =
          \operatorname{Cov}(x, y)/\operatorname{Var}(x)$ — the population
          twin of what the four days gave.

      - part: Correlation in disguise
        teach: >
          The proposition: with one regressor and an intercept,
          $\hat{\beta}_1 = s_{xy}/s_x^{2}$ and
          $\hat{\beta}_0 = \bar{y} - \hat{\beta}_1 \bar{x}$, and in the
          population $\beta_1 = \operatorname{Cov}(x, y)/\operatorname{Var}(x)$.
          Since $r = s_{xy}/(s_x s_y)$, the same slope is
          $\hat{\beta}_1 = r\, s_y/s_x$. A CAPM beta is exactly this, with
          excess returns on both sides.
      - ask: >
          For the four days, $\sum_i (y_i - \bar{y})^{2} = 42$. What is the
          correlation $r$ between stock and market, to three decimals?
        expects: "0.756"
        tolerance: 0.001
        hint: >
          $r = \sum_i \tilde{x}_i \tilde{y}_i / \sqrt{\sum_i \tilde{x}_i^{2}
          \sum_i \tilde{y}_i^{2}}$.
        feedback: >
          $r = 12/\sqrt{6 \cdot 42} = 12/\sqrt{252} \approx 0.756$. Then
          $s_y/s_x = \sqrt{42/6} = \sqrt{7} \approx 2.646$, and
          $0.756 \times 2.646 \approx 2$: the beta again.
      - ask: >
          A utility has correlation $0.9$ with the market and a beta of
          $0.4$. A colleague says those two numbers contradict each other.
          Who is right?
        choices:
          - text: >
              The colleague: a correlation of $0.9$ forces a beta near $0.9$.
            feedback: >
              Beta is $r\, s_y/s_x$, not $r$. A correlation of $0.9$ only
              pins the beta once you know the ratio of the volatilities.
          - text: >
              Neither number can be right, since beta cannot be smaller than
              the correlation.
            feedback: >
              Beta is smaller than $r$ whenever the stock is quieter than the
              market, $s_y < s_x$. Nothing stops that.
          - text: >
              No contradiction: the utility's volatility is less than half the
              market's.
            correct: true
            feedback: >
              Right. $0.4 = 0.9 \cdot s_y/s_x$ gives $s_y/s_x \approx 0.44$.
              A tightly correlated but quiet stock has a small beta; a loosely
              correlated but wild one can have a large beta.
        feedback: >
          Correlation measures how tightly the points hug a line; beta
          measures how steep the line is. The ratio of spreads converts one
          into the other.

      - part: Turning the regression around
        ask: >
          Now regress the market on the stock: market as $y$, stock as $x$.
          What slope comes out? Give a fraction.
        expects: "2/7"
        hint: >
          The cross-product sum is unchanged; divide by the stock's squared
          deviations.
        feedback: >
          $12/42 = 2/7 \approx 0.286$.
      - ask: >
          The stock-on-market slope was $2$. Why is the reverse slope not
          $1/2$?
        choices:
          - text: >
              It should be $1/2$; the fraction above is a rounding artifact.
            feedback: >
              $12/42$ is exact. The two regressions divide the same covariance
              by different variances, $6$ and $42$, so they are not
              reciprocals.
          - text: >
              Each regression minimizes misses in its own response variable,
              so the two lines are different and the slopes are not
              reciprocals.
            correct: true
            feedback: >
              Right. The first minimizes vertical misses in the stock, the
              second horizontal misses in the market. Reciprocal slopes would
              mean the same line, which happens only for a perfect fit.
          - text: >
              Because the market has mean $0$ and the stock does not.
            feedback: >
              Means only move the intercepts. The slopes are built from
              centred data, so shifting either variable changes neither slope.
        feedback: >
          The stock-on-market line and the market-on-stock line are two
          different lines through $(\bar{x}, \bar{y})$.
      - ask: >
          Multiply the two slopes, $2 \times 2/7$. What is the product?
        expects: "4/7"
        feedback: >
          $4/7 \approx 0.571$, and $r^{2} = 0.756^{2} \approx 0.571$. In
          general $\dfrac{s_{xy}}{s_x^{2}} \cdot \dfrac{s_{xy}}{s_y^{2}} = r^{2}$,
          which is at most $1$, with equality exactly when every point lies on
          one line.
      - ask: >
          An interviewer asks: "What is a stock's beta?" Which answer does the
          interviewer want?
        choices:
          - text: >
              "Its correlation with the market."
            feedback: >
              Correlation is unitless and bounded by $1$; beta is neither. The
              utility with $r = 0.9$ and beta $0.4$ is the counterexample.
          - text: >
              "How much more volatile it is than the market, $s_y/s_x$."
            feedback: >
              That ignores the correlation. A stock twice as volatile as the
              market but uncorrelated with it has beta $0$.
          - text: >
              "The OLS slope of its excess return on the market's:
              $\operatorname{Cov}/\operatorname{Var}$, equivalently
              $r\, s_y/s_x$."
            correct: true
            feedback: >
              That is the answer, said as a regression slope rather than a
              finance fact, with both forms ready.
        feedback: >
          Beta is a regression slope: covariance over the regressor's
          variance, or correlation times the ratio of spreads.

  - node: quant-statistics.regression.projection-view
    hook: >
      "Why can R² never decrease when you add a regressor?" has a one-line
      geometric answer that the algebra alone obscures.
    explanation: >
      Read $y$ as a single vector in $\mathbb{R}^{n}$ and the columns of $X$
      as spanning a subspace of it. Least squares asks for the closest point
      of that subspace to $y$, and the closest point is, by definition, the
      orthogonal projection: $\hat y=Hy$ with hat matrix
      $H=X(X'X)^{-1}X'$, symmetric, idempotent ($H^{2}=H$), and of trace
      $k+1$. The residual $e=(I-H)y$ is the leftover perpendicular
      component, and $X'e=0$ is exactly the normal-equation condition read
      geometrically.

      Nothing probabilistic enters this picture, which is the point: it
      explains why the fit is unique exactly when the columns of $X$ are
      independent (a genuine basis for the subspace), why the residual sum of
      squares can never rise when a regressor is added (you are projecting
      onto a strictly larger subspace, so the closest point can only get
      closer or stay the same), and why the variance decomposition later in
      this unit is nothing but the Pythagorean theorem.
    worked: >
      With only an intercept regressor and $n=3$, $X$ is the column of ones
      and the hat matrix is $H=\tfrac{1}{3}J$, the $3\times 3$ matrix of all
      entries $1/3$ (each fitted value is just $\bar y$, the projection onto
      the span of ones). Check idempotency directly: each entry of $H^{2}$ is
      $3\times(1/3)(1/3)=1/3$, matching $H$ exactly. The trace is
      $3\times1/3=1$, matching $k+1=1$, the dimension of the subspace being
      projected onto.
    interview: >
      "What is the hat matrix, and why is it idempotent?" and "why can R²
      never decrease" both want the projection answer: a bigger subspace
      cannot increase the distance to the closest point.
    pitfalls: >
      Thinking the projection view requires a probabilistic assumption — it
      does not, it is pure geometry. Forgetting $H$ depends only on $X$, not
      on $y$, so the same hat matrix applies to any response vector.
    recap: >
      OLS drops a perpendicular from $y$ onto the column space of $X$; $H$ is
      that projection, idempotent and of trace $k+1$.
    dialogue:
      - part: Three observations as one arrow
        teach: >
          Three observations of a response, $y = 2, 4, 9$. Stop thinking of
          them as three dots on a scatter plot and read them as one point
          $(2, 4, 9)$ in three-dimensional space. A model with only an
          intercept can offer you any vector of the form $c\,(1, 1, 1)$ —
          a point somewhere on one line through the origin.
      - ask: >
          Which $c$ puts $c\,(1, 1, 1)$ closest to $(2, 4, 9)$?
        expects: "5"
        hint: >
          Squared distance is $(2 - c)^{2} + (4 - c)^{2} + (9 - c)^{2}$.
        feedback: >
          Minimizing the squared distance is fitting a constant by least
          squares, so $c = \bar{y} = 15/3 = 5$. The closest point is
          $(5, 5, 5)$.
      - ask: >
          What is the squared distance from $(2, 4, 9)$ to that closest point?
        expects: "26"
        feedback: >
          The leftover is $(2, 4, 9) - (5, 5, 5) = (-3, -1, 4)$, with squared
          length $9 + 1 + 16 = 26$ — the residual sum of squares of the
          intercept-only fit.
      - ask: >
          Take the dot product of that leftover $(-3, -1, 4)$ with the
          direction $(1, 1, 1)$. What do you get?
        expects: "0"
        feedback: >
          $-3 - 1 + 4 = 0$. The leftover is perpendicular to the line you
          were allowed to move along.
      - reflect: >
          At the closest point the leftover came out perpendicular to the
          line. Why must that happen at the closest point — what could you do
          if the leftover still had some component along the line?
        answer: >
          If the leftover had a component along the line, you could slide the
          candidate point a little in that direction and get closer to $y$,
          so it would not have been the closest point. At the minimum nothing
          is left to slide along: the leftover is orthogonal to every
          direction available. The same argument works for a plane or any
          subspace, which is why least squares is a perpendicular dropped from
          $y$.

      - part: Least squares is a projection
        teach: >
          Read $y$ as a vector in $\mathbb{R}^{n}$ and the $k + 1$ columns of
          $X$ as spanning a subspace. The least-squares fit is the closest
          point of that subspace, the orthogonal projection
          $\hat{y} = Hy$ with hat matrix $H = X(X'X)^{-1}X'$. The residual
          $e = (I - H)y$ is the perpendicular leftover, and the normal
          equations $X'e = 0$ say exactly that it is orthogonal to every
          column. $H$ is symmetric, idempotent ($H^{2} = H$) and has trace
          $k + 1$. No probability enters anywhere.
      - ask: >
          Add a regressor $x = (0, 1, 2)$ to the intercept, so the fit may now
          land anywhere on the plane spanned by $(1, 1, 1)$ and $(0, 1, 2)$.
          Before computing: could the residual sum of squares rise above
          $26$?
        choices:
          - text: >
              Yes, if the new regressor is unrelated to $y$ it can make the
              fit worse.
            feedback: >
              A useless regressor gets a coefficient near $0$, and the fit can
              always pick exactly $0$, which reproduces the old fit. The plane
              contains the old line, so its closest point is at least as
              close.
          - text: >
              No: the plane contains the old line, so the closest point can
              only get closer or stay put.
            correct: true
            feedback: >
              Right. Projecting onto a larger subspace never increases the
              distance. That is the whole reason the residual sum of squares
              cannot rise when a regressor is added.
          - text: >
              It depends on whether the regressor is centred.
            feedback: >
              Centring changes the coefficients, not the plane: with the ones
              column present, $x$ and $x - \bar{x}$ span the same plane, so the
              projection is identical.
        feedback: >
          Monotonicity is geometry: a bigger subspace, a nearer closest point.
      - ask: >
          The projection onto that plane is $\hat{y} = (1.5, 5, 8.5)$. What is
          the new residual sum of squares?
        expects: "1.5"
        feedback: >
          The residual is $(0.5, -1, 0.5)$, with squared length
          $0.25 + 1 + 0.25 = 1.5$, down from $26$. Check it is perpendicular to
          both columns: $0.5 - 1 + 0.5 = 0$ and $0 - 1 + 1 = 0$.
      - ask: >
          Now project $\hat{y} = (1.5, 5, 8.5)$ itself onto the same plane.
          What is the third entry of the result?
        expects: "8.5"
        hint: >
          Where is $\hat{y}$ already?
        feedback: >
          $\hat{y}$ already lies in the plane, so projecting it again leaves it
          where it is: $8.5$. That is $H^{2} = H$, idempotence, read as a
          sentence.

      - part: Where the picture misleads
        ask: >
          Add a third column, $x^{2} = (0, 1, 4)$. Three independent columns
          in $\mathbb{R}^{3}$. What is the residual sum of squares now?
        expects: "0"
        hint: >
          What subspace do three independent vectors span in three
          dimensions?
        feedback: >
          Three independent columns span all of $\mathbb{R}^{3}$, so $y$
          itself is in the subspace, the projection is $y$, and the residual
          is the zero vector. Here $H$ is the identity, with trace $3 = k + 1$.
      - ask: >
          The fit with $x^{2}$ has residual sum of squares $0$. What does that
          tell you?
        choices:
          - text: >
              The quadratic model is the correct one for this data.
            feedback: >
              Any three independent columns would have done the same, including
              three columns of random noise. A perfect fit with as many
              columns as observations is guaranteed, not earned.
          - text: >
              Very little: with $n$ columns you can reach any $y$, so a
              shrinking residual partly measures how big the subspace got.
            correct: true
            feedback: >
              Right. The geometry says the residual cannot rise as columns are
              added; it says nothing about whether the added columns mean
              anything. That gap is why fit statistics get penalized for the
              number of regressors.
          - text: >
              The errors in this data must have been zero.
            feedback: >
              The residuals are zero; the errors are whatever the world did.
              The fit simply had enough freedom to absorb them.
        feedback: >
          The projection picture explains why fit improves with columns, and
          for the same reason warns you not to read that improvement as
          truth.
      - ask: >
          Go back to the intercept and $x$, and add a column $2x = (0, 2, 4)$.
          What happens to the fit?
        choices:
          - text: >
              The fitted values are unchanged, but the coefficients are no
              longer unique.
            correct: true
            feedback: >
              Right. $2x$ lies in the plane already, so the subspace — and the
              projection onto it — does not move. But the three columns are
              dependent, $X'X$ is singular, and many coefficient vectors
              produce the same $\hat{y}$.
          - text: >
              The residual sum of squares drops, since a column was added.
            feedback: >
              It can only drop if the subspace grows. $2x$ adds no new
              direction, so the residual stays $1.5$.
          - text: >
              The fit fails completely and there are no fitted values.
            feedback: >
              The closest point of the plane still exists and is still
              $(1.5, 5, 8.5)$. Only the recipe for writing it as a combination
              of columns breaks.
        feedback: >
          The fitted values depend only on the subspace; the coefficients
          depend on the basis. Uniqueness of $\hat{\beta}$ is exactly
          independence of the columns.

  - node: quant-statistics.regression.anova-decomposition
    hook: >
      $\operatorname{SST}=\operatorname{SSE}+\operatorname{SSR}$ looks like
      bookkeeping until you're asked to prove it, and forgetting the
      intercept caveat is exactly what interviewers probe for.
    explanation: >
      Write $y_i-\bar y=(\hat y_i-\bar y)+e_i$ and square-sum both sides:
      $\sum_i(y_i-\bar y)^{2}=\sum_i(\hat y_i-\bar y)^{2}+\sum_i e_i^{2}
      +2\sum_i(\hat y_i-\bar y)e_i$. The cross term vanishes because
      $\sum_i\hat y_i e_i=0$ and $\sum_i e_i=0$, both direct consequences of
      the normal equations, leaving
      $\operatorname{SST}=\operatorname{SSE}+\operatorname{SSR}$. Read
      geometrically it is Pythagoras: the explained vector $\hat y-\bar y
      \mathbf{1}$ lies in the column space of $X$, the residual vector $e$ is
      perpendicular to that whole subspace, so the two legs meet at a right
      angle.

      The intercept is not decoration here — it is what forces $\sum_i e_i=0$
      in the first place. Drop it and the cross term need not vanish, so the
      identity can fail and an $R^{2}$ computed from this formula can come
      out negative.
    worked: >
      Continue the fit ($\bar y=4$, fitted values $2.8,3.4,4,4.6,5.2$,
      residuals $-0.8,0.6,1,-0.6,-0.2$). $\operatorname{SST}=\sum_i(y_i-\bar
      y)^{2}=4+0+1+0+1=6$. $\operatorname{SSE}=\sum_i(\hat y_i-\bar
      y)^{2}=1.44+0.36+0+0.36+1.44=3.6$. $\operatorname{SSR}=\sum_i
      e_i^{2}=2.4$. Indeed $3.6+2.4=6$, the identity holding to the decimal.
    interview: >
      Be ready to derive $\operatorname{SST}=\operatorname{SSE}
      +\operatorname{SSR}$ live by showing the cross term vanishes, and to
      name the intercept as the reason it does.
    pitfalls: >
      Applying this identity, and hence the standard $R^{2}$ formula, to a
      no-intercept regression, where the cross term can survive and $R^{2}$
      can come out negative.
    recap: >
      $\operatorname{SST}$ splits exactly into $\operatorname{SSE}
      +\operatorname{SSR}$ by Pythagoras, but only because the intercept
      forces the cross term to vanish.
    dialogue:
      - part: Where the variation goes
        teach: >
          A signal $x = 0, 1, 2, 3$ and four returns $y = 1, 1, 4, 6$. Least
          squares with an intercept gives $\hat{y} = 0.3 + 1.8x$, so the fitted
          values are $0.3$, $2.1$, $3.9$ and $5.7$. You want to say how much of
          the returns' variation the signal accounts for.
      - ask: >
          Start with the total: what is $\sum_i (y_i - \bar{y})^{2}$?
        expects: "18"
        hint: >
          $\bar{y} = 3$.
        feedback: >
          Deviations $-2, -2, 1, 3$, squares $4 + 4 + 1 + 9 = 18$.
      - ask: >
          The part the fit misses: what is the residual sum of squares
          $\sum_i e_i^{2}$?
        expects: "1.8"
        feedback: >
          Residuals $1 - 0.3 = 0.7$, $1 - 2.1 = -1.1$, $4 - 3.9 = 0.1$,
          $6 - 5.7 = 0.3$; squares $0.49 + 1.21 + 0.01 + 0.09 = 1.8$.
      - ask: >
          The part the fit traces out: what is $\sum_i (\hat{y}_i - \bar{y})^{2}$,
          the spread of the fitted values about the mean?
        expects: "16.2"
        hint: >
          The fitted values sit at $-2.7$, $-0.9$, $0.9$ and $2.7$ from the
          mean.
        feedback: >
          $7.29 + 0.81 + 0.81 + 7.29 = 16.2$. And $16.2 + 1.8 = 18$: the two
          pieces add up exactly to the total.
      - reflect: >
          Write each deviation as $y_i - \bar{y} = (\hat{y}_i - \bar{y}) + e_i$
          and square. Summing gives the two pieces you computed plus one more
          term. What is that term, and what do you know that kills it?
        hint: >
          $(a + b)^{2} = a^{2} + b^{2} + 2ab$.
        answer: >
          The extra term is $2\sum_i (\hat{y}_i - \bar{y}) e_i
          = 2\sum_i \hat{y}_i e_i - 2\bar{y} \sum_i e_i$. The normal equations
          give $\sum_i \hat{y}_i e_i = 0$ and, with an intercept,
          $\sum_i e_i = 0$, so the cross term is zero and the total splits
          exactly into the two pieces.

      - part: Pythagoras, and what it needs
        teach: >
          The proposition: with an intercept in the model,
          $\sum_i (y_i - \bar{y})^{2} = \sum_i (\hat{y}_i - \bar{y})^{2} + \sum_i e_i^{2}$,
          written $\operatorname{SST} = \operatorname{SSE} + \operatorname{SSR}$
          — total, explained, residual. Geometrically it is Pythagoras: the
          explained vector $\hat{y} - \bar{y}\mathbf{1}$ lies in the column
          space of $X$, the residual is perpendicular to that space, and the
          total is the hypotenuse.
      - ask: >
          The proof used two facts, $\sum_i \hat{y}_i e_i = 0$ and
          $\sum_i e_i = 0$. Which one depends on the intercept being in the
          model?
        choices:
          - text: >
              $\sum_i \hat{y}_i e_i = 0$, since $\hat{y}$ contains the
              intercept.
            feedback: >
              $\hat{y}$ is a combination of the columns of $X$, whatever they
              are, and $e$ is orthogonal to all of them. That fact holds with
              or without an intercept.
          - text: >
              Neither: both follow from the normal equations, whatever the
              columns.
            feedback: >
              The normal equations say $e$ is orthogonal to the columns of
              $X$. $\sum_i e_i = 0$ is orthogonality to the ones vector, which
              holds only if the ones vector is a column, or in their span.
          - text: >
              $\sum_i e_i = 0$: it is orthogonality to the ones column, so it
              needs the ones column in $X$.
            correct: true
            feedback: >
              Right. Without the intercept the residuals need not average
              zero, $\bar{y}\sum_i e_i$ survives, and the split can fail.
        feedback: >
          The intercept is what places $\bar{y}\mathbf{1}$ inside the column
          space, so that both legs of the triangle are measured from the same
          corner.

      - part: Dropping the intercept
        ask: >
          Two observations, $x = (1, 2)$ and $y = (4, 2)$, fitted through the
          origin: $\hat{y} = bx$ with $b = \sum_i x_i y_i / \sum_i x_i^{2} = 8/5$.
          What is the residual sum of squares?
        expects: "7.2"
        hint: >
          The fitted values are $1.6$ and $3.2$.
        feedback: >
          Residuals $4 - 1.6 = 2.4$ and $2 - 3.2 = -1.2$; squares
          $5.76 + 1.44 = 7.2$. Notice the residuals sum to $1.2$, not $0$.
      - ask: >
          What is the total, $\sum_i (y_i - \bar{y})^{2}$?
        expects: "2"
        feedback: >
          $\bar{y} = 3$, so $1 + 1 = 2$. The residual sum of squares is bigger
          than the total.
      - ask: >
          Someone reports the share explained as $1 - \operatorname{SSR}/\operatorname{SST}$.
          What number do they get?
        expects: "-2.6"
        feedback: >
          $1 - 7.2/2 = 1 - 3.6 = -2.6$. A "share explained" below zero.
      - ask: >
          Compute the explained piece for this fit,
          $\sum_i (\hat{y}_i - \bar{y})^{2}$, and add it to the residual sum
          of squares. What do you get?
        expects: "9.2"
        hint: >
          The fitted values $1.6$ and $3.2$ sit at $-1.4$ and $0.2$ from
          $\bar{y} = 3$.
        feedback: >
          $1.96 + 0.04 = 2$, and $2 + 7.2 = 9.2$, against a total of $2$. The
          cross term $2\sum_i (\hat{y}_i - \bar{y})e_i =
          2[(-1.4)(2.4) + (0.2)(-1.2)] = -7.2$ is what makes up the
          difference: with no intercept the residuals sum to $1.2$, not $0$,
          and nothing kills it. The identity, and every share-explained number
          built from it, is a statement about fits with an intercept; when you
          derive it in an interview, name the intercept as the reason the
          cross term dies.

  - node: quant-statistics.regression.r-squared
    hook: >
      "Your model has an R² of $0.05$, why should anyone care" is a trap:
      answering it requires knowing what R² does and does not measure.
    explanation: >
      $R^{2}=1-\operatorname{SSR}/\operatorname{SST}$ is the fraction of the
      in-sample variance of $y$ the fit accounts for, a number in $[0,1]$ tied
      to the decomposition you already know. In simple regression it is
      exactly the squared sample correlation, $R^{2}=r^{2}$; in general it is
      the squared correlation between $y$ and $\hat y$. What it does not
      deliver: causality, correct functional form (a curved relation can
      still show a high $R^{2}$), or any promise about out-of-sample
      accuracy.

      Because adding any regressor, even pure noise, enlarges the column
      space the fit projects onto, the residual sum of squares can only fall
      or hold steady, so $R^{2}$ never decreases as regressors are added — a
      purely mechanical fact, not evidence the new regressor matters. Adjusted $R^{2}=1-(1-R^{2})\dfrac{n-1}{n-k-1}$
      charges a penalty for the count of regressors to compensate. Scale is
      context: on daily equity returns an honest $R^{2}$ of $0.01$ can still
      be a highly profitable signal, so judging $R^{2}$ against a textbook
      threshold from another domain is a category error.
    worked: >
      Continue the fit: $\operatorname{SST}=6$, $\operatorname{SSE}=3.6$,
      $\operatorname{SSR}=2.4$, so $R^{2}=3.6/6=0.6$ — the line accounts for
      $60\%$ of the variance in $y$. With $n=5$ and $k=1$ regressor, adjusted
      $R^{2}=1-(1-0.6)\dfrac{5-1}{5-1-1}=1-0.4\times4/3\approx0.467$, the
      penalty for spending a degree of freedom on one predictor with only
      five observations.
    interview: >
      "What does R² mean" and the trap follow-up "is higher R² always
      better" both want the same answer: it is in-sample variance explained,
      mechanically non-decreasing, silent on causality and forecasting.
    pitfalls: >
      Reading R² as evidence of causality or correct specification. Comparing
      R² across models with different regressor counts without adjusting.
      Dismissing a small but genuine R² as "no signal" in a noisy domain like
      daily returns.
    recap: >
      R² is the in-sample variance share explained, mechanically
      non-decreasing in the number of regressors, so use adjusted R² or an
      out-of-sample check to judge real value.
    dialogue:
      - part: One number for how well a line fits
        teach: >
          Three days: signal $x = 0, 2, 4$ and return $y = 1, 5, 3$. The
          least-squares line is $\hat{y} = 2 + 0.5x$, with fitted values $2$,
          $3$, $4$. The total sum of squares about $\bar{y} = 3$ is
          $\operatorname{SST} = 4 + 4 + 0 = 8$.
      - ask: >
          What fraction of that total is left over in the residuals,
          $\operatorname{SSR}/\operatorname{SST}$?
        expects: "0.75"
        hint: >
          The residuals are $1 - 2$, $5 - 3$ and $3 - 4$.
        feedback: >
          Residuals $-1, 2, -1$, so $\operatorname{SSR} = 1 + 4 + 1 = 6$ and
          $6/8 = 0.75$. The other $0.25$ is the share the line accounts for.
      - ask: >
          Now compute the sample correlation $r$ between $x$ and $y$.
        expects: "0.5"
        hint: >
          Centred values are $-2, 0, 2$ and $-2, 2, 0$.
        feedback: >
          Cross-products $4 + 0 + 0 = 4$; $\sum_i \tilde{x}_i^{2} = 8$ and
          $\sum_i \tilde{y}_i^{2} = 8$, so $r = 4/\sqrt{64} = 0.5$. Square it
          and you get $0.25$ — the share explained.
      - reflect: >
          Suppose you add a fourth regressor column of pure random noise to
          this fit. Before computing: can the share explained go down? And if
          it cannot, what is this number unable to tell you about a new
          regressor?
        hint: >
          Think of the fit as a projection onto the span of the columns.
        answer: >
          It cannot go down: the fit projects onto a larger subspace, so the
          residual sum of squares can only fall or stay put. That makes the
          raw share explained useless for judging whether a regressor earns
          its place — noise always "helps" a little. Any honest comparison has
          to charge for the number of columns, or test out of sample.

      - part: The definition, and its price tag
        teach: >
          $R^{2} = 1 - \operatorname{SSR}/\operatorname{SST} = \operatorname{SSE}/\operatorname{SST}$,
          the fraction of the in-sample variance of $y$ that the fit accounts
          for, in $[0, 1]$ for a fit with an intercept. In simple regression
          $R^{2} = r^{2}$; in general it is the squared correlation between
          $y$ and $\hat{y}$. Because it never falls when a column is added,
          adjusted $R^{2} = 1 - (1 - R^{2})\dfrac{n - 1}{n - k - 1}$ charges
          for the count of regressors $k$.
      - ask: >
          For the three-day fit, $n = 3$ and $k = 1$. What is the adjusted
          $R^{2}$?
        expects: "-0.5"
        feedback: >
          $1 - 0.75 \cdot \dfrac{2}{1} = 1 - 1.5 = -0.5$. Adjusted $R^{2}$ can
          be negative: one regressor on three points is not worth the degree
          of freedom it costs.
      - ask: >
          Now add the column of noise, $z = (5, -1, 2)$, so the fit has an
          intercept, $x$ and $z$. What is the new $R^{2}$?
        expects: "1"
        hint: >
          How many independent columns, how many observations?
        feedback: >
          Three independent columns in $\mathbb{R}^{3}$ span everything, so the
          fit passes through all three points: $\operatorname{SSR} = 0$ and
          $R^{2} = 1$. Adjusted $R^{2}$ is not even defined, since
          $n - k - 1 = 0$.
      - ask: >
          An analyst sees $R^{2}$ jump from $0.25$ to $1$ and keeps $z$. What
          is the right reading?
        choices:
          - text: >
              $z$ explains the remaining $75$ percent, so it belongs in the
              model.
            feedback: >
              Any third column would have done this, because three columns
              reach every point in $\mathbb{R}^{3}$. A jump to $1$ that any
              noise column can produce is not evidence about $z$.
          - text: >
              The jump is mechanical: with as many columns as observations,
              $R^{2} = 1$ is guaranteed.
            correct: true
            feedback: >
              Right. Judge $z$ on adjusted $R^{2}$ or, better, on data the
              fit has not seen.
          - text: >
              $R^{2} = 1$ means the errors in this data are zero.
            feedback: >
              The residuals are zero; the errors are whatever the world did.
              The fit had enough freedom to absorb them.
        feedback: >
          $R^{2}$ is in-sample and never decreases with more columns. That is
          a property of the arithmetic, not of the regressors.

      - part: What a high R² does not say
        ask: >
          A stock's daily return regressed on its sector ETF's return over
          the same day gives $R^{2} = 0.7$. A colleague wants to trade it as
          a forecast. What is wrong?
        choices:
          - text: >
              Nothing: $0.7$ is high, so the relation is strong and tradable.
            feedback: >
              Strong, yes, but both returns are known only at the close. A
              same-day relation explains the stock's move; it does not
              predict it.
          - text: >
              $R^{2}$ is in-sample variance explained, not forecasting skill;
              the regressor is not known in advance.
            correct: true
            feedback: >
              Right. $R^{2}$ says nothing about out-of-sample accuracy, and a
              contemporaneous regressor gives no forecast at all.
          - text: >
              $0.7$ is too low; trading needs $R^{2}$ above $0.9$.
            feedback: >
              There is no such threshold. On predictive regressions for daily
              returns, an honest $R^{2}$ of $0.01$ can be very profitable.
        feedback: >
          The number answers "how much of this sample's variance does the fit
          trace?", never "what will happen next?".
      - ask: >
          A fit has $R^{2} = 0.95$, and its residual plot is a clear U:
          positive at both ends, negative in the middle. What does the $R^{2}$
          say about whether a straight line is the right model?
        choices:
          - text: >
              Little: a curved relation can still show a high $R^{2}$; the U
              says the form is wrong.
            correct: true
            feedback: >
              Right. A steadily rising curve is mostly captured by a line, so
              the share explained is high even though the line is
              systematically wrong at both ends and in the middle.
          - text: >
              It confirms the line: $95$ percent explained leaves no room for
              curvature.
            feedback: >
              The $5$ percent left over is exactly where the curvature lives,
              and it is systematic, not noise. A high $R^{2}$ does not check
              the functional form.
          - text: >
              It shows causation runs from $x$ to $y$.
            feedback: >
              $R^{2}$ is symmetric in a simple regression — it equals $r^{2}$
              either way round — so it cannot say which way anything runs.
        feedback: >
          $R^{2}$ is silent on causality, specification and forecasting. It
          measures one thing: in-sample variance traced by the fit.

  - node: quant-statistics.regression.multiple-regression
    hook: >
      "What does 'controlling for X' actually mean, mathematically?" has a
      literal answer, and Frisch–Waugh–Lovell is it.
    explanation: >
      With several regressors, $\hat\beta_j$ is the effect of $x_j$ holding
      the other regressors fixed — not the simple-regression slope of $y$ on
      $x_j$ alone, which ignores whatever $x_j$ shares with the others.
      Frisch–Waugh–Lovell makes "holding fixed" exact: regress $x_j$ on all
      the other regressors and keep the residual $\tilde x_j$, the part of
      $x_j$ that the rest cannot explain. Then $\hat\beta_j$ equals the
      simple-regression slope of $y$ on $\tilde x_j$ alone.

      Three consequences follow that interviews probe directly. A
      coefficient can flip sign when another regressor is added, because
      partialling out changes what variation is left to attribute. Two
      regressors that are each individually insignificant can be jointly
      significant, since neither one's leftover variation alone explains much
      even though the two together do. And if $x_j$ is orthogonal to the
      other regressors then $\tilde x_j=x_j$, so the multiple and simple
      slopes agree exactly.
    worked: >
      Construct $y=2+3x_1-x_2$ exactly on three points: $x_1=(0,1,3)$,
      $x_2=(1,0,2)$, $y=(1,5,9)$, so the true $\hat\beta_1=3$. Partial out
      $x_2$ from $x_1$: the simple regression of $x_1$ on $x_2$ gives
      residuals $\tilde x_1=(-4/3,2/3,2/3)$, the part of $x_1$ that $x_2$
      cannot explain. Regressing $y$ on $\tilde x_1$ alone gives slope
      $8/(8/3)=3$, matching $\hat\beta_1$ exactly — Frisch–Waugh–Lovell in
      miniature.
    interview: >
      "What does holding other variables fixed mean?" wants the FWL answer.
      Expect a follow-up on whether adding a regressor can flip another's
      sign, and why.
    pitfalls: >
      Interpreting $\hat\beta_j$ as "the effect of $x_j$" without the
      "holding the others fixed" qualifier. Assuming an insignificant
      individual coefficient means the regressor is useless — it may be
      jointly significant with another, or nearly collinear.
    recap: >
      Each multiple-regression coefficient is a simple-regression slope on
      the part of its regressor that the other regressors cannot explain.
    dialogue:
      - part: A price rise that sells more coffee
        teach: >
          An iced-coffee cart logs four days. Price per cup $x_1$, in dollars:
          $1, 2, 3, 4$. Temperature above $20$ degrees, $x_2$: $0, 2, 2, 4$.
          Cups sold $y$, in tens: $4, 7, 6, 9$. The owner wants to know what a
          one-dollar price rise does to sales.
      - ask: >
          Regress sales on price alone, with an intercept. What slope do you
          get?
        expects: "1.4"
        hint: >
          Centre both columns, form the cross-product sum, divide by the sum
          of squared centred prices.
        feedback: >
          Centred prices are $-1.5, -0.5, 0.5, 1.5$ and centred sales
          ($\bar{y} = 6.5$) are $-2.5, 0.5, -0.5, 2.5$. The cross-products sum
          to $3.75 - 0.25 - 0.25 + 3.75 = 7$, the squared prices to $5$, so
          the slope is $7/5 = 1.4$: each extra dollar comes with $14$ more
          cups.
      - ask: >
          The owner concludes that raising the price sells more coffee. What
          is wrong with reading the $1.4$ that way?
        choices:
          - text: >
              Nothing: the regression used every day of data, so it is the
              price effect.
            feedback: >
              Every day of data is also every day of weather. The owner
              charged $1$ dollar on the coldest day and $4$ on the hottest, so
              the high-price days are the hot days, and the slope credits price
              with whatever the heat did.
          - text: >
              The sample is too small; with more days the slope would turn
              negative.
            feedback: >
              More days priced the same way — high when hot — would give the
              same positive slope with more confidence. The problem is what
              moves with price, not how many days you have.
          - text: >
              Price rose on the hot days, so the slope mixes the effect of
              price with the effect of temperature.
            correct: true
            feedback: >
              Right. Price and temperature climb together in this log, and a
              regression on price alone has no way to tell which one moved
              sales.
        feedback: >
          The one-variable slope answers "how do sales differ between
          high-price and low-price days", and those days differ in weather
          too.
      - ask: >
          Find the two days on which the temperature was the same. Going from
          the first of them to the second, the price rose by one dollar. By how
          much did sales change, in tens of cups?
        expects: "-1"
        hint: >
          Days two and three both sit at $x_2 = 2$.
        feedback: >
          Day two: price $2$, sales $7$. Day three: price $3$, sales $6$. With
          the temperature held at $2$, one dollar more cost $10$ cups — the
          opposite sign from the $1.4$.
      - reflect: >
          Days two and three were a lucky natural experiment. Real data almost
          never hands you two days with the temperature exactly equal. What
          could you compute from the price and temperature columns so that
          what is left of price is only the part that did *not* move with the
          weather?
        answer: >
          Predict price from temperature — regress $x_1$ on $x_2$ — and keep
          the residual. The fitted part is the price the weather would have
          led you to expect; the residual is how much dearer or cheaper the
          coffee was than that. The residual is uncorrelated with temperature
          by construction, so a slope of sales on it cannot be carrying the
          weather's effect.

      - part: Stripping the weather out of price
        ask: >
          Regress price on temperature, with an intercept. What slope do you
          get?
        expects: "0.75"
        hint: >
          Centred temperatures are $-2, 0, 0, 2$.
        feedback: >
          Cross-products with centred price: $(-2)(-1.5) + 0 + 0 + (2)(1.5) =
          6$; squared temperatures sum to $8$. Slope $6/8 = 0.75$, and the
          intercept is $2.5 - 0.75 \cdot 2 = 1$.
      - ask: >
          The fitted price is $1 + 0.75x_2$. What is the residual on day two,
          actual price minus fitted?
        expects: "-0.5"
        feedback: >
          Fitted at $x_2 = 2$: $1 + 1.5 = 2.5$, and $2 - 2.5 = -0.5$. All four
          residuals are $\tilde{x}_1 = (0, -0.5, 0.5, 0)$: zero on the days
          where price was just what the weather predicted, nonzero only on the
          two days where price moved without the weather.
      - teach: >
          This is the Frisch–Waugh–Lovell result. In a multiple regression of
          $y$ on an intercept and $x_1, \dots, x_k$, the coefficient
          $\hat{\beta}_j$ equals the simple slope of $y$ on $\tilde{x}_j$,
          the residual from regressing $x_j$ on all the other regressors:
          $\hat{\beta}_j = \sum_i \tilde{x}_{ij} y_i / \sum_i \tilde{x}_{ij}^{2}$.
          "Holding the others fixed" means exactly this — the slope on the
          part of $x_j$ the others cannot explain.
      - ask: >
          Apply it. What is the multiple-regression coefficient on price?
        expects: "-1"
        hint: >
          Only days two and three have nonzero $\tilde{x}_1$.
        feedback: >
          Numerator $(-0.5)(7) + (0.5)(6) = -0.5$; denominator
          $0.25 + 0.25 = 0.5$; slope $-1$. The data fit
          $y = 5 - x_1 + 2x_2$ exactly, and the full regression of sales on
          price and temperature returns that $-1$.
      - ask: >
          The formula uses $y$ itself, not $y$ with the weather stripped
          out. Sales are $5 - x_1 + 2x_2$; why does the $2x_2$ part
          contribute nothing to $\sum_i \tilde{x}_{1i} y_i$?
        choices:
          - text: >
              Because $\tilde{x}_1$ is a residual from a fit on $x_2$, and
              residuals are orthogonal to every regressor of their fit.
            correct: true
            feedback: >
              Right: $\sum_i \tilde{x}_{1i} = 0$ and $\sum_i \tilde{x}_{1i}x_{2i}
              = 0$ by the normal equations, so the constant and the weather
              terms vanish. The price term leaves $-\sum_i \tilde{x}_{1i}x_{1i}
              = -\sum_i \tilde{x}_{1i}^{2}$, for the same reason, and dividing
              gives exactly $-1$.
          - text: >
              Because the temperature coefficient $2$ is small next to the
              sales figures.
            feedback: >
              Its size is irrelevant: with a coefficient of $200$ the term
              would still contribute $200 \cdot 0 = 0$. Here
              $\sum_i \tilde{x}_{1i}x_{2i} = (-0.5)(2) + (0.5)(2) = 0$.
          - text: >
              It does contribute; the result is only approximately $-1$.
            feedback: >
              The arithmetic was exact: $-0.5/0.5 = -1$, matching the true
              coefficient to the last digit. Frisch–Waugh–Lovell is an
              identity, not an approximation.
          - text: >
              Because temperature is not correlated with sales.
            feedback: >
              It plainly is — the hottest day sold the most. What matters is
              that temperature is uncorrelated with $\tilde{x}_1$, which is
              true by construction.
        feedback: >
          Orthogonality of residuals is arithmetic, so partialling out removes
          the other regressors from the numerator exactly, however strongly
          they drive $y$.

      - part: When the simple slope already gets it right
        ask: >
          Another month the owner set prices $1, 2, 3, 4$ without looking at
          the forecast, and the temperatures happened to be $1, 0, 0, 1$. Sales
          followed the same rule, $y = 5 - x_1 + 2x_2$, giving $6, 3, 2, 3$.
          What is the simple slope of sales on price alone this time?
        expects: "-1"
        hint: >
          Centred sales are $2.5, -0.5, -1.5, -0.5$.
        feedback: >
          Cross-products with centred price:
          $-3.75 + 0.25 - 0.75 - 0.75 = -5$; divided by $5$ gives $-1$. The
          temperatures are uncorrelated with price ($\sum_i (x_{1i} - \bar{x}_1)
          x_{2i} = -1.5 + 1.5 = 0$), so $\tilde{x}_1$ is just centred price and
          the simple and multiple slopes agree.
      - ask: >
          Back to the first log: simple slope $+1.4$, multiple slope $-1$. A
          colleague says one of the two regressions must be wrong. What do
          you say?
        choices:
          - text: >
              The multiple one is wrong: adding a regressor cannot reverse a
              sign.
            feedback: >
              It just did, with exact arithmetic. A sign flip needs only that
              the added regressor moves with the first and pushes $y$ the
              other way hard enough.
          - text: >
              Both are right; they answer different questions — sales against
              price across days, and sales against price at fixed
              temperature.
            correct: true
            feedback: >
              Right. The $+1.4$ is honest about how sales co-move with price
              in this log; the $-1$ is the effect of price with the weather
              held fixed. Only the second answers the owner's question.
          - text: >
              The simple one is wrong, because it leaves a variable out.
            feedback: >
              It is correctly computed; it just answers "how do sales differ
              across days with different prices", which includes the weather.
              Wrong only as an answer to a question it never asked.
        feedback: >
          A coefficient's meaning depends on what else is in the regression.
          Change the set of regressors and you have changed the question.
      - teach: >
          Said aloud in an interview: "controlling for $x_2$" means taking the
          slope on the part of $x_1$ that $x_2$ cannot explain. Two things
          follow that interviewers like to probe. If $x_1$ is orthogonal to
          the others, $\tilde{x}_1 = x_1$ up to centring and nothing changes;
          and if $x_1$ is nearly explained by the others, $\tilde{x}_1$ is
          nearly zero, so the coefficient is estimated from a sliver of
          variation — which is where the trouble with correlated regressors
          begins.

  - node: quant-statistics.regression.multicollinearity
    hook: >
      Huge standard errors, coefficients that flip sign when you add a
      variable, and a suspiciously high overall R² is the desk symptom that
      should make you say "VIF," not "bad model."
    explanation: >
      Perfect collinearity — one regressor an exact linear combination of the
      others — makes $X'X$ singular and $\hat\beta$ non-unique; the classic
      trap is including an intercept together with indicators for every
      category of a dummy variable, one indicator too many. Near collinearity
      is the practical case: $\hat\beta$ still exists and stays unbiased, but
      its variance inflates.

      For regressor $j$ the variance inflation factor is
      $\operatorname{VIF}_j=1/(1-R_j^{2})$, where $R_j^{2}$ comes from
      regressing $x_j$ on every other regressor. The mechanism is the
      Frisch–Waugh–Lovell picture: when $x_j$ is nearly a linear
      combination of the others, its residualized part $\tilde x_j$ is
      nearly zero, and dividing by a near-zero sum of squares is what
      inflates the coefficient's variance. Predictions from the fitted model
      stay unaffected throughout — only the individual coefficients become
      unreadable.
    worked: >
      Two regressors with $R_j^{2}=0.99$ from regressing one on the other:
      $\operatorname{VIF}=1/(1-0.99)=100$. The coefficient's variance is
      $100$ times what it would be under orthogonal regressors, so its
      standard error is $\sqrt{100}=10$ times larger — a $t$-statistic that
      would have read $5$ under orthogonality now reads $0.5$, comfortably
      insignificant, even though nothing about the underlying relationship
      changed.
    interview: >
      "What do you do about multicollinearity?" wants you to separate perfect
      collinearity (a specification bug, usually a dummy trap) from near
      collinearity (a VIF diagnosis, and a call on whether you need
      interpretable coefficients or just predictions).
    pitfalls: >
      Dropping a "collinear" regressor because it looks individually
      insignificant, discarding real explanatory power. Forgetting
      predictions stay fine under multicollinearity — only the individual
      coefficients are unreliable.
    recap: >
      Correlated regressors leave the fit intact but multiply a
      coefficient's variance by $1/(1-R_j^{2})$, the VIF.
    dialogue:
      - part: Two signals that move together
        teach: >
          A desk regresses daily PnL $y$ on two momentum signals, a $10$-day
          one $x_1$ and a $12$-day one $x_2$, with an intercept. Over the
          sample, $\sum_i (x_{1i} - \bar{x}_1)^{2} = 50$, and regressing $x_1$
          on $x_2$ gives an $R^{2}$ of $0.8$ — the two signals mostly say the
          same thing.
      - ask: >
          By Frisch–Waugh–Lovell, $\hat{\beta}_1$ is the slope of $y$ on
          $\tilde{x}_1$, the residual of $x_1$ after $x_2$ is projected out.
          How large is $\sum_i \tilde{x}_{1i}^{2}$, the variation in $x_1$ left
          for that slope to use?
        expects: "10"
        hint: >
          $R^{2}$ is the share of $x_1$'s variation that $x_2$ explains; the
          residual sum of squares is the rest.
        feedback: >
          $R^{2} = 1 - \operatorname{SSR}/\operatorname{SST}$, so
          $\operatorname{SSR} = (1 - 0.8) \cdot 50 = 10$. Four fifths of what
          $x_1$ does, $x_2$ also does; the coefficient on $x_1$ can learn only
          from the other fifth.
      - ask: >
          The slope is $\hat{\beta}_1 = \sum_i c_i y_i$ with
          $c_i = \tilde{x}_{1i}/\sum_j \tilde{x}_{1j}^{2}$, so with independent
          errors of common variance $\sigma^{2}$ its variance is
          $\sigma^{2}\sum_i c_i^{2} = \sigma^{2}/\sum_i \tilde{x}_{1i}^{2}$. By
          what factor is it larger than it would be if $x_2$ were uncorrelated
          with $x_1$?
        expects: "5"
        hint: >
          Uncorrelated, nothing is projected out and the sum stays $50$.
        feedback: >
          $(\sigma^{2}/10)/(\sigma^{2}/50) = 5$. Same data, same noise, same
          $x_1$ — five times the variance, only because $x_2$ crowds it.
      - reflect: >
          You got $5$ from $R^{2} = 0.8$. Write the factor for a general
          $R^{2}$ of $x_1$ on the other regressors, and say what happens to it
          as the others come to explain $x_1$ completely.
        answer: >
          The leftover variation is $(1 - R^{2})$ times the total, and the
          variance divides by it, so the factor is $1/(1 - R^{2})$. At
          $R^{2} = 0.8$ that is $5$; at $0.99$ it is $100$; as $R^{2} \to 1$
          the leftover variation vanishes and the coefficient has nothing to
          learn from — its variance runs off to infinity, and at exactly
          $R^{2} = 1$ it is not determined at all.

      - part: Variance inflation, measured
        teach: >
          That factor is the variance inflation factor,
          $\operatorname{VIF}_j = 1/(1 - R_j^{2})$, where $R_j^{2}$ comes from
          regressing $x_j$ on all the other regressors. It multiplies the
          variance of $\hat{\beta}_j$, so the standard error grows by
          $\sqrt{\operatorname{VIF}_j}$. The estimate stays unbiased —
          collinearity costs precision, not centring. At $R_j^{2} = 1$, one
          regressor is an exact combination of the others, $X'X$ is singular,
          and $\hat{\beta}$ is not unique.
      - ask: >
          A third signal enters and pushes $R_1^{2}$, for $x_1$ on the other
          two, up to $0.95$. By what factor is the standard error of
          $\hat{\beta}_1$ now larger than under uncorrelated regressors? Four
          decimals.
        expects: "4.4721"
        tolerance: 0.001
        hint: >
          Find the VIF first, then take the square root.
        feedback: >
          $\operatorname{VIF} = 1/0.05 = 20$, and $\sqrt{20} \approx 4.4721$.
          A coefficient that would have shown a $t$ of $9$ now shows about
          $2$.
      - ask: >
          Turn it around. What $R_j^{2}$ exactly doubles a coefficient's
          standard error?
        expects: "0.75"
        hint: >
          Doubling the standard error means a VIF of $4$.
        feedback: >
          $1/(1 - R_j^{2}) = 4$ gives $1 - R_j^{2} = 0.25$, so $R_j^{2} =
          0.75$. Correlations that look high on a heat map are often only a
          mild tax; it is the last stretch toward $1$ that is ruinous.
      - ask: >
          Another model regresses a stock's return on buy volume, sell
          volume, and total volume, with an intercept. What happens?
        choices:
          - text: >
              The fit works, but the three volume coefficients have large
              standard errors.
            feedback: >
              That is near collinearity. Here total volume is buy plus sell on
              every row, so $R^{2} = 1$ exactly and the VIF is infinite — the
              fit does not merely wobble, it has no unique answer.
          - text: >
              $X'X$ is singular: adding $c$ to the buy and sell coefficients
              and subtracting $c$ from total leaves every fitted value
              unchanged.
            correct: true
            feedback: >
              Right. Infinitely many coefficient vectors fit equally well.
              Drop any one of the three columns and the fit becomes unique
              with no loss of explanatory power.
          - text: >
              Total volume takes all the weight and the other two get zero.
            feedback: >
              Nothing in least squares prefers that split over any other. The
              data cannot distinguish "total" from "buy plus sell", so
              software either fails or picks an arbitrary solution.
        feedback: >
          Perfect collinearity is a specification bug you fix in the design;
          near collinearity is a precision problem you diagnose with the VIF.

      - part: What survives the wobble
        ask: >
          Back to the two momentum signals. Fitted on January, the model gives
          $3x_1 - x_2$; refitted with February added, it gives $-x_1 + 3x_2$
          (intercepts zero in both). On a day with $x_1 = x_2 = 0.5$, what
          does the January fit predict?
        expects: "1"
        feedback: >
          $3(0.5) - 0.5 = 1$. The February fit gives $-0.5 + 1.5 = 1$ as well:
          both put a total weight of $2$ on a signal that the two momentum
          measures share.
      - ask: >
          The coefficients swung from $(3, -1)$ to $(-1, 3)$ while the
          prediction held still. What is the right reading?
        choices:
          - text: >
              The model is broken and its predictions cannot be trusted
              either.
            feedback: >
              On days like the ones in the sample, where the signals agree,
              both fits predict the same thing. Collinearity spoils the split
              between the coefficients, not the fitted values.
          - text: >
              The data pin down the sum of the two coefficients well and the
              split between them badly; predictions are fine wherever the
              signals keep their usual relation.
            correct: true
            feedback: >
              Right. And the caveat is in the last clause: on a day with
              $x_1 = 1$, $x_2 = 0$ the two fits predict $3$ and $-1$, because
              the sample never showed the signals disagreeing.
          - text: >
              The January fit is right, because it came first; February
              introduced noise.
            feedback: >
              Neither split is more right than the other. With the signals
              this close, a few new days can move the split anywhere along the
              line $\beta_1 + \beta_2 = 2$.
        feedback: >
          Collinearity makes individual coefficients unreadable while leaving
          the fit intact — the symptom is wild, sign-flipping coefficients
          beside a healthy overall $R^{2}$.
      - ask: >
          With both momentum signals in, neither coefficient has
          $\lvert t \rvert > 2$, yet the regression's $R^{2}$ is high. A
          junior proposes dropping both signals as insignificant. What do you
          say?
        choices:
          - text: >
              Agreed: an insignificant coefficient means the regressor does
              not matter.
            feedback: >
              Each $t$ asks whether a signal adds anything once the other is
              in. With two near-copies the answer to each is "not much", even
              though together they explain a lot. Drop both and the high
              $R^{2}$ goes with them.
          - text: >
              Keep one of the two: together they carry real signal, and
              either one alone will show it with a sensible standard error.
            correct: true
            feedback: >
              Right. Dropping one copy removes the crowding, the VIF of the
              survivor falls toward $1$, and its $t$ recovers. Keeping both is
              also fine if you only need predictions.
          - text: >
              Agreed, but only because a high $R^{2}$ is suspicious in
              finance.
            feedback: >
              A high $R^{2}$ beside insignificant individual $t$s is the
              classic collinearity signature, not evidence of a fluke. The
              signal is real; it just cannot be split.
        feedback: >
          In an interview, separate the two cases on sight: perfect
          collinearity is a design bug to fix, and near collinearity is a VIF
          diagnosis plus a decision — do you need readable coefficients, or
          only predictions?

  - node: quant-statistics.regression.gauss-markov
    hook: >
      "State Gauss–Markov" and "does OLS need normally distributed errors?"
      are asked in the same breath, and the second answer is no.
    explanation: >
      Four assumptions carry the theorem. Linearity in parameters: $y=X\beta
      +\varepsilon$ with $X$ of full column rank. Strict exogeneity:
      $\mathbb{E}[\varepsilon\mid X]=0$, so errors are mean-zero and
      uncorrelated with every regressor. Homoskedasticity:
      $\operatorname{Var}(\varepsilon_i\mid X)=\sigma^{2}$, the same for
      every $i$. No autocorrelation:
      $\operatorname{Cov}(\varepsilon_i,\varepsilon_j\mid X)=0$ for $i\ne j$.
      Under all four, OLS is unbiased and has the smallest variance among
      every estimator that is linear in $y$ and unbiased — it is BLUE.

      Normality of the errors appears nowhere in that list; it is needed only
      for exact $t$ and $F$ inference in small samples, not for BLUE itself.
      Both qualifiers in "best linear unbiased" bind hard: restricted to that
      class OLS cannot be beaten, but a biased estimator outside the class,
      such as ridge, can have strictly lower mean squared error.
    worked: >
      Suppose true $\beta=1$ and OLS is unbiased with
      $\operatorname{Var}(\hat\beta)=4$, so its MSE is $4$. Shrink it by
      half, $\tilde\beta=0.5\hat\beta$: this is biased,
      $\mathbb{E}[\tilde\beta]-\beta=0.5(1)-1=-0.5$, contributing a
      squared-bias term of $0.25$, but its variance drops to
      $0.25\times4=1$, for a total MSE of $1.25$ — far below OLS's $4$.
      Gauss–Markov never promised OLS beats every estimator; it promised OLS
      beats every linear unbiased one.
    interview: >
      Recite the four assumptions cold, and when asked "does OLS need normal
      errors," answer that BLUE holds regardless — normality is needed only
      for exact finite-sample $t$ and $F$ distributions.
    pitfalls: >
      Quoting Gauss–Markov as proof OLS is "best" full stop, forgetting the
      linear-and-unbiased restriction. Treating homoskedasticity and no
      autocorrelation as automatically true instead of assumptions to check.
    recap: >
      Under linearity, exogeneity, homoskedasticity and no autocorrelation,
      OLS is BLUE — best only among linear unbiased estimators, and normality
      is not required.
    dialogue:
      - part: Two honest ways to estimate a slope
        teach: >
          You run four calibration trades at sizes $x = 0, 1, 2, 3$ (hundreds
          of lots) and record the impact $y = 2, 3, 7, 8$. The model is
          $y_i = \beta_0 + \beta_1 x_i + \varepsilon_i$ with independent errors
          of mean zero and variance $\sigma^{2} = 1$. A junior proposes
          estimating $\beta_1$ by averaging the three step-to-step slopes,
          $y_2 - y_1$, $y_3 - y_2$ and $y_4 - y_3$.
      - ask: >
          What does the junior's estimator give on this data?
        expects: "2"
        hint: >
          The steps are $1$, $4$ and $1$.
        feedback: >
          $(1 + 4 + 1)/3 = 2$. Notice that the sum telescopes: the average is
          $(y_4 - y_1)/3 = (8 - 2)/3$, so the middle two trades cancel out of
          it entirely.
      - ask: >
          And the least-squares slope?
        expects: "2.2"
        hint: >
          Centred sizes are $-1.5, -0.5, 0.5, 1.5$; $\bar{y} = 5$.
        feedback: >
          Cross-products $(-1.5)(-3) + (-0.5)(-2) + (0.5)(2) + (1.5)(3) = 11$,
          squared centred sizes $5$, slope $11/5 = 2.2$.
      - ask: >
          Two different numbers from the same data. Which estimator is
          unbiased for $\beta_1$?
        choices:
          - text: >
              Only least squares; the junior's ignores two trades.
            feedback: >
              Ignoring data costs precision, not centring:
              $\mathbb{E}[(y_4 - y_1)/3] = (\beta_0 + 3\beta_1 - \beta_0)/3 =
              \beta_1$, using only that the errors have mean zero.
          - text: >
              Both of them.
            correct: true
            feedback: >
              Right. Each is a weighted sum $\sum_i c_i y_i$ whose weights
              kill the intercept and give $\beta_1$ weight one, so on average
              each lands on $\beta_1$. Unbiasedness cannot choose between
              them.
          - text: >
              Neither, since they disagree on this sample.
            feedback: >
              Unbiased means right on average over repeated samples, not right
              on each one. Two unbiased estimators disagree on almost every
              sample.
        feedback: >
          Mean-zero errors, uncorrelated with the sizes, are what make both
          weighted sums centre on $\beta_1$. To choose, you need a second
          criterion: how far each one scatters around $\beta_1$.

      - part: Which one scatters less
        ask: >
          The junior's estimator is $(y_4 - y_1)/3$. With independent errors
          of variance $1$, what is its variance? Four decimals.
        expects: "0.2222"
        tolerance: 0.0001
        hint: >
          The variance of $\sum_i c_i y_i$ is $\sum_i c_i^{2}$ times
          $\sigma^{2}$ when the errors are uncorrelated with equal variance.
        feedback: >
          Weights $-1/3, 0, 0, 1/3$, so the variance is
          $1/9 + 1/9 = 2/9 \approx 0.2222$.
      - ask: >
          The least-squares slope has weights $c_i = (x_i - \bar{x})/5$. What
          is its variance?
        expects: "0.2"
        feedback: >
          $\sum_i c_i^{2} = (2.25 + 0.25 + 0.25 + 2.25)/25 = 5/25 = 0.2$.
          Least squares scatters less, $0.2$ against $0.2222$, because it puts
          weight on every trade instead of two.
      - reflect: >
          Any estimator of the form $\sum_i c_i y_i$ can be scored the same
          way. What conditions on the weights make it unbiased, and among
          weights meeting those conditions, what are you trying to make as
          small as possible? Say why the answer might be least squares.
        hint: >
          Write $\mathbb{E}[\sum_i c_i y_i]$ in terms of $\beta_0$ and
          $\beta_1$.
        answer: >
          Unbiasedness for every $\beta_0, \beta_1$ needs $\sum_i c_i = 0$ and
          $\sum_i c_i x_i = 1$. Among such weights you minimize
          $\sigma^{2}\sum_i c_i^{2}$ — the shortest weight vector on a
          constraint set. The minimizer is proportional to $x_i - \bar{x}$,
          which is exactly the least-squares weights: spread the weight over
          every point, in proportion to how far it sits from the centre.
      - teach: >
          That is the Gauss–Markov theorem. Assume (1) linearity,
          $y = X\beta + \varepsilon$ with $X$ of full column rank; (2) strict
          exogeneity, $\mathbb{E}[\varepsilon \mid X] = 0$; (3)
          homoskedasticity, $\operatorname{Var}(\varepsilon_i \mid X) =
          \sigma^{2}$ for every $i$; (4) no autocorrelation,
          $\operatorname{Cov}(\varepsilon_i, \varepsilon_j \mid X) = 0$ for
          $i \ne j$. Then OLS has the smallest variance among all estimators
          that are linear in $y$ and unbiased: it is BLUE, the best linear
          unbiased estimator.

      - part: Which assumption does which job
        ask: >
          The scoring step was $\operatorname{Var}(\sum_i c_i y_i) =
          \sigma^{2} \sum_i c_i^{2}$. Which assumptions did that step use?
        choices:
          - text: >
              Normal errors.
            feedback: >
              The variance of a weighted sum needs only variances and
              covariances; the shape of the error distribution never enters.
              Normality is nowhere in the theorem — it buys exact $t$ and $F$
              tests in small samples, not BLUE.
          - text: >
              Strict exogeneity.
            feedback: >
              Exogeneity did the earlier job: it made both estimators centre
              on $\beta_1$. The variance formula is about how the errors
              scatter, not where they centre.
          - text: >
              Homoskedasticity and no autocorrelation.
            correct: true
            feedback: >
              Right. Equal variances let you pull out a single $\sigma^{2}$,
              and zero covariances kill the cross terms
              $2c_ic_j\operatorname{Cov}(\varepsilon_i, \varepsilon_j)$.
          - text: >
              Full column rank.
            feedback: >
              Full rank makes the OLS weights exist at all. It says nothing
              about how the errors scatter.
        feedback: >
          Exogeneity gives unbiasedness; homoskedasticity and no
          autocorrelation give the clean variance formula, and with it the
          "best". Drop either of those two and the ranking can change.
      - ask: >
          Break homoskedasticity: the trade at $x = 3$ now has error variance
          $9$, the other three still $1$. What is the variance of the
          least-squares slope now?
        expects: "0.92"
        hint: >
          Each $c_i^{2}$ is now multiplied by its own error variance.
        feedback: >
          $(2.25 + 0.25 + 0.25)/25 + 9 \cdot 2.25/25 = 2.75/25 + 20.25/25 =
          23/25 = 0.92$. The noisy trade carries the largest weight.
      - ask: >
          Now take the estimator $(y_3 - y_1)/2$, which skips the noisy
          trade. It is still linear and unbiased. What is its variance?
        expects: "0.5"
        feedback: >
          Weights $-1/2, 0, 1/2, 0$, both on trades with variance $1$:
          $0.25 + 0.25 = 0.5$, well under OLS's $0.92$. Without
          homoskedasticity OLS is still unbiased but no longer best — a
          weighting that discounts the noisy point wins.
      - ask: >
          Back to equal variances, where OLS has variance $0.2$. Suppose the
          true slope is $\beta_1 = 0.5$ and you report $0.8\hat{\beta}_1$
          instead. Does Gauss–Markov guarantee this has larger mean squared
          error than OLS?
        choices:
          - text: >
              Yes: OLS is best, so any other estimator does worse.
            feedback: >
              Best only among linear *unbiased* estimators. Here the bias is
              $0.8(0.5) - 0.5 = -0.1$, squared $0.01$, and the variance is
              $0.64 \cdot 0.2 = 0.128$: mean squared error $0.138$, under
              OLS's $0.2$.
          - text: >
              No: the shrunk estimator is biased, so the theorem says nothing
              about it, and here its mean squared error is lower.
            correct: true
            feedback: >
              Right: $0.01 + 0.128 = 0.138 < 0.2$. Shrinkage trades a little
              bias for a lot of variance, which is the idea behind ridge.
          - text: >
              No: the shrunk estimator is not linear in $y$.
            feedback: >
              It is linear: $0.8\sum_i c_i y_i$ is still a weighted sum of the
              $y_i$. What takes it outside the theorem is the bias.
        feedback: >
          Both qualifiers bind. In an interview, say it in one breath: "Under
          linearity, exogeneity, homoskedasticity and no autocorrelation, OLS
          is best among linear unbiased estimators. No normality needed, and a
          biased estimator can still beat it on mean squared error."

  - node: quant-statistics.regression.slope-inference
    hook: >
      "How do you make a beta estimate more precise?" has three levers, and
      naming only "more data" leaves two of them on the table.
    explanation: >
      Under the Gauss–Markov assumptions,
      $\operatorname{Var}(\hat\beta_1\mid x)=\sigma^{2}/\sum_i(x_i-\bar
      x)^{2}$, estimated by substituting
      $\hat\sigma^{2}=\sum_i e_i^{2}/(n-2)$. Read the three levers directly
      off the formula: precision improves like $1/\sqrt{n}$ as data
      accumulates, improves with the spread of the regressor — never fit a
      slope over a narrow range of $x$ — and degrades with residual noise.

      The reported statistic is $t=\hat\beta_1/\operatorname{se}
      (\hat\beta_1)$, compared against a $t$ distribution on $n-2$ degrees of
      freedom, with $\lvert t\rvert>2$ as the rough screen. That formula for
      the standard error is only as good as the assumptions behind it: if
      homoskedasticity or no-autocorrelation fails, this is the wrong number
      to trust even though $\hat\beta_1$ itself remains a perfectly fine
      estimate.
    worked: >
      Continue the fit ($\hat\beta_1=0.6$, $\sum_i(x_i-\bar x)^{2}=10$,
      $\hat\sigma^{2}=0.8$ from $n-2=3$ residual degrees of freedom). The
      standard error is $\sqrt{0.8/10}=\sqrt{0.08}\approx0.283$, giving
      $t=0.6/0.283\approx2.12$ on $3$ degrees of freedom — just past the
      rough $\lvert t\rvert>2$ screen, worth a second look rather than
      dismissal, though with only five points the exact $p$-value should do
      the real work.
    interview: >
      "How do you know if a slope is significant?" wants
      $t=\hat\beta_1/\operatorname{se}(\hat\beta_1)$ cold. "How would you get
      a more precise beta?" wants all three levers, not just sample size.
    pitfalls: >
      Trusting this standard-error formula after diagnosing heteroskedasticity
      or autocorrelation — it assumes Gauss–Markov holds, and if it doesn't
      the number is simply wrong regardless of how significant it looks.
      Fitting a slope over a narrow range of $x$ and expecting a tight
      estimate.
    recap: >
      A slope's precision improves with more data, wider regressor spread,
      and less noise; the $t$-statistic packages all three as slope over
      standard error.
    dialogue:
      - part: How far can a slope wobble
        teach: >
          You want a stock's sensitivity to a factor and may pick three days
          to fit it on. Either days when the factor moved $-1$, $0$ and $+1$
          percent, or days when it moved $-3$, $0$ and $+3$ percent. The
          regression errors are independent with variance $\sigma^{2} = 2$
          either way.
      - ask: >
          On the narrow days the least-squares slope is $\sum_i c_i y_i$ with
          $c_i = (x_i - \bar{x})/\sum_j (x_j - \bar{x})^{2}$. What is its
          variance?
        expects: "1"
        hint: >
          The weights are $-1/2$, $0$ and $1/2$; the variance of
          $\sum_i c_i y_i$ is $\sigma^{2}\sum_i c_i^{2}$.
        feedback: >
          $\sum_i (x_i - \bar{x})^{2} = 2$, so the weights are $\mp 1/2$ and
          the variance is $2(1/4 + 1/4) = 1$. A standard error of $1$ on a
          beta is useless.
      - ask: >
          And on the wide days?
        expects: "1/9"
        tolerance: 0.0005
        feedback: >
          $\sum_i (x_i - \bar{x})^{2} = 18$, the weights are $\mp 1/6$, and
          the variance is $2(1/36 + 1/36) = 1/9$. Same number of days, same
          noise, nine times less variance.
      - reflect: >
          Both answers came out as $\sigma^{2}$ divided by something. Divided
          by what? And what does that tell you about which days you should
          want in a sample, beyond simply wanting more of them?
        answer: >
          By $\sum_i (x_i - \bar{x})^{2}$: the variance of the slope is
          $\sigma^{2}/\sum_i (x_i - \bar{x})^{2}$. Spreading the $x$ values
          out tripled every deviation and divided the variance by $9$. A slope
          is a ratio of a rise to a run, and noise of a fixed size distorts a
          long run far less than a short one, so days on which the regressor
          barely moved add almost nothing.
      - teach: >
          Under the Gauss–Markov assumptions the slope has
          $\operatorname{Var}(\hat{\beta}_1 \mid x) =
          \sigma^{2}/\sum_i (x_i - \bar{x})^{2}$. Three levers: more data
          grows the denominator, wider regressor spread grows it faster, and
          less noise shrinks the numerator. $\sigma^{2}$ is unknown, so
          substitute $\hat{\sigma}^{2} = \sum_i e_i^{2}/(n - 2)$; the square
          root is the standard error, and the reported statistic is
          $t = \hat{\beta}_1/\operatorname{se}(\hat{\beta}_1)$, read against a
          $t$ distribution on $n - 2$ degrees of freedom, with
          $\lvert t \rvert > 2$ as the rough screen.

      - part: From a variance to a verdict
        ask: >
          A fit on $n = 17$ days reports $\hat{\beta}_1 = 0.9$,
          $\sum_i (x_i - \bar{x})^{2} = 36$ and a residual sum of squares
          $\sum_i e_i^{2} = 60$. What is $\hat{\sigma}^{2}$?
        expects: "4"
        hint: >
          Divide by the residual degrees of freedom, not by $n$.
        feedback: >
          $60/(17 - 2) = 60/15 = 4$.
      - ask: >
          What is the standard error of $\hat{\beta}_1$? Four decimals.
        expects: "0.3333"
        tolerance: 0.0005
        feedback: >
          $\sqrt{4/36} = 2/6 = 1/3 \approx 0.3333$.
      - ask: >
          And the $t$-statistic?
        expects: "2.7"
        tolerance: 0.001
        feedback: >
          $0.9/(1/3) = 2.7$: the slope sits $2.7$ standard errors from zero,
          past the rough screen, on $15$ degrees of freedom.
      - ask: >
          Why does $\hat{\sigma}^{2}$ divide by $n - 2$ rather than $n$?
        choices:
          - text: >
              It is a convention; dividing by $n$ would be just as good.
            feedback: >
              Dividing by $n$ is biased low. Through two points any line has
              residuals of exactly zero, whatever the true noise — the fit
              always eats some of it.
          - text: >
              The residuals obey two linear constraints from the normal
              equations, $\sum_i e_i = 0$ and $\sum_i x_i e_i = 0$, so only
              $n - 2$ of them are free and their squares run small.
            correct: true
            feedback: >
              Right. Fitting two parameters pulls the line toward the data and
              uses up two dimensions of the residual vector; dividing by
              $n - 2$ makes $\hat{\sigma}^{2}$ unbiased.
          - text: >
              To make the estimate more conservative against outliers.
            feedback: >
              The correction has nothing to do with outliers; one bad point
              inflates $\sum_i e_i^{2}$ whatever you divide by. It corrects
              for the fit itself shrinking the residuals.
        feedback: >
          The residuals are not the errors: they are the errors after the fit
          has bent toward them, and $n - 2$ is the price of the two
          coefficients.

      - part: Three levers, and when the formula lies
        ask: >
          A risk manager wants the standard error of a beta halved. Which
          proposal does *not* do it?
        choices:
          - text: >
              Four times as many days, with the factor's spread unchanged.
            feedback: >
              $\sum_i (x_i - \bar{x})^{2}$ grows fourfold, the variance falls
              to a quarter, and the standard error halves. This one works.
          - text: >
              The same number of days, chosen from a period when the factor's
              standard deviation was twice as large.
            feedback: >
              Doubling every deviation quadruples
              $\sum_i (x_i - \bar{x})^{2}$, so the standard error halves
              without a single extra day. This one works.
          - text: >
              Twice as many days, with the factor's spread unchanged.
            correct: true
            feedback: >
              Right: the variance halves, so the standard error only falls by
              $\sqrt{2}$, to about $71$ percent. Precision improves like
              $1/\sqrt{n}$.
          - text: >
              A better model of the stock that halves the residual standard
              deviation.
            feedback: >
              $\sigma$ halves, so $\sigma^{2}$ falls to a quarter and so does
              the variance: the standard error halves. This one works.
        feedback: >
          More data is the slowest of the three levers. Spread in the
          regressor and a quieter residual are often cheaper.
      - ask: >
          The $t$ of $2.7$ came from that $17$-day fit. You then notice the
          residuals are tiny on calm days and huge on the days the factor
          moved most. What is the honest reading?
        choices:
          - text: >
              The slope $0.9$ is now biased, so the whole fit must be redone.
            feedback: >
              Unequal error variances do not move the centre of the
              estimator; $\hat{\beta}_1$ is still unbiased. What fails is the
              formula for its spread.
          - text: >
              The slope is fine, but the standard error assumed one
              $\sigma^{2}$ for every day, so the $2.7$ is not to be trusted
              until it is recomputed.
            correct: true
            feedback: >
              Right. The formula $\sigma^{2}/\sum_i (x_i - \bar{x})^{2}$ used
              homoskedasticity, and here the noisiest days are exactly the
              wide-$x$ days that carry the most weight, so the true standard
              error is larger than reported.
          - text: >
              Nothing changes, because $t$ above $2$ is significant whatever
              the residuals look like.
            feedback: >
              The $t$ is only as good as its denominator, and the denominator
              was built on equal variances. A wrong standard error makes any
              threshold meaningless.
        feedback: >
          In an interview, say it in that order: the slope, its standard error
          $\hat{\sigma}/\sqrt{\sum_i (x_i - \bar{x})^{2}}$, the $t$ on $n - 2$
          degrees of freedom — and the assumptions that standard error rests
          on.

  - node: quant-statistics.regression.residual-diagnostics
    hook: >
      "How do you check your regression?" is answered by naming the plots,
      not by quoting R² — R² cannot catch any of what a residual plot can.
    explanation: >
      Plot residuals against fitted values, against each regressor, and
      against time before believing any coefficient. Four signatures are
      worth recognizing on sight. Curvature — a systematic U or arch — means
      a missing nonlinear term, so add $x^{2}$ or take logs. A funnel
      widening with the fitted value means non-constant error variance. Slow
      drift or long runs of same-signed residuals in time order means
      serially correlated errors, which is the norm rather than the
      exception in financial data. Isolated large residuals mean outliers,
      though leverage is the sharper tool for finding the ones that matter.

      A normal quantile plot separately checks the tail shape that
      small-sample inference relies on. What none of these plots can check is
      exogeneity: residuals are orthogonal to the regressors as an algebraic
      identity of the fit, so a clean-looking residual plot proves nothing
      about whether the true errors are uncorrelated with $x$.
    worked: >
      Residuals against fitted value show $(\hat y,e)$ pairs
      $(10,0.4),(20,-0.9),(30,2.1),(40,-5.8)$: the residual magnitude grows
      two- to three-fold every time $\hat y$ jumps by $10$ — a funnel, not
      noise. Refitting with $\log y$ as the target instead of $y$ compresses
      that fan, the standard fix when spread scales with the level rather
      than staying flat.
    interview: >
      "How do you check your regression?" wants the four-plot walkthrough.
      "How would you spot heteroskedasticity visually?" wants the funnel
      shape by name.
    pitfalls: >
      Reading a clean residual-versus-fitted plot as proof of correct
      exogeneity — that plot can never show it, since orthogonality is
      guaranteed by construction; it can only reveal nonlinearity, variance
      patterns, or outliers.
    recap: >
      Curvature, funnels, time-order runs, and outliers are what a residual
      plot can catch; exogeneity is not one of them.
    dialogue:
      - part: A line that misses in a pattern
        teach: >
          A credit desk fits a bond's spread $y$, in tens of basis points,
          against its maturity $x$ in years. Five bonds: maturities
          $1, 2, 3, 4, 5$ and spreads $2, 2, 3, 5, 8$. The least-squares line
          is $\hat{y} = -0.5 + 1.5x$.
      - ask: >
          What is the residual $e = y - \hat{y}$ for the $3$-year bond?
        expects: "-1"
        feedback: >
          $\hat{y} = -0.5 + 4.5 = 4$, and $3 - 4 = -1$. In maturity order the
          five residuals are $1, -0.5, -1, -0.5, 1$.
      - ask: >
          Residuals $1, -0.5, -1, -0.5, 1$, in order of maturity. What are
          they telling you?
        choices:
          - text: >
              Nothing: they sum to zero, so the line is unbiased.
            feedback: >
              They sum to zero for every least-squares fit with an intercept;
              that is arithmetic, not a verdict. The pattern is in the order:
              positive at both ends, negative in the middle.
          - text: >
              The noise grows with maturity.
            feedback: >
              The sizes are $1, 0.5, 1, 0.5, 1$ — no steady widening. What
              repeats is the sign: up, down, down, down, up.
          - text: >
              The spread curve bends, and a straight line cannot follow it:
              the model is missing a curvature term.
            correct: true
            feedback: >
              Right. A line through a convex curve sits above it in the middle
              and below it at the ends, so the residuals trace a U. Adding
              $x^{2}$ as a column, or modelling $\log y$, is the repair.
          - text: >
              The $1$-year and $5$-year bonds are outliers.
            feedback: >
              An outlier is one point out of line with the rest. Here the two
              ends miss by the same amount and in the same direction, which is
              shape, not an isolated bad print.
        feedback: >
          A U or an arch in the residuals is curvature the model did not
          include.
      - reflect: >
          With five bonds you could have seen the bend in the raw scatter. With
          two hundred bonds and a steep slope, the bend is a few percent of
          the trend and the scatter looks straight. Why does a plot of the
          residuals show it when the plot of $y$ against $x$ hides it?
        answer: >
          The residual is $y$ with the fitted line subtracted, so the dominant
          trend — the part the model did capture — is gone, and what is left
          is everything it failed to capture, on a scale chosen for that
          leftover alone. If the model is right the leftover is shapeless
          noise; any visible structure in it is a feature of the data the
          model left out.

      - part: Four shapes and what each means
        teach: >
          That is why the residual plot is the first check on any fit, made
          before you believe a single coefficient: residuals against the
          fitted values, against each regressor, and against time. The U you
          just read is one signature, a missing nonlinear term. Three others
          matter, and each is a different statement about the errors.
      - ask: >
          A daily regression's residuals, in time order, are $+0.3$, $+0.5$,
          $+0.4$, $+0.2$, $-0.1$, $-0.4$, $-0.6$, $-0.3$. How many times does
          the sign change from one day to the next?
        expects: "1"
        feedback: >
          Four positives, then four negatives: one change, between the fourth
          and fifth day.
      - ask: >
          If the residuals behaved like independent noise, each neighbouring
          pair would differ in sign with probability one half. How many sign
          changes would you expect across these eight days?
        expects: "3.5"
        hint: >
          Count the neighbouring pairs.
        feedback: >
          Seven pairs times one half is $3.5$. Seeing only one is a run
          pattern: the chance of at most one change among seven fair pairs is
          $(1 + 7)/128 = 1/16$.
      - ask: >
          The same residuals plotted against fitted values look shapeless.
          What does the time-order plot add?
        choices:
          - text: >
              Nothing new: the fitted-value plot is clean, so the model is
              fine.
            feedback: >
              The fitted-value plot cannot see order in time. Shuffle the days
              and it looks the same; the time plot is the only one that
              notices that a positive miss is followed by another.
          - text: >
              The errors are serially correlated: today's miss predicts
              tomorrow's, the usual state of financial data.
            correct: true
            feedback: >
              Right. Long same-signed runs mean the errors are not independent
              across days — something slow-moving and unmodelled is pushing
              all of them the same way for a while.
          - text: >
              The fourth and fifth days are outliers, since that is where the
              sign flips.
            feedback: >
              Those residuals are $+0.2$ and $-0.1$, the two smallest in the
              series. A sign change is not a large miss.
        feedback: >
          Each plot answers one question. Against fitted values: shape and
          spread. Against time: dependence.
      - ask: >
          A fit of trading cost on order size shows residuals within
          $\pm 0.2$ basis points for the smallest predicted costs and within
          $\pm 2$ for the largest, widening steadily in between. Which reading
          and repair fit?
        choices:
          - text: >
              Curvature: add the square of order size as a regressor.
            feedback: >
              Curvature moves the centre of the residuals up and down with the
              fitted value. Here the centre stays at zero and only the width
              changes.
          - text: >
              A funnel: the error variance grows with the level, and modelling
              $\log$ cost is the usual repair.
            correct: true
            feedback: >
              Right. When the noise scales with the size of $y$, working with
              $\log y$ turns proportional errors into errors of a constant
              size.
          - text: >
              Outliers at the large end: drop the biggest orders.
            feedback: >
              The whole right side is wide, not one or two points. Dropping the
              big orders throws away the regime you most need the model for.
        feedback: >
          A funnel is a statement about the spread of the errors, not their
          centre. That makes four signatures: a U for missing curvature, a
          funnel for non-constant variance, runs in time for correlated
          errors, and an isolated large residual for an outlier. A normal
          quantile plot of the residuals adds a check on the tails that
          small-sample inference leans on.

      - part: The one thing no plot can show
        ask: >
          Back to the bonds: maturities $1$ to $5$, residuals
          $1, -0.5, -1, -0.5, 1$. What is $\sum_i x_i e_i$?
        expects: "0"
        feedback: >
          $1 - 1 - 3 - 2 + 5 = 0$. Exactly zero, and it would have been
          exactly zero for any five spreads: the normal equations force
          $\sum_i x_i e_i = 0$ in every least-squares fit.
      - ask: >
          A colleague plots residuals against maturity, sees no trend, and
          concludes that maturity is uncorrelated with the true errors, so
          the slope is not picking up anything left out of the model. What do
          you say?
        choices:
          - text: >
              Agreed: if the errors moved with maturity, the residuals would
              too.
            feedback: >
              The fit chose the slope precisely to make the residuals
              uncorrelated with maturity. Any part of the true error that
              moved with maturity was absorbed into the slope, leaving nothing
              in the residuals to see.
          - text: >
              The plot can't show it: residuals are uncorrelated with every
              regressor by construction, so a flat trend is guaranteed and
              carries no information about the true errors.
            correct: true
            feedback: >
              Right. Exogeneity is a claim about the unobservable errors, and
              the residuals were built to be orthogonal to the regressors.
              Only an argument about the data — or a variable outside the
              model — can test it.
          - text: >
              Agreed, provided the residual plot is also free of curvature and
              funnels.
            feedback: >
              A clean plot rules out curvature, funnels and runs. It is silent
              on exogeneity whatever else it shows.
        feedback: >
          In an interview: name the plots and the four shapes, then say the
          one limit — residuals are orthogonal to the regressors by
          arithmetic, so no residual plot can ever confirm exogeneity.

  - node: quant-statistics.regression.heteroskedasticity
    hook: >
      A $t$-statistic of $3$ can be lying to you, and it is usually lying in
      the same direction — making a marginal signal look real.
    explanation: >
      Drop homoskedasticity or no-autocorrelation and OLS remains unbiased
      and consistent, but it is no longer BLUE, and — the part that actually
      bites at a desk — the textbook standard errors are wrong, usually too
      small, so $t$-statistics come out overstated. Coefficients stay
      trustworthy; the honesty of the uncertainty around them does not.

      The repairs that matter keep $\hat\beta$ exactly as computed and fix
      only the variance estimate: White's heteroskedasticity-consistent
      standard errors, or Newey–West when errors are also serially
      correlated. Weighted least squares, dividing each observation by its
      error standard deviation, restores full efficiency when the variance
      pattern is actually known, which is rare in practice. In finance both
      violations are close to the default — volatility clusters over time,
      and overlapping return windows manufacture autocorrelation — so robust
      standard errors should be the habit, not a remedy reached for only
      after a problem is spotted.
    worked: >
      Suppose the textbook formula reports $\operatorname{se}
      (\hat\beta_1)=0.1$ with $\hat\beta_1=0.3$, so $t=3$ and the slope looks
      solidly significant. If the errors are actually heteroskedastic,
      White's correction might report the true $\operatorname{se}=0.25$
      instead, giving $t=0.3/0.25=1.2$ — a coefficient that no longer clears
      even the rough $\lvert t\rvert>2$ screen. The point estimate $0.3$
      never moved; only the honesty of the uncertainty around it did.
    interview: >
      "What happens to OLS under heteroskedasticity?" wants: still unbiased
      and consistent, no longer efficient, standard errors wrong. "How do you
      fix it?" wants White or Newey–West, not a different point estimate.
    pitfalls: >
      "Fixing" heteroskedasticity by refitting a different point estimate —
      the correct fix touches only the standard errors. Ignoring
      autocorrelation in overlapping-window return regressions, a default
      problem in finance that Newey–West specifically targets.
    recap: >
      Non-spherical errors leave OLS's coefficients fine but its standard
      errors wrong; reach for White or Newey–West rather than the textbook
      formula.
    dialogue:
      - part: Noise that grows with the signal
        teach: >
          A desk regresses next-day return $y$ on a signal $x$, with an
          intercept, on four days with $x = -2, -1, 1, 2$. On the two
          strong-signal days the error variance is $9$; on the two weak days it
          is $1$. Errors are independent with mean zero. The fit reports
          $\hat{\beta}_1 = 2$, and the slope is $\sum_i c_i y_i$ with weights
          $c_i = x_i/10$.
      - ask: >
          With error variances this unequal, is $\hat{\beta}_1$ still an
          unbiased estimate of the true slope?
        choices:
          - text: >
              No: the large errors on the strong days drag the slope around.
            feedback: >
              They make it scatter more, in both directions equally. The
              expectation $\sum_i c_i(\beta_0 + \beta_1 x_i) + \sum_i c_i
              \mathbb{E}[\varepsilon_i]$ is still $\beta_1$, because every
              $\mathbb{E}[\varepsilon_i] = 0$.
          - text: >
              Yes: unbiasedness used only that the errors have mean zero
              given $x$, and that still holds.
            correct: true
            feedback: >
              Right. Equal variances never entered the proof of
              unbiasedness; they entered only the variance calculation.
          - text: >
              No: Gauss–Markov needs homoskedasticity, so without it nothing
              about OLS survives.
            feedback: >
              Homoskedasticity is needed for the "best" in BLUE and for the
              usual variance formula. Exogeneity alone delivers the
              "unbiased".
        feedback: >
          The centre of $\hat{\beta}_1$ is untouched. The question is what
          happens to its spread, and to the number you report for it.
      - ask: >
          What is the true variance of $\hat{\beta}_1$?
        expects: "0.74"
        hint: >
          With independent errors, $\operatorname{Var}(\sum_i c_i y_i) =
          \sum_i c_i^{2}\sigma_i^{2}$, each weight paired with its own
          variance.
        feedback: >
          The strong days contribute $2 \cdot (0.2)^{2} \cdot 9 = 0.72$ and
          the weak days $2 \cdot (0.1)^{2} \cdot 1 = 0.02$, so the variance is
          $0.74$.
      - ask: >
          The textbook formula assumes one $\sigma^{2}$ for every day and
          divides it by $\sum_i x_i^{2} = 10$. Plugging in the average error
          variance, $5$, what variance does it report?
        expects: "0.5"
        feedback: >
          $5/10 = 0.5$, against a true $0.74$. The reported standard error is
          $\sqrt{0.5} \approx 0.71$ when the truth is $\sqrt{0.74} \approx
          0.86$.
      - reflect: >
          The textbook number is too small here. Looking at where the noise
          sits and where the weights $c_i$ are large, explain why — and
          describe a pattern of variances for which the textbook number would
          be too *large* instead.
        answer: >
          The true variance weights each day's error variance by $c_i^{2}$,
          and $c_i^{2}$ is largest on the far-out days. Here the noisy days
          are exactly the far-out ones, so the noise lands where the slope
          listens hardest; the textbook formula spreads the variance evenly
          and misses that. Put the large variance on the central days instead
          and the noise falls where the weights are small, and the textbook
          number overstates. In finance noise and extreme regressor values
          tend to come together, so too small is the usual error.

      - part: The slope is fine; the error bar is not
        teach: >
          That is heteroskedasticity, and dropping the no-autocorrelation
          assumption does the same damage. OLS stays unbiased and consistent,
          but it is no longer best, and the textbook standard errors are wrong
          — in finance usually too small, so $t$-statistics are overstated.
          The repairs keep $\hat{\beta}$ and fix only its variance estimate:
          White's heteroskedasticity-consistent standard errors put each
          squared residual in place of $\sigma_i^{2}$ in
          $\sum_i c_i^{2}\sigma_i^{2}$, and Newey–West adds terms for errors
          correlated across nearby observations.
      - ask: >
          Suppose White's estimate lands on the true variance, $0.74$. What
          is the honest $t$-statistic for $\hat{\beta}_1 = 2$? Three
          decimals.
        expects: "2.325"
        tolerance: 0.001
        hint: >
          Divide the slope by $\sqrt{0.74}$.
        feedback: >
          $2/\sqrt{0.74} = 2/0.8602 \approx 2.325$, against the textbook
          $2/\sqrt{0.5} \approx 2.828$. Same slope, less than it claimed.
      - ask: >
          Now flip the pattern: variance $1$ on the strong days and $9$ on the
          weak ones. What is the true variance of $\hat{\beta}_1$?
        expects: "0.26"
        feedback: >
          $2 \cdot 0.04 \cdot 1 + 2 \cdot 0.01 \cdot 9 = 0.08 + 0.18 = 0.26$,
          below the textbook $0.5$. The textbook formula is not
          conservative; it is wrong in whichever direction the variance
          pattern points.
      - ask: >
          Back to the original pattern. A junior proposes three fixes. Which
          one is right?
        choices:
          - text: >
              Refit with a different estimator, since the unequal variances
              have biased the slope.
            feedback: >
              The slope is unbiased — that was the first thing you checked.
              Swapping the estimator answers a problem the fit does not have
              and leaves the reported error bar as wrong as before.
          - text: >
              Keep $\hat{\beta}_1 = 2$ and report White standard errors.
            correct: true
            feedback: >
              Right. The slope was never the problem; its error bar was.
              Robust standard errors fix the bar and leave the estimate
              alone.
          - text: >
              Keep the textbook formula but collect more data; with enough
              days the problem averages out.
            feedback: >
              More days shrink both numbers, but the textbook one stays wrong
              by the same ratio, $0.5$ against $0.74$ here. The formula
              estimates the wrong quantity, so more data only makes it
              precisely wrong.
        feedback: >
          Fix the variance estimate, not the coefficient.
      - part: Beating OLS, and errors that remember
        ask: >
          If the variances $9$ and $1$ were actually known, weighted least
          squares would divide each day by its error standard deviation. With
          weights $1/\sigma_i^{2}$, its slope has variance
          $1/\sum_i (x_i^{2}/\sigma_i^{2})$ here. What is it? Four decimals.
        expects: "0.3462"
        tolerance: 0.0005
        hint: >
          The strong days contribute $4/9$ each, the weak days $1$ each.
        feedback: >
          $1/(4/9 + 1 + 1 + 4/9) = 1/(26/9) = 9/26 \approx 0.3462$, under
          half of OLS's $0.74$. That gap is what "no longer best" means:
          a linear unbiased estimator that listens less to the noisy days
          beats OLS.
      - ask: >
          A different regression uses a signal that changes slowly, and its
          residuals show long same-signed runs in time order. Which repair
          fits?
        choices:
          - text: >
              White standard errors.
            feedback: >
              White handles unequal variances but still assumes each day's
              error is uncorrelated with the next. Runs mean they are
              correlated, and the covariance terms White leaves out are
              positive here.
          - text: >
              Newey–West standard errors.
            correct: true
            feedback: >
              Right. Newey–West adds the covariances between nearby errors.
              With a persistent signal and persistent errors those
              covariances are positive, and leaving them out makes the
              textbook standard error far too small.
          - text: >
              No repair: autocorrelation does not affect standard errors.
            feedback: >
              The variance of $\sum_i c_i y_i$ includes
              $2\sum_{i < j} c_i c_j \operatorname{Cov}(\varepsilon_i,
              \varepsilon_j)$. Neighbouring days with similar $x$ have similar
              weights, so positively correlated errors add a large positive
              term.
        feedback: >
          In an interview: "Coefficients still unbiased, no longer efficient,
          standard errors wrong — use White, or Newey–West if the errors are
          serially correlated." In finance both problems are the default, so
          robust standard errors are a habit, not a remedy.

  - node: quant-statistics.regression.outliers-leverage
    hook: >
      The single most influential point in your data often has one of the
      smallest residuals on the page, which is exactly why the residual plot
      alone will not catch it.
    explanation: >
      The leverage of observation $i$ is the diagonal hat value $h_{ii}\in
      [0,1]$, averaging $(k+1)/n$ across the sample. It measures how far
      $x_i$ sits from the centre of the regressor cloud and involves $y$ not
      at all — a point can have enormous leverage while landing exactly on
      the eventual fitted line. Influence is leverage combined with a poor
      fit: an observation with $h_{ii}$ near $1$ pulls the fitted surface
      onto itself, and one such point can manufacture or erase an apparent
      relation entirely.

      The trap is that $\operatorname{Var}(e_i)=\sigma^{2}(1-h_{ii})$, so
      high-leverage points mechanically generate small residual variance and
      hide inside a residual-versus-fitted plot — leverage has to be checked
      as its own diagnostic, separately from the residual plots. Standard
      responses are to report the fit with and without the point,
      winsorize, or switch to a robust loss. In market data, one gap day or
      one bad print is the usual culprit.
    worked: >
      A five-point simple regression has average leverage
      $(1+1)/5=0.4$. Suppose one $x$ sits far from the rest and carries
      leverage $h_{ii}=0.9$. With $\hat\sigma^{2}=0.8$ for this fit, its
      residual variance is only $0.8(1-0.9)=0.08$, versus
      $0.8(1-0.2)=0.64$ for a typical point at $h_{ii}=0.2$ — a residual
      standard deviation nearly three times smaller. That point could be
      quietly dictating the slope while producing one of the smallest
      residuals on the page.
    interview: >
      "How do you find influential points?" wants leverage or hat values by
      name, not residual size. "One bad print in your data, how do you know?"
      wants a leverage check or a refit excluding suspect points.
    pitfalls: >
      Screening for bad data using only the residual plot — the most
      influential points have artificially small residuals. Conflating
      leverage, a property of $x$ alone, with influence, which also needs a
      poor fit — a high-leverage point sitting right on the line does no
      damage.
    recap: >
      A high-leverage point manufactures its own small residual, so leverage
      itself, not the residual plot, is what finds it.
    dialogue:
      - part: One day that sets the beta
        teach: >
          You estimate a stock's beta from four days. On three ordinary days
          the market moved $1$, $2$ and $3$ percent and the stock moved
          exactly the same. On the fourth, a gap day, the market moved $10$
          percent and the stock only $4$.
      - ask: >
          Fit stock on market, with an intercept, using the three ordinary
          days alone. What is the slope?
        expects: "1"
        feedback: >
          The three points lie exactly on $y = x$, so the slope is $1$ and
          every residual is $0$.
      - ask: >
          Now fit all four days. What is the slope?
        expects: "0.28"
        hint: >
          $\bar{x} = 4$ and $\bar{y} = 2.5$; centred market moves are
          $-3, -2, -1, 6$.
        feedback: >
          Centred stock moves are $-1.5, -0.5, 0.5, 1.5$. Cross-products:
          $4.5 + 1 - 0.5 + 9 = 14$; squared market deviations:
          $9 + 4 + 1 + 36 = 50$. Slope $14/50 = 0.28$. One day out of four
          took the beta from $1$ to $0.28$.
      - ask: >
          The four-day line is $\hat{y} = 1.38 + 0.28x$. What is the gap day's
          residual?
        expects: "-0.18"
        tolerance: 0.001
        feedback: >
          $\hat{y} = 1.38 + 2.8 = 4.18$, and $4 - 4.18 = -0.18$. The four
          residuals are $-0.66$, $0.06$, $0.78$ and $-0.18$: the day that
          moved the beta most has the second-smallest residual of the four.
      - reflect: >
          The most influential day hides behind a small residual. What
          property of that day — one that has nothing to do with the stock's
          move — gives it so much power over the line, and why does that same
          power make its residual small?
        answer: >
          Its market move sits far from the others, at $10$ against a cluster
          around $2$. A line pivots about $(\bar{x}, \bar{y})$, and a point far
          out along $x$ has the longest lever arm, so the least-squares line
          bends to pass close to it. Its residual is small not because it
          agrees with the other days but because the fit moved to it.

      - part: Leverage, measured
        ask: >
          Raise the gap day's stock move from $4$ to $5$ and refit. By how
          much does the fitted value *at the gap day* rise?
        expects: "0.97"
        tolerance: 0.001
        hint: >
          $\hat{y}_4 = \bar{y} + \hat{\beta}_1(x_4 - \bar{x})$. The cross-product
          sum rises by $6$ and $\bar{y}$ by $1/4$.
        feedback: >
          The slope rises by $6/50 = 0.12$ and $\bar{y}$ by $0.25$, so
          $\hat{y}_4$ rises by $0.25 + 0.12 \cdot 6 = 0.97$. Nudge that day's
          $y$ and the line follows it $97$ percent of the way.
      - teach: >
          That $0.97$ is the gap day's leverage, $h_{ii}$: how far the fitted
          value at observation $i$ moves per unit move in $y_i$. In simple
          regression $h_{ii} = 1/n + (x_i - \bar{x})^{2}/\sum_j (x_j -
          \bar{x})^{2}$. It lies in $[0, 1]$, averages $(k+1)/n$, and depends
          on the regressors only — never on $y$. Because the fit chases a
          high-leverage point, $\operatorname{Var}(e_i) = \sigma^{2}(1 -
          h_{ii})$. Influence is leverage combined with a poor fit.
      - ask: >
          What is the leverage of the day the market moved $1$ percent?
        expects: "0.43"
        tolerance: 0.001
        feedback: >
          $1/4 + 9/50 = 0.25 + 0.18 = 0.43$. The other two ordinary days
          have $0.33$ and $0.27$, and with the gap day's $0.97$ the four sum
          to $2 = k + 1$.
      - ask: >
          With error variance $\sigma^{2} = 1$, what is the standard deviation
          of the gap day's residual? Four decimals.
        expects: "0.1732"
        tolerance: 0.0005
        feedback: >
          $\sqrt{1 - 0.97} = \sqrt{0.03} \approx 0.1732$, against
          $\sqrt{0.73} \approx 0.854$ for the $3$ percent day. Any error on
          the gap day — a badly wrong print included — shows up squeezed to
          about a fifth of the size it would have elsewhere, so a residual
          plot cannot flag it.

      - part: Leverage is not yet influence
        ask: >
          Suppose instead the stock had moved $10$ percent on the gap day,
          right on the line $y = x$ through the ordinary days. Its leverage is
          still $0.97$. Is it influential?
        choices:
          - text: >
              Yes: leverage of $0.97$ means the point controls the fit.
            feedback: >
              It could control the fit, but it agrees with it. Drop it and the
              slope is $1$; keep it and the slope is still $1$. Leverage is
              the power to move the line; influence is using it.
          - text: >
              No: it has the leverage, but it sits where the other days
              already put the line, so removing it changes nothing.
            correct: true
            feedback: >
              Right. Influence needs both a far-out $x$ and a $y$ that
              disagrees with the rest. Here it even helps: it pins the slope
              down with a long lever arm.
          - text: >
              Its leverage drops, because the point now fits well.
            feedback: >
              Leverage involves the market moves only, and those did not
              change: $1/4 + 36/50 = 0.97$ whatever the stock did.
        feedback: >
          High leverage is a question to ask, not a verdict: what happens to
          the fit without this point?
      - ask: >
          Back to the real gap day, stock $4$. What do you do?
        choices:
          - text: >
              Delete it: a point that moves the beta that much must be bad
              data.
            feedback: >
              It might be a huge market day on which the stock genuinely
              lagged. Deleting it silently replaces one unexamined decision
              with another.
          - text: >
              Keep it and move on: its residual is small, so it fits fine.
            feedback: >
              Its residual is small because the line chased it. The fit with
              it says $0.28$ and without it says $1$; a small residual was
              never evidence of a good fit at that point.
          - text: >
              Check the print, report the beta with and without the day, and
              consider winsorizing or a robust loss.
            correct: true
            feedback: >
              Right. Showing both fits makes the dependence visible, and a
              robust loss stops any single day from carrying the slope.
        feedback: >
          In an interview: "find influential points by leverage, not residual
          size — a high-leverage point manufactures its own small residual;
          then refit without it." In market data the culprit is usually one
          gap day or one bad print.

  - node: quant-statistics.regression.omitted-variable
    hook: >
      "Is this coefficient causal?" is the question underneath every
      regression result in an interview, and the honest answer runs through
      this formula.
    explanation: >
      Suppose the truth is $y=\beta_0+\beta_1 x+\beta_2 z+\varepsilon$ with
      $\mathbb{E}[\varepsilon\mid x,z]=0$, but you regress $y$ on $x$ alone.
      The short regression's slope satisfies
      $\mathbb{E}[\hat\beta_1]=\beta_1+\beta_2\,
      \operatorname{Cov}(x,z)/\operatorname{Var}(x)$: the true effect plus
      the omitted coefficient times the slope from regressing the omitted
      variable on the included one — the same Cov-over-Var identity from
      earlier in this unit, applied to a nuisance variable riding along with
      $x$.

      The bias's sign is the sign of $\beta_2\times\operatorname{Cov}(x,z)$:
      upward when $z$ raises $y$ and moves with $x$, or when $z$ lowers $y$
      and moves against $x$; downward in the two mixed cases. The bias
      vanishes only if $\beta_2=0$ or $\operatorname{Cov}(x,z)=0$ — both
      conditions have to fail for the coefficient to be safely causal, which
      is why "regression coefficient" and "causal effect" are not
      synonyms.
    worked: >
      True relation: ice-cream sales $=3+2\,\text{temp}+4\,\text{crowd}
      +\varepsilon$, where crowd size also rises with temperature,
      $\operatorname{Cov}(\text{temp},\text{crowd})=0.5$ and
      $\operatorname{Var}(\text{temp})=2$. Regressing sales on temperature
      alone gives $\mathbb{E}[\hat\beta_1]=2+4(0.5/2)=2+1=3$: the true effect
      of temperature is $2$, but the short regression reports $3$ because a
      third of the apparent slope is really the omitted crowd variable riding
      along with temperature.
    interview: >
      "Is this coefficient causal?" is answered with the bias formula and the
      direction rule. "Wages regressed on schooling, what's missing?" is
      fishing for ability.
    pitfalls: >
      Assuming any omitted variable biases the coefficient — it only does if
      it is correlated with both $y$ and the included regressor. Getting the
      direction backwards by forgetting the sign is a product of two signs,
      not either one alone.
    recap: >
      Omitting a relevant, correlated regressor shifts the coefficient by
      $\beta_{\text{omitted}}\times\operatorname{Cov}(x,\text{omitted})
      /\operatorname{Var}(x)$, whose sign is the product of the two effects.
    dialogue:
      - part: A slope twice the truth
        teach: >
          A researcher regresses a stock's next-month return $y$ on the number
          of analyst upgrades it received this month, $x$. Unknown to her, the
          truth is $y = 1 \cdot x + 2 \cdot z + \varepsilon$, where $z$ is the
          stock's return over the past month and $\varepsilon$ is noise
          uncorrelated with both. Analysts upgrade stocks that have been
          rising: $\operatorname{Var}(x) = 4$ and
          $\operatorname{Cov}(x, z) = 2$.
      - ask: >
          Using the true model, what is $\operatorname{Cov}(x, y)$?
        expects: "8"
        hint: >
          Covariance is linear: $\operatorname{Cov}(x, x + 2z + \varepsilon)$
          splits into three pieces.
        feedback: >
          $\operatorname{Var}(x) + 2\operatorname{Cov}(x, z) +
          \operatorname{Cov}(x, \varepsilon) = 4 + 4 + 0 = 8$.
      - ask: >
          She regresses $y$ on $x$ alone. In a large sample, what slope will
          she report?
        expects: "2"
        hint: >
          A simple-regression slope is covariance over variance.
        feedback: >
          $8/4 = 2$: twice the true effect of an upgrade.
      - ask: >
          Her data are clean and plentiful, and OLS is unbiased under the
          Gauss–Markov assumptions. How can the slope be off by a factor of
          two?
        choices:
          - text: >
              It cannot; with enough data the slope converges to the true
              $1$.
            feedback: >
              The computation you just did was the large-sample answer: it
              converges to $2$. More data makes her more confident in the
              wrong number.
          - text: >
              In her model the error is $2z + \varepsilon$, which moves with
              $x$, so strict exogeneity fails and unbiasedness goes with it.
            correct: true
            feedback: >
              Right. Gauss–Markov's guarantee was conditional on
              $\mathbb{E}[\text{error} \mid x] = 0$. Leave $z$ out and it joins
              the error, and since upgrades follow momentum, that error is
              correlated with $x$.
          - text: >
              The errors are heteroskedastic, which biases OLS.
            feedback: >
              Heteroskedasticity leaves OLS unbiased; it damages the standard
              errors. The problem here is the centre of the estimate, not its
              spread.
        feedback: >
          A coefficient is unbiased for the model you fit only if that model's
          error is uncorrelated with its regressors. Dropping a variable moves
          it into the error.
      - reflect: >
          The slope is $2$ and the truth is $1$. Write the extra $1$ as a
          product of two numbers, each of which you could estimate by its own
          regression, and say what each one measures.
        answer: >
          The extra is $2 \times \operatorname{Cov}(x, z)/\operatorname{Var}(x)
          = 2 \times 0.5$. The first factor is $\beta_2$, how much the omitted
          momentum moves returns. The second is the slope from regressing
          momentum on upgrades — how much momentum rides along with each
          upgrade. Each upgrade arrives with half a unit of momentum, worth
          $2$ per unit, and the short regression credits that $1$ to the
          upgrade.

      - part: The bias formula and its sign
        teach: >
          That is omitted-variable bias. If the truth is
          $y = \beta_0 + \beta_1 x + \beta_2 z + \varepsilon$ with
          $\mathbb{E}[\varepsilon \mid x, z] = 0$ and you regress $y$ on $x$
          alone, then $\mathbb{E}[\hat{\beta}_1] = \beta_1 + \beta_2
          \operatorname{Cov}(x, z)/\operatorname{Var}(x)$. The bias has the
          sign of $\beta_2 \times \operatorname{Cov}(x, z)$ and vanishes only
          if $\beta_2 = 0$ or $\operatorname{Cov}(x, z) = 0$.
      - ask: >
          A regression of a bond fund's return on its duration omits the
          fund's credit exposure. In this sample credit exposure raises
          returns, and long-duration funds hold less credit. Which way is the
          duration coefficient biased?
        choices:
          - text: >
              Upward, because the omitted variable raises returns.
            feedback: >
              That is one of the two signs. Credit moves *against* duration,
              so the funds with more duration carry less of the thing that
              raises returns, and duration gets blamed for the shortfall.
          - text: >
              Downward: positive $\beta_2$ times negative
              $\operatorname{Cov}$.
            correct: true
            feedback: >
              Right. One positive and one negative factor give a downward
              bias; the short regression understates what duration does.
          - text: >
              No bias, since duration and credit are different risks.
            feedback: >
              Being different risks is not the test. The test is whether the
              omitted variable matters for returns and moves with the included
              one, and both hold here.
          - text: >
              It depends on $\operatorname{Var}(\text{duration})$.
            feedback: >
              A variance is always positive, so it scales the bias but never
              sets its sign. The sign is the product of the two signs.
        feedback: >
          Upward when both signs agree, downward when they differ.
      - ask: >
          Put numbers on it: credit's coefficient is $0.5$,
          $\operatorname{Cov}(\text{duration}, \text{credit}) = -2$ and
          $\operatorname{Var}(\text{duration}) = 4$. What is the bias in the
          duration coefficient?
        expects: "-0.25"
        feedback: >
          $0.5 \times (-2)/4 = -0.25$. Whatever duration truly does, the short
          regression reports a quarter less.

      - part: When the bias disappears
        ask: >
          Back to the upgrades. Suppose the analysts' upgrades had been
          handed out by coin flip, independent of the stock's past return,
          with everything else unchanged. What slope would the short
          regression report in a large sample?
        expects: "1"
        feedback: >
          $\operatorname{Cov}(x, z) = 0$, so $\operatorname{Cov}(x, y) =
          \operatorname{Var}(x) = 4$ and the slope is $4/4 = 1$. Momentum
          still moves returns, but it no longer rides along with upgrades.
          This is why randomized assignment removes the need to measure every
          other cause.
      - ask: >
          With the original, momentum-chasing analysts, the researcher now
          adds past return $z$ as a second regressor. What coefficient on
          upgrades should she expect?
        choices:
          - text: >
              $2$: adding a regressor cannot change a coefficient that much.
            feedback: >
              Adding a correlated regressor is exactly what changes a
              coefficient. The long regression partials momentum out of
              upgrades before measuring the slope.
          - text: >
              $1$: with $z$ in the model, the coefficient on $x$ is the slope
              on the part of upgrades that momentum does not explain.
            correct: true
            feedback: >
              Right. That is Frisch–Waugh–Lovell at work: partialling $z$ out
              of $x$ removes the momentum that rode along, and the true model
              satisfies the exogeneity condition, so the estimate centres on
              $1$.
          - text: >
              $0$: momentum explains the whole effect.
            feedback: >
              Momentum explains the extra $1$, not the whole $2$. The true
              upgrade effect is $1$ and survives the control.
        feedback: >
          Including the omitted variable removes its bias — when you can
          measure it.
      - ask: >
          An interviewer asks whether the reported $2$ is the causal effect of
          an upgrade. Which answer shows you know the mechanism?
        choices:
          - text: >
              "Yes, if the $t$-statistic is large."
            feedback: >
              Significance measures precision, not bias. A biased estimate
              with a huge sample is very precisely wrong.
          - text: >
              "Not necessarily: anything that moves returns and moves with
              upgrades — momentum, say — biases it by $\beta_2$ times the
              slope of that variable on upgrades, here upward."
            correct: true
            feedback: >
              That names the formula, the two conditions and the sign — the
              ten-second answer.
          - text: >
              "No: any variable left out of a regression biases its
              coefficients."
            feedback: >
              Only variables that both affect $y$ and correlate with the
              included regressor do. Leave out something uncorrelated with
              upgrades and the slope stays centred on the truth.
        feedback: >
          A regression coefficient is a causal effect only when nothing
          omitted both matters and moves with the regressor.

  - node: quant-statistics.regression.omitted-variable-worked
    hook: >
      Interviewers don't stop at "define omitted-variable bias" — they hand
      you a true model and a reported slope and ask you to reconcile them on
      the spot.
    explanation: >
      What is worth internalizing from the trading-desk numbers in the
      statement above is not those specific figures but the four-step solve: read off the true
      structural coefficient on the omitted variable, read off the covariance
      and variance term, multiply and add to the true effect of the included
      regressor, and check the result against the reported short-regression
      slope. Interviewers who ask this kind of question live are testing
      whether you can run that arithmetic fast, not whether you can restate
      the formula.

      The sign check deserves its own habit: bias is upward exactly when the
      omitted variable's effect on $y$ and its association with the included
      regressor point the same way, both positive or both negative. Whenever
      a story features two variables that are natural complements — bigger
      trades happening in more volatile conditions, more schooling
      accumulating in people who are already more able — the covariance is
      close to guaranteed positive, so the whole sign check collapses to the
      sign of $\beta_2$ alone.

      The pattern survives any relabeling of the variables: it is always the
      same three objects — a true coefficient, a nuisance coefficient, and a
      covariance-to-variance ratio between the included and omitted
      regressor.
    worked: >
      Take the canonical twin: true wage model is
      $\text{wage}=10+0.08\,\text{schooling}+0.5\,\text{ability}
      +\varepsilon$, with $\operatorname{Cov}(\text{schooling},
      \text{ability})=4$ and $\operatorname{Var}(\text{schooling})=16$. A
      researcher without an ability measure regresses wage on schooling alone
      and reports $\mathbb{E}[\hat\beta_1]=0.08+0.5(4/16)=0.08+0.125=0.205$ —
      more than double the true return to schooling, because smarter people
      both earn more directly and complete more schooling, so the schooling
      coefficient silently absorbs a chunk of the ability effect.
    interview: >
      Practice both directions: given the true model, find the reported
      coefficient; given the reported coefficient and the true structural
      coefficient, back out the implied covariance term.
    pitfalls: >
      Plugging into the formula without checking the sign of the covariance
      term — a negative covariance flips the bias direction even with the
      same positive $\beta_2$. Rerunning an entire regression instead of
      solving the one-line equation when asked to back out an omitted term.
    recap: >
      The same formula, run on any pair of correlated regressors: plug in the
      omitted coefficient and the covariance-to-variance ratio and read off
      how much of the reported slope is borrowed from what's missing.
    dialogue:
      - part: The desk's number, taken apart
        teach: >
          A market-making desk regresses daily PnL, in thousands, on the
          number of quotes it posted, in hundreds, and reports a slope of $2$.
          A senior suspects market volume, which was left out. Over the
          sample, quotes have standard deviation $2$, volume has standard
          deviation $5$, their correlation is $0.6$, and in the regression
          with both, volume's coefficient is $1$.
      - ask: >
          What is $\operatorname{Cov}(\text{quotes}, \text{volume})$?
        expects: "6"
        hint: >
          Covariance is correlation times both standard deviations.
        feedback: >
          $0.6 \times 2 \times 5 = 6$.
      - ask: >
          What is the slope from regressing volume on quotes — how much
          volume rides along with each extra hundred quotes?
        expects: "1.5"
        feedback: >
          $\operatorname{Cov}/\operatorname{Var}(\text{quotes}) = 6/4 = 1.5$.
      - ask: >
          The reported $2$ is the true quote effect plus volume's coefficient
          times that ride-along slope. What is the true effect of a hundred
          extra quotes?
        expects: "0.5"
        hint: >
          Bias is $1 \times 1.5$; subtract it from the reported slope.
        feedback: >
          $2 = \beta_1 + 1 \times 1.5$, so $\beta_1 = 0.5$. Three quarters of
          the reported slope was volume.
      - part: The sign before the number
        ask: >
          Before any numbers, could the senior have called the direction of
          the bias from the story alone?
        choices:
          - text: >
              No: the direction needs the full calculation.
            feedback: >
              The direction needs only two signs. Volume raises a market
              maker's PnL, and desks quote more on busy days, so both signs
              are positive and the bias is upward. The arithmetic only sizes
              it.
          - text: >
              Yes: volume raises PnL and moves with quoting, two positive
              signs, so the slope overstates the quote effect.
            correct: true
            feedback: >
              Right. When the omitted variable and the regressor are natural
              companions — busy days and heavy quoting — the covariance is
              all but sure to be positive, and the sign of the bias is the
              sign of the omitted coefficient.
          - text: >
              Yes, downward: leaving a variable out always throws away
              explanatory power.
            feedback: >
              Losing explanatory power widens the residuals; it does not set
              the direction of the bias. Here the slope came out too high,
              not too low.
        feedback: >
          Sign first, from the story; then size, from the formula. Saying the
          sign before the number is what an interviewer listens for.
      - reflect: >
          The desk plans to double its quoting on an ordinary-volume day,
          expecting the slope of $2$ to pay. Using your numbers, what should
          it expect instead, and why does the reported slope mislead it?
        answer: >
          Each extra hundred quotes earns $0.5$, not $2$, when volume does not
          come along. The $2$ was measured across days on which heavy quoting
          and heavy volume arrived together, so it bundles the volume effect
          into the quote coefficient. Quoting more on a quiet day changes the
          quotes without changing the volume, and only the $0.5$ remains.

      - part: Two omissions, one slope
        teach: >
          A second desk quotes in a market with the same quote and volume
          statistics, and the same true effects of each, but it faces one
          more omitted variable. Each omission that both matters for PnL and
          moves with quoting leaves its own fingerprint on the slope.
      - ask: >
          The extra variable is adverse-selection pressure, which lowers PnL
          with coefficient $-2$, and the desk
          quotes less when it is high, so
          $\operatorname{Cov}(\text{quotes}, \text{pressure}) = -1$. On its
          own, what bias does this omission put on the quote slope?
        expects: "0.5"
        hint: >
          $\operatorname{Var}(\text{quotes}) = 4$.
        feedback: >
          $(-2)(-1)/4 = 0.5$. Two negative signs: pressure lowers PnL and
          moves against quoting, so the heavy-quoting days are the
          low-pressure days, and quoting gets credit for the calm.
      - ask: >
          Suppose the true model is $\text{PnL} = 0.5\,\text{quotes} +
          1\,\text{volume} - 2\,\text{pressure} + \varepsilon$, with the
          covariances above, and its junior regresses PnL on quotes alone.
          What slope does the junior report?
        expects: "2.5"
        hint: >
          $\operatorname{Cov}(\text{quotes}, \text{PnL})$ picks up one term
          for each omitted variable.
        feedback: >
          $\operatorname{Cov}(x, y) = \beta_1\operatorname{Var}(x) +
          \sum_j \beta_j \operatorname{Cov}(x, z_j)$, so the slope is
          $0.5 + 1.5 + 0.5 = 2.5$. Each omission adds its own coefficient
          times its own ride-along slope.
      - ask: >
          A new desk head says: "The quote coefficient was $2.5$ and is now
          $0.5$ with the controls in. Controls are killing our signal; take
          them out." What do you say?
        choices:
          - text: >
              Agreed: the bigger coefficient is the better estimate, since it
              uses more of the variation.
            feedback: >
              The extra variation it uses is volume's and pressure's, not the
              quotes'. Bigger is not better when the excess is bias.
          - text: >
              The $2.5$ includes $2$ of borrowed effect from volume and calm
              markets; $0.5$ is what quoting itself earns, and it is what a
              change in quoting will deliver.
            correct: true
            feedback: >
              Right. The controls did not kill a signal; they returned two
              borrowed effects to their owners.
          - text: >
              Both are equally valid; pick whichever fits the story.
            feedback: >
              They answer different questions, and only one matches the
              decision. "What happens if we quote more?" is the controlled
              question, and its answer is $0.5$.
        feedback: >
          In an interview, run it in order: name the omitted variable, sign
          the bias from the story, size it as coefficient times ride-along
          slope, and subtract.

  - node: quant-statistics.regression.regression-to-mean
    hook: >
      "Why did last year's award-winning rookie fall off in year two?" feels
      like it needs a story, but it falls out of $\lvert\rho\rvert<1$ with no
      story required.
    explanation: >
      Standardize both variables, $z_x=(x-\mu_x)/\sigma_x$ and
      $z_y=(y-\mu_y)/\sigma_y$. The population regression line becomes
      $\hat z_y=\rho\,z_x$, because the slope
      $\operatorname{Cov}(x,y)/\operatorname{Var}(x)$ times $\sigma_x/\sigma_y$
      collapses exactly to $\rho$. Whenever $\lvert\rho\rvert<1$, the
      prediction sits strictly nearer the mean, measured in standard
      deviations, than the observation did — an observation $k$ standard
      deviations out forecasts only $k\rho$ next time.

      The mechanism needs no cause beyond imperfect correlation: model each
      score as skill plus independent noise, and an extreme observation
      over-represents the lucky half of that noise, which is not expected to
      repeat. The effect is symmetric — predicting the midterm from an
      extreme final shrinks exactly as much as predicting the final from an
      extreme midterm — because the standardized identity $\hat z_y=\rho z_x$
      runs the same either direction you point it.
    worked: >
      A hitter finishes the season $1.5$ standard deviations above the
      league mean in batting average. If the season-to-season correlation is
      $\rho=0.4$, the best prediction for next season is $1.5\times0.4=0.6$
      standard deviations above average — most of an apparently hot year
      evaporates by construction, with no injury, slump, or opposing
      scouting required.
    interview: >
      "Why do rookies of the year often have a worse second season?" and
      "should you extrapolate a hot streak?" both want the standardized-slope
      identity $\hat z_y=\rho z_x$ named directly.
    pitfalls: >
      Treating the shrinkage as evidence of a causal mechanism — a curse,
      pressure, complacency — rather than a statistical inevitability
      whenever $\rho<1$. Forgetting the effect runs both directions in time,
      not only forward.
    recap: >
      Standardized, the regression line is $\hat z_y=\rho z_x$, so an
      observation $k$ standard deviations from the mean is predicted at only
      $k\rho$ next time, purely from $\lvert\rho\rvert<1$.
    dialogue:
      - part: A tournament of skill and luck
        teach: >
          A two-day trading competition. Each player's daily score is their
          skill plus that day's luck: $X = S + N_1$ on day one and
          $Y = S + N_2$ on day two. Skill, $N_1$ and $N_2$ are independent,
          each with mean $0$ and variance $1$, and a player's skill does not
          change overnight.
      - ask: >
          What is the correlation between a player's day-one and day-two
          scores?
        expects: "0.5"
        hint: >
          The two scores share only $S$. Find $\operatorname{Cov}(X, Y)$ and
          each variance.
        feedback: >
          $\operatorname{Cov}(X, Y) = \operatorname{Var}(S) = 1$ and each
          score has variance $1 + 1 = 2$, so $\rho = 1/2 = 0.5$.
      - ask: >
          The day-one winner scored $X = 4$. What does the regression line of
          day two on day one predict for her day-two score?
        expects: "2"
        hint: >
          The slope is $\operatorname{Cov}(X, Y)/\operatorname{Var}(X)$, and
          both means are $0$.
        feedback: >
          Slope $1/2$, so the prediction is $0.5 \times 4 = 2$: half her
          day-one distance from the mean.
      - ask: >
          She scores close to $2$ on day two. Commentators say she choked.
          What does the model say?
        choices:
          - text: >
              She choked: her day-two score fell by half.
            feedback: >
              The model has no choking in it — skill is identical on both
              days — and it still predicted exactly this fall. A drop that the
              null already predicts needs no story.
          - text: >
              Day two was harder for everyone.
            feedback: >
              Both days have mean $0$; the field as a whole did not drop. Only
              the players who started at the extremes moved toward the
              middle.
          - text: >
              Her $4$ was part skill and part luck; the luck does not carry
              over, so day two is predicted at her skill alone.
            correct: true
            feedback: >
              Right. Nothing about her changed. The day-one score
              over-stated her skill, and day two's luck is a fresh draw with
              mean zero.
        feedback: >
          The fall is built into imperfect correlation; it needs no cause.
      - reflect: >
          Among all the players who scored $4$ on day one, why is the average
          skill only $2$? Think about what combinations of skill and luck it
          takes to reach a $4$.
        answer: >
          Skill and luck are equally variable here, so a total of $4$ is, on
          average, half of each: skill $2$ with luck $2$ is far more common
          than skill $4$ with luck $0$, because a skill of $4$ is itself rare.
          Selecting on an extreme total selects players who were both good
          and lucky. Only the skill repeats, so the group's next score is
          predicted at its average skill.

      - part: The line in standard units
        teach: >
          Standardize both scores, $z_x = (x - \mu_x)/\sigma_x$ and
          $z_y = (y - \mu_y)/\sigma_y$. The regression slope
          $\operatorname{Cov}(x, y)/\operatorname{Var}(x)$ times
          $\sigma_x/\sigma_y$ is exactly $\rho$, so the line reads
          $\hat{z}_y = \rho z_x$. Whenever $\lvert \rho \rvert < 1$ the
          prediction sits strictly nearer the mean, in standard deviations,
          than the observation did. That is regression to the mean, and the
          tournament is the whole mechanism: imperfect correlation, nothing
          else.
      - ask: >
          Two monthly risk scores have $\rho = 0.7$, with standard deviations
          $10$ for the first month and $4$ for the second. A book is $15$
          points above the mean in the first month. How far above the mean is
          its second-month score predicted, in raw points?
        expects: "4.2"
        tolerance: 0.001
        hint: >
          Convert to standard units, shrink by $\rho$, convert back.
        feedback: >
          $z_x = 15/10 = 1.5$, $\hat{z}_y = 0.7 \times 1.5 = 1.05$, and
          $1.05 \times 4 = 4.2$ points. In raw units the prediction can look
          larger or smaller depending on the spreads; in standard units it
          always shrinks.
      - ask: >
          Back to the tournament. A player scores $4$ on *day two*. What is
          the regression prediction of her day-one score?
        choices:
          - text: >
              $4$: day one came first, so it is not predicted, it just
              happened.
            feedback: >
              Prediction here means the best guess of an unseen number, in
              either direction. Knowing only day two, your best guess for day
              one is shrunk exactly as much.
          - text: >
              $2$: the same $\rho = 0.5$ shrinks in either direction.
            correct: true
            feedback: >
              Right. Correlation is symmetric, so the day-two winner was
              probably lucky on day two, and her day one is predicted at
              half. There is no arrow of time in $\hat{z}_y = \rho z_x$.
          - text: >
              Above $4$: to finish at $4$ she must have been improving.
            feedback: >
              Skill does not change between days in this model. Predicting
              backward from an extreme shrinks toward the mean, exactly like
              predicting forward.
        feedback: >
          Regression to the mean runs both ways in time, which is the
          clearest sign it is about selection and correlation, not about
          anything happening between the two measurements.

      - part: Where the shrinkage changes shape
        ask: >
          A desk's quarterly hedging error has correlation $\rho = -0.4$ with
          the next quarter's, because over-hedging gets corrected into
          under-hedging. A quarter lands $2.5$ standard deviations above the
          mean. What is the next quarter predicted at, in standard
          deviations?
        expects: "-1"
        feedback: >
          $-0.4 \times 2.5 = -1$. With negative $\rho$ the prediction jumps to
          the other side of the mean, but still closer to it: $1$ standard
          deviation away instead of $2.5$.
      - ask: >
          A fund manager was $2$ standard deviations above her peers last
          year. How large must the year-to-year correlation be for her to be
          predicted at least $1.5$ standard deviations above them this year?
        expects: "0.75"
        feedback: >
          $2\rho \ge 1.5$ needs $\rho \ge 0.75$. Year-to-year correlations of
          fund returns are nowhere near that, which is why most of a
          star year is predicted to vanish.
      - ask: >
          An interviewer asks why last year's top-decile funds, as a group,
          underperform them this year. Which answer is the one they want?
        choices:
          - text: >
              "Success attracts inflows, and the extra capital erodes the
              edge."
            feedback: >
              That can be true, and it is a story you would need evidence
              for. The interviewer wants the effect that happens with no story
              at all.
          - text: >
              "Returns are skill plus luck with year-to-year correlation
              $\rho < 1$; selecting on last year's top decile selects lucky
              funds, and they are predicted at $\rho$ times as extreme."
            correct: true
            feedback: >
              That is the mechanism, with the number attached. Any extra
              story has to explain movement beyond the $\rho$ shrinkage.
          - text: >
              "Markets are efficient, so no fund can stay on top."
            feedback: >
              Efficiency would give $\rho$ near $0$, but the shrinkage happens
              for any $\lvert \rho \rvert < 1$, efficient market or not. Name
              the mechanism, not a slogan.
        feedback: >
          Said aloud: "standardized, the line is $\hat{z}_y = \rho z_x$, so
          $k$ standard deviations out predicts $k\rho$ — no cause required."

  - node: quant-statistics.regression.regression-fallacy
    hook: >
      "Spot the flaw in this study" prompts love a treatment applied only to
      an extreme group, and the flaw is almost always this one.
    explanation: >
      Whenever a story explains why an extreme group moved toward average,
      the diagnostic question is whether the group was selected on the
      extreme outcome itself. If it was, the movement toward average is
      guaranteed by $\lvert\rho\rvert<1$ regardless of any intervention
      applied in between — the null hypothesis of "the treatment did
      nothing" already predicts the improvement you observed.

      The fix is a control group drawn from the same extreme selection: take
      an equally extreme group that did not receive the treatment, and
      compare how far each group's average moved. Only the gap between the
      treated and untreated groups' movement is evidence the treatment did
      anything; the movement common to both is regression to the mean, priced
      in for free.
    worked: >
      The worst-performing manager among $100$ funds posts $z=-2.5$ one
      quarter, takes a mandatory retraining course, and posts $z=-1$ the
      next — a visible improvement management is tempted to credit to the
      course. With a quarter-to-quarter skill correlation of $\rho=0.3$, the
      no-intervention prediction is $-2.5\times0.3=-0.75$, already most of
      the way to the observed $-1$. A control group of equally bad managers
      who skipped the course would be expected to land near $-0.75$ too, and
      only the gap beyond that is evidence the course worked.
    interview: >
      "Spot the flaw" prompts about an intervention applied only to an
      extreme group are answered by naming regression to the mean and
      demanding a same-selection control group.
    pitfalls: >
      Accepting "we selected the worst performers and they improved" as
      evidence of a treatment effect without a matched control group.
      Assuming the fallacy only runs bad-to-good — a "cursed" streak of top
      performers reverting downward is the identical mechanism.
    recap: >
      Whenever a treatment is applied only to an extreme group, some or all
      of the improvement is guaranteed by regression to the mean, and only a
      control group can separate the two.
    dialogue:
      - part: A watch list that seems to work
        teach: >
          A risk team puts the ten strategies with the deepest drawdowns this
          quarter on a watch list, which forces a written review. Measured as
          $z$-scores against all the firm's strategies, the watch list
          averaged $-1.8$ this quarter and $-0.4$ the next. The team credits
          the review. Quarter-to-quarter correlation of strategy performance
          is $\rho = 0.3$.
      - ask: >
          If the review did nothing at all, what average $z$ would you predict
          for the watch list next quarter?
        expects: "-0.54"
        tolerance: 0.001
        hint: >
          Standardized, the prediction is $\rho$ times the starting $z$.
        feedback: >
          $0.3 \times (-1.8) = -0.54$. The null hypothesis already predicts a
          large recovery.
      - ask: >
          The group actually came in at $-0.4$. How much of a rise is left
          over beyond the null prediction?
        expects: "0.14"
        tolerance: 0.001
        feedback: >
          $-0.4 - (-0.54) = 0.14$. That is the most the review could be
          credited with, and it is small enough to be noise in a group of ten.
      - ask: >
          What share of the observed rise, from $-1.8$ to $-0.4$, did the null
          predict for free?
        expects: "0.9"
        tolerance: 0.001
        hint: >
          The observed rise is $1.4$; the predicted rise is from $-1.8$ to
          $-0.54$.
        feedback: >
          The predicted rise is $1.26$, and $1.26/1.4 = 0.9$. Nine tenths of
          the improvement the team is celebrating would have happened with no
          review at all.
      - reflect: >
          The team wants a verdict on the review that does not depend on
          knowing $\rho$. What comparison would separate the review's effect
          from the recovery that comes for free — and why must the comparison
          group be chosen the same way as the watch list?
        answer: >
          Take the strategies that qualified for the watch list and assign the
          review to only some of them, at random. Both groups were selected on
          the same extreme quarter, so both carry the same lucky-bad noise and
          both regress by the same amount; the difference in their
          next-quarter averages is the review's effect. A group chosen any
          other way starts from a different place and regresses by a
          different amount, so the comparison mixes the two again.

      - part: The fallacy, and the control that catches it
        teach: >
          Crediting a treatment for the move toward average of a group
          selected on an extreme outcome is the regression fallacy. The move
          is guaranteed by $\lvert \rho \rvert < 1$ whatever was done in
          between, so the null hypothesis already predicts an improvement. The
          only evidence is the gap between the treated group and an untreated
          group selected on the same extreme.
      - ask: >
          The team reruns it properly: of the twenty worst strategies, all at
          an average $z$ of $-1.8$, ten are reviewed at random. Next quarter
          the reviewed ten average $-0.4$ and the other ten $-0.6$. What is
          the estimated effect of the review, in standard deviations?
        expects: "0.2"
        feedback: >
          $-0.4 - (-0.6) = 0.2$. Both groups recovered by well over a full
          standard deviation; only the $0.2$ between them belongs to the
          review.
      - ask: >
          A junior instead compares the original watch list with all the
          firm's other strategies, which averaged $z = 0$ in both quarters.
          What is wrong with that comparison?
        choices:
          - text: >
              Nothing: the others did not move, so the watch list's $1.4$
              rise is all the review's doing.
            feedback: >
              The others did not move because they started at the mean and had
              nothing to regress from. The watch list started at $-1.8$, so
              $1.26$ of its rise was coming anyway.
          - text: >
              The comparison group was not selected on an extreme quarter, so
              it does not share the watch list's free recovery, and the whole
              $1.26$ gets credited to the review.
            correct: true
            feedback: >
              Right. A control group earns its keep only by starting from the
              same extreme for the same reason.
          - text: >
              The comparison group is too large; it should also have ten
              strategies.
            feedback: >
              Size is not the problem. Ten unselected strategies would also
              average about $0$ and stay there. What matters is how the group
              was chosen.
        feedback: >
          The control must be selected on the same extreme outcome as the
          treated group, or it controls for nothing.

      - part: The same trap in other clothes
        ask: >
          The mirror image: the firm doubles the capital of the strategies
          that averaged $z = +2$ this quarter. If the extra capital does
          nothing, what average $z$ do you predict for them next quarter?
        expects: "0.6"
        feedback: >
          $0.3 \times 2 = 0.6$. A fall of $1.4$ standard deviations is coming
          regardless, and a careless review will blame it on the capital —
          "size kills alpha" — with no more evidence than the watch list had.
      - ask: >
          Which of these is *not* an instance of the regression fallacy?
        choices:
          - text: >
              A PM cuts the risk limits of strategies right after their worst
              month, and their next months look better.
            feedback: >
              Selected on a bad month, so the improvement is predicted with or
              without the cut. This is the fallacy.
          - text: >
              Half of all desks, chosen by coin flip, get new execution
              software, and they outperform the other half the next quarter.
            correct: true
            feedback: >
              Right. Nobody was selected on an extreme outcome, and the
              comparison group was chosen the same way. The gap is evidence
              about the software.
          - text: >
              Analysts ranked best last year are given larger coverage lists,
              and their accuracy falls this year.
            feedback: >
              Selected on an extreme ranking, so a fall is predicted whatever
              their coverage. This is the fallacy, running top to middle.
        feedback: >
          The test is two questions: was the group picked for being extreme,
          and is there a same-selection control? In an interview, say both,
          and quote $\rho$ times the starting $z$ as the null prediction.

  - node: quant-statistics.regression.ridge-lasso
    hook: >
      "When would you reach for ridge instead of OLS?" wants a specific
      answer: collinear or high-dimensional predictors, with the bias-variance
      trade made explicit by a tuning knob.
    explanation: >
      Ridge minimizes $\lVert y-Xb\rVert^{2}+\lambda\sum_j b_j^{2}$, with
      closed form $\hat\beta=(X'X+\lambda I)^{-1}X'y$, invertible for every
      $\lambda>0$ even when $X'X$ itself is singular — a direct fix for the
      multicollinearity failure mode earlier in this unit. Lasso minimizes
      $\lVert y-Xb\rVert^{2}+\lambda\sum_j\lvert b_j\rvert$ instead; it has no
      closed form, and the kinks of the absolute value drive coefficients
      exactly to zero, so lasso selects variables while ridge only shrinks
      them continuously.

      Both estimators are biased toward zero by construction, and both trade
      that bias for reduced variance — a trade that pays exactly when the
      variance saved exceeds the squared bias added, the collinear or
      high-dimensional case where OLS's variance was already inflated.
      Standardize the regressors first, since the penalty is not
      scale-invariant and would otherwise fall unevenly across arbitrary
      units; leave the intercept unpenalized; and pick $\lambda$ only by
      out-of-sample validation, since in-sample fit always prefers
      $\lambda=0$.
    worked: >
      Single centred regressor with $\sum x_i^{2}=5$ and $\sum x_i
      y_i=15$, so OLS gives slope $15/5=3$. Ridge with $\lambda=5$ gives
      $15/(5+5)=1.5$ — exactly half the OLS estimate, shrunk by the factor
      $\sum x_i^{2}/(\sum x_i^{2}+\lambda)=5/10=0.5$. That same factor squares
      into the variance: ridge's variance is $0.5^{2}=0.25$ of OLS's, a real
      cut bought at the price of a coefficient biased toward zero — worthwhile
      exactly when the variance saved exceeds the squared bias added, which
      out-of-sample validation is what actually checks.
    interview: >
      "When would you use ridge or lasso?" wants collinear or
      high-dimensional predictors named directly. "Difference between them?"
      wants smooth shrinkage versus sparse selection, and closed form versus
      none.
    pitfalls: >
      Choosing $\lambda$ by in-sample fit, which is always minimized at
      $\lambda=0$. Forgetting to standardize regressors first, so the penalty
      falls unevenly by arbitrary scale. Penalizing the intercept, which
      shrinks every prediction toward zero rather than toward the mean.
    recap: >
      Ridge and lasso both trade bias for variance via a penalty on
      coefficient size — ridge shrinks continuously and stays invertible,
      lasso can zero coefficients out entirely, and $\lambda$ is chosen only
      out-of-sample.
    dialogue:
      - part: A fit with no unique answer
        teach: >
          Two momentum signals that, over three days, read exactly the same:
          both are $-1, 0, 1$. Next-day returns are $y = -2, 0, 2$. Everything
          is already centred, so no intercept is needed. You regress $y$ on
          both signals.
      - ask: >
          What does least squares return for the two coefficients
          $(b_1, b_2)$?
        choices:
          - text: >
              $(1, 1)$, splitting the effect evenly.
            feedback: >
              $(1, 1)$ fits perfectly, but so do $(2, 0)$, $(0, 2)$ and
              $(5, -3)$. Least squares has no reason to prefer the even
              split.
          - text: >
              Every pair with $b_1 + b_2 = 2$; the fit is not unique.
            correct: true
            feedback: >
              Right. The fitted values depend only on $b_1 + b_2$, so a whole
              line of coefficient pairs fits perfectly. $X'X$ is singular and
              $(X'X)^{-1}X'y$ does not exist.
          - text: >
              $(2, 0)$: the first signal takes the effect, the second is
              redundant.
            feedback: >
              Nothing makes the first column special; list the signals in the
              other order and you would say $(0, 2)$. Both are among infinitely
              many perfect fits.
        feedback: >
          Perfect collinearity, the extreme of the multicollinearity problem:
          the data cannot split the effect between two identical columns.
      - ask: >
          Among all the pairs with $b_1 + b_2 = 2$, what is the smallest
          possible value of $b_1^{2} + b_2^{2}$?
        expects: "2"
        hint: >
          Try the even split.
        feedback: >
          At $b_1 = b_2 = 1$ it is $2$; any uneven split, like $(2, 0)$ with
          $4$ or $(5, -3)$ with $34$, is larger.
      - reflect: >
          Least squares cannot choose among the perfect fits, but "the one
          with the smallest coefficients" picks a single sensible answer. How
          would you build that preference into the objective itself, and what
          would it cost on data where least squares could have chosen on its
          own?
        answer: >
          Add a penalty on coefficient size to the residual sum of squares,
          such as $\lambda(b_1^{2} + b_2^{2})$ with a dial $\lambda > 0$.
          Among equally good fits it picks the smallest, and the objective
          becomes strictly convex, so the answer is unique. The cost is that
          it pulls coefficients toward zero even when the data alone would
          have pinned them down: a deliberate bias, accepted in exchange for
          stability.
      - teach: >
          That is ridge regression: minimize $\lVert y - Xb \rVert^{2} +
          \lambda\sum_j b_j^{2}$, with closed form $\hat{\beta} = (X'X +
          \lambda I)^{-1}X'y$, invertible for every $\lambda > 0$ even when
          $X'X$ is singular. Lasso uses $\lambda\sum_j \lvert b_j \rvert$
          instead: no closed form, and as you will see it sets some
          coefficients exactly to zero. Both are biased toward zero, and both
          trade that bias for lower variance.

      - part: What the penalty buys, and what it costs
        ask: >
          Run ridge on the two identical signals with $\lambda = 4$. By
          symmetry $b_1 = b_2 = b$. What is $b$?
        expects: "0.5"
        hint: >
          The residual sum of squares is $\sum_i (y_i - 2b\,x_i)^{2} =
          2(2 - 2b)^{2}$, and the penalty is $4 \cdot 2b^{2}$.
        feedback: >
          Minimize $2(2 - 2b)^{2} + 8b^{2}$: the derivative
          $-8(2 - 2b) + 16b = 0$ gives $b = 0.5$. The total effect is $1$,
          half the least-squares $2$: unique, and shrunk.
      - ask: >
          Is the shrinkage worth it? Suppose least squares estimates a true
          coefficient of $0.5$ without bias and with variance $1$, and the
          chosen $\lambda$ makes the ridge estimate exactly half the
          least-squares one. What is ridge's mean squared error?
        expects: "0.3125"
        tolerance: 0.0001
        hint: >
          Mean squared error is squared bias plus variance. Shrinking by $0.5$
          shrinks the variance by $0.25$.
        feedback: >
          Bias $0.5 \times 0.5 - 0.5 = -0.25$, squared $0.0625$; variance
          $0.25 \times 1 = 0.25$; total $0.3125$, against least squares'
          $1$. With a true $\beta$ of $3$ instead, the squared bias would be
          $1.5^{2} = 2.25$ and ridge would lose. The trade pays when the
          variance saved exceeds the squared bias added.
      - ask: >
          Now lasso, on one centred regressor with
          $\sum_i x_i^{2} = 2$ and $\sum_i x_i y_i = 3$, so least squares
          gives $1.5$. With $\lambda = 8$, lasso minimizes
          $\sum_i (y_i - bx_i)^{2} + 8\lvert b \rvert$. What is the lasso
          estimate?
        expects: "0"
        hint: >
          For $b > 0$ the derivative is $-2(3 - 2b) + 8$. What is its sign
          just above zero?
        feedback: >
          Just above zero the derivative is $-6 + 8 = 2 > 0$, so any positive
          $b$ raises the objective; negative $b$ is worse still. The minimum
          is exactly $b = 0$. Ridge with the same $\lambda$ gives
          $3/(2 + 8) = 0.3$: small, never zero.
      - ask: >
          Why can lasso land exactly on zero when ridge never does?
        choices:
          - text: >
              Lasso uses a larger penalty.
            feedback: >
              Both used $\lambda = 8$ here. Turn ridge's $\lambda$ up as far
              as you like and $3/(2 + \lambda)$ approaches zero without
              reaching it.
          - text: >
              Ridge's penalty $\lambda b^{2}$ has slope $2\lambda b$, which
              vanishes at zero; lasso's $\lambda\lvert b \rvert$ keeps slope
              $\lambda$ right up to zero, and a kink there can hold the
              minimum in place.
            correct: true
            feedback: >
              Right. Near zero ridge charges almost nothing for a little
              coefficient, so some is always worth having; lasso charges a
              fixed rate per unit, and if the data's pull is weaker than that
              rate the coefficient stays at zero.
          - text: >
              Lasso drops regressors whose least-squares coefficient is
              insignificant.
            feedback: >
              Lasso never computes a $t$-statistic. It zeroes a coefficient
              when the data's pull, here $2 \times 3 = 6$, is below the
              penalty rate $\lambda = 8$.
        feedback: >
          Ridge shrinks smoothly; lasso shrinks and selects. That is the
          one-line difference interviewers want.

      - part: Setting the dial honestly
        ask: >
          On the data the model is fitted to, which value of $\lambda \ge 0$
          gives the smallest residual sum of squares?
        expects: "0"
        feedback: >
          $\lambda = 0$, plain least squares, which minimizes the residual sum
          of squares by definition; any penalty can only raise it. In-sample
          fit always votes against shrinkage, so $\lambda$ is chosen on data
          the fit did not see — cross-validation or a holdout period.
      - ask: >
          One signal is measured in percent and another in basis points, and
          both matter equally. Without standardizing, which coefficient does
          the penalty shrink harder?
        choices:
          - text: >
              The basis-point signal, because its raw numbers are larger.
            feedback: >
              Larger raw numbers mean a *smaller* coefficient for the same
              effect — $100$ times smaller. The penalty charges by coefficient
              size, so it barely touches that one.
          - text: >
              Neither: the penalty treats all coefficients alike.
            feedback: >
              It treats the coefficients alike, but the coefficients carry the
              units. The same economic effect is a coefficient of $1$ in one
              unit and $0.01$ in the other.
          - text: >
              The percent signal, whose coefficient is $100$ times larger for
              the same effect.
            correct: true
            feedback: >
              Right. Standardize every regressor first so the penalty falls on
              effects rather than on units, and leave the intercept out of the
              penalty so predictions shrink toward the mean, not toward zero.
        feedback: >
          In an interview: "Ridge when regressors are collinear and you want
          stability; lasso when you also want a short list. Standardize first,
          don't penalize the intercept, and pick $\lambda$ out of sample."
