unit: quant-probability.discrete
opening: >
  This unit catalogs the named discrete laws you are expected to
  recognize on sight: Bernoulli, binomial, geometric, negative binomial,
  Poisson, hypergeometric, and discrete uniform, each one built by
  counting or waiting on a stream of independent Bernoulli trials. The
  spine runs from the single $0/1$ trial through the fixed-$n$ count and
  the waiting-time laws to the rare-event limit connecting binomial and
  Poisson, then to sampling without replacement and how it compares to
  sampling with replacement. Two worked examples — rolls to a six and
  the coupon collector — anchor the abstractions in numbers you can
  check by hand, and the unit closes with a technique for reading a word
  problem and naming the right law before writing any formula.
lessons:
  - node: quant-probability.discrete.bernoulli
    hook: >
      Every yes/no question at a desk — a coin landing heads, a trade
      turning profitable, a quote getting lifted — reduces to this one
      law, and every other distribution in this chapter is literally
      built by summing or waiting on a stream of these.
    explanation: >
      A Bernoulli variable is a labeled coin: $X=1$ with probability
      $p$, $X=0$ otherwise. That is exactly the indicator of any event
      $A$ with $\Pr(A)=p$ — write $X=\mathbf{1}\{A\}$ and the two
      descriptions coincide. Every count in this chapter starts life as
      a sum of indicators like this one, which is why the convention
      "success $=1$" matters: it is what lets counting be rewritten as
      addition.

      The one fact worth internalizing is $X^{2}=X$, true because
      $0^{2}=0$ and $1^{2}=1$. That collapses the second moment onto the
      first, $\mathbb{E}[X^{2}]=\mathbb{E}[X]=p$, so the variance
      formula $\operatorname{Var}(X)=\mathbb{E}[X^{2}]-\mathbb{E}[X]^{2}$
      needs no separate computation:
      $\operatorname{Var}(X)=p-p^{2}=p(1-p)$.

      Plot $p(1-p)$ against $p$ and it is a downward parabola peaking at
      $p=1/2$ with value $1/4$, and touching $0$ at both endpoints. That
      is the right mental model for uncertainty: a coin whose outcome
      you already know ($p=0$ or $p=1$) carries no variance, and the
      hardest coin to predict is the fair one. Every other named law in
      this subbranch is a sum of, or a wait on, independent copies of
      this variable, so $p(1-p)$ reappears everywhere as a building
      block, not a one-off result.
    worked: >
      A market maker's resting quote is lifted on a given tick with
      probability $p=0.15$; let $X$ be the indicator of a lift. Then
      $\mathbb{E}[X]=0.15$ and $\operatorname{Var}(X)=0.15\times0.85=
      0.1275$, so the standard deviation is $\sqrt{0.1275}\approx0.357$.
    interview: >
      "Model this yes/no outcome" is asking you to write
      $\mathbb{E}[X]=p$ and $\operatorname{Var}(X)=p(1-p)$ instantly,
      and to explain the second in one line via $X^{2}=X$ rather than
      computing a second moment from scratch.
    pitfalls: >
      Forgetting the constraint $0\le p\le1$; computing
      $\mathbb{E}[X^{2}]$ as if it needed its own calculation instead of
      noting $X^{2}=X$; guessing that variance is largest at an extreme
      $p$ rather than at $p=1/2$.
    recap: >
      A Bernoulli is a single labeled trial with mean $p$ and variance
      $p(1-p)$, maximal at $p=1/2$ — the atom every other law in this
      chapter is built from.
    dialogue:
      - part: A winning day, written as a digit
        teach: >
          A strategy's daily result is logged as a single digit: $1$ on a day
          it makes money, $0$ on a day it does not. It has made money on $60$
          percent of days, and you treat each day as having that same chance,
          $0.6$. Call tomorrow's digit $X$.
      - ask: >
          What is $\mathbb{E}[X]$?
        expects: "0.6"
        feedback: >
          $1 \times 0.6 + 0 \times 0.4 = 0.6$. The zero contributes nothing,
          so the mean of a $0/1$ digit is simply the probability that it is
          $1$.
      - ask: >
          What is $\mathbb{E}[X^{2}]$?
        expects: "0.6"
        hint: >
          Square each value $X$ can take, then average with the same weights.
        feedback: >
          $1^{2} \times 0.6 + 0^{2} \times 0.4 = 0.6$. If you typed $0.36$,
          you squared the mean: that is $\mathbb{E}[X]^{2}$, a different
          number, and the gap between the two is exactly the variance.
      - ask: >
          What is $\operatorname{Var}(X)$?
        expects: "0.24"
        hint: >
          $\operatorname{Var}(X) = \mathbb{E}[X^{2}] - \mathbb{E}[X]^{2}$, and
          you have both pieces.
        feedback: >
          $0.6 - 0.6^{2} = 0.6 - 0.36 = 0.24$.
      - reflect: >
          Squaring $X$ did not change its mean. Say why, and what that does to
          the variance of any $0/1$ digit that is $1$ with probability $p$.
        answer: >
          The only values are $0$ and $1$, and $0^{2} = 0$, $1^{2} = 1$, so
          $X^{2} = X$ outcome by outcome — not just on average. The second
          moment is therefore the first, $\mathbb{E}[X^{2}] = p$, and the
          variance needs no separate computation:
          $\operatorname{Var}(X) = p - p^{2} = p(1-p)$.

      - part: The digit has a name
        teach: >
          A variable that equals $1$ with probability $p$ and $0$ otherwise,
          with $0 \le p \le 1$, is a Bernoulli$(p)$ variable. It is the same
          thing as the indicator $\mathbf{1}\{A\}$ of an event $A$ with
          $\Pr(A) = p$ — here $A$ is "tomorrow makes money". Its mean is $p$,
          and because $X^{2} = X$, its variance is $p(1-p)$.
      - ask: >
          Over every possible $p$ between $0$ and $1$, what is the largest
          variance a Bernoulli variable can have?
        expects: "0.25"
        hint: >
          $p(1-p)$ is a downward parabola that is $0$ at both ends.
        feedback: >
          The parabola $p(1-p)$ peaks halfway between its roots, at
          $p = 1/2$, where it equals $1/2 \times 1/2 = 1/4$. The fair coin is
          the hardest digit to predict; a digit you already know ($p = 0$ or
          $p = 1$) has no variance at all.
      - ask: >
          One strategy wins on $90$ percent of days, another on $10$ percent.
          Which daily digit has the larger variance?
        choices:
          - text: >
              The $0.9$ strategy: its digit is $1$ far more often.
            feedback: >
              Being $1$ often raises the mean, not the spread. Its variance is
              $0.9 \times 0.1 = 0.09$, and a digit that is almost always $1$
              is almost always predictable.
          - text: >
              The $0.1$ strategy: rare wins are more surprising.
            feedback: >
              Surprise on a rare day is real, but rare days are rare. The
              variance is $0.1 \times 0.9 = 0.09$ — no larger than the other.
          - text: >
              They are equal.
            correct: true
            feedback: >
              Both are $0.09$. $p(1-p)$ is unchanged when $p$ and $1-p$ swap,
              which is relabelling a win as a loss: the digit $1 - X$ has the
              same spread as $X$.
        feedback: >
          Variance of a Bernoulli depends only on how far $p$ sits from the
          ends of $[0, 1]$, symmetrically about $1/2$.

      - part: What counts, and what does not
        ask: >
          Which of these is a Bernoulli variable?
        choices:
          - text: >
              The face shown by a fair die.
            feedback: >
              It takes six values. A Bernoulli takes exactly the values $0$
              and $1$.
          - text: >
              The number of heads in two tosses of a fair coin.
            feedback: >
              It can be $2$. It is a sum of two Bernoulli variables, which is
              exactly how the next laws in this chapter are built — but it is
              not one itself.
          - text: >
              A variable equal to $1$ with probability $0.7$ and $0$ with
              probability $0.4$.
            feedback: >
              $0.7 + 0.4 = 1.1$, so this is not a probability law at all. The
              two weights must be $p$ and $1-p$ for one $p$ in $[0, 1]$.
          - text: >
              The indicator that a die roll shows $5$ or $6$.
            correct: true
            feedback: >
              It is $1$ with probability $2/6 = 1/3$ and $0$ otherwise:
              Bernoulli$(1/3)$, mean $1/3$, variance $2/9$.
        feedback: >
          Three clauses: only the values $0$ and $1$, weights $p$ and $1-p$,
          and $0 \le p \le 1$. Any yes/no event, turned into its indicator,
          passes all three.
      - ask: >
          A bet pays $Y = 2$ when a fair coin lands heads and $Y = 0$ on
          tails. It takes two values, with probability $1/2$ each. What is
          $\operatorname{Var}(Y)$?
        expects: "1"
        hint: >
          Compute $\mathbb{E}[Y^{2}]$ honestly. Is $Y^{2}$ equal to $Y$ here?
        feedback: >
          $\mathbb{E}[Y] = 2 \times 1/2 = 1$ and
          $\mathbb{E}[Y^{2}] = 4 \times 1/2 = 2$, so
          $\operatorname{Var}(Y) = 2 - 1 = 1$. The shortcut $p(1-p) = 0.25$
          is wrong by a factor of $4$: $Y^{2} = 2Y$, not $Y$. Writing
          $Y = 2X$ with $X$ Bernoulli$(1/2)$ gives
          $4 \times 1/4 = 1$, the same answer.
      - ask: >
          Which clause does $Y$ fail?
        choices:
          - text: >
              It takes two values, and a Bernoulli takes one.
            feedback: >
              A Bernoulli takes two values too. The trouble is which two.
          - text: >
              Its values are $0$ and $2$ rather than $0$ and $1$.
            correct: true
            feedback: >
              That single clause is what makes $X^{2} = X$ true, and with it
              the shortcut $\operatorname{Var} = p(1-p)$. Scale the $1$ to a
              $2$ and both are gone.
          - text: >
              A fair coin has $p = 1/2$, which is not allowed.
            feedback: >
              $p = 1/2$ is allowed — it is the case of largest variance. The
              coin is fine; the payout is the problem.
        feedback: >
          A two-point payout $c \cdot \mathbf{1}\{A\}$ is a scaled Bernoulli,
          with variance $c^{2}p(1-p)$. Strip off the scale before using the
          Bernoulli facts.
      - teach: >
          The convention that a success is $1$ is what makes counting into
          adding: the number of winning days in a five-day week is
          $X_{1} + \dots + X_{5}$, one indicator per day. Every law that
          follows is a sum of these digits, or a wait for one of them to come
          up $1$.

  - node: quant-probability.discrete.binomial
    hook: >
      "A fixed number of trials, count the hits" is the single most
      common setup in interview probability, and the trap is writing
      the probability of one pattern while forgetting to count how many
      patterns there are.
    explanation: >
      $X\sim\operatorname{Bin}(n,p)$ counts successes across $n$ trials
      that are independent and share one success probability $p$; both
      hypotheses are load-bearing. Build the pmf by decomposition: first
      choose which $k$ of the $n$ trials succeed — that is $\binom{n}{k}$
      ways — then, because the trials are independent, every such
      pattern has the same probability $p^{k}(1-p)^{n-k}$ (pay $p$ per
      success, $1-p$ per failure). Multiplying the count of patterns by
      the probability of one pattern gives
      $\Pr(X=k)=\binom{n}{k}p^{k}(1-p)^{n-k}$.

      Both hypotheses matter for a reason. If the trials are not
      independent — say, drawing without replacement so each draw
      changes what remains — the "multiply per-trial probabilities"
      step breaks, and the count is no longer binomial. If $p$ varies
      from trial to trial, choosing which $k$ trials succeed still makes
      sense, but different patterns of $k$ successes no longer share one
      probability, so no single $p^{k}(1-p)^{n-k}$ factors out.

      Two special cases and a check are worth having automatic:
      $\operatorname{Bin}(1,p)$ is Bernoulli$(p)$, and
      $n-X\sim\operatorname{Bin}(n,1-p)$ by relabeling success and
      failure. The fastest normalization check is that the pmf's terms
      sum to $(p+(1-p))^{n}=1$ — if a computed pmf does not sum to $1$,
      recheck the coefficient before the arithmetic.
    worked: >
      With $n=4$ independent trials and $p=0.3$,
      $\Pr(X=1)=\binom{4}{1}(0.3)^{1}(0.7)^{3}=4\times0.3\times0.343=
      0.4116$.
    interview: >
      "Flip a coin $n$ times" or "what's the probability exactly $k$ of
      $n$ calls are complaints" is this law; the interviewer wants both
      hypotheses named — fixed $n$, independent trials, constant $p$ —
      before the formula appears, and $\binom{n}{k}$ read aloud as
      "choose which trials succeed."
    pitfalls: >
      Writing only $p^{k}(1-p)^{n-k}$ and dropping the binomial
      coefficient, which forgets there are many orderings of the same
      count; assuming a drifting or dependent success probability still
      yields a binomial pmf.
    recap: >
      The binomial pmf is "choose which $k$ trials succeed, then pay
      $p$ per success and $1-p$ per failure" — valid only when trials
      are independent and share one $p$.
    dialogue:
      - part: Five quotes, two lifted
        teach: >
          You have resting quotes in five unrelated stocks. Each quote is
          lifted today with probability $0.2$, independently of the others.
      - ask: >
          What is the probability that the quotes in the first two stocks are
          lifted and the other three are not?
        expects: "0.02048"
        hint: >
          Independence lets you multiply one factor per stock.
        feedback: >
          $0.2 \times 0.2 \times 0.8 \times 0.8 \times 0.8 = 0.04 \times 0.512
          = 0.02048$. One factor of $0.2$ per lift, one factor of $0.8$ per
          miss.
      - ask: >
          What is the probability that exactly two of the five quotes are
          lifted?
        expects: "0.2048"
        hint: >
          The two lifted quotes need not be the first two. How many ways can
          you pick which two?
        feedback: >
          There are $\binom{5}{2} = 10$ choices of which two stocks are hit,
          and each pattern has probability $0.02048$, so the answer is
          $10 \times 0.02048 = 0.2048$. If you typed $0.02048$, you priced one
          pattern and forgot the other nine.
      - reflect: >
          Your answer was the number of patterns times the probability of one
          pattern. What had to be true of the five quotes for every pattern of
          two lifts to carry the same probability?
        answer: >
          Every quote had to share the same lift probability, and the lifts had
          to be independent. Then any pattern with two lifts and three misses
          is a product of two $0.2$s and three $0.8$s in some order, which is
          the same number every time. If one stock were likelier to be hit, or
          if one lift made another likelier, different patterns would carry
          different probabilities and there would be no single factor to pull
          out.

      - part: Fixed trials, count the hits
        teach: >
          That count has a name. If $n$ trials are independent and share one
          success probability $p$, the number of successes $X$ is binomial,
          $X \sim \operatorname{Bin}(n, p)$, with
          $\Pr(X = k) = \binom{n}{k}p^{k}(1-p)^{n-k}$ for $k = 0, 1, \dots, n$:
          choose which $k$ trials succeed, then pay $p$ per success and $1-p$
          per failure. With $n = 1$ it is the Bernoulli.
      - ask: >
          For the five quotes, what is the probability that none is lifted?
        expects: "0.32768"
        feedback: >
          $\binom{5}{0}(0.2)^{0}(0.8)^{5} = 0.8^{5} = 0.32768$. There is one
          pattern with no lifts, so the coefficient is $1$.
      - ask: >
          A colleague computes all six values $\Pr(X = 0), \dots, \Pr(X = 5)$
          for the quotes and finds they total $0.94$. What should they suspect
          first?
        choices:
          - text: >
              Rounding error in the small terms.
            feedback: >
              The six terms are short exact decimals here, and rounding cannot
              lose $0.06$. Something structural is missing.
          - text: >
              A wrong or missing binomial coefficient.
            correct: true
            feedback: >
              The six terms are exactly the terms of the expansion of
              $(0.2 + 0.8)^{5} = 1$, so they must total $1$. A shortfall almost
              always means a coefficient: $\binom{5}{2}$ written as $5$ instead
              of $10$ loses $0.1024$ on one term alone.
          - text: >
              The quotes are probably not independent after all.
            feedback: >
              The pmf was computed from the binomial model, and that model
              sums to $1$ whatever the real world does. A total of $0.94$ is an
              arithmetic fault, not a modelling verdict.
          - text: >
              Nothing: the pmf only sums to $1$ as $n$ grows.
            feedback: >
              It sums to exactly $1$ for every $n$, by the binomial theorem:
              $\sum_{k}\binom{n}{k}p^{k}(1-p)^{n-k} = (p + 1 - p)^{n}$.
        feedback: >
          The binomial theorem is the normalisation check: the pmf is the
          expansion of $(p + (1-p))^{n}$. Recheck the coefficients before the
          arithmetic.

      - part: Which counts are binomial
        ask: >
          Which of these counts is binomial?
        choices:
          - text: >
              The number of aces among five cards dealt from one deck.
            feedback: >
              The draws deplete the deck: once an ace is out, the next card is
              less likely to be one. The trials are dependent, so no single
              $p^{k}(1-p)^{n-k}$ prices every pattern.
          - text: >
              The number of rolls of a die until the first six.
            feedback: >
              Here the number of trials is the random thing, not the number of
              successes. That is a waiting time, a different law.
          - text: >
              The number of sixes in ten rolls of a fair die.
            correct: true
            feedback: >
              Ten fixed trials, independent, each a six with probability
              $1/6$: $\operatorname{Bin}(10, 1/6)$.
          - text: >
              The number of heads when you toss three coins whose heads
              probabilities are $0.3$, $0.5$ and $0.7$.
            feedback: >
              Fixed trials and independent, but the success probability changes
              from coin to coin. The shared-$p$ clause fails.
        feedback: >
          Three clauses: a fixed number of trials, independence, and one shared
          $p$. Count the successes, and the law is binomial.
      - ask: >
          Back to the five quotes, still independent, but one stock is now
          volatile and its quote is lifted with probability $0.6$; the other
          four stay at $0.2$. What is the probability that exactly one quote is
          lifted?
        expects: "0.4096"
        hint: >
          Split on whether the one lifted quote is the volatile stock's.
        feedback: >
          Volatile one lifted alone: $0.6 \times 0.8^{4} = 0.24576$. One of
          the four others lifted alone: each such pattern is
          $0.4 \times 0.2 \times 0.8^{3} = 0.04096$, and there are $4$ of them,
          $0.16384$. Total $0.4096$. The five patterns no longer share one
          probability.
      - ask: >
          A colleague averages the five lift probabilities to
          $p = 0.28$ and prices the count as $\operatorname{Bin}(5, 0.28)$.
          What is the verdict?
        choices:
          - text: >
              Fine: the expected number of lifts is $1.4$ either way.
            feedback: >
              The means do agree, but the pmf does not:
              $\operatorname{Bin}(5, 0.28)$ gives
              $\Pr(X = 1) = 5 \times 0.28 \times 0.72^{4} \approx 0.376$,
              against the true $0.4096$.
          - text: >
              Wrong, because the lifts are no longer independent.
            feedback: >
              They are still independent; nothing links one stock to another.
              A different clause broke.
          - text: >
              Wrong, because the trials no longer share one $p$.
            correct: true
            feedback: >
              Exactly one clause fails. Patterns with the volatile stock lifted
              cost more than patterns without, so no single $p^{k}(1-p)^{n-k}$
              factors out, and no choice of $p$ repairs it.
        feedback: >
          Averaging the probabilities preserves the mean and nothing else.
          Before writing $\binom{n}{k}$, check both hypotheses aloud: fixed $n$
          independent trials, one shared $p$. The interview signature is "a
          fixed number of trials, count the hits".

  - node: quant-probability.discrete.binomial-mean-variance
    hook: >
      Summing $k\binom{n}{k}p^{k}(1-p)^{n-k}$ by hand under interview
      pressure is a trap nobody should fall into — writing the count as
      a sum of indicators gets both moments in two lines.
    explanation: >
      Decompose $X=X_{1}+\dots+X_{n}$, where $X_{i}$ is the indicator
      that trial $i$ succeeds, each Bernoulli$(p)$. Linearity of
      expectation holds regardless of dependence, so
      $\mathbb{E}[X]=\sum_{i}\mathbb{E}[X_{i}]=np$ immediately — no
      binomial coefficient, no sum over $k$.

      Variance is where independence earns its keep: because the
      $X_{i}$ are independent, their variances add (this step fails for
      dependent indicators), and each $X_{i}$ has variance $p(1-p)$ from
      the Bernoulli itself, giving $\operatorname{Var}(X)=np(1-p)$ and
      $\sqrt{np(1-p)}$ for the standard deviation.

      The mean grows like $n$ while the standard deviation grows only
      like $\sqrt{n}$, so the relative spread shrinks like
      $1/\sqrt{n}$ — the observed proportion $X/n$ concentrates around
      $p$ as $n$ grows. A practical use:
      $np\pm2\sqrt{np(1-p)}$ is a fast plausibility band for a count
      without ever touching the pmf.
    worked: >
      With $n=400$ independent trials and $p=0.25$, the mean is $100$
      and $\operatorname{Var}(X)=400\times0.25\times0.75=75$, so
      $\sqrt{75}\approx8.66$; observing $120$ successes sits about
      $2.3$ standard deviations above the mean.
    interview: >
      "What's the mean and variance of $\operatorname{Bin}(n,p)$" is a
      speed check — answer $np$ and $np(1-p)$ cold, and justify each in
      one clause (linearity, then independent variances adding) rather
      than citing the formula.
    pitfalls: >
      Attempting to sum the pmf directly under time pressure instead of
      reaching for indicators; quoting $\operatorname{Var}(X)=np(1-p)$
      for trials that are not actually independent, where variances do
      not simply add.
    recap: >
      Indicators turn $\mathbb{E}[X]=np$ into a one-line linearity
      argument and $\operatorname{Var}(X)=np(1-p)$ into a one-line
      independence argument — never touch the pmf.
    dialogue:
      - part: Fifty orders and a range for the fills
        teach: >
          An execution algorithm sends $50$ child orders. Each fills with
          probability $0.3$, independently of the others. Before the open, risk
          wants a centre and a typical spread for the number of fills.
      - ask: >
          What is the expected number of fills?
        expects: "15"
        feedback: >
          $50 \times 0.3 = 15$. Most people get this instantly; the next
          question is what licenses it.
      - ask: >
          Which argument actually justifies $15$?
        choices:
          - text: >
              Sum $k\binom{50}{k}(0.3)^{k}(0.7)^{50-k}$ over $k$; there is no
              shorter honest route.
            feedback: >
              That sum does equal $15$, but it is fifty-one terms of algebra
              for a number you can get in one line. Under time pressure it is
              the wrong tool.
          - text: >
              Write the count as fifty fill indicators, each with mean $0.3$,
              and add their means.
            correct: true
            feedback: >
              Linearity of expectation adds the fifty means, $50 \times 0.3$.
              No pmf, no binomial coefficient.
          - text: >
              $15$ is the most likely count, so it must be the mean.
            feedback: >
              The most likely value and the mean are different quantities and
              need not coincide; when they do, it is a consequence, not a
              reason.
        feedback: >
          The count is $X = X_{1} + \dots + X_{50}$, with $X_{i}$ the indicator
          that order $i$ fills, each Bernoulli$(0.3)$. Linearity turns the
          mean into a one-liner.
      - reflect: >
          Each indicator has variance $0.3 \times 0.7 = 0.21$. Can you add the
          fifty variances the way you added the fifty means? Say what you would
          need, and what goes wrong without it.
        answer: >
          Only because the orders are independent: variances of independent
          summands add, so the count has variance $50 \times 0.21 = 10.5$. If
          orders tend to fill together, a good day for one is a good day for
          many, the count swings further than the sum of the parts, and the
          true variance is larger. Linearity of the mean never needed
          independence; adding variances does.

      - part: Adding up the indicators
        teach: >
          For $X \sim \operatorname{Bin}(n, p)$, write $X$ as $n$ independent
          Bernoulli$(p)$ indicators. Linearity gives $\mathbb{E}[X] = np$, and
          because the indicators are independent their variances add:
          $\operatorname{Var}(X) = np(1-p)$, so the standard deviation is
          $\sqrt{np(1-p)}$. No sum over $k$ is ever needed.
      - ask: >
          What is the standard deviation of the number of fills? Give two
          decimal places.
        expects: "3.24"
        tolerance: 0.01
        feedback: >
          $\operatorname{Var}(X) = 50 \times 0.3 \times 0.7 = 10.5$, and
          $\sqrt{10.5} \approx 3.24$.
      - ask: >
          One day the algorithm gets $25$ fills. How many standard deviations
          above the mean is that? Give two decimal places.
        expects: "3.09"
        tolerance: 0.02
        feedback: >
          $(25 - 15)/3.24 \approx 3.09$. The band $np \pm 2\sqrt{np(1-p)}$,
          roughly $8.5$ to $21.5$ here, is the fast plausibility check; $25$
          sits well outside it, which is a reason to ask whether the fill
          probability or the independence assumption has changed.

      - part: When the orders fill together
        ask: >
          Now suppose the $50$ orders are slices of one parent order: with
          probability $0.3$ all of them fill, and otherwise none does. Each
          order still fills with probability $0.3$. What is the variance of the
          number of fills?
        expects: "525"
        hint: >
          The count is $50$ with probability $0.3$ and $0$ otherwise.
        feedback: >
          The count is $50$ times a single Bernoulli$(0.3)$, so its variance is
          $50^{2} \times 0.21 = 525$ — fifty times the $10.5$ of independent
          orders. The orders now move in lockstep, the most extreme way to
          fill together.
      - ask: >
          In that all-or-nothing case, which part of the binomial summary
          survives?
        choices:
          - text: >
              Both: each order still fills with probability $0.3$.
            feedback: >
              The marginal probabilities are unchanged, and the variance
              moved from $10.5$ to $525$ anyway. Variance depends on how the
              orders move together, not only on each order alone.
          - text: >
              Neither: once orders are dependent, nothing about the binomial
              applies.
            feedback: >
              The mean is still $50 \times 0.3 = 15$: the count is $50$ with
              probability $0.3$, and $50 \times 0.3 = 15$. Linearity does not
              care about dependence.
          - text: >
              The mean $np = 15$, but not the variance $np(1-p)$.
            correct: true
            feedback: >
              Linearity gives the mean for any dependence. Adding the variances
              used independence, and that step is the one that breaks.
        feedback: >
          $np$ needs only linearity; $np(1-p)$ needs independence. Quoting
          $np(1-p)$ for correlated trials understates the risk.

      - part: The rate concentrates
        ask: >
          Back to independent orders. The fill rate is $X/50$. What is its
          standard deviation? Give four decimal places.
        expects: "0.0648"
        tolerance: 0.0005
        hint: >
          Dividing a variable by $50$ divides its standard deviation by $50$.
        feedback: >
          $3.24/50 \approx 0.0648$, which is
          $\sqrt{p(1-p)/n} = \sqrt{0.21/50}$. The rate has standard deviation
          about $6.5$ percentage points.
      - ask: >
          How many independent orders would bring the standard deviation of the
          fill rate down to half of that?
        expects: "200"
        feedback: >
          $\sqrt{p(1-p)/n}$ halves when $n$ quadruples: $4 \times 50 = 200$.
          The mean count grows like $n$ but its spread only like $\sqrt{n}$, so
          the observed rate concentrates around $p$ — slowly.
      - teach: >
          In an interview, say the decomposition before the numbers: "a sum of
          $n$ independent indicators, so mean $np$ and variance $np(1-p)$". It
          shows you know which half of the answer used independence.

  - node: quant-probability.discrete.binomial-mode
    hook: >
      "What's the single most likely count" is a different question
      from the mean, and interviewers ask it specifically to see
      whether you conflate the two.
    explanation: >
      Compare adjacent probabilities through their ratio:
      $\dfrac{\Pr(X=k)}{\Pr(X=k-1)}=\dfrac{n-k+1}{k}\cdot\dfrac{p}{1-p}$,
      which follows from $\binom{n}{k}/\binom{n}{k-1}=(n-k+1)/k$
      together with the extra factor of $p/(1-p)$. This ratio is at
      least $1$ — the pmf still climbing — exactly when $k\le(n+1)p$,
      and less than $1$ afterward.

      So the pmf rises then falls, unimodal, and the peak sits at the
      last $k$ where the ratio is still at least $1$: the mode is
      $\lfloor(n+1)p\rfloor$. When $(n+1)p$ lands exactly on an integer,
      the ratio equals $1$ there, and that $k$ ties with $k-1$ as a
      second mode.

      The mode always sits within $1$ of the mean $np$, since
      $(n+1)p=np+p$ and $p\le1$ — a cheap sanity check: a computed mode
      far from $np$ signals an arithmetic slip, not a real feature of
      the binomial.

      This ratio-of-consecutive-terms technique is not special to the
      binomial: it finds the mode of any pmf built from a product of
      factorials or binomial coefficients, since the ratio of adjacent
      terms always collapses to something simple enough to test against
      $1$.
    worked: >
      For $n=20$, $p=0.6$: $(n+1)p=12.6$, so the mode is $12$, matching
      the mean $np=12$. For $n=19$, $p=0.6$: $(n+1)p=12$ exactly, so the
      modes are $11$ and $12$, tied, straddling the mean $np=11.4$.
    interview: >
      "What's the most likely outcome of $n$ trials" wants
      $\lfloor(n+1)p\rfloor$ directly, not $np$ rounded; if pressed for
      why, cite the consecutive-ratio test, and mention the tie only
      when $(n+1)p$ happens to land on an integer.
    pitfalls: >
      Rounding $np$ instead of computing $\lfloor(n+1)p\rfloor$, which
      is wrong near integer boundaries; missing the tied-mode case when
      $(n+1)p$ is exactly an integer.
    recap: >
      The binomial peaks at $\lfloor(n+1)p\rfloor$, found from where
      consecutive pmf values swap from rising to falling, always within
      $1$ of the mean $np$.
    dialogue:
      - part: Twenty-two orders, the likeliest count
        teach: >
          An algorithm sends $22$ orders, each filling with probability $0.3$,
          independently, so the fill count is $\operatorname{Bin}(22, 0.3)$
          with mean $6.6$. The trader asks a different question: which single
          count is most likely?
      - ask: >
          Before computing anything, which count would you bet on?
        choices:
          - text: >
              $7$: round the mean.
            feedback: >
              The natural guess, and here it is wrong by a hair:
              $\Pr(X = 7)$ is about $2$ percent smaller than $\Pr(X = 6)$.
              The next two questions measure exactly that.
          - text: >
              $6$ and $7$, tied, because $6.6$ sits between them.
            feedback: >
              A tie needs the two probabilities to be exactly equal, and
              nothing about $6.6$ forces that. They differ, by a ratio you are
              about to compute.
          - text: >
              $6$.
            correct: true
            feedback: >
              Right, though flooring the mean is not the reason: the rule that
              decides it is about to fall out of a ratio.
        feedback: >
          The mean is an average over all counts; the mode is the single
          tallest bar. Comparing neighbouring bars is how you find it.
      - ask: >
          Compute $\Pr(X = 7)/\Pr(X = 6)$ as a fraction.
        expects: "48/49"
        tolerance: 0.0005
        hint: >
          $\binom{22}{7}/\binom{22}{6} = 16/7$. Moving from $6$ successes to
          $7$ also swaps one factor of $0.7$ for a factor of $0.3$.
        feedback: >
          $\dfrac{16}{7} \cdot \dfrac{0.3}{0.7} = \dfrac{16}{7} \cdot
          \dfrac{3}{7} = \dfrac{48}{49}$, just under $1$. The bar at $7$ is
          slightly shorter than the bar at $6$.
      - ask: >
          Now $\Pr(X = 6)/\Pr(X = 5)$, as a decimal to two places.
        expects: "1.21"
        tolerance: 0.01
        feedback: >
          $\binom{22}{6}/\binom{22}{5} = 17/6$, so the ratio is
          $\dfrac{17}{6} \cdot \dfrac{3}{7} = \dfrac{17}{14} \approx 1.21$. The
          bars climb into $6$ and fall away after it.
      - reflect: >
          The ratio of neighbouring bars,
          $\dfrac{n-k+1}{k} \cdot \dfrac{p}{1-p}$, crossed $1$ between $k = 6$
          and $k = 7$. Solve for the $k$ where it is at least $1$ in general.
          What does that make the mode?
        answer: >
          $\dfrac{(n-k+1)p}{k(1-p)} \ge 1$ rearranges to
          $(n-k+1)p \ge k - kp$, that is $k \le (n+1)p$. The bars climb as long
          as $k \le (n+1)p$ and fall afterwards, so the tallest is the last $k$
          that still qualifies: $\lfloor (n+1)p \rfloor$. Here
          $23 \times 0.3 = 6.9$, which floors to $6$.

      - part: The last bar that still climbs
        teach: >
          The binomial pmf rises then falls, and its mode is
          $\lfloor (n+1)p \rfloor$. When $(n+1)p$ is a whole number the ratio
          equals $1$ exactly there, and $(n+1)p$ and $(n+1)p - 1$ are tied
          modes. Since $(n+1)p = np + p$ and $p \le 1$, the mode always sits
          within $1$ of the mean.
      - ask: >
          What is the mode of $\operatorname{Bin}(30, 0.45)$?
        expects: "13"
        feedback: >
          $(n+1)p = 31 \times 0.45 = 13.95$, which floors to $13$. The mean is
          $13.5$, and rounding it up gives $14$ — wrong, since the bar at $14$
          has ratio $\dfrac{17}{14} \cdot \dfrac{9}{11} = \dfrac{153}{154}$ to
          the bar at $13$.
      - ask: >
          What are the modes of $\operatorname{Bin}(15, 1/4)$?
        choices:
          - text: >
              $4$ alone, rounding the mean $3.75$.
            feedback: >
              $4$ is a mode, but not alone: $(n+1)p = 16/4 = 4$ is a whole
              number, so the bar at $3$ is exactly as tall.
          - text: >
              $3$ and $4$, tied.
            correct: true
            feedback: >
              At $k = 4$ the ratio is $\dfrac{12}{4} \cdot \dfrac{1}{3} = 1$,
              so $\Pr(X = 4) = \Pr(X = 3)$, and both beat every other count.
          - text: >
              $3$ alone, flooring the mean $3.75$.
            feedback: >
              Flooring the mean finds one mode and misses the other. The test
              is whether $(n+1)p$ is a whole number, and $16 \times 1/4 = 4$
              is.
          - text: >
              $4$ and $5$, tied.
            feedback: >
              The tie sits at $(n+1)p$ and one below it, so at $4$ and $3$. At
              $k = 5$ the ratio is $\dfrac{11}{5} \cdot \dfrac{1}{3} < 1$.
        feedback: >
          An integer $(n+1)p$ is the only way to get two modes, and when it
          happens the pair is $(n+1)p - 1$ and $(n+1)p$.

      - part: Where the rule needs care
        ask: >
          Apply $\lfloor (n+1)p \rfloor$ to $\operatorname{Bin}(8, 1)$, a count
          of eight trials that always succeed. What happens?
        choices:
          - text: >
              It gives $8$, correctly.
            feedback: >
              It gives $\lfloor 9 \times 1 \rfloor = 9$, which is not even a
              possible count. The correct mode is $8$, but the formula did not
              produce it.
          - text: >
              It gives $9$, outside the support; the ratio divides by
              $1 - p = 0$, so the derivation never covered $p = 1$.
            correct: true
            feedback: >
              The neighbour ratio needs $p < 1$. At $p = 1$ the whole mass sits
              at $n$ and the mode is $8$, read off directly.
          - text: >
              It gives $9$ and $8$ tied, since $(n+1)p$ is a whole number.
            feedback: >
              The tie rule would say so, but $\Pr(X = 9) = 0$ and
              $\Pr(X = 8) = 1$. The rule was derived for $0 < p < 1$ only.
        feedback: >
          Degenerate $p$ is the boundary where the ratio argument breaks; for
          every $p$ strictly between $0$ and $1$ the rule holds.
      - ask: >
          A colleague reports that $\operatorname{Bin}(60, 0.2)$ has mode
          $15$. What is the mode?
        expects: "12"
        hint: >
          Before computing it, compare $15$ with the mean.
        feedback: >
          $(n+1)p = 61 \times 0.2 = 12.2$, so the mode is $12$. The quick
          sanity check catches the slip first: the mean is $12$, and a mode
          three away from the mean is impossible for a binomial.
      - teach: >
          Comparing neighbouring terms against $1$ is a general tool: any pmf
          built from factorials or binomial coefficients has a ratio of
          adjacent terms that collapses to something simple. In an interview,
          say "the ratio of consecutive terms is at least $1$ exactly when
          $k \le (n+1)p$" and the mode follows in one line.

  - node: quant-probability.discrete.binomial-additivity
    hook: >
      Pooling two samples — an A/B test's two arms, two independent
      risk books — is asked as "what's the combined count distributed
      as," and it's a one-line answer only when the two share a success
      probability.
    explanation: >
      If $X\sim\operatorname{Bin}(m,p)$ and $Y\sim\operatorname{Bin}
      (n,p)$ are independent with the same $p$, then
      $X+Y\sim\operatorname{Bin}(m+n,p)$. The clean proof needs no
      convolution: pool the trials. $X$ counts successes among $m$
      independent trials and $Y$ counts successes among $n$ more, all
      sharing the same success chance, so $X+Y$ is simply the success
      count over all $m+n$ trials — which is $\operatorname{Bin}(m+n,
      p)$ by definition.

      A convolution proof exists too — summing
      $\binom{m}{k}\binom{n}{j-k}p^{j}(1-p)^{m+n-j}$ over $k$ reduces to
      the Vandermonde identity
      $\sum_{k}\binom{m}{k}\binom{n}{j-k}=\binom{m+n}{j}$ — but the
      pooling argument is the one to reach for at a desk.

      Equal $p$ is essential, not cosmetic: mixing two different
      success rates gives a sum with mean $mp+nq$, but the sum is not
      binomial at all, because no single $p$ can reproduce two
      different per-trial variances glued together.
    worked: >
      A desk independently fills $3$ large orders with probability
      $0.4$ each, and $4$ more independent orders also at $0.4$: total
      fills are $\operatorname{Bin}(7,0.4)$, with mean $2.8$.
    interview: >
      "You pool data from two experiments with the same conversion
      rate — what's the combined count distributed as" wants
      $\operatorname{Bin}(m+n,p)$ by the pooling argument; a strong
      answer flags immediately that the sum stops being binomial the
      moment the two rates differ.
    pitfalls: >
      Assuming any two independent binomials sum to a binomial — false
      as soon as $p\ne q$; pooling trials that are not actually
      independent of each other.
    recap: >
      Independent binomials with a common $p$ pool into one binomial
      over the combined trial count; different success probabilities
      break the property entirely.
    dialogue:
      - part: Two desks, one count of breaks
        teach: >
          Desk A runs $2$ hedges and desk B runs $3$. Each of the five hedges
          breaks this week with probability $0.1$, independently of every
          other. Desk A's breaks are $\operatorname{Bin}(2, 0.1)$ and desk B's
          are $\operatorname{Bin}(3, 0.1)$.
      - ask: >
          What is the probability that exactly one hedge breaks in total?
        expects: "0.32805"
        hint: >
          Either desk A has the break and desk B has none, or the other way
          round.
        feedback: >
          A one, B none: $(2 \times 0.1 \times 0.9) \times 0.9^{3} = 0.18
          \times 0.729 = 0.13122$. A none, B one: $0.81 \times (3 \times 0.1
          \times 0.81) = 0.81 \times 0.243 = 0.19683$. Total $0.32805$.
      - reflect: >
          The split by desk made you add two cases, and exactly two breaks
          would need three. But the hedges do not know which desk owns them.
          Describe the total number of breaks without mentioning the desks, and
          say what law that makes it.
        answer: >
          It is the number of breaks among five hedges that are independent
          and each break with probability $0.1$ — a fixed number of trials,
          one shared $p$, count the successes. So the total is
          $\operatorname{Bin}(5, 0.1)$, and indeed
          $5 \times 0.1 \times 0.9^{4} = 0.32805$. The desk boundary is
          bookkeeping, not probability.

      - part: Pool the trials
        teach: >
          If $X \sim \operatorname{Bin}(m, p)$ and $Y \sim \operatorname{Bin}(n,
          p)$ are independent with the same $p$, then
          $X + Y \sim \operatorname{Bin}(m + n, p)$. The proof is the pooling
          you just did: $X$ counts successes in $m$ trials, $Y$ in $n$ more,
          all independent with one $p$, so $X + Y$ counts successes in
          $m + n$ such trials.
      - ask: >
          What is the probability that exactly two hedges break in total?
        expects: "0.0729"
        feedback: >
          $\binom{5}{2}(0.1)^{2}(0.9)^{3} = 10 \times 0.01 \times 0.729 =
          0.0729$. The three-case convolution agrees:
          $0.81 \times 0.027 + 0.18 \times 0.243 + 0.01 \times 0.729 =
          0.02187 + 0.04374 + 0.00729 = 0.0729$.
      - ask: >
          What is the variance of the total number of breaks?
        expects: "0.45"
        feedback: >
          $5 \times 0.1 \times 0.9 = 0.45$, which is also
          $2 \times 0.09 + 3 \times 0.09$, the two desks' variances added — as
          it should be for independent desks.
      - ask: >
          Which facts did the pooling argument actually use?
        choices:
          - text: >
              Only that $X$ and $Y$ are both binomial.
            feedback: >
              Not enough: a sum of two independent binomials with different
              $p$ is not binomial, as the next part shows.
          - text: >
              That the two desks have the same number of hedges.
            feedback: >
              $m = 2$ and $n = 3$ differ and the argument did not blink. Block
              sizes can be anything.
          - text: >
              Two disjoint blocks of trials, all independent, sharing one $p$.
            correct: true
            feedback: >
              Disjoint, so no trial is counted twice; independent across
              blocks, so the pooled trials are independent; one $p$, so the
              pooled count has one success probability.
        feedback: >
          The conclusion is just the binomial's own definition applied to the
          pooled trials, so it needs exactly the binomial's hypotheses on the
          pooled set.
      - ask: >
          A third desk with $4$ hedges joins, same $p = 0.1$, independent of
          the others. What is the probability that none of the nine hedges
          breaks? Give four decimal places.
        expects: "0.3874"
        tolerance: 0.0005
        feedback: >
          Pooling twice gives $\operatorname{Bin}(9, 0.1)$, and
          $\Pr(0) = 0.9^{9} \approx 0.3874$. By induction, any number of
          independent same-$p$ binomials pool into one.

      - part: When the desks differ
        ask: >
          Now desk B's three hedges each break with probability $0.3$ instead;
          desk A stays at $0.1$. What is the variance of the total number of
          breaks?
        expects: "0.81"
        feedback: >
          The desks are still independent, so variances add:
          $2 \times 0.1 \times 0.9 + 3 \times 0.3 \times 0.7 = 0.18 + 0.63 =
          0.81$. The mean is $0.2 + 0.9 = 1.1$.
      - ask: >
          A colleague says the total is $\operatorname{Bin}(5, 0.22)$, since
          that has the right mean $1.1$. What is the verdict?
        choices:
          - text: >
              Correct: a sum of independent binomials is binomial, and the
              mean fixes $p$.
            feedback: >
              $\operatorname{Bin}(5, 0.22)$ has variance
              $5 \times 0.22 \times 0.78 = 0.858$, but the true total has
              $0.81$. Matching the mean is not matching the law.
          - text: >
              Wrong: the total is not binomial at all, because the hedges no
              longer share one $p$.
            correct: true
            feedback: >
              Mixing two success rates spreads the per-hedge variances
              unevenly — $0.09$ for some, $0.21$ for others — and no single $p$
              reproduces that. The only binomial with mean $1.1$ over five
              trials has the wrong variance.
          - text: >
              Wrong: the correct law is $\operatorname{Bin}(5, 0.4)$, adding
              the two probabilities.
            feedback: >
              That has mean $2$, not $1.1$. Adding success probabilities is
              never how independent counts combine.
        feedback: >
          Equal $p$ is load-bearing. The mean of the total is always
          $mp + nq$; the binomial shape survives only when $p = q$.
      - teach: >
          The algebra behind pooling is Vandermonde's identity,
          $\sum_{k}\binom{m}{k}\binom{n}{j-k} = \binom{m+n}{j}$, which is what
          the convolution reduces to. In an interview, skip it: "pool the
          trials, same $p$, so it is $\operatorname{Bin}(m + n, p)$" is the
          answer they want, followed by the check that $p$ really is shared.

  - node: quant-probability.discrete.geometric
    hook: >
      "How many trials until the first success" is the second most
      common story problem in this chapter, and its two competing
      conventions — count trials or count failures — trip up anyone who
      doesn't say which one they mean.
    explanation: >
      Run independent Bernoulli$(p)$ trials and let $X$ be the trial
      number of the first success. To succeed exactly on trial $k$ you
      must fail the first $k-1$ trials, then succeed once, and
      independence multiplies those probabilities:
      $\Pr(X=k)=(1-p)^{k-1}p$. This is a genuine probability law because
      the geometric series gives
      $\sum_{k\ge1}(1-p)^{k-1}p=p/(1-(1-p))=1$.

      The tail is more useful than the pmf in practice:
      $\Pr(X\ge k)=(1-p)^{k-1}$ is just "fail the first $k-1$ trials,"
      and $\Pr(X>k)=(1-p)^{k}$. Since $(1-p)^{k}\to0$ whenever $p>0$,
      $X$ is finite with probability $1$ — the wait always ends
      eventually, even though no upper bound exists on how long it
      could take.

      State the convention trap out loud: this $X$ counts the trial
      number of the first success, support $\{1,2,\dots\}$. The
      alternate convention $Y=X-1$ counts failures before the first
      success, support $\{0,1,2,\dots\}$, with shifted pmf
      $(1-p)^{k}p$ and mean smaller by exactly $1$. Since both
      conventions appear constantly, name yours before quoting a mean.
    worked: >
      A cold call converts with probability $p=0.1$ per call. The
      probability the first conversion happens on exactly the fifth
      call is $(0.9)^{4}(0.1)=0.6561\times0.1=0.06561$, and the
      probability more than three calls are needed is
      $(0.9)^{3}=0.729$.
    interview: >
      "Expected number of trials until the first success" and
      "probability the first defect appears on unit $k$" are both this
      law; the interviewer listens for the immediate pmf
      $(1-p)^{k-1}p$ and for you to state which convention you're
      using.
    pitfalls: >
      Switching silently between the trials-counted and
      failures-counted conventions mid-problem; forgetting $p>0$ is
      required, since $p=0$ means the event never happens and there is
      no valid distribution.
    recap: >
      The geometric law gives the trial number of the first success,
      pmf $(1-p)^{k-1}p$, tail $(1-p)^{k-1}$, and a failures-counted
      twin that differs by exactly one trial.
    dialogue:
      - part: An order that waits for its fill
        teach: >
          A limit order rests at the bid. On any given day it fills with
          probability $0.25$, independently of every other day, and you leave
          it in until it fills. Let $X$ be the day on which it fills.
      - ask: >
          What is the probability that it fills on exactly day $3$? Give the
          exact decimal.
        expects: "0.140625"
        hint: >
          What has to happen on days $1$ and $2$?
        feedback: >
          Days $1$ and $2$ must both miss and day $3$ must fill:
          $0.75 \times 0.75 \times 0.25 = 0.140625$.
      - ask: >
          What is the probability that the order is still unfilled after $4$
          days? Give four decimal places.
        expects: "0.3164"
        tolerance: 0.0005
        hint: >
          You do not need the probabilities of days $1$ through $4$
          separately.
        feedback: >
          Unfilled after $4$ days means four misses in a row:
          $0.75^{4} \approx 0.3164$. Adding up
          $\Pr(X = 1) + \dots + \Pr(X = 4)$ and subtracting from $1$ gives the
          same number the long way.
      - reflect: >
          You priced "still unfilled after $4$ days" in one line. What event
          were you really pricing, and why does it make the tail simpler than
          the individual probabilities? What does it say happens to the tail
          as the days pile up?
        answer: >
          $X > 4$ is the same event as "the first four days all miss", which is
          a product of four independent misses, $(1-p)^{4}$ — no sum needed.
          In general $\Pr(X > k) = (1-p)^{k}$, and since $0.75^{k} \to 0$ the
          chance of waiting forever is $0$: the order fills eventually with
          probability $1$, even though no day is guaranteed.

      - part: The first success, named
        teach: >
          Run independent Bernoulli$(p)$ trials with $p > 0$, and let $X$ be
          the index of the first success. $X$ is geometric:
          $\Pr(X = k) = (1-p)^{k-1}p$ for $k = 1, 2, \dots$, and its tail is
          $\Pr(X > k) = (1-p)^{k}$. The pmf sums to $p/(1 - (1-p)) = 1$ by the
          geometric series.
      - ask: >
          For the resting order, what is $\Pr(X \ge 3)$?
        expects: "0.5625"
        feedback: >
          $X \ge 3$ means days $1$ and $2$ both missed:
          $0.75^{2} = 0.5625$. Compare $\Pr(X > 3) = 0.75^{3} \approx 0.4219$;
          in general $\Pr(X \ge k) = (1-p)^{k-1}$, one factor fewer than for
          $>$, because $X \ge k$ only needs the first $k - 1$ trials to miss.
      - ask: >
          A colleague's model says the order "fills after $0$ days with
          probability $0.25$". What are they counting?
        choices:
          - text: >
              The same $X$ — they have just started the count at $0$ by
              mistake.
            feedback: >
              It is not a mistake. Many texts count differently, and the
              colleague's number is right for what they count.
          - text: >
              The number of days that missed before the fill, $Y = X - 1$.
            correct: true
            feedback: >
              $Y = 0$ is a fill on day $1$, with probability $0.25$. $Y$ lives
              on $\{0, 1, 2, \dots\}$ with pmf $(1-p)^{k}p$ — the same wait,
              shifted by one.
          - text: >
              A different order with a fill probability of $0.25$ on day $0$.
            feedback: >
              Nothing about the order changed; only the label on the days did.
              The probability $0.25$ is the chance of a fill on the very first
              day.
        feedback: >
          Two conventions are in constant use: trials up to and including the
          first success, from $1$, and failures before it, from $0$. Say which
          one you are pricing before quoting a number — every summary shifts
          by one between them.

      - part: What counts as a geometric wait
        ask: >
          Which of these is geometric?
        choices:
          - text: >
              The number of cards dealt from a shuffled deck until the first
              ace.
            feedback: >
              Each non-ace dealt raises the chance that the next card is an ace,
              and the wait can never pass $49$ cards. The per-trial probability
              is not constant.
          - text: >
              The number of rolls of a fair die until the first six.
            correct: true
            feedback: >
              Independent rolls, each a six with probability $1/6$, counted up
              to the first one: geometric with $p = 1/6$.
          - text: >
              The number of sixes in twelve rolls of a fair die.
            feedback: >
              A fixed number of trials with the successes counted is binomial.
              A geometric fixes the number of successes at one and lets the
              number of trials run.
          - text: >
              Guessing a four-digit code, never repeating a guess, until you
              hit it.
            feedback: >
              Without repeats, each miss removes a candidate and the next guess
              is likelier to succeed; the number of guesses is equally likely to
              be any of $1$ to $10000$, not geometric.
        feedback: >
          The clauses: independent trials, the same $p > 0$ on every trial,
          and $X$ the index of the first success.
      - ask: >
          A different order's fill chance grows as it ages: $0.1$ on day $1$,
          $0.2$ on day $2$, $0.3$ on day $3$, and so on. What is the
          probability it is still unfilled after $3$ days?
        expects: "0.504"
        feedback: >
          $0.9 \times 0.8 \times 0.7 = 0.504$. The tail is a product of
          different misses, not a power $(1-p)^{3}$ of one, so this wait is not
          geometric — the shared-$p$ clause is the one that fails.
      - ask: >
          An order is priced so far from the market that it fills with
          probability $0$ each day. What is wrong with calling its wait
          geometric with $p = 0$?
        choices:
          - text: >
              Nothing: it is geometric with mean $\infty$.
            feedback: >
              The pmf $(1-0)^{k-1} \times 0$ is $0$ for every $k$, so the
              probabilities sum to $0$, not $1$. There is no law here to have a
              mean.
          - text: >
              The trials are not independent.
            feedback: >
              They are as independent as before; every day still misses on its
              own. A different clause fails.
          - text: >
              With $p = 0$ the order never fills, so no first success exists
              and the pmf sums to $0$.
            correct: true
            feedback: >
              The requirement $p > 0$ is what makes the series sum to $1$: with
              $p = 0$, $\Pr(X > k) = 1$ for every $k$ and the wait never ends.
        feedback: >
          Every clause except one holds, and that one — $p > 0$ — is what turns
          a stream of misses into a wait that ends with probability $1$.

  - node: quant-probability.discrete.geometric-moments
    hook: >
      Deriving $\mathbb{E}[X]=1/p$ by summing $k(1-p)^{k-1}p$ term by
      term is a needless slog; the tail-sum formula gets there in one
      line.
    explanation: >
      For a nonnegative integer variable, the tail-sum formula gives
      $\mathbb{E}[X]=\sum_{k\ge1}\Pr(X\ge k)$. For the geometric,
      $\Pr(X\ge k)=(1-p)^{k-1}$, so
      $\mathbb{E}[X]=\sum_{k\ge1}(1-p)^{k-1}=1/p$ — a geometric series,
      done, with no derivative trick and no summation by parts.

      The second moment needs more bookkeeping:
      $\mathbb{E}[X^{2}]=(2-p)/p^{2}$, so
      $\operatorname{Var}(X)=\mathbb{E}[X^{2}]-\mathbb{E}[X]^{2}=
      (1-p)/p^{2}$, giving standard deviation $\sqrt{1-p}/p$.

      For rare successes ($p$ small), $1-p\approx1$, so
      $\sqrt{1-p}/p\approx1/p\approx\mathbb{E}[X]$: the standard
      deviation is nearly as large as the mean itself. That is the
      signature of a genuinely unpredictable wait — knowing the average
      wait tells you almost nothing about whether any particular wait
      was short or long.

      Contrast this with a count accumulated over many trials, whose
      relative spread shrinks as trials pile up: a single geometric
      wait never gets more predictable no matter how long you have
      already waited. The two moments here are exactly what feeds every
      waiting-time law built on top of the geometric, so committing
      $1/p$ and $(1-p)/p^{2}$ to memory pays off repeatedly.
    worked: >
      With $p=1/4$, the mean is $4$, $\operatorname{Var}(X)=0.75/
      0.0625=12$, and the standard deviation is $\sqrt{12}\approx3.46$
      — nearly as large as the mean itself.
    interview: >
      "What's the standard deviation of the time to the first success"
      tests whether you reach for the tail-sum trick rather than
      brute-forcing $\sum k^{2}(1-p)^{k-1}p$; a sharp answer notes
      $\sigma\approx1/p$ for small $p$ without further arithmetic.
    pitfalls: >
      Reporting $\mathbb{E}[X^{2}]$ as the variance without subtracting
      $\mathbb{E}[X]^{2}$; forgetting the tail-sum formula requires
      nonnegative integer values, which the geometric satisfies but not
      every waiting-time variable does.
    recap: >
      The tail sum turns $\mathbb{E}[X]=1/p$ into a one-line geometric
      series, and $\sigma\approx1/p$ for small $p$ means the wait is
      about as uncertain as it is long.
    dialogue:
      - part: Dealers until a tradable quote
        teach: >
          You send a request for a quote to dealers one at a time. Each dealer,
          independently, comes back with a tradable price with probability
          $0.2$. Let $X$ be the number of dealers you ask, up to and including
          the first tradable one.
      - ask: >
          What is $\mathbb{E}[X]$?
        expects: "5"
        feedback: >
          $5$, which is $1/p$. Most people know this one; the next question is
          whether you can show it without a trick you half remember.
      - ask: >
          The definition gives $\mathbb{E}[X] = \sum_{k \ge 1} k (0.8)^{k-1}(0.2)$.
          Why can you not sum it the way you summed the pmf itself?
        choices:
          - text: >
              It diverges, because $k$ grows without bound.
            feedback: >
              $0.8^{k-1}$ shrinks much faster than $k$ grows, so the series
              converges. Convergence is not the obstacle.
          - text: >
              You can: it is $0.2/(1 - 0.8) = 1$.
            feedback: >
              That is the sum of the pmf, without the $k$. The mean is $5$, not
              $1$ — the factor $k$ is the whole difference.
          - text: >
              The factor $k$ makes it something other than a plain geometric
              series.
            correct: true
            feedback: >
              Right. You can still do it by differentiating the geometric
              series term by term, but there is a route with no calculus at
              all.
        feedback: >
          The weights $k$ are what stand between you and a one-line sum. Get
          rid of them.
      - reflect: >
          You already know a way to write the mean of a variable on
          $\{1, 2, \dots\}$ as a sum of tail probabilities, with no factor of
          $k$. Apply it to $X$. What do you get, and why is it short?
        answer: >
          The tail-sum formula: $\mathbb{E}[X] = \sum_{k \ge 1}\Pr(X \ge k)$.
          For a geometric, $\Pr(X \ge k)$ is "the first $k-1$ dealers all
          declined", $(0.8)^{k-1}$, so
          $\mathbb{E}[X] = \sum_{k \ge 1}(0.8)^{k-1} = 1/(1 - 0.8) = 5$. The
          tails are already a geometric series; the weights $k$ have been
          absorbed into how many tails each value belongs to.

      - part: Mean from the tails, and the spread
        teach: >
          For $X$ geometric on $\{1, 2, \dots\}$ with parameter $p$, the tail
          sum gives $\mathbb{E}[X] = \sum_{k \ge 1}(1-p)^{k-1} = 1/p$. The
          second moment takes more bookkeeping:
          $\mathbb{E}[X^{2}] = (2-p)/p^{2}$, so
          $\operatorname{Var}(X) = (2-p)/p^{2} - 1/p^{2} = (1-p)/p^{2}$ and the
          standard deviation is $\sqrt{1-p}\,/p$.
      - ask: >
          For the dealer search, what is the standard deviation of $X$? Give
          two decimal places.
        expects: "4.47"
        tolerance: 0.01
        feedback: >
          $\operatorname{Var}(X) = 0.8/0.04 = 20$, so $\sigma = \sqrt{20}
          \approx 4.47$ — almost as large as the mean of $5$. If you got
          $\sqrt{45}$, you used $\mathbb{E}[X^{2}] = 1.8/0.04 = 45$ and forgot
          to subtract $\mathbb{E}[X]^{2} = 25$.
      - ask: >
          What is the probability that you need more than $10$ dealers — more
          than twice the mean? Give four decimal places.
        expects: "0.1074"
        tolerance: 0.0005
        feedback: >
          The first ten all decline: $0.8^{10} \approx 0.1074$. About one
          search in nine takes more than twice the average. A geometric wait
          has a long right tail.

      - part: A wait as uncertain as it is long
        ask: >
          On one occasion the second dealer gave a tradable price, and a
          colleague concludes that $p$ must be about $1/2$. If $p$ really is
          $0.2$, how likely is a search that ends within two dealers?
        expects: "0.36"
        feedback: >
          $\Pr(X \le 2) = 1 - 0.8^{2} = 0.36$. More than a third of searches
          end that fast at $p = 0.2$, so one short wait is weak evidence of a
          large $p$. A single geometric wait says very little about its own
          parameter.
      - ask: >
          For a rarer event, $p = 0.05$, what is the ratio of the standard
          deviation to the mean? Give three decimal places.
        expects: "0.975"
        tolerance: 0.001
        hint: >
          $\sigma/\mathbb{E}[X] = (\sqrt{1-p}/p)/(1/p)$.
        feedback: >
          The $1/p$ cancels, leaving $\sqrt{1-p} = \sqrt{0.95} \approx
          0.975$. As $p \to 0$ the ratio tends to $1$: a rare-event wait is
          about as uncertain as it is long, and waiting longer never makes the
          remaining wait more predictable.

      - part: Counting declines instead
        ask: >
          A colleague counts only the dealers who declined before the first
          tradable price, $Y = X - 1$. With $p = 0.2$, what are $\mathbb{E}[Y]$
          and $\operatorname{Var}(Y)$?
        choices:
          - text: >
              $\mathbb{E}[Y] = 5$ and $\operatorname{Var}(Y) = 20$.
            feedback: >
              $Y$ is $X$ shifted down by one, so its mean is one less:
              $(1-p)/p = 4$.
          - text: >
              $\mathbb{E}[Y] = 4$ and $\operatorname{Var}(Y) = 16$.
            feedback: >
              The mean does drop to $4$, but subtracting a constant never
              changes a variance. It stays $(1-p)/p^{2} = 20$.
          - text: >
              $\mathbb{E}[Y] = 4$ and $\operatorname{Var}(Y) = 20$.
            correct: true
            feedback: >
              The shift moves the centre and leaves the spread alone:
              $\mathbb{E}[Y] = (1-p)/p = 4$, $\operatorname{Var}(Y) =
              (1-p)/p^{2} = 20$.
        feedback: >
          The two conventions disagree by exactly $1$ in the mean and not at
          all in the variance. In an interview, say "trials to the first
          success, mean $1/p$, variance $(1-p)/p^{2}$" and name the convention
          before the number.

  - node: quant-probability.discrete.memoryless-geometric
    hook: >
      "The coin is due for a head" is the gambler's fallacy stated as a
      memory claim, and this is the formal reason a geometric wait has
      none.
    explanation: >
      Memorylessness says $\Pr(X>m+n\mid X>m)=\Pr(X>n)$ for all
      integers $m,n\ge0$: conditional on having failed the first $m$
      trials, the number of additional trials needed looks exactly like
      a fresh wait. The proof is one line from the tail formula:
      $\Pr(X>m+n)=(1-p)^{m+n}=(1-p)^{m}(1-p)^{n}$, and dividing by
      $\Pr(X>m)=(1-p)^{m}$ leaves $(1-p)^{n}=\Pr(X>n)$.

      This is not a coincidence of the geometric specifically — it is
      the only law on $\{1,2,\dots\}$ with this property. Writing
      $g(k)=\Pr(X>k)$, memorylessness forces $g(m+n)=g(m)g(n)$ for all
      $m,n$, and the only solutions with $g(1)=1-p$ are
      $g(k)=(1-p)^{k}$, exactly the geometric tail. "Memoryless" and
      "geometric" are the same fact stated two ways.

      The interview payoff: after ten failed tosses, the expected
      number of further tosses to the first head is still $1/p$, not
      less. Trials carry no memory of past failures because
      independence is built into the model from the start, so nothing
      about the process changes as failures pile up.
    worked: >
      A die ($p=1/6$) has been rolled $8$ times with no six. The
      expected number of further rolls to the first six is still $6$,
      and the probability that more than $2$ further rolls are needed
      is $(5/6)^{2}=25/36\approx0.694$ — identical to the unconditional
      probability of needing more than $2$ rolls from the very first
      toss.
    interview: >
      "You've flipped ten tails in a row — what's the expected number
      of flips to the next head" tests memorylessness directly; the
      correct answer restates $1/p$ with no downward adjustment, and a
      strong candidate names and proves the property in one line.
    pitfalls: >
      Adjusting the expected remaining wait downward because a run "is
      overdue" — the gambler's fallacy; applying memorylessness to a
      non-geometric wait, such as waiting for a pattern like $HH$,
      which does not have this property.
    recap: >
      A geometric wait forgets every failure that has already
      happened — conditional on failing so far, it restarts from
      scratch, and it is the only discrete law that does.
    dialogue:
      - part: Seven quiet minutes
        teach: >
          In each minute, independently, a large print hits the tape with
          probability $0.1$. Let $X$ be the minute of the first print. You have
          watched for $7$ minutes and seen none.
      - ask: >
          Compared with the moment you started watching, how likely is a print
          in the next minute now?
        choices:
          - text: >
              More likely: after seven quiet minutes, a print is overdue.
            feedback: >
              Each minute is an independent trial with chance $0.1$. Nothing
              in minute $8$ knows about minutes $1$ to $7$, so nothing can be
              "due".
          - text: >
              Less likely: seven quiet minutes suggest a quiet day.
            feedback: >
              That would be a fair inference if the rate were unknown and you
              were learning it. Here the rate is fixed at $0.1$ per minute, so
              the quiet tells you nothing about minute $8$.
          - text: >
              Exactly as likely, $0.1$.
            correct: true
            feedback: >
              Independent minutes with a fixed rate: the next minute is a fresh
              trial. The question is whether the same holds for the whole
              remaining wait, not just the next minute.
        feedback: >
          One minute at a time, the answer is plain. The next question asks
          about a stretch of minutes.
      - ask: >
          Given no print in the first $7$ minutes, what is the probability of
          no print in the next $5$ either? Give the exact decimal.
        expects: "0.59049"
        hint: >
          $\Pr(X > 12 \mid X > 7) = \Pr(X > 12)/\Pr(X > 7)$, and you know the
          geometric's tails.
        feedback: >
          $\dfrac{0.9^{12}}{0.9^{7}} = 0.9^{5} = 0.59049$. The seven quiet
          minutes cancel out of the ratio entirely.
      - reflect: >
          That conditional probability is also a number you could have
          computed on minute zero, before anything happened. Which number, and
          why must the two agree for every number of quiet minutes $m$ and
          every stretch $n$?
        answer: >
          It is $\Pr(X > 5)$, the chance that the first five minutes are quiet.
          The tail of a geometric is a power, so it factors:
          $(1-p)^{m+n} = (1-p)^{m}(1-p)^{n}$, and dividing by
          $\Pr(X > m) = (1-p)^{m}$ leaves $(1-p)^{n} = \Pr(X > n)$. Having
          waited $m$ minutes changes nothing about the wait ahead.

      - part: The wait forgets
        teach: >
          This is memorylessness: for a geometric $X$ and all integers
          $m, n \ge 0$, $\Pr(X > m + n \mid X > m) = \Pr(X > n)$. Conditional
          on $m$ failures, the remaining wait is a fresh geometric with the
          same $p$.
      - ask: >
          After the $7$ quiet minutes, what is the expected number of further
          minutes until the first print?
        expects: "10"
        feedback: >
          The remaining wait is geometric with $p = 0.1$ again, so its mean is
          $1/p = 10$ — the same as it was at minute zero.
      - ask: >
          After the $7$ quiet minutes, what is the probability of a print
          within the next $3$ minutes?
        expects: "0.271"
        feedback: >
          $1 - 0.9^{3} = 1 - 0.729 = 0.271$, exactly the chance of a print in
          the first $3$ minutes of the day.
      - ask: >
          Why is the geometric the only memoryless law on $\{1, 2, \dots\}$?
          Write $g(k) = \Pr(X > k)$. Memorylessness says
          $g(m + n) = g(m)g(n)$. If $g(1) = 0.9$, what must $g(3)$ be?
        expects: "0.729"
        feedback: >
          $g(2) = g(1)g(1) = 0.81$ and $g(3) = g(2)g(1) = 0.729$. By induction
          $g(k) = 0.9^{k}$, which is exactly the geometric tail. Memoryless and
          geometric are the same fact said two ways.

      - part: Where memory comes back
        ask: >
          A different wait: a block trade is equally likely to print in any of
          minutes $1$ to $10$, and certainly prints by minute $10$. Given no
          print in the first $7$ minutes, what is the probability it prints in
          minute $8$?
        expects: "1/3"
        tolerance: 0.0005
        feedback: >
          Only minutes $8$, $9$ and $10$ remain, equally likely, so the answer
          is $1/3$ — up from $1/10$ at the start. This wait remembers: every
          quiet minute brings the end closer.
      - ask: >
          A die is rolled until two sixes come up on consecutive rolls, and
          the last roll was a six. Is the remaining wait distributed as it was
          before the first roll?
        choices:
          - text: >
              Yes: the rolls are independent, so the wait is memoryless.
            feedback: >
              Independent rolls do not make every waiting time memoryless.
              From here, one more six finishes the wait, probability $1/6$;
              before the first roll, finishing in one roll was impossible.
          - text: >
              No: a six in hand puts you one roll from done, so the past
              matters.
            correct: true
            feedback: >
              The target is a pattern, and progress toward a pattern is
              carried forward. Waits for patterns are not geometric, and the
              memoryless shortcut does not apply to them.
          - text: >
              Yes, but only because the die is fair.
            feedback: >
              Fairness has nothing to do with it. Any die with a six in hand
              is closer to two sixes in a row than a die that has not been
              rolled.
        feedback: >
          Memorylessness belongs to the single-trial wait with a fixed $p$.
          Patterns and deadlines both reintroduce memory.
      - ask: >
          A trader says: "We have had $30$ quiet minutes, three times the
          average gap of $10$. The next print must be close." What is the
          expected further wait?
        expects: "10"
        feedback: >
          Still $1/p = 10$ minutes. "It is due" is the gambler's fallacy. The
          interview line: "the trials are independent with a fixed $p$, so the
          wait is memoryless and the expected remaining wait is $1/p$,
          whatever has happened so far."

  - node: quant-probability.discrete.waiting-for-a-six
    hook: >
      This is the canonical geometric example, and interviewers push
      past the mean to the median specifically to check you know the
      distribution is skewed, not symmetric.
    explanation: >
      The number of rolls to the first six is geometric with $p=1/6$,
      so the mean is $\mathbb{E}[X]=1/p=6$ — the same $1/p$ logic gives
      $2$ tosses to the first head of a fair coin and $1/p$ for any
      rare event with success chance $p$.

      But the mean is not the "typical" wait, because the distribution
      is strongly right-skewed: a long tail of unlucky runs pulls the
      mean up above where most of the probability mass sits. The
      median is the smallest $k$ with $(1-p)^{k}<1/2$; taking logs,
      $k>\ln2/(-\ln(1-p))$, and since $-\ln(1-p)\approx p$ for small
      $p$, the median comes out close to $(\ln2)/p\approx0.69/p$ —
      noticeably below the mean $1/p$.

      The general pattern to carry forward: for any geometric wait, the
      median sits at roughly $69\%$ of the mean, not at the mean
      itself, so "the expected wait" and "the wait you'll most likely
      observe" are different numbers whenever $p$ is small.
    worked: >
      For a fair $8$-sided spinner, waiting for a specific face has
      $p=1/8$ and mean $8$. Checking the tail:
      $(7/8)^{5}\approx0.513>1/2$ but $(7/8)^{6}\approx0.449<1/2$, so
      the median is $6$ spins — two full spins short of the mean of
      $8$.
    interview: >
      "If a slot machine hits jackpot with probability $1/N$, what's
      the expected number of pulls" is this pattern, and a common
      follow-up asks for the median or "probability of no jackpot
      within $N$ pulls" specifically to test whether you'll default to
      reporting the mean.
    pitfalls: >
      Reporting the mean when asked for the "typical" or "most likely"
      wait; applying the single-symbol geometric formula to a
      multi-symbol pattern like waiting for two heads in a row, which
      is not geometric.
    recap: >
      A geometric wait's median sits well below its mean — for a fair
      spinner with $8$ faces, mean $8$ but median only $6$ — so the
      mean overstates the typical wait.
    dialogue:
      - part: Two dice, waiting for a double six
        teach: >
          You roll a pair of fair dice, again and again, until both show a six
          on the same roll. Let $X$ be the number of rolls that takes.
      - ask: >
          What is the probability of a double six on any single roll?
        expects: "1/36"
        tolerance: 0.0001
        feedback: >
          $1/6 \times 1/6 = 1/36$, independently on every roll — so $X$ is
          geometric with $p = 1/36$.
      - ask: >
          What is $\mathbb{E}[X]$?
        expects: "36"
        feedback: >
          $1/p = 36$ rolls.
      - ask: >
          A dealer lets you bet at even money, either side, on whether a double
          six appears within the first $36$ rolls. Which side do you take?
        choices:
          - text: >
              Either: $36$ is the average wait, so it is a coin flip.
            feedback: >
              The mean is not the halfway point of this distribution. The
              chance of no double six in $36$ rolls is $(35/36)^{36}$, well
              under a half.
          - text: >
              That it does not appear: rare events take longer than you
              expect.
            feedback: >
              The opposite. No double six in $36$ rolls happens only about $36$
              percent of the time, so that side loses about $64$ percent of the
              time.
          - text: >
              That it does appear within $36$ rolls.
            correct: true
            feedback: >
              You win whenever the wait is at most $36$, and that is about $64$
              percent of the time. The next question pins the number down.
        feedback: >
          The bet turns on $\Pr(X > 36)$, not on $\mathbb{E}[X]$.
      - ask: >
          What is $\Pr(X > 36)$, the chance of no double six in $36$ rolls?
          Give four decimal places.
        expects: "0.3627"
        tolerance: 0.0005
        hint: >
          No double six in $36$ rolls means $36$ independent misses.
        feedback: >
          $(35/36)^{36} \approx 0.3627$. The wait outruns its own mean barely
          more than a third of the time.
      - reflect: >
          Most of the time the wait is at most $36$, yet its average is
          exactly $36$. How can both be true? What does the shape of the
          distribution have to look like?
        answer: >
          The distribution is right-skewed. Its probabilities fall steadily
          from roll $1$ onward, and a thin tail of very long waits — $80$,
          $100$, $150$ rolls — drags the average up. The mean counts those long
          waits at full weight, so it sits to the right of where most of the
          probability is. Ask for the typical wait and you need a different
          summary.

      - part: The typical wait is not the mean
        ask: >
          The median is the smallest $k$ with $\Pr(X \le k) \ge 1/2$, that is,
          $(35/36)^{k} \le 1/2$. What is the median number of rolls?
        expects: "25"
        hint: >
          Take logs: $k \ge \ln 2 / (-\ln(35/36))$, and $-\ln(35/36)$ is close
          to $1/36$.
        feedback: >
          $(35/36)^{24} \approx 0.5086$ is still above a half and
          $(35/36)^{25} \approx 0.4945$ is below it, so the median is $25$ —
          eleven rolls short of the mean.
      - ask: >
          For a rare success, about what fraction of the mean $1/p$ is the
          median?
        choices:
          - text: >
              About $1/2$.
            feedback: >
              A symmetric distribution would put the median at the mean, not
              at half of it. Here $25/36 \approx 0.69$, not $0.5$.
          - text: >
              About $\ln 2 \approx 0.69$.
            correct: true
            feedback: >
              The median solves $(1-p)^{k} = 1/2$, so
              $k \approx \ln 2/(-\ln(1-p)) \approx (\ln 2)/p$, because
              $-\ln(1-p) \approx p$ for small $p$. Here
              $0.69 \times 36 \approx 25$.
          - text: >
              About $0.36$.
            feedback: >
              $0.36$ is close to $\Pr(X > 36)$, the chance of outrunning the
              mean — a probability, not a fraction of the mean.
        feedback: >
          For any rare-event geometric wait, the median sits at roughly
          $69$ percent of the mean.
      - ask: >
          Which single roll number is the most likely one for the first double
          six?
        expects: "1"
        feedback: >
          $\Pr(X = k) = (35/36)^{k-1}(1/36)$ shrinks as $k$ grows, so roll $1$
          is the single likeliest value, with probability $1/36$. Mode $1$,
          median $25$, mean $36$: three different answers to "how long?",
          and the right one depends on what was asked.

      - part: Back to one die
        ask: >
          Now a single die, rolled until the first six. What is the
          probability that the first six comes on an even-numbered roll? Give
          an exact fraction.
        expects: "5/11"
        tolerance: 0.0005
        hint: >
          Add $\Pr(X = 2) + \Pr(X = 4) + \dots$; consecutive terms differ by a
          factor of $(5/6)^{2}$.
        feedback: >
          $\Pr(X = 2) = (5/6)(1/6) = 5/36$, and each later even term is
          $25/36$ times the one before, so the sum is
          $\dfrac{5/36}{1 - 25/36} = \dfrac{5}{11}$. Odd rolls win
          $6/11$ because roll $1$ gets the first shot.
      - ask: >
          Roll a single die until you have seen both a five and a six, in any
          order. What is the expected number of rolls?
        expects: "9"
        hint: >
          Split the wait at the first roll that shows a five or a six.
        feedback: >
          The first of the two arrives at rate $2/6$, a geometric wait of mean
          $3$; then you wait for the other face at rate $1/6$, mean $6$. Total
          $3 + 6 = 9$. The whole wait is not geometric — its rate changes
          halfway — but it is a sum of two geometric waits, and their means
          add.
      - teach: >
          In an interview, "how many rolls to a six?" deserves three sentences:
          geometric with $p = 1/6$, so the mean is $6$; the distribution is
          right-skewed, so the median is lower; and waits for a pattern, or for
          several faces, are not a single geometric — split them into
          geometric pieces.

  - node: quant-probability.discrete.negative-binomial
    hook: >
      "How many trials until the $r$-th success" generalizes the
      geometric, and the fast route to its mean and variance is
      recognizing it as $r$ independent geometric waits stacked, not
      integrating a new pmf from scratch.
    explanation: >
      Let $X$ be the trial on which the $r$-th success occurs. For
      $X=k$, trial $k$ itself must be the $r$-th success, and the other
      $r-1$ successes are scattered among the first $k-1$ trials:
      choose which of those $k-1$ trials succeed, $\binom{k-1}{r-1}$
      ways, then pay $p$ per success and $1-p$ per failure across all
      $k$ trials, giving $\Pr(X=k)=\binom{k-1}{r-1}p^{r}(1-p)^{k-r}$ for
      $k\ge r$.

      The moments are faster from a different decomposition than the
      pmf: $X$ is the sum of $r$ waits, the trials to the first
      success, then — because the trials after any success are still
      an independent, identically distributed Bernoulli$(p)$ stream —
      the further trials to the second success, and so on. Each of the
      $r$ waits is geometric with mean $1/p$ and variance
      $(1-p)/p^{2}$, and linearity plus independence across the waits
      give $\mathbb{E}[X]=r/p$ and $\operatorname{Var}(X)=r(1-p)/p^{2}$
      directly; $r=1$ recovers the geometric exactly.

      The convention trap mirrors the geometric's own: the "failures
      before the $r$-th success" version $Y=X-r$ has support
      $\{0,1,2,\dots\}$ and mean $r(1-p)/p$. Say which convention you
      mean before quoting a number.
    worked: >
      A call center flags an audit on the $4$th complaint call, and
      each call is independently a complaint with probability
      $p=0.05$. The expected number of calls to the $4$th complaint is
      $4/0.05=80$, with $\operatorname{Var}(X)=4\times0.95/0.0025=
      1520$, so $\sqrt{1520}\approx39$.
    interview: >
      "Expected number of trials to get $r$ successes" is the tell; a
      strong answer states $r/p$ immediately by citing "sum of $r$
      independent geometric waits" rather than summing the pmf.
    pitfalls: >
      Trying to derive the mean by summing
      $k\binom{k-1}{r-1}p^{r}(1-p)^{k-r}$ under time pressure instead of
      using the sum-of-geometrics decomposition; mixing up the
      trials-counted and failures-counted conventions when quoting a
      mean.
    recap: >
      The negative binomial is $r$ stacked independent geometric
      waits — pmf $\binom{k-1}{r-1}p^{r}(1-p)^{k-r}$, mean $r/p$,
      variance $r(1-p)/p^{2}$.
    dialogue:
      - part: Three wins to close the day
        teach: >
          A trader stops for the day as soon as she has three winning trades.
          Each trade wins with probability $1/2$, independently. Let $X$ be the
          trade on which the third win arrives.
      - ask: >
          What is $\Pr(X = 3)$?
        expects: "0.125"
        feedback: >
          The first three trades must all win: $(1/2)^{3} = 1/8 = 0.125$.
      - ask: >
          What is $\Pr(X = 5)$? Give a decimal.
        expects: "0.1875"
        hint: >
          What must trade $5$ itself be? And how many wins must come before
          it?
        feedback: >
          Trade $5$ must be the third win, and exactly two of trades $1$ to
          $4$ must win: $\binom{4}{2} = 6$ patterns, each of probability
          $(1/2)^{5} = 1/32$, so $6/32 = 0.1875$.
      - ask: >
          A candidate answers $\binom{5}{3}(1/2)^{5} = 10/32$. Which patterns
          did they count that should not be there?
        choices:
          - text: >
              Patterns with four or five wins.
            feedback: >
              $\binom{5}{3}$ counts exactly three wins among five trades, so
              there are none of those. The extra patterns have exactly three
              wins — in the wrong places.
          - text: >
              Patterns whose last trade is a loss, such as $WWWLL$ — the day
              ended before trade $5$.
            correct: true
            feedback: >
              $\binom{5}{3} = 10$ includes the $\binom{4}{3} = 4$ patterns
              ending in a loss, where the third win came at trade $3$ or $4$.
              Removing them leaves $6$.
          - text: >
              None: $10/32$ is right, and the $6/32$ undercounts.
            feedback: >
              $10/32$ is $\Pr(\text{exactly } 3 \text{ wins in } 5 \text{ trades})$. If the
              third win arrives at trade $3$, the trader never makes trade
              $5$ at all.
        feedback: >
          A waiting time pins down where the last success sits. Counting
          successes in a fixed block does not.
      - reflect: >
          Generalise: the $r$-th success lands exactly on trial $k$, each trial
          succeeding with probability $p$. What are the two pieces of that
          event, and what is its probability?
        answer: >
          Trial $k$ must be a success, probability $p$, and the first $k-1$
          trials must hold exactly $r-1$ successes, in any of
          $\binom{k-1}{r-1}$ arrangements. Every arrangement has probability
          $p^{r-1}(1-p)^{k-r}$, so the event has probability
          $\binom{k-1}{r-1}p^{r}(1-p)^{k-r}$ for $k \ge r$.

      - part: Three waits in a row
        ask: >
          What is $\mathbb{E}[X]$, the expected number of trades to the third
          win?
        expects: "6"
        hint: >
          Split the day at each win: the wait to the first, then to the second,
          then to the third.
        feedback: >
          After any win the remaining trades are a fresh independent stream,
          so each of the three waits is geometric with mean $1/p = 2$. By
          linearity $\mathbb{E}[X] = 3 \times 2 = 6$ — no sum over the pmf.
      - ask: >
          What is $\operatorname{Var}(X)$?
        expects: "6"
        hint: >
          The three waits are independent, each with variance $(1-p)/p^{2}$.
        feedback: >
          Each wait has variance $0.5/0.25 = 2$, and independent variances
          add: $3 \times 2 = 6$.
      - teach: >
          The trial of the $r$-th success is negative binomial with
          parameters $r$ and $p$:
          $\Pr(X = k) = \binom{k-1}{r-1}p^{r}(1-p)^{k-r}$ for $k \ge r$. As a
          sum of $r$ independent geometric waits it has
          $\mathbb{E}[X] = r/p$ and $\operatorname{Var}(X) = r(1-p)/p^{2}$; with
          $r = 1$ it is the geometric.
      - ask: >
          Another strategy wins with probability $0.3$ and stops at its second
          win. What is the probability that the second win is trade $4$? Give
          four decimal places.
        expects: "0.1323"
        tolerance: 0.0005
        feedback: >
          $\binom{3}{1}(0.3)^{2}(0.7)^{2} = 3 \times 0.09 \times 0.49 =
          0.1323$: one win among the first three trades, a loss in each of the
          other two, and a win on trade $4$.

      - part: Conventions and look-alikes
        ask: >
          For the first trader ($r = 3$, $p = 1/2$), a colleague reports "an
          expected $3$". What are they counting?
        choices:
          - text: >
              Trades to the third win, using a different formula.
            feedback: >
              Trades to the third win has mean $r/p = 6$. No correct formula
              gives $3$ for that.
          - text: >
              Losing trades before the third win, $Y = X - 3$.
            correct: true
            feedback: >
              $\mathbb{E}[Y] = \mathbb{E}[X] - 3 = r(1-p)/p = 3$. This
              version lives on $\{0, 1, 2, \dots\}$, and both are called
              negative binomial.
          - text: >
              Wins among the first $6$ trades.
            feedback: >
              That count is binomial and also has mean $3$, but it is a
              different variable: the number of trials is fixed and the wins
              are counted.
        feedback: >
          Trials to the $r$-th success has mean $r/p$; failures before it has
          mean $r(1-p)/p$. Name the convention before quoting either.
      - ask: >
          Which of these is negative binomial?
        choices:
          - text: >
              The number of heads in $20$ tosses of a fair coin.
            feedback: >
              The number of tosses is fixed and the heads are counted:
              binomial.
          - text: >
              The number of cards dealt from a deck until the second ace.
            feedback: >
              Dealing depletes the deck, so the chance of an ace changes with
              every card. The trials are not independent with a fixed $p$.
          - text: >
              The number of tosses of a fair coin until the fourth head.
            correct: true
            feedback: >
              Independent tosses, fixed $p = 1/2$, waiting for the $r$-th
              success with $r = 4$: mean $4/(1/2) = 8$ tosses.
          - text: >
              The number of tosses until two heads come up in a row.
            feedback: >
              Two heads are needed, but they must be consecutive. That is a
              pattern, and a wait for a pattern is not a sum of independent
              geometric waits.
        feedback: >
          The clauses: independent trials, one $p$, and $X$ the index of the
          $r$-th success with $r$ fixed in advance. Interview signature: the
          number of successes is fixed and the number of trials is random.

  - node: quant-probability.discrete.poisson
    hook: >
      Every "how many events in this window" question — trades per
      second, defaults per year, typos per page — reaches for this
      law, and the tell is that there is no natural number of trials to
      count out of.
    explanation: >
      $X\sim\operatorname{Poisson}(\lambda)$, $\lambda>0$, has pmf
      $\Pr(X=k)=e^{-\lambda}\lambda^{k}/k!$ for $k=0,1,2,\dots$. This
      normalizes because $\sum_{k\ge0}\lambda^{k}/k!=e^{\lambda}$, the
      exponential's own series, so multiplying by $e^{-\lambda}$ makes
      the total probability $1$ — the same kind of check as the
      binomial's $(p+(1-p))^{n}=1$.

      The signature identity $\mathbb{E}[X]=\operatorname{Var}(X)=
      \lambda$ collapses both moments onto the single parameter. The
      quickest route uses the factorial moment:
      $\mathbb{E}[X(X-1)]=\sum_{k\ge2}k(k-1)e^{-\lambda}\lambda^{k}/k!=
      \lambda^{2}\sum_{k\ge2}e^{-\lambda}\lambda^{k-2}/(k-2)!=
      \lambda^{2}$, since the remaining sum is a full Poisson pmf and
      totals $1$. Then $\operatorname{Var}(X)=\mathbb{E}[X^{2}]-
      \mathbb{E}[X]^{2}=\mathbb{E}[X(X-1)]+\mathbb{E}[X]-
      \mathbb{E}[X]^{2}=\lambda^{2}+\lambda-\lambda^{2}=\lambda$.

      The mode is $\lfloor\lambda\rfloor$, tied with $\lambda-1$ when
      $\lambda$ is an integer. A useful diagnostic once you have real
      data: fit a Poisson and compare sample variance to sample mean —
      variance far above the mean means the data is overdispersed and
      something is breaking the independent-rare-events assumption.
    worked: >
      A market maker sees an average of $\lambda=4$ aggressive orders
      per minute. The probability of exactly $2$ orders in a minute is
      $e^{-4}4^{2}/2!=e^{-4}\times8\approx0.1465$.
    interview: >
      "Trades arrive at rate $\lambda$ per second, what's the
      probability of exactly $k$ trades in a second" is the direct ask;
      the phrase "on average" with no natural trial count to fix an $n$
      against is the fast tell that Poisson, not binomial, is the right
      model.
    pitfalls: >
      Reaching for Poisson when there is a natural, moderate $n$ and
      constant $p$ — that is binomial, and Poisson is its rare-event
      limit; trusting a Poisson fit without checking sample variance
      against sample mean.
    recap: >
      Poisson counts rare independent events in a window with
      $\mathbb{E}[X]=\operatorname{Var}(X)=\lambda$ and mode
      $\lfloor\lambda\rfloor$ — reach for it when there is no natural
      $n$ to count out of.
    dialogue:
      - part: A model for trade breaks
        teach: >
          An operations team models the number of trade breaks in a day as
          $X$, with $\Pr(X = k) = e^{-3}\,3^{k}/k!$ for $k = 0, 1, 2, \dots$
          and no upper limit. Take $e^{-3} \approx 0.0498$.
      - ask: >
          What is $\Pr(X = 2)$? Give four decimal places.
        expects: "0.2240"
        tolerance: 0.0005
        feedback: >
          $e^{-3} \times 3^{2}/2! = 0.0498 \times 4.5 \approx 0.2240$.
      - ask: >
          Why do these probabilities, over every $k = 0, 1, 2, \dots$, add up
          to exactly $1$?
        choices:
          - text: >
              They do not; the model is only approximate, and the tail is cut
              off.
            feedback: >
              Nothing is cut off: $k$ runs over every non-negative integer,
              and the total is exactly $1$.
          - text: >
              Because $\sum_{k \ge 0} 3^{k}/k! = e^{3}$, which the factor
              $e^{-3}$ cancels.
            correct: true
            feedback: >
              That is the exponential's own series. The constant $e^{-3}$ is
              there precisely to make the total $1$.
          - text: >
              Because it is a binomial, and binomial probabilities sum to $1$.
            feedback: >
              A binomial has a fixed number of trials and a largest possible
              count. This law has neither — every $k$ gets positive
              probability.
        feedback: >
          The normalising check here is $e^{\lambda}$'s series, just as the
          binomial's is $(p + (1-p))^{n}$.
      - ask: >
          What is $\mathbb{E}[X]$?
        expects: "3"
        hint: >
          In $\sum_{k} k \, e^{-3}3^{k}/k!$, use $k/k! = 1/(k-1)!$ and pull one
          factor of $3$ out of the sum.
        feedback: >
          $\sum_{k \ge 1} e^{-3}3^{k}/(k-1)! = 3\sum_{j \ge 0} e^{-3}3^{j}/j!
          = 3 \times 1 = 3$. The leftover sum is the whole pmf again.
      - reflect: >
          Run the same trick on $\mathbb{E}[X(X-1)]$. What does it give, and
          how does it lead to $\operatorname{Var}(X)$? Anything surprising
          about the answer?
        answer: >
          $k(k-1)/k! = 1/(k-2)!$, so pulling out $3^{2}$ leaves the full pmf
          and $\mathbb{E}[X(X-1)] = 9$. Then
          $\mathbb{E}[X^{2}] = \mathbb{E}[X(X-1)] + \mathbb{E}[X] = 12$ and
          $\operatorname{Var}(X) = 12 - 3^{2} = 3$. The variance equals the
          mean: one number controls both.

      - part: One parameter, mean and variance both
        teach: >
          $X$ is Poisson with rate $\lambda > 0$ when
          $\Pr(X = k) = e^{-\lambda}\lambda^{k}/k!$ for $k = 0, 1, 2, \dots$.
          It normalises because $\sum_{k}\lambda^{k}/k! = e^{\lambda}$, and its
          signature is $\mathbb{E}[X] = \operatorname{Var}(X) = \lambda$. It
          models counts in a fixed window — breaks in a day, trades in a
          second — when events occur independently at a constant rate and
          there is no natural number of trials.
      - ask: >
          For $\lambda = 3$, which count of breaks is the most likely?
        choices:
          - text: >
              $3$ alone, the mean.
            feedback: >
              $3$ is a mode, but not alone. Compare neighbours:
              $\Pr(X = k)/\Pr(X = k-1) = \lambda/k$, which is exactly $1$ at
              $k = 3$.
          - text: >
              $0$, because the pmf has $k!$ in the denominator.
            feedback: >
              $k!$ wins eventually, but $3^{k}$ wins first: the ratio
              $\lambda/k$ is above $1$ for $k = 1, 2$, so the bars climb before
              they fall.
          - text: >
              $2$ and $3$, tied.
            correct: true
            feedback: >
              The ratio $\Pr(X = 3)/\Pr(X = 2) = 3/3 = 1$, so both equal
              $0.2240$. In general the mode is $\lfloor \lambda \rfloor$, tied
              with $\lambda - 1$ when $\lambda$ is a whole number.
        feedback: >
          The neighbour ratio $\lambda/k$ climbs above $1$ while $k < \lambda$
          and falls below it after.
      - ask: >
          What is the probability of at least two breaks in a day? Give four
          decimal places.
        expects: "0.8009"
        tolerance: 0.0005
        hint: >
          Subtract the two smallest counts from $1$.
        feedback: >
          $1 - e^{-3}(1 + 3) = 1 - 4 \times 0.049787 \approx 0.8009$. For
          "at least", go through the complement: the Poisson's tail is
          infinite.

      - part: Which counts are Poisson
        ask: >
          Three daily counts have each been recorded for a year. Which is a
          plausible Poisson?
        choices:
          - text: >
              Sample mean $3.0$, sample variance $9.5$.
            feedback: >
              A Poisson with mean $3$ has variance $3$. Variance three times
              the mean is overdispersion: something — clustering, a rate that
              changes from day to day — breaks the independent constant-rate
              story.
          - text: >
              Sample mean $3.0$, sample variance $3.1$.
            correct: true
            feedback: >
              Mean and variance agree, as $\operatorname{Poisson}(3)$ demands.
              Not proof, but the data pass the first check.
          - text: >
              Heads in $6$ tosses of a fair coin: mean $3$, variance $1.5$.
            feedback: >
              A fixed $n = 6$ caps the count at $6$, and the variance falls
              short of the mean. That is the binomial; the Poisson is for
              counts with no natural $n$.
        feedback: >
          Variance against mean is the fastest diagnostic: far above means
          overdispersed, below with a hard cap means binomial.
      - ask: >
          Now breaks come in clumps: each day, with probability $0.6$ a system
          glitch produces exactly $5$ breaks, and otherwise there are none.
          The mean is still $3$. What is the variance?
        expects: "6"
        hint: >
          The count is $5$ times a Bernoulli$(0.6)$.
        feedback: >
          $25 \times 0.6 \times 0.4 = 6$, twice the mean. The breaks are not
          independent of one another — they arrive five at a time — and that
          single failed clause is enough to rule out a Poisson, whatever the
          mean.

  - node: quant-probability.discrete.poisson-limit
    hook: >
      This is the theorem explaining why Poisson shows up at all — it
      is what a binomial degenerates into once trials become numerous
      and individually almost impossible to succeed at.
    explanation: >
      Take $X_{n}\sim\operatorname{Bin}(n,p_{n})$ with $np_{n}\to
      \lambda$ as $n\to\infty$: many trials, tiny per-trial probability,
      fixed product. The claim is that for every fixed $k$,
      $\Pr(X_{n}=k)\to e^{-\lambda}\lambda^{k}/k!$.

      The load-bearing step splits $\binom{n}{k}p^{k}(1-p)^{n-k}$ into
      three factors: $\dfrac{n(n-1)\cdots(n-k+1)}{n^{k}}\cdot
      \dfrac{(np)^{k}}{k!}\cdot(1-p)^{n-k}$. With $k$ fixed and $n$
      growing, the first factor is a product of $k$ terms each tending
      to $1$; the middle factor tends to $\lambda^{k}/k!$ since
      $np\to\lambda$; the last factor is $(1-\lambda/n)^{n}$ in the
      limit, which tends to $e^{-\lambda}$. Multiplying the three
      limits gives the Poisson pmf exactly.

      This is not only an asymptotic curiosity: for $n\ge20$ and
      $p\le0.05$ the approximation is already accurate, with error
      controlled by $np^{2}$. That is why it is the practical shortcut
      for rare defects, rare claims, or rare clicks — anywhere the
      exact binomial pmf would need factorials too large to compute by
      hand.
    worked: >
      With $n=500$ and $p=0.01$, so $\lambda=5$: the exact
      $\Pr(X=0)=(0.99)^{500}\approx0.00657$, against the Poisson
      approximation $e^{-5}\approx0.00674$ — close agreement.
    interview: >
      "$n$ is large and $p$ is small — approximate the binomial" is the
      direct cue; a sharp answer states the three-factor limit in one
      breath and names the rule of thumb ($n\ge20$, $p\le0.05$) for
      when the approximation is trustworthy.
    pitfalls: >
      Applying the Poisson approximation when $p$ is not small — the
      binomial's middle regime, $p$ near $0.5$, is badly approximated;
      forgetting to check that $np$ converges to a fixed, moderate
      $\lambda$ rather than blowing up or vanishing.
    recap: >
      Many trials with vanishing per-trial probability and fixed
      product $np\to\lambda$ turn the binomial pmf into the Poisson pmf
      term by term.
    dialogue:
      - part: Three thousand orders, a few rejects
        teach: >
          A trading system sends $3000$ orders a day. Each is rejected by the
          exchange with probability $0.0005$, independently of the others, so
          the number of rejects is $\operatorname{Bin}(3000, 0.0005)$.
      - ask: >
          What is the expected number of rejects in a day?
        expects: "1.5"
        feedback: >
          $np = 3000 \times 0.0005 = 1.5$.
      - ask: >
          What is the probability of a day with no rejects at all? Give four
          decimal places.
        expects: "0.2231"
        tolerance: 0.0005
        hint: >
          It is $0.9995^{3000} = (1 - 1.5/3000)^{3000}$. What does
          $(1 - \lambda/n)^{n}$ approach for large $n$?
        feedback: >
          Exactly, $0.9995^{3000} \approx 0.22305$; and
          $(1 - 1.5/n)^{n} \to e^{-1.5} \approx 0.22313$. The two agree to
          four places, and the second needed no calculator power of
          $3000$.
      - ask: >
          Now double the orders to $6000$ and halve the reject probability to
          $0.00025$. What happens to the distribution of the reject count?
        choices:
          - text: >
              It spreads out: twice as many orders means twice as many chances
              for a bad day.
            feedback: >
              The variance is $np(1-p)$, which moves from $1.49925$ to
              $1.49963$ — essentially nothing. More orders, each rarer, cancel
              out.
          - text: >
              It concentrates near $1.5$, because more trials always
              concentrate a count.
            feedback: >
              More trials concentrate a proportion when $p$ is held fixed.
              Here $p$ shrinks as $n$ grows, and the count stays just as
              random.
          - text: >
              It barely changes: every probability moves in the fourth decimal
              place at most.
            correct: true
            feedback: >
              $\Pr(0)$ goes from $0.22305$ to $0.22309$, $\Pr(1)$ from
              $0.33474$ to $0.33472$. With $np$ held at $1.5$, the law hardly
              notices how $n$ and $p$ were split.
        feedback: >
          For many rare trials, the product $np$ seems to be the only thing
          that matters. The next question asks why.
      - reflect: >
          Write $\binom{n}{k}p^{k}(1-p)^{n-k}$ as
          $\dfrac{n(n-1)\cdots(n-k+1)}{n^{k}} \cdot \dfrac{(np)^{k}}{k!} \cdot
          (1-p)^{n-k}$. Hold $k$ fixed and $np = \lambda$ fixed, and let $n$
          grow. Where does each of the three factors go?
        answer: >
          The first is a product of $k$ terms like $(n-1)/n$, each tending to
          $1$, so it tends to $1$. The middle is $\lambda^{k}/k!$ exactly. The
          last is $(1 - \lambda/n)^{n}$ divided by $(1 - \lambda/n)^{k}$; the
          first part tends to $e^{-\lambda}$ and the second to $1$. Multiplied
          together: $e^{-\lambda}\lambda^{k}/k!$, the Poisson pmf.

      - part: The law of rare events
        teach: >
          If $X_{n} \sim \operatorname{Bin}(n, p_{n})$ with
          $np_{n} \to \lambda \in (0, \infty)$, then for every fixed $k$,
          $\Pr(X_{n} = k) \to e^{-\lambda}\lambda^{k}/k!$. The error is
          controlled by $np^{2}$, so in practice the approximation is good for
          $n \ge 20$ and $p \le 0.05$ — and it replaces factorials of $3000$
          with a pmf you can evaluate by hand.
      - ask: >
          Using the Poisson approximation, what is the probability of exactly
          one reject in a day? Give four decimal places.
        expects: "0.3347"
        tolerance: 0.0005
        feedback: >
          $e^{-1.5} \times 1.5 \approx 0.22313 \times 1.5 \approx 0.3347$.
          The exact binomial gives $0.33474$.
      - ask: >
          Using the approximation, what is the probability of at least two
          rejects? Give four decimal places.
        expects: "0.4422"
        tolerance: 0.0005
        feedback: >
          $1 - e^{-1.5}(1 + 1.5) = 1 - 2.5 \times 0.22313 \approx 0.4422$.
          The exact value is $0.44222$.
      - ask: >
          How close to its limit is the first factor already? For $k = 2$ and
          $n = 3000$, compute $n(n-1)/n^{2}$ to four decimal places.
        expects: "0.9997"
        tolerance: 0.0001
        feedback: >
          $2999/3000 \approx 0.9997$. For small $k$ and large $n$ this factor
          is $1$ for every practical purpose, which is why only $np$ survives.

      - part: Where the approximation fails
        ask: >
          Which binomial is badly approximated by $\operatorname{Poisson}(np)$?
        choices:
          - text: >
              $\operatorname{Bin}(10000, 0.0002)$
            feedback: >
              Large $n$, tiny $p$, $\lambda = 2$, and $np^{2} = 0.0004$: this
              is the theorem's home ground.
          - text: >
              $\operatorname{Bin}(40, 0.5)$
            correct: true
            feedback: >
              $p$ is not small. The binomial has variance
              $40 \times 0.25 = 10$, while $\operatorname{Poisson}(20)$ has
              variance $20$ — the approximation doubles the spread.
          - text: >
              $\operatorname{Bin}(200, 0.01)$
            feedback: >
              $n \ge 20$ and $p \le 0.05$, with $np^{2} = 0.02$. The binomial
              variance $1.98$ is within one percent of the Poisson's $2$.
        feedback: >
          The Poisson's variance is $np$; the binomial's is $np(1-p)$. They
          agree only when $1 - p \approx 1$, which is what "rare" means.
      - ask: >
          To see the failure in one number: $\operatorname{Bin}(4, 0.5)$ has
          $\Pr(X = 0) = 1/16 = 0.0625$. What does the Poisson approximation
          with $\lambda = np$ give? Give four decimal places.
        expects: "0.1353"
        tolerance: 0.0005
        feedback: >
          $\lambda = 2$ and $e^{-2} \approx 0.1353$, more than double the true
          $0.0625$. With $n = 4$ and $p = 1/2$, neither "many trials" nor
          "rare" holds.
      - teach: >
          In an interview, say it in one line: "many independent trials, each
          rare, with $np = \lambda$ moderate, so the count is approximately
          $\operatorname{Poisson}(\lambda)$" — then check $p$ is small before
          trusting it.

  - node: quant-probability.discrete.poisson-additivity
    hook: >
      Merging two independent event streams — order flow from two
      venues, defaults from two loan books — is asked as "what's the
      combined rate," and it's a one-line addition only because Poisson
      rates simply stack.
    explanation: >
      If $X\sim\operatorname{Poisson}(\lambda)$ and
      $Y\sim\operatorname{Poisson}(\mu)$ are independent, then
      $X+Y\sim\operatorname{Poisson}(\lambda+\mu)$; by induction, any
      number of independent Poisson counts add their rates into one
      Poisson count. Convolving the two pmfs and recognizing
      $\sum_{k}\binom{n}{k}\lambda^{k}\mu^{n-k}=(\lambda+\mu)^{n}$ from
      the binomial theorem reproduces the Poisson$(\lambda+\mu)$ pmf
      term by term.

      The converse split matters just as much in practice: conditional
      on $X+Y=n$, the first component's count is
      $\operatorname{Bin}(n,\lambda/(\lambda+\mu))$. Once the total
      number of events is known, how they split between the two
      sources carries no extra information beyond the rate ratio — each
      event is independently "from stream $1$" with probability
      $\lambda/(\lambda+\mu)$.

      The mental model: merging two independent Poisson streams is like
      interleaving two clocks that each ring at their own rate. The
      merged clock rings at the summed rate, and any single ring, once
      you condition on the total count, is proportionally as likely to
      have come from either clock.
    worked: >
      Desk A sends orders at rate $2$ per second, desk B at rate $6$
      per second, independent. The merged stream is Poisson with rate
      $8$ per second, and any given observed order came from desk A
      with probability $2/8=0.25$.
    interview: >
      "Two independent event streams with known rates — what's the
      distribution of the combined count" is the direct question, and
      "given the total, what fraction came from stream $1$" is the
      natural follow-up testing the split result.
    pitfalls: >
      Assuming the split between sources is itself Poisson — it is
      binomial, conditional on the total; forgetting independence
      between $X$ and $Y$, since correlated streams do not add their
      rates this cleanly.
    recap: >
      Independent Poisson counts add their rates, and once the total is
      known, the split between sources is binomial in the rate
      proportions.
    dialogue:
      - part: Two venues, one tape
        teach: >
          Your fills at venue A in a minute are a Poisson count with mean
          $1.2$; your fills at venue B, independently, a Poisson count with
          mean $1.8$. The blotter shows only the total.
      - ask: >
          What is the probability of no fills at all in a minute? Give four
          decimal places.
        expects: "0.0498"
        tolerance: 0.0005
        feedback: >
          Both venues must be silent:
          $e^{-1.2} \times e^{-1.8} = e^{-3} \approx 0.0498$.
      - ask: >
          What is the probability of exactly one fill in total? Give four
          decimal places.
        expects: "0.1494"
        tolerance: 0.0005
        hint: >
          The one fill came from A with B silent, or from B with A silent.
        feedback: >
          $1.2e^{-1.2} \cdot e^{-1.8} + e^{-1.2} \cdot 1.8e^{-1.8} =
          (1.2 + 1.8)e^{-3} = 3e^{-3} \approx 0.1494$.
      - ask: >
          Given that there was exactly one fill, what is the probability it
          came from venue A?
        expects: "0.4"
        feedback: >
          $\dfrac{1.2e^{-3}}{3e^{-3}} = 0.4$. Every exponential cancels and
          only the share of the rate is left: $1.2/(1.2 + 1.8)$.
      - reflect: >
          Both of your first answers, $e^{-3}$ and $3e^{-3}$, are
          $\operatorname{Poisson}(3)$ probabilities. Is that luck? Write the
          probability of $n$ fills in total as a sum over how many came from
          A, and say what it collapses to.
        answer: >
          $\sum_{k=0}^{n} \dfrac{e^{-1.2}1.2^{k}}{k!} \cdot
          \dfrac{e^{-1.8}1.8^{n-k}}{(n-k)!} = \dfrac{e^{-3}}{n!}\sum_{k}
          \binom{n}{k}1.2^{k}1.8^{n-k} = \dfrac{e^{-3}3^{n}}{n!}$, by the
          binomial theorem. Not luck: the total is exactly
          $\operatorname{Poisson}(3)$. And each term of that sum, divided by
          the total, is a binomial probability — which is why the split came
          out as a pure rate share.

      - part: Rates add, totals split
        teach: >
          If $X \sim \operatorname{Poisson}(\lambda)$ and
          $Y \sim \operatorname{Poisson}(\mu)$ are independent, then
          $X + Y \sim \operatorname{Poisson}(\lambda + \mu)$; by induction any
          number of independent Poisson counts merge by adding rates. In the
          other direction, given $X + Y = n$, the count $X$ is
          $\operatorname{Bin}(n, \lambda/(\lambda + \mu))$: each of the $n$
          events came from the first source with probability
          $\lambda/(\lambda + \mu)$, independently.
      - ask: >
          What is the probability of exactly two fills in total in a minute?
          Give four decimal places.
        expects: "0.2240"
        tolerance: 0.0005
        feedback: >
          $\operatorname{Poisson}(3)$ at $2$: $e^{-3} \times 3^{2}/2! \approx
          0.0498 \times 4.5 \approx 0.2240$. Without the merge you would sum
          three cases.
      - ask: >
          A minute shows $4$ fills in total. What is the probability that all
          four came from venue B? Give four decimal places.
        expects: "0.1296"
        tolerance: 0.0005
        feedback: >
          Each fill is from B with probability $1.8/3 = 0.6$, independently,
          so $0.6^{4} = 0.1296$.
      - ask: >
          Given $4$ fills in total, what is the law of venue A's count?
        choices:
          - text: >
              $\operatorname{Poisson}(1.2)$, as before: conditioning on the
              total does not change A.
            feedback: >
              It changes it a lot: given the total is $4$, A cannot be $5$,
              and $\operatorname{Poisson}(1.2)$ gives $5$ positive
              probability. Knowing the total ties A to B.
          - text: >
              $\operatorname{Poisson}(1.6)$, with mean $4 \times 0.4$.
            feedback: >
              The mean $1.6$ is right, but the law is capped at $4$, and a
              Poisson never is.
          - text: >
              $\operatorname{Bin}(4, 0.4)$.
            correct: true
            feedback: >
              Four events, each from A with probability $0.4$, independently:
              a binomial count, with mean $1.6$.
        feedback: >
          Merging gives a Poisson; splitting a known total gives a binomial.
          The total tells you nothing about the split beyond the rate ratio.

      - part: What stays Poisson
        ask: >
          With $A$ and $B$ the two venues' counts, which of these is a Poisson
          count?
        choices:
          - text: >
              $2A$, the venue-A count reported in half-lots.
            feedback: >
              $2A$ has mean $2.4$ but variance $4 \times 1.2 = 4.8$, and it
              takes only even values. A Poisson's variance equals its mean;
              scaling breaks that.
          - text: >
              $A - B$, the net imbalance between venues.
            feedback: >
              It can be negative, and a count cannot. Its variance is
              $1.2 + 1.8 = 3$ while its mean is $-0.6$.
          - text: >
              $A + B$, conditional on $A + B \ge 1$.
            feedback: >
              Conditioning removes the value $0$, so this is no longer
              Poisson — it is a Poisson with its zero cut off and the rest
              rescaled.
          - text: >
              $A + B$.
            correct: true
            feedback: >
              Independent Poisson counts, added: $\operatorname{Poisson}(3)$.
              Adding is the one operation the rates survive.
        feedback: >
          The merge rule needs two things: the counts are independent, and
          they are added as counts. In an interview: "independent Poisson
          streams merge by adding rates, and given the total each event's
          source is a coin flip weighted by the rates."

  - node: quant-probability.discrete.hypergeometric
    hook: >
      "Draws from a deck without replacement" is the interviewer's
      signal that the binomial's independence hypothesis has just been
      pulled out from under you, and this is the law that replaces it.
    explanation: >
      An urn holds $N$ items, $K$ of them successes; draw $n$ without
      replacement and let $X$ count the successes drawn. Each draw
      removes an item and changes the composition of what remains, so
      the draws are dependent and the binomial's "multiply per-trial
      probabilities" trick does not apply. Count outcomes instead:
      choose $k$ of the $K$ successes ($\binom{K}{k}$ ways) and the
      remaining $n-k$ draws from the $N-K$ failures ($\binom{N-K}{n-k}$
      ways), over all $\binom{N}{n}$ equally likely $n$-subsets of the
      urn: $\Pr(X=k)=\binom{K}{k}\binom{N-K}{n-k}/\binom{N}{n}$.

      A symmetry worth noticing: the pmf is unchanged if you swap the
      roles of $n$ and $K$. "Choose which $n$ of the $N$ items to draw"
      and "choose which $K$ of the $N$ items are successes" are dual
      descriptions of the same random $n$-subset, so the formula looks
      identical either way you frame the sampling.

      Catch the interview signature phrases immediately: "five cards
      from a deck," "inspect $10$ items from a batch of $200$,"
      "capture-recapture" (tag some fish, recapture a sample, count
      tagged) — all are draws without replacement from a finite,
      fixed-composition pool.
    worked: >
      An urn has $N=20$ balls, $K=6$ red; draw $n=4$ without
      replacement. $\Pr(\text{exactly }2\text{ red})=\binom{6}{2}
      \binom{14}{2}/\binom{20}{4}=15\times91/4845\approx0.282$.
    interview: >
      "What's the probability of $k$ successes drawn without
      replacement from a finite population" is answered with the
      three-binomial-coefficient formula directly; a strong candidate
      flags "without replacement" as the reason the binomial does not
      apply before writing anything.
    pitfalls: >
      Applying the binomial pmf to a without-replacement draw, ignoring
      that per-draw probability shifts as the urn depletes; swapping
      the successes-among-drawn and failures-among-not-drawn
      coefficients.
    recap: >
      Hypergeometric counts successes in a sample drawn without
      replacement from a finite pool,
      $\Pr(X=k)=\binom{K}{k}\binom{N-K}{n-k}/\binom{N}{n}$ — the
      binomial's dependent cousin.
    dialogue:
      - part: Four positions from a book of ten
        teach: >
          A book holds $10$ positions, and $3$ of them are mismarked. An
          auditor picks $4$ different positions at random to review.
      - ask: >
          What is the probability that the first position picked is
          mismarked?
        expects: "0.3"
        feedback: >
          $3$ mismarked out of $10$, all equally likely: $3/10$.
      - ask: >
          Given that the first one was mismarked, what is the probability that
          the second one is?
        expects: "2/9"
        tolerance: 0.0005
        feedback: >
          Nine positions remain and two of them are mismarked: $2/9 \approx
          0.222$, down from $0.3$. Each pick changes what is left.
      - ask: >
          A colleague prices "exactly one of the four is mismarked" as
          $\operatorname{Bin}(4, 0.3)$: $4 \times 0.3 \times 0.7^{3} = 0.4116$.
          What is wrong with that?
        choices:
          - text: >
              The coefficient: it should be $\binom{4}{2}$, not $\binom{4}{1}$.
            feedback: >
              $\binom{4}{1} = 4$ is the right count of positions for the one
              mismarked pick. The coefficient is not the trouble; the
              per-pick probability is.
          - text: >
              The picks are not independent: the chance of a mismarked pick
              moves from $3/10$ to $2/9$ or $3/9$ depending on what came
              before.
            correct: true
            feedback: >
              The binomial multiplies one fixed $p$ per trial, and here no
              fixed $p$ exists after the first pick. The model is wrong, not
              the arithmetic.
          - text: >
              Nothing; with only four picks the dependence is negligible.
            feedback: >
              Four picks from ten is forty percent of the book. The true
              answer, which you are about to count, differs from $0.4116$ by
              almost $0.09$.
        feedback: >
          Drawing without replacement makes every pick depend on the earlier
          ones. Sequential probabilities still work, but there is a cleaner
          way to count.
      - reflect: >
          Every set of $4$ positions out of the $10$ is equally likely to be
          the one reviewed. How would you count the sets that contain exactly
          one mismarked position, and what probability does that give?
        answer: >
          Choose which mismarked position is in the set, $\binom{3}{1} = 3$
          ways, and which three clean positions join it,
          $\binom{7}{3} = 35$ ways: $105$ sets. There are
          $\binom{10}{4} = 210$ sets in all, so the probability is
          $105/210 = 1/2$. Counting sets sidesteps the dependence entirely,
          because the sets are equally likely even though the picks are
          linked.

      - part: Count the subsets
        teach: >
          Draw $n$ items without replacement from $N$, of which $K$ are
          successes, and let $X$ count the successes drawn. $X$ is
          hypergeometric:
          $\Pr(X = k) = \binom{K}{k}\binom{N-K}{n-k}/\binom{N}{n}$, for every
          $k$ the urn allows. The probabilities sum to $1$ by Vandermonde's
          identity.
      - ask: >
          For the auditor, what is the probability that exactly two of the
          four reviewed positions are mismarked?
        expects: "0.3"
        feedback: >
          $\binom{3}{2}\binom{7}{2}/\binom{10}{4} = 3 \times 21/210 = 63/210
          = 0.3$.
      - ask: >
          Suppose instead the auditor reviews $8$ of the $10$ positions. What
          is the smallest number of mismarked positions that can appear in the
          review?
        expects: "1"
        hint: >
          How many clean positions are there to fill the eight slots with?
        feedback: >
          Only $7$ positions are clean, so at least $8 - 7 = 1$ reviewed
          position is mismarked. The support runs from
          $\max(0, n - (N-K))$ to $\min(n, K)$ — here from $1$ to $3$ — and a
          binomial, which allows $0$ to $n$, cannot see that wall.

      - part: With replacement or without
        ask: >
          Which of these counts is hypergeometric?
        choices:
          - text: >
              The number of hearts among $5$ cards drawn one at a time, each
              card replaced and the deck reshuffled before the next draw.
            feedback: >
              Replacing the card restores the deck, so every draw is a heart
              with probability $1/4$, independently: that count is
              $\operatorname{Bin}(5, 1/4)$.
          - text: >
              The number of cards dealt until the first heart appears.
            feedback: >
              That is a waiting time, not a count of successes in a fixed
              sample.
          - text: >
              The number of hearts in a $5$-card hand dealt from one deck.
            correct: true
            feedback: >
              A fixed sample of $5$ from $52$ without replacement, with
              $K = 13$ successes: $\binom{13}{k}\binom{39}{5-k}/\binom{52}{5}$.
        feedback: >
          The clauses: a finite pool of known composition, a fixed sample
          size, drawn without replacement, and the successes counted.
      - ask: >
          Back to the colleague's $0.4116$. For which audit procedure is it
          exactly right?
        choices:
          - text: >
              The auditor picks $4$ different positions, as before.
            feedback: >
              That procedure gives $1/2$, as you counted. The binomial does
              not fit it.
          - text: >
              The auditor picks a position at random $4$ times, and may pick
              the same position more than once.
            correct: true
            feedback: >
              Now every pick is mismarked with probability $0.3$,
              independently, so the count is $\operatorname{Bin}(4, 0.3)$ and
              $0.4116$ is right. Every clause holds except one — without
              replacement — and dropping that one clause changes the law.
          - text: >
              The auditor keeps picking positions until finding a mismarked
              one.
            feedback: >
              That is a wait, whose length is the random thing. Neither the
              binomial nor the hypergeometric describes it.
        feedback: >
          Interview signatures for the hypergeometric: "a hand of five cards",
          "inspect $10$ from a batch of $200$", "tag and recapture". The tell
          is a fixed sample from a finite pool, without replacement.

  - node: quant-probability.discrete.hypergeometric-moments
    hook: >
      The mean looks suspiciously like the binomial's despite the
      dependence between draws, and untangling why is a reusable
      trick: linearity does not care about dependence.
    explanation: >
      With $N$ items, $K$ successes, and $n$ draws without replacement,
      $\mathbb{E}[X]=nK/N$ — identical in form to the binomial mean with
      $p=K/N$. Write $X$ as a sum of $n$ indicators, one per draw
      position, $X_{j}=1$ if the $j$-th draw is a success. By symmetry,
      every position in a random draw sequence is equally likely to
      land on any particular item, so each $X_{j}$ individually has
      $\Pr(X_{j}=1)=K/N$ — even though the $X_{j}$ are not independent
      of each other. Linearity does not require independence, so
      $\mathbb{E}[X]=\sum_{j}\mathbb{E}[X_{j}]=nK/N$ regardless.

      Variance is where the dependence finally shows: $\operatorname{Var}
      (X)=n\dfrac{K}{N}\left(1-\dfrac{K}{N}\right)\dfrac{N-n}{N-1}$ —
      the same leading factor as the binomial's $np(1-p)$, times a
      finite-population correction $(N-n)/(N-1)$. That factor equals
      $1$ at $n=1$ (a single draw has nothing to correct for) and $0$
      at $n=N$ (drawing the whole urn always yields exactly $K$
      successes, no randomness left).

      The mental model: the correction shrinks variance because
      depleting the urn is self-correcting — a run of successes early
      leaves fewer successes for later draws, damping swings that a
      with-replacement process would allow.
    worked: >
      An urn has $N=50$ items, $K=10$ successes; draw $n=8$ without
      replacement. The mean is $8\times10/50=1.6$, and
      $\operatorname{Var}(X)=8\times0.2\times0.8\times(42/49)\approx
      1.097$, so $\sigma\approx1.05$.
    interview: >
      "What's the mean number of successes drawn without replacement"
      tests whether linearity survives dependence; a strong answer
      states the indicator argument in one sentence and immediately
      flags the finite-population correction for the variance.
    pitfalls: >
      Assuming the variance formula matches the binomial's exactly —
      the correction factor is easy to forget; assuming dependence
      between draws breaks the mean calculation too, when only the
      variance is affected.
    recap: >
      The hypergeometric mean matches the binomial's at $p=K/N$ because
      linearity ignores dependence, while the variance shrinks by the
      finite-population factor $(N-n)/(N-1)$.
    dialogue:
      - part: Five stocks from twenty
        teach: >
          Of the $20$ stocks in a sector, $8$ beat the market this year. You
          pick $5$ different stocks at random, one after another. Let $X$ be
          the number of winners among your five.
      - ask: >
          Before anything is revealed, what is the probability that your third
          pick is a winner?
        expects: "0.4"
        hint: >
          Before any pick is seen, is there any reason the third slot should
          favour one stock over another?
        feedback: >
          $8/20 = 0.4$. Every slot of a random ordering is equally likely to
          hold any of the $20$ stocks, so the third slot is a winner with the
          same probability as the first. Dependence shows up only once you
          condition on what the earlier picks were.
      - ask: >
          What is $\mathbb{E}[X]$?
        expects: "2"
        feedback: >
          Write $X$ as five indicators, one per pick, each with mean $0.4$:
          $\mathbb{E}[X] = 5 \times 0.4 = 2$.
      - ask: >
          The five indicators are dependent. Is $\mathbb{E}[X] = 2$ still
          exact?
        choices:
          - text: >
              Only approximately; dependence spoils linearity.
            feedback: >
              Linearity of expectation holds for any indicators, dependent or
              not. The mean is exactly $2$.
          - text: >
              Yes: linearity needs only each indicator's own mean, not
              independence.
            correct: true
            feedback: >
              Each pick is a winner with probability $0.4$ and linearity adds
              those, whatever the dependence.
          - text: >
              No; you must sum $k$ against the hypergeometric pmf.
            feedback: >
              That sum also gives $2$, so it cannot contradict linearity. It is
              just the slow route.
        feedback: >
          The mean $nK/N$ is the binomial mean with $p = K/N$. Dependence has
          to show up somewhere else.
      - ask: >
          If you picked with replacement — five independent picks, each a
          winner with probability $0.4$ — what would $\operatorname{Var}(X)$
          be?
        expects: "1.2"
        feedback: >
          $\operatorname{Bin}(5, 0.4)$: $5 \times 0.4 \times 0.6 = 1.2$.
      - reflect: >
          Without replacement, will the variance be larger or smaller than
          $1.2$? Argue it from what one early winner does to the later picks.
        answer: >
          Smaller. An early winner leaves fewer winners in the pool, so later
          picks lean toward losers, and an early loser does the opposite. The
          pool pushes back against every streak, so the count swings less than
          with independent picks. Pair by pair, two picks are less likely to
          both be winners than independence would make them, and that is
          exactly what the variance feels.

      - part: The same mean, a smaller spread
        ask: >
          What is the probability that your first two picks are both
          winners? Give four decimal places.
        expects: "0.1474"
        tolerance: 0.0005
        feedback: >
          $\dfrac{8}{20} \times \dfrac{7}{19} = \dfrac{56}{380} \approx 0.1474$,
          below the $0.4^{2} = 0.16$ that independence would give. By the same
          symmetry, every pair of picks has this probability of being two
          winners.
      - ask: >
          Expand $X^{2} = (X_{1} + \dots + X_{5})^{2}$ into the five squares
          $X_{j}^{2}$ and the $20$ ordered cross products $X_{i}X_{j}$ with
          $i \ne j$. What is $\mathbb{E}[X^{2}]$? Give four decimal places.
        expects: "4.9474"
        tolerance: 0.0005
        hint: >
          $X_{j}^{2} = X_{j}$, and $X_{i}X_{j}$ is the indicator that picks $i$
          and $j$ are both winners.
        feedback: >
          $\mathbb{E}[X^{2}] = 5 \times 0.4 + 20 \times 56/380 = 2 + 2.9474
          \approx 4.9474$. Only linearity was used; the dependence entered
          through the $56/380$.
      - ask: >
          So what is $\operatorname{Var}(X)$? Give four decimal places.
        expects: "0.9474"
        tolerance: 0.0005
        feedback: >
          $4.9474 - 2^{2} \approx 0.9474$, which is exactly $18/19$ — below
          the $1.2$ of independent picks, as you predicted.
      - teach: >
          With $N$ items, $K$ successes and $n$ draws without replacement,
          $\mathbb{E}[X] = nK/N$ and
          $\operatorname{Var}(X) = n\dfrac{K}{N}\left(1 - \dfrac{K}{N}\right)
          \dfrac{N-n}{N-1}$. The factor $(N-n)/(N-1)$ is the finite-population
          correction. Here it is $15/19$, and $1.2 \times 15/19 = 18/19$, the
          number you just built from pairs of picks.

      - part: The correction at its edges
        ask: >
          You pick all $20$ stocks. What is $\operatorname{Var}(X)$?
        expects: "0"
        feedback: >
          You certainly get all $8$ winners, so nothing is random. The
          correction $(20 - 20)/19 = 0$ says the same; at $n = 1$ it is
          $19/19 = 1$, and a single pick has the Bernoulli variance $0.24$.
      - ask: >
          Now the five stocks are picked with probability proportional to
          market capitalisation, and the winners are mostly large caps. Does
          $nK/N = 2$ still give $\mathbb{E}[X]$?
        choices:
          - text: >
              Yes: linearity holds for any picking scheme.
            feedback: >
              Linearity still holds, but it adds each pick's own probability of
              a winner, and that is no longer $8/20$. Big caps are favoured,
              and big caps tend to be winners.
          - text: >
              No: each pick is now a winner with probability above $0.4$, so
              the mean is above $2$.
            correct: true
            feedback: >
              The step that broke is "every slot is equally likely to hold any
              stock". Without it, $\Pr(X_{j} = 1) = K/N$ fails, and so does the
              mean.
          - text: >
              Yes, but the variance formula needs a different correction.
            feedback: >
              The mean already fails. The symmetry that gave every pick
              probability $K/N$ was the only input to it.
        feedback: >
          The hypergeometric mean rests on one thing: a uniformly random
          sample, so every draw is equally likely to be any item. In an
          interview: "same mean as the binomial with $p = K/N$, variance
          shrunk by $(N-n)/(N-1)$."

  - node: quant-probability.discrete.binomial-vs-hypergeometric
    hook: >
      "With replacement or without?" is the single question that
      decides which of these two laws applies, and interviewers plant
      it precisely because the two pmfs look deceptively similar.
    explanation: >
      Both laws share the same mean $np$ with $p=K/N$ — replacement
      does not change the average count of successes, only how much
      that count fluctuates. Sampling without replacement is
      self-correcting, since an unusually rich early draw leaves a
      poorer urn behind for later draws, so its variance is smaller
      than the with-replacement (binomial) variance by exactly the
      finite-population factor $(N-n)/(N-1)\le1$.

      As $N$ grows with the ratio $K/N$ held fixed at $p$, the
      depletion effect from any one draw becomes negligible, and the
      hypergeometric converges to $\operatorname{Bin}(n,p)$. The
      practical threshold worth quoting: the difference is negligible
      once the sample is a small fraction of the pool, roughly
      $n\le0.05N$.

      This is a modeling decision more than a computational one: the
      first move on any "draws from a finite set" problem is asking
      whether draws are with or without replacement — or, equivalently,
      whether the pool is large enough relative to the sample that it
      does not matter — and only then reaching for a formula.
    worked: >
      An urn has $N=200$ balls, $K=40$ red; draw $n=10$ without
      replacement. The mean is $10\times0.2=2$, and
      $\operatorname{Var}(X)=10\times0.2\times0.8\times(190/199)\approx
      1.528$, so $\sigma\approx1.24$. Sampling with replacement instead
      (binomial) gives $\operatorname{Var}(X)=1.6$ and
      $\sigma\approx1.26$ — close, since $n=10$ is only $5\%$ of
      $N=200$.
    interview: >
      "Does it matter that we're sampling without replacement here" is
      testing exactly this node; a fast answer states equal means,
      smaller hypergeometric variance by $(N-n)/(N-1)$, and the
      $n\le0.05N$ rule for when the distinction is safe to ignore.
    pitfalls: >
      Using the binomial formula for a small, finite pool where
      depletion is material; assuming the two laws differ in mean, when
      only the variance actually changes.
    recap: >
      Same mean, smaller variance without replacement — the gap is a
      finite-population correction that vanishes once the sample is a
      small slice of the pool.
    dialogue:
      - part: Six tickets from twelve
        teach: >
          A pool of $12$ trade tickets contains $6$ flagged ones. You sample $6$
          tickets and count the flagged ones, in one of two ways: without
          replacement, or putting each ticket back before the next draw. Both
          ways the expected count is $3$.
      - ask: >
          Predict: which way gives the flagged count the larger variance?
        choices:
          - text: >
              Without replacement: the draws are dependent, and dependence
              adds noise.
            feedback: >
              Dependence can add noise or remove it. Here each flagged draw
              makes the next one less likely to be flagged, which pulls the
              count back toward the middle.
          - text: >
              With replacement.
            correct: true
            feedback: >
              Putting tickets back lets a streak run unchecked; drawing them
              out corrects every streak. The next two numbers measure how much.
          - text: >
              Neither: the mean is $3$ both ways, so the spread is too.
            feedback: >
              The mean is shared; the spread is not. Two laws with the same
              centre can have very different variances.
        feedback: >
          Hold the prediction against the numbers.
      - ask: >
          With replacement, what is the variance of the flagged count?
        expects: "1.5"
        feedback: >
          $\operatorname{Bin}(6, 1/2)$: $6 \times 0.5 \times 0.5 = 1.5$.
      - ask: >
          Without replacement, what is the variance? Give three decimal places.
        expects: "0.818"
        tolerance: 0.001
        feedback: >
          The hypergeometric variance is the binomial's times
          $(N - n)/(N - 1) = 6/11$: $1.5 \times 6/11 = 9/11 \approx 0.818$.
          Little more than half.
      - ask: >
          Without replacement, what is the probability that all six sampled
          tickets are flagged? Give an exact fraction.
        expects: "1/924"
        tolerance: 0.00001
        feedback: >
          Only one of the $\binom{12}{6} = 924$ equally likely samples is the
          six flagged tickets, so $1/924 \approx 0.0011$. With replacement it
          is $(1/2)^{6} = 1/64 \approx 0.0156$ — about fourteen times as
          likely.
      - reflect: >
          Why are extreme counts so much rarer without replacement here, and
          what would have to change about the pool for the two ways of
          sampling to give nearly the same answers?
        answer: >
          Each flagged ticket drawn out leaves fewer flagged ones behind: after
          five flagged draws, only $1$ of the remaining $7$ is flagged, so a
          sixth is unlikely. The pool corrects itself. For the two methods to
          agree, each draw must barely change the pool — the pool has to be
          large compared with the sample, so that removing a ticket leaves the
          flagged fraction essentially where it was.

      - part: When the pool is large
        teach: >
          Both laws have mean $np$ with $p = K/N$; without replacement the
          variance is smaller by the factor $(N - n)/(N - 1) \le 1$. As $N$
          grows with $K/N$ fixed at $p$, the hypergeometric converges to
          $\operatorname{Bin}(n, p)$. The working rule: the difference is
          negligible once the sample is at most about $5$ percent of the pool.
      - ask: >
          The pool is now $1200$ tickets with $600$ flagged, and you sample
          $6$. What is the correction factor? Give four decimal places.
        expects: "0.9958"
        tolerance: 0.0005
        feedback: >
          $(1200 - 6)/(1200 - 1) = 1194/1199 \approx 0.9958$: the variances
          differ by less than half a percent, and the binomial is fine.
      - ask: >
          Which of these needs the hypergeometric rather than the binomial?
        choices:
          - text: >
              Polling $1000$ voters from an electorate of $10$ million and
              counting supporters.
            feedback: >
              The sample is $0.01$ percent of the pool. The correction factor
              is $0.9999$; the binomial is indistinguishable.
          - text: >
              Counting the spades in a $13$-card hand.
            correct: true
            feedback: >
              $13$ cards is $25$ percent of the deck. The factor is
              $39/51 \approx 0.76$, so the binomial overstates the variance
              by about a third.
          - text: >
              Auditing $50$ of $100000$ trades and counting errors.
            feedback: >
              $0.05$ percent of the pool: the factor is about $0.9995$. Use the
              binomial without a second thought.
        feedback: >
          The question is not "with or without replacement?" alone, but
          "without replacement, from a pool how large?"

      - part: Where the intuition slips
        ask: >
          A colleague argues that drawing without replacement also lowers the
          expected count, since flagged tickets get used up. What do you say?
        choices:
          - text: >
              Right: fewer flagged tickets remain for later draws, so the mean
              drops.
            feedback: >
              Fewer remain after a flagged draw, but more remain after a clean
              one. Before anything is seen, every draw is flagged with
              probability $K/N$, so the mean is exactly $nK/N$.
          - text: >
              Wrong: the mean is $nK/N$ either way; only the spread changes.
            correct: true
            feedback: >
              Linearity gives the mean from each draw's own probability, which
              is $K/N$ in both schemes. Replacement only changes how the draws
              move together.
          - text: >
              Right, but only when the pool is small.
            feedback: >
              Pool size governs the variance correction, not the mean. Even in
              the $12$-ticket pool the mean was exactly $3$.
        feedback: >
          The two laws differ in one modelling choice, and that choice shows up
          only in the variance.
      - ask: >
          You draw $40$ tickets from a pool of $100$ without replacement. What
          fraction of the binomial variance is left? Give three decimal
          places.
        expects: "0.606"
        tolerance: 0.001
        feedback: >
          $(100 - 40)/(100 - 1) = 60/99 \approx 0.606$. The sample is $40$
          percent of the pool, far past the $5$ percent rule, and the binomial
          would overstate the variance by about two-thirds. In an interview,
          ask "with or without replacement, and how big is the pool?" before
          writing any formula.

  - node: quant-probability.discrete.uniform-discrete
    hook: >
      "Equally likely values" sounds trivial, but the interview trap is
      reaching for it as a default rather than a modeling claim that
      must be earned — and forgetting that sums of uniforms are not
      themselves uniform.
    explanation: >
      $X$ is uniform on $\{1,\dots,n\}$ when $\Pr(X=k)=1/n$ for every
      $k$; every value carries equal weight, so
      $\mathbb{E}[X]=(n+1)/2$ by symmetry alone (values pair up around
      the midpoint, $k$ and $n+1-k$, each pair averaging to $(n+1)/2$).
      The second moment needs the standard sum of squares,
      $\mathbb{E}[X^{2}]=(n+1)(2n+1)/6$, giving
      $\operatorname{Var}(X)=(n^{2}-1)/12$.

      On a general integer range $\{a,\dots,b\}$ of size $n=b-a+1$,
      shift the argument: the mean is $(a+b)/2$ and the variance is
      $((b-a+1)^{2}-1)/12$, same formulas relabeled. A fair die is the
      case $n=6$: mean $3.5$, variance $35/12\approx2.917$,
      $\sigma\approx1.71$ — worth memorizing as the reference case for
      so much else in this chapter.

      Two warnings are worth stating out loud: uniformity is a modeling
      assumption about the physical process (a fair die, a genuinely
      random label) that must be justified from the problem, never
      assumed just because values look unordered; and sums of
      independent uniforms are emphatically not themselves uniform —
      two dice summed peak at $7$ and taper toward $2$ and $12$, a
      triangular shape, not a flat one.
    worked: >
      A spinner is uniform on $\{1,\dots,10\}$: mean $=11/2=5.5$,
      $\operatorname{Var}(X)=(100-1)/12=99/12=8.25$, so
      $\sigma\approx2.87$.
    interview: >
      "What's the mean and variance of a fair die / fair spinner /
      random label" is the direct ask; a common trap follow-up asks for
      the distribution of the sum of two such variables, testing
      whether you will wrongly claim it is also uniform.
    pitfalls: >
      Assuming a sum or average of uniforms is itself uniform, when
      sums concentrate toward the middle; invoking "uniform" as a lazy
      default for an unspecified label without checking the problem
      actually supports equal likelihood.
    recap: >
      Discrete uniform on $n$ equally likely values has mean $(n+1)/2$
      and variance $(n^{2}-1)/12$ — the fair die's law, and never
      automatically the law of a sum of such variables.
    dialogue:
      - part: An eight-sided die
        teach: >
          A fair eight-sided die has faces $1$ through $8$, each equally
          likely. Let $X$ be the face that comes up.
      - ask: >
          What is $\mathbb{E}[X]$?
        expects: "4.5"
        feedback: >
          The faces pair up around the middle — $1$ with $8$, $2$ with $7$,
          $3$ with $6$, $4$ with $5$ — and every pair averages $4.5$. So does
          the whole die.
      - ask: >
          What is $\mathbb{E}[X^{2}]$?
        expects: "25.5"
        hint: >
          $1 + 4 + 9 + \dots + 64$, divided by $8$.
        feedback: >
          The squares sum to $204$, and $204/8 = 25.5$. In general
          $1^{2} + \dots + n^{2} = n(n+1)(2n+1)/6$, so
          $\mathbb{E}[X^{2}] = (n+1)(2n+1)/6 = 9 \times 17/6 = 25.5$.
      - ask: >
          What is $\operatorname{Var}(X)$?
        expects: "5.25"
        feedback: >
          $25.5 - 4.5^{2} = 25.5 - 20.25 = 5.25$.
      - ask: >
          Relabel the faces $11$ through $18$. What is the variance now?
        choices:
          - text: >
              Larger: the numbers are bigger, so their squares are much
              bigger.
            feedback: >
              $\mathbb{E}[X^{2}]$ does grow, but $\mathbb{E}[X]^{2}$ grows by
              exactly as much. Adding $10$ to every face moves the centre and
              leaves every distance from it unchanged.
          - text: >
              Still $5.25$.
            correct: true
            feedback: >
              The new die is $X + 10$, and a shift never changes a variance.
          - text: >
              $5.25 \times 10^{2} = 525$.
            feedback: >
              That would be multiplying every face by $10$, which spreads the
              faces apart. Adding $10$ slides them without spreading them.
        feedback: >
          Only the gaps between the values matter for the spread, not where
          the block of values sits.
      - reflect: >
          So the variance of a uniform block of consecutive integers depends
          on one thing only. What is it, and why can nothing else enter?
        answer: >
          The number of values, $n$. Any block of $n$ consecutive integers is
          a shift of $\{1, \dots, n\}$, and shifting moves the mean without
          changing any deviation from it. So the variance is a function of
          $n$ alone — for $n = 8$ it is $5.25$, for a six-sided die $35/12$ —
          and the formula only has to be found once, on $\{1, \dots, n\}$.

      - part: Equally likely labels
        teach: >
          $X$ is uniform on $\{1, \dots, n\}$ when $\Pr(X = k) = 1/n$ for each
          $k$. Then $\mathbb{E}[X] = (n+1)/2$,
          $\mathbb{E}[X^{2}] = (n+1)(2n+1)/6$, and
          $\operatorname{Var}(X) = (n^{2}-1)/12$. On a block
          $\{a, \dots, b\}$ the mean is $(a+b)/2$ and the variance is
          $((b-a+1)^{2}-1)/12$. Check: $(64 - 1)/12 = 5.25$.
      - ask: >
          $X$ is uniform on $\{-5, -4, \dots, 5\}$. What is
          $\operatorname{Var}(X)$?
        expects: "10"
        hint: >
          Count the values first; zero is one of them.
        feedback: >
          There are $11$ values, so $(121 - 1)/12 = 10$. If you used $n = 10$,
          you forgot the zero and got $99/12 = 8.25$.

      - part: What counts as uniform
        ask: >
          Which of these is a discrete uniform variable?
        choices:
          - text: >
              The position of the ace of spades in a well-shuffled deck.
            correct: true
            feedback: >
              A uniform shuffle puts that card in each of the $52$ positions
              with probability $1/52$: uniform on $\{1, \dots, 52\}$, mean
              $26.5$.
          - text: >
              The hour of the day, $0$ to $23$, at which a randomly chosen
              trade was executed.
            feedback: >
              Twenty-four labels do not make twenty-four equal chances. Trades
              cluster around the open and the close, and most hours see none.
              Uniformity has to come from the mechanism, not from the labels.
          - text: >
              The number of heads in $7$ tosses of a fair coin.
            feedback: >
              The values $0$ to $7$ are consecutive, but $3$ heads has
              probability $35/128$ and $0$ heads $1/128$. Binomial, not
              uniform.
        feedback: >
          The clause that matters is equal probabilities, and it must be
          justified by the mechanism — a fair die, a fair shuffle — never
          assumed because the values look unordered.
      - ask: >
          Roll two fair eight-sided dice. What is the probability that the sum
          is $9$, the most likely sum?
        expects: "0.125"
        feedback: >
          Eight of the $64$ ordered pairs sum to $9$, from $(1,8)$ to $(8,1)$,
          so $8/64 = 0.125$; a sum of $2$ has only $1/64$. Each die is
          uniform, but their sum peaks in the middle — sums of uniforms are
          not uniform.
      - ask: >
          A variable is equally likely to be any of $2, 4, 6, \dots, 16$ —
          eight values, as before. What is its variance?
        expects: "21"
        hint: >
          It is twice the eight-sided die.
        feedback: >
          $\operatorname{Var}(2X) = 4 \times 5.25 = 21$. The formula
          $(n^{2}-1)/12 = 5.25$ fails because the values are not consecutive
          integers: equal probabilities hold, but the spacing is $2$, and
          spacing scales the variance by its square.

  - node: quant-probability.discrete.coupon-collector
    hook: >
      "How many draws to collect every type" is a favorite because the
      answer — $n\ln n$, not $n$ — surprises people expecting something
      close to linear, and the derivation is a clean showcase of
      splitting a hard wait into geometric pieces.
    explanation: >
      With $n$ coupon types, each draw uniform over the types and
      independent, let $T$ be the number of draws until every type has
      appeared. Split $T=T_{1}+\dots+T_{n}$, where $T_{i}$ is the wait
      to move from $i-1$ distinct types collected to $i$ distinct
      types. While holding $i-1$ types, a draw is "new" with
      probability $p_{i}=(n-i+1)/n$ (any of the $n-i+1$ not-yet-seen
      types), so $T_{i}$ is geometric with mean $n/(n-i+1)$ — this
      splitting-by-progress idea, not the pmf of $T$ itself, is the
      load-bearing step.

      Summing the means gives $\mathbb{E}[T]=n(1+1/2+\dots+1/n)=
      nH_{n}$, where $H_{n}$ is the $n$-th harmonic number, already
      known to grow like $\ln n+\gamma$. Linearity does not need the
      $T_{i}$ to be independent, only that each has the stated mean, so
      the sum is valid even though later waits depend on exactly which
      types the earlier draws happened to produce.

      The reason it is slow at the end: early draws are cheap, since
      almost everything is new, but the very last coupon alone has
      expected wait $n$ (probability $1/n$ per draw) — as large as the
      sum of every earlier wait combined for large $n$. That single
      term is what makes the total grow like $n\ln n$ rather than
      linearly in $n$.
    worked: >
      For $n=10$ coupon types, $H_{10}=1+1/2+\dots+1/10=7381/2520
      \approx2.929$, so $\mathbb{E}[T]=10\times2.929\approx29.3$ draws
      — nearly triple the naive guess of "about $10$."
    interview: >
      "How many boxes of cereal until you have all $n$ prizes" is the
      canonical phrasing; the interviewer wants the
      split-into-geometric-waits argument stated fast, landing on
      $nH_{n}$, with a sense of the $n\ln n$ growth rate rather than a
      guess near $n$.
    pitfalls: >
      Guessing the answer scales like $n$, when it is $n\ln n$,
      strictly larger and increasingly so; assuming the $T_{i}$ need to
      be independent for the mean to add, when linearity alone
      suffices.
    recap: >
      Collecting all $n$ types takes $nH_{n}\approx n(\ln n+\gamma)$
      draws on average, dominated by the last few, hardest-to-find
      coupons.
    dialogue:
      - part: Until all five have presented
        teach: >
          Each morning one of $5$ analysts is picked uniformly at random,
          independently of earlier mornings, to present at the desk meeting.
          Let $T$ be the number of mornings until every analyst has presented
          at least once.
      - ask: >
          A first guess is "about $5$ mornings". What is the probability that
          the first $5$ mornings already cover all five analysts? Give four
          decimal places.
        expects: "0.0384"
        tolerance: 0.0005
        hint: >
          The five presenters must be all different: count the orderings of
          five distinct analysts over all $5^{5}$ sequences.
        feedback: >
          $5!/5^{5} = 120/3125 = 0.0384$. Under four percent: repeats are the
          rule, and the guess of $5$ is far too low.
      - ask: >
          Suppose three different analysts have presented so far. What is the
          probability that tomorrow's presenter is someone new?
        expects: "0.4"
        feedback: >
          Two of the five have not presented: $2/5 = 0.4$. The chance of
          progress depends only on how many you have seen, not on which.
      - ask: >
          Starting from three seen, what is the expected number of mornings
          until a fourth analyst presents?
        expects: "2.5"
        feedback: >
          Each morning is a new face with probability $0.4$, independently, so
          the wait is geometric with mean $1/0.4 = 2.5$.
      - reflect: >
          You just priced one stage of progress. Describe every stage the same
          way, and say how the stages give $\mathbb{E}[T]$.
        answer: >
          Split $T$ into five waits: $T_{i}$ runs from having $i - 1$ analysts
          seen to having $i$. During it each morning is new with probability
          $(5 - i + 1)/5$, so $T_{i}$ is geometric with mean $5/(5 - i + 1)$:
          $1$, $5/4$, $5/3$, $5/2$, $5$. Linearity adds them, so
          $\mathbb{E}[T] = 5(1 + 1/2 + 1/3 + 1/4 + 1/5)$.

      - part: Splitting by progress
        ask: >
          What is $\mathbb{E}[T]$? Give two decimal places.
        expects: "11.42"
        tolerance: 0.01
        feedback: >
          $5 \times (1 + 0.5 + 0.3333 + 0.25 + 0.2) = 5 \times 137/60 =
          137/12 \approx 11.42$ mornings — more than double the naive $5$.
      - ask: >
          What share of that expected total is the wait for the very last
          analyst? Give three decimal places.
        expects: "0.438"
        tolerance: 0.002
        feedback: >
          The last wait has $p = 1/5$ and mean $5$, and $5/(137/12) = 60/137
          \approx 0.438$. Almost half the time is spent waiting for one
          person, while the first two stages together take $2.25$ mornings.
      - ask: >
          The five stage waits are independent geometrics. What is
          $\operatorname{Var}(T)$? Give two decimal places.
        expects: "25.17"
        tolerance: 0.01
        hint: >
          Each stage has variance $(1-p_{i})/p_{i}^{2}$ with
          $p_{i} = 1, 0.8, 0.6, 0.4, 0.2$.
        feedback: >
          $0 + 0.2/0.64 + 0.4/0.36 + 0.6/0.16 + 0.8/0.04 = 0.3125 + 1.1111 +
          3.75 + 20 \approx 25.17$, so $\sigma \approx 5.0$. The last stage
          alone contributes $20$: the end of the collection is both the slow
          part and the uncertain part.
      - teach: >
          This is the coupon collector. With $n$ equally likely types, split
          the wait by progress: holding $i - 1$ types, a draw is new with
          probability $(n - i + 1)/n$, so
          $\mathbb{E}[T] = n(1 + 1/2 + \dots + 1/n) = nH_{n}$, and
          $H_{n} \approx \ln n + 0.577$. The final type alone costs $n$ draws
          on average.

      - part: A hundred types
        ask: >
          With $100$ equally likely types, what is $\mathbb{E}[T]$? Use
          $H_{n} \approx \ln n + 0.577$ and give the nearest whole number.
        expects: "518"
        tolerance: 1.5
        feedback: >
          $100 \times (\ln 100 + 0.577) \approx 100 \times (4.605 + 0.577)
          \approx 518$; the exact $100H_{100}$ is about $518.7$. More than five
          times the number of types.
      - ask: >
          Double the types to $200$. By about what factor does $\mathbb{E}[T]$
          grow? Give two decimal places.
        expects: "2.27"
        tolerance: 0.02
        feedback: >
          $200(\ln 200 + 0.577)/(100(\ln 100 + 0.577)) \approx 1175/518 \approx
          2.27$. More than double, because both factors of $n\ln n$ grow. The
          answer scales like $n \ln n$, not like $n$.
      - teach: >
          Out loud in an interview: "split by progress; the $i$-th stage is
          geometric with success probability $(n - i + 1)/n$; linearity gives
          $nH_{n} \approx n\ln n$." Then mention that the last few types
          dominate both the mean and the variance.

  - node: quant-probability.discrete.identify-the-law
    hook: >
      The hardest part of a distributions question is rarely the
      algebra — it is translating the word problem into the right
      named law before touching a formula, and this is the checklist
      for doing that fast.
    explanation: >
      Read the story, not the formula, and ask two questions before
      naming a law. First: is there a fixed, known number of trials
      $n$? If so, and each trial is independent with the same success
      probability $p$, counting successes is binomial with mean $np$.
      If instead you are counting draws until something happens, it is
      a waiting-time law: first success is geometric with mean $1/p$,
      $r$-th success is negative binomial with mean $r/p$.

      Second: does the sampling deplete a finite pool? A fixed-size
      sample drawn without replacement from a finite population is
      hypergeometric with mean $nK/N$, even though that mean matches
      what a binomial with $p=K/N$ would give — the tell is "without
      replacement" or "from a batch of," not the mean. Counts with no
      natural trial number at all — rare events over a window of time
      or space — are Poisson with mean and variance both $\lambda$;
      equally likely labels with no notion of success or failure are
      discrete uniform.

      Two checks catch nearly every trap before you commit: is the
      per-trial probability genuinely constant (if it drifts, none of
      these clean formulas apply), and are the trials genuinely
      independent (if drawing depletes a pool, switch to
      hypergeometric). A cheap diagnostic once you have real data:
      sample variance far above sample mean rules out Poisson.
    worked: >
      A hiring pool has $12$ candidates, $5$ of them qualified;
      interview $4$ of them at random. How many qualified candidates do
      you expect to see? The sample size is fixed, but the draws are
      without replacement from a finite, labeled pool, so this is
      hypergeometric, not binomial: $N=12$, $K=5$, $n=4$, mean
      $=4\times5/12=5/3\approx1.67$.
    interview: >
      Any distributions question really begins with "which law is
      this"; interviewers listen for you narrating the checklist out
      loud — fixed $n$ or waiting, replacement or not, natural trial
      count or none — before a single formula appears.
    pitfalls: >
      Defaulting to binomial whenever $n$ is fixed without checking
      whether the sampling depletes a pool; defaulting to Poisson for
      any "count" without checking that events are independent and
      individually rare.
    recap: >
      Match the story to the law by asking fixed-$n$-or-waiting and
      with-or-without-replacement before writing any formula — the
      wording, not the arithmetic, is the hard part.
    dialogue:
      - part: Thirty requests for quote
        teach: >
          A desk receives $30$ requests for quote today, one after another.
          Each turns into a trade with probability $0.2$, independently of the
          others.
      - ask: >
          What is the variance of the number of trades?
        expects: "4.8"
        feedback: >
          A fixed $30$ trials, independent, one $p$, successes counted:
          $\operatorname{Bin}(30, 0.2)$, with variance
          $30 \times 0.2 \times 0.8 = 4.8$.
      - ask: >
          What is the expected number of requests up to and including the
          first trade?
        expects: "5"
        feedback: >
          Now the number of successes is fixed at one and the number of trials
          is what varies: geometric, mean $1/0.2 = 5$.
      - ask: >
          The head trader stops quoting for the day once $2$ trades are done.
          Ignoring the cap of $30$, what is the expected number of requests
          handled?
        expects: "10"
        feedback: >
          The second success is fixed and the trials are random: negative
          binomial with $r = 2$, mean $r/p = 2/0.2 = 10$.
      - reflect: >
          Three questions about the same stream of requests, three different
          laws. What single thing about each question told you which law it
          was, before any arithmetic?
        answer: >
          What is fixed and what is random. When the number of trials is fixed
          and the successes are counted, it is binomial. When the number of
          successes is fixed — one, or $r$ — and the trials are counted, it is
          a waiting time: geometric or negative binomial. The stream was the
          same; the question changed which quantity was random.

      - part: Two questions before any formula
        teach: >
          Read the story, not the numbers. First: is there a fixed number of
          independent trials with one $p$? Counting successes is binomial,
          mean $np$; waiting for the first or $r$-th success is geometric or
          negative binomial, mean $1/p$ or $r/p$. Second: does the sampling
          deplete a finite pool? Then it is hypergeometric, mean $nK/N$. Counts
          of rare events in a window with no natural $n$ are Poisson, and
          equally likely labels are uniform.
      - ask: >
          Of today's $30$ requests, exactly $6$ became trades. Compliance pulls
          $5$ of the $30$ at random to review. What law does the number of
          trades among the reviewed requests follow?
        choices:
          - text: >
              $\operatorname{Bin}(5, 0.2)$, since each request trades with
              probability $0.2$.
            feedback: >
              The day is over and exactly $6$ of the $30$ traded. Each request
              reviewed removes one from a fixed pool, so the draws are
              dependent: once a trade is pulled, only $5$ trades remain among
              $29$.
          - text: >
              Hypergeometric with $N = 30$, $K = 6$, $n = 5$.
            correct: true
            feedback: >
              A fixed sample, without replacement, from a finite pool of known
              composition. Its mean is $5 \times 6/30 = 1$, and its variance
              carries the correction $25/29$.
          - text: >
              Poisson with mean $1$.
            feedback: >
              The count is capped at $5$ and drawn from a fixed pool. Poisson is
              for counts in a window with no natural number of trials.
        feedback: >
          "Pulls $5$ of the $30$" is the tell: a finite pool, depleted by every
          draw.
      - ask: >
          Across the whole firm, block-trade requests arrive from thousands of
          clients, each sending one only rarely, at an average of $2.5$ per
          hour. What is the probability of an hour with none? Give four
          decimal places.
        expects: "0.0821"
        tolerance: 0.0005
        feedback: >
          No natural $n$, many independent sources, each rare: Poisson with
          $\lambda = 2.5$, and $\Pr(0) = e^{-2.5} \approx 0.0821$.

      - part: Labels, and stories with no name
        ask: >
          Back on the desk: given that exactly one of the $30$ requests became
          a trade, what is the expected position, from $1$ to $30$, of that
          request?
        expects: "15.5"
        hint: >
          Given exactly one success, is any position likelier than another?
        feedback: >
          Every pattern with one trade has the same probability,
          $0.2 \times 0.8^{29}$, so the position is uniform on
          $\{1, \dots, 30\}$, with mean $(1 + 30)/2 = 15.5$. Equally likely
          labels: discrete uniform.
      - ask: >
          On a busier day, clients lose interest as the day goes on: the
          first request trades with probability $0.3$, and the chance falls
          steadily to $0.1$ for the last. What law is the number of trades?
        choices:
          - text: >
              $\operatorname{Bin}(30, 0.2)$, using the average probability.
            feedback: >
              The average gets the mean right, but the trials no longer share
              one $p$, so the binomial pmf and variance are wrong.
          - text: >
              Poisson, because the probabilities vary.
            feedback: >
              Varying probabilities do not make a count Poisson. There are
              still $30$ trials, a hard cap on the count.
          - text: >
              None of the named laws: the probability drifts, so no clean
              formula applies, though the mean is still the sum of the $30$
              probabilities.
            correct: true
            feedback: >
              The constant-$p$ check fails. Linearity still gives the mean;
              independence still lets variances add; but there is no named pmf
              to quote.
        feedback: >
          Two checks before you commit to any law: is $p$ really constant, and
          are the trials really independent?
      - teach: >
          In an interview, name the law before writing a formula, and say why
          in one clause: "fixed $n$, independent, one $p$ — binomial", or
          "without replacement from a pool of $30$ — hypergeometric". The
          reason is what the interviewer is listening for.
