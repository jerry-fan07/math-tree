unit: quant-statistics.learning
opening: >
  This unit is the overfitting discipline: the single failure mode most
  likely to make a quant researcher's work worthless even when every
  individual calculation along the way is correct. It opens with what a
  model is actually estimating and why training error lies about it, builds
  the bias-variance tradeoff and the validation machinery — splits,
  cross-validation, regularization, honest hyperparameter selection — that
  keeps that lie in check, then works through gradient descent, logistic
  regression, classification metrics, and tree ensembles as the default
  fitting toolkit built on top. It closes on why this matters specifically
  for trading: feature leakage, walk-forward validation, and the arithmetic
  of what a backtest of many strategies looks like when none of them have
  any real edge at all.
lessons:
  - node: quant-statistics.learning.supervised-setup
    hook: >
      Every fitted model hides a choice made before any data is touched: the
      loss function. That single choice fixes what quantity you are actually
      trying to recover, and an interviewer asking "what is your model
      estimating" is testing whether you know the answer depends on the
      loss, not the algorithm.
    explanation: >
      A joint law $P$ couples $X$ and $Y$; the learner never sees $P$, only
      $n$ independent draws from it, and picks $\hat f$ from a class
      $\mathcal{F}$ to make the risk $R(f) = \mathbb{E}[L(Y, f(X))]$ small on
      a fresh draw.

      Fix $x$ and let $m(x) = \mathbb{E}[Y \mid X = x]$. Add and subtract
      $m(x)$ inside squared loss: $\mathbb{E}[(Y-f(x))^{2}\mid X=x] =
      \operatorname{Var}(Y\mid X=x) + (m(x)-f(x))^{2}$, because the cross
      term $2(m(x)-f(x))\,\mathbb{E}[Y-m(x)\mid X=x]$ vanishes by the
      definition of $m(x)$. Only the second piece answers to $f$, and it
      hits zero exactly at $f(x)=m(x)$: under squared loss the best possible
      predictor is a conditional mean, so fitting a model is estimating that
      mean from finitely many samples.

      The loss chosen picks the target: absolute loss is minimized by the
      conditional median, $0$–$1$ loss by the most likely class. Every
      technique later in this unit is this one problem with a specific
      $\mathcal{F}$, $L$, and fitting procedure attached — and independence
      of the $n$ draws is the first assumption markets break, since returns
      are serially dependent and $P$ itself drifts.
    worked: >
      Suppose $X$ is order size and, conditional on $X=100$, the number of
      shares filled $Y$ equals $50$ with probability $0.3$, $60$ with
      probability $0.4$, and $80$ with probability $0.3$. The conditional
      mean is $m(100) = 0.3(50)+0.4(60)+0.3(80) = 15+24+24 = 63$. Predicting
      the unconditional average fill across all order sizes, or the mode
      $60$, both score worse in expected squared error at $X=100$ than the
      single number $63$.
    interview: >
      "What is your model actually estimating?" or "why is regression about
      the conditional mean rather than correlation?" wants $\mathbb{E}[Y\mid
      X]$ named as a consequence of squared loss, not a definition of
      regression. A frequent follow-up asks what changes under absolute or
      $0$–$1$ loss.
    pitfalls: >
      Saying "regression estimates the mean" without specifying which mean —
      it is the mean conditional on $X$, not the unconditional sample mean
      of $Y$. Assuming squared loss is the default; a desk asking you to
      minimize absolute error wants the conditional median. Treating
      training draws as independent out of habit when the real data are
      serially dependent.
    recap: >
      Supervised learning picks $\hat f$ to minimize expected loss on a
      fresh draw, and under squared loss the object being estimated is
      exactly the conditional mean $\mathbb{E}[Y\mid X]$.
    dialogue:
      - part: One number for tomorrow's trade count
        teach: >
          A desk must quote one number for tomorrow's count of block trades
          $Y$ in a stock, on a day when the news flag $X$ is on. On news days
          $Y$ is $1$ with probability $0.4$, $3$ with probability $0.35$ and
          $11$ with probability $0.25$. Whatever you quote, $c$, you are
          charged $(Y - c)^{2}$ once $Y$ is seen.
      - ask: >
          You quote the most likely count, $c = 1$. What is your expected
          charge?
        expects: "26.4"
        hint: >
          Weight each squared miss by its probability.
        feedback: >
          $0.4(0)^{2} + 0.35(2)^{2} + 0.25(10)^{2} = 0 + 1.4 + 25 = 26.4$.
          The rare $11$ supplies almost all of it: squared loss punishes the
          big miss far more than it rewards the frequent hit.
      - ask: >
          You quote $c = 3$ instead. What is your expected charge now?
        expects: "17.6"
        feedback: >
          $0.4(2)^{2} + 0.35(0)^{2} + 0.25(8)^{2} = 1.6 + 0 + 16 = 17.6$.
          Moving toward the $11$ cost a little on the $1$s and saved a lot on
          the $11$s.
      - ask: >
          Some quote does better than both. Which?
        choices:
          - text: >
              $c = 2$, halfway between the two common values
            feedback: >
              $0.4(1) + 0.35(1) + 0.25(81) = 21.0$, worse than $3$. The
              common values are not where the charge is coming from; the
              $11$ is.
          - text: >
              $c = 11$, so the expensive miss never happens
            feedback: >
              $0.4(100) + 0.35(64) + 0 = 62.4$. You traded one rare large
              miss for a frequent large miss, which is far worse.
          - text: >
              $c = 4.2$, the probability-weighted average of $Y$
            correct: true
            feedback: >
              $0.4(3.2)^{2} + 0.35(1.2)^{2} + 0.25(6.8)^{2} = 4.096 + 0.504 +
              11.56 = 16.16$. That is $\operatorname{Var}(Y \mid X = 1)$, and
              nothing beats it.
        feedback: >
          The mean $\mathbb{E}[Y \mid X = 1] = 0.4 + 1.05 + 2.75 = 4.2$ wins,
          even though $Y$ never takes the value $4.2$.
      - reflect: >
          The three charges were $26.4$ at $c = 1$, $17.6$ at $c = 3$ and
          $16.16$ at $c = 4.2$. Subtract $16.16$ from the first two and look
          at what is left. What rule gives the charge for any quote $c$, and
          why can nothing beat the mean?
        hint: >
          Compare each excess with the distance from $c$ to $4.2$.
        answer: >
          The excesses are $10.24 = 3.2^{2}$ and $1.44 = 1.2^{2}$: the charge
          is $\operatorname{Var}(Y \mid X = 1) + (4.2 - c)^{2}$. Writing
          $Y - c = (Y - m) + (m - c)$ with $m$ the conditional mean and
          squaring, the cross term has expectation $2(m - c)\,\mathbb{E}[Y -
          m] = 0$. The variance part ignores $c$ entirely, and the other part
          is zero only at $c = m$.

      - part: What the loss decides
        teach: >
          That is the supervised setup in miniature. $(X, Y)$ has a joint law
          $P$ you never see; you see $n$ draws from it, assumed independent,
          and choose a predictor $\hat f$ from some class $\mathcal{F}$ to make
          the risk $R(f) = \mathbb{E}[L(Y, f(X))]$ small on the next draw. The
          loss $L$ is chosen before any data arrive. Under squared loss the
          unbeatable predictor is $f^{*}(x) = \mathbb{E}[Y \mid X = x]$, the
          regression function, at every $x$ separately.
      - ask: >
          Same news-day counts, but now you are charged $|Y - c|$. Which quote
          is best?
        choices:
          - text: >
              $c = 4.2$, the mean, as before
            feedback: >
              $0.4(3.2) + 0.35(1.2) + 0.25(6.8) = 3.4$. Without the square,
              the $11$ no longer drags the answer up as hard, and the mean
              loses.
          - text: >
              $c = 3$, the median
            correct: true
            feedback: >
              $0.4(2) + 0 + 0.25(8) = 2.8$, the lowest available. Each step
              up from $1$ helps the $60\%$ of mass above and hurts the $40\%$
              below; past $3$, the $75\%$ at or below outweighs the rest. The
              median is where that balance flips.
          - text: >
              $c = 1$, the mode
            feedback: >
              $0 + 0.35(2) + 0.25(10) = 3.2$. Being exactly right $40\%$ of
              the time earns nothing extra under absolute loss.
        feedback: >
          Absolute loss is minimized by the conditional median. Change the
          loss and you change the quantity the model is estimating.
      - ask: >
          Now you are charged $1$ for any wrong quote and $0$ for an exact
          hit. What is the smallest expected charge you can achieve?
        expects: "0.6"
        hint: >
          The charge is the probability that you miss.
        feedback: >
          Quote the most likely value, $1$: you miss with probability
          $1 - 0.4 = 0.6$. Under $0$–$1$ loss the target is the mode, the
          quote that lost badly under squared loss.

      - part: Ignoring the feature
        ask: >
          On the $80\%$ of days with no news, $\mathbb{E}[Y \mid X = 0] = 2$.
          A colleague ignores $X$ and always quotes the overall mean,
          $0.8(2) + 0.2(4.2) = 2.44$. How much expected squared error, averaged
          over all days, does ignoring $X$ cost compared with quoting the right
          conditional mean on each kind of day?
        expects: "0.7744"
        tolerance: 0.0001
        hint: >
          On each kind of day the excess is the squared distance from $2.44$ to
          that day's conditional mean.
        feedback: >
          No-news days: $(2.44 - 2)^{2} = 0.1936$. News days: $(4.2 -
          2.44)^{2} = 3.0976$. Weighted: $0.8(0.1936) + 0.2(3.0976) = 0.15488 +
          0.61952 = 0.7744$. The feature is worth exactly the variance of the
          conditional mean across days.
      - ask: >
          In practice nobody tells you $P$; you have $500$ past days of
          $(x_i, y_i)$. Under squared loss, what is a fitted model trying to
          recover?
        choices:
          - text: >
              The average of all $500$ observed $y_i$
            feedback: >
              That is the colleague's $2.44$: a single number that throws away
              $X$. You just priced that mistake.
          - text: >
              A curve through every observed $(x_i, y_i)$
            feedback: >
              Two news days with counts $1$ and $11$ share $x = 1$; no function
              passes through both. Reproducing the sample is not the target.
          - text: >
              The function $x \mapsto \mathbb{E}[Y \mid X = x]$
            correct: true
            feedback: >
              Yes. The data are finitely many noisy draws, and the fit is an
              estimate of a conditional mean built from them.
        feedback: >
          Supervised learning under squared loss is estimating a conditional
          mean from a sample. How well a fit does that is judged on the next
          draw, not on the sample.

      - part: Where markets break the setup
        ask: >
          News days cluster: a news day is followed by another news day $70\%$
          of the time. Which part of the setup does that break?
        choices:
          - text: >
              The loss: squared error is wrong for clustered data
            feedback: >
              The loss is a choice about what you are paid for and is
              unaffected. The trouble is in how the data were generated.
          - text: >
              The independence of the $n$ draws
            correct: true
            feedback: >
              Today's $X$ tells you about tomorrow's. $500$ clustered days
              carry less information than $500$ independent ones, so the fit
              is noisier than its sample size suggests.
          - text: >
              Nothing: the conditional mean still exists, so the setup holds
            feedback: >
              $\mathbb{E}[Y \mid X]$ still exists, but the setup also assumes
              the training draws are independent, and that is false here.
        feedback: >
          Serial dependence is the first assumption market data break.
      - ask: >
          A year later, a vendor change makes the news flag fire on routine
          filings, and the news-day mean count falls from $4.2$ to $2.6$.
          What is a model fitted on last year's data now estimating?
        choices:
          - text: >
              The current $\mathbb{E}[Y \mid X = 1]$, only with more noise
            feedback: >
              More data from the old law does not average toward the new one.
              Its target is still $4.2$, which is simply wrong now.
          - text: >
              A conditional mean under a law that no longer holds
            correct: true
            feedback: >
              The setup assumes the draw you are scored on comes from the same
              $P$ as the training draws. When $P$ drifts, a perfect estimate of
              the old $f^{*}$ is a biased forecast of the new one.
          - text: >
              The median, because the distribution has shifted
            feedback: >
              The loss, not the data, decides which summary is the target.
              Squared loss still targets a mean; it is the wrong year's mean.
        feedback: >
          When asked what a model estimates, say it in one breath: under
          squared loss, the conditional mean of $Y$ given $X$, under a joint
          law assumed fixed and sampled independently, and in markets both
          halves of that assumption are suspect.

  - node: quant-statistics.learning.generalization-gap
    hook: >
      The number printed at the end of a training run is not an estimate of
      anything you'll be paid on; interviewers ask you to say precisely why
      it's optimistic and by how much.
    explanation: >
      Empirical risk $\hat R(f)=\frac{1}{n}\sum_i L(y_i,f(x_i))$ is what
      fitting minimizes; risk $R(f)$ on a fresh draw is what you actually get
      scored on. The two differ because the same data chose $\hat f$ and then
      graded it — $\hat f$ was built to look good on exactly the points used
      to measure it.

      The exact size of that optimism, $\mathbb{E}[R-\hat R] =
      \frac{2}{n}\sum_i \operatorname{Cov}(\hat y_i, y_i)$, says the gap
      grows with how strongly each fitted value tracks its own target — that
      covariance is "peeking" made precise. For a linear fit with $p$ free
      parameters and noise variance $\sigma^{2}$ this collapses to
      $2p\sigma^{2}/n$: each parameter spent buys back a fixed, computable
      amount of fake accuracy.

      The pattern generalizes past linear models: any procedure that chooses
      parameters using the same data it is later scored on inflates its
      apparent performance, and the fix is always to score on data the
      choice never touched.
    worked: >
      A linear model with $p=5$ parameters is fit on $n=50$ observations
      with noise variance $\sigma^{2}=4$. The expected optimism is
      $2(5)(4)/50 = 40/50 = 0.8$: on average, true out-of-sample MSE exceeds
      the training MSE by $0.8$, purely from the act of fitting on the data
      being scored.
    interview: >
      "How much does your in-sample Sharpe overstate the real number?" wants
      the qualitative claim — training error is a biased report, never
      neutral — plus, for a linear model, the exact $2p\sigma^{2}/n$
      correction named on request.
    pitfalls: >
      Quoting training-set error (or in-sample R-squared) as if it were a
      performance estimate. Assuming a "simple-looking" final model has zero
      optimism when every step that chose its form — feature search,
      architecture, hyperparameters — already spent some.
    recap: >
      Training error understates true error by an amount that grows with
      parameters spent and shrinks like $1/n$: it is a biased number, not a
      neutral one.
    dialogue:
      - part: A fit that grades itself
        teach: >
          A signal is pure noise: next-day return $Y$, in basis points, has
          true mean $0$ and variance $9$, independently each day. A researcher
          does not know that. She has three days, $-2$, $1$ and $4$, and fits
          the best constant predictor by least squares.
      - ask: >
          What constant does she fit?
        expects: "1"
        feedback: >
          The least-squares constant is the sample mean, $(-2 + 1 + 4)/3 =
          1$.
      - ask: >
          What is her training error, the mean squared error of that constant
          on her three days?
        expects: "6"
        feedback: >
          $((-3)^{2} + 0^{2} + 3^{2})/3 = 18/3 = 6$.
      - ask: >
          What is the expected squared error of her constant on a fresh day?
        expects: "10"
        hint: >
          A fresh $Y$ has mean $0$ and variance $9$, and she predicts $1$.
        feedback: >
          $\mathbb{E}[(Y - 1)^{2}] = \operatorname{Var}(Y) + (0 - 1)^{2} = 9 +
          1 = 10$. She reports $6$ and will be paid on $10$.
      - ask: >
          Her training error, $6$, is below $9$, yet no constant can score
          below $9$ on a fresh day. What explains it?
        choices:
          - text: >
              Her three days happened to be unusually calm.
            feedback: >
              Luck moves the number around, but not on average: across all
              possible three-day samples her expected training error is
              $\tfrac{2}{3}(9) = 6$, still below $9$. Something systematic is
              at work.
          - text: >
              The constant was chosen to sit in the middle of these three
              points, so it is closer to them than to any fresh point.
            correct: true
            feedback: >
              The fitted value moved toward the data it was then graded on.
              A fresh day had no say in where the constant landed, so it gets
              no such favour.
          - text: >
              Squared error is the wrong loss for returns.
            feedback: >
              The loss is not the problem; any loss gives the same pattern.
              The problem is which data did the grading.
        feedback: >
          Averaged over samples, her training error is $6$ and her fresh error
          is $9(1 + 1/3) = 12$. The gap is systematic, not bad luck.
      - reflect: >
          Before any formula: why must training error be optimistic on
          average, for any fitting procedure, and what would make a reported
          number honest?
        answer: >
          Fitting chooses the parameters that make the loss small on the
          training points, so those points are scored by a model that was
          tuned to them; part of what looks like fit is the model bending
          toward their noise. A fresh draw's noise was not available to bend
          toward. The only honest score is one computed on data that played no
          part in the choice.

      - part: The gap, named and sized
        teach: >
          The training error is the empirical risk $\hat R(f) = \frac{1}{n}
          \sum_i L(y_i, f(x_i))$; the error on a fresh draw is the risk $R(f)$.
          Their difference at the fitted model, $R(\hat f) - \hat R(\hat f)$, is
          the generalization gap. For squared loss its expected size is exact:
          $\mathbb{E}[R - \hat R] = \frac{2}{n} \sum_i \operatorname{Cov}(\hat
          y_i, y_i)$, where $\hat y_i$ is the fitted value at training point
          $i$. The covariance measures how much each fitted value follows its
          own target.
      - ask: >
          For the constant fit, $\hat y_1 = (y_1 + y_2 + y_3)/3$. With the days
          independent and each of variance $9$, what is $\operatorname{Cov}(\hat
          y_1, y_1)$?
        expects: "3"
        hint: >
          Only the $y_1$ inside the average covaries with $y_1$.
        feedback: >
          $\operatorname{Cov}(y_1/3, y_1) = 9/3 = 3$. The other two days are
          independent of $y_1$ and contribute nothing.
      - ask: >
          Every $\hat y_i$ has the same covariance with its own $y_i$. What
          expected optimism does $\frac{2}{n} \sum_i \operatorname{Cov}(\hat
          y_i, y_i)$ give?
        expects: "6"
        feedback: >
          $\frac{2}{3}(3 + 3 + 3) = 6$, exactly the $12 - 6$ you found by
          averaging. A constant is a linear fit with $p = 1$ parameter, and in
          general a linear fit with $p$ parameters and noise variance
          $\sigma^{2}$ has optimism $2p\sigma^{2}/n$: here $2(1)(9)/3 = 6$.
          Each parameter spent buys $2\sigma^{2}/n$ of fake accuracy.

      - part: Correcting a reported number
        ask: >
          A linear factor model with $p = 8$ parameters is fitted on $n = 120$
          days with noise variance $\sigma^{2} = 1.5$, and reports a training
          MSE of $1.35$. What out-of-sample MSE should you expect?
        expects: "1.55"
        hint: >
          Add the expected optimism to the training number.
        feedback: >
          Optimism $= 2(8)(1.5)/120 = 24/120 = 0.2$, so expect about $1.35 +
          0.2 = 1.55$.
      - ask: >
          The researcher wants to halve that $0.2$ of optimism without touching
          the model. What does the formula say she needs?
        choices:
          - text: >
              Half the noise variance, by cleaning the data harder
            feedback: >
              Halving $\sigma^{2}$ would do it on paper, but noise in returns
              is not something cleaning removes. It is the one input she
              cannot choose.
          - text: >
              Twice as many days, $n = 240$
            correct: true
            feedback: >
              $2(8)(1.5)/240 = 0.1$. Optimism shrinks like $1/n$: more data
              per parameter is the only lever that does not change the model.
          - text: >
              Four times as many days, since errors scale like $1/\sqrt{n}$
            feedback: >
              Standard errors scale like $1/\sqrt{n}$; this bias scales like
              $1/n$. Doubling $n$ is enough.
        feedback: >
          Parameters in the numerator, sample size in the denominator: the
          ratio $p/n$ is what sets how much a training number lies.
      - ask: >
          Suppose the $8$ factors were the best $8$ out of $60$ the researcher
          screened on these same $120$ days. Is $0.2$ still the expected
          optimism?
        choices:
          - text: >
              Yes: the final model has $8$ parameters, so $p = 8$.
            feedback: >
              The formula counts what the data were allowed to choose. Here
              the data chose which $8$ of $60$ factors to keep as well as
              their coefficients, and that choice was also made to look good
              on these $120$ days.
          - text: >
              No: the screening also used the data, so the true optimism is
              larger.
            correct: true
            feedback: >
              Each fitted value now tracks its own target through the
              selection as well as the fit, which raises the covariances.
              Every decision made after looking at the data spends some of
              it.
          - text: >
              No: it is smaller, because screening kept only real factors.
            feedback: >
              Screening keeps the factors that looked best on this sample,
              real or lucky. It cannot tell the two apart using the same
              data, so it adds optimism rather than removing it.
        feedback: >
          In an interview, say it plainly: training error is a biased report,
          optimistic by about $2p\sigma^{2}/n$ for an honest linear fit and by
          more when the specification itself was searched.

  - node: quant-statistics.learning.overfitting
    hook: >
      Perfect training fit should make you suspicious, not pleased — the
      interview question "why is zero training error a red flag" is asking
      you to name exactly what's been memorized.
    explanation: >
      A model overfits when it reproduces structure that lives in the
      training sample but not in $P$: noise treated as signal. The tell is a
      widening gap as flexibility rises — training error keeps falling while
      held-out error turns and climbs — and what drives it is capacity in the
      widest sense: parameters, depth, features searched, and every choice
      made after looking at the data.

      Take four points $(1,2),(2,5),(3,5),(4,9)$ — a noisy version of a
      roughly linear trend. A cubic (four coefficients, four points) passes
      through all of them exactly, zero training error. Evaluated at $x=5$ it
      gives $24$, wildly above the roughly $10$ a linear extrapolation would
      suggest: the extra flexibility didn't recover more signal, it
      memorized the noise in these four points and extrapolated that noise.

      What defends against this is sample size relative to capacity, because
      in return prediction the signal is a tiny fraction of total variance —
      a flexible fit is mostly fitting noise by construction whenever data is
      scarce relative to how much the model can bend.
    worked: >
      For $(1,2),(2,5),(3,5),(4,9)$, Newton's divided differences give the
      interpolating cubic $p(x)=2+3(x-1)-1.5(x-1)(x-2)+\frac{7}{6}(x-1)(x-2)(x-3)$,
      which reproduces all four $y$-values exactly. At $x=5$: $p(5) =
      2+3(4)-1.5(4)(3)+\frac{7}{6}(4)(3)(2) = 2+12-18+28 = 24$ — a wild
      extrapolation from four points with zero training error and no
      predictive content.
    interview: >
      "Why does perfect training fit worry you?" wants capacity-versus-data
      named directly, plus the widening-gap shape on a held-out curve, not
      just "it might not generalize."
    pitfalls: >
      Equating low training error with a good model. Assuming overfitting
      needs literally many parameters — a data-driven choice of which three
      features to use out of three hundred already spends capacity, even
      though the final model looks small.
    recap: >
      Overfitting is fitting the sample instead of the population; the
      culprit is capacity relative to data, and its signature is training
      error falling while held-out error rises.
    dialogue:
      - part: Three points and two curves
        teach: >
          A trader has three readings of order imbalance $x$ against the next
          hour's move $y$: $(-1, 1)$, $(0, -1)$ and $(1, 3)$. Two fits are on
          the table: the least-squares line $\hat y = 1 + x$, and the parabola
          through all three points, $\hat y = 3x^{2} + x - 1$.
      - ask: >
          What is the line's training MSE on the three points?
        expects: "2"
        feedback: >
          Residuals $1 - 0 = 1$, $-1 - 1 = -2$ and $3 - 2 = 1$; squared and
          averaged, $(1 + 4 + 1)/3 = 2$. The parabola's training MSE is $0$.
      - ask: >
          The next reading comes in at $x = 2$. What does the parabola
          predict?
        expects: "13"
        feedback: >
          $3(4) + 2 - 1 = 13$. The line predicts $1 + 2 = 3$.
      - ask: >
          Suppose the truth is $y = 1 + x$ plus noise of variance $2$, so the
          line happens to be exactly right. What is the parabola's expected
          squared error at $x = 2$?
        expects: "102"
        hint: >
          Squared distance from the truth, plus the noise no forecast avoids.
        feedback: >
          $(13 - 3)^{2} + 2 = 102$, against the line's $0 + 2 = 2$. Zero
          training error bought a fifty-fold worse forecast.
      - ask: >
          What did the parabola's extra coefficient, the $3x^{2}$, actually
          fit?
        choices:
          - text: >
              Real curvature in how imbalance moves prices
            feedback: >
              The truth here is a straight line; there is no curvature to find.
              Three points cannot tell curvature from noise, and the parabola
              did not try.
          - text: >
              The particular noise in these three points
            correct: true
            feedback: >
              The middle point sat $2$ below the line by chance, and the
              $x^{2}$ term bent the curve to reach it. On the next draw that
              noise is gone and the bend remains.
          - text: >
              Nothing harmful: it only changes predictions between the points
            feedback: >
              It changed the prediction at $x = 2$ from $3$ to $13$. A term
              chosen to reach noisy points distorts the curve everywhere,
              most of all outside the data.
        feedback: >
          Three parameters through three points can match anything, so the
          match tells you nothing about the law that produced them.

      - part: The two error columns part ways
        teach: >
          A desk fits polynomials of rising degree to a larger sample and
          scores each on held-out data. Degree $1$: training MSE $1.10$,
          held-out $1.15$. Degree $3$: $0.95$ and $1.05$. Degree $6$: $0.70$
          and $1.30$. Degree $9$: $0.40$ and $2.10$.
      - ask: >
          Which degree would you deploy?
        expects: "3"
        feedback: >
          Degree $3$ has the lowest held-out error, $1.05$. Degree $9$ has the
          best training error and the worst held-out error.
      - reflect: >
          Describe what the two columns do as the degree rises, and say what
          the model is doing in the range where they separate.
        answer: >
          Training error falls at every step, because each added coefficient
          can only help on the data it was fitted to. Held-out error falls,
          bottoms out at degree $3$, then rises. Past that point the extra
          flexibility is spent reproducing quirks of this sample that the
          held-out data do not share, so the gap between the columns widens
          from $0.10$ to $1.70$. That is overfitting.
      - teach: >
          A model overfits when it reproduces structure that is in the
          training sample but not in the law $P$ that generated it: noise
          memorized as signal. The signature is the widening gap you just
          described. A polynomial of degree $n - 1$ through $n$ points with
          distinct $x$ always has zero training error, whatever the data. The
          driver is capacity measured against sample size.

      - part: What counts as capacity
        ask: >
          Which of these does *not* add to the capacity a researcher spends on
          one dataset?
        choices:
          - text: >
              Trying $50$ lookback windows and keeping the best
            feedback: >
              The final model has one lookback, but the data chose it out of
              $50$. Selection is fitting, and it spends capacity.
          - text: >
              Collecting two more years of the same data
            correct: true
            feedback: >
              More data is the defence, not the disease: the same model now
              has more points to answer to and less room to bend toward any
              one of them.
          - text: >
              Dropping the outliers that hurt the fit most
            feedback: >
              Removing points because they disagree with the model fits the
              data to the model. It is a modelling choice made after looking.
          - text: >
              Letting a tree grow one level deeper
            feedback: >
              Each extra level doubles the number of leaves that can be tuned
              to the sample. Depth is capacity.
        feedback: >
          Capacity is every degree of freedom the data were allowed to set:
          coefficients, depth, features searched, and choices made after
          seeing the results.
      - ask: >
          A sample has $25$ points with distinct $x$ values. What is the
          lowest polynomial degree guaranteed to fit all of them exactly?
        expects: "24"
        feedback: >
          Degree $24$ has $25$ coefficients, one per point, so it can be made
          to pass through all of them. Its zero training error certifies
          nothing.

      - part: Why returns make it worse
        ask: >
          In a return series, suppose the best possible model explains $1\%$
          of the variance and the rest is noise. A flexible model reports a
          training $R^{2}$ of $30\%$. At least what fraction of the total
          variance has it fitted out of noise?
        expects: "0.29"
        hint: >
          At most $0.01$ of what it explains can be signal.
        feedback: >
          At most $0.01$ is signal, so at least $0.30 - 0.01 = 0.29$ of the
          variance it claims to explain is memorized noise, which will not
          recur out of sample.
      - ask: >
          Why does a weak signal make overfitting worse rather than merely
          harder to see?
        choices:
          - text: >
              Weak signals are nonlinear, so flexible models are needed.
            feedback: >
              Weakness is about size, not shape. A weak linear signal is still
              weak, and flexibility does not make it stronger.
          - text: >
              Almost all the variation a flexible model can chase is noise, so
              almost everything it learns beyond the signal is noise.
            correct: true
            feedback: >
              When signal is $1\%$ of variance, any capacity left over after
              capturing it has only noise to spend itself on.
          - text: >
              It does not: a weak signal just needs more parameters to find.
            feedback: >
              More parameters give the model more room to bend, and with $99\%$
              of the variance being noise, that room is filled with noise. A
              weak signal calls for fewer degrees of freedom, not more.
        feedback: >
          Asked why perfect training fit worries you, name capacity against
          sample size, the held-out curve turning upward, and the fact that in
          returns most of what a model can fit is noise.

  - node: quant-statistics.learning.bias-variance
    hook: >
      This decomposition gets recited constantly and derived rarely — being
      able to show where the cross terms die is the difference between
      reciting it and actually understanding what regularization buys you.
    explanation: >
      Write $Y-\hat f(x) = \varepsilon + (f(x)-\mathbb{E}_D[\hat f(x)]) +
      (\mathbb{E}_D[\hat f(x)]-\hat f(x))$: irreducible noise, a fixed bias
      term, and a deviation of $\hat f(x)$ around its own average over
      training sets $D$. Squaring and taking expectation over both
      $\varepsilon$ and $D$, every cross term vanishes — $\varepsilon$ is
      centred and independent of $D$, and the third piece is centred around
      $\mathbb{E}_D[\hat f(x)]$ by construction — leaving exactly $\sigma^{2}
      + \text{bias}^{2} + \text{variance}$, the same decomposition already
      seen for a scalar estimator's mean squared error, applied pointwise to
      a prediction.

      $\sigma^{2}$ is a hard floor no model reaches under. Only bias and
      variance answer to modelling, and they move in opposite directions as
      flexibility changes — which is exactly why zero training error in the
      overfitting example is worthless: it drove bias toward zero by paying
      an enormous variance bill.

      The decomposition also settles a common confusion: an unbiased
      estimator is not automatically preferred, because a small amount of
      bias can buy a large amount of variance reduction.
    worked: >
      At a point with true value $f(x)=10$ and noise variance $\sigma^{2}=4$:
      estimator A always predicts $8$ (bias $=-2$, variance $=0$), giving MSE
      $= 4 + 4 + 0 = 8$. Estimator B is unbiased but has variance $5$, giving
      MSE $=4+0+5=9$. The biased estimator A wins on MSE — trading a little
      bias for a lot of variance reduction paid off.
    interview: >
      "Derive the bias-variance decomposition" or "why does regularization
      help at all" wants the cross-term cancellation shown, and the
      conclusion that only two of the three terms are addressable by
      modelling.
    pitfalls: >
      Forgetting the irreducible term and claiming a model can reach zero
      error. Assuming unbiasedness is always preferable — MSE can and does
      favor a biased estimator with lower variance. Confusing this
      population-level decomposition (which needs re-drawing $D$) with a
      single fitted model's error on one dataset.
    recap: >
      Prediction error splits into irreducible noise plus squared bias plus
      variance; only the last two are addressable, and they trade against
      each other as flexibility changes.
    dialogue:
      - part: Two training sets, one test point
        teach: >
          At a fixed input $x$ the true value is $f(x) = 5$, and a fresh $Y$
          there is $4$ or $6$ with equal chance: noise of variance $1$. Your
          model's prediction at $x$ depends on which training set history
          handed you. With one equally likely training set it predicts $4$;
          with the other it predicts $8$.
      - ask: >
          Averaging over both the training set and the fresh $Y$, what is the
          expected squared prediction error $\mathbb{E}[(Y - \hat f(x))^{2}]$?
        expects: "6"
        hint: >
          Four equally likely pairs of (prediction, $Y$).
        feedback: >
          Prediction $4$: errors $0$ and $4$. Prediction $8$: errors $16$ and
          $4$. Average of $0, 4, 16, 4$ is $24/4 = 6$.
      - ask: >
          What is the variance of the prediction $\hat f(x)$ across the two
          training sets?
        expects: "4"
        feedback: >
          The predictions $4$ and $8$ average to $6$, each $2$ away, so the
          variance is $2^{2} = 4$.
      - reflect: >
          The noise accounts for $1$ of the $6$ and the wobble of the
          prediction across training sets for $4$. What accounts for the
          remaining $1$? And why would these pieces simply add, with nothing
          left over from their interactions?
        hint: >
          Compare the average prediction with the truth.
        answer: >
          The average prediction is $6$ and the truth is $5$: a systematic
          miss of $1$, squared, is $1$. The error $Y - \hat f(x)$ splits into
          the noise $\varepsilon$, the fixed miss $f(x) - \mathbb{E}[\hat
          f(x)]$, and the prediction's deviation from its own average. The
          noise is centred and has nothing to do with which training set you
          got; the deviation is centred by construction. So every product of
          two different pieces averages to zero, and only the three squares
          survive.
      - teach: >
          That is the bias–variance decomposition. With $Y = f(x) +
          \varepsilon$, $\mathbb{E}[\varepsilon] = 0$, $\operatorname{Var}
          (\varepsilon) = \sigma^{2}$ and $\varepsilon$ independent of the
          training set $D$: $\mathbb{E}[(Y - \hat f(x))^{2}] = \sigma^{2} + (f(x)
          - \mathbb{E}_D[\hat f(x)])^{2} + \operatorname{Var}_D(\hat f(x))$.
          Noise, squared bias, variance: $1 + 1 + 4 = 6$. It is the
          mean-squared-error split of a scalar estimator, with the noise of the
          fresh draw added on.

      - part: Where the cross terms die
        ask: >
          One cross term is $2(f(x) - \mathbb{E}_D[\hat f(x)])(\mathbb{E}_D[\hat
          f(x)] - \hat f(x))$. Why does its expectation vanish whatever the
          noise does?
        choices:
          - text: >
              Because the bias is small here
            feedback: >
              The argument never uses the size of the bias. A bias of $100$
              gives a cross term that still averages to zero.
          - text: >
              Because the first factor is a constant and the second averages
              to zero over training sets
            correct: true
            feedback: >
              $5 - 6 = -1$ is fixed, and $6 - \hat f(x)$ is $+2$ or $-2$ with
              equal chance. A constant times a centred quantity has mean zero.
          - text: >
              Because squared loss treats positive and negative errors alike
            feedback: >
              Squared loss is what produced the cross terms in the expansion.
              It cannot also be what removes them.
        feedback: >
          That cross term dies by definition of the average prediction. The
          two involving $\varepsilon$ need the assumption about the noise.
      - ask: >
          Now break that assumption. Suppose the same noise that hits the test
          $Y$ also shaped the training data: the model predicts $4$ exactly
          when $Y = 4$, and $8$ exactly when $Y = 6$, each half the time. What
          is the expected squared error now?
        expects: "2"
        feedback: >
          Two equally likely cases: $(4 - 4)^{2} = 0$ and $(6 - 8)^{2} = 4$, so
          $2$. Bias is still $1$ and variance still $4$, yet the error is $2$,
          not $6$.
      - ask: >
          Which term of the expansion stopped vanishing?
        choices:
          - text: >
              $2\,\mathbb{E}[\varepsilon\,(\mathbb{E}_D[\hat f(x)] - \hat
              f(x))]$, noise times deviation
            correct: true
            feedback: >
              When $\varepsilon = -1$ the deviation is $6 - 4 = 2$; when
              $\varepsilon = +1$ it is $6 - 8 = -2$. Both products are $-2$, so
              the term is $2(-2) = -4$, and $6 - 4 = 2$.
          - text: >
              The bias–deviation term
            feedback: >
              The predictions still average to $6$, so the deviation is still
              centred and that term still dies, as you just argued.
          - text: >
              None: the bias changed
            feedback: >
              The average prediction is $6$ in both setups, so the bias is
              $1$ in both. What changed is that the prediction now moves with
              the noise.
        feedback: >
          A model that has seen the test point's noise looks better than it
          is. That is the generalization gap again, now as the cross term the
          independence assumption exists to kill.

      - part: Paying in bias to cut variance
        ask: >
          Back to the honest setup. A rigid model ignores the training data
          and always predicts $6.5$ at $x$. What is its expected squared
          error?
        expects: "3.25"
        hint: >
          Its variance across training sets is zero.
        feedback: >
          Noise $1$, bias $(5 - 6.5)^{2} = 2.25$, variance $0$: total $3.25$.
          It beats the $6$ of the model that learns from data.
      - ask: >
          What is the smallest expected squared error any model, however
          clever, can achieve at this $x$?
        expects: "1"
        feedback: >
          Bias and variance can both be driven to zero only by a model that
          predicts exactly $5$ every time. The noise term $\sigma^{2} = 1$
          stays: it is a floor, not a modelling failure.
      - ask: >
          You make a model family more flexible. What usually happens at a
          fixed $x$?
        choices:
          - text: >
              Bias and variance both fall, since a better model fits better
            feedback: >
              The data-fitting model above had bias $1$ and variance $4$; the
              rigid one had more bias and no variance. Flexibility lets the
              fit follow the sample, and the sample changes from draw to draw.
          - text: >
              Bias falls and variance rises
            correct: true
            feedback: >
              A flexible fit can reach the truth on average, and it also
              follows each training set's noise, so its predictions spread.
          - text: >
              The noise term falls, because the model explains more of $Y$
            feedback: >
              $\sigma^{2}$ belongs to the fresh draw, which no model touches.
              What looks like explained noise in training is variance
              waiting to show up out of sample.
        feedback: >
          Only two of the three terms answer to modelling, and they pull in
          opposite directions. In an interview, write the three-way split,
          say which cross terms die and why, and add that a biased model can
          win.

  - node: quant-statistics.learning.complexity-dial
    hook: >
      "Why don't you just use the most flexible model available?" is asked
      constantly, and the U-shaped answer — plus knowing which way weak
      signal pushes it — is the entire mental model.
    explanation: >
      Since only bias-squared and variance are addressable, and they move in
      opposite directions as capacity rises, held-out error as a function of
      the complexity dial is U-shaped: it falls while bias reduction
      dominates, then rises once variance takes over. The optimum sits where
      the marginal bias reduction from one more unit of complexity stops
      paying for the marginal variance it costs — a cost-benefit balance, not
      a fixed setting.

      Two things move that balance. More data shrinks variance at any fixed
      bias, so the optimal dial setting drifts toward more complexity as $n$
      grows — the same capacity that overfit at $n=4$ can be earned back at
      $n=4000$. A low signal-to-noise ratio does the opposite: when the true
      signal is a small share of total variance, extra flexibility mostly
      buys variance with almost no real bias left to reduce, so the marginal
      cost outweighs the marginal benefit almost immediately and the optimum
      sits far toward simplicity.
    worked: >
      Comparing tree depths $1$, $3$, $5$ on a weak-signal problem (noise
      floor $\sigma^{2}=1$): squared bias falls as depth grows ($0.20$,
      $0.05$, $0.01$) while variance climbs ($0.02$, $0.10$, $0.30$). Total
      held-out error is $1.22$, $1.15$, $1.31$ — the minimum sits at depth
      $3$, not at the deepest tree available.
    interview: >
      "How do you pick model complexity?" or "why do three features often
      beat three hundred in trading research?" wants the U-shape named along
      with the signal-to-noise argument for why the optimum sits far left
      when the signal is weak.
    pitfalls: >
      Assuming more data always favors more complexity without checking
      signal-to-noise. Trying to locate the optimum from the training curve
      alone — training error is monotonically falling, never U-shaped;
      finding the dial needs held-out error.
    recap: >
      Held-out error is U-shaped in complexity; more data pushes the optimum
      toward complexity, weak signal pushes it hard toward simplicity.
    dialogue:
      - part: A dial with five settings
        teach: >
          A researcher can feed a linear return model $k = 1, 2, 4, 8$ or $16$
          features, added in order of prior conviction. On $n = 50$
          observations with noise variance $\sigma^{2} = 1$, the squared bias
          at a typical point is about $0.32/k$ and the variance of the fit is
          about $\sigma^{2}k/n = 0.02k$.
      - ask: >
          Before computing anything: as $k$ runs from $1$ to $16$, what shape
          will held-out error trace?
        choices:
          - text: >
              Falling all the way, since each feature can only add information
            feedback: >
              That is the training curve. Held-out error also pays the
              variance term, which grows with $k$.
          - text: >
              Falling, bottoming out, then rising
            correct: true
            feedback: >
              Bias shrinks like $1/k$ while variance grows like $k$. One wins
              early and the other wins late.
          - text: >
              Rising all the way, since every feature adds variance
            feedback: >
              At $k = 1$ the squared bias is $0.32$, sixteen times the
              variance. Early features buy far more bias reduction than they
              cost.
        feedback: >
          Held-out error is $\sigma^{2} + 0.32/k + 0.02k$: a floor plus a
          falling piece plus a rising piece.
      - ask: >
          Which $k$ gives the lowest held-out error?
        expects: "4"
        hint: >
          Tabulate $0.32/k + 0.02k$ for the five settings.
        feedback: >
          $0.34$, $0.20$, $0.16$, $0.20$, $0.34$ for $k = 1, 2, 4, 8, 16$. The
          minimum is at $k = 4$, where squared bias and variance are both
          $0.08$.
      - ask: >
          What is the held-out MSE at $k = 4$?
        expects: "1.16"
        feedback: >
          $1 + 0.08 + 0.08 = 1.16$, against $1.34$ at either end. The whole U
          sits on top of a noise floor of $1$ that no setting touches.

      - part: More data moves the bottom
        ask: >
          The desk collects nine times the data, $n = 450$, so the variance
          becomes $k/450$ and the squared bias is unchanged. Treating $k$ as
          continuous, where does $0.32/k + k/450$ bottom out?
        expects: "12"
        hint: >
          At the minimum the two pieces are equal.
        feedback: >
          Setting the derivative $-0.32/k^{2} + 1/450$ to zero gives $k^{2} =
          0.32(450) = 144$, so $k = 12$. With $n = 50$ the same calculation
          gives $k^{2} = 16$ and $k = 4$.
      - reflect: >
          Nine times the data tripled the best setting rather than
          multiplying it by nine. Why does more data push the dial toward
          complexity, and what sets how far it moves?
        answer: >
          More data shrinks the variance at every setting while leaving the
          bias where it was, so each extra feature costs less and the balance
          point moves right. The optimum sits where the marginal bias
          reduction $0.32/k^{2}$ equals the marginal variance $\sigma^{2}/n$,
          so $k^{*} = \sqrt{0.32\,n/\sigma^{2}}$: it grows like $\sqrt{n}$, and
          it depends on signal against noise, not on either alone.
      - teach: >
          This is the complexity dial. Most model families have one knob that
          trades bias for variance: polynomial degree, tree depth, feature
          count, or the inverse penalty $1/\lambda$. Held-out error is
          U-shaped along it, and the best setting is where one more notch of
          bias reduction stops paying for the variance it adds. More data
          moves that setting right.

      - part: Weak signal moves it back
        ask: >
          Now the signal is ten times weaker, so the squared bias is
          $0.032/k$, with $n = 50$ and $\sigma^{2} = 1$ as at the start. Among
          $k = 1, 2, 4, 8, 16$, which is best?
        expects: "1"
        hint: >
          The variance is still $0.02k$.
        feedback: >
          $k = 1$: $0.032 + 0.02 = 0.052$. $k = 2$: $0.016 + 0.04 = 0.056$.
          Larger $k$ is worse still. With little signal to recover, the second
          feature already costs more than it buys.
      - ask: >
          A colleague objects: the noise floor $\sigma^{2}$ is the same at
          every setting, so it cannot affect where the minimum is. What is
          wrong with that?
        choices:
          - text: >
              Nothing; only the bias and variance curves locate the minimum.
            feedback: >
              True of the floor term itself, but $\sigma^{2}$ also sits inside
              the variance, $\sigma^{2}k/n$. Raise it tenfold to $0.2k$ with
              the original bias $0.32/k$ and the continuous optimum falls
              from $4$ to $\sqrt{1.6} \approx 1.3$.
          - text: >
              Noise also scales the variance term, so more noise makes each
              feature dearer.
            correct: true
            feedback: >
              The fit chases noise in proportion to how much noise there is.
              Ten times the noise with the same signal moves the optimum
              exactly as ten times less signal with the same noise did.
          - text: >
              It is wrong only when the noise is non-Gaussian.
            feedback: >
              The distribution's shape never entered. $\sigma^{2}$ enters
              through the variance of the fit, Gaussian or not.
        feedback: >
          Signal-to-noise and sample size together set the dial. In return
          prediction the signal is a sliver of the variance, which pins the
          optimum far to the left: a handful of features, not hundreds.

      - part: Reading the dial from the wrong curve
        ask: >
          A junior researcher sets the dial where the training error stops
          falling noticeably. What goes wrong?
        choices:
          - text: >
              Nothing, as long as the training set is large
            feedback: >
              A larger sample shrinks the distortion but does not remove it:
              training error falls at every notch and has no bottom to find.
          - text: >
              Training error keeps falling with complexity, so its elbow
              ignores the variance term entirely.
            correct: true
            feedback: >
              Only held-out error pays the variance bill. Its minimum, not the
              training curve's flattening, is the setting to use.
          - text: >
              The elbow is always to the left of the optimum, so it is merely
              conservative
            feedback: >
              The elbow can sit anywhere. In the weak-signal case it can sit
              well to the right of $k = 1$, where held-out error is already
              rising.
        feedback: >
          Asked why not use the most flexible model, draw the U on held-out
          error, then say which way more data and weaker signal push its
          bottom.

  - node: quant-statistics.learning.train-val-test
    hook: >
      Saying "I have a train/test split" without being able to say what each
      set is for, or why reopening the test set breaks it, is the single
      fastest way to lose credibility in this part of an interview.
    explanation: >
      Three disjoint roles, not three arbitrary piles. Training fits
      parameters at one fixed configuration. Validation scores several
      configurations against each other and picks a winner. Test is opened
      exactly once, after every decision is frozen, to report a number
      nobody chose anything against.

      The rule that matters follows straight from how training error was
      shown to be biased: any data used to make a decision has been spent.
      Peek at the test set, retune, rescore, and it has quietly become a
      second validation set — its error is now optimistic by exactly the
      amount you tuned against it, the same mechanism, one level up.

      A common allocation is $60/20/20$, tilted toward training when $n$ is
      small, because a small training slice means high-variance parameter
      estimates and little can be spared for scoring.
    worked: >
      With $n=1000$ split $600/200/200$: fit five candidate models on the
      $600$ training points, pick the winner using the $200$ validation
      points (best validation MSE $1.05$), then evaluate that one frozen
      model once on the $200$ test points, getting test MSE $1.09$ — the
      honest number. Averaging validation and test together and using that
      combined number to retune would report something like MSE $0.98$: a
      lower number bought by contaminating the one slice meant to stay
      untouched.
    interview: >
      "Walk me through your train/val/test setup" listens for validation
      being where hyperparameters are chosen and test being opened once — not
      "we tried a few things on the test set to see."
    pitfalls: >
      Using the test set to choose between models — that's what validation
      is for. Making a "quick tweak" after seeing test performance and
      reporting the same number as if it were still honest. Tuning
      hyperparameters directly against the test set, skipping validation
      entirely.
    recap: >
      Fit on training, choose on validation, report on test — and the test
      number is only honest while it stays unopened until every decision is
      frozen.
    dialogue:
      - part: The winner of a beauty contest
        teach: >
          Five candidate models are fitted, and unknown to anyone they are
          equally good: each has true out-of-sample MSE $1.00$. Each is scored
          on the same $200$ held-out points, and the scores come back $0.97$,
          $1.02$, $0.94$, $1.05$ and $0.99$. You deploy the one that scored
          $0.94$.
      - ask: >
          What MSE should you expect from the deployed model on new data?
        expects: "1"
        feedback: >
          $1.00$, like every other candidate. The $0.94$ was that model's
          noise on these $200$ points being kind.
      - ask: >
          So what does the $0.94$ measure?
        choices:
          - text: >
              The deployed model's out-of-sample error, since the $200$ points
              were not used for fitting
            feedback: >
              They were not used to fit coefficients, but they were used to
              choose the model. A score that picked the winner is the
              smallest of five noisy numbers, and the smallest is biased low.
          - text: >
              The best of five noisy scores, which is optimistic
            correct: true
            feedback: >
              On average the minimum of five noisy estimates of $1.00$ sits
              below $1.00$. Choosing on these points spent them.
          - text: >
              Training error, because the model was fitted on these points
            feedback: >
              The coefficients never saw these $200$ points. The bias here
              comes from the choice, not from the fit.
        feedback: >
          Choosing is fitting at one level up. The data that made the choice
          cannot also report on it honestly.

      - part: Which report can you trust
        teach: >
          Three teams each have $1000$ observations. Team A fits on $600$,
          picks among models on $200$, then scores the winner once on the
          last $200$ and reports that. Team B fits on $800$, picks on $200$,
          and reports the winner's score on those same $200$. Team C does what
          A did, dislikes the final score, adds a feature, rescores on the
          last $200$, and reports the new number.
      - ask: >
          Whose reported number is an honest estimate of out-of-sample error?
        choices:
          - text: >
              Team B: their $800$ training points give the best-fitted model.
            feedback: >
              Their fit may be better, but their report is the winner's score
              on the slice that chose the winner: the $0.94$ problem.
          - text: >
              Team A
            correct: true
            feedback: >
              Their last $200$ points played no part in any decision, so the
              score on them is an honest draw of the frozen model's error.
          - text: >
              Team C: they did everything A did, plus one improvement.
            feedback: >
              The improvement was kept because it scored better on the last
              $200$. Those points have now made a decision, so they are no
              longer a neutral judge.
        feedback: >
          Only A kept a slice that no decision touched.
      - reflect: >
          Say exactly what you checked about each team, and state it as a rule
          about data and decisions.
        answer: >
          You checked which data each decision touched. Fitting coefficients,
          choosing among models and reporting a number are three different
          jobs, and each needs its own data: data used to make a decision has
          been spent, and any score computed on spent data is optimistic by
          however much the decision leaned on it. The reported number must
          come from data that has made no decision at all.
      - teach: >
          Those are the three roles. The training set fits parameters at one
          fixed configuration. The validation set scores configurations
          against each other and picks the winner. The test set is opened
          once, after everything is frozen, to report the number. A common
          allocation is $60/20/20$. Open the test set, retune and rescore,
          and it has become a second validation set.

      - part: The roles, one at a time
        ask: >
          With $n = 2400$ and a $60/20/20$ split, how many observations are in
          the validation set?
        expects: "480"
        feedback: >
          $0.2 \times 2400 = 480$, with $1440$ for training and $480$ sealed
          for the test.
      - ask: >
          A model scores test MSE $1.12$. The researcher swaps one feature,
          rescores on the test set and gets $1.04$. What is the $1.04$?
        choices:
          - text: >
              An honest test score: the feature swap was a modelling change,
              not a fit to the test data.
            feedback: >
              The swap was kept because of what the test set said. That is a
              decision made on the test set, which turns it into validation.
          - text: >
              A validation score, optimistic by however much the swap was
              tuned to these points
            correct: true
            feedback: >
              One comparison spends only a little, but it spends something,
              and every further tweak spends more. The honest number is now
              lost unless fresh data exist.
          - text: >
              An average of the two scores' information, so slightly honest
            feedback: >
              There is no partial credit. Data that chose between the two
              versions can no longer judge the one it chose.
        feedback: >
          The test set is honest only while it is unopened. After one look
          that leads to a change, report it as validation.
      - ask: >
          With only $n = 150$ observations, why do practitioners tilt the
          split toward training rather than keep $60/20/20$?
        choices:
          - text: >
              Small samples have less noise, so validation needs fewer points.
            feedback: >
              The noise per point is the same; a small sample just has fewer
              points. Small scoring slices are noisier, not cleaner.
          - text: >
              With so few points, a $90$-point training slice fits parameters
              poorly, and that costs more than slightly noisier scoring.
            correct: true
            feedback: >
              The model trained on $90$ points may be much worse than the one
              trained on $120$. The scoring slices get smaller and noisier, an
              accepted price.
          - text: >
              Test sets are unnecessary when $n$ is small.
            feedback: >
              The need for an untouched slice does not depend on $n$; the
              optimism of a reused slice is, if anything, larger when the
              slice is small.
        feedback: >
          The split is a trade between how well you fit and how precisely you
          score. The roles do not change with $n$; only the proportions do.

      - part: The design that fails one clause
        ask: >
          A team keeps its test set sealed until the end. It chooses the number
          of features by picking the count with the lowest training error,
          then scores that model once on the test set. Which role went wrong?
        choices:
          - text: >
              Testing: the test set should have been used to choose the
              feature count.
            feedback: >
              That would spend the test set. The team got the test role
              right.
          - text: >
              None: the test score is honest, so the design is sound.
            feedback: >
              The test score is an honest report on a badly chosen model.
              Honest reporting cannot rescue a bad decision.
          - text: >
              Validation: the choice was made on training error, which always
              favours the largest count.
            correct: true
            feedback: >
              Training error falls with every feature added, so it picks the
              most complex model every time. Choosing needs data the fit did
              not see.
        feedback: >
          In an interview, say it as three jobs: fit on one slice, choose on a
          second, report on a third that is opened once.

  - node: quant-statistics.learning.cross-validation
    hook: >
      When one held-out split is too small to trust, k-fold is the fix — the
      interview wants you to reach for it and to explain the $k$-versus-$n$
      tradeoff, not just recite the averaging step.
    explanation: >
      A single validation split scores models using a small held-out sample,
      which is itself noisy. Rotating the held-out fold through $k$ pieces
      and averaging fixes that: partition into $k$ near-equal folds, fit on
      the $n-n/k$ points outside fold $j$, score the $n/k$ points inside it,
      and average the $k$ scores. Every point is predicted exactly once, by a
      model that never trained on it.

      Leave-one-out ($k=n$) trains on nearly all of $n$, so its per-fold
      estimate is close to unbiased for the true error at sample size $n-1$
      — but the $n$ training sets differ by one point each, so the $n$
      resulting errors are nearly identical to each other, and averaging
      near-duplicates barely reduces variance despite costing $n$ fits.

      Small $k$ trains each fold on noticeably less data than the full
      sample, so it estimates the error of a smaller, worse model and reports
      pessimistically. $k=5$ or $10$ balances the two: enough training data
      per fold to be nearly unbiased, few enough folds to be genuinely
      independent-ish estimates.
    worked: >
      With $n=100$ and $k=5$ (fold size $20$), suppose the per-fold losses
      are $e_1,\dots,e_5 = 0.42, 0.38, 0.51, 0.35, 0.44$. The reported CV
      error is their average: $(0.42+0.38+0.51+0.35+0.44)/5 = 2.10/5 = 0.42$.
    interview: >
      "How would you estimate out-of-sample error with only $200$ points?"
      wants $k$-fold named with a specific $k$, plus the cost (that many
      fits) weighed against the benefit (every point scored out of sample).
    pitfalls: >
      Applying random $k$-fold to data where observations aren't exchangeable
      draws from a fixed law — sequentially dependent data lets a fold place
      a near-duplicate of a test point inside training, quietly handing the
      model information it shouldn't have. Reporting the CV average as a
      single fixed model's error when it's really the average error of $k$
      separately fitted models.
    recap: >
      Rotate the held-out fold $k$ times and average: every point is
      predicted out of sample, and $k=5$ or $10$ balances near-unbiasedness
      against averaging noise.
    dialogue:
      - part: Sixty months and one verdict
        teach: >
          You have $60$ monthly observations and two candidate models, A and
          B. You hold out $12$ months, fit both on the other $48$, and score
          them on the $12$. The per-month squared loss has a standard
          deviation of about $1.2$, and the two models' true errors differ by
          about $0.1$.
      - ask: >
          What is the standard error of one model's validation score, the
          average loss over the $12$ held-out months?
        expects: "0.3464"
        tolerance: 0.0005
        hint: >
          An average of $m$ independent losses has standard deviation
          $\sigma/\sqrt{m}$.
        feedback: >
          $1.2/\sqrt{12} = 1.2/3.464 \approx 0.3464$. The score you are
          about to choose by is three times noisier than the gap you are
          trying to see.
      - ask: >
          A scores $1.05$ and B scores $1.18$. What does the split tell you?
        choices:
          - text: >
              A is better: it scored $0.13$ lower on data neither model saw.
            feedback: >
              Unseen data makes each score unbiased, not precise. With a
              standard error near $0.35$ on each, a different $12$ months
              could easily reverse the order.
          - text: >
              Very little: a gap of $0.13$ sits well inside the noise of a
              $12$-month score.
            correct: true
            feedback: >
              The verdict is honest and nearly uninformative. The cure is
              more scored points, and you have $48$ that were never scored.
          - text: >
              B is better: a model that scores worse out of sample is
              overfitting less.
            feedback: >
              A higher held-out error is not a sign of virtue; it is just a
              higher error. And with this much noise it is not even a
              reliable sign of that.
        feedback: >
          One split spends $12$ points on scoring and gets a score you cannot
          act on.
      - reflect: >
          Of your $60$ months, $48$ helped fit and never got scored. How could
          every month serve as a held-out point, without any month ever being
          scored by a model that had seen it? What does that cost?
        hint: >
          The $12$ months you held out were not special.
        answer: >
          Cut the $60$ months into $5$ groups of $12$ and take turns: hold
          out one group, fit on the other $48$, score the held-out group, and
          repeat for each group. Every month is then predicted exactly once,
          always by a model that never saw it, and the final score averages
          over all $60$ months instead of $12$. The price is five fits instead
          of one.
      - teach: >
          That rotation is $k$-fold cross-validation. Partition the $n$
          observations at random into $k$ folds of near-equal size. For
          $j = 1, \dots, k$, fit on the $n - n/k$ points outside fold $j$ and
          record the average loss $e_j$ on the $n/k$ points inside it. Report
          $\frac{1}{k}\sum_{j=1}^{k} e_j$. $k = 5$ or $10$ is standard.

      - part: Running the rotation
        ask: >
          You run it with $k = 5$ on the $60$ months, for model A. The five
          fold losses come back $1.30$, $1.10$, $1.45$, $0.95$ and $1.20$.
          What cross-validation error do you report?
        expects: "1.2"
        feedback: >
          $(1.30 + 1.10 + 1.45 + 0.95 + 1.20)/5 = 6.00/5 = 1.2$. The folds
          are equal in size, so this is also the average loss over all $60$
          months.
      - ask: >
          If the five fold losses were independent, each with standard
          deviation about $0.35$, what would the standard deviation of their
          average be?
        expects: "0.1565"
        tolerance: 0.0005
        feedback: >
          $0.35/\sqrt{5} \approx 0.35/2.236 \approx 0.1565$, against $0.35$
          for the single split. In practice the folds' training sets share
          $36$ of their $48$ months, so their losses are positively
          correlated and the real reduction is smaller than this.
      - ask: >
          No fold's model is the model you will deploy. What does the $1.2$
          estimate?
        choices:
          - text: >
              The error of model A fitted on all $60$ months, exactly
            feedback: >
              No fold fitted on all $60$. Each model trained on $48$, so the
              average describes a slightly weaker fit than the one you will
              deploy.
          - text: >
              The training error of A, since every month helped fit at some
              stage
            feedback: >
              Every month helped fit in four folds, but it was scored only in
              the fifth, by a model that never saw it. No score in the
              average is a training score.
          - text: >
              The out-of-sample error of A's fitting procedure trained on $48$
              months, averaged over five fits
            correct: true
            feedback: >
              Cross-validation scores a procedure, not one fitted object. You
              then refit on all $60$ and deploy that, and $1.2$ is a slightly
              pessimistic estimate of its error.
        feedback: >
          Every point predicted once, out of sample, at the cost of $k$ fits:
          that is the whole bargain.

      - part: How many folds
        ask: >
          Leave-one-out takes $k = n$. On the $60$ months it fits $60$
          models, each on $59$ months. How many months do any two of those
          training sets have in common?
        expects: "58"
        feedback: >
          Each leaves out one month, so two of them differ only in the two
          months they leave out, and share the other $58$.
      - ask: >
          Leave-one-out averages $60$ scores rather than $5$. Why is its
          average still noisy?
        choices:
          - text: >
              Each fold scores a single month, so each $e_j$ is very noisy.
            feedback: >
              Each $e_j$ is noisy, but averaging $60$ independent noisy numbers
              would fix that. The trouble is that these $60$ do not behave
              like independent numbers.
          - text: >
              Its $60$ models are nearly identical, so their errors move
              together and averaging them cancels little.
            correct: true
            feedback: >
              Training sets sharing $58$ of $59$ months give near-copies of
              one model. Averaging correlated numbers buys far less than
              averaging independent ones, at $60$ fits' cost.
          - text: >
              Each fold trains on less data than in $5$-fold, so the models
              are worse.
            feedback: >
              The opposite: $59$ months per fit against $48$. That is why
              leave-one-out is nearly unbiased for the error at size $n - 1$.
        feedback: >
          Leave-one-out is nearly unbiased and expensive, and its average is
          noisy because its folds are near-duplicates.
      - ask: >
          At the other extreme, $k = 2$ on the $60$ months trains each model
          on $30$. Relative to the error of the model you will deploy, fitted
          on all $60$, which way is its estimate off?
        choices:
          - text: >
              Optimistic: smaller training sets overfit less.
            feedback: >
              A smaller training set gives a noisier, worse fit, which scores
              higher error, not lower. Overfitting is capacity relative to
              data, and halving the data makes it worse.
          - text: >
              Pessimistic: it scores fits trained on half the data.
            correct: true
            feedback: >
              $30$ months make a distinctly weaker model than $60$, so the
              average describes a worse model than the one you deploy.
          - text: >
              Neither: held-out scoring is unbiased whatever $k$ is.
            feedback: >
              Unbiased for the error of a model trained on $n - n/k$ points.
              That is the deployed model's error only when $n - n/k$ is
              close to $n$.
        feedback: >
          Small $k$ is pessimistic, large $k$ is noisy and costly; $k = 5$ or
          $10$ sits between.
      - ask: >
          The $60$ months are returns with strong month-to-month dependence,
          and the folds are drawn at random. What goes wrong?
        choices:
          - text: >
              Nothing: each month is still predicted by a model that never
              saw it.
            feedback: >
              It never saw that month, but it saw the months on either side,
              which carry much of the same information. The guarantee
              assumes independent draws.
          - text: >
              The score is optimistic: a held-out month's neighbours sit in
              the training set.
            correct: true
            feedback: >
              With dependence, a random fold leaves near-copies of each test
              point in training, so the model is partly scored on what it has
              already seen.
          - text: >
              The score is pessimistic, because the gaps in each training
              fold break the series.
            feedback: >
              Gaps cost little; the neighbours left in training help the
              model, which pushes the score down, not up.
        feedback: >
          Asked how to score a model on $200$ points, say $5$- or $10$-fold,
          that every point is predicted once out of sample, that it costs $k$
          fits, and that random folds assume independent observations.

  - node: quant-statistics.learning.regularization
    hook: >
      "Why do you standardize before running ridge?" is a standard trap — get
      it wrong and the penalty silently punishes one feature far more than
      another for no reason connected to how useful it is.
    explanation: >
      Rather than picking a discrete model size, fit a large, flexible model
      and shrink it: the penalized objective already familiar from ridge and
      lasso turns the discrete choice into a continuous one — $\lambda \to 0$
      recovers the unpenalized fit, $\lambda \to \infty$ kills every
      coefficient. Shrinking coefficients toward zero trades bias for
      variance the same way any move along the complexity dial does, just by
      penalty strength instead of by counting parameters.

      Two mechanics matter in practice. A penalty on raw coefficient size is
      not scale-invariant: a feature measured in small units needs a large
      coefficient to have any effect, and an unstandardized penalty crushes
      that coefficient far harder than one attached to a feature on a large
      scale, purely because of units, not usefulness — so predictors must be
      standardized first. The intercept sets the baseline level, not model
      complexity, and is left unpenalized.

      Geometrically, lasso's $\ell_1$ ball has corners on the coordinate
      axes, and the loss contours typically first touch the constraint region
      at one of those corners — a coefficient set exactly to zero. Ridge's
      round $\ell_2$ ball has no corners, so it only shrinks, never zeroes.
    worked: >
      A single standardized predictor (variance $1$) with $n=100$ gives
      $X'X=100$. Suppose the unpenalized OLS coefficient is $\hat\beta=2.0$.
      With $\lambda=25$, the ridge shrinkage factor is
      $\frac{X'X}{X'X+\lambda} = \frac{100}{125} = 0.8$, so
      $\hat\beta_{\text{ridge}} = 0.8(2.0) = 1.6$ — an explicit, computed
      shrinkage toward zero.
    interview: >
      "Why standardize before ridge or lasso?" and "what does $\lambda$
      actually buy you?" want the scale-invariance argument and the
      bias-for-variance trade named explicitly, ideally with the shrinkage
      factor $X'X/(X'X+\lambda)$ stated.
    pitfalls: >
      Forgetting to standardize, so the penalty compares coefficients that
      aren't comparable. Penalizing the intercept, which drags the whole fit
      toward a mean of zero rather than controlling complexity. Choosing
      $\lambda$ by minimizing training loss — training loss always prefers
      $\lambda=0$, so $\lambda$ must be chosen out-of-sample.
    recap: >
      Penalizing coefficient size turns model-size selection into a
      continuous dial $\lambda$, buying variance reduction at the price of
      bias, provided predictors are standardized first.
    dialogue:
      - part: Half a coefficient
        teach: >
          A one-factor model's least-squares coefficient $\hat\beta$ is
          unbiased for the true $\beta = 0.2$, but noisy: its variance across
          samples is $0.16$, so its mean squared error is $0.16$. A colleague
          proposes reporting $0.5\hat\beta$ instead.
      - ask: >
          What is the mean squared error of $0.5\hat\beta$ as an estimate of
          $\beta = 0.2$?
        expects: "0.05"
        hint: >
          Squared bias plus variance. Halving a random variable quarters its
          variance.
        feedback: >
          Its mean is $0.1$, so the bias is $-0.1$ and the squared bias
          $0.01$. Its variance is $0.25(0.16) = 0.04$. Total $0.05$, less
          than a third of the $0.16$ the unbiased estimate pays.
      - ask: >
          Does halving always win?
        choices:
          - text: >
              Yes: shrinking always lowers variance, so it always lowers
              mean squared error.
            feedback: >
              It always lowers variance, and it always adds bias. With true
              $\beta = 1$ the squared bias is $0.5^{2} = 0.25$, so the halved
              estimate scores $0.25 + 0.04 = 0.29$, worse than $0.16$.
          - text: >
              No: when the true coefficient is large against the noise, the
              bias it adds costs more than the variance it saves.
            correct: true
            feedback: >
              With $\beta = 1$: $0.25 + 0.04 = 0.29 > 0.16$. Shrinking pays
              when noise dominates the signal, and only then.
          - text: >
              No: halving loses when the noise is large.
            feedback: >
              Large noise is when halving wins most: the variance it saves
              grows with the noise, and the bias it adds does not.
        feedback: >
          Shrinkage is the bias-for-variance trade, made on a coefficient. It
          pays exactly where return prediction lives: small signal, large
          noise.
      - reflect: >
          With $200$ coefficients and no idea of their true sizes, you cannot
          pick a multiplier for each by hand. What could you add to the
          fitting objective so the fit shrinks coefficients by itself, and
          what single number would control how hard?
        hint: >
          Least squares cares only about fit. Make it care about something
          else too.
        answer: >
          Charge the fit for coefficient size: minimize training loss plus
          $\lambda$ times a measure of how large the coefficients are. The fit
          then keeps a coefficient large only where it buys enough fit to pay
          its charge. $\lambda = 0$ gives back least squares, and a huge
          $\lambda$ drives every coefficient to zero, so $\lambda$ is a
          continuous complexity dial.
      - teach: >
          That is regularization. Minimize $\hat R(\beta) + \lambda\,
          \Omega(\beta)$, with $\Omega(\beta) = \sum_j \beta_j^{2}$ for ridge
          and $\Omega(\beta) = \sum_j |\beta_j|$ for lasso. Instead of
          counting parameters, you fit a large model and penalize it, buying
          variance reduction at the price of bias. For one standardized
          predictor, ridge gives $\hat\beta_{\text{ridge}} =
          \frac{X'X}{X'X + \lambda}\hat\beta$.

      - part: Turning the knob
        ask: >
          A single standardized predictor has $X'X = 60$ and least-squares
          coefficient $\hat\beta = 0.9$. With $\lambda = 30$, what is the
          ridge coefficient?
        expects: "0.6"
        feedback: >
          The shrinkage factor is $60/(60 + 30) = 2/3$, so
          $\hat\beta_{\text{ridge}} = (2/3)(0.9) = 0.6$.
      - ask: >
          With the same $X'X = 60$, what $\lambda$ makes ridge do exactly what
          the colleague did by hand, halve the coefficient?
        expects: "60"
        feedback: >
          $60/(60 + \lambda) = 0.5$ gives $\lambda = 60$. Ridge is the
          colleague's multiplier, chosen by one dial for every coefficient at
          once.
      - ask: >
          You pick $\lambda$ from the grid $\{0, 1, 10, 100\}$ by whichever
          gives the lowest training error. Which do you get?
        choices:
          - text: >
              The value that best balances bias and variance
            feedback: >
              Training error never sees variance: it only rewards fit to the
              data it was computed on.
          - text: >
              $\lambda = 100$, since the penalty is largest there
            feedback: >
              A larger penalty pulls coefficients away from their best
              in-sample values, so it raises training error.
          - text: >
              $\lambda = 0$, every time
            correct: true
            feedback: >
              Least squares minimizes training error by definition, so any
              penalty can only raise it. Training error always votes for no
              regularization.
        feedback: >
          $\lambda$ has to be chosen on data the fit did not see, by
          validation or cross-validation.

      - part: Units and the intercept
        ask: >
          A spread enters a model in percent, with least-squares coefficient
          $0.8$. You re-measure the same spread in basis points, so every
          value is multiplied by $100$. What is the least-squares coefficient
          now?
        expects: "0.008"
        feedback: >
          The fitted values cannot change, so the coefficient must shrink by
          the same factor of $100$: $0.8/100 = 0.008$.
      - ask: >
          What does a ridge penalty now do to that coefficient, compared with
          before?
        choices:
          - text: >
              The same: least squares does not care about units, so neither
              does ridge.
            feedback: >
              The fit does not care; the penalty does. $\beta^{2}$ went from
              $0.64$ to $0.000064$, so the same $\lambda$ now charges it ten
              thousand times less.
          - text: >
              It penalizes it harder, because the spread's values are now
              larger.
            feedback: >
              The values grew; the coefficient shrank, and the penalty is on
              the coefficient. It is charged far less, not more.
          - text: >
              It barely touches it, purely because of the change of units.
            correct: true
            feedback: >
              The penalty now depends on how a feature is measured, not on
              how useful it is. Standardize every predictor first, so each
              coefficient is on the same scale before it is charged.
        feedback: >
          A penalty on raw coefficients is not scale invariant. Standardizing
          is not cosmetic; without it the penalty is arbitrary.
      - ask: >
          Daily returns in the sample average $4$ basis points. Should the
          ridge penalty include the intercept?
        choices:
          - text: >
              Yes: every coefficient should be penalized alike.
            feedback: >
              Penalizing the intercept drags every prediction toward $0$
              basis points instead of $4$. That is bias in the baseline,
              bought with no reduction in complexity.
          - text: >
              No: the intercept sets the baseline level, not the model's
              flexibility.
            correct: true
            feedback: >
              Shrinking it reduces no variance worth having and biases every
              prediction. Leave it out of the penalty.
          - text: >
              Only if the returns are standardized.
            feedback: >
              Standardizing the predictors does not change what the intercept
              is for. It remains the baseline, and a baseline is not
              complexity.
        feedback: >
          Standardize the predictors, leave the intercept unpenalized, then
          turn the dial.

      - part: Shrinking against zeroing
        ask: >
          Ridge at $\lambda = 30$ took $0.9$ to $0.6$. You want a model that
          keeps $5$ of $200$ standardized features and drops the rest outright.
          Which penalty does that?
        choices:
          - text: >
              Ridge, with $\lambda$ large enough
            feedback: >
              Ridge multiplies by $X'X/(X'X + \lambda)$, which is positive for
              every finite $\lambda$. It shrinks every coefficient and zeroes
              none.
          - text: >
              Lasso, whose penalty sets some coefficients exactly to zero
            correct: true
            feedback: >
              The $\ell_1$ penalty's region has corners on the axes, and the
              fit typically lands on one, where some coefficients are exactly
              $0$. Lasso selects as it shrinks.
          - text: >
              Either: both penalties zero a coefficient once $\lambda$ passes
              its size
            feedback: >
              Only lasso has a threshold like that. Ridge's round region has no
              corners, so its coefficients approach zero without reaching it.
        feedback: >
          Ridge shrinks, lasso shrinks and selects. Asked what $\lambda$ buys,
          say variance reduction paid for in bias, with the factor
          $X'X/(X'X + \lambda)$, standardized predictors and a free intercept.

  - node: quant-statistics.learning.hyperparameter-selection
    hook: >
      Reporting the winning cross-validation score as your out-of-sample
      error is a rookie mistake interviewers plant specifically to catch —
      selecting the best of many noisy numbers is itself a form of fitting.
    explanation: >
      A cross-validation score for one fixed configuration is a noisy
      estimate of that configuration's true error. Sweep a grid of
      configurations and take the minimum score, and the same mechanism that
      made training error optimistic reappears one level up: the winning
      configuration was chosen partly because its noise happened to look
      good, so the reported minimum understates its true error, and the bias
      grows with how many configurations were tried.

      Two fixes mirror the earlier train/val/test discipline. Nested
      cross-validation puts selection in an inner loop and estimates error in
      an outer loop that never saw the choice being made. Simpler: reserve a
      test set that selection never touches, exactly the discipline already
      built for one fixed model, now applied to the whole selection
      procedure.

      The one-standard-error rule is a habit worth keeping even with a proper
      outer estimate: since the minimum score is itself noisy, take the
      simplest configuration whose score is within one standard error of it,
      rather than chasing every last bit of the (partly illusory) minimum.
    worked: >
      A $\lambda$ grid $\{0.1, 1, 10, 100\}$ gives $5$-fold CV errors $0.95,
      0.88, 0.91, 1.10$ with standard errors $0.05, 0.04, 0.06, 0.03$. The
      naive rule picks $\lambda=1$ (minimum $0.88$). The one-standard-error
      band around that minimum is $[0.88, 0.88+0.04]=[0.88,0.92]$; $\lambda=10$
      scores $0.91$, inside that band, and is the simpler (more penalized)
      model, so the one-standard-error rule selects $\lambda=10$ instead.
    interview: >
      "You tried $50$ hyperparameter settings and picked the best CV score —
      is that a fair estimate of real performance?" wants an emphatic no,
      with nested cross-validation or a held-out test set named as the fix.
    pitfalls: >
      Quoting the minimum CV score as the out-of-sample error, with bias
      growing silently as the grid grows. Using the same round of CV both to
      select the winning configuration and to report its error — the fold
      that helped choose the winner also graded it.
    recap: >
      The CV score of the configuration you selected is not an honest error
      estimate; nest the selection in an outer loop or hold out data it never
      touched.
    dialogue:
      - part: The winning score
        teach: >
          You cross-validate four penalty values. Unknown to you they are
          equally good: each has true error $1.00$. Each one's cross-validation
          score is noisy, coming out $0.94$ or $1.06$ with equal chance,
          independently of the others. You will keep the value with the lowest
          score and write its score in the report.
      - ask: >
          What is the probability that at least one of the four scores is
          $0.94$?
        expects: "15/16"
        hint: >
          The only way to miss is for all four to come out $1.06$.
        feedback: >
          $1 - (1/2)^{4} = 15/16$. Almost always some value gets the lucky
          draw, and that is the one you keep.
      - ask: >
          What is the expected value of the score you write in the report?
        expects: "0.9475"
        tolerance: 0.0001
        feedback: >
          $0.94 \cdot \frac{15}{16} + 1.06 \cdot \frac{1}{16} = 0.88125 +
          0.06625 = 0.9475$. The true error of whatever you keep is $1.00$, so
          the report is optimistic by about $0.05$.
      - ask: >
          You widen the grid to $40$ values, all still equally good. What
          happens to the reported score?
        choices:
          - text: >
              It moves toward $1.00$, since more values average out the noise.
            feedback: >
              Nothing is averaged: you report the smallest score. More draws
              make a lucky one more likely, and with $40$ values the chance
              that none is $0.94$ is $2^{-40}$.
          - text: >
              It stays near $0.9475$, since each score is unbiased.
            feedback: >
              Each score is unbiased for its own value's error. The minimum of
              several unbiased scores is not, and its bias depends on how many
              you take the minimum over.
          - text: >
              It falls to essentially $0.94$: the bias grows with the number
              of values tried.
            correct: true
            feedback: >
              Here it is capped at $0.06$ because the noise only takes two
              values; with real, unbounded noise the winner's score keeps
              falling as the grid grows.
        feedback: >
          Selecting the best of many noisy scores is a fit. Its score inherits
          the optimism of a training error.
      - reflect: >
          Each of the four scores was an honest estimate of its own value's
          error. Why is the score of the one you kept not honest, and what
          would you need to measure the error of the whole procedure, "pick
          the best value and fit it"?
        hint: >
          Ask what data the choice touched, and what data the reported score
          came from.
        answer: >
          Keeping the lowest score selects on its noise having been
          favourable, so the score that chose the winner is biased low, the
          same way training error is. To measure the procedure honestly you
          need data that played no part in the choice: either a test set
          opened only after the choice is frozen, or an outer loop that treats
          "cross-validate the grid, pick, refit" as the fitting step and
          scores it on folds it never saw.
      - teach: >
          Both are standard. Nested cross-validation runs the selection in an
          inner loop, inside each outer training set, and estimates error in an
          outer loop whose held-out folds never influenced any choice. The
          simpler fix keeps a test set that is opened once, after selection.
          Either way, the minimum cross-validation score is a selection
          statistic, not your out-of-sample error.

      - part: Nesting the choice
        ask: >
          In a nested run, the inner loop picks $\lambda = 3$ inside outer
          fold $2$ and $\lambda = 10$ inside outer fold $4$. Does that spoil
          the outer estimate?
        choices:
          - text: >
              Yes: the outer estimate is valid only if every fold picks the
              same $\lambda$.
            feedback: >
              The outer loop is not scoring one $\lambda$. It scores the
              procedure that picks one, and how much its pick varies is part
              of how well that procedure performs.
          - text: >
              No: the outer loop estimates the error of the whole procedure,
              choice included.
            correct: true
            feedback: >
              Different picks in different folds are exactly the selection
              noise a single cross-validation hides. The outer number has
              priced it in.
          - text: >
              Yes: you should report the inner score of the $\lambda$ picked
              most often.
            feedback: >
              That inner score is the optimistic minimum again, the number the
              nesting was built to avoid.
        feedback: >
          Nesting estimates how well "tune, then fit" works, not how well one
          tuned model works.
      - ask: >
          The inner loops reported winning scores averaging $0.95$. The five
          outer-fold scores are $1.03$, $0.98$, $1.07$, $1.01$ and $0.96$.
          What is the honest estimate of out-of-sample error?
        expects: "1.01"
        feedback: >
          $(1.03 + 0.98 + 1.07 + 1.01 + 0.96)/5 = 5.05/5 = 1.01$. The gap
          from $0.95$ to $1.01$ is the optimism of selection, measured.
      - ask: >
          Inside one outer fold, which data may the inner loop use?
        choices:
          - text: >
              All of the data, as long as the outer test fold is only used
              for standardizing
            feedback: >
              Standardizing with the outer test fold lets its mean and spread
              shape the fit. Any use at all is a decision it influenced.
          - text: >
              Only that outer fold's training set
            correct: true
            feedback: >
              Everything the procedure does, tuning and preprocessing included,
              must happen inside the outer training set, or the outer score is
              no longer out of sample.
          - text: >
              The outer test fold too, for the final comparison between the
              top two values
            feedback: >
              Then the outer test fold has chosen something, and it has become
              validation data. Its score is optimistic again.
        feedback: >
          The outer test fold is a test set in miniature: untouched until the
          procedure has finished choosing.

      - part: When the scores are within noise
        teach: >
          A tree-depth grid gives cross-validation scores, with standard
          errors: depth $2$ scores $0.640$ ($0.020$), depth $4$ scores
          $0.605$ ($0.018$), depth $6$ scores $0.590$ ($0.020$), depth $10$
          scores $0.598$ ($0.022$).
      - ask: >
          Treat any depth whose score is within one standard error of the
          best score as indistinguishable from it. What is the shallowest such
          depth?
        expects: "4"
        hint: >
          The best is depth $6$; add its standard error to its score.
        feedback: >
          The band runs up to $0.590 + 0.020 = 0.610$. Depth $4$ at $0.605$ is
          inside it; depth $2$ at $0.640$ is not. So depth $4$.
      - ask: >
          Why prefer depth $4$ over depth $6$, when depth $6$ scored lower?
        choices:
          - text: >
              Because shallower trees always generalize better
            feedback: >
              Not always: depth $2$ is shallower still and clearly worse. The
              rule only prefers simplicity among scores the noise cannot tell
              apart.
          - text: >
              Because depth $6$'s lead of $0.015$ is smaller than its own
              standard error, so it may be selection luck
            correct: true
            feedback: >
              The winner of a noisy comparison is biased toward luck, as the
              four penalty values showed. Among near-ties, the simpler model
              has less variance and less to lose.
          - text: >
              Because depth $4$ has the smaller standard error
            feedback: >
              $0.018$ against $0.020$ is not the reason. The rule takes the
              simplest model within one standard error of the best, whatever
              that model's own standard error.
        feedback: >
          That is the one-standard-error rule: take the simplest configuration
          whose score is within one standard error of the best.
      - ask: >
          For a ridge grid, which end of the grid is the simple end the rule
          should lean toward?
        choices:
          - text: >
              The smallest $\lambda$, closest to the unpenalized fit
            feedback: >
              The unpenalized fit is the most flexible member of the family,
              the opposite of simple.
          - text: >
              The largest $\lambda$
            correct: true
            feedback: >
              More penalty means more shrinkage, less variance, a simpler
              fit. Among near-ties, take the largest $\lambda$.
          - text: >
              Whichever has the fewest exact zeros
            feedback: >
              Ridge produces no exact zeros at any $\lambda$, so that cannot
              order its grid. Penalty strength is the dial.
        feedback: >
          Asked whether the best of $50$ cross-validated settings gives a fair
          error, say no: it is a selection statistic. Nest the choice or keep
          a test set it never touched, and lean simple among near-ties.

  - node: quant-statistics.learning.gradient-descent
    hook: >
      Everyone recites "step downhill in the negative gradient direction" —
      the interview wants the exact learning-rate boundary on a quadratic,
      which almost nobody can produce cold.
    explanation: >
      Many losses have no closed-form point where the gradient vanishes, so
      instead of solving $\nabla L(\theta)=0$ algebraically, iterate toward
      it: $\theta_{t+1}=\theta_t-\eta\,\nabla L(\theta_t)$, a small step
      downhill at each round.

      The one-dimensional quadratic $L(\theta)=\frac{1}{2}a\theta^{2}$,
      $a>0$, makes the whole boundary explicit. The gradient is $a\theta$, so
      the update is $\theta_{t+1}=(1-\eta a)\theta_t$, a linear recursion with
      $\theta_t=(1-\eta a)^{t}\theta_0$. This converges to the minimizer
      exactly when $|1-\eta a|<1$, i.e. $0<\eta<2/a$. At $\eta=1/a$ the factor
      is zero and it lands on the minimum in one step; between $1/a$ and
      $2/a$ the factor is negative but shrinking, so the path oscillates in
      sign while still converging; at $\eta=2/a$ the factor is exactly $-1$
      and it oscillates forever without shrinking; beyond that it diverges.

      Too small $\eta$ is merely slow — the factor stays close to $1$. For
      convex $L$ and a sufficiently small fixed step, the iterates reach a
      global minimum; badly differing curvature across directions forces
      $\eta$ small enough for the steepest direction, so gentler directions
      crawl, producing the classic zig-zag.
    worked: >
      With $a=4$, so $2/a=0.5$: at $\eta=0.3$ the factor is $1-0.3(4)=-0.2$,
      and from $\theta_0=10$ the iterates are $-2, 0.4, -0.08,\dots$,
      shrinking toward $0$. At $\eta=0.6 > 0.5$ the factor is $1-0.6(4)=-1.4$,
      and the same start gives $-14, 19.6,\dots$ — growing without bound, a
      direct consequence of exceeding $2/a$.
    interview: >
      "What happens if your learning rate is too large?" wants the exact
      answer: converges for $\eta<2/a$, one-step exact at $\eta=1/a$,
      oscillates-but-converges up to $2/a$, diverges beyond it — not just
      "it might not converge."
    pitfalls: >
      Assuming a smaller learning rate is always safer — it's slower, and the
      real danger is only $\eta$ large relative to curvature. Picking one
      global $\eta$ when curvature differs sharply by direction, which
      zig-zags rather than diverges. Assuming the convex convergence
      guarantee carries over to a nonconvex loss, where only convergence to a
      stationary point is assured.
    recap: >
      Gradient descent on curvature $a$ converges for $0<\eta<2/a$, lands
      exactly on the minimum at $\eta=1/a$, and diverges past $2/a$ —
      too small is slow, too large is fatal.
    dialogue:
      - part: A minimum with no formula
        teach: >
          A desk calibrates one parameter $\theta$ of a cost model, and the
          cost is $L(\theta) = \theta^{2} + e^{\theta}$. Setting $L'(\theta) =
          2\theta + e^{\theta} = 0$ has no closed-form solution. What you can
          do is evaluate the slope at any point you like.
      - ask: >
          You start at $\theta = 0$. What is the slope $L'(0)$?
        expects: "1"
        feedback: >
          $2(0) + e^{0} = 1$. The cost is rising as $\theta$ increases through
          $0$.
      - ask: >
          Which way should $\theta$ move to lower the cost?
        choices:
          - text: >
              Up, since the slope is positive
            feedback: >
              A positive slope means the cost rises as $\theta$ rises. Moving
              up climbs the hill.
          - text: >
              Down, against the sign of the slope
            correct: true
            feedback: >
              The slope says which way is uphill, so step the other way. Its
              size also says how steep the hill is here, which suggests a
              step proportional to it.
          - text: >
              It cannot be decided without knowing where the minimum is
            feedback: >
              You never need the minimum's location to know which way is
              downhill from where you stand. The local slope is enough.
        feedback: >
          The rule writes itself: $\theta_{\text{new}} = \theta - \eta
          L'(\theta)$, for some step-size multiplier $\eta > 0$.
      - ask: >
          Take $\eta = 0.25$, so the first step lands at $\theta = 0 -
          0.25(1) = -0.25$. What is the slope there?
        expects: "0.2788"
        tolerance: 0.0005
        feedback: >
          $2(-0.25) + e^{-0.25} = -0.5 + 0.7788 = 0.2788$. Still positive,
          and smaller: you are closer to the bottom. The next step goes to
          $-0.25 - 0.25(0.2788) \approx -0.3197$, and the true minimum is near
          $-0.3517$.
      - reflect: >
          The multiplier $0.25$ was picked out of the air. What happens if you
          use $\eta = 2$ instead, and what property of the cost decides how
          large a step is safe?
        hint: >
          Take one step from $0$ with $\eta = 2$ and look at the slope where
          you land.
        answer: >
          From $0$ the step lands at $-2$, far past the minimum, where the
          slope is $-4 + e^{-2} \approx -3.86$, steeper than where you
          started; the next step throws you to about $5.7$, and it gets worse
          from there. A step too large overshoots onto steeper ground, and
          every overshoot is bigger than the last. How fast the slope changes
          as you move, the curvature, decides how large a step is safe.

      - part: The quadratic tells the whole story
        teach: >
          That rule is gradient descent: $\theta_{t+1} = \theta_t -
          \eta\,\nabla L(\theta_t)$, with $\eta$ the learning rate. To see
          exactly how $\eta$ matters, take the cost whose curvature is the
          same everywhere, $L(\theta) = \frac{1}{2}a\theta^{2}$ with $a = 10$,
          so $L'(\theta) = 10\theta$, and start at $\theta_0 = 4$. The
          minimum is at $0$.
      - ask: >
          With $\eta = 0.05$, what is $\theta_1$?
        expects: "2"
        feedback: >
          $\theta_1 = 4 - 0.05(40) = 2$. In general $\theta_{t+1} = \theta_t -
          \eta a\theta_t = (1 - \eta a)\theta_t$, and here the factor is $0.5$:
          each step halves the distance to the minimum.
      - ask: >
          With $\eta = 0.15$, what is $\theta_2$?
        expects: "1"
        hint: >
          The factor is $1 - 0.15(10)$.
        feedback: >
          The factor is $-0.5$, so $\theta_1 = -2$ and $\theta_2 = 1$. The
          path jumps across the minimum each step and still closes in.
      - ask: >
          With $\eta = 0.25$, what is $\theta_2$?
        expects: "9"
        feedback: >
          The factor is $1 - 2.5 = -1.5$, so $\theta_1 = -6$ and $\theta_2 =
          9$. Each overshoot is half again as big as the last: this diverges.
      - ask: >
          Which learning rate reaches the minimum in a single step?
        expects: "0.1"
        feedback: >
          The factor $1 - 10\eta$ is zero at $\eta = 0.1 = 1/a$, and $\theta_1
          = 0$ from any start.
      - ask: >
          Exactly which learning rates converge on this cost?
        choices:
          - text: >
              $0 < \eta < 0.1$, below the one-step rate
            feedback: >
              $\eta = 0.15$ overshot every step and still converged. Above
              $1/a$ the path oscillates, but it shrinks as long as the factor
              stays above $-1$.
          - text: >
              $0 < \eta < 0.2$
            correct: true
            feedback: >
              Convergence needs $|1 - \eta a| < 1$, that is $0 < \eta < 2/a =
              0.2$. At exactly $0.2$ the factor is $-1$ and the path bounces
              between $4$ and $-4$ forever.
          - text: >
              Any $\eta$ small enough to keep each step below the distance to
              the minimum
            feedback: >
              The distance to the minimum changes every step; the condition
              is on the factor $1 - \eta a$, which is fixed. And $\eta = 0.15$
              overshoots yet converges.
        feedback: >
          On curvature $a$: converge for $\eta < 2/a$, land in one step at
          $1/a$, oscillate but converge between them, diverge above $2/a$.
          Too small is slow; too large is fatal.

      - part: Two curvatures, one step size
        ask: >
          Now $L(\theta_1, \theta_2) = \frac{1}{2}(2\theta_1^{2} +
          50\theta_2^{2})$: the coordinates update separately, with curvatures
          $2$ and $50$. Below what learning rate does the whole thing
          converge?
        expects: "0.04"
        hint: >
          Each coordinate needs $\eta < 2/a$ for its own $a$.
        feedback: >
          The steep coordinate needs $\eta < 2/50 = 0.04$; the gentle one
          would tolerate up to $1$. One $\eta$ must satisfy both, so $0.04$
          binds.
      - ask: >
          You run $\eta = 0.038$. What does the path look like?
        choices:
          - text: >
              Fast convergence in both coordinates, since $\eta$ is near its
              limit
            feedback: >
              Near the limit for the steep coordinate, tiny for the gentle
              one: there the factor is $1 - 0.038(2) = 0.924$, so each step
              removes under $8\%$ of the distance.
          - text: >
              The steep coordinate flips sign each step while the gentle one
              creeps: a slow zig-zag
            correct: true
            feedback: >
              Steep factor $1 - 0.038(50) = -0.9$: bouncing across its valley.
              Gentle factor $0.924$: crawling along the floor. The steepest
              direction sets $\eta$, and every other direction pays.
          - text: >
              Divergence in the gentle coordinate
            feedback: >
              The gentle coordinate is the safest: its limit is $2/2 = 1$. The
              problem there is slowness, not instability.
        feedback: >
          Asked what a too-large learning rate does, give the boundary: on
          curvature $a$, anything under $2/a$ converges and anything above
          diverges, and differing curvatures force the step down to suit the
          steepest direction.

  - node: quant-statistics.learning.sgd
    hook: >
      Nobody at scale actually runs full-batch gradient descent — the
      interview wants to know why taking many wrong-ish steps beats taking
      few exactly-right ones.
    explanation: >
      A full gradient over $n$ points costs $O(n)$ per step. A mini-batch of
      size $b$ drawn at random gives a gradient that is an unbiased estimate
      of the full gradient — every point has equal chance of appearing, so
      its expectation over the random batch equals the full-data average —
      so steps are downhill on average even though any single step may go
      slightly the wrong way, at $O(b)$ cost instead of $O(n)$.

      That noise means the fixed-step convergence argument from full-batch
      descent no longer applies as-is: a constant $\eta$ leaves the iterates
      rattling in a noise ball around the optimum rather than settling on it.
      The step size must decay: $\sum_t \eta_t=\infty$ keeps the total travel
      budget unbounded, so the path can still reach the optimum from
      anywhere, while $\sum_t \eta_t^{2}<\infty$ keeps the accumulated noise
      variance finite, so the path actually settles instead of rattling
      forever.

      One pass through the reshuffled data is an epoch, and with $n$ large
      the first epoch typically does most of the work — exactly why paying
      $O(n)$ for one exact step is wasteful early in training.
    worked: >
      With $n=1{,}000{,}000$, one full-batch step costs about $1{,}000{,}000$
      operations. A mini-batch of $b=100$ costs $100$ operations per step, so
      one full epoch ($n/b=10{,}000$ steps) costs the same total
      $1{,}000{,}000$ operations as a single full-batch step — but takes
      $10{,}000$ downhill moves on average instead of one.
    interview: >
      "Why not just use full-batch gradient descent if you have the
      compute?" wants the unbiased-but-cheap-and-frequent argument, and, if
      pressed, the decaying step-size condition needed for actual
      convergence.
    pitfalls: >
      Using a fixed, non-decaying learning rate and expecting exact
      convergence — constant $\eta$ only reaches a noise ball around the
      optimum. Choosing a batch size so small that gradient noise swamps the
      signal, or so large that mini-batching has just re-derived full-batch
      descent at extra bookkeeping cost.
    recap: >
      A random mini-batch gradient is unbiased and cheap; getting actual
      convergence out of it, rather than a noise ball, needs a learning rate
      that decays.
    dialogue:
      - part: One step costs a full pass
        teach: >
          You fit a model by gradient descent on $n = 5{,}000{,}000$ trade
          records. The loss is an average over records, so every gradient
          touches all of them, and your machine gets through $50{,}000$
          records a second.
      - ask: >
          How many seconds does one gradient step take?
        expects: "100"
        feedback: >
          $5{,}000{,}000 / 50{,}000 = 100$ seconds, and early in training that
          step's precision buys almost nothing: from far away, any roughly
          downhill direction would do.
      - ask: >
          Suppose instead you compute each step's gradient on $500$ records
          drawn at random. How many such steps fit into those $100$ seconds?
        expects: "10000"
        feedback: >
          Each costs $500/50{,}000 = 0.01$ seconds, so $10{,}000$ steps: ten
          thousand moves for the price of one, and together they pass through
          the data once.
      - ask: >
          A gradient from $500$ of $5$ million records is wrong on every step.
          What would make it worth taking anyway?
        choices:
          - text: >
              Nothing: a wrong gradient points somewhere other than downhill.
            feedback: >
              On any one step it can, a little. What matters is where it
              points on average, and that is checkable.
          - text: >
              It must be right on average, so the errors cancel across many
              steps.
            correct: true
            feedback: >
              If its average is the full gradient, the many cheap steps drift
              downhill even though each one wobbles. The next part checks
              this on data small enough to do by hand.
          - text: >
              It must have the same size as the full gradient.
            feedback: >
              Size is the wrong thing to match: a gradient of the right size
              in a random direction is useless. Direction on average is what
              counts.
        feedback: >
          Cheap and right on average is the bargain. Whether it holds, and
          what it costs, is a calculation.

      - part: Right on average, wrong every time
        teach: >
          Shrink the data to four records, $y = 2, 4, 9, 13$, and fit a
          constant $\theta$ by minimizing the average of $\frac{1}{2}(\theta -
          y_i)^{2}$. The full gradient is $\theta - \bar y$, and record $i$'s
          own gradient is $\theta - y_i$.
      - ask: >
          What is the full gradient at $\theta = 0$?
        expects: "-7"
        feedback: >
          $\bar y = 28/4 = 7$, so the gradient is $0 - 7 = -7$: step up.
      - ask: >
          You use one record, picked uniformly at random. What is the expected
          value of its gradient at $\theta = 0$?
        expects: "-7"
        feedback: >
          The four possible gradients are $-2, -4, -9, -13$, each with
          probability $1/4$, averaging $-28/4 = -7$. A random record's
          gradient is an unbiased estimate of the full gradient.
      - ask: >
          What is the variance of that one-record gradient?
        expects: "18.5"
        hint: >
          Squared distances of $-2, -4, -9, -13$ from $-7$.
        feedback: >
          $(25 + 9 + 4 + 36)/4 = 74/4 = 18.5$. That is the price of the
          cheap step: a standard deviation of about $4.3$ around the right
          answer of $-7$.
      - ask: >
          A mini-batch averages $2$ records drawn independently at random.
          What is the variance of its gradient?
        expects: "9.25"
        feedback: >
          Averaging $b$ independent draws divides the variance by $b$: $18.5/2
          = 9.25$. A batch of size $b$ costs $b$ times as much and is $b$
          times less noisy in variance.
      - reflect: >
          Run one-record steps with a fixed $\eta = 0.1$, and suppose you
          arrive exactly at the minimum, $\theta = 7$. What happens on the next
          step, and what must happen to $\eta$ for the iterates to settle?
        hint: >
          The full gradient at $7$ is $0$. A single record's is not.
        answer: >
          A record's gradient there is $7 - y_i$, one of $5, 3, -2, -6$, so the
          step kicks you off the minimum by $-0.5$, $-0.3$, $+0.2$ or $+0.6$.
          With $\eta$ fixed the kicks never stop, and the iterates rattle in
          a band around the optimum whose width scales with $\eta$. To
          settle, $\eta$ has to shrink over time, but not so fast that you
          stop before reaching the optimum.

      - part: Making it settle
        teach: >
          This is stochastic gradient descent, or mini-batch descent when
          $b > 1$: replace the full gradient with the average over a random
          batch of size $b \ll n$. It is unbiased, costs $O(b)$ rather than
          $O(n)$, and one pass through the reshuffled data is an epoch. The
          classical condition for it to converge is $\sum_t \eta_t = \infty$
          together with $\sum_t \eta_t^{2} < \infty$.
      - ask: >
          At the minimum, with $\eta = 0.1$ and one record per step, what is
          the expected squared size of the kick, $\mathbb{E}[(\eta g)^{2}]$?
        expects: "0.185"
        feedback: >
          At $\theta = 7$ the record gradient $g$ has mean $0$ and variance
          $18.5$, so $\mathbb{E}[(\eta g)^{2}] = 0.01(18.5) = 0.185$. The
          noise enters through $\eta^{2}$, which is why it is the sum of
          squared steps that has to stay finite.
      - ask: >
          A colleague decays the step fast, $\eta_t = 0.1 \cdot 0.5^{t}$ for
          $t = 1, 2, \dots$, so the noise dies quickly. What goes wrong?
        choices:
          - text: >
              Nothing: faster decay only makes the path calmer.
            feedback: >
              Calmer, and stuck. Those steps add up to only $0.1$ in total,
              so the iterate can travel only a bounded distance and freezes
              wherever that runs out.
          - text: >
              The steps sum to $0.1$, so the path may freeze short of the
              optimum.
            correct: true
            feedback: >
              $\sum_t \eta_t = 0.1(0.5 + 0.25 + \dots) = 0.1$. That breaks the
              first condition: the total step budget must be infinite so the
              optimum is reachable from anywhere.
          - text: >
              The noise grows, because each step is too small to correct the
              last.
            feedback: >
              Smaller steps carry less noise, not more: the kick scales with
              $\eta^{2}$. The failure is running out of travel, not of
              calm.
        feedback: >
          The first condition keeps the path able to arrive; the second makes
          it stop rattling once it has. A fixed $\eta$ fails the second, a
          geometric decay fails the first.
      - ask: >
          On the $5$ million records with batches of $500$, which statement
          about the first epoch is right?
        choices:
          - text: >
              It is mostly wasted, since the early gradients are noisy.
            feedback: >
              Noisy, but unbiased and cheap: $10{,}000$ moves where full-batch
              descent makes one. From far away, those moves cover most of the
              ground.
          - text: >
              It usually does most of the work, because $10{,}000$ rough
              downhill steps beat one exact step.
            correct: true
            feedback: >
              Precision matters near the optimum, where the noise is the same
              size as the remaining distance. Far from it, frequency wins.
          - text: >
              It equals one full-batch step, since it touches the same records.
            feedback: >
              Same cost, not same progress. Full-batch descent moves once;
              the epoch moves ten thousand times.
        feedback: >
          Asked why not run full-batch descent, say the mini-batch gradient is
          unbiased and $n/b$ times cheaper, and that convergence then needs a
          learning rate that decays.

  - node: quant-statistics.learning.logistic-regression
    hook: >
      "Why can't you just use linear regression to predict a probability?"
      tests whether you know probabilities need constraining to $(0,1)$ and
      that log-odds linearity is exactly how that constraint is arranged.
    explanation: >
      OLS fits a linear index by minimizing squared error and solves it in
      closed form, but for a binary $Y$ that linear index is unbounded and
      squared loss isn't the natural loss for a probability target. Logistic
      regression keeps the same linear index $\eta(x)=\beta_0+\beta_1
      x_1+\dots+\beta_p x_p$ but passes it through $1/(1+e^{-\eta(x)})$ so the
      output lands in $(0,1)$ — equivalently, it models the log-odds
      $\ln\frac{p}{1-p}=\eta(x)$ as linear, so a unit rise in $x_j$
      multiplies the odds by $e^{\beta_j}$, not the probability by a fixed
      amount.

      Fitting maximizes the log-likelihood, equivalently minimizes log loss.
      That objective is convex in $\beta$ — unlike squared error applied
      directly to a sigmoid output, which is not — so there are no local
      minima to worry about, but there is no closed form the way OLS has
      one: it's solved by gradient descent or Newton steps, not a linear
      system.

      Perfectly (or nearly) separable classes push the coefficients toward
      infinity, since the likelihood keeps improving as predictions push
      closer to exactly $0$ or $1$ — no maximum likelihood estimate exists
      there without a penalty.
    worked: >
      With $\beta_0=-2$, $\beta_1=0.5$: at $x=6$, $\eta=-2+0.5(6)=1$, so
      $p=1/(1+e^{-1})\approx 0.731$. At $x=4$, $\eta=0$ and $p=0.5$ — the
      decision boundary. A one-unit increase in $x$ multiplies the odds of
      $Y=1$ by $e^{0.5}\approx 1.649$.
    interview: >
      "Interpret this logistic regression coefficient" wants the
      odds-multiplier answer $e^{\beta_j}$, not "probability goes up by
      $\beta_j$." "Why is the likelihood convex here?" checks whether you
      connect that convexity to why gradient descent is reliable for this
      model.
    pitfalls: >
      Interpreting $\beta_j$ as a probability change — the same one-unit
      step changes probability by different amounts depending on where you
      are on the curve; only the log-odds interpretation is linear. Assuming
      a closed form exists like OLS's normal equations — there isn't one.
      Running unpenalized logistic regression on separable data and getting
      coefficients that silently blow up.
    recap: >
      Logistic regression is a linear model on the log-odds scale, fit by
      maximizing a convex likelihood with no closed form — the default
      classifier every fancier one must beat.
    dialogue:
      - part: A straight line through zeros and ones
        teach: >
          A desk records whether each limit order filled ($Y = 1$) or not
          ($Y = 0$), against its distance from the mid in ticks, $x$. Least
          squares on the $0$/$1$ labels gives the line $\hat p(x) = 0.9 -
          0.25x$, read as the probability of a fill.
      - ask: >
          What fill probability does the line give an order $5$ ticks away?
        expects: "-0.35"
        feedback: >
          $0.9 - 0.25(5) = -0.35$. And at $x = -1$, an order through the mid,
          it gives $1.15$. A line is unbounded, a probability is not.
      - ask: >
          What is the right repair?
        choices:
          - text: >
              Clip the line's output to $[0, 1]$.
            feedback: >
              Clipping hides the symptom. Every order past $3.6$ ticks then
              gets probability exactly $0$, a claim of certainty, and the
              flat clipped region tells the fit nothing about which way to
              move.
          - text: >
              Fit the line to a transformed probability that can take any real
              value.
            correct: true
            feedback: >
              Keep the linear index, which is easy to fit and read, and
              change the scale it lives on so that every value of the index
              maps to a legal probability.
          - text: >
              Square the line's output, so it is never negative.
            feedback: >
              Squaring fixes negativity and leaves values above $1$, and it
              makes $\hat p$ fall and then rise again as $x$ grows, which no
              fill curve does.
        feedback: >
          The question becomes which transformation of $p$ ranges over the
          whole real line.
      - reflect: >
          A probability $p$ lives in $(0, 1)$, and a linear index $\beta_0 +
          \beta_1 x$ lives on the whole real line. Build a function of $p$
          that runs over every real number, so the two can be set equal.
        hint: >
          Start from the odds, $p/(1 - p)$. What range does it cover?
        answer: >
          The odds $p/(1 - p)$ run from $0$ to $\infty$ as $p$ runs from $0$
          to $1$, and their logarithm runs from $-\infty$ to $\infty$. So set
          $\ln\frac{p}{1-p} = \beta_0 + \beta_1 x$: the log-odds are linear.
          Solving for $p$ gives $p = 1/(1 + e^{-(\beta_0 + \beta_1 x)})$,
          which lies strictly between $0$ and $1$ for every $x$.
      - teach: >
          That is logistic regression. Write the linear index $\eta(x) =
          \beta_0 + \beta_1 x_1 + \dots + \beta_p x_p$ and model
          $\Pr(Y = 1 \mid x) = 1/(1 + e^{-\eta(x)})$, equivalently
          $\ln\frac{p}{1-p} = \eta(x)$. A unit rise in $x_j$ adds $\beta_j$ to
          the log-odds, so it multiplies the odds by $e^{\beta_j}$.

      - part: Reading a fitted model
        ask: >
          The fitted model for fills is $\ln\frac{p}{1-p} = 1.2 - 0.6x$. At how
          many ticks from the mid is a fill a coin flip?
        expects: "2"
        hint: >
          $p = 0.5$ means odds of $1$, log-odds of $0$.
        feedback: >
          $1.2 - 0.6x = 0$ at $x = 2$. That is the decision boundary at
          threshold $0.5$.
      - ask: >
          What fill probability does it give an order at the mid, $x = 0$?
        expects: "0.7685"
        tolerance: 0.0005
        feedback: >
          $1/(1 + e^{-1.2}) = 1/(1 + 0.3012) \approx 0.7685$.
      - ask: >
          Each extra tick multiplies the odds of a fill by what factor?
        expects: "0.5488"
        tolerance: 0.0005
        feedback: >
          $e^{-0.6} \approx 0.5488$: each tick roughly halves the odds. The
          coefficient is a statement about odds, not probability.
      - ask: >
          Does one extra tick cut the fill probability by the same amount
          wherever you start?
        choices:
          - text: >
              Yes, by $0.6$ each time
            feedback: >
              $0.6$ is the change in log-odds. A probability cannot fall by
              $0.6$ from $0.3$; the scales are different.
          - text: >
              Yes, by the factor $e^{-0.6}$ each time
            feedback: >
              That factor applies to the odds. From $x = 6$ to $x = 7$ the
              probability goes from $0.0832$ to $0.0474$, a factor of $0.57$,
              not $0.5488$.
          - text: >
              No: the odds fall by the same factor, but the probability falls
              most near $0.5$
            correct: true
            feedback: >
              From $x = 2$ to $3$ the probability falls $0.5 - 0.3543 =
              0.1457$; from $x = 6$ to $7$ it falls only $0.0832 - 0.0474 =
              0.0358$. The curve is steepest in the middle and flat in the
              tails.
        feedback: >
          Interpret a coefficient as a factor $e^{\beta_j}$ on the odds.
          "The probability rises by $\beta_j$" is the answer interviewers
          listen for, and mark wrong.

      - part: Fitting without a formula
        ask: >
          The coefficients are found by maximizing the log-likelihood
          $\sum_i [\,y_i \ln p_i + (1 - y_i)\ln(1 - p_i)\,]$, equivalently
          minimizing log loss. There is no closed form like least squares'
          normal equations. Why is gradient descent a safe way to solve it?
        choices:
          - text: >
              The log-likelihood is concave in $\beta$, so log loss is convex
              and has no local minima to get stuck in.
            correct: true
            feedback: >
              One basin, so any point where the gradient vanishes is the
              global optimum, and a small enough step size gets there.
          - text: >
              Squared error on the sigmoid's output would work just as well;
              any loss is safe here.
            feedback: >
              Squared error composed with the sigmoid is not convex in
              $\beta$, and it can have flat regions and local minima. Log
              loss is the one with the guarantee.
          - text: >
              The sigmoid is bounded, so the iterates cannot run away.
            feedback: >
              The predictions are bounded; the coefficients are not. On some
              data they do run away, as the next question shows.
        feedback: >
          Convex objective, no closed form: solved by gradient descent or
          Newton steps, reliably.
      - ask: >
          In a training sample, every order within $1$ tick of the mid filled
          and every order farther out did not. What happens to $\beta_1$ as
          gradient descent runs?
        choices:
          - text: >
              It converges to a large but finite value.
            feedback: >
              There is no finite maximum to converge to. Any $\beta$ that
              separates the data can be scaled up to push every $p_i$ closer
              to its label, raising the likelihood again.
          - text: >
              It goes to zero, since the model has nothing left to learn.
            feedback: >
              $\beta = 0$ predicts $0.5$ everywhere, the worst fit available
              on perfectly separated data.
          - text: >
              It grows without bound, toward $-\infty$.
            correct: true
            feedback: >
              The likelihood keeps improving as the curve steepens into a
              step at $1$ tick. No maximum-likelihood estimate exists; a
              ridge or lasso penalty restores one.
        feedback: >
          Asked why not use linear regression for a probability, say: a line
          leaves $(0, 1)$, so model the log-odds as linear, fit by convex
          log loss with no closed form, and penalize when the classes
          separate.

  - node: quant-statistics.learning.classification-metrics
    hook: >
      "Your model gets $99\%$ accuracy" is the single most common trap under
      class imbalance, and reaching for precision and recall instead is
      expected on reflex.
    explanation: >
      A fitted probability from logistic regression isn't itself a decision;
      a threshold turns it into a call, and every call lands in one of four
      buckets — true/false positive, true/false negative. Precision asks
      "when I call positive, how often am I right"; recall asks "of all the
      actual positives, how many did I catch." Raising the threshold makes
      positive calls rarer but more selective, so precision rises and recall
      falls — an explicit dial, not two independent numbers.

      $F_1$, the harmonic mean $2PR/(P+R)$, is used instead of an arithmetic
      average because it punishes imbalance harshly: if either precision or
      recall is near zero, $F_1$ stays near zero, while an arithmetic average
      of the same pair can still look moderate.

      With a $1\%$ positive rate, calling every case negative scores $99\%$
      accuracy and exactly $0\%$ recall — accuracy communicates nothing about
      detection ability here. Precision also moves with the base rate: the
      same classifier applied to a population with a different positive
      fraction reports a different precision, so a precision number alone
      describes the problem as much as the classifier.
    worked: >
      A fraud model flags $40$ transactions; $25$ are truly fraud
      ($\mathrm{TP}=25$, $\mathrm{FP}=15$). Of $30$ truly-fraud transactions
      in the batch, $\mathrm{FN}=30-25=5$. Precision $=25/40=0.625$, recall
      $=25/30\approx 0.833$, and $F_1 = 2(0.625)(0.833)/(0.625+0.833)\approx
      0.714$.
    interview: >
      "Walk me through precision and recall for this detector" and "why not
      just use accuracy" want the imbalance argument stated with an actual
      worked number, not just terminology.
    pitfalls: >
      Reporting accuracy as the headline metric under class imbalance.
      Treating precision as a fixed property of the model rather than of
      model, threshold, and base rate together. Optimizing $F_1$ blindly
      when a missed positive and a false alarm don't actually cost the same.
    recap: >
      Precision is the hit rate of positive calls, recall is the share of
      positives caught, and accuracy is meaningless once the classes are
      imbalanced.
    dialogue:
      - part: Two detectors and one score
        teach: >
          A fund's operations team screens $2000$ trades a week for booking
          errors, and $20$ of them are real errors. Detector M1 flags
          nothing. Detector M2 flags $50$ trades, $15$ of which are real
          errors.
      - ask: >
          What fraction of the $2000$ trades does M1 classify correctly?
        expects: "0.99"
        feedback: >
          Calling every trade clean is right on all $1980$ clean trades and
          wrong on the $20$ errors: $1980/2000 = 0.99$.
      - ask: >
          What fraction does M2 classify correctly?
        expects: "0.98"
        hint: >
          Count its correct flags and the clean trades it left alone.
        feedback: >
          $15$ correct flags, and of the $1980$ clean trades it wrongly flagged
          $35$, leaving $1945$. $(15 + 1945)/2000 = 1960/2000 = 0.98$.
      - ask: >
          Which detector would you rather run?
        choices:
          - text: >
              M1: it is right more often.
            feedback: >
              It is right more often by never doing the job. Every booking
              error sails through; the $0.99$ is just the share of clean
              trades.
          - text: >
              M2: it catches $15$ of the $20$ errors, at the cost of $35$
              false flags.
            correct: true
            feedback: >
              The team checks $50$ trades instead of $2000$ and finds three in
              four errors. That is a working detector with a worse accuracy.
          - text: >
              Neither can be judged until accuracy is above $0.99$.
            feedback: >
              With $1\%$ errors, $0.99$ is the score of doing nothing. Accuracy
              is measuring the class balance, not the detector.
        feedback: >
          Under class imbalance, accuracy rewards ignoring the rare class.
      - reflect: >
          You preferred M2 without using accuracy. What two questions were you
          really asking about each detector, and what counts does each
          question need?
        answer: >
          When it flags a trade, how often is the flag right; and of the real
          errors, how many did it catch. The first needs the correct flags
          and the false flags; the second needs the correct flags and the
          errors it missed. Neither involves the $1945$ clean trades left
          alone, which is exactly the count that let M1's accuracy look good.
      - teach: >
          Those are the two standard rates. A threshold turns scores into
          calls, and every case is a true positive $\mathrm{TP}$, false
          positive $\mathrm{FP}$, false negative $\mathrm{FN}$ or true negative
          $\mathrm{TN}$. Precision is $\mathrm{TP}/(\mathrm{TP} +
          \mathrm{FP})$, how often a positive call is right. Recall is
          $\mathrm{TP}/(\mathrm{TP} + \mathrm{FN})$, the share of positives
          caught. $F_1 = 2PR/(P + R)$ is their harmonic mean.

      - part: Clause by clause on M2
        ask: >
          What is M2's precision?
        expects: "0.3"
        feedback: >
          $\mathrm{TP} = 15$, $\mathrm{FP} = 35$: $15/50 = 0.3$. Seven of every
          ten flags waste a checker's time.
      - ask: >
          What is M2's recall?
        expects: "0.75"
        feedback: >
          $\mathrm{FN} = 20 - 15 = 5$, so $15/20 = 0.75$.
      - ask: >
          What is M2's $F_1$?
        expects: "3/7"
        tolerance: 0.0005
        feedback: >
          $2(0.3)(0.75)/(0.3 + 0.75) = 0.45/1.05 = 3/7 \approx 0.4286$,
          pulled toward the weaker of the two.
      - ask: >
          M2 raises its threshold: it now flags $20$ trades, $10$ of them real
          errors. What happened?
        choices:
          - text: >
              Both rates improved, since it makes fewer mistakes.
            feedback: >
              Precision went from $0.3$ to $10/20 = 0.5$, but recall went from
              $0.75$ to $10/20 = 0.5$. Fewer false flags, more missed errors.
          - text: >
              Precision rose to $0.5$ and recall fell to $0.5$.
            correct: true
            feedback: >
              A higher threshold makes positive calls rarer and more
              selective. You buy precision with recall; the threshold is the
              dial between them.
          - text: >
              Precision fell, because it flags fewer trades.
            feedback: >
              Fewer flags, but a larger share of them right: $10$ of $20$
              against $15$ of $50$. Precision rose.
        feedback: >
          Precision and recall are not two independent scores of a model; they
          are two ends of one threshold.

      - part: Where the numbers mislead
        ask: >
          Detector M3 flags a single trade, and it is a real error. Its
          precision is $1$ and its recall $0.05$, so their plain average is
          $0.525$. What is its $F_1$?
        expects: "0.0952"
        tolerance: 0.0005
        feedback: >
          $2(1)(0.05)/(1 + 0.05) = 0.1/1.05 = 2/21 \approx 0.0952$. The
          harmonic mean stays near the smaller rate, so a detector cannot buy
          a good score by being perfect on one call.
      - ask: >
          Run M2 unchanged on a busier week: $200$ real errors among the same
          $1980$ clean trades. It still catches $75\%$ of errors and still
          falsely flags $35$ clean trades. What is its precision now?
        expects: "0.8108"
        tolerance: 0.0005
        feedback: >
          $\mathrm{TP} = 0.75(200) = 150$, $\mathrm{FP} = 35$: $150/185
          \approx 0.8108$, up from $0.3$ with the same detector. Precision
          depends on the base rate, so it describes the week as much as the
          model. Asked why not accuracy, say: with $1\%$ positives, flagging
          nothing scores $99\%$; report precision and recall, and the base
          rate they were measured at.

  - node: quant-statistics.learning.roc-auc
    hook: >
      "What does an AUC of $0.8$ actually mean?" has one correct answer — a
      specific probability statement — and most candidates only manage
      "good separation."
    explanation: >
      Where precision and recall fix one threshold, sweeping the threshold
      across its entire range and plotting true positive rate against false
      positive rate traces the ROC curve from $(0,0)$ (nothing called
      positive) to $(1,1)$ (everything called positive); its area is the
      AUC.

      The clean reading is a probability: $\mathrm{AUC} =
      \Pr(\text{random positive scores above random negative})$, counting
      ties as half. Because it only depends on the relative ranking of
      scores, AUC is unchanged by any strictly increasing transform of the
      score — it never sees the raw calibrated value, only the order.

      That same ranking-only property means AUC is blind to class balance:
      true and false positive rates are each normalized within their own
      class, so changing the mix of positives and negatives in the
      evaluation set doesn't move the curve at all — the opposite of
      precision, which does move with the base rate. That blindness is also
      the trap: a model at AUC $0.8$ under a $1\%$ positive rate can rank
      well overall while still producing a flood of false alarms in absolute
      count at any usable threshold, so read a precision-recall curve
      alongside it.
    worked: >
      Three positives score $0.9, 0.6, 0.4$ and three negatives score $0.8,
      0.5, 0.2$. Checking all nine pairs: the positive $0.9$ beats all three
      negatives ($3$ wins), $0.6$ beats $0.5$ and $0.2$ but not $0.8$ ($2$
      wins), and $0.4$ beats only $0.2$ ($1$ win). Total: $6$ of $9$ pairs,
      so $\mathrm{AUC}=6/9\approx 0.667$.
    interview: >
      "What does AUC of $0.8$ mean in plain English?" wants exactly the
      pairwise-ranking probability. "Does AUC change if I double the number
      of negatives in my test set?" wants a confident no — contrasted with
      precision, which would.
    pitfalls: >
      Reading AUC as a percentage of cases correctly classified — no
      threshold is fixed, so that reading doesn't apply. Assuming high AUC
      guarantees a usable classifier at some chosen threshold; it says
      nothing about calibration or precision there. Comparing AUCs across
      differently-sampled test sets as if that also validated precision-based
      comparisons.
    recap: >
      AUC is the probability a random positive outranks a random negative —
      blind to threshold and to class balance, unlike precision.
    dialogue:
      - part: Every threshold at once
        teach: >
          A default model scores five borrowers. The three who later defaulted
          (positives) score $0.8$, $0.7$ and $0.3$; the two who did not
          (negatives) score $0.6$ and $0.2$. You call a borrower positive when
          the score is at least a threshold.
      - ask: >
          At threshold $0.5$, what fraction of the positives do you catch, the
          true positive rate?
        expects: "2/3"
        tolerance: 0.0005
        feedback: >
          $0.8$ and $0.7$ clear it, $0.3$ does not: $\mathrm{TPR} = 2/3$.
      - ask: >
          At the same threshold, what fraction of the negatives do you wrongly
          call positive, the false positive rate?
        expects: "0.5"
        feedback: >
          $0.6$ clears it and $0.2$ does not: $\mathrm{FPR} = 1/2$. One
          threshold, one point $(\mathrm{FPR}, \mathrm{TPR}) = (1/2, 2/3)$.
      - teach: >
          Lower the threshold from above $0.8$ to below $0.2$ and the point
          moves through $(0, 0)$, $(0, 1/3)$, $(0, 2/3)$, $(1/2, 2/3)$,
          $(1/2, 1)$ and $(1, 1)$: up one step for each positive passed, right
          one step for each negative. Joined up, that staircase is the ROC
          curve.
      - ask: >
          What is the area under that staircase?
        expects: "5/6"
        tolerance: 0.0005
        hint: >
          Two rectangles: one from $\mathrm{FPR} = 0$ to $1/2$, one from $1/2$
          to $1$.
        feedback: >
          Height $2/3$ over width $1/2$, plus height $1$ over width $1/2$:
          $1/3 + 1/2 = 5/6$.
      - reflect: >
          There are $3 \times 2 = 6$ ways to pair a positive with a negative,
          and the area came out $5/6$. Count the pairs in which the positive
          scores higher, and explain why the area must count exactly that.
        hint: >
          Each step right happens at one negative's score. How high is the
          staircase at that moment?
        answer: >
          Five of six pairs have the positive above: $0.8$ and $0.7$ beat both
          negatives, $0.3$ beats only $0.2$. Each negative adds a strip of
          width $1/2$ whose height is the share of positives already passed,
          those scoring above it. So the area is the average, over negatives,
          of the fraction of positives above each one: the probability that a
          random positive outscores a random negative.
      - teach: >
          That area is the AUC. Plotting $\mathrm{TPR} = \mathrm{TP}/(\mathrm{TP}
          + \mathrm{FN})$ against $\mathrm{FPR} = \mathrm{FP}/(\mathrm{FP} +
          \mathrm{TN})$ over every threshold gives the ROC curve from $(0, 0)$
          to $(1, 1)$, and $\mathrm{AUC} = \Pr(\text{a random positive scores
          above a random negative})$, ties counting half. $0.5$ is a coin
          flip; $1$ is perfect ranking.

      - part: A ranking, not a calibration
        ask: >
          A second model scores positives $0.9$ and $0.4$ and negatives $0.4$
          and $0.1$. With ties counting half, what is its AUC?
        expects: "7/8"
        tolerance: 0.0005
        feedback: >
          Four pairs: $0.9$ beats both negatives, $0.4$ beats $0.1$, and $0.4$
          against $0.4$ is a tie worth $1/2$. $3.5/4 = 7/8$.
      - ask: >
          You square every score of the first model, so $0.8$ becomes $0.64$
          and so on. What happens to its AUC?
        choices:
          - text: >
              It falls, because every score is now smaller.
            feedback: >
              Every score fell, positives and negatives alike, and their order
              did not change. AUC only reads the order.
          - text: >
              It stays $5/6$.
            correct: true
            feedback: >
              Squaring is increasing on $[0, 1]$, so every pairwise comparison
              comes out the same. Any increasing transform leaves AUC alone.
          - text: >
              It changes unless the model is recalibrated.
            feedback: >
              Calibration is about whether a score of $0.7$ means a $70\%$
              chance. AUC never asks that; it only asks which of two scores is
              higher.
        feedback: >
          AUC is a ranking statistic: blind to the threshold and to the
          scale of the scores.

      - part: What AUC cannot see
        ask: >
          Back to the first model at threshold $0.5$, where its precision is
          $2/3$. Now the population holds ten times as many negatives, with
          the same score distribution: ten borrowers at $0.6$ and ten at
          $0.2$. Its AUC is still $5/6$. What is its precision at threshold
          $0.5$?
        expects: "1/6"
        tolerance: 0.0005
        feedback: >
          Still $2$ true positives, but now $10$ false positives at $0.6$:
          $2/(2 + 10) = 1/6$. TPR and FPR are each computed within their own
          class, so the curve did not move; precision mixes the classes, so it
          collapsed.
      - ask: >
          A model with AUC $0.8$ runs on a book where $1\%$ of borrowers
          default. What does the AUC tell you about its precision at the
          threshold you would deploy?
        choices:
          - text: >
              It is about $0.8$ as well.
            feedback: >
              AUC is not attached to any threshold. With $99$ negatives per
              positive, even a small false positive rate can bury the true
              positives.
          - text: >
              Nothing on its own: check a precision–recall curve.
            correct: true
            feedback: >
              Good ranking and useless precision coexist under heavy
              imbalance, as the tenfold negatives just showed. Read the two
              curves together.
          - text: >
              It is high, because $0.8$ is well above the coin-flip $0.5$.
            feedback: >
              Above $0.5$ says the ranking beats chance. It says nothing about
              how many false alarms come with each true one at a given
              threshold.
        feedback: >
          AUC ignores class balance, which makes it comparable across
          samples and silent about precision.
      - ask: >
          A colleague's model has AUC $0.15$ on held-out data. What is the
          right reading?
        choices:
          - text: >
              It is worse than useless: it ranks worse than a coin flip.
            feedback: >
              Flip its sign and its AUC becomes $1 - 0.15 = 0.85$. It ranks
              well, backwards; a label or sign is inverted somewhere.
          - text: >
              Its scores carry strong ranking information, reversed.
            correct: true
            feedback: >
              Reversing every score reverses every pairwise comparison, so
              the AUC becomes $0.85$. The bug is in the sign, not the signal.
          - text: >
              It means $15\%$ of cases are classified correctly.
            feedback: >
              AUC is not a share of cases classified, since no threshold is
              fixed. It is a probability over positive-negative pairs.
        feedback: >
          Asked what an AUC of $0.8$ means, say: pick a random positive and a
          random negative, and $80\%$ of the time the positive scores higher.

  - node: quant-statistics.learning.trees-ensembles
    hook: >
      Trees, bagging, random forests, and boosting get conflated constantly;
      the interview wants each one placed cleanly on the bias-variance map,
      not a list of names.
    explanation: >
      A regression tree splits recursively to most reduce squared error and
      predicts each leaf's mean, with depth as its complexity dial. A deep
      tree is nearly unbiased — flexible enough to track almost any local
      structure — but high-variance, since a small change in training data
      can reshuffle an early split and cascade into a completely different
      partition. It sits at the far end of the bias-variance tradeoff: low
      bias, high variance.

      Bagging attacks variance directly by averaging $B$ trees fit to
      bootstrap resamples, leaving each individual tree's bias untouched. The
      variance of that average, for identically distributed fits with
      pairwise correlation $\rho$, is $\rho\sigma^{2}+(1-\rho)\sigma^{2}/B$:
      the second term vanishes as $B$ grows, but $\rho\sigma^{2}$ remains as
      a floor no additional trees can remove. Random forests lower that floor
      by decorrelating the trees — sampling a random subset of features at
      each split — rather than by growing more of them.

      Boosting works the opposite axis: small, shallow (biased) trees grown
      sequentially on residuals, each round attacking whatever bias remains.
      Because it keeps reducing bias every round, it eventually overfits
      unless stopped early — the same U-shaped tradeoff, now playing out
      across boosting rounds instead of a single dial.
    worked: >
      With per-tree variance $\sigma^{2}=0.09$ and pairwise correlation
      $\rho=0.25$: at $B=4$ trees, variance $= 0.25(0.09)+0.75(0.09)/4 =
      0.0225+0.016875=0.039375$. At $B=100$, variance $=
      0.0225+0.000675=0.023175$. Going from $4$ to $100$ trees barely helps
      past that point — the $0.0225$ correlation floor never goes away no
      matter how many trees are added; only lowering $\rho$ does.
    interview: >
      "Why does a random forest decorrelate features at each split instead
      of just growing more trees?" wants the correlation-floor argument with
      the formula named. "Is boosting more prone to overfitting than
      bagging?" wants the bias-attack-versus-variance-attack distinction.
    pitfalls: >
      Assuming more trees in a random forest keep helping indefinitely — they
      saturate at $\rho\sigma^{2}$. Running boosting for as many rounds as
      compute allows with no stopping rule, unlike bagging which is nearly
      safe to over-supply. Thinking bagging reduces bias — it never touches
      bias, only averages away variance.
    recap: >
      Deep trees are low-bias, high-variance; bagging and random forests
      average that variance away up to a correlation floor, while boosting
      attacks bias and needs early stopping.
    dialogue:
      - part: One cut through six points
        teach: >
          Six days of a signal $x = 1, 2, \dots, 6$ (sorted) came with next-day
          moves $y = 2, 4, 3, 10, 12, 11$. You may predict one constant, or
          cut the $x$-axis once and predict a separate constant on each side.
      - ask: >
          Predicting one constant, the mean, what is the sum of squared
          errors?
        expects: "100"
        feedback: >
          The mean is $42/6 = 7$, and $25 + 9 + 16 + 9 + 25 + 16 = 100$.
      - ask: >
          With the best single cut, each side predicting its own mean, what
          sum of squared errors remains?
        expects: "4"
        hint: >
          Look for where $y$ jumps.
        feedback: >
          Cut between $x = 3$ and $x = 4$: the left side has mean $3$ and
          squared errors $1 + 1 + 0 = 2$, the right side mean $11$ and $2$.
          Total $4$, down from $100$.
      - ask: >
          Keep cutting until every leaf holds one day. What are that tree's
          training error and its likely behaviour on new days?
        choices:
          - text: >
              Training error $0$, and low variance, since it fits every
              point exactly
            feedback: >
              Fitting every point exactly is the high-variance end: each leaf
              is a single noisy observation, and a slightly different six days
              gives a different tree.
          - text: >
              Training error $0$; nearly unbiased but high-variance
            correct: true
            feedback: >
              A deep tree can follow almost any shape, so its bias is small.
              It also follows every point's noise, and one changed point can
              move an early cut and reshape everything below it.
          - text: >
              Training error $4$, since the first cut already did the work
            feedback: >
              Every further cut can only lower training error, down to $0$
              when each leaf holds one point. The first cut did the useful
              work; the rest fits noise.
        feedback: >
          A regression tree takes, at each node, the cut that most reduces
          squared error and predicts each leaf's mean. Depth is its dial, and a
          deep tree sits at the low-bias, high-variance end.

      - part: Averaging trees, and what it cannot remove
        ask: >
          At a fixed point a deep tree's prediction has variance $0.5$ across
          training sets. If you could average $10$ trees grown on independent
          training sets, what would the variance of the average be?
        expects: "0.05"
        feedback: >
          $0.5/10 = 0.05$. Averaging leaves the bias where it was and divides
          the variance by the number of independent fits.
      - reflect: >
          You do not have $10$ independent training sets; you have one. You
          can grow trees on bootstrap resamples of it, but those trees are
          correlated. What part of the variance can averaging them never
          remove, and what would you have to change to shrink that part?
        hint: >
          Think about what all the resampled trees share.
        answer: >
          Every resample comes from the same data, so every tree inherits the
          same quirks of that data and errs in the same direction. That
          shared error is common to all trees, and averaging copies of the
          same error leaves it intact. Only the part of each tree's error that
          is its own averages away; to shrink the shared part you must make
          the trees less alike, not more numerous.
      - teach: >
          That is bagging: average $B$ trees fitted to bootstrap resamples.
          For identically distributed fits with variance $\sigma^{2}$ and
          pairwise correlation $\rho$, the average has variance
          $\rho\sigma^{2} + (1 - \rho)\sigma^{2}/B$. The second term dies as
          $B$ grows; $\rho\sigma^{2}$ is a floor that no number of trees
          removes.
      - ask: >
          With $\sigma^{2} = 0.5$ and $\rho = 0.4$, what is the variance of the
          average of $B = 10$ bagged trees?
        expects: "0.23"
        feedback: >
          $0.4(0.5) + 0.6(0.5)/10 = 0.2 + 0.03 = 0.23$, already close to the
          floor of $0.2$.
      - ask: >
          Doubling to $B = 20$ gives $0.2 + 0.015 = 0.215$. Instead keep
          $B = 10$ and cut the correlation to $\rho = 0.2$. What is the
          variance now?
        expects: "0.14"
        feedback: >
          $0.2(0.5) + 0.8(0.5)/10 = 0.1 + 0.04 = 0.14$, far below $0.215$.
          Decorrelating beats adding trees once you are near the floor.
      - ask: >
          How does a random forest lower $\rho$?
        choices:
          - text: >
              By growing each tree on a larger bootstrap sample
            feedback: >
              Larger resamples overlap more, so the trees become more alike,
              not less.
          - text: >
              By letting each split choose only among a random subset of
              features
            correct: true
            feedback: >
              One strong feature would otherwise take the first cut in every
              tree, making them near-copies. Forcing some splits to do without
              it makes the trees disagree, and their errors partly cancel.
          - text: >
              By pruning every tree to depth $2$
            feedback: >
              Shallow trees have less variance each, but they also have more
              bias, and pruning does nothing to make them disagree with each
              other.
        feedback: >
          Bagging and random forests attack variance and leave each tree's
          bias untouched.

      - part: Attacking the other term
        ask: >
          Boosting grows small, shallow trees one after another, each fitted to
          the residuals the previous ones left. Which term does it attack?
        choices:
          - text: >
              Variance, like bagging, since it also combines many trees
            feedback: >
              Combining is not averaging. Each new tree corrects what the sum
              so far gets wrong, which is a systematic error, not a random
              wobble.
          - text: >
              Bias: shallow trees start too simple, and each round removes some
              of the remaining systematic error
            correct: true
            feedback: >
              A depth-$2$ tree is badly biased on its own. Summing hundreds of
              them, each aimed at the residual, builds a flexible fit one step
              at a time.
          - text: >
              The noise floor, since residuals contain the noise
            feedback: >
              The noise is a floor no model gets under. A booster that keeps
              fitting residuals eventually fits that noise, which is the
              problem, not the achievement.
        feedback: >
          Bagging works the variance side, boosting the bias side.
      - ask: >
          You can afford $5000$ rounds of boosting or $5000$ bagged trees.
          Which needs a stopping rule chosen on held-out data?
        choices:
          - text: >
              Bagging: past the floor, extra trees overfit.
            feedback: >
              Extra bagged trees only shrink the $(1 - \rho)\sigma^{2}/B$ term
              toward zero. They waste compute; they do not overfit.
          - text: >
              Neither: more of either is always at least as good.
            feedback: >
              True for bagging, false for boosting. Each boosting round adds
              flexibility, and the held-out error is U-shaped in the number of
              rounds.
          - text: >
              Boosting: every round lowers bias and adds variance, so it
              eventually overfits.
            correct: true
            feedback: >
              The number of rounds is boosting's complexity dial. Stop early,
              where held-out error bottoms out.
        feedback: >
          Asked to place these on the bias–variance map: deep trees are low
          bias and high variance; bagging and forests average the variance
          down to $\rho\sigma^{2}$; boosting chips away at bias and must be
          stopped early.

  - node: quant-statistics.learning.leakage
    hook: >
      Leakage is the single most common reason a backtest looks great and a
      live strategy loses money — the entire discipline this unit builds
      toward.
    explanation: >
      A feature leaks when it carries information not available at the
      instant the decision it feeds is taken. The canonical case: a signal
      computed from today's closing price, applied to a trade filled at that
      same close. The signal can't be evaluated until the close prints, so a
      backtest that fills at that close is silently assuming the trade
      executes at a price the strategy already knew before deciding to
      trade — unachievable live. The fix is to lag the signal at least one
      bar and fill at the next tradable price.

      Leakage also enters through the pipeline: standardizing, winsorizing,
      or selecting features on the full sample before splitting lets
      statistics computed partly from held-out points influence the fit,
      because the mean or std used inside a training fold was itself
      influenced by rows that fold is supposed to never see. The general test
      covers both cases at once: if any number in the pipeline was computed
      using data the strategy would not have had at decision time, it's
      leakage — refit every such step inside each fold.
    worked: >
      Prices over five days: $100,102,101,105,104$. A signal $=\sgn(\text{close}_t
      - \text{close}_{t-1})$ is computed and, wrongly, backtested as if
      filled at $\text{close}_t$ itself, earning that same day's already-realized
      move: day $2$ gives $+0.02$, day $3$ gives $+0.0098$, day $4$ gives
      $+0.0396$, day $5$ gives $+0.0095$ — every single day is a win by
      construction, summing to about $7.9\%$ over four days, because the
      trade is scored on information it could only have had after the fact.
    interview: >
      "How do you know your backtest doesn't have look-ahead bias?" wants
      the same-bar-fill trap and the full-sample-preprocessing trap named
      concretely, not "we checked for leakage."
    pitfalls: >
      Filling a trade on the same bar its signal was computed from. Fitting
      any preprocessing step — centering, scaling, feature selection — on the
      full sample before splitting. Assuming leakage only concerns literal
      future prices, when reusing the same test set repeatedly during
      hyperparameter search is the identical phenomenon.
    recap: >
      Using information a trade could not have had — same-close signals,
      full-sample preprocessing — inflates a backtest to a level nobody has
      ever earned live.
    dialogue:
      - part: A strategy that never loses
        teach: >
          A stock's open and close over four days are $(40, 41)$, $(41,
          39.5)$, $(39.5, 40)$ and $(40, 42)$. A backtest runs this rule on one
          share: at the open, go long if the day closes above its open and
          short otherwise, and exit at the close.
      - ask: >
          How many points does the backtest make over the four days?
        expects: "5"
        feedback: >
          Long day $1$: $+1$. Short day $2$: $+1.5$. Long day $3$: $+0.5$.
          Long day $4$: $+2$. Total $5$, with no losing day.
      - ask: >
          What does a backtest with no losing days tell you here?
        choices:
          - text: >
              The signal is strong, but four days is too few to be sure.
            feedback: >
              More days would not help: this rule never loses on any day,
              ever. A perfect record that more data cannot spoil is not a
              sample of skill.
          - text: >
              The rule is using something it could not have known when it
              traded.
            correct: true
            feedback: >
              It decides at the open using the close, which does not exist
              until hours after the fill. It is grading itself on the answer.
          - text: >
              It is fine as long as transaction costs are included.
            feedback: >
              Costs would trim $5$ points, but the rule would still win every
              day. The problem is not a missing cost; it is a decision that
              could not have been made.
        feedback: >
          A record this clean is a symptom, not a result.
      - reflect: >
          Before writing down any rule about backtests: what exactly should
          you compare to catch this, for every number the strategy uses?
        hint: >
          Two times are involved in every trade.
        answer: >
          For each input, compare when it becomes available with when the
          decision it feeds is taken. The close is available at the close; the
          decision is taken at the open, hours earlier. Any input that becomes
          known after its decision has to go, because a backtest that uses it
          is scoring a trade nobody could have placed, so its profit measures
          nothing about the strategy.
      - teach: >
          That is leakage. A feature leaks when it carries information that was
          not available at the instant the decision it feeds is taken, and a
          backtest built on it measures nothing at all. The canonical case is
          quieter than this one: a signal computed from today's close, filled
          at that same close. The fix is to lag the signal by at least one bar
          and fill at the next tradable price.

      - part: Lag it one bar
        ask: >
          Fix the rule: each day's direction is set by the previous day's
          close-versus-open, so day $1$ has no trade. Trading at the open and
          exiting at the close as before, how many points does it make over
          days $2$ to $4$?
        expects: "0"
        hint: >
          Day $2$ goes long because day $1$ closed up.
        feedback: >
          Day $2$ long: $39.5 - 41 = -1.5$. Day $3$ short, since day $2$ closed
          down: $-(40 - 39.5) = -0.5$. Day $4$ long: $42 - 40 = +2$. Total
          $0$. The $5$ points were all leakage.
      - ask: >
          A different backtest computes its signal from today's close and
          fills the trade at that same close. Is that a leak?
        choices:
          - text: >
              No: the close is a real price that really traded.
            feedback: >
              The price traded; you could not have traded at it with this
              signal. The signal does not exist until the close has printed,
              by which time the close has been and gone.
          - text: >
              Yes: the signal cannot be computed until the close exists, so
              the fill assumes a price the strategy already knew.
            correct: true
            feedback: >
              The decision and the price it trades at are the same instant,
              and the decision needed that price. Lag the signal one bar and
              fill at the next tradable price.
          - text: >
              Only if the position is closed the same day.
            feedback: >
              The leak is in the entry: the fill used a price the decision
              depended on. How long you hold afterwards does not change that.
        feedback: >
          The test is always the same pair of times: when was this number
          known, and when was it used.

      - part: Leaks that are not prices
        ask: >
          A feature takes the values $1$, $2$, $3$ in a training fold and $10$
          in the held-out fold. A researcher standardizes with the mean of the
          whole sample before splitting. What mean does the training fold get
          centred on?
        expects: "4"
        feedback: >
          $(1 + 2 + 3 + 10)/4 = 4$, where the training fold alone would give
          $2$. The held-out point has moved the training data, so the fold's
          model was shaped by a value it was supposed never to see.
      - ask: >
          Why does this count as a leak, when the label was never touched?
        choices:
          - text: >
              It does not; standardizing is harmless without the label.
            feedback: >
              The fit sees the standardized features, and those now depend on
              held-out rows. Any number computed with held-out data and used
              in training carries their information in.
          - text: >
              Because a statistic used in training was computed partly from
              held-out data.
            correct: true
            feedback: >
              Means, standard deviations, winsorizing cutoffs and feature
              rankings computed on the full sample all leak this way. Fit each
              such step inside each training fold and apply it, unchanged, to
              the held-out data.
          - text: >
              Because standardizing must happen after the model is fitted.
            feedback: >
              The order of steps is not the problem. Which data the statistics
              come from is: before fitting is fine, as long as only training
              data feed them.
        feedback: >
          The general rule covers prices and pipelines alike.
      - ask: >
          A desk clips every return at the $1$st and $99$th percentiles of the
          full ten-year sample, then backtests on chronological folds. Leak or
          not?
        choices:
          - text: >
              Not a leak: clipping only removes outliers.
            feedback: >
              The cutoffs were set using all ten years, including years each
              fold treats as the future. A crash in year eight decides how
              year two is clipped.
          - text: >
              A leak: the cutoffs were computed with data each fold should not
              have.
            correct: true
            feedback: >
              Recompute the percentiles from the training data of each fold.
              The fix costs nothing but discipline.
          - text: >
              A leak only if the label is clipped too.
            feedback: >
              Clipping a feature with future-informed cutoffs leaks as surely
              as clipping the label does.
        feedback: >
          Asked how you know a backtest has no look-ahead, name both traps:
          same-bar fills, fixed by lagging the signal and filling at the next
          tradable price, and full-sample preprocessing, fixed by refitting
          every step inside each fold.

  - node: quant-statistics.learning.walk-forward
    hook: >
      "Why doesn't your $10$-fold CV score mean anything for a trading
      strategy?" is asked directly, and the correct answer names two distinct
      failure modes, not just "time matters."
    explanation: >
      Random $k$-fold applied to a time series is a leakage machine of its
      own making: a fold can train on data chronologically after the point
      being predicted, training on the future to predict the past — the same
      "used information it couldn't have had" violation, introduced by the
      split itself rather than by a feature. A second, separate failure
      persists even among folds that stay in the past: autocorrelated
      observations mean neighboring points are near-duplicates, so a shuffled
      split can place a training point right beside its almost-identical test
      twin.

      Walk-forward enforces the arrow of time directly: fit on everything up
      to $t$, test on the block $(t,t+h]$, roll forward, average the block
      losses. An expanding window uses all history; a rolling window keeps a
      fixed lookback and adapts faster under regime change.

      The embargo is the detail that's easy to miss: if the label itself
      looks $h$ steps forward, a training point near the boundary can have a
      label reaching into the test block. Dropping the last $h$ days of each
      training window closes that gap, guaranteeing no label straddles the
      split.
    worked: >
      With $n=30$ days and label horizon $h=3$, naively training on days
      $1$–$20$ and testing on $21$–$30$ fails: the label for training day
      $20$ uses returns through day $23$, which falls inside the test block.
      Embargoing the last $3$ training days fixes it — train through day
      $17$, leave days $18$–$20$ unused, test cleanly from day $21$.
    interview: >
      "Your test Sharpe looked great with $10$-fold CV but fell apart live —
      what went wrong?" wants random-fold leakage on time series named as the
      cause, walk-forward as the fix, and the embargo detail volunteered
      without prompting.
    pitfalls: >
      Using random $k$-fold, or even one random split, on time-ordered data.
      Setting up walk-forward but forgetting the embargo when labels look
      forward — walk-forward alone stops training on the future, it doesn't
      by itself stop a label from straddling the boundary. Using a rolling
      window so short the earliest blocks never had enough training data to
      fit anything meaningful.
    recap: >
      Train on the past, test on the block that follows, and embargo at
      least the label horizon so no label can straddle the split.
    dialogue:
      - part: Shuffled days, overlapping labels
        teach: >
          A daily model predicts each day's label: the return over the next
          $10$ trading days. A researcher scores it with random $5$-fold
          cross-validation over $1000$ days, so the folds are scattered days
          drawn from the whole history.
      - ask: >
          The labels of two consecutive days, $t$ and $t + 1$, each sum ten
          daily returns. How many daily returns do they share?
        expects: "9"
        feedback: >
          Day $t$'s label covers days $t + 1$ to $t + 10$, day $t + 1$'s covers
          $t + 2$ to $t + 11$. They share nine of their ten returns.
      - ask: >
          Day $t$ lands in a test fold and days $t - 1$ and $t + 1$ land in
          training. What has the model effectively seen?
        choices:
          - text: >
              Nothing about day $t$, since day $t$ itself was held out.
            feedback: >
              Its label was held out, but the labels on either side share nine
              of its ten returns. The model was trained on a near-copy of the
              answer.
          - text: >
              Most of day $t$'s label, through its neighbours' labels.
            correct: true
            feedback: >
              And day $t + 1$ also lies in the future of day $t$: the model
              learned from returns that had not happened when day $t$'s
              prediction would have been made.
          - text: >
              Only noise, since neighbouring days are independent draws.
            feedback: >
              Overlapping labels are anything but independent: consecutive
              ones are nine-tenths the same sum.
        feedback: >
          Random folds on this series fail twice: they train on the future,
          and they put near-duplicates on both sides of every split.
      - reflect: >
          Design a split that fixes both failures. What must be true of every
          training day relative to the test days, and how far apart must the
          two sets be?
        hint: >
          One fix is about order, the other about the label's reach.
        answer: >
          Every training day must come before every test day, so nothing is
          learned from the future. And the last training day's label must
          finish before the first test day begins: with $10$-day labels, leave
          a gap of at least $10$ days between the end of training and the
          start of testing, so no training label shares a single return with
          the test block. Then score one block, move forward, and repeat.

      - part: Walking forward
        teach: >
          That is walk-forward validation. Fit on everything up to time $t$,
          evaluate on the block $(t, t + h]$, roll forward, and average the
          block losses. Between training and test sits an embargo at least as
          long as the label horizon, so no label straddles the split. The
          window can expand, keeping all history, or roll, keeping a fixed
          lookback.
      - ask: >
          With $10$-day labels (the label of day $t$ uses returns through day
          $t + 10$), a test block starts on day $301$. What is the last day you
          may train on?
        expects: "290"
        hint: >
          The last training label must end before day $301$.
        feedback: >
          Day $290$'s label runs through day $300$, just short of the test
          block; day $291$'s would reach day $301$. Train through $290$ and
          leave days $291$ to $300$ unused for this block.
      - ask: >
          A run produces four test-block losses, $1.10$, $0.95$, $1.30$ and
          $1.05$, from equal-sized blocks. What walk-forward error do you
          report?
        expects: "1.1"
        feedback: >
          $(1.10 + 0.95 + 1.30 + 1.05)/4 = 4.40/4 = 1.1$. Every block was
          predicted by a model fitted only on its past.
      - ask: >
          The market changed regime two years ago. Expanding or rolling
          window?
        choices:
          - text: >
              Expanding: more data always means lower variance.
            feedback: >
              More data from the old regime lowers variance and adds bias:
              the model keeps fitting a law that no longer holds.
          - text: >
              Rolling: a fixed lookback lets the old regime drop out.
            correct: true
            feedback: >
              You trade variance for relevance. A rolling window fits on
              less data, so each block's model is noisier, but it stops
              averaging in a market that is gone.
          - text: >
              Neither: regime changes make walk-forward invalid.
            feedback: >
              Walk-forward is how you would see the regime change at all: the
              block losses after it are worse, and a rolling window recovers
              sooner.
        feedback: >
          Expanding for a stable law, rolling for a drifting one.

      - part: The gap that is easy to forget
        ask: >
          Same $10$-day labels and test block starting on day $301$, but the
          embargo is only $5$ days, so training ends on day $295$. How many
          training labels reach into the test block?
        expects: "5"
        hint: >
          Which training days have labels ending on day $301$ or later?
        feedback: >
          Days $291$ through $295$: day $291$'s label ends on $301$, day
          $295$'s on $305$. Five training labels share returns with the test
          block, and the score is optimistic.
      - ask: >
          A colleague keeps random $5$-fold but adds a $10$-day embargo on each
          side of every test fold. Is that walk-forward?
        choices:
          - text: >
              Yes: the embargo was the only missing piece.
            feedback: >
              The embargo stops labels straddling the split. It does not stop
              the folds after a test fold from training the model that
              predicts it.
          - text: >
              No: the training set still includes days after the test days.
            correct: true
            feedback: >
              Walk-forward fixes the order, the embargo fixes the overlap.
              Each does one job, and you need both.
          - text: >
              No: embargoes only work with expanding windows.
            feedback: >
              Embargoes work with either window. What this design lacks is the
              arrow of time.
        feedback: >
          The order and the gap are separate fixes for separate failures.
      - ask: >
          What does walk-forward cost you, compared with random $5$-fold on
          the same $1000$ days?
        choices:
          - text: >
              Nothing: it uses the data at least as well.
            feedback: >
              The first years are never tested, since there is nothing before
              them to train on, and the earliest blocks' models are fitted on
              little history.
          - text: >
              Fewer test points, and thin training data in the early blocks.
            correct: true
            feedback: >
              Random folds score all $1000$ days; walk-forward scores only the
              days after the first training window and its embargo. That is
              the price of a number you can believe.
          - text: >
              More compute only; the estimate is otherwise the same.
            feedback: >
              The estimate is not the same: random folds were optimistic for
              the reasons you just found. Walk-forward's number is usually
              higher, and honest.
        feedback: >
          Asked why a $10$-fold score means nothing for a trading strategy,
          name both failures, training on the future and overlapping labels,
          then give the fix: walk forward, with an embargo at least as long as
          the label horizon.

  - node: quant-statistics.learning.backtest-overfitting
    hook: >
      "I backtested a thousand variants and the best had a great Sharpe —
      should I trade it?" is close to the single most-asked question in this
      unit, and the answer is a specific number, not a shrug.
    explanation: >
      Searching $N$ strategies is itself capacity in the sense already
      established — every configuration tried after looking at the data
      spends some — and here that capacity has an explicit price. Each of $N$
      genuinely zero-edge strategies has an in-sample Sharpe estimate that
      behaves like a standard normal scaled by $1/\sqrt T$, and the expected
      maximum of $N$ independent standard normals grows like $\sqrt{2\ln N}$.
      Combining the two: the best backtest Sharpe out of pure noise is about
      $\sqrt{2\ln N}/\sqrt T$. With $N=1000$ and $T=4$:
      $\sqrt{2\ln 1000}=\sqrt{13.816}\approx 3.717$, divided by $\sqrt 4=2$
      gives about $1.86$ — a strong-looking Sharpe from strategies with zero
      real edge.

      The winner's in-sample Sharpe is a selection statistic — the maximum
      over $N$ draws — not an unconditional estimate of that one strategy's
      edge the way a single pre-registered backtest's Sharpe would be.

      The defenses mirror multiple-testing exactly, applied to a maximum
      instead of a rejection count: log every configuration tried, including
      the abandoned ones, since the correction is impossible without $N$;
      deflate the reported Sharpe by the noise benchmark for that $N$ and
      $T$; and reserve a period of data no variant has ever touched.
    worked: >
      With a smaller, more realistic search — $N=100$ strategies over $T=9$
      years — the noise benchmark is $\sqrt{2\ln 100}/\sqrt 9 =
      \sqrt{9.210}/3 \approx 3.035/3 \approx 1.01$: even a modest search of
      $100$ strategies over nine years produces a best in-sample Sharpe
      around $1.0$ with zero true edge anywhere.
    interview: >
      "I tried $500$ variants and the best had Sharpe $2.1$ over $3$ years —
      should I trust it?" wants $\sqrt{2\ln N}/\sqrt T$ computed on the spot
      as the noise benchmark, with Bonferroni-style deflation named as the
      fix.
    pitfalls: >
      Reporting a winning backtest's Sharpe without ever disclosing how many
      variants were tried — the correction is impossible to apply without
      $N$. Computing the noise benchmark using only the final candidates
      presented rather than every configuration ever tried, abandoned ones
      included. Treating a Sharpe that clears $\sqrt{2\ln N}/\sqrt T$ as
      proof of edge — clearing the noise bar is necessary, not sufficient; a
      genuinely reserved out-of-sample period is still the real test.
    recap: >
      Search $1000$ zero-edge strategies over four years and the best shows a
      Sharpe near $1.9$ from noise alone — the number of trials is part of
      the result, not a footnote to it.
    dialogue:
      - part: One strategy, then two hundred
        teach: >
          A researcher shows you a strategy with an annualized Sharpe ratio of
          $1.4$ over a $4$-year backtest. It is the best of $200$ variants she
          tried: lookbacks, thresholds, universes. Start with a single
          strategy that has no edge at all. Over $T$ years its estimated
          Sharpe ratio is roughly normal with mean $0$ and standard error
          $1/\sqrt{T}$.
      - ask: >
          What is the standard error of a zero-edge strategy's Sharpe estimate
          over $4$ years?
        expects: "0.5"
        feedback: >
          $1/\sqrt{4} = 0.5$. Four years of noise moves a Sharpe estimate by
          about half a unit either way.
      - ask: >
          What is the probability that one zero-edge strategy shows a
          $4$-year Sharpe of at least $1.0$?
        expects: "0.0228"
        tolerance: 0.0005
        hint: >
          How many standard errors is $1.0$?
        feedback: >
          $1.0/0.5 = 2$ standard errors, and $\Pr(Z \ge 2) \approx 0.0228$. For
          one strategy tested once, a Sharpe of $1.0$ would be a rare fluke.
      - ask: >
          Across $200$ independent zero-edge variants, how many do you expect
          to show a Sharpe of at least $1.0$?
        expects: "4.55"
        tolerance: 0.01
        feedback: >
          $200 \times 0.02275 = 4.55$. The chance that at least one does is
          $1 - 0.97725^{200} \approx 0.99$. The fluke is now close to certain.
      - ask: >
          So is the researcher's $1.4$ evidence of edge?
        choices:
          - text: >
              Yes: $1.4$ is almost three standard errors above zero.
            feedback: >
              Three standard errors is rare for one strategy tested once. This
              one is the maximum of $200$, and the maximum of $200$ draws sits
              far out in the tail by construction.
          - text: >
              It cannot be judged without the distribution of the best of
              $200$ zero-edge Sharpes.
            correct: true
            feedback: >
              The right comparison is not zero; it is what the winner of this
              search would show if nothing worked.
          - text: >
              No: any strategy chosen from many is worthless.
            feedback: >
              A real edge can win a search too. The question is whether this
              winner beats what the search produces from noise alone, which is
              a number you can compute.
        feedback: >
          The winner's backtest Sharpe is a selection statistic: the maximum
          over $N$ tries, not an estimate of one strategy's edge.
      - reflect: >
          You need a benchmark: the Sharpe the best of $N$ zero-edge
          strategies would show over $T$ years. What two ingredients does it
          combine, and which way does each of $N$ and $T$ push it?
        hint: >
          One ingredient is about the maximum of many draws, the other about
          the size of one draw's noise.
        answer: >
          It multiplies how far the largest of $N$ standard normals typically
          lands by the standard error of one Sharpe estimate, $1/\sqrt{T}$.
          More variants push the maximum further into the tail, so the
          benchmark rises with $N$; more years shrink the noise in each
          estimate, so it falls with $T$. The search itself is a fit, and this
          is its optimism in Sharpe units.

      - part: The noise benchmark
        teach: >
          The largest of $N$ independent standard normals is about
          $\sqrt{2\ln N}$. So searching $N$ zero-edge strategies over $T$
          years yields a best backtest Sharpe near $\sqrt{2\ln N}/\sqrt{T}$,
          out of pure noise. The defences are the multiple-testing ones: count
          every configuration tried, deflate the reported Sharpe by the number
          of trials, and reserve a period no variant has touched.
      - ask: >
          What is the noise benchmark for the researcher's search, $N = 200$
          over $T = 4$ years?
        expects: "1.6276"
        tolerance: 0.001
        feedback: >
          $\sqrt{2\ln 200} = \sqrt{10.597} \approx 3.255$, and $3.255/2
          \approx 1.628$. Her $1.4$ is below what the best of $200$ worthless
          strategies would typically show. The search explains it entirely.
      - ask: >
          She wants to halve that benchmark for her next study. What does it
          take?
        choices:
          - text: >
              Try half as many variants.
            feedback: >
              $N$ enters through $\sqrt{\ln N}$, which barely moves: $N = 100$
              gives $\sqrt{2\ln 100}/2 \approx 1.52$, not $0.81$.
          - text: >
              Four times as many years of data.
            correct: true
            feedback: >
              The benchmark falls like $1/\sqrt{T}$, so $16$ years instead of
              $4$ halves it. History is the expensive lever and the one that
              works.
          - text: >
              Twice as many years of data.
            feedback: >
              Twice the years divides the benchmark by $\sqrt{2} \approx
              1.41$, not by $2$. The square root is the trap.
        feedback: >
          The number of trials enters gently, the length of history strongly.
          Both belong in the report.

      - part: Counting honestly
        ask: >
          Her write-up shows the $5$ finalists, and she computes the benchmark
          with $N = 5$. What is wrong?
        choices:
          - text: >
              Nothing: only the strategies presented need correcting for.
            feedback: >
              The other $195$ were tried on the same data and lost to the
              winner. They are exactly why the winner looks good, so they
              belong in $N$.
          - text: >
              $N$ must count every configuration tried, abandoned ones
              included.
            correct: true
            feedback: >
              With $N = 5$ the benchmark is $\sqrt{2\ln 5}/2 \approx 0.90$,
              which her $1.4$ clears easily. With the honest $N = 200$ it does
              not. Undisclosed trials make the correction impossible.
          - text: >
              $N$ should be $1$, since only one strategy will be traded.
            feedback: >
              $N = 1$ erases the correction. The search happened whether or
              not its losers are traded.
        feedback: >
          Log every trial as it is run; the correction cannot be rebuilt from
          memory.
      - ask: >
          Most of her $200$ variants are small tweaks of one lookback rule, so
          their backtests are highly correlated. What does that do to the
          benchmark?
        choices:
          - text: >
              Nothing: $N$ is $N$.
            feedback: >
              The $\sqrt{2\ln N}$ figure assumes independent tries.
              Near-identical variants are closer to repeated tries of one
              strategy than to $200$ separate draws.
          - text: >
              $200$ overstates the effective number of independent tries, so
              $\sqrt{2\ln 200}/\sqrt{T}$ is too high a bar.
            correct: true
            feedback: >
              Correlated trials explore less, so the maximum sits less far
              out. The honest benchmark uses an effective $N$, somewhere
              between the number of genuinely different ideas and $200$.
          - text: >
              It makes the benchmark higher, since correlated strategies fail
              together.
            feedback: >
              Failing together means fewer independent chances to get lucky,
              which lowers the expected maximum, not raises it.
        feedback: >
          The formula is a guide for independent trials; the hard part is
          counting how many truly different things were tried.
      - ask: >
          After the search she runs the winner, untouched, on a reserved
          $2$-year period. What Sharpe would sit two standard errors above
          zero there?
        expects: "1.4142"
        tolerance: 0.001
        feedback: >
          The standard error is $1/\sqrt{2} \approx 0.707$, so two of them are
          $\sqrt{2} \approx 1.414$. The reserved period is honest but short,
          and only a large Sharpe there is convincing. Asked about the best
          of many backtests, compute $\sqrt{2\ln N}/\sqrt{T}$ on the spot,
          compare, and say the number of trials is part of the result.
