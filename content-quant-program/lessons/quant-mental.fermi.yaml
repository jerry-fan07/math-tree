unit: quant-mental.fermi
opening: >
  Fermi estimation turns an unknowable number into a product of knowable
  ones: decompose the target into factors you can each bound from lived
  experience, track their errors on the log scale where they stay additive
  rather than compounding, and round hard at every step because the inputs
  never supported more precision than that. Anchors, a unit check, and a
  second independent path keep the chain honest; stating every assumption
  out loud is what actually gets scored, not the final digit. It closes on
  three worked classics — piano tuners, windows in a city, the weight of a
  747 — that show the whole toolkit landing within a factor of two of the
  real answer.
lessons:
  - node: quant-mental.fermi.decomposition
    hook: >
      A Fermi question always opens with a number nobody has memorized —
      the entire skill is refusing to guess it directly and instead
      building it from pieces you have lived enough to know.
    explanation: >
      Nobody has "number of piano tuners in Chicago" or "gallons of gas
      pumped in Texas" stored in memory, but everyone has lived enough to
      guess a city's population to within a factor of two, or the fraction
      of families that own something, or how many hours a job takes.
      Decomposition swaps the first, unanswerable question for a chain of
      the second, answerable kind: write the target as a product of
      factors — counts, rates, durations, fractions — each chosen so it's
      something you can picture and bound from experience, never a fact
      you'd have to have read somewhere.

      Two disciplines make the chain trustworthy. First, build it
      symbolically before touching a number: name the factors and confirm
      their units cancel to the target, the same way you'd set up an
      algebra problem before substituting. Second, choose factors that are
      independent of each other's error — if two factors are guessed from
      the same shaky intuition, their errors move together and the
      chain's exposure to that one bad guess doubles, whereas factors
      drawn from unrelated experience tend to miss in different directions
      and partly wash out in the product.

      This is why a five-factor chain, each individually good only to
      within a factor of $2$–$3$, still lands within an order of magnitude
      rather than being off by that factor five times over: the
      overestimates and underestimates partially offset instead of
      stacking. That cancellation is the entire reason decomposition beats
      a single confident guess.
    worked: >
      Estimate the number of gas stations in the United States. Population
      $\approx3.3\times10^{8}$; say $0.8$ cars per person, giving
      $\approx2.6\times10^{8}$ cars. Each car burns roughly $500$ gallons
      a year, so total consumption is $\approx2.6\times10^{8}\times500=
      1.3\times10^{11}$ gallons a year. A typical station pumps on the
      order of $1.5\times10^{6}$ gallons a year. Stations needed:
      $1.3\times10^{11}/1.5\times10^{6}\approx87{,}000$ — the real count
      is around 145,000, well within Fermi range.
    interview: >
      Interviewers open with exactly this shape — "how many piano
      tuners...", "how many gas stations..." — and grade the
      factorization, not the final digit: can you name factors that are
      genuinely independent guesses rather than one guess wearing several
      disguises. State each factor as you choose it and keep the chain
      symbolic until the end.
    pitfalls: >
      Reaching for a number you half-remember from a headline instead of
      one you can justify from lived experience — a recalled fact you
      can't defend under a follow-up is worse than an honest guess.
      Picking factors that are secretly correlated, both driven by the
      same underlying guess, so their errors compound instead of
      canceling.
    recap: >
      Replace one unguessable number with a product of independently
      guessable factors, built symbolically and substituted last.

  - node: quant-mental.fermi.anchor-inventory
    hook: >
      Every decomposition bottoms out in a handful of raw counts —
      population, households, a rate per year — and if those aren't
      already in memory you're deriving them mid-interview instead of
      estimating with them.
    explanation: >
      A decomposition is only as fast as its raw inputs, and world
      population, a country's population, a big city's size, and the
      household count and size behind it show up in enough estimates that
      re-deriving them each time is wasted motion. Holding a handful cold
      — world population $\approx8\times10^{9}$, US population
      $\approx3.3\times10^{8}$, a big US city proper at $3$ to $8$ million
      with its metro roughly $2$–$3\times$ that, US households
      $\approx1.3\times10^{8}$ at about $2.5$ people each — turns the
      first step of most decompositions into instant recall instead of a
      guess you have to defend.

      The seconds-per-year entry is the clearest case of the underlying
      habit: $365\times24\times3600$ is exact but slow to do in your head,
      while $\pi\times10^{7}$ is close enough (the two agree to three
      significant figures) and is one digit-string to remember instead of
      three numbers to multiply. That's the shape of a good anchor — worth
      memorizing precisely because computing it fresh costs more time than
      the precision it buys back.

      Treat every anchor as good to one significant figure only, and no
      better. Chaining several anchors together doesn't get you extra
      precision; it gets you the same one-sig-fig confidence at every
      step, which is exactly the level decomposition is designed to
      tolerate.
    worked: >
      Roughly how many times does a resting heart beat over $70$ years?
      Use seconds per year $\approx\pi\times10^{7}$: $70$ years is
      $\approx70\times3.14\times10^{7}\approx2.2\times10^{9}$ seconds. At
      a resting rate of $70$ beats a minute, that's $70/60\approx1.17$
      beats a second, so total beats
      $\approx2.2\times10^{9}\times1.17\approx2.6\times10^{9}$ — about 2.6
      billion heartbeats in a lifetime.
    interview: >
      These get fired as sub-questions inside a bigger estimate — "what's
      a reasonable US population figure" — expecting instant, confident
      recall rather than a derivation; hesitating on a basic anchor reads
      as not having done estimation before. Volunteer the anchor before
      being asked for it.
    pitfalls: >
      Treating an anchor as exact and stacking decimal precision from it —
      it's good to one significant figure, no more. Recomputing
      $365\times24\times3600$ from scratch under time pressure instead of
      reaching for $\pi\times10^{7}$, burning seconds you don't have.
    recap: >
      A short table of population, household and seconds-per-year
      figures, each trusted to one significant figure, seeds most
      decompositions for free.

  - node: quant-mental.fermi.log-error
    hook: >
      A decomposition's factors are each honest only to a multiplicative
      factor of two or three, and knowing how those errors combine — not
      worrying about it, and not adding them like ordinary uncertainties —
      is what tells you whether a long chain is still worth trusting.
    explanation: >
      If each factor in a product carries a multiplicative error — trusted
      to within a factor of $2$, ×/÷, say — the errors don't add, they
      multiply: two independent factors each off by up to $2\times$ can
      leave the product off by up to $4\times$, not $2\times$. That's just
      restating that an error rides along with the factor it belongs to,
      and factors combine by multiplication.

      Taking logs turns that multiplicative pile-up into an ordinary sum:
      $\log(\text{total error})=\sum_i\log(\text{error}_i)$, so the tool
      for reasoning about it is the same log arithmetic used everywhere
      else in mental math, not a new one. A factor trusted to a factor of
      $2$ contributes $\log_{10}2\approx0.301$ to that sum; a factor
      trusted only to a factor of $5$ contributes
      $\log_{10}5\approx0.699$ instead — messier factors cost more
      log-budget, and the cost is additive across the chain regardless of
      how many factors there are.

      This is why a long chain doesn't collapse: growth in log space is
      additive and bounded by how many factors you used, not runaway
      multiplicative growth. It also gives a design rule while building
      the decomposition — count the uncertain factors and roughly how
      uncertain each is, and you can predict, before computing anything,
      the order of magnitude of trust the final number deserves.
    worked: >
      A decomposition chains four uncertain factors: three trusted to a
      factor of $2$ and one — a fraction you're genuinely unsure about —
      trusted only to a factor of $5$. Log-error budget:
      $3\times\log_{10}2+\log_{10}5\approx3(0.301)+0.699\approx1.602$.
      Total error factor $\approx10^{1.602}\approx40$, so the final answer
      should be read as good to within about a factor of $40$ either way —
      worse than any one factor, but a bounded, namable range rather than
      an unbounded guess.
    interview: >
      Rarely asked for directly, but a strong finish to any multi-step
      estimate is naming the resulting confidence unprompted — "so I'd
      trust this to within a factor of ten or so" — which signals you
      tracked uncertainty through the whole chain, not only at the end.
    pitfalls: >
      Adding percentage errors instead of multiplying the error factors —
      a factor off by $50\%$ and one off by $100\%$ don't combine to
      "$150\%$ off," they combine multiplicatively. Assuming every factor
      is equally uncertain when one is actually much shakier — that one
      factor dominates the log-error sum and deserves the most scrutiny.
    recap: >
      Multiplicative errors add on the log scale, so a five-factor chain
      each good to a factor of $2$ lands within roughly a factor of $30$,
      not runaway error.

  - node: quant-mental.fermi.geometric-mean-bounds
    hook: >
      Bounds alone don't tell you where inside them to point your final
      guess, and reaching for the ordinary average is the single most
      common way to blow a Fermi answer that has otherwise gone right.
    explanation: >
      A confident lower bound $L$ and upper bound $U$ pin down a wide
      range but not where inside it the true value probably sits. The
      arithmetic mean $(L+U)/2$ answers that in linear space, where it's
      dominated by whichever bound is larger — for $L=10^{4}$ and
      $U=10^{6}$ the arithmetic mean is 505,000, sitting almost on top of
      $U$ and nowhere near a fair midpoint.

      The fix is to average in log space instead, exactly the space where
      the log-error argument already says uncertainty behaves
      symmetrically: $\log(\sqrt{LU})=(\log L+\log U)/2$, the ordinary
      average of the two exponents. Bounds of $10^{4}$ and $10^{6}$
      average to exponent $5$, a guess of $10^{5}$ — the point equally far
      (in factor terms) from both bounds, which is the sense in which
      "equally far from confident-too-low and confident-too-high" ought
      to be measured.

      The shortcut is the same move as reading off an order of magnitude
      anywhere else in this unit: write both bounds as powers of ten, or
      the nearest round power, average the exponents, and read off the
      answer — no square-root arithmetic needed once the bounds are
      already round numbers.
    worked: >
      You're confident a quantity exceeds $50$ and is under 5,000, with no
      narrower information. Geometric mean: $\sqrt{50\times5000}=
      \sqrt{250000}=500$. The arithmetic mean would say 2,525 — about five
      times higher, and sitting far closer to the upper bound than to the
      lower one. $500$ is the honest midpoint to report, not 2,525.
    interview: >
      Comes up whenever you've bounded a quantity but have no further
      information, often as the interviewer's own check: "so is it closer
      to the low end or the high end?" The right answer is "neither — the
      square root of the product," said without hesitation.
    pitfalls: >
      Defaulting to $(L+U)/2$ out of habit — that's the right average for
      additive uncertainty, not the multiplicative uncertainty a Fermi
      bound almost always has. Forgetting the shortcut needs the bounds'
      exponents, not the bounds themselves — average the powers of ten,
      then convert back.
    recap: >
      Guess the geometric mean of your bounds, not the arithmetic mean —
      average the exponents, not the numbers.

  - node: quant-mental.fermi.dimensional-check
    hook: >
      A decomposition can be built from individually plausible factors and
      still be wrong in an instant, obvious way once you check that the
      units actually cancel to the thing you were asked for.
    explanation: >
      Every factor in a decomposition carries units, and the chain only
      means what you intend if those units cancel to the target: "cars
      sold per year" needs (people) times (cars per person per year), not
      (people) times (years per car) — the second gives person-years, not
      a count of cars at all. Writing the units alongside each factor as
      you build the chain, before any number goes in, turns this into a
      check you get for free rather than an afterthought.

      The value of the check is that it's independent of whether any
      number is right. A unit mismatch exposes the wrong operation —
      multiplying where you should have divided, or vice versa — a
      structural error that no amount of correcting individual numbers
      will fix, and one that a plausible-looking final answer can easily
      hide. For chained conversions, write each factor as a fraction with
      the unit you want gone sitting in the numerator of the next factor,
      so cancellation is visible step by step rather than trusted by eye.

      Run the check before trusting the final number, not after: an
      estimate that fails it is wrong regardless of how reasonable it
      looks, and one that passes has at least ruled out the most common
      class of Fermi mistake.
    worked: >
      Estimate new cars sold in the US per year from the standing fleet
      and its lifespan: cars on the road $\approx2.6\times10^{8}$, average
      vehicle lifespan $\approx15$ years. Units:
      $(\text{cars})/(\text{years per car})=\text{cars per year}$ —
      correct. Sold per year $\approx2.6\times10^{8}/15\approx
      1.7\times10^{7}$, close to the real figure of roughly
      $1.5\times10^{7}$. Multiplying by $15$ instead of dividing would
      have given car-years, not a count — a number about $225\times$ too
      large, caught by the unit check before checking a single fact.
    interview: >
      Rarely asked for outright, but stating it — "let me check the units
      cancel to what we want" — right after setting up the chain is one
      of the fastest ways to signal rigor, and it's the first thing to
      reach for when a computed answer feels implausible.
    pitfalls: >
      Trusting a chain because each factor looks reasonable in isolation,
      without confirming the units multiply out to the target — plausible
      factors can still combine with the wrong operation. Skipping the
      check because the final number "looks about right," which is
      exactly when a structural error is easiest to miss.
    recap: >
      Track units through the chain and confirm they cancel to the
      target — the check costs nothing and doesn't depend on any single
      number being correct.

  - node: quant-mental.fermi.rounding-one-sig-fig
    hook: >
      Carrying decimals through a Fermi chain feels more careful, but
      every digit past the first is wasted the moment it's multiplied
      against a factor you only trust to a factor of two.
    explanation: >
      A Fermi estimate is only ever as precise as its least precise
      factor, and most factors are honest guesses good to a factor of $2$
      or $3$, not measurements. Carrying a factor like $2.7$ million
      instead of rounding it to $3$ million doesn't buy back any of that
      uncertainty — the product is still dominated by the shakiest input
      in the chain, so the extra digits are computational effort spent on
      precision the answer can't use.

      Rounding aggressively also serves the arithmetic itself: multiplying
      round numbers in your head is close to error-free, while carrying
      decimals through several multiplications under time pressure is
      where actual arithmetic mistakes creep in — mistakes far more
      costly to the final answer than the rounding itself. One
      significant figure per factor is usually enough to keep the product
      within the order of magnitude the factors already guarantee.

      The discipline is to round at the moment you choose each factor, not
      at the end — carrying full precision through several steps only to
      round the final answer gives a false sense that the intermediate
      arithmetic mattered, when the input uncertainty already capped what
      the output could mean.
    worked: >
      A chain has factors $3.4$ million, a $22\%$ rate, and $6.8$
      occurrences a year. Full precision:
      $3.4\times0.22\times6.8\approx5.09$ million. Rounded to one
      significant figure — $3$ million, $20\%$, $7$ — gives
      $3\times0.2\times7=4.2$ million. The two differ by about $17\%$, far
      smaller than the factor-of-$2$, ×/÷, uncertainty already sitting in
      each factor, and the rounded version took a fraction of the time.
    interview: >
      Interviewers notice when a candidate carries needless decimals
      under time pressure — it costs seconds and signals you haven't
      internalized how much the inputs already limit the answer. Rounding
      aggressively and saying so ("call it 3 million") reads as
      confidence, not carelessness.
    pitfalls: >
      Carrying full precision through a long chain and only rounding the
      final answer — the intermediate precision was never real, and it
      burns time better spent double-checking a factor. Rounding
      inconsistently, up on some factors and down on others, which can
      silently bias the product in one direction.
    recap: >
      Round every factor to one significant figure as you choose it —
      extra decimals are wasted once multiplied against a factor-of-$2$
      guess.

  - node: quant-mental.fermi.stating-assumptions
    hook: >
      Two candidates can reach the same wrong final number, and one
      leaves the room having failed while the other leaves having
      demonstrated exactly the skill being tested — the difference is
      entirely in what got said out loud.
    explanation: >
      A Fermi question is graded on the decomposition, not the digit at
      the end — the interviewer already knows the "true" answer is
      unknowable to more than an order of magnitude, so the object of
      interest is whether your reasoning was sound and legible. Narrating
      each factor as you pick it ("I'll assume a piano gets tuned once a
      year") turns a silent mental calculation into a chain the
      interviewer can audit, agree with, or redirect before a bad
      assumption has propagated through four more steps.

      Silence is the actual failure mode, not a wrong number. An
      assumption buried inside a number you state without comment reads,
      when questioned, exactly like a mistake — the interviewer has no way
      to tell "I assumed X on purpose" from "I don't know where this
      number came from." A stated assumption, by contrast, invites at
      most a one-line correction ("actually assume half that"), which
      costs seconds and redirects the rest of the chain rather than
      voiding the whole estimate.

      This extends past the point values to the bounds and rounding
      choices too — announcing "I'm rounding this to one significant
      figure" or "I'm bounding this between $X$ and $Y$" is itself part
      of the graded reasoning, not bookkeeping to skip past.
    interview: >
      This is less a technique to invoke and more the register the whole
      round is conducted in: think out loud from the first factor, name
      every assumption as you make it, and treat a "why did you assume
      that" follow-up as an invitation, not a challenge to defend against.
    pitfalls: >
      Doing the reasoning silently and presenting only a clean final
      number — it looks efficient but gives the interviewer nothing to
      grade except a possibly-wrong digit. Stating an assumption once at
      the start and then going quiet for the rest of the chain, losing
      the audit trail exactly where it matters most, deeper into the
      decomposition.
    recap: >
      The spoken reasoning chain is what gets scored — narrate every
      assumption, bound, and rounding choice as you make it, not just the
      final number.

  - node: quant-mental.fermi.cross-check-second-path
    hook: >
      A single decomposition can be internally consistent and still wrong
      in a way no unit check or rounding discipline catches — the fix is
      a second, independent path to the same number.
    explanation: >
      Any one decomposition risks carrying a bad assumption invisibly all
      the way through to a plausible-looking final digit — nothing about a
      single chain being internally consistent guarantees it's right.
      Building a second decomposition from genuinely different factors —
      different anchors, a different structural idea — gives two answers
      that share few or no assumptions, so their agreement or
      disagreement is real evidence rather than the chain agreeing with
      itself.

      Two chains landing within a factor of two or three of each other is
      about as strong a confirmation as a Fermi estimate can produce,
      because it's unlikely two unrelated sets of assumptions would both
      be wrong in the same direction by the same amount. Disagreement by
      an order of magnitude or more usually flags an outright blunder —
      a dropped conversion, a double-counted population — rather than
      ordinary estimation noise, and tells you which chain to re-examine
      first: whichever used the shakier anchor.

      This is the Fermi analogue of checking an arithmetic result by
      recomputing it a different way rather than re-reading the same
      steps — it catches the class of error that re-reading never finds,
      because re-reading a wrong assumption just confirms it looked
      reasonable the first time too.
    worked: >
      Estimate annual haircuts in a city of $3$ million two ways. Demand
      side: $3\times10^{6}$ people at roughly $8$ haircuts a year each
      $\approx2.4\times10^{7}$. Supply side: about 3,000 barbershops (one
      per thousand residents), each with $3$ barbers doing $12$ cuts a
      day over $250$ working days $\approx3{,}000$ cuts a year per
      barber, so $3{,}000\times3\times3{,}000\approx2.7\times10^{7}$. The
      two independent paths land within about $12\%$ of each other —
      strong evidence the true figure is in the mid-tens-of-millions.
    interview: >
      Offered as a follow-up once you've landed a first answer — "can you
      get there a different way?" — and the strongest response starts
      from visibly unrelated factors, not a cosmetic rearrangement of the
      same chain. Volunteering it unprompted after a fast first pass is a
      strong signal on its own.
    pitfalls: >
      Building a "second" path that secretly reuses the same anchor as
      the first — if both chains lean on the same shaky number, their
      agreement proves nothing. Treating close agreement as proof rather
      than evidence — it raises confidence, it doesn't guarantee
      correctness.
    recap: >
      Re-derive the number from unrelated factors; two independent chains
      landing close together is the strongest confirmation a Fermi
      estimate can get.

  - node: quant-mental.fermi.subpopulation-weighting
    hook: >
      A single blended rate applied to an entire population is almost
      always wrong in a specific, predictable direction once that
      population is actually a mix of very different behaviors.
    explanation: >
      When the rate you care about differs sharply across groups — heavy
      users and light users, weekdays and weekends — decompose the
      population first, by group, and give each group its own rate before
      combining: $\sum_i w_ir_i$, with $w_i$ each group's population
      share. This is the weighted-average move applied to a Fermi chain
      rather than to two exam scores, generalized to as many groups as the
      population actually splits into.

      The failure mode of skipping this step is specific: a single
      blended rate, whether it's an average of the group rates or a guess
      at "the typical person," systematically misses because the group
      with the most extreme rate almost never carries a weight anywhere
      near $50\%$. Small, intense subgroups get drowned out in a flat
      average even though they can dominate the true total, and large,
      mild subgroups get over-weighted the same way in reverse.

      The fix costs one extra step, not a harder calculation: identify the
      groups with genuinely different rates, estimate each group's
      population share and its own rate separately, and combine with the
      population shares as weights — never average the rates themselves
      unless the groups happen to be equally sized.
    worked: >
      Estimate daily lattes bought in a city of $2$ million, split by
      office workers versus everyone else. Office workers are $15\%$ of
      the population (300,000) at $1.2$ lattes a day each
      $\approx360{,}000$; everyone else is $85\%$ (1,700,000) at $0.1$ a
      day $\approx170{,}000$. Weighted total: $360{,}000+170{,}000=
      530{,}000$ a day. A flat average of the two rates,
      $(1.2+0.1)/2=0.65$, applied to the whole $2$ million gives
      1,300,000 — roughly $2.5\times$ higher than the weighted answer,
      because it gives office workers, only $15\%$ of the population, a
      full $50\%$ of the weight.
    interview: >
      Comes up whenever a question hints at a skewed population —
      "coffee sales near a business district," "ride-share demand on a
      Friday night" — and the tell of a strong answer is splitting the
      population before guessing any single rate, not patching a flat
      guess afterward.
    pitfalls: >
      Averaging the group rates instead of weighting them by population
      share — those agree only when the groups are equal-sized, which is
      rare. Missing a subgroup with an extreme rate entirely because it's
      a small share of the population, when its rate can still dominate
      the weighted sum.
    recap: >
      Blend group-specific rates by population share — a weighted
      average, not a flat one — whenever the rate varies sharply across
      the population.

  - node: quant-mental.fermi.piano-tuners-chicago
    hook: >
      This is the Fermi archetype for a reason: population to owners to
      service frequency to provider capacity is a chain shape that
      transfers to any "how many X are needed to service Y" question,
      service profession or not.
    explanation: >
      The piano-tuner chain has a shape worth naming on its own:
      (population) to (owners of the thing) to (services needed per year)
      to (capacity per provider) to (providers needed). Each arrow is one
      of decomposition's factors — an ownership rate, a service
      frequency, a working-hours budget — and the final division, total
      annual demand over one provider's annual capacity, is what turns a
      count of things into a count of people employed to service them.

      That last step generalizes past pianos entirely: any "how many X
      does a city need" question about a service — plumbers, dog
      groomers, tax preparers — is the same demand-over-capacity
      division, with the specifics of ownership rate and service
      frequency swapped in. Once you recognize the shape, the actual
      content of the question barely matters; you're filling in the same
      four blanks with different anchors.

      The other reason this example is canonical is that its answer is
      genuinely close to the real one, which is itself instructive: the
      chain's four factors were each guessed to a factor of $2$ or so, yet
      one-sig-fig rounding held all the way through to a final number in
      the right hundreds, not the right thousands or the right tens — the
      archetype demonstrates, not just states, that the earlier
      techniques work when stacked.
    worked: >
      Apply the same chain to dentists in Chicago's metro area, population
      $\approx9.5\times10^{6}$. Assume $1.5$ checkups per person a year
      $\approx1.4\times10^{7}$ visits a year. A dentist sees roughly $20$
      patients a day, $5$ days a week, $48$ weeks a year
      $\approx4{,}800$ visits a year. Dentists needed:
      $1.4\times10^{7}/4{,}800\approx2{,}900$, call it 3,000 — in the
      right range for a metro area of that size.
    interview: >
      Piano tuners in Chicago is the canonical opener precisely because
      it's been asked so often that a memorized final number is worthless
      — what's tested is whether you can produce the chain cold, narrating
      each factor, for whatever service the interviewer actually names.
    pitfalls: >
      Treating "population to owners to service frequency to provider
      capacity" as specific to pianos rather than recognizing it as the
      general template, missing the chance to reuse it instantly on a
      different profession. Forgetting the provider-capacity step needs
      its own working-hours budget, which is where a rushed answer
      usually loses the most accuracy.
    recap: >
      Population to owners to services-per-year to provider capacity is
      the general template — piano tuners just happens to be its
      most-asked instance.

  - node: quant-mental.fermi.windows-in-city
    hook: >
      Windows in Chicago is where subpopulation weighting earns its keep
      on a physical-count question, not just a rate question — the same
      population-share-weighted-sum move, applied to counting objects
      instead of counting events.
    explanation: >
      Splitting the housing stock by type before counting windows is the
      same move as weighting a rate by subpopulation, applied to a
      per-unit count instead of a per-person rate: apartments and houses
      have genuinely different window counts, so a single blended
      "windows-per-home" guess would systematically miss for the same
      reason a single blended latte rate misses — whichever type is more
      common doesn't necessarily carry the more typical count.

      The residential split is also where nearly all of the estimate's
      accuracy lives; the commercial add-on at the end is comparatively
      minor and forgiving of a rough percentage, because it's a small
      correction to an already-large residential number rather than a
      peer term. That ordering — get the big, skewed term right first,
      then patch in the smaller correction — is worth carrying to other
      physical-count estimates: spend your accuracy budget on whichever
      split dominates the total, not evenly across every step.

      The technique transfers directly to any "count of X across a
      city's buildings" question — doors, rooms, parking spots — wherever
      building type is the dominant source of variation in the per-unit
      count.
    worked: >
      Estimate windows in Houston. Metro population $\approx7\times10^{6}$
      at $2.8$ people per household gives $\approx2.5\times10^{6}$
      households. Houston sprawls more than Chicago, so say $30\%$
      apartments at $5$ windows and $70\%$ houses at $14$ windows (larger
      suburban lots):
      $0.3\times2.5\times10^{6}\times5+0.7\times2.5\times10^{6}\times14
      \approx3.75\times10^{6}+2.45\times10^{7}\approx2.8\times10^{7}$
      residential windows. Adding $20\%$ for commercial gives
      $\approx3.4\times10^{7}$ windows total.
    interview: >
      A close cousin of piano tuners as an opener; the tell of a strong
      answer is naming the type split before guessing any window count,
      exactly as with any skewed-population estimate, rather than
      reaching for one average number per home.
    pitfalls: >
      Using one blended windows-per-home figure across a metro area that
      actually mixes dense apartments and sprawling houses — the two
      types can differ by a factor of $3$ or more per unit. Spending
      equal effort refining the small commercial correction as the
      dominant residential split, when the residential term is doing
      nearly all the work.
    recap: >
      Split the housing stock by type and weight each type's own window
      count by its population share — the split matters more than either
      window count alone.

  - node: quant-mental.fermi.weight-of-747
    hook: >
      Weight-of-a-747 is the template for any "how heavy is this large
      physical object" question — structure, then whatever fills or fuels
      it — and the density anchor you reach for is the one thing that
      changes between instances.
    explanation: >
      The 747 chain has three terms of genuinely different character: a
      structural weight from volume times material density, a fuel weight
      from a flight-specific fuel budget, and a payload weight from a
      passenger-and-cargo count — three separate estimates added, not one
      chain multiplied through. Getting each term's dimensional check
      right individually matters more than getting any one number exactly
      right, because a unit slip in any single term corrupts a sum the
      other two terms can't rescue.

      The structural term generalizes furthest: any large object's weight
      can be bounded the same way — approximate its shape as a simple
      solid, estimate that solid's volume, and multiply by the density of
      whatever it's mostly made of. The density anchor is the piece that
      changes between instances — aluminum near $2.7$ tonnes per cubic
      meter for an airliner, steel near $7.8$ for a ship, water's density
      near $1$ for anything close to neutrally buoyant, like a large
      marine animal.

      The other lesson worth carrying forward is the "comparable multiple
      for everything else" step: the 747's shell alone is a small
      fraction of its dry structure, and multiplying by a rough factor for
      wings, engines and internals rather than estimating each separately
      is itself a legitimate Fermi move when the sub-parts are too
      numerous to decompose individually.
    worked: >
      Estimate a blue whale's weight. Approximate the body as a tapered
      cylinder $25\,\text{m}$ long and $4\,\text{m}$ across ($2\,
      \text{m}$ radius): a full cylinder's volume is $\pi r^{2}L\approx
      3.14\times4\times25\approx314\,\text{m}^{3}$; tapering front and
      back knocks off roughly $30\%$, giving $\approx220\,\text{m}^{3}$.
      Whale tissue sits close to neutral buoyancy, so density
      $\approx1\,\text{t/m}^{3}$ (water), giving a weight
      $\approx220$ tonnes. The real figure for a large adult is roughly
      $150$ tonnes, so the estimate is high by less than a factor of
      $1.5$ — well within Fermi range, with the miss almost entirely in
      the taper correction, not the underlying idea.
    interview: >
      Any "how much does X weigh" for a large, unfamiliar object is this
      template in disguise — decompose by structure, name a density
      anchor out loud, and state the shape approximation you're making
      before computing anything, since that approximation is usually the
      biggest source of error.
    pitfalls: >
      Reaching for the wrong density anchor — treating a mostly-hollow or
      mostly-water object like solid metal, or vice versa, is a much
      bigger error than misjudging the dimensions. Forgetting the shape
      correction and reporting the uncorrected simple solid's volume as
      if the object were really that shape.
    recap: >
      Bound a large object's weight as approximate volume times a density
      anchor matched to what it's mostly made of, then add fuel or
      payload terms separately.
