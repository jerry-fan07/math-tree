unit: quant-mental.fermi
opening: >
  Fermi estimation turns an unknowable number into a product of knowable
  ones: decompose the target into factors you can each bound from lived
  experience, track their errors on the log scale where they stay additive
  rather than compounding, and round hard at every step because the inputs
  never supported more precision than that. Anchors, a unit check, and a
  second independent path keep the chain honest; stating every assumption
  out loud is what actually gets scored, not the final digit. It closes on
  three worked classics — piano tuners, windows in a city, the weight of a
  747 — that show the whole toolkit landing within a factor of two of the
  real answer.
lessons:
  - node: quant-mental.fermi.decomposition
    hook: >
      A Fermi question always opens with a number nobody has memorized —
      the entire skill is refusing to guess it directly and instead
      building it from pieces you have lived enough to know.
    explanation: >
      Nobody has "number of piano tuners in Chicago" or "gallons of gas
      pumped in Texas" stored in memory, but everyone has lived enough to
      guess a city's population to within a factor of two, or the fraction
      of families that own something, or how many hours a job takes.
      Decomposition swaps the first, unanswerable question for a chain of
      the second, answerable kind: write the target as a product of
      factors — counts, rates, durations, fractions — each chosen so it's
      something you can picture and bound from experience, never a fact
      you'd have to have read somewhere.

      Two disciplines make the chain trustworthy. First, build it
      symbolically before touching a number: name the factors and confirm
      their units cancel to the target, the same way you'd set up an
      algebra problem before substituting. Second, choose factors that are
      independent of each other's error — if two factors are guessed from
      the same shaky intuition, their errors move together and the
      chain's exposure to that one bad guess doubles, whereas factors
      drawn from unrelated experience tend to miss in different directions
      and partly wash out in the product.

      This is why a five-factor chain, each individually good only to
      within a factor of $2$–$3$, still lands within an order of magnitude
      rather than being off by that factor five times over: the
      overestimates and underestimates partially offset instead of
      stacking. That cancellation is the entire reason decomposition beats
      a single confident guess.
    worked: >
      Estimate the number of gas stations in the United States. Population
      $\approx3.3\times10^{8}$; say $0.8$ cars per person, giving
      $\approx2.6\times10^{8}$ cars. Each car burns roughly $500$ gallons
      a year, so total consumption is $\approx2.6\times10^{8}\times500=
      1.3\times10^{11}$ gallons a year. A typical station pumps on the
      order of $1.5\times10^{6}$ gallons a year. Stations needed:
      $1.3\times10^{11}/1.5\times10^{6}\approx87{,}000$ — the real count
      is around 145,000, well within Fermi range.
    interview: >
      Interviewers open with exactly this shape — "how many piano
      tuners...", "how many gas stations..." — and grade the
      factorization, not the final digit: can you name factors that are
      genuinely independent guesses rather than one guess wearing several
      disguises. State each factor as you choose it and keep the chain
      symbolic until the end.
    pitfalls: >
      Reaching for a number you half-remember from a headline instead of
      one you can justify from lived experience — a recalled fact you
      can't defend under a follow-up is worse than an honest guess.
      Picking factors that are secretly correlated, both driven by the
      same underlying guess, so their errors compound instead of
      canceling.
    recap: >
      Replace one unguessable number with a product of independently
      guessable factors, built symbolically and substituted last.
    steps:
      - teach: >
          A Fermi target always opens as a single unanswerable number — nobody
          has "gym memberships in a mid-size town" or "dry-cleaning orders in a
          suburb" stored in memory. Decomposition swaps that one impossible
          question for a chain of smaller ones you actually can answer from
          lived experience.
      - teach: >
          Write the chain as a product of factors — counts, rates, durations,
          fractions — before touching a single digit, the same way you'd set up
          an algebra problem symbolically before substituting. Each factor
          should be something you can picture and defend, never a number you'd
          have to have read somewhere.
      - teach: >
          Pick factors whose errors are independent of each other. Two factors
          guessed from the same shaky intuition move together and double your
          exposure to that one bad guess, while factors drawn from unrelated
          experience tend to miss in different directions.
      - ask: >
          Which of these is a genuine decomposition for "monthly dry-cleaning
          orders in a suburb of $60{,}000$ people"?
        choices:
          - text: >
              A market report said local dry cleaners handle about $4{,}000$
              orders a month.
            feedback: >
              A recalled number you can't defend under a follow-up is worse than
              an honest guess built from factors you chose yourself.
          - text: >
              $(60{,}000\text{ people}) / (2.5\text{ people per household})
              \times (\text{fraction of households that dry-clean regularly})
              \times (\text{orders per such household per month})$
            correct: true
            feedback: >
              Each factor is something you can picture and bound from
              experience, chained symbolically before any number is plugged in —
              exactly the discipline this node describes.
          - text: >
              $(60{,}000\text{ people}) \times$ a guess at dry-cleaning
              frequency, based on the same sense of "how upscale this suburb
              feels" used to guess the household fraction.
            feedback: >
              Both factors lean on the same underlying impression, so their
              errors move together instead of partly cancelling — decomposition
              wants independent guesses, not the same guess worn twice.
        feedback: >
          The middle option is the only one built as a symbolic chain of
          independently guessable factors; the other two either recall a fact or
          double-count one intuition.
      - teach: >
          This is why a five-factor chain, each individually good only to within
          a factor of $2$–$3$, still lands within an order of magnitude rather
          than being off by that factor five times over — the overestimates and
          underestimates partly offset instead of stacking.
      - ask: >
          Estimate monthly car washes in a town of $50{,}000$ people. Assume
          $2.5$ people per household, $1.2$ cars per household, and each car is
          washed $0.5$ times a month. How many car washes happen in the town
          each month?
        expects: "12000"
        tolerance: 300
        hint: >
          Convert people to households, households to cars, then apply the
          monthly rate — one factor at a time.
        feedback: >
          $50{,}000/2.5=20{,}000$ households; $20{,}000\times1.2=24{,}000$ cars;
          $24{,}000\times0.5=12{,}000$ washes a month — the chain built
          symbolically, then substituted last.
      - ask: >
          Estimate monthly gym visits in a town of $90{,}000$ people, assuming
          $18\%$ hold a membership and each member visits $9$ times a month. How
          many visits happen each month?
        expects: "145800"
        tolerance: 4000
        hint: >
          Multiply the population by the membership rate first, then by the
          visit rate.
        feedback: >
          $90{,}000\times0.18=16{,}200$ members; $16{,}200\times9=145{,}800$
          visits a month — two independent factors, multiplied through.
      - teach: >
          Reaching for a half-remembered figure instead of a factor you can
          defend is the most common way this goes wrong — it's worse than an
          honest guess, because it can't be corrected under questioning. Picking
          two factors that secretly share one guess is the second: their errors
          compound instead of cancelling.
      - teach: >
          The habit that matters isn't cleverness, it's discipline: name your
          factors, keep them independent, and multiply only at the very end —
          that's what turns an unanswerable question into an answerable chain,
          every time.

  - node: quant-mental.fermi.anchor-inventory
    hook: >
      Every decomposition bottoms out in a handful of raw counts —
      population, households, a rate per year — and if those aren't
      already in memory you're deriving them mid-interview instead of
      estimating with them.
    explanation: >
      A decomposition is only as fast as its raw inputs, and world
      population, a country's population, a big city's size, and the
      household count and size behind it show up in enough estimates that
      re-deriving them each time is wasted motion. Holding a handful cold
      — world population $\approx8\times10^{9}$, US population
      $\approx3.3\times10^{8}$, a big US city proper at $3$ to $8$ million
      with its metro roughly $2$–$3\times$ that, US households
      $\approx1.3\times10^{8}$ at about $2.5$ people each — turns the
      first step of most decompositions into instant recall instead of a
      guess you have to defend.

      The seconds-per-year entry is the clearest case of the underlying
      habit: $365\times24\times3600$ is exact but slow to do in your head,
      while $\pi\times10^{7}$ is close enough (the two agree to three
      significant figures) and is one digit-string to remember instead of
      three numbers to multiply. That's the shape of a good anchor — worth
      memorizing precisely because computing it fresh costs more time than
      the precision it buys back.

      Treat every anchor as good to one significant figure only, and no
      better. Chaining several anchors together doesn't get you extra
      precision; it gets you the same one-sig-fig confidence at every
      step, which is exactly the level decomposition is designed to
      tolerate.
    worked: >
      Roughly how many times does a resting heart beat over $70$ years?
      Use seconds per year $\approx\pi\times10^{7}$: $70$ years is
      $\approx70\times3.14\times10^{7}\approx2.2\times10^{9}$ seconds. At
      a resting rate of $70$ beats a minute, that's $70/60\approx1.17$
      beats a second, so total beats
      $\approx2.2\times10^{9}\times1.17\approx2.6\times10^{9}$ — about 2.6
      billion heartbeats in a lifetime.
    interview: >
      These get fired as sub-questions inside a bigger estimate — "what's
      a reasonable US population figure" — expecting instant, confident
      recall rather than a derivation; hesitating on a basic anchor reads
      as not having done estimation before. Volunteer the anchor before
      being asked for it.
    pitfalls: >
      Treating an anchor as exact and stacking decimal precision from it —
      it's good to one significant figure, no more. Recomputing
      $365\times24\times3600$ from scratch under time pressure instead of
      reaching for $\pi\times10^{7}$, burning seconds you don't have.
    recap: >
      A short table of population, household and seconds-per-year
      figures, each trusted to one significant figure, seeds most
      decompositions for free.
    steps:
      - teach: >
          A decomposition is only as fast as its raw inputs, and a short list of
          population, household and time figures shows up in enough estimates
          that re-deriving them each time is wasted motion.
      - teach: >
          Holding a handful cold — world population $\approx8\times10^{9}$, US
          population $\approx3.3\times10^{8}$, a big US city proper at $3$ to
          $8$ million with its metro roughly $2$–$3\times$ that, US households
          $\approx1.3\times10^{8}$ at about $2.5$ people each, seconds per year
          $\approx\pi\times10^{7}$ — turns the first step of most decompositions
          into instant recall.
      - ask: >
          Mid-interview, which use of the seconds-per-year figure actually
          serves you?
        choices:
          - text: >
              Compute $365\times24\times3600$ exactly before continuing.
            feedback: >
              That's exact, but it burns seconds you don't have on precision the
              rest of the chain can't use anyway.
          - text: >
              Reach for $\pi\times10^{7}$.
            correct: true
            feedback: >
              It matches the exact figure to three significant figures and is
              one digit-string to recall instead of three numbers to multiply —
              the entire point of an anchor.
          - text: >
              Round to $3\times10^{7}$ instead, since it's an even simpler
              number.
            feedback: >
              That's about $5\%$ low with no time saved over $\pi\times10^{7}$,
              which is just as fast to recall and noticeably closer.
        feedback: >
          $\pi\times10^{7}\approx3.14\times10^{7}$ is the anchor worth
          memorizing precisely because computing it fresh costs more time than
          the precision buys back.
      - teach: >
          Treat every anchor as good to one significant figure only. Chaining
          several anchors together doesn't buy extra precision — it gets you the
          same one-sig-fig confidence at every step, which is exactly the level
          a decomposition is built to tolerate.
      - ask: >
          Using the anchor that US households $\approx1.3\times10^{8}$ at
          $\approx2.5$ people each, what US population does that predict, in
          millions?
        expects: "325"
        tolerance: 10
        hint: >
          Multiply the household count by people per household.
        feedback: >
          $1.3\times10^{8}\times2.5=3.25\times10^{8}$, i.e. $325$ million —
          close to the population anchor itself, which is exactly the internal
          consistency an anchor should have.
      - ask: >
          Using seconds per year $\approx\pi\times10^{7}$, roughly how many
          seconds are in $5$ years, in millions of seconds?
        expects: "157"
        tolerance: 5
        hint: >
          Multiply the anchor by the number of years.
        feedback: >
          $5\times3.14\times10^{7}\approx1.57\times10^{8}$ seconds, i.e. about
          $157$ million — the anchor turned into a fresh number in one step.
      - teach: >
          Recomputing a figure like $365\times24\times3600$ from scratch under
          time pressure, when an anchor already covers it, spends seconds you
          don't have. Stacking decimal precision on top of a one-sig-fig anchor
          is the same mistake in the other direction — the extra digits aren't
          real.
      - teach: >
          Volunteer an anchor the moment you need it rather than deriving it
          live — a candidate who states "US households are about
          $1.3\times10^{8}$" without pausing has visibly done this before.

  - node: quant-mental.fermi.log-error
    hook: >
      A decomposition's factors are each honest only to a multiplicative
      factor of two or three, and knowing how those errors combine — not
      worrying about it, and not adding them like ordinary uncertainties —
      is what tells you whether a long chain is still worth trusting.
    explanation: >
      If each factor in a product carries a multiplicative error — trusted
      to within a factor of $2$, ×/÷, say — the errors don't add, they
      multiply: two independent factors each off by up to $2\times$ can
      leave the product off by up to $4\times$, not $2\times$. That's just
      restating that an error rides along with the factor it belongs to,
      and factors combine by multiplication.

      Taking logs turns that multiplicative pile-up into an ordinary sum:
      $\log(\text{total error})=\sum_i\log(\text{error}_i)$, so the tool
      for reasoning about it is the same log arithmetic used everywhere
      else in mental math, not a new one. A factor trusted to a factor of
      $2$ contributes $\log_{10}2\approx0.301$ to that sum; a factor
      trusted only to a factor of $5$ contributes
      $\log_{10}5\approx0.699$ instead — messier factors cost more
      log-budget, and the cost is additive across the chain regardless of
      how many factors there are.

      This is why a long chain doesn't collapse: growth in log space is
      additive and bounded by how many factors you used, not runaway
      multiplicative growth. It also gives a design rule while building
      the decomposition — count the uncertain factors and roughly how
      uncertain each is, and you can predict, before computing anything,
      the order of magnitude of trust the final number deserves.
    worked: >
      A decomposition chains four uncertain factors: three trusted to a
      factor of $2$ and one — a fraction you're genuinely unsure about —
      trusted only to a factor of $5$. Log-error budget:
      $3\times\log_{10}2+\log_{10}5\approx3(0.301)+0.699\approx1.602$.
      Total error factor $\approx10^{1.602}\approx40$, so the final answer
      should be read as good to within about a factor of $40$ either way —
      worse than any one factor, but a bounded, namable range rather than
      an unbounded guess.
    interview: >
      Rarely asked for directly, but a strong finish to any multi-step
      estimate is naming the resulting confidence unprompted — "so I'd
      trust this to within a factor of ten or so" — which signals you
      tracked uncertainty through the whole chain, not only at the end.
    pitfalls: >
      Adding percentage errors instead of multiplying the error factors —
      a factor off by $50\%$ and one off by $100\%$ don't combine to
      "$150\%$ off," they combine multiplicatively. Assuming every factor
      is equally uncertain when one is actually much shakier — that one
      factor dominates the log-error sum and deserves the most scrutiny.
    recap: >
      Multiplicative errors add on the log scale, so a five-factor chain
      each good to a factor of $2$ lands within roughly a factor of $30$,
      not runaway error.
    steps:
      - teach: >
          Each factor in a decomposition carries its own multiplicative error —
          trusted only to within a factor of $2$, say — and those errors don't
          add when the factors multiply together, they multiply too.
      - teach: >
          Two independent factors each off by up to $2\times$ can leave the
          product off by up to $4\times$, not $2\times$: an error rides along
          with the factor it belongs to, and factors combine by multiplication,
          so their errors do too.
      - ask: >
          A chain has two factors, each trusted to a multiplicative factor of
          $2$, ×/÷. What's the right way to combine their uncertainty into a
          total error factor?
        choices:
          - text: >
              Add the two factors: $2+2=4$, so trust the product to a factor of
              $4$.
            feedback: >
              This happens to land on the same number here, but it's the wrong
              rule — it breaks the moment the factors differ, since a factor of
              $2$ and a factor of $5$ do not combine to $7$.
          - text: >
              Multiply the two factors: $2\times2=4$, so trust the product to a
              factor of $4$.
            correct: true
            feedback: >
              Errors multiply because each one rides along with the factor it
              belongs to, and the factors themselves combine by multiplication.
          - text: >
              Take the larger of the two, since the shakier factor dominates.
            feedback: >
              Both factors contribute — even two equal factors of $2$ combine to
              a factor of $4$, not a factor of $2$.
        feedback: >
          Multiplicative errors combine by multiplying, which is exactly why
          taking logs — turning that product into a sum — is the useful move.
      - teach: >
          Logs turn the multiplicative pile-up into an ordinary sum:
          $\log(\text{total error})=\sum_i\log(\text{error}_i)$. A factor
          trusted to a factor of $2$ contributes $\log_{10}2\approx0.301$; a
          factor trusted only to a factor of $3$ contributes
          $\log_{10}3\approx0.477$ instead — a messier factor costs more
          log-budget.
      - ask: >
          A chain has three factors trusted to a factor of $2$, ×/÷, and two
          factors trusted to a factor of $3$, ×/÷. Using
          $\log_{10}2\approx0.301$ and $\log_{10}3\approx0.477$, what's the
          total log-error budget?
        expects: "1.86"
        tolerance: 0.05
        hint: >
          Multiply the count of each type of factor by its log-error, then add
          the two totals.
        feedback: >
          $3\times0.301+2\times0.477\approx0.903+0.954\approx1.86$ — the
          log-error budget for the whole chain.
      - ask: >
          Converting that budget back to an ordinary error factor, $10^{1.86}$
          is roughly what number?
        expects: "72"
        tolerance: 4
        hint: >
          Raise ten to the power of the log-error budget you just found.
        feedback: >
          $10^{1.86}\approx72$, so the final answer should be trusted only to
          within roughly a factor of $70$ — worse than any single factor, but a
          bounded, namable range rather than an unbounded guess.
      - teach: >
          Adding percentage errors instead of multiplying the error factors is
          the common slip — a factor off by $50\%$ and one off by $100\%$ don't
          combine to "$150\%$ off," since the underlying combination is
          multiplicative, not additive.
      - teach: >
          The design payoff is upfront, not just after the fact: count the
          uncertain factors and roughly how uncertain each is, and you can
          predict the order of magnitude of trust the final number deserves
          before computing a single one of them.

  - node: quant-mental.fermi.geometric-mean-bounds
    hook: >
      Bounds alone don't tell you where inside them to point your final
      guess, and reaching for the ordinary average is the single most
      common way to blow a Fermi answer that has otherwise gone right.
    explanation: >
      A confident lower bound $L$ and upper bound $U$ pin down a wide
      range but not where inside it the true value probably sits. The
      arithmetic mean $(L+U)/2$ answers that in linear space, where it's
      dominated by whichever bound is larger — for $L=10^{4}$ and
      $U=10^{6}$ the arithmetic mean is 505,000, sitting almost on top of
      $U$ and nowhere near a fair midpoint.

      The fix is to average in log space instead, exactly the space where
      the log-error argument already says uncertainty behaves
      symmetrically: $\log(\sqrt{LU})=(\log L+\log U)/2$, the ordinary
      average of the two exponents. Bounds of $10^{4}$ and $10^{6}$
      average to exponent $5$, a guess of $10^{5}$ — the point equally far
      (in factor terms) from both bounds, which is the sense in which
      "equally far from confident-too-low and confident-too-high" ought
      to be measured.

      The shortcut is the same move as reading off an order of magnitude
      anywhere else in this unit: write both bounds as powers of ten, or
      the nearest round power, average the exponents, and read off the
      answer — no square-root arithmetic needed once the bounds are
      already round numbers.
    worked: >
      You're confident a quantity exceeds $50$ and is under 5,000, with no
      narrower information. Geometric mean: $\sqrt{50\times5000}=
      \sqrt{250000}=500$. The arithmetic mean would say 2,525 — about five
      times higher, and sitting far closer to the upper bound than to the
      lower one. $500$ is the honest midpoint to report, not 2,525.
    interview: >
      Comes up whenever you've bounded a quantity but have no further
      information, often as the interviewer's own check: "so is it closer
      to the low end or the high end?" The right answer is "neither — the
      square root of the product," said without hesitation.
    pitfalls: >
      Defaulting to $(L+U)/2$ out of habit — that's the right average for
      additive uncertainty, not the multiplicative uncertainty a Fermi
      bound almost always has. Forgetting the shortcut needs the bounds'
      exponents, not the bounds themselves — average the powers of ten,
      then convert back.
    recap: >
      Guess the geometric mean of your bounds, not the arithmetic mean —
      average the exponents, not the numbers.
    steps:
      - teach: >
          A confident lower bound $L$ and upper bound $U$ pin down a wide range
          but not where inside it the true value probably sits — and the
          ordinary average answers that question in the wrong space.
      - teach: >
          The arithmetic mean $(L+U)/2$ is dominated by whichever bound is
          larger; the fix is to average in log space instead, $\sqrt{LU}$, the
          point equally far from both bounds in factor terms rather than in
          absolute terms.
      - ask: >
          You're confident a quantity exceeds $200$ and is under $20{,}000$,
          with no narrower information. What's the geometric-mean guess?
        expects: "2000"
        tolerance: 60
        hint: >
          Multiply the two bounds and take the square root, or average their
          exponents and raise ten to that power.
        feedback: >
          $\sqrt{200\times20{,}000}=\sqrt{4{,}000{,}000}=2{,}000$ — matching the
          exponent-average shortcut, $(2.3+4.3)/2=3.3$,
          $10^{3.3}\approx2{,}000$.
      - teach: >
          The shortcut for round bounds skips the square root entirely: write
          both as powers of ten, average the exponents, and read off the answer
          — the same log-space midpoint the log-error argument already relies
          on.
      - ask: >
          Bounds of $10$ and $10{,}000$, confident it's more than $10$ and less
          than $10{,}000$. Which is the honest midpoint?
        choices:
          - text: >
              $5{,}005$, the arithmetic mean.
            feedback: >
              Dragged almost to the upper bound — nowhere near a fair midpoint
              once the range spans that many powers of ten.
          - text: >
              $316$, the geometric mean.
            correct: true
            feedback: >
              $\sqrt{10\times10{,}000}=\sqrt{10^{5}}=10^{2.5}\approx316$ —
              equally far from both bounds in factor terms.
          - text: >
              $100$, one power of ten above the lower bound.
            feedback: >
              This just adds one exponent to the lower bound instead of
              averaging both exponents — the actual midpoint exponent is $2.5$,
              not $2$.
        feedback: >
          $316$ is the geometric mean; the other two either default to linear
          averaging or skip averaging the exponents altogether.
      - ask: >
          Bounds of $4$ and $400$. What's the geometric-mean guess?
        expects: "40"
        tolerance: 2
        hint: >
          The bounds are two round powers apart — average the exponents.
        feedback: >
          $\sqrt{4\times400}=\sqrt{1{,}600}=40$ — the midpoint exponent between
          $\log_{10}4\approx0.6$ and $\log_{10}400\approx2.6$ is $1.6$, and
          $10^{1.6}\approx40$.
      - teach: >
          Defaulting to $(L+U)/2$ out of habit is the single most common way to
          blow an otherwise-correct Fermi answer — that average is the right one
          only for additive uncertainty, and a Fermi bound is almost always
          multiplicative.
      - teach: >
          When the interviewer asks whether the true value sits closer to the
          low end or the high end, the answer is neither — say the square root
          of the product, without reaching for the ordinary average first.

  - node: quant-mental.fermi.dimensional-check
    hook: >
      A decomposition can be built from individually plausible factors and
      still be wrong in an instant, obvious way once you check that the
      units actually cancel to the thing you were asked for.
    explanation: >
      Every factor in a decomposition carries units, and the chain only
      means what you intend if those units cancel to the target: "cars
      sold per year" needs (people) times (cars per person per year), not
      (people) times (years per car) — the second gives person-years, not
      a count of cars at all. Writing the units alongside each factor as
      you build the chain, before any number goes in, turns this into a
      check you get for free rather than an afterthought.

      The value of the check is that it's independent of whether any
      number is right. A unit mismatch exposes the wrong operation —
      multiplying where you should have divided, or vice versa — a
      structural error that no amount of correcting individual numbers
      will fix, and one that a plausible-looking final answer can easily
      hide. For chained conversions, write each factor as a fraction with
      the unit you want gone sitting in the numerator of the next factor,
      so cancellation is visible step by step rather than trusted by eye.

      Run the check before trusting the final number, not after: an
      estimate that fails it is wrong regardless of how reasonable it
      looks, and one that passes has at least ruled out the most common
      class of Fermi mistake.
    worked: >
      Estimate new cars sold in the US per year from the standing fleet
      and its lifespan: cars on the road $\approx2.6\times10^{8}$, average
      vehicle lifespan $\approx15$ years. Units:
      $(\text{cars})/(\text{years per car})=\text{cars per year}$ —
      correct. Sold per year $\approx2.6\times10^{8}/15\approx
      1.7\times10^{7}$, close to the real figure of roughly
      $1.5\times10^{7}$. Multiplying by $15$ instead of dividing would
      have given car-years, not a count — a number about $225\times$ too
      large, caught by the unit check before checking a single fact.
    interview: >
      Rarely asked for outright, but stating it — "let me check the units
      cancel to what we want" — right after setting up the chain is one
      of the fastest ways to signal rigor, and it's the first thing to
      reach for when a computed answer feels implausible.
    pitfalls: >
      Trusting a chain because each factor looks reasonable in isolation,
      without confirming the units multiply out to the target — plausible
      factors can still combine with the wrong operation. Skipping the
      check because the final number "looks about right," which is
      exactly when a structural error is easiest to miss.
    recap: >
      Track units through the chain and confirm they cancel to the
      target — the check costs nothing and doesn't depend on any single
      number being correct.
    steps:
      - teach: >
          A decomposition can be built from individually plausible factors and
          still be wrong the instant its units fail to cancel to the thing you
          were actually asked for.
      - teach: >
          Write the units alongside each factor as the chain is built, before
          any number goes in: (streetlights) × (years per streetlight) means
          something different, and gives different units, from (streetlights) ÷
          (years per streetlight) — only one of them is a count per year.
      - ask: >
          Estimating "kilowatt-hours used per year by a city's streetlights"
          from (streetlight count), (watts per streetlight), and (hours lit per
          year). Which combination has the right units?
        choices:
          - text: >
              count ÷ watts × hours
            feedback: >
              Dividing by watts gives streetlights per watt-hour, not an energy
              total — the wrong operation on the second factor.
          - text: >
              count × watts × hours, then convert watt-hours to kilowatt-hours
            correct: true
            feedback: >
              Streetlights times power times time gives energy, exactly the unit
              being asked for.
          - text: >
              count ÷ watts ÷ hours
            feedback: >
              Two divisions here give units nobody asked for — this isn't even
              close to an energy total.
        feedback: >
          Only multiplying all three factors cancels to watt-hours, the unit the
          question is actually asking about.
      - teach: >
          The check is independent of whether any individual number is right — a
          unit mismatch exposes the wrong operation, and a plausible-looking
          final answer can hide that mistake completely.
      - ask: >
          A city has $200{,}000$ streetlights, each replaced on average every
          $5$ years. How many replacements happen per year?
        expects: "40000"
        tolerance: 1200
        hint: >
          Divide the light count by the years each one lasts, not multiply.
        feedback: >
          (lights)/(years per light) = lights per year: $200{,}000/5=40{,}000$.
          Multiplying by $5$ instead would give light-years, not a count at all.
      - ask: >
          You know (miles driven per car per year $\approx12{,}000$) and (miles
          between oil changes $\approx6{,}000$). Which operation gives "oil
          changes per car per year"?
        choices:
          - text: >
              $12{,}000\times6{,}000$
            feedback: >
              Multiplying two mileage figures gives miles squared, a unit that
              means nothing here.
          - text: >
              $12{,}000/6{,}000$
            correct: true
            feedback: >
              (miles per year) ÷ (miles per change) cancels the miles and leaves
              changes per year — the count that was asked for.
          - text: >
              $6{,}000/12{,}000$
            feedback: >
              This inverts the division and gives years per change, not changes
              per year.
        feedback: >
          Dividing annual mileage by the interval between changes is the only
          combination that cancels to a count per year — here, $2$ changes a
          year.
      - teach: >
          For chained conversions, write each factor as a fraction with the unit
          to cancel sitting in the next factor's numerator, so cancellation is
          visible step by step instead of trusted by eye.
      - teach: >
          Trusting a chain because each factor looks reasonable in isolation,
          without confirming the units multiply out to the target, is the trap —
          and skipping the check because the final number "looks about right" is
          exactly when a structural error is easiest to miss.
      - teach: >
          Run this check before trusting the final number, not after — an
          estimate that fails it is wrong regardless of how reasonable it looks,
          and it costs nothing to run.

  - node: quant-mental.fermi.rounding-one-sig-fig
    hook: >
      Carrying decimals through a Fermi chain feels more careful, but
      every digit past the first is wasted the moment it's multiplied
      against a factor you only trust to a factor of two.
    explanation: >
      A Fermi estimate is only ever as precise as its least precise
      factor, and most factors are honest guesses good to a factor of $2$
      or $3$, not measurements. Carrying a factor like $2.7$ million
      instead of rounding it to $3$ million doesn't buy back any of that
      uncertainty — the product is still dominated by the shakiest input
      in the chain, so the extra digits are computational effort spent on
      precision the answer can't use.

      Rounding aggressively also serves the arithmetic itself: multiplying
      round numbers in your head is close to error-free, while carrying
      decimals through several multiplications under time pressure is
      where actual arithmetic mistakes creep in — mistakes far more
      costly to the final answer than the rounding itself. One
      significant figure per factor is usually enough to keep the product
      within the order of magnitude the factors already guarantee.

      The discipline is to round at the moment you choose each factor, not
      at the end — carrying full precision through several steps only to
      round the final answer gives a false sense that the intermediate
      arithmetic mattered, when the input uncertainty already capped what
      the output could mean.
    worked: >
      A chain has factors $3.4$ million, a $22\%$ rate, and $6.8$
      occurrences a year. Full precision:
      $3.4\times0.22\times6.8\approx5.09$ million. Rounded to one
      significant figure — $3$ million, $20\%$, $7$ — gives
      $3\times0.2\times7=4.2$ million. The two differ by about $17\%$, far
      smaller than the factor-of-$2$, ×/÷, uncertainty already sitting in
      each factor, and the rounded version took a fraction of the time.
    interview: >
      Interviewers notice when a candidate carries needless decimals
      under time pressure — it costs seconds and signals you haven't
      internalized how much the inputs already limit the answer. Rounding
      aggressively and saying so ("call it 3 million") reads as
      confidence, not carelessness.
    pitfalls: >
      Carrying full precision through a long chain and only rounding the
      final answer — the intermediate precision was never real, and it
      burns time better spent double-checking a factor. Rounding
      inconsistently, up on some factors and down on others, which can
      silently bias the product in one direction.
    recap: >
      Round every factor to one significant figure as you choose it —
      extra decimals are wasted once multiplied against a factor-of-$2$
      guess.
    steps:
      - teach: >
          A Fermi estimate is only ever as precise as its least precise factor —
          most factors are honest guesses good to a factor of $2$ or $3$, not
          measurements, so carrying extra decimals doesn't buy any of that
          uncertainty back.
      - teach: >
          One significant figure per factor is usually enough to keep the
          product within the order of magnitude the factors already guarantee,
          and multiplying round numbers in your head is close to error-free
          compared to carrying decimals under time pressure.
      - ask: >
          A chain has factors $4.6$ million, a $35\%$ rate, and $5.8$
          occurrences a year. Round each to one significant figure and multiply
          — what do you get, in millions?
        expects: "12"
        tolerance: 0.5
        hint: >
          Round $4.6\to5$, $35\%\to40\%$, and $5.8\to6$, then multiply the three
          rounded numbers.
        feedback: >
          $5{,}000{,}000\times0.4\times6=12{,}000{,}000$, i.e. $12$ million —
          compare to the full-precision product of about $9.3$ million, a gap
          far smaller than the factor-of-$2$ uncertainty already riding on each
          input.
      - teach: >
          The discipline is to round at the moment you choose each factor, not
          at the end — carrying full precision through several steps only to
          round the final answer gives a false sense that the intermediate
          arithmetic mattered.
      - ask: >
          Which practice matches the rounding discipline this node describes?
        choices:
          - text: >
              Carry full precision through every step and round only the final
              answer.
            feedback: >
              This gives a false sense that the intermediate precision mattered,
              and it's slower for no benefit — the input uncertainty already
              capped what the output could mean.
          - text: >
              Round each factor to one significant figure the moment you choose
              it, then multiply the rounded numbers.
            correct: true
            feedback: >
              Rounding at the source keeps the arithmetic fast and matches the
              precision the answer can actually support.
          - text: >
              Round some factors up and others down, whichever feels safer in
              the moment.
            feedback: >
              Inconsistent rounding can silently bias the product in one
              direction rather than just adding noise.
        feedback: >
          Round early and consistently — the product of rounded factors is close
          enough, and it's far faster and less error-prone to compute.
      - ask: >
          A chain has factors $8{,}700$, a $62\%$ rate, and $2.3$ occurrences a
          year. Round each to one significant figure and multiply — what do you
          get, in thousands?
        expects: "10.8"
        tolerance: 0.5
        hint: >
          Round $8{,}700\to9{,}000$, $62\%\to60\%$, and $2.3\to2$.
        feedback: >
          $9{,}000\times0.6\times2=10{,}800$, i.e. $10.8$ thousand — against a
          full-precision product of about $12.4$ thousand, still comfortably
          inside the uncertainty each factor already carries.
      - teach: >
          Carrying full precision through a long chain burns time better spent
          double-checking a shaky factor, and rounding inconsistently — up here,
          down there — is a subtler way the same carelessness shows up.
      - teach: >
          Round hard and say so out loud — "call it $3$ million" reads as
          confidence that you understand what the inputs can support, not as
          carelessness.

  - node: quant-mental.fermi.stating-assumptions
    hook: >
      Two candidates can reach the same wrong final number, and one
      leaves the room having failed while the other leaves having
      demonstrated exactly the skill being tested — the difference is
      entirely in what got said out loud.
    explanation: >
      A Fermi question is graded on the decomposition, not the digit at
      the end — the interviewer already knows the "true" answer is
      unknowable to more than an order of magnitude, so the object of
      interest is whether your reasoning was sound and legible. Narrating
      each factor as you pick it ("I'll assume a piano gets tuned once a
      year") turns a silent mental calculation into a chain the
      interviewer can audit, agree with, or redirect before a bad
      assumption has propagated through four more steps.

      Silence is the actual failure mode, not a wrong number. An
      assumption buried inside a number you state without comment reads,
      when questioned, exactly like a mistake — the interviewer has no way
      to tell "I assumed X on purpose" from "I don't know where this
      number came from." A stated assumption, by contrast, invites at
      most a one-line correction ("actually assume half that"), which
      costs seconds and redirects the rest of the chain rather than
      voiding the whole estimate.

      This extends past the point values to the bounds and rounding
      choices too — announcing "I'm rounding this to one significant
      figure" or "I'm bounding this between $X$ and $Y$" is itself part
      of the graded reasoning, not bookkeeping to skip past.
    interview: >
      This is less a technique to invoke and more the register the whole
      round is conducted in: think out loud from the first factor, name
      every assumption as you make it, and treat a "why did you assume
      that" follow-up as an invitation, not a challenge to defend against.
    pitfalls: >
      Doing the reasoning silently and presenting only a clean final
      number — it looks efficient but gives the interviewer nothing to
      grade except a possibly-wrong digit. Stating an assumption once at
      the start and then going quiet for the rest of the chain, losing
      the audit trail exactly where it matters most, deeper into the
      decomposition.
    recap: >
      The spoken reasoning chain is what gets scored — narrate every
      assumption, bound, and rounding choice as you make it, not just the
      final number.
    steps:
      - teach: >
          A Fermi question is graded on the decomposition, not the digit at the
          end — the interviewer already knows the "true" answer is unknowable to
          more than an order of magnitude, so the reasoning is the actual object
          of interest.
      - teach: >
          Narrating each factor as you choose it — "I'll assume a delivery
          driver completes about $30$ runs a day" — turns a silent mental
          calculation into a chain the interviewer can audit, agree with, or
          redirect before a bad assumption propagates four steps further.
      - ask: >
          A candidate estimating pet food sold annually says "Chicago has about
          $9$ million metro residents, so..." then falls silent through three
          more multiplications before announcing a final number. What's the
          actual failure here?
        choices:
          - text: >
              The final number is probably wrong.
            feedback: >
              The number might be perfectly reasonable — that's not what's
              actually being graded, and it isn't the problem the silence
              creates.
          - text: >
              The interviewer has no way to tell a deliberate assumption from a
              mistake once the narration stops.
            correct: true
            feedback: >
              Silence is the failure mode, not the digit — every assumption
              buried in that silent stretch reads exactly like an error when
              questioned.
          - text: >
              The candidate should have started from a different population
              figure.
            feedback: >
              This is about narration, not about which anchor was chosen — a
              different starting figure wouldn't fix the actual problem.
        feedback: >
          An unstated assumption and a mistake look identical to the interviewer
          — narrating is what lets them tell the two apart.
      - teach: >
          A stated assumption invites at most a one-line correction — "actually
          assume half that" — which costs seconds and redirects the rest of the
          chain, rather than voiding the whole estimate the way silence does.
      - ask: >
          Which of these best demonstrates the discipline this node describes?
        choices:
          - text: >
              "I'll assume a household throws away $2$ pounds of food waste
              weekly," said as the factor is chosen.
            correct: true
            feedback: >
              Naming the assumption at the moment it's used gives the
              interviewer something to agree with or correct immediately.
          - text: >
              Working the whole chain silently, then reporting "about $40{,}000$
              tons a year."
            feedback: >
              Efficient-looking, but it gives the interviewer nothing to grade
              except a possibly-wrong digit.
          - text: >
              Announcing every assumption once at the very start, then computing
              the rest of the chain in silence.
            feedback: >
              This loses the audit trail exactly where a bad assumption is most
              likely to compound — deeper into the chain, not at the beginning.
        feedback: >
          Narrate each assumption at the point you use it, not all at once up
          front and not only at the end.
      - teach: >
          This extends past the point values to the bounds and rounding choices
          too — announcing "I'm rounding this to one significant figure" is
          itself part of the graded reasoning, not bookkeeping to skip past.
      - teach: >
          Filler narration without a specific number or assumption attached
          doesn't count either — the interviewer needs the figure and its
          justification, not commentary about thinking.
      - teach: >
          Treat a "why did you assume that" follow-up as an invitation to
          redirect, not a challenge to defend — it's the interviewer using
          exactly the audit trail you gave them.

  - node: quant-mental.fermi.cross-check-second-path
    hook: >
      A single decomposition can be internally consistent and still wrong
      in a way no unit check or rounding discipline catches — the fix is
      a second, independent path to the same number.
    explanation: >
      Any one decomposition risks carrying a bad assumption invisibly all
      the way through to a plausible-looking final digit — nothing about a
      single chain being internally consistent guarantees it's right.
      Building a second decomposition from genuinely different factors —
      different anchors, a different structural idea — gives two answers
      that share few or no assumptions, so their agreement or
      disagreement is real evidence rather than the chain agreeing with
      itself.

      Two chains landing within a factor of two or three of each other is
      about as strong a confirmation as a Fermi estimate can produce,
      because it's unlikely two unrelated sets of assumptions would both
      be wrong in the same direction by the same amount. Disagreement by
      an order of magnitude or more usually flags an outright blunder —
      a dropped conversion, a double-counted population — rather than
      ordinary estimation noise, and tells you which chain to re-examine
      first: whichever used the shakier anchor.

      This is the Fermi analogue of checking an arithmetic result by
      recomputing it a different way rather than re-reading the same
      steps — it catches the class of error that re-reading never finds,
      because re-reading a wrong assumption just confirms it looked
      reasonable the first time too.
    worked: >
      Estimate annual haircuts in a city of $3$ million two ways. Demand
      side: $3\times10^{6}$ people at roughly $8$ haircuts a year each
      $\approx2.4\times10^{7}$. Supply side: about 3,000 barbershops (one
      per thousand residents), each with $3$ barbers doing $12$ cuts a
      day over $250$ working days $\approx3{,}000$ cuts a year per
      barber, so $3{,}000\times3\times3{,}000\approx2.7\times10^{7}$. The
      two independent paths land within about $12\%$ of each other —
      strong evidence the true figure is in the mid-tens-of-millions.
    interview: >
      Offered as a follow-up once you've landed a first answer — "can you
      get there a different way?" — and the strongest response starts
      from visibly unrelated factors, not a cosmetic rearrangement of the
      same chain. Volunteering it unprompted after a fast first pass is a
      strong signal on its own.
    pitfalls: >
      Building a "second" path that secretly reuses the same anchor as
      the first — if both chains lean on the same shaky number, their
      agreement proves nothing. Treating close agreement as proof rather
      than evidence — it raises confidence, it doesn't guarantee
      correctness.
    recap: >
      Re-derive the number from unrelated factors; two independent chains
      landing close together is the strongest confirmation a Fermi
      estimate can get.
    steps:
      - teach: >
          Any single decomposition can be internally consistent and still wrong
          in a way no unit check or rounding discipline catches, because nothing
          about a chain agreeing with itself guarantees it's right.
      - teach: >
          Building a second decomposition from genuinely different factors —
          different anchors, a different structural idea — gives two answers
          that share few or no assumptions, so their agreement or disagreement
          is real evidence.
      - ask: >
          Demand-side path: estimate annual pizza deliveries in a city of
          $800{,}000$ people, assuming each resident orders delivery $6$ times a
          year. What's the annual total, in millions?
        expects: "4.8"
        tolerance: 0.15
        hint: >
          Multiply the population by the annual orders per person.
        feedback: >
          $800{,}000\times6=4{,}800{,}000$, i.e. $4.8$ million deliveries a year
          — the demand-side estimate.
      - teach: >
          Two chains landing within a factor of two or three of each other is
          about as strong a confirmation as a Fermi estimate can produce,
          because it's unlikely two unrelated sets of assumptions would both
          miss in the same direction by the same amount.
      - ask: >
          Supply-side path, same city: $400$ delivery drivers, each completing
          $30$ deliveries a day, working $300$ days a year. What annual total
          does that predict, in millions?
        expects: "3.6"
        tolerance: 0.1
        hint: >
          Multiply drivers by deliveries per day, then by working days per year.
        feedback: >
          $400\times30\times300=3{,}600{,}000$, i.e. $3.6$ million — the
          supply-side estimate, built from entirely different anchors than the
          demand side.
      - ask: >
          The two paths land at $4.8$ million and $3.6$ million — within about a
          third of each other. What does that agreement actually tell you?
        choices:
          - text: >
              The two chains are basically worthless, since they don't match
              exactly.
            feedback: >
              Exact agreement was never the bar — two unrelated chains landing
              within a factor of two counts as strong confirmation, not a
              failure.
          - text: >
              It's strong evidence the true figure is in the low millions, since
              two chains sharing few assumptions landed close together.
            correct: true
            feedback: >
              This is exactly the kind of agreement the technique is looking for
              — independent paths, close result.
          - text: >
              One of the chains must be completely wrong, and should be
              discarded.
            feedback: >
              That verdict is for order-of-magnitude gaps, not a roughly
              one-third spread between two estimates that otherwise agree.
        feedback: >
          A one-third spread between two independently built chains is strong
          confirmation, not a red flag — the red flag is disagreement by orders
          of magnitude.
      - teach: >
          A "second" path that secretly reuses the same anchor as the first
          proves nothing — if both chains lean on the same shaky number, their
          agreement is guaranteed regardless of whether either one is right.
      - teach: >
          Disagreement by an order of magnitude or more usually flags an
          outright blunder — a dropped conversion, a double-counted population —
          and tells you which chain to re-examine first: whichever used the
          shakier anchor.

  - node: quant-mental.fermi.subpopulation-weighting
    hook: >
      A single blended rate applied to an entire population is almost
      always wrong in a specific, predictable direction once that
      population is actually a mix of very different behaviors.
    explanation: >
      When the rate you care about differs sharply across groups — heavy
      users and light users, weekdays and weekends — decompose the
      population first, by group, and give each group its own rate before
      combining: $\sum_i w_ir_i$, with $w_i$ each group's population
      share. This is the weighted-average move applied to a Fermi chain
      rather than to two exam scores, generalized to as many groups as the
      population actually splits into.

      The failure mode of skipping this step is specific: a single
      blended rate, whether it's an average of the group rates or a guess
      at "the typical person," systematically misses because the group
      with the most extreme rate almost never carries a weight anywhere
      near $50\%$. Small, intense subgroups get drowned out in a flat
      average even though they can dominate the true total, and large,
      mild subgroups get over-weighted the same way in reverse.

      The fix costs one extra step, not a harder calculation: identify the
      groups with genuinely different rates, estimate each group's
      population share and its own rate separately, and combine with the
      population shares as weights — never average the rates themselves
      unless the groups happen to be equally sized.
    worked: >
      Estimate daily lattes bought in a city of $2$ million, split by
      office workers versus everyone else. Office workers are $15\%$ of
      the population (300,000) at $1.2$ lattes a day each
      $\approx360{,}000$; everyone else is $85\%$ (1,700,000) at $0.1$ a
      day $\approx170{,}000$. Weighted total: $360{,}000+170{,}000=
      530{,}000$ a day. A flat average of the two rates,
      $(1.2+0.1)/2=0.65$, applied to the whole $2$ million gives
      1,300,000 — roughly $2.5\times$ higher than the weighted answer,
      because it gives office workers, only $15\%$ of the population, a
      full $50\%$ of the weight.
    interview: >
      Comes up whenever a question hints at a skewed population —
      "coffee sales near a business district," "ride-share demand on a
      Friday night" — and the tell of a strong answer is splitting the
      population before guessing any single rate, not patching a flat
      guess afterward.
    pitfalls: >
      Averaging the group rates instead of weighting them by population
      share — those agree only when the groups are equal-sized, which is
      rare. Missing a subgroup with an extreme rate entirely because it's
      a small share of the population, when its rate can still dominate
      the weighted sum.
    recap: >
      Blend group-specific rates by population share — a weighted
      average, not a flat one — whenever the rate varies sharply across
      the population.
    steps:
      - teach: >
          When a rate differs sharply across groups, a single blended guess
          applied to everyone is almost always wrong in a specific, predictable
          direction — decompose the population by group first, before guessing
          any rate.
      - teach: >
          Combine group-specific rates as a weighted sum $\sum_iw_ir_i$, with
          $w_i$ each group's population share — the ordinary weighted-average
          move, applied inside a Fermi chain instead of to two exam scores.
      - ask: >
          A city has $1{,}000{,}000$ people on a given day: $95\%$ are residents
          renting bikes at $0.02$ rentals per person, and $5\%$ are tourists
          renting at $0.3$ rentals per person. How many total rentals happen
          that day?
        expects: "34000"
        tolerance: 1000
        hint: >
          Weight each rate by its group's share of the population, then add the
          two pieces.
        feedback: >
          $950{,}000\times0.02=19{,}000$ from residents;
          $50{,}000\times0.3=15{,}000$ from tourists; total
          $19{,}000+15{,}000=34{,}000$ rentals.
      - teach: >
          The failure mode of skipping this is specific: a small, intense
          subgroup gets drowned out in a flat average even though it can
          dominate the true total, while a large, mild subgroup gets
          over-weighted the same way in reverse.
      - ask: >
          Using a flat average rate of $(0.02+0.3)/2=0.16$ applied to the whole
          $1{,}000{,}000$, instead of weighting each group by its population
          share, gives roughly how large an error compared to the correctly
          weighted $34{,}000$?
        choices:
          - text: >
              About the same answer, since averaging two rates is a fair
              shortcut.
            feedback: >
              $0.16\times1{,}000{,}000=160{,}000$, nearly five times the
              correctly weighted $34{,}000$ — averaging the rates ignores that
              tourists are only $5\%$ of the population.
          - text: >
              A large overestimate, because the flat average gives the small,
              high-rate tourist group far more than its true $5\%$ weight.
            correct: true
            feedback: >
              Exactly this — a $50/50$ average hands the tourist rate half the
              weight even though tourists are a twentieth of the population.
          - text: >
              A large underestimate, because tourists are undercounted by the
              flat average.
            feedback: >
              The opposite is true — averaging the rates over-weights tourists
              rather than undercounting them.
        feedback: >
          The flat average overstates the total by close to a factor of five
          here, entirely because it gives a small subgroup half the weight
          instead of its actual $5\%$ share.
      - ask: >
          Same city, but suppose tourists are only $2\%$ of that day's
          population and residents $98\%$, at the same two rates. What's the
          weighted total now?
        expects: "25600"
        tolerance: 800
        hint: >
          Recompute both group totals with the new population shares, then add.
        feedback: >
          $980{,}000\times0.02=19{,}600$ from residents;
          $20{,}000\times0.3=6{,}000$ from tourists; total $25{,}600$ — the
          total moved because the tourist *share*, not the tourist rate,
          changed.
      - teach: >
          Never average the rates themselves unless the groups happen to be
          equally sized, and don't drop a subgroup with an extreme rate just
          because its population share looks small — that's precisely the group
          that can dominate the weighted sum.
      - teach: >
          The fix costs one extra step, not a harder calculation: split the
          population, give each piece its own rate, and weight by population
          share when you combine — never guess one rate for everyone.

  - node: quant-mental.fermi.piano-tuners-chicago
    hook: >
      This is the Fermi archetype for a reason: population to owners to
      service frequency to provider capacity is a chain shape that
      transfers to any "how many X are needed to service Y" question,
      service profession or not.
    explanation: >
      The piano-tuner chain has a shape worth naming on its own:
      (population) to (owners of the thing) to (services needed per year)
      to (capacity per provider) to (providers needed). Each arrow is one
      of decomposition's factors — an ownership rate, a service
      frequency, a working-hours budget — and the final division, total
      annual demand over one provider's annual capacity, is what turns a
      count of things into a count of people employed to service them.

      That last step generalizes past pianos entirely: any "how many X
      does a city need" question about a service — plumbers, dog
      groomers, tax preparers — is the same demand-over-capacity
      division, with the specifics of ownership rate and service
      frequency swapped in. Once you recognize the shape, the actual
      content of the question barely matters; you're filling in the same
      four blanks with different anchors.

      The other reason this example is canonical is that its answer is
      genuinely close to the real one, which is itself instructive: the
      chain's four factors were each guessed to a factor of $2$ or so, yet
      one-sig-fig rounding held all the way through to a final number in
      the right hundreds, not the right thousands or the right tens — the
      archetype demonstrates, not just states, that the earlier
      techniques work when stacked.
    worked: >
      Apply the same chain to dentists in Chicago's metro area, population
      $\approx9.5\times10^{6}$. Assume $1.5$ checkups per person a year
      $\approx1.4\times10^{7}$ visits a year. A dentist sees roughly $20$
      patients a day, $5$ days a week, $48$ weeks a year
      $\approx4{,}800$ visits a year. Dentists needed:
      $1.4\times10^{7}/4{,}800\approx2{,}900$, call it 3,000 — in the
      right range for a metro area of that size.
    interview: >
      Piano tuners in Chicago is the canonical opener precisely because
      it's been asked so often that a memorized final number is worthless
      — what's tested is whether you can produce the chain cold, narrating
      each factor, for whatever service the interviewer actually names.
    pitfalls: >
      Treating "population to owners to service frequency to provider
      capacity" as specific to pianos rather than recognizing it as the
      general template, missing the chance to reuse it instantly on a
      different profession. Forgetting the provider-capacity step needs
      its own working-hours budget, which is where a rushed answer
      usually loses the most accuracy.
    recap: >
      Population to owners to services-per-year to provider capacity is
      the general template — piano tuners just happens to be its
      most-asked instance.
    steps:
      - teach: >
          The piano-tuner chain has a shape worth naming on its own:
          (population) to (owners of the thing) to (services needed per year) to
          (capacity per provider) to (providers needed) — four arrows, each one
          of decomposition's factors.
      - teach: >
          The final division — total annual demand over one provider's annual
          capacity — is what turns a count of things into a count of people
          employed to service them, and it's the step that generalizes past
          pianos entirely.
      - ask: >
          Apply the template to veterinarians. A metro of $4{,}000{,}000$ people
          at $2.5$ people per household has $1$ in $4$ pet-owning households,
          each needing $2$ vet visits a year. A vet sees $16$ patients a day,
          $5$ days a week, $50$ weeks a year. How many vets does the metro need?
        expects: "200"
        tolerance: 10
        hint: >
          Convert population to pet-owning households, multiply by visits per
          household per year, then divide by one vet's annual capacity.
        feedback: >
          $4{,}000{,}000/2.5=1{,}600{,}000$ households;
          $1{,}600{,}000/4=400{,}000$ pet-owning; $\times2=800{,}000$ visits a
          year. Capacity: $16\times5\times50=4{,}000$ visits a year per vet.
          Vets needed: $800{,}000/4{,}000=200$.
      - teach: >
          Any "how many X does a city need" question about a service — plumbers,
          dog groomers, tax preparers — is the same demand-over-capacity
          division, with the ownership rate, service frequency, and
          working-hours budget swapped in for the specifics of that profession.
      - ask: >
          Which of these is *not* one of the four blanks in the
          population-to-providers chain?
        choices:
          - text: >
              Ownership or incidence rate — the fraction of the population that
              needs the service at all.
            feedback: >
              This is the second arrow, converting raw population into owners or
              users of the thing.
          - text: >
              The price charged per service.
            correct: true
            feedback: >
              Price never enters this chain — the template converts population
              into a headcount of providers, not into revenue.
          - text: >
              Provider capacity from a working-hours budget.
            feedback: >
              This is the fourth arrow, converting annual demand into one
              provider's annual ceiling.
        feedback: >
          The chain runs population, ownership rate, service frequency, provider
          capacity, division — price is simply never one of the blanks.
      - ask: >
          Apply the same template to residential electricians. A metro of
          $2{,}500{,}000$ people at $2.5$ people per household has $1$ in $8$
          households calling an electrician once a year. An electrician
          completes $4$ calls a day, $5$ days a week, $50$ weeks a year. How
          many electricians does the metro need?
        expects: "125"
        tolerance: 6
        hint: >
          Same four-step chain as the vet example — households, calling
          households, annual calls, capacity.
        feedback: >
          $2{,}500{,}000/2.5=1{,}000{,}000$ households;
          $1{,}000{,}000/8=125{,}000$ calling households, each generating one
          call a year. Capacity: $4\times5\times50=1{,}000$ calls a year per
          electrician. Electricians needed: $125{,}000/1{,}000=125$.
      - teach: >
          Forgetting that the provider-capacity step needs its own working-hours
          budget is where a rushed answer usually loses the most accuracy — it's
          easy to remember the demand side and rush the supply side.
      - teach: >
          The chain's four factors are each guessed to a factor of $2$ or so,
          yet one-significant-figure rounding holds all the way through to a
          final number in the right hundreds — the archetype demonstrates that
          the earlier techniques work when stacked, not just states it.

  - node: quant-mental.fermi.windows-in-city
    hook: >
      Windows in Chicago is where subpopulation weighting earns its keep
      on a physical-count question, not just a rate question — the same
      population-share-weighted-sum move, applied to counting objects
      instead of counting events.
    explanation: >
      Splitting the housing stock by type before counting windows is the
      same move as weighting a rate by subpopulation, applied to a
      per-unit count instead of a per-person rate: apartments and houses
      have genuinely different window counts, so a single blended
      "windows-per-home" guess would systematically miss for the same
      reason a single blended latte rate misses — whichever type is more
      common doesn't necessarily carry the more typical count.

      The residential split is also where nearly all of the estimate's
      accuracy lives; the commercial add-on at the end is comparatively
      minor and forgiving of a rough percentage, because it's a small
      correction to an already-large residential number rather than a
      peer term. That ordering — get the big, skewed term right first,
      then patch in the smaller correction — is worth carrying to other
      physical-count estimates: spend your accuracy budget on whichever
      split dominates the total, not evenly across every step.

      The technique transfers directly to any "count of X across a
      city's buildings" question — doors, rooms, parking spots — wherever
      building type is the dominant source of variation in the per-unit
      count.
    worked: >
      Estimate windows in Houston. Metro population $\approx7\times10^{6}$
      at $2.8$ people per household gives $\approx2.5\times10^{6}$
      households. Houston sprawls more than Chicago, so say $30\%$
      apartments at $5$ windows and $70\%$ houses at $14$ windows (larger
      suburban lots):
      $0.3\times2.5\times10^{6}\times5+0.7\times2.5\times10^{6}\times14
      \approx3.75\times10^{6}+2.45\times10^{7}\approx2.8\times10^{7}$
      residential windows. Adding $20\%$ for commercial gives
      $\approx3.4\times10^{7}$ windows total.
    interview: >
      A close cousin of piano tuners as an opener; the tell of a strong
      answer is naming the type split before guessing any window count,
      exactly as with any skewed-population estimate, rather than
      reaching for one average number per home.
    pitfalls: >
      Using one blended windows-per-home figure across a metro area that
      actually mixes dense apartments and sprawling houses — the two
      types can differ by a factor of $3$ or more per unit. Spending
      equal effort refining the small commercial correction as the
      dominant residential split, when the residential term is doing
      nearly all the work.
    recap: >
      Split the housing stock by type and weight each type's own window
      count by its population share — the split matters more than either
      window count alone.
    steps:
      - teach: >
          Splitting the housing stock by type before counting windows is the
          same move as weighting a rate by subpopulation, just applied to a
          per-unit count instead of a per-person rate.
      - teach: >
          Apartments and houses have genuinely different window counts, so a
          single blended "windows per home" guess misses for the same reason a
          blended rate misses elsewhere — whichever type is more common doesn't
          necessarily carry the typical count.
      - ask: >
          Estimate residential windows in a metro of $5{,}200{,}000$ people at
          $2.6$ people per household. Assume $40\%$ of households are apartments
          with $6$ windows each, and $60\%$ are houses with $15$ windows each.
          How many residential windows are there, in millions?
        expects: "22.8"
        tolerance: 0.7
        hint: >
          Convert population to households, split by type, multiply each type by
          its own window count, then add.
        feedback: >
          $5{,}200{,}000/2.6=2{,}000{,}000$ households; $800{,}000$ apartments
          $\times6=4{,}800{,}000$ windows; $1{,}200{,}000$ houses
          $\times15=18{,}000{,}000$ windows; total $22{,}800{,}000$, i.e. $22.8$
          million.
      - teach: >
          The residential split is where nearly all of the estimate's accuracy
          lives; a commercial add-on at the end is a small correction to an
          already-large number, not a peer term — spend the accuracy budget on
          whichever split dominates the total.
      - ask: >
          Adding a rough $20\%$ for commercial and municipal buildings to $22.8$
          million residential windows, what's the total, in millions?
        expects: "27.4"
        tolerance: 0.8
        hint: >
          Multiply the residential total by $1.2$.
        feedback: >
          $22.8\times1.2\approx27.4$ million windows total — a small correction
          on top of the dominant residential term.
      - ask: >
          Which statement matches the accuracy-budget lesson here?
        choices:
          - text: >
              Refine the commercial percentage as carefully as the
              apartment/house split, since both are unknowns.
            feedback: >
              The commercial term is a small correction on an already-large
              residential number, not a peer term — effort spent refining it
              barely moves the total.
          - text: >
              Get the residential split right first, since it's the dominant
              term, and treat the commercial add-on as a rough correction.
            correct: true
            feedback: >
              This is exactly where the accuracy in this estimate lives — the
              split that dominates the total deserves the most care.
          - text: >
              Skip the type split and use one blended windows-per-home figure,
              since it saves a step.
            feedback: >
              Apartments and houses can differ by a factor of three or more per
              unit — one blended figure is exactly the error this technique
              avoids.
        feedback: >
          Spend accuracy where the total lives: the residential type split, not
          the smaller commercial correction.
      - teach: >
          Using one blended windows-per-home figure across a metro that actually
          mixes dense apartments and sprawling houses is the main trap, and
          spending equal effort on the small commercial correction as on the
          dominant residential split is a subtler version of the same mistake.
      - teach: >
          The technique transfers directly to any "count of X across a city's
          buildings" question — doors, rooms, parking spots — wherever building
          type is the dominant source of variation in the per-unit count.

  - node: quant-mental.fermi.weight-of-747
    hook: >
      Weight-of-a-747 is the template for any "how heavy is this large
      physical object" question — structure, then whatever fills or fuels
      it — and the density anchor you reach for is the one thing that
      changes between instances.
    explanation: >
      The 747 chain has three terms of genuinely different character: a
      structural weight from volume times material density, a fuel weight
      from a flight-specific fuel budget, and a payload weight from a
      passenger-and-cargo count — three separate estimates added, not one
      chain multiplied through. Getting each term's dimensional check
      right individually matters more than getting any one number exactly
      right, because a unit slip in any single term corrupts a sum the
      other two terms can't rescue.

      The structural term generalizes furthest: any large object's weight
      can be bounded the same way — approximate its shape as a simple
      solid, estimate that solid's volume, and multiply by the density of
      whatever it's mostly made of. The density anchor is the piece that
      changes between instances — aluminum near $2.7$ tonnes per cubic
      meter for an airliner, steel near $7.8$ for a ship, water's density
      near $1$ for anything close to neutrally buoyant, like a large
      marine animal.

      The other lesson worth carrying forward is the "comparable multiple
      for everything else" step: the 747's shell alone is a small
      fraction of its dry structure, and multiplying by a rough factor for
      wings, engines and internals rather than estimating each separately
      is itself a legitimate Fermi move when the sub-parts are too
      numerous to decompose individually.
    worked: >
      Estimate a blue whale's weight. Approximate the body as a tapered
      cylinder $25\,\text{m}$ long and $4\,\text{m}$ across ($2\,
      \text{m}$ radius): a full cylinder's volume is $\pi r^{2}L\approx
      3.14\times4\times25\approx314\,\text{m}^{3}$; tapering front and
      back knocks off roughly $30\%$, giving $\approx220\,\text{m}^{3}$.
      Whale tissue sits close to neutral buoyancy, so density
      $\approx1\,\text{t/m}^{3}$ (water), giving a weight
      $\approx220$ tonnes. The real figure for a large adult is roughly
      $150$ tonnes, so the estimate is high by less than a factor of
      $1.5$ — well within Fermi range, with the miss almost entirely in
      the taper correction, not the underlying idea.
    interview: >
      Any "how much does X weigh" for a large, unfamiliar object is this
      template in disguise — decompose by structure, name a density
      anchor out loud, and state the shape approximation you're making
      before computing anything, since that approximation is usually the
      biggest source of error.
    pitfalls: >
      Reaching for the wrong density anchor — treating a mostly-hollow or
      mostly-water object like solid metal, or vice versa, is a much
      bigger error than misjudging the dimensions. Forgetting the shape
      correction and reporting the uncorrected simple solid's volume as
      if the object were really that shape.
    recap: >
      Bound a large object's weight as approximate volume times a density
      anchor matched to what it's mostly made of, then add fuel or
      payload terms separately.
    steps:
      - teach: >
          Any large, unfamiliar object's weight decomposes into a
          volume-times-density structural term plus whatever fills or fuels it —
          a shape that survives even when what's inside changes entirely, from
          an airliner to a bus.
      - teach: >
          The terms are added, not multiplied through one chain, and getting
          each term's dimensional check right individually matters more than
          nailing any one number, since a unit slip in a single term corrupts a
          sum the other terms can't rescue.
      - ask: >
          Estimate the bare steel weight of a school bus's frame and body
          panels. Approximate the metal as filling roughly $10\,\text{m}^{3}$,
          and use steel's density of about $7.8\,\text{t/m}^{3}$. Roughly how
          many tonnes is the bare structure?
        expects: "78"
        tolerance: 3
        hint: >
          Multiply the metal volume by steel's density.
        feedback: >
          $10\,\text{m}^{3}\times7.8\,\text{t/m}^{3}=78$ tonnes of bare steel
          structure.
      - teach: >
          The structural term generalizes furthest: approximate the object's
          shape as a simple solid, estimate that solid's volume, and multiply by
          the density of whatever it's mostly made of — aluminum near
          $2.7\,\text{t/m}^{3}$, steel near $7.8$, water near $1$ for anything
          close to neutrally buoyant.
      - ask: >
          Estimating a hot-air balloon's envelope versus its wicker basket,
          which density pairing is right?
        choices:
          - text: >
              Steel's density ($\approx7.8$) for the fabric envelope, aluminum's
              ($\approx2.7$) for the wicker basket.
            feedback: >
              Fabric is nowhere near as dense as steel — this anchor pairing
              would overstate the envelope's weight by a huge factor.
          - text: >
              A light-fabric density, well under water's ($\approx1$), for the
              envelope, and a light-wood density, well under aluminum's, for the
              basket.
            correct: true
            feedback: >
              Matching the density anchor to what the object is actually made of
              is the entire point of this step.
          - text: >
              Water's density ($\approx1$) for both, since it's a convenient
              round number.
            feedback: >
              Convenient isn't the same as matched to the material — a wrong
              anchor produces a wrong term no matter how round the number is.
        feedback: >
          The density anchor is the piece that changes between instances;
          picking one that actually matches the material is what makes the
          structural term meaningful.
      - teach: >
          The other move worth carrying forward is multiplying the shell weight
          by a comparable factor for everything else — wings, engines,
          internals, or a bus's seats, wiring, glass — rather than estimating
          each sub-part individually when there are too many to decompose one by
          one.
      - ask: >
          The school bus's bare steel shell is $78$ tonnes. Seats, engine,
          wiring, glass and other internals add a comparable multiple — say
          $2.5\times$ the shell weight. What's the total dry structure weight,
          in tonnes?
        expects: "195"
        tolerance: 8
        hint: >
          Multiply the shell weight by the stated multiple.
        feedback: >
          $78\times2.5=195$ tonnes — the comparable-multiple move standing in
          for a part-by-part count of everything else in the bus.
      - teach: >
          Reaching for the wrong density anchor — treating a mostly-hollow or
          mostly-water object like solid metal, or vice versa — is a bigger
          error than misjudging the dimensions themselves.
      - teach: >
          Forgetting the shape correction and reporting an uncorrected simple
          solid's volume as if the object were really that shape is the other
          common miss — a cylinder or box is a starting approximation, not the
          final word on the shape.
