unit: quant-mental.fermi
opening: >
  Fermi estimation turns an unknowable number into a product of knowable
  ones: decompose the target into factors you can each bound from lived
  experience, track their errors on the log scale where they stay additive
  rather than compounding, and round hard at every step because the inputs
  never supported more precision than that. Anchors, a unit check, and a
  second independent path keep the chain honest; stating every assumption
  out loud is what actually gets scored, not the final digit. It closes on
  three worked classics — piano tuners, windows in a city, the weight of a
  747 — that show the whole toolkit landing within a factor of two of the
  real answer.
lessons:
  - node: quant-mental.fermi.decomposition
    hook: >
      A Fermi question always opens with a number nobody has memorized —
      the entire skill is refusing to guess it directly and instead
      building it from pieces you have lived enough to know.
    explanation: >
      Nobody has "number of piano tuners in Chicago" or "gallons of gas
      pumped in Texas" stored in memory, but everyone has lived enough to
      guess a city's population to within a factor of two, or the fraction
      of families that own something, or how many hours a job takes.
      Decomposition swaps the first, unanswerable question for a chain of
      the second, answerable kind: write the target as a product of
      factors — counts, rates, durations, fractions — each chosen so it's
      something you can picture and bound from experience, never a fact
      you'd have to have read somewhere.

      Two disciplines make the chain trustworthy. First, build it
      symbolically before touching a number: name the factors and confirm
      their units cancel to the target, the same way you'd set up an
      algebra problem before substituting. Second, choose factors that are
      independent of each other's error — if two factors are guessed from
      the same shaky intuition, their errors move together and the
      chain's exposure to that one bad guess doubles, whereas factors
      drawn from unrelated experience tend to miss in different directions
      and partly wash out in the product.

      This is why a five-factor chain, each individually good only to
      within a factor of $2$–$3$, still lands within an order of magnitude
      rather than being off by that factor five times over: the
      overestimates and underestimates partially offset instead of
      stacking. That cancellation is the entire reason decomposition beats
      a single confident guess.
    worked: >
      Estimate the number of gas stations in the United States. Population
      $\approx3.3\times10^{8}$; say $0.8$ cars per person, giving
      $\approx2.6\times10^{8}$ cars. Each car burns roughly $500$ gallons
      a year, so total consumption is $\approx2.6\times10^{8}\times500=
      1.3\times10^{11}$ gallons a year. A typical station pumps on the
      order of $1.5\times10^{6}$ gallons a year. Stations needed:
      $1.3\times10^{11}/1.5\times10^{6}\approx87{,}000$ — the real count
      is around 145,000, well within Fermi range.
    interview: >
      Interviewers open with exactly this shape — "how many piano
      tuners...", "how many gas stations..." — and grade the
      factorization, not the final digit: can you name factors that are
      genuinely independent guesses rather than one guess wearing several
      disguises. State each factor as you choose it and keep the chain
      symbolic until the end.
    pitfalls: >
      Reaching for a number you half-remember from a headline instead of
      one you can justify from lived experience — a recalled fact you
      can't defend under a follow-up is worse than an honest guess.
      Picking factors that are secretly correlated, both driven by the
      same underlying guess, so their errors compound instead of
      canceling.
    recap: >
      Replace one unguessable number with a product of independently
      guessable factors, built symbolically and substituted last.
    dialogue:
      - part: A number nobody has seen
        teach: >
          An interviewer asks how many haircuts are given in a year in a city
          of $2$ million people. No such figure has ever crossed your desk.
          Two colleagues, asked cold, answer $1$ million and $40$ million.
      - ask: >
          The interviewer asks each colleague "why that number?" Who has an
          answer?
        choices:
          - text: >
              The one who said $1$ million: a cautious low guess is easier to
              defend.
            feedback: >
              Low is a direction, not a reason. Asked "why not $3$ million?",
              there is nothing to say — the number came from nowhere, so
              nothing in it can be argued for or corrected.
          - text: >
              Whichever one happens to be closer to the true count.
            feedback: >
              Closeness without a reason is luck, and the interviewer cannot
              see the true count either. What they can see is the reasoning,
              and here there is none.
          - text: >
              Neither: both numbers were pulled whole from the air.
            correct: true
            feedback: >
              Two guesses a factor of $40$ apart, and nothing in either to
              challenge or repair. A number guessed whole has an error you
              cannot even estimate.
        feedback: >
          The city's annual haircut count is unguessable directly because
          nobody has ever experienced it. The useful question is what you
          *have* experienced.
      - ask: >
          Which of these could you put a number on, within a factor of $2$,
          from your own life rather than from anything you have read?
        choices:
          - text: >
              The number of barber shops and salons in the city
            feedback: >
              You have walked past some, but you have never counted a city's
              worth. This is as unseen as the original question — trading one
              unknown for another moves the problem without shrinking it.
          - text: >
              The total yearly revenue of the city's hair salons
            feedback: >
              Another city-wide aggregate nobody has lived, and to turn it into
              haircuts you would also need a price. Two unknowns where there
              was one.
          - text: >
              How often a typical person gets a haircut
            correct: true
            feedback: >
              You have lived this one: every month or two for many people,
              a few times a year for others. Somewhere between $4$ and $12$
              cuts a year is hard to argue with.
        feedback: >
          The city total belongs to nobody's experience; one person's haircut
          habit belongs to everybody's. The population of $2$ million was
          handed to you.

      - part: From one head to two million
        reflect: >
          You can defend a per-person haircut rate, and you know the
          population. Say how to turn those into the number the interviewer
          asked for, and why the result beats both colleagues' guesses.
        hint: >
          What do you get if you multiply a count of people by "haircuts per
          person per year"?
        answer: >
          Multiply: (haircuts per year) $=$ (people) $\times$ (haircuts per
          person per year). The impossible number is rewritten as a product of
          two numbers you can each defend — one handed over, one from your own
          life. Every factor carries its reason, so a challenge lands on one
          piece and you revise that piece, and your doubt about each piece is
          small enough to state out loud.
      - teach: >
          That move is *decomposition into estimable factors*: rewrite the
          unknown as a product of counts, rates, durations and fractions,
          each something you can picture and bound from experience, never a
          figure recalled from print. Write the chain in words first —
          (people) $\times$ (haircuts per person per year) — and check that
          it produces the quantity asked for. Numbers go in last.
      - ask: >
          Say the typical person gets a haircut every $8$ weeks, and a year
          has $52$ weeks. How many haircuts does the city give in a year, in
          millions?
        expects: "13"
        hint: >
          First the per-person rate per year, then the population.
        feedback: >
          $52/8 = 6.5$ cuts per person per year, and
          $2\times10^{6}\times6.5 = 1.3\times10^{7}$, or $13$ million. It lands
          between the two colleagues' guesses, but unlike theirs it arrives
          with two reasons attached.
      - ask: >
          You are sure the per-person rate lies between $4$ and $12$ a year,
          and the population is solid. By what factor do the lowest and
          highest totals the chain allows differ?
        expects: "3"
        hint: >
          Compute both ends, then divide.
        feedback: >
          $2\times10^{6}\times4 = 8$ million and $2\times10^{6}\times12 = 24$
          million, a ratio of $24/8 = 3$. The colleagues spanned a factor of
          $40$; the chain spans $3$, because all the doubt now sits in one
          factor you can bound, and you know which one.
      - ask: >
          Now a longer chain. Suppose one factor came out $1.5$ times too high
          and another, guessed from unrelated experience, $1.5$ times too low.
          By what factor is the product off?
        expects: "1"
        hint: >
          Multiply the two errors together.
        feedback: >
          $1.5\times\frac{1}{1.5} = 1$: the product is exactly right. Errors in
          independently guessed factors point in different directions about as
          often as the same direction, and in a product the opposite ones
          cancel. That is why a chain of several rough factors usually lands
          far closer than its worst case.

      - part: A chain of your own
        ask: >
          A new question: how many loaves of bread does a town of $120{,}000$
          people buy in a week? Which chain would you write down before any
          numbers?
        choices:
          - text: >
              (people) $\times$ (loaves per household per week)
            feedback: >
              The rate is per household but it is multiplied by people, so
              every household is counted once per member — about $2.5$ times
              too many. The words in the chain have to match: a per-household
              rate needs a count of households.
          - text: >
              (bakeries in town) $\times$ (loaves a bakery sells per week)
            feedback: >
              A legitimate shape, but both factors are things you have never
              seen: you do not know the bakery count, and supermarkets sell
              most bread anyway. Factors as unknown as the target have only
              moved the problem.
          - text: >
              (people) $/$ (people per household) $\times$ (loaves per
              household per week)
            correct: true
            feedback: >
              People over people per household gives households, and households
              times loaves per household per week gives loaves per week. Each
              piece is something you have lived — a kitchen goes through a loaf
              or two a week.
        feedback: >
          Read the chain as a sentence before trusting it: each factor's "per"
          must be cancelled by the next factor's count, leaving exactly the
          quantity asked for.
      - ask: >
          Take $2.5$ people per household and $1.5$ loaves per household per
          week. How many loaves does the town buy in a week?
        expects: "72000"
        hint: >
          Households first.
        feedback: >
          $120{,}000/2.5 = 48{,}000$ households, and
          $48{,}000\times1.5 = 72{,}000$ loaves a week. One division and one
          multiplication you could do while talking, on a chain you wrote
          before you knew any of the numbers.

      - part: When the pieces share a hunch
        ask: >
          A candidate estimates a city's yearly restaurant spending as
          (people) $\times$ (restaurant meals per person per week) $\times$
          $52$ $\times$ (price per meal), guessing both the meal frequency and
          the price from one impression: "this feels like a rich city". The
          city is in fact less well-off than they think. What happens to the
          estimate?
        choices:
          - text: >
              The errors cancel: one is a count and the other a price.
            feedback: >
              Cancellation needs errors that point different ways. Both guesses
              came from the same impression, so both are too high together; the
              kind of unit they carry is irrelevant.
          - text: >
              Both factors are too high together, and the overshoots multiply.
            correct: true
            feedback: >
              If each is $1.5$ times too high, the product is
              $1.5\times1.5 = 2.25$ times too high. Two factors driven by one
              hunch are one guess wearing two disguises, and they compound
              instead of cancelling.
          - text: >
              Only the price is off; how often people eat out is the same
              everywhere.
            feedback: >
              Eating-out frequency varies by a factor of several between
              cities, and it moves with income — precisely the hunch that also
              set the price.
        feedback: >
          The cancellation in the bread and haircut chains came from factors
          resting on unrelated experience. When you notice two factors leaning
          on the same belief, ground one of them in something else.
      - ask: >
          Mid-chain, you half-remember a headline claiming the city has
          "$4{,}000$ hair salons". What should you do with it?
        choices:
          - text: >
              Use it as a factor: a real figure beats a guess.
            feedback: >
              Only a figure you can defend beats a guess. Asked where it came
              from, a half-remembered headline has no answer, and if it is
              wrong you cannot say by how much — the very thing a factor from
              experience gives you.
          - text: >
              Keep building from lived factors; if you mention the headline,
              say plainly that it is a recollection.
            correct: true
            feedback: >
              A remembered figure can reassure you the chain is in the right
              region, but it should not be a load-bearing factor. What you can
              defend under a follow-up is what the chain should rest on.
          - text: >
              Average it with your chain's answer.
            feedback: >
              Averaging blends a reasoned number with an unreasoned one and
              leaves you unable to defend the blend. If the two disagree badly,
              that is a reason to recheck the chain, not to split the
              difference.
        feedback: >
          Every factor in a decomposition should survive the question "how do
          you know that?" with an answer from your own experience.
      - teach: >
          Out loud, the haircut answer sounds like this: "Haircuts are people
          times haircuts per person per year. Two million people, about one
          cut every eight weeks, so six or seven a year — call it thirteen
          million." The interviewer hears two factors they can argue with, and
          an argument about one factor costs you ten seconds rather than the
          whole answer.
  - node: quant-mental.fermi.anchor-inventory
    hook: >
      Every decomposition bottoms out in a handful of raw counts —
      population, households, a rate per year — and if those aren't
      already in memory you're deriving them mid-interview instead of
      estimating with them.
    explanation: >
      A decomposition is only as fast as its raw inputs, and world
      population, a country's population, a big city's size, and the
      household count and size behind it show up in enough estimates that
      re-deriving them each time is wasted motion. Holding a handful cold
      — world population $\approx8\times10^{9}$, US population
      $\approx3.3\times10^{8}$, a big US city proper at $3$ to $8$ million
      with its metro roughly $2$–$3\times$ that, US households
      $\approx1.3\times10^{8}$ at about $2.5$ people each — turns the
      first step of most decompositions into instant recall instead of a
      guess you have to defend.

      The seconds-per-year entry is the clearest case of the underlying
      habit: $365\times24\times3600$ is exact but slow to do in your head,
      while $\pi\times10^{7}$ is close enough (the two agree to within
      half a percent) and is one digit-string to remember instead of
      three numbers to multiply. That's the shape of a good anchor — worth
      memorizing precisely because computing it fresh costs more time than
      the precision it buys back.

      Treat every anchor as good to one significant figure only, and no
      better. Chaining several anchors together doesn't get you extra
      precision; it gets you the same one-sig-fig confidence at every
      step, which is exactly the level decomposition is designed to
      tolerate.
    worked: >
      Roughly how many times does a resting heart beat over $70$ years?
      Use seconds per year $\approx\pi\times10^{7}$: $70$ years is
      $\approx70\times3.14\times10^{7}\approx2.2\times10^{9}$ seconds. At
      a resting rate of $70$ beats a minute, that's $70/60\approx1.17$
      beats a second, so total beats
      $\approx2.2\times10^{9}\times1.17\approx2.6\times10^{9}$ — about 2.6
      billion heartbeats in a lifetime.
    interview: >
      These get fired as sub-questions inside a bigger estimate — "what's
      a reasonable US population figure" — expecting instant, confident
      recall rather than a derivation; hesitating on a basic anchor reads
      as not having done estimation before. Volunteer the anchor before
      being asked for it.
    pitfalls: >
      Treating an anchor as exact and stacking decimal precision from it —
      it's good to one significant figure, no more. Recomputing
      $365\times24\times3600$ from scratch under time pressure instead of
      reaching for $\pi\times10^{7}$, burning seconds you don't have.
    recap: >
      A short table of population, household and seconds-per-year
      figures, each trusted to one significant figure, seeds most
      decompositions for free.
    dialogue:
      - part: A figure you keep needing
        teach: >
          Halfway through an estimate of how many trades an exchange handles,
          you need the number of seconds in a year. The interviewer is
          waiting.
      - ask: >
          Work it out exactly — $365$ days of $24$ hours of $3600$ seconds —
          and give the answer in millions of seconds.
        expects: "31.536"
        tolerance: 0.01
        hint: >
          Hours in a year first, then seconds.
        feedback: >
          $365\times24 = 8760$ hours, and $8760\times3600 = 31{,}536{,}000$
          seconds, or $31.536$ million. Three multiplications, the last one
          awkward to do in your head while also holding the rest of the
          estimate.
      - ask: >
          The rest of the trade estimate rests on guesses good to a factor of
          $2$ or so. How many of the digits in $31{,}536{,}000$ can the final
          answer actually use?
        choices:
          - text: >
              All eight: an exact factor makes the whole answer more exact.
            feedback: >
              A product is only as precise as its roughest factor. Multiply
              $31{,}536{,}000$ by a guess that might be off by $2$ and the six
              trailing digits are noise the moment they land.
          - text: >
              One or two: about $3$ times $10^{7}$.
            correct: true
            feedback: >
              Against factors known to a factor of $2$, the leading digit and
              the power of ten are all that survive. The exact multiplication
              bought precision the chain throws away.
          - text: >
              None: seconds per year does not matter in a rough estimate.
            feedback: >
              It matters enormously — it sets the power of ten. Leave it out
              and the answer is off by a factor of thirty million. It is the
              trailing digits that do not matter.
        feedback: >
          You spent the most effort on the factor that needed the least
          precision — and you will need the same factor again in the next
          estimate, and the one after.
      - reflect: >
          This figure turns up in every estimate that converts a per-second
          rate into a per-year total. What should you have done before the
          interview, and in what form should you be carrying the figure?
        hint: >
          Think about the cheapest way to have a number ready that is good to
          one or two significant figures.
        answer: >
          Memorize it, in the cheapest form that is good to a significant
          figure or two. The physicist's form is $\pi\times10^{7}$ — a
          constant you already know times a power of ten, nothing to
          multiply — and it is within half a percent of the exact count. A
          figure that recurs, costs time to derive and is only ever needed
          roughly is exactly the kind worth holding cold.

      - part: The short list, held cold
        teach: >
          That is the idea of an *anchor inventory*: a handful of figures
          memorized in advance, each trusted to one significant figure, that
          seed most decompositions. World population $\approx8\times10^{9}$.
          US population $\approx3.3\times10^{8}$. A large US city proper holds
          $3$ to $8$ million, its metro area $2$ to $3$ times that. US
          households $\approx1.3\times10^{8}$, at about $2.5$ people each.
          Seconds per year $\approx\pi\times10^{7}$.
      - ask: >
          By what percentage is $\pi\times10^{7}$ below the exact
          $31{,}536{,}000$? Give the answer to one decimal place.
        expects: "0.4"
        tolerance: 0.05
        hint: >
          $\pi\times10^{7}\approx31{,}416{,}000$. Divide the gap by the exact
          figure.
        feedback: >
          The gap is $31{,}536{,}000-31{,}416{,}000 = 120{,}000$, and
          $120{,}000/31{,}536{,}000\approx0.004$, or $0.4\%$. An anchor needs to
          be good to one significant figure; this one is good to almost three,
          at the cost of remembering $\pi$.
      - ask: >
          Which of these belongs in the inventory?
        choices:
          - text: >
              The number of hair salons in Chicago
            feedback: >
              That is a target you would estimate, not a seed. It turns up in
              one question, and having it memorized would only tempt you to
              recite instead of reasoning.
          - text: >
              The number of people per US household
            correct: true
            feedback: >
              It converts people into households in almost every consumer
              estimate — anything bought, owned or used per home — and $2.5$
              is good to the one significant figure you need.
          - text: >
              Seconds per year to eight significant figures
            feedback: >
              The right entry in the wrong form: the extra digits cost memory
              and arithmetic and buy nothing, because the chain they enter is
              rough to a factor of $2$.
        feedback: >
          An entry earns its place by recurring across many estimates, being
          slow to derive, and being needed only roughly.

      - part: Anchors doing the work
        ask: >
          Using the world and US population anchors, about one person in how
          many is American?
        expects: "24"
        tolerance: 1
        hint: >
          Divide the world figure by the US figure.
        feedback: >
          $8\times10^{9}/(3.3\times10^{8})\approx24$, so about one person in
          $25$. Two anchors, one division, and a figure nobody memorizes falls
          out.
      - ask: >
          A city proper holds $6$ million people. Using the household-size
          anchor, how many households is that, in millions?
        expects: "2.4"
        hint: >
          People divided by people per household.
        feedback: >
          $6\times10^{6}/2.5 = 2.4\times10^{6}$ households. This conversion is
          the first link of nearly every chain about things a home owns or
          buys.
      - ask: >
          Roughly how many years does a billion seconds last? Use the
          seconds-per-year anchor.
        expects: "32"
        tolerance: 0.5
        hint: >
          Divide $10^{9}$ by $\pi\times10^{7}$.
        feedback: >
          $10^{9}/(3.14\times10^{7}) = 100/3.14\approx31.8$ years. With the
          exact count, $10^{9}/31{,}536{,}000\approx31.7$ — the anchor moves the
          answer by a month in thirty-two years.

      - part: Digits the anchor does not have
        ask: >
          A candidate multiplies the household anchors,
          $1.3\times10^{8}\times2.5$, and announces "so the US has
          $325{,}000{,}000$ people". What is wrong?
        choices:
          - text: >
              It contradicts the population anchor of $3.3\times10^{8}$, so one
              of the anchors must be wrong.
            feedback: >
              $3.25$ and $3.3$ differ by under $2\%$, far inside one significant
              figure. The anchors agree with each other, which is what a
              consistent inventory should do.
          - text: >
              Nothing: the multiplication is correct.
            feedback: >
              The arithmetic is fine; the claim is not. Writing nine digits
              asserts a precision neither $1.3$ nor $2.5$ ever had — each is
              good to a significant figure, so the product is too.
          - text: >
              It reports digits the inputs cannot support: "about
              $3\times10^{8}$" is the honest statement.
            correct: true
            feedback: >
              Anchors are one-significant-figure objects, and chaining them
              keeps that level of confidence without improving it. Say the
              product the way you hold its inputs.
        feedback: >
          Treat every anchor as good to one significant figure, no better, and
          state results built from anchors at the same precision.
      - teach: >
          In an interview, state the anchor as you use it and move on: "about
          three hundred million Americans, two and a half to a household, so
          roughly a hundred and thirty million households." A candidate who
          says that without pausing has visibly done this before; one who
          stops to multiply $365$ by $24$ has not.
  - node: quant-mental.fermi.log-error
    hook: >
      A decomposition's factors are each honest only to a multiplicative
      factor of two or three, and knowing how those errors combine — not
      worrying about it, and not adding them like ordinary uncertainties —
      is what tells you whether a long chain is still worth trusting.
    explanation: >
      If each factor in a product carries a multiplicative error — trusted
      to within a factor of $2$, ×/÷, say — the errors don't add, they
      multiply: two independent factors each off by up to $2\times$ can
      leave the product off by up to $4\times$, not $2\times$. That's just
      restating that an error rides along with the factor it belongs to,
      and factors combine by multiplication.

      Taking logs turns that multiplicative pile-up into an ordinary sum:
      $\log(\text{total error})=\sum_i\log(\text{error}_i)$, so the tool
      for reasoning about it is the same log arithmetic used everywhere
      else in mental math, not a new one. A factor trusted to a factor of
      $2$ contributes $\log_{10}2\approx0.301$ to that sum; a factor
      trusted only to a factor of $5$ contributes
      $\log_{10}5\approx0.699$ instead — messier factors cost more
      log-budget, and the cost is additive across the chain regardless of
      how many factors there are.

      This is why a long chain doesn't collapse: growth in log space is
      additive and bounded by how many factors you used, not runaway
      multiplicative growth. It also gives a design rule while building
      the decomposition — count the uncertain factors and roughly how
      uncertain each is, and you can predict, before computing anything,
      the order of magnitude of trust the final number deserves.
    worked: >
      A decomposition chains four uncertain factors: three trusted to a
      factor of $2$ and one — a fraction you're genuinely unsure about —
      trusted only to a factor of $5$. Log-error budget:
      $3\times\log_{10}2+\log_{10}5\approx3(0.301)+0.699\approx1.602$.
      Total error factor $\approx10^{1.602}\approx40$, so the final answer
      should be read as good to within about a factor of $40$ either way —
      worse than any one factor, but a bounded, namable range rather than
      an unbounded guess.
    interview: >
      Rarely asked for directly, but a strong finish to any multi-step
      estimate is naming the resulting confidence unprompted — "so I'd
      trust this to within a factor of ten or so" — which signals you
      tracked uncertainty through the whole chain, not only at the end.
    pitfalls: >
      Adding percentage errors instead of multiplying the error factors —
      a factor off by $50\%$ and one off by $100\%$ don't combine to
      "$150\%$ off," they combine multiplicatively. Assuming every factor
      is equally uncertain when one is actually much shakier — that one
      factor dominates the log-error sum and deserves the most scrutiny.
    recap: >
      Multiplicative errors add on the log scale, so a five-factor chain
      each good to a factor of $2$ lands within roughly a factor of $30$,
      not runaway error.
    dialogue:
      - part: Two shaky factors, one product
        teach: >
          You estimate the umbrellas a city buys in a year as (people) $\times$
          (umbrellas bought per person per year). You put the population at
          $1.5$ million and the rate at $0.4$, and you trust each only to
          within a factor of $2$ either way.
      - ask: >
          Suppose both guesses turn out too low by the full factor of $2$. By
          what factor is your product too low?
        expects: "4"
        hint: >
          The true product is the true population times the true rate. Write
          each as twice your guess.
        feedback: >
          The truth is $(2\times1.5\text{ million})\times(2\times0.4)$, which is
          $2\times2 = 4$ times your $0.6$ million. Each error rides along with
          its factor, and the factors multiply, so the errors multiply too.
      - ask: >
          A different miss: your population guess is $50\%$ too high and your
          rate guess is $100\%$ too high. By what percentage is the product
          too high?
        expects: "200"
        hint: >
          Turn each percentage into a factor first: $50\%$ too high means
          $1.5$ times the truth.
        feedback: >
          The factors are $1.5$ and $2$, so the product is $1.5\times2 = 3$
          times the truth, which is $200\%$ too high. Adding the percentages
          gives $150\%$, and that is wrong by a full factor of $1.2$: percentage
          errors do not add when the quantities multiply.
      - ask: >
          Your population guess is $3$ times too high and your rate guess is
          $2$ times too low. By what factor is the product off, and which way?
        choices:
          - text: >
              Too high by a factor of $1.5$
            correct: true
            feedback: >
              $3\times\frac{1}{2} = 1.5$. Opposite misses divide out, and only
              their ratio survives.
          - text: >
              Off by a factor of $5$, because $3 + 2 = 5$
            feedback: >
              Adding treats the two misses as if they pushed the same way. One
              multiplies the product by $3$ and the other by $\frac{1}{2}$, and
              together they multiply it by $1.5$.
          - text: >
              Too high by a factor of $6$, because $3\times2 = 6$
            feedback: >
              Multiplying is right, but the rate was too *low*, so its error is
              $\frac{1}{2}$, not $2$. $6$ is what you get if both missed the same
              way.
        feedback: >
          An error factor of $2$ upward and one of $2$ downward are opposites:
          $2$ and $\frac{1}{2}$. Combining them is multiplication, and
          multiplication is clumsy to track across ten factors in your head.

      - part: Turning the product into a sum
        reflect: >
          Error factors combine by multiplying: $2$ and $3$ make $6$, $2$ and
          $\frac{1}{2}$ make $1$. You would rather keep a running *sum*, the way
          you tally a budget. What could you do to each error factor so that
          combining them becomes addition, and what does an error of $\frac{1}{2}$
          become?
        hint: >
          Which function turns a product into a sum?
        answer: >
          Take logarithms. $\log(ab) = \log a + \log b$, so the log of the total
          error is the sum of the logs of the individual errors. A factor of
          $2$ becomes $\log_{10}2\approx0.301$ and a factor of $\frac{1}{2}$
          becomes $-0.301$, so opposite misses literally cancel as plus and
          minus. You budget in logs, then raise $10$ to the total to get back
          to an ordinary factor.
      - teach: >
          That is the whole intuition: *multiplicative errors add on the log
          scale*. If factor $i$ is trusted to within a factor $e_i$, ×/÷, the
          worst-case total satisfies
          $\log_{10}(\text{total}) = \sum_i \log_{10} e_i$. A factor good to
          $2$ costs $0.301$ of budget, one good to $3$ costs $0.477$, one good
          to $10$ costs a full $1$. Each new factor adds its cost; nothing
          compounds beyond that.
      - ask: >
          A chain for a city's yearly dog-licence fees has four factors, each
          trusted to within a factor of $3$, ×/÷. Using
          $\log_{10}3\approx0.477$, what is the total log-error budget?
        expects: "1.91"
        tolerance: 0.01
        hint: >
          Four equal costs, added.
        feedback: >
          $4\times0.477 = 1.908$, about $1.91$.
      - ask: >
          Convert that budget back into an ordinary error factor: about how
          large is $10^{1.91}$?
        expects: "81"
        tolerance: 3
        hint: >
          You can also skip the logs here: what is $3^{4}$?
        feedback: >
          $10^{1.91}\approx81$, which is exactly $3\times3\times3\times3$. The
          log route and the direct product agree, as they must; the log route
          is the one that still works when the factors are $2$, $3$, $1.5$ and
          $10$ and you are talking at the same time.

      - part: Where adding percentages almost works
        ask: >
          Two factors are each $10\%$ too high. By what percentage is their
          product too high?
        expects: "21"
        tolerance: 0.1
        hint: >
          $1.1\times1.1$.
        feedback: >
          $1.1\times1.1 = 1.21$, so $21\%$ too high. Adding the percentages
          says $20\%$, which is barely wrong. For small errors the percentage
          is almost the same as the log-scale cost, so adding them is a fine
          shortcut. At a factor of $2$ it breaks: two $100\%$ misses make
          $300\%$, not $200\%$.
      - ask: >
          A chain of four factors, each good to a factor of $2$, ×/÷, gives
          $5{,}000$. What is the honest way to read that number?
        choices:
          - text: >
              Good to a factor of $2$, since no single factor is worse than
              that.
            feedback: >
              The errors accumulate. Four costs of $0.301$ make $1.2$, and
              $10^{1.2}\approx16$: the worst case is a factor of $16$, not $2$.
          - text: >
              Somewhere between $5{,}000\times(1 - 4)$ and $5{,}000\times(1 + 4)$,
              adding four $100\%$ errors.
            feedback: >
              That lower end is negative, which no count can be. Adding
              percentages for large errors produces nonsense; on the log scale
              the range is symmetric in factors, never below zero.
          - text: >
              Within a factor of about $16$ in the worst case — roughly $300$ to
              $80{,}000$ — and usually much closer, since independent misses
              partly cancel.
            correct: true
            feedback: >
              $4\times0.301 = 1.2$ and $10^{1.2}\approx16$, so $5{,}000/16\approx300$
              and $5{,}000\times16 = 80{,}000$. The sum of the costs is the case
              where every factor misses the same way; in practice some misses
              point up and some down, and they cancel as plus and minus.
        feedback: >
          The log budget is a worst case that grows by a fixed amount per
          factor, which is why a long chain degrades steadily instead of
          blowing up.

      - part: Spending the budget
        ask: >
          One factor in a chain is a fraction you can only pin to within a
          factor of $10$. You find you can rewrite it as a product of two
          sub-factors, each good to a factor of $2$. What is the log-error of
          the two sub-factors together?
        expects: "0.602"
        tolerance: 0.005
        hint: >
          Two costs of $\log_{10}2$.
        feedback: >
          $2\times0.301 = 0.602$, against the original factor's cost of
          $\log_{10}10 = 1$. The split turns a factor-of-$10$ doubt into a
          factor-of-$4$ one: more factors, less error.
      - ask: >
          So when does splitting one factor into two make the chain *worse*?
        choices:
          - text: >
              Always: every extra factor adds error to the budget.
            feedback: >
              Every extra factor adds its cost, but the factor it replaces
              stops costing anything. You just saw a split cut the budget from
              $1$ to $0.602$.
          - text: >
              When the pieces' costs add to more than the original's — two
              pieces each good only to a factor of $4$ cost $1.2$, more than a
              factor-of-$10$ guess.
            correct: true
            feedback: >
              $2\times\log_{10}4\approx1.2 > 1$. A split pays only when the
              pieces are much tighter than the whole. Splitting is a trade, and
              the log budget is how you price it.
          - text: >
              Never: a finer decomposition is always more accurate.
            feedback: >
              Pieces you can barely guess cost more than they save. Two factors
              each good to $4$, ×/÷, are a worse bet than one good to $10$.
        feedback: >
          Before you finish an estimate you can say how much to trust it: count
          the factors, price each one's doubt in logs, add. "Four factors,
          each good to a factor of two, so I would trust this to within a
          factor of ten or twenty" is the sentence that tells an interviewer
          you tracked the error the whole way.

  - node: quant-mental.fermi.geometric-mean-bounds
    hook: >
      Bounds alone don't tell you where inside them to point your final
      guess, and reaching for the ordinary average is the single most
      common way to blow a Fermi answer that has otherwise gone right.
    explanation: >
      A confident lower bound $L$ and upper bound $U$ pin down a wide
      range but not where inside it the true value probably sits. The
      arithmetic mean $(L+U)/2$ answers that in linear space, where it's
      dominated by whichever bound is larger — for $L=10^{4}$ and
      $U=10^{6}$ the arithmetic mean is 505,000, sitting almost on top of
      $U$ and nowhere near a fair midpoint.

      The fix is to average in log space instead, exactly the space where
      the log-error argument already says uncertainty behaves
      symmetrically: $\log(\sqrt{LU})=(\log L+\log U)/2$, the ordinary
      average of the two exponents. Bounds of $10^{4}$ and $10^{6}$
      average to exponent $5$, a guess of $10^{5}$ — the point equally far
      (in factor terms) from both bounds, which is the sense in which
      "equally far from confident-too-low and confident-too-high" ought
      to be measured.

      The shortcut is the same move as reading off an order of magnitude
      anywhere else in this unit: write both bounds as powers of ten, or
      the nearest round power, average the exponents, and read off the
      answer — no square-root arithmetic needed once the bounds are
      already round numbers.
    worked: >
      You're confident a quantity exceeds $50$ and is under 5,000, with no
      narrower information. Geometric mean: $\sqrt{50\times5000}=
      \sqrt{250000}=500$. The arithmetic mean would say 2,525 — about five
      times higher, and sitting far closer to the upper bound than to the
      lower one. $500$ is the honest midpoint to report, not 2,525.
    interview: >
      Comes up whenever you've bounded a quantity but have no further
      information, often as the interviewer's own check: "so is it closer
      to the low end or the high end?" The right answer is "neither — the
      square root of the product," said without hesitation.
    pitfalls: >
      Defaulting to $(L+U)/2$ out of habit — that's the right average for
      additive uncertainty, not the multiplicative uncertainty a Fermi
      bound almost always has. Forgetting the shortcut needs the bounds'
      exponents, not the bounds themselves — average the powers of ten,
      then convert back.
    recap: >
      Guess the geometric mean of your bounds, not the arithmetic mean —
      average the exponents, not the numbers.
    dialogue:
      - part: Two confident bounds and one number to say
        teach: >
          An interviewer asks how many people visit a small regional museum
          in a year. You are confident it is more than $1{,}000$ and less than
          $100{,}000$, and nothing narrower comes to mind. You have to name
          one number.
      - ask: >
          The midpoint most people reach for first is the ordinary average of
          the two bounds. What is it?
        expects: "50500"
        feedback: >
          $(1{,}000 + 100{,}000)/2 = 50{,}500$. It looks like the fair middle.
          Test it against the two ends of your range.
      - ask: >
          If the truth turns out to sit near your lower bound, $1{,}000$, by
          what factor is $50{,}500$ too high?
        expects: "50.5"
        tolerance: 0.5
        feedback: >
          $50{,}500/1{,}000 = 50.5$. A miss by a factor of fifty.
      - ask: >
          And if the truth sits near your upper bound, $100{,}000$, by what
          factor is $50{,}500$ too low?
        expects: "2"
        tolerance: 0.05
        feedback: >
          $100{,}000/50{,}500\approx1.98$, about a factor of $2$. So the
          ordinary average risks a factor of $50$ on one side and a factor of
          $2$ on the other: it is sitting almost on top of the upper bound.
      - reflect: >
          Fermi doubts are about factors — "off by $3\times$" — not about
          differences. What single number would be the *same factor* away from
          both bounds, and how would you find it quickly from $1{,}000$ and
          $100{,}000$?
        hint: >
          Write both bounds as powers of ten.
        answer: >
          $10{,}000$: it is $10$ times the lower bound and $\frac{1}{10}$ of the
          upper. On the log scale the bounds are exponents $3$ and $5$, and the
          fair middle is the exponent halfway between them, $4$. In ordinary
          numbers that midpoint is $\sqrt{1{,}000\times100{,}000} = \sqrt{10^{8}}
          = 10^{4}$.

      - part: The midpoint on the log scale
        teach: >
          That is the *geometric mean of bounds*: given a confident lower
          bound $L$ and upper bound $U$ and nothing narrower, guess
          $\sqrt{LU}$, not $(L+U)/2$. The shortcut is to average the
          exponents: $\log\sqrt{LU} = (\log L + \log U)/2$. It is the log-scale
          midpoint, which is where a doubt measured in factors is symmetric.
      - ask: >
          Why is $\sqrt{LU}$ the number that is the same factor from both
          bounds?
        choices:
          - text: >
              Because it is always smaller than $(L+U)/2$, and smaller guesses
              are safer.
            feedback: >
              It is never larger than the ordinary average, but that is a
              consequence, not the reason, and smaller is not safer: a guess
              far too low misses as badly as one far too high.
          - text: >
              Because the guess $x$ with $x/L = U/x$ satisfies $x^{2} = LU$.
            correct: true
            feedback: >
              Setting the factor above $L$ equal to the factor below $U$ gives
              $x^{2} = LU$, so $x = \sqrt{LU}$. Here $10{,}000/1{,}000 = 10 =
              100{,}000/10{,}000$.
          - text: >
              Because the true value is more likely to be small.
            feedback: >
              Nothing in the bounds says small values are likelier. The claim is
              only that each power of ten between them is about equally
              plausible, so the middle power of ten is the fair guess.
        feedback: >
          Equal factors on both sides is the definition of the middle when
          error is multiplicative, and the log-error picture says Fermi error
          is.
      - ask: >
          You are confident a quantity is more than $400$ and less than
          $90{,}000$. What is the geometric-mean guess?
        expects: "6000"
        tolerance: 50
        hint: >
          Multiply the bounds, then take the square root of the product.
        feedback: >
          $400\times90{,}000 = 36{,}000{,}000$, and its square root is $6{,}000$.
          Check: $6{,}000/400 = 15$ and $90{,}000/6{,}000 = 15$. The ordinary
          average, $45{,}200$, would have been $7.5$ times higher.
      - ask: >
          Bounds of $1{,}000$ and $1{,}000{,}000$: the exponents are $3$ and $6$.
          What is the geometric-mean guess?
        expects: "31600"
        tolerance: 700
        hint: >
          The average exponent is $4.5$, and $10^{0.5} = \sqrt{10}\approx3.16$.
        feedback: >
          $10^{4.5} = 10^{4}\times\sqrt{10}\approx31{,}600$. When the exponents
          sum to an odd number, the answer carries a $\sqrt{10}$, and saying
          "about thirty thousand" is plenty.

      - part: Where the log midpoint fails
        ask: >
          A candidate says a count is "somewhere between $0$ and $500$" and
          takes the geometric mean. What goes wrong?
        choices:
          - text: >
              Nothing: $\sqrt{0\times500}$ is a fine guess.
            feedback: >
              $\sqrt{0\times500} = 0$, the one answer you are sure is wrong.
              Zero is infinitely many factors below any positive number, so on
              the log scale the range has no middle.
          - text: >
              The bounds are too narrow for the geometric mean to matter.
            feedback: >
              $0$ to $500$ is not narrow in factor terms — it is infinitely
              wide, which is the problem.
          - text: >
              A lower bound of $0$ is not a confident bound in factor terms; the
              guess collapses to $0$.
            correct: true
            feedback: >
              The method needs a positive $L$ you actually believe. Push
              yourself to a real lower bound — "surely at least $20$" — and
              $\sqrt{20\times500} = 100$ is a usable guess.
        feedback: >
          The geometric mean measures the range in factors, so both bounds
          have to be positive numbers you would defend.
      - ask: >
          You are confident a quantity lies between $90$ and $110$. Which
          midpoint should you report?
        choices:
          - text: >
              The geometric mean, always: Fermi error is multiplicative.
            feedback: >
              $\sqrt{90\times110}\approx99.5$, against an ordinary average of
              $100$. The rule is not wrong here; it is just irrelevant.
          - text: >
              Either: on a range this narrow the two agree to half a percent.
            correct: true
            feedback: >
              The ordinary average drifts toward $U$ only when $U/L$ is large.
              At $U/L\approx1.2$ the log scale and the ordinary scale are
              nearly the same straight line, so the two midpoints coincide.
          - text: >
              The arithmetic mean, since the geometric mean only works for
              powers of ten.
            feedback: >
              The geometric mean works for any positive bounds; powers of ten
              just make the arithmetic easy. Here it gives $99.5$.
        feedback: >
          The gap between the two midpoints grows with $U/L$: a factor of
          $1.2$ makes no difference, a factor of $100$ makes a fivefold one.
          Fermi bounds are usually wide, which is why the habit matters.
      - teach: >
          When an interviewer asks "closer to the low end or the high end?",
          the answer is "neither — the middle in factors": "more than a
          thousand, less than a hundred thousand, so I will say ten thousand."

  - node: quant-mental.fermi.dimensional-check
    hook: >
      A decomposition can be built from individually plausible factors and
      still be wrong in an instant, obvious way once you check that the
      units actually cancel to the thing you were asked for.
    explanation: >
      Every factor in a decomposition carries units, and the chain only
      means what you intend if those units cancel to the target: "cars
      sold per year" needs (people) times (cars per person per year), not
      (people) times (years per car) — the second gives person-years, not
      a count of cars at all. Writing the units alongside each factor as
      you build the chain, before any number goes in, turns this into a
      check you get for free rather than an afterthought.

      The value of the check is that it's independent of whether any
      number is right. A unit mismatch exposes the wrong operation —
      multiplying where you should have divided, or vice versa — a
      structural error that no amount of correcting individual numbers
      will fix, and one that a plausible-looking final answer can easily
      hide. For chained conversions, write each factor as a fraction with
      the unit you want gone sitting in the numerator of the next factor,
      so cancellation is visible step by step rather than trusted by eye.

      Run the check before trusting the final number, not after: an
      estimate that fails it is wrong regardless of how reasonable it
      looks, and one that passes has at least ruled out the most common
      class of Fermi mistake.
    worked: >
      Estimate new cars sold in the US per year from the standing fleet
      and its lifespan: cars on the road $\approx2.6\times10^{8}$, average
      vehicle lifespan $\approx15$ years. Units:
      $(\text{cars})/(\text{years per car})=\text{cars per year}$ —
      correct. Sold per year $\approx2.6\times10^{8}/15\approx
      1.7\times10^{7}$, close to the real figure of roughly
      $1.5\times10^{7}$. Multiplying by $15$ instead of dividing would
      have given car-years, not a count — a number about $225\times$ too
      large, caught by the unit check before checking a single fact.
    interview: >
      Rarely asked for outright, but stating it — "let me check the units
      cancel to what we want" — right after setting up the chain is one
      of the fastest ways to signal rigor, and it's the first thing to
      reach for when a computed answer feels implausible.
    pitfalls: >
      Trusting a chain because each factor looks reasonable in isolation,
      without confirming the units multiply out to the target — plausible
      factors can still combine with the wrong operation. Skipping the
      check because the final number "looks about right," which is
      exactly when a structural error is easiest to miss.
    recap: >
      Track units through the chain and confirm they cancel to the
      target — the check costs nothing and doesn't depend on any single
      number being correct.
    dialogue:
      - part: A plausible number from a broken chain
        teach: >
          A candidate estimates the toothbrushes a city of $2$ million buys in
          a year. "People replace a toothbrush every $6$ months," he says, "so
          $2$ million times $6$ — about $12$ million toothbrushes a year." It
          sounds reasonable, and it is said with confidence.
      - ask: >
          Redo it yourself. If each person replaces a toothbrush every $6$
          months, how many toothbrushes does the city buy in a year, in
          millions?
        expects: "4"
        hint: >
          How many replacements does one person make in a year?
        feedback: >
          One every $6$ months is $12/6 = 2$ a year, so
          $2\times10^{6}\times2 = 4\times10^{6}$, or $4$ million.
      - ask: >
          By what factor is the candidate's $12$ million too high?
        expects: "3"
        feedback: >
          $12/4 = 3$. Not an absurd miss — and that is the danger. Both
          numbers would pass a glance, and nobody in the room knows the true
          count to compare against.
      - reflect: >
          Neither of you knows the true count, and both answers look
          plausible. What could you check about the candidate's chain itself,
          without any outside figure, that shows it cannot be right?
        hint: >
          Say what each factor in "$2$ million times $6$" counts, with its
          unit.
        answer: >
          The units. (people) $\times$ (months between replacements) is
          person-months — a quantity of time, not a number of toothbrushes per
          year. The months belong in the denominator: (people) $\times$
          (replacements per person per year), where replacements per year is
          $12$ months divided by $6$ months per replacement. The chain fails
          before any number is checked.

      - part: Units that must cancel
        teach: >
          That check is *dimensional consistency*: write each factor with its
          unit, and confirm the units cancel to exactly the target unit before
          you trust the number. It catches a wrong operation — multiplying by
          a duration where you should divide by it — regardless of whether any
          individual number is right. A chain that fails it is wrong however
          reasonable its answer looks.
      - ask: >
          Which chain produces "toothbrushes per year"?
        choices:
          - text: >
              (people) $\times$ (months per replacement) $\times$ (toothbrushes
              per replacement)
            feedback: >
              People times months is still person-months; multiplying by a
              count per replacement does not remove the months. The unit left
              over is person-months, not anything per year.
          - text: >
              (people) $\times$ (replacements per person per year) $\times$
              (toothbrushes per replacement)
            correct: true
            feedback: >
              People cancel against "per person", replacements cancel against
              "per replacement", and toothbrushes per year is what remains.
          - text: >
              (people) $/$ (replacements per person per year)
            feedback: >
              People divided by a per-person-per-year rate gives
              person-squared-years per replacement, nothing countable.
              Dividing where you should multiply is the same class of slip as
              the candidate's.
        feedback: >
          Read every "per" as a fraction bar, and check that each unit in a
          denominator meets the same unit in a numerator.
      - ask: >
          A dripping tap releases $1$ drop a second, and $20$ drops make a
          millilitre. You want litres per day. After writing
          $1\,\frac{\text{drop}}{\text{s}}$, which factor comes next?
        choices:
          - text: >
              Multiply by $86{,}400\,\frac{\text{s}}{\text{day}}$
            correct: true
            feedback: >
              Seconds sit in the numerator, cancelling the seconds in the
              denominator of drops per second. What remains is drops per day.
          - text: >
              Divide by $86{,}400\,\frac{\text{s}}{\text{day}}$
            feedback: >
              Dividing puts seconds in the denominator twice: drops per second
              squared, times days. The seconds have to cancel, so they must sit
              upstairs.
          - text: >
              Multiply by $20\,\frac{\text{drops}}{\text{mL}}$
            feedback: >
              That leaves $\text{drops}^{2}$ per second per millilitre. To get
              rid of drops you need drops in a denominator:
              $\frac{1\,\text{mL}}{20\,\text{drops}}$.
        feedback: >
          Each factor is a fraction arranged so the unit you want gone sits on
          the opposite level of the next factor.
      - ask: >
          Finish the chain: how many litres does the tap waste in a day?
        expects: "4.32"
        tolerance: 0.01
        hint: >
          Drops per day, then millilitres, then litres.
        feedback: >
          $1\times86{,}400 = 86{,}400$ drops a day; $\times\frac{1}{20}$ gives
          $4{,}320$ mL; $\times\frac{1}{1000}$ gives $4.32$ litres a day. Every
          unit cancelled except litres per day.
      - ask: >
          A delivery van drives $900$ km a week and gets $12$ km per litre of
          fuel. How many litres does it burn in a week?
        expects: "75"
        hint: >
          You want litres. Which arrangement of km per week and km per litre
          leaves litres?
        feedback: >
          $\frac{900\,\text{km/week}}{12\,\text{km/L}} = 75$ litres a week: the
          kilometres cancel and litres per week remain. $900\times12 = 10{,}800$
          would be $\text{km}^{2}$ per litre per week, and $12/900$ would be
          weeks per litre.

      - part: What the check cannot see
        ask: >
          A chain for the dog food a town buys in a month passes the unit
          check. Which mistake could still be hiding in it?
        choices:
          - text: >
              Multiplying by "months a bag lasts" instead of dividing by it.
            feedback: >
              That leaves bag-months in the result, which is exactly what the
              check exists to catch.
          - text: >
              Applying a per-household rate to a count of people.
            feedback: >
              If you label the factors honestly — people, and bags per household
              — the people never cancel, and the check fails. It catches this
              one too, as long as you write the units down.
          - text: >
              Leaving out "the fraction of households that own a dog".
            correct: true
            feedback: >
              A fraction is unitless, so dropping it changes the number and
              leaves the units untouched. The check guards the structure of the
              chain, not the presence of every dimensionless factor or the size
              of any number.
        feedback: >
          The unit check rules out the wrong operation; it says nothing about a
          missing fraction or a bad guess. That is why it pairs with tracking
          how far each number might be off rather than replacing it.
      - teach: >
          Out loud it takes one sentence, right after you set up the chain:
          "people, times replacements per person per year — so the units come
          out as toothbrushes per year." An interviewer who hears that knows
          the structure is sound before you have multiplied anything.

  - node: quant-mental.fermi.rounding-one-sig-fig
    hook: >
      Carrying decimals through a Fermi chain feels more careful, but
      every digit past the first is wasted the moment it's multiplied
      against a factor you only trust to a factor of two.
    explanation: >
      A Fermi estimate is only ever as precise as its least precise
      factor, and most factors are honest guesses good to a factor of $2$
      or $3$, not measurements. Carrying a factor like $2.7$ million
      instead of rounding it to $3$ million doesn't buy back any of that
      uncertainty — the product is still dominated by the shakiest input
      in the chain, so the extra digits are computational effort spent on
      precision the answer can't use.

      Rounding aggressively also serves the arithmetic itself: multiplying
      round numbers in your head is close to error-free, while carrying
      decimals through several multiplications under time pressure is
      where actual arithmetic mistakes creep in — mistakes far more
      costly to the final answer than the rounding itself. One
      significant figure per factor is usually enough to keep the product
      within the order of magnitude the factors already guarantee.

      The discipline is to round at the moment you choose each factor, not
      at the end — carrying full precision through several steps only to
      round the final answer gives a false sense that the intermediate
      arithmetic mattered, when the input uncertainty already capped what
      the output could mean.
    worked: >
      A chain has factors $3.4$ million, a $22\%$ rate, and $6.8$
      occurrences a year. Full precision:
      $3.4\times0.22\times6.8\approx5.09$ million. Rounded to one
      significant figure — $3$ million, $20\%$, $7$ — gives
      $3\times0.2\times7=4.2$ million. The two differ by about $17\%$, far
      smaller than the factor-of-$2$, ×/÷, uncertainty already sitting in
      each factor, and the rounded version took a fraction of the time.
    interview: >
      Interviewers notice when a candidate carries needless decimals
      under time pressure — it costs seconds and signals you haven't
      internalized how much the inputs already limit the answer. Rounding
      aggressively and saying so ("call it 3 million") reads as
      confidence, not carelessness.
    pitfalls: >
      Carrying full precision through a long chain and only rounding the
      final answer — the intermediate precision was never real, and it
      burns time better spent double-checking a factor. Rounding
      inconsistently, up on some factors and down on others, which can
      silently bias the product in one direction.
    recap: >
      Round every factor to one significant figure as you choose it —
      extra decimals are wasted once multiplied against a factor-of-$2$
      guess.
    dialogue:
      - part: Every digit, by hand
        teach: >
          You are estimating weekly train trips in a metro area. Your chain:
          $3.8$ million people, of whom $27\%$ commute by train, each making
          $9.4$ trips a week. Every one of those is a guess you would defend
          only to within a factor of $2$.
      - ask: >
          Multiply it out exactly. How many trips a week, in millions?
        expects: "9.64"
        tolerance: 0.01
        hint: >
          $3.8\times0.27$ first, then times $9.4$.
        feedback: >
          $3.8\times0.27 = 1.026$, and $1.026\times9.4 = 9.6444$ million. Two
          awkward multiplications, done in your head while the interviewer
          watches.
      - ask: >
          Your $27\%$ was a guess. If the true share is $40\%$ — well inside
          your factor-of-$2$ doubt — what does the product become, in
          millions?
        expects: "14.3"
        tolerance: 0.05
        feedback: >
          $3.8\times0.4\times9.4 = 14.288$, about $14.3$ million. One honest
          change to one guess moved the answer by half. The digits $.6444$ never
          stood a chance.
      - reflect: >
          Nearly all your arithmetic went into digits that one plausible change
          in one guess wipes out. How could you have done less work without
          losing anything the answer can actually support?
        hint: >
          The inputs are known to about one digit each.
        answer: >
          Round each factor to one significant figure before multiplying:
          $4$ million, $0.3$, and $9$. The product of the rounded factors
          differs from the exact one by far less than the factor of $2$
          already sitting in each input, so the lost digits were never real
          information, and the arithmetic becomes something you can do while
          talking.

      - part: One digit per factor
        teach: >
          That is the rule: *round every factor to one significant figure*, at
          the moment you choose it, and multiply the rounded numbers. $3.8$
          million becomes $4$ million, $27\%$ becomes $0.3$, $9.4$ becomes $9$.
          You aim for the right power of ten and roughly the right leading
          digit, which is all the inputs can give.
      - ask: >
          Multiply the rounded factors. How many trips a week, in millions?
        expects: "10.8"
        tolerance: 0.05
        hint: >
          $4\times0.3$, then times $9$.
        feedback: >
          $4\times0.3 = 1.2$, and $1.2\times9 = 10.8$ million, done without
          writing anything down.
      - ask: >
          By what percentage is the rounded $10.8$ million above the exact
          $9.64$ million?
        expects: "12"
        tolerance: 1
        feedback: >
          $10.8/9.6444\approx1.12$, so about $12\%$ high.
      - ask: >
          Why is a $12\%$ rounding error acceptable here?
        choices:
          - text: >
              It is not: $12\%$ is a real error, and you should carry the
              decimals.
            feedback: >
              The decimals encode precision you never had. Changing one guess
              within its honest range moved the answer by $48\%$; the rounding
              moved it by $12\%$. You would be guarding against the small error
              while ignoring the large one.
          - text: >
              It is small next to the factor-of-$2$ doubt already sitting in
              each input.
            correct: true
            feedback: >
              A factor of $2$ is a $100\%$ doubt. Rounding adds a little noise
              beneath that floor and buys arithmetic you can do without
              slipping, and an arithmetic slip costs more than any rounding.
          - text: >
              Rounding errors always cancel out across the factors.
            feedback: >
              They cancel only partly, and only if you round up and down as the
              digits dictate. Here all three roundings went up, which is why
              the product came out $12\%$ high.
        feedback: >
          Precision in the output can never exceed precision in the inputs.
          The rounding is cheap because the doubt it hides under is large.

      - part: When the rounding bites
        ask: >
          A candidate rounds every factor *up*, to be safe. In a five-factor
          chain each factor gains about $20\%$. By what factor is the product
          too high?
        expects: "2.5"
        tolerance: 0.05
        hint: >
          $1.2$ multiplied by itself five times.
        feedback: >
          $1.2^{5}\approx2.49$, about $2.5$. Rounding the same way every time
          stacks the errors instead of letting them partly cancel, and a bias
          of $2.5$ is as large as the doubt in the inputs. Round each factor
          to its nearest value, up or down as the digit dictates.
      - ask: >
          Which of these factors loses the most, in relative terms, when
          rounded to one significant figure?
        choices:
          - text: >
              $7.4$ million, rounded to $7$ million
            feedback: >
              $0.4/7.4\approx5\%$. A large leading digit means the dropped part
              is small relative to the whole.
          - text: >
              $0.83$, rounded to $0.8$
            feedback: >
              $0.03/0.83\approx4\%$. Leading digit $8$, so rounding barely
              moves it.
          - text: >
              $1.4$, rounded to $1$
            correct: true
            feedback: >
              $0.4/1.4\approx29\%$. When the leading digit is $1$, the second
              digit carries a large share of the value. Keep it — $1.4$ or
              "one and a half" — and round the others.
        feedback: >
          One significant figure is a target, not a law. A factor whose
          leading digit is $1$ is where a second digit costs little and saves
          a lot.
      - teach: >
          Say the rounding as you do it: "call it four million people, thirty
          percent on the train, nine trips a week — about eleven million
          trips." Each rounded number is one the interviewer can hear and
          check, and the product arrives without a pause.

  - node: quant-mental.fermi.stating-assumptions
    hook: >
      Two candidates can reach the same wrong final number, and one
      leaves the room having failed while the other leaves having
      demonstrated exactly the skill being tested — the difference is
      entirely in what got said out loud.
    explanation: >
      A Fermi question is graded on the decomposition, not the digit at
      the end — the interviewer already knows the "true" answer is
      unknowable to more than an order of magnitude, so the object of
      interest is whether your reasoning was sound and legible. Narrating
      each factor as you pick it ("I'll assume a piano gets tuned once a
      year") turns a silent mental calculation into a chain the
      interviewer can audit, agree with, or redirect before a bad
      assumption has propagated through four more steps.

      Silence is the actual failure mode, not a wrong number. An
      assumption buried inside a number you state without comment reads,
      when questioned, exactly like a mistake — the interviewer has no way
      to tell "I assumed X on purpose" from "I don't know where this
      number came from." A stated assumption, by contrast, invites at
      most a one-line correction ("actually assume half that"), which
      costs seconds and redirects the rest of the chain rather than
      voiding the whole estimate.

      This extends past the point values to the bounds and rounding
      choices too — announcing "I'm rounding this to one significant
      figure" or "I'm bounding this between $X$ and $Y$" is itself part
      of the graded reasoning, not bookkeeping to skip past.
    interview: >
      This is less a technique to invoke and more the register the whole
      round is conducted in: think out loud from the first factor, name
      every assumption as you make it, and treat a "why did you assume
      that" follow-up as an invitation, not a challenge to defend against.
    pitfalls: >
      Doing the reasoning silently and presenting only a clean final
      number — it looks efficient but gives the interviewer nothing to
      grade except a possibly-wrong digit. Stating an assumption once at
      the start and then going quiet for the rest of the chain, losing
      the audit trail exactly where it matters most, deeper into the
      decomposition.
    recap: >
      The spoken reasoning chain is what gets scored — narrate every
      assumption, bound, and rounding choice as you make it, not just the
      final number.
    dialogue:
      - part: Two candidates, one question
        teach: >
          Two candidates are asked how many pairs of running shoes a country
          of $50$ million people buys in a year. The first thinks in silence
          for a minute and says "about $5$ million." The second says, as she
          goes: "$50$ million people. I'll assume one in five runs regularly,
          so $10$ million runners. Say each buys one and a half pairs a year —
          $15$ million pairs."
      - ask: >
          The interviewer does not know the true figure to better than a
          factor of a few either. Which answer gives the interviewer more to
          grade?
        choices:
          - text: >
              The first: a single clean number is easier to compare with the
              truth.
            feedback: >
              The interviewer cannot compare it with the truth — nobody in the
              room knows the truth well. A bare number gives them nothing to
              evaluate except whether it feels right.
          - text: >
              The second: every factor is on the table to agree with or
              challenge.
            correct: true
            feedback: >
              Three numbers, each with its reason. The interviewer can check
              each one against their own sense of the world, which is the only
              grading anyone in the room can do.
          - text: >
              Neither: they should be graded on which number is closer.
            feedback: >
              "Closer" needs a true value nobody has. What can be judged is
              whether the reasoning that produced the number is sound.
        feedback: >
          A Fermi answer is graded on the decomposition, because the
          decomposition is the only part anyone can check.
      - ask: >
          The interviewer tells the second candidate: "I think fewer people
          run — more like one in ten." Keeping her other factors, what is her
          revised estimate, in millions of pairs?
        expects: "7.5"
        hint: >
          Only the runner count changes.
        feedback: >
          $50\text{ million}\times\frac{1}{10} = 5$ million runners, and
          $5\times1.5 = 7.5$ million pairs. The correction landed on one factor
          and cost one multiplication.
      - ask: >
          The interviewer adds: "and a serious runner goes through more like
          three pairs a year." What is the estimate now, in millions?
        expects: "15"
        feedback: >
          $5\text{ million}\times3 = 15$ million pairs. Two corrections, each
          absorbed in seconds, and the chain is now partly the interviewer's
          own — hard to grade harshly.
      - ask: >
          The interviewer asks the first candidate, "how many runners did you
          assume?" What is his position?
        choices:
          - text: >
              He can answer and adjust, just as she did.
            feedback: >
              Only if he made that assumption at all and can reconstruct it.
              Whatever he assumed went by in silence, so it has to be dug out
              under questioning before it can be corrected.
          - text: >
              He is fine, since his $5$ million is closer to her revised
              $7.5$ million than her first $15$ million was.
            feedback: >
              Her chain went back to $15$ million after the second correction,
              so on the interviewer's own beliefs his number is off by a factor
              of $3$. And even when a bare number lands close, it is luck:
              without visible factors there is nothing to credit and nothing
              to fix.
          - text: >
              He has to reconstruct his reasoning on the spot, and an assumption
              he cannot produce reads as a mistake.
            correct: true
            feedback: >
              From the outside, "I assumed one in twenty on purpose" and "I
              have no idea where that came from" look identical until he speaks.
              Silence turned every assumption into a liability.
        feedback: >
          The same assumption is cheap when stated and expensive when
          discovered.
      - reflect: >
          Her chain needed two corrections from the interviewer; his number
          needed none that anyone could make. Say why she still comes out well
          ahead, and what that tells you to do in every Fermi answer.
        answer: >
          Because what gets scored is the reasoning, and hers was visible. A
          stated assumption invites a one-line correction that costs seconds
          and redirects the rest of the chain; an unstated one looks like an
          error when questioned and can void the whole estimate. So narrate
          every factor as you choose it — the value and the reason — and treat
          "why that number?" as help, not attack.

      - part: Saying it so it counts
        teach: >
          The intuition: *state every assumption out loud*, at the moment you
          make it. The interviewer is grading a chain they can audit, not a
          final digit. That covers more than point values — say your bounds
          ("somewhere between one in five and one in ten") and your rounding
          ("call it ten million") too, since both are choices someone can
          redirect.
      - ask: >
          Which of these is narration that actually serves you?
        choices:
          - text: >
              "So I'm thinking about this, and there are a lot of runners out
              there, so let me think about that..."
            feedback: >
              Sound without content. There is no number and no reason, so
              there is nothing to agree with or correct. Narration counts when
              it carries a figure.
          - text: >
              "I'll assume one in five adults runs at least weekly — that
              matches the people I know."
            correct: true
            feedback: >
              A value and its grounds, said as the factor is chosen. The
              interviewer can accept it, adjust it, or ask about the grounds.
          - text: >
              "I'll lay out all my assumptions now, then work through the
              arithmetic quietly."
            feedback: >
              Better than nothing, but the audit trail stops where the chain
              gets long — exactly where a bad assumption has the most steps to
              spread through, and where a mid-chain correction would save the
              most.
        feedback: >
          A useful sentence names a number and why you chose it, at the point
          in the chain where it enters.

      - part: Where the habit misleads
        ask: >
          You have no feel at all for one factor — the fraction of runners who
          buy trail shoes, say. What is the best move?
        choices:
          - text: >
              Ask the interviewer to supply it and wait.
            feedback: >
              Sometimes they will, but leading with that hands over the part
              of the problem being tested. Offer your own figure first; let
              them correct it.
          - text: >
              Hedge on every factor equally, so nothing can be held against
              you.
            feedback: >
              Hedging everything is as uninformative as hedging nothing. The
              point of narrating is to show which factors you trust and which
              you do not.
          - text: >
              State a value with its range: "I'll take a quarter — could be a
              tenth, could be a half."
            correct: true
            feedback: >
              Stating doubt is part of stating the assumption. It tells the
              interviewer which factor is shaky and invites a correction
              exactly there.
          - text: >
              Pick a number silently and move on, since it is the shakiest one.
            feedback: >
              The shakiest factor is the one where silence costs most. It is
              the likeliest to be challenged, and the likeliest to be wrong.
        feedback: >
          Narration is not volume. It is a ledger: each factor, its value,
          and how much you trust it, so the conversation can go straight to
          the weak entry.

  - node: quant-mental.fermi.cross-check-second-path
    hook: >
      A single decomposition can be internally consistent and still wrong
      in a way no unit check or rounding discipline catches — the fix is
      a second, independent path to the same number.
    explanation: >
      Any one decomposition risks carrying a bad assumption invisibly all
      the way through to a plausible-looking final digit — nothing about a
      single chain being internally consistent guarantees it's right.
      Building a second decomposition from genuinely different factors —
      different anchors, a different structural idea — gives two answers
      that share few or no assumptions, so their agreement or
      disagreement is real evidence rather than the chain agreeing with
      itself.

      Two chains landing within a factor of two or three of each other is
      about as strong a confirmation as a Fermi estimate can produce,
      because it's unlikely two unrelated sets of assumptions would both
      be wrong in the same direction by the same amount. Disagreement by
      an order of magnitude or more usually flags an outright blunder —
      a dropped conversion, a double-counted population — rather than
      ordinary estimation noise, and tells you which chain to re-examine
      first: whichever used the shakier anchor.

      This is the Fermi analogue of checking an arithmetic result by
      recomputing it a different way rather than re-reading the same
      steps — it catches the class of error that re-reading never finds,
      because re-reading a wrong assumption just confirms it looked
      reasonable the first time too.
    worked: >
      Estimate annual haircuts in a city of $3$ million two ways. Demand
      side: $3\times10^{6}$ people at roughly $8$ haircuts a year each
      $\approx2.4\times10^{7}$. Supply side: about 3,000 barbershops (one
      per thousand residents), each with $3$ barbers doing $12$ cuts a
      day over $250$ working days $\approx3{,}000$ cuts a year per
      barber, so $3{,}000\times3\times3{,}000\approx2.7\times10^{7}$. The
      two independent paths land within about $12\%$ of each other —
      strong evidence the true figure is in the mid-tens-of-millions.
    interview: >
      Offered as a follow-up once you've landed a first answer — "can you
      get there a different way?" — and the strongest response starts
      from visibly unrelated factors, not a cosmetic rearrangement of the
      same chain. Volunteering it unprompted after a fast first pass is a
      strong signal on its own.
    pitfalls: >
      Building a "second" path that secretly reuses the same anchor as
      the first — if both chains lean on the same shaky number, their
      agreement proves nothing. Treating close agreement as proof rather
      than evidence — it raises confidence, it doesn't guarantee
      correctness.
    recap: >
      Re-derive the number from unrelated factors; two independent chains
      landing close together is the strongest confirmation a Fermi
      estimate can get.
    dialogue:
      - part: One chain, checked against itself
        teach: >
          How many smartphones are sold in a year in a country of $40$
          million people? Your chain: $80\%$ of people own one, and an owner
          replaces it every $3$ years.
      - ask: >
          How many phones a year does that give, in millions?
        expects: "10.7"
        tolerance: 0.1
        hint: >
          Owners first, then divide by the years between replacements.
        feedback: >
          $40\times10^{6}\times0.8 = 32\times10^{6}$ owners, and
          $32\times10^{6}/3\approx10.7\times10^{6}$ phones a year.
      - ask: >
          A colleague checks your work by redoing the multiplication and the
          division, and gets $10.7$ million too. What has that confirmed?
        choices:
          - text: >
              That the estimate is about right.
            feedback: >
              If owners actually keep a phone for $5$ years, the honest answer
              is $6.4$ million, and redoing the same arithmetic on the same $3$
              reproduces $10.7$ every time. Repetition cannot see an assumption.
          - text: >
              That the $80\%$ ownership figure is right.
            feedback: >
              The ownership figure went in unchanged, so the recheck could not
              have tested it. Nothing in the chain was compared against
              anything outside it.
          - text: >
              That the arithmetic is right, and nothing about the assumptions.
            correct: true
            feedback: >
              Re-reading a chain re-uses every assumption in it. A wrong
              assumption looked reasonable the first time, and it looks just as
              reasonable the second.
        feedback: >
          A single chain agreeing with itself is no evidence about its inputs.
      - reflect: >
          You want to test the $3$-year replacement cycle and the $80\%$
          without knowing the true count of phones sold. What could you build
          that would catch them if they were badly wrong?
        hint: >
          Phones are also *sold* somewhere, by someone.
        answer: >
          A second estimate of the same number from different factors — one
          that uses neither ownership nor replacement cycles. Count it from
          the selling side: shops, and phones each shop sells. If both chains
          land close together, it is unlikely that two unrelated sets of
          assumptions are wrong in the same direction by the same amount. If
          they disagree badly, one of them hides a blunder.

      - part: The same number from the other side
        teach: >
          That is the *cross-check with a second decomposition*: estimate the
          same quantity from factors that share as few assumptions as possible
          with the first chain, and compare. Agreement within a factor of two
          or three is strong evidence the order of magnitude is right;
          disagreement by an order of magnitude flags a blunder rather than
          ordinary noise.
      - ask: >
          Selling side: say there is one phone shop for every $20{,}000$
          people, each sells $15$ phones a day, and shops are open $360$ days a
          year. How many phones a year, in millions?
        expects: "10.8"
        tolerance: 0.05
        hint: >
          Shops first: $40$ million divided by $20{,}000$.
        feedback: >
          $40\times10^{6}/20{,}000 = 2{,}000$ shops; $2{,}000\times15 = 30{,}000$
          phones a day; $30{,}000\times360 = 10.8\times10^{6}$ phones a year.
      - ask: >
          The two chains give $10.7$ million and $10.8$ million. What is the
          right reading?
        choices:
          - text: >
              Strong evidence the answer is around $10$ million, since two
              chains sharing only the population landed together.
            correct: true
            feedback: >
              Ownership and replacement on one side, shops and daily sales on
              the other: nothing in common but the population. For both to be
              wrong by the same factor in the same direction would be a
              coincidence.
          - text: >
              The answer is $10.75$ million, accurate to three figures.
            feedback: >
              Each chain is still built from guesses good to a factor of $2$ or
              so; agreement does not shrink that doubt to a percent. Two paths
              landing this close is partly luck.
          - text: >
              Suspicious: independent chains should not agree this well, so
              one must be copied from the other.
            feedback: >
              Close agreement can happen honestly. What matters is whether the
              chains share inputs — and these share only the population, which
              is an anchor you trust.
        feedback: >
          Agreement raises confidence; it does not certify the answer. Report
          one rounded figure, "about ten million", and mention that two
          routes agree.

      - part: When the second path is not a second path
        ask: >
          A candidate offers a "second path": $32$ million owners, each buying
          a new phone every $3$ years, so about $11$ million. What does its
          agreement with the first chain show?
        choices:
          - text: >
              Strong confirmation, since the two numbers match.
            feedback: >
              They match because they are the same chain: the same owners, the
              same $3$-year cycle, rearranged. If the cycle is wrong, both are
              wrong together.
          - text: >
              Nothing: it reuses the ownership and replacement assumptions, so
              agreement was guaranteed.
            correct: true
            feedback: >
              A second path has to rest on different factors. Shared inputs
              mean shared errors, and shared errors agree perfectly while being
              wrong.
          - text: >
              Weak confirmation, since it rounds differently.
            feedback: >
              Rounding differently tests nothing but the rounding. The
              assumptions that could be badly wrong are identical in both.
        feedback: >
          The value of a cross-check comes entirely from what the two chains
          do *not* share.
      - ask: >
          Another candidate's selling side comes out at $360{,}000$ phones a
          year against the demand side's $10.7$ million. By what factor do the
          two paths differ, larger over smaller?
        expects: "30"
        tolerance: 0.5
        feedback: >
          $10.7\times10^{6}/360{,}000\approx29.7$, about $30$ — far outside
          the factor of two or three that honest noise in a few factors
          produces.
      - ask: >
          What is the most likely cause of a gap of about $30$?
        choices:
          - text: >
              Ordinary estimation noise: one of the guesses was a bit off.
            feedback: >
              Ordinary noise in a few factors good to $2$ each gives a factor
              of two or three, rarely thirty. A gap this size is a different
              kind of error.
          - text: >
              The demand side is wrong, since demand estimates are always
              less reliable than supply estimates.
            feedback: >
              Neither side is privileged. Disagreement tells you to re-examine
              both, starting with whichever leaned on a conversion or a shaky
              factor.
          - text: >
              A dropped conversion: $30$ is about the number of days in a
              month, so a daily rate was multiplied by $12$ months.
            correct: true
            feedback: >
              $2{,}000\times15\times12 = 360{,}000$. The size of the gap is a
              clue: $30$ points to days and months, $12$ to months and years,
              $1000$ to a unit prefix.
        feedback: >
          Close agreement confirms; disagreement by an order of magnitude is a
          gift — it locates a blunder you would otherwise have reported. Saying
          "let me get there a second way" aloud, unprompted, is one of the
          strongest moves in a Fermi answer.

  - node: quant-mental.fermi.subpopulation-weighting
    hook: >
      A single blended rate applied to an entire population is almost
      always wrong in a specific, predictable direction once that
      population is actually a mix of very different behaviors.
    explanation: >
      When the rate you care about differs sharply across groups — heavy
      users and light users, weekdays and weekends — decompose the
      population first, by group, and give each group its own rate before
      combining: $\sum_i w_ir_i$, with $w_i$ each group's population
      share. This is the weighted-average move applied to a Fermi chain
      rather than to two exam scores, generalized to as many groups as the
      population actually splits into.

      The failure mode of skipping this step is specific: a single
      blended rate, whether it's an average of the group rates or a guess
      at "the typical person," systematically misses because the group
      with the most extreme rate almost never carries a weight anywhere
      near $50\%$. Small, intense subgroups get drowned out in a flat
      average even though they can dominate the true total, and large,
      mild subgroups get over-weighted the same way in reverse.

      The fix costs one extra step, not a harder calculation: identify the
      groups with genuinely different rates, estimate each group's
      population share and its own rate separately, and combine with the
      population shares as weights — never average the rates themselves
      unless the groups happen to be equally sized.
    worked: >
      Estimate daily lattes bought in a city of $2$ million, split by
      office workers versus everyone else. Office workers are $15\%$ of
      the population (300,000) at $1.2$ lattes a day each
      $\approx360{,}000$; everyone else is $85\%$ (1,700,000) at $0.1$ a
      day $\approx170{,}000$. Weighted total: $360{,}000+170{,}000=
      530{,}000$ a day. A flat average of the two rates,
      $(1.2+0.1)/2=0.65$, applied to the whole $2$ million gives
      1,300,000 — roughly $2.5\times$ higher than the weighted answer,
      because it gives office workers, only $15\%$ of the population, a
      full $50\%$ of the weight.
    interview: >
      Comes up whenever a question hints at a skewed population —
      "coffee sales near a business district," "ride-share demand on a
      Friday night" — and the tell of a strong answer is splitting the
      population before guessing any single rate, not patching a flat
      guess afterward.
    pitfalls: >
      Averaging the group rates instead of weighting them by population
      share — those agree only when the groups are equal-sized, which is
      rare. Missing a subgroup with an extreme rate entirely because it's
      a small share of the population, when its rate can still dominate
      the weighted sum.
    recap: >
      Blend group-specific rates by population share — a weighted
      average, not a flat one — whenever the rate varies sharply across
      the population.
    dialogue:
      - part: One rate for everyone
        teach: >
          How many gym visits do a city's $1$ million adults make in a week?
          Say $12\%$ hold a membership and go $2.5$ times a week; the other
          $88\%$ go $0.05$ times a week — a drop-in class once every five
          months or so.
      - ask: >
          A quick approach averages the two rates and applies the result to
          everyone. What weekly total does that give, in thousands of visits?
        expects: "1275"
        hint: >
          $(2.5 + 0.05)/2$, times $1$ million.
        feedback: >
          $(2.5 + 0.05)/2 = 1.275$ visits per adult, times $10^{6}$ adults, is
          $1{,}275{,}000$ visits a week, or $1{,}275$ thousand. Now check it
          against the people who actually go.
      - ask: >
          How many visits a week do the members alone make, in thousands?
        expects: "300"
        feedback: >
          $12\%$ of $10^{6}$ is $120{,}000$ members, at $2.5$ visits each:
          $300{,}000$ visits, or $300$ thousand.
      - ask: >
          And the most the non-members could add, in thousands?
        expects: "44"
        feedback: >
          $880{,}000\times0.05 = 44{,}000$. So the whole city makes about
          $344$ thousand visits a week, and the quick approach claimed
          $1{,}275$ thousand — nearly four times too many.
      - ask: >
          What went wrong in the quick approach?
        choices:
          - text: >
              The members' rate of $2.5$ was too high.
            feedback: >
              The rate was given and used correctly in the member count. The
              same two rates produced $344$ thousand when combined properly,
              so the rates are not the problem.
          - text: >
              It should have used the median person's rate, $0.05$.
            feedback: >
              That gives $50{,}000$ visits, ignoring the members who make
              almost all of them. Swapping one flat rate for another just
              misses in the other direction.
          - text: >
              It gave the members half the weight, when they are only $12\%$
              of the people.
            correct: true
            feedback: >
              Averaging two rates treats the two groups as equal-sized. The
              small, intense group got $50\%$ of the weight it should have had
              $12\%$ of.
        feedback: >
          A flat average of group rates quietly assumes the groups are the
          same size. They almost never are.
      - reflect: >
          You still want a single per-adult rate to multiply by the
          population. How should the $2.5$ and the $0.05$ be combined so that
          each counts exactly as much as its share of the people?
        hint: >
          Each rate should be weighted by something that adds to $1$.
        answer: >
          Weight each rate by its group's share of the population and add:
          $0.12\times2.5 + 0.88\times0.05$. That is a weighted average with
          the population shares as weights. It reproduces the group-by-group
          total exactly, because multiplying it by the population is the same
          as counting each group with its own rate.

      - part: Weights from headcounts
        teach: >
          That is *splitting into weighted subpopulations*: when a rate
          differs sharply between groups, split the population first, give
          each group its own rate, and combine as $\sum_i w_i r_i$, where
          $w_i$ is group $i$'s share of the population. Never average the
          rates themselves unless the groups are equal in size.
      - ask: >
          What is the weighted per-adult rate, in visits per week?
        expects: "0.344"
        tolerance: 0.001
        feedback: >
          $0.12\times2.5 + 0.88\times0.05 = 0.3 + 0.044 = 0.344$ visits per
          adult per week. Times $10^{6}$ adults, $344{,}000$ visits — the same
          as counting the groups separately, as it must be.
      - ask: >
          A town of $300{,}000$ people orders late-night food on a Saturday.
          Students are $10\%$ of the town at $0.6$ orders each; young
          professionals are $30\%$ at $0.2$; everyone else is $60\%$ at $0.02$.
          How many orders?
        expects: "39600"
        tolerance: 100
        hint: >
          Headcount of each group times its own rate, then add.
        feedback: >
          Students: $30{,}000\times0.6 = 18{,}000$. Professionals:
          $90{,}000\times0.2 = 18{,}000$. Everyone else:
          $180{,}000\times0.02 = 3{,}600$. Total $39{,}600$ orders. The flat
          average of the rates, $(0.6+0.2+0.02)/3\approx0.27$, would have
          given about $82{,}000$.

      - part: Which split is worth making
        ask: >
          In the late-night town, leaving out which group would distort the
          total most?
        choices:
          - text: >
              Everyone else: they are $60\%$ of the people.
            feedback: >
              They are $60\%$ of the people and only $3{,}600/39{,}600\approx9\%$
              of the orders. Leave them out and the total barely moves.
          - text: >
              The students: $10\%$ of the people, $45\%$ of the orders.
            correct: true
            feedback: >
              $18{,}000/39{,}600\approx45\%$. A small group with an extreme rate
              can carry the total. Missing it because it is small is the
              commonest way this technique fails.
          - text: >
              It makes no difference, since each group is weighted by its
              share.
            feedback: >
              The weights are shares of *people*. What a group contributes to
              the total is share times rate, and that is very unequal here.
        feedback: >
          Look for the group whose rate is extreme, not the group that is
          large. Its contribution is $w_i r_i$, and a big $r_i$ can outweigh a
          small $w_i$.
      - ask: >
          You are estimating toothpaste tubes bought in a year. A colleague
          proposes splitting the population into left-handed and right-handed
          people. What does that split buy?
        choices:
          - text: >
              Nothing: the two groups have the same rate, so the weighted
              average is just that rate.
            correct: true
            feedback: >
              If $r_1 = r_2 = r$, then $w_1 r + w_2 r = r$. The gain from a split
              comes entirely from how different the groups' rates are.
          - text: >
              A more accurate answer, since every split adds information.
            feedback: >
              A split only helps if the groups' rates differ. Both groups use
              toothpaste at about the same rate, so the weighted average equals
              the flat rate and the extra work changes nothing.
          - text: >
              A worse answer, since each extra group adds error.
            feedback: >
              The arithmetic still gives the right total. The split is wasted
              effort, not a source of error.
        feedback: >
          Split along the line where behaviour actually changes — members
          and non-members, students and everyone else — and say so out loud:
          "most of these orders come from a small group, so I'll count that
          group separately."

  - node: quant-mental.fermi.piano-tuners-chicago
    hook: >
      This is the Fermi archetype for a reason: population to owners to
      service frequency to provider capacity is a chain shape that
      transfers to any "how many X are needed to service Y" question,
      service profession or not.
    explanation: >
      The piano-tuner chain has a shape worth naming on its own:
      (population) to (owners of the thing) to (services needed per year)
      to (capacity per provider) to (providers needed). Each arrow is one
      of decomposition's factors — an ownership rate, a service
      frequency, a working-hours budget — and the final division, total
      annual demand over one provider's annual capacity, is what turns a
      count of things into a count of people employed to service them.

      That last step generalizes past pianos entirely: any "how many X
      does a city need" question about a service — plumbers, dog
      groomers, tax preparers — is the same demand-over-capacity
      division, with the specifics of ownership rate and service
      frequency swapped in. Once you recognize the shape, the actual
      content of the question barely matters; you're filling in the same
      four blanks with different anchors.

      The other reason this example is canonical is that its answer is
      genuinely close to the real one, which is itself instructive: the
      chain's four factors were each guessed to a factor of $2$ or so, yet
      one-sig-fig rounding held all the way through to a final number in
      the right hundreds, not the right thousands or the right tens — the
      archetype demonstrates, not just states, that the earlier
      techniques work when stacked.
    worked: >
      Apply the same chain to dentists in Chicago's metro area, population
      $\approx9.5\times10^{6}$. Assume $1.5$ checkups per person a year
      $\approx1.4\times10^{7}$ visits a year. A dentist sees roughly $20$
      patients a day, $5$ days a week, $48$ weeks a year
      $\approx4{,}800$ visits a year. Dentists needed:
      $1.4\times10^{7}/4{,}800\approx2{,}900$, call it 3,000 — in the
      right range for a metro area of that size.
    interview: >
      Piano tuners in Chicago is the canonical opener precisely because
      it's been asked so often that a memorized final number is worthless
      — what's tested is whether you can produce the chain cold, narrating
      each factor, for whatever service the interviewer actually names.
    pitfalls: >
      Treating "population to owners to service frequency to provider
      capacity" as specific to pianos rather than recognizing it as the
      general template, missing the chance to reuse it instantly on a
      different profession. Forgetting the provider-capacity step needs
      its own working-hours budget, which is where a rushed answer
      usually loses the most accuracy.
    recap: >
      Population to owners to services-per-year to provider capacity is
      the general template — piano tuners just happens to be its
      most-asked instance.
    dialogue:
      - part: From people to pianos
        teach: >
          An interviewer asks how many piano tuners work in a metro area of
          $4$ million people. You have never seen a list of tuners, and you
          should not want one. Start from what you can anchor.
      - ask: >
          At $2.5$ people per household, how many households does the metro
          hold, in millions?
        expects: "1.6"
        feedback: >
          $4\times10^{6}/2.5 = 1.6\times10^{6}$ households. Pianos live in
          homes, so households, not people, are the unit that owns them.
      - ask: >
          Say $1$ household in $25$ owns a piano, and schools, churches and
          concert halls add another $20\%$ on top. How many pianos, to one
          significant figure?
        expects: "80000"
        tolerance: 4000
        hint: >
          Household pianos first, then scale by $1.2$.
        feedback: >
          $1.6\times10^{6}/25 = 64{,}000$ household pianos, and
          $64{,}000\times1.2 = 76{,}800$, call it $80{,}000$ pianos.
      - reflect: >
          You know how many pianos there are. Nothing about a piano count
          says how many *people* tune them. What has to balance, in a year,
          for the city to have the right number of tuners?
        hint: >
          Think of the tuning work as a pile that the tuners between them
          have to get through.
        answer: >
          The tunings the pianos need in a year must equal the tunings the
          tuners can do in a year. So tuners $=$ (tunings demanded per year)
          $/$ (tunings one tuner can do per year). The pianos give the demand;
          one tuner's working year gives the capacity; dividing one by the
          other turns a count of things into a count of people.

      - part: Demand over capacity
        teach: >
          That is the whole piano-tuner chain: (population) to (owners) to
          (services needed per year) to (capacity per provider) to (providers
          needed). With each piano tuned about once a year, demand here is
          about $80{,}000$ tunings a year. What remains is one tuner's
          capacity — the step rushed answers get wrong.
      - ask: >
          A tuning takes $1$ hour at the piano plus $30$ minutes driving to
          the next job. A tuner works $6$ hours a day, $5$ days a week, $48$
          weeks a year. How many tunings can one tuner do in a year?
        expects: "960"
        hint: >
          Each job really costs $1.5$ hours. Jobs per day first.
        feedback: >
          $6/1.5 = 4$ jobs a day, $4\times5 = 20$ a week, $20\times48 = 960$ a
          year. Call it $1{,}000$.
      - ask: >
          How many tuners does the metro support?
        expects: "83"
        tolerance: 4
        hint: >
          Demand divided by one tuner's capacity.
        feedback: >
          $80{,}000/960\approx83$, or with the rounded capacity
          $80{,}000/1{,}000 = 80$. Either way, "about a hundred" is the honest
          way to say it: tens of tuners, not thousands and not a handful.
      - ask: >
          A rushed candidate assumes a tuner works $8$ hours a day, every day
          of the year, at $1$ hour per tuning with no travel. How many tuners
          does their chain give?
        expects: "27"
        tolerance: 1
        hint: >
          Their capacity is $8\times365$ tunings a year.
        feedback: >
          $8\times365 = 2{,}920$ tunings a year, so $80{,}000/2{,}920\approx27$
          tuners — three times too few. Nobody works every day of the year, and
          the drive between jobs is a third of each job. The capacity step
          needs its own honest working-hours budget.

      - part: The same four blanks, another trade
        ask: >
          The interviewer switches: "Now, wedding photographers in the same
          metro." Which chain do you write down?
        choices:
          - text: >
              (population) $\times$ (fraction of people who are wedding
              photographers)
            feedback: >
              That fraction is the answer wearing a disguise — you cannot
              estimate it without already knowing the count. The chain has to
              go through demand and capacity.
          - text: >
              (weddings per year) $\times$ (hours a photographer spends per
              wedding)
            feedback: >
              That gives photographer-hours per year, a measure of demand, not
              a count of people. It still has to be divided by the hours one
              photographer works in a year.
          - text: >
              (weddings per year) $/$ (weddings one photographer shoots per
              year)
            correct: true
            feedback: >
              Demand over capacity, exactly the tuner shape: weddings play the
              part of tunings, and a photographer's season plays the part of a
              tuner's working year.
        feedback: >
          Once you see the shape, the trade barely matters: population, the
          share that needs the service, how often, and one provider's
          capacity.
      - ask: >
          Say the metro holds $25{,}000$ weddings a year, and a photographer
          shoots $2$ a week through a $30$-week season. How many wedding
          photographers?
        expects: "417"
        tolerance: 10
        hint: >
          One photographer's capacity first.
        feedback: >
          Capacity: $2\times30 = 60$ weddings a year. Photographers:
          $25{,}000/60\approx417$, call it $400$. Four blanks filled from a new
          trade, same division at the end.
      - teach: >
          Said aloud, the tuner answer takes twenty seconds: "Four million
          people, one point six million homes, one in twenty-five with a
          piano plus some institutions — about eighty thousand pianos, each
          tuned once a year. A tuner does four jobs a day, a thousand a year.
          So about eighty tuners; I'd say on the order of a hundred."

  - node: quant-mental.fermi.windows-in-city
    hook: >
      Windows in Chicago is where subpopulation weighting earns its keep
      on a physical-count question, not just a rate question — the same
      population-share-weighted-sum move, applied to counting objects
      instead of counting events.
    explanation: >
      Splitting the housing stock by type before counting windows is the
      same move as weighting a rate by subpopulation, applied to a
      per-unit count instead of a per-person rate: apartments and houses
      have genuinely different window counts, so a single blended
      "windows-per-home" guess would systematically miss for the same
      reason a single blended latte rate misses — whichever type is more
      common doesn't necessarily carry the more typical count.

      The residential split is also where nearly all of the estimate's
      accuracy lives; the commercial add-on at the end is comparatively
      minor and forgiving of a rough percentage, because it's a small
      correction to an already-large residential number rather than a
      peer term. That ordering — get the big, skewed term right first,
      then patch in the smaller correction — is worth carrying to other
      physical-count estimates: spend your accuracy budget on whichever
      split dominates the total, not evenly across every step.

      The technique transfers directly to any "count of X across a
      city's buildings" question — doors, rooms, parking spots — wherever
      building type is the dominant source of variation in the per-unit
      count.
    worked: >
      Estimate windows in Houston. Metro population $\approx7\times10^{6}$
      at $2.8$ people per household gives $\approx2.5\times10^{6}$
      households. Houston sprawls more than Chicago, so say $30\%$
      apartments at $5$ windows and $70\%$ houses at $14$ windows (larger
      suburban lots):
      $0.3\times2.5\times10^{6}\times5+0.7\times2.5\times10^{6}\times14
      \approx3.75\times10^{6}+2.45\times10^{7}\approx2.8\times10^{7}$
      residential windows. Adding $20\%$ for commercial gives
      $\approx3.4\times10^{7}$ windows total.
    interview: >
      A close cousin of piano tuners as an opener; the tell of a strong
      answer is naming the type split before guessing any window count,
      exactly as with any skewed-population estimate, rather than
      reaching for one average number per home.
    pitfalls: >
      Using one blended windows-per-home figure across a metro area that
      actually mixes dense apartments and sprawling houses — the two
      types can differ by a factor of $3$ or more per unit. Spending
      equal effort refining the small commercial correction as the
      dominant residential split, when the residential term is doing
      nearly all the work.
    recap: >
      Split the housing stock by type and weight each type's own window
      count by its population share — the split matters more than either
      window count alone.
    dialogue:
      - part: One number per home
        teach: >
          Estimate the windows in a dense coastal city of $5$ million people,
          at $2.5$ people per household. Most people there live in
          apartments; a minority live in houses.
      - ask: >
          How many households is that, in millions?
        expects: "2"
        feedback: >
          $5\times10^{6}/2.5 = 2\times10^{6}$ households. Windows belong to
          homes, so homes are the unit to count.
      - ask: >
          An apartment has about $5$ windows and a house about $16$. A
          candidate averages those, $(5+16)/2$, and applies the result to every
          home. How many residential windows does that give, in millions?
        expects: "21"
        feedback: >
          $(5+16)/2 = 10.5$ windows per home, times $2\times10^{6}$ homes, is
          $21\times10^{6}$. Hold that number; the next question is what the
          averaging assumed.
      - ask: >
          What did the plain average of $5$ and $16$ quietly assume about the
          city?
        choices:
          - text: >
              That every home has between $5$ and $16$ windows.
            feedback: >
              True of the average, and harmless. The damaging assumption is
              about how many homes are of each kind.
          - text: >
              That half the homes are apartments and half are houses.
            correct: true
            feedback: >
              An unweighted average of two figures gives each figure half the
              weight. In a dense city, far more than half the homes are
              apartments, so the house's $16$ is overcounted.
          - text: >
              Nothing: the average of the two types is the typical home.
            feedback: >
              The typical home in a city of apartments is an apartment. The
              midpoint of $5$ and $16$ describes no actual home and no actual
              mix.
        feedback: >
          A per-home window count differs sharply by building type, so the
          housing stock should be split before any window is counted.

      - part: Split by type, then count
        ask: >
          Say $80\%$ of households are apartments at $5$ windows. How many
          apartment windows, in millions?
        expects: "8"
        feedback: >
          $0.8\times2\times10^{6} = 1.6\times10^{6}$ apartments, times $5$, is
          $8\times10^{6}$ windows.
      - ask: >
          The other $20\%$ are houses at $16$ windows. What is the total
          residential count, in millions?
        expects: "14.4"
        tolerance: 0.05
        hint: >
          House windows first, then add the apartment windows.
        feedback: >
          $0.2\times2\times10^{6} = 4\times10^{5}$ houses, times $16$, is
          $6.4\times10^{6}$. Residential total $8 + 6.4 = 14.4$ million. As a
          weighted average that is $0.8\times5 + 0.2\times16 = 7.2$ windows per
          home.
      - ask: >
          By what factor did the candidate's flat-average $21$ million
          overshoot the split count?
        expects: "1.46"
        tolerance: 0.02
        feedback: >
          $21/14.4\approx1.46$. Nearly half again too many, from a structural
          shortcut that cost nothing to avoid — and the more lopsided the
          housing mix, the bigger the miss.

      - part: How much the rest deserves
        reflect: >
          Offices, shops, schools and hospitals have windows too. You could
          spend several minutes estimating them building type by building
          type. Before you do, how much effort do they deserve, and why?
        hint: >
          Compare the size of this term with the residential one, and with the
          doubt already in the residential one.
        answer: >
          Very little. Non-residential windows are a correction to a large
          residential total, not a peer term, so a rough percentage add-on is
          enough: even if that percentage is off by half, it moves the total
          by less than the doubt already sitting in the apartment share and
          the window counts. Spend the accuracy where the total is made — in
          the housing split.
      - teach: >
          That is the shape of the windows estimate: split the dominant term
          by type, weight each type's count by its share, and patch the small
          term with a rough percentage. Say commercial and municipal
          buildings add $20\%$ on top of the residential count.
      - ask: >
          What is the total window estimate, in millions?
        expects: "17.3"
        tolerance: 0.1
        feedback: >
          $14.4\times1.2 = 17.28$, about $17$ million — say "roughly
          $2\times10^{7}$" at one significant figure.
      - ask: >
          Suppose the commercial add-on is really $10\%$, or really $30\%$.
          How far does the total move from $17.3$ million?
        choices:
          - text: >
              By a factor of about $3$, since $30\%$ is three times $10\%$.
            feedback: >
              The add-on triples, but the add-on is a small piece. The totals
              are $14.4\times1.1\approx15.8$ and $14.4\times1.3\approx18.7$ million
              — the whole range is within a fifth.
          - text: >
              By about $8\%$ either way.
            correct: true
            feedback: >
              $15.8$ and $18.7$ against $17.3$: about $8\%$ down or up. A
              threefold doubt in a small term barely moves the total.
          - text: >
              By about $20\%$, the size of the add-on.
            feedback: >
              The add-on's *uncertainty* is $\pm10$ percentage points of the
              residential count, not its full $20\%$. That moves the total by
              about $1.44$ million, roughly $8\%$.
        feedback: >
          The housing split, by contrast, moved the answer by $46\%$. Effort
          belongs on the term that makes the total.

      - part: What counts as a window
        ask: >
          The interviewer asks about a $40$-storey office tower clad entirely
          in glass. How should it enter your count?
        choices:
          - text: >
              As one window per floor, since the glass is continuous.
            feedback: >
              One per floor undercounts what anyone would call a window by a
              factor of dozens. Pick a definition that matches the question's
              intent, then count by it.
          - text: >
              Leave it out: a curtain wall is not windows.
            feedback: >
              Possible, but then say so; silently dropping glass towers changes
              the commercial term without anyone knowing. The issue is the
              definition, and it must be stated.
          - text: >
              State a definition — one window per framed pane — and count the
              tower by it, roughly panes per floor times floors.
            correct: true
            feedback: >
              A count is only meaningful once "window" is defined, and saying
              the definition lets the interviewer agree or redirect. Then the
              tower is just another product: perhaps $100$ panes a floor times
              $40$ floors.
        feedback: >
          Every count question hides a definition. Name it in a sentence, then
          let the arithmetic follow: "I'll count a window as one framed pane;
          eighty percent apartments at five, twenty percent houses at sixteen,
          plus a fifth for everything else — about twenty million."

  - node: quant-mental.fermi.weight-of-747
    hook: >
      Weight-of-a-747 is the template for any "how heavy is this large
      physical object" question — structure, then whatever fills or fuels
      it — and the density anchor you reach for is the one thing that
      changes between instances.
    explanation: >
      The 747 chain has three terms of genuinely different character: a
      structural weight from volume times material density, a fuel weight
      from a flight-specific fuel budget, and a payload weight from a
      passenger-and-cargo count — three separate estimates added, not one
      chain multiplied through. Getting each term's dimensional check
      right individually matters more than getting any one number exactly
      right, because a unit slip in any single term corrupts a sum the
      other two terms can't rescue.

      The structural term generalizes furthest: any large object's weight
      can be bounded the same way — approximate its shape as a simple
      solid, estimate that solid's volume, and multiply by the density of
      whatever it's mostly made of. The density anchor is the piece that
      changes between instances — aluminum near $2.7$ tonnes per cubic
      meter for an airliner, steel near $7.8$ for a ship, water's density
      near $1$ for anything close to neutrally buoyant, like a large
      marine animal.

      The other lesson worth carrying forward is the "comparable multiple
      for everything else" step: the 747's shell alone is a small
      fraction of its dry structure, and multiplying by a rough factor for
      wings, engines and internals rather than estimating each separately
      is itself a legitimate Fermi move when the sub-parts are too
      numerous to decompose individually.
    worked: >
      Estimate a blue whale's weight. Approximate the body as a tapered
      cylinder $25\,\text{m}$ long and $4\,\text{m}$ across ($2\,
      \text{m}$ radius): a full cylinder's volume is $\pi r^{2}L\approx
      3.14\times4\times25\approx314\,\text{m}^{3}$; tapering front and
      back knocks off roughly $30\%$, giving $\approx220\,\text{m}^{3}$.
      Whale tissue sits close to neutral buoyancy, so density
      $\approx1\,\text{t/m}^{3}$ (water), giving a weight
      $\approx220$ tonnes. The real figure for a large adult is roughly
      $150$ tonnes, so the estimate is high by less than a factor of
      $1.5$ — well within Fermi range, with the miss almost entirely in
      the taper correction, not the underlying idea.
    interview: >
      Any "how much does X weigh" for a large, unfamiliar object is this
      template in disguise — decompose by structure, name a density
      anchor out loud, and state the shape approximation you're making
      before computing anything, since that approximation is usually the
      biggest source of error.
    pitfalls: >
      Reaching for the wrong density anchor — treating a mostly-hollow or
      mostly-water object like solid metal, or vice versa, is a much
      bigger error than misjudging the dimensions. Forgetting the shape
      correction and reporting the uncorrected simple solid's volume as
      if the object were really that shape.
    recap: >
      Bound a large object's weight as approximate volume times a density
      anchor matched to what it's mostly made of, then add fuel or
      payload terms separately.
    dialogue:
      - part: One cylinder, two volumes
        teach: >
          Same template, a different vehicle: estimate the weight of a fully
          loaded fuel tanker truck. Its tank is a steel cylinder $10$ m long
          and $2$ m across, full of diesel.
      - ask: >
          How many cubic metres of diesel does the tank hold?
        expects: "31.4"
        tolerance: 0.2
        hint: >
          The volume of a cylinder is $\pi r^{2}L$, and the radius is half the
          width.
        feedback: >
          $\pi\times1^{2}\times10\approx31.4\,\text{m}^{3}$.
      - ask: >
          Diesel weighs about $0.85$ tonnes per cubic metre. How many tonnes
          is the load?
        expects: "26.7"
        tolerance: 0.3
        feedback: >
          $31.4\,\text{m}^{3}\times0.85\,\text{t/m}^{3}\approx26.7$ t. The
          cubic metres cancel and tonnes remain.
      - ask: >
          Now the tank itself. A candidate multiplies the same
          $31.4\,\text{m}^{3}$ by steel's density, $7.8\,\text{t/m}^{3}$, and
          announces $245$ tonnes of steel. What went wrong?
        choices:
          - text: >
              The density: tank steel is lighter than $7.8$.
            feedback: >
              $7.8\,\text{t/m}^{3}$ is the right anchor for steel. The problem
              is the volume it was multiplied by.
          - text: >
              The volume: $31.4\,\text{m}^{3}$ is a solid steel cylinder, but the
              tank is a thin steel shell around a space full of diesel.
            correct: true
            feedback: >
              The $31.4\,\text{m}^{3}$ is where the diesel goes. Only the wall
              is steel, and the wall is a few millimetres thick.
          - text: >
              Nothing: a tanker truck plausibly weighs a few hundred tonnes.
            feedback: >
              A road truck weighing $245$ tonnes would crush most bridges. It
              is several times too heavy for anything on a highway, and the
              cause is structural, not a bad guess.
        feedback: >
          The same cylinder enters the estimate twice: its inside holds the
          cargo, its skin is the structure. Each needs its own volume.
      - reflect: >
          How would you find the volume of steel in the tank's wall from its
          dimensions? Ignore the two flat ends.
        hint: >
          Picture unrolling the wall into a flat sheet.
        answer: >
          Unrolled, the wall is a sheet as long as the tank and as wide as the
          circumference, so its area is $\pi d L$. The steel's volume is that
          area times the wall thickness. A thin shell's volume is surface
          times thickness, never the volume enclosed.

      - part: Structure, then what fills it
        ask: >
          The wall is $5$ mm thick. What volume of steel is in it, in cubic
          metres?
        expects: "0.314"
        tolerance: 0.005
        hint: >
          Convert the thickness to metres before multiplying.
        feedback: >
          Area: $\pi\times2\times10\approx62.8\,\text{m}^{2}$. Thickness:
          $5\,\text{mm} = 0.005\,\text{m}$. Volume:
          $62.8\times0.005\approx0.314\,\text{m}^{3}$ — square metres times
          metres gives cubic metres.
      - ask: >
          At $7.8$ tonnes per cubic metre, how many tonnes does the tank shell
          weigh?
        expects: "2.45"
        tolerance: 0.05
        feedback: >
          $0.314\times7.8\approx2.45$ t. A hundredth of the candidate's
          figure.
      - teach: >
          This is the 747's template: split the object into terms of
          different character and add them — a structure from shape, volume
          and a density anchor; a multiple for parts too numerous to count
          one by one; and whatever the object carries. For the 747 the shell
          is aluminium at $2.7\,\text{t/m}^{3}$ and the extra terms are fuel
          and passengers; here the shell is steel and the cargo is diesel.
      - ask: >
          Say the cab, engine, chassis, wheels and fittings weigh $3$ times
          the tank shell. What is the empty truck's weight, in tonnes?
        expects: "9.8"
        tolerance: 0.4
        hint: >
          Shell plus three shells.
        feedback: >
          $2.45 + 3\times2.45 = 4\times2.45 = 9.8$ t, call it $10$ tonnes.
      - ask: >
          What does the fully loaded truck weigh, in tonnes?
        expects: "36.5"
        tolerance: 1
        feedback: >
          $9.8 + 26.7 = 36.5$ t, call it $40$ tonnes at one significant figure.
          Real loaded tankers run close to that, near the road limit. The cargo
          is most of the weight, which is why the cargo term deserved its own
          volume and its own density rather than a multiple.

      - part: Checks that catch the slips
        ask: >
          Another candidate puts the wall at $5$ instead of $0.005$ and gets
          about $2{,}450$ tonnes of steel. Which check catches it before
          anything else?
        choices:
          - text: >
              Rounding to one significant figure.
            feedback: >
              Rounding $2{,}450$ to $2{,}000$ keeps the blunder intact. Rounding
              controls effort, not structure.
          - text: >
              None: you would only find it by redoing the multiplication.
            feedback: >
              Redoing it with the same $5$ reproduces the same $2{,}450$. The
              error is in the units, and the arithmetic is fine.
          - text: >
              The unit check: square metres times millimetres is not cubic
              metres until the millimetres are converted.
            correct: true
            feedback: >
              Writing $62.8\,\text{m}^{2}\times5\,\text{mm}$ shows the mismatch
              at once, a factor of $1{,}000$. A truck weighing more than a
              loaded jumbo jet confirms it.
        feedback: >
          Carry units on every number in a physical estimate. A slip between
          millimetres and metres is a factor of a thousand.
      - ask: >
          Which of these would you estimate with water's density, about
          $1$ tonne per cubic metre?
        choices:
          - text: >
              The steel hull of a cargo ship
            feedback: >
              Steel is near $7.8\,\text{t/m}^{3}$. Using $1$ would make the hull
              eight times too light.
          - text: >
              The milk carried by a milk tanker
            correct: true
            feedback: >
              Milk is mostly water, so about $1\,\text{t/m}^{3}$. The anchor is
              chosen by what the thing is mostly made of.
          - text: >
              The aluminium skin of an airliner
            feedback: >
              Aluminium is near $2.7\,\text{t/m}^{3}$, nearly three times
              water.
        feedback: >
          Name the density anchor out loud with the material it belongs to,
          and say the shape approximation before you compute: "a cylinder ten
          metres by two, steel skin five millimetres, full of diesel — about
          ten tonnes of truck and twenty-seven of fuel, call it forty."
