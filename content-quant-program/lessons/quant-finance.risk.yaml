unit: quant-finance.risk
opening: >
  Risk management is the discipline of stating a number for how bad a book's
  loss can get, being precise about what that number does and doesn't
  promise, and building the sizing rules and limits that keep a real trading
  edge from becoming a real blowup. This unit starts from the loss
  distribution as the single object every risk number is read from,
  contrasts value at risk's single quantile against expected shortfall's
  tail average and the coherence axioms that separate them, and confronts
  why the normal distribution undersells exactly the losses that matter.
  From there it covers how risk scales across horizons and where that
  scaling breaks, how drawdowns compound asymmetrically along an entire
  path rather than a single period, and how leverage turns ordinary
  volatility into an absorbing barrier — the same gambler's-ruin mechanics
  from earlier in the program, now applied directly to a trading book.
lessons:
  - node: quant-finance.risk.loss-distribution
    hook: >
      A trading desk that reports "two million of risk" without saying over
      what horizon, at what confidence, and on which return convention has
      said nothing at all — and that's the first thing an interviewer will
      strip away to see if you notice.
    explanation: >
      Every risk report in this unit is built on one random variable: the
      loss over a fixed horizon, $L = -(V_h - V_0)$, where $V_0$ is today's
      book value and $V_h$ is its value $h$ periods later. Flipping the sign
      of P&L is not cosmetic — it means every risk number that follows is
      stated so that bigger is worse and a profit is a negative loss,
      matching how every risk desk actually talks.

      Value at risk, expected shortfall, and drawdown are not three
      unrelated ideas; they are three different functionals of the same
      object, the law of $L$. A quantile of that law gives value at risk, a
      tail average gives expected shortfall, and looking at the whole path
      of $V_t$ rather than one endpoint gives drawdown. Learning this unit is
      largely learning which functional answers which question.

      None of those functionals mean anything without three choices fixed in
      advance: the horizon $h$ (a trading desk cares about one day, a
      regulator about ten, a credit book about a year), the confidence level
      (conventionally $95\%$ or $99\%$), and whether $L$ is built from
      arithmetic or log returns. Two desks quoting "$99\%$ VaR" at different
      horizons are not comparable, and the gap between arithmetic and log
      returns is invisible for small moves but material for large ones.
    worked: >
      Take a book worth $150$ million that falls to $110$ million over the
      horizon: the arithmetic loss is $L = 150 - 110 = 40$ million, a
      $26.7\%$ decline since $40/150 = 0.267$. The log return over the same
      move is $\ln(110/150) = \ln(0.733) \approx -0.310$, a $31.0\%$ decline
      — noticeably larger in magnitude, because log returns compound
      multiplicatively while the arithmetic figure is a simple ratio. For
      small moves the two nearly coincide; for a move this size they differ
      by more than four percentage points, which is exactly why a risk
      report has to say which convention it used.
    interview: >
      Interviewers open risk questions with a vague number — "the desk lost
      two million yesterday, is that bad" — specifically to see whether you
      ask for the horizon, the confidence level, and the return convention
      before answering; naming all three unprompted is the tell of someone
      who has actually worked with risk reports.
    pitfalls: >
      Reporting P&L instead of loss and then reasoning about "large VaR" as
      good news is an easy sign error under pressure — a profit is a
      negative loss, and forgetting that inverts every comparison.
      Comparing VaR or drawdown numbers computed at different horizons or
      confidence levels as though they were the same quantity is the most
      common way a risk conversation goes wrong.
    recap: >
      Every risk measure in this unit is a functional of the loss
      $L = -(V_h-V_0)$, and none of them mean anything until the horizon,
      confidence level, and return convention are all stated.
    dialogue:
      - part: One column, and which way is bad
        teach: >
          A book is worth $80$ million at Monday's open. Your risk report has
          a single column with one entry per day, and the desk head wants one
          thing from it: a bigger number must mean a worse day. Tuesday the
          book closes at $74$ million; Wednesday it closes at $83$ million,
          each measured against the same $80$ million open.
      - ask: >
          What goes in the column for Tuesday, in millions?
        expects: "6"
        hint: >
          The book went down. Bigger has to mean worse.
        feedback: >
          The book fell from $80$ to $74$, so the entry is $80 - 74 = 6$. A
          fall is recorded as a positive number.
      - ask: >
          What goes in the column for Wednesday, in millions?
        expects: "-3"
        hint: >
          The same rule, applied to a day the book went up.
        feedback: >
          $80 - 83 = -3$. A profit goes in as a negative number, so it sits
          below every losing day when the column is sorted, which is where the
          desk head wants it.
      - ask: >
          After a month the column runs from $-5$ to $9$. A junior analyst,
          reading it as P&L, tells the desk head the best day made $9$
          million. What happened on that day?
        choices:
          - text: >
              The book made $9$ million, as the analyst said.
            feedback: >
              That is the P&L reading. In this column a gain is negative, so
              the best day is the $-5$ entry, a $5$ million profit.
          - text: >
              The book lost $9$ million: it was the worst day of the month.
            correct: true
            feedback: >
              The column records $V_0 - V_h$, so $9$ is a $9$ million fall.
              Read with the wrong sign, the worst day becomes the best one.
          - text: >
              Nothing can be said without the book's size.
            feedback: >
              The size matters for a percentage, not for the direction. The
              sign alone says the book fell $9$ million that day.
        feedback: >
          The sign flip is the whole convention: every risk number is stated
          so that bigger is worse, and a profit is a negative loss. Get it
          backwards under pressure and every comparison that follows inverts.

      - part: Two desks, the same two million
        ask: >
          Desk A reports "a loss above $2$ million happens about one day in
          twenty". Desk B reports "a loss above $2$ million over ten days
          happens about once in a hundred ten-day windows". The two books trade
          similar products. Which reading is fair?
        choices:
          - text: >
              They carry the same risk: both quote $2$ million.
            feedback: >
              The $2$ million is attached to different questions. A's is a
              one-day loss passed once in $20$ days; B's is a ten-day loss
              passed once in $100$ windows. Equal numbers, unequal claims.
          - text: >
              B is riskier, because $99\%$ is a stricter standard than $95\%$.
            feedback: >
              A stricter standard pushes the quoted number *up* for the same
              book. B quoting the same $2$ million under a stricter standard
              and a longer horizon points the other way.
          - text: >
              B is likely the quieter book: its $2$ million must cover ten
              days and a rarer event, yet it is no larger than A's.
            correct: true
            feedback: >
              A longer horizon and a rarer event both make the threshold
              larger for the same book. If B still quotes $2$ million, its
              daily swings must be smaller. Neither number is comparable until
              both are restated on the same terms.
        feedback: >
          A risk figure is a loss level attached to a horizon and to a
          frequency. Change either and the number means something else.
      - reflect: >
          Before you could compare A and B you needed more than the number.
          List everything that has to be stated alongside a risk figure for it
          to be a quantity, and say what object all those figures are read
          from.
        answer: >
          The horizon (one day, ten days, a year), the confidence level (how
          often the figure may be passed, $95\%$ or $99\%$), and the return
          convention (arithmetic or log). All three describe one random
          variable: the loss over the horizon. A risk figure is one feature of
          that variable's distribution, so without the horizon you do not know
          which variable, and without the confidence level you do not know
          which feature.
      - teach: >
          Fix a horizon $h$ and a book worth $V_0$. The loss is
          $L = -(V_h - V_0)$, positive when the book falls, and its
          probability law is the loss distribution. Every risk measure you
          will meet is a functional of that law: value at risk reads one point
          of its CDF, expected shortfall averages its upper tail, and drawdown
          looks at the whole path of $V_t$ instead of one endpoint. Three
          choices come first: the horizon, the confidence level, and the
          return convention.

      - part: The convention nobody states
        teach: >
          Some systems measure a move in log terms, $-\ln(V_h/V_0)$, and
          others as a simple fraction, $(V_0 - V_h)/V_0$. A book worth $80$
          million falls to $40$ million over the horizon.
      - ask: >
          What is the arithmetic decline, as a percentage?
        expects: "50"
        feedback: >
          $(80 - 40)/80 = 0.5$, a $50\%$ decline.
      - ask: >
          What is the log loss, $-\ln(40/80)$, as a percentage to one decimal?
        expects: "69.3"
        tolerance: 0.05
        hint: >
          $-\ln(1/2) = \ln 2$.
        feedback: >
          $-\ln(0.5) = \ln 2 \approx 0.693$, so $69.3\%$. The same move is
          nineteen points larger on the log convention.
      - ask: >
          The same book instead falls from $80$ to $79.2$ million. How do the
          two conventions compare now?
        choices:
          - text: >
              They differ by the same nineteen points, since the convention
              is the same.
            feedback: >
              The gap is not fixed; it grows with the size of the move. Here
              the arithmetic figure is $1\%$ and the log figure is
              $-\ln(0.99) \approx 1.005\%$.
          - text: >
              They agree to within about $0.005$ percentage points.
            correct: true
            feedback: >
              $0.8/80 = 1\%$ against $-\ln(0.99) \approx 1.005\%$. For a small
              move $-\ln(1 - x) \approx x$, so the convention is invisible on
              an ordinary day and material on the day that matters.
          - text: >
              The log figure is now the smaller of the two.
            feedback: >
              For a fall, $-\ln(1 - x) > x$ at every size, so the log loss is
              always the larger. At $1\%$ the excess is just tiny: $1.005\%$
              against $1\%$.
        feedback: >
          The two conventions agree on calm days and part company exactly on
          the large losses a risk report exists to describe.
      - ask: >
          A desk states its risk as "a one-day loss above $4\%$ on one day in
          a hundred". Which clause is still missing?
        choices:
          - text: >
              The horizon.
            feedback: >
              "One-day" is the horizon. That clause is there.
          - text: >
              The confidence level.
            feedback: >
              "One day in a hundred" is the confidence level, $99\%$. That
              clause is there too.
          - text: >
              The return convention.
            correct: true
            feedback: >
              "$4\%$" is arithmetic or log, and the sentence does not say
              which. At $4\%$ the gap is small, about $0.08$ points, but a
              tail figure near $50\%$ would differ by nineteen.
        feedback: >
          In an interview, the vague number is the bait. Before saying whether
          two million is bad, ask over what horizon, at what confidence, on
          which convention.

  - node: quant-finance.risk.var
    hook: >
      Ask a candidate to define VaR and most can recite "$99\%$ chance we
      don't lose more than X"; the interview actually starts at the
      follow-up — what does VaR say about the day it's breached, and the
      honest answer is nothing at all.
    explanation: >
      Value at risk is the quantile function applied to the loss: for a
      level $\alpha \in (0,1)$, $\operatorname{VaR}_{\alpha}(L) = \inf\{x :
      \Pr(L \le x) \ge \alpha\}$, the smallest loss level the distribution
      doesn't exceed with probability at least $\alpha$. Every property of
      quantiles carries over directly — VaR is well defined for any loss
      law, including one with jumps or atoms, because the quantile function
      always is.

      Equivalently, $\Pr(L > \operatorname{VaR}_{\alpha}) \le 1-\alpha$: over
      many independent horizons, a $99\%$ VaR is breached on roughly one
      period in a hundred. That single inequality is the entire operational
      content of the number — it fixes how often the threshold is crossed
      and says nothing else.

      Two misreadings to refuse under interview pressure. VaR is not a worst
      case: the loss distribution can, and typically does, extend far past
      $\operatorname{VaR}_{\alpha}$, and the quantile carries no information
      about how far. VaR is also not an expected loss of any kind. It reads
      one point of the CDF and is silent about the shape of everything
      beyond that point, which is exactly the gap the next few nodes exist
      to close.
    worked: >
      A desk's daily loss (in millions) takes value $-2$ with probability
      $0.50$ (a profit), $0$ with probability $0.20$, $3$ with probability
      $0.15$, $8$ with probability $0.10$, and $40$ with probability $0.05$.
      Reading off the CDF: $\Pr(L \le 3) = 0.85 < 0.95$, but
      $\Pr(L \le 8) = 0.95 \ge 0.95$, so $\operatorname{VaR}_{0.95} = 8$.
      Note what got thrown away: the $5\%$ tail beyond $8$ is entirely the
      loss of $40$, and the quantile reports $8$ either way — it would
      report the same number if that tail value were $40$ or $4000$.
    interview: >
      The canonical phrasing is "what's our $99\%$ one-day VaR" or "is a
      $95\%$ VaR of five million a big deal" — the interviewer is listening
      for the quantile definition stated correctly and, more importantly,
      for you to volunteer the two caveats before being asked.
    pitfalls: >
      Quoting $1-\alpha$ where $\alpha$ was meant flips the story completely
      — a $99\%$ VaR is breached about $1\%$ of the time, not $99\%$.
      Treating $\operatorname{VaR}_{\alpha}$ as a bound on the size of any
      single day's loss, rather than a threshold on how often losses of that
      size or larger occur, is the error every follow-up in this unit is
      designed to expose.
    recap: >
      $\operatorname{VaR}_{\alpha}(L)$ is the $\alpha$-quantile of the loss
      — breached with probability $1-\alpha$ — and it carries zero
      information about the size of any loss beyond that point.
    dialogue:
      - part: A limit the desk breaches rarely
        teach: >
          A desk's daily loss, in millions, is $-4$ with probability $0.55$
          (a profit), $1$ with probability $0.25$, $4$ with probability $0.12$,
          $6$ with probability $0.05$ and $25$ with probability $0.03$. The
          head of risk wants a daily loss threshold that is crossed on at most
          one day in twenty, and as tight as possible.
      - ask: >
          What is the smallest threshold $x$, in millions, with
          $\Pr(L > x) \le 0.05$?
        expects: "6"
        hint: >
          Work down from the top: how likely is a loss above $4$? Above $6$?
        feedback: >
          $\Pr(L > 4) = 0.05 + 0.03 = 0.08$, too often. $\Pr(L > 6) = 0.03$,
          which passes, and any threshold below $6$ is crossed with probability
          at least $0.08$. So $x = 6$.
      - ask: >
          Now the threshold may be crossed on at most one day in a hundred.
          What is the smallest such $x$?
        expects: "25"
        hint: >
          Every threshold from $6$ up to just below $25$ is crossed with the
          same probability.
        feedback: >
          For any $x$ in $[6, 25)$, $\Pr(L > x) = 0.03$, still above $0.01$.
          Only at $x = 25$ does the probability drop to $0$. The threshold
          jumps straight from $6$ to $25$.
      - ask: >
          A stress review says the $25$ million scenario is really a $250$
          million scenario, still with probability $0.03$. What happens to
          the one-in-twenty threshold?
        choices:
          - text: >
              It rises, because the book is now far more dangerous.
            feedback: >
              The book is more dangerous, but recompute: $\Pr(L > 4) = 0.08$
              and $\Pr(L > 6) = 0.03$, exactly as before. The threshold never
              looked at how big the losses above it were.
          - text: >
              It stays at $6$.
            correct: true
            feedback: >
              Only the probabilities below and at $6$ decide it, and none of
              them moved. A $25$ million tail and a $250$ million tail give
              the same answer.
          - text: >
              It cannot be computed until the new scenario is priced.
            feedback: >
              Nothing needs pricing. The threshold depends on where the CDF
              crosses $0.95$, and that crossing happens at $6$ whatever sits
              beyond it.
        feedback: >
          The threshold is set by how often losses occur, not by how large
          the rare ones are. Hold on to that; it is the whole weakness of the
          number you just computed.

      - part: The number you were computing
        reflect: >
          In terms of the loss CDF $F(x) = \Pr(L \le x)$, what were you doing
          each time you found the smallest acceptable threshold? Name the
          object from your earlier work on random variables.
        answer: >
          You were finding the first $x$ at which $F(x)$ reaches the target,
          $0.95$ or $0.99$: the smallest $x$ with $\Pr(L \le x) \ge \alpha$.
          That is the $\alpha$-quantile of $L$, defined with an infimum so it
          exists even when the CDF jumps, as this one does. Crossing the
          threshold at most $1 - \alpha$ of the time and being covered at
          least $\alpha$ of the time are the same statement.
      - teach: >
          That quantile is the value at risk:
          $\operatorname{VaR}_{\alpha}(L) = \inf\{x : \Pr(L \le x) \ge
          \alpha\}$. Equivalently $\Pr(L > \operatorname{VaR}_{\alpha}) \le
          1 - \alpha$. For this desk $\operatorname{VaR}_{0.95} = 6$ and
          $\operatorname{VaR}_{0.99} = 25$. The inequality is $\ge$, not $>$,
          and on a CDF with jumps that difference decides the answer.
      - ask: >
          For the same desk, what is $\operatorname{VaR}_{0.80}$, in millions?
        expects: "1"
        hint: >
          Compute $\Pr(L \le 1)$ and compare it with $0.80$.
        feedback: >
          $\Pr(L \le 1) = 0.55 + 0.25 = 0.80$, which is $\ge 0.80$, so the
          infimum is $1$. Reading the condition as a strict $> 0.80$ gives
          $4$, the wrong answer, because the CDF lands on $0.80$ exactly.

      - part: What the number promises, and what it does not
        ask: >
          A different book has a $99\%$ one-day VaR of $3$ million and its
          model is right. Over $500$ trading days, on how many days do you
          expect a loss above $3$ million?
        expects: "5"
        feedback: >
          The breach probability is $1 - 0.99 = 0.01$ a day, so
          $500 \times 0.01 = 5$ days. Quoting $99\%$ where $1\%$ was meant
          would predict $495$.
      - ask: >
          On those five days, what does the VaR say about the size of the
          loss?
        choices:
          - text: >
              Each is about $3$ million, give or take.
            feedback: >
              The VaR is where the tail starts, not what it contains. The
              $250$ million scenario above sat beyond a VaR of $6$ without
              moving it.
          - text: >
              Each is at most $3$ million, since VaR is the worst case.
            feedback: >
              These are exactly the days the loss is *above* $3$ million.
              VaR is breached by construction, about $1\%$ of the time.
          - text: >
              Only that each exceeds $3$ million; the size could be anything.
            correct: true
            feedback: >
              The quantile is one point of the CDF. A breach of $3.1$ million
              and a breach of $300$ million are equally consistent with it.
        feedback: >
          VaR fixes how often the threshold is crossed and is silent about
          by how much. It is not a worst case.
      - ask: >
          Back to the first desk, with its $25$ million scenario. What is its
          expected daily loss $\mathbb{E}[L]$, in millions?
        expects: "-0.42"
        tolerance: 0.001
        hint: >
          Weight each loss by its probability. Profits enter as negatives.
        feedback: >
          $-4(0.55) + 1(0.25) + 4(0.12) + 6(0.05) + 25(0.03) = -2.20 + 0.25 +
          0.48 + 0.30 + 0.75 = -0.42$. On average the desk makes $0.42$
          million a day, while its $95\%$ VaR is $6$. VaR is not an expected
          loss of any kind; it is a quantile.
      - ask: >
          An interviewer asks: "our $95\%$ one-day VaR is $6$ million; what
          does that tell me?" Which answer would you give?
        choices:
          - text: >
              On at least $95\%$ of days we lose $6$ million or less; on the
              rest we lose more, by an amount VaR does not tell you.
            correct: true
            feedback: >
              The quantile, stated with its horizon and confidence, and the
              caveat volunteered before it is asked for.
          - text: >
              We lose $6$ million on about $5\%$ of days.
            feedback: >
              On those days the loss is $6$ million *or more*. Saying "$6$
              million" turns the threshold into a typical breach size.
          - text: >
              The most we can lose in a day is $6$ million, with $95\%$
              confidence.
            feedback: >
              Close in words, wrong in spirit: it invites the listener to treat
              $6$ as a cap. The days beyond it are unbounded as far as VaR
              knows; this desk's tail holds a $25$ million day.
        feedback: >
          The definition and both caveats, not a worst case and not an
          expected loss, is the ten-second answer.

  - node: quant-finance.risk.normal-var
    hook: >
      Interviewers hand you $\sigma$ and ask for the VaR precisely because
      the answer is one multiplication, $z_\alpha \sigma$, and then
      immediately ask what has to be true for that multiplication to be
      trustworthy.
    explanation: >
      When the loss is normal with mean $0$ and standard deviation $\sigma$,
      standardizing turns $\Pr(L \le x) = \alpha$ into
      $\Pr(Z \le x/\sigma) = \alpha$ for a standard normal $Z$, so $x/\sigma$
      must equal the standard normal $\alpha$-quantile $z_{\alpha}$.
      Rearranged, $\operatorname{VaR}_{\alpha} = z_{\alpha}\sigma$ — the
      computation collapses to reading one number off a normal table and
      multiplying.

      Two values of $z_{\alpha}$ are worth having memorized cold, because
      they recur in essentially every VaR question: $z_{0.99} = 2.326$ and
      $z_{0.95} = 1.645$. Everything else here is arithmetic once those are
      on hand.

      With a nonzero drift $\mu$ per period the formula becomes
      $\operatorname{VaR}_{\alpha} = z_{\alpha}\sigma - \mu h$ over a horizon
      of $h$ periods — the mean shifts the distribution by an amount
      proportional to $h$, while the standard deviation only grows like
      $\sqrt{h}$, so the drift term is negligible at a one-day horizon and
      can dominate at a one-year one.

      The whole appeal of this formula is that it's one multiplication; that
      is also exactly why an interviewer's next move is almost always to
      attack the assumption that daily P&L is actually normal.
    worked: >
      Take a book worth $40$ million with daily P&L standard deviation
      $\sigma = 2\%$ of book value. The $99\%$ one-day VaR is
      $z_{0.99}\sigma = 2.326 \times 2\% = 4.652\%$ of the book, or
      $4.652\% \times 40 = 1.86$ million. At $95\%$,
      $z_{0.95}\sigma = 1.645 \times 2\% = 3.29\%$, or $1.32$ million —
      noticeably smaller, since moving from $99\%$ to $95\%$ trades a rarer,
      larger threshold for a more common, smaller one.
    interview: >
      "Daily vol is $2\%$, what's the $99\%$ one-day VaR on a $40$ million
      book" wants $z_{0.99}\sigma$ computed on the spot with $z_{0.99} =
      2.326$ recalled from memory; a strong answer also states the
      normality and zero-mean assumptions being used without being asked.
    pitfalls: >
      Using $z_{0.95}$ when the question asked for $99\%$, or vice versa, is
      a common slip under time pressure — say the confidence level back
      before committing to a $z$-value. Applying $z_{\alpha}\sigma$ at a
      horizon long enough that the drift term $\mu h$ is no longer
      negligible, without adjusting for it, silently biases the answer.
    recap: >
      For normal, zero-mean daily loss, $\operatorname{VaR}_{\alpha} =
      z_{\alpha}\sigma$; at $\sigma=2\%$ that's $4.65\%$ at $99\%$ and
      $3.29\%$ at $95\%$, one multiplication either way.
    dialogue:
      - part: One standard deviation, three million
        teach: >
          A book is worth $250$ million. Its daily P&L is normal with mean $0$
          and standard deviation $1.2\%$ of book value. The head of risk wants
          the $99\%$ one-day VaR by the end of the call.
      - ask: >
          First, the daily standard deviation $\sigma$ in millions?
        expects: "3"
        feedback: >
          $1.2\% \times 250 = 3$ million. Everything that follows is a
          multiple of this number.
      - ask: >
          Before any table: is the $99\%$ VaR above or below $2\sigma = 6$
          million?
        choices:
          - text: >
              Below: a $2\sigma$ loss already covers $95\%$ of days.
            feedback: >
              The $95\%$ figure is two-sided, $\Pr(\lvert Z \rvert \le 2)$.
              A loss is one tail: $\Pr(Z > 2) \approx 2.3\%$, and $2.3\%$ of
              days is too many for a $1\%$ threshold.
          - text: >
              Exactly $6$: two standard deviations is the $99\%$ line.
            feedback: >
              Two standard deviations is crossed on about $2.3\%$ of days,
              more than twice the $1\%$ allowed. The $99\%$ line sits further
              out.
          - text: >
              Above: a loss beyond $2\sigma$ happens on about $2.3\%$ of days,
              more than $1\%$.
            correct: true
            feedback: >
              $\Pr(Z > 2) \approx 0.023$. To get the breach rate down to
              $0.01$ the threshold has to move further out than $2\sigma$.
        feedback: >
          The VaR is a one-tailed quantile, somewhere a little beyond $2\sigma$.
          Bracketing it before computing is how you catch a wrong table value.
      - reflect: >
          A normal table gives quantiles of the standard normal $Z$ only. How
          do you turn "the $0.99$-quantile of $L$" into a number you can read
          off that table?
        hint: >
          How is $L$ built from $Z$?
        answer: >
          Here $L = \sigma Z$ with $\sigma = 3$, so $\Pr(L \le x) = \Pr(Z \le
          x/\sigma)$. That equals $0.99$ exactly when $x/\sigma$ is the
          standard normal quantile $z_{0.99}$. Scaling a variable scales its
          quantiles by the same factor, so the VaR is $z_{\alpha}$ standard
          deviations.

      - part: The one multiplication
        teach: >
          For a zero-mean normal loss, $\operatorname{VaR}_{\alpha} =
          z_{\alpha}\sigma$. Two quantiles are worth knowing cold:
          $z_{0.99} = 2.326$ and $z_{0.95} = 1.645$.
      - ask: >
          What is the $99\%$ one-day VaR of the $250$ million book, in
          millions? Give two decimals.
        expects: "6.98"
        tolerance: 0.005
        feedback: >
          $2.326 \times 3 = 6.978$, so about $6.98$ million, or $2.79\%$ of
          the book. A little beyond the $6$ million bracket, as predicted.
      - ask: >
          And the $95\%$ one-day VaR, in millions, to two decimals?
        expects: "4.94"
        tolerance: 0.005
        feedback: >
          $1.645 \times 3 = 4.935$, about $4.94$ million. The lower confidence
          level buys a smaller, more frequently crossed threshold.
      - ask: >
          What is the ratio of the $99\%$ VaR to the $95\%$ VaR, to two
          decimals?
        expects: "1.41"
        tolerance: 0.005
        hint: >
          The $\sigma$ cancels.
        feedback: >
          $2.326/1.645 \approx 1.414$. The ratio depends on neither the book
          nor $\sigma$: under normality one VaR figure fixes every other. It
          also means the normal model has an opinion about the tail's shape,
          which is the thing to test.

      - part: When the drift stops being small
        teach: >
          Now give the book a drift of $\mu = 0.05\%$ of book value per day.
          Over $h$ days the mean gain is $\mu h$ and, with independent days,
          the standard deviation is $\sigma\sqrt{h}$. The VaR becomes
          $z_{\alpha}\sigma\sqrt{h} - \mu h$.
      - ask: >
          At a one-day horizon, what does the drift do to the $99\%$ VaR?
        choices:
          - text: >
              Almost nothing: $2.79\%$ becomes $2.74\%$.
            correct: true
            feedback: >
              $2.326 \times 1.2\% - 0.05\% = 2.791\% - 0.05\% = 2.741\%$. One
              day's drift is a rounding error against one day's noise.
          - text: >
              It raises the VaR, since the book now moves more.
            feedback: >
              The drift moves the centre, not the spread. A positive mean gain
              pulls the whole loss distribution left and lowers every
              quantile.
          - text: >
              It cuts the VaR by about a quarter.
            feedback: >
              $0.05\%$ against $2.79\%$ is under $2\%$ of the figure, not a
              quarter. A quarter is roughly what it does at a one-year
              horizon.
        feedback: >
          Drift is negligible at a day because noise of size $\sigma$ swamps a
          mean of size $\mu$ when $\sigma/\mu = 24$.
      - ask: >
          Over $h = 250$ trading days, using $\sqrt{250} \approx 15.81$, what
          is the $99\%$ VaR with the drift, as a percentage of the book? Give
          one decimal.
        expects: "31.6"
        tolerance: 0.1
        hint: >
          Compute $z_{0.99}\sigma\sqrt{h}$ and $\mu h$ separately, then
          subtract.
        feedback: >
          $2.326 \times 1.2\% \times 15.81 \approx 44.1\%$, and
          $\mu h = 0.05\% \times 250 = 12.5\%$, so the VaR is about $31.6\%$.
          The mean grows like $h$ and the noise like $\sqrt{h}$, so at a year
          the drift removes more than a quarter of the figure.

      - part: The assumption an interviewer attacks
        ask: >
          Back to the one-day, zero-drift model. The $99\%$ VaR of $6.98$
          million is backtested over $1000$ trading days. If the model is
          right, how many days should show a loss above it?
        expects: "10"
        feedback: >
          $1000 \times 0.01 = 10$.
      - ask: >
          The record shows $25$ such days, and $\sigma$ measured over the same
          period really was $3$ million. What is the likely culprit?
        choices:
          - text: >
              The drift was dropped from the formula.
            feedback: >
              Adding a positive drift would lower the VaR and produce more
              breaches, not fewer. And at one day the drift moves the number by
              under $2\%$.
          - text: >
              $2.326$ is the wrong quantile; the two-sided value should be used.
            feedback: >
              A loss threshold is one-tailed, so $z_{0.99} = 2.326$ is right.
              The two-sided value, $2.576$, answers a different question.
          - text: >
              Daily P&L is not normal: its tail beyond $2.326\sigma$ is
              heavier than the normal curve allows.
            correct: true
            feedback: >
              With $\sigma$ right and the arithmetic right, the remaining input
              is the shape. $25$ breaches where $10$ were due says losses past
              $2.33\sigma$ come about two and a half times as often as the
              normal predicts.
        feedback: >
          The formula is one multiplication, and that is why the interviewer's
          next question is about normality. Say the assumption out loud when
          you give the number.

  - node: quant-finance.risk.var-subadditivity
    hook: >
      "Give me a case where VaR punishes diversification" is asked cold
      often enough that the counterexample belongs in memory, numbers and
      all, not reconstructed live.
    explanation: >
      A risk measure $\rho$ is subadditive when merging two books never
      manufactures risk: $\rho(A+B) \le \rho(A)+\rho(B)$. It's the property
      that mathematically justifies "diversification helps" — if a measure
      has it, combining positions can only look as risky as, or less risky
      than, holding them separately. Value at risk does not have this
      property.

      The mechanism is a quantile's blindness to what sits just below the
      threshold. A position whose bad outcome has probability just under
      $1-\alpha$ reports $\operatorname{VaR}_{\alpha}=0$ individually,
      because that loss doesn't cross the quantile on its own. Combine two
      such positions and the probability that at least one has its bad
      outcome can jump past $1-\alpha$, dragging the combined quantile
      straight up to a real loss — the individual near-misses conspire to
      become a portfolio hit.

      Two consequences bite in practice. A firm cannot safely allocate a
      VaR limit across desks by summing sub-limits, because the sum of the
      parts is not a bound on the whole. And optimizing a book against a VaR
      constraint rewards concentrating loss just past the quantile — selling
      far out-of-the-money options collects a small premium in the reported
      $95\%$ or $99\%$ of outcomes while stacking catastrophic loss into the
      untested tail.
    worked: >
      Two independent loans each repay in full unless the issuer defaults,
      probability $3\%$, in which case the loss is $100$. For one loan,
      $\Pr(L>0)=0.03<0.05$, so $\operatorname{VaR}_{0.95}=0$. Holding both:
      neither defaults with probability $0.97^{2}=0.9409$, exactly one
      defaults with probability $2(0.03)(0.97)=0.0582$, both default with
      probability $0.03^{2}=0.0009$. Then $\Pr(L\le 0)=0.9409<0.95$ but
      $\Pr(L\le 100)=0.9409+0.0582=0.9991\ge 0.95$, so
      $\operatorname{VaR}_{0.95}=100$ for the pair — strictly more than
      $0+0$, even though the loans are independent and identical.
    interview: >
      The two-independent-loans construction, or an equivalent with bonds
      or options, is the standard proof interviewers want reconstructed
      from scratch — the key move to name is that a low-probability event,
      individually under the threshold, can push the combined probability
      of "at least one" over it.
    pitfalls: >
      Assuming diversification always weakly reduces VaR is exactly what
      this example refutes. Forgetting that the effect depends on where
      $1-\alpha$ sits relative to the individual event probabilities;
      changing $\alpha$ or the default probability can make the same
      construction fail to produce a violation, so the numbers matter, not
      just the shape of the argument.
    recap: >
      Two independent $3\%$-default loans each have zero $95\%$ VaR while
      the pair has $100$ — VaR can strictly increase under diversification,
      which is exactly subadditivity failing.
    dialogue:
      - part: Two catastrophe bonds, one at a time
        teach: >
          A desk holds two catastrophe bonds on two different coastlines. Each
          loses $30$ million if its hurricane makes landfall this year, which
          happens with probability $0.6\%$, and loses nothing otherwise. The
          hurricanes are independent. The firm limits every book by its $99\%$
          one-year VaR.
      - ask: >
          What is $\operatorname{VaR}_{0.99}$ of one bond held alone, in
          millions?
        expects: "0"
        hint: >
          Compute $\Pr(L \le 0)$ and compare it with $0.99$.
        feedback: >
          $\Pr(L \le 0) = 0.994 \ge 0.99$, so the quantile is $0$. The $30$
          million loss happens less often than one year in a hundred, so the
          $99\%$ VaR does not see it.
      - ask: >
          Now hold both bonds in one book. What is the probability that at
          least one hurricane hits? Give four decimals.
        expects: "0.0120"
        tolerance: 0.00005
        hint: >
          Complement: both must miss.
        feedback: >
          $1 - 0.994^{2} = 1 - 0.988036 = 0.011964$, about $0.0120$. Each
          event alone is under $1\%$; the chance of at least one is over it.
      - ask: >
          What is $\operatorname{VaR}_{0.99}$ of the two-bond book, in
          millions?
        expects: "30"
        hint: >
          $\Pr(L \le 0)$ is now $0.988$. What is $\Pr(L \le 30)$?
        feedback: >
          $\Pr(L \le 0) = 0.988036 < 0.99$, so the VaR is not $0$.
          $\Pr(L \le 30) = 1 - 0.006^{2} = 0.999964 \ge 0.99$, so
          $\operatorname{VaR}_{0.99} = 30$. Two books of VaR $0$ merge into a
          book of VaR $30$.

      - part: What the merger broke
        reflect: >
          You expected that holding two independent bets together could not
          look riskier than the sum of holding them apart. What exactly about
          a quantile let $0 + 0$ become $30$?
        hint: >
          Where did each bond's bad event sit relative to the $1\%$ line,
          before and after the merger?
        answer: >
          A quantile only asks whether a loss's probability crosses
          $1 - \alpha$. Each bond's loss sat just below that line, so each
          reported nothing. In the merged book the event "at least one loss"
          adds the two probabilities, nearly, and crosses the line, so the
          quantile jumps from nothing to a full loss. Two near-misses became
          one hit, and the quantile had no way to give credit for the fact
          that both losing together is very rare.
      - teach: >
          A risk measure $\rho$ is subadditive when $\rho(A + B) \le \rho(A) +
          \rho(B)$: merging two books never manufactures risk. That is the
          formal content of "diversification helps". You have just shown that
          VaR is not subadditive: $\operatorname{VaR}_{0.99}(A + B) = 30 > 0 +
          0$.
      - ask: >
          Which feature of the two bonds was essential to the violation?
        choices:
          - text: >
              The losses are large, $30$ million each.
            feedback: >
              Scale is irrelevant: with losses of $1$ million each the
              VaRs would be $0$, $0$ and $1$, the same violation. Only
              probabilities decided where the quantile landed.
          - text: >
              Each loss probability is below $1 - \alpha$, while the
              probability of at least one loss is above it.
            correct: true
            feedback: >
              That is the whole mechanism: $0.006 < 0.01 < 0.012$. Move either
              inequality and the construction stops working.
          - text: >
              The bonds are correlated, so they tend to lose together.
            feedback: >
              They are independent. Independence is what makes "at least one"
              nearly twice as likely as either alone.
        feedback: >
          The counterexample lives in the band between the single-event
          probability and the union's. Interviewers want that sentence.

      - part: Where the violation disappears
        ask: >
          Each hurricane now hits with probability $0.4\%$ instead. What is
          $\operatorname{VaR}_{0.99}$ of the two-bond book, in millions?
        expects: "0"
        hint: >
          Compute $1 - 0.996^{2}$ and compare it with $0.01$.
        feedback: >
          $1 - 0.996^{2} = 0.007984 < 0.01$, so $\Pr(L \le 0) \ge 0.99$ and
          the VaR is $0$. No violation: the union never crossed the line. The
          numbers matter, not only the shape of the argument.
      - ask: >
          Back to $0.6\%$, but now both bonds cover the same coastline, so one
          hurricane triggers both. The book loses $60$ million with
          probability $0.006$. What is its $\operatorname{VaR}_{0.99}$?
        expects: "0"
        feedback: >
          $\Pr(L > 0) = 0.006 < 0.01$, so the VaR is $0$. The concentrated
          book, which can lose $60$ million at once, scores $0$; the
          diversified book, which almost never loses more than $30$, scores
          $30$. VaR ranks them backwards.
      - ask: >
          The firm has a $10$ million VaR limit and gives each of its two cat
          bond desks a limit of $5$ million. Each desk holds one of the
          independent $0.6\%$ bonds. What happens?
        choices:
          - text: >
              Both desks are within limit, so the firm is too: $0 + 0 \le 10$.
            feedback: >
              That is the step subadditivity would license and VaR does not.
              The firm's book is the two-bond book, with VaR $30$.
          - text: >
              Both desks are within limit, yet the firm's VaR is $30$, three
              times its limit.
            correct: true
            feedback: >
              Desk limits that sum to the firm limit bound nothing when the
              measure is not subadditive. A VaR budget cannot be safely
              allocated by adding sub-limits.
          - text: >
              Each desk breaches, since each can lose $30$ million.
            feedback: >
              Each desk's VaR is $0$: its loss is rarer than one year in a
              hundred. The breach shows up only at the firm level.
        feedback: >
          Allocation is the first practical casualty. The second is what
          traders learn to do against a VaR limit.
      - ask: >
          A trader under a $99\%$ VaR limit wants income that the limit does
          not see. Which book does the job?
        choices:
          - text: >
              Short far out-of-the-money options whose payout is triggered with
              probability just under $1\%$.
            correct: true
            feedback: >
              The premium arrives on $99\%$ of days and the loss sits just
              past the quantile, where VaR reports nothing about its size. It
              is the cat bond, written as options.
          - text: >
              A long, diversified equity portfolio.
            feedback: >
              Its ordinary daily swings sit squarely inside the $99\%$
              quantile, so VaR measures them in full. There is nothing hidden.
          - text: >
              Cash.
            feedback: >
              Cash has no VaR and no income beyond the rate. The trader wants
              income the limit misses, not no risk at all.
        feedback: >
          Optimizing against a VaR limit rewards stuffing loss just beyond the
          quantile. A measure that looked past it would charge for that tail.

  - node: quant-finance.risk.expected-shortfall
    hook: >
      "What's wrong with VaR, and what would you replace it with" is one
      question, not two — the expected answer names expected shortfall and
      explains, with the formula, why it fixes both defects at once.
    explanation: >
      Expected shortfall averages exactly the tail that value at risk
      refuses to look inside: $\operatorname{ES}_{\alpha} = \mathbb{E}[L
      \mid L \ge \operatorname{VaR}_{\alpha}]$, the mean loss conditional on
      the VaR threshold being breached. An equivalent definition, the
      average of $\operatorname{VaR}_{u}$ over $u \in (\alpha,1)$, is the
      form to reach for when the loss law has atoms.

      This single change repairs both of VaR's defects. It responds to the
      size of tail losses, not merely whether a threshold was crossed, so
      the discontinuity central to VaR is not subadditive becomes visible
      directly in the reported number rather than hidden until the quantile
      is breached. And expected shortfall is itself subadditive: averaging
      over a tail can't manufacture the same discontinuity a single
      quantile can.

      For a normal, zero-mean loss, $\operatorname{ES}_{\alpha} =
      \sigma\varphi(z_{\alpha})/(1-\alpha)$, with $\varphi$ the standard
      normal density — always somewhat larger than
      $\operatorname{VaR}_{\alpha}=z_{\alpha}\sigma$, since it's averaging
      over losses at least that large. This is precisely why Basel's
      market-risk capital rules moved from $99\%$ VaR to $97.5\%$ ES: the
      two nearly coincide under normality ($2.34\sigma$ against
      $2.33\sigma$) and diverge once the tail is heavier than normal, which
      real returns always are.
    worked: >
      At $\sigma=2\%$ daily and Basel's $\alpha=0.975$: $z_{0.975}=1.960$
      and $\varphi(1.960)\approx 0.0584$, so $\operatorname{ES}_{0.975}=
      2\%\times 0.0584/0.025\approx 4.68\%$ of book value. Compare
      $\operatorname{VaR}_{0.975}=z_{0.975}\sigma=1.960\times 2\%=3.92\%$:
      the shortfall figure is about $19\%$ larger than the quantile it sits
      beyond, purely from averaging the tail rather than reading its edge.
    interview: >
      "How would you fix VaR" and "why did Basel move to expected
      shortfall" are the same question in two costumes; the expected answer
      names subadditivity and tail-size sensitivity together, backed by the
      formula $\sigma\varphi(z_{\alpha})/(1-\alpha)$ recalled on the spot.
    pitfalls: >
      Computing $\operatorname{ES}_{\alpha}$ with a $z$-value from a
      different confidence level than the one being quoted silently
      mismatches the two numbers. Using the normal closed form on a loss
      distribution known to have atoms or heavy tails understates ES just
      as badly as normal VaR understates the quantile — the
      average-of-quantiles definition, or an empirical estimate, is the
      honest fallback.
    recap: >
      Expected shortfall averages the loss beyond $\operatorname{VaR}_{
      \alpha}$, repairing both its blindness to tail size and its failure
      of subadditivity — $4.68\%$ against a $3.92\%$ VaR at $\alpha=0.975$,
      $\sigma=2\%$.
    dialogue:
      - part: Two books with the same VaR
        teach: >
          Two books, losses in millions. Book A's loss is uniform on $[-5, 5]$.
          Book B's loss is uniform on $[-5, 4]$ with probability $0.9$ and
          uniform on $[4, 40]$ with probability $0.1$. The risk committee
          compares them at $\alpha = 0.9$.
      - ask: >
          What is $\operatorname{VaR}_{0.9}$ of book A, in millions?
        expects: "4"
        hint: >
          $\Pr(L \le x) = (x + 5)/10$ on $[-5, 5]$.
        feedback: >
          $(x + 5)/10 = 0.9$ gives $x = 4$. One loss in ten is above $4$
          million, and none is above $5$.
      - ask: >
          What is $\operatorname{VaR}_{0.9}$ of book B?
        choices:
          - text: >
              $22$, the middle of its tail.
            feedback: >
              That is a tail average, not a quantile. The quantile is where
              the CDF reaches $0.9$, and B puts exactly $0.9$ of its mass on
              $[-5, 4]$.
          - text: >
              $40$, its largest possible loss.
            feedback: >
              The largest loss is the $100\%$ quantile. At $90\%$ the
              threshold sits where the bottom piece ends.
          - text: >
              $4$, the same as book A.
            correct: true
            feedback: >
              $\Pr(L \le 4) = 0.9$ for B too. One book's worst tenth tops out
              at $5$ million, the other's runs to $40$, and the VaR cannot tell
              them apart.
        feedback: >
          This is the defect you already know: a quantile reads one point of
          the CDF and ignores the shape beyond it.
      - reflect: >
          Propose one number, built from the loss distribution, that would
          rank B as far riskier than A while still being about the worst
          tenth of outcomes. What would it compute?
        answer: >
          Average the loss over the worst tenth: the mean of $L$ given that
          $L$ is at or beyond the $90\%$ VaR. For A that is the middle of
          $[4, 5]$; for B it is the middle of $[4, 40]$. It still looks only
          at the tail the confidence level names, but it looks *inside* the
          tail rather than at its edge, so a bigger tail scores bigger.

      - part: Averaging the tail
        teach: >
          That number is expected shortfall, also called conditional VaR:
          $\operatorname{ES}_{\alpha} = \mathbb{E}[L \mid L \ge
          \operatorname{VaR}_{\alpha}]$, the mean loss given that the VaR is
          reached. Equivalently it is the average of $\operatorname{VaR}_{u}$
          over $u \in (\alpha, 1)$: the average of every quantile further out.
          For A, $\operatorname{ES}_{0.9} = 4.5$.
      - ask: >
          What is $\operatorname{ES}_{0.9}$ of book B, in millions?
        expects: "22"
        hint: >
          Given $L \ge 4$, the loss is uniform on $[4, 40]$.
        feedback: >
          The mean of a uniform on $[4, 40]$ is $(4 + 40)/2 = 22$. Same VaR,
          ES of $4.5$ against $22$: the tail's size is now in the number.
      - ask: >
          A third book loses $10$ million with probability $0.03$ and nothing
          otherwise. What is its honest $95\%$ expected shortfall, the average
          loss over the worst $5\%$ of outcomes?
        choices:
          - text: >
              $0.3$: here $\operatorname{VaR}_{0.95} = 0$, and
              $\mathbb{E}[L \mid L \ge 0]$ averages every outcome.
            feedback: >
              The arithmetic is right, and that is the trap. With an atom at
              the VaR, the conditional form sweeps in the $97\%$ of zero-loss
              outcomes and dilutes the tail into the mean.
          - text: >
              $10$: every loss in the tail is $10$.
            feedback: >
              The worst $5\%$ is $3\%$ at $10$ and another $2\%$ at $0$. The
              tail has to hold exactly $5\%$ of the mass, so some of the zero
              outcomes are in it.
          - text: >
              $6$: the worst $5\%$ is $3\%$ at $10$ and $2\%$ at $0$.
            correct: true
            feedback: >
              $(0.03 \times 10 + 0.02 \times 0)/0.05 = 6$. That is the average
              of $\operatorname{VaR}_{u}$ over $u \in (0.95, 1)$: $10$ for
              $u > 0.97$, $0$ below.
        feedback: >
          When the loss law has atoms, use the quantile-average form. It
          always takes exactly a $1 - \alpha$ slice of the worst outcomes.

      - part: Merging two bonds, measured by ES
        ask: >
          A catastrophe bond loses $30$ million with probability $0.006$ and
          nothing otherwise, so its $99\%$ VaR is $0$. What is its
          $\operatorname{ES}_{0.99}$, in millions?
        expects: "18"
        hint: >
          The worst $1\%$ is $0.6\%$ at $30$ and $0.4\%$ at $0$.
        feedback: >
          $(0.006 \times 30)/0.01 = 18$. Its VaR was $0$; its ES charges for
          the loss sitting past the quantile.
      - ask: >
          Now hold two independent bonds of this kind. The book loses $60$
          with probability $0.000036$ and $30$ with probability $0.011928$,
          so its $99\%$ VaR jumps to $30$. What is its
          $\operatorname{ES}_{0.99}$, to two decimals?
        expects: "30.11"
        tolerance: 0.005
        hint: >
          Fill the worst $1\%$: all of the $60$ outcomes first, then $30$s
          until the slice holds $0.01$.
        feedback: >
          The slice is $0.000036$ at $60$ and $0.009964$ at $30$:
          $(0.00216 + 0.29892)/0.01 = 30.108$. Against $18 + 18 = 36$ for the
          bonds held apart, merging lowered the measured risk. VaR went
          $0 + 0 \to 30$; ES goes $36 \to 30.11$.
      - ask: >
          Why can averaging a tail not manufacture risk the way a quantile
          did?
        choices:
          - text: >
              Because ES is always larger than VaR.
            feedback: >
              True, and beside the point: a measure can be large and still
              fail subadditivity. Doubling VaR would be larger and fail just
              the same.
          - text: >
              Because the worst $1\%$ of the merged book can do no worse than
              the worst $1\%$ of each part, averaged and added.
            correct: true
            feedback: >
              On the merged book's worst slice, each bond's average loss is
              at most that bond's own worst-slice average. Adding gives
              $\operatorname{ES}(A + B) \le \operatorname{ES}(A) +
              \operatorname{ES}(B)$. A quantile is one point, not an average,
              and has no such bound.
          - text: >
              Because the bonds are independent.
            feedback: >
              Independence is what made VaR fail. ES is subadditive for any
              dependence at all.
        feedback: >
          ES repairs both VaR defects at once: it sees the size of tail
          losses, and it is subadditive.

      - part: The normal case, and what Basel did
        ask: >
          A book's daily loss is normal with mean $0$ and $\sigma = 1.5\%$.
          For a zero-mean normal, $\operatorname{ES}_{\alpha} =
          \sigma\varphi(z_{\alpha})/(1 - \alpha)$. With $\varphi(2.326)
          \approx 0.0267$, what is $\operatorname{ES}_{0.99}$, as a percentage
          of book, to two decimals?
        expects: "4.00"
        tolerance: 0.01
        feedback: >
          $1.5\% \times 0.0267/0.01 \approx 4.00\%$, against a $99\%$ VaR of
          $2.326 \times 1.5\% = 3.49\%$. Under normality ES sits about $15\%$
          above VaR at the same level.
      - ask: >
          Basel replaced $99\%$ VaR with $97.5\%$ ES for market-risk capital.
          Under normality $\operatorname{ES}_{0.975} \approx 2.34\sigma$ and
          $\operatorname{VaR}_{0.99} \approx 2.33\sigma$. What did the switch
          do?
        choices:
          - text: >
              Cut capital, since $97.5\%$ is a lower confidence level.
            feedback: >
              A lower level for an average is not a lower bar: averaging the
              worst $2.5\%$ lands at $2.34\sigma$, level with the old $99\%$
              quantile.
          - text: >
              Left a normal book's capital almost unchanged, and raised it for
              a fat-tailed book.
            correct: true
            feedback: >
              Calibrated to agree when the tail is normal, the ES charges
              more whenever the tail is heavier, which is exactly where VaR
              was silent.
          - text: >
              Raised every book's capital by about $15\%$.
            feedback: >
              That compares ES and VaR at the same level. Basel changed the
              level too, and the two changes nearly cancel for a normal tail.
        feedback: >
          "What would you replace VaR with" has one answer and two reasons:
          expected shortfall, because it sees tail size and is subadditive.

  - node: quant-finance.risk.coherence
    hook: >
      "List the properties a sane risk measure should have" is a real
      question, and the sharp answer names exactly one axiom VaR fails —
      not a vague "it has some issues."
    explanation: >
      A measure $\rho$ on losses is coherent when it satisfies four axioms,
      each with a plain reading. Monotonicity: if $L_1 \le L_2$ in every
      outcome, $\rho(L_1)\le \rho(L_2)$ — a position that's never worse
      can't be rated riskier. Translation invariance: $\rho(L+c)=\rho(L)+c$
      — holding an extra $c$ in cash reduces measured risk by exactly $c$.
      Positive homogeneity: $\rho(\lambda L)=\lambda\rho(L)$ for $\lambda
      \ge 0$ — doubling a position doubles its risk number. Subadditivity
      is the fourth.

      Value at risk satisfies the first three without exception and fails
      only subadditivity — the exact property broken in VaR is not
      subadditive. Expected shortfall satisfies all four, which is the
      formal statement behind why it repairs VaR's flaw.

      Two caveats keep coherence from being the whole story. Positive
      homogeneity treats doubling a position as exactly doubling its risk,
      but unwinding twice the size typically costs more than twice as much,
      so the axiom quietly ignores liquidity. And expected shortfall is not
      elicitable — there's no scoring rule for which it's the unique
      minimizer — a property VaR does have, which keeps comparing and
      backtesting the two from being one-sided.
    worked: >
      Suppose $\operatorname{VaR}_{0.95}(L)=10$. Reducing the loss by
      holding $3$ extra units of cash gives $L'=L-3$, and translation
      invariance predicts $\operatorname{VaR}_{0.95}(L')=10-3=7$ — exactly
      what recomputing the quantile of the shifted distribution gives.
      Doubling the position instead, so every outcome of $L$ doubles to
      $2L$, gives $\operatorname{VaR}_{0.95}(2L)=2\times 10=20$ by positive
      homogeneity — again exact, because scaling every outcome by $2$
      scales the quantile by $2$.
    interview: >
      "What axioms should a risk measure satisfy, and does VaR satisfy
      them" wants all four named plainly and a precise answer on VaR —
      three yes, subadditivity no — rather than a hedge like "VaR has some
      known problems."
    pitfalls: >
      Claiming VaR fails every axiom, rather than exactly one, overstates
      the case and is easy to catch. Treating coherence as a complete seal
      of approval ignores that positive homogeneity assumes a position can
      be unwound at a fixed price regardless of size, which is false beyond
      modest scale.
    recap: >
      Coherence is four axioms — monotonicity, translation invariance,
      positive homogeneity, subadditivity; VaR satisfies the first three
      and fails only the fourth, expected shortfall satisfies all four.
    dialogue:
      - part: A capital rule that ignores cash
        teach: >
          A risk committee proposes a simple rule: every desk holds capital
          equal to the standard deviation of its one-day loss. Desk A's loss
          has a standard deviation of $8$ million. Desk A then sets aside $5$
          million of cash it can draw on, so its loss in every outcome is
          exactly $5$ million smaller than before.
      - ask: >
          Under the committee's rule, how much capital does desk A hold after
          setting the cash aside, in millions?
        expects: "8"
        hint: >
          What does subtracting a constant do to a standard deviation?
        feedback: >
          $\operatorname{sd}(L - 5) = \operatorname{sd}(L) = 8$. The rule does
          not notice $5$ million of cash.
      - ask: >
          A sensible rule would credit the cash in full. If the old capital was
          $8$ million, what should the new figure be?
        expects: "3"
        feedback: >
          Every outcome is $5$ million better, so the capital needed falls by
          exactly $5$: $8 - 5 = 3$. Cash is the one asset whose risk you know
          perfectly.
      - ask: >
          Book X loses $2$ or $4$ million with equal probability. Book Y loses
          $10$ million for certain. The rule gives X a capital of $1$ and Y a
          capital of $0$. What is wrong?
        choices:
          - text: >
              Nothing: Y is certain, so it carries no risk.
            feedback: >
              Y has no uncertainty, but it loses $10$ million every time,
              more than X loses in any outcome. Capital exists to absorb
              losses, and Y's are the larger.
          - text: >
              Y loses more than X in every outcome, yet is rated safer.
            correct: true
            feedback: >
              A book that is worse in every state of the world should never
              need less capital. The standard deviation measures spread, not
              loss, and gets the order backwards.
          - text: >
              The figures are fine, but should be doubled for safety.
            feedback: >
              Doubling keeps Y at $0$. The ranking is the problem, and no
              scale factor fixes a ranking.
        feedback: >
          Two failures from one candidate: it ignores cash, and it can rate a
          pointwise-worse book as less risky.
      - reflect: >
          You have now caught the standard deviation breaking two rules, and
          you met a third earlier, when VaR punished diversification. Write
          down the rules you were checking, as plainly as you can, and add
          any other you would want.
        answer: >
          A book that loses more in every outcome must not be rated less risky.
          Adding cash $c$ must lower the number by exactly $c$. Merging two
          books must not produce a number above the sum of their numbers. The
          natural fourth is scale: doubling every position should double the
          number, neither more nor less. Those four, stated as equations, are
          the coherence axioms.

      - part: Four rules, stated
        teach: >
          A measure $\rho$ on losses is coherent when it is monotone
          ($L_1 \le L_2$ in every outcome forces $\rho(L_1) \le \rho(L_2)$),
          translation invariant ($\rho(L + c) = \rho(L) + c$, so cash $c$
          lowers it by $c$), positively homogeneous ($\rho(\lambda L) =
          \lambda\rho(L)$ for $\lambda \ge 0$), and subadditive
          ($\rho(A + B) \le \rho(A) + \rho(B)$).
      - ask: >
          A book's $95\%$ VaR is $6$ million. Every position is scaled up by a
          factor of $2.5$, so each outcome's loss is $2.5$ times what it was.
          What is the new $95\%$ VaR, in millions?
        expects: "15"
        hint: >
          If $\Pr(L \le 6) \ge 0.95$, what can you say about
          $\Pr(2.5L \le 15)$?
        feedback: >
          $\Pr(2.5L \le 2.5x) = \Pr(L \le x)$, so every quantile scales by
          $2.5$: $2.5 \times 6 = 15$. Quantiles are positively homogeneous,
          and a shift by cash shifts every quantile by the cash, so VaR
          passes three axioms and fails only subadditivity. Expected
          shortfall passes all four.
      - ask: >
          Another candidate is $\rho(L) = \mathbb{E}[L] + 2\operatorname{sd}(L)$.
          Book P loses $0$ or $10$ million with equal probability. What is
          $\rho(P)$, in millions?
        expects: "15"
        hint: >
          The mean is $5$; each outcome sits $5$ from it.
        feedback: >
          $\mathbb{E}[P] = 5$ and $\operatorname{sd}(P) = 5$, so
          $\rho(P) = 5 + 10 = 15$.
      - ask: >
          Book Q loses $10$ million for certain, so $\rho(Q) = 10$. P never
          loses more than Q. Which axiom does mean-plus-two-sd break?
        choices:
          - text: >
              Translation invariance.
            feedback: >
              Adding cash $c$ lowers the mean by $c$ and leaves the
              standard deviation alone, so $\rho$ falls by exactly $c$. That
              axiom holds.
          - text: >
              Monotonicity, and only monotonicity.
            correct: true
            feedback: >
              $P \le Q$ in every outcome, yet $\rho(P) = 15 > 10 = \rho(Q)$.
              The other three hold: the mean shifts with cash, both terms
              scale with $\lambda$, and both the mean and the standard
              deviation are subadditive.
          - text: >
              Subadditivity.
            feedback: >
              The mean adds exactly and $\operatorname{sd}(A + B) \le
              \operatorname{sd}(A) + \operatorname{sd}(B)$, so the sum is
              subadditive. The failure is elsewhere.
        feedback: >
          Each axiom is a separate check. A measure can pass three and still
          rank a pointwise-better book as riskier.

      - part: What coherence leaves out
        ask: >
          The worst-case loss, $\rho(L) = \max L$, satisfies all four axioms.
          What is the problem with using it to set limits?
        choices:
          - text: >
              It is not subadditive.
            feedback: >
              The worst loss of $A + B$ is at most the worst of $A$ plus the
              worst of $B$. It is subadditive.
          - text: >
              For any book with an unbounded loss, a normal one or a short
              option, it is infinite.
            correct: true
            feedback: >
              Coherent and useless: every book with an unbounded loss is rated
              the same, and no limit can be set. Coherence rules out bad
              measures; it does not pick a good one.
          - text: >
              It fails translation invariance.
            feedback: >
              $\max(L + c) = \max L + c$, exactly. Cash moves the worst case by
              its own amount.
        feedback: >
          The axioms are a filter, not a recipe. ES passes the filter and
          stays finite for any loss with a finite mean.
      - ask: >
          A desk can unwind $2$ million of a thinly traded bond at a cost of
          $0.2\%$. It now holds $40$ million of the same bond. What does
          positive homogeneity assume about the cost of unwinding it?
        choices:
          - text: >
              That it is still $0.2\%$ of the position, twenty times the
              cost in money.
            correct: true
            feedback: >
              Homogeneity says the risk of $20$ copies is $20$ times the risk
              of one. In a thin market, selling twenty times the size moves
              the price against you, so the true cost per unit is larger.
              The axiom ignores liquidity.
          - text: >
              Nothing: homogeneity concerns losses, not trading costs.
            feedback: >
              The loss you take on an exit includes the cost of the exit.
              Scaling the loss linearly is exactly assuming that cost is
              linear in size.
          - text: >
              That the cost per unit falls, since large trades get better
              prices.
            feedback: >
              Large blocks can earn a commission discount, but the market
              impact of dumping a large position in a thin market dominates.
              And homogeneity assumes a constant cost per unit, not a falling
              one.
        feedback: >
          Name both caveats in an interview: homogeneity ignores liquidity, and
          ES, unlike VaR, is not elicitable, so no scoring rule singles it out,
          which makes it awkward to backtest.

  - node: quant-finance.risk.fat-tails
    hook: >
      "Why not just use normal VaR" is the standard follow-up the moment
      you finish computing $z_\alpha\sigma$, and the answer needs an actual
      number for how wrong normal is, not just the word "fat-tailed."
    explanation: >
      Daily equity returns routinely show excess kurtosis of $3$ to $10$
      against the normal distribution's $0$ — recall that excess kurtosis
      measures how much of the variance comes from a few large moves rather
      than many small ones. Plugging a normal quantile into the VaR formula
      assumes essentially none of that concentration exists, so it
      understates precisely the losses a risk desk is trying to size for.

      The mismatch is easiest to see as a frequency. Under normality,
      $\Pr(Z<-4)\approx 3.17\times 10^{-5}$, so a $4$-sigma-or-worse day
      should appear roughly once every $31{,}575$ trading days — about
      $125$ years at $252$ trading days a year. Liquid equity indices
      realize moves of that size far more often than once a century, which
      is the entire content of "fat tails" stated as a frequency rather
      than a shape.

      Three consequences follow. Normal-based $99\%$ VaR is materially too
      small, and the gap widens as $\alpha\to 1$, since the normal tail
      thins exponentially while the true tail thins much more slowly. The
      distance between expected shortfall and VaR is correspondingly larger
      than the modest gap normality predicts at matched confidence. And the
      effect is worst at short horizons — aggregating returns over a month
      washes out much of the extreme concentration, so monthly return
      distributions look closer to normal than daily ones do.
    worked: >
      Model the same $\sigma=2\%$ daily loss with a variance-matched
      Student $t$ with $5$ degrees of freedom instead of normal. The raw
      $99\%$ quantile of a standard $t_5$ is $3.365$, but matching its
      variance to $1$ requires scaling by $\sqrt{(5-2)/5}\approx 0.775$,
      giving an effective $99\%$ multiplier of $3.365\times 0.775\approx
      2.61$ — about $12\%$ above the normal's $2.326$. On the $40$ million
      book from earlier, that turns a normal $99\%$ VaR of $1.86$ million
      into roughly $2.09$ million once the fat tail is modeled honestly.
    interview: >
      "Why would you not just trust the normal $99\%$ VaR number" wants the
      kurtosis fact and a magnitude, not just the word "fat-tailed" —
      naming that the gap widens as $\alpha\to1$ and shrinks on aggregation
      shows you understand the mechanism, not just the vocabulary.
    pitfalls: >
      Assuming the normal assumption is "close enough" at $99\%$ ignores
      that the understatement gets worse, not better, at higher confidence.
      Assuming a fat-tailed daily model must be used at every horizon
      forgets that aggregation thins tails — a monthly VaR built from
      monthly returns doesn't need the same correction a daily one does.
    recap: >
      Daily returns carry excess kurtosis of roughly $3$ to $10$, so normal
      VaR understates the tail, with the error widening at higher $\alpha$
      and shrinking under aggregation to longer horizons.
    dialogue:
      - part: Counting the bad days
        teach: >
          You have $10{,}000$ trading days of an equity index, about forty
          years. Its daily standard deviation is steady at about $1\%$. You
          count the days on which it fell by more than three standard
          deviations, and find $40$ of them.
      - ask: >
          If daily returns were normal, how many days beyond $3\sigma$ on the
          downside would you expect? Use $\Pr(Z < -3) \approx 0.00135$, and
          give one decimal.
        expects: "13.5"
        tolerance: 0.05
        feedback: >
          $10{,}000 \times 0.00135 = 13.5$. The record has $40$, about three
          times as many.
      - ask: >
          The same record contains three days beyond $6\sigma$. Under
          normality $\Pr(Z < -6) \approx 10^{-9}$. How long should you expect
          to wait for one such day, at $252$ trading days a year?
        choices:
          - text: >
              About a decade.
            feedback: >
              A decade is about $2{,}500$ days, and $2{,}500 \times 10^{-9}$
              is a few in a million. The normal says you would almost
              certainly see none.
          - text: >
              About four million years.
            correct: true
            feedback: >
              $1/(10^{-9} \times 252) \approx 4 \times 10^{6}$ years. The index
              produced three in forty.
          - text: >
              About a thousand years.
            feedback: >
              That is roughly the wait for a $4.5\sigma$ day under the normal.
              Every extra standard deviation multiplies the wait enormously,
              because the normal density falls like $e^{-x^{2}/2}$.
        feedback: >
          At $3\sigma$ the normal is off by a factor of three; at $6\sigma$ it
          is off by a factor of millions.
      - ask: >
          What does the pattern say about a normal model's error as you move
          further into the tail?
        choices:
          - text: >
              It is a constant factor, about three, at every depth.
            feedback: >
              Three at $3\sigma$, millions at $6\sigma$. The error is anything
              but constant.
          - text: >
              It grows: the deeper the quantile, the worse the normal
              understates.
            correct: true
            feedback: >
              The real tail thins far more slowly than the normal's. A $99\%$
              VaR is somewhat too small; a $99.9\%$ VaR is much too small.
          - text: >
              It shrinks, since extreme days are too rare to matter.
            feedback: >
              Rare is the point of a tail measure. A $99.9\%$ VaR is built to
              describe exactly those days.
        feedback: >
          The error is not a fixed fudge factor; it widens as $\alpha \to 1$.
      - reflect: >
          The volatility was measured correctly, and still the normal
          under-called the tail. If two distributions share a variance but one
          has far more mass beyond $3\sigma$, where must it have less, and
          what does the variance fail to tell you?
        hint: >
          Think about which statistic counts how much of the variance comes
          from a few huge observations.
        answer: >
          Its extra tail mass is paid for with a taller, narrower middle and
          thinner shoulders: most days are quieter than normal, a few are
          enormous. The variance is one number and cannot tell those shapes
          apart; the kurtosis can. The normal quantile $z_{\alpha}$ is a claim
          about shape, so a correct $\sigma$ plugged into the wrong shape
          gives the wrong VaR.

      - part: How wrong, in numbers
        teach: >
          Daily equity returns carry excess kurtosis of roughly $3$ to $10$,
          against the normal's $0$, and a Student $t$ with $4$ to $6$ degrees
          of freedom fits them far better. Normal VaR understates the far
          tail, and the error widens with $\alpha$. To compare like with like,
          a $t_{\nu}$ is scaled by $\sqrt{(\nu - 2)/\nu}$ so its variance is
          $1$.
      - ask: >
          A $t_4$ has raw $99\%$ quantile $3.747$, and its variance-matching
          factor is $\sqrt{2/4} \approx 0.7071$. What is the effective $99\%$
          multiplier, to two decimals?
        expects: "2.65"
        tolerance: 0.005
        feedback: >
          $3.747 \times 0.7071 \approx 2.65$, against the normal's $2.326$:
          the normal VaR is about $12\%$ too small at $99\%$.
      - ask: >
          At $99.9\%$ the raw $t_4$ quantile is $7.173$. What is the effective
          multiplier, to two decimals?
        expects: "5.07"
        tolerance: 0.01
        feedback: >
          $7.173 \times 0.7071 \approx 5.07$, against the normal's $3.090$.
          The normal now falls about $39\%$ short, against $12\%$ at the
          $99\%$ level: the shortfall tripled in one step of confidence.
      - ask: >
          At $95\%$ the raw $t_4$ quantile is $2.132$, so the effective
          multiplier is $2.132 \times 0.7071 \approx 1.51$. The normal's is
          $1.645$. What does that say?
        choices:
          - text: >
              The computation must be wrong: fat tails make every quantile
              larger.
            feedback: >
              The arithmetic is right. With the variance held fixed, a fat
              tail is paid for by quieter shoulders, and $95\%$ sits in the
              shoulder.
          - text: >
              At $95\%$ the normal is actually the more conservative of the
              two.
            correct: true
            feedback: >
              Exactly the trade the reflection described. The quantiles
              cross somewhere between $95\%$ and $99\%$; beyond that the
              normal understates, and more so the deeper you go.
          - text: >
              The $t_4$ is a poor fit, so its $95\%$ figure can be ignored.
            feedback: >
              The tail and the shoulder come from one shape; you cannot keep
              the $t_4$ where it suits you and discard it elsewhere. A normal
              can look fine at $95\%$ and still be badly wrong at $99.9\%$.
        feedback: >
          Never argue "fat tails" from a $95\%$ number. The damage is at the
          high confidence levels a risk desk actually reports.

      - part: Where the error grows and where it fades
        ask: >
          The normal model's $99\%$ VaR is $12\%$ too small for this book.
          What about its $99\%$ expected shortfall?
        choices:
          - text: >
              Also about $12\%$ too small, since ES is built from VaR.
            feedback: >
              ES averages every quantile beyond $99\%$, including the $99.9\%$
              one, where the normal was $39\%$ short. The average inherits the
              deeper errors.
          - text: >
              More than $12\%$ too small: ES averages quantiles that are
              further out, where the normal is further off.
            correct: true
            feedback: >
              Under the normal the ES-to-VaR gap at $99\%$ is the modest
              $2.67$ against $2.33$. Under a fat tail it is far wider, so the
              normal understates ES even more than VaR.
          - text: >
              About right, because averaging cancels errors.
            feedback: >
              Every quantile in the average is too small, so there is nothing
              to cancel. All the errors point the same way.
        feedback: >
          The further a measure reaches into the tail, the more the normal
          shape costs it.
      - ask: >
          A month is about $21$ trading days. If daily returns are independent
          with excess kurtosis $6$, roughly what is the excess kurtosis of a
          monthly return?
        choices:
          - text: >
              About $6$, the same as daily.
            feedback: >
              Summing independent returns dilutes the rare huge day among many
              ordinary ones. For independent, identical terms excess kurtosis
              divides by the number of terms.
          - text: >
              About $126$, since $21$ days of fat tails pile up.
            feedback: >
              Variances add, but the fourth-moment excess grows only like $n$
              while the squared variance grows like $n^{2}$. The ratio falls.
          - text: >
              About $0.3$.
            correct: true
            feedback: >
              $6/21 \approx 0.29$. A sum of many independent terms drifts
              toward the normal, so monthly returns look far more normal than
              daily ones.
        feedback: >
          Aggregation thins tails. The normal model hurts most at short
          horizons and high confidence: one-day $99.9\%$ is its worst case.

  - node: quant-finance.risk.var-estimation
    hook: >
      "Walk me through how you'd actually compute a $99\%$ VaR" is a
      technique question with three named routes, and the strongest answers
      volunteer the sample-size problem before being asked.
    explanation: >
      Three standard routes compute the same number differently. Parametric
      (variance–covariance) VaR estimates a covariance matrix $\Sigma$ and
      reports $z_{\alpha}\sqrt{w'\Sigma w}$ for portfolio weights $w$ —
      essentially instant, but it inherits the normal assumption's
      understated tail and is blind to option convexity. Historical
      simulation revalues today's book on each of the last several hundred
      days' actual market moves, sorts the resulting P&L, and reads off the
      appropriate rank — no distributional assumption is needed, but no
      loss larger than the single worst historical day can ever appear.
      Monte Carlo simulates the book under a chosen stochastic model —
      flexible, but it merely relocates the distributional assumption into
      the simulation engine.

      Underneath all three sits the same binding constraint: data. A $99\%$
      quantile estimated from a year of $250$ trading days rests on roughly
      $2.5$ observations in the relevant tail, and expected shortfall,
      which averages an even smaller slice, rests on fewer still.

      Three fixes address different pieces of this. Fitting a parametric
      tail, such as a Student $t$, borrows shape from theory rather than
      the sample. Extreme value theory models threshold exceedances
      directly rather than the whole distribution. Exponentially weighting
      recent observations lets the estimate react to a changing volatility
      regime instead of averaging blindly over a fixed window.
    worked: >
      With $300$ days of historical P&L and a $99\%$ confidence level, the
      historical-simulation VaR is read off at rank $300\times 0.01=3$ —
      the third worst day in the sample. Only three observations out of
      three hundred determine the reported number: replacing the
      third-worst day with a slightly larger or smaller loss moves the
      whole VaR figure, while the other $297$ days have no direct influence
      on it at all.
    interview: >
      "Which method would you use, and why" wants all three named with
      their specific failure mode — parametric misses convexity and tail
      shape, historical is capped by its own worst day, Monte Carlo just
      moves the assumption — and a strong close names the sample-size
      problem unprompted.
    pitfalls: >
      Trusting historical simulation to produce a worse loss than anything
      in the lookback window is a category error — by construction it
      cannot. Treating a parametric VaR on an options book as adequate
      ignores that $z_{\alpha}\sqrt{w'\Sigma w}$ is a linear approximation
      and misses the convexity that makes option P&L asymmetric.
    recap: >
      Parametric, historical, and Monte Carlo VaR trade different
      assumptions for different blind spots, but all three ultimately rest
      on a handful of tail observations — a $99\%$ quantile from a year of
      data is about $2.5$ data points.
    dialogue:
      - part: Reading a quantile off history
        teach: >
          You must report tomorrow's $99\%$ one-day VaR for a book. You take
          the last $1{,}000$ days of market moves, apply each one to today's
          positions, and get $1{,}000$ hypothetical one-day losses. No model,
          no distribution: just the sorted list.
      - ask: >
          Counting from the worst, at which rank do you read the $99\%$ VaR?
        expects: "10"
        hint: >
          What fraction of the sample may lie beyond it?
        feedback: >
          $1{,}000 \times 0.01 = 10$: the tenth-worst loss. Ten days of the
          thousand are at or beyond it.
      - ask: >
          The ten worst losses, in millions, are $31, 22, 18, 15, 14, 13, 12,
          12, 11, 10$. What is the historical $99\%$ expected shortfall?
        expects: "15.8"
        tolerance: 0.001
        hint: >
          Average the ten.
        feedback: >
          The ten sum to $158$, so the ES is $15.8$ against a VaR of $10$.
          Nearly half of that total comes from the three worst days.
      - ask: >
          Tomorrow's market could plausibly fall twice as far as on the worst
          day in the window. What can this method report about that?
        choices:
          - text: >
              It scales the worst day up, so it reports about $62$.
            feedback: >
              Nothing in the method scales anything. It sorts the $1{,}000$
              losses it has; a loss of $62$ is not among them.
          - text: >
              Nothing: no loss larger than $31$ can ever appear in its output.
            correct: true
            feedback: >
              The sample is the whole universe. The tail is only as rich as
              the window, and anything worse than the worst day observed has
              probability zero by construction.
          - text: >
              It shows up as a higher VaR once enough days pass.
            feedback: >
              Only if such a day actually happens and enters the window. Until
              then the method cannot imagine it.
        feedback: >
          Historical simulation assumes no distribution, and pays for that
          with a hard cap at the worst day it has seen.
      - reflect: >
          To produce a loss beyond anything in the window, what would you have
          to add to the method? Name two ways to do it.
        answer: >
          You have to supply a distribution the data alone cannot. Either
          assume a form and fit its parameters, say a normal with an estimated
          covariance, and read the quantile off the formula; or write down a
          model of how prices move and simulate many more paths than history
          provides. Both reach past the worst day only because you told them
          what lies there.

      - part: The parametric shortcut
        teach: >
          The three routes are historical simulation, parametric VaR and Monte
          Carlo. Parametric VaR, also called variance–covariance, estimates
          the covariance matrix $\Sigma$ of the risk factors and reports
          $z_{\alpha}\sqrt{w'\Sigma w}$ for position vector $w$. Monte Carlo
          simulates the book under a chosen model, which relocates the
          assumption rather than removing it.
      - ask: >
          A book holds $60$ million of asset A, daily volatility $2\%$, and
          $40$ million of asset B, daily volatility $3\%$, with correlation
          $0.5$. What is the book's daily standard deviation, in millions, to
          two decimals?
        expects: "2.08"
        tolerance: 0.005
        hint: >
          Each leg's standard deviation is $1.2$ million. Add the variances
          and the cross term.
        feedback: >
          $60 \times 2\% = 1.2$ and $40 \times 3\% = 1.2$. The variance is
          $1.44 + 1.44 + 2(0.5)(1.2)(1.2) = 4.32$, so the standard deviation
          is $\sqrt{4.32} \approx 2.08$ million.
      - ask: >
          What is the parametric $99\%$ one-day VaR, in millions, to two
          decimals?
        expects: "4.83"
        tolerance: 0.01
        feedback: >
          $2.326 \times 2.078 \approx 4.83$ million. One matrix product and one
          multiplication: instant, which is why every desk can run it.
      - ask: >
          The desk adds a large short straddle on asset A. What does the
          parametric number miss?
        choices:
          - text: >
              Nothing, once the straddle's delta is included in $w$.
            feedback: >
              A straddle's delta is near zero, so it barely moves $w$, yet it
              loses badly on a big move either way. Delta is a linear summary
              of a nonlinear position.
          - text: >
              The convexity: a short straddle loses more and more as the move
              grows, which a linear $w'\Sigma w$ cannot represent.
            correct: true
            feedback: >
              Parametric VaR treats P&L as linear in the factor moves. A short
              option's loss curves away on large moves, exactly where the
              quantile lives.
          - text: >
              The correlation, which the straddle changes.
            feedback: >
              The correlation between A and B is a property of the markets,
              not of your positions. The problem is the shape of the
              straddle's payoff.
        feedback: >
          Parametric is wrong in the tail twice over: it assumes a normal
          shape, and it is blind to option convexity. Historical simulation
          revalues the straddle in full on each past move and catches the
          curve.

      - part: Too few days in the tail
        ask: >
          A desk has one year of history, $250$ days. How many observations
          lie beyond its historical $99\%$ VaR?
        expects: "2.5"
        feedback: >
          $250 \times 0.01 = 2.5$. The reported number rests on two or three
          days; move one of them and the VaR moves. ES averages that same
          tiny slice.
      - reflect: >
          Two or three days cannot pin down a tail. Without waiting ten years
          for more data, how could you get a steadier $99\%$ estimate from
          that one year?
        hint: >
          The body of the distribution has hundreds of points. Can it inform
          the tail?
        answer: >
          Borrow shape from theory: fit a distribution with a realistic tail,
          such as a Student $t$, to all $250$ days and read its quantile. Or
          model only the exceedances over a high threshold, which is what
          extreme value theory does, using the twenty or so largest losses
          rather than the two or three beyond the quantile. And weight recent
          days more heavily so the estimate tracks the current volatility
          rather than averaging over a regime that has passed.
      - ask: >
          An interviewer asks which method you would use for a book that is
          mostly vanilla equity with some short options. Which answer is the
          strongest?
        choices:
          - text: >
              Parametric: it is the fastest and the industry standard.
            feedback: >
              Fast, and wrong exactly where the short options live. Naming
              speed without naming convexity is the answer the question was
              built to catch.
          - text: >
              Historical simulation with full revaluation, plus a fitted tail
              or a stress scenario, because the window caps the worst loss.
            correct: true
            feedback: >
              Full revaluation catches the convexity, and the fitted tail or
              stress test covers the cap. Naming the sample-size problem
              unprompted is the strong close.
          - text: >
              Monte Carlo, since simulation removes the modelling assumption.
            feedback: >
              Simulation runs whatever model you give it. The assumption has
              moved into the engine, not disappeared.
        feedback: >
          Each route trades a different assumption for a different blind spot,
          and all three are starved for tail data.

  - node: quant-finance.risk.backtesting
    hook: >
      "How do you know your VaR model is any good" has a precise
      quantitative answer — count exceptions and run a binomial test — not
      a vague appeal to "monitoring."
    explanation: >
      Backtesting a VaR model means counting exceptions — the days on which
      the realized loss exceeded the VaR number reported that morning. At
      $99\%$ confidence over a year of $250$ trading days, the model
      predicts $250\times 0.01=2.5$ exceptions on average, and under the
      null hypothesis that the model is correctly calibrated, the actual
      count is binomial with $n=250$ and $p=0.01$.

      Basel's traffic-light framework turns this into a concrete rule: $5$
      to $9$ exceptions in a year trigger a capital penalty, and $10$ or
      more rejects the model outright, because that count has probability
      well under $1\%$ under a correctly calibrated model.

      Two distinct failure modes hide behind the same word "backtest." Too
      many exceptions means the model is systematically too tight. Clustered
      exceptions — several breaches bunched in the same stretch of weeks
      rather than spread evenly across the year — mean something different:
      the count can be entirely correct on average while the independence
      assumption behind the binomial test is false, because volatility
      clustering delivers breaches in bursts even when the unconditional
      rate matches the model exactly. Catching that second failure needs an
      explicit independence test, not just a count.
    worked: >
      Over $500$ trading days at $99\%$, the expected exception count is
      $500\times 0.01=5$, with standard deviation $\sqrt{500\times
      0.01\times 0.99}=\sqrt{4.95}\approx 2.22$. Suppose $12$ exceptions
      were actually observed: $z=(12-5)/2.22\approx 3.15$, far out in the
      tail of the null distribution — this model would be rejected well
      before reaching Basel's $10$-exception red-zone threshold, since a
      count this far from the mean has probability under one in a thousand
      if the model were correctly calibrated.
    interview: >
      "How many exceptions would worry you over a year at $99\%$" wants the
      expected count of $2.5$ stated immediately, followed by naming both
      the frequency test and the independence check — an answer that only
      mentions counting misses half the question.
    pitfalls: >
      Judging a model purely on whether the exception count falls in
      Basel's green zone ignores clustering entirely — a model can pass the
      count test and still have failed badly during a specific crisis
      month. Running the count test over too short a window, say a single
      quarter, doesn't have enough exceptions under the null to say
      anything statistically meaningful either way.
    recap: >
      Backtesting counts exceptions against a binomial null — $2.5$
      expected per year at $99\%$ — and separately checks that breaches
      aren't clustered, since a correct average rate can still hide a
      broken independence assumption.
    dialogue:
      - part: Nineteen breaches in two hundred days
        teach: >
          A risk model publishes a $95\%$ one-day VaR every morning. Over the
          last $200$ trading days, the realized loss beat that morning's
          figure on $19$ days. The head of risk wants to know whether the model
          is broken.
      - ask: >
          If the model is right, how many such days do you expect in $200$?
        expects: "10"
        feedback: >
          Each day is breached with probability $1 - 0.95 = 0.05$, so
          $200 \times 0.05 = 10$.
      - ask: >
          $19$ against an expected $10$. What can you conclude so far?
        choices:
          - text: >
              The model is broken: it was breached nearly twice as often as
              promised.
            feedback: >
              A fair coin tossed $20$ times shows $13$ or more heads about
              one time in eight. Before calling $19$ too many you need to know
              how much the count wanders when the model is right.
          - text: >
              Nothing: any count from $0$ to $200$ is possible, so no count
              can reject a model.
            feedback: >
              Possible is not plausible. Some counts are so unlikely under a
              correct model that seeing them is strong evidence against it.
          - text: >
              Nothing yet: you need to know how far a correct model's count
              typically strays from $10$.
            correct: true
            feedback: >
              The comparison needs a yardstick, the spread of the count when
              the model is right.
        feedback: >
          A raw count only means something against its distribution under the
          null.
      - reflect: >
          Suppose the model is correct. Describe the distribution of the
          number of breached days in $200$, and say what you would assume to
          get it.
        hint: >
          Each day either breaches or does not.
        answer: >
          Each day is a breach with probability $0.05$. If days are
          independent, the count is binomial with $n = 200$ and $p = 0.05$:
          mean $10$, variance $200(0.05)(0.95) = 9.5$. Compare $19$ with that
          spread. The independence assumption is doing real work, and it is
          the one most likely to fail.

      - part: Counting exceptions against a binomial
        teach: >
          This is VaR backtesting. An exception is a day whose loss beat the
          VaR reported that morning. Under the null of a correct model with
          independent days, the count is binomial with $n$ days and
          $p = 1 - \alpha$. Basel applies it to a $99\%$ VaR over $250$ days,
          where $2.5$ are expected: $5$ to $9$ exceptions cost a capital
          penalty and $10$ or more reject the model.
      - ask: >
          Back to the $95\%$ model over $200$ days. What is the standard
          deviation of the exception count under the null, to two decimals?
        expects: "3.08"
        tolerance: 0.005
        feedback: >
          $\sqrt{200 \times 0.05 \times 0.95} = \sqrt{9.5} \approx 3.08$.
      - ask: >
          How many standard deviations above its mean is $19$, to two
          decimals?
        expects: "2.92"
        tolerance: 0.01
        feedback: >
          $(19 - 10)/3.08 \approx 2.92$. On a normal approximation, a count
          this high or higher happens about $0.2\%$ of the time under a
          correct model.
      - ask: >
          What is the verdict?
        choices:
          - text: >
              Reject: the model is too tight, understating the loss level it
              is supposed to cover.
            correct: true
            feedback: >
              Too many exceptions means the VaR is set too low. A likely cause
              is a normal model under fat tails, or a volatility estimate that
              has not caught up.
          - text: >
              Reject: the model is too conservative.
            feedback: >
              A conservative model sets VaR too high and is breached too
              *rarely*. $19$ against $10$ is the opposite failure.
          - text: >
              Keep it: $19$ is within the range a correct model produces.
            feedback: >
              Within the range is $10 \pm$ about $6$, two standard deviations.
              $19$ sits near three, which a correct model produces about one
              time in five hundred.
        feedback: >
          The frequency test answers one question: is the breach rate right?
          A model can pass it and still be wrong.

      - part: When the count is not enough
        ask: >
          A second $95\%$ model also runs $200$ days and is breached exactly
          $10$ times, but $8$ of the $10$ fall in one three-week stretch.
          What has failed?
        choices:
          - text: >
              Nothing: the count is exactly as expected.
            feedback: >
              The count is fine. Under independence, eight exceptions in
              fifteen days, where fewer than one is expected, would be
              astonishing.
          - text: >
              The independence assumption: volatility rose, and the model was
              slow to follow it.
            correct: true
            feedback: >
              In a volatile stretch every day's true VaR is higher than the
              model's, so breaches arrive in bunches. The average rate can be
              right while the model is wrong exactly when it matters.
          - text: >
              The confidence level: it should have been $99\%$.
            feedback: >
              Changing the level changes the expected count, not the bunching.
              The defect is that the model ignored a regime change.
        feedback: >
          Too many exceptions and clustered exceptions are distinct failures.
          The second needs an independence test, not a count.
      - ask: >
          A $99\%$ model is backtested over one quarter, $63$ days, with zero
          exceptions. If the model is right, what is the probability of zero
          exceptions? Give two decimals.
        expects: "0.53"
        tolerance: 0.005
        hint: >
          Every one of the $63$ days must avoid a breach.
        feedback: >
          $0.99^{63} \approx 0.531$. A correct model shows a clean quarter more
          often than not, and a badly wrong one often does too. One quarter at
          $99\%$ carries almost no information.
      - ask: >
          Over $500$ days a $99\%$ model shows zero exceptions. Under the null,
          $\Pr(0) = 0.99^{500} \approx 0.0066$. What does that suggest?
        choices:
          - text: >
              The model is excellent: it was never wrong.
            feedback: >
              A $99\%$ VaR that is never breached is not accurate; it is set
              too high. A correct one is breached about five times in $500$
              days.
          - text: >
              Nothing, since zero exceptions cannot count against a model.
            feedback: >
              Zero has probability $0.0066$ under the null, as damning as a
              large count. The test is two-sided.
          - text: >
              The model is too conservative: it overstates the risk and ties
              up capital the desk could use.
            correct: true
            feedback: >
              Too few exceptions is a failure too. It just costs money
              instead of losing it.
        feedback: >
          In an interview: $2.5$ expected per year at $99\%$, a binomial test
          on the count in both directions, and a separate check that the
          breaches are not bunched.

  - node: quant-finance.risk.vol-scaling
    hook: >
      "Scale this one-day VaR to ten days" is asked as pure mental math, and
      the follow-up — what assumption makes multiplying by $\sqrt{10}$
      legitimate — is where the question actually lives.
    explanation: >
      Variance adds across independent increments: if a $T$-period change
      is the sum of $T$ one-period increments that are uncorrelated and
      share a common variance $\sigma^{2}$, then
      $\operatorname{Var}(\sum_{t=1}^{T} r_t) = T\sigma^{2}$, so the
      $T$-period standard deviation is $\sigma_T = \sigma\sqrt{T}$. Nothing
      about the shape of the distribution enters this derivation — it's a
      fact about second moments and uncorrelated increments, not about
      normality, so it survives even when the normal assumption itself is
      under attack.

      The same scaling drives the ratio between mean and risk. Expected P&L
      over $T$ periods grows linearly, $\mu T$, while the standard
      deviation grows only like $\sqrt{T}$, so the Sharpe ratio itself
      scales as $\sqrt{T}$ — this is why an edge too small to see against
      one day's noise becomes a large, statistically obvious number once
      measured over a year.

      Applied to VaR at fixed $\alpha$, $\operatorname{VaR}_{\alpha,T} =
      z_{\alpha}\sigma\sqrt{T}$, so a $10$-day VaR is $\sqrt{10}\approx
      3.16$ times the one-day figure — exactly the regulatory shortcut used
      to convert a desk's daily risk number into the ten-day figure capital
      rules actually require.
    worked: >
      A daily volatility of $\sigma=1.2\%$ scaled to a $21$-trading-day
      month gives $\sigma_{21}=1.2\%\times\sqrt{21}=1.2\%\times
      4.583\approx 5.50\%$. The $99\%$ VaR at that horizon is
      $2.326\times 5.50\%\approx 12.79\%$ of book value — about $4.6$ times
      the one-day figure of $2.79\%$ ($=2.326\times 1.2\%$), exactly the
      $\sqrt{21}\approx 4.58$ scaling factor at work.
    interview: >
      "Convert a one-day VaR to a ten-day VaR" wants $\sqrt{10}$ stated
      instantly, and a strong answer names the actual condition being used
      — uncorrelated increments with constant variance — rather than
      reflexively citing normality, since the rule needs neither.
    pitfalls: >
      Attributing the $\sqrt{T}$ rule to normality is a common but
      incorrect justification; it only needs uncorrelated increments with a
      common variance. Forgetting that the mean term scales linearly while
      risk scales as $\sqrt{T}$ leads to dropping the drift adjustment
      exactly where it starts to matter, at longer horizons.
    recap: >
      Volatility scales as $\sigma\sqrt{T}$ whenever increments are
      uncorrelated with equal variance — no normality required — so a
      ten-day VaR is $\sqrt{10}\approx 3.16$ times the one-day figure.
    dialogue:
      - part: Four days of noise
        teach: >
          A desk's daily P&L has mean $0$ and standard deviation $2$ million.
          Days are uncorrelated with one another and equally volatile. The
          risk committee wants the standard deviation of the desk's P&L over
          the next four days.
      - ask: >
          A colleague answers at once: "$8$ million, four days of $2$ million
          each." What do you say?
        choices:
          - text: >
              Right: four days, four times the risk.
            feedback: >
              That is what you would get if all four days always moved
              together, in the same direction by the same amount. Uncorrelated
              days partly cancel, so the total spread is smaller.
          - text: >
              Too small: four days compound, so the figure should exceed $8$.
            feedback: >
              Compounding matters for returns over long stretches, not for
              the spread of a four-day sum of uncorrelated P&L. And the
              cancellation between up days and down days pushes the other
              way.
          - text: >
              Too large: uncorrelated days partly offset one another.
            correct: true
            feedback: >
              A down day is as likely to be followed by an up day as by
              another down day, so the four-day total is less spread out than
              four times one day.
        feedback: >
          Standard deviations do not add. Find what does.
      - ask: >
          What is the variance of the four-day P&L, in squared millions?
        expects: "16"
        hint: >
          For uncorrelated terms the variance of a sum is the sum of the
          variances.
        feedback: >
          Each day's variance is $2^{2} = 4$, and with no covariance terms the
          four add: $4 \times 4 = 16$.
      - ask: >
          So what is the four-day standard deviation, in millions?
        expects: "4"
        feedback: >
          $\sqrt{16} = 4$ million: twice one day's figure, not four times.
      - reflect: >
          Generalize: over $T$ days with daily standard deviation $\sigma$,
          what is the standard deviation of the total, and exactly which facts
          about the days did your computation use?
        answer: >
          The variance is $T\sigma^{2}$, so the standard deviation is
          $\sigma\sqrt{T}$. The computation used two facts: the cross terms
          vanished because the days are uncorrelated, and every day
          contributed the same $\sigma^{2}$. It used nothing about the shape
          of the distribution, so normality never entered.

      - part: Square-root-of-time, put to work
        teach: >
          That is square-root-of-time scaling: $\sigma_T = \sigma\sqrt{T}$.
          For a normal VaR at fixed $\alpha$ it gives
          $\operatorname{VaR}_{\alpha,T} = z_{\alpha}\sigma\sqrt{T}$, so the
          $T$-day VaR is $\sqrt{T}$ times the one-day figure.
      - ask: >
          A stock's daily volatility is $0.8\%$. Using $252$ trading days and
          $\sqrt{252} \approx 15.87$, what is its annualized volatility, as a
          percentage to two decimals?
        expects: "12.70"
        tolerance: 0.01
        feedback: >
          $0.8\% \times 15.87 \approx 12.70\%$. Annualizing is the same rule
          with $T = 252$.
      - ask: >
          A book's $99\%$ one-day VaR is $5$ million, with normal,
          uncorrelated, equally volatile daily P&L. What is its $99\%$ VaR
          over $25$ days, in millions?
        expects: "25"
        feedback: >
          $5 \times \sqrt{25} = 25$ million. The $z_{0.99}$ stays put and only
          $\sigma$ scales.
      - ask: >
          A colleague says the $\sqrt{T}$ rule cannot be used on a book
          because its daily returns fail a normality test. Which reply is
          precise?
        choices:
          - text: >
              Agreed: the rule is a property of the normal distribution.
            feedback: >
              The derivation added variances and never looked at a shape.
              Fat-tailed returns that are uncorrelated with a common variance
              scale exactly as $\sqrt{T}$.
          - text: >
              Normality is irrelevant to the volatility; what matters is
              whether the days are uncorrelated with a common variance.
            correct: true
            feedback: >
              Those two facts make the cross terms vanish and the variances
              equal. Independent and identically distributed is the usual
              sufficient condition, and more than the rule needs. The test
              to run is for autocorrelation, not normality.
          - text: >
              It can be used once the mean is subtracted, since only a drift
              spoils it.
            feedback: >
              The mean shifts the total but not its spread. A drift changes
              the VaR, through the $\mu T$ term, not the volatility, and it
              has nothing to do with normality.
        feedback: >
          Naming the actual condition instead of reflexively citing normality
          is what an interviewer is listening for. One caveat: the VaR
          multiplier $z_{\alpha}$ is a statement about shape, so scaling a
          VaR, rather than a volatility, does lean on the shape staying put.

      - part: Edge grows faster than noise
        ask: >
          A strategy earns a mean of $0.04\%$ a day with daily volatility
          $1\%$, a daily Sharpe ratio of $0.04$. Over $252$ days the mean grows
          like $T$ and the volatility like $\sqrt{T}$. What is the annual
          Sharpe ratio, to two decimals?
        expects: "0.63"
        tolerance: 0.01
        hint: >
          The ratio of something growing like $T$ to something growing like
          $\sqrt{T}$ grows like $\sqrt{T}$.
        feedback: >
          $0.04 \times 15.87 \approx 0.63$: a mean of $10.1\%$ against a
          volatility of $15.9\%$. An edge invisible against one day's noise
          is a respectable annual number.
      - ask: >
          Which of these daily P&L series breaks the $\sqrt{T}$ rule for its
          volatility?
        choices:
          - text: >
              Fat-tailed, but independent from day to day with a steady
              variance.
            feedback: >
              Shape does not matter for adding variances. This series scales
              exactly as $\sqrt{T}$.
          - text: >
              A trend follower whose good days tend to follow good days.
            correct: true
            feedback: >
              Positive correlation between days adds positive cross terms, so
              the multi-day variance exceeds $T\sigma^{2}$ and $\sqrt{T}$
              understates the risk.
          - text: >
              A strategy with a large positive daily mean.
            feedback: >
              The mean scales with $T$ and the spread with $\sqrt{T}$,
              separately. A drift does not touch the volatility rule.
        feedback: >
          The rule lives or dies on the cross terms. Once days are correlated,
          or the variance itself shifts, $\sqrt{T}$ is only an approximation.

  - node: quant-finance.risk.scaling-failure
    hook: >
      "Does $\sqrt{T}$ scaling work for a trend-following book" is the
      sharpest possible follow-up to square-root-of-time scaling, and the
      honest answer requires the covariance term the naive rule drops.
    explanation: >
      For two periods, $\operatorname{Var}(r_1+r_2)=2\sigma^{2}(1+\rho)$
      where $\rho$ is the correlation between the two increments — the
      honest multiplier is $\sqrt{2}\sqrt{1+\rho}$, equal to the naive
      $\sqrt{2}$ only when $\rho=0$. More generally,
      $\operatorname{Var}(\sum_{t=1}^{T} r_t)=\sigma^{2}(T+2\sum_{k=1}^{
      T-1}(T-k)\rho_k)$ for autocorrelations $\rho_k$ at lag $k$ — the
      $\sqrt{T}$ rule is the special case where every $\rho_k$ vanishes.

      Two failure modes pull in opposite directions. Positive
      autocorrelation — the persistence in a trend-following strategy's
      P&L, or the artificial smoothness of an illiquid book whose marks lag
      real price moves — makes $\sqrt{T}$ understate true multi-period
      risk, and smoothed monthly marks feeding an annualized Sharpe ratio
      are the classic route to a number that flatters a strategy far more
      than its real risk deserves. Negative autocorrelation, typical of
      mean-reverting market-making P&L, makes $\sqrt{T}$ overstate risk
      instead.

      A third failure doesn't even need nonzero autocorrelation in returns
      themselves. Volatility clustering means the $\sigma$ measured in a
      calm month is not the $\sigma$ that will govern the next one, so even
      a rule applied with zero measured correlation can use the wrong input
      level entirely.
    worked: >
      At $\rho=0.2$, the honest two-day multiplier is $\sqrt{2(1.2)}=
      \sqrt{2.4}\approx 1.549$ against the naive $\sqrt{2}\approx 1.414$ —
      the naive rule understates two-day volatility by about $9.5\%$
      ($1.549/1.414\approx 1.095$). At $\rho=-0.15$ instead, the honest
      multiplier is $\sqrt{2(0.85)}=\sqrt{1.7}\approx 1.304$, so the naive
      rule now overstates two-day volatility, by roughly $8.5\%$ in the
      other direction.
    interview: >
      "Does $\sqrt{T}$ scaling work for a trend-following book" or "for a
      market maker" is answered by naming the sign of the autocorrelation
      and its direction of error — understate for trend-followers and stale
      marks, overstate for mean-reverters — not just "it depends."
    pitfalls: >
      Applying $\sqrt{T}$ mechanically to any strategy without checking its
      P&L's own autocorrelation is the single most common error here.
      Assuming zero return autocorrelation is enough to trust the scaling
      ignores volatility clustering, which breaks the rule through the
      input level rather than through the formula's structure.
    recap: >
      The honest multiplier is $\sqrt{T+2\sum(T-k)\rho_k}$, not $\sqrt{T}$:
      positive autocorrelation makes the naive rule understate risk,
      negative makes it overstate, and clustering breaks the input level
      even at zero autocorrelation.
    dialogue:
      - part: A trend follower's two days
        teach: >
          A trend-following book has daily P&L with standard deviation $1\%$
          of capital. Its days are not independent: the correlation between
          one day's P&L and the next day's is $0.5$, because a trend that pays
          today tends to pay tomorrow.
      - ask: >
          The naive two-day volatility is $\sqrt{2} \times 1\% \approx 1.41\%$.
          Before computing, where is the honest figure?
        choices:
          - text: >
              Exactly $1.41\%$: the $\sqrt{T}$ rule needs no normality.
            feedback: >
              True about normality, and beside the point. The rule needs the
              days to be uncorrelated, and these are correlated at $0.5$.
          - text: >
              Above $1.41\%$: good days bunch with good days, so the two-day
              total swings further.
            correct: true
            feedback: >
              Positive correlation means the two days tend to move together
              and cancel less, so the sum is more spread out than the
              uncorrelated case.
          - text: >
              Below $1.41\%$: correlation is a kind of diversification.
            feedback: >
              Diversification needs the pieces to offset. Positively
              correlated days reinforce each other; it is negative
              correlation that would offset.
        feedback: >
          The direction follows from the sign of the correlation. The size
          needs the covariance term.
      - ask: >
          What is $\operatorname{Var}(r_1 + r_2)$, in squared percent?
        expects: "3"
        hint: >
          $\operatorname{Var}(r_1) + \operatorname{Var}(r_2) +
          2\operatorname{Cov}(r_1, r_2)$, with $\operatorname{Cov} = \rho\sigma^{2}$.
        feedback: >
          $1 + 1 + 2(0.5)(1)(1) = 3$. The naive rule kept the first two terms
          and threw away the third.
      - ask: >
          So what is the honest two-day volatility, as a percentage to two
          decimals?
        expects: "1.73"
        tolerance: 0.005
        feedback: >
          $\sqrt{3} \approx 1.73\%$, which is $\sqrt{2}\sqrt{1 + \rho}$. The
          naive $1.41\%$ is about $18\%$ too small.

      - part: Counting the cross terms
        reflect: >
          Over $T$ days with daily standard deviation $\sigma$ and
          autocorrelation $\rho_k$ at lag $k$, the variance of the total has
          a covariance term for every pair of days. How many pairs sit at lag
          $k$, and what does the variance come to?
        hint: >
          In $T$ days, which pairs are one apart? Two apart?
        answer: >
          There are $T - k$ pairs of days exactly $k$ apart, each contributing
          $2\rho_k\sigma^{2}$. So the variance is $\sigma^{2}(T +
          2\sum_{k=1}^{T-1}(T-k)\rho_k)$. The $\sqrt{T}$ rule is the case in
          which every $\rho_k$ is zero, and nothing else.
      - teach: >
          That is when $\sqrt{T}$ scaling breaks: $\operatorname{Var}(\sum_{t=1}^{T}
          r_t) = \sigma^{2}(T + 2\sum_{k=1}^{T-1}(T-k)\rho_k)$. Positive
          autocorrelation, from trend following or from stale marks that
          smooth real moves, makes $\sqrt{T}$ understate. Negative
          autocorrelation, as in mean-reverting market-making P&L, makes it
          overstate. And volatility clustering can make the $\sigma$ itself
          the wrong number even when every $\rho_k$ is zero.
      - ask: >
          A market-making book has daily standard deviation $1.5$ million and
          lag-one autocorrelation $\rho_1 = -0.3$, with every longer lag zero.
          Over $4$ days, how many pairs of days are one apart?
        expects: "3"
        feedback: >
          Days $(1,2)$, $(2,3)$ and $(3,4)$: $T - k = 4 - 1 = 3$.
      - ask: >
          What is the honest four-day standard deviation, in millions, to two
          decimals?
        expects: "2.22"
        tolerance: 0.01
        hint: >
          The bracket is $4 + 2 \times 3 \times (-0.3)$.
        feedback: >
          $4 + 2(3)(-0.3) = 2.2$, so the standard deviation is
          $1.5\sqrt{2.2} \approx 1.5 \times 1.483 \approx 2.22$ million.
          The naive $1.5 \times 2 = 3$ overstates it by about $35\%$: the
          market maker's losses tend to be given back the next day.

      - part: Flattering marks and shifting volatility
        ask: >
          An illiquid credit fund marks its book monthly from stale quotes, so
          its monthly returns have lag-one autocorrelation $+0.4$. It
          annualizes volatility with $\sqrt{12}$ and reports a Sharpe ratio.
          Which way is the Sharpe biased?
        choices:
          - text: >
              Too low: autocorrelation adds noise.
            feedback: >
              Positive autocorrelation adds to the multi-period variance, but
              the $\sqrt{12}$ rule ignores it. The reported volatility is too
              small, not too large.
          - text: >
              Unbiased: the mean is estimated correctly whatever the
              autocorrelation.
            feedback: >
              The mean is fine; the denominator is not. A Sharpe ratio is only
              as honest as its volatility.
          - text: >
              Too high: smoothing hides real volatility, so the denominator is
              understated.
            correct: true
            feedback: >
              Stale marks spread one real move over several months, which looks
              like positive autocorrelation. $\sqrt{12}$ then understates
              annual risk and the Sharpe flatters the fund.
        feedback: >
          Smoothed marks are the classic route to a beautiful reported Sharpe.
          Ask for the autocorrelation of the returns before you believe it.
      - ask: >
          A stock's daily returns show essentially zero autocorrelation, but
          the sizes of its moves cluster: big days follow big days. Does the
          cross-term formula say $\sqrt{T}$ fails for its long-run volatility?
        choices:
          - text: >
              Yes: the clustering is a correlation between days.
            feedback: >
              It is a correlation between the *sizes* of moves,
              $\lvert r_t \rvert$, not between the returns $r_t$. The formula
              needs only $\rho_k$ of the returns, and those are zero.
          - text: >
              No: the long-run volatility scales as $\sqrt{T}$, but the
              $\sigma$ that governs next week can differ a lot from the
              average.
            correct: true
            feedback: >
              The formula's structure survives. What breaks is the input: in a
              clustered world, the volatility you measured last month is not
              the one you are about to get.
          - text: >
              No, and clustering never matters for risk scaling.
            feedback: >
              It matters a great deal, through the level of $\sigma$ rather
              than through the cross terms.
        feedback: >
          The third failure is an input failure, not a formula failure.
      - ask: >
          That stock's daily $\sigma$ was measured at $0.6\%$ in a calm month,
          and the next month it runs at $1.5\%$. By what factor is the scaled
          ten-day VaR built on the calm $\sigma$ too small?
        expects: "2.5"
        feedback: >
          Both figures scale by the same $\sqrt{10}$, so the ratio is
          $1.5/0.6 = 2.5$. The $\sqrt{T}$ rule was applied correctly, with zero
          autocorrelation, and the answer is still wrong by a factor of
          $2.5$.

  - node: quant-finance.risk.drawdown
    hook: >
      "What's your max drawdown" is the question every investor actually
      asks, because it's the number they experience — not a one-day
      quantile, but how bad the whole ride got before it turned around.
    explanation: >
      With an equity path $V_t$ and running peak $M_t=\max_{s\le t}V_s$,
      the drawdown at time $t$ is $D_t=(M_t-V_t)/M_t$, and the maximum
      drawdown over a window is $\max_t D_t$. This is a genuinely different
      object from the loss-distribution family: VaR and expected shortfall
      are both properties of one period's loss, while drawdown tracks the
      entire path between a peak and whatever comes after it.

      Recovery is asymmetric because returns compound rather than add. If
      value falls by a fraction $x$ to $(1-x)V_0$, getting back to $V_0$
      requires multiplying by $1/(1-x)$, a gain of $x/(1-x)$ — strictly
      larger than $x$ itself, and increasingly so as $x$ grows, because the
      base you're compounding from has shrunk.

      The same compounding sets the clock on how long recovery takes at a
      given rate of return $g$ per period: the number of periods needed is
      $\ln(1/(1-x))/\ln(1+g)$, since that's exactly how many compounding
      steps at rate $g$ turn $1-x$ back into $1$.

      Unlike a one-day VaR breach, a deep drawdown is the number that
      actually determines whether a fund survives — investors redeem
      against the peak-to-trough decline they've lived through, not against
      a quantile of tomorrow's return.
    worked: >
      A fund down $30\%$ from its peak needs a gain of $0.3/0.7\approx
      42.9\%$ just to break even — not $30\%$. At an $8\%$ annual return,
      the time to close that gap is $\ln(1/0.7)/\ln(1.08)\approx
      0.3567/0.0770\approx 4.63$ years: over four and a half years of doing
      everything right, purely as arithmetic, before the fund is back where
      it started.
    interview: >
      "You're down $X\%$ — how much do you need to make back" is a standard
      mental-math check, and the correct instant answer is $x/(1-x)$, not
      $x$; a strong follow-up volunteers that the time to recover, not just
      the required gain, is what actually matters to an investor.
    pitfalls: >
      Estimating the required recovery gain as equal to the loss — thinking
      $-30\%$ needs $+30\%$ — is the single most common numerical slip
      here; the true figure is always larger. Measuring drawdown from a
      fixed starting date rather than the running peak understates how bad
      the path actually got whenever the peak occurred partway through the
      window.
    recap: >
      Drawdown tracks the whole path from peak to trough, and because
      returns compound, a loss of $x$ needs a gain of $x/(1-x)$ to erase —
      $-30\%$ needs about $+42.9\%$, and years, not a single good day, to
      get there.
    dialogue:
      - part: How bad did it get
        teach: >
          A fund's equity at successive quarter-ends, in millions, reads $50$,
          $60$, $45$, $54$, $40$, $48$. An investor asks the obvious question:
          how bad did it get?
      - ask: >
          Measured against the starting value of $50$, what was the largest
          decline, as a percentage?
        expects: "20"
        feedback: >
          The lowest point is $40$, so $(50 - 40)/50 = 20\%$.
      - ask: >
          An investor who came in at the second quarter-end paid in at $60$.
          What was the largest decline they lived through, as a percentage to
          one decimal?
        expects: "33.3"
        tolerance: 0.05
        feedback: >
          From $60$ down to $40$: $20/60 \approx 33.3\%$. The same path, a
          far worse experience, because the reference point was a high.
      - ask: >
          Which number should the fund report as "how bad it got"?
        choices:
          - text: >
              $20\%$, measured from the start of the record.
            feedback: >
              The start date is arbitrary. The fund rose to $60$ before
              falling; measuring from $50$ forgives the first ten million of
              the fall.
          - text: >
              About $26\%$, the worst single quarter, from $54$ to $40$.
            feedback: >
              A single quarter is a one-period loss. The fall from $60$ came
              in two steps with a partial rebound between them, and a
              one-period number misses the whole slide.
          - text: >
              $33.3\%$, from the highest value reached to the lowest after it.
            correct: true
            feedback: >
              That is the decline anyone holding at the top actually suffered,
              and it does not depend on where the record happens to begin.
        feedback: >
          The reference is the best value reached so far, and the window is
          the whole path.
      - reflect: >
          State the rule you just used as a recipe: at each date, what do you
          compare the current value to, how do you express the gap, and how do
          you turn the gaps into one number for the window?
        answer: >
          At each date compare the value with the highest value reached so
          far, the running peak, and express the gap as a fraction of that
          peak. That gives a drawdown for every date; the worst of them over
          the window is the one number. Using a fraction rather than money
          makes funds of different sizes comparable, and using the running
          peak rather than a fixed start makes it independent of when you
          started counting.

      - part: Drawdown, stated and checked
        teach: >
          With running peak $M_t = \max_{s \le t} V_s$, the drawdown is
          $D_t = (M_t - V_t)/M_t$ and the maximum drawdown over a window is
          $\max_t D_t$. Unlike VaR, it is a property of the whole path, not
          of one period's loss, and it is the number investors redeem on.
      - ask: >
          Another path reads $100$, $80$, $95$, $120$, $100$, $115$. What is
          its maximum drawdown, as a percentage?
        expects: "20"
        hint: >
          Track the running peak. It changes once.
        feedback: >
          Up to the third date the peak is $100$, and the trough of $80$ gives
          $20\%$. After the new peak of $120$, the dip to $100$ is only
          $20/120 \approx 16.7\%$. The maximum is $20\%$, and it happened
          before the highest peak, not after it.
      - ask: >
          Fund A fell from $200$ million to $190$ million. Fund B fell from
          $20$ million to $10$ million. A report lists both as "drawdown: $10$
          million". What is wrong?
        choices:
          - text: >
              Nothing: both lost $10$ million.
            feedback: >
              The money is equal; the damage is not. A has $95\%$ of its peak
              left, B has half.
          - text: >
              The drawdowns are $5\%$ and $50\%$: drawdown is a fraction of the
              peak.
            correct: true
            feedback: >
              $10/200 = 5\%$ and $10/20 = 50\%$. Dividing by the running peak
              is the clause that makes the number mean the same thing for
              every fund.
          - text: >
              A's is worse, since it lost more of a bigger book.
            feedback: >
              A lost the same money from a book ten times bigger, so its
              fractional loss is a tenth of B's.
        feedback: >
          Drop the division by the peak and the number stops comparing like
          with like.

      - part: The climb back
        ask: >
          Back to the first fund, now at its trough of $40$ million. What gain,
          as a percentage, takes it back to its peak of $60$?
        expects: "50"
        feedback: >
          $60/40 = 1.5$, a $50\%$ gain, to repair a $33.3\%$ drawdown. The
          climb back is steeper than the fall.
      - ask: >
          A fund is down a fraction $x$ from its peak. What gain erases it?
        choices:
          - text: >
              $x$
            feedback: >
              The gain is earned on the shrunken base $1 - x$, not on the peak.
              From $40$ a $33.3\%$ gain reaches only $53.3$, short of $60$.
          - text: >
              $x/(1 - x)$
            correct: true
            feedback: >
              The fund must multiply $1 - x$ back up to $1$, a factor
              $1/(1 - x)$, which is a gain of $x/(1 - x)$. At $x = 1/3$ that
              is $1/2$, the $50\%$ you computed.
          - text: >
              $x/(1 + x)$
            feedback: >
              That is smaller than $x$. At $x = 1/3$ it gives $25\%$, which
              takes $40$ only to $50$.
        feedback: >
          The asymmetry grows fast: $-10\%$ needs $+11.1\%$, $-50\%$ needs
          $+100\%$, and $-90\%$ needs $+900\%$.
      - ask: >
          A fund down $40\%$ earns a steady $12\%$ a year. How many years does
          it take to regain its peak? Give two decimals.
        expects: "4.51"
        tolerance: 0.01
        hint: >
          Solve $0.6 \times 1.12^{n} = 1$.
        feedback: >
          $n = \ln(1/0.6)/\ln(1.12) \approx 0.5108/0.1133 \approx 4.51$
          years, every one of them a good one, just to get back to even.
      - ask: >
          A fund's worst single month was $-8\%$, yet its maximum drawdown
          was $30\%$. Is something wrong with the numbers?
        choices:
          - text: >
              Yes: the drawdown cannot exceed the worst month.
            feedback: >
              Four $-8\%$ months in a row compound to $1 - 0.92^{4} \approx
              28\%$. A drawdown accumulates across periods.
          - text: >
              No: a run of moderate losing months, without a new peak in
              between, compounds into a deep drawdown.
            correct: true
            feedback: >
              Drawdown is a path property. No single month needs to be
              extreme; the months only need to keep failing to reach the old
              peak.
          - text: >
              Yes: the drawdown must have been measured from the start date.
            feedback: >
              A start-date measure is usually *smaller* than the true
              maximum drawdown, not larger. Nothing here is inconsistent.
        feedback: >
          That is why a monthly VaR can look tame while an investor watches
          the fund lose a third of its value.

  - node: quant-finance.risk.drawdown-vs-vol
    hook: >
      "Would you rather cut risk in half or double your edge" sounds
      symmetric; the drawdown math says it isn't even close, and being able
      to say why in one line is the point of this node.
    explanation: >
      Volatility digs a drawdown and drift fills it back in — that's the
      entire mental model behind this formula. For a driftless random walk,
      the expected maximum drawdown over a horizon $T$ grows like
      $\sigma\sqrt{T}$ with a constant near $1.25$: with no drift to pull
      the path back up, the deepest trough keeps getting deeper as the
      horizon lengthens.

      Add positive drift $\mu$ and the picture changes qualitatively. The
      drawdown process becomes stationary — at a typical point in time it's
      exponentially distributed with mean $\sigma^{2}/(2\mu)$ — and the
      maximum over a long window $[0,T]$ grows only logarithmically in $T$
      instead of like $\sqrt{T}$, because drift keeps pulling the path back
      toward its peak.

      Writing $\mu=S\sigma$ for Sharpe ratio $S$ turns the typical drawdown
      into $\sigma^{2}/(2\mu)=\sigma/(2S)$. Read as a function of
      volatility at fixed drift, this is quadratic in $\sigma$ — halving
      volatility while holding expected return fixed cuts typical drawdown
      to a quarter. Read as a function of drift at fixed volatility, it's
      only linear in $1/\mu$ — doubling the edge while holding volatility
      fixed only halves the drawdown.
    worked: >
      Take $\sigma=25\%$ annual volatility and a Sharpe ratio $S=0.5$ (so
      $\mu=12.5\%$). Typical drawdown is $\sigma/(2S)=25\%/1=25\%$. Halving
      volatility to $12.5\%$ while holding $\mu=12.5\%$ fixed raises the
      Sharpe ratio to $S=1.0$ and drops typical drawdown to
      $12.5\%/(2\times1.0)=6.25\%$ — a quarter of the original. Doubling
      the edge instead, to $\mu=25\%$ with $\sigma=25\%$ unchanged, also
      raises $S$ to $1.0$, but drops typical drawdown only to
      $25\%/(2\times1.0)=12.5\%$ — half of the original, not a quarter,
      from an intervention of the same apparent size.
    interview: >
      "Does cutting risk or increasing edge do more for your drawdown"
      wants the quadratic-versus-linear distinction stated explicitly, with
      the formula $\sigma^{2}/(2\mu)$ named as the reason.
    pitfalls: >
      Treating $\sigma/(2S)$ as linear in volatility is only correct when
      comparing at fixed Sharpe ratio; at fixed drift it's quadratic in
      $\sigma$. Applying the driftless $\sigma\sqrt{T}$ growth rate to a
      strategy with a real, positive edge overstates how bad the tail
      drawdown gets, since positive drift makes the process stationary
      rather than ever-growing.
    recap: >
      Typical drawdown is $\sigma^{2}/(2\mu)=\sigma/(2S)$ — quadratic in
      volatility at fixed edge, so halving risk cuts drawdown fourfold,
      while doubling the edge at fixed risk only halves it.
    dialogue:
      - part: Noise digs, drift fills
        teach: >
          A strategy earns an annual drift of $\mu = 8\%$ with annual
          volatility $\sigma = 16\%$. Over $t$ years the drift adds about
          $\mu t$ to the equity, while the noise moves it by something of
          size $\sigma\sqrt{t}$. Early on the noise wins; eventually the drift
          does.
      - ask: >
          After how many years does the drift $\mu t$ catch up with
          one-sigma noise $\sigma\sqrt{t}$?
        expects: "4"
        hint: >
          Solve $0.08t = 0.16\sqrt{t}$ for $t$.
        feedback: >
          $\sqrt{t} = \sigma/\mu = 2$, so $t = 4$ years. Before that, a bad
          stretch can push the equity well below its peak; after it, the
          drift reliably pulls the path back.
      - ask: >
          How far has the drift carried the equity by that crossover, as a
          percentage?
        expects: "32"
        feedback: >
          $\mu t = 8\% \times 4 = 32\%$, which equals $\sigma\sqrt{t} = 16\%
          \times 2$. That is the depth at which noise and drift balance, and
          so the natural scale for how deep this strategy's drawdowns run.
      - reflect: >
          Write that crossover depth as a formula in $\sigma$ and $\mu$. Then
          predict what it does if you halve the volatility at fixed drift, and
          if you double the drift at fixed volatility.
        hint: >
          The crossover time is $(\sigma/\mu)^{2}$; multiply by $\mu$.
        answer: >
          The depth is $\mu(\sigma/\mu)^{2} = \sigma^{2}/\mu$. It is quadratic
          in volatility and only inversely linear in drift: halving $\sigma$
          cuts it to a quarter, while doubling $\mu$ only halves it. Noise
          digs in proportion to its square, because the time it has to dig
          before drift takes over also grows with $\sigma$.

      - part: The exact constant
        teach: >
          The precise result agrees up to a factor. With drift $\mu > 0$ the
          drawdown is stationary: at a typical time it is exponentially
          distributed with mean $\sigma^{2}/(2\mu)$, or $\sigma/(2S)$ with
          Sharpe ratio $S = \mu/\sigma$. With no drift it never settles: the
          expected maximum drawdown over $T$ grows like $1.25\sigma\sqrt{T}$.
      - ask: >
          What is the typical drawdown of the $8\%$-drift, $16\%$-volatility
          strategy, as a percentage?
        expects: "16"
        feedback: >
          $0.16^{2}/(2 \times 0.08) = 0.0256/0.16 = 0.16$, so $16\%$: half the
          crossover depth of $32\%$.
      - ask: >
          Halve the volatility to $8\%$, keeping the drift at $8\%$. What is
          the typical drawdown now, as a percentage?
        expects: "4"
        feedback: >
          $0.08^{2}/0.16 = 0.0064/0.16 = 0.04$, so $4\%$: a quarter of $16\%$.
      - ask: >
          Instead double the drift to $16\%$, keeping the volatility at $16\%$.
          What is the typical drawdown, as a percentage?
        expects: "8"
        feedback: >
          $0.0256/0.32 = 0.08$, so $8\%$: only half of $16\%$.
      - ask: >
          Both changes produced a Sharpe ratio of $1$, yet one gives a $4\%$
          typical drawdown and the other $8\%$. Why?
        choices:
          - text: >
              One computation is wrong: the same Sharpe must give the same
              drawdown.
            feedback: >
              Both are right. The Sharpe ratio is a ratio and loses the scale;
              the drawdown keeps it.
          - text: >
              At a fixed Sharpe ratio drawdown is $\sigma/(2S)$, linear in
              volatility, and the halved-risk version runs half the volatility.
            correct: true
            feedback: >
              $8\%/2 = 4\%$ against $16\%/2 = 8\%$. Same Sharpe ratio,
              half the volatility, half the drawdown.
          - text: >
              Doubling drift adds a compounding effect that deepens drawdowns.
            feedback: >
              More drift only fills drawdowns faster. The difference is that
              the doubled-drift version still carries $16\%$ volatility.
        feedback: >
          Quadratic in $\sigma$ at fixed drift, linear in $\sigma$ at fixed
          Sharpe. Say which one you mean.

      - part: Typical is not maximum
        ask: >
          At a random date, what is the probability that this strategy's
          drawdown exceeds $48\%$, three times its $16\%$ mean? Give two
          decimals.
        expects: "0.05"
        tolerance: 0.001
        hint: >
          For an exponential with mean $m$, $\Pr(D > x) = e^{-x/m}$.
        feedback: >
          $e^{-48/16} = e^{-3} \approx 0.050$. On about one date in twenty the
          fund sits at least $48\%$ under water, so over a long record a
          drawdown several times the typical one is close to certain.
      - ask: >
          A manager runs a strategy with no edge at all, $\mu = 0$, and
          $\sigma = 16\%$. What does the theory say about its drawdowns?
        choices:
          - text: >
              They settle at a typical depth, just a large one.
            feedback: >
              The mean $\sigma^{2}/(2\mu)$ is infinite at $\mu = 0$: there is
              nothing to fill the holes, so no stationary depth exists.
          - text: >
              They are zero on average, since there is no drift either way.
            feedback: >
              No drift means nothing pulls the path back to its peak. The
              running peak keeps rising on lucky stretches and the equity
              wanders away from it.
          - text: >
              The expected maximum drawdown keeps growing, about
              $1.25\sigma\sqrt{T}$ over $T$ years.
            correct: true
            feedback: >
              Over $4$ years that is about $1.25 \times 16\% \times 2 = 40\%$,
              and over $16$ years it would be $80\%$. Without drift, time only
              makes the worst drawdown worse.
        feedback: >
          Volatility digs, drift fills. With no drift the hole has no floor;
          with drift, cutting volatility is the cheapest way to make it
          shallow.

  - node: quant-finance.risk.leverage-ruin
    hook: >
      "Why not just lever up a strategy you know is profitable" is answered
      with two separate mechanisms, and naming only one of them misses the
      one that actually kills people first.
    explanation: >
      Leverage scales both sides of the ledger identically, so the growth
      curve and double-Kelly cliff result applies directly with leverage
      $L$ in place of bet fraction: $g(L)=L\mu-L^{2}\sigma^{2}/2$, the same
      downward parabola, peaking at $L^{*}=\mu/\sigma^{2}$ and crossing zero
      at $2L^{*}$. Past double the optimal leverage, a genuinely profitable
      strategy loses money almost surely with no bad luck required — the
      $-L^{2}\sigma^{2}/2$ drag term grows faster than the linear $L\mu$
      term it fights, and eventually wins outright.

      A second, harder floor sits underneath and can bite first. An
      equity-financed position at leverage $L$ is wiped out by an adverse
      move of just $1/L$ — five-times leverage dies on a $20\%$ move — and
      margin calls force liquidation even earlier, turning a drawdown that
      would have recovered into a permanent loss the moment the lender
      pulls the position.

      That absorbing barrier at zero equity is exactly the structure of
      ruin against an infinitely rich opponent: the barrier doesn't care
      whether long-run growth is positive, only whether a bad stretch
      touches zero first. A strategy can sit safely below the $2L^{*}$
      growth cliff, provably profitable in the long run, and still be wiped
      out by the margin floor on the way there — two distinct failure
      modes, not one. Size relative to bankroll, not the edge, decides who
      survives to collect it.
    worked: >
      Take $\mu=8\%$ and $\sigma=16\%$ annually, so $L^{*}=\mu/\sigma^{2}=
      0.08/0.0256\approx 3.13$ and the zero-growth crossing is at
      $2L^{*}\approx 6.25$. At $L=5$ — above the optimum but safely below
      the crossing — growth is $g(5)=5(0.08)-25(0.0256)/2=0.40-0.32=0.08$,
      a genuinely positive $8\%$ expected log growth rate. But the margin
      floor at $L=5$ sits at an adverse move of $1/5=20\%$: a single bad
      quarter of that size wipes out all equity via a margin call,
      regardless of how positive the long-run growth rate says the
      strategy is.
    interview: >
      "A strategy has a Sharpe of $0.5$ — how much leverage would you run"
      wants both floors named: the growth-optimal $L^{*}=\mu/\sigma^{2}$
      and the separate margin floor at $1/L$, with the point that staying
      below $2L^{*}$ is necessary but not remotely sufficient for safety.
    pitfalls: >
      Citing only the double-Kelly growth cliff as the danger point misses
      that margin calls can force liquidation well before the long-run
      growth story ever plays out — a strategy can be growth-positive and
      still die. Conflating leverage with edge size treats a highly
      leveraged small edge as equivalent to a modest position on a large
      edge, when the margin floor $1/L$ depends only on leverage.
    recap: >
      Leverage above $2L^{*}=2\mu/\sigma^{2}$ kills growth outright, and
      independently, any leverage $L$ is wiped out by an adverse move of
      $1/L$ — two separate floors, and margin calls make the second one
      bite first.
    dialogue:
      - part: Six times a ten percent edge
        teach: >
          A strategy earns an annual drift of $\mu = 10\%$ with annual
          volatility $\sigma = 20\%$, and the edge is real. A portfolio manager
          proposes running it at $6\times$ leverage: "ten percent becomes
          sixty."
      - ask: >
          At $6\times$, what is the expected arithmetic annual return, as a
          percentage, ignoring financing costs?
        expects: "60"
        feedback: >
          $6 \times 10\% = 60\%$. The manager's arithmetic is right. It is
          the wrong quantity for a compounding fund.
      - ask: >
          Leverage scales the volatility too. Using the growth rate from
          Kelly sizing, $g(L) = L\mu - L^{2}\sigma^{2}/2$, what is the expected
          log growth rate at $L = 6$, as a percentage?
        expects: "-12"
        hint: >
          $L^{2}\sigma^{2}/2 = 36 \times 0.04/2$.
        feedback: >
          $6(0.10) - 36(0.04)/2 = 0.60 - 0.72 = -0.12$, so $-12\%$ a year. The
          drag $L^{2}\sigma^{2}/2$ grows with the square of leverage and has
          overtaken the edge.
      - ask: >
          Expected return $+60\%$, expected log growth $-12\%$. What happens
          to the fund over many years?
        choices:
          - text: >
              It grows: the expected return is what an investor earns on
              average.
            feedback: >
              The average across many parallel funds is pulled up by a few
              lucky paths. A single fund compounds, and its wealth behaves
              like $e^{gT}$ with $g = -12\%$.
          - text: >
              It shrinks toward zero almost surely, with no bad luck required.
            correct: true
            feedback: >
              Log wealth drifts down at $12\%$ a year. A profitable strategy,
              over-levered, loses money as a matter of arithmetic.
          - text: >
              It breaks even: the positive mean and negative growth cancel.
            feedback: >
              They do not cancel; they describe different things. The typical
              path follows the growth rate, which is negative.
        feedback: >
          Over-levering a real edge does not merely add risk. Past some
          leverage it turns the expected growth negative.

      - part: Where the parabola turns
        reflect: >
          $g(L) = 0.10L - 0.02L^{2}$ is a downward parabola. Where does it
          peak, where does it cross zero again, and how do those two points
          depend on $\mu$ and $\sigma$ in general?
        hint: >
          Set the derivative $\mu - L\sigma^{2}$ to zero; then factor $g$.
        answer: >
          The peak is at $L^{*} = \mu/\sigma^{2} = 0.10/0.04 = 2.5$. Factoring,
          $g(L) = L(\mu - L\sigma^{2}/2)$, which is zero again at
          $L = 2\mu/\sigma^{2} = 2L^{*} = 5$. Below $2L^{*}$ the growth is
          positive; above it, negative. The manager's $6\times$ was past the
          cliff.
      - teach: >
          This is the Kelly parabola applied to leverage: growth peaks at
          $L^{*} = \mu/\sigma^{2}$ and crosses zero at $2L^{*}$. Past
          double-Kelly a genuinely profitable strategy loses money almost
          surely. That is the first way leverage turns volatility into ruin.
      - ask: >
          What is the maximum expected log growth rate for this strategy, at
          $L^{*} = 2.5$, as a percentage?
        expects: "12.5"
        feedback: >
          $2.5(0.10) - 6.25(0.04)/2 = 0.25 - 0.125 = 0.125$, so $12.5\%$. The
          best this edge can do, compounded, is about a fifth of the
          manager's $60\%$.

      - part: The floor under the parabola
        ask: >
          The manager retreats to $L = 4$, below the cliff at $5$, where
          $g(4) = 0.40 - 0.32 = 8\%$. The position is equity-financed. What
          adverse move in the underlying wipes out all of the fund's equity,
          as a percentage?
        expects: "25"
        hint: >
          At $4\times$, each $1\%$ move in the underlying is $4\%$ of equity.
        feedback: >
          A move of $1/L = 1/4 = 25\%$ costs $4 \times 25\% = 100\%$ of equity.
          With $\sigma = 20\%$ a year, a $25\%$ drop is about $1.25$ standard
          deviations: not rare.
      - ask: >
          Growth at $4\times$ is positive. Why does that not protect the fund
          from a $25\%$ drop?
        choices:
          - text: >
              It does: positive growth means the fund recovers from any dip.
            feedback: >
              It recovers from any dip that leaves it some equity. At zero
              there is nothing left to compound.
          - text: >
              Growth is a long-run average, and zero equity is absorbing: a
              fund that touches it never collects the long run.
            correct: true
            feedback: >
              This is ruin against an infinitely rich opponent. The market can
              always outlast you, so what matters is whether a bad stretch
              reaches the barrier before the drift pulls you away.
          - text: >
              It does not, because $g(4)$ was computed wrongly.
            feedback: >
              $4(0.10) - 16(0.04)/2 = 0.08$ is right. Growth and survival are
              separate questions.
        feedback: >
          Staying below $2L^{*}$ is necessary and nowhere near sufficient. The
          barrier at $1/L$ is a second, independent floor.
      - ask: >
          The broker liquidates the position once the fund has lost half its
          equity. At $4\times$, what adverse move triggers the forced sale,
          as a percentage?
        expects: "12.5"
        feedback: >
          Half of equity at $4\times$ is an underlying move of
          $50\%/4 = 12.5\%$, well under one standard deviation in a year.
          The forced sale turns a drawdown that might have recovered into a
          permanent loss.
      - ask: >
          An interviewer asks how much leverage you would run on this
          strategy. Which answer shows you understand both floors?
        choices:
          - text: >
              $5\times$: it is the largest leverage with non-negative growth.
            feedback: >
              At $2L^{*}$ the growth is exactly zero, and the fund dies on a
              $20\%$ move. It is the edge of the cliff, not a target.
          - text: >
              $2.5\times$, the growth-optimal leverage, since it maximizes
              long-run wealth.
            feedback: >
              Optimal only if $\mu$ and $\sigma$ are known exactly, and it
              still dies on a $40\%$ move. The answer names one floor.
          - text: >
              Well below $2.5\times$, because $\mu$ is estimated and growth
              falls on both sides of $L^{*}$, and only at a size where the $1/L$
              move and the margin trigger are far outside plausible moves.
            correct: true
            feedback: >
              Both mechanisms named: the growth cliff at $2L^{*}$ and the
              absorbing barrier at $1/L$, with the margin call bringing it
              closer still.
        feedback: >
          Size relative to bankroll, not the size of the edge, decides whether
          you survive to collect it.

  - node: quant-finance.risk.limits-and-stops
    hook: >
      "How do you actually stop a good strategy from blowing up" wants
      three concrete tools named, each doing a different job — not a single
      generic answer like "risk management."
    explanation: >
      Limits exist for a different reason than optimization: they bound a
      tail nobody can estimate reliably, trading away some expected growth
      for a hard cap on how bad the worst case can get. Position limits —
      caps on notional, delta, or vega per name, sector, and desk — are the
      bluntest version, ensuring that no single mis-estimated parameter can
      push a book anywhere near the absorbing barrier.

      Drawdown triggers cut gross exposure on a fixed schedule once equity
      falls a set distance below its running peak. This caps the
      compounding damage a losing stretch can do, at a real cost: it locks
      in losses precisely when a strategy might be merely unlucky rather
      than actually broken, since the trigger can't distinguish the two.

      Volatility targeting rescales positions by $\sigma_{\text{target}}/
      \sigma_{\text{forecast}}$, keeping realized risk roughly stationary
      through time and automatically cutting size the moment forecast
      volatility rises.

      All three are set conservatively for the same underlying reason:
      $\mu$ is always an estimate, and the growth curve's asymmetry means
      overshooting a leverage or size target costs far more than
      undershooting it by the same factor. Sizing off half of the
      theoretically optimal level, rather than the full amount, buys most
      of the achievable growth while leaving real room for the estimate to
      be wrong.
    worked: >
      A strategy targets $12\%$ annual volatility. While forecast
      volatility sits at $15\%$, the vol-targeting rule scales notional by
      $12\%/15\%=0.8$, running at $80\%$ of an unscaled position. If
      forecast volatility then jumps to $30\%$ — a doubling, consistent
      with volatility clustering — the scale factor drops to
      $12\%/30\%=0.4$: notional is automatically cut in half again, from
      $80\%$ to $40\%$, without any change to the underlying trading
      signal at all.
    interview: >
      "What stops a profitable strategy from having a catastrophic month"
      wants all three tools named with their distinct jobs, and a mention
      that all three are deliberately conservative because $\mu$ is only
      ever estimated.
    pitfalls: >
      Treating a position limit as pure inefficiency misunderstands the
      point — it exists precisely to bound a risk that can't be priced or
      estimated. Running full Kelly-optimal sizing because the point
      estimate of $\mu$ looks favorable ignores that the growth curve
      punishes overshoot far harder than undershoot, which is the entire
      justification for shading down.
    recap: >
      Position limits bound the unknown tail, drawdown triggers cap
      compounding damage at the cost of locking in losses, and vol
      targeting rescales by $\sigma_{\text{target}}/\sigma_{\text{
      forecast}}$ — all sized conservatively because the edge behind them
      is only ever estimated.
    dialogue:
      - part: Sizing off an estimate
        teach: >
          A backtest says a strategy earns $\mu = 5\%$ a year with volatility
          $\sigma = 10\%$. The growth-optimal leverage is
          $L^{*} = \mu/\sigma^{2} = 0.05/0.01 = 5$, and the desk is tempted
          to run exactly that.
      - ask: >
          On the backtest's numbers, what is the expected log growth
          $g(L) = L\mu - L^{2}\sigma^{2}/2$ at $L = 5$, as a percentage?
        expects: "12.5"
        feedback: >
          $5(0.05) - 25(0.01)/2 = 0.25 - 0.125 = 0.125$, so $12.5\%$ a year.
      - ask: >
          A few years of data cannot pin down a mean, and the true drift
          turns out to be $\mu = 2.5\%$, half the estimate. At $L = 5$, what is
          the true expected log growth, as a percentage?
        expects: "0"
        hint: >
          Only the $L\mu$ term changes.
        feedback: >
          $5(0.025) - 0.125 = 0$. The strategy is genuinely profitable, and
          sized at its estimated optimum it grows at exactly nothing: the
          estimate error put the desk on the double-Kelly cliff of the true
          curve.
      - reflect: >
          You cannot know $\mu$ to better than a factor of two. What sizing
          rule would have protected you here, and roughly what would it cost
          you if the backtest had been right after all?
        hint: >
          Where is the true optimum when the true $\mu$ is half the estimate?
        answer: >
          Size at a fraction of the estimated optimum, say half. With
          $\mu = 2.5\%$ the true optimum is $0.025/0.01 = 2.5$, exactly half
          of $5$, so half-sizing lands on it. If the estimate was right,
          half-sizing gives up some growth but keeps most of it, because the
          growth curve is flat near its peak and falls to zero only at twice
          the optimum. Undersizing by a factor of two costs a little;
          oversizing by a factor of two costs everything.

      - part: Crude rules for an unknown tail
        teach: >
          Limits are not optimizations; they bound the tail you cannot
          estimate. Size off half-Kelly rather than full. Then three tools
          keep estimation error away from the absorbing barrier: position
          limits cap notional, delta or vega per name, sector and desk;
          drawdown triggers cut gross exposure on a schedule once equity falls
          a set distance below its peak; volatility targeting rescales
          positions by $\sigma_{\text{target}}/\sigma_{\text{forecast}}$.
      - ask: >
          Suppose the backtest was right after all, $\mu = 5\%$. What does
          half-Kelly, $L = 2.5$, earn in expected log growth, as a
          percentage?
        expects: "9.375"
        tolerance: 0.01
        feedback: >
          $2.5(0.05) - 6.25(0.01)/2 = 0.125 - 0.03125 = 0.09375$, about
          $9.4\%$: three quarters of the $12.5\%$ maximum, bought with
          protection against a factor-of-two error.

      - part: When the volatility changes
        ask: >
          The desk runs $2.5\times$. Then the market turns and forecast
          volatility of the underlying strategy jumps from $10\%$ to $25\%$.
          If nothing is rescaled, what is the volatility of the leveraged
          book, as a percentage?
        expects: "62.5"
        feedback: >
          $2.5 \times 25\% = 62.5\%$, against the $25\%$ the desk signed up
          for.
      - ask: >
          The desk targets $25\%$ book volatility. What leverage does
          volatility targeting set at the new forecast?
        expects: "1"
        hint: >
          Book volatility is leverage times the strategy's volatility.
        feedback: >
          $L = 25\%/25\% = 1$. The rule cuts the position by a factor of
          $2.5$ the moment the forecast moves, with no judgement call.
      - ask: >
          Why does that cut matter for survival, not just for comfort?
        choices:
          - text: >
              It does not: the edge is the same, so the right leverage is the
              same.
            feedback: >
              The right leverage is $\mu/\sigma^{2}$, and $\sigma$ just went
              from $10\%$ to $25\%$. The optimum fell from $5$ to $0.8$.
          - text: >
              At $\sigma = 25\%$ the growth cliff $2\mu/\sigma^{2}$ falls to
              $1.6$, so staying at $2.5\times$ puts the book past it.
            correct: true
            feedback: >
              $2 \times 0.05/0.0625 = 1.6$. Unscaled, $g(2.5) = 0.125 -
              6.25(0.0625)/2 \approx -7\%$. Vol targeting moved the book back
              to $1\times$, where $g \approx +1.9\%$.
          - text: >
              It lowers the expected return, which is what investors want in a
              volatile market.
            feedback: >
              The point is not a lower return; it is staying on the right side
              of the growth cliff, which moves every time $\sigma$ does.
        feedback: >
          Volatility clusters, so the cliff moves. Vol targeting moves the
          position with it automatically.

      - part: Stops and caps
        ask: >
          The desk adds a drawdown trigger: halve gross exposure once equity
          is $15\%$ below its peak. After a $15\%$ drawdown, the strategy
          turns out to have been merely unlucky. What did the trigger cost?
        choices:
          - text: >
              Nothing: the cut only reduces risk.
            feedback: >
              It also halves the exposure to the recovery. The desk took the
              loss at full size and earns the rebound at half size.
          - text: >
              It locked in part of the loss, since the rebound is earned on a
              smaller position.
            correct: true
            feedback: >
              The trigger cannot tell unlucky from broken. It caps the
              compounding damage if the strategy is broken, and pays for that
              by giving up recovery if it was only unlucky.
          - text: >
              It made the loss permanent, like a margin call.
            feedback: >
              A margin call closes the position at the barrier. The trigger
              keeps half the position on, so the fund still participates in a
              recovery.
        feedback: >
          A drawdown trigger is insurance against the edge having vanished,
          paid for in the cases where it had not.
      - ask: >
          A desk with an excellent backtest asks to put its whole risk budget
          into one name, sized at half-Kelly. Why does the firm still apply a
          single-name position limit?
        choices:
          - text: >
              Because half-Kelly is still too aggressive for any strategy.
            feedback: >
              Half-Kelly already handles a factor-of-two error in $\mu$. The
              limit guards against a different failure.
          - text: >
              Because one name can gap far beyond any estimated tail, and the
              limit caps what a single wrong estimate can cost.
            correct: true
            feedback: >
              A fraud, a default or a takeover moves one name by more than any
              volatility forecast allows. A cap on notional bounds that loss
              without needing to estimate it.
          - text: >
              To spread commissions across more trades.
            feedback: >
              Costs are not the issue. The limit exists to keep any one mistake
              away from the absorbing barrier.
        feedback: >
          Three crude rules, each doing a job that no estimate can: caps bound
          the unknown tail, triggers cap compounding, vol targeting keeps the
          leverage on the right side of a moving cliff.

  - node: quant-finance.risk.correlation-breakdown
    hook: >
      "Your book is diversified across twenty names — how much protection
      does that really buy in a crash" is the trap question, and the
      honest answer is far less than the calm-market correlation matrix
      suggests.
    explanation: >
      Recall the diversification floor: a portfolio's risk floor is set by
      the average pairwise covariance across its holdings, since individual
      variances wash out and what survives is exactly how correlated the
      pieces are. That floor is estimated from calm-market data, and
      correlations rise precisely when diversification is needed most: in
      a genuine crisis, leveraged holders sell whatever is liquid across
      asset classes at once, and returns only loosely related in calm
      markets converge toward moving together.

      Part of that convergence is real — a common deleveraging factor
      genuinely drives every asset class at once — and part is a
      measurement artifact: conditioning a sample on large moves raises the
      observed correlation even when the true underlying correlation never
      changed. Both effects push the same direction, which is what makes
      the pattern so persistent.

      The deeper failure sits inside the modeling choice, not just the
      estimate: a bivariate normal has zero tail dependence, meaning it
      assigns almost no probability to both legs of a pair crashing
      together even at a correlation well below one. A portfolio VaR built
      on that assumption understates the chance of a joint crash
      structurally. The working fix is to stress-test at $\rho\to 1$
      directly, and to think in terms of independent bets rather than
      position count, since a book of twenty positions loading on one
      common factor is really one bet wearing twenty labels.
    worked: >
      Take $n=20$ equally weighted names, each with $\sigma=25\%$, and
      average pairwise correlation $\bar\rho=0.2$ in calm markets:
      portfolio variance is $\sigma^{2}[\bar\rho+(1-\bar\rho)/n]=
      0.0625[0.2+0.8/20]=0.0625(0.24)=0.015$, so $\sigma_p\approx 12.2\%$.
      If a crisis pushes $\bar\rho$ to $0.8$ with every individual $\sigma$
      unchanged, portfolio variance becomes
      $0.0625[0.8+0.2/20]=0.0625(0.81)=0.050625$, so $\sigma_p\approx
      22.5\%$ — the book's risk nearly doubles purely from the correlation
      regime shifting, with not one position's own volatility having moved
      at all.
    interview: >
      "How would you stress test a diversified book" wants $\rho\to1$
      named directly as the shock to apply, plus the observation that
      position count overstates true diversification whenever the
      positions share a common factor.
    pitfalls: >
      Trusting a calm-period correlation matrix for a tail scenario is not
      just noisy, it's structurally biased low — the whole point here is
      that the bias is systematic, not random. Modeling joint risk with a
      multivariate normal at any fixed correlation misses tail dependence
      entirely, so even a correctly re-estimated correlation doesn't fully
      fix the understatement of simultaneous crashes.
    recap: >
      Correlations rise exactly when diversification is needed, calm-market
      Gaussian models carry zero tail dependence regardless, and portfolio
      volatility can nearly double in stress purely from the correlation
      regime shifting — stress-test at $\rho\to1$ and count independent
      bets.
    dialogue:
      - part: Twenty-five names in a calm year
        teach: >
          A book holds $25$ equally weighted stocks, each with volatility
          $\sigma = 30\%$. Over two calm years the average pairwise
          correlation was $\bar\rho = 0.1$, and the risk system uses that
          number.
      - ask: >
          What is the portfolio's volatility, as a percentage to two decimals?
        expects: "11.06"
        tolerance: 0.01
        hint: >
          $\sigma_p^{2} = \sigma^{2}[\bar\rho + (1 - \bar\rho)/n]$.
        feedback: >
          $0.09[0.1 + 0.9/25] = 0.09 \times 0.136 = 0.01224$, so
          $\sigma_p \approx 11.06\%$. Twenty-five names cut the risk to about
          a third of a single name's.
      - ask: >
          A crisis arrives. Every stock's volatility is still $30\%$, but the
          average correlation jumps to $0.7$. What is the portfolio's
          volatility now, as a percentage to two decimals?
        expects: "25.31"
        tolerance: 0.01
        feedback: >
          $0.09[0.7 + 0.3/25] = 0.09 \times 0.712 = 0.06408$, so
          $\sigma_p \approx 25.31\%$, more than double the calm figure.
      - ask: >
          Not one stock became more volatile. What does that say?
        choices:
          - text: >
              The stocks did become riskier; the volatility estimates must
              be stale.
            feedback: >
              The $30\%$ was held fixed in the computation, and the risk still
              more than doubled. The change came from somewhere else.
          - text: >
              The diversification lived entirely in the low correlation, and
              the correlation is what moved.
            correct: true
            feedback: >
              With many names the individual variances wash out and the
              average covariance is all that survives. Move $\bar\rho$ and you
              move the floor of the book's risk.
          - text: >
              Twenty-five names were too few; a hundred would have held.
            feedback: >
              At $\bar\rho = 0.7$ a hundred names give $\sigma_p^{2} =
              0.09[0.7 + 0.003]$, about $25.2\%$. More names cannot get below
              the correlation floor.
        feedback: >
          Diversification is a bet on correlation staying low. The question is
          what correlation does when you need it.
      - reflect: >
          Correlations measured in calm markets rise in a crash. Give two
          reasons, one about who is trading in a crisis and one about how
          correlation is measured on crisis days.
        answer: >
          Real: in a crisis leveraged holders sell whatever they can, across
          every asset class at once, so a single deleveraging factor drives
          everything and returns genuinely move together. Measurement: picking
          out the days with large moves selects days where the common factor
          was large, so the sample correlation on those days is higher even if
          the underlying correlation never changed. Both effects push the same
          way.

      - part: Stress at one, count the bets
        teach: >
          Correlations converge in stress: in 2008 equity, credit, commodity
          and hedge-fund returns moved toward one together. The modelling
          failure runs deeper than a stale estimate: a bivariate normal has
          zero tail dependence, so calm-period Gaussian VaR understates joint
          crashes structurally. The working rule is to stress-test at
          $\rho \to 1$ and to count independent bets rather than positions.
      - ask: >
          At $\bar\rho = 1$, what is the book's volatility, as a percentage?
        expects: "30"
        feedback: >
          $0.09[1 + 0] = 0.09$, so $30\%$: twenty-five positions, one bet,
          exactly as risky as a single stock.
      - ask: >
          How many independent $30\%$-volatility bets would give the calm-market
          portfolio volatility of $11.06\%$? Give two decimals.
        expects: "7.35"
        tolerance: 0.01
        hint: >
          $N$ independent equal bets give $\sigma/\sqrt{N}$. Solve for $N$.
        feedback: >
          $N = (\sigma/\sigma_p)^{2} = 1/0.136 \approx 7.35$. Even in calm
          markets, twenty-five positions are worth about seven independent
          bets.
      - ask: >
          And at the crisis correlation of $0.7$, how many independent bets is
          the book worth? Give two decimals.
        expects: "1.40"
        tolerance: 0.01
        feedback: >
          $1/0.712 \approx 1.40$. The book that looked like seven bets is,
          when it matters, about one and a half.

      - part: What the normal model cannot see
        ask: >
          Two assets have a true, constant correlation of $0.3$ under a
          bivariate normal. You estimate their correlation using only the
          days on which the market moved more than $2\sigma$. What do you get?
        choices:
          - text: >
              About $0.3$: conditioning does not change a correlation.
            feedback: >
              Selecting on large moves selects days where the shared driver was
              large, which stretches both assets the same way. The sample
              correlation rises.
          - text: >
              Noticeably more than $0.3$, though nothing about the assets
              changed.
            correct: true
            feedback: >
              That is the measurement part of the breakdown: part of the
              "crisis correlation" is produced by looking only at crisis
              days.
          - text: >
              Less than $0.3$, because large moves are noisy.
            feedback: >
              The noise in each asset's own component stays the same size,
              while the shared part is magnified on those days. The ratio
              moves toward one, not away.
        feedback: >
          So a jump in measured correlation is partly real deleveraging and
          partly selection. A risk model has to survive both.
      - ask: >
          Model two assets as bivariate normal with $\rho = 0.6$. As you ask
          about ever more extreme joint crashes, what happens to the
          probability that B crashes given that A has crashed?
        choices:
          - text: >
              It stays near $0.6$ at every depth.
            feedback: >
              Correlation is not a conditional probability. And under the
              normal the conditional chance changes with depth.
          - text: >
              It rises toward one, as in real crises.
            feedback: >
              That is what real markets do, and exactly what the normal
              cannot. It is the gap between the model and 2008.
          - text: >
              It falls toward zero: the normal has no tail dependence.
            correct: true
            feedback: >
              For any $\rho < 1$, the normal makes extreme joint crashes
              vanishingly rare relative to single crashes. A Gaussian VaR
              calibrated at $\rho = 0.6$ still says the two legs almost never
              crash together in the far tail.
        feedback: >
          Even a correctly re-estimated correlation does not fix a Gaussian
          model's tail. That is why the stress test is at $\rho \to 1$, not
          at a slightly higher $\rho$.
      - ask: >
          An interviewer asks how you would stress-test this $25$-name book.
          Which answer is strongest?
        choices:
          - text: >
              Re-estimate the correlation matrix over the last month and
              rerun the VaR.
            feedback: >
              A recent estimate helps with the level, but it stays Gaussian
              and has no tail dependence. It is a re-estimate, not a stress.
          - text: >
              Shock every correlation to $1$, read the book's risk as about
              $30\%$, and report it as roughly one or two independent bets.
            correct: true
            feedback: >
