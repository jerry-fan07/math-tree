unit: quant-statistics.time-series
opening: >
  Time series work is about squeezing information out of a single realized path
  when there is no second draw of history to average against. This unit opens
  with the two ideas that make that possible — stationarity and the
  autocorrelation function — then builds the AR(1) and MA(1) families that turn
  a correlogram's shape into a named model with a computable mean-reversion
  speed, forecast error, and a warning about how much autocorrelation inflates
  the uncertainty of a sample mean. A second arc treats the boundary case where
  all of that machinery fails: the unit root, the spurious regressions it
  produces, and the cointegration and differencing techniques that route around
  it. It closes on the stylized facts of real returns, where linear
  predictability in the level all but vanishes even as volatility itself stays
  highly forecastable.
lessons:
  - node: quant-statistics.time-series.stationarity
    hook: >
      Every later technique in this unit — fitting an AR(1), trusting a sample
      mean, running a t-test on a P&L stream — silently assumes stationarity
      first, and an interviewer who asks "is this series stationary?" is really
      asking whether you'd apply that machinery blindly.
    explanation: >
      You only ever observe one path of history, never the full ensemble of
      paths the process could have produced. Stationarity is the condition that
      licenses substituting a time-average along your one path for an
      ensemble-average you'll never see: if the mean, variance, and
      lag-structure don't depend on where you stand in time, a long enough
      stretch of your one path samples the same underlying law repeatedly.
      Without it, "the sample mean" is an average of numbers that were never
      generated by the same distribution to begin with, and it estimates
      nothing stable.

      The gap between white noise and iid is the detail worth sitting with.
      White noise only forbids linear dependence — zero covariance at every
      lag — and says nothing about higher moments. A sequence can be white
      noise while its variance today depends heavily on how large yesterday's
      move was; the covariances are still all zero because that dependence is
      nonlinear. That loophole is exactly what real return series exploit, and
      it is why "uncorrelated" will turn out to be a much weaker claim than
      "unpredictable" later in this unit.
    worked: >
      Take $x_t = 0.5t + \varepsilon_t$ with $\varepsilon_t$ iid mean $0$. At
      $t=3$, $\mathbb{E}[x_t] = 1.5$; at $t=10$, $\mathbb{E}[x_t] = 5$. The mean
      is not constant, so $x_t$ fails stationarity on the first condition alone
      — no amount of averaging over one realized path recovers a fixed "true
      mean," because there isn't one.
    interview: >
      "Would you run a standard t-test on this P&L series?" is testing whether
      stationarity comes up unprompted. The right answer names all three
      conditions, then immediately flags that raw prices trend and their
      variance grows, so they fail on sight — the test only makes sense on
      something like returns.
    pitfalls: >
      Judging stationarity from a flat-looking plot without checking the
      variance or the autocovariance structure — a mean can look constant while
      the spread of moves is visibly widening. Treating "white noise" and "iid"
      as synonyms; white noise permits exactly the kind of volatility
      clustering that later invalidates naive error bars.
    recap: >
      Constant mean, constant variance, autocovariance depending only on the
      lag — the three conditions that let one realized path stand in for the
      ensemble, and white noise is the weakest series that clears them.
    dialogue:
      - part: Three paths, one average each
        teach: >
          Three desks each hand you one realized path of $200$ days, built from
          iid shocks $\varepsilon_t$ with mean $0$ and variance $4$. Desk A's
          series is $a_t = 10 + \varepsilon_t$. Desk B's is
          $b_t = 10 + 0.2t + \varepsilon_t$. Desk C's is $c_t = 10 + \varepsilon_t$
          for days $1$ to $100$ and $c_t = 10 + 3\varepsilon_t$ for days $101$ to
          $200$, after a rule change tripled its volatility.
      - ask: >
          You average desk B's $200$ days. What is the expected value of that
          sample mean?
        expects: "30.1"
        hint: >
          The expected value of day $t$ is $10 + 0.2t$; average that over
          $t = 1, \dots, 200$.
        feedback: >
          The average of $t$ over $1$ to $200$ is $100.5$, so the sample mean
          estimates $10 + 0.2 \times 100.5 = 30.1$. Average days $1$ to $100$
          instead and you get $10 + 0.2 \times 50.5 = 20.1$. The number depends
          on which window you happened to pick: it is the mean of no particular
          day, and of nothing that will hold next year.
      - ask: >
          What is the variance of desk C's value on day $150$?
        expects: "36"
        hint: >
          On day $150$ the shock is multiplied by $3$.
        feedback: >
          $\operatorname{Var}(3\varepsilon_t) = 9 \times 4 = 36$. On day $50$ it
          is $4$. The mean of C is $10$ on every day, and still its spread
          depends on the date.
      - ask: >
          For which desks does a long stretch of the one path give a sample mean
          and a sample variance that estimate fixed numbers?
        choices:
          - text: >
              A and C: both are centred at $10$ on every day.
            feedback: >
              C's sample mean is fine, but its pooled sample variance over the
              $200$ days comes out near $(4 + 36)/2 = 20$, which is the variance
              of no day at all. Halve the window and it changes again.
          - text: >
              All three, given enough data.
            feedback: >
              More of B's path only drags its sample mean higher: the expected
              average of days $1$ to $400$ would be $10 + 0.2 \times 200.5 =
              50.1$. Extra data cannot converge to a target that moves.
          - text: >
              Only A.
            correct: true
            feedback: >
              Every day of A is drawn from the same law, so averaging along the
              path samples that law again and again. B's mean moves and C's
              variance moves.
        feedback: >
          You have one path, never the ensemble of paths the process could
          have produced. Averaging along time only stands in for averaging
          across the ensemble when the thing you are averaging does not depend
          on the date.

      - part: What exactly you were checking
        reflect: >
          A's mean and variance do not depend on the day. Suppose you also want
          the path to estimate how today's value co-moves with the value $k$
          days later. What else must not depend on the day, and why?
        hint: >
          A sample covariance at lag $k$ averages the products
          $(x_t - \bar{x})(x_{t+k} - \bar{x})$ over $t$.
        answer: >
          The covariance between $x_t$ and $x_{t+k}$ must depend on the lag $k$
          alone, not on $t$. The sample autocovariance averages one product per
          starting day; if the true covariance at lag $k$ is different on
          different days, that average mixes several different quantities and
          estimates none of them, exactly as B's sample mean did.
      - teach: >
          That is the definition. A series is weakly stationary when, for every
          $t$, the mean $\mathbb{E}[x_t] = \mu$ is constant, the variance
          $\gamma_0$ is finite and constant, and
          $\operatorname{Cov}(x_t, x_{t+k}) = \gamma_k$ depends on $k$ alone. B
          fails the first clause, C the second. The simplest series that passes
          is white noise: mean $0$, variance $\sigma^{2}$, and $\gamma_k = 0$ for
          every $k \ne 0$. Desk A minus $10$ is white noise.
      - teach: >
          Now a fourth series, which fails only the third clause. A data vendor
          prints a fresh value only on even days and repeats the previous print
          on odd days: $x_t = \varepsilon_t$ when $t$ is even and
          $x_t = \varepsilon_{t-1}$ when $t$ is odd, with the same shocks of
          variance $4$.
      - ask: >
          What is $\operatorname{Cov}(x_4, x_5)$?
        expects: "4"
        hint: >
          Day $5$ is odd, so it repeats day $4$'s print.
        feedback: >
          $x_5 = \varepsilon_4 = x_4$, so the covariance is
          $\operatorname{Var}(\varepsilon_4) = 4$.
      - ask: >
          What is $\operatorname{Cov}(x_5, x_6)$?
        expects: "0"
        hint: >
          Which shock is each of these two days built from?
        feedback: >
          $x_5 = \varepsilon_4$ and $x_6 = \varepsilon_6$, two independent
          shocks, so the covariance is $0$.
      - ask: >
          Which clause of weak stationarity does the vendor's series fail?
        choices:
          - text: >
              None: the mean is $0$ and the variance is $4$ on every day.
            feedback: >
              Those are the first two clauses, and they do hold. But you just
              computed two lag-$1$ covariances, $4$ and $0$, and they differ only
              in where they start.
          - text: >
              The covariance at lag $1$ depends on whether $t$ is even or odd.
            correct: true
            feedback: >
              Right. Mean and variance are constant, yet $\gamma_1$ is not a
              single number, so a sample lag-$1$ autocovariance averages $4$s
              and $0$s and estimates about $2$, which is true of no day.
          - text: >
              The variance, because odd days carry no new information.
            feedback: >
              Repeating a value does not change its variance: every $x_t$ is a
              single shock with variance $4$. Staleness shows up in the
              co-movement between days, not in the spread of any one day.
        feedback: >
          The three clauses are independent requirements. B, C and the vendor's
          feed each fail exactly one of them, a different one each time.

      - part: Uncorrelated is not the same as independent
        teach: >
          One more series. Each day a fair coin picks the sign $u_t = \pm 1$, and
          separately the size $m_t$ is either $1$ or $3$: it keeps yesterday's
          size with probability $0.9$ and switches with probability $0.1$, and
          over the long run it spends half its days at each. The move is
          $z_t = u_t m_t$. Its mean is $0$ and its variance is
          $(1 + 9)/2 = 5$ on every day.
      - ask: >
          What is $\operatorname{Cov}(z_t, z_{t+1})$?
        expects: "0"
        hint: >
          The signs are independent of each other and of the sizes.
        feedback: >
          $\mathbb{E}[z_t z_{t+1}] = \mathbb{E}[u_t]\,\mathbb{E}[u_{t+1}]\,
          \mathbb{E}[m_t m_{t+1}] = 0$, and the same argument kills every lag.
          So $z$ is white noise.
      - ask: >
          Today's move had size $3$. What is the probability that tomorrow's
          move has size $3$?
        expects: "0.9"
        hint: >
          The size keeps yesterday's value with probability $0.9$.
        feedback: >
          $0.9$, against $0.5$ for a day you know nothing about. Knowing today
          tells you a great deal about the size of tomorrow, while the
          covariances you computed say nothing can be predicted.
      - ask: >
          What is $z_t$?
        choices:
          - text: >
              White noise and iid.
            feedback: >
              Identically distributed, yes, but not independent: the size of
              tomorrow's move depends on today's, $0.9$ against $0.5$.
          - text: >
              Neither: anything dependent cannot be white noise.
            feedback: >
              White noise only asks for zero covariance at every nonzero lag,
              and $z$ has it. Dependence that runs through the size, not the
              sign, is invisible to a covariance.
          - text: >
              White noise, but not iid.
            correct: true
            feedback: >
              Right. White noise forbids linear dependence only, and this
              series is all nonlinear dependence: large moves follow large
              moves of either sign.
        feedback: >
          That gap is the loophole real returns live in: their covariances are
          close to zero at every lag while their size is strongly persistent.
          "Uncorrelated" will keep turning out to be a much weaker claim than
          "unpredictable".

  - node: quant-statistics.time-series.acf
    hook: >
      The correlogram is the first plot anyone runs on a new series, because
      its shape alone — before any model is fit — tells you which family of
      models is even worth trying.
    explanation: >
      Correlation between two variables normally needs two different
      variances in the denominator. Stationarity is what makes
      $\rho_k = \gamma_k/\gamma_0$ well-defined without that bookkeeping:
      because the variance is the same $\gamma_0$ at every time $t$, one
      number in the denominator serves every lag, and the correlation between
      $x_t$ and $x_{t+k}$ doesn't depend on which $t$ you picked — only on the
      gap $k$. That same time-shift invariance forces the ACF to be even,
      $\rho_{-k} = \rho_k$: the correlation between today and $k$ days ago is
      the same number as between today and $k$ days ahead.

      Reading the shape is the actual skill. Geometric decay says the series
      remembers its past with a constant decay rate per step — autoregressive.
      A hard cutoff after lag $q$ says the memory has a finite window —
      moving average. Decay so slow the correlogram barely moves across dozens
      of lags says the series isn't stationary at all. The legality
      constraint — the matrix of $\rho_{|i-j|}$ must be positive semidefinite
      — is not a technicality; it's the reminder that $\rho_k$ is not a free
      design choice but the correlation matrix of $(x_1,\dots,x_n)$ itself, so
      an ACF that decays and then swings back up sharply is often simply
      illegal.
    worked: >
      Suppose a stationary series has $\gamma_0 = 4$, $\gamma_1 = 2$,
      $\gamma_2 = 1$, and $\gamma_k = 0$ for $k \ge 3$. Then $\rho_1 = 2/4 =
      0.5$ and $\rho_2 = 1/4 = 0.25$: a correlogram with two nonzero lags and a
      hard cutoff after — the fingerprint of a two-period moving average, not
      an autoregression.
    interview: >
      "Here's a correlogram — what generated this data?" wants the shape read
      immediately: geometric decay names AR, a cutoff names MA, near-$1$ decay
      that barely moves names a unit root, stated before reaching for any
      fitting procedure.
    pitfalls: >
      Reporting $\rho_k$ for negative $k$ as if it could differ from
      $\rho_{-k}$'s positive-lag value — stationarity forces them equal.
      Forgetting the ACF measures linear dependence only, so $\rho_k$ near
      zero at every lag is consistent with strong nonlinear structure still
      sitting in the series.
    recap: >
      $\rho_k = \gamma_k/\gamma_0$ is well-defined only because stationarity
      supplies one shared variance for every lag, and the correlogram's shape
      — geometric decay, hard cutoff, or near-unity crawl — names the model
      before any fitting happens.
    dialogue:
      - part: A covariance in the wrong units
        teach: >
          A desk tracks a stationary spread in basis points. Its autocovariances
          are $\gamma_0 = 20$, $\gamma_1 = 12$, $\gamma_2 = 6$ and $\gamma_k = 0$
          for $k \ge 3$, all in squared basis points. A colleague re-quotes the
          same spread in percentage points, where $1$ basis point is $0.01$.
      - ask: >
          What is $\gamma_1$ in squared percentage points?
        expects: "0.0012"
        hint: >
          A covariance picks up the unit conversion twice, once from each
          factor.
        feedback: >
          Each factor is scaled by $0.01$, so the covariance is scaled by
          $0.0001$: $12 \times 0.0001 = 0.0012$. Same spread, same days, a
          number ten thousand times smaller.
      - ask: >
          So how strong is the spread's lag-$1$ dependence?
        choices:
          - text: >
              Strong: $12$ is a large covariance.
            feedback: >
              In percentage points the same dependence reads $0.0012$, which
              looks negligible. A covariance's size is mostly a statement about
              the units.
          - text: >
              Substantial: $12$ is three fifths of the spread's own variance,
              $20$.
            correct: true
            feedback: >
              Right. Measured against the spread's own variance, the lag-$1$
              covariance is $0.6$ of it, and that ratio survives any change of
              units.
          - text: >
              Weak: in percentage points it is only $0.0012$.
            feedback: >
              The variance shrinks by the same factor, to $0.0020$, so the
              dependence is exactly as strong as before. A raw covariance cannot
              be read without its scale.
        feedback: >
          A covariance has to be compared with something before it means
          anything. The question is what to compare it with.

      - part: One denominator for every lag
        reflect: >
          An ordinary correlation divides $\operatorname{Cov}(x_t, x_{t+k})$ by
          the product of the two standard deviations. For a stationary series,
          what does that product come to, and why can a single number serve as
          the denominator at every lag?
        hint: >
          What does stationarity say about $\operatorname{Var}(x_t)$ and
          $\operatorname{Var}(x_{t+k})$?
        answer: >
          Stationarity makes the variance the same $\gamma_0$ on every day, so
          both standard deviations are $\sqrt{\gamma_0}$ and their product is
          $\gamma_0$ itself. One number normalises every lag, and since
          $\gamma_k$ depends only on the lag, the ratio is a property of the
          series rather than of the day you started from.
      - teach: >
          That ratio is the autocorrelation function:
          $\rho_k = \gamma_k/\gamma_0$. It is unit-free, $\rho_0 = 1$, and
          $|\rho_k| \le 1$ because it is an honest correlation between $x_t$ and
          $x_{t+k}$. Plotted against $k$ it is the correlogram, the first
          diagnostic anyone runs on a new series.
      - ask: >
          What is $\rho_2$ for the spread?
        expects: "0.3"
        hint: >
          Divide by $\gamma_0$, in either set of units.
        feedback: >
          $\rho_2 = 6/20 = 0.3$, or $0.0006/0.0020 = 0.3$ in percentage
          points. The correlogram reads $1, 0.6, 0.3, 0, 0, \dots$ in any
          units.
      - ask: >
          A report quotes the spread's correlation with its value one day
          *earlier*, $\rho_{-1}$. What should it say?
        choices:
          - text: >
              $-0.6$: looking backwards flips the sign.
            feedback: >
              Correlation is symmetric in its two arguments. Looking back one
              day pairs the same kind of days as looking forward one day, just
              named differently; nothing reverses.
          - text: >
              It need not equal $\rho_1$: the past and the future can differ.
            feedback: >
              For a stationary series they cannot.
              $\operatorname{Cov}(x_t, x_{t-1})$ is
              $\operatorname{Cov}(x_s, x_{s+1})$ with $s = t - 1$, and that is
              $\gamma_1$ wherever $s$ sits.
          - text: >
              $0.6$, the same as $\rho_1$.
            correct: true
            feedback: >
              Right. Shift-invariance makes the ACF even,
              $\rho_{-k} = \rho_k$, which is why correlograms only plot
              $k \ge 0$.
        feedback: >
          Constant variance gave one denominator, and dependence on the lag
          alone gave a function of $k$ that is symmetric about $0$.

      - part: Not every list is a correlogram
        ask: >
          Someone proposes a stationary series with $\rho_1 = 0.9$ and
          $\rho_2 = -0.9$. Can it exist?
        choices:
          - text: >
              Yes: every $\rho_k$ is between $-1$ and $1$, which is all a
              correlation needs.
            feedback: >
              That is necessary for each lag alone, not for the lags together.
              The numbers have to be consistent with one another too.
          - text: >
              No: if each day tracks the next one closely, days two apart must
              track each other too.
            correct: true
            feedback: >
              Right. $x_1$ moves with $x_2$ and $x_2$ moves with $x_3$, so
              $x_1$ cannot move strongly against $x_3$. The next computation
              shows the contradiction in numbers.
          - text: >
              Only if the series is not Gaussian.
            feedback: >
              The problem is in the second moments alone, and no choice of
              distribution repairs those. Any series with these correlations
              would need a negative variance somewhere.
        feedback: >
          The correlations of $(x_1, x_2, x_3)$ have to fit together as one
          correlation matrix, and a variance is where an inconsistency shows.
      - ask: >
          With $\gamma_0 = 1$, compute $\operatorname{Var}(x_1 - x_2 + x_3)$
          from these proposed correlations.
        expects: "-2.4"
        hint: >
          Three variances of $1$, plus twice each pairwise covariance with its
          sign: the pairs $(1,2)$ and $(2,3)$ are at lag $1$, the pair $(1,3)$
          at lag $2$.
        feedback: >
          $3 + 2(-1)(0.9) + 2(-1)(0.9) + 2(1)(-0.9) = 3 - 1.8 - 1.8 - 1.8 =
          -2.4$. A variance cannot be negative, so no series has this ACF. The
          matrix with entries $\rho_{|i-j|}$ is the correlation matrix of
          $(x_1, \dots, x_n)$ and must be positive semidefinite, which is
          exactly the statement that no such combination has negative variance.

      - part: What the shape is telling you
        ask: >
          The spread's correlogram reads $1, 0.6, 0.3$ and then exactly $0$ at
          every later lag. What does the hard zero after lag $2$ say about a
          shock to the spread?
        choices:
          - text: >
              Its influence fades geometrically but never quite reaches zero.
            feedback: >
              That would show up as a correlogram that keeps shrinking by a
              constant factor, $0.6, 0.36, 0.22, \dots$, never landing on $0$.
              Here it lands on $0$ and stays.
          - text: >
              It is felt for exactly two more periods and then gone.
            correct: true
            feedback: >
              Right. Values more than two days apart share no shock at all, so
              the memory has a finite window. That is the signature of a moving
              average; geometric decay is the signature of an autoregression.
          - text: >
              It is permanent, since the first two lags are large.
            feedback: >
              A permanent shock would keep every lag near $1$ for dozens of
              lags, a correlogram that barely falls. This one is $0$ from lag
              $3$ on.
        feedback: >
          Three shapes cover most of what you will see: a hard cut-off means a
          finite window of shocks, geometric decay means each day remembers a
          fixed fraction of the last, and a crawl that never dies means no
          stationarity at all.

  - node: quant-statistics.time-series.sample-acf
    hook: >
      In practice you never see $\rho_k$ itself, only its noisy estimate, and
      knowing which spikes to trust versus ignore is what separates a real
      finding from a screen full of noise.
    explanation: >
      $\hat{\rho}_k$ uses the *same* denominator — the full-sample sum of
      squared deviations — at every lag, rather than a lag-specific one; that
      shared normalization is exactly what keeps the estimated correlogram
      positive semidefinite the way a legal ACF must be. Under the null that
      the data are iid noise, each fixed $\hat{\rho}_k$ behaves like a mean of
      roughly $n$ nearly-independent product terms, so it's approximately
      $N(0, 1/n)$ — the same $1/\sqrt{n}$ shrinkage that governs any sample
      mean, applied here to a correlation instead.

      The two cautions matter more than the formula. The bands are pointwise:
      testing twenty lags against a 95% band means roughly one spike escapes
      by pure chance even under true white noise, so a single spike proves
      nothing on its own — a joint test across the first several lags (the
      Ljung–Box idea) is what actually distinguishes signal from a multiple-
      comparisons accident. And $\hat{\rho}_k$ gets both noisier and biased
      toward zero as $k$ grows toward $n$, since fewer terms remain in the sum
      and they all share the same estimated mean $\bar{x}$ — a "clean zero" at
      a large lag is weaker evidence than the same value at lag $1$.
    worked: >
      With $n = 100$ observations, the band is $\pm 1.96/\sqrt{100} =
      \pm 0.196$. An observed $\hat{\rho}_1 = 0.15$ sits inside that band —
      indistinguishable from noise on its own, even though $0.15$ "looks"
      nonzero. An observed $\hat{\rho}_5 = 0.22$ would clear the band by
      itself, but with five lags tested that single crossing is exactly the
      kind of lone spike a joint test is needed to confirm before trusting it.
    interview: >
      "You ran an ACF on 100 days of returns and got $\hat{\rho}_1 = 0.15$ —
      is that real?" wants the band computed on the spot ($\pm0.196$), the
      observation that $0.15$ falls inside it, and a mention that a joint test
      is the right tool if several lags are being eyeballed at once.
    pitfalls: >
      Calling a single spike outside the pointwise band a discovery without a
      joint test across the lags actually being scanned. Trusting
      $\hat{\rho}_k$ at $k$ close to $n$ as strongly as $\hat{\rho}_1$, when
      it's both noisier and biased toward zero by construction.
    recap: >
      Sample autocorrelations sit inside $\pm 2/\sqrt{n}$ under pure noise,
      but the bands are pointwise — judge a pattern jointly, because one
      isolated spike in twenty is free.
    dialogue:
      - part: One pair of days, one correlation
        teach: >
          Six days of a desk's P&L, in thousands: $2, 6, 4, 8, 2, 2$. The mean
          is $4$, the deviations from it are $-2, 2, 0, 4, -2, -2$, and the sum
          of their squares is $32$. Only one pair of days is five apart, the
          first and the last, and a colleague wants the lag-$5$
          autocorrelation from it.
      - ask: >
          The colleague averages the lag-$5$ products over the one pair he has
          and divides by the average square, $32/6$. What number does he get?
        expects: "0.75"
        hint: >
          The one product is the first deviation times the last.
        feedback: >
          $(-2)(-2) = 4$, and $4/(32/6) = 24/32 = 0.75$: a strong correlation,
          read off two numbers that happen to share a sign.
      - ask: >
          The standard estimator instead divides the sum of the lag-$k$
          products by the full sum of squares, $32$, at every lag. What does it
          give at lag $5$?
        expects: "0.125"
        hint: >
          Same numerator, different denominator.
        feedback: >
          $4/32 = 0.125$. The estimator is
          $\hat{\rho}_k = \sum_{t=1}^{n-k}(x_t - \bar{x})(x_{t+k} - \bar{x})$
          divided by $\sum_{t=1}^{n}(x_t - \bar{x})^{2}$, with the same
          denominator at every lag.
      - ask: >
          Which of the two lag-$5$ numbers would you rather report?
        choices:
          - text: >
              $0.75$: it uses the right number of terms for that lag.
            feedback: >
              It claims a strong correlation from a single pair of days, two
              numbers that happen to share a sign. Lag-specific denominators
              let the far lags swing wildly, and the resulting set of
              correlations need not even be a legal correlation matrix.
          - text: >
              $0.125$: the shared denominator shrinks the far lags, where there
              is almost no data.
            correct: true
            feedback: >
              Right. Using the same denominator at every lag biases the far
              lags toward zero, which is the honest direction when one pair is
              all you have, and it keeps the estimated correlogram positive
              semidefinite.
          - text: >
              Either: they agree once the sample is large.
            feedback: >
              They agree at lags that are a small fraction of $n$. At a lag
              that is most of the sample, as here, they differ by a factor of
              six and neither is worth much.
        feedback: >
          The same denominator at every lag is a deliberate choice. Read the
          cost too: once $k$ is an appreciable fraction of $n$, a sample
          autocorrelation is noisy and pulled toward zero, so a small value
          there proves little.

      - part: Is the number real
        teach: >
          A strategist computes $\hat{\rho}_1 = 0.05$ on $400$ daily returns and
          calls it a signal. Before you agree, you need to know how large
          $\hat{\rho}_1$ would come out if the returns were pure iid noise.
      - reflect: >
          Under iid noise, $\hat{\rho}_1$ is essentially an average of about $n$
          products of neighbouring standardised values. What is the mean of
          each product, roughly how big is its spread, and what does that make
          the typical size of $\hat{\rho}_1$?
        hint: >
          Think of the standard error of any sample mean.
        answer: >
          Each product of two independent standardised values has mean $0$ and
          variance about $1$, and neighbouring products are uncorrelated. An
          average of $n$ such terms has standard deviation about $1/\sqrt{n}$,
          so pure noise produces sample autocorrelations of size
          $1/\sqrt{n}$ without any dependence at all.
      - teach: >
          That is the yardstick. Under the iid null, $\hat{\rho}_k$ is
          approximately $N(0, 1/n)$ for each fixed $k \ge 1$, which gives the
          standard bands $\pm 1.96/\sqrt{n} \approx \pm 2/\sqrt{n}$. A bar inside
          them is indistinguishable from noise.
      - ask: >
          What is the $\pm 1.96/\sqrt{n}$ band for the strategist's
          $n = 400$?
        expects: "0.098"
        tolerance: 0.0005
        hint: >
          $\sqrt{400} = 20$.
        feedback: >
          $1.96/20 = 0.098$, so pure noise routinely produces lag-$1$ values up
          to about $\pm 0.1$ on this sample.
      - ask: >
          So what do you tell the strategist about $0.05$?
        choices:
          - text: >
              It is real but small; trade it at a small size.
            feedback: >
              Nothing here says it is real. Half the band's width is exactly
              what iid noise hands you on $400$ days.
          - text: >
              It is inside the band, so this sample cannot tell it from noise.
            correct: true
            feedback: >
              Right. $0.05$ is about one standard error, $0.05 \times 20 = 1$.
              That is not evidence of anything.
          - text: >
              It proves the returns are independent.
            feedback: >
              Failing to reject is not proof of the null, and the ACF only sees
              linear dependence in any case. The returns could be dependent in
              ways this number cannot show.
        feedback: >
          Compute the band before you read the bar. The interview answer is
          the band, the comparison, and the verdict, in that order.
      - ask: >
          Suppose the true lag-$1$ autocorrelation really were $0.05$. How many
          observations would you need before $0.05$ sits right at the
          $\pm 2/\sqrt{n}$ band?
        expects: "1600"
        hint: >
          Solve $2/\sqrt{n} = 0.05$.
        feedback: >
          $\sqrt{n} = 2/0.05 = 40$, so $n = 1600$: more than six years of daily
          data just to reach the edge of detection. Small autocorrelations are
          expensive to see.

      - part: Many bars, one band
        ask: >
          You plot lags $1$ to $60$ of $900$ observations of genuine iid noise
          against the $95\%$ band, so each bar escapes it with probability
          $0.05$. Treating the $60$ bars as independent, what is the
          probability that at least one pierces the band?
        expects: "0.954"
        tolerance: 0.005
        hint: >
          Take the complement: all $60$ stay inside.
        feedback: >
          $1 - 0.95^{60} = 1 - 0.046 = 0.954$. A clean screen of white noise is
          the rare event.
      - ask: >
          On those $900$ observations the band is $\pm 1.96/30 \approx
          \pm 0.065$. Every bar sits inside it except $\hat{\rho}_{37} = 0.07$.
          What is the reading?
        choices:
          - text: >
              A real effect at lag $37$, significant at $5\%$.
            feedback: >
              The $5\%$ is per bar. Across $60$ bars, noise alone hands you
              about three such spikes; one is fewer than chance predicts.
          - text: >
              Nothing yet: test the lags jointly before believing a lone spike.
            correct: true
            feedback: >
              Right. A lone spike barely outside the band, at a lag with no
              story behind it, is exactly what a pointwise band hands you for
              free.
          - text: >
              The band is too narrow, so recompute it with $n = 863$.
            feedback: >
              Using $n - k$ in the band changes $0.065$ only to about $0.067$,
              which leaves the verdict where it was. The issue is how many bars
              you looked at, not the width of each one.
        feedback: >
          The bands are pointwise. A portmanteau test such as Ljung–Box
          combines the first $m$ squared sample autocorrelations into one
          statistic and asks whether they are jointly too large for noise,
          which is the question you were actually asking.

  - node: quant-statistics.time-series.ar1
    hook: >
      AR(1) is the workhorse model behind "is this spread mean-reverting" —
      pairs trades, inventory control, overnight basis — and its stationarity
      condition is the one number that decides whether the whole setup even
      makes sense.
    explanation: >
      Unrolling the recursion $x_t = c + \phi x_{t-1} + \varepsilon_t$
      backward gives $x_t - \mu = \sum_{j\ge0}\phi^{j}\varepsilon_{t-j}$: today's
      value is a weighted sum of every past shock, each one discounted by
      $\phi^{j}$. That sum is exactly why $|\phi| < 1$ is required for
      stationarity and not just a technical footnote — the variance it implies
      is $\sigma^{2}\sum_j \phi^{2j}$, a geometric series that converges only
      when $|\phi| < 1$. Push $\phi$ toward $1$ and old shocks stop fading, the
      sum stops converging, and the whole notion of a fixed unconditional
      variance collapses; that boundary is exactly where the next few nodes
      live.

      The constant $c$ is the most common trap: it is not the series' mean. Take
      expectations of the recursion at the stationary solution,
      $\mu = c + \phi\mu$, and solving gives $\mu = c/(1-\phi)$ — the mean is
      $c$ scaled up by how persistent the series is. Sign of $\phi$ carries
      real meaning too: $\phi>0$ means a shock's effect fades but keeps its
      sign for a while (persistence), $\phi<0$ means it fades while flipping
      sign every period (alternation), and $\phi=0$ collapses back to plain
      white noise.
    worked: >
      Take $c=1$, $\phi=-0.6$, $\sigma=2$. The mean is
      $\mu = 1/(1-(-0.6)) = 1/1.6 = 0.625$, and the variance is
      $\sigma^{2}/(1-\phi^{2}) = 4/(1-0.36) = 4/0.64 = 6.25$ — stationary despite
      the negative coefficient, and the series alternates around $0.625$ rather
      than drifting.
    interview: >
      "How would you model a mean-reverting overnight spread?" wants AR(1)
      written down immediately, with $\phi$ named as the persistence parameter,
      $|\phi|<1$ stated as the stationarity condition, and $c/(1-\phi)$ — not
      $c$ — named as the level it reverts to.
    pitfalls: >
      Quoting $c$ itself as "the mean" instead of $c/(1-\phi)$. Assuming a
      negative $\phi$ signals instability — it's still stationary for any
      $|\phi|<1$, it just alternates sign instead of persisting. Plugging
      $\phi=1$ or $\phi=1.2$ into $\sigma^{2}/(1-\phi^{2})$ and reporting a
      negative or infinite "variance" as if it meant something.
    recap: >
      One lag of memory plus fresh noise, stationary exactly when $|\phi|<1$,
      with mean $c/(1-\phi)$ (never $c$ itself) and variance
      $\sigma^{2}/(1-\phi^{2})$.
    dialogue:
      - part: An inventory that sheds and refills
        teach: >
          A market maker's end-of-day inventory, in lots, follows
          $x_t = 6 + 0.7x_{t-1} + \varepsilon_t$: she works off $30\%$ of
          yesterday's position, a steady client flow adds $6$ lots, and random
          flow $\varepsilon_t$ adds noise of variance $9$, uncorrelated with
          everything before it. She starts flat, $x_0 = 0$.
      - ask: >
          What is her expected inventory at the end of day $2$?
        expects: "10.2"
        hint: >
          Take expectations one day at a time; the noise contributes $0$.
        feedback: >
          Day $1$: $6 + 0.7 \times 0 = 6$. Day $2$: $6 + 0.7 \times 6 = 10.2$.
          It is still climbing, by less each day.
      - ask: >
          Eventually the expected inventory stops changing. At what level does
          it settle?
        expects: "20"
        hint: >
          A level $\mu$ that no longer changes must satisfy $\mu = 6 + 0.7\mu$.
        feedback: >
          $\mu = 6 + 0.7\mu$ gives $0.3\mu = 6$, so $\mu = 20$. Not $6$: the
          constant is what flows in each day, and the level settles where the
          $30\%$ she works off, $0.3 \times 20 = 6$, exactly matches it. The
          long-run mean is the constant divided by $1 - 0.7$.

      - part: How far it wanders
        reflect: >
          Write the deviation $x_t - 20$ in terms of the shocks by substituting
          the recursion into itself again and again. What weight does a shock
          from $j$ days ago carry today, and under what condition does the
          variance of that sum stay finite?
        hint: >
          The centred recursion is $x_t - 20 = 0.7(x_{t-1} - 20) + \varepsilon_t$.
        answer: >
          Unrolling gives $x_t - 20 = \varepsilon_t + 0.7\varepsilon_{t-1} +
          0.7^{2}\varepsilon_{t-2} + \dots$, so a shock from $j$ days ago still
          counts $0.7^{j}$ of itself. The shocks are uncorrelated, so the
          variance is $9(1 + 0.7^{2} + 0.7^{4} + \dots)$, a geometric series
          that converges because $0.7^{2} < 1$. With a coefficient of size $1$
          or more the old shocks never fade and the sum diverges.
      - teach: >
          This is the AR(1) process: $x_t = c + \phi x_{t-1} + \varepsilon_t$,
          with $\varepsilon_t$ white noise of variance $\sigma^{2}$ uncorrelated
          with the past. A stationary solution exists, and is unique, exactly
          when $|\phi| < 1$. Its mean is $\mu = c/(1-\phi)$, and it can be
          written $x_t - \mu = \sum_{j \ge 0}\phi^{j}\varepsilon_{t-j}$.
      - ask: >
          Sum the geometric series. What is the stationary variance of the
          inventory, in squared lots?
        expects: "17.65"
        tolerance: 0.005
        hint: >
          $1 + \phi^{2} + \phi^{4} + \dots = 1/(1-\phi^{2})$.
        feedback: >
          $9/(1 - 0.49) = 9/0.51 \approx 17.65$, a standard deviation of about
          $4.2$ lots around the mean of $20$. In general
          $\operatorname{Var}(x_t) = \sigma^{2}/(1-\phi^{2})$.
      - ask: >
          A shortcut gives the same answer: take variances of both sides of the
          recursion to get $\gamma_0 = \phi^{2}\gamma_0 + \sigma^{2}$. Which
          fact lets you drop the cross term between $\phi x_{t-1}$ and
          $\varepsilon_t$?
        choices:
          - text: >
              $\varepsilon_t$ has mean $0$.
            feedback: >
              A mean of $0$ does not make a covariance vanish: if today's flow
              tended to be large when yesterday's inventory was large, the cross
              term would be positive whatever the mean of the flow.
          - text: >
              $\varepsilon_t$ is uncorrelated with $x_{t-1}$.
            correct: true
            feedback: >
              Right. Today's shock is uncorrelated with the past, and
              $x_{t-1}$ is built entirely from past shocks.
          - text: >
              The constant $c$ has no variance.
            feedback: >
              True, and it is why $c$ drops out of the variance, but $c$ is not
              in the cross term. The term in question is
              $2\phi\operatorname{Cov}(x_{t-1}, \varepsilon_t)$.
        feedback: >
          The shortcut also assumes $\operatorname{Var}(x_t) =
          \operatorname{Var}(x_{t-1})$, which is stationarity itself. It holds
          only when a stationary solution exists to begin with.
      - ask: >
          A client dumps an extra $10$ lots on her today. In expectation, how
          many of those $10$ lots are still in her inventory $3$ days later?
        expects: "3.43"
        tolerance: 0.005
        hint: >
          A shock keeps $\phi^{j}$ of itself after $j$ days.
        feedback: >
          $10 \times 0.7^{3} = 10 \times 0.343 = 3.43$. The shock fades but
          never vanishes in finite time.

      - part: Where the formula stops meaning anything
        ask: >
          A colleague fits a second book and gets $\phi = 1.05$ with
          $\sigma^{2} = 9$, and reports a variance of $9/(1 - 1.1025) \approx
          -87.8$. What is going on?
        choices:
          - text: >
              The variance is negative because the book tends to be short.
            feedback: >
              A variance is never negative, whatever sign the positions take.
              The number is not a variance of anything.
          - text: >
              The variance is large, and the sign is a numerical artefact.
            feedback: >
              The sign is not noise. At $\phi = 1.05$ the weights $\phi^{j}$ on
              old shocks grow, the geometric series diverges, and no finite
              variance exists to be estimated.
          - text: >
              No stationary solution exists, so the formula has nothing to
              describe.
            correct: true
            feedback: >
              Right. The formula came from assuming a constant $\gamma_0$; with
              $|\phi| > 1$ there is none, and solving the equation anyway
              produces nonsense.
        feedback: >
          $|\phi| < 1$ is not a footnote. It is the condition under which the
          mean, the variance and the unrolled sum all exist.
      - teach: >
          A third book alternates: $x_t = 6 - 0.7x_{t-1} + \varepsilon_t$. Its
          trader over-corrects every position, so a long day tends to be
          followed by a short one.
      - ask: >
          The third book is $10$ lots above its mean today. In expectation, how
          far above its mean is it tomorrow? Give a signed number.
        expects: "-7"
        hint: >
          The deviation from the mean is multiplied by $\phi$ each day.
        feedback: >
          $-0.7 \times 10 = -7$: seven lots *below* its mean. The day after it
          is $+4.9$. The deviation shrinks and flips sign each day, which is
          alternation, not instability: $|\phi| = 0.7 < 1$.
      - ask: >
          What is the third book's long-run mean, to two decimals?
        expects: "3.53"
        tolerance: 0.005
        hint: >
          The mean is $c/(1 - \phi)$, and here $\phi$ is negative.
        feedback: >
          $6/(1 - (-0.7)) = 6/1.7 \approx 3.53$. A negative $\phi$ makes the
          denominator bigger than $1$, so the mean sits below $c$, the mirror
          image of the first book, whose mean of $20$ sat far above it.

  - node: quant-statistics.time-series.ar1-acf
    hook: >
      Geometric decay in the ACF plus a single spike in the PACF is the AR(1)
      fingerprint — the pattern that lets you read $\phi$ straight off a plot
      without fitting anything.
    explanation: >
      Multiply the centred recursion $(x_t-\mu) = \phi(x_{t-1}-\mu)+\varepsilon_t$
      by $(x_{t-k}-\mu)$ and take expectations. The $\varepsilon_t$ term is
      uncorrelated with anything at or before time $t-1$, so it contributes
      nothing, leaving $\gamma_k = \phi\gamma_{k-1}$ for every $k\ge1$ — the
      Yule–Walker equation. That one-step recursion telescopes immediately:
      $\gamma_1=\phi\gamma_0$, $\gamma_2=\phi\gamma_1=\phi^{2}\gamma_0$, and in
      general $\gamma_k=\phi^{k}\gamma_0$, so dividing through gives
      $\rho_k=\phi^{k}$.

      This is why the ACF never actually reaches zero — each lag is a smaller
      copy of the last, decaying but never cut off, unlike a finite-memory
      process. The PACF behaves oppositely for a reason worth internalizing:
      it measures what lag $k$ adds *after already conditioning on* everything
      between it and today. Since the recursion only ever reaches one step
      back, conditioning on yesterday already captures everything the model
      knows; older lags add exactly nothing once yesterday is accounted for,
      so the PACF is $\phi$ at lag $1$ and exactly $0$ afterward.
    worked: >
      For $\phi=-0.4$: $\rho_1=-0.4$, $\rho_2=0.16$, $\rho_3=-0.064$ — geometric
      decay in magnitude, alternating in sign. The PACF is $-0.4$ at lag $1$
      and $0$ at every lag after, even though the ACF itself never touches
      zero.
    interview: >
      "The ACF alternates in sign and decays geometrically — what's the
      model, and what's $\phi$?" wants "AR(1) with negative $\phi$," with
      $\phi$ read directly off $\rho_1$ rather than guessed from later lags.
    pitfalls: >
      Reading $\rho_2$ itself as $\phi$ instead of $\phi^{2}$ — recovering
      $\phi$ from a lag beyond the first needs a root. Expecting the ACF to
      hit exactly zero at some finite lag the way an MA process's does; an
      AR(1)'s ACF only ever decays, it never cuts off.
    recap: >
      $\rho_k=\phi^{k}$: geometric decay in the ACF from one Yule–Walker step,
      paired with a single nonzero PACF spike at lag $1$ — the fingerprint of
      exactly one lag of memory.
    dialogue:
      - part: Predict the correlogram
        teach: >
          A pairs desk models the daily deviation of a spread from its fair
          value as $x_t = 0.7x_{t-1} + \varepsilon_t$, where $\varepsilon_t$ is
          white noise uncorrelated with every earlier day. The series is
          stationary, so it has one variance $\gamma_0$ on every day.
      - ask: >
          What is the correlation between today's deviation and yesterday's?
        expects: "0.7"
        hint: >
          Take the covariance of both sides of the recursion with $x_{t-1}$.
        feedback: >
          $\operatorname{Cov}(x_t, x_{t-1}) = 0.7\operatorname{Var}(x_{t-1}) +
          \operatorname{Cov}(\varepsilon_t, x_{t-1}) = 0.7\gamma_0 + 0$, and
          dividing by $\gamma_0$ gives $\rho_1 = 0.7$.
      - ask: >
          Now predict the correlation between today's deviation and the one two
          days ago.
        choices:
          - text: >
              $0$: the equation only mentions yesterday.
            feedback: >
              The equation mentions only yesterday, but yesterday itself was
              built from the day before. Two days ago reaches today through
              yesterday, so the correlation is not $0$.
          - text: >
              $0.7$: the same memory carries over every day.
            feedback: >
              Each step passes on only $0.7$ of the deviation, so two steps pass
              on $0.7$ of $0.7$. A correlation that stayed at $0.7$ at every lag
              would mean shocks never fade.
          - text: >
              $0.49$: two days of passing on $0.7$.
            correct: true
            feedback: >
              Right. The influence of two days ago arrives indirectly, through
              yesterday, and is shrunk by $0.7$ at each step.
        feedback: >
          A one-lag equation does not mean a one-lag correlogram. The question
          is how to make "shrunk by $\phi$ at each step" exact.

      - part: Why each lag is a copy of the last
        reflect: >
          You want $\gamma_k = \operatorname{Cov}(x_t, x_{t-k})$. Replace $x_t$
          by $\phi x_{t-1} + \varepsilon_t$ inside that covariance. What happens
          to each of the two pieces, and what relation between $\gamma_k$ and
          $\gamma_{k-1}$ falls out?
        hint: >
          For $k \ge 1$, $x_{t-k}$ lies in the past of $\varepsilon_t$.
        answer: >
          $\operatorname{Cov}(\phi x_{t-1} + \varepsilon_t, x_{t-k}) =
          \phi\operatorname{Cov}(x_{t-1}, x_{t-k}) +
          \operatorname{Cov}(\varepsilon_t, x_{t-k})$. The first piece is
          $\phi\gamma_{k-1}$, because $x_{t-1}$ and $x_{t-k}$ are $k - 1$ apart.
          The second is $0$, because today's shock is uncorrelated with the
          past. So $\gamma_k = \phi\gamma_{k-1}$: each lag is the previous one
          times $\phi$.
      - teach: >
          That relation is the Yule–Walker equation for the AR(1). It
          telescopes: $\gamma_k = \phi^{k}\gamma_0 =
          \phi^{k}\sigma^{2}/(1-\phi^{2})$, and dividing by $\gamma_0$,
          $\rho_k = \phi^{k}$ for every $k \ge 0$. The correlogram of a
          stationary AR(1) decays geometrically, and alternates in sign when
          $\phi < 0$.
      - ask: >
          What is $\rho_4$ for the spread?
        expects: "0.2401"
        hint: >
          Raise the coefficient to the fourth power.
        feedback: >
          $0.7^{4} = 0.2401$. The correlogram so far reads
          $1, 0.7, 0.49, 0.343, 0.2401$.
      - ask: >
          At what lag does the spread's autocorrelation first fall below $0.1$?
        expects: "7"
        hint: >
          Solve $0.7^{k} < 0.1$, or keep multiplying by $0.7$.
        feedback: >
          $0.7^{6} \approx 0.118$ and $0.7^{7} \approx 0.082$, so lag $7$. It
          gets small, but $0.7^{k}$ is never exactly $0$: an AR(1) correlogram
          tails off, it never cuts off.

      - part: What older days add once you know yesterday
        ask: >
          You already know yesterday's deviation and want the best linear
          forecast of today's. Does also knowing the deviation from two days
          ago help?
        choices:
          - text: >
              Yes: $\rho_2 = 0.49$ is a large correlation.
            feedback: >
              That correlation is real, but it all runs through yesterday.
              Once yesterday is known, the day before has nothing left to say
              that yesterday did not already say.
          - text: >
              No: today is $0.7$ times yesterday plus a shock unrelated to the
              past.
            correct: true
            feedback: >
              Right. Given $x_{t-1}$, the only unknown left in today is
              $\varepsilon_t$, and nothing in the past correlates with it.
          - text: >
              Only when $\phi$ is negative.
            feedback: >
              The sign changes the shape of the correlogram, not the structure
              of the equation. Today depends on the past only through
              yesterday whatever the sign of $\phi$.
        feedback: >
          The correlation at lag $2$ and the *extra* information at lag $2$ are
          different questions.
      - teach: >
          The partial autocorrelation at lag $k$ measures what $x_{t-k}$ adds
          after conditioning on every day between it and today. For an AR(1) it
          equals $\phi$ at lag $1$ and $0$ at every later lag. The ACF tails off
          and the PACF cuts off: that pair is the fingerprint of one lag of
          memory.
      - ask: >
          With plenty of data, you regress today's deviation on both yesterday's
          and the day before's. What coefficient do you expect on the day
          before's?
        expects: "0"
        hint: >
          Write down what today is equal to.
        feedback: >
          $0$, while the coefficient on yesterday is $0.7$. That second
          coefficient is the lag-$2$ partial autocorrelation, estimated by
          regression.

      - part: Reading the coefficient back off a plot
        ask: >
          Another spread's correlogram reads $-0.6, 0.36, -0.216$ at lags $1$
          to $3$. Assuming an AR(1), what is $\phi$?
        expects: "-0.6"
        hint: >
          Read $\phi$ off lag $1$, and keep its sign.
        feedback: >
          $\rho_1 = \phi = -0.6$, and the check is $(-0.6)^{2} = 0.36$ and
          $(-0.6)^{3} = -0.216$. The alternating signs are what a negative
          $\phi$ looks like.
      - ask: >
          A third spread's sample correlogram reads $0.6, 0.08, 0.03, 0.01$,
          with bands of about $\pm 0.05$. Is an AR(1) a good model?
        choices:
          - text: >
              Yes, with $\phi = 0.6$, read off lag $1$.
            feedback: >
              An AR(1) with $\phi = 0.6$ would put $\rho_2$ at $0.36$ and
              $\rho_3$ at $0.216$. The sample has $0.08$ and $0.03$, far below
              what the model predicts.
          - text: >
              Yes: the autocorrelations decay, which is what an AR(1) does.
            feedback: >
              They decay, but not geometrically. Geometric decay means each lag
              is the previous one times the same $\phi$; here the ratio jumps
              from $0.6$ to about $0.13$.
          - text: >
              No: after lag $1$ the correlogram drops into the noise instead of
              decaying like $0.6^{k}$.
            correct: true
            feedback: >
              Right. A memory that stops dead after one lag is a finite window
              of shocks, the signature of a moving average, which is a
              different model.
        feedback: >
          $\rho_k = \phi^{k}$ is a testable claim, not just a formula: lag $1$
          fixes $\phi$, and every later lag then has to agree with it.

  - node: quant-statistics.time-series.half-life
    hook: >
      Quoting a bare $\phi$ means nothing to anyone without a calculator handy
      — converting it to "days until half the dislocation is gone" is the
      version every desk actually uses, and interviewers expect it computed
      live.
    explanation: >
      From the previous node, a shock is worth exactly $\phi^{k}$ of itself
      after $k$ periods. Setting $\phi^{h}=1/2$ and taking logs of both sides
      gives $h\ln\phi = \ln(1/2)$, so $h = \ln2/\ln(1/\phi)$ — writing the
      denominator as $\ln(1/\phi)=-\ln\phi$ keeps it positive for the
      $0<\phi<1$ case that matters in practice.

      A useful shortcut for $\phi$ near $1$: since $\ln(1/\phi)\approx1-\phi$
      for $\phi$ close to $1$, the half-life is approximately
      $0.693/(1-\phi)$ — no logarithm needed, just how far $\phi$ sits below
      $1$. That approximation is only good near the boundary, though; the
      exact formula and the shortcut diverge once $\phi$ drifts away from $1$,
      which is worth checking before leaning on the shortcut under time
      pressure.
    worked: >
      $\phi=0.8$: exactly, $h = \ln2/\ln(1/0.8) = 0.6931/0.2231 \approx 3.11$
      periods. The near-$1$ shortcut would give $0.693/(1-0.8)=3.47$ —
      already off by more than 10%, showing the approximation degrading once
      $\phi$ isn't close to the boundary.
    interview: >
      "Your cointegrated spread has $\phi=0.95$ daily — how fast does it mean
      revert?" wants $h=\ln2/\ln(1/0.95)\approx13.5$ days computed on the spot,
      stated in days because the sampling frequency was given.
    pitfalls: >
      Inverting the formula backwards — computing $\ln\phi/\ln2$ instead of
      $\ln2/\ln(1/\phi)$ — which silently flips the sign. Using the near-$1$
      shortcut $0.693/(1-\phi)$ for a $\phi$ that isn't actually close to $1$,
      such as $0.5$, where it's a poor approximation. Stating a half-life
      without naming the time unit the data was sampled at.
    recap: >
      $h=\ln2/\ln(1/\phi)$ turns a reversion coefficient into a number of
      periods — about $3.1$ for $\phi=0.8$, and always report the sampling
      unit alongside it.
    dialogue:
      - part: Waiting out a dislocation
        teach: >
          A basis trade opens when the spread is $40$ basis points away from
          its fair value. The spread follows a stationary AR(1) on daily data
          with $\phi = 0.85$, so in expectation each day keeps $85\%$ of the
          remaining dislocation. Your risk manager asks how long until half of
          it is gone.
      - ask: >
          In expectation, how many basis points of the dislocation remain after
          $2$ days?
        expects: "28.9"
        tolerance: 0.005
        hint: >
          Multiply by $0.85$ once per day.
        feedback: >
          $40 \times 0.85^{2} = 40 \times 0.7225 = 28.9$.
      - ask: >
          Keep multiplying. After how many whole days is less than half, $20$
          basis points, left?
        expects: "5"
        hint: >
          $0.85^{4} \approx 0.522$.
        feedback: >
          After $4$ days $40 \times 0.522 \approx 20.9$ remains, just over half;
          after $5$ days $40 \times 0.444 \approx 17.7$. So the halfway point
          falls between day $4$ and day $5$. That took five multiplications,
          and a spread with $\phi = 0.995$ would take over a hundred.

      - part: Solving for the exponent
        reflect: >
          You were solving $0.85^{h} = 1/2$ for $h$ by trying $h = 1, 2, 3,
          \dots$. What single operation turns the unknown exponent into
          something you can divide by, and what formula for $h$ does it give?
        hint: >
          Which function turns a power into a product?
        answer: >
          Take logarithms: $h\ln 0.85 = \ln(1/2)$, so
          $h = \ln 2/\ln(1/0.85)$. Writing the denominator as $\ln(1/\phi)$
          keeps both logs positive for $0 < \phi < 1$. The trial-and-error
          search was finding the crossing of a curve whose equation you could
          have inverted directly.
      - teach: >
          That is the half-life of mean reversion. A shock to a stationary AR(1)
          is worth $\phi^{k}$ of itself after $k$ periods, so it is half gone
          after $h = \ln 2/\ln(1/\phi)$ periods. Inverted, a target half-life
          fixes the coefficient: $\phi = 2^{-1/h}$. For $\phi = 0.5$ it is
          exactly $1$ period.
      - ask: >
          What is the exact half-life of the basis spread, in days, to two
          decimals?
        expects: "4.27"
        tolerance: 0.005
        hint: >
          $\ln 2 \approx 0.6931$ and $\ln(1/0.85) \approx 0.1625$.
        feedback: >
          $0.6931/0.1625 \approx 4.27$ days, between $4$ and $5$ just as the
          hand count said.
      - ask: >
          A second spread has $\phi = 0.995$ per day. Without a calculator, and
          using $\ln(1/\phi) \approx 1 - \phi$ for $\phi$ near $1$, roughly how
          many days is its half-life?
        expects: "139"
        tolerance: 1
        hint: >
          The denominator becomes $0.005$.
        feedback: >
          $0.693/0.005 \approx 139$ days; the exact value is $138.3$. Near the
          boundary the half-life is about $0.69/(1-\phi)$, so it blows up like
          $1/(1-\phi)$ as $\phi \to 1$.
      - ask: >
          Should you use the same shortcut, $0.693/(1-\phi)$, for a spread with
          $\phi = 0.5$?
        choices:
          - text: >
              Yes: it gives $1.39$ periods, close enough.
            feedback: >
              The exact half-life at $\phi = 0.5$ is $1$ period, since
              $0.5^{1} = 1/2$. The shortcut is off by $39\%$.
          - text: >
              No: $\ln(1/\phi) \approx 1 - \phi$ only holds for $\phi$ near $1$.
            correct: true
            feedback: >
              Right. $\ln 2 = 0.693$ is not close to $1 - 0.5 = 0.5$, so the
              shortcut overstates the half-life. It is a tool for persistent
              spreads only.
          - text: >
              No, because the half-life formula fails for $\phi \le 0.5$.
            feedback: >
              The exact formula works for every $0 < \phi < 1$. It is only the
              approximation to its denominator that degrades.
        feedback: >
          Exact formula always; shortcut only when $\phi$ is within a few
          hundredths of $1$.

      - part: Answering in the right clock
        ask: >
          An intraday spread is fitted on hourly bars with $\phi = 0.98$ per
          hour, and the market is open $6.5$ hours a day. What is its half-life
          in trading days, to two decimals?
        expects: "5.28"
        tolerance: 0.01
        hint: >
          Find the half-life in hours first.
        feedback: >
          $\ln 2/\ln(1/0.98) = 0.6931/0.0202 \approx 34.3$ hours, and
          $34.3/6.5 \approx 5.28$ trading days. The coefficient $0.98$ alone
          sounds slow or fast depending on a clock nobody has stated.
      - ask: >
          Back to the basis spread, $\phi = 0.85$ per day. You resample it
          weekly, every $5$ trading days. What AR(1) coefficient does the
          weekly series have, to four decimals?
        expects: "0.4437"
        tolerance: 0.0005
        hint: >
          A week is five daily steps of shrinking.
        feedback: >
          $0.85^{5} \approx 0.4437$. Its half-life is
          $\ln 2/\ln(1/0.4437) \approx 0.853$ weeks, which is $4.27$ days again.
          The coefficient changed and the fact did not.
      - ask: >
          A colleague's estimate for a third spread comes back $\phi = 1.00$ on
          daily data. What half-life do you quote?
        choices:
          - text: >
              $0$ days: the formula divides by $\ln 1 = 0$.
            feedback: >
              Dividing by zero does not give zero. As $\phi \to 1$ the
              denominator shrinks to $0$ and $h$ grows without bound.
          - text: >
              About $69$ days, as for $\phi = 0.99$.
            feedback: >
              $\phi = 0.99$ is still stationary and does revert, slowly. At
              exactly $1$ nothing reverts at all.
          - text: >
              None: at $\phi = 1$ a shock never decays, so there is no
              half-life.
            correct: true
            feedback: >
              Right. That is the unit-root boundary, where the series stops
              mean-reverting and the trade has no expected exit.
        feedback: >
          The interview answer is a number of periods with its unit attached,
          "about $4.3$ trading days", and the flag that it explodes as $\phi$
          approaches $1$.

  - node: quant-statistics.time-series.forecast
    hook: >
      "You found a statistically significant autocorrelation — is it
      tradeable?" is answered by this node's distinction between $\phi$ and
      $\phi^{2}$, and it's the gap that separates a real edge from a rounding
      error.
    explanation: >
      Take conditional expectations of the recursion one step at a time. Since
      $\varepsilon_{t+1}$ has mean $0$ and is independent of everything known
      at time $t$, $\mathbb{E}[x_{t+1}\mid x_t] = \mu+\phi(x_t-\mu)$ directly
      from the definition. Feeding that back in for the next step,
      $\mathbb{E}[x_{t+2}\mid x_t] = \mu+\phi\left(\mathbb{E}[x_{t+1}\mid x_t]-\mu\right)
      = \mu+\phi^{2}(x_t-\mu)$, and the pattern repeats: the forecast slides
      geometrically back to $\mu$ with weight $\phi^{k}$, and nothing before
      $x_t$ changes the answer once $x_t$ is known.

      The forecast error is the sum of the shocks not yet observed,
      $\sum_{j=0}^{k-1}\phi^{j}\varepsilon_{t+k-j}$, whose variance is
      $\sigma^{2}(1-\phi^{2k})/(1-\phi^{2})$ — starting at $\sigma^{2}$ for a
      one-step forecast and climbing to the full unconditional variance as
      $k\to\infty$, since far enough ahead the conditioning information is
      worth nothing. The one-step case gives the number worth memorizing: the
      correlation between $x_t$ and $x_{t+1}$ is $\phi$, so the *variance
      explained* by the best one-step forecast is $\phi^{2}$, not $\phi$ — a
      significance test can reject $\phi=0$ cleanly while $\phi^{2}$ still
      rounds to nothing.
    worked: >
      $\phi=0.6$, $\sigma^{2}=1$, $k=3$: the forecast weight is
      $\phi^{3}=0.216$, and the error variance is
      $(1-0.6^{6})/(1-0.36) = 0.9533/0.64\approx1.49$ — already close to the
      unconditional variance $1/0.64=1.5625$, three steps out. The one-step
      predictability is $\phi^{2}=0.36$: a real 36% of variance explained.
    interview: >
      "Your daily signal has $\phi=0.1$ with a highly significant t-stat — is
      it tradeable?" wants the candidate to compute $\phi^{2}=0.01$: one
      percent of variance explained, statistically real and economically
      thin, before any transaction costs are even considered.
    pitfalls: >
      Reporting $\phi$ itself, not $\phi^{2}$, as the fraction of variance a
      forecast explains. Conditioning on a longer history "for robustness"
      when only $x_t$ matters under this exact model — every earlier value is
      already summarized in $x_t$.
    recap: >
      The $k$-step forecast is $\mu+\phi^{k}(x_t-\mu)$ with error variance
      climbing to the unconditional variance; predictability is $\phi^{2}$,
      not $\phi$, which is why a significant $\phi$ can still be
      economically negligible.
    dialogue:
      - part: Tomorrow, and the day after
        teach: >
          A desk models daily traded volume in a futures contract, in thousands
          of lots, as $x_t = 4 + 0.5x_{t-1} + \varepsilon_t$, with
          $\varepsilon_t$ white noise of variance $3$ uncorrelated with the
          past. Its long-run mean is $4/(1 - 0.5) = 8$. Today a news day pushed
          volume to $x_t = 14$.
      - ask: >
          What is your best forecast of tomorrow's volume?
        expects: "11"
        hint: >
          Tomorrow's shock has mean $0$ and nothing you know predicts it.
        feedback: >
          $\mathbb{E}[x_{t+1} \mid x_t] = 4 + 0.5 \times 14 = 11$. The shock is
          the only unknown, and its best guess is $0$.
      - ask: >
          What is your best forecast of volume the day after tomorrow?
        choices:
          - text: >
              $4 + 0.5^{2} \times 14 = 7.5$
            feedback: >
              That shrinks the raw level toward $0$, not toward the mean, and
              lands below $8$, as if the news day made a quiet day likely. It is
              the distance from the mean, $14 - 8 = 6$, that shrinks.
          - text: >
              $11$: the best guess for tomorrow is the best guess from then on.
            feedback: >
              The day after is another step of the same recursion, applied to a
              value you now expect to be $11$, and each step pulls toward $8$.
          - text: >
              $4 + 0.5 \times 11 = 9.5$
            correct: true
            feedback: >
              Right. Feed tomorrow's forecast back into the recursion: the
              shock two days out also has mean $0$.
          - text: >
              $8$: past one day the model has nothing to say.
            feedback: >
              The pull toward $8$ is gradual. Today's news is still half felt
              tomorrow and a quarter felt the day after.
        feedback: >
          Forecasts are built by iterating the recursion with every future
          shock replaced by its mean of $0$.

      - part: The pattern in the forecasts
        reflect: >
          Write $14$, $11$ and $9.5$ as the mean $8$ plus something. How does
          the something change from one day to the next, and what is the
          forecast $k$ days ahead?
        hint: >
          The somethings are $6$, $3$ and $1.5$.
        answer: >
          The distance above the mean halves each day: $6$, $3$, $1.5$. So the
          $k$-step forecast is $8 + 0.5^{k}(14 - 8)$, sliding geometrically
          back to the mean. In general it is $\mu + \phi^{k}(x_t - \mu)$, and
          only today's value enters it.
      - teach: >
          That is the minimum-mean-squared-error forecast of a stationary AR(1):
          $\mathbb{E}[x_{t+k} \mid x_t, x_{t-1}, \dots] = \mu +
          \phi^{k}(x_t - \mu)$. Past values before $x_t$ are irrelevant, because
          the recursion reaches only one step back and every future shock is
          uncorrelated with the whole past.
      - ask: >
          What is the forecast of volume $4$ days ahead?
        expects: "8.375"
        hint: >
          $0.5^{4} = 0.0625$.
        feedback: >
          $8 + 0.0625 \times 6 = 8.375$. Four days out, the news day is almost
          forgotten.
      - ask: >
          A trader adds that yesterday's volume was $20$, even bigger than
          today's. How should that change your forecast for tomorrow?
        choices:
          - text: >
              Not at all: given today's $14$, yesterday adds nothing.
            correct: true
            feedback: >
              Right. Under this model everything yesterday had to say about the
              future already passed through today's value.
          - text: >
              Upward: two big days in a row mean a busy regime.
            feedback: >
              That might be true of real volume, but then the model is not an
              AR(1). Under $x_t = 4 + 0.5x_{t-1} + \varepsilon_t$, tomorrow
              depends on the past only through $x_t$.
          - text: >
              Downward: volume fell from $20$ to $14$, so it is trending down.
            feedback: >
              The fall from $20$ to $14$ is already priced in: it is why today
              is $14$. An AR(1) has no momentum term.
        feedback: >
          Conditioning on a longer history buys nothing under an AR(1). If
          older lags do seem to help on real data, that is evidence for a
          bigger model, not a reason to add them to this one.

      - part: How wrong the forecast will be
        ask: >
          What is the variance of the error in tomorrow's forecast?
        expects: "3"
        hint: >
          The forecast gets everything right except one term.
        feedback: >
          The error is exactly tomorrow's shock $\varepsilon_{t+1}$, with
          variance $\sigma^{2} = 3$.
      - ask: >
          What is the variance of the error in the two-day-ahead forecast?
        expects: "3.75"
        hint: >
          Two shocks are unknown: tomorrow's, which also gets passed on with
          weight $0.5$, and the next day's.
        feedback: >
          The error is $\varepsilon_{t+2} + 0.5\varepsilon_{t+1}$, with variance
          $3 + 0.25 \times 3 = 3.75$. In general it is
          $\sigma^{2}(1 - \phi^{2k})/(1 - \phi^{2})$.
      - ask: >
          Where does the forecast error variance end up as the horizon grows
          without bound?
        expects: "4"
        hint: >
          Far enough ahead, what does knowing today tell you?
        feedback: >
          $\sigma^{2}/(1 - \phi^{2}) = 3/0.75 = 4$, the unconditional variance
          of volume. Far enough ahead the forecast is just the mean $8$, and its
          error is just the series' own spread: the model knows nothing the
          histogram did not.

      - part: Significant is not the same as useful
        teach: >
          A researcher finds a lag-$1$ autocorrelation of $0.15$ in $2000$ days
          of a currency's daily returns, and a test rejects $\phi = 0$ with a
          $t$-statistic near $7$.
      - ask: >
          Model the returns as an AR(1). How large would $\phi$ have to be for
          the best one-step forecast to explain $10\%$ of the variance of
          tomorrow's return? Give three decimals.
        expects: "0.316"
        tolerance: 0.0005
        hint: >
          The forecast $\phi x_t$ and tomorrow's return have correlation
          $\phi$. What fraction of variance does a correlation explain?
        feedback: >
          The fraction explained is $\phi^{2}$, so $\phi = \sqrt{0.1} \approx
          0.316$, more than twice the researcher's figure. At $\phi = 0.15$ the
          forecast explains $0.15^{2} = 0.0225$, about $2\%$; the other $98\%$
          of tomorrow's variance is the unforecastable shock. Reading $15\%$ off
          $\phi$ itself overstates the edge almost sevenfold.
      - ask: >
          So is the autocorrelation real and is it tradeable?
        choices:
          - text: >
              Neither: a forecast that explains $2\%$ is just noise.
            feedback: >
              It is statistically real: a $t$-statistic near $7$ does not come
              from noise. Small and real are different properties.
          - text: >
              Real, and worth trading at full size given how significant it
              is.
            feedback: >
              Significance says $\phi$ is not $0$; it says nothing about
              whether $2\%$ of variance survives the bid-ask spread.
          - text: >
              Real, but thin: it explains about $2\%$ of the variance, before
              costs.
            correct: true
            feedback: >
              Right. That is the answer an interviewer wants: the $t$-statistic
              and $\phi^{2}$ quoted side by side.
        feedback: >
          Predictability is $\phi^{2}$, not $\phi$. A long enough sample makes
          almost any $\phi$ significant; only $\phi^{2}$, net of costs, says
          whether it pays.

  - node: quant-statistics.time-series.ma1
    hook: >
      Unlike AR(1), an MA(1) is stationary no matter what $\theta$ is — the
      only real question is which of two mirror-image coefficients actually
      produced the data you're looking at.
    explanation: >
      Expand $x_t-\mu=\varepsilon_t+\theta\varepsilon_{t-1}$ directly.
      $\operatorname{Var}(x_t) = \mathbb{E}[(\varepsilon_t+\theta\varepsilon_{t-1})^{2}]
      = \sigma^{2}+\theta^{2}\sigma^{2}$, since the cross term vanishes by
      independence — giving $\gamma_0=(1+\theta^{2})\sigma^{2}$ with no
      convergence question at all, because it's a sum of exactly two terms
      regardless of $\theta$'s size. The lag-$1$ covariance shares exactly one
      shock, $\varepsilon_{t-1}$, between $x_t$ and $x_{t-1}$, giving
      $\gamma_1=\theta\sigma^{2}$; lag $2$ and beyond share no shock at all, so
      $\gamma_k=0$. The mental model is a sliding window exactly two wide —
      memory that is finite rather than fading.

      The bound $|\rho_1|\le1/2$ is AM–GM in disguise: $1+\theta^{2}\ge2|\theta|$
      for any $\theta$, so $|\theta|/(1+\theta^{2})\le1/2$, with equality only
      at $\theta=\pm1$. Substituting $1/\theta$ for $\theta$ leaves both
      $\gamma_0$ (up to the shared scale) and $\gamma_1$'s ratio unchanged, so
      $\theta$ and $1/\theta$ are indistinguishable from autocovariances alone
      — invertibility, requiring $|\theta|<1$, is the extra condition that
      picks the one root from which the unobserved shocks can actually be
      recovered from observed data.
    worked: >
      $\theta=0.5$: $\gamma_0=1.25\sigma^{2}$, $\gamma_1=0.5\sigma^{2}$, so
      $\rho_1=0.5/1.25=0.4$. Its mirror $\theta=2$ gives the identical
      $\rho_1=2/5=0.4$ — confirming $\theta$ and $1/\theta$ share an ACF, with
      $\theta=0.5$ the invertible root to actually report.
    interview: >
      "The ACF is nonzero at lag $1$ and exactly zero everywhere after — what
      model?" wants "MA(1)" immediately, with $|\rho_1|\le1/2$ named as a
      sanity check on any reported value.
    pitfalls: >
      Fitting $|\theta|>1$ without checking invertibility — it reproduces the
      same ACF as $1/\theta$ but the shocks can't be recovered from history.
      Assuming any $\rho_1\in[-1,1]$ is achievable by some MA(1) — it's capped
      at $1/2$ in magnitude. Calling a series MA(1) from a plot that merely
      looks small beyond lag $1$ rather than being genuinely zero there.
    recap: >
      A two-wide window of shocks: always stationary regardless of $\theta$,
      ACF exactly zero beyond lag $1$, and $|\rho_1|$ capped at $1/2$, with
      $\theta$ and $1/\theta$ indistinguishable except by invertibility.
    dialogue:
      - part: A fund that marks with a lag
        teach: >
          A fund holds illiquid bonds and marks them slowly. Each month's
          reported return is that month's true shock plus $0.6$ of last month's:
          $x_t = \mu + \varepsilon_t + 0.6\varepsilon_{t-1}$, with the true
          shocks $\varepsilon_t$ white noise of variance $4$ (in squared
          percentage points).
      - ask: >
          What is the variance of a reported monthly return?
        expects: "5.44"
        hint: >
          The two shocks are uncorrelated, so their variances add.
        feedback: >
          $4 + 0.6^{2} \times 4 = 4 + 1.44 = 5.44$. The cross term vanishes
          because $\varepsilon_t$ and $\varepsilon_{t-1}$ are uncorrelated.
      - ask: >
          What is the covariance between this month's and last month's
          reported returns?
        expects: "2.4"
        hint: >
          Which shock appears in both $x_t$ and $x_{t-1}$?
        feedback: >
          Only $\varepsilon_{t-1}$ appears in both: with weight $0.6$ in $x_t$
          and weight $1$ in $x_{t-1}$. So the covariance is
          $0.6 \times 1 \times 4 = 2.4$.
      - ask: >
          What is the covariance between this month's reported return and the
          one two months ago?
        choices:
          - text: >
              $0.6^{2} \times 4 = 1.44$: the link weakens by $0.6$ each month.
            feedback: >
              That is how an autoregression behaves, where each value feeds the
              next. Here $x_t$ is built from $\varepsilon_t$ and
              $\varepsilon_{t-1}$, and $x_{t-2}$ from $\varepsilon_{t-2}$ and
              $\varepsilon_{t-3}$. No shock is shared.
          - text: >
              $0$: the two returns share no shock.
            correct: true
            feedback: >
              Right. And the same holds at every larger lag. The memory is a
              window exactly two months wide.
          - text: >
              $2.4$: the lag only matters through the shared weight.
            feedback: >
              The weight $0.6$ links only neighbouring months. Two months apart,
              the windows $\{\varepsilon_t, \varepsilon_{t-1}\}$ and
              $\{\varepsilon_{t-2}, \varepsilon_{t-3}\}$ do not overlap.
        feedback: >
          The correlogram of the reported returns has one nonzero lag and then
          stops dead.

      - part: A finite window of shocks
        reflect: >
          An AR(1) needed $|\phi| < 1$ to be stationary. Would this fund's
          reported returns stay stationary if the lag weight were $5$ instead
          of $0.6$? Say why or why not.
        hint: >
          What did the variance calculation need, beyond adding two numbers?
        answer: >
          Yes. The variance is $(1 + 5^{2}) \times 4$, a sum of two finite
          terms, and the covariances are fixed numbers depending on the lag
          alone. No infinite sum of fading shocks has to converge, so there is
          no condition on the weight at all. A finite window over white noise is
          stationary whatever its coefficients.
      - teach: >
          This is the MA(1) process: $x_t = \mu + \varepsilon_t +
          \theta\varepsilon_{t-1}$. It is weakly stationary for every
          $\theta$, with $\gamma_0 = (1 + \theta^{2})\sigma^{2}$,
          $\gamma_1 = \theta\sigma^{2}$ and $\gamma_k = 0$ for $k \ge 2$. So
          $\rho_1 = \theta/(1 + \theta^{2})$, and the ACF cuts off after lag
          $1$.
      - ask: >
          What is $\rho_1$ for the fund's reported returns, to four decimals?
        expects: "0.4412"
        tolerance: 0.0005
        hint: >
          Divide the lag-$1$ covariance by the variance.
        feedback: >
          $2.4/5.44 = 0.6/1.36 \approx 0.4412$. Lagged marks make a fund's
          returns look autocorrelated even when nothing about its assets is
          predictable.

      - part: A ceiling on lag-one correlation
        ask: >
          How strong can lagged marking make the lag-$1$ correlation? What is
          $\rho_1$ at $\theta = 1$?
        expects: "0.5"
        hint: >
          $\theta/(1 + \theta^{2})$ at $\theta = 1$.
        feedback: >
          $1/(1 + 1) = 0.5$. Going further does not help: $\theta = 3$ gives
          $3/10 = 0.3$, because the variance in the denominator grows like
          $\theta^{2}$.
      - ask: >
          An analyst reports a lag-$1$ autocorrelation of $0.7$ for another
          fund and proposes an MA(1). What $\theta$ fits?
        choices:
          - text: >
              About $\theta = 0.7$, since $\rho_1$ is roughly $\theta$.
            feedback: >
              $\theta = 0.7$ gives $0.7/1.49 \approx 0.47$, not $0.7$. The
              $1 + \theta^{2}$ in the denominator always pulls $\rho_1$ below
              $\theta$.
          - text: >
              A $\theta$ larger than $1$, where the curve is steeper.
            feedback: >
              Beyond $\theta = 1$ the ratio falls again: $\theta = 2$ gives
              $0.4$. There is no steeper region to find.
          - text: >
              None: no MA(1) has $|\rho_1|$ above $1/2$.
            correct: true
            feedback: >
              Right. $1 + \theta^{2} \ge 2|\theta|$ because
              $(|\theta| - 1)^{2} \ge 0$, so $|\rho_1| \le 1/2$, with equality
              only at $\theta = \pm 1$. A lag-$1$ autocorrelation of $0.7$ needs
              a different model.
        feedback: >
          $|\rho_1| \le 1/2$ is a quick sanity check on any MA(1) somebody
          shows you.

      - part: Two coefficients, one correlogram
        ask: >
          Compute $\rho_1$ for an MA(1) with $\theta = 5/3$, to four decimals.
        expects: "0.4412"
        tolerance: 0.0005
        hint: >
          $1 + 25/9 = 34/9$.
        feedback: >
          $(5/3)/(34/9) = 15/34 \approx 0.4412$, the same as the fund's
          $\theta = 0.6$, and $5/3 = 1/0.6$. In general $\theta$ and
          $1/\theta$ have identical autocorrelations, so no amount of data can
          tell them apart.
      - ask: >
          To recover the fund's true shocks from its reported returns, invert
          the recursion: $\varepsilon_t = (x_t - \mu) - \theta\varepsilon_{t-1}$,
          and keep substituting. With $\theta = 0.6$, what weight does
          $x_{t-3} - \mu$ get in $\varepsilon_t$?
        expects: "-0.216"
        hint: >
          Each substitution multiplies by $-\theta$.
        feedback: >
          $\varepsilon_t = (x_t - \mu) - 0.6(x_{t-1} - \mu) + 0.36(x_{t-2} -
          \mu) - 0.216(x_{t-3} - \mu) + \dots$, so the weight is
          $(-0.6)^{3} = -0.216$. The weights fade, and the shocks can be read
          off history.
      - ask: >
          Two analysts model the fund's reported returns, one with
          $\theta = 0.6$ and one with $\theta = 5/3$. Both match the
          correlogram exactly. Which model do you keep?
        choices:
          - text: >
              Either: they fit the data equally well, so the choice is
              cosmetic.
            feedback: >
              No amount of data can tell them apart, but they are not equally
              usable. At $5/3$ the weights in the inverted recursion are
              $(-5/3)^{j}$, which grow without bound, so the shocks cannot be
              recovered from the past.
          - text: >
              $\theta = 0.6$, the invertible one of the pair.
            correct: true
            feedback: >
              Right. Same correlogram, and only $|\theta| < 1$ lets you recover
              the shocks from observed history, which every forecast needs.
          - text: >
              Neither: the model is not stationary at $\theta = 5/3$.
            feedback: >
              An MA(1) is stationary for every $\theta$. The problem with
              $5/3$ is invertibility, not stationarity.
        feedback: >
          Fit the invertible root, $|\theta| < 1$. The other root describes the
          same second moments and is useless for reading shocks off data.

  - node: quant-statistics.time-series.ar-ma-signatures
    hook: >
      This is the Box–Jenkins identification table distilled to one move:
      match which correlogram cuts off and which tails off, and the model
      family is named before any parameter is estimated.
    explanation: >
      An AR(1) writes today in terms of an infinite, geometrically fading
      window over every past shock, so its ACF never fully dies — but its
      PACF, which strips out exactly what's already explained by the
      intervening lags, cuts off dead after lag $1$ because the model only
      ever reaches one step back directly. An MA(1) is the mirror image: it's
      literally a finite two-wide sum of shocks, so its ACF cuts off dead
      after lag $1$, but recovering it in PACF terms requires inverting that
      finite window into an infinite autoregression, so the PACF tails off
      instead of cutting. The same duality generalizes: AR($p$) cuts off in
      the PACF at lag $p$ and tails in the ACF; MA($q$) cuts off in the ACF at
      lag $q$ and tails in the PACF; both tailing off says ARMA.

      A near-$1$ correlogram that falls almost linearly across many lags — not
      the geometric shrinkage of a stationary AR — is the sign to difference
      before fitting anything at all. Because a real, finite sample's
      correlogram always wobbles inside its noise band, read the overall
      pattern rather than any one bar, and when two small models both fit
      plausibly, prefer the smaller one: an AR(1) with modest $\phi$ and an
      MA(1) are nearly indistinguishable on a short sample, and the sparser
      model is the one that forecasts better out of sample.
    worked: >
      AR(1) with $\phi=0.7$: $\rho_1=0.7$, $\rho_2=0.49$, $\rho_3=0.343$ —
      tailing off geometrically, no cutoff. MA(1) with $\theta=0.7$:
      $\rho_1=0.7/(1+0.49)=0.7/1.49\approx0.470$, and $\rho_k=0$ for $k\ge2$ —
      a hard cutoff after one lag. Same-sized coefficient, visibly different
      correlograms.
    interview: >
      "The correlogram shows one significant spike at lag $1$ and nothing
      after — AR or MA?" wants "MA(1)," reasoned from the *ACF* cutting off —
      not the common reversed answer that confuses which function cuts off
      for which family.
    pitfalls: >
      Memorizing the cutoff/tail pairing backwards — the fastest way to
      misname a model from a correct plot. Treating small in-band wobbles at
      high lags as evidence for a higher-order model instead of noise.
      Fitting a large ARMA to match every wiggle rather than favoring the
      parsimonious model that actually generalizes.
    recap: >
      A cutoff in the PACF names AR, a cutoff in the ACF names MA, both
      tailing off names ARMA, and a slow near-linear crawl in the ACF says
      difference first.
    dialogue:
      - part: Two correlograms with the same first bar
        teach: >
          Two spreads, $2500$ daily observations each, so the noise band is
          about $\pm 0.04$. Spread P's sample ACF reads
          $0.30, 0.10, 0.02, 0.01, -0.01$ at lags $1$ to $5$. Spread Q's reads
          $0.30, -0.01, 0.02, -0.01, 0.00$. A colleague, seeing the same first
          bar on both, calls them both an AR(1) with $\phi = 0.3$.
      - ask: >
          If the colleague is right about P, what should its lag-$2$
          autocorrelation be?
        expects: "0.09"
        hint: >
          An AR(1) has $\rho_k = \phi^{k}$.
        feedback: >
          $0.3^{2} = 0.09$, and P shows $0.10$; at lag $3$ the model says
          $0.027$ and P shows $0.02$. Each bar is the last one shrunk by about
          $0.3$, well inside the noise. P passes.
      - ask: >
          What about Q?
        choices:
          - text: >
              Also an AR(1) with $\phi = 0.3$: the second bar is just noise.
            feedback: >
              An AR(1) with $\phi = 0.3$ puts lag $2$ at $0.09$, more than twice
              the band's width above zero, and Q's $-0.01$ sits squarely inside
              it. At $2500$ observations that gap is not noise.
          - text: >
              White noise: only one of its bars clears the band.
            feedback: >
              One bar is enough when it is $0.30$ against a band of $\pm 0.04$,
              more than seven times the band. That bar is a real one-day
              memory.
          - text: >
              An MA(1): its ACF stops dead after lag $1$.
            correct: true
            feedback: >
              Right. A geometric tail and a clean cut-off are different shapes,
              even when the first bars are identical.
        feedback: >
          Reading past the first bar is the whole move. Lag $1$ fixes the size
          of the memory; the later lags say what kind of memory it is.
      - ask: >
          Take Q to be an MA(1). What invertible $\theta$ gives
          $\rho_1 = 0.3$?
        expects: "1/3"
        tolerance: 0.0005
        hint: >
          Solve $\theta/(1 + \theta^{2}) = 0.3$, that is
          $0.3\theta^{2} - \theta + 0.3 = 0$, and keep the root with
          $|\theta| < 1$.
        feedback: >
          $\theta = (1 \pm \sqrt{1 - 0.36})/0.6 = (1 \pm 0.8)/0.6$, so $3$ or
          $1/3$. Check: $(1/3)/(1 + 1/9) = 0.3$. The root $3$ gives the same
          ACF and is not invertible, so $\theta = 1/3$.

      - part: A correlogram neither shape fits
        teach: >
          A third spread, R, also $2500$ days, reads
          $0.60, 0.68, 0.50, 0.49, 0.40, 0.37, 0.31$ at lags $1$ to $7$ and
          keeps sinking slowly after that.
      - ask: >
          Which of the two models you know fits R?
        choices:
          - text: >
              An AR(1) with $\phi = 0.6$, read off lag $1$.
            feedback: >
              That predicts $\rho_2 = 0.36$, and R shows $0.68$, larger than its
              own lag $1$. An AR(1) always has $|\rho_2| = \rho_1^{2} \le |\rho_1|$,
              so no choice of $\phi$ rescues it.
          - text: >
              An MA(1), with a large $\theta$.
            feedback: >
              R's ACF never cuts off, and no MA(1) can reach $\rho_1 = 0.6$ in
              the first place: $|\rho_1| \le 1/2$ for every $\theta$.
          - text: >
              Neither: today seems to lean on more than just yesterday.
            correct: true
            feedback: >
              Right. A lag-$2$ bar above the lag-$1$ bar says the day before
              yesterday has a direct say of its own.
        feedback: >
          The ACF said "autoregressive" for P and "moving average of order
          $1$" for Q. For R it says "tails off" and nothing more, and the order
          is what you need.
      - reflect: >
          For Q, the ACF gave you the order of the moving average by where it
          stopped. An autoregression's ACF never stops. If today were built
          directly from the last $p$ days plus a fresh shock, what quantity
          would stop at lag $p$, and why?
        hint: >
          With the AR(1) spread, you asked what the day before yesterday adds
          once yesterday is known.
        answer: >
          The partial autocorrelation: what $x_{t-k}$ adds once every day
          between it and today is known. If today is built from the last $p$
          days plus a shock unrelated to the past, then given those $p$ days
          anything older has nothing left to say, so the PACF is $0$ beyond lag
          $p$. The ACF cannot show this, because older days are correlated with
          today through the recent ones.
      - ask: >
          R was in fact generated by $x_t = 0.3x_{t-1} + 0.5x_{t-2} +
          \varepsilon_t$. With plenty of data you regress $x_t$ on its last
          three values. What coefficient do you expect on $x_{t-3}$?
        expects: "0"
        hint: >
          Write down what $x_t$ is equal to.
        feedback: >
          $0$: once $x_{t-1}$ and $x_{t-2}$ are in the regression, the only
          unknown left is $\varepsilon_t$, and nothing older predicts it. The
          coefficient on $x_{t-2}$ in a two-lag regression is $0.5$, the lag-$2$
          PACF; every PACF bar past lag $2$ is $0$. R's ACF tails off while its
          PACF cuts off after lag $2$.

      - part: The table, and why the MA side flips
        ask: >
          Back to Q, the MA(1) with $\theta = 1/3$. Its ACF cuts off after lag
          $1$. Does its PACF cut off too?
        choices:
          - text: >
              Yes, after lag $1$, just like its ACF.
            feedback: >
              The ACF stops because $x_t$ and $x_{t-2}$ share no shock. The
              PACF asks something else: what $x_{t-2}$ adds given $x_{t-1}$.
              Yesterday only partly reveals yesterday's shock, and the day
              before helps recover the rest.
          - text: >
              No: written in past values, an MA(1) needs every lag, so its PACF
              tails off.
            correct: true
            feedback: >
              Right. Inverting the MA(1) gives $x_t - \mu = \varepsilon_t +
              \tfrac{1}{3}(x_{t-1} - \mu) - \tfrac{1}{9}(x_{t-2} - \mu) +
              \tfrac{1}{27}(x_{t-3} - \mu) - \dots$, an autoregression of
              infinite order with fading weights.
          - text: >
              It is $0$ at every lag, because Q is not an autoregression.
            feedback: >
              The lag-$1$ partial autocorrelation always equals $\rho_1$, since
              there is nothing in between to condition on. For Q that is
              $0.3$, not $0$.
        feedback: >
          The two families are mirror images. A finite autoregression is an
          infinite window of shocks, and a finite window of shocks is an
          infinite autoregression.
      - teach: >
          That mirror is the Box–Jenkins identification table. ACF tails off,
          PACF cuts off after lag $p$: AR($p$). ACF cuts off after lag $q$,
          PACF tails off: MA($q$). Both tail off: ARMA. ACF near $1$ and
          falling almost linearly over many lags: not stationary, so difference
          before fitting anything. The short form: a cut-off in the PACF means
          AR, a cut-off in the ACF means MA.
      - ask: >
          A fifth series: its ACF has two bars well outside the band, at lags
          $1$ and $2$, and every later bar inside it. Its PACF shows bars that
          shrink gradually and alternate in sign, still visible at lag $6$.
          What do you fit?
        choices:
          - text: >
              An AR(2), since two bars stand out.
            feedback: >
              That reads the table backwards. Two bars and a cut-off in the
              *ACF* is a finite window of shocks; an AR(2) would cut off in the
              PACF instead.
          - text: >
              An MA(2).
            correct: true
            feedback: >
              Right. The ACF cuts off after lag $2$ and the PACF tails off,
              the moving-average signature of order $2$.
          - text: >
              An AR(6), one lag for each visible PACF bar.
            feedback: >
              A PACF that tails off has no last bar to count. Six visible bars
              and a cut-off ACF say moving average, not a long autoregression.
          - text: >
              An ARMA, since something tails off.
            feedback: >
              ARMA is the case where *both* tail off. Here the ACF cuts off
              cleanly, so the moving-average part alone explains it.
        feedback: >
          Name which function cuts off before naming anything else; the lag
          where it cuts off is the order.

      - part: When the sample cannot tell
        teach: >
          A sixth spread comes with only $144$ days, so the band is
          $\pm 1.96/12 \approx \pm 0.16$. Its sample ACF reads
          $0.32, 0.12, -0.05, 0.08$ at lags $1$ to $4$, all later bars inside
          the band.
      - ask: >
          An AR(1) with $\phi = 0.32$ would put $\rho_2$ where?
        expects: "0.1024"
        tolerance: 0.0005
        hint: >
          Square the coefficient.
        feedback: >
          $0.32^{2} = 0.1024$. An MA(1) matching lag $1$ would put $\rho_2$ at
          $0$. The sample shows $0.12$, so the question is whether that bar can
          choose between $0.10$ and $0$.
      - ask: >
          Under white noise a bar has standard error about $1/\sqrt{n}$. How
          many standard errors from $0$ is the lag-$2$ bar of $0.12$?
        expects: "1.44"
        tolerance: 0.005
        hint: >
          $1/\sqrt{144} = 1/12$.
        feedback: >
          $0.12 \times 12 = 1.44$. It is consistent with $0$ and with $0.10$
          alike; on $144$ days lag $2$ cannot separate an AR(1) from an MA(1).
      - ask: >
          What do you fit?
        choices:
          - text: >
              An AR(1), because $0.12$ is closer to $0.10$ than to $0$.
            feedback: >
              Closer by less than a single standard error, $1/12 \approx 0.08$.
              A bar that sits inside the band cannot vote.
          - text: >
              An ARMA(1,1), which covers both possibilities.
            feedback: >
              An extra parameter fits the wobble of $144$ days and pays for it
              out of sample. When two small models tie, the bigger one is the
              wrong tiebreak.
          - text: >
              An AR(4), since four bars are nonzero.
            feedback: >
              Three of those four bars are inside the band. Fitting a lag to
              every in-band wiggle is fitting noise.
          - text: >
              A one-parameter model, AR(1) or MA(1); the data cannot rank them,
              and the small model is the safer forecast.
            correct: true
            feedback: >
              Right. Read the pattern, not the individual bars, and break ties
              toward the smaller model, which forecasts better out of sample.
        feedback: >
          Said aloud in an interview: which function cuts off, at what lag,
          checked against $\pm 2/\sqrt{n}$, and the smallest model the pattern
          allows.

  - node: quant-statistics.time-series.higher-order
    hook: >
      Interviews rarely leave AR(1) and MA(1), but they do check whether you
      know the $|\phi|<1$ condition was secretly a root condition all along —
      a fact that resurfaces the moment a second lag is added.
    explanation: >
      Write the AR(1) stationarity condition as a statement about the
      polynomial $1-\phi z$: its root is $z=1/\phi$, and $|\phi|<1$ is exactly
      $|z|>1$ — the root sits outside the unit circle. That's not a
      coincidence particular to one lag; it's the general rule. For AR($p$),
      stationarity holds exactly when every root of
      $1-\phi_1 z-\dots-\phi_p z^{p}=0$ lies outside the unit circle, and once
      $p\ge2$ no simple bound on the individual coefficients replaces that
      check — a coefficient can be small in magnitude and still produce a
      root inside the circle once other lags interact with it.

      MA($q$) sidesteps this on the stationarity side entirely, for the same
      reason MA(1) always is: it's a finite window over $q+1$ shocks, so its
      variance is a finite sum regardless of the coefficients. The matching
      root condition instead governs *invertibility* — whether the shocks can
      be recovered from observed history — exactly as $|\theta|<1$ did for
      MA(1). Yule–Walker generalizes cleanly too: the ACF at lags
      $1,\dots,p$ gives $p$ linear equations in the $\phi_i$, cheap to solve
      by hand, while software instead maximizes the full likelihood for a
      sharper fit.
    worked: >
      AR(2) with $\phi_1=0.5$, $\phi_2=0.3$: the characteristic polynomial is
      $1-0.5z-0.3z^{2}=0$, i.e. $0.3z^{2}+0.5z-1=0$, with roots
      $z=(-0.5\pm\sqrt{0.25+1.2})/0.6=(-0.5\pm1.204)/0.6$, giving
      $z\approx1.174$ and $z\approx-2.840$. Both satisfy $|z|>1$, so the
      process is stationary — even though $\phi_1+\phi_2=0.8$ isn't obviously
      informative on its own.
    interview: >
      "Given $\phi_1=0.5$, $\phi_2=0.3$, is this AR(2) stationary?" wants the
      characteristic polynomial set up and its roots checked against the unit
      circle, not a claim that each $|\phi_i|<1$ individually is enough.
    pitfalls: >
      Assuming $|\phi_i|<1$ for every individual coefficient guarantees
      stationarity once $p\ge2$ — it's neither necessary nor sufficient in
      general. Forgetting MA($q$) is stationary for any coefficients
      whatsoever; only invertibility needs the root check. Mixing up "outside
      the unit circle" (stationary) with "inside" — an easy sign slip under
      pressure.
    recap: >
      Stationarity and invertibility are both root conditions on the lag
      polynomial, outside the unit circle in each case, with $|\phi|<1$ as
      just the $p=1$ special case of the general rule.
    dialogue:
      - part: Two small coefficients, one problem
        teach: >
          A colleague fits $x_t = 0.6x_{t-1} + 0.6x_{t-2} + \varepsilon_t$ to a
          spread and calls it stationary, since both coefficients sit well
          below $1$. To see what the recursion does on its own, switch the noise
          off and start it at $x_0 = x_1 = 1$.
      - ask: >
          What is $x_4$?
        expects: "1.512"
        hint: >
          Each value is $0.6$ times the last plus $0.6$ times the one before.
        feedback: >
          $x_2 = 0.6 + 0.6 = 1.2$, $x_3 = 0.72 + 0.6 = 1.32$, and
          $x_4 = 0.792 + 0.72 = 1.512$. Then $x_5 \approx 1.70$. The path is
          climbing, not settling.
      - ask: >
          So is the colleague's model stationary?
        choices:
          - text: >
              Yes: each coefficient is below $1$, which is the AR(1) condition
              applied lag by lag.
            feedback: >
              The noise-free path grows every step, so a shock is amplified
              rather than forgotten. Bounding each coefficient on its own misses
              how the two lags feed each other.
          - text: >
              Yes, as long as the noise variance is small.
            feedback: >
              The noise sets the size of the shocks, not whether they die out.
              Whether an old shock fades is decided by the coefficients alone.
          - text: >
              No: left alone, the path grows instead of dying out.
            correct: true
            feedback: >
              Right. With two lags, each value is pushed by both of its
              predecessors, and here the pushes together outrun the decay.
        feedback: >
          The AR(1) rule $|\phi| < 1$ does not extend coefficient by
          coefficient. Something else was hiding inside it.

      - part: What the old condition was really saying
        reflect: >
          Try a noise-free solution of the form $x_t = \lambda^{t}$. What
          equation must $\lambda$ satisfy for the colleague's recursion, which
          values of $\lambda$ make such a path die out, and how does the same
          move recover $|\phi| < 1$ for an AR(1)?
        hint: >
          Substitute and divide through by $\lambda^{t-2}$.
        answer: >
          Substituting gives $\lambda^{2} = 0.6\lambda + 0.6$, with roots
          $\lambda \approx 1.131$ and $\lambda \approx -0.531$. Every
          noise-free path is a mix of $\lambda_1^{t}$ and $\lambda_2^{t}$, so it
          dies out only when every root has $|\lambda| < 1$; here $1.131$
          grows. For an AR(1) the equation is just $\lambda = \phi$, so the
          condition is $|\phi| < 1$: the same check, with one root.
      - teach: >
          This is the general family. An AR($p$) is
          $x_t = c + \phi_1 x_{t-1} + \dots + \phi_p x_{t-p} + \varepsilon_t$,
          and it is stationary exactly when every root of
          $1 - \phi_1 z - \dots - \phi_p z^{p} = 0$ lies outside the unit
          circle. Those roots are the reciprocals $z = 1/\lambda$ of the growth
          factors, so outside the circle means every $|\lambda| < 1$. For
          $p = 1$ the root of $1 - \phi z$ is $1/\phi$, and outside the circle
          is $|\phi| < 1$. No bound on the individual coefficients replaces the
          root check.
      - ask: >
          For the colleague's model, what is the positive root of
          $1 - 0.6z - 0.6z^{2} = 0$, to three decimals?
        expects: "0.884"
        tolerance: 0.0005
        hint: >
          Rewrite as $0.6z^{2} + 0.6z - 1 = 0$ and use the quadratic formula.
        feedback: >
          $z = (-0.6 + \sqrt{0.36 + 2.4})/1.2 = (-0.6 + 1.6613)/1.2 \approx
          0.884$, which is $1/1.131$. It lies inside the unit circle, so the
          model is not stationary.

      - part: The root check on two more fits
        ask: >
          A second fit is $x_t = 0.5x_{t-1} + 0.5x_{t-2} + \varepsilon_t$. What
          is the positive root of $1 - 0.5z - 0.5z^{2} = 0$?
        expects: "1"
        hint: >
          Try $z = 1$.
        feedback: >
          $1 - 0.5 - 0.5 = 0$, and the polynomial factors as
          $-0.5(z - 1)(z + 2)$. A root exactly on the unit circle is not
          outside it: the noise-free path can sit still forever, so an old
          shock never fades and the model is not stationary, although both
          coefficients are $0.5$.
      - ask: >
          A third fit is $x_t = 1.1x_{t-1} - 0.3x_{t-2} + \varepsilon_t$. Its
          growth factors solve $\lambda^{2} = 1.1\lambda - 0.3$. What is the
          larger one?
        expects: "0.6"
        hint: >
          You want two numbers with sum $1.1$ and product $0.3$.
        feedback: >
          $\lambda = 0.6$ and $\lambda = 0.5$. Both are inside the circle, so
          the roots $z = 1/0.6 = 5/3$ and $z = 2$ are outside it, and the model
          is stationary with a first coefficient of $1.1$.
      - ask: >
          So what does a first coefficient above $1$ tell you about an AR(2)?
        choices:
          - text: >
              It explodes: a lag weight above $1$ amplifies every shock.
            feedback: >
              The third fit has $\phi_1 = 1.1$ and both growth factors below
              $1$. The negative second lag pulls back what the first pushes
              forward.
          - text: >
              It is stationary as long as $\phi_2$ is negative.
            feedback: >
              A negative $\phi_2$ is what saved the third fit, but it is no
              guarantee: $x_t = 2.5x_{t-1} - 0.3x_{t-2} + \varepsilon_t$ has a
              growth factor of about $2.37$.
          - text: >
              Nothing by itself: only the roots decide.
            correct: true
            feedback: >
              Right. Small coefficients failed in the first two fits and a large
              one passed in the third. Per-coefficient bounds are neither
              necessary nor sufficient once $p \ge 2$.
        feedback: >
          Interviews seldom go past AR(1) and MA(1); what they check here is
          that you know the general condition is about roots.

      - part: The rest of the family
        ask: >
          An MA(2) reads $x_t = \varepsilon_t + 1.5\varepsilon_{t-1} +
          0.8\varepsilon_{t-2}$. Is it stationary?
        choices:
          - text: >
              Only if the roots of $1 + 1.5z + 0.8z^{2}$ lie outside the unit
              circle.
            feedback: >
              For a moving average that root condition decides invertibility,
              whether the shocks can be recovered from history. Stationarity
              asks nothing of the coefficients.
          - text: >
              No: a weight of $1.5$ on a past shock amplifies it.
            feedback: >
              The weight scales one shock once; nothing feeds back. The variance
              is $(1 + 2.25 + 0.64)\sigma^{2}$, a finite sum.
          - text: >
              Yes, whatever its coefficients.
            correct: true
            feedback: >
              Right: a finite window over white noise is always stationary. Its
              lag polynomial has complex roots of modulus
              $\sqrt{1/0.8} \approx 1.12$, outside the circle, so it is
              invertible too.
        feedback: >
          MA($q$) is stationary always and invertible under the root condition
          on its own polynomial. ARMA($p, q$) mixes an AR($p$) part with an
          MA($q$) part to keep the parameter list short.
      - ask: >
          You take a series' day-to-day changes and fit an AR(2) to them. In
          ARIMA($p, d, q$) notation, what have you fitted to the original
          series?
        choices:
          - text: >
              ARIMA($2, 0, 1$): the differencing adds a moving-average term.
            feedback: >
              The middle number counts differences and the last counts
              moving-average terms. Differencing is recorded in $d$, not $q$.
          - text: >
              ARIMA($2, 1, 0$).
            correct: true
            feedback: >
              Right: an ARMA($2, 0$) fitted to the first difference, so $p = 2$,
              $d = 1$, $q = 0$.
          - text: >
              ARIMA($1, 2, 0$).
            feedback: >
              That would be an AR(1) fitted to the second difference. The order
              is ($p$, $d$, $q$): autoregressive lags, differences, moving-average
              lags.
        feedback: >
          ARIMA($p, d, q$) is an ARMA($p, q$) fitted to the $d$-th difference.
      - ask: >
          For $x_t = 0.3x_{t-1} + 0.5x_{t-2} + \varepsilon_t$, take the
          covariance of both sides with $x_{t-1}$ and divide by $\gamma_0$:
          $\rho_1 = 0.3 + 0.5\rho_1$. What is $\rho_1$?
        expects: "0.6"
        hint: >
          Collect the $\rho_1$ terms.
        feedback: >
          $0.5\rho_1 = 0.3$, so $\rho_1 = 0.6$; at lag $2$ the same move gives
          $\rho_2 = 0.3(0.6) + 0.5 = 0.68$. These are the Yule–Walker equations.
          Run them backwards and the sample ACF at lags $1$ to $p$ gives $p$
          linear equations for the $\phi_i$: cheap estimates by hand, where
          software maximises the likelihood.

  - node: quant-statistics.time-series.unit-root
    hook: >
      This is the single boundary every earlier technique in this unit
      silently assumed you weren't standing on — and raw price levels usually
      are standing exactly there.
    explanation: >
      Setting $\phi=1$ turns the AR(1) recursion into
      $x_t=x_{t-1}+\varepsilon_t$: a running sum of shocks, the same object
      already known to have $\operatorname{Var}(S_n)=n$ growing without bound
      and no restoring pull back to any fixed level. The AR(1) variance
      formula $\sigma^{2}/(1-\phi^{2})$ makes the failure visible directly —
      plug in $\phi=1$ and the denominator hits zero, the algebraic signal
      that the whole stationary apparatus is undefined exactly at this
      boundary, not just numerically large. Shocks that used to fade like
      $\phi^{k}$ now persist forever, the half-life is infinite, and a nonzero
      constant $c$ no longer sets a mean to revert to — it becomes a
      deterministic trend $ct$ riding on top of the wandering.

      Testing for this is not a t-test in disguise. The Dickey–Fuller
      regression puts $\Delta x_t$ on $x_{t-1}$ and asks whether that slope is
      $0$, but under the null $x_{t-1}$ is itself non-stationary, so the usual
      normal-theory asymptotics for a regression slope don't apply — the
      test statistic needs its own, heavier-tailed tabulated distribution,
      with a 5% critical value near $-2.86$ rather than the familiar $-1.96$.
    worked: >
      A Dickey–Fuller regression on a suspected spread gives a slope
      $t$-statistic of $-2.10$. Judged against the normal $-1.96$ that looks
      like a clean rejection of the unit root. Judged against the actual DF
      critical value near $-2.86$, $-2.10$ doesn't clear the bar at all — the
      unit root cannot be rejected, the opposite conclusion from using the
      wrong table.
    interview: >
      "You test a spread for stationarity and get a $t$-statistic of $-2.1$ —
      is it stationary?" wants the candidate to reject the naive
      "$|{-2.1}|>1.96$, so yes" answer and instead cite that Dickey–Fuller's
      own critical value is more negative, concluding the unit root survives.
    pitfalls: >
      Comparing a Dickey–Fuller statistic to normal critical values instead
      of the test's own tabulated ones — the single most common trap here.
      Treating $\phi=0.98$ as close enough to stationary behavior to ignore
      the distinction — the qualitative properties (bounded variance, finite
      half-life) hold at $0.98$ but the formulas are approaching the same
      singularity that fully breaks at $\phi=1$.
    recap: >
      At $\phi=1$ variance grows like $t$ and shocks never fade; testing for
      it needs Dickey–Fuller's own, more negative critical values, not normal
      ones.
    dialogue:
      - part: A spread with no pull back
        teach: >
          A desk fits an AR(1) to a spread and the coefficient comes back at
          exactly $\phi = 1$: $x_t = x_{t-1} + \varepsilon_t$, with independent
          shocks of variance $4$, measured from $x_0 = 0$ on the day the trade
          goes on.
      - ask: >
          What is $\operatorname{Var}(x_{25})$?
        expects: "100"
        hint: >
          Unroll the recursion back to $x_0$.
        feedback: >
          $x_{25} = \varepsilon_1 + \dots + \varepsilon_{25}$, and independent
          variances add: $25 \times 4 = 100$, a standard deviation of $10$. On
          day $100$ it is $400$, a standard deviation of $20$.
      - ask: >
          What does the stationary-variance formula $\sigma^{2}/(1-\phi^{2})$
          give for this spread?
        choices:
          - text: >
              A very large but finite number: the spread is just volatile.
            feedback: >
              You just watched the variance go from $100$ on day $25$ to $400$
              on day $100$. No single number describes it, however large.
          - text: >
              Nothing: the variance grows like $t\sigma^{2}$ and never settles.
            correct: true
            feedback: >
              Right. The formula's denominator is $0$ because the thing it
              describes, a constant variance, does not exist.
          - text: >
              $4$, since the shocks are all that is ever added.
            feedback: >
              $4$ is the variance of one day's change, $x_t - x_{t-1}$. The
              level is the sum of every change so far, and its variance keeps
              growing.
        feedback: >
          At $\phi = 1$ the AR(1) is a random walk, and the stationary theory
          has nothing to say about it.

      - part: Where a shock goes
        ask: >
          A shock of $+10$ hits today. If the coefficient were $0.9$ instead of
          $1$, how much of it would remain, in expectation, $20$ days later?
        expects: "1.216"
        tolerance: 0.005
        hint: >
          The shock is worth $\phi^{k}$ of itself after $k$ days.
        feedback: >
          $10 \times 0.9^{20} \approx 10 \times 0.1216 = 1.216$. Most of it has
          leaked away.
      - ask: >
          And at $\phi = 1$?
        expects: "10"
        hint: >
          What is $1^{20}$?
        feedback: >
          All $10$. Every later value is today's value plus later shocks, so the
          $+10$ is carried forward in full, forever. There is no halfway point:
          the half-life is infinite.
      - reflect: >
          Add a constant: $x_t = c + \phi x_{t-1} + \varepsilon_t$. At
          $\phi = 1$, unroll it from $x_0$. What does $c$ turn into, and why is
          there no mean for the series to revert to?
        hint: >
          Ask what happens to $c$ on each day it is added.
        answer: >
          Unrolled, $x_t = x_0 + ct + \varepsilon_1 + \dots + \varepsilon_t$.
          The constant is added every day and nothing takes it back, so it
          becomes a deterministic trend $ct$. The stationary mean $c/(1-\phi)$
          has a zero denominator, and the infinite sum
          $\sum_j \phi^{j}\varepsilon_{t-j}$ has every weight equal to $1$, so
          it never converges. The series remembers all of its history equally,
          and there is no level that pulls it back.
      - teach: >
          That is the unit root. At $\phi = 1$ the AR(1) becomes the random
          walk $x_t = x_0 + \sum_{s \le t}\varepsilon_s$:
          $\operatorname{Var}(x_t) = t\sigma^{2}$ grows without bound, there is
          no mean to revert to, shocks are permanent instead of fading like
          $\phi^{k}$, and the half-life is infinite. An added constant becomes a
          trend. On a plot of the sample ACF it shows as bars near $1$ that fall
          almost linearly.
      - ask: >
          A second spread follows $x_t = x_{t-1} + 0.3 + \varepsilon_t$ from
          $x_0 = 50$. What is its expected value on day $40$?
        expects: "62"
        hint: >
          The shocks have mean $0$; the constant is added once per day.
        feedback: >
          $50 + 0.3 \times 40 = 62$, and on day $400$ it is $170$. With
          $\phi = 0.9$ the same constant would hold the mean at
          $0.3/0.1 = 3$, and the start of $50$ would be forgotten. At $\phi = 1$
          the start is never forgotten and the constant never stops adding.

      - part: Testing whether the coefficient is one
        ask: >
          Subtract $x_{t-1}$ from both sides of $x_t = \phi x_{t-1} +
          \varepsilon_t$. If $\phi = 0.95$, what is the slope of
          $\Delta x_t = x_t - x_{t-1}$ on $x_{t-1}$?
        expects: "-0.05"
        hint: >
          $\Delta x_t = (\phi - 1)x_{t-1} + \varepsilon_t$.
        feedback: >
          $0.95 - 1 = -0.05$. A stationary spread gives a negative slope: a high
          level predicts a fall. A unit root gives a slope of exactly $0$: the
          level predicts nothing about the change. Testing for a unit root is
          testing whether this slope is $0$.
      - ask: >
          You compute the usual $t$-statistic for that slope under the null
          $\phi = 1$. Why might it fail to be approximately standard normal, as
          a regression $t$-statistic usually is?
        choices:
          - text: >
              Because the shocks may not be normal.
            feedback: >
              With a stationary regressor the central limit theorem would
              handle non-normal shocks. The trouble is elsewhere.
          - text: >
              Because under the null the regressor $x_{t-1}$ is itself a random
              walk, whose variance grows without bound.
            correct: true
            feedback: >
              Right. The usual large-sample theory assumes a regressor that
              settles into a fixed distribution. A wandering regressor gives the
              statistic a different limit altogether.
          - text: >
              Only because the sample is small; it becomes normal with enough
              data.
            feedback: >
              The non-normal limit is what you get as $n \to \infty$. More data
              does not fix it.
        feedback: >
          The regression looks ordinary, and its null is not.
      - teach: >
          That is the Dickey–Fuller test: regress $\Delta x_t$ on $x_{t-1}$ and
          ask whether the slope is $0$. Under the null the $t$-statistic has its
          own distribution, shifted to the left, and with a constant in the
          regression the $5\%$ critical value is about $-2.86$, not $-1.96$.
      - ask: >
          A pairs desk runs it on a spread and gets $t = -2.5$. Do you reject
          the unit root at $5\%$?
        choices:
          - text: >
              Yes: $-2.5$ is beyond $-1.96$.
            feedback: >
              $-1.96$ is the normal cut-off, and this statistic is not normal.
              Against the Dickey–Fuller value it falls short.
          - text: >
              No: $-2.5$ is not below $-2.86$, so the unit root survives.
            correct: true
            feedback: >
              Right. Using the wrong table would have turned the same number into
              the opposite conclusion.
          - text: >
              Yes, since a negative slope means the spread reverts.
            feedback: >
              Even for a true random walk the estimated slope tends to come out
              negative. The test asks whether it is negative *enough*, and
              $-2.5$ is not.
        feedback: >
          Compare a Dickey–Fuller statistic only with Dickey–Fuller critical
          values.
      - ask: >
          On $250$ days a spread's fitted $\phi$ is $0.97$, with a Dickey–Fuller
          statistic of $-2.0$. What do you conclude?
        choices:
          - text: >
              It is stationary, since $0.97$ is below $1$.
            feedback: >
              Estimates of $\phi$ are biased downward near $1$, and on $250$
              days a true random walk with a constant in the fit routinely
              produces estimates near $0.97$. Below $1$ by estimate is not below
              $1$ in truth.
          - text: >
              It has a unit root, since the test did not reject.
            feedback: >
              Failing to reject is not proof. If $\phi$ really were $0.97$, the
              half-life would be about $23$ days and the spread would revert;
              the test has little power that close to $1$.
          - text: >
              The data cannot tell $0.97$ from $1$, so any mean-reversion trade
              on it is unproven.
            correct: true
            feedback: >
              Right. Near the boundary a short sample cannot separate slow
              reversion from none, and the two have completely different
              risks: one has an expected exit, the other does not.
        feedback: >
          Said aloud: a coefficient near $1$ needs a Dickey–Fuller test against
          its own critical values, and a non-rejection means "cannot rule out a
          random walk", not "is a random walk".

  - node: quant-statistics.time-series.differencing
    hook: >
      This is the one line of arithmetic that explains why quant work is done
      in returns and not price levels — and why differencing twice is a real
      way to make a model worse, not safer.
    explanation: >
      If $x_t$ carries a unit root it behaves like a running sum of roughly
      stationary increments, so subtracting one lag, $\Delta x_t = x_t -
      x_{t-1}$, literally undoes the summation and hands back something close
      to those increments directly — the meaning of $x_t\sim I(1)$,
      $\Delta x_t\sim I(0)$. Log price is exactly this object: writing
      $\log P_t \approx \log P_{t-1} + r_t$ makes $\log P$ an integrated
      series and $r_t=\Delta\log P_t=\log(P_t/P_{t-1})$ its stationary
      difference — the reason returns, not prices, are what gets averaged,
      correlated, and tested.

      Overdifferencing is not a free safety margin; it manufactures a problem.
      Difference an already-stationary white-noise series $x_t=\varepsilon_t$
      and $\Delta x_t=\varepsilon_t-\varepsilon_{t-1}$ is exactly an MA(1)
      with $\theta=-1$: $\operatorname{Var}(\Delta x_t)=2\sigma^{2}$ (double
      the original) and
      $\operatorname{Cov}(\Delta x_t,\Delta x_{t-1})=-\sigma^{2}$, giving
      $\rho_1=-1/2$ — sitting exactly on MA(1)'s $|\rho_1|\le1/2$ boundary and
      exactly on its non-invertible edge $|\theta|=1$, so the shocks can no
      longer be recovered from the differenced series at all. Match the cure
      to the disease: detrend a trend-stationary series by regression on
      time, difference a series with an actual unit root, and don't reach for
      differencing by default.
    worked: >
      $x_t=\varepsilon_t$, $\varepsilon_t$ iid with $\sigma^{2}=1$. Then
      $\Delta x_t=\varepsilon_t-\varepsilon_{t-1}$ has
      $\operatorname{Var}(\Delta x_t)=2$ and
      $\operatorname{Cov}(\Delta x_t,\Delta x_{t-1})=-1$, so
      $\rho_1=-1/2$ — the variance doubled and the induced MA(1) sits exactly
      on the non-invertible boundary $\theta=-1$, purely from differencing a
      series that needed no fixing.
    interview: >
      "Why model log returns instead of log prices?" wants: log price behaves
      like an $I(1)$ series (essentially a random walk), so its own mean and
      variance aren't stable quantities to estimate, while the first
      difference, the return, is close to $I(0)$ and can safely be averaged
      and tested — plus the caveat against differencing something already
      stationary.
    pitfalls: >
      Differencing twice "to be safe" — it converts a good $I(0)$ series into
      an over-differenced, non-invertible MA(1) with inflated variance.
      Reaching for differencing when the real issue is a deterministic trend,
      which calls for detrending by regression instead — the two problems
      have different cures and applying the wrong one leaves the series
      broken in a new way.
    recap: >
      One difference converts $I(1)$ to $I(0)$ — exactly why returns, not
      prices, are the modelling unit — but differencing an already-stationary
      series manufactures a non-invertible MA(1) and doubles its variance.
    dialogue:
      - part: An average of a wandering level
        teach: >
          A stock's log price follows $\log P_t = \log P_{t-1} + r_t$, where the
          daily returns $r_t$ are independent with mean $0$ and standard
          deviation $0.015$. An analyst takes the average log price over the
          last $400$ days as the level the stock should revert to.
      - ask: >
          What is the standard deviation of $\log P_{400} - \log P_0$?
        expects: "0.3"
        hint: >
          The change over $400$ days is the sum of $400$ independent returns.
        feedback: >
          The variances add: $400 \times 0.015^{2} = 0.09$, so the standard
          deviation is $0.3$. Over $1600$ days it is $0.6$. The log price has
          the unit root's signature: its spread grows like $\sqrt{t}$.
      - ask: >
          What does the analyst's $400$-day average estimate?
        choices:
          - text: >
              The stock's long-run mean level.
            feedback: >
              A random walk has no mean to revert to. The next $400$ days will
              wander somewhere else, and their average with them.
          - text: >
              The starting level $\log P_0$, since every return has mean $0$.
            feedback: >
              Its expectation is $\log P_0$, but its variance grows with the
              window, roughly $n\sigma^{2}/3$ for $n$ days. A longer window makes
              it a worse estimate, not a better one.
          - text: >
              Nothing stable: it averages values drawn from different
              distributions and reports where this path happened to wander.
            correct: true
            feedback: >
              Right. Each day's log price has its own variance, growing with
              $t$, so the average is not converging to anything.
        feedback: >
          The level cannot be averaged, correlated or tested. Something built
          from it has to be.
      - reflect: >
          The log price is a running sum of the returns. What single operation
          recovers something stationary from it, and what does it give here?
        hint: >
          How do you undo a running sum?
        answer: >
          Subtract yesterday's value: $\log P_t - \log P_{t-1} = r_t$. That
          undoes the summation and hands back the increments, which here are
          independent with a fixed mean and variance. The result is the log
          return $\log(P_t/P_{t-1})$, the quantity every return series is made
          of.
      - teach: >
          That is differencing. When a series carries a unit root, model its
          first difference $\Delta x_t = x_t - x_{t-1}$, which is stationary:
          one writes $x_t \sim I(1)$ and $\Delta x_t \sim I(0)$. Log prices
          behave like an $I(1)$ series and returns
          $r_t = \Delta \log P_t = \log(P_t/P_{t-1})$ are close to stationary,
          which is why finance works in returns and not prices. A difference
          also removes a linear deterministic trend.
      - ask: >
          A stock closes at $80$, $84$ and $79.8$ on three days. What is the
          log return on the third day, to four decimals?
        expects: "-0.0513"
        tolerance: 0.0005
        hint: >
          $79.8/84 = 0.95$.
        feedback: >
          $\log(79.8/84) = \log 0.95 \approx -0.0513$. The first day's return is
          $\log(84/80) = \log 1.05 \approx 0.0488$. These are the numbers that
          can be averaged and tested; $80$, $84$ and $79.8$ are not.

      - part: Differencing something that was fine
        ask: >
          A series is already white noise, $x_t = \varepsilon_t$ with variance
          $2.5$, and someone differences it anyway. What is
          $\operatorname{Var}(\Delta x_t)$?
        expects: "5"
        hint: >
          $\Delta x_t = \varepsilon_t - \varepsilon_{t-1}$, two uncorrelated
          shocks.
        feedback: >
          $2.5 + 2.5 = 5$. Differencing doubled the variance of a series that
          needed no fixing.
      - ask: >
          What is the lag-$1$ autocorrelation of $\Delta x_t$?
        expects: "-0.5"
        hint: >
          $\Delta x_t$ and $\Delta x_{t-1} = \varepsilon_{t-1} - \varepsilon_{t-2}$
          share one shock. With what sign does it appear in each?
        feedback: >
          The shared shock is $\varepsilon_{t-1}$, with sign $-1$ in
          $\Delta x_t$ and $+1$ in $\Delta x_{t-1}$, so the covariance is
          $-2.5$, and $-2.5/5 = -0.5$. Differencing manufactured a
          correlation that was not there.
      - ask: >
          So $\Delta x_t$ is an MA(1). Which one, and what is wrong with it?
        choices:
          - text: >
              $\theta = -0.5$, a mild and harmless one.
            feedback: >
              $-0.5$ is $\rho_1$, not $\theta$. For an MA(1),
              $\rho_1 = \theta/(1 + \theta^{2})$, and $-0.5$ is reached only at
              $\theta = -1$.
          - text: >
              $\theta = -1$, exactly on the non-invertible edge.
            correct: true
            feedback: >
              Right. $\Delta x_t = \varepsilon_t - \varepsilon_{t-1}$ is an
              MA(1) with $\theta = -1$, so the shocks cannot be recovered from
              the differenced history, and no fitted model can undo that.
          - text: >
              None: the difference of white noise is still white noise.
            feedback: >
              You just computed $\rho_1 = -0.5$. Neighbouring differences share
              a shock with opposite signs.
        feedback: >
          Overdifferencing is not a safety margin. It doubles the variance and
          plants a non-invertible MA(1) in a series that was fine.

      - part: Trend or unit root
        ask: >
          A third series is $x_t = 5 + 0.2t + u_t$, with $u_t$ white noise. It
          drifts upward, but its deviations from the line are stationary. What
          is the mean of $\Delta x_t$?
        expects: "0.2"
        hint: >
          Difference each of the three pieces.
        feedback: >
          $\Delta x_t = 0.2 + u_t - u_{t-1}$, whose mean is $0.2$. The trend is
          gone, and in its place is the same $\theta = -1$ MA(1) you just
          built out of white noise.
      - ask: >
          What is the better treatment for this series?
        choices:
          - text: >
              Difference it: that removes the trend.
            feedback: >
              It does, and it also turns the white noise $u_t$ into
              $u_t - u_{t-1}$, doubling its variance and making it
              non-invertible. The disease was a deterministic line, not a unit
              root.
          - text: >
              Regress it on time and model the residuals.
            correct: true
            feedback: >
              Right. The residuals are $u_t$ itself, clean white noise. Detrend a
              trend-stationary series; difference a unit-root series.
          - text: >
              Difference it twice, to be safe.
            feedback: >
              Each unnecessary difference makes it worse. Twice-differenced
              white noise has variance $6$ times the original's, since
              $u_t - 2u_{t-1} + u_{t-2}$ has squared weights $1, 4, 1$.
        feedback: >
          Match the cure to the disease.
      - ask: >
          An interviewer asks why you model log returns rather than log prices.
          Which answer is the one they want?
        choices:
          - text: >
              Returns are closer to normally distributed.
            feedback: >
              They are not especially normal, with fat tails at a daily
              frequency. The reason is stationarity, not shape.
          - text: >
              Log prices behave like $I(1)$, so their mean and variance are not
              fixed; the first difference is close to $I(0)$ and can be
              averaged and tested.
            correct: true
            feedback: >
              Right, and the caveat to add unprompted is that you would not
              difference again: returns are already stationary.
          - text: >
              Returns are unit-free, so different stocks can be compared.
            feedback: >
              A useful convenience, but a scaled price would be unit-free too
              and still wander. The answer is about stationarity.
        feedback: >
          One difference converts $I(1)$ to $I(0)$, and one is enough.

  - node: quant-statistics.time-series.spurious-regression
    hook: >
      "Always check the Durbin–Watson against the $R^{2}$" is the one-line
      defense against a backtest that regresses two unrelated wandering
      series onto each other and finds a beautiful, meaningless relationship.
    explanation: >
      OLS's usual guarantees — that the estimated slope is a sensible
      estimate of a true relationship, and that its standard error shrinks
      like $1/\sqrt{n}$ — implicitly assume residuals that settle down into
      something close to stationary. Regress two genuinely independent
      random walks on each other and that assumption fails completely: the
      residuals are themselves $I(1)$, wandering rather than settling, so the
      textbook standard-error formula is computing the wrong thing by an
      unbounded factor. The slope's $t$-statistic doesn't shrink toward
      insignificance as $n$ grows the way it would for a real null
      relationship — it diverges like $\sqrt{n}$, so more data makes the
      illusion of significance *worse*, the opposite of the usual intuition
      that more data resolves doubt.

      The diagnostic follows directly from what broke: Durbin–Watson measures
      residual autocorrelation, and $I(1)$ residuals push it toward $0$ (a
      value near $2$ would mean no autocorrelation). A large $R^{2}$ paired
      with a Durbin–Watson statistic well below it — rather than near $2$ — is
      the tell that the fit is riding on shared wandering, not a real
      relationship. The fix is either to regress differences on differences,
      collapsing both series back to something stationary, or to first
      establish cointegration before trusting a levels regression at all.
    worked: >
      A backtest regression of one desk's cumulative P&L against an unrelated
      series' level returns $R^{2}=0.42$ with a large $t$-statistic on the
      slope, but Durbin–Watson comes back at $0.18$. Durbin–Watson near $0$
      while $R^{2}$ is large — rather than Durbin–Watson near $2$ — is exactly
      the spurious-regression signature, regardless of how convincing the
      $R^{2}$ looks on its own.
    interview: >
      "You regressed strategy X's cumulative P&L against a benchmark and got
      $R^{2}=0.6$ with a huge $t$-statistic — is this real?" wants an
      immediate check of whether both series are levels (potentially $I(1)$),
      a request for the Durbin–Watson statistic, and a refusal to trust the
      fit if it's low relative to the $R^{2}$.
    pitfalls: >
      Trusting a high $R^{2}$ or large $t$-statistic from a levels-on-levels
      regression of two trending or wandering series without checking
      stationarity first. Assuming a larger sample fixes a spurious fit — the
      $t$-statistic diverges rather than shrinking, so more data makes the
      mistake look more convincing, not less.
    recap: >
      Two unrelated random walks regress onto each other with a large
      $R^{2}$ and a huge, ever-growing $t$-statistic — a Durbin–Watson near
      $0$ against a large $R^{2}$ is the tell, and more data does not fix it.
    dialogue:
      - part: Two coins, one regression
        teach: >
          Two traders each flip their own fair coin eight times and keep a
          running tally from $0$, adding $1$ for heads and subtracting $1$ for
          tails. Tally $x$ reads $0, 1, 0, 1, 2, 3, 4, 3, 4$; tally $y$ reads
          $0, -1, 0, 1, 2, 3, 4, 5, 4$. Both average $2$, and around those
          means $\sum(x - \bar{x})^{2} = 20$, $\sum(y - \bar{y})^{2} = 36$ and
          $\sum(x - \bar{x})(y - \bar{y}) = 24$.
      - ask: >
          What is the least-squares slope of $y$ on $x$?
        expects: "1.2"
        hint: >
          Slope is the cross sum over the $x$ sum of squares.
        feedback: >
          $24/20 = 1.2$: each extra head in trader $x$'s tally "goes with"
          $1.2$ extra in trader $y$'s.
      - ask: >
          What is the $R^{2}$ of that regression?
        expects: "0.8"
        hint: >
          $R^{2}$ is the squared correlation: cross sum squared over the
          product of the two sums of squares.
        feedback: >
          $24^{2}/(20 \times 36) = 576/720 = 0.8$. Eighty percent of one
          coin's tally "explained" by another coin.
      - ask: >
          On how many of the eight flips did the two tallies move in the same
          direction?
        expects: "4"
        hint: >
          Write out each tally's step, $+1$ or $-1$, flip by flip.
        feedback: >
          The steps are $+, -, +, +, +, +, -, +$ for $x$ and
          $-, +, +, +, +, +, +, -$ for $y$. They agree on flips $3$ to $6$ and
          disagree on the other four: four of eight, exactly what two
          unrelated coins should do. The changes share nothing.
      - reflect: >
          The changes are unrelated, yet the levels fit with $R^{2} = 0.8$.
          What is the regression actually matching? And why should the usual
          OLS standard error, built for residuals that are roughly independent
          from one day to the next, be badly wrong here?
        hint: >
          Look at where each tally spends the first half of the flips, and the
          second half.
        answer: >
          It is matching the two paths' wandering: both happened to sit low
          early and high late, and a straight line through the levels rewards
          that. If the true slope is $0$, the residual is essentially $y$ minus
          a constant, a random walk, so each residual nearly repeats the last.
          The standard-error formula counts every day as fresh evidence when
          consecutive days are almost the same observation, so it reports far
          more certainty than the data hold.

      - part: More data makes it worse
        teach: >
          Granger and Newbold ran this at scale: simulate pairs of independent
          random walks and regress one on the other. At $n = 50$ the slope's
          $t$-statistic clears $1.96$ most of the time, far above the $5\%$ a
          valid test allows, $R^{2}$ is routinely a few tenths, and the
          residuals are themselves $I(1)$. That is spurious regression.
      - ask: >
          What happens to the slope's $t$-statistic as $n$ grows?
        choices:
          - text: >
              It shrinks toward insignificance: more data exposes a false
              relationship.
            feedback: >
              That is what happens with stationary data, where the noise
              averages out. Here the residuals never settle, so there is
              nothing for more data to average.
          - text: >
              It settles at some fixed, too-large value.
            feedback: >
              It does not settle. The standard error is wrong by a factor that
              itself grows with $n$.
          - text: >
              It grows, roughly like $\sqrt{n}$.
            correct: true
            feedback: >
              Right. The illusion of significance sharpens with every extra
              observation.
        feedback: >
          The cause is structural, not small-sample: OLS standard errors assume
          well-behaved residuals, and integrated residuals make them wrong by
          an unbounded factor.
      - ask: >
          A spurious levels regression shows $t = 2.4$ on $50$ days. Roughly
          what $t$ would the same kind of regression show on $1250$ days?
        expects: "12"
        hint: >
          The sample is $25$ times larger.
        feedback: >
          $2.4 \times \sqrt{25} = 2.4 \times 5 = 12$. Five years of data, and a
          meaningless slope looks twelve standard errors from zero.

      - part: Spotting it, and the cure
        teach: >
          The Durbin–Watson statistic $d$ measures the lag-$1$ autocorrelation
          of a regression's residuals. It sits near $2$ when consecutive
          residuals are uncorrelated and falls toward $0$ when each residual
          nearly repeats the one before.
      - ask: >
          Where does $d$ sit for a regression of one independent random walk on
          another?
        choices:
          - text: >
              Near $2$: the two walks are independent.
            feedback: >
              Independence between the two walks says nothing about each
              residual's link to the previous one. The residual wanders like a
              walk, so consecutive residuals are close.
          - text: >
              Near $0$.
            correct: true
            feedback: >
              Right. Integrated residuals have lag-$1$ autocorrelation near
              $1$, which drives $d$ toward $0$.
          - text: >
              Well above $2$.
            feedback: >
              Above $2$ means residuals that flip sign from day to day, negative
              autocorrelation. A wandering residual does the opposite.
        feedback: >
          The tell to say out loud: a Durbin–Watson statistic below the
          $R^{2}$ means the fit is riding on shared wandering.
      - ask: >
          A backtest regresses a fund's cumulative P&L on the level of a
          commodity index and reports $R^{2} = 0.64$, $t = 9$ and $d = 0.21$.
          What is your reading?
        choices:
          - text: >
              Strong evidence: a $t$ of $9$ does not happen by chance.
            feedback: >
              Between two wandering levels it happens routinely, and it grows
              with the sample. The $t$-statistic is the number least to be
              trusted here.
          - text: >
              Suspect it is spurious: $d$ is far below $R^{2}$ and both series
              are levels.
            correct: true
            feedback: >
              Right. Two cumulative series, a big $R^{2}$ and a collapsed $d$ is
              the spurious-regression signature until shown otherwise.
          - text: >
              Fine, with some autocorrelation to correct in the standard
              errors.
            feedback: >
              A $d$ of $0.21$ is not mild autocorrelation; it is residuals that
              barely move from day to day. No small correction rescues a
              regression whose residuals are $I(1)$.
        feedback: >
          Ask first whether both sides are levels, then for $d$.
      - ask: >
          What is the right next step for that backtest?
        choices:
          - text: >
              Add a linear time trend to the regression.
            feedback: >
              A trend removes a deterministic line, but a random walk's
              wandering is not a line, and the residuals stay $I(1)$.
          - text: >
              Double the sample and rerun.
            feedback: >
              The $t$-statistic would grow by about $\sqrt{2}$, and the
              conclusion would look even more convincing and be just as wrong.
          - text: >
              Regress daily changes on daily changes, or first establish
              cointegration.
            correct: true
            feedback: >
              Right. Changes are stationary, so OLS's assumptions hold again;
              a levels regression is only legitimate when a stationary spread
              ties the two series together.
        feedback: >
          The cure targets the residuals, not the sample size.
      - ask: >
          Back to the coins. Regress the flip-by-flip changes of $y$ on those of
          $x$, with an intercept. Around their means, the changes give a cross
          sum of $-2$ and a sum of squares for $x$ of $6$. What is the slope?
        expects: "-1/3"
        tolerance: 0.0005
        hint: >
          Same formula as before, on the changes.
        feedback: >
          $-2/6 = -1/3$, with $R^{2} = 4/36 \approx 0.11$. A small slope of the
          wrong sign, the kind of thing eight unrelated flips produce, and now
          its standard error is honest. The $1.2$ and $0.8$ from the levels came
          entirely from shared wandering.

  - node: quant-statistics.time-series.cointegration
    hook: >
      This is pairs trading's actual license: why regressing two wandering
      price levels on each other is sometimes legitimate rather than the
      spurious-regression trap just covered.
    explanation: >
      Spurious regression is what happens generically when two $I(1)$ series
      are regressed with nothing tying them together. Cointegration is the
      specific exception: if some linear combination $y_t-\beta x_t$ is
      itself stationary, that combination — the spread — is a real,
      economically meaningful object even though $x_t$ and $y_t$ individually
      wander without bound. The levels regression that recovers $\beta$ is
      then not spurious at all; it's estimating the one linear combination
      that happens to cancel the shared wandering.

      The Engle–Granger recipe runs the two ideas from this unit back to
      back: estimate $\beta$ by ordinary least squares on the levels, then
      run the unit-root test on the *residual* of that fit. The catch is that
      $\beta$ was chosen specifically to make the residual look as stationary
      as possible, which biases a plain Dickey–Fuller test toward finding
      stationarity that isn't there — so the test needs its own, adjusted
      critical values, stricter than the raw Dickey–Fuller ones. When
      cointegration genuinely holds, $\beta$ is "super-consistent": it
      converges at rate $n$ rather than the usual $\sqrt{n}$, because the
      shared wandering that would otherwise inflate the standard error is
      precisely what's being cancelled out by the correct $\beta$.
    worked: >
      Two names with true hedge ratio $\beta=1.5$ and a spread
      $y_t-1.5x_t$ that follows a stationary AR(1) with $\phi=0.9$ — a
      half-life around $6.6$ periods. Fitting $\beta$ by OLS on a finite
      sample gives $\hat\beta=1.47$, already close because of the
      super-consistent convergence rate, and the residual's unit-root test
      statistic clears the stricter, Engle–Granger-adjusted critical value
      even though it would have looked marginal against a plain
      Dickey–Fuller table.
    interview: >
      "Two related stocks each look like random walks individually, but
      their spread looks mean-reverting — what's this called, and how do you
      test it?" wants "cointegration," the Engle–Granger two-step recipe
      named explicitly, and the caveat that the residual test needs its own
      critical values, not plain Dickey–Fuller ones.
    pitfalls: >
      Testing the fitted residual for a unit root using ordinary
      Dickey–Fuller critical values instead of the stricter Engle–Granger
      ones — understating how easy it is to manufacture an apparently
      stationary residual by fitting $\beta$ to the data. Calling any two
      wandering series with a high levels-regression $R^{2}$ cointegrated
      without testing the residual explicitly — that's the spurious-regression
      trap wearing a different label.
    recap: >
      Two wandering series tied by a stationary spread: the Engle–Granger
      test recovers $\beta$ by OLS on levels, then checks the residual for a
      unit root with its own critical values, and a genuine $\beta$ converges
      at the unusually fast rate $n$.
    dialogue:
      - part: Two series riding one wander
        teach: >
          A commodity's log price $w_t$ is a random walk with daily shocks of
          variance $1$, starting from $w_0 = 0$. Two listed products track it:
          $x_t = w_t + u_t$ and $y_t = 3w_t + v_t$, where $u_t$ and $v_t$ are
          independent white noise of variances $1$ and $4$, unrelated to $w$.
          Each of $x$ and $y$ wanders without bound.
      - ask: >
          What is $\operatorname{Var}(y_t - 3x_t)$?
        expects: "13"
        hint: >
          Substitute and watch what happens to $w_t$.
        feedback: >
          $y_t - 3x_t = 3w_t + v_t - 3w_t - 3u_t = v_t - 3u_t$, so the variance
          is $4 + 9 \times 1 = 13$, the same on every day. The wandering
          cancelled.
      - ask: >
          What is $\operatorname{Var}(y_{100} - 2x_{100})$?
        expects: "108"
        hint: >
          This time some of $w_t$ survives.
        feedback: >
          $y_t - 2x_t = w_t + v_t - 2u_t$, so on day $100$ the variance is
          $100 + 4 + 4 = 108$, and on day $400$ it is $408$. With the wrong
          weight the combination is still a random walk plus noise.
      - ask: >
          Now take two *independent* random walks instead. Is there a weight
          $\beta$ that makes $y_t - \beta x_t$ stationary?
        choices:
          - text: >
              Yes: the least-squares slope of $y$ on $x$.
            feedback: >
              For independent walks that slope is the spurious-regression
              slope, a number fitted to two unrelated wanders. The residual
              $y_t - \beta x_t$ is still a walk.
          - text: >
              Yes, $\beta = 1$: the difference of two walks is stationary.
            feedback: >
              The difference of two independent walks is a walk with twice the
              shock variance. Subtracting cancels a trend only if it is the
              same trend.
          - text: >
              No: every combination still contains at least one of the two
              wanders.
            correct: true
            feedback: >
              Right. With $\beta = 0$ you have $y$ itself, and with any other
              $\beta$ you have $y$'s wander plus $-\beta$ times $x$'s, neither
              of which can cancel the other.
        feedback: >
          The first pair has a combination that stops wandering, the second does
          not.

      - part: What ties a pair together
        reflect: >
          Both pairs consist of two series that wander without bound. What
          exactly does the first pair have that the second lacks, and what is
          special about the number $3$?
        hint: >
          Count how many separate random walks drive each pair.
        answer: >
          The first pair is driven by a single random walk $w_t$, loaded with
          weight $1$ in $x$ and $3$ in $y$. Taking $y - 3x$ removes that one
          shared trend exactly and leaves stationary noise. The second pair
          has two independent trends, and no single weight cancels both. So
          $3$ is the ratio of the two loadings: the one weight that matches the
          wanders.
      - teach: >
          That is cointegration. Two $I(1)$ series $x_t$ and $y_t$ are
          cointegrated when some linear combination $y_t - \beta x_t$ is
          stationary: each wanders, but they do not wander apart. $\beta$ is the
          cointegrating coefficient, read on a desk as a hedge ratio: hold one
          unit of $y$ against $\beta$ units of $x$. The spread it produces
          typically behaves like a mean-reverting AR(1) with a finite
          half-life, which is what a pairs trade trades.
      - ask: >
          Two stationary series, an AR(1) interest-rate spread and an AR(1)
          volume series, have $y_t - 0.5x_t$ stationary. Are they cointegrated?
        choices:
          - text: >
              Yes, with $\beta = 0.5$.
            feedback: >
              $y_t - 0.5x_t$ is stationary, but so is every combination of two
              stationary series. There is no wander for the weight to cancel,
              so the statement carries no information.
          - text: >
              No: cointegration is about $I(1)$ series, and these are already
              $I(0)$.
            correct: true
            feedback: >
              Right. The definition has two clauses: each series must be
              $I(1)$, and some combination must be $I(0)$. These fail the
              first.
          - text: >
              Only if their correlation is high.
            feedback: >
              Correlation between two stationary series is an ordinary
              regression question. Cointegration is about cancelling wanders,
              and these series have none.
        feedback: >
          Check both clauses: each series wanders, and one combination does
          not.

      - part: Finding the weight from data
        ask: >
          You do not know the $3$ and try to estimate it. Fearing a spurious
          regression, you regress daily changes $\Delta y_t$ on $\Delta x_t$.
          What slope does that regression find?
        expects: "1"
        hint: >
          $\Delta x_t = \Delta w_t + u_t - u_{t-1}$ and
          $\Delta y_t = 3\Delta w_t + v_t - v_{t-1}$. Compute the covariance
          and the variance of $\Delta x_t$.
        feedback: >
          $\operatorname{Cov}(\Delta y_t, \Delta x_t) = 3\operatorname{Var}(\Delta w_t) = 3$,
          and $\operatorname{Var}(\Delta x_t) = 1 + 2 = 3$, so the slope is
          $1$. Differencing threw away the long-run tie and amplified the noise
          in $x$; the changes do not know the hedge ratio.
      - ask: >
          Which regression does recover the $3$?
        choices:
          - text: >
              None: the levels regression is spurious and the changes
              regression is biased.
            feedback: >
              The levels regression is spurious when no combination is
              stationary. Here one is, and that changes everything about it.
          - text: >
              The levels regression of $y_t$ on $x_t$.
            correct: true
            feedback: >
              Right. As $w_t$ wanders further, the noise $u_t$ becomes a
              vanishing share of $x_t$'s variation, and the slope closes in on
              $3$. Under cointegration the levels estimate is super-consistent:
              its error shrinks like $1/n$, not $1/\sqrt{n}$.
          - text: >
              The changes regression, given enough data.
            feedback: >
              More data pins its slope down to $1$, precisely. The bias comes
              from the noise in $\Delta x_t$, and it does not shrink with $n$.
        feedback: >
          Cointegration is the case where regressing levels on levels is
          legitimate rather than spurious.
      - teach: >
          The Engle–Granger test runs this in two steps: estimate $\beta$ by
          least squares on the levels, then test the residual
          $y_t - \hat{\beta}x_t$ for a unit root. That second step has its own
          critical values, stricter than the plain Dickey–Fuller ones.
      - ask: >
          Why does the residual test need stricter critical values?
        choices:
          - text: >
              Least squares chose $\hat{\beta}$ to make the residual as small and
              tame as possible, so it looks stationary more often than an
              untouched series would.
            correct: true
            feedback: >
              Right. Even for two independent walks the fitted residual is the
              least wandering combination available, which biases a plain
              Dickey–Fuller test toward finding a spread that is not there.
          - text: >
              The residual has fewer observations than the original series.
            feedback: >
              It has exactly as many. The issue is that it was optimised, not
              that it is shorter.
          - text: >
              They do not: the Dickey–Fuller table already covers any series.
            feedback: >
              The plain table is for a series you did not shape. A residual
              built by choosing $\beta$ is not that, and using the plain table
              finds cointegration too easily.
        feedback: >
          Fit, then test with the tougher table.
      - ask: >
          A last pair: $x_t = w_t + u_t$ as before, and $y_t = 3w_t + z_t$,
          where $z_t$ is a second, independent random walk. Are they
          cointegrated?
        choices:
          - text: >
              Yes, with $\beta = 3$, since they share the trend $w_t$.
            feedback: >
              $y_t - 3x_t = z_t - 3u_t$, which still contains the walk $z_t$.
              Sharing one trend is not enough when $y$ carries a second one.
          - text: >
              No: both are $I(1)$, but no combination is stationary.
            correct: true
            feedback: >
              Right. Every $y_t - \beta x_t$ contains $z_t$, so the first clause
              holds and the second fails. A spread on this pair has no level to
              revert to.
          - text: >
              No, because $y$ is not $I(1)$.
            feedback: >
              $y$ is a sum of two walks, which is a walk: $I(1)$. The pair fails
              the other clause.
        feedback: >
          A shared trend makes a pair look tied. Only a stationary spread makes
          it so.

  - node: quant-statistics.time-series.effective-sample-size
    hook: >
      A Sharpe ratio computed off autocorrelated daily P&L lies by exactly the
      multiple this node derives — the reason a backtest that looks
      significant with $n$ observations often isn't.
    explanation: >
      Substitute $\rho_k=\phi^{k}$ into the general variance-of-a-mean formula
      and let $n$ grow: the $k/n$ taper vanishes and the sum
      $\sum_{k\ge1}\phi^{k}$ collapses to the geometric series
      $\phi/(1-\phi)$. The bracket therefore tends to
      $1+2\phi/(1-\phi)=(1-\phi+2\phi)/(1-\phi)=(1+\phi)/(1-\phi)$ — the
      inflation factor over the naive iid variance $\gamma_0/n$. Reading it as
      an effective sample size, $n_{\text{eff}}=n(1-\phi)/(1+\phi)$, makes the
      mechanism concrete: correlated observations are partially double-counted
      information, so a sample of $n$ autocorrelated points carries the actual
      information content of a much smaller iid sample.

      The practical trap is that a standard t-test or Sharpe-ratio
      significance calculation plugs in the raw $n$, understating the true
      standard error by the square root of that same factor. Positive $\phi$
      always inflates the variance of the mean; negative $\phi$ does the
      opposite, since alternating signs partially cancel across neighboring
      terms rather than reinforcing each other.
    worked: >
      $\phi=0.7$: the inflation factor is
      $(1+0.7)/(1-0.7)=1.7/0.3\approx5.67$, so standard errors computed
      ignoring autocorrelation are too small by a factor of
      $\sqrt{5.67}\approx2.38$. With $n=1000$ raw observations,
      $n_{\text{eff}}=1000(0.3)/1.7\approx176$ — roughly a sixth of the
      apparent sample size.
    interview: >
      "Your backtest has $1000$ daily P&L observations with lag-1
      autocorrelation $0.3$ — how much does that change your confidence
      interval?" wants the factor $(1+0.3)/(1-0.3)=1.857$ computed live,
      standard errors about $1.36\times$ wider, and roughly $539$ effective
      observations instead of $1000$.
    pitfalls: >
      Running a standard significance test on autocorrelated P&L with the raw
      observation count, overstating confidence by exactly the factor derived
      here. Applying this specific $(1+\phi)/(1-\phi)$ multiplier to a series
      whose dependence isn't AR(1)-shaped — an MA(1) or a different structure
      inflates the variance of the mean by a different formula entirely.
    recap: >
      Positive serial correlation multiplies the variance of a sample mean
      by $(1+\phi)/(1-\phi)$ — $5.67\times$ at $\phi=0.7$ — so a naive
      $t$-statistic on an autocorrelated series is overconfident by the
      square root of that factor.
    dialogue:
      - part: Two days worth less than two
        teach: >
          A strategy's daily P&L, in thousands, has variance $4$ on every day,
          and positions roll over, so its lag-$k$ autocorrelation is $0.8^{k}$:
          an AR(1) with $\phi = 0.8$. A risk manager wants to know how precisely
          an average of these days pins down the strategy's true mean.
      - ask: >
          What is the variance of the average of two consecutive days?
        expects: "3.6"
        hint: >
          $\operatorname{Var}\left(\tfrac{x_1 + x_2}{2}\right) =
          \tfrac{1}{4}\left(\operatorname{Var}(x_1) + \operatorname{Var}(x_2) +
          2\operatorname{Cov}(x_1, x_2)\right)$.
        feedback: >
          The covariance is $0.8 \times 4 = 3.2$, so the variance is
          $(4 + 4 + 6.4)/4 = 3.6$. Two independent days would give $4/2 = 2$.
          The second day mostly repeats the first, and the average has $1.8$
          times the variance the iid formula claims.
      - reflect: >
          Now $n$ days. Write $\operatorname{Var}(\bar{x}_n)$ as $1/n^{2}$ times
          the sum of all $n^{2}$ covariances $\operatorname{Cov}(x_s, x_t)$.
          How many of those pairs sit at lag $k$, and what formula comes out?
        hint: >
          Lay the covariances out as an $n \times n$ grid; lag $k$ is a pair of
          diagonals.
        answer: >
          The main diagonal has $n$ entries equal to $\gamma_0$, and the two
          diagonals at lag $k$ have $n - k$ entries each, all equal to
          $\gamma_k = \gamma_0\rho_k$. Dividing by $n^{2}$ gives
          $\operatorname{Var}(\bar{x}_n) = \frac{\gamma_0}{n}\left(1 +
          2\sum_{k=1}^{n-1}\left(1 - \frac{k}{n}\right)\rho_k\right)$. The iid
          answer is the $1$; every positive autocorrelation adds to it.
      - teach: >
          That is the variance of a sample mean for any stationary series. The
          bracket is the inflation over the iid formula $\gamma_0/n$. At
          $n = 2$ it is $1 + \rho_1$, which is the $1.8$ you just found.
      - ask: >
          For the AR(1) with $\phi = 0.8$ and $n$ large, the taper $1 - k/n$ is
          close to $1$ over every lag that matters. What does the bracket tend
          to?
        expects: "9"
        hint: >
          $0.8 + 0.8^{2} + 0.8^{3} + \dots = 0.8/(1 - 0.8)$.
        feedback: >
          $1 + 2 \times 0.8/0.2 = 1 + 8 = 9$. In general
          $1 + 2\phi/(1-\phi) = (1+\phi)/(1-\phi)$, which is $1.8/0.2 = 9$
          here.
      - teach: >
          So for an AR(1) with large $n$, autocorrelation multiplies the
          variance of the sample mean by $(1+\phi)/(1-\phi)$, and the sample
          is worth $n_{\text{eff}} = n(1-\phi)/(1+\phi)$ independent
          observations. At $\phi = 0.8$, nine correlated days carry about one
          day of information about the mean.

      - part: The t-statistic that was not
        teach: >
          Over $1000$ days the strategy averages $0.2$ a day, with daily
          standard deviation $2$. The desk reports a $t$-statistic for the mean
          computed the usual way, $\bar{x}/(s/\sqrt{n})$.
      - ask: >
          What $t$-statistic does the desk report, to two decimals?
        expects: "3.16"
        tolerance: 0.01
        hint: >
          $\sqrt{1000} \approx 31.62$.
        feedback: >
          $0.2/(2/31.62) = 0.2/0.0632 \approx 3.16$. Comfortably past $1.96$, on
          the iid formula.
      - ask: >
          Correct the standard error for $\phi = 0.8$. What is the honest
          $t$-statistic, to two decimals?
        expects: "1.05"
        tolerance: 0.01
        hint: >
          The variance is $9$ times larger, so the standard error is how many
          times larger?
        feedback: >
          The standard error grows by $\sqrt{9} = 3$, so $t = 3.16/3 \approx
          1.05$. Equivalently, $n_{\text{eff}} = 1000/9 \approx 111$, and
          $0.2/(2/\sqrt{111}) \approx 1.05$.
      - ask: >
          What do you tell the desk?
        choices:
          - text: >
              The edge is real; $1000$ days is a long record.
            feedback: >
              It is $1000$ days of P&L carrying about $111$ days of information
              about the mean, and on that the mean is barely one standard error
              from zero.
          - text: >
              The average itself is biased upward by the autocorrelation.
            feedback: >
              The sample mean is still unbiased for a stationary series. What
              the autocorrelation spoils is the standard error, not the
              estimate.
          - text: >
              The mean is not distinguishable from zero once the
              autocorrelation is counted.
            correct: true
            feedback: >
              Right. The naive $t$ was too confident by a factor of $3$, the
              square root of the inflation.
        feedback: >
          An autocorrelated P&L stream makes a naive $t$-statistic on its mean
          far too confident, by $\sqrt{(1+\phi)/(1-\phi)}$.

      - part: Where the factor bends
        ask: >
          A market-making book has P&L that alternates, $\phi = -0.8$. What is
          the large-$n$ inflation factor now?
        expects: "1/9"
        tolerance: 0.0005
        hint: >
          Same formula, $(1+\phi)/(1-\phi)$.
        feedback: >
          $0.2/1.8 = 1/9$. Good days tend to follow bad ones and cancel in the
          average, and the variance of the mean is a ninth of what the iid
          formula says. Negative autocorrelation shrinks the error bars.
      - ask: >
          A slow signal's P&L has $\phi = 0.99$, and you have only $n = 50$
          days. The large-$n$ formula gives $n_{\text{eff}} = 50 \times
          0.01/1.99 \approx 0.25$. What is going on?
        choices:
          - text: >
              The sample holds a quarter of an observation's worth of
              information.
            feedback: >
              An average of days each with variance $\gamma_0$ never has
              variance above $\gamma_0$, so $n_{\text{eff}}$ is at least $1$.
              A value of $0.25$ is the formula failing, not a fact about the
              data.
          - text: >
              The large-$n$ limit does not apply: $50$ days is short next to a
              memory this long, and the taper $1 - k/n$ matters.
            correct: true
            feedback: >
              Right. With the taper the exact bracket is about $42.6$, so
              $n_{\text{eff}} \approx 50/42.6 \approx 1.2$. Still almost nothing,
              but now a sensible almost nothing.
          - text: >
              It means the P&L is not stationary.
            feedback: >
              $\phi = 0.99$ is stationary, just very persistent. The trouble is
              using a limit as $n \to \infty$ on a sample that has not yet seen
              the memory play out.
        feedback: >
          $(1+\phi)/(1-\phi)$ is a large-$n$ AR(1) result. For a short sample
          or a different dependence shape, go back to the bracket with the
          actual $\rho_k$.

  - node: quant-statistics.time-series.vol-clustering
    hook: >
      These four facts are what every real risk model and every "have you
      actually looked at market data" interview question are built on — and
      they split a return series into two very differently-behaved halves.
    explanation: >
      Run the sample-ACF machinery on the return level itself: for a liquid
      asset, $\hat\rho_1$ and its neighbors sit inside the
      $\pm2/\sqrt{n}$ noise band almost everywhere past the first
      microstructure lags. This is the return-level counterpart of
      differencing a unit-root price series to reach something close to
      $I(0)$ — and market efficiency independently reinforces it, since any
      exploitable linear predictability in the level would already have been
      traded away.

      Run the *same* sample-ACF machinery on $|r_t|$ or $r_t^{2}$ instead, and
      the picture reverses completely: these clear the noise band and stay
      visibly positive for lags stretching out to months. Squaring or taking
      absolute value throws away the sign of a move but keeps its size, so
      this is a genuinely separate fact from the first — a large move today,
      of either sign, makes another large move more likely tomorrow, which
      the mean-level ACF is structurally blind to since it only ever sees
      signed values. Heavy tails follow the same logic at a single point in
      time: daily kurtosis routinely exceeds the normal distribution's $3$,
      because a volatility-clustering series is really a mixture of calm and
      turbulent regimes, and mixtures of different-scale normals produce
      exactly this kind of excess kurtosis; aggregating to monthly averages
      over many days and thins the tails back toward normal by the same
      averaging logic that underlies the CLT. The leverage effect adds a
      final asymmetry: a negative return raises future volatility by more
      than an equal-sized positive one does.
    worked: >
      With $n=1000$, the noise band is $\pm1.96/\sqrt{1000}\approx\pm0.062$.
      A level return series with $\hat\rho_1=0.02$ sits comfortably inside it
      — indistinguishable from noise. The same data's squared-return series
      might show $\hat\rho_1=0.18$ and $\hat\rho_{20}=0.05$ — both clearing
      the same $\pm0.062$ band, the first by a wide margin and the second
      still detectably outside it twenty lags later.
    interview: >
      "What do real return series look like, statistically?" wants the four
      facts named crisply and in order: near-zero linear autocorrelation in
      the level, strongly persistent autocorrelation in $|r_t|$ or $r_t^{2}$
      (volatility clustering), fat tails relative to the normal, and the
      leverage effect.
    pitfalls: >
      Running only a level-return ACF, seeing nothing, and concluding "the
      market is fully unpredictable" — predictability lives in the second
      moment, invisible to that test. Quoting a kurtosis number without a
      stated frequency, since the same series looks far closer to normal
      monthly than daily. Treating "returns are nearly uncorrelated" as
      "returns are independent" — persistent autocorrelation in $r_t^{2}$
      is direct proof they aren't.
    recap: >
      The level of returns is close to white noise while their scale is
      strongly forecastable: uncorrelated returns, clustered volatility,
      fat tails, and a leverage asymmetry, all holding across liquid assets
      and frequencies.
    dialogue:
      - part: Two correlograms of one series
        teach: >
          You have $1600$ daily returns on an equity index. Their sample ACF
          reads $-0.03$ at lag $1$ and stays tiny at every later lag. The sample
          ACF of the *squared* returns reads $0.24$ at lag $1$, $0.21$ at lag
          $2$, and is still $0.07$ at lag $60$.
      - ask: >
          What is the $\pm 1.96/\sqrt{n}$ band for these $1600$ days?
        expects: "0.049"
        tolerance: 0.0005
        hint: >
          $\sqrt{1600} = 40$.
        feedback: >
          $1.96/40 = 0.049$. The returns' lag-$1$ value of $-0.03$ sits inside
          it; the squared returns' $0.24$ is about five times the band's width,
          and even lag $60$ clears it.
      - ask: >
          What do the two correlograms say together?
        choices:
          - text: >
              One of them must be wrong: a series cannot be both unpredictable
              and predictable.
            feedback: >
              They answer different questions. One is about the sign and size of
              tomorrow's return together, the other about its size alone, and
              the two can disagree.
          - text: >
              The returns are close to linearly unpredictable, while their size
              is strongly and persistently predictable.
            correct: true
            feedback: >
              Right. Large moves follow large moves, of either sign, for months,
              while the direction of tomorrow's move is close to a coin flip.
          - text: >
              The squared-return values just restate the return values, squared.
            feedback: >
              Squaring the return ACF gives $(-0.03)^{2} \approx 0.001$. The
              $0.24$ is the autocorrelation of a different series, $r_t^{2}$,
              and carries different information.
        feedback: >
          Run the same sample-ACF machinery on $r_t$ and on $r_t^{2}$ and you
          get two different pictures of one series.
      - reflect: >
          How can $\operatorname{Cov}(r_t, r_{t+k})$ be close to $0$ while
          $\operatorname{Cov}(r_t^{2}, r_{t+k}^{2})$ is clearly positive? What
          kind of dependence does that describe?
        hint: >
          Think of each return as a sign times a size.
        answer: >
          If the sign is close to a fair coin each day but the size persists,
          the product $r_t r_{t+k}$ is positive as often as negative and
          averages out, so the covariance sees nothing. Squaring throws the
          sign away and keeps the size, and the sizes are linked. The returns
          are close to white noise but not independent: the dependence runs
          through the scale, not the direction.
      - teach: >
          Those are the first two stylized facts of returns, holding across
          liquid assets and frequencies. Returns are close to linearly
          unpredictable: daily $|\rho_1|$ is typically under $0.05$ and the
          sample ACF sits inside the band past the first few microstructure
          lags. And $|r_t|$ and $r_t^{2}$ are strongly, persistently
          autocorrelated: volatility clustering.

      - part: What clustering does to the tails
        ask: >
          Suppose each day's return is normal given that day's volatility, but
          the volatility drifts between calm and turbulent stretches. Compared
          with a single normal of the same overall variance, the histogram of
          all the days pooled together has what shape?
        choices:
          - text: >
              The same normal shape: each day is normal, so the pool is too.
            feedback: >
              A pool of normals with *different* widths is not normal. The
              narrow ones pile up in the middle and the wide ones populate the
              tails.
          - text: >
              Thinner tails, because calm days drag the spread down.
            feedback: >
              The calm days do narrow the middle, but the overall variance is
              held fixed, so the turbulent days must reach further out to make
              up for them.
          - text: >
              A taller middle and fatter tails.
            correct: true
            feedback: >
              Right. A mixture of normals with different scales has kurtosis
              above the normal's $3$. The next two numbers show how much.
        feedback: >
          Fat tails are not a separate mystery: they are what volatility
          clustering looks like once you forget the dates.
      - ask: >
          Take half the days calm, with standard deviation $1\%$, and half
          turbulent, with standard deviation $3\%$, each normal within its
          regime. What is the overall standard deviation, in percent, to two
          decimals?
        expects: "2.24"
        tolerance: 0.01
        hint: >
          Average the two variances, then take the square root.
        feedback: >
          $(1 + 9)/2 = 5$, and $\sqrt{5} \approx 2.24\%$.
      - ask: >
          A $9\%$ move is a three-standard-deviation day for the turbulent
          regime. How many overall standard deviations is it, to two decimals?
        expects: "4.02"
        tolerance: 0.01
        hint: >
          Divide by $2.24$.
        feedback: >
          $9/2.236 \approx 4.02$. A normal with standard deviation $2.24\%$
          produces a move that size on about $6$ days in a hundred thousand. Here the
          turbulent half produces it on $0.27\%$ of its days, $0.135\%$ of all
          days, more than twenty times as often. Daily kurtosis well above $3$
          is the third stylized fact, and it thins as you aggregate to monthly
          returns.

      - part: An asymmetry, and what it rules out
        ask: >
          For an equity index, which day tends to be followed by higher
          volatility: a $-3\%$ day or a $+3\%$ day?
        choices:
          - text: >
              Neither: volatility clustering depends only on the size of the
              move.
            feedback: >
              Clustering alone would say so. For equities the data say more:
              falls raise future volatility by more than equal-sized rises.
          - text: >
              The $-3\%$ day.
            correct: true
            feedback: >
              Right. That is the leverage effect, the fourth stylized fact: a
              fall raises the firm's leverage and the market's fear together,
              and both push volatility up.
          - text: >
              The $+3\%$ day, since rallies attract momentum traders.
            feedback: >
              Rallies tend to calm equity markets. The asymmetry runs the other
              way.
        feedback: >
          The four facts: returns close to linearly unpredictable, volatility
          clustered, tails fat, and falls feeding volatility more than rises.
      - ask: >
          A colleague concludes from the flat return correlogram that daily
          returns are independent from day to day. What is wrong with that?
        choices:
          - text: >
              Nothing: zero autocorrelation at every lag means independence.
            feedback: >
              Zero autocorrelation rules out linear dependence only. The
              squared returns' $0.24$ at lag $1$ is dependence the return
              correlogram cannot see.
          - text: >
              The flat correlogram is too short; with more data it would show
              structure.
            feedback: >
              On $1600$ days the band is already $\pm 0.049$, and liquid
              index returns stay inside it. More data will not reveal linear
              predictability that is not there.
          - text: >
              Uncorrelated is weaker than independent, and the squared returns
              show the dependence directly.
            correct: true
            feedback: >
              Right. Returns are the textbook case of white noise that is not
              iid.
        feedback: >
          The interview trap is exactly this colleague's step: hearing
          "uncorrelated" as "unpredictable". The predictability in returns
          lives in their second moment.

  - node: quant-statistics.time-series.level-versus-scale
    hook: >
      "Why do volatility models make money while directional models mostly
      don't?" is asked almost verbatim, and the answer is this node's whole
      content in two sentences.
    explanation: >
      Combine the two facts already in hand. A one-step AR(1) forecast
      explains a fraction $\phi^{2}$ of variance, and market efficiency keeps
      realistic level-autocorrelation in returns tiny — something like
      $\phi=0.02$, explaining $\phi^{2}=0.0004$, a fraction of a percent of
      variance, arbitraged down to near nothing precisely because a
      directional edge is trivial to trade against directly: buy or sell,
      done. Nothing in that argument touches volatility. Knowing tomorrow's
      variance will be high doesn't hand you a directional bet the way
      knowing tomorrow's mean would — capturing it requires a genuinely
      different instrument, like an option or a realized-versus-implied
      structure, not a simple long or short. The efficient-markets force that
      erases level-autocorrelation has no direct analogue acting on
      scale-autocorrelation, so it survives instead.

      That asymmetry is the actual content behind "volatility is predictable"
      — not a mysterious exception to market efficiency, but a consequence of
      which quantity is easy to trade against directly. It's also the reason
      the whole ARCH/GARCH literature exists and is pointed specifically at
      the conditional variance rather than the conditional mean.
    worked: >
      A level signal with $\phi=0.05$ explains $\phi^{2}=0.0025$: a quarter
      of a percent of return variance, thin even before costs. A realistic
      volatility-persistence coefficient $\phi_{\text{vol}}=0.95$ explains
      $\phi_{\text{vol}}^{2}=0.9025$: over 90% of next-period variance — the
      same-shaped number, $\phi^2$, attached to wildly different outcomes
      depending on which of the two problems it belongs to.
    interview: >
      "Why can vol models make money while pure directional models mostly
      don't?" wants: efficient markets erase linear predictability in the
      mean because a directional edge is trivially tradeable away, but
      predictable variance survives because you can't convert "I know
      volatility will be high" into a simple directional bet — the entire
      justification for the ARCH/GARCH family.
    pitfalls: >
      Treating a small but statistically significant level-autocorrelation
      as automatically tradeable — check $\phi^{2}$, the actual fraction of
      variance it buys, before believing it matters economically. Assuming
      the "efficient markets erase this" argument also applies to volatility
      forecasting — it's specifically an argument about the conditional mean
      and doesn't transfer to the conditional variance.
    recap: >
      Efficient markets erase predictability in the level of returns but
      leave it in their scale, because a directional edge trades away
      trivially while a variance forecast doesn't — the reason vol models
      work and directional signals are hard.
    dialogue:
      - part: Two forecasts of tomorrow
        teach: >
          A desk studies a liquid stock index's daily returns. Their lag-$1$
          autocorrelation is $0.015$. The lag-$1$ autocorrelation of their
          *absolute* values, the size of each day's move, is $0.3$. Same
          series, same days.
      - ask: >
          Before computing anything: which will a model built on today's
          information forecast more usefully, tomorrow's return or the size of
          tomorrow's move?
        choices:
          - text: >
              Tomorrow's return: it is the quantity traders care about, so it
              has been studied most.
            feedback: >
              Studied most, and for that very reason arbitraged most. Attention
              is what erases a directional edge.
          - text: >
              Tomorrow's absolute return, its size.
            correct: true
            feedback: >
              Right, and by a wide margin. The next two numbers put a size on
              it.
          - text: >
              Neither: an efficient market leaves nothing forecastable.
            feedback: >
              The $0.3$ is far outside any noise band on a few years of data.
              Efficiency says something about one of these, not both.
        feedback: >
          The direction of a return and its size are two different forecasting
          problems.
      - ask: >
          Model the returns as an AR(1) with $\phi = 0.015$. What fraction of
          tomorrow's return variance does the best one-step forecast explain?
        expects: "0.000225"
        tolerance: 0.000001
        hint: >
          Predictability is $\phi^{2}$, not $\phi$.
        feedback: >
          $0.015^{2} = 0.000225$, about two hundredths of one percent. Even
          before costs, almost nothing.
      - ask: >
          Treat the absolute returns the same way, with lag-$1$
          autocorrelation $0.3$. What fraction of the variance of tomorrow's
          absolute return does today's explain?
        expects: "0.09"
        hint: >
          Same rule, $0.3^{2}$.
        feedback: >
          $0.09$, or $9\%$, four hundred times the directional figure, and
          that from one lag alone; volatility models that pool many lags do
          better.
      - reflect: >
          Suppose tomorrow's return were as predictable as tomorrow's size.
          What would traders do, and what would happen to that
          predictability? Now suppose you know tomorrow will be a large-move
          day but not in which direction. Can you cash that in with a plain buy
          or sell?
        hint: >
          Ask what each piece of knowledge lets you trade, and how easily.
        answer: >
          A predictable direction is the easiest edge there is: buy or sell,
          done. Traders would pile in until their own orders moved today's
          price and the predictability was gone. A predictable size does not
          tell you which way to bet, so a plain buy or sell cannot capture it;
          it takes options or a change in risk, and nobody erases it by
          trading on the fact that today is turbulent. Competition removes
          the first and leaves the second.
      - teach: >
          That is the split the stylized facts describe. The level of returns
          carries almost no autocorrelation, because exploitable linear
          predictability is arbitraged away; the scale is highly persistent,
          because volatility rides on information flow and liquidity
          conditions that change on a slow clock. Treat the conditional
          variance as forecastable and the conditional mean as barely so.

      - part: Testing the intuition
        ask: >
          Your volatility model says tomorrow's standard deviation will be
          double today's. What can you do with that?
        choices:
          - text: >
              Sell the index: high volatility means a fall is coming.
            feedback: >
              The model says the move will be large, not which way. A plain
              short is a directional bet, and the forecast has no direction.
          - text: >
              Buy the index: more volatility, more expected return.
            feedback: >
              Same problem from the other side. Nothing about tomorrow's sign
              has been forecast.
          - text: >
              Cut position size to keep risk constant, or trade options against
              the forecast.
            correct: true
            feedback: >
              Right. Variance forecasts pay through sizing and through
              volatility instruments, not through a long or short in the
              underlying.
        feedback: >
          A forecast is only as useful as the trade it supports, and a size
          forecast supports a different kind of trade.
      - ask: >
          How many daily observations would it take before a true lag-$1$
          autocorrelation of $0.015$ even reaches the $\pm 2/\sqrt{n}$ band?
        expects: "17778"
        tolerance: 1
        hint: >
          Solve $2/\sqrt{n} = 0.015$.
        feedback: >
          $\sqrt{n} = 2/0.015 \approx 133.3$, so $n \approx 17778$ days,
          about seventy years of trading. A directional effect this size is not
          just unprofitable; it is barely visible.

      - part: Where the intuition misleads
        ask: >
          So is a good volatility forecast free money?
        choices:
          - text: >
              Yes: it is predictable and nobody arbitrages it away.
            feedback: >
              Nobody arbitrages away the predictability, but option prices
              already embed the market's own volatility forecast. Profit comes
              from forecasting better than implied volatility, not from
              volatility being forecastable.
          - text: >
              No: the predictability is real, but it is priced into options, so
              the edge is only in beating the market's own forecast.
            correct: true
            feedback: >
              Right. Forecastable is not the same as profitable. Volatility
              models work in the sense that they forecast; whether they pay
              depends on what the forecast is traded against.
          - text: >
              No: volatility forecasts are as unreliable as return forecasts.
            feedback: >
              The $0.3$ says otherwise. The scale really is forecastable; the
              question is who already knows it.
        feedback: >
          "Size is easy" is a statement about forecasting, not about free
          profit.
      - ask: >
          A colleague says the success of volatility models proves markets are
          inefficient. What is the better reply?
        choices:
          - text: >
              Agreed: any forecastable quantity is an inefficiency.
            feedback: >
              The efficiency argument is about the conditional mean: a
              forecastable return would be a free bet. A forecastable variance
              offers no free bet on its own.
          - text: >
              The efficiency argument only bites on the direction of returns;
              predictable variance is consistent with no free lunch.
            correct: true
            feedback: >
              Right. That is why both facts hold at once: a near-zero level
              autocorrelation and a strongly persistent scale.
          - text: >
              Volatility models only look good because they overfit.
            feedback: >
              They hold up out of sample across assets and decades. The
              asymmetry is real; it just does not contradict efficiency.
        feedback: >
          In an interview, the two-sentence version: direction is arbitraged
          away because it is trivially tradeable; size is not, so it stays
          forecastable, which is why the ARCH and GARCH models target the
          variance.
