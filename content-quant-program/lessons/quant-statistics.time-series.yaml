unit: quant-statistics.time-series
opening: >
  Time series work is about squeezing information out of a single realized path
  when there is no second draw of history to average against. This unit opens
  with the two ideas that make that possible — stationarity and the
  autocorrelation function — then builds the AR(1) and MA(1) families that turn
  a correlogram's shape into a named model with a computable mean-reversion
  speed, forecast error, and a warning about how much autocorrelation inflates
  the uncertainty of a sample mean. A second arc treats the boundary case where
  all of that machinery fails: the unit root, the spurious regressions it
  produces, and the cointegration and differencing techniques that route around
  it. It closes on the stylized facts of real returns, where linear
  predictability in the level all but vanishes even as volatility itself stays
  highly forecastable.
lessons:
  - node: quant-statistics.time-series.stationarity
    hook: >
      Every later technique in this unit — fitting an AR(1), trusting a sample
      mean, running a t-test on a P&L stream — silently assumes stationarity
      first, and an interviewer who asks "is this series stationary?" is really
      asking whether you'd apply that machinery blindly.
    explanation: >
      You only ever observe one path of history, never the full ensemble of
      paths the process could have produced. Stationarity is the condition that
      licenses substituting a time-average along your one path for an
      ensemble-average you'll never see: if the mean, variance, and
      lag-structure don't depend on where you stand in time, a long enough
      stretch of your one path samples the same underlying law repeatedly.
      Without it, "the sample mean" is an average of numbers that were never
      generated by the same distribution to begin with, and it estimates
      nothing stable.

      The gap between white noise and iid is the detail worth sitting with.
      White noise only forbids linear dependence — zero covariance at every
      lag — and says nothing about higher moments. A sequence can be white
      noise while its variance today depends heavily on how large yesterday's
      move was; the covariances are still all zero because that dependence is
      nonlinear. That loophole is exactly what real return series exploit, and
      it is why "uncorrelated" will turn out to be a much weaker claim than
      "unpredictable" later in this unit.
    worked: >
      Take $x_t = 0.5t + \varepsilon_t$ with $\varepsilon_t$ iid mean $0$. At
      $t=3$, $\mathbb{E}[x_t] = 1.5$; at $t=10$, $\mathbb{E}[x_t] = 5$. The mean
      is not constant, so $x_t$ fails stationarity on the first condition alone
      — no amount of averaging over one realized path recovers a fixed "true
      mean," because there isn't one.
    interview: >
      "Would you run a standard t-test on this P&L series?" is testing whether
      stationarity comes up unprompted. The right answer names all three
      conditions, then immediately flags that raw prices trend and their
      variance grows, so they fail on sight — the test only makes sense on
      something like returns.
    pitfalls: >
      Judging stationarity from a flat-looking plot without checking the
      variance or the autocovariance structure — a mean can look constant while
      the spread of moves is visibly widening. Treating "white noise" and "iid"
      as synonyms; white noise permits exactly the kind of volatility
      clustering that later invalidates naive error bars.
    recap: >
      Constant mean, constant variance, autocovariance depending only on the
      lag — the three conditions that let one realized path stand in for the
      ensemble, and white noise is the weakest series that clears them.
    steps:
      - teach: >
          You only ever observe one realized path of history, never the full
          ensemble of paths the process could have produced. Stationarity is
          what licenses treating a long stretch of that one path as if it
          sampled the same underlying law again and again.
      - teach: >
          Three conditions must hold for every $t$: the mean is constant, the
          variance is finite and constant, and the autocovariance between $x_t$
          and $x_{t+k}$ depends on the lag $k$ alone, never on $t$ itself. All
          three are separate requirements — none is implied by the others.
      - ask: >
          A series is $w_t = \mu + \varepsilon_t$, where $\varepsilon_t$ has
          mean $0$, is uncorrelated across different times, and has variance
          $\sigma_t^{2} = \sigma^{2} t$, growing with $t$. Which condition of
          weak stationarity fails?
        choices:
          - text: >
              The mean is not constant.
            feedback: >
              $\mathbb{E}[w_t] = \mu$ for every $t$ — the mean is fine here;
              the problem sits elsewhere.
          - text: >
              The variance is not constant, since it grows with $t$.
            correct: true
            feedback: >
              $\operatorname{Var}(w_t) = \sigma^{2}t$ depends on $t$ directly,
              so the second condition fails on its own — a series can satisfy
              the other two and still not be stationary.
          - text: >
              The autocovariance at lag $k$ depends on $t$, not just $k$.
            feedback: >
              The shocks are uncorrelated across time regardless of how their
              variance scales, so $\operatorname{Cov}(w_t, w_{t+k}) = 0$ for
              every $k \ne 0$ and every $t$ — this condition actually holds
              here.
        feedback: >
          Only one condition needs to fail for the whole series to be
          non-stationary. Here the mean and the lag-structure are fine; a
          growing variance alone is enough to disqualify it.
      - teach: >
          White noise is the simplest stationary series: mean $0$, constant
          variance $\sigma^{2}$, and autocovariance $\gamma_k = 0$ for every $k
          \ne 0$. It clears the three conditions trivially, which is exactly
          why it's the baseline every other stationary model gets compared
          against.
      - ask: >
          Which statement about white noise is correct?
        choices:
          - text: >
              White noise must be independent across time.
            feedback: >
              That is a stronger claim than the definition makes. White noise
              only forbids linear dependence — zero covariance at every lag.
          - text: >
              White noise forbids linear dependence only, and can still have
              time-varying volatility that never shows up in the covariances.
            correct: true
            feedback: >
              Exactly — a series can be white noise while its variance today
              depends heavily on yesterday's move, as long as that dependence
              stays nonlinear.
          - text: >
              White noise implies constant conditional variance at every
              horizon.
            feedback: >
              That is homoskedasticity, a separate and stronger property. Zero
              autocovariance says nothing about the conditional variance.
        feedback: >
          White noise is weaker than iid: it rules out linear dependence, not
          dependence altogether. That gap is exactly the loophole real return
          series exploit.
      - teach: >
          Strict stationarity requires the entire joint law to be
          shift-invariant, a strictly stronger condition than the three moment
          requirements above. The two notions coincide only for Gaussian
          series, where the mean and covariance already pin down the whole
          distribution.
      - ask: >
          A plotted series looks perfectly flat around a fixed level with no
          visible drift. Does that plot alone establish stationarity?
        choices:
          - text: >
              Yes — a flat mean plot is sufficient evidence.
            feedback: >
              A flat-looking mean says nothing about whether the variance or
              the autocovariance structure is also stable.
          - text: >
              No — the variance or the lag-structure could still be changing
              even though the mean looks flat.
            correct: true
            feedback: >
              Exactly this trap: volatility clustering can sit underneath a
              mean that looks perfectly constant.
          - text: >
              Only if the series is also known to be Gaussian.
            feedback: >
              Gaussianity is what makes weak and strict stationarity coincide —
              it does not fix the problem of reading a plot for variance or
              autocovariance behavior.
        feedback: >
          Judging stationarity from a mean plot alone checks one of three
          conditions. The variance and the autocovariance structure need their
          own scrutiny.
      - teach: >
          Without stationarity, a sample mean or sample variance is an average
          of numbers that were never generated by the same distribution — it
          estimates nothing stable, which is why every later technique in this
          unit assumes it first.

  - node: quant-statistics.time-series.acf
    hook: >
      The correlogram is the first plot anyone runs on a new series, because
      its shape alone — before any model is fit — tells you which family of
      models is even worth trying.
    explanation: >
      Correlation between two variables normally needs two different
      variances in the denominator. Stationarity is what makes
      $\rho_k = \gamma_k/\gamma_0$ well-defined without that bookkeeping:
      because the variance is the same $\gamma_0$ at every time $t$, one
      number in the denominator serves every lag, and the correlation between
      $x_t$ and $x_{t+k}$ doesn't depend on which $t$ you picked — only on the
      gap $k$. That same time-shift invariance forces the ACF to be even,
      $\rho_{-k} = \rho_k$: the correlation between today and $k$ days ago is
      the same number as between today and $k$ days ahead.

      Reading the shape is the actual skill. Geometric decay says the series
      remembers its past with a constant decay rate per step — autoregressive.
      A hard cutoff after lag $q$ says the memory has a finite window —
      moving average. Decay so slow the correlogram barely moves across dozens
      of lags says the series isn't stationary at all. The legality
      constraint — the matrix of $\rho_{|i-j|}$ must be positive semidefinite
      — is not a technicality; it's the reminder that $\rho_k$ is not a free
      design choice but the correlation matrix of $(x_1,\dots,x_n)$ itself, so
      an ACF that decays and then swings back up sharply is often simply
      illegal.
    worked: >
      Suppose a stationary series has $\gamma_0 = 4$, $\gamma_1 = 2$,
      $\gamma_2 = 1$, and $\gamma_k = 0$ for $k \ge 3$. Then $\rho_1 = 2/4 =
      0.5$ and $\rho_2 = 1/4 = 0.25$: a correlogram with two nonzero lags and a
      hard cutoff after — the fingerprint of a two-period moving average, not
      an autoregression.
    interview: >
      "Here's a correlogram — what generated this data?" wants the shape read
      immediately: geometric decay names AR, a cutoff names MA, near-$1$ decay
      that barely moves names a unit root, stated before reaching for any
      fitting procedure.
    pitfalls: >
      Reporting $\rho_k$ for negative $k$ as if it could differ from
      $\rho_{-k}$'s positive-lag value — stationarity forces them equal.
      Forgetting the ACF measures linear dependence only, so $\rho_k$ near
      zero at every lag is consistent with strong nonlinear structure still
      sitting in the series.
    recap: >
      $\rho_k = \gamma_k/\gamma_0$ is well-defined only because stationarity
      supplies one shared variance for every lag, and the correlogram's shape
      — geometric decay, hard cutoff, or near-unity crawl — names the model
      before any fitting happens.
    steps:
      - teach: >
          Correlation between two variables normally needs two different
          variances in the denominator. Stationarity collapses that
          bookkeeping: because the variance is the same $\gamma_0$ at every
          time $t$, one number serves every lag.
      - teach: >
          The autocorrelation function is $\rho_k = \gamma_k/\gamma_0$, so
          $\rho_0 = 1$ and $|\rho_k| \le 1$ for every $k$. Time-shift
          invariance also forces the ACF to be even, $\rho_{-k} = \rho_k$.
      - ask: >
          A stationary series has $\gamma_0 = 8$ and $\gamma_1 = 6$. What is
          $\rho_1$?
        expects: "0.75"
        tolerance: 0.0005
        hint: >
          Divide the lag-1 autocovariance by the variance.
        feedback: >
          $\rho_1 = \gamma_1/\gamma_0 = 6/8 = 0.75$ — a strong lag-1
          correlation, well inside the legal range $|\rho_k|\le1$.
      - teach: >
          Reading the shape is the actual skill: geometric decay says
          autoregressive, a hard cutoff after a fixed lag says moving average,
          and decay so slow the correlogram barely moves across dozens of lags
          says the series isn't stationary at all.
      - ask: >
          A sample correlogram sits near $1$ for the first thirty lags and
          falls only very slightly with each one. What does that pattern
          indicate?
        choices:
          - text: >
              A moving-average process of high order.
            feedback: >
              MA processes cut off cleanly after a fixed lag; a correlogram
              that never really lets go doesn't have a finite window like that.
          - text: >
              A well-behaved autoregressive series with short memory (mild
              persistence).
            feedback: >
              Mild persistence decays visibly within a handful of lags; only
              decay essentially at the near-unity boundary would crawl this
              slowly across dozens of lags.
          - text: >
              The series is not stationary — likely a unit root.
            correct: true
            feedback: >
              Decay this slow across dozens of lags is exactly the near-unity
              crawl that signals a unit root, not a legitimate stationary
              correlogram.
        feedback: >
          A correlogram that barely moves across dozens of lags is the
          signature this unit later names explicitly: a unit root, not a
          slow-but-legitimate AR.
      - teach: >
          The legality constraint matters too: the matrix with entries
          $\rho_{|i-j|}$ must be positive semidefinite, since it is the
          correlation matrix of $(x_1,\dots,x_n)$ itself — an arbitrary
          sequence of numbers between $-1$ and $1$ is not automatically a legal
          ACF.
      - ask: >
          A stationary series has $\rho_5 = 0.42$. What is $\rho_{-5}$?
        expects: "0.42"
        hint: >
          Use the evenness of the ACF.
        feedback: >
          Time-shift invariance forces $\rho_{-k}=\rho_k$ for every $k$, so
          $\rho_{-5}$ is exactly the same number, $0.42$ — correlation with $5$
          days ago equals correlation with $5$ days ahead.
      - teach: >
          The correlogram is the first diagnostic anyone runs precisely because
          reading its shape — decay, cutoff, or near-unity crawl — names the
          model before a single parameter gets fit.

  - node: quant-statistics.time-series.sample-acf
    hook: >
      In practice you never see $\rho_k$ itself, only its noisy estimate, and
      knowing which spikes to trust versus ignore is what separates a real
      finding from a screen full of noise.
    explanation: >
      $\hat{\rho}_k$ uses the *same* denominator — the full-sample sum of
      squared deviations — at every lag, rather than a lag-specific one; that
      shared normalization is exactly what keeps the estimated correlogram
      positive semidefinite the way a legal ACF must be. Under the null that
      the data are iid noise, each fixed $\hat{\rho}_k$ behaves like a mean of
      roughly $n$ nearly-independent product terms, so it's approximately
      $N(0, 1/n)$ — the same $1/\sqrt{n}$ shrinkage that governs any sample
      mean, applied here to a correlation instead.

      The two cautions matter more than the formula. The bands are pointwise:
      testing twenty lags against a 95% band means roughly one spike escapes
      by pure chance even under true white noise, so a single spike proves
      nothing on its own — a joint test across the first several lags (the
      Ljung–Box idea) is what actually distinguishes signal from a multiple-
      comparisons accident. And $\hat{\rho}_k$ gets both noisier and biased
      toward zero as $k$ grows toward $n$, since fewer terms remain in the sum
      and they all share the same estimated mean $\bar{x}$ — a "clean zero" at
      a large lag is weaker evidence than the same value at lag $1$.
    worked: >
      With $n = 100$ observations, the band is $\pm 1.96/\sqrt{100} =
      \pm 0.196$. An observed $\hat{\rho}_1 = 0.15$ sits inside that band —
      indistinguishable from noise on its own, even though $0.15$ "looks"
      nonzero. An observed $\hat{\rho}_5 = 0.22$ would clear the band by
      itself, but with five lags tested that single crossing is exactly the
      kind of lone spike a joint test is needed to confirm before trusting it.
    interview: >
      "You ran an ACF on 100 days of returns and got $\hat{\rho}_1 = 0.15$ —
      is that real?" wants the band computed on the spot ($\pm0.196$), the
      observation that $0.15$ falls inside it, and a mention that a joint test
      is the right tool if several lags are being eyeballed at once.
    pitfalls: >
      Calling a single spike outside the pointwise band a discovery without a
      joint test across the lags actually being scanned. Trusting
      $\hat{\rho}_k$ at $k$ close to $n$ as strongly as $\hat{\rho}_1$, when
      it's both noisier and biased toward zero by construction.
    recap: >
      Sample autocorrelations sit inside $\pm 2/\sqrt{n}$ under pure noise,
      but the bands are pointwise — judge a pattern jointly, because one
      isolated spike in twenty is free.
    steps:
      - teach: >
          In practice you never observe $\rho_k$ itself, only $\hat\rho_k$, its
          noisy sample estimate. Knowing which spikes to trust versus dismiss
          is what separates a real finding from a screen full of noise.
      - teach: >
          $\hat\rho_k$ uses the same full-sample denominator at every lag,
          which is exactly what keeps the estimated correlogram positive
          semidefinite. Under the null of iid noise, each fixed $\hat\rho_k$ is
          approximately $N(0, 1/n)$, giving the band $\pm 1.96/\sqrt{n}$.
      - ask: >
          With $n=400$ daily observations, what is the $95\%$ band,
          $1.96/\sqrt{n}$?
        expects: "0.098"
        tolerance: 0.0005
        hint: >
          $\sqrt{400}=20$.
        feedback: >
          $1.96/\sqrt{400} = 1.96/20 = 0.098$ — anything inside $\pm 0.098$ is
          indistinguishable from pure noise at this sample size.
      - teach: >
          The bands are pointwise: testing many lags against a $95\%$ band
          means roughly one in twenty escapes purely by chance, so a lone spike
          proves nothing on its own — a joint test across the lags actually
          being scanned is what separates signal from a multiple-comparisons
          accident.
      - ask: >
          With $n=400$ you test the first $10$ lags and find exactly one,
          $\hat\rho_7=0.11$, outside the $\pm 0.098$ band. What should you
          conclude?
        choices:
          - text: >
              This proves real autocorrelation at lag 7.
            feedback: >
              One crossing out of ten tested lags is close to what pure chance
              alone predicts at a pointwise 95% band — this alone proves
              nothing.
          - text: >
              Nothing conclusive from this spike alone — run a joint test
              across the tested lags before trusting it.
            correct: true
            feedback: >
              Exactly the Ljung–Box move: test the first several lags jointly
              rather than reading one bar in isolation.
          - text: >
              It's certainly spurious and can be dismissed outright.
            feedback: >
              Too strong in the other direction — a joint test, not a shrug, is
              what actually settles it.
        feedback: >
          A single crossing at a pointwise band is exactly the kind of lone
          spike a joint test exists to confirm or dismiss.
      - teach: >
          $\hat\rho_k$ also gets noisier and more biased toward zero as $k$
          grows toward $n$, since fewer terms remain in the defining sum and
          they all share the same estimated mean $\bar{x}$.
      - ask: >
          A computed $\hat\rho_{95}$ from $n=100$ observations comes back near
          zero. How much should that reassure you there's no dependence at lag
          $95$?
        choices:
          - text: >
              Not much — at $k$ close to $n$, few terms remain and the estimate
              is both noisier and biased toward zero regardless of the truth.
            correct: true
            feedback: >
              Right — a 'clean zero' at a large lag is much weaker evidence
              than the same value at lag $1$.
          - text: >
              Completely — a near-zero estimate is equally strong evidence at
              any lag.
            feedback: >
              The estimator's reliability isn't constant across lags; it
              degrades sharply as $k$ approaches $n$.
          - text: >
              It's stronger evidence than a near-zero $\hat\rho_1$, since more
              history contributed to it.
            feedback: >
              The opposite is true — fewer, not more, terms remain in the sum
              as $k$ grows toward $n$.
        feedback: >
          Reliability at large $k$ degrades in two ways at once — more noise
          and a bias toward zero — so a clean-looking result there carries less
          weight than the same result at lag $1$.
      - teach: >
          Trust a correlogram pattern, not a single bar: bands are exact only
          pointwise, and the estimate itself degrades at large lags — a joint
          test is what turns a scan into a finding.

  - node: quant-statistics.time-series.ar1
    hook: >
      AR(1) is the workhorse model behind "is this spread mean-reverting" —
      pairs trades, inventory control, overnight basis — and its stationarity
      condition is the one number that decides whether the whole setup even
      makes sense.
    explanation: >
      Unrolling the recursion $x_t = c + \phi x_{t-1} + \varepsilon_t$
      backward gives $x_t - \mu = \sum_{j\ge0}\phi^{j}\varepsilon_{t-j}$: today's
      value is a weighted sum of every past shock, each one discounted by
      $\phi^{j}$. That sum is exactly why $|\phi| < 1$ is required for
      stationarity and not just a technical footnote — the variance it implies
      is $\sigma^{2}\sum_j \phi^{2j}$, a geometric series that converges only
      when $|\phi| < 1$. Push $\phi$ toward $1$ and old shocks stop fading, the
      sum stops converging, and the whole notion of a fixed unconditional
      variance collapses; that boundary is exactly where the next few nodes
      live.

      The constant $c$ is the most common trap: it is not the series' mean. Take
      expectations of the recursion at the stationary solution,
      $\mu = c + \phi\mu$, and solving gives $\mu = c/(1-\phi)$ — the mean is
      $c$ scaled up by how persistent the series is. Sign of $\phi$ carries
      real meaning too: $\phi>0$ means a shock's effect fades but keeps its
      sign for a while (persistence), $\phi<0$ means it fades while flipping
      sign every period (alternation), and $\phi=0$ collapses back to plain
      white noise.
    worked: >
      Take $c=1$, $\phi=-0.6$, $\sigma=2$. The mean is
      $\mu = 1/(1-(-0.6)) = 1/1.6 = 0.625$, and the variance is
      $\sigma^{2}/(1-\phi^{2}) = 4/(1-0.36) = 4/0.64 = 6.25$ — stationary despite
      the negative coefficient, and the series alternates around $0.625$ rather
      than drifting.
    interview: >
      "How would you model a mean-reverting overnight spread?" wants AR(1)
      written down immediately, with $\phi$ named as the persistence parameter,
      $|\phi|<1$ stated as the stationarity condition, and $c/(1-\phi)$ — not
      $c$ — named as the level it reverts to.
    pitfalls: >
      Quoting $c$ itself as "the mean" instead of $c/(1-\phi)$. Assuming a
      negative $\phi$ signals instability — it's still stationary for any
      $|\phi|<1$, it just alternates sign instead of persisting. Plugging
      $\phi=1$ or $\phi=1.2$ into $\sigma^{2}/(1-\phi^{2})$ and reporting a
      negative or infinite "variance" as if it meant something.
    recap: >
      One lag of memory plus fresh noise, stationary exactly when $|\phi|<1$,
      with mean $c/(1-\phi)$ (never $c$ itself) and variance
      $\sigma^{2}/(1-\phi^{2})$.
    steps:
      - teach: >
          AR(1) is the workhorse behind 'is this spread mean-reverting' — pairs
          trades, inventory control, overnight basis. Unrolling the recursion
          shows today's value is a weighted sum of every past shock, each
          discounted by $\phi^{j}$.
      - teach: >
          Stationarity needs $|\phi|<1$ because the implied variance is the
          geometric series $\sigma^{2}\sum_j \phi^{2j}$, which converges only
          then. Taking expectations of the recursion at the stationary solution
          gives $\mu=c/(1-\phi)$ — the mean is $c$ scaled up by how persistent
          the series is, not $c$ itself.
      - ask: >
          $c=2$, $\phi=0.6$. What is the unconditional mean $\mu = c/(1-\phi)$?
        expects: "5"
        hint: >
          $1-0.6=0.4$.
        feedback: >
          $\mu = 2/(1-0.6)=2/0.4=5$ — five times the constant, because the
          series is quite persistent.
      - teach: >
          Sign of $\phi$ carries real meaning: $\phi>0$ is persistence (a shock
          keeps its sign as it fades), $\phi<0$ is alternation (it flips sign
          every period while fading), and $\phi=0$ collapses back to plain
          white noise.
      - ask: >
          With $\sigma=1$ and the same $\phi=0.6$, what is the stationary
          variance $\sigma^{2}/(1-\phi^{2})$?
        expects: "1.5625"
        tolerance: 0.0005
        hint: >
          $1-0.6^{2}=0.64$.
        feedback: >
          $1/(1-0.36)=1/0.64=1.5625$.
      - teach: >
          The trap is intuitive once you see the recursion unrolled: through
          the feedback loop $\phi x_{t-1}$, $x_t$ keeps adding a fraction of
          $c$ every period, so the constant's effect compounds up to
          $c/(1-\phi)$ rather than showing up as $c$ directly.
      - ask: >
          A candidate reports the mean of an AR(1) with $c=4$, $\phi=0.5$ as
          $4$. What's wrong?
        choices:
          - text: >
              Nothing — $\mu=c$ always.
            feedback: >
              That's only true when $\phi=0$; here $\phi=0.5$ scales it up.
          - text: >
              $\mu = c/(1-\phi) = 4/0.5 = 8$, not $c$ itself.
            correct: true
            feedback: >
              Right — the mean is the constant divided by how much of the past
              persists, not the constant alone.
          - text: >
              The series isn't stationary, so no mean exists.
            feedback: >
              $|\phi|=0.5<1$, so it is stationary and does have a well-defined
              mean — just not $c$.
        feedback: >
          $\mu=c/(1-\phi)$, never $c$ alone — the single most common trap this
          node sets.
      - teach: >
          One lag of memory plus fresh noise, stationary exactly when
          $|\phi|<1$: reach for $c/(1-\phi)$ for the level it reverts to, never
          $c$ alone.

  - node: quant-statistics.time-series.ar1-acf
    hook: >
      Geometric decay in the ACF plus a single spike in the PACF is the AR(1)
      fingerprint — the pattern that lets you read $\phi$ straight off a plot
      without fitting anything.
    explanation: >
      Multiply the centred recursion $(x_t-\mu) = \phi(x_{t-1}-\mu)+\varepsilon_t$
      by $(x_{t-k}-\mu)$ and take expectations. The $\varepsilon_t$ term is
      uncorrelated with anything at or before time $t-1$, so it contributes
      nothing, leaving $\gamma_k = \phi\gamma_{k-1}$ for every $k\ge1$ — the
      Yule–Walker equation. That one-step recursion telescopes immediately:
      $\gamma_1=\phi\gamma_0$, $\gamma_2=\phi\gamma_1=\phi^{2}\gamma_0$, and in
      general $\gamma_k=\phi^{k}\gamma_0$, so dividing through gives
      $\rho_k=\phi^{k}$.

      This is why the ACF never actually reaches zero — each lag is a smaller
      copy of the last, decaying but never cut off, unlike a finite-memory
      process. The PACF behaves oppositely for a reason worth internalizing:
      it measures what lag $k$ adds *after already conditioning on* everything
      between it and today. Since the recursion only ever reaches one step
      back, conditioning on yesterday already captures everything the model
      knows; older lags add exactly nothing once yesterday is accounted for,
      so the PACF is $\phi$ at lag $1$ and exactly $0$ afterward.
    worked: >
      For $\phi=-0.4$: $\rho_1=-0.4$, $\rho_2=0.16$, $\rho_3=-0.064$ — geometric
      decay in magnitude, alternating in sign. The PACF is $-0.4$ at lag $1$
      and $0$ at every lag after, even though the ACF itself never touches
      zero.
    interview: >
      "The ACF alternates in sign and decays geometrically — what's the
      model, and what's $\phi$?" wants "AR(1) with negative $\phi$," with
      $\phi$ read directly off $\rho_1$ rather than guessed from later lags.
    pitfalls: >
      Reading $\rho_2$ itself as $\phi$ instead of $\phi^{2}$ — recovering
      $\phi$ from a lag beyond the first needs a root. Expecting the ACF to
      hit exactly zero at some finite lag the way an MA process's does; an
      AR(1)'s ACF only ever decays, it never cuts off.
    recap: >
      $\rho_k=\phi^{k}$: geometric decay in the ACF from one Yule–Walker step,
      paired with a single nonzero PACF spike at lag $1$ — the fingerprint of
      exactly one lag of memory.
    steps:
      - teach: >
          Geometric decay in the ACF paired with a single spike in the PACF is
          the AR(1) fingerprint — the pattern that lets you read $\phi$
          straight off a plot without fitting anything.
      - teach: >
          Multiplying the centred recursion by a lagged deviation and taking
          expectations kills the $\varepsilon_t$ term, leaving the Yule–Walker
          relation $\gamma_k=\phi\gamma_{k-1}$. That one-step recursion
          telescopes to $\gamma_k=\phi^{k}\gamma_0$, so dividing through gives
          $\rho_k=\phi^{k}$.
      - ask: >
          For an AR(1) with $\phi=0.3$, what is $\rho_2$?
        expects: "0.09"
        tolerance: 0.0005
        hint: >
          $\rho_2=\phi^{2}$.
        feedback: >
          $\rho_2=\phi^{2}=0.3^{2}=0.09$ — a small second-lag correlation from
          a modest $\phi$.
      - teach: >
          The PACF behaves oppositely: it measures what lag $k$ adds after
          already conditioning on everything between it and today. Since the
          AR(1) recursion only ever reaches one step back, the PACF equals
          $\phi$ at lag $1$ and exactly $0$ at every later lag.
      - ask: >
          For that same series ($\phi=0.3$), what is the partial
          autocorrelation at lag $2$?
        expects: "0"
        hint: >
          Once you condition on yesterday, what does the day before add?
        feedback: >
          $0$ — conditioning on lag $1$ already captures everything the AR(1)
          recursion knows, so lag $2$ contributes nothing further.
      - teach: >
          This is why the ACF never actually reaches zero — each lag is a
          smaller copy of the last, decaying but never cut off — unlike a
          finite-memory process.
      - ask: >
          You observe $\hat\rho_1=0.4$ and $\hat\rho_2=0.16$ from a series
          believed to be AR(1). Which reading is correct?
        choices:
          - text: >
              $\phi=\rho_2=0.16$.
            feedback: >
              That reads the second lag as if it were $\phi$ itself, rather
              than $\phi$ squared.
          - text: >
              $\phi=\rho_1=0.4$, consistent since $0.4^{2}=0.16=\rho_2$.
            correct: true
            feedback: >
              Right — $\rho_1$ reads off $\phi$ directly, and $\rho_2$ should
              equal $\phi^{2}$ as a consistency check, which it does here.
          - text: >
              $\phi=\sqrt{\rho_1}=\sqrt{0.4}$.
            feedback: >
              There's no square root in the relation between $\rho_1$ and
              $\phi$ — $\rho_1$ equals $\phi$ directly.
        feedback: >
          $\rho_1$ reads off $\phi$ directly; later lags are consistency checks
          against $\phi^{k}$, not fresh sources of $\phi$.
      - teach: >
          $\rho_k=\phi^{k}$ from one Yule–Walker step, paired with a PACF that
          is $\phi$ at lag $1$ and zero after — read $\phi$ off $\rho_1$, and
          use later lags only to check consistency.

  - node: quant-statistics.time-series.half-life
    hook: >
      Quoting a bare $\phi$ means nothing to anyone without a calculator handy
      — converting it to "days until half the dislocation is gone" is the
      version every desk actually uses, and interviewers expect it computed
      live.
    explanation: >
      From the previous node, a shock is worth exactly $\phi^{k}$ of itself
      after $k$ periods. Setting $\phi^{h}=1/2$ and taking logs of both sides
      gives $h\ln\phi = \ln(1/2)$, so $h = \ln2/\ln(1/\phi)$ — writing the
      denominator as $\ln(1/\phi)=-\ln\phi$ keeps it positive for the
      $0<\phi<1$ case that matters in practice.

      A useful shortcut for $\phi$ near $1$: since $\ln(1/\phi)\approx1-\phi$
      for $\phi$ close to $1$, the half-life is approximately
      $0.693/(1-\phi)$ — no logarithm needed, just how far $\phi$ sits below
      $1$. That approximation is only good near the boundary, though; the
      exact formula and the shortcut diverge once $\phi$ drifts away from $1$,
      which is worth checking before leaning on the shortcut under time
      pressure.
    worked: >
      $\phi=0.8$: exactly, $h = \ln2/\ln(1/0.8) = 0.6931/0.2231 \approx 3.11$
      periods. The near-$1$ shortcut would give $0.693/(1-0.8)=3.47$ —
      already off by more than 10%, showing the approximation degrading once
      $\phi$ isn't close to the boundary.
    interview: >
      "Your cointegrated spread has $\phi=0.95$ daily — how fast does it mean
      revert?" wants $h=\ln2/\ln(1/0.95)\approx13.5$ days computed on the spot,
      stated in days because the sampling frequency was given.
    pitfalls: >
      Inverting the formula backwards — computing $\ln\phi/\ln2$ instead of
      $\ln2/\ln(1/\phi)$ — which silently flips the sign. Using the near-$1$
      shortcut $0.693/(1-\phi)$ for a $\phi$ that isn't actually close to $1$,
      such as $0.5$, where it's a poor approximation. Stating a half-life
      without naming the time unit the data was sampled at.
    recap: >
      $h=\ln2/\ln(1/\phi)$ turns a reversion coefficient into a number of
      periods — about $3.1$ for $\phi=0.8$, and always report the sampling
      unit alongside it.
    steps:
      - teach: >
          A shock to a stationary AR(1) is worth $\phi^{k}$ of itself after $k$
          periods. Setting $\phi^{h}=1/2$ and taking logs gives
          $h=\ln2/\ln(1/\phi)$ — the number of periods until half a dislocation
          is gone.
      - teach: >
          A shortcut exists for $\phi$ near $1$: since $\ln(1/\phi)\approx
          1-\phi$ there, the half-life is approximately $0.693/(1-\phi)$, no
          logarithm needed. That approximation only holds near the boundary —
          it diverges from the exact formula once $\phi$ drifts away from $1$.
      - ask: >
          $\phi=0.75$. What is the exact half-life $h=\ln2/\ln(1/\phi)$?
        expects: "2.4094"
        tolerance: 0.0005
        hint: >
          $\ln(1/0.75)=\ln(1.3333)$.
        feedback: >
          $h=\ln2/\ln(1/0.75)=0.6931/0.2877\approx2.4094$ periods.
      - teach: >
          Reference points are worth memorizing: $\phi=0.5$ gives a half-life
          of exactly $1$ period, and $h\to\infty$ as $\phi\to1$ — the unit-root
          boundary where mean reversion stops entirely.
      - ask: >
          Using the near-$1$ shortcut $0.693/(1-\phi)$ for $\phi=0.75$ gives
          $0.693/0.25=2.772$. How good is that as an estimate of the true
          half-life?
        choices:
          - text: >
              A poor approximation — $0.75$ isn't actually close to $1$, and
              $2.772$ misses the exact $2.4094$ by a wide margin.
            correct: true
            feedback: >
              Right — the shortcut is already off by more than $15\%$ here;
              it's only reliable very near the boundary.
          - text: >
              A close match to the exact value.
            feedback: >
              $2.772$ versus the exact $2.4094$ is a substantial miss for
              $\phi=0.75$, not a close match.
          - text: >
              Exact — the shortcut and the formula always agree.
            feedback: >
              They agree only in the limit $\phi\to1$; away from the boundary
              they diverge, as this example shows.
        feedback: >
          The near-$1$ shortcut earns its keep only right at the boundary —
          check how close $\phi$ actually is to $1$ before trusting it under
          time pressure.
      - teach: >
          Inverting the exact formula lets you go the other way, quoting a
          coefficient from a target horizon: $\phi = 2^{-1/h}$.
      - ask: >
          A spread mean-reverts with a half-life of exactly $h=10$ days. What
          $\phi = 2^{-1/h}$ produces that?
        expects: "0.9330"
        tolerance: 0.0005
        hint: >
          $2^{-1/10}=1/2^{0.1}$.
        feedback: >
          $\phi=2^{-1/10}\approx0.9330$ — a daily coefficient that looks close
          to $1$ even though the half-life is only ten trading days.
      - teach: >
          $h=\ln2/\ln(1/\phi)$ converts a reversion coefficient into a number
          of periods, and the near-$1$ shortcut only earns its keep right at
          the boundary — always report the sampling unit alongside the number.

  - node: quant-statistics.time-series.forecast
    hook: >
      "You found a statistically significant autocorrelation — is it
      tradeable?" is answered by this node's distinction between $\phi$ and
      $\phi^{2}$, and it's the gap that separates a real edge from a rounding
      error.
    explanation: >
      Take conditional expectations of the recursion one step at a time. Since
      $\varepsilon_{t+1}$ has mean $0$ and is independent of everything known
      at time $t$, $\mathbb{E}[x_{t+1}\mid x_t] = \mu+\phi(x_t-\mu)$ directly
      from the definition. Feeding that back in for the next step,
      $\mathbb{E}[x_{t+2}\mid x_t] = \mu+\phi\left(\mathbb{E}[x_{t+1}\mid x_t]-\mu\right)
      = \mu+\phi^{2}(x_t-\mu)$, and the pattern repeats: the forecast slides
      geometrically back to $\mu$ with weight $\phi^{k}$, and nothing before
      $x_t$ changes the answer once $x_t$ is known.

      The forecast error is the sum of the shocks not yet observed,
      $\sum_{j=0}^{k-1}\phi^{j}\varepsilon_{t+k-j}$, whose variance is
      $\sigma^{2}(1-\phi^{2k})/(1-\phi^{2})$ — starting at $\sigma^{2}$ for a
      one-step forecast and climbing to the full unconditional variance as
      $k\to\infty$, since far enough ahead the conditioning information is
      worth nothing. The one-step case gives the number worth memorizing: the
      correlation between $x_t$ and $x_{t+1}$ is $\phi$, so the *variance
      explained* by the best one-step forecast is $\phi^{2}$, not $\phi$ — a
      significance test can reject $\phi=0$ cleanly while $\phi^{2}$ still
      rounds to nothing.
    worked: >
      $\phi=0.6$, $\sigma^{2}=1$, $k=3$: the forecast weight is
      $\phi^{3}=0.216$, and the error variance is
      $(1-0.6^{6})/(1-0.36) = 0.9533/0.64\approx1.49$ — already close to the
      unconditional variance $1/0.64=1.5625$, three steps out. The one-step
      predictability is $\phi^{2}=0.36$: a real 36% of variance explained.
    interview: >
      "Your daily signal has $\phi=0.1$ with a highly significant t-stat — is
      it tradeable?" wants the candidate to compute $\phi^{2}=0.01$: one
      percent of variance explained, statistically real and economically
      thin, before any transaction costs are even considered.
    pitfalls: >
      Reporting $\phi$ itself, not $\phi^{2}$, as the fraction of variance a
      forecast explains. Conditioning on a longer history "for robustness"
      when only $x_t$ matters under this exact model — every earlier value is
      already summarized in $x_t$.
    recap: >
      The $k$-step forecast is $\mu+\phi^{k}(x_t-\mu)$ with error variance
      climbing to the unconditional variance; predictability is $\phi^{2}$,
      not $\phi$, which is why a significant $\phi$ can still be
      economically negligible.
    steps:
      - teach: >
          Taking conditional expectations of the recursion one step at a time
          shows the $k$-step forecast slides geometrically back to the mean:
          $\mathbb{E}[x_{t+k}\mid x_t] = \mu+\phi^{k}(x_t-\mu)$, and nothing
          before $x_t$ changes the answer once $x_t$ is known.
      - teach: >
          The forecast error variance is
          $\sigma^{2}(1-\phi^{2k})/(1-\phi^{2})$, starting at $\sigma^{2}$ for
          a one-step forecast and climbing to the full unconditional variance
          as $k\to\infty$ — far enough ahead, the model knows nothing the
          histogram didn't already.
      - ask: >
          $\phi=0.4$, $\sigma^{2}=2$, $k=2$. What is the forecast weight
          $\phi^{k}$ on $(x_t-\mu)$?
        expects: "0.16"
        tolerance: 0.0005
        hint: >
          $0.4^{2}$.
        feedback: >
          $\phi^{2}=0.4^{2}=0.16$ — only $16\%$ of today's deviation from the
          mean is expected to persist two steps out.
      - teach: >
          The one-step case gives the number worth memorizing: the correlation
          between $x_t$ and $x_{t+1}$ is $\phi$, so the fraction of variance
          the best one-step forecast actually explains is $\phi^{2}$, not
          $\phi$.
      - ask: >
          For that same series ($\phi=0.4$, $\sigma^{2}=2$), what is the
          two-step forecast error variance,
          $\sigma^{2}(1-\phi^{4})/(1-\phi^{2})$?
        expects: "2.32"
        tolerance: 0.0005
        hint: >
          $\phi^{4}=0.0256$, $1-\phi^{2}=0.84$.
        feedback: >
          $2(1-0.0256)/0.84=2(0.9744)/0.84=1.9488/0.84=2.32$ — already close to
          the unconditional variance $2/0.84\approx2.381$, just two steps out.
      - teach: >
          This gap between $\phi$ and $\phi^{2}$ is exactly what separates a
          statistically real finding from an economically useful one — a
          significance test can reject $\phi=0$ cleanly while $\phi^{2}$ still
          rounds to nothing.
      - ask: >
          A daily signal has $\phi=0.15$ with a highly significant
          $t$-statistic on $\phi$. Is that signal tradeable on its own?
        choices:
          - text: >
              Yes — statistical significance of $\phi$ is the relevant bar.
            feedback: >
              Significance only tells you $\phi\ne0$ reliably; it says nothing
              about the size of the edge.
          - text: >
              Only after checking $\phi^{2}=0.0225$ — a little over $2\%$ of
              variance explained, likely too thin once costs are considered.
            correct: true
            feedback: >
              Right — the variance explained is $\phi^{2}$, not $\phi$, and
              $2.25\%$ is a real but economically small edge before any trading
              friction.
          - text: >
              No — any $\phi$ under $0.2$ is definitionally untradeable.
            feedback: >
              There's no fixed cutoff; the right move is computing $\phi^{2}$
              and weighing it against costs, not applying an arbitrary
              threshold.
        feedback: >
          Statistical significance and economic significance are separate
          questions — the second one always runs through $\phi^{2}$.
      - teach: >
          The $k$-step forecast is $\mu+\phi^{k}(x_t-\mu)$ with error variance
          climbing to the unconditional variance, and predictability is
          $\phi^{2}$, not $\phi$ — the reason a significant $\phi$ can still be
          economically negligible.

  - node: quant-statistics.time-series.ma1
    hook: >
      Unlike AR(1), an MA(1) is stationary no matter what $\theta$ is — the
      only real question is which of two mirror-image coefficients actually
      produced the data you're looking at.
    explanation: >
      Expand $x_t-\mu=\varepsilon_t+\theta\varepsilon_{t-1}$ directly.
      $\operatorname{Var}(x_t) = \mathbb{E}[(\varepsilon_t+\theta\varepsilon_{t-1})^{2}]
      = \sigma^{2}+\theta^{2}\sigma^{2}$, since the cross term vanishes by
      independence — giving $\gamma_0=(1+\theta^{2})\sigma^{2}$ with no
      convergence question at all, because it's a sum of exactly two terms
      regardless of $\theta$'s size. The lag-$1$ covariance shares exactly one
      shock, $\varepsilon_{t-1}$, between $x_t$ and $x_{t-1}$, giving
      $\gamma_1=\theta\sigma^{2}$; lag $2$ and beyond share no shock at all, so
      $\gamma_k=0$. The mental model is a sliding window exactly two wide —
      memory that is finite rather than fading.

      The bound $|\rho_1|\le1/2$ is AM–GM in disguise: $1+\theta^{2}\ge2|\theta|$
      for any $\theta$, so $|\theta|/(1+\theta^{2})\le1/2$, with equality only
      at $\theta=\pm1$. Substituting $1/\theta$ for $\theta$ leaves both
      $\gamma_0$ (up to the shared scale) and $\gamma_1$'s ratio unchanged, so
      $\theta$ and $1/\theta$ are indistinguishable from autocovariances alone
      — invertibility, requiring $|\theta|<1$, is the extra condition that
      picks the one root from which the unobserved shocks can actually be
      recovered from observed data.
    worked: >
      $\theta=0.5$: $\gamma_0=1.25\sigma^{2}$, $\gamma_1=0.5\sigma^{2}$, so
      $\rho_1=0.5/1.25=0.4$. Its mirror $\theta=2$ gives the identical
      $\rho_1=2/5=0.4$ — confirming $\theta$ and $1/\theta$ share an ACF, with
      $\theta=0.5$ the invertible root to actually report.
    interview: >
      "The ACF is nonzero at lag $1$ and exactly zero everywhere after — what
      model?" wants "MA(1)" immediately, with $|\rho_1|\le1/2$ named as a
      sanity check on any reported value.
    pitfalls: >
      Fitting $|\theta|>1$ without checking invertibility — it reproduces the
      same ACF as $1/\theta$ but the shocks can't be recovered from history.
      Assuming any $\rho_1\in[-1,1]$ is achievable by some MA(1) — it's capped
      at $1/2$ in magnitude. Calling a series MA(1) from a plot that merely
      looks small beyond lag $1$ rather than being genuinely zero there.
    recap: >
      A two-wide window of shocks: always stationary regardless of $\theta$,
      ACF exactly zero beyond lag $1$, and $|\rho_1|$ capped at $1/2$, with
      $\theta$ and $1/\theta$ indistinguishable except by invertibility.
    steps:
      - teach: >
          Unlike AR(1), an MA(1) is stationary for any $\theta$ at all — it's a
          finite window over exactly two shocks, so its variance is a sum of
          two terms regardless of size.
      - teach: >
          Expanding directly gives $\gamma_0=(1+\theta^{2})\sigma^{2}$ and
          $\gamma_1=\theta\sigma^{2}$, since $x_t$ and $x_{t-1}$ share exactly
          the one shock $\varepsilon_{t-1}$; every lag beyond that shares no
          shock, so $\gamma_k=0$ for $k\ge2$.
      - ask: >
          $\theta=0.3$. What is $\rho_1 = \theta/(1+\theta^{2})$?
        expects: "0.2752"
        tolerance: 0.0005
        hint: >
          $1+0.3^{2}=1.09$.
        feedback: >
          $\rho_1=0.3/1.09\approx0.2752$ — comfortably under the $1/2$ cap.
      - teach: >
          That cap, $|\rho_1|\le1/2$ with equality only at $\theta=\pm1$, is
          AM–GM in disguise: $1+\theta^{2}\ge2|\theta|$ for any $\theta$, so no
          MA(1) can ever show strong lag-one correlation.
      - ask: >
          Someone reports fitting an MA(1) with $\rho_1=0.7$ from sample data.
          What should you conclude?
        choices:
          - text: >
              It's a plausible fit — $0.7$ is well within $[-1,1]$.
            feedback: >
              The full correlation range $[-1,1]$ is legal for a general
              series, but an MA(1) specifically can never reach past
              $|\rho_1|=1/2$.
          - text: >
              It's inconsistent with an MA(1) — no value of $\theta$ produces
              $|\rho_1|>1/2$.
            correct: true
            feedback: >
              Right — $|\rho_1|\le1/2$ is a hard cap for MA(1) regardless of
              $\theta$, so this reported value rules the model out.
          - text: >
              It's fine as long as $\theta$ is chosen large enough.
            feedback: >
              Making $\theta$ larger doesn't help — the bound $|\rho_1|\le1/2$
              holds for every $\theta$, with the maximum reached exactly at
              $\theta=\pm1$.
        feedback: >
          $|\rho_1|\le1/2$ is a structural cap on MA(1), not a matter of
          picking a big enough coefficient.
      - teach: >
          Substituting $1/\theta$ for $\theta$ leaves $\rho_1$ unchanged, so
          $\theta$ and $1/\theta$ are indistinguishable from autocovariances
          alone — invertibility, $|\theta|<1$, is the extra condition that
          picks the root from which shocks can actually be recovered.
      - ask: >
          A fitted MA(1) has $\theta=4$. What is the invertible root that
          shares its ACF?
        expects: "0.25"
        hint: >
          It's the reciprocal.
        feedback: >
          $1/\theta=1/4=0.25$ — $\theta=4$ and $\theta=0.25$ produce identical
          autocovariances, and only $0.25$ satisfies $|\theta|<1$, so it's the
          one to actually report.
      - teach: >
          A two-wide window of shocks: always stationary, ACF exactly zero
          beyond lag $1$, $|\rho_1|$ capped at $1/2$, and $\theta$
          indistinguishable from $1/\theta$ except by invertibility.

  - node: quant-statistics.time-series.ar-ma-signatures
    hook: >
      This is the Box–Jenkins identification table distilled to one move:
      match which correlogram cuts off and which tails off, and the model
      family is named before any parameter is estimated.
    explanation: >
      An AR(1) writes today in terms of an infinite, geometrically fading
      window over every past shock, so its ACF never fully dies — but its
      PACF, which strips out exactly what's already explained by the
      intervening lags, cuts off dead after lag $1$ because the model only
      ever reaches one step back directly. An MA(1) is the mirror image: it's
      literally a finite two-wide sum of shocks, so its ACF cuts off dead
      after lag $1$, but recovering it in PACF terms requires inverting that
      finite window into an infinite autoregression, so the PACF tails off
      instead of cutting. The same duality generalizes: AR($p$) cuts off in
      the PACF at lag $p$ and tails in the ACF; MA($q$) cuts off in the ACF at
      lag $q$ and tails in the PACF; both tailing off says ARMA.

      A near-$1$ correlogram that falls almost linearly across many lags — not
      the geometric shrinkage of a stationary AR — is the sign to difference
      before fitting anything at all. Because a real, finite sample's
      correlogram always wobbles inside its noise band, read the overall
      pattern rather than any one bar, and when two small models both fit
      plausibly, prefer the smaller one: an AR(1) with modest $\phi$ and an
      MA(1) are nearly indistinguishable on a short sample, and the sparser
      model is the one that forecasts better out of sample.
    worked: >
      AR(1) with $\phi=0.7$: $\rho_1=0.7$, $\rho_2=0.49$, $\rho_3=0.343$ —
      tailing off geometrically, no cutoff. MA(1) with $\theta=0.7$:
      $\rho_1=0.7/(1+0.49)=0.7/1.49\approx0.470$, and $\rho_k=0$ for $k\ge2$ —
      a hard cutoff after one lag. Same-sized coefficient, visibly different
      correlograms.
    interview: >
      "The correlogram shows one significant spike at lag $1$ and nothing
      after — AR or MA?" wants "MA(1)," reasoned from the *ACF* cutting off —
      not the common reversed answer that confuses which function cuts off
      for which family.
    pitfalls: >
      Memorizing the cutoff/tail pairing backwards — the fastest way to
      misname a model from a correct plot. Treating small in-band wobbles at
      high lags as evidence for a higher-order model instead of noise.
      Fitting a large ARMA to match every wiggle rather than favoring the
      parsimonious model that actually generalizes.
    recap: >
      A cutoff in the PACF names AR, a cutoff in the ACF names MA, both
      tailing off names ARMA, and a slow near-linear crawl in the ACF says
      difference first.
    steps:
      - teach: >
          An AR(1) never cuts off in the ACF, but its PACF does — it dies
          immediately after lag $1$ because the model only ever reaches one
          step back. An MA(1) is the mirror image: its ACF cuts off dead after
          lag $1$, but its PACF tails off, because recovering it in PACF terms
          means inverting a finite window into an infinite autoregression.
      - teach: >
          The duality generalizes: AR($p$) cuts off in the PACF at lag $p$ and
          tails in the ACF; MA($q$) cuts off in the ACF at lag $q$ and tails in
          the PACF; both tailing off says ARMA.
      - ask: >
          A correlogram shows the PACF cutting off sharply after lag $2$ while
          the ACF tails off gradually across many lags. What family fits?
        choices:
          - text: >
              MA(2)
            feedback: >
              MA($q$) is identified by the ACF cutting off, not the PACF — this
              pattern is reversed from that.
          - text: >
              AR(2)
            correct: true
            feedback: >
              Right — a PACF cutoff at lag $p$ with a tailing ACF is exactly
              the AR($p$) signature.
          - text: >
              ARMA
            feedback: >
              ARMA needs both functions to tail off; here the PACF has a clean
              cutoff, which rules out the fully-tailing ARMA case.
        feedback: >
          PACF cutoff at lag $p$, tailing ACF: that pairing names AR($p$)
          directly.
      - teach: >
          A near-$1$ correlogram falling almost linearly across many lags is a
          different signal entirely — not the geometric shrinkage of a
          stationary AR, but the sign to difference the series before fitting
          anything.
      - ask: >
          An AR(1) has $\phi=0.5$. What is its $\rho_2=\phi^{2}$?
        expects: "0.25"
        hint: >
          $0.5^{2}$.
        feedback: >
          $\rho_2=0.5^{2}=0.25$ for the AR(1) — while a competing MA(1) with
          the same-sized coefficient $\theta=0.5$ has $\rho_2=0$ outright, a
          visibly different correlogram from an identically-sized parameter.
      - teach: >
          Because a real, finite sample's correlogram always wobbles inside its
          noise band, read the overall pattern rather than any single bar.
      - ask: >
          An AR(1) with modest $\phi$ and an MA(1) both fit a short sample of
          data plausibly. Which model should you prefer, and why?
        choices:
          - text: >
              Whichever has the higher in-sample $R^{2}$, regardless of size.
            feedback: >
              Chasing in-sample fit on a short, noisy sample tends to reward
              the more flexible model rather than the truer one.
          - text: >
              The smaller, more parsimonious model — it typically forecasts
              better out of sample when the two are hard to tell apart.
            correct: true
            feedback: >
              Right — near-indistinguishable short-sample fits are exactly when
              the parsimony tiebreaker earns its keep.
          - text: >
              Always the AR model, since it never technically cuts off.
            feedback: >
              Never cutting off isn't a virtue here — the choice is about which
              model generalizes, not about which function decays instead of
              stopping.
        feedback: >
          When two small models are nearly indistinguishable on a short sample,
          prefer the sparser one — it is the one that tends to forecast better
          out of sample.
      - teach: >
          A cutoff in the PACF names AR, a cutoff in the ACF names MA, both
          tailing off names ARMA, and a slow near-linear crawl in the ACF says
          difference first.

  - node: quant-statistics.time-series.higher-order
    hook: >
      Interviews rarely leave AR(1) and MA(1), but they do check whether you
      know the $|\phi|<1$ condition was secretly a root condition all along —
      a fact that resurfaces the moment a second lag is added.
    explanation: >
      Write the AR(1) stationarity condition as a statement about the
      polynomial $1-\phi z$: its root is $z=1/\phi$, and $|\phi|<1$ is exactly
      $|z|>1$ — the root sits outside the unit circle. That's not a
      coincidence particular to one lag; it's the general rule. For AR($p$),
      stationarity holds exactly when every root of
      $1-\phi_1 z-\dots-\phi_p z^{p}=0$ lies outside the unit circle, and once
      $p\ge2$ no simple bound on the individual coefficients replaces that
      check — a coefficient can be small in magnitude and still produce a
      root inside the circle once other lags interact with it.

      MA($q$) sidesteps this on the stationarity side entirely, for the same
      reason MA(1) always is: it's a finite window over $q+1$ shocks, so its
      variance is a finite sum regardless of the coefficients. The matching
      root condition instead governs *invertibility* — whether the shocks can
      be recovered from observed history — exactly as $|\theta|<1$ did for
      MA(1). Yule–Walker generalizes cleanly too: the ACF at lags
      $1,\dots,p$ gives $p$ linear equations in the $\phi_i$, cheap to solve
      by hand, while software instead maximizes the full likelihood for a
      sharper fit.
    worked: >
      AR(2) with $\phi_1=0.5$, $\phi_2=0.3$: the characteristic polynomial is
      $1-0.5z-0.3z^{2}=0$, i.e. $0.3z^{2}+0.5z-1=0$, with roots
      $z=(-0.5\pm\sqrt{0.25+1.2})/0.6=(-0.5\pm1.204)/0.6$, giving
      $z\approx1.174$ and $z\approx-2.840$. Both satisfy $|z|>1$, so the
      process is stationary — even though $\phi_1+\phi_2=0.8$ isn't obviously
      informative on its own.
    interview: >
      "Given $\phi_1=0.5$, $\phi_2=0.3$, is this AR(2) stationary?" wants the
      characteristic polynomial set up and its roots checked against the unit
      circle, not a claim that each $|\phi_i|<1$ individually is enough.
    pitfalls: >
      Assuming $|\phi_i|<1$ for every individual coefficient guarantees
      stationarity once $p\ge2$ — it's neither necessary nor sufficient in
      general. Forgetting MA($q$) is stationary for any coefficients
      whatsoever; only invertibility needs the root check. Mixing up "outside
      the unit circle" (stationary) with "inside" — an easy sign slip under
      pressure.
    recap: >
      Stationarity and invertibility are both root conditions on the lag
      polynomial, outside the unit circle in each case, with $|\phi|<1$ as
      just the $p=1$ special case of the general rule.
    steps:
      - teach: >
          Write the AR(1) stationarity condition as a statement about the
          polynomial $1-\phi z$: its root is $z=1/\phi$, and $|\phi|<1$ is
          exactly $|z|>1$ — the root sits outside the unit circle.
      - teach: >
          That's the general rule, not a coincidence of one lag: AR($p$) is
          stationary exactly when every root of $1-\phi_1z-\dots-\phi_pz^{p}=0$
          lies outside the unit circle. Once $p\ge2$, no simple bound on the
          individual coefficients replaces that check.
      - ask: >
          AR(2) with $\phi_1=0.4$, $\phi_2=0.2$. The characteristic polynomial
          $1-0.4z-0.2z^{2}=0$ has two real roots. Rounded to four decimals,
          what is the smaller-magnitude one?
        expects: "1.4495"
        tolerance: 0.0005
        hint: >
          Rewrite as $0.2z^{2}+0.4z-1=0$ and apply the quadratic formula.
        feedback: >
          Rewriting as $0.2z^{2}+0.4z-1=0$ and applying the quadratic formula
          gives $z=(-0.4\pm\sqrt{0.16+0.8})/0.4$, i.e. $z\approx1.4495$ or
          $z\approx-3.4495$ — both satisfy $|z|>1$, so the process is
          stationary.
      - teach: >
          MA($q$) sidesteps the stationarity check entirely, for the same
          reason MA(1) always does: it's a finite window over $q+1$ shocks, so
          its variance is a finite sum regardless of the coefficients. The
          matching root condition instead governs invertibility.
      - ask: >
          For an AR(3), each individual coefficient satisfies $|\phi_i|<1$.
          Does that guarantee stationarity?
        choices:
          - text: >
              Yes — bounding each coefficient separately is sufficient once you
              check all three.
            feedback: >
              That per-coefficient bound is only the $p=1$ special case; once
              $p\ge2$, coefficients can interact to put a root inside the unit
              circle even if each is individually small.
          - text: >
              No — stationarity depends on where the roots of the full
              characteristic polynomial sit, not on any per-coefficient bound.
            correct: true
            feedback: >
              Right — the roots of $1-\phi_1z-\phi_2z^{2}-\phi_3z^{3}=0$ have
              to be checked directly; no shortcut on the individual $\phi_i$
              replaces that.
          - text: >
              No — an AR(3) is never stationary regardless of coefficients.
            feedback: >
              AR(3) can certainly be stationary; it's just that the condition
              is a root check, not a claim that stationarity is impossible.
        feedback: >
          Beyond $p=1$, stationarity is a statement about the roots of the
          whole characteristic polynomial, never a per-coefficient bound.
      - teach: >
          Yule–Walker generalizes cleanly: the ACF at lags $1,\dots,p$ gives
          $p$ linear equations in the $\phi_i$, cheap to solve by hand, while
          software instead maximizes the full likelihood for a sharper fit.
      - ask: >
          Interviewers rarely go past AR(1) and MA(1) computationally. What are
          they actually checking when they mention AR($p$) or MA($q$)?
        choices:
          - text: >
              Whether you can solve a $p$-th degree polynomial by hand under
              time pressure.
            feedback: >
              That's not the point being tested — nobody expects hand-factoring
              a high-degree polynomial live.
          - text: >
              Whether you know the general stationarity and invertibility
              conditions are root conditions on the lag polynomials, not
              memorized coefficient bounds.
            correct: true
            feedback: >
              Right — the content being checked is the general principle, since
              $|\phi|<1$ is just its $p=1$ special case.
          - text: >
              Whether you can recite the Yule–Walker equations for arbitrary
              $p$ from memory.
            feedback: >
              The equations generalize mechanically once the idea is understood
              — the checked content is the root-condition principle, not rote
              recall.
        feedback: >
          The general families exist to test whether the root-condition
          principle is understood, not whether a high-order polynomial can be
          solved live.
      - teach: >
          Stationarity and invertibility are both root conditions on the lag
          polynomial, outside the unit circle in each case, with $|\phi|<1$ as
          just the $p=1$ special case of the general rule.

  - node: quant-statistics.time-series.unit-root
    hook: >
      This is the single boundary every earlier technique in this unit
      silently assumed you weren't standing on — and raw price levels usually
      are standing exactly there.
    explanation: >
      Setting $\phi=1$ turns the AR(1) recursion into
      $x_t=x_{t-1}+\varepsilon_t$: a running sum of shocks, the same object
      already known to have $\operatorname{Var}(S_n)=n$ growing without bound
      and no restoring pull back to any fixed level. The AR(1) variance
      formula $\sigma^{2}/(1-\phi^{2})$ makes the failure visible directly —
      plug in $\phi=1$ and the denominator hits zero, the algebraic signal
      that the whole stationary apparatus is undefined exactly at this
      boundary, not just numerically large. Shocks that used to fade like
      $\phi^{k}$ now persist forever, the half-life is infinite, and a nonzero
      constant $c$ no longer sets a mean to revert to — it becomes a
      deterministic trend $ct$ riding on top of the wandering.

      Testing for this is not a t-test in disguise. The Dickey–Fuller
      regression puts $\Delta x_t$ on $x_{t-1}$ and asks whether that slope is
      $0$, but under the null $x_{t-1}$ is itself non-stationary, so the usual
      normal-theory asymptotics for a regression slope don't apply — the
      test statistic needs its own, heavier-tailed tabulated distribution,
      with a 5% critical value near $-2.86$ rather than the familiar $-1.96$.
    worked: >
      A Dickey–Fuller regression on a suspected spread gives a slope
      $t$-statistic of $-2.10$. Judged against the normal $-1.96$ that looks
      like a clean rejection of the unit root. Judged against the actual DF
      critical value near $-2.86$, $-2.10$ doesn't clear the bar at all — the
      unit root cannot be rejected, the opposite conclusion from using the
      wrong table.
    interview: >
      "You test a spread for stationarity and get a $t$-statistic of $-2.1$ —
      is it stationary?" wants the candidate to reject the naive
      "$|{-2.1}|>1.96$, so yes" answer and instead cite that Dickey–Fuller's
      own critical value is more negative, concluding the unit root survives.
    pitfalls: >
      Comparing a Dickey–Fuller statistic to normal critical values instead
      of the test's own tabulated ones — the single most common trap here.
      Treating $\phi=0.98$ as close enough to stationary behavior to ignore
      the distinction — the qualitative properties (bounded variance, finite
      half-life) hold at $0.98$ but the formulas are approaching the same
      singularity that fully breaks at $\phi=1$.
    recap: >
      At $\phi=1$ variance grows like $t$ and shocks never fade; testing for
      it needs Dickey–Fuller's own, more negative critical values, not normal
      ones.
    steps:
      - teach: >
          Setting $\phi=1$ turns the AR(1) into a random walk,
          $x_t=x_{t-1}+\varepsilon_t$, a running sum of shocks with variance
          that grows without bound and no restoring pull back to any fixed
          level.
      - teach: >
          The AR(1) variance formula makes the failure visible directly:
          $\sigma^{2}/(1-\phi^{2})$ hits a zero denominator exactly at
          $\phi=1$, the algebraic signal that the entire stationary apparatus
          is undefined at this boundary, not just numerically large.
      - ask: >
          For a pure random walk with $\sigma^{2}=2$, what is
          $\operatorname{Var}(x_t)$ at $t=50$, using
          $\operatorname{Var}(x_t)=t\sigma^{2}$?
        expects: "100"
        hint: >
          Multiply directly.
        feedback: >
          $\operatorname{Var}(x_{50})=50\times2=100$ — variance that keeps
          growing with $t$ rather than settling to any fixed number.
      - teach: >
          Testing for a unit root is not a $t$-test in disguise: the
          Dickey–Fuller regression puts $\Delta x_t$ on $x_{t-1}$ and asks
          whether that slope is $0$, but under the null $x_{t-1}$ is itself
          non-stationary, so ordinary normal-theory asymptotics don't apply.
      - ask: >
          A Dickey–Fuller regression on a suspected spread gives a slope
          $t$-statistic of $-2.30$. Is the unit root rejected?
        choices:
          - text: >
              Yes — $|-2.30|>1.96$ clears the usual $95\%$ threshold.
            feedback: >
              That's the normal-theory threshold, and it's the wrong one here —
              Dickey–Fuller has its own, more negative critical value.
          - text: >
              No — the Dickey–Fuller $5\%$ critical value is near $-2.86$, and
              $-2.30$ doesn't clear that bar.
            correct: true
            feedback: >
              Right — under the null the statistic follows Dickey–Fuller's own
              heavier-tailed distribution, not the normal, so the unit root
              survives this test.
          - text: >
              It can't be judged without also seeing the $R^{2}$.
            feedback: >
              The unit-root decision here rests on comparing the $t$-statistic
              to the correct tabulated critical value, not on $R^{2}$.
        feedback: >
          Comparing a Dickey–Fuller statistic to normal critical values is the
          single most common trap in this test.
      - teach: >
          At the boundary, shocks that used to fade like $\phi^{k}$ persist
          forever, the half-life becomes infinite, and a nonzero constant $c$
          stops setting a mean to revert to — it becomes a deterministic trend
          $ct$ riding on top of the wandering.
      - ask: >
          A fitted $\phi=0.98$ looks close enough to $1$ that a candidate
          treats the series as 'basically stationary' and skips the formal
          test. What's the risk?
        choices:
          - text: >
              None — $0.98$ and $1$ behave identically in every formula that
              matters.
            feedback: >
              The formulas involving $1-\phi^{2}$ or $1-\phi$ are approaching
              the same singularity that fully breaks at $\phi=1$; treating
              $0.98$ as safely stationary skips real risk.
          - text: >
              The variance and half-life formulas are approaching the same
              singularity that breaks completely at $\phi=1$, so error bars and
              mean-reversion speed can be badly understated without the formal
              test.
            correct: true
            feedback: >
              Right — qualitative closeness to $1$ doesn't make the boundary
              problem go away; only the test settles whether it's actually
              there.
          - text: >
              The main risk is only cosmetic — the plotted series would just
              look slightly different.
            feedback: >
              The risk is substantive, not cosmetic: standard errors and
              half-lives computed as if $\phi$ were comfortably below $1$ can
              be badly wrong.
        feedback: >
          $\phi=0.98$ sits close enough to the singularity that the formal
          test, not a qualitative eyeball, has to settle the question.
      - teach: >
          At $\phi=1$ variance grows like $t$ and shocks never fade; testing
          for it needs Dickey–Fuller's own, more negative critical values,
          never the familiar normal ones.

  - node: quant-statistics.time-series.differencing
    hook: >
      This is the one line of arithmetic that explains why quant work is done
      in returns and not price levels — and why differencing twice is a real
      way to make a model worse, not safer.
    explanation: >
      If $x_t$ carries a unit root it behaves like a running sum of roughly
      stationary increments, so subtracting one lag, $\Delta x_t = x_t -
      x_{t-1}$, literally undoes the summation and hands back something close
      to those increments directly — the meaning of $x_t\sim I(1)$,
      $\Delta x_t\sim I(0)$. Log price is exactly this object: writing
      $\log P_t \approx \log P_{t-1} + r_t$ makes $\log P$ an integrated
      series and $r_t=\Delta\log P_t=\log(P_t/P_{t-1})$ its stationary
      difference — the reason returns, not prices, are what gets averaged,
      correlated, and tested.

      Overdifferencing is not a free safety margin; it manufactures a problem.
      Difference an already-stationary white-noise series $x_t=\varepsilon_t$
      and $\Delta x_t=\varepsilon_t-\varepsilon_{t-1}$ is exactly an MA(1)
      with $\theta=-1$: $\operatorname{Var}(\Delta x_t)=2\sigma^{2}$ (double
      the original) and
      $\operatorname{Cov}(\Delta x_t,\Delta x_{t-1})=-\sigma^{2}$, giving
      $\rho_1=-1/2$ — sitting exactly on MA(1)'s $|\rho_1|\le1/2$ boundary and
      exactly on its non-invertible edge $|\theta|=1$, so the shocks can no
      longer be recovered from the differenced series at all. Match the cure
      to the disease: detrend a trend-stationary series by regression on
      time, difference a series with an actual unit root, and don't reach for
      differencing by default.
    worked: >
      $x_t=\varepsilon_t$, $\varepsilon_t$ iid with $\sigma^{2}=1$. Then
      $\Delta x_t=\varepsilon_t-\varepsilon_{t-1}$ has
      $\operatorname{Var}(\Delta x_t)=2$ and
      $\operatorname{Cov}(\Delta x_t,\Delta x_{t-1})=-1$, so
      $\rho_1=-1/2$ — the variance doubled and the induced MA(1) sits exactly
      on the non-invertible boundary $\theta=-1$, purely from differencing a
      series that needed no fixing.
    interview: >
      "Why model log returns instead of log prices?" wants: log price behaves
      like an $I(1)$ series (essentially a random walk), so its own mean and
      variance aren't stable quantities to estimate, while the first
      difference, the return, is close to $I(0)$ and can safely be averaged
      and tested — plus the caveat against differencing something already
      stationary.
    pitfalls: >
      Differencing twice "to be safe" — it converts a good $I(0)$ series into
      an over-differenced, non-invertible MA(1) with inflated variance.
      Reaching for differencing when the real issue is a deterministic trend,
      which calls for detrending by regression instead — the two problems
      have different cures and applying the wrong one leaves the series
      broken in a new way.
    recap: >
      One difference converts $I(1)$ to $I(0)$ — exactly why returns, not
      prices, are the modelling unit — but differencing an already-stationary
      series manufactures a non-invertible MA(1) and doubles its variance.
    steps:
      - teach: >
          If $x_t$ carries a unit root it behaves like a running sum of roughly
          stationary increments, so subtracting one lag, $\Delta
          x_t=x_t-x_{t-1}$, literally undoes the summation — the meaning of
          $x_t\sim I(1)$, $\Delta x_t\sim I(0)$.
      - teach: >
          Log price is exactly this object: $\log P_t\approx\log P_{t-1}+r_t$
          makes $\log P$ an integrated series, and $r_t=\Delta\log
          P_t=\log(P_t/P_{t-1})$ its stationary difference — the reason
          returns, not prices, get averaged and tested.
      - ask: >
          White noise $x_t=\varepsilon_t$ with $\sigma^{2}=3$ is differenced
          anyway. What is $\operatorname{Var}(\Delta x_t)=2\sigma^{2}$?
        expects: "6"
        hint: >
          Double it.
        feedback: >
          $\operatorname{Var}(\Delta x_t)=2\times3=6$ — differencing an
          already-stationary series doubles its variance instead of fixing
          anything.
      - teach: >
          Overdifferencing isn't a free safety margin — differencing white
          noise produces exactly an MA(1) with $\theta=-1$, sitting on its
          non-invertible boundary, since the shocks can no longer be recovered
          from the differenced series.
      - ask: >
          For that same series ($\sigma^{2}=3$), what is $\rho_1$ of the
          differenced series, $\operatorname{Cov}(\Delta x_t,\Delta
          x_{t-1})/\operatorname{Var}(\Delta x_t) = -\sigma^{2}/(2\sigma^{2})$?
        expects: "-0.5"
        tolerance: 0.0005
        hint: >
          The $\sigma^{2}$ cancels.
        feedback: >
          $-3/6=-0.5$ — landing exactly on MA(1)'s $|\rho_1|\le1/2$ boundary,
          purely from over-differencing.
      - teach: >
          Match the cure to the disease: detrend a trend-stationary series by
          regression on time, and difference a series that actually carries a
          unit root — the two problems have different fixes.
      - ask: >
          A series has an obvious linear time trend but no unit root — its
          deviations from that trend are genuinely stationary. What's the right
          treatment?
        choices:
          - text: >
              Take a first difference, since that's the standard fix for
              non-stationary-looking data.
            feedback: >
              Differencing a trend-stationary series manufactures a
              non-invertible MA(1) component and doubles the variance for no
              benefit.
          - text: >
              Detrend by regressing on time and work with the residual.
            correct: true
            feedback: >
              Right — the trend is deterministic here, not stochastic, so
              regression removes it cleanly without the overdifferencing cost.
          - text: >
              Difference it twice to be safe.
            feedback: >
              Differencing twice compounds the problem rather than avoiding it
              — even a single unnecessary difference already injects a
              non-invertible MA(1).
        feedback: >
          A deterministic trend calls for detrending by regression, not for
          differencing — the two fixes are not interchangeable.
      - teach: >
          One difference converts $I(1)$ to $I(0)$ — why returns, not prices,
          are the modelling unit — but differencing an already-stationary
          series manufactures a non-invertible MA(1) and doubles its variance.

  - node: quant-statistics.time-series.spurious-regression
    hook: >
      "Always check the Durbin–Watson against the $R^{2}$" is the one-line
      defense against a backtest that regresses two unrelated wandering
      series onto each other and finds a beautiful, meaningless relationship.
    explanation: >
      OLS's usual guarantees — that the estimated slope is a sensible
      estimate of a true relationship, and that its standard error shrinks
      like $1/\sqrt{n}$ — implicitly assume residuals that settle down into
      something close to stationary. Regress two genuinely independent
      random walks on each other and that assumption fails completely: the
      residuals are themselves $I(1)$, wandering rather than settling, so the
      textbook standard-error formula is computing the wrong thing by an
      unbounded factor. The slope's $t$-statistic doesn't shrink toward
      insignificance as $n$ grows the way it would for a real null
      relationship — it diverges like $\sqrt{n}$, so more data makes the
      illusion of significance *worse*, the opposite of the usual intuition
      that more data resolves doubt.

      The diagnostic follows directly from what broke: Durbin–Watson measures
      residual autocorrelation, and $I(1)$ residuals push it toward $0$ (a
      value near $2$ would mean no autocorrelation). A large $R^{2}$ paired
      with a Durbin–Watson statistic well below it — rather than near $2$ — is
      the tell that the fit is riding on shared wandering, not a real
      relationship. The fix is either to regress differences on differences,
      collapsing both series back to something stationary, or to first
      establish cointegration before trusting a levels regression at all.
    worked: >
      A backtest regression of one desk's cumulative P&L against an unrelated
      series' level returns $R^{2}=0.42$ with a large $t$-statistic on the
      slope, but Durbin–Watson comes back at $0.18$. Durbin–Watson near $0$
      while $R^{2}$ is large — rather than Durbin–Watson near $2$ — is exactly
      the spurious-regression signature, regardless of how convincing the
      $R^{2}$ looks on its own.
    interview: >
      "You regressed strategy X's cumulative P&L against a benchmark and got
      $R^{2}=0.6$ with a huge $t$-statistic — is this real?" wants an
      immediate check of whether both series are levels (potentially $I(1)$),
      a request for the Durbin–Watson statistic, and a refusal to trust the
      fit if it's low relative to the $R^{2}$.
    pitfalls: >
      Trusting a high $R^{2}$ or large $t$-statistic from a levels-on-levels
      regression of two trending or wandering series without checking
      stationarity first. Assuming a larger sample fixes a spurious fit — the
      $t$-statistic diverges rather than shrinking, so more data makes the
      mistake look more convincing, not less.
    recap: >
      Two unrelated random walks regress onto each other with a large
      $R^{2}$ and a huge, ever-growing $t$-statistic — a Durbin–Watson near
      $0$ against a large $R^{2}$ is the tell, and more data does not fix it.
    steps:
      - teach: >
          OLS's usual guarantees — a sensible slope estimate, standard errors
          shrinking like $1/\sqrt{n}$ — implicitly assume residuals that settle
          down into something close to stationary.
      - teach: >
          Regress two genuinely independent random walks on each other and that
          assumption fails completely: the residuals are themselves $I(1)$, so
          the textbook standard-error formula computes the wrong thing by an
          unbounded factor, and the slope's $t$-statistic diverges like
          $\sqrt{n}$ instead of shrinking.
      - teach: >
          Durbin–Watson is the direct diagnostic for exactly this failure: it
          measures residual autocorrelation, running near $2$ for well-behaved
          residuals and collapsing toward $0$ when the residuals are themselves
          close to a random walk.
      - ask: >
          A backtest regression of two unrelated series gives $R^{2}=0.55$ with
          a large $t$-statistic, and a Durbin–Watson statistic of $0.24$. What
          does this combination tell you?
        choices:
          - text: >
              Nothing unusual — a strong fit like this is exactly what a real
              relationship looks like.
            feedback: >
              A Durbin–Watson this far below $2$ says the residuals are
              themselves autocorrelated — not what a genuine, well-specified
              relationship produces.
          - text: >
              The residuals are almost certainly $I(1)$, and this large $R^{2}$
              with a collapsed Durbin–Watson is the spurious-regression
              signature.
            correct: true
            feedback: >
              Right — pairing a large $R^{2}$ with a Durbin–Watson this low is
              exactly the tell that the fit is riding on shared wandering
              rather than a real relationship.
          - text: >
              It confirms the relationship, just with some residual noise.
            feedback: >
              A collapsed Durbin–Watson points the opposite way — toward
              non-stationary residuals undermining the whole regression, not
              ordinary noise.
        feedback: >
          A large $R^{2}$ paired with a Durbin–Watson well below it, rather
          than near $2$, is precisely this node's central warning sign.
      - ask: >
          The spurious-regression $t$-statistic diverges roughly like
          $\sqrt{n}$. If it reads $2.0$ at $n=100$, roughly what magnitude
          would you expect at $n=400$, assuming that scaling holds?
        expects: "4"
        hint: >
          $\sqrt{400/100}=2$; scale the original statistic by that factor.
        feedback: >
          $\sqrt{400/100}=2$, so the statistic scales to roughly $2.0\times2=4$
          — more data making the illusion of significance worse, not better,
          the opposite of the usual intuition.
      - teach: >
          This is the trap that makes spurious regression dangerous: more data
          doesn't rescue you, since the divergence is structural, not a
          small-sample fluke that averages out.
      - ask: >
          What's the correct fix once two levels series are suspected of a
          spurious relationship?
        choices:
          - text: >
              Collect a much larger sample and refit.
            feedback: >
              More data makes the $t$-statistic diverge further, not shrink —
              this doesn't fix the underlying problem.
          - text: >
              Regress differences on differences, or first establish
              cointegration before trusting a levels regression.
            correct: true
            feedback: >
              Right — either move restores stationary residuals, which is what
              the original OLS guarantees actually require.
          - text: >
              Add more explanatory variables to the levels regression.
            feedback: >
              Adding variables doesn't address non-stationary residuals; the
              fix has to target stationarity directly.
        feedback: >
          Restore stationary residuals — by differencing or by establishing
          cointegration — rather than adding data or variables.
      - teach: >
          Two unrelated random walks regress onto each other with a large
          $R^{2}$ and a growing $t$-statistic — a Durbin–Watson near $0$
          against a large $R^{2}$ is the tell, and more data does not fix it.

  - node: quant-statistics.time-series.cointegration
    hook: >
      This is pairs trading's actual license: why regressing two wandering
      price levels on each other is sometimes legitimate rather than the
      spurious-regression trap just covered.
    explanation: >
      Spurious regression is what happens generically when two $I(1)$ series
      are regressed with nothing tying them together. Cointegration is the
      specific exception: if some linear combination $y_t-\beta x_t$ is
      itself stationary, that combination — the spread — is a real,
      economically meaningful object even though $x_t$ and $y_t$ individually
      wander without bound. The levels regression that recovers $\beta$ is
      then not spurious at all; it's estimating the one linear combination
      that happens to cancel the shared wandering.

      The Engle–Granger recipe runs the two ideas from this unit back to
      back: estimate $\beta$ by ordinary least squares on the levels, then
      run the unit-root test on the *residual* of that fit. The catch is that
      $\beta$ was chosen specifically to make the residual look as stationary
      as possible, which biases a plain Dickey–Fuller test toward finding
      stationarity that isn't there — so the test needs its own, adjusted
      critical values, stricter than the raw Dickey–Fuller ones. When
      cointegration genuinely holds, $\beta$ is "super-consistent": it
      converges at rate $n$ rather than the usual $\sqrt{n}$, because the
      shared wandering that would otherwise inflate the standard error is
      precisely what's being cancelled out by the correct $\beta$.
    worked: >
      Two names with true hedge ratio $\beta=1.5$ and a spread
      $y_t-1.5x_t$ that follows a stationary AR(1) with $\phi=0.9$ — a
      half-life around $6.6$ periods. Fitting $\beta$ by OLS on a finite
      sample gives $\hat\beta=1.47$, already close because of the
      super-consistent convergence rate, and the residual's unit-root test
      statistic clears the stricter, Engle–Granger-adjusted critical value
      even though it would have looked marginal against a plain
      Dickey–Fuller table.
    interview: >
      "Two related stocks each look like random walks individually, but
      their spread looks mean-reverting — what's this called, and how do you
      test it?" wants "cointegration," the Engle–Granger two-step recipe
      named explicitly, and the caveat that the residual test needs its own
      critical values, not plain Dickey–Fuller ones.
    pitfalls: >
      Testing the fitted residual for a unit root using ordinary
      Dickey–Fuller critical values instead of the stricter Engle–Granger
      ones — understating how easy it is to manufacture an apparently
      stationary residual by fitting $\beta$ to the data. Calling any two
      wandering series with a high levels-regression $R^{2}$ cointegrated
      without testing the residual explicitly — that's the spurious-regression
      trap wearing a different label.
    recap: >
      Two wandering series tied by a stationary spread: the Engle–Granger
      test recovers $\beta$ by OLS on levels, then checks the residual for a
      unit root with its own critical values, and a genuine $\beta$ converges
      at the unusually fast rate $n$.
    steps:
      - teach: >
          Spurious regression is what happens generically when two $I(1)$
          series are regressed with nothing tying them together. Cointegration
          is the specific exception: if some linear combination $y_t-\beta x_t$
          is itself stationary, that spread is a real, economically meaningful
          object even though $x_t$ and $y_t$ individually wander without bound.
      - teach: >
          The Engle–Granger recipe chains the last two ideas together: estimate
          $\beta$ by OLS on the levels, then run the unit-root test on the
          residual of that fit — except $\beta$ was chosen to make the residual
          look as stationary as possible, so the residual test needs its own,
          stricter critical values.
      - ask: >
          A cointegrating spread follows a stationary AR(1) with $\phi=0.85$.
          What is its half-life, $\ln2/\ln(1/\phi)$?
        expects: "4.2650"
        tolerance: 0.0005
        hint: >
          Use the half-life formula from earlier in the unit.
        feedback: >
          $h=\ln2/\ln(1/0.85)=0.6931/0.1625\approx4.2650$ periods — a
          fast-reverting spread, the kind that makes a pairs trade attractive.
      - teach: >
          When cointegration genuinely holds, $\beta$ is 'super-consistent': it
          converges at rate $n$ rather than the usual $\sqrt{n}$, because the
          very wandering that would otherwise inflate the standard error is
          precisely what a correct $\beta$ cancels out.
      - ask: >
          Two unrelated stocks each individually resemble random walks, and a
          levels regression between them has a high $R^{2}$. Is that alone
          evidence of cointegration?
        choices:
          - text: >
              Yes — a high $R^{2}$ between two $I(1)$ series is the definition
              of cointegration.
            feedback: >
              A high $R^{2}$ between two $I(1)$ series is exactly what spurious
              regression also produces — it's not sufficient on its own.
          - text: >
              No — you still need to test the fitted residual for a unit root,
              using the stricter Engle–Granger critical values, before calling
              it cointegration.
            correct: true
            feedback: >
              Right — the levels $R^{2}$ can't distinguish cointegration from
              spurious regression; only the residual unit-root test can.
          - text: >
              No — cointegration requires both series to already be
              individually stationary.
            feedback: >
              The opposite: cointegration is specifically about two
              individually non-stationary, $I(1)$ series whose combination is
              stationary.
        feedback: >
          A high levels $R^{2}$ is exactly what spurious regression also
          produces — only the residual unit-root test tells cointegration apart
          from it.
      - teach: >
          In practice $\beta$ is read as a hedge ratio: hold one unit of $y$
          against $\beta$ units of $x$, and the resulting spread is the object
          actually traded. That spread typically behaves like a mean-reverting
          AR(1) with a finite half-life — the reversion-speed tools from
          earlier in this unit apply to it directly.
      - ask: >
          You run Engle–Granger's second step and test the residual against
          ordinary Dickey–Fuller critical values instead of the adjusted ones.
          What's the risk?
        choices:
          - text: >
              None — the residual test is identical to a plain unit-root test
              on any series.
            feedback: >
              It isn't identical — the residual was constructed by fitting
              $\beta$ to look stationary, which the plain Dickey–Fuller table
              doesn't account for.
          - text: >
              You'd overstate how easy it is to find cointegration, since the
              fitted residual is biased toward looking stationary even absent a
              real relationship.
            correct: true
            feedback: >
              Right — using the un-adjusted table understates how much
              stationarity-looking behavior comes from the fitting itself, not
              from a genuine cointegrating relationship.
          - text: >
              The only consequence is a slightly different $\beta$ estimate.
            feedback: >
              The risk isn't in $\beta$'s value — it's in wrongly concluding
              the residual is stationary using the wrong critical values.
        feedback: >
          Using plain Dickey–Fuller critical values on a fitted residual
          overstates how easy it is to manufacture apparent cointegration.
      - teach: >
          Two wandering series tied by a stationary spread: the Engle–Granger
          test recovers $\beta$ by OLS on levels, then checks the residual for
          a unit root with its own critical values, and a genuine $\beta$
          converges at the unusually fast rate $n$.

  - node: quant-statistics.time-series.effective-sample-size
    hook: >
      A Sharpe ratio computed off autocorrelated daily P&L lies by exactly the
      multiple this node derives — the reason a backtest that looks
      significant with $n$ observations often isn't.
    explanation: >
      Substitute $\rho_k=\phi^{k}$ into the general variance-of-a-mean formula
      and let $n$ grow: the $k/n$ taper vanishes and the sum
      $\sum_{k\ge1}\phi^{k}$ collapses to the geometric series
      $\phi/(1-\phi)$. The bracket therefore tends to
      $1+2\phi/(1-\phi)=(1-\phi+2\phi)/(1-\phi)=(1+\phi)/(1-\phi)$ — the
      inflation factor over the naive iid variance $\gamma_0/n$. Reading it as
      an effective sample size, $n_{\text{eff}}=n(1-\phi)/(1+\phi)$, makes the
      mechanism concrete: correlated observations are partially double-counted
      information, so a sample of $n$ autocorrelated points carries the actual
      information content of a much smaller iid sample.

      The practical trap is that a standard t-test or Sharpe-ratio
      significance calculation plugs in the raw $n$, understating the true
      standard error by the square root of that same factor. Positive $\phi$
      always inflates the variance of the mean; negative $\phi$ does the
      opposite, since alternating signs partially cancel across neighboring
      terms rather than reinforcing each other.
    worked: >
      $\phi=0.7$: the inflation factor is
      $(1+0.7)/(1-0.7)=1.7/0.3\approx5.67$, so standard errors computed
      ignoring autocorrelation are too small by a factor of
      $\sqrt{5.67}\approx2.38$. With $n=1000$ raw observations,
      $n_{\text{eff}}=1000(0.3)/1.7\approx176$ — roughly a sixth of the
      apparent sample size.
    interview: >
      "Your backtest has $1000$ daily P&L observations with lag-1
      autocorrelation $0.3$ — how much does that change your confidence
      interval?" wants the factor $(1+0.3)/(1-0.3)=1.857$ computed live,
      standard errors about $1.36\times$ wider, and roughly $539$ effective
      observations instead of $1000$.
    pitfalls: >
      Running a standard significance test on autocorrelated P&L with the raw
      observation count, overstating confidence by exactly the factor derived
      here. Applying this specific $(1+\phi)/(1-\phi)$ multiplier to a series
      whose dependence isn't AR(1)-shaped — an MA(1) or a different structure
      inflates the variance of the mean by a different formula entirely.
    recap: >
      Positive serial correlation multiplies the variance of a sample mean
      by $(1+\phi)/(1-\phi)$ — $5.67\times$ at $\phi=0.7$ — so a naive
      $t$-statistic on an autocorrelated series is overconfident by the
      square root of that factor.
    steps:
      - teach: >
          Substituting $\rho_k=\phi^{k}$ into the general variance-of-a-mean
          formula and letting $n$ grow collapses the correction to
          $(1+\phi)/(1-\phi)$ — the factor by which autocorrelation inflates
          the naive iid variance $\gamma_0/n$.
      - teach: >
          Reading it as an effective sample size,
          $n_{\text{eff}}=n(1-\phi)/(1+\phi)$, makes the mechanism concrete:
          correlated observations are partially double-counted information, so
          $n$ autocorrelated points carry the actual information content of a
          much smaller iid sample.
      - ask: >
          $\phi=0.4$. What is the inflation factor $(1+\phi)/(1-\phi)$?
        expects: "2.3333"
        tolerance: 0.0005
        hint: >
          $1.4/0.6$.
        feedback: >
          $(1+0.4)/(1-0.4)=1.4/0.6\approx2.3333$ — standard errors computed
          ignoring this are too small by $\sqrt{2.3333}\approx1.5275$.
      - teach: >
          The practical trap is that a standard $t$-test or Sharpe-ratio
          calculation plugs in the raw $n$, understating the true standard
          error by the square root of that same factor.
      - ask: >
          With $n=900$ raw observations and $\phi=0.4$, what is
          $n_{\text{eff}}=n(1-\phi)/(1+\phi)$?
        expects: "385.7143"
        tolerance: 0.0005
        hint: >
          $900\times0.6/1.4$.
        feedback: >
          $n_{\text{eff}}=900(0.6)/1.4\approx385.7143$ — roughly two-fifths of
          the apparent sample size.
      - teach: >
          Positive $\phi$ always inflates the variance of the mean; negative
          $\phi$ does the opposite, since alternating signs partially cancel
          across neighboring terms rather than reinforcing each other.
      - ask: >
          A P&L series has lag-1 autocorrelation $\phi=-0.3$ instead of
          positive. How does that change the standard error of its sample mean
          relative to the iid formula?
        choices:
          - text: >
              It's still inflated, just by a smaller factor than positive
              $\phi$ would give.
            feedback: >
              Inflation is specifically a positive-$\phi$ phenomenon here —
              negative $\phi$ moves the correction in the opposite direction
              entirely.
          - text: >
              It's deflated — negative autocorrelation makes the sample mean's
              standard error smaller than the naive iid formula suggests.
            correct: true
            feedback: >
              Right — alternating signs partially cancel across neighboring
              observations, so $(1+\phi)/(1-\phi)<1$ when $\phi<0$, shrinking
              rather than inflating the variance.
          - text: >
              Autocorrelation only matters for standard errors when it's
              positive; negative $\phi$ has no effect.
            feedback: >
              Negative $\phi$ does have an effect — it's just a deflation
              rather than an inflation, not a null effect.
        feedback: >
          Negative $\phi$ shrinks the variance of the sample mean below the iid
          baseline instead of inflating it.
      - teach: >
          Positive serial correlation multiplies the variance of a sample mean
          by $(1+\phi)/(1-\phi)$, so a naive $t$-statistic on an autocorrelated
          series is overconfident by the square root of that factor.

  - node: quant-statistics.time-series.vol-clustering
    hook: >
      These four facts are what every real risk model and every "have you
      actually looked at market data" interview question are built on — and
      they split a return series into two very differently-behaved halves.
    explanation: >
      Run the sample-ACF machinery on the return level itself: for a liquid
      asset, $\hat\rho_1$ and its neighbors sit inside the
      $\pm2/\sqrt{n}$ noise band almost everywhere past the first
      microstructure lags. This is the return-level counterpart of
      differencing a unit-root price series to reach something close to
      $I(0)$ — and market efficiency independently reinforces it, since any
      exploitable linear predictability in the level would already have been
      traded away.

      Run the *same* sample-ACF machinery on $|r_t|$ or $r_t^{2}$ instead, and
      the picture reverses completely: these clear the noise band and stay
      visibly positive for lags stretching out to months. Squaring or taking
      absolute value throws away the sign of a move but keeps its size, so
      this is a genuinely separate fact from the first — a large move today,
      of either sign, makes another large move more likely tomorrow, which
      the mean-level ACF is structurally blind to since it only ever sees
      signed values. Heavy tails follow the same logic at a single point in
      time: daily kurtosis routinely exceeds the normal distribution's $3$,
      because a volatility-clustering series is really a mixture of calm and
      turbulent regimes, and mixtures of different-scale normals produce
      exactly this kind of excess kurtosis; aggregating to monthly averages
      over many days and thins the tails back toward normal by the same
      averaging logic that underlies the CLT. The leverage effect adds a
      final asymmetry: a negative return raises future volatility by more
      than an equal-sized positive one does.
    worked: >
      With $n=1000$, the noise band is $\pm1.96/\sqrt{1000}\approx\pm0.062$.
      A level return series with $\hat\rho_1=0.02$ sits comfortably inside it
      — indistinguishable from noise. The same data's squared-return series
      might show $\hat\rho_1=0.18$ and $\hat\rho_{20}=0.05$ — both clearing
      the same $\pm0.062$ band, the first by a wide margin and the second
      still detectably outside it twenty lags later.
    interview: >
      "What do real return series look like, statistically?" wants the four
      facts named crisply and in order: near-zero linear autocorrelation in
      the level, strongly persistent autocorrelation in $|r_t|$ or $r_t^{2}$
      (volatility clustering), fat tails relative to the normal, and the
      leverage effect.
    pitfalls: >
      Running only a level-return ACF, seeing nothing, and concluding "the
      market is fully unpredictable" — predictability lives in the second
      moment, invisible to that test. Quoting a kurtosis number without a
      stated frequency, since the same series looks far closer to normal
      monthly than daily. Treating "returns are nearly uncorrelated" as
      "returns are independent" — persistent autocorrelation in $r_t^{2}$
      is direct proof they aren't.
    recap: >
      The level of returns is close to white noise while their scale is
      strongly forecastable: uncorrelated returns, clustered volatility,
      fat tails, and a leverage asymmetry, all holding across liquid assets
      and frequencies.
    steps:
      - teach: >
          Run the sample-ACF machinery on the return level itself and, for a
          liquid asset, $\hat\rho_1$ and its neighbors sit inside the
          $\pm2/\sqrt{n}$ band almost everywhere past the first microstructure
          lags — market efficiency has already traded away any exploitable
          linear predictability in the level.
      - teach: >
          Run the same machinery on $|r_t|$ or $r_t^{2}$ instead and the
          picture reverses completely: these clear the noise band and stay
          visibly positive for lags stretching out to months, since squaring or
          taking absolute value throws away the sign of a move but keeps its
          size — volatility clustering.
      - ask: >
          With $n=625$ observations, what is the noise band $1.96/\sqrt{n}$?
        expects: "0.0784"
        tolerance: 0.0005
        hint: >
          $\sqrt{625}=25$.
        feedback: >
          $1.96/\sqrt{625}=1.96/25=0.0784$.
      - teach: >
          Heavy tails follow the same logic at a single point in time: daily
          kurtosis routinely exceeds the normal distribution's $3$, because a
          volatility-clustering series is really a mixture of calm and
          turbulent regimes, and aggregating to monthly averages over many days
          thins the tails back toward normal.
      - ask: >
          A level-return series shows $\hat\rho_1=0.03$, comfortably inside a
          $\pm0.0784$ band at $n=625$. The same data's squared returns show
          $\hat\rho_1=0.15$ and $\hat\rho_{20}=0.09$, both clearing that band.
          What's the right reading?
        choices:
          - text: >
              The market is fully unpredictable, since the level ACF found
              nothing.
            feedback: >
              That conclusion tests only the level; the squared-return series
              shows strong, persistent structure the level test is structurally
              blind to.
          - text: >
              Linear predictability in the level is essentially absent, but
              volatility is strongly and persistently forecastable — two
              separate facts, not a contradiction.
            correct: true
            feedback: >
              Right — this is exactly the split between level and scale that
              defines the stylized facts.
          - text: >
              The squared-return results must be a statistical artifact of the
              level ACF being near zero.
            feedback: >
              The two ACFs are computed on genuinely different quantities — a
              near-zero level ACF doesn't mechanically produce a large
              squared-return ACF, or vice versa.
        feedback: >
          A near-zero level ACF and a strongly positive squared-return ACF are
          two separate, simultaneously true facts about the same series.
      - teach: >
          The leverage effect adds a final asymmetry: a negative return raises
          future volatility by more than an equal-sized positive one does.
      - ask: >
          A colleague argues that since daily returns are nearly uncorrelated,
          they must also be independent. What's wrong with that claim?
        choices:
          - text: >
              Nothing — near-zero linear autocorrelation is the same thing as
              independence.
            feedback: >
              Zero linear correlation and independence are different claims;
              persistent autocorrelation in $r_t^{2}$ is direct proof the
              returns aren't independent even though they're nearly
              uncorrelated.
          - text: >
              Uncorrelated only rules out linear dependence, and the persistent
              autocorrelation in $r_t^{2}$ shows real, nonlinear dependence
              remains.
            correct: true
            feedback: >
              Right — this is the white-noise-versus-iid gap from earlier in
              the unit, showing up concretely in real return data.
          - text: >
              It's wrong only for monthly data, not daily data.
            feedback: >
              The gap between uncorrelated and independent holds at any
              frequency where volatility clustering is present — it isn't
              specific to one sampling frequency.
        feedback: >
          Uncorrelated rules out linear dependence only; persistent $r_t^{2}$
          autocorrelation is proof that nonlinear dependence remains.
      - teach: >
          The level of returns is close to white noise while their scale is
          strongly forecastable: uncorrelated returns, clustered volatility,
          fat tails, and a leverage asymmetry, holding across liquid assets and
          frequencies.

  - node: quant-statistics.time-series.level-versus-scale
    hook: >
      "Why do volatility models make money while directional models mostly
      don't?" is asked almost verbatim, and the answer is this node's whole
      content in two sentences.
    explanation: >
      Combine the two facts already in hand. A one-step AR(1) forecast
      explains a fraction $\phi^{2}$ of variance, and market efficiency keeps
      realistic level-autocorrelation in returns tiny — something like
      $\phi=0.02$, explaining $\phi^{2}=0.0004$, a fraction of a percent of
      variance, arbitraged down to near nothing precisely because a
      directional edge is trivial to trade against directly: buy or sell,
      done. Nothing in that argument touches volatility. Knowing tomorrow's
      variance will be high doesn't hand you a directional bet the way
      knowing tomorrow's mean would — capturing it requires a genuinely
      different instrument, like an option or a realized-versus-implied
      structure, not a simple long or short. The efficient-markets force that
      erases level-autocorrelation has no direct analogue acting on
      scale-autocorrelation, so it survives instead.

      That asymmetry is the actual content behind "volatility is predictable"
      — not a mysterious exception to market efficiency, but a consequence of
      which quantity is easy to trade against directly. It's also the reason
      the whole ARCH/GARCH literature exists and is pointed specifically at
      the conditional variance rather than the conditional mean.
    worked: >
      A level signal with $\phi=0.05$ explains $\phi^{2}=0.0025$: a quarter
      of a percent of return variance, thin even before costs. A realistic
      volatility-persistence coefficient $\phi_{\text{vol}}=0.95$ explains
      $\phi_{\text{vol}}^{2}=0.9025$: over 90% of next-period variance — the
      same-shaped number, $\phi^2$, attached to wildly different outcomes
      depending on which of the two problems it belongs to.
    interview: >
      "Why can vol models make money while pure directional models mostly
      don't?" wants: efficient markets erase linear predictability in the
      mean because a directional edge is trivially tradeable away, but
      predictable variance survives because you can't convert "I know
      volatility will be high" into a simple directional bet — the entire
      justification for the ARCH/GARCH family.
    pitfalls: >
      Treating a small but statistically significant level-autocorrelation
      as automatically tradeable — check $\phi^{2}$, the actual fraction of
      variance it buys, before believing it matters economically. Assuming
      the "efficient markets erase this" argument also applies to volatility
      forecasting — it's specifically an argument about the conditional mean
      and doesn't transfer to the conditional variance.
    recap: >
      Efficient markets erase predictability in the level of returns but
      leave it in their scale, because a directional edge trades away
      trivially while a variance forecast doesn't — the reason vol models
      work and directional signals are hard.
    steps:
      - teach: >
          A one-step AR(1) forecast explains a fraction $\phi^{2}$ of variance,
          and realistic level-autocorrelation in returns is tiny because any
          exploitable linear edge is trivial to trade against directly — buy or
          sell, done — which is exactly what efficient markets arbitrage away.
      - teach: >
          Nothing in that argument touches volatility: knowing tomorrow's
          variance will be high doesn't hand you a directional bet the way
          knowing tomorrow's mean would, so capturing it needs a genuinely
          different instrument, like an option or a realized-versus-implied
          structure.
      - ask: >
          A level signal has $\phi=0.08$. What fraction of return variance does
          its one-step forecast explain, $\phi^{2}$?
        expects: "0.0064"
        tolerance: 0.0005
        hint: >
          Square it.
        feedback: >
          $0.08^{2}=0.0064$ — well under a percent of variance, thin even
          before any trading cost is considered.
      - teach: >
          A realistic volatility-persistence coefficient is far larger, because
          the efficient-markets force that erases level-autocorrelation has no
          direct analogue acting on scale-autocorrelation, so it survives
          instead.
      - ask: >
          A volatility-persistence coefficient is $\phi_{\text{vol}}=0.85$.
          What fraction of next-period variance does $\phi_{\text{vol}}^{2}$
          explain?
        expects: "0.7225"
        tolerance: 0.0005
        hint: >
          Square it, same as before.
        feedback: >
          $0.85^{2}=0.7225$ — over $70\%$ of next-period variance, the
          same-shaped $\phi^{2}$ calculation attached to a wildly different
          outcome than the level case.
      - teach: >
          That asymmetry is the actual content behind 'volatility is
          predictable' — not a mysterious exception to market efficiency, but a
          consequence of which quantity is easy to trade against directly.
      - ask: >
          A level-autocorrelation of $\phi=0.06$ clears statistical
          significance in a large sample. Should you treat it as tradeable?
        choices:
          - text: >
              Yes — statistical significance is the bar that matters for
              tradeability.
            feedback: >
              Significance only establishes $\phi\ne0$ reliably; the fraction
              of variance it buys, $\phi^{2}=0.0036$, is the number that
              determines whether it's economically worth anything.
          - text: >
              Only after checking $\phi^{2}=0.0036$ — a little over a third of
              a percent of variance, thin even before costs.
            correct: true
            feedback: >
              Right — this is the same $\phi$ versus $\phi^{2}$ gap from
              earlier in the unit, applied to the specific case of level
              predictability.
          - text: >
              Yes, because any nonzero $\phi$ implies a violation of market
              efficiency worth exploiting.
            feedback: >
              A nonzero but tiny $\phi$ is consistent with markets being
              efficient up to the residual noise that's too costly to trade
              away — it doesn't automatically imply an exploitable violation.
        feedback: >
          Even a statistically real level-autocorrelation has to clear the
          $\phi^{2}$ bar before it means anything economically.
      - teach: >
          Efficient markets erase predictability in the level of returns but
          leave it in their scale, because a directional edge trades away
          trivially while a variance forecast doesn't — the reason vol models
          work and directional signals are hard.
