# The quant-interview program (§6.6): content-quant/outline.md's authoring order
# §1–§58 made machine-readable. Units are subbranches, in teaching order; parts
# are the outline's chapter groupings. The validator holds this order to a linear
# extension of cross-unit `requires` — which it is by construction, because the
# corpus's spine contract only ever let a file reference earlier-ordered spines.
#
# Note quant-tools.recurrences (§13) sits mid-probability on purpose: first-step
# analysis is taught the moment conditioning exists to power it, not with the
# other tools. Parts group the *teaching* order, not the taxonomy.

parts:
  - title: "Mathematical Tools"
    units:
      - quant-tools.series-calculus
      - quant-tools.linear-algebra
      - quant-tools.optimization

  - title: "Probability"
    units:
      - quant-probability.foundations
      - quant-probability.counting
      - quant-probability.conditional
      - quant-probability.random-variables
      - quant-probability.expectation
      - quant-probability.discrete
      - quant-probability.continuous
      - quant-probability.joint
      - quant-probability.conditioning
      - quant-tools.recurrences
      - quant-probability.mgf
      - quant-probability.inequalities
      - quant-probability.limits
      - quant-probability.geometric

  - title: "Stochastic Processes"
    units:
      - quant-processes.random-walks
      - quant-processes.ruin
      - quant-processes.markov-chains
      - quant-processes.martingales
      - quant-processes.stopping
      - quant-processes.poisson
      - quant-processes.brownian
      - quant-processes.ito

  - title: "Statistics & Data"
    units:
      - quant-statistics.descriptive
      - quant-statistics.estimation
      - quant-statistics.testing
      - quant-statistics.regression
      - quant-statistics.bayesian
      - quant-statistics.time-series
      - quant-statistics.simulation
      - quant-statistics.learning

  - title: "Mental Math & Estimation"
    units:
      - quant-mental.arithmetic
      - quant-mental.approximation
      - quant-mental.fermi
      - quant-mental.game-tactics

  - title: "Betting, Games & Market Making"
    units:
      - quant-games.ev-games
      - quant-games.kelly
      - quant-games.game-theory
      - quant-games.auctions
      - quant-games.betting-markets
      - quant-games.market-making-game

  - title: "Finance & Markets"
    units:
      - quant-finance.instruments
      - quant-finance.arbitrage
      - quant-finance.options
      - quant-finance.greeks
      - quant-finance.portfolio
