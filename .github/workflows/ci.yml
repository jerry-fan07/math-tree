name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Validate content
        run: swift run ContentBuild validate

      - name: Validator rejects broken content
        run: Scripts/check-broken-content.sh

      # Advisory (§7.1: atomicity "can't be fully automated"), so it does not gate
      # the build — but the hints have to be *seen*, and a corpus this size is no
      # longer read end to end by anyone. `--baseline` is deliberately absent here:
      # CI reports the standing hints for the whole corpus; a reviewer scopes to a
      # change locally with `--baseline build/content/graph.json`.
      - name: Authoring lint
        run: swift run ContentBuild lint

      # §8.2's boundary, exercised without Shifu: the canned stream must still
      # parse against the shipping corpus, and the rejection cases must still be
      # rejected. Uses its own throwaway log, never the developer's.
      - name: Shifu intake replay
        run: swift run ContentBuild shifu-sim --intake "$RUNNER_TEMP/intake" --log "$RUNNER_TEMP/shifu.jsonl"

      - name: Build app bundle
        run: Scripts/bundle-app.sh release

      - name: App launch smoke test
        run: build/MathTree.app/Contents/MacOS/MathTree --smoke-test

      # The corpus review instrument (D4.9/D8.7): renders every LaTeX-bearing
      # field of the content *and* the problem bank and exits non-zero on an
      # unconsumed macro, an unbalanced $, or an empty rendering. Debug-only, and
      # it reads the artifacts the bundle step just built.
      - name: Math rendering self-check
        run: MATHTREE_MATH_CHECK=1 swift run MathTree
