name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Validate content
        run: swift run ContentBuild validate

      - name: Validator rejects broken content
        run: Scripts/check-broken-content.sh

      - name: Build app bundle
        run: Scripts/bundle-app.sh release

      - name: App launch smoke test
        run: build/MathTree.app/Contents/MacOS/MathTree --smoke-test
