# algebra.groups — Group Theory
# The group axioms and their immediate consequences, the standard examples
# (integers, integers mod n, units mod n, symmetric, dihedral, general linear),
# subgroups, orders, cyclic groups, cosets and Lagrange's theorem, normality
# and quotients, homomorphisms, the first isomorphism theorem, direct products.

nodes:
  - id: algebra.groups
    kind: subbranch
    title: "Group Theory"
    summary: >
      Groups, subgroups, cosets and Lagrange's theorem, normality and quotient
      groups, homomorphisms and the isomorphism theorems.
    parent: algebra
    also_under: []
    tags: []

  - id: algebra.groups.def-binary-operation
    kind: definition
    prominence: 1
    title: "Binary operation"
    statement: >
      A binary operation on a set $G$ is a function $* : G \times G \to G$; the
      value at $(a,b)$ is written $a * b$, or simply $ab$ when the operation is
      understood. Because the codomain is $G$ itself, closure is part of the
      definition rather than a separate axiom — subtraction is not a binary
      operation on $\mathbb{N}$, since $2 - 5$ leaves the set. The operation is
      associative if $(ab)c = a(bc)$ for all $a,b,c \in G$, and commutative if
      $ab = ba$ for all $a,b \in G$. An element $e \in G$ is an identity for
      $*$ if $ea = ae = a$ for every $a \in G$; given such an $e$, an element
      $b$ is an inverse of $a$ if $ab = ba = e$. Associativity is what makes a
      product of several elements independent of how it is bracketed, so that
      $a_1 a_2 \cdots a_n$ may be written without brackets at all; nothing
      later in the subject is meaningful without it. Composition of functions
      is associative and not commutative, addition on $\mathbb{Z}$ is both, and
      subtraction on $\mathbb{Z}$ is neither.
    summary: >
      A rule for combining two elements of a set into a third element of the
      same set, together with the three properties out of which the group
      axioms are assembled.
    parent: algebra.groups
    also_under: []
    requires:
      - foundations.functions.def-function
    relates: []
    tags: []

  - id: algebra.groups.def-group
    kind: definition
    prominence: 2
    title: "Group"
    statement: >
      A group is a set $G$ — necessarily nonempty — together with a binary
      operation on $G$ satisfying three axioms. (G1) Associativity:
      $(ab)c = a(bc)$ for all $a,b,c \in G$. (G2) Identity: there exists
      $e \in G$ with $ea = ae = a$ for every $a \in G$. (G3) Inverses: for
      every $a \in G$ there exists $b \in G$ with $ab = ba = e$. Closure is
      already carried by the word operation, and the order of the quantifiers
      matters: one identity serves the whole group, whereas in (G3) the inverse
      is produced only after $a$ has been given. Notation is multiplicative
      ($ab$, identity $e$ or $1$, inverse $a^{-1}$) unless the group is
      commutative and additive notation ($a + b$, identity $0$, inverse $-a$)
      is more natural; the two are notational variants of one definition.
      Integer powers are defined by $a^0 = e$, $a^{n+1} = a^n a$ and
      $a^{-n} = (a^{-1})^n$, and satisfy $a^{m+n} = a^m a^n$ and
      $(a^m)^n = a^{mn}$ for all integers $m$ and $n$.
    summary: >
      A set with one associative way of combining elements, a neutral element,
      and an undo for every element. It is the minimal setting in which
      symmetry and reversible processes can be studied at all.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-binary-operation
    relates: []
    tags: []

  - id: algebra.groups.def-abelian
    kind: definition
    prominence: 1
    title: "Abelian group"
    statement: >
      A group $G$ is abelian, or commutative, if $ab = ba$ for all
      $a,b \in G$. Abelian groups are commonly written additively. The
      condition is a genuine restriction and not a convenience: in an abelian
      group $(ab)^n = a^n b^n$ for every integer $n$, and the whole apparatus
      of normal subgroups and quotients is needed only because most groups
      fail it. Every group with at most five elements is
      abelian, and the smallest non-abelian group has six elements; the
      symmetries of a polygon and the invertible matrices are non-abelian.
    summary: >
      A group whose operation does not care about order. The abelian groups
      are the well-behaved minority, and almost every subtlety in group theory
      comes from the failure of commutativity.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-group
    relates: []
    tags: []

  - id: algebra.groups.uniqueness-identity-inverse
    kind: proposition
    prominence: 0
    title: "Uniqueness of the identity and of inverses"
    statement: >
      Let $G$ be a group. (i) The identity is unique: if $e$ and $e'$ both
      satisfy (G2) then $e = ee' = e'$. (ii) Inverses are unique: if $b$ and
      $c$ are both inverses of $a$ then
      $b = be = b(ac) = (ba)c = ec = c$, so the notation $a^{-1}$ names a
      single element. (iii) Cancellation: $ab = ac$ implies $b = c$, and
      $ba = ca$ implies $b = c$, on multiplying by $a^{-1}$ on the appropriate
      side. (iv) $(a^{-1})^{-1} = a$, and $(ab)^{-1} = b^{-1}a^{-1}$ with the
      order reversed, since
      $(ab)(b^{-1}a^{-1}) = a(bb^{-1})a^{-1} = aa^{-1} = e$. Consequently the
      equation $ax = b$ has the unique solution $x = a^{-1}b$, and in the
      multiplication table of a finite group every element appears exactly once
      in each row and once in each column. Note that (ii) uses associativity —
      without it inverses really can fail to be unique.
    summary: >
      The axioms only assert that an identity and inverses exist; these
      arguments show there is no choice about them, which is what licenses the
      symbols $e$ and $a^{-1}$ and the cancellation everyone uses without
      comment.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-group
    relates: []
    tags: []

  - id: algebra.groups.def-group-order
    kind: definition
    prominence: 1
    title: "Order of a group"
    statement: >
      The order of a group $G$, written $|G|$, is the number of elements of
      $G$; the group is called finite when that number is finite and infinite
      otherwise. The group of order $1$, consisting of the identity alone, is
      called trivial. The order records the size of the underlying set and
      nothing whatever about the operation, so by itself it is the crudest
      invariant a group carries — there are two essentially different groups
      of order $4$ — yet it is the quantity almost every counting argument in
      the subject is about, because the divisors of $|G|$ turn out to control
      what can sit inside a finite group.
    summary: >
      How many elements a group has. It is the first thing one asks about a
      finite group, and the number that Lagrange's theorem converts into a
      constraint on everything the group contains.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-group
    relates: []
    tags: []

  - id: algebra.groups.def-element-order
    kind: definition
    prominence: 1
    title: "Order of an element"
    statement: >
      The order of an element $g$ of a group $G$, written $|g|$ or
      $\operatorname{ord}(g)$, is the least positive integer $n$ with
      $g^n = e$; the positive integers $n$ satisfying $g^n = e$ form a set of
      natural numbers, so when that set is nonempty the well-ordering principle
      supplies a least member, and when it is empty $g$ is said to have
      infinite order. Only the identity has order $1$. If $|g| = n$ is finite
      then $g^k = e$ if and only if $n \mid k$, since dividing $k$ by $n$ with
      remainder and using minimality forces the remainder to vanish; and
      $g^{-1} = g^{n-1}$. In $(\mathbb{Z},+)$ every element other than $0$ has
      infinite order, whereas in a finite group every element has finite order:
      the powers $g, g^2, g^3, \ldots$ cannot all be distinct, and $g^i = g^j$
      with $i < j$ gives $g^{j-i} = e$. The same word, and the same bars, serve
      for the order of a group and for the order of an element; which is meant
      is settled by what stands between the bars.
    summary: >
      How many times an element must be combined with itself before it comes
      back to the identity, or infinity if it never does. It is the finest
      invariant carried by a single element, and the one Lagrange's theorem
      constrains.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-group-order
      - foundations.induction.well-ordering
      - number-theory.divisibility.def-divisibility
    relates: []
    tags: []

  - id: algebra.groups.ex-standard-examples
    kind: example
    prominence: 1
    title: "Standard examples of groups"
    statement: >
      The additive groups $(\mathbb{Z},+)$, $(\mathbb{Q},+)$,
      $(\mathbb{R},+)$ and $(\mathbb{C},+)$ are abelian, with identity $0$ and
      inverse $-a$. Deleting $0$ gives the abelian multiplicative groups
      $(\mathbb{Q}^{\times},\cdot)$, $(\mathbb{R}^{\times},\cdot)$ and
      $(\mathbb{C}^{\times},\cdot)$; $\mathbb{R}$ itself is not a group under
      multiplication, because $0$ has no inverse. The general linear group
      $\operatorname{GL}_n(\mathbb{R})$ of invertible $n \times n$ real
      matrices under matrix multiplication is a group — matrix multiplication
      is associative, the identity matrix is the identity, and invertibility is
      exactly the existence of inverses — and it is non-abelian for
      $n \ge 2$, the standard infinite non-abelian example. Since the
      determinant is multiplicative, the matrices of determinant $1$ are closed
      under products and inverses and form the special linear group
      $\operatorname{SL}_n(\mathbb{R})$. The near-misses are as instructive as
      the examples: in $(\mathbb{N},+)$ the identity $0$ is the only element
      that has an inverse, $(\mathbb{Z},\cdot)$ has an identity but only
      $\pm 1$ are invertible, and subtraction on $\mathbb{Z}$ is not even
      associative.
    summary: >
      The stock of groups against which every later statement is tested —
      numbers under addition, nonzero numbers under multiplication, invertible
      matrices — together with the failures that show which axiom does the
      work.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-abelian
    relates: []
    tags: []

  - id: algebra.groups.ex-integers-mod-n
    kind: example
    prominence: 1
    title: "The additive group of integers modulo n"
    statement: >
      Fix $n \ge 1$. The residue classes modulo $n$ form a set
      $\mathbb{Z}/n\mathbb{Z}$ with exactly $n$ elements
      $[0], [1], \ldots, [n-1]$, and the well-defined rule
      $[a] + [b] = [a+b]$ makes it an abelian group of order $n$:
      associativity and commutativity are inherited from $\mathbb{Z}$, the
      identity is $[0]$, and the inverse of $[a]$ is $[-a] = [n-a]$. The order
      of the element $[a]$ is $n/\gcd(a,n)$; in particular $[1]$ has order $n$,
      and every class is a sum of copies of $[1]$. Concretely
      $\mathbb{Z}/12\mathbb{Z}$ is clock arithmetic, in which
      $[9] + [5] = [2]$. The same set also carries a multiplication, but for
      $n \ge 2$ that operation does not make it a group: $[0]$ has no
      multiplicative inverse, and neither does any class $[a]$ with
      $\gcd(a,n) > 1$.
    summary: >
      Clock arithmetic seen as a group: add integers, then forget everything
      except the remainder on division by $n$.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-abelian
      - algebra.groups.def-element-order
      - foundations.relations.ex-integers-mod-n
      - number-theory.divisibility.def-gcd
    relates: []
    tags: []

  - id: algebra.groups.ex-units-mod-n
    kind: example
    prominence: 0
    title: "The group of units modulo n"
    statement: >
      For $n \ge 1$ let $(\mathbb{Z}/n\mathbb{Z})^{\times}$ be the set of
      classes $[a]$ with $\gcd(a,n) = 1$ — a condition depending only on the
      class and not on the representative, since $a$ and $a + kn$ have the same
      greatest common divisor with $n$. Multiplication $[a][b] = [ab]$ makes
      this an abelian group, the group of units modulo $n$: it is closed
      because $\gcd(ab,n) = 1$ whenever $\gcd(a,n) = \gcd(b,n) = 1$, the
      identity is $[1]$, and $[a]$ has an inverse because $\gcd(a,n) = 1$
      supplies integers $x,y$ with $ax + ny = 1$, whence $[a][x] = [1]$. Its
      order is $\varphi(n)$, the number of integers in
      $\{1, 2, \ldots, n\}$ coprime to $n$, so for $p$ prime
      $(\mathbb{Z}/p\mathbb{Z})^{\times}$ has order $p - 1$. The remaining
      classes must be excluded: $[2]$ has no multiplicative inverse modulo $4$.
      For $n = 8$ the group is $\{[1],[3],[5],[7]\}$, in which every element
      squares to $[1]$.
    summary: >
      The residue classes that can be divided by, under multiplication.
      Coprimality to $n$ is the entry condition, and Bézout's identity is
      exactly what supplies the inverses.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.ex-integers-mod-n
      - number-theory.divisibility.coprime-divides
    relates: []
    tags: []

  - id: algebra.groups.def-subgroup
    kind: definition
    prominence: 1
    title: "Subgroup"
    statement: >
      A subset $H \subseteq G$ is a subgroup of the group $G$, written
      $H \le G$, if $H$ is itself a group under the operation of $G$ restricted
      to $H$. Spelled out, this asks three things: $H$ is closed under the
      operation, $H$ contains the identity of $G$, and $H$ contains the inverse
      of each of its elements. Associativity is automatic, being inherited from
      $G$, and there is no ambiguity in the structure: the identity of $H$ must
      be the identity of $G$, and the inverse of $h$ taken in $H$ is its
      inverse taken in $G$. Every group has the trivial subgroup $\{e\}$ and
      the whole group $G$; a subgroup other than $G$ is called proper.
      Examples: $n\mathbb{Z} \le (\mathbb{Z},+)$ for each $n \ge 0$, and the
      centre $Z(G) = \{z \in G : zg = gz \text{ for all } g \in G\}$, which is
      the whole group exactly when $G$ is commutative. Containment of
      subgroups is transitive: $K \le H$ and $H \le G$ give $K \le G$.
    summary: >
      A subset that is a group in its own right under the same operation.
      Groups are almost always understood through the subgroups sitting inside
      them.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-group
    relates: []
    tags: []

  - id: algebra.groups.subgroup-criterion
    kind: proposition
    prominence: 1
    title: "Subgroup criterion"
    statement: >
      Let $G$ be a group and $H \subseteq G$. Then $H \le G$ if and only if
      $H \ne \emptyset$ and $ab^{-1} \in H$ for all $a,b \in H$. Proof:
      necessity is immediate. Conversely, choose $h \in H$; then
      $e = hh^{-1} \in H$, so $b^{-1} = eb^{-1} \in H$ for every $b \in H$, and
      therefore $ab = a(b^{-1})^{-1} \in H$ for all $a,b \in H$.
      Nonemptiness cannot be dropped, since the empty set satisfies the closure
      condition vacuously and is not a group. In additive notation the
      condition reads $a - b \in H$. If $H$ is finite and nonempty, closure
      under the operation alone suffices: for $a \in H$ the map $x \mapsto ax$
      sends $H$ into $H$ and is injective by cancellation, hence surjective
      because $H$ is finite, so $ax = a$ for some $x \in H$, forcing
      $x = e \in H$, and $ay = e$ for some $y \in H$, forcing
      $y = a^{-1} \in H$. Finiteness is essential here: the positive integers
      are a nonempty subset of $(\mathbb{Z},+)$ closed under addition and are
      not a subgroup.
    summary: >
      One condition replaces three. Testing a subset for subgroup-hood never
      requires checking associativity, and closure under "divide" alone does
      the work of closure under both product and inverse.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-subgroup
      - algebra.groups.uniqueness-identity-inverse
      - foundations.functions.finite-inj-surj-equiv
    relates: []
    tags: []

  - id: algebra.groups.def-symmetric-group
    kind: definition
    prominence: 1
    title: "Symmetric group"
    statement: >
      For a set $X$, the symmetric group $\operatorname{Sym}(X)$ is the set of
      all bijections $X \to X$ under composition. It is a group: a composite of
      bijections is a bijection, composition of functions is associative,
      $\mathrm{id}_X$ is a two-sided identity, and a bijection has a two-sided
      inverse which is again a bijection. When $X = \{1,2,\ldots,n\}$ this
      group is written $S_n$ and its elements are called permutations of $n$
      letters. Its order is $|S_n| = n!$, since a permutation may send $1$ to
      any of $n$ values, then $2$ to any of the $n-1$ values left, and so on.
      $S_n$ is non-abelian for $n \ge 3$: reading products right to left as
      composition of functions, the swap of $1$ and $2$ followed by the swap of
      $2$ and $3$ sends $1$ to $3$, while performing them in the other order
      sends $1$ to $2$. The symmetric groups are the source of most small
      non-abelian examples, and $\operatorname{Sym}(X)$ is where every concrete
      notion of "symmetry of $X$" ultimately lives.
    summary: >
      All the ways of rearranging a set, composed one after another. This is
      symmetry in its purest form, and the finite symmetric groups $S_n$ are
      the standard non-commutative examples.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-abelian
      - algebra.groups.def-group-order
      - foundations.functions.composition-inj-surj
      - foundations.functions.inverse-iff-bijection
    relates: []
    tags: []

  - id: algebra.groups.cycle-notation
    kind: technique
    prominence: 1
    title: "Cycle notation and disjoint cycle decomposition"
    statement: >
      The cycle $(a_1\,a_2\,\ldots\,a_k)$ denotes the permutation sending
      $a_1 \mapsto a_2$, $a_2 \mapsto a_3$, and so on to
      $a_k \mapsto a_1$, and fixing every other point; it is called a
      $k$-cycle, and a $2$-cycle is a transposition. Two cycles are disjoint
      when the sets of points they move are disjoint, and disjoint cycles
      commute. Every permutation of a finite set is a product of disjoint
      cycles, and the decomposition is unique up to the order of the factors
      and the omission of fixed points. To compute it: start at any point,
      follow it under repeated application of the permutation until it returns,
      close that cycle, and begin again at a point not yet used. The order of a
      permutation is the least common multiple of the lengths of the cycles in
      its decomposition, because disjoint cycles commute and a $k$-cycle has
      order $k$; so $(1\,2\,3)(4\,5)$ in $S_5$ has order
      $\lcm(3,2) = 6$. Two conventions must be fixed before computing:
      products are read right to left here, as composition of functions, and
      fixed points are not written.
    summary: >
      Every permutation is a collection of independent cyclic shuffles. Writing
      it that way makes its order and its parity readable at a glance, where
      the table of values shows neither.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-symmetric-group
      - algebra.groups.def-element-order
      - number-theory.divisibility.def-lcm
    relates: []
    tags: []

  - id: algebra.groups.sign-of-permutation
    kind: theorem
    prominence: 1
    title: "Sign of a permutation"
    statement: >
      Let $n \ge 2$. Every permutation in $S_n$ is a product of transpositions:
      a $k$-cycle satisfies
      $(a_1\,a_2\,\ldots\,a_k) = (a_1\,a_k)(a_1\,a_{k-1})\cdots(a_1\,a_2)$, so
      $k-1$ transpositions suffice for it, and disjoint cycle decomposition
      handles the general case. The number of transpositions used is not
      determined, but its parity is: no permutation is both a product of an
      even number and a product of an odd number of transpositions. One proof
      applies a permutation to the variables of the polynomial
      $\prod_{i<j}(x_i - x_j)$, which changes sign under every transposition,
      so a product of $m$ transpositions multiplies it by $(-1)^m$ and $m$ is
      forced to have a fixed parity. A permutation is accordingly called even
      or odd, with sign $\sgn(\sigma) = +1$ or $-1$. The sign is multiplicative,
      $\sgn(\sigma\tau) = \sgn(\sigma)\sgn(\tau)$, and a $k$-cycle has sign
      $(-1)^{k-1}$, so a permutation is even exactly when its decomposition
      contains an even number of cycles of even length. The even permutations
      form a subgroup of $S_n$, the alternating group $A_n$, of order $n!/2$ —
      multiplying by a fixed transposition is a bijection between the even and
      the odd permutations, so the two halves have equal size.
    summary: >
      Permutations can be built out of simple swaps in many ways, but always
      with the same parity. That two-valued invariant is where the signs in the
      determinant come from, and it splits each symmetric group in half.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.cycle-notation
      - algebra.groups.def-subgroup
    relates: []
    tags: []

  - id: algebra.groups.def-dihedral
    kind: definition
    prominence: 1
    title: "Dihedral group"
    statement: >
      For $n \ge 3$ the dihedral group $D_n$ is the group of symmetries of a
      regular $n$-gon under composition: the $n$ rotations through multiples of
      $2\pi/n$ about the centre, and the $n$ reflections in the axes of
      symmetry, so that $|D_n| = 2n$. Write $r$ for the rotation through
      $2\pi/n$ and $s$ for any one of the reflections. Then every element is
      uniquely of the form $r^i s^j$ with $0 \le i < n$ and $j \in \{0,1\}$,
      and the multiplication is determined by the relations $r^n = e$,
      $s^2 = e$ and $srs^{-1} = r^{-1}$, the last of which says that
      conjugating a rotation by a reflection reverses its direction. Hence
      $|r| = n$, every reflection has order $2$, and $D_n$ is non-abelian
      because $rs \ne sr$. Beware that some texts write $D_{2n}$ for this same
      group, indexing by its order rather than by the number of sides.
    summary: >
      The rotations and flips of a regular polygon. These are the smallest
      family of non-abelian groups and the usual testing ground for normality
      and quotients.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-abelian
      - algebra.groups.def-element-order
    relates: []
    tags: []

  - id: algebra.groups.def-generated-subgroup
    kind: definition
    prominence: 0
    title: "Subgroup generated by a subset"
    statement: >
      Let $G$ be a group and $S \subseteq G$. The intersection of any family of
      subgroups of $G$ is again a subgroup, so there is a smallest subgroup of
      $G$ containing $S$: the subgroup generated by $S$, written
      $\langle S \rangle$ and equal to the intersection of all subgroups of $G$
      that contain $S$. Concretely, $\langle S \rangle$ consists of $e$
      together with all finite products
      $s_1^{\varepsilon_1} s_2^{\varepsilon_2}\cdots s_m^{\varepsilon_m}$ with
      each $s_i \in S$ and each exponent
      $\varepsilon_i = \pm 1$; that set is closed under products and inverses,
      so it is a subgroup, and it is contained in every subgroup containing
      $S$. One says $S$ generates $G$ when $\langle S \rangle = G$, and the
      elements of $S$ are then generators. Generating sets are neither unique
      nor necessarily minimal —
      $\mathbb{Z} = \langle 1 \rangle = \langle 2, 3 \rangle$ — and a small
      generating set is a compact description of a possibly enormous group.
    summary: >
      Everything you are forced to include once you have decided to include a
      given set of elements: the smallest subgroup containing them.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-subgroup
    relates: []
    tags: []

  - id: algebra.groups.def-cyclic
    kind: definition
    prominence: 1
    title: "Cyclic group"
    statement: >
      A group $G$ is cyclic if $G = \langle g \rangle$ for some $g \in G$,
      which is then called a generator of $G$. Explicitly
      $\langle g \rangle = \{g^k : k \in \mathbb{Z}\}$, the set of all integer
      powers of $g$. Every cyclic group is abelian, since
      $g^i g^j = g^{i+j} = g^j g^i$; the converse fails, as $(\mathbb{Q},+)$ is
      abelian but generated by no single element. If $g$ has infinite order the
      powers $g^k$ are pairwise distinct and $\langle g \rangle$ is infinite;
      if $|g| = n$ is finite then
      $\langle g \rangle = \{e, g, g^2, \ldots, g^{n-1}\}$ has exactly $n$
      elements, so $|\langle g \rangle| = |g|$ and the two uses of the word
      order agree. Generators are rarely unique — always
      $\langle g \rangle = \langle g^{-1} \rangle$ — and
      $(\mathbb{Z},+) = \langle 1 \rangle$ while
      $\mathbb{Z}/n\mathbb{Z} = \langle [1] \rangle$.
    summary: >
      A group swept out by the powers of a single element. These are the
      simplest groups there are, and the shape that every group of prime order
      is forced into.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-generated-subgroup
      - algebra.groups.def-element-order
      - algebra.groups.def-abelian
    relates: []
    tags: []

  - id: algebra.groups.def-homomorphism
    kind: definition
    prominence: 1
    title: "Group homomorphism"
    statement: >
      A homomorphism from a group $G$ to a group $H$ is a function
      $\varphi : G \to H$ satisfying $\varphi(ab) = \varphi(a)\varphi(b)$ for
      all $a,b \in G$, the product on the left being taken in $G$ and the one
      on the right in $H$. Everything else is then forced rather than assumed:
      $\varphi(e_G) = e_H$, because
      $\varphi(e_G)\varphi(e_G) = \varphi(e_G e_G) = \varphi(e_G)$ and
      multiplying by $\varphi(e_G)^{-1}$ leaves $\varphi(e_G) = e_H$; then
      $\varphi(a^{-1}) = \varphi(a)^{-1}$, since
      $\varphi(a)\varphi(a^{-1}) = \varphi(e_G) = e_H$; and
      $\varphi(a^k) = \varphi(a)^k$ for every integer $k$. A composite of
      homomorphisms is a homomorphism. Standard examples: reduction
      $\mathbb{Z}\to\mathbb{Z}/n\mathbb{Z}$ sending $a$ to $[a]$; the
      determinant
      $\operatorname{GL}_n(\mathbb{R})\to\mathbb{R}^{\times}$; the sign
      $S_n \to \{+1,-1\}$; the exponential
      $(\mathbb{R},+)\to(\mathbb{R}^{\times},\cdot)$ sending $x$ to
      $\exp(x)$, which turns addition into multiplication; and for any $G$ and
      $H$ the trivial homomorphism sending everything to $e_H$.
    summary: >
      A map between groups that respects their operations, so that combining
      first and mapping afterwards gives the same answer as mapping first and
      combining afterwards.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-group
    relates: []
    tags: []

  - id: algebra.groups.def-isomorphism
    kind: definition
    prominence: 1
    title: "Isomorphism of groups"
    statement: >
      An isomorphism is a bijective homomorphism $\varphi : G \to H$, and $G$
      and $H$ are isomorphic, written $G \cong H$, when one exists. The inverse
      of an isomorphism is automatically a homomorphism: applying $\varphi$ to
      $\varphi^{-1}(x)\varphi^{-1}(y)$ gives $xy$, so
      $\varphi^{-1}(xy) = \varphi^{-1}(x)\varphi^{-1}(y)$. Hence $\cong$ is
      reflexive, symmetric and transitive. Isomorphic groups are the same group
      with its elements renamed: every property expressible in terms of the
      operation alone transfers across, so isomorphic groups have the same
      order, the same number of elements of each order, matching lattices of
      subgroups, and one has a commutative operation exactly when the other
      does. This is also how one proves that two groups are not isomorphic —
      exhibit such a property that differs. For instance $x \mapsto \exp(x)$ is
      an isomorphism from $(\mathbb{R},+)$ onto the group of positive reals
      under multiplication, whereas
      $(\mathbb{Q},+)\ncong(\mathbb{Q}^{\times},\cdot)$, since in the second
      group $-1$ has order $2$ and in the first no element other than the
      identity has finite order. An isomorphism from $G$ to itself is called an
      automorphism.
    summary: >
      A renaming of elements that preserves the operation exactly. Two
      isomorphic groups are indistinguishable as groups, which is why
      classifying groups always means classifying them up to isomorphism.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-homomorphism
      - algebra.groups.def-element-order
      - foundations.functions.inverse-iff-bijection
    relates: []
    tags: []

  - id: algebra.groups.cyclic-classification
    kind: theorem
    prominence: 1
    title: "Classification of cyclic groups"
    statement: >
      Let $G = \langle g \rangle$ be cyclic. If $g$ has infinite order then
      $G \cong (\mathbb{Z},+)$; if $g$ has finite order $n$ then
      $G \cong \mathbb{Z}/n\mathbb{Z}$. In both cases the map
      $\varphi : \mathbb{Z}\to G$ given by $\varphi(k) = g^k$ is a surjective
      homomorphism. In the first case it is injective, since $g^i = g^j$ with
      $i < j$ would give $g^{j-i} = e$; in the second, $g^k = g^l$ if and only
      if $k \equiv l \pmod n$, so $[k] \mapsto g^k$ is a well-defined
      bijection. Consequently there is exactly one cyclic group of each order,
      up to isomorphism. Moreover every subgroup of a cyclic group is cyclic:
      if $H \le \langle g \rangle$ and $H \ne \{e\}$, then $H$ contains $g^m$
      for some $m > 0$, and taking $m$ least, division with remainder writes
      any $g^k \in H$ as $g^{qm+r}$ with $0 \le r < m$, so
      $g^r = g^k (g^m)^{-q} \in H$ and minimality forces $r = 0$; hence
      $H = \langle g^m \rangle$. In particular the subgroups of
      $(\mathbb{Z},+)$ are exactly the sets $n\mathbb{Z}$, and a cyclic group
      of order $n$ has exactly one subgroup of order $d$ for each divisor $d$
      of $n$.
    summary: >
      There is only one cyclic group of each size. The order of the generator
      determines everything, so $\mathbb{Z}$ and the groups
      $\mathbb{Z}/n\mathbb{Z}$ are the complete list.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-cyclic
      - algebra.groups.def-isomorphism
      - algebra.groups.ex-standard-examples
      - algebra.groups.ex-integers-mod-n
      - number-theory.divisibility.division-algorithm
    relates: []
    tags: []

  - id: algebra.groups.def-coset
    kind: definition
    prominence: 1
    title: "Cosets and the coset decomposition"
    statement: >
      Let $H \le G$ and $a \in G$. The left coset of $H$ by $a$ is
      $aH = \{ah : h \in H\}$ and the right coset is $Ha = \{ha : h \in H\}$.
      Define $a \sim b$ to mean $a^{-1}b \in H$; this is an equivalence
      relation on $G$ — reflexive since $e \in H$, symmetric since $H$ is
      closed under inverses, transitive since $H$ is closed under products —
      and its equivalence class containing $a$ is exactly $aH$. Hence the left
      cosets partition $G$: every element lies in one, namely $a \in aH$, and
      two cosets are either equal or disjoint. Equivalently $aH = bH$ if and
      only if $a^{-1}b \in H$, and $aH = H$ if and only if $a \in H$; a coset
      is a subgroup only when it equals $H$. All cosets have the same size as
      $H$, because $h \mapsto ah$ is a bijection from $H$ onto $aH$, with
      inverse $x \mapsto a^{-1}x$. The number of distinct left cosets is the
      index $[G:H]$, and it equals the number of right cosets. Example: the
      cosets of $3\mathbb{Z}$ in $\mathbb{Z}$ are the three residue classes
      modulo $3$, so $[\mathbb{Z}:3\mathbb{Z}] = 3$ even though both groups are
      infinite.
    summary: >
      Sliding a subgroup around the group tiles it into blocks all of the same
      size. That single picture is what stands behind Lagrange's theorem and
      behind quotient groups.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-subgroup
      - foundations.relations.partition-theorem
    relates: []
    tags: []

  - id: algebra.groups.lagrange
    kind: theorem
    prominence: 2
    title: "Lagrange's Theorem"
    statement: >
      Let $G$ be a finite group and let $H \le G$. Then
      $|G| = [G:H]\,|H|$; in particular the order of every subgroup divides the
      order of the group. Proof: the left cosets of $H$ partition $G$ into
      $[G:H]$ blocks, each of which has exactly $|H|$ elements, and counting
      the elements of $G$ block by block gives the identity. Finiteness of $G$
      is what makes the count meaningful; for infinite groups the equation
      survives only as a statement about cardinal arithmetic, and the index can
      be finite while both groups are infinite. The converse is false: a
      divisor of $|G|$ need not be the order of any subgroup — the alternating
      group $A_4$ has order $12$ and no subgroup of order $6$ — so Lagrange
      constrains the possibilities without producing them.
    summary: >
      In a finite group the size of any subgroup divides the size of the group.
      It is the first real constraint on how groups can be built, and the
      reason small groups have so few possible shapes.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-coset
      - algebra.groups.def-group-order
      - number-theory.divisibility.def-divisibility
    relates: []
    tags: []

  - id: algebra.groups.lagrange-corollaries
    kind: corollary
    prominence: 1
    title: "Corollaries of Lagrange's Theorem"
    statement: >
      Let $G$ be a finite group. (i) The order of every element divides $|G|$,
      because $|g| = |\langle g \rangle|$ and $\langle g \rangle \le G$.
      (ii) $g^{|G|} = e$ for every $g \in G$, since $|g|$ divides $|G|$ and
      $g^{|g|} = e$. (iii) If $|G| = p$ is prime then $G$ is cyclic and every
      element other than $e$ is a generator: for $g \ne e$ the subgroup
      $\langle g \rangle$ has order dividing $p$ and greater than $1$, hence
      equal to $p$, so $\langle g \rangle = G$. Applying (ii) to the group of
      units modulo $n$ gives Euler's theorem,
      $a^{\varphi(n)} \equiv 1 \pmod n$ whenever $\gcd(a,n) = 1$, and for
      $n = p$ prime the special case is Fermat's little theorem:
      $a^{p-1} \equiv 1 \pmod p$ whenever $p \nmid a$.
    summary: >
      Lagrange's constraint immediately pins down the possible orders of
      elements, forces every element to satisfy $g^{|G|} = e$, and leaves
      groups of prime order no freedom at all.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.lagrange
      - algebra.groups.def-cyclic
      - algebra.groups.ex-units-mod-n
      - number-theory.divisibility.def-prime
    relates: []
    tags: []

  - id: algebra.groups.def-normal
    kind: definition
    prominence: 1
    title: "Normal subgroup"
    statement: >
      A subgroup $N \le G$ is normal, written $N \unlhd G$, if
      $gNg^{-1} = N$ for every $g \in G$, where
      $gNg^{-1} = \{gng^{-1} : n \in N\}$. Three conditions are equivalent to
      it: $gNg^{-1}\subseteq N$ for every $g \in G$, which suffices because it
      may be applied to $g$ and to $g^{-1}$; $gN = Ng$ for every $g$, so that
      the left and right cosets of $N$ coincide as sets; and every left coset
      of $N$ is also a right coset. Normality does not assert that $gn = ng$
      for individual elements, only that conjugation permutes $N$ as a whole.
      Examples: in an abelian group every subgroup is normal; $\{e\}$ and $G$
      always are; the centre of $G$ is; and any subgroup $H$ of index $2$ is
      normal, since its two left cosets and its two right cosets are both $H$
      and $G \setminus H$. A non-example: in $S_3$ the subgroup generated by a
      single transposition is not normal. Normality is also not transitive —
      $K \unlhd H$ and $H \unlhd G$ do not give $K \unlhd G$.
    summary: >
      A subgroup that every conjugation carries to itself, equivalently one
      whose left and right cosets agree. Exactly these subgroups can be divided
      out.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-coset
      - algebra.groups.def-abelian
    relates: []
    tags: []

  - id: algebra.groups.quotient-group
    kind: theorem
    prominence: 1
    title: "Quotient group"
    statement: >
      Let $N \unlhd G$ and let $G/N$ denote the set of left cosets of $N$. The
      rule $(aN)(bN) = abN$ is well defined precisely when $N$ is normal.
      Suppose $N$ is normal and let $aN = a'N$ and $bN = b'N$; writing
      $a' = an$ and $b' = bm$ with $n,m \in N$ gives
      $a'b' = anbm = ab(b^{-1}nb)m \in abN$ because $b^{-1}nb \in N$.
      Conversely, if the rule is well defined then $N$ must contain every
      conjugate $g^{-1}ng$, which is normality. With this operation $G/N$ is a
      group, the quotient of $G$ by $N$: the identity is the coset $N = eN$,
      the inverse of $aN$ is $a^{-1}N$, and associativity is inherited. It has
      $[G:N]$ elements by construction. The map $\pi : G \to G/N$ sending $a$
      to $aN$ is a surjective homomorphism, the canonical projection.
      Degenerate cases: $G/\{e\}$ is a copy of $G$ and $G/G$ is trivial; and
      $\mathbb{Z}/n\mathbb{Z}$ is literally the quotient of $(\mathbb{Z},+)$ by
      the subgroup $n\mathbb{Z}$.
    summary: >
      Collapsing a normal subgroup to a single point turns the cosets
      themselves into a group. Normality is exactly the condition under which
      the operation survives the collapse.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-normal
      - algebra.groups.def-homomorphism
      - foundations.relations.well-defined-on-quotient
    relates: []
    tags: []

  - id: algebra.groups.kernel-image
    kind: definition
    prominence: 1
    title: "Kernel and image of a homomorphism"
    statement: >
      Let $\varphi : G \to H$ be a homomorphism. Its kernel is
      $\ker\varphi = \{g \in G : \varphi(g) = e_H\}$ and its image is
      $\im\varphi = \{\varphi(g) : g \in G\}$. The kernel is a normal subgroup
      of $G$: it is a subgroup because
      $\varphi(ab^{-1}) = \varphi(a)\varphi(b)^{-1} = e_H$ for
      $a,b \in \ker\varphi$, and it is normal because
      $\varphi(gag^{-1}) = \varphi(g)e_H\varphi(g)^{-1} = e_H$ for
      $a \in \ker\varphi$. The image is a subgroup of $H$, though usually not a
      normal one. The fibres of $\varphi$ are precisely the cosets of the
      kernel: $\varphi(a) = \varphi(b)$ if and only if
      $a\ker\varphi = b\ker\varphi$. Hence $\varphi$ is injective if and only
      if $\ker\varphi = \{e_G\}$ — a test on one subgroup replacing a statement
      about all pairs of elements. Conversely every normal subgroup is a
      kernel, so the kernels of homomorphisms out of $G$ are exactly the normal
      subgroups of $G$. Examples: the kernel of $\sgn$ is $A_n$; the kernel of
      the determinant is $\operatorname{SL}_n(\mathbb{R})$; the kernel of
      reduction $\mathbb{Z}\to\mathbb{Z}/n\mathbb{Z}$ is $n\mathbb{Z}$.
    summary: >
      The two subgroups attached to a homomorphism — what it destroys and what
      it reaches. The kernel is always normal and measures the failure of
      injectivity; the image is a subgroup of the target.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-homomorphism
      - algebra.groups.def-normal
      - algebra.groups.subgroup-criterion
    relates: []
    tags: []

  - id: algebra.groups.first-iso
    kind: theorem
    prominence: 2
    title: "First Isomorphism Theorem"
    statement: >
      Let $\varphi : G \to H$ be a group homomorphism and write
      $K = \ker\varphi$. Then $G/K \cong \im\varphi$, by the map
      $\bar{\varphi}(gK) = \varphi(g)$. Proof: the map is well defined and
      injective at once, because $\varphi(a) = \varphi(b)$ holds if and only if
      $aK = bK$; it is a homomorphism, because
      $\bar{\varphi}(aK\cdot bK) = \bar{\varphi}(abK) = \varphi(ab) =
      \varphi(a)\varphi(b)$; and it is surjective onto $\im\varphi$ by
      construction. So every homomorphism factors as the projection of $G$ onto
      $G/K$, followed by an isomorphism onto its image, followed by the
      inclusion of that image into $H$: quotienting out exactly what the map
      forgets leaves a perfect copy of what the map sees. For finite $G$ this
      gives $|G| = |\ker\varphi|\cdot|\im\varphi|$. Examples: $\sgn$ gives
      $S_n/A_n \cong \mathbb{Z}/2\mathbb{Z}$; the determinant gives
      $\operatorname{GL}_n(\mathbb{R})/\operatorname{SL}_n(\mathbb{R})\cong
      \mathbb{R}^{\times}$; and the map $k \mapsto g^k$ from $(\mathbb{Z},+)$
      onto $\langle g \rangle$ has kernel $n\mathbb{Z}$ when $|g| = n$, which
      is the second half of the classification of cyclic groups recovered in
      one line.
    summary: >
      Every homomorphism is a projection onto a quotient in disguise. Divide
      the source by what the map collapses and the result is an exact copy of
      the image.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.quotient-group
      - algebra.groups.kernel-image
      - algebra.groups.def-isomorphism
    relates: []
    tags: []

  - id: algebra.groups.def-direct-product
    kind: definition
    prominence: 1
    title: "Direct product"
    statement: >
      The direct product of groups $G$ and $H$ is the set $G \times H$ of
      ordered pairs with the componentwise operation
      $(g_1,h_1)(g_2,h_2) = (g_1g_2, h_1h_2)$. It is a group: associativity
      holds in each coordinate, the identity is $(e_G,e_H)$, and
      $(g,h)^{-1} = (g^{-1},h^{-1})$. For finite factors
      $|G\times H| = |G|\cdot|H|$; the product is abelian if and only if both
      factors are; and $|(g,h)| = \lcm(|g|,|h|)$ when both orders are finite.
      The subgroups $G \times \{e_H\}$ and $\{e_G\}\times H$ are normal, meet
      only in the identity, and together generate the product — the pattern by
      which a group is later recognised as an internal direct product of two of
      its own subgroups. The construction extends to any finite number of
      factors. It genuinely produces new groups: the Klein four-group
      $\mathbb{Z}/2\mathbb{Z}\times\mathbb{Z}/2\mathbb{Z}$ is not isomorphic to
      $\mathbb{Z}/4\mathbb{Z}$, since each of its elements satisfies
      $x^2 = e$ while $\mathbb{Z}/4\mathbb{Z}$ has an element of order $4$.
      More generally
      $\mathbb{Z}/m\mathbb{Z}\times\mathbb{Z}/n\mathbb{Z}\cong
      \mathbb{Z}/mn\mathbb{Z}$ if and only if $\gcd(m,n) = 1$.
    summary: >
      Two groups run side by side, each coordinate minding its own business. It
      is the standard way of building bigger groups out of smaller ones, and it
      is what tells the two groups of order four apart.
    parent: algebra.groups
    also_under: []
    requires:
      - algebra.groups.def-isomorphism
      - algebra.groups.ex-integers-mod-n
      - algebra.groups.def-normal
      - algebra.groups.def-generated-subgroup
      - number-theory.divisibility.def-lcm
    relates: []
    tags: []
