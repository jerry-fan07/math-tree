# linear-algebra.systems — Linear Systems and Elimination
# The subbranch node plus the spine of elimination: linear equations and their
# solution sets, the augmented matrix, elementary row operations and echelon
# forms, Gaussian and Gauss-Jordan elimination, consistency and the trichotomy,
# rank, homogeneous systems, and the geometry behind all of it.

nodes:
  - id: linear-algebra.systems
    kind: subbranch
    title: "Linear Systems and Elimination"
    summary: >
      Systems of linear equations, row reduction to echelon form, and the
      solution sets that elimination reads off — the computational entry point
      to the whole branch.
    parent: linear-algebra
    also_under: []
    tags: []

  - id: linear-algebra.systems.def-linear-equation
    kind: definition
    prominence: 1
    title: "Linear equation"
    statement: >
      A linear equation in the unknowns $x_1, x_2, \dots, x_n$ with real
      coefficients is an equation
      $a_1 x_1 + a_2 x_2 + \cdots + a_n x_n = b$,
      where the coefficients $a_1, \dots, a_n$ and the constant term $b$ are
      fixed real numbers. What makes it linear is that each unknown occurs only
      to the first power, multiplied by a constant: no products $x_i x_j$, no
      powers, no unknown inside a root, an exponential or a trigonometric
      function. A solution is an ordered $n$-tuple
      $(s_1, \dots, s_n) \in \mathbb{R}^n$ for which
      $a_1 s_1 + \cdots + a_n s_n = b$ is a true statement. The degenerate case
      in which every $a_i = 0$ is allowed and matters: $0 = 0$ is satisfied by
      every tuple, while $0 = b$ with $b \ne 0$ is satisfied by none.
    summary: >
      A condition on several unknowns in which each unknown appears only as a
      constant times its first power — the flat, undistorted kind of equation,
      and the only kind this subject solves outright.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - foundations.sets.cartesian-product
    relates: []
    tags: []

  - id: linear-algebra.systems.def-linear-system
    kind: definition
    prominence: 1
    title: "System of linear equations"
    statement: >
      A system of $m$ linear equations in the $n$ unknowns $x_1, \dots, x_n$ is
      a finite list of such equations in the same unknowns, written with doubly
      indexed coefficients: the $i$-th equation is
      $a_{i1} x_1 + a_{i2} x_2 + \cdots + a_{in} x_n = b_i$ for
      $i = 1, \dots, m$, where $a_{ij}$ is the coefficient of the $j$-th unknown
      in the $i$-th equation. A solution of the system is an $n$-tuple that is
      a solution of every one of the $m$ equations simultaneously. Nothing ties
      $m$ to $n$: there may be fewer, as many, or more equations than unknowns,
      and an unknown that is absent from an equation simply has coefficient $0$
      there.
    summary: >
      Several linear conditions imposed on one list of unknowns at once, where
      a candidate counts as a solution only if it satisfies all of them
      together.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-linear-equation
    relates: []
    tags: []

  - id: linear-algebra.systems.def-solution-set
    kind: definition
    prominence: 1
    title: "Solution set of a system"
    statement: >
      The solution set of a system of $m$ equations in $n$ unknowns is the set
      $S$ of all $n$-tuples in $\mathbb{R}^n$ satisfying every equation. If
      $S_i \subseteq \mathbb{R}^n$ denotes the solution set of the $i$-th
      equation alone, then $S = S_1 \cap S_2 \cap \cdots \cap S_m$: imposing
      more equations can only shrink the set, never enlarge it. To solve a
      system means to describe $S$ exactly — every element and nothing else —
      not to exhibit one member of it. Two systems in the same unknowns are
      called equivalent when they have the same solution set; this is a
      relation between whole systems, and equivalent systems need not have the
      same number of equations.
    summary: >
      The set of every tuple that satisfies all the equations at once; solving
      means describing that set completely, not producing one answer.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-linear-system
      - foundations.sets.def-intersection
    relates: []
    tags: []

  - id: linear-algebra.systems.def-consistent
    kind: definition
    prominence: 0
    title: "Consistent and inconsistent systems"
    statement: >
      A linear system is consistent when its solution set is nonempty, and
      inconsistent when its solution set is empty. Inconsistency is a property
      of the system as a whole and not of any single equation: each of
      $x + y = 1$ and $x + y = 2$ is solvable on its own, while the system
      consisting of both is inconsistent, since it would force $1 = 2$.
      Existence and uniqueness are separate questions asked in that order —
      first whether any solution exists, and only then how many there are.
    summary: >
      Whether a system has any solution at all; inconsistency comes from the
      equations contradicting one another, never from a single equation being
      unsolvable.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-solution-set
    relates: []
    tags: []

  - id: linear-algebra.systems.def-augmented-matrix
    kind: definition
    prominence: 1
    title: "Coefficient and augmented matrix"
    statement: >
      Fix an order for the unknowns of a system of $m$ equations in $n$
      unknowns. Its coefficient matrix is the rectangular $m \times n$ array
      $A = (a_{ij})$ whose $i$-th row is
      $(a_{i1}, a_{i2}, \dots, a_{in})$, the coefficients of the $i$-th
      equation, and its constant column is $b = (b_1, \dots, b_m)$. The
      augmented matrix of the system is the $m \times (n+1)$ array
      $[A \mid b]$ obtained by appending $b$ as a final column, so that its
      $i$-th row is $(a_{i1}, \dots, a_{in} \mid b_i)$. The augmented matrix is
      bookkeeping and nothing more: one row per equation, one of the first $n$
      columns per unknown, and the bar recording that the last column plays a
      different role from the others. An unknown missing from an equation
      contributes a $0$ in its column, which is why the order of the unknowns
      must be fixed before the array means anything.
    summary: >
      The system stripped down to its numbers, arranged so that a row is an
      equation and a column is an unknown — the form elimination actually
      operates on.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-linear-system
    relates: []
    tags: []

  - id: linear-algebra.systems.row-operations
    kind: definition
    prominence: 1
    title: "Elementary row operations"
    statement: >
      There are three elementary row operations on a matrix. Interchange:
      exchange two rows, $R_i \leftrightarrow R_j$. Scaling: multiply a row by
      a scalar $c \ne 0$, written $R_i \to c R_i$. Replacement: add a multiple
      of one row to a different row, $R_i \to R_i + c R_j$ with $j \ne i$ and
      $c$ any scalar. Performed on an augmented matrix these are exactly the
      manipulations one performs on the equations themselves — reorder them,
      multiply one through by a nonzero constant, add a multiple of one
      equation to another. Each operation is undone by an operation of the same
      type: $R_i \leftrightarrow R_j$ undoes itself, $R_i \to \frac{1}{c} R_i$
      undoes scaling, and $R_i \to R_i - c R_j$ undoes replacement. Both side
      conditions are needed for this. Scaling by $c = 0$ would erase a row
      irreversibly, and allowing $j = i$ in a replacement would permit
      $R_i \to R_i - R_i$, which does the same.
    summary: >
      The three reversible moves on the rows of a matrix — swap, rescale, add a
      multiple of another row — which are the legitimate manipulations of a
      system written in array form.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-augmented-matrix
      - foundations.number-systems.def-ordered-field
    relates: []
    tags: []

  - id: linear-algebra.systems.row-equivalence
    kind: definition
    prominence: 1
    title: "Row equivalence"
    statement: >
      Two $m \times n$ matrices $A$ and $B$ are row equivalent, written
      $A \sim B$, when $B$ can be obtained from $A$ by some finite sequence of
      elementary row operations. Row equivalence is an equivalence relation on
      the set of $m \times n$ matrices: it is reflexive because the empty
      sequence of operations is allowed, symmetric because reversing the
      sequence and replacing each operation by its inverse — again an
      elementary operation — carries $B$ back to $A$, and transitive because
      two sequences can be performed one after the other. So the matrices of a
      given size fall into disjoint row equivalence classes.
    summary: >
      Being reachable from one another by row operations; because each
      operation is reversible, this is a genuine equivalence relation rather
      than a one-way process.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.row-operations
      - foundations.relations.def-equivalence-relation
    relates: []
    tags: []

  - id: linear-algebra.systems.row-ops-preserve-solutions
    kind: theorem
    prominence: 1
    title: "Row equivalence preserves the solution set"
    statement: >
      If the augmented matrices of two linear systems in the same $n$ unknowns,
      written with the unknowns in the same order, are row equivalent, then the
      two systems have exactly the same solution set. The ordering hypothesis
      is not decorative: an array records which coefficient belongs to which
      unknown only once that order is fixed, so without it row equivalent
      arrays can come from systems with different solution sets. Proof: since
      row equivalence is a finite chain of elementary
      operations, it is enough to treat one operation. Let $(s_1, \dots, s_n)$
      satisfy the original system. An interchange changes no equation. After
      $R_i \to c R_i$ the new $i$-th equation is $c$ times the old one, which
      the tuple still satisfies; after $R_i \to R_i + c R_j$ the new $i$-th
      equation is the old $i$-th plus $c$ times the old $j$-th, and the tuple
      satisfies both of those; all other equations are untouched. Hence every
      solution of the original system solves the new one. The reverse inclusion
      needs no separate argument: each elementary operation has an elementary
      inverse, so the new augmented matrix is row equivalent to the original
      and the same reasoning runs the other way. This theorem is what licenses
      elimination — it says the goal is to reach a system that is easier to
      read but has not lost or gained a single solution.
    summary: >
      Row operations rewrite a system without changing what solves it, which is
      the entire justification for solving a system by reducing its matrix.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.row-equivalence
      - linear-algebra.systems.def-solution-set
    relates: []
    tags: []

  - id: linear-algebra.systems.def-row-echelon
    kind: definition
    prominence: 1
    title: "Row echelon form"
    statement: >
      A matrix is in row echelon form when two conditions hold. First, every
      row consisting entirely of zeros lies below every nonzero row. Second, in
      each nonzero row the leading entry — the leftmost nonzero entry of that
      row, called a pivot — lies strictly to the right of the leading entry of
      the row above it. Together these force the pivots to descend in a
      staircase and every entry below a pivot, in the pivot's own column, to be
      zero. The location of a pivot is called a pivot position and a column
      containing one is a pivot column; a matrix with $m$ rows and $n$ columns
      has at most $\min(m,n)$ pivots, since each occupies a row and a column of
      its own. Echelon form is not unique: scaling any row of an echelon matrix
      leaves it in echelon form.
    summary: >
      The staircase shape: zero rows at the bottom, and each row's first
      nonzero entry further right than the one above, so the equations get
      shorter as you read down.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-augmented-matrix
    relates: []
    tags: []

  - id: linear-algebra.systems.def-pivot-free
    kind: definition
    prominence: 1
    title: "Basic and free variables"
    statement: >
      Take a system in the unknowns $x_1, \dots, x_n$ and an echelon form of
      its augmented matrix. Among the first $n$ columns — the ones belonging to
      unknowns — those carrying a pivot are the pivot columns, and the
      corresponding unknowns are the basic, or leading, variables; the
      remaining unknowns are the free variables. If $r$ of the first $n$
      columns are pivot columns there are $r$ basic variables and $n - r$ free
      ones. The names describe how the echelon form is used: provided no row of
      the form $(0, \dots, 0 \mid c)$ with $c \ne 0$ occurs, every nonzero
      equation has a basic variable and can be solved for it in terms of the
      variables to its right, so values may be assigned to the free variables
      at will and the basic variables are then determined. The split depends
      only on the pivot positions, not on the entries themselves.
    summary: >
      The echelon form splits the unknowns into those that head an equation and
      those left over; the leftovers are the dials you may turn freely, and the
      rest follow.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-row-echelon
    relates: []
    tags: []

  - id: linear-algebra.systems.def-rref
    kind: definition
    prominence: 1
    title: "Reduced row echelon form"
    statement: >
      A matrix is in reduced row echelon form when it is in row echelon form
      and, in addition, every pivot equals $1$ and each pivot is the only
      nonzero entry in its column — the entries above a pivot are zero as well
      as those below. The second extra condition is the substantive one: an
      echelon form only clears the entries below each pivot, while a reduced
      echelon form clears both sides, so each pivot column consists of a single
      $1$ with zeros everywhere else. Read as a system, this means each unknown
      whose column carries a pivot appears in exactly one of the equations, and
      there with coefficient $1$.
    summary: >
      Echelon form pushed as far as row operations allow: pivots equal to $1$
      and alone in their columns, so nothing is left to substitute back.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-row-echelon
    relates: []
    tags: []

  - id: linear-algebra.systems.gaussian-elimination
    kind: technique
    prominence: 2
    title: "Gaussian elimination"
    statement: >
      The algorithm that carries any matrix to row echelon form using only
      elementary row operations. Working on the augmented matrix, and starting
      with all rows available: locate the leftmost column, say column $j$,
      having a nonzero entry in some available row; if the topmost available
      row has a zero there, interchange it with a row below that does not,
      making that entry the pivot $p$ and its row the pivot row $R_k$; for
      every available row $i$ below row $k$, apply the replacement
      $R_i \to R_i - (a_{ij}/p) R_k$, where $a_{ij}$ is that row's entry in the
      pivot column, to make the entry below the pivot zero; then set the pivot
      row aside and repeat on the rows that remain. Each
      pass consumes one row and moves at least one column to the right, so the
      process halts after at most $\min(m,n)$ pivots and no step can loop. It
      proves a theorem in passing: every matrix is row equivalent to a matrix
      in row echelon form. Because only elementary operations were used, the
      resulting system has the same solution set as the one you started with,
      but now shaped so that the last equation is the shortest. This forward
      phase is where essentially all the arithmetic of solving a system lives.
    summary: >
      Sweep down the matrix column by column, using one row to knock out the
      entries beneath its pivot, until the staircase shape appears — the
      standard way any system gets solved.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-row-echelon
      - linear-algebra.systems.row-ops-preserve-solutions
    relates: []
    tags: []

  - id: linear-algebra.systems.back-substitution
    kind: technique
    prominence: 1
    title: "Back-substitution and the parametric solution"
    statement: >
      How to extract the full solution set from an echelon form of a consistent
      system. Give each free variable its own parameter, $x_j = t_j$, ranging
      over $\mathbb{R}$. Now work upward from the lowest nonzero row: that
      equation involves its own basic variable and, apart from it, only
      variables further to the right, all of which are free, so it can be
      solved for its basic variable. Substitute what has been found into the
      equation above, solve that one for its basic variable, and continue to
      the top row. The output expresses every basic variable explicitly in
      terms of the parameters, and that is a parametric description of the
      whole solution set: each choice of the parameters gives one solution,
      distinct choices give distinct solutions, and every solution arises this
      way. If there are no free variables the description has no parameters in
      it and names a single tuple.
    summary: >
      Once the staircase is in place, solve the bottom equation, feed it into
      the one above, and keep going — with the free variables carried along as
      parameters that name the entire solution set at once.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.gaussian-elimination
      - linear-algebra.systems.def-pivot-free
      - linear-algebra.systems.def-consistent
    relates: []
    tags: []

  - id: linear-algebra.systems.gauss-jordan
    kind: technique
    prominence: 1
    title: "Gauss-Jordan elimination"
    statement: >
      Gaussian elimination continued past the echelon form. After the forward
      phase, scale each pivot row by the reciprocal of its pivot so that every
      pivot becomes $1$ — legitimate because a pivot is nonzero — and then work
      from the rightmost pivot leftwards: if that pivot is the entry of row $k$
      in column $j$, the replacements $R_i \to R_i - a_{ij} R_k$, taken over the
      rows $i$ above row $k$, clear the entries above the pivot as well as the
      ones already cleared below. The result is in reduced row echelon
      form and was reached by elementary row operations alone, so it is row
      equivalent to the matrix you started with. The payoff is that no
      back-substitution is required: unless the reduced system contains the
      contradictory row $(0, \dots, 0 \mid 1)$, each of its nonzero equations
      contains a single basic variable, already isolated, with only free
      variables on the other side. The extra arithmetic buys that convenience,
      which is why hand computation usually stops at echelon form and
      back-substitutes, while the reduced form is what theory wants.
    summary: >
      Keep reducing until each pivot is a lone $1$ in its column; then the
      solution can be read straight off the rows with no substituting back.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.gaussian-elimination
      - linear-algebra.systems.def-rref
      - linear-algebra.systems.def-pivot-free
    relates: []
    tags: []

  - id: linear-algebra.systems.rref-unique
    kind: theorem
    prominence: 1
    title: "Uniqueness of the reduced row echelon form"
    statement: >
      Every matrix is row equivalent to one and only one matrix in reduced row
      echelon form. Existence is Gauss-Jordan elimination. Uniqueness is the
      substantive half and is genuinely a theorem rather than a bookkeeping
      remark: the unreduced echelon forms of a matrix are many, and the
      sequences of operations reaching the reduced one are many, yet the
      destination is the same for all of them. Consequently
      $\operatorname{rref}(A)$ is an invariant of $A$, and two matrices are row
      equivalent if and only if their reduced row echelon forms are equal — a
      decidable test for a relation defined by an unbounded search over
      sequences of operations. In particular the pivot positions are the same
      in every echelon form of $A$, so which variables of a system are basic
      and which are free does not depend on how the elimination was carried
      out.
    summary: >
      However you reduce a matrix, you land on the same reduced form — which is
      what turns the pivot positions, and everything counted from them, into
      properties of the matrix itself.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.gauss-jordan
    relates:
      - id: foundations.relations.partition-theorem
        note: >
          Row equivalence partitions the matrices of a given size into classes,
          and this theorem hands each class a canonical representative — the
          general move of choosing one normal form per equivalence class.
    tags: []

  - id: linear-algebra.systems.consistency-criterion
    kind: proposition
    prominence: 1
    title: "Detecting inconsistency in the echelon form"
    statement: >
      Let $[A \mid b]$ be the augmented matrix of a system in $n$ unknowns and
      let $E$ be any row echelon form of it. The system is inconsistent if and
      only if $E$ has a row of the form $(0, 0, \dots, 0 \mid c)$ with
      $c \ne 0$ — equivalently, if and only if the last column of $E$ is a pivot
      column. Such a row is the equation $0 x_1 + \cdots + 0 x_n = c$, which no
      tuple satisfies, so the reduced system has no solution and, since row
      operations preserve the solution set, neither does the original.
      Conversely, if no such row occurs then every pivot of $E$ lies in one of
      the first $n$ columns, and setting all free variables to $0$ and solving
      the nonzero equations from the bottom up produces an actual solution.
      Consistency is therefore settled by a glance at the shape of the echelon
      form, before any solution is computed.
    summary: >
      A row reading "zero equals something nonzero" is exactly what an
      unsolvable system leaves behind, and it is the only obstruction there is.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-consistent
      - linear-algebra.systems.def-pivot-free
      - linear-algebra.systems.gaussian-elimination
    relates: []
    tags: []

  - id: linear-algebra.systems.trichotomy
    kind: theorem
    prominence: 2
    title: "The trichotomy for linear systems"
    statement: >
      A system of linear equations with real coefficients has either no
      solution, or exactly one solution, or infinitely many solutions; no other
      possibility occurs, and in particular no system has exactly two or
      exactly seventeen solutions. An echelon form $E$ of the augmented matrix
      decides which case holds. If $E$ contains a row $(0, \dots, 0 \mid c)$
      with $c \ne 0$ the system is inconsistent. Otherwise it is consistent,
      and then it has exactly one solution when there is no free variable, that
      is when all $n$ unknowns are basic, and infinitely many when at least one
      free variable exists, since distinct real values of a parameter yield
      distinct solutions. The hypothesis that the scalars form an infinite
      field is what makes the third case say "infinitely many": over a finite
      field the same argument only gives more than one solution. The
      field-independent statement of the trichotomy is: none, exactly one, or
      more than one.
    summary: >
      Linear systems fail, pin down a single answer, or leave a whole continuum
      of answers — never any other count — and the echelon form tells you which
      before you finish solving.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.consistency-criterion
      - linear-algebra.systems.back-substitution
    relates: []
    tags: []

  - id: linear-algebra.systems.def-rank
    kind: definition
    prominence: 1
    title: "Rank of a system"
    statement: >
      The rank of a matrix $A$, written $\rank A$, is the number of pivots in
      an echelon form of $A$, equivalently the number of nonzero rows of
      $\operatorname{rref}(A)$. This is well defined exactly because the
      reduced row echelon form is unique, so the count cannot depend on the
      elimination performed. The rank of a system is the rank of its
      coefficient matrix. Since each pivot occupies a row and a column of its
      own, $\rank A \le \min(m, n)$ for an $m \times n$ matrix; and adjoining
      the constant column adds at most one pivot, so
      $\rank A \le \rank [A \mid b] \le \rank A + 1$. Informally the rank
      counts how many of the $m$ equations impose genuinely independent
      constraints — the redundant ones are the ones elimination turns into zero
      rows.
    summary: >
      How many pivots elimination produces, and therefore how many of the
      equations really constrain anything; the uniqueness of the reduced form
      is what makes the number belong to the matrix.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.rref-unique
    relates: []
    tags: []

  - id: linear-algebra.systems.rank-criterion
    kind: proposition
    prominence: 1
    title: "Rank decides existence and uniqueness"
    statement: >
      Consider a system of $m$ equations in $n$ unknowns with coefficient
      matrix $A$ and augmented matrix $[A \mid b]$. It is consistent if and
      only if $\rank A = \rank [A \mid b]$, since inconsistency means the last
      column is a pivot column, which is precisely the remaining case
      $\rank [A \mid b] = \rank A + 1$. When it is consistent, its solution set
      is described by exactly $n - \rank A$ parameters, one for each free
      variable, so the solution is unique if and only if $\rank A = n$ and
      there are infinitely many solutions if and only if $\rank A < n$. Because
      $\rank A \le m$, a consistent system with fewer equations than unknowns
      can never have a unique solution, and a system with more equations than
      unknowns is not thereby inconsistent — what matters is the rank, never
      the raw count of equations.
    summary: >
      One number governs both questions: whether the constant column adds a
      pivot decides existence, and the gap between the rank and the number of
      unknowns counts the degrees of freedom left over.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-rank
      - linear-algebra.systems.trichotomy
    relates: []
    tags: []

  - id: linear-algebra.systems.def-homogeneous
    kind: definition
    prominence: 1
    title: "Homogeneous system"
    statement: >
      A linear system is homogeneous when every constant term is zero, so its
      $i$-th equation reads $a_{i1} x_1 + \cdots + a_{in} x_n = 0$ and its
      augmented matrix is $[A \mid 0]$. Every homogeneous system is satisfied
      by the zero tuple $(0, 0, \dots, 0)$, called the trivial solution, so a
      homogeneous system is always consistent and its solution set is never
      empty; the only question that can be asked of it is whether a nontrivial
      solution — one with $x_j \ne 0$ for some $j$ — exists. The last column of
      $[A \mid 0]$ stays zero under every row operation, so elimination may be
      carried out on $A$ alone and no row of the form $(0, \dots, 0 \mid c)$
      with $c \ne 0$ can ever appear. Every system $[A \mid b]$ has an
      associated homogeneous system $[A \mid 0]$, obtained by replacing all the
      constants by $0$ while keeping the coefficients.
    summary: >
      A system whose right-hand sides are all zero; it can never fail, because
      everything being zero always works, so the whole question is whether
      anything else does.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-consistent
      - linear-algebra.systems.row-operations
    relates: []
    tags: []

  - id: linear-algebra.systems.more-unknowns-nontrivial
    kind: theorem
    prominence: 2
    title: "More unknowns than equations forces a nontrivial solution"
    statement: >
      A homogeneous system of $m$ linear equations in $n$ unknowns with
      $n > m$ has a nontrivial solution; over $\mathbb{R}$ it has infinitely
      many. Proof: reduce $[A \mid 0]$ to echelon form. Each pivot occupies a
      row of its own, so the number of pivots is $\rank A \le m < n$, leaving
      $n - \rank A \ge 1$ free variables. The system is consistent, having the
      trivial solution, so assigning the value $1$ to one free variable and $0$
      to the others and back-substituting yields a solution whose entry at that
      free variable is $1$, hence a solution that is not the zero tuple. Both
      hypotheses are needed. Homogeneity cannot be dropped: the two equations
      $x + y + z = 1$ and $x + y + z = 2$ have three unknowns and no solution
      at all. And a homogeneous system with $n \le m$ may well have only the
      trivial solution, as $x = 0$ together with $y = 0$ shows.
    summary: >
      Too few equations to pin down the unknowns always leaves room to move, so
      a homogeneous system that is short of equations has a solution other than
      all-zeros.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-homogeneous
      - linear-algebra.systems.rank-criterion
    relates: []
    tags: []

  - id: linear-algebra.systems.solution-structure
    kind: theorem
    prominence: 1
    title: "Particular solution plus homogeneous solutions"
    statement: >
      Let a system with coefficient matrix $A$ and constant column $b$ be
      consistent and let $p = (p_1, \dots, p_n)$ be any one of its solutions, a
      particular solution. Then its solution set is exactly the set of tuples
      $p + h$ where $h$ runs over the solutions of the associated homogeneous
      system. Proof: if $x$ is any solution then for each $i$,
      $\sum_j a_{ij}(x_j - p_j) = b_i - b_i = 0$, so $h = x - p$ solves the
      homogeneous system and $x = p + h$; conversely if $h$ solves the
      homogeneous system then $\sum_j a_{ij}(p_j + h_j) = b_i + 0 = b_i$, so
      $p + h$ solves the original. Two consequences. The solution set of a
      consistent system is a translate of the solution set of its homogeneous
      counterpart — the same shape, shifted off the origin by any one solution.
      And a consistent system has a unique solution if and only if its
      homogeneous counterpart has only the trivial solution, which is why
      uniqueness is a question about $A$ alone and not about $b$.
    summary: >
      Every solution is one solution plus something the homogeneous system
      allows, so the constants fix where the solution set sits and the
      coefficients fix its shape.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.def-homogeneous
    relates: []
    tags: []

  - id: linear-algebra.systems.intuition-geometry
    kind: intuition
    prominence: 1
    title: "Lines and planes: the geometry of a solution set"
    statement: >
      In two unknowns an equation $ax + by = c$ with $(a,b) \ne (0,0)$
      describes a line in the plane, so the solution set of a system in two
      unknowns is an intersection of lines: two non-parallel lines meet in one
      point (unique solution), two distinct parallel lines never meet
      (inconsistent), and two equations describing the same line leave that
      whole line (infinitely many). In three unknowns
      $ax + by + cz = d$ with $(a,b,c) \ne (0,0,0)$ describes a plane, and a
      system's solution set is an intersection of planes, which can only be
      empty, a single point, a line, or a whole plane. The pattern behind the
      trichotomy: each equation cuts one dimension out of the possibilities,
      the rank counts how many independent cuts were actually made, and the
      $n - \rank A$ free variables count the directions left uncut. That is why
      a nonempty solution set is always flat — a point, a line, a plane, or a
      higher flat piece of $\mathbb{R}^n$ — and never a curve, and never two
      isolated points.
    summary: >
      Each linear equation carves out a flat slice of space, and solving the
      system means intersecting those slices, which is why the answer is always
      empty or a flat object of some dimension.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.rank-criterion
    relates: []
    tags: []

  - id: linear-algebra.systems.ex-three-planes
    kind: example
    prominence: 0
    title: "Three planes in space"
    statement: >
      The principal configurations of three planes in $\mathbb{R}^3$, matched
      to what elimination reports. Three planes meeting in a single point: three
      pivots, no free variable, unique solution. Three distinct planes sharing
      a common line: two pivots and one zero row, one free variable, solution
      set a line. Three equations describing the same plane: one pivot, two
      free variables, solution set that plane. Two of the planes parallel and
      distinct: inconsistent, whatever the third plane does. And the
      instructive one, the triangular prism: no two of the three planes are
      parallel, so each pair meets in a line, but the three lines of
      intersection are parallel and distinct, so no point lies on all three
      planes and the system is inconsistent — elimination produces a row
      $(0, 0, 0 \mid c)$ with $c \ne 0$. The prism shows that pairwise
      consistency does not imply consistency, and that "no solution" is not the
      same as "two of the equations are parallel".
    summary: >
      The main ways three planes can sit relative to one another, and the echelon
      form that goes with each — including the prism, where every pair of
      equations is fine and the three together are not.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.intuition-geometry
    relates: []
    tags: []

  - id: linear-algebra.systems.ex-worked
    kind: example
    prominence: 0
    title: "A worked elimination with a free variable"
    statement: >
      Solve $x_1 + 2x_2 + 3x_3 = 9$, $2x_1 + 4x_2 + 7x_3 = 22$,
      $3x_1 + 6x_2 + 10x_3 = 31$. The augmented matrix has rows
      $(1, 2, 3 \mid 9)$, $(2, 4, 7 \mid 22)$, $(3, 6, 10 \mid 31)$. The
      replacements $R_2 \to R_2 - 2R_1$ and $R_3 \to R_3 - 3R_1$ turn these
      into $(1, 2, 3 \mid 9)$, $(0, 0, 1 \mid 4)$, $(0, 0, 1 \mid 4)$, and then
      $R_3 \to R_3 - R_2$ gives the echelon form
      $(1, 2, 3 \mid 9)$, $(0, 0, 1 \mid 4)$, $(0, 0, 0 \mid 0)$. The pivots
      lie in columns $1$ and $3$, so $x_1$ and $x_3$ are basic and $x_2$ is
      free; the last column carries no pivot, so the system is consistent. Put
      $x_2 = t$. The second row gives $x_3 = 4$, and substituting back into the
      first gives $x_1 = 9 - 2t - 12 = -3 - 2t$. The solution set is all
      $(-3 - 2t, t, 4)$ with $t \in \mathbb{R}$, infinitely many as the one
      free variable predicts, and writing it as
      $(-3, 0, 4) + t (-2, 1, 0)$ displays a particular solution plus the
      general solution $t (-2, 1, 0)$ of the associated homogeneous system.
      Change only the third constant, from $31$ to $32$, and the very same
      operations end with the row $(0, 0, 0 \mid 1)$: the system is now
      inconsistent, though not one coefficient was altered.
    summary: >
      One system carried all the way through — elimination, a zero row, a free
      variable, a parametric answer — and then broken by moving a single
      constant.
    parent: linear-algebra.systems
    also_under: []
    requires:
      - linear-algebra.systems.back-substitution
      - linear-algebra.systems.consistency-criterion
      - linear-algebra.systems.solution-structure
    relates: []
    tags: []
