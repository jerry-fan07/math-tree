# foundations.cardinality — Cardinality and Countability
# Equinumerosity and finiteness; the countable sets (ℤ, ℚ, countable unions,
# the algebraic numbers); Cantor's two diagonal theorems; Schröder–Bernstein
# and cardinal comparison, up to the statement of the continuum hypothesis.

nodes:
  - id: foundations.cardinality
    kind: subbranch
    title: "Cardinality and Countability"
    summary: >
      Comparing infinite sets by bijection: countable and uncountable,
      Cantor's diagonal argument, and the Schröder–Bernstein theorem.
    parent: foundations
    also_under: []
    tags: []

  - id: foundations.cardinality.def-equinumerous
    kind: definition
    prominence: 2
    title: "Equinumerosity"
    statement: >
      Sets $A$ and $B$ are equinumerous, written $A \approx B$ or $|A| = |B|$,
      if there exists a bijection $f : A \to B$. Nothing is assumed about the
      sets — they may be finite or infinite — and the definition never counts
      anything, it only pairs. Equinumerosity is taken as the meaning of "same
      size" for two reasons. For finite sets it agrees with counting: two finite
      sets can be matched element for element exactly when they have the same
      number of elements. And it is the criterion that survives the passage to
      infinite sets, where the competing intuitions break down — proper
      containment is not one of them, since $n \mapsto 2n$ is a bijection from
      $\mathbb{N}$ onto the proper subset of even natural numbers.
    summary: >
      Two sets have the same size when their elements can be paired off
      perfectly. The test needs no numbers, which is exactly why it keeps
      working when the sets are infinite.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.functions.def-bijective
    relates: []
    tags: []

  - id: foundations.cardinality.intuition-proper-subset
    kind: intuition
    prominence: 1
    title: "An infinite set can match a proper part of itself"
    statement: >
      The map $n \mapsto 2n$ pairs every natural number with an even one and
      misses nothing, so $\mathbb{N}$ is equinumerous with a proper subset of
      itself. Hilbert's hotel is the same fact told as a story: a hotel with
      rooms $0, 1, 2, \dots$, every one occupied, can still house a new guest by
      moving the occupant of room $n$ to room $n+1$, and can house infinitely
      many new guests by moving the occupant of room $n$ to room $2n$. What
      fails here is the Euclidean maxim that the whole is greater than the part.
      The right reaction is not to distrust the definition but to notice that
      the failure is characteristic: only infinite sets can do this, so the
      behaviour is not a paradox but a usable criterion for being infinite.
    summary: >
      Removing infinitely many elements from an infinite set can leave a set of
      the same size — the first thing about infinity that has to be accepted
      rather than resisted.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-equinumerous
    relates: []
    tags: []

  - id: foundations.cardinality.equinumerosity-equivalence
    kind: proposition
    prominence: 0
    title: "Equinumerosity behaves as an equivalence relation"
    statement: >
      For all sets $A$, $B$, $C$: $A \approx A$, since $\mathrm{id}_A$ is a
      bijection; if $A \approx B$ then $B \approx A$, since the inverse of a
      bijection is a bijection; and if $A \approx B$ and $B \approx C$ then
      $A \approx C$, since a composite of bijections is a bijection. So
      equinumerosity is reflexive, symmetric and transitive, which is what
      licenses speaking of "the cardinality of $A$" as a property shared by all
      the sets equinumerous with $A$. One caveat: this is not literally an
      equivalence relation, because there is no set of all sets for it to be a
      relation on, so its classes are not sets and cardinal numbers cannot be
      manufactured as a quotient set.
    summary: >
      Same-size is reflexive, symmetric and transitive — the three facts that
      make "the size of a set" a well-defined thing to talk about.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-equinumerous
      - foundations.functions.inverse-iff-bijection
      - foundations.functions.composition-inj-surj
      - foundations.relations.def-equivalence-relation
    relates: []
    tags: []

  - id: foundations.cardinality.def-finite
    kind: definition
    prominence: 1
    title: "Finite set and its cardinality"
    statement: >
      A set $A$ is finite if $A \approx \{1, 2, \dots, n\}$ for some integer
      $n \ge 0$, the case $n = 0$ reading as $A = \emptyset$, matched
      by the empty function. That $n$ is uniquely determined by
      $A$: if $\{1, \dots, m\} \approx \{1, \dots, n\}$ then $m = n$, since
      otherwise the bijection would be an injection from a larger finite set to
      a smaller one, contrary to the pigeonhole principle. That uniqueness is
      what makes the cardinality $|A| = n$ well defined. A set that is not
      finite is infinite. For infinite $A$ the symbol $|A|$ is still used for
      the cardinality of $A$, but it is then not a natural number.
    summary: >
      A set is finite when its elements can be labelled $1$ through $n$ without
      repetition or omission, and the pigeonhole principle is what guarantees
      that $n$ is not ambiguous.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-equinumerous
      - foundations.functions.pigeonhole
    relates: []
    tags: []

  - id: foundations.cardinality.finite-pigeonhole
    kind: theorem
    prominence: 1
    title: "Pigeonhole characterisation of finiteness"
    statement: >
      A set $A$ is finite if and only if every injection $A \to A$ is
      surjective; equivalently, if and only if $A$ is not equinumerous with any
      proper subset of itself. A set that is equinumerous with a proper subset
      of itself is called Dedekind-infinite. The forward direction is the
      pigeonhole principle: on a finite set injective and surjective coincide,
      and an injection of $A$ onto a proper subset would give an injection that
      is not surjective. The converse — every infinite set is Dedekind-infinite
      — is proved by extracting from an infinite set a sequence of distinct
      elements $a_0, a_1, a_2, \dots$ and shifting along it, and that extraction
      makes infinitely many independent choices: it needs a weak form of the
      axiom of choice and is not provable in ZF alone.
    summary: >
      Finiteness is exactly the impossibility of matching a set with part of
      itself — the property Hilbert's hotel violates, turned into a definition.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-finite
      - foundations.functions.finite-inj-surj-equiv
    relates: []
    tags: []

  - id: foundations.cardinality.def-countable
    kind: definition
    prominence: 1
    title: "Countable and countably infinite"
    statement: >
      Throughout, $\mathbb{N} = \{0, 1, 2, \dots\}$. A set $A$ is countably
      infinite (or denumerable) if $A \approx \mathbb{N}$, countable if it is
      either finite or countably infinite, and uncountable otherwise. In
      particular $\mathbb{N}$ is itself countably infinite, the identity serving
      as the bijection. A bijection $f : \mathbb{N} \to A$ is exactly a listing
      $a_0, a_1, a_2, \dots$ of the elements of $A$, with $a_n = f(n)$, in which
      every element of $A$ appears exactly once; "countably infinite" and "can
      be enumerated without repetition by a sequence" say the same thing. The
      cardinality of a countably infinite set is written $\aleph_0$. A warning
      about usage: some authors reserve "countable" for the infinite case, but
      here every finite set is countable.
    summary: >
      A set is countable when its elements can be arranged in a single list
      indexed by the natural numbers — possibly a finite one.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-finite
      - foundations.functions.def-sequence
    relates: []
    tags: []

  - id: foundations.cardinality.subset-of-countable
    kind: proposition
    prominence: 1
    title: "Subsets of a countable set"
    statement: >
      Every subset of a countable set is countable, and every infinite subset
      of a countably infinite set is countably infinite. Proof: it suffices to
      treat an infinite $S \subseteq \mathbb{N}$, the general case following by
      transporting along a bijection. Define $f : \mathbb{N} \to S$ by recursion:
      $f(0) = \min S$ and $f(n+1) = \min\left(S \setminus \{f(0), \dots,
      f(n)\}\right)$, each minimum existing because the set in question is a
      nonempty subset of $\mathbb{N}$ — nonempty precisely because $S$ is
      infinite — and the well-ordering principle supplies least elements. Then
      $f$ is strictly increasing, hence injective, and $f(n) \ge n$ for every
      $n$, so any $s \in S$ must already occur among $f(0), \dots, f(s)$; thus
      $f$ is onto $S$. So a subset of $\mathbb{N}$ is finite or in bijection
      with $\mathbb{N}$, and there is nothing in between.
    summary: >
      Shrinking a countable set never produces anything bigger, and an infinite
      piece of a countable set is still just a list — enumerate it in increasing
      order.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-countable
      - foundations.induction.well-ordering
      - foundations.induction.def-recursion
    relates: []
    tags: []

  - id: foundations.cardinality.countability-criteria
    kind: proposition
    prominence: 1
    title: "Criteria for countability"
    statement: >
      For a set $A$ consider three statements: (i) $A$ is countable; (ii) there
      is an injection $A \to \mathbb{N}$; (iii) there is a surjection
      $\mathbb{N} \to A$, that is, $A$ can be listed as $a_0, a_1, a_2, \dots$
      with repetitions allowed. Then (i) and (ii) are equivalent for every $A$,
      and all three are equivalent when $A \ne \emptyset$; the nonemptiness is
      needed only because there is no function at all from $\mathbb{N}$ to the
      empty set. Proof: (i) $\Rightarrow$
      (ii) composes a bijection onto $\{1, \dots, n\}$ or onto $\mathbb{N}$ with
      an injection into $\mathbb{N}$; (ii) $\Rightarrow$ (i) because $A$ is
      equinumerous with its image, a subset of $\mathbb{N}$, which is countable;
      (i) $\Rightarrow$ (iii) is the bijection itself when $A$ is countably
      infinite and pads a finite list by repeating its first entry forever when
      $A$ is finite; and (iii) $\Rightarrow$ (ii) sends each $a \in A$ to the least
      $n$ with $a_n = a$. Two consequences are used constantly: a set that
      injects into a countable set is countable, and the image of a countable
      set under any function is countable.
    summary: >
      To prove a set countable you never need a bijection — an injection into
      $\mathbb{N}$, or a listing that is allowed to repeat itself, is enough.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.subset-of-countable
    relates: []
    tags: []

  - id: foundations.cardinality.z-countable
    kind: proposition
    prominence: 0
    title: "ℤ is countable"
    statement: >
      The integers are countably infinite. An explicit bijection
      $f : \mathbb{N} \to \mathbb{Z}$ zig-zags between the signs:
      $f(n) = n/2$ for even $n$ and $f(n) = -(n+1)/2$ for odd $n$, producing the
      enumeration $0, -1, 1, -2, 2, -3, 3, \dots$; its inverse sends $k \ge 0$
      to $2k$ and $k < 0$ to $-2k-1$. What deserves attention is that
      $\mathbb{N}$ is a proper subset of $\mathbb{Z}$ and yet
      $|\mathbb{N}| = |\mathbb{Z}|$: laying a second copy of the naturals
      alongside the first costs nothing in cardinality.
    summary: >
      Interleaving the negatives with the non-negatives lists every integer
      exactly once, so doubling the naturals produces a set of the same size.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-countable
    relates: []
    tags: []

  - id: foundations.cardinality.nxn-countable
    kind: theorem
    prominence: 1
    title: "ℕ × ℕ is countable — the zig-zag argument"
    statement: >
      $\mathbb{N} \times \mathbb{N}$ is countably infinite. Proof (the zig-zag,
      or enumeration by anti-diagonals): group the pairs by the value of
      $m + n$. For each $d \in \mathbb{N}$ only the $d+1$ pairs with $m + n = d$
      occur, so the diagonals can be listed one after another and each is
      exhausted in finitely many steps, giving
      $(0,0)$; then $(1,0), (0,1)$; then $(2,0), (1,1), (0,2)$; and so on, a
      listing in which every pair
      occurs exactly once. Made explicit, the Cantor pairing function
      $\pi(m,n) = \dfrac{(m+n)(m+n+1)}{2} + n$ is a bijection
      $\mathbb{N} \times \mathbb{N} \to \mathbb{N}$: the first term counts the
      pairs on the earlier diagonals and the second gives the position within
      diagonal $m+n$. For countability alone any injection would serve — for
      instance $(m,n) \mapsto 2^m 3^n$, injective by uniqueness of prime
      factorisation. The moral is that a two-dimensional grid of items is still
      a list, provided it is traversed diagonally rather than row by row: going
      along the first row never finishes.
    summary: >
      Sweeping the infinite grid by finite diagonals lists every pair of
      naturals exactly once — the manoeuvre behind almost every countability
      proof that follows.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-countable
    relates: []
    tags: []

  - id: foundations.cardinality.product-countable
    kind: corollary
    prominence: 0
    title: "Products of countable sets"
    statement: >
      If $A$ and $B$ are countable then $A \times B$ is countable, and by
      induction so is any finite product $A_1 \times \cdots \times A_k$ of
      countable sets; in particular $\mathbb{N}^k$ is countable for every
      $k \ge 1$. Proof: if either factor is empty then so is $A \times B$, which
      is then countable; otherwise take surjections
      $g : \mathbb{N} \to A$ and $h : \mathbb{N} \to B$; then
      $(m,n) \mapsto (g(m), h(n))$ is a surjection
      $\mathbb{N} \times \mathbb{N} \to A \times B$, and composing with a
      bijection $\mathbb{N} \to \mathbb{N} \times \mathbb{N}$ gives a surjection
      $\mathbb{N} \to A \times B$. The restriction to finitely many factors is
      essential and not an artefact of the proof: the set of all infinite binary
      sequences, a product of countably many two-element sets, is uncountable.
    summary: >
      Countability survives finite products, because a grid of lists is itself
      a list — but it does not survive infinite products.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.nxn-countable
      - foundations.cardinality.countability-criteria
    relates: []
    tags: []

  - id: foundations.cardinality.q-countable
    kind: theorem
    prominence: 1
    title: "ℚ is countable"
    statement: >
      The rational numbers are countably infinite. Proof: the map
      $\mathbb{Z} \times (\mathbb{Z} \setminus \{0\}) \to \mathbb{Q}$ sending
      $(p,q)$ to $p/q$ is surjective, since every rational is a quotient of
      integers; its domain is a subset of a product of two countable sets and so
      is countable; hence $\mathbb{Q}$ is the image of a countable set under a
      function and is countable. It is infinite because it contains
      $\mathbb{Z}$, so it is countably infinite. This is worth dwelling on
      because it defeats the natural guess: $\mathbb{Q}$ is dense in the line —
      between any two rationals lies another, and every real is a limit of
      rationals — yet the whole of it fits into a single list. Density and
      cardinality have nothing to do with each other.
    summary: >
      Every rational is a pair of integers in disguise, so the rationals can be
      enumerated, densely packed though they are.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.product-countable
      - foundations.cardinality.z-countable
      - foundations.number-systems.def-rationals
    relates: []
    tags: []

  - id: foundations.cardinality.countable-union
    kind: theorem
    prominence: 1
    title: "A countable union of countable sets is countable"
    statement: >
      Let $I$ be a countable set and $(A_i)_{i \in I}$ a family of sets with
      every $A_i$ countable. Then $\bigcup_{i \in I} A_i$ is countable. Proof:
      discard the empty $A_i$ and assume $I \subseteq \mathbb{N}$; for each $i$
      choose a surjection $f_i : \mathbb{N} \to A_i$, which exists because $A_i$
      is countable and nonempty. Then $(i,n) \mapsto f_i(n)$ is a surjection
      from a subset of $\mathbb{N} \times \mathbb{N}$ onto the union, and
      $\mathbb{N} \times \mathbb{N}$ is countable, so the union is countable.
      The word "choose" is doing real work: infinitely many enumerations are
      selected at once, one from each of infinitely many nonempty sets of
      enumerations. This is the axiom of countable choice, and the theorem is
      genuinely unprovable in ZF without it. A union of finitely many countable
      sets needs no such appeal.
    summary: >
      Stacking countably many lists into one long list still gives a list —
      the two-dimensional index being flattened by the zig-zag.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.nxn-countable
      - foundations.cardinality.countability-criteria
      - foundations.sets.indexed-family
    relates: []
    tags: []

  - id: foundations.cardinality.r-uncountable
    kind: theorem
    prominence: 2
    title: "ℝ is uncountable — Cantor's diagonal argument"
    statement: >
      $\mathbb{R}$ is uncountable: no function $f : \mathbb{N} \to \mathbb{R}$
      is surjective, so no listing of the reals can be complete. Proof: it is
      enough to defeat every $f : \mathbb{N} \to [0,1]$. Write each value in
      decimal, $f(n) = 0.d_{n0}d_{n1}d_{n2}\dots$, and define a new number
      $x = 0.e_0e_1e_2\dots$ by taking $e_n = 4$ if $d_{nn} = 5$ and $e_n = 5$
      otherwise. The digits of $x$ all lie in $\{4,5\}$, so the series
      $\sum_{n \ge 0} e_n 10^{-(n+1)}$ converges to a real number in $[0,1]$,
      and $x$ differs from $f(n)$ in the $n$-th decimal place for every $n$.
      Confining the digits to $4$ and $5$ is what makes that conclusion valid:
      two different decimal strings can name the same real only through a tail
      of nines against a tail of zeros, as in $0.4999\dots = 0.5000\dots$, and
      $x$ has neither tail. So $x$ is a real number that $f$ misses. Since
      $[0,1]$ is uncountable and countability passes to subsets, $\mathbb{R}$ is
      uncountable — and uncountable sets therefore exist.
    summary: >
      Any proposed list of the reals can be beaten by a number built to differ
      from the $n$-th entry in its $n$-th digit, so the reals cannot be
      enumerated at all.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.countability-criteria
      - foundations.real.completeness
    relates: []
    tags: []

  - id: foundations.cardinality.def-cardinal-comparison
    kind: definition
    prominence: 1
    title: "Cardinal comparison"
    statement: >
      For sets $A$ and $B$, write $|A| \le |B|$ if there is an injection
      $A \to B$, and $|A| < |B|$ if $|A| \le |B|$ while no bijection
      $A \to B$ exists. The
      relation compares cardinalities rather than sets, because it respects
      equinumerosity: replacing $A$ or $B$ by an equinumerous set does not
      change whether an injection exists, as one may compose with the bijection.
      Immediately $A \subseteq B$ gives $|A| \le |B|$, the inclusion being
      injective, and on finite sets $\le$ reproduces the usual order on
      $\mathbb{N}$. Two things are deliberately not part of the definition: that
      $|A| \le |B|$ and $|B| \le |A|$ together force $|A| = |B|$, which is a
      theorem, and that any two cardinalities are comparable at all, which is
      not provable without the axiom of choice.
    summary: >
      One set is at most as large as another when it can be injected into it —
      "no bigger than" defined by fitting inside, not by counting.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-equinumerous
    relates: []
    tags: []

  - id: foundations.cardinality.cantor-theorem
    kind: theorem
    prominence: 2
    title: "Cantor's theorem"
    statement: >
      For every set $X$, $|X| < |\mathcal{P}(X)|$. Proof: the map
      $x \mapsto \{x\}$ is an injection $X \to \mathcal{P}(X)$, so
      $|X| \le |\mathcal{P}(X)|$. For the strictness, let
      $f : X \to \mathcal{P}(X)$ be any function and put
      $D = \{x \in X : x \notin f(x)\}$, which is a subset of $X$ and hence an
      element of $\mathcal{P}(X)$. If $D = f(a)$ for some $a \in X$, then
      $a \in D$ holds if and only if $a \notin f(a) = D$, which is absurd; so
      $D$ lies outside the image and no $f$ is surjective. In particular there
      is no bijection, and no largest cardinality exists: the tower
      $|X| < |\mathcal{P}(X)| < |\mathcal{P}(\mathcal{P}(X))| < \cdots$ climbs
      without end. The hypotheses are nil — the theorem holds for finite $X$,
      where it is the statement $n < 2^n$, and taking $X = \mathbb{N}$ gives a
      second proof that uncountable sets exist.
    summary: >
      The set of subsets of a set is always strictly bigger than the set —
      so there is no largest infinity, only an endless ladder of them.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-cardinal-comparison
      - foundations.sets.power-set
    relates:
      - id: foundations.sets.russell-paradox
        note: 'The set $D$ of elements not belonging to their own image is Russell''s set relativised to $f$; the same self-reference that makes naive comprehension inconsistent here yields a theorem.'
    tags: []

  - id: foundations.cardinality.diagonalisation
    kind: technique
    prominence: 1
    title: "Diagonalisation"
    statement: >
      Cantor's two theorems are one manoeuvre used twice, and it generalises.
      Suppose each object in play is determined by a function on an index set —
      a real number by its sequence of digits, a subset of $X$ by its
      membership test on $X$ — and suppose a candidate enumeration assigns an
      object $O_i$ to each index $i$. Picture the objects as the rows of a
      table whose $(i,j)$ entry is the $j$-th datum of $O_i$, and construct a
      new object whose $i$-th datum is chosen to differ from the entry at
      $(i,i)$. The result disagrees with every listed object somewhere, so the
      list was incomplete. Applying this to a listing of reals with "differ"
      meaning a different digit gives the uncountability of $\mathbb{R}$;
      applying it to $f : X \to \mathcal{P}(X)$ with "differ" meaning the
      negation of $x \in f(x)$ gives Cantor's theorem. Two checks are never
      skippable: that the diagonal object is a legitimate object of the kind
      being listed, and that differing in one coordinate really makes it a
      different object — the reason the digits $0$ and $9$ have to be avoided.
      The same argument, with programs or formulas indexed by their own codes,
      yields the undecidability of the halting problem and Gödel's
      incompleteness theorems.
    summary: >
      Beat any list by building an object that differs from the $n$-th entry in
      the $n$-th place — the single idea behind uncountability, Cantor's
      theorem, and the classical undecidability results.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.r-uncountable
      - foundations.cardinality.cantor-theorem
    relates: []
    tags: []

  - id: foundations.cardinality.schroder-bernstein
    kind: theorem
    prominence: 1
    title: "Schröder–Bernstein theorem"
    statement: >
      If there is an injection $f : A \to B$ and an injection $g : B \to A$,
      then there is a bijection $A \to B$; that is, $|A| \le |B|$ and
      $|B| \le |A|$ together give $|A| = |B|$. Proof: set
      $C_0 = A \setminus g(B)$, let $C_{n+1} = g(f(C_n))$, and put
      $C = \bigcup_{n \in \mathbb{N}} C_n$. Define $h : A \to B$ by $h(a) = f(a)$
      for $a \in C$ and $h(a) = g^{-1}(a)$ for $a \notin C$; the second clause
      makes sense because $a \notin C$ gives $a \notin C_0$, so $a \in g(B)$,
      and $g$ is a bijection onto its image. Then $h$ is injective, since a
      collision $f(a) = g^{-1}(a')$ with $a \in C$ and $a' \notin C$ would put
      $a' = g(f(a))$ in some $C_{n+1}$; and surjective, since for $b \in B$
      either $g(b) \notin C$, whence $h(g(b)) = b$, or $g(b) \in C_{n+1}$ for
      some $n$, whence $b = f(c)$ for some $c \in C_n$ by injectivity of $g$.
      No form of the axiom of choice is used anywhere.
    summary: >
      Injections in both directions can be spliced into a single bijection, so
      two sets each of which fits inside the other really are the same size.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.def-cardinal-comparison
      - foundations.functions.inverse-iff-bijection
    relates: []
    tags: []

  - id: foundations.cardinality.cardinal-order
    kind: proposition
    prominence: 0
    title: "The order on cardinalities"
    statement: >
      Cardinal comparison is reflexive, since the identity is injective;
      transitive, since a composite of injections is injective; and
      antisymmetric, by the Schröder–Bernstein theorem. So $\le$ partially
      orders cardinalities. Totality is a different matter. That any two sets
      are comparable — for all $A$ and $B$, either $|A| \le |B|$ or
      $|B| \le |A|$ — is not provable in ZF; it follows from the axiom of
      choice, for instance by applying Zorn's lemma to the partial injections
      from $A$ to $B$ ordered by extension and checking that a maximal one must
      be defined on all of $A$ or onto all of $B$, and conversely comparability
      implies the axiom of choice. So with choice the cardinalities are totally
      ordered, and without it two sets may be genuinely incomparable in size.
    summary: >
      "No bigger than" is a partial order on sizes; that it is a total order —
      that any two sets can be compared at all — is precisely as strong as the
      axiom of choice.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.schroder-bernstein
      - foundations.functions.composition-inj-surj
      - foundations.relations.zorn
    relates: []
    tags: []

  - id: foundations.cardinality.continuum-cardinality
    kind: proposition
    prominence: 1
    title: "ℝ is equinumerous with the power set of ℕ"
    statement: >
      $\mathbb{R} \approx \mathcal{P}(\mathbb{N})$; this common cardinality is
      the cardinality of the continuum, written $\mathfrak{c}$ or
      $2^{\aleph_0}$. Proof by Schröder–Bernstein, exhibiting an injection each
      way. First, send $S \subseteq \mathbb{N}$ to
      $\sum_{n \in S} 3^{-(n+1)} \in \mathbb{R}$: this is a base-$3$ expansion
      using only the digits $0$ and $1$, so distinct sets give distinct numbers,
      the ambiguity that would afflict base $2$ being avoided. Second, send
      $x \in \mathbb{R}$ to the set $\{q \in \mathbb{Q} : q < x\}$, injective
      because a rational lies strictly between any two distinct reals; this
      lands in $\mathcal{P}(\mathbb{Q})$, and a bijection
      $\mathbb{Q} \to \mathbb{N}$ induces a bijection
      $\mathcal{P}(\mathbb{Q}) \to \mathcal{P}(\mathbb{N})$. Combined with
      Cantor's theorem this gives a second proof that $\mathbb{R}$ is
      uncountable, since $|\mathbb{N}| < |\mathcal{P}(\mathbb{N})|$.
    summary: >
      A real number carries exactly as much information as a set of naturals —
      which is why the size of the continuum is written $2^{\aleph_0}$.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.schroder-bernstein
      - foundations.cardinality.q-countable
      - foundations.sets.power-set
      - foundations.real.completeness
      - foundations.number-systems.q-dense
    relates: []
    tags: []

  - id: foundations.cardinality.continuum-hypothesis
    kind: axiom
    prominence: 1
    title: "Continuum hypothesis"
    statement: >
      The continuum hypothesis is the assertion that there is no set $A$ with
      $|\mathbb{N}| < |A| < |\mathbb{R}|$ — equivalently, that every uncountable
      subset of $\mathbb{R}$ is equinumerous with $\mathbb{R}$. That
      $|\mathbb{N}| < |\mathbb{R}|$ is a theorem, the diagonal argument; the
      hypothesis is the further claim that nothing sits strictly in between. It
      is neither provable nor refutable from the standard axioms of set theory:
      Gödel showed in 1940 that ZFC together with the continuum hypothesis is
      consistent if ZFC is, and Cohen showed in 1963 that so is ZFC together
      with its negation. The hypothesis is therefore independent of ZFC, and it
      is recorded here as a statement only — nothing else in this subbranch
      assumes it. The generalised continuum hypothesis makes the same claim one
      level up for every infinite set $X$: no cardinality lies strictly between
      $|X|$ and $|\mathcal{P}(X)|$.
    summary: >
      The conjecture that no set is larger than the naturals and smaller than
      the reals — proved in the twentieth century to be undecidable by the
      standard axioms, so neither a theorem nor a falsehood.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.cantor-theorem
      - foundations.cardinality.r-uncountable
    relates: []
    tags: []

  - id: foundations.cardinality.algebraic-countable
    kind: theorem
    prominence: 1
    title: "The algebraic numbers are countable"
    statement: >
      A real or complex number $\alpha$ is algebraic if $p(\alpha) = 0$ for some
      nonzero polynomial $p$ with integer coefficients, and transcendental
      otherwise. The set of algebraic numbers is countably infinite. Proof: a
      polynomial of degree at most $d$ is determined by its coefficient vector
      in $\mathbb{Z}^{d+1}$, which is countable as a finite product of countable
      sets; so the set of nonzero integer polynomials, being the union over
      $d \in \mathbb{N}$ of these countable sets, is countable. Each nonzero
      polynomial of degree $d$ has at most $d$ roots, so the algebraic numbers
      form a countable union of finite sets and are countable. The set is
      infinite because every integer $n$ is algebraic, being a root of $x - n$,
      and so is every rational $p/q$, a root of $qx - p$.
    summary: >
      Every algebraic number is pinned down by a finite list of integers, and
      there are only countably many such lists — so all the roots of all integer
      polynomials together still form a single list.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.countable-union
      - foundations.cardinality.product-countable
      - foundations.cardinality.z-countable
    relates: []
    tags: []

  - id: foundations.cardinality.transcendental-exist
    kind: corollary
    prominence: 1
    title: "Transcendental numbers exist"
    statement: >
      Transcendental real numbers exist; indeed the set of them is uncountable,
      so in the sense of cardinality almost every real number is transcendental.
      Proof: the real algebraic numbers form a countable subset of $\mathbb{R}$
      and $\mathbb{R}$ is uncountable, so they cannot exhaust it and some real is
      transcendental. If moreover the
      transcendental reals were countable, then $\mathbb{R}$, being the union of
      two countable sets, would be countable. Since every rational is
      algebraic, every transcendental is in particular irrational, so the same
      count shows the irrational numbers to be uncountable as well. What is
      striking is that this proof names no transcendental
      number at all — it counts, and concludes existence from a shortage of
      candidates. Exhibiting one is a separate and much harder problem:
      Liouville constructed the first explicit example in 1844, Hermite proved
      $e$ transcendental in 1873, and Lindemann proved $\pi$ transcendental in
      1882, thereby settling the impossibility of squaring the circle.
    summary: >
      There are too few algebraic numbers to fill the real line, so
      transcendentals must exist — an existence proof that produces no example
      and took decades more to make explicit.
    parent: foundations.cardinality
    also_under: []
    requires:
      - foundations.cardinality.algebraic-countable
      - foundations.cardinality.r-uncountable
      - foundations.proof.existence-nonconstructive
    relates: []
    tags: []
