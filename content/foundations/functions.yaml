# foundations.functions — Functions and Maps
# Functions as single-valued total relations; domain/codomain/range, image and
# preimage and their asymmetry, injectivity/surjectivity/bijectivity,
# composition, inverses, restriction, sequences and families, pigeonhole.

nodes:
  - id: foundations.functions
    kind: subbranch
    title: "Functions and Maps"
    summary: >
      Functions as relations, images and preimages, injectivity, surjectivity
      and inverses — the vocabulary every structure-preserving map in later
      branches specialises.
    parent: foundations
    also_under: []
    tags: []

  - id: foundations.functions.def-function
    kind: definition
    prominence: 2
    title: "Function as a relation"
    statement: >
      A function $f$ from a set $A$ to a set $B$, written $f : A \to B$,
      consists of three pieces of data: the domain $A$, the codomain $B$, and a
      graph $\Gamma_f \subseteq A \times B$ subject to one condition — for every
      $a \in A$ there is exactly one $b \in B$ with $(a,b) \in \Gamma_f$. That
      unique $b$ is written $f(a)$. The condition is two separate demands.
      Existence (totality): every element of the domain gets a value, so no
      input may be left unassigned. Uniqueness (single-valuedness): no input
      gets two values. The relation $\{(x,y) \in \mathbb{R} \times \mathbb{R} :
      x = y^2\}$ fails both — nothing is paired with $x = -1$, and two things
      are paired with $x = 1$. Because the domain and codomain are part of the
      data and not recoverable from the graph alone, a "function" is never just
      a formula.
    summary: >
      A rule that assigns to each element of one set exactly one element of
      another — packaged as the pair of sets together with the set of
      input-output pairs, so that "every input once, and only once" is the whole
      content of the definition.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.relations.def-binary-relation
    relates: []
    tags: []

  - id: foundations.functions.def-range
    kind: definition
    prominence: 1
    title: "Range versus codomain"
    statement: >
      The range (or image) of $f : A \to B$ is the set of values actually taken,
      $\operatorname{ran} f = \{ f(a) : a \in A \} \subseteq B$. It is
      determined by $f$; the codomain $B$ is not, being chosen when the function
      is declared, and may be strictly larger. For $f : \mathbb{R} \to
      \mathbb{R}$ with $f(x) = x^2$ the range is $[0,\infty)$ while the codomain
      is $\mathbb{R}$. The domain is likewise part of the declaration, so
      $\operatorname{ran} f$ is empty exactly when $A$ is empty.
    summary: >
      The codomain is where the outputs are allowed to live; the range is where
      they actually land. Conflating the two is the most common source of
      confusion about what "onto" means.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-function
    relates: []
    tags: []

  - id: foundations.functions.def-equality
    kind: definition
    prominence: 0
    title: "Equality of functions"
    statement: >
      Two functions $f$ and $g$ are equal exactly when they have the same
      domain, the same codomain, and $f(a) = g(a)$ for every $a$ in that common
      domain. Equality is therefore extensional — how a value is computed is
      irrelevant, so $f(x) = (x+1)^2$ and $g(x) = x^2 + 2x + 1$ are the same
      function on $\mathbb{R}$. Conversely, changing either set changes the
      function even when the assignment rule is untouched: $x \mapsto x^2$ read
      as $\mathbb{R} \to \mathbb{R}$ and read as $\mathbb{R} \to [0,\infty)$ are
      different functions, and this is exactly the distinction that makes
      surjectivity a meaningful property.
    summary: >
      Same domain, same codomain, same value at every point — nothing about the
      formula matters, and nothing less than all three counts as equality.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-function
    relates: []
    tags: []

  - id: foundations.functions.def-image
    kind: definition
    prominence: 1
    title: "Image of a set"
    statement: >
      For $f : A \to B$ and a subset $S \subseteq A$, the image of $S$ under $f$
      is $f(S) = \{ f(s) : s \in S \} \subseteq B$; equivalently $b \in f(S)$
      iff there exists $s \in S$ with $f(s) = b$. Special cases: $f(A)$ is the
      range, and $f(\emptyset) = \emptyset$. Images are monotone, $S \subseteq
      S' \Rightarrow f(S) \subseteq f(S')$. The notation overloads $f$, which is
      applied to elements of $A$ and here to subsets of $A$; when $A$ itself has
      sets as elements the intended reading must be said out loud.
    summary: >
      Push a whole subset forward through the function and collect what comes
      out. The definition hides an existential quantifier — a point is in the
      image if *some* point of the set maps to it.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-range
      - foundations.logic.quantifier-existential
    relates:
      - id: analysis.svc.ivt
        note: 'IVT is exactly the statement that the image of an interval under a continuous real function is again an interval — set-image constrained by continuity.'
    tags: []

  - id: foundations.functions.def-preimage
    kind: definition
    prominence: 1
    title: "Preimage of a set"
    statement: >
      For $f : A \to B$ and a subset $T \subseteq B$, the preimage (inverse
      image) of $T$ is $f^{-1}(T) = \{ a \in A : f(a) \in T \} \subseteq A$. The
      preimage of a single point, $f^{-1}(\{b\})$, is called the fiber over $b$
      and may be empty. Note the notation: $f^{-1}$ applied to a set is defined
      for every function whatsoever and asserts nothing about invertibility; it
      is a single symbol, not the inverse function evaluated at $T$. When $f$
      does happen to be invertible the two readings agree, which is why the
      clash is tolerated. Preimages are monotone, $T \subseteq T' \Rightarrow
      f^{-1}(T) \subseteq f^{-1}(T')$, and $f^{-1}(B) = A$.
    summary: >
      Pull a subset of the target back to everything that maps into it. Unlike
      the image, this is a plain membership test on one value at a time, and the
      notation $f^{-1}$ here presumes no inverse.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-function
    relates: []
    tags: []

  - id: foundations.functions.def-injective
    kind: definition
    prominence: 1
    title: "Injective function"
    statement: >
      $f : A \to B$ is injective (one-to-one) if distinct inputs have distinct
      outputs: for all $a_1, a_2 \in A$, $f(a_1) = f(a_2) \Rightarrow a_1 =
      a_2$, equivalently $a_1 \ne a_2 \Rightarrow f(a_1) \ne f(a_2)$. The first
      form is the one to use in proofs. Injectivity depends on the domain but
      not on the
      codomain: $x \mapsto x^2$ is not injective on $\mathbb{R}$ and is
      injective on $[0,\infty)$.
    summary: >
      Nothing collides — the function never sends two different points to the
      same place, so an output determines the input it came from.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-function
    relates: []
    tags: []

  - id: foundations.functions.def-surjective
    kind: definition
    prominence: 1
    title: "Surjective function"
    statement: >
      $f : A \to B$ is surjective (onto) if every element of the codomain is
      hit: for every $b \in B$ there exists $a \in A$ with $f(a) = b$.
      Equivalently $\operatorname{ran} f = B$, i.e. the range exhausts the
      codomain. Unlike injectivity this
      depends on the declared codomain, so it is a property of the function as a
      triple and not of its assignment rule: $x \mapsto x^2$ is not surjective
      as a map $\mathbb{R} \to \mathbb{R}$ but is surjective as a map
      $\mathbb{R} \to [0,\infty)$.
    summary: >
      Nothing is missed — every allowed output value is actually achieved, which
      is a statement about the codomain you chose as much as about the rule.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-range
    relates: []
    tags: []

  - id: foundations.functions.def-bijective
    kind: definition
    prominence: 1
    title: "Bijective function"
    statement: >
      $f : A \to B$ is bijective (a bijection, or a one-to-one correspondence)
      if it is both injective and surjective: for every $b \in B$ there is
      exactly one $a \in A$ with $f(a) = b$.
      A bijection is precisely a perfect pairing of the elements of $A$ with the
      elements of $B$. Both halves are needed and neither implies the other:
      $n \mapsto n + 1$ on $\mathbb{N}$ is injective but not surjective, and
      $x \mapsto x^3 - x$ on $\mathbb{R}$ is surjective but not injective.
    summary: >
      Exactly one input per output: the two sets are matched up element for
      element with nothing left over on either side.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-injective
      - foundations.functions.def-surjective
    relates: []
    tags: []

  - id: foundations.functions.image-set-ops
    kind: proposition
    prominence: 1
    title: "Image versus union and intersection"
    statement: >
      Let $f : A \to B$ and $S, S' \subseteq A$. Then $f(S \cup S') = f(S) \cup
      f(S')$, but for intersections only the inclusion $f(S \cap S') \subseteq
      f(S) \cap f(S')$ holds, and it can be strict: for $f(x) = x^2$ on
      $\mathbb{R}$ with $S = \{-1\}$ and $S' = \{1\}$ the left side is empty
      while the right side is $\{1\}$. Similarly only $f(S) \setminus f(S')
      \subseteq f(S \setminus S')$ holds in general. Equality
      $f(S \cap S') = f(S) \cap f(S')$ for all $S, S'$ holds exactly when $f$ is
      injective. The union statement extends to any number of subsets, and so
      does the one-sided intersection inclusion.
    summary: >
      Taking images respects unions perfectly but degrades to a one-way
      inclusion for intersections — and injectivity is exactly what repairs it.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-image
      - foundations.functions.def-injective
      - foundations.sets.def-union
      - foundations.sets.def-intersection
      - foundations.sets.def-difference
    relates: []
    tags: []

  - id: foundations.functions.preimage-set-ops
    kind: proposition
    prominence: 1
    title: "Preimage commutes with all set operations"
    statement: >
      Let $f : A \to B$ and $T, T' \subseteq B$. Then $f^{-1}(T \cup T') =
      f^{-1}(T) \cup f^{-1}(T')$, $f^{-1}(T \cap T') = f^{-1}(T) \cap
      f^{-1}(T')$, $f^{-1}(B \setminus T) = A \setminus f^{-1}(T)$, and
      $f^{-1}(T \setminus T') = f^{-1}(T) \setminus f^{-1}(T')$. No hypothesis
      on $f$ is needed, and the same holds for the union of any family of
      subsets and the intersection of any nonempty one. Each identity is the
      observation that membership of $a$
      in the left side and in the right side unwinds to the same statement about
      the single element $f(a)$ — for instance $a \in f^{-1}(T \cap T')$ says
      $f(a) \in T$ and $f(a) \in T'$, which is the right side verbatim.
    summary: >
      Pulling sets back through a function preserves unions, intersections,
      complements and differences exactly — no conditions, no lost equalities.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-preimage
      - foundations.sets.def-union
      - foundations.sets.def-intersection
      - foundations.sets.def-difference
    relates: []
    tags: []

  - id: foundations.functions.image-preimage-roundtrip
    kind: proposition
    prominence: 1
    title: "Round trips of image and preimage"
    statement: >
      Let $f : A \to B$, $S \subseteq A$ and $T \subseteq B$. Then
      $S \subseteq f^{-1}(f(S))$, because $f(s) \in f(S)$ for every $s \in S$;
      and $f(f^{-1}(T)) = T \cap f(A)$, hence $f(f^{-1}(T)) \subseteq T$, since
      $b$ lies in the left side exactly when $b = f(a)$ for some $a$ with
      $f(a) \in T$. Neither inclusion can be reversed in general: for
      $f(x) = x^2$ on $\mathbb{R}$, $S = \{1\}$ gives $f^{-1}(f(S)) =
      \{-1, 1\}$, and $T = \{-1\}$ gives $f(f^{-1}(T)) = \emptyset$. Moreover
      $S = f^{-1}(f(S))$ for every $S \subseteq A$ exactly when $f$ is
      injective, and $f(f^{-1}(T)) = T$ for every $T \subseteq B$ exactly when
      $f$ is surjective — the latter because $T \cap f(A) = T$ for all $T$ says
      precisely that $f(A) = B$.
    summary: >
      Pushing a set forward and pulling it back does not return you to where you
      started: you can only gain points on the way out and only lose them on the
      way back, and the two failures are repaired by injectivity and by
      surjectivity respectively.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-image
      - foundations.functions.def-preimage
      - foundations.functions.def-injective
      - foundations.functions.def-surjective
      - foundations.sets.def-intersection
    relates: []
    tags: []

  - id: foundations.functions.image-preimage-asymmetry
    kind: intuition
    prominence: 1
    title: "Why image and preimage behave differently"
    statement: >
      The asymmetry has one source: $a \in f^{-1}(T)$ is a condition on the
      single value $f(a)$, so it inherits every Boolean operation intact, while
      $b \in f(S)$ is an existential claim over all of $S$, and $\exists$
      distributes over "or" but not over "and" or negation. Two subsets can meet
      the same output through different points, which is exactly how $f(S \cap
      S')$ loses elements that $f(S) \cap f(S')$ keeps. The same one source
      explains the two round trips, where the existential step is again the one
      that leaks, and why the repairs there are injectivity and surjectivity
      rather than anything about Boolean operations. Practical consequence: when
      a proof has a choice, push the problem through the preimage.
    summary: >
      Preimage is a pointwise membership test and image is a search — that
      single difference is behind every place the two constructions fail to
      match, so a proof with a choice should take the preimage route.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.image-set-ops
      - foundations.functions.preimage-set-ops
      - foundations.functions.image-preimage-roundtrip
    relates: []
    tags: []

  - id: foundations.functions.def-composition
    kind: definition
    prominence: 1
    title: "Composition of functions"
    statement: >
      Let $f : A \to B$ and $g : B \to C$, so that the codomain of $f$ is the
      domain of $g$. Their composite $g \circ f : A \to C$ is defined by
      $(g \circ f)(a) = g(f(a))$; its domain is $A$ and its codomain is $C$.
      The matching hypothesis is what makes the definition legal — given only
      that $f(a)$ lies in the domain of $g$ for every $a \in A$, one first
      replaces $f$ by the same assignment rule declared with that domain as its
      codomain. The notation runs right to left: in $g \circ f$ the function
      $f$ acts first.
    summary: >
      Do one function, then feed the result into the next — legal exactly when
      the first function's outputs are where the second function's inputs live.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-function
    relates: []
    tags: []

  - id: foundations.functions.composition-associative
    kind: proposition
    prominence: 0
    title: "Composition is associative but not commutative"
    statement: >
      For $f : A \to B$, $g : B \to C$ and $h : C \to D$ one has
      $h \circ (g \circ f) = (h \circ g) \circ f$. Proof: both sides are
      functions $A \to D$, and both send $a \mapsto h(g(f(a)))$, so they are
      equal as functions; the common value is written $h \circ g \circ f$
      without brackets. Commutativity fails badly — $f \circ g$ need not even be
      defined, and when both composites exist they usually differ: for
      $f(x) = x + 1$ and $g(x) = x^2$ on $\mathbb{R}$, $(g \circ f)(x) =
      (x+1)^2$ while $(f \circ g)(x) = x^2 + 1$.
    summary: >
      Bracketing a chain of functions never matters, but the order always does.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-composition
      - foundations.functions.def-equality
    relates: []
    tags: []

  - id: foundations.functions.composition-inj-surj
    kind: proposition
    prominence: 0
    title: "Composition and injectivity/surjectivity"
    statement: >
      Let $f : A \to B$ and $g : B \to C$. If $f$ and $g$ are both injective
      then $g \circ f$ is injective; if both are surjective then $g \circ f$ is
      surjective; hence a composite of bijections is a bijection. The converses
      are only partial, and in a fixed direction: if $g \circ f$ is injective
      then $f$ is injective (but $g$ need not be), and if $g \circ f$ is
      surjective then $g$ is surjective (but $f$ need not be). Both partial
      converses are sharp — take $A = \{1\}$, $B = \{1,2\}$, $C = \{1\}$ with
      $f(1) = 1$ and $g$ the unique map $B \to C$: the composite is a bijection,
      yet $g$ is not injective and $f$ is not surjective.
    summary: >
      Injectivity and surjectivity survive composition, and can be read back off
      a composite only for the first and the last map respectively.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-composition
      - foundations.functions.def-bijective
    relates: []
    tags: []

  - id: foundations.functions.def-identity
    kind: definition
    prominence: 0
    title: "Identity map"
    statement: >
      For any set $A$ the identity map $\mathrm{id}_A : A \to A$ is defined by
      $\mathrm{id}_A(a) = a$ for every $a \in A$. It is
      the two-sided neutral element for composition: for every $f : A \to B$,
      $f \circ \mathrm{id}_A = f = \mathrm{id}_B \circ f$. Note that the
      identity is tied to its set — $\mathrm{id}_A$ and $\mathrm{id}_B$ are
      different functions for $A \ne B$ — which is what makes the two equations
      above two different statements.
    summary: >
      The do-nothing function on a set, and the reason composition has a unit:
      composing with it on either side changes nothing.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-composition
    relates: []
    tags: []

  - id: foundations.functions.def-inclusion
    kind: definition
    prominence: 0
    title: "Inclusion map"
    statement: >
      For $S \subseteq A$ the inclusion map $\iota_S : S \to A$ is defined by
      $\iota_S(s) = s$. It has the same assignment rule as an identity map but a
      larger codomain, so $\iota_S = \mathrm{id}_A$ only when $S = A$; this is
      the cleanest illustration of why the codomain is part of the data. Every
      inclusion is injective, and $\iota_S$ is surjective exactly when $S = A$.
    summary: >
      "Regard an element of a subset as an element of the whole set" made into
      an actual function — the identity rule with a bigger codomain.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-identity
      - foundations.functions.def-injective
      - foundations.functions.def-surjective
    relates: []
    tags: []

  - id: foundations.functions.def-restriction
    kind: definition
    prominence: 1
    title: "Restriction and extension"
    statement: >
      For $f : A \to B$ and $S \subseteq A$, the restriction of $f$ to $S$ is
      the function $f|_S : S \to B$ with $f|_S(s) = f(s)$; equivalently
      $f|_S = f \circ \iota_S$. Going the other way, a function $g : A' \to B$
      with $A \subseteq A'$ is an extension of $f$ if $g(a) = f(a)$ for every
      $a \in A$. The two operations are not symmetric: the restriction to a
      given $S$ exists and is unique, whereas extensions to a given $A'$ may
      fail to exist under extra constraints and are otherwise far from unique.
      Restricting can create properties the original lacked — $\sin$ is not
      injective on $\mathbb{R}$ but its restriction to $[-\pi/2, \pi/2]$ is,
      which is how the inverse trigonometric functions are defined at all.
    summary: >
      Shrink a function's domain and you get a new function for free; enlarge it
      and you are making a choice that may not exist and is rarely unique.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-inclusion
    relates: []
    tags: []

  - id: foundations.functions.def-inverse
    kind: definition
    prominence: 1
    title: "Inverse function"
    statement: >
      A function $g : B \to A$ is a (two-sided) inverse of $f : A \to B$ if
      $g \circ f = \mathrm{id}_A$ and $f \circ g = \mathrm{id}_B$. An inverse,
      when it exists, is unique: if $g$ and $h$ are both inverses then
      $g = g \circ \mathrm{id}_B = g \circ (f \circ h) = (g \circ f) \circ h =
      \mathrm{id}_A \circ h = h$, using associativity. One therefore writes
      $f^{-1}$ for the inverse and calls $f$ invertible. Both equations are
      required: each alone is a strictly weaker condition.
    summary: >
      A function that undoes $f$ in both directions — and there is at most one
      such function, which is why the notation $f^{-1}$ is unambiguous.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-identity
      - foundations.functions.composition-associative
    relates: []
    tags: []

  - id: foundations.functions.inverse-iff-bijection
    kind: theorem
    prominence: 2
    title: "Invertible ⇔ bijective"
    statement: >
      A function $f : A \to B$ has a two-sided inverse if and only if it is
      bijective. Proof. If $g$ is an inverse then $g \circ f = \mathrm{id}_A$
      forces $f$ injective, since $f(a_1) = f(a_2)$ gives $a_1 = g(f(a_1)) =
      g(f(a_2)) = a_2$; and $f \circ g = \mathrm{id}_B$ forces $f$ surjective,
      since every $b$ equals $f(g(b))$. Conversely, if $f$ is bijective then for
      each $b \in B$ surjectivity supplies at least one $a$ with $f(a) = b$ and
      injectivity makes it unique, so $g(b) = a$ is a well-defined function
      $B \to A$, and it satisfies both equations by construction. Moreover
      $f^{-1}$ is itself a bijection and $(f^{-1})^{-1} = f$.
    summary: >
      A function can be undone exactly when it pairs the two sets up perfectly —
      the existence of an inverse and the "exactly one input per output"
      condition are the same statement in different clothing.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-inverse
      - foundations.functions.def-bijective
    relates: []
    tags: []

  - id: foundations.functions.inverse-of-composite
    kind: corollary
    prominence: 0
    title: "Inverse of a composite"
    statement: >
      If $f : A \to B$ and $g : B \to C$ are bijections then $g \circ f$ is a
      bijection and $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$ — note the reversed
      order. Proof: $(f^{-1} \circ g^{-1}) \circ (g \circ f) = f^{-1} \circ
      \mathrm{id}_B \circ f = \mathrm{id}_A$ and symmetrically on the other
      side, so $f^{-1} \circ g^{-1}$ is an inverse of $g \circ f$, which is
      unique. Writing $f^{-1} \circ g^{-1}$ in the other order is usually not
      even a legal composite.
    summary: >
      Undoing two steps means undoing the last one first — socks before shoes,
      shoes off before socks.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.composition-inj-surj
      - foundations.functions.inverse-iff-bijection
    relates: []
    tags: []

  - id: foundations.functions.one-sided-inverses
    kind: proposition
    prominence: 0
    title: "One-sided inverses"
    statement: >
      Let $f : A \to B$. A left inverse is a $g : B \to A$ with
      $g \circ f = \mathrm{id}_A$; a right inverse is a $g : B \to A$ with
      $f \circ g = \mathrm{id}_B$. Assume $A \ne \emptyset$, a hypothesis that
      matters only in the degenerate case of an empty domain. Then $f$ has a
      left inverse if and only if $f$ is injective, and $f$ has a right inverse
      if and only if $f$ is surjective. In the surjective direction one must
      pick a
      single element from each nonempty fiber $f^{-1}(\{b\})$, which for an
      infinite codomain is an application of the axiom of choice. Neither
      one-sided inverse need be unique — any $g$ extending the correspondence
      arbitrarily off $\operatorname{ran} f$ is again a left inverse — and $f$
      has both kinds at once exactly when it is bijective, in which case they
      coincide.
    summary: >
      Half of invertibility on each side: a function can be undone from the left
      exactly when it loses no information, and from the right exactly when it
      reaches everything.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.inverse-iff-bijection
      - foundations.functions.def-preimage
    relates: []
    tags: []

  - id: foundations.functions.def-sequence
    kind: definition
    prominence: 1
    title: "Sequence as a function"
    statement: >
      A sequence of elements of a set $X$ is a function $x : \mathbb{N} \to X$.
      The only novelty is notation: one writes $x_n$ for $x(n)$ and denotes the
      whole function by $(x_n)_{n \in \mathbb{N}}$. A finite sequence, or
      $n$-tuple, is the same thing with domain $\{1, 2, \dots, n\}$. Reading a
      sequence as a function keeps two objects apart that the informal notation
      blurs: the sequence itself, which records order and repetition, and its
      range $\{x_n : n \in \mathbb{N}\}$, which does not — the sequence
      $1, 0, 1, 0, \dots$ has an infinite domain and a two-element range.
    summary: >
      A list indexed by the natural numbers is just a function defined on them,
      which is why a sequence and the set of its terms are different objects.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-range
    relates: []
    tags: []

  - id: foundations.functions.pigeonhole
    kind: theorem
    prominence: 2
    title: "Pigeonhole principle"
    statement: >
      Call a set finite with $n$ elements, written $|A| = n$, when there is a
      bijection $A \to \{1, 2, \dots, n\}$. Let $A$ and $B$ be finite with
      $|A| > |B|$. Then no function $f : A \to B$ is injective: some $b \in B$
      has $|f^{-1}(\{b\})| \ge 2$. Equivalently, in contrapositive form, if an
      injection $A \to B$ between finite sets exists then $|A| \le |B|$.
      Generalized form: if $|A| = m$ and $|B| = n \ge 1$, then for every
      function $f : A \to B$ some fiber $f^{-1}(\{b\})$ has at least $m/n$
      elements, hence at least the least
      integer that is $\ge m/n$ — because the fibers partition $A$, so if every
      one of the $n$ fibers had fewer than $m/n$ elements their sizes would sum
      to less than $m$.
    summary: >
      More objects than boxes means some box holds two — stated for functions,
      the assertion that no map from a bigger finite set to a smaller one can
      avoid collisions.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.def-bijective
      - foundations.functions.def-preimage
    relates: []
    tags: []

  - id: foundations.functions.finite-inj-surj-equiv
    kind: theorem
    prominence: 1
    title: "Injective ⇔ surjective on finite sets of equal size"
    statement: >
      Let $A$ and $B$ be finite sets with $|A| = |B| = n$ and let
      $f : A \to B$. Then $f$ is injective if and only if $f$ is surjective, and
      either condition alone makes $f$ bijective. Proof: the $n$ fibers over the
      points of $B$ partition $A$ and their sizes sum to $n$; injectivity says
      each has at most one element, surjectivity says each has at least one, and
      with $n$ fibers summing to $n$ either condition forces every fiber to be a
      single point. Finiteness is essential: on the positive integers
      $\{1, 2, 3, \dots\}$ the map $n \mapsto n+1$ is injective but not
      surjective, and the map sending $1$ to $1$ and $n$ to $n-1$ for
      $n \ge 2$ is surjective but not injective. That this can happen is
      precisely what distinguishes infinite sets.
    summary: >
      For a map between finite sets of the same size the two conditions
      collapse into one — a counting fact that fails, and fails
      characteristically, for infinite sets.
    parent: foundations.functions
    also_under: []
    requires:
      - foundations.functions.pigeonhole
    relates: []
    tags: []
