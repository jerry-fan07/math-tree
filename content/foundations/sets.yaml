# foundations.sets — Naive Set Theory
# Membership and set-builder notation, subsets and the double-inclusion proof
# shape, the Boolean operations and their algebra, indexed families, power sets,
# ordered pairs and products, partitions, and Russell's paradox.

nodes:
  - id: foundations.sets
    kind: subbranch
    title: "Naive Set Theory"
    summary: >
      Membership, the set operations, power sets and products — the universal
      container in which every other object of mathematics is defined.
    parent: foundations
    also_under: []
    tags: []

  - id: foundations.sets.def-set-membership
    kind: definition
    prominence: 2
    title: "Set and membership"
    statement: >
      A set is a collection of objects, called its elements; $x \in A$ asserts
      that $x$ is an element of $A$, and $x \notin A$ that it is not.
      Membership is the only primitive notion: a set is determined entirely by
      which objects belong to it — the principle of extensionality — so
      $\{1,2,3\}$, $\{3,2,1\}$ and $\{1,1,2,3\}$ are one and the same set, order
      and repetition carrying no information. A set with finitely many elements
      may be named by listing them inside braces (roster notation). Elements may
      themselves be sets, and the levels must be kept apart: $\{1, \{1\}\}$ is a
      two-element set whose members are the number $1$ and the one-element set
      $\{1\}$.
    summary: >
      The primitive notion the whole subject rests on: a set is nothing more
      than what belongs to it, and "belongs to" is the only relation there is.
    parent: foundations.sets
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: foundations.sets.set-builder
    kind: definition
    prominence: 1
    title: "Set-builder notation"
    statement: >
      Given a set $A$ and a property $P$, the notation $\{x \in A : P(x)\}$
      denotes the set whose elements are exactly those $x \in A$ for which
      $P(x)$ holds; membership unfolds by definition, as
      $y \in \{x \in A : P(x)\}$ precisely when $y \in A$ and $P(y)$. The colon
      is read "such that" and is often written as a bar,
      $\{x \in A \mid P(x)\}$. A companion form, $\{f(x) : x \in A\}$, names the
      set of all values $f(x)$ as $x$ ranges over $A$. The restriction to a set
      $A$ already in hand is not decoration: carving a subset out of an existing
      set is the only form of set formation by property that naive set theory
      can safely allow.
    summary: >
      Naming a set by the property its elements satisfy instead of listing them,
      always cut out of a set already known to exist.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-set-membership
      - foundations.logic.def-predicate
    relates: []
    tags: []

  - id: foundations.sets.def-subset
    kind: definition
    prominence: 1
    title: "Subset"
    statement: >
      $A$ is a subset of $B$, written $A \subseteq B$, if every element of $A$
      is an element of $B$: for every $x$, $x \in A$ implies $x \in B$. To
      refute $A \subseteq B$ it suffices to exhibit one $x$ with $x \in A$ and
      $x \notin B$. $A$ is a proper subset, $A \subsetneq B$, if moreover
      $A \ne B$. Containment is reflexive ($A \subseteq A$) and transitive
      ($A \subseteq B$ and $B \subseteq C$ give $A \subseteq C$), but it is not
      a total order: two sets can each fail to contain the other. It must not be
      confused with membership — $\{1\} \subseteq \{1,2\}$ holds while
      $\{1\} \in \{1,2\}$ does not.
    summary: >
      One set sits inside another when nothing in the first escapes the second;
      this is the order relation that organizes every construction below.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-set-membership
      - foundations.logic.quantifier-universal
    relates: []
    tags: []

  - id: foundations.sets.set-equality
    kind: proposition
    prominence: 1
    title: "Set equality as mutual containment"
    statement: >
      For all sets $A$ and $B$: $A = B$ if and only if $A \subseteq B$ and
      $B \subseteq A$. Proof: if $A = B$ then each inclusion is immediate.
      Conversely, suppose both inclusions hold; then $x \in A$ implies $x \in B$
      and $x \in B$ implies $x \in A$, so $A$ and $B$ have exactly the same
      elements, and by extensionality they are the same set. The two inclusions
      are independent claims and both must be checked — $\{1\} \subseteq
      \{1,2\}$ holds while the reverse containment fails.
    summary: >
      Equality of sets is antisymmetry of containment: two sets are the same set
      exactly when each of them contains the other.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-subset
      - foundations.proof.biconditional
    relates: []
    tags: []

  - id: foundations.sets.double-inclusion
    kind: technique
    prominence: 1
    title: "Proof by double inclusion"
    statement: >
      To prove an asserted identity $A = B$ between two described sets, prove
      the two containments separately. For $A \subseteq B$: take an arbitrary
      object $x$, assume $x \in A$, unfold that membership through the
      definitions of the operations that build $A$, and deduce the conditions
      defining $B$, concluding $x \in B$. Then run the same argument in the
      other direction for $B \subseteq A$. Nothing about $x$ beyond its assumed
      membership may be used, which is exactly what makes the single argument
      valid for every element at once. When every unfolding step is an "if and
      only if", the two halves collapse into one chain of equivalences and a
      single pass suffices; the two-pass form is nonetheless the safe default,
      because steps that read as reversible frequently are not. The same
      technique proves a containment alone — one pass, no return trip.
    summary: >
      The standard shape of a set-identity proof: chase an arbitrary element
      from one side to the other, then chase it back.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.set-equality
      - foundations.proof.universal-proof
    relates: []
    tags: []

  - id: foundations.sets.empty-set
    kind: definition
    prominence: 1
    title: "Empty set"
    statement: >
      The empty set $\emptyset$ is the set with no elements: $x \notin \emptyset$
      for every $x$. It is unique, because any two sets with no elements have
      the same elements and so are equal, which is why one says "the" empty set.
      It is a subset of every set $A$: the requirement that every element of
      $\emptyset$ lie in $A$ has no instances that could fail, so it holds
      vacuously. A set is called nonempty when it is not $\emptyset$, that is,
      when it has at least one element. Finally, $\emptyset$ and $\{\emptyset\}$
      are different sets — the first has no elements, the second has exactly
      one, namely $\emptyset$.
    summary: >
      The set with nothing in it: unique, contained in everything, and not the
      same thing as the one-element box that holds it.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-subset
      - foundations.logic.vacuous-truth
    relates: []
    tags: []

  - id: foundations.sets.def-union
    kind: definition
    prominence: 1
    title: "Union"
    statement: >
      The union of $A$ and $B$ is
      $A \cup B = \{x : x \in A \text{ or } x \in B\}$, the set whose elements
      are exactly those objects lying in at least one of the two. The "or" is
      inclusive, and an object in both sets is an element of the union once, not
      twice: $\{1,2\} \cup \{2,3\} = \{1,2,3\}$. The braces here are not the
      safe separation form: unlike intersection and difference, the union is not
      carved out of a set already in hand, so forming it is a construction in
      its own right, admitted alongside separation rather than derived from it.
      Unfolded, $x \in A \cup B$ if and only if $x \in A$ or $x \in B$, and this
      equivalence is the only fact about union that proofs ever use.
    summary: >
      Everything from either set, pooled into one — membership in the union asks
      only that an object appear somewhere.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.set-builder
    relates: []
    tags: []

  - id: foundations.sets.def-intersection
    kind: definition
    prominence: 1
    title: "Intersection"
    statement: >
      The intersection of $A$ and $B$ is $A \cap B = \{x \in A : x \in B\}$, the
      set of objects lying in both: $x \in A \cap B$ if and only if $x \in A$
      and $x \in B$. So $\{1,2\} \cap \{2,3\} = \{2\}$, while $\{1\}$ and
      $\{2\}$ have an intersection with no elements at all — two sets need have
      nothing in common, which is the one way intersection differs sharply from
      union. Note that the definition is a separation inside $A$, so it builds
      nothing larger than a set already given.
    summary: >
      Exactly the objects the two sets have in common — the overlap, which may
      turn out to be nothing at all.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.set-builder
    relates: []
    tags: []

  - id: foundations.sets.def-difference
    kind: definition
    prominence: 1
    title: "Set difference"
    statement: >
      The difference of $A$ and $B$ is $A \setminus B = \{x \in A : x \notin B\}$,
      the elements of $A$ that are not elements of $B$; it is also written
      $A - B$ and read "$A$ minus $B$". Nothing requires $B$ to be contained in
      $A$, and elements of $B$ lying outside $A$ are simply ignored, so
      $\{1,2\} \setminus \{2,3\} = \{1\}$. The operation is not symmetric:
      $A \setminus B$ and $B \setminus A$ are different sets in general, the
      first consisting of what only $A$ has and the second of what only $B$ has.
      No element of $A \setminus B$ lies in $B$, and every element of it lies in
      $A$.
    summary: >
      What is left of one set after deleting everything the other set contains —
      an asymmetric operation, unlike union and intersection.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.set-builder
    relates: []
    tags: []

  - id: foundations.sets.def-complement
    kind: definition
    prominence: 1
    title: "Complement relative to a universe"
    statement: >
      Fix a set $U$, called the universe for the discussion, and consider only
      sets $A \subseteq U$. The complement of $A$ in $U$ is
      $A^c = U \setminus A = \{x \in U : x \notin A\}$, also written $A'$ or
      $\overline{A}$. Then $x \in A^c$ if and only if $x \in U$ and $x \notin A$,
      and complementation is an involution, $(A^c)^c = A$, since deleting twice
      restores what was deleted. The universe is not optional and not canonical:
      there is no absolute complement — "everything not in $A$" does not
      determine a set — so $A^c$ is meaningless until $U$ is named, and the
      complement of $\{1,2\}$ inside $\{1,2,3\}$ differs from its complement
      inside $\mathbb{Z}$.
    summary: >
      Everything in the ambient set that is not in the given one; the ambient
      set must be fixed in advance, because "everything else" is not a set.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-difference
      - foundations.sets.def-subset
    relates: []
    tags: []

  - id: foundations.sets.algebra-of-sets
    kind: proposition
    prominence: 1
    title: "Algebra of union and intersection"
    statement: >
      For all sets $A$, $B$, $C$, union and intersection are commutative,
      $A \cup B = B \cup A$ and $A \cap B = B \cap A$; associative,
      $(A \cup B) \cup C = A \cup (B \cup C)$ and
      $(A \cap B) \cap C = A \cap (B \cap C)$, so an unbracketed string of one
      operation is unambiguous; and idempotent,
      $A \cup A = A \cap A = A$. The empty set is an identity for union and an
      annihilator for intersection: $A \cup \emptyset = A$ and
      $A \cap \emptyset = \emptyset$. Absorption links the two operations,
      $A \cup (A \cap B) = A$ and $A \cap (A \cup B) = A$. Containment is
      expressible through either one: $A \cap B \subseteq A \subseteq A \cup B$
      always, and $A \subseteq B$ holds if and only if $A \cup B = B$, if and
      only if $A \cap B = A$. Every identity here is proved by unfolding
      membership on both sides, where it becomes the corresponding property of
      "and" and "or".
    summary: >
      The bookkeeping laws — commutativity, associativity, idempotence,
      absorption, and the role of $\emptyset$ as a zero — that let set
      expressions be rearranged without further thought.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-union
      - foundations.sets.def-intersection
      - foundations.sets.empty-set
      - foundations.logic.distributive-laws
    relates: []
    tags: []

  - id: foundations.sets.distributive-laws
    kind: proposition
    prominence: 1
    title: "Distributive laws for sets"
    statement: >
      For all sets $A$, $B$, $C$:
      $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$ and
      $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$. Each operation
      distributes over the other, unlike arithmetic, where multiplication
      distributes over addition but not conversely. Proof of the first by double
      inclusion: if $x \in A \cap (B \cup C)$ then $x \in A$ and $x$ lies in $B$
      or in $C$, so $x$ lies in $A \cap B$ or in $A \cap C$, hence in their
      union; conversely, if $x$ lies in $A \cap B$ or in $A \cap C$, then in
      either case $x \in A$ and $x$ lies in $B \cup C$, so
      $x \in A \cap (B \cup C)$. The second law is proved the same way with the
      roles of the two operations exchanged.
    summary: >
      Intersection distributes over union and union distributes over
      intersection — the symmetry that makes set algebra better behaved than
      ordinary arithmetic.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-union
      - foundations.sets.def-intersection
      - foundations.sets.double-inclusion
      - foundations.logic.distributive-laws
    relates: []
    tags: []

  - id: foundations.sets.de-morgan
    kind: proposition
    prominence: 1
    title: "De Morgan's laws for sets"
    statement: >
      Relative to any set $C$:
      $C \setminus (A \cup B) = (C \setminus A) \cap (C \setminus B)$ and
      $C \setminus (A \cap B) = (C \setminus A) \cup (C \setminus B)$. Inside a
      fixed universe $U$ containing $A$ and $B$ these read
      $(A \cup B)^c = A^c \cap B^c$ and $(A \cap B)^c = A^c \cup B^c$. Proof of
      the first by double inclusion: $x \in C \setminus (A \cup B)$ says $x \in
      C$ and $x$ lies in neither $A$ nor $B$, which says precisely that $x \in
      C \setminus A$ and $x \in C \setminus B$; the second is the same argument
      with "and" and "or" exchanged, using that failing to be in both means
      failing to be in at least one. The content is that complementation
      interchanges union and intersection, so it converts any identity of set
      algebra into a dual identity.
    summary: >
      Complementation swaps union with intersection: what lies outside a union
      lies outside both parts, and what lies outside an intersection lies
      outside at least one.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-union
      - foundations.sets.def-intersection
      - foundations.sets.def-complement
      - foundations.sets.double-inclusion
      - foundations.logic.de-morgan
    relates: []
    tags: []

  - id: foundations.sets.intuition-venn
    kind: intuition
    prominence: 0
    title: "Venn diagrams as case analysis"
    statement: >
      Draw each of $n$ sets as a region inside a rectangle standing for the
      universe, positioned so that every combination of "inside" and "outside"
      is realized by some region of the picture. Those $2^n$ regions are the
      atoms of the algebra generated by the sets: each corresponds to one
      complete answer to "which of the $n$ sets does this element belong to",
      every expression built from $\cup$, $\cap$ and complement shades a union
      of atoms, and two expressions are equal for all sets exactly when they
      shade the same atoms. A Venn diagram is therefore not a picture but a
      compressed element chase, and it is a legitimate proof only while the
      diagram is drawn in full generality — a picture that accidentally makes
      two sets disjoint or nested proves nothing. Circles suffice for
      $n \le 3$; for $n \ge 4$ no arrangement of circles realizes all $2^n$
      regions, and the diagram must be abandoned for symbols.
    summary: >
      The overlapping-regions picture is exactly the case analysis over which
      sets an element belongs to — trustworthy while the diagram is fully
      general, and only up to three or so sets.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-union
      - foundations.sets.def-intersection
      - foundations.sets.def-complement
      - foundations.proof.cases
    relates: []
    tags: []

  - id: foundations.sets.indexed-family
    kind: definition
    prominence: 0
    title: "Indexed family of sets"
    statement: >
      An indexed family of sets $\{A_i\}_{i \in I}$ is an assignment of a set
      $A_i$ to each element $i$ of a set $I$, the index set. The indices are
      labels and nothing more: $I$ need not be a set of numbers, it may be
      infinite or uncountable, and the same set may be assigned to many indices,
      so a family is not the same thing as the collection of its distinct
      values. A finite list $A_1, \ldots, A_n$ is the case $I = \{1, \ldots, n\}$,
      and a sequence of sets is the case $I = \mathbb{N}$. Writing operations
      over a family is what lets set theory handle infinitely many sets at once
      rather than two at a time.
    summary: >
      A collection of sets tagged by labels drawn from an index set — the device
      that turns two-at-a-time operations into arbitrary ones.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-set-membership
    relates:
      - id: foundations.functions.def-function
        note: >
          An indexed family *is* a function: $\{A_i\}_{i \in I}$ is the map
          $i \mapsto A_i$ with domain the index set. That is why the same set may
          be carried by two indices — for the same reason a function need not be
          injective — and why a family is not the set of its values.
    tags: []

  - id: foundations.sets.indexed-union
    kind: definition
    prominence: 1
    title: "Union of an indexed family"
    statement: >
      For an indexed family $\{A_i\}_{i \in I}$, the union
      $\bigcup_{i \in I} A_i$ is the set of objects belonging to at least one
      member: $x \in \bigcup_{i \in I} A_i$ if and only if there exists
      $i \in I$ with $x \in A_i$. For $I = \{1,2\}$ this is $A_1 \cup A_2$, and
      for $I = \emptyset$ it is $\emptyset$, there being no member to belong to.
      A single index suffices — witnessing membership means naming one $i$.
      Examples: $\bigcup_{n \ge 1} [0,n] = [0,\infty)$, and
      $\bigcup_{n \ge 1} [1/n, 1] = (0,1]$, which shows that a union of
      infinitely many sets each bounded away from $0$ can come arbitrarily close
      to it while still excluding it.
    summary: >
      Pooling arbitrarily many sets at once: an object is in the union as soon
      as it is in one member of the family.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.indexed-family
      - foundations.sets.def-union
      - foundations.sets.empty-set
    relates:
      - id: foundations.real.sup-inf
        note: >
          In the containment order, $\bigcup_i A_i$ is the least upper bound of
          the family and $\bigcap_i A_i$ its greatest lower bound — the same
          universal property $\sup$ and $\inf$ have for the order on
          $\mathbb{R}$.
    tags: []

  - id: foundations.sets.indexed-intersection
    kind: definition
    prominence: 1
    title: "Intersection of an indexed family"
    statement: >
      For an indexed family $\{A_i\}_{i \in I}$ with $I$ nonempty, the
      intersection $\bigcap_{i \in I} A_i$ is the set of objects belonging to
      every member: $x \in \bigcap_{i \in I} A_i$ if and only if $x \in A_i$ for
      all $i \in I$. It is a set because it can be separated inside any one
      member, $\bigcap_{i \in I} A_i = \{x \in A_{i_0} : x \in A_i
      \text{ for all } i \in I\}$ for a fixed $i_0 \in I$. The hypothesis
      $I \ne \emptyset$ cannot be dropped: over an empty family every object
      whatsoever satisfies the condition vacuously, and no such totality is a
      set. Examples: $\bigcap_{n \ge 1} [0, 1/n] = \{0\}$ while
      $\bigcap_{n \ge 1} (0, 1/n) = \emptyset$, so a decreasing family of
      nonempty sets can have empty intersection.
    summary: >
      What all the members of a family share; the index set must be nonempty,
      since otherwise the defining condition constrains nothing.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.indexed-family
      - foundations.sets.def-intersection
      - foundations.sets.empty-set
    relates: []
    tags: []

  - id: foundations.sets.de-morgan-indexed
    kind: proposition
    prominence: 0
    title: "De Morgan's laws for arbitrary families"
    statement: >
      Let $\{A_i\}_{i \in I}$ be a family of sets with $I$ nonempty and let $C$
      be any set. Then
      $C \setminus \bigcup_{i \in I} A_i = \bigcap_{i \in I} (C \setminus A_i)$
      and
      $C \setminus \bigcap_{i \in I} A_i = \bigcup_{i \in I} (C \setminus A_i)$.
      Proof of the first: $x$ lies on the left exactly when $x \in C$ and there
      is no $i$ with $x \in A_i$, that is, exactly when $x \in C \setminus A_i$
      for every $i$. The second is the same computation, turning "not for all"
      into "there exists a failure". Both laws are used constantly in analysis
      and topology, where a statement about an arbitrary union of open sets is
      converted into one about an arbitrary intersection of closed sets.
    summary: >
      The two-set De Morgan laws hold verbatim for families of any size, because
      the proof is really about negating "there exists" and "for all".
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.de-morgan
      - foundations.sets.indexed-union
      - foundations.sets.indexed-intersection
      - foundations.logic.quantifier-negation
    relates: []
    tags: []

  - id: foundations.sets.power-set
    kind: definition
    prominence: 1
    title: "Power set"
    statement: >
      The power set of a set $A$ is the set of all subsets of $A$,
      $\mathcal{P}(A) = \{S : S \subseteq A\}$, also written $2^A$. Its elements
      are themselves sets, so the two relations must be kept apart:
      $S \in \mathcal{P}(A)$ means exactly $S \subseteq A$, whereas an element
      $x \in A$ corresponds not to $x$ but to the singleton $\{x\}$ as a member
      of $\mathcal{P}(A)$. The set $A$ is a subset of itself and hence always a
      member of its own power set. If $A$ is finite with $n$ elements, then
      $\mathcal{P}(A)$ has $2^n$ elements, one for each independent choice of
      whether to include each element — which is what the notation $2^A$
      records. The construction may be iterated, giving
      $\mathcal{P}(\mathcal{P}(A))$ and beyond, and it is the standard way to
      manufacture a set strictly larger than a given one.
    summary: >
      All the subsets of a set, gathered into a single set one level up — the
      construction that builds strictly bigger sets out of a given one.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-subset
      - foundations.sets.set-builder
    relates: []
    tags: []

  - id: foundations.sets.ex-power-set
    kind: example
    prominence: 0
    title: "Power sets of small sets"
    statement: >
      $\mathcal{P}(\emptyset) = \{\emptyset\}$: the empty set has exactly one
      subset, namely itself, so its power set has one element and is not empty.
      Then $\mathcal{P}(\{a\}) = \{\emptyset, \{a\}\}$ has two elements, and
      $\mathcal{P}(\{a,b\}) = \{\emptyset, \{a\}, \{b\}, \{a,b\}\}$ has four.
      For $\{a,b,c\}$ the eight subsets are $\emptyset$; $\{a\}$, $\{b\}$,
      $\{c\}$; $\{a,b\}$, $\{a,c\}$, $\{b,c\}$; and $\{a,b,c\}$ — grouped by
      size, the counts $1, 3, 3, 1$ are the binomial coefficients
      $\binom{3}{k}$, and $\sum_{k=0}^{3} \binom{3}{k} = 2^3 = 8$. Iterating
      from nothing gives $\mathcal{P}(\emptyset) = \{\emptyset\}$ and
      $\mathcal{P}(\mathcal{P}(\emptyset)) = \{\emptyset, \{\emptyset\}\}$, a
      two-element set whose members are a set with no elements and a set with
      one — which is exactly why $\emptyset \ne \{\emptyset\}$ has to be said
      out loud.
    summary: >
      Writing out $\mathcal{P}$ of a zero-, one-, two- and three-element set,
      where both the doubling and the nesting of levels become visible.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.power-set
      - foundations.sets.empty-set
    relates: []
    tags: []

  - id: foundations.sets.ordered-pair
    kind: definition
    prominence: 1
    title: "Ordered pair"
    statement: >
      The ordered pair $(a,b)$ records two objects together with which of them
      comes first. Its defining property is that $(a,b) = (c,d)$ if and only if
      $a = c$ and $b = d$; consequently $(a,b) \ne (b,a)$ unless $a = b$, and
      $(a,a)$ is a perfectly good pair. This is precisely what the unordered
      $\{a,b\}$ fails to record, since $\{a,b\} = \{b,a\}$ and
      $\{a,a\} = \{a\}$. Pairs need not be taken as a new primitive: Kuratowski's
      encoding $(a,b) = \{\{a\}, \{a,b\}\}$ is a set built from $a$ and $b$ that
      satisfies the defining property, and once that is checked the encoding is
      never used again — only the property matters. Ordered $n$-tuples extend
      this, with $(a_1, \ldots, a_n) = (b_1, \ldots, b_n)$ if and only if
      $a_i = b_i$ for every $i$.
    summary: >
      Two objects in a definite order, pinned down by the single rule that two
      pairs agree exactly when their first and second entries agree.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-set-membership
    relates: []
    tags: []

  - id: foundations.sets.cartesian-product
    kind: definition
    prominence: 2
    title: "Cartesian product"
    statement: >
      The Cartesian product of $A$ and $B$ is the set of all ordered pairs whose
      first entry lies in $A$ and whose second lies in $B$:
      $A \times B = \{(a,b) : a \in A, b \in B\}$. Unfolded, an object $p$ lies
      in $A \times B$ if and only if $p = (a,b)$ for some $a \in A$ and some
      $b \in B$. The product is empty exactly when at least one factor is empty,
      and it is not commutative: $A \times B$ and $B \times A$ are different sets
      unless $A = B$ or one of them is empty. For finite factors
      $|A \times B| = |A| \cdot |B|$. The $n$-fold product
      $A_1 \times \cdots \times A_n$ consists of $n$-tuples, and $A^n$
      abbreviates the product of $n$ copies of $A$, so $\mathbb{R}^2$ is the
      coordinate plane and $\mathbb{R}^n$ is $n$-dimensional coordinate space.
      Products are what allow set theory to express comparison at all: a
      relation between $A$ and $B$ is by definition a subset of $A \times B$,
      and a function from $A$ to $B$ is such a subset in which every $a \in A$
      is the first entry of exactly one pair.
    summary: >
      Every way of pairing an element of one set with an element of another —
      the grid construction on which relations, functions and coordinates are
      all built.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.ordered-pair
      - foundations.sets.set-builder
      - foundations.sets.empty-set
    relates: []
    tags: []

  - id: foundations.sets.disjoint
    kind: definition
    prominence: 0
    title: "Disjoint sets"
    statement: >
      Two sets $A$ and $B$ are disjoint when they have no element in common,
      that is, when $A \cap B = \emptyset$. A family $\{A_i\}_{i \in I}$ is
      pairwise disjoint when $A_i \cap A_j = \emptyset$ for all $i \ne j$ in
      $I$. Pairwise disjointness is strictly stronger than the intersection of
      the whole family being empty: for $\{1,2\}$, $\{2,3\}$, $\{1,3\}$ no
      element lies in all three, yet no two of them are disjoint. Disjointness
      is the hypothesis under which two sets may be treated as separate cases
      with no overlap to correct for, which is what makes counting, measure and
      case analysis additive.
    summary: >
      Sets that share nothing; for a family, the stronger demand that no two of
      its members share anything.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.def-intersection
      - foundations.sets.empty-set
      - foundations.sets.indexed-family
    relates: []
    tags: []

  - id: foundations.sets.partition
    kind: definition
    prominence: 1
    title: "Partition of a set"
    statement: >
      A partition of a set $X$ is a family $\{A_i\}_{i \in I}$ of subsets of $X$
      such that (i) each $A_i$ is nonempty, (ii) the family is pairwise
      disjoint, and (iii) $\bigcup_{i \in I} A_i = X$. Its members are called
      the blocks, or cells, of the partition. Equivalently and more usably: a
      partition splits $X$ so that every element of $X$ lies in exactly one
      block — condition (iii) supplies existence and condition (ii) supplies
      uniqueness. Condition (i) rules out empty blocks, which would carry no
      information and would spoil the exact correspondence between partitions of
      $X$ and equivalence relations on $X$. Examples: the even and the odd
      integers partition $\mathbb{Z}$ into two blocks; for a positive integer
      $n$, the residue classes modulo $n$ partition $\mathbb{Z}$ into $n$
      blocks; and a nonempty proper subset $A$ of $X$ together with the set of
      elements of $X$ outside $A$ partitions $X$ into two blocks.
    summary: >
      A splitting of a set into nonempty, non-overlapping pieces that between
      them use up everything, so each element lands in exactly one piece.
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.disjoint
      - foundations.sets.indexed-union
    relates:
      - id: analysis.svc.def-riemann-sum
        note: >
          A partition of $[a,b]$ in the Riemann-sum sense decomposes an interval
          the same way, except that adjacent subintervals share an endpoint — it
          is a partition of $[a,b]$ only after those finitely many shared points
          are assigned to one side.
    tags: []

  - id: foundations.sets.russell-paradox
    kind: example
    prominence: 2
    title: "Russell's paradox"
    statement: >
      Suppose set formation by property were unrestricted, so that every
      property $P$ determined a set $\{x : P(x)\}$. Take $P(x)$ to be
      "$x \notin x$" and let $R = \{x : x \notin x\}$ be the set of all sets
      that are not members of themselves; ask whether $R \in R$. If $R \in R$
      then $R$ has the defining property, so $R \notin R$. If $R \notin R$ then
      $R$ has the defining property, so $R \in R$. Hence $R \in R$ if and only
      if $R \notin R$, a contradiction, and unrestricted comprehension is
      therefore inconsistent — no repair of the example rescues the principle.
      Two consequences govern everything above: set formation by property is
      admitted only in the separation form $\{x \in A : P(x)\}$, which carves a
      subset out of a set already known to exist; and there is no set of all
      sets, since separating $R$ out of it would reproduce the contradiction.
      Axiomatic developments such as Zermelo–Fraenkel make these restrictions
      into explicit axioms; the treatment here is called naive precisely because
      it takes them on trust, and it stays safe only because every set it builds
      is obtained from given sets by separation, union, power set and product.
    summary: >
      Letting an arbitrary property define a set is outright contradictory —
      which is why set formation must always start from a set already in hand,
      and why this whole development carries the qualifier "naive".
    parent: foundations.sets
    also_under: []
    requires:
      - foundations.sets.set-builder
      - foundations.proof.contradiction
    relates: []
    tags: []
