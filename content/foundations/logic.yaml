# foundations.logic — Propositional and Predicate Logic
# The propositional calculus (connectives, truth tables, the equivalence laws,
# valid inference) and predicate logic (predicates, the two quantifiers, their
# negation, their nesting). Root of the graph — no prerequisite leaves this file.

nodes:
  - id: foundations.logic
    kind: subbranch
    title: "Propositional and Predicate Logic"
    summary: >
      Connectives, quantifiers, and logical equivalence — the language every
      later statement is written in, and the rules that decide when one
      statement follows from another.
    parent: foundations
    also_under: []
    tags: []

  - id: foundations.logic.def-proposition
    kind: definition
    prominence: 1
    title: "Proposition and truth value"
    statement: >
      A proposition is a declarative sentence that is either true or false and
      not both; that verdict is its truth value, written $\mathrm{T}$ or
      $\mathrm{F}$. "$7$ is prime" and "$2 + 2 = 5$" are propositions;
      questions, commands, and sentences containing an unassigned variable such
      as "$x > 3$" are not. Letters $p, q, r$ are propositional variables
      standing for unspecified propositions, a compound proposition is one built
      from such variables by connectives, and a truth assignment is a choice of
      truth value for each variable occurring in it. The whole subject rests on
      bivalence: every proposition takes exactly one of the two values, so a
      compound proposition's value is determined once its variables are assigned.
    summary: >
      The atoms of logic — statements that are definitely true or definitely
      false — together with the letters that stand in for them.
    parent: foundations.logic
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: foundations.logic.def-negation
    kind: definition
    prominence: 0
    title: "Negation"
    statement: >
      The negation of $p$, written $\neg p$ and read "not $p$", is the
      proposition that is true when $p$ is false and false when $p$ is true. It
      is the only connective taking a single argument, and it simply reverses
      the truth value. In English it is "it is not the case that $p$", which is
      always a safe rendering; idiomatic negations are not, because they tend to
      overshoot. For a fixed $x$, the negation of "$x > 3$" is "$x \le 3$", not
      "$x < 3$"; the
      negation of "all of them are red" is "at least one is not red", not "none
      is red".
    summary: >
      Flipping a statement's truth value — and the reason to write the flip
      mechanically rather than reach for the idiomatic opposite.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-proposition
    relates: []
    tags: []

  - id: foundations.logic.def-conjunction
    kind: definition
    prominence: 0
    title: "Conjunction"
    statement: >
      The conjunction $p \land q$, read "$p$ and $q$", is true in the single
      case where $p$ and $q$ are both true, and false in the other three. The
      English connectives "but", "yet", "although" and "while" all translate to
      $\land$, because the connective records only which combinations of truth
      values occur, discarding contrast, emphasis and temporal order — which is
      also why it is commutative in truth value.
    summary: >
      Both halves must hold — the connective that is true only when everything
      it joins is true.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-proposition
    relates: []
    tags: []

  - id: foundations.logic.def-disjunction
    kind: definition
    prominence: 1
    title: "Disjunction"
    statement: >
      The disjunction $p \lor q$, read "$p$ or $q$", is true when at least one
      of $p$, $q$ is true, and false in the single case where both are false.
      This is the inclusive or, and it is the mathematical default: "$x \le 0$
      or $x \ge 0$" is true at $x = 0$. The exclusive or $p \oplus q$, true
      exactly when one of the two holds but not both, is a different connective;
      English "or" is ambiguous between them, so mathematical writing that means
      the exclusive one says so ("either ..., or ..., but not both").
    summary: >
      At least one of the alternatives holds — inclusive by convention, which is
      where the everyday reading of "or" and the mathematical one part company.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-proposition
    relates: []
    tags: []

  - id: foundations.logic.truth-table
    kind: technique
    prominence: 1
    title: "Truth tables"
    statement: >
      Because each connective's output depends only on its inputs' truth
      values, a compound proposition in $n$ variables is a function on the set
      of $2^n$ truth assignments to those variables, and a truth table is that
      function written out: one row per assignment, one column per variable, and
      further columns for the subformulas in order of increasing size, each
      computed from earlier columns by the defining condition of its outermost
      connective. Which subformula is built when is fixed by parentheses, or in
      their absence by the precedence order $\neg$, then $\land$, then $\lor$,
      from tightest to loosest. Being exhaustive and finite,
      the table settles every question about a compound proposition that depends
      on truth values alone, at the cost of doubling in size with each added
      variable.
    summary: >
      Evaluate a compound statement on every possible combination of truth
      values for its parts — a finite, purely mechanical procedure that answers
      any question truth values can answer.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-negation
      - foundations.logic.def-conjunction
      - foundations.logic.def-disjunction
    relates: []
    tags: []

  - id: foundations.logic.def-conditional
    kind: definition
    prominence: 2
    title: "The conditional"
    statement: >
      The conditional $p \to q$, read "if $p$ then $q$", is false in the single
      case where $p$ is true and $q$ is false, and true in the other three: true
      when $p$ and $q$ are both true, and true in both cases where $p$ is false,
      whatever $q$ is. Here $p$ is the hypothesis (antecedent) and $q$ the
      conclusion (consequent). This is the material conditional: it claims no
      causation, no relevance and no temporal link, only that the one forbidden
      combination — true hypothesis with false conclusion — does not occur.
      English renderings of the same connective include "$q$ if $p$", "$p$ only
      if $q$", "$p$ is sufficient for $q$", "$q$ is necessary for $p$", and "$p$
      implies $q$"; note that "$p$ only if $q$" is $p \to q$ and not $q \to p$.
    summary: >
      The workhorse of mathematics: "if this, then that" counts as false only
      when the hypothesis holds and the conclusion fails — so a false hypothesis
      makes it true by default.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-proposition
    relates: []
    tags: []

  - id: foundations.logic.def-biconditional
    kind: definition
    prominence: 1
    title: "The biconditional"
    statement: >
      The biconditional $p \leftrightarrow q$, read "$p$ if and only if $q$", is
      true when $p$ and $q$ have the same truth value and false when they
      differ. It unpacks as the conjunction $(p \to q) \land (q \to p)$: the
      "only if" half is $p \to q$ and the "if" half is $q \to p$. Every
      mathematical definition and every characterization theorem is a
      biconditional, which is why establishing one always means establishing two
      implications — the two halves are independent, and proving one of them
      leaves the statement unproved. Of the five connectives the conditional
      binds second most loosely and the biconditional loosest of all, so an
      unparenthesized $p \to q \leftrightarrow r$ means
      $(p \to q) \leftrightarrow r$.
    summary: >
      Two statements standing or falling together; the reason "if and only if"
      proofs come in two directions.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-conditional
      - foundations.logic.def-conjunction
    relates: []
    tags: []

  - id: foundations.logic.tautology-contradiction
    kind: definition
    prominence: 1
    title: "Tautology, contradiction, and satisfiability"
    statement: >
      A compound proposition is a tautology if it is true under every truth
      assignment (for example $p \lor \neg p$), a contradiction if it is false
      under every truth assignment (for example $p \land \neg p$), and a
      contingency if it is neither. It is satisfiable if at least one assignment
      makes it true, and such an assignment is a satisfying assignment; so
      satisfiable means precisely not a contradiction, and every tautology is
      satisfiable but not conversely. Negation exchanges the extremes: $P$ is a
      tautology exactly when $\neg P$ is a contradiction, and $P$ is satisfiable
      exactly when $\neg P$ is not a tautology. All three properties are decided
      by inspecting the proposition's column in its truth table, at a cost of
      $2^n$ rows.
    summary: >
      Classifying a compound statement by its truth-table column: true in every
      row, false in every row, or true in at least one.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.truth-table
    relates: []
    tags: []

  - id: foundations.logic.logical-equivalence
    kind: definition
    prominence: 1
    title: "Logical equivalence"
    statement: >
      Compound propositions $P$ and $Q$ are logically equivalent, written
      $P \equiv Q$, if they take the same truth value under every truth
      assignment to their variables — equivalently, if $P \leftrightarrow Q$ is
      a tautology. The symbol $\equiv$ is not a connective of the language: it
      is an assertion, made from outside, that two expressions have identical
      truth tables. Equivalence is reflexive, symmetric and transitive, and it
      is a congruence: replacing a subformula by an equivalent one leaves the
      truth value of the whole unchanged. That substitution property is what
      licenses rewriting a complicated statement step by step into a simpler
      equivalent one.
    summary: >
      Two statements are equivalent when their truth tables agree row for row —
      and equivalent statements may be swapped for one another anywhere, which
      is what makes logical rewriting legitimate.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.tautology-contradiction
      - foundations.logic.def-biconditional
    relates: []
    tags: []

  - id: foundations.logic.double-negation
    kind: proposition
    prominence: 0
    title: "Double negation"
    statement: >
      $\neg(\neg p) \equiv p$. The two-row truth table checks it: negating $p$
      twice restores the original value. Hence negations may be cancelled in
      pairs wherever they appear, and this is exactly the step taken at the end
      of an indirect argument, where refuting $\neg p$ is treated as
      establishing $p$. The law is characteristic of classical two-valued logic;
      constructive logic declines it, along with the law of excluded middle
      $p \lor \neg p$, to which it is equivalent.
    summary: >
      Denying a denial returns the original statement — the small law that lets
      an argument conclude something positive from a refuted negation.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.logical-equivalence
    relates: []
    tags: []

  - id: foundations.logic.de-morgan
    kind: theorem
    prominence: 2
    title: "De Morgan's laws"
    statement: >
      For all propositions $p$ and $q$,
      $\neg(p \land q) \equiv \neg p \lor \neg q$ and
      $\neg(p \lor q) \equiv \neg p \land \neg q$. Both are verified by a
      four-row truth table: $p \land q$ fails exactly when at least one conjunct
      fails, and $p \lor q$ fails exactly when both disjuncts fail. Both laws
      extend by induction to any finite number of terms. In words: to negate an
      "and", deny at least one part; to negate an "or", deny every part.
      Operationally they are the rule for driving a negation inward through a
      compound statement — each step strips one negation from the outside,
      exchanges $\land$ with $\lor$, and pushes negations onto the parts.
    summary: >
      Negation turns "and" into "or" and "or" into "and" — the rule that lets
      any negated statement be rewritten with the negations pushed all the way
      down to the atoms.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.logical-equivalence
    relates: []
    tags: []

  - id: foundations.logic.distributive-laws
    kind: proposition
    prominence: 1
    title: "Commutative, associative and distributive laws"
    statement: >
      For all propositions $p, q, r$: $\land$ and $\lor$ are each commutative,
      $p \land q \equiv q \land p$ and $p \lor q \equiv q \lor p$, and
      associative, $(p \land q) \land r \equiv p \land (q \land r)$ and
      likewise for $\lor$ — so an unparenthesized chain of a single one of these
      connectives is unambiguous. Each distributes over the other:
      $p \land (q \lor r) \equiv (p \land q) \lor (p \land r)$ and
      $p \lor (q \land r) \equiv (p \lor q) \land (p \lor r)$. The second
      distribution has no arithmetic analogue — addition does not distribute
      over multiplication — so it has to be checked by truth table rather than
      assumed by analogy with algebra. Also standard: idempotence
      $p \land p \equiv p$ and $p \lor p \equiv p$, and absorption
      $p \lor (p \land q) \equiv p$ and $p \land (p \lor q) \equiv p$.
    summary: >
      The algebra of "and" and "or": both connectives reorder and regroup
      freely, and each distributes over the other — unlike arithmetic, where
      only one of the two directions holds.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.logical-equivalence
    relates: []
    tags: []

  - id: foundations.logic.conditional-as-disjunction
    kind: proposition
    prominence: 1
    title: "Rewriting and negating a conditional"
    statement: >
      $p \to q \equiv \neg p \lor q$, and consequently
      $\neg(p \to q) \equiv p \land \neg q$. Both are single truth-table
      checks: the one row where $p \to q$ is false is the row with $p$ true and
      $q$ false, which is the one row where $p \land \neg q$ is true, and the
      complementary rows match $\neg p \lor q$. The first equivalence shows the
      conditional is not a primitive notion — it can be expressed with negation
      and disjunction alone. The second is the more useful in practice: the
      negation of "if $p$ then $q$" is not another conditional but the flat
      assertion that the hypothesis holds while the conclusion fails, which is
      exactly the situation an argument by contradiction assumes and then
      refutes.
    summary: >
      A conditional says no more than "either the hypothesis fails or the
      conclusion holds", so denying one means asserting the hypothesis and
      denying the conclusion.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.logical-equivalence
    relates: []
    tags: []

  - id: foundations.logic.contrapositive
    kind: proposition
    prominence: 1
    title: "Converse, inverse and contrapositive"
    statement: >
      From a conditional $p \to q$ one forms its converse $q \to p$, its inverse
      $\neg p \to \neg q$, and its contrapositive $\neg q \to \neg p$. A
      conditional is logically equivalent to its contrapositive,
      $p \to q \equiv \neg q \to \neg p$, and the converse is equivalent to the
      inverse, being its contrapositive. A conditional is not in general
      equivalent to its converse: over the reals, "if $x = 2$ then $x^2 = 4$" is
      true while its converse fails at $x = -2$. Two consequences: proving
      $\neg q \to \neg p$ is a legitimate way to prove $p \to q$, and reading a
      theorem as if it also asserted its converse is a mistake — the converse is
      a separate claim needing a separate proof.
    summary: >
      Turning a conditional around: reversing and negating it preserves its
      meaning, merely reversing it does not.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.logical-equivalence
    relates: []
    tags: []

  - id: foundations.logic.def-validity
    kind: definition
    prominence: 1
    title: "Valid argument"
    statement: >
      An argument consists of premises $p_1, \dots, p_n$ and a conclusion $q$.
      Its form is valid if no truth assignment makes all the premises true and
      the conclusion false — equivalently, if
      $(p_1 \land \cdots \land p_n) \to q$ is a tautology. Validity is a
      property of form alone and says nothing about whether the premises are in
      fact true: a valid argument from a false premise may have a false
      conclusion, and an invalid argument may happen to have a true one. An
      argument is sound when it is both valid and has true premises, and only
      soundness establishes a conclusion. Validity is therefore checkable
      mechanically, by truth table; soundness is not.
    summary: >
      An argument form is valid when true premises cannot lead to a false
      conclusion — a property of the shape of the argument, not of the facts it
      happens to start from.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.tautology-contradiction
      - foundations.logic.def-conditional
    relates: []
    tags: []

  - id: foundations.logic.modus-ponens
    kind: proposition
    prominence: 1
    title: "Modus ponens"
    statement: >
      From $p \to q$ and $p$, infer $q$. The form is valid, i.e.
      $(p \land (p \to q)) \to q$ is a tautology: the only assignment making
      both premises true has $p$ true, and were $q$ false that assignment would
      falsify $p \to q$, so $q$ is true whenever both premises are. This is the
      rule by which a theorem gets applied — having proved "if the hypotheses
      hold then the conclusion holds", checking the hypotheses in a particular
      case delivers the conclusion in that case — and it is the step that chains
      one result to the next in every proof.
    summary: >
      Affirming the hypothesis of a true conditional delivers its conclusion:
      the rule that turns a proved theorem into a usable one.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-validity
    relates: []
    tags: []

  - id: foundations.logic.modus-tollens
    kind: proposition
    prominence: 1
    title: "Modus tollens"
    statement: >
      From $p \to q$ and $\neg q$, infer $\neg p$. The form is valid, i.e.
      $((p \to q) \land \neg q) \to \neg p$ is a tautology: if $p$ held then
      $p \to q$ would force $q$, contradicting the second premise. Since
      $p \to q \equiv \neg q \to \neg p$, the rule is nothing but the
      affirm-the-hypothesis rule applied to the contrapositive. It is the engine
      of indirect argument: to reject a hypothesis, derive a consequence of it
      and show the consequence fails.
    summary: >
      Denying the conclusion of a true conditional refutes its hypothesis — how
      a claim gets knocked down by one of its own consequences.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-validity
      - foundations.logic.contrapositive
    relates: []
    tags: []

  - id: foundations.logic.ex-converse-fallacy
    kind: example
    prominence: 0
    title: "Affirming the consequent, denying the antecedent"
    statement: >
      Two invalid forms that imitate the two valid ones. Affirming the
      consequent infers $p$ from $p \to q$ and $q$; denying the antecedent
      infers $\neg q$ from $p \to q$ and $\neg p$. Both are refuted by the same
      single assignment, $p$ false and $q$ true: it makes every premise of both
      arguments true while falsifying both conclusions. Structurally, each is a
      valid rule applied to the wrong conditional: affirming the consequent is
      the forward rule applied to the converse, denying the antecedent is the
      forward rule applied to the inverse, and both therefore amount to treating
      a conditional as equivalent to its converse. Concretely, from "if
      $n$ is divisible by $4$ then $n$ is even" one may not conclude that an
      even $n$ is divisible by $4$ (take $n = 6$), nor that an $n$ not divisible
      by $4$ is odd (again $n = 6$).
    summary: >
      The two near-misses of valid inference, and the single line of a truth
      table that kills them both.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.modus-ponens
      - foundations.logic.modus-tollens
    relates: []
    tags: []

  - id: foundations.logic.def-predicate
    kind: definition
    prominence: 1
    title: "Predicate"
    statement: >
      A predicate $P(x)$ is a declarative sentence containing a variable that
      becomes a proposition once the variable is assigned a value from a
      specified domain of discourse $D$. "$x > 3$" is not a proposition, but
      with domain the integers, $P(4)$ is true and $P(2)$ is false. The domain
      is part of the predicate, not decoration: the same sentence can hold of
      some element of one domain and of no element of another, as
      "$x \cdot x = 2$" does over the reals and over the rationals. A predicate of
      several variables $P(x_1, \dots, x_n)$ becomes a proposition only when all
      $n$ variables are assigned. Substituting values is one way to obtain a
      proposition from a predicate; quantifying the variable is the other.
    summary: >
      A statement with a slot in it — not yet true or false, but becoming so
      once the slot is filled from a stated domain.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-proposition
    relates: []
    tags: []

  - id: foundations.logic.quantifier-universal
    kind: definition
    prominence: 1
    title: "Universal quantifier"
    statement: >
      For a predicate $P$ over a domain $D$, the universal quantification
      $\forall x\, P(x)$, read "for every $x$ in $D$, $P(x)$", is the
      proposition that is true when $P(c)$ is true for every $c$ in $D$ and
      false otherwise. It is therefore false as soon as one $c$ in $D$ has
      $P(c)$ false. Over a nonempty finite domain $c_1, \dots, c_n$ it is
      exactly the conjunction $P(c_1) \land \cdots \land P(c_n)$; over an empty
      domain there is nothing to conjoin and it is true by default; over an
      infinite domain no such finite rewriting exists, which is why universal
      statements generally require an argument rather than a check. The domain
      cannot be suppressed:
      $\forall x\, (x^2 \ge x)$ is true over the integers and false over the
      reals, where $x = 1/2$ fails it.
    summary: >
      "Every element of the domain satisfies this" — a single claim about all of
      them at once, which one bad element destroys.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-predicate
      - foundations.logic.def-conjunction
    relates: []
    tags: []

  - id: foundations.logic.quantifier-existential
    kind: definition
    prominence: 1
    title: "Existential quantifier"
    statement: >
      For a predicate $P$ over a domain $D$, the existential quantification
      $\exists x\, P(x)$, read "there exists an $x$ in $D$ with $P(x)$", is the
      proposition that is true when $P(c)$ is true for at least one $c$ in $D$
      and false when $P(c)$ is false for every $c$ in $D$. It asserts existence
      only — not uniqueness, not how many, and not a recipe: exhibiting a single
      witness $c$ proves it, but so does an argument that produces no witness at
      all. Over a nonempty finite domain $c_1, \dots, c_n$ it is the disjunction
      $P(c_1) \lor \cdots \lor P(c_n)$; over an empty domain there is nothing to
      disjoin and it is false. The variant $\exists ! x\, P(x)$ abbreviates
      "there is exactly one $x$ with $P(x)$", which is a strictly stronger
      claim.
    summary: >
      "At least one element of the domain satisfies this" — established by one
      witness, and saying nothing about how many there are.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-predicate
      - foundations.logic.def-disjunction
    relates: []
    tags: []

  - id: foundations.logic.quantifier-negation
    kind: theorem
    prominence: 2
    title: "Negation of quantified statements"
    statement: >
      For every predicate $P$ over every domain,
      $\neg \forall x\, P(x) \equiv \exists x\, \neg P(x)$ and
      $\neg \exists x\, P(x) \equiv \forall x\, \neg P(x)$, where $\equiv$ now
      means that the two sides take the same truth value for every domain and
      every interpretation of $P$. In words: a universal claim fails exactly
      when something violates it, and an existential claim fails exactly when
      everything violates it. Over a nonempty finite domain, where $\forall$ is
      a conjunction and $\exists$ a disjunction, these are literally De Morgan's
      laws, and they are often named for him in the quantified case too. Applied
      repeatedly they negate any string of quantifiers mechanically — replace
      each $\forall$ by $\exists$ and each $\exists$ by $\forall$, then negate
      the body:
      $\neg \forall x \exists y\, P(x,y) \equiv \exists x \forall y\, \neg P(x,y)$.
    summary: >
      Pushing a negation past a quantifier swaps "for all" with "there exists" —
      the rule that produces the precise statement you must establish when you
      set out to disprove something.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.quantifier-universal
      - foundations.logic.quantifier-existential
      - foundations.logic.logical-equivalence
    relates: []
    tags: []

  - id: foundations.logic.nested-quantifiers
    kind: definition
    prominence: 1
    title: "Nested quantifiers"
    statement: >
      Quantifiers applied to a predicate of several variables bind them one at a
      time, read left to right, and each quantified variable may depend on those
      quantified before it but not on those after. In $\forall x \exists y\,
      P(x,y)$ the witness $y$ may be chosen after seeing $x$ and so may depend
      on it; in $\exists y \forall x\, P(x,y)$ a single $y$ must work for every
      $x$. The second is strictly stronger:
      $\exists y \forall x\, P(x,y) \Rightarrow \forall x \exists y\, P(x,y)$
      always holds, and the converse implication fails in general. Like
      quantifiers commute, $\forall x \forall y \equiv \forall y \forall x$ and
      $\exists x \exists y \equiv \exists y \exists x$; unlike quantifiers do
      not. A reliable reading is adversarial: each $\forall$ is a value handed
      to you by an opponent, each $\exists$ a value you supply in reply, with
      full knowledge of everything named so far.
    summary: >
      When quantifiers stack, their order decides what may depend on what —
      "for each one, some" and "some one, for all" are different statements.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.quantifier-universal
      - foundations.logic.quantifier-existential
    relates:
      - id: analysis.svc.def-limit
        note: 'The $\varepsilon$–$\delta$ definition is a $\forall \exists \forall$ statement: $\delta$ is chosen after $\varepsilon$ and may depend on it, and that dependence is exactly the order-sensitivity described here.'
    tags: []

  - id: foundations.logic.ex-quantifier-order
    kind: example
    prominence: 0
    title: "∀∃ versus ∃∀"
    statement: >
      Take the domain to be the real numbers and let $P(x,y)$ be $x + y = 0$.
      Then $\forall x \exists y\, P(x,y)$ is true — given $x$, take $y = -x$ —
      while $\exists y \forall x\, P(x,y)$ is false, since a single $y$ cannot
      satisfy $x + y = 0$ for two different values of $x$. The English pair
      behaves identically: "everyone has a mother" is $\forall x \exists y$,
      while "someone is the mother of everyone" is $\exists y \forall x$.
      Swapping two unlike quantifiers is not a rewriting of a statement; it
      produces a different statement, here turning a triviality into a
      falsehood.
    summary: >
      A two-line example that separates the two quantifier orders: the same
      predicate, one order true and the other false.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.nested-quantifiers
    relates: []
    tags: []

  - id: foundations.logic.vacuous-truth
    kind: proposition
    prominence: 1
    title: "Vacuous truth"
    statement: >
      If $p$ is false then $p \to q$ is true whatever $q$ says; such a
      conditional is called vacuously true. Consequently
      $\forall x\, (P(x) \to Q(x))$ is true whenever no element of the domain
      satisfies $P$, and over a domain with no elements at all every statement
      $\forall x\, P(x)$ is true while every statement $\exists x\, P(x)$ is
      false. So "every real $x$ with $x^2 < 0$ satisfies $x = 7$" is true. This
      is not a defect of the convention: a universal statement asserts only that
      no element violates it, and where there is nothing to violate it, nothing
      does. Practically, it is why a proof of $\forall x\, (P(x) \to Q(x))$ may
      open with "let $x$ satisfy $P$" and be finished the moment that supposition
      turns out to be unsatisfiable, and why a general theorem stays true in
      degenerate cases instead of needing them excluded by hand.
    summary: >
      A statement about all the things of a kind is true when there are no such
      things — a convention that keeps general results from breaking in
      degenerate cases.
    parent: foundations.logic
    also_under: []
    requires:
      - foundations.logic.def-conditional
      - foundations.logic.quantifier-universal
    relates: []
    tags: []
