# foundations.proof — Proof Technique
# The vocabulary of an argument (definition, axiom, theorem, proof), the standard
# proof shapes and what each is obliged to establish, the quantifier disciplines,
# and the errors that make an argument only look like a proof.

nodes:
  - id: foundations.proof
    kind: subbranch
    title: "Proof Technique"
    summary: >
      Direct proof, contraposition, contradiction, cases and counterexample:
      the standard shapes an argument takes, and what each one is obliged to
      establish.
    parent: foundations
    also_under: []
    tags: []

  - id: foundations.proof.def-definition
    kind: definition
    prominence: 1
    title: "Mathematical definition"
    statement: >
      A definition stipulates a name for a condition expressed entirely in
      previously defined terms, bottoming out in the undefined primitive terms
      of the theory. A definition is neither true nor false: it asserts nothing
      and so is never proved. Two conventions govern its use. First, the "if" in
      a definition always means "if and only if" — "an integer $n$ is even if
      $n = 2k$ for some integer $k$" licenses inference in both directions, so a
      definition may be unfolded wherever the defined term appears and folded
      back wherever the condition is established. Second, a definition is usable
      only once it is well posed: if it is phrased through a choice that was made
      arbitrarily, the named object must be shown not to depend on that choice.
    summary: >
      Naming a condition, once and for all. A definition claims nothing, so it
      cannot be proved — but every proof about the defined term eventually
      unfolds back into it.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.logic.def-biconditional
    relates: []
    tags: []

  - id: foundations.proof.def-axiom
    kind: definition
    prominence: 1
    title: "Axiom and axiomatic system"
    statement: >
      An axiom is a statement assumed without proof. An axiomatic system is a
      collection of undefined primitive terms together with axioms constraining
      them; every other assertion of the theory is derived from those. Axioms are
      not self-evident truths but a chosen starting point, and adopting different
      axioms produces a different theory rather than a mistake. Two properties of
      a system matter: it is consistent if no statement and its negation are both
      derivable, and an axiom is independent of the others if neither it nor its
      negation follows from them. Euclid's parallel postulate is independent of
      his other four, which is exactly why the non-Euclidean geometries denying
      it are as consistent as the Euclidean one.
    summary: >
      The assumptions a theory starts from. Nothing is proved from nothing, so
      every proof traces back to axioms — and changing them changes the subject
      rather than making anything false.
    parent: foundations.proof
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: foundations.proof.def-theorem
    kind: definition
    prominence: 1
    title: "Theorem, lemma, proposition, corollary"
    statement: >
      A theorem is a statement that has been proved from the axioms and
      definitions of the theory. It is normally stated as "if hypotheses, then
      conclusion": the hypotheses are granted for free, the conclusion is what
      must be established, and the theorem asserts nothing whatever about
      situations where a hypothesis fails. The remaining labels record role and
      weight, not logical status — a lemma is a subsidiary result proved in order
      to be used elsewhere, a proposition is a modest standalone result, a
      corollary follows quickly from a result just proved, and a conjecture is a
      statement believed but not proved and therefore usable in no proof. Since
      the hypotheses are part of the statement, dropping one generally turns a
      true theorem into a false one rather than a stronger one.
    summary: >
      What gets proved, and what the surrounding labels mean. The hypotheses are
      part of the claim, not decoration: outside them a theorem says nothing at
      all.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.def-definition
      - foundations.proof.def-axiom
    relates: []
    tags: []

  - id: foundations.proof.def-proof
    kind: definition
    prominence: 2
    title: "What a proof is"
    statement: >
      A proof of a statement $S$ is a finite sequence of assertions ending with
      $S$, in which every assertion is an axiom, a definition, a hypothesis of
      $S$, a previously proved theorem, or a consequence of earlier assertions in
      the sequence by a rule of inference. The workhorse rule is modus ponens:
      from $P$ and $P \Rightarrow Q$, infer $Q$. Two consequences are worth
      stating plainly. A proof is final — a proved theorem is not subject to
      revision by later evidence, unlike a scientific hypothesis. And a proof is
      checkable: verifying any single step needs no ingenuity, only the lines
      before it. A written proof compresses many such steps into each sentence,
      but every sentence must be expandable on demand; a step that cannot be
      expanded is a gap, not a shortcut.
    summary: >
      A finite chain of steps from what is already granted to the claim, each
      step licensed by a rule anyone can check. Ingenuity is needed to find a
      proof, never to verify one.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.def-theorem
      - foundations.logic.modus-ponens
    relates: []
    tags: []

  - id: foundations.proof.direct-proof
    kind: technique
    prominence: 2
    title: "Direct proof"
    statement: >
      To prove an implication $P \Rightarrow Q$ directly: assume $P$, and derive
      $Q$ by a chain of valid steps. The assumption is discharged when the proof
      ends — the argument never claims $P$ is true, only that $Q$ holds wherever
      $P$ does — and an unconditional statement is proved the same way with no
      hypothesis to assume. The reliable opening move is mechanical: unfold the
      definitions of the terms in $P$ to obtain usable data, unfold the
      definition of the term in $Q$ to see exactly what must be produced, then
      work forward from the data to that target. For example, if $m$ and $n$ are
      odd integers then $mn$ is odd: write $m = 2a+1$ and $n = 2b+1$, so
      $mn = 2(2ab + a + b) + 1$, which is odd by definition. If $P$ can never be
      satisfied the implication holds vacuously, with nothing to prove.
    summary: >
      Assume the hypothesis, unfold the definitions at both ends, and walk
      forward to the conclusion. Every other proof shape is a way of converting a
      hard statement into one of these.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.def-proof
    relates: []
    tags: []

  - id: foundations.proof.contraposition
    kind: technique
    prominence: 1
    title: "Proof by contraposition"
    statement: >
      The contrapositive of $P \Rightarrow Q$ is $\neg Q \Rightarrow \neg P$, and
      the two are logically equivalent — each holds in exactly the cases the
      other does. So $P \Rightarrow Q$ may be proved by assuming $\neg Q$ and
      deriving $\neg P$, directly. This pays whenever the negated conclusion is
      the more concrete of the two: to show that, for an integer $n$, $n^2$ even
      implies $n$ even, assume instead that $n$ is odd, write $n = 2k+1$ and
      compute $n^2 = 2(2k^2 + 2k) + 1$, which is odd. The negated conclusion
      handed over an equation, whereas the original hypothesis offered only a
      fact about $n^2$. The contrapositive must not be confused with the converse
      $Q \Rightarrow P$ or the inverse $\neg P \Rightarrow \neg Q$; those two are
      equivalent to each other but not to the statement being proved.
    summary: >
      Prove "if not the conclusion then not the hypothesis" instead. It says
      exactly the same thing, and the negated conclusion is often the more usable
      place to start.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.direct-proof
      - foundations.logic.contrapositive
    relates: []
    tags: []

  - id: foundations.proof.contradiction
    kind: technique
    prominence: 2
    title: "Proof by contradiction"
    statement: >
      To prove $S$ by contradiction: assume $\neg S$ and derive from it a
      statement known to be false — characteristically some $R$ together with
      $\neg R$. A false conclusion cannot follow from true premises, so the
      assumption $\neg S$ fails and $S$ holds. When $S$ is an implication
      $P \Rightarrow Q$, its negation is "$P$ and $\neg Q$", so the proof begins
      by assuming both the hypothesis and the negated conclusion. That is the
      method's advantage: an extra assumption to work with, and no fixed target
      to aim at, since any absurdity whatsoever finishes the proof. The
      corresponding costs are that an error anywhere in the argument also
      produces an apparent contradiction, and that an argument whose
      contradiction is exactly "$\neg P$" is a contraposition in disguise and is
      clearer rewritten as one.
    summary: >
      Suppose the claim fails and show the supposition wrecks something. You gain
      an extra hypothesis and lose the obligation to aim at any particular
      conclusion.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.direct-proof
      - foundations.logic.conditional-as-disjunction
      - foundations.logic.double-negation
    relates: []
    tags: []

  - id: foundations.proof.ex-sqrt-two-irrational
    kind: example
    prominence: 1
    title: "√2 is irrational"
    statement: >
      Claim: no rational number has square $2$. Proof: suppose some rational
      number does, and write it as $p/q$ in lowest terms, with $p, q$ integers
      and $q \ne 0$, so that $p$ and $q$ are not both even. Clearing the
      denominator in $(p/q)^2 = 2$ gives $p^2 = 2q^2$, so $p^2$ is even, hence
      $p$ is even — by contraposition, since an odd integer has odd square.
      Write $p = 2r$; then $4r^2 = 2q^2$, so $q^2 = 2r^2$ and the same step
      makes $q$ even too. Thus $p$ and $q$ are both even, contradicting lowest
      terms, and no such rational exists. Two features are typical of the
      method: the contradiction is with a normalization the prover imposed for
      free, and the argument produces no object at all — it establishes the
      impossibility of one.
    summary: >
      The classic contradiction: assume the fraction exists in lowest terms and
      derive that it is not in lowest terms. Nothing is constructed; a
      possibility is destroyed.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.contradiction
      - foundations.proof.contraposition
    relates: []
    tags: []

  - id: foundations.proof.biconditional
    kind: technique
    prominence: 1
    title: "Proving a biconditional"
    statement: >
      $P \iff Q$ asserts both $P \Rightarrow Q$ and $Q \Rightarrow P$. Proving it
      means giving two separate proofs, each starting from its own hypothesis;
      neither direction follows from the other. The conventional labels are
      ($\Rightarrow$), read "only if", for $P \Rightarrow Q$, and "if" for the
      converse. A biconditional may instead be proved as a single chain of
      equivalences $P \iff P_1 \iff \cdots \iff Q$, but only when every link is
      genuinely reversible; a chain of one-way implications proves one direction
      and no more. For a list of $n$ statements claimed equivalent, it suffices
      to prove one cycle $S_1 \Rightarrow S_2 \Rightarrow \cdots \Rightarrow S_n
      \Rightarrow S_1$, which yields every implication between them from $n$
      proofs instead of $n(n-1)$.
    summary: >
      Two statements are equivalent only when each implies the other, so a
      biconditional is two proofs. For a list of equivalent conditions, a single
      cycle of implications does the whole job.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.direct-proof
    relates: []
    tags: []

  - id: foundations.proof.cases
    kind: technique
    prominence: 1
    title: "Proof by cases"
    statement: >
      To prove $S$ by cases, give finitely many conditions $C_1, \ldots, C_n$
      that are exhaustive — under the hypotheses of $S$, at least one of them
      must hold — and prove $S$ separately assuming each. Exhaustiveness is what
      makes the argument valid and is itself part of the proof, to be justified
      rather than assumed; the cases need not be mutually exclusive, since
      overlap costs only duplicated work. The same move is how a disjunctive
      hypothesis gets used: from "$P_1$ or $P_2$" the conclusion is available
      only by deriving it from each disjunct separately. For example
      $|x| \ge x$ for every real $x$, by the cases $x \ge 0$, where $|x| = x$,
      and $x < 0$, where $|x| = -x > 0 > x$. An omitted case is not a small
      defect: the statement is simply unproved there.
    summary: >
      Split the situation into finitely many possibilities that cover everything,
      then prove the claim in each. Showing the list is exhaustive is as much a
      part of the proof as the cases themselves.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.direct-proof
    relates: []
    tags: []

  - id: foundations.proof.wlog
    kind: technique
    prominence: 0
    title: "Without loss of generality"
    statement: >
      "Without loss of generality, assume $C$" is a legitimate abbreviation
      exactly when the remaining cases reduce to case $C$ under an explicit
      transformation that preserves both the hypotheses and the conclusion —
      typically a symmetry of the statement, such as relabelling. For a claim
      about reals $x$ and $y$ that is unchanged when the two names are swapped,
      one may assume WLOG that $x \le y$: the case $y < x$ is the case already
      proved, read with the names exchanged. The obligation is to be able to
      produce that transformation on request, since WLOG is a compression of a
      proof by cases and not a licence to drop cases. It is unavailable when the
      discarded cases do not map to the retained one — assuming WLOG that a
      triangle has three distinct side lengths throws the isosceles case away
      rather than reducing it.
    summary: >
      A licensed shortcut inside a case analysis: when a symmetry carries the
      other cases onto the one you keep, proving that one proves them all. Name
      the symmetry, or the shortcut is a gap.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.cases
    relates: []
    tags: []

  - id: foundations.proof.universal-proof
    kind: technique
    prominence: 1
    title: "Proving a universally quantified statement"
    statement: >
      To prove $\forall x \in D, P(x)$: let $x$ be an arbitrary element of $D$
      and prove $P(x)$ using no property of $x$ beyond $x \in D$. The argument
      then covers every element, precisely because nothing distinguished the one
      chosen; the signature of an invalid attempt is a step that quietly assumes
      something extra about $x$ — that it is nonzero, or positive, or not the
      largest. Confirming $P$ on examples is not a proof unless $D$ is finite and
      the examples exhaust it. If $D$ is empty the statement is vacuously true.
      Almost every "if ... then ..." theorem is really of the nested form
      $\forall x\,(P(x) \Rightarrow Q(x))$, proved by taking $x$ arbitrary first
      and only then assuming $P(x)$.
    summary: >
      Prove it for a single element chosen so arbitrarily that the argument never
      learns which one it is. Checking instances, however many, is not a
      substitute.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.direct-proof
      - foundations.logic.quantifier-universal
    relates: []
    tags: []

  - id: foundations.proof.existence-constructive
    kind: technique
    prominence: 1
    title: "Constructive existence proof"
    statement: >
      To prove $\exists x \in D, P(x)$ constructively: exhibit a specific $x$ —
      by formula, by algorithm, or by an explicit construction from the
      hypotheses — then verify that $x \in D$ and that $P(x)$ holds. Both
      verifications belong to the proof; producing a candidate without checking
      it proves nothing. The witness may depend on whatever data the hypotheses
      supply. Only the verification is normally written down while the search
      that found the witness is not, which is why constructive proofs so often
      read as though the answer arrived from nowhere — the asymmetry is one of
      exposition, not of logic. Such a proof delivers more than the theorem: it
      delivers a method, and its content survives when one wants an algorithm
      rather than a fact.
    summary: >
      Produce the object and check it. The strongest kind of existence proof,
      because it hands you the thing itself rather than only the news that it
      exists.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.direct-proof
      - foundations.logic.quantifier-existential
    relates: []
    tags: []

  - id: foundations.proof.existence-nonconstructive
    kind: technique
    prominence: 1
    title: "Non-constructive existence proof"
    statement: >
      A non-constructive existence proof establishes $\exists x\, P(x)$ without
      exhibiting any witness. The standard routes are three: assume that no $x$
      satisfies $P$ and derive a contradiction; count or measure, showing that
      the objects failing $P$ are too few to be all of them; or appeal to an
      existence axiom or a theorem whose own content is an object never
      exhibited. Such a proof is exactly as valid as a constructive one and
      strictly less informative — it can establish that a number, a colouring or
      a solution exists while leaving no way to produce one. The distinction
      belongs to the argument rather than to the statement: one theorem may have
      proofs of both kinds, and replacing a non-constructive proof by a
      constructive one is a genuine mathematical advance.
    summary: >
      Show that non-existence is impossible, without ever naming a witness.
      Perfectly valid, and it can leave you knowing something exists with no idea
      what it is.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.existence-constructive
      - foundations.proof.contradiction
    relates:
      - id: foundations.real.completeness
        note: 'Analysis rests on a non-constructive existence axiom: the supremum is asserted to exist with no means of exhibiting it.'
    tags: []

  - id: foundations.proof.ex-irrational-power
    kind: example
    prominence: 0
    title: "Irrational powers that come out rational"
    statement: >
      Claim: there exist irrational numbers $a$ and $b$ such that $a^b$ is
      rational. Proof: let $t = \sqrt{2}^{\sqrt{2}}$ and split into two cases. If
      $t$ is rational, take $a = b = \sqrt{2}$, both irrational, and $a^b = t$ is
      rational. If $t$ is irrational, take $a = t$ and $b = \sqrt{2}$, both
      irrational, and then
      $a^b = (\sqrt{2}^{\sqrt{2}})^{\sqrt{2}} = \sqrt{2}^{2} = 2$, rational. One
      of the two cases holds, so the required pair exists. The case analysis is
      exhaustive and the proof is correct, yet it names no pair: it never
      determines which case is the true one. (It is the second, by the
      Gelfond–Schneider theorem — a far deeper result that plays no part in this
      argument.)
    summary: >
      A two-case argument proving that a pair of numbers exists without ever
      saying which pair — the smallest clean illustration of what
      non-constructive means.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.existence-nonconstructive
      - foundations.proof.cases
      - foundations.proof.ex-sqrt-two-irrational
    relates: []
    tags: []

  - id: foundations.proof.ex-infinitude-primes
    kind: example
    prominence: 1
    title: "Infinitude of the primes"
    statement: >
      Claim: no finite list contains every prime. Proof: let $p_1, \ldots, p_n$
      be any finite list of primes and put $N = p_1 p_2 \cdots p_n + 1$. Since
      $N > 1$ it has a prime divisor $q$. If $q$ were one of the $p_i$ it would
      divide both $N$ and the product $p_1 \cdots p_n$, hence their difference
      $1$, which is impossible. So $q$ is a prime outside the list, and no finite
      list is complete. Note what the argument is and is not: it is constructive,
      since it turns any finite set of primes into a new one, and it does not
      claim $N$ is prime — for instance
      $2 \cdot 3 \cdot 5 \cdot 7 \cdot 11 \cdot 13 + 1 = 30031 = 59 \cdot 509$.
      Opening with "suppose there were only finitely many primes" adds a layer of
      contradiction the argument never uses.
    summary: >
      Euclid's argument, which manufactures a new prime out of any finite list.
      Usually told as a proof by contradiction, it is really a construction — a
      good test of whether a contradiction is doing any work.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.existence-constructive
      - foundations.proof.contradiction
    relates: []
    tags: []

  - id: foundations.proof.uniqueness
    kind: technique
    prominence: 1
    title: "Uniqueness proofs"
    statement: >
      "There is a unique $x \in D$ with $P(x)$", written $\exists ! x\, P(x)$, is
      two claims: existence, and uniqueness — at most one such $x$. They are
      proved separately and by different means. The standard uniqueness argument
      assumes that $x$ and $y$ both lie in $D$ and satisfy $P$, and derives
      $x = y$; the equivalent contraposed form assumes $x \ne y$ and shows they
      cannot both satisfy $P$. Deriving $x = y$ almost always means playing
      $P(x)$ and $P(y)$ against each other rather than examining either alone.
      Uniqueness can hold vacuously in the absence of existence — there is no
      positive rational $x$ with $x^2 = 2$, yet at most one could exist — so a
      uniqueness proof never establishes existence, and the word "unique" in a
      statement is unearned until both halves are done.
    summary: >
      Show that any two objects with the property are the same object. That is
      half of an "exactly one" claim, and it is independent of the half that
      produces one.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.existence-constructive
    relates: []
    tags: []

  - id: foundations.proof.counterexample
    kind: technique
    prominence: 1
    title: "Disproof by counterexample"
    statement: >
      The negation of $\forall x \in D, P(x)$ is $\exists x \in D, \neg P(x)$.
      So a universal claim is refuted by exhibiting one $x \in D$ and verifying
      that $P(x)$ fails — a constructive existence proof of the negation, and the
      entire disproof: a single counterexample settles the matter no matter how
      many confirming instances came before it. Both verifications are required,
      that the candidate really lies in $D$ and that $P$ really fails for it. A
      counterexample does not locate the error in the failed proof, does not show
      that some repaired version of the statement is true, and says nothing about
      the claim's converse. Failing to find one is evidence of nothing.
    summary: >
      One instance where the claim fails kills a "for all" statement outright,
      and verifying that instance is the whole disproof. Finding no counterexample
      proves nothing.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.universal-proof
      - foundations.proof.existence-constructive
      - foundations.logic.quantifier-negation
    relates: []
    tags: []

  - id: foundations.proof.ex-failed-pattern
    kind: example
    prominence: 0
    title: "A pattern that holds forty times and then fails"
    statement: >
      The polynomial $f(n) = n^2 + n + 41$ is prime for every integer $n$ with
      $0 \le n \le 39$, so the claim "$f(n)$ is prime for all $n \ge 0$" survives
      forty consecutive checks. It is false at the next one:
      $f(40) = 1600 + 40 + 41 = 1681 = 41 \cdot 41$. The same failure occurs far
      out of reach of any checking — the least counterexample to Pólya's
      conjecture on the parity of prime factorizations exceeds $9 \times 10^8$,
      and none of the hundreds of millions of confirming cases before it counted
      for anything. Verified instances of a universal statement indicate where to
      look; they never accumulate into a proof, and no finite quantity of them
      converts into certainty.
    summary: >
      Forty verified cases and the forty-first fails — the concrete reason
      checking examples is not proving. Numerical evidence tells you where to
      look, not what is true.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.counterexample
    relates: []
    tags: []

  - id: foundations.proof.nested-quantifiers
    kind: technique
    prominence: 1
    title: "Proving statements with nested quantifiers"
    statement: >
      When quantifiers alternate, their order is the content:
      $\forall x \in \mathbb{R}, \exists y \in \mathbb{R}, y > x$ is true, while
      $\exists y \in \mathbb{R}, \forall x \in \mathbb{R}, y > x$ is false. A
      proof reads them left to right — each $\forall$ introduces a new arbitrary
      element, each $\exists$ bills you for a witness, and a witness may depend on
      every variable introduced before it and on none introduced after. The
      standard analysis shape
      $\forall \varepsilon > 0, \exists \delta > 0, \forall x, (\ldots)$ is
      therefore proved by taking $\varepsilon > 0$ arbitrary, producing a $\delta$
      that is allowed to be a formula in $\varepsilon$, and verifying the inner
      claim for all $x$; a $\delta$ that secretly depends on $x$ proves a
      different statement. The witness is found by scratch work running backwards
      from the required conclusion, and the written proof states it first and
      verifies forwards.
    summary: >
      Read the quantifiers in order: each "for all" hands you an arbitrary
      object, each "there exists" bills you a witness, and a witness may use only
      what was introduced before it.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.universal-proof
      - foundations.proof.existence-constructive
      - foundations.logic.nested-quantifiers
    relates: []
    tags: []

  - id: foundations.proof.form-dictates-proof
    kind: intuition
    prominence: 1
    title: "Logical form dictates the shape of a proof"
    statement: >
      Before any mathematical idea is needed, the outermost logical structure of
      a claim already fixes the opening and closing lines of its proof.
      "$\forall x \in D$" opens with "let $x \in D$ be arbitrary". "$\exists x$"
      obliges a witness. "$P \Rightarrow Q$" opens by assuming $P$ and closes on
      $Q$, or contraposed, opens by assuming $\neg Q$. "$P$ and $Q$" is two
      proofs; "$P$ or $Q$" is usually proved by assuming $P$ fails and deriving
      $Q$; a disjunction among the hypotheses is a case split.
      "$P \iff Q$" is two proofs in opposite directions. "$\neg S$" is most often
      "assume $S$, derive a contradiction", and "$x$ is unique" is "suppose two,
      show they coincide". This is why an unfamiliar statement is never a blank
      page: unfolding its quantifiers and connectives, and then the definitions
      of the terms inside, yields a skeleton with holes in it, and the
      mathematics is only what fills the holes.
    summary: >
      Every proof has a skeleton readable straight off the statement, before any
      thinking about the subject matter. Write the skeleton first and the real
      difficulty becomes visible.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.universal-proof
      - foundations.proof.existence-constructive
      - foundations.proof.contraposition
      - foundations.proof.biconditional
      - foundations.proof.contradiction
      - foundations.proof.cases
    relates: []
    tags: []

  - id: foundations.proof.err-affirming-consequent
    kind: intuition
    prominence: 1
    title: "Affirming the consequent"
    statement: >
      From $P \Rightarrow Q$ together with $Q$, nothing follows about $P$;
      concluding $P$ is the fallacy of affirming the consequent, and amounts to
      silently substituting the converse $Q \Rightarrow P$, a different statement
      carrying its own burden of proof. An implication can be combined with the
      truth or the falsity of one of its two sides in four ways, and only two of
      them are valid: modus ponens, from $P$ conclude $Q$, and modus tollens,
      from $\neg Q$ conclude $\neg P$. Denying the antecedent — from $\neg P$
      concluding $\neg Q$ — is the same error mirrored. In written mathematics
      the fallacy usually appears as reasoning from the goal: starting with the
      identity to be proved and manipulating both sides until reaching $0 = 0$
      shows only that the claim implies something true, which every false claim
      also does. Such a computation becomes a proof only when every step is
      reversible and the argument is written in the reverse order.
    summary: >
      "If P then Q, and Q, therefore P" is invalid — it quietly swaps in the
      converse. Only two inferences are legal from an implication: forwards from
      the hypothesis, backwards from the negated conclusion.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.contraposition
    relates: []
    tags: []

  - id: foundations.proof.err-circular
    kind: intuition
    prominence: 1
    title: "Circular reasoning"
    statement: >
      An argument is circular when the claim being proved is among the things
      used to prove it. The direct form assumes $S$ and concludes $S$, which
      establishes nothing, since $S \Rightarrow S$ holds for every statement
      whatever. The form at a distance is the dangerous one: a cited theorem
      whose own proof depends, perhaps several steps away, on the claim now being
      proved. It is invisible inside any single argument and is caught only by
      checking that the whole chain of cited results terminates in axioms and
      definitions. Distinguish this sharply from proof by contradiction, where
      assuming $\neg S$ is legitimate exactly because the assumption is refuted
      rather than used. A related and equally fatal move is smuggling the
      conclusion into a definition or into a "clearly", so that the step which
      would have needed the claim is never written down.
    summary: >
      Using the conclusion — directly, or through some result that itself rests
      on it — to establish the conclusion. Assuming the negation is a method;
      assuming the claim is a hole.
    parent: foundations.proof
    also_under: []
    requires:
      - foundations.proof.contradiction
    relates: []
    tags: []
