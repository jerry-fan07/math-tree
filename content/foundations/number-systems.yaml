# foundations.number-systems — Construction of the Number Systems
# The tower ℕ → ℤ → ℚ → ℝ → ℂ: arithmetic and order on ℕ built by recursion on
# the Peano successor, the two quotient constructions and the defect each
# repairs, the ordered-field axioms as a package, the incompleteness of ℚ, the
# two constructions of ℝ and its characterization as the complete ordered field,
# and ℂ with the order it costs. The Peano axioms themselves live in
# foundations.induction, which also supplies the recursion theorem that licenses
# the definitions of + and · here; they are required from there, not restated.

nodes:
  - id: foundations.number-systems
    kind: subbranch
    title: "Construction of the Number Systems"
    summary: >
      From the Peano axioms to $\mathbb{Z}$, $\mathbb{Q}$ and $\mathbb{R}$:
      what each extension is built to fix, and the algebraic and order
      structure that survives each step.
    parent: foundations
    also_under: []
    tags: []

  - id: foundations.number-systems.def-nat-addition
    kind: definition
    prominence: 1
    title: "Addition on ℕ"
    statement: >
      Addition on $\mathbb{N}$ is the operation defined, for each fixed
      $m \in \mathbb{N}$, by recursion on the second argument: $m + 0 = m$ and
      $m + S(n) = S(m + n)$. It is the recursion theorem — applied with
      $X = \mathbb{N}$, initial value $a = m$ and step function
      $g(n, x) = S(x)$ — that guarantees these two clauses determine one and
      only one function of $n$, so that "add by counting up" is a definition and
      not merely a procedure. Two facts are immediate from the clauses:
      $m + 1 = m + S(0) = S(m)$, so the successor is addition of $1$ and the
      notation $n + 1$ for $S(n)$ is legitimate; and every value of $m + n$ is
      reached from $m$ by applying $S$ exactly $n$ times.
    summary: >
      Addition is not a primitive notion. It is manufactured from the successor
      operation by recursion on one argument, and the recursion theorem is what
      makes the two-clause definition define anything.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.induction.recursion-theorem
    relates: []
    tags: []

  - id: foundations.number-systems.nat-addition-laws
    kind: proposition
    prominence: 1
    title: "Basic laws of addition on ℕ"
    statement: >
      For all $m, n, k \in \mathbb{N}$: $n + 0 = 0 + n = n$ (identity);
      $(m + n) + k = m + (n + k)$ (associativity); $m + n = n + m$
      (commutativity); $m + k = n + k \implies m = n$ (cancellation); and
      $m + n = 0$ only if $m = n = 0$. Every one is proved by induction, and the
      asymmetry of the recursive clauses is what makes work necessary: $n + 0 = n$
      holds by definition while $0 + n = n$ needs an induction on $n$, and
      commutativity needs the auxiliary lemma $S(m) + n = S(m + n)$, proved the
      same way, before its own induction will close. Associativity is an
      induction on $k$, cancellation an induction on $k$ using injectivity of
      $S$. Taken together these say that $\mathbb{N}$ under addition is a
      commutative monoid in which every element cancels; the single missing
      feature is inverses, and supplying them is exactly what the construction
      of $\mathbb{Z}$ does.
    summary: >
      The familiar rules of addition are theorems about the recursive
      definition, not assumptions, and each is an induction. What they do not
      provide is subtraction.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.def-nat-addition
    relates: []
    tags: []

  - id: foundations.number-systems.def-nat-multiplication
    kind: definition
    prominence: 1
    title: "Multiplication on ℕ"
    statement: >
      Multiplication on $\mathbb{N}$ is defined, for each fixed
      $m \in \mathbb{N}$, by recursion on the second argument: $m \cdot 0 = 0$
      and $m \cdot S(n) = m \cdot n + m$. This is again the recursion theorem,
      now with initial value $0$ and step function $g(n, x) = x + m$, so
      multiplication is repeated addition in the precise sense that its
      recursion step is "add $m$ once more". Immediately $m \cdot 1 = m$.
      Exponentiation continues the pattern one level higher, $m^0 = 1$ and
      $m^{n+1} = m^n \cdot m$, with step function $g(n, x) = x \cdot m$.
    summary: >
      Multiplication is built on top of addition by the same recursive device,
      one level up: its step is "add $m$ once more" rather than "take the
      successor".
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.def-nat-addition
    relates: []
    tags: []

  - id: foundations.number-systems.nat-multiplication-laws
    kind: proposition
    prominence: 0
    title: "Basic laws of multiplication on ℕ"
    statement: >
      For all $m, n, k \in \mathbb{N}$: $m \cdot (n + k) = m \cdot n + m \cdot k$
      (distributivity); $(m \cdot n) \cdot k = m \cdot (n \cdot k)$
      (associativity); $m \cdot n = n \cdot m$ (commutativity);
      $1 \cdot n = n \cdot 1 = n$ (identity); $m \cdot n = 0$ implies $m = 0$ or
      $n = 0$ (no zero divisors); and $m \cdot k = n \cdot k$ with $k \ne 0$
      implies $m = n$ (cancellation). The order of proof is forced and is worth
      noticing: distributivity comes first, by induction on $k$ from the
      recursive clause alone; associativity and commutativity then rest on it,
      commutativity again needing the auxiliary lemmas $0 \cdot n = 0$ and
      $S(m) \cdot n = m \cdot n + n$. All of the laws use the corresponding laws
      of addition, since the recursion for multiplication is written in terms of
      addition.
    summary: >
      The rules of multiplication, and how they descend from the recursive
      definition — distributivity first, because everything else is proved
      through it.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.def-nat-multiplication
      - foundations.number-systems.nat-addition-laws
    relates: []
    tags: []

  - id: foundations.number-systems.def-nat-order
    kind: definition
    prominence: 1
    title: "The order on ℕ"
    statement: >
      For $m, n \in \mathbb{N}$ define $m \le n$ to mean that $m + k = n$ for
      some $k \in \mathbb{N}$, and $m < n$ to mean that such a $k$ is nonzero.
      This is a total order: reflexivity takes $k = 0$; transitivity adds the
      two witnesses; antisymmetry follows because $m + k = n$ and $n + l = m$
      give $m + (k + l) = m$, hence $k + l = 0$, hence $k = l = 0$; and
      comparability of any two naturals is an induction. It is compatible with
      the arithmetic: $m \le n$ if and only if $m + k \le n + k$, and $m \le n$
      implies $m \cdot k \le n \cdot k$, with strictness preserved when
      $k \ne 0$. Two features of this order are special to $\mathbb{N}$ and do
      not survive the extensions below: $0$ is a least element and more
      generally every nonempty subset has one; and the order is discrete, since
      $m < n$ forces $m + 1 \le n$, so no natural number lies strictly between
      $n$ and $n + 1$.
    summary: >
      "Less than or equal" is not extra structure but a definition in terms of
      addition: $m \le n$ says that $n$ is reachable from $m$ by adding
      something.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.nat-multiplication-laws
      - foundations.relations.def-total-order
    relates: []
    tags: []

  - id: foundations.number-systems.nat-categorical
    kind: theorem
    prominence: 1
    title: "ℕ is unique up to isomorphism"
    statement: >
      Let $(\mathbb{N}, 0, S)$ and $(N', 0', S')$ both satisfy the Peano axioms.
      Then there is exactly one map $f : \mathbb{N} \to N'$ with $f(0) = 0'$ and
      $f(S(n)) = S'(f(n))$ for every $n$, and it is a bijection. Existence and
      uniqueness of $f$ are the recursion theorem with $X = N'$, initial value
      $0'$ and step function $g(n, x) = S'(x)$; the same argument in the other
      direction produces $f' : N' \to \mathbb{N}$, and each composite
      $f' \circ f$ and $f \circ f'$ satisfies the recursion that defines the
      corresponding identity map, so by the uniqueness half both composites are
      identities. Since $f$ also carries the recursive definitions of $+$,
      $\cdot$ and $\le$ across, it preserves all of the arithmetic. Hence "the"
      natural numbers is a legitimate phrase: which set-theoretic implementation
      is chosen — the von Neumann ordinals $\emptyset$, $\{\emptyset\}$,
      $\{\emptyset, \{\emptyset\}\}$, or any other — carries no mathematical
      content.
    summary: >
      Any two systems satisfying the Peano axioms are the same system relabelled,
      which is why one may speak of the natural numbers rather than of a choice
      of them.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.induction.recursion-theorem
      - foundations.functions.def-bijective
    relates: []
    tags: []

  - id: foundations.number-systems.def-integers
    kind: definition
    prominence: 1
    title: "ℤ as a quotient of ℕ × ℕ"
    statement: >
      On $\mathbb{N} \times \mathbb{N}$ define $(a, b) \sim (c, d)$ to mean
      $a + d = c + b$. This is an equivalence relation: reflexivity and symmetry
      are immediate, and transitivity follows by adding the two defining
      equations and cancelling the repeated term. The integers are the quotient
      $\mathbb{Z} = (\mathbb{N} \times \mathbb{N})/{\sim}$. The class
      $[(a, b)]$ is to be read as the difference $a - b$, and the definition of
      $\sim$ is written with additions only precisely because that subtraction
      is not yet available — the construction may not use the operation it
      exists to create. Every class contains exactly one pair of the form
      $(n, 0)$ or $(0, n)$, which is the trichotomy positive / zero / negative
      in the form the construction delivers it.
    summary: >
      An integer is defined as a difference of two naturals, with two
      differences counted as the same integer when the cross-sums agree — a
      device for describing subtraction before subtraction exists.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.nat-addition-laws
      - foundations.relations.def-quotient-set
    relates:
      - id: foundations.relations.ex-integers-mod-n
        note: 'Both manufacture a number system as a quotient of a familiar one by an explicitly given equivalence relation; there the classes are residues, here they are differences.'
    tags: []

  - id: foundations.number-systems.integers-operations
    kind: proposition
    prominence: 0
    title: "Arithmetic and order on ℤ are well defined"
    statement: >
      Define, on classes, $[(a, b)] + [(c, d)] = [(a + c,\,b + d)]$,
      $[(a, b)] \cdot [(c, d)] = [(a c + b d,\,a d + b c)]$, and
      $[(a, b)] \le [(c, d)]$ if and only if $a + d \le c + b$. Each is stated
      through representatives, so each carries the obligation to check that
      replacing $(a, b)$ and $(c, d)$ by equivalent pairs leaves the answer
      unchanged; for addition this is a rearrangement of the defining equations,
      for the order it is compatibility of $\le$ with addition on $\mathbb{N}$,
      and for multiplication it is the one computation with any content, which
      uses distributivity. The formulas are not arbitrary: reading $[(a, b)]$ as
      $a - b$, they are what the ring laws force, since $(a - b) + (c - d)$ and
      $(a - b)(c - d)$ expand to exactly these expressions. The map
      $n \mapsto [(n, 0)]$ is injective and preserves sums, products and order,
      so $\mathbb{N}$ is identified with a subset of $\mathbb{Z}$ on which the
      new operations restrict to the old.
    summary: >
      The operations on $\mathbb{Z}$ are read off from what the classes are
      supposed to mean, and the work is checking that they do not depend on the
      representatives chosen.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.def-integers
      - foundations.number-systems.def-nat-order
      - foundations.relations.well-defined-on-quotient
    relates: []
    tags: []

  - id: foundations.number-systems.integers-ordered-ring
    kind: proposition
    prominence: 1
    title: "ℤ: what the construction fixes and what it costs"
    statement: >
      With those operations $\mathbb{Z}$ satisfies: addition is associative and
      commutative with identity $0 = [(0, 0)]$ and with an inverse
      $-[(a, b)] = [(b, a)]$ for every element; multiplication is associative
      and commutative with identity $1 = [(1, 0)]$ and distributes over
      addition; $x y = 0$ forces $x = 0$ or $y = 0$, equivalently $x z = y z$
      with $z \ne 0$ forces $x = y$; and the order is total, is preserved by
      adding any element, and is preserved by multiplying by any element
      $\ge 0$. In later language, $\mathbb{Z}$ is an ordered integral domain.
      The gain is the additive inverse: with $x - y$ defined as $x + (-y)$,
      subtraction is a total operation and $x + a = b$ is always solvable, which
      fails in $\mathbb{N}$ whenever $a > b$. The loss is well-ordering —
      $\mathbb{Z}$ has no least element and neither does its set of negatives,
      so an argument by minimal counterexample is legal only on a nonempty set
      of integers that is bounded below, where a least element does still exist.
      What is still missing is division: $2 x = 1$ has no solution.
    summary: >
      $\mathbb{Z}$ buys subtraction at the price of well-ordering, and it still
      cannot divide — which is the defect the next construction addresses.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.integers-operations
    relates: []
    tags: []

  - id: foundations.number-systems.def-ordered-field
    kind: axiom
    prominence: 1
    title: "Ordered field axioms"
    statement: >
      An ordered field is a set $F$ carrying two operations $+$ and $\cdot$,
      two distinguished elements $0 \ne 1$, and a total order $\le$, subject
      to: (F1) $+$ is associative and commutative, $x + 0 = x$, and every $x$
      has an additive inverse $-x$ with $x + (-x) = 0$; (F2) $\cdot$ is
      associative and commutative, $x \cdot 1 = x$, and every $x \ne 0$ has a
      multiplicative inverse $x^{-1}$ with $x x^{-1} = 1$; (F3)
      $x (y + z) = x y + x z$; (O1) $x \le y$ implies $x + z \le y + z$ for
      every $z$; (O2) $0 \le x$ and $0 \le y$ imply $0 \le x y$. Subtraction and
      division are then defined by $x - y = x + (-y)$ and $x / y = x y^{-1}$ for
      $y \ne 0$, and are total apart from division by $0$. The axioms are meant
      as a package: they are exactly the rules of school algebra together with
      the rules for manipulating inequalities. Everything provable from them
      alone holds in $\mathbb{Q}$ and in $\mathbb{R}$ alike, which is the reason
      they cannot characterize $\mathbb{R}$ and something further will be
      needed.
    summary: >
      One list of axioms naming everything the arithmetic of $\mathbb{Q}$ and
      $\mathbb{R}$ has in common: four operations that behave, and an order that
      respects them.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.relations.def-total-order
    relates: []
    tags: []

  - id: foundations.number-systems.ordered-field-consequences
    kind: proposition
    prominence: 0
    title: "What the ordered-field axioms already give"
    statement: >
      In any ordered field $F$: $x \cdot 0 = 0$; $-(-x) = x$ and
      $(-x) y = -(x y)$; $x \le y$ if and only if $0 \le y - x$; $x \le y$ with
      $0 \le c$ gives $c x \le c y$, while $c \le 0$ reverses the inequality;
      every square is nonnegative, $x^2 \ge 0$, with $x^2 = 0$ only for $x = 0$;
      consequently $1 = 1^2 > 0$, so $0 < 1 < 1 + 1 < 1 + 1 + 1 < \cdots$ and
      the sums $1 + \cdots + 1$ are all distinct and nonzero, which means $F$
      contains an isomorphic copy of $\mathbb{N}$, hence of $\mathbb{Z}$, hence
      — closing under quotients — of $\mathbb{Q}$; and $0 < x < y$ implies
      $0 < y^{-1} < x^{-1}$. The nonnegativity of squares is the most used of
      these and also the sharpest, because it is a constraint on which fields
      admit an order at all.
    summary: >
      The everyday manipulations of inequalities, derived rather than assumed —
      and two structural facts: every ordered field contains $\mathbb{Q}$, and
      in every ordered field squares are nonnegative.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.def-ordered-field
    relates: []
    tags: []

  - id: foundations.number-systems.def-rationals
    kind: definition
    prominence: 1
    title: "ℚ as a quotient of ℤ × (ℤ ∖ {0})"
    statement: >
      On $\mathbb{Z} \times (\mathbb{Z} \setminus \{0\})$ define
      $(a, b) \sim (c, d)$ to mean $a d = c b$. Transitivity is the step with
      content, and it is where the absence of zero divisors in $\mathbb{Z}$ is
      used: from $a d = c b$ and $c f = e d$ one gets
      $d (a f - e b) = 0$, and $d \ne 0$ forces $a f = e b$. The rationals are
      the quotient
      $\mathbb{Q} = (\mathbb{Z} \times (\mathbb{Z} \setminus \{0\}))/{\sim}$,
      and the class $[(a, b)]$ is written $a / b$ and read as the solution of
      $b x = a$ — the equation $\mathbb{Z}$ cannot in general solve. The second
      coordinate is barred from being $0$ because $0 \cdot x = a$ has no
      solution to name for $a \ne 0$ and no unique one for $a = 0$. Each class
      contains exactly one pair $(a, b)$ with $b > 0$ and with $a$ and $b$
      having no common divisor greater than $1$: its lowest-terms
      representative.
    summary: >
      A rational number is defined as a ratio of two integers with nonzero
      denominator, two ratios being the same when they cross-multiply equally —
      the same quotient device as for $\mathbb{Z}$, applied to division.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.integers-ordered-ring
    relates: []
    tags: []

  - id: foundations.number-systems.rationals-operations
    kind: proposition
    prominence: 0
    title: "Arithmetic and order on ℚ are well defined"
    statement: >
      Define $[(a, b)] + [(c, d)] = [(a d + c b,\,b d)]$ and
      $[(a, b)] \cdot [(c, d)] = [(a c,\,b d)]$ — the second coordinate stays
      legal because $b \ne 0$ and $d \ne 0$ give $b d \ne 0$ — and declare
      $[(a, b)] \ge 0$, for a representative with $b > 0$, to mean $a \ge 0$,
      with $x \le y$ meaning $y - x \ge 0$. As always with a quotient, each
      definition must be shown independent of the representatives, and each
      check is a rearrangement using commutativity, distributivity and
      cancellation in $\mathbb{Z}$; for the order one checks in addition that
      every class does have a representative with positive second coordinate,
      obtained if necessary by negating both. The map $a \mapsto [(a, 1)]$ is
      injective and preserves sums, products and order, so $\mathbb{Z}$ is
      identified with a subset of $\mathbb{Q}$.
    summary: >
      The school rules for adding and multiplying fractions are exactly the
      formulas forced by the construction, and they need the same
      representative-independence check as before.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.def-rationals
    relates: []
    tags: []

  - id: foundations.number-systems.q-ordered-field
    kind: proposition
    prominence: 1
    title: "ℚ is an ordered field"
    statement: >
      With those operations and that order $\mathbb{Q}$ satisfies every ordered
      field axiom. The point of the construction is (F2): for
      $[(a, b)] \ne 0$ — that is, $a \ne 0$ — the inverse is $[(b, a)]$, which
      is well formed exactly because $a \ne 0$. So division by any nonzero
      element is total, and $a x = b$ with $a \ne 0$ has a unique solution,
      which is what $\mathbb{Z}$ could not deliver. One consequence of the
      axioms is worth isolating, because it reverses the situation in
      $\mathbb{N}$ and $\mathbb{Z}$: every ordered field, $\mathbb{Q}$ included,
      is densely ordered, since $1 + 1$ is positive, hence invertible, and
      $x < y$ implies $x < (x + y)/2 < y$. There is no next rational after a
      given one, and
      discreteness is gone for good — not because of anything special about
      $\mathbb{Q}$, but because no ordered field can be discretely ordered.
    summary: >
      $\mathbb{Q}$ is the first system in the tower where all four arithmetic
      operations are available, and its order is dense rather than discrete.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.rationals-operations
      - foundations.number-systems.def-ordered-field
    relates: []
    tags: []

  - id: foundations.number-systems.q-not-complete
    kind: proposition
    prominence: 1
    title: "ℚ has gaps: a bounded set with no supremum"
    statement: >
      Let $A = \{q \in \mathbb{Q} : q > 0 \text{ and } q^2 < 2\}$. Then $A$ is
      nonempty, since $1 \in A$, and bounded above, since $q \ge 2$ gives
      $q^2 \ge 4$; but $A$ has no least upper bound in $\mathbb{Q}$. Proof:
      suppose some $b \in \mathbb{Q}$ were a least upper bound. Then $b \ge 1$,
      since $1 \in A$, so $b > 0$; and no rational has square $2$, so either
      $b^2 < 2$ or $b^2 > 2$. Put $b' = (2 b + 2)/(b + 2)$, which is a positive
      rational, and compute
      $b' - b = (2 - b^2)/(b + 2)$ and $(b')^2 - 2 = 2 (b^2 - 2)/(b + 2)^2$. If
      $b^2 < 2$ then $b' > b$ and $(b')^2 < 2$, so $b' \in A$ and $b$ is not even
      an upper bound. If $b^2 > 2$ then $b' < b$ and $(b')^2 > 2$, and $b'$ is
      again an upper bound of $A$ because $q \in A$ and $b' > 0$ with
      $q^2 < 2 < (b')^2$ force $q < b'$; so $b$ is not the least one. Either way
      a contradiction, and $A$ has no supremum in $\mathbb{Q}$. Since
      $\mathbb{Q}$ is
      an ordered field, no consequence of the ordered field axioms can exclude
      this: the defect is in the order, not in the arithmetic, and repairing it
      means adding the least-upper-bound property.
    summary: >
      The rationals stop just short of $\sqrt{2}$ from both sides without ever
      arriving: a bounded set of rationals can fail to have a least upper bound,
      and that is the hole $\mathbb{R}$ is built to fill.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.q-ordered-field
      - foundations.relations.def-lub-poset
      - foundations.proof.ex-sqrt-two-irrational
    relates: []
    tags: []

  - id: foundations.number-systems.dedekind-cuts
    kind: definition
    prominence: 1
    title: "Construction of ℝ by Dedekind cuts"
    statement: >
      A cut is a set $\alpha \subseteq \mathbb{Q}$ such that (i)
      $\alpha \ne \emptyset$ and $\alpha \ne \mathbb{Q}$; (ii) $\alpha$ is
      closed downwards, meaning $p \in \alpha$ and $q < p$ imply
      $q \in \alpha$; (iii) $\alpha$ has no greatest element. Define
      $\mathbb{R}$ to be the set of all cuts, ordered by inclusion:
      $\alpha \le \beta$ means $\alpha \subseteq \beta$. Addition is
      $\alpha + \beta = \{p + q : p \in \alpha,\,q \in \beta\}$, the zero
      element is $0^{\ast} = \{p \in \mathbb{Q} : p < 0\}$, and $\mathbb{Q}$
      embeds by $r \mapsto r^{\ast} = \{p \in \mathbb{Q} : p < r\}$;
      multiplication is defined first for cuts $\ge 0^{\ast}$ and then extended
      by cases on signs, which is the only tedious part of the verification. The
      construction is stated here, not carried out; what matters is its shape. A
      real number is identified with the set of rationals below it, so a gap in
      $\mathbb{Q}$ is filled by the very set of rationals that describes it, and
      the least-upper-bound property becomes near-trivial: the supremum of a
      nonempty family of cuts that is bounded above is its union.
    summary: >
      Fill each hole in $\mathbb{Q}$ with the hole itself — define a real number
      to be the set of all rationals less than it, so that suprema are unions.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.q-ordered-field
      - foundations.relations.def-lub-poset
    relates: []
    tags: []

  - id: foundations.number-systems.cauchy-reals
    kind: definition
    prominence: 1
    title: "Construction of ℝ by Cauchy sequences"
    statement: >
      Write $|x|$ for $x$ or $-x$ according to sign, and call a sequence
      $(a_n)$ of rationals Cauchy if for every rational $\varepsilon > 0$ there
      is $N$ with $|a_m - a_n| < \varepsilon$ for all $m, n \ge N$. Let $C$ be
      the set of Cauchy sequences of rationals and define
      $(a_n) \sim (b_n)$ to mean that for every rational $\varepsilon > 0$ there
      is $N$ with $|a_n - b_n| < \varepsilon$ for all $n \ge N$; this is an
      equivalence relation. Define $\mathbb{R} = C/{\sim}$, with
      $[(a_n)] + [(b_n)] = [(a_n + b_n)]$ and
      $[(a_n)] \cdot [(b_n)] = [(a_n b_n)]$ — the sums and products of Cauchy
      sequences are Cauchy, boundedness of Cauchy sequences being what makes the
      product work, and neither operation depends on representatives — and
      declare $[(a_n)] > 0$ when some rational $\varepsilon > 0$ and index $N$
      have $a_n > \varepsilon$ for all $n \ge N$. The rationals embed as the
      classes of constant sequences. Here a real number is identified with a way
      of approximating it to arbitrary rational precision, and the construction
      generalizes verbatim to the completion of any metric space, which is why
      it, rather than the cut construction, is the one that reappears later.
    summary: >
      Define a real number to be a rational approximation scheme, with two
      schemes counted equal when they close in on each other — the construction
      that generalizes to every metric space.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.q-ordered-field
      - foundations.functions.def-sequence
    relates: []
    tags: []

  - id: foundations.number-systems.r-existence
    kind: theorem
    prominence: 2
    title: "ℝ exists: a complete ordered field"
    statement: >
      Call an ordered field complete if every nonempty subset of it that is
      bounded above has a least upper bound in it. Theorem: a complete ordered
      field exists, and it contains $\mathbb{Q}$ as a sub-ordered-field. Both
      constructions produce one. For cuts, the field and order axioms are
      verified directly and completeness is immediate, the supremum of a
      bounded nonempty family being its union. For Cauchy classes, the field
      axioms are routine except for the inverse — a class that is not $0$ has a
      representative bounded away from $0$, and the reciprocals of its terms
      form a Cauchy sequence — and the least-upper-bound property is obtained by
      bisection: trap a would-be supremum between an element of the set and an
      upper bound of it, halve the enclosing interval repeatedly, and the two
      sequences of endpoints are Cauchy and equivalent, so their common class is
      the supremum. In both cases the verification is long and contains no
      surprises beyond these two points. The consequence is that
      the least-upper-bound property need not be postulated on faith: it is a
      theorem about an object built from $\mathbb{N}$ by explicit means, so
      analysis may assume it without incurring a debt.
    summary: >
      There really is a number system with no gaps in its order and with all the
      usual arithmetic — and it is built, not assumed, from the naturals in
      three explicit steps.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.dedekind-cuts
      - foundations.number-systems.cauchy-reals
    relates: []
    tags: []

  - id: foundations.number-systems.r-uniqueness
    kind: theorem
    prominence: 1
    title: "The complete ordered field is unique up to isomorphism"
    statement: >
      If $F$ and $F'$ are complete ordered fields then there is exactly one
      field isomorphism $f : F \to F'$, and it automatically preserves order.
      Sketch: $f(1) = 1$ and additivity force $f$ on the copy of $\mathbb{N}$
      inside $F$, hence on $\mathbb{Z}$, hence on $\mathbb{Q}$;
      $f$ is then forced everywhere by
      $f(x) = \sup \{ f(q) : q \in \mathbb{Q},\,q < x \}$, since in a complete
      ordered field every element is the supremum of the rationals below it, and
      one checks that this map is additive, multiplicative and bijective. Order
      is preserved for free: in a complete ordered field the nonnegative
      elements are exactly the squares, and being a square is a condition
      phrased in $+$ and $\cdot$ alone, which any field isomorphism must
      respect. So one may speak of the real numbers: the cut construction and
      the Cauchy construction, however unalike they look, deliver the same
      object, exactly as the Peano axioms determine $\mathbb{N}$ up to unique
      isomorphism one level down.
    summary: >
      Completeness plus the ordered field axioms pin down a single structure, so
      the two constructions of $\mathbb{R}$ are two descriptions of one thing.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.r-existence
    relates: []
    tags: []

  - id: foundations.number-systems.archimedean
    kind: theorem
    prominence: 1
    title: "Archimedean property of ℝ"
    statement: >
      For every $x \in \mathbb{R}$ there is $n \in \mathbb{N}$ with $n > x$;
      equivalently, for all real $x > 0$ and $y$ there is $n$ with $n x > y$;
      equivalently, for every real $\varepsilon > 0$ there is a nonzero
      $n \in \mathbb{N}$ with $1/n < \varepsilon$. Proof: $\mathbb{N}$ is
      nonempty, so if it were bounded above in
      $\mathbb{R}$ it would have a supremum $s$ by completeness; then $s - 1$ is
      not an upper bound, so $m > s - 1$ for some $m \in \mathbb{N}$, whence
      $m + 1 > s$ with $m + 1 \in \mathbb{N}$ — a contradiction. The property
      does not follow from the ordered field axioms alone: there are
      non-Archimedean ordered fields, for instance the rational functions with
      real coefficients ordered by their behaviour for large arguments, in which
      the element $x$ exceeds every constant and $1/x$ is a positive element
      smaller than every $1/n$. Completeness is what rules them out. A
      consequence in constant use: every real $x$ has a unique integer part
      $\lfloor x \rfloor$ with
      $\lfloor x \rfloor \le x < \lfloor x \rfloor + 1$.
    summary: >
      No real number is infinitely large and no positive real is infinitely
      small: the naturals eventually pass any real, so $1/n$ eventually drops
      below any positive threshold.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.r-existence
    relates:
      - id: analysis.svc.def-limit
        note: 'The Archimedean property is what supplies the index or the delta in an epsilon-delta argument: it guarantees that 1/n eventually drops below any positive tolerance.'
    tags: []

  - id: foundations.number-systems.q-dense
    kind: theorem
    prominence: 1
    title: "ℚ is dense in ℝ"
    statement: >
      If $x < y$ are real then there is $q \in \mathbb{Q}$ with $x < q < y$.
      Proof: by the Archimedean property pick $n \in \mathbb{N}$ with
      $1/n < y - x$, so that $n (y - x) > 1$; the integers exceeding $n x$ are
      nonempty and bounded below, so there is a least such integer $m$, and
      minimality gives $m - 1 \le n x$, hence
      $n x < m \le n x + 1 < n y$. Dividing by $n$ gives $x < m/n < y$. The
      irrationals are dense as well: apply the result to
      $x - \sqrt{2} < y - \sqrt{2}$ and add $\sqrt{2}$ back to the rational
      produced. Consequences: every nonempty open interval contains a rational
      and an irrational, every real is the supremum of the rationals below it,
      and a continuous real function is determined by its values on
      $\mathbb{Q}$ — so $\mathbb{R}$, though vastly larger than $\mathbb{Q}$, is
      pinned down by it.
    summary: >
      Between any two distinct reals, however close, there is a rational — the
      reals are packed in among the rationals rather than sitting apart from
      them.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.archimedean
    relates: []
    tags: []

  - id: foundations.number-systems.ex-sqrt-two-in-r
    kind: example
    prominence: 0
    title: "√2 exists in ℝ"
    statement: >
      Let $A = \{x \in \mathbb{R} : x > 0 \text{ and } x^2 < 2\}$. It is
      nonempty and bounded above by $2$, so $s = \sup A$ exists by completeness,
      and $1 \le s \le 2$. If $s^2 < 2$, use the Archimedean property to pick
      $n$ with $1/n < (2 - s^2)/(2 s + 1)$; then
      $(s + 1/n)^2 = s^2 + 2 s/n + 1/n^2 \le s^2 + (2 s + 1)/n < 2$, so
      $s + 1/n \in A$ and $s$ was not an upper bound. If $s^2 > 2$, pick $n$
      with $1/n < (s^2 - 2)/(2 s)$; then $1/n < s/2$, so $s - 1/n > 0$, and
      $(s - 1/n)^2 > s^2 - 2 s/n > 2$, so every $x \in A$ has
      $x^2 < 2 < (s - 1/n)^2$ and hence $x < s - 1/n$ — a smaller upper bound of
      $A$. Hence $s^2 = 2$. The same argument, with $x^k$ in place of $x^2$,
      produces a $k$-th root of every positive real. This is precisely what the
      passage from $\mathbb{Q}$ to $\mathbb{R}$ bought, and it shows the
      characteristic shape of an existence proof in analysis: the number is not
      exhibited by a formula, it is produced as a supremum and then shown to
      have the property wanted.
    summary: >
      The same set that had no least upper bound in $\mathbb{Q}$ has one in
      $\mathbb{R}$, and its square is $2$ — completeness manufacturing a number
      no formula in rationals could name.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.archimedean
    relates: []
    tags: []

  - id: foundations.number-systems.def-complex
    kind: definition
    prominence: 2
    title: "ℂ as ordered pairs of reals"
    statement: >
      Let $\mathbb{C} = \mathbb{R} \times \mathbb{R}$ with
      $(a, b) + (c, d) = (a + c,\,b + d)$ and
      $(a, b) \cdot (c, d) = (a c - b d,\,a d + b c)$. These satisfy all the
      field axioms: $0 = (0, 0)$, $1 = (1, 0)$, $-(a, b) = (-a, -b)$, and for
      $(a, b) \ne (0, 0)$ the multiplicative inverse is
      $\left(\dfrac{a}{a^2 + b^2},\,\dfrac{-b}{a^2 + b^2}\right)$, which
      exists because $a^2 + b^2 > 0$ whenever $(a, b) \ne (0, 0)$ — a fact about
      $\mathbb{R}$, where squares are nonnegative, rather than about
      $\mathbb{C}$. The map $a \mapsto (a, 0)$ embeds $\mathbb{R}$, and writing
      $i = (0, 1)$ gives $i^2 = (-1, 0) = -1$ and $(a, b) = a + b i$, at which
      point the multiplication rule above is just expansion using
      $i^2 = -1$. The same field is obtained by taking real polynomials modulo
      the multiples of $x^2 + 1$, that is by adjoining a root of $x^2 + 1$ and
      reducing; the ordered-pair description is the one that requires no ring
      theory. The gain is roots: $x^2 + 1 = 0$ now has a solution, and in fact
      every nonconstant polynomial with complex coefficients does.
    summary: >
      Two real numbers glued into one, with a multiplication rule chosen so that
      one particular pair squares to $-1$ — enough to make every polynomial
      solvable.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.r-existence
    relates: []
    tags: []

  - id: foundations.number-systems.complex-no-order
    kind: proposition
    prominence: 1
    title: "ℂ admits no compatible order"
    statement: >
      There is no total order on $\mathbb{C}$ making it an ordered field. Proof:
      in any ordered field every square is nonnegative and $1 > 0$, so
      $-1 < 0$; but $i^2 = -1$ would force $-1 \ge 0$. Axioms (O1) and (O2) are
      therefore incompatible with the existence of a square root of $-1$, whichever
      order is proposed. $\mathbb{C}$ can of course be ordered as a bare set,
      and it carries the absolute value $|a + b i| = \sqrt{a^2 + b^2}$ with all
      the usual properties, so inequalities between magnitudes remain available.
      What is gone is any order compatible with the arithmetic, and with it
      every argument that compares two numbers rather than their sizes:
      monotonicity, suprema and infima, the intermediate value theorem. This is
      the price of solving every polynomial equation, and it makes the step from
      $\mathbb{R}$ to $\mathbb{C}$ different in kind from the three before it —
      those added structure, this one trades some away.
    summary: >
      Squares are nonnegative in any ordered field, and $i^2 = -1$; so gaining a
      square root of $-1$ costs the order outright, not merely some of its
      properties.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.def-complex
      - foundations.number-systems.ordered-field-consequences
    relates: []
    tags: []

  - id: foundations.number-systems.intuition-tower
    kind: intuition
    prominence: 0
    title: "Each extension repairs one defect, and charges for it"
    statement: >
      The chain
      $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}
      \subset \mathbb{C}$ is not a sequence of ever-larger bags of numbers but a
      sequence of repairs, each carried out by the cheapest construction that
      fixes one named failure, and each paid for. $\mathbb{N}$ cannot subtract;
      $\mathbb{Z}$ makes $x + a = b$ always solvable and loses well-ordering.
      $\mathbb{Z}$ cannot divide; $\mathbb{Q}$ makes $a x = b$ with $a \ne 0$
      always solvable and loses discreteness, so that no element has a next one.
      $\mathbb{Q}$ has gaps in its order; $\mathbb{R}$ makes every nonempty set
      that is bounded above have a supremum and loses countability, so that most of its
      elements can never be written down. $\mathbb{R}$ cannot solve
      $x^2 = -1$; $\mathbb{C}$ solves every polynomial equation and loses the
      order. Two patterns are worth carrying forward. Three of the four steps
      are quotients by an explicitly described equivalence relation — equal
      differences, equal ratios, agreement in the limit — which is the standard
      way to manufacture the object a theory needs rather than hope for it. And
      each new system is determined up to isomorphism by the defect it repairs,
      which is why "the" integers, "the" rationals and "the" reals are
      legitimate phrases.
    summary: >
      Read the tower as four repairs rather than four enlargements: each system
      is the cheapest way to make one specific equation solvable, and each
      repair costs a property the previous system had.
    parent: foundations.number-systems
    also_under: []
    requires:
      - foundations.number-systems.complex-no-order
      - foundations.number-systems.q-not-complete
      - foundations.cardinality.r-uncountable
    relates: []
    tags: []
