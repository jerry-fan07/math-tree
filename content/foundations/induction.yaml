# foundations.induction — Induction and Recursion
# The Peano package and well-ordering, the induction principle and the two
# obligations an induction proof discharges, its strong / shifted-base /
# structural variants, definition by recursion and the recursion theorem that
# legitimizes it, and the worked examples and the classic failure mode.

nodes:
  - id: foundations.induction
    kind: subbranch
    title: "Induction and Recursion"
    summary: >
      Well-ordering, ordinary and strong induction, and definition by
      recursion — the proof technique that the natural numbers uniquely
      license, and the definitions it justifies.
    parent: foundations
    also_under: []
    tags: []

  - id: foundations.induction.peano-axioms
    kind: axiom
    prominence: 2
    title: "Peano axioms for ℕ"
    statement: >
      The natural numbers are a set $\mathbb{N}$ together with a distinguished
      element $0 \in \mathbb{N}$ and a successor function
      $S : \mathbb{N} \to \mathbb{N}$ satisfying three axioms (the classical
      list has five; two of them are absorbed into saying that $0$ is an element
      of $\mathbb{N}$ and that $S$ maps $\mathbb{N}$ into itself): (P1) $0$ is
      not a successor, that is $S(n) \ne 0$ for every $n$; (P2) $S$ is
      injective, that is $S(m) = S(n) \Rightarrow m = n$; (P3) the induction
      axiom — if
      $A \subseteq \mathbb{N}$ contains $0$ and satisfies $S(n) \in A$ whenever
      $n \in A$, then $A = \mathbb{N}$. Addition, multiplication and
      exponentiation are then defined recursively, and the order by
      $m \le n$ iff $m + k = n$ for some $k \in \mathbb{N}$. Axiom (P3) is the
      one with content: (P1) and (P2) alone permit stray elements sitting
      outside the chain $0, S(0), S(S(0)), \ldots$, and (P3) is exactly the
      assertion that there are none. Whether the count starts at $0$ or at $1$
      is a convention, not a mathematical difference.
    summary: >
      The axioms that pin down the counting numbers: there is a first one, each
      has its own distinct next one, and nothing else is in there — the last
      clause being the one that licenses induction.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.functions.def-injective
    relates: []
    tags: []

  - id: foundations.induction.well-ordering
    kind: theorem
    prominence: 1
    title: "Well-ordering principle for ℕ"
    statement: >
      Every nonempty subset $A \subseteq \mathbb{N}$ has a least element: there
      is $a \in A$ with $a \le x$ for every $x \in A$, and this $a$ is unique.
      Proof from the induction axiom, contrapositively: suppose $A$ has no least
      element and let $B$ be the set of those $n \in \mathbb{N}$ such that no
      $m \le n$ belongs to $A$. Then $0 \in B$, since otherwise $0$ would be a
      least element of $A$; and if $n \in B$ then $S(n) \in B$, since otherwise
      $S(n)$ would belong to $A$ and, no smaller number being in $A$, would be
      its least element. By (P3), $B = \mathbb{N}$, so $A = \emptyset$.
      Well-ordering is a genuine property of $\mathbb{N}$ and not of ordered
      sets in general: it fails for $\mathbb{Z}$, and it fails for the positive
      rationals, which are nonempty with no least member.
    summary: >
      Any nonempty collection of naturals, however it is described, has a
      smallest member — the fact that makes "take the smallest counterexample" a
      legal move.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.peano-axioms
      - foundations.relations.def-maximal-greatest
    relates: []
    tags: []

  - id: foundations.induction.induction-principle
    kind: theorem
    prominence: 2
    title: "Principle of mathematical induction"
    statement: >
      Let $P(n)$ be a statement about natural numbers. If (base case) $P(0)$
      holds, and (inductive step) $P(n) \Rightarrow P(n+1)$ for every
      $n \in \mathbb{N}$, then $P(n)$ holds for every $n \in \mathbb{N}$. Proof
      from well-ordering: were the set $C$ of $n$ for which $P(n)$ fails
      nonempty, it would have a least element $c$; the base case gives
      $c \ne 0$, so $c = m + 1$ for some $m$ — every nonzero natural being a
      successor, itself a consequence of (P3) — and $m < c$ forces $P(m)$ to
      hold, whereupon the inductive step gives $P(m+1)$, that is $P(c)$ —
      contradicting $c \in C$. Conversely, applying this scheme to the statement
      $P(n) : n \in A$ recovers the induction axiom (P3), so the induction
      axiom, well-ordering and this scheme are interderivable over (P1), (P2)
      and that successor fact, and which one is taken as primitive is a matter
      of presentation. What (P3) asserts about subsets of $\mathbb{N}$, this
      asserts as a licence about predicates: to prove something of every natural
      number it suffices to discharge two obligations, each concerning a single
      unspecified $n$.
    summary: >
      To prove a statement for every natural number it is enough to prove it for
      the first one and to prove that it propagates from each number to the
      next.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.well-ordering
    relates: []
    tags: []

  - id: foundations.induction.base-and-step
    kind: technique
    prominence: 1
    title: "The base case and the inductive step as obligations"
    statement: >
      An induction proof discharges exactly two obligations and nothing else.
      (i) Base case: prove $P(n_0)$ outright at the starting value. (ii)
      Inductive step: fix an arbitrary $n \ge n_0$, assume $P(n)$ — the
      inductive hypothesis — and derive $P(n+1)$. The step is a conditional, so
      assuming $P(n)$ is not assuming what is to be proved: what is to be proved
      is $\forall n\, P(n)$, while the hypothesis concerns one unspecified $n$.
      Both obligations are load-bearing. The step alone proves nothing — the
      statement $P(n) : n = n + 1$ has a perfectly valid inductive step and no
      true instance — and the base alone proves one case. And the step must hold
      at every $n \ge n_0$ without exception: one value of $n$ at which it fails
      severs the chain there, so an argument whose step silently needs
      $n \ge 2$ has proved nothing beyond $P(n_0)$ until the missing instance is
      established separately.
    summary: >
      Two things and only two: it is true at the start, and each case forces the
      next. Assuming the case you are inducting on is not circular — the
      assumption is about one number, the conclusion about all of them.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.induction-principle
      - foundations.proof.universal-proof
    relates: []
    tags: []

  - id: foundations.induction.intuition-chain
    kind: intuition
    prominence: 0
    title: "Induction as an infinite family of finite proofs"
    statement: >
      The standard picture is a line of dominoes: the base case topples the
      first, the inductive step guarantees that each falling domino topples its
      neighbour, and so every domino falls. What makes the picture more than an
      image is this: induction never reasons about infinity. It produces, for
      each individual $n$, a finite proof of $P(n)$ — the base case followed by
      $n$ copies of the step — and the theorem $\forall n\, P(n)$ is precisely
      the assertion that such a finite chain exists for every $n$, which is what
      the induction axiom guarantees by saying that no natural number lies
      outside the chain of successors. Two consequences: an induction says
      nothing whatever about a limiting case at infinity, and the whole
      difficulty of an induction proof lives in the step, since that is where a
      single argument must be found that works at every rung at once.
    summary: >
      Falling dominoes — but the real content is that every single case has its
      own finite proof, obtained by running the step that many times from the
      base.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.induction-principle
    relates: []
    tags: []

  - id: foundations.induction.minimal-counterexample
    kind: technique
    prominence: 1
    title: "Minimal counterexample"
    statement: >
      To prove $P(n)$ for all $n \ge n_0$, suppose the set of counterexamples is
      nonempty; by well-ordering it has a least element $c$. Show first that $c$
      cannot be the base value, then derive a contradiction with minimality —
      typically by producing from $c$ a strictly smaller counterexample. The
      method is logically interchangeable with induction, the least
      counterexample being the first place the inductive step would have to
      fail, but it is the more convenient packaging whenever the smaller
      instance one can produce is not $c - 1$ but something obtained by a
      construction: "every integer $n \ge 2$ has a prime divisor", or the
      infinite-descent proof that $\sqrt{2}$ is irrational, where a
      representation $\sqrt{2} = p/q$ with $q$ least yields a representation
      with a smaller denominator.
    summary: >
      Assume the theorem fails somewhere, take the first place it fails, and
      show that the failure would have had to happen earlier. Induction turned
      inside out.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.well-ordering
      - foundations.proof.contradiction
    relates: []
    tags: []

  - id: foundations.induction.shifted-base
    kind: proposition
    prominence: 1
    title: "Induction from an arbitrary base"
    statement: >
      Let $m$ be an integer and let $P$ be a statement about integers $\ge m$.
      If $P(m)$ holds and $P(n) \Rightarrow P(n+1)$ for every integer
      $n \ge m$, then $P(n)$ holds for every integer $n \ge m$. Proof: apply
      ordinary induction to the statement $Q(k) : P(m + k)$ for
      $k \in \mathbb{N}$. This is what licenses the many statements that only
      become true beyond a threshold — $2^n > n^2$ for $n \ge 5$ (it fails at
      $n = 4$, where both sides are $16$), $n! > 2^n$ for $n \ge 4$ — and in
      each the base case must be checked at the stated starting value and
      nowhere earlier. A variant worth knowing is Cauchy's backward induction:
      prove $P$ on an infinite set of indices, such as the powers of $2$, and
      separately prove $P(n+1) \Rightarrow P(n)$; this is the classical route to
      the arithmetic-mean–geometric-mean inequality.
    summary: >
      Nothing forces the ladder to start at zero; re-indexing proves statements
      that only become true past some threshold, with the base case checked
      exactly there.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.induction-principle
    relates: []
    tags: []

  - id: foundations.induction.strong-induction
    kind: theorem
    prominence: 1
    title: "Strong (complete) induction"
    statement: >
      Let $P(n)$ be a statement about natural numbers. If for every
      $n \in \mathbb{N}$ the assumption that $P(k)$ holds for every $k < n$
      yields $P(n)$, then $P(n)$ holds for every $n \in \mathbb{N}$. The
      inductive hypothesis is now the entire history below $n$ rather than the
      single preceding case. No separate base case is required — or rather it is
      absorbed: at $n = 0$ the hypothesis "$P(k)$ for all $k < 0$" is vacuously
      true, so the single implication already forces $P(0)$, and an argument
      that quietly helps itself to a predecessor has simply failed to establish
      the $n = 0$ instance it was obliged to establish.
    summary: >
      The same principle with a larger hypothesis: to prove a case you may use
      every earlier case at once, which is what arguments reaching back more
      than one step need.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.induction-principle
    relates: []
    tags: []

  - id: foundations.induction.strong-equiv-ordinary
    kind: proposition
    prominence: 0
    title: "Strong induction is equivalent to ordinary induction"
    statement: >
      The two principles prove exactly the same theorems. Ordinary from strong
      is immediate: an ordinary induction is a strong one that happens to use
      only the case $k = n - 1$. Strong from ordinary: suppose $P$ satisfies the
      strong hypothesis, and let $Q(n)$ be the statement "$P(k)$ holds for every
      $k \le n$". Then $Q(0)$ holds, because it is $P(0)$ and the strong
      hypothesis forces $P(0)$ vacuously; and $Q(n) \Rightarrow Q(n+1)$, because
      $Q(n)$ supplies $P(k)$ for every $k < n+1$, from which the strong
      hypothesis yields $P(n+1)$. Ordinary induction now gives $Q(n)$ for all
      $n$, hence $P(n)$ for all $n$. So strong induction is a convenience rather
      than extra strength; what changes is the bookkeeping of which earlier
      cases an argument is allowed to name.
    summary: >
      Strong induction proves nothing ordinary induction cannot: bundle "all
      cases up to $n$" into a single predicate and the two principles coincide.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.strong-induction
    relates: []
    tags: []

  - id: foundations.induction.def-recursion
    kind: definition
    prominence: 1
    title: "Definition by recursion"
    statement: >
      A definition by recursion specifies a function $f : \mathbb{N} \to X$ not
      by a formula but by two clauses: an initial value $f(0) = a$ for a given
      $a \in X$, and a recurrence $f(n+1) = g(n, f(n))$ for a given
      $g : \mathbb{N} \times X \to X$. Together the clauses determine the value
      at every argument by successive computation. This is how arithmetic itself
      is set up on top of the successor function: $m + 0 = m$ and
      $m + S(n) = S(m + n)$; $m \cdot 0 = 0$ and $m \cdot S(n) = m \cdot n + m$;
      $m^0 = 1$ and $m^{n+1} = m^n \cdot m$. A recursive definition is not a
      proof by induction, but the two are mirror images: the recursion builds an
      object one step at a time where the induction verifies a property one step
      at a time, and each is justified by the same axiom.
    summary: >
      Specifying a function by saying what it does at zero and how each value is
      computed from the previous one, instead of by a closed formula.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.peano-axioms
    relates: []
    tags: []

  - id: foundations.induction.recursion-theorem
    kind: theorem
    prominence: 2
    title: "Recursion theorem"
    statement: >
      Let $X$ be a set, $a \in X$, and $g : \mathbb{N} \times X \to X$. Then
      there is exactly one function $f : \mathbb{N} \to X$ with $f(0) = a$ and
      $f(n+1) = g(n, f(n))$ for every $n \in \mathbb{N}$. Uniqueness is an
      induction: if $f_1$ and $f_2$ both satisfy the clauses then
      $f_1(0) = a = f_2(0)$, and $f_1(n) = f_2(n)$ gives
      $f_1(n+1) = g(n, f_1(n)) = g(n, f_2(n)) = f_2(n+1)$. Existence is the
      substantive half: prove by induction that for each $n$ there is a unique
      function on $\{0, 1, \ldots, n\}$ obeying the clauses as far as they
      apply, observe that any two such partial functions agree wherever both are
      defined, and take $f$ to be their union. The theorem is what makes
      recursive definition legitimate rather than merely suggestive — without
      it, "define $f$ by these two clauses" is a list of infinitely many demands
      with no guarantee that a single object meets them all, and no guarantee
      that only one does.
    summary: >
      Recursive definitions really do define something: the two clauses are
      satisfied by one function and by no more than one. This is the licence
      every recursive definition tacitly invokes.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.def-recursion
      - foundations.induction.induction-principle
    relates: []
    tags: []

  - id: foundations.induction.course-of-values-recursion
    kind: proposition
    prominence: 0
    title: "Course-of-values recursion"
    statement: >
      Recursions in which $f(n)$ depends on several or on all of the earlier
      values, $f(n) = h(n, (f(0), \ldots, f(n-1)))$, are legitimate as well.
      They reduce to the recursion theorem by recursing on the history rather
      than on the value: let $F(n)$ denote the finite sequence
      $(f(0), \ldots, f(n-1))$, which does obey a one-step recurrence — $F(0)$
      is the empty sequence and $F(n+1)$ is $F(n)$ with $h(n, F(n))$ appended —
      apply the recursion theorem to $F$ with $X$ the set of finite sequences,
      and then set $f(n) = h(n, F(n))$. This is the recursion counterpart of
      strong induction, and it is exactly what a recurrence reaching back more
      than one step, such as the Fibonacci rule, requires.
    summary: >
      Definitions that look back more than one step are still legitimate:
      recurse on the list of all previous values, which does advance one step at
      a time.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.recursion-theorem
    relates: []
    tags: []

  - id: foundations.induction.def-finite-sum
    kind: definition
    prominence: 0
    title: "Finite sums and products, defined recursively"
    statement: >
      For a sequence $a_1, a_2, \ldots$ in a set carrying an associative
      addition with a zero, the finite sum $\sum_{i=1}^{n} a_i$ is defined by
      recursion on $n$: the empty sum $\sum_{i=1}^{0} a_i$ is $0$, and
      $\sum_{i=1}^{n+1} a_i = \left(\sum_{i=1}^{n} a_i\right) + a_{n+1}$.
      Products $\prod_{i=1}^{n} a_i$ are defined identically with empty product
      $1$, and the factorial is the special case $n! = \prod_{i=1}^{n} i$, so
      that $0! = 1$ by definition and not by decree. The ellipsis in
      $a_1 + \cdots + a_n$ is shorthand for this recursion, and the recurrence
      clause is precisely what an induction proof about a sum invokes in its
      step — which is why every such proof begins by peeling off the last term.
    summary: >
      Sigma notation is not primitive: it is a recursive definition, and its
      recurrence clause is the move every induction proof about a sum makes.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.recursion-theorem
    relates: []
    tags: []

  - id: foundations.induction.ex-fibonacci
    kind: example
    prominence: 0
    title: "The Fibonacci sequence"
    statement: >
      The Fibonacci sequence is defined by $F_0 = 0$, $F_1 = 1$ and
      $F_{n+2} = F_{n+1} + F_n$. Two initial values and a two-step recurrence do
      not fit the one-step template of the recursion theorem directly; they are
      legitimized either by course-of-values recursion or, more cheaply, by
      recursing on pairs — apply the recursion theorem with
      $X = \mathbb{N} \times \mathbb{N}$, $a = (0,1)$ and
      $g(n, (x,y)) = (y, x + y)$, and read $F_n$ off as the first coordinate.
      Identities about the sequence are then proved by induction:
      $\sum_{i=0}^{n} F_i = F_{n+2} - 1$, whose step is
      $\sum_{i=0}^{n+1} F_i = (F_{n+2} - 1) + F_{n+1} = F_{n+3} - 1$; and
      Cassini's identity $F_{n+1}F_{n-1} - F_n^2 = (-1)^n$ for $n \ge 1$, whose
      step is a two-line manipulation but which no direct computation makes
      obvious.
    summary: >
      The standard place where recursion and induction meet: a sequence whose
      definition reaches back two steps, and identities about it that only
      induction establishes.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.course-of-values-recursion
      - foundations.induction.def-finite-sum
      - foundations.induction.base-and-step
    relates: []
    tags: []

  - id: foundations.induction.def-inductive-set
    kind: definition
    prominence: 1
    title: "Inductively defined set"
    statement: >
      A set $S$ is defined inductively by a set $B$ of base elements together
      with a collection of constructors — operations of finite arity — when $S$
      is the smallest set that contains $B$ and is closed under the
      constructors. Equivalently $S = \bigcup_{n \ge 0} S_n$, where $S_0 = B$
      and $S_{n+1}$ is $S_n$ together with everything a constructor produces
      from arguments in $S_n$; the two descriptions agree because that union is
      itself closed under the constructors and is contained in every closed set
      containing $B$. The minimality clause carries the whole content of the
      definition: it says that nothing is in $S$ except what the base and the
      constructors put there. Standard instances: $\mathbb{N}$ itself, with base
      $0$ and constructor $S$; finite lists over an alphabet, with base the
      empty list and constructor "prepend a letter"; the well-formed formulas of
      propositional logic, with base the propositional variables and
      constructors $\neg$ and the binary connectives; finite binary trees.
    summary: >
      A set built from designated starting elements by designated building
      operations, and containing nothing else — the "nothing else" is what makes
      proof by induction over it possible.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.def-recursion
      - foundations.sets.indexed-union
    relates: []
    tags: []

  - id: foundations.induction.structural-induction
    kind: theorem
    prominence: 1
    title: "Structural induction"
    statement: >
      Let $S$ be inductively defined by a base $B$ and a collection of
      constructors, and let $P$ be a property. If $P$ holds of every element of
      $B$, and every constructor carries arguments satisfying $P$ to a result
      satisfying $P$, then $P$ holds of every element of $S$. Proof: every
      $x \in S$ lies in some stage $S_n$, so define the rank of $x$ to be the
      least such $n$ and apply strong induction to the statement "every element
      of rank $n$ satisfies $P$". An element of rank $0$ is a base element, and
      an element of rank $n > 0$ is a constructor applied to arguments lying in
      $S_{n-1}$, hence of strictly smaller rank, hence satisfying $P$ by the
      inductive hypothesis; the closure assumption then gives $P(x)$. In
      practice this is how one proves a fact about all formulas, all lists, all
      terms or all trees at once: one obligation per base element and one per
      constructor, with no numerical index in sight.
    summary: >
      Induction over a set built by construction rules rather than over the
      numbers: prove the property of the starting pieces, then show every
      building rule preserves it.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.def-inductive-set
      - foundations.induction.strong-induction
    relates: []
    tags: []

  - id: foundations.induction.structural-recursion
    kind: definition
    prominence: 0
    title: "Definition by structural recursion"
    statement: >
      A function out of an inductively defined set $S$ is specified by giving a
      value at each base element and, for each constructor, a rule computing the
      value at a constructed element from the values at its arguments — the
      length of a list, the height or the node count of a binary tree, the set
      of variables occurring in a formula, the truth value of a formula under an
      assignment. Such a specification determines at most one function, by
      structural induction, and determines at least one — built stage by stage
      with the recursion theorem — provided the inductive definition is
      unambiguous: every element of $S$ is a base element or a constructor
      applied to particular arguments, in exactly one way, and never both.
      Ambiguity is a real failure mode rather than a technicality: arithmetic
      expressions written without parentheses admit two readings of $1 - 2 - 3$,
      and "the value of an expression" is then not well defined at all.
    summary: >
      Defining a function by cases on how each element was built. It works
      exactly when every element is built in exactly one way; otherwise the
      "definition" is not one.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.structural-induction
      - foundations.induction.recursion-theorem
    relates: []
    tags: []

  - id: foundations.induction.ex-sum-of-squares
    kind: example
    prominence: 1
    title: "Sum of the first n squares"
    statement: >
      For every $n \in \mathbb{N}$,
      $\sum_{i=1}^{n} i^2 = \dfrac{n(n+1)(2n+1)}{6}$. Base case $n = 0$: the
      empty sum is $0$ and so is the right-hand side. Inductive step: assuming
      the formula at $n$,
      $\sum_{i=1}^{n+1} i^2 = \dfrac{n(n+1)(2n+1)}{6} + (n+1)^2
      = \dfrac{(n+1)\left(n(2n+1) + 6(n+1)\right)}{6}
      = \dfrac{(n+1)(2n^2 + 7n + 6)}{6}
      = \dfrac{(n+1)(n+2)(2n+3)}{6}$,
      which is the formula at $n+1$. The companion
      $\sum_{i=1}^{n} i = \dfrac{n(n+1)}{2}$ goes the same way. Note what
      induction does and does not do here: it verifies a closed form that has to
      be obtained some other way — by guessing from small cases, by telescoping
      $(i+1)^3 - i^3$, by interpolation — and gives no hint at all where the
      formula came from.
    summary: >
      The archetypal induction: a closed form for a sum, verified by peeling off
      the last term. Induction confirms the formula; it never discovers it.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.base-and-step
      - foundations.induction.def-finite-sum
    relates:
      - id: analysis.svc.ex-integral-x2
        note: 'Computing $\int_0^1 x^2\,dx$ from Riemann sums evaluates its upper and lower sums with exactly this closed form.'
    tags: []

  - id: foundations.induction.ex-divisibility
    kind: example
    prominence: 0
    title: "6 divides n³ − n"
    statement: >
      For every $n \in \mathbb{N}$, $6 \mid n^3 - n$. Base case $n = 0$:
      $6 \mid 0$. Inductive step:
      $(n+1)^3 - (n+1) = n^3 + 3n^2 + 3n + 1 - n - 1 = (n^3 - n) + 3n(n+1)$.
      The first bracket is divisible by $6$ by the inductive hypothesis, and
      $n(n+1)$ is a product of consecutive integers and so is even, whence
      $3n(n+1)$ is divisible by $6$ too. The same pattern runs the whole family
      of divisibility inductions — $8 \mid 3^{2n} - 1$,
      $9 \mid 4^n + 6n - 1$, $x - y \mid x^n - y^n$ — where the step always
      consists of rewriting the $n+1$ instance as the $n$ instance plus
      something visibly divisible by the modulus.
    summary: >
      A divisibility statement with no closed-form route: the inductive step
      works by exhibiting the difference between consecutive instances as a
      multiple of the divisor.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.base-and-step
    relates: []
    tags: []

  - id: foundations.induction.bernoulli
    kind: proposition
    prominence: 1
    title: "Bernoulli's inequality"
    statement: >
      For every real $x \ge -1$ and every $n \in \mathbb{N}$,
      $(1+x)^n \ge 1 + nx$. Proof by induction on $n$: at $n = 0$ both sides
      equal $1$. For the step, the hypothesis $x \ge -1$ says exactly that
      $1 + x \ge 0$, so multiplying the inductive hypothesis through by $1+x$
      preserves the inequality:
      $(1+x)^{n+1} \ge (1 + nx)(1 + x) = 1 + (n+1)x + nx^2 \ge 1 + (n+1)x$. The
      hypothesis $x \ge -1$ cannot be dropped: at $x = -4$ and $n = 3$ the left
      side is $-27$ and the right side is $-11$. The inequality is strict for
      $x \ne 0$ once $n \ge 2$.
    summary: >
      A crude but remarkably useful lower bound for powers, and the standard
      first example of an inequality proved by induction — the step is one
      multiplication, and the sign hypothesis is exactly what licenses it.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.base-and-step
    relates: []
    tags: []

  - id: foundations.induction.ex-prime-factorization
    kind: example
    prominence: 1
    title: "Every integer n ≥ 2 is a product of primes"
    statement: >
      Every integer $n \ge 2$ is a product of one or more primes. Proof by
      strong induction: let $n \ge 2$ and assume every integer $k$ with
      $2 \le k < n$ is a product of primes. If $n$ is prime it is already a
      one-factor product. Otherwise $n = ab$ with $2 \le a < n$ and
      $2 \le b < n$; both $a$ and $b$ are products of primes by the inductive
      hypothesis, and concatenating those two factorizations exhibits $n$ as
      one. This is the standard illustration of why strong induction is needed:
      the factors $a$ and $b$ sit somewhere below $n$, but nothing makes either
      of them $n - 1$, so an ordinary induction has nothing to grip on. Only
      existence is proved here — uniqueness of the factorization is a separate
      and distinctly harder statement.
    summary: >
      The canonical strong induction: a composite splits into two smaller
      factors that need not be adjacent to it, so the hypothesis has to cover
      every smaller case at once.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.strong-induction
    relates: []
    tags: []

  - id: foundations.induction.ex-horses
    kind: example
    prominence: 1
    title: "All horses are the same colour"
    statement: >
      The classic bogus induction claims that in every set of $n \ge 1$ horses,
      all the horses have the same colour. The base case $n = 1$ is true. The
      alleged step: given a set of $n+1$ horses, remove the last to obtain a set
      of $n$, monochromatic by hypothesis, and remove the first to obtain
      another set of $n$, also monochromatic; the two sets overlap, so all
      $n+1$ horses share the colour of a horse in the overlap. The error is a
      single instance of the step: the two $n$-element subsets overlap only when
      $n \ge 2$, so the argument fails exactly at $n + 1 = 2$, where the two
      subsets are the disjoint singletons $\{h_1\}$ and $\{h_2\}$. Everything
      else is correct, and the chain of implications is broken only at its first
      link — which is enough to break it entirely. The lesson: the inductive
      step is an obligation at every $n$ from the base onwards, and a step that
      quietly assumes the configuration is large enough has proved nothing.
    summary: >
      The famous false induction: every link of the chain holds except the very
      first, which is exactly why the step has to be checked at the smallest
      case and not merely in general.
    parent: foundations.induction
    also_under: []
    requires:
      - foundations.induction.base-and-step
    relates: []
    tags: []
