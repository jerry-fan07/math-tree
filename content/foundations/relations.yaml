# foundations.relations — Relations and Orders
# Binary relations and their algebra (inverse, composition, the four properties);
# equivalence relations, the partition theorem, quotients and well-definedness,
# with the integers mod n as the worked example; partial and total orders, Hasse
# diagrams, extremal elements and bounds, well-orders, chains and Zorn's lemma.

nodes:
  - id: foundations.relations
    kind: subbranch
    title: "Relations and Orders"
    summary: >
      Binary relations, equivalence relations and the partitions they induce,
      and the partial and total orders that carry the notion of "before".
    parent: foundations
    also_under: []
    tags: []

  - id: foundations.relations.def-binary-relation
    kind: definition
    prominence: 1
    title: "Binary relation"
    statement: >
      A binary relation from a set $A$ to a set $B$ is a subset
      $R \subseteq A \times B$ of the Cartesian product — that is, a set of
      ordered pairs $(a,b)$ with $a \in A$ and $b \in B$. One writes $aRb$ as
      shorthand for $(a,b) \in R$. When $B = A$ one says $R$ is a relation on
      $A$. Nothing further is assumed: any set of pairs whatsoever is a
      relation, so the definition covers $\le$ on $\mathbb{R}$ (the set of pairs
      $(x,y)$ with $x \le y$), divisibility on $\mathbb{Z}$, $\subseteq$ on the
      subsets of a fixed set, and "has the same birthday as" on a set of people.
      Two distinguished relations on $A$ are the empty relation $\emptyset$ and
      the identity, or diagonal, relation
      $\Delta_A = \{(a,a) : a \in A\}$.
    summary: >
      A relation is nothing but a set of ordered pairs — the pairs that stand in
      it. Discarding any intuitive meaning is exactly what makes the notion
      general enough to cover order, equality and equivalence at once.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.sets.cartesian-product
    relates: []
    tags: []

  - id: foundations.relations.def-domain-range
    kind: definition
    prominence: 0
    title: "Domain and range of a relation"
    statement: >
      Let $R \subseteq A \times B$. The domain of $R$ is
      $\operatorname{dom} R = \{a \in A : (a,b) \in R \text{ for some } b \in B\}$
      and the range, or image, is
      $\operatorname{ran} R = \{b \in B : (a,b) \in R \text{ for some } a \in A\}$.
      These are subsets of $A$ and of $B$ and may both be proper. In particular
      the domain need not be all of $A$, which is precisely what separates a
      relation from $A$ to $B$ from a function on $A$: a relation may leave an
      element of $A$ unrelated to anything, and may relate it to many things.
      More generally the image of a subset $S \subseteq A$ is
      $R[S] = \{b \in B : (a,b) \in R \text{ for some } a \in S\}$, so that
      $\operatorname{ran} R = R[A]$.
    summary: >
      The first coordinates actually used and the second coordinates actually
      hit. Unlike a function, a relation need not use every element of the set
      it starts from, nor pick out just one partner.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-binary-relation
    relates: []
    tags: []

  - id: foundations.relations.def-inverse-relation
    kind: definition
    prominence: 0
    title: "Inverse relation"
    statement: >
      The inverse, or converse, of $R \subseteq A \times B$ is the relation
      $R^{-1} \subseteq B \times A$ given by
      $R^{-1} = \{(b,a) : (a,b) \in R\}$; equivalently $bR^{-1}a$ holds if and
      only if $aRb$ does. Always $(R^{-1})^{-1} = R$,
      $\operatorname{dom} R^{-1} = \operatorname{ran} R$ and
      $\operatorname{ran} R^{-1} = \operatorname{dom} R$. Unlike the inverse of
      a function, the inverse of a relation always exists and costs nothing — no
      injectivity or surjectivity is required. The inverse of $\le$ on
      $\mathbb{R}$ is $\ge$, and the inverse of "is a parent of" is "is a child
      of".
    summary: >
      Turn every pair around. This costs nothing, and it is the operation that
      lets symmetry and antisymmetry be stated as relations between $R$ and
      $R^{-1}$ rather than as conditions on pairs.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-domain-range
    relates: []
    tags: []

  - id: foundations.relations.def-composition
    kind: definition
    prominence: 1
    title: "Composition of relations"
    statement: >
      Let $R \subseteq A \times B$ and $S \subseteq B \times C$. Their composite
      is
      $S \circ R = \{(a,c) \in A \times C : (a,b) \in R \text{ and } (b,c) \in S
      \text{ for some } b \in B\}$
      — take an $R$-step and then an $S$-step. The right-to-left order matches
      the convention for functions, and composing the graphs of two functions
      does give the graph of their composite. Composition is associative,
      $T \circ (S \circ R) = (T \circ S) \circ R$, and the identity relations
      are neutral: $R \circ \Delta_A = R = \Delta_B \circ R$. It is not
      commutative. Writing $R^n$ for the $n$-fold composite of a relation on
      $A$ with itself, $aR^n b$ says that $b$ is reachable from $a$ in exactly
      $n$ $R$-steps.
    summary: >
      Chain two relations by passing through an intermediate element. This is
      the operation that turns transitivity from a statement about triples into
      an inclusion between relations.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-binary-relation
    relates: []
    tags: []

  - id: foundations.relations.def-reflexive
    kind: definition
    prominence: 0
    title: "Reflexive and irreflexive"
    statement: >
      A relation $R$ on a set $A$ is reflexive if $aRa$ for every $a \in A$;
      equivalently $\Delta_A \subseteq R$. It is irreflexive if $aRa$ holds for
      no $a \in A$, that is, $R \cap \Delta_A = \emptyset$. These are not
      negations of one another — a relation can be neither, as
      $\{(1,1)\}$ on $\{1,2\}$ shows. Reflexivity is also the one property of
      the four that depends on the ambient set and not on the pairs alone: the
      same $\{(1,1)\}$ is reflexive as a relation on $\{1\}$ and not reflexive
      as a relation on $\{1,2\}$. Standard cases: $\le$ and $\subseteq$ are
      reflexive, $<$ and $\subsetneq$ are irreflexive.
    summary: >
      Every element is related to itself. Whether this holds depends on which
      ambient set you regard the relation as living on, which is why the set is
      always named alongside the relation.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-binary-relation
      - foundations.sets.def-intersection
    relates: []
    tags: []

  - id: foundations.relations.def-symmetric
    kind: definition
    prominence: 0
    title: "Symmetric"
    statement: >
      A relation $R$ on $A$ is symmetric if $aRb$ implies $bRa$ for all
      $a, b \in A$; equivalently $R \subseteq R^{-1}$, and since taking inverses
      preserves inclusions and undoes itself, that one inclusion already forces
      $R^{-1} \subseteq R$, so equivalently $R = R^{-1}$. Symmetry says the
      relation carries no direction, so it can be drawn with undirected edges.
      Equality, "has the same birthday as" and congruence modulo $n$ are
      symmetric; $\le$ on $\mathbb{R}$, $\subseteq$ on subsets and "is a parent
      of" are not.
    summary: >
      The relation reads the same in both directions — precisely the condition
      that it coincides with its own inverse.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-inverse-relation
    relates: []
    tags: []

  - id: foundations.relations.def-antisymmetric
    kind: definition
    prominence: 0
    title: "Antisymmetric"
    statement: >
      A relation $R$ on $A$ is antisymmetric if $aRb$ and $bRa$ together imply
      $a = b$, for all $a, b \in A$; equivalently
      $R \cap R^{-1} \subseteq \Delta_A$. Antisymmetry is not the negation of
      symmetry: the identity relation $\Delta_A$ is both symmetric and
      antisymmetric, and a relation may be neither. What it forbids is a genuine
      two-way tie between distinct elements, which is what stops an order from
      having cycles. Both $\le$ on $\mathbb{R}$ and $\subseteq$ on subsets are
      antisymmetric; divisibility is antisymmetric on $\mathbb{N}$ but not on
      $\mathbb{Z}$, where $2 \mid -2$ and $-2 \mid 2$ while $2 \ne -2$.
    summary: >
      Two distinct elements are never related both ways round. This is the
      condition that turns a reachability relation into a genuine ranking.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-inverse-relation
      - foundations.sets.def-intersection
    relates: []
    tags: []

  - id: foundations.relations.def-transitive
    kind: definition
    prominence: 0
    title: "Transitive"
    statement: >
      A relation $R$ on $A$ is transitive if $aRb$ and $bRc$ imply $aRc$, for
      all $a, b, c \in A$; equivalently $R \circ R \subseteq R$, and hence
      $R^n \subseteq R$ for every $n \ge 1$. Transitivity is exactly what makes
      a chain of steps collapse to a single step. The relations $\le$, $<$,
      $\subseteq$, divisibility and "is an ancestor of" are transitive; "is a
      parent of" is not, and neither is "differs by less than $1$" on
      $\mathbb{R}$ — the latter shows that a reflexive symmetric relation can
      still fail to be transitive.
    summary: >
      Steps compose: anything reachable in two steps is already reachable in
      one. Equivalently, the relation absorbs its own composite.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-composition
    relates: []
    tags: []

  - id: foundations.relations.def-equivalence-relation
    kind: definition
    prominence: 2
    title: "Equivalence relation"
    statement: >
      A relation $\sim$ on a set $A$ is an equivalence relation if it is
      reflexive ($a \sim a$ for every $a \in A$), symmetric ($a \sim b$ implies
      $b \sim a$) and transitive ($a \sim b$ and $b \sim c$ imply $a \sim c$).
      Standard examples: equality on any set; congruence modulo $n$ on
      $\mathbb{Z}$; "has the same image under $f$" for any function $f$;
      similarity of triangles; having the same cardinality. All three axioms are
      independent — $\le$ on $\mathbb{R}$ is reflexive and transitive but not
      symmetric; "differs by less than $1$" on $\mathbb{R}$ is reflexive and
      symmetric but not transitive; and the empty relation on a nonempty set is
      symmetric and transitive but not reflexive.
    summary: >
      The abstraction of "the same for present purposes": a relation that
      behaves like equality in the only three ways that matter, and therefore
      lets related elements be treated as interchangeable.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-reflexive
      - foundations.relations.def-symmetric
      - foundations.relations.def-transitive
    relates: []
    tags: []

  - id: foundations.relations.def-equivalence-class
    kind: definition
    prominence: 1
    title: "Equivalence class"
    statement: >
      Let $\sim$ be an equivalence relation on a set $A$ and let $a \in A$. The
      equivalence class of $a$ is the subset
      $[a] = \{x \in A : x \sim a\} \subseteq A$. By reflexivity $a \in [a]$, so
      every class is nonempty and every element of $A$ lies in a class. Any
      element $b \in [a]$ is called a representative of the class, and by
      symmetry and transitivity it determines the same class; when several
      relations are in play one writes $[a]_\sim$ to say which is meant.
    summary: >
      The set of everything the relation refuses to distinguish from a given
      element. A class is a bundle of mutually interchangeable elements, and any
      one of them names it.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-equivalence-relation
    relates: []
    tags: []

  - id: foundations.relations.class-eq-lemma
    kind: lemma
    prominence: 0
    title: "Classes coincide or are disjoint"
    statement: >
      Let $\sim$ be an equivalence relation on $A$ and let $a, b \in A$. The
      following are equivalent: (i) $a \sim b$; (ii) $[a] = [b]$; (iii)
      $[a] \cap [b] \ne \emptyset$. Proof: assume (i); if $x \in [a]$ then
      $x \sim a$ and $a \sim b$, so $x \sim b$ by transitivity and
      $x \in [b]$, and the reverse inclusion follows from $b \sim a$ by
      symmetry, giving (ii). (ii) gives (iii) because $a \in [a]$ makes the
      common class nonempty. Assume (iii) and pick $x \in [a] \cap [b]$; then
      $x \sim a$ and $x \sim b$, so $a \sim x \sim b$ by symmetry and
      transitivity, giving (i). Contrapositive of the equivalence of (ii) and
      (iii): two equivalence classes are either identical or disjoint, and can
      never partially overlap.
    summary: >
      Two classes cannot half-overlap. Sharing even one element forces them to
      be the same set, which is what makes the classes tile the underlying set
      rather than merely cover it.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-equivalence-class
    relates: []
    tags: []

  - id: foundations.relations.partition-theorem
    kind: theorem
    prominence: 2
    title: "Equivalence relations and partitions correspond"
    statement: >
      Let $A$ be a set. If $\sim$ is an equivalence relation on $A$, then the
      collection of its equivalence classes $\{[a] : a \in A\}$ is a partition
      of $A$: each class is nonempty because $a \in [a]$, distinct classes are
      disjoint because classes that meet are equal, and the classes cover $A$
      for the same reason each is nonempty. Conversely, if $\mathcal{P}$ is a
      partition of $A$, then the relation defined by $a \sim_{\mathcal{P}} b$ if
      and only if $a$ and $b$ lie in the same block is reflexive, symmetric and
      transitive, and its equivalence classes are precisely the blocks of
      $\mathcal{P}$. The two constructions are mutually inverse, so they set up
      a bijection between the equivalence relations on $A$ and the partitions of
      $A$.
    summary: >
      Cutting a set into pieces and declaring certain elements interchangeable
      are the same act seen from two sides. Every equivalence relation is a
      partition in disguise, and every partition is an equivalence relation.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.class-eq-lemma
      - foundations.sets.partition
    relates: []
    tags: []

  - id: foundations.relations.def-quotient-set
    kind: definition
    prominence: 1
    title: "Quotient set and canonical projection"
    statement: >
      Let $\sim$ be an equivalence relation on a set $A$. The quotient set
      $A/{\sim}$ is the set whose elements are the equivalence classes:
      $A/{\sim} = \{[a] : a \in A\}$. The canonical projection is the map
      $\pi : A \to A/{\sim}$ given by $\pi(a) = [a]$; it is surjective by
      construction, and $\pi(a) = \pi(b)$ if and only if $a \sim b$, so the
      preimages $\pi^{-1}([a])$ are exactly the classes. Forming the quotient is
      the standard way of promoting "the same for present purposes" to literal
      equality: in $A/{\sim}$ two formerly equivalent elements have become one
      and the same element. Note the shift of level — an element of $A/{\sim}$
      is a subset of $A$.
    summary: >
      Collapse each bundle of equivalent elements to a single point. What was an
      equivalence in the original set becomes plain equality in the new one.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-equivalence-class
      - foundations.functions.def-surjective
      - foundations.functions.def-preimage
    relates: []
    tags: []

  - id: foundations.relations.well-defined-on-quotient
    kind: technique
    prominence: 1
    title: "Well-definedness on a quotient"
    statement: >
      A rule written in terms of a representative defines something on a
      quotient only if its value does not depend on which representative was
      chosen. Precisely: let $\sim$ be an equivalence relation on $A$ and let
      $f : A \to B$. There is a function
      $\bar{f} : A/{\sim} \to B$ with $\bar{f}([a]) = f(a)$ for all $a \in A$ if
      and only if $f$ is constant on classes, that is, $a \sim a'$ implies
      $f(a) = f(a')$; when it exists, $\bar{f}$ is unique and satisfies
      $\bar{f} \circ \pi = f$. The same test governs operations: a binary
      operation on $A$ descends to $A/{\sim}$ exactly when $a \sim a'$ and
      $b \sim b'$ imply that $a$ combined with $b$ is equivalent to $a'$
      combined with $b'$, a condition called compatibility, or congruence, of
      $\sim$ with the operation. In practice: define using a representative,
      then verify that replacing every representative by an equivalent one
      leaves the answer unchanged. Skipping the verification is the standard
      error, and the rule "send $[a]$ to $a$" is the standard non-example — it
      fails as soon as some class has two elements.
    summary: >
      Anything defined by picking a representative must be checked not to depend
      on the pick. That verification is the price of working with quotients, and
      it is usually where the real content of the construction sits.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-quotient-set
      - foundations.functions.def-composition
    relates: []
    tags: []

  - id: foundations.relations.def-congruence-mod-n
    kind: definition
    prominence: 1
    title: "Congruence modulo n"
    statement: >
      Fix an integer $n \ge 1$. For $a, b \in \mathbb{Z}$, write
      $a \equiv b \pmod{n}$ to mean $n \mid (a - b)$, that is, $a - b = kn$ for
      some $k \in \mathbb{Z}$. This is an equivalence relation on $\mathbb{Z}$:
      it is reflexive because $n \mid 0$; symmetric because $n \mid (a-b)$
      forces $n \mid (b-a)$; and transitive because
      $a - c = (a-b) + (b-c)$ is a sum of two multiples of $n$. It is moreover
      compatible with the arithmetic: if $a \equiv a' \pmod{n}$ and
      $b \equiv b' \pmod{n}$ then $a + b \equiv a' + b' \pmod{n}$ and
      $ab \equiv a'b' \pmod{n}$.
    summary: >
      Two integers count as the same when they differ by a multiple of $n$. This
      is the equivalence relation behind clock arithmetic, and the one that
      survives addition and multiplication intact.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-equivalence-relation
    relates: []
    tags: []

  - id: foundations.relations.ex-integers-mod-n
    kind: example
    prominence: 1
    title: "The integers modulo n"
    statement: >
      For $n \ge 1$ the quotient of $\mathbb{Z}$ by congruence modulo $n$ is
      written $\mathbb{Z}/n\mathbb{Z}$; its elements are the residue classes
      $[a] = \{a + kn : k \in \mathbb{Z}\}$. By division with remainder every
      integer is congruent modulo $n$ to exactly one of
      $0, 1, \ldots, n-1$, so $\mathbb{Z}/n\mathbb{Z}$ has exactly $n$ elements,
      $[0], [1], \ldots, [n-1]$. Because congruence is compatible with addition
      and multiplication, the rules $[a] + [b] = [a+b]$ and $[a][b] = [ab]$ are
      well defined, and they make $\mathbb{Z}/n\mathbb{Z}$ a commutative ring —
      for $n = 12$, the arithmetic of a clock face, where
      $[9] + [5] = [14] = [2]$. The well-definedness check is not a formality:
      the rule "$[a] \le [b]$ whenever $a \le b$" does not define an order on
      $\mathbb{Z}/12\mathbb{Z}$, since $[1] = [13]$ while $1 \le 5$ holds and
      $13 \le 5$ does not.
    summary: >
      The finite arithmetic obtained by collapsing $\mathbb{Z}$ modulo $n$. It
      is the standard first quotient, and the reason its operations exist at all
      is precisely the compatibility of congruence with them.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-congruence-mod-n
      - foundations.relations.well-defined-on-quotient
    relates: []
    tags: []

  - id: foundations.relations.def-partial-order
    kind: definition
    prominence: 1
    title: "Partial order and poset"
    statement: >
      A partial order on a set $A$ is a relation, usually written $\le$, that is
      reflexive, antisymmetric and transitive; the pair $(A, \le)$ is then a
      partially ordered set, or poset. The associated strict order is $a < b$,
      meaning $a \le b$ and $a \ne b$; it is irreflexive and transitive, and
      conversely any irreflexive transitive relation $<$ gives a partial order
      by declaring $a \le b$ when $a < b$ or $a = b$, so the two presentations
      are interchangeable. The word "partial" records that two elements may be
      incomparable, with neither $a \le b$ nor $b \le a$. Standard examples:
      $\le$ on $\mathbb{R}$; $\subseteq$ on the subsets of a fixed set;
      divisibility on $\mathbb{N}$; and the coordinatewise order on
      $\mathbb{R}^2$, in which $(a_1, a_2) \le (b_1, b_2)$ means
      $a_1 \le b_1$ and $a_2 \le b_2$. Antisymmetry is
      what separates a partial order from a mere preorder, which is only
      required to be reflexive and transitive.
    summary: >
      A notion of "at most" that need not compare everything: reflexive,
      transitive, and with no two distinct elements each sitting below the
      other.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-reflexive
      - foundations.relations.def-antisymmetric
      - foundations.relations.def-transitive
    relates: []
    tags: []

  - id: foundations.relations.def-total-order
    kind: definition
    prominence: 1
    title: "Comparability and total order"
    statement: >
      In a poset $(A, \le)$ two elements $a, b$ are comparable if $a \le b$ or
      $b \le a$, and incomparable otherwise. A partial order is a total, or
      linear, order if every two elements of $A$ are comparable; equivalently
      its strict order satisfies trichotomy, meaning that for all $a, b \in A$
      exactly one of $a < b$, $a = b$, $b < a$ holds. Each of $\mathbb{N}$,
      $\mathbb{Z}$, $\mathbb{Q}$ and $\mathbb{R}$ with its usual $\le$ is
      totally ordered. Inclusion on the subsets of a set with at least two
      elements is not, since $\{1\}$ and $\{2\}$ are incomparable, and neither
      is divisibility on $\mathbb{N}$, where $2$ and $3$ are incomparable.
    summary: >
      Every two elements can be compared, so the elements lay out along a single
      line instead of branching. Most orders met before this point are total,
      which is why the partial case needs its own vocabulary.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-partial-order
    relates: []
    tags: []

  - id: foundations.relations.hasse-diagram
    kind: technique
    prominence: 0
    title: "Hasse diagrams"
    statement: >
      Let $(A, \le)$ be a finite poset. Say that $b$ covers $a$ if $a < b$ and
      there is no $c \in A$ with $a < c < b$. The Hasse diagram of $A$ draws
      each element as a point, places $b$ higher on the page than $a$ whenever
      $b$ covers $a$, and joins such a pair by a plain line segment; no other
      segments and no arrowheads are drawn, since the upward direction carries
      the orientation. The full order is recoverable from the picture:
      $a \le b$ if and only if $a = b$ or some upward path of segments leads
      from $a$ to $b$. What has been suppressed is exactly the reflexive and
      transitive edges, which is what makes the diagram readable. A poset in
      which every two elements are comparable draws as a single vertical stack,
      incomparable elements appear as separate branches, and the subsets of
      $\{1,2,3\}$ under $\subseteq$ draw as a cube.
      Finiteness matters — in $(\mathbb{Q}, \le)$ no element covers another, so
      the covering relation is empty and the diagram carries no information.
    summary: >
      The economical picture of a finite order: draw only the immediate steps
      and read every other comparison off as an upward path.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-partial-order
    relates: []
    tags: []

  - id: foundations.relations.def-maximal-greatest
    kind: definition
    prominence: 1
    title: "Maximal, minimal, greatest and least elements"
    statement: >
      Let $(A, \le)$ be a poset and $S \subseteq A$. An element $m \in S$ is
      maximal in $S$ if no $x \in S$ satisfies $m < x$, and greatest in $S$ (a
      maximum) if $x \le m$ for every $x \in S$; minimal and least (a minimum)
      are defined dually. A greatest element is maximal, and is unique when it
      exists, by antisymmetry. A maximal element need be neither greatest nor
      unique, because maximality only says that nothing lies strictly above,
      not that everything lies below. In the poset of proper subsets of
      $\{1,2\}$ ordered by $\subseteq$, both $\{1\}$ and $\{2\}$ are maximal and
      there is no greatest element. When every two elements are comparable the
      two notions coincide, which is why the distinction is invisible on
      $\mathbb{R}$. Every finite
      nonempty poset has a maximal element; it need not have a greatest one.
    summary: >
      Nothing above me and above everything are different demands once the order
      is only partial. That gap is exactly what Zorn's lemma delivers on and
      what arguments needing a genuine maximum must close by hand.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-partial-order
    relates: []
    tags: []

  - id: foundations.relations.def-bounds-poset
    kind: definition
    prominence: 1
    title: "Upper and lower bounds in a poset"
    statement: >
      Let $(A, \le)$ be a poset and $S \subseteq A$. An element $b \in A$ is an
      upper bound of $S$ if $x \le b$ for every $x \in S$, and $S$ is bounded
      above if it has at least one; lower bound and bounded below are dual. The
      crucial difference from a greatest element of $S$ is that a bound is
      drawn from the whole of $A$ and need not belong to $S$: the interval
      $(0,1)$ in $\mathbb{R}$ has upper bound $1$ but no greatest element. Every
      element of $A$ is vacuously an upper bound of $\emptyset$, so $\emptyset$
      is bounded above as soon as $A$ is nonempty. In the poset of subsets of a
      set $X$ under $\subseteq$, an upper bound of a family is any subset of $X$
      containing all its members, and the union of the family is one.
    summary: >
      An element of the ambient poset sitting above everything in a given
      subset, without having to be a member of that subset itself.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-partial-order
    relates: []
    tags: []

  - id: foundations.relations.def-lub-poset
    kind: definition
    prominence: 1
    title: "Least upper bound in a poset"
    statement: >
      Let $(A, \le)$ be a poset and $S \subseteq A$. An element $s \in A$ is the
      least upper bound, or supremum, of $S$ — written $\sup S$ — if $s$ is an
      upper bound of $S$ and $s \le b$ for every upper bound $b$ of $S$; that
      is, if $s$ is the least element of the set of upper bounds of $S$. The
      greatest lower bound, or infimum $\inf S$, is dual. A supremum is unique
      when it exists, by antisymmetry, and if $S$ has a greatest element then
      that element is $\sup S$. Existence is a real restriction rather than a
      formality: in $(\mathbb{Q}, \le)$ the set
      $\{q \in \mathbb{Q} : q > 0 \text{ and } q^2 < 2\}$ is bounded above and
      has no least upper bound, and in a general poset even a two-element subset
      may have none. A poset in which every pair of elements has a supremum and
      an infimum is a lattice; one in which every nonempty subset bounded above
      has a supremum is called Dedekind-complete.
    summary: >
      The tightest of all the upper bounds, least among them. Whether it always
      exists is what separates the rationals from the reals, and a bare poset
      from a lattice.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-bounds-poset
      - foundations.relations.def-maximal-greatest
    relates:
      - id: foundations.real.sup-inf
        note: 'The supremum of a set of reals is this poset notion specialised to the poset $(\mathbb{R}, \le)$; completeness of $\mathbb{R}$ is the assertion that in that one poset the supremum always exists.'
    tags: []

  - id: foundations.relations.def-well-order
    kind: definition
    prominence: 1
    title: "Well-order"
    statement: >
      A well-order on a set $A$ is a total order $\le$ in which every nonempty
      subset of $A$ has a least element. Totality is in fact automatic: if every
      nonempty subset of a poset has a least element, applying this to
      $\{a,b\}$ already compares $a$ and $b$. A well-ordered set admits no
      infinite strictly decreasing sequence, since the terms of such a sequence
      would form a nonempty subset with no least element; that is what licenses
      proof by induction and definition by recursion along the order. The set
      $\mathbb{N}$ with its usual order is
      well-ordered. None of $\mathbb{Z}$, $\mathbb{Q}$ and $\mathbb{R}$ is:
      $\mathbb{Z}$ itself has no least element, and the interval $(0,1)$ in
      $\mathbb{Q}$ or in $\mathbb{R}$ is bounded below yet has no least element,
      so bounding does
      not help. The well-ordering theorem — that every set admits some
      well-order — is equivalent to the axiom of choice and is not provable
      without it.
    summary: >
      A total order in which you can never descend forever, because every
      nonempty subset has a smallest element. This is the property that makes
      induction work, and it is far stronger than being totally ordered.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-total-order
      - foundations.relations.def-maximal-greatest
    relates: []
    tags: []

  - id: foundations.relations.def-chain
    kind: definition
    prominence: 0
    title: "Chains and antichains"
    statement: >
      Let $(A, \le)$ be a poset. A chain in $A$ is a subset $C \subseteq A$ that
      is totally ordered by the restriction of $\le$, that is, any two elements
      of $C$ are comparable; an antichain is a subset whose elements are
      pairwise incomparable. The empty set and every singleton are both. In the
      poset of subsets of $\{1,2,3\}$ under $\subseteq$, the tower
      $\emptyset \subseteq \{1\} \subseteq \{1,2\} \subseteq \{1,2,3\}$ is a
      chain with four elements and $\{\{1\},\{2\},\{3\}\}$ is an antichain with
      three. A chain need not be countable and need not contain a greatest
      element, and a poset may have chains far larger than any of its
      antichains, or the reverse.
    summary: >
      A slice of a poset on which the order happens to be total — a linearly
      ordered piece of a possibly branching structure. Chains are the objects
      Zorn's lemma quantifies over.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-total-order
    relates: []
    tags: []

  - id: foundations.relations.zorn
    kind: axiom
    prominence: 2
    title: "Zorn's Lemma"
    statement: >
      Let $(A, \le)$ be a nonempty poset in which every chain has an upper bound
      in $A$. Then $A$ has a maximal element. The chain hypothesis does the real
      work: $(\mathbb{R}, \le)$ is a nonempty poset with no maximal element, and
      the chain $\mathbb{R}$ itself has no upper bound in it. So does the exact
      form of the conclusion — the element produced is maximal, never claimed to
      be greatest. Nonemptiness, by contrast, is listed only for emphasis: the
      empty set is itself a chain, and an upper bound for it is just some
      element of $A$. Equivalently one may demand an upper bound only for every
      nonempty chain, provided $A$ is assumed nonempty. Zorn's lemma is not provable
      in $\mathrm{ZF}$: it is equivalent to the axiom of choice and to the
      well-ordering theorem. It is the form of choice used in practice — that
      every vector space has a basis, every nontrivial ring with identity has a
      maximal ideal, and every field has an algebraic closure are all proved by
      applying it to a poset of partial objects ordered by extension, in which
      the union of a chain supplies the required upper bound.
    summary: >
      If every linearly ordered piece of a poset is capped, the poset contains
      something nothing exceeds. This is the standard tool for producing maximal
      objects that no explicit construction can reach.
    parent: foundations.relations
    also_under: []
    requires:
      - foundations.relations.def-chain
      - foundations.relations.def-bounds-poset
      - foundations.relations.def-maximal-greatest
    relates: []
    tags: []
