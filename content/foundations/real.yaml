  - id: foundations.real.sup-inf
    kind: definition
    prominence: 1
    title: "Supremum and infimum"
    statement: >
      Let $S \subseteq \mathbb{R}$ be nonempty. A number $b$ is an upper bound
      of $S$ if $x \le b$ for every $x \in S$, and $S$ is bounded above if some
      upper bound exists. A number $M$ is the supremum (least upper bound)
      $\sup S$ if (i) $M$ is an upper bound of $S$, and (ii) $M \le b$ for every
      upper bound $b$ of $S$. Dually, $m$ is the infimum (greatest lower bound)
      $\inf S$ if $m$ is a lower bound of $S$ and $m \ge c$ for every lower
      bound $c$. When a supremum exists it is unique. Equivalent
      characterization: $M = \sup S$ iff $M$ is an upper bound and for every
      $\varepsilon > 0$ there is some $x \in S$ with $x > M - \varepsilon$.
    summary: >
      The least upper bound and greatest lower bound of a set of reals — the
      tightest bounds that still bound it, which need not belong to the set.
    parent: foundations.real
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: foundations.real.completeness
    kind: axiom
    prominence: 1
    title: "Completeness axiom of ℝ"
    statement: >
      Every nonempty subset of $\mathbb{R}$ that is bounded above has a
      supremum in $\mathbb{R}$ (the least-upper-bound property). Equivalently,
      every nonempty subset bounded below has an infimum in $\mathbb{R}$. This
      is the axiom that separates $\mathbb{R}$ from $\mathbb{Q}$: the set
      $\{q \in \mathbb{Q} : q > 0,\ q^2 < 2\}$ is nonempty and bounded above but
      has no least upper bound in $\mathbb{Q}$.
    summary: >
      The real line has no gaps: any nonempty set with an upper bound has a
      least one. This is the axiom every existence theorem in analysis
      ultimately appeals to.
    parent: foundations.real
    also_under: []
    requires:
      - foundations.real.sup-inf
    relates: []
    tags: []
