  - id: analysis.mvc.def-partial-derivative
    kind: definition
    prominence: 1
    title: "Partial derivative"
    statement: >
      Let $f$ be defined on a neighborhood of $a = (a_1, \dots, a_n)$ in
      $\mathbb{R}^n$. The partial derivative of $f$ with respect to $x_j$ at $a$
      is $\dfrac{\partial f}{\partial x_j}(a)
      = \lim_{h \to 0} \dfrac{f(a + h e_j) - f(a)}{h}$
      when that limit exists, where $e_j$ is the $j$-th standard basis vector.
      Equivalently it is the ordinary derivative at $a_j$ of the
      single-variable function $t \mapsto f(a_1, \dots, t, \dots, a_n)$ obtained
      by freezing every other coordinate. Existence of all partials at a point
      does not imply continuity there, let alone differentiability.
    summary: >
      The derivative taken in one coordinate direction with the other variables
      held fixed — an ordinary one-variable derivative in disguise.
    parent: analysis.mvc
    also_under: []
    requires:
      - analysis.svc.def-derivative
    relates: []
    tags: []

  - id: analysis.mvc.leibniz-rule
    kind: theorem
    prominence: 1
    title: "Leibniz integral rule"
    statement: >
      Suppose $f$ and $\partial f/\partial t$ are continuous on the rectangle
      $[a,b] \times [c,d]$. Then $I(t) = \int_a^b f(x,t)\,dx$ is differentiable
      on $[c,d]$ and
      $I'(t) = \displaystyle\int_a^b \frac{\partial f}{\partial t}(x,t)\,dx$ —
      the derivative may be moved inside the integral. Both hypotheses matter:
      continuity of $\partial f/\partial t$ on a closed bounded rectangle is
      what makes the difference quotients converge uniformly in $x$, and without
      some such control the interchange can fail.
    summary: >
      Differentiation under the integral sign: when the integrand and its
      parameter-derivative are continuous, differentiating in the parameter and
      integrating in the other variable commute.
    parent: analysis.mvc
    also_under: []
    requires:
      - analysis.mvc.def-partial-derivative
      - analysis.svc.def-continuity
      - analysis.svc.def-riemann-integral
    relates: []
    tags: []
