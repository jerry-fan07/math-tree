# analysis.svc — Single-Variable Calculus
# Direct encoding of design.md Appendix A (the worked-example subgraph running
# limits -> derivatives -> Riemann integration -> FTC). Every `requires` edge
# here is a transcription of an arrow in the Appendix A mermaid block, which is
# already transitively reduced (design.md §2.3).

nodes:
  - id: analysis.svc
    kind: subbranch
    title: "Single-Variable Calculus"
    summary: >
      Limits, continuity, differentiation and Riemann integration for real
      functions of one real variable, culminating in the Fundamental Theorem of
      Calculus.
    parent: analysis
    also_under: []
    tags: []

  - id: analysis.svc.def-limit
    kind: definition
    prominence: 2
    title: "ε–δ limit of a function"
    statement: >
      Let $f$ be defined on a punctured neighborhood of $c$. Then
      $\lim_{x \to c} f(x) = L$ means: for every $\varepsilon > 0$ there exists
      $\delta > 0$ such that $|f(x) - L| < \varepsilon$ for every $x$ in the
      domain of $f$ with $0 < |x - c| < \delta$. The value $f(c)$ — which need
      not be defined — is irrelevant to the limit, and a limit is unique when it
      exists.
    summary: >
      $f(x)$ can be forced arbitrarily close to $L$ by taking $x$ close enough
      to $c$ without equalling it.
    parent: analysis.svc
    also_under: []
    requires:
      - foundations.real.sup-inf
    relates: []
    tags: []

  - id: analysis.svc.def-continuity
    kind: definition
    prominence: 1
    title: "Continuity at a point"
    statement: >
      $f$ is continuous at a point $c$ of its domain if
      $\lim_{x \to c} f(x)$ exists and equals $f(c)$. Unwound: for every
      $\varepsilon > 0$ there exists $\delta > 0$ such that
      $|f(x) - f(c)| < \varepsilon$ for every $x$ in the domain of $f$ with
      $|x - c| < \delta$. $f$ is continuous on a set when it is continuous at
      each of its points, one-sidedly at an endpoint of an interval.
    summary: >
      No jump at $c$: the value of the function there is exactly the limit of
      its values nearby.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-limit
    relates: []
    tags: []

  - id: analysis.svc.evt
    kind: theorem
    prominence: 1
    title: "Extreme Value Theorem"
    statement: >
      If $f : [a,b] \to \mathbb{R}$ is continuous on the closed bounded
      interval $[a,b]$, then $f$ is bounded and attains both bounds: there exist
      $p, q \in [a,b]$ with $f(p) \le f(x) \le f(q)$ for all $x \in [a,b]$.
      Both hypotheses are essential — $f(x) = 1/x$ is continuous but unbounded
      on the non-closed interval $(0,1]$, and $f(x) = x$ attains no maximum on
      the unbounded interval $[0,\infty)$.
    summary: >
      A continuous function on a closed bounded interval really achieves a
      largest and a smallest value, rather than merely approaching them.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-continuity
      - foundations.real.completeness
    relates: []
    tags: []

  - id: analysis.svc.ivt
    kind: theorem
    prominence: 1
    title: "Intermediate Value Theorem"
    statement: >
      If $f : [a,b] \to \mathbb{R}$ is continuous and $y$ lies between $f(a)$
      and $f(b)$, then there exists $c \in [a,b]$ with $f(c) = y$; if $y$ lies
      strictly between $f(a)$ and $f(b)$ then $c$ can be taken in the open
      interval $(a,b)$. Consequently the continuous image of an interval is an
      interval.
    summary: >
      A continuous function cannot get from one value to another without
      passing through every value in between.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-continuity
      - foundations.real.completeness
    relates: []
    tags: []

  - id: analysis.svc.def-derivative
    kind: definition
    prominence: 2
    title: "Derivative at a point"
    statement: >
      Let $f$ be defined on a neighborhood of $c$. $f$ is differentiable at $c$
      if the limit of difference quotients
      $f'(c) = \lim_{h \to 0} \dfrac{f(c+h) - f(c)}{h}$
      exists as a finite real number; equivalently
      $f'(c) = \lim_{x \to c} \dfrac{f(x) - f(c)}{x - c}$. $f$ is differentiable
      on an open set if it is differentiable at each of its points, and $f'$ is
      then itself a function on that set.
    summary: >
      The instantaneous rate of change at a point, defined as the limit of
      average rates of change over shrinking intervals.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-limit
    relates: []
    tags: []

  - id: analysis.svc.intuition-linearization
    kind: intuition
    prominence: 0
    title: "Derivative as local linear approximation"
    statement: >
      Differentiability at $c$ is exactly the existence of a best affine
      approximation there: $f$ is differentiable at $c$ with $f'(c) = m$ if and
      only if $f(c + h) = f(c) + mh + r(h)$ where the error satisfies
      $r(h)/h \to 0$ as $h \to 0$. The tangent line
      $y = f(c) + f'(c)(x - c)$ is the unique line agreeing with $f$ to first
      order at $c$, which is why zooming in on the graph of a differentiable
      function makes it look straight, and why the derivative is the right tool
      for approximation, error estimates and optimization.
    summary: >
      The derivative is the slope of the line that best fits the function near
      a point — locally, a differentiable function is a linear one plus
      negligible error.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-derivative
    relates: []
    tags: []

  - id: analysis.svc.diff-implies-cont
    kind: lemma
    prominence: 0
    title: "Differentiability ⇒ continuity"
    statement: >
      If $f$ is differentiable at $c$ then $f$ is continuous at $c$. Proof: for
      $x \ne c$ near $c$,
      $f(x) - f(c) = \dfrac{f(x) - f(c)}{x - c}\,(x - c) \to f'(c) \cdot 0 = 0$,
      so $\lim_{x \to c} f(x) = f(c)$. The converse fails: $f(x) = |x|$ is
      continuous at $0$ but not differentiable there.
    summary: >
      Differentiability is strictly stronger than continuity — every
      differentiable function is continuous, but not conversely.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-derivative
      - analysis.svc.def-continuity
    relates: []
    tags: []

  - id: analysis.svc.rolle
    kind: lemma
    prominence: 0
    title: "Rolle's Theorem"
    statement: >
      If $f$ is continuous on $[a,b]$, differentiable on $(a,b)$, and
      $f(a) = f(b)$, then there exists $c \in (a,b)$ with $f'(c) = 0$. Proof:
      by the Extreme Value Theorem $f$ attains a maximum and a minimum on
      $[a,b]$. If both occur at endpoints then $f$ is constant and any interior
      point serves; otherwise an extremum occurs at some $c \in (a,b)$, where
      the difference quotients have opposite signs on the two sides, forcing
      $f'(c) = 0$.
    summary: >
      A function that starts and ends at the same height must level off
      somewhere in between — the stepping stone to the Mean Value Theorem.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.diff-implies-cont
      - analysis.svc.evt
    relates: []
    tags: []

  - id: analysis.svc.mvt
    kind: theorem
    prominence: 1
    title: "Mean Value Theorem"
    statement: >
      If $f$ is continuous on $[a,b]$ and differentiable on the open interval
      $(a,b)$, then there exists $c \in (a,b)$ with
      $f'(c) = \dfrac{f(b) - f(a)}{b - a}$. Proof: apply Rolle's Theorem to
      $g(x) = f(x) - \dfrac{f(b) - f(a)}{b - a}\,(x - a)$, which satisfies the
      same regularity hypotheses and has $g(a) = g(b) = f(a)$.
    summary: >
      Somewhere strictly inside the interval, the instantaneous rate of change
      equals the average rate of change across it.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.rolle
    relates: []
    tags: []

  - id: analysis.svc.zero-deriv-const
    kind: corollary
    prominence: 0
    title: "f′ ≡ 0 ⇒ f constant"
    statement: >
      Let $I$ be an interval and let $f$ be continuous on $I$ with $f'(x) = 0$
      at every interior point $x$ of $I$. Then $f$ is constant on $I$. Proof:
      for $x < y$ in $I$ the Mean Value Theorem gives $c \in (x,y)$ with
      $f(y) - f(x) = f'(c)(y - x) = 0$. Immediate consequence: if $f' = g'$
      throughout an interval then $f - g$ is constant there. The hypothesis that
      $I$ is an interval is essential — on $(0,1) \cup (2,3)$ a function with
      zero derivative need only be locally constant.
    summary: >
      Zero derivative across an interval means the function never moves; hence
      two antiderivatives of the same function on an interval differ by a
      constant.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.mvt
    relates: []
    tags: []

  - id: analysis.svc.def-riemann-sum
    kind: definition
    prominence: 0
    title: "Riemann sum"
    statement: >
      A partition of $[a,b]$ is a finite set
      $P = \{a = x_0 < x_1 < \cdots < x_n = b\}$, with subinterval lengths
      $\Delta x_i = x_i - x_{i-1}$ and mesh $\|P\| = \max_i \Delta x_i$. Given
      tags $t_i \in [x_{i-1}, x_i]$, the corresponding Riemann sum of a function
      $f$ is $S(f, P, t) = \sum_{i=1}^{n} f(t_i)\,\Delta x_i$. For bounded $f$
      the two extreme choices are the Darboux sums
      $L(f,P) = \sum_{i=1}^{n} m_i \Delta x_i$ and
      $U(f,P) = \sum_{i=1}^{n} M_i \Delta x_i$, where
      $m_i = \inf_{[x_{i-1},x_i]} f$ and $M_i = \sup_{[x_{i-1},x_i]} f$; these
      satisfy $L(f,P) \le S(f,P,t) \le U(f,P)$ for every choice of tags.
    summary: >
      A finite rectangle-sum approximation to the area under a curve: chop the
      interval into pieces, sample the function on each, add up the areas.
    parent: analysis.svc
    also_under: []
    requires:
      - foundations.real.sup-inf
    relates: []
    tags: []

  - id: analysis.svc.def-riemann-integral
    kind: definition
    prominence: 1
    title: "Riemann integral"
    statement: >
      Let $f$ be bounded on $[a,b]$. Its lower and upper integrals are
      $\underline{\int_a^b} f = \sup_P L(f,P)$ and
      $\overline{\int_a^b} f = \inf_P U(f,P)$, taken over all partitions $P$;
      refinement gives $\underline{\int_a^b} f \le \overline{\int_a^b} f$
      always. $f$ is Riemann integrable on $[a,b]$ when the two agree, and the
      common value is written $\int_a^b f(x)\,dx$. Equivalent (Riemann's
      formulation): there is a number $I$ such that for every $\varepsilon > 0$
      there is $\delta > 0$ with $|S(f,P,t) - I| < \varepsilon$ for every tagged
      partition of mesh less than $\delta$. Cauchy criterion: $f$ is integrable
      iff for every $\varepsilon > 0$ some partition has
      $U(f,P) - L(f,P) < \varepsilon$.
    summary: >
      When the upper and lower rectangle approximations squeeze down to a single
      number, that number is the integral of the function.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-riemann-sum
    relates: []
    tags: []

  - id: analysis.svc.cont-integrable
    kind: proposition
    prominence: 0
    title: "Continuous on [a,b] ⇒ integrable"
    statement: >
      If $f$ is continuous on the closed bounded interval $[a,b]$, then $f$ is
      Riemann integrable on $[a,b]$. Proof: continuity on a closed bounded
      interval is uniform, so given $\varepsilon > 0$ choose $\delta > 0$ with
      $|f(x) - f(y)| < \varepsilon/(b-a)$ whenever $|x - y| < \delta$; any
      partition of mesh less than $\delta$ then has
      $M_i - m_i \le \varepsilon/(b-a)$ on each subinterval, so
      $U(f,P) - L(f,P) \le \varepsilon$ and the Cauchy criterion applies.
      Integrability is strictly weaker than continuity: monotone functions and
      functions with finitely many jumps are integrable too.
    summary: >
      Continuity on a closed bounded interval is enough for the Riemann integral
      to exist — which is what makes the accumulation function of FTC I
      well defined.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-continuity
      - analysis.svc.def-riemann-integral
    relates: []
    tags: []

  - id: analysis.svc.ex-integral-x2
    kind: example
    prominence: 0
    title: "∫₀¹ x² dx from Riemann sums"
    statement: >
      Take $f(x) = x^2$ on $[0,1]$ and the uniform partition $x_i = i/n$. Since
      $f$ is increasing, the right-endpoint sum is the upper Darboux sum:
      $U_n = \sum_{i=1}^{n} \left(\dfrac{i}{n}\right)^2 \dfrac{1}{n}
      = \dfrac{1}{n^3}\sum_{i=1}^{n} i^2
      = \dfrac{n(n+1)(2n+1)}{6n^3}
      = \dfrac{1}{3} + \dfrac{1}{2n} + \dfrac{1}{6n^2}$,
      and the left-endpoint (lower) sum is
      $L_n = \dfrac{(n-1)n(2n-1)}{6n^3}
      = \dfrac{1}{3} - \dfrac{1}{2n} + \dfrac{1}{6n^2}$.
      Both converge to $1/3$ as $n \to \infty$, so the upper and lower integrals
      agree and $\int_0^1 x^2\,dx = \dfrac{1}{3}$.
    summary: >
      Evaluating an integral straight from the definition, using the
      sum-of-squares formula — no antiderivative involved, which is exactly what
      makes the Fundamental Theorem feel like a shortcut.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-riemann-integral
    relates: []
    tags: []

  - id: analysis.svc.def-antiderivative
    kind: definition
    prominence: 0
    title: "Antiderivative"
    statement: >
      $F$ is an antiderivative of $f$ on an interval $I$ if $F$ is
      differentiable on $I$ and $F'(x) = f(x)$ for every $x \in I$.
      Antiderivatives are never unique: if $F$ is one then so is $F + C$ for any
      constant $C$, since a constant has zero derivative. The indefinite-integral
      notation $\int f(x)\,dx = F(x) + C$ names this family, and is a priori
      unrelated to the definite integral $\int_a^b f(x)\,dx$, which is defined
      as a limit of Riemann sums.
    summary: >
      A function whose derivative is the given function — the object the
      Fundamental Theorem connects to areas.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.def-derivative
    relates: []
    tags: []

  - id: analysis.svc.ftc-part-1
    kind: theorem
    prominence: 2
    title: "FTC, Part I"
    statement: >
      Let $f$ be continuous on $[a,b]$ and define the accumulation function
      $F(x) = \int_a^x f(t)\,dt$ for $x \in [a,b]$ — well defined because
      continuous functions are integrable on each $[a,x]$. Then $F$ is
      differentiable on $[a,b]$ (one-sidedly at the endpoints) and
      $F'(x) = f(x)$. In particular, every continuous function on an interval
      has an antiderivative.
    summary: >
      Differentiating an accumulated integral gives back the integrand, so every
      continuous function has an antiderivative — namely its own area-so-far
      function.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.cont-integrable
      - analysis.svc.def-antiderivative
    relates: []
    tags: []

  - id: analysis.svc.ftc-part-2
    kind: theorem
    prominence: 2
    title: "FTC, Part II"
    statement: >
      If $f$ is continuous on $[a,b]$ and $F$ is any antiderivative of $f$ on
      $[a,b]$, then $\int_a^b f(x)\,dx = F(b) - F(a)$. Proof: by FTC Part I the
      accumulation function $G(x) = \int_a^x f(t)\,dt$ is an antiderivative of
      $f$, so $(F - G)' \equiv 0$ on $[a,b]$ and $F - G$ is therefore constant;
      evaluating at $a$ and $b$ gives
      $F(b) - F(a) = G(b) - G(a) = \int_a^b f(x)\,dx$.
    summary: >
      Evaluating a definite integral reduces to finding any antiderivative and
      taking the difference of its values at the endpoints.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.ftc-part-1
      - analysis.svc.zero-deriv-const
    relates:
      - id: analysis.mvc.leibniz-rule
        note: 'Both express integral–derivative interchange.'
    tags: []

  - id: analysis.svc.u-sub
    kind: technique
    prominence: 1
    title: "u-substitution"
    statement: >
      If $g$ has a continuous derivative on $[a,b]$ and $f$ is continuous on an
      interval containing $g([a,b])$, then
      $\int_a^b f(g(x))\,g'(x)\,dx = \int_{g(a)}^{g(b)} f(u)\,du$.
      Justification: let $F$ be an antiderivative of $f$; the chain rule gives
      $(F \circ g)'(x) = f(g(x))\,g'(x)$, and applying the evaluation form of
      the Fundamental Theorem to each side turns both into
      $F(g(b)) - F(g(a))$. In practice: set $u = g(x)$, $du = g'(x)\,dx$,
      rewrite the integrand entirely in $u$, and transform the limits rather
      than substituting back.
    summary: >
      The chain rule run backwards: substituting $u = g(x)$ converts an integral
      of $f(g(x))g'(x)$ into a plain integral of $f$, with the limits carried
      along.
    parent: analysis.svc
    also_under: []
    requires:
      - analysis.svc.ftc-part-2
    relates: []
    tags: []
