# analysis.sequences — Sequences and Series
# Real sequences and their limits, the monotone / Bolzano–Weierstrass / Cauchy
# machinery that completeness buys, and infinite series with the standard
# convergence tests.

nodes:
  - id: analysis.sequences
    kind: subbranch
    title: "Sequences and Series"
    summary: >
      Convergence of real sequences, monotone and Cauchy criteria, and the
      convergence tests for infinite series — the first place completeness is
      cashed out as a working tool.
    parent: analysis
    also_under: []
    tags: []

  - id: analysis.sequences.def-convergence
    kind: definition
    prominence: 2
    title: "Convergence of a sequence (ε–N)"
    statement: >
      Let $(a_n)_{n \ge 1}$ be a sequence of real numbers. It converges to
      $L \in \mathbb{R}$, written $a_n \to L$ or
      $\lim_{n \to \infty} a_n = L$, if for every $\varepsilon > 0$ there exists
      $N \in \mathbb{N}$ such that $|a_n - L| < \varepsilon$ for every
      $n \ge N$. A sequence is convergent if such an $L$ exists and divergent
      otherwise. The quantifier order is the content: $N$ is produced after
      $\varepsilon$ is given and may depend on it, and it is enough that one
      such $N$ exist, since any larger $N$ works too. Only the tail is
      constrained, so altering finitely many terms changes neither convergence
      nor the limit.
    summary: >
      Past some point in the list, every term lies within whatever tolerance you
      name of the limit — and the tolerance is named first, the point second.
    parent: analysis.sequences
    also_under: []
    requires:
      - foundations.functions.def-sequence
      - foundations.logic.nested-quantifiers
    relates:
      - id: analysis.svc.def-limit
        note: 'The same $\varepsilon$ bargain with an index threshold $N$ in place of a radius $\delta$; the two are linked by the sequential criterion, that $\lim_{x \to c} f(x) = L$ holds exactly when $f(x_n) \to L$ for every sequence $x_n \to c$ with $x_n \ne c$.'
    tags: []

  - id: analysis.sequences.limit-unique
    kind: proposition
    prominence: 0
    title: "Uniqueness of the limit"
    statement: >
      A sequence has at most one limit: if $a_n \to L$ and $a_n \to M$ then
      $L = M$. Proof: let $\varepsilon > 0$. Choose $N_1$ with
      $|a_n - L| < \varepsilon/2$ for $n \ge N_1$ and $N_2$ with
      $|a_n - M| < \varepsilon/2$ for $n \ge N_2$; for any
      $n \ge \max(N_1, N_2)$ both hold, so
      $|L - M| \le |L - a_n| + |a_n - M| < \varepsilon$. Thus the nonnegative
      number $|L - M|$ is less than every positive $\varepsilon$, which forces
      $|L - M| = 0$. Two moves in that argument recur throughout the subject:
      splitting $\varepsilon$ in half across two estimates and taking the
      maximum of the two thresholds, and concluding that a nonnegative quantity
      smaller than every $\varepsilon$ is zero.
    summary: >
      A sequence cannot approach two different numbers at once, which is what
      licenses the phrase "the" limit and the notation for it.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-convergence
    relates: []
    tags: []

  - id: analysis.sequences.def-bounded
    kind: definition
    prominence: 0
    title: "Bounded sequence"
    statement: >
      A sequence $(a_n)$ is bounded above if there is $M \in \mathbb{R}$ with
      $a_n \le M$ for every $n$, bounded below if there is $m \in \mathbb{R}$
      with $a_n \ge m$ for every $n$, and bounded if both — equivalently, if
      there is $C \ge 0$ with $|a_n| \le C$ for every $n$. Unlike convergence
      the condition names no target value, and unlike convergence it constrains
      every term; but it is still insensitive to finitely many terms, since a
      finite set of extra values has a largest absolute value that can be
      absorbed into $C$.
    summary: >
      Every term of the sequence fits inside one fixed band — a far weaker
      demand than converging, and one that no finite stretch of terms can spoil.
    parent: analysis.sequences
    also_under: []
    requires:
      - foundations.functions.def-sequence
    relates: []
    tags: []

  - id: analysis.sequences.convergent-bounded
    kind: proposition
    prominence: 0
    title: "Convergent ⇒ bounded"
    statement: >
      Every convergent sequence is bounded. Proof: if $a_n \to L$, apply the
      definition with $\varepsilon = 1$ to get $N$ with $|a_n - L| < 1$, and
      hence $|a_n| < |L| + 1$, for all $n \ge N$; then
      $C = \max(|a_1|, \ldots, |a_{N-1}|, |L| + 1)$ bounds the whole sequence,
      the maximum existing because only finitely many terms were left out. The
      converse is false: $a_n = (-1)^n$ is bounded and does not converge, so
      boundedness is a necessary and not a sufficient condition.
    summary: >
      Convergence traps the tail near the limit and leaves only finitely many
      terms outside, so the sequence as a whole cannot run away.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-convergence
      - analysis.sequences.def-bounded
    relates: []
    tags: []

  - id: analysis.sequences.algebra-of-limits
    kind: theorem
    prominence: 1
    title: "Algebra of limits"
    statement: >
      Suppose $a_n \to A$ and $b_n \to B$, and let $c \in \mathbb{R}$. Then
      $a_n + b_n \to A + B$, $c\,a_n \to cA$, $a_n b_n \to AB$, and, provided
      $B \ne 0$ and $b_n \ne 0$ for all $n$, $a_n / b_n \to A/B$. Sums need only
      the triangle inequality; the product needs one thing more. Writing
      $a_n b_n - AB = a_n (b_n - B) + B(a_n - A)$, the first term is small only
      because $|a_n|$ is bounded by some $C$, which holds precisely because
      $(a_n)$ converges. Limits also respect the order: if $a_n \le b_n$ for
      every $n$ then $A \le B$. Strict inequalities are not preserved —
      $1/n > 0$ for every $n$, yet the limit is $0$.
    summary: >
      Limits pass through sums, scalar multiples, products and nonzero
      quotients, so a compound expression can be taken apart and its limit
      computed piece by piece.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.convergent-bounded
    relates: []
    tags: []

  - id: analysis.sequences.squeeze
    kind: theorem
    prominence: 1
    title: "Squeeze theorem"
    statement: >
      Let $(a_n)$, $(b_n)$, $(c_n)$ satisfy $a_n \le b_n \le c_n$ for every $n$,
      or merely for all $n$ beyond some index, and suppose $a_n \to L$ and
      $c_n \to L$ with the same $L$. Then $b_n \to L$. Proof: given
      $\varepsilon > 0$, take $N$ beyond which both $L - \varepsilon < a_n$ and
      $c_n < L + \varepsilon$; for such $n$,
      $L - \varepsilon < a_n \le b_n \le c_n < L + \varepsilon$. Note that
      convergence of $(b_n)$ is not assumed but produced, which is what makes
      the theorem useful on sequences too irregular to handle directly: the
      typical application is $|b_n| \le c_n$ with $c_n \to 0$, forcing
      $b_n \to 0$, as with $b_n = \dfrac{\sin n}{n}$.
    summary: >
      A sequence pinned between two others that converge to a common value has
      nowhere to go but that value.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-convergence
    relates: []
    tags: []

  - id: analysis.sequences.mct
    kind: theorem
    prominence: 1
    title: "Monotone Convergence Theorem"
    statement: >
      Call $(a_n)$ increasing if $a_n \le a_{n+1}$ for every $n$, decreasing if
      $a_n \ge a_{n+1}$ for every $n$, and monotone if it is one or the other.
      If $(a_n)$ is increasing and bounded above then it converges, and
      $\lim_{n \to \infty} a_n = \sup\{a_n : n \ge 1\}$; if it is decreasing and
      bounded below then it converges to $\inf\{a_n : n \ge 1\}$. Proof of the
      increasing case: the set of terms is nonempty and bounded above, so
      $S = \sup\{a_n : n \ge 1\}$ exists by completeness. Given
      $\varepsilon > 0$, $S - \varepsilon$ is not an upper bound, so
      $a_N > S - \varepsilon$ for some $N$, and monotonicity gives
      $S - \varepsilon < a_N \le a_n \le S$ for all $n \ge N$. Monotonicity is
      what makes boundedness sufficient, and this is the first theorem that
      establishes convergence without exhibiting the limit in advance.
    summary: >
      A sequence that only climbs and never passes a ceiling must settle down,
      and it settles exactly at the lowest ceiling available.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-convergence
      - analysis.sequences.def-bounded
      - foundations.real.completeness
    relates: []
    tags: []

  - id: analysis.sequences.def-subsequence
    kind: definition
    prominence: 1
    title: "Subsequence"
    statement: >
      Let $(a_n)$ be a sequence and let $n_1 < n_2 < n_3 < \cdots$ be a strictly
      increasing sequence of indices in $\mathbb{N}$. The sequence
      $k \mapsto a_{n_k}$ is the corresponding subsequence, written
      $(a_{n_k})_{k \ge 1}$. Strict increase is the whole of the definition:
      terms are selected in their original order, none is repeated, and
      infinitely many are kept. It also forces $n_k \ge k$ for every $k$, so a
      subsequence has always travelled at least as far along the original
      sequence as its own index suggests. Every sequence is a subsequence of
      itself, and a subsequence of a subsequence is again a subsequence of the
      original.
    summary: >
      An infinite selection of terms taken in their original order — terms may
      be discarded, never reordered or reused.
    parent: analysis.sequences
    also_under: []
    requires:
      - foundations.functions.def-sequence
    relates: []
    tags: []

  - id: analysis.sequences.subsequence-limit
    kind: proposition
    prominence: 0
    title: "Subsequences inherit the limit"
    statement: >
      If $a_n \to L$ then every subsequence $(a_{n_k})$ converges to the same
      $L$. Proof: given $\varepsilon > 0$ take $N$ with $|a_n - L| < \varepsilon$
      for all $n \ge N$; since $n_k \ge k$, every $k \ge N$ has $n_k \ge N$ and
      so $|a_{n_k} - L| < \varepsilon$. The result is used in contrapositive
      form and is the standard divergence argument: a sequence possessing two
      subsequences with different limits, or one subsequence that fails to
      converge, cannot converge. So $a_n = (-1)^n$ diverges, its even-indexed
      terms being constantly $1$ and its odd-indexed terms constantly $-1$.
    summary: >
      Thinning a convergent sequence cannot change where it goes, which turns
      two disagreeing subsequences into a proof of divergence.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-subsequence
      - analysis.sequences.def-convergence
    relates: []
    tags: []

  - id: analysis.sequences.bolzano-weierstrass
    kind: theorem
    prominence: 2
    title: "Bolzano–Weierstrass Theorem"
    statement: >
      Every bounded sequence of real numbers has a convergent subsequence.
      Proof: first, every sequence has a monotone subsequence. Call $m$ a peak
      index if $a_m \ge a_n$ for all $n > m$. If there are infinitely many peak
      indices, the terms at them form a decreasing subsequence; if there are
      finitely many, then every index $m$ past the last of them fails to be a
      peak, so some $n > m$ has $a_n > a_m$, and iterating that choice from any
      starting point past the last peak produces an increasing subsequence. A
      monotone subsequence of a bounded sequence is itself bounded, so the
      Monotone Convergence Theorem applies to it. Boundedness is essential:
      $a_n = n$ has no convergent subsequence.
    summary: >
      Boundedness alone — no monotonicity, no pattern — is enough to extract a
      convergent piece from any sequence. This is the compactness of a closed
      bounded interval in sequential clothing.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-subsequence
      - analysis.sequences.mct
    relates:
      - id: analysis.svc.evt
        note: 'Both cash out the compactness of a closed bounded interval: the usual proof that a continuous function on $[a,b]$ attains its supremum takes a sequence whose values approach the supremum and extracts a convergent subsequence of arguments, which is exactly the extraction performed here.'
    tags: []

  - id: analysis.sequences.def-cauchy
    kind: definition
    prominence: 1
    title: "Cauchy sequence"
    statement: >
      A sequence $(a_n)$ is Cauchy if for every $\varepsilon > 0$ there exists
      $N \in \mathbb{N}$ such that $|a_n - a_m| < \varepsilon$ for all
      $n, m \ge N$. The definition differs from convergence in exactly one
      respect, and that difference is the point: it mentions no limit, only the
      terms themselves, so it can be tested on a sequence whose limit is unknown
      or not yet known to exist. It is genuinely stronger than the
      similar-looking condition $|a_{n+1} - a_n| \to 0$, which says only that
      consecutive terms close up and does not imply convergence —
      $a_n = \sqrt{n}$ satisfies it and is unbounded.
    summary: >
      The terms eventually get close to one another rather than to a nominated
      number, so the condition can be checked without knowing the answer.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-convergence
    relates: []
    tags: []

  - id: analysis.sequences.cauchy-criterion
    kind: theorem
    prominence: 2
    title: "Cauchy criterion and the completeness of ℝ"
    statement: >
      A sequence of real numbers converges if and only if it is Cauchy. The easy
      direction is the triangle inequality: if $a_n \to L$, pick $N$ with
      $|a_n - L| < \varepsilon/2$ for $n \ge N$, whence
      $|a_n - a_m| \le |a_n - L| + |L - a_m| < \varepsilon$ for $n, m \ge N$.
      Conversely, a Cauchy sequence is bounded — take $\varepsilon = 1$ and
      absorb the finitely many early terms — so Bolzano–Weierstrass supplies a
      subsequence $a_{n_k} \to L$; given $\varepsilon > 0$, combining
      $|a_n - a_m| < \varepsilon/2$ for large $n, m$ with a single $n_k$ large
      enough that $|a_{n_k} - L| < \varepsilon/2$ yields
      $|a_n - L| < \varepsilon$. It is this direction that fails over
      $\mathbb{Q}$, where the truncated decimal expansions of $\sqrt{2}$ are
      Cauchy with no rational limit. That $\mathbb{R}$ has no such gaps is the
      statement that $\mathbb{R}$ is complete. The criterion is not on its own
      the least-upper-bound axiom: it is equivalent to it in the presence of the
      Archimedean property, that no real number exceeds every natural number.
    summary: >
      A real sequence converges exactly when its own terms bunch together, so
      convergence can be established without naming the limit. This is
      completeness restated as a property of sequences.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-cauchy
      - analysis.sequences.bolzano-weierstrass
    relates: []
    tags: []

  - id: analysis.sequences.def-limsup-liminf
    kind: definition
    prominence: 1
    title: "Limit superior and limit inferior"
    statement: >
      Let $(a_n)$ be bounded and put $s_N = \sup\{a_n : n \ge N\}$ and
      $i_N = \inf\{a_n : n \ge N\}$. Discarding terms can only lower a supremum
      and raise an infimum, so $(s_N)$ is decreasing and bounded below and
      $(i_N)$ is increasing and bounded above; both converge by the Monotone
      Convergence Theorem, and one defines
      $\limsup_{n \to \infty} a_n = \lim_{N \to \infty} s_N$ and
      $\liminf_{n \to \infty} a_n = \lim_{N \to \infty} i_N$. For such a
      sequence always $\liminf a_n \le \limsup a_n$, with equality if and only
      if $(a_n)$ converges, in which case both equal $\lim a_n$. Each is
      attained as the limit of some subsequence, and they are respectively the
      largest and the smallest such subsequential limit. For unbounded sequences one works in
      $[-\infty, +\infty]$: if $(a_n)$ is not bounded above one sets
      $\limsup a_n = +\infty$, while if it is bounded above the $s_N$ are real
      and decreasing, and $\limsup a_n$ is their limit when they are bounded
      below and $-\infty$ when they are not. Symmetrically $\liminf a_n$ is
      $-\infty$ when $(a_n)$ is not bounded below, and otherwise the limit of
      the increasing $i_N$, or $+\infty$ when those are unbounded above. So both
      always exist in $[-\infty, +\infty]$, which is what lets the root test be
      stated with no hypothesis on $(a_n)$ at all.
    summary: >
      The eventual ceiling and eventual floor of a sequence, obtained as limits
      of the suprema and infima of its tails. They always exist, and for a
      bounded sequence they agree precisely when it converges.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.mct
      - analysis.sequences.def-subsequence
    relates: []
    tags: []

  - id: analysis.sequences.def-divergence-infinity
    kind: definition
    prominence: 0
    title: "Divergence to infinity"
    statement: >
      $(a_n)$ diverges to $+\infty$, written $a_n \to +\infty$, if for every
      $M \in \mathbb{R}$ there exists $N \in \mathbb{N}$ such that $a_n > M$ for
      all $n \ge N$; it diverges to $-\infty$ if $-a_n \to +\infty$. The shape
      copies the convergence definition with an arbitrary threshold $M$ in place
      of a tolerance $\varepsilon$ around a limit, but this is a species of
      divergence, not of convergence: no real number is approached, no such
      sequence is bounded above, and the notation
      $\lim_{n \to \infty} a_n = +\infty$ is an abbreviation rather than an
      assertion that a limit exists. A sequence with $a_n \le a_{n+1}$ for every
      $n$ that is not bounded above always diverges to $+\infty$, since once
      some term passes $M$ every later term does; but divergence in general is
      much less orderly — $(-1)^n$ diverges and tends to neither infinity.
    summary: >
      The terms eventually pass every threshold and stay past it: a specific,
      well-behaved way of failing to converge, and not the only one.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-convergence
      - analysis.sequences.def-bounded
    relates: []
    tags: []

  - id: analysis.sequences.def-series
    kind: definition
    prominence: 1
    title: "Infinite series and partial sums"
    statement: >
      Given a sequence $(a_n)_{n \ge 1}$, its sequence of partial sums is
      $s_N = \sum_{n=1}^{N} a_n$. The infinite series
      $\sum_{n=1}^{\infty} a_n$ converges if $(s_N)$ converges, and the same
      symbol then also denotes the sum $\lim_{N \to \infty} s_N$; otherwise the
      series diverges. A series is therefore not a new kind of limit but an
      ordinary sequence limit applied to the partial sums, and every result
      about sequences transfers through that reading. The starting index affects
      the sum but not whether the series converges, and neither does altering
      finitely many terms, since past the last altered term every partial sum
      moves by one and the same constant.
    summary: >
      An infinite sum means the limit of its finite truncations — nothing is
      added infinitely often, a sequence of ordinary finite sums is asked to
      converge.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-convergence
      - foundations.induction.def-finite-sum
    relates: []
    tags: []

  - id: analysis.sequences.series-linearity
    kind: proposition
    prominence: 0
    title: "Linearity of series"
    statement: >
      If $\sum_{n=1}^{\infty} a_n$ and $\sum_{n=1}^{\infty} b_n$ both converge
      and $c \in \mathbb{R}$, then $\sum_{n=1}^{\infty} (a_n + c\,b_n)$
      converges and equals
      $\sum_{n=1}^{\infty} a_n + c \sum_{n=1}^{\infty} b_n$. Proof: by linearity
      of finite sums the $N$-th partial sum of the combination is the
      corresponding combination of the two $N$-th partial sums, and the algebra
      of limits transfers that identity to the limits. Convergence of both
      series is a genuine hypothesis and not merely of their combination: with
      $a_n = 1$ and $b_n = -1$ the series $\sum (a_n + b_n)$ converges while
      neither $\sum a_n$ nor $\sum b_n$ does. Nothing comparable holds for
      products, since the partial sums of $\sum a_n b_n$ are not built from
      those of $\sum a_n$ and $\sum b_n$.
    summary: >
      Convergent series may be added term by term and rescaled, because their
      partial sums may be — but they may not be multiplied term by term.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-series
      - analysis.sequences.algebra-of-limits
    relates: []
    tags: []

  - id: analysis.sequences.nth-term-test
    kind: proposition
    prominence: 0
    title: "n-th term test for divergence"
    statement: >
      If $\sum_{n=1}^{\infty} a_n$ converges then $a_n \to 0$. Proof:
      $a_N = s_N - s_{N-1}$, and both $(s_N)$ and $(s_{N-1})$ tend to the sum
      $S$, so the difference tends to $S - S = 0$. The useful form is the
      contrapositive — if $(a_n)$ does not converge to $0$, the series diverges
      — which is the first check to run on any series: $\sum \frac{n}{n+1}$
      diverges because its terms tend to $1$. The converse is false, so the
      condition $a_n \to 0$ can never by itself establish convergence.
    summary: >
      The terms of a convergent series must die away, so a series whose terms
      do not is divergent on the spot — while terms that do tend to zero settle
      nothing at all.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-series
      - analysis.sequences.algebra-of-limits
    relates: []
    tags: []

  - id: analysis.sequences.geometric-series
    kind: proposition
    prominence: 1
    title: "Geometric series"
    statement: >
      For $r \ne 1$ the partial sums of $\sum_{n=0}^{\infty} r^n$ are
      $s_N = \sum_{n=0}^{N-1} r^n = \dfrac{1 - r^N}{1 - r}$. If $|r| < 1$ then
      $r^N \to 0$, so the series converges with
      $\sum_{n=0}^{\infty} r^n = \dfrac{1}{1 - r}$; more generally
      $\sum_{n=0}^{\infty} a r^n = \dfrac{a}{1 - r}$ and
      $\sum_{n=k}^{\infty} r^n = \dfrac{r^k}{1 - r}$. If $|r| \ge 1$ the terms
      do not tend to $0$ and the $n$-th term test gives divergence. This is
      essentially the only elementary family whose sum is available in closed
      form, which is why the ratio and root tests — both of which are
      comparisons against it — are the workhorse tests for series.
    summary: >
      The one infinite sum with a clean closed form, and the yardstick that the
      standard convergence tests are secretly measuring against.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.nth-term-test
    relates: []
    tags: []

  - id: analysis.sequences.comparison-test
    kind: theorem
    prominence: 1
    title: "Comparison test"
    statement: >
      The engine first: if $a_n \ge 0$ for every $n$ then the partial sums
      $(s_N)$ are increasing, so by the Monotone Convergence Theorem
      $\sum a_n$ converges if and only if $(s_N)$ is bounded above, and
      otherwise $(s_N)$ is unbounded. Comparison test: suppose
      $0 \le a_n \le b_n$ for every $n$, or for all sufficiently large $n$. If
      $\sum b_n$ converges then $\sum a_n$ converges, since the partial sums of
      $\sum a_n$ are bounded above by those of $\sum b_n$; contrapositively, if
      $\sum a_n$ diverges then so does $\sum b_n$. Limit comparison: if
      $a_n, b_n > 0$ and $a_n / b_n \to L$ with $0 < L < \infty$, the two series
      converge or diverge together, because the hypothesis eventually traps
      $a_n$ between two positive constant multiples of $b_n$. Nonnegativity is
      essential — without it the partial sums need not be monotone and the
      argument has nothing to hold on to.
    summary: >
      For nonnegative terms, convergence is exactly boundedness of the partial
      sums, so a term-by-term inequality against a series you already understand
      decides the one you do not.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-series
      - analysis.sequences.mct
    relates: []
    tags: []

  - id: analysis.sequences.def-absolute-convergence
    kind: definition
    prominence: 1
    title: "Absolute and conditional convergence"
    statement: >
      $\sum a_n$ converges absolutely if $\sum |a_n|$ converges. It converges
      conditionally if $\sum a_n$ converges but $\sum |a_n|$ does not — that is,
      if its convergence depends on cancellation between positive and negative
      terms rather than on the terms being small enough. Since $\sum |a_n|$ has
      nonnegative terms, absolute convergence is decidable by the machinery for
      nonnegative series, which is why most convergence tests in practice are
      tests for absolute convergence. The distinction is not bookkeeping:
      absolutely convergent series may be added, multiplied and reordered like
      finite sums, and conditionally convergent series may not.
    summary: >
      Convergence that survives replacing every term by its size, as against
      convergence that depends on the signs arranging themselves helpfully.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-series
    relates: []
    tags: []

  - id: analysis.sequences.abs-implies-convergent
    kind: theorem
    prominence: 1
    title: "Absolute convergence ⇒ convergence"
    statement: >
      If $\sum |a_n|$ converges then $\sum a_n$ converges, and
      $\left| \sum_{n=1}^{\infty} a_n \right| \le \sum_{n=1}^{\infty} |a_n|$.
      Proof: $0 \le a_n + |a_n| \le 2|a_n|$, so $\sum (a_n + |a_n|)$ converges
      by comparison with $\sum 2|a_n|$, and therefore
      $\sum a_n = \sum (a_n + |a_n|) - \sum |a_n|$ converges by linearity. The
      converse fails, conditional convergence being exactly the failure. The
      practical consequence is large: any test that establishes convergence of
      $\sum |a_n|$ thereby establishes convergence of $\sum a_n$, so tests
      designed for nonnegative series apply to series of arbitrary sign.
    summary: >
      If the sizes of the terms sum up, the signed series converges too — which
      is what lets the nonnegative-series tests be used on every series.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-absolute-convergence
      - analysis.sequences.comparison-test
      - analysis.sequences.series-linearity
    relates: []
    tags: []

  - id: analysis.sequences.ratio-test
    kind: theorem
    prominence: 1
    title: "Ratio test"
    statement: >
      Suppose $a_n \ne 0$ for all large $n$ and
      $\left| \dfrac{a_{n+1}}{a_n} \right| \to L$, allowing $L = +\infty$. If
      $L < 1$ then $\sum a_n$ converges absolutely; if $L > 1$ the terms
      eventually grow in absolute value, so they do not tend to $0$ and the
      series diverges; if $L = 1$ the test yields nothing. Proof of the first
      case: fix $r$ with $L < r < 1$ and $N$ with $|a_{n+1}| \le r|a_n|$ for
      $n \ge N$; then $|a_n| \le |a_N| r^{n - N}$ for $n \ge N$, and comparison
      with the convergent geometric series settles $\sum |a_n|$. The test is
      nothing but a comparison with a geometric series, which is precisely why
      $L = 1$ is out of its reach: $\sum \frac{1}{n}$ and
      $\sum \frac{1}{n^2}$ both have ratio limit $1$ and behave differently.
    summary: >
      If each term is eventually a fixed fraction of the one before, the series
      is dominated by a geometric series and converges absolutely.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.abs-implies-convergent
      - analysis.sequences.geometric-series
    relates: []
    tags: []

  - id: analysis.sequences.root-test
    kind: theorem
    prominence: 1
    title: "Root test"
    statement: >
      Let $L = \limsup_{n \to \infty} |a_n|^{1/n}$. If $L < 1$ then
      $\sum a_n$ converges absolutely; if $L > 1$ then $|a_n| \ge 1$ for
      infinitely many $n$, so the terms do not tend to $0$ and the series
      diverges; if $L = 1$ the test is inconclusive. Proof of the first case:
      choose $r$ with $L < r < 1$; by the definition of $\limsup$ there is $N$
      with $|a_n|^{1/n} < r$, that is $|a_n| < r^n$, for every $n \ge N$, and
      comparison with the geometric series $\sum r^n$ applies. Phrasing the
      hypothesis with $\limsup$ rather than $\lim$ costs nothing and makes the
      test strictly stronger than the ratio test: whenever the ratio test
      applies it returns the same $L$, but the root test also handles series
      whose ratios oscillate, such as the one with $a_n = 2^{-n}$ for even $n$
      and $a_n = 3^{-n}$ for odd $n$.
    summary: >
      If the $n$-th root of the $n$-th term stays eventually below some
      $r < 1$, the terms are dominated by $r^n$ and the series converges
      absolutely.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.abs-implies-convergent
      - analysis.sequences.geometric-series
      - analysis.sequences.def-limsup-liminf
    relates: []
    tags: []

  - id: analysis.sequences.integral-test
    kind: theorem
    prominence: 1
    title: "Integral test"
    statement: >
      Let $f : [1, \infty) \to \mathbb{R}$ be continuous, nonnegative and
      decreasing, and set $a_n = f(n)$. Then $\sum_{n=1}^{\infty} a_n$ converges
      if and only if the increasing sequence $I_N = \int_1^{N} f(x)\,dx$ is
      bounded above. Proof: each $I_N$ exists because $f$ is continuous on
      $[1,N]$, and monotonicity of $f$ gives
      $f(n+1) \le \int_n^{n+1} f(x)\,dx \le f(n)$ for every $n$; summing these
      over $n = 1, \ldots, N-1$ yields
      $\sum_{n=2}^{N} a_n \le I_N \le \sum_{n=1}^{N-1} a_n$. Both bounds are
      partial sums of a nonnegative series, so by the comparison test each side
      is bounded exactly when the other is. The same inequalities estimate the
      remainder after $N$ terms, which is how the test is used numerically.
    summary: >
      A decreasing positive function is compared with the rectangles that
      approximate it, so the series and the integral of that function stand or
      fall together.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.comparison-test
      - analysis.svc.cont-integrable
    relates: []
    tags: []

  - id: analysis.sequences.p-series
    kind: example
    prominence: 1
    title: "The harmonic series and the p-series"
    statement: >
      The harmonic series $\sum_{n=1}^{\infty} \frac{1}{n}$ diverges although
      its terms tend to $0$: grouping the terms into blocks of lengths
      $1, 1, 2, 4, 8, \ldots$, each block contributes at least $\frac{1}{2}$, so
      $s_{2^k} \ge 1 + \frac{k}{2}$ and the partial sums are unbounded. It is
      the standard witness that the converse of the $n$-th term test fails. More
      generally $\sum_{n=1}^{\infty} \frac{1}{n^p}$ converges if and only if
      $p > 1$. For $p \le 0$ the terms do not tend to $0$; for $p > 0$ the
      function $f(x) = x^{-p}$ is continuous, positive and decreasing on
      $[1, \infty)$, with $\int_1^N x^{-p}\,dx = \dfrac{N^{1-p} - 1}{1 - p}$ for
      $p \ne 1$ and $\ln N$ for $p = 1$, and these are bounded in $N$ exactly
      when $p > 1$. These series calibrate every comparison: $\sum 1/n^2$
      converges, $\sum 1/n$ and $\sum 1/\sqrt{n}$ diverge, and the boundary sits
      at $p = 1$ with the divergent side including it.
    summary: >
      The reference family against which other series are compared: the harmonic
      series diverges by the narrowest of margins, and $\sum n^{-p}$ converges
      exactly when $p$ exceeds $1$.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.integral-test
      - analysis.sequences.nth-term-test
      - analysis.svc.ftc-part-2
    relates: []
    tags: []

  - id: analysis.sequences.alternating-series-test
    kind: theorem
    prominence: 1
    title: "Alternating series test"
    statement: >
      Let $(b_n)$ satisfy $b_n \ge 0$, $b_{n+1} \le b_n$ for every $n$, and
      $b_n \to 0$. Then $\sum_{n=1}^{\infty} (-1)^{n+1} b_n$ converges. Proof:
      the even partial sums satisfy $s_2 \le s_4 \le \cdots$ and the odd ones
      $s_1 \ge s_3 \ge \cdots$, while $s_{2k} \le s_{2k+1} \le s_1$ and
      $s_{2k+1} \ge s_{2k} \ge s_2$, so each is monotone and bounded and
      converges by the Monotone Convergence Theorem; since
      $s_{2k+1} - s_{2k} = b_{2k+1} \to 0$ the two limits coincide, and the
      partial sums converge to that common value $S$. The argument also delivers
      the error bound $|S - s_N| \le b_{N+1}$, with $S$ lying between any two
      consecutive partial sums. Monotonicity of $(b_n)$ cannot be dropped: terms
      tending to $0$ with alternating signs but no monotone decrease need not
      give a convergent series.
    summary: >
      Alternating signs with terms shrinking monotonically to zero force
      convergence, and stopping the sum anywhere costs at most the first term
      you left out.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-series
      - analysis.sequences.mct
      - analysis.sequences.algebra-of-limits
    relates: []
    tags: []

  - id: analysis.sequences.riemann-rearrangement
    kind: theorem
    prominence: 1
    title: "Riemann rearrangement theorem"
    statement: >
      A rearrangement of $\sum a_n$ is the series $\sum a_{\sigma(n)}$ for a
      bijection $\sigma : \mathbb{N} \to \mathbb{N}$. If $\sum a_n$ converges
      absolutely, every rearrangement converges and to the same sum. If
      $\sum a_n$ converges conditionally, then for every $L \in \mathbb{R}$
      there is a rearrangement converging to $L$, and there are rearrangements
      whose partial sums are unbounded above, unbounded below, or oscillate
      without settling anywhere (stated without proof). The mechanism: in a
      conditionally convergent series the positive terms alone and the negative
      terms alone both have unbounded partial sums, while the individual terms
      tend to $0$ — so one takes positive terms until the running total first
      exceeds $L$, then negative terms until it first falls below, and repeats,
      the overshoot at each stage being at most one term. The canonical instance
      is the alternating harmonic series
      $\sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$, which converges by the
      alternating series test but not absolutely, its absolute values forming
      the divergent harmonic series.
    summary: >
      For a conditionally convergent series the order of summation determines
      the answer — reordering the terms can produce any value you like, so an
      infinite sum is not simply a very long finite one.
    parent: analysis.sequences
    also_under: []
    requires:
      - analysis.sequences.def-absolute-convergence
      - analysis.sequences.alternating-series-test
      - analysis.sequences.p-series
      - foundations.functions.def-bijective
    relates: []
    tags: []
