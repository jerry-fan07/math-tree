# number-theory.divisibility — Divisibility and Primes
# Divisibility and the division algorithm, gcd and the Euclidean algorithm,
# Bézout's identity and its consequences (coprimality, Euclid's lemma, lcm),
# primes and their infinitude, the fundamental theorem of arithmetic and what
# unique factorisation buys — divisor counting, gcd/lcm by exponents, primality
# testing by trial division and by sieving, and irrational square roots.

nodes:
  - id: number-theory.divisibility
    kind: subbranch
    title: "Divisibility and Primes"
    summary: >
      Division with remainder, gcd and the Euclidean algorithm, Bézout's
      identity, and the fundamental theorem of arithmetic.
    parent: number-theory
    also_under: []
    tags: []

  - id: number-theory.divisibility.def-divisibility
    kind: definition
    prominence: 1
    title: "Divisibility"
    statement: >
      Let $a, b \in \mathbb{Z}$. Then $a$ divides $b$, written $a \mid b$, if
      there exists an integer $c$ with $b = ac$; equivalently $a$ is a divisor
      or factor of $b$, and $b$ is a multiple of $a$. The negation is written
      $a \nmid b$. The definition performs no division: it asserts the
      existence of an integer $c$, and never mentions the quotient $b/a$,
      which is why it applies verbatim when $a = 0$. Immediate consequences of
      the form of the definition: $1 \mid b$ and $a \mid 0$ for every integer (so
      $0 \mid 0$), while $0 \mid b$ only when $b = 0$; and signs are invisible
      to it, $a \mid b$ holding exactly when $-a \mid b$, when $a \mid -b$ and
      when $|a| \mid |b|$. Divisibility is a statement about a pair of
      integers, not an operation on them.
    summary: >
      One integer divides another when the second is an exact integer multiple
      of the first — an existence claim about a third integer, not a division
      that has to come out even.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - foundations.logic.quantifier-existential
    relates: []
    tags: []

  - id: number-theory.divisibility.divisibility-properties
    kind: proposition
    prominence: 1
    title: "Basic properties of divisibility"
    statement: >
      Let $a, b, c, d, x, y$ be integers. (i) Reflexivity and transitivity:
      $a \mid a$, and if $d \mid a$ and $a \mid b$ then $d \mid b$ — from
      $a = ds$ and $b = at$ we get $b = d(st)$. (ii) Linearity: if $d \mid a$
      and $d \mid b$ then $d \mid ax + by$ for all $x, y$ — from $a = ds$,
      $b = dt$ we get $ax + by = d(sx + ty)$. In particular $d$ divides
      $a + b$, $a - b$ and $ca$. (iii) Size bound: if $a \mid b$ and
      $b \ne 0$ then $|a| \le |b|$, since $b = ac$ with $c \ne 0$ forces
      $|c| \ge 1$. Hence a nonzero integer has only finitely many divisors,
      all lying in $[-|b|, |b|]$. (iv) Antisymmetry: if $a \mid b$ and
      $b \mid a$ then $a = \pm b$; if in addition both are positive then
      $a = b$. (v) Cancellation: $a \mid b$ implies $ac \mid bc$, and
      conversely $ac \mid bc$ implies $a \mid b$ provided $c \ne 0$.
    summary: >
      The handful of facts every later argument runs on: divisibility chains,
      it survives taking integer combinations, and a nonzero multiple is never
      smaller than its divisor.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-divisibility
    relates: []
    tags: []

  - id: number-theory.divisibility.division-algorithm
    kind: theorem
    prominence: 2
    title: "Division algorithm"
    statement: >
      Let $a, b \in \mathbb{Z}$ with $b \ne 0$. Then there exist unique
      integers $q$ (the quotient) and $r$ (the remainder) with
      $a = bq + r$ and $0 \le r < |b|$. Existence, for $b > 0$: the set
      $S = \{a - bq : q \in \mathbb{Z}\} \cap \{s : s \ge 0\}$ is nonempty,
      since $q = -|a|$ gives $a + b|a| \ge a + |a| \ge 0$, so by well-ordering
      $S$ has a least element $r = a - bq$; if $r \ge b$ then
      $r - b = a - b(q+1)$ would be a smaller member of $S$, so $0 \le r < b$.
      Uniqueness: if $bq_1 + r_1 = bq_2 + r_2$ with both remainders in
      $[0, b)$, then $b(q_1 - q_2) = r_2 - r_1$ is a multiple of $b$ of
      absolute value less than $b$, hence $0$, giving $r_1 = r_2$ and
      $q_1 = q_2$. For $b < 0$ apply the result to $|b|$. Note that
      $r = 0$ holds exactly when $b \mid a$, so the remainder measures the
      failure of divisibility. The traditional name is a misnomer: this is an
      existence-and-uniqueness theorem, not an algorithm.
    summary: >
      Dividing one integer by a nonzero one leaves a quotient and a remainder
      smaller than the divisor, and there is exactly one such pair — the fact
      that makes remainders well defined at all.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-divisibility
      - foundations.induction.well-ordering
    relates: []
    tags: []

  - id: number-theory.divisibility.def-gcd
    kind: definition
    prominence: 1
    title: "Greatest common divisor"
    statement: >
      Let $a, b$ be integers, not both zero. The set of common divisors of $a$
      and $b$ is nonempty (it contains $1$) and finite (a divisor of the
      nonzero one among $a, b$ has absolute value at most $\max(|a|, |b|)$),
      so it has a largest element: the greatest common divisor
      $\gcd(a,b)$, a positive integer with $1 \le \gcd(a,b) \le
      \max(|a|,|b|)$. Immediately from the definition:
      $\gcd(a,b) = \gcd(b,a) = \gcd(|a|,|b|)$, $\gcd(a,0) = |a|$ for
      $a \ne 0$, and $\gcd(a,a) = |a|$. The remaining case is fixed by the
      convention $\gcd(0,0) = 0$. A stronger characterisation — that every
      common divisor not merely is no larger than $\gcd(a,b)$ but actually
      divides it — is not part of this definition and is not obvious from it;
      it is a consequence of Bézout's identity.
    summary: >
      The largest integer dividing both of two integers. It exists for the
      cheap reason that there are only finitely many candidates and at least
      one of them.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.divisibility-properties
    relates: []
    tags: []

  - id: number-theory.divisibility.bezout
    kind: theorem
    prominence: 2
    title: "Bézout's identity"
    statement: >
      Let $a, b$ be integers, not both zero, and let $d = \gcd(a,b)$. Then
      there exist integers $x, y$ with $ax + by = d$. Moreover $d$ is the
      least positive integer representable in the form $ax + by$, and the set
      of all such values is exactly the set of multiples of $d$. Proof: the
      set $S$ of positive integers of the form $ax + by$ is nonempty, since
      $a \cdot a + b \cdot b = a^2 + b^2 > 0$ lies in it, so by well-ordering
      it has a least element $e = ax_0 + by_0$. Divide: $a = eq + r$ with
      $0 \le r < e$; then $r = a - eq = a(1 - qx_0) + b(-qy_0)$ has the same
      form, so minimality of $e$ forces $r = 0$ and $e \mid a$, and likewise
      $e \mid b$. Thus $e$ is a common divisor, so $e \le d$; and since
      $d \mid a$ and $d \mid b$, $d$ divides the combination
      $ax_0 + by_0 = e$, so $d \le e$. Hence $e = d$. The coefficients are
      never unique: $(x + kb/d,\, y - ka/d)$ works for every integer $k$. The
      proof is an existence argument and produces no coefficients; the
      extended Euclidean algorithm does.
    summary: >
      The gcd of two integers is not just their largest common divisor but an
      integer combination of them — the single fact from which most of
      elementary number theory follows.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-gcd
      - number-theory.divisibility.division-algorithm
    relates: []
    tags: []

  - id: number-theory.divisibility.common-divisors-divide-gcd
    kind: corollary
    prominence: 1
    title: "Every common divisor divides the gcd"
    statement: >
      Let $a, b$ be integers, not both zero, and $d = \gcd(a,b)$. If
      $c \mid a$ and $c \mid b$ then $c \mid d$. Proof: write $d = ax + by$ by
      Bézout; $c$ divides both terms, hence the sum. Consequently $d$ is
      characterised without any reference to size: it is the unique positive
      common divisor of $a$ and $b$ that every common divisor divides —
      unique because two such divide each other and are positive. Two
      standard corollaries: $\gcd(ka, kb) = |k| \gcd(a,b)$ for $k \ne 0$, and
      $\gcd(a/d,\, b/d) = 1$, which is exactly what putting a fraction in
      lowest terms achieves. This divisibility formulation, not the largest-element
      one, is the definition that survives into rings where "greatest" has no
      meaning.
    summary: >
      The gcd absorbs every common divisor rather than merely outranking it,
      which turns the gcd from a maximum into a universal object.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.bezout
    relates: []
    tags: []

  - id: number-theory.divisibility.gcd-remainder
    kind: lemma
    prominence: 0
    title: "gcd(a, b) = gcd(b, r)"
    statement: >
      Let $a = bq + r$ with $b, r$ not both zero. Then
      $\gcd(a,b) = \gcd(b,r)$. Proof: the two pairs have exactly the same
      common divisors. If $c \mid b$ and $c \mid r$ then $c \mid bq + r = a$;
      if $c \mid a$ and $c \mid b$ then $c \mid a - bq = r$. Identical sets of
      common divisors have identical greatest elements. Applied with $r$ the
      remainder supplied by the division algorithm, this reads
      $\gcd(a,b) = \gcd(b,\, a \bmod b)$, and it strictly shrinks the problem
      because $0 \le r < |b|$. Together with $\gcd(d, 0) = |d|$ it is the
      whole content of the Euclidean algorithm.
    summary: >
      Replacing a number by its remainder on division by the other does not
      change the gcd — one step of a reduction that has to terminate.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-gcd
      - number-theory.divisibility.division-algorithm
    relates: []
    tags: []

  - id: number-theory.divisibility.euclidean-algorithm
    kind: technique
    prominence: 1
    title: "Euclidean algorithm"
    statement: >
      To compute $\gcd(a,b)$ for integers not both zero: replace the pair
      $(a,b)$ by $(b,\, a \bmod b)$ and repeat until the second entry is $0$;
      the first entry is then $\gcd(a,b)$ up to sign, and its absolute value
      is the gcd. Termination: the successive remainders are nonnegative and
      strictly decreasing, so the process stops after finitely many steps.
      Correctness: each step preserves the gcd by the remainder lemma, and the
      final pair $(d, 0)$ has $\gcd(d,0) = |d|$. Worked example:
      $1071 = 2 \cdot 462 + 147$, $462 = 3 \cdot 147 + 21$,
      $147 = 7 \cdot 21 + 0$, so $\gcd(1071, 462) = 21$. The step count is
      $O(\log \min(|a|,|b|))$ — Lamé's theorem bounds it by five times the
      number of decimal digits of the smaller input, the worst case being
      consecutive Fibonacci numbers. The practical point is that this computes
      gcds without factorising either number, which matters because
      factorisation is enormously harder.
    summary: >
      Repeated division with remainder drives a pair of integers down to
      $(\gcd, 0)$ in a logarithmic number of steps, with no factorisation
      anywhere in sight.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.gcd-remainder
    relates: []
    tags: []

  - id: number-theory.divisibility.extended-euclidean
    kind: technique
    prominence: 1
    title: "Extended Euclidean algorithm"
    statement: >
      The Euclidean algorithm run with bookkeeping produces the Bézout
      coefficients, making the identity constructive. Back-substitution: solve
      the last nontrivial division equation for its remainder and substitute
      the earlier equations upward one at a time. Continuing the example
      above, $21 = 462 - 3 \cdot 147$ and $147 = 1071 - 2 \cdot 462$, so
      $21 = 462 - 3(1071 - 2 \cdot 462) = 7 \cdot 462 - 3 \cdot 1071$.
      Forward form, done in one pass: maintain with each remainder $r_i$ a
      pair $(x_i, y_i)$ satisfying $r_i = a x_i + b y_i$, starting from
      $r_{-1} = a$ with $(1,0)$ and $r_0 = b$ with $(0,1)$, and on the step
      $r_{i+1} = r_{i-1} - q_{i+1} r_i$ update
      $x_{i+1} = x_{i-1} - q_{i+1} x_i$ and
      $y_{i+1} = y_{i-1} - q_{i+1} y_i$. When the algorithm halts, the last
      nonzero remainder carries a representation of $\gcd(a,b)$. This is how
      modular inverses are computed: solving $ax \equiv 1$ modulo $m$ is
      solving $ax + my = 1$.
    summary: >
      Bookkeeping alongside the Euclidean algorithm turns the existence
      statement of Bézout into an explicit pair of coefficients.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.euclidean-algorithm
      - number-theory.divisibility.bezout
    relates: []
    tags: []

  - id: number-theory.divisibility.def-coprime
    kind: definition
    prominence: 1
    title: "Coprime integers"
    statement: >
      Integers $a$ and $b$, not both zero, are coprime (relatively prime) if
      $\gcd(a,b) = 1$, that is, if no integer other than $\pm 1$ divides both.
      Coprimality is a property of the pair, not of either number: $9$ and
      $10$ are coprime although neither is prime, and $2$ and $4$ are not
      although $2$ is prime. Every integer is coprime to $1$; $0$ is coprime
      only to $\pm 1$; consecutive integers $n$ and $n+1$ are always coprime,
      since a common divisor divides their difference. A list
      $a_1, \ldots, a_n$ is pairwise coprime if $\gcd(a_i, a_j) = 1$ whenever
      $i \ne j$, which is strictly stronger than the whole list having gcd
      $1$: $6, 10, 15$ have overall gcd $1$ and no two of them are coprime.
    summary: >
      Two integers are coprime when they share no factor beyond the
      unavoidable $\pm 1$ — the condition that a fraction is in lowest terms.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-gcd
    relates: []
    tags: []

  - id: number-theory.divisibility.coprimality-criterion
    kind: corollary
    prominence: 0
    title: "Coprime ⇔ ax + by = 1 solvable"
    statement: >
      Integers $a, b$, not both zero, are coprime if and only if there exist
      integers $x, y$ with $ax + by = 1$. Forward: this is Bézout's identity
      with $d = 1$. Converse: given such $x, y$, any common divisor of $a$ and
      $b$ divides $ax + by = 1$ and is therefore $\pm 1$, so the gcd is $1$;
      note this direction needs no theory at all. The criterion is the
      workhorse of the subject because it converts a statement about divisors
      — a quantified claim that is awkward to use — into a single equation
      that can be multiplied through by anything. The value $1$ is what makes
      it an equivalence: in general $ax + by = m$ has integer solutions
      exactly when $\gcd(a,b) \mid m$.
    summary: >
      Sharing no common factor is the same as being able to combine the two
      numbers to make exactly $1$ — the usable form of coprimality.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.bezout
      - number-theory.divisibility.def-coprime
    relates: []
    tags: []

  - id: number-theory.divisibility.coprime-divides
    kind: proposition
    prominence: 1
    title: "Coprime divisor of a product"
    statement: >
      If $a \mid bc$ and $\gcd(a,b) = 1$, then $a \mid c$. Proof: write
      $ax + by = 1$ and multiply by $c$ to get $acx + bcy = c$. Now $a \mid ac$
      trivially and $a \mid bc$ by hypothesis, so $a$ divides the combination
      $acx + bcy$, which is $c$. The coprimality hypothesis carries the
      argument and cannot be dropped: $4 \mid 2 \cdot 6$ while $4$ divides
      neither $2$ nor $6$. Two standard companions, proved the same way: if
      $a \mid c$ and $b \mid c$ with $\gcd(a,b) = 1$ then $ab \mid c$; and if
      $\gcd(a,b) = \gcd(a,c) = 1$ then $\gcd(a, bc) = 1$.
    summary: >
      A divisor of a product that shares nothing with one factor must already
      divide the other — the general fact of which Euclid's lemma is the prime
      case.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.coprimality-criterion
    relates: []
    tags: []

  - id: number-theory.divisibility.def-lcm
    kind: definition
    prominence: 1
    title: "Least common multiple"
    statement: >
      Let $a, b$ be nonzero integers. The set of positive common multiples of
      $a$ and $b$ is nonempty, since it contains $|ab|$, so by well-ordering
      it has a least element: the least common multiple $\lcm(a,b)$, a
      positive integer. From the definition, $\lcm(a,b) = \lcm(b,a) =
      \lcm(|a|,|b|)$, $\lcm(a,a) = |a|$, and $\lcm(a,b) = |b|$ exactly when
      $a \mid b$; the convention $\lcm(a, 0) = 0$ completes the definition.
      As with the gcd, the definition only says least, and the stronger
      statement — that every common multiple is an integer multiple of
      $\lcm(a,b)$ — is not part of it: that needs the division algorithm and
      is proved separately.
    summary: >
      The smallest positive number that both integers divide; it exists
      because $|ab|$ is one candidate and any nonempty set of positive
      integers has a smallest member.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-divisibility
      - foundations.induction.well-ordering
    relates: []
    tags: []

  - id: number-theory.divisibility.lcm-divides-common-multiples
    kind: proposition
    prominence: 1
    title: "Every common multiple is a multiple of the lcm"
    statement: >
      Let $a, b$ be nonzero integers and $\ell = \lcm(a,b)$. If $a \mid m$ and
      $b \mid m$ then $\ell \mid m$. Proof: divide, $m = \ell q + r$ with
      $0 \le r < \ell$; then $r = m - \ell q$ is again a common multiple of
      $a$ and $b$, and it is nonnegative and smaller than the least positive
      common multiple, so $r = 0$. Consequently $\ell$ is characterised
      without any reference to size: it is the unique positive common multiple
      of $a$ and $b$ that divides every common multiple. This is the exact
      mirror of "every common divisor divides the gcd", and it is what turns
      the lcm from a minimum into a universal object.
    summary: >
      The lcm does not merely undercut the other common multiples, it divides
      all of them — the fact that makes "least" mean least in the divisibility
      order rather than least in size.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-lcm
      - number-theory.divisibility.division-algorithm
    relates: []
    tags: []

  - id: number-theory.divisibility.gcd-lcm-product
    kind: theorem
    prominence: 1
    title: "gcd · lcm = |ab|"
    statement: >
      Let $a, b$ be nonzero integers, and write $\ell = \lcm(a,b)$,
      $d = \gcd(a,b)$. Then $d \cdot \ell = |ab|$. Proof, taking $a, b > 0$
      without loss of generality: write $a = da'$ and
      $b = db'$, where $\gcd(a',b') = 1$. Then $da'b' = ab/d$ is a common
      multiple of $a$ and $b$. Conversely if $m > 0$ is a common multiple,
      write $m = ak = da'k$; from $b \mid m$, that is $db' \mid da'k$, we get
      $b' \mid a'k$, and coprimality of $a'$ and $b'$ gives $b' \mid k$, so
      $da'b' \mid m$. Hence $\ell = ab/d$. Two consequences: the lcm is
      computed through the gcd, so through the Euclidean algorithm rather than
      through factorisation; and $\lcm(a,b) = |ab|$ exactly when $a$ and $b$
      are coprime. The formula does not survive to three arguments —
      $a = b = c = 2$ gives $\gcd \cdot \lcm = 4 \ne 8$.
    summary: >
      The gcd and the lcm split the product between them: what one leaves out
      the other takes in, so knowing either gives the other for free.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-lcm
      - number-theory.divisibility.coprime-divides
      - number-theory.divisibility.common-divisors-divide-gcd
    relates: []
    tags: []

  - id: number-theory.divisibility.intuition-divisibility-order
    kind: intuition
    prominence: 0
    title: "Divisibility as an order, gcd and lcm as meet and join"
    statement: >
      On the positive integers, $\mid$ is a partial order: reflexive and
      transitive, and antisymmetric because mutual divisibility between
      positives forces equality. It is not a total order — neither of $2$ and
      $3$ divides the other — so the picture to keep is a branching
      Hasse diagram rather than a line. In this order, $\gcd(a,b)$ is the
      greatest lower bound of $\{a,b\}$ and $\lcm(a,b)$ the least upper bound,
      which is exactly the content of "every common divisor divides the gcd"
      and "every common multiple is a multiple of the lcm"; both always exist,
      so the positive integers under divisibility form a lattice, with $1$ as
      least element and, if $0$ is adjoined, $0$ as greatest, since everything
      divides $0$. This explains a piece of terminology that otherwise looks
      like an accident: the "greatest" in greatest common divisor means
      greatest in the divisibility order, and only coincides with greatest in
      size because a positive divisor is never larger than what it divides.
      The divisibility reading is the one that generalises — in a polynomial
      ring or a general integral domain nothing is bigger than anything, but
      the lattice statement still makes sense.
    summary: >
      Divisibility orders the integers in a branching hierarchy rather than a
      line, and gcd and lcm are the meet and join in that hierarchy — which is
      what "greatest" was always meant to mean.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.common-divisors-divide-gcd
      - number-theory.divisibility.lcm-divides-common-multiples
      - foundations.relations.def-lub-poset
    relates: []
    tags: []

  - id: number-theory.divisibility.def-prime
    kind: definition
    prominence: 1
    title: "Prime and composite"
    statement: >
      An integer $p \ge 2$ is prime if its only positive divisors are $1$ and
      $p$. An integer $n \ge 2$ that is not prime is composite, which by the
      definition means $n = ab$ for some integers with $1 < a < n$ and
      $1 < b < n$. The first primes are $2, 3, 5, 7, 11, 13, 17, 19$, and $2$
      is the only even one. The number $1$ is deliberately excluded from both
      classes: it is a unit, dividing everything, and calling it prime would
      destroy uniqueness of factorisation by allowing arbitrarily many copies
      of it in any product. Negative integers are handled by declaring $p$
      prime when $|p|$ is, or more usually by restricting attention to
      $p \ge 2$. What this definition says is that $p$ is irreducible — it
      admits no factorisation into two smaller positive factors. The
      apparently different property that $p$ dividing a product forces it to
      divide a factor is Euclid's lemma, and their equivalence is a theorem,
      not a restatement.
    summary: >
      A prime is an integer above $1$ with no factorisation except the trivial
      one; everything else above $1$ is composite, and $1$ itself is neither.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-divisibility
    relates: []
    tags: []

  - id: number-theory.divisibility.prime-divisor-exists
    kind: lemma
    prominence: 0
    title: "Every n ≥ 2 has a prime divisor"
    statement: >
      Every integer $n \ge 2$ has a prime divisor; in fact the least divisor
      of $n$ exceeding $1$ is prime. Proof: the set of divisors of $n$ greater
      than $1$ is a nonempty set of positive integers, since it contains $n$,
      so by well-ordering it has a least element $p$. If $p$ were composite
      then $p = ab$ with $1 < a < p$, and $a \mid p$ together with $p \mid n$
      would make $a$ a divisor of $n$ greater than $1$ and smaller than $p$,
      contradicting minimality. So $p$ is prime.
    summary: >
      Descend to the smallest nontrivial factor and it cannot factor further —
      the smallest step of the argument that every integer breaks into primes.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-prime
      - number-theory.divisibility.divisibility-properties
      - foundations.induction.well-ordering
    relates: []
    tags: []

  - id: number-theory.divisibility.infinitude-primes
    kind: theorem
    prominence: 1
    title: "There are infinitely many primes"
    statement: >
      No finite list of primes contains them all. Proof (Euclid): let
      $p_1, \ldots, p_n$ be any finite list of primes and set
      $N = p_1 p_2 \cdots p_n + 1$. Since $N \ge 2$ it has a prime divisor
      $q$. If $q$ were some $p_i$, then $q$ would divide both $N$ and the
      product $p_1 \cdots p_n$, hence their difference $1$, which no prime
      does. So $q$ is a prime outside the list, and the list was not complete.
      The argument is constructive — it manufactures a new prime from any
      finite collection — and it does not claim that $N$ is prime:
      $2 \cdot 3 \cdot 5 \cdot 7 \cdot 11 \cdot 13 + 1 = 30031 = 59 \cdot 509$.
      Far more is true and far harder: the sum $\sum 1/p$ over primes
      diverges, and the number of primes up to $x$ is asymptotically
      $x / \ln x$.
    summary: >
      Multiply any finite set of primes together and add one, and the result
      must have a prime factor nobody listed — so no list can be complete.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.prime-divisor-exists
    relates:
      - id: foundations.proof.ex-infinitude-primes
        note: 'The same construction, taken there as a case study in what a constructive existence proof looks like and in how often a needless contradiction is wrapped around one.'
    tags: []

  - id: number-theory.divisibility.euclid-lemma
    kind: lemma
    prominence: 1
    title: "Euclid's lemma"
    statement: >
      If $p$ is prime and $p \mid ab$, then $p \mid a$ or $p \mid b$. Proof:
      suppose $p \nmid a$. The only positive divisors of $p$ are $1$ and $p$,
      so $\gcd(p,a)$ is $1$ or $p$; it is not $p$, since $p \nmid a$; hence
      $\gcd(p,a) = 1$ and the coprime divisor proposition gives $p \mid b$. An
      induction on the number of factors extends this to any finite product:
      if $p \mid a_1 a_2 \cdots a_n$ then $p \mid a_i$ for some $i$, and in
      particular a prime dividing a product of primes is equal to one of them.
      Primality is essential — $6 \mid 4 \cdot 9$ while $6$ divides neither
      factor. The lemma is the bridge between the two possible meanings of
      "prime": irreducibility, which is the definition, and this
      product-splitting property, which is what uniqueness of factorisation
      actually needs. In rings where the bridge collapses, so does unique
      factorisation — in $\mathbb{Z}[\sqrt{-5}]$, the number $6$ factors both
      as $2 \cdot 3$ and as $(1 + \sqrt{-5})(1 - \sqrt{-5})$ with all four
      factors irreducible.
    summary: >
      A prime cannot be split across a product: if it divides a product it
      divides one of the factors. This is the property, not irreducibility,
      that makes factorisations unique.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.def-prime
      - number-theory.divisibility.coprime-divides
      - foundations.induction.induction-principle
    relates: []
    tags: []

  - id: number-theory.divisibility.fta
    kind: theorem
    prominence: 2
    title: "Fundamental theorem of arithmetic"
    statement: >
      Every integer $n \ge 2$ is a product of primes,
      $n = p_1 p_2 \cdots p_k$ with $k \ge 1$, and the factorisation is unique
      up to the order of the factors: if
      $p_1 \cdots p_k = q_1 \cdots q_l$ with all $p_i$ and $q_j$ prime, then
      $k = l$ and the $q_j$ are a rearrangement of the $p_i$. Existence is the
      strong-induction argument: a composite splits into two smaller factors,
      each already a product of primes. Uniqueness is where primality does
      real work: $p_1$ divides $q_1 \cdots q_l$, so by Euclid's lemma
      $p_1 = q_j$ for some $j$; cancel that pair and apply the inductive
      hypothesis to the smaller product. The two halves are of quite different
      depth, and it is worth seeing that uniqueness can fail while existence
      holds: in the multiplicatively closed set $\{1, 4, 7, 10, 13, \ldots\}$
      of positive integers of the form $3k+1$, the numbers $4$, $10$ and $25$
      have no nontrivial factorisation inside the set, yet
      $100 = 4 \cdot 25 = 10 \cdot 10$. The convention that $1$ is the empty
      product and is not prime is what lets the statement be phrased cleanly.
    summary: >
      Every integer above $1$ has a prime factorisation, and only one — the
      structural fact that lets any question about integers be pushed down to
      questions about primes.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - foundations.induction.ex-prime-factorization
      - number-theory.divisibility.euclid-lemma
    relates: []
    tags: []

  - id: number-theory.divisibility.canonical-factorization
    kind: definition
    prominence: 1
    title: "Canonical factorisation and p-adic valuation"
    statement: >
      Collecting equal factors in the prime factorisation of $n \ge 2$ gives
      its canonical form $n = p_1^{e_1} p_2^{e_2} \cdots p_k^{e_k}$ with
      $p_1 < p_2 < \cdots < p_k$ prime and each $e_i \ge 1$, unique by the
      fundamental theorem. Equivalently, for a prime $p$ and $n \ge 1$ define
      the $p$-adic valuation $v_p(n)$ to be the largest $e$ with
      $p^e \mid n$; then $n = \prod_p p^{v_p(n)}$ over all primes, with all
      but finitely many exponents zero, and
      $v_p(mn) = v_p(m) + v_p(n)$. Divisibility becomes a comparison of
      exponents: for $d, n \ge 1$, $d \mid n$ if and only if
      $v_p(d) \le v_p(n)$ for every prime $p$. Two immediate readings: $n$ has
      exactly $(e_1 + 1)(e_2 + 1) \cdots (e_k + 1)$ positive divisors, and $n$
      is a perfect square precisely when every $v_p(n)$ is even.
    summary: >
      Written with exponents, an integer becomes its list of prime exponents,
      and dividing becomes comparing those lists coordinate by coordinate.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.fta
    relates: []
    tags: []

  - id: number-theory.divisibility.gcd-lcm-from-factorization
    kind: proposition
    prominence: 1
    title: "gcd and lcm from prime exponents"
    statement: >
      For positive integers $a$ and $b$,
      $\gcd(a,b) = \prod_p p^{\min(v_p(a),\, v_p(b))}$ and
      $\lcm(a,b) = \prod_p p^{\max(v_p(a),\, v_p(b))}$, both products having
      only finitely many factors different from $1$. Proof: by the exponent
      criterion for divisibility, an integer $d \ge 1$ divides both $a$ and
      $b$ exactly when $v_p(d) \le \min(v_p(a), v_p(b))$ for every $p$, and
      the largest such $d$ is the one attaining the bound; the argument for
      multiples is dual. Since $\min(s,t) + \max(s,t) = s + t$, the exponents
      of $\gcd(a,b) \cdot \lcm(a,b)$ and of $ab$ agree at every prime, which
      re-proves the product formula. Coprimality reads off as sharing no
      prime. The caveat is practical: this describes the gcd, it does not
      compute it, because obtaining the factorisations is vastly more
      expensive than the Euclidean algorithm. The formulas are a proof tool,
      not an algorithm.
    summary: >
      Unique factorisation turns gcd and lcm into taking the smaller and the
      larger exponent at each prime — the clearest description of them, and
      the least practical.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.canonical-factorization
      - number-theory.divisibility.def-lcm
    relates: []
    tags: []

  - id: number-theory.divisibility.sqrt-bound
    kind: proposition
    prominence: 0
    title: "A composite has a prime factor ≤ √n"
    statement: >
      If $n \ge 2$ is composite then $n$ has a prime divisor $p$ with
      $p \le \sqrt{n}$. Proof: write $n = ab$ with $1 < a \le b < n$, ordering
      the factors so that $a$ is the smaller. Then $a^2 \le ab = n$, so
      $a \le \sqrt{n}$; and a prime divisor $p$ of $a$ satisfies $p \le a$ and,
      by transitivity of divisibility, $p \mid n$. Read the other way round,
      this is a primality test: if no prime $p \le \sqrt{n}$ divides $n$, then
      $n$ is prime. The saving is the point — the candidate divisors to
      examine drop from roughly $n$ of them to roughly $\sqrt{n}$.
    summary: >
      A number that factors must factor with something small, so only
      divisors up to the square root need ever be checked.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.prime-divisor-exists
    relates: []
    tags: []

  - id: number-theory.divisibility.trial-division
    kind: technique
    prominence: 1
    title: "Trial division"
    statement: >
      To decide whether a given $n \ge 2$ is prime, test the candidate
      divisors $d = 2, 3, 4, \ldots, \lfloor \sqrt{n} \rfloor$ in turn —
      dividing with remainder and asking whether the remainder is $0$. If some
      $d$ divides $n$, then $n$ is composite; if none does, the square-root
      bound says $n$ is prime. Only primes $d$ need be tried, since a
      composite $d$ carries a smaller prime divisor already tested; in
      practice one tries $2$ and then the odd numbers, or the primes from a
      precomputed table. Dividing out each factor as it is found and recursing
      on the quotient turns the test into a full factorisation routine. The
      cost is about $\sqrt{n}$ divisions, which is exponential in the number
      of digits of $n$: comfortable up to around $10^{12}$, hopeless for the
      hundreds-of-digits integers of cryptography, where probabilistic tests
      such as Miller-Rabin are used instead. That multiplying is easy while
      factoring appears hard is the asymmetry public-key cryptography is
      built on.
    summary: >
      The direct primality test: divide by everything up to the square root
      and see whether anything goes in evenly — correct, simple, and far too
      slow for large inputs.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.sqrt-bound
      - number-theory.divisibility.division-algorithm
    relates: []
    tags: []

  - id: number-theory.divisibility.sieve-eratosthenes
    kind: technique
    prominence: 1
    title: "Sieve of Eratosthenes"
    statement: >
      To list every prime up to $N$: write down $2, 3, \ldots, N$ unmarked,
      then sweep $p = 2, 3, 4, \ldots$ upward in turn. If $p$ is still
      unmarked when it is reached, it has no divisor strictly between $1$ and
      itself, so it is prime: mark all of $p^2, p^2 + p, p^2 + 2p, \ldots$ up
      to $N$. If $p$ is already marked, skip it. Stop once $p > \sqrt{N}$.
      Marking may start at $p^2$ rather than $2p$ because any smaller multiple
      of $p$ has a prime factor less than $p$ and was marked already, and the
      procedure may stop at $\sqrt{N}$ because by the square-root bound every
      composite $n \le N$ has been marked by then. What remains unmarked is
      exactly the set of primes up to $N$. The sieve performs no divisions at
      all, only repeated addition, and costs about $N \log \log N$ operations
      and $N$ units of memory. Compare with trial division: to tabulate all
      primes below $N$ the sieve is dramatically the better tool, while to
      settle a single large $n$ it is useless, since it would have to build
      the whole table first.
    summary: >
      Cross out the multiples of each prime in turn and whatever survives is
      prime — a way of finding all the primes in a range without testing any
      of them individually.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.sqrt-bound
    relates: []
    tags: []

  - id: number-theory.divisibility.sqrt-irrational
    kind: theorem
    prominence: 1
    title: "√n is irrational unless n is a perfect square"
    statement: >
      Let $n$ be a positive integer that is not the square of an integer. Then
      no rational number has square $n$; that is, $\sqrt{n}$ is irrational.
      Proof: suppose $n = (a/b)^2$ with $a, b$ positive integers, so that
      $n b^2 = a^2$. Comparing $p$-adic valuations of the two sides gives
      $v_p(n) + 2 v_p(b) = 2 v_p(a)$ for every prime $p$, so every $v_p(n)$ is
      even, and therefore $n$ is the square of
      $\prod_p p^{v_p(n)/2}$ — contrary to hypothesis. The same computation
      shows that $\sqrt[k]{n}$ is irrational unless $n$ is a perfect $k$-th
      power. Note where the work is: nothing here is about $\sqrt{n}$ as a
      real number, and no approximation or limiting argument appears — the
      obstruction is entirely the parity of exponents in a factorisation that
      unique factorisation guarantees is well defined.
    summary: >
      Squaring doubles every prime exponent, so a square root can only be
      rational when all the exponents were even to begin with.
    parent: number-theory.divisibility
    also_under: []
    requires:
      - number-theory.divisibility.canonical-factorization
      - foundations.number-systems.def-rationals
    relates:
      - id: foundations.proof.ex-sqrt-two-irrational
        note: 'The classical $\sqrt{2}$ argument is this one restricted to the prime $2$, with the even-exponent obstruction appearing there as the parity of $a$ and $b$ and the contradiction taken against lowest terms.'
    tags: []
