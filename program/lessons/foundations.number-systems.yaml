unit: foundations.number-systems
opening: >
  Every number you have ever used has to come from somewhere, and this unit
  builds all of them from the Peano axioms and nothing else. Addition,
  multiplication and order on $\mathbb{N}$ come first, manufactured from the
  successor by recursion; then three constructions in a row, each repairing one
  named defect of the system before it — $\mathbb{Z}$ to make subtraction
  total, $\mathbb{Q}$ to make division total, $\mathbb{R}$ to close the gaps in
  the order — and finally $\mathbb{C}$, to make $x^2 = -1$ solvable. Three of
  those four steps use the same device, a quotient of pairs by an explicitly
  written equivalence relation, and they all carry the same recurring
  obligation: an operation stated through representatives has to be shown not
  to depend on them. By the end you will be able to say what an integer, a
  rational and a real *are*, prove that a complete ordered field exists and is
  unique, and name what each extension costs.
lessons:
  - node: foundations.number-systems.def-nat-addition
    hook: >
      You hold the Peano axioms and the Recursion theorem, and neither of them
      mentions $+$. Addition is the first thing that has to be built, and until
      it is built the plus sign is a mark on paper.
    explanation: >
      The Peano axioms hand you exactly three things: an element $0$, a
      successor function $S$, and induction. Addition is not on the list, so it
      has to be manufactured, and the idea is the one a child uses — to add $n$
      to $m$, start at $m$ and step up $n$ times. Written as a definition that
      means recursing on the second argument, with the first frozen:
      $m + 0 = m$, and $m + S(n) = S(m + n)$.

      Look at how asymmetric that pair of clauses is. Only the second argument
      is ever taken apart. Nothing in the clauses says $0 + n = n$, and nothing
      says $m + n = n + m$; those are claims *about* the function the clauses
      define, and each will cost an induction to establish.

      Why do two clauses define anything at all? That is precisely the
      Recursion theorem, applied with $X = \mathbb{N}$, initial value $a = m$
      and step function $g(n, x) = S(x)$. It returns one and only one
      $f : \mathbb{N} \to \mathbb{N}$ with $f(0) = m$ and $f(S(n)) = S(f(n))$,
      and you set $m + n = f(n)$. Existence is what makes "add by counting up"
      an object rather than a procedure; uniqueness is what makes it *the*
      addition rather than one of many.

      Two facts fall out at once. First, $m + 1 = m + S(0) = S(m + 0) = S(m)$,
      so the successor really is addition of $1$ and the familiar notation
      $n + 1$ for $S(n)$ is licensed. Second, unwinding the second clause $n$
      times shows that $m + n$ is $m$ with $S$ applied exactly $n$ times —
      counting up, made into a function.
    worked: >
      Compute $3 + 2$ from the clauses alone, reading $2$ as $S(S(0))$. The
      second clause applies twice, peeling one successor off the right argument
      each time and parking it outside: $3 + S(S(0)) = S(3 + S(0))$, then
      $S(3 + S(0)) = S(S(3 + 0))$. Now the first clause bottoms the recursion
      out, $3 + 0 = 3$, and the answer is $S(S(3))$ — three with two successors
      applied, which is $5$. No property of addition was used anywhere; only
      the two clauses.
    pitfalls: >
      The clauses recurse on the second argument only, so $m + 0 = m$ holds by
      definition while $0 + m = m$ is a theorem needing induction. Treating
      those two lines as the same statement is the standard slip, and it
      quietly assumes the commutativity you have not yet proved. A second trap
      is treating the definition as a procedure: without the Recursion theorem,
      "define $+$ by these two clauses" is infinitely many demands with nothing
      shown to meet them all, and nothing shown to meet them uniquely.
    recap: >
      Addition on $\mathbb{N}$ is built from the successor by recursing on the
      second argument, and the Recursion theorem is what turns two clauses into
      a definition.
    steps:
      - teach: >
          The Peano axioms give you $0$, a successor $S$, and induction. That
          is the entire inventory — there is no $+$ anywhere on it. If addition
          is going to exist, you have to build it.
      - teach: >
          The idea is counting up: to add $n$ to $m$, start at $m$ and take the
          successor $n$ times. As a definition that reads $m + 0 = m$ and
          $m + S(n) = S(m + n)$, with $m$ frozen and only the second argument
          taken apart.
      - teach: >
          Watch it run on $3 + 2$, with $2 = S(S(0))$. The second clause peels
          one successor off the right and parks it outside:
          $3 + S(S(0)) = S(3 + S(0)) = S(S(3 + 0))$, and the first clause ends
          it at $3$. The answer is $3$ with two successors, namely $5$.
      - ask: >
          Unwind $4 + 3$ the same way. How many times is the clause
          $m + S(n) = S(m + n)$ applied before the clause $m + 0 = m$ is
          reached?
        expects: "3"
        hint: >
          Count the successors sitting inside $3 = S(S(S(0)))$; each one takes
          a single application to peel off.
        feedback: >
          Three, one per successor in $3$:
          $4 + S(S(S(0))) = S(4 + S(S(0))) = S(S(4 + S(0))) = S(S(S(4 + 0)))$,
          and then the first clause gives $S(S(S(4))) = 7$.
      - teach: >
          What licenses the definition is the Recursion theorem, not the
          plausibility of counting up. It says two clauses of exactly this
          shape are satisfied by one function and by no more than one.
      - ask: >
          Which instantiation of the Recursion theorem produces addition by
          $m$?
        choices:
          - text: >
              $X = \mathbb{N}$, initial value $a = 0$, step $g(n, x) = S(x)$
            feedback: >
              The initial value has to be $m$: the recursion starts wherever
              $m + 0$ lands, and $m + 0 = m$. Starting at $0$ defines the
              identity function on $\mathbb{N}$ instead.
          - text: >
              $X = \mathbb{N}$, initial value $a = m$, step $g(n, x) = S(x)$
            correct: true
            feedback: >
              Exactly: $f(0) = m$ is the first clause and $f(S(n)) = S(f(n))$
              is the second, so the unique $f$ the theorem returns is
              $n \mapsto m + n$.
          - text: >
              $X = \mathbb{N}$, initial value $a = m$, step $g(n, x) = S(n)$
            feedback: >
              A step function must consume the value built so far, $x$, not the
              index $n$. This one ignores $f(n)$ entirely and returns $S(n)$,
              which is a different function altogether.
        feedback: >
          Initial value $m$, step $g(n, x) = S(x)$. Read the two clauses as
          $f(0) = a$ and $f(S(n)) = g(n, f(n))$ and the instantiation is forced.
      - ask: >
          Which of these holds *by definition*, with no induction required?
        choices:
          - text: >
              $0 + n = n$
            feedback: >
              The clauses take apart the second argument, and here the second
              argument is $n$, not $0$. This one is a theorem, proved by
              induction on $n$.
          - text: >
              $n + 0 = n$
            correct: true
            feedback: >
              This is the first clause verbatim, with the zero in the second
              slot where the recursion can see it.
          - text: >
              $m + n = n + m$
            feedback: >
              Commutativity is a theorem, and not a cheap one — it needs an
              auxiliary lemma before its own induction will close.
        feedback: >
          Only $n + 0 = n$ is definitional. The asymmetry of the clauses is
          what makes its mirror image cost work.
      - teach: >
          One consequence is worth carrying: $m + 1 = m + S(0) = S(m + 0) =
          S(m)$. Successor is addition of $1$, so from here on $n + 1$ may be
          written for $S(n)$. Everything else about $+$ — commutativity,
          associativity, cancellation — is still unproved.

  - node: foundations.number-systems.nat-addition-laws
    hook: >
      Every rule of addition you have used since primary school is, at this
      point in the story, an unproved claim about a two-clause recursion. What
      the finished list turns out *not* to contain is what forces the next
      construction.
    explanation: >
      The recursion handed you $n + 0 = n$ and nothing else. Its mirror,
      $0 + n = n$, looks like the same statement with the letters moved, but
      the clauses only take apart the second argument, so it must be proved:
      the base $0 + 0 = 0$ is the first clause, and assuming $0 + n = n$ gives
      $0 + S(n) = S(0 + n) = S(n)$. Induction closes it.

      Commutativity needs a lemma before it will close: $S(m) + n = S(m + n)$,
      itself an induction on $n$ (base $S(m) + 0 = S(m) = S(m + 0)$; step
      $S(m) + S(n) = S(S(m) + n) = S(S(m + n)) = S(m + S(n))$). With that
      lemma and $0 + n = n$ in hand, induct on $n$ in $m + n = n + m$: the base
      is the two identity facts together, and the step is
      $m + S(n) = S(m + n) = S(n + m) = S(n) + m$, the last equality being the
      lemma read backwards.

      Associativity is an induction on $k$ straight from the clauses.
      Cancellation is an induction on $k$ whose step consumes injectivity of
      $S$: $m + S(k) = n + S(k)$ unfolds to $S(m + k) = S(n + k)$, and
      injectivity strips the outer $S$. And $m + n = 0$ forces $m = n = 0$,
      because if $n$ were a successor $S(j)$ then $m + n = S(m + j)$ would be a
      successor, and $0$ is not one.

      Read the finished list structurally: $\mathbb{N}$ under addition is a
      commutative monoid in which every element cancels. Exactly one feature is
      absent — inverses. The equation $x + 3 = 1$ has no solution here, and
      supplying one is the entire job of the construction of $\mathbb{Z}$.
    worked: >
      Here is associativity in full. Fix $m$ and $n$ and induct on $k$ in
      $(m + n) + k = m + (n + k)$. Base $k = 0$: the first clause turns both
      sides into $m + n$. Step: assume the identity for $k$. Then
      $(m + n) + S(k) = S((m + n) + k)$ by the second clause,
      $= S(m + (n + k))$ by the inductive hypothesis, $= m + S(n + k)$ by the
      second clause read backwards, and $= m + (n + S(k))$ by the second clause
      applied inside. So it holds at $S(k)$, and induction gives every $k$.
      Every single equality is one of the two clauses or the hypothesis;
      nothing else is available yet.
    pitfalls: >
      The commonest error is proving commutativity *with* commutativity — the
      auxiliary lemma $S(m) + n = S(m + n)$ is not an instance of the law being
      proved and has to be earned separately. A second trap is reading
      cancellation as subtraction: $m + k = n + k$ does give $m = n$, but
      $x + 3 = 1$ still has no solution in $\mathbb{N}$, and nothing on this
      list will ever produce one.
    recap: >
      The rules of addition are inductions off a two-clause recursion, and the
      one rule that is missing — additive inverses — is what the integers are
      built to supply.
    steps:
      - teach: >
          The recursion gave you $n + 0 = n$ for free. Everything else you
          believe about addition is now a conjecture about the function those
          two clauses define, and each item costs an induction.
      - teach: >
          Start with $0 + n = n$. Base: $0 + 0 = 0$, the first clause. Step:
          assuming $0 + n = n$, the second clause gives
          $0 + S(n) = S(0 + n) = S(n)$. Induction closes it.
      - ask: >
          Why does $0 + n = n$ need a proof when $n + 0 = n$ does not?
        choices:
          - text: >
              Because $0$ behaves differently from other naturals
            feedback: >
              $0$ is not the issue — the same asymmetry makes $S(m) + n$ harder
              than $m + S(n)$ for every $m$. It is the shape of the clauses,
              not the element.
          - text: >
              Because the clauses take apart only the second argument
            correct: true
            feedback: >
              Right. The recursion never inspects the first slot, so a
              statement with the variable on the left is outside its reach and
              has to be reached by induction instead.
          - text: >
              Because induction is the only proof technique available in
              $\mathbb{N}$
            feedback: >
              Induction is available but not compulsory: $n + 0 = n$ is proved
              by quoting a clause, with no induction at all. The question is
              which statements the clauses can reach directly.
        feedback: >
          The clauses recurse on the second argument, so $n + 0 = n$ is
          definitional and $0 + n = n$ is a theorem. That asymmetry is the
          source of every piece of work here.
      - teach: >
          Commutativity will not close on its own. It needs the lemma
          $S(m) + n = S(m + n)$ first — an induction on $n$ — which is exactly
          the statement that moving a successor from the left argument to the
          outside is legal.
      - ask: >
          In the induction step for $m + n = n + m$, the chain runs
          $m + S(n) = S(m + n) = S(n + m) = S(n) + m$. Which fact justifies the
          last equality?
        choices:
          - text: >
              The inductive hypothesis $m + n = n + m$
            feedback: >
              That is the *middle* equality, turning $S(m + n)$ into
              $S(n + m)$. The last step still has to move the successor from
              outside the sum into the left argument.
          - text: >
              The lemma $S(m) + n = S(m + n)$, read backwards
            correct: true
            feedback: >
              Exactly. Reading the lemma right to left with $n$ and $m$ in
              those roles turns $S(n + m)$ into $S(n) + m$, which is the shape
              needed to close.
          - text: >
              The clause $m + S(n) = S(m + n)$
            feedback: >
              That clause moves a successor out of the *second* argument. Here
              the successor has to land on the first argument, which the
              clauses cannot do — that is precisely why the lemma exists.
        feedback: >
          The lemma does the last step. Without it the induction stalls one
          equality short, which is why commutativity is two inductions rather
          than one.
      - teach: >
          Cancellation, $m + k = n + k \implies m = n$, is an induction on $k$
          whose step unfolds to $S(m + k) = S(n + k)$ and then strips the outer
          $S$. That strip is the Peano axiom saying $S$ is injective — the
          arithmetic law rests directly on an axiom.
      - ask: >
          How many solutions $x \in \mathbb{N}$ does $x + 3 = 1$ have?
        expects: "0"
        hint: >
          Unfold both sides as successors and use injectivity of $S$ twice.
        feedback: >
          None. Unfolding, $x + 3 = S(x + 2)$ and $1 = S(0)$, so injectivity
          gives $x + 2 = 0$; but a sum of naturals is $0$ only when both are,
          and $2 \ne 0$. So the equation is unsolvable, and no law on this list
          repairs that.
      - teach: >
          Collect the list: $\mathbb{N}$ under addition is commutative,
          associative, has identity $0$, and every element cancels. The single
          missing feature is inverses — which is exactly the hole the next
          construction is designed to fill.

  - node: foundations.number-systems.def-nat-multiplication
    hook: >
      "Multiplication is repeated addition" is a slogan until you write down
      which recursion makes it one. The same machine that built addition builds
      multiplication one level up, and exponentiation one level above that.
    explanation: >
      Same device, new step. Freeze $m$, recurse on the second argument, and
      write $m \cdot 0 = 0$ and $m \cdot S(n) = m \cdot n + m$. The base is $0$
      rather than $m$ because adding $m$ zero times leaves nothing at all — the
      empty sum is the additive identity, not the thing being added.

      The Recursion theorem again supplies the licence, now with
      $X = \mathbb{N}$, initial value $a = 0$ and step function
      $g(n, x) = x + m$. Notice what that step function is made of: addition.
      Multiplication is definable only after addition exists, and every law of
      multiplication will end up quoting a law of addition, because the
      recursion that defines it is written in terms of $+$.

      With the clauses in hand, "repeated addition" becomes precise: the
      recursion step is literally "add $m$ once more", so $m \cdot n$ is $0$
      with $m$ added $n$ times. Even $m \cdot 1 = m$ takes a moment —
      $m \cdot 1 = m \cdot S(0) = m \cdot 0 + m = 0 + m$, and turning $0 + m$
      into $m$ is the addition law proved by induction, not a clause.

      The ladder continues. Exponentiation is $m^0 = 1$ and
      $m^{n+1} = m^n \cdot m$, with step function $g(n, x) = x \cdot m$: each
      level's step is the operation of the level below. That is the whole
      pattern of elementary arithmetic — one recursion theorem, applied three
      times, with the previous rung as the step.
    worked: >
      Compute $3 \cdot 4$ from the clauses alone. Four applications of the
      second clause strip the right argument down:
      $3 \cdot 4 = 3 \cdot 3 + 3 = (3 \cdot 2 + 3) + 3 =
      ((3 \cdot 1 + 3) + 3) + 3 = (((3 \cdot 0 + 3) + 3) + 3) + 3$. The first
      clause now gives $3 \cdot 0 = 0$, and the additions run back up:
      $0 + 3 = 3$, then $6$, then $9$, then $12$. Four peels, one base case,
      four additions — and the four additions are exactly what "repeated" is
      counting.
    pitfalls: >
      Copying addition's base clause and writing $m \cdot 0 = m$ is the
      standard slip, and it makes every product wrong by $m$. And $m \cdot 1 =
      m$ is not immediate from the clauses: they only take you to $0 + m$, and
      the step from $0 + m$ to $m$ is a law of addition that itself needed an
      induction.
    recap: >
      Multiplication is the same recursion with a different step — "add $m$
      once more" instead of "take the successor" — which is what makes repeated
      addition a definition rather than a slogan.
    steps:
      - teach: >
          You have addition, proved to behave. Multiplication reuses the exact
          same machine: freeze the first argument, recurse on the second, and
          choose a step that says what one more copy does.
      - teach: >
          The clauses are $m \cdot 0 = 0$ and $m \cdot S(n) = m \cdot n + m$.
          The base is $0$, not $m$: adding $m$ zero times leaves nothing.
      - ask: >
          Which pair of clauses defines multiplication?
        choices:
          - text: >
              $m \cdot 0 = m$ and $m \cdot S(n) = m \cdot n + m$
            feedback: >
              This base copies addition's. It makes $m \cdot 0 = m$, so every
              product comes out too big by exactly $m$ — for instance
              $3 \cdot 2$ would unwind to $9$.
          - text: >
              $m \cdot 0 = 0$ and $m \cdot S(n) = S(m \cdot n)$
            feedback: >
              That step is addition's step, taking one successor rather than
              adding a whole copy of $m$. It defines $n \mapsto n$, not
              multiplication by $m$.
          - text: >
              $m \cdot 0 = 0$ and $m \cdot S(n) = m \cdot n + m$
            correct: true
            feedback: >
              Base $0$, step "add $m$ once more" — the two things that make
              $m \cdot n$ equal to $0$ with $m$ added $n$ times.
        feedback: >
          Base $0$, step $x \mapsto x + m$. Both halves matter: the wrong base
          shifts every value, and the wrong step changes the operation
          entirely.
      - teach: >
          The Recursion theorem licenses this with $X = \mathbb{N}$, initial
          value $0$ and step $g(n, x) = x + m$. The step is written using
          addition, which is why multiplication could not have come first.
      - ask: >
          Unwind $3 \cdot 4$ by the clauses. After the base clause is reached,
          how many additions of $3$ are performed?
        expects: "4"
        hint: >
          Each application of the second clause leaves one "$+\,3$" behind.
        feedback: >
          Four. The peeling gives $(((3 \cdot 0 + 3) + 3) + 3) + 3$, so after
          $3 \cdot 0 = 0$ there are four additions: $3$, $6$, $9$, $12$. The
          count of additions is exactly the second argument.
      - teach: >
          Even $m \cdot 1 = m$ takes a step of work. The clauses give
          $m \cdot 1 = m \cdot 0 + m = 0 + m$, and stopping there leaves the
          answer in the wrong shape.
      - ask: >
          Which fact finishes the argument that $m \cdot 1 = m$?
        choices:
          - text: >
              The clause $m + 0 = m$
            feedback: >
              Wrong side. The expression to simplify is $0 + m$, with the zero
              on the left, which is exactly the case the clause cannot see.
          - text: >
              The addition law $0 + n = n$
            correct: true
            feedback: >
              Yes — and that law was itself an induction, so even this tiny
              identity inherits work from the previous step of the tower.
          - text: >
              Commutativity of multiplication
            feedback: >
              Commutativity of multiplication is not available yet; it is
              proved later and its proof leans on facts like this one. Using it
              here would be circular.
        feedback: >
          $m \cdot 1 = 0 + m$, and $0 + n = n$ finishes it. Every law of
          multiplication will quote a law of addition like this, because the
          recursion step is written with $+$.
      - teach: >
          The ladder continues: $m^0 = 1$ and $m^{n+1} = m^n \cdot m$, with
          step $g(n, x) = x \cdot m$. One recursion theorem, three rungs, each
          rung's step being the operation of the rung below.

  - node: foundations.number-systems.nat-multiplication-laws
    hook: >
      The order in which these laws can be proved is forced, and it is not the
      order they are usually listed in: distributivity has to come first,
      because associativity and commutativity are both proved through it.
    explanation: >
      Distributivity, $m \cdot (n + k) = m \cdot n + m \cdot k$, is the only
      one of the laws reachable from the recursive clauses alone. Induct on
      $k$. Base: $m \cdot (n + 0) = m \cdot n = m \cdot n + 0 =
      m \cdot n + m \cdot 0$. Step:
      $m \cdot (n + S(k)) = m \cdot S(n + k) = m \cdot (n + k) + m$ by the
      multiplication clause, $= (m \cdot n + m \cdot k) + m$ by the hypothesis,
      $= m \cdot n + (m \cdot k + m)$ by associativity of addition, and that
      last bracket is $m \cdot S(k)$ by the clause again.

      Everything else consumes distributivity. Associativity of multiplication
      is an induction on $k$ whose step needs it; commutativity needs two
      auxiliary lemmas first, $0 \cdot n = 0$ and
      $S(m) \cdot n = m \cdot n + n$, each its own induction — the same shape
      of extra work you paid for addition, and for the same reason, since the
      clauses only take apart the second argument.

      The absence of zero divisors is short once the addition laws are
      available. Suppose $m \ne 0$ and $n \ne 0$; write $n = S(j)$, so
      $m \cdot n = m \cdot j + m$. A sum of naturals is $0$ only when both
      summands are, so $m \cdot n = 0$ would force $m = 0$, contradicting the
      assumption. Cancellation by a nonzero $k$ then follows by induction on $m$,
      using additive cancellation at each step.

      The moral is the dependency shape rather than any single proof: every law
      here quotes a law of addition, because the recursion defining $\cdot$ is
      written in terms of $+$. There is no route to multiplication that skips
      the previous rung.
    worked: >
      Prove the lemma $0 \cdot n = 0$, one of the two that commutativity needs.
      Induct on $n$. Base: $0 \cdot 0 = 0$ is the first clause. Step: assume
      $0 \cdot n = 0$. Then $0 \cdot S(n) = 0 \cdot n + 0$ by the second
      clause, $= 0 + 0$ by the hypothesis, $= 0$. Induction gives it for every
      $n$. Now watch it pay off: the base case of commutativity,
      $m \cdot 0 = 0 \cdot m$, is exactly $0 = 0$ once the clause supplies the
      left side and this lemma supplies the right.
    pitfalls: >
      Reaching for commutativity to shorten the proof of distributivity is
      circular — distributivity comes first and both other laws consume it.
      Cancellation genuinely needs its hypothesis: with $k = 0$ every product
      is $0$, so $2 \cdot 0 = 5 \cdot 0$ while $2 \ne 5$, and the law says
      nothing at all.
    recap: >
      Distributivity is the load-bearing law of multiplication on $\mathbb{N}$;
      associativity, commutativity and cancellation are all proved through it,
      and each of them quotes a law of addition on the way.
    steps:
      - teach: >
          None of these laws is an assumption. Each is a theorem about the
          two-clause recursion, and the order they can be proved in is forced
          by which ones the clauses can reach directly.
      - teach: >
          Distributivity is the reachable one. Its induction step reads
          $m \cdot (n + S(k)) = m \cdot (n + k) + m = (m \cdot n + m \cdot k)
          + m = m \cdot n + m \cdot S(k)$, using only the clauses, the
          hypothesis, and associativity of addition.
      - ask: >
          Which law of multiplication must be proved first?
        choices:
          - text: >
              Commutativity
            feedback: >
              Commutativity is the *most* expensive: it needs two auxiliary
              lemmas and it uses distributivity through associativity. It
              cannot be first.
          - text: >
              Distributivity
            correct: true
            feedback: >
              Right — it is the only law provable from the recursive clauses
              plus the addition laws alone, and the other two are proved
              through it.
          - text: >
              Associativity of multiplication
            feedback: >
              Its induction step expands $m \cdot (n \cdot S(k))$ and needs
              distributivity to regroup, so it cannot come before
              distributivity.
        feedback: >
          Distributivity first. It is the one the clauses reach unaided, and
          everything else is built on it.
      - teach: >
          Commutativity needs $0 \cdot n = 0$ and $S(m) \cdot n = m \cdot n + n$
          before its own induction will close. Both are the mirror images of
          facts the clauses give for free on the right.
      - ask: >
          Why does $S(m) \cdot n = m \cdot n + n$ need a proof of its own?
        choices:
          - text: >
              Because the clauses only take apart the second argument
            correct: true
            feedback: >
              Yes. The clause handles $m \cdot S(n)$; a successor in the
              *first* slot is invisible to the recursion, so the mirror
              statement has to be reached by induction.
          - text: >
              Because $S$ is injective
            feedback: >
              Injectivity of $S$ is used for cancellation, not here. The
              obstacle is which argument the recursion can see.
          - text: >
              Because multiplication has no zero divisors
            feedback: >
              That is a separate law, proved later and from the addition laws.
              It plays no part in why this lemma is hard.
        feedback: >
          The same asymmetry that made $0 + n = n$ a theorem makes this a
          theorem. Every mirror-image statement in this unit costs an
          induction.
      - teach: >
          No zero divisors comes out cleanly: with $n = S(j)$,
          $m \cdot n = m \cdot j + m$, and a sum of naturals is $0$ only when
          both parts are. So $m \cdot n = 0$ forces $m = 0$.
      - ask: >
          Cancellation says $m \cdot k = n \cdot k$ implies $m = n$ provided
          $k$ avoids one value. Which value?
        expects: "0"
        hint: >
          Ask what the base clause does to both sides.
        feedback: >
          $k = 0$. The base clause makes $m \cdot 0 = 0 = n \cdot 0$ for every
          $m$ and $n$, so $2 \cdot 0 = 5 \cdot 0$ with $2 \ne 5$ — the
          hypothesis is doing real work.
      - teach: >
          Every law of multiplication quotes a law of addition somewhere, because
          the recursion defining $\cdot$ is written with $+$. That dependency,
          not any individual induction, is the thing to carry forward.

  - node: foundations.number-systems.def-nat-order
    hook: >
      You can add and multiply naturals but you still have no way to say one is
      smaller than another. Rather than postulate an order, define it out of
      the addition you already built.
    explanation: >
      The definition is: $m \le n$ means there is some $k \in \mathbb{N}$ with
      $m + k = n$, and $m < n$ means such a $k$ exists and is nonzero. Nothing
      new is postulated. "Less than or equal" is a statement about whether an
      equation is solvable, and the solution $k$ is the witness you carry
      around.

      That it is a total order is four separate checks. Reflexivity takes
      $k = 0$. Transitivity adds the witnesses: $m + k = n$ and $n + l = p$
      give $m + (k + l) = p$ by associativity. Antisymmetry is the pretty one —
      from $m + k = n$ and $n + l = m$ you get $m + (k + l) = m = m + 0$,
      cancellation strips the $m$ to leave $k + l = 0$, and a sum of naturals
      is $0$ only when both are, so $k = l = 0$ and $m = n$. Comparability of
      any two naturals is an induction.

      The order and the arithmetic are compatible, and the witness is what
      makes the proofs one line each: $m \le n$ if and only if
      $m + k \le n + k$, since the same witness works on both sides; and
      $m \le n$ implies $m \cdot k \le n \cdot k$, because multiplying
      $m + j = n$ by $k$ and distributing exhibits $j \cdot k$ as the witness.
      Strictness survives when $k \ne 0$, by the absence of zero divisors.

      Two features of this order are special to $\mathbb{N}$, and both are
      about to be spent. Every nonempty subset has a least element — the
      Well-ordering principle for $\mathbb{N}$. And the order is *discrete*:
      $m < n$ means $m + k = n$ with $k = S(j)$, hence $m + 1 \le n$, so
      nothing sits strictly between $n$ and $n + 1$. Watch both of these
      disappear as the tower is built.
    worked: >
      Take $m = 4$ and $n = 11$. The witness is $k = 7$, since $4 + 7 = 11$, so
      $4 \le 11$, and $7 \ne 0$ makes it strict. Now watch the witness travel.
      To see $4 \cdot 3 \le 11 \cdot 3$, multiply the witnessing equation by
      $3$ and distribute: $(4 + 7) \cdot 3 = 4 \cdot 3 + 7 \cdot 3$, that is
      $12 + 21 = 33$. The witness for the multiplied inequality is $21$,
      computed rather than merely asserted to exist — which is how every
      compatibility proof goes.
    pitfalls: >
      The witness has to be a natural number, and that is exactly what gives
      the relation content: "$7 \le 4$" would demand $7 + k = 4$, and no such
      $k$ exists in $\mathbb{N}$. Antisymmetry is not free either — it consumes
      cancellation together with the fact that a sum of naturals vanishes only
      when both summands do, so it is a genuine theorem rather than a
      restatement of the definition.
    recap: >
      On $\mathbb{N}$, $m \le n$ is shorthand for "the equation $m + k = n$ has
      a solution", which makes the order a consequence of addition rather than
      extra structure.
    steps:
      - teach: >
          Nothing so far lets you compare two naturals. The trick is not to add
          new structure but to notice that comparison is already expressible:
          $n$ is at least $m$ exactly when you can get from $m$ to $n$ by
          adding something.
      - teach: >
          Define $m \le n$ to mean $m + k = n$ for some $k \in \mathbb{N}$, and
          $m < n$ to mean that this $k$ is nonzero. The $k$ is the witness, and
          it is the object every proof about the order actually manipulates.
      - ask: >
          What is the witness $k$ establishing $4 \le 11$?
        expects: "7"
        hint: >
          Solve $4 + k = 11$ inside $\mathbb{N}$.
        feedback: >
          $k = 7$, because $4 + 7 = 11$. It is nonzero, so the inequality is
          strict: $4 < 11$.
      - teach: >
          Antisymmetry is where the definition earns its keep. From
          $m + k = n$ and $n + l = m$ you get $m + (k + l) = m + 0$;
          cancellation leaves $k + l = 0$; and a sum of naturals is $0$ only
          when both are, so $k = l = 0$ and $m = n$.
      - ask: >
          Which previously proved facts does that antisymmetry argument
          consume?
        choices:
          - text: >
              Injectivity of $S$ and the base clause $m + 0 = m$
            feedback: >
              Injectivity of $S$ is what cancellation is proved *from*, but the
              argument here quotes cancellation itself, and it needs one more
              fact besides.
          - text: >
              Cancellation, together with "$k + l = 0$ forces $k = l = 0$"
            correct: true
            feedback: >
              Exactly those two. Strip the $m$ with cancellation, then kill
              both witnesses with the vanishing-sum law.
          - text: >
              Distributivity and the absence of zero divisors
            feedback: >
              Those two are used for compatibility of the order with
              multiplication, not for antisymmetry — no product appears in this
              argument at all.
        feedback: >
          Cancellation plus the vanishing-sum law. Antisymmetry is a theorem
          with content, not a rephrasing of the definition.
      - teach: >
          Compatibility is witness bookkeeping. Adding $k$ to both sides reuses
          the same witness; multiplying by $k$ turns the witness $j$ into
          $j \cdot k$ by distributivity, and it stays nonzero when $k \ne 0$
          because $\mathbb{N}$ has no zero divisors.
      - ask: >
          Which feature of this order is special to $\mathbb{N}$ and will *not*
          survive the constructions ahead?
        choices:
          - text: >
              Transitivity
            feedback: >
              Transitivity holds in every ordered system in this unit — it is
              part of what "order" means, so nothing can spend it.
          - text: >
              Comparability of any two elements
            feedback: >
              $\mathbb{Z}$, $\mathbb{Q}$ and $\mathbb{R}$ all keep total
              orders. It is only at $\mathbb{C}$ that comparability with the
              arithmetic goes, and for a different reason.
          - text: >
              Discreteness — nothing lies strictly between $n$ and $n + 1$
            correct: true
            feedback: >
              Right. $m < n$ forces $m + 1 \le n$ here, but once division
              exists you can always halve the gap, and discreteness is gone for
              good.
        feedback: >
          Discreteness, and alongside it the existence of least elements. Both
          are properties the extensions ahead will trade away.
      - teach: >
          So $\mathbb{N}$ arrives fully equipped: arithmetic, a total order
          compatible with it, least elements everywhere, and no gaps between
          consecutive values. The rest of the unit is about what has to be
          given up to gain anything more.

  - node: foundations.number-systems.nat-categorical
    hook: >
      You have been saying "the natural numbers" as though there were only one
      such system. This theorem is what makes the phrase legal, and its proof
      is the Recursion theorem used twice in each direction.
    explanation: >
      Suppose someone hands you a rival: a set $N'$ with a distinguished
      element $0'$ and a successor $S'$ satisfying the same three axioms.
      Nothing said so far relates it to your $\mathbb{N}$. The theorem says
      there is exactly one map $f : \mathbb{N} \to N'$ with $f(0) = 0'$ and
      $f(S(n)) = S'(f(n))$, and that this map is a bijection — so the rival is
      your system with the labels changed.

      Existence and uniqueness of $f$ are immediate: apply the Recursion
      theorem with $X = N'$, initial value $a = 0'$ and step function
      $g(n, x) = S'(x)$. The rival satisfies the Peano axioms too, so it has
      its own recursion theorem, which returns $f' : N' \to \mathbb{N}$ with
      $f'(0') = 0$ and $f'(S'(x)) = S(f'(x))$.

      Here is the load-bearing step. Look at the composite
      $f' \circ f : \mathbb{N} \to \mathbb{N}$. It sends $0$ to $0'$ to $0$,
      and it sends $S(n)$ to $S'(f(n))$ to $S(f'(f(n)))$ — that is, it
      satisfies $h(0) = 0$ and $h(S(n)) = S(h(n))$. But the identity map
      $\mathrm{id}$ satisfies those same two clauses, and the *uniqueness* half
      of the Recursion theorem permits only one such function. So
      $f' \circ f = \mathrm{id}$, and the mirror argument gives
      $f \circ f' = \mathrm{id}$. A map with a two-sided inverse is a
      bijection.

      Since $+$, $\cdot$ and $\le$ are defined on each side by the same
      recursions off zero and successor, an induction shows $f$ carries them
      across as well. So the choice of implementation — von Neumann ordinals
      $\emptyset$, $\{\emptyset\}$, $\{\emptyset, \{\emptyset\}\}$, or tally
      marks on paper — carries no mathematical content whatever. Keep the shape
      of this argument: it returns at the top of the unit for $\mathbb{R}$.
    worked: >
      Take $N'$ to be the even naturals with $0' = 0$ and $S'(x) = x + 2$. The
      axioms hold: $0$ is not $x + 2$ for any even $x$; $x + 2 = y + 2$ forces
      $x = y$; and induction transfers along the doubling. The recursion gives
      $f(0) = 0$ and $f(S(n)) = f(n) + 2$, so $f(n) = 2n$, and $f(5) = 10$. It
      is a bijection onto the evens, and it carries addition across:
      $f(3 + 4) = 14 = f(3) + f(4)$. Note that the multiplication transported
      to $N'$ is *not* the ordinary product of even numbers — it is whatever
      the recursion off $S'$ produces, and $f$ matches that one exactly.
    pitfalls: >
      The theorem is about models of the Peano axioms, not about anything that
      looks like counting: drop the induction axiom and a system with an extra
      chain of stray elements still satisfies the other two, and is not
      isomorphic to $\mathbb{N}$. And uniqueness of $f$ is not a decorative
      extra — it is the step that proves bijectivity, since the composites are
      identified with identity maps only because at most one function can
      satisfy those clauses.
    recap: >
      Any two systems satisfying the Peano axioms are joined by exactly one
      successor-respecting map, and the uniqueness half of the Recursion
      theorem is what upgrades that map to a bijection.
    steps:
      - teach: >
          A fair question about the axioms: do they pin down one system, or
          many? If a rival $(N', 0', S')$ satisfying the same three axioms
          could differ from yours in some real way, "the natural numbers" would
          be an abuse of language.
      - teach: >
          The Recursion theorem builds the comparison map for free. With
          $X = N'$, initial value $0'$ and step $g(n, x) = S'(x)$, it returns a
          unique $f$ with $f(0) = 0'$ and $f(S(n)) = S'(f(n))$. Running it the
          other way gives $f' : N' \to \mathbb{N}$.
      - teach: >
          Now compose. $f' \circ f$ sends $0$ to $0$ and sends $S(n)$ to
          $S(f'(f(n)))$, so it satisfies $h(0) = 0$ and $h(S(n)) = S(h(n))$ —
          and so does the identity map.
      - ask: >
          Why does that force $f' \circ f$ to *be* the identity?
        choices:
          - text: >
              Because $f$ is injective, and injective maps compose to
              identities
            feedback: >
              Injectivity of $f$ is a conclusion of this theorem, not a
              hypothesis, and injective maps certainly do not compose to
              identities in general.
          - text: >
              Because the Recursion theorem allows at most one function
              satisfying those two clauses
            correct: true
            feedback: >
              Exactly. Both $f' \circ f$ and $\mathrm{id}$ satisfy $h(0) = 0$
              and $h(S(n)) = S(h(n))$, and uniqueness says there is only one
              such $h$.
          - text: >
              Because a composite of two bijections is a bijection
            feedback: >
              That would need both maps known to be bijections first, which is
              exactly what is being proved. The argument would be circular.
        feedback: >
          Uniqueness does the work. This is the standard way a recursion
          theorem proves an identity: exhibit two functions obeying the same
          clauses, and conclude they are the same function.
      - teach: >
          Make it concrete. Let $N'$ be the even naturals with $0' = 0$ and
          $S'(x) = x + 2$. All three axioms hold there, so the theorem applies
          and there is exactly one structure-respecting map from $\mathbb{N}$.
      - ask: >
          What is $f(5)$ for that model?
        expects: "10"
        hint: >
          Unwind the recursion $f(0) = 0$, $f(S(n)) = f(n) + 2$ five times.
        feedback: >
          $f(n) = 2n$, so $f(5) = 10$. The recursion adds $2$ per successor,
          which is the only way to send $S$ to $S'$.
      - ask: >
          Which Peano axiom is doing the work of ruling out a rival system with
          extra elements outside the chain $0, S(0), S(S(0)), \ldots$?
        choices:
          - text: >
              (P1), that $0$ is not a successor
            feedback: >
              (P1) only says the chain has a starting point. A system with a
              second, separate chain having no start at all can still satisfy
              it.
          - text: >
              (P2), that $S$ is injective
            feedback: >
              (P2) rules out the chain looping back on itself. It says nothing
              about elements sitting off to the side.
          - text: >
              (P3), the induction axiom
            correct: true
            feedback: >
              Right. (P3) says the only subset containing $0$ and closed under
              $S$ is everything, which is precisely the assertion that there is
              nothing outside the chain.
        feedback: >
          (P3). Without it the theorem is false, and the isomorphism proof
          breaks at the point where induction transfers the arithmetic.
      - teach: >
          So the implementation is irrelevant: von Neumann ordinals, tally
          marks, or the even numbers all give the same mathematics. Notice the
          shape of the argument — a structure pinned down up to unique
          isomorphism by its defining property. It returns for $\mathbb{R}$.

  - node: foundations.number-systems.def-integers
    hook: >
      $\mathbb{N}$ cannot subtract: $x + 5 = 3$ has no solution. The repair is
      not to go looking for the missing numbers but to build them, and the raw
      material is pairs of the naturals you already have.
    explanation: >
      You want an object that behaves like $a - b$ for naturals $a$ and $b$,
      including when $b$ is the larger. So take the ordered pair $(a, b)$ and
      *declare* that it denotes that difference. At once there are too many
      pairs: $(3, 1)$, $(4, 2)$ and $(10, 8)$ all ought to name the same
      number, so the pairs that ought to agree must be identified.

      When should $(a, b)$ and $(c, d)$ agree? When $a - b = c - d$ — but that
      equation uses the operation the whole construction exists to create.
      Rearrange it into a form that does not: $a + d = c + b$. That is the
      definition, and it is written with additions only for exactly this
      reason. The construction may not help itself to what it is building.

      That $\sim$ is an equivalence relation takes one real step.
      Reflexivity and symmetry follow from commutativity. For transitivity,
      suppose $a + d = c + b$ and $c + f = e + d$. Add the two equations:
      $a + d + c + f = c + b + e + d$. Both sides carry $c + d$, and
      cancellation on $\mathbb{N}$ strips it, leaving $a + f = e + b$ — which
      is $(a, b) \sim (e, f)$. Cancellation is the one nontrivial fact used.

      Now form the quotient: $\mathbb{Z} = (\mathbb{N} \times
      \mathbb{N})/{\sim}$. An integer *is* an equivalence class, and $[(a, b)]$
      is read as $a - b$. Every class contains exactly one pair of the shape
      $(n, 0)$ or $(0, n)$: given $(a, b)$, either $a$ is reachable from $b$ by
      adding some $k$, in which case $(a, b) \sim (k, 0)$, or the reverse, and
      $(a, b) \sim (0, k)$. That normal form is the trichotomy
      positive/zero/negative, delivered by the construction rather than
      assumed.
    worked: >
      Take the class of $(3, 7)$. Since $3 + 4 = 7$, its normal form is
      $(0, 4)$. Its members are the pairs whose second coordinate exceeds the
      first by $4$: $(0, 4)$, $(1, 5)$, $(2, 6)$, $(3, 7)$, $(4, 8)$, and so on
      forever. Check one of them against the definition: $(3, 7) \sim (1, 5)$
      because $3 + 5 = 8 = 1 + 7$. This class is the integer $-4$ — and $-4$ is
      the whole infinite set of pairs, not any single one of them.
    pitfalls: >
      Writing the relation as $a - b = c - d$ is the error the construction is
      designed to avoid; it defines the new system in terms of the operation
      the new system exists to provide. Confusing a representative with the
      class is the other standing trap: $(3, 7)$ is a pair of naturals, while
      $-4$ is the set of all pairs equivalent to it, and a definition that
      inspects the pair rather than the class is not a definition of anything
      about integers.
    recap: >
      An integer is an equivalence class of pairs of naturals under
      $(a, b) \sim (c, d)$ exactly when $a + d = c + b$ — a way of writing down
      differences before subtraction exists.
    steps:
      - teach: >
          $\mathbb{N}$ has one clean failure: $x + 5 = 3$ has no solution. You
          are not going to find the answer lying around, so build a system in
          which every such equation is solvable, using only what you already
          have.
      - teach: >
          The idea: let the pair $(a, b)$ stand for the difference $a - b$.
          Every difference you want is now written, but far too many times over
          — $(3, 1)$, $(4, 2)$ and $(10, 8)$ all deserve to be the same number.
      - teach: >
          So identify them. Say $(a, b) \sim (c, d)$ when $a + d = c + b$. That
          is $a - b = c - d$ with the subtraction cleared away, and clearing it
          away is compulsory: the construction may not use the operation it
          exists to create.
      - ask: >
          Which of these pairs is *not* equivalent to $(2, 5)$?
        choices:
          - text: >
              $(0, 3)$
            feedback: >
              It is equivalent: $2 + 3 = 5 = 0 + 5$. This is in fact the normal
              form of the class.
          - text: >
              $(4, 7)$
            feedback: >
              It is equivalent: $2 + 7 = 9 = 4 + 5$. Adding the same amount to
              both coordinates never leaves the class.
          - text: >
              $(5, 2)$
            correct: true
            feedback: >
              Right — the coordinates are swapped, and $2 + 2 = 4$ while
              $5 + 5 = 10$. Swapping gives the *negative* of the original
              class, $3$ rather than $-3$.
          - text: >
              $(100, 103)$
            feedback: >
              It is equivalent: $2 + 103 = 105 = 100 + 5$. Classes are
              infinite, and every gap of $3$ in that direction belongs.
        feedback: >
          $(5, 2)$ is the odd one out, and instructively so: swapping
          coordinates is exactly the operation that will turn out to define
          negation.
      - teach: >
          Transitivity is the clause with content. From $a + d = c + b$ and
          $c + f = e + d$, add the equations to get
          $a + d + c + f = c + b + e + d$, then cancel the common $c + d$. What
          is left is $a + f = e + b$, and cancellation on $\mathbb{N}$ is what
          made the cancelling legal.
      - ask: >
          Which integer is the class of $(3, 7)$?
        expects: "-4"
        hint: >
          Read $[(a, b)]$ as $a - b$, and find the normal form $(0, n)$ or
          $(n, 0)$ inside the class.
        feedback: >
          $-4$. Since $3 + 4 = 7$, the pair sits four short, and its normal
          form is $(0, 4)$ — the class of every pair whose second coordinate
          exceeds its first by $4$.
      - teach: >
          Take the quotient: $\mathbb{Z} = (\mathbb{N} \times
          \mathbb{N})/{\sim}$. Each class holds exactly one pair of the shape
          $(n, 0)$ or $(0, n)$, and that normal form is trichotomy —
          positive, zero, negative — produced rather than postulated.
      - ask: >
          What, precisely, is the integer $-4$?
        choices:
          - text: >
              The pair $(0, 4)$
            feedback: >
              That is one representative, the tidiest one. The integer is not a
              single pair; a definition that depends on which pair you picked
              is not a definition about integers.
          - text: >
              The set of all pairs $(a, b)$ of naturals with $b = a + 4$
            correct: true
            feedback: >
              Yes — an integer *is* an equivalence class, and this class is the
              infinite set $(0, 4), (1, 5), (2, 6), \ldots$.
          - text: >
              The natural number $4$ with a minus sign attached
            feedback: >
              There is no minus sign to attach yet: negation has not been
              defined, and "$4$ with a sign" is a notation for the object, not
              the object.
        feedback: >
          The class, not the representative. Holding that distinction is what
          makes the next lesson's well-definedness checks feel necessary rather
          than pedantic.

  - node: foundations.number-systems.integers-operations
    hook: >
      A formula written on representatives is not yet a definition on classes.
      This is where that bill comes due in full, and the habit you build here
      is one you will pay every time a quotient appears for the rest of
      mathematics.
    explanation: >
      Read $[(a, b)]$ as $a - b$ and the formulas write themselves.
      $(a - b) + (c - d)$ is $(a + c) - (b + d)$, so declare
      $[(a, b)] + [(c, d)] = [(a + c,\,b + d)]$. Expanding
      $(a - b)(c - d)$ gives $ac + bd$ minus $ad + bc$, so the product is
      $[(ac + bd,\,ad + bc)]$. And $a - b \le c - d$ rearranges to
      $a + d \le c + b$, which is the order. Nothing here is a choice; the
      intended meaning forces every formula.

      Each definition names representatives, so each carries the obligation of
      well-definedness on a quotient: replace $(a, b)$ and $(c, d)$ by
      equivalent pairs and the answer must land in the same class. For
      addition it is a rearrangement — from $a + b' = a' + b$ and
      $c + d' = c' + d$, add to get
      $(a + c) + (b' + d') = (a' + c') + (b + d)$, which is exactly the
      required equivalence. For the order it is compatibility of $\le$ with
      addition on $\mathbb{N}$.

      Multiplication is the check with content. Change only the first argument
      and you must show $(ac + bd,\,ad + bc) \sim (a'c + b'd,\,a'd + b'c)$,
      that is $ac + bd + a'd + b'c = a'c + b'd + ad + bc$. Group the left side
      as $c(a + b') + d(b + a')$ and the right as $c(a' + b) + d(b' + a)$ —
      pure distributivity — and now the hypothesis $a + b' = a' + b$ makes the
      two sides identical term by term. Repeat the move on the second argument
      and the product is well defined.

      Finally the embedding: $n \mapsto [(n, 0)]$ is injective, since
      $[(n, 0)] = [(m, 0)]$ says $n + 0 = m + 0$, and it preserves sums,
      products and order by direct substitution into the formulas. So
      $\mathbb{N}$ sits inside $\mathbb{Z}$ with its old arithmetic intact, and
      you may write $n$ for $[(n, 0)]$ without ambiguity.
    worked: >
      Check the product on one instance. You know $(3, 7) \sim (0, 4)$ and
      $(5, 2) \sim (6, 3)$, so the two computations must agree. First
      representatives: $(3 \cdot 5 + 7 \cdot 2,\ 3 \cdot 2 + 7 \cdot 5) =
      (15 + 14,\ 6 + 35) = (29, 41)$. Second representatives:
      $(0 \cdot 6 + 4 \cdot 3,\ 0 \cdot 3 + 4 \cdot 6) = (12, 24)$. Equivalent?
      $29 + 24 = 53$ and $12 + 41 = 53$, so yes. And both name the same
      integer: $41 = 29 + 12$ and $24 = 12 + 12$, so both classes are $-12$,
      which is $-4$ times $3$.
    pitfalls: >
      Skipping the check because "the formula looks fine" is the trap, and it
      is easy to see why it is a trap: the rule $(a, b) \mapsto a$ is a
      perfectly good function on pairs and complete nonsense on classes, since
      $(3, 7)$ and $(0, 4)$ are the same integer but give different answers.
      Checking one argument at a time is legitimate only because you then
      repeat the argument for the other — do one half and the definition is
      still half unjustified.
    recap: >
      The operations on $\mathbb{Z}$ are forced by what the classes mean, and
      the real work is showing the answer does not move when the representative
      does.
    steps:
      - teach: >
          The formulas are not invented, they are read off. Since $[(a, b)]$
          means $a - b$, addition must be
          $[(a + c,\,b + d)]$, multiplication must be
          $[(ac + bd,\,ad + bc)]$, and $\le$ must be $a + d \le c + b$.
      - teach: >
          But every one of those is written using a *chosen* pair from each
          class. Until you know the answer is the same for every other choice,
          you have a rule about pairs, not an operation on integers.
      - ask: >
          Which of these rules on pairs fails to define anything on classes?
        choices:
          - text: >
              $(a, b) \mapsto [(a + 1,\,b + 1)]$
            feedback: >
              This one is fine: if $(a, b) \sim (a', b')$ then
              $(a + 1, b + 1) \sim (a' + 1, b' + 1)$, since adding $1$ to both
              coordinates preserves the cross-sums.
          - text: >
              $(a, b) \mapsto a$
            correct: true
            feedback: >
              Right. $(3, 7)$ and $(0, 4)$ are the same integer, but this rule
              returns $3$ from one and $0$ from the other, so it defines no
              function on $\mathbb{Z}$ at all.
          - text: >
              $(a, b) \mapsto [(b, a)]$
            feedback: >
              This one is fine, and it is negation: $(a, b) \sim (a', b')$
              means $a + b' = a' + b$, which is symmetric in exactly the way
              needed for $(b, a) \sim (b', a')$.
        feedback: >
          Reading off a coordinate is the classic failure. It is the reason
          every formula here has to be checked rather than admired.
      - teach: >
          Addition passes easily. From $a + b' = a' + b$ and $c + d' = c' + d$,
          just add the two equations: $(a + c) + (b' + d') = (a' + c') + (b +
          d)$, which is precisely $(a + c,\,b + d) \sim (a' + c',\,b' + d')$.
      - ask: >
          Using the formula, which integer is $[(3, 7)] \cdot [(5, 2)]$?
        expects: "-12"
        hint: >
          Compute $(ac + bd,\ ad + bc)$ and then find the normal form of the
          resulting pair.
        feedback: >
          $(3 \cdot 5 + 7 \cdot 2,\ 3 \cdot 2 + 7 \cdot 5) = (29, 41)$, and
          $41 = 29 + 12$, so the class is $-12$. That agrees with reading the
          factors as $-4$ and $3$.
      - teach: >
          The multiplication check is the one with content. You need
          $ac + bd + a'd + b'c = a'c + b'd + ad + bc$; group as
          $c(a + b') + d(b + a')$ against $c(a' + b) + d(b' + a)$, and the
          hypothesis $a + b' = a' + b$ matches the two sides term by term.
      - ask: >
          Which law of $\mathbb{N}$ is what makes that grouping possible?
        choices:
          - text: >
              Injectivity of the successor
            feedback: >
              That is what cancellation is proved from, and cancellation
              appears in the equivalence check — but no successor is stripped
              anywhere in this computation.
          - text: >
              Distributivity
            correct: true
            feedback: >
              Yes. Turning $ac + b'c$ into $c(a + b')$ is distributivity read
              backwards, and it is the only step that converts the hypothesis
              into the conclusion.
          - text: >
              The well-ordering principle
            feedback: >
              Nothing here is minimised or chosen least; this is a pure
              rearrangement of a sum of products.
        feedback: >
          Distributivity. It is the reason multiplication's check has content
          while addition's is bookkeeping.
      - teach: >
          One last piece: $n \mapsto [(n, 0)]$ is injective and preserves sums,
          products and order, so $\mathbb{N}$ sits inside $\mathbb{Z}$ with its
          arithmetic unchanged. From here you may safely write $n$ for
          $[(n, 0)]$.

  - node: foundations.number-systems.integers-ordered-ring
    hook: >
      Time to audit the new system: what did the construction buy, what did it
      cost, and what is still broken. The last of those three is the reason the
      unit does not stop here.
    explanation: >
      The purchase is additive inverses. Define $-[(a, b)] = [(b, a)]$ — the
      swap you already met as a well-defined rule — and check it:
      $[(a, b)] + [(b, a)] = [(a + b,\,a + b)]$, and any pair with equal
      coordinates is equivalent to $(0, 0)$, since $a + b + 0 = 0 + a + b$. So
      the sum is $0$. With $x - y$ defined as $x + (-y)$, subtraction is total
      and $x + a = b$ always has the solution $b - a$. That is exactly what
      $\mathbb{N}$ could not do.

      The rest of the structure survives the passage: addition is associative
      and commutative with identity $0 = [(0, 0)]$; multiplication is
      associative and commutative with identity $1 = [(1, 0)]$ and distributes;
      a product is $0$ only if a factor is, equivalently $xz = yz$ with
      $z \ne 0$ forces $x = y$; and the order is total, preserved by adding
      anything and by multiplying by anything nonnegative. In the language of a
      later branch: $\mathbb{Z}$ is an ordered integral domain.

      The cost is well-ordering. The Well-ordering principle for $\mathbb{N}$
      said every nonempty subset has a least element; $\mathbb{Z}$ has no least
      element at all, and neither does its set of negatives. So the standard
      move "take a minimal counterexample" is *illegal* on an arbitrary
      nonempty set of integers. It survives in weakened form: a nonempty set of
      integers bounded below does have a least element, because shifting it up
      by a constant lands it inside $\mathbb{N}$, where well-ordering applies,
      and shifting back returns the minimum.

      What is still missing is division. $2x = 1$ has no solution: $x \le 0$
      gives $2x \le 0$ and $x \ge 1$ gives $2x \ge 2$, and $\mathbb{Z}$
      inherited $\mathbb{N}$'s discreteness, so there is no integer in between.
      That single unsolvable equation names the next construction.
    worked: >
      Verify inverses on a class you know. $[(3, 7)]$ is $-4$, so its inverse
      ought to be $4$. The rule gives $-[(3, 7)] = [(7, 3)]$, and $7 = 3 + 4$
      puts the normal form at $(4, 0)$ — the class of $4$, as required. Now
      check the sum directly from the addition formula:
      $[(3, 7)] + [(7, 3)] = [(3 + 7,\,7 + 3)] = [(10, 10)]$, and
      $(10, 10) \sim (0, 0)$ because $10 + 0 = 0 + 10$. The sum is $0$, so the
      inverse is genuine and not merely plausible.
    pitfalls: >
      Arguing by minimal counterexample over all of $\mathbb{Z}$ is the trap
      to watch for — the set of integers $x$ with some
      property need not have a least element, and the argument is void unless
      the set is bounded below. A second slip is assuming the gain is bigger
      than it is: $\mathbb{Z}$ solves every $x + a = b$ and no equation
      $ax = b$ beyond the divisible cases.
    recap: >
      $\mathbb{Z}$ buys subtraction at the price of well-ordering, and it still
      cannot divide — which is precisely the defect the next construction
      repairs.
    steps:
      - teach: >
          A construction should be audited on three counts: what it gained,
          what it lost, and what it still cannot do. Run all three on
          $\mathbb{Z}$.
      - teach: >
          The gain is the inverse. Swapping coordinates gives it:
          $[(a, b)] + [(b, a)] = [(a + b,\,a + b)]$, and equal coordinates mean
          the class of $(0, 0)$, which is $0$.
      - ask: >
          Which integer is the additive inverse of the class of $(3, 7)$?
        expects: "4"
        hint: >
          Apply the swap rule and then read off the normal form.
        feedback: >
          $-[(3, 7)] = [(7, 3)]$, and $7 = 3 + 4$ gives the normal form
          $(4, 0)$ — the integer $4$. As it should be, since $[(3, 7)]$ is
          $-4$.
      - teach: >
          With inverses in hand, $x - y$ means $x + (-y)$, subtraction is a
          total operation, and $x + a = b$ is always solvable. Everything else
          from $\mathbb{N}$ came along: the arithmetic laws, no zero divisors,
          and a compatible total order.
      - ask: >
          Which property of $\mathbb{N}$ does $\mathbb{Z}$ lose?
        choices:
          - text: >
              Cancellation by a nonzero element
            feedback: >
              Cancellation survives intact — it is equivalent to having no zero
              divisors, and $\mathbb{Z}$ has none.
          - text: >
              Every nonempty subset has a least element
            correct: true
            feedback: >
              Right. $\mathbb{Z}$ itself has no least element, and neither does
              the set of negatives, so well-ordering is gone.
          - text: >
              Commutativity of multiplication
            feedback: >
              Commutativity is checked directly from the formula
              $[(ac + bd,\,ad + bc)]$, which is symmetric in the two arguments.
              Nothing about it breaks.
        feedback: >
          Well-ordering is the casualty. Every extension in this unit takes
          something, and this is the first bill.
      - teach: >
          The weakened form still works and is worth remembering: a nonempty
          set of integers *bounded below* does have a least element. Shift it
          up into $\mathbb{N}$, apply well-ordering there, and shift back.
      - ask: >
          Why does $2x = 1$ have no solution in $\mathbb{Z}$?
        choices:
          - text: >
              Because $2$ has no additive inverse
            feedback: >
              $2$ does have an additive inverse, namely $-2$. What it lacks is
              a *multiplicative* one, and saying so is just restating the
              question.
          - text: >
              Because $\mathbb{Z}$ has no least element
            feedback: >
              The absence of a least element is a fact about the order as a
              whole and plays no part here; the argument is about a gap between
              two specific values.
          - text: >
              Because the order is still discrete: $x \le 0$ gives $2x \le 0$
              and $x \ge 1$ gives $2x \ge 2$
            correct: true
            feedback: >
              Exactly. $\mathbb{Z}$ inherited discreteness from $\mathbb{N}$,
              so no integer lies strictly between $0$ and $1$, and $2x$ can
              never land on $1$.
        feedback: >
          Discreteness is what blocks it. The equation $ax = b$ is the next
          defect, and repairing it is what finally destroys discreteness for
          good.
      - teach: >
          Audit complete: gained subtraction, lost well-ordering, still cannot
          divide. One unsolvable equation, $2x = 1$, names the whole of the
          next construction.

  - node: foundations.number-systems.def-ordered-field
    hook: >
      Rather than build $\mathbb{Q}$ and then discover its rules one at a time,
      name the target first. These axioms are the complete list of what school
      algebra and inequality manipulation actually rest on.
    explanation: >
      An ordered field is a set $F$ carrying two operations, two distinguished
      elements $0 \ne 1$, and a total order, subject to five demands. (F1)
      addition is associative and commutative, $x + 0 = x$, and every $x$ has
      an additive inverse $-x$. (F2) multiplication is associative and
      commutative, $x \cdot 1 = x$, and every *nonzero* $x$ has a
      multiplicative inverse $x^{-1}$. (F3) $x(y + z) = xy + xz$. (O1)
      $x \le y$ implies $x + z \le y + z$ for every $z$. (O2) $0 \le x$ and
      $0 \le y$ imply $0 \le xy$. Subtraction and division are then defined:
      $x - y = x + (-y)$ and $x/y = x y^{-1}$ for $y \ne 0$.

      Compare (F1) with (F2) and one word stands out: *nonzero*. Additive
      inverses are granted to everything; multiplicative inverses to everything
      but $0$. That single qualifier is the reason division by zero is
      undefined rather than merely inconvenient, and it is not a convention
      that could have gone the other way.

      The order axioms are deliberately minimal. (O1) is what lets you move a
      term across an inequality. (O2) is the only claim about products, and it
      is stated for nonnegative elements only — every sign rule you know about
      multiplying inequalities has to be derived from that one clause together
      with (F1)–(F3), rather than assumed.

      The point of naming the package is what it *cannot* do. Everything
      provable from these five demands alone holds in $\mathbb{Q}$ and in
      $\mathbb{R}$ alike, so no such proof can tell the two apart. Whatever
      distinguishes the real numbers is therefore not on this list, and
      something genuinely new will have to be added later in the unit.
    worked: >
      Test $\mathbb{Z}$ against the list clause by clause. (F1): yes —
      associativity, commutativity, the identity $0$ and the inverse $-x$ were
      all established by the construction. (F3): yes, distributivity carried
      over. (O1): yes, the order is preserved by adding any integer. (O2): yes,
      a product of nonnegative integers is nonnegative. (F2): associativity,
      commutativity and the identity $1$ all hold — but inverses fail, since
      $2 \ne 0$ and no integer $x$ satisfies $2x = 1$. So $\mathbb{Z}$ meets
      every clause but one. Since "ordered field" is a conjunction, one failure
      is a failure, and that single clause is exactly what the next
      construction supplies.
    pitfalls: >
      Dropping the word *nonzero* from (F2) does not give a more generous
      system; it gives an inconsistent one, because in any structure obeying
      (F1) and (F3) the product $0 \cdot x$ turns out to be forced to $0$, so
      nothing can serve as $0^{-1}$ while $0 \ne 1$. The other trap is
      expecting too much of the axioms: $\mathbb{Q}$ satisfies every one of them, so a proof that
      uses only these is a proof about $\mathbb{Q}$ as well, however much it
      feels like a fact about the real line.
    recap: >
      The ordered field axioms package the four arithmetic operations and the
      two rules for inequalities into one list — a list that $\mathbb{Q}$ and
      $\mathbb{R}$ satisfy equally, which is why it cannot characterize either.
    steps:
      - teach: >
          Instead of building $\mathbb{Q}$ and cataloguing its properties
          afterwards, write the specification first. Then the construction has
          a target, and you will know when you have hit it.
      - teach: >
          The field half: (F1) addition is associative and commutative with
          identity $0$ and an inverse for every element; (F2) multiplication is
          associative and commutative with identity $1$ and an inverse for
          every element *other than* $0$; (F3) multiplication distributes over
          addition.
      - teach: >
          The order half is two lines only: (O1) $x \le y$ implies
          $x + z \le y + z$, and (O2) $0 \le x$ and $0 \le y$ imply
          $0 \le xy$. Every other rule about inequalities is a consequence, not
          an assumption.
      - ask: >
          Which clause does $\mathbb{Z}$ fail?
        choices:
          - text: >
              (O2), since products of integers can be negative
            feedback: >
              (O2) only claims something when *both* factors are nonnegative,
              and then the product is nonnegative in $\mathbb{Z}$ too. It
              holds.
          - text: >
              (F2), because nonzero integers need not have inverses
            correct: true
            feedback: >
              Right: $2 \ne 0$ and no integer $x$ has $2x = 1$. Every other
              clause holds, and "ordered field" is a conjunction, so one
              failure is decisive.
          - text: >
              (F1), because $\mathbb{Z}$ has no additive identity
            feedback: >
              $0 = [(0, 0)]$ is an additive identity and every class has an
              inverse $[(b, a)]$. (F1) is exactly what the construction of
              $\mathbb{Z}$ bought.
        feedback: >
          Only (F2), and only its inverse clause. That is the whole gap between
          $\mathbb{Z}$ and the specification.
      - teach: >
          Notice the asymmetry between (F1) and (F2): every element gets an
          additive inverse, but only nonzero elements get a multiplicative one.
          That qualifier is what makes division the one operation with an
          exception.
      - ask: >
          In an ordered field, for how many values of $y$ is $x/y$ left
          undefined?
        expects: "1"
        hint: >
          Look at which elements (F2) grants an inverse to.
        feedback: >
          Exactly one: $y = 0$. (F2) grants $y^{-1}$ to every nonzero $y$, so
          $x/y = x y^{-1}$ is defined everywhere else — the four operations are
          total apart from this single hole.
      - ask: >
          Why can these axioms not characterize $\mathbb{R}$?
        choices:
          - text: >
              Because they say nothing about multiplication
            feedback: >
              They say a great deal about multiplication — (F2), (F3) and (O2)
              are all about it. The problem is elsewhere.
          - text: >
              Because $\mathbb{Q}$ satisfies all of them, so no consequence of
              them separates $\mathbb{Q}$ from $\mathbb{R}$
            correct: true
            feedback: >
              Exactly. Two different systems both satisfying a list of axioms
              means the list cannot pin down either one, and whatever
              distinguishes $\mathbb{R}$ must be stated separately.
          - text: >
              Because they never mention $\mathbb{N}$
            feedback: >
              A copy of $\mathbb{N}$ is actually forced inside every ordered
              field by the sums $1 + 1 + \cdots + 1$, so this is not the
              obstacle.
        feedback: >
          $\mathbb{Q}$ satisfies the whole list. Keep that in view: any theorem
          proved from these axioms alone is a theorem about the rationals too.
      - teach: >
          So the axioms are a specification with a known shortfall. They will
          be met exactly by the next construction, and the property they cannot
          express is the one the rest of the unit is built around.

  - node: foundations.number-systems.ordered-field-consequences
    hook: >
      These are the manipulations you have been performing since school without
      being told why they are allowed. Each is a two-line derivation from the
      five axioms — and one of them, the nonnegativity of squares, is sharp
      enough to decide which systems can be ordered at all.
    explanation: >
      Begin with $x \cdot 0 = 0$, which is *not* an axiom. Since $0 + 0 = 0$,
      distributivity gives $x \cdot 0 = x(0 + 0) = x \cdot 0 + x \cdot 0$. Now
      add the additive inverse of $x \cdot 0$ to both sides: the left collapses
      to $0$ and the right to $x \cdot 0$. Without (F1)'s inverses the equation
      $t = t + t$ would say nothing at all, so the load-bearing step is the
      cancellation, not the distribution.

      The next few run on one pattern: to prove something *is* the inverse,
      exhibit it and verify the defining equation. For $(-x)y = -(xy)$:
      $xy + (-x)y = (x + (-x))y = 0 \cdot y = 0$, so $(-x)y$ satisfies exactly
      what $-(xy)$ is defined by, and additive inverses are unique. The same
      move gives $-(-x) = x$.

      The order facts come from (O1) and (O2) and nothing else. Applying (O1)
      with $z = -x$ turns $x \le y$ into $0 \le y - x$, and applying it with
      $z = x$ turns it back, so the two forms are interchangeable. Then for
      $0 \le c$: from $0 \le y - x$, (O2) gives $0 \le c(y - x) = cy - cx$,
      hence $cx \le cy$. For $c \le 0$ run the same argument on $-c$, which is
      nonnegative, and the inequality comes out reversed.

      The sharpest consequence is that every square is nonnegative. If
      $0 \le x$ then $0 \le x \cdot x$ by (O2) directly; if $x \le 0$ then
      $0 \le -x$ and $x^2 = (-x)(-x) \ge 0$; and totality of the order says
      there is no third case. So $1 = 1^2 \ge 0$, and $1 \ne 0$ gives $1 > 0$,
      whence $0 < 1 < 1 + 1 < 1 + 1 + 1 < \cdots$ with all these sums distinct.
      Every ordered field therefore contains a copy of $\mathbb{N}$, hence of
      $\mathbb{Z}$, hence — closing under quotients — of $\mathbb{Q}$.
    worked: >
      Show that $x^2 + 1 > 0$ for every element $x$ of every ordered field,
      using only what is above. Squares are nonnegative, so $0 \le x^2$. Adding
      $1$ to both sides is legal by (O1), giving $0 + 1 \le x^2 + 1$, that is
      $1 \le x^2 + 1$. And $1 > 0$ because $1 = 1^2$ is a square and $1 \ne 0$
      by the axioms. Transitivity of the order finishes it: $x^2 + 1 \ge 1 > 0$.
      The conclusion is that $x^2 + 1 = 0$ has no solution in *any* ordered
      field whatsoever — a fact obtained without knowing which field it is.
    pitfalls: >
      (O2) speaks only about nonnegative factors, so multiplying an inequality
      by a negative $c$ without reversing it is the standard error, and the
      reversal is a theorem you must quote rather than an instinct. The other
      trap is thinking $x^2 \ge 0$ is a fact about real numbers: it is a fact
      about ordered fields, which is exactly why it will later act as an
      obstruction rather than as a computation.
    recap: >
      The everyday rules for manipulating equations and inequalities are all
      derived from the five axioms, and the derived fact that squares are
      nonnegative is a constraint on which systems admit an order at all.
    steps:
      - teach: >
          None of these facts is an axiom. They are the first
          consequences of the package, and deriving them is how you learn what
          the package actually contains.
      - teach: >
          Take $x \cdot 0 = 0$. Since $0 + 0 = 0$, distributivity gives
          $x \cdot 0 = x \cdot 0 + x \cdot 0$. Add the additive inverse of
          $x \cdot 0$ to both sides and the left becomes $0$.
      - ask: >
          Which axiom makes that final step legal?
        choices:
          - text: >
              (O1), that the order is preserved by adding
            feedback: >
              No inequality appears anywhere in this derivation — it is an
              equation throughout, so no order axiom is involved.
          - text: >
              (F1)'s guarantee that every element has an additive inverse
            correct: true
            feedback: >
              Exactly. Without an inverse for $x \cdot 0$ the equation
              $t = t + t$ cannot be simplified, and the argument stalls right
              there.
          - text: >
              (F2), that nonzero elements have multiplicative inverses
            feedback: >
              You cannot use (F2) here even if you wanted to: it applies only
              to nonzero elements, and $x \cdot 0$ is exactly the element whose
              value is in question.
        feedback: >
          Additive inverses. Notice the pattern: the distribution sets up the
          equation, the inverse closes it.
      - teach: >
          The next results share one pattern. To prove something *is* an
          inverse, exhibit it and check the defining equation:
          $xy + (-x)y = (x + (-x))y = 0 \cdot y = 0$, so $(-x)y$ is the
          additive inverse of $xy$, and inverses are unique.
      - teach: >
          Now squares. If $0 \le x$ then $0 \le x \cdot x$ by (O2). If
          $x \le 0$ then $0 \le -x$, and $x^2 = (-x)(-x) \ge 0$ by (O2) again.
          Totality of the order says those are the only two cases, so every
          square is nonnegative.
      - ask: >
          In an ordered field, how many solutions does $x^2 = -1$ have?
        expects: "0"
        hint: >
          Compare the two sides against $0$ using what you just proved.
        feedback: >
          None. Squares are nonnegative, so $x^2 \ge 0$; and $1 = 1^2 > 0$
          gives $-1 < 0$. No element can be both, in any ordered field at all.
      - ask: >
          If $x \le y$ and $c \le 0$, what follows?
        choices:
          - text: >
              $cx \le cy$
            feedback: >
              That is the conclusion for *nonnegative* $c$. Applying it to a
              negative multiplier is the single most common inequality error.
          - text: >
              $cy \le cx$
            correct: true
            feedback: >
              Right. Run the nonnegative case on $-c \ge 0$ to get
              $-cx \le -cy$, then add $cx + cy$ to both sides to flip it.
          - text: >
              Nothing, since (O2) says nothing about negative factors
            feedback: >
              (O2) alone says nothing, but combined with additive inverses it
              yields the reversed inequality — which is a theorem, not a gap.
        feedback: >
          The inequality reverses, and it reverses because the proof routes
          through $-c$. Derived, never assumed.
      - teach: >
          One structural payoff: $1 = 1^2 > 0$, so
          $0 < 1 < 1 + 1 < \cdots$ with every sum distinct. Every ordered field
          therefore contains copies of $\mathbb{N}$, $\mathbb{Z}$ and — closing
          under quotients — $\mathbb{Q}$. No ordered field is small.

  - node: foundations.number-systems.def-rationals
    hook: >
      The same device a second time: $\mathbb{Z}$ cannot solve $ax = b$, so
      build the solutions out of pairs. What changes is which pairs are legal,
      and which law of $\mathbb{Z}$ the equivalence check spends.
    explanation: >
      You want an object that behaves like the solution of $bx = a$, so take
      the pair $(a, b)$ to denote it. This time the second coordinate has to be
      restricted: $0 \cdot x = a$ has no solution when $a \ne 0$ and every
      solution when $a = 0$, so a pair with second coordinate $0$ names nothing
      in either case. The domain is $\mathbb{Z} \times (\mathbb{Z} \setminus
      \{0\})$.

      When should $(a, b)$ and $(c, d)$ agree? The intended condition is
      $a/b = c/d$, which cross-multiplies to $a d = c b$ — a statement using
      only multiplication in $\mathbb{Z}$. Same discipline as before: the
      relation must be written in the operations you already have, never in the
      one being built.

      Transitivity is again where the work is, and this time it spends the
      absence of zero divisors. Suppose $ad = cb$ and $cf = ed$. Multiply the
      first by $f$ and the second by $b$: $adf = cbf$ and $cfb = edb$, so
      $adf = edb$, that is $d(af - eb) = 0$. Since $d \ne 0$ and $\mathbb{Z}$
      has no zero divisors, $af = eb$ — which is $(a, b) \sim (e, f)$. Take
      away that property of $\mathbb{Z}$ and the construction stalls at this
      line.

      Now form $\mathbb{Q} = (\mathbb{Z} \times (\mathbb{Z} \setminus
      \{0\}))/{\sim}$ and write $[(a, b)]$ as $a/b$. Each class contains
      exactly one pair with positive second coordinate and no common divisor
      above $1$ — its lowest-terms representative — reached by dividing both
      coordinates by their greatest common divisor and, if the denominator is
      still negative, negating both.
    worked: >
      Take the class of $(6, -8)$. Some of its members: $(3, -4)$, $(-3, 4)$,
      $(-6, 8)$, $(12, -16)$. Check one against the definition — $(6, -8) \sim
      (-3, 4)$ requires $6 \cdot 4 = (-3) \cdot (-8)$, and both sides are
      $24$. To reach the lowest-terms representative, divide both coordinates
      by their greatest common divisor $2$, giving $(3, -4)$; the denominator
      is negative, so negate both coordinates to get $(-3, 4)$. That is the
      unique representative in lowest terms with positive denominator, and the
      class is the rational $-3/4$.
    pitfalls: >
      Writing the relation as $a/b = c/d$ helps itself to division, the very
      operation being constructed. The restriction $b \ne 0$ is not
      housekeeping either: allow zero denominators and the relation stops being
      transitive, since $(1, 0) \sim (0, 0)$ and $(0, 0) \sim (5, 7)$ both hold
      while $(1, 0) \sim (5, 7)$ fails. And as with $\mathbb{Z}$, the rational
      is the class: $-3/4$ is not the pair $(-3, 4)$ but the whole infinite
      family equivalent to it.
    recap: >
      A rational number is an equivalence class of pairs of integers with
      nonzero second coordinate, two pairs agreeing exactly when they
      cross-multiply equally.
    steps:
      - teach: >
          $\mathbb{Z}$ solves $x + a = b$ always and $ax = b$ only sometimes.
          Repair it the same way as before: let a pair $(a, b)$ stand for the
          solution of $bx = a$, and then identify the pairs that ought to
          agree.
      - teach: >
          One thing is new: the second coordinate may not be $0$. The equation
          $0 \cdot x = a$ has no solution when $a \ne 0$ and every solution
          when $a = 0$, so such a pair names nothing either way.
      - ask: >
          What actually breaks if pairs with second coordinate $0$ are allowed?
        choices:
          - text: >
              Nothing serious — it just adds one extra class
            feedback: >
              It does not merely add: it destroys the relation. Check
              transitivity on the pairs below and the whole quotient collapses.
          - text: >
              The relation stops being transitive, since $(1, 0) \sim (0, 0)$
              and $(0, 0) \sim (5, 7)$ while $(1, 0) \sim (5, 7)$ is false
            correct: true
            feedback: >
              Exactly: $1 \cdot 0 = 0 \cdot 0$ and $0 \cdot 7 = 5 \cdot 0$ both
              hold, but $1 \cdot 7 \ne 5 \cdot 0$. With no equivalence relation
              there is no quotient at all.
          - text: >
              Classes become infinite
            feedback: >
              Classes are infinite already — $(1, 2)$, $(2, 4)$, $(3, 6)$ and
              so on all share a class. That is normal and harmless.
        feedback: >
          Transitivity fails, which means there is no equivalence relation and
          hence nothing to quotient by. The restriction is structural.
      - teach: >
          The relation itself: $(a, b) \sim (c, d)$ when $ad = cb$. That is
          $a/b = c/d$ with the division cleared away — written in the
          operations $\mathbb{Z}$ already has.
      - ask: >
          Which rational is the class of $(6, -8)$?
        expects: "-3/4"
        hint: >
          Divide out the common factor, then fix the sign of the denominator.
        feedback: >
          Dividing both coordinates by $2$ gives $(3, -4)$, and negating both
          gives the lowest-terms representative $(-3, 4)$. The class is
          $-3/4$.
      - teach: >
          Transitivity is the clause with content. From $ad = cb$ and
          $cf = ed$ you reach $d(af - eb) = 0$, and then you need to conclude
          $af = eb$.
      - ask: >
          Which property of $\mathbb{Z}$ licenses that last conclusion?
        choices:
          - text: >
              The absence of zero divisors
            correct: true
            feedback: >
              Right: $d \ne 0$ and $d(af - eb) = 0$ force $af - eb = 0$, and
              that step is available only because a product in $\mathbb{Z}$
              vanishes solely when a factor does.
          - text: >
              The well-ordering of the nonnegative integers
            feedback: >
              Nothing is being minimised here. This is a single algebraic
              cancellation, not a descent argument.
          - text: >
              Totality of the order on $\mathbb{Z}$
            feedback: >
              No comparison is made anywhere in the derivation — the whole
              argument is equations.
        feedback: >
          No zero divisors, applied to the nonzero $d$. That property of
          $\mathbb{Z}$ was proved back on $\mathbb{N}$ and carried up; the
          tower pays off here.
      - teach: >
          So $\mathbb{Q}$ is the quotient of $\mathbb{Z} \times (\mathbb{Z}
          \setminus \{0\})$ by that relation, and each class has one
          lowest-terms representative with positive denominator. As always, the
          number is the class, not the representative.

  - node: foundations.number-systems.rationals-operations
    hook: >
      You already know these formulas. This is where they stop being rules you
      were handed and become the only formulas compatible with what a rational
      number is.
    explanation: >
      Read $[(a, b)]$ as $a/b$ and the school rules are forced:
      $a/b + c/d = (ad + cb)/(bd)$ gives
      $[(a, b)] + [(c, d)] = [(ad + cb,\,bd)]$, and
      $a/b \cdot c/d = (ac)/(bd)$ gives $[(ac,\,bd)]$. Note that the answers
      are legal pairs: $b \ne 0$ and $d \ne 0$ force $bd \ne 0$, because
      $\mathbb{Z}$ has no zero divisors. The domain restriction is not merely
      imposed once, it has to be *maintained* by every operation.

      The order takes an extra step. Every class has a representative with
      positive second coordinate — negate both coordinates if necessary — and
      for such a representative you declare $[(a, b)] \ge 0$ to mean
      $a \ge 0$, with $x \le y$ meaning $y - x \ge 0$. So two things need
      checking rather than one: that a positive-denominator representative
      always exists, and that all of them return the same verdict.

      Then the usual obligation. For addition, suppose
      $(a, b) \sim (a', b')$, that is $ab' = a'b$. The requirement is
      $(ad + cb,\,bd) \sim (a'd + cb',\,b'd)$, which written out is
      $(ad + cb) b'd = (a'd + cb') bd$. Expand both sides: the left is
      $ab'd^2 + cbb'd$ and the right is $a'bd^2 + cb'bd$. The second terms are
      equal outright, and the first two are $d^2(ab')$ and $d^2(a'b)$, equal by
      hypothesis. Pure rearrangement, using commutativity and distributivity in
      $\mathbb{Z}$ — then repeat for the other argument.

      Finally $a \mapsto [(a, 1)]$ embeds $\mathbb{Z}$: it is injective since
      $a \cdot 1 = a' \cdot 1$ means $a = a'$, and substituting $b = d = 1$
      into the formulas returns the old sum, product and order. So
      $\mathbb{Z}$ sits inside $\mathbb{Q}$ with nothing changed.
    worked: >
      Check that addition does not depend on the representative, on one
      instance. The pairs $(1, 2)$ and $(3, 6)$ are equivalent, since
      $1 \cdot 6 = 6 = 3 \cdot 2$. Add $(1, 3)$ to each. First:
      $(1 \cdot 3 + 1 \cdot 2,\ 2 \cdot 3) = (5, 6)$. Second:
      $(3 \cdot 3 + 1 \cdot 6,\ 6 \cdot 3) = (15, 18)$. Are the answers
      equivalent? Cross-multiply: $5 \cdot 18 = 90$ and $15 \cdot 6 = 90$. Yes
      — both name $5/6$, and the choice of representative left no trace.
    pitfalls: >
      Adding numerators and denominators separately is not merely bad
      arithmetic, it fails to define anything: $(1, 2)$ and $(2, 4)$ are the
      same rational, but that rule sends the first with $(1, 3)$ to $(2, 5)$
      and the second with $(1, 3)$ to $(3, 7)$, and $2 \cdot 7 \ne 3 \cdot 5$.
      The order clause has its own trap — it is stated only for a
      representative with positive denominator, so applying it to $(-3, -4)$
      directly would declare the positive number $3/4$ negative.
    recap: >
      The rules for adding and multiplying fractions are exactly what the
      construction forces, and each carries the same
      representative-independence check as on $\mathbb{Z}$.
    steps:
      - teach: >
          Since $[(a, b)]$ means $a/b$, the operations are read off, not
          chosen: $[(ad + cb,\,bd)]$ for the sum and $[(ac,\,bd)]$ for the
          product. If the school rules had been anything else, they would have
          contradicted what the symbols mean.
      - teach: >
          Check first that the answers are legal. Both formulas have second
          coordinate $bd$, and $bd \ne 0$ precisely because $\mathbb{Z}$ has no
          zero divisors — the restriction has to survive every operation, not
          just the definition.
      - ask: >
          Apply the addition formula to $[(1, 2)] + [(1, 3)]$. What is the
          second coordinate of the resulting pair?
        expects: "6"
        hint: >
          The formula's second coordinate is always the product of the two
          denominators.
        feedback: >
          $bd = 2 \cdot 3 = 6$, and the full pair is
          $(1 \cdot 3 + 1 \cdot 2,\ 6) = (5, 6)$ — the rational $5/6$.
      - teach: >
          Now the obligation. Replacing $(1, 2)$ by the equivalent $(3, 6)$
          must not change the answer: $(3 \cdot 3 + 1 \cdot 6,\ 18) = (15,
          18)$, and $5 \cdot 18 = 90 = 15 \cdot 6$, so both results name the
          same class.
      - ask: >
          Why is "add the numerators, add the denominators" rejected?
        choices:
          - text: >
              Because it gives the wrong numerical answer
            feedback: >
              True but shallow, and it invites the reply "wrong according to
              what?" At this stage the formulas are being *derived*, so the
              objection has to be structural.
          - text: >
              Because it is not well defined: $(1, 2)$ and $(2, 4)$ are the
              same rational but give inequivalent answers
            correct: true
            feedback: >
              Exactly. With $(1, 3)$ the rule returns $(2, 5)$ from one
              representative and $(3, 7)$ from the other, and
              $2 \cdot 7 \ne 3 \cdot 5$. It defines no function on
              $\mathbb{Q}$ at all.
          - text: >
              Because the second coordinate could become $0$
            feedback: >
              A sum of two nonzero integers can be $0$, so that is a real
              worry, but it is not the fatal one — the rule fails even when
              every denominator stays nonzero.
        feedback: >
          It is not well defined. That is the strongest form of the objection,
          and it is available only because you know what a rational number
          actually is.
      - teach: >
          The order needs its own care: declare $[(a, b)] \ge 0$ to mean
          $a \ge 0$, but only for a representative with $b > 0$. Every class
          has one, obtained by negating both coordinates if necessary.
      - ask: >
          Why does the order clause insist on a positive denominator?
        choices:
          - text: >
              Because negative denominators are not allowed in $\mathbb{Q}$
            feedback: >
              They are perfectly legal — only $0$ is barred, and $(-3, -4)$ is
              a genuine representative of a genuine rational.
          - text: >
              Because $(-3, -4)$ has negative first coordinate but names the
              positive number $3/4$
            correct: true
            feedback: >
              Right. Reading off the sign of $a$ from that representative would
              declare $3/4$ negative, so the clause is stated for
              positive-denominator representatives and then checked to be
              independent of which one.
          - text: >
              Because otherwise the order would not be total
            feedback: >
              Totality is not the issue; the clause would still compare every
              pair of classes. It would simply compare them wrongly, and
              inconsistently.
        feedback: >
          Signs live in both coordinates, so the clause fixes one of them
          first. Every quotient definition needs a normalisation like this or a
          check that none is needed.
      - teach: >
          Last piece: $a \mapsto [(a, 1)]$ is injective and turns the new
          formulas into the old ones when $b = d = 1$. So $\mathbb{Z}$ sits
          inside $\mathbb{Q}$ with its arithmetic and order untouched.

  - node: foundations.number-systems.q-ordered-field
    hook: >
      This is the moment the specification is met in full. Every ordered-field
      axiom holds in $\mathbb{Q}$, and the one clause the construction was
      built for takes a single line.
    explanation: >
      Most of the verification is routine substitution into the formulas: (F1),
      (F3), (O1) and (O2) all reduce to identities in $\mathbb{Z}$. The clause
      with a story is (F2). First note when a class is zero:
      $[(a, b)] = [(0, 1)]$ says $a \cdot 1 = 0 \cdot b$, that is $a = 0$. So a
      nonzero class is one with $a \ne 0$ — and then $(b, a)$ is a *legal
      pair*, precisely because its second coordinate is nonzero. Check it:
      $[(a, b)] \cdot [(b, a)] = [(ab,\,ba)] = [(1, 1)] = 1$, since
      $ab \cdot 1 = 1 \cdot ba$.

      That single line is the whole purchase. Division by any nonzero element
      is now total, and $ax = b$ with $a \ne 0$ has the solution $b a^{-1}$,
      unique because multiplying $ax = ay$ by $a^{-1}$ gives $x = y$. The
      equation $\mathbb{Z}$ could not solve is solved.

      One consequence deserves isolating, because it reverses the situation in
      $\mathbb{N}$ and $\mathbb{Z}$. In any ordered field, $1 > 0$ gives
      $1 + 1 > 0$, so $1 + 1$ is nonzero and therefore invertible; and if
      $x < y$ then $2x < x + y < 2y$, so dividing through by the positive
      $1 + 1$ gives $x < (x + y)/2 < y$. Between any two elements there is a
      third, hence infinitely many. The order is *dense*.

      Notice what that argument used: the axioms, and nothing about the
      construction. So it is not that $\mathbb{Q}$ happens to be dense — *no*
      ordered field can be discretely ordered, and discreteness was not
      mislaid by a careless construction but ruled out by the specification
      itself.
    worked: >
      Invert a class and check the answer. Take $[(-3, 4)]$, the rational
      $-3/4$. Its first coordinate is nonzero, so the inverse is $[(4, -3)]$,
      a legal pair. Verify by the product formula:
      $[(-3, 4)] \cdot [(4, -3)] = [((-3) \cdot 4,\ 4 \cdot (-3))] =
      [(-12, -12)]$, and $(-12, -12) \sim (1, 1)$ because
      $(-12) \cdot 1 = 1 \cdot (-12)$. So the product is $1$. Now density on
      the same footing: between $1/3$ and $1/2$ sits their midpoint
      $(1/3 + 1/2)/2 = (5/6)/2 = 5/12$, and indeed
      $4/12 < 5/12 < 6/12$.
    pitfalls: >
      The inverse rule swaps the coordinates and needs $a \ne 0$ — swapping a
      pair with zero numerator produces $(b, 0)$, which is not a legal pair at
      all. That is the construction's own way of saying $0$ has no
      multiplicative inverse, and it is worth seeing that the obstruction is
      structural rather than a convention. The second trap is treating density
      as a discovery about $\mathbb{Q}$: it follows from the axioms alone, so
      hunting for the "next" rational after a given one is hunting for
      something the specification forbids.
    recap: >
      $\mathbb{Q}$ is the first system in the tower with all four operations,
      and its order is dense — a property forced by the axioms rather than by
      the construction.
    steps:
      - teach: >
          The verification is mostly substitution: (F1), (F3), (O1) and (O2)
          come straight out of the formulas. Everything interesting is in (F2),
          the clause the construction exists to satisfy.
      - teach: >
          A class is zero exactly when its first coordinate is: $[(a, b)] =
          [(0, 1)]$ says $a \cdot 1 = 0 \cdot b$. So for a nonzero class,
          $a \ne 0$, and the swapped pair $(b, a)$ is legal.
      - ask: >
          What goes wrong if you try to invert $0 = [(0, 1)]$ by that same
          rule?
        choices:
          - text: >
              Nothing — the swap gives $(1, 0)$, which is the inverse of $0$
            feedback: >
              $(1, 0)$ is not a pair in the domain at all: second coordinates
              are barred from being $0$, so this names no rational number.
          - text: >
              The swap produces $(1, 0)$, whose second coordinate is barred, so
              there is no class to point at
            correct: true
            feedback: >
              Exactly. The construction refuses to produce an inverse for $0$
              structurally, not by decree — which is the same reason (F2)
              carries its "nonzero" qualifier.
          - text: >
              The swap gives a pair equivalent to $0$ again
            feedback: >
              It gives no legal pair at all, so there is nothing to be
              equivalent to. Check the domain before checking the class.
          - text: >
              The product $[(0, 1)] \cdot [(1, 0)]$ comes out as $0$
            feedback: >
              There is no such product to compute — the second factor is not an
              element of $\mathbb{Q}$, so the multiplication formula never gets
              applied.
        feedback: >
          The swap leaves the domain. That single failure is exactly the gap
          (F2) writes into the axioms.
      - teach: >
          With inverses in hand, division by any nonzero element is total, and
          $ax = b$ with $a \ne 0$ has the unique solution $ba^{-1}$. That is
          the equation $\mathbb{Z}$ could not solve, now solved.
      - ask: >
          What is the midpoint of $1/3$ and $1/2$?
        expects: "5/12"
        hint: >
          Add them and multiply by the inverse of $1 + 1$.
        feedback: >
          $1/3 + 1/2 = 5/6$, and half of that is $5/12$. In twelfths the three
          numbers read $4/12 < 5/12 < 6/12$, so the midpoint genuinely lies
          strictly between.
      - teach: >
          That construction always works. From $x < y$ you get
          $2x < x + y < 2y$, and dividing by the positive element $1 + 1$
          gives $x < (x + y)/2 < y$. Between any two elements there is a third,
          hence infinitely many.
      - ask: >
          What does that argument actually establish?
        choices:
          - text: >
              That $\mathbb{Q}$ is dense, though other ordered fields might be
              discrete
            feedback: >
              Nothing about $\mathbb{Q}$ was used — only $1 > 0$, invertibility
              of $1 + 1$, and (O1). So the conclusion is far wider than
              $\mathbb{Q}$.
          - text: >
              That no ordered field can be discretely ordered
            correct: true
            feedback: >
              Right. The halving argument runs in any ordered field, so
              discreteness is incompatible with the axioms themselves, not lost
              by an accident of the construction.
          - text: >
              That $\mathbb{Q}$ has no least element
            feedback: >
              True, but a different fact, proved by a different argument
              (subtract $1$ repeatedly). Density is about what sits *between*
              two elements.
        feedback: >
          No ordered field is discrete. Discreteness was the price of the
          previous step, and the specification is what charged it.
      - teach: >
          So $\mathbb{Q}$ meets the specification exactly: four operations,
          a total order compatible with them, dense rather than discrete. If
          something is still wrong with $\mathbb{Q}$, no ordered-field axiom
          can be the one to say so.

  - node: foundations.number-systems.q-not-complete
    hook: >
      $\mathbb{Q}$ satisfies every axiom on the list and still has holes. This
      is the proof: a bounded, nonempty set of rationals with no least upper
      bound — a defect no amount of algebra can repair.
    explanation: >
      Take $A = \{q \in \mathbb{Q} : q > 0 \text{ and } q^2 < 2\}$. It is
      nonempty, since $1 \in A$. It is bounded above by $2$: if $q \ge 2$ then
      $q^2 \ge 4$, so no element of $A$ reaches $2$. By the definition of a
      least upper bound in a poset, a supremum of $A$ would be an upper bound
      $b$ with $b \le c$ for every other upper bound $c$. The claim is that no
      rational $b$ manages both.

      Suppose one did. Then $b \ge 1$, since $1 \in A$, so $b > 0$. And no
      rational squares to $2$ — that is the classic irrationality proof — so
      trichotomy leaves exactly two cases, $b^2 < 2$ and $b^2 > 2$, with no
      third to worry about.

      Now the device. Put $b' = (2b + 2)/(b + 2)$, again a positive rational.
      Two identities carry the whole argument:
      $b' - b = (2 - b^2)/(b + 2)$ and
      $(b')^2 - 2 = 2(b^2 - 2)/(b + 2)^2$. Since $b + 2 > 0$, the first says
      $b' - b$ has the sign of $2 - b^2$, and the second says $(b')^2 - 2$ has
      the sign of $b^2 - 2$. So if $b^2 < 2$ then $b' > b$ with $(b')^2 < 2$,
      putting $b' \in A$ — and $b$ was not even an upper bound. If $b^2 > 2$
      then $b' < b$ with $(b')^2 > 2$, and $b'$ is still an upper bound,
      because any $q \in A$ has $q^2 < 2 < (b')^2$ with both positive, forcing
      $q < b'$ — so $b$ was not the *least* upper bound. Either case
      contradicts the assumption.

      Read the conclusion carefully. The failure is in the order, not the
      arithmetic: $\mathbb{Q}$ satisfies every ordered-field axiom, so no
      consequence of those axioms could ever have excluded this. Repairing it
      means adding a statement about the order — the least-upper-bound
      property, which you have already met as the Completeness axiom of
      $\mathbb{R}$. That set is the reason the axiom is not vacuous.
    worked: >
      Run one case with numbers. Take $b = 3/2$, so $b^2 = 9/4 > 2$; it is an
      upper bound of $A$, since $q \in A$ gives $q^2 < 2 < 9/4$ and hence
      $q < 3/2$. Compute
      $b' = (2 \cdot 3/2 + 2)/(3/2 + 2) = 5/(7/2) = 10/7$. Its square is
      $100/49$, which beats $2 = 98/49$, so $b'$ is still an upper bound by the
      same comparison. And $10/7$ is about $1.4286$, strictly less than $1.5$.
      So $3/2$ was not the least upper bound. Feed $10/7$ back in and you get a
      smaller upper bound again, forever, without ever arriving.
    pitfalls: >
      The theorem is not "$\sqrt{2}$ does not exist" — it is that *this set has
      no least upper bound in $\mathbb{Q}$*, and the very same set will acquire
      one the moment the system is enlarged. Nor is the defect algebraic:
      $\mathbb{Q}$ passes every ordered-field axiom, so looking for an
      arithmetic repair is looking for something that provably cannot exist.
    recap: >
      A nonempty bounded set of rationals can fail to have a least upper bound,
      and since $\mathbb{Q}$ satisfies every ordered-field axiom, the repair
      has to be a new statement about the order.
    steps:
      - teach: >
          $\mathbb{Q}$ meets the whole specification, so any remaining defect
          must be invisible to the axioms. Here is one:
          $A = \{q \in \mathbb{Q} : q > 0 \text{ and } q^2 < 2\}$.
      - teach: >
          $A$ is nonempty because $1 \in A$, and bounded above by $2$ because
          $q \ge 2$ forces $q^2 \ge 4$. So it is exactly the kind of set that
          ought to have a least upper bound.
      - ask: >
          The proof splits into the cases $b^2 < 2$ and $b^2 > 2$. Which fact
          makes those two exhaustive?
        choices:
          - text: >
              That $A$ is bounded above
            feedback: >
              Boundedness is what makes the question worth asking, but it says
              nothing about the possible values of $b^2$.
          - text: >
              That no rational number has square $2$
            correct: true
            feedback: >
              Right — the irrationality of $\sqrt{2}$ is exactly what removes
              the third case, and it is the one ingredient imported from
              outside this proof.
          - text: >
              That $b \ge 1$
            feedback: >
              That only fixes the sign of $b$, which the argument does need
              later. It leaves $b^2 = 2$ wide open.
        feedback: >
          No rational squares to $2$. Without that, $b^2 = 2$ would be a third
          case — and in it $b$ really would be the supremum.
      - teach: >
          The device is a single formula: $b' = (2b + 2)/(b + 2)$. Two
          identities do everything: $b' - b = (2 - b^2)/(b + 2)$ and
          $(b')^2 - 2 = 2(b^2 - 2)/(b + 2)^2$, with $b + 2 > 0$ throughout.
      - ask: >
          For $b = 3/2$, what is $b'$?
        expects: "10/7"
        hint: >
          Substitute into $(2b + 2)/(b + 2)$ and simplify the compound
          fraction.
        feedback: >
          $b' = (3 + 2)/(3/2 + 2) = 5/(7/2) = 10/7$. Its square is $100/49$,
          still above $2 = 98/49$, and $10/7 < 3/2$ — a strictly smaller upper
          bound.
      - teach: >
          That is the whole proof. If $b^2 < 2$ then $b' > b$ and $b' \in A$,
          so $b$ was not an upper bound; if $b^2 > 2$ then $b' < b$ and $b'$ is
          an upper bound, so $b$ was not the least one. Every candidate fails.
      - ask: >
          What has been proved?
        choices:
          - text: >
              That $\sqrt{2}$ does not exist
            feedback: >
              Nothing here rules out a square root of $2$ in a larger system —
              and one will be produced later in this unit. The claim is about
              $\mathbb{Q}$ only.
          - text: >
              That $A$ has no least upper bound in $\mathbb{Q}$, though it may
              have one in a larger ordered field
            correct: true
            feedback: >
              Exactly the right reading. The set is fine; the system it lives
              in is the thing that fails, and enlarging the system is the
              repair.
          - text: >
              That $A$ is unbounded above
            feedback: >
              $A$ is bounded above by $2$ — that was checked at the start. It
              has upper bounds in abundance; what it lacks is a *least* one.
        feedback: >
          The gap is in $\mathbb{Q}$, not in $A$. That distinction is the whole
          content of the theorem.
      - teach: >
          Since $\mathbb{Q}$ passes every ordered-field axiom, no consequence
          of them can exclude this gap. The repair has to be a new demand on
          the order — the least-upper-bound property, which you met as the
          Completeness axiom of $\mathbb{R}$, and which the set $A$ shows
          is not an empty requirement.

  - node: foundations.number-systems.dedekind-cuts
    hook: >
      You have a hole in $\mathbb{Q}$ and a perfectly good description of it:
      the set of rationals lying below the missing number. Dedekind's move is
      to stop describing the hole and declare that the description *is* the
      number.
    explanation: >
      A cut is a set $\alpha \subseteq \mathbb{Q}$ satisfying three clauses:
      (i) $\alpha$ is neither empty nor all of $\mathbb{Q}$; (ii) $\alpha$ is
      closed downwards, so $p \in \alpha$ and $q < p$ force $q \in \alpha$;
      (iii) $\alpha$ has no greatest element. Define $\mathbb{R}$ to be the set
      of all cuts. A real number, on this construction, is a set of rationals.

      The order is inclusion: $\alpha \le \beta$ means
      $\alpha \subseteq \beta$. Reflexivity, transitivity and antisymmetry come
      free from inclusion, and totality is the one check with content — if
      $\alpha$ is not contained in $\beta$, pick $p \in \alpha$ outside
      $\beta$; then every $q \in \beta$ satisfies $q < p$, since $q \ge p$ with
      downward closure would drag $p$ into $\beta$, and so $\beta \subseteq
      \alpha$.

      Addition is $\alpha + \beta = \{p + q : p \in \alpha,\ q \in \beta\}$,
      the zero element is $0^{\ast} = \{p \in \mathbb{Q} : p < 0\}$, and
      $\mathbb{Q}$ embeds by $r \mapsto r^{\ast} = \{p \in \mathbb{Q} : p <
      r\}$ — strict inequality, because clause (iii) forbids a greatest
      element. Multiplication is defined first for cuts at least $0^{\ast}$ and
      then extended by cases on signs, the only tedious part of the
      verification.

      The shape is this: the least-upper-bound property becomes almost free. If
      a nonempty family of cuts is bounded above by some cut $\gamma$, take the
      union of the family. It is nonempty; it is not all of $\mathbb{Q}$,
      because it sits inside $\gamma$; it is downward closed, because each
      member is; and it has no greatest element, because any element of it
      belongs to some member, which has none. So the union is a cut, it
      contains every member, and it is contained in every upper bound. The
      supremum is the union — a set-theoretic operation doing the work that
      failed outright in $\mathbb{Q}$.
    worked: >
      Exhibit the cut that will be $\sqrt{2}$:
      $\alpha = \{p \in \mathbb{Q} : p < 0 \text{ or } p^2 < 2\}$. Clause (i):
      $0 \in \alpha$, so it is nonempty, and $2 \notin \alpha$ since
      $4 > 2$, so it is not all of $\mathbb{Q}$. Clause (ii): if $q < p$ and
      $p \in \alpha$, then either $q < 0$, putting $q$ in, or
      $0 \le q < p$, and then $q^2 < p^2 < 2$. Clause (iii): given $p \in
      \alpha$ with $p > 0$, the earlier substitution $p' = (2p + 2)/(p + 2)$
      gives $p' > p$ with $(p')^2 < 2$, so $p' \in \alpha$ is larger; and if
      $p \le 0$ then $1 \in \alpha$ is larger. So $\alpha$ is a cut, and it is a
      real number whose description required no formula for it at all.
    pitfalls: >
      Clause (iii) is not decoration. Without it both
      $\{p \in \mathbb{Q} : p < 1\}$ and $\{p \in \mathbb{Q} : p \le 1\}$ would
      be cuts, and the number $1$ would have two names — the construction would
      produce a duplicated real line. The other adjustment to make is
      conceptual: a cut *is* a set of rationals, so there is no separate "value"
      hiding behind it, and the operations are genuinely operations on sets.
    recap: >
      A real number is defined to be the set of all rationals below it, ordered
      by inclusion — which makes the supremum of a bounded family nothing more
      than its union.
    steps:
      - teach: >
          The hole in $\mathbb{Q}$ already has a perfect description: the set of
          rationals below it. Rather than invent a new object to sit in the
          hole, take the description itself as the object.
      - teach: >
          A cut is a set $\alpha$ of rationals that is (i) neither empty nor
          everything, (ii) closed downwards, and (iii) without a greatest
          element. Define $\mathbb{R}$ to be the set of all cuts, ordered by
          inclusion.
      - ask: >
          Which of these sets of rationals is a cut?
        choices:
          - text: >
              $\{p \in \mathbb{Q} : p \le 1\}$
            feedback: >
              It fails clause (iii): $1$ is a greatest element. Allowing this
              would give the number $1$ two different names.
          - text: >
              $\{p \in \mathbb{Q} : p < 1\}$
            correct: true
            feedback: >
              Nonempty, not everything, downward closed, and with no greatest
              element since between any $p < 1$ and $1$ there is another
              rational. This is the cut $1^{\ast}$.
          - text: >
              $\{p \in \mathbb{Q} : p > 1\}$
            feedback: >
              It fails clause (ii): $2$ is in it and $0 < 2$ is not. Cuts are
              closed *downwards* — they are the rationals below something, not
              above it.
          - text: >
              $\mathbb{Q}$ itself
            feedback: >
              It fails clause (i) outright. If all of $\mathbb{Q}$ counted, it
              would be a real number greater than every other one.
        feedback: >
          $\{p : p < 1\}$, and each rejected option fails a different clause —
          which is a good sign that none of the three clauses is redundant.
      - ask: >
          How many of the three clauses does $\{p \in \mathbb{Q} : p \le 1\}$
          satisfy?
        expects: "2"
        hint: >
          Test nonemptiness, downward closure, and the absence of a greatest
          element one at a time.
        feedback: >
          Two. It is neither empty nor all of $\mathbb{Q}$, and it is closed
          downwards; it fails only clause (iii), because $1$ is a greatest
          element.
      - teach: >
          The order is inclusion, and totality is the check with content: if
          $p \in \alpha$ lies outside $\beta$, then every $q \in \beta$ must
          satisfy $q < p$, since otherwise downward closure would put $p$ into
          $\beta$. So $\beta \subseteq \alpha$.
      - teach: >
          Now the interesting cut:
          $\alpha = \{p \in \mathbb{Q} : p < 0 \text{ or } p^2 < 2\}$. It is
          nonempty ($0$ is in it), it is not everything ($2$ is out), and it is
          downward closed by comparing squares.
      - ask: >
          Which clause of the cut definition is verified by the substitution
          $p' = (2p + 2)/(p + 2)$ from the incompleteness proof?
        choices:
          - text: >
              Clause (i), that $\alpha$ is neither empty nor everything
            feedback: >
              That one is settled by exhibiting $0$ inside and $2$ outside; no
              substitution is needed.
          - text: >
              Clause (ii), downward closure
            feedback: >
              Downward closure is settled by comparing squares of nonnegative
              rationals. The substitution produces a *larger* element, not a
              smaller one.
          - text: >
              Clause (iii), that $\alpha$ has no greatest element
            correct: true
            feedback: >
              Exactly. For $p \in \alpha$ with $p > 0$, that formula produces
              $p' > p$ still inside $\alpha$ — the same computation that
              stopped $\mathbb{Q}$ from having a supremum now certifies the
              cut.
        feedback: >
          Clause (iii). The failure of $\mathbb{Q}$ and the success of the cut
          construction are literally the same computation, read in two
          directions.
      - teach: >
          The payoff: for a nonempty family of cuts bounded above, the union is
          a cut, contains every member, and lies inside every upper bound. The
          supremum is the union — the property $\mathbb{Q}$ lacked, delivered
          by set theory.

  - node: foundations.number-systems.cauchy-reals
    hook: >
      The second construction defines a real number to be a scheme for
      approximating it. It costs more work than cuts and buys something the
      cuts cannot: it transplants unchanged to every metric space you will meet
      later.
    explanation: >
      Write $|x|$ for $x$ or $-x$ according to sign. A sequence $(a_n)$ of
      rationals is Cauchy when for every rational $\varepsilon > 0$ there is an
      $N$ with $|a_m - a_n| < \varepsilon$ for all $m, n \ge N$: the terms
      eventually crowd together. Notice what the condition does *not* mention —
      a limit. It cannot, because the limit is usually not in $\mathbb{Q}$ and
      is the very thing being constructed.

      Let $C$ be the set of Cauchy sequences of rationals and put
      $(a_n) \sim (b_n)$ when for every rational $\varepsilon > 0$ there is $N$
      with $|a_n - b_n| < \varepsilon$ for all $n \ge N$ — two schemes that
      close in on each other. This is an equivalence relation, transitivity
      coming from the triangle inequality with $\varepsilon$ halved twice.
      Define $\mathbb{R} = C/{\sim}$.

      The operations are termwise: $[(a_n)] + [(b_n)] = [(a_n + b_n)]$ and
      $[(a_n)] \cdot [(b_n)] = [(a_n b_n)]$. Each carries two obligations
      rather than one — the result must again be Cauchy, and it must not depend
      on representatives. For products the first obligation is where
      boundedness of Cauchy sequences is spent, through
      $|a_m b_m - a_n b_n| \le |a_m| |b_m - b_n| + |b_n| |a_m - a_n|$: without
      a bound on $|a_m|$ and $|b_n|$ the right-hand side does not shrink.

      The order takes care: declare $[(a_n)] > 0$ when some rational
      $\varepsilon > 0$ and index $N$ have $a_n > \varepsilon$ for all
      $n \ge N$. Termwise positivity is *not* enough — $a_n = 1/n$ is positive
      at every index and its class is $0$. The rationals embed as the classes
      of constant sequences, and because the whole definition is phrased in the
      distance $|a_m - a_n|$, it generalizes verbatim to the completion of any
      metric space. That is why this construction, and not the cut
      construction, is the one that reappears later.
    worked: >
      Build the scheme for $\sqrt{2}$ explicitly. Let $a_n$ be the largest
      rational of the form $k/10^n$, with $k$ a natural number, whose square is
      below $2$: so $a_0 = 1$, $a_1 = 1.4$, $a_2 = 1.41$, $a_3 = 1.414$. For
      $m \ge n$ the two terms agree to $n$ decimal places, giving
      $|a_m - a_n| \le 10^{-n}$, and $10^{-n}$ eventually drops below any
      positive rational — so the sequence is Cauchy. Its class is a real
      number, and it is the one whose square is $2$, described by an
      approximation scheme rather than by a formula.
    pitfalls: >
      The equality $0.999\ldots = 1$ is settled here, and not by a convention:
      the sequence $0.9, 0.99, 0.999, \ldots$ and the constant sequence $1$
      differ by $10^{-n}$ at index $n$, which falls below every positive
      rational, so the two sequences are equivalent and the two decimal
      notations are two representatives of *one* class — exactly as $(1, 2)$
      and $(2, 4)$ are one rational. The second trap is reading positivity
      termwise: $a_n = 1/n$ is positive at every index while its class is $0$,
      which is why the definition demands a fixed $\varepsilon$ that the terms
      eventually stay above.
    recap: >
      A real number is an equivalence class of Cauchy sequences of rationals,
      two sequences counting as equal when their terms close in on each other.
    steps:
      - teach: >
          Second idea, same goal. Instead of naming a real number by the
          rationals below it, name it by a way of approximating it to any
          rational precision you like.
      - teach: >
          $(a_n)$ is Cauchy when for every rational $\varepsilon > 0$ there is
          an $N$ with $|a_m - a_n| < \varepsilon$ for all $m, n \ge N$. The
          condition compares terms with *each other*, never with a limit —
          which is essential, since the limit is what is being built.
      - teach: >
          Two schemes should count as equal when they close in on each other:
          $(a_n) \sim (b_n)$ when $|a_n - b_n|$ eventually stays below every
          positive rational. That is an equivalence relation, and
          $\mathbb{R} = C/{\sim}$.
      - ask: >
          The truncations $1, 1.4, 1.41, 1.414, \ldots$ satisfy
          $|a_m - a_n| \le 10^{-n}$ whenever $m \ge n$. Using that bound, what
          is the smallest $N$ guaranteeing $|a_m - a_n| < 1/100$ for all
          $m, n \ge N$?
        expects: "3"
        hint: >
          For $m, n \ge N$ the bound is at worst $10^{-N}$; find the least $N$
          making that strictly smaller than $1/100$.
        feedback: >
          $N = 3$. At $N = 2$ the bound is $10^{-2} = 1/100$, which is not
          strictly smaller; at $N = 3$ it is $1/1000 < 1/100$. Each extra
          decimal place buys a factor of ten.
      - teach: >
          Operations are termwise, and each needs two checks: that the result
          is still Cauchy, and that it does not depend on the representatives.
          For products the first check is where boundedness of Cauchy sequences
          is spent.
      - ask: >
          Do $0.9, 0.99, 0.999, \ldots$ and the constant sequence $1$ define
          the same real number?
        choices:
          - text: >
              No — every term of the first is strictly less than $1$
            feedback: >
              Every term being smaller is irrelevant: the relation compares the
              *differences* against every positive rational, not the terms
              against each other.
          - text: >
              Yes — their difference at index $n$ is $10^{-n}$, which
              eventually falls below every positive rational
            correct: true
            feedback: >
              Exactly. They are two representatives of one class, so
              $0.999\ldots = 1$ is an identity of real numbers, not an
              approximation and not a convention.
          - text: >
              Only in the limit, which is a different question
            feedback: >
              There is no separate "limit" step here. Equality of real numbers
              *is* the equivalence of schemes, so the question is settled the
              moment the differences shrink.
        feedback: >
          The same number. This construction makes recurring decimals a
          statement about representatives, which is where the usual confusion
          about $0.999\ldots$ dissolves.
      - ask: >
          Is the class of $a_n = 1/n$ positive?
        choices:
          - text: >
              Yes, since every term is positive
            feedback: >
              Termwise positivity is not the definition — and it had better not
              be, since these terms shrink to nothing.
          - text: >
              No: the definition needs a fixed $\varepsilon > 0$ that the terms
              eventually stay above, and this class is $0$
            correct: true
            feedback: >
              Right. $1/n$ eventually drops below any $\varepsilon$ you fix, so
              the sequence is equivalent to the constant sequence $0$ and its
              class is zero.
          - text: >
              Undefined, because $1/n$ has no limit in $\mathbb{Q}$
            feedback: >
              It does have a limit in $\mathbb{Q}$, namely $0$ — and in any
              case the order is defined directly on representatives, with no
              limit required.
        feedback: >
          Its class is $0$. Fixing $\varepsilon$ before the index is what makes
          the order well behaved, and it is the same quantifier discipline the
          Cauchy condition uses.
      - teach: >
          The rationals embed as constant sequences, and every definition here
          is phrased in the distance $|a_m - a_n|$. Replace that distance by
          any other and the construction runs unchanged — which is why this one
          reappears whenever a space needs completing.

  - node: foundations.number-systems.r-existence
    hook: >
      Until now the least-upper-bound property has been an axiom — assumed,
      with a debt outstanding. This theorem discharges it: a complete ordered
      field is not postulated but built, out of $\mathbb{N}$, in three explicit
      steps.
    explanation: >
      Call an ordered field *complete* when every nonempty subset of it that is
      bounded above has a least upper bound inside it. The theorem: a complete
      ordered field exists, and it contains $\mathbb{Q}$ as a
      sub-ordered-field. Both constructions produce one, and they differ
      interestingly in where the difficulty sits.

      For cuts, the field and order axioms are checked directly — laborious
      only in the sign cases of multiplication — and completeness is nearly
      immediate. The supremum of a nonempty family bounded above is the union
      of the family, which survives all three clauses: nonempty because the
      family is, short of $\mathbb{Q}$ because it sits inside an upper bound,
      and downward closed with no greatest element because each member is.

      For Cauchy classes, the field axioms are routine except one. The inverse
      is the problem: taking reciprocals termwise is illegal if terms sit near
      zero. The repair is that a class which is not $0$ has terms that do not
      eventually get within every $\varepsilon$ of zero, and the Cauchy
      condition then yields a fixed $\varepsilon > 0$ and an $N$ with
      $|a_n| > \varepsilon$ beyond $N$. Change the first finitely many terms —
      which cannot change the class — and the reciprocals are Cauchy, since
      $|1/a_m - 1/a_n| = |a_n - a_m| / |a_m a_n| \le |a_n - a_m| /
      \varepsilon^2$.

      Completeness there comes by bisection: trap the supremum between a point
      that is not an upper bound and one that is, and halve the interval
      repeatedly, keeping that property. The endpoint sequences are Cauchy and
      equivalent, since the length halves each time, so their common class is
      the supremum.

      So the least-upper-bound property need not be taken on faith. It is a
      theorem about an object built from the Peano axioms by explicit means,
      and analysis may assume it without incurring a debt.
    worked: >
      Watch completeness work on one family. Take the cuts $\alpha_n =
      a_n^{\ast}$ for the truncations $a_0 = 1$, $a_1 = 1.4$, $a_2 = 1.41$, and
      so on. Every $a_n < 2$, so the family is bounded above by $2^{\ast}$, and
      it is nonempty. Its union is the set of rationals lying below some
      truncation: nonempty, missing $2$, downward closed as a union of
      downward-closed sets, and with no greatest element because none of the
      $\alpha_n$ has one. So the union is a cut, and it is exactly the cut
      $\{p : p < 0 \text{ or } p^2 < 2\}$ — the supremum of the family, and the
      same real number the Cauchy construction produced from the same
      truncations.
    pitfalls: >
      "Complete" here means order-complete — every bounded nonempty set has a
      supremum — and not "every Cauchy sequence converges"; the two coincide
      for Archimedean ordered fields but are different statements, and it is
      the order version that is being proved. And the theorem says only that
      each construction produces *a* complete ordered field. That they produce
      the same one is a separate theorem, and it is not obvious: a set of sets
      of rationals and a set of classes of sequences have nothing in common on
      the face of it.
    recap: >
      A complete ordered field exists, built explicitly from $\mathbb{N}$, so
      the least-upper-bound property is a theorem about a constructed object
      rather than an article of faith.
    steps:
      - teach: >
          Call an ordered field complete when every nonempty subset bounded
          above has a least upper bound in it. The claim to prove is that such
          a field exists — which turns an axiom you were given into a theorem.
      - teach: >
          The cut construction makes completeness nearly free. For a nonempty
          family of cuts bounded above, the union is again a cut, it contains
          every member, and it sits inside every upper bound. So it is the
          supremum.
      - ask: >
          Which clause of the cut definition is the one that needs the family
          to be bounded above?
        choices:
          - text: >
              Clause (i), that the union is not all of $\mathbb{Q}$
            correct: true
            feedback: >
              Exactly. Without an upper bound the union could swallow every
              rational — take all the cuts $n^{\ast}$ — and then it is not a
              cut at all.
          - text: >
              Clause (ii), downward closure
            feedback: >
              A union of downward-closed sets is downward closed no matter how
              many there are or how large they get. Boundedness plays no part.
          - text: >
              Clause (iii), no greatest element
            feedback: >
              If any element of the union came with a greater one inside its
              own member, that greater one is in the union too — again
              regardless of boundedness.
        feedback: >
          Clause (i). That is why the least-upper-bound property is stated for
          sets bounded above: unbounded families genuinely have no supremum to
          find.
      - teach: >
          For the Cauchy construction the field axioms are routine except one:
          the multiplicative inverse. Taking reciprocals termwise is illegal if
          any terms sit near zero, so something has to rule that out.
      - ask: >
          Why does a nonzero Cauchy class have a representative whose terms
          stay away from $0$?
        choices:
          - text: >
              Because every Cauchy sequence is bounded
            feedback: >
              Boundedness keeps terms from running off to infinity, which is
              what the *product* check needs. It says nothing about terms
              staying away from zero.
          - text: >
              Because not being equivalent to $0$, together with the Cauchy
              condition, yields a fixed $\varepsilon$ and an $N$ with
              $|a_n| > \varepsilon$ beyond $N$
            correct: true
            feedback: >
              Right. Failing to be equivalent to $0$ gives infinitely many
              terms above some $\varepsilon$; the Cauchy condition then drags
              the rest up with them. Adjust the first few terms and take
              reciprocals.
          - text: >
              Because you may simply define the inverse to be $0$ where the
              terms vanish
            feedback: >
              That would not produce a Cauchy sequence, and it certainly would
              not multiply back to $1$. The inverse has to be constructed, not
              patched.
        feedback: >
          The class being nonzero is exactly the hypothesis that pushes the
          terms off zero. This is the single non-routine field axiom in the
          construction.
      - teach: >
          Completeness for Cauchy classes comes by bisection: trap the supremum
          between a non-upper-bound and an upper bound, halve the interval
          repeatedly, and the two endpoint sequences are Cauchy and equivalent.
          Their common class is the supremum.
      - ask: >
          What has the theorem established about the two constructions?
        choices:
          - text: >
              That they produce the same object
            feedback: >
              Not yet — a set of sets of rationals and a set of classes of
              sequences are wildly different sets. That they are isomorphic is
              the next theorem, and it needs an argument.
          - text: >
              That each produces some complete ordered field
            correct: true
            feedback: >
              Exactly what was claimed and no more. Existence first;
              uniqueness is a separate question with a separate proof.
          - text: >
              That the least-upper-bound property follows from the ordered
              field axioms
            feedback: >
              It does not, and cannot: $\mathbb{Q}$ satisfies those axioms and
              fails completeness. What the theorem shows is that some field
              satisfies both.
        feedback: >
          Existence, for each construction separately. The debt from the
          Completeness axiom is now discharged — analysis can assume the
          property without owing anything.

  - node: foundations.number-systems.r-uniqueness
    hook: >
      Two constructions, two objects that could hardly look less alike: a set
      of sets of rationals, and a set of classes of sequences. This theorem
      says they are the same field — and so "the real numbers" names one thing.
    explanation: >
      The statement: if $F$ and $F'$ are complete ordered fields, there is
      exactly one field isomorphism $f : F \to F'$, and it automatically
      preserves order. Both halves matter — uniqueness says there is no choice
      to make, and the automatic order says the arithmetic already knows the
      ordering.

      The map is forced rather than chosen. An isomorphism sends $1$ to $1$,
      and additivity then forces $f$ on the copy of $\mathbb{N}$ inside $F$ by
      induction: $f(n + 1) = f(n) + 1$. Additive inverses extend this to
      $\mathbb{Z}$, and multiplicativity extends it to $\mathbb{Q}$, since
      $f(b) f(a/b) = f(a)$ pins $f(a/b)$ down. At this stage $f$ has no freedom
      left anywhere on the rationals.

      Completeness closes the gap. In a complete ordered field every element is
      the supremum of the rationals below it, so $f(x) = \sup \{f(q) : q \in
      \mathbb{Q},\ q < x\}$ — again forced, not chosen. What remains is to
      check that this formula really is additive, multiplicative and
      bijective, which is routine and unsurprising.

      Order preservation is the elegant part. In a complete ordered field the
      nonnegative elements are exactly the squares, because every nonnegative
      element has a square root. "Being a square" is a condition written in
      $+$ and $\cdot$ alone, so any field isomorphism must respect it, and then
      $x \le y$ iff $y - x$ is a square iff $f(y) - f(x)$ is a square iff
      $f(x) \le f(y)$. So one may finally say *the* real numbers — the same
      conclusion, by the same style of argument, that made *the* natural
      numbers legitimate one level down.
    worked: >
      Trace the forcing on particular elements. $f(1) = 1$; additivity gives
      $f(2) = f(1 + 1) = 2$, and induction gives $f(n) = n$ for every natural
      $n$. Then $f(0) = 0$ and $f(-x) = -f(x)$ carry it to $\mathbb{Z}$. For
      $3/4$: multiplicativity gives $f(4) \cdot f(3/4) = f(4 \cdot 3/4) = f(3)
      = 3$, and $f(4) = 4$, so $f(3/4) = 3/4$. Every rational is pinned this
      way. For an element with no rational name — the one whose square is $2$ —
      $f$ is the supremum of its values on the rationals below, determined
      exactly though never written as a formula.
    pitfalls: >
      Uniqueness is about isomorphism, not identity: a cut and a class of
      Cauchy sequences remain entirely different sets, and the theorem says
      only that nothing expressible in the structure can tell them apart. And
      the automatic preservation of order genuinely needs completeness — the
      rationals with $\sqrt{2}$ adjoined form an ordered field with a field
      automorphism exchanging $\sqrt{2}$ and $-\sqrt{2}$, which does not
      preserve the order at all.
    recap: >
      The ordered field axioms plus completeness pin down a single structure up
      to unique isomorphism, so the cut construction and the Cauchy
      construction describe one and the same object.
    steps:
      - teach: >
          Two constructions have produced complete ordered fields. Are they the
          same field, or two different ones that happen to satisfy the same
          list? The answer decides whether "the real numbers" is a legitimate
          phrase.
      - teach: >
          Start forcing the map. Any isomorphism sends $1$ to $1$; additivity
          then gives $f(n) = n$ on the naturals by induction, inverses extend
          it to $\mathbb{Z}$, and multiplicativity extends it to $\mathbb{Q}$.
      - ask: >
          What is $f(3/4)$?
        expects: "3/4"
        hint: >
          Use $f(4) \cdot f(3/4) = f(3)$ together with the values already
          forced on the integers.
        feedback: >
          $3/4$. From $f(4) f(3/4) = f(4 \cdot 3/4) = f(3) = 3$ and $f(4) = 4$,
          the value is forced. No isomorphism has any freedom on the rationals.
      - teach: >
          Beyond the rationals, completeness finishes the job:
          $f(x) = \sup \{f(q) : q \in \mathbb{Q},\ q < x\}$. The remaining work
          is verifying this formula is additive, multiplicative and bijective —
          routine, and free of surprises.
      - ask: >
          Why do the values on $\mathbb{Q}$ determine $f$ everywhere?
        choices:
          - text: >
              Because $\mathbb{Q}$ is countable
            feedback: >
              Cardinality is irrelevant here. What matters is that the
              rationals sit *densely*, so every element is approached from
              below by them.
          - text: >
              Because in a complete ordered field every element is the supremum
              of the rationals below it
            correct: true
            feedback: >
              Exactly, and both words earn their place: density supplies the
              rationals below $x$, and completeness supplies the supremum.
          - text: >
              Because $f$ is continuous
            feedback: >
              Continuity has not been defined, and is not assumed — $f$ is
              only supposed to respect $+$ and $\cdot$. The argument has to run
              on order and completeness alone.
        feedback: >
          Every element is a supremum of rationals, so a map fixed on
          $\mathbb{Q}$ is fixed everywhere. That is why no choice survives.
      - teach: >
          Order preservation is free, and the reason is worth keeping: in a
          complete ordered field the nonnegative elements are exactly the
          squares, since every nonnegative element has a square root.
      - ask: >
          What does that contribute to the proof?
        choices:
          - text: >
              Nothing — order preservation has to be assumed separately
            feedback: >
              It does not: the theorem concludes order preservation rather than
              assuming it, and this is exactly the step that delivers it.
          - text: >
              It expresses the order in $+$ and $\cdot$ alone, which any field
              isomorphism must respect
            correct: true
            feedback: >
              Right. $x \le y$ becomes "$y - x$ is a square", a purely
              arithmetic condition, so a map respecting the arithmetic cannot
              help respecting the order.
          - text: >
              It shows $f$ is bijective
            feedback: >
              Bijectivity comes from running the construction in both
              directions, as with the naturals. The squares argument is about
              the order only.
        feedback: >
          The order becomes an arithmetic condition, and arithmetic is what an
          isomorphism preserves by definition. Completeness is what makes the
          nonnegative elements be the squares.
      - teach: >
          So the two constructions describe one object, and "the real numbers"
          is legitimate — the same conclusion, by the same shape of argument,
          that made "the natural numbers" legitimate one level down.

  - node: foundations.number-systems.archimedean
    hook: >
      Nothing in the ordered field axioms forbids an element larger than every
      natural number. Completeness does, and that single fact is what makes
      every epsilon argument in analysis able to start.
    explanation: >
      Three statements, all equivalent: for every real $x$ there is
      $n \in \mathbb{N}$ with $n > x$; for every real $x > 0$ and every real
      $y$ there is $n$ with $n x > y$; and for every real $\varepsilon > 0$
      there is a nonzero $n \in \mathbb{N}$ with $1/n < \varepsilon$. The last
      is the working form — it is what supplies the index in a limit argument.

      The proof of the first is short. $\mathbb{N}$ is nonempty, so if it were
      bounded above in $\mathbb{R}$ it would have a supremum $s$ by
      completeness. Then $s - 1$, being smaller than the least upper bound, is
      not an upper bound, so some $m \in \mathbb{N}$ has $m > s - 1$ — and then
      $m + 1 > s$ with $m + 1$ a natural number, contradicting that $s$ bounds
      $\mathbb{N}$. So $\mathbb{N}$ is unbounded, and dividing gives the other
      two forms.

      This does not follow from the ordered field axioms alone, and the fact
      that it does not is worth holding onto. There are non-Archimedean ordered
      fields: take the rational functions with real coefficients, ordered by
      their behaviour for large arguments. In that field the element $x$
      exceeds every constant, and $1/x$ is a positive element smaller than
      every $1/n$ — an infinitesimal, in a system obeying every one of the five
      axioms. Completeness is precisely what excludes such things.

      One consequence gets used constantly: every real $x$ has a unique integer
      part $\lfloor x \rfloor$ with $\lfloor x \rfloor \le x < \lfloor x
      \rfloor + 1$. The set of integers not exceeding $x$ is nonempty, by the
      Archimedean property applied to $-x$, and bounded above by $x$, so it has
      a greatest element — and that element is the integer part.
    worked: >
      Two computations in the working form. First, given
      $\varepsilon = 3/1000$, find the smallest nonzero $n$ with
      $1/n < \varepsilon$: the condition is $n > 1000/3 = 333.33\ldots$, so
      $n = 334$, and indeed $1/334 < 3/1000 < 1/333$. Second, integer parts:
      $\lfloor 7/2 \rfloor = 3$, since $3 \le 3.5 < 4$; and
      $\lfloor -7/2 \rfloor = -4$, since $-4 \le -3.5 < -3$. The floor rounds
      *down*, which for a negative number is away from zero, not towards it.
    pitfalls: >
      The floor of a negative number is the standard slip:
      $\lfloor -7/2 \rfloor$ is $-4$, not $-3$, because the defining inequality
      demands an integer at or below $x$. And the Archimedean property is not
      an axiom of ordered fields — quoting it in a setting where only the five
      axioms are available is a genuine error, since non-Archimedean ordered
      fields exist and contain infinitesimals.
    recap: >
      No real number is infinitely large and no positive real is infinitely
      small, and completeness — not the field axioms — is what rules both out.
    steps:
      - teach: >
          A fair worry: could a real number be larger than every natural?
          Nothing in the five axioms forbids it, so if the answer is no,
          something beyond them has to be doing the work.
      - teach: >
          The property has three equivalent forms: some $n$ exceeds any given
          $x$; some $n$ makes $nx > y$ for $x > 0$; and some nonzero $n$ makes
          $1/n < \varepsilon$ for any $\varepsilon > 0$. The last is the one
          you will actually reach for.
      - teach: >
          The proof: if $\mathbb{N}$ were bounded above it would have a
          supremum $s$. Then $s - 1$ is not an upper bound, so some $m$ exceeds
          it — and $m + 1 > s$ is a natural number above the supremum. That is
          the contradiction.
      - ask: >
          Which step of that proof uses completeness?
        choices:
          - text: >
              Choosing $m$ with $m > s - 1$
            feedback: >
              That step only uses that $s$ is the *least* upper bound, so
              $s - 1$ is not one. It presupposes the supremum already exists.
          - text: >
              Producing the supremum $s$ of $\mathbb{N}$ in the first place
            correct: true
            feedback: >
              Exactly. Completeness is what turns "bounded above and nonempty"
              into "has a least upper bound", and everything after that is
              order arithmetic.
          - text: >
              Concluding $m + 1 > s$
            feedback: >
              That is just (O1) — add $1$ to both sides of $m > s - 1$. No
              completeness anywhere in it.
        feedback: >
          The supremum. Take completeness away and the proof has nothing to
          start from, which is exactly why non-Archimedean ordered fields can
          exist.
      - ask: >
          What is the smallest nonzero $n \in \mathbb{N}$ with
          $1/n < 3/1000$?
        expects: "334"
        hint: >
          Invert the inequality: it says $n > 1000/3$.
        feedback: >
          $n = 334$. The condition is $n > 1000/3 = 333.33\ldots$, and $333$
          fails while $334$ works. This is the Archimedean property in the form
          every epsilon argument uses.
      - teach: >
          Without completeness this fails. In the field of rational functions
          with real coefficients, ordered by behaviour for large arguments, the
          element $x$ beats every constant and $1/x$ is a positive
          infinitesimal — all five axioms, no Archimedean property.
      - teach: >
          A consequence used constantly: every real has a unique integer part
          $\lfloor x \rfloor$ with $\lfloor x \rfloor \le x < \lfloor x \rfloor
          + 1$, obtained as the greatest element of the integers not exceeding
          $x$.
      - ask: >
          What is $\lfloor -7/2 \rfloor$?
        expects: "-4"
        hint: >
          Find the integer $k$ with $k \le -3.5 < k + 1$.
        feedback: >
          $-4$, since $-4 \le -3.5 < -3$. The floor rounds down, which for a
          negative number means away from zero — truncating towards zero would
          give the wrong answer $-3$.

  - node: foundations.number-systems.q-dense
    hook: >
      $\mathbb{R}$ is enormously larger than $\mathbb{Q}$, and yet you can
      never get away from the rationals: between any two reals, however close,
      one of them sits. That is what lets a countable set pin down the whole
      line.
    explanation: >
      The claim: if $x < y$ are real then some $q \in \mathbb{Q}$ satisfies
      $x < q < y$. The picture behind the proof is worth having first —
      magnify the gap until it is longer than $1$, catch an integer inside the
      magnified gap, then shrink everything back down.

      Making that precise: by the Archimedean property choose $n$ with
      $1/n < y - x$, so that $n(y - x) > 1$. The integers exceeding $nx$ form a
      nonempty set (Archimedean again) that is bounded below, so it has a least
      element $m$. Minimality says $m - 1$ does not exceed $nx$, that is
      $m - 1 \le nx$, and therefore $nx < m \le nx + 1 < ny$, the last step
      because $ny - nx > 1$. Dividing by the positive $n$ gives
      $x < m/n < y$.

      Two ingredients are doing the work, and both are worth naming. The
      Archimedean property supplies $n$ — which is exactly why this theorem
      belongs downstream of completeness rather than of the field axioms. And
      the *least* integer above $nx$ is where $\mathbb{Z}$'s surviving
      fragment of well-ordering is spent: a nonempty set of integers bounded
      below has a least element, even though $\mathbb{Z}$ itself has none.

      The irrationals are dense as well. Given any irrational $t$, apply the
      theorem to $x - t < y - t$, get a rational $q$ between them, and
      $q + t$ is an irrational strictly between $x$ and $y$ — irrational
      because $q + t$ rational would make $t$ rational. Consequences worth
      keeping: every nonempty open interval contains both a rational and an
      irrational; every real is the supremum of the rationals below it, which
      is the fact the uniqueness theorem leaned on; and a continuous real
      function is determined by its values on $\mathbb{Q}$.
    worked: >
      Take $x = 1.41421356\ldots$, the real whose square is $2$, and
      $y = 1.415$. The gap is about $0.00078644$, so $1/n < y - x$ needs
      $n \ge 1272$; take $n = 2000$, giving $1/n = 0.0005$, comfortably smaller.
      Then $nx = 2828.42712\ldots$, and the least integer above it is
      $m = 2829$. The theorem's rational is $m/n = 2829/2000 = 1.4145$, and
      indeed $1.41421\ldots < 1.4145 < 1.415$. Notice that nothing about $x$
      was used except its decimal expansion far enough to locate $nx$.
    pitfalls: >
      The requirement $n(y - x) > 1$ is not a convenience: with a smaller $n$
      the least integer above $nx$ can overshoot $ny$ entirely — take
      $x = 0.4$, $y = 0.6$ and $n = 1$, where the least integer above $0.4$ is
      $1$, far past $0.6$. And density is a statement about betweenness, not
      about size: a dense set can still miss the overwhelming majority of the
      reals, as the irrationals being dense too already suggests.
    recap: >
      Between any two distinct reals there is a rational, obtained by
      magnifying the gap past length $1$ with the Archimedean property and
      catching an integer inside it.
    steps:
      - teach: >
          The claim is that $\mathbb{Q}$ leaves no gap: for reals $x < y$ there
          is always a rational strictly between. The proof idea is physical —
          stretch the interval until it is longer than $1$, so it cannot help
          containing an integer.
      - teach: >
          The stretch factor comes from the Archimedean property: choose $n$
          with $1/n < y - x$, so that $n(y - x) > 1$. Now the interval from
          $nx$ to $ny$ has length greater than $1$.
      - ask: >
          Why does the proof insist on $n(y - x) > 1$ rather than settling for
          any $n$?
        choices:
          - text: >
              To make sure $m/n$ is rational
            feedback: >
              $m/n$ is a ratio of integers for every choice of $n$, so it is
              rational regardless. The condition is about where $m$ lands.
          - text: >
              So the interval from $nx$ to $ny$ is longer than $1$ and must
              contain an integer
            correct: true
            feedback: >
              Exactly. Take $x = 0.4$, $y = 0.6$ and $n = 1$: the least integer
              above $0.4$ is $1$, which overshoots $0.6$ completely. Stretching
              past length $1$ is what prevents that.
          - text: >
              To guarantee $n$ is positive
            feedback: >
              $n$ is a nonzero natural number by construction, so positivity is
              free. The condition constrains how *large* $n$ must be.
        feedback: >
          An interval shorter than $1$ can slip between consecutive integers.
          Stretching past length $1$ is the entire trick.
      - teach: >
          Now take $m$ to be the least integer exceeding $nx$. Minimality gives
          $m - 1 \le nx$, hence $nx < m \le nx + 1 < ny$, and dividing by the
          positive $n$ gives $x < m/n < y$.
      - ask: >
          With $x = 1.41421356\ldots$, $y = 1.415$ and $n = 2000$, what is that
          least integer $m$?
        expects: "2829"
        hint: >
          Compute $nx$ and round up to the next integer.
        feedback: >
          $nx = 2828.42712\ldots$, so $m = 2829$, and the rational produced is
          $2829/2000 = 1.4145$ — squarely between $1.41421\ldots$ and $1.415$.
      - ask: >
          Which fact guarantees that a least such integer $m$ exists?
        choices:
          - text: >
              $\mathbb{Z}$ has a least element
            feedback: >
              $\mathbb{Z}$ has no least element at all — that was the property
              lost when the integers were built. The set in question is a
              restricted one.
          - text: >
              A nonempty set of integers bounded below has a least element
            correct: true
            feedback: >
              Right — the surviving fragment of well-ordering. The integers
              above $nx$ are nonempty by the Archimedean property and bounded
              below by $nx$, so a least one exists.
          - text: >
              Trichotomy for the order on $\mathbb{R}$
            feedback: >
              Trichotomy compares two given numbers. It cannot produce a
              minimum of an infinite set, which is what is needed here.
        feedback: >
          Bounded-below well-ordering, the weakened form $\mathbb{Z}$ kept.
          Both hypotheses are checked in the proof, and both are needed.
      - teach: >
          The irrationals are dense too. For any irrational $t$, apply the
          theorem to $x - t < y - t$ and add $t$ back: the result is irrational,
          since a rational $q + t$ would make $t$ rational.
      - teach: >
          Two consequences to carry: every real is the supremum of the
          rationals below it — the fact that forced the isomorphism of complete
          ordered fields — and a continuous real function is determined by its
          values on $\mathbb{Q}$ alone.

  - node: foundations.number-systems.ex-sqrt-two-in-r
    hook: >
      The set that had no least upper bound in $\mathbb{Q}$ has one in
      $\mathbb{R}$. Here is the payoff computed to the end: the supremum
      exists, and its square is exactly $2$.
    explanation: >
      Let $A = \{x \in \mathbb{R} : x > 0 \text{ and } x^2 < 2\}$ — the same
      set as before, now living in the larger system. It is nonempty, since
      $1 \in A$, and bounded above by $2$, so completeness hands you
      $s = \sup A$, with $1 \le s \le 2$. The claim is $s^2 = 2$, proved by
      killing both alternatives.

      Suppose $s^2 < 2$. Use the Archimedean property to pick $n$ with
      $1/n < (2 - s^2)/(2s + 1)$. Then, using $1/n^2 \le 1/n$,
      $(s + 1/n)^2 = s^2 + 2s/n + 1/n^2 \le s^2 + (2s + 1)/n < s^2 + (2 - s^2)
      = 2$. So $s + 1/n$ is a member of $A$ strictly larger than $s$, and $s$
      was not even an upper bound. The recipe converts "the square falls short"
      into an explicit larger element.

      Suppose instead $s^2 > 2$. Pick $n$ with $1/n < (s^2 - 2)/(2s)$; that
      bound is below $s/2$, so $s - 1/n > 0$, and
      $(s - 1/n)^2 = s^2 - 2s/n + 1/n^2 > s^2 - 2s/n > s^2 - (s^2 - 2) = 2$.
      Now every $x \in A$ has $x^2 < 2 < (s - 1/n)^2$ with both numbers
      positive, forcing $x < s - 1/n$ — so $s - 1/n$ is an upper bound smaller
      than $s$, contradicting leastness. Both alternatives fail, so $s^2 = 2$.

      Look at the shape rather than the arithmetic. The number was never
      exhibited by a formula; it was produced as a supremum and then shown to
      have the property wanted, with the Archimedean property supplying the
      nudge in each direction. That is the characteristic form of an existence
      proof in analysis, and running the same argument with $x^k$ in place of
      $x^2$ produces a $k$-th root of every positive real.
    worked: >
      Run the first case on a concrete candidate. Suppose someone proposes
      $s = 1.4$ as the supremum. Then $s^2 = 1.96 < 2$, so the recipe applies
      with $(2 - 1.96)/(2 \cdot 1.4 + 1) = 0.04/3.8$, which is
      $0.010526\ldots$; since $3.8/0.04 = 95$ exactly, the smallest $n$ with
      $1/n$ strictly below it is $n = 96$. Then $1.4 + 1/96 = 1.410416\ldots$,
      whose square is $1.98927\ldots$, still under $2$. So that number lies in
      $A$ and $1.4$ was not an upper bound — the recipe has turned a shortfall
      into an explicit counterexample.
    pitfalls: >
      The argument produces no formula for $\sqrt{2}$, and looking for one
      misses the method: an object is named as a supremum and the alternatives
      are eliminated. And the whole proof is unavailable in $\mathbb{Q}$,
      because the very first line — "$s = \sup A$ exists" — is what fails
      there; the earlier incompleteness proof is that failure written out.
    recap: >
      Completeness manufactures a real number whose square is $2$, as the
      supremum of the same set that had no supremum in $\mathbb{Q}$.
    steps:
      - teach: >
          Same set, new system:
          $A = \{x \in \mathbb{R} : x > 0 \text{ and } x^2 < 2\}$. It is
          nonempty and bounded above by $2$, so this time it has a least upper
          bound $s$, with $1 \le s \le 2$.
      - ask: >
          Which property of $\mathbb{R}$ produces $s$?
        choices:
          - text: >
              The Archimedean property
            feedback: >
              That is used later, to pick the nudges $1/n$. It cannot produce a
              supremum, and it is itself a consequence of the property that
              can.
          - text: >
              Completeness
            correct: true
            feedback: >
              Exactly: nonempty and bounded above is precisely the hypothesis
              of the least-upper-bound property, and it is the one axiom
              $\mathbb{Q}$ fails.
          - text: >
              Density of $\mathbb{Q}$ in $\mathbb{R}$
            feedback: >
              Density says rationals sit between any two reals. It never
              asserts that any particular real exists, which is what is needed
              here.
        feedback: >
          Completeness, applied to exactly the set that exposed its absence in
          $\mathbb{Q}$.
      - teach: >
          The strategy is elimination: show $s^2 < 2$ is impossible and
          $s^2 > 2$ is impossible. Trichotomy then leaves $s^2 = 2$, with no
          formula for $s$ ever written down.
      - teach: >
          If $s^2 < 2$, pick $n$ with $1/n < (2 - s^2)/(2s + 1)$. Then
          $(s + 1/n)^2 \le s^2 + (2s + 1)/n < 2$, so $s + 1/n$ lies in $A$ and
          exceeds $s$ — and $s$ was not an upper bound at all.
      - ask: >
          For the candidate $s = 1.4$, what is the smallest $n$ that recipe
          allows?
        expects: "96"
        hint: >
          Compute $(2 - s^2)/(2s + 1)$ and invert it; the inequality is strict.
        feedback: >
          $(2 - 1.96)/3.8 = 0.04/3.8$, and $3.8/0.04 = 95$ exactly, so $n$ must
          strictly exceed $95$: $n = 96$. Then $1.4 + 1/96 = 1.410416\ldots$
          has square $1.98927\ldots < 2$.
      - teach: >
          If instead $s^2 > 2$, pick $n$ with $1/n < (s^2 - 2)/(2s)$. That
          bound is below $s/2$, so $s - 1/n$ stays positive, and
          $(s - 1/n)^2 > s^2 - 2s/n > 2$.
      - ask: >
          In that case, why is $s - 1/n$ an upper bound of $A$?
        choices:
          - text: >
              Because it is smaller than $s$, which is an upper bound
            feedback: >
              Being smaller than an upper bound is no reason to be one — that
              is backwards, and it would make every number an upper bound.
          - text: >
              Because every $x \in A$ has $x^2 < 2 < (s - 1/n)^2$ with both
              numbers positive, forcing $x < s - 1/n$
            correct: true
            feedback: >
              Right, and the positivity matters: for positive numbers the order
              and the order of squares agree, which is what lets you compare
              $x$ and $s - 1/n$ through their squares.
          - text: >
              Because $A$ is bounded above
            feedback: >
              $A$ has upper bounds in abundance; the question is why this
              particular smaller number is one of them.
        feedback: >
          Compare squares, then descend to the numbers. That gives an upper
          bound strictly below $s$ — contradicting leastness.
      - teach: >
          The pattern is the one analysis uses everywhere: name the object as a
          supremum, then eliminate the alternatives. Swap $x^2$ for $x^k$ and
          the same proof produces a $k$-th root of every positive real.

  - node: foundations.number-systems.def-complex
    hook: >
      $\mathbb{R}$ settles every inequality you can state and still cannot
      solve $x^2 = -1$. The repair is the cheapest imaginable: pairs of reals,
      with a multiplication chosen so that one particular pair squares to $-1$.
    explanation: >
      Let $\mathbb{C} = \mathbb{R} \times \mathbb{R}$ with
      $(a, b) + (c, d) = (a + c,\,b + d)$ and
      $(a, b) \cdot (c, d) = (ac - bd,\,ad + bc)$. Addition is the obvious
      thing. Multiplication looks arbitrary at first sight and is not: it is
      the only rule that makes the plan work, as the notation below shows.

      All the field axioms hold, with $0 = (0, 0)$, $1 = (1, 0)$ and
      $-(a, b) = (-a, -b)$. For $(a, b) \ne (0, 0)$ the multiplicative inverse
      is $(a/(a^2 + b^2),\,-b/(a^2 + b^2))$, and the reason that formula is
      legal is worth pausing on: $a^2 + b^2 > 0$ whenever $(a, b) \ne (0, 0)$,
      because in $\mathbb{R}$ squares are nonnegative and a sum of nonnegative
      reals vanishes only when both do. The new field borrows its inverses from
      the old field's *order*.

      Write $i = (0, 1)$. Then
      $i^2 = (0 \cdot 0 - 1 \cdot 1,\ 0 \cdot 1 + 1 \cdot 0) = (-1, 0) = -1$,
      and every pair splits as $(a, b) = a(1, 0) + b(0, 1) = a + bi$. In that
      notation the multiplication rule is nothing but expanding
      $(a + bi)(c + di)$ and replacing $i^2$ by $-1$ — which is where the
      formula came from in the first place.

      The same field can be produced as the real polynomials taken modulo the
      multiples of $x^2 + 1$: adjoin a root of that polynomial and reduce. The
      ordered-pair description is the one that needs no ring theory. Either
      way, the gain is roots — $x^2 + 1 = 0$ now has a solution, and so, it
      turns out, does every nonconstant polynomial with complex coefficients.
    worked: >
      Multiply $(3, 2)$ by $(1, -4)$ with the rule:
      $(3 \cdot 1 - 2 \cdot (-4),\ 3 \cdot (-4) + 2 \cdot 1) =
      (3 + 8,\ -12 + 2) = (11, -10)$. Check it against the other notation:
      $(3 + 2i)(1 - 4i) = 3 - 12i + 2i - 8i^2 = 3 - 10i + 8 = 11 - 10i$. Same
      answer, which is the whole design goal. Now invert $(3, 2)$: here
      $a^2 + b^2 = 9 + 4 = 13$, so the inverse is $(3/13, -2/13)$, and
      $(3, 2) \cdot (3/13, -2/13) = ((9 + 4)/13,\ (-6 + 6)/13) = (1, 0) = 1$.
    pitfalls: >
      Multiplying componentwise, $(a, b)(c, d) = (ac, bd)$, is the tempting
      alternative and it fails badly: $(1, 0) \cdot (0, 1) = (0, 0)$, so the
      result has zero divisors and is not a field at all. The other point to
      hold is where the inverse comes from — $a^2 + b^2 > 0$ is a fact about
      the *order* on $\mathbb{R}$, imported into a system that has no order of
      its own.
    recap: >
      $\mathbb{C}$ is $\mathbb{R} \times \mathbb{R}$ with the multiplication
      that forces $(0, 1)^2 = -1$, and its inverses exist because sums of real
      squares are positive.
    steps:
      - teach: >
          One equation is still unsolvable: $x^2 = -1$. Rather than search for
          the solution, build a system containing one, as cheaply as possible —
          and pairs of reals are the cheapest material available.
      - teach: >
          Set $\mathbb{C} = \mathbb{R} \times \mathbb{R}$ with componentwise
          addition and the multiplication
          $(a, b) \cdot (c, d) = (ac - bd,\,ad + bc)$. The second rule is the
          one carrying the design.
      - ask: >
          Why not multiply componentwise instead, $(a, b)(c, d) = (ac, bd)$?
        choices:
          - text: >
              Because it is not commutative
            feedback: >
              It is perfectly commutative — $ac = ca$ and $bd = db$. The defect
              is elsewhere and it is fatal.
          - text: >
              Because $(1, 0) \cdot (0, 1) = (0, 0)$, so the result has zero
              divisors and cannot be a field
            correct: true
            feedback: >
              Exactly. Two nonzero elements multiplying to zero rules out
              inverses for both, so (F2) fails. Componentwise multiplication
              builds a ring, not a field.
          - text: >
              Because it makes $(0, 1)$ square to $(0, 1)$ rather than to
              $-1$
            feedback: >
              True, and it is a real objection to the *goal* — but the deeper
              problem is that no repair of that rule can work, since the
              structure is not a field to begin with.
        feedback: >
          Zero divisors. That kills it as a field before any question about
          $i$ even arises.
      - teach: >
          Write $i = (0, 1)$. The rule gives $i^2 = (-1, 0) = -1$, and every
          pair reads $(a, b) = a + bi$. In that notation the multiplication is
          just expansion with $i^2$ replaced by $-1$ — which is where the
          formula came from.
      - ask: >
          What is the first coordinate of $(3, 2) \cdot (1, -4)$?
        expects: "11"
        hint: >
          The first coordinate is $ac - bd$.
        feedback: >
          $3 \cdot 1 - 2 \cdot (-4) = 3 + 8 = 11$; the full product is
          $(11, -10)$. In the other notation
          $(3 + 2i)(1 - 4i) = 11 - 10i$, as it must be.
      - teach: >
          Inverses: for $(a, b) \ne (0, 0)$, the inverse is
          $(a/(a^2 + b^2),\,-b/(a^2 + b^2))$. For $(3, 2)$ the denominator is
          $9 + 4 = 13$, giving $(3/13, -2/13)$, and multiplying back returns
          $(1, 0)$.
      - ask: >
          What guarantees that denominator is nonzero?
        choices:
          - text: >
              The definition of $\mathbb{C}$, which excludes $(0, 0)$
            feedback: >
              Excluding $(0, 0)$ is the hypothesis, not the reason. You still
              have to know that $a^2 + b^2$ cannot vanish for some *other*
              nonzero pair.
          - text: >
              The order on $\mathbb{R}$: squares are nonnegative, and a sum of
              nonnegative reals is $0$ only if both are
            correct: true
            feedback: >
              Right, and it is worth noticing the direction of the debt — the
              field $\mathbb{C}$ gets its inverses from a property of the
              ordered field beneath it.
          - text: >
              That every nonconstant complex polynomial has a root
            feedback: >
              That is a far deeper theorem, and it is proved using the
              arithmetic of $\mathbb{C}$ — including inverses. Using it here
              would be circular.
        feedback: >
          $\mathbb{R}$'s order. $\mathbb{C}$ will shortly turn out to have no
          order of its own, which makes the loan worth remembering.
      - teach: >
          The same field arises as real polynomials modulo the multiples of
          $x^2 + 1$, but that needs ring theory and the pairs do not. Either
          way the gain is roots: $x^2 + 1 = 0$ is solvable, and so is every
          nonconstant polynomial equation over $\mathbb{C}$.

  - node: foundations.number-systems.complex-no-order
    hook: >
      Every extension so far handed you something new. This one takes something
      away, and the proof that it must is three lines long.
    explanation: >
      The claim: there is no total order on $\mathbb{C}$ making it an ordered
      field. The proof needs nothing about $\mathbb{C}$ except one equation. In
      any ordered field every square is nonnegative, and $1 = 1^2$ with
      $1 \ne 0$ gives $1 > 0$, hence $-1 < 0$. But $i^2 = -1$, and squares are
      nonnegative, so $-1 \ge 0$. Contradiction — and notice that the argument
      never inspects the proposed order, so no cleverness in choosing one can
      help.

      Unfold the case analysis hiding inside "every square is nonnegative", to
      see which axiom is actually spent. Totality gives $0 \le i$ or
      $i \le 0$. In the first case (O2) applied with $x = y = i$ yields
      $0 \le i \cdot i = -1$. In the second, $0 \le -i$, and (O2) applied to
      $-i$ yields $0 \le (-i)(-i) = i^2 = -1$. Either branch produces
      $-1 \ge 0$, and (O2) is the axiom doing it.

      What survives is worth stating precisely, because the slogan
      "$\mathbb{C}$ cannot be ordered" is too strong. $\mathbb{C}$ can be
      totally ordered as a bare set — order the pairs lexicographically, for
      instance, and that order even respects addition. And $\mathbb{C}$ carries
      the absolute value $|a + bi| = \sqrt{a^2 + b^2}$ with all the usual
      properties, so inequalities between *magnitudes* remain completely
      available.

      What is gone is every argument that compares two numbers rather than
      their sizes: monotonicity, suprema and infima, the intermediate value
      theorem. That is the price of solving every polynomial equation, and it
      makes this step different in kind from the three before it. Those added
      structure; this one trades some away.
    worked: >
      Test a specific proposal. Order $\mathbb{C}$ lexicographically:
      $(a, b) < (c, d)$ when $a < c$, or when $a = c$ and $b < d$. This is a
      genuine total order, and it satisfies (O1), since adding $(e, f)$ to both
      sides shifts both coordinates equally. Now test (O2). We have
      $i = (0, 1) > (0, 0) = 0$, so (O2) with $x = y = i$ demands
      $0 \le i \cdot i = (-1, 0)$. But lexicographically $(-1, 0) < (0, 0)$,
      since $-1 < 0$. So (O2) fails, exactly where the general theorem said it
      would — and every other candidate order fails at the same place.
    pitfalls: >
      "$\mathbb{C}$ cannot be ordered" overstates the theorem: it can be
      totally ordered as a set, and the lexicographic order even satisfies
      (O1). What fails is compatibility with multiplication, axiom (O2). The
      second misreading is thinking nothing in $\mathbb{C}$ can be compared —
      $|z| \le |w|$ is perfectly meaningful, and nearly every inequality in
      complex analysis is an inequality between magnitudes.
    recap: >
      Squares are nonnegative in every ordered field and $i^2 = -1$, so a
      square root of $-1$ and a compatible order cannot coexist.
    steps:
      - teach: >
          $\mathbb{C}$ has all four operations and solves every polynomial
          equation. The question left is whether it can also carry an order
          compatible with its arithmetic, the way every earlier system did.
      - teach: >
          It cannot, and the proof is three lines. In any ordered field squares
          are nonnegative and $1 = 1^2 > 0$, so $-1 < 0$. But $i^2 = -1$ is a
          square, so $-1 \ge 0$. No order survives that.
      - ask: >
          Which fact about ordered fields is the proof leaning on?
        choices:
          - text: >
              The Archimedean property
            feedback: >
              That is a consequence of completeness, not of the ordered field
              axioms, and nothing in this argument compares anything to a
              natural number.
          - text: >
              That every square is nonnegative
            correct: true
            feedback: >
              Exactly, and it is a theorem of the ordered field axioms alone —
              which is why it applies to *any* proposed order on $\mathbb{C}$.
          - text: >
              That the order is dense
            feedback: >
              Density concerns what lies between two elements. The
              contradiction here is about the sign of a single element, $-1$.
        feedback: >
          Nonnegativity of squares, proved way back from (O2) and totality.
          That old two-case argument is what makes this one immediate.
      - teach: >
          Unfold those cases to see which axiom is spent. If $0 \le i$ then
          (O2) gives $0 \le i \cdot i = -1$. If $i \le 0$ then $0 \le -i$ and
          (O2) gives $0 \le (-i)(-i) = -1$. Totality says one of the two holds,
          so $-1 \ge 0$ either way.
      - ask: >
          How many total orders make $\mathbb{C}$ an ordered field?
        expects: "0"
        hint: >
          Ask what the argument assumed about the proposed order.
        feedback: >
          None. The proof never inspects the order — it only uses that some
          order satisfying (O1) and (O2) exists — so every candidate is
          eliminated at once.
      - teach: >
          A concrete casualty: order $\mathbb{C}$ lexicographically, comparing
          first coordinates and breaking ties on the second. That is a genuine
          total order and it even satisfies (O1).
      - ask: >
          What exactly goes wrong with the lexicographic order?
        choices:
          - text: >
              It is not total
            feedback: >
              It is total: any two distinct pairs differ in a first coordinate
              or, failing that, in a second, so one always precedes the other.
          - text: >
              It fails (O1), since adding an element can reverse it
            feedback: >
              Adding $(e, f)$ shifts both coordinates by the same amounts, so
              comparisons are unchanged. (O1) holds.
          - text: >
              It fails (O2): $i > 0$, yet $i \cdot i = -1 < 0$
            correct: true
            feedback: >
              Right, and it fails exactly where the theorem promised. Any other
              proposal fails at the same point, since the general proof used
              nothing specific.
        feedback: >
          (O2) is the casualty. Compatibility with multiplication is what a
          square root of $-1$ makes impossible.
      - teach: >
          What survives is magnitude: $|a + bi| = \sqrt{a^2 + b^2}$ behaves
          exactly as expected. What is gone is comparison of numbers
          themselves — monotonicity, suprema, the intermediate value theorem.
          This step trades structure away rather than adding it.

  - node: foundations.number-systems.intuition-tower
    hook: >
      Four constructions are now behind you. Read them again as one story:
      each is the cheapest repair of a single named failure, and every repair
      is paid for.
    explanation: >
      The chain $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset
      \mathbb{R} \subset \mathbb{C}$ is not a sequence of ever-larger bags of
      numbers. It is a sequence of repairs. $\mathbb{N}$ cannot subtract;
      $\mathbb{Z}$ makes $x + a = b$ always solvable and loses well-ordering,
      so a minimal counterexample is no longer free for the taking.
      $\mathbb{Z}$ cannot divide; $\mathbb{Q}$ makes $ax = b$ with $a \ne 0$
      always solvable and loses discreteness, so no element has a next one.

      $\mathbb{Q}$ has gaps in its order; $\mathbb{R}$ gives every nonempty
      set bounded above a supremum, and it loses countability — most of its
      elements can never be written down, a fact the next unit proves by
      Cantor's diagonal argument and which is taken on trust here. Then
      $\mathbb{R}$ cannot solve $x^2 = -1$; $\mathbb{C}$ solves every
      polynomial equation and loses the order outright.

      Two patterns are worth carrying out of the unit. The first is the
      method: three of the four steps are quotients by an explicitly written
      equivalence relation — equal differences, equal ratios, agreement in the
      limit — each with the same well-definedness obligation attached. That is
      how a theory manufactures the object it needs instead of hoping to find
      one lying around. The odd step out is $\mathbb{R}$ to $\mathbb{C}$, a
      plain product of two copies with a chosen multiplication.

      The second is that each new system is determined up to isomorphism by
      the defect it repairs: $\mathbb{N}$ by the Peano axioms, $\mathbb{R}$ by
      the ordered field axioms plus completeness. That is why "the" integers,
      "the" rationals and "the" reals are legitimate phrases, and it is why two
      constructions of $\mathbb{R}$ that look nothing alike had no choice but
      to agree.
    pitfalls: >
      Reading the tower as ever-larger bags of numbers hides the losses, and
      the losses are what explain why an argument legal in one system is
      illegal in the next: minimal counterexample over an arbitrary set of
      integers, "the next element" in $\mathbb{Q}$, suprema in $\mathbb{C}$.
      The other misreading is picturing $\mathbb{R}$ as $\mathbb{Q}$ with a few
      extra numbers patched in — every real, the rational ones included, is
      built wholesale out of rationals, as a cut or as a class of Cauchy
      sequences.
    recap: >
      Read the tower as four repairs rather than four enlargements: each system
      is the cheapest way to make one specific equation solvable, and each
      repair costs a property the previous system had.
    steps:
      - teach: >
          Look back at the whole chain at once. Each step was driven by one
          equation that could not be solved, and each was answered by the
          smallest construction that solves it. Nothing was added for the sake
          of size.
      - teach: >
          $\mathbb{N}$ cannot subtract, so $\mathbb{Z}$ makes $x + a = b$
          solvable — and loses well-ordering. $\mathbb{Z}$ cannot divide, so
          $\mathbb{Q}$ makes $ax = b$ solvable for $a \ne 0$ — and loses
          discreteness.
      - teach: >
          $\mathbb{Q}$ has gaps in its order, so $\mathbb{R}$ supplies suprema
          — and loses countability, which the next unit proves and which you
          may take on trust here. $\mathbb{R}$ cannot solve $x^2 = -1$, so
          $\mathbb{C}$ solves every polynomial equation — and loses the order.
      - ask: >
          Which step trades structure away rather than adding it?
        choices:
          - text: >
              $\mathbb{N}$ to $\mathbb{Z}$
            feedback: >
              It does cost well-ordering, but it hands back a full additive
              group with subtraction everywhere. The order itself survives
              intact.
          - text: >
              $\mathbb{Q}$ to $\mathbb{R}$
            feedback: >
              This is the most generous step of all: it adds the
              least-upper-bound property and keeps every ordered-field
              property already in hand.
          - text: >
              $\mathbb{R}$ to $\mathbb{C}$
            correct: true
            feedback: >
              Right. It gains roots of every polynomial but gives up any order
              compatible with the arithmetic, so the arguments that compare
              numbers rather than magnitudes are gone for good.
        feedback: >
          The last step is different in kind. The first three add structure at
          a cost; this one removes a whole layer of it.
      - teach: >
          Notice the method, not just the results. Take pairs meaning what you
          want, write an equivalence relation using only the operations you
          already have, quotient, and then check every formula is independent
          of representatives.
      - ask: >
          How many of the four steps are quotient constructions of that kind?
        expects: "3"
        hint: >
          Count the ones built by writing an equivalence relation on a set of
          pairs or sequences.
        feedback: >
          Three: equal differences for $\mathbb{Z}$, equal ratios for
          $\mathbb{Q}$, agreement in the limit for $\mathbb{R}$. Only
          $\mathbb{R}$ to $\mathbb{C}$ is a plain product with a chosen
          multiplication.
      - ask: >
          Which argument stops being legal once you move from $\mathbb{N}$ to
          $\mathbb{Z}$?
        choices:
          - text: >
              Proof by induction on a natural number
            feedback: >
              Induction is untouched — $\mathbb{N}$ still sits inside
              $\mathbb{Z}$ with the same successor structure, so any statement
              indexed by naturals is still fair game.
          - text: >
              Taking a minimal counterexample in an arbitrary nonempty set
            correct: true
            feedback: >
              Right. $\mathbb{Z}$ has no least element and neither does its set
              of negatives, so the move survives only for sets bounded below.
          - text: >
              Cancelling a common factor from both sides
            feedback: >
              Cancellation by a nonzero element survives, since $\mathbb{Z}$
              has no zero divisors. That property was carried all the way up
              from $\mathbb{N}$.
        feedback: >
          Minimal counterexample. Knowing which property each step spent is
          exactly what tells you which old arguments still run.
      - teach: >
          Last pattern: each system is pinned down up to isomorphism by the
          defect it repairs — $\mathbb{N}$ by the Peano axioms, $\mathbb{R}$ by
          the field axioms plus completeness. That is why "the" integers and
          "the" reals are legitimate phrases, and why two unrecognisably
          different constructions of $\mathbb{R}$ had to agree.
