unit: analysis.mvc
opening: >
  Two variables, two ideas. The first is that a derivative in several variables
  can be taken one coordinate at a time: freeze everything but one input and an
  ordinary one-variable derivative is waiting, with every rule you already own
  still in force. That is most of the good news, because the partials produced
  this way see only the coordinate axes, and a function can have all of them at
  a point where it is not even continuous. The second idea is what the
  construction is for. An integral carrying a parameter in its integrand is a
  function of that parameter, and when the integrand and its parameter
  derivative are continuous on a closed bounded rectangle the derivative may be
  moved inside the integral sign. By the end you should be able to compute any
  partial derivative by freezing, say exactly why a full set of partials
  guarantees so little, and use differentiation under the integral sign to
  evaluate an integral that resists a direct attack.
lessons:
  - node: analysis.mvc.def-partial-derivative
    hook: >
      Every derivative of several variables is assembled from these, and the
      Leibniz integral rule cannot even be stated without one. It is also the
      cheapest place to learn that a derivative in more than one variable sees
      far less of a function than you expect.
    explanation: >
      In one variable the derivative asks a single question: how does $f$
      respond when its one input moves? Give $f$ two inputs and the question
      splits, because the point can leave $(a,b)$ in infinitely many
      directions. The partial derivative declines to face all of them at once.
      Pick one coordinate, hold every other coordinate at the value it has, and
      what is left is an honest function of one real variable.

      Written out at $a = (a_1, \dots, a_n)$, that is
      $\dfrac{\partial f}{\partial x_j}(a)
      = \lim_{h \to 0} \dfrac{f(a + h e_j) - f(a)}{h}$: the same difference
      quotient as before, with only the $j$-th slot allowed to move.
      Equivalently, build the one-variable function
      $g(t) = f(a_1, \dots, t, \dots, a_n)$ by freezing the rest, and the
      partial derivative is $g'(a_j)$. That equivalence is the whole practical
      content of the definition. Every rule you already own — sums, products,
      quotients, the chain rule — applies verbatim, with the frozen variables
      carried along as constants.

      The picture is a slice. The graph of $f(x,y)$ is a surface; setting
      $y = b$ cuts it with a vertical plane and leaves a curve; then
      $\dfrac{\partial f}{\partial x}(a,b)$ is that curve's slope at $x = a$.
      Cutting the other way through the same point gives a different curve and
      a different slope.

      The refusal to look in every direction has a price. A partial derivative
      reads $f$ along one line only, so knowing all $n$ of them at a point
      tells you about $n$ lines and nothing whatever about the rest of the
      neighborhood. Existence of every partial at a point does not force
      continuity there. This is the first place where multivariable calculus
      genuinely breaks from the one-variable story, in which a derivative at a
      point drags continuity along with it.
    worked: >
      Take $f(x,y) = x^3 y^2 + \ln(x + y^2)$ and compute both partials at
      $(1,2)$. Freeze $y$ first. Then $x^3 y^2$ is the constant $y^2$ times
      $x^3$, whose $x$-derivative is $3x^2$, and $\ln(x + y^2)$ is a logarithm
      of $x$ plus a constant, whose $x$-derivative is
      $\dfrac{1}{x + y^2}$. So
      $\dfrac{\partial f}{\partial x} = 3x^2 y^2 + \dfrac{1}{x + y^2}$, and at
      $(1,2)$ that is $3 \cdot 1 \cdot 4 + \dfrac{1}{5} = \dfrac{61}{5}$. Now
      freeze $x$. The first term is the constant $x^3$ times $y^2$, giving
      $2x^3 y$; the second needs the chain rule, since the inside $x + y^2$
      moves with $y$ at rate $2y$, giving $\dfrac{2y}{x + y^2}$. So
      $\dfrac{\partial f}{\partial y} = 2x^3 y + \dfrac{2y}{x + y^2}$, and at
      $(1,2)$ that is $4 + \dfrac{4}{5} = \dfrac{24}{5}$. No new machinery was
      used: these are the ordinary derivatives of $t \mapsto 4t^3 + \ln(t + 4)$
      at $t = 1$ and of $t \mapsto t^2 + \ln(1 + t^2)$ at $t = 2$.
    pitfalls: >
      The notation hides the freezing, and the frozen values matter. For
      $f(x,y) = x^3 y^2 + \ln(x + y^2)$, the partial
      $\dfrac{\partial f}{\partial x}$ is $\dfrac{61}{5}$ at $(1,2)$ and $1$ at
      $(1,0)$ — two different one-variable functions, two different slopes, one
      symbol.

      Existence of both partials at a point is far weaker than
      differentiability and does not even deliver continuity. For the function
      equal to $\dfrac{xy}{x^2 + y^2}$ away from the origin and to $0$ at the
      origin, both partials at the origin are $0$, because $f$ vanishes
      identically on both axes; yet along the line $y = x$ the function is
      constantly $\dfrac{1}{2}$.

      When the formula defining $f$ changes at the very point you care about,
      the rules do not apply and the definition must be used directly. Feeding
      that same $\dfrac{xy}{x^2 + y^2}$ into the quotient rule at the origin
      produces $\dfrac{0}{0}$ and no information; the difference quotient
      produces $0$ in one line.
    recap: >
      A partial derivative is the ordinary derivative of the one-variable
      function you get by freezing every coordinate but one, which is why all
      the old rules survive intact — and why the whole collection of partials
      still knows nothing about the directions in between.
    steps:
      - teach: >
          In one variable there is one direction to move and one derivative.
          Give $f$ two inputs and the point can leave $(a,b)$ in infinitely
          many directions at once. The partial derivative refuses to answer all
          of them: it freezes every coordinate but one.
      - teach: >
          With $y$ pinned at $b$, the map $t \mapsto f(t,b)$ has a single
          input, so it has an ordinary derivative. Its value at $t = a$ is
          $\dfrac{\partial f}{\partial x}(a,b)
          = \lim_{h \to 0} \dfrac{f(a + h, b) - f(a,b)}{h}$ — the old
          difference quotient with only the first slot moving.
      - teach: >
          So every rule survives. For $f(x,y) = x^2 y^3$, freezing $y$ makes
          $y^3$ a constant coefficient and
          $\dfrac{\partial f}{\partial x} = 2x y^3$; freezing $x$ makes $x^2$
          the constant and $\dfrac{\partial f}{\partial y} = 3x^2 y^2$.
      - ask: >
          For $f(x,y) = x^2 y^3$, what is $\dfrac{\partial f}{\partial y}$ at
          the point $(3,2)$?
        expects: "108"
        hint: >
          Freeze $x = 3$. You are differentiating $t \mapsto 9t^3$ at $t = 2$.
        feedback: >
          $108$. With $x$ frozen, $f$ is the constant $x^2$ times $y^3$, so
          $\dfrac{\partial f}{\partial y} = 3x^2 y^2$, and at $(3,2)$ that is
          $3 \cdot 9 \cdot 4 = 108$. The frozen picture agrees: $g(t) = 9t^3$
          has $g'(t) = 27t^2$ and $g'(2) = 108$.
      - teach: >
          Freezing does not switch off the chain rule; it only decides which
          letter is the variable. In $\ln(x^2 + y)$ with $y$ frozen the inside
          moves at rate $2x$, so the $x$-partial is $\dfrac{2x}{x^2 + y}$; with
          $x$ frozen the inside moves at rate $1$, so the $y$-partial is
          $\dfrac{1}{x^2 + y}$.
      - ask: >
          For $f(x,y) = \ln(x^2 + y)$, what is
          $\dfrac{\partial f}{\partial x}$ at $(3,1)$?
        expects: "3/5"
        hint: >
          The outside derivative is $\dfrac{1}{x^2 + y}$; multiply it by the
          rate at which $x^2 + y$ moves as $x$ moves.
        feedback: >
          $\dfrac{3}{5}$. The chain rule with $y$ frozen gives
          $\dfrac{\partial f}{\partial x} = \dfrac{2x}{x^2 + y}$, so at $(3,1)$
          it is $\dfrac{6}{9 + 1} = \dfrac{6}{10} = \dfrac{3}{5}$. Freezing $x$
          instead makes the inside move at rate $1$ and gives
          $\dfrac{1}{10}$ — the other partial, at the same point.
      - teach: >
          Now the price of freezing. The number
          $\dfrac{\partial f}{\partial x}(a,b)$ reads $f$ only on the
          horizontal line through $(a,b)$, and
          $\dfrac{\partial f}{\partial y}(a,b)$ only on the vertical one.
          Together they have inspected two lines out of an entire
          neighborhood.
      - ask: >
          Let $f(x,y) = \dfrac{xy}{x^2 + y^2}$ away from the origin, with
          $f(0,0) = 0$. Which statement is true?
        choices:
          - text: >
              Neither partial exists at the origin, because $f$ is not
              continuous there.
            feedback: >
              Continuity is not a prerequisite for a partial derivative. Along
              the $x$-axis $f$ is constantly $0$, and the derivative of a
              constant exists and equals $0$.
          - text: >
              Both partials exist at the origin and equal $0$, yet $f$ is not
              continuous at the origin.
            correct: true
            feedback: >
              On the axes $f$ vanishes identically, so $f(h,0) - f(0,0) = 0$
              for every $h$ and the $x$-partial is $0$; the same argument gives
              $0$ for $y$. Off the axes the function is not small: on the line
              $y = x$ it equals $\dfrac{x^2}{2x^2} = \dfrac{1}{2}$ at every
              $x \ne 0$, so values arbitrarily close to the origin stay far
              from $f(0,0) = 0$.
          - text: >
              Both partials exist at the origin, so $f$ is continuous there.
            feedback: >
              That implication is exactly what fails in more than one variable.
              The partials look only along the two axes, where $f$ is $0$; the
              line $y = x$, which they never visit, carries the constant value
              $\dfrac{1}{2}$.
        feedback: >
          Existence of every partial at a point is a claim about finitely many
          lines through it, while continuity is a claim about a whole
          neighborhood. The two come apart at the first example anybody writes
          down.
      - teach: >
          So the derivative of a function of several variables is not simply
          the list of its partials — that list is raw material, not the object.
          What the partials do give at once is a way to differentiate in a
          parameter, and that is precisely the ingredient the Leibniz integral
          rule needs.

  - node: analysis.mvc.leibniz-rule
    hook: >
      This rule turns an integral you cannot evaluate into one you can, which
      is why "differentiate under the integral sign" is a technique rather than
      a wish. Its hypotheses are what keep the technique from being wrong.
    explanation: >
      Fix a function $f(x,t)$ of two variables and integrate the first one
      away: $I(t) = \int_a^b f(x,t)\,dx$. Each $t$ produces a number, so $I$ is
      an ordinary function of one real variable and asking for $I'(t)$ is an
      ordinary question. The pleasant answer is that you may differentiate the
      integrand and integrate the result:
      $I'(t) = \int_a^b \dfrac{\partial f}{\partial t}(x,t)\,dx$.

      That is not free, and it is worth seeing why. Linearity of the integral
      gives the exact identity
      $\dfrac{I(t + h) - I(t)}{h}
      = \int_a^b \dfrac{f(x, t + h) - f(x,t)}{h}\,dx$. Inside the integral,
      each quotient tends to $\dfrac{\partial f}{\partial t}(x,t)$ as
      $h \to 0$, for each fixed $x$. The rule claims you may take that limit
      out through the integral sign — an interchange of two limiting
      processes, exactly the move that fails without a hypothesis.

      Here is the hypothesis that earns it. Suppose $f$ and
      $\partial f/\partial t$ are continuous on the closed bounded rectangle
      $[a,b] \times [c,d]$. The Mean Value Theorem applied in $t$ with $x$
      frozen rewrites the quotient as
      $\dfrac{\partial f}{\partial t}(x, t + \theta h)$ for some $\theta$
      between $0$ and $1$. On a closed bounded rectangle continuity is
      uniform, so one $\delta$ serves every point at once: whenever
      $|h| < \delta$, that value sits within $\varepsilon$ of
      $\dfrac{\partial f}{\partial t}(x,t)$ *for every $x$ simultaneously*, and
      the two integrals then differ by at most $\varepsilon (b - a)$.
      Uniformity in $x$ is the entire content of the hypothesis; convergence at
      each $x$ separately would not survive the integration.

      What the rule buys is a strategy. Plant a parameter inside an integral
      you cannot do, differentiate in the parameter until the integrand
      collapses to something elementary, integrate the resulting formula back
      up, and pin the constant with one value of the parameter you can compute
      by hand.
    worked: >
      Start from something you can already integrate: for $t$ in $[1,5]$,
      $\int_0^1 x^t\,dx = \dfrac{1}{t + 1}$. Check the hypotheses on the
      rectangle $[0,1] \times [1,5]$. The integrand $x^t$ is continuous there
      once its value at $x = 0$ is taken to be $0$, which is its limit, and
      $\dfrac{\partial}{\partial t} x^t = x^t \ln x$ is continuous there too,
      again with value $0$ at $x = 0$, since $x^t |\ln x| \le \sqrt{x}\,|\ln x|$
      for $t \ge 1$ and that tends to $0$. So the rule applies, and
      differentiating both sides in $t$ gives
      $\int_0^1 x^t \ln x\,dx = -\dfrac{1}{(t + 1)^2}$. Setting $t = 3$,
      $\int_0^1 x^3 \ln x\,dx = -\dfrac{1}{16}$. Integration by parts confirms
      it: the boundary term $\dfrac{x^4}{4}\ln x$ vanishes at both endpoints
      and what remains is $-\int_0^1 \dfrac{x^3}{4}\,dx = -\dfrac{1}{16}$. The
      point is the route rather than the answer — a logarithm appeared in the
      integrand for free, manufactured by differentiating an exponent.
    pitfalls: >
      The rule moves a derivative past a parameter sitting *in the integrand*,
      while the limits of integration stay put. A $t$ in an endpoint is a
      different question entirely: reading $\dfrac{d}{dt}\int_0^t f(x)\,dx$ as
      $\int_0^t \dfrac{\partial f}{\partial t}(x)\,dx = 0$ is wrong the instant
      $f$ is a nonzero constant.

      Inside the integral the derivative is a *partial*: $x$ is frozen while
      $t$ moves. Differentiating the integrand as though $x$ travelled with $t$
      manufactures terms that are not there.

      Both hypotheses are about a closed bounded rectangle, and dropping either
      breaks the conclusion and not merely the proof. Take
      $f(x,t) = \dfrac{2xt^2}{(x^2 + t^2)^2}$ on $[0,1] \times [-1,1]$, with
      $f(0,0) = 0$. For $t \ne 0$ the substitution $u = x^2 + t^2$ gives
      $I(t) = \dfrac{1}{1 + t^2}$, while $I(0) = 0$ because the integrand
      vanishes identically at $t = 0$. So $I$ leaps from $0$ to nearly $1$ and
      is not even continuous at $t = 0$, let alone differentiable — yet
      $\dfrac{\partial f}{\partial t}(x,0) = 0$ for every $x$, so the
      interchanged formula would report $I'(0) = 0$ with total confidence. The
      culprit is that $f$ is unbounded near the origin, hence not continuous on
      the rectangle.
    recap: >
      When the integrand and its parameter derivative are continuous on a
      closed bounded rectangle, the difference quotients converge uniformly in
      $x$ and the derivative slides inside the integral sign; without that
      uniform control the interchange can return a confident number to a
      question that has no answer.
    steps:
      - teach: >
          Integrating $f(x,t)$ over $x$ consumes one variable and leaves the
          other: $I(t) = \int_a^b f(x,t)\,dx$ is a number for each $t$, so it
          is an ordinary function of one variable. The question is how to
          differentiate it without evaluating it first.
      - teach: >
          Two routes are open for $I(t) = \int_0^1 (x + t)^2\,dx$. Expand and
          integrate in $x$ to get a formula in $t$, then differentiate that.
          Or differentiate the integrand in $t$ with $x$ frozen, and integrate
          the result instead. The claim of this lesson is that the two routes
          agree.
      - ask: >
          For $I(t) = \int_0^1 (x + t)^2\,dx$, what is $I'(2)$?
        expects: "5"
        hint: >
          Expanding gives $\int_0^1 (x^2 + 2xt + t^2)\,dx$; integrate in $x$
          with $t$ treated as a constant, then differentiate the result in $t$.
        feedback: >
          $5$. Integrating first,
          $\int_0^1 (x^2 + 2xt + t^2)\,dx = \dfrac{1}{3} + t + t^2$, whose
          derivative is $1 + 2t$, and at $t = 2$ that is $5$. Differentiating
          first, $\dfrac{\partial}{\partial t}(x + t)^2 = 2(x + t)$ and
          $\int_0^1 2(x + t)\,dx = 1 + 2t$ — the same function, for half the
          work.
      - teach: >
          The rule states it in general. If $f$ and $\partial f/\partial t$ are
          both continuous on the closed bounded rectangle
          $[a,b] \times [c,d]$, then $I(t) = \int_a^b f(x,t)\,dx$ is
          differentiable on $[c,d]$ and
          $I'(t) = \int_a^b \dfrac{\partial f}{\partial t}(x,t)\,dx$.
      - teach: >
          Why any hypothesis at all? Linearity gives the exact identity
          $\dfrac{I(t + h) - I(t)}{h}
          = \int_a^b \dfrac{f(x, t + h) - f(x,t)}{h}\,dx$, and inside the
          integral each quotient tends to $\dfrac{\partial f}{\partial t}(x,t)$
          as $h \to 0$. Pulling that limit out through the integral sign swaps
          two limits, which is never free.
      - teach: >
          Continuity on a closed bounded rectangle is what pays for the swap.
          The Mean Value Theorem in $t$, with $x$ frozen, turns the quotient
          into $\dfrac{\partial f}{\partial t}(x, t + \theta h)$ for some
          $\theta$ between $0$ and $1$, and on such a rectangle continuity is
          uniform — one $\delta$ works everywhere at once. So a single
          restriction on $|h|$ controls the error for *every* $x$ at the same
          time, and the two integrals differ by at most
          $\varepsilon (b - a)$.
      - ask: >
          On $[0,1] \times [-1,1]$ let $f(x,t) = \dfrac{2xt^2}{(x^2 + t^2)^2}$
          away from the origin, with $f(0,0) = 0$. Then
          $I(t) = \dfrac{1}{1 + t^2}$ for $t \ne 0$ while $I(0) = 0$, and
          $\dfrac{\partial f}{\partial t}(x,0) = 0$ for every $x$. What has
          gone wrong?
        choices:
          - text: >
              Nothing has gone wrong: the rule gives
              $I'(0) = \int_0^1 0\,dx = 0$, which is the right answer.
            feedback: >
              $I$ jumps from $0$ at $t = 0$ to values near $1$ for small
              $t \ne 0$, so $I$ is not continuous at $0$ and $I'(0)$ does not
              exist at all. A formula returning $0$ is answering a question
              that has no answer.
          - text: >
              The rectangle $[0,1] \times [-1,1]$ is not closed, so the rule
              never applied.
            feedback: >
              That rectangle is both closed and bounded. The defect lives in
              $f$, not in the region it is integrated over.
          - text: >
              $f$ is not continuous on the rectangle — it is unbounded near the
              origin — so the hypothesis the rule needs is simply absent.
            correct: true
            feedback: >
              Along the line $x = t$ the integrand equals
              $\dfrac{2t \cdot t^2}{(2t^2)^2} = \dfrac{1}{2t}$, which blows up
              as $t \to 0$, so $f$ is nowhere near continuous at the origin.
              The spike keeps total area close to $1$ while escaping into the
              corner, and $I$ inherits the jump.
          - text: >
              The partial derivative was evaluated at $t = 0$ rather than at a
              general $t$, which is what broke the computation.
            feedback: >
              $\dfrac{\partial f}{\partial t}(x,0)$ is exactly what the rule
              would integrate to produce $I'(0)$, and it genuinely is $0$ for
              every $x$. The formula was applied correctly; the hypothesis it
              needs was missing.
        feedback: >
          Both hypotheses ask for continuity on a closed bounded rectangle, and
          both are load-bearing. Without them the interchange can hand back a
          confident number where no derivative exists.
      - teach: >
          Now run the rule in the direction that pays. For $t$ in $[1,5]$,
          $\int_0^1 x^t\,dx = \dfrac{1}{t + 1}$, and both $x^t$ and its
          $t$-partial are continuous on $[0,1] \times [1,5]$ once the value $0$
          is assigned at $x = 0$. Since
          $\dfrac{\partial}{\partial t} x^t = x^t \ln x$, differentiating both
          sides in $t$ conjures a logarithm into the integrand that was never
          there.
      - ask: >
          Starting from $\int_0^1 x^t\,dx = \dfrac{1}{t + 1}$ and
          differentiating in $t$, what is $\int_0^1 x^4 \ln x\,dx$?
        expects: "-1/25"
        hint: >
          Differentiate $\dfrac{1}{t + 1}$ with respect to $t$, then set
          $t = 4$.
        feedback: >
          $-\dfrac{1}{25}$. Differentiating both sides of
          $\int_0^1 x^t\,dx = \dfrac{1}{t + 1}$ in $t$ gives
          $\int_0^1 x^t \ln x\,dx = -\dfrac{1}{(t + 1)^2}$, and $t = 4$ turns
          the right-hand side into $-\dfrac{1}{25}$. Integration by parts
          agrees: the boundary term $\dfrac{x^5}{5}\ln x$ vanishes at both ends
          and what is left is $-\int_0^1 \dfrac{x^4}{5}\,dx = -\dfrac{1}{25}$.
