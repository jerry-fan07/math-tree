unit: foundations.logic
opening: >
  Mathematics is written in a small, rigid language: claims joined by "not",
  "and", "or", "if ... then" and "if and only if", and generalised by "for
  every" and "there exists". This unit builds that language from its atoms —
  the propositions and the connectives, the truth table that evaluates any
  combination of them, the equivalences that let one statement be rewritten as
  another, the inference rules that decide when a conclusion really follows,
  and finally predicates and the two quantifiers, whose order and whose
  negation are where most of the errors in a first proof course live. Nothing
  here is a matter of taste: a compound statement in $n$ letters has $2^n$
  cases, and settling all of them settles the question. By the end you will be
  able to negate any statement mechanically, tell a theorem from its converse,
  judge an argument valid or invalid from its shape alone, and read a stacked
  quantifier string for exactly what it claims and no more.
lessons:
  - node: foundations.logic.def-proposition
    hook: >
      Before you can check an argument you have to know what it is made of.
      This is the line between the sentences logic can handle and the ones it
      cannot, and it is why the whole subject reduces to finite bookkeeping.
    explanation: >
      Look at four sentences. "$7$ is prime." "$2 + 2 = 5$." "Is $7$ prime?"
      "Close the door." The first two come with a verdict attached — one true,
      one false — and the last two do not, because a question and a command are
      not the kind of thing that can be true. A proposition is a declarative
      sentence that is either true or false and not both, and that verdict,
      written $\mathrm{T}$ or $\mathrm{F}$, is its truth value.

      Notice what is *not* required: that you know which verdict it is. "Every
      even integer greater than $2$ is the sum of two primes" is a proposition,
      even though nobody has settled it — it is true or false as a matter of
      fact, and our ignorance is not a third option. What does disqualify a
      sentence is having no verdict to give. A sentence carrying an unassigned
      variable, such as "$x > 3$", is the common case: it says nothing definite
      until you say what $x$ is, and then it becomes true or false.

      With the atoms fixed, you write letters $p, q, r$ for unspecified
      propositions, and a compound proposition is anything built from such
      letters by connectives. A truth assignment is a choice of $\mathrm{T}$ or
      $\mathrm{F}$ for each letter that occurs. Bivalence — exactly one of two
      values, always — is what makes everything afterwards mechanical: two
      letters admit only four assignments, each of them pins the value of the
      compound, so any question that depends on truth values alone can be
      settled by walking a finite list rather than by argument.
    worked: >
      Sort four sentences. "$13$ is a perfect square" is declarative and false,
      so it is a proposition with truth value $\mathrm{F}$. "$n^2 \ge n$"
      carries an unassigned $n$, so it has no truth value and is not a
      proposition. "Prove that $13$ is prime." is a command, so it is not one
      either. "It rains tomorrow or it does not rain tomorrow" is declarative
      and true whatever the weather does, so it is a proposition — a compound
      one, built from a single letter. Two of the four qualify.
    pitfalls: >
      Do not read "we do not know its truth value" as "it is not a
      proposition": an unsolved conjecture is a perfectly good proposition.
      Sentences with a free variable are the reverse trap — "$x + 1 = 5$" looks
      like an equation you could call true, but it is true only for the $x$ you
      have not been given.
    recap: >
      A proposition is a declarative sentence carrying exactly one of the two
      truth values, and letters standing for propositions plus a truth
      assignment to those letters are all the raw material logic needs.
    steps:
      - teach: >
          Logic works on claims — sentences that assert something that is
          either so or not so. Questions, commands and requests carry no
          verdict, so they are outside the subject from the start.
      - teach: >
          A proposition is a declarative sentence that is either true or false
          and not both. Its verdict, $\mathrm{T}$ or $\mathrm{F}$, is its truth
          value, and that value belongs to the sentence whether or not anyone
          knows it.
      - ask: >
          Which of these is a proposition?
        choices:
          - text: >
              Is $12$ divisible by $3$?
            feedback: >
              A question asks for a verdict rather than delivering one, so
              there is nothing here to call true or false.
          - text: >
              $12$ is divisible by $3$
            correct: true
            feedback: >
              Declarative, and definitely true — one sentence, one truth value.
          - text: >
              $x$ is divisible by $3$
            feedback: >
              The variable is unassigned, so the sentence is true for $x = 6$
              and false for $x = 7$ and has no verdict of its own.
        feedback: >
          Only the flat declarative sentence qualifies. Test any candidate by
          asking whether "is that true?" has an answer before you supply
          anything further.
      - teach: >
          Being undecided is not being undefined. "Every even integer greater
          than $2$ is the sum of two primes" has never been proved or refuted,
          yet it is a proposition: it is true or it is false, and mathematics
          simply does not yet know which.
      - ask: >
          Is "$x^2 \ge 0$", with $x$ left unspecified, a proposition?
        choices:
          - text: >
              Yes, because it happens to hold for every real number
            feedback: >
              Holding for every value is a fact about the predicate, not a
              truth value the bare sentence has — and it is stated only once
              you attach "for every $x$", which the sentence does not say.
          - text: >
              No, because the variable has no assigned value
            correct: true
            feedback: >
              With $x$ unassigned there is nothing to evaluate. Fix $x = 3$ and
              you get a proposition; leave it open and you do not.
          - text: >
              No, because its truth value is unknown
            feedback: >
              Unknown truth values are fine — an unsolved conjecture is still a
              proposition. The defect here is different: there is no value to
              be known.
        feedback: >
          A free variable, not ignorance, is what blocks a truth value.
          Assigning the variable repairs the sentence.
      - teach: >
          Letters $p, q, r$ stand for unspecified propositions, and a compound
          proposition is one built from such letters by connectives. A truth
          assignment is a choice of $\mathrm{T}$ or $\mathrm{F}$ for each letter
          appearing in it.
      - ask: >
          How many different truth assignments are there to the letters of a
          compound proposition built from $p$ and $q$?
        expects: "4"
        hint: >
          Each letter independently takes one of two values.
        feedback: >
          Four: $p$ has $2$ choices and $q$ has $2$, giving
          $2 \times 2 = 4$ assignments — $\mathrm{TT}$, $\mathrm{TF}$,
          $\mathrm{FT}$, $\mathrm{FF}$.
      - teach: >
          Bivalence is the engine of everything that follows. Because each
          letter takes exactly one of two values, a compound proposition's value
          is fixed by each assignment, and a finite list of cases decides every
          question about it that truth values can decide.

  - node: foundations.logic.def-negation
    hook: >
      Half of mathematics is refuting things, and you cannot refute a claim you
      have stated the opposite of by accident. Negation is the one connective
      you will apply thousands of times, usually under pressure.
    explanation: >
      Negation is the simplest connective there is: $\neg p$, read "not $p$",
      is true exactly when $p$ is false, and false exactly when $p$ is true.
      There are only two cases to record. If $p$ is $\mathrm{T}$ then $\neg p$
      is $\mathrm{F}$; if $p$ is $\mathrm{F}$ then $\neg p$ is $\mathrm{T}$. It
      takes one argument, unlike every other connective, and it does nothing
      but flip.

      The trouble is never the definition; it is the English. "It is not the
      case that $p$" is always a correct rendering, however clumsy, because it
      changes nothing but the verdict. Idiomatic opposites are the danger,
      because English reaches for the *contrary* rather than the denial, and
      the contrary is a stronger claim. The denial of "all of them are red" is
      "at least one is not red" — one exception suffices. "None is red" is a
      different, much stronger sentence, and asserting it when you only needed
      the denial saddles you with proving far more than you must.

      The test that catches every such error is the boundary. For a fixed $x$,
      the denial of "$x > 3$" must be true in precisely the cases where "$x >
      3$" is false, and $x = 3$ is one of those cases. So the negation is "$x
      \le 3$", not "$x < 3$": at $x = 3$ the original is false, so its negation
      must be true, and "$x < 3$" is not. Negation splits the possibilities into
      two parts with nothing left over and nothing counted twice, so whenever
      you write one down, check the borderline case explicitly.
    worked: >
      Negate "the temperature is at least $30$ degrees". Write it as $p$: "the
      temperature is $\ge 30$". The cases where $p$ is false are exactly the
      temperatures below $30$, so $\neg p$ is "the temperature is less than
      $30$ degrees". Check the boundary: at exactly $30$, $p$ is true, so
      $\neg p$ must be false, and "less than $30$" is indeed false there. At
      $29.9$, $p$ is false and $\neg p$ is true. Every temperature makes
      exactly one of the two true, which is what a correct negation looks like.
    pitfalls: >
      Overshooting into the contrary is the standard error: the denial of "all"
      is "not all", meaning at least one exception, never "none". Dropping the
      boundary is the other: the negation of "$x > 3$" is "$x \le 3$", and
      writing "$x < 3$" leaves the single value $x = 3$ satisfying neither
      sentence.
    recap: >
      $\neg p$ is true in exactly the cases where $p$ is false, so a correct
      negation covers the leftover cases exactly — boundary included, and no
      further.
    steps:
      - teach: >
          $\neg p$, read "not $p$", is true when $p$ is false and false when
          $p$ is true. Two cases, one flip, and it is the only connective that
          takes a single argument.
      - teach: >
          "It is not the case that $p$" is always a safe rendering into English.
          It is ugly, and it is never wrong, which makes it the fallback when an
          idiomatic negation starts to feel slippery.
      - ask: >
          For a fixed number $x$, which sentence is the negation of "$x \ge 5$"?
        choices:
          - text: >
              $x \le 5$
            feedback: >
              At $x = 5$ both this and the original are true, and a statement
              and its negation can never be true together.
          - text: >
              $x < 5$
            correct: true
            feedback: >
              The original fails exactly for the numbers below $5$, and this
              sentence holds exactly there — including at the boundary, where
              $x = 5$ makes the original true and this one false.
          - text: >
              $x > 5$
            feedback: >
              This leaves $x = 5$ out: the original is true there, but so is
              nothing on this side, and the two sentences fail to cover all
              cases between them.
        feedback: >
          Take the cases the original misses, all of them and only them:
          $x < 5$. Boundary values are where negations go wrong, so test them
          first.
      - teach: >
          That is the general test. A statement and its negation must partition
          the possibilities — each case makes exactly one of the two true, with
          nothing left over and nothing shared.
      - teach: >
          English pulls you toward the contrary instead of the denial. The
          contrary of "all of them are red" is "none is red"; the denial is only
          "at least one is not red", which is a far cheaper claim to establish.
      - ask: >
          Which sentence is the negation of "every light in the room is on"?
        choices:
          - text: >
              Every light in the room is off
            feedback: >
              That is the contrary, and it is much stronger. A room with one
              light off and the rest on refutes the original without satisfying
              this.
          - text: >
              At least one light in the room is off
            correct: true
            feedback: >
              A single exception is exactly what it takes for "every light is
              on" to fail, so this holds in precisely the cases the original
              does not.
          - text: >
              Not every light in the room is off
            feedback: >
              This denies the wrong sentence — it is the negation of "every
              light is off", and it is true in a fully lit room, where the
              original is true too.
        feedback: >
          "At least one is off" is the denial. Denying a claim about all the
          things needs one counterexample, not a claim about all the things
          again.
      - teach: >
          Write the mechanical negation first and tidy the English afterwards.
          The clumsy "it is not the case that ..." never overshoots, and every
          negation you polish should be checked back against it.

  - node: foundations.logic.def-conjunction
    hook: >
      "And" is the connective that lets one statement carry several demands at
      once, and it is the shape of every definition with more than one clause.
      It is also the easiest one to satisfy yourself you have proved when you
      have only proved half.
    explanation: >
      The conjunction $p \land q$, read "$p$ and $q$", is true in exactly one of
      the four combinations of truth values: the one where $p$ and $q$ are both
      true. If either half fails, the conjunction fails. Write the four cases
      out and there is nothing else to know — $\mathrm{T}$ with $\mathrm{T}$
      gives $\mathrm{T}$, and $\mathrm{T}$ with $\mathrm{F}$, $\mathrm{F}$ with
      $\mathrm{T}$, and $\mathrm{F}$ with $\mathrm{F}$ all give $\mathrm{F}$.

      What takes practice is spotting conjunctions in English, because they
      hide behind words that sound like they mean more. "It is raining but the
      game is still on" translates to $r \land g$, and so do "it is raining, yet
      the game is on", "although it is raining, the game is on", and "it is
      raining while the game goes on". Each of those English words adds
      contrast, surprise, or timing — and the connective records none of that.
      It records only which combinations of truth values are permitted, and all
      four sentences permit exactly one: both parts true.

      That deliberate forgetting has a consequence worth naming. Since only the
      combination matters, $p \land q$ and $q \land p$ have identical values in
      every case, so swapping the halves of an "and" never changes what is
      claimed — even where the English would sound wrong reversed. "She sat down
      and the chair broke" and "the chair broke and she sat down" say the same
      thing to logic, which is one honest price of the simplification.
    worked: >
      Evaluate "$9$ is odd and $9$ is prime". The first half is true, since
      $9 = 2 \cdot 4 + 1$. The second is false, since $9 = 3 \cdot 3$. A
      conjunction needs both, so the whole sentence is false — even though half
      of it is true and the true half is the more interesting one. Compare
      "$9$ is odd and $9$ is a perfect square": both halves hold, so this
      conjunction is true.
    pitfalls: >
      Establishing one conjunct and stopping is the everyday version of the
      error, and it is exactly how a two-clause definition gets half-checked.
      Reading "but" as something other than "and" is the translation version:
      the contrast it signals is rhetorical and carries no truth-value content.
    recap: >
      $p \land q$ is true only when both parts are true, and every English word
      of joining-with-contrast — but, yet, although, while — translates to it.
    steps:
      - teach: >
          $p \land q$, read "$p$ and $q$", is true in exactly one of the four
          combinations: both parts true. In the other three it is false.
      - teach: >
          So an "and" is a list of demands, all of which must be met. Half a
          conjunction established is no conjunction established.
      - ask: >
          In how many of the four combinations of truth values for $p$ and $q$
          is $p \land q$ true?
        expects: "1"
        hint: >
          List the four: both true, $p$ only, $q$ only, neither.
        feedback: >
          One. Only $p$ true with $q$ true survives; the three combinations
          containing at least one $\mathrm{F}$ all make the conjunction false.
      - teach: >
          English hides conjunctions behind words that add colour. "It is
          raining but the game is on" is $r \land g$ — the "but" signals
          surprise, and surprise is not a truth value.
      - ask: >
          Which of these does *not* translate to a conjunction of "it is cold"
          and "the pool is open"?
        choices:
          - text: >
              It is cold, yet the pool is open
            feedback: >
              "Yet" is contrast, and contrast is rhetorical. This is true in
              exactly the situations where both parts hold.
          - text: >
              Although it is cold, the pool is open
            feedback: >
              "Although" behaves the same way: it flags that the combination is
              unexpected, and asserts that the combination occurs.
          - text: >
              If it is cold, the pool is open
            correct: true
            feedback: >
              This one asserts a link rather than both facts. On a warm day it
              can still be true, whereas the conjunction requires cold weather.
        feedback: >
          But, yet, although and while are all $\land$. "If ... then" is a
          different connective entirely, and it does not claim its parts are
          true.
      - teach: >
          Because only the combination of values matters, $p \land q$ and
          $q \land p$ agree in every case. Order of the halves carries no
          logical content, however much it carries in English.
      - ask: >
          Is "$4$ is even and $4$ is prime" true or false?
        choices:
          - text: >
              True, since $4$ is even
            feedback: >
              One true half is not enough — that is precisely the error a
              conjunction is designed to catch.
          - text: >
              False, since $4$ is not prime
            correct: true
            feedback: >
              $4 = 2 \cdot 2$, so the second half fails, and one failed
              conjunct makes the whole false regardless of the first.
          - text: >
              Neither, since the two halves disagree
            feedback: >
              A compound proposition always takes one of two values; disagreeing
              parts give a false conjunction, not a missing verdict.
        feedback: >
          False. Check each conjunct separately, and the moment one fails the
          conjunction is settled.

  - node: foundations.logic.def-disjunction
    hook: >
      Mathematical "or" is not the "or" of a restaurant menu, and the gap
      between the two is a standing source of wrong answers. Fixing the
      convention now costs one sentence; missing it costs a case in every proof
      that splits.
    explanation: >
      The disjunction $p \lor q$, read "$p$ or $q$", is true when at least one
      of the two is true, and false only when both fail. Of the four
      combinations, three make it true — both true, $p$ alone, $q$ alone — and
      only $\mathrm{F}$ with $\mathrm{F}$ makes it false. In particular, "both"
      is one of the cases that satisfies it. This is the inclusive or, and it is
      the mathematical default, without exception and without announcement.

      The convention earns its keep constantly. "$x \le 0$ or $x \ge 0$" is a
      true statement about every real number, and it had better be, since it is
      the case split you use to argue about signs — but at $x = 0$ both halves
      hold, and under an exclusive reading the sentence would be false exactly
      where you most want it. Any statement that splits into overlapping cases
      relies on "or" tolerating the overlap.

      Everyday "or" often means something else. "The set menu comes with soup or
      salad" promises one, not both; that is the exclusive or, written
      $p \oplus q$, true exactly when one holds and the other does not. It is a
      genuinely different connective, differing from $\lor$ in a single case out
      of four, the case where both parts are true. Because English is ambiguous
      between them, mathematical writing that means the exclusive one spells it
      out: "either $p$ or $q$, but not both". If nothing is spelled out, it is
      inclusive.
    worked: >
      Evaluate "$7$ is even or $7$ is prime". The first half is false and the
      second is true, so at least one holds and the disjunction is true. Now
      evaluate "$6$ is even or $6$ is a multiple of $3$". Both halves are true,
      so the inclusive disjunction is true — while the exclusive version, "$6$
      is even or a multiple of $3$ but not both", would be false. One case out
      of four is the entire difference between the two connectives.
    pitfalls: >
      Reading a mathematical "or" as exclusive quietly deletes the overlap case,
      which is usually the interesting one — and it makes true statements like
      "$x \le 0$ or $x \ge 0$" look false at $x = 0$. In the other direction,
      proving a disjunction does not require deciding which half holds: showing
      that they cannot both fail is enough.
    recap: >
      $p \lor q$ means at least one, so it is false in only one of the four
      cases; the exclusive "one but not both" is a different connective and must
      be said out loud.
    steps:
      - teach: >
          $p \lor q$ is true when at least one of $p$, $q$ is true. Of the four
          combinations only both-false makes it false, so a disjunction is a
          low bar to clear.
      - teach: >
          Crucially, "both true" counts as satisfying it. This is the inclusive
          or, and it is what "or" means in mathematics unless a sentence says
          otherwise.
      - ask: >
          In how many of the four combinations of truth values for $p$ and $q$
          is $p \lor q$ true?
        expects: "3"
        hint: >
          Count the combinations it rules out rather than the ones it allows.
        feedback: >
          Three. Only $p$ false with $q$ false fails, so $4 - 1 = 3$
          combinations make the disjunction true.
      - teach: >
          The convention pays off in case splits. "$x \le 0$ or $x \ge 0$" is
          true of every real number, and at $x = 0$ it is true because both
          halves hold — an exclusive reading would break it exactly there.
      - ask: >
          Which sentence is false?
        choices:
          - text: >
              $5$ is odd or $5$ is prime
            feedback: >
              Both halves are true, and "both" is one of the three cases an
              inclusive or accepts.
          - text: >
              $5$ is even or $5$ is prime
            feedback: >
              The first half fails, but the second holds, and one true half is
              all a disjunction asks for.
          - text: >
              $5$ is even or $5$ is a perfect square
            correct: true
            feedback: >
              Both halves fail — $5$ is odd and lies strictly between $4$ and
              $9$ — and both failing is the single case that kills a
              disjunction.
        feedback: >
          A disjunction is false only when everything in it is false. To refute
          one you must knock down every part.
      - teach: >
          Everyday "or" is often exclusive: soup or salad promises one, not
          both. That connective, $p \oplus q$, is true when exactly one part
          holds, and it differs from $\lor$ in a single case out of four.
      - ask: >
          A theorem's proof needs "either $p$ or $q$" to mean the exclusive one.
          What must the author do?
        choices:
          - text: >
              Nothing — "either ... or" already signals exclusivity
            feedback: >
              "Either" adds emphasis, not a change of connective; readers of
              mathematics will still take the inclusive reading.
          - text: >
              Say so explicitly, as in "either $p$ or $q$, but not both"
            correct: true
            feedback: >
              The default is inclusive, so the exclusive reading has to be
              stated. The "but not both" clause is what rules out the fourth
              case.
          - text: >
              Write $p \lor q$ and rely on context
            feedback: >
              $p \lor q$ is by definition the inclusive one, so this asserts
              something weaker than intended and the proof will not carry.
        feedback: >
          Spell it out. Silence means inclusive, so an unannounced exclusive
          "or" is simply read as the wrong statement.

  - node: foundations.logic.truth-table
    hook: >
      Every question about a compound statement that depends only on truth
      values has a purely mechanical answer, and this is the machine that
      produces it. When intuition and a proof disagree, this is the referee.
    explanation: >
      Each connective's output depends on nothing but its inputs' truth values.
      That single fact means a compound proposition in $n$ letters is a function
      on the $2^n$ truth assignments, and a truth table is that function written
      out in full: one row per assignment, one column per letter, then a column
      for each subformula in order of increasing size. Every column after the
      first few is computed from earlier ones by the defining condition of its
      outermost connective, so no step requires thought — only lookup.

      The order in which the subformulas get built is fixed by parentheses, and
      where they are absent, by precedence: $\neg$ binds tightest, then
      $\land$, then $\lor$. So $\neg p \land q$ means $(\neg p) \land q$, not
      $\neg(p \land q)$ — and those two differ, for instance when $p$ and $q$
      are both false, where the first is false and the second true. When in
      doubt, put the parentheses in.

      Build the table for $(p \lor q) \land \neg p$. Four rows, since two
      letters. With $p$ true and $q$ true: $p \lor q$ is $\mathrm{T}$ and
      $\neg p$ is $\mathrm{F}$, so the whole is $\mathrm{F}$. With $p$ true and
      $q$ false: $\mathrm{T}$ and $\mathrm{F}$, again $\mathrm{F}$. With $p$
      false and $q$ true: $p \lor q$ is $\mathrm{T}$ and $\neg p$ is
      $\mathrm{T}$, so the whole is $\mathrm{T}$. With both false: $p \lor q$ is
      $\mathrm{F}$, so the whole is $\mathrm{F}$. One row out of four, and the
      statement says exactly "$q$ but not $p$".

      The method is exhaustive and finite, so it settles anything truth values
      can settle — at a price. Each new letter doubles the table: $3$ letters
      give $8$ rows, $10$ give $1024$. That growth is why the equivalence laws
      exist, and why nobody checks a large statement this way twice.
    worked: >
      Take $\neg(p \lor q) \lor q$ and run all four rows. Row $p$ true, $q$
      true: $p \lor q$ is $\mathrm{T}$, its negation $\mathrm{F}$, and
      $\mathrm{F} \lor \mathrm{T}$ is $\mathrm{T}$. Row $p$ true, $q$ false:
      $p \lor q$ is $\mathrm{T}$, negation $\mathrm{F}$, and
      $\mathrm{F} \lor \mathrm{F}$ is $\mathrm{F}$. Row $p$ false, $q$ true:
      $p \lor q$ is $\mathrm{T}$, negation $\mathrm{F}$, and
      $\mathrm{F} \lor \mathrm{T}$ is $\mathrm{T}$. Row $p$ false, $q$ false:
      $p \lor q$ is $\mathrm{F}$, negation $\mathrm{T}$, and
      $\mathrm{T} \lor \mathrm{F}$ is $\mathrm{T}$. Three of the four rows are
      true, and the one false row is $p$ true with $q$ false.
    pitfalls: >
      Skipping the intermediate columns is where arithmetic slips creep in —
      write the subformula columns, even when the formula looks small. Getting
      precedence wrong is the other standard error: $\neg p \lor q$ negates only
      $p$, and if you meant to negate the whole disjunction you must write the
      parentheses.
    recap: >
      A truth table lists all $2^n$ assignments and computes the compound
      column by column from its subformulas — mechanical, exhaustive, and
      doubling in size with every new letter.
    steps:
      - teach: >
          A connective's output depends only on its inputs' truth values. So a
          compound in $n$ letters is completely described by what it does on
          each of the $2^n$ assignments — a finite table, not an open question.
      - ask: >
          How many rows does the truth table of a compound proposition in $3$
          letters have?
        expects: "8"
        hint: >
          Each letter doubles the number of assignments.
        feedback: >
          Eight: $2^3 = 8$. Each of the three letters is chosen independently
          as $\mathrm{T}$ or $\mathrm{F}$.
      - teach: >
          The table has one column per letter, then one for each subformula in
          order of increasing size. Each new column is filled in from earlier
          columns by the defining condition of its outermost connective.
      - ask: >
          Without parentheses, what does $\neg p \land q$ mean?
        choices:
          - text: >
              $\neg(p \land q)$
            feedback: >
              That reading gives $\neg$ the loosest grip, but it binds tightest
              of the three — and the two readings differ, for instance when $p$
              and $q$ are both false.
          - text: >
              $(\neg p) \land q$
            correct: true
            feedback: >
              $\neg$ binds tightest, so it grabs only the letter beside it, and
              the conjunction is formed afterwards.
          - text: >
              It is ambiguous and must be parenthesised
            feedback: >
              The precedence order $\neg$, then $\land$, then $\lor$ settles it
              — though writing the parentheses anyway is good practice.
        feedback: >
          Precedence runs $\neg$ tightest, then $\land$, then $\lor$. When a
          formula gets long, parentheses cost nothing and remove the question.
      - teach: >
          Work $(p \lor q) \land \neg p$ row by row. Both true gives
          $\mathrm{T} \land \mathrm{F} = \mathrm{F}$; $p$ true, $q$ false gives
          $\mathrm{T} \land \mathrm{F} = \mathrm{F}$; $p$ false, $q$ true gives
          $\mathrm{T} \land \mathrm{T} = \mathrm{T}$; both false gives
          $\mathrm{F} \land \mathrm{T} = \mathrm{F}$.
      - ask: >
          In how many rows of its four-row table is $(p \lor q) \land \neg p$
          true?
        expects: "1"
        hint: >
          The second conjunct already forces $p$ to be false; then the first
          conjunct decides.
        feedback: >
          One — the row with $p$ false and $q$ true. $\neg p$ kills both rows
          where $p$ is true, and of the remaining two only $q$ true keeps
          $p \lor q$ alive.
      - teach: >
          That column is the whole meaning of the statement: it says "$q$ and
          not $p$". Two compounds with the same column are interchangeable, and
          the table is what lets you see that.
      - teach: >
          The cost is growth. Every added letter doubles the rows, so ten
          letters need $1024$ of them. That is exactly why the rewriting laws
          are worth learning instead of tabulating everything.

  - node: foundations.logic.def-conditional
    hook: >
      Almost every theorem you will ever read is a conditional, so the one row
      where it counts as false is the row that decides what proving it means.
      Its behaviour on a false hypothesis is where most first-year confusion
      lives.
    explanation: >
      Think of $p \to q$, "if $p$ then $q$", as a promise: "if you finish the
      work, I will pay you". When is the promise broken? Only in one situation
      — you finish the work and are not paid. If you never finish, the promise
      is not broken, whether you get paid or not, because the promise said
      nothing about that case. That is the conditional exactly: $p \to q$ is
      false in the single case where $p$ is true and $q$ is false, and true in
      the other three.

      Here $p$ is the hypothesis, also called the antecedent, and $q$ is the
      conclusion, or consequent. The consequence people find strange is that a
      false hypothesis makes the whole conditional true, regardless of the
      conclusion — "if $2 + 2 = 5$ then $7$ is even" is a true statement. It has
      to be, if the connective is to depend only on truth values, and it does no
      harm: a conditional with a false hypothesis is a promise never called in.

      This is the *material* conditional. It claims no causation, no relevance,
      and no order in time — only that the one forbidden combination does not
      occur. "If $3$ is prime then Paris is in France" is true, and its two
      halves have nothing to do with each other.

      English says $p \to q$ in many ways, and one of them reverses on you.
      "$q$ if $p$", "$p$ implies $q$", "$p$ is sufficient for $q$" and "$q$ is
      necessary for $p$" are all $p \to q$; so is "$p$ only if $q$". That last
      one is worth dwelling on: "you may enter only if you have a ticket" does
      not promise entry to ticket holders, it rules out entry without a ticket
      — so it is entering $\to$ ticket, and not the other way round.
    worked: >
      Evaluate three conditionals about the number $6$. "If $6$ is even then
      $6$ is divisible by $3$": hypothesis true, conclusion true, so the
      conditional is true. "If $6$ is even then $6 > 10$": hypothesis true,
      conclusion false — the forbidden combination — so this one is false. "If
      $6$ is odd then $6 > 10$": the hypothesis is false, so nothing is
      promised and the conditional is true, even though its conclusion is false.
      Only the middle statement fails.
    pitfalls: >
      Asserting $p \to q$ does not assert $p$, and it does not assert $q$;
      proving a theorem gives you the arrow, not its parts. "$p$ only if $q$"
      means $p \to q$, not $q \to p$ — this is the single most reversed phrase
      in mathematical English. Expecting the two halves to be related in
      meaning misreads the connective: relevance is a habit of good writing,
      not a condition in the definition.
    recap: >
      $p \to q$ is false only when the hypothesis holds and the conclusion
      fails, so a false hypothesis makes it true by default.
    steps:
      - teach: >
          Read $p \to q$ as a promise: "if you finish the work, I will pay
          you". The promise is broken in exactly one situation — the work is
          finished and the payment does not come.
      - ask: >
          The promise is "if you finish the work, I will pay you". In which
          situation has the promise been broken?
        choices:
          - text: >
              You do not finish, and you are not paid
            feedback: >
              The promise said nothing about this case, so nothing was
              violated. A promise that is never triggered is never broken.
          - text: >
              You finish, and you are not paid
            correct: true
            feedback: >
              Hypothesis true, conclusion false — the one combination the
              conditional forbids.
          - text: >
              You do not finish, but you are paid anyway
            feedback: >
              Generous, not dishonest. The promise gave a guarantee in one
              direction only, and paying beyond it breaks nothing.
        feedback: >
          Only "finished but unpaid" breaks it. That single case is the whole
          content of the conditional.
      - teach: >
          So $p \to q$ is false exactly when $p$ is true and $q$ is false, and
          true in the other three cases. $p$ is the hypothesis, or antecedent;
          $q$ is the conclusion, or consequent.
      - ask: >
          In how many of the four combinations of truth values for $p$ and $q$
          is $p \to q$ true?
        expects: "3"
        hint: >
          Count the combinations it forbids.
        feedback: >
          Three. Exactly one combination — $p$ true with $q$ false — is
          forbidden, leaving $4 - 1 = 3$.
      - teach: >
          Two of those three true cases have a false hypothesis. That is why
          "if $2 + 2 = 5$ then $7$ is even" is a true statement: the promise is
          never called in, so it is never broken.
      - ask: >
          What is the truth value of "if $9$ is prime then $9$ is even"?
        choices:
          - text: >
              False, since $9$ is not even
            feedback: >
              A false conclusion only sinks a conditional when the hypothesis
              holds, and here it does not.
          - text: >
              True, since $9$ is not prime
            correct: true
            feedback: >
              $9 = 3 \cdot 3$, so the hypothesis fails and the forbidden
              combination cannot occur. The conditional is true by default.
          - text: >
              Neither, since both halves are false
            feedback: >
              A conditional is a proposition and always takes one of the two
              values; two false halves give the true case, not a missing one.
        feedback: >
          True. Check the hypothesis first: if it is false you are finished,
          whatever the conclusion says.
      - teach: >
          This is the material conditional. It claims no causation, no
          relevance and no order in time — only that the forbidden combination
          does not occur. "If $3$ is prime then Paris is in France" is true.
      - ask: >
          "You may enter only if you have a ticket" says which conditional?
        choices:
          - text: >
              If you have a ticket, you may enter
            feedback: >
              That promises entry to every ticket holder, which the sign does
              not — it reserves the right to turn you away for other reasons.
          - text: >
              If you enter, you have a ticket
            correct: true
            feedback: >
              "Only if" states a necessary condition: entering without a ticket
              is what is ruled out, so entering forces the ticket.
          - text: >
              You enter if and only if you have a ticket
            feedback: >
              That is both directions at once, and the sign gives only one —
              it never guarantees admission.
        feedback: >
          "$p$ only if $q$" is $p \to q$. The "only" marks $q$ as necessary for
          $p$, which points the arrow away from it, not toward it.

  - node: foundations.logic.def-biconditional
    hook: >
      Every definition you will meet is secretly this connective, and it is the
      reason "if and only if" proofs come in two halves. Prove one half and you
      have proved nothing at all about the other.
    explanation: >
      The biconditional $p \Leftrightarrow q$, read "$p$ if and only if $q$", is
      true when $p$ and $q$ have the same truth value and false when they
      differ. Two of the four combinations satisfy it: both true, and both
      false. It says the two statements stand or fall together.

      The useful way to hold it is as a conjunction of two conditionals,
      $(p \to q) \land (q \to p)$. Check the load-bearing case: suppose $p$ is
      true and $q$ is false. Then the biconditional is false, since the values
      differ; and $p \to q$ is false, being the forbidden combination, so the
      conjunction is false too. Now suppose both are true: the biconditional is
      true, and both conditionals are true, so the conjunction is. The
      remaining two cases go the same way, and the two expressions agree
      everywhere. Reading the English against that split, "$p$ only if $q$" is
      the half $p \to q$ and "$p$ if $q$" is the half $q \to p$ — which is why
      the phrase joins them with "and".

      This is why every characterisation theorem and every definition costs two
      proofs. "A triangle is equilateral if and only if its three angles are
      equal" requires you to argue from equal sides to equal angles, and
      separately from equal angles to equal sides. The halves are independent;
      one of them can be true while the other fails, and half of a
      biconditional leaves the statement unproved.

      One notational point. Of the connectives, the conditional binds second
      most loosely and the biconditional loosest of all, so an unparenthesised
      $p \to q \Leftrightarrow r$ means $(p \to q) \Leftrightarrow r$.
    worked: >
      Evaluate two biconditionals. "$3 > 2$ if and only if $4 > 3$": both halves
      are true, values agree, so the statement is true. "$3 > 2$ if and only if
      $2 > 3$": the first half is true and the second false, so the values
      differ and the statement is false — and indeed the half "if $3 > 2$ then
      $2 > 3$" is the forbidden combination on its own. Now take "$x = 2$ if
      and only if $x^2 = 4$" over the real numbers. The half "$x = 2$ implies
      $x^2 = 4$" holds; the half "$x^2 = 4$ implies $x = 2$" fails at
      $x = -2$. One good half, one bad half, and a false biconditional.
    pitfalls: >
      Proving one direction and declaring the biconditional done is the classic
      error, and it is invisible unless you write both halves out before
      starting. In definitions, mathematical writing traditionally says "if"
      where it means "if and only if" — "a number is called even if it is
      divisible by $2$" is a definition, and the converse is intended even
      though it is not written.
    recap: >
      $p \Leftrightarrow q$ is true exactly when the two sides share a truth
      value, and it unpacks as $(p \to q) \land (q \to p)$ — two independent
      claims, two proofs.
    steps:
      - teach: >
          $p \Leftrightarrow q$, read "$p$ if and only if $q$", is true when the
          two sides have the same truth value and false when they differ. Both
          true and both false are the two good cases.
      - ask: >
          In how many of the four combinations of truth values for $p$ and $q$
          is $p \Leftrightarrow q$ true?
        expects: "2"
        hint: >
          It asks for agreement, not for truth.
        feedback: >
          Two: both true, and both false. The two mixed combinations make it
          false.
      - teach: >
          It unpacks as $(p \to q) \land (q \to p)$. Test the sharp case: $p$
          true and $q$ false makes the biconditional false, and it also makes
          $p \to q$ false, so the conjunction is false — the two agree, and
          they agree in the other three cases as well.
      - teach: >
          The English splits the same way. "$p$ only if $q$" is the half
          $p \to q$, and "$p$ if $q$" is the half $q \to p$; the phrase "if and
          only if" is literally the two halves joined by "and".
      - ask: >
          Over the real numbers, "$x = 2$ if and only if $x^2 = 4$" is false.
          Which half fails?
        choices:
          - text: >
              The half saying $x = 2$ implies $x^2 = 4$
            feedback: >
              That half is fine — squaring $2$ does give $4$, with no
              exceptions to find.
          - text: >
              The half saying $x^2 = 4$ implies $x = 2$
            correct: true
            feedback: >
              At $x = -2$ the hypothesis holds and the conclusion fails, which
              is the forbidden combination and kills this direction.
          - text: >
              Both halves fail
            feedback: >
              Only one does. That is exactly why a biconditional needs both
              directions checked rather than one verdict.
        feedback: >
          The converse direction fails at $x = -2$. A single counterexample in
          one half is enough to sink the whole biconditional.
      - teach: >
          So every characterisation costs two proofs. "A triangle is
          equilateral if and only if its three angles are equal" needs the
          argument from sides to angles and, separately, from angles to sides.
      - ask: >
          You have proved that every equilateral triangle has three equal
          angles. What have you established about the biconditional?
        choices:
          - text: >
              The biconditional, since the two halves are equivalent
            feedback: >
              The halves are independent statements — the converse of a true
              conditional can be false, so it never comes free.
          - text: >
              One half of it; the other direction still needs its own proof
            correct: true
            feedback: >
              You have $p \to q$. The conjunction also demands $q \to p$, and
              until that is argued the biconditional is unproved.
          - text: >
              Nothing, until both halves are proved simultaneously
            feedback: >
              The halves are proved separately and in either order — one down,
              one to go, which is progress rather than nothing.
        feedback: >
          Half a biconditional is half a proof. Write both directions down
          before you start, so neither can be quietly skipped.
      - teach: >
          On precedence: the conditional binds second most loosely and the
          biconditional loosest of all, so $p \to q \Leftrightarrow r$ means
          $(p \to q) \Leftrightarrow r$.

  - node: foundations.logic.tautology-contradiction
    hook: >
      Some statements are true because of their shape alone, with no facts
      involved — those are the ones that become laws you may apply anywhere.
      Sorting a statement into always, never, or sometimes is one glance at its
      table.
    explanation: >
      Once you can build a truth table, the column under a compound proposition
      classifies it. If every entry is $\mathrm{T}$, the statement is a
      tautology: true no matter what its letters mean. The standard example is
      $p \lor \neg p$ — whichever value $p$ takes, one of the two disjuncts is
      true. If every entry is $\mathrm{F}$, it is a contradiction, like
      $p \land \neg p$, which demands a letter be both. If the column has both
      values, it is a contingency: true sometimes, false other times, which is
      what an ordinary statement looks like.

      A second word covers the loose end. A proposition is satisfiable if at
      least one row makes it true, and such a row is a satisfying assignment.
      Compare that with the classification: satisfiable means precisely *not* a
      contradiction. Every tautology is satisfiable, since all its rows are
      true; not every satisfiable statement is a tautology, since one true row
      out of four is enough. Contingencies are exactly the satisfiable
      non-tautologies.

      Negation swaps the two extremes, and the reason is one line: $\neg P$ is
      true in a row exactly when $P$ is false there. So if $P$ is false in every
      row, $\neg P$ is true in every row — $P$ is a contradiction exactly when
      $\neg P$ is a tautology. The same reasoning gives the other pairing: $P$
      is satisfiable exactly when $\neg P$ is not a tautology.

      All three properties are decided by inspection, at the honest cost of
      $2^n$ rows. That cost is why deciding satisfiability for large statements
      is a hard problem rather than an easy one.
    worked: >
      Classify $(p \land q) \lor \neg p$. Row $p$ true, $q$ true: $p \land q$ is
      $\mathrm{T}$, so the disjunction is $\mathrm{T}$. Row $p$ true, $q$ false:
      $p \land q$ is $\mathrm{F}$ and $\neg p$ is $\mathrm{F}$, so the
      disjunction is $\mathrm{F}$. Row $p$ false, $q$ true: $\neg p$ is
      $\mathrm{T}$, so the disjunction is $\mathrm{T}$. Row $p$ false, $q$
      false: $\neg p$ is $\mathrm{T}$ again, so $\mathrm{T}$. The column reads
      $\mathrm{T}, \mathrm{F}, \mathrm{T}, \mathrm{T}$ — both values appear, so
      it is a contingency; it is satisfiable, with three satisfying
      assignments; and it is not a tautology, the row $p$ true with $q$ false
      being the witness.
    pitfalls: >
      Checking a few rows and calling a statement a tautology is the standard
      overreach — one unchecked row is exactly where the counterexample hides.
      Satisfiable and true are different words: satisfiable says some
      assignment works, not that the assignment you have in mind does.
    recap: >
      Read the column: all true is a tautology, all false a contradiction,
      mixed a contingency, and at least one true row is satisfiability.
    steps:
      - teach: >
          A compound proposition's column in its truth table sorts it into
          three kinds: true in every row, false in every row, or a mixture.
      - teach: >
          True in every row is a tautology, like $p \lor \neg p$. False in every
          row is a contradiction, like $p \land \neg p$. Anything else is a
          contingency — an ordinary statement whose value depends on the facts.
      - ask: >
          How many satisfying assignments does $p \land \neg p$ have?
        expects: "0"
        hint: >
          Try each of the two values of $p$ in turn.
        feedback: >
          Zero. With $p$ true, $\neg p$ is false and the conjunction fails; with
          $p$ false, the first conjunct fails. No row survives, which is what
          makes it a contradiction.
      - teach: >
          Satisfiable means at least one row is true. So satisfiable is exactly
          the same as not-a-contradiction, and every tautology is satisfiable
          while plenty of satisfiable statements are not tautologies.
      - ask: >
          A compound proposition in two letters is true in exactly one of its
          four rows. What is it?
        choices:
          - text: >
              A tautology
            feedback: >
              A tautology needs every row true; one true row out of four is
              three rows short.
          - text: >
              A contradiction
            feedback: >
              A contradiction has no true row at all. This one has a
              satisfying assignment, so it is not one.
          - text: >
              A satisfiable contingency
            correct: true
            feedback: >
              One true row makes it satisfiable, and the three false rows keep
              it off the tautology list — mixed column, so a contingency.
        feedback: >
          One true row is exactly satisfiable-but-not-tautological, which is
          the contingency case.
      - teach: >
          Negation exchanges the extremes, and the reason is one line: $\neg P$
          is true in a row exactly when $P$ is false there. So $P$ false in
          every row means $\neg P$ true in every row.
      - ask: >
          $P$ is a contradiction. What is $\neg P$?
        choices:
          - text: >
              A contradiction as well
            feedback: >
              That would need $P$ to be true in every row and false in every
              row at once, which no proposition manages.
          - text: >
              A tautology
            correct: true
            feedback: >
              Every row of $P$ is $\mathrm{F}$, and negation flips each entry,
              so every row of $\neg P$ is $\mathrm{T}$.
          - text: >
              A contingency
            feedback: >
              Flipping a uniform column gives a uniform column; a mixture can
              only come from a mixture.
        feedback: >
          Negation turns the all-false column into the all-true one, so the
          negation of a contradiction is a tautology.
      - teach: >
          Every one of these questions is settled by inspection — and by $2^n$
          rows of work. That price is why finding a satisfying assignment for a
          large statement is a genuinely hard computational problem.

  - node: foundations.logic.logical-equivalence
    hook: >
      This is the licence to rewrite. Once two statements are known to have the
      same table, you may swap either for the other anywhere, which is how a
      forbidding statement gets turned into a manageable one.
    explanation: >
      Two compound propositions $P$ and $Q$ are logically equivalent, written
      $P \equiv Q$, when they take the same truth value under every assignment
      to their letters — that is, when their columns match row for row. There is
      a second way to say the same thing: $P \equiv Q$ exactly when
      $P \Leftrightarrow Q$ is a tautology, since the biconditional is true in
      precisely the rows where the two sides agree, and "every row" is what
      tautology means.

      Keep the two symbols apart. $\Leftrightarrow$ is a connective: it builds a
      new proposition, which may be true in some rows and false in others.
      $\equiv$ is not part of the language at all — it is an assertion made from
      outside, about two expressions, saying their tables are identical. You
      never nest $\equiv$ inside a formula.

      Equivalence behaves like equality. It is reflexive, symmetric and
      transitive, so chains of rewriting compose. More important, it is a
      congruence: if $A \equiv B$, then replacing an occurrence of $A$ inside a
      larger statement by $B$ leaves the value of that larger statement
      unchanged in every row. The reason is the same fact the truth table rests
      on — a connective sees only the truth values of its parts, so a part
      swapped for one with the same value in every row cannot change what comes
      out.

      That substitution property is the whole point. It is what turns a list of
      known equivalences into a calculus, letting you simplify a statement step
      by step, each step justified by one law, without ever building the full
      table again.
    worked: >
      Check $p \lor (q \land \neg q) \equiv p$. The inner $q \land \neg q$ is a
      contradiction, false in every row. Row $p$ true, $q$ true: the inner part
      is $\mathrm{F}$, so the disjunction is $\mathrm{T} \lor \mathrm{F} =
      \mathrm{T}$, matching $p$. Row $p$ true, $q$ false: again $\mathrm{T}$,
      matching. Row $p$ false, $q$ true: $\mathrm{F} \lor \mathrm{F} =
      \mathrm{F}$, matching $p$. Row $p$ false, $q$ false: $\mathrm{F}$,
      matching. All four rows agree, so the equivalence holds and any occurrence
      of $p \lor (q \land \neg q)$ may be replaced by the single letter $p$.
    pitfalls: >
      Equivalent does not mean true: $p \land q \equiv q \land p$ says the two
      sides always agree, and says nothing about whether either is true in the
      case at hand. Writing $\equiv$ inside a formula, as though it were a
      connective, is a category error — if you want a connective, you want
      $\Leftrightarrow$.
    recap: >
      $P \equiv Q$ says the two columns agree in every row, equivalently that
      $P \Leftrightarrow Q$ is a tautology — and equivalent parts may be
      swapped inside any statement without changing its value.
    steps:
      - teach: >
          $P \equiv Q$ means the two statements take the same truth value under
          every assignment: their truth-table columns are identical, row for
          row.
      - teach: >
          Equivalently, $P \equiv Q$ holds exactly when $P \Leftrightarrow Q$ is
          a tautology. The biconditional is true in the rows where the sides
          agree, so "true in every row" is the same demand as "agree in every
          row".
      - ask: >
          What does $P \equiv Q$ assert?
        choices:
          - text: >
              That $P$ and $Q$ are both true
            feedback: >
              It says nothing about their being true — two contradictions are
              equivalent, and neither is true anywhere.
          - text: >
              That $P$ and $Q$ have the same value in every row
            correct: true
            feedback: >
              Identical columns, which is exactly the condition that makes
              $P \Leftrightarrow Q$ a tautology.
          - text: >
              That $P \Leftrightarrow Q$ is satisfiable
            feedback: >
              Satisfiable asks for one good row; equivalence asks for all of
              them. Any two statements that agree even once would pass this
              weaker test.
        feedback: >
          Same column, every row. Equivalence is agreement, not truth.
      - teach: >
          The two symbols do different jobs. $\Leftrightarrow$ is a connective
          and builds a proposition; $\equiv$ is an assertion made from outside
          about two expressions, and never appears inside a formula.
      - teach: >
          Equivalence is a congruence: if $A \equiv B$, replacing an occurrence
          of $A$ inside a bigger statement by $B$ changes nothing. A connective
          sees only the values of its parts, and those values did not move.
      - ask: >
          You know $A \equiv B$, and $A$ appears deep inside a long statement
          $S$. You replace that occurrence by $B$. What can you say about the
          result?
        choices:
          - text: >
              It agrees with $S$ in every row
            correct: true
            feedback: >
              The swapped part has the same value in each row, and everything
              built on top of it reads only that value, so the whole column is
              unchanged.
          - text: >
              It agrees with $S$ only if $A$ appears just once
            feedback: >
              Repetitions are no obstacle — each occurrence may be swapped, one
              at a time, by the same argument.
          - text: >
              It agrees with $S$ only in the rows where $A$ is true
            feedback: >
              $A$ and $B$ match in the false rows too, so the surrounding
              statement is undisturbed there as well.
        feedback: >
          Equivalent parts are interchangeable anywhere. That substitution
          property is what makes step-by-step rewriting legitimate.
      - ask: >
          Is $p \lor (q \land \neg q) \equiv p$?
        choices:
          - text: >
              Yes, since the second disjunct is false in every row
            correct: true
            feedback: >
              $q \land \neg q$ is a contradiction, and a false disjunct
              contributes nothing: the disjunction takes the value of $p$ in
              all four rows.
          - text: >
              No, since the left side mentions $q$ and the right side does not
            feedback: >
              Equivalence compares columns, not letters. A letter can appear
              and still have no effect on the values.
          - text: >
              Only in the rows where $q$ is false
            feedback: >
              Where $q$ is true, $\neg q$ is false, so the conjunct is false
              there too — the rows all behave the same way.
        feedback: >
          Yes. Adding a contradiction to a disjunction changes no row, so the
          whole thing collapses to $p$.
      - teach: >
          A stock of known equivalences plus this substitution rule is a
          calculus: you simplify a statement one justified step at a time,
          instead of rebuilding a table that doubles with every letter.

  - node: foundations.logic.double-negation
    hook: >
      This tiny law is the last line of every proof by contradiction: having
      refuted the denial, you want to claim the thing itself. That step is not
      free, and this is what pays for it.
    explanation: >
      $\neg(\neg p) \equiv p$, and the check takes two rows. If $p$ is
      $\mathrm{T}$, then $\neg p$ is $\mathrm{F}$, so $\neg(\neg p)$ is
      $\mathrm{T}$ — matching $p$. If $p$ is $\mathrm{F}$, then $\neg p$ is
      $\mathrm{T}$, so $\neg(\neg p)$ is $\mathrm{F}$ — matching again. Both
      rows agree, so the equivalence holds, and since equivalent statements may
      be swapped anywhere, you may cancel negations in pairs wherever they occur
      inside a longer statement.

      Pairs is the operative word. Three negations do not vanish: cancelling the
      inner two leaves one, so $\neg\neg\neg p \equiv \neg p$. Count the
      negations and cancel them two at a time; an even count leaves $p$, an odd
      count leaves $\neg p$.

      The law is what licenses the final move of an indirect argument. You
      assume $\neg p$, derive something impossible, and conclude that $\neg p$
      is false — that is, $\neg(\neg p)$ is true. What you wanted was $p$, and
      this law is the bridge. It looks like no step at all, which is precisely
      why it is worth naming.

      It is also the one law here that a whole school of mathematics declines.
      Constructive logic refuses to read "the denial fails" as "the thing
      holds", because it demands a construction rather than the absence of an
      obstruction, and it drops the law of excluded middle $p \lor \neg p$ along
      with it — the two are equivalent. In classical two-valued logic, where
      every proposition has one of exactly two values, both stand.
    worked: >
      Simplify $\neg\neg\neg p$. Cancel the inner pair and you are left with
      $\neg p$. Check both rows. With $p$ true: $\neg p$ is $\mathrm{F}$,
      $\neg\neg p$ is $\mathrm{T}$, $\neg\neg\neg p$ is $\mathrm{F}$ — which is
      $\neg p$. With $p$ false: $\neg p$ is $\mathrm{T}$, $\neg\neg p$ is
      $\mathrm{F}$, $\neg\neg\neg p$ is $\mathrm{T}$ — again $\neg p$. Both rows
      match, so $\neg\neg\neg p \equiv \neg p$, and the answer is $\neg p$, not
      $p$.
    pitfalls: >
      Cancelling an odd number of negations down to $p$ is the arithmetic slip
      to watch for; count first, then cancel in pairs. English double negatives
      are not this law — "he is not unhappy" is weaker than "he is happy", since
      ordinary language leaves room between the two, while $\mathrm{T}$ and
      $\mathrm{F}$ leave none.
    recap: >
      Denying a denial returns the original statement, so negations cancel in
      pairs — and that cancellation is exactly the last step of an argument by
      contradiction.
    steps:
      - teach: >
          $\neg(\neg p) \equiv p$, and two rows settle it. $p$ true makes
          $\neg p$ false and $\neg\neg p$ true; $p$ false makes $\neg p$ true
          and $\neg\neg p$ false. The columns match.
      - teach: >
          Because equivalent statements may be substituted anywhere, this lets
          you cancel a pair of negations wherever it sits inside a longer
          statement.
      - ask: >
          What is $\neg\neg\neg\neg p$ equivalent to?
        choices:
          - text: >
              $p$
            correct: true
            feedback: >
              Four negations cancel as two pairs, and an even count returns the
              original.
          - text: >
              $\neg p$
            feedback: >
              That is the answer for an odd count. Four is even, so nothing is
              left over.
          - text: >
              Neither, since negations cannot be cancelled inside a stack
            feedback: >
              They can: each pair is an equivalence, and equivalences may be
              applied to any part of a statement.
        feedback: >
          Cancel in pairs and count the parity. Even leaves $p$, odd leaves
          $\neg p$ — so $\neg\neg\neg p$ is $\neg p$, not $p$.
      - teach: >
          Here is where it earns its place. An indirect argument assumes
          $\neg p$ and derives something impossible, which shows $\neg p$ is
          false — and "false" for $\neg p$ means $\neg(\neg p)$ is true.
      - ask: >
          You assumed $\neg p$ and reached an impossibility, so $\neg p$ is
          false. What have you established?
        choices:
          - text: >
              $\neg\neg p$, which is a weaker statement than $p$
            feedback: >
              It is not weaker — the two have identical columns, which is the
              content of the law.
          - text: >
              $p$, by cancelling the two negations
            correct: true
            feedback: >
              $\neg p$ being false says $\neg\neg p$ is true, and
              $\neg\neg p \equiv p$ carries you the last step to $p$ itself.
          - text: >
              Nothing about $p$; the argument only rules out $\neg p$
            feedback: >
              Ruling out $\neg p$ is ruling in $p$, because bivalence leaves no
              third option for a proposition to occupy.
        feedback: >
          $p$. The step is so short it is easy to miss, and this law is the
          thing being used when you take it.
      - teach: >
          Be careful transferring the law to English. "He is not unhappy" is
          softer than "he is happy", because ordinary words admit a middle
          ground; propositions do not, and that is why the cancellation is exact
          here.
      - teach: >
          One school of mathematics declines this law. Constructive logic wants
          an object built, not merely an obstruction removed, so it rejects
          double negation elimination together with $p \lor \neg p$, to which it
          is equivalent. Classical two-valued logic keeps both.

  - node: foundations.logic.de-morgan
    hook: >
      Every time you set out to disprove something, you have to write down what
      you are actually proving instead, and that means driving a negation into a
      compound statement. These two laws are the whole procedure.
    explanation: >
      Ask when a conjunction fails. $p \land q$ demands both, so it fails as
      soon as at least one part fails — which is exactly the claim
      $\neg p \lor \neg q$. Now ask when a disjunction fails. $p \lor q$ asks
      for at least one, so it fails only when both parts fail — the claim
      $\neg p \land \neg q$. Those two sentences are De Morgan's laws:
      $\neg(p \land q) \equiv \neg p \lor \neg q$ and
      $\neg(p \lor q) \equiv \neg p \land \neg q$.

      Four rows confirm the first. With $p$ and $q$ both true, $p \land q$ is
      $\mathrm{T}$, so the left side is $\mathrm{F}$; and $\neg p \lor \neg q$
      is $\mathrm{F} \lor \mathrm{F} = \mathrm{F}$. With $p$ true and $q$ false,
      $p \land q$ is $\mathrm{F}$, so the left side is $\mathrm{T}$; and the
      right is $\mathrm{F} \lor \mathrm{T} = \mathrm{T}$. The row with $p$ false
      and $q$ true is the mirror image, and with both false the left side is
      $\mathrm{T}$ while the right is $\mathrm{T} \lor \mathrm{T}$. Columns
      identical, law proved.

      In words: to deny an "and", deny at least one part; to deny an "or", deny
      every part. Both laws extend to any finite number of terms — negating
      $p_1 \land \cdots \land p_n$ gives the disjunction of the negations, which
      follows by applying the two-term law repeatedly.

      Operationally, this is a machine for pushing a negation inward. Each
      application strips one negation from the outside, swaps $\land$ with
      $\lor$, and hands the negations down to the parts. Repeat until every
      negation sits on a letter, and the statement finally says what it demands
      rather than what it denies.
    worked: >
      Push the negation all the way into $\neg((p \lor q) \land r)$. The
      outermost connective inside the negation is $\land$, so the first law
      gives $\neg(p \lor q) \lor \neg r$. Now the inner negation sits on a
      disjunction, and the second law turns $\neg(p \lor q)$ into
      $\neg p \land \neg q$. The result is
      $(\neg p \land \neg q) \lor \neg r$ — every negation on a letter, and the
      statement now reads: either both $p$ and $q$ fail, or $r$ does.
    pitfalls: >
      Negating both parts while keeping the connective is the classic error:
      $\neg(p \land q)$ is not $\neg p \land \neg q$, which is a much stronger
      claim and false in the row where $p$ is true and $q$ is false. In English
      this is the difference between "they are not both here" and "neither of
      them is here".
    recap: >
      Negation turns "and" into "or" and "or" into "and", pushing itself down
      onto the parts — apply it repeatedly and every negation ends up on a
      letter.
    steps:
      - teach: >
          Ask when $p \land q$ fails. It demands both parts, so one failure is
          enough to sink it — and "at least one of them fails" is
          $\neg p \lor \neg q$.
      - teach: >
          Ask when $p \lor q$ fails. It only asks for one part, so it takes both
          failing — which is $\neg p \land \neg q$. Those two sentences are De
          Morgan's laws.
      - ask: >
          In how many of the four rows is $\neg(p \lor q)$ true?
        expects: "1"
        hint: >
          A disjunction is false in only one row.
        feedback: >
          One — the row where $p$ and $q$ are both false. That is the single row
          in which $\neg p \land \neg q$ is true as well, which is the second
          law in miniature.
      - ask: >
          What is the negation of "the door is locked and the window is closed"?
        choices:
          - text: >
              The door is unlocked and the window is open
            feedback: >
              That negates both parts but keeps the "and", which is far
              stronger — one open window already refutes the original.
          - text: >
              The door is unlocked or the window is open
            correct: true
            feedback: >
              The original demands both, so denying it needs only one failure,
              and "or" is inclusive so both failing is allowed too.
          - text: >
              The door is locked or the window is closed
            feedback: >
              Nothing has been negated here; this sentence is true whenever the
              original is, so it cannot be its denial.
        feedback: >
          Deny an "and" by denying at least one part. The connective flips to
          "or" as the negation moves inward.
      - teach: >
          The laws extend to any finite number of terms: negating
          $p_1 \land \cdots \land p_n$ gives $\neg p_1 \lor \cdots \lor \neg
          p_n$, obtained by applying the two-term law over and over.
      - teach: >
          Read as a procedure, each application strips one negation from the
          outside, swaps the connective, and pushes the negations onto the
          parts. Repeat and every negation ends up on a single letter.
      - ask: >
          Pushing the negation inward, $\neg(p \lor \neg q)$ is equivalent to
          what?
        choices:
          - text: >
              $\neg p \land q$
            correct: true
            feedback: >
              The second law gives $\neg p \land \neg\neg q$, and the double
              negation on $q$ cancels, leaving $\neg p \land q$.
          - text: >
              $\neg p \lor q$
            feedback: >
              The connective must flip when the negation passes a disjunction;
              keeping "or" leaves a statement true in rows where the original is
              false.
          - text: >
              $\neg p \land \neg q$
            feedback: >
              The second part was already negated, so negating it again returns
              $q$ — cancel the pair rather than stacking a third.
        feedback: >
          $\neg p \land q$: flip the connective, negate both parts, then cancel
          the double negation that lands on $q$.
      - teach: >
          This is the first move of any disproof. Write the statement, negate
          it, push the negation down to the letters, and what you are left
          holding is the concrete thing you now have to establish.

  - node: foundations.logic.distributive-laws
    hook: >
      These are the rules that let you rearrange a statement without a truth
      table — and one of them behaves in a way arithmetic never prepared you
      for, which is where the reflexes learned in algebra start to mislead.
    explanation: >
      Both $\land$ and $\lor$ are commutative, $p \land q \equiv q \land p$ and
      $p \lor q \equiv q \lor p$, and both are associative,
      $(p \land q) \land r \equiv p \land (q \land r)$ and likewise for $\lor$.
      The practical payoff is that a chain of a single one of these connectives
      needs no parentheses: "$p$ and $q$ and $r$" means one thing, namely that
      all three hold, however you group it.

      Each distributes over the other. The first,
      $p \land (q \lor r) \equiv (p \land q) \lor (p \land r)$, is the one that
      looks like the arithmetic you know. The second,
      $p \lor (q \land r) \equiv (p \lor q) \land (p \lor r)$, has no arithmetic
      analogue at all — addition does not distribute over multiplication, and
      $2 + (3 \times 4)$ is nothing like $(2+3) \times (2+4)$. So the second law
      cannot be taken on faith from algebra; it needs its own check, which is
      quick if you split on $p$. When $p$ is true, the left side is true, and
      each of $p \lor q$ and $p \lor r$ is true, so the right side is true too.
      When $p$ is false, the left side reduces to $q \land r$, and the right
      side reduces to $q \land r$ as well. Both cases match, so all eight rows
      match.

      Two more laws are worth keeping to hand. Idempotence says repetition
      changes nothing: $p \land p \equiv p$ and $p \lor p \equiv p$. Absorption
      says a part swallows a compound containing it:
      $p \lor (p \land q) \equiv p$ and $p \land (p \lor q) \equiv p$. Check the
      first: if $p$ is true, both sides are true; if $p$ is false, then
      $p \land q$ is false and the disjunction is false, matching $p$.
    worked: >
      Simplify $(p \land q) \lor (p \land \neg q)$. Distribution, read right to
      left, pulls out the common $p$ and leaves $p \land (q \lor \neg q)$. The
      inner disjunction is a tautology, true in every row, so the conjunction
      takes the value of $p$ alone. The statement is equivalent to $p$ — which
      you can read off directly as well: it says $p$ holds and $q$ either does
      or does not, and the second half was never a restriction.
    pitfalls: >
      Importing arithmetic habits is the trap: $p \lor (q \land r)$ really does
      equal $(p \lor q) \land (p \lor r)$, even though the arithmetic analogue
      is false, and conversely you cannot borrow other algebra rules by
      analogy. Distributing over only one of the two terms —
      writing $p \land (q \lor r) \equiv (p \land q) \lor r$ — is the mechanical
      slip; the outside term must be copied onto both.
    recap: >
      "And" and "or" reorder and regroup freely and each distributes over the
      other, with idempotence and absorption cleaning up repeated letters.
    steps:
      - teach: >
          $\land$ and $\lor$ are each commutative and associative, so a chain
          built from one of them alone needs no parentheses: "$p$ and $q$ and
          $r$" means all three hold, however you group it.
      - teach: >
          Each distributes over the other. The familiar direction is
          $p \land (q \lor r) \equiv (p \land q) \lor (p \land r)$, which looks
          exactly like multiplying out a bracket.
      - ask: >
          Which statement is $p \land (q \lor r)$ equivalent to?
        choices:
          - text: >
              $(p \land q) \lor r$
            feedback: >
              The outside term must be copied onto both alternatives. As
              written, this is true when $r$ alone holds, where the original is
              false.
          - text: >
              $(p \land q) \lor (p \land r)$
            correct: true
            feedback: >
              $p$ distributes onto each alternative, and the inner connective
              stays $\lor$ between the two products.
          - text: >
              $(p \lor q) \land (p \lor r)$
            feedback: >
              That is the other distribution, with the roles of the connectives
              swapped — a true law, but of a different statement.
        feedback: >
          Copy the outside term onto every term inside, keeping the inner
          connective between the copies.
      - teach: >
          The other direction, $p \lor (q \land r) \equiv (p \lor q) \land (p
          \lor r)$, has no arithmetic analogue — addition does not distribute
          over multiplication — so it has to be checked rather than assumed.
      - teach: >
          Splitting on $p$ does it in two lines. If $p$ is true, both sides are
          true. If $p$ is false, the left side is $q \land r$ and the right side
          is $q \land r$ as well. Eight rows, two cases, done.
      - ask: >
          Is $2 + (3 \times 4)$ equal to $(2+3) \times (2+4)$?
        choices:
          - text: >
              Yes, by the same distribution that holds for $\lor$ over $\land$
            feedback: >
              The logical law is genuine, but arithmetic does not copy it —
              which is exactly why the logical version needs its own truth-table
              check.
          - text: >
              No, since $14$ and $30$ are different
            correct: true
            feedback: >
              $2 + 12 = 14$ while $5 \times 6 = 30$. The analogy fails in
              arithmetic and holds in logic, so borrow nothing from habit here.
          - text: >
              No, because addition is not associative
            feedback: >
              Addition is perfectly associative; what fails is distributing it
              over multiplication.
        feedback: >
          $14 \ne 30$. The second logical distribution is true, and the
          arithmetic it resembles is false — keep the two apart.
      - teach: >
          Two cleanup laws finish the toolkit. Idempotence:
          $p \land p \equiv p$ and $p \lor p \equiv p$. Absorption:
          $p \lor (p \land q) \equiv p$ and $p \land (p \lor q) \equiv p$.
      - ask: >
          In how many of the four rows is $p \lor (p \land q)$ true?
        expects: "2"
        hint: >
          Absorption says it agrees with a single letter.
        feedback: >
          Two — exactly the rows where $p$ is true. If $p$ is false the second
          disjunct is false too, so the whole statement collapses to $p$, which
          is true in $2$ of the $4$ rows.

  - node: foundations.logic.conditional-as-disjunction
    hook: >
      The negation of "if ... then ..." is not another "if ... then ...", and
      getting that wrong wrecks every proof by contradiction you attempt. This
      one equivalence fixes it permanently.
    explanation: >
      Compare $p \to q$ with $\neg p \lor q$ row by row. The conditional is
      false in exactly one row, $p$ true with $q$ false; there $\neg p$ is
      $\mathrm{F}$ and $q$ is $\mathrm{F}$, so the disjunction is false too. In
      the other three rows the conditional is true, and so is the disjunction:
      whenever $p$ is false, $\neg p$ carries it, and whenever $q$ is true, $q$
      does. Identical columns, so $p \to q \equiv \neg p \lor q$.

      That is already interesting — the conditional is not a primitive notion,
      since negation and disjunction express it. The consequence you will use
      daily comes from negating both sides. By De Morgan,
      $\neg(\neg p \lor q) \equiv \neg\neg p \land \neg q$, and the double
      negation cancels, so $\neg(p \to q) \equiv p \land \neg q$.

      Read that carefully, because it is the payoff. The denial of "if $p$ then
      $q$" is not a conditional at all. It is the flat, unconditional assertion
      that the hypothesis holds *and* the conclusion fails. That is exactly one
      row of the table, which is why it involves no "if": there is only one way
      for a conditional to fail, so denying it names that single situation.

      This is also why a proof by contradiction of "if $p$ then $q$" opens the
      way it does. You assume $p$ and assume $\neg q$ — you assume both,
      unconditionally — and derive an impossibility. What you assumed was the
      negation of the theorem, written out in full.
    worked: >
      Negate "if the sequence converges then it is bounded". Take $p$ to be
      "the sequence converges" and $q$ to be "the sequence is bounded". The
      negation is $p \land \neg q$: "the sequence converges and it is not
      bounded". Note what disappeared — no "if" survives, and the negation now
      asserts convergence outright, which the original never did. To refute the
      theorem you would have to exhibit one convergent unbounded sequence.
    pitfalls: >
      Negating both parts and keeping the arrow — writing $\neg p \to \neg q$ —
      is the common wrong answer, and it is not even close: that statement is
      true whenever $p$ is true, including in rows where the original
      conditional is true. Negating only the conclusion, giving $p \to \neg q$,
      is the other near miss; it is a conditional again, and it is true whenever
      $p$ is false.
    recap: >
      $p \to q$ says no more than "either $p$ fails or $q$ holds", so its
      negation is the flat assertion $p \land \neg q$.
    steps:
      - teach: >
          Compare $p \to q$ with $\neg p \lor q$. Both are false only when $p$
          is true and $q$ is false; in every other row, either $\neg p$ or $q$
          carries the disjunction, and the conditional is true as well.
      - teach: >
          So $p \to q \equiv \neg p \lor q$: the conditional is not a primitive
          idea, and it can be written with negation and disjunction alone.
      - ask: >
          In how many of the four rows is $\neg(p \to q)$ true?
        expects: "1"
        hint: >
          Count the rows where the conditional itself is false.
        feedback: >
          One — the row with $p$ true and $q$ false. A conditional has exactly
          one way to fail, so its negation is true in exactly one row.
      - teach: >
          Negate both sides of the equivalence. De Morgan turns
          $\neg(\neg p \lor q)$ into $\neg\neg p \land \neg q$, and the double
          negation cancels, giving $\neg(p \to q) \equiv p \land \neg q$.
      - ask: >
          What is the negation of "if $n$ is prime then $n$ is odd"?
        choices:
          - text: >
              If $n$ is prime then $n$ is even
            feedback: >
              This negates only the conclusion and keeps the arrow, so it is
              still a conditional — and it is true whenever $n$ is not prime,
              which proves nothing about the original.
          - text: >
              $n$ is prime and $n$ is not odd
            correct: true
            feedback: >
              The one way for the conditional to fail is a true hypothesis with
              a false conclusion, so its denial asserts both — and $n = 2$
              witnesses it.
          - text: >
              If $n$ is not prime then $n$ is not odd
            feedback: >
              Negating both halves and keeping the arrow gives a different
              statement entirely; it says nothing about the primes, where the
              original lives.
        feedback: >
          $n$ is prime and $n$ is not odd. Denying a conditional produces a
          conjunction, never another conditional.
      - teach: >
          Notice what the negation does that the original never did: it asserts
          the hypothesis outright. "If $p$ then $q$" claims nothing about $p$;
          its denial claims $p$ flatly.
      - ask: >
          A proof by contradiction of "if $p$ then $q$" begins by assuming what?
        choices:
          - text: >
              $\neg p$ and $\neg q$
            feedback: >
              Assuming the hypothesis fails abandons the case the theorem is
              about; the negation asserts $p$, it does not deny it.
          - text: >
              $p$ and $\neg q$
            correct: true
            feedback: >
              That is $p \land \neg q$, the negation of the theorem written out
              — assume it, derive an impossibility, and the theorem stands.
          - text: >
              $\neg(p \land q)$
            feedback: >
              That is the denial of a conjunction, a much weaker statement, and
              it is not what the theorem asserted in the first place.
        feedback: >
          You assume $p$ and $\neg q$, both unconditionally. Writing the
          negation out first is what keeps that opening line honest.

  - node: foundations.logic.contrapositive
    hook: >
      A theorem and its converse are different claims, and reading one as the
      other is the most expensive mistake in this unit. The contrapositive, by
      contrast, is free — and is often the easier direction to prove.
    explanation: >
      From a conditional $p \to q$ you can build three relatives. The converse
      swaps the halves: $q \to p$. The inverse negates both: $\neg p \to \neg
      q$. The contrapositive does both, swapping and negating: $\neg q \to \neg
      p$.

      The contrapositive is equivalent to the original, and the chain of
      rewritings shows why. Start from $\neg q \to \neg p$ and use "a
      conditional is a disjunction": it becomes $\neg\neg q \lor \neg p$. Cancel
      the double negation to get $q \lor \neg p$, reorder the disjunction to
      $\neg p \lor q$, and read it back as a conditional: $p \to q$. Every step
      was an equivalence, so $p \to q \equiv \neg q \to \neg p$.

      The converse is a different story. It is equivalent to the inverse — being
      the inverse's contrapositive — but not to the original. One example
      settles it: over the real numbers, "if $x = 2$ then $x^2 = 4$" is true,
      while its converse "if $x^2 = 4$ then $x = 2$" is false at $x = -2$. In
      truth-table terms, $p \to q$ and $q \to p$ differ in two of the four rows,
      the two where $p$ and $q$ disagree.

      Two habits follow. First, proving $\neg q \to \neg p$ is a perfectly good
      way to prove $p \to q$, and it is often easier — "if $n^2$ is even then
      $n$ is even" is awkward head-on and immediate from the contrapositive,
      where an odd $n$ visibly gives an odd $n^2$. Second, a theorem never comes
      with its converse attached. If you want the converse, you prove it
      separately.
    worked: >
      Take "if $n$ is divisible by $6$ then $n$ is even", which is true. Its
      contrapositive is "if $n$ is not even then $n$ is not divisible by $6$" —
      true, as it must be, and saying the same thing. Its converse is "if $n$ is
      even then $n$ is divisible by $6$", which is false: $n = 4$ is even and
      not divisible by $6$. Its inverse is "if $n$ is not divisible by $6$ then
      $n$ is not even", also false, and $n = 4$ refutes it too — the same
      counterexample, because converse and inverse are equivalent to each other.
    pitfalls: >
      Reading a theorem as though it also asserted its converse is the error
      that produces most false "corollaries"; the converse is a separate claim
      needing a separate proof. Confusing inverse with contrapositive is the
      mechanical version: negating both halves without swapping them gives the
      converse's twin, not the original's.
    recap: >
      Swapping and negating a conditional preserves it, merely swapping does
      not — the contrapositive is the original in disguise, the converse is a
      new claim.
    steps:
      - teach: >
          From $p \to q$ come three relatives: the converse $q \to p$, the
          inverse $\neg p \to \neg q$, and the contrapositive $\neg q \to \neg
          p$, which swaps and negates.
      - teach: >
          The contrapositive is equivalent to the original. Rewrite
          $\neg q \to \neg p$ as $\neg\neg q \lor \neg p$, cancel the double
          negation to get $q \lor \neg p$, and reorder: that is $\neg p \lor q$,
          which is $p \to q$.
      - ask: >
          What is the contrapositive of "if it is raining then the ground is
          wet"?
        choices:
          - text: >
              If the ground is wet then it is raining
            feedback: >
              That is the converse — a separate claim, and a false one, since a
              sprinkler wets the ground too.
          - text: >
              If the ground is not wet then it is not raining
            correct: true
            feedback: >
              Swapped and negated. It says the same thing as the original: rain
              without wet ground is what both rule out.
          - text: >
              If it is not raining then the ground is not wet
            feedback: >
              That is the inverse — negated but not swapped — and it is as false
              as the converse, being the converse's contrapositive.
        feedback: >
          Swap and negate. Negating without swapping gives the inverse, which is
          a different claim altogether.
      - teach: >
          The converse is equivalent to the inverse, since each is the other's
          contrapositive. Neither is equivalent to the original conditional.
      - ask: >
          In how many of the four rows do $p \to q$ and $q \to p$ take different
          values?
        expects: "2"
        hint: >
          They can only differ where $p$ and $q$ themselves differ.
        feedback: >
          Two. Where $p$ and $q$ agree, both conditionals are true. Where $p$ is
          true and $q$ false, the first is false and the second true; where $p$
          is false and $q$ true, the reverse — two rows of disagreement.
      - teach: >
          A concrete separation is worth memorising. Over the real numbers, "if
          $x = 2$ then $x^2 = 4$" is true, and its converse fails at $x = -2$.
      - ask: >
          You have proved "if $n^2$ is odd then $n$ is odd" by showing that an
          even $n$ gives an even $n^2$. What did you actually prove?
        choices:
          - text: >
              The contrapositive, which is equivalent, so the theorem is proved
            correct: true
            feedback: >
              "If $n$ is not odd then $n^2$ is not odd" is the contrapositive of
              the claim, and equivalence makes the proof complete.
          - text: >
              The converse, so the theorem still needs its own argument
            feedback: >
              The converse would start from $n$ odd and conclude about $n^2$.
              You started from $n$ even, which is a negated conclusion, not a
              swapped one.
          - text: >
              A weaker statement, since the contrapositive assumes more
            feedback: >
              It assumes nothing extra — the two have identical truth tables, so
              neither is weaker than the other.
        feedback: >
          The contrapositive, and that is a finished proof. Choosing the
          direction that is easier to argue is a standard move, not a compromise.

  - node: foundations.logic.def-validity
    hook: >
      This is the standard every proof is held to: not that the conclusion is
      true, but that it could not have failed given the premises. Separating
      that from "the conclusion is true" is what lets you check an argument
      without knowing any facts.
    explanation: >
      An argument is a list of premises $p_1, \dots, p_n$ together with a
      conclusion $q$. Its form is valid when no truth assignment makes all the
      premises true and the conclusion false. Equivalently — and this is the
      version you can compute — the single statement
      $(p_1 \land \cdots \land p_n) \to q$ is a tautology, since a conditional
      fails only in the forbidden combination, and "no row where the premises
      hold and the conclusion fails" is exactly "no row where that conditional
      is false".

      Validity is about form, and it says nothing about facts. An argument from
      false premises can be valid and reach a false conclusion: "all birds are
      green; a robin is a bird; therefore a robin is green" is valid and its
      conclusion is wrong, because a premise was. In the other direction, an
      invalid argument can land on a true conclusion by luck, and the luck does
      not repair it. Validity is a guarantee about the transmission of truth,
      not a supply of it.

      The word for having both is sound: an argument is sound when it is valid
      *and* its premises are actually true, and only soundness establishes
      anything. The division of labour matters, because the two halves are
      checked by completely different means. Validity is decided mechanically,
      by a truth table on the argument's form. Whether the premises are true is
      a question about the world or about the mathematics, and no table will
      answer it.

      In practice you check validity by looking only at the rows where every
      premise is true, and asking whether the conclusion is true in all of them.
      Rows with a false premise are irrelevant — the argument makes no promise
      there.
    worked: >
      Test the argument: from $p \lor q$ and $\neg p$, conclude $q$. Find the
      rows where both premises hold. The second premise, $\neg p$, is true only
      in the two rows where $p$ is false. Of those, the first premise $p \lor q$
      needs $q$ true, since $p$ is not available to carry the disjunction — so
      exactly one row survives, $p$ false with $q$ true. In that row the
      conclusion $q$ is true. There is no row with all premises true and a false
      conclusion, so the form is valid.
    pitfalls: >
      Judging an argument by whether you agree with its conclusion is the trap;
      a true conclusion is compatible with a hopeless argument, and a valid
      argument can carry you to a falsehood from a false premise. Checking rows
      where some premise is false wastes effort and invites confusion — the
      argument claims nothing about those rows.
    recap: >
      An argument form is valid when no assignment makes every premise true and
      the conclusion false, and sound when it is valid with premises that are
      in fact true.
    steps:
      - teach: >
          An argument is premises plus a conclusion. Its form is valid when no
          truth assignment makes all the premises true while the conclusion is
          false — that is the only combination validity forbids.
      - teach: >
          Equivalently, $(p_1 \land \cdots \land p_n) \to q$ is a tautology. A
          conditional fails only when its hypothesis holds and its conclusion
          does not, which is precisely the situation validity rules out.
      - teach: >
          So checking validity means looking only at the rows where every
          premise is true, and asking whether the conclusion holds in all of
          them. Rows with a false premise are none of the argument's business.
      - ask: >
          Consider the premises $p \lor q$ and $\neg p$. In how many of the four
          rows are both premises true?
        expects: "1"
        hint: >
          The second premise decides the value of $p$ immediately.
        feedback: >
          One. $\neg p$ leaves only the two rows with $p$ false, and of those
          only $q$ true keeps $p \lor q$ alive — the row $p$ false, $q$ true.
      - ask: >
          In that single row, the conclusion $q$ is true. What follows about
          the argument "from $p \lor q$ and $\neg p$, conclude $q$"?
        choices:
          - text: >
              It is valid
            correct: true
            feedback: >
              No row has all premises true with a false conclusion, since the
              only row with true premises has $q$ true. That is the definition
              met.
          - text: >
              It is sound
            feedback: >
              Soundness needs the premises to be true in fact, and $p$ and $q$
              are unspecified letters — there is nothing here to be true about.
          - text: >
              Nothing, until we know whether $p$ and $q$ are true
            feedback: >
              Validity is checked without knowing that; the table covers every
              possibility at once, which is what makes it a statement about
              form.
        feedback: >
          Valid. One row survives the premises, and the conclusion holds there,
          so truth cannot leak away.
      - teach: >
          Validity says nothing about the facts. "All birds are green; a robin
          is a bird; so a robin is green" is a valid form with a false
          conclusion — the fault is in a premise, not in the reasoning.
      - ask: >
          An argument is valid and its conclusion is false. What must be true?
        choices:
          - text: >
              The argument is invalid after all
            feedback: >
              Validity was checked on the form and does not depend on the facts;
              a false conclusion cannot revoke it.
          - text: >
              At least one premise is false
            correct: true
            feedback: >
              Valid means true premises force a true conclusion. The conclusion
              is false, so the premises cannot all have been true.
          - text: >
              The premises are all true and something else went wrong
            feedback: >
              That combination is exactly what validity forbids — all premises
              true with a false conclusion is the one case ruled out.
        feedback: >
          Some premise failed. Valid plus true premises is what has a name:
          sound, and only soundness establishes a conclusion.

  - node: foundations.logic.modus-ponens
    hook: >
      This is the rule that turns a proved theorem into a usable one. Every
      time you check a hypothesis and help yourself to a conclusion, this is
      the step you are taking, usually without noticing.
    explanation: >
      The rule reads: from $p \to q$ and $p$, infer $q$. Its validity is the
      claim that $(p \land (p \to q)) \to q$ is a tautology, and the check is
      short. Look only at the rows where both premises are true. The premise $p$
      forces $p$ true, so only two rows remain; and in the row where $q$ is
      false, the other premise $p \to q$ is false — that is the one combination
      a conditional forbids. So exactly one row has both premises true, the row
      with $p$ and $q$ both true, and there the conclusion $q$ holds. No row
      makes the premises true and the conclusion false, so the form is valid.

      The mental picture is a gate. A conditional is a one-way passage from its
      hypothesis to its conclusion; asserting the hypothesis is what opens it.
      Nothing else in the rule matters — not what $p$ and $q$ mean, not whether
      they are related, only that you hold the arrow and you hold its left-hand
      side.

      This is how mathematics is used. A theorem says "if the hypotheses hold
      then the conclusion holds". In front of a particular object you verify the
      hypotheses, and this rule hands you the conclusion for that object. It is
      also the step that chains results together: the conclusion you gain
      becomes the hypothesis of the next theorem, and a proof is largely a
      sequence of these.

      Note what the rule needs. You must have the conditional, and you must
      have its hypothesis — not something similar, and not the conclusion. The
      two near-misses that use the wrong piece are separate forms, and they are
      not valid.
    worked: >
      Take the theorem "if $n$ is divisible by $6$ then $n$ is even" and the
      number $18$. Check the hypothesis: $18 = 6 \cdot 3$, so it is divisible by
      $6$. The rule now applies with $p$ the statement "$18$ is divisible by
      $6$" and $q$ the statement "$18$ is even", and it delivers the conclusion:
      $18$ is even. Notice that no property of $18$ beyond the hypothesis was
      used — the same two lines work for $42$, or for any other multiple of $6$.
    pitfalls: >
      Applying the rule with a hypothesis that only resembles the theorem's is
      the everyday failure — the theorem's hypothesis must be checked as
      written, in full. Having the conditional and its conclusion, rather than
      its hypothesis, licenses nothing about the hypothesis, however tempting
      the reverse trip looks.
    recap: >
      From $p \to q$ and $p$ you may infer $q$, and that single move is how
      every theorem gets applied to a particular case.
    steps:
      - teach: >
          The rule: from $p \to q$ and $p$, infer $q$. You hold a conditional
          and you hold its hypothesis, so you may take its conclusion.
      - ask: >
          In how many of the four rows are both premises $p$ and $p \to q$
          true?
        expects: "1"
        hint: >
          The premise $p$ eliminates half the table immediately.
        feedback: >
          One. $p$ true leaves two rows, and of those the row with $q$ false
          makes $p \to q$ false — the forbidden combination. Only $p$ true with
          $q$ true survives.
      - teach: >
          In that surviving row the conclusion $q$ is true, so no assignment
          makes the premises true and the conclusion false. The form is valid,
          which is to say $(p \land (p \to q)) \to q$ is a tautology.
      - teach: >
          Picture a conditional as a one-way gate from hypothesis to
          conclusion. Asserting the hypothesis is what opens it — and nothing
          about the meanings of $p$ and $q$ enters the rule.
      - ask: >
          You know "if a number is divisible by $9$ then its digits sum to a
          multiple of $9$", and you know that $837$ is divisible by $9$. What
          may you conclude?
        choices:
          - text: >
              The digits of $837$ sum to a multiple of $9$
            correct: true
            feedback: >
              Hypothesis checked, conditional in hand, conclusion taken — and
              indeed $8 + 3 + 7 = 18$.
          - text: >
              Every number whose digits sum to a multiple of $9$ is divisible by
              $9$
            feedback: >
              That is a general claim in the reverse direction. The rule gives
              you the conclusion for the one number whose hypothesis you
              checked.
          - text: >
              Nothing, since the theorem is about all numbers and this is one
            feedback: >
              A statement about all numbers applies to each one; that is what
              makes theorems worth proving.
        feedback: >
          The conclusion, for that number. Check the hypothesis, then take what
          the conditional owes you.
      - teach: >
          This is the engine of proof. The conclusion you gain becomes the
          hypothesis of the next theorem, and a long argument is largely a chain
          of these steps.
      - ask: >
          You hold "if $p$ then $q$", and you have established $q$. What does
          the rule give you?
        choices:
          - text: >
              $p$
            feedback: >
              That runs the gate backwards. The conditional promises passage
              from $p$ to $q$ only, and this is a separate form that is not
              valid.
          - text: >
              Nothing — the rule needs the hypothesis, not the conclusion
            correct: true
            feedback: >
              With $p$ false and $q$ true, both of these premises are true while
              $p$ is false, so no rule could deliver $p$ here.
          - text: >
              $\neg p$
            feedback: >
              Nothing has been ruled out either: $p$ may well be true, since
              $p$ true with $q$ true is consistent with both premises.
        feedback: >
          The rule needs the left-hand side. Holding the conclusion tells you
          nothing about the hypothesis.

  - node: foundations.logic.modus-tollens
    hook: >
      This is how a claim gets knocked down by one of its own consequences:
      find something it forces, show that thing fails, and the claim falls with
      it. It is the backbone of indirect argument.
    explanation: >
      The rule reads: from $p \to q$ and $\neg q$, infer $\neg p$. Check it the
      same way. The premise $\neg q$ restricts you to the two rows where $q$ is
      false. In the row where $p$ is true, the other premise $p \to q$ is false,
      so that row is out. Only the row with $p$ false and $q$ false has both
      premises true, and there the conclusion $\neg p$ is true. Valid.

      There is a slicker way to see it. A conditional is equivalent to its
      contrapositive, so $p \to q$ may be rewritten as $\neg q \to \neg p$.
      Now the premises read "$\neg q \to \neg p$ and $\neg q$", and affirming
      the hypothesis of a conditional delivers its conclusion — $\neg p$. So
      this rule is not a new principle at all; it is the forward rule applied to
      the contrapositive.

      The informal version is a piece of ordinary reasoning. If the switch being
      on would light the lamp, and the lamp is dark, the switch is off. You
      never inspected the switch; you inspected a consequence and reasoned back.

      That is what makes it the engine of indirect argument. To reject a
      supposition, derive a consequence of it and show the consequence fails.
      The supposition cannot survive its own false consequence, and the more
      surprising the consequence you can derive, the easier it is to test.
    worked: >
      Take the theorem "if $n$ is divisible by $6$ then $n$ is even", and the
      number $15$. The conclusion fails: $15$ is odd, so "$15$ is even" is
      false. The rule applies with $p$ the statement "$15$ is divisible by $6$"
      and $q$ the statement "$15$ is even", and it delivers $\neg p$: $15$ is
      not divisible by $6$. That conclusion was reached without dividing
      anything by $6$ — only by testing a consequence.
    pitfalls: >
      Denying the hypothesis instead of the conclusion gives a different and
      invalid form; the rule needs $\neg q$, the failure of the *conclusion*.
      Concluding $\neg q$ from $p \to q$ and $\neg p$ is the same error wearing
      the other hat, and both come from treating a conditional as if it ran in
      both directions.
    recap: >
      From $p \to q$ and $\neg q$ you may infer $\neg p$ — the forward rule
      applied to the contrapositive, and the way a claim is refuted through its
      consequences.
    steps:
      - teach: >
          The rule: from $p \to q$ and $\neg q$, infer $\neg p$. A conditional
          plus the failure of its conclusion refutes its hypothesis.
      - ask: >
          In how many of the four rows are both premises $p \to q$ and $\neg q$
          true?
        expects: "1"
        hint: >
          The second premise fixes $q$; then the conditional rules out one of
          the remaining rows.
        feedback: >
          One. $\neg q$ leaves the two rows with $q$ false, and the row with $p$
          true makes $p \to q$ false. Only $p$ false with $q$ false survives —
          and there $\neg p$ is true, so the form is valid.
      - teach: >
          There is a shortcut. Since $p \to q \equiv \neg q \to \neg p$, the
          premises are really "$\neg q \to \neg p$ and $\neg q$", and affirming
          a hypothesis delivers the conclusion $\neg p$.
      - teach: >
          So this is not a second principle to memorise. It is the forward rule
          run on the contrapositive, which is why the two rules feel like one
          idea seen from two sides.
      - ask: >
          If the switch were on, the lamp would be lit. The lamp is dark. What
          follows?
        choices:
          - text: >
              The switch is off
            correct: true
            feedback: >
              The conclusion of the conditional fails, so its hypothesis cannot
              hold — reached without going near the switch.
          - text: >
              The lamp is broken
            feedback: >
              Nothing in the premises mentions the lamp's condition; you may
              only conclude what the two given statements force.
          - text: >
              Nothing, since the switch was never inspected
            feedback: >
              Inspecting a consequence is enough. That is exactly the economy
              this rule provides.
        feedback: >
          The switch is off. Test a consequence, and the failure travels
          backwards up the arrow.
      - teach: >
          This is the shape of indirect argument. To reject a supposition,
          derive something it forces and show that thing false; the supposition
          falls with its consequence.
      - ask: >
          From "if $p$ then $q$" and $\neg p$, what may you infer?
        choices:
          - text: >
              $\neg q$
            feedback: >
              That denies the hypothesis and reads off the conclusion, which is
              the wrong end of the arrow — $q$ may hold for entirely unrelated
              reasons.
          - text: >
              Nothing about $q$
            correct: true
            feedback: >
              With $p$ false, both $q$ true and $q$ false are consistent with
              the premises, so neither $q$ nor $\neg q$ follows.
          - text: >
              $q$
            feedback: >
              The conditional promises $q$ only when $p$ holds, and here $p$
              fails, so the promise is silent.
        feedback: >
          Nothing. The rule needs the *conclusion* denied; denying the
          hypothesis leaves the conclusion entirely open.

  - node: foundations.logic.ex-converse-fallacy
    hook: >
      The two invalid forms in this lesson look almost exactly like the two
      valid ones, and they are what a plausible-sounding wrong proof is usually
      made of. Learning to spot them is cheap insurance.
    explanation: >
      Two near-misses. *Affirming the consequent* infers $p$ from $p \to q$ and
      $q$ — the right conditional, the wrong piece of it. *Denying the
      antecedent* infers $\neg q$ from $p \to q$ and $\neg p$ — again the right
      conditional, the wrong piece.

      One assignment kills both: $p$ false, $q$ true. Check it. The conditional
      $p \to q$ is true, since its hypothesis fails. For the first argument the
      second premise is $q$, which is true, while the conclusion $p$ is false —
      true premises, false conclusion, so invalid. For the second argument the
      second premise is $\neg p$, which is true, while the conclusion $\neg q$
      is false. One row, two refutations.

      Structurally, each is a valid rule pointed at the wrong conditional.
      Affirming the consequent is the forward rule applied to the converse
      $q \to p$; denying the antecedent is the forward rule applied to the
      inverse $\neg p \to \neg q$. Since the converse and the inverse are
      equivalent to each other and not to the original, both fallacies amount to
      the same underlying mistake: treating a conditional as though it also
      asserted its converse.

      Concretely, take "if $n$ is divisible by $4$ then $n$ is even". From "$n$
      is even" you may not conclude divisibility by $4$; $n = 6$ is the
      counterexample. From "$n$ is not divisible by $4$" you may not conclude
      that $n$ is odd; $n = 6$ again. The same number refutes both, because both
      are the same error.
    worked: >
      Test "from $p \to q$ and $q$, infer $p$" by counting rows. The premise $q$
      leaves the two rows where $q$ is true, and $p \to q$ is true in both of
      them, since a true conclusion cannot break a conditional. So two rows have
      all premises true: $p$ true with $q$ true, and $p$ false with $q$ true. In
      the second of those the conclusion $p$ is false. One row with true
      premises and a false conclusion is all it takes — the form is invalid.
    pitfalls: >
      A true conclusion does not rescue an invalid argument: applying affirming
      the consequent to a case where $p$ happens to hold gives the right answer
      by luck, and the reasoning is still worthless. In everyday language the
      fallacy hides inside diagnosis — "this illness causes a fever; you have a
      fever; so you have this illness" — where the conclusion is merely one
      candidate among many.
    recap: >
      Affirming the consequent and denying the antecedent are the forward rule
      aimed at the converse and the inverse, and the single assignment $p$
      false, $q$ true refutes them both.
    steps:
      - teach: >
          Two invalid forms imitate the valid ones. Affirming the consequent
          infers $p$ from $p \to q$ and $q$. Denying the antecedent infers
          $\neg q$ from $p \to q$ and $\neg p$.
      - teach: >
          Both use the right conditional and the wrong piece of it. The valid
          rules take the hypothesis forward or the denied conclusion backward;
          these take the conclusion forward and the denied hypothesis backward.
      - ask: >
          For the argument "from $p \to q$ and $q$, infer $p$": in how many of
          the four rows are both premises true?
        expects: "2"
        hint: >
          A conditional with a true conclusion is true, whatever the hypothesis
          does.
        feedback: >
          Two — the rows with $q$ true, since $p \to q$ holds in both. In one of
          them $p$ is false, so the premises hold while the conclusion fails,
          and the form is invalid.
      - teach: >
          The single assignment $p$ false, $q$ true refutes both fallacies at
          once. It makes $p \to q$ true, makes $q$ true and $\neg p$ true, and
          falsifies both $p$ and $\neg q$.
      - ask: >
          From "if $n$ is divisible by $4$ then $n$ is even" and "$n$ is even",
          what follows?
        choices:
          - text: >
              $n$ is divisible by $4$
            feedback: >
              This is affirming the consequent: $n = 6$ is even and not
              divisible by $4$, so the inference fails outright.
          - text: >
              Nothing about divisibility by $4$
            correct: true
            feedback: >
              Being even is consistent with both, and $n = 6$ versus $n = 8$
              shows the conclusion could go either way.
          - text: >
              $n$ is not divisible by $4$
            feedback: >
              Just as unfounded in the other direction — $n = 8$ is even and
              divisible by $4$.
        feedback: >
          Nothing follows. The conditional runs from divisibility to evenness,
          and evenness does not run back.
      - teach: >
          Each fallacy is a valid rule aimed at the wrong conditional: at the
          converse $q \to p$, or at the inverse $\neg p \to \neg q$. Since those
          two are equivalent to each other, the two fallacies are one mistake.
      - ask: >
          Which mistake is "this illness causes a fever; you have a fever; so
          you have this illness"?
        choices:
          - text: >
              Denying the antecedent
            feedback: >
              Nothing here is denied — both premises are affirmations, so the
              error is on the other side.
          - text: >
              Affirming the consequent
            correct: true
            feedback: >
              The conditional runs illness $\to$ fever, and the argument runs it
              backwards from the fever. Many other illnesses share the symptom.
          - text: >
              No mistake, since the premises are true
            feedback: >
              True premises with an invalid form still prove nothing; validity
              is about whether the conclusion could fail while the premises
              hold, and here it plainly could.
        feedback: >
          Affirming the consequent. Whenever an argument runs an arrow
          backwards, check whether the converse was ever established.

  - node: foundations.logic.def-predicate
    hook: >
      Almost nothing in mathematics is a bare proposition; statements are about
      objects, and they change truth value as the object changes. This is the
      step from sentences about one fixed thing to sentences with a slot.
    explanation: >
      "$x > 3$" is not a proposition — with $x$ unassigned there is nothing to
      evaluate. But it is not nonsense either: it is a proposition-with-a-slot,
      and filling the slot produces a genuine statement. That is a predicate,
      written $P(x)$: a declarative sentence containing a variable, which
      becomes a proposition once the variable is given a value.

      The values come from a stated domain of discourse $D$, and the domain is
      part of the predicate rather than decoration around it. With $D$ the
      integers and $P(x)$ the sentence "$x > 3$", $P(4)$ is true and $P(2)$ is
      false. Change the domain and you can change everything: "$x \cdot x = 2$"
      has a value in $D$ satisfying it when $D$ is the real numbers, and none at
      all when $D$ is the rational numbers. Same sentence, different question.
      So a predicate quoted without its domain is incompletely specified.

      Predicates can have several slots. $Q(x, y)$ might be "$x < y$", and it
      becomes a proposition only when both variables are assigned: $Q(2, 5)$ is
      true, $Q(5, 2)$ is false, and $Q(2, y)$ is still a predicate — one slot
      down, one to go. In general $P(x_1, \dots, x_n)$ needs all $n$ values
      before it has a truth value.

      Substituting a value is one way to turn a predicate into a proposition.
      The other way, which is where the subject goes next, is to say something
      about how many elements of the domain satisfy it — every one, or at least
      one — without naming any of them.
    worked: >
      Let the domain be the integers and let $P(x)$ be "$x^2 < 10$". Then $P(3)$
      says $9 < 10$, which is true. $P(4)$ says $16 < 10$, which is false.
      $P(-3)$ says $9 < 10$ again, true; $P(0)$ is true. So across the small
      domain $\{-3, -2, -1, 0, 1, 2, 3\}$ every element satisfies $P$, and
      outside it none does — seven true instances in all. The bare sentence
      "$x^2 < 10$" has no truth value; each of these substitutions does.
    pitfalls: >
      Quoting a predicate without its domain leaves the truth of any claim about
      it undetermined — "$x \cdot x = 2$ has a solution" is true over the reals
      and false over the rationals. Treating a partially filled predicate as a
      proposition is the other slip: $Q(2, y)$ has a slot left, so it is still
      waiting.
    recap: >
      A predicate is a sentence with slots plus a domain the slots draw from,
      and it becomes a proposition only when every slot is filled.
    steps:
      - teach: >
          "$x > 3$" has no truth value while $x$ is unassigned, but it is not
          meaningless. It is a sentence with a slot, and filling the slot
          produces a proposition. That is a predicate, written $P(x)$.
      - teach: >
          The values come from a stated domain of discourse $D$. With $D$ the
          integers and $P(x)$ the sentence "$x > 3$", $P(4)$ is true and $P(2)$
          is false.
      - ask: >
          With $P(x)$ the sentence "$x^2 < 10$" over the integers, which of
          these is a proposition?
        choices:
          - text: >
              $P(x)$
            feedback: >
              The slot is still open, so there is nothing to evaluate — this is
              the predicate itself, not a statement.
          - text: >
              $P(4)$
            correct: true
            feedback: >
              With the slot filled it says $16 < 10$, which is a definite claim
              — false, but definite.
          - text: >
              $x^2$
            feedback: >
              That is a number-valued expression, not even a sentence; there is
              no assertion to be true or false.
        feedback: >
          Filling the slot is what makes a proposition. $P(4)$ has a truth
          value; $P(x)$ does not.
      - teach: >
          The domain is part of the predicate, not decoration. "$x \cdot x = 2$"
          is satisfied by an element of the real numbers and by no rational
          number at all — same sentence, different question.
      - ask: >
          The domain is $\{1, 2, 3, 4, 5\}$ and $P(x)$ is "$x^2 < 10$". How
          many elements of the domain satisfy $P$?
        expects: "3"
        hint: >
          Square each element and compare with $10$.
        feedback: >
          Three: $1, 2, 3$ give $1, 4, 9$, all below $10$, while $4$ and $5$
          give $16$ and $25$. Change the domain and this count changes with it.
      - teach: >
          Predicates can have several slots. If $Q(x,y)$ is "$x < y$", then
          $Q(2,5)$ is true and $Q(5,2)$ is false — but $Q(2,y)$ is still a
          predicate, with one slot filled and one open.
      - ask: >
          $R(x, y, z)$ is a predicate of three variables. How many of the
          variables must be assigned before you have a proposition?
        expects: "3"
        hint: >
          Any open slot leaves the sentence undecided.
        feedback: >
          All three. A single unassigned variable is enough to leave the
          sentence without a truth value, exactly as in the one-variable case.
      - teach: >
          Substituting values is one route from a predicate to a proposition.
          The other is to say how many elements of the domain satisfy it — all
          of them, or at least one — without naming any element at all.

  - node: foundations.logic.quantifier-universal
    hook: >
      "For every" is how a single sentence makes infinitely many claims at
      once, and it is the shape of nearly every theorem you will meet. Knowing
      exactly what it takes to break one is what makes counterexamples possible.
    explanation: >
      Given a predicate $P$ over a domain $D$, the universal quantification
      $\forall x\, P(x)$ — "for every $x$ in $D$, $P(x)$" — is the proposition
      that is true when $P(c)$ holds for every $c$ in $D$, and false otherwise.
      Unlike the predicate it came from, it has a truth value: the slot is
      closed by the quantifier rather than by a substitution.

      The asymmetry is the useful part. To establish $\forall x\, P(x)$ you must
      cover every element; to destroy it you need exactly one element with
      $P(c)$ false. That single element is a counterexample, and finding one is
      a complete refutation — no further work, no other elements to consider.

      Over a small finite domain the quantifier is just a conjunction. If $D$ is
      $\{c_1, \dots, c_n\}$ then $\forall x\, P(x)$ says
      $P(c_1) \land \cdots \land P(c_n)$, and everything you know about "and"
      transfers: all conjuncts must hold, one failure sinks it. If the domain is
      empty there is nothing to conjoin, and the convention makes the statement
      true by default. If the domain is infinite there is no finite rewriting at
      all, which is precisely why universal statements over infinite domains
      call for an argument rather than a check.

      Finally, the domain cannot be suppressed, because it changes the answer.
      $\forall x\, (x^2 \ge x)$ is true over the integers — every integer is
      either at most $0$ or at least $1$, and both cases satisfy it — and false
      over the real numbers, where $x = 1/2$ gives $1/4 < 1/2$. The sentence
      did not change; the range of the quantifier did.
    worked: >
      Let $D$ be $\{1, 2, 3, 4, 5\}$ and $P(x)$ the sentence "$x^2 \ge x$".
      Being finite, the claim unpacks as a conjunction of five statements:
      $1 \ge 1$, $4 \ge 2$, $9 \ge 3$, $16 \ge 4$, $25 \ge 5$. All five hold, so
      $\forall x\, P(x)$ is true over this domain. Now widen the domain to all
      real numbers and test $x = 1/2$: $P(1/2)$ says $1/4 \ge 1/2$, which is
      false. One counterexample, so the universal statement is false over the
      reals — a different verdict from the same sentence.
    pitfalls: >
      Checking a handful of cases and declaring a universal statement proved is
      the standard overreach; over an infinite domain no finite collection of
      successes settles anything. Stating a universal claim without its domain
      leaves it undecidable, since the same sentence can be true over one domain
      and false over a larger one.
    recap: >
      $\forall x\, P(x)$ claims every element of the stated domain satisfies
      $P$, so proving it means covering all of them and refuting it means
      exhibiting one that fails.
    steps:
      - teach: >
          $\forall x\, P(x)$, "for every $x$ in $D$, $P(x)$", is true when
          $P(c)$ holds for every $c$ in the domain. The quantifier closes the
          slot, so unlike the predicate it has a truth value.
      - teach: >
          Over a finite domain $\{c_1, \dots, c_n\}$ it is exactly the
          conjunction $P(c_1) \land \cdots \land P(c_n)$ — and everything you
          know about "and" carries over.
      - ask: >
          The domain is $\{1, 2, 3, 4, 5\}$ and $P(x)$ is "$x^2 > 3$". How many
          elements of the domain fail $P$?
        expects: "1"
        hint: >
          Only the smallest elements are in danger.
        feedback: >
          One: $x = 1$ gives $1 > 3$, which is false, while $4, 9, 16, 25$ all
          exceed $3$. That single failure makes $\forall x\, P(x)$ false over
          this domain.
      - teach: >
          That is the asymmetry to keep. Establishing a universal claim means
          covering every element; destroying one means producing a single
          element where the predicate fails.
      - ask: >
          To disprove "every prime number is odd", what is enough?
        choices:
          - text: >
              Exhibit the single prime $2$, which is even
            correct: true
            feedback: >
              One counterexample refutes a universal claim completely — there
              is nothing further to check.
          - text: >
              Show that most primes are odd
            feedback: >
              That supports the claim rather than refuting it, and a universal
              statement is not a claim about most elements.
          - text: >
              Check every prime up to a million
            feedback: >
              Finitely many successes never settle a claim over an infinite
              domain, in either direction — and here a single small case already
              decides it.
        feedback: >
          The prime $2$ does it. Refuting "for every" costs one element;
          proving it costs all of them.
      - teach: >
          Over an infinite domain there is no finite conjunction to write down,
          which is exactly why universal statements need arguments rather than
          checks. Over an empty domain there is nothing to conjoin, and the
          statement counts as true.
      - ask: >
          $\forall x\, (x^2 \ge x)$ is true over the integers. Is it true over
          the real numbers?
        choices:
          - text: >
              Yes, since squaring cannot decrease a number
            feedback: >
              Squaring does decrease numbers strictly between $0$ and $1$ —
              which is precisely the range the integers skip over.
          - text: >
              No, since $x = 1/2$ gives $1/4 \ge 1/2$, which is false
            correct: true
            feedback: >
              The larger domain contains a counterexample the smaller one did
              not, so the same sentence changes truth value.
          - text: >
              The domain makes no difference to the truth value
            feedback: >
              It makes all the difference — the quantifier ranges over the
              domain, so widening it can only add opportunities to fail.
        feedback: >
          False over the reals. Always state the domain: it is part of the
          claim, not context around it.

  - node: foundations.logic.quantifier-existential
    hook: >
      Half of mathematics asks whether something exists — a solution, a root, a
      counterexample — and this quantifier is how that question is written. It
      also claims far less than people read into it.
    explanation: >
      For a predicate $P$ over a domain $D$, the existential quantification
      $\exists x\, P(x)$ — "there exists an $x$ in $D$ with $P(x)$" — is true
      when $P(c)$ holds for at least one $c$ in $D$, and false when $P(c)$ fails
      for every $c$. The mirror image of the universal case: one good element
      establishes it, and refuting it requires ruling out all of them.

      What it claims is exactly existence, and nothing more. Not uniqueness —
      there may be a thousand elements that work. Not a count. And not a recipe:
      exhibiting a witness $c$ is one way to prove $\exists x\, P(x)$, and it is
      the best way when you can manage it, but an argument that no element could
      fail to exist also proves it while producing nothing you can point at. If
      you need uniqueness you must say so, and the notation for that is
      $\exists ! x\, P(x)$ — "there is exactly one $x$ with $P(x)$" — which is
      a strictly stronger claim.

      Over a finite nonempty domain $\{c_1, \dots, c_n\}$ the quantifier is a
      disjunction: $P(c_1) \lor \cdots \lor P(c_n)$. Everything you know about
      "or" applies — one true disjunct carries it, and it fails only when all of
      them fail. Over an empty domain there is nothing to disjoin, so
      $\exists x\, P(x)$ is false there, whatever $P$ says.

      Notice how the two quantifiers divide the labour. Proving "for every" is
      expensive and refuting it is cheap; proving "there exists" is cheap and
      refuting it is expensive. Which one you are facing decides how you should
      spend your effort.
    worked: >
      Let $D$ be the integers and $P(x)$ the sentence "$x^2 = 16$". Exhibit
      $x = 4$: since $4^2 = 16$, the instance $P(4)$ is true, so
      $\exists x\, P(x)$ is true — one witness, statement established, no other
      integer examined. Now ask about $\exists ! x\, P(x)$. It fails, because
      $(-4)^2 = 16$ as well, giving a second witness. Existence holds;
      uniqueness does not, and the two claims came apart on the same predicate.
    pitfalls: >
      Reading "there exists" as "there exists exactly one" imports a claim that
      was never made; if uniqueness matters, it needs $\exists !$ and its own
      argument. Attempting to refute an existential by checking many elements is
      the wasted-effort trap — a refutation must cover the whole domain, which
      over an infinite domain means an argument, not a search.
    recap: >
      $\exists x\, P(x)$ says at least one element of the domain satisfies $P$ —
      established by a single witness, and silent about how many there are.
    steps:
      - teach: >
          $\exists x\, P(x)$, "there is an $x$ in $D$ with $P(x)$", is true when
          at least one element satisfies $P$ and false when every element fails
          it. Over a finite domain it is the disjunction of the instances.
      - ask: >
          The domain is $\{1, 2, 3, 4, 5, 6\}$ and $P(x)$ is "$x^2 > 20$". How
          many elements of the domain satisfy $P$?
        expects: "2"
        hint: >
          Square each element and compare with $20$.
        feedback: >
          Two: $5^2 = 25$ and $6^2 = 36$ exceed $20$, while $4^2 = 16$ and
          everything below it does not. Either one alone already makes
          $\exists x\, P(x)$ true.
      - teach: >
          That is the whole economy of the quantifier: one witness is a complete
          proof. The other elements are never examined, and the statement does
          not care how many there were.
      - ask: >
          What does $\exists x\, P(x)$ claim?
        choices:
          - text: >
              Exactly one element of the domain satisfies $P$
            feedback: >
              That is the stronger claim $\exists ! x\, P(x)$, which needs its
              own argument — plain existence is silent about how many.
          - text: >
              At least one element of the domain satisfies $P$
            correct: true
            feedback: >
              At least one, with no upper bound implied and no particular
              element singled out.
          - text: >
              Some element satisfies $P$ and can be explicitly constructed
            feedback: >
              Construction is one route to the proof, not part of the claim; an
              argument that no element could fail to exist also settles it.
        feedback: >
          At least one. Uniqueness and constructibility are extra claims, and
          they must be stated and argued separately.
      - teach: >
          If uniqueness is what you mean, write $\exists ! x\, P(x)$ — "there is
          exactly one $x$ with $P(x)$". Over the integers, "$x^2 = 16$" has
          existence but not uniqueness, since $4$ and $-4$ both work.
      - teach: >
          Over an empty domain there is nothing to disjoin, so
          $\exists x\, P(x)$ is false there whatever $P$ says. A claim of
          existence must have something to be about.
      - ask: >
          You want to refute "there is an integer $n$ with $n^2 = 5$". What must
          you do?
        choices:
          - text: >
              Check a few small integers and find none that work
            feedback: >
              A handful of failures leaves infinitely many integers unchecked,
              so nothing has been established.
          - text: >
              Show that no integer at all satisfies it
            correct: true
            feedback: >
              Refuting an existential means covering the whole domain — here by
              noting that $2^2 = 4$ and $3^2 = 9$ and that squaring is
              increasing on the positives, so nothing lands on $5$.
          - text: >
              Show that most integers do not satisfy it
            feedback: >
              "Most" is not a logical notion here; a single overlooked witness
              would make the statement true.
        feedback: >
          The whole domain. Cheap to prove and expensive to refute is exactly
          the reverse of the universal quantifier's economics.

  - node: foundations.logic.quantifier-negation
    hook: >
      When you set out to disprove a theorem, the first thing you need is the
      precise statement you must now establish instead. These two rules produce
      it mechanically, and without them people negate quantifiers by feel and
      get it wrong.
    explanation: >
      The two laws are $\neg \forall x\, P(x) \equiv \exists x\, \neg P(x)$ and
      $\neg \exists x\, P(x) \equiv \forall x\, \neg P(x)$, where $\equiv$ now
      means the two sides agree for every domain and every interpretation of
      $P$.

      Read them in words and they are obvious. A universal claim says every
      element satisfies $P$, so it fails exactly when something violates it —
      which is what $\exists x\, \neg P(x)$ says. An existential claim says
      something satisfies $P$, so it fails exactly when everything fails it —
      which is $\forall x\, \neg P(x)$. Over a finite nonempty domain these are
      literally De Morgan's laws: $\forall$ is a conjunction and $\exists$ a
      disjunction, so the first law says a negated conjunction is the
      disjunction of the negations. The quantified versions are often named for
      De Morgan too.

      The procedure that follows is mechanical, and worth doing mechanically.
      To negate a statement, move the negation rightwards past each quantifier
      in turn, changing every $\forall$ it passes into an $\exists$ and every
      $\exists$ into a $\forall$, and finally negate the body. Nothing else
      changes — the variables, their order, and the domain all stay put. So
      $\neg \forall x \exists y\, P(x,y) \equiv \exists x \forall y\, \neg
      P(x,y)$.

      One thing the rule does not do is negate the domain. The negation of
      "every prime is odd" is "some prime is not odd" — still a claim about
      primes. Changing what you are quantifying over is a different operation
      and never part of a negation.
    worked: >
      Negate "every real number $x$ satisfies $x^2 \ge x$". Symbolically it is
      $\forall x\, (x^2 \ge x)$ over the reals, so its negation is $\exists x\,
      \neg (x^2 \ge x)$, which is $\exists x\, (x^2 < x)$: "there is a real
      number whose square is smaller than itself". That is now a concrete
      existence claim, and one witness settles it — take $x = 1/2$, where
      $x^2 = 1/4 < 1/2$. The original statement is therefore false, and the
      negation told you exactly what to go looking for.
    pitfalls: >
      Keeping the quantifier and negating only the body is the standard error:
      the negation of $\forall x\, P(x)$ is not $\forall x\, \neg P(x)$, which
      claims every element fails and is far stronger. Negating the domain
      instead of the predicate is the other — "every prime is odd" is denied by
      a prime that is not odd, not by a statement about non-primes.
    recap: >
      Push a negation past a quantifier by swapping $\forall$ with $\exists$
      and negating the body; repeat until every negation sits on a predicate.
    steps:
      - teach: >
          The two laws: $\neg \forall x\, P(x) \equiv \exists x\, \neg P(x)$ and
          $\neg \exists x\, P(x) \equiv \forall x\, \neg P(x)$. A universal
          fails when something violates it; an existential fails when everything
          does.
      - teach: >
          Over a finite domain these are De Morgan's laws wearing new clothes:
          $\forall$ is a conjunction and $\exists$ is a disjunction, and negating
          a conjunction gives the disjunction of the negations.
      - ask: >
          What is the negation of "every student passed the exam"?
        choices:
          - text: >
              Every student failed the exam
            feedback: >
              That is the contrary, and it is much stronger — a class where one
              student failed refutes the original without satisfying this.
          - text: >
              At least one student did not pass the exam
            correct: true
            feedback: >
              $\neg \forall$ becomes $\exists \neg$: one violation is exactly
              what it takes for "every" to fail.
          - text: >
              At least one student passed the exam
            feedback: >
              Nothing was negated in the body here; this can be true at the same
              time as the original, so it is not its denial.
        feedback: >
          Swap the quantifier and negate the body: some student did not pass.
      - ask: >
          What is the negation of "there is an integer solution to the
          equation"?
        choices:
          - text: >
              There is an integer that is not a solution
            feedback: >
              That negates the body but keeps $\exists$, and it is compatible
              with a solution existing elsewhere in the domain.
          - text: >
              Every integer fails to be a solution
            correct: true
            feedback: >
              $\neg \exists$ becomes $\forall \neg$: an existence claim dies
              only when the whole domain refuses it.
          - text: >
              There is no integer at all
            feedback: >
              The negation never touches the domain — you still quantify over
              the integers, and only the predicate is denied.
        feedback: >
          Every integer fails it. The domain stays exactly where it was.
      - teach: >
          The procedure is mechanical. Move the negation rightwards, turning
          every $\forall$ it passes into $\exists$ and every $\exists$ into
          $\forall$, then negate the body. Variables and domain are untouched.
      - ask: >
          Negating $\forall x \exists y \forall z\, P(x,y,z)$, how many
          quantifier symbols change?
        expects: "3"
        hint: >
          The negation travels past each one in turn.
        feedback: >
          All three: the result is
          $\exists x \forall y \exists z\, \neg P(x,y,z)$. Every quantifier the
          negation passes flips, and the body is negated at the end.
      - teach: >
          This is the first move of any disproof. Negate the theorem, push the
          negation all the way in, and what remains is the concrete statement
          you now have to establish — usually an existence claim with a witness
          to find.

  - node: foundations.logic.nested-quantifiers
    hook: >
      Once two quantifiers stack, their order decides what may depend on what —
      and a great many definitions in analysis and algebra are exactly a
      carefully ordered string of them. Read the order wrongly and you are
      reading a different definition.
    explanation: >
      Quantifiers applied to a predicate of several variables bind them one at a
      time, left to right. The rule that gives them meaning is a rule about
      dependence: a quantified variable may depend on the variables quantified
      *before* it, and never on those quantified after.

      Compare the two orders. In $\forall x \exists y\, P(x,y)$ the witness $y$
      is chosen after $x$ is known, so it may be different for each $x$. In
      $\exists y \forall x\, P(x,y)$ a single $y$ is fixed first and must then
      work for every $x$. The second is a much stronger demand, and it implies
      the first: if one $y_0$ serves for all $x$, then given any particular $x$
      you may offer that same $y_0$ as the witness. The converse implication
      fails in general — witnesses that vary with $x$ need not collapse to a
      single one — so $\exists y \forall x\, P(x,y) \Rightarrow \forall x
      \exists y\, P(x,y)$ and not the other way.

      Like quantifiers do commute: $\forall x \forall y$ says the same as
      $\forall y \forall x$, and $\exists x \exists y$ the same as $\exists y
      \exists x$, since in each case nothing is being chosen in response to
      anything. Unlike quantifiers do not commute, and swapping them is not a
      rewriting but a change of statement.

      The reading that makes this automatic is adversarial. Each $\forall$ is a
      value handed to you by an opponent who is trying to make you fail, and
      each $\exists$ is a value you supply in reply, knowing everything named so
      far. $\forall x \exists y$ means: they move, then you move. $\exists y
      \forall x$ means: you move first, in the dark, and your choice must
      survive anything they do afterwards.
    worked: >
      Let the domain be the integers and $P(x,y)$ the sentence "$y > x$". Test
      $\forall x \exists y\, P(x,y)$: given any integer $x$, take $y = x + 1$,
      which exceeds it, so the statement is true — and note the witness genuinely
      depends on $x$. Now test $\exists y \forall x\, P(x,y)$: it asks for one
      integer $y_0$ greater than every integer, and $y_0$ itself is an integer,
      so it would have to satisfy $y_0 > y_0$. No such integer exists, so this
      order is false. Same predicate, same domain, two different truth values.
    pitfalls: >
      Reading $\forall x \exists y$ as though the witness were fixed in advance
      is the usual mistake, and it silently upgrades a modest claim into a
      strong one. Swapping two unlike quantifiers "to tidy up" a statement is
      the mechanical version of the same error — only like quantifiers may be
      exchanged.
    recap: >
      Quantifiers bind left to right and each variable may depend only on those
      named before it, so $\exists \forall$ is strictly stronger than
      $\forall \exists$ and the two must never be swapped.
    steps:
      - teach: >
          Stacked quantifiers bind one variable at a time, left to right. The
          rule that matters is dependence: each variable may depend on those
          quantified before it, and on none of those after.
      - teach: >
          So in $\forall x \exists y\, P(x,y)$ the witness $y$ is chosen knowing
          $x$, and may differ for each $x$. In $\exists y \forall x\, P(x,y)$
          one $y$ is fixed first and must serve every $x$.
      - ask: >
          Which statement is stronger?
        choices:
          - text: >
              $\forall x \exists y\, P(x,y)$
            feedback: >
              It is the weaker one: it allows a different witness for every $x$,
              which is far easier to satisfy.
          - text: >
              $\exists y \forall x\, P(x,y)$
            correct: true
            feedback: >
              One witness must work universally. Given such a $y_0$, any
              particular $x$ can be answered with that same $y_0$, so this
              implies the other order.
          - text: >
              They are equivalent, since both mention the same variables
            feedback: >
              The same variables in a different order make a different claim —
              the order fixes what may depend on what.
        feedback: >
          $\exists y \forall x$ is stronger and implies $\forall x \exists y$;
          the reverse implication fails in general.
      - teach: >
          Like quantifiers commute: $\forall x \forall y$ says what
          $\forall y \forall x$ says, and likewise for two $\exists$. Nothing is
          being chosen in response to anything, so order carries no information.
      - ask: >
          Which pair of statements says the same thing?
        choices:
          - text: >
              $\forall x \exists y\, P(x,y)$ and $\exists y \forall x\, P(x,y)$
            feedback: >
              Unlike quantifiers never commute; this is the single most common
              misreading in the subject.
          - text: >
              $\exists x \exists y\, P(x,y)$ and $\exists y \exists x\, P(x,y)$
            correct: true
            feedback: >
              Both ask for a pair of values making $P$ true, and the order in
              which you name the two members of the pair changes nothing.
          - text: >
              $\forall x \exists y\, P(x,y)$ and $\forall y \exists x\, P(x,y)$
            feedback: >
              These swap the roles of the two slots of $P$, which is a different
              statement — for "$y > x$" one says every integer has something
              above it, the other that every integer has something below.
        feedback: >
          Only like quantifiers may be exchanged. Two existentials commute; an
          existential and a universal do not.
      - teach: >
          The reliable reading is adversarial. Each $\forall$ is a value handed
          to you by an opponent; each $\exists$ is your reply, made knowing
          everything named so far.
      - ask: >
          Over the integers with $P(x,y)$ the sentence "$y > x$", which order is
          true?
        choices:
          - text: >
              $\forall x \exists y\, P(x,y)$
            correct: true
            feedback: >
              Given $x$, answer $y = x + 1$. The witness depends on $x$, which
              this order permits.
          - text: >
              $\exists y \forall x\, P(x,y)$
            feedback: >
              This asks for one integer above every integer, including itself —
              it would need $y_0 > y_0$, so no such integer exists.
          - text: >
              Both, since the predicate is the same
            feedback: >
              The predicate is the same and the claims are not; one order is
              answerable after seeing $x$, the other must commit first.
        feedback: >
          The $\forall \exists$ order is true and the $\exists \forall$ order is
          false — a two-line proof that the orders are different statements.

  - node: foundations.logic.ex-quantifier-order
    hook: >
      One predicate, two orders, two different truth values — this is the
      example to keep in your pocket, because it settles the question faster
      than any amount of discussion about dependence.
    explanation: >
      Take the domain to be the real numbers and let $P(x,y)$ be the sentence
      "$x + y = 0$". Now read the two orders.

      First, $\forall x \exists y\, P(x,y)$: for every real $x$ there is a real
      $y$ with $x + y = 0$. Given $x$, take $y = -x$; then $x + (-x) = 0$, so
      the statement is true. Note that the witness moved with $x$ — for $x = 3$
      it was $-3$, for $x = 7$ it was $-7$ — and that is precisely what this
      order allows.

      Second, $\exists y \forall x\, P(x,y)$: there is a single real $y$ such
      that $x + y = 0$ for every real $x$. Suppose some $y_0$ did this. Taking
      $x = 0$ forces $0 + y_0 = 0$, so $y_0 = 0$. Taking $x = 1$ forces
      $1 + y_0 = 0$, so $y_0 = -1$. A single number cannot be both, so no such
      $y_0$ exists and the statement is false.

      English behaves the same way, and the pair is worth memorising. "Everyone
      has a mother" is $\forall x \exists y$: for each person, some person is
      their mother, and the mother varies with the person. "Someone is the
      mother of everyone" is $\exists y \forall x$: one individual mothering the
      entire species. The first is a triviality and the second is absurd, and
      the only difference between them is which quantifier came first.

      So swapping two unlike quantifiers is not a rewriting of a statement. It
      produces a different statement, and here it turns a triviality into a
      falsehood.
    worked: >
      Suppose, for contradiction, that $\exists y \forall x\, (x + y = 0)$ holds
      over the reals, with witness $y_0$. The claim is universal in $x$, so it
      applies to $x = 0$: that gives $0 + y_0 = 0$, hence $y_0 = 0$. It applies
      equally to $x = 5$: that gives $5 + y_0 = 0$, hence $y_0 = -5$. So
      $y_0 = 0$ and $y_0 = -5$, which is impossible — the number of real values
      satisfying both demands is zero. The supposition fails, and the statement
      is false, while the other order remains true with $y = -x$.
    pitfalls: >
      Testing only one value of $x$ is what makes $\exists y \forall x$ look
      plausible: any single $x$ has a partner, and the claim only breaks when
      you insist that one partner serve two different values of $x$. Reading the
      English "there is a $y$ such that for all $x$" from right to left reverses
      the dependence and swaps the two claims.
    recap: >
      Over the reals with $x + y = 0$, the $\forall \exists$ order is true and
      the $\exists \forall$ order is false — one predicate, two orders, two
      verdicts.
    steps:
      - teach: >
          Fix the domain as the real numbers and let $P(x,y)$ be "$x + y = 0$".
          Everything that follows uses this one predicate, changing only the
          order of the quantifiers.
      - teach: >
          Read $\forall x \exists y\, P(x,y)$: for every real $x$ there is a
          real $y$ with $x + y = 0$. Given $x$, answer $y = -x$. True, and the
          witness moves with $x$.
      - ask: >
          Now suppose a single $y_0$ satisfied $x + y_0 = 0$ for every real $x$.
          How many real values can $y_0$ take, given the demands at $x = 0$ and
          $x = 5$?
        expects: "0"
        hint: >
          Solve the two equations separately and compare the answers.
        feedback: >
          Zero. The demand at $x = 0$ forces $y_0 = 0$; the demand at $x = 5$
          forces $y_0 = -5$. No number is both, so no witness exists.
      - teach: >
          So $\exists y \forall x\, P(x,y)$ is false while
          $\forall x \exists y\, P(x,y)$ is true. The predicate never changed;
          only the order did.
      - ask: >
          Why does the $\forall \exists$ order survive where the other fails?
        choices:
          - text: >
              Because the witness is chosen after $x$ is known, so it may depend
              on $x$
            correct: true
            feedback: >
              Exactly — $y = -x$ is a different number for each $x$, which the
              first order permits and the second forbids.
          - text: >
              Because the real numbers are infinite
            feedback: >
              Size is not the issue; the failing order asks one number to answer
              two incompatible demands, which no domain repairs.
          - text: >
              Because $x + y = 0$ is symmetric in $x$ and $y$
            feedback: >
              The predicate is indeed symmetric, and both orders would still
              differ — symmetry of the predicate says nothing about the order of
              the quantifiers.
        feedback: >
          Dependence is the whole story: a witness chosen after $x$ may vary
          with $x$; a witness chosen before it may not.
      - teach: >
          The English pair behaves identically. "Everyone has a mother" is
          $\forall x \exists y$; "someone is the mother of everyone" is
          $\exists y \forall x$. One is a triviality, the other is absurd.
      - ask: >
          "Every lock in the building has a key that opens it" versus "there is
          a key that opens every lock in the building". What is the relation?
        choices:
          - text: >
              They say the same thing in different words
            feedback: >
              The first allows a separate key per lock; the second demands a
              master key. Any building with individually keyed doors separates
              them.
          - text: >
              The second implies the first, but not conversely
            correct: true
            feedback: >
              A master key answers every lock individually, so it gives the
              first. A pile of individual keys gives no master key.
          - text: >
              The first implies the second, but not conversely
            feedback: >
              That is the implication that fails — having a key for each lock
              never manufactures one key for all of them.
        feedback: >
          $\exists \forall$ implies $\forall \exists$ and never the reverse. The
          master key is the picture to keep.

  - node: foundations.logic.vacuous-truth
    hook: >
      A statement about all the things of a kind is true when there are no such
      things, and that convention is what keeps general theorems from collapsing
      in their degenerate cases. It also produces sentences that look wrong the
      first time you meet them.
    explanation: >
      Start from the conditional. If $p$ is false, then $p \to q$ is true
      whatever $q$ says, since the one forbidden combination requires a true
      hypothesis. Such a conditional is called vacuously true — the promise was
      never triggered, so it was never broken.

      Now put a universal quantifier in front. $\forall x\, (P(x) \to Q(x))$
      says every element with property $P$ has property $Q$. If no element of
      the domain satisfies $P$, then every instance $P(c) \to Q(c)$ has a false
      hypothesis and is true, so the whole universal statement is true. That is
      why "every real number $x$ with $x^2 < 0$ satisfies $x = 7$" is a true
      statement: there are no such real numbers, so none of them fails the
      condition. The same applies to an empty domain, where every
      $\forall x\, P(x)$ is true and every $\exists x\, P(x)$ is false.

      This is not a defect of the convention, and the reason is worth holding.
      A universal statement asserts only that no element violates it. Where
      there is nothing to violate it, nothing does, and the negation confirms
      it: refuting $\forall x\, (P(x) \to Q(x))$ requires exhibiting an element
      with $P$ true and $Q$ false, and if nothing satisfies $P$ at all, no such
      element can be produced.

      Practically, this is why a proof of $\forall x\, (P(x) \to Q(x))$ may open
      with "let $x$ satisfy $P$" and be finished the moment that supposition
      turns out to be unsatisfiable. And it is why a general theorem keeps
      working on degenerate inputs — the empty set, the zero vector space, the
      graph with no edges — instead of needing them excluded by hand in the
      statement.
    worked: >
      Decide whether "every real number $x$ with $x^2 < 0$ satisfies $x = 7$" is
      true. Written out it is $\forall x\, (x^2 < 0 \to x = 7)$ over the reals.
      Try to refute it: you would need a real number with $x^2 < 0$ and
      $x \ne 7$. The first demand alone is impossible, since squares of reals
      are never negative, so the number of counterexamples is zero. With no
      counterexample available the universal statement stands, and it is true —
      vacuously, and no less true for that.
    pitfalls: >
      Reading a vacuously true statement as saying something about the objects
      it mentions is the trap: it makes no claim at all, since there are no such
      objects to claim anything about. In the other direction, do not treat a
      vacuous case as an exception to be excluded from a theorem — the theorem
      already holds there, which is the point of the convention.
    recap: >
      A conditional with a false hypothesis is true, so a universal statement
      over things that do not exist is true, and general theorems survive their
      degenerate cases untouched.
    steps:
      - teach: >
          A conditional with a false hypothesis is true, whatever its conclusion
          says: the one forbidden combination needs a true hypothesis. Such a
          statement is called vacuously true.
      - teach: >
          Put a universal in front and the effect spreads.
          $\forall x\, (P(x) \to Q(x))$ is true whenever no element of the
          domain satisfies $P$, because every instance then has a false
          hypothesis.
      - ask: >
          Over the real numbers, how many counterexamples are there to "every
          $x$ with $x^2 < 0$ satisfies $x = 7$"?
        expects: "0"
        hint: >
          A counterexample would have to satisfy the hypothesis first.
        feedback: >
          Zero. A counterexample needs $x^2 < 0$ and $x \ne 7$, and no real
          number meets the first demand — so the statement has nothing to refute
          it and is true.
      - teach: >
          The reason this is not a defect: a universal statement asserts only
          that no element violates it. Where there is nothing to violate it,
          nothing does.
      - ask: >
          "Every unicorn in this room is purple." Is it true?
        choices:
          - text: >
              False, since there are no purple unicorns here
            feedback: >
              Falsity would require a unicorn in this room that is not purple,
              and the room supplies no unicorn to serve as one.
          - text: >
              True, since there is no unicorn here to be a counterexample
            correct: true
            feedback: >
              With nothing satisfying the hypothesis, every instance is
              vacuously true, so the universal claim holds.
          - text: >
              Neither, since the sentence is about nothing
            feedback: >
              It is a perfectly good proposition; the convention assigns it a
              value, and bivalence leaves no third option.
        feedback: >
          True, vacuously. Nothing is being claimed about unicorns, because
          there are none for the claim to touch.
      - teach: >
          The same holds over an empty domain: every $\forall x\, P(x)$ is true
          there and every $\exists x\, P(x)$ is false, since there is nothing to
          conjoin and nothing to disjoin.
      - ask: >
          A theorem says "every element of a finite set with no elements is
          blue". What does its proof require?
        choices:
          - text: >
              Nothing to check — the claim holds vacuously
            correct: true
            feedback: >
              There is no element to inspect, so no element fails, and the
              universal statement is true with no work at all.
          - text: >
              A separate argument for the empty case
            feedback: >
              The empty case is the one that needs no argument; it is the
              nonempty cases that cost effort.
          - text: >
              An extra hypothesis excluding the empty set
            feedback: >
              Excluding it is exactly what the convention makes unnecessary —
              the theorem already holds there.
        feedback: >
          Nothing to check. This is why general theorems keep working on
          degenerate inputs instead of carving them out by hand.
