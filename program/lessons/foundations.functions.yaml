unit: foundations.functions
opening: >
  A function is a relation with two demands imposed on it — every input gets a
  value, and no input gets two — and almost every object in the rest of
  mathematics is a function with an adjective attached. This unit builds the
  vocabulary in order: the definition as a triple of domain, codomain and
  graph; the gap between where outputs are allowed to live and where they
  actually land; the two ways of pushing and pulling whole subsets through a
  function, which behave startlingly differently; and the three adjectives —
  injective, surjective, bijective — that measure how far a function is from
  being reversible. From there the unit composes functions, inverts them, and
  cashes the theory out in two counting theorems about finite sets. By the end
  you should be able to check an explicit function for injectivity and
  surjectivity, compute an image or a preimage by hand, decide whether an
  inverse exists, and say precisely why $f^{-1}(T)$ is legal notation for a
  function with no inverse at all.
lessons:
  - node: foundations.functions.def-function
    hook: >
      Continuous, linear, measurable, homomorphic — every later branch of this
      tree studies functions with an adjective attached. This is the noun, and
      pinning it down is what stops you from ever again calling $x^2$ a
      function without saying where it starts and where it is allowed to land.
    explanation: >
      You already have binary relations: a relation from $A$ to $B$ is any
      subset $R \subseteq A \times B$ whatsoever, a chosen set of cells in the
      grid with one row per element of $A$ and one column per element of $B$. A
      function is that same object with two conditions imposed on the choice,
      and it is worth separating them, because they fail independently.

      Totality asks that every row contain at least one chosen cell: no input
      is left without a value. Single-valuedness asks that no row contain two:
      no input gets a second value. Together they say every row holds exactly
      one chosen cell, and that cell's column is what $f(a)$ names. Take
      $A = \{1,2,3\}$ and $B = \{a,b\}$. The set $\{(1,a),(2,a),(3,b)\}$ picks
      one cell in each of the three rows, so it is a function. The set
      $\{(1,a),(2,b)\}$ leaves row $3$ empty and fails totality. The set
      $\{(1,a),(1,b),(2,a),(3,b)\}$ puts two cells in row $1$ and fails
      single-valuedness. Neither of the last two is a function; both are
      perfectly good relations.

      The third piece of the definition is the one people drop. A function is
      the whole triple — domain, codomain, graph. The graph records every value
      the function takes, but says nothing about which larger set those values
      were permitted to roam in, so the codomain has to be carried alongside
      it. That is why the phrase "the function $x^2$" names nothing yet:
      $x^2$ is a rule, and a rule becomes a function only once you declare
      $\mathbb{R} \to \mathbb{R}$, or $\mathbb{N} \to \mathbb{N}$, or something
      else again.
    worked: >
      Let $A = B = \{1,2,3,4\}$ and let $R$ hold the pairs $(a,b)$ for which $b$
      is the number of positive divisors of $a$. Walk the rows. The number $1$
      has one divisor, giving the cell $(1,1)$. The number $2$ has divisors
      $1, 2$, giving $(2,2)$. The number $3$ has divisors $1, 3$, giving
      $(3,2)$. The number $4$ has divisors $1, 2, 4$, giving $(4,3)$. Every row
      received exactly one cell, so $R$ is the graph of a function
      $f : A \to B$ with $f(1) = 1$, $f(2) = f(3) = 2$ and $f(4) = 3$. Two
      inputs sharing a value cost nothing; two values sharing an input would
      have been fatal. Notice that $4 \in B$ is never produced — a codomain is
      under no obligation to be used up.
    pitfalls: >
      A rule undefined somewhere on the claimed domain is not a function there:
      $x \mapsto 1/x$ is not a function $\mathbb{R} \to \mathbb{R}$, because
      totality fails at $0$. A rule that returns two answers is not one either
      — "the square root of $x$" read as $\pm\sqrt{x}$ fails single-valuedness.
      And a formula never names a function on its own, since changing only the
      codomain still changes the object you are talking about.
    recap: >
      A function is a triple — domain, codomain, and a graph placing exactly
      one chosen pair in every row of the grid.
    steps:
      - teach: >
          A relation imposes no condition at all, which is why there are so
          many of them and so little to say about any one. A function is what
          you get by imposing the two smallest conditions that make the phrase
          "the value of $f$ at $a$" mean something.
      - teach: >
          Totality: every element of the domain gets at least one value.
          Single-valuedness: none gets two. In the grid picture of
          $A \times B$, the two together say that every row contains exactly
          one chosen cell, and $f(a)$ names the column it sits in.
      - teach: >
          Try it on $A = \{1,2\}$ and $B = \{u,v\}$. The set
          $\{(1,u),(2,u)\}$ has one cell in each row, so it is a function that
          sends both inputs to $u$. The set $\{(1,u),(1,v)\}$ has two cells in
          row $1$ and none in row $2$, so it fails both conditions at once.
      - ask: >
          With $A = \{1,2,3\}$ and $B = \{0,1\}$, which of these subsets of
          $A \times B$ is the graph of a function $A \to B$?
        choices:
          - text: >
              $\{(1,0),(2,1)\}$
            feedback: >
              Row $3$ is empty: the input $3$ receives no value, so totality
              fails. This is a relation, just not a function.
          - text: >
              $\{(1,0),(1,1),(2,1),(3,0)\}$
            feedback: >
              Row $1$ holds two cells, so $f(1)$ would have to be both $0$ and
              $1$. Single-valuedness fails, and the notation $f(1)$ stops
              meaning anything.
          - text: >
              $\{(1,1),(2,1),(3,1)\}$
            correct: true
            feedback: >
              One cell in each of the three rows. A constant function is a
              function — nothing in the definition asks for different inputs to
              get different values.
        feedback: >
          Only $\{(1,1),(2,1),(3,1)\}$ has exactly one chosen cell per row. Read
          the two conditions off the rows and the answer is immediate: no empty
          row, no doubled row.
      - teach: >
          The definition carries three pieces of data, not one. Domain,
          codomain, graph — and the codomain is invisible in the graph, so it
          has to be declared. This is why $x^2$ is a rule and $x^2$ read as a
          map $\mathbb{R} \to \mathbb{R}$ is a function.
      - ask: >
          How many functions are there from a $2$-element set to a
          $3$-element set?
        expects: "9"
        hint: >
          Each input needs exactly one value, and the two choices are made
          independently of one another.
        feedback: >
          Nine. The first input can be sent to any of the $3$ elements, and
          whatever you chose there, the second input still has all $3$
          available, so $3 \times 3 = 9$. In general there are $|B|^{|A|}$
          functions $A \to B$ — the notation $B^{A}$ comes from exactly this
          count.
      - ask: >
          Why is $f : \mathbb{R} \to \mathbb{R}$ with $f(x) = 1/x$ not a
          function?
        choices:
          - text: >
              It is a function — $1/x$ is a perfectly good formula.
            feedback: >
              The formula is fine; the declaration is not. A function is a rule
              *together with* a domain, and this rule fails on this domain.
          - text: >
              Single-valuedness fails, since $1/x$ can come out positive or
              negative.
            feedback: >
              Wrong condition. Each nonzero $x$ gets exactly one value of
              $1/x$; the sign just tracks the sign of $x$. The breakage is
              elsewhere.
          - text: >
              Totality fails: $0$ lies in the declared domain and the rule
              gives it no value.
            correct: true
            feedback: >
              Exactly. Row $0$ of the grid is empty. Shrink the domain to
              $\mathbb{R} \setminus \{0\}$ and the same rule becomes a genuine
              function.
        feedback: >
          Totality is what fails, and only at the single point $0$. The repair
          is always the same: change the declared domain until the rule is
          defined on all of it.
      - teach: >
          Hold on to the triple. Almost every confusion later in this unit —
          about ranges, about being onto, about whether an inverse exists — is
          a confusion about which of the three pieces you were actually handed.

  - node: foundations.functions.def-range
    hook: >
      A function's outputs live in two sets at once: the one you declared and
      the one they actually fill. Keeping those apart is what makes the word
      "onto" mean anything at all.
    explanation: >
      The graph of $f : A \to B$ records a pair $(a, f(a))$ for every $a$.
      Sweep the domain, collect the second coordinates, and throw the
      duplicates away: what remains is the range, $\operatorname{ran} f =
      \{ f(a) : a \in A \}$, also called the image of $f$. It is a subset of
      $B$, since every value was required to lie in $B$ in the first place.

      Compute one. Let $f : \{-2,-1,0,1,2\} \to \mathbb{Z}$ be $f(a) = a^2$.
      The values, in domain order, are $4, 1, 0, 1, 4$. As a set that is
      $\{0, 1, 4\}$ — three elements out of a five-element domain, because
      repeats collapse when you write a set. So $\operatorname{ran} f$ has
      three elements while the codomain $\mathbb{Z}$ is infinite. The gap
      between them is enormous and entirely legal.

      Here is the asymmetry that matters. The range is *determined* by $f$: you
      can read it off the graph without being told anything else. The codomain
      is *declared*: somebody chose it when the function was written down, and
      they could have chosen any set containing all the values. Enlarge the
      codomain from $\{0,1,4\}$ to $\mathbb{Z}$ and not one value changes, yet
      the range stays put at $\{0,1,4\}$ while the codomain balloons.

      The range depends on the domain too, and this is the part people forget
      when they read a range off a formula. The rule $a \mapsto a^2$ has range
      $\{0,1,4\}$ on $\{-2,-1,0,1,2\}$, range $\{1,4\}$ on $\{1,2\}$, and range
      $\emptyset$ on the empty domain — the same rule, three different ranges,
      because a range is a fact about the whole triple.
    worked: >
      Let $g : \{1,2,3,4,5,6\} \to \{0,1,2,3,4\}$ send $n$ to the remainder of
      $n$ on division by $3$. Sweep the domain: $g(1) = 1$, $g(2) = 2$,
      $g(3) = 0$, $g(4) = 1$, $g(5) = 2$, $g(6) = 0$. The list of values is
      $1, 2, 0, 1, 2, 0$, so $\operatorname{ran} g = \{0, 1, 2\}$, three
      elements. The codomain has five, and $3$ and $4$ are values $g$ was
      allowed to take and never does. Nothing is wrong with $g$; the declaration
      was simply generous.
    pitfalls: >
      Some books say "range" where this one says codomain, so when you read
      the word elsewhere, check which set is meant. Reading a range off the
      formula alone — announcing that $a \mapsto a^2$ "has range
      $[0,\infty)$" without looking at the domain — is the standard error, and
      it is wrong the moment the domain is anything but all of $\mathbb{R}$.
      Enlarging the codomain never enlarges the range: the values are already
      fixed.
    recap: >
      The codomain is where outputs are allowed to land and is chosen by
      declaration; the range is where they actually land and is forced by the
      function.
    steps:
      - teach: >
          Two different sets are floating around every time you write
          $f : A \to B$. One of them you chose, and one of them $f$ chose for
          you. Telling them apart is the whole content of this step.
      - teach: >
          The range is what $f$ chose: $\operatorname{ran} f = \{f(a) : a \in
          A\}$, the set of values actually taken. Sweep the domain, collect the
          outputs, drop the duplicates. It is always a subset of the codomain,
          because every value was required to live there.
      - teach: >
          Take $f : \{-2,-1,0,1,2\} \to \mathbb{Z}$ with $f(a) = a^2$. The
          values in order are $4, 1, 0, 1, 4$, so $\operatorname{ran} f =
          \{0,1,4\}$ — three elements from a five-element domain, since a set
          does not repeat itself.
      - ask: >
          Same rule, bigger domain: for $f : \{-3,-2,-1,0,1,2,3\} \to
          \mathbb{Z}$ with $f(a) = a^2$, how many elements does
          $\operatorname{ran} f$ have?
        expects: "4"
        hint: >
          List the seven values first, then collapse the repeats.
        feedback: >
          Four. The values are $9, 4, 1, 0, 1, 4, 9$, and as a set that is
          $\{0, 1, 4, 9\}$. Seven inputs, four outputs: $a$ and $-a$ always
          land on the same square, so only $0$ fails to be paired up.
      - teach: >
          The codomain is the set you chose when you declared the function, and
          any set containing all the values would have been legal. That choice
          is invisible in the graph, which is exactly why it has to be carried
          in the declaration.
      - ask: >
          Which statement is true of every function $f : A \to B$?
        choices:
          - text: >
              Both the range and the codomain can be read off the graph of $f$.
            feedback: >
              The graph tells you every value taken, so it does give the range
              — but it cannot tell you which larger set those values were
              allowed to sit in. The codomain is not in there.
          - text: >
              The range is determined by $f$; the codomain is a declaration
              that can be enlarged without changing a single value.
            correct: true
            feedback: >
              Right, and this asymmetry is the point. Widening $B$ leaves every
              $f(a)$ untouched and leaves $\operatorname{ran} f$ untouched, yet
              it does change the function, since the codomain is part of the
              data.
          - text: >
              The range and the codomain are equal whenever $f$ is given by a
              formula.
            feedback: >
              A formula changes nothing here. The squaring rule into
              $\mathbb{Z}$ has range $\{0,1,4\}$ on a five-point domain and a
              codomain that is infinite.
        feedback: >
          The range is forced by $f$ and the codomain is chosen for $f$. That
          one sentence dissolves most of the confusion around this vocabulary.
      - ask: >
          Let $f : \{-1,0,1\} \to \mathbb{Z}$ and $g : \{0,1\} \to \mathbb{Z}$
          both be given by the rule $x \mapsto x^2$. What are their ranges?
        choices:
          - text: >
              $\operatorname{ran} f = \{-1,0,1\}$ and $\operatorname{ran} g =
              \{0,1\}$.
            feedback: >
              That reads the domain back out instead of the values. The values
              of $f$ are $1, 0, 1$, and $-1$ is never an output of squaring.
          - text: >
              Both ranges are $\{0,1\}$.
            correct: true
            feedback: >
              Yes. $f$ takes values $1, 0, 1$ and $g$ takes values $0, 1$, so
              both ranges are $\{0,1\}$ — even though $f$ and $g$ are different
              functions, having different domains.
          - text: >
              $\operatorname{ran} f$ is larger, since $f$ has a larger domain.
            feedback: >
              A larger domain can only give a range at least as large, never a
              strictly larger one automatically. Here the extra input $-1$
              lands on a value $g$ already produced.
        feedback: >
          Both ranges are $\{0,1\}$. Equal ranges do not make equal functions,
          and a bigger domain does not make a bigger range — you have to
          actually compute the values.
      - teach: >
          So the range answers "what does this function hit?" and the codomain
          answers "what was it allowed to hit?" Every question about a function
          being onto is a question about how far apart those two answers are.

  - node: foundations.functions.def-equality
    hook: >
      You will be proving that two functions are equal constantly — that a
      composite is the identity, that a simplification changed nothing — and
      there is exactly one thing that has to be checked.
    explanation: >
      Since a function is a triple, equality has to be a statement about all
      three pieces: $f = g$ means they have the same domain, the same codomain,
      and $f(a) = g(a)$ for every $a$ in that common domain. Nothing else
      counts, and nothing less does.

      The consequence people find liberating is that *how* a value is computed
      is invisible. On $\mathbb{R}$, the rules $x \mapsto (x+1)^2$ and
      $x \mapsto x^2 + 2x + 1$ produce the same number at every input, so they
      are the same function, not two functions that happen to agree. Equality
      of functions is extensional: it looks only at the input-output behaviour,
      never at the recipe. The same thing happens on tiny sets. On
      $A = \{1,2\}$, the rules $n \mapsto n^2$ and $n \mapsto 3n - 2$ give
      $1, 4$ and $1, 4$ respectively — one function wearing two formulas.

      The consequence people find pedantic is that changing either set changes
      the function even when no value moves. The rule $x \mapsto x^2$ read as
      $\mathbb{R} \to \mathbb{R}$ and read as $\mathbb{R} \to [0,\infty)$ are
      different functions, because a codomain is part of the data. This will
      look like bookkeeping until you meet a property of functions that depends
      on the codomain, at which point it becomes the whole story.

      Proving $f = g$ therefore has a fixed shape, and it is the shape of any
      universally quantified claim: confirm the two sets match, then fix an
      *arbitrary* $a$ in the common domain and derive $f(a) = g(a)$. Checking a
      handful of sample points is not a proof; agreeing at four places and
      disagreeing at the fifth is completely ordinary behaviour.
    worked: >
      Let $f, g : \{0,1,2\} \to \mathbb{Z}$ with $f(n) = n^2$ and
      $g(n) = 3n - 2$. Evaluate both at every point of the domain — there are
      only three. At $n = 0$: $f(0) = 0$ and $g(0) = -2$. Already unequal, so
      $f \ne g$, and the single point $0$ is the whole disproof. At $n = 1$:
      $1$ and $1$. At $n = 2$: $4$ and $4$. So $f$ and $g$ agree at two of the
      three points and are still different functions. Now restrict both to
      $\{1,2\}$: the domains match, the codomains match, and the values agree
      at both points, so on that smaller domain the two rules *are* the same
      function.
    pitfalls: >
      Comparing formulas instead of values gets both directions wrong: two
      formulas can name one function, and one formula can name two functions
      once the sets change. Checking sample points proves inequality but never
      equality — one disagreement is fatal, while a thousand agreements prove
      nothing about the rest. And dropping the codomain clause is the quiet
      error, because every value can match while the two objects still differ.
    recap: >
      Two functions are equal exactly when their domains agree, their codomains
      agree, and their values agree at every single point.
    steps:
      - teach: >
          A function is a triple, so an equation between functions is three
          claims at once: same domain, same codomain, same value at every point
          of that domain.
      - teach: >
          The third clause is the one with content, and it is extensional — it
          looks at behaviour, not at the recipe. On $\mathbb{R}$, the rules
          $x \mapsto (x+1)^2$ and $x \mapsto x^2 + 2x + 1$ agree everywhere, so
          they are one function, not two.
      - teach: >
          The same thing on a small set: on $A = \{1,2\}$ the rules
          $n \mapsto n^2$ and $n \mapsto 3n-2$ give $1, 4$ and $1, 4$. Two
          formulas, one function — and you found that out by evaluating, not by
          doing algebra on the expressions.
      - ask: >
          Now put those same two rules on the bigger domain
          $\{0,1,2,3\}$, into $\mathbb{Z}$. At how many points do
          $n \mapsto n^2$ and $n \mapsto 3n-2$ agree?
        expects: "2"
        hint: >
          Tabulate both rows and compare them entry by entry.
        feedback: >
          Two. Squaring gives $0, 1, 4, 9$ and the linear rule gives
          $-2, 1, 4, 7$. They match at $n = 1$ and $n = 2$ and differ at
          $n = 0$ and $n = 3$. Two agreements out of four is not equality —
          a single disagreement settles it.
      - teach: >
          Which shows how a disproof works: exhibit one point where the values
          differ and you are done. A proof of equality has to cover *every*
          point, so it fixes an arbitrary $a$ in the common domain and derives
          $f(a) = g(a)$ from the rules.
      - ask: >
          Is $x \mapsto x^2$ read as a map $\mathbb{R} \to \mathbb{R}$ equal to
          $x \mapsto x^2$ read as a map $\mathbb{R} \to [0,\infty)$?
        choices:
          - text: >
              Yes — the domain and the rule are identical, so the functions are
              identical.
            feedback: >
              Two of the three clauses hold, and that is not enough. The
              codomain is part of the data, so two of three leaves you with two
              different functions.
          - text: >
              No — the codomains differ, so these are different functions even
              though no value changes.
            correct: true
            feedback: >
              Correct, and note how strange that sounds and how necessary it
              is: the graphs are literally identical sets of pairs, and the
              functions are still different objects.
          - text: >
              Yes, provided we agree to identify a function with its graph.
            feedback: >
              That identification is exactly what this definition refuses. If a
              function were its graph, the codomain would be unrecoverable and
              statements about it could not be made.
        feedback: >
          Different codomains, different functions. Same rule and same domain
          get you no further than that.
      - ask: >
          What does a correct proof of $f = g$ look like?
        choices:
          - text: >
              Simplify both formulas until they are written identically.
            feedback: >
              Neither necessary nor sufficient. Formulas that look nothing
              alike can define the same function, and identical formulas on
              different sets define different functions.
          - text: >
              Check that $f$ and $g$ agree on several representative inputs.
            feedback: >
              That can only ever disprove equality. Agreement at the points you
              sampled says nothing about the points you did not.
          - text: >
              Check the domains match and the codomains match, then fix an
              arbitrary $a$ in the common domain and show $f(a) = g(a)$.
            correct: true
            feedback: >
              Yes — the two set conditions, then a universally quantified claim
              proved the usual way, by arguing about an arbitrary element.
        feedback: >
          Two bookkeeping checks and one honest argument about an arbitrary
          point. Sampling is for disproof; arbitrariness is for proof.
      - teach: >
          Equality of functions is the tool you will reach for whenever an
          identity between constructions has to be justified. It always reduces
          to the same three questions, asked in the same order.

  - node: foundations.functions.def-image
    hook: >
      Whole theorems in later branches are statements about what a function
      does to an entire set at once — the image of an interval, the image of a
      subgroup. This is the operation those theorems are about.
    explanation: >
      You already know the range: sweep the whole domain and collect the
      values. Nothing forces you to sweep the whole domain. Pick any subset
      $S \subseteq A$, sweep only $S$, and collect what comes out: that is the
      image $f(S) = \{ f(s) : s \in S \} \subseteq B$. Taking $S = A$ gives the
      range back, so this is one operation with the range as a special case.

      Read the membership test carefully, because everything odd about images
      later comes from it: $b \in f(S)$ means *there exists* $s \in S$ with
      $f(s) = b$. It is an existential claim, a search over $S$. To place $b$
      in the image you exhibit one witness; to keep $b$ out you must rule out
      every element of $S$ at once.

      Compute one by hand. Let $f : \{1,2,3,4,5\} \to \mathbb{Z}$ send $n$ to
      the remainder of $n$ on division by $3$, so the values are
      $1, 2, 0, 1, 2$. Take $S = \{1,2,4\}$. Then $f(S) = \{f(1), f(2), f(4)\}
      = \{1, 2, 1\} = \{1,2\}$: three inputs, two outputs, because $1$ and $4$
      collided. Images shrink, and $|f(S)| \le |S|$ always holds for exactly
      that reason — every output needs at least one input, and inputs can
      double up.

      Two facts follow straight from the definition. The image of nothing is
      nothing, $f(\emptyset) = \emptyset$, since there is no $s$ to supply a
      witness. And images are monotone: if $S \subseteq S'$ then $f(S)
      \subseteq f(S')$, because a witness $s \in S$ for $b$ is already a
      witness $s \in S'$. That one-line argument is worth remembering; it is
      the shape of nearly every proof about images.
    worked: >
      Let $f : \{1,2,3,4,5,6\} \to \mathbb{Z}$ be $f(n) = (n-3)^2$. Tabulate:
      $f(1) = 4$, $f(2) = 1$, $f(3) = 0$, $f(4) = 1$, $f(5) = 4$, $f(6) = 9$.
      Take $S = \{2,4,5\}$. Then $f(S) = \{f(2), f(4), f(5)\} = \{1, 1, 4\} =
      \{1,4\}$, two elements from a three-element $S$, since $2$ and $4$ both
      land on $1$. Sweeping the whole domain instead gives $f(A) = \{0,1,4,9\}$,
      which is the range. And $\{2,4,5\} \subseteq \{2,4,5,6\}$ gives
      $\{1,4\} \subseteq \{1,4,9\}$, monotonicity in action.
    pitfalls: >
      The notation overloads $f$: $f(s)$ is an element of $B$ and $f(S)$ is a
      subset of $B$, and only the case of the letter tells you which. When the
      domain has sets as its elements, say out loud which reading you intend.
      Assuming $|f(S)| = |S|$ is the standard slip — collisions make images
      strictly smaller all the time. And $b \notin f(S)$ is not "some element
      of $S$ misses $b$"; it is "every element of $S$ misses $b$".
    recap: >
      The image $f(S)$ is what you get by pushing a subset forward through $f$,
      and membership in it is an existential claim — some point of $S$ maps
      there.
    steps:
      - teach: >
          The range is what comes out when you sweep the entire domain. There
          is no reason to sweep all of it. Sweep a subset instead and you get
          the operation this step is about.
      - teach: >
          For $S \subseteq A$, the image is $f(S) = \{f(s) : s \in S\}$, a
          subset of the codomain. Taking $S = A$ returns the range, so nothing
          new has been invented — the range is one value of this operation.
      - teach: >
          The membership test hides a quantifier: $b \in f(S)$ says *there
          exists* $s \in S$ with $f(s) = b$. Putting $b$ in the image takes one
          witness. Keeping $b$ out takes an argument about every element of $S$
          at once.
      - ask: >
          Let $f : \{1,2,3,4,5\} \to \mathbb{Z}$ send $n$ to the remainder of
          $n$ on division by $3$. How many elements does $f(\{2,3,5\})$ have?
        expects: "2"
        hint: >
          Compute the three values first, then remember you are writing down a
          set.
        feedback: >
          Two. The values are $f(2) = 2$, $f(3) = 0$ and $f(5) = 2$, so
          $f(\{2,3,5\}) = \{2, 0, 2\} = \{0,2\}$. The inputs $2$ and $5$
          collided, and a set records each element once.
      - teach: >
          That collision is the general pattern: $|f(S)| \le |S|$ for every
          finite $S$, since every element of the image needs at least one
          source in $S$ and sources may double up. Images can shrink; they can
          never grow.
      - ask: >
          If $S$ has exactly $5$ elements, which of these is impossible for
          $f(S)$?
        choices:
          - text: >
              $f(S)$ has $1$ element.
            feedback: >
              Perfectly possible — a constant function sends all five inputs to
              the same value, and that is the extreme case of collision.
          - text: >
              $f(S)$ has $5$ elements.
            feedback: >
              Possible: this is what happens when the five inputs get five
              different values, with no collisions at all.
          - text: >
              $f(S)$ has $6$ elements.
            correct: true
            feedback: >
              Impossible. Every element of $f(S)$ needs a witness in $S$, and
              $S$ has only five candidates, so $|f(S)| \le 5$.
        feedback: >
          Only $6$ is out of reach. The image is a set of values each of which
          needs a source in $S$, so it is capped at $|S|$ — and anything from
          $1$ up to $|S|$ can actually occur.
      - ask: >
          What does $b \notin f(S)$ say?
        choices:
          - text: >
              Some $s \in S$ has $f(s) \ne b$.
            feedback: >
              That is far too weak — it holds as soon as one point of $S$ goes
              elsewhere, which happens whenever $S$ has two different values.
              Negating an existential gives a universal.
          - text: >
              Every $s \in S$ has $f(s) \ne b$.
            correct: true
            feedback: >
              Yes. Membership was "there exists a witness", so non-membership
              is "no element of $S$ is a witness" — a claim about all of $S$.
          - text: >
              $b$ does not belong to the codomain of $f$.
            feedback: >
              Different statement entirely. Plenty of elements of the codomain
              fail to be in $f(S)$; that is the normal situation, not a defect.
        feedback: >
          Negating the existential turns it into a universal: $b \notin f(S)$
          means every point of $S$ maps somewhere other than $b$.
      - teach: >
          Keep the two readings of the letter $f$ apart. Applied to an element
          it gives an element; applied to a subset it gives a subset. The
          existential inside the second reading is what makes images behave
          worse than you would expect.

  - node: foundations.functions.def-preimage
    hook: >
      The symbol $f^{-1}$ appears throughout mathematics attached to functions
      that are not reversible at all — topology defines continuity with it.
      This step is why that is not an abuse of notation.
    explanation: >
      Push a subset forward and you take an image. Pull one backward and you
      take a preimage: for $T \subseteq B$, the preimage is $f^{-1}(T) =
      \{ a \in A : f(a) \in T \} \subseteq A$. In words, keep every input whose
      value lands inside $T$.

      Notice how cheap the test is. For a given $a$ there is exactly one value
      $f(a)$ — totality and single-valuedness guarantee it — so deciding
      whether $a$ belongs is a single membership question about a single
      element. There is no search, no witness, no existential. That is the
      whole reason preimages are better behaved than images, and it will be
      cashed in repeatedly.

      Compute one. Let $f : \{1,2,3,4,5,6\} \to \{0,1,2\}$ send $n$ to the
      remainder of $n$ on division by $3$, so the values are
      $1, 2, 0, 1, 2, 0$. Then $f^{-1}(\{0,1\})$ collects the inputs whose
      value is $0$ or $1$: those are $1, 3, 4, 6$, so $f^{-1}(\{0,1\}) =
      \{1,3,4,6\}$. The preimage of a single point is called a fiber, written
      $f^{-1}(\{b\})$; here the fiber over $2$ is $\{2,5\}$. A fiber can be
      empty — if $g : \{1,2,3\} \to \{a,b,c\}$ takes the values $a, a, b$, then
      $g^{-1}(\{c\}) = \emptyset$, and nothing has gone wrong.

      Now the notation. In $f^{-1}(T)$ the string $f^{-1}$ is a single symbol,
      not a function being applied. It is defined for every function
      whatsoever, and writing it asserts nothing about $f$ being reversible.
      Two consequences fall out immediately: $f^{-1}(B) = A$, since every
      input's value lies somewhere in $B$; and $f^{-1}(\emptyset) = \emptyset$,
      since no value lands in nothing. Preimages are monotone as well — if
      $T \subseteq T'$ then $f^{-1}(T) \subseteq f^{-1}(T')$, because
      $f(a) \in T$ already puts $f(a)$ in $T'$.
    worked: >
      Let $f : \{-3,-2,-1,0,1,2,3\} \to \mathbb{Z}$ be $f(a) = a^2$, with
      values $9, 4, 1, 0, 1, 4, 9$. Take $T = \{0,1,2,3,4\}$. Test each input
      in turn: $f(-3) = 9 \notin T$, discard; $f(-2) = 4 \in T$, keep;
      $f(-1) = 1 \in T$, keep; $f(0) = 0 \in T$, keep; $f(1) = 1$, keep;
      $f(2) = 4$, keep; $f(3) = 9$, discard. So
      $f^{-1}(T) = \{-2,-1,0,1,2\}$, five elements. Two details are worth
      naming. The fiber over $4$ is $f^{-1}(\{4\}) = \{-2,2\}$, which has two
      elements, so a preimage can be bigger than the set you started with. And
      $2 \in T$ contributed nothing at all, since $f^{-1}(\{2\}) = \emptyset$;
      unused elements of $T$ are simply ignored.
    pitfalls: >
      Reading $f^{-1}(T)$ as "the inverse function evaluated at $T$" is the
      trap the notation sets, and it is wrong twice over: no inverse need
      exist, and even the input is a set rather than a point. Write the braces
      in $f^{-1}(\{b\})$ — the fiber over a point is a subset of $A$, not an
      element of it. And an empty fiber is not an error; it just says that
      value is never taken.
    recap: >
      The preimage $f^{-1}(T)$ is the set of inputs whose value lands in $T$,
      it is defined for every function, and $f^{-1}$ here is one symbol rather
      than a function applied to $T$.
    steps:
      - teach: >
          Images move subsets forward along $f$. Nothing stops you from working
          in the other direction: name a subset of the codomain and ask which
          inputs land inside it.
      - teach: >
          For $T \subseteq B$, the preimage is $f^{-1}(T) = \{a \in A : f(a)
          \in T\}$. Test the inputs one at a time: compute $f(a)$, ask whether
          it lies in $T$, keep it or drop it. No search is involved, because
          each $a$ has exactly one value to look at.
      - teach: >
          Try it. Let $f : \{1,2,3,4,5,6\} \to \{0,1,2\}$ send $n$ to the
          remainder of $n$ on division by $3$, so the values run
          $1, 2, 0, 1, 2, 0$. Then $f^{-1}(\{0,1\}) = \{1,3,4,6\}$ — the four
          inputs whose value is $0$ or $1$.
      - ask: >
          For that same $f$, how many elements does the fiber $f^{-1}(\{2\})$
          have?
        expects: "2"
        hint: >
          Which of $1,2,3,4,5,6$ leave remainder $2$ on division by $3$?
        feedback: >
          Two. Only $f(2) = 2$ and $f(5) = 2$, so $f^{-1}(\{2\}) = \{2,5\}$.
          The preimage of a one-element set need not have one element — it can
          have any number, including none.
      - teach: >
          The preimage of a single point is called the fiber over that point.
          Fibers can be empty, can be huge, and every input lies in exactly one
          of them. Two easy consequences: $f^{-1}(B) = A$, since every value
          lands somewhere in $B$, and $f^{-1}(\emptyset) = \emptyset$.
      - ask: >
          You compute $f^{-1}(\{5\}) = \emptyset$ for some function $f$. What
          have you learned?
        choices:
          - text: >
              $f$ is not a function, since $5$ has no input assigned to it.
            feedback: >
              Totality is a condition on the *domain*, not the codomain. No
              element of $B$ is under any obligation to be hit.
          - text: >
              $5$ is not in the range of $f$ — it lies in the codomain and is
              never taken as a value.
            correct: true
            feedback: >
              Exactly. An empty fiber over $b$ is precisely the statement
              $b \notin \operatorname{ran} f$, and it is completely ordinary.
          - text: >
              The notation was illegal, because $f$ has no inverse.
            feedback: >
              The notation is legal for every function. $f^{-1}$ applied to a
              set is one symbol, and it asserts nothing whatever about $f$.
        feedback: >
          An empty fiber says one thing and nothing more: that value is not in
          the range. Empty fibers over some points are the normal state of
          affairs.
      - ask: >
          For which functions $f : A \to B$ is the expression $f^{-1}(T)$
          defined?
        choices:
          - text: >
              Only for $f$ that can be reversed.
            feedback: >
              This is the trap the notation sets. Preimages need no reversal —
              you are testing each input's single value for membership in $T$,
              which any function lets you do.
          - text: >
              Only for $f$ that never sends two inputs to the same place.
            feedback: >
              No collision condition is needed either. Colliding inputs simply
              land in the same fiber together, which is what fibers are for.
          - text: >
              For every function whatsoever.
            correct: true
            feedback: >
              Right. The definition uses nothing but "compute $f(a)$ and ask
              whether it is in $T$", and every function supports that at every
              point of its domain.
        feedback: >
          Every function has preimages. When $f$ does happen to be reversible
          the two readings of $f^{-1}$ agree, which is the only reason the
          clash of notation is tolerated.
      - teach: >
          Hold the contrast: an image asks "is there an input over here that
          lands on $b$?" and a preimage asks "does this input's value lie in
          $T$?" A search versus a lookup — the difference will show up as real
          mathematics shortly.

  - node: foundations.functions.def-injective
    hook: >
      An injective function loses no information: the output tells you which
      input produced it. That is the property that makes undoing a function
      conceivable, and proving it is a two-line ritual worth learning cold.
    explanation: >
      A function is allowed to send two inputs to the same place — the
      definition never forbade collisions. Injectivity is exactly the demand
      that no collision happens: for all $a_1, a_2 \in A$, $f(a_1) = f(a_2)$
      forces $a_1 = a_2$. The equivalent phrasing $a_1 \ne a_2 \Rightarrow
      f(a_1) \ne f(a_2)$ is its contrapositive and says the same thing, but the
      first is the one to use in proofs: it hands you an equation to work with
      instead of asking you to establish a negation.

      In the grid picture the two conditions line up beautifully. Being a
      function is a condition on rows — exactly one chosen cell in each.
      Injectivity is a condition on columns — at most one chosen cell in each.
      Take $A = \{1,2,3\}$ and $B = \{a,b,c,d\}$ with $f(1) = b$, $f(2) = d$,
      $f(3) = a$: the three occupied columns are distinct, so $f$ is injective,
      and column $c$ standing empty is nobody's business. Change $f(3)$ to $d$
      and column $d$ now holds two cells; the pair $2 \ne 3$ with
      $f(2) = f(3)$ is a witness that injectivity has failed.

      Injectivity is a fact about the domain and the rule, and the codomain has
      no say in it — enlarging or shrinking $B$ cannot create or destroy a
      collision between two elements of $A$. Shrinking the *domain* very much
      can. The rule $x \mapsto x^2$ is not injective on $\mathbb{R}$, since
      $f(-1) = f(1) = 1$ while $-1 \ne 1$; on $[0,\infty)$ it is, because
      $a_1^2 = a_2^2$ with both numbers non-negative forces $a_1 = a_2$. Same
      rule, different domain, opposite verdict.

      So the two jobs have fixed shapes. To prove injectivity: assume
      $f(a_1) = f(a_2)$, and manipulate until $a_1 = a_2$ drops out. To
      disprove it: produce one honest pair of different inputs with the same
      value.
    worked: >
      Take $f : \mathbb{R} \to \mathbb{R}$ with $f(x) = 3x - 7$. Suppose
      $f(a_1) = f(a_2)$, that is $3a_1 - 7 = 3a_2 - 7$. Add $7$ to both sides
      to get $3a_1 = 3a_2$, divide by $3$, and $a_1 = a_2$. Every step was
      reversible arithmetic, so $f$ is injective. Now take
      $g : \mathbb{R} \to \mathbb{R}$ with $g(x) = x^3 - x$. One pair settles
      it: $g(0) = 0$ and $g(1) = 1 - 1 = 0$, and $0 \ne 1$, so $g$ is not
      injective. Notice the asymmetry of effort — the proof had to cover every
      pair, the disproof needed exactly one.
    pitfalls: >
      "One output per input" is not injectivity; it is the definition of a
      function, which you already have. Injectivity is one *input* per output.
      Starting a proof from $a_1 = a_2$ and deducing $f(a_1) = f(a_2)$ proves
      nothing whatever, since it is true of every function ever written down —
      the assumption has to be the equation between the outputs. And since
      injectivity depends on the domain, a function that fails can often be
      rescued by restricting it rather than abandoned.
    recap: >
      Injective means no two distinct inputs share a value, proved by assuming
      $f(a_1) = f(a_2)$ and deriving $a_1 = a_2$.
    steps:
      - teach: >
          Nothing in the definition of a function forbids collisions: a
          constant function on a million-element set is entirely legal.
          Injectivity is the demand that collisions never happen, which is what
          lets an output identify its input.
      - teach: >
          Formally: for all $a_1, a_2$ in the domain, $f(a_1) = f(a_2)$ implies
          $a_1 = a_2$. Its contrapositive, $a_1 \ne a_2$ implies $f(a_1) \ne
          f(a_2)$, says the same thing and is worse to work with, since it asks
          you to prove two things are different.
      - teach: >
          The grid says it best. Being a function means every *row* holds
          exactly one chosen cell. Being injective means every *column* holds
          at most one. Empty columns are fine — injectivity says nothing about
          values that are never taken.
      - ask: >
          How should a proof that $f$ is injective begin?
        choices:
          - text: >
              Assume $a_1 = a_2$ and deduce that $f(a_1) = f(a_2)$.
            feedback: >
              This is true for every function that has ever been defined —
              equal inputs have equal values because $f$ is single-valued. It
              proves nothing about $f$ in particular.
          - text: >
              Assume $f(a_1) = f(a_2)$ and deduce that $a_1 = a_2$.
            correct: true
            feedback: >
              Yes. You are handed an equation between outputs and asked to
              extract an equation between inputs, which is usually a matter of
              undoing arithmetic step by step.
          - text: >
              Test $f$ on several pairs of inputs and check that none of them
              collide.
            feedback: >
              Sampling can only disprove injectivity. The claim quantifies over
              all pairs, so finitely many successful tests leave the statement
              untouched.
        feedback: >
          Start from the outputs being equal and drive toward the inputs being
          equal. That direction is the whole content; the other direction is
          free.
      - teach: >
          To disprove injectivity you need one pair and no more. For
          $g : \mathbb{R} \to \mathbb{R}$ with $g(x) = x^{3} - x$, the values
          $g(0) = 0$ and $g(1) = 0$ with $0 \ne 1$ finish the job in a line.
      - ask: >
          How many injective functions are there from a $2$-element set to a
          $4$-element set?
        expects: "12"
        hint: >
          Send the first input anywhere, then count what remains available for
          the second.
        feedback: >
          Twelve. The first input has $4$ possible values; the second may take
          any value except the one already used, leaving $3$. So
          $4 \times 3 = 12$, against $4^{2} = 16$ functions in total — the four
          excluded ones are the constants.
      - ask: >
          The rule $x \mapsto x^{2}$ is not injective on $\mathbb{R}$. Which
          change repairs that?
        choices:
          - text: >
              Shrink the codomain from $\mathbb{R}$ to $[0,\infty)$.
            feedback: >
              The codomain has no effect on collisions. After the change,
              $-1$ and $1$ still both map to $1$, and the function is still not
              injective.
          - text: >
              Shrink the domain from $\mathbb{R}$ to $[0,\infty)$.
            correct: true
            feedback: >
              Right. The colliding pairs were $a$ and $-a$; removing the
              negatives removes every collision, and $a_1^{2} = a_2^{2}$ with
              both non-negative gives $a_1 = a_2$.
          - text: >
              Neither — injectivity is a property of the rule $x \mapsto x^{2}$
              alone.
            feedback: >
              A rule is not a function. Injectivity is a property of the
              domain together with the rule, which is exactly why restricting
              the domain can change the verdict.
        feedback: >
          Cut the domain, not the codomain. Injectivity is decided entirely by
          which inputs are available to collide.
      - teach: >
          Injectivity is the half of reversibility that says no information was
          destroyed. Keep the ritual: outputs equal, therefore inputs equal —
          or one explicit colliding pair, and you are done.

  - node: foundations.functions.def-surjective
    hook: >
      Surjectivity is the one property in this unit that can be switched on or
      off without moving a single value, purely by rewriting the declaration —
      and it is half of what an inverse needs.
    explanation: >
      You know that $\operatorname{ran} f \subseteq B$ always. Surjectivity is
      the demand that the reverse inclusion holds too, so that
      $\operatorname{ran} f = B$: nothing in the codomain is left unused.
      Spelled out with quantifiers, for every $b \in B$ there exists $a \in A$
      with $f(a) = b$.

      That quantifier shape dictates both proofs. To prove surjectivity you
      take an arbitrary $b$ — not a convenient one — and *produce* a witness
      $a$, typically by solving $f(a) = b$ for $a$ and then checking your
      solution actually lies in the declared domain. To disprove it you name
      one $b$ that nothing reaches. In the grid picture: injectivity said every
      column holds at most one chosen cell, and surjectivity says every column
      holds at least one.

      Because the condition is about $B$, the declaration decides it. The rule
      $x \mapsto x^2$ as a map $\mathbb{R} \to \mathbb{R}$ is not surjective:
      the element $-1$ has nothing above it, since squares are never negative.
      The very same rule as a map $\mathbb{R} \to [0,\infty)$ is surjective,
      because an arbitrary $b \ge 0$ is reached by $a = \sqrt{b}$. No value
      moved; the promise changed. Shrinking any codomain down to the range
      makes a function surjective for free, which is why surjectivity is
      genuinely a claim about the triple and not about the rule.
    worked: >
      Take $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = 2n$. Is it surjective?
      Solve $2n = b$: the only candidate is $n = b/2$, and for $b = 1$ that is
      not an integer, so it is not in the domain. The fiber over $1$ is empty
      and $f$ is not surjective — one bad $b$ is the entire disproof. Now take
      $g : \mathbb{Z} \to \mathbb{Z}$ with $g(n) = n + 5$. Let $b \in
      \mathbb{Z}$ be arbitrary and set $a = b - 5$, which is an integer and so
      does lie in the domain. Then $g(a) = (b-5) + 5 = b$. Every $b$ has a
      witness, so $g$ is surjective.
    pitfalls: >
      The witness has to live in the declared domain: solving $f(a) = b$ and
      finding $a = b/2$ settles nothing until you check that $b/2$ is available
      to you. Saying "every element of the range is hit" is a tautology, not a
      proof — the claim is about the codomain. And picking a convenient $b$
      proves only that one $b$ is reached; the argument must survive an
      arbitrary $b$.
    recap: >
      Surjective means the range fills the codomain — every $b$ has at least
      one input above it, and shrinking the codomain to the range always makes
      it so.
    steps:
      - teach: >
          The range sits inside the codomain and is usually smaller. Some
          functions leave no gap at all, and that is the property this step
          names: nothing in $B$ goes unused.
      - teach: >
          Two equivalent phrasings. Set form: $\operatorname{ran} f = B$.
          Quantifier form: for every $b \in B$ there exists $a \in A$ with
          $f(a) = b$. The second is the one you argue with, since it tells you
          what to produce.
      - teach: >
          So a proof takes an arbitrary $b$ and builds a witness, usually by
          solving $f(a) = b$ and confirming the solution lies in the domain. A
          disproof names a single $b$ with an empty fiber.
      - ask: >
          How many surjective functions are there from $\{1,2,3\}$ onto
          $\{a,b\}$?
        expects: "6"
        hint: >
          Count all functions first, then throw out the ones that miss a value.
        feedback: >
          Six. There are $2^{3} = 8$ functions $\{1,2,3\} \to \{a,b\}$
          altogether, and exactly two of them fail: the constant map to $a$,
          which misses $b$, and the constant map to $b$, which misses $a$.
          That leaves $8 - 2 = 6$.
      - teach: >
          The grid puts the two properties side by side. Injectivity: every
          column holds at most one chosen cell. Surjectivity: every column
          holds at least one. Rows were settled the moment $f$ was a function.
      - ask: >
          Is $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = 2n$ surjective?
        choices:
          - text: >
              Yes — every even integer is $f(n)$ for some $n$.
            feedback: >
              True and beside the point. That says the range is the even
              integers; surjectivity asks whether the range is all of
              $\mathbb{Z}$, and the odd numbers are missing.
          - text: >
              No — solving $2n = 1$ gives $n = 1/2$, which is not in the
              domain, so the fiber over $1$ is empty.
            correct: true
            feedback: >
              Exactly the right disproof: one explicit $b$, and the reason the
              candidate witness is unavailable. The domain is $\mathbb{Z}$, and
              $1/2$ does not live there.
          - text: >
              No — $f$ sends two different integers to the same value.
            feedback: >
              That would be a failure of injectivity, and it is not even true
              here: $2n_1 = 2n_2$ gives $n_1 = n_2$, so this $f$ is injective.
        feedback: >
          Not surjective, and the odd numbers are the reason. Doubling reaches
          exactly the evens, so the range is a proper part of the declared
          codomain.
      - ask: >
          The rule $x \mapsto x^{2}$ is not surjective as a map $\mathbb{R} \to
          \mathbb{R}$. Which change repairs that?
        choices:
          - text: >
              Shrink the domain from $\mathbb{R}$ to $[0,\infty)$.
            feedback: >
              That fixes collisions, not coverage. Negative numbers are still
              in the codomain and are still never produced, so the function
              remains non-surjective.
          - text: >
              Shrink the codomain from $\mathbb{R}$ to $[0,\infty)$.
            correct: true
            feedback: >
              Right. Every $b \ge 0$ is reached by $a = \sqrt{b}$, so the range
              now fills the codomain exactly. Not one value of the function
              changed.
          - text: >
              Neither — surjectivity is a property of the rule $x \mapsto
              x^{2}$ alone.
            feedback: >
              It is the property that depends most on the declaration. The same
              rule is surjective or not according to which codomain you wrote
              down.
        feedback: >
          Cut the codomain, not the domain — the mirror image of what repaired
          injectivity. Coverage is decided by which values you promised to
          reach.
      - teach: >
          Injectivity looks at the domain, surjectivity at the codomain, and
          the two failures are repaired by opposite surgeries. Holding that
          symmetry in mind stops the two words from blurring together.

  - node: foundations.functions.def-bijective
    hook: >
      A bijection is what it means for two sets to be matched element for
      element, and it is precisely the condition under which a function can be
      run backwards.
    explanation: >
      Put the two conditions together. Injectivity says every $b$ has at most
      one input above it; surjectivity says every $b$ has at least one. A
      function with both has, for every $b \in B$, exactly one $a \in A$ with
      $f(a) = b$ — which is to say every fiber $f^{-1}(\{b\})$ is a
      single point. That is a perfect pairing of $A$ with $B$: nothing doubled
      up, nothing left over, on either side.

      The grid picture becomes very clean. Being a function puts exactly one
      chosen cell in every row. Bijectivity adds exactly one in every column.
      Read the graph left to right and you have a function $A \to B$; read it
      top to bottom and you have a rule taking each $b$ to its unique source.

      Neither half implies the other, and small examples show it. The map
      $n \mapsto 2n$ on $\mathbb{Z}$ is injective — doubling never collides —
      and misses every odd number, so it is not surjective. The map
      $\{1,2,3\} \to \{a,b\}$ sending $1 \mapsto a$, $2 \mapsto b$,
      $3 \mapsto b$ hits both values, so it is surjective, and it collides at
      $2$ and $3$, so it is not injective. Two separate conditions, two
      separate arguments.

      Which is exactly how you prove a function bijective: run the injectivity
      ritual, then run the surjectivity ritual, and do not let one substitute
      for the other. Both proofs also depend on the declaration, so a bijection
      is a statement about the whole triple — change the codomain and you may
      lose surjectivity, change the domain and you may lose injectivity.
    worked: >
      Take $f : \mathbb{R} \to \mathbb{R}$ with $f(x) = 5 - 2x$. Injectivity:
      suppose $5 - 2a_1 = 5 - 2a_2$; subtract $5$ to get $-2a_1 = -2a_2$, then
      divide by $-2$ to get $a_1 = a_2$. Surjectivity: let $b \in \mathbb{R}$
      be arbitrary and set $a = (5 - b)/2$, a real number, so it lies in the
      domain. Then $f(a) = 5 - 2 \cdot (5-b)/2 = 5 - (5 - b) = b$. Both halves
      hold, so $f$ is a bijection, and the pairing it sets up sends each $b$
      back to the single point $(5-b)/2$ — for instance the fiber over $1$ is
      exactly $\{2\}$.
    pitfalls: >
      Proving one half and calling the job done is the standard gap, and the
      two halves genuinely are independent: doubling on $\mathbb{Z}$ has the
      first and not the second. A bijection depends on both declared sets, so
      "is $x \mapsto x^{2}$ a bijection?" is not a question until the domain
      and codomain are named. And a single fiber with two points, or a single
      empty fiber, is enough to kill it.
    recap: >
      A bijection is injective and surjective at once — exactly one input above
      every output, so the two sets are matched element for element.
    steps:
      - teach: >
          Injectivity said at most one input per output; surjectivity said at
          least one. A function with both properties has exactly one input per
          output, and that phrase is the definition of a bijection.
      - teach: >
          Said with fibers: $f$ is a bijection exactly when every fiber
          $f^{-1}(\{b\})$ is a single point — no fiber empty, no fiber with two
          elements. The grid version is exactly one chosen cell in every row
          and in every column.
      - teach: >
          The two halves are independent. On $\mathbb{Z}$, $n \mapsto 2n$ is
          injective and misses the odd numbers. From $\{1,2,3\}$ to $\{a,b\}$,
          sending $1 \mapsto a$ and $2, 3 \mapsto b$ is surjective and collides
          at $2$ and $3$.
      - ask: >
          Which of these functions $\{1,2,3\} \to \{a,b,c\}$ is a bijection?
        choices:
          - text: >
              $1 \mapsto a$, $2 \mapsto a$, $3 \mapsto c$
            feedback: >
              Two cells in column $a$ and none in column $b$: it fails both
              halves at once. The fiber over $a$ has two points and the fiber
              over $b$ is empty.
          - text: >
              $1 \mapsto c$, $2 \mapsto a$, $3 \mapsto b$
            correct: true
            feedback: >
              The three values $c, a, b$ are distinct, so no collisions, and
              between them they exhaust $\{a,b,c\}$, so nothing is missed. Each
              fiber is a single point.
          - text: >
              $1 \mapsto b$, $2 \mapsto c$, $3 \mapsto c$
            feedback: >
              Injectivity fails at $2$ and $3$, and $a$ is never taken, so
              surjectivity fails too. Reading the list of values for repeats and
              for gaps decides both questions at once.
        feedback: >
          On finite sets you can read both halves off the list of values: no
          repeats means injective, no gaps means surjective, and the second
          option is the only one with neither.
      - teach: >
          So proving bijectivity is two proofs, not one. Assume equal outputs
          and derive equal inputs; then take an arbitrary $b$ and build a
          witness. Neither argument does the other's work.
      - ask: >
          How many bijections are there from a $4$-element set to itself?
        expects: "24"
        hint: >
          Fill the values one input at a time, and remember that each value may
          be used only once.
        feedback: >
          Twenty-four. The first input has $4$ available values, the second $3$,
          the third $2$ and the last $1$, giving $4 \times 3 \times 2 \times 1 =
          24$. Every such assignment is automatically onto, since four distinct
          values in a four-element codomain leave no gap.
      - ask: >
          A function $f : A \to B$ has one fiber with two elements and every
          other fiber a single point. What can you say?
        choices:
          - text: >
              $f$ is surjective but not injective.
            correct: true
            feedback: >
              Every fiber is nonempty, which is surjectivity; the fiber with
              two elements is a collision, which kills injectivity. One bad
              fiber is enough.
          - text: >
              $f$ is injective but not surjective.
            feedback: >
              Backwards. A fiber with two elements is two inputs sharing a
              value, and that is precisely the failure of injectivity. Empty
              fibers, not doubled ones, are what break surjectivity.
          - text: >
              $f$ is a bijection, since almost every fiber is a single point.
            feedback: >
              Bijectivity asks for *every* fiber to be a single point. One
              exception is a counterexample, not a rounding error.
        feedback: >
          Nonempty fibers give surjectivity; fibers of size at most one give
          injectivity. Here the first holds and the second does not.
      - teach: >
          A bijection is the exact bookkeeping behind "these two sets pair up".
          Everything about reversing functions, later in this unit, is a
          statement about this condition wearing different clothes.

  - node: foundations.functions.image-set-ops
    hook: >
      The first thing to ask of a new operation is whether it respects the ones
      you already have. Images respect unions perfectly and intersections
      badly, and the failure is the generic case rather than an edge case.
    explanation: >
      Start with the good news. For $S, S' \subseteq A$ we have $f(S \cup S') =
      f(S) \cup f(S')$, and the proof is the existential quantifier splitting
      along an "or": $b \in f(S \cup S')$ says some $s$ in $S \cup S'$ has
      $f(s) = b$, which says that either some $s$ in $S$ works or some $s$ in
      $S'$ does, which is exactly $b \in f(S) \cup f(S')$. Nothing was assumed
      about $f$.

      Intersections break, and only in one direction. Since $S \cap S'
      \subseteq S$ and $S \cap S' \subseteq S'$, monotonicity gives $f(S \cap
      S') \subseteq f(S) \cap f(S')$ for free. The reverse would require: if
      some point of $S$ maps to $b$ and some point of $S'$ maps to $b$, then
      some *single* point lying in both maps to $b$. There is no reason for the
      two witnesses to be the same point. Let $f : \{1,2,3,4\} \to \{0,1\}$
      send $n$ to the remainder of $n$ on division by $2$, and take
      $S = \{1,2\}$ and $S' = \{3,4\}$. Then $S \cap S' = \emptyset$, so the
      left side is empty, while $f(S) = f(S') = \{0,1\}$ and the right side is
      all of $\{0,1\}$ — as strict as a failure can get.

      Differences fail too, and in the opposite-looking direction: only
      $f(S) \setminus f(S') \subseteq f(S \setminus S')$ holds. With the same
      $f$, take $S = \{1,2,3\}$ and $S' = \{3\}$: the left side is
      $\{0,1\} \setminus \{1\} = \{0\}$ while $f(S \setminus S') = f(\{1,2\}) =
      \{0,1\}$.

      Injectivity repairs the intersection, and the repair shows exactly where
      the leak was. Suppose $f$ is injective and $b \in f(S) \cap f(S')$. Then
      $f(s) = b$ for some $s \in S$ and $f(s') = b$ for some $s' \in S'$, so
      $f(s) = f(s')$, so $s = s'$ — and that one point lies in $S \cap S'$,
      putting $b$ in $f(S \cap S')$. Injectivity is precisely what forces the
      two witnesses to coincide.
    worked: >
      Let $f : \{1,2,3,4,5,6\} \to \{0,1,2\}$ send $n$ to the remainder of $n$
      on division by $3$, so the values are $1, 2, 0, 1, 2, 0$. Take
      $S = \{1,2,3\}$ and $S' = \{4,5\}$. Union: $S \cup S' = \{1,2,3,4,5\}$
      with image $\{1,2,0\}$, while $f(S) = \{1,2,0\}$ and $f(S') = \{1,2\}$
      have union $\{0,1,2\}$ — equal, as promised. Intersection: $S \cap S' =
      \emptyset$ so $f(S \cap S') = \emptyset$, while $f(S) \cap f(S') =
      \{1,2\}$. The inclusion holds and two elements were lost, because $1$ and
      $4$ are different points carrying the same value, and so are $2$ and $5$.
    pitfalls: >
      Assuming the intersection identity is the standard error, and it is
      invisible until a proof quietly needs the reverse inclusion. The
      difference inclusion runs the other way round from the intersection one —
      $f(S) \setminus f(S') \subseteq f(S \setminus S')$, with the plain image
      on the *right* — so memorising "images lose elements" without the
      direction will mislead you. And the repair is a hypothesis on $f$, not on
      $S$: no cleverness about the particular subsets substitutes for
      injectivity.
    recap: >
      Images commute with unions always, sit inside $f(S) \cap f(S')$ for
      intersections with equality exactly when $f$ is injective, and satisfy
      only a one-way inclusion for differences.
    steps:
      - teach: >
          A new operation earns its keep by getting along with the old ones. So
          push a union through an image, then an intersection, and see which
          survives.
      - teach: >
          Unions survive intact: $f(S \cup S') = f(S) \cup f(S')$. The reason
          is the existential quantifier inside membership — "some point of
          $S \cup S'$ maps to $b$" is literally "some point of $S$ does, or
          some point of $S'$ does".
      - teach: >
          Intersections give only $f(S \cap S') \subseteq f(S) \cap f(S')$,
          which follows from monotonicity. The reverse would need the witness in
          $S$ and the witness in $S'$ to be the *same* point, and nothing so far
          forces that.
      - ask: >
          Let $f : \{1,2,3,4\} \to \{0,1\}$ send $n$ to the remainder of $n$ on
          division by $2$, and take $S = \{1,2\}$, $S' = \{3,4\}$. How many
          elements does $f(S) \cap f(S')$ have?
        expects: "2"
        hint: >
          Compute $f(S)$ and $f(S')$ separately before intersecting anything.
        feedback: >
          Two. $f(S) = \{f(1), f(2)\} = \{1,0\}$ and $f(S') = \{f(3), f(4)\} =
          \{1,0\}$, so the intersection is all of $\{0,1\}$ — while $S \cap S'$
          is empty and $f(S \cap S') = \emptyset$. The inclusion is as strict as
          it could possibly be.
      - teach: >
          Injectivity repairs it, and the proof shows why. If $b \in f(S) \cap
          f(S')$ then $f(s) = b = f(s')$ for some $s \in S$ and $s' \in S'$;
          injectivity turns that into $s = s'$, and that single point lies in
          $S \cap S'$. The leak was two witnesses where one was needed.
      - ask: >
          Which statement holds for every function $f$ and all subsets
          $S, S'$ of its domain?
        choices:
          - text: >
              $f(S \cap S') = f(S) \cap f(S')$
            feedback: >
              This is the identity that fails. It holds for all $S, S'$ exactly
              when $f$ is injective, and injectivity was not assumed here.
          - text: >
              $f(S \cap S') \subseteq f(S) \cap f(S')$
            correct: true
            feedback: >
              Yes, and it is free: $S \cap S'$ sits inside each of $S$ and
              $S'$, so its image sits inside each image by monotonicity.
          - text: >
              $f(S) \cap f(S') \subseteq f(S \cap S')$
            feedback: >
              The wrong direction — this is the half that fails. Two different
              points, one in each set, can carry the same value and put it in
              the right side of your inclusion with nothing in $S \cap S'$ to
              justify it.
        feedback: >
          Only the inclusion $f(S \cap S') \subseteq f(S) \cap f(S')$ is
          automatic. Upgrading it to equality is exactly the hypothesis that
          $f$ is injective.
      - ask: >
          Which inclusion holds in general for set differences?
        choices:
          - text: >
              $f(S \setminus S') \subseteq f(S) \setminus f(S')$
            feedback: >
              This one fails. With the parity map on $\{1,2,3\}$ and
              $S' = \{3\}$, the left side is $\{0,1\}$ and the right side is
              $\{0\}$ — a value can be dropped from the right by a witness
              sitting in $S'$.
          - text: >
              $f(S) \setminus f(S') \subseteq f(S \setminus S')$
            correct: true
            feedback: >
              Correct. If $b$ is an image of some $s \in S$ and no point of
              $S'$ maps to $b$, then in particular that $s$ is not in $S'$, so
              $s \in S \setminus S'$ and $b$ is in the right side.
          - text: >
              Equality always holds, since differences are built from unions.
            feedback: >
              Differences are not built from unions, and the union identity
              does not propagate. Complementation is where images behave worst.
        feedback: >
          The plain image sits on the right for differences and on the left for
          intersections. Remember the direction by the proof, not by a slogan.
      - teach: >
          One operation is safe and two are not, and injectivity is the single
          hypothesis that fixes the intersection. Every failure traced back to
          the same source: two witnesses where the argument needed one.

  - node: foundations.functions.preimage-set-ops
    hook: >
      This is where the extra care over the definition of a preimage pays off:
      every set operation passes through it untouched, with no hypothesis on
      $f$ at all. It is why topology and measure theory are written in
      preimages.
    explanation: >
      Four identities, and there is nothing to remember beyond "all of them".
      For $T, T' \subseteq B$: $f^{-1}(T \cup T') = f^{-1}(T) \cup f^{-1}(T')$,
      $f^{-1}(T \cap T') = f^{-1}(T) \cap f^{-1}(T')$,
      $f^{-1}(B \setminus T) = A \setminus f^{-1}(T)$, and
      $f^{-1}(T \setminus T') = f^{-1}(T) \setminus f^{-1}(T')$. No injectivity,
      no surjectivity, no conditions of any kind.

      One proof does all four, because each is a chain of definition
      unfoldings about the single element $f(a)$. Take the intersection:
      $a \in f^{-1}(T \cap T')$ means $f(a) \in T \cap T'$, which means
      $f(a) \in T$ and $f(a) \in T'$, which means $a \in f^{-1}(T)$ and
      $a \in f^{-1}(T')$, which is $a \in f^{-1}(T) \cap f^{-1}(T')$. Every
      step is reversible, so the two sets have the same elements.

      The complement case is the one worth watching, because it is where images
      fail hardest. Since $a$ has exactly one value, $f(a) \in B \setminus T$
      says $f(a) \notin T$, which says $a \notin f^{-1}(T)$, which says
      $a \in A \setminus f^{-1}(T)$. Totality and single-valuedness are doing
      quiet work here: the step turns on there being one value of $f(a)$ to
      test, so that "not in $T$" is unambiguous.

      Compare with images for a moment. There the membership test was "some
      point of $S$ maps to $b$", and an existential distributes over "or" but
      not over "and" or over negation, so unions survived and intersections and
      complements did not. Here the test is a lookup on a single element, and
      lookups respect every Boolean operation. The same argument extends to a
      union of any family of subsets, and to an intersection of any nonempty
      one.
    worked: >
      Let $f : \{1,2,3,4,5,6,7,8\} \to \{0,1,2\}$ send $n$ to the remainder of
      $n$ on division by $3$, so the values are $1,2,0,1,2,0,1,2$. Take
      $T = \{0,1\}$ and $T' = \{1,2\}$. First the two preimages:
      $f^{-1}(T) = \{1,3,4,6,7\}$ and $f^{-1}(T') = \{1,2,4,5,7,8\}$. Now the
      intersection identity. $T \cap T' = \{1\}$, and the inputs with value $1$
      are $1, 4, 7$, so the left side is $\{1,4,7\}$; intersecting the two
      preimages gives $\{1,4,7\}$ as well. Now the complement identity.
      $B \setminus T = \{2\}$, whose preimage is $\{2,5,8\}$, and
      $A \setminus f^{-1}(T) = \{1,\dots,8\} \setminus \{1,3,4,6,7\} =
      \{2,5,8\}$. Both identities check out on the nose.
    pitfalls: >
      The two complements live in different sets: $B \setminus T$ on the inside
      and $A \setminus f^{-1}(T)$ on the outside. Writing $A \setminus T$
      anywhere in that identity is not a slip but nonsense, since $T$ is not a
      subset of $A$. Carrying the image asymmetry over here is the other error
      — nothing needs injectivity, and looking for a hypothesis wastes a proof.
      For arbitrary families the intersection identity needs the family to be
      nonempty, exactly as it does for sets.
    recap: >
      Preimages commute with unions, intersections, complements and differences
      with no hypothesis whatsoever, because membership is a test on the single
      value $f(a)$.
    steps:
      - teach: >
          Images survived one set operation out of three, and needed a
          hypothesis to survive a second. Preimages survive all of them, with
          nothing assumed about $f$ at all.
      - teach: >
          The list: $f^{-1}(T \cup T') = f^{-1}(T) \cup f^{-1}(T')$,
          $f^{-1}(T \cap T') = f^{-1}(T) \cap f^{-1}(T')$,
          $f^{-1}(B \setminus T) = A \setminus f^{-1}(T)$, and
          $f^{-1}(T \setminus T') = f^{-1}(T) \setminus f^{-1}(T')$.
      - teach: >
          One argument proves them all. For the intersection: $a \in f^{-1}(T
          \cap T')$ means $f(a) \in T$ and $f(a) \in T'$, which means $a \in
          f^{-1}(T)$ and $a \in f^{-1}(T')$. Each step is a definition being
          unfolded, and each is reversible.
      - ask: >
          Let $f : \{1,\dots,8\} \to \{0,1,2,3\}$ send $n$ to the remainder of
          $n$ on division by $4$, so the values are $1,2,3,0,1,2,3,0$. With
          $T = \{0,1\}$ and $T' = \{1,2\}$, how many elements does
          $f^{-1}(T) \cap f^{-1}(T')$ have?
        expects: "2"
        hint: >
          The identity lets you compute $T \cap T'$ first and take one preimage
          instead of two.
        feedback: >
          Two. Use the identity: $T \cap T' = \{1\}$, and the inputs with value
          $1$ are $1$ and $5$, so the answer is $\{1,5\}$. The long route
          agrees — $f^{-1}(T) = \{1,4,5,8\}$ and $f^{-1}(T') = \{1,2,5,6\}$
          meet in $\{1,5\}$.
      - teach: >
          The complement case is where the contrast with images is sharpest.
          Since $a$ has exactly one value, "$f(a)$ is not in $T$" and "$a$ is
          not in $f^{-1}(T)$" are the same statement, and that is the whole
          proof.
      - ask: >
          Which hypothesis on $f$ do these four identities require?
        choices:
          - text: >
              Injectivity, for the intersection identity.
            feedback: >
              That is what images needed, and the reflex is understandable.
              Preimages never search for a witness, so there is nothing for
              injectivity to repair.
          - text: >
              Surjectivity, for the complement identity.
            feedback: >
              Unhit points of $B$ cause no trouble: they simply contribute
              nothing to either side. The identity holds with empty fibers
              everywhere.
          - text: >
              None — they hold for every function.
            correct: true
            feedback: >
              Right. Every proof unfolds membership into a statement about the
              one value $f(a)$, and that move is available for any function
              whatsoever.
        feedback: >
          No hypotheses at all. That unconditional behaviour is why definitions
          in later subjects are phrased with preimages whenever there is a
          choice.
      - ask: >
          Which is the correct complement identity?
        choices:
          - text: >
              $f^{-1}(B \setminus T) = A \setminus f^{-1}(T)$
            correct: true
            feedback: >
              Yes, and note the two different universes: you complement inside
              $B$ on the left, because $T \subseteq B$, and inside $A$ on the
              right, because $f^{-1}(T) \subseteq A$.
          - text: >
              $f^{-1}(B \setminus T) = B \setminus f^{-1}(T)$
            feedback: >
              The right side is malformed: $f^{-1}(T)$ is a subset of the
              domain $A$, so subtracting it from $B$ is not a meaningful
              operation.
          - text: >
              $f^{-1}(A \setminus T) = A \setminus f^{-1}(T)$
            feedback: >
              The left side is malformed: $T$ is a subset of the codomain, so
              $A \setminus T$ subtracts a set of outputs from a set of inputs.
        feedback: >
          Complement inside $B$ on the inside, inside $A$ on the outside.
          Keeping track of which set each object lives in is most of the skill
          here.
      - teach: >
          One sentence carries the whole step: a preimage asks a question about
          one value, and questions about one value respect every Boolean
          operation. Reach for preimages whenever a proof gives you the choice.

  - node: foundations.functions.image-preimage-roundtrip
    hook: >
      Push a set out through $f$ and pull it back and you do not land where you
      started. Knowing which way each round trip leaks, and what plugs the
      leak, prevents a whole family of quiet proof errors.
    explanation: >
      Trip one: out, then back. For $S \subseteq A$, the claim is $S \subseteq
      f^{-1}(f(S))$, and the proof is a single move. Let $s \in S$. Then
      $f(s) \in f(S)$, straight from the definition of the image. So $s$ is an
      input whose value lies in $f(S)$, which is what it means for $s$ to lie
      in $f^{-1}(f(S))$. The trip can only *gain* points: anything outside $S$
      that happens to share a value with a member of $S$ gets swept up on the
      way back.

      Trip two: back, then out. For $T \subseteq B$, the exact statement is
      $f(f^{-1}(T)) = T \cap f(A)$, so in particular $f(f^{-1}(T)) \subseteq
      T$. Unwind it: $b$ lies in the left side exactly when $b = f(a)$ for some
      $a$ with $f(a) \in T$, which says $b$ is a value of $f$ and $b$ lies in
      $T$. This trip can only *lose* points, and it loses precisely the members
      of $T$ that were never values in the first place.

      Neither inclusion reverses in general. With $f : \{1,2,3,4,5\} \to
      \{0,1,2,3\}$ sending $n$ to the remainder of $n$ on division by $3$, take
      $S = \{1,2\}$: then $f(S) = \{1,2\}$ and $f^{-1}(f(S)) = \{1,2,4,5\}$,
      strictly bigger. Take $T = \{0,3\}$: then $f^{-1}(T) = \{3\}$ and
      $f(f^{-1}(T)) = \{0\}$, strictly smaller, because $3$ is never a value.

      The two repairs are the two adjectives, and each kills its own leak. If
      $f$ is injective and $a \in f^{-1}(f(S))$, then $f(a) = f(s)$ for some
      $s \in S$, so $a = s$ and $a \in S$ — the sweeping-up was caused by two
      points sharing a value, and injectivity forbids that. If $f$ is
      surjective then $f(A) = B$, so $T \cap f(A) = T$ for every $T$ and the
      second round trip is exact.
    worked: >
      Let $f : \{-2,-1,0,1,2\} \to \{0,1,2,3,4,5\}$ be $f(a) = a^{2}$, with
      values $4, 1, 0, 1, 4$. First trip: take $S = \{1,2\}$. Then
      $f(S) = \{1,4\}$, and pulling back collects every input with value $1$ or
      $4$, namely $-2, -1, 1, 2$. So $f^{-1}(f(S)) = \{-2,-1,1,2\}$: four
      elements where $S$ had two, the negatives having been swept in because
      they share values with $S$. Second trip: take $T = \{0,3,4\}$. Then
      $f^{-1}(T) = \{-2, 0, 2\}$, since only those inputs have value $0$ or
      $4$, and pushing that forward gives $f(\{-2,0,2\}) = \{4,0,4\} =
      \{0,4\}$. The element $3$ dropped out, being a member of $T$ that is
      never a value. One function, both failures.
    pitfalls: >
      The two inclusions run in opposite directions and are easy to swap. Fix
      them by the mechanism, not the symbol: out-and-back can only grow,
      back-and-out can only shrink. Using $S = f^{-1}(f(S))$ without having
      injectivity in hand is the most common way this goes wrong in a written
      proof. And the second round trip is an equality with $T \cap f(A)$, not
      merely an inclusion — the sharper form is often the one you need.
    recap: >
      Out-and-back gives $S \subseteq f^{-1}(f(S))$ with equality exactly when
      $f$ is injective; back-and-out gives $f(f^{-1}(T)) = T \cap f(A)$ with
      equality to $T$ exactly when $f$ is surjective.
    steps:
      - teach: >
          You now have two ways to move subsets along $f$. The obvious question
          is whether they undo each other. They almost do, and the two ways
          they fail are exactly the two adjectives you have just met.
      - teach: >
          Out, then back: $S \subseteq f^{-1}(f(S))$. One line does it — for
          $s \in S$, the value $f(s)$ lies in $f(S)$ by definition, so $s$ is an
          input landing in $f(S)$. The trip can only add points.
      - teach: >
          Back, then out: $f(f^{-1}(T)) = T \cap f(A)$, so it sits inside $T$.
          What survives is exactly the part of $T$ that was actually a set of
          values; anything in $T$ with an empty fiber is dropped.
      - ask: >
          Let $f : \{1,2,3,4,5,6\} \to \{0,1,2\}$ send $n$ to the remainder of
          $n$ on division by $3$, and take $S = \{1,2\}$. How many elements does
          $f^{-1}(f(S))$ have?
        expects: "4"
        hint: >
          Compute $f(S)$ first, then collect every input whose value lies in it.
        feedback: >
          Four. The values run $1,2,0,1,2,0$, so $f(S) = \{1,2\}$, and the
          inputs with value $1$ or $2$ are $1, 2, 4, 5$. The round trip picked
          up $4$ and $5$, which share values with $S$ without belonging to it.
      - teach: >
          Injectivity plugs the first leak. If $a \in f^{-1}(f(S))$ then
          $f(a) = f(s)$ for some $s \in S$; injectivity turns that into
          $a = s$, so $a$ was in $S$ all along. Surjectivity plugs the second,
          because $f(A) = B$ makes $T \cap f(A)$ equal to $T$.
      - ask: >
          Which inclusion holds for every function $f$ and every $S$ in its
          domain?
        choices:
          - text: >
              $f^{-1}(f(S)) \subseteq S$
            feedback: >
              The wrong way. A point outside $S$ sharing a value with a point
              of $S$ lands in $f^{-1}(f(S))$ and not in $S$, which is exactly
              what happened with the negatives in the squaring example.
          - text: >
              $S \subseteq f^{-1}(f(S))$
            correct: true
            feedback: >
              Yes — every $s \in S$ has $f(s) \in f(S)$, so $s$ qualifies for
              the preimage. Going out and coming back can only enlarge.
          - text: >
              $S = f^{-1}(f(S))$ for every $f$.
            feedback: >
              Equality is a real condition, not a freebie: it holds for all $S$
              exactly when $f$ is injective, and fails as soon as any two
              points share a value.
        feedback: >
          Out-and-back grows, so $S$ sits inside $f^{-1}(f(S))$. Equality is
          the injective case, and asserting it without that hypothesis is the
          standard slip.
      - ask: >
          Which hypothesis makes $f(f^{-1}(T)) = T$ hold for every
          $T \subseteq B$?
        choices:
          - text: >
              $f$ is injective.
            feedback: >
              Injectivity repairs the *other* round trip. It does nothing about
              a $T$ containing a point with an empty fiber, which is what
              breaks this one.
          - text: >
              $f$ is surjective.
            correct: true
            feedback: >
              Right. The exact statement is $f(f^{-1}(T)) = T \cap f(A)$, and
              $T \cap f(A) = T$ for every $T$ says precisely that $f(A) = B$.
          - text: >
              No hypothesis is needed.
            feedback: >
              Take $T$ to be a single point with an empty fiber: the left side
              is empty and $T$ is not. Any function that misses a value is a
              counterexample.
        feedback: >
          Surjectivity, because the only thing lost on the way back out is the
          part of $T$ that was never a set of values.
      - teach: >
          Two round trips, two directions of failure, two repairs. Injectivity
          protects the way out and surjectivity protects the way back, which is
          a first hint that a function with both can be undone completely.

  - node: foundations.functions.image-preimage-asymmetry
    hook: >
      You have now catalogued four separate failures of images and four
      unconditional successes of preimages. They all have a single cause, and
      seeing it turns a list to memorise into one sentence.
    explanation: >
      Compare the two membership tests side by side. For the preimage,
      $a \in f^{-1}(T)$ unfolds to $f(a) \in T$: a condition on one element,
      the single value that $a$ has. For the image, $b \in f(S)$ unfolds to
      "there exists $s \in S$ with $f(s) = b$": a search over all of $S$. A
      lookup and a search, and every difference between the two constructions
      comes from that.

      A lookup is just a proposition about a fixed object, and the set
      operations are built from "and", "or" and "not" applied to such
      propositions. So each preimage identity is a Boolean identity in
      disguise, and Boolean operations do not leak. A search leaks, because
      $\exists$ distributes over "or" and over nothing else. That single fact
      is why the union identity for images survives with no hypothesis while
      the intersection identity fails.

      The round trips tell the same story in different words. Out-and-back
      gains points because two *different* witnesses can carry the same value,
      so pulling $f(S)$ back sweeps in strangers. Back-and-out loses points
      because a member of $T$ with *no* witness contributes nothing on the way
      out. Injectivity is exactly the hypothesis that forbids two witnesses;
      surjectivity is exactly the hypothesis that forbids none. The same two
      repairs mend the intersection identity and the failed coverage, because
      they are the same two diseases.

      The practical consequence is worth taking on faith now and confirming
      later: when a definition or a proof can be phrased either way, phrase it
      with preimages. That is why continuity, measurability and many other
      later conditions are stated as "the preimage of a nice set is nice"
      rather than the other way round.
    pitfalls: >
      Treating this as a fact about union and intersection misses the point —
      it is a fact about $\exists$, and it will reappear anywhere an existential
      hides inside a definition. Hunting for a hypothesis that makes preimages
      behave is wasted effort; there is nothing to fix. And "prefer preimages"
      is advice about how to *phrase* a claim, not permission to replace an
      image by a preimage inside one.
    recap: >
      A preimage is a lookup on one value and an image is a search over a set,
      and every asymmetry between them is that difference showing up somewhere.
    steps:
      - teach: >
          The scoreboard so far: preimages commute with all four set
          operations, unconditionally, while images manage unions and need
          injectivity even for intersections. That gap is too large to be a
          coincidence.
      - teach: >
          Put the membership tests side by side. $a \in f^{-1}(T)$ means
          $f(a) \in T$ — a question about the one value $a$ has.
          $b \in f(S)$ means some $s \in S$ has $f(s) = b$ — a search for a
          witness across all of $S$.
      - teach: >
          A question about one fixed object is a proposition, and set
          operations are just "and", "or" and "not" on propositions, which
          nothing leaks out of. A search behaves worse: $\exists$ distributes
          over "or" and over nothing else.
      - ask: >
          Why does $f(S \cup S') = f(S) \cup f(S')$ hold for every function
          while the intersection version does not?
        choices:
          - text: >
              Because unions are larger sets, and images preserve size.
            feedback: >
              Images do not preserve size in either direction — a constant
              function sends a huge set to a single point. Size is not what is
              doing the work.
          - text: >
              Because "there is a witness in $S \cup S'$" is the same as "there
              is one in $S$ or there is one in $S'$", while "a witness in $S$
              and a witness in $S'$" does not produce one witness in both.
            correct: true
            feedback: >
              Exactly. The existential splits along "or" and refuses to split
              along "and", and the two witnesses failing to coincide is the
              whole failure.
          - text: >
              Because intersections can be empty and unions cannot.
            feedback: >
              An empty intersection is one dramatic case, but the identity
              fails for nonempty intersections too, whenever two distinct
              points share a value.
        feedback: >
          The union identity is the distribution of $\exists$ over "or". The
          intersection identity would need $\exists$ to distribute over "and",
          which it does not.
      - teach: >
          The round trips are the same sentence again. Out-and-back gains
          points because two different witnesses can carry one value.
          Back-and-out loses points because a value can have no witness at all.
      - ask: >
          Injectivity and surjectivity repair different failures. Which pairing
          is right?
        choices:
          - text: >
              Injectivity forbids two witnesses; surjectivity forbids none.
            correct: true
            feedback: >
              Yes, and that is why injectivity mends the intersection identity
              and the out-and-back trip, while surjectivity mends the
              back-and-out trip.
          - text: >
              Injectivity forbids missing values; surjectivity forbids
              collisions.
            feedback: >
              Swapped. Injectivity is the no-collision condition and
              surjectivity is the nothing-missed condition, and each repairs
              the failure caused by its own defect.
          - text: >
              Either hypothesis repairs either failure.
            feedback: >
              They are genuinely different diseases. An injective function that
              misses a value still breaks the back-and-out round trip, and a
              surjective function with a collision still breaks the other.
        feedback: >
          Two witnesses is the collision problem and no witness is the coverage
          problem, so injectivity and surjectivity each mend their own.
      - ask: >
          A later definition can be phrased with images or with preimages.
          Which should you reach for?
        choices:
          - text: >
              The image version, since pushing forward is more intuitive.
            feedback: >
              Intuitive to state and painful to use. Every proof then has to
              handle witnesses, and every set identity you want will come with
              a hypothesis attached.
          - text: >
              The preimage version, since preimages respect all the set
              operations with no hypotheses.
            correct: true
            feedback: >
              Right, and this is not merely tidier: the identities you will
              need mid-proof are simply available, with no injectivity to
              establish first.
          - text: >
              It makes no difference; the two are interchangeable.
            feedback: >
              They are not interchangeable, which is the content of the last
              several steps. The two constructions genuinely have different
              algebra.
        feedback: >
          Prefer preimages. The habit costs nothing at the moment of writing
          and saves a hypothesis every time the definition is used.
      - teach: >
          One sentence to keep: preimage is a lookup, image is a search. Every
          identity, every failure and every repair you have seen is that
          distinction wearing a different costume.

  - node: foundations.functions.def-composition
    hook: >
      Almost every construction later in mathematics is a chain of maps applied
      one after another. Chaining is legal only when the sets line up, and this
      is where that bookkeeping begins.
    explanation: >
      Let $f : A \to B$ and $g : B \to C$, so the codomain of $f$ is the domain
      of $g$. Define $g \circ f$ by $(g \circ f)(a) = g(f(a))$: run $f$, then
      feed the result to $g$. It is a function from $A$ to $C$, and both
      conditions come free. Totality: every $a$ has a value $f(a)$, which lies
      in $B$, which is $g$'s domain, so $g(f(a))$ exists. Single-valuedness:
      each step produces exactly one thing, so the pair of steps does too.

      The matching hypothesis is not decoration. If $g$ were declared on some
      other set, $g(f(a))$ might be an expression with nothing to evaluate. In
      practice you often have a weaker fact — that $f(a)$ lands inside $g$'s
      domain for every $a$ — and the fix is to redeclare $f$ with that set as
      its codomain first. That is a genuinely different function carrying the
      same rule, which is precisely the sort of thing the definition of
      equality was careful about.

      Now the notation, which fights the reading order. In $g \circ f$ the
      function written on the *right* acts first. The reason is that the
      expression $g(f(a))$ is evaluated inside out, and $\circ$ was chosen to
      match it. Tabulate a small case: with $A = \{1,2,3\}$, $B = \{u,v\}$ and
      $C = \{x,y\}$, let $f$ send $1 \mapsto u$, $2 \mapsto v$, $3 \mapsto u$,
      and let $g$ send $u \mapsto y$, $v \mapsto x$. Then $g \circ f$ sends
      $1 \mapsto y$, $2 \mapsto x$, $3 \mapsto y$, and it is a function from
      $A$ to $C$ — the set $B$ appears nowhere in its declaration.

      With formulas it is the same drill. On $\mathbb{R}$, if $f(x) = 2x$ and
      $g(x) = x - 3$, then $(g \circ f)(x) = g(2x) = 2x - 3$: substitute the
      inner rule into the outer one.
    worked: >
      Let $A = \{1,2,3,4\}$, $B = \{a,b,c\}$ and $C = \{0,1\}$. Define
      $f : A \to B$ by $f(1) = a$, $f(2) = c$, $f(3) = a$, $f(4) = b$, and
      $g : B \to C$ by $g(a) = 1$, $g(b) = 0$, $g(c) = 1$. The codomain of $f$
      is the domain of $g$, so the composite is legal. Evaluate it input by
      input: $(g \circ f)(1) = g(a) = 1$; $(g \circ f)(2) = g(c) = 1$;
      $(g \circ f)(3) = g(a) = 1$; $(g \circ f)(4) = g(b) = 0$. So
      $g \circ f : A \to C$ is the function with values $1, 1, 1, 0$, its
      domain is $\{1,2,3,4\}$, its codomain is $\{0,1\}$, and its range is
      $\{0,1\}$.
    pitfalls: >
      The order is the standing trap: $g \circ f$ does $f$ first, so reading
      the symbol left to right gives you the wrong function. The composite's
      declaration is $A \to C$ — the middle set $B$ is not its domain, not its
      codomain, and not recoverable from it. And a mismatch of sets is not a
      technicality to wave through: if $f$'s codomain is not $g$'s domain, the
      composite is undefined until you redeclare one of them.
    recap: >
      For $f : A \to B$ and $g : B \to C$, the composite $g \circ f : A \to C$
      sends $a$ to $g(f(a))$ — legal exactly when $f$'s codomain is $g$'s
      domain, and with $f$ acting first.
    steps:
      - teach: >
          One function at a time is a poor model of mathematics. You encode,
          then transform, then decode; you change coordinates, then compute,
          then change back. Composition is the operation that makes a chain
          into a single function.
      - teach: >
          Given $f : A \to B$ and $g : B \to C$, define $g \circ f$ by
          $(g \circ f)(a) = g(f(a))$. It is a function $A \to C$: every $a$ has
          a value $f(a)$ in $B$, which is where $g$ is defined, and each step
          produces exactly one output.
      - teach: >
          The matching condition — $f$'s codomain is $g$'s domain — is what
          makes the definition legal. When you only know that $f$'s values land
          in $g$'s domain, redeclare $f$ with that set as codomain first, which
          gives a different function with the same rule.
      - ask: >
          Let $f : \{1,2,3\} \to \{1,2,3,4\}$ be $f(n) = n + 1$, and let
          $g : \{1,2,3,4\} \to \mathbb{Z}$ be $g(m) = m^{2}$. What is
          $(g \circ f)(2)$?
        expects: "9"
        hint: >
          The function written on the right acts first.
        feedback: >
          Nine. First $f(2) = 3$, then $g(3) = 3^{2} = 9$. Applying $g$ first
          would have given $g(2) = 4$ and then $f(4)$, which is not even
          defined, since $4$ is outside $f$'s domain.
      - teach: >
          That order is the notation's one cruelty: in $g \circ f$ the function
          on the right goes first, because $g(f(a))$ is evaluated from the
          inside out. Say it out loud as "$g$ after $f$" and the habit sticks.
      - ask: >
          $f : \{1,2\} \to \{1,2,3\}$ and $g : \{1,2\} \to \{1,2\}$ are
          functions. Which composite is defined?
        choices:
          - text: >
              $g \circ f$, since $f$ is written on the right and acts first.
            feedback: >
              Order is not the issue here — the sets are. The codomain of $f$
              is $\{1,2,3\}$ and the domain of $g$ is $\{1,2\}$, so $g$ has
              nothing to say about the input $3$.
          - text: >
              $f \circ g$, since the codomain of $g$ is the domain of $f$.
            correct: true
            feedback: >
              Right: $g$ lands in $\{1,2\}$, which is exactly where $f$ is
              defined, so $f \circ g : \{1,2\} \to \{1,2,3\}$ is legal.
          - text: >
              Both, since all the sets involved are finite.
            feedback: >
              Finiteness is irrelevant. The condition is the exact equality of
              $f$'s codomain with $g$'s domain, and that fails in one of the two
              orders here.
        feedback: >
          Only $f \circ g$ typechecks. Check the sets before writing the
          composite; the order the symbols appear in tells you nothing about
          whether it exists.
      - ask: >
          For $f : A \to B$ and $g : B \to C$, what is the codomain of
          $g \circ f$?
        choices:
          - text: >
              $B$, since that is where the intermediate values live.
            feedback: >
              The intermediate values are internal to the computation. Nothing
              in the composite's declaration mentions $B$, and you cannot
              recover $B$ from the composite.
          - text: >
              $C$, and its domain is $A$.
            correct: true
            feedback: >
              Yes. The composite takes inputs from $A$ and delivers values into
              $C$; $B$ was scaffolding needed to build it and is gone
              afterwards.
          - text: >
              The range of $g$, since only those values are actually taken.
            feedback: >
              That confuses the range with the codomain again. The codomain is
              declared as $C$, whether or not $g \circ f$ manages to fill it.
        feedback: >
          $g \circ f : A \to C$. The middle set does its job during
          construction and then disappears from the declaration entirely.
      - teach: >
          Composition is the operation everything else in this unit is about to
          be phrased in — identities, inverses, restrictions. Get the two
          habits now: check the sets, and remember the right-hand map goes
          first.

  - node: foundations.functions.composition-associative
    hook: >
      Chains of three and four maps appear constantly, and associativity is the
      permission slip that lets you stop writing brackets. The failure of
      commutativity, sitting right beside it, is the error that costs the most
      marks.
    explanation: >
      The claim is $h \circ (g \circ f) = (h \circ g) \circ f$ for
      $f : A \to B$, $g : B \to C$, $h : C \to D$. Equality of functions has
      three clauses, and the first two are immediate: both sides are functions
      from $A$ to $D$, since each is built by composing along the chain. So
      only the values are in question.

      Fix an arbitrary $a \in A$ and unfold each side. On the left,
      $(h \circ (g \circ f))(a) = h((g \circ f)(a)) = h(g(f(a)))$. On the
      right, $((h \circ g) \circ f)(a) = (h \circ g)(f(a)) = h(g(f(a)))$. The
      same expression both times, so the values agree at every point and the
      two functions are equal. Nothing was used but the definition of
      composition, applied twice on each side — which is the general recipe for
      any identity between composites: check the sets, then chase an arbitrary
      point. Since the bracketing never matters, one writes $h \circ g \circ f$
      and stops thinking about it.

      Commutativity is a different story, and it fails twice over. It usually
      fails to typecheck at all: with $f : A \to B$ and $g : B \to C$, the
      composite $f \circ g$ requires $C = A$, and there is no reason for that.
      Even when both composites exist, they are almost never equal. On
      $\mathbb{R}$ take $f(x) = 3x$ and $g(x) = x + 4$. Then
      $(g \circ f)(x) = g(3x) = 3x + 4$, while
      $(f \circ g)(x) = f(x+4) = 3x + 12$. At $x = 0$ those are $4$ and $12$,
      so a single input disproves the identity.
    worked: >
      Take $A = \{1,2\}$, $B = \{a,b\}$, $C = \{p,q\}$, $D = \{0,1\}$, with
      $f(1) = a$, $f(2) = b$; $g(a) = q$, $g(b) = q$; and $h(p) = 1$,
      $h(q) = 0$. Left bracketing: $g \circ f$ sends $1 \mapsto q$ and
      $2 \mapsto q$, so $h \circ (g \circ f)$ sends $1 \mapsto h(q) = 0$ and
      $2 \mapsto 0$. Right bracketing: $h \circ g$ sends $a \mapsto h(q) = 0$
      and $b \mapsto h(q) = 0$, so $(h \circ g) \circ f$ sends
      $1 \mapsto 0$ and $2 \mapsto 0$. Same domain $\{1,2\}$, same codomain
      $\{0,1\}$, same value at both points — the two bracketings are the same
      function, and it is the constant map with value $0$.
    pitfalls: >
      Associativity licenses moving brackets and nothing else; reordering the
      maps is never permitted, and $f \circ g$ frequently does not exist at
      all. Reading $g \circ f$ from left to right is the other standing error,
      and it silently produces a different function whenever both composites
      happen to be defined. When you drop the brackets and write
      $h \circ g \circ f$, remember it still means "$f$ first".
    recap: >
      Composition is associative — both bracketings send $a$ to $h(g(f(a)))$ —
      so brackets may be dropped, while the order of the maps may never be
      changed.
    steps:
      - teach: >
          Once you can compose two functions you can compose three, and there
          are two ways to bracket the chain. If they disagreed, every formula
          with three maps would need brackets forever. They do not disagree.
      - teach: >
          For $f : A \to B$, $g : B \to C$ and $h : C \to D$, both
          $h \circ (g \circ f)$ and $(h \circ g) \circ f$ are functions from
          $A$ to $D$. Two of the three clauses of function equality are already
          settled, so only the values need checking.
      - teach: >
          Chase an arbitrary $a$. The left side gives $h((g \circ f)(a)) =
          h(g(f(a)))$; the right side gives $(h \circ g)(f(a)) = h(g(f(a)))$.
          Identical, so the functions are equal and $h \circ g \circ f$ needs no
          brackets.
      - ask: >
          On $\mathbb{R}$ let $f(x) = 3x$ and $g(x) = x + 4$. What is
          $(f \circ g)(2)$?
        expects: "18"
        hint: >
          The right-hand map acts first, so $g$ goes before $f$ here.
        feedback: >
          Eighteen. First $g(2) = 2 + 4 = 6$, then $f(6) = 3 \cdot 6 = 18$. The
          other order gives $(g \circ f)(2) = g(6) = 10$, which is how you can
          see at a glance that these two composites are different functions.
      - teach: >
          Commutativity fails, and usually it fails before you can even
          evaluate anything: for $f : A \to B$ and $g : B \to C$, the composite
          $f \circ g$ needs $C = A$, and nothing supplies that.
      - ask: >
          With the same $f(x) = 3x$ and $g(x) = x + 4$ on $\mathbb{R}$, which
          formula is $(g \circ f)(x)$?
        choices:
          - text: >
              $3x + 12$
            feedback: >
              That is $(f \circ g)(x) = f(x+4) = 3(x+4)$ — the other order.
              Getting these two swapped is the single most common composition
              error.
          - text: >
              $3x + 4$
            correct: true
            feedback: >
              Right: $f$ acts first, giving $3x$, and then $g$ adds $4$ to it.
          - text: >
              $4x$
            feedback: >
              That adds the two rules together instead of feeding one into the
              other. Composition substitutes; it does not combine.
        feedback: >
          $f$ first, so triple and then add: $3x + 4$. Tripling *after* adding
          would have given $3x + 12$, a different function.
      - ask: >
          What does associativity permit you to do?
        choices:
          - text: >
              Move the brackets in a chain of composites freely.
            correct: true
            feedback: >
              Exactly that, and no more. Any bracketing of $h \circ g \circ f$
              gives the same function, so the brackets can be dropped.
          - text: >
              Reorder the maps in a chain of composites freely.
            feedback: >
              That is commutativity, and it is false — often the reordered
              composite is not even defined, and when it is, it is usually a
              different function.
          - text: >
              Replace $g \circ f$ by $f \circ g$ whenever both are defined.
            feedback: >
              Both being defined changes nothing. On $\mathbb{R}$, tripling
              then adding $4$ and adding $4$ then tripling are both defined and
              disagree at every single point, since $3x + 4$ never equals
              $3x + 12$.
        feedback: >
          Brackets are free; order is not. Associativity is a statement about
          grouping, and it says nothing at all about sequence.
      - teach: >
          Because brackets never matter, a chain of maps can be written as one
          string and manipulated like a word. That is the fact every later
          argument about inverses is going to lean on.

  - node: foundations.functions.composition-inj-surj
    hook: >
      When you build a bijection out of simpler pieces, this is the result that
      certifies it. Its half-converses are the reliable trap: each one tells you
      about one of the two maps and never both.
    explanation: >
      Injectivity is inherited. Suppose $f$ and $g$ are injective and
      $(g \circ f)(a_1) = (g \circ f)(a_2)$, that is $g(f(a_1)) = g(f(a_2))$.
      Injectivity of $g$ peels off the outer layer to give $f(a_1) = f(a_2)$,
      and injectivity of $f$ peels off the inner one to give $a_1 = a_2$. Two
      peels, outside first.

      Surjectivity is inherited too, with the witnesses built in the same
      outside-in order. Let $c \in C$ be arbitrary. Surjectivity of $g$
      supplies $b \in B$ with $g(b) = c$; surjectivity of $f$ supplies $a \in
      A$ with $f(a) = b$; then $(g \circ f)(a) = g(b) = c$. So a composite of
      bijections is a bijection.

      The converses are partial, and each runs in a fixed direction. If
      $g \circ f$ is injective then $f$ is injective: from $f(a_1) = f(a_2)$
      apply $g$ to both sides to get $g(f(a_1)) = g(f(a_2))$, and the composite
      gives $a_1 = a_2$. Only the *first* map is controlled. If $g \circ f$ is
      surjective then $g$ is surjective: every $c \in C$ is $(g \circ f)(a) =
      g(f(a))$ for some $a$, so $f(a)$ is a witness for $g$. Only the *last*
      map is controlled.

      Both restrictions are sharp. Let $A = \{1,2\}$, $B = \{1,2,3\}$,
      $C = \{1,2\}$, with $f(1) = 1$, $f(2) = 2$ and with $g$ sending
      $1 \mapsto 1$, $2 \mapsto 2$, $3 \mapsto 2$. Then $g \circ f$ sends
      $1 \mapsto 1$ and $2 \mapsto 2$, a bijection — while $f$ misses $3$ and
      so is not surjective, and $g$ collides at $2$ and $3$ and so is not
      injective. Read injectivity back off the first map and surjectivity off
      the last, and never the other way.
    worked: >
      Take $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = 2n$ and
      $g : \mathbb{Z} \to \mathbb{Z}$ with $g(m) = \lfloor m/2 \rfloor$. The
      composite: $(g \circ f)(n) = \lfloor 2n/2 \rfloor = n$ for every integer
      $n$, so $g \circ f$ is the map sending each $n$ to itself, which is a
      bijection. Now audit the factors. $f$ is injective, since $2n_1 = 2n_2$
      gives $n_1 = n_2$, and it is not surjective, since $1$ is odd and has an
      empty fiber. $g$ is surjective, since $g(2k) = k$ for every $k$, and it
      is not injective, since $g(0) = 0 = g(1)$. So a bijective composite has
      forced injectivity on the first map and surjectivity on the last, and has
      forced nothing else at all.
    pitfalls: >
      Running a converse the wrong way round is the standard error: $g \circ f$
      injective tells you about $f$ and says nothing about $g$, and $g \circ f$
      surjective tells you about $g$ and says nothing about $f$. Concluding
      that a bijective composite makes both factors bijections is the same
      mistake twice. And the forward implications need *both* maps to have the
      property — one injective factor buys you nothing on its own.
    recap: >
      Injectivity and surjectivity both survive composition, and from a
      composite you can read injectivity back only for the first map and
      surjectivity back only for the last.
    steps:
      - teach: >
          Composites are how complicated functions get built, so the question
          is which properties survive the build and which can be read back off
          the finished product.
      - teach: >
          Injectivity survives. If $g(f(a_1)) = g(f(a_2))$, injectivity of $g$
          strips the outer layer to give $f(a_1) = f(a_2)$, and injectivity of
          $f$ strips the inner one to give $a_1 = a_2$. Two peels, outside in.
      - teach: >
          Surjectivity survives, with the witnesses built in the same order.
          Given $c$, use $g$ to find $b$ with $g(b) = c$, then use $f$ to find
          $a$ with $f(a) = b$. Then $(g \circ f)(a) = c$, so a composite of
          bijections is a bijection.
      - ask: >
          You are told only that $g \circ f$ is injective. What follows?
        choices:
          - text: >
              $g$ is injective.
            feedback: >
              The wrong map. $g$ can collide freely on points that $f$ never
              produces, and the composite will never notice.
          - text: >
              $f$ is injective.
            correct: true
            feedback: >
              Yes: from $f(a_1) = f(a_2)$, apply $g$ to both sides to get
              $g(f(a_1)) = g(f(a_2))$, and the composite's injectivity gives
              $a_1 = a_2$.
          - text: >
              Both $f$ and $g$ are injective.
            feedback: >
              Too strong, and the counterexample is small: doubling on
              $\mathbb{Z}$ followed by halving-and-rounding-down has a bijective
              composite while the second map collides.
        feedback: >
          Injectivity is read back off the *first* map only. The last map is
          free to misbehave anywhere the first map's values never reach.
      - teach: >
          The mirror image holds for coverage: if $g \circ f$ is surjective
          then $g$ is surjective, since every $c$ equals $g(f(a))$ for some
          $a$, and $f(a)$ is the witness $g$ needed. Nothing follows about $f$.
      - ask: >
          Let $f : A \to B$ be injective with $|A| = 3$ and $|B| = 5$, and let
          $g : B \to C$ be injective with $|C| = 7$. How many elements does the
          range of $g \circ f$ have?
        expects: "3"
        hint: >
          A composite of injective maps is injective, and an injective map
          takes distinct values at distinct points.
        feedback: >
          Three. Both maps are injective, so $g \circ f$ is injective, and an
          injective function on a $3$-element domain takes $3$ distinct values.
          The sizes of $B$ and $C$ never enter — they only had to be large
          enough to accommodate the injections.
      - ask: >
          $g \circ f$ is a bijection. Which conclusion is justified?
        choices:
          - text: >
              $f$ and $g$ are both bijections.
            feedback: >
              Not justified. Take $f : \{1,2\} \to \{1,2,3\}$ as the obvious
              injection and $g : \{1,2,3\} \to \{1,2\}$ sending $3$ to $2$: the
              composite is a bijection and neither factor is.
          - text: >
              $f$ is injective and $g$ is surjective.
            correct: true
            feedback: >
              Exactly what the two partial converses give: injectivity of the
              composite controls the first map, surjectivity of the composite
              controls the last.
          - text: >
              $f$ is surjective and $g$ is injective.
            feedback: >
              The directions are swapped. In the example just mentioned, $f$
              misses $3$ and $g$ sends $2$ and $3$ to the same place, so both of
              these claims fail.
        feedback: >
          First map injective, last map surjective, and nothing more. That
          asymmetry is worth memorising as a sentence, since it is easy to
          half-remember.
      - teach: >
          Build with both properties and you keep both. Read back from a
          composite and you get one fact about each end of the chain — never a
          full picture of the middle.

  - node: foundations.functions.def-identity
    hook: >
      Before you can say that one function undoes another, you need a function
      that does nothing — something for a pair of composites to be *equal to*.
      This is that function.
    explanation: >
      For any set $A$, the identity map $\mathrm{id}_A : A \to A$ is defined by
      $\mathrm{id}_A(a) = a$. As a rule it is as dull as a rule can be. Its
      value is entirely in how it behaves under composition.

      For every $f : A \to B$ we have $f \circ \mathrm{id}_A = f$ and
      $\mathrm{id}_B \circ f = f$. Both are proved the same way. Each side is a
      function from $A$ to $B$, so by the equality criterion only the values
      matter, and at an arbitrary $a$: $(f \circ \mathrm{id}_A)(a) =
      f(\mathrm{id}_A(a)) = f(a)$, while $(\mathrm{id}_B \circ f)(a) =
      \mathrm{id}_B(f(a)) = f(a)$. So composition has a two-sided neutral
      element, exactly as addition has $0$.

      Notice that those really are two statements and not one, because the two
      identity maps are different functions. $\mathrm{id}_A$ has domain and
      codomain $A$; $\mathrm{id}_B$ has domain and codomain $B$; if $A \ne B$
      they fail the equality test at the very first clause. The sets even
      dictate which side each may be composed on: $\mathrm{id}_A$ can only go
      on the right of $f$, since its codomain is $A$, and $\mathrm{id}_B$ can
      only go on the left. There is no such thing as "the identity" floating
      free of a set.

      Take $A = \{1,2,3\}$ and $B = \{u,v\}$ with $f(1) = u$, $f(2) = v$,
      $f(3) = u$. Then $\mathrm{id}_A$ is the map $1 \mapsto 1$, $2 \mapsto 2$,
      $3 \mapsto 3$, and $\mathrm{id}_B$ is the two-point map $u \mapsto u$,
      $v \mapsto v$ — different functions with the same one-word description.
    worked: >
      Continue with that $f : \{1,2,3\} \to \{u,v\}$. Check
      $f \circ \mathrm{id}_A$ at every input: $f(\mathrm{id}_A(1)) = f(1) = u$;
      $f(\mathrm{id}_A(2)) = f(2) = v$; $f(\mathrm{id}_A(3)) = f(3) = u$. The
      values are $u, v, u$ — the same table as $f$, on the same domain, into
      the same codomain, so the two functions are equal. Now check
      $\mathrm{id}_B \circ f$: $\mathrm{id}_B(f(1)) = \mathrm{id}_B(u) = u$,
      and likewise $v$ and $u$. Equal again. Finally note that
      $\mathrm{id}_A \circ f$ is not a legal expression at all: the codomain of
      $f$ is $\{u,v\}$ and the domain of $\mathrm{id}_A$ is $\{1,2,3\}$, so
      there is nothing to compose.
    pitfalls: >
      There is no single "identity function" — there is one for each set, and
      writing $\mathrm{id}$ with no subscript in a computation involving two
      sets will eventually produce an expression that does not typecheck. Of
      the two composites $\mathrm{id}_A \circ f$ and $\mathrm{id}_B \circ f$,
      only one exists for $f : A \to B$ with $A \ne B$, so the subscript is
      carrying real information.
    recap: >
      $\mathrm{id}_A$ sends every element of $A$ to itself and is the two-sided
      neutral element for composition, one such map per set.
    steps:
      - teach: >
          Addition has $0$ and multiplication has $1$. Composition needs the
          same thing: a function that changes nothing, so that "these two maps
          cancel" has something to be an equation about.
      - teach: >
          For a set $A$, define $\mathrm{id}_A : A \to A$ by $\mathrm{id}_A(a)
          = a$. Domain $A$, codomain $A$, and the graph is the diagonal — every
          element paired with itself.
      - teach: >
          It is neutral on both sides: $f \circ \mathrm{id}_A = f$ and
          $\mathrm{id}_B \circ f = f$ for every $f : A \to B$. Chase a point
          and both collapse instantly, since $f(\mathrm{id}_A(a)) = f(a)$ and
          $\mathrm{id}_B(f(a)) = f(a)$.
      - ask: >
          Let $f : A \to B$ with $A \ne B$. Which of these composites is
          defined?
        choices:
          - text: >
              $\mathrm{id}_A \circ f$
            feedback: >
              Not defined. Composing on the left needs a map whose domain is
              $f$'s codomain, which is $B$ — and $\mathrm{id}_A$ is defined on
              $A$.
          - text: >
              $\mathrm{id}_B \circ f$
            correct: true
            feedback: >
              Yes. The domain of $\mathrm{id}_B$ is $B$, which is exactly $f$'s
              codomain, so the composite is legal and equals $f$.
          - text: >
              Both, since an identity map can be composed with anything.
            feedback: >
              An identity map is tied to one set, and the matching condition
              applies to it like any other function. Half of these expressions
              are simply ungrammatical.
        feedback: >
          Only $\mathrm{id}_B \circ f$. The subscript decides which side the
          identity can appear on, which is why writing $\mathrm{id}$ bare is
          dangerous.
      - teach: >
          So $\mathrm{id}_A$ and $\mathrm{id}_B$ are genuinely different
          functions whenever $A \ne B$ — same one-word description, different
          domains, and the equality criterion fails at the first clause.
      - ask: >
          How many functions $f : \{1,2,3\} \to \{1,2,3\}$ satisfy
          $f \circ f = \mathrm{id}_A$?
        expects: "4"
        hint: >
          The condition says $f(f(n)) = n$ for every $n$, so $f$ either fixes a
          point or swaps it with another.
        feedback: >
          Four. Each element is either fixed or swapped with exactly one other,
          so the possibilities are: the identity itself, and the three maps
          that swap one pair and fix the remaining point — swap $1,2$; swap
          $1,3$; swap $2,3$. A three-cycle fails, since applying it twice moves
          everything.
      - ask: >
          When is $\mathrm{id}_A = \mathrm{id}_B$?
        choices:
          - text: >
              Always — both are "the identity", and both send every element to
              itself.
            feedback: >
              The rule is the same sentence, but a function is not a sentence.
              Different domains give different functions, whatever the rule
              looks like.
          - text: >
              Exactly when $A = B$.
            correct: true
            feedback: >
              Right. Equality of functions asks for the same domain first, and
              for identity maps that single condition is also enough.
          - text: >
              Whenever $A$ and $B$ have the same number of elements.
            feedback: >
              Same size is not the same set. The identity on $\{1,2\}$ and the
              identity on $\{u,v\}$ have disjoint graphs and different domains.
        feedback: >
          One identity per set, equal only when the sets are equal. That is the
          reason the two neutrality equations are two separate facts.
      - teach: >
          With a neutral element in hand, "$g$ undoes $f$" finally has a
          precise form to aim at: a composite that comes out equal to an
          identity map.

  - node: foundations.functions.def-inclusion
    hook: >
      Here is the cleanest possible demonstration that a codomain is real data:
      keep the identity rule, enlarge the codomain, and watch a bijection turn
      into a function that is no longer onto.
    explanation: >
      For $S \subseteq A$, the inclusion map $\iota_S : S \to A$ is defined by
      $\iota_S(s) = s$. It takes an element of the subset and regards it as an
      element of the whole set, which sounds like nothing at all and is
      precisely why it is worth writing down as a function.

      Compare $\iota_S$ with $\mathrm{id}_S$. Same domain $S$, same rule, same
      graph $\{(s,s) : s \in S\}$. The codomains differ — $A$ for the
      inclusion, $S$ for the identity — and by the equality criterion that
      makes them different functions whenever $S \ne A$. Nothing else in this
      unit separates two functions so sharply with so little happening.

      Both properties are immediate. Every inclusion is injective: if
      $\iota_S(s_1) = \iota_S(s_2)$ then $s_1 = s_2$, since those are literally
      the same equation. And $\iota_S$ is surjective exactly when $S = A$,
      because its range is $S$, and a range fills the codomain $A$ precisely
      when $S$ is all of $A$.

      Take $S = \{1,2\}$ inside $A = \{1,2,3\}$. The map $\iota_S$ sends
      $1 \mapsto 1$ and $2 \mapsto 2$ into $\{1,2,3\}$: injective, and not
      surjective, since the fiber over $3$ is empty. The map $\mathrm{id}_S$
      has the same two values and codomain $\{1,2\}$, and it is a bijection.
      One is onto and the other is not, and no value was changed.
    worked: >
      Let $S = \{0,2,4\} \subseteq A = \{0,1,2,3,4\}$ and take
      $\iota_S : S \to A$. Values: $\iota_S(0) = 0$, $\iota_S(2) = 2$,
      $\iota_S(4) = 4$. Injectivity: the three values $0, 2, 4$ are distinct,
      so no collisions. Surjectivity: the range is $\{0,2,4\}$, while the
      codomain is $\{0,1,2,3,4\}$, so the fibers over $1$ and over $3$ are
      empty and $\iota_S$ is not surjective. A preimage for practice:
      $\iota_S^{-1}(\{2,3\}) = \{2\}$, since $2$ is the only element of $S$
      whose value lands in $\{2,3\}$.
    pitfalls: >
      An inclusion "does nothing", which tempts people to omit it — but
      omitting it hides a change of codomain, and that is exactly the change
      that decides whether a map is onto. Do not read $\iota_S = \mathrm{id}_S$
      either: identical domains, identical graphs, different codomains, so
      different functions unless $S = A$.
    recap: >
      The inclusion $\iota_S : S \to A$ carries the identity rule with a larger
      codomain — always injective, and surjective only when $S = A$.
    steps:
      - teach: >
          "Every element of $S$ is also an element of $A$" is a fact about
          sets. Turning it into a function gives you something you can compose
          with, and that turns out to be worth the pedantry.
      - teach: >
          For $S \subseteq A$, define $\iota_S : S \to A$ by $\iota_S(s) = s$.
          Domain $S$, codomain $A$, and the graph is $\{(s,s) : s \in S\}$ —
          the diagonal of the smaller set, sitting inside a bigger grid.
      - teach: >
          Put it beside $\mathrm{id}_S$. Same domain, same rule, same graph.
          The only difference is the codomain, which is $A$ for the inclusion
          and $S$ for the identity.
      - ask: >
          For $S = \{1,2\}$ inside $A = \{1,2,3\}$, is $\iota_S =
          \mathrm{id}_S$?
        choices:
          - text: >
              Yes — they have the same domain and take the same value at every
              point.
            feedback: >
              Two clauses of three. Equality of functions also asks for the
              same codomain, and here one is $\{1,2,3\}$ and the other is
              $\{1,2\}$.
          - text: >
              No — the codomains differ, so they are different functions.
            correct: true
            feedback: >
              Right, and the difference has consequences: $\mathrm{id}_S$ is a
              bijection while $\iota_S$ is not surjective, with an empty fiber
              over $3$.
          - text: >
              Yes, because their graphs are the same set of ordered pairs.
            feedback: >
              The graphs really are identical, which is what makes this the
              sharpest illustration in the unit that the codomain is data the
              graph does not carry.
        feedback: >
          Different codomains, different functions — and one of them is onto
          while the other is not, with no value anywhere having changed.
      - teach: >
          Two properties come free. Every inclusion is injective, since
          $\iota_S(s_1) = \iota_S(s_2)$ *is* the equation $s_1 = s_2$. And the
          range of $\iota_S$ is exactly $S$.
      - ask: >
          How many inclusion maps are there into a $3$-element set $A$?
        expects: "8"
        hint: >
          One for each subset of $A$, and the power set of a $3$-element set is
          not hard to count.
        feedback: >
          Eight. Each subset $S \subseteq A$ gives exactly one inclusion
          $\iota_S$, and a $3$-element set has $2^{3} = 8$ subsets. Both
          extremes count: $S = A$ gives $\mathrm{id}_A$, and $S = \emptyset$
          gives the inclusion of the empty set, a function with empty domain
          that assigns nothing to anything.
      - ask: >
          When is $\iota_S : S \to A$ surjective?
        choices:
          - text: >
              Never, since $S$ is a subset of $A$.
            feedback: >
              A subset is allowed to be the whole set. When $S = A$ the
              inclusion is $\mathrm{id}_A$, which is certainly onto.
          - text: >
              Exactly when $S = A$.
            correct: true
            feedback: >
              Yes. The range is $S$, and it fills the codomain $A$ precisely
              when $S$ is all of $A$; any element of $A$ outside $S$ has an
              empty fiber.
          - text: >
              Always, since every element of $A$ is either in $S$ or not.
            feedback: >
              Being outside $S$ is exactly the problem: such an element is in
              the codomain and is never a value, which is what non-surjective
              means.
        feedback: >
          Only in the degenerate case $S = A$. Otherwise the elements of $A$
          left outside $S$ are precisely the ones the inclusion misses.
      - teach: >
          Keep the inclusion in your toolkit as a composable object. The next
          step defines restriction with it, and the habit of writing the
          change of codomain down instead of leaving it implicit is the point.

  - node: foundations.functions.def-restriction
    hook: >
      Restricting a domain is the standard rescue for a function that fails a
      property you want, and it is exactly how the inverse trigonometric
      functions come to exist at all.
    explanation: >
      For $f : A \to B$ and $S \subseteq A$, the restriction $f|_S : S \to B$
      is given by $f|_S(s) = f(s)$. In composition terms it is
      $f|_S = f \circ \iota_S$: both sides are functions $S \to B$, and at an
      arbitrary $s$ the composite gives $f(\iota_S(s)) = f(s)$. Its range is
      $f(S)$, the image of the subset you kept.

      Restricting costs nothing. For each $S$ the restriction exists and is
      unique — there is no decision to make, since every value is already
      determined by $f$. Extending is the opposite. A function $g : A' \to B$
      with $A \subseteq A'$ is an extension of $f$ if $g(a) = f(a)$ for every
      $a \in A$, and on the new points $g$ is unconstrained. Take
      $f : \{1,2\} \to \{a,b,c\}$ with $f(1) = a$, $f(2) = b$. Extensions to
      $\{1,2,3\}$ must send $1 \mapsto a$ and $2 \mapsto b$, and may send $3$
      anywhere at all, so there are three of them. Under extra demands —
      continuity, linearity — an extension may fail to exist entirely.

      The interesting part is that restriction can *create* properties.
      Injectivity is the one it creates: fewer inputs means fewer chances to
      collide, so a restriction of an injective function is injective and a
      restriction of a non-injective one may well become injective. The
      textbook case is $\sin$, which is not injective on $\mathbb{R}$ — for
      instance $\sin 0 = \sin \pi = 0$ — and is injective on
      $[-\pi/2, \pi/2]$. That restriction is what makes $\arcsin$ definable.

      Surjectivity moves the other way. The range of $f|_S$ is $f(S) \subseteq
      f(A)$ and the codomain has not changed, so restricting can destroy
      surjectivity and can never create it.
    worked: >
      Let $f : \{1,2,3,4\} \to \{0,1\}$ send $n$ to the remainder of $n$ on
      division by $2$, so the values are $1, 0, 1, 0$. As it stands $f$ is
      surjective — both $0$ and $1$ are taken — and not injective, since
      $f(1) = f(3)$. Restrict to $S = \{1,2\}$: the values are $1, 0$, all
      distinct, so $f|_S$ is injective, and its range is still $\{0,1\}$, so it
      remains surjective. Restrict instead to $S' = \{1,3\}$: the values are
      $1, 1$, so $f|_{S'}$ is not injective, and its range is $\{1\}$, so it is
      not surjective either. One function, two restrictions, three different
      verdicts.
    pitfalls: >
      A restriction is a different function from the original even though no
      value changed — the domain differs, so $f|_S = f$ only when $S = A$.
      Speaking of "the extension" of a function is almost always wrong: an
      extension is a choice among many, and under side conditions it may not
      exist at all. And restriction is not symmetric with extension in
      difficulty, which is why theorems about extending maps are hard and
      theorems about restricting them do not exist.
    recap: >
      Restricting shrinks the domain and is free and unique; extending enlarges
      it and is a choice that may be non-unique or impossible.
    steps:
      - teach: >
          You have a function that fails a property you want. Often you do not
          need a new function — you need fewer inputs. Shrinking the domain is
          the standard move, and it deserves notation.
      - teach: >
          For $S \subseteq A$, the restriction $f|_S : S \to B$ is defined by
          $f|_S(s) = f(s)$. It is exactly $f \circ \iota_S$, which is worth
          noticing: the inclusion is doing the work of changing the domain.
      - teach: >
          Restriction is free and unique — every value was already decided by
          $f$, so there is nothing to choose. The range of $f|_S$ is $f(S)$,
          the image of the piece you kept.
      - ask: >
          Which property can a restriction *create* in a function that lacked
          it?
        choices:
          - text: >
              Surjectivity, since a smaller domain makes the codomain easier to
              fill.
            feedback: >
              Backwards. The range of $f|_S$ is $f(S)$, which sits inside
              $f(A)$, and the codomain is unchanged — so restricting can only
              make coverage worse.
          - text: >
              Injectivity, since fewer inputs means fewer chances to collide.
            correct: true
            feedback: >
              Yes. Removing one member of every colliding pair leaves an
              injective function, which is exactly how $\arcsin$ becomes
              definable from $\sin$.
          - text: >
              Neither — restricting cannot change whether a property holds.
            feedback: >
              Restricting changes the domain, and injectivity is a condition
              about the domain. The parity function on $\{1,2,3,4\}$ is not
              injective, and its restriction to $\{1,2\}$ is.
        feedback: >
          Injectivity can be gained and surjectivity can be lost, and neither
          can happen the other way round.
      - teach: >
          Going the other way is a different kind of problem. An extension of
          $f : A \to B$ is a $g : A' \to B$ with $A \subseteq A'$ agreeing with
          $f$ on all of $A$. On the new points $g$ is unconstrained, so nothing
          is determined and nothing is guaranteed.
      - ask: >
          Let $f : \{1,2\} \to \{a,b,c\}$ with $f(1) = a$ and $f(2) = b$. How
          many extensions of $f$ to the domain $\{1,2,3\}$, with the same
          codomain, are there?
        expects: "3"
        hint: >
          The values at $1$ and $2$ are forced. Count the choices at the one
          new point.
        feedback: >
          Three. An extension must send $1 \mapsto a$ and $2 \mapsto b$, and
          $3$ may go to any of $a$, $b$ or $c$ — three functions, all of them
          extensions, none of them preferred. That non-uniqueness is the whole
          contrast with restriction.
      - ask: >
          Why is $\sin$ usually restricted to $[-\pi/2, \pi/2]$ before an
          inverse is discussed?
        choices:
          - text: >
              Because $\sin$ is not injective on $\mathbb{R}$, and the
              restriction is.
            correct: true
            feedback: >
              Right — $\sin 0 = \sin \pi = 0$ is one collision among infinitely
              many, and cutting the domain down to that interval removes all of
              them.
          - text: >
              Because $\sin$ is not surjective onto $\mathbb{R}$, and the
              restriction is.
            feedback: >
              Restricting a domain never improves coverage. Surjectivity is
              handled separately, by declaring the codomain to be $[-1,1]$.
          - text: >
              Because $\sin$ is not a function on all of $\mathbb{R}$.
            feedback: >
              It is a perfectly good function on $\mathbb{R}$: every real
              number has exactly one sine. The defect is collisions, not
              missing values.
        feedback: >
          The restriction exists to kill collisions. Coverage is fixed by a
          different move — choosing the codomain — and the two repairs should
          not be confused.
      - teach: >
          Shrink the domain and you get a function for free. Enlarge it and you
          are making choices that may be plentiful or impossible. That
          asymmetry is worth carrying into every later subject.

  - node: foundations.functions.def-inverse
    hook: >
      "Undoing" a function is not a primitive notion — it has to be defined —
      and the striking consequence of the definition is that a function can be
      undone in at most one way.
    explanation: >
      A function $g : B \to A$ is a two-sided inverse of $f : A \to B$ when
      $g \circ f = \mathrm{id}_A$ and $f \circ g = \mathrm{id}_B$. Pointwise
      the two equations read $g(f(a)) = a$ for every $a \in A$, and
      $f(g(b)) = b$ for every $b \in B$: a round trip starting in $A$ returns
      you to where you began, and so does a round trip starting in $B$. They
      are separate conditions on separate sets, and neither implies the other.

      Both really are needed. Let $f : \{1,2\} \to \{1,2,3\}$ send
      $1 \mapsto 1$, $2 \mapsto 2$, and let $g : \{1,2,3\} \to \{1,2\}$ send
      $1 \mapsto 1$, $2 \mapsto 2$, $3 \mapsto 2$. Then $g(f(1)) = 1$ and
      $g(f(2)) = 2$, so $g \circ f = \mathrm{id}_{\{1,2\}}$ exactly. The other
      composite fails: $f(g(3)) = f(2) = 2$, which is not $3$. One equation
      holds and the other does not.

      Now the fact that makes the notation possible. Suppose $g$ and $h$ are
      both inverses of $f$. Then $g = g \circ \mathrm{id}_B = g \circ (f \circ
      h) = (g \circ f) \circ h = \mathrm{id}_A \circ h = h$. Read the steps:
      neutrality of $\mathrm{id}_B$; the equation $f \circ h = \mathrm{id}_B$
      coming from $h$ being a *right* inverse; associativity, which is the only
      non-formal step; the equation $g \circ f = \mathrm{id}_A$ coming from $g$
      being a *left* inverse; neutrality again. The argument uses one equation
      from each of the two candidates, which is another sign that the
      definition needs both.

      An inverse is therefore unique when it exists, so it deserves a name:
      write $f^{-1}$ and call $f$ invertible. The symbol now has two jobs — the
      inverse function, and the preimage of a set — and they are compatible:
      when $f$ is invertible, the fiber $f^{-1}(\{b\})$ is the one-element set
      containing the value of the inverse function at $b$.
    worked: >
      Let $f : \{1,2,3\} \to \{a,b,c\}$ with $f(1) = b$, $f(2) = c$,
      $f(3) = a$, and propose $g : \{a,b,c\} \to \{1,2,3\}$ with $g(a) = 3$,
      $g(b) = 1$, $g(c) = 2$. Check the first equation at all three points:
      $g(f(1)) = g(b) = 1$; $g(f(2)) = g(c) = 2$; $g(f(3)) = g(a) = 3$. So
      $g \circ f = \mathrm{id}_{\{1,2,3\}}$. Check the second: $f(g(a)) =
      f(3) = a$; $f(g(b)) = f(1) = b$; $f(g(c)) = f(2) = c$. So
      $f \circ g = \mathrm{id}_{\{a,b,c\}}$. Both hold, so $g$ is *the* inverse
      and we may write $g = f^{-1}$, with $f^{-1}(a) = 3$.
    pitfalls: >
      Checking one equation and stopping is the standard error, and the
      one-sided example above shows it is a real gap rather than a formality.
      An inverse must be declared the right way round — a function $B \to A$,
      with the sets swapped — so a candidate with the wrong domain is not a
      near miss but a type error. And $f^{-1}$ as a function is a much stronger
      claim than $f^{-1}$ applied to a set, which every function supports.
    recap: >
      An inverse of $f$ is a $g$ with $g \circ f$ and $f \circ g$ both
      identities, and associativity forces it to be unique, which is why the
      notation $f^{-1}$ is unambiguous.
    steps:
      - teach: >
          With identity maps available, "undoing" can finally be written as an
          equation rather than described in words. The question is which
          equation, and the answer turns out to be two of them.
      - teach: >
          A function $g : B \to A$ is a two-sided inverse of $f : A \to B$ when
          $g \circ f = \mathrm{id}_A$ and $f \circ g = \mathrm{id}_B$. Note the
          declaration: an inverse runs the other way, from $B$ to $A$.
      - teach: >
          Pointwise the two equations say $g(f(a)) = a$ for every $a$ in $A$,
          and $f(g(b)) = b$ for every $b$ in $B$. Two round trips, starting on
          two different sides, each returning you to your starting point.
      - ask: >
          Let $f : \{1,2,3\} \to \{4,5,6\}$ with $f(1) = 6$, $f(2) = 4$,
          $f(3) = 5$, and let $g$ be its two-sided inverse. What is $g(5)$?
        expects: "3"
        hint: >
          $g$ must send each value back to the input it came from.
        feedback: >
          Three, because $f(3) = 5$ and the equation $g(f(a)) = a$ at $a = 3$
          forces $g(5) = 3$. Reading the table backwards gives all of $g$:
          $g(4) = 2$, $g(5) = 3$, $g(6) = 1$.
      - teach: >
          At most one function can do this. If $g$ and $h$ are both inverses
          then $g = g \circ \mathrm{id}_B = g \circ (f \circ h) = (g \circ f)
          \circ h = \mathrm{id}_A \circ h = h$ — so the inverse deserves the
          name $f^{-1}$.
      - ask: >
          Which fact makes the middle step of that chain, from
          $g \circ (f \circ h)$ to $(g \circ f) \circ h$, legal?
        choices:
          - text: >
              Composition is commutative.
            feedback: >
              It is not, and the step does not reorder anything: $g$, $f$ and
              $h$ appear in the same sequence on both sides. Only the brackets
              moved.
          - text: >
              Composition is associative.
            correct: true
            feedback: >
              Exactly — this is the one substantive step in the chain, and it
              is why uniqueness of inverses is really a fact about
              associativity rather than about functions specifically.
          - text: >
              $\mathrm{id}_B$ is a neutral element.
            feedback: >
              That justifies the first and last steps of the chain, not this
              one. Here no identity map is involved; the brackets are being
              regrouped.
        feedback: >
          Associativity. The chain also uses one equation from each candidate,
          which is a hint that the definition genuinely needs both.
      - ask: >
          For $f : \{1,2\} \to \{1,2,3\}$ with $f(1) = 1$, $f(2) = 2$ and
          $g : \{1,2,3\} \to \{1,2\}$ with $g(1) = 1$, $g(2) = 2$, $g(3) = 2$,
          is $g$ an inverse of $f$?
        choices:
          - text: >
              Yes — $g(f(a)) = a$ for every $a$ in the domain of $f$.
            feedback: >
              That equation does hold, and it is only half the definition. The
              other composite has to be checked on all of $\{1,2,3\}$.
          - text: >
              No — $g \circ f$ is the identity, but $f(g(3)) = 2 \ne 3$.
            correct: true
            feedback: >
              Right. One equation holds exactly and the other fails at a single
              point, which is enough: the two conditions are genuinely
              independent.
          - text: >
              No — $g$ is not declared the right way round.
            feedback: >
              The declaration is fine: $f$ goes from $\{1,2\}$ to $\{1,2,3\}$
              and $g$ comes back the other way, as an inverse must. The failure
              is in the second equation.
        feedback: >
          Half an inverse is not an inverse. Always evaluate both composites,
          each on its own set.
      - teach: >
          So invertibility is a strong condition, and when it holds the
          undoing map is completely determined. What remains is to say which
          functions have one — and the answer is already sitting in the
          vocabulary you built earlier.

  - node: foundations.functions.inverse-iff-bijection
    hook: >
      Two ideas developed on opposite sides of this unit — pairing two sets up
      perfectly, and undoing a function — turn out to be the same idea. This is
      the theorem the whole unit has been walking toward.
    explanation: >
      Suppose first that $f : A \to B$ has an inverse $g$. The equation
      $g \circ f = \mathrm{id}_A$ alone forces injectivity, and this is the
      load-bearing step: if $f(a_1) = f(a_2)$, apply $g$ to both sides to get
      $g(f(a_1)) = g(f(a_2))$, and each side collapses to its input, so
      $a_1 = a_2$. A left inverse recovers the input from the output, and a
      function that lets you do that cannot have sent two inputs to one place.
      The equation $f \circ g = \mathrm{id}_B$ alone forces surjectivity: any
      $b \in B$ satisfies $b = f(g(b))$, so $g(b)$ is a witness. Hence an
      invertible function is bijective.

      Now the converse. Let $f$ be bijective and try to build $g$. For $b \in
      B$, surjectivity supplies at least one $a$ with $f(a) = b$, and
      injectivity says there is no second one. So the rule "send $b$ to that
      $a$" is well defined — and notice that the two halves of bijectivity are
      supplying exactly the two halves of being a function. Existence gives
      totality: no $b$ is left without a value. Uniqueness gives
      single-valuedness: no $b$ gets two. That is the whole of the converse; the
      equations then hold by construction, since $g(f(a))$ is the unique input
      mapping to $f(a)$, which is $a$, and $f(g(b)) = b$ is how $g(b)$ was
      chosen.

      Two consequences drop out. The defining equations are symmetric in $f$
      and $g$, so $f^{-1}$ is itself invertible with inverse $f$, giving
      $(f^{-1})^{-1} = f$; and $f^{-1}$ is therefore itself a bijection. In
      fiber language the theorem is short: $f$ is invertible exactly when every
      fiber $f^{-1}(\{b\})$ is a single point, and $f^{-1}$ is the function
      picking that point out.
    worked: >
      Let $f : \{1,2,3,4\} \to \{1,2,3,4\}$ with $f(1) = 3$, $f(2) = 1$,
      $f(3) = 4$, $f(4) = 2$. Check bijectivity from the list of values
      $3, 1, 4, 2$: all four are distinct, so $f$ is injective, and between
      them they exhaust the codomain, so $f$ is surjective. The theorem
      promises an inverse, and the proof tells you how to build it — read the
      table backwards. Since $f(2) = 1$, set $f^{-1}(1) = 2$; since $f(4) = 2$,
      set $f^{-1}(2) = 4$; since $f(1) = 3$, set $f^{-1}(3) = 1$; since
      $f(3) = 4$, set $f^{-1}(4) = 3$. Spot-check both equations:
      $f^{-1}(f(3)) = f^{-1}(4) = 3$, and $f(f^{-1}(2)) = f(4) = 2$. By
      contrast, $x \mapsto x^{2}$ on $\mathbb{R}$ has no inverse: the fiber
      over $1$ is $\{-1, 1\}$, so "the input that maps to $1$" names two
      things, and no rule can be extracted.
    pitfalls: >
      Writing down $f^{-1}$ before checking both halves is the usual error, and
      the failure is specific: without injectivity the rule is not
      single-valued, and without surjectivity it is not total. Keep the two
      readings of $f^{-1}$ apart, since $f^{-1}(T)$ as a preimage is available
      for every function while $f^{-1}$ as a function is available only here.
      And the theorem is about the declared triple — the same rule can be
      invertible with one codomain and not with another.
    recap: >
      A function has a two-sided inverse exactly when it is bijective, because
      surjectivity supplies the values of the inverse and injectivity makes
      them unique.
    steps:
      - teach: >
          You have two apparently different ideas: a bijection pairs the two
          sets element for element, and an inverse undoes the function. This
          step says they are the same condition.
      - teach: >
          Start with the easy direction. Suppose $g$ is an inverse of $f$. Each
          of the two equations does one job, and they can be used separately.
      - teach: >
          The equation $g \circ f = \mathrm{id}_A$ forces injectivity. From
          $f(a_1) = f(a_2)$, apply $g$ to both sides: the left becomes $a_1$,
          the right becomes $a_2$, so they are equal. Recovering the input from
          the output is precisely what forbids collisions.
      - ask: >
          Why does a left inverse — a $g$ with $g \circ f = \mathrm{id}_A$ —
          force $f$ to be injective?
        choices:
          - text: >
              Because $g$ is itself injective.
            feedback: >
              Nothing was assumed about $g$, and in fact $g$ need not be
              injective at all. The argument uses only the equation, applied to
              both sides of $f(a_1) = f(a_2)$.
          - text: >
              Because applying $g$ to $f(a_1) = f(a_2)$ turns it into
              $a_1 = a_2$.
            correct: true
            feedback: >
              Exactly the load-bearing step. Each side collapses under the
              equation $g(f(a)) = a$, so the two inputs were equal all along.
          - text: >
              Because every element of $B$ is $f(a)$ for some $a$.
            feedback: >
              That is a coverage statement and it does not follow from the left
              equation. It is what the *other* equation, $f \circ g =
              \mathrm{id}_B$, would give you.
        feedback: >
          Apply $g$ to both sides of an assumed collision and it disappears.
          That single move is the heart of the whole theorem.
      - teach: >
          The other equation does the other job. If $f \circ g = \mathrm{id}_B$
          then any $b$ satisfies $b = f(g(b))$, so $g(b)$ is a witness and $f$
          is surjective. An invertible function is therefore bijective.
      - teach: >
          For the converse, let $f$ be bijective and build $g$. Given $b$,
          surjectivity supplies an $a$ with $f(a) = b$ and injectivity says
          there is only one, so "send $b$ to that $a$" is a legitimate rule —
          existence gives totality and uniqueness gives single-valuedness.
      - ask: >
          How many invertible functions $\{1,2,3\} \to \{1,2,3\}$ are there?
        expects: "6"
        hint: >
          Invertible means bijective, and a bijection from a finite set to
          itself assigns distinct values.
        feedback: >
          Six. Invertible is bijective, and a bijection here assigns distinct
          values to the three inputs: $3$ choices for the first, then $2$, then
          $1$, giving $3 \times 2 \times 1 = 6$. The other $27 - 6 = 21$
          functions on this set all collide somewhere.
      - ask: >
          Why does $x \mapsto x^{2}$ on $\mathbb{R} \to \mathbb{R}$ fail to
          have an inverse?
        choices:
          - text: >
              Because the fiber over $1$ contains both $-1$ and $1$, so the
              rule for $g(1)$ is not single-valued.
            correct: true
            feedback: >
              Right, and that is injectivity failing. There is also a coverage
              failure — the fiber over $-1$ is empty, so $g(-1)$ would have no
              value at all — and either one alone is fatal.
          - text: >
              Because no formula for the reverse rule can be written down.
            feedback: >
              The square root is perfectly writable. The obstruction is not
              notational: no function whatsoever satisfies both equations here.
          - text: >
              Because the preimage $f^{-1}(T)$ is undefined for this $f$.
            feedback: >
              Preimages are defined for every function, this one included. The
              inverse *function* is what fails to exist, and the two uses of
              the symbol should not be confused.
        feedback: >
          Both halves fail here, and either failure suffices: two points in a
          fiber breaks single-valuedness, and an empty fiber breaks totality.
      - teach: >
          In fiber language the theorem is one line: $f$ is invertible exactly
          when every fiber holds exactly one point, and $f^{-1}$ is the
          function that picks that point out.

  - node: foundations.functions.inverse-of-composite
    hook: >
      Socks then shoes. To undo the pair you take the shoes off first, and the
      same reversal governs every composite of invertible maps — a detail that
      is dropped constantly.
    explanation: >
      If $f : A \to B$ and $g : B \to C$ are bijections then $g \circ f$ is a
      bijection, since injectivity and surjectivity both survive composition,
      so it has an inverse. The claim is that the inverse is
      $f^{-1} \circ g^{-1}$, in that order.

      Check the declarations before anything else, because they already give
      the answer away. Since $g^{-1} : C \to B$ and $f^{-1} : B \to A$, the
      composite $f^{-1} \circ g^{-1}$ runs from $C$ to $A$ — exactly the shape
      an inverse of $g \circ f : A \to C$ must have. The other order is usually
      not even a legal expression: $g^{-1} \circ f^{-1}$ would need the
      codomain of $f^{-1}$, which is $A$, to be the domain of $g^{-1}$, which
      is $C$.

      The verification is a regrouping. Compute $(f^{-1} \circ g^{-1}) \circ
      (g \circ f)$; associativity lets you drop all the brackets and reassemble
      the middle, giving $f^{-1} \circ (g^{-1} \circ g) \circ f = f^{-1} \circ
      \mathrm{id}_B \circ f = f^{-1} \circ f = \mathrm{id}_A$. The same
      computation on the other side gives $\mathrm{id}_C$. So $f^{-1} \circ
      g^{-1}$ satisfies both defining equations, and since inverses are unique
      it *is* $(g \circ f)^{-1}$.

      The picture is worth keeping. $g \circ f$ does $f$ and then $g$; undoing
      it must undo $g$ and then undo $f$. Last on, first off.
    worked: >
      Let $f : \{1,2,3\} \to \{a,b,c\}$ send $1 \mapsto b$, $2 \mapsto c$,
      $3 \mapsto a$, and let $g : \{a,b,c\} \to \{x,y,z\}$ send $a \mapsto y$,
      $b \mapsto z$, $c \mapsto x$. Both are bijections. The composite
      $g \circ f$ sends $1 \mapsto z$, $2 \mapsto x$, $3 \mapsto y$, so reading
      that table backwards, $(g \circ f)^{-1}$ sends $x \mapsto 2$,
      $y \mapsto 3$, $z \mapsto 1$. Now build $f^{-1} \circ g^{-1}$ instead.
      Reading each table backwards, $g^{-1}$ sends $x \mapsto c$,
      $y \mapsto a$, $z \mapsto b$, and $f^{-1}$ sends $a \mapsto 3$,
      $b \mapsto 1$, $c \mapsto 2$. Then $f^{-1}(g^{-1}(x)) = f^{-1}(c) = 2$,
      $f^{-1}(g^{-1}(y)) = f^{-1}(a) = 3$, and $f^{-1}(g^{-1}(z)) =
      f^{-1}(b) = 1$. The same three values, so the two functions agree.
    pitfalls: >
      Writing $(g \circ f)^{-1} = g^{-1} \circ f^{-1}$ is the error, and on
      distinct sets it does not even typecheck, which is a mercy — when all
      three sets are equal it typechecks fine and is simply wrong. Both maps
      must be bijections for the statement to apply at all; a composite can be
      invertible while its factors are not.
    recap: >
      $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$ — undo the last step first, and
      the reversed order is forced by the sets as much as by the algebra.
    steps:
      - teach: >
          You put on socks and then shoes. To undo that you take the shoes off
          first. Composites of invertible functions obey the same rule, and the
          reversal is not a convention but a consequence.
      - teach: >
          If $f : A \to B$ and $g : B \to C$ are bijections then so is
          $g \circ f$, since both properties survive composition. So
          $(g \circ f)^{-1}$ exists, and the only question is what it equals.
      - teach: >
          Let the declarations decide. $g^{-1}$ runs $C \to B$ and $f^{-1}$
          runs $B \to A$, so $f^{-1} \circ g^{-1}$ runs $C \to A$ — the right
          shape. The other order would need $A$ and $C$ to be the same set.
      - ask: >
          For bijections $f : A \to B$ and $g : B \to C$, what is
          $(g \circ f)^{-1}$?
        choices:
          - text: >
              $g^{-1} \circ f^{-1}$
            feedback: >
              This is the reflex answer and it is wrong. It also usually fails
              to typecheck: $f^{-1}$ lands in $A$, and $g^{-1}$ expects an
              input from $C$.
          - text: >
              $f^{-1} \circ g^{-1}$
            correct: true
            feedback: >
              Yes. Undo $g$ first, since $g$ acted last, then undo $f$. The
              sets confirm it: $C \to B \to A$.
          - text: >
              $(f \circ g)^{-1}$
            feedback: >
              The composite $f \circ g$ generally does not exist, and where it
              does it is a different function from $g \circ f$, so its inverse
              is no help.
        feedback: >
          Reverse the order: $f^{-1} \circ g^{-1}$. Last map on, first map off.
      - teach: >
          The proof is a regrouping. $(f^{-1} \circ g^{-1}) \circ (g \circ f) =
          f^{-1} \circ (g^{-1} \circ g) \circ f = f^{-1} \circ \mathrm{id}_B
          \circ f = \mathrm{id}_A$, with associativity doing the reassembly and
          the identity vanishing. The other side is the same computation.
      - ask: >
          Let $f, g : \{1,2,3\} \to \{1,2,3\}$ with $f(1) = 2$, $f(2) = 3$,
          $f(3) = 1$ and $g(1) = 1$, $g(2) = 3$, $g(3) = 2$. What is
          $(g \circ f)^{-1}(1)$?
        expects: "3"
        hint: >
          Tabulate $g \circ f$ first, then find the input that lands on $1$.
        feedback: >
          Three. The composite sends $1 \mapsto g(2) = 3$, $2 \mapsto g(3) =
          2$, $3 \mapsto g(1) = 1$, so the input landing on $1$ is $3$. The
          formula agrees: $g^{-1}(1) = 1$ and $f^{-1}(1) = 3$, so
          $(f^{-1} \circ g^{-1})(1) = 3$.
      - ask: >
          When $A = B = C$, both $f^{-1} \circ g^{-1}$ and $g^{-1} \circ
          f^{-1}$ are defined. Are they both inverses of $g \circ f$?
        choices:
          - text: >
              Yes — with all the sets equal, the order stops mattering.
            feedback: >
              Composition is still not commutative on a single set. The
              typechecking objection disappears and the mathematical one does
              not.
          - text: >
              No — inverses are unique, so only $f^{-1} \circ g^{-1}$ is one,
              and the other is generally a different function.
            correct: true
            feedback: >
              Right, and uniqueness makes this airtight: at most one function
              can satisfy both equations, and $f^{-1} \circ g^{-1}$ does.
          - text: >
              No — neither is an inverse unless $f$ and $g$ commute.
            feedback: >
              Commuting is not required. $f^{-1} \circ g^{-1}$ is the inverse
              of $g \circ f$ for any pair of bijections, commuting or not.
        feedback: >
          Only the reversed order works, and it works always. Equal sets remove
          the typechecking guardrail without changing the mathematics.
      - teach: >
          Every algebraic structure built out of invertible maps inherits this
          rule, so it is worth over-learning now: the inverse of a chain is the
          chain of inverses, read backwards.

  - node: foundations.functions.one-sided-inverses
    hook: >
      Invertibility splits cleanly in half. A function that loses no
      information can be undone from one side, one that reaches everything can
      be undone from the other, and neither half-undoing is unique.
    explanation: >
      Let $f : A \to B$. A left inverse is a $g : B \to A$ with
      $g \circ f = \mathrm{id}_A$; a right inverse is a $g : B \to A$ with
      $f \circ g = \mathrm{id}_B$. Assume throughout that $A$ is nonempty — the
      hypothesis matters only in a degenerate case flagged below.

      A left inverse exists exactly when $f$ is injective. One direction is the
      step you have already seen: applying $g$ to $f(a_1) = f(a_2)$ collapses
      both sides to their inputs. For the other, suppose $f$ is injective and
      build $g$. For $b$ in the range, the fiber $f^{-1}(\{b\})$ has exactly
      one element, so set $g(b)$ to be it. For $b$ outside the range the fiber
      is empty and nothing is forced, so send $b$ to any fixed $a_0 \in A$ —
      this is the one place nonemptiness of $A$ is used. Then $g(f(a)) = a$ by
      construction. The freedom off the range is real, which is why left
      inverses are usually not unique.

      A right inverse exists exactly when $f$ is surjective. Again one
      direction is immediate: $b = f(g(b))$ exhibits a witness for every $b$.
      For the other, surjectivity says every fiber $f^{-1}(\{b\})$ is nonempty,
      so choose one element from each and let $g(b)$ be the chosen one. Making
      infinitely many such choices at once is exactly the axiom of choice, and
      this is where it enters the theory of functions.

      Having both kinds at once is having a two-sided inverse, which happens
      exactly for bijections, and then the uniqueness argument forces every
      left inverse and every right inverse to be the same function $f^{-1}$.
      The degenerate case: if $A = \emptyset$ and $B$ is not, the unique
      function $\emptyset \to B$ is injective and has no left inverse at all,
      because there is no function $B \to \emptyset$ to be one.
    worked: >
      Let $f : \{1,2\} \to \{1,2,3\}$ with $f(1) = 1$ and $f(2) = 2$. It is
      injective and not surjective. Its left inverses are the functions
      $g : \{1,2,3\} \to \{1,2\}$ with $g(f(1)) = 1$ and $g(f(2)) = 2$, that
      is, $g(1) = 1$ and $g(2) = 2$ — while $g(3)$ is completely unconstrained,
      since $3$ is not a value of $f$. So $g(3)$ may be $1$ or $2$, and $f$ has
      exactly two left inverses. It has no right inverse: whatever $g$ is,
      $f(g(3))$ lies in $\{1,2\}$ and can never equal $3$, which is what the
      failure of surjectivity costs.
    pitfalls: >
      The pairing is easy to invert in memory: left inverse with injective,
      right inverse with surjective. Fix it by the mechanism — a left inverse
      recovers inputs, which is what injectivity is about. Treating a one-sided
      inverse as unique is the other trap, and the freedom is concrete: a left
      inverse may do anything at all off the range of $f$. And the empty domain
      really is an exception, not a formality.
    recap: >
      $f$ has a left inverse exactly when it is injective and a right inverse
      exactly when it is surjective, and neither one-sided inverse is unique
      unless $f$ is a bijection.
    steps:
      - teach: >
          A two-sided inverse asked for two equations at once, and bijectivity
          was the price. Ask for one equation at a time and you get exactly one
          of the two adjectives — a much cheaper deal.
      - teach: >
          For $f : A \to B$ with $A$ nonempty: a left inverse is a $g$ with
          $g \circ f = \mathrm{id}_A$, and a right inverse is a $g$ with
          $f \circ g = \mathrm{id}_B$. Both run from $B$ to $A$; only the side
          of the composition differs.
      - teach: >
          Left inverse means injective. Forwards, apply $g$ to $f(a_1) =
          f(a_2)$ and the inputs pop out equal. Backwards, define $g(b)$ to be
          the unique element of the fiber when $b$ is a value, and anything at
          all when it is not.
      - ask: >
          Which property does the existence of a *right* inverse correspond to?
        choices:
          - text: >
              Injectivity — a right inverse recovers the input from the output.
            feedback: >
              That describes a left inverse, where $g(f(a)) = a$ starts in the
              domain. A right inverse satisfies $f(g(b)) = b$ and starts in the
              codomain.
          - text: >
              Surjectivity — $b = f(g(b))$ exhibits a witness for every $b$.
            correct: true
            feedback: >
              Exactly, and the converse construction is to pick one element
              from each fiber, every fiber being nonempty precisely because $f$
              is surjective.
          - text: >
              Neither — one-sided inverses exist for every function.
            feedback: >
              They do not. A function missing a value of its codomain can have
              no right inverse, since $f(g(b)) = b$ would make $b$ a value.
        feedback: >
          Right inverse with surjective, left inverse with injective. Recover
          the pairing from the equations rather than from the words.
      - teach: >
          Building a right inverse means choosing one element from each
          nonempty fiber. For infinitely many fibers that is an application of
          the axiom of choice — the one genuinely non-constructive step in this
          whole unit.
      - ask: >
          Let $f : \{1,2\} \to \{1,2,3\}$ with $f(1) = 1$ and $f(2) = 2$. How
          many left inverses does $f$ have?
        expects: "2"
        hint: >
          The values of $g$ on the range of $f$ are forced. Count the freedom
          at the remaining point.
        feedback: >
          Two. A left inverse $g : \{1,2,3\} \to \{1,2\}$ must satisfy
          $g(1) = 1$ and $g(2) = 2$, while $g(3)$ is unconstrained because $3$
          is not a value of $f$ — so $g(3)$ may be $1$ or $2$. That freedom is
          exactly why one-sided inverses are not unique.
      - ask: >
          When do a left inverse and a right inverse of the same $f$ have to be
          the same function?
        choices:
          - text: >
              Always — any two inverses of $f$ coincide.
            feedback: >
              Uniqueness was proved for *two-sided* inverses, and its proof
              used one equation from each candidate. A left inverse alone can
              be one of many.
          - text: >
              When $f$ has both kinds, which happens exactly when $f$ is
              bijective — and then both equal $f^{-1}$.
            correct: true
            feedback: >
              Right. Having both makes $f$ injective and surjective, and the
              uniqueness chain then collapses every left inverse and every
              right inverse onto the single function $f^{-1}$.
          - text: >
              Never — the two kinds are defined by different equations.
            feedback: >
              Different equations can be satisfied by the same function, and
              for a bijection they are: $f^{-1}$ is simultaneously the only
              left inverse and the only right inverse.
        feedback: >
          Only when $f$ is a bijection. Short of that, one side can be undone
          in many ways and the other side not at all.
      - teach: >
          So the two adjectives are exactly the two halves of reversibility,
          one on each side. The degenerate exception is worth remembering: with
          an empty domain and a nonempty codomain, injectivity holds and no
          left inverse exists, because no function into the empty set does.

  - node: foundations.functions.def-sequence
    hook: >
      A sequence looks like a new kind of object and is not: it is a function
      on the natural numbers wearing different notation, and reading it that
      way keeps a sequence from being confused with the set of its terms.
    explanation: >
      A sequence of elements of a set $X$ is a function $x : \mathbb{N} \to X$.
      The only novelty is notation. One writes $x_n$ instead of $x(n)$, calls
      it the $n$th term, and denotes the whole function by
      $(x_n)_{n \in \mathbb{N}}$. A finite sequence, or $n$-tuple, is the same
      thing with domain $\{1, 2, \dots, n\}$.

      Everything you know about functions now applies without translation. A
      sequence has a range, $\{x_n : n \in \mathbb{N}\}$, which is the set of
      values it takes; it may be injective, meaning no term is ever repeated;
      it may be constant. Two sequences are equal when they are equal as
      functions, so they must agree term by term at every index.

      The distinction that the function language protects is between the
      sequence and its range. The sequence with terms $1, 0, 1, 0, \dots$ has
      an infinite domain and a two-element range, because the range is a set
      and a set records nothing about order or repetition. The sequence with
      terms $0, 1, 0, 1, \dots$ has the same range and is a different function
      — they disagree at every index. Informal notation blurs the two objects
      constantly, and every "does the sequence converge?" question later on is
      a question about the function, not about the set.

      This is also why $x_n$ and $(x_n)$ are different kinds of thing. The
      first is an element of $X$; the second is a function. Writing "the
      sequence $x_n$" is a harmless abbreviation right up until a proof needs
      to quantify over indices, at which point the distinction has to be
      available.
    worked: >
      Let $x : \mathbb{N} \to \mathbb{Z}$ be $x_n = (-1)^{n}$. The terms
      alternate: the value is $1$ at every even index and $-1$ at every odd
      one. So the range is $\{-1, 1\}$, a two-element set, while the domain is
      infinite — the function takes infinitely many values in the sense of
      infinitely many index-value pairs, and exactly two in the sense of the
      set of outputs. Is the sequence injective? No, and one pair proves it:
      $x_1 = -1 = x_3$ while $1 \ne 3$. Compare $y_n = n^{2}$, which is
      injective, since $n_1^{2} = n_2^{2}$ with both indices natural numbers
      forces $n_1 = n_2$, and whose range is the set of perfect squares.
    pitfalls: >
      The sequence and the set of its terms are different objects, and the set
      forgets both order and repetition — the alternating sequence has two
      terms in the range and infinitely many indices. Keep $x_n$, an element,
      apart from $(x_n)_{n \in \mathbb{N}}$, a function. And a finite sequence
      is a function on $\{1,\dots,n\}$, not a set, which is precisely why
      $(1,2,2)$ and $(2,1,2)$ are different tuples while $\{1,2,2\}$ and
      $\{2,1,2\}$ are the same set.
    recap: >
      A sequence in $X$ is a function $\mathbb{N} \to X$ written with
      subscripts, so it is a different object from its range, which forgets
      order and repetition.
    steps:
      - teach: >
          Lists indexed by $1, 2, 3, \dots$ turn up everywhere, and it is
          tempting to treat them as a primitive notion. They are not: a list
          indexed by the natural numbers is a function defined on them.
      - teach: >
          A sequence in $X$ is a function $x : \mathbb{N} \to X$. Write $x_n$
          for $x(n)$ and $(x_n)_{n \in \mathbb{N}}$ for the function itself. A
          finite sequence, or $n$-tuple, has domain $\{1,2,\dots,n\}$ instead.
      - teach: >
          The payoff is that the whole vocabulary transfers. A sequence has a
          range; it is injective exactly when no term repeats; two sequences
          are equal exactly when they agree at every index, since that is what
          equality of functions says.
      - ask: >
          Let $x : \mathbb{N} \to \mathbb{Z}$ send $n$ to the remainder of $n$
          on division by $3$. How many elements does the range of this sequence
          have?
        expects: "3"
        hint: >
          The terms cycle. List one full cycle and collect the distinct values.
        feedback: >
          Three. The terms run $\dots, 0, 1, 2, 0, 1, 2, \dots$, so every one
          of $0, 1, 2$ occurs and nothing else does: the range is $\{0,1,2\}$.
          Infinitely many terms, three values — the range is a set and does not
          count repetitions.
      - teach: >
          That gap is the point of the definition. The sequence records order
          and repetition because it is a function on the indices; its range
          records neither, because it is a set of values.
      - ask: >
          Are the sequences with terms $1, 0, 1, 0, \dots$ and $0, 1, 0, 1,
          \dots$ the same sequence?
        choices:
          - text: >
              Yes — they have the same range $\{0,1\}$ and the same values
              appear.
            feedback: >
              Equal ranges do not make equal functions, exactly as two
              different functions can share a range. Equality of sequences is
              checked index by index.
          - text: >
              No — as functions on $\mathbb{N}$ they disagree at every index.
            correct: true
            feedback: >
              Right. They are equal as sets of values and different as
              functions, and it is the function that the word "sequence"
              names.
          - text: >
              Neither is a sequence, since the terms repeat.
            feedback: >
              Repetition is entirely allowed — a constant sequence is a
              sequence. Nothing in the definition of a function forbids two
              inputs from sharing a value.
        feedback: >
          Different functions, same range. The set of terms is a shadow of the
          sequence and does not determine it.
      - ask: >
          What is a finite sequence, or $n$-tuple, in this language?
        choices:
          - text: >
              A function with domain $\{1, 2, \dots, n\}$.
            correct: true
            feedback: >
              Yes, and that is why $(1,2,2)$ and $(2,1,2)$ are different
              tuples: they disagree at index $1$, even though the underlying
              sets of values coincide.
          - text: >
              A set with $n$ elements.
            feedback: >
              A set forgets order and repetition, so it cannot be a tuple:
              $\{1,2,2\}$ and $\{2,1,2\}$ are the same set while the
              corresponding tuples are not the same function.
          - text: >
              A sequence whose range is finite.
            feedback: >
              The range of the alternating sequence is finite and its domain is
              all of $\mathbb{N}$, so that condition describes something else
              entirely.
        feedback: >
          It is a function on a finite index set. Everything distinctive about
          tuples — order, repetition, position — is exactly what a function on
          indices records and a set does not.
      - teach: >
          Reading sequences as functions costs nothing and buys the whole
          vocabulary of this unit. Every later statement about limits and
          subsequences is a statement about a function on $\mathbb{N}$.

  - node: foundations.functions.pigeonhole
    hook: >
      More objects than boxes means some box holds two. It is the most obvious
      statement in mathematics and one of the most productive, and stated for
      functions it becomes a precise tool rather than a slogan.
    explanation: >
      First the counting language. Say a set $A$ is finite with $|A| = n$ when
      there is a bijection $A \to \{1, 2, \dots, n\}$ — the bijection is the
      pairing that makes "counting $A$" mean something. Next the structural
      fact: for any $f : A \to B$, the fibers $f^{-1}(\{b\})$ partition $A$,
      since every $a$ lies in exactly one of them, namely the fiber over its
      own single value $f(a)$.

      Now the theorem. Let $A$ and $B$ be finite with $|A| > |B|$. Then no
      $f : A \to B$ is injective, and concretely some $b$ has
      $|f^{-1}(\{b\})| \ge 2$. The proof is the counting argument you would
      expect: there are $|B|$ fibers and their sizes add up to $|A|$; if every
      fiber had at most one element, that sum would be at most $|B|$, which is
      less than $|A|$. Contradiction, so some fiber has at least two.

      The form used in practice is the contrapositive: if an injection $A \to
      B$ between finite sets exists then $|A| \le |B|$. That sentence is how
      pigeonhole is actually deployed — you exhibit an injection and conclude
      an inequality between sizes.

      There is a sharper version worth having. If $|A| = m$ and $|B| = n \ge 1$
      then for every $f : A \to B$ some fiber has at least $m/n$ elements, and
      since sizes are whole numbers, at least $\lceil m/n \rceil$. Same
      argument: if all $n$ fibers had fewer than $m/n$ elements, their sizes
      would total less than $m$, and they must total exactly $m$.
    worked: >
      Take $100$ people and the function sending each person to their birth
      month, so $m = 100$ and $n = 12$. Since $100 > 12$, the basic form
      already tells you two people share a month. The generalized form says
      more: some month has at least $\lceil 100/12 \rceil$ people, and since
      $100/12$ is between $8$ and $9$, that ceiling is $9$. Sanity-check it
      directly — if every one of the $12$ months held at most $8$ people, the
      total would be at most $12 \times 8 = 96$, which is short of $100$. So
      some month holds at least $9$, and no stronger conclusion is available,
      since $100$ people really can be split as eight months of $8$ and four
      of $9$.
    pitfalls: >
      Pigeonhole is pure existence: it tells you some fiber is crowded and
      never which one, so any argument that names the crowded box has used
      something else. The generalized bound is a ceiling — with $m = 100$ and
      $n = 12$ the answer is $9$, not $8$ and not $100/12$. And the hypothesis
      is about sizes, so the principle says nothing at all when $|A| \le |B|$,
      and nothing at all about infinite sets.
    recap: >
      If $|A| > |B|$ then every $f : A \to B$ collides, and in general some
      fiber has at least $\lceil |A|/|B| \rceil$ elements, because the fibers
      partition $A$.
    steps:
      - teach: >
          Thirteen people, twelve months: two of them share a birth month. The
          content of this step is turning that obvious remark into a statement
          about functions that can be used in proofs.
      - teach: >
          Two ingredients. Counting: $|A| = n$ means there is a bijection
          $A \to \{1,\dots,n\}$. Structure: for any $f : A \to B$, the fibers
          $f^{-1}(\{b\})$ partition the domain, since each $a$ sits in exactly
          one, the fiber over $f(a)$.
      - teach: >
          The theorem: if $A$ and $B$ are finite with $|A| > |B|$, no
          $f : A \to B$ is injective. Proof: the $|B|$ fibers have sizes
          summing to $|A|$, and if each held at most one element the sum could
          not exceed $|B|$, which is too small.
      - ask: >
          What exactly does the pigeonhole principle conclude about
          $f : A \to B$ when $|A| > |B|$?
        choices:
          - text: >
              Every $b \in B$ has at least two elements in its fiber.
            feedback: >
              Far too strong. Most fibers can be empty — send everything to a
              single $b$ and only that one fiber is crowded.
          - text: >
              Some $b \in B$ has at least two elements in its fiber, though the
              argument does not say which.
            correct: true
            feedback: >
              Exactly. It is a pure existence statement, obtained by ruling out
              the alternative that every fiber is small, and it identifies no
              particular $b$.
          - text: >
              $f$ is not surjective.
            feedback: >
              A different conclusion, and a false one — a map from a big set
              onto a small one is often surjective. The failure is of
              injectivity.
        feedback: >
          Some fiber has two elements, and the principle never says which one.
          Any argument that names the crowded fiber has smuggled in extra
          information.
      - teach: >
          In practice the contrapositive is what gets used: if an injection
          $A \to B$ between finite sets exists, then $|A| \le |B|$. You exhibit
          an injection and read off an inequality between sizes.
      - teach: >
          The sharper form: with $|A| = m$ and $|B| = n \ge 1$, some fiber has
          at least $\lceil m/n \rceil$ elements. If every one of the $n$ fibers
          had fewer than $m/n$, their sizes would total less than $m$ — and
          they total exactly $m$.
      - ask: >
          You have $50$ integers and sort each one by its remainder on division
          by $7$. Some remainder class is guaranteed to contain at least how
          many of them?
        expects: "8"
        hint: >
          There are $7$ possible remainders. Divide and round up.
        feedback: >
          Eight. Here $m = 50$ and $n = 7$, so some fiber has at least
          $\lceil 50/7 \rceil = 8$ elements. Check it the other way: if every
          one of the $7$ classes held at most $7$ integers, the total would be
          at most $49$, one short of $50$.
      - ask: >
          Which of these does pigeonhole *not* give you?
        choices:
          - text: >
              The existence of a fiber with at least two elements.
            feedback: >
              That is precisely what it gives, in the basic form, whenever the
              domain is strictly larger than the codomain.
          - text: >
              A specific $b$ whose fiber is crowded.
            correct: true
            feedback: >
              Right. The argument works by contradiction from a global count,
              so it produces no witness. Locating the crowded fiber needs a
              different method entirely.
          - text: >
              A lower bound of $\lceil m/n \rceil$ on the size of some fiber.
            feedback: >
              The generalized form gives exactly this, by the same counting
              argument run against a smaller assumed bound.
        feedback: >
          Existence yes, location no. That limitation is what makes pigeonhole
          arguments so short and so often the only thing available.
      - teach: >
          The whole principle is one observation about a partition: $n$ parts
          whose sizes total $m$ cannot all be small. Everything else is
          arithmetic on that sentence.

  - node: foundations.functions.finite-inj-surj-equiv
    hook: >
      Between finite sets of the same size, injective and surjective stop being
      two conditions and become one. That collapse halves your work — and the
      fact that it fails for infinite sets is very nearly the definition of
      infinite.
    explanation: >
      Let $A$ and $B$ be finite with $|A| = |B| = n$ and let $f : A \to B$.
      The claim: $f$ is injective if and only if $f$ is surjective, and either
      condition on its own makes $f$ a bijection.

      The proof is one counting picture used twice. The fibers over the $n$
      points of $B$ partition $A$, so there are $n$ fiber sizes and they add up
      to $|A| = n$. Suppose $f$ is injective: every fiber has at most one
      element, so we have $n$ numbers, each at most $1$, summing to $n$ — which
      forces every one of them to be exactly $1$. No fiber is empty, so $f$ is
      surjective. Suppose instead $f$ is surjective: every fiber has at least
      one element, so we have $n$ numbers, each at least $1$, summing to $n$,
      which again forces every one to be exactly $1$. No fiber has two, so $f$
      is injective. Either way every fiber is a single point, which is
      bijectivity.

      Finiteness is doing real work, and its failure is characteristic. On
      $\mathbb{N}$ the map $n \mapsto 2n$ is injective and misses every odd
      number, so it is not surjective — and there is no contradiction, because
      "the fiber sizes sum to $n$" is not a statement you can make. A set that
      admits an injection to itself that is not surjective is exactly what an
      infinite set is, so this theorem is not merely a convenience about finite
      sets; it is one of the places where finite and infinite part company.
    worked: >
      Let $A = B = \{0,1,2,3,4\}$ and let $f(n)$ be the remainder of $2n$ on
      division by $5$. Compute: $f(0) = 0$, $f(1) = 2$, $f(2) = 4$,
      $f(3) = 1$ since $6 = 5 + 1$, and $f(4) = 3$ since $8 = 5 + 3$. The
      values $0, 2, 4, 1, 3$ are distinct, so $f$ is injective, and the theorem
      hands you surjectivity with no further work — as the list confirms, since
      those five values are all of $B$. Now let $g(n)$ be the remainder of
      $n^{2}$ on division by $5$: the values are $0, 1, 4, 4, 1$. Here
      $g(2) = g(3)$, so $g$ is not injective, and the theorem in
      contrapositive form says $g$ cannot be surjective either — and indeed $2$
      and $3$ are never taken.
    pitfalls: >
      The hypothesis is $|A| = |B|$, not merely that both sets are finite: from
      a $3$-element set to a $5$-element set injections exist and surjections
      do not. The theorem also says nothing about infinite sets, where the two
      conditions come apart in both directions. And it is a conditional, not a
      guarantee — it never claims $f$ is bijective, only that one half implies
      the other.
    recap: >
      For a function between finite sets of equal size, injective, surjective
      and bijective are the same condition, because $n$ fiber sizes summing to
      $n$ must all be $1$.
    steps:
      - teach: >
          Checking a function for injectivity and then for surjectivity is two
          jobs. Between finite sets of the same size it is one job, and knowing
          that saves half the work every time it applies.
      - teach: >
          The statement: for finite $A$ and $B$ with $|A| = |B| = n$ and
          $f : A \to B$, injectivity holds if and only if surjectivity does,
          and either one makes $f$ a bijection.
      - teach: >
          The proof is a picture. The fibers over the $n$ points of $B$
          partition $A$, so their $n$ sizes add up to $n$. Everything follows
          from squeezing that sum.
      - ask: >
          Assume $f$ is injective, so each of the $n$ fiber sizes is at most
          $1$ and they sum to $n$. What follows?
        choices:
          - text: >
              Some fiber has two elements.
            feedback: >
              That contradicts injectivity outright — the assumption was that
              no fiber exceeds one element, and the counting is being used to
              rule out something else.
          - text: >
              Every fiber has exactly one element, so no value is missed.
            correct: true
            feedback: >
              Right: $n$ numbers each at most $1$ can only total $n$ by all
              being $1$. No empty fiber means every point of $B$ is hit, which
              is surjectivity.
          - text: >
              Nothing — the sizes could be distributed in many ways.
            feedback: >
              The upper bound and the total together leave exactly one
              distribution. Any fiber below $1$ would have to be compensated by
              one above $1$, which is forbidden.
        feedback: >
          All $n$ sizes are $1$. That single squeeze is the entire proof, and
          the surjective direction is the same squeeze from below.
      - teach: >
          Run it the other way. If $f$ is surjective then every fiber has at
          least one element; $n$ numbers each at least $1$ and summing to $n$
          are again all exactly $1$, so no fiber has two and $f$ is injective.
      - ask: >
          How many surjective functions are there from $\{1,2,3\}$ onto
          $\{1,2,3\}$?
        expects: "6"
        hint: >
          Domain and codomain have the same size, so the theorem converts the
          question into one you have already counted.
        feedback: >
          Six. Equal finite sizes make surjective the same as bijective, and
          the bijections here are the assignments of distinct values:
          $3 \times 2 \times 1 = 6$. Counting surjections directly would have
          meant an inclusion-exclusion; the theorem removes the need.
      - ask: >
          Which example shows that finiteness is essential?
        choices:
          - text: >
              On $\mathbb{N}$, the map $n \mapsto 2n$ is injective and misses
              every odd number.
            correct: true
            feedback: >
              Yes. Same set on both sides, injective, not surjective — exactly
              what the theorem forbids for finite sets, and what a set must
              admit in order to be infinite.
          - text: >
              On $\{1,2,3\}$, the constant map to $1$ is neither injective nor
              surjective.
            feedback: >
              That is consistent with the theorem, which only says the two
              conditions stand or fall together. Failing both is exactly what
              it predicts here.
          - text: >
              From $\{1,2\}$ to $\{1,2,3\}$, the obvious injection is not
              surjective.
            feedback: >
              The sets have different sizes, so the theorem never applied. Its
              hypothesis is $|A| = |B|$, not finiteness alone.
        feedback: >
          Doubling on $\mathbb{N}$ is the counterexample, and it is the
          standard one because a set admitting such a map is precisely an
          infinite set.
      - teach: >
          So on finite sets of equal size the three adjectives collapse into
          one, and the collapse is a counting fact rather than anything about
          functions. Where it fails, you are looking at infinity.
