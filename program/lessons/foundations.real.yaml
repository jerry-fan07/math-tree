unit: foundations.real
opening: >
  A set of real numbers can stop somewhere without ever reaching it: the
  numbers below $3$ climb as close to $3$ as you like and none of them is $3$.
  This unit builds the vocabulary that names that stopping place anyway —
  upper and lower bounds, then the least upper bound and greatest lower bound,
  $\sup$ and $\inf$ — and then states the one axiom that makes the vocabulary
  worth having: in $\mathbb{R}$, a nonempty set with an upper bound always has
  a least one. That axiom is the whole difference between the real line and the
  rationals, and every existence theorem later in analysis cashes it in. By the
  end you should be able to compute a supremum from a set-builder description,
  argue both halves of the definition, say when a supremum is a maximum, and
  explain exactly where $\mathbb{Q}$ tears.
lessons:
  - node: foundations.real.sup-inf
    hook: >
      Half the theorems in analysis assert that something exists — a limit, a
      maximum, an integral — and almost all of them produce it as a supremum.
      Before you can use that machine you need a name for the tightest bound on
      a set, and a reason it is not the same thing as the set's largest
      element.
    explanation: >
      Start with something weaker than "largest". Given $S \subseteq
      \mathbb{R}$, a number $b$ is an *upper bound* of $S$ when $x \le b$
      holds for every $x \in S$, and $S$ is *bounded above* when some such
      $b$ exists. Upper bounds never come alone: anything above one is
      another, so they form a ray running off to the right. For $E = \{\, x
      \in \mathbb{R} : 0 \le x < 3 \,\}$ the upper bounds are exactly the
      numbers $\ge 3$, since $3$ beats every element, while any candidate $b
      < 3$ fails: if $b < 0$ it misses the element $0$, and if $0 \le b < 3$
      then $(b + 3)/2$ lies in $E$ and exceeds it.

      Now the difficulty. $E$ has no largest element: given any $x \in E$,
      the number $(x + 3)/2$ is strictly bigger and still lies in $E$. So
      "the largest element of $S$" names nothing here. But the ray of upper
      bounds does have a smallest member, namely $3$, and that is the object
      worth naming. The *supremum* $\sup S$ is the least upper bound: a
      number $M$ that (i) is an upper bound of $S$, and (ii) satisfies $M
      \le b$ for every upper bound $b$ of $S$. Both clauses are
      load-bearing, and proving something is a supremum means proving both.

      A set has at most one supremum: if $M$ and $M'$ both qualify then each
      is a bound and each is least, so $M' \le M$ and $M \le M'$. Everything
      mirrors. A number $m$ is a *lower bound* when $m \le x$ throughout
      $S$, and the *infimum* $\inf S$ is the greatest lower bound. When
      $\sup S$ lies in $S$ we also call it the maximum; when it does not, as
      with $E$, the set has a supremum and no maximum.

      Clause (ii) quantifies over all upper bounds, which is awkward to
      check. Turn it around: nothing below $M$ bounds $S$, so for every
      $\varepsilon > 0$ there is some $x \in S$ with $x > M - \varepsilon$.
      Test that on $E$ with $M = 3$ and $\varepsilon = 0.01$: the definition
      demands an element above $2.99$, and $2.995$ obliges.
    worked: >
      Let $F = \{-3\} \cup \{\, x \in \mathbb{R} : 1 < x < 4 \,\}$, an isolated
      point together with an open interval. Clause (i) for the supremum: every
      element is either $-3$ or below $4$, so $4$ is an upper bound. Clause
      (ii): suppose some $b < 4$ also bounded $F$. If $b \le 1$ then $b$ misses
      the element $2$; if $1 < b < 4$ then $(b + 4)/2$ lies strictly between $b$
      and $4$, so it belongs to $F$ and exceeds $b$. Either way $b$ fails, so
      $\sup F = 4$ — and since $4 \notin F$, the set has no maximum. For the
      infimum: every element is $-3$ or above $1$, so $-3$ is a lower bound, and
      nothing larger can be one, because $-3$ itself lies in $F$. So $\inf F =
      -3$, this time an element, which makes it the minimum of $F$.
    pitfalls: >
      The supremum need not belong to the set — $\sup F = 4$ above with $4
      \notin F$ — so "let $M = \sup S$, then $M \in S$" is the commonest false
      step in a first analysis course. The definition also needs $S$ nonempty
      and bounded above before it names anything: the empty set is bounded above
      by every real number, so its ray of upper bounds is all of $\mathbb{R}$
      and has no least member, while $\{\, x \in \mathbb{R} : x > 6 \,\}$ has no
      upper bound to be least among. And checking clause (i) alone proves only
      that you have found *an* upper bound: $100$ bounds $F$ and is not its
      supremum.
    recap: >
      The supremum is the smallest number that still bounds the set from above
      — a fact about the bounds, not about membership, so it need not be an
      element.
    steps:
      - teach: >
          You already know what the biggest element of a finite set is. Push
          that idea to infinite sets and it breaks: the reals strictly below $3$
          have no biggest element, since any candidate has another element of
          the set above it. So start weaker. A number $b$ is an *upper bound* of
          $S$ when every $x \in S$ satisfies $x \le b$, and $S$ is *bounded
          above* when some upper bound exists.
      - teach: >
          Take $E = \{\, x \in \mathbb{R} : 0 \le x < 3 \,\}$. Every element
          is below $3$, so $3$ bounds $E$; and nothing below $3$ does: a
          candidate $b < 0$ misses the element $0$, and one with $0 \le b <
          3$ is beaten by $(b + 3)/2$, which is still in $E$. The upper
          bounds are therefore exactly the numbers $\ge 3$ — and unlike $E$,
          that ray has a smallest member.
      - teach: >
          That smallest member is the definition. $M = \sup S$ means (i) $M$ is
          an upper bound of $S$, and (ii) $M \le b$ for every upper bound $b$ of
          $S$. Clause (i) says $M$ is high enough; clause (ii) says nothing
          lower would do. The mirror statement defines $\inf S$, the greatest
          lower bound.
      - ask: >
          What is $\sup\{\, x \in \mathbb{R} : x^2 \le 36 \,\}$?
        expects: "6"
        hint: >
          Rewrite the condition $x^2 \le 36$ as a statement about how far $x$
          sits from $0$, and you will be looking at an interval.
        feedback: >
          $6$. The condition $x^2 \le 36$ holds exactly when $-6 \le x \le 6$,
          so the set is that closed interval. Clause (i): every element is $\le
          6$. Clause (ii): any $b < 6$ fails, since $6$ itself is in the set and
          $6 > b$. So the supremum is $6$, and here it happens to be an element,
          which makes it the maximum too.
      - teach: >
          It does not have to be an element. Compare $\{\, x : 0 \le x < 3 \,\}$
          with $\{\, x : 0 \le x \le 3 \,\}$: both have supremum $3$, but only
          the second contains it. A supremum that lies in the set earns the
          extra name *maximum*; a supremum that does not is still a perfectly
          good supremum.
      - ask: >
          Someone objects that $\sup E$ cannot exist for $E = \{\, x \in
          \mathbb{R} : 0 \le x < 3 \,\}$, since $E$ has no largest element.
          Where does the objection go wrong?
        choices:
          - text: >
              Nowhere — a set with no largest element has no supremum.
            feedback: >
              This is the confusion the definition exists to remove. The
              supremum is never asked to be an element of $E$, so $E$ having no
              largest element costs it nothing.
          - text: >
              $E$ does have a largest element; it is the number just below $3$.
            feedback: >
              There is no such number. If $x \in E$ then $(x + 3)/2$ is strictly
              larger and still below $3$, so still in $E$ — no candidate for
              largest survives.
          - text: >
              The supremum is the least element of the set of upper bounds, not
              the largest element of $E$; those upper bounds are the numbers
              $\ge 3$, whose least member is $3$.
            correct: true
            feedback: >
              Exactly. The minimum is taken in a different set. $E$ has no
              largest element and its ray of upper bounds has a smallest one,
              and only the second is what $\sup$ asks for.
        feedback: >
          $\sup$ minimises over the upper bounds, not over $S$. The smallest
          upper bound always sits at the edge of $S$, whether or not $S$ reaches
          it, which is why $\sup E = 3$ while $3 \notin E$.
      - teach: >
          Clause (ii) is clumsy to check directly, so trade it in. Saying no
          number below $M$ bounds $S$ is the same as saying: for every
          $\varepsilon > 0$ there is some $x \in S$ with $x > M - \varepsilon$.
          You get to pick how close, and the set has to meet you there.
      - ask: >
          You are told $\sup S = 12$. Taking $\varepsilon = 0.5$, the
          characterization guarantees that $S$ contains an element strictly
          greater than what number?
        expects: "11.5"
        hint: >
          The guarantee is about elements above $M - \varepsilon$, not about
          elements above $M$.
        feedback: >
          $11.5$, since $M - \varepsilon = 12 - 0.5 = 11.5$. If no element of
          $S$ exceeded $11.5$, then $11.5$ would itself be an upper bound of $S$
          — and it is smaller than $12$, contradicting clause (ii). Nothing here
          promises an element above $12$; that would say $12$ is not a bound at
          all.
      - teach: >
          Carry two things forward. A supremum is a claim about the bounds and
          not about membership, and proving one always means proving both
          clauses — high enough, and nothing lower would do.

  - node: foundations.real.completeness
    hook: >
      Defining "least upper bound" does not conjure one into existence, and for
      the rationals none exists in the case that matters most. This axiom is the
      promise that makes the definition useful, and every later theorem that
      asserts something exists is spending it.
    explanation: >
      The completeness axiom says: every nonempty subset of $\mathbb{R}$
      that is bounded above has a supremum in $\mathbb{R}$. Both hypotheses
      do work. Drop nonempty and the claim is false — every real number is
      vacuously an upper bound of $\emptyset$, so the upper bounds are all
      of $\mathbb{R}$ and have no least member. Drop bounded above and there
      is nothing to be least among. Applying it to $-S = \{\, -x : x \in S
      \,\}$ swaps upper bounds for lower and gives the dual free: every
      nonempty set bounded below has an infimum.

      Why an axiom rather than a theorem? The ordered-field rules —
      arithmetic, and an order compatible with it — cannot prove it:
      $\mathbb{Q}$ satisfies every one of them and fails this. Take $A =
      \{\, q \in \mathbb{Q} : q > 0,\ q^2 < 2 \,\}$. It is nonempty, since
      $1 \in A$, and bounded above inside $\mathbb{Q}$, since $q \ge 2$
      would force $q^2 \ge 4$. Yet it has no least upper bound in
      $\mathbb{Q}$.

      Here is why, to the end. No rational squares to $2$: if $m/n$ in
      lowest terms had $m^2 = 2n^2$ then $m^2$ is even, so $m$ is even, so
      $m^2$ is a multiple of $4$, making $n^2$ even and $n$ even too —
      contradicting lowest terms. Every positive rational $b$ therefore has
      $b^2 < 2$ or $b^2 > 2$, and the map $b \mapsto b' = (2b + 2)/(b + 2)$
      sorts them out. Two identities do the work: $b' - b = (2 - b^2)/(b +
      2)$ and $b'^2 - 2 = 2(b^2 - 2)/(b + 2)^2$. If $b^2 < 2$ then $b' > b$
      and $b'^2 < 2$, so $b'$ is an element of $A$ above $b$ and $b$ never
      bounded $A$. A rational upper bound must therefore have $b^2 > 2$ —
      and then $b' < b$ with $b'^2 > 2$, so $b'$ bounds $A$ too, since any
      $q \in A$ has $q^2 < 2 < b'^2$ with both positive and hence $q < b'$.
      That is a strictly smaller rational upper bound. Every candidate is
      beaten, so none is least.

      That is a gap: the rationals stop short of a place the set genuinely
      points at. The axiom asserts $\mathbb{R}$ has none — read inside
      $\mathbb{R}$, the same $A$ does have a supremum, and it is $\sqrt{2}$.
    worked: >
      Use the axiom to manufacture a number. Let $T = \{\, x \in \mathbb{R} : x
      \ge 0,\ x^2 < 5 \,\}$. Check the hypotheses in turn: $T$ is nonempty
      because $0 \in T$, and bounded above by $3$, because $x \ge 3$ would give
      $x^2 \ge 9 > 5$. The axiom therefore hands you $s = \sup T$, with $s \ge
      0$. Pin it down with $s' = 5(s + 1)/(s + 5)$, for which $s' - s = (5 -
      s^2)/(s + 5)$ and $s'^2 - 5 = 20(s^2 - 5)/(s + 5)^2$. If $s^2 < 5$ then
      $s' > s$ and $s'^2 < 5$, so $s' \in T$ sits above the supremum —
      impossible. If $s^2 > 5$ then $s' < s$ and $s'^2 > 5$, and any $x \in T$
      has $x^2 < 5 < s'^2$ with both numbers $\ge 0$, so $x < s'$ and $s'$ is a
      smaller upper bound — impossible too. Hence $s^2 = 5$ exactly, so $s =
      \sqrt{5}$; and since $2.236^2 = 4.999696$ while $2.237^2 = 5.004169$, that
      number is pinned to $2.236 < s < 2.237$.
    pitfalls: >
      Dropping either hypothesis breaks the axiom: $\emptyset$ is bounded above
      by everything and has no supremum, and $\{\, 2n : n \in \mathbb{Z} \,\}$
      is nonempty with no upper bound at all. The supremum is promised in
      $\mathbb{R}$, not in the set — completeness never says $\sup S \in S$, and
      the set $T$ above consists of numbers none of which is its supremum
      $\sqrt{5}$. And what fails in $\mathbb{Q}$ is not that $A$ lacks rational
      upper bounds; it has plenty, $3/2$ and $17/12$ among them. What it lacks
      is a least one.
    recap: >
      Nonempty and bounded above is enough for a least upper bound to exist in
      $\mathbb{R}$ — the promise $\mathbb{Q}$ cannot keep, and the one every
      existence theorem in analysis ultimately spends.
    steps:
      - teach: >
          The definition of a supremum tells you how to recognise one, not that
          one is there to be recognised. Those are different claims, and for the
          rationals the second is false. This step supplies the missing
          guarantee.
      - teach: >
          The completeness axiom: every nonempty subset of $\mathbb{R}$ that is
          bounded above has a supremum in $\mathbb{R}$. Nonempty, bounded above,
          and the conclusion lands in $\mathbb{R}$ — that is the whole
          statement, and both hypotheses are needed.
      - ask: >
          For which of these sets does the completeness axiom guarantee a
          supremum?
        choices:
          - text: >
              $\emptyset$
            feedback: >
              Nonempty fails. Every real number is vacuously an upper bound of
              the empty set, so the upper bounds are all of $\mathbb{R}$ and
              there is no least one.
          - text: >
              $\{\, 2n : n \in \mathbb{Z} \,\}$
            feedback: >
              The even integers run off in both directions, so no upper bound
              exists — and the axiom is silent about a set with nothing to be
              least among.
          - text: >
              $\{\, x \in \mathbb{R} : x^2 \le 7 \,\}$
            correct: true
            feedback: >
              Nonempty, since $0$ is in it, and bounded above by $3$, since $x
              \ge 3$ forces $x^2 \ge 9$. Both hypotheses hold, so the supremum
              exists — it is $\sqrt{7}$.
          - text: >
              $\{\, x \in \mathbb{R} : x > 6 \,\}$
            feedback: >
              Nonempty, but unbounded above: whatever bound $b$ you name,
              the set holds a number bigger than both $b$ and $6$. Being
              bounded below is not what the axiom asks for.
        feedback: >
          Only $\{\, x \in \mathbb{R} : x^2 \le 7 \,\}$ passes both tests. Run
          them in order every time — is it nonempty, and is there an upper bound
          — because the axiom promises nothing when either one fails.
      - teach: >
          It has to be an axiom. Addition, multiplication and an order
          compatible with them are all satisfied by $\mathbb{Q}$, so no argument
          from those rules alone can produce a supremum: $\mathbb{Q}$ obeys the
          rules and lacks the conclusion.
      - teach: >
          The witness is $A = \{\, q \in \mathbb{Q} : q > 0,\ q^2 < 2 \,\}$,
          nonempty and bounded above by $2$ inside $\mathbb{Q}$. The tool
          for probing it is the map $b \mapsto b' = (2b + 2)/(b + 2)$, which
          satisfies $b' - b = (2 - b^2)/(b + 2)$ and $b'^2 - 2 = 2(b^2 -
          2)/(b + 2)^2$ — so $b'^2$ lands on the same side of $2$ as $b^2$
          does, and closer to it.
      - ask: >
          Apply that map to $b = 7/5$, which satisfies $b^2 = 49/25 < 2$. What
          is $b'$? Give it as a fraction.
        expects: "24/17"
        hint: >
          Substitute into $(2b + 2)/(b + 2)$ and clear the fifths from top and
          bottom together.
        feedback: >
          $24/17$. The numerator is $2 \cdot 7/5 + 2 = 14/5 + 10/5 = 24/5$ and
          the denominator is $7/5 + 2 = 17/5$, so $b' = 24/17 \approx 1.4118$.
          Check it against the identity: $b'^2 = 576/289 < 2$, and indeed $b' >
          7/5$. So $b'$ is a rational in $A$ larger than $7/5$, which proves
          $7/5$ was not an upper bound of $A$ at all.
      - teach: >
          Now run the map on an upper bound. Any rational upper bound $b$
          must have $b^2 > 2$, since $b^2 < 2$ would put $b$ inside $A$ with
          $b'$ above it, and $b^2 = 2$ is impossible for a fraction in
          lowest terms. But $b^2 > 2$ gives $b' < b$ with $b'^2 > 2$, and
          $b'$ bounds $A$ as well, since any $q \in A$ has $q^2 < 2 < b'^2$
          and both are positive. So it is a strictly smaller rational upper
          bound. No candidate is ever least.
      - ask: >
          What is the exact status of $A = \{\, q \in \mathbb{Q} : q > 0,\ q^2 <
          2 \,\}$?
        choices:
          - text: >
              $A$ has no supremum, full stop.
            feedback: >
              Too strong. Read as a subset of $\mathbb{R}$, $A$ is nonempty and
              bounded above, so completeness gives it a supremum; the number is
              $\sqrt{2}$.
          - text: >
              $A$ has a supremum in $\mathbb{R}$, namely $\sqrt{2}$, and none in
              $\mathbb{Q}$.
            correct: true
            feedback: >
              Yes — and that single sentence is the whole difference between the
              two fields. The set points at a location, and only one of the two
              number systems has a number sitting there.
          - text: >
              $A$ is not bounded above, which is why no least upper bound
              exists.
            feedback: >
              It is bounded above: $2$ works, since $q \ge 2$ forces $q^2 \ge
              4$. Upper bounds are plentiful; what fails is that none of them is
              least.
          - text: >
              $A$ fails the hypotheses of the completeness axiom.
            feedback: >
              Both hypotheses hold — $1 \in A$ and $2$ bounds it. That is
              exactly what makes $A$ a counterexample for $\mathbb{Q}$ rather
              than an excuse for it.
        feedback: >
          $A$ has a real supremum and no rational one. The hypotheses hold in
          both fields; only $\mathbb{R}$ delivers the conclusion, and that is
          what "no gaps" means as a precise statement.
      - teach: >
          Whenever a later theorem asserts that something exists — a limit of a
          bounded increasing sequence, a maximum on a closed interval, a root
          where a continuous function changes sign — trace the proof back far
          enough and you will find this axiom being spent.
