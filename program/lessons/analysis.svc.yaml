unit: analysis.svc
opening: >
  Calculus is two limits and the astonishing fact that they undo one another.
  This unit builds both from nothing but the completeness of $\mathbb{R}$: first
  the $\varepsilon$–$\delta$ limit and continuity, then the two existence
  theorems that continuity buys you on a closed bounded interval, then the
  derivative as a limit of difference quotients together with the Mean Value
  Theorem, which converts local information into global statements. The integral
  arrives as a squeeze between rectangle sums that know nothing about
  derivatives, and the Fundamental Theorem of Calculus arrives last to say that
  shrinking difference quotients and shrinking rectangles are inverse
  operations. By the end you should be able to run an $\varepsilon$–$\delta$
  proof, differentiate straight from the definition, evaluate an integral from
  Riemann sums alone, and explain exactly why an antiderivative lets you skip
  all that work.
lessons:
  - node: analysis.svc.def-limit
    hook: >
      Every other idea in this unit is this one wearing a costume — continuity,
      the derivative and the integral are each a limit of something. Get the
      quantifiers right once here and the rest of the course is bookkeeping.
    explanation: >
      Start with the picture. Plot $f$ near $c$ and draw a horizontal band of
      half-width $\varepsilon$ around the height $L$. The claim
      $\lim_{x \to c} f(x) = L$ says: however thin you make that band, there is
      a vertical strip around $c$ narrow enough that the graph stays inside the
      band all the way across the strip. The half-width of the strip is
      $\delta$.

      That is a game, and the order of play is everything. Your opponent moves
      first, naming a tolerance $\varepsilon > 0$; you answer with a
      $\delta > 0$; you win the round if every $x$ with $0 < |x - c| < \delta$
      satisfies $|f(x) - L| < \varepsilon$. The limit is $L$ exactly when you
      can win every round. Because $\varepsilon$ is named first, your $\delta$
      is allowed to depend on it, and it almost always does, shrinking as
      $\varepsilon$ shrinks. Swapping the order states something else entirely,
      which is why the quantifiers are not decoration.

      The strict inequality $0 < |x - c|$ is the second thing to notice. It
      deletes the single point $x = c$, so the definition never reads $f(c)$ at
      all. That is deliberate: you want to compare the value the function
      *points to* with the value it actually takes, and you cannot do that if
      the definition has already used the value. A limit can exist where $f$ is
      undefined, and it can disagree with $f(c)$ where $f$ is defined.

      A limit is unique when it exists, and that proof is the first
      $\varepsilon$-argument worth memorising. If $L \ne L'$ were both limits,
      take $\varepsilon = |L - L'|/2$. Some $\delta$ forces $f(x)$ within
      $\varepsilon$ of $L$, some $\delta'$ forces it within $\varepsilon$ of
      $L'$, and any $x$ with $0 < |x - c| < \min(\delta, \delta')$ obeys both.
      The triangle inequality then gives $|L - L'| < 2\varepsilon = |L - L'|$,
      which is absurd.
    worked: >
      Prove $\lim_{x \to 2} x^2 = 4$ from the definition. The quantity to
      control is $|x^2 - 4| = |x - 2|\,|x + 2|$. The first factor is what
      $\delta$ governs; the second is a nuisance, so bound it first. Agree in
      advance that $\delta \le 1$, which confines $x$ to the interval $(1,3)$
      and hence makes $|x + 2| < 5$. Then $|x^2 - 4| < 5\,|x - 2|$, and
      $5\,|x - 2| < \varepsilon$ as soon as $|x - 2| < \varepsilon/5$. So take
      $\delta = \min(1, \varepsilon/5)$ and both requirements hold at once. Test
      it: $\varepsilon = 0.1$ gives $\delta = 0.02$, and the worst case
      $|x - 2| = 0.02$ gives $|x^2 - 4| < 5(0.02) = 0.1$ as promised. The
      $\min$ is the whole technique: bound the nuisance factor first, then
      spend the rest of the budget on the factor you control.
    pitfalls: >
      Reversing the quantifiers is the standard disaster: one $\delta$ that
      works for one $\varepsilon$ proves nothing, and a single $\delta$ good
      for every $\varepsilon$ at once would force $f$ to be constantly $L$
      near $c$. The second trap is reading
      $f(c)$: for the function equal to $x$ everywhere except at $0$, where it
      equals $5$, the limit at $0$ is $0$, and the definition never so much as
      looks at the $5$. The third is believing $\delta$ must be the largest
      window that works — any working $\delta$ counts, and shrinking one never
      breaks it.
    recap: >
      $\lim_{x \to c} f(x) = L$ is a promise to answer every tolerance
      $\varepsilon$ with a window $\delta$ inside which the graph stays within
      $\varepsilon$ of $L$, with the point $x = c$ itself excluded from the
      deal.
    dialogue:
      - part: A machine and a tolerance
        teach: >
          A machine cuts a rod of length $f(x) = 3x + 1$ centimetres when its
          dial is set to $x$. You want rods of length $7$, so you aim the dial
          at $2$. Dials wobble, and nobody sets one to exactly $2$. A customer
          will accept any rod within $0.03$ cm of $7$.
      - ask: >
          How far from $2$ may the dial drift before a rod can fall outside
          the customer's tolerance? Give the widest safe window: the largest
          $\delta$ such that $|x - 2| < \delta$ guarantees
          $|f(x) - 7| < 0.03$.
        expects: "0.01"
        hint: >
          Write $|f(x) - 7|$ in terms of $|x - 2|$.
        feedback: >
          $|f(x) - 7| = |3x - 6| = 3\,|x - 2|$, and $3\,|x - 2| < 0.03$ exactly
          when $|x - 2| < 0.01$. Any narrower window is safe too; $0.01$ is
          the widest.
      - ask: >
          A second customer will name a tolerance $\varepsilon$ you do not
          know yet. Which window satisfies them, whatever $\varepsilon$ turns
          out to be?
        choices:
          - text: >
              $|x - 2| < 3\varepsilon$
            feedback: >
              Backwards. The machine triples every drift of the dial, so the
              window must be a third of the tolerance. With
              $\varepsilon = 0.03$ this window allows a drift of $0.09$ and a
              rod off by $0.27$.
          - text: >
              $|x - 2| < 0.01$, the window that worked before.
            feedback: >
              Safe for a tolerance of $0.03$ or looser, but a customer asking
              for $\varepsilon = 0.003$ gets a rod off by $3(0.005) = 0.015$
              when the dial drifts $0.005$. One fixed window cannot serve every
              tolerance.
          - text: >
              $|x - 2| < \varepsilon/3$
            correct: true
            feedback: >
              Whatever tolerance is named, a window of a third of it answers.
              The window depends on the tolerance, and that dependence is
              normal.
        feedback: >
          Tolerance in, window out: for this machine the window $\varepsilon/3$
          answers every customer. The next machine is not a straight line.
      - teach: >
          The second machine cuts a rod of length $x^2$, and you aim the dial
          at $2$ for a rod of length $4$. Now
          $|x^2 - 4| = |x - 2|\,|x + 2|$. The first factor is the drift you
          control. The second is a nuisance: it depends on where the dial
          actually landed. Near $2$ the nuisance is about $4$, so a tempting
          answer to a tolerance $\varepsilon$ is the window $\varepsilon/5$,
          with a little room to spare.
      - ask: >
          A customer with a lax tolerance, $\varepsilon = 100$, is given the
          window $\varepsilon/5 = 20$. The dial drifts to $x = 21$, inside
          that window. How far is the rod from $4$?
        expects: "437"
        hint: >
          Compute $|21^2 - 4|$.
        feedback: >
          $21^2 - 4 = 441 - 4 = 437$, far outside the tolerance of $100$. At
          $x = 21$ the nuisance factor $|x + 2|$ is $23$, not $5$: a wide
          window lets the nuisance grow.
      - reflect: >
          How would you choose the window so that the nuisance $|x + 2|$ can
          never exceed $5$, whatever tolerance the customer names — and still
          meet the tolerance?
        hint: >
          Nothing forbids a window smaller than $\varepsilon/5$.
        answer: >
          Cap the window: never let it exceed $1$. Inside $|x - 2| < 1$ the
          dial sits in $(1,3)$, so $|x + 2| < 5$ and
          $|x^2 - 4| < 5\,|x - 2|$. The window $\delta = \min(1, \varepsilon/5)$
          then does both jobs — the cap tames the nuisance and
          $\varepsilon/5$ spends the rest of the budget. Shrinking a window
          that works never breaks it, which is what makes the $\min$ legal.
      - ask: >
          With $\delta = \min(1, \varepsilon/5)$ and $\varepsilon = 0.1$ the
          window is $0.02$. At its very edge, $x = 2.02$, what is
          $|x^2 - 4|$?
        expects: "0.0804"
        feedback: >
          $2.02^2 = 4.0804$, so the rod is off by $0.0804$, inside the
          tolerance of $0.1$, and every $x$ strictly inside the window does
          better. The bound $5(0.02) = 0.1$ overestimated the nuisance, which
          is really about $4.02$ here; a bound only has to be safe, not
          sharp.

      - part: Who moves first
        reflect: >
          Both machines played the same game. Write one precise sentence, with
          its quantifiers, saying what it means that the second machine's rods
          "can be made as close to $4$ as anyone asks" by setting the dial
          near $2$.
        answer: >
          For every tolerance $\varepsilon > 0$ there is a window $\delta > 0$
          such that every setting $x$ with $0 < |x - 2| < \delta$ gives
          $|x^2 - 4| < \varepsilon$. The customer names $\varepsilon$ first;
          you answer with $\delta$, which may depend on it. The $0 < |x - 2|$
          excludes the setting $x = 2$ itself, for a reason that is coming.
      - teach: >
          Replace $x^2$, $2$ and $4$ by $f$, $c$ and $L$ and you have the
          definition. $\lim_{x \to c} f(x) = L$ means: for every
          $\varepsilon > 0$ there is a $\delta > 0$ such that every $x$ in the
          domain of $f$ with $0 < |x - c| < \delta$ satisfies
          $|f(x) - L| < \varepsilon$. You have already won this game twice.
      - ask: >
          Order matters. Which statement says the same thing as
          $\lim_{x \to c} f(x) = L$?
        choices:
          - text: >
              There is a $\delta > 0$ such that for every $\varepsilon > 0$,
              every $x$ with $0 < |x - c| < \delta$ has
              $|f(x) - L| < \varepsilon$.
            feedback: >
              One window meeting *every* tolerance forces $|f(x) - L|$ below
              every positive number, so $f(x) = L$ exactly on the whole
              punctured window. The $x^2$ machine fails this: no window around
              $2$ makes every rod exactly $4$.
          - text: >
              For every $\delta > 0$ there is an $\varepsilon > 0$ such that
              every $x$ with $0 < |x - c| < \delta$ has
              $|f(x) - L| < \varepsilon$.
            feedback: >
              Now you pick the tolerance after seeing the window, so you can
              always pick a huge one. By this reading the $x^2$ machine near
              $2$ also "tends to" $1000$. It says nothing.
          - text: >
              For every $\varepsilon > 0$ and every $\delta > 0$, every $x$
              with $0 < |x - c| < \delta$ has $|f(x) - L| < \varepsilon$.
            feedback: >
              This demands that *every* window work, including the window of
              width $20$ that produced a rod off by $437$. Your job was to
              choose the window, not to survive all of them.
          - text: >
              For every $\varepsilon > 0$ there is a $\delta > 0$ such that
              every $x$ with $0 < |x - c| < \delta$ has
              $|f(x) - L| < \varepsilon$.
            correct: true
            feedback: >
              Challenge, then response. Because $\varepsilon$ comes first,
              $\delta$ may depend on it, exactly as $\varepsilon/3$ and
              $\min(1, \varepsilon/5)$ did.
        feedback: >
          $\varepsilon$ is the challenge and $\delta$ the response, in that
          order. Reading the definition backwards is the most common error in
          a first analysis course.

      - part: The point the definition refuses to look at
        ask: >
          Let $h(x) = x$ for every $x \ne 0$, and let $h(0) = 5$. Which
          statement is true?
        choices:
          - text: >
              $\lim_{x \to 0} h(x) = 5$
            feedback: >
              $5$ is the value at $0$, which the condition $0 < |x - 0|$
              deliberately skips. Every other $x$ near $0$ has $h(x) = x$, near
              $0$ and nowhere near $5$.
          - text: >
              The limit does not exist, because $h$ jumps at $0$.
            feedback: >
              Whether a limit exists and whether it matches $h(0)$ are separate
              questions. Test $L = 0$: for $0 < |x| < \delta$,
              $|h(x) - 0| = |x| < \delta$, so $\delta = \varepsilon$ wins every
              round.
          - text: >
              $\lim_{x \to 0} h(x) = 0$
            correct: true
            feedback: >
              For $0 < |x| < \delta$, $|h(x) - 0| = |x|$, so
              $\delta = \varepsilon$ answers every challenge. The lone value
              $h(0) = 5$ is never tested.
        feedback: >
          A limit reads the punctured window only. Redefining $f$ at the
          single point $c$ cannot change it.
      - ask: >
          $g(x) = \dfrac{x^2 - 1}{x - 1}$ is not defined at $x = 1$ at all.
          What is $\lim_{x \to 1} g(x)$?
        expects: "2"
        hint: >
          Factor the numerator. The limit never asks for $g(1)$.
        feedback: >
          For $x \ne 1$, $g(x) = \dfrac{(x - 1)(x + 1)}{x - 1} = x + 1$, so
          $|g(x) - 2| = |x - 1|$ and $\delta = \varepsilon$ wins. The limit is
          $2$, and $g(1)$ never needed to exist.
      - teach: >
          That is what the strict inequality in $0 < |x - c|$ is for. It
          deletes the point $x = c$, so the limit records where $f$ is
          *heading*, never where it *is*. A limit can exist where $f$ is
          undefined, and can disagree with $f(c)$ where $f$ is defined.

      - part: When no number works
        ask: >
          Let $s(x) = -1$ for $x < 0$ and $s(x) = 1$ for $x \ge 0$. Does
          $\lim_{x \to 0} s(x)$ exist?
        choices:
          - text: >
              Yes, it is $0$, halfway between the two sides.
            feedback: >
              Name the tolerance $\varepsilon = 1/2$. Every window around $0$
              contains points just right of $0$, where $s = 1$, at distance $1$
              from $0$. No $\delta$ meets that challenge.
          - text: >
              Yes, it is $1$, because $s(0) = 1$.
            feedback: >
              The value at $0$ is never consulted. And every window contains
              points just left of $0$, where $s = -1$, at distance $2$ from
              $1$; the tolerance $\varepsilon = 1$ defeats $L = 1$.
          - text: >
              No: every window holds values $-1$ and $1$, and no single $L$ is
              within $1$ of both.
            correct: true
            feedback: >
              If $|1 - L| < 1$ and $|-1 - L| < 1$, the triangle inequality
              gives $2 = |1 - (-1)| < 2$. So $\varepsilon = 1$ defeats every
              candidate $L$ at once.
        feedback: >
          To show a limit fails, you play the challenger: find one tolerance
          that no window can meet, for every candidate $L$.
      - ask: >
          The same trick proves a limit is unique. Suppose someone claims both
          $L = 3$ and $L' = 3.4$ are limits of $f$ at $c$. What is the largest
          tolerance $\varepsilon$ for which no number can be within
          $\varepsilon$ of both $3$ and $3.4$?
        expects: "0.2"
        hint: >
          If one number is within $\varepsilon$ of $3$ and within
          $\varepsilon$ of $3.4$, how far apart can $3$ and $3.4$ be?
        feedback: >
          The gap is $0.4$. A number within $\varepsilon$ of both would give
          $0.4 = |3 - 3.4| < 2\varepsilon$, impossible once
          $\varepsilon \le 0.2$. Now take $\varepsilon = 0.2$: one window
          forces $f(x)$ within $0.2$ of $3$, another within $0.2$ of $3.4$,
          and any $x$ in the smaller window obeys both. That is absurd, so a
          function has at most one limit at $c$ — in general, take
          $\varepsilon = |L - L'|/2$.
      - teach: >
          Keep the game in mind: a tolerance is named, a window answers it,
          and the point $c$ itself sits out. Continuity compares this limit
          with $f(c)$, the derivative is a limit of slopes, and the integral is
          a limit of rectangle sums — every idea left in this unit is this
          definition applied to something.

  - node: analysis.svc.def-continuity
    hook: >
      Continuity is the hypothesis that makes the two great existence theorems
      of this unit true, and it is the one word separating functions you can
      reason about from functions that jump out from under you.
    explanation: >
      The limit at $c$ was built to ignore $f(c)$. Continuity is the demand
      that the ignored value is the right one anyway: $f$ is continuous at $c$
      when $\lim_{x \to c} f(x)$ exists *and* equals $f(c)$. Three things must
      hold — $f(c)$ is defined, the limit exists, and the two numbers agree —
      and each can fail on its own.

      Unwind it and you get the $\varepsilon$–$\delta$ statement with $L$
      replaced by $f(c)$: for every $\varepsilon > 0$ there is a $\delta > 0$
      with $|f(x) - f(c)| < \varepsilon$ whenever $|x - c| < \delta$. The
      puncture has quietly vanished, and it costs nothing to drop it, because
      at $x = c$ the inequality reads $0 < \varepsilon$, which is free.

      Two ways to fail are worth holding in mind. A *removable* failure: the
      function equal to $\dfrac{x^2 - 4}{x - 2}$ for $x \ne 2$ has limit $4$ at
      $2$, so a single well-chosen value at $2$ repairs it. A *jump*: the
      function equal to $-1$ for $x < 0$ and $1$ for $x \ge 0$ has no limit at
      $0$ at all, since values on either side stay a distance $2$ apart, and no
      choice of value at $0$ can help. Nothing repairs a jump.

      Continuity on a set means continuity at each of its points, and the
      definition already handles endpoints correctly without a special rule.
      The quantifier ranges over $x$ *in the domain of $f$*, so for $f$ defined
      on $[0,1]$ there simply are no points to the left of $0$ to test, and
      continuity at $0$ becomes a one-sided condition automatically. This is
      also why the popular slogan "you can draw it without lifting your pen"
      should be treated as a picture and never as a definition: $f(x) = 1/x$ is
      continuous at every point of its domain, and no pen draws it in one
      stroke.
    worked: >
      Let $f(x) = \dfrac{x^2 - 4}{x - 2}$ for $x \ne 2$, with $f(2) = 4$, and
      check continuity at $2$ against the definition. For $x \ne 2$ the
      numerator factors as $(x - 2)(x + 2)$ and the quotient is exactly
      $x + 2$, so $|f(x) - 4| = |x + 2 - 4| = |x - 2|$. Given $\varepsilon > 0$
      take $\delta = \varepsilon$: every $x$ with $|x - 2| < \delta$ and
      $x \ne 2$ has $|f(x) - 4| = |x - 2| < \varepsilon$, and the remaining
      point $x = 2$ gives $|f(2) - 4| = 0 < \varepsilon$. All three conditions
      hold, so $f$ is continuous at $2$. Change the definition to $f(2) = 5$
      and the limit is still $4$ while the value is $5$: the limit exists, the
      value exists, and they disagree, so continuity fails at that one point.
    pitfalls: >
      A function is never discontinuous at a point outside its domain — $1/x$
      is continuous everywhere it is defined, and "discontinuous at $0$" is not
      a claim about it. Existence of the limit is not enough on its own; the
      limit must equal the value, which is exactly what the removable case
      shows. And the pen-and-paper slogan misleads in both directions: it calls
      $1/x$ discontinuous, and it offers no verdict at all on a function
      defined by a formula you cannot draw.
    recap: >
      $f$ is continuous at $c$ when the value it takes there is precisely the
      value its neighbours point to, so the limit and the function agree and
      the puncture in the limit definition stops mattering.
    dialogue:
      - part: Three functions at one point
        teach: >
          Three functions near $x = 2$. The first is $a(x) = x + 2$. The
          second, $b$, agrees with it everywhere except at $2$, where
          $b(2) = 5$. The third, $s$, equals $x + 2$ for $x < 2$ and $x + 3$
          for $x \ge 2$. All three are defined at $2$.
      - ask: >
          What is $\lim_{x \to 2} b(x)$?
        expects: "4"
        hint: >
          The limit never looks at $x = 2$ itself.
        feedback: >
          For $x \ne 2$, $b(x) = x + 2$, so $|b(x) - 4| = |x - 2|$ and
          $\delta = \varepsilon$ wins every round. The limit is $4$; the value
          $b(2) = 5$ is simply never consulted.
      - ask: >
          Does $\lim_{x \to 2} s(x)$ exist?
        choices:
          - text: >
              Yes, it is $5$, the value $s(2)$.
            feedback: >
              Points just left of $2$ have $s(x) = x + 2$, just under $4$ —
              more than $1$ away from $5$. The tolerance $\varepsilon = 1/2$
              cannot be met.
          - text: >
              Yes, it is $4.5$, halfway between the two sides.
            feedback: >
              Left of $2$ the values sit just under $4$ and right of $2$ at
              $5$ or above, so every window holds values more than $1$ apart.
              No number is within $1/2$ of both, $4.5$ included.
          - text: >
              No: values just left of $2$ sit near $4$ and values just right
              sit near $5$, and no $L$ is within $1/2$ of both.
            correct: true
            feedback: >
              Every window around $2$ contains both kinds of point, so the
              tolerance $\varepsilon = 1/2$ defeats every candidate $L$. The
              value $s(2) = 5$ cannot rescue a limit that does not exist.
        feedback: >
          $b$ has a limit that disagrees with its value; $s$ has no limit at
          all. Two different failures.
      - ask: >
          Of $a$, $b$ and $s$, which ones would you call unbroken at $2$ — the
          value there is exactly what the nearby values lead you to expect?
        choices:
          - text: >
              $a$ and $b$, since both have a limit at $2$.
            feedback: >
              $b$ has a limit, $4$, but takes the value $5$. Its graph is the
              line $y = x + 2$ with the single point above $x = 2$ lifted to
              height $5$: broken, at one point.
          - text: >
              Only $a$.
            correct: true
            feedback: >
              Only $a$ has a limit at $2$ that equals its value there.
              $b$ has the limit but the wrong value; $s$ has a value but no
              limit.
          - text: >
              All three, since all three are defined at $2$.
            feedback: >
              Being defined at $2$ is necessary, not enough. $s$ jumps from
              near $4$ to $5$ however closely you look, and $b$ takes a value
              its neighbours never approach.
        feedback: >
          The three functions were built to pass or fail different tests. Say
          what the tests were.
      - reflect: >
          What exactly were you checking at $2$? State it as a list of
          conditions, each of which one of $b$ or $s$ fails.
        answer: >
          Three conditions: $f(c)$ is defined; $\lim_{x \to c} f(x)$ exists;
          and the two are equal. $s$ fails the second, $b$ fails the third,
          and $a$ passes all three. Together they say
          $\lim_{x \to c} f(x) = f(c)$ — the value is the one the neighbours
          point to — and that single equation is the definition of continuity
          at $c$.

      - part: The definition, unwound
        teach: >
          $f$ is continuous at a point $c$ of its domain when
          $\lim_{x \to c} f(x)$ exists and equals $f(c)$. Unwinding the limit
          with $L = f(c)$: for every $\varepsilon > 0$ there is a
          $\delta > 0$ with $|f(x) - f(c)| < \varepsilon$ for every $x$ in the
          domain with $|x - c| < \delta$. Notice that the puncture
          $0 < |x - c|$ has gone.
      - ask: >
          Why may the puncture be dropped in the continuity version?
        choices:
          - text: >
              Because continuity is only about points other than $c$.
            feedback: >
              Continuity is precisely about the point $c$: it compares the
              value there with the limit. The puncture can go for a different
              reason.
          - text: >
              Because at $x = c$ the demand reads $|f(c) - f(c)| < \varepsilon$,
              that is $0 < \varepsilon$, which is automatic.
            correct: true
            feedback: >
              Including $x = c$ adds one test that always passes, so it costs
              nothing. The limit needed the puncture because $L$ might differ
              from $f(c)$; here $L$ *is* $f(c)$.
          - text: >
              Because $f(c)$ might be undefined.
            feedback: >
              Continuity at $c$ requires $f(c)$ to be defined — that is the
              first condition. The puncture goes for the opposite reason: the
              value is present and is the target.
        feedback: >
          With the limit's target set equal to the value, the point $c$ passes
          its own test for free.
      - ask: >
          Let $p(x) = 2x + k$ for $x < 1$ and $p(x) = x^2 + 3$ for $x \ge 1$.
          Which value of $k$ makes $p$ continuous at $1$?
        expects: "2"
        hint: >
          Check the clauses in turn: the value at $1$, what the values on the
          right approach, what the values on the left approach.
        feedback: >
          The value is $p(1) = 1 + 3 = 4$. From the right, $x^2 + 3 \to 4$.
          From the left, $2x + k \to 2 + k$. The limit exists only if
          $2 + k = 4$, and then it equals the value, so $k = 2$. Any other $k$
          makes $p$ jump at $1$.

      - part: Points that are not there
        ask: >
          Is $f(x) = 1/x$, on its natural domain of all $x \ne 0$,
          discontinuous at $0$?
        choices:
          - text: >
              Yes — it blows up near $0$.
            feedback: >
              Blowing up near a point outside the domain is not a failure at
              any point inside it. Every $c \ne 0$ passes the
              $\varepsilon$–$\delta$ test.
          - text: >
              Yes — you must lift your pen to draw it.
            feedback: >
              The pen lifts because the *domain* has a gap. Continuity is
              checked one domain point at a time, and $0$ is not one of them.
          - text: >
              No — $0$ is not in its domain, so the question does not arise;
              at every point of its domain it is continuous.
            correct: true
            feedback: >
              A function is continuous or not at points where it is defined.
              $1/x$ is continuous everywhere it lives, which is why "draw it
              without lifting the pen" is a picture, never a definition.
        feedback: >
          Continuity is a property at points of the domain. A gap in the domain
          is not a discontinuity.
      - ask: >
          $g(x) = \sqrt{x}$ is defined on $[0, \infty)$. Is it continuous at
          $0$, where there are no points to the left?
        choices:
          - text: >
              No, because the limit from the left does not exist.
            feedback: >
              The definition quantifies over $x$ *in the domain*. There are no
              points left of $0$ in the domain, so there is nothing on the left
              to fail.
          - text: >
              Yes: for $0 \le x < \varepsilon^2$ we have
              $|\sqrt{x} - 0| < \varepsilon$, so $\delta = \varepsilon^2$
              works.
            correct: true
            feedback: >
              Only domain points are tested, so at an endpoint the definition
              becomes one-sided on its own, with no special rule.
          - text: >
              The question is meaningless at an endpoint.
            feedback: >
              It is perfectly meaningful, and it matters: continuity on a
              closed interval $[a,b]$ includes the endpoints, where the test is
              automatically one-sided.
        feedback: >
          On an interval, continuity at an endpoint is one-sided automatically,
          because the quantifier never leaves the domain.
      - ask: >
          Let $q(x) = x^2$ for $x \ne 0$ and $q(0) = 1$. Which clause of
          continuity at $0$ fails?
        choices:
          - text: >
              $q(0)$ is undefined.
            feedback: >
              $q(0) = 1$ is defined. The first clause passes.
          - text: >
              The limit at $0$ does not exist.
            feedback: >
              For $x \ne 0$, $q(x) = x^2 \to 0$; the limit exists and is $0$.
              The second clause passes.
          - text: >
              None — $q$ is continuous at $0$.
            feedback: >
              The limit is $0$ and the value is $1$. Two numbers that differ
              cannot satisfy $\lim_{x \to 0} q(x) = q(0)$.
          - text: >
              The limit exists and the value exists, but $0 \ne 1$.
            correct: true
            feedback: >
              Exactly one clause fails, the agreement. It is the removable
              kind of failure: resetting $q(0) = 0$ repairs it, whereas no
              value at $2$ could repair the jump in $s$.
        feedback: >
          Removable failures break only the last clause; jumps break the
          second, and no choice of value fixes those.
      - teach: >
          Continuity is the one-line promise that $f(c)$ is what the neighbours
          point to. Two theorems take continuity on a closed bounded interval
          as their only hypothesis and return something you could not get
          otherwise: a maximum actually attained, and every intermediate value
          actually hit.

  - node: analysis.svc.evt
    hook: >
      Optimization only makes sense if a maximum exists at all, and the
      Extreme Value Theorem is the guarantee. It is also the engine inside
      Rolle's Theorem, hence inside every mean-value argument in this unit.
    explanation: >
      The gap this theorem closes is the gap between a supremum and a maximum.
      For $f(x) = x$ on $[0,1)$ the set of values has supremum $1$, yet no
      input produces $1$: the function approaches its bound forever and never
      arrives. The Extreme Value Theorem says that on a closed bounded
      interval, a continuous function always arrives.

      Both hypotheses carry weight, and each fails in a different way. Drop
      closedness and $f(x) = 1/x$ on $(0,1]$ is continuous but not even
      bounded. Drop boundedness and $f(x) = x$ on $[0,\infty)$ is continuous
      and unbounded again. Neither hypothesis is decoration.

      Boundedness is where completeness enters. Let $S$ be the set of
      $x \in [a,b]$ for which $f$ is bounded on $[a,x]$. It contains $a$ and
      lies inside $[a,b]$, so by the Completeness axiom of $\mathbb{R}$ it has
      a supremum $s$. Continuity at $s$ hands you a window around $s$ on which
      $f$ stays within $1$ of $f(s)$; gluing that window onto a bound for
      $[a, x]$ with $x$ just below $s$ shows $s \in S$, and shows $S$ reaches
      past $s$ unless $s = b$. So $s = b$ and $f$ is bounded on $[a,b]$.

      Attainment then falls out by a trick worth remembering. The value set is
      nonempty and bounded above, so it has a supremum $M$. Suppose $f$ never
      equals $M$. Then $M - f(x) > 0$ for every $x$, so
      $g(x) = \dfrac{1}{M - f(x)}$ is continuous on $[a,b]$ — a quotient whose
      denominator never vanishes — and by the boundedness just proved,
      $g(x) \le K$ for some $K > 0$. Unwinding gives $f(x) \le M - 1/K$ for
      every $x$, an upper bound *strictly smaller* than $M$. That contradicts
      $M$ being the least upper bound, so $f(q) = M$ for some $q \in [a,b]$.
      Applying the same argument to $-f$ produces the minimum.
    worked: >
      Take $f(x) = x^2 - 4x + 1$ on $[0,3]$. It is a polynomial, hence
      continuous, and $[0,3]$ is closed and bounded, so both bounds must be
      attained. Complete the square: $f(x) = (x - 2)^2 - 3$. The square is
      never negative and equals $0$ exactly at $x = 2$, which lies in $[0,3]$,
      so the minimum value is $-3$, attained at $q = 2$. For the maximum,
      $(x-2)^2$ is largest at whichever endpoint is farthest from $2$: at
      $x = 0$ it is $4$ and at $x = 3$ it is $1$, so the maximum value is
      $4 - 3 = 1$, attained at $p = 0$. Both are genuinely reached. Now delete
      one endpoint and work on $(0,3]$ instead: the values still have supremum
      $1$, since $f(x)$ climbs toward $1$ as $x$ decreases toward $0$, but
      $f(x) < 1$ at every point of $(0,3]$. The supremum survives; the maximum
      does not.
    pitfalls: >
      The theorem needs *both* closed and bounded, and neither alone suffices —
      $1/x$ on $(0,1]$ and $x$ on $[0,\infty)$ are the two counterexamples to
      keep in your pocket. Having a supremum is not the same as having a
      maximum: completeness gives the supremum for free, and the whole content
      of this theorem is that continuity plus a closed bounded interval turns
      it into a value. And the theorem locates nothing — it promises that some
      $p$ and $q$ exist, not that they are interior, not that they are unique,
      and not that they sit where a derivative vanishes.
    recap: >
      A continuous function on a closed bounded interval is bounded and
      actually attains its supremum and infimum, so "the maximum of $f$ on
      $[a,b]$" always names a real value at a real point.
    dialogue:
      - part: A bound that is never reached
        teach: >
          Take $f(x) = x$ on the half-open interval $[0,1)$. Its values fill
          $[0,1)$ as well. The set of values is bounded, so by completeness it
          has a supremum.
      - ask: >
          What is the supremum of the values of $f(x) = x$ on $[0,1)$?
        expects: "1"
        hint: >
          The least number that no value exceeds.
        feedback: >
          $1$. No value exceeds $1$, and any number $b < 1$ is beaten by a
          value, such as $(b + 1)/2$ when $b \ge 0$. Yet no $x$ in $[0,1)$ has
          $f(x) = 1$: the function approaches its supremum forever and never
          arrives.
      - ask: >
          Now take $g(x) = x^2 - 4x + 1$ on the closed interval $[0,3]$. What
          is its largest value?
        expects: "1"
        hint: >
          Write $g(x) = (x - 2)^2 - 3$, and ask which point of $[0,3]$ lies
          farthest from $2$.
        feedback: >
          $g(x) = (x - 2)^2 - 3$, and $(x - 2)^2$ is largest where $x$ is
          farthest from $2$: at $x = 0$ it is $4$, at $x = 3$ only $1$. So the
          maximum is $4 - 3 = 1$, attained at the endpoint $x = 0$. (The
          minimum is $-3$, attained at $x = 2$.)
      - ask: >
          Delete one endpoint and look at $g$ on $(0,3]$ instead. Does $g$
          still have a largest value?
        choices:
          - text: >
              Yes, $1$, the same as before.
            feedback: >
              $1$ was attained only at $x = 0$, which is gone. Every point of
              $(0,3]$ has $g(x) < 1$.
          - text: >
              Yes, at $x = 3$, now the only endpoint.
            feedback: >
              $g(3) = -2$, but $g(0.1) = 3.61 - 3 = 0.61$ is larger. Being an
              endpoint earns nothing on its own.
          - text: >
              No: the supremum is still $1$, but no point of $(0,3]$ attains
              it.
            correct: true
            feedback: >
              As $x$ decreases to $0$, $g(x)$ climbs toward $1$ without
              reaching it. The supremum survives the deletion; the maximum does
              not.
          - text: >
              No, because $g$ is now unbounded.
            feedback: >
              $g$ stays between $-3$ and $1$ on $(0,3]$. It is bounded; it
              merely fails to reach its bound.
        feedback: >
          Removing a single point turned a maximum back into a mere supremum —
          the same trouble as $x$ on $[0,1)$.
      - reflect: >
          On $[0,1)$ and on $(0,3]$ the values head toward their supremum as
          $x$ heads toward a missing endpoint. What would stop that from
          happening on a closed interval $[a,b]$, and which hypothesis on $f$
          would you need?
        answer: >
          On $[a,b]$ the place the inputs crowd toward is always a point of
          the interval, so $f$ has a value there. If $f$ is continuous at that
          point, the value must be the one the neighbours approach — the
          supremum itself. A missing endpoint or a jump are exactly the two
          ways the supremum can escape.
      - teach: >
          That is the Extreme Value Theorem. If $f$ is continuous on the
          closed bounded interval $[a,b]$, then $f$ is bounded and there are
          points $p$ and $q$ in $[a,b]$ with $f(p) \le f(x) \le f(q)$ for every
          $x$ in $[a,b]$. Completeness supplies the supremum; the theorem says
          continuity on $[a,b]$ turns it into a value.

      - part: Catching the supremum
        teach: >
          The first half, boundedness, is a supremum argument: take the set of
          $x$ for which $f$ is bounded on $[a,x]$, and continuity at its
          supremum pushes that supremum to $b$. Grant it. Now let $M$ be the
          supremum of the values, and suppose, hoping for a contradiction, that
          $f(x) \ne M$ for every $x$. Then $M - f(x) > 0$ everywhere.
      - reflect: >
          From $M - f(x) > 0$, build a new function that is continuous on
          $[a,b]$ — so bounded, by the first half — yet ought to be unbounded,
          because $f(x)$ gets arbitrarily close to $M$.
        hint: >
          What happens to $1/t$ as $t$ shrinks toward $0$?
        answer: >
          Take $h(x) = \dfrac{1}{M - f(x)}$. Its denominator never vanishes,
          so $h$ is continuous on $[a,b]$, and therefore bounded, say
          $h(x) \le K$. But values $f(x)$ come arbitrarily close to $M$, making
          $M - f(x)$ arbitrarily small and $h(x)$ arbitrarily large. The two
          cannot both hold, so $f$ must equal $M$ somewhere.
      - ask: >
          Make the contradiction concrete. Suppose $M = 5$ and
          $h(x) = \dfrac{1}{5 - f(x)} \le 4$ for every $x$. What upper bound
          on $f$ follows?
        expects: "4.75"
        hint: >
          Invert $\dfrac{1}{5 - f(x)} \le 4$; both sides are positive.
        feedback: >
          $\dfrac{1}{5 - f(x)} \le 4$ gives $5 - f(x) \ge \dfrac{1}{4}$, so
          $f(x) \le 4.75$ for every $x$. That is an upper bound below $5$,
          contradicting $5$ being the *least* upper bound. In general
          $f \le M - 1/K$, and the same run on $-f$ yields the minimum.

      - part: Breaking the hypotheses
        ask: >
          Each function below is continuous where it is defined. Which one is
          guaranteed a maximum?
        choices:
          - text: >
              $f(x) = x$ on $[0, \infty)$
            feedback: >
              The interval is closed but unbounded, and $f$ climbs past every
              number. Boundedness of the interval is its own hypothesis.
          - text: >
              $f(x) = 1/x$ on $(0,1]$
            feedback: >
              The interval is bounded but not closed. Near the missing endpoint
              $1/x$ passes every bound, so there is not even a supremum.
          - text: >
              $f(x) = x^2$ on $[-1, 2]$
            correct: true
            feedback: >
              Continuous on a closed bounded interval, so the theorem applies:
              the maximum is $4$, at $x = 2$, and the minimum is $0$, at
              $x = 0$.
          - text: >
              $f(x) = x$ on $(0,1)$
            feedback: >
              Bounded, with supremum $1$, but both endpoints are missing and
              the supremum is never attained.
        feedback: >
          Closed and bounded are separate demands: $x$ on $[0,\infty)$ fails
          the second, $1/x$ on $(0,1]$ the first.
      - ask: >
          Let $f(x) = x$ for $0 \le x < 1$ and $f(1) = 0$, on the closed
          interval $[0,1]$. It has no maximum. Which hypothesis failed?
        choices:
          - text: >
              The interval is not closed.
            feedback: >
              $[0,1]$ contains both endpoints. The interval is fine; the
              function misbehaves at one of its points.
          - text: >
              Continuity at $x = 1$: the values approach $1$ but $f(1) = 0$.
            correct: true
            feedback: >
              The supremum $1$ is exactly the value continuity at $1$ would
              have forced. With the jump, the supremum escapes through that
              single point.
          - text: >
              Boundedness: $f$ is unbounded near $1$.
            feedback: >
              $f$ stays between $0$ and $1$. It is bounded, and still fails to
              reach its supremum.
        feedback: >
          All three ingredients matter: a closed interval, a bounded interval,
          and continuity at every point of it.
      - ask: >
          What does the Extreme Value Theorem tell you about *where* the
          maximum of a continuous $f$ on $[a,b]$ occurs?
        choices:
          - text: >
              At an interior point.
            feedback: >
              For $g(x) = (x - 2)^2 - 3$ on $[0,3]$ the maximum sat at the
              endpoint $x = 0$. Endpoints are allowed, and common.
          - text: >
              Where the derivative is zero.
            feedback: >
              The theorem mentions no derivatives, and $f$ need not have one.
              Locating extrema by derivatives is a separate argument.
          - text: >
              Nothing: it promises that some point attains the maximum.
            correct: true
            feedback: >
              A pure existence statement. It gives a $q$ with
              $f(x) \le f(q)$ for every $x$ and says nothing about where $q$ is
              or whether it is unique.
        feedback: >
          Existence first, location later.
      - teach: >
          A continuous function on a closed bounded interval really reaches its
          highest and lowest values. That promise of a point is exactly what
          Rolle's Theorem needs before it can say anything about a derivative
          there.

  - node: analysis.svc.ivt
    hook: >
      Every root-finding argument you will ever write starts here: if a
      continuous function is negative somewhere and positive somewhere else, it
      is zero in between, and completeness is what makes that true.
    explanation: >
      Picture the graph as a curve joining the point $(a, f(a))$ to
      $(b, f(b))$, and picture a horizontal line at some height $y$ strictly
      between those two values. The Intermediate Value Theorem says the curve
      cannot get from one side of that line to the other without touching it.
      Continuity is the whole hypothesis: the function equal to $-1$ for
      $x < 0$ and $1$ for $x \ge 0$ runs from $-1$ to $1$ on $[-1,1]$ and skips
      the value $0$ entirely.

      The proof is a supremum argument, and it is worth following once because
      the same move reappears whenever you want to produce a specific point out
      of thin air. Suppose $f(a) < y < f(b)$ and let
      $S = \{x \in [a,b] : f(x) < y\}$. It contains $a$, and $b$ bounds it
      above, so completeness gives $c = \sup S$.

      Now rule out both ways $f(c)$ could miss $y$. If $f(c) < y$, continuity
      with $\varepsilon = y - f(c)$ produces a window around $c$ on which $f$
      stays below $y$; since $f(b) > y$ we have $c < b$, so that window
      contains points to the right of $c$ that belong to $S$ — contradicting
      that $c$ is an upper bound. If instead $f(c) > y$, continuity with
      $\varepsilon = f(c) - y$ produces a window on which $f$ stays above $y$,
      so no point of that window is in $S$ and something strictly less than $c$
      already bounds $S$ — contradicting leastness. Only $f(c) = y$ survives.

      The standard restatement is that the continuous image of an interval is
      an interval: if a continuous function takes two values, it takes every
      value between them, which is exactly what "is an interval" means. The
      practical payoff is bracketing. Find one input where $f$ is negative and
      one where it is positive, and you have trapped a root — then halve the
      bracket repeatedly and the trap tightens as far as you like.
    worked: >
      Locate a root of $f(x) = x^3 - 2x - 5$. It is a polynomial, hence
      continuous everywhere. Evaluate at two convenient points:
      $f(2) = 8 - 4 - 5 = -1$ and $f(3) = 27 - 6 - 5 = 16$. Since $0$ lies
      strictly between $-1$ and $16$, the theorem gives a $c \in (2,3)$ with
      $f(c) = 0$. Now bisect. The midpoint gives
      $f(2.5) = 15.625 - 5 - 5 = 5.625 > 0$, so the root lies in $(2, 2.5)$.
      Next, $f(2.25) = 11.390625 - 4.5 - 5 = 1.890625 > 0$, so the root lies in
      $(2, 2.25)$. Then $f(2.1) = 9.261 - 4.2 - 5 = 0.061 > 0$, narrowing to
      $(2, 2.1)$, and $f(2.05) = 8.615125 - 4.1 - 5 = -0.484875 < 0$, narrowing
      to $(2.05, 2.1)$. Four evaluations have pinned the root to a window of
      width $0.05$, and it is $c \approx 2.09$.
    pitfalls: >
      The theorem gives existence, never uniqueness or count — a continuous
      function may cross the level $y$ once, seventeen times, or on a whole
      subinterval. Its converse is false: the function equal to
      $\sin(1/x)$ for $x \ne 0$ and $0$ at $0$ takes every intermediate value
      on $[-1,1]$ and is nonetheless discontinuous at $0$, so the intermediate
      value property does not imply continuity. And continuity is needed on the
      *whole* closed interval: a single jump anywhere between $a$ and $b$ is
      enough to let the function step over $y$.
    recap: >
      A continuous function on $[a,b]$ takes every value between $f(a)$ and
      $f(b)$, which turns "the sign changed" into "there is a root".
    dialogue:
      - part: A root nobody can write down
        teach: >
          Take $f(x) = x^3 - 2x - 5$. There is no friendly formula for its
          roots, and you are not going to find one. The question is whether
          you can still prove a root exists, and pin it down.
      - ask: >
          What is $f(2)$?
        expects: "-1"
        feedback: >
          $f(2) = 8 - 4 - 5 = -1$. And $f(3) = 27 - 6 - 5 = 16$.
      - ask: >
          $f(2) = -1$ and $f(3) = 16$. Must $f$ have a root between $2$ and
          $3$?
        choices:
          - text: >
              You cannot tell without solving the cubic.
            feedback: >
              Solving is exactly what you want to avoid, and it is not needed.
              A polynomial is continuous, and a continuous graph cannot get from
              below the axis to above it without meeting it.
          - text: >
              Yes, and exactly one.
            feedback: >
              At least one is guaranteed; *exactly* one would need more work.
              Nothing about the two endpoint values rules out three crossings.
          - text: >
              Yes: $f$ is continuous, and it cannot get from $-1$ to $16$
              without passing $0$.
            correct: true
            feedback: >
              That is the claim this lesson proves. It gives a root in the open
              interval $(2,3)$ without solving anything.
        feedback: >
          A sign change plus continuity traps a root. The same trap can be
          tightened as far as you like.
      - ask: >
          Halve the bracket. What is $f(2.5)$?
        expects: "5.625"
        hint: >
          $2.5^3 = 15.625$.
        feedback: >
          $f(2.5) = 15.625 - 5 - 5 = 5.625 > 0$, so the sign change, and a
          root, sits in $(2, 2.5)$. Continuing: $f(2.25) > 0$, $f(2.1) > 0$,
          $f(2.05) < 0$, and the root is trapped in $(2.05, 2.1)$.
      - ask: >
          Each halving cuts the bracket's width in two. Starting from width
          $1$, how many halvings are needed before the width is below
          $0.001$?
        expects: "10"
        hint: >
          After $k$ halvings the width is $1/2^k$.
        feedback: >
          $1/2^k < 0.001$ means $2^k > 1000$. Since $2^9 = 512$ and
          $2^{10} = 1024$, ten halvings suffice: three correct decimal places
          for ten evaluations of a cubic.

      - part: Where the crossing point comes from
        ask: >
          Let $s(x) = -1$ for $x < 0$ and $s(x) = 1$ for $x \ge 0$, on
          $[-1,1]$. It runs from $-1$ to $1$. Does it take the value $0$?
        choices:
          - text: >
              Yes, at $x = 0$, halfway across.
            feedback: >
              $s(0) = 1$. Every value of $s$ is $-1$ or $1$.
          - text: >
              No: it jumps over $0$, which is possible only because it is not
              continuous at $0$.
            correct: true
            feedback: >
              Endpoint values of opposite sign are not enough. Continuity is
              the entire hypothesis that makes the trap close.
          - text: >
              Yes, because it has values on both sides of $0$.
            feedback: >
              Having values on both sides is exactly what the step function
              has, and it still skips $0$. Something about $s$ must fail.
        feedback: >
          So a proof must spend continuity somewhere. The question is how to
          produce the crossing point at all.
      - reflect: >
          Suppose $f$ is continuous on $[a,b]$ with $f(a) < y < f(b)$. You hold
          the completeness of $\mathbb{R}$, which hands you suprema of bounded
          sets. Which set would you take the supremum of, to land on a point
          where $f$ equals $y$?
        hint: >
          Think of the last moment the graph is still below the line at height
          $y$.
        answer: >
          Take $S = \{x \in [a,b] : f(x) < y\}$, the inputs where the graph is
          below the line. It contains $a$ and is bounded by $b$, so it has a
          supremum $c$, the "last moment below $y$". Continuity at $c$ then
          rules out both $f(c) < y$ and $f(c) > y$, leaving $f(c) = y$.
      - teach: >
          That is the Intermediate Value Theorem. If $f$ is continuous on
          $[a,b]$ and $y$ lies between $f(a)$ and $f(b)$, then $f(c) = y$ for
          some $c \in [a,b]$, and $c$ can be taken in $(a,b)$ when $y$ is
          strictly between. In the proof, $c = \sup S$ with
          $S = \{x \in [a,b] : f(x) < y\}$.
      - ask: >
          Suppose $f(c) < y$. Continuity, with $\varepsilon = y - f(c)$, keeps
          $f$ below $y$ on a whole window around $c$. Why is that a
          contradiction?
        choices:
          - text: >
              Points of that window just right of $c$ are in $S$, so $c$ is
              not an upper bound of $S$.
            correct: true
            feedback: >
              Since $f(b) > y$, $c \ne b$, so the window reaches past $c$ into
              $[a,b]$. Those points have $f < y$ and lie above the supposed
              upper bound. The other case, $f(c) > y$, shows instead that
              something smaller than $c$ already bounds $S$.
          - text: >
              Points just left of $c$ are not in $S$, so $c$ is not the least
              upper bound.
            feedback: >
              That is the argument for the other case, $f(c) > y$. Here $f$ is
              *below* $y$ near $c$, so points on both sides of $c$ belong to
              $S$.
          - text: >
              It is not a contradiction; $c$ is simply a point where $f$ is
              below $y$.
            feedback: >
              $c$ was defined as the supremum of the below-$y$ set. If the
              graph is still below $y$ a little to the right of $c$, then $c$
              was not the last moment below $y$.
        feedback: >
          Each miss contradicts one half of "least upper bound": $f(c) < y$
          breaks *upper bound*, $f(c) > y$ breaks *least*.
      - ask: >
          Run the construction on $f(x) = x^2$ over $[0,2]$ with $y = 2$:
          $S = \{x \in [0,2] : x^2 < 2\}$. What is $\sup S$, to four decimal
          places?
        expects: "1.4142"
        tolerance: 0.0005
        feedback: >
          $\sup S = \sqrt{2} \approx 1.4142$, and $f(\sqrt{2}) = 2 = y$. This
          is also how completeness proves $\sqrt{2}$ exists at all: over the
          rationals, $S$ has no least upper bound, and the theorem fails.

      - part: What it does not promise
        ask: >
          A continuous $f$ has $f(0) = -3$ and $f(4) = 7$. What may you
          conclude?
        choices:
          - text: >
              $f$ has exactly one root in $(0,4)$.
            feedback: >
              The theorem gives *at least one*. $f$ could cross zero three
              times, or vanish on a whole subinterval.
          - text: >
              $f$ is increasing somewhere in $(0,4)$.
            feedback: >
              The theorem is about which values are taken, not about how $f$
              moves between them. No rate or direction follows.
          - text: >
              $f$ has at least one root in $(0,4)$.
            correct: true
            feedback: >
              $0$ is strictly between $-3$ and $7$, so some $c$ in the open
              interval has $f(c) = 0$. Existence is the whole claim.
        feedback: >
          A sign change plus continuity gives a root, and nothing more: not
          uniqueness, not a count, not a location beyond the bracket.
      - ask: >
          Which set could be the set of all values of a continuous function on
          $[0,1]$?
        choices:
          - text: >
              $\{0, 1\}$
            feedback: >
              A continuous function taking $0$ and $1$ takes every value
              between, such as $1/2$.
          - text: >
              $[0,1] \cup [2,3]$
            feedback: >
              It would take $1$ and $2$ and skip $1.5$, which the theorem
              forbids.
          - text: >
              $[-2, 5]$
            correct: true
            feedback: >
              An interval. The theorem says exactly this: the continuous image
              of an interval is an interval.
          - text: >
              The rational numbers in $[0,1]$
            feedback: >
              Taking $0$ and $1$ forces taking every irrational in between,
              such as $1/\sqrt{2}$.
        feedback: >
          Taking two values forces taking everything between them, which is
          what it means for the set of values to be an interval.
      - ask: >
          Does taking every intermediate value imply continuity?
        choices:
          - text: >
              Yes: skipping no value is what continuity means.
            feedback: >
              Continuity is an $\varepsilon$–$\delta$ condition at each point,
              not a statement about the set of values, and the two part ways.
          - text: >
              No: the function equal to $\sin(1/x)$ for $x \ne 0$ and $0$ at
              $0$ skips no value, yet is discontinuous at $0$.
            correct: true
            feedback: >
              In every window around $0$ it oscillates through all of
              $[-1,1]$, so no value is skipped, but it has no limit at $0$.
          - text: >
              No, because the property only makes sense on closed intervals.
            feedback: >
              The property makes sense on any interval. The implication fails
              because a function can hit every value while oscillating too
              wildly to have a limit.
        feedback: >
          Continuity gives the intermediate value property; the converse is
          false.
      - teach: >
          Keep the pair together. The Extreme Value Theorem says a continuous
          function on $[a,b]$ reaches its highest and lowest values; this one
          says it reaches everything between. The image of $[a,b]$ is a closed
          bounded interval, and every sign change of a continuous function
          traps a root.

  - node: analysis.svc.def-derivative
    hook: >
      Speed at an instant sounds like a contradiction — speed is distance over
      time and an instant has no duration. The derivative is the resolution,
      and it is the reason limits were worth defining so carefully.
    explanation: >
      Fix $c$ and pick a nearby point $c + h$. The quotient
      $\dfrac{f(c+h) - f(c)}{h}$ is the slope of the straight line through the
      two points on the graph — the *secant* — and it is an honest average rate
      of change over a window of width $h$. As $h$ shrinks the secant pivots
      about $(c, f(c))$, and the derivative is what its slope settles on:
      $f'(c) = \lim_{h \to 0} \dfrac{f(c+h) - f(c)}{h}$, provided that limit
      exists as a finite number.

      Setting $h = 0$ is exactly what you may not do — the quotient becomes
      $0/0$. This is where the puncture in the limit definition earns its
      keep: the limit examines only $h \ne 0$, so every algebraic
      simplification you perform, including cancelling a factor of $h$, is
      legal throughout the region the limit looks at. The alternative form
      $f'(c) = \lim_{x \to c} \dfrac{f(x) - f(c)}{x - c}$ is the same
      statement after the substitution $x = c + h$.

      One computation from the definition does all polynomials at once. For
      $f(x) = x^n$ with $n$ a positive integer, use the factorization
      $x^n - c^n = (x - c)(x^{n-1} + x^{n-2}c + \cdots + c^{n-1})$, which you
      can verify by expanding: everything cancels in pairs. Dividing by
      $x - c$, legal since $x \ne c$, leaves a sum of $n$ terms, each tending
      to $c^{n-1}$ as $x \to c$. So $f'(c) = n\,c^{n-1}$. In particular the
      derivative of $x^2$ is $2x$ and the derivative of $x^3$ is $3x^2$, both
      earned from the definition rather than assumed.

      When $f$ is differentiable at every point of an open set, $f'$ becomes a
      function on that set in its own right, and can be differentiated again.
      The definition also demands that $f$ be defined on a full neighborhood of
      $c$, both sides included, because the limit tests $x$ on the left of $c$
      as well as the right.
    worked: >
      Differentiate $f(x) = 1/x$ at $c = 2$ from the definition. Form the
      difference quotient and clear the compound fraction:
      $\dfrac{f(2+h) - f(2)}{h}
      = \dfrac{1}{h}\left(\dfrac{1}{2+h} - \dfrac{1}{2}\right)
      = \dfrac{1}{h}\cdot\dfrac{2 - (2+h)}{2(2+h)}
      = \dfrac{-h}{2h(2+h)}$.
      For every $h \ne 0$ — and the limit looks at nothing else — this
      simplifies to $\dfrac{-1}{2(2+h)}$. As $h \to 0$ the denominator tends to
      $4$, so $f'(2) = -\dfrac{1}{4}$. Sanity-check the sign and size against
      the picture: $1/x$ is decreasing, so a negative slope is right, and it is
      a gentle decrease near $x = 2$, consistent with a slope of only
      $-0.25$.
    pitfalls: >
      Cancelling the $h$ is not sloppiness to be apologised for — it is valid
      precisely because the limit never evaluates at $h = 0$, and saying so is
      part of the proof. The limit must be *finite*: for $f(x) = x^{1/3}$ at
      $c = 0$ the difference quotient is $h^{-2/3}$, which grows without bound,
      so $f$ is not differentiable at $0$ even though the graph has a perfectly
      good vertical tangent there. And a one-sided limit is not enough: $f$
      must be defined and behave on both sides of $c$, which is why
      differentiability is stated on open sets.
    recap: >
      The derivative at $c$ is the limit of secant slopes over shrinking
      windows, and it exists exactly when those average rates of change settle
      on a single finite number.
    dialogue:
      - part: Speed at an instant
        teach: >
          A stone dropped from a cliff has fallen $s(t) = 5t^2$ metres after
          $t$ seconds. How fast is it moving at the instant $t = 2$? Speed is
          distance over time, and an instant has no duration, so start with
          what you can compute: average speeds.
      - ask: >
          What is the stone's average speed between $t = 2$ and $t = 3$, in
          metres per second?
        expects: "25"
        feedback: >
          $\dfrac{s(3) - s(2)}{3 - 2} = \dfrac{45 - 20}{1} = 25$.
      - ask: >
          And between $t = 2$ and $t = 2.1$?
        expects: "20.5"
        hint: >
          $2.1^2 = 4.41$.
        feedback: >
          $s(2.1) = 5(4.41) = 22.05$, so the average is
          $\dfrac{22.05 - 20}{0.1} = \dfrac{2.05}{0.1} = 20.5$.
      - ask: >
          Over the window from $2$ to $2 + h$, the average speed is
          $\dfrac{s(2+h) - s(2)}{h}$. For $h \ne 0$, what does it simplify to?
        choices:
          - text: >
              $20 + 5h$
            correct: true
            feedback: >
              $5(2 + h)^2 - 20 = 20h + 5h^2$, and dividing by $h \ne 0$ gives
              $20 + 5h$. Check: $h = 1$ gives $25$, $h = 0.1$ gives $20.5$.
          - text: >
              $20 + 5h^2$
            feedback: >
              The numerator is $20h + 5h^2$; dividing by $h$ lowers every
              power of $h$ by one. At $h = 1$ this would give $25$ correctly
              but at $h = 0.1$ it gives $20.05$, not $20.5$.
          - text: >
              $5h$
            feedback: >
              That drops the cross term. $(2 + h)^2 = 4 + 4h + h^2$, so
              $5(2+h)^2 - 20 = 20h + 5h^2$, not $5h^2$.
        feedback: >
          The average speed over $[2, 2 + h]$ is $20 + 5h$ — honest for every
          $h \ne 0$.
      - ask: >
          Why not find the speed at the instant by putting $h = 0$ into
          $\dfrac{s(2+h) - s(2)}{h}$?
        choices:
          - text: >
              You can; it gives $20$.
            feedback: >
              Putting $h = 0$ into $20 + 5h$ gives $20$, but $20 + 5h$ equals
              the quotient only for $h \ne 0$. Put $h = 0$ into the quotient
              itself and it reads $0/0$.
          - text: >
              It gives $\dfrac{0}{0}$, which is not a number.
            correct: true
            feedback: >
              A window of width $0$ has no distance and no time. The average
              speed exists for every $h \ne 0$ and for no other $h$.
          - text: >
              It gives infinity, since you divide by $0$.
            feedback: >
              The numerator is $0$ too: $s(2) - s(2) = 0$. The result is not
              infinity but no number at all.
        feedback: >
          The quotient is defined everywhere except the one place you care
          about.
      - reflect: >
          The average speed is $20 + 5h$ for every $h \ne 0$ and meaningless at
          $h = 0$. Which tool from this unit asks where a quantity is heading
          while refusing to look at the point itself? Use it to say what the
          speed at $t = 2$ should be.
        answer: >
          The limit: $\lim_{h \to 0}$ examines only $h \ne 0$, thanks to the
          puncture $0 < |h|$, which is exactly the region where the quotient
          makes sense. Since the quotient is $20 + 5h$ there, the limit is
          $20$, so the speed at $t = 2$ is $20$ metres per second.
      - teach: >
          That limit is the derivative. $f$ is differentiable at $c$ when
          $f'(c) = \lim_{h \to 0} \dfrac{f(c+h) - f(c)}{h}$ exists as a
          finite number; equivalently
          $f'(c) = \lim_{x \to c} \dfrac{f(x) - f(c)}{x - c}$, after
          substituting $x = c + h$. $f$ must be defined on a whole
          neighbourhood of $c$, because the limit tests both sides.

      - part: Computing from the definition
        ask: >
          You cancelled $h$ in $\dfrac{20h + 5h^2}{h} = 20 + 5h$. Why is that
          legitimate?
        choices:
          - text: >
              Because $h$ is very small, so the error is negligible.
            feedback: >
              No error is made at all: the two sides are equal for every
              $h \ne 0$. Calling it an approximation hides an exact identity.
          - text: >
              Because we agree that $0/0$ equals $20$ here.
            feedback: >
              $0/0$ is never assigned a value. The limit sidesteps the point
              $h = 0$ instead of filling it in.
          - text: >
              Because the limit examines only $h \ne 0$, where the two
              expressions are equal.
            correct: true
            feedback: >
              The puncture in the limit definition is what licenses it: an
              identity valid for all $h \ne 0$ may be used freely inside
              $\lim_{h \to 0}$.
        feedback: >
          Cancelling is an identity on the punctured window, and the limit
          looks nowhere else.
      - ask: >
          Let $f(x) = 1/x$. Using the definition, what is $f'(2)$?
        expects: "-1/4"
        hint: >
          Combine $\dfrac{1}{2+h} - \dfrac{1}{2}$ into a single fraction
          before dividing by $h$.
        feedback: >
          $\dfrac{1}{2+h} - \dfrac{1}{2} = \dfrac{2 - (2+h)}{2(2+h)}
          = \dfrac{-h}{2(2+h)}$, so the quotient is $\dfrac{-1}{2(2+h)}$ for
          $h \ne 0$, which tends to $-\dfrac{1}{4}$. Negative, as it should be
          for a decreasing function.
      - teach: >
          One computation handles every power at once. Expanding shows
          $x^n - c^n = (x - c)(x^{n-1} + x^{n-2}c + \cdots + c^{n-1})$, a sum
          of $n$ terms. Divide by $x - c$, legal since $x \ne c$, and let
          $x \to c$: each of the $n$ terms tends to $c^{n-1}$.
      - ask: >
          So what is the derivative of $f(x) = x^5$ at $c = 2$?
        expects: "80"
        hint: >
          The derivative of $x^n$ is $n\,c^{n-1}$.
        feedback: >
          $n\,c^{n-1} = 5 \cdot 2^4 = 80$. The stone's $5t^2$ fits the same
          pattern: $5 \cdot 2t = 10t$, which is $20$ at $t = 2$.

      - part: When the limit refuses
        ask: >
          For $f(x) = x^{1/3}$ at $c = 0$, the difference quotient is
          $\dfrac{h^{1/3}}{h} = h^{-2/3}$, which grows past every bound as
          $h \to 0$. Is $f$ differentiable at $0$?
        choices:
          - text: >
              Yes, with $f'(0) = \infty$.
            feedback: >
              The definition asks for a *finite* real number. $\infty$ is not
              one, and a quotient that grows past every bound has no limit in
              $\mathbb{R}$.
          - text: >
              No: the limit must be a finite number, and here there is none.
            correct: true
            feedback: >
              The graph has a vertical tangent at $0$, and a vertical line has
              no slope. That is exactly the failure.
          - text: >
              Yes, with $f'(0) = 0$, since the graph is symmetric about the
              origin.
            feedback: >
              Symmetry says nothing about the quotient's size. At
              $h = 0.001$ the quotient is $0.001^{-2/3} = 100$, and it only
              grows.
        feedback: >
          Existence of the derivative is a real condition: the limit must
          exist and be finite.
      - teach: >
          When $f'$ exists at every point of an open set, it is a new function
          there, ready to be differentiated again or fed into a theorem. The
          same limit can also be read backwards, as the slope of the best
          straight-line approximation to $f$ near $c$.

  - node: analysis.svc.intuition-linearization
    hook: >
      Zoom far enough into the graph of a differentiable function and it looks
      like a straight line. That is not a happy accident about pictures — it is
      an exact restatement of what the derivative is, and it is why derivatives
      are the right tool for approximation and optimization.
    explanation: >
      Every line through the point $(c, f(c))$ has the form
      $y = f(c) + m(x - c)$; only the slope $m$ is up for grabs. Ask which
      choice of $m$ approximates $f$ best near $c$, and measure the damage with
      the error $r(h) = f(c + h) - f(c) - mh$. Every line does well in the
      crudest sense — if $f$ is continuous then $r(h) \to 0$ for any $m$
      whatsoever — so that test cannot pick a winner.

      The right test is to compare the error against $h$ itself. Divide:
      $\dfrac{r(h)}{h} = \dfrac{f(c+h) - f(c)}{h} - m$. That single line is the
      whole idea. The left side tends to $0$ exactly when the difference
      quotient tends to $m$, which is exactly the statement that $f$ is
      differentiable at $c$ with $f'(c) = m$. So differentiability is not
      merely *related* to having a good linear approximation; the two are the
      same sentence written twice.

      Only one slope passes the test, which is what makes the tangent line
      $y = f(c) + f'(c)(x - c)$ *the* tangent rather than *a* good line. Pick
      any other $m$ and $r(h)/h$ tends to $f'(c) - m \ne 0$, so the error stays
      proportional to $h$ instead of shrinking faster than it. The tangent's
      error is small *compared to the step you took*, and that is the sense in
      which zooming makes the graph look straight: halve the window and the
      visible gap between curve and line shrinks by more than half, until at
      screen resolution there is no gap left.

      Two payoffs follow immediately. For estimation, $f(c + h) \approx f(c) +
      f'(c)h$ comes with a guarantee about how the error behaves as $h$
      shrinks, not just a hope. For optimization, at an interior maximum the
      term $f'(c)h$ would push the value up on one side or the other unless
      $f'(c) = 0$ — which is precisely the argument Rolle's Theorem runs.
    worked: >
      Take $f(x) = x^2$ at $c = 3$, where $f(3) = 9$ and $f'(3) = 6$. The
      tangent line is $y = 9 + 6(x - 3)$. Compute the error exactly:
      $f(3 + h) = 9 + 6h + h^2$, so $r(h) = h^2$ and $r(h)/h = h$, which indeed
      tends to $0$. Put numbers on it. At $h = 0.1$ the linear estimate is
      $9 + 6(0.1) = 9.6$ while the true value is $9.61$, an error of $0.01$. At
      $h = 0.01$ the estimate is $9.06$ against a true $9.0601$, an error of
      $0.0001$. Shrinking the step by a factor of $10$ shrank the error by
      $100$. Now sabotage the slope and take $m = 5$ instead:
      $r(h) = f(3+h) - 9 - 5h = h + h^2$, so $r(h)/h = 1 + h$, which tends to
      $1$, not $0$. At $h = 0.01$ that line is off by $0.0101$ — a hundred
      times worse than the tangent, and the gap widens as you zoom.
    pitfalls: >
      Demanding only $r(h) \to 0$ picks out nothing: that is just continuity,
      and every line through the point satisfies it. The condition is
      $r(h)/h \to 0$, error negligible *relative to* the step. The
      approximation is also strictly local — the tangent to $x^2$ at $3$
      estimates $f(10)$ as $51$ against a true $100$, and no amount of
      differentiability at $3$ makes that better. And "looks straight when you
      zoom" never names a fixed window: the window that achieves a given
      tolerance depends on the tolerance, exactly as $\delta$ depends on
      $\varepsilon$.
    recap: >
      $f$ is differentiable at $c$ with slope $m$ precisely when
      $f(c+h) = f(c) + mh + r(h)$ with $r(h)/h \to 0$, so the derivative is the
      slope of the unique line whose error is negligible compared to the step.
    dialogue:
      - part: Lines through one point
        teach: >
          Zoom in on the graph of $f(x) = x^2$ near the point $(5, 25)$. Every
          line through that point has the form $y = 25 + m(x - 5)$, and each
          one can be used to predict values of $f$ near $5$. Which slope
          predicts best? The derivative $f'(5) = 10$ is the obvious guess;
          test it against a rival.
      - ask: >
          Using the line with $m = 10$, predict $f(5.1)$.
        expects: "26"
        feedback: >
          $25 + 10(0.1) = 26$. The true value is $5.1^2 = 26.01$, so the error
          is $0.01$.
      - ask: >
          Now use the rival line with $m = 9$. What is its error at
          $x = 5.1$, the true value minus the prediction?
        expects: "0.11"
        hint: >
          The prediction is $25 + 9(0.1)$.
        feedback: >
          The prediction is $25.9$ and the truth is $26.01$, so the error is
          $0.11$ — eleven times the tangent's. In general, with step $h$, the
          error of slope $m$ is
          $r(h) = (5 + h)^2 - 25 - mh = (10 - m)h + h^2$.
      - ask: >
          Both errors shrink to $0$ as the step $h$ shrinks. Does "the error
          tends to $0$" pick out a best line?
        choices:
          - text: >
              Yes: only the tangent's error tends to $0$.
            feedback: >
              The rival's error is $h + h^2$, which also tends to $0$. So does
              every line's, once $f$ is continuous at $5$.
          - text: >
              No: for a continuous $f$, every line through the point has error
              tending to $0$, so the test ranks nothing.
            correct: true
            feedback: >
              $r(h) = f(5 + h) - 25 - mh \to 0 - 0 = 0$ for any $m$ at all. A
              test that every candidate passes cannot choose among them.
          - text: >
              Yes: the line with the smaller error at $h = 0.1$ wins.
            feedback: >
              One step size proves nothing. Slope $10.1$ has error
              $-0.01 + 0.01 = 0$ at $h = 0.1$, beating the tangent there, and
              loses to it at $h = 0.001$. A criterion has to be about the
              limit.
        feedback: >
          "The error goes to $0$" is only continuity. A sharper test is
          needed.
      - reflect: >
          How could you measure the error so that slope $10$ passes and every
          other slope fails? Look at the two errors, $h^2$ for the tangent and
          $h + h^2$ for the rival.
        hint: >
          Compare each error with the step $h$ you took.
        answer: >
          Divide by the step. The tangent's error over the step is
          $h^2/h = h$, which tends to $0$; the rival's is $1 + h$, which tends
          to $1$. So demand $r(h)/h \to 0$: the error must be negligible
          *compared with the step*, not merely small. Only one slope can meet
          that, and it is $f'(5)$.
      - teach: >
          Here is why that works for every $f$. With
          $r(h) = f(c + h) - f(c) - mh$,
          $\dfrac{r(h)}{h} = \dfrac{f(c+h) - f(c)}{h} - m$. The left side tends
          to $0$ exactly when the difference quotient tends to $m$. So $f$ is
          differentiable at $c$ with $f'(c) = m$ if and only if
          $f(c + h) = f(c) + mh + r(h)$ with $r(h)/h \to 0$: the derivative is
          the slope of the best affine approximation.

      - part: Testing the picture
        ask: >
          For the rival slope $m = 9$ at $c = 5$, what does $r(h)/h$ tend to
          as $h \to 0$?
        expects: "1"
        feedback: >
          $\dfrac{r(h)}{h} = \dfrac{f(5+h) - 25}{h} - 9 \to 10 - 9 = 1$. In
          general a wrong slope leaves $r(h)/h \to f'(c) - m \ne 0$: its error
          stays proportional to the step.
      - ask: >
          The tangent's error at $h = 0.1$ was $0.01$. What is its error at
          $h = 0.05$?
        expects: "0.0025"
        hint: >
          For $x^2$ the tangent's error is exactly $h^2$.
        feedback: >
          $0.05^2 = 0.0025$: halving the step quartered the error. The rival's
          error went from $0.11$ to $0.05 + 0.0025 = 0.0525$, roughly halved.
          That is what zooming sees: the gap between curve and tangent
          vanishes faster than the window shrinks, so the graph looks
          straight.
      - ask: >
          All you know about some $g$ is that $g(3) = 7$ and $g'(3) = 4$.
          Estimate $g(3.02)$.
        expects: "7.08"
        feedback: >
          $g(3 + h) \approx g(3) + g'(3)h = 7 + 4(0.02) = 7.08$. The
          approximation comes with a guarantee: the error divided by $0.02$
          goes to $0$ as the step shrinks.

      - part: Where the picture misleads
        ask: >
          Push the tangent to $x^2$ at $5$ out to $x = 15$. By how much does
          its prediction fall short of the true value?
        expects: "100"
        hint: >
          The prediction is $25 + 10(15 - 5)$.
        feedback: >
          The prediction is $25 + 100 = 125$; the truth is $225$. Short by
          $100 = h^2$ with $h = 10$. Differentiability at a point promises
          nothing about a fixed window: the window that meets a tolerance
          shrinks with the tolerance, just as $\delta$ shrinks with
          $\varepsilon$.
      - ask: >
          Zoom in on the graph of $|x|$ at $0$. What do you see?
        choices:
          - text: >
              Eventually a straight line, like every graph.
            feedback: >
              $|x|$ is scale-invariant at $0$: magnify it by any factor and you
              get $|x|$ back. The corner never smooths out.
          - text: >
              A horizontal line, the average of the two sides.
            feedback: >
              The slope-$0$ line has error $r(h) = |h|$, so $r(h)/h = \pm 1$,
              which does not tend to $0$. The horizontal line is no better
              than any other.
          - text: >
              The same V at every magnification, because no slope makes
              $r(h)/h \to 0$ at a corner.
            correct: true
            feedback: >
              For slope $m$, $r(h)/h = |h|/h - m$, which is $1 - m$ for
              $h > 0$ and $-1 - m$ for $h < 0$. No $m$ makes both $0$, so no
              line fits, and $|x|$ has no derivative at $0$.
        feedback: >
          "Looks straight when you zoom" is exactly differentiability — so it
          fails exactly where the derivative fails.
      - teach: >
          Locally, a differentiable function is a linear function plus an
          error that is negligible compared with the step. That is why the
          derivative is the tool for estimates, and why at an interior maximum
          the term $f'(c)h$ must vanish — otherwise stepping one way or the
          other would raise the value.

  - node: analysis.svc.diff-implies-cont
    hook: >
      Theorems in this unit ask for continuity on a closed interval and
      differentiability only on the open one, and that looks like two unrelated
      demands. This lemma shows one of them is nearly free, and its
      contrapositive rules out differentiability at a glance.
    explanation: >
      The proof is one algebraic identity plus one limit law. For $x \ne c$ you
      may write $f(x) - f(c) = \dfrac{f(x) - f(c)}{x - c}\,(x - c)$, which is
      not a manipulation but a triviality: multiplying and dividing by the same
      nonzero number. The identity holds on exactly the punctured
      neighbourhood the limit inspects.

      Now take $x \to c$ on both sides. The first factor tends to $f'(c)$,
      because that is what differentiability at $c$ asserts, and the second
      tends to $0$. A product of two convergent quantities converges to the
      product of the limits, so $f(x) - f(c) \to f'(c) \cdot 0 = 0$. That says
      $\lim_{x \to c} f(x) = f(c)$, which is the definition of continuity at
      $c$.

      Notice where the word *finite* in the definition of the derivative did
      its work. If the difference quotients grew without bound, the product
      would be a large number times a small one with no verdict at all. The
      argument needs $f'(c)$ to be an actual real number, and it is exactly
      that requirement that pushes a function like $x^{1/3}$ at $0$ out of the
      differentiable class.

      The converse is false, and one example settles it. The function
      $f(x) = |x|$ is continuous at $0$ — take $\delta = \varepsilon$ — but its
      difference quotient at $0$ is $|h|/h$, which equals $1$ for every $h > 0$
      and $-1$ for every $h < 0$. Values a distance $2$ apart persist in every
      window, so no limit exists and $f$ is not differentiable at $0$.
      Differentiability is therefore *strictly* stronger than continuity, and
      the useful direction in practice is the contrapositive: a function that
      jumps at $c$ cannot possibly be differentiable at $c$, so you never need
      to compute anything to rule it out.
    worked: >
      Let $g(x) = x^2$ for $x < 1$ and $g(x) = x^2 + 4$ for $x \ge 1$, and ask
      about $x = 1$. The lemma answers it without a difference quotient: as $x$
      climbs to $1$ from the left, $g(x) = x^2$ approaches $1$, while
      $g(1) = 5$. The limit and the value differ, so $g$ is not continuous at
      $1$, and therefore not differentiable there. Confirm it head-on. For
      $h < 0$ the quotient is
      $\dfrac{g(1+h) - g(1)}{h} = \dfrac{(1+h)^2 - 5}{h}
      = \dfrac{h^2 + 2h - 4}{h} = h + 2 - \dfrac{4}{h}$,
      and as $h \to 0^-$ the term $-4/h$ grows past every bound. No finite
      limit exists, exactly as the lemma predicted, and the culprit is the
      jump of size $4$.
    pitfalls: >
      The converse fails, and $|x|$ at $0$ is the example to keep loaded: a
      corner is continuous and not differentiable. Differentiability at $c$
      also gives continuity *at $c$ only* — the function equal to $x^2$ at
      every rational and $0$ at every irrational is differentiable at $0$, with
      $f'(0) = 0$ since the quotient is bounded in size by $|h|$, and yet it is
      discontinuous at every other point. And note the direction of use: from a
      jump you may conclude non-differentiability instantly, but from a smooth
      *looking* graph you may conclude nothing without a limit.
    recap: >
      Differentiability at $c$ forces continuity at $c$, because the
      difference $f(x) - f(c)$ is a bounded quotient times a factor going to
      zero — and the converse fails at every corner.
    dialogue:
      - part: Two pieces with the same slope
        teach: >
          Let $g(x) = x^2$ for $x < 1$ and $g(x) = x^2 + 4$ for $x \ge 1$. The
          two pieces are parallel curves: each has slope $2x$, so both have
          slope $2$ at $x = 1$. The graph, though, jumps up by $4$ there.
      - ask: >
          Is $g$ differentiable at $1$?
        choices:
          - text: >
              Yes, with $g'(1) = 2$, since both pieces have slope $2$ there.
            feedback: >
              The pieces' slopes describe each curve on its own. The
              derivative of $g$ at $1$ is a limit of quotients that compare
              $g(1 + h)$ with $g(1) = 5$, and for $h < 0$ that comparison
              crosses the jump.
          - text: >
              No: the quotients from the left compare values near $1$ with
              $g(1) = 5$ and blow up.
            correct: true
            feedback: >
              The numerator stays near $1 - 5 = -4$ while the denominator
              shrinks. Try a number and watch it happen.
          - text: >
              You cannot tell without more information about $g$.
            feedback: >
              $g$ is given completely. Everything the definition asks for can
              be computed.
        feedback: >
          The jump, not the slopes of the pieces, decides the matter.
      - ask: >
          Compute the difference quotient $\dfrac{g(1+h) - g(1)}{h}$ at
          $h = -0.01$.
        expects: "401.99"
        hint: >
          $g(0.99)$ uses the left piece: $0.99^2 = 0.9801$. And
          $g(1) = 1 + 4 = 5$.
        feedback: >
          $\dfrac{0.9801 - 5}{-0.01} = \dfrac{-4.0199}{-0.01} = 401.99$. At
          $h = -0.001$ it is about $4002$: the numerator stays near $-4$ and
          the quotient grows past every bound.
      - reflect: >
          Say in general why a jump at $c$ wrecks the difference quotient —
          and turn it around: if the quotient *does* tend to a finite number,
          what must the numerator $f(c + h) - f(c)$ do?
        hint: >
          Write the numerator as the quotient times $h$.
        answer: >
          The numerator is (quotient) $\times\, h$. If $f$ jumps at $c$, the
          numerator stays away from $0$ while $h \to 0$, so the quotient
          cannot stay bounded. Turned around: if the quotient tends to a
          finite $f'(c)$, the numerator is a bounded quantity times something
          tending to $0$, so $f(c + h) - f(c) \to 0$ — which says
          $f(c + h) \to f(c)$, continuity.

      - part: The one-line proof
        teach: >
          The lemma: if $f$ is differentiable at $c$, then $f$ is continuous at
          $c$. For $x \ne c$,
          $f(x) - f(c) = \dfrac{f(x) - f(c)}{x - c}\,(x - c)$, which is just
          multiplying and dividing by a nonzero number. As $x \to c$ the
          quotient tends to $f'(c)$ and the factor $x - c$ tends to $0$, so the
          product tends to $f'(c) \cdot 0 = 0$.
      - ask: >
          Suppose $f'(2) = 7$. What is $\lim_{x \to 2} (f(x) - f(2))$?
        expects: "0"
        feedback: >
          The quotient tends to $7$ and $x - 2$ tends to $0$, so the product
          tends to $7 \cdot 0 = 0$. The value $7$ never mattered — only that
          it was a finite number.
      - ask: >
          Where does the proof use that $f'(c)$ is *finite*?
        choices:
          - text: >
              In the identity: it only holds when $f'(c)$ is finite.
            feedback: >
              The identity holds for every $x \ne c$ whatever $f$ is. It is
              multiplication and division by $x - c$, nothing more.
          - text: >
              In the limit of the product: a finite number times $0$ is $0$,
              but a quotient growing without bound times a factor tending to
              $0$ has no verdict.
            correct: true
            feedback: >
              The limit law for products needs both limits to be real numbers.
              That is why $x^{1/3}$ at $0$, whose quotient is unbounded, had to
              be excluded from the differentiable functions.
          - text: >
              Nowhere; the proof works for infinite derivatives too.
            feedback: >
              The jump function $g$ has quotients that blow up, and it is not
              continuous. Unbounded quotients must be excluded, and the word
              *finite* is what excludes them.
        feedback: >
          *Finite* in the definition of the derivative is load-bearing, and
          this is where it bears the load.
      - ask: >
          Quantify it. Suppose the quotient
          $\left|\dfrac{f(x) - f(2)}{x - 2}\right|$ is at most $7.5$ whenever
          $0 < |x - 2| < 0.1$. For $|x - 2| < 0.01$, what bound on
          $|f(x) - f(2)|$ follows?
        expects: "0.075"
        feedback: >
          $|f(x) - f(2)| = \left|\dfrac{f(x) - f(2)}{x - 2}\right|\,|x - 2|
          \le 7.5 \times 0.01 = 0.075$. A bounded quotient turns a small
          window into a small change, which is continuity with an explicit
          $\delta$.

      - part: The converse fails
        ask: >
          Which function is continuous at $0$ but not differentiable there?
        choices:
          - text: >
              $f(x) = x^2$
            feedback: >
              Its quotient at $0$ is $h^2/h = h \to 0$: both continuous and
              differentiable.
          - text: >
              The function equal to $-1$ for $x < 0$ and $1$ for $x \ge 0$.
            feedback: >
              It jumps at $0$, so it is not continuous there. The lemma already
              rules out differentiability, but it is not the example asked
              for.
          - text: >
              $f(x) = |x|$
            correct: true
            feedback: >
              Continuous with $\delta = \varepsilon$, but the quotient
              $|h|/h$ is $1$ for $h > 0$ and $-1$ for $h < 0$, so it has no
              limit. A corner is continuous and not differentiable.
        feedback: >
          Differentiability is strictly stronger than continuity. Every
          corner is a witness.
      - ask: >
          $f(x) = x^{1/3}$ is continuous at $0$, but its difference quotient
          $h^{-2/3}$ grows without bound. Does it contradict the lemma?
        choices:
          - text: >
              Yes: it is continuous at $0$, so the lemma says it should be
              differentiable there.
            feedback: >
              That reads the lemma backwards. It says differentiable implies
              continuous; it promises nothing to a function that is merely
              continuous.
          - text: >
              No: it is continuous and not differentiable at $0$, which is the
              converse failing again, this time at a vertical tangent.
            correct: true
            feedback: >
              A corner and a vertical tangent are the two standard ways to be
              continuous without a derivative. Neither touches the lemma.
          - text: >
              No, because it is differentiable at $0$ with derivative
              $\infty$.
            feedback: >
              A derivative must be a finite number. $x^{1/3}$ has no derivative
              at $0$, and that is consistent with the lemma, not an exception
              to it.
        feedback: >
          The lemma runs one way. Every counterexample to the converse is
          continuous, and none is differentiable.
      - ask: >
          Let $f(x) = x^2$ at every rational $x$ and $f(x) = 0$ at every
          irrational $x$. It is differentiable at $0$, with $f'(0) = 0$,
          because its quotient is at most $|h|$ in size. What does the lemma
          tell you about continuity?
        choices:
          - text: >
              $f$ is continuous everywhere.
            feedback: >
              At $x = 1$, rationals near $1$ give values near $1$ and
              irrationals give $0$, so there is no limit. The lemma speaks
              only at the point where $f$ is differentiable.
          - text: >
              $f$ is continuous at $0$, and the lemma says nothing about any
              other point.
            correct: true
            feedback: >
              Differentiability at $c$ buys continuity at $c$ alone. This $f$
              is in fact discontinuous at every $c \ne 0$.
          - text: >
              Nothing, since $f$ is not continuous anywhere else.
            feedback: >
              The lemma is a statement about the single point $0$, and there
              it applies: $f$ is continuous at $0$.
        feedback: >
          A pointwise hypothesis gives a pointwise conclusion.
      - teach: >
          Use the lemma in its contrapositive: a function that jumps at $c$
          cannot be differentiable at $c$, and you can discard it without
          computing a quotient. The converse never holds for free, which is why
          theorems like Rolle's ask for continuity on $[a,b]$ and
          differentiability on $(a,b)$ as two separate demands.

  - node: analysis.svc.rolle
    hook: >
      This is the exact point where the existence theorems of continuity meet
      the derivative, and every mean-value statement in the rest of the unit is
      a disguised copy of it.
    explanation: >
      The picture is a single sentence: a function that starts and ends at the
      same height must level off somewhere in between. Formally, if $f$ is
      continuous on $[a,b]$, differentiable on $(a,b)$, and $f(a) = f(b)$, then
      $f'(c) = 0$ for some $c$ strictly inside.

      The proof begins by importing an existence theorem, because nothing about
      derivatives can produce a point out of nothing. Continuity on the closed
      bounded interval $[a,b]$ lets the Extreme Value Theorem hand you a
      maximum at some $q$ and a minimum at some $p$. Split into cases. If both
      $p$ and $q$ are endpoints, then the largest and smallest values are both
      equal to $f(a) = f(b)$, so $f$ is constant, and every interior point has
      derivative $0$. Otherwise some extremum sits at an interior point $c$.

      Here is the load-bearing step: an interior extremum forces the derivative
      to vanish. Say $c$ is an interior maximum, so $f(c + h) - f(c) \le 0$ for
      all small $h$ of either sign. For $h > 0$ the difference quotient
      $\dfrac{f(c+h) - f(c)}{h}$ has a non-positive numerator over a positive
      denominator, so it is $\le 0$. For $h < 0$ the numerator is still
      non-positive but the denominator is negative, so the quotient is $\ge 0$.
      Differentiability says both sides approach the *same* number $f'(c)$, and
      a number that is at once $\le 0$ and $\ge 0$ is $0$. An interior minimum
      runs identically with the inequalities reversed.

      The hypotheses are asymmetric on purpose, and both are sharp. The
      function equal to $x$ on $(0,1]$ with the value $1$ assigned at $0$ has
      matching endpoint values and is differentiable inside, yet its derivative
      is always $1$ — one endpoint discontinuity was fatal. And $f(x) = |x|$ on
      $[-1,1]$ is continuous with $f(-1) = f(1)$, yet one missing interior
      derivative leaves $f'$ always $\pm 1$.
    worked: >
      Take $f(x) = x^2 - 4x + 3$ on $[1,3]$. It is a polynomial, hence
      continuous on the closed interval and differentiable inside, and
      $f(1) = 1 - 4 + 3 = 0$ while $f(3) = 9 - 12 + 3 = 0$, so the heights
      match and Rolle's Theorem applies. Compute the derivative straight from
      the definition: for $h \ne 0$,
      $\dfrac{f(c+h) - f(c)}{h}
      = \dfrac{(c+h)^2 - 4(c+h) + 3 - c^2 + 4c - 3}{h}
      = \dfrac{2ch + h^2 - 4h}{h} = 2c + h - 4$,
      whose limit is $2c - 4$. Setting $2c - 4 = 0$ gives $c = 2$, which lies
      in the open interval $(1,3)$ as promised. The value there is
      $f(2) = 4 - 8 + 3 = -1$, the minimum of $f$ on $[1,3]$ — the interior
      extremum the proof was looking for.
    pitfalls: >
      Rolle's Theorem promises a $c$ and locates nothing: there may be many
      such points, and for a constant function every interior point qualifies.
      The equal-heights hypothesis is about the two endpoint *values*, not
      about the function being symmetric or about $f$ having a root. And the
      two regularity hypotheses are not interchangeable — $|x|$ on $[-1,1]$
      shows one interior non-differentiable point kills the conclusion, while
      the function equal to $x$ on $(0,1]$ with value $1$ at $0$ shows a single
      endpoint discontinuity does too.
    recap: >
      Continuity on a closed interval produces an extremum, differentiability
      forces the derivative to vanish at it when it is interior, and equal
      endpoint values guarantee an interior one exists.
    dialogue:
      - part: Thrown up and caught
        teach: >
          A ball is thrown straight up and caught at the height it left your
          hand. Its height above your hand is $h(t) = 20t - 5t^2$ metres after
          $t$ seconds, and it is back at height $0$ when $t = 4$. Its velocity
          is $h'(t) = 20 - 10t$, from the derivative of $t^2$.
      - ask: >
          At what time $t$ is the ball momentarily at rest?
        expects: "2"
        feedback: >
          $h'(t) = 20 - 10t = 0$ at $t = 2$, the top of the flight, at height
          $h(2) = 40 - 20 = 20$ metres.
      - ask: >
          Must *every* differentiable height function that starts and ends at
          the same height have an instant of zero velocity in between?
        choices:
          - text: >
              Only if it goes up and comes back down, like the ball.
            feedback: >
              A function that goes down first and comes back up has a lowest
              point instead, with the same effect. One that never moves has
              velocity $0$ throughout.
          - text: >
              Yes: it must turn around, or stay put, and either way it levels
              off somewhere.
            correct: true
            feedback: >
              That is the claim. The work is proving it when you cannot solve
              $f'(t) = 0$ the way you just did.
          - text: >
              No: it could speed up and slow down without ever stopping.
            feedback: >
              Try drawing one. To finish at the starting height the graph
              must rise and then fall, or fall and then rise, and at the
              turn it is flat. Never turning means always rising or always
              falling, which ends somewhere else.
        feedback: >
          The claim is believable. The question is where the special instant
          comes from when there is no formula to solve.
      - reflect: >
          Nothing about derivatives alone can conjure a point. Which theorem
          you already hold hands you a special point of $[a,b]$ for a
          continuous $f$ — and why would the derivative be $0$ there?
        hint: >
          At the top of the ball's flight the velocity was $0$. What kind of
          point is the top?
        answer: >
          The Extreme Value Theorem: continuity on $[a,b]$ gives a point where
          $f$ attains its maximum and a point where it attains its minimum. At
          an extremum inside the interval the graph cannot be tilted, because
          a tilt would carry the value higher on one side (or lower). So the
          derivative at an interior extremum should be $0$ — which is where
          the ball's top came from.
      - teach: >
          That is Rolle's Theorem. If $f$ is continuous on $[a,b]$,
          differentiable on $(a,b)$, and $f(a) = f(b)$, then $f'(c) = 0$ for
          some $c \in (a,b)$. The proof starts by letting the Extreme Value
          Theorem produce a maximum at some $q$ and a minimum at some $p$ in
          $[a,b]$.

      - part: Why the top is flat
        ask: >
          First case: both the maximum and the minimum occur only at the
          endpoints $a$ and $b$. What follows from $f(a) = f(b)$?
        choices:
          - text: >
              Nothing — this is the case where the theorem can fail.
            feedback: >
              This is the easy case, not a gap. Equal heights at both ends,
              with the extremes trapped there, pin down the whole function.
          - text: >
              $f$ is increasing, so $f' > 0$ somewhere inside.
            feedback: >
              A function with $f(a) = f(b)$ cannot increase across $[a,b]$. In
              this case it cannot move at all.
          - text: >
              $f$ is constant, so every interior point has derivative $0$.
            correct: true
            feedback: >
              The largest and smallest values are both $f(a) = f(b)$, so every
              value is squeezed between two equal numbers. A constant has
              every difference quotient $0$.
        feedback: >
          So assume the other case: some extremum sits at an interior point
          $c$.
      - ask: >
          Test it on the ball, whose maximum is at $c = 2$ with $h(2) = 20$.
          What is the difference quotient $\dfrac{h(2 + k) - h(2)}{k}$ at
          $k = -0.1$?
        expects: "0.5"
        hint: >
          $h(1.9) = 38 - 5(3.61)$.
        feedback: >
          $h(1.9) = 38 - 18.05 = 19.95$, so the quotient is
          $\dfrac{19.95 - 20}{-0.1} = 0.5$. At $k = +0.1$, $h(2.1) = 19.95$
          too, and the quotient is $-0.5$. Left of a maximum the quotients are
          $\ge 0$ (a drop over a negative step); right of it they are $\le 0$.
          Both sides tend to the same $f'(c)$, and a number that is both
          $\ge 0$ and $\le 0$ is $0$.
      - ask: >
          Why does the argument need the extremum to be *interior*?
        choices:
          - text: >
              At an endpoint there are quotients on one side only, so no sign
              clash forces the slope to $0$.
            correct: true
            feedback: >
              $f(x) = x$ on $[0,1]$ has its maximum at $x = 1$, where the slope
              is $1$. The sign clash needs quotients from both sides.
          - text: >
              Because the Extreme Value Theorem only produces interior points.
            feedback: >
              It happily produces endpoints — $x$ on $[0,1]$ has its maximum
              at $1$. That is why the proof splits into cases.
          - text: >
              It does not; the derivative is $0$ at any extremum.
            feedback: >
              $f(x) = x$ on $[0,1]$ has its maximum at $1$ and slope $1$
              there. Endpoint extrema need not be flat.
        feedback: >
          Equal endpoint values are what guarantee an interior extremum: if
          $f$ is not constant, its maximum or its minimum differs from the
          common endpoint value, so that one sits inside.
      - ask: >
          Take $f(x) = x^3 - 3x$ on $[-\sqrt{3}, \sqrt{3}]$, where
          $f(\pm\sqrt{3}) = 0$. How many points $c$ in the open interval have
          $f'(c) = 0$?
        expects: "2"
        hint: >
          $f'(x) = 3x^2 - 3$.
        feedback: >
          $3c^2 - 3 = 0$ gives $c = \pm 1$, and both lie in
          $(-\sqrt{3}, \sqrt{3})$ since $\sqrt{3} \approx 1.73$. Rolle's
          Theorem promises at least one; here there are two — a local maximum
          at $-1$ and a local minimum at $1$. The theorem never promises
          uniqueness.

      - part: Where it breaks
        ask: >
          $f(x) = |x|$ on $[-1,1]$ is continuous with $f(-1) = f(1)$. Is there
          a $c$ with $f'(c) = 0$?
        choices:
          - text: >
              Yes, at the bottom of the V, $c = 0$.
            feedback: >
              The bottom is where the slope would have to be $0$, but $|x|$
              has no derivative there: its quotients are $\pm 1$.
          - text: >
              No: one interior point without a derivative, and the conclusion
              fails.
            correct: true
            feedback: >
              Wherever $f'$ exists it is $-1$ or $1$. The minimum sits exactly
              at the corner, where the sign-clash argument has no derivative
              to act on.
          - text: >
              Yes, since the continuity and equal-heights hypotheses hold.
            feedback: >
              Two of three hypotheses is not enough. Differentiability on
              $(-1,1)$ fails at $0$, and the conclusion fails with it.
        feedback: >
          Differentiability inside is load-bearing: it is what turns an
          interior extremum into a zero of the derivative.
      - ask: >
          Let $f(x) = x$ for $0 < x \le 1$ and $f(0) = 1$. Then $f(0) = f(1)$,
          $f$ is differentiable on $(0,1)$, and yet $f'(x) = 1$ throughout.
          Which hypothesis failed?
        choices:
          - text: >
              Differentiability on $(0,1)$.
            feedback: >
              Inside the interval $f$ is the line $y = x$, differentiable with
              slope $1$. The trouble is not inside.
          - text: >
              Equal endpoint values.
            feedback: >
              $f(0) = 1$ and $f(1) = 1$. They match, by construction.
          - text: >
              Continuity at the endpoint $0$: values near $0$ approach $0$,
              but $f(0) = 1$.
            correct: true
            feedback: >
              Without continuity at $0$ the Extreme Value Theorem is off: $f$
              has no minimum on $[0,1]$, so there is no interior extremum to
              find.
        feedback: >
          Continuity on the closed interval feeds the Extreme Value Theorem;
          differentiability on the open one feeds the sign clash. Each
          hypothesis powers one step.
      - teach: >
          Continuity on $[a,b]$ produces an extremum, equal heights push one
          inside, and differentiability flattens it. Tilt the picture — let
          the endpoint heights differ — and the same argument will find a
          point where the slope matches the average slope instead of $0$.

  - node: analysis.svc.mvt
    hook: >
      This is the bridge from local to global. It is the only tool in the unit
      that turns knowledge of $f'$ at unknown points into hard statements about
      $f$ across a whole interval, and both halves of the Fundamental Theorem
      lean on it.
    explanation: >
      Draw the secant joining $(a, f(a))$ to $(b, f(b))$. Its slope is the
      average rate of change $\dfrac{f(b) - f(a)}{b - a}$. The Mean Value
      Theorem says that somewhere strictly inside the interval, the tangent is
      parallel to that secant: there is a $c \in (a,b)$ with
      $f'(c) = \dfrac{f(b) - f(a)}{b - a}$.

      It is Rolle's Theorem tilted, and the tilt is performed by subtracting
      the secant. Let $S = \dfrac{f(b) - f(a)}{b - a}$ and set
      $g(x) = f(x) - S\,(x - a)$. Then $g(a) = f(a)$, and
      $g(b) = f(b) - S(b - a) = f(b) - (f(b) - f(a)) = f(a)$, so the two
      endpoint values now match. The piece subtracted is a straight line, whose
      difference quotient is the constant $S$ at every point, so $g$ inherits
      continuity on $[a,b]$ and differentiability on $(a,b)$ from $f$, with
      $g'(x) = f'(x) - S$. Rolle's Theorem produces $c$ with $g'(c) = 0$, which
      unwinds to $f'(c) = S$.

      The form worth memorising is the rearranged one:
      $f(b) - f(a) = f'(c)\,(b - a)$. It converts any bound on the derivative
      into a bound on the function. If $|f'| \le M$ throughout the interval,
      then $|f(b) - f(a)| \le M\,(b - a)$ — a global statement about how far
      $f$ can travel, obtained from purely local information, and obtained
      without knowing where $c$ is.

      Not knowing $c$ is the normal situation, and it is fine. The theorem is
      an existence statement, so the usual pattern of use is to apply an
      inequality that holds at *every* point of the interval and therefore
      holds at the unknown $c$ in particular. That pattern is exactly how
      $f' \equiv 0$ forces a function to be constant, and how the accumulation
      of a continuous function on tiny cells telescopes into an integral.
    worked: >
      Take $f(x) = x^3$ on $[0,3]$. It is continuous and differentiable
      everywhere, so the theorem applies. The average rate of change is
      $\dfrac{f(3) - f(0)}{3 - 0} = \dfrac{27 - 0}{3} = 9$. The derivative of
      $x^3$ is $3x^2$, so the theorem's $c$ solves $3c^2 = 9$, that is
      $c^2 = 3$. The two roots are $\pm\sqrt{3}$, and only the positive one
      lies in $(0,3)$, so $c = \sqrt{3} \approx 1.7321$. Check it: at that
      point the tangent slope is $3 \cdot 3 = 9$, matching the secant slope
      exactly, and $1.7321$ does sit strictly between $0$ and $3$. Notice the
      answer is irrational even though the data were integers — one reason the
      theorem is used for the equation it provides rather than for the point
      itself.
    pitfalls: >
      The conclusion needs a $c$ in the *open* interval, and the endpoints are
      genuinely excluded: on $[0,3]$ with $f(x) = x^3$ the secant slope $9$ is
      matched at $\sqrt{3}$ and at neither endpoint. Differentiability is
      required only inside but continuity right up to the ends — $|x|$ on
      $[-1,1]$ has secant slope $0$ and derivative $\pm 1$, never $0$, because
      of the single interior corner. And the theorem never tells you where $c$
      is or how many there are, so any argument that needs a specific $c$ is
      using the wrong tool.
    recap: >
      Subtracting the secant turns any function into one with equal endpoint
      values, so Rolle's Theorem applies and returns a point where the
      instantaneous rate equals the average rate.
    dialogue:
      - part: Two photographs and a fine
        teach: >
          A toll road photographs your car twice: at kilometre $0$ at 2:00,
          and at kilometre $150$ at 3:30. Neither photo catches you speeding.
          The limit is $90$ km/h, and a week later a fine arrives anyway. The
          question for this lesson is whether the road authority can prove
          it.
      - ask: >
          What was your average speed between the two photographs, in km/h?
        expects: "100"
        hint: >
          Distance over time — and the time is not two hours.
        feedback: >
          $150$ km in $1.5$ hours is $150 / 1.5 = 100$ km/h.
      - ask: >
          Does an average of $100$ km/h prove that at some instant you were
          doing more than $90$?
        choices:
          - text: >
              No: the cameras saw you at two instants, and between them you
              could have done anything.
            feedback: >
              Not anything. Suppose you never exceeded $90$. Then in $1.5$
              hours you could cover at most $90 \cdot 1.5 = 135$ km, and you
              covered $150$. Two photographs are enough.
          - text: >
              Only if you drove at a constant speed.
            feedback: >
              Constant speed is the case where it is obvious — you did $100$
              the whole way. The argument that works does not need it: never
              exceeding $90$ caps the distance at $135$ km.
          - text: >
              Yes: never exceeding $90$ would have capped the distance at
              $135$ km, and you covered $150$.
            correct: true
            feedback: >
              Right. A bound on speed at *every* instant bounds the distance
              covered, so the distance you covered rules the bound out.
        feedback: >
          The fine is sound. Hold on to the shape of that argument — a bound
          on the rate everywhere gives a bound on the change — because it is
          the form in which this theorem earns its keep.
      - ask: >
          A stronger claim: at some instant between the photographs your
          speedometer read *exactly* $100$. Must that be true, assuming your
          position changes smoothly (it has a derivative at every instant)?
        choices:
          - text: >
              No — your speed could have jumped from below $100$ to above it
              without ever equalling it.
            feedback: >
              That is the natural worry, and it turns out not to matter: what
              this lesson proves produces an instant where the speed is
              exactly $100$, with no assumption about how the speed varies.
          - text: >
              Yes — for a smooth trip, the average speed is attained at some
              instant.
            correct: true
            feedback: >
              It is true, and the rest of this lesson is why. Notice that it
              is a sharper claim than the fine needed: not "above $90$
              somewhere" but "exactly $100$ somewhere".
          - text: >
              Only if $100$ km/h was also your top speed.
            feedback: >
              Your top speed must have been at least $100$ (otherwise the
              $135$-style cap applies with $100$ in place of $90$), but that
              does not settle whether $100$ itself was hit.
        feedback: >
          Hitting the average exactly is the claim to prove. The tool you
          already hold only handles a special case of it.

      - part: The flat case, already solved
        teach: >
          Rolle's Theorem: if $f$ is continuous on $[a,b]$, differentiable on
          $(a,b)$, and $f(a) = f(b)$, then $f'(c) = 0$ for some $c \in (a,b)$.
          For a car, a trip that ends where it started had an instant of zero
          velocity. Your trip went from $0$ to $150$, so Rolle's Theorem says
          nothing about it — yet.
      - teach: >
          Picture a pace car that leaves kilometre $0$ with you at 2:00 and
          holds exactly $100$ km/h. Measuring time $t$ in hours from 2:00,
          your position is $f(t)$ and the pace car's is $100t$. Track the gap
          between you: $d(t) = f(t) - 100t$.
      - ask: >
          What is the gap $d(1.5)$, at 3:30?
        expects: "0"
        hint: >
          Where are you at 3:30, and where is the pace car?
        feedback: >
          $d(1.5) = f(1.5) - 100 \cdot 1.5 = 150 - 150 = 0$. You and the pace
          car arrive together, just as you left together: $d(0) = 0 - 0 = 0$.
      - reflect: >
          So $d$ starts and ends at the same value. What does Rolle's Theorem
          say about $d$, and what does that say about your speedometer?
        hint: >
          Differentiate $d(t) = f(t) - 100t$.
        answer: >
          $d$ is continuous and differentiable wherever $f$ is, because $100t$
          is a straight line, and $d(0) = d(1.5)$. Rolle's Theorem gives an
          instant $c$ with $d'(c) = 0$. But $d'(t) = f'(t) - 100$, so
          $f'(c) = 100$: at that instant you and the pace car were moving at
          the same speed, and your speedometer read exactly $100$.
      - teach: >
          That argument, with the numbers taken out, is the Mean Value
          Theorem. If $f$ is continuous on $[a,b]$ and differentiable on
          $(a,b)$, there is a $c \in (a,b)$ with
          $f'(c) = \dfrac{f(b) - f(a)}{b - a}$. The pace car is the secant
          line: subtract $S\,(x - a)$, with $S$ the secant slope, and the
          endpoints level out.
      - ask: >
          To run the pace-car argument on a general $f$, what must you check
          about $g(x) = f(x) - S\,(x - a)$ before applying Rolle's Theorem?
        choices:
          - text: >
              That $g(a) = g(b) = 0$.
            feedback: >
              Rolle's Theorem needs the endpoint values to be *equal*, not
              zero. Here $g(a) = g(b) = f(a)$, which is enough.
          - text: >
              That $f'$ is continuous, so $g'$ passes through $0$.
            feedback: >
              Never needed. Rolle's Theorem finds its point at an extremum of
              $g$, and says nothing about $g'$ being continuous.
          - text: >
              That $f(a) = f(b)$.
            feedback: >
              That is the hypothesis the tilt exists to remove. $f$ may start
              and end anywhere; it is $g$ whose endpoints must agree.
          - text: >
              That $g$ is continuous on $[a,b]$, differentiable on $(a,b)$,
              and has $g(a) = g(b)$.
            correct: true
            feedback: >
              Exactly Rolle's hypotheses. The first two come free, since a
              straight line is continuous and differentiable everywhere; the
              third is the computation
              $g(b) = f(b) - (f(b) - f(a)) = f(a) = g(a)$.
        feedback: >
          The whole proof is one subtraction: remove the secant, apply
          Rolle's Theorem, add the slope back.

      - part: A point you are promised but cannot find
        ask: >
          Take $f(x) = x^3$ on $[0,3]$. What is the slope of the secant from
          $(0, f(0))$ to $(3, f(3))$?
        expects: "9"
        feedback: >
          $\dfrac{f(3) - f(0)}{3 - 0} = \dfrac{27 - 0}{3} = 9$.
      - ask: >
          Which $c \in (0,3)$ does the theorem promise? Give it to four
          decimal places.
        expects: "1.7321"
        tolerance: 0.0005
        hint: >
          The derivative of $x^3$ is $3x^2$. Set it equal to the secant slope,
          and keep the root inside $(0,3)$.
        feedback: >
          $3c^2 = 9$ gives $c^2 = 3$, so $c = \pm\sqrt{3}$, and only
          $c = \sqrt{3} \approx 1.7321$ lies in $(0,3)$. Integer data, an
          irrational point: finding $c$ is usually hopeless, and it is
          usually unnecessary.
      - ask: >
          $f$ is differentiable on $[0,5]$ with $|f'(x)| \le 3$ everywhere,
          and $f(0) = 2$. What is the largest $f(5)$ can be?
        expects: "17"
        hint: >
          This is the speeding fine again. Write $f(5) - f(0)$ using the
          theorem.
        feedback: >
          The theorem gives $f(5) - f(0) = f'(c) \cdot 5$ for some
          $c \in (0,5)$, and $f'(c) \le 3$, so $f(5) \le 2 + 15 = 17$. The line
          $f(x) = 2 + 3x$ attains it, so no better bound exists.
      - reflect: >
          That answer never located $c$. Why was that legitimate — and what is
          the general move you just made?
        answer: >
          The bound $|f'| \le 3$ holds at every point of the interval, so it
          holds at the unknown $c$ in particular. The general move is the
          rearranged theorem, $f(b) - f(a) = f'(c)\,(b - a)$: any bound on the
          derivative across an interval becomes a bound on how far the
          function can travel across it. The same move with $f' \equiv 0$
          shows a function with zero derivative cannot move at all.

      - part: Where it breaks
        ask: >
          $f(x) = |x|$ on $[-1,1]$ has secant slope $0$. Is there a
          $c \in (-1,1)$ with $f'(c) = 0$?
        choices:
          - text: >
              Yes, $c = 0$, the bottom of the V.
            feedback: >
              The bottom is where the slope would have to be $0$, but $|x|$
              has no derivative there: the one-sided slopes are $-1$ and $1$.
          - text: >
              Yes, because $|x|$ is continuous on $[-1,1]$.
            feedback: >
              Continuity is only half the hypotheses. Everywhere the
              derivative exists it is $-1$ or $1$, so it is never $0$.
          - text: >
              No — the corner at $0$ breaks differentiability inside the
              interval, and the conclusion fails with it.
            correct: true
            feedback: >
              Right. One interior point without a derivative is enough to
              lose the theorem.
        feedback: >
          Differentiability on the open interval is load-bearing: a single
          corner inside can hide the promised point.
      - ask: >
          Let $f(x) = x$ for $0 \le x < 1$ and $f(1) = 0$. The secant slope on
          $[0,1]$ is $0$, yet $f'(x) = 1$ at every point of $(0,1)$. Which
          hypothesis failed?
        choices:
          - text: >
              Differentiability on $(0,1)$.
            feedback: >
              Inside the interval $f$ is the line $y = x$, differentiable with
              slope $1$ everywhere. The trouble is not inside.
          - text: >
              Continuity on $[0,1]$: $f$ jumps at the right endpoint.
            correct: true
            feedback: >
              Yes. As $x \to 1^-$, $f(x) \to 1$, but $f(1) = 0$. The theorem
              needs continuity right up to the ends, even though it needs
              differentiability only inside.
          - text: >
              None — the theorem simply does not apply to piecewise
              functions.
            feedback: >
              Piecewise definitions are fine; $|x|$ is one. What matters is
              which hypothesis the pieces break, and here it is continuity at
              $x = 1$.
        feedback: >
          The hypotheses are exactly as strong as the proof needs: continuity
          on the closed interval for the Extreme Value Theorem inside
          Rolle's, differentiability on the open one for the derivative at
          $c$.
      - teach: >
          Run the speeding-fine argument once more with a derivative that is
          zero everywhere: then $f(b) - f(a) = 0 \cdot (b - a)$ for every pair
          of points, and a function whose derivative vanishes cannot move at
          all. That is the next step, and the Fundamental Theorem of Calculus
          is built on it.

  - node: analysis.svc.zero-deriv-const
    hook: >
      You already believe a function with zero derivative cannot move. Proving
      it takes the Mean Value Theorem — and the corollary is what makes "the
      antiderivative, plus a constant" a complete answer rather than a hopeful
      one.
    explanation: >
      The claim is less obvious than it sounds. "$f'(x) = 0$" is a statement
      made separately at each point, about behaviour in a shrinking window
      there. "$f$ is constant" is a statement about pairs of points that may be
      far apart. Nothing purely local can bridge that gap, and the Mean Value
      Theorem is the only bridge in this unit.

      The proof is two lines. Let $I$ be an interval, let $f$ be continuous on
      $I$ with $f'(x) = 0$ at every interior point, and take any $x < y$ in
      $I$. Then $f$ is continuous on $[x,y]$ and differentiable on $(x,y)$,
      because every point of $(x,y)$ is interior to $I$. The Mean Value Theorem
      supplies $c \in (x,y)$ with
      $f(y) - f(x) = f'(c)\,(y - x) = 0 \cdot (y - x) = 0$. Since $x$ and $y$
      were arbitrary, all values of $f$ agree, so $f$ is constant.

      The consequence is the one you will actually cite. If $f'(x) = g'(x)$
      throughout an interval, apply the result to $f - g$: its difference
      quotient at any point is the difference of the two difference quotients,
      so $(f - g)'(x) = f'(x) - g'(x) = 0$, and therefore $f - g$ is a
      constant. Two functions with the same derivative on an interval differ by
      a constant and by nothing else — which is why writing "$+ C$" after an
      antiderivative describes *every* antiderivative, not merely a few.

      The word *interval* is load-bearing, and the proof shows exactly why: it
      needs $[x,y]$ to sit inside the domain, which fails as soon as the domain
      comes in separate pieces. On $(0,1) \cup (2,3)$, the function equal to
      $0$ on the first piece and $7$ on the second has zero derivative
      everywhere and is nowhere near constant. Zero derivative buys *locally*
      constant, and only connectedness upgrades that to constant.
    worked: >
      Suppose $G$ is differentiable on all of $\mathbb{R}$ with $G'(x) = 2x$
      everywhere, and you are told $G(2) = 10$. The function $F(x) = x^2$ also
      has derivative $2x$, computed from the definition. So $G - F$ has zero
      derivative on the interval $\mathbb{R}$ and is therefore constant: there
      is a single number $C$ with $G(x) = x^2 + C$ for every $x$. Pin down $C$
      with the data: $G(2) = 4 + C = 10$, so $C = 6$ and $G(x) = x^2 + 6$. Now
      every value of $G$ is determined — for instance $G(5) = 25 + 6 = 31$ —
      from nothing but its derivative and one value. That is the entire
      mechanism behind evaluating definite integrals by antiderivatives.
    pitfalls: >
      The hypothesis is an interval, not merely an open set: on
      $(0,1) \cup (2,3)$ a function with zero derivative need only be constant
      on each piece, and this is exactly the trap that voids careless
      antiderivative claims on a punctured domain. Zero derivative at a single
      point says nothing at all — $f(x) = x^3$ has $f'(0) = 0$ and is
      relentlessly increasing. And the corollary compares *two* functions with
      equal derivatives, not two functions with equal values somewhere; sharing
      one point of agreement without sharing derivatives proves nothing.
    recap: >
      The Mean Value Theorem converts a derivative that vanishes at every
      interior point into a function that never moves, so two antiderivatives
      of the same function on an interval differ by a constant.
    dialogue:
      - part: One derivative and one value
        teach: >
          A function $G$ is differentiable on all of $\mathbb{R}$, with
          $G'(x) = 2x$ everywhere, and you are told $G(2) = 10$. Nothing else
          is known about $G$.
      - ask: >
          What is $G(5)$?
        expects: "31"
        hint: >
          Which familiar function has derivative $2x$? Adjust it to match
          $G(2) = 10$.
        feedback: >
          The natural guess is $G(x) = x^2 + C$, and $G(2) = 4 + C = 10$ gives
          $C = 6$, so $G(5) = 25 + 6 = 31$. The answer is right — but the
          guess assumed something.
      - ask: >
          The guess assumed that $G - x^2$, whose derivative is $0$
          everywhere, is a constant. What entitles you to that?
        choices:
          - text: >
              Nothing needs proving: zero derivative obviously means constant.
            feedback: >
              It is less obvious than it sounds. $f'(x) = 0$ is a statement at
              each point separately, about a shrinking window there;
              "constant" compares points that may be far apart. And on a
              domain in two pieces it is false, as you will see.
          - text: >
              Continuity of $G - x^2$.
            feedback: >
              Continuity allows plenty of motion: $x^2$ itself is continuous
              and not constant. Something must turn *zero slope* into *no
              change*.
          - text: >
              A theorem that turns derivative information at points into a
              statement about $f(y) - f(x)$ across an interval.
            correct: true
            feedback: >
              Exactly the gap. Something must bridge the local statement
              $f' = 0$ and the global statement $f(x) = f(y)$.
        feedback: >
          Local to global needs a bridge. You hold exactly one.
      - reflect: >
          You want $f(y) - f(x) = 0$ for every pair $x < y$, knowing only
          $f' = 0$ at every point. Which theorem converts information about
          $f'$ into an equation for $f(y) - f(x)$, and what does it give here?
        answer: >
          The Mean Value Theorem: $f(y) - f(x) = f'(c)\,(y - x)$ for some $c$
          strictly between $x$ and $y$. You do not know $c$, and you do not
          need to — $f'$ is $0$ everywhere, so at $c$ in particular, and the
          difference is $0 \cdot (y - x) = 0$. Every pair of values agrees, so
          $f$ is constant.

      - part: The corollary and its consequence
        teach: >
          The corollary: if $I$ is an interval and $f$ is continuous on $I$
          with $f'(x) = 0$ at every interior point, then $f$ is constant on
          $I$. Applied to $f - g$: if $f' = g'$ throughout an interval, then
          $f - g$ is constant there. That is what licensed $G = x^2 + C$.
      - ask: >
          For $x < y$ in $I$, what must you check before applying the Mean
          Value Theorem on $[x,y]$?
        choices:
          - text: >
              That $f(x) = f(y)$.
            feedback: >
              That is the conclusion you are after, and it is Rolle's
              hypothesis, not the Mean Value Theorem's. Assuming it would be
              circular.
          - text: >
              That $f$ is continuous on $[x,y]$ and differentiable on $(x,y)$ —
              true because $[x,y]$ lies inside $I$ and every point of $(x,y)$
              is interior to $I$.
            correct: true
            feedback: >
              And this is where *interval* is spent: for any two points of an
              interval, everything between them is in it too.
          - text: >
              That $f'$ is continuous.
            feedback: >
              The Mean Value Theorem never asks for it. Continuity of $f$ on
              the closed interval and a derivative inside are all it needs.
        feedback: >
          The whole proof is one application of the Mean Value Theorem per
          pair of points.
      - ask: >
          On an interval, $F'(x) = G'(x)$ at every point, with $F(0) = 3$,
          $G(0) = -1$ and $F(7) = 20$. What is $G(7)$?
        expects: "16"
        hint: >
          $F - G$ is constant. Find the constant from $x = 0$.
        feedback: >
          $F - G$ has zero derivative on an interval, so it is constant:
          $F(0) - G(0) = 3 - (-1) = 4$. Then $G(7) = F(7) - 4 = 16$. Two
          functions with the same derivative differ by a constant and nothing
          else — which is why "$+ C$" after an antiderivative describes *every*
          one.
      - ask: >
          $f$ is continuous on $[0,5]$ with $f'(x) = 0$ at every point of the
          open interval $(0,5)$, and $f(0) = 3$. What is $f(5)$?
        expects: "3"
        feedback: >
          The Mean Value Theorem on $[0,5]$ needs a derivative only inside
          and continuity up to the ends, so $f(5) - f(0) = f'(c) \cdot 5 = 0$
          and $f(5) = 3$. Continuity at the ends is doing real work: the
          function equal to $3$ on $[0,5)$ with $f(5) = 9$ also has $f' = 0$
          on $(0,5)$.

      - part: Where the interval matters
        ask: >
          On the domain $(0,1) \cup (2,3)$, let $f = 0$ on the first piece and
          $f = 7$ on the second. Its derivative is $0$ at every point of the
          domain. What is $f(2.5) - f(0.5)$?
        expects: "7"
        feedback: >
          $f(2.5) - f(0.5) = 7 - 0 = 7$. Zero derivative everywhere, and the
          function is not constant.
      - ask: >
          Which step of the proof fails for that $f$, with $x = 0.5$ and
          $y = 2.5$?
        choices:
          - text: >
              $f'$ is not $0$ at $1.5$.
            feedback: >
              $1.5$ is not in the domain, so $f'(1.5)$ is not a thing that can
              fail to be $0$. That gap is the trouble, but not in this way.
          - text: >
              $[0.5, 2.5]$ is not inside the domain, so the Mean Value Theorem
              cannot be applied there.
            correct: true
            feedback: >
              The theorem needs $f$ continuous on all of $[0.5, 2.5]$, and $f$
              is not even defined on $[1, 2]$. Zero derivative buys *locally*
              constant; only an interval upgrades that to constant.
          - text: >
              $f$ is not differentiable on its domain.
            feedback: >
              Near each point of the domain $f$ is flat, so its derivative
              exists and is $0$ everywhere it is defined.
        feedback: >
          The hypothesis is an interval, and the proof uses it exactly once:
          to know that the segment between two points stays in the domain.
      - ask: >
          $f(x) = x^3$ has $f'(0) = 0$. What does the corollary say about $f$
          near $0$?
        choices:
          - text: >
              $f$ is constant on some interval around $0$.
            feedback: >
              $x^3$ is strictly increasing: $f(-0.1) < 0 < f(0.1)$. A zero
              derivative at one point says nothing about the values nearby.
          - text: >
              Nothing: the corollary needs $f' = 0$ at *every* interior point
              of an interval, not at one point.
            correct: true
            feedback: >
              The Mean Value Theorem's $c$ could be anywhere in $(x,y)$, so the
              bound on $f'$ has to hold everywhere there.
          - text: >
              $f$ has a maximum or minimum at $0$.
            feedback: >
              $x^3$ has neither at $0$: it is negative to the left and positive
              to the right. And the corollary is not about extrema anyway.
        feedback: >
          A vanishing derivative at a point is local and weak; vanishing on an
          interval is what makes a function stand still.
      - teach: >
          The Mean Value Theorem turns $f' = 0$ at every point of an interval
          into $f$ not moving at all, so two functions with the same derivative
          on an interval differ by a constant. One derivative and one value pin
          a function down — the mechanism behind evaluating integrals with
          antiderivatives.

  - node: analysis.svc.def-riemann-sum
    hook: >
      Area under a curve has no definition yet, but area of a rectangle does. A
      Riemann sum is the approximation that will be promoted into the
      definition, and the two Darboux sums are the jaws that will squeeze it.
    explanation: >
      Chop $[a,b]$ with a partition $P$: finitely many points
      $a = x_0 < x_1 < \cdots < x_n = b$, cutting the interval into cells of
      widths $\Delta x_i = x_i - x_{i-1}$. The mesh $\lVert P \rVert$ is the
      widest cell. Choose a tag $t_i$ somewhere in each cell, pretend $f$ is
      the constant $f(t_i)$ across that cell, and add up the rectangle areas:
      $S(f,P,t) = \sum_{i=1}^{n} f(t_i)\,\Delta x_i$. Where $f$ is negative the
      contribution is negative, so this is signed area, not area.

      The trouble is the tags: move them and the number changes. To pin the
      answer down, take the two extreme choices. On the $i$-th cell let $m_i$
      be the infimum of $f$ and $M_i$ the supremum — these exist by the
      Completeness axiom of $\mathbb{R}$ because $f$ is assumed bounded — and
      form $L(f,P) = \sum m_i \Delta x_i$ and $U(f,P) = \sum M_i \Delta x_i$.
      Since $m_i \le f(t_i) \le M_i$ and each width is positive, every tagged
      sum is trapped: $L(f,P) \le S(f,P,t) \le U(f,P)$.

      Infimum and supremum, not minimum and maximum, and the distinction is
      deliberate. No continuity has been assumed, so $f$ need not attain its
      bounds on a cell, while completeness guarantees they exist anyway. When
      $f$ *is* continuous, the Extreme Value Theorem turns them back into
      attained values.

      One mechanism makes the whole theory work: refining a partition improves
      both estimates. Split a cell $[x_{i-1}, x_i]$ at an interior point $z$.
      The infimum over each half is at least the infimum over the whole cell,
      since taking a smaller set can only raise the greatest lower bound, so
      the two new lower rectangles together contribute at least
      $m_i \Delta x_i$, so $L$ can only rise and symmetrically $U$ can only
      fall. Adding points squeezes the two sums together, never apart.
    worked: >
      Take $f(x) = x^2$ on $[0,2]$ with the uniform partition into four cells,
      so $\Delta x_i = 0.5$ and the cut points are $0, 0.5, 1, 1.5, 2$. Tag by
      right endpoints, $t = 0.5, 1, 1.5, 2$: the sum is
      $(0.25 + 1 + 2.25 + 4)(0.5) = 7.5 \times 0.5 = 3.75$. Tag by left
      endpoints, $t = 0, 0.5, 1, 1.5$: the sum is
      $(0 + 0.25 + 1 + 2.25)(0.5) = 3.5 \times 0.5 = 1.75$. Because $x^2$
      increases on $[0,2]$, the smallest value on each cell is at its left end
      and the largest at its right, so these two sums are exactly $L(f,P) =
      1.75$ and $U(f,P) = 3.75$. Every tagging whatsoever lands between them —
      midpoint tags $0.25, 0.75, 1.25, 1.75$ give
      $(0.0625 + 0.5625 + 1.5625 + 3.0625)(0.5) = 2.625$, comfortably inside.
      The gap $U - L = 2$ is the uncertainty this partition leaves, and
      refining is what will shrink it.
    pitfalls: >
      There is no such thing as "the" Riemann sum of $f$ over $P$ — the tags
      are part of the data, and different tags give different numbers. Writing
      minimum and maximum instead of infimum and supremum quietly assumes
      something that has not been granted, since a bounded function on a cell
      need not attain either bound. And uniform partitions are a convenience
      for computing, not part of the definition: what has to be small is the
      mesh, and a partition with many points can still contain one enormous
      cell.
    recap: >
      A Riemann sum replaces $f$ by a constant on each cell of a partition and
      adds the rectangle areas, and the lower and upper Darboux sums are the
      extreme cases that bracket every possible choice of tags.
    dialogue:
      - part: Area from rectangles
        teach: >
          You want the area under $f(x) = x^2$ between $x = 0$ and $x = 2$,
          and the only area you know how to compute is a rectangle's. So chop
          $[0,2]$ into four cells of width $0.5$ at the points
          $0, 0.5, 1, 1.5, 2$, give each cell one height taken from $f$, and
          add up the rectangles.
      - ask: >
          Use the value of $f$ at the right end of each cell as its height.
          What is the total area of the four rectangles?
        expects: "3.75"
        hint: >
          The heights are $f(0.5), f(1), f(1.5), f(2)$.
        feedback: >
          $(0.25 + 1 + 2.25 + 4)(0.5) = 7.5 \times 0.5 = 3.75$.
      - ask: >
          Now use the value at the left end of each cell. What total do you
          get?
        expects: "1.75"
        feedback: >
          $(0 + 0.25 + 1 + 2.25)(0.5) = 3.5 \times 0.5 = 1.75$. Same cells,
          very different answer.
      - ask: >
          Which number deserves to be called *the* rectangle estimate for this
          way of chopping?
        choices:
          - text: >
              $3.75$, since the right end is the standard choice.
            feedback: >
              Nothing makes the right end standard. Any point of each cell is
              an equally honest sample, and $1.75$ used one too.
          - text: >
              $2.75$, the average of the two.
            feedback: >
              Averaging two samples is a third recipe, not a resolution. Other
              samples give other numbers again.
          - text: >
              None: the answer depends on where in each cell you sample, so the
              sample points are part of the data.
            correct: true
            feedback: >
              The chopping alone does not determine the sum. You must also
              say which point of each cell supplies the height.
        feedback: >
          There is no "the" rectangle sum for a partition; there is one for
          each choice of sample points.
      - teach: >
          Name the pieces. A partition $P$ of $[a,b]$ is a finite set
          $a = x_0 < x_1 < \cdots < x_n = b$, cutting it into cells of widths
          $\Delta x_i = x_i - x_{i-1}$; its mesh $\lVert P \rVert$ is the
          widest width. Tags $t_i \in [x_{i-1}, x_i]$ pick the sample points,
          and the Riemann sum is
          $S(f,P,t) = \sum_{i=1}^{n} f(t_i)\,\Delta x_i$.
      - ask: >
          Same partition of $[0,2]$, now tagged at the midpoints
          $0.25, 0.75, 1.25, 1.75$. What is $S(f,P,t)$?
        expects: "2.625"
        feedback: >
          $(0.0625 + 0.5625 + 1.5625 + 3.0625)(0.5) = 5.25 \times 0.5
          = 2.625$, between the left and right sums.

      - part: Two sums that bracket all the others
        reflect: >
          Every choice of tags gives a different number. For a bounded $f$,
          what height on each cell would give the smallest possible sum, and
          what height the largest? Be careful: why might "the smallest value
          of $f$ on the cell" not quite work?
        hint: >
          A bounded set of numbers always has a greatest lower bound, even
          when it has no least element.
        answer: >
          Use the infimum $m_i$ of $f$ on the cell for the lowest height and
          the supremum $M_i$ for the highest. Every tag has
          $m_i \le f(t_i) \le M_i$, so every Riemann sum is trapped between
          $\sum m_i \Delta x_i$ and $\sum M_i \Delta x_i$. The smallest
          *value* may not exist, since $f$ need not attain its bounds on a
          cell; the infimum always exists, by completeness.
      - teach: >
          These are the Darboux sums: $L(f,P) = \sum m_i \Delta x_i$ and
          $U(f,P) = \sum M_i \Delta x_i$, with
          $L(f,P) \le S(f,P,t) \le U(f,P)$ for every choice of tags. For
          $x^2$ on $[0,2]$, which increases, the infimum on a cell is at its
          left end and the supremum at its right, so $L = 1.75$ and
          $U = 3.75$.
      - ask: >
          Let $f(x) = x$ for $0 \le x < 1$ and $f(1) = 0$, with $[0,1]$ as a
          single cell. What is $M_1$, the supremum of $f$ on the cell?
        expects: "1"
        feedback: >
          The values fill $[0,1)$, so the supremum is $1$ — and no point
          attains it. A "maximum value on the cell" does not exist here, which
          is why the definition says supremum.
      - ask: >
          Split a cell $[x_{i-1}, x_i]$ at an interior point $z$. What can
          happen to the lower sum $L$?
        choices:
          - text: >
              It can go up or down, depending on $f$.
            feedback: >
              The infimum over a smaller set is never lower than the infimum
              over the larger set. So neither half can contribute less than
              before.
          - text: >
              It can only fall, since there are more rectangles.
            feedback: >
              More rectangles, but thinner ones: the two halves still have
              total width $\Delta x_i$. What changes is their heights, which
              can only rise.
          - text: >
              It can only rise or stay the same.
            correct: true
            feedback: >
              Each half's infimum is at least $m_i$, so the two new lower
              rectangles total at least $m_i \Delta x_i$. Symmetrically $U$
              can only fall.
        feedback: >
          Refining squeezes $L$ up and $U$ down — never apart.
      - ask: >
          Refine the partition of $[0,2]$ to eight cells of width $0.25$. What
          is the new upper sum $U$ for $x^2$?
        expects: "3.1875"
        hint: >
          The heights are $(k/4)^2$ for $k = 1, \dots, 8$, and
          $1 + 4 + 9 + \cdots + 64 = 204$.
        feedback: >
          $U = 0.25 \times \dfrac{204}{16} = 3.1875$, down from $3.75$. The
          lower sum rises to $0.25 \times \dfrac{140}{16} = 2.1875$ from
          $1.75$, and the gap $U - L$ halves from $2$ to $1$.

      - part: What the definition does not say
        ask: >
          A partition of $[0,2]$ has $102$ points: $0, 0.001, 0.002, \dots,
          0.1$ and then $2$. What is its mesh?
        expects: "1.9"
        feedback: >
          The last cell, $[0.1, 2]$, has width $1.9$, and the mesh is the
          widest cell. Many points do not make a partition fine; a small mesh
          does.
      - ask: >
          Take $f(x) = x - 1$ on $[0,2]$, two cells of width $1$, tagged at
          the left ends. What is the Riemann sum?
        expects: "-1"
        feedback: >
          $f(0)(1) + f(1)(1) = -1 + 0 = -1$. Where $f$ is negative the
          rectangles count negatively: a Riemann sum measures signed area.
      - teach: >
          A Riemann sum freezes $f$ on each cell of a partition and adds up
          rectangles; the Darboux sums are the extreme choices, and refining
          squeezes them together. When the squeeze closes to a single number,
          that number will be the integral.

  - node: analysis.svc.def-riemann-integral
    hook: >
      Riemann sums approximate; the integral is what happens when the
      approximation runs out of freedom. Every later fact about integrals,
      including both halves of the Fundamental Theorem, is read off this
      squeeze.
    explanation: >
      Fix a bounded $f$ on $[a,b]$ and look at all partitions at once. The
      lower integral $\underline{\int_a^b} f$ is the supremum of the lower sums
      $L(f,P)$, the best the rectangles-from-below can do; the upper integral
      $\overline{\int_a^b} f$ is the infimum of the upper sums $U(f,Q)$, the
      best from above. Both exist by completeness, once the lower sums are
      known to be bounded above — the next point.

      The key inequality is that *every* lower sum is at most *every* upper
      sum, even when the two partitions have nothing in common. Given $P$ and
      $Q$, take their common refinement $P \cup Q$. Refining raises lower sums
      and lowers upper sums, so
      $L(f,P) \le L(f, P \cup Q) \le U(f, P \cup Q) \le U(f,Q)$, where the
      middle step is just $m_i \le M_i$ on each cell. So each $U(f,Q)$ is an
      upper bound for all lower sums, hence
      $\underline{\int_a^b} f \le U(f,Q)$, and taking the infimum over $Q$
      gives $\underline{\int_a^b} f \le \overline{\int_a^b} f$. The two numbers
      never cross.

      $f$ is Riemann integrable when they coincide, and then $\int_a^b f(x)\,dx$
      denotes the common value. The working test is the Cauchy criterion: $f$
      is integrable exactly when for every $\varepsilon > 0$ some single
      partition has $U(f,P) - L(f,P) < \varepsilon$. One direction is
      immediate, and it is the direction you use — both integrals lie between
      $L(f,P)$ and $U(f,P)$, so their difference is below every $\varepsilon$,
      and a non-negative number below every positive number is $0$.

      Not everything is integrable. Let $f$ be $1$ at every rational point of
      $[0,1]$ and $0$ at every irrational one: every cell of every partition
      contains both kinds of point, so $M_i = 1$ and $m_i = 0$ however fine the
      chopping. The upper integral is $1$, the lower is $0$, and no refinement
      can close a gap that refinement never touches.
    worked: >
      Integrate $f(x) = x$ over $[0,2]$ from the definition. Use the uniform
      partition into $n$ cells, so $\Delta x_i = 2/n$ and the cut points are
      $x_i = 2i/n$. The function increases, so on the $i$-th cell
      $m_i = 2(i-1)/n$ and $M_i = 2i/n$. Then
      $U_n = \sum_{i=1}^{n} \dfrac{2i}{n}\cdot\dfrac{2}{n}
      = \dfrac{4}{n^2}\cdot\dfrac{n(n+1)}{2} = 2 + \dfrac{2}{n}$,
      and shifting the index the same way gives $L_n = 2 - \dfrac{2}{n}$. Now
      squeeze: for every $n$,
      $2 - \dfrac{2}{n} \le \underline{\int_0^2} f \le \overline{\int_0^2} f
      \le 2 + \dfrac{2}{n}$.
      The two therefore differ from $2$ by at most $2/n$ for every $n$, and no
      positive number beats $2/n$ for all $n$. Both equal
      $2$, so $\int_0^2 x\,dx = 2$ — reassuring, since that region is a triangle
      of base $2$ and height $2$.
    pitfalls: >
      Boundedness is a standing hypothesis, not a detail: for an unbounded $f$
      some $M_i$ fails to exist and the upper sums are not defined, so the
      definition never gets started. The supremum and infimum run over *all*
      partitions, so one partition with close sums proves integrability only
      through the Cauchy criterion, and one with distant sums proves nothing at
      all. And refinement is not a magic
      wand — for the function that is $1$ on rationals and $0$ elsewhere, every
      partition gives $U = 1$ and $L = 0$, however fine.
    recap: >
      The integral exists exactly when the best rectangles-from-below and the
      best rectangles-from-above agree, and the practical test is that some
      partition makes $U - L$ smaller than any tolerance you name.
    dialogue:
      - part: Squeezing a triangle
        teach: >
          Take $f(x) = x$ on $[0,2]$. The region under it is a triangle, but
          pretend you do not know that and use only rectangles. Chop $[0,2]$
          into $n$ equal cells of width $2/n$. Since $f$ increases, the
          infimum on each cell is at its left end and the supremum at its
          right end.
      - ask: >
          With $n = 4$ cells, what is the upper sum $U$?
        expects: "2.5"
        feedback: >
          The right ends are $0.5, 1, 1.5, 2$, so
          $U = (0.5 + 1 + 1.5 + 2)(0.5) = 2.5$. The lower sum uses
          $0, 0.5, 1, 1.5$ and gives $1.5$.
      - ask: >
          For general $n$, which formula gives the upper sum $U_n$?
        choices:
          - text: >
              $U_n = 2 + \dfrac{1}{n}$
            feedback: >
              At $n = 4$ this gives $2.25$, not $2.5$. Recompute:
              $U_n = \sum_{i=1}^{n} \dfrac{2i}{n} \cdot \dfrac{2}{n}
              = \dfrac{4}{n^2} \cdot \dfrac{n(n+1)}{2}$.
          - text: >
              $U_n = 2 + \dfrac{2}{n}$
            correct: true
            feedback: >
              $\dfrac{4}{n^2} \cdot \dfrac{n(n+1)}{2} = \dfrac{2(n+1)}{n}
              = 2 + \dfrac{2}{n}$, which is $2.5$ at $n = 4$. The lower sum is
              $L_n = 2 - \dfrac{2}{n}$.
          - text: >
              $U_n = \dfrac{2n}{n+1}$
            feedback: >
              At $n = 4$ this gives $1.6$, not $2.5$ — it is below $2$ for
              every $n$, which an overestimate of this region cannot be. The
              $n + 1$ belongs in the numerator.
        feedback: >
          $L_n = 2 - 2/n$ and $U_n = 2 + 2/n$: the gap is $4/n$ and shrinks
          as the cells do.
      - ask: >
          Which number lies between $L_n$ and $U_n$ for *every* $n$?
        expects: "2"
        feedback: >
          $2 - 2/n \le 2 \le 2 + 2/n$ for every $n$, and no other number
          survives all of them: anything else differs from $2$ by some
          positive amount, and $2/n$ eventually drops below it.
      - reflect: >
          No single partition hands you the area; each only brackets it. Using
          *all* partitions at once, how would you define a single number from
          the lower sums and the upper sums — and when should you call it the
          area?
        hint: >
          Lower sums are underestimates. What is the best underestimate?
        answer: >
          Take the best from below, the supremum of all lower sums, and the
          best from above, the infimum of all upper sums. If those two numbers
          coincide, nothing is left to argue about, and the common value is
          the integral. If they differ, the rectangles cannot decide, and the
          function has no integral in this sense.
      - teach: >
          That is Riemann's integral. For bounded $f$ on $[a,b]$, the lower
          integral $\underline{\int_a^b} f$ is $\sup_P L(f,P)$ and the upper
          integral $\overline{\int_a^b} f$ is $\inf_P U(f,P)$. $f$ is Riemann
          integrable when they agree, and the common value is
          $\int_a^b f(x)\,dx$. For $f(x) = x$ on $[0,2]$ both equal $2$.

      - part: Why the two never cross
        ask: >
          For the definition to make sense, every lower sum must be at most
          every upper sum — even $L(f,P)$ and $U(f,Q)$ for two partitions with
          no cut points in common. How do you compare them?
        choices:
          - text: >
              You cannot, in general; the definition simply assumes it.
            feedback: >
              It is provable, in one line, by passing through a partition that
              both $P$ and $Q$ can be compared with.
          - text: >
              Compare the meshes: the finer partition gives the better sum.
            feedback: >
              Two partitions with no common points need not be comparable at
              all, whatever their meshes. Refinement, not mesh, is what moves
              sums predictably.
          - text: >
              Go through the common refinement:
              $L(f,P) \le L(f, P \cup Q) \le U(f, P \cup Q) \le U(f,Q)$.
            correct: true
            feedback: >
              Refining raises lower sums and lowers upper sums, and on any
              single partition $m_i \le M_i$ gives $L \le U$. So every $U(f,Q)$
              bounds every lower sum, and the lower integral is at most the
              upper.
        feedback: >
          The common refinement is the standard move: it is finer than both,
          so it compares with both.
      - ask: >
          The working test is the Cauchy criterion: $f$ is integrable exactly
          when, for every $\varepsilon > 0$, some partition has
          $U - L < \varepsilon$. For $f(x) = x$ on $[0,2]$ with $n$ equal
          cells, what is the smallest $n$ with $U_n - L_n < 0.01$?
        expects: "401"
        hint: >
          $U_n - L_n = 4/n$.
        feedback: >
          $4/n < 0.01$ means $n > 400$, so $n = 401$. Both integrals lie
          between $L_n$ and $U_n$, so they differ by less than $0.01$ — and by
          less than any $\varepsilon$, with $n$ large enough. A non-negative
          number below every positive number is $0$.

      - part: A function the rectangles cannot pin down
        ask: >
          Let $f = 1$ at every rational point of $[0,1]$ and $f = 0$ at every
          irrational one. For any partition $P$, what is $U(f,P)$?
        expects: "1"
        hint: >
          Every cell, however thin, contains a rational number.
        feedback: >
          Every cell contains a rational, so $M_i = 1$, and
          $U = \sum 1 \cdot \Delta x_i = 1$. Every cell also contains an
          irrational, so $m_i = 0$ and $L = 0$.
      - ask: >
          Is this $f$ Riemann integrable on $[0,1]$?
        choices:
          - text: >
              Yes, with integral $1/2$, halfway between.
            feedback: >
              The definition does not split differences. The lower integral is
              $0$, the upper is $1$, and integrability needs them equal.
          - text: >
              No: every partition has $U = 1$ and $L = 0$, so the upper
              integral is $1$, the lower is $0$, and they disagree.
            correct: true
            feedback: >
              Refinement cannot help: it never changes a cell's supremum or
              infimum from $1$ and $0$. The gap is permanent.
          - text: >
              Yes, if you refine far enough.
            feedback: >
              However thin a cell is, it still holds both kinds of point, so
              $U - L = 1$ for every partition. There is nothing for refinement
              to improve.
        feedback: >
          Not every bounded function is integrable. The squeeze can stall.
      - ask: >
          Let $f(x) = 1/x$ for $0 < x \le 1$ and $f(0) = 0$. Why does the
          definition not even start on $[0,1]$?
        choices:
          - text: >
              $f$ is unbounded, so the cell containing $0$ has no supremum and
              no upper sum exists.
            correct: true
            feedback: >
              Boundedness is a standing hypothesis: without it some $M_i$ is
              not a real number and $U(f,P)$ is undefined for every $P$.
          - text: >
              $f$ is not continuous at $0$.
            feedback: >
              The definition asks nothing about continuity — the rational
              indicator was discontinuous everywhere and still had well-defined
              sums. What fails here is boundedness.
          - text: >
              The area under $1/x$ is infinite, so the integral is $\infty$.
            feedback: >
              The Riemann integral is a real number or nothing. With no upper
              sums at all, there is nothing to take an infimum of.
        feedback: >
          The definition is for bounded functions; unbounded ones need a
          separate construction.
      - teach: >
          The integral exists exactly when the best rectangles from below and
          the best from above agree. In practice you prove it by finding, for
          each tolerance, one partition whose upper and lower sums are that
          close.

  - node: analysis.svc.cont-integrable
    hook: >
      The integral has been defined, but so far only hand-computed examples are
      known to exist. This proposition delivers the entire supply the
      Fundamental Theorem needs: every continuous function on a closed bounded
      interval.
    explanation: >
      Aim at the Cauchy criterion — produce, for each $\varepsilon > 0$, one
      partition with $U(f,P) - L(f,P) < \varepsilon$. Write that gap out:
      $U(f,P) - L(f,P) = \sum_{i=1}^{n} (M_i - m_i)\,\Delta x_i$. If every
      cell's oscillation $M_i - m_i$ can be pushed below
      $\varepsilon/(b-a)$, the whole sum is at most
      $\dfrac{\varepsilon}{b-a}\sum \Delta x_i = \varepsilon$, since the widths
      add up to $b - a$. So the target is one partition on which $f$ varies
      little in every cell.

      Pointwise continuity does not obviously supply that: it hands you a
      $\delta$ at each point separately, small where $f$ swings fast, while one
      partition must work across the whole interval at once. The rescue is
      *uniform* continuity: for every $\varepsilon > 0$ there is a single
      $\delta > 0$ such that $|f(x) - f(y)| < \varepsilon$ for *every* pair of
      points with $|x - y| < \delta$, wherever they sit. Continuity on a closed
      bounded interval always upgrades to this — on $(0,1]$ the continuous
      function $1/x$ does not, since near the missing endpoint arbitrarily
      close pairs have values arbitrarily far apart.

      The proof now finishes in a line. Pick $\delta$ uniform for the tolerance
      $\varepsilon/(b-a)$ and take any partition of mesh less than $\delta$.
      Two points in a cell are within $\delta$, so their values differ by less
      than $\varepsilon/(b-a)$, and the Extreme Value Theorem makes $M_i$ and
      $m_i$ actual values of $f$ there, so
      $M_i - m_i \le \varepsilon/(b-a)$. Summing gives
      $U(f,P) - L(f,P) \le \varepsilon$.

      Integrability is strictly weaker than continuity: a monotone function is
      integrable however many jumps it has, and so is any function with
      finitely many jumps — trap each jump in a cell of tiny width and its
      bounded oscillation contributes almost nothing.
    worked: >
      Verify the Cauchy criterion concretely for $f(x) = x^2$ on $[0,3]$ with
      $\varepsilon = 0.6$. The target oscillation per cell is
      $\varepsilon/(b-a) = 0.6/3 = 0.2$. Get a uniform $\delta$ by hand: for
      $x, y \in [0,3]$, $|x^2 - y^2| = |x - y|\,|x + y| \le 6\,|x - y|$, and
      the bound $6$ holds everywhere on the interval, so one $\delta$ serves
      all pairs. Choose the uniform partition into $100$ cells, mesh
      $3/100 = 0.03$. Any two points of a cell satisfy $|x - y| \le 0.03$, so
      $|f(x) - f(y)| \le 6(0.03) = 0.18$, and the Extreme Value Theorem makes
      $M_i$ and $m_i$ values of $f$ at genuine points of the cell, whence
      $M_i - m_i \le 0.18$. Therefore
      $U(f,P) - L(f,P) \le 0.18 \times 3 = 0.54 < 0.6$, and the same recipe
      answers any $\varepsilon$.
    pitfalls: >
      Continuity is sufficient, never necessary — concluding "not continuous,
      so not integrable" is the standard misreading, and a step function
      refutes it at once. The proof genuinely needs the *uniform* version, and
      that is where closed and bounded enter; the same argument on $(0,1]$ with
      $1/x$ collapses, since no single mesh controls the oscillation near the
      missing endpoint. And the target per cell is $\varepsilon/(b-a)$, not
      $\varepsilon$: forgetting to divide by the interval length leaves you
      proving a bound of $\varepsilon\,(b-a)$, which is the wrong statement on
      any interval longer than $1$.
    recap: >
      On a closed bounded interval, continuity is uniform, so a fine enough
      mesh makes every cell's oscillation small at once and the upper and lower
      sums close to within any tolerance.
    dialogue:
      - part: One partition, one tolerance
        teach: >
          Take $f(x) = x^2$ on $[0,3]$, and suppose you must show it is
          integrable by the Cauchy criterion for the tolerance
          $\varepsilon = 0.6$: find one partition with $U - L < 0.6$. Write
          the gap cell by cell:
          $U - L = \sum_{i=1}^{n} (M_i - m_i)\,\Delta x_i$, where
          $M_i - m_i$ is how much $f$ varies on the $i$-th cell.
      - ask: >
          If every cell has $M_i - m_i \le \eta$, then
          $U - L \le \eta \sum \Delta x_i = 3\eta$. How small must the
          per-cell variation $\eta$ be to guarantee $U - L \le 0.6$?
        expects: "0.2"
        feedback: >
          The widths add up to $b - a = 3$, so $U - L \le 3\eta$, and
          $3\eta \le 0.6$ needs $\eta \le 0.2$. In general the per-cell target
          is $\varepsilon/(b - a)$ — forget to divide by the length and you
          prove a bound three times too weak here.
      - ask: >
          For $x, y$ in $[0,3]$,
          $|x^2 - y^2| = |x - y|\,|x + y|$. Why does the single constant $6$
          bound the second factor for every pair?
        choices:
          - text: >
              Because $x + y \le 3 + 3 = 6$ anywhere in $[0,3]$, however the
              pair is placed.
            correct: true
            feedback: >
              So $|x^2 - y^2| \le 6\,|x - y|$ for every pair at once, and one
              cell width controls the variation of every cell.
          - text: >
              Because $x^2 \le 9$ on $[0,3]$, and $6 \le 9$.
            feedback: >
              That bounds the values of $f$, not the factor $|x + y|$ that
              multiplies the gap. The bound on that factor comes from the
              largest possible $x + y$ on the interval, $3 + 3$.
          - text: >
              It does not; the bound depends on where the pair sits.
            feedback: >
              The *true* size of $|x + y|$ depends on the pair, but $6$ bounds
              it for all of them. A bound that holds everywhere is exactly
              what is needed.
        feedback: >
          One constant for the whole interval is what lets one mesh serve
          every cell.
      - ask: >
          Using $|x^2 - y^2| \le 6\,|x - y|$, what is the fewest equal cells
          that makes $6 \times (\text{cell width}) \le 0.2$?
        expects: "90"
        hint: >
          With $n$ equal cells the width is $3/n$.
        feedback: >
          $6 \cdot \dfrac{3}{n} \le 0.2$ means $n \ge 90$. With $90$ cells
          every $M_i - m_i \le 0.2$ (strictly less, in fact), so
          $U - L < 0.6$. The same recipe answers every $\varepsilon$.

      - part: Where pointwise continuity falls short
        teach: >
          For $x^2$ on $[0,3]$ one constant bounded how fast $f$ changes
          everywhere. A general continuous $f$ offers less: continuity at each
          point $c$ gives a $\delta$ for that $c$, possibly smaller where $f$
          swings faster. One partition has to work at every point at once.
      - ask: >
          Look at $f(x) = 1/x$, continuous on $(0,1]$. Take the close pair
          $x = 0.002$ and $y = 0.001$. How far apart are $f(x)$ and $f(y)$?
        expects: "500"
        feedback: >
          $1/0.001 - 1/0.002 = 1000 - 500 = 500$, from inputs only $0.001$
          apart. Near $0$, pairs arbitrarily close have values arbitrarily far
          apart, so no single cell width controls every cell.
      - reflect: >
          What property, stronger than continuity at each point, would let one
          cell width control the variation in every cell? State it with its
          quantifiers, and say how it differs from continuity.
        hint: >
          In continuity, $\delta$ may depend on $\varepsilon$ *and* on the
          point $c$.
        answer: >
          For every $\varepsilon > 0$ there is one $\delta > 0$ such that
          $|f(x) - f(y)| < \varepsilon$ for *every* pair with
          $|x - y| < \delta$, wherever they sit. Continuity lets $\delta$
          depend on the point; this demands one $\delta$ for all points. It is
          called uniform continuity. $x^2$ on $[0,3]$ has it; $1/x$ on $(0,1]$
          does not.
      - teach: >
          The fact that rescues the proof: a function continuous on a closed
          bounded interval is uniformly continuous there. So the proposition
          holds — if $f$ is continuous on $[a,b]$, it is Riemann integrable.
          Given $\varepsilon$, take $\delta$ uniform for the tolerance
          $\varepsilon/(b - a)$ and any partition of mesh below $\delta$.
      - ask: >
          On such a cell, $|f(x) - f(y)| < \eta$ for every pair $x, y$ in it.
          Why does that give $M_i - m_i \le \eta$?
        choices:
          - text: >
              Because $M_i$ and $m_i$ are values of $f$ at two points of the
              cell.
            feedback: >
              That needs the extremes to be attained, which the proof never has
              to assume. Suprema and infima alone do the job.
          - text: >
              Because $f$ is increasing on each small cell.
            feedback: >
              Nothing makes $f$ monotone on a cell. The argument works for any
              bounded values that are all within $\eta$ of one another.
          - text: >
              Because $f(x) < f(y) + \eta$ for all $x, y$ in the cell; taking
              the supremum over $x$ and then the infimum over $y$ gives
              $M_i \le m_i + \eta$.
            correct: true
            feedback: >
              Fix $y$: $f(y) + \eta$ bounds every $f(x)$, so
              $M_i \le f(y) + \eta$. Then $M_i - \eta$ is a lower bound for
              every $f(y)$, so $M_i - \eta \le m_i$.
        feedback: >
          Summing $M_i - m_i \le \varepsilon/(b - a)$ over the cells gives
          $U - L \le \varepsilon$, and the Cauchy criterion finishes.

      - part: Integrable without being continuous
        ask: >
          Let $f = 0$ on $[0,1)$ and $f = 1$ on $[1,2]$. It jumps at $1$. Is
          it integrable on $[0,2]$?
        choices:
          - text: >
              No: it is not continuous, so it is not integrable.
            feedback: >
              The proposition says continuous implies integrable. It says
              nothing about the converse, and this function refutes it.
          - text: >
              Yes: put the jump inside one very thin cell, and only that cell
              has any variation.
            correct: true
            feedback: >
              Every other cell has $f$ constant, so $M_i - m_i = 0$ there. The
              single bad cell contributes its width times $1$.
          - text: >
              Only if $f(1)$ is changed to $1/2$.
            feedback: >
              Changing one value never affects integrability here: the jump
              cell's variation is at most $1$ whatever $f(1)$ is, and its width
              can be made tiny.
        feedback: >
          Continuity is sufficient, never necessary.
      - ask: >
          For that step function, take a partition in which the jump at $1$
          sits inside the cell $[0.995, 1.005]$. What is $U - L$?
        expects: "0.01"
        feedback: >
          On $[0.995, 1.005]$, $M = 1$ and $m = 0$, so that cell contributes
          $1 \times 0.01 = 0.01$. Every other cell contributes $0$. So
          $U - L = 0.01$, and a thinner cell makes it as small as you like.
      - teach: >
          On a closed bounded interval continuity is uniform, so one fine mesh
          makes every cell's variation small at once, and the upper and lower
          sums close to within any tolerance. That supplies every continuous
          function with an integral — the raw material the Fundamental Theorem
          needs.

  - node: analysis.svc.ex-integral-x2
    hook: >
      Here is an integral computed the hard way — rectangles, a summation
      identity, and a squeeze, with no antiderivative anywhere in sight. Doing
      it once is what makes the Fundamental Theorem feel like the shortcut it
      is.
    explanation: >
      Take $f(x) = x^2$ on $[0,1]$ and the uniform partition $x_i = i/n$, so
      every cell has width $1/n$. The function increases, so on the $i$-th cell
      the supremum sits at the right endpoint and the infimum at the left. That
      makes the right-endpoint Riemann sum the upper Darboux sum and the
      left-endpoint sum the lower one — the two extremes are computable, not
      just approximable.

      Now compute. The upper sum is
      $U_n = \sum_{i=1}^{n} \left(\dfrac{i}{n}\right)^2 \dfrac{1}{n}
      = \dfrac{1}{n^3}\sum_{i=1}^{n} i^2$, and the sum-of-squares identity
      $\sum_{i=1}^{n} i^2 = \dfrac{n(n+1)(2n+1)}{6}$ turns that into
      $\dfrac{2n^3 + 3n^2 + n}{6n^3}
      = \dfrac{1}{3} + \dfrac{1}{2n} + \dfrac{1}{6n^2}$. The lower sum runs the
      same indices shifted down by one and gives
      $L_n = \dfrac{(n-1)n(2n-1)}{6n^3}
      = \dfrac{1}{3} - \dfrac{1}{2n} + \dfrac{1}{6n^2}$. Subtracting,
      $U_n - L_n = \dfrac{1}{n}$, so the Cauchy criterion is already satisfied
      and $f$ is integrable.

      The value follows without any theory of sequences. For every $n$ the
      lower and upper integrals are trapped between $L_n$ and $U_n$, and the
      number $\dfrac{1}{3}$ is trapped there too, since
      $L_n \le \dfrac{1}{3} \le U_n$ for every $n \ge 1$. Two numbers inside an
      interval of length $1/n$ differ by at most $1/n$; as this holds for every
      $n$, and no positive number is below $1/n$ for all $n$, both integrals
      equal $\dfrac{1}{3}$. So $\int_0^1 x^2\,dx = \dfrac{1}{3}$.

      Look at what that cost. The answer came out of an identity special to
      squares; cubes need a different identity, fourth powers another, and
      $\sin$ none of them. There is no general procedure here, and every new
      integrand is a new research problem. That is exactly the gap the
      Fundamental Theorem of Calculus closes.
    worked: >
      Run the same machine on $f(x) = x^3$ over $[0,1]$, using the identity
      $\sum_{i=1}^{n} i^3 = \dfrac{n^2(n+1)^2}{4}$. With $x_i = i/n$ and $f$
      increasing, the upper sum is
      $U_n = \dfrac{1}{n^4}\sum_{i=1}^{n} i^3 = \dfrac{(n+1)^2}{4n^2}
      = \dfrac{1}{4} + \dfrac{1}{2n} + \dfrac{1}{4n^2}$, and the lower sum,
      running the indices from $0$ to $n-1$, is
      $L_n = \dfrac{(n-1)^2}{4n^2}
      = \dfrac{1}{4} - \dfrac{1}{2n} + \dfrac{1}{4n^2}$. Their difference is
      again $\dfrac{1}{n}$, so $x^3$ is integrable, and $\dfrac{1}{4}$ lies
      between $L_n$ and $U_n$ for every $n$. Both integrals are therefore
      within $1/n$ of $\dfrac{1}{4}$ for every $n$, which forces
      $\int_0^1 x^3\,dx = \dfrac{1}{4}$. Notice that the whole computation had
      to be redone: nothing about the $x^2$ case transferred except the shape
      of the argument.
    pitfalls: >
      Right-endpoint sums are the *upper* sums only because $x^2$ increases on
      $[0,1]$ — on $[-1,0]$ the roles swap, and for a function that rises and
      falls neither endpoint rule gives a Darboux sum at all. The argument also
      needs both $L_n$ and $U_n$: exhibiting only $U_n$ shows the upper
      integral is at most $1/3$ and says nothing about the lower one. And the
      squeeze concludes from "differs from $1/3$ by at most $1/n$ for every
      $n$", not from any single $n$ — one partition never determines an
      integral.
    recap: >
      Uniform partitions plus the sum-of-squares identity pin
      $\int_0^1 x^2\,dx$ to $\dfrac{1}{3}$ from the definition alone, at the
      cost of an argument that transfers to no other integrand.
    dialogue:
      - part: Rectangles under a parabola
        teach: >
          Compute the area under $f(x) = x^2$ from $0$ to $1$ using nothing but
          the definition: uniform partitions, upper and lower sums, and a
          squeeze. Cut $[0,1]$ into $n$ cells of width $1/n$ at the points
          $x_i = i/n$.
      - ask: >
          Why is the right-endpoint sum exactly the *upper* Darboux sum here?
        choices:
          - text: >
              Right-endpoint sums are always the upper sums.
            feedback: >
              Only for increasing functions. On $[-1,0]$, where $x^2$
              decreases, the right end of each cell is the lowest point, and
              the right-endpoint sum is the *lower* sum.
          - text: >
              Because $x^2$ increases on $[0,1]$, so its supremum on each cell
              sits at the cell's right end.
            correct: true
            feedback: >
              And its infimum at the left end. Both extremes are therefore
              computable exactly, not just approximable.
          - text: >
              Because $x^2 \ge 0$.
            feedback: >
              Positivity says the sums are non-negative; it says nothing about
              where on a cell the largest value is.
        feedback: >
          For an increasing function, right ends give $U$ and left ends give
          $L$. For a function that rises and falls, neither does.
      - ask: >
          With $n = 2$, what is the upper sum $U_2$?
        expects: "0.625"
        feedback: >
          The right ends are $1/2$ and $1$, so
          $U_2 = \dfrac{1}{2}\left(\dfrac{1}{4} + 1\right) = 0.625$. The lower
          sum is $\dfrac{1}{2}\left(0 + \dfrac{1}{4}\right) = 0.125$.
      - ask: >
          With $n = 4$, what is $U_4$?
        expects: "0.46875"
        hint: >
          The heights are $(1/4)^2, (2/4)^2, (3/4)^2, (4/4)^2$, and each width
          is $1/4$.
        feedback: >
          $U_4 = \dfrac{1}{4} \cdot \dfrac{1 + 4 + 9 + 16}{16}
          = \dfrac{30}{64} = 0.46875$. The lower sum is
          $\dfrac{1 + 4 + 9}{64} = 0.21875$. The gap fell from $0.5$ to
          $0.25$.

      - part: Every n at once
        reflect: >
          In general $U_n = \dfrac{1}{n^3}\left(1^2 + 2^2 + \cdots + n^2\right)$.
          Computing it for $n = 2, 4, 8, \ldots$ one at a time never ends.
          What do you need in order to see how $U_n$ behaves for *all* $n$?
        hint: >
          The obstacle is a sum with $n$ terms.
        answer: >
          A closed form for the sum of the first $n$ squares:
          $\sum_{i=1}^{n} i^2 = \dfrac{n(n+1)(2n+1)}{6}$. Then
          $U_n = \dfrac{n(n+1)(2n+1)}{6n^3}
          = \dfrac{1}{3} + \dfrac{1}{2n} + \dfrac{1}{6n^2}$, and the lower sum,
          whose indices run from $0$ to $n - 1$, is
          $L_n = \dfrac{1}{3} - \dfrac{1}{2n} + \dfrac{1}{6n^2}$. Now the whole
          sequence is visible at once.
      - ask: >
          Use the closed form. What is $U_{10}$?
        expects: "0.385"
        feedback: >
          $\dfrac{10 \cdot 11 \cdot 21}{6 \cdot 1000} = \dfrac{385}{1000}
          = 0.385$, which matches
          $\dfrac{1}{3} + \dfrac{1}{20} + \dfrac{1}{600}$.
      - ask: >
          And $L_{10}$?
        expects: "0.285"
        hint: >
          $L_n = \dfrac{(n-1)n(2n-1)}{6n^3}$.
        feedback: >
          $\dfrac{9 \cdot 10 \cdot 19}{6000} = \dfrac{285}{1000} = 0.285$. The
          gap $U_{10} - L_{10} = 0.1 = 1/10$; in general
          $U_n - L_n = 1/n$, so the Cauchy criterion already says $x^2$ is
          integrable.
      - ask: >
          What single number lies between $L_n$ and $U_n$ for every $n$?
        expects: "1/3"
        hint: >
          Look at the constant term that $L_n$ and $U_n$ share.
        feedback: >
          $\dfrac{1}{3}$. $U_n = \dfrac{1}{3} + (\text{positive})$, and
          $L_n = \dfrac{1}{3} - \dfrac{1}{2n} + \dfrac{1}{6n^2}
          \le \dfrac{1}{3}$ because $\dfrac{1}{6n^2} \le \dfrac{1}{2n}$ for
          every $n \ge 1$.

      - part: Closing the squeeze
        ask: >
          Both the lower and upper integrals lie in $[L_n, U_n]$, an interval
          of length $1/n$ that also contains $\dfrac{1}{3}$. Why does that
          force both integrals to equal $\dfrac{1}{3}$?
        choices:
          - text: >
              Because $U_{10} = 0.385$ is already close to $1/3$.
            feedback: >
              One partition never determines an integral; it only brackets it,
              here to within $0.1$.
          - text: >
              Each is within $1/n$ of $1/3$ for every $n$, and a non-negative
              number below $1/n$ for every $n$ is $0$.
            correct: true
            feedback: >
              The distance from either integral to $\dfrac{1}{3}$ is a fixed
              number that no $1/n$ can stay above, so it is $0$. No theory of
              limits of sequences is needed.
          - text: >
              Because at $n = \infty$ the sums equal $1/3$.
            feedback: >
              There is no partition with infinitely many cells. The argument
              runs over every finite $n$ and uses that $1/n$ gets below any
              positive number.
        feedback: >
          So $\int_0^1 x^2\,dx = \dfrac{1}{3}$, straight from the definition.
      - ask: >
          Suppose you had computed only the upper sums, and shown
          $U_n \to \dfrac{1}{3}$. What would that prove?
        choices:
          - text: >
              That $\int_0^1 x^2\,dx = \dfrac{1}{3}$.
            feedback: >
              Integrability needs the lower integral too. Without $L_n$,
              nothing rules out a lower integral of $0$.
          - text: >
              That the upper integral is at most $\dfrac{1}{3}$, and nothing
              about the lower one.
            correct: true
            feedback: >
              The upper integral is an infimum of upper sums, so upper sums
              bound it from above. Pinning down the integral needs both jaws.
          - text: >
              Nothing at all.
            feedback: >
              It proves something real: the upper integral is at most
              $\dfrac{1}{3}$. It just is not the whole answer.
        feedback: >
          A squeeze needs two jaws. The function equal to $1$ on rationals and
          $0$ elsewhere has upper sums that settle perfectly well, all equal
          to $1$, and no integral.
      - ask: >
          Run the same machine on $x^3$ over $[0,1]$, using
          $\sum_{i=1}^{n} i^3 = \dfrac{n^2(n+1)^2}{4}$. What is
          $\int_0^1 x^3\,dx$?
        expects: "1/4"
        hint: >
          $U_n = \dfrac{1}{n^4}\sum_{i=1}^{n} i^3$.
        feedback: >
          $U_n = \dfrac{(n+1)^2}{4n^2} = \dfrac{1}{4} + \dfrac{1}{2n}
          + \dfrac{1}{4n^2}$ and
          $L_n = \dfrac{(n-1)^2}{4n^2} = \dfrac{1}{4} - \dfrac{1}{2n}
          + \dfrac{1}{4n^2}$, a gap of $1/n$ with $\dfrac{1}{4}$ between. So
          $\int_0^1 x^3\,dx = \dfrac{1}{4}$ — after redoing every step with a
          new identity.
      - teach: >
          Nothing from the $x^2$ computation transferred to $x^3$ except the
          shape of the argument. Every integrand needs its own summation
          identity, and most have none. That cost is exactly what the
          Fundamental Theorem of Calculus removes.

  - node: analysis.svc.def-antiderivative
    hook: >
      Every derivative so far has been computed forwards. Running the question
      backwards — which function has *this* as its derivative — is a genuinely
      different problem, and naming its answer set is what lets the Fundamental
      Theorem be stated at all.
    explanation: >
      $F$ is an antiderivative of $f$ on an interval $I$ when $F$ is
      differentiable there and $F'(x) = f(x)$ at every point. Nothing is
      required to be clever: $F(x) = \dfrac{x^3}{3}$ is an antiderivative of
      $f(x) = x^2$ on $\mathbb{R}$, because the derivative of $x^3$ is $3x^2$
      from the definition, and multiplying a function by $\dfrac{1}{3}$
      multiplies every difference quotient by $\dfrac{1}{3}$.

      Antiderivatives are never unique. If $F' = f$ then $(F + C)' = f$ too,
      since a constant contributes $0$ to every difference quotient. What makes
      the situation manageable rather than chaotic is the converse, and you
      already have it: on an *interval*, two functions with the same derivative
      differ by a constant. So the antiderivatives of $f$ on $I$ are exactly
      the family $F + C$ — a single one-parameter family, with no stragglers.

      The notation $\int f(x)\,dx = F(x) + C$ names that family, and it
      deliberately reuses the integral sign. Be clear that this is a promise,
      not a fact. The indefinite integral is a set of *functions*, produced by
      differentiation; the definite integral $\int_a^b f(x)\,dx$ is a single
      *number*, produced by rectangles. Nothing so far connects them, and the
      shared symbol is a piece of optimism that the Fundamental Theorem will
      later justify.

      Existence is a real question. Asking for $F$ with $F' = f$ is asking to
      solve an equation, not to evaluate a formula, and there is no reason in
      advance that a solution should exist for a given $f$. There is also a
      separate and often confused question: whether an antiderivative that
      exists can be *written down* in elementary terms. For $f(x) = e^{-x^2}$
      the answer to the first question turns out to be yes and to the second
      no, and only the first one matters for the theory.
    worked: >
      Check that $F(x) = \dfrac{x^3}{3} - 2x^2 + 5x$ is an antiderivative of
      $f(x) = x^2 - 4x + 5$ on $\mathbb{R}$, then select the member of the
      family with a prescribed value. Differentiate term by term: the
      derivative of $x^3$ is $3x^2$, so the first term contributes $x^2$; the
      derivative of $x^2$ is $2x$, so $-2x^2$ contributes $-4x$; and $5x$ has
      constant difference quotient $5$. Adding, $F'(x) = x^2 - 4x + 5 = f(x)$
      as required. The full family is $F(x) + C$. Suppose you want the member
      $G$ with $G(3) = 1$. Evaluate: $F(3) = \dfrac{27}{3} - 18 + 15 = 6$, so
      $6 + C = 1$ and $C = -5$. Hence
      $G(x) = \dfrac{x^3}{3} - 2x^2 + 5x - 5$, and, for instance,
      $G(0) = -5$. One derivative and one value pick out exactly one function.
    pitfalls: >
      The "+ C" claim is a theorem about intervals, not a formality. On
      $(0,1) \cup (2,3)$ two antiderivatives of the same function may differ by
      one constant on the left piece and a different constant on the right, so
      the family has two parameters, not one — and antiderivative arguments on
      a punctured domain go wrong exactly there. Do not read $\int f(x)\,dx$
      and $\int_a^b f(x)\,dx$ as the same object: one is a family of functions,
      the other a number, and their relationship is a theorem rather than a
      definition. And "has no elementary antiderivative" never means "has no
      antiderivative".
    recap: >
      An antiderivative of $f$ on an interval is any $F$ with $F' = f$, and
      because zero derivative on an interval means constant, the antiderivatives
      form exactly the one-parameter family $F + C$.
    dialogue:
      - part: Running a derivative backwards
        teach: >
          A falling stone's speed is $v(t) = 10t$ metres per second after $t$
          seconds. You want its position, and every derivative you have
          computed so far went the other way: from a function to its rate.
          Now the rate is given and the function is wanted.
      - ask: >
          Which function has derivative $10t$?
        choices:
          - text: >
              $10t^2$
            feedback: >
              Its derivative is $10 \cdot 2t = 20t$, twice too fast. The
              factor $2$ from differentiating $t^2$ must be cancelled in
              advance.
          - text: >
              $5t^2$
            correct: true
            feedback: >
              The derivative of $t^2$ is $2t$, so the derivative of $5t^2$ is
              $10t$.
          - text: >
              $10$
            feedback: >
              That is the derivative *of* $10t$, not a function whose
              derivative is $10t$. The direction is reversed.
        feedback: >
          Guess, differentiate, adjust: at this stage that is the whole
          method.
      - ask: >
          Is $5t^2$ the only function with derivative $10t$?
        choices:
          - text: >
              Yes: the derivative determines the function.
            feedback: >
              $5t^2 + 3$ has the same derivative, since a constant adds $0$ to
              every difference quotient. The derivative sees change, not
              starting level.
          - text: >
              No: $5t^2 + t$ works too.
            feedback: >
              Its derivative is $10t + 1$. Adding anything that moves changes
              the derivative.
          - text: >
              No: $5t^2 + C$ works for every constant $C$.
            correct: true
            feedback: >
              $(5t^2 + C)' = 10t + 0$. The stone's speed tells you how its
              position changes, not where it started.
        feedback: >
          So the backwards question has a whole family of answers.
      - ask: >
          Suppose the stone's position is the member of the family $5t^2 + C$
          with value $12$ at $t = 1$. What is its value at $t = 3$?
        expects: "52"
        hint: >
          Find $C$ from $5 + C = 12$.
        feedback: >
          $5(1)^2 + C = 12$ gives $C = 7$, so the position at $t = 3$ is
          $45 + 7 = 52$. One derivative and one value picked out one member of
          the family.
      - reflect: >
          Given one function $F$ with $F' = f$, you produced a family $F + C$.
          Could some $G$ with $G' = f$ lie *outside* that family? What would
          have to be true of $G - F$?
        hint: >
          Differentiate $G - F$.
        answer: >
          $(G - F)' = f - f = 0$, so the question is whether a function with
          zero derivative must be constant. On an interval it must — that is
          the corollary "$f' \equiv 0$ ⇒ $f$ constant", powered by the Mean
          Value Theorem — so on an interval the family $F + C$ is everything.
          On a domain in separate pieces it need not be, and the family grows.
      - teach: >
          The name: $F$ is an antiderivative of $f$ on an interval $I$ if $F$
          is differentiable on $I$ and $F'(x) = f(x)$ for every $x$ in $I$. The
          notation $\int f(x)\,dx = F(x) + C$ names the whole family.
          Antiderivatives are never unique; $+ C$ is the price of running a
          derivative backwards.

      - part: Checking a candidate
        ask: >
          Which is an antiderivative of $f(x) = x^2 - 4x + 5$?
        choices:
          - text: >
              $2x - 4$
            feedback: >
              That is the derivative of $f$, not a function whose derivative
              is $f$.
          - text: >
              $x^3 - 4x^2 + 5x$
            feedback: >
              Its derivative is $3x^2 - 8x + 5$. Each power needs its
              coefficient divided by the new exponent.
          - text: >
              $\dfrac{x^3}{3} - 2x^2 + 5x$
            correct: true
            feedback: >
              Term by term: $\dfrac{x^3}{3}$ gives $x^2$, $-2x^2$ gives $-4x$,
              and $5x$ gives $5$. Checking an antiderivative is always just
              differentiating it.
          - text: >
              $\dfrac{x^3}{3} - 4x^2 + 5x$
            feedback: >
              Its derivative is $x^2 - 8x + 5$. The $-4x$ needs $-2x^2$, whose
              derivative is $-4x$.
        feedback: >
          Finding an antiderivative can be hard; checking one never is.
      - ask: >
          Let $G$ be the antiderivative of $x^2 - 4x + 5$ of the form
          $\dfrac{x^3}{3} - 2x^2 + 5x + C$ with $G(3) = 1$. What is $G(0)$?
        expects: "-5"
        hint: >
          Evaluate $\dfrac{x^3}{3} - 2x^2 + 5x$ at $x = 3$ first.
        feedback: >
          At $x = 3$: $9 - 18 + 15 = 6$, so $6 + C = 1$ and $C = -5$. Then
          $G(0) = 0 + C = -5$.
      - ask: >
          $(x + 1)^2$ and $x^2 + 2x$ are both antiderivatives of $2x + 2$ on
          $\mathbb{R}$. By what constant does the first exceed the second?
        expects: "1"
        hint: >
          Expand $(x + 1)^2$.
        feedback: >
          $(x + 1)^2 = x^2 + 2x + 1$, so it exceeds $x^2 + 2x$ by exactly $1$
          at every $x$. Two antiderivatives found by different routes can
          look unrelated and still differ only by a constant.

      - part: What the notation hides
        ask: >
          On the domain $(0,1) \cup (2,3)$, let $F(x) = x^2$, and let $H(x) = x^2$
          on $(0,1)$ but $H(x) = x^2 + 7$ on $(2,3)$. Both have derivative
          $2x$ everywhere on the domain. Which statement is true?
        choices:
          - text: >
              $H$ is not an antiderivative of $2x$, since it is not of the form
              $F + C$.
            feedback: >
              Being an antiderivative only asks that $H' = 2x$ at every point,
              and it is. The form $F + C$ is a consequence on intervals, not
              part of the definition.
          - text: >
              $H = F + 7$, so it is in the family after all.
            feedback: >
              On $(0,1)$ they are equal, so $H - F$ is $0$ there and $7$ on
              the other piece. No single constant works.
          - text: >
              $H$ is an antiderivative of $2x$, and $H - F$ is not constant:
              on a domain in pieces, each piece gets its own constant.
            correct: true
            feedback: >
              The family has two free constants here, one per piece. Arguments
              that assume a single $+ C$ break on punctured domains exactly
              this way.
        feedback: >
          "$+ C$" describes all antiderivatives only on an interval.
      - ask: >
          How are $\int x^2\,dx$ and $\int_0^1 x^2\,dx$ related, as they stand?
        choices:
          - text: >
              They are the same object, one with limits written in.
            feedback: >
              One is a family of functions, produced by undoing a derivative;
              the other is a single number, produced by rectangles. The shared
              symbol does not make them the same thing.
          - text: >
              The second is the first evaluated at $x = 1$.
            feedback: >
              Which member of the family would you evaluate? $\dfrac{x^3}{3}$
              and $\dfrac{x^3}{3} + 5$ give different values at $1$, while
              $\int_0^1 x^2\,dx$ is a single number.
          - text: >
              One is a family of functions, the other a number defined by
              rectangle sums; nothing proved so far connects them.
            correct: true
            feedback: >
              Reusing the integral sign is a promise, not yet a fact. Keeping
              the two apart now is what makes the theorem connecting them mean
              something.
        feedback: >
          The indefinite integral comes from derivatives, the definite one
          from Riemann sums. A theorem, not a definition, will join them.
      - teach: >
          An antiderivative of $f$ on an interval is any $F$ with $F' = f$,
          and together they form the family $F + C$. Whether a given $f$ has an
          antiderivative at all is a real question, since it asks you to solve
          an equation rather than evaluate a formula.

  - node: analysis.svc.ftc-part-1
    hook: >
      This is the moment the two halves of the unit meet. Accumulate a
      continuous function, differentiate the accumulation, and you get the
      original back — which means every continuous function has an
      antiderivative, whether or not anyone can write it down.
    explanation: >
      Let $f$ be continuous on $[a,b]$ and define the accumulation function
      $F(x) = \int_a^x f(t)\,dt$: the signed area collected from the left end
      up to $x$. This is well posed only because a continuous function on a
      closed bounded interval is integrable, so each $[a,x]$ has an integral.
      The claim is that $F$ is differentiable with $F'(x) = f(x)$.

      Form the difference quotient. The numerator $F(x+h) - F(x)$ is the
      accumulation over the little cell alone, because integrals add over
      adjacent intervals: any partition of $[a, x+h]$ can be refined to include
      the point $x$, after which its upper and lower sums split into a piece
      over $[a,x]$ and a piece over $[x, x+h]$, so
      $\int_a^{x+h} f = \int_a^x f + \int_x^{x+h} f$. The quotient is therefore
      $\dfrac{1}{h}\int_x^{x+h} f(t)\,dt$ — the *average value* of $f$ on a
      shrinking cell.

      Now squeeze, the load-bearing step. Take $h > 0$: the Extreme Value
      Theorem on the closed cell $[x, x+h]$ produces an attained minimum $m_h$
      and maximum $M_h$. The one-cell partition
      of $[x, x+h]$ already has lower sum $m_h\,h$ and upper sum $M_h\,h$, and
      the integral lies between any lower and upper sum, so
      $m_h\,h \le \int_x^{x+h} f \le M_h\,h$. Divide by the positive $h$:
      $m_h \le \dfrac{F(x+h) - F(x)}{h} \le M_h$. But $m_h$ and $M_h$ are
      values of $f$ at points within $h$ of $x$, so continuity at $x$ drives
      both to $f(x)$ as $h \to 0$, and the trapped quotient has nowhere else to
      go. Negative $h$ runs identically.

      Read the conclusion twice. As a computation it says
      $\dfrac{d}{dx}\int_a^x f(t)\,dt = f(x)$: differentiating an accumulation
      undoes it. As an existence theorem it says every continuous $f$ *has* an
      antiderivative — its own area-so-far function — which covers integrands
      like $e^{-x^2}$, for which no elementary antiderivative exists at all.
    worked: >
      Take $f(t) = t^2$ and $F(x) = \int_0^x t^2\,dt$, and check the theorem by
      computing $F$ outright. Partition $[0,x]$ uniformly with $t_i = ix/n$, so
      each cell has width $x/n$ and, $t^2$ being increasing on $[0,x]$ for
      $x > 0$, the upper sum is
      $U_n = \sum_{i=1}^{n}\left(\dfrac{ix}{n}\right)^2\dfrac{x}{n}
      = \dfrac{x^3}{n^3}\sum_{i=1}^{n} i^2
      = x^3\left(\dfrac{1}{3} + \dfrac{1}{2n} + \dfrac{1}{6n^2}\right)$,
      with the lower sum the same but with the middle sign flipped. The
      familiar squeeze gives $F(x) = \dfrac{x^3}{3}$. Now differentiate: the
      derivative of $x^3$ is $3x^2$, so $F'(x) = x^2 = f(x)$, exactly as
      promised. At $x = 2$: $F(2) = \dfrac{8}{3}$ and $F'(2) = 4 = f(2)$.
    pitfalls: >
      The variable of integration is a placeholder — writing
      $F(x) = \int_a^x f(x)\,dx$ uses $x$ for two different roles and makes the
      statement meaningless, so keep the dummy variable $t$. The conclusion is
      $F'(x) = f(x)$, the integrand evaluated at the upper limit, not
      $f(x) - f(a)$ and not anything involving $a$: changing the lower limit
      shifts $F$ by a constant and leaves $F'$ untouched. And continuity powers
      the squeeze: for an integrable but discontinuous $f$ the accumulation
      function still exists, but can fail to be differentiable where $f$ jumps.
    recap: >
      The difference quotient of $\int_a^x f$ is the average value of $f$ on a
      shrinking cell, and continuity squeezes that average to $f(x)$ — so every
      continuous function is the derivative of its own accumulation.
    dialogue:
      - part: Water in a tank
        teach: >
          Water flows into a tank at $f(t) = 2t + 1$ litres per minute, $t$
          minutes after the tap opens. Let $A(x) = \int_0^x f(t)\,dt$ be the
          water collected by minute $x$ — the area under the rate graph from
          $0$ to $x$. The region is a trapezoid, so you can compute it
          directly.
      - ask: >
          How many litres have been collected by minute $3$, that is, what is
          $A(3)$?
        expects: "12"
        hint: >
          A trapezoid of width $3$ with parallel sides $f(0)$ and $f(3)$.
        feedback: >
          The sides are $f(0) = 1$ and $f(3) = 7$, so
          $A(3) = \dfrac{1 + 7}{2} \cdot 3 = 12$. In general
          $A(x) = \dfrac{1 + (2x + 1)}{2}\,x = x^2 + x$.
      - ask: >
          How much water arrives in the next $0.1$ minute: what is
          $A(3.1) - A(3)$?
        expects: "0.71"
        feedback: >
          $A(3.1) = 9.61 + 3.1 = 12.71$, so the difference is $0.71$ — a thin
          trapezoid of width $0.1$ between heights $7$ and $7.2$.
      - ask: >
          So the average inflow over that tenth of a minute is
          $0.71 / 0.1 = 7.1$ litres per minute. As the window shrinks to $0$,
          what should $\dfrac{A(3 + h) - A(3)}{h}$ approach?
        expects: "7"
        feedback: >
          $\dfrac{A(3+h) - A(3)}{h} = \dfrac{(3+h)^2 + (3+h) - 12}{h}
          = 7 + h$ for $h \ne 0$, which tends to $7$. And $7 = f(3)$, the flow
          rate at minute $3$: $A'(3) = f(3)$.
      - reflect: >
          The rate of change of the collected water turned out to be the flow
          rate. Why should the difference quotient of an accumulation be close
          to the integrand, for any continuous $f$? Say what the numerator is,
          and what dividing by $h$ does to it.
        hint: >
          $A(x + h) - A(x)$ is the water that arrived during one short window.
        answer: >
          The numerator is the accumulation over the thin window alone,
          $\int_x^{x+h} f(t)\,dt$. Dividing by the width $h$ turns it into the
          *average value* of $f$ on $[x, x+h]$. As the window shrinks, every
          value of $f$ in it is close to $f(x)$, by continuity, so the average
          is too. The derivative of the accumulation is the integrand.
      - teach: >
          That is the Fundamental Theorem of Calculus, Part I. If $f$ is
          continuous on $[a,b]$ and $F(x) = \int_a^x f(t)\,dt$, then $F$ is
          differentiable on $[a,b]$, one-sidedly at the endpoints, with
          $F'(x) = f(x)$. $F$ is well defined because a continuous function on
          a closed bounded interval is integrable on every $[a,x]$.

      - part: The squeeze
        ask: >
          The first step writes $F(x + h) - F(x) = \int_x^{x+h} f(t)\,dt$. What
          justifies it?
        choices:
          - text: >
              It is the definition of the integral.
            feedback: >
              The definition speaks of one interval at a time. That integrals
              over adjacent intervals add is a fact to prove.
          - text: >
              Refine any partition of $[a, x+h]$ to include $x$; its upper and
              lower sums split into a part over $[a,x]$ and a part over
              $[x, x+h]$, so the integrals add.
            correct: true
            feedback: >
              Adding a cut point only refines, and refined sums still squeeze
              the integral. So
              $\int_a^{x+h} f = \int_a^x f + \int_x^{x+h} f$.
          - text: >
              The Fundamental Theorem itself.
            feedback: >
              That would be circular: this step is inside the proof of the
              theorem.
        feedback: >
          Additivity over adjacent intervals turns the numerator into the area
          over one thin cell.
      - ask: >
          Take $h > 0$ and let $m_h$ and $M_h$ be the infimum and supremum of
          $f$ on $[x, x+h]$. What does the one-cell partition of $[x, x+h]$
          tell you about $Q = \dfrac{F(x+h) - F(x)}{h}$?
        choices:
          - text: >
              $Q = f(x)$ exactly.
            feedback: >
              For the tank at $x = 3$, $h = 0.1$, $Q = 7.1$, not $7$. Equality
              comes only in the limit.
          - text: >
              $m_h \le Q \le M_h$.
            correct: true
            feedback: >
              The one-cell lower and upper sums are $m_h\,h$ and $M_h\,h$, and
              the integral lies between them. Dividing by $h > 0$ traps $Q$.
              For the tank: $7 \le 7.1 \le 7.2$.
          - text: >
              $Q \le m_h$, since averages are at most the smallest value.
            feedback: >
              An average is at least the smallest value and at most the
              largest. That is the whole squeeze.
        feedback: >
          The quotient is an average of $f$ over the cell, trapped between the
          cell's infimum and supremum.
      - ask: >
          Now continuity at $x$: suppose $|f(t) - f(x)| < 0.05$ whenever
          $|t - x| < \delta$. For $0 < h < \delta$, at most how far can $Q$
          be from $f(x)$?
        expects: "0.05"
        feedback: >
          Every value of $f$ on $[x, x+h]$ lies in
          $(f(x) - 0.05, f(x) + 0.05)$, so $m_h$ and $M_h$ lie in
          $[f(x) - 0.05, f(x) + 0.05]$, and so does $Q$. The same works for
          any tolerance, so $Q \to f(x)$. Negative $h$ runs the same way.

      - part: What the theorem does and does not say
        ask: >
          Let $G(x) = \int_1^x f(t)\,dt$ instead of starting at $0$. What is
          $G'(x)$?
        choices:
          - text: >
              $f(x) - f(1)$
            feedback: >
              Moving the lower limit subtracts a *number*,
              $\int_0^1 f$, from the accumulation, not a function of $x$. A
              constant shift has no effect on the derivative.
          - text: >
              $f(x)$
            correct: true
            feedback: >
              $G(x) = \int_0^x f - \int_0^1 f$, the old accumulation minus a
              constant. Its derivative is still $f(x)$: the lower limit never
              appears.
          - text: >
              $f(x) + f(1)$
            feedback: >
              The lower limit contributes a constant to $G$, and a constant
              contributes nothing to $G'$.
        feedback: >
          The derivative of an accumulation is the integrand at the upper
          limit, whatever the starting point.
      - ask: >
          What is the derivative of $x \mapsto \int_0^x (t^2 + 1)\,dt$ at
          $x = 2$?
        expects: "5"
        feedback: >
          The integrand is continuous, so the derivative is the integrand at
          the upper limit: $2^2 + 1 = 5$. No integral needed computing.
      - ask: >
          Let $f(t) = 0$ for $t < 1$ and $f(t) = 1$ for $t \ge 1$, on $[0,2]$.
          Its accumulation is $A(x) = 0$ for $x \le 1$ and $A(x) = x - 1$ for
          $x \ge 1$. Is $A$ differentiable at $1$?
        choices:
          - text: >
              Yes, with $A'(1) = f(1) = 1$.
            feedback: >
              That applies the theorem without its hypothesis. From the left
              the quotients of $A$ at $1$ are $0$, from the right they are $1$.
          - text: >
              $A$ is not even defined, since $f$ is not continuous.
            feedback: >
              A step function is integrable, so $A$ exists. What continuity
              buys is the derivative, not the integral.
          - text: >
              No: the one-sided slopes are $0$ and $1$, a corner — the squeeze
              fails where $f$ jumps.
            correct: true
            feedback: >
              The average of $f$ over a window just right of $1$ is $1$, just
              left it is $0$. Continuity at $x$ is what forces the two sides to
              agree.
        feedback: >
          Continuity powers the squeeze. Where the integrand jumps, the
          accumulation gets a corner.
      - teach: >
          The difference quotient of $\int_a^x f$ is the average of $f$ over a
          shrinking cell, and continuity squeezes it to $f(x)$. So every
          continuous function has an antiderivative — its own area-so-far
          function — whether or not anyone can write it with a formula.

  - node: analysis.svc.ftc-part-2
    hook: >
      This is the rule that makes calculus computable: find any antiderivative,
      subtract its values at the two endpoints, and the integral is done — no
      partitions, no summation identities, no squeeze.
    explanation: >
      The statement is short and the word *any* is the point. If $f$ is
      continuous on $[a,b]$ and $F$ is an antiderivative of $f$ there, then
      $\int_a^b f(x)\,dx = F(b) - F(a)$. You may already assemble a proof from
      what you hold: the accumulation function is one antiderivative, any other
      differs from it by a constant on the interval, and the constant cancels
      in the subtraction. Worth seeing instead is the direct argument, because
      it shows *why* a difference of two values should equal a limit of
      rectangle sums.

      Take any partition $a = x_0 < x_1 < \cdots < x_n = b$ and telescope the
      total change of $F$ across it:
      $F(b) - F(a) = \sum_{i=1}^{n}\left[F(x_i) - F(x_{i-1})\right]$, since
      every interior value appears once with each sign. That identity is free.
      Now spend the Mean Value Theorem on each cell: $F$ is continuous on
      $[x_{i-1}, x_i]$ and differentiable inside, so there is a $c_i$ in the
      open cell with
      $F(x_i) - F(x_{i-1}) = F'(c_i)\,\Delta x_i = f(c_i)\,\Delta x_i$.

      Substituting back, $F(b) - F(a) = \sum_{i=1}^{n} f(c_i)\,\Delta x_i$ —
      and the right-hand side is a *Riemann sum* of $f$, with the tags $c_i$
      handed to you by the theorem rather than chosen. The identity holds for
      every partition whatsoever. Since $f$ is continuous it is integrable, so
      given $\varepsilon > 0$ some partition has $U - L < \varepsilon$; both
      the Riemann sum and the integral lie between $L$ and $U$, so
      $\left|F(b) - F(a) - \int_a^b f\right| < \varepsilon$. A non-negative
      quantity below every positive number is zero, and the two are equal.

      The hypotheses deserve respect precisely because the rule is so easy to
      apply: $F$ must be an antiderivative on the *whole* interval $[a,b]$.
      Strip that away and the arithmetic still produces a number, cheerfully
      and wrongly.
    worked: >
      Evaluate $\int_1^3 x^2\,dx$. An antiderivative of $x^2$ on $[1,3]$ is
      $F(x) = \dfrac{x^3}{3}$, since the derivative of $x^3$ is $3x^2$. So the
      integral is
      $F(3) - F(1) = \dfrac{27}{3} - \dfrac{1}{3} = \dfrac{26}{3}$, about
      $8.667$. Compare the effort with computing it from Riemann sums, which
      would need the sum-of-squares identity all over again on a shifted
      interval. Take a second one to see that constants really do cancel:
      $\int_0^2 (3x^2 - 2x)\,dx$ has antiderivative $F(x) = x^3 - x^2$, giving
      $F(2) - F(0) = (8 - 4) - 0 = 4$. Using $F(x) = x^3 - x^2 + 100$ instead
      gives $(8 - 4 + 100) - (0 + 100) = 4$ as well, because the constant
      appears in both terms of the subtraction.
    pitfalls: >
      The antiderivative must be valid across the entire interval of
      integration. Writing $\int_{-1}^{1} \dfrac{1}{x^2}\,dx = F(1) - F(-1)$
      with $F(x) = -\dfrac{1}{x}$ yields $-1 - 1 = -2$, a negative answer for a
      strictly positive integrand — because $F$ is an antiderivative on
      $(0,1]$ and on $[-1,0)$ but on no interval containing $0$, where the
      integrand is not even bounded. The rule also runs one way: a continuous
      function whose antiderivative cannot be written down still needs the
      accumulation function from Part I. And the order of
      subtraction is $F(b) - F(a)$; reversing it flips the sign of the answer.
    recap: >
      Telescoping the change of $F$ across a partition and spending the Mean
      Value Theorem on each cell turns $F(b) - F(a)$ into a Riemann sum of $f$,
      so the difference of endpoint values *is* the integral.
    dialogue:
      - part: An integral in one line
        teach: >
          Consider $\int_1^3 x^2\,dx$. From rectangles alone it means a
          partition of $[1,3]$, a summation identity for shifted squares, and
          a squeeze. Here is a shortcut to test instead: $F(x) = \dfrac{x^3}{3}$
          has $F'(x) = x^2$, so take the difference $F(3) - F(1)$.
      - ask: >
          What is $F(3) - F(1)$ for $F(x) = \dfrac{x^3}{3}$?
        expects: "26/3"
        feedback: >
          $\dfrac{27}{3} - \dfrac{1}{3} = \dfrac{26}{3} \approx 8.667$. It is
          the right answer for the integral, and the rest of this lesson is
          why.
      - ask: >
          Would $F(x) = \dfrac{x^3}{3} + 100$, another antiderivative, give a
          different answer?
        choices:
          - text: >
              Yes: it is a different function, so it gives a different
              number.
            feedback: >
              $(9 + 100) - (\tfrac{1}{3} + 100) = \dfrac{26}{3}$ again. The
              $100$ appears in both terms and cancels.
          - text: >
              No: the constant appears in both $F(3)$ and $F(1)$ and cancels in
              the subtraction.
            correct: true
            feedback: >
              Which is lucky, because antiderivatives come only up to a
              constant. Any recipe using them must be blind to that constant,
              and a difference of two values is.
          - text: >
              It depends on whether $100$ is the right constant.
            feedback: >
              There is no right constant: every member of the family has
              derivative $x^2$, and every one gives $\dfrac{26}{3}$.
        feedback: >
          A difference of values is exactly the kind of quantity the $+ C$
          cannot affect.
      - reflect: >
          Why should $F(b) - F(a)$, a difference of two values, equal a limit
          of rectangle sums? Chop $[a,b]$ at points
          $a = x_0 < x_1 < \cdots < x_n = b$ and write $F(b) - F(a)$ as a sum
          of changes over the cells. What does the Mean Value Theorem say
          about each change?
        hint: >
          $F(b) - F(a) = \sum_{i=1}^{n} [F(x_i) - F(x_{i-1})]$, because the
          interior values cancel in pairs.
        answer: >
          On each cell the Mean Value Theorem gives a point $c_i$ with
          $F(x_i) - F(x_{i-1}) = F'(c_i)\,\Delta x_i = f(c_i)\,\Delta x_i$.
          Summing, $F(b) - F(a) = \sum f(c_i)\,\Delta x_i$ — a Riemann sum of
          $f$, tagged at points the theorem hands you. That holds for *every*
          partition, and Riemann sums of an integrable $f$ close in on the
          integral, so $F(b) - F(a)$ must be the integral.
      - teach: >
          That is the Fundamental Theorem of Calculus, Part II. If $f$ is
          continuous on $[a,b]$ and $F$ is any antiderivative of $f$ on
          $[a,b]$, then $\int_a^b f(x)\,dx = F(b) - F(a)$. No partitions, no
          summation identities, no squeeze.

      - part: Checking the machinery
        ask: >
          Test the telescoping on $F(x) = \dfrac{x^3}{3}$ over the cell
          $[1,2]$. The Mean Value Theorem gives $c$ with
          $F(2) - F(1) = c^2 \cdot 1$. What is $c$, to four decimal places?
        expects: "1.5275"
        tolerance: 0.0005
        hint: >
          $F(2) - F(1) = \dfrac{8}{3} - \dfrac{1}{3}$.
        feedback: >
          $c^2 = \dfrac{7}{3}$, so $c = \sqrt{7/3} \approx 1.5275$, inside
          $(1,2)$. So $f(c)\,\Delta x = \dfrac{7}{3}$ reproduces the change of
          $F$ on that cell exactly — a tag nobody would have chosen, handed
          over by the theorem.
      - ask: >
          $F(b) - F(a)$ equals a Riemann sum of $f$ for every partition. Why
          does that force it to equal $\int_a^b f$?
        choices:
          - text: >
              Because the tags $c_i$ are the midpoints, and midpoint sums are
              exact.
            feedback: >
              The $c_i$ are wherever the Mean Value Theorem puts them —
              $\sqrt{7/3}$ is not the midpoint $1.5$ of $[1,2]$ — and midpoint
              sums are not exact in general.
          - text: >
              Given $\varepsilon$, some partition has $U - L < \varepsilon$,
              and both the Riemann sum and the integral lie between $L$ and
              $U$, so they differ by less than $\varepsilon$.
            correct: true
            feedback: >
              $F(b) - F(a)$ and $\int_a^b f$ differ by less than every
              positive number, so they are equal. Integrability of the
              continuous $f$ is what supplies the partition.
          - text: >
              Because one partition is enough to compute an integral.
            feedback: >
              One partition only brackets an integral. The argument works
              because the identity holds for *every* partition, including the
              ones with $U - L$ tiny.
        feedback: >
          Telescoping plus the Mean Value Theorem cell by cell turns a
          difference of values into a Riemann sum; integrability does the
          rest.
      - ask: >
          There is also a short proof from Part I. $G(x) = \int_a^x f(t)\,dt$ is
          an antiderivative of $f$, so $F - G$ has zero derivative on
          $[a,b]$ and equals a constant $C$. What is $C$?
        choices:
          - text: >
              $0$
            feedback: >
              $F$ is *any* antiderivative, say $\dfrac{x^3}{3} + 100$. Nothing
              makes it agree with $G$. Evaluate both at a convenient point.
          - text: >
              $F(b)$
            feedback: >
              Evaluate at $x = b$ and you get $F(b) - \int_a^b f$, which is
              exactly the unknown. The convenient point is the other end.
          - text: >
              $F(a)$
            correct: true
            feedback: >
              $G(a) = \int_a^a f = 0$, so $C = F(a) - G(a) = F(a)$. Then
              $\int_a^b f = G(b) = F(b) - C = F(b) - F(a)$.
        feedback: >
          The constant is pinned by the one point where the accumulation is
          known: it is $0$ at the start.
      - ask: >
          Evaluate $\int_0^2 (3x^2 - 2x)\,dx$.
        expects: "4"
        hint: >
          An antiderivative is $x^3 - x^2$.
        feedback: >
          $F(x) = x^3 - x^2$ has $F' = 3x^2 - 2x$, so the integral is
          $F(2) - F(0) = (8 - 4) - 0 = 4$.

      - part: When the arithmetic lies
        ask: >
          $F(x) = -\dfrac{1}{x}$ has $F'(x) = \dfrac{1}{x^2}$ at every
          $x \ne 0$. Apply the rule blindly: what is $F(1) - F(-1)$?
        expects: "-2"
        feedback: >
          $F(1) - F(-1) = -1 - 1 = -2$. A negative number for
          $\int_{-1}^{1} \dfrac{1}{x^2}\,dx$, whose integrand is positive
          everywhere it is defined. Something has gone wrong.
      - ask: >
          What went wrong?
        choices:
          - text: >
              An arithmetic slip; done carefully, the answer is positive.
            feedback: >
              The arithmetic is right: $-\dfrac{1}{1} - \left(-\dfrac{1}{-1}\right)
              = -1 - 1 = -2$. The error is in using the rule at all.
          - text: >
              $F$ is not an antiderivative on any interval containing $0$, and
              $\dfrac{1}{x^2}$ is not continuous — not even bounded — on
              $[-1,1]$.
            correct: true
            feedback: >
              The theorem needs $f$ continuous and $F$ an antiderivative on
              the *whole* of $[a,b]$. Here both fail at $0$, and the rule
              cheerfully produces a wrong number.
          - text: >
              The rule only works when $a > 0$.
            feedback: >
              $\int_{-2}^{-1} \dfrac{1}{x^2}\,dx = F(-1) - F(-2)
              = 1 - \dfrac{1}{2} = \dfrac{1}{2}$ is perfectly correct. The
              problem is not the sign of $a$ but the point $0$ inside the
              interval.
        feedback: >
          The easier a rule is to apply, the more its hypotheses deserve
          checking: continuity of $f$ and an antiderivative on the whole
          interval.
      - teach: >
          Telescope $F(b) - F(a)$ across any partition, spend the Mean Value
          Theorem on each cell, and a Riemann sum appears. So the integral of a
          continuous $f$ is the change in any antiderivative, and every
          integration problem becomes a search for one.

  - node: analysis.svc.u-sub
    hook: >
      The evaluation rule turned integration into a search for antiderivatives,
      and searching needs technique. This is the first and most useful one: the
      chain rule run in reverse, spotting an inner function sitting next to its
      own derivative.
    explanation: >
      The chain rule says that composing functions multiplies their rates:
      $(F \circ g)'(x) = F'(g(x))\,g'(x)$. The picture is local linear
      approximation twice over — a step $h$ at $x$ moves $g$ by about
      $g'(x)h$, and a step that size at $g(x)$ moves $F$ by about
      $F'(g(x))$ times it. Read that identity from
      right to left and it tells you which integrands are easy: anything of the
      form $f(g(x))\,g'(x)$ has a visible antiderivative once you can
      antidifferentiate $f$ alone.

      The proof of the substitution rule is that observation plus the
      evaluation rule twice. Suppose $g$ has a continuous derivative on $[a,b]$
      and $f$ is continuous on an interval containing all the values of $g$
      there. Part I of the Fundamental Theorem supplies an antiderivative $F$
      of $f$. The chain rule makes $F \circ g$ an antiderivative of the
      continuous integrand $f(g(x))\,g'(x)$, so evaluating gives
      $\int_a^b f(g(x))\,g'(x)\,dx = F(g(b)) - F(g(a))$. Evaluating the other
      integral gives
      $\int_{g(a)}^{g(b)} f(u)\,du = F(g(b)) - F(g(a))$ as well. Both equal the
      same difference, hence each other:
      $\int_a^b f(g(x))\,g'(x)\,dx = \int_{g(a)}^{g(b)} f(u)\,du$.

      In practice the bookkeeping is mechanical. Name the inner function
      $u = g(x)$, write $du = g'(x)\,dx$, and rewrite the integrand *entirely*
      in $u$ — no stray $x$ survives. Then transform the limits: $x = a$
      becomes $u = g(a)$ and $x = b$ becomes $u = g(b)$. Transforming the
      limits beats substituting back at the end: less work, and fewer sign
      errors.

      Nothing requires $g$ to be increasing or even one-to-one. The proof ran
      through antiderivatives, not through any geometric change of variables,
      so the formula holds regardless: with $g(x) = x^2 + 1$ on $[-1,1]$ both
      new limits are $2$, and an integral from $2$ to $2$ is $0$ — correct,
      since that integrand is odd.
    worked: >
      Evaluate $\int_0^2 2x\,(x^2 + 1)^3\,dx$. The inner function is
      $g(x) = x^2 + 1$, whose derivative $2x$ is sitting right there in the
      integrand, so set $u = x^2 + 1$ and $du = 2x\,dx$. Transform the limits
      with $g$ itself: $x = 0$ gives $u = 1$, and $x = 2$ gives $u = 5$. The
      integral becomes $\int_1^5 u^3\,du$, with no trace of $x$ left. An
      antiderivative of $u^3$ is $\dfrac{u^4}{4}$, since the derivative of
      $u^4$ is $4u^3$, so the evaluation rule gives
      $\dfrac{5^4}{4} - \dfrac{1^4}{4} = \dfrac{625 - 1}{4} = \dfrac{624}{4}
      = 156$. Sanity-check the size: on $[0,2]$ the factor $(x^2+1)^3$ runs
      from $1$ up to $125$, so a total in the low hundreds is entirely
      plausible.
    pitfalls: >
      Changing the variable without changing the limits is the standard
      wreckage: after substituting, $\int_0^2$ would mean "from $u = 0$ to
      $u = 2$", which is a different integral entirely. The factor $g'(x)$ must
      genuinely be present up to a constant — $\int_0^2 (x^2+1)^3\,dx$ has no
      $2x$ available and this technique simply does not apply to it. And every
      $x$ must disappear: an integrand left as a mixture of $u$ and $x$ has not
      been substituted, and no amount of manipulation of the limits will repair
      it.
    recap: >
      Because $F \circ g$ is an antiderivative of $f(g(x))g'(x)$, substituting
      $u = g(x)$ and carrying the limits to $g(a)$ and $g(b)$ turns an integral
      of that shape into a plain integral of $f$.
    dialogue:
      - part: The slow way
        teach: >
          Evaluate $\int_0^1 2x\,(x^2 + 1)^2\,dx$. You can already do this:
          expand, find an antiderivative term by term, and subtract its values
          at the endpoints.
      - ask: >
          What is $\int_0^1 2x\,(x^2 + 1)^2\,dx$?
        expects: "7/3"
        hint: >
          $(x^2 + 1)^2 = x^4 + 2x^2 + 1$, so the integrand is
          $2x^5 + 4x^3 + 2x$.
        feedback: >
          An antiderivative of $2x^5 + 4x^3 + 2x$ is
          $\dfrac{x^6}{3} + x^4 + x^2$, which is $\dfrac{1}{3} + 1 + 1
          = \dfrac{7}{3}$ at $1$ and $0$ at $0$. So the integral is
          $\dfrac{7}{3}$.
      - ask: >
          That worked, but $\int_0^2 2x\,(x^2 + 1)^{10}\,dx$ would mean
          expanding an eleven-term polynomial. Look back at the antiderivative
          you found. Which of these also has derivative $2x\,(x^2 + 1)^2$?
        choices:
          - text: >
              $\dfrac{(x^2 + 1)^3}{3}$
            correct: true
            feedback: >
              Expand it: $\dfrac{x^6 + 3x^4 + 3x^2 + 1}{3}
              = \dfrac{x^6}{3} + x^4 + x^2 + \dfrac{1}{3}$ — your antiderivative
              plus a constant. The answer was a cube of $x^2 + 1$ all along.
          - text: >
              $\dfrac{(x^2 + 1)^3}{3} \cdot x^2$
            feedback: >
              Multiplying by $x^2$ to account for the $2x$ overshoots: this has
              degree $8$, and its derivative has degree $7$, not $5$.
          - text: >
              $(x^2 + 1)^3$
            feedback: >
              Its expansion is $x^6 + 3x^4 + 3x^2 + 1$, three times your
              antiderivative plus a constant. Its derivative is
              $6x\,(x^2 + 1)^2$, three times too big.
        feedback: >
          The expansion hid a simple shape: the antiderivative is a function of
          $x^2 + 1$.
      - reflect: >
          Why did $\dfrac{(x^2 + 1)^3}{3}$ work? Think of it as $F(g(x))$ with
          inner function $g(x) = x^2 + 1$. What was the factor $2x$ doing in
          the integrand, and how would you spot the same shape in
          $\int 3x^2\,(x^3 + 1)^4\,dx$?
        hint: >
          Differentiating a function of a function multiplies the rates: a
          small step $h$ moves $g$ by about $g'(x)h$, and that moves $F$ by
          about $F'(g(x))$ times as much.
        answer: >
          By the chain rule, $(F \circ g)'(x) = F'(g(x))\,g'(x)$. With
          $F(u) = u^3/3$ and $g(x) = x^2 + 1$ this is $(x^2 + 1)^2 \cdot 2x$:
          the $2x$ is the derivative of the inner function, sitting next to it.
          In $3x^2\,(x^3 + 1)^4$ the inner function is $x^3 + 1$, with
          derivative $3x^2$ beside it, so $\dfrac{(x^3 + 1)^5}{5}$ is an
          antiderivative.
      - teach: >
          Run that backwards and you have u-substitution. If $g$ has a
          continuous derivative on $[a,b]$ and $f$ is continuous on the values
          of $g$, then
          $\int_a^b f(g(x))\,g'(x)\,dx = \int_{g(a)}^{g(b)} f(u)\,du$: both
          sides equal $F(g(b)) - F(g(a))$ for an antiderivative $F$ of $f$. In
          practice, set $u = g(x)$, write $du = g'(x)\,dx$, rewrite everything
          in $u$, and move the limits too.

      - part: Carrying the limits
        ask: >
          Evaluate $\int_0^2 2x\,(x^2 + 1)^3\,dx$ with $u = x^2 + 1$. The lower
          limit $x = 0$ becomes $u = 1$. What does the upper limit $x = 2$
          become?
        expects: "5"
        feedback: >
          $u = g(2) = 2^2 + 1 = 5$. The integral becomes $\int_1^5 u^3\,du$,
          with no $x$ left anywhere.
      - ask: >
          What is its value?
        expects: "156"
        hint: >
          An antiderivative of $u^3$ is $\dfrac{u^4}{4}$.
        feedback: >
          $\dfrac{5^4}{4} - \dfrac{1^4}{4} = \dfrac{625 - 1}{4} = 156$. On
          $[0,2]$ the factor $(x^2 + 1)^3$ runs from $1$ to $125$, so a value
          in the low hundreds is plausible.
      - ask: >
          Someone substitutes $u = x^2 + 1$ but keeps the limits $0$ and $2$,
          and reports $\int_0^2 u^3\,du = 4$. What went wrong?
        choices:
          - text: >
              Nothing; the limits belong to the integral, not to the variable.
            feedback: >
              The limits say where the variable of integration runs. After
              substituting, the variable is $u$, and $u$ runs from $1$ to $5$,
              not from $0$ to $2$.
          - text: >
              They should have divided by $2x$ at the end.
            feedback: >
              The $2x$ was absorbed into $du$ already. The error is in the
              limits, which still describe $x$.
          - text: >
              The limits describe $x$, but the new integral is in $u$; they
              should have become $g(0) = 1$ and $g(2) = 5$.
            correct: true
            feedback: >
              $\int_0^2 u^3\,du$ is a different integral entirely. Moving the
              limits with $g$ is not optional bookkeeping.
        feedback: >
          Change the variable, change the limits. Doing both at once avoids
          substituting back at the end.
      - ask: >
          Evaluate $\int_0^1 x\,(x^2 + 1)^3\,dx$. The integrand has $x$, not
          $2x$.
        expects: "15/8"
        hint: >
          $x\,dx = \dfrac{1}{2}\,du$. The limits become $1$ and $2$.
        feedback: >
          With $u = x^2 + 1$, $x\,dx = \dfrac{1}{2}\,du$, so the integral is
          $\dfrac{1}{2}\int_1^2 u^3\,du = \dfrac{1}{2} \cdot \dfrac{16 - 1}{4}
          = \dfrac{15}{8}$. The derivative of the inner function need only be
          present up to a constant factor.

      - part: When it does not apply
        ask: >
          Try $u = x^2 + 1$ on $\int_0^2 (x^2 + 1)^3\,dx$. What happens?
        choices:
          - text: >
              It works and gives $\int_1^5 u^3\,du = 156$.
            feedback: >
              That integral was for $2x\,(x^2 + 1)^3$. Here there is no $2x$
              to become $du$, so $dx$ has nowhere to go.
          - text: >
              It works if you write $dx = \dfrac{du}{2x}$.
            feedback: >
              Then the integrand is $\dfrac{u^3}{2x}$, a mixture of $u$ and
              $x$. Until every $x$ is gone, nothing has been substituted.
          - text: >
              It fails: without a factor $2x$ (up to a constant) the integrand
              cannot be rewritten entirely in $u$.
            correct: true
            feedback: >
              This integral needs expanding instead:
              $x^6 + 3x^4 + 3x^2 + 1$. Substitution is for integrands of the
              shape $f(g(x))\,g'(x)$.
        feedback: >
          The technique is a pattern to spot, not a move that always applies.
      - ask: >
          $g(x) = x^2 + 1$ is not one-to-one on $[-1,1]$. Use the formula
          anyway: what is $\int_{-1}^{1} 2x\,(x^2 + 1)^3\,dx$?
        expects: "0"
        feedback: >
          Both limits map to $u = 2$, and $\int_2^2 u^3\,du = 0$. That is
          correct: the integrand is odd, so its areas left and right of $0$
          cancel. The proof went through antiderivatives, so nothing required
          $g$ to be one-to-one.
      - teach: >
          Because $F \circ g$ is an antiderivative of $f(g(x))\,g'(x)$,
          substituting $u = g(x)$ and moving the limits to $g(a)$ and $g(b)$
          turns such an integral into a plain integral of $f$. It is the chain
          rule, read from right to left.
