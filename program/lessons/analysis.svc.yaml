unit: analysis.svc
opening: >
  Calculus is two limits and the astonishing fact that they undo one another.
  This unit builds both from nothing but the completeness of $\mathbb{R}$: first
  the $\varepsilon$–$\delta$ limit and continuity, then the two existence
  theorems that continuity buys you on a closed bounded interval, then the
  derivative as a limit of difference quotients together with the Mean Value
  Theorem, which converts local information into global statements. The integral
  arrives as a squeeze between rectangle sums that know nothing about
  derivatives, and the Fundamental Theorem of Calculus arrives last to say that
  shrinking difference quotients and shrinking rectangles are inverse
  operations. By the end you should be able to run an $\varepsilon$–$\delta$
  proof, differentiate straight from the definition, evaluate an integral from
  Riemann sums alone, and explain exactly why an antiderivative lets you skip
  all that work.
lessons:
  - node: analysis.svc.def-limit
    hook: >
      Every other idea in this unit is this one wearing a costume — continuity,
      the derivative and the integral are each a limit of something. Get the
      quantifiers right once here and the rest of the course is bookkeeping.
    explanation: >
      Start with the picture. Plot $f$ near $c$ and draw a horizontal band of
      half-width $\varepsilon$ around the height $L$. The claim
      $\lim_{x \to c} f(x) = L$ says: however thin you make that band, there is
      a vertical strip around $c$ narrow enough that the graph stays inside the
      band all the way across the strip. The half-width of the strip is
      $\delta$.

      That is a game, and the order of play is everything. Your opponent moves
      first, naming a tolerance $\varepsilon > 0$; you answer with a
      $\delta > 0$; you win the round if every $x$ with $0 < |x - c| < \delta$
      satisfies $|f(x) - L| < \varepsilon$. The limit is $L$ exactly when you
      can win every round. Because $\varepsilon$ is named first, your $\delta$
      is allowed to depend on it, and it almost always does, shrinking as
      $\varepsilon$ shrinks. Swapping the order states something else entirely,
      which is why the quantifiers are not decoration.

      The strict inequality $0 < |x - c|$ is the second thing to notice. It
      deletes the single point $x = c$, so the definition never reads $f(c)$ at
      all. That is deliberate: you want to compare the value the function
      *points to* with the value it actually takes, and you cannot do that if
      the definition has already used the value. A limit can exist where $f$ is
      undefined, and it can disagree with $f(c)$ where $f$ is defined.

      A limit is unique when it exists, and that proof is the first
      $\varepsilon$-argument worth memorising. If $L \ne L'$ were both limits,
      take $\varepsilon = |L - L'|/2$. Some $\delta$ forces $f(x)$ within
      $\varepsilon$ of $L$, some $\delta'$ forces it within $\varepsilon$ of
      $L'$, and any $x$ with $0 < |x - c| < \min(\delta, \delta')$ obeys both.
      The triangle inequality then gives $|L - L'| < 2\varepsilon = |L - L'|$,
      which is absurd.
    worked: >
      Prove $\lim_{x \to 2} x^2 = 4$ from the definition. The quantity to
      control is $|x^2 - 4| = |x - 2|\,|x + 2|$. The first factor is what
      $\delta$ governs; the second is a nuisance, so bound it first. Agree in
      advance that $\delta \le 1$, which confines $x$ to the interval $(1,3)$
      and hence makes $|x + 2| < 5$. Then $|x^2 - 4| < 5\,|x - 2|$, and
      $5\,|x - 2| < \varepsilon$ as soon as $|x - 2| < \varepsilon/5$. So take
      $\delta = \min(1, \varepsilon/5)$ and both requirements hold at once. Test
      it: $\varepsilon = 0.1$ gives $\delta = 0.02$, and the worst case
      $|x - 2| = 0.02$ gives $|x^2 - 4| < 5(0.02) = 0.1$ as promised. The
      $\min$ is the whole technique: bound the nuisance factor first, then
      spend the rest of the budget on the factor you control.
    pitfalls: >
      Reversing the quantifiers is the standard disaster: one $\delta$ that
      works for one $\varepsilon$ proves nothing, and a single $\delta$ good
      for every $\varepsilon$ at once would force $f$ to be constantly $L$
      near $c$. The second trap is reading
      $f(c)$: for the function equal to $x$ everywhere except at $0$, where it
      equals $5$, the limit at $0$ is $0$, and the definition never so much as
      looks at the $5$. The third is believing $\delta$ must be the largest
      window that works — any working $\delta$ counts, and shrinking one never
      breaks it.
    recap: >
      $\lim_{x \to c} f(x) = L$ is a promise to answer every tolerance
      $\varepsilon$ with a window $\delta$ inside which the graph stays within
      $\varepsilon$ of $L$, with the point $x = c$ itself excluded from the
      deal.
    steps:
      - teach: >
          Plot $f$ near $c$ and draw a horizontal band of half-width
          $\varepsilon$ around the height $L$. Saying that $f(x)$ tends to $L$
          ought to mean that however thin the band, the graph eventually stays
          inside it. The work is in saying *eventually* without hand-waving.
      - teach: >
          Here is the deal in full. $\lim_{x \to c} f(x) = L$ means: for every
          $\varepsilon > 0$ there is a $\delta > 0$ such that every $x$ with
          $0 < |x - c| < \delta$ satisfies $|f(x) - L| < \varepsilon$. Your
          opponent names $\varepsilon$ first; you answer with $\delta$.
      - teach: >
          Take $f(x) = 3x + 1$ at $c = 2$, where the limit ought to be $7$.
          Then $|f(x) - 7| = |3x - 6| = 3\,|x - 2|$, so the demand
          $|f(x) - 7| < \varepsilon$ is literally the demand
          $|x - 2| < \varepsilon/3$. Answering $\delta = \varepsilon/3$ wins
          every round.
      - ask: >
          For $f(x) = 3x + 1$ at $c = 2$ with $L = 7$, your opponent names
          $\varepsilon = 0.03$. What is the largest $\delta$ that works?
        expects: "0.01"
        hint: >
          $|f(x) - 7| = 3\,|x - 2|$. How large may $|x - 2|$ grow before
          $3\,|x - 2|$ reaches $0.03$?
        feedback: >
          $\delta = 0.01$. Because $|f(x) - 7| = 3\,|x - 2|$, the requirement
          $|f(x) - 7| < 0.03$ is exactly $|x - 2| < 0.03/3 = 0.01$. Any smaller
          $\delta$ also works; $0.01$ is simply the largest.
      - teach: >
          For anything but a straight line, $|f(x) - L|$ splits into a factor
          $\delta$ controls and a nuisance factor. With $f(x) = x^2$ at $c = 2$,
          $|x^2 - 4| = |x - 2|\,|x + 2|$. Bound the nuisance first by insisting
          $\delta \le 1$, which gives $|x + 2| < 5$, then take
          $\delta = \min(1, \varepsilon/5)$.
      - ask: >
          Which statement says the same thing as $\lim_{x \to c} f(x) = L$?
        choices:
          - text: >
              There is a $\delta > 0$ such that for every $\varepsilon > 0$,
              every $x$ with $0 < |x - c| < \delta$ has
              $|f(x) - L| < \varepsilon$.
            feedback: >
              The quantifiers are swapped. One fixed $\delta$ meeting *every*
              tolerance forces $f(x) = L$ on the whole punctured window — a far
              stronger claim that almost no function satisfies.
          - text: >
              For every $\varepsilon > 0$ there is a $\delta > 0$ such that
              every $x$ with $0 < |x - c| < \delta$ has
              $|f(x) - L| < \varepsilon$.
            correct: true
            feedback: >
              Challenge then response, in that order: the tolerance comes
              first, and $\delta$ is permitted to depend on it.
          - text: >
              For every $\delta > 0$ there is an $\varepsilon > 0$ such that
              every $x$ with $0 < |x - c| < \delta$ has
              $|f(x) - L| < \varepsilon$.
            feedback: >
              This lets you choose the tolerance after seeing the window, so
              you could always answer with an enormous $\varepsilon$. It holds
              for essentially every bounded function and says nothing.
        feedback: >
          $\varepsilon$ is the challenge and $\delta$ is the response, in that
          order. Reading the definition backwards is the most common error in a
          first analysis course.
      - teach: >
          The condition is $0 < |x - c| < \delta$, not $|x - c| < \delta$
          alone. That strict left inequality deletes the point $x = c$, so the
          value $f(c)$ never enters — the limit records where the function is
          *heading*, not where it *is*.
      - ask: >
          Let $h(x) = x$ for every $x \ne 0$, and let $h(0) = 5$. Which
          statement is true?
        choices:
          - text: >
              $\lim_{x \to 0} h(x) = 5$
            feedback: >
              That is the value $h$ takes at $0$, which the definition
              deliberately ignores. Every $x \ne 0$ near $0$ has $h(x) = x$,
              which is near $0$, not near $5$.
          - text: >
              $\lim_{x \to 0} h(x) = 0$
            correct: true
            feedback: >
              For $0 < |x| < \delta$ we have $|h(x) - 0| = |x| < \delta$, so
              $\delta = \varepsilon$ answers every challenge. The lone value
              $h(0) = 5$ is never tested.
          - text: >
              The limit does not exist, because $h$ jumps at $0$.
            feedback: >
              Existence of the limit and agreement with $h(0)$ are separate
              questions. The limit exists and equals $0$; it simply disagrees
              with the value there.
        feedback: >
          A limit reads punctured neighborhoods only, so redefining $f$ at the
          single point $c$ cannot change it.
      - teach: >
          Everything left in this unit is this definition applied to a cleverly
          chosen function: continuity compares the limit against $f(c)$, the
          derivative takes the limit of difference quotients, and the integral
          takes a limit of rectangle sums.

  - node: analysis.svc.def-continuity
    hook: >
      Continuity is the hypothesis that makes the two great existence theorems
      of this unit true, and it is the one word separating functions you can
      reason about from functions that jump out from under you.
    explanation: >
      The limit at $c$ was built to ignore $f(c)$. Continuity is the demand
      that the ignored value is the right one anyway: $f$ is continuous at $c$
      when $\lim_{x \to c} f(x)$ exists *and* equals $f(c)$. Three things must
      hold — $f(c)$ is defined, the limit exists, and the two numbers agree —
      and each can fail on its own.

      Unwind it and you get the $\varepsilon$–$\delta$ statement with $L$
      replaced by $f(c)$: for every $\varepsilon > 0$ there is a $\delta > 0$
      with $|f(x) - f(c)| < \varepsilon$ whenever $|x - c| < \delta$. The
      puncture has quietly vanished, and it costs nothing to drop it, because
      at $x = c$ the inequality reads $0 < \varepsilon$, which is free.

      Two ways to fail are worth holding in mind. A *removable* failure: the
      function equal to $\dfrac{x^2 - 4}{x - 2}$ for $x \ne 2$ has limit $4$ at
      $2$, so a single well-chosen value at $2$ repairs it. A *jump*: the
      function equal to $-1$ for $x < 0$ and $1$ for $x \ge 0$ has no limit at
      $0$ at all, since values on either side stay a distance $2$ apart, and no
      choice of value at $0$ can help. Nothing repairs a jump.

      Continuity on a set means continuity at each of its points, and the
      definition already handles endpoints correctly without a special rule.
      The quantifier ranges over $x$ *in the domain of $f$*, so for $f$ defined
      on $[0,1]$ there simply are no points to the left of $0$ to test, and
      continuity at $0$ becomes a one-sided condition automatically. This is
      also why the popular slogan "you can draw it without lifting your pen"
      should be treated as a picture and never as a definition: $f(x) = 1/x$ is
      continuous at every point of its domain, and no pen draws it in one
      stroke.
    worked: >
      Let $f(x) = \dfrac{x^2 - 4}{x - 2}$ for $x \ne 2$, with $f(2) = 4$, and
      check continuity at $2$ against the definition. For $x \ne 2$ the
      numerator factors as $(x - 2)(x + 2)$ and the quotient is exactly
      $x + 2$, so $|f(x) - 4| = |x + 2 - 4| = |x - 2|$. Given $\varepsilon > 0$
      take $\delta = \varepsilon$: every $x$ with $|x - 2| < \delta$ and
      $x \ne 2$ has $|f(x) - 4| = |x - 2| < \varepsilon$, and the remaining
      point $x = 2$ gives $|f(2) - 4| = 0 < \varepsilon$. All three conditions
      hold, so $f$ is continuous at $2$. Change the definition to $f(2) = 5$
      and the limit is still $4$ while the value is $5$: the limit exists, the
      value exists, and they disagree, so continuity fails at that one point.
    pitfalls: >
      A function is never discontinuous at a point outside its domain — $1/x$
      is continuous everywhere it is defined, and "discontinuous at $0$" is not
      a claim about it. Existence of the limit is not enough on its own; the
      limit must equal the value, which is exactly what the removable case
      shows. And the pen-and-paper slogan misleads in both directions: it calls
      $1/x$ discontinuous, and it offers no verdict at all on a function
      defined by a formula you cannot draw.
    recap: >
      $f$ is continuous at $c$ when the value it takes there is precisely the
      value its neighbours point to, so the limit and the function agree and
      the puncture in the limit definition stops mattering.
    steps:
      - teach: >
          The limit at $c$ was designed to ignore $f(c)$, which leaves an
          obvious question open: does the function actually take the value its
          neighbours point to? When the answer is yes, $f$ is continuous at
          $c$.
      - teach: >
          Precisely: $f$ is continuous at $c$ when $\lim_{x \to c} f(x)$ exists
          and equals $f(c)$. Three conditions in one line — the value is
          defined, the limit exists, and they are the same number.
      - teach: >
          Unwound, this is the $\varepsilon$–$\delta$ definition with $L$
          replaced by $f(c)$, and with the puncture dropped: for every
          $\varepsilon > 0$ some $\delta > 0$ makes
          $|f(x) - f(c)| < \varepsilon$ whenever $|x - c| < \delta$. Dropping
          the puncture is free, since $x = c$ gives $0 < \varepsilon$.
      - ask: >
          Let $g(x) = \dfrac{x^2 - 4}{x - 2}$ for $x \ne 2$. What value must be
          assigned to $g(2)$ to make $g$ continuous at $2$?
        expects: "4"
        hint: >
          Factor the numerator and cancel — legally, because the limit never
          evaluates at $x = 2$.
        feedback: >
          $4$. For $x \ne 2$, $\dfrac{x^2-4}{x-2} = \dfrac{(x-2)(x+2)}{x-2}
          = x + 2$, whose limit at $2$ is $4$. Continuity demands
          $g(2) = \lim_{x \to 2} g(x) = 4$, and any other value leaves a
          function whose limit and value disagree.
      - teach: >
          That was a *removable* failure — one badly chosen value, repairable
          by one good one. A jump is different: the function equal to $-1$ for
          $x < 0$ and $1$ for $x \ge 0$ has no limit at $0$, because values on
          the two sides stay a distance $2$ apart no matter how small the
          window. No assignment at $0$ repairs it.
      - ask: >
          For which of these does continuity fail at $c = 1$?
        choices:
          - text: >
              $f(x) = \dfrac{1}{x - 1}$, on its natural domain of all
              $x \ne 1$.
            feedback: >
              $1$ is not in the domain, so there is nothing to be continuous
              or discontinuous at. At every point where this function is
              defined, it is continuous.
          - text: >
              $f(x) = x + 3$ for $x \ne 1$, with $f(1) = 4$.
            feedback: >
              The limit at $1$ is $4$ and the value at $1$ is $4$. They agree,
              so $f$ is continuous there — the formula being written in two
              pieces changes nothing.
          - text: >
              $f(x) = x + 3$ for $x \ne 1$, with $f(1) = 9$.
            correct: true
            feedback: >
              The limit at $1$ is $4$ but the value is $9$. Both exist and they
              disagree, which is exactly the failure continuity forbids.
        feedback: >
          Continuity needs all three conditions. A missing point is not a
          discontinuity, a matching value is not a discontinuity, and only a
          genuine disagreement between limit and value is.
      - teach: >
          On a set, $f$ is continuous when it is continuous at every point. The
          quantifier ranges over $x$ in the domain, so for $f$ on $[0,1]$ there
          are no points left of $0$ to test and continuity at the endpoint is
          one-sided automatically — no special rule required.
      - ask: >
          Why is "you can draw the graph without lifting your pen" a bad
          definition of continuity?
        choices:
          - text: >
              Because it is only true for functions defined on an interval.
            feedback: >
              Restricting to an interval does not save it. Even on an interval
              the slogan is about a picture, and plenty of continuous functions
              cannot be drawn by hand at all.
          - text: >
              Because it declares $f(x) = 1/x$ discontinuous, though $1/x$ is
              continuous at every point of its domain.
            correct: true
            feedback: >
              The pen has to jump the gap at $0$, but $0$ is not in the domain
              and no point of the domain fails the $\varepsilon$–$\delta$ test.
              Continuity is a statement made point by point, about the domain
              only.
          - text: >
              Because continuity is about limits, and limits have nothing to do
              with graphs.
            feedback: >
              Limits have a great deal to do with graphs — the band-and-strip
              picture is exactly a graph. The trouble with the slogan is that
              it reports on gaps in the *domain* as though they were failures
              of the function.
        feedback: >
          The slogan is a useful picture on a single interval and a false
          definition everywhere else, because continuity is checked one domain
          point at a time.
      - teach: >
          Two theorems in this unit take continuity on a closed bounded
          interval as their only hypothesis and return something you could not
          otherwise get: a maximum that is actually attained, and every
          intermediate value actually hit.

  - node: analysis.svc.evt
    hook: >
      Optimization only makes sense if a maximum exists at all, and the
      Extreme Value Theorem is the guarantee. It is also the engine inside
      Rolle's Theorem, hence inside every mean-value argument in this unit.
    explanation: >
      The gap this theorem closes is the gap between a supremum and a maximum.
      For $f(x) = x$ on $[0,1)$ the set of values has supremum $1$, yet no
      input produces $1$: the function approaches its bound forever and never
      arrives. The Extreme Value Theorem says that on a closed bounded
      interval, a continuous function always arrives.

      Both hypotheses carry weight, and each fails in a different way. Drop
      closedness and $f(x) = 1/x$ on $(0,1]$ is continuous but not even
      bounded. Drop boundedness and $f(x) = x$ on $[0,\infty)$ is continuous
      and unbounded again. Neither hypothesis is decoration.

      Boundedness is where completeness enters. Let $S$ be the set of
      $x \in [a,b]$ for which $f$ is bounded on $[a,x]$. It contains $a$ and
      lies inside $[a,b]$, so by the Completeness axiom of $\mathbb{R}$ it has
      a supremum $s$. Continuity at $s$ hands you a window around $s$ on which
      $f$ stays within $1$ of $f(s)$; gluing that window onto a bound for
      $[a, x]$ with $x$ just below $s$ shows $s \in S$, and shows $S$ reaches
      past $s$ unless $s = b$. So $s = b$ and $f$ is bounded on $[a,b]$.

      Attainment then falls out by a trick worth remembering. The value set is
      nonempty and bounded above, so it has a supremum $M$. Suppose $f$ never
      equals $M$. Then $M - f(x) > 0$ for every $x$, so
      $g(x) = \dfrac{1}{M - f(x)}$ is continuous on $[a,b]$ — a quotient whose
      denominator never vanishes — and by the boundedness just proved,
      $g(x) \le K$ for some $K > 0$. Unwinding gives $f(x) \le M - 1/K$ for
      every $x$, an upper bound *strictly smaller* than $M$. That contradicts
      $M$ being the least upper bound, so $f(q) = M$ for some $q \in [a,b]$.
      Applying the same argument to $-f$ produces the minimum.
    worked: >
      Take $f(x) = x^2 - 4x + 1$ on $[0,3]$. It is a polynomial, hence
      continuous, and $[0,3]$ is closed and bounded, so both bounds must be
      attained. Complete the square: $f(x) = (x - 2)^2 - 3$. The square is
      never negative and equals $0$ exactly at $x = 2$, which lies in $[0,3]$,
      so the minimum value is $-3$, attained at $q = 2$. For the maximum,
      $(x-2)^2$ is largest at whichever endpoint is farthest from $2$: at
      $x = 0$ it is $4$ and at $x = 3$ it is $1$, so the maximum value is
      $4 - 3 = 1$, attained at $p = 0$. Both are genuinely reached. Now delete
      one endpoint and work on $(0,3]$ instead: the values still have supremum
      $1$, since $f(x)$ climbs toward $1$ as $x$ decreases toward $0$, but
      $f(x) < 1$ at every point of $(0,3]$. The supremum survives; the maximum
      does not.
    pitfalls: >
      The theorem needs *both* closed and bounded, and neither alone suffices —
      $1/x$ on $(0,1]$ and $x$ on $[0,\infty)$ are the two counterexamples to
      keep in your pocket. Having a supremum is not the same as having a
      maximum: completeness gives the supremum for free, and the whole content
      of this theorem is that continuity plus a closed bounded interval turns
      it into a value. And the theorem locates nothing — it promises that some
      $p$ and $q$ exist, not that they are interior, not that they are unique,
      and not that they sit where a derivative vanishes.
    recap: >
      A continuous function on a closed bounded interval is bounded and
      actually attains its supremum and infimum, so "the maximum of $f$ on
      $[a,b]$" always names a real value at a real point.
    steps:
      - teach: >
          A bounded set of values always has a supremum — that is completeness
          — but the supremum need not be one of the values. On $[0,1)$ the
          function $f(x) = x$ has supremum $1$ and reaches it nowhere.
      - teach: >
          The Extreme Value Theorem closes exactly that gap. If
          $f : [a,b] \to \mathbb{R}$ is continuous on a closed bounded
          interval, then $f$ is bounded and there are points $p$ and $q$ in
          $[a,b]$ with $f(p) \le f(x) \le f(q)$ for every $x$.
      - teach: >
          Take $f(x) = x^2 - 4x + 1 = (x - 2)^2 - 3$ on $[0,3]$. It is
          continuous and the interval is closed and bounded, so the theorem
          promises both bounds are hit — and indeed the square is $0$ at
          $x = 2$ and largest at the endpoint $x = 0$.
      - ask: >
          What is the minimum value of $f(x) = x^2 - 4x + 1$ on $[0,3]$?
        expects: "-3"
        hint: >
          Complete the square, then ask where the resulting square is smallest
          on this interval.
        feedback: >
          $-3$. Writing $f(x) = (x-2)^2 - 3$, the square is never negative and
          is $0$ exactly at $x = 2$, which lies in $[0,3]$. So the smallest
          value is $0 - 3 = -3$, attained at $x = 2$ — a genuine minimum, not
          merely an infimum.
      - teach: >
          Here is the load-bearing step. Let $M$ be the supremum of the values,
          which exists by completeness, and suppose $f$ never equals $M$. Then
          $M - f(x) > 0$ everywhere, so $g = \dfrac{1}{M - f}$ is continuous on
          $[a,b]$ and therefore bounded, say $g \le K$.
      - teach: >
          Unwind $g \le K$: it says $f(x) \le M - 1/K$ for every $x$. That is
          an upper bound strictly below $M$, contradicting the leastness of the
          supremum. So $f$ must equal $M$ somewhere, and applying the same
          argument to $-f$ delivers the minimum.
      - ask: >
          $f(x) = 1/x$ is continuous on $(0,1]$ yet has no maximum there. Which
          hypothesis of the Extreme Value Theorem fails?
        choices:
          - text: >
              Continuity — $1/x$ blows up near $0$.
            feedback: >
              $1/x$ is continuous at every point of $(0,1]$. Blowing up near a
              point *outside* the domain is not a failure of continuity on the
              domain.
          - text: >
              The interval is not closed — it is missing its left endpoint.
            correct: true
            feedback: >
              $(0,1]$ is bounded but not closed, and that single missing point
              is enough: the function runs off to infinity as $x$ approaches
              the absent endpoint.
          - text: >
              The interval is not bounded.
            feedback: >
              $(0,1]$ sits inside $[0,1]$, so it is perfectly bounded. It is
              the *function*, not the interval, that is unbounded here — and
              the reason is the missing endpoint.
        feedback: >
          Closed and bounded are separate demands. $(0,1]$ fails closedness,
          while $[0,\infty)$ is the standard example failing boundedness, where
          $f(x) = x$ has no maximum.
      - ask: >
          What does the Extreme Value Theorem tell you about *where* the
          maximum of a continuous $f$ on $[a,b]$ occurs?
        choices:
          - text: >
              That it occurs at an interior point.
            feedback: >
              On $f(x) = (x-2)^2 - 3$ over $[0,3]$ the maximum sits at the
              endpoint $x = 0$. The theorem permits endpoints and often
              delivers them.
          - text: >
              That it occurs where the derivative is zero.
            feedback: >
              The theorem does not mention derivatives, and $f$ need not have
              one. Locating extrema by derivatives is a separate argument with
              its own hypotheses.
          - text: >
              Nothing at all — it asserts only that some point attains it.
            correct: true
            feedback: >
              It is a pure existence statement. It hands you a $q$ with
              $f(x) \le f(q)$ everywhere and says nothing about where $q$ is or
              whether it is unique.
        feedback: >
          Existence first, location later. Turning this promise into a way of
          *finding* extrema is the job of Rolle's Theorem and the Mean Value
          Theorem.
      - teach: >
          That existence claim is the whole reason Rolle's Theorem works: it
          needs an interior extremum to exist before it can say anything about
          the derivative there.

  - node: analysis.svc.ivt
    hook: >
      Every root-finding argument you will ever write starts here: if a
      continuous function is negative somewhere and positive somewhere else, it
      is zero in between, and completeness is what makes that true.
    explanation: >
      Picture the graph as a curve joining the point $(a, f(a))$ to
      $(b, f(b))$, and picture a horizontal line at some height $y$ strictly
      between those two values. The Intermediate Value Theorem says the curve
      cannot get from one side of that line to the other without touching it.
      Continuity is the whole hypothesis: the function equal to $-1$ for
      $x < 0$ and $1$ for $x \ge 0$ runs from $-1$ to $1$ on $[-1,1]$ and skips
      the value $0$ entirely.

      The proof is a supremum argument, and it is worth following once because
      the same move reappears whenever you want to produce a specific point out
      of thin air. Suppose $f(a) < y < f(b)$ and let
      $S = \{x \in [a,b] : f(x) < y\}$. It contains $a$, and $b$ bounds it
      above, so completeness gives $c = \sup S$.

      Now rule out both ways $f(c)$ could miss $y$. If $f(c) < y$, continuity
      with $\varepsilon = y - f(c)$ produces a window around $c$ on which $f$
      stays below $y$; since $f(b) > y$ we have $c < b$, so that window
      contains points to the right of $c$ that belong to $S$ — contradicting
      that $c$ is an upper bound. If instead $f(c) > y$, continuity with
      $\varepsilon = f(c) - y$ produces a window on which $f$ stays above $y$,
      so no point of that window is in $S$ and something strictly less than $c$
      already bounds $S$ — contradicting leastness. Only $f(c) = y$ survives.

      The standard restatement is that the continuous image of an interval is
      an interval: if a continuous function takes two values, it takes every
      value between them, which is exactly what "is an interval" means. The
      practical payoff is bracketing. Find one input where $f$ is negative and
      one where it is positive, and you have trapped a root — then halve the
      bracket repeatedly and the trap tightens as far as you like.
    worked: >
      Locate a root of $f(x) = x^3 - 2x - 5$. It is a polynomial, hence
      continuous everywhere. Evaluate at two convenient points:
      $f(2) = 8 - 4 - 5 = -1$ and $f(3) = 27 - 6 - 5 = 16$. Since $0$ lies
      strictly between $-1$ and $16$, the theorem gives a $c \in (2,3)$ with
      $f(c) = 0$. Now bisect. The midpoint gives
      $f(2.5) = 15.625 - 5 - 5 = 5.625 > 0$, so the root lies in $(2, 2.5)$.
      Next, $f(2.25) = 11.390625 - 4.5 - 5 = 1.890625 > 0$, so the root lies in
      $(2, 2.25)$. Then $f(2.1) = 9.261 - 4.2 - 5 = 0.061 > 0$, narrowing to
      $(2, 2.1)$, and $f(2.05) = 8.615125 - 4.1 - 5 = -0.484875 < 0$, narrowing
      to $(2.05, 2.1)$. Four evaluations have pinned the root to a window of
      width $0.05$, and it is $c \approx 2.09$.
    pitfalls: >
      The theorem gives existence, never uniqueness or count — a continuous
      function may cross the level $y$ once, seventeen times, or on a whole
      subinterval. Its converse is false: the function equal to
      $\sin(1/x)$ for $x \ne 0$ and $0$ at $0$ takes every intermediate value
      on $[-1,1]$ and is nonetheless discontinuous at $0$, so the intermediate
      value property does not imply continuity. And continuity is needed on the
      *whole* closed interval: a single jump anywhere between $a$ and $b$ is
      enough to let the function step over $y$.
    recap: >
      A continuous function on $[a,b]$ takes every value between $f(a)$ and
      $f(b)$, which turns "the sign changed" into "there is a root".
    steps:
      - teach: >
          Draw a continuous graph from $(a, f(a))$ to $(b, f(b))$ and a
          horizontal line at a height $y$ between those two values. Getting
          from below the line to above it without touching it looks impossible
          — and the Intermediate Value Theorem says it is.
      - teach: >
          Precisely: if $f$ is continuous on $[a,b]$ and $y$ lies between
          $f(a)$ and $f(b)$, then $f(c) = y$ for some $c \in [a,b]$, and $c$
          can be taken strictly inside when $y$ is strictly between. Continuity
          is doing all the work: the function equal to $-1$ for $x < 0$ and $1$
          for $x \ge 0$ skips the value $0$ on $[-1,1]$.
      - teach: >
          Take $f(x) = x^3 - 2x - 5$, a polynomial and so continuous.
          $f(2) = -1$ and $f(3) = 16$, and $0$ lies between them, so $f$ has a
          root somewhere in the open interval $(2,3)$ — found without solving
          anything.
      - ask: >
          Bisecting that bracket, what is $f(2.5)$ for $f(x) = x^3 - 2x - 5$?
        expects: "5.625"
        hint: >
          $2.5^3 = 15.625$.
        feedback: >
          $f(2.5) = 15.625 - 5 - 5 = 5.625$. It is positive, so the sign change
          now sits between $2$ and $2.5$ and the bracket has halved. Repeating
          gives $f(2.25) > 0$, then $f(2.1) > 0$, then $f(2.05) < 0$: the root
          is near $2.09$.
      - teach: >
          Here is why it is true. With $f(a) < y < f(b)$, let $S$ be the set of
          $x$ in $[a,b]$ with $f(x) < y$. It contains $a$ and is bounded above
          by $b$, so completeness produces $c = \sup S$. The claim is that this
          $c$ is the point you want.
      - teach: >
          Both misses are impossible. If $f(c) < y$, continuity keeps $f$ below
          $y$ on a window around $c$, so points just right of $c$ lie in $S$
          and $c$ was no upper bound. If $f(c) > y$, continuity keeps $f$ above
          $y$ nearby, so something below $c$ already bounds $S$ and $c$ was not
          least. Hence $f(c) = y$.
      - ask: >
          A continuous $f$ has $f(0) = -3$ and $f(4) = 7$. What may you
          conclude?
        choices:
          - text: >
              $f$ has exactly one root in $(0,4)$.
            feedback: >
              Exactly one is more than the theorem gives. The function could
              cross zero three times, or five, or be zero along a whole
              subinterval; only *at least one* is guaranteed.
          - text: >
              $f$ has at least one root in $(0,4)$.
            correct: true
            feedback: >
              $0$ lies strictly between $-3$ and $7$, so some $c$ in the open
              interval has $f(c) = 0$. Existence is the entire claim.
          - text: >
              $f$ is increasing somewhere on $(0,4)$.
            feedback: >
              The values do rise overall, but the theorem says nothing about
              monotonicity or rates — it is about which *values* are taken, not
              how the function moves between them.
        feedback: >
          A sign change plus continuity gives a root, and gives nothing more:
          not uniqueness, not a count, not a location beyond the bracket.
      - ask: >
          Does the intermediate value property imply continuity?
        choices:
          - text: >
              Yes — taking every intermediate value is what continuity means.
            feedback: >
              Continuity is an $\varepsilon$–$\delta$ statement at each point,
              not a statement about the set of values. The two happen to be
              equivalent for monotone functions, which is where this intuition
              comes from.
          - text: >
              No — the function equal to $\sin(1/x)$ for $x \ne 0$ and $0$ at
              $0$ hits every intermediate value yet jumps at $0$.
            correct: true
            feedback: >
              It oscillates through every value between $-1$ and $1$ in any
              window around $0$, so no value is skipped, but the limit at $0$
              does not exist and continuity fails there.
          - text: >
              No — because the intermediate value property is only defined on
              closed intervals.
            feedback: >
              The property makes sense on any interval. The reason the
              implication fails is that a function can hit every value while
              still oscillating wildly enough to have no limit.
        feedback: >
          The implication runs one way only: continuity gives the intermediate
          value property, and no converse holds.
      - teach: >
          Keep the pair straight. The Extreme Value Theorem says a continuous
          function on a closed bounded interval reaches its highest and lowest
          values; the Intermediate Value Theorem says it reaches everything in
          between. Together they say the image of $[a,b]$ is exactly a closed
          bounded interval.

  - node: analysis.svc.def-derivative
    hook: >
      Speed at an instant sounds like a contradiction — speed is distance over
      time and an instant has no duration. The derivative is the resolution,
      and it is the reason limits were worth defining so carefully.
    explanation: >
      Fix $c$ and pick a nearby point $c + h$. The quotient
      $\dfrac{f(c+h) - f(c)}{h}$ is the slope of the straight line through the
      two points on the graph — the *secant* — and it is an honest average rate
      of change over a window of width $h$. As $h$ shrinks the secant pivots
      about $(c, f(c))$, and the derivative is what its slope settles on:
      $f'(c) = \lim_{h \to 0} \dfrac{f(c+h) - f(c)}{h}$, provided that limit
      exists as a finite number.

      Setting $h = 0$ is exactly what you may not do — the quotient becomes
      $0/0$. This is where the puncture in the limit definition earns its
      keep: the limit examines only $h \ne 0$, so every algebraic
      simplification you perform, including cancelling a factor of $h$, is
      legal throughout the region the limit looks at. The alternative form
      $f'(c) = \lim_{x \to c} \dfrac{f(x) - f(c)}{x - c}$ is the same
      statement after the substitution $x = c + h$.

      One computation from the definition does all polynomials at once. For
      $f(x) = x^n$ with $n$ a positive integer, use the factorization
      $x^n - c^n = (x - c)(x^{n-1} + x^{n-2}c + \cdots + c^{n-1})$, which you
      can verify by expanding: everything cancels in pairs. Dividing by
      $x - c$, legal since $x \ne c$, leaves a sum of $n$ terms, each tending
      to $c^{n-1}$ as $x \to c$. So $f'(c) = n\,c^{n-1}$. In particular the
      derivative of $x^2$ is $2x$ and the derivative of $x^3$ is $3x^2$, both
      earned from the definition rather than assumed.

      When $f$ is differentiable at every point of an open set, $f'$ becomes a
      function on that set in its own right, and can be differentiated again.
      The definition also demands that $f$ be defined on a full neighborhood of
      $c$, both sides included, because the limit tests $x$ on the left of $c$
      as well as the right.
    worked: >
      Differentiate $f(x) = 1/x$ at $c = 2$ from the definition. Form the
      difference quotient and clear the compound fraction:
      $\dfrac{f(2+h) - f(2)}{h}
      = \dfrac{1}{h}\left(\dfrac{1}{2+h} - \dfrac{1}{2}\right)
      = \dfrac{1}{h}\cdot\dfrac{2 - (2+h)}{2(2+h)}
      = \dfrac{-h}{2h(2+h)}$.
      For every $h \ne 0$ — and the limit looks at nothing else — this
      simplifies to $\dfrac{-1}{2(2+h)}$. As $h \to 0$ the denominator tends to
      $4$, so $f'(2) = -\dfrac{1}{4}$. Sanity-check the sign and size against
      the picture: $1/x$ is decreasing, so a negative slope is right, and it is
      a gentle decrease near $x = 2$, consistent with a slope of only
      $-0.25$.
    pitfalls: >
      Cancelling the $h$ is not sloppiness to be apologised for — it is valid
      precisely because the limit never evaluates at $h = 0$, and saying so is
      part of the proof. The limit must be *finite*: for $f(x) = x^{1/3}$ at
      $c = 0$ the difference quotient is $h^{-2/3}$, which grows without bound,
      so $f$ is not differentiable at $0$ even though the graph has a perfectly
      good vertical tangent there. And a one-sided limit is not enough: $f$
      must be defined and behave on both sides of $c$, which is why
      differentiability is stated on open sets.
    recap: >
      The derivative at $c$ is the limit of secant slopes over shrinking
      windows, and it exists exactly when those average rates of change settle
      on a single finite number.
    steps:
      - teach: >
          An average rate of change is easy: over a window of width $h$
          starting at $c$, it is $\dfrac{f(c+h) - f(c)}{h}$, the slope of the
          line through the two points on the graph. An *instantaneous* rate is
          the puzzle, because at a single point that formula reads $0/0$.
      - teach: >
          The fix is a limit rather than a substitution. Define
          $f'(c) = \lim_{h \to 0} \dfrac{f(c+h) - f(c)}{h}$ when that limit
          exists as a finite number. The limit examines only $h \ne 0$, so the
          division was always legitimate.
      - teach: >
          Try $f(x) = x^2$ at a general $c$. The quotient is
          $\dfrac{(c+h)^2 - c^2}{h} = \dfrac{2ch + h^2}{h} = 2c + h$ for every
          $h \ne 0$, and as $h \to 0$ that tends to $2c$. So the derivative of
          $x^2$ is $2x$, computed from nothing but the definition.
      - ask: >
          Using the definition, what is $f'(3)$ for $f(x) = x^2$?
        expects: "6"
        hint: >
          The quotient simplifies to $2c + h$ before you take the limit.
        feedback: >
          $6$. The difference quotient at $c = 3$ is
          $\dfrac{(3+h)^2 - 9}{h} = \dfrac{6h + h^2}{h} = 6 + h$ for $h \ne 0$,
          and its limit as $h \to 0$ is $6$.
      - ask: >
          Why is it legitimate to cancel the $h$ in
          $\dfrac{2ch + h^2}{h} = 2c + h$?
        choices:
          - text: >
              Because $h$ is very small, so the error introduced is negligible.
            feedback: >
              No error is introduced at all — the two expressions are equal for
              every $h \ne 0$. Talking about negligible errors here hides an
              exact identity behind an approximation.
          - text: >
              Because the limit examines only $h \ne 0$, where the two
              expressions are equal.
            correct: true
            feedback: >
              The definition of the limit deletes the point $h = 0$, so any
              identity holding for all $h \ne 0$ may be used freely. This is
              exactly what the puncture was for.
          - text: >
              Because we define $0/0$ to be $2c$ in this situation.
            feedback: >
              Nothing is being defined. $0/0$ is never assigned a value; the
              limit sidesteps the point entirely rather than filling it in.
        feedback: >
          Cancellation is an identity on the punctured window, and the limit
          looks nowhere else — which is why the derivative is a limit and not
          an evaluation.
      - teach: >
          One computation covers every power. From
          $x^n - c^n = (x - c)(x^{n-1} + x^{n-2}c + \cdots + c^{n-1})$,
          dividing by $x - c$ leaves $n$ terms each tending to $c^{n-1}$, so
          the derivative of $x^n$ is $n\,x^{n-1}$. In particular $x^3$ has
          derivative $3x^2$.
      - ask: >
          Using that result, what is $f'(2)$ for $f(x) = x^3$?
        expects: "12"
        hint: >
          The derivative of $x^3$ is $3x^2$.
        feedback: >
          $12$. The derivative of $x^3$ is $3x^2$, so $f'(2) = 3(2)^2 = 12$.
          Checking against the definition:
          $\dfrac{(2+h)^3 - 8}{h} = 12 + 6h + h^2$ for $h \ne 0$, which tends
          to $12$.
      - teach: >
          Existence is a real condition, not a formality. For
          $f(x) = x^{1/3}$ at $c = 0$ the difference quotient is $h^{-2/3}$,
          which grows past every bound, so no finite limit exists and $f$ is
          not differentiable there — the vertical tangent in the picture is
          precisely the failure.
      - teach: >
          When $f'$ exists at every point of an open set it is a function on
          that set, ready to be differentiated again or fed into a theorem. The
          next idea reads the same definition backwards: the derivative is the
          slope of the best straight-line approximation to $f$ near $c$.

  - node: analysis.svc.intuition-linearization
    hook: >
      Zoom far enough into the graph of a differentiable function and it looks
      like a straight line. That is not a happy accident about pictures — it is
      an exact restatement of what the derivative is, and it is why derivatives
      are the right tool for approximation and optimization.
    explanation: >
      Every line through the point $(c, f(c))$ has the form
      $y = f(c) + m(x - c)$; only the slope $m$ is up for grabs. Ask which
      choice of $m$ approximates $f$ best near $c$, and measure the damage with
      the error $r(h) = f(c + h) - f(c) - mh$. Every line does well in the
      crudest sense — if $f$ is continuous then $r(h) \to 0$ for any $m$
      whatsoever — so that test cannot pick a winner.

      The right test is to compare the error against $h$ itself. Divide:
      $\dfrac{r(h)}{h} = \dfrac{f(c+h) - f(c)}{h} - m$. That single line is the
      whole idea. The left side tends to $0$ exactly when the difference
      quotient tends to $m$, which is exactly the statement that $f$ is
      differentiable at $c$ with $f'(c) = m$. So differentiability is not
      merely *related* to having a good linear approximation; the two are the
      same sentence written twice.

      Only one slope passes the test, which is what makes the tangent line
      $y = f(c) + f'(c)(x - c)$ *the* tangent rather than *a* good line. Pick
      any other $m$ and $r(h)/h$ tends to $f'(c) - m \ne 0$, so the error stays
      proportional to $h$ instead of shrinking faster than it. The tangent's
      error is small *compared to the step you took*, and that is the sense in
      which zooming makes the graph look straight: halve the window and the
      visible gap between curve and line shrinks by more than half, until at
      screen resolution there is no gap left.

      Two payoffs follow immediately. For estimation, $f(c + h) \approx f(c) +
      f'(c)h$ comes with a guarantee about how the error behaves as $h$
      shrinks, not just a hope. For optimization, at an interior maximum the
      term $f'(c)h$ would push the value up on one side or the other unless
      $f'(c) = 0$ — which is precisely the argument Rolle's Theorem runs.
    worked: >
      Take $f(x) = x^2$ at $c = 3$, where $f(3) = 9$ and $f'(3) = 6$. The
      tangent line is $y = 9 + 6(x - 3)$. Compute the error exactly:
      $f(3 + h) = 9 + 6h + h^2$, so $r(h) = h^2$ and $r(h)/h = h$, which indeed
      tends to $0$. Put numbers on it. At $h = 0.1$ the linear estimate is
      $9 + 6(0.1) = 9.6$ while the true value is $9.61$, an error of $0.01$. At
      $h = 0.01$ the estimate is $9.06$ against a true $9.0601$, an error of
      $0.0001$. Shrinking the step by a factor of $10$ shrank the error by
      $100$. Now sabotage the slope and take $m = 5$ instead:
      $r(h) = f(3+h) - 9 - 5h = h + h^2$, so $r(h)/h = 1 + h$, which tends to
      $1$, not $0$. At $h = 0.01$ that line is off by $0.0101$ — a hundred
      times worse than the tangent, and the gap widens as you zoom.
    pitfalls: >
      Demanding only $r(h) \to 0$ picks out nothing: that is just continuity,
      and every line through the point satisfies it. The condition is
      $r(h)/h \to 0$, error negligible *relative to* the step. The
      approximation is also strictly local — the tangent to $x^2$ at $3$
      estimates $f(10)$ as $51$ against a true $100$, and no amount of
      differentiability at $3$ makes that better. And "looks straight when you
      zoom" never names a fixed window: the window that achieves a given
      tolerance depends on the tolerance, exactly as $\delta$ depends on
      $\varepsilon$.
    recap: >
      $f$ is differentiable at $c$ with slope $m$ precisely when
      $f(c+h) = f(c) + mh + r(h)$ with $r(h)/h \to 0$, so the derivative is the
      slope of the unique line whose error is negligible compared to the step.
    steps:
      - teach: >
          Among all lines through $(c, f(c))$, one ought to deserve the name
          tangent. Every such line has the form $y = f(c) + m(x - c)$, so the
          question is which slope $m$ approximates $f$ best near $c$.
      - teach: >
          Measure the damage: let $r(h) = f(c+h) - f(c) - mh$ be the error at
          step $h$. If $f$ is continuous then $r(h) \to 0$ for *every* $m$, so
          that test declares all lines equally good and picks no winner.
      - teach: >
          Compare the error to the step instead. Dividing gives
          $\dfrac{r(h)}{h} = \dfrac{f(c+h) - f(c)}{h} - m$, so $r(h)/h \to 0$
          holds exactly when the difference quotient tends to $m$ — that is,
          exactly when $f'(c) = m$.
      - ask: >
          For $f(x) = x^2$ at $c = 3$, the tangent line is $y = 9 + 6(x - 3)$.
          What value does it predict at $x = 3.1$?
        expects: "9.6"
        hint: >
          Here $h = 0.1$, and the prediction is $f(3) + f'(3)h$.
        feedback: >
          $9.6$, since $9 + 6(0.1) = 9.6$. The true value is
          $3.1^2 = 9.61$, so the error is $0.01 = h^2$ — and at $h = 0.01$ the
          error drops to $0.0001$, shrinking a hundredfold when the step
          shrinks tenfold.
      - teach: >
          That quadratic error is exactly what $r(h)/h \to 0$ predicts. Here
          $f(3+h) = 9 + 6h + h^2$, so $r(h) = h^2$ and $r(h)/h = h$, which
          tends to $0$. The error is negligible *compared to the step*, not
          merely small.
      - ask: >
          Still with $f(x) = x^2$ at $c = 3$, use the line of slope $m = 5$
          instead. What happens to $r(h)/h$?
        choices:
          - text: >
              It still tends to $0$, just more slowly.
            feedback: >
              It does not tend to $0$ at all. With $m = 5$,
              $r(h) = h + h^2$, so $r(h)/h = 1 + h$, which tends to $1$.
          - text: >
              It tends to $1$, so the error stays proportional to the step.
            correct: true
            feedback: >
              $r(h) = f(3+h) - 9 - 5h = h + h^2$, so $r(h)/h = 1 + h \to 1$.
              Halving the step only halves the error, while the tangent's error
              quarters — which is why only $m = 6$ earns the name.
          - text: >
              It tends to $\infty$, since the wrong slope makes the error blow
              up.
            feedback: >
              The error itself still goes to $0$; it is the *ratio* that fails
              to. A wrong slope gives an error proportional to $h$, not one
              that explodes.
        feedback: >
          Exactly one slope makes the error negligible relative to the step,
          and that slope is $f'(c)$. This uniqueness is what makes the tangent
          line well defined.
      - ask: >
          Why is $r(h) \to 0$ the wrong condition to use for "best linear
          approximation"?
        choices:
          - text: >
              Because it fails for some differentiable functions.
            feedback: >
              It never fails for a differentiable function — it holds for every
              line through the point. Being always true is precisely its
              defect.
          - text: >
              Because every line through $(c, f(c))$ satisfies it whenever $f$
              is continuous, so it distinguishes nothing.
            correct: true
            feedback: >
              $r(h) = f(c+h) - f(c) - mh$ tends to $0$ for any $m$ at all once
              $f$ is continuous at $c$. A test that everything passes cannot
              single out a tangent.
          - text: >
              Because $r(h)$ can be negative.
            feedback: >
              Sign is irrelevant — the condition is about $|r(h)|$ shrinking.
              The real defect is that the condition is satisfied by every
              candidate line.
        feedback: >
          A useful criterion must reject something. Dividing by $h$ raises the
          bar until exactly one slope clears it.
      - teach: >
          Keep the locality in view. The tangent to $x^2$ at $3$ estimates
          $f(10)$ as $51$ against a true value of $100$. Differentiability at a
          point says nothing about any fixed window — the window that meets a
          given tolerance shrinks with the tolerance, exactly as $\delta$
          shrinks with $\varepsilon$.

  - node: analysis.svc.diff-implies-cont
    hook: >
      Theorems in this unit ask for continuity on a closed interval and
      differentiability only on the open one, and that looks like two unrelated
      demands. This lemma shows one of them is nearly free, and its
      contrapositive rules out differentiability at a glance.
    explanation: >
      The proof is one algebraic identity plus one limit law. For $x \ne c$ you
      may write $f(x) - f(c) = \dfrac{f(x) - f(c)}{x - c}\,(x - c)$, which is
      not a manipulation but a triviality: multiplying and dividing by the same
      nonzero number. The identity holds on exactly the punctured
      neighbourhood the limit inspects.

      Now take $x \to c$ on both sides. The first factor tends to $f'(c)$,
      because that is what differentiability at $c$ asserts, and the second
      tends to $0$. A product of two convergent quantities converges to the
      product of the limits, so $f(x) - f(c) \to f'(c) \cdot 0 = 0$. That says
      $\lim_{x \to c} f(x) = f(c)$, which is the definition of continuity at
      $c$.

      Notice where the word *finite* in the definition of the derivative did
      its work. If the difference quotients grew without bound, the product
      would be a large number times a small one with no verdict at all. The
      argument needs $f'(c)$ to be an actual real number, and it is exactly
      that requirement that pushes a function like $x^{1/3}$ at $0$ out of the
      differentiable class.

      The converse is false, and one example settles it. The function
      $f(x) = |x|$ is continuous at $0$ — take $\delta = \varepsilon$ — but its
      difference quotient at $0$ is $|h|/h$, which equals $1$ for every $h > 0$
      and $-1$ for every $h < 0$. Values a distance $2$ apart persist in every
      window, so no limit exists and $f$ is not differentiable at $0$.
      Differentiability is therefore *strictly* stronger than continuity, and
      the useful direction in practice is the contrapositive: a function that
      jumps at $c$ cannot possibly be differentiable at $c$, so you never need
      to compute anything to rule it out.
    worked: >
      Let $g(x) = x^2$ for $x < 1$ and $g(x) = x^2 + 4$ for $x \ge 1$, and ask
      about $x = 1$. The lemma answers it without a difference quotient: as $x$
      climbs to $1$ from the left, $g(x) = x^2$ approaches $1$, while
      $g(1) = 5$. The limit and the value differ, so $g$ is not continuous at
      $1$, and therefore not differentiable there. Confirm it head-on. For
      $h < 0$ the quotient is
      $\dfrac{g(1+h) - g(1)}{h} = \dfrac{(1+h)^2 - 5}{h}
      = \dfrac{h^2 + 2h - 4}{h} = h + 2 - \dfrac{4}{h}$,
      and as $h \to 0^-$ the term $-4/h$ grows past every bound. No finite
      limit exists, exactly as the lemma predicted, and the culprit is the
      jump of size $4$.
    pitfalls: >
      The converse fails, and $|x|$ at $0$ is the example to keep loaded: a
      corner is continuous and not differentiable. Differentiability at $c$
      also gives continuity *at $c$ only* — the function equal to $x^2$ at
      every rational and $0$ at every irrational is differentiable at $0$, with
      $f'(0) = 0$ since the quotient is bounded in size by $|h|$, and yet it is
      discontinuous at every other point. And note the direction of use: from a
      jump you may conclude non-differentiability instantly, but from a smooth
      *looking* graph you may conclude nothing without a limit.
    recap: >
      Differentiability at $c$ forces continuity at $c$, because the
      difference $f(x) - f(c)$ is a bounded quotient times a factor going to
      zero — and the converse fails at every corner.
    steps:
      - teach: >
          Mean-value arguments assume continuity on $[a,b]$ and
          differentiability on $(a,b)$. It is worth knowing how those two
          demands are related before you use them, and the answer is that one
          nearly implies the other.
      - teach: >
          The claim: if $f$ is differentiable at $c$ then $f$ is continuous at
          $c$. The proof starts from an identity valid for every $x \ne c$,
          namely $f(x) - f(c) = \dfrac{f(x) - f(c)}{x - c}\,(x - c)$ —
          multiplying and dividing by the same nonzero number.
      - teach: >
          Let $x \to c$. The quotient tends to $f'(c)$, a finite number, and
          the factor $x - c$ tends to $0$, so the product tends to
          $f'(c) \cdot 0 = 0$. Hence $f(x) \to f(c)$, which is continuity at
          $c$.
      - ask: >
          Suppose $f$ is differentiable at $2$ with $f'(2) = 7$. What is
          $\lim_{x \to 2} (f(x) - f(2))$?
        expects: "0"
        hint: >
          Write the difference as a quotient times $(x - 2)$ and take limits
          factor by factor.
        feedback: >
          $0$. Writing $f(x) - f(2) = \dfrac{f(x)-f(2)}{x-2}\,(x - 2)$, the
          quotient tends to $7$ and the second factor tends to $0$, so the
          product tends to $7 \cdot 0 = 0$. The particular value $7$ never
          mattered — only that it was finite.
      - teach: >
          That is where the word *finite* in the definition of the derivative
          earns its place. If the quotients grew without bound the product
          would be a huge number times a tiny one, with no verdict — which is
          why $x^{1/3}$ at $0$ is excluded.
      - ask: >
          Which function is continuous at $0$ but not differentiable there?
        choices:
          - text: >
              $f(x) = x^2$
            feedback: >
              Its difference quotient at $0$ is $h^2/h = h$, which tends to
              $0$. It is both continuous and differentiable there.
          - text: >
              $f(x) = |x|$
            correct: true
            feedback: >
              Continuous at $0$ with $\delta = \varepsilon$, but the quotient
              $|h|/h$ equals $1$ for $h > 0$ and $-1$ for $h < 0$. Values a
              distance $2$ apart persist in every window, so no limit exists.
          - text: >
              The function equal to $-1$ for $x < 0$ and $1$ for $x \ge 0$.
            feedback: >
              This one is not continuous at $0$ either — it jumps. The lemma
              already rules out differentiability, so it cannot be the example
              of continuity without differentiability.
        feedback: >
          A corner is the standard witness that the converse fails: continuity
          survives it, differentiability does not, so differentiability is
          strictly the stronger property.
      - teach: >
          In practice the contrapositive does the work. A function that jumps
          at $c$ cannot be differentiable at $c$, so you can discard candidates
          without computing a single quotient.
      - ask: >
          Let $g(x) = x^2$ for $x < 1$ and $g(x) = x^2 + 4$ for $x \ge 1$. What
          can you say at $x = 1$?
        choices:
          - text: >
              $g$ is differentiable at $1$, since $x^2$ and $x^2 + 4$ have the
              same derivative.
            feedback: >
              Matching derivatives on the two pieces is irrelevant when the
              pieces do not meet. Differentiability is about the quotient at
              $1$ itself, and the jump destroys it.
          - text: >
              $g$ is not differentiable at $1$, because it is not continuous
              there.
            correct: true
            feedback: >
              From the left $g$ approaches $1$ while $g(1) = 5$, so continuity
              fails and the lemma forbids differentiability. Directly: for
              $h < 0$ the quotient is $h + 2 - 4/h$, which blows up as
              $h \to 0^-$.
          - text: >
              Nothing — the lemma runs the other way and says nothing about
              discontinuous functions.
            feedback: >
              A theorem and its contrapositive say the same thing. "Not
              continuous" therefore delivers "not differentiable" with no extra
              work.
        feedback: >
          Continuity is a necessary condition, so checking it first is the
          cheapest possible test for differentiability.
      - teach: >
          One direction, then, and no more: every differentiable function is
          continuous, no continuous function is obliged to be differentiable,
          and the closed-interval continuity assumed by Rolle's Theorem is
          genuinely a separate demand at the two endpoints.

  - node: analysis.svc.rolle
    hook: >
      This is the exact point where the existence theorems of continuity meet
      the derivative, and every mean-value statement in the rest of the unit is
      a disguised copy of it.
    explanation: >
      The picture is a single sentence: a function that starts and ends at the
      same height must level off somewhere in between. Formally, if $f$ is
      continuous on $[a,b]$, differentiable on $(a,b)$, and $f(a) = f(b)$, then
      $f'(c) = 0$ for some $c$ strictly inside.

      The proof begins by importing an existence theorem, because nothing about
      derivatives can produce a point out of nothing. Continuity on the closed
      bounded interval $[a,b]$ lets the Extreme Value Theorem hand you a
      maximum at some $q$ and a minimum at some $p$. Split into cases. If both
      $p$ and $q$ are endpoints, then the largest and smallest values are both
      equal to $f(a) = f(b)$, so $f$ is constant, and every interior point has
      derivative $0$. Otherwise some extremum sits at an interior point $c$.

      Here is the load-bearing step: an interior extremum forces the derivative
      to vanish. Say $c$ is an interior maximum, so $f(c + h) - f(c) \le 0$ for
      all small $h$ of either sign. For $h > 0$ the difference quotient
      $\dfrac{f(c+h) - f(c)}{h}$ has a non-positive numerator over a positive
      denominator, so it is $\le 0$. For $h < 0$ the numerator is still
      non-positive but the denominator is negative, so the quotient is $\ge 0$.
      Differentiability says both sides approach the *same* number $f'(c)$, and
      a number that is at once $\le 0$ and $\ge 0$ is $0$. An interior minimum
      runs identically with the inequalities reversed.

      The hypotheses are asymmetric on purpose, and both are sharp. The
      function equal to $x$ on $(0,1]$ with the value $1$ assigned at $0$ has
      matching endpoint values and is differentiable inside, yet its derivative
      is always $1$ — one endpoint discontinuity was fatal. And $f(x) = |x|$ on
      $[-1,1]$ is continuous with $f(-1) = f(1)$, yet one missing interior
      derivative leaves $f'$ always $\pm 1$.
    worked: >
      Take $f(x) = x^2 - 4x + 3$ on $[1,3]$. It is a polynomial, hence
      continuous on the closed interval and differentiable inside, and
      $f(1) = 1 - 4 + 3 = 0$ while $f(3) = 9 - 12 + 3 = 0$, so the heights
      match and Rolle's Theorem applies. Compute the derivative straight from
      the definition: for $h \ne 0$,
      $\dfrac{f(c+h) - f(c)}{h}
      = \dfrac{(c+h)^2 - 4(c+h) + 3 - c^2 + 4c - 3}{h}
      = \dfrac{2ch + h^2 - 4h}{h} = 2c + h - 4$,
      whose limit is $2c - 4$. Setting $2c - 4 = 0$ gives $c = 2$, which lies
      in the open interval $(1,3)$ as promised. The value there is
      $f(2) = 4 - 8 + 3 = -1$, the minimum of $f$ on $[1,3]$ — the interior
      extremum the proof was looking for.
    pitfalls: >
      Rolle's Theorem promises a $c$ and locates nothing: there may be many
      such points, and for a constant function every interior point qualifies.
      The equal-heights hypothesis is about the two endpoint *values*, not
      about the function being symmetric or about $f$ having a root. And the
      two regularity hypotheses are not interchangeable — $|x|$ on $[-1,1]$
      shows one interior non-differentiable point kills the conclusion, while
      the function equal to $x$ on $(0,1]$ with value $1$ at $0$ shows a single
      endpoint discontinuity does too.
    recap: >
      Continuity on a closed interval produces an extremum, differentiability
      forces the derivative to vanish at it when it is interior, and equal
      endpoint values guarantee an interior one exists.
    steps:
      - teach: >
          Suppose a function starts and ends at the same height. It must go up
          and come back, or down and come back, or stay put — and in every case
          it seems obliged to level off somewhere. Rolle's Theorem makes that
          obligation exact.
      - teach: >
          The statement: if $f$ is continuous on $[a,b]$, differentiable on
          $(a,b)$, and $f(a) = f(b)$, then $f'(c) = 0$ for some $c$ in the open
          interval $(a,b)$.
      - teach: >
          The proof cannot conjure a point from the derivative alone, so it
          borrows one. Continuity on a closed bounded interval means the
          Extreme Value Theorem applies, handing you a maximum at $q$ and a
          minimum at $p$ in $[a,b]$.
      - ask: >
          If both the maximum and the minimum of $f$ occur only at the
          endpoints $a$ and $b$, what follows from $f(a) = f(b)$?
        choices:
          - text: >
              Nothing — the theorem's conclusion can fail in this case.
            feedback: >
              This case is the easy one, not a gap. Equal endpoint values plus
              extremes at the endpoints pin the whole function.
          - text: >
              $f$ is constant, so every interior point has derivative $0$.
            correct: true
            feedback: >
              The largest and smallest values are both $f(a) = f(b)$, so every
              value is squeezed between two equal numbers and $f$ is constant.
              Its difference quotients are all $0$, so any interior $c$ serves.
          - text: >
              $f$ is increasing, so $f'(c) > 0$ somewhere inside.
            feedback: >
              A function with $f(a) = f(b)$ cannot be increasing across
              $[a,b]$. In this case it is not moving at all.
        feedback: >
          With the extremes trapped at endpoints of equal height, the function
          has no room to move, and the conclusion is immediate.
      - teach: >
          The interesting case is an extremum at an interior point $c$. Say it
          is a maximum, so $f(c+h) - f(c) \le 0$ for all small $h$, positive or
          negative. Watch what that does to the difference quotient on each
          side.
      - ask: >
          At that interior maximum, what is the sign of
          $\dfrac{f(c+h) - f(c)}{h}$ for small $h < 0$?
        choices:
          - text: >
              Non-positive, the same as for $h > 0$.
            feedback: >
              The numerator is non-positive on both sides, but for $h < 0$ the
              *denominator* is negative too, and a non-positive number divided
              by a negative one is non-negative.
          - text: >
              Non-negative, because a non-positive numerator is divided by a
              negative denominator.
            correct: true
            feedback: >
              For $h > 0$ the quotient is $\le 0$ and for $h < 0$ it is
              $\ge 0$. Differentiability says both sides tend to the same
              number $f'(c)$, and the only number that is both $\le 0$ and
              $\ge 0$ is $0$.
          - text: >
              It cannot be determined without knowing $f$.
            feedback: >
              The maximum condition alone fixes the sign of the numerator, and
              the sign of $h$ fixes the denominator. No further information
              about $f$ is needed.
        feedback: >
          The two-sided sign clash is the whole mechanism: differentiability
          forces one limit where the inequalities demand opposite signs, so
          that limit must be zero.
      - teach: >
          Take $f(x) = x^2 - 4x + 3$ on $[1,3]$, where $f(1) = 0$ and
          $f(3) = 0$. From the definition, the difference quotient simplifies
          to $2c + h - 4$ for $h \ne 0$, so $f'(c) = 2c - 4$. Rolle's Theorem
          promises this vanishes somewhere inside.
      - ask: >
          For that $f$ on $[1,3]$, at which $c$ does Rolle's Theorem's
          conclusion hold?
        expects: "2"
        hint: >
          Solve $2c - 4 = 0$ and check the answer lies strictly between $1$ and
          $3$.
        feedback: >
          $c = 2$. Solving $f'(c) = 2c - 4 = 0$ gives $c = 2$, which is inside
          $(1,3)$ as required. The value there is $f(2) = 4 - 8 + 3 = -1$, the
          interior minimum the proof predicted.
      - teach: >
          The hypotheses are asymmetric and both are needed. $|x|$ on $[-1,1]$
          has matching endpoint values and continuity, yet one interior corner
          leaves the derivative always $\pm 1$; and the function equal to $x$
          on $(0,1]$ with value $1$ at $0$ is differentiable inside with
          matching endpoint values, yet its derivative is always $1$, because
          continuity failed at an endpoint.

  - node: analysis.svc.mvt
    hook: >
      This is the bridge from local to global. It is the only tool in the unit
      that turns knowledge of $f'$ at unknown points into hard statements about
      $f$ across a whole interval, and both halves of the Fundamental Theorem
      lean on it.
    explanation: >
      Draw the secant joining $(a, f(a))$ to $(b, f(b))$. Its slope is the
      average rate of change $\dfrac{f(b) - f(a)}{b - a}$. The Mean Value
      Theorem says that somewhere strictly inside the interval, the tangent is
      parallel to that secant: there is a $c \in (a,b)$ with
      $f'(c) = \dfrac{f(b) - f(a)}{b - a}$.

      It is Rolle's Theorem tilted, and the tilt is performed by subtracting
      the secant. Let $S = \dfrac{f(b) - f(a)}{b - a}$ and set
      $g(x) = f(x) - S\,(x - a)$. Then $g(a) = f(a)$, and
      $g(b) = f(b) - S(b - a) = f(b) - (f(b) - f(a)) = f(a)$, so the two
      endpoint values now match. The piece subtracted is a straight line, whose
      difference quotient is the constant $S$ at every point, so $g$ inherits
      continuity on $[a,b]$ and differentiability on $(a,b)$ from $f$, with
      $g'(x) = f'(x) - S$. Rolle's Theorem produces $c$ with $g'(c) = 0$, which
      unwinds to $f'(c) = S$.

      The form worth memorising is the rearranged one:
      $f(b) - f(a) = f'(c)\,(b - a)$. It converts any bound on the derivative
      into a bound on the function. If $|f'| \le M$ throughout the interval,
      then $|f(b) - f(a)| \le M\,(b - a)$ — a global statement about how far
      $f$ can travel, obtained from purely local information, and obtained
      without knowing where $c$ is.

      Not knowing $c$ is the normal situation, and it is fine. The theorem is
      an existence statement, so the usual pattern of use is to apply an
      inequality that holds at *every* point of the interval and therefore
      holds at the unknown $c$ in particular. That pattern is exactly how
      $f' \equiv 0$ forces a function to be constant, and how the accumulation
      of a continuous function on tiny cells telescopes into an integral.
    worked: >
      Take $f(x) = x^3$ on $[0,3]$. It is continuous and differentiable
      everywhere, so the theorem applies. The average rate of change is
      $\dfrac{f(3) - f(0)}{3 - 0} = \dfrac{27 - 0}{3} = 9$. The derivative of
      $x^3$ is $3x^2$, so the theorem's $c$ solves $3c^2 = 9$, that is
      $c^2 = 3$. The two roots are $\pm\sqrt{3}$, and only the positive one
      lies in $(0,3)$, so $c = \sqrt{3} \approx 1.7321$. Check it: at that
      point the tangent slope is $3 \cdot 3 = 9$, matching the secant slope
      exactly, and $1.7321$ does sit strictly between $0$ and $3$. Notice the
      answer is irrational even though the data were integers — one reason the
      theorem is used for the equation it provides rather than for the point
      itself.
    pitfalls: >
      The conclusion needs a $c$ in the *open* interval, and the endpoints are
      genuinely excluded: on $[0,3]$ with $f(x) = x^3$ the secant slope $9$ is
      matched at $\sqrt{3}$ and at neither endpoint. Differentiability is
      required only inside but continuity right up to the ends — $|x|$ on
      $[-1,1]$ has secant slope $0$ and derivative $\pm 1$, never $0$, because
      of the single interior corner. And the theorem never tells you where $c$
      is or how many there are, so any argument that needs a specific $c$ is
      using the wrong tool.
    recap: >
      Subtracting the secant turns any function into one with equal endpoint
      values, so Rolle's Theorem applies and returns a point where the
      instantaneous rate equals the average rate.
    steps:
      - teach: >
          Drive $120$ kilometres in two hours and your average speed was $60$
          per hour. It feels inevitable that at some instant the speedometer
          read exactly $60$. The Mean Value Theorem is that intuition, stated
          for any differentiable function.
      - teach: >
          Precisely: if $f$ is continuous on $[a,b]$ and differentiable on
          $(a,b)$, there is a $c \in (a,b)$ with
          $f'(c) = \dfrac{f(b) - f(a)}{b - a}$ — a tangent somewhere inside
          parallel to the secant across.
      - teach: >
          The proof tilts Rolle's Theorem. Write $S$ for the secant slope and
          set $g(x) = f(x) - S\,(x - a)$: subtracting a straight line. Then
          $g(a) = f(a)$ and $g(b) = f(b) - (f(b) - f(a)) = f(a)$, so the
          endpoint values now agree.
      - ask: >
          What does Rolle's Theorem give for that $g$, and what does it say
          about $f$?
        choices:
          - text: >
              A point $c$ with $g(c) = 0$, hence $f(c) = S(c - a)$.
            feedback: >
              Rolle's Theorem concludes something about the *derivative*, not
              the value. It produces a point where $g'$ vanishes, not one where
              $g$ does.
          - text: >
              A point $c$ with $g'(c) = 0$, hence $f'(c) = S$.
            correct: true
            feedback: >
              The subtracted line has constant difference quotient $S$, so
              $g'(x) = f'(x) - S$. Rolle's Theorem gives $g'(c) = 0$, which
              rearranges to $f'(c) = S$ — the theorem's conclusion.
          - text: >
              A point $c$ with $g'(c) = S$, hence $f'(c) = 2S$.
            feedback: >
              Rolle's Theorem always concludes that the derivative is *zero*.
              Reading its conclusion as $S$ double-counts the tilt.
        feedback: >
          The whole proof is one substitution: subtract the secant, apply
          Rolle's Theorem, add the slope back.
      - teach: >
          Take $f(x) = x^3$ on $[0,3]$. The average rate of change is
          $\dfrac{27 - 0}{3} = 9$, and the derivative of $x^3$ is $3x^2$, so
          the promised point solves $3c^2 = 9$.
      - ask: >
          For $f(x) = x^3$ on $[0,3]$, which $c$ does the Mean Value Theorem
          produce? Give it to four decimal places.
        expects: "1.7321"
        tolerance: 0.0005
        hint: >
          Solve $3c^2 = 9$ and keep the root that lies inside $(0,3)$.
        feedback: >
          $c = \sqrt{3} \approx 1.7321$. The secant slope is
          $(27 - 0)/3 = 9$, the derivative is $3c^2$, and $3c^2 = 9$ gives
          $c^2 = 3$. Of the two roots $\pm\sqrt{3}$, only the positive one lies
          in $(0,3)$.
      - teach: >
          The rearranged form is the one you will actually use:
          $f(b) - f(a) = f'(c)\,(b - a)$. A bound on the derivative anywhere on
          the interval becomes a bound on the function across it, without ever
          identifying $c$.
      - ask: >
          Suppose $f$ is differentiable on $[0,5]$ with $|f'(x)| \le 3$
          throughout, and $f(0) = 2$. What is the largest possible value of
          $f(5)$?
        expects: "17"
        hint: >
          $f(5) - f(0) = f'(c)(5 - 0)$ for some $c$, and $f'(c)$ is at most
          $3$.
        feedback: >
          $17$. The Mean Value Theorem gives $f(5) - f(0) = f'(c)\cdot 5$ for
          some $c \in (0,5)$, and $f'(c) \le 3$ forces
          $f(5) \le 2 + 15 = 17$. The bound is attained by $f(x) = 2 + 3x$, so
          it cannot be improved — and the argument never needed to know $c$.
      - teach: >
          That is the pattern to carry forward: apply an inequality valid at
          every point, so it holds at the unknown $c$ too. The next two results
          are exactly this pattern run twice — once to show a zero derivative
          means no movement, and once to build the Fundamental Theorem.

  - node: analysis.svc.zero-deriv-const
    hook: >
      You already believe a function with zero derivative cannot move. Proving
      it takes the Mean Value Theorem — and the corollary is what makes "the
      antiderivative, plus a constant" a complete answer rather than a hopeful
      one.
    explanation: >
      The claim is less obvious than it sounds. "$f'(x) = 0$" is a statement
      made separately at each point, about behaviour in a shrinking window
      there. "$f$ is constant" is a statement about pairs of points that may be
      far apart. Nothing purely local can bridge that gap, and the Mean Value
      Theorem is the only bridge in this unit.

      The proof is two lines. Let $I$ be an interval, let $f$ be continuous on
      $I$ with $f'(x) = 0$ at every interior point, and take any $x < y$ in
      $I$. Then $f$ is continuous on $[x,y]$ and differentiable on $(x,y)$,
      because every point of $(x,y)$ is interior to $I$. The Mean Value Theorem
      supplies $c \in (x,y)$ with
      $f(y) - f(x) = f'(c)\,(y - x) = 0 \cdot (y - x) = 0$. Since $x$ and $y$
      were arbitrary, all values of $f$ agree, so $f$ is constant.

      The consequence is the one you will actually cite. If $f'(x) = g'(x)$
      throughout an interval, apply the result to $f - g$: its difference
      quotient at any point is the difference of the two difference quotients,
      so $(f - g)'(x) = f'(x) - g'(x) = 0$, and therefore $f - g$ is a
      constant. Two functions with the same derivative on an interval differ by
      a constant and by nothing else — which is why writing "$+ C$" after an
      antiderivative describes *every* antiderivative, not merely a few.

      The word *interval* is load-bearing, and the proof shows exactly why: it
      needs $[x,y]$ to sit inside the domain, which fails as soon as the domain
      comes in separate pieces. On $(0,1) \cup (2,3)$, the function equal to
      $0$ on the first piece and $7$ on the second has zero derivative
      everywhere and is nowhere near constant. Zero derivative buys *locally*
      constant, and only connectedness upgrades that to constant.
    worked: >
      Suppose $G$ is differentiable on all of $\mathbb{R}$ with $G'(x) = 2x$
      everywhere, and you are told $G(2) = 10$. The function $F(x) = x^2$ also
      has derivative $2x$, computed from the definition. So $G - F$ has zero
      derivative on the interval $\mathbb{R}$ and is therefore constant: there
      is a single number $C$ with $G(x) = x^2 + C$ for every $x$. Pin down $C$
      with the data: $G(2) = 4 + C = 10$, so $C = 6$ and $G(x) = x^2 + 6$. Now
      every value of $G$ is determined — for instance $G(5) = 25 + 6 = 31$ —
      from nothing but its derivative and one value. That is the entire
      mechanism behind evaluating definite integrals by antiderivatives.
    pitfalls: >
      The hypothesis is an interval, not merely an open set: on
      $(0,1) \cup (2,3)$ a function with zero derivative need only be constant
      on each piece, and this is exactly the trap that voids careless
      antiderivative claims on a punctured domain. Zero derivative at a single
      point says nothing at all — $f(x) = x^3$ has $f'(0) = 0$ and is
      relentlessly increasing. And the corollary compares *two* functions with
      equal derivatives, not two functions with equal values somewhere; sharing
      one point of agreement without sharing derivatives proves nothing.
    recap: >
      The Mean Value Theorem converts a derivative that vanishes at every
      interior point into a function that never moves, so two antiderivatives
      of the same function on an interval differ by a constant.
    steps:
      - teach: >
          Knowing $f'(x) = 0$ everywhere is a pile of statements about
          shrinking windows at individual points. Concluding that $f(3) =
          f(100)$ is a statement about two points far apart. Something must
          carry local information across a distance.
      - teach: >
          The Mean Value Theorem is that carrier. For $x < y$ in an interval
          $I$ on which $f$ is continuous, with zero derivative inside, it gives
          $c \in (x,y)$ with $f(y) - f(x) = f'(c)(y - x) = 0$. So $f(y) =
          f(x)$, for every pair.
      - ask: >
          $h$ is continuous on $[2,9]$ with $h'(x) = 0$ at every interior
          point, and $h(4) = -6$. What is $h(9)$?
        expects: "-6"
        hint: >
          Apply the argument to the pair $x = 4$, $y = 9$.
        feedback: >
          $-6$. The Mean Value Theorem on $[4,9]$ gives
          $h(9) - h(4) = h'(c)\cdot 5 = 0$, so $h(9) = h(4) = -6$. The same
          argument fixes every other value, so $h$ is the constant $-6$ on the
          whole interval.
      - teach: >
          The consequence worth memorising compares two functions. If
          $f' = g'$ on an interval, then $f - g$ has difference quotients equal
          to the difference of theirs, so $(f-g)' = 0$ and $f - g$ is a
          constant.
      - ask: >
          $F(x) = x^3$ and $G$ both have derivative $3x^2$ on all of
          $\mathbb{R}$, and $G(0) = -2$. What is $G(2)$?
        expects: "6"
        hint: >
          $G - F$ is constant; evaluate that constant at $x = 0$.
        feedback: >
          $6$. Since $G' = F'$ on the interval $\mathbb{R}$, $G(x) = x^3 + C$
          for a single constant $C$. From $G(0) = 0 + C = -2$ we get $C = -2$,
          so $G(2) = 8 - 2 = 6$. One derivative plus one value determines the
          whole function.
      - teach: >
          That is why "$+ C$" is not vagueness. On an interval, the family
          $F + C$ is *every* function with the given derivative — there is no
          exotic extra antiderivative hiding somewhere.
      - ask: >
          On which domain can a function have zero derivative everywhere
          without being constant?
        choices:
          - text: >
              The open interval $(0,1)$.
            feedback: >
              Any two points of $(0,1)$ have the closed interval between them
              inside the domain, so the Mean Value Theorem applies and forces
              the values to agree.
          - text: >
              The set $(0,1) \cup (2,3)$.
            correct: true
            feedback: >
              Take the function equal to $0$ on the first piece and $7$ on the
              second. Its derivative is $0$ everywhere, yet it is not constant
              — and the proof fails exactly because $[0.5, 2.5]$ is not
              contained in the domain.
          - text: >
              The whole line $\mathbb{R}$.
            feedback: >
              $\mathbb{R}$ is an interval, so the argument applies to every
              pair of points and a zero derivative does force constancy.
        feedback: >
          Zero derivative gives *locally* constant. Only a domain in one piece
          upgrades that to constant, which is why the hypothesis says interval.
      - teach: >
          Store the punctured case as a warning. It is the reason an
          antiderivative claim made on a domain with a hole in it can be wrong
          even when the derivative checks out at every point.

  - node: analysis.svc.def-riemann-sum
    hook: >
      Area under a curve has no definition yet, but area of a rectangle does. A
      Riemann sum is the approximation that will be promoted into the
      definition, and the two Darboux sums are the jaws that will squeeze it.
    explanation: >
      Chop $[a,b]$ with a partition $P$: finitely many points
      $a = x_0 < x_1 < \cdots < x_n = b$, cutting the interval into cells of
      widths $\Delta x_i = x_i - x_{i-1}$. The mesh $\lVert P \rVert$ is the
      widest cell. Choose a tag $t_i$ somewhere in each cell, pretend $f$ is
      the constant $f(t_i)$ across that cell, and add up the rectangle areas:
      $S(f,P,t) = \sum_{i=1}^{n} f(t_i)\,\Delta x_i$. Where $f$ is negative the
      contribution is negative, so this is signed area, not area.

      The trouble is the tags: move them and the number changes. To pin the
      answer down, take the two extreme choices. On the $i$-th cell let $m_i$
      be the infimum of $f$ and $M_i$ the supremum — these exist by the
      Completeness axiom of $\mathbb{R}$ because $f$ is assumed bounded — and
      form $L(f,P) = \sum m_i \Delta x_i$ and $U(f,P) = \sum M_i \Delta x_i$.
      Since $m_i \le f(t_i) \le M_i$ and each width is positive, every tagged
      sum is trapped: $L(f,P) \le S(f,P,t) \le U(f,P)$.

      Infimum and supremum, not minimum and maximum, and the distinction is
      deliberate. No continuity has been assumed, so $f$ need not attain its
      bounds on a cell, while completeness guarantees they exist anyway. When
      $f$ *is* continuous, the Extreme Value Theorem turns them back into
      attained values.

      One mechanism makes the whole theory work: refining a partition improves
      both estimates. Split a cell $[x_{i-1}, x_i]$ at an interior point $z$.
      The infimum over each half is at least the infimum over the whole cell,
      since taking a smaller set can only raise the greatest lower bound, so
      the two new lower rectangles together contribute at least
      $m_i \Delta x_i$, so $L$ can only rise and symmetrically $U$ can only
      fall. Adding points squeezes the two sums together, never apart.
    worked: >
      Take $f(x) = x^2$ on $[0,2]$ with the uniform partition into four cells,
      so $\Delta x_i = 0.5$ and the cut points are $0, 0.5, 1, 1.5, 2$. Tag by
      right endpoints, $t = 0.5, 1, 1.5, 2$: the sum is
      $(0.25 + 1 + 2.25 + 4)(0.5) = 7.5 \times 0.5 = 3.75$. Tag by left
      endpoints, $t = 0, 0.5, 1, 1.5$: the sum is
      $(0 + 0.25 + 1 + 2.25)(0.5) = 3.5 \times 0.5 = 1.75$. Because $x^2$
      increases on $[0,2]$, the smallest value on each cell is at its left end
      and the largest at its right, so these two sums are exactly $L(f,P) =
      1.75$ and $U(f,P) = 3.75$. Every tagging whatsoever lands between them —
      midpoint tags $0.25, 0.75, 1.25, 1.75$ give
      $(0.0625 + 0.5625 + 1.5625 + 3.0625)(0.5) = 2.625$, comfortably inside.
      The gap $U - L = 2$ is the uncertainty this partition leaves, and
      refining is what will shrink it.
    pitfalls: >
      There is no such thing as "the" Riemann sum of $f$ over $P$ — the tags
      are part of the data, and different tags give different numbers. Writing
      minimum and maximum instead of infimum and supremum quietly assumes
      something that has not been granted, since a bounded function on a cell
      need not attain either bound. And uniform partitions are a convenience
      for computing, not part of the definition: what has to be small is the
      mesh, and a partition with many points can still contain one enormous
      cell.
    recap: >
      A Riemann sum replaces $f$ by a constant on each cell of a partition and
      adds the rectangle areas, and the lower and upper Darboux sums are the
      extreme cases that bracket every possible choice of tags.
    steps:
      - teach: >
          You cannot integrate a curve, but you can add up rectangles. Cut
          $[a,b]$ at finitely many points into cells of width $\Delta x_i$,
          pick a tag $t_i$ in each, and pretend $f$ holds steady at $f(t_i)$
          across that cell.
      - teach: >
          The resulting number is
          $S(f,P,t) = \sum_{i=1}^{n} f(t_i)\,\Delta x_i$, the Riemann sum for
          that partition and those tags. The mesh $\lVert P \rVert$ is the
          width of the widest cell, and it is the mesh, not the number of
          cells, that measures how fine the chopping is.
      - teach: >
          Take $f(x) = x^2$ on $[0,2]$ cut into four equal cells, so
          $\Delta x_i = 0.5$ with cut points $0, 0.5, 1, 1.5, 2$. Tagging by
          right endpoints uses the values $0.25, 1, 2.25, 4$.
      - ask: >
          What is that right-endpoint Riemann sum for $f(x) = x^2$ on $[0,2]$
          with four equal cells?
        expects: "3.75"
        hint: >
          Add the four values, then multiply once by the common width $0.5$.
        feedback: >
          $3.75$. The values are $0.5^2 = 0.25$, $1$, $1.5^2 = 2.25$ and $4$,
          summing to $7.5$; times the width $0.5$ that is $3.75$. Left-endpoint
          tags on the same partition give $3.5 \times 0.5 = 1.75$ instead —
          same partition, very different number.
      - teach: >
          Tags are part of the data, so pin them to the extremes. On the $i$-th
          cell let $m_i$ be the infimum and $M_i$ the supremum of $f$, and form
          $L(f,P) = \sum m_i \Delta x_i$ and $U(f,P) = \sum M_i \Delta x_i$.
          Since $m_i \le f(t_i) \le M_i$, every tagged sum satisfies
          $L(f,P) \le S(f,P,t) \le U(f,P)$.
      - ask: >
          Why does the definition use the infimum and supremum on each cell
          rather than the minimum and maximum?
        choices:
          - text: >
              Because the infimum is easier to compute.
            feedback: >
              It is usually harder, not easier. The reason is availability, not
              convenience.
          - text: >
              Because $f$ is only assumed bounded, so it need not attain its
              bounds on a cell, while completeness guarantees the bounds exist.
            correct: true
            feedback: >
              No continuity has been assumed at this stage. Completeness gives
              a greatest lower bound and a least upper bound for any bounded
              set of values, attained or not — and when $f$ *is* continuous the
              Extreme Value Theorem turns them back into attained values.
          - text: >
              Because minimum and maximum would make $L$ and $U$ equal.
            feedback: >
              They would not: the smallest and largest values on a cell are
              generally different numbers. The issue is whether those values
              exist at all.
        feedback: >
          Boundedness plus completeness always delivers $m_i$ and $M_i$;
          attainment is an extra that only continuity supplies.
      - teach: >
          Refining a partition can only help. Split a cell at an interior
          point: the infimum over each half is at least the infimum over the
          whole, since shrinking a set can only raise its greatest lower bound.
          So the two new lower rectangles total at least the old one, $L$
          rises, and symmetrically $U$ falls.
      - ask: >
          For $f(x) = x$ on $[0,1]$ with four equal cells, what is
          $U(f,P) - L(f,P)$?
        expects: "0.25"
        hint: >
          On each cell the function rises by exactly the cell width, so
          $M_i - m_i = \Delta x_i$.
        feedback: >
          $0.25$. Each cell has $M_i - m_i = 0.25$ and width $0.25$, so the gap
          is $4 \times 0.25 \times 0.25 = 0.25$. In general an increasing $f$ has
          $U - L = (f(b) - f(a))\,\lVert P \rVert$ on a uniform partition, so
          taking $n$ cells drives the gap to $(f(b)-f(a))/n$.
      - teach: >
          That shrinking gap is the whole plan. The upper sums come down, the
          lower sums go up, and the integral will be defined as the number they
          trap between them — when there is exactly one.

  - node: analysis.svc.def-riemann-integral
    hook: >
      Riemann sums approximate; the integral is what happens when the
      approximation runs out of freedom. Every later fact about integrals,
      including both halves of the Fundamental Theorem, is read off this
      squeeze.
    explanation: >
      Fix a bounded $f$ on $[a,b]$ and look at all partitions at once. The
      lower integral $\underline{\int_a^b} f$ is the supremum of the lower sums
      $L(f,P)$, the best the rectangles-from-below can do; the upper integral
      $\overline{\int_a^b} f$ is the infimum of the upper sums $U(f,Q)$, the
      best from above. Both exist by completeness, once the lower sums are
      known to be bounded above — the next point.

      The key inequality is that *every* lower sum is at most *every* upper
      sum, even when the two partitions have nothing in common. Given $P$ and
      $Q$, take their common refinement $P \cup Q$. Refining raises lower sums
      and lowers upper sums, so
      $L(f,P) \le L(f, P \cup Q) \le U(f, P \cup Q) \le U(f,Q)$, where the
      middle step is just $m_i \le M_i$ on each cell. So each $U(f,Q)$ is an
      upper bound for all lower sums, hence
      $\underline{\int_a^b} f \le U(f,Q)$, and taking the infimum over $Q$
      gives $\underline{\int_a^b} f \le \overline{\int_a^b} f$. The two numbers
      never cross.

      $f$ is Riemann integrable when they coincide, and then $\int_a^b f(x)\,dx$
      denotes the common value. The working test is the Cauchy criterion: $f$
      is integrable exactly when for every $\varepsilon > 0$ some single
      partition has $U(f,P) - L(f,P) < \varepsilon$. One direction is
      immediate, and it is the direction you use — both integrals lie between
      $L(f,P)$ and $U(f,P)$, so their difference is below every $\varepsilon$,
      and a non-negative number below every positive number is $0$.

      Not everything is integrable. Let $f$ be $1$ at every rational point of
      $[0,1]$ and $0$ at every irrational one: every cell of every partition
      contains both kinds of point, so $M_i = 1$ and $m_i = 0$ however fine the
      chopping. The upper integral is $1$, the lower is $0$, and no refinement
      can close a gap that refinement never touches.
    worked: >
      Integrate $f(x) = x$ over $[0,2]$ from the definition. Use the uniform
      partition into $n$ cells, so $\Delta x_i = 2/n$ and the cut points are
      $x_i = 2i/n$. The function increases, so on the $i$-th cell
      $m_i = 2(i-1)/n$ and $M_i = 2i/n$. Then
      $U_n = \sum_{i=1}^{n} \dfrac{2i}{n}\cdot\dfrac{2}{n}
      = \dfrac{4}{n^2}\cdot\dfrac{n(n+1)}{2} = 2 + \dfrac{2}{n}$,
      and shifting the index the same way gives $L_n = 2 - \dfrac{2}{n}$. Now
      squeeze: for every $n$,
      $2 - \dfrac{2}{n} \le \underline{\int_0^2} f \le \overline{\int_0^2} f
      \le 2 + \dfrac{2}{n}$.
      The two therefore differ from $2$ by at most $2/n$ for every $n$, and no
      positive number beats $2/n$ for all $n$. Both equal
      $2$, so $\int_0^2 x\,dx = 2$ — reassuring, since that region is a triangle
      of base $2$ and height $2$.
    pitfalls: >
      Boundedness is a standing hypothesis, not a detail: for an unbounded $f$
      some $M_i$ fails to exist and the upper sums are not defined, so the
      definition never gets started. The supremum and infimum run over *all*
      partitions, so one partition with close sums proves integrability only
      through the Cauchy criterion, and one with distant sums proves nothing at
      all. And refinement is not a magic
      wand — for the function that is $1$ on rationals and $0$ elsewhere, every
      partition gives $U = 1$ and $L = 0$, however fine.
    recap: >
      The integral exists exactly when the best rectangles-from-below and the
      best rectangles-from-above agree, and the practical test is that some
      partition makes $U - L$ smaller than any tolerance you name.
    steps:
      - teach: >
          One partition leaves a gap between $L$ and $U$. So stop looking at
          one: the lower integral is the supremum of all lower sums, and the
          upper integral is the infimum of all upper sums. Best from below,
          best from above.
      - teach: >
          Those two numbers can never cross. Given any $P$ and $Q$, refine to
          $P \cup Q$: refining raises lower sums and lowers upper sums, so
          $L(f,P) \le L(f,P\cup Q) \le U(f,P\cup Q) \le U(f,Q)$. Every lower
          sum is below every upper sum, hence the lower integral is at most the
          upper one.
      - teach: >
          $f$ is Riemann integrable on $[a,b]$ when the two agree, and the
          common value is written $\int_a^b f(x)\,dx$. Nothing about
          derivatives has entered; this is a statement about rectangles alone.
      - ask: >
          For $f(x) = x$ on $[0,3]$ with four equal cells, what is
          $U(f,P) - L(f,P)$?
        expects: "2.25"
        hint: >
          The function is increasing, so on each cell $M_i - m_i$ equals the
          rise across that cell.
        feedback: >
          $2.25$. Each cell has width $0.75$, and across it $f$ rises by
          $0.75$, so the gap is $4 \times 0.75 \times 0.75 = 2.25$. Equivalently
          $U - L = (f(3) - f(0)) \cdot 0.75 = 3 \times 0.75$, and taking $n$
          cells instead gives $9/n$ — as small as you like.
      - teach: >
          That is the Cauchy criterion in action: $f$ is integrable exactly
          when for every $\varepsilon > 0$ some partition has
          $U(f,P) - L(f,P) < \varepsilon$. Both integrals sit between $L$ and
          $U$, so their difference beats every tolerance and must be zero.
      - ask: >
          Let $f$ be $1$ at every rational point of $[0,1]$ and $0$ at every
          irrational point. What is $U(f,P)$ for a partition into $1000$ equal
          cells?
        expects: "1"
        hint: >
          Every interval of positive length, however short, contains a rational
          number.
        feedback: >
          $1$. Every cell contains a rational, so $M_i = 1$ on each, and
          $U(f,P) = \sum 1 \cdot \Delta x_i = 1$. Every cell also contains an
          irrational, so $L(f,P) = 0$. The same holds for *every* partition, so
          the upper integral is $1$, the lower is $0$, and $f$ is not
          integrable.
      - teach: >
          Note what that example did *not* do: refinement never helped, because
          the gap was never caused by coarseness. Integrability is a genuine
          restriction on $f$, not a promise about fine enough partitions.
      - ask: >
          Which statement correctly describes Riemann integrability of a
          bounded $f$ on $[a,b]$?
        choices:
          - text: >
              Some partition has $L(f,P) = U(f,P)$.
            feedback: >
              That equality forces $f$ to be constant on every cell, which
              essentially never happens. Integrability asks the gap to be
              arbitrarily *small*, not zero for a single partition.
          - text: >
              For every $\varepsilon > 0$ some partition has
              $U(f,P) - L(f,P) < \varepsilon$.
            correct: true
            feedback: >
              This is the Cauchy criterion, equivalent to the lower and upper
              integrals agreeing. The partition is allowed to depend on
              $\varepsilon$, which is exactly the freedom that makes the test
              usable.
          - text: >
              For some $\varepsilon > 0$ every partition has
              $U(f,P) - L(f,P) < \varepsilon$.
            feedback: >
              The quantifiers are reversed. This says the gap is uniformly
              small over all partitions, which even a coarse partition of a
              well-behaved function violates.
        feedback: >
          Name the tolerance first, then produce a partition — the same
          challenge-and-response shape as the $\varepsilon$–$\delta$ limit.
      - teach: >
          The definition is now complete but almost no function is yet known to
          satisfy it. Supplying a whole class of integrable functions is the
          next job, and continuity on a closed bounded interval turns out to be
          enough.

  - node: analysis.svc.cont-integrable
    hook: >
      The integral has been defined, but so far only hand-computed examples are
      known to exist. This proposition delivers the entire supply the
      Fundamental Theorem needs: every continuous function on a closed bounded
      interval.
    explanation: >
      Aim at the Cauchy criterion — produce, for each $\varepsilon > 0$, one
      partition with $U(f,P) - L(f,P) < \varepsilon$. Write that gap out:
      $U(f,P) - L(f,P) = \sum_{i=1}^{n} (M_i - m_i)\,\Delta x_i$. If every
      cell's oscillation $M_i - m_i$ can be pushed below
      $\varepsilon/(b-a)$, the whole sum is at most
      $\dfrac{\varepsilon}{b-a}\sum \Delta x_i = \varepsilon$, since the widths
      add up to $b - a$. So the target is one partition on which $f$ varies
      little in every cell.

      Pointwise continuity does not obviously supply that: it hands you a
      $\delta$ at each point separately, small where $f$ swings fast, while one
      partition must work across the whole interval at once. The rescue is
      *uniform* continuity: for every $\varepsilon > 0$ there is a single
      $\delta > 0$ such that $|f(x) - f(y)| < \varepsilon$ for *every* pair of
      points with $|x - y| < \delta$, wherever they sit. Continuity on a closed
      bounded interval always upgrades to this — on $(0,1]$ the continuous
      function $1/x$ does not, since near the missing endpoint arbitrarily
      close pairs have values arbitrarily far apart.

      The proof now finishes in a line. Pick $\delta$ uniform for the tolerance
      $\varepsilon/(b-a)$ and take any partition of mesh less than $\delta$.
      Two points in a cell are within $\delta$, so their values differ by less
      than $\varepsilon/(b-a)$, and the Extreme Value Theorem makes $M_i$ and
      $m_i$ actual values of $f$ there, so
      $M_i - m_i \le \varepsilon/(b-a)$. Summing gives
      $U(f,P) - L(f,P) \le \varepsilon$.

      Integrability is strictly weaker than continuity: a monotone function is
      integrable however many jumps it has, and so is any function with
      finitely many jumps — trap each jump in a cell of tiny width and its
      bounded oscillation contributes almost nothing.
    worked: >
      Verify the Cauchy criterion concretely for $f(x) = x^2$ on $[0,3]$ with
      $\varepsilon = 0.6$. The target oscillation per cell is
      $\varepsilon/(b-a) = 0.6/3 = 0.2$. Get a uniform $\delta$ by hand: for
      $x, y \in [0,3]$, $|x^2 - y^2| = |x - y|\,|x + y| \le 6\,|x - y|$, and
      the bound $6$ holds everywhere on the interval, so one $\delta$ serves
      all pairs. Choose the uniform partition into $100$ cells, mesh
      $3/100 = 0.03$. Any two points of a cell satisfy $|x - y| \le 0.03$, so
      $|f(x) - f(y)| \le 6(0.03) = 0.18$, and the Extreme Value Theorem makes
      $M_i$ and $m_i$ values of $f$ at genuine points of the cell, whence
      $M_i - m_i \le 0.18$. Therefore
      $U(f,P) - L(f,P) \le 0.18 \times 3 = 0.54 < 0.6$, and the same recipe
      answers any $\varepsilon$.
    pitfalls: >
      Continuity is sufficient, never necessary — concluding "not continuous,
      so not integrable" is the standard misreading, and a step function
      refutes it at once. The proof genuinely needs the *uniform* version, and
      that is where closed and bounded enter; the same argument on $(0,1]$ with
      $1/x$ collapses, since no single mesh controls the oscillation near the
      missing endpoint. And the target per cell is $\varepsilon/(b-a)$, not
      $\varepsilon$: forgetting to divide by the interval length leaves you
      proving a bound of $\varepsilon\,(b-a)$, which is the wrong statement on
      any interval longer than $1$.
    recap: >
      On a closed bounded interval, continuity is uniform, so a fine enough
      mesh makes every cell's oscillation small at once and the upper and lower
      sums close to within any tolerance.
    steps:
      - teach: >
          The gap to control is
          $U(f,P) - L(f,P) = \sum (M_i - m_i)\,\Delta x_i$. Since the widths
          add to $b - a$, driving every oscillation $M_i - m_i$ below
          $\varepsilon/(b-a)$ drives the whole gap below $\varepsilon$.
      - ask: >
          You want $U - L < 0.6$ for a function on $[0,3]$. What bound on each
          cell's oscillation $M_i - m_i$ does that strategy call for?
        expects: "0.2"
        hint: >
          The widths sum to the length of the interval.
        feedback: >
          $0.2$, since $\varepsilon/(b-a) = 0.6/3 = 0.2$. Then
          $\sum (M_i - m_i)\Delta x_i \le 0.2 \sum \Delta x_i = 0.2 \times 3
          = 0.6$. Forgetting to divide by the length is the classic slip.
      - teach: >
          Pointwise continuity does not obviously deliver that. It gives a
          $\delta$ at each point separately, small where $f$ swings fast, while
          a single partition must control every cell at once.
      - teach: >
          The rescue is uniform continuity: on a closed bounded interval, for
          every $\varepsilon > 0$ there is one $\delta > 0$ with
          $|f(x) - f(y)| < \varepsilon$ for every pair with $|x - y| < \delta$,
          wherever they sit. Closedness is what supplies it — on $(0,1]$ the
          function $1/x$ is continuous with no such uniform $\delta$.
      - teach: >
          Now the proof is one line. Take $\delta$ uniform for the tolerance
          $\varepsilon/(b-a)$ and any partition of mesh below $\delta$. Two
          points in a cell are within $\delta$, and the Extreme Value Theorem
          says $M_i$ and $m_i$ are attained there, so
          $M_i - m_i \le \varepsilon/(b-a)$ and the gap is at most
          $\varepsilon$.
      - ask: >
          For $f(x) = x^2$ on $[0,3]$ take the uniform partition into $100$
          cells. Since $|x^2 - y^2| \le 6\,|x-y|$ on this interval, what bound
          does the argument give for $U(f,P) - L(f,P)$?
        expects: "0.54"
        hint: >
          First bound one cell's oscillation using the mesh $0.03$, then
          multiply by the interval length.
        feedback: >
          $0.54$. The mesh is $3/100 = 0.03$, so each cell has
          $M_i - m_i \le 6(0.03) = 0.18$, and summing against widths totalling
          $3$ gives $U - L \le 0.18 \times 3 = 0.54$. That is under $0.6$, so
          this single partition already meets the tolerance.
      - teach: >
          Notice how the Extreme Value Theorem was used: it converted the
          suprema and infima in the definition of $U$ and $L$ back into
          *values* of $f$, which is what let the continuity estimate apply to
          them at all.
      - ask: >
          Which conclusion does this proposition license?
        choices:
          - text: >
              A function that is not continuous on $[a,b]$ is not integrable
              there.
            feedback: >
              That is the converse, and it is false. The function equal to $0$
              on $[0,1)$ and $1$ at $x = 1$ jumps, yet its upper and lower sums
              differ by at most the width of the cell containing $1$, so it is
              integrable.
          - text: >
              Every continuous function on a closed bounded interval is
              integrable there, though integrable functions need not be
              continuous.
            correct: true
            feedback: >
              Sufficient, not necessary. Monotone functions and functions with
              finitely many jumps are integrable too — isolate each jump in a
              cell of tiny width and its contribution to $U - L$ vanishes.
          - text: >
              Every bounded function on a closed bounded interval is
              integrable.
            feedback: >
              The function that is $1$ on the rationals and $0$ on the
              irrationals is bounded on $[0,1]$ and has $U = 1$, $L = 0$ for
              every partition. Boundedness alone is far too weak.
        feedback: >
          Continuity buys integrability and nothing about the converse, which
          is why the class of integrable functions is comfortably larger than
          the class of continuous ones.
      - teach: >
          This is the hypothesis the Fundamental Theorem will lean on. Because
          a continuous $f$ is integrable on *every* subinterval $[a,x]$, the
          accumulation function $F(x) = \int_a^x f(t)\,dt$ is defined at every
          point — and that function is the whole subject of what follows.

  - node: analysis.svc.ex-integral-x2
    hook: >
      Here is an integral computed the hard way — rectangles, a summation
      identity, and a squeeze, with no antiderivative anywhere in sight. Doing
      it once is what makes the Fundamental Theorem feel like the shortcut it
      is.
    explanation: >
      Take $f(x) = x^2$ on $[0,1]$ and the uniform partition $x_i = i/n$, so
      every cell has width $1/n$. The function increases, so on the $i$-th cell
      the supremum sits at the right endpoint and the infimum at the left. That
      makes the right-endpoint Riemann sum the upper Darboux sum and the
      left-endpoint sum the lower one — the two extremes are computable, not
      just approximable.

      Now compute. The upper sum is
      $U_n = \sum_{i=1}^{n} \left(\dfrac{i}{n}\right)^2 \dfrac{1}{n}
      = \dfrac{1}{n^3}\sum_{i=1}^{n} i^2$, and the sum-of-squares identity
      $\sum_{i=1}^{n} i^2 = \dfrac{n(n+1)(2n+1)}{6}$ turns that into
      $\dfrac{2n^3 + 3n^2 + n}{6n^3}
      = \dfrac{1}{3} + \dfrac{1}{2n} + \dfrac{1}{6n^2}$. The lower sum runs the
      same indices shifted down by one and gives
      $L_n = \dfrac{(n-1)n(2n-1)}{6n^3}
      = \dfrac{1}{3} - \dfrac{1}{2n} + \dfrac{1}{6n^2}$. Subtracting,
      $U_n - L_n = \dfrac{1}{n}$, so the Cauchy criterion is already satisfied
      and $f$ is integrable.

      The value follows without any theory of sequences. For every $n$ the
      lower and upper integrals are trapped between $L_n$ and $U_n$, and the
      number $\dfrac{1}{3}$ is trapped there too, since
      $L_n \le \dfrac{1}{3} \le U_n$ for every $n \ge 1$. Two numbers inside an
      interval of length $1/n$ differ by at most $1/n$; as this holds for every
      $n$, and no positive number is below $1/n$ for all $n$, both integrals
      equal $\dfrac{1}{3}$. So $\int_0^1 x^2\,dx = \dfrac{1}{3}$.

      Look at what that cost. The answer came out of an identity special to
      squares; cubes need a different identity, fourth powers another, and
      $\sin$ none of them. There is no general procedure here, and every new
      integrand is a new research problem. That is exactly the gap the
      Fundamental Theorem of Calculus closes.
    worked: >
      Run the same machine on $f(x) = x^3$ over $[0,1]$, using the identity
      $\sum_{i=1}^{n} i^3 = \dfrac{n^2(n+1)^2}{4}$. With $x_i = i/n$ and $f$
      increasing, the upper sum is
      $U_n = \dfrac{1}{n^4}\sum_{i=1}^{n} i^3 = \dfrac{(n+1)^2}{4n^2}
      = \dfrac{1}{4} + \dfrac{1}{2n} + \dfrac{1}{4n^2}$, and the lower sum,
      running the indices from $0$ to $n-1$, is
      $L_n = \dfrac{(n-1)^2}{4n^2}
      = \dfrac{1}{4} - \dfrac{1}{2n} + \dfrac{1}{4n^2}$. Their difference is
      again $\dfrac{1}{n}$, so $x^3$ is integrable, and $\dfrac{1}{4}$ lies
      between $L_n$ and $U_n$ for every $n$. Both integrals are therefore
      within $1/n$ of $\dfrac{1}{4}$ for every $n$, which forces
      $\int_0^1 x^3\,dx = \dfrac{1}{4}$. Notice that the whole computation had
      to be redone: nothing about the $x^2$ case transferred except the shape
      of the argument.
    pitfalls: >
      Right-endpoint sums are the *upper* sums only because $x^2$ increases on
      $[0,1]$ — on $[-1,0]$ the roles swap, and for a function that rises and
      falls neither endpoint rule gives a Darboux sum at all. The argument also
      needs both $L_n$ and $U_n$: exhibiting only $U_n$ shows the upper
      integral is at most $1/3$ and says nothing about the lower one. And the
      squeeze concludes from "differs from $1/3$ by at most $1/n$ for every
      $n$", not from any single $n$ — one partition never determines an
      integral.
    recap: >
      Uniform partitions plus the sum-of-squares identity pin
      $\int_0^1 x^2\,dx$ to $\dfrac{1}{3}$ from the definition alone, at the
      cost of an argument that transfers to no other integrand.
    steps:
      - teach: >
          Cut $[0,1]$ into $n$ equal cells with $x_i = i/n$ and integrate
          $f(x) = x^2$ by hand. Since $x^2$ increases, the supremum on each
          cell is at its right endpoint and the infimum at its left, so the
          right- and left-endpoint sums are exactly $U_n$ and $L_n$.
      - ask: >
          What is the right-endpoint Riemann sum for $f(x) = x^2$ on $[0,1]$
          with four equal cells?
        expects: "0.46875"
        hint: >
          The values are $(1/4)^2, (2/4)^2, (3/4)^2, (4/4)^2$, and every cell
          has width $1/4$.
        feedback: >
          $0.46875$. The squared values are
          $\dfrac{1}{16}, \dfrac{4}{16}, \dfrac{9}{16}, \dfrac{16}{16}$,
          summing to $\dfrac{30}{16}$; times the width $\dfrac{1}{4}$ that is
          $\dfrac{30}{64} = 0.46875$. It overshoots, as an upper sum must.
      - teach: >
          In general
          $U_n = \dfrac{1}{n^3}\sum_{i=1}^{n} i^2$, and the identity
          $\sum_{i=1}^{n} i^2 = \dfrac{n(n+1)(2n+1)}{6}$ turns that into
          $\dfrac{1}{3} + \dfrac{1}{2n} + \dfrac{1}{6n^2}$. The lower sum is
          the same with the middle sign flipped:
          $\dfrac{1}{3} - \dfrac{1}{2n} + \dfrac{1}{6n^2}$.
      - ask: >
          With those formulas, what is $U_n - L_n$ when $n = 20$?
        expects: "0.05"
        hint: >
          Subtract the two expressions; everything cancels except the middle
          terms.
        feedback: >
          $0.05$. The difference is
          $\dfrac{1}{2n} + \dfrac{1}{2n} = \dfrac{1}{n}$, which is
          $\dfrac{1}{20} = 0.05$. Since $1/n$ beats any tolerance you name,
          the Cauchy criterion is satisfied and $x^2$ is integrable on $[0,1]$.
      - teach: >
          Now pin the value. For every $n$, both the lower and the upper
          integral lie between $L_n$ and $U_n$, and so does $\dfrac{1}{3}$.
          Two numbers inside an interval of length $1/n$ differ by at most
          $1/n$, and that holds for every $n$, so both integrals *are*
          $\dfrac{1}{3}$.
      - ask: >
          Why is showing $U_n = \dfrac{1}{3} + \dfrac{1}{2n} +
          \dfrac{1}{6n^2}$ on its own not enough to conclude
          $\int_0^1 x^2\,dx = \dfrac{1}{3}$?
        choices:
          - text: >
              Because the formula is only valid for uniform partitions.
            feedback: >
              Uniform partitions are perfectly legitimate partitions, and using
              them is not the gap. The gap is which of the two integrals they
              control.
          - text: >
              Because it controls only the upper integral, leaving the lower
              integral unbounded from below.
            correct: true
            feedback: >
              Upper sums squeeze the integral from above and give
              $\overline{\int_0^1} f \le \dfrac{1}{3}$. Without the lower sums
              there is nothing forcing the lower integral up to meet it, and
              integrability is precisely the claim that the two agree.
          - text: >
              Because $U_n$ is never exactly $\dfrac{1}{3}$.
            feedback: >
              No upper sum should equal the integral — it strictly overshoots
              for a non-constant increasing function. That is expected, not a
              defect.
        feedback: >
          Integrability is a two-sided statement, so a one-sided estimate can
          never establish it. Both jaws of the squeeze have to be computed.
      - teach: >
          The same machine handles $x^3$ using
          $\sum_{i=1}^{n} i^3 = \dfrac{n^2(n+1)^2}{4}$, giving
          $U_n = \dfrac{1}{4} + \dfrac{1}{2n} + \dfrac{1}{4n^2}$ and
          $\int_0^1 x^3\,dx = \dfrac{1}{4}$. Every step had to be redone; only
          the shape of the argument carried over.
      - teach: >
          That is the honest state of the theory so far. Each new integrand
          demands a new summation identity, and most integrands have none. The
          Fundamental Theorem of Calculus is what replaces this labour with a
          derivative computation run backwards.

  - node: analysis.svc.def-antiderivative
    hook: >
      Every derivative so far has been computed forwards. Running the question
      backwards — which function has *this* as its derivative — is a genuinely
      different problem, and naming its answer set is what lets the Fundamental
      Theorem be stated at all.
    explanation: >
      $F$ is an antiderivative of $f$ on an interval $I$ when $F$ is
      differentiable there and $F'(x) = f(x)$ at every point. Nothing is
      required to be clever: $F(x) = \dfrac{x^3}{3}$ is an antiderivative of
      $f(x) = x^2$ on $\mathbb{R}$, because the derivative of $x^3$ is $3x^2$
      from the definition, and multiplying a function by $\dfrac{1}{3}$
      multiplies every difference quotient by $\dfrac{1}{3}$.

      Antiderivatives are never unique. If $F' = f$ then $(F + C)' = f$ too,
      since a constant contributes $0$ to every difference quotient. What makes
      the situation manageable rather than chaotic is the converse, and you
      already have it: on an *interval*, two functions with the same derivative
      differ by a constant. So the antiderivatives of $f$ on $I$ are exactly
      the family $F + C$ — a single one-parameter family, with no stragglers.

      The notation $\int f(x)\,dx = F(x) + C$ names that family, and it
      deliberately reuses the integral sign. Be clear that this is a promise,
      not a fact. The indefinite integral is a set of *functions*, produced by
      differentiation; the definite integral $\int_a^b f(x)\,dx$ is a single
      *number*, produced by rectangles. Nothing so far connects them, and the
      shared symbol is a piece of optimism that the Fundamental Theorem will
      later justify.

      Existence is a real question. Asking for $F$ with $F' = f$ is asking to
      solve an equation, not to evaluate a formula, and there is no reason in
      advance that a solution should exist for a given $f$. There is also a
      separate and often confused question: whether an antiderivative that
      exists can be *written down* in elementary terms. For $f(x) = e^{-x^2}$
      the answer to the first question turns out to be yes and to the second
      no, and only the first one matters for the theory.
    worked: >
      Check that $F(x) = \dfrac{x^3}{3} - 2x^2 + 5x$ is an antiderivative of
      $f(x) = x^2 - 4x + 5$ on $\mathbb{R}$, then select the member of the
      family with a prescribed value. Differentiate term by term: the
      derivative of $x^3$ is $3x^2$, so the first term contributes $x^2$; the
      derivative of $x^2$ is $2x$, so $-2x^2$ contributes $-4x$; and $5x$ has
      constant difference quotient $5$. Adding, $F'(x) = x^2 - 4x + 5 = f(x)$
      as required. The full family is $F(x) + C$. Suppose you want the member
      $G$ with $G(3) = 1$. Evaluate: $F(3) = \dfrac{27}{3} - 18 + 15 = 6$, so
      $6 + C = 1$ and $C = -5$. Hence
      $G(x) = \dfrac{x^3}{3} - 2x^2 + 5x - 5$, and, for instance,
      $G(0) = -5$. One derivative and one value pick out exactly one function.
    pitfalls: >
      The "+ C" claim is a theorem about intervals, not a formality. On
      $(0,1) \cup (2,3)$ two antiderivatives of the same function may differ by
      one constant on the left piece and a different constant on the right, so
      the family has two parameters, not one — and antiderivative arguments on
      a punctured domain go wrong exactly there. Do not read $\int f(x)\,dx$
      and $\int_a^b f(x)\,dx$ as the same object: one is a family of functions,
      the other a number, and their relationship is a theorem rather than a
      definition. And "has no elementary antiderivative" never means "has no
      antiderivative".
    recap: >
      An antiderivative of $f$ on an interval is any $F$ with $F' = f$, and
      because zero derivative on an interval means constant, the antiderivatives
      form exactly the one-parameter family $F + C$.
    steps:
      - teach: >
          Turn the derivative question around. Instead of "given $F$, what is
          $F'$", ask "given $f$, which $F$ has $F' = f$". Such an $F$ is called
          an antiderivative of $f$ on the interval where the equation holds.
      - teach: >
          A first example needs nothing new. The derivative of $x^3$ is $3x^2$,
          and scaling a function by $\dfrac{1}{3}$ scales every difference
          quotient by $\dfrac{1}{3}$, so $\dfrac{x^3}{3}$ is an antiderivative
          of $x^2$ on $\mathbb{R}$.
      - ask: >
          $F(x) = \dfrac{x^4}{4} + C$. What is $F'(2)$?
        expects: "8"
        hint: >
          The derivative of $x^n$ is $n\,x^{n-1}$, and a constant contributes
          nothing.
        feedback: >
          $8$. The derivative of $x^4$ is $4x^3$, so scaling by $\dfrac{1}{4}$
          gives $F'(x) = x^3$, and $F'(2) = 8$. The constant $C$ has zero
          difference quotient and drops out whatever its value.
      - teach: >
          That last point generalises: if $F' = f$ then $(F+C)' = f$ for every
          constant $C$, so antiderivatives are never unique. The useful fact is
          the converse — on an interval, two functions with equal derivatives
          differ by a constant — so the family $F + C$ is *all* of them.
      - ask: >
          For which constant $C$ does $\dfrac{x^3}{3} + C$ take the value $5$
          at $x = 3$?
        expects: "-4"
        hint: >
          Evaluate $\dfrac{x^3}{3}$ at $3$ first, then solve for $C$.
        feedback: >
          $C = -4$. At $x = 3$ the base function gives $\dfrac{27}{3} = 9$, so
          $9 + C = 5$ and $C = -4$. One derivative plus one value determines
          exactly one antiderivative, which is why initial conditions pin these
          families down.
      - teach: >
          The notation $\int f(x)\,dx = F(x) + C$ names that family. It borrows
          the definite integral's symbol on purpose, but the two are different
          kinds of object: a set of functions built by differentiation, and a
          number built from rectangles.
      - ask: >
          What currently connects $\int f(x)\,dx$ to $\int_a^b f(x)\,dx$?
        choices:
          - text: >
              They are the same object, one with limits attached.
            feedback: >
              One is a family of functions and the other a single number, so
              they are not the same object. Attaching limits is not a
              definition of anything yet.
          - text: >
              Nothing yet — the shared notation anticipates a theorem that has
              not been proved.
            correct: true
            feedback: >
              The definite integral was defined by upper and lower sums, with
              no mention of derivatives. That antidifferentiation evaluates it
              is the content of the Fundamental Theorem, and it has to be
              earned.
          - text: >
              The definite integral is defined as $F(b) - F(a)$.
            feedback: >
              That is the *conclusion* of the Fundamental Theorem, Part II, not
              a definition. Defining it that way would leave every function
              without an elementary antiderivative with no integral at all.
        feedback: >
          Keep the two apart until the theorem arrives; the shared symbol is a
          promissory note, and the proof is what redeems it.
      - teach: >
          Existence is not automatic either. Asking for $F$ with $F' = f$ is
          solving an equation, and nothing so far guarantees a solution. The
          Fundamental Theorem, Part I answers that question for every
          continuous $f$ — by handing you an antiderivative built out of
          integrals.

  - node: analysis.svc.ftc-part-1
    hook: >
      This is the moment the two halves of the unit meet. Accumulate a
      continuous function, differentiate the accumulation, and you get the
      original back — which means every continuous function has an
      antiderivative, whether or not anyone can write it down.
    explanation: >
      Let $f$ be continuous on $[a,b]$ and define the accumulation function
      $F(x) = \int_a^x f(t)\,dt$: the signed area collected from the left end
      up to $x$. This is well posed only because a continuous function on a
      closed bounded interval is integrable, so each $[a,x]$ has an integral.
      The claim is that $F$ is differentiable with $F'(x) = f(x)$.

      Form the difference quotient. The numerator $F(x+h) - F(x)$ is the
      accumulation over the little cell alone, because integrals add over
      adjacent intervals: any partition of $[a, x+h]$ can be refined to include
      the point $x$, after which its upper and lower sums split into a piece
      over $[a,x]$ and a piece over $[x, x+h]$, so
      $\int_a^{x+h} f = \int_a^x f + \int_x^{x+h} f$. The quotient is therefore
      $\dfrac{1}{h}\int_x^{x+h} f(t)\,dt$ — the *average value* of $f$ on a
      shrinking cell.

      Now squeeze, the load-bearing step. Take $h > 0$: the Extreme Value
      Theorem on the closed cell $[x, x+h]$ produces an attained minimum $m_h$
      and maximum $M_h$. The one-cell partition
      of $[x, x+h]$ already has lower sum $m_h\,h$ and upper sum $M_h\,h$, and
      the integral lies between any lower and upper sum, so
      $m_h\,h \le \int_x^{x+h} f \le M_h\,h$. Divide by the positive $h$:
      $m_h \le \dfrac{F(x+h) - F(x)}{h} \le M_h$. But $m_h$ and $M_h$ are
      values of $f$ at points within $h$ of $x$, so continuity at $x$ drives
      both to $f(x)$ as $h \to 0$, and the trapped quotient has nowhere else to
      go. Negative $h$ runs identically.

      Read the conclusion twice. As a computation it says
      $\dfrac{d}{dx}\int_a^x f(t)\,dt = f(x)$: differentiating an accumulation
      undoes it. As an existence theorem it says every continuous $f$ *has* an
      antiderivative — its own area-so-far function — which covers integrands
      like $e^{-x^2}$, for which no elementary antiderivative exists at all.
    worked: >
      Take $f(t) = t^2$ and $F(x) = \int_0^x t^2\,dt$, and check the theorem by
      computing $F$ outright. Partition $[0,x]$ uniformly with $t_i = ix/n$, so
      each cell has width $x/n$ and, $t^2$ being increasing on $[0,x]$ for
      $x > 0$, the upper sum is
      $U_n = \sum_{i=1}^{n}\left(\dfrac{ix}{n}\right)^2\dfrac{x}{n}
      = \dfrac{x^3}{n^3}\sum_{i=1}^{n} i^2
      = x^3\left(\dfrac{1}{3} + \dfrac{1}{2n} + \dfrac{1}{6n^2}\right)$,
      with the lower sum the same but with the middle sign flipped. The
      familiar squeeze gives $F(x) = \dfrac{x^3}{3}$. Now differentiate: the
      derivative of $x^3$ is $3x^2$, so $F'(x) = x^2 = f(x)$, exactly as
      promised. At $x = 2$: $F(2) = \dfrac{8}{3}$ and $F'(2) = 4 = f(2)$.
    pitfalls: >
      The variable of integration is a placeholder — writing
      $F(x) = \int_a^x f(x)\,dx$ uses $x$ for two different roles and makes the
      statement meaningless, so keep the dummy variable $t$. The conclusion is
      $F'(x) = f(x)$, the integrand evaluated at the upper limit, not
      $f(x) - f(a)$ and not anything involving $a$: changing the lower limit
      shifts $F$ by a constant and leaves $F'$ untouched. And continuity powers
      the squeeze: for an integrable but discontinuous $f$ the accumulation
      function still exists, but can fail to be differentiable where $f$ jumps.
    recap: >
      The difference quotient of $\int_a^x f$ is the average value of $f$ on a
      shrinking cell, and continuity squeezes that average to $f(x)$ — so every
      continuous function is the derivative of its own accumulation.
    steps:
      - teach: >
          Fix a continuous $f$ on $[a,b]$ and define
          $F(x) = \int_a^x f(t)\,dt$, the signed area collected so far. It is
          defined at every $x$ only because a continuous function on a closed
          bounded interval is integrable on each piece $[a,x]$.
      - teach: >
          Integrals add over adjacent intervals: refine any partition of
          $[a,x+h]$ to include the point $x$ and its sums split in two, giving
          $\int_a^{x+h} f = \int_a^x f + \int_x^{x+h} f$. So the numerator
          $F(x+h) - F(x)$ is exactly the accumulation over the little cell.
      - teach: >
          That makes $\dfrac{F(x+h) - F(x)}{h} = \dfrac{1}{h}\int_x^{x+h} f$,
          the *average value* of $f$ across a cell of width $h$. As $h$ shrinks
          the cell collapses onto $x$, and the average of nearby values of a
          continuous function ought to approach the value at $x$.
      - ask: >
          Which theorem supplies the numbers $m_h$ and $M_h$ that trap that
          average?
        choices:
          - text: >
              The Intermediate Value Theorem, since $f$ takes every value
              between its endpoints on the cell.
            feedback: >
              That theorem says which values are *hit* between two known ones.
              What the squeeze needs is a largest and a smallest value on the
              cell, which is a different guarantee.
          - text: >
              The Extreme Value Theorem, since $f$ is continuous on the closed
              cell $[x, x+h]$.
            correct: true
            feedback: >
              It hands you an attained minimum $m_h$ and maximum $M_h$ on the
              closed bounded cell. The one-cell partition then has lower sum
              $m_h h$ and upper sum $M_h h$, and the integral sits between
              them.
          - text: >
              The Mean Value Theorem, applied to $F$ on $[x, x+h]$.
            feedback: >
              That route needs to know $F$ is differentiable, which is the very
              thing being proved. The argument must not assume its own
              conclusion.
        feedback: >
          The Extreme Value Theorem is what converts continuity into concrete
          bounds on a cell, and it is the reason the closed interval hypothesis
          keeps reappearing.
      - teach: >
          Dividing $m_h\,h \le \int_x^{x+h} f \le M_h\,h$ by the positive $h$
          gives $m_h \le \dfrac{F(x+h)-F(x)}{h} \le M_h$. Both $m_h$ and $M_h$
          are values of $f$ at points within $h$ of $x$, so continuity forces
          them to $f(x)$ and the quotient is trapped: $F'(x) = f(x)$.
      - ask: >
          Let $F(x) = \int_0^x t^2\,dt$. What is $F'(2)$?
        expects: "4"
        hint: >
          The theorem says to evaluate the integrand at the upper limit.
        feedback: >
          $4$. By the theorem $F'(x) = x^2$, so $F'(2) = 4$. Computing $F$ the
          long way agrees: uniform partitions of $[0,x]$ give
          $F(x) = \dfrac{x^3}{3}$, whose derivative is $x^2$.
      - ask: >
          Let $G(x) = \int_1^x (t^3 + 1)\,dt$. What is $G'(2)$?
        expects: "9"
        hint: >
          Evaluate the integrand at $x = 2$; the lower limit plays no part.
        feedback: >
          $9$, since $G'(x) = x^3 + 1$ gives $G'(2) = 8 + 1 = 9$. Changing the
          lower limit from $1$ to anything else shifts $G$ by a constant, which
          has zero derivative — so the answer does not depend on it.
      - teach: >
          Read the conclusion the second way and it is an existence theorem:
          every continuous function on an interval has an antiderivative,
          namely its own accumulation function. That covers integrands like
          $e^{-x^2}$, which have no elementary antiderivative at all.
      - teach: >
          The pieces are now all on the table. There is an antiderivative for
          every continuous $f$, and any two antiderivatives on an interval
          differ by a constant. Putting those together turns integration into
          subtraction.

  - node: analysis.svc.ftc-part-2
    hook: >
      This is the rule that makes calculus computable: find any antiderivative,
      subtract its values at the two endpoints, and the integral is done — no
      partitions, no summation identities, no squeeze.
    explanation: >
      The statement is short and the word *any* is the point. If $f$ is
      continuous on $[a,b]$ and $F$ is an antiderivative of $f$ there, then
      $\int_a^b f(x)\,dx = F(b) - F(a)$. You may already assemble a proof from
      what you hold: the accumulation function is one antiderivative, any other
      differs from it by a constant on the interval, and the constant cancels
      in the subtraction. Worth seeing instead is the direct argument, because
      it shows *why* a difference of two values should equal a limit of
      rectangle sums.

      Take any partition $a = x_0 < x_1 < \cdots < x_n = b$ and telescope the
      total change of $F$ across it:
      $F(b) - F(a) = \sum_{i=1}^{n}\left[F(x_i) - F(x_{i-1})\right]$, since
      every interior value appears once with each sign. That identity is free.
      Now spend the Mean Value Theorem on each cell: $F$ is continuous on
      $[x_{i-1}, x_i]$ and differentiable inside, so there is a $c_i$ in the
      open cell with
      $F(x_i) - F(x_{i-1}) = F'(c_i)\,\Delta x_i = f(c_i)\,\Delta x_i$.

      Substituting back, $F(b) - F(a) = \sum_{i=1}^{n} f(c_i)\,\Delta x_i$ —
      and the right-hand side is a *Riemann sum* of $f$, with the tags $c_i$
      handed to you by the theorem rather than chosen. The identity holds for
      every partition whatsoever. Since $f$ is continuous it is integrable, so
      given $\varepsilon > 0$ some partition has $U - L < \varepsilon$; both
      the Riemann sum and the integral lie between $L$ and $U$, so
      $\left|F(b) - F(a) - \int_a^b f\right| < \varepsilon$. A non-negative
      quantity below every positive number is zero, and the two are equal.

      The hypotheses deserve respect precisely because the rule is so easy to
      apply: $F$ must be an antiderivative on the *whole* interval $[a,b]$.
      Strip that away and the arithmetic still produces a number, cheerfully
      and wrongly.
    worked: >
      Evaluate $\int_1^3 x^2\,dx$. An antiderivative of $x^2$ on $[1,3]$ is
      $F(x) = \dfrac{x^3}{3}$, since the derivative of $x^3$ is $3x^2$. So the
      integral is
      $F(3) - F(1) = \dfrac{27}{3} - \dfrac{1}{3} = \dfrac{26}{3}$, about
      $8.667$. Compare the effort with computing it from Riemann sums, which
      would need the sum-of-squares identity all over again on a shifted
      interval. Take a second one to see that constants really do cancel:
      $\int_0^2 (3x^2 - 2x)\,dx$ has antiderivative $F(x) = x^3 - x^2$, giving
      $F(2) - F(0) = (8 - 4) - 0 = 4$. Using $F(x) = x^3 - x^2 + 100$ instead
      gives $(8 - 4 + 100) - (0 + 100) = 4$ as well, because the constant
      appears in both terms of the subtraction.
    pitfalls: >
      The antiderivative must be valid across the entire interval of
      integration. Writing $\int_{-1}^{1} \dfrac{1}{x^2}\,dx = F(1) - F(-1)$
      with $F(x) = -\dfrac{1}{x}$ yields $-1 - 1 = -2$, a negative answer for a
      strictly positive integrand — because $F$ is an antiderivative on
      $(0,1]$ and on $[-1,0)$ but on no interval containing $0$, where the
      integrand is not even bounded. The rule also runs one way: a continuous
      function whose antiderivative cannot be written down still needs the
      accumulation function from Part I. And the order of
      subtraction is $F(b) - F(a)$; reversing it flips the sign of the answer.
    recap: >
      Telescoping the change of $F$ across a partition and spending the Mean
      Value Theorem on each cell turns $F(b) - F(a)$ into a Riemann sum of $f$,
      so the difference of endpoint values *is* the integral.
    steps:
      - teach: >
          The evaluation rule: if $f$ is continuous on $[a,b]$ and $F$ is any
          antiderivative of $f$ there, then
          $\int_a^b f(x)\,dx = F(b) - F(a)$. Integration becomes subtraction.
      - teach: >
          Here is why a difference of two values should equal a limit of
          rectangle sums. Take any partition and telescope:
          $F(b) - F(a) = \sum_{i=1}^{n}\left[F(x_i) - F(x_{i-1})\right]$, since
          every interior value cancels against itself.
      - ask: >
          Applying the Mean Value Theorem to $F$ on the cell
          $[x_{i-1}, x_i]$, what does $F(x_i) - F(x_{i-1})$ become?
        choices:
          - text: >
              $F'(x_i)\,\Delta x_i$, the derivative at the right endpoint times
              the width.
            feedback: >
              The Mean Value Theorem supplies an unspecified interior point,
              not an endpoint. Using the right endpoint would need an
              approximation argument the theorem does not provide.
          - text: >
              $f(c_i)\,\Delta x_i$ for some $c_i$ strictly inside the cell.
            correct: true
            feedback: >
              The theorem gives $F(x_i) - F(x_{i-1}) = F'(c_i)\Delta x_i$, and
              $F' = f$ turns that into $f(c_i)\Delta x_i$ — one rectangle, with
              its tag chosen for you.
          - text: >
              $f(x_i) - f(x_{i-1})$, the change in $f$ across the cell.
            feedback: >
              That is the change in $f$, not in $F$. The telescoping sum is
              built from values of $F$, and its cells contribute widths times
              heights, not differences of $f$.
        feedback: >
          Each cell of the telescoping sum turns into a rectangle whose tag the
          Mean Value Theorem hands you. This is the whole trick.
      - teach: >
          Summing those, $F(b) - F(a) = \sum_{i=1}^{n} f(c_i)\,\Delta x_i$: the
          left side is a fixed number, and the right side is a Riemann sum of
          $f$. The identity holds for *every* partition, which is what makes it
          decisive.
      - teach: >
          Finish with the Cauchy criterion. Since $f$ is continuous it is
          integrable, so some partition has $U - L < \varepsilon$. Both the
          Riemann sum and the integral lie between $L$ and $U$, so they differ
          by less than every $\varepsilon$ — hence not at all.
      - ask: >
          Evaluate $\int_1^3 x^2\,dx$.
        expects: "26/3"
        hint: >
          An antiderivative of $x^2$ is $\dfrac{x^3}{3}$.
        feedback: >
          $\dfrac{26}{3}$, about $8.667$. With $F(x) = \dfrac{x^3}{3}$ the rule
          gives $F(3) - F(1) = \dfrac{27}{3} - \dfrac{1}{3} = \dfrac{26}{3}$.
          Getting there from Riemann sums would mean redoing the
          sum-of-squares computation on a shifted interval.
      - ask: >
          Evaluate $\int_0^2 (3x^2 - 2x)\,dx$.
        expects: "4"
        hint: >
          Look for an $F$ with $F'(x) = 3x^2 - 2x$; the derivatives of $x^3$
          and $x^2$ are $3x^2$ and $2x$.
        feedback: >
          $4$. Take $F(x) = x^3 - x^2$, so $F(2) - F(0) = (8 - 4) - 0 = 4$.
          Using $F(x) = x^3 - x^2 + 100$ instead gives
          $(104) - (100) = 4$ as well — the constant appears in both terms and
          cancels, which is why "any antiderivative" is enough.
      - ask: >
          Applying the rule to $\int_{-1}^{1} \dfrac{1}{x^2}\,dx$ with
          $F(x) = -\dfrac{1}{x}$ gives $F(1) - F(-1) = -1 - 1 = -2$. What went
          wrong?
        choices:
          - text: >
              The antiderivative should have been $\dfrac{1}{x}$, and the sign
              was dropped.
            feedback: >
              The derivative of $-\dfrac{1}{x}$ really is $\dfrac{1}{x^2}$, so
              the candidate is correct where it is defined. The sign is not the
              problem.
          - text: >
              $F$ is an antiderivative on $(0,1]$ and on $[-1,0)$, but on no
              interval containing $0$, and the integrand is unbounded there.
            correct: true
            feedback: >
              The rule demands an antiderivative across the whole interval of
              integration. Here the domain is punctured at $0$, the integrand
              is not bounded, and the Riemann integral is not even defined —
              which is how a positive integrand produced a negative answer.
          - text: >
              The limits should have been reversed to $F(-1) - F(1)$.
            feedback: >
              That would give $+2$, which is no better: the integral does not
              exist at all, so no ordering of the endpoints produces a correct
              value.
        feedback: >
          The arithmetic always produces a number; only the hypotheses decide
          whether the number means anything. Check that the antiderivative
          works on the *entire* closed interval before subtracting.
      - teach: >
          With evaluation reduced to antidifferentiation, the remaining work is
          finding antiderivatives — and the first systematic method for that is
          the chain rule read backwards.

  - node: analysis.svc.u-sub
    hook: >
      The evaluation rule turned integration into a search for antiderivatives,
      and searching needs technique. This is the first and most useful one: the
      chain rule run in reverse, spotting an inner function sitting next to its
      own derivative.
    explanation: >
      The chain rule says that composing functions multiplies their rates:
      $(F \circ g)'(x) = F'(g(x))\,g'(x)$. The picture is local linear
      approximation twice over — a step $h$ at $x$ moves $g$ by about
      $g'(x)h$, and a step that size at $g(x)$ moves $F$ by about
      $F'(g(x))$ times it. Read that identity from
      right to left and it tells you which integrands are easy: anything of the
      form $f(g(x))\,g'(x)$ has a visible antiderivative once you can
      antidifferentiate $f$ alone.

      The proof of the substitution rule is that observation plus the
      evaluation rule twice. Suppose $g$ has a continuous derivative on $[a,b]$
      and $f$ is continuous on an interval containing all the values of $g$
      there. Part I of the Fundamental Theorem supplies an antiderivative $F$
      of $f$. The chain rule makes $F \circ g$ an antiderivative of the
      continuous integrand $f(g(x))\,g'(x)$, so evaluating gives
      $\int_a^b f(g(x))\,g'(x)\,dx = F(g(b)) - F(g(a))$. Evaluating the other
      integral gives
      $\int_{g(a)}^{g(b)} f(u)\,du = F(g(b)) - F(g(a))$ as well. Both equal the
      same difference, hence each other:
      $\int_a^b f(g(x))\,g'(x)\,dx = \int_{g(a)}^{g(b)} f(u)\,du$.

      In practice the bookkeeping is mechanical. Name the inner function
      $u = g(x)$, write $du = g'(x)\,dx$, and rewrite the integrand *entirely*
      in $u$ — no stray $x$ survives. Then transform the limits: $x = a$
      becomes $u = g(a)$ and $x = b$ becomes $u = g(b)$. Transforming the
      limits beats substituting back at the end: less work, and fewer sign
      errors.

      Nothing requires $g$ to be increasing or even one-to-one. The proof ran
      through antiderivatives, not through any geometric change of variables,
      so the formula holds regardless: with $g(x) = x^2 + 1$ on $[-1,1]$ both
      new limits are $2$, and an integral from $2$ to $2$ is $0$ — correct,
      since that integrand is odd.
    worked: >
      Evaluate $\int_0^2 2x\,(x^2 + 1)^3\,dx$. The inner function is
      $g(x) = x^2 + 1$, whose derivative $2x$ is sitting right there in the
      integrand, so set $u = x^2 + 1$ and $du = 2x\,dx$. Transform the limits
      with $g$ itself: $x = 0$ gives $u = 1$, and $x = 2$ gives $u = 5$. The
      integral becomes $\int_1^5 u^3\,du$, with no trace of $x$ left. An
      antiderivative of $u^3$ is $\dfrac{u^4}{4}$, since the derivative of
      $u^4$ is $4u^3$, so the evaluation rule gives
      $\dfrac{5^4}{4} - \dfrac{1^4}{4} = \dfrac{625 - 1}{4} = \dfrac{624}{4}
      = 156$. Sanity-check the size: on $[0,2]$ the factor $(x^2+1)^3$ runs
      from $1$ up to $125$, so a total in the low hundreds is entirely
      plausible.
    pitfalls: >
      Changing the variable without changing the limits is the standard
      wreckage: after substituting, $\int_0^2$ would mean "from $u = 0$ to
      $u = 2$", which is a different integral entirely. The factor $g'(x)$ must
      genuinely be present up to a constant — $\int_0^2 (x^2+1)^3\,dx$ has no
      $2x$ available and this technique simply does not apply to it. And every
      $x$ must disappear: an integrand left as a mixture of $u$ and $x$ has not
      been substituted, and no amount of manipulation of the limits will repair
      it.
    recap: >
      Because $F \circ g$ is an antiderivative of $f(g(x))g'(x)$, substituting
      $u = g(x)$ and carrying the limits to $g(a)$ and $g(b)$ turns an integral
      of that shape into a plain integral of $f$.
    steps:
      - teach: >
          The chain rule says composing multiplies rates:
          $(F \circ g)'(x) = F'(g(x))\,g'(x)$ — a step $h$ moves $g$ by about
          $g'(x)h$, and a step that size moves $F$ by about $F'(g(x))$ times
          it. Read backwards, it identifies a whole family of integrands with
          visible antiderivatives.
      - teach: >
          Precisely: with $F$ an antiderivative of $f$, the function
          $F \circ g$ is an antiderivative of $f(g(x))\,g'(x)$. So the
          evaluation rule turns $\int_a^b f(g(x))\,g'(x)\,dx$ into
          $F(g(b)) - F(g(a))$ — and that is also what
          $\int_{g(a)}^{g(b)} f(u)\,du$ evaluates to.
      - teach: >
          Hence the substitution rule
          $\int_a^b f(g(x))\,g'(x)\,dx = \int_{g(a)}^{g(b)} f(u)\,du$. In
          practice: set $u = g(x)$ and $du = g'(x)\,dx$, rewrite the integrand
          entirely in $u$, and send the limits through $g$.
      - ask: >
          For $\int_0^2 2x\,(x^2+1)^3\,dx$ with $u = x^2 + 1$, which integral
          do you get?
        choices:
          - text: >
              $\int_0^2 u^3\,du$
            feedback: >
              The integrand was transformed but the limits were not. After
              substituting, the endpoints must be the values of $u$, not the
              old values of $x$.
          - text: >
              $\int_1^5 u^3\,du$
            correct: true
            feedback: >
              $du = 2x\,dx$ absorbs the $2x$, and the limits travel through
              $g$: $x = 0$ gives $u = 1$ and $x = 2$ gives $u = 5$. No $x$
              survives, which is the sign the substitution is complete.
          - text: >
              $\int_1^5 2x\,u^3\,du$
            feedback: >
              The $2x$ has been counted twice — it is exactly what $du$
              replaces. Leaving an $x$ in an integral over $u$ means the
              substitution is unfinished.
        feedback: >
          Two things must change together: the integrand becomes a function of
          $u$ alone, and the limits become $g(a)$ and $g(b)$.
      - ask: >
          Now finish it: what is $\int_0^2 2x\,(x^2+1)^3\,dx$?
        expects: "156"
        hint: >
          Evaluate $\int_1^5 u^3\,du$ using the antiderivative
          $\dfrac{u^4}{4}$.
        feedback: >
          $156$. The substitution gives $\int_1^5 u^3\,du$, and
          $\dfrac{u^4}{4}$ is an antiderivative since the derivative of $u^4$
          is $4u^3$. So the value is
          $\dfrac{625}{4} - \dfrac{1}{4} = \dfrac{624}{4} = 156$.
      - teach: >
          The rule needs $g'$ actually present, up to a constant factor. The
          integrand $(x^2+1)^3$ on its own offers no $2x$, and this technique
          has nothing to say about it — a missing $g'$ cannot be conjured by
          multiplying and dividing by a function of $x$.
      - ask: >
          Using the same substitution, what is
          $\int_{-1}^{1} 2x\,(x^2+1)^3\,dx$?
        expects: "0"
        hint: >
          Send both limits through $g(x) = x^2 + 1$ and see where they land.
        feedback: >
          $0$. Both limits map to $u = 2$, giving $\int_2^2 u^3\,du = 0$. The
          answer is right for an independent reason — the integrand is odd and
          the interval symmetric — and it shows the rule does not need $g$ to
          be one-to-one, since the proof ran through antiderivatives rather
          than through any geometric change of variables.
      - teach: >
          That closes the loop. Limits defined continuity, continuity delivered
          the extreme and intermediate value theorems, those built the Mean
          Value Theorem, rectangles built the integral, and the Fundamental
          Theorem tied the two constructions together — with substitution as
          the first tool for exploiting it.
