unit: foundations.relations
opening: >
  A relation is the most permissive object in this part of the course: any set
  of ordered pairs at all. This unit shows how much structure falls out of that
  nearly empty definition once you start asking questions of the pairs — does
  every element stand in the relation to itself, does the relation read the same
  backwards, do two steps collapse into one? Three yes-answers give an
  equivalence relation, and the partition theorem says that such a relation *is*
  a way of cutting the set into pieces; quotients then turn "the same for
  present purposes" into literal equality, with the integers modulo $n$ as the
  worked case. Swap symmetry for antisymmetry instead and you get orders: Hasse
  diagrams, maximal versus greatest elements, bounds and suprema, well-orders,
  chains and Zorn's lemma. By the end you should be able to test any relation
  against the four properties, list the classes of an equivalence relation,
  check that a rule on a quotient is well posed, and read a finite order off its
  picture.
lessons:
  - node: foundations.relations.def-binary-relation
    hook: >
      Order, equality, divisibility, "has the same birthday as" — one definition
      covers all of them, and it is the one definition in this unit that asks
      for nothing at all.
    explanation: >
      You already know how to build the Cartesian product $A \times B$: the set
      of every ordered pair $(a,b)$ with $a \in A$ and $b \in B$. Picture it as
      a grid, one row per element of $A$ and one column per element of $B$. A
      binary relation is nothing more than a chosen set of cells in that grid —
      a subset $R \subseteq A \times B$. Saying that $a$ stands in the relation
      to $b$ is saying that the cell $(a,b)$ was chosen, and the compact way to
      write it is $aRb$.

      That is the entire definition, and its power is in what it refuses to
      require. No rule, no formula, no meaning: *any* subset counts. Take
      $A = B = \{1,2,3\}$ and pick the three cells $(1,2)$, $(2,3)$, $(1,3)$.
      That set is a relation. You may read it as "is smaller than" if you like,
      or as nothing at all — the object is the same either way. Because the
      definition asks so little, one notion covers $\le$ on $\mathbb{R}$,
      $\subseteq$ on the subsets of a set, divisibility on $\mathbb{Z}$ and
      "shares a birthday with" at once, and every property you meet later in
      this unit is a condition on *which* cells got chosen, nothing more.

      When $B = A$ the grid is square and one says $R$ is a relation *on* $A$.
      Two square relations deserve names now. The empty relation $\emptyset$
      chooses no cell: nothing is related to anything, and it is still a
      perfectly legitimate relation. The identity, or diagonal, relation
      $\Delta_A = \{(a,a) : a \in A\}$ chooses exactly the main diagonal, so
      each element is related to itself and to nothing else. Nearly everything
      that follows is measured against that diagonal.
    worked: >
      Let $A = \{1,2,3,4,5\}$ and define $aRb$ to mean $a + b = 6$. Walk the
      grid row by row. Row $1$: the partner must satisfy $b = 5$, giving
      $(1,5)$. Row $2$ gives $(2,4)$. Row $3$ needs $b = 3$, giving $(3,3)$ — a
      cell sitting on the diagonal. Row $4$ gives $(4,2)$ and row $5$ gives
      $(5,1)$. So $R = \{(1,5),(2,4),(3,3),(4,2),(5,1)\}$: five chosen cells out
      of the $25$ in $A \times A$. It is neither $\emptyset$ nor $\Delta_A$, and
      it meets $\Delta_A$ in the single pair $(3,3)$.
    pitfalls: >
      A relation *from* $A$ *to* $B$ and a relation *on* $A$ are different
      objects, and reflexivity, symmetry, antisymmetry and transitivity are
      only defined for the second kind — always name the set the relation
      lives on. Treating $aRb$ and $bRa$ as the same claim is the other
      standing error: the pairs are ordered, so $(1,2) \in R$ says exactly
      nothing about $(2,1)$. And the empty relation really is a relation;
      "no pairs at all" is a legitimate subset of $A \times B$, which is why
      it keeps reappearing as a counterexample.
    recap: >
      A binary relation is a subset of $A \times B$ — a chosen set of ordered
      pairs, with no further requirement of any kind.
    steps:
      - teach: >
          Comparison, equality, divisibility and "shares a birthday with" feel
          like four different kinds of thing. The point of this definition is
          that they are one kind of thing, and the way to see it is to stop
          asking what a relation *means* and ask only which pairs it holds.
      - teach: >
          Start from the Cartesian product $A \times B$ and picture it as a
          grid: one row per element of $A$, one column per element of $B$. A
          binary relation from $A$ to $B$ is a subset $R \subseteq A \times B$ —
          a chosen set of cells. Nothing else is required of the choice.
      - teach: >
          The shorthand $aRb$ means $(a,b) \in R$. When $B = A$ the grid is
          square and $R$ is called a relation *on* $A$, which is the case the
          rest of this unit lives in.
      - ask: >
          On $A = \{1,2,3,4\}$, let $aRb$ mean that $a$ divides $b$. How many
          ordered pairs does $R$ contain?
        expects: "8"
        hint: >
          Go row by row: for each $a$, list the elements of $A$ that $a$
          divides. Do not forget that every number divides itself.
        feedback: >
          Eight. Row $1$ contributes $(1,1),(1,2),(1,3),(1,4)$; row $2$
          contributes $(2,2),(2,4)$; row $3$ contributes $(3,3)$; row $4$
          contributes $(4,4)$. That is $4 + 2 + 1 + 1 = 8$ cells out of the
          $16$ in $A \times A$.
      - teach: >
          Two relations on $A$ are worth naming immediately. The empty relation
          $\emptyset$ chooses no cell, so nothing is related to anything. The
          diagonal relation $\Delta_A = \{(a,a) : a \in A\}$ chooses exactly the
          main diagonal — it is equality, written as a set of pairs.
      - ask: >
          How many different binary relations are there on a two-element set
          $A = \{1,2\}$?
        expects: "16"
        hint: >
          A relation is *any* subset of $A \times A$, and $A \times A$ has four
          elements. Counting relations is counting subsets.
        feedback: >
          Sixteen. $A \times A$ has $2 \cdot 2 = 4$ pairs, each cell is
          independently in or out, so there are $2^{4} = 16$ subsets and
          therefore $16$ relations. The count is that large precisely because
          the definition imposes no condition.
      - ask: >
          Which of these is *not* a binary relation on $A = \{1,2,3\}$?
        choices:
          - text: >
              $\emptyset$, the set with no pairs
            feedback: >
              The empty set is a subset of $A \times A$, so it is a relation —
              the one in which nothing is related to anything. It is a favourite
              source of counterexamples later.
          - text: >
              $\{(1,2),(2,1)\}$
            feedback: >
              Two cells of the grid, freely chosen. Nothing requires a relation
              to involve every element or to be built from a rule.
          - text: >
              $\{1,2,3\}$, the set $A$ itself
            correct: true
            feedback: >
              Its members are numbers, not ordered pairs, so it is not a subset
              of $A \times A$ and not a relation on $A$. A relation is always a
              set *of pairs*.
          - text: >
              $\{(1,1),(2,2),(3,3)\}$
            feedback: >
              That is $\Delta_A$, the diagonal relation — equality on $A$
              written out as pairs. Very much a relation.
        feedback: >
          Only $\{1,2,3\}$ fails, and it fails for a bookkeeping reason rather
          than a mathematical one: its elements are not pairs. Everything that
          *is* a set of pairs drawn from $A \times A$ qualifies.
      - teach: >
          Keep the grid picture. Everything ahead — inverses, composites,
          reflexivity, orders, equivalence — is a statement about which cells a
          relation contains, checked against the diagonal or against the cells
          of some other relation.

  - node: foundations.relations.def-domain-range
    hook: >
      A relation may ignore some of the set it starts from and pile several
      partners onto another element; naming the part it actually uses is what
      makes that freedom precise instead of vague.
    explanation: >
      A relation $R \subseteq A \times B$ is allowed to be lazy. Some elements
      of $A$ may appear in no pair at all, and some may appear in several. The
      two sets that record what actually happened are the domain
      $\operatorname{dom} R$, the elements of $A$ that show up as a *first*
      coordinate of some pair, and the range
      $\operatorname{ran} R$, the elements of $B$ that show up as a *second*
      coordinate. In grid language: the domain is the set of rows that contain
      at least one chosen cell, and the range is the set of columns that do.

      Both can be proper subsets, and that is exactly what separates a relation
      from a function. A function on $A$ must assign to every $a \in A$ exactly
      one partner — existence and uniqueness. A relation is required to do
      neither, so an element of $A$ may be related to nothing or to many things.
      Reading the domain off a relation is how you measure the first kind of
      failure.

      The same idea applied to a piece of $A$ gives the image of a subset. For
      $S \subseteq A$, write $R[S] = \{b \in B : (a,b) \in R$ for some
      $a \in S\}$ — the columns hit by the rows of $S$. Taking $S = A$ hits
      every column that is hit at all, so $\operatorname{ran} R = R[A]$; the
      range is a special case of the image, not a separate idea. And $R[S]$ can
      be empty even when $S$ is not, which is just the statement that $S$ might
      miss the domain entirely.
    worked: >
      Let $A = \{1,2,3,4\}$, $B = \{x,y,z\}$ and
      $R = \{(1,x),(1,y),(3,z)\}$. First coordinates used: $1$ and $3$, so
      $\operatorname{dom} R = \{1,3\}$ — the elements $2$ and $4$ are related to
      nothing, so the domain is a proper subset of $A$. Second coordinates hit:
      $x$, $y$ and $z$, so $\operatorname{ran} R = \{x,y,z\} = B$, and the range
      happens to be all of $B$ here. For the subset $S = \{1,2\}$, row $1$
      contributes $x$ and $y$ while row $2$ contributes nothing, so
      $R[S] = \{x,y\}$. For $S' = \{2,4\}$ neither row contributes anything, so
      $R[S'] = \emptyset$.
    pitfalls: >
      The domain is not the set you started with. $R \subseteq A \times B$ is a
      relation from $A$ to $B$ whatever $\operatorname{dom} R$ turns out to be,
      and writing $\operatorname{dom} R = A$ without checking is the standard
      slip. The image $R[S]$ is a subset of $B$, not of $A$ — it lives on the
      other side of the product — and $R[S] = \emptyset$ is a perfectly
      ordinary answer whenever $S$ misses the domain.
    recap: >
      The domain is the first coordinates a relation actually uses and the range
      the second coordinates it actually hits, and neither has to be everything.
    steps:
      - teach: >
          A relation is free to ignore elements and to double up. To say
          anything sharp about that freedom you need names for the part of $A$
          it uses and the part of $B$ it reaches.
      - teach: >
          $\operatorname{dom} R$ is the set of $a \in A$ appearing as a first
          coordinate of some pair of $R$; $\operatorname{ran} R$ is the set of
          $b \in B$ appearing as a second coordinate. In the grid: the rows with
          a chosen cell, and the columns with a chosen cell.
      - ask: >
          Let $A = \{1,2,3,4\}$, $B = \{x,y,z\}$ and
          $R = \{(1,x),(1,y),(3,z)\}$. How many elements does
          $\operatorname{dom} R$ have?
        expects: "2"
        hint: >
          List the first coordinates that appear, then throw away repeats.
        feedback: >
          Two. The first coordinates appearing are $1$, $1$ and $3$, so
          $\operatorname{dom} R = \{1,3\}$. The elements $2$ and $4$ of $A$ are
          related to nothing, and a relation is entitled to leave them out.
      - teach: >
          That example shows both freedoms at once. The element $1$ is related
          to two things, and the elements $2$ and $4$ are related to none —
          which is precisely why $R$ is a relation and not a function on $A$.
      - ask: >
          Which single change would make that $R$ a function from $A$ to $B$?
        choices:
          - text: >
              Add the pair $(2,z)$
            feedback: >
              That fixes one gap but not the other: $4$ is still related to
              nothing, and $1$ is still related to two things. A function needs
              *exactly* one partner for *every* element.
          - text: >
              Delete the pair $(1,y)$
            feedback: >
              Now $1$ has a unique partner, but $2$ and $4$ still have none, so
              the rule is still undefined at two elements of $A$.
          - text: >
              Delete $(1,y)$ and add partners for $2$ and $4$
            correct: true
            feedback: >
              Exactly one partner for every element of $A$ is the requirement,
              so both failures must be repaired: the duplicate on row $1$ and
              the two empty rows.
        feedback: >
          A function on $A$ demands existence *and* uniqueness of a partner for
          each element. Here row $1$ violates uniqueness and rows $2$ and $4$
          violate existence, so both have to be fixed.
      - teach: >
          The same counting applied to a piece of $A$ gives the image
          $R[S] = \{b \in B : (a,b) \in R$ for some $a \in S\}$ — the columns
          hit by the rows of $S$. Taking $S = A$ recovers the range, so
          $\operatorname{ran} R = R[A]$.
      - ask: >
          For the same $R$, how many elements does $R[\{1,2,4\}]$ have?
        expects: "2"
        hint: >
          Only rows in $\{1,2,4\}$ may contribute. Check each of those three
          rows for chosen cells.
        feedback: >
          Two. Row $1$ contributes $x$ and $y$; rows $2$ and $4$ contribute
          nothing at all; row $3$ is not allowed to contribute because $3$ is
          not in the subset. So $R[\{1,2,4\}] = \{x,y\}$.
      - teach: >
          So an image can be empty even when the subset is not, and the domain
          can be a proper part of $A$. Read both off the pairs — never assume
          the relation uses everything it was allowed to use.

  - node: foundations.relations.def-inverse-relation
    hook: >
      Reversing every pair is the cheapest operation in the subject, and it
      converts the two symmetry properties from statements about individual
      pairs into single inclusions between sets.
    explanation: >
      Given $R \subseteq A \times B$, turn every pair around: the inverse
      relation is $R^{-1} = \{(b,a) : (a,b) \in R\} \subseteq B \times A$.
      Equivalently, $bR^{-1}a$ holds exactly when $aRb$ does. In grid
      language you are transposing — reflecting the chosen cells across the
      main diagonal.

      Two consequences are immediate and worth having. Reversing twice
      restores every pair, so $(R^{-1})^{-1} = R$. And since first
      coordinates become second coordinates, $\operatorname{dom} R^{-1} =
      \operatorname{ran} R$ while $\operatorname{ran} R^{-1} =
      \operatorname{dom} R$ — the domain and range simply trade places.

      What is striking is the price: nothing. A relation always has an
      inverse. Compare this with inverting a function, where you need the
      function to hit everything once and only once before $f^{-1}$ is a
      function at all. The reason for the difference is that reversing pairs
      can create exactly the two defects a relation is allowed to have —
      several partners for one element, and elements with no partner — and a
      relation does not mind either. On $\mathbb{R}$ the inverse of $\le$ is
      $\ge$; the inverse of "is a parent of" is "is a child of"; and the
      inverse of $\Delta_A$ is $\Delta_A$ again.

      The payoff is how it compresses two later properties. Once you have
      $R^{-1}$, saying "the relation reads the same in both directions"
      becomes the single sentence $R = R^{-1}$, and saying "no two distinct
      elements are related both ways" becomes $R \cap R^{-1} \subseteq
      \Delta_A$. Both properties become facts about how $R$ sits relative to
      its own transpose.
    worked: >
      Let $A = \{1,2,3\}$ and $R = \{(1,2),(2,3),(1,3),(3,1)\}$. Reversing each
      pair in turn gives $(2,1)$, $(3,2)$, $(3,1)$ and $(1,3)$, so
      $R^{-1} = \{(2,1),(3,2),(3,1),(1,3)\}$. Check the bookkeeping:
      $\operatorname{dom} R = \{1,2,3\}$ and $\operatorname{ran} R =
      \{1,2,3\}$, and the same two sets come back for $R^{-1}$, as they must.
      Now intersect. Of the four pairs of $R$, the pair $(1,2)$ is not in
      $R^{-1}$ and $(2,3)$ is not either, while $(1,3)$ is (because
      $(3,1) \in R$) and $(3,1)$ is (because $(1,3) \in R$). So
      $R \cap R^{-1} = \{(1,3),(3,1)\}$ — the two-way ties, and there are
      exactly two of them.
    pitfalls: >
      $R^{-1}$ is a relation from $B$ to $A$, not from $A$ to $B$; writing
      $R^{-1} \subseteq A \times B$ makes every later inclusion nonsense.
      And the notation is borrowed from functions but the guarantee is not:
      $R^{-1}$ always exists as a relation even when $R$ is nothing like
      invertible as a function, so reversing gives you a companion relation,
      never a guarantee that following one relation after the other returns
      you where you started.
    recap: >
      The inverse of a relation reverses every pair, always exists, swaps domain
      with range, and is the object against which symmetry and antisymmetry are
      stated.
    steps:
      - teach: >
          Take a relation and reverse every pair:
          $R^{-1} = \{(b,a) : (a,b) \in R\}$. In the grid this is a transpose —
          reflect the chosen cells across the main diagonal.
      - teach: >
          Two facts fall out at once. Reversing twice gives back what you
          started with, so $(R^{-1})^{-1} = R$; and first coordinates become
          second coordinates, so $\operatorname{dom} R^{-1} =
          \operatorname{ran} R$ and $\operatorname{ran} R^{-1} =
          \operatorname{dom} R$.
      - ask: >
          On $\mathbb{R}$, what is the inverse of the relation $\le$?
        choices:
          - text: >
              $<$
            feedback: >
              Reversing pairs never deletes any. The pair $(3,3)$ lies in $\le$,
              so $(3,3)$ lies in the inverse too, and $3 < 3$ is false.
          - text: >
              $\ge$
            correct: true
            feedback: >
              $(x,y)$ lies in the inverse exactly when $(y,x)$ lies in $\le$,
              that is when $y \le x$ — which is $x \ge y$.
          - text: >
              $\le$ again
            feedback: >
              That would say $x \le y$ and $y \le x$ hold together for all
              reals, which fails already for $x = 1$, $y = 2$. Only relations
              equal to their own inverse behave that way.
          - text: >
              $\ne$
            feedback: >
              Inverting rearranges pairs, it does not negate the condition.
              Negating $\le$ would give $>$, and even that is not what inversion
              does.
        feedback: >
          The inverse of $\le$ is $\ge$. Reversing the pairs of an order flips
          the direction of the comparison and changes nothing else.
      - teach: >
          Inverting costs nothing. Every relation has an inverse, with no
          hypothesis at all — unlike a function, which needs to hit every target
          exactly once before its inverse is a function.
      - teach: >
          The reason is that reversal can only introduce the two defects a
          relation is permitted to have: an element with several partners and an
          element with none. A function forbids both; a relation does not care.
      - ask: >
          Let $S = \{(1,1),(1,2),(2,3),(3,2)\}$ on $\{1,2,3\}$. How many pairs
          does $S \cap S^{-1}$ contain?
        expects: "3"
        hint: >
          Write out $S^{-1}$ first, then test the four pairs of $S$ one at a
          time for membership in it.
        feedback: >
          Three. Reversing gives $S^{-1} = \{(1,1),(2,1),(3,2),(2,3)\}$. Testing
          each pair of $S$: $(1,1)$ is in $S^{-1}$; $(1,2)$ is not, since
          $(2,1) \notin S$; $(2,3)$ is, since $(3,2) \in S$; and $(3,2)$ is,
          since $(2,3) \in S$. So $S \cap S^{-1} = \{(1,1),(2,3),(3,2)\}$.
      - teach: >
          That intersection is the point of the whole construction. $R \cap
          R^{-1}$ collects exactly the two-way ties, so "reads the same in both
          directions" will be $R = R^{-1}$ and "no two-way tie between distinct
          elements" will be $R \cap R^{-1} \subseteq \Delta_A$.
      - ask: >
          Which relation satisfies $R = R^{-1}$?
        choices:
          - text: >
              $\subseteq$ on the subsets of $\{1,2\}$
            feedback: >
              $\emptyset \subseteq \{1\}$ holds while $\{1\} \subseteq
              \emptyset$ does not, so this relation and its inverse differ on
              that pair.
          - text: >
              $\Delta_A$ on any set $A$
            correct: true
            feedback: >
              Reversing $(a,a)$ gives $(a,a)$ back, so the diagonal is fixed by
              inversion. Equality is the same relation read either way.
          - text: >
              "is a parent of" on a set of people
            feedback: >
              Its inverse is "is a child of", a genuinely different relation —
              no one is both parent and child of the same person.
        feedback: >
          $\Delta_A$ equals its own inverse, because every one of its pairs is
          its own reversal. The other two are directional, and inverting them
          produces a visibly different relation.

  - node: foundations.relations.def-composition
    hook: >
      Composition is how you say "two steps" in the language of pairs, and it is
      the operation that will let transitivity be written as a single inclusion
      rather than a sentence about triples.
    explanation: >
      Suppose $R$ relates $A$ to $B$ and $S$ relates $B$ to $C$. You can chain
      them: go from $a$ to some $b$ by an $R$-step, then from that $b$ to $c$ by
      an $S$-step. The pairs reachable this way form the composite
      $S \circ R = \{(a,c) \in A \times C :$ there is some $b \in B$ with
      $(a,b) \in R$ and $(b,c) \in S\}$. The intermediate $b$ is existentially
      quantified — it only has to exist, and different intermediates may produce
      the same pair $(a,c)$.

      The notation reads right to left, matching the convention for functions:
      in $S \circ R$ you take the $R$-step first. That is a nuisance to
      remember and worth the trouble, because composing the pair-sets of two
      functions really does produce the pair-set of their composite, so one
      convention serves both.

      Two structural facts. Composition is associative,
      $T \circ (S \circ R) = (T \circ S) \circ R$ — both sides say "there exist
      intermediates $b$ and $c$ making the three steps fit", and the bracketing
      only changes which existential you write first. Diagonal relations are
      neutral: $R \circ \Delta_A = R = \Delta_B \circ R$, since an $R$-step
      preceded or followed by "stay put" is an $R$-step. Composition is *not*
      commutative, and usually $R \circ S$ is not even a legal expression.

      Writing $R^n$ for $R$ composed with itself $n$ times, $aR^nb$ says that
      $b$ is reachable from $a$ in exactly $n$ $R$-steps. If $R$ is "is a parent
      of", then $R^2$ is "is a grandparent of". That reading is the one to hold:
      powers count steps.
    worked: >
      Let $A = \{1,2,3\}$, $B = \{x,y\}$, $C = \{p,q\}$, with
      $R = \{(1,x),(2,x),(2,y)\}$ and $S = \{(x,p),(y,q)\}$. Take each pair of
      $R$ and follow it. From $(1,x)$ the only $S$-step out of $x$ is $(x,p)$,
      giving $(1,p)$. From $(2,x)$ the same $S$-step gives $(2,p)$. From
      $(2,y)$ the $S$-step $(y,q)$ gives $(2,q)$. Element $3$ starts nothing, so
      it contributes nothing. Hence $S \circ R = \{(1,p),(2,p),(2,q)\}$, three
      pairs. Note that $2$ reaches two elements of $C$ even though it took only
      two steps to get there — composition preserves the right to have several
      partners.
    pitfalls: >
      The order trips everyone: $S \circ R$ takes the $R$-step first, so the
      relation written on the right acts first. Composing in the other order is
      usually not even defined, since the sets do not line up. The second trap
      is the quantifier: $(a,c) \in S \circ R$ needs *some* intermediate $b$,
      not every $b$, so a single valid route is enough to put the pair in.
    recap: >
      $S \circ R$ collects the pairs joined by an $R$-step followed by an
      $S$-step, and $R^n$ collects what is reachable in exactly $n$ steps.
    steps:
      - teach: >
          Relations chain. If $R$ takes you from $A$ into $B$ and $S$ takes you
          from $B$ into $C$, then "an $R$-step followed by an $S$-step" is
          itself a relation from $A$ to $C$.
      - teach: >
          Written out: $S \circ R = \{(a,c) :$ there is some $b$ with
          $(a,b) \in R$ and $(b,c) \in S\}$. The intermediate $b$ only has to
          exist. The right-to-left order matches the convention for functions —
          the relation on the right acts first.
      - ask: >
          With $R = \{(1,x),(2,x),(2,y)\}$ and $S = \{(x,p),(y,q)\}$, how many
          pairs does $S \circ R$ contain?
        expects: "3"
        hint: >
          Take each pair of $R$ in turn and see which $S$-steps continue from
          its second coordinate.
        feedback: >
          Three. $(1,x)$ then $(x,p)$ gives $(1,p)$; $(2,x)$ then $(x,p)$ gives
          $(2,p)$; $(2,y)$ then $(y,q)$ gives $(2,q)$. The element $3$ starts no
          $R$-step, so it contributes nothing:
          $S \circ R = \{(1,p),(2,p),(2,q)\}$.
      - teach: >
          Composing a relation on $A$ with itself gives powers. $R^{n}$ holds of
          $(a,b)$ exactly when $b$ is reachable from $a$ in exactly $n$
          $R$-steps — so if $R$ is "is a parent of", then $R^{2}$ is "is a
          grandparent of".
      - ask: >
          Let $R = \{(1,2),(2,3),(3,4)\}$ on $\{1,2,3,4\}$. How many pairs does
          $R^{2}$ contain?
        expects: "2"
        hint: >
          Which elements can you reach by taking two arrows in a row? Try
          starting at each of $1$, $2$, $3$, $4$.
        feedback: >
          Two. From $1$ you reach $2$ then $3$, giving $(1,3)$; from $2$ you
          reach $3$ then $4$, giving $(2,4)$; from $3$ the second step would
          have to leave $4$, and nothing does. So $R^{2} = \{(1,3),(2,4)\}$.
      - ask: >
          For that same $R$, how many pairs does $R^{3}$ contain?
        expects: "1"
        hint: >
          Compose $R^{2}$ with one more $R$-step, or count three-arrow paths
          directly.
        feedback: >
          One. Composing $R^{2} = \{(1,3),(2,4)\}$ with $R$: from $(1,3)$ the
          step $(3,4)$ continues, giving $(1,4)$; from $(2,4)$ nothing leaves
          $4$. So $R^{3} = \{(1,4)\}$, and $R^{4}$ is empty — the chain runs out
          after three steps.
      - teach: >
          Composition is associative, and the diagonal is neutral:
          $R \circ \Delta_A = R = \Delta_B \circ R$, because an $R$-step with
          "stay put" attached at either end is just an $R$-step.
      - ask: >
          What does the inclusion $R \circ R \subseteq R$ say about a relation
          $R$ on $A$?
        choices:
          - text: >
              Everything reachable in two steps is already reachable in one
            correct: true
            feedback: >
              $R \circ R$ is exactly the two-step reachability relation, so the
              inclusion says every two-step route has a one-step shortcut. This
              is transitivity, and it is how the property will be stated.
          - text: >
              Every element is related to itself
            feedback: >
              That is the diagonal condition $\Delta_A \subseteq R$, a different
              inclusion entirely — it constrains the pairs $(a,a)$, not the
              two-step routes.
          - text: >
              $R$ is equal to its own inverse
            feedback: >
              That is $R = R^{-1}$, about reversing pairs rather than chaining
              them. Composition and inversion are different operations.
        feedback: >
          $R \circ R$ collects the two-step pairs, so the inclusion says every
          such pair is already a one-step pair — chains collapse. That single
          inclusion is the whole content of transitivity.

  - node: foundations.relations.def-reflexive
    hook: >
      Reflexivity looks like the most trivial of the four properties, and it is
      the only one that can change its answer without a single pair changing —
      because it depends on the set, not just on the relation.
    explanation: >
      A relation $R$ on $A$ is reflexive if $aRa$ for every $a \in A$. Since
      $\Delta_A$ is precisely the set of pairs $(a,a)$, the condition compresses
      to a single inclusion: $\Delta_A \subseteq R$. Reflexivity says the
      relation contains the whole diagonal.

      At the opposite extreme, $R$ is irreflexive if $aRa$ holds for *no*
      $a \in A$, that is, if $R \cap \Delta_A = \emptyset$: the relation misses
      the diagonal entirely. These two conditions are not negations of each
      other, and this is where most errors start. "Not reflexive" only says the
      diagonal is not wholly contained; "irreflexive" says it is wholly avoided.
      On $A = \{1,2\}$ the relation $\{(1,1)\}$ contains part of the diagonal
      and not all of it, so it is neither reflexive nor irreflexive. Most
      relations are neither.

      Reflexivity is the one property of the four that is not determined by the
      pairs alone. Symmetry, antisymmetry and transitivity are conditions on
      pairs already present; reflexivity is a demand that certain pairs be
      present, one for every element of the ambient set. So the same set of
      pairs can change its answer when you change the set it is regarded as
      living on. That single relation $\{(1,1)\}$ is reflexive on $\{1\}$ and
      not reflexive on $\{1,2\}$ — the pairs never moved. This is why the set is
      always named alongside the relation: "reflexive" is meaningless without
      it.

      The standard cases to keep: $\le$ on $\mathbb{R}$ and $\subseteq$ on
      subsets are reflexive, since $x \le x$ and $S \subseteq S$ always; strict
      inequality and proper inclusion are irreflexive; and the empty relation on
      a nonempty set is irreflexive, while on the empty set it is vacuously
      reflexive.
    worked: >
      Take $A = \{1,2,3\}$ and $R = \{(1,1),(2,2),(1,2),(2,1)\}$. Test
      reflexivity element by element: $(1,1) \in R$, yes; $(2,2) \in R$, yes;
      $(3,3) \in R$? No. One failure is enough, so $R$ is not reflexive on $A$.
      Test irreflexivity: it needs *no* diagonal pair, and $(1,1)$ is present, so
      that fails too. On $A$, then, $R$ is neither reflexive nor irreflexive.
      Now regard the very same four pairs as a relation on $A' = \{1,2\}$.
      Now $\Delta_{A'} = \{(1,1),(2,2)\}$ is contained in $R$, so $R$ *is*
      reflexive on $A'$. Same pairs, different answer.
    pitfalls: >
      "Not reflexive" and "irreflexive" are different claims, and a relation
      missing one diagonal pair while containing another is neither. Checking
      reflexivity on the elements that happen to appear in $R$ rather than on
      every element of $A$ is the concrete form of the mistake — the element $3$
      above never appears in a pair, and it is exactly the one that breaks the
      property. And on a nonempty set the empty relation is irreflexive, not
      reflexive.
    recap: >
      Reflexive means $\Delta_A \subseteq R$, irreflexive means $R$ meets
      $\Delta_A$ nowhere, and both answers depend on which ambient set you name.
    steps:
      - teach: >
          $R$ on $A$ is reflexive if $aRa$ for every $a \in A$. Since $\Delta_A$
          is exactly the set of pairs $(a,a)$, that is one inclusion:
          $\Delta_A \subseteq R$ — the relation swallows the whole diagonal.
      - teach: >
          It is irreflexive if $aRa$ for no $a \in A$, that is
          $R \cap \Delta_A = \emptyset$ — the relation avoids the diagonal
          completely. Containing all of it and containing none of it are the two
          extremes, and most relations do neither.
      - ask: >
          Is $R = \{(1,1)\}$ on $A = \{1,2\}$ reflexive, irreflexive, both, or
          neither?
        choices:
          - text: >
              Reflexive
            feedback: >
              Reflexivity demands a pair $(a,a)$ for *every* element, and
              $(2,2)$ is missing. Checking only the elements that appear in $R$
              is the standard way to reach this wrong answer.
          - text: >
              Irreflexive
            feedback: >
              Irreflexivity demands that *no* diagonal pair appear, and $(1,1)$
              is right there. The relation touches the diagonal, so it cannot be
              irreflexive.
          - text: >
              Neither
            correct: true
            feedback: >
              It contains part of the diagonal and not all of it: $(1,1)$ is in,
              $(2,2)$ is out. The two properties are not negations of one
              another, so "neither" is a perfectly common verdict.
        feedback: >
          Neither. Reflexive needs the whole diagonal, irreflexive needs none of
          it, and $\{(1,1)\}$ on $\{1,2\}$ sits between the two.
      - ask: >
          A reflexive relation on a five-element set must contain at least how
          many ordered pairs?
        expects: "5"
        hint: >
          Which pairs are forced by the definition, before any others are
          chosen?
        feedback: >
          Five. Reflexivity forces $\Delta_A \subseteq R$, and $\Delta_A$ has
          one pair per element, so $|\Delta_A| = 5$. Nothing else is forced —
          $\Delta_A$ itself is a reflexive relation with exactly those five
          pairs.
      - teach: >
          Reflexivity is the odd one out among the four properties: it demands
          that certain pairs be *present*, one for each element of the ambient
          set, where the other three only constrain pairs already there.
      - teach: >
          So the same set of pairs can change its verdict when you change the
          set. $\{(1,1)\}$ is reflexive as a relation on $\{1\}$ and not
          reflexive as a relation on $\{1,2\}$, with no pair moving. That is why
          the set is always named alongside the relation.
      - ask: >
          How many reflexive relations are there on $A = \{1,2\}$?
        expects: "4"
        hint: >
          Two of the four cells of $A \times A$ are forced. What happens to the
          other two?
        feedback: >
          Four. The diagonal pairs $(1,1)$ and $(2,2)$ must be in, and the
          off-diagonal cells $(1,2)$ and $(2,1)$ are free, so there are
          $2^{2} = 4$ choices. That is a quarter of the $16$ relations on
          $\{1,2\}$.
      - teach: >
          Keep the reference cases: $\le$ on $\mathbb{R}$ and $\subseteq$ on
          subsets are reflexive; strict inequality and proper inclusion are
          irreflexive; and on a nonempty set the empty relation is irreflexive,
          never reflexive.

  - node: foundations.relations.def-symmetric
    hook: >
      Symmetry is the property that lets you stop drawing arrowheads — and,
      stated through the inverse, it turns out to need only half as much
      checking as the definition suggests.
    explanation: >
      A relation $R$ on $A$ is symmetric if $aRb$ implies $bRa$, for all
      $a, b \in A$. Whenever a pair is present, so is its reversal. Nothing is
      claimed about which pairs are present in the first place: the empty
      relation is symmetric because the implication never gets a chance to fail.

      Now recall the inverse. $R^{-1}$ is exactly the set of reversed pairs, so
      "every pair of $R$ has its reversal in $R$" is the inclusion
      $R \subseteq R^{-1}$. Here is the pleasant part: that one inclusion
      already forces the other. Inverting preserves inclusions — reversing every
      pair of a smaller set gives a subset of the reversals of a larger one — so
      from $R \subseteq R^{-1}$ we get $R^{-1} \subseteq (R^{-1})^{-1}$, and
      $(R^{-1})^{-1} = R$. So $R^{-1} \subseteq R$ as well, and symmetry is
      equivalently the equality $R = R^{-1}$. You never have to check both
      directions.

      The picture is the reason the property matters. Draw the elements as dots
      and each pair as an arrow. A symmetric relation has its arrows in matched
      pairs, so you may erase the arrowheads and draw plain undirected edges
      with no loss of information. Directed structure has vanished, which is
      exactly what you want from a notion of "alike".

      Equality, "shares a birthday with", and "differs by less than $1$" on
      $\mathbb{R}$ are symmetric. Order relations are not: $1 \le 2$ holds and
      $2 \le 1$ fails, so $\le$ and $\subseteq$ and "is a parent of" all carry
      genuine direction.
    worked: >
      Let $A = \{1,2,3\}$ and $R = \{(1,2),(2,1),(1,3),(3,3)\}$. Check the pairs
      one at a time. $(1,2)$ needs $(2,1)$: present. $(2,1)$ needs $(1,2)$:
      present. $(1,3)$ needs $(3,1)$: *absent*. One failure settles it — $R$ is
      not symmetric. Repair it by adding $(3,1)$, giving
      $R' = \{(1,2),(2,1),(1,3),(3,1),(3,3)\}$, and now every pair has its
      reversal, so $R'$ is symmetric. Confirm through the inverse: reversing all
      five pairs of $R'$ gives $(2,1),(1,2),(3,1),(1,3),(3,3)$ — the same five
      pairs, so $R' = (R')^{-1}$.
    pitfalls: >
      Symmetry is an implication and not a promise that pairs exist, so a
      relation holding very few pairs satisfies it easily. Checking only
      some of the pairs is the standing slip — a single pair whose reversal
      is missing settles the question against, so the test has to run over
      all of them. A relation is also symmetric *vacuously* when it has no
      pairs at all, so the empty relation is symmetric on every set. And the
      diagonal pairs never obstruct symmetry, since $(a,a)$ is its own
      reversal.
    recap: >
      Symmetric means every pair comes with its reversal, equivalently
      $R = R^{-1}$, and it is exactly the condition that lets you erase
      arrowheads.
    steps:
      - teach: >
          $R$ on $A$ is symmetric if $aRb$ implies $bRa$ for all $a$ and $b$:
          whenever a pair is present, so is its reversal. Notice the definition
          says nothing about which pairs are present to begin with.
      - teach: >
          Since $R^{-1}$ is precisely the set of reversed pairs, symmetry is the
          inclusion $R \subseteq R^{-1}$ — a statement about two sets rather
          than about individual pairs.
      - teach: >
          That one inclusion forces the other. Inverting preserves inclusions,
          so $R \subseteq R^{-1}$ gives $R^{-1} \subseteq (R^{-1})^{-1}$, and
          $(R^{-1})^{-1} = R$. Hence symmetry is the equality $R = R^{-1}$, and
          one direction of checking suffices.
      - ask: >
          On $A = \{1,2,3\}$, start from $R = \{(1,2),(2,3)\}$. How many pairs
          must be added to make it symmetric?
        expects: "2"
        hint: >
          Each present pair needs its reversal. Check whether either reversal is
          already there.
        feedback: >
          Two. $(1,2)$ needs $(2,1)$ and $(2,3)$ needs $(3,2)$, and neither is
          present. Adding both gives $\{(1,2),(2,1),(2,3),(3,2)\}$, which is
          symmetric — and note that no diagonal pair was needed, since symmetry
          asks nothing about $(a,a)$.
      - teach: >
          Draw the elements as dots and the pairs as arrows. In a symmetric
          relation every arrow is matched by its reverse, so you may erase the
          arrowheads and keep plain undirected edges. All directional
          information is gone, which is what a notion of "alike" should look
          like.
      - ask: >
          How many symmetric relations are there on $A = \{1,2\}$?
        expects: "8"
        hint: >
          The two diagonal cells are unconstrained. The two off-diagonal cells
          are not independent — what does symmetry force about them?
        feedback: >
          Eight. The cells $(1,1)$ and $(2,2)$ are each freely in or out, giving
          $2^{2}$ choices. The cells $(1,2)$ and $(2,1)$ must be in or out
          together, contributing one more factor of $2$. So
          $2^{2} \cdot 2 = 8$ of the $16$ relations on $\{1,2\}$ are symmetric.
      - ask: >
          Which relation is symmetric?
        choices:
          - text: >
              $\subseteq$ on the subsets of $\{1,2\}$
            feedback: >
              $\emptyset \subseteq \{1\}$ holds and $\{1\} \subseteq \emptyset$
              fails, so a pair is present without its reversal. Inclusion is
              directional.
          - text: >
              The empty relation on $\{1,2,3\}$
            correct: true
            feedback: >
              Vacuously symmetric: there is no pair whose reversal could be
              missing. The empty relation satisfies $R = R^{-1}$ trivially, and
              it will keep turning up as a counterexample precisely because it
              satisfies so much for free.
          - text: >
              "is a parent of" on a set of people
            feedback: >
              Its reversal is "is a child of", a different relation. If $a$ is a
              parent of $b$ then $b$ is certainly not a parent of $a$.
        feedback: >
          The empty relation. Symmetry is an implication with no pairs to
          trigger it there, so it holds for free — while both order-like
          relations carry direction and fail.

  - node: foundations.relations.def-antisymmetric
    hook: >
      Antisymmetry is the single condition that stops an order from having
      cycles, and almost everyone first meets it by mistaking it for the
      negation of symmetry.
    explanation: >
      A relation $R$ on $A$ is antisymmetric if $aRb$ and $bRa$ together force
      $a = b$. Read it as a prohibition: no *two-way tie between distinct
      elements*. If $a$ sits at or below $b$ and $b$ sits at or below $a$, then
      there was only ever one element there.

      In inverse language this is compact. The pairs present in both directions
      are exactly the pairs of $R \cap R^{-1}$, and demanding that each such
      pair have equal coordinates is demanding
      $R \cap R^{-1} \subseteq \Delta_A$. Compare that with symmetry, which was
      $R = R^{-1}$. Both conditions compare $R$ with its transpose, but they ask
      completely different things of it.

      They are not negations. A relation whose two-way ties all happen to sit on
      the diagonal satisfies both: $\Delta_A$ itself is symmetric *and*
      antisymmetric, and so is any subset of the diagonal. Going the other way,
      $\{(1,2),(2,1),(1,3)\}$ on $\{1,2,3\}$ is neither — the tie between $1$
      and $2$ kills antisymmetry, and the unmatched $(1,3)$ kills symmetry. So
      each of the four combinations is possible.

      Why it matters: antisymmetry is what turns "reachable from" into a genuine
      ranking. Without it you could have distinct $a$ and $b$ each at most the
      other, and no consistent way to place them. The standard cases are $\le$
      on $\mathbb{R}$ and $\subseteq$ on subsets, both antisymmetric. The
      instructive one is divisibility: on $\mathbb{N}$ it is antisymmetric,
      since $a \mid b$ and $b \mid a$ force $a = b$; on $\mathbb{Z}$ it is not,
      because $2 \mid -2$ and $-2 \mid 2$ while $2 \ne -2$. Changing the
      ambient set changed the answer.
    worked: >
      Let $A = \{1,2,3\}$ and $R = \{(1,1),(1,2),(2,3),(1,3)\}$. To test
      antisymmetry, hunt for two-way ties: for each pair $(a,b)$ in $R$ with
      $a \ne b$, ask whether $(b,a)$ is also in $R$. $(1,2)$: is $(2,1)$ in
      $R$? No. $(2,3)$: is $(3,2)$ in $R$? No. $(1,3)$: is $(3,1)$ in $R$? No.
      No off-diagonal tie exists, so $R$ is antisymmetric. Cross-check through
      the inverse: $R^{-1} = \{(1,1),(2,1),(3,2),(3,1)\}$, and
      $R \cap R^{-1} = \{(1,1)\}$, which does sit inside $\Delta_A$. Note in
      passing that $R$ is not symmetric and not reflexive, so antisymmetry is
      genuinely independent of both.
    pitfalls: >
      Antisymmetric does not mean "not symmetric": $\Delta_A$ is both, and
      plenty of relations are neither. The diagonal pairs are never a problem —
      $(a,a)$ together with $(a,a)$ forces $a = a$, which is true — so only
      off-diagonal ties can ever break the property. And the property depends on
      the ambient set: divisibility is antisymmetric on $\mathbb{N}$ and fails
      on $\mathbb{Z}$, where $2$ and $-2$ divide each other.
    recap: >
      Antisymmetric forbids a two-way tie between distinct elements, that is,
      $R \cap R^{-1} \subseteq \Delta_A$ — and it is not the negation of
      symmetry.
    steps:
      - teach: >
          $R$ on $A$ is antisymmetric if $aRb$ and $bRa$ together force
          $a = b$. Read it as a prohibition: no two-way tie between two
          *distinct* elements.
      - teach: >
          The pairs present in both directions are exactly those of
          $R \cap R^{-1}$, so the condition is
          $R \cap R^{-1} \subseteq \Delta_A$. Symmetry was $R = R^{-1}$: both
          compare $R$ with its transpose, and they ask for entirely different
          things.
      - ask: >
          Is $\Delta_A = \{(1,1),(2,2)\}$ on $A = \{1,2\}$ symmetric,
          antisymmetric, both, or neither?
        choices:
          - text: >
              Symmetric only
            feedback: >
              It is symmetric, but check antisymmetry too: the only two-way ties
              are $(1,1)$ with itself and $(2,2)$ with itself, and those have
              equal coordinates, so nothing is violated.
          - text: >
              Antisymmetric only
            feedback: >
              It is antisymmetric, but every pair $(a,a)$ is its own reversal,
              so the relation also equals its own inverse and is symmetric.
          - text: >
              Both
            correct: true
            feedback: >
              Each diagonal pair is its own reversal, giving symmetry, and the
              only two-way ties have equal coordinates, giving antisymmetry.
              This is the standard proof that the two properties are not
              negations.
          - text: >
              Neither
            feedback: >
              Both conditions in fact hold. The mistake is usually reading
              "anti-" as "not", which would make "both" impossible.
        feedback: >
          Both, and that is the whole point. Any subset of the diagonal is
          symmetric and antisymmetric at once, so the two properties are
          independent rather than opposite.
      - ask: >
          How many relations on $A = \{1,2\}$ are symmetric and antisymmetric at
          the same time?
        expects: "4"
        hint: >
          Symmetry forces the two off-diagonal cells in together; antisymmetry
          forbids them from both being in. What is left?
        feedback: >
          Four. If $(1,2)$ is present, symmetry forces $(2,1)$ in and
          antisymmetry then forces $1 = 2$, which is false — so both
          off-diagonal cells must be out. The two diagonal cells stay free,
          giving $2^{2} = 4$ relations: the subsets of $\Delta_A$.
      - teach: >
          Antisymmetry is what turns "reachable from" into a ranking. Allow a
          two-way tie between distinct $a$ and $b$ and there is no consistent
          way to say which comes first; forbid it and the relation can lay
          elements out in order.
      - ask: >
          Divisibility, $a \mid b$, is antisymmetric on $\mathbb{N}$. Why does
          it fail on $\mathbb{Z}$?
        choices:
          - text: >
              Because $0$ is divisible by everything
            feedback: >
              That is true and harmless: $n \mid 0$ for every $n$, but
              $0 \mid n$ only for $n = 0$, so no two-way tie between distinct
              elements arises from it.
          - text: >
              Because $2 \mid -2$ and $-2 \mid 2$ while $2 \ne -2$
            correct: true
            feedback: >
              A genuine two-way tie between distinct elements: $-2 = (-1)
              \cdot 2$ and $2 = (-1) \cdot (-2)$. Every $n$ and $-n$ with
              $n \ne 0$ give another one.
          - text: >
              Because divisibility is not transitive on $\mathbb{Z}$
            feedback: >
              Transitivity is fine on $\mathbb{Z}$: if $b = ka$ and $c = mb$
              then $c = (mk)a$. It is antisymmetry alone that breaks.
        feedback: >
          Negatives create the ties: $n$ and $-n$ divide each other and are
          distinct once $n \ne 0$. Same relation, different ambient set,
          different answer — which is why the set is always named.
      - teach: >
          So the four combinations all occur. Subsets of the diagonal are both;
          $\le$ is antisymmetric and not symmetric; "shares a birthday with" is
          symmetric and not antisymmetric; and $\{(1,2),(2,1),(1,3)\}$ on
          $\{1,2,3\}$ is neither.

  - node: foundations.relations.def-transitive
    hook: >
      Transitivity is the property that makes a chain of reasoning collapse to a
      single conclusion — and the one you must never assume, because reflexive
      symmetric relations fail it all the time.
    explanation: >
      A relation $R$ on $A$ is transitive if $aRb$ and $bRc$ imply $aRc$. Two
      steps become one. That is the property doing the work every time you argue
      "$x \le y$ and $y \le z$, so $x \le z$" without pausing.

      Composition makes the statement crisp. $R \circ R$ is exactly the set of
      pairs joined by two $R$-steps, so transitivity is the inclusion
      $R \circ R \subseteq R$. Iterating gives more: if two steps collapse into
      one, then three steps collapse to two and then to one, so
      $R^{n} \subseteq R$ for every $n \ge 1$. A transitive relation already
      contains everything reachable from anywhere along any finite chain, which
      is why transitivity is the property that lets a proof take as many steps
      as it likes and still conclude a single comparison.

      Failing transitivity is easy and common. Take $R = \{(1,2),(2,3)\}$ on
      $\{1,2,3\}$: the two-step pair $(1,3)$ is not present, so $R$ is not
      transitive. Adding $(1,3)$ fixes it, and now $R \circ R = \{(1,3)\}$,
      which does sit inside $R$.

      The example worth memorising is "differs by less than $1$" on $\mathbb{R}$.
      It is reflexive and symmetric, and it is thoroughly non-transitive: $0$
      and $0.6$ differ by less than $1$, and so do $0.6$ and $1.2$, but $0$ and
      $1.2$ do not. Nearness is not transitive, which is exactly why "roughly
      equal" is not an equivalence relation and why the third axiom has to be
      demanded separately.
    worked: >
      Let $A = \{1,2,3,4\}$ and $R = \{(1,2),(2,3),(3,4)\}$ — a path. Is it
      transitive? Compute the two-step pairs: $(1,2)$ then $(2,3)$ gives
      $(1,3)$, and $(2,3)$ then $(3,4)$ gives $(2,4)$, so
      $R \circ R = \{(1,3),(2,4)\}$. Neither is in $R$, so transitivity fails.
      Now build the smallest transitive relation containing $R$. Add $(1,3)$ and
      $(2,4)$; those create the new three-step pair $(1,4)$, so add that too.
      With $\{(1,2),(1,3),(1,4),(2,3),(2,4),(3,4)\}$ nothing new appears — every
      two-step route between these six pairs lands on a pair already listed. So
      the transitive closure is the set of all six pairs $(i,j)$ with $i < j$.
    pitfalls: >
      Transitivity is a claim about *all* triples, so exhibiting one triple that
      works proves nothing; one triple that fails, on the other hand, settles it
      against. It is independent of the other properties: "differs by less than
      $1$" is reflexive and symmetric and not transitive. And the hypothesis
      needs both steps present — a relation is vacuously transitive when it
      simply has no two-step routes, as $\{(1,2)\}$ on $\{1,2,3\}$ does.
    recap: >
      Transitive means two steps always collapse into one, equivalently
      $R \circ R \subseteq R$, and hence chains of any length collapse too.
    steps:
      - teach: >
          $R$ on $A$ is transitive if $aRb$ and $bRc$ imply $aRc$. Two steps
          become one — the property you use, usually without noticing, whenever
          you chain comparisons together.
      - teach: >
          $R \circ R$ is exactly the two-step reachability relation, so
          transitivity is the inclusion $R \circ R \subseteq R$. Apply it
          repeatedly and $R^{n} \subseteq R$ for every $n \ge 1$: a transitive
          relation already contains everything reachable along any finite chain.
      - ask: >
          Is $R = \{(1,2),(2,3)\}$ on $\{1,2,3\}$ transitive?
        choices:
          - text: >
              Yes, because no pair is repeated
            feedback: >
              Repetition is not the issue. The test is whether every two-step
              route has a one-step version, and this one does not.
          - text: >
              No, because $(1,3)$ is missing
            correct: true
            feedback: >
              $1R2$ and $2R3$ hold, so transitivity would require $1R3$, and
              $(1,3) \notin R$. One failing triple is enough to settle it.
          - text: >
              No, because $(2,1)$ is missing
            feedback: >
              That would be a failure of symmetry, a different property.
              Transitivity never asks for reversals.
        feedback: >
          Not transitive: the two-step route from $1$ to $3$ has no one-step
          version. Equivalently $R \circ R = \{(1,3)\}$, which is not contained
          in $R$.
      - ask: >
          Let $R = \{(1,2),(2,3),(3,4)\}$ on $\{1,2,3,4\}$. How many pairs does
          the smallest transitive relation containing $R$ have?
        expects: "6"
        hint: >
          Add the two-step pairs, then check whether the additions create new
          two-step routes of their own.
        feedback: >
          Six. The two-step pairs are $(1,3)$ and $(2,4)$; adding them creates
          the route $1 \to 3 \to 4$, so $(1,4)$ joins as well. The result is
          every pair $(i,j)$ with $i < j$: $(1,2),(1,3),(1,4),(2,3),(2,4),(3,4)$
          — six pairs, and nothing new appears after that.
      - teach: >
          Notice what happened: closing a three-arrow path under transitivity
          filled in every shortcut. This is the general pattern — the transitive
          closure of a path on $n$ points is the strict order $i < j$.
      - ask: >
          On $\mathbb{R}$, let $aRb$ mean that $a$ and $b$ differ by less than
          $1$. Which properties does $R$ have?
        choices:
          - text: >
              Reflexive, symmetric and transitive
            feedback: >
              The first two hold, the third fails: $0$ and $0.6$ differ by less
              than $1$, so do $0.6$ and $1.2$, but $0$ and $1.2$ differ by
              $1.2$.
          - text: >
              Reflexive and symmetric, but not transitive
            correct: true
            feedback: >
              $a$ differs from itself by $0$, and "differ by less than $1$" does
              not care about order. Transitivity fails because small gaps
              accumulate: $0$ to $0.6$ to $1.2$ is a two-step route with no
              one-step version.
          - text: >
              Symmetric and transitive, but not reflexive
            feedback: >
              Reflexivity holds — the gap from $a$ to itself is $0$, which is
              less than $1$. It is transitivity that breaks.
        feedback: >
          Reflexive and symmetric but not transitive. Nearness accumulates, and
          that is precisely why "roughly equal" is not good enough to be an
          equivalence relation.
      - teach: >
          So the third axiom must always be demanded separately. Reflexivity and
          symmetry are cheap; transitivity is the one that a plausible-sounding
          "same for present purposes" relation most often fails.

  - node: foundations.relations.def-equivalence-relation
    hook: >
      Three properties at once give you the right to treat different objects as
      interchangeable — and every construction in this unit that collapses,
      identifies or glues starts by checking exactly these three.
    explanation: >
      Mathematics is constantly declaring that two objects, though not equal,
      count as the same for the purpose at hand: two triangles of the same shape,
      two integers that leave the same remainder, two sets of the same size. An
      equivalence relation is what such a declaration must satisfy to be
      coherent. Write it $\sim$, and demand exactly three things: $a \sim a$ for
      every $a$ (reflexive), $a \sim b$ implies $b \sim a$ (symmetric), and
      $a \sim b$ with $b \sim c$ implies $a \sim c$ (transitive).

      Each axiom earns its place, and none follows from the others. Order gives
      the first witness: $\le$ on $\mathbb{R}$ is reflexive and transitive, and
      it is not symmetric. Nearness gives the second: "differs by less than $1$"
      on $\mathbb{R}$ is reflexive and symmetric, and it is not transitive. The
      empty relation on a nonempty set gives the third: with no pairs at all, the
      symmetry and transitivity implications never fire, so both hold vacuously
      — but no element is related to itself, so reflexivity fails.

      That third witness kills the argument students most often try, which
      claims reflexivity is redundant: "$a \sim b$, so $b \sim a$ by symmetry,
      so $a \sim a$ by transitivity." The step is valid but the conclusion is
      conditional — it only produces $a \sim a$ for elements $a$ that are
      related to *something*. An element related to nothing is untouched by it,
      and that is precisely the case the empty relation exhibits. Reflexivity is
      the axiom that reaches every element of $A$, which is also why it is the
      one that depends on naming $A$.

      Together the three say that $\sim$ behaves like equality in the only ways
      that matter for substitution: you may swap $a$ for anything equivalent to
      it and expect a consistent answer.
    worked: >
      On $A = \{1,2,\ldots,10\}$ define $a \sim b$ to mean that $a$ and $b$ are
      both even or both odd. Check all three. Reflexive: $a$ has the same parity
      as itself, so $a \sim a$ for each of the ten elements. Symmetric: "have the
      same parity" is a statement about the unordered pair, so $a \sim b$ gives
      $b \sim a$ at once — for instance $3 \sim 7$ and $7 \sim 3$. Transitive: if
      $a$ and $b$ share a parity and $b$ and $c$ share a parity, then $a$ and
      $c$ share $b$'s parity, so $a \sim c$; concretely $4 \sim 8$ and
      $8 \sim 10$ give $4 \sim 10$. All three hold, so $\sim$ is an equivalence
      relation, and it sorts the ten elements into the evens
      $\{2,4,6,8,10\}$ and the odds $\{1,3,5,7,9\}$.
    pitfalls: >
      Reflexivity is not implied by the other two, and the standard bogus proof
      of it silently assumes every element is related to something — the empty
      relation on a nonempty set is symmetric, transitive and not reflexive.
      Symmetry alone is not enough either: "differs by less than $1$" feels like
      sameness and fails transitivity outright. And "$\sim$ is an equivalence
      relation" is always relative to a named set, since reflexivity is checked
      against every element of that set.
    recap: >
      An equivalence relation is a relation that is reflexive, symmetric and
      transitive — equality's behaviour, kept only as far as substitution needs
      it.
    steps:
      - teach: >
          Mathematics constantly says "these are not equal but count as the
          same": same shape, same remainder, same size. An equivalence relation
          is what such a declaration has to satisfy to be usable.
      - teach: >
          Three demands on a relation $\sim$ on $A$: $a \sim a$ for every $a$
          (reflexive); $a \sim b$ implies $b \sim a$ (symmetric); $a \sim b$ and
          $b \sim c$ imply $a \sim c$ (transitive). Nothing more.
      - ask: >
          How many of the three axioms does $\le$ on $\mathbb{R}$ satisfy?
        expects: "2"
        hint: >
          Test each in turn on small numbers, and look for the one that a
          direction-carrying relation cannot have.
        feedback: >
          Two. Reflexive, since $x \le x$; transitive, since $x \le y \le z$
          gives $x \le z$. Symmetry fails: $1 \le 2$ holds and $2 \le 1$ does
          not. So order is the standard witness that symmetry does not follow
          from the other two.
      - teach: >
          Nearness supplies a second witness. "Differs by less than $1$" on
          $\mathbb{R}$ is reflexive and symmetric, and not transitive — $0$ to
          $0.6$ to $1.2$. So transitivity is independent too.
      - ask: >
          Which relation is symmetric and transitive but *not* reflexive?
        choices:
          - text: >
              $\le$ on $\mathbb{R}$
            feedback: >
              This one is reflexive and transitive; it is symmetry that fails.
              You need an example missing reflexivity instead.
          - text: >
              The empty relation on $\{1,2\}$
            correct: true
            feedback: >
              With no pairs at all, the symmetry and transitivity implications
              never fire, so both hold vacuously. But $1 \sim 1$ is false, so
              reflexivity fails.
          - text: >
              $\Delta_A$ on $\{1,2\}$
            feedback: >
              The diagonal is all three at once — it is equality, the smallest
              equivalence relation on any set.
        feedback: >
          The empty relation on a nonempty set. It is the standard proof that
          reflexivity is a genuinely separate demand.
      - teach: >
          That example also kills the tempting argument that reflexivity is
          redundant: "$a \sim b$, so $b \sim a$, so $a \sim a$." The reasoning is
          valid but conditional — it never reaches an element related to nothing
          at all, and the empty relation is exactly that case everywhere.
      - ask: >
          How many equivalence relations are there on $A = \{1,2\}$?
        expects: "2"
        hint: >
          Reflexivity forces two cells in. Symmetry ties the other two together.
          Check whether each surviving option is transitive.
        feedback: >
          Two. Reflexivity forces $(1,1)$ and $(2,2)$; symmetry says $(1,2)$ and
          $(2,1)$ are in or out together, leaving two candidates. Both are
          transitive, so both count: $\Delta_A$, and all of $A \times A$. They
          correspond to "keep the elements apart" and "declare them the same".
      - teach: >
          Reflexivity is checked against every element of the named set, so
          "$\sim$ is an equivalence relation" is always a statement about a
          relation *and* a set. Once all three hold you may substitute
          equivalent elements freely.

  - node: foundations.relations.def-equivalence-class
    hook: >
      Once you know which elements a relation refuses to distinguish, you can
      bundle them — and the bundle, not the individual element, is what every
      quotient construction actually manipulates.
    explanation: >
      Let $\sim$ be an equivalence relation on $A$ and fix $a \in A$. Sweep up
      everything the relation cannot tell apart from $a$: the equivalence class
      $[a] = \{x \in A : x \sim a\}$. It is a *subset* of $A$, and this level
      shift is the whole idea — you are trading individual elements for the
      bundles they belong to.

      Reflexivity does immediate work. Since $a \sim a$, always $a \in [a]$. So
      no class is empty, and every element of $A$ lies in at least one class,
      namely its own. That is the covering half of everything that follows, and
      it is bought with one axiom.

      Any $b \in [a]$ is called a representative of the class, and the crucial
      point is that all representatives name the same set. Suppose $b \in [a]$,
      so $b \sim a$. If $x \in [b]$ then $x \sim b$ and $b \sim a$, so $x \sim a$
      by transitivity, giving $x \in [a]$. For the other direction, symmetry
      turns $b \sim a$ into $a \sim b$, and the same transitivity step sends
      $[a]$ into $[b]$. Hence $[a] = [b]$. Symmetry and transitivity are exactly
      what make the notation $[a]$ safe: it names a set, and the letter inside
      the bracket is only a label you happened to pick.

      When more than one equivalence relation is in play, write $[a]_\sim$ to
      say which one is meant. The bracket is otherwise silent about the relation,
      which is a real source of confusion once two relations sit on the same set.
    worked: >
      Let $A = \{1,2,\ldots,9\}$ and let $a \sim b$ mean that $a$ and $b$ leave
      the same remainder on division by $3$. Compute $[4]$: the remainder of $4$
      is $1$, and the elements of $A$ with remainder $1$ are $1$, $4$ and $7$, so
      $[4] = \{1,4,7\}$. Since $1 \sim 4$, the theory says $[1]$ should be the
      same set, and it is: the elements with remainder $1$ do not depend on
      which of them you started from, so $[1] = [4] = [7] = \{1,4,7\}$. The other
      classes come out as $[2] = \{2,5,8\}$ (remainder $2$) and
      $[3] = \{3,6,9\}$ (remainder $0$). Three distinct sets, each with three
      elements, and every element of $A$ appears in exactly one of them.
    pitfalls: >
      $[a]$ is a subset of $A$, not an element of $A$ — writing $[a] \in A$ or
      comparing $[a]$ with a number confuses the two levels, and that confusion
      is what makes quotients feel slippery later. Different labels routinely
      name the same class, so $[1] = [4]$ is an ordinary true equation and not a
      typo. And a class is never empty, because reflexivity always puts $a$
      itself inside $[a]$.
    recap: >
      The class $[a]$ is the set of everything equivalent to $a$; it always
      contains $a$, and every one of its members names it equally well.
    steps:
      - teach: >
          Given an equivalence relation $\sim$ on $A$ and an element $a$, collect
          everything the relation cannot distinguish from $a$:
          $[a] = \{x \in A : x \sim a\}$. This is a subset of $A$, not an
          element of it — the level shift is deliberate.
      - teach: >
          Reflexivity pays off at once. Since $a \sim a$, we have $a \in [a]$, so
          no class is empty and every element of $A$ sits inside at least one
          class. One axiom buys the covering.
      - ask: >
          On $A = \{1,\ldots,9\}$ let $a \sim b$ mean $a$ and $b$ leave the same
          remainder on division by $3$. How many elements does $[5]$ have?
        expects: "3"
        hint: >
          What is the remainder of $5$? Now list every element of $A$ with that
          remainder.
        feedback: >
          Three. $5$ leaves remainder $2$, and the elements of $A$ with remainder
          $2$ are $2$, $5$ and $8$, so $[5] = \{2,5,8\}$. The other two classes,
          $\{1,4,7\}$ and $\{3,6,9\}$, also have three elements each.
      - teach: >
          Any member of a class is called a representative of it, and every
          representative names the same set. That is not obvious — it is bought
          with the other two axioms.
      - teach: >
          Here is the step. Let $b \in [a]$, so $b \sim a$. If $x \in [b]$ then
          $x \sim b$ and $b \sim a$, so $x \sim a$ by transitivity and
          $x \in [a]$. Symmetry turns $b \sim a$ into $a \sim b$, and the same
          argument runs the other way. Hence $[a] = [b]$.
      - ask: >
          With that same $\sim$ on $\{1,\ldots,9\}$, what is the relationship
          between $[2]$ and $[8]$?
        choices:
          - text: >
              They are different classes that happen to overlap in $\{2,8\}$
            feedback: >
              Classes cannot overlap partially. Since $2 \sim 8$, the argument
              from symmetry and transitivity forces the two sets to be
              identical, not merely to meet.
          - text: >
              They are the same set, $\{2,5,8\}$
            correct: true
            feedback: >
              $2$ and $8$ both leave remainder $2$, so $2 \sim 8$, and
              equivalent representatives name the same class. Writing $[2]$ or
              $[8]$ is a choice of label, not a choice of set.
          - text: >
              $[8]$ is a subset of $[2]$ but not equal to it
            feedback: >
              Transitivity gives containment in *both* directions once
              $2 \sim 8$, because symmetry lets you run the same argument
              backwards. Proper containment between classes is impossible.
        feedback: >
          They are the same set $\{2,5,8\}$. The bracket names a class, and the
          element inside it is only the representative you happened to write
          down.
      - ask: >
          Which statement about $[a]$ is correct?
        choices:
          - text: >
              $[a]$ is an element of $A$
            feedback: >
              $[a]$ is a *set* of elements of $A$. Confusing the two levels is
              what makes quotients feel slippery, so it is worth fixing now.
          - text: >
              $[a]$ is a subset of $A$ containing $a$
            correct: true
            feedback: >
              By definition it is a subset, and reflexivity puts $a$ inside it.
              Both halves matter: the level shift and the guarantee of
              nonemptiness.
          - text: >
              $[a]$ may be empty if $a$ is related to nothing else
            feedback: >
              Reflexivity forbids that: $a \sim a$ always holds, so $a \in [a]$
              and the class has at least one element. A class of size one is
              possible; an empty class is not.
        feedback: >
          A subset of $A$ that always contains $a$. Keeping the level
          straight — elements below, classes above — is what quotients
          depend on.

  - node: foundations.relations.class-eq-lemma
    hook: >
      Classes could in principle overlap a little, the way two arbitrary subsets
      do; this lemma says they cannot, and that single fact is what turns a
      collection of classes into a clean tiling of the set.
    explanation: >
      Let $\sim$ be an equivalence relation on $A$ and take $a, b \in A$. Three
      statements turn out to say the same thing: (i) $a \sim b$; (ii)
      $[a] = [b]$; (iii) $[a] \cap [b] \ne \emptyset$. The first is about
      elements, the second is an equation between sets, and the third is a very
      weak-looking overlap condition — and they are equivalent.

      Prove it as a cycle. From (i) to (ii): let $x \in [a]$, so $x \sim a$;
      combined with $a \sim b$, transitivity gives $x \sim b$, so $x \in [b]$.
      Symmetry turns $a \sim b$ into $b \sim a$, and the same step run with the
      letters swapped gives $[b] \subseteq [a]$. Two inclusions, so
      $[a] = [b]$. From (ii) to (iii): reflexivity puts $a$ into $[a] = [b]$, so
      the intersection contains $a$ and is not empty.

      The interesting direction is (iii) to (i), and it is where the strength of
      the lemma sits. Suppose merely that some $x$ lies in both classes. Then
      $x \sim a$ and $x \sim b$. Symmetry converts the first into $a \sim x$,
      and transitivity applied to $a \sim x$ and $x \sim b$ yields $a \sim b$.
      One shared element was enough.

      Read the equivalence of (ii) and (iii) backwards and you get the headline:
      if two classes are *not* equal, they cannot meet at all. Classes never
      partially overlap — they coincide or they are disjoint, with no third
      possibility. Ordinary subsets of $A$ have no such property, and it is
      exactly what the three axioms bought.
    worked: >
      Let $A = \{1,2,\ldots,12\}$ with $a \sim b$ meaning that $a$ and $b$ leave
      the same remainder on division by $4$. Take $a = 3$ and $b = 7$. They meet
      condition (iii) cheaply: $3 \in [3]$ and $3 \in [7]$, since $3$ and $7$
      both leave remainder $3$, so $[3] \cap [7]$ is nonempty. The lemma then
      promises $[3] = [7]$, and listing confirms it: both equal
      $\{3,7,11\}$. Now take $a = 1$ and $b = 2$. Their classes are
      $\{1,5,9\}$ and $\{2,6,10\}$, which share nothing, so by the lemma $1$ and
      $2$ are not equivalent — as they are not, since their remainders are $1$
      and $2$. Running over all twelve labels, $[1],[2],\ldots,[12]$ produce only
      four distinct sets: $\{1,5,9\}$, $\{2,6,10\}$, $\{3,7,11\}$ and
      $\{4,8,12\}$.
    pitfalls: >
      "Their classes overlap" is not a weaker statement than "their classes are
      equal" — under an equivalence relation the two are the same claim, so
      writing $[a] \ne [b]$ but $[a] \cap [b] \ne \emptyset$ is impossible. The
      lemma is also useless without all three axioms: for a relation that is not
      transitive the classes really can half-overlap. And equal classes do not
      mean equal representatives: $[3] = [7]$ while $3 \ne 7$.
    recap: >
      Two equivalence classes that share a single element are the same set, so
      distinct classes are disjoint and never partially overlap.
    steps:
      - teach: >
          Two arbitrary subsets of $A$ can overlap in any way at all. The
          question is whether equivalence classes can, and the answer is no —
          which is what makes them worth studying.
      - teach: >
          The lemma says three statements are equivalent: $a \sim b$;
          $[a] = [b]$; and $[a] \cap [b] \ne \emptyset$. Notice how different
          their strengths look — one is about elements, one is an equation of
          sets, one merely asks for a single shared point.
      - teach: >
          From $a \sim b$ to $[a] = [b]$: if $x \in [a]$ then $x \sim a$, and
          with $a \sim b$ transitivity gives $x \sim b$, so $x \in [b]$.
          Symmetry supplies $b \sim a$, and the same argument returns
          $[b] \subseteq [a]$. Two inclusions give the equation.
      - ask: >
          Suppose only that $x \in [a] \cap [b]$. Which combination of axioms
          produces $a \sim b$?
        choices:
          - text: >
              Reflexivity alone
            feedback: >
              Reflexivity gives $a \sim a$ and $b \sim b$, which never connects
              $a$ to $b$. It is the axiom that makes classes nonempty, not the
              one that merges them.
          - text: >
              Symmetry to turn $x \sim a$ into $a \sim x$, then transitivity
              with $x \sim b$
            correct: true
            feedback: >
              Membership gives $x \sim a$ and $x \sim b$. Symmetry reverses the
              first to $a \sim x$, and transitivity chains $a \sim x \sim b$
              into $a \sim b$. One shared element was enough.
          - text: >
              Transitivity alone applied to $x \sim a$ and $x \sim b$
            feedback: >
              Transitivity needs the two steps to line up head to tail, and here
              both start at $x$. Without symmetry to reverse one of them the
              chain does not connect.
        feedback: >
          Symmetry then transitivity. That is the load-bearing step of the whole
          lemma: a single point in common forces the two elements to be
          equivalent, and hence forces the classes to coincide.
      - teach: >
          Read the equivalence of the last two statements backwards. If two
          classes are not equal, they cannot meet at all. So classes coincide or
          are disjoint — never a partial overlap.
      - ask: >
          On $A = \{1,\ldots,12\}$ with $a \sim b$ meaning the same remainder on
          division by $4$, how many distinct sets appear among
          $[1], [2], \ldots, [12]$?
        expects: "4"
        hint: >
          Equal remainders give equal classes. How many remainders are possible?
        feedback: >
          Four: $\{1,5,9\}$, $\{2,6,10\}$, $\{3,7,11\}$ and $\{4,8,12\}$. Twelve
          labels, but $[1] = [5] = [9]$ and so on, so the labels collapse to one
          set per remainder — and the four sets are pairwise disjoint, exactly as
          the lemma predicts.
      - ask: >
          Which situation is impossible for an equivalence relation?
        choices:
          - text: >
              $[a] = [b]$ while $a \ne b$
            feedback: >
              Entirely ordinary — $[3] = [7]$ above, with $3 \ne 7$. Equal
              classes do not require equal representatives.
          - text: >
              $[a] \cap [b] = \{x\}$ with $[a] \ne [b]$
            correct: true
            feedback: >
              A single shared element forces $a \sim b$ and hence $[a] = [b]$,
              contradicting the assumption. Partial overlap is exactly what the
              lemma rules out.
          - text: >
              $[a] \cap [b] = \emptyset$ with $a \ne b$
            feedback: >
              That is the normal state of affairs for inequivalent elements —
              $[1]$ and $[2]$ above are disjoint.
        feedback: >
          Partial overlap is impossible. Sharing one element is already enough
          to force the classes to be identical, so the intersection is either
          empty or everything.
      - teach: >
          Keep the picture: the classes sit side by side with no seams and
          no overlaps, each nonempty by reflexivity. The partition theorem
          names what that picture is.

  - node: foundations.relations.partition-theorem
    hook: >
      Two constructions that look nothing alike — declaring elements
      interchangeable, and cutting a set into pieces — turn out to be the same
      construction, and this is the theorem that identifies them.
    explanation: >
      You already know what a partition of $A$ is: a family of nonempty,
      pairwise disjoint subsets whose union is all of $A$, so that every element
      lands in exactly one block. The theorem says the partitions of $A$ and the
      equivalence relations on $A$ are the same objects wearing different
      clothes.

      One direction is already almost proved. Given $\sim$, take the collection
      of its classes. Each class is nonempty because reflexivity puts $a$ inside
      $[a]$. Distinct classes are disjoint because classes that meet are equal.
      And the classes cover $A$, again because $a \in [a]$ — every element has
      somewhere to go. Those are precisely the three conditions in the
      definition of a partition, one supplied by reflexivity and one by the
      lemma about overlapping classes.

      The other direction builds a relation out of a partition $\mathcal{P}$:
      declare $a \sim_{\mathcal{P}} b$ when $a$ and $b$ lie in the same block.
      Check the axioms against "exactly one block". Reflexive: $a$ lies in the
      same block as itself, and it has one because the blocks cover $A$.
      Symmetric: "same block" does not care about order. Transitive: if $a$ and
      $b$ share a block and $b$ and $c$ share a block, those two blocks both
      contain $b$, and since $b$ lies in exactly one block they are the same
      block — so $a$ and $c$ share it. Uniqueness of the block is the load
      here, and it is what disjointness of the partition supplies.

      Finally the two constructions undo each other. The class of $a$ under
      $\sim_{\mathcal{P}}$ is everything sharing $a$'s block, which is that
      block; and starting from $\sim$, forming the classes and then asking
      "same class?" returns $\sim$ by the lemma. So the correspondence is a
      bijection: counting equivalence relations on $A$ and counting partitions
      of $A$ are the same problem.
    worked: >
      Partition $A = \{1,2,3,4,5,6\}$ into the blocks $\{1,3,5\}$, $\{2,4\}$ and
      $\{6\}$, and build $\sim_{\mathcal{P}}$. Which pairs does it contain? Every
      ordered pair drawn from within a single block, and no others. The block
      $\{1,3,5\}$ contributes $3 \cdot 3 = 9$ pairs, the block $\{2,4\}$
      contributes $2 \cdot 2 = 4$, and $\{6\}$ contributes $1$. So
      $\sim_{\mathcal{P}}$ has $9 + 4 + 1 = 14$ pairs out of the $36$ in
      $A \times A$. Now run the construction backwards: the class of $3$ is
      everything sharing its block, namely $\{1,3,5\}$; the class of $4$ is
      $\{2,4\}$; the class of $6$ is $\{6\}$. The classes are the original
      blocks, exactly as the theorem promises.
    pitfalls: >
      Empty blocks are forbidden for a reason: an empty block corresponds to no
      class at all, so allowing them would break the bijection by letting many
      partitions give the same relation. The correspondence is also between
      partitions of $A$ and equivalence relations *on $A$* — change the ambient
      set and both sides change. And a family of pairwise disjoint subsets is
      not yet a partition unless it also covers $A$; leaving an element
      uncovered corresponds to a relation that fails reflexivity at that
      element.
    recap: >
      Equivalence relations on $A$ and partitions of $A$ correspond exactly:
      classes are blocks, and "same block" is the relation.
    steps:
      - teach: >
          A partition of $A$ cuts it into nonempty, pairwise disjoint blocks
          covering everything, so each element lies in exactly one block. The
          claim ahead is that this is the same data as an equivalence relation.
      - teach: >
          From a relation to a partition, the work is already done. Classes are
          nonempty because $a \in [a]$; distinct classes are disjoint because
          classes that meet are equal; and the classes cover $A$, again because
          $a \in [a]$. Those are the three conditions, exactly.
      - teach: >
          Going back, define $a \sim_{\mathcal{P}} b$ to mean that $a$ and $b$
          lie in the same block. Reflexivity and symmetry are immediate — every
          element has a block, and "same block" ignores order.
      - ask: >
          Which feature of a partition makes $\sim_{\mathcal{P}}$ transitive?
        choices:
          - text: >
              The blocks are nonempty
            feedback: >
              Nonemptiness is what forbids redundant blocks and keeps the
              correspondence one-to-one; it says nothing about chaining two
              "same block" claims together.
          - text: >
              Each element lies in exactly one block
            correct: true
            feedback: >
              If $a$ shares a block with $b$ and $b$ shares a block with $c$,
              both blocks contain $b$ — and $b$ has only one block, so they are
              the same block and $a$ shares it with $c$. Uniqueness, which comes
              from disjointness, is the load-bearing hypothesis.
          - text: >
              The blocks cover $A$
            feedback: >
              Covering gives every element *a* block, which is what makes the
              relation reflexive. Transitivity needs the block to be *unique*,
              not merely to exist.
        feedback: >
          Uniqueness of the block. Two blocks both containing $b$ must be one
          block, which is exactly how the chain $a$ to $b$ to $c$ closes up.
      - ask: >
          Partition $\{1,2,3,4,5,6\}$ into $\{1,3,5\}$, $\{2,4\}$ and $\{6\}$.
          How many ordered pairs does $\sim_{\mathcal{P}}$ contain?
        expects: "14"
        hint: >
          A pair belongs exactly when both entries sit in one block. Count each
          block's contribution separately.
        feedback: >
          Fourteen. A block with $k$ elements contributes $k^{2}$ ordered pairs,
          so $3^{2} + 2^{2} + 1^{2} = 9 + 4 + 1 = 14$, out of the $36$ pairs in
          the full product.
      - teach: >
          The two constructions undo each other. The class of $a$ under
          $\sim_{\mathcal{P}}$ is everything sharing $a$'s block — that block.
          And forming the classes of $\sim$ and then asking "same class?" returns
          $\sim$, by the lemma that classes coincide or are disjoint.
      - ask: >
          How many equivalence relations are there on a three-element set?
        expects: "5"
        hint: >
          Count partitions instead — the theorem says the two counts agree. Sort
          them by the sizes of the blocks.
        feedback: >
          Five. The partitions of $\{1,2,3\}$ are: one block $\{1,2,3\}$; three
          ways to split as a pair plus a singleton; and three singletons. That is
          $1 + 3 + 1 = 5$, so there are five equivalence relations — a count
          that would be painful to do directly on sets of pairs.
      - teach: >
          Hold both readings at once. An equivalence relation is a way of
          declaring elements interchangeable; a partition is a way of cutting the
          set up; and the theorem says you may always switch to whichever
          description makes the problem easier.

  - node: foundations.relations.def-quotient-set
    hook: >
      A quotient is the move that makes "the same for present purposes" into
      plain equality — you stop working with the elements and start working with
      their classes.
    explanation: >
      Take an equivalence relation $\sim$ on $A$ and its classes. The partition
      theorem says these tile $A$. The quotient set is what you get by treating
      each tile as a single object: $A/{\sim} = \{[a] : a \in A\}$, the set whose
      *elements* are the classes. Keep the level shift in view — an element of
      $A/{\sim}$ is a subset of $A$.

      Alongside it comes the canonical projection $\pi : A \to A/{\sim}$, which
      sends each element to the class it lives in: $\pi(a) = [a]$. Two features
      matter. It hits every class, since a class $[a]$ is by construction the
      image of $a$ — a map that reaches everything is called surjective, and it
      is defined precisely in the next unit. And $\pi(a) = \pi(b)$ exactly when
      $a \sim b$, by the lemma that classes coincide or are disjoint. So the set
      of elements that $\pi$ sends to a given class — its preimage, again a term
      made precise in the next unit — is that class itself.

      Those two facts together are the payoff. In $A$, equivalent elements were
      distinct objects that you had agreed to treat alike. In $A/{\sim}$ they are
      literally one object, because $[a]$ and $[b]$ are the same set. The
      agreement has been built into the structure, and $\pi$ is the dictionary
      that translates between the two levels.

      Sizes are worth a moment. If the classes all have $k$ elements and $A$ has
      $n$, then $A/{\sim}$ has $n/k$ elements — the quotient is smaller, sometimes
      dramatically, and that shrinkage is the point. At the extremes, $A/{\sim}$
      for $\sim$ equal to $\Delta_A$ is a copy of $A$ with every class a
      singleton, and $A/{\sim}$ for the all-of-$A \times A$ relation is a
      one-element set.
    worked: >
      Let $A = \{1,2,\ldots,9\}$ with $a \sim b$ meaning that $a$ and $b$ leave
      the same remainder on division by $3$. The classes are $\{1,4,7\}$,
      $\{2,5,8\}$ and $\{3,6,9\}$, so $A/{\sim}$ is a set with exactly three
      elements, each of them a three-element subset of $A$. The projection sends
      $\pi(7) = \{1,4,7\}$, $\pi(5) = \{2,5,8\}$, $\pi(9) = \{3,6,9\}$. Check the
      two features: every one of the three classes is $\pi$ of something, and
      $\pi(1) = \pi(4)$ holds precisely because $1 \sim 4$, while
      $\pi(1) \ne \pi(2)$ because $1$ and $2$ leave different remainders. Nine
      elements have become three.
    pitfalls: >
      The commonest confusion is level: $[a]$ is an element of $A/{\sim}$ and a
      subset of $A$ at the same time, so a statement about elements of
      $A/{\sim}$ is a statement about subsets of $A$. Writing $A/{\sim} \subseteq
      A$ is wrong for the same reason. And $\pi$ is almost never injective —
      collapsing is the entire purpose — so from $\pi(a) = \pi(b)$ you may
      conclude $a \sim b$ and never $a = b$.
    recap: >
      The quotient $A/{\sim}$ is the set of equivalence classes, and the
      projection $\pi(a) = [a]$ turns equivalence in $A$ into equality in
      $A/{\sim}$.
    steps:
      - teach: >
          The classes of $\sim$ tile $A$. The quotient set is what you get by
          treating each tile as one object: $A/{\sim} = \{[a] : a \in A\}$, a set
          whose elements are the classes.
      - teach: >
          Watch the level. An element of $A/{\sim}$ is a *subset* of $A$. That is
          not a technicality to be waved through — nearly every error with
          quotients is a level error.
      - ask: >
          With $A = \{1,\ldots,9\}$ and $a \sim b$ meaning the same remainder on
          division by $3$, how many elements does $A/{\sim}$ have?
        expects: "3"
        hint: >
          Count the classes, not the elements of $A$. Two labels naming the same
          class count once.
        feedback: >
          Three: $\{1,4,7\}$, $\{2,5,8\}$ and $\{3,6,9\}$. Nine elements
          collapse to three, since each class has three members and the classes
          are disjoint.
      - teach: >
          Alongside the quotient comes the canonical projection
          $\pi : A \to A/{\sim}$ with $\pi(a) = [a]$ — send each element to the
          class it lives in. It reaches every class, since $[a]$ is the image of
          $a$; a map reaching everything is called surjective, and that word gets
          its precise definition in the next unit.
      - teach: >
          Its key property is $\pi(a) = \pi(b)$ if and only if $a \sim b$, which
          is the lemma that classes coincide or are disjoint, restated. The set
          of elements sent to a given class — its preimage, another term made
          precise in the next unit — is exactly that class.
      - ask: >
          A set $A$ with $20$ elements carries an equivalence relation whose
          classes all have $5$ elements. How many elements does $A/{\sim}$ have?
        expects: "4"
        hint: >
          The classes are disjoint and cover $A$, so their sizes add up to
          $|A|$.
        feedback: >
          Four. The classes partition $A$, so if each has $5$ elements then
          there are $20/5 = 4$ of them, and the elements of $A/{\sim}$ are
          exactly those classes.
      - ask: >
          What does $\pi(a) = \pi(b)$ tell you?
        choices:
          - text: >
              $a = b$
            feedback: >
              Only if every class is a singleton. The projection is built to
              collapse things, so it is almost never injective — that is the
              feature, not a defect.
          - text: >
              $a \sim b$
            correct: true
            feedback: >
              Equal images mean $[a] = [b]$, and by the lemma on classes that
              happens exactly when $a \sim b$. This is the sentence that says
              equivalence downstairs has become equality upstairs.
          - text: >
              $[a] \cap [b] = \emptyset$
            feedback: >
              Backwards: equal images mean the classes are the *same* set, which
              is as far from disjoint as possible once classes are nonempty.
        feedback: >
          It tells you $a \sim b$, and nothing stronger. Turning equivalence into
          equality is precisely what the quotient was built to do.
      - teach: >
          At the extremes: quotienting by $\Delta_A$ changes nothing, since every
          class is a singleton, and quotienting by all of $A \times A$ leaves a
          one-element set. Everything interesting happens in between.

  - node: foundations.relations.well-defined-on-quotient
    hook: >
      Every definition on a quotient starts by picking a representative, and the
      answer must not depend on the pick — skipping that check is the single
      most common error in the whole subject.
    explanation: >
      You want to define something on $A/{\sim}$, but the only concrete
      objects you can write formulas about live in $A$. So you write the
      rule using a representative: "to compute the value at the class $[a]$,
      take $a$ and do such-and-such". The problem is immediate — $[a]$ has
      many names, and a different name might give a different answer. If it
      does, the rule defines nothing.

      Precisely: let $f : A \to B$. A function $\bar{f} : A/{\sim} \to B$
      with $\bar{f}([a]) = f(a)$ for all $a$ exists if and only if $f$ is
      constant on classes, that is, $a \sim a'$ implies $f(a) = f(a')$. The
      "only if" is trivial, since $a \sim a'$ makes $[a]$ and $[a']$ the
      same input. The "if" is the content: constancy on classes means the
      recipe assigns one value to each class no matter which representative
      is used, so the assignment is a genuine function, and it is the only
      one with that property. Applying the projection first and then
      $\bar{f}$ recovers $f$ — send $a$ to its class, then evaluate
      $\bar{f}$ there, and you land on $f(a)$. Applying one map after
      another is called composition, and it is made precise in the next
      unit.

      The same test governs operations, not just values. A binary operation
      on $A$ descends to $A/{\sim}$ exactly when replacing both inputs by
      equivalent ones leaves the output in the same class: $a \sim a'$ and
      $b \sim b'$ must imply that $a$ combined with $b$ is equivalent to
      $a'$ combined with $b'$. That condition is called compatibility, or
      congruence, of $\sim$ with the operation.

      In practice the discipline is short. Define using a representative;
      then replace every representative by an equivalent one and check that
      nothing changed. The standard non-example is the rule "send $[a]$ to
      $a$", which dies the moment some class has two members.
    worked: >
      On $\mathbb{Z}$, let $a \sim b$ mean that $a$ and $b$ differ by a multiple
      of $6$, and try to define $\bar{f}([a])$ as the remainder of $a$ on
      division by $3$. Test it: suppose $a \sim a'$, so $a - a' = 6k$ for some
      integer $k$. Then $a - a' = 3(2k)$, a multiple of $3$, so $a$ and $a'$
      leave the same remainder on division by $3$. The value does not depend on
      the representative, so $\bar{f}$ is well defined. Compute
      $\bar{f}([14])$: since $14 = 4 \cdot 3 + 2$, the answer is $2$; and the
      other representatives agree, since $20$, $8$ and $-4$ all leave remainder
      $2$ as well. Now try instead the remainder on division by $4$. Take the
      representatives $0$ and $6$ of the same class: $0$ leaves remainder $0$
      and $6$ leaves remainder $2$. Two representatives, two answers, so this
      rule defines nothing on the quotient.
    pitfalls: >
      A rule that "obviously works" on one representative is not checked — the
      whole content is that it works on *all* of them, so the verification is
      the definition's proof, not decoration. The rule "send $[a]$ to $a$" is
      the standard trap, and it fails as soon as one class has two elements.
      Well-definedness also depends on the relation and not only on the formula:
      the remainder on division by $3$ survives collapsing by multiples of $6$
      and would not survive collapsing by multiples of $4$.
    recap: >
      A rule stated through a representative defines something on the quotient
      exactly when equivalent representatives always give the same answer, and
      that check is what you owe every time.
    steps:
      - teach: >
          To define anything on $A/{\sim}$ you have to write formulas about
          elements of $A$, so you name a representative: "the value at $[a]$ is
          computed from $a$". But $[a]$ has many names, and another name could
          give another answer.
      - teach: >
          The criterion: given $f : A \to B$, there is a function
          $\bar{f}$ on $A/{\sim}$ with $\bar{f}([a]) = f(a)$ exactly when $f$ is
          constant on classes — that is, $a \sim a'$ implies $f(a) = f(a')$.
          When it exists it is unique.
      - teach: >
          Why that is the whole story: constancy on classes means the recipe
          hands one value to each class regardless of representative, so the
          assignment really is a function. Send $a$ to its class, evaluate
          $\bar{f}$, and you land on $f(a)$ — applying one map after another,
          which is called composition and is made precise in the next unit.
      - ask: >
          On $\mathbb{Z}$ let $a \sim b$ mean $a$ and $b$ differ by a multiple of
          $6$, and let $\bar{f}([a])$ be the remainder of $a$ on division by $3$.
          What is $\bar{f}([14])$?
        expects: "2"
        hint: >
          First convince yourself the rule is well defined, then just divide.
        feedback: >
          Two, since $14 = 4 \cdot 3 + 2$. The rule is legitimate because
          $a - a' = 6k$ gives $a - a' = 3(2k)$, so equivalent representatives
          share a remainder on division by $3$ — and indeed $20$, $8$ and $-4$
          all return $2$ as well.
      - ask: >
          With the same relation on $\mathbb{Z}$, which rule is *not* well
          defined on the quotient?
        choices:
          - text: >
              Send $[a]$ to the remainder of $a$ on division by $2$
            feedback: >
              This one survives: $a - a' = 6k$ is even, so equivalent
              representatives have the same parity. Any divisor of $6$ works.
          - text: >
              Send $[a]$ to the remainder of $a$ on division by $4$
            correct: true
            feedback: >
              Take $0$ and $6$, two representatives of one class: their
              remainders on division by $4$ are $0$ and $2$. One class, two
              answers, so no function is defined.
          - text: >
              Send $[a]$ to the class $[a+1]$
            feedback: >
              Well defined: if $a - a' = 6k$ then $(a+1) - (a'+1) = 6k$ too, so
              equivalent inputs give equivalent outputs and the same class comes
              out.
          - text: >
              Send every class to the number $7$
            feedback: >
              A constant rule cannot depend on the representative, so it is
              trivially well defined — dull, but legitimate.
        feedback: >
          The division-by-$4$ rule fails, because $4$ does not divide $6$: the
          class of $0$ contains $6$, and those two representatives disagree.
          Well-definedness depends on the relation, not just on the formula.
      - teach: >
          The same test governs operations. A binary operation descends to the
          quotient exactly when $a \sim a'$ and $b \sim b'$ imply that $a$
          combined with $b$ is equivalent to $a'$ combined with $b'$ — a
          condition called compatibility, or congruence, of $\sim$ with the
          operation.
      - ask: >
          Why does the rule "send $[a]$ to $a$" fail to define a function on
          $A/{\sim}$ in general?
        choices:
          - text: >
              Because $[a]$ is a set and $a$ is an element
            feedback: >
              The level shift is real but not the obstruction — plenty of
              legitimate rules take a class and return an element, such as
              sending a class to a remainder.
          - text: >
              Because a class with two members would have to be sent to both of
              them
            correct: true
            feedback: >
              If $a \ne b$ and $a \sim b$ then $[a] = [b]$ is a single input,
              and the rule demands the output be $a$ and also $b$. A function
              cannot do that, so the rule collapses exactly when some class has
              more than one element.
          - text: >
              Because $\sim$ might fail to be transitive
            feedback: >
              $\sim$ is an equivalence relation by assumption, so transitivity
              holds. The failure has nothing to do with the axioms and
              everything to do with the class having several members.
        feedback: >
          One class, several representatives, and the rule names a different
          output for each. This is the canonical non-example — and if every class
          were a singleton it would work fine, which shows the failure is about
          the collapsing.
      - teach: >
          So the discipline is fixed: define using a representative, then swap
          every representative for an equivalent one and confirm nothing moved.
          That verification usually carries the real content of the
          construction.

  - node: foundations.relations.def-congruence-mod-n
    hook: >
      This is the equivalence relation you will use more than any other, and the
      one whose compatibility with addition and multiplication makes an entire
      arithmetic survive the collapse.
    explanation: >
      Fix an integer $n \ge 1$. For integers $a$ and $b$, write $a \equiv b
      \pmod{n}$ to mean $n \mid (a - b)$, that is, $a - b = kn$ for some
      integer $k$. Read it as: $a$ and $b$ sit at the same place on a circle
      of $n$ positions. On a clock face with $n = 12$, $15$ and $3$ are
      congruent because they differ by $12$.

      It is an equivalence relation, and each axiom has a one-line reason.
      Reflexive: $a - a = 0 = 0 \cdot n$, so $n \mid 0$. Symmetric: if $a -
      b = kn$ then $b - a = (-k)n$, so a multiple of $n$ stays a multiple of
      $n$ when negated. Transitive is the one worth watching. Suppose $a - b
      = kn$ and $b - c = mn$. The trick is to write $a - c = (a - b) + (b -
      c)$, the intermediate $b$ cancelling, so $a - c = kn + mn = (k+m)n$
      and $n \mid (a-c)$. Transitivity is nothing but the fact that
      multiples of $n$ are closed under addition.

      The equivalent description is often the useful one: $a \equiv b
      \pmod{n}$ exactly when $a$ and $b$ leave the same remainder on
      division by $n$. That follows from division with remainder — if $a =
      q_1n + r$ and $b = q_2n + r$ then $a - b = (q_1 - q_2)n$, and
      conversely the remainders differ by a multiple of $n$ while both lie
      between $0$ and $n-1$, so they are equal. Since there are exactly $n$
      possible remainders, congruence modulo $n$ has exactly $n$ classes on
      $\mathbb{Z}$.

      The property that makes it more than a bookkeeping device is
      compatibility: if $a \equiv a'$ and $b \equiv b'$ modulo $n$, then $a
      + b \equiv a' + b'$ and $ab \equiv a'b'$ modulo $n$. Addition falls
      out of adding the two difference equations; multiplication takes one
      more line, writing $ab - a'b' = (a - a')b + a'(b - b')$, and both
      terms carry a factor of $n$. This is exactly the compatibility
      condition that lets an operation descend to a quotient.
    worked: >
      Take $n = 7$. Is $-4 \equiv 24 \pmod{7}$? Compute the difference:
      $24 - (-4) = 28 = 4 \cdot 7$, so yes. Now watch compatibility do its work.
      We have $3 \equiv 10 \pmod{7}$, since $10 - 3 = 7$, and
      $5 \equiv 12 \pmod{7}$, since $12 - 5 = 7$. Compatibility predicts that
      the products are congruent, and they are: $3 \cdot 5 = 15$ and
      $10 \cdot 12 = 120$, with $120 - 15 = 105 = 15 \cdot 7$. Nothing about
      $120$ had to be computed to know this in advance — replacing $10$ by $3$
      and $12$ by $5$ before multiplying is legitimate, which is exactly why
      modular arithmetic is fast.
    pitfalls: >
      The notation $a \equiv b \pmod{n}$ is a statement about the *pair*
      $a, b$; reading $\pmod{n}$ as an operation applied to $b$ alone turns a
      true congruence like $-4 \equiv 24 \pmod{7}$ into nonsense. The definition
      is $n \mid (a-b)$, so it is the modulus that divides the difference and
      never the other way round. And congruence is compatible with addition and
      multiplication but not with everything: from $a \equiv b$ you may not
      cancel a common factor freely, since $2 \cdot 3 \equiv 2 \cdot 0 \pmod{6}$
      while $3$ and $0$ are not congruent modulo $6$.
    recap: >
      Congruence modulo $n$ relates integers differing by a multiple of $n$; it
      is an equivalence relation with $n$ classes, and it respects addition and
      multiplication.
    steps:
      - teach: >
          Fix $n \ge 1$. Write $a \equiv b \pmod{n}$ to mean $n \mid (a-b)$,
          that is, $a - b = kn$ for some integer $k$. Picture a circle of $n$
          positions: congruent integers land on the same position.
      - teach: >
          It is an equivalence relation. Reflexive because $a - a = 0$ is
          $0 \cdot n$; symmetric because $a - b = kn$ gives $b - a = (-k)n$.
      - ask: >
          Which computation establishes transitivity of congruence modulo $n$?
        choices:
          - text: >
              $a - c = (a-b)(b-c)$, a product of multiples of $n$
            feedback: >
              That identity is simply false, and it would prove too much
              besides: a product of two multiples of $n$ is a multiple of
              $n^{2}$.
          - text: >
              $a - c = (a-b) + (b-c)$, a sum of multiples of $n$
            correct: true
            feedback: >
              The intermediate $b$ cancels, leaving $a - c = kn + mn = (k+m)n$.
              Transitivity is exactly the closure of multiples of $n$ under
              addition.
          - text: >
              $a - c = 0$ whenever $a \equiv b$ and $b \equiv c$
            feedback: >
              Congruent integers are rarely equal — $3$ and $10$ are congruent
              modulo $7$ and differ by $7$. The conclusion should be that $n$
              divides the difference, not that it vanishes.
        feedback: >
          Write $a - c = (a-b) + (b-c)$. Each bracket is a multiple of $n$, and
          multiples of $n$ are closed under addition, so $n \mid (a-c)$.
      - ask: >
          What is the smallest nonnegative integer congruent to $-17$ modulo
          $5$?
        expects: "3"
        hint: >
          Add multiples of $5$ to $-17$ until you land in the range $0$ to $4$.
        feedback: >
          Three. $-17 + 20 = 3$, and $20 = 4 \cdot 5$, so
          $-17 \equiv 3 \pmod{5}$. Since $0 \le 3 \le 4$, no smaller nonnegative
          integer works.
      - teach: >
          The useful reformulation: $a \equiv b \pmod{n}$ exactly when $a$ and
          $b$ leave the same remainder on division by $n$. Division with
          remainder gives it, since $a = q_1n + r$ and $b = q_2n + r$ force
          $a - b = (q_1 - q_2)n$.
      - ask: >
          How many equivalence classes does congruence modulo $4$ have on
          $\mathbb{Z}$?
        expects: "4"
        hint: >
          Two integers are congruent exactly when they share a remainder. How
          many remainders can division by $4$ produce?
        feedback: >
          Four. Division with remainder gives every integer exactly one
          remainder in $\{0,1,2,3\}$, so there are four classes: the multiples of
          $4$, and the integers one, two and three more than a multiple of $4$.
          In general congruence modulo $n$ has exactly $n$ classes.
      - teach: >
          The property that makes this relation special is compatibility: if
          $a \equiv a'$ and $b \equiv b'$ modulo $n$, then
          $a + b \equiv a' + b'$ and $ab \equiv a'b'$ modulo $n$. For the
          product, write $ab - a'b' = (a-a')b + a'(b-b')$ — both terms carry a
          factor of $n$.
      - teach: >
          That is precisely the compatibility condition an operation needs in
          order to descend to a quotient, which is why the arithmetic of
          $\mathbb{Z}$ survives the collapse and comparison does not.

  - node: foundations.relations.ex-integers-mod-n
    hook: >
      This is the first quotient anyone meets that is genuinely useful, and it
      is the place to watch well-definedness earn its keep: two operations
      survive the collapse and one comparison does not.
    explanation: >
      Quotient $\mathbb{Z}$ by congruence modulo $n$ and you get
      $\mathbb{Z}/n\mathbb{Z}$, whose elements are the residue classes $[a]
      = \{a + kn : k \in \mathbb{Z}\}$ — each an infinite arithmetic
      progression of step $n$. Division with remainder says every integer is
      congruent to exactly one of $0, 1, \ldots, n-1$, so however infinite
      the classes are, there are exactly $n$ of them and
      $\mathbb{Z}/n\mathbb{Z} = \{[0],[1],\ldots,[n-1]\}$.

      Now put arithmetic on it. The obvious rules are $[a] + [b] = [a+b]$
      and $[a][b] = [ab]$, and both are stated through representatives, so
      both need the well-definedness check. That check is exactly the
      compatibility of congruence with addition and multiplication: if $a
      \equiv a'$ and $b \equiv b'$ modulo $n$, then $a + b \equiv a' + b'$
      and $ab \equiv a'b'$, so the class of the answer does not depend on
      which representatives were used. With that in hand the operations are
      legitimate, and they make $\mathbb{Z}/n\mathbb{Z}$ a commutative ring
      — for $n = 12$, the arithmetic of a clock face.

      The reason to insist on the check is that a natural-looking rule
      fails. Try to order the classes by "$[a] \le [b]$ whenever $a \le b$".
      In $\mathbb{Z}/12\mathbb{Z}$ the class $[1]$ also equals $[13]$. Using
      the representative $1$ against $5$, the rule says $[1] \le [5]$; using
      the representative $13$ against the same $5$, it says the opposite.
      One question, two answers, so no order has been defined. Nothing
      distinguishes this failed rule from the successful ones except the
      verification.

      Computing in $\mathbb{Z}/n\mathbb{Z}$ is therefore a licence to reduce
      early. Since only the class matters, you may replace any number by its
      remainder before adding or multiplying, which is what keeps modular
      arithmetic on small numbers no matter how large the inputs.
    worked: >
      Work in $\mathbb{Z}/7\mathbb{Z}$, whose seven elements are
      $[0], [1], \ldots, [6]$. Add: $[5] + [4] = [9]$, and $9 = 1 \cdot 7 + 2$,
      so $[9] = [2]$ and the sum is $[2]$. Multiply: $[5][4] = [20]$, and
      $20 = 2 \cdot 7 + 6$, so $[5][4] = [6]$. Check that representatives really
      do not matter by redoing the product with different names for the same
      classes: $[5] = [12]$ and $[4] = [-3]$, and
      $12 \cdot (-3) = -36 = (-6) \cdot 7 + 6$, so $[-36] = [6]$ once more. The
      answer $[6]$ is the same, as compatibility guaranteed before either
      multiplication was performed.
    pitfalls: >
      The elements of $\mathbb{Z}/n\mathbb{Z}$ are classes, not the integers
      $0$ through $n-1$; those integers are merely the standard representatives,
      and $[9] = [2]$ in $\mathbb{Z}/7\mathbb{Z}$ is an equality of sets rather
      than a rounding. Order does not descend: "$[a] \le [b]$ whenever
      $a \le b$" gives contradictory answers for different representatives, so
      $\mathbb{Z}/n\mathbb{Z}$ carries arithmetic but no compatible order. And
      cancellation can fail: in $\mathbb{Z}/6\mathbb{Z}$, $[2][3] = [2][0]$
      while $[3] \ne [0]$.
    recap: >
      $\mathbb{Z}/n\mathbb{Z}$ has exactly $n$ elements, and its addition and
      multiplication exist only because congruence is compatible with those two
      operations — and with nothing else.
    steps:
      - teach: >
          Quotienting $\mathbb{Z}$ by congruence modulo $n$ gives
          $\mathbb{Z}/n\mathbb{Z}$, whose elements are the residue classes
          $[a] = \{a + kn : k \in \mathbb{Z}\}$ — each an infinite progression of
          step $n$.
      - teach: >
          Division with remainder says each integer is congruent to exactly one
          of $0, 1, \ldots, n-1$, so the quotient is finite:
          $\mathbb{Z}/n\mathbb{Z} = \{[0],[1],\ldots,[n-1]\}$, an infinite set
          collapsed to $n$ points.
      - ask: >
          How many elements does $\mathbb{Z}/9\mathbb{Z}$ have?
        expects: "9"
        hint: >
          Count the possible remainders on division by $9$.
        feedback: >
          Nine, one class per remainder in $\{0,1,\ldots,8\}$. Each class is
          infinite, but the number of classes is exactly the modulus.
      - teach: >
          Define $[a] + [b] = [a+b]$ and $[a][b] = [ab]$. Both rules name
          representatives, so both need checking — and the check is precisely
          the compatibility of congruence with addition and multiplication.
      - ask: >
          In $\mathbb{Z}/7\mathbb{Z}$, compute $[5][4]$ and give the
          representative $r$ with $0 \le r \le 6$.
        expects: "6"
        hint: >
          Multiply the representatives, then take the remainder on division by
          $7$.
        feedback: >
          Six. $[5][4] = [20]$, and $20 = 2 \cdot 7 + 6$, so $[20] = [6]$.
          Using other names for the same classes gives the same answer:
          $12 \cdot (-3) = -36 = (-6) \cdot 7 + 6$, so $[-36] = [6]$ too.
      - ask: >
          In $\mathbb{Z}/7\mathbb{Z}$, compute $[3] + [6]$ and give the
          representative $r$ with $0 \le r \le 6$.
        expects: "2"
        hint: >
          Add, then reduce modulo $7$.
        feedback: >
          Two. $[3] + [6] = [9]$, and $9 = 1 \cdot 7 + 2$, so the sum is $[2]$.
          Reducing early would have worked as well — that licence is exactly
          what well-definedness grants.
      - teach: >
          Since only the class matters, you may replace any number by its
          remainder before computing. That is why modular arithmetic stays on
          small numbers no matter how large the inputs are.
      - ask: >
          Why does "$[a] \le [b]$ whenever $a \le b$" fail to define an order on
          $\mathbb{Z}/12\mathbb{Z}$?
        choices:
          - text: >
              Because $\le$ is not antisymmetric on $\mathbb{Z}$
            feedback: >
              $\le$ on $\mathbb{Z}$ is perfectly antisymmetric. The failure
              happens when the rule is transported to classes, not before.
          - text: >
              Because $[1] = [13]$, and the rule answers differently for the
              representatives $1$ and $13$ against $5$
            correct: true
            feedback: >
              One class, two names: $1 \le 5$ holds so the rule says
              $[1] \le [5]$, while $13 \le 5$ fails so it says the opposite
              about the very same pair of classes. No relation has been defined
              at all.
          - text: >
              Because $\mathbb{Z}/12\mathbb{Z}$ is finite
            feedback: >
              Finiteness is no obstacle — a finite set can certainly carry an
              order. The obstruction is that this particular rule depends on the
              representative.
        feedback: >
          The rule gives contradictory answers for different representatives of
          $[1]$. Addition and multiplication survive the collapse because
          congruence is compatible with them; comparison is not, and no amount
          of care with the formula will fix that.

  - node: foundations.relations.def-partial-order
    hook: >
      Keep reflexivity and transitivity but swap symmetry for antisymmetry, and
      instead of "the same as" you get "at most" — a notion of before and after
      that is allowed to leave some pairs unranked.
    explanation: >
      A partial order on $A$ is a relation, written $\le$, that is
      reflexive, antisymmetric and transitive; the pair $(A, \le)$ is then a
      poset. Compare the list with an equivalence relation's: reflexive and
      transitive are shared, and the third axiom is where the two part
      company. Symmetry says two-way ties are everywhere; antisymmetry says
      two-way ties happen only when the elements are equal. One relation
      flattens, the other ranks.

      Antisymmetry is the load-bearing axiom, and it is what prevents
      cycles. Suppose $a \le b$ and $b \le c$ and $c \le a$ with the
      elements distinct. Transitivity gives $a \le c$, and with $c \le a$
      antisymmetry forces $a = c$ — a contradiction. So an order has no
      closed loops, which is why it can be drawn with everything flowing one
      way up the page.

      The strict version is available whenever you want it: write $a < b$
      for "$a \le b$ and $a \ne b$". It is irreflexive and transitive.
      Conversely, any irreflexive transitive $<$ gives a partial order by
      declaring $a \le b$ when $a < b$ or $a = b$, and the two constructions
      undo each other. So "partial order" and "strict order" are two
      spellings of one idea, and you may use whichever is convenient.

      The word *partial* is a warning, not an apology. Two elements $a$ and
      $b$ may satisfy neither $a \le b$ nor $b \le a$; they are then
      incomparable, and the order simply declines to rank them. Standard
      examples: $\le$ on $\mathbb{R}$; $\subseteq$ on the subsets of a set,
      where $\{1\}$ and $\{2\}$ are incomparable; divisibility on
      $\mathbb{N}$, where $2$ and $3$ are; and the coordinatewise order on
      $\mathbb{R}^2$, where $(a_1,a_2) \le (b_1,b_2)$ means $a_1 \le b_1$
      and $a_2 \le b_2$, so $(1,5)$ and $(2,3)$ are incomparable. Drop
      antisymmetry and you have only a preorder, which cannot rank at all.
    worked: >
      Take $D = \{1,2,3,6\}$ ordered by divisibility, $a \le b$ meaning
      $a \mid b$. Reflexive: $a \mid a$ for each of $1, 2, 3, 6$, yes.
      Antisymmetric: if $a \mid b$ and $b \mid a$ with $a, b$ positive then
      $a \le b$ and $b \le a$ as ordinary numbers, so $a = b$ — no two-way ties.
      Transitive: $b = ka$ and $c = mb$ give $c = (mk)a$, yes. So $(D, \mid)$ is
      a poset. Listing the relation: $(1,1),(1,2),(1,3),(1,6)$ from $1$;
      $(2,2),(2,6)$ from $2$; $(3,3),(3,6)$ from $3$; and $(6,6)$ — nine pairs.
      One unordered pair goes unranked: $2$ does not divide $3$ and $3$ does not
      divide $2$, so $2$ and $3$ are incomparable, and the order is genuinely
      partial.
    pitfalls: >
      Incomparable is not equal and not "the same size" — $\{1\}$ and $\{2\}$
      are incomparable under inclusion and have nothing else in common. Failing
      to find $a \le b$ therefore does not license concluding $b \le a$; that
      inference needs totality, which a partial order does not supply. And the
      order lives on a named set: divisibility is a partial order on
      $\mathbb{N}$ and not on $\mathbb{Z}$, where antisymmetry fails between $2$
      and $-2$.
    recap: >
      A partial order is reflexive, antisymmetric and transitive — equality's
      first and third axioms with symmetry replaced by a ban on two-way ties.
    steps:
      - teach: >
          A partial order on $A$ is a relation $\le$ that is reflexive,
          antisymmetric and transitive, and $(A, \le)$ is then called a poset.
          Two of the three axioms are shared with equivalence relations; the
          third is where they diverge.
      - teach: >
          Symmetry would say two-way ties are everywhere; antisymmetry says they
          happen only between an element and itself. One relation flattens the
          set into classes, the other ranks it.
      - ask: >
          Let $A = \{1,2,4,8\}$ with $a \le b$ meaning $a \mid b$. How many
          ordered pairs does this relation contain?
        expects: "10"
        hint: >
          Each element divides itself and everything above it in the chain
          $1, 2, 4, 8$. Count row by row.
        feedback: >
          Ten. From $1$: four pairs; from $2$: three; from $4$: two; from $8$:
          one. $4 + 3 + 2 + 1 = 10$. Every two elements here are comparable,
          which will matter shortly.
      - teach: >
          Antisymmetry is what rules out cycles. If $a \le b \le c \le a$ with
          distinct elements, transitivity gives $a \le c$, and with $c \le a$
          antisymmetry forces $a = c$ — a contradiction. So an order flows one
          way, with no loops.
      - ask: >
          A relation that is reflexive and transitive but not antisymmetric is
          called what, and what does it fail to do?
        choices:
          - text: >
              An equivalence relation; it fails to rank
            feedback: >
              An equivalence relation needs full symmetry, which is much more
              than merely lacking antisymmetry. The relation described here need
              not be symmetric at all.
          - text: >
              A preorder; it can have distinct elements each at most the other,
              so it cannot rank them
            correct: true
            feedback: >
              Reflexive and transitive alone is a preorder. Without
              antisymmetry, distinct $a$ and $b$ may satisfy $a \le b$ and
              $b \le a$, and there is no consistent way to place them.
          - text: >
              A strict order; it fails to be reflexive
            feedback: >
              A strict order is irreflexive by design, whereas this relation is
              reflexive. The missing axiom here is antisymmetry.
        feedback: >
          A preorder. Antisymmetry is exactly the upgrade from "you can move
          between these" to "these are genuinely ranked".
      - teach: >
          The strict version is always available: $a < b$ means $a \le b$ and
          $a \ne b$, which is irreflexive and transitive. Conversely any
          irreflexive transitive $<$ gives a partial order by allowing equality,
          so the two presentations are interchangeable.
      - ask: >
          In the coordinatewise order on $\mathbb{R}^2$, how do $(1,5)$ and
          $(2,3)$ compare?
        choices:
          - text: >
              $(1,5) \le (2,3)$, since $1 \le 2$
            feedback: >
              Both coordinates must obey the inequality. The first does, the
              second does not: $5 \le 3$ is false.
          - text: >
              $(2,3) \le (1,5)$, since $3 \le 5$
            feedback: >
              Same trouble in the other direction: $2 \le 1$ fails, so the
              second coordinate agreeing is not enough.
          - text: >
              They are incomparable
            correct: true
            feedback: >
              Neither inequality holds in both coordinates, so the order simply
              declines to rank them. This is the standard picture of a partial
              order that is not total.
        feedback: >
          Incomparable — and note that this is not a claim that they are equal
          or equally large. The order has nothing to say about this pair, which
          is exactly what the word "partial" records.
      - teach: >
          Reference cases worth keeping: $\le$ on $\mathbb{R}$, where nothing is
          incomparable; $\subseteq$ on subsets, where $\{1\}$ and $\{2\}$ are;
          divisibility on $\mathbb{N}$, where $2$ and $3$ are; and the
          coordinatewise order on $\mathbb{R}^{2}$.

  - node: foundations.relations.def-total-order
    hook: >
      Every order you met before this unit compared everything with everything,
      and giving that property a name is what makes it possible to notice when
      an order lacks it.
    explanation: >
      In a poset $(A,\le)$ call $a$ and $b$ comparable when $a \le b$ or $b
      \le a$, and incomparable otherwise. The order is total, or linear,
      when every two elements are comparable — no exceptions, including $a$
      with itself, which reflexivity already handles.

      The strict form of the same demand is trichotomy: for all $a$ and $b$,
      *exactly* one of $a < b$, $a = b$, $b < a$ holds. The word "exactly"
      is doing two jobs. At least one holds because the order is total. At
      most one holds because $a < b$ and $b < a$ together would give $a = b$
      by antisymmetry while both strict statements require $a \ne b$. So
      totality supplies existence and antisymmetry supplies uniqueness, and
      trichotomy is the two of them packaged together.

      The picture is the payoff. A totally ordered set lays out along a
      single line: every element has a definite position relative to every
      other. A merely partial order branches, with incomparable elements
      sitting off to the side of each other. That difference is why the
      vocabulary of maximal versus greatest elements is invisible on
      $\mathbb{R}$ and unavoidable on a general poset.

      Each of $\mathbb{N}$, $\mathbb{Z}$, $\mathbb{Q}$ and $\mathbb{R}$ with
      its usual $\le$ is totally ordered, which is why totality feels like
      part of the meaning of "order" until you meet a counterexample.
      Inclusion on the subsets of a set with at least two elements is not
      total, since $\{1\}$ and $\{2\}$ are incomparable; nor is divisibility
      on $\mathbb{N}$, where $2$ and $3$ are.
    worked: >
      Take $D = \{1,2,3,4,6,12\}$ under divisibility and test totality by
      counting. There are $15$ unordered pairs of distinct elements. The element
      $1$ divides everything, contributing $5$ comparable pairs. From $2$:
      $2 \mid 4$, $2 \mid 6$, $2 \mid 12$ give $3$ more, while $2$ and $3$ are
      incomparable. From $3$: $3 \mid 6$ and $3 \mid 12$ give $2$, while $3$ and
      $4$ are incomparable. From $4$: $4 \mid 12$ gives $1$, while $4$ and $6$
      are incomparable. From $6$: $6 \mid 12$ gives $1$. Total comparable:
      $5+3+2+1+1 = 12$, so $3$ of the $15$ pairs are incomparable and the order
      is not total. Restrict to $\{1,2,4,12\}$, however, and every pair is
      comparable — $1 \mid 2 \mid 4 \mid 12$ — so divisibility restricted to
      that subset is a total order.
    pitfalls: >
      Incomparable does not mean equal, and it does not mean "tied": under
      inclusion $\{1\}$ and $\{2\}$ are incomparable and thoroughly different.
      So from "not $a \le b$" you may only conclude $b \le a$ when the order is
      known to be total — on a general poset that inference is simply invalid.
      And totality is a property of the order together with the set: the same
      divisibility relation is total on $\{1,2,4,12\}$ and not on
      $\{1,2,3,4,6,12\}$.
    recap: >
      A total order compares every two elements, so its elements lie along one
      line, and its strict form obeys trichotomy.
    steps:
      - teach: >
          In a poset, $a$ and $b$ are comparable when $a \le b$ or $b \le a$, and
          incomparable otherwise. The order is total when every two elements are
          comparable.
      - ask: >
          Under divisibility on $D = \{1,2,3,4,6,12\}$, how many of the $15$
          unordered pairs of distinct elements are incomparable?
        expects: "3"
        hint: >
          $1$ is comparable with everything and $12$ is too. Look for pairs
          where neither number divides the other.
        feedback: >
          Three: $\{2,3\}$, $\{3,4\}$ and $\{4,6\}$. Counting the comparable
          ones confirms it — $5$ from $1$, then $3$, $2$, $1$ and $1$, giving
          $12$, and $15 - 12 = 3$.
      - teach: >
          The strict form of totality is trichotomy: for all $a$ and $b$ exactly
          one of $a < b$, $a = b$, $b < a$ holds. At least one, because the order
          is total; at most one, because $a < b$ and $b < a$ would give $a = b$
          by antisymmetry while both require $a \ne b$.
      - ask: >
          On a poset that is *not* total, what may you conclude from "$a \le b$
          is false"?
        choices:
          - text: >
              $b \le a$
            feedback: >
              That inference needs totality. Without it, $a$ and $b$ may simply
              be incomparable, with neither inequality holding.
          - text: >
              $b < a$ or $a = b$
            feedback: >
              Same problem dressed differently: it still assumes the two
              elements are ranked at all. Incomparability is a third
              possibility.
          - text: >
              Only that $a \le b$ fails; $b \le a$ may hold or may not
            correct: true
            feedback: >
              With three possibilities in play — $a$ below $b$, $b$ below $a$, or
              neither — ruling out one leaves two. This is the most common
              incorrect step in poset arguments.
        feedback: >
          Nothing beyond the negation itself. Trichotomy is exactly the extra
          hypothesis that would let you turn a failed comparison into the
          opposite one, and a partial order does not supply it.
      - teach: >
          Picture the difference. A total order lays its elements out along one
          line; a partial order branches, with incomparable elements sitting off
          to the side of each other and never meeting.
      - ask: >
          Among the four subsets of $\{1,2\}$ ordered by $\subseteq$, how many
          of the six unordered pairs of distinct subsets are incomparable?
        expects: "1"
        hint: >
          $\emptyset$ sits below everything and $\{1,2\}$ above everything. That
          leaves only one pair to judge.
        feedback: >
          One: $\{1\}$ and $\{2\}$. The other five pairs all involve $\emptyset$
          or $\{1,2\}$, which are comparable with everything. A single
          incomparable pair is already enough to make the order partial rather
          than total.
      - teach: >
          Totality depends on the set as well as the relation. Divisibility is
          not total on $\{1,2,3,4,6,12\}$ and is total on $\{1,2,4,12\}$ — the
          same relation, restricted.
      - teach: >
          Because $\mathbb{N}$, $\mathbb{Z}$, $\mathbb{Q}$ and $\mathbb{R}$ are
          all totally ordered, totality feels like part of the meaning of
          "order" until you meet inclusion or divisibility. The distinctions
          ahead are exactly the ones that collapse when the order is total.

  - node: foundations.relations.hasse-diagram
    hook: >
      A finite order contains far more pairs than it contains information, and
      the Hasse diagram is the picture that draws only the pairs you cannot
      deduce.
    explanation: >
      Let $(A,\le)$ be a finite poset. Say $b$ *covers* $a$ when $a < b$ and
      nothing sits strictly between: there is no $c \in A$ with $a < c < b$. A
      covering pair is an immediate step, with no intermediate stop.

      The diagram draws each element as a dot, places $b$ higher on the page
      than $a$ whenever $b$ covers $a$, and joins them by a plain segment. No
      other segments, and no arrowheads — the upward direction on the page
      carries all the orientation. What has been deleted is exactly the pairs
      forced by reflexivity and transitivity, which is why the picture is
      readable at all.

      Nothing is lost. To recover the order, read $a \le b$ as "$a = b$, or some
      upward path of segments leads from $a$ to $b$". Transitivity says any such
      path certifies the comparison, and the covering relation contains every
      step you need, because in a finite poset any $a < b$ can be broken into
      covering steps: if something lies strictly between, subdivide, and
      finiteness stops the subdivision. That last clause is the load-bearing
      step, and it is where the finiteness hypothesis is spent.

      Shape reads off structure. A total order draws as one vertical stack.
      Incomparable elements appear as separate branches with no path between
      them. The subsets of $\{1,2,3\}$ under inclusion draw as a cube standing
      on the vertex $\emptyset$. And finiteness genuinely matters — in
      $(\mathbb{Q},\le)$ no rational covers another, since a third rational
      always fits between, so the covering relation is empty and the diagram
      shows nothing at all.
    worked: >
      Draw the divisors of $12$, namely $\{1,2,3,4,6,12\}$, ordered by
      divisibility. Put $1$ at the bottom. Above it, $2$ and $3$ side by side —
      each covers $1$, since no divisor of $12$ lies strictly between. Above
      those, $4$ sits over $2$ alone, and $6$ sits over both $2$ and $3$. At the
      top, $12$ sits over $4$ and over $6$. That is seven segments: $1$ to $2$,
      $1$ to $3$, $2$ to $4$, $2$ to $6$, $3$ to $6$, $4$ to $12$, $6$ to $12$.
      Deliberately absent are $1$ to $4$, $1$ to $6$, $1$ to $12$, $2$ to $12$
      and $3$ to $12$: each is recoverable as an upward path, so drawing it
      would add nothing. To read $2 \le 12$ off the picture, follow $2$ to $4$
      to $12$. To see that $4$ and $6$ are incomparable, note that no upward
      path joins them in either direction.
    pitfalls: >
      Drawing the transitive edges is the standard beginner's diagram, and it
      buries the structure under segments that carry no information — the whole
      economy of the picture is that they are omitted. Loops for the reflexive
      pairs are dropped for the same reason. And the construction needs
      finiteness: in $(\mathbb{Q},\le)$ or $(\mathbb{R},\le)$ nothing covers
      anything, so the diagram is a cloud of dots with no segments and tells you
      nothing about the order.
    recap: >
      A Hasse diagram draws only the covering pairs of a finite poset, and every
      other comparison is read back as an upward path.
    steps:
      - teach: >
          In a finite poset, say $b$ covers $a$ when $a < b$ and no $c$ satisfies
          $a < c < b$ — an immediate step with no intermediate stop.
      - teach: >
          The diagram draws each element as a dot, puts $b$ above $a$ whenever
          $b$ covers $a$, and joins them by a plain segment. No arrowheads: the
          upward direction carries the orientation. Reflexive and transitive
          pairs are deliberately omitted.
      - ask: >
          Among the divisors of $30$, how many elements cover $1$?
        expects: "3"
        hint: >
          Which divisors of $30$ have no other divisor of $30$ strictly between
          them and $1$?
        feedback: >
          Three: $2$, $3$ and $5$. Nothing sits strictly between $1$ and a prime,
          so each prime divisor covers $1$. The divisor $6$ does not, since
          $1 < 2 < 6$.
      - teach: >
          Nothing is lost by the omissions. Read $a \le b$ as "$a = b$, or an
          upward path of segments runs from $a$ to $b$" — transitivity turns any
          such path into the comparison.
      - teach: >
          The reason every comparison is reachable is that in a *finite* poset
          any $a < b$ splits into covering steps: if something lies strictly
          between, subdivide, and finiteness stops the process. That is where the
          hypothesis is spent.
      - ask: >
          How many segments does the Hasse diagram of the subsets of $\{1,2,3\}$
          under $\subseteq$ have?
        expects: "12"
        hint: >
          One subset covers another exactly when it is obtained by adding a
          single element. Count, for each subset, how many elements can be
          added.
        feedback: >
          Twelve. A covering step adds one element, so from a subset of size $k$
          there are $3-k$ steps up: $3$ from the empty set, $2$ from each of the
          three singletons, and $1$ from each of the three two-element subsets.
          That is $3 + 6 + 3 = 12$ — the twelve edges of a cube.
      - ask: >
          Why does the Hasse diagram carry no information for
          $(\mathbb{Q}, \le)$?
        choices:
          - text: >
              Because $\mathbb{Q}$ is not totally ordered
            feedback: >
              $\mathbb{Q}$ is totally ordered by $\le$ — every two rationals are
              comparable. The problem is not comparability.
          - text: >
              Because no rational covers another, so the covering relation is
              empty
            correct: true
            feedback: >
              Between any two rationals lies a third, so no step is ever
              immediate. With no covering pairs there are no segments, and the
              picture is a cloud of dots.
          - text: >
              Because $\mathbb{Q}$ has no greatest element
            feedback: >
              Missing a top would only leave the diagram unbounded above.
              $\mathbb{N}$ also has no greatest element and draws perfectly well
              as an infinite stack.
        feedback: >
          The covering relation is empty. Finiteness — or at least the presence
          of immediate steps — is what the whole construction rests on.
      - teach: >
          Shape reads off structure: a total order is one vertical stack,
          incomparable elements are separate branches with no path between them,
          and the subsets of a three-element set form a cube standing on
          $\emptyset$.

  - node: foundations.relations.def-maximal-greatest
    hook: >
      "Nothing is above me" and "everything is below me" say the same thing on a
      line and completely different things on a branching order — and nearly
      every subtle argument about posets turns on the gap.
    explanation: >
      Let $(A,\le)$ be a poset and $S \subseteq A$. An element $m \in S$ is
      *maximal* in $S$ if no $x \in S$ satisfies $m < x$: nothing in $S$ lies
      strictly above $m$. It is *greatest* in $S$ if $x \le m$ for every
      $x \in S$: everything in $S$ lies at or below $m$. Minimal and least are
      the same two notions upside down.

      One implication holds. A greatest element is maximal, since if $m < x$
      then $x \le m$ and antisymmetry force $m = x$, contradicting $m < x$. A
      greatest element is also unique: if $m$ and $m'$ are both greatest then
      $m \le m'$ and $m' \le m$, so $m = m'$ by antisymmetry.

      The converse fails, and the reason is exactly incomparability. Maximality
      only says nothing lies strictly *above* $m$; it says nothing about
      elements sitting off to the side, unranked against $m$. So a poset can
      have several maximal elements, none of them greatest. Take the proper
      subsets of $\{1,2\}$ under inclusion: $\{1\}$ and $\{2\}$ are both
      maximal, since the only set properly containing either is $\{1,2\}$, which
      is not in the poset — and neither is greatest, because they are
      incomparable with each other.

      When the order is total the two notions collapse, since nothing can sit
      off to the side; that is why the distinction is invisible on $\mathbb{R}$
      and has to be learned separately. The existence guarantees differ too.
      Every finite nonempty poset has a maximal element — start anywhere and
      climb; each step is strictly upward, so no element repeats, and finiteness
      stops you at an element with nothing above it. It need not have a greatest
      one. That gap is exactly what Zorn's lemma will deliver on for infinite
      posets, and exactly what an argument needing a genuine maximum has to
      close by hand.
    worked: >
      Take the seven proper subsets of $\{1,2,3\}$ ordered by $\subseteq$: the
      empty set, three singletons and three two-element subsets. Maximal
      elements: a set is maximal if no proper subset of $\{1,2,3\}$ properly
      contains it. The two-element subsets $\{1,2\}$, $\{1,3\}$ and $\{2,3\}$
      qualify, since the only set properly containing any of them is $\{1,2,3\}$
      itself, which is excluded. So there are three maximal elements. Greatest
      element: there is none, since $\{1,2\}$ and $\{1,3\}$ are incomparable and
      a greatest element would have to sit above both, forcing it to contain
      $\{1,2,3\}$. At the bottom the picture is different: $\emptyset$ is
      contained in every subset, so it is a least element — and being least, it
      is the unique minimal element too.
    pitfalls: >
      Maximal does not mean unique and does not mean greatest; the proper
      subsets of $\{1,2,3\}$ have three maximal elements and no greatest one.
      Failing to find something above $m$ therefore proves maximality and never
      greatestness, which additionally requires comparing $m$ with *every*
      element. And both notions are relative to the subset $S$ you named: an
      element maximal in $S$ may have plenty of things above it elsewhere in
      $A$.
    recap: >
      Greatest means above everything and is unique; maximal only means nothing
      is strictly above, so a poset may have many maximal elements and no
      greatest.
    steps:
      - teach: >
          For $S \subseteq A$: $m \in S$ is maximal in $S$ if no element of $S$
          is strictly above it, and greatest in $S$ if every element of $S$ is at
          or below it. Minimal and least are the same two ideas turned upside
          down.
      - teach: >
          One implication is free. A greatest element is maximal — if $m < x$
          then $x \le m$ too, and antisymmetry gives $m = x$. It is also unique,
          since two greatest elements are each at most the other.
      - ask: >
          In the poset $\{1,2,3,4,6\}$ ordered by divisibility, how many maximal
          elements are there?
        expects: "2"
        hint: >
          For each element ask whether any *other* element of this set is a
          multiple of it.
        feedback: >
          Two: $4$ and $6$. Nothing in the set is a proper multiple of either —
          $12$ would be, and it is not present. The elements $1$, $2$ and $3$ all
          have multiples here, so none of them is maximal.
      - teach: >
          The converse fails, and incomparability is the reason. Maximality only
          rules out elements strictly *above*; it says nothing about elements
          sitting off to the side, unranked against $m$.
      - ask: >
          The poset of the previous check has two maximal elements. What is its
          greatest element?
        choices:
          - text: >
              $6$, since it is the largest number present
            feedback: >
              Size as an integer is not the order here. A greatest element must
              be a multiple of every element, and $6$ is not a multiple of $4$.
          - text: >
              Both $4$ and $6$
            feedback: >
              A greatest element is unique when it exists — two of them would be
              each at most the other and hence equal by antisymmetry. Two
              maximal elements are perfectly possible; two greatest ones are
              not.
          - text: >
              There is none
            correct: true
            feedback: >
              A greatest element would have to be a multiple of both $4$ and
              $6$, hence of $12$, and no such element is in the set. Maximal
              elements exist; a greatest one does not.
        feedback: >
          There is no greatest element. This is the gap in one picture: nothing
          lies above $4$ and nothing lies above $6$, yet neither lies above the
          other.
      - ask: >
          Among the six nonempty proper subsets of $\{1,2,3\}$ ordered by
          $\subseteq$, how many minimal elements are there?
        expects: "3"
        hint: >
          The empty set has been excluded. Which of the remaining subsets
          contain no other member of the poset?
        feedback: >
          Three: the singletons $\{1\}$, $\{2\}$ and $\{3\}$. Each contains no
          other member of this poset, so nothing is strictly below it, and there
          is no least element, since a least one would have to be contained in
          all three.
      - teach: >
          When the order is total the two notions coincide, because nothing can
          sit off to the side. That is why the distinction is invisible on
          $\mathbb{R}$ and has to be learned deliberately.
      - teach: >
          Existence differs too. Every finite nonempty poset has a maximal
          element — start anywhere and climb, each step strictly upward so
          no element repeats, and finiteness halts you. A greatest element
          is not guaranteed at all, and closing that gap for infinite posets
          is what Zorn's Lemma is for.

  - node: foundations.relations.def-bounds-poset
    hook: >
      A greatest element has to belong to the set it dominates; a bound does
      not — and that one relaxation is what lets $(0,1)$ have a ceiling at all.
    explanation: >
      Let $(A,\le)$ be a poset and $S \subseteq A$. An element $b \in A$ is an
      upper bound of $S$ if $x \le b$ for every $x \in S$, and $S$ is bounded
      above when at least one such $b$ exists. Lower bounds and bounded below
      are the same idea inverted.

      Compare this with a greatest element of $S$. The condition looks
      identical — above everything in $S$ — but the quantifier ranges over a
      different place: a greatest element is required to *be in $S$*, while a
      bound is drawn from all of $A$. That is the whole difference, and it is
      not cosmetic. The interval $(0,1)$ in $\mathbb{R}$ has no greatest
      element, since for any $x < 1$ the number $(x+1)/2$ is larger and still
      inside; yet $1$ is an upper bound, and so is every real at least $1$.
      Loosening membership turned an empty notion into a useful one.

      Two consequences worth carrying. Bounds are never unique: anything above
      an upper bound is another upper bound, so bounded-above sets have whole
      families of them. And the empty set is bounded above as soon as $A$ is
      nonempty, because the condition "$x \le b$ for every $x \in \emptyset$" is
      vacuously true — every element of $A$ is an upper bound of $\emptyset$.
      That looks like a curiosity and is the reason several later hypotheses
      have to be stated carefully.

      In the poset of subsets of a set $X$ under $\subseteq$, an upper bound of
      a family is any subset of $X$ containing all its members, and the union of
      the family is one. That example is the engine of most applications of
      Zorn's lemma later: a chain of partial objects is bounded by the object
      you get by putting them all together.
    worked: >
      Take $A = \{1,2,3,4,6,12\}$ ordered by divisibility and $S = \{4,6\}$. An
      upper bound is an element of $A$ that both $4$ and $6$ divide. Test them
      all: $1$, $2$, $3$, $4$ and $6$ each fail one of the two divisions, while
      $4 \mid 12$ and $6 \mid 12$, so $12$ is the only upper bound. Now lower
      bounds — elements of $A$ dividing both $4$ and $6$. Here $1 \mid 4$ and
      $1 \mid 6$, and $2 \mid 4$ and $2 \mid 6$, while $3$ fails on $4$ and $4$
      fails on $6$. So the lower bounds are $1$ and $2$, two of them, and
      neither belongs to $S$. Note that $S$ itself has no greatest element —
      $4$ and $6$ are incomparable — even though it is bounded above.
    pitfalls: >
      A bound need not belong to the set it bounds, and a set can be bounded
      above while having no greatest element at all — $(0,1)$ in $\mathbb{R}$ is
      the standard case. Bounds are also not unique, so "the upper bound" is
      always a slip. And the empty set is bounded above by *every* element of a
      nonempty $A$, since the defining condition has nothing to check.
    recap: >
      An upper bound of $S$ sits above everything in $S$ but is drawn from the
      whole poset, so it need not belong to $S$ and is never unique.
    steps:
      - teach: >
          For $S \subseteq A$, an element $b \in A$ is an upper bound of $S$ if
          $x \le b$ for every $x \in S$, and $S$ is bounded above when one
          exists. Lower bound and bounded below are the same idea inverted.
      - teach: >
          Set that beside "greatest element of $S$". The inequality is the same;
          what changed is where the candidate comes from. A greatest element must
          lie in $S$; a bound may come from anywhere in $A$.
      - ask: >
          In $A = \{1,2,3,4,6,12\}$ under divisibility, how many upper bounds
          does $S = \{2,3\}$ have?
        expects: "2"
        hint: >
          An upper bound must be a multiple of both $2$ and $3$ — inside this
          set.
        feedback: >
          Two: $6$ and $12$. Both are divisible by $2$ and by $3$; the elements
          $1$, $2$, $3$ and $4$ each fail at least one division. Neither bound
          belongs to $S$, which is perfectly normal.
      - teach: >
          Loosening membership is what makes the notion useful. The interval
          $(0,1)$ in $\mathbb{R}$ has no greatest element — for any $x < 1$ the
          number $(x+1)/2$ is larger and still inside — yet $1$ bounds it above.
      - ask: >
          Which statement about $(0,1)$ in $\mathbb{R}$ is correct?
        choices:
          - text: >
              $1$ is the greatest element of $(0,1)$
            feedback: >
              A greatest element must belong to the set, and $1 \notin (0,1)$.
              This is exactly the confusion the two words exist to prevent.
          - text: >
              $1$ is an upper bound of $(0,1)$, and $(0,1)$ has no greatest
              element
            correct: true
            feedback: >
              Every $x \in (0,1)$ satisfies $x \le 1$, so $1$ bounds the set from
              above; and no element of the set dominates it, since $(x+1)/2$
              always beats $x$ from inside.
          - text: >
              $(0,1)$ is not bounded above, since no element of it works
            feedback: >
              A bound is drawn from all of $\mathbb{R}$, not from $(0,1)$. Being
              bounded above says nothing about whether a candidate lies inside.
        feedback: >
          $1$ is an upper bound and the set has no greatest element. Holding
          those two facts at once is the whole point of separating the two
          words.
      - teach: >
          Bounds are never unique: anything above an upper bound is again an
          upper bound. So a bounded-above set carries a whole family of bounds,
          and speaking of "the" upper bound is a slip.
      - ask: >
          In $A = \{1,2,3,4,6,12\}$ under divisibility, how many upper bounds
          does the empty set have?
        expects: "6"
        hint: >
          The condition is "$x \le b$ for every $x$ in the set". How many such
          $x$ are there to check?
        feedback: >
          Six — every element of $A$. With no $x$ to test, the condition holds
          vacuously for each candidate, so $\emptyset$ is bounded above by
          everything as soon as $A$ is nonempty. This edge case matters when
          hypotheses about chains are stated later.
      - teach: >
          In the subsets of $X$ under $\subseteq$, an upper bound of a family is
          any subset containing all its members, and the union of the family is
          one. That observation is the engine of most applications of Zorn's
          lemma.

  - node: foundations.relations.def-lub-poset
    hook: >
      Among all the ceilings over a set, one may be lowest — and whether it
      always exists is the single property that separates $\mathbb{R}$ from
      $\mathbb{Q}$.
    explanation: >
      Let $S \subseteq A$ in a poset $(A,\le)$. Collect all the upper bounds of
      $S$; they form a subset of $A$. If that subset has a least element, call
      it the least upper bound, or supremum, $\sup S$. Unwinding: $s = \sup S$
      means $s$ is an upper bound of $S$, and $s \le b$ for every upper bound
      $b$. The greatest lower bound, or infimum $\inf S$, is the same
      construction upside down.

      Two easy facts. A supremum is unique when it exists, because it is a least
      element of a set and least elements are unique by antisymmetry. And if $S$
      happens to have a greatest element $m$, then $m$ is $\sup S$: it is an
      upper bound, and it lies below every other upper bound because it belongs
      to $S$. So suprema generalise maxima, agreeing with them whenever a
      maximum exists.

      Existence is a genuine restriction, not a formality. In $(\mathbb{Q},\le)$
      the set of positive rationals with square less than $2$ is bounded above —
      by $2$, say — and has no least upper bound, because any rational bound can
      be nudged down towards the missing $\sqrt{2}$ and any rational below it can
      be nudged up. The failure is not about the set being infinite, either: in a
      general poset even a two-element subset can lack a supremum. Take four
      elements $a$, $b$, $c$, $d$ with $a$ and $b$ each below both $c$ and $d$,
      while $a$ and $b$ are incomparable and $c$ and $d$ are incomparable. The
      upper bounds of $\{a,b\}$ are $c$ and $d$, and neither is below the other,
      so the set of upper bounds has no least element.

      Two names come from this. A poset in which every pair of elements has both
      a supremum and an infimum is a lattice. One in which every nonempty subset
      that is bounded above has a supremum is Dedekind-complete, and completeness
      of $\mathbb{R}$ is precisely that assertion for the single poset
      $(\mathbb{R},\le)$.
    worked: >
      Work in $A = \{1,2,3,4,6,12\}$ under divisibility. Compute $\sup\{2,3\}$.
      The upper bounds are $6$ and $12$, as computed by testing which elements
      both $2$ and $3$ divide. Which is least in the divisibility order? Since
      $6 \mid 12$, the element $6$ sits below $12$, so $\sup\{2,3\} = 6$ — the
      least common multiple, which is what a supremum means in this poset. Now
      $\inf\{4,6\}$. The lower bounds are $1$ and $2$, and $1 \mid 2$, so $2$ is
      the greatest of them and $\inf\{4,6\} = 2$ — the greatest common divisor.
      Neither answer belongs to the set it was computed from, and both are
      unique.
    pitfalls: >
      $\sup S$ need not belong to $S$: $\sup (0,1) = 1$ in $\mathbb{R}$, and no
      element of $(0,1)$ is $1$. Being bounded above does not make a supremum
      exist — in $\mathbb{Q}$ the rationals with square below $2$ are bounded
      and have none, and in a general poset even a two-element subset can fail.
      And $\sup S$ is not the same as a maximal element of $S$: a maximal element
      only has nothing above it inside $S$, while a supremum must sit above
      every element of $S$ and below every bound.
    recap: >
      The supremum of $S$ is the least of its upper bounds — unique when it
      exists, not required to lie in $S$, and not guaranteed to exist at all.
    steps:
      - teach: >
          Gather all the upper bounds of $S$. If that collection has a least
          element, it is the least upper bound, or supremum, $\sup S$. The
          infimum $\inf S$ is the greatest of the lower bounds.
      - teach: >
          Unwound, $s = \sup S$ says two things at once: $x \le s$ for every
          $x \in S$, and $s \le b$ for every upper bound $b$ of $S$. Proving a
          supremum always means proving both halves.
      - ask: >
          In $A = \{1,2,3,4,6,12\}$ under divisibility, what is
          $\sup \{4,6\}$?
        expects: "12"
        hint: >
          List the elements that both $4$ and $6$ divide, then find the least of
          them in the divisibility order.
        feedback: >
          Twelve. The only element of $A$ divisible by both $4$ and $6$ is $12$,
          so the set of upper bounds is $\{12\}$ and its least element is $12$.
          In the divisibility poset a supremum is a least common multiple.
      - teach: >
          A supremum is unique when it exists, being a least element, and it
          generalises a maximum: if $S$ has a greatest element $m$, then $m$ is
          an upper bound lying below every other, so $\sup S = m$.
      - ask: >
          Among the divisors of $30$ under divisibility, what is
          $\inf \{6,10\}$?
        expects: "2"
        hint: >
          Find the elements dividing both $6$ and $10$, then take the greatest
          of those in the divisibility order.
        feedback: >
          Two. The common divisors present are $1$ and $2$, and $1 \mid 2$, so
          $2$ is the greatest of them. An infimum in this poset is a greatest
          common divisor — and note $2$ belongs to neither $\{6\}$ nor $\{10\}$.
      - teach: >
          Existence is a real restriction. In $(\mathbb{Q},\le)$ the positive
          rationals with square below $2$ are bounded above and have no least
          upper bound: every rational bound can be nudged down and every rational
          below can be nudged up.
      - ask: >
          Four elements $a$, $b$, $c$, $d$ with $a$ and $b$ each below both $c$
          and $d$, while $a$ and $b$ are incomparable and $c$ and $d$ are
          incomparable. What is $\sup\{a,b\}$?
        choices:
          - text: >
              $c$, since it is an upper bound
            feedback: >
              It is an upper bound, but a supremum must also sit below every
              upper bound, and $c \le d$ is false. Being *an* upper bound is
              only half the requirement.
          - text: >
              There is no supremum
            correct: true
            feedback: >
              The upper bounds are exactly $c$ and $d$, and neither is below the
              other, so the set of upper bounds has no least element. Even a
              two-element subset can lack a supremum in a general poset.
          - text: >
              Both $c$ and $d$
            feedback: >
              A supremum is unique when it exists, since a least element is
              unique by antisymmetry. Two answers means the supremum does not
              exist.
        feedback: >
          No supremum exists. The set of upper bounds is $\{c,d\}$, an
          antichain, and an antichain of two elements has no least member.
      - teach: >
          Two names come out of this. A poset where every pair has a supremum and
          an infimum is a lattice; one where every nonempty subset bounded above
          has a supremum is Dedekind-complete — and completeness of $\mathbb{R}$
          is exactly that statement about the single poset $(\mathbb{R},\le)$.

  - node: foundations.relations.def-well-order
    hook: >
      Induction and recursion do not work on every ordered set; they work
      exactly where you cannot descend forever, and that is what this definition
      pins down.
    explanation: >
      A well-order on $A$ is a total order in which every nonempty subset of $A$
      has a least element. The second clause is doing all the work, and it is
      much stronger than it looks.

      Totality is in fact free. Suppose every nonempty subset of a poset has a
      least element and take any $a, b \in A$. The subset $\{a,b\}$ is nonempty,
      so it has a least element — which is $a$ or $b$, and either way the two
      are comparable. So the definition could have said "partial order in which
      every nonempty subset has a least element" and lost nothing.

      The consequence that matters is the absence of infinite strictly
      decreasing sequences. If $a_1 > a_2 > a_3 > \cdots$ ran forever, the set
      of its terms would be a nonempty subset with no least element — whatever
      term you propose, the next one is smaller. That is precisely why induction
      and definition by recursion are licensed along a well-order: an argument
      that reduces every case to strictly smaller cases must terminate, because
      there is nowhere infinitely far down to go.

      $\mathbb{N}$ with its usual order is well-ordered. None of $\mathbb{Z}$,
      $\mathbb{Q}$, $\mathbb{R}$ is, and the failures are instructive.
      $\mathbb{Z}$ fails on the whole set, which has no least element at all.
      $\mathbb{Q}$ and $\mathbb{R}$ fail even on bounded subsets: the interval
      $(0,1)$ is bounded below by $0$, and it has no least element, since
      $x/2$ beats any $x$ inside it. So bounding does not rescue a set — being
      well-ordered is far stronger than being totally ordered, and stronger than
      having infima. The well-ordering theorem says every set admits *some*
      well-order; it is equivalent to the axiom of choice and not provable
      without it.
    worked: >
      Test $S = \{n \in \mathbb{N} : n^{2} > 30\}$ for a least element. Since
      $\mathbb{N}$ is well-ordered and $S$ is nonempty — $10^{2} = 100 > 30$ —
      one must exist. Find it by climbing: $1, 4, 9, 16, 25$ are the squares of
      $1$ through $5$, and all are at most $30$, so none of those five belongs to
      $S$; then $6^{2} = 36 > 30$, so $6 \in S$. Everything below $6$ has been
      excluded, so $\min S = 6$. Now try the same in $\mathbb{Q}$ with
      $T = \{q \in \mathbb{Q} : q > 0$ and $q^{2} > 30\}$. It is nonempty and
      bounded below by $0$, yet it has no least element: given any $q \in T$ one
      can find a smaller positive rational still squaring above $30$, since
      $\sqrt{30}$ is irrational and rationals crowd in above it. Same shape of
      question, and no answer.
    pitfalls: >
      Well-ordered is much stronger than totally ordered: $\mathbb{Z}$,
      $\mathbb{Q}$ and $\mathbb{R}$ are all totally ordered and none is
      well-ordered. Bounding below does not help either — $(0,1)$ in
      $\mathbb{R}$ is bounded below and has no least element, so an infimum is
      not a minimum. And the requirement is about *every* nonempty subset, so
      exhibiting a least element of the whole set proves nothing; $\mathbb{Q}$
      restricted to the nonnegative rationals has a least element, $0$, and is
      still not well-ordered.
    recap: >
      A well-order is a total order in which every nonempty subset has a least
      element, so there are no infinite descents and induction is licensed.
    steps:
      - teach: >
          A well-order on $A$ is a total order in which every nonempty subset of
          $A$ has a least element. The second clause carries all the weight.
      - teach: >
          Totality is actually free. If every nonempty subset has a least
          element, apply that to $\{a,b\}$: its least element is $a$ or $b$, so
          the two are comparable. The word "total" in the definition is emphasis,
          not an extra demand.
      - ask: >
          What is the least element of $\{n \in \mathbb{N} : n^{2} > 30\}$?
        expects: "6"
        hint: >
          Square the small natural numbers in order until you first pass $30$.
        feedback: >
          Six. The squares $1, 4, 9, 16, 25$ all fail, and $6^{2} = 36 > 30$
          succeeds. Since $\mathbb{N}$ is well-ordered, a least element had to
          exist before any computation began.
      - teach: >
          The consequence that matters: no infinite strictly decreasing sequence
          can exist. Its terms would form a nonempty subset with no least
          element, since whatever term you nominate, the next one is smaller.
      - ask: >
          What is the least element of $\{n \in \mathbb{N} : 5n > 62\}$?
        expects: "13"
        hint: >
          Divide $62$ by $5$ and take the first natural number past the
          quotient.
        feedback: >
          Thirteen. $5 \cdot 12 = 60$, which does not exceed $62$, while
          $5 \cdot 13 = 65$ does. Every smaller natural number gives an even
          smaller product, so $13$ is least.
      - teach: >
          That is exactly what licenses induction and definition by recursion. An
          argument that reduces every case to strictly smaller cases must
          terminate, because a well-order offers nowhere infinitely far down to
          go.
      - ask: >
          Which set is *not* well-ordered by its usual order?
        choices:
          - text: >
              $\mathbb{N}$
            feedback: >
              This is the standard example of a well-ordered set, and the reason
              induction on the natural numbers works.
          - text: >
              The interval $(0,1)$ in $\mathbb{R}$
            correct: true
            feedback: >
              It is bounded below by $0$ and has no least element: for any
              $x \in (0,1)$ the number $x/2$ is smaller and still inside. Being
              bounded below is not the same as having a minimum.
          - text: >
              Any finite totally ordered set
            feedback: >
              Every nonempty subset of a finite total order has a least element —
              walk down the finite list. Finite total orders are always
              well-orders.
        feedback: >
          $(0,1)$ fails, and it fails even though it is bounded below. Bounding
          gives an infimum, not a minimum, and only a minimum counts here.
      - teach: >
          So $\mathbb{Z}$, $\mathbb{Q}$ and $\mathbb{R}$ are totally ordered and
          not well-ordered. The well-ordering theorem asserts that every set
          admits *some* well-order — a statement equivalent to the axiom of
          choice, and not provable without it.

  - node: foundations.relations.def-chain
    hook: >
      Inside a branching order there may still be strands along which
      everything compares, and those strands are the objects Zorn's Lemma
      quantifies over.
    explanation: >
      Let $(A,\le)$ be a poset. A chain in $A$ is a subset $C \subseteq A$ that
      is totally ordered by the restriction of $\le$ — any two elements of $C$
      are comparable. An antichain is the opposite extreme: a subset whose
      elements are pairwise incomparable. A poset is a mixture of the two
      tendencies, and the two words let you say which parts of it look like a
      line and which look like a spread.

      Note the edge cases, which are edge cases in *both* directions. The empty
      set is a chain and an antichain, since the conditions quantify over pairs
      and there are none. A singleton is likewise both, since its only pair is an
      element with itself, which is comparable by reflexivity and not a pair of
      distinct elements. So the interesting question is always about size, not
      about existence.

      In the Hasse diagram a chain is a set of dots joined by upward paths — a
      strand of the picture — and an antichain is a set of dots with no upward
      path between any two, a horizontal spread. A total order is a single chain
      containing everything; an order with no comparabilities beyond equality is
      one big antichain.

      Chains are not required to be finite, countable, or capped. In
      $(\mathbb{R},\le)$ the whole set is a chain, and it has no greatest
      element; the positive rationals form a chain with no least element. This
      generality is exactly why Zorn's lemma has to hypothesise that every chain
      has an upper bound rather than assuming it — for infinite chains, the
      existence of a cap is real content.
    worked: >
      Take the divisors of $30$, that is $\{1,2,3,5,6,10,15,30\}$, ordered by
      divisibility. A chain: $1 \mid 2 \mid 6 \mid 30$, so $\{1,2,6,30\}$ is a
      chain with four elements, and every two of its members are comparable —
      check $2 \mid 30$ and $1 \mid 6$ to be sure. Can a chain here have five?
      Each step of a chain must multiply by at least one new prime factor, and
      $30 = 2 \cdot 3 \cdot 5$ has three of them, so a chain runs at most
      $1$, then one prime, then a product of two, then $30$: four elements.
      An antichain: $\{2,3,5\}$, since no prime divides another, and it has
      three elements; $\{6,10,15\}$ is another of size three. Four pairwise
      incomparable divisors are impossible here, so the longest chain has four
      elements and the largest antichain has three.
    pitfalls: >
      A chain is a subset, not a sequence — it need not be finite, need not be
      countable, and need not contain a greatest element, as $(\mathbb{R},\le)$
      itself shows. "Chain" also does not mean "linked by covering steps": any
      totally ordered subset qualifies, so $\{1,30\}$ is a chain among the
      divisors of $30$ even though $30$ does not cover $1$. And the empty set and
      every singleton are chains *and* antichains, so a claim proved only for
      those has been proved for nothing.
    recap: >
      A chain is a totally ordered subset of a poset and an antichain a pairwise
      incomparable one, and neither is required to be finite or capped.
    steps:
      - teach: >
          A chain in a poset is a subset on which the order happens to be total:
          any two of its elements are comparable. An antichain is the opposite —
          a subset whose elements are pairwise incomparable.
      - teach: >
          Both notions are trivially satisfied by the empty set and by every
          singleton, since the conditions quantify over pairs of distinct
          elements and there are none. So the useful question is always how large
          a chain or antichain can be.
      - ask: >
          Among the divisors of $12$, ordered by divisibility, how many elements
          does the longest chain have?
        expects: "4"
        hint: >
          Start at $1$ and climb, multiplying by a prime each time. How many
          prime factors does $12$ have, counted with repetition?
        feedback: >
          Four: $1 \mid 2 \mid 4 \mid 12$, or equally $1 \mid 2 \mid 6 \mid 12$.
          Since $12 = 2 \cdot 2 \cdot 3$ has three prime factors with
          repetition, a chain can take at most three steps up from $1$, giving
          four elements.
      - teach: >
          In the Hasse diagram a chain is a strand — dots joined by upward
          paths — and an antichain is a horizontal spread with no upward path
          between any two of its dots.
      - ask: >
          Among the divisors of $12$, how many elements does the largest
          antichain have?
        expects: "2"
        hint: >
          Look for divisors where neither divides the other, then try to extend
          such a set to three.
        feedback: >
          Two, for instance $\{4,6\}$ or $\{2,3\}$ or $\{3,4\}$. No three
          divisors of $12$ are pairwise incomparable: any third element would
          have to avoid dividing and being divided by both of the others, and
          the six divisors do not allow it.
      - teach: >
          Chains carry no finiteness requirement. In $(\mathbb{R},\le)$ the whole
          set is a chain with no greatest element, and the positive rationals
          form a chain with no least element.
      - ask: >
          Which subset of a poset is guaranteed to be both a chain and an
          antichain?
        choices:
          - text: >
              Any subset with exactly two elements
            feedback: >
              Two distinct elements are either comparable or not: comparable
              makes it a chain and not an antichain, incomparable the reverse. It
              can never be both.
          - text: >
              Any singleton
            correct: true
            feedback: >
              With no pair of distinct elements to test, both conditions hold
              vacuously. The empty set qualifies for the same reason, which is
              why a claim proved only for these cases has been proved for
              nothing.
          - text: >
              The whole poset, always
            feedback: >
              Only when the order is total is the whole poset a chain, and only
              when nothing is comparable is it an antichain. A typical poset is
              neither.
        feedback: >
          Singletons, and the empty set alongside them. These degenerate cases
          are worth naming precisely so that they are never mistaken for
          evidence.
      - teach: >
          This generality is what makes Zorn's Lemma's hypothesis
          substantial. Asking that *every* chain have an upper bound is a
          real demand once chains may be infinite and uncapped.

  - node: foundations.relations.zorn
    hook: >
      This is the tool that produces maximal objects nobody can construct — a
      basis for an arbitrary vector space, a maximal ideal in a ring — by
      checking one hypothesis about chains and nothing else.
    explanation: >
      Zorn's lemma: let $(A,\le)$ be a nonempty poset in which every chain has an
      upper bound in $A$. Then $A$ has a maximal element.

      Read the hypothesis and the conclusion carefully, because both are exactly
      as strong as stated and no stronger. The hypothesis quantifies over
      *chains*, not over subsets, and the bound must lie *in $A$*. This is where
      all the work goes in practice, and it is where the lemma fails when it
      fails: $(\mathbb{R},\le)$ is a nonempty poset with no maximal element, and
      sure enough the chain $\mathbb{R}$ itself has no upper bound inside
      $\mathbb{R}$. The conclusion, for its part, produces a *maximal* element —
      nothing strictly above it — and never claims a greatest one. Given how
      often several maximal elements coexist, that restraint is necessary.

      Nonemptiness is listed for emphasis rather than force. The empty set is
      itself a chain, so the hypothesis already supplies an upper bound for it,
      and any such bound is an element of $A$. If you prefer to require bounds
      only for nonempty chains, you must then assume $A$ nonempty separately;
      the two formulations are equivalent.

      Zorn's lemma is not provable in $\mathrm{ZF}$. It is equivalent to the
      axiom of choice and to the well-ordering theorem, and it is the form in
      which choice is used in practice. The applications share one shape: build
      a poset of *partial* objects ordered by extension — partial bases, partial
      ideals, partial embeddings — observe that the union of a chain of partial
      objects is again a partial object and bounds the chain, and take the
      maximal element Zorn hands back. That last step is why upper bounds in
      posets of subsets, where unions do the bounding, were worth noticing.
    worked: >
      Let $A$ be the set of *proper* subsets of $\{1,2,3,4\}$, ordered by
      $\subseteq$; it is nonempty, since $\emptyset$ belongs to it. Check the
      chain hypothesis. $A$ is finite, so every chain in it is a finite totally
      ordered set and therefore has a greatest element, which lies in $A$ and
      bounds the chain; the empty chain is bounded by $\emptyset$. So Zorn
      applies and $A$ has a maximal element. Which ones? A proper subset is
      maximal exactly when the only proper subset properly containing it is none
      at all, and that happens precisely for the three-element subsets:
      $\{1,2,3\}$, $\{1,2,4\}$, $\{1,3,4\}$ and $\{2,3,4\}$ — four of them. Note
      what Zorn did and did not give: it promised at least one maximal element,
      and there are four, no one of which is greatest, since no two of them are
      comparable.
    pitfalls: >
      Zorn concludes *maximal*, never greatest — asking it for a top element is
      the standard misuse, and the four maximal proper subsets above show why it
      could not deliver one. The hypothesis is about chains, and the bound must
      live inside the poset: for the finite subsets of $\mathbb{N}$ ordered by
      inclusion, the chain $\{0\} \subseteq \{0,1\} \subseteq \{0,1,2\}
      \subseteq \cdots$ has no finite upper bound, and indeed that poset has no
      maximal element, since any finite set can be enlarged. And the hypothesis
      must be checked for *every* chain, including the uncountable ones —
      verifying it only for increasing sequences proves nothing in general.
    recap: >
      If a nonempty poset caps every one of its chains, Zorn's lemma returns a
      maximal element — nothing above it, and no claim of being above everything.
    steps:
      - teach: >
          Zorn's lemma: if $(A,\le)$ is a nonempty poset in which every chain has
          an upper bound in $A$, then $A$ has a maximal element. That is the
          whole statement.
      - teach: >
          The hypothesis quantifies over chains, not over arbitrary subsets, and
          the bound must lie inside $A$. That restriction is what makes the
          hypothesis checkable — and it is what fails in the counterexamples.
      - ask: >
          Why does Zorn's lemma not apply to $(\mathbb{R}, \le)$, which has no
          maximal element?
        choices:
          - text: >
              Because $\mathbb{R}$ is uncountable
            feedback: >
              Cardinality is irrelevant to the statement. Zorn applies to
              posets of any size, and most of its serious applications are to
              uncountable ones.
          - text: >
              Because the chain $\mathbb{R}$ itself has no upper bound in
              $\mathbb{R}$
            correct: true
            feedback: >
              $\mathbb{R}$ is totally ordered, so the whole set is a chain, and
              nothing in $\mathbb{R}$ lies above every real. The hypothesis fails
              on the largest chain there is.
          - text: >
              Because $\mathbb{R}$ is not well-ordered
            feedback: >
              Zorn never mentions well-orders in its hypothesis. What it needs is
              upper bounds for chains, and that is precisely what is missing
              here.
        feedback: >
          The chain hypothesis fails on $\mathbb{R}$ itself. This example is
          worth keeping, because it shows the hypothesis is not a formality —
          it is the entire content.
      - teach: >
          Nonemptiness is emphasis rather than force. The empty set is a chain,
          so the hypothesis already hands you an upper bound for it, and that
          bound is an element of $A$.
      - ask: >
          Let $A$ be the proper subsets of $\{1,2,3,4\}$ under $\subseteq$. Zorn
          applies, since $A$ is finite so every chain has a greatest element
          inside it. How many maximal elements does $A$ have?
        expects: "4"
        hint: >
          Which proper subsets cannot be enlarged without becoming all of
          $\{1,2,3,4\}$?
        feedback: >
          Four: $\{1,2,3\}$, $\{1,2,4\}$, $\{1,3,4\}$ and $\{2,3,4\}$. Each is a
          proper subset, and the only set properly containing any of them is
          $\{1,2,3,4\}$, which is excluded. Zorn promised at least one; the poset
          supplies four.
      - ask: >
          In that poset, what does Zorn's lemma *not* let you conclude?
        choices:
          - text: >
              That a maximal element exists
            feedback: >
              That is exactly the conclusion, and here it is true four times
              over.
          - text: >
              That a greatest element exists
            correct: true
            feedback: >
              Zorn produces a maximal element only. Here there is no greatest
              one, since the four maximal subsets are pairwise incomparable — so
              a stronger conclusion would simply be false.
          - text: >
              That every chain has an upper bound
            feedback: >
              That is the hypothesis you verified in order to apply the lemma,
              not something to conclude from it.
        feedback: >
          Nothing about a greatest element. The gap between maximal and greatest
          is not an accident of the proof — it is a fact about the poset, and
          Zorn is stated to respect it.
      - teach: >
          The hypothesis must hold for *every* chain, including infinite ones.
          For the finite subsets of $\mathbb{N}$ under inclusion, the chain
          $\{0\} \subseteq \{0,1\} \subseteq \{0,1,2\} \subseteq \cdots$ has no
          finite upper bound — and that poset has no maximal element, since any
          finite set can be enlarged.
      - teach: >
          Zorn's lemma is not provable in $\mathrm{ZF}$; it is equivalent to the
          axiom of choice and to the well-ordering theorem. Its applications
          share one shape: order partial objects by extension, note that the
          union of a chain of them is again one and bounds the chain, and take
          the maximal object Zorn returns.
