unit: linear-algebra.systems
opening: >
  Linear algebra begins with a question a bookkeeper could ask: given several
  conditions on several unknowns, each one a plain sum of multiples of those
  unknowns, which lists of numbers satisfy all of them at once? This unit
  answers it completely and mechanically. You will strip a system down to an
  array of numbers, learn the three reversible moves on that array and the
  theorem that says those moves never gain or lose a solution, sweep the array
  into a staircase, and read the entire solution set off the staircase — a
  single point, or a family with parameters, or nothing at all. By the end you
  should be able to solve any system by hand, say in advance how many solutions
  it has from the shape of its echelon form, and explain why the answer is
  never "exactly two".
lessons:
  - node: linear-algebra.systems.def-linear-equation
    hook: >
      Almost no equation in mathematics can be solved outright; this kind can be
      solved completely, by a procedure, every time — so it is worth knowing
      exactly which equations qualify.
    explanation: >
      Start with something you can see. The equation $2x_1 + 3x_2 = 12$ asks for
      pairs of real numbers. Choose $x_1 = 3$ and it becomes $6 + 3x_2 = 12$, so
      $x_2 = 2$ and the pair $(3, 2)$ works. Choose $x_1 = 0$ and you get
      $(0, 4)$. Every choice of $x_1$ forces exactly one $x_2$, and the answers
      never run out — one equation in two unknowns already has an enormous
      collection of solutions, which is the first sign that the real questions
      here are about whole sets of answers rather than about a single answer.

      The general shape is $a_1 x_1 + a_2 x_2 + \cdots + a_n x_n = b$, where the
      coefficients $a_1, \dots, a_n$ and the constant term $b$ are fixed real
      numbers. The word *linear* is doing precise work: each unknown appears to
      the first power only, multiplied by a constant and touched by nothing
      else. So $\sqrt{2} x_1 - \pi x_2 = 7$ is linear despite its unlovely
      coefficients, while $x_1 x_2 = 1$, $x_1^2 = 4$ and $\sin x_1 = 0$ are not
      — the first multiplies two unknowns together, the second raises one to a
      power, the third buries one inside a function.

      A solution is an ordered $n$-tuple $(s_1, \dots, s_n) \in \mathbb{R}^n$
      that turns the equation into a true statement when its entries are
      substituted for the unknowns in order. The word *ordered* earns its place:
      $(3,2)$ solves $2x_1 + 3x_2 = 12$ and $(2,3)$ does not, because the first
      slot belongs to $x_1$ and the second to $x_2$.

      The all-zero case is not a curiosity to skip past. If every $a_i = 0$ the
      equation reads $0 = b$. When $b = 0$ that is true whatever the unknowns
      are, so every tuple in $\mathbb{R}^n$ solves it; when $b \ne 0$ it is
      false whatever the unknowns are, so nothing solves it. These two
      degenerate equations are precisely what a long computation tends to leave
      behind at the bottom of the page, and reading them correctly is what will
      tell you whether a whole system has any answers.
    worked: >
      Test $4x_1 - x_2 + 0 x_3 = 9$ against three candidates. For $(2, -1, 5)$:
      $4(2) - (-1) + 0(5) = 8 + 1 = 9$, a true statement, so it is a solution —
      and notice that the third entry could have been anything, since its
      coefficient is $0$. For $(2, 1, 5)$: $8 - 1 = 7$, and $7 \ne 9$, so it is
      not. For $(1, -5, 0)$: $4 + 5 = 9$, so it is. To manufacture solutions on
      demand, choose the last two entries freely and solve for the first: with
      $x_2 = 3$ and $x_3 = 7$ the equation becomes $4x_1 - 3 = 9$, so $x_1 = 3$
      and $(3, 3, 7)$ is a solution.
    pitfalls: >
      The coefficients may be any real numbers at all, however unpleasant:
      $\sqrt{2} x_1 = 3$ is linear, because linearity is a condition on how the
      *unknowns* appear, not on how the numbers look. The equation $x_1 x_2 = 0$
      is not linear even though each unknown appears to the first power, since
      they appear multiplied by each other. And $0 = 0$ and $0 = 5$ are both
      legitimate linear equations rather than nonsense to be crossed out — the
      first is satisfied by every tuple and the second by none.
    recap: >
      A linear equation sets a constant combination of the unknowns equal to a
      constant, its solutions are the ordered tuples that make it true, and the
      degenerate forms $0 = 0$ and $0 = b$ with $b \ne 0$ are allowed and mean
      "everything" and "nothing".
    steps:
      - teach: >
          A single equation in several unknowns is the smallest interesting
          object in this subject. Take $2x_1 + 3x_2 = 12$: pick $x_1 = 3$ and
          $x_2$ is forced to be $2$; pick $x_1 = 0$ and $x_2$ must be $4$. The
          answers do not run out.
      - teach: >
          The general form is $a_1 x_1 + \cdots + a_n x_n = b$, with the
          coefficients $a_i$ and the constant $b$ fixed real numbers. What makes
          it linear is that every unknown occurs to the first power, multiplied
          by a constant and nothing more.
      - teach: >
          So there are no products $x_i x_j$, no squares, no unknown inside a
          root, an exponential or a sine. The coefficients themselves may be as
          ugly as you like — $\sqrt{2} x_1 - \pi x_2 = 7$ is perfectly linear.
      - ask: >
          Which of these is a linear equation in $x_1$ and $x_2$?
        choices:
          - text: >
              $x_1 x_2 + x_1 = 3$
            feedback: >
              Each unknown appears to the first power, but they appear
              multiplied together in $x_1 x_2$, and that product is not a
              constant times an unknown. Not linear.
          - text: >
              $\sqrt{5} x_1 - \frac{1}{2} x_2 = 0$
            correct: true
            feedback: >
              Both unknowns appear to the first power with constant
              coefficients, and $\sqrt{5}$ and $\frac{1}{2}$ are just numbers.
              Ugly coefficients never break linearity.
          - text: >
              $x_1 + \sqrt{x_2} = 4$
            feedback: >
              The unknown $x_2$ sits inside a root, so it is not appearing as a
              constant times $x_2$. Linearity restricts how the unknowns occur,
              not how the constants look.
        feedback: >
          Look only at how the unknowns appear. Constants times first powers,
          added up: linear. Anything else done to an unknown — a product with
          another unknown, a power, a root, a function — is not.
      - teach: >
          A solution is an ordered tuple $(s_1, \dots, s_n)$ in $\mathbb{R}^n$
          that makes the equation true when substituted in order. Order counts:
          $(3,2)$ solves $2x_1 + 3x_2 = 12$ and $(2,3)$ does not.
      - ask: >
          In $5x_1 - 2x_2 = 4$, take $x_1 = 2$. What value of $x_2$ makes the
          resulting pair a solution?
        expects: "3"
        hint: >
          Substitute $x_1 = 2$ and you are left with an ordinary equation in one
          unknown.
        feedback: >
          Substituting gives $10 - 2x_2 = 4$, so $2x_2 = 6$ and $x_2 = 3$. The
          solution is the pair $(2, 3)$, and checking, $10 - 6 = 4$.
      - teach: >
          The degenerate case where every coefficient is zero is allowed, and it
          matters. The equation then reads $0 = b$, and it has nothing to do
          with the unknowns at all — which is exactly why it settles so much.
      - ask: >
          What is the set of solutions of $0 x_1 + 0 x_2 = 7$?
        choices:
          - text: >
              All of $\mathbb{R}^2$, since the unknowns have vanished
            feedback: >
              The unknowns have vanished, but what is left is the false
              statement $0 = 7$. A tuple is a solution only when substituting it
              yields something true.
          - text: >
              The empty set
            correct: true
            feedback: >
              Substituting any pair gives $0 = 7$, which is false, so no pair
              qualifies. The equation is legitimate and has no solutions at all.
          - text: >
              The single pair $(0, 0)$
            feedback: >
              Substituting $(0,0)$ gives $0 = 7$, just as every other pair does.
              There is nothing special about the zero pair here.
        feedback: >
          With all coefficients zero the left side is $0$ for every tuple, so
          the equation reduces to the numeric claim $0 = 7$. It is false, so the
          solution set is empty — while $0 x_1 + 0 x_2 = 0$ is true for every
          tuple and its solution set is all of $\mathbb{R}^2$.
      - teach: >
          Keep those two extremes in view. Everything to come is a way of
          shuffling equations until the ones at the bottom are degenerate, and
          then reading off whether they say "everything" or "nothing".

  - node: linear-algebra.systems.def-linear-system
    hook: >
      One equation in several unknowns pins nothing down. The subject starts
      when you impose several linear conditions on the same unknowns at once and
      ask what survives all of them.
    explanation: >
      Here are three conditions on the same two unknowns: $x_1 + x_2 = 3$,
      $2x_1 - x_2 = 0$, and $x_1 + 2x_2 = 5$. To call a pair a solution of the
      collection, it must satisfy all three. Try $(1, 2)$: the first gives
      $1 + 2 = 3$, true; the second gives $2 - 2 = 0$, true; the third gives
      $1 + 4 = 5$, true. So $(1,2)$ solves the system. Try $(3, 0)$: the first
      gives $3 = 3$, true, but the second gives $6 \ne 0$, so $(3,0)$ is out.
      One failure is enough to disqualify a candidate, however many equations it
      passes.

      Written in general, a system of $m$ linear equations in the $n$ unknowns
      $x_1, \dots, x_n$ is a finite list of $m$ such equations in those same
      unknowns. Because there are now two directions to keep track of, the
      coefficients carry two indices: the $i$-th equation is
      $a_{i1} x_1 + a_{i2} x_2 + \cdots + a_{in} x_n = b_i$, and $a_{ij}$ means
      the coefficient of the $j$-th unknown in the $i$-th equation. Read the
      first index as "which equation" and the second as "which unknown", always
      in that order. The constants $b_1, \dots, b_m$ sit on the right, one per
      equation.

      Nothing ties $m$ to $n$. Three equations in two unknowns is a perfectly
      ordinary system, and so is one equation in five unknowns. It is tempting
      to expect that more equations than unknowns means no solution and fewer
      means many, and the example above already disturbs that expectation: three
      equations, two unknowns, and a solution exists. What actually governs the
      answer is how much the equations repeat one another, which is a question
      you cannot settle by counting.

      One convention makes the general form honest. An unknown that does not
      appear in an equation has coefficient $0$ there, so $3x_1 - x_3 = 5$ is a
      three-unknown equation with $a_{11} = 3$, $a_{12} = 0$ and $a_{13} = -1$.
      Every equation of the system mentions every unknown; some mentions just
      happen to be silent.
    worked: >
      Take the system $3x_1 - x_3 = 5$ and $x_1 + 4x_2 + 2x_3 = 7$, so $m = 2$
      and $n = 3$. Reading off coefficients: $a_{11} = 3$, $a_{12} = 0$,
      $a_{13} = -1$, $b_1 = 5$; and $a_{21} = 1$, $a_{22} = 4$, $a_{23} = 2$,
      $b_2 = 7$. Test $(2, 0, 1)$: the first equation gives $6 - 1 = 5$, true,
      but the second gives $2 + 0 + 2 = 4$, and $4 \ne 7$, so $(2,0,1)$ is not a
      solution of the system even though it solves one of the two equations. To
      find a genuine solution, take $x_1 = 3$; the first equation forces
      $9 - x_3 = 5$, so $x_3 = 4$; feeding both into the second gives
      $3 + 4x_2 + 8 = 7$, so $4x_2 = -4$ and $x_2 = -1$. The tuple $(3, -1, 4)$
      satisfies both: $9 - 4 = 5$ and $3 - 4 + 8 = 7$.
    pitfalls: >
      Solving the equations one at a time and stopping at the first success is
      the classic error — a candidate must clear every equation, and a single
      failure disqualifies it. Reading $a_{ij}$ with the indices swapped is the
      second: the row index comes first and names the equation. And an unknown
      absent from an equation has coefficient $0$ there rather than no
      coefficient, which is what keeps every equation a statement about all $n$
      unknowns.
    recap: >
      A system is $m$ linear equations in the same $n$ unknowns, with $a_{ij}$
      the coefficient of unknown $j$ in equation $i$, and a solution is one
      tuple that satisfies all $m$ of them simultaneously.
    steps:
      - teach: >
          One equation leaves far too much freedom. Real problems impose several
          conditions on the same unknowns at once, and the question becomes
          which tuples survive all of them together.
      - teach: >
          A system of $m$ linear equations in $n$ unknowns is a list of $m$ such
          equations in the same unknowns. The $i$-th reads
          $a_{i1} x_1 + \cdots + a_{in} x_n = b_i$, and $a_{ij}$ is the
          coefficient of the $j$-th unknown in the $i$-th equation.
      - teach: >
          Read the indices in order: first "which equation", then "which
          unknown". An unknown missing from an equation has coefficient $0$
          there, so every equation still speaks about all $n$ unknowns.
      - ask: >
          For the system $2x_1 - x_2 + 4x_3 = 1$, $x_1 + 3x_3 = 5$,
          $5x_2 - x_3 = 0$, what is $a_{22}$?
        expects: "0"
        hint: >
          The first index picks the equation, the second picks the unknown. So
          you want the coefficient of $x_2$ in the second equation.
        feedback: >
          The second equation is $x_1 + 3x_3 = 5$, which does not mention $x_2$
          at all. An absent unknown has coefficient $0$, so $a_{22} = 0$. Its
          other coefficients are $a_{21} = 1$ and $a_{23} = 3$.
      - teach: >
          A solution of the system is a single tuple that satisfies every one of
          the $m$ equations. Passing most of them counts for nothing: one
          failure disqualifies the candidate outright.
      - ask: >
          For the system $x_1 + x_2 = 4$, $x_1 - x_2 = 2$, $2x_1 + x_2 = 8$, how
          many of the three equations does $(3, 1)$ satisfy?
        expects: "2"
        hint: >
          Substitute into each equation separately and count the true
          statements.
        feedback: >
          The first gives $3 + 1 = 4$, true; the second gives $3 - 1 = 2$, true;
          the third gives $6 + 1 = 7$, and $7 \ne 8$, false. So $(3,1)$
          satisfies two of the three — and is therefore not a solution of the
          system.
      - teach: >
          Nothing ties $m$ to $n$. Three equations in two unknowns can have a
          solution, and one equation in five unknowns is a perfectly good
          system. Counting equations against unknowns predicts nothing on its
          own.
      - ask: >
          Which claim about the system $x_1 + x_2 = 3$, $2x_1 - x_2 = 0$,
          $x_1 + 2x_2 = 5$ is correct?
        choices:
          - text: >
              It has no solution, because three equations in two unknowns is one
              condition too many
            feedback: >
              Counting is not an argument. Substituting $(1,2)$ gives $3 = 3$,
              $0 = 0$ and $5 = 5$, so a solution exists despite there being more
              equations than unknowns.
          - text: >
              $(1, 2)$ is a solution, so the extra equation cost nothing here
            correct: true
            feedback: >
              All three checks pass: $1 + 2 = 3$, $2 - 2 = 0$, $1 + 4 = 5$. The
              third equation happens to repeat information the first two already
              carried, which is why it removed nothing.
          - text: >
              $(3, 0)$ is a solution, since it satisfies the first equation
            feedback: >
              It satisfies the first equation and fails the second: $2(3) - 0 =
              6$, not $0$. A candidate must clear every equation.
        feedback: >
          More equations than unknowns is not by itself an obstruction. What
          decides the outcome is how much the equations duplicate one another,
          and that is exactly what elimination is built to measure.

  - node: linear-algebra.systems.def-solution-set
    hook: >
      "Solve the system" is an instruction to produce a *set*, not a number, and
      getting that straight now is what stops you from stopping too early later
      on.
    explanation: >
      Each equation of a system is a condition on $n$-tuples, so each one has a
      solution set of its own: let $S_i \subseteq \mathbb{R}^n$ be the set of
      tuples satisfying the $i$-th equation alone. A tuple solves the system
      exactly when it lies in every one of these, so the solution set of the
      system is $S = S_1 \cap S_2 \cap \cdots \cap S_m$. That single line
      already carries a consequence: intersecting can only remove elements, so
      appending an equation to a system can shrink its solution set but can
      never enlarge it.

      Take $2x_1 + x_2 = 4$ on its own. Its solution set $S_1$ is infinite —
      pick any $x_1 = t$ and $x_2 = 4 - 2t$ follows. Now impose
      $x_1 - x_2 = -1$ as well. Adding the two equations kills $x_2$ and leaves
      $3x_1 = 3$, so $x_1 = 1$, and then $x_2 = 2$. Every tuple in $S_1 \cap
      S_2$ must be $(1,2)$, and substituting back confirms that $(1,2)$ really
      is in both. So $S = \{(1,2)\}$, an infinite set cut down to one element by
      one extra condition.

      To *solve* the system means to describe $S$ exactly — every element and
      nothing else. Exhibiting one member of $S$ is a strictly weaker
      achievement, and in the common case where $S$ is infinite it is not even
      close: a description like "all tuples $(t, 4-2t)$ with $t \in \mathbb{R}$"
      is an answer, while "$(0,4)$ is a solution" is a remark.

      Two systems in the same unknowns are called equivalent when their solution
      sets are equal. This is a relation between whole systems, and it is
      indifferent to how the systems are written: they may have different
      numbers of equations, and neither one need look anything like the other.
      Equivalence is the currency of the whole subject — every method you will
      meet replaces a system by an equivalent one that is easier to read.
    worked: >
      Start with the single equation $2x_1 + x_2 = 4$, whose solution set $S_1$
      contains $(0,4)$, $(1,2)$, $(2,0)$ and infinitely many more. Impose
      $x_1 - x_2 = -1$ as a second equation. Adding the two equations gives
      $3x_1 = 3$, so $x_1 = 1$ and then $x_2 = 2$; substituting back,
      $2(1) + 2 = 4$ and $1 - 2 = -1$, both true. So the solution set of the
      two-equation system is $S = \{(1,2)\}$. Now append a third equation,
      $3x_1 + 2x_2 = 7$. Since $3(1) + 2(2) = 7$, the pair $(1,2)$ survives and
      the solution set is still $\{(1,2)\}$ — the new condition removed nothing.
      Append $x_1 + x_2 = 5$ instead: $1 + 2 = 3$, and $3 \ne 5$, so $(1,2)$ is
      excluded and the solution set of that three-equation system is
      $\emptyset$. Adding equations shrank the set from infinite, to one
      element, to none.
    pitfalls: >
      Producing one tuple and calling the system solved is the trap the whole
      unit is arranged against; when the solution set is infinite you owe a
      description of all of it. Equivalent systems need not have the same number
      of equations — deleting a redundant equation changes the system but not
      the set, and that is the point. And $\emptyset$ is a perfectly good
      solution set: a system with no solutions has been solved once you have
      shown that.
    recap: >
      The solution set is the intersection of the solution sets of the
      individual equations, solving means describing that set exactly, and two
      systems are equivalent precisely when their solution sets agree.
    steps:
      - teach: >
          Each equation of a system has its own set of solutions in
          $\mathbb{R}^n$. Call the $i$-th one $S_i$. A tuple solves the whole
          system exactly when it belongs to all of them at once.
      - teach: >
          So the solution set of the system is $S = S_1 \cap \cdots \cap S_m$.
          Since an intersection can only be smaller than the sets it intersects,
          adding an equation can shrink $S$ but can never enlarge it.
      - ask: >
          The solution set of $2x_1 + x_2 = 4$ is infinite. What is the number
          of elements in the solution set of the system consisting of that
          equation together with $x_1 - x_2 = -1$?
        expects: "1"
        hint: >
          Add the two equations together and see what is left.
        feedback: >
          Adding the equations gives $3x_1 = 3$, so $x_1 = 1$, and then
          $x_2 = 2$. Checking, $2(1) + 2 = 4$ and $1 - 2 = -1$. The intersection
          is the single tuple $(1,2)$, so the answer is $1$.
      - teach: >
          To solve the system means to describe $S$ exactly — every element and
          nothing else. Naming one member of $S$ is a much weaker statement,
          and when $S$ is infinite it is barely a start.
      - ask: >
          Which of these counts as solving the system consisting of the single
          equation $2x_1 + x_2 = 4$?
        choices:
          - text: >
              $(1,2)$ is a solution
            feedback: >
              True but incomplete. It names one element of a set with infinitely
              many, and says nothing about the others.
          - text: >
              The solution set is all tuples $(t, 4 - 2t)$ with
              $t \in \mathbb{R}$
            correct: true
            feedback: >
              This is a description of the whole set: every such tuple satisfies
              the equation, and every solution has this shape, since $x_2$ is
              forced once $x_1$ is chosen.
          - text: >
              The solution set is all tuples $(t, s)$ with
              $t, s \in \mathbb{R}$
            feedback: >
              That is all of $\mathbb{R}^2$, which includes $(0,0)$ — and
              $2(0) + 0 = 0$, not $4$. The description must exclude the
              non-solutions too.
        feedback: >
          A solution set is described correctly when the description admits
          every solution and admits nothing else. One example is too little; all
          of $\mathbb{R}^2$ is too much.
      - teach: >
          Two systems in the same unknowns are *equivalent* when their solution
          sets are equal. They need not have the same number of equations, or
          resemble each other in any other way.
      - ask: >
          Which system is equivalent to $x_1 + x_2 = 3$, $x_1 - x_2 = 1$?
        choices:
          - text: >
              $x_1 = 2$, $x_2 = 1$
            correct: true
            feedback: >
              Adding the original equations gives $2x_1 = 4$, so $x_1 = 2$, and
              subtracting gives $2x_2 = 2$, so $x_2 = 1$. Both systems have the
              solution set $\{(2,1)\}$, so they are equivalent — with the same
              number of equations, though that was not required.
          - text: >
              $x_1 + x_2 = 3$
            feedback: >
              Dropping the second equation enlarges the solution set: $(3,0)$
              now qualifies, and it does not satisfy $x_1 - x_2 = 1$. Deleting
              an equation is safe only when it was redundant.
          - text: >
              $x_1 + x_2 = 3$, $x_1 - x_2 = 1$, $x_1 + 2x_2 = 5$
            feedback: >
              The extra equation fails at $(2,1)$, since $2 + 2 = 4$ and not
              $5$. Its solution set is empty, so it is not equivalent to a
              system with a solution.
        feedback: >
          Equivalence is decided entirely by the sets, never by the appearance
          of the equations. Everything ahead in this unit works by replacing a
          system with an equivalent one that is easier to read.
      - teach: >
          Hold on to the two extremes. $S$ may be empty, which is a complete and
          respectable answer, and $S$ may be infinite, in which case only a
          description of the whole family counts as a solution.

  - node: linear-algebra.systems.def-consistent
    hook: >
      Before asking how many solutions a system has, you have to ask whether it
      has any — and a system can fail to have any while every single one of its
      equations is perfectly solvable.
    explanation: >
      A system is *consistent* when its solution set is nonempty and
      *inconsistent* when its solution set is empty. That is the whole
      definition; the content is in what makes it happen.

      Look at $x_1 + 2x_2 = 3$ together with $2x_1 + 4x_2 = 7$. Each equation on
      its own has infinitely many solutions. But suppose some pair satisfied
      both. Doubling the first equation gives $2x_1 + 4x_2 = 6$, and that same
      pair also satisfies $2x_1 + 4x_2 = 7$; subtracting one from the other
      leaves $0 = 1$, which is false. No pair can do it, so the system is
      inconsistent. Notice what the argument required: a *combination* of the
      equations. Inconsistency is a property of the equations taken together and
      is never visible in any one of them alone.

      This is why "look at each equation and see if it is solvable" is not a
      test for consistency. The obstruction lives in how the equations interact,
      and the only way to expose it is to combine them until a contradiction —
      or its absence — is forced into the open. Every technique in this unit is
      a systematic way of doing that combining.

      Existence and uniqueness are two separate questions and they come in that
      order. First, is there a solution at all? Only if the answer is yes does
      "how many?" mean anything. Keeping them apart is worth the discipline,
      because a system can be inconsistent for a reason that has nothing to do
      with how tightly the equations pin the unknowns down.
    worked: >
      Consider the family $x_1 + 2x_2 = 3$ and $2x_1 + 4x_2 = c$, with $c$ a
      number you get to choose. Suppose a pair satisfies both. Doubling the
      first equation gives $2x_1 + 4x_2 = 6$, and the pair satisfies that too;
      comparing with the second equation forces $c = 6$. So for every $c \ne 6$
      the system is inconsistent — for $c = 7$, for $c = 0$, for $c = 5.999$.
      When $c = 6$ the second equation is exactly twice the first and imposes
      nothing new, so the system is consistent, and its solution set is all
      pairs $(3 - 2t, t)$ with $t \in \mathbb{R}$: substituting,
      $(3 - 2t) + 2t = 3$ and $2(3-2t) + 4t = 6$. One number decides between an
      empty solution set and an infinite one.
    pitfalls: >
      Checking the equations one at a time never detects inconsistency, since
      each equation of an inconsistent system is usually solvable on its own.
      Consistency and uniqueness are different questions: a consistent system
      may have one solution or infinitely many, and knowing it is consistent
      tells you nothing about which. And having more equations than unknowns
      does not make a system inconsistent — $x_1 + x_2 = 3$, $x_1 - x_2 = 1$,
      $2x_1 = 4$ has three equations, two unknowns, and the solution $(2,1)$.
    recap: >
      Consistent means the solution set is nonempty, inconsistency is produced
      by the equations contradicting one another rather than by any one of them
      failing, and existence is settled before uniqueness is even asked.
    steps:
      - teach: >
          A system is *consistent* when its solution set is nonempty and
          *inconsistent* when that set is empty. The definition is one line; the
          interest is entirely in how a system manages to be inconsistent.
      - teach: >
          Take $x_1 + 2x_2 = 3$ and $2x_1 + 4x_2 = 7$. Each equation alone has
          infinitely many solutions, so nothing looks wrong. Yet no pair
          satisfies both.
      - teach: >
          Here is why. Any pair satisfying the first also satisfies its double,
          $2x_1 + 4x_2 = 6$. If it satisfied the second as well, subtracting
          would give $0 = 1$. So no such pair exists — and the argument needed
          both equations at once.
      - ask: >
          For which value of $c$ is the system $x_1 + 2x_2 = 3$,
          $2x_1 + 4x_2 = c$ consistent?
        expects: "6"
        hint: >
          Double the first equation and compare it with the second.
        feedback: >
          Doubling the first gives $2x_1 + 4x_2 = 6$, which every solution of
          the first satisfies. Consistency needs $c = 6$; any other $c$ forces
          $0 = 6 - c \ne 0$. At $c = 6$ the second equation repeats the first
          and the solution set is all $(3 - 2t, t)$.
      - teach: >
          So inconsistency belongs to the system as a whole, never to a single
          equation. Reading the equations one at a time can never reveal it,
          because each one is typically solvable by itself.
      - ask: >
          A student checks each of the four equations of a system and finds that
          every one of them has solutions. What may be concluded?
        choices:
          - text: >
              The system is consistent
            feedback: >
              This is precisely the inference that fails. Each of
              $x_1 + 2x_2 = 3$ and $2x_1 + 4x_2 = 7$ is solvable, and together
              they have no solution.
          - text: >
              Nothing about the system's consistency
            correct: true
            feedback: >
              The individual solution sets may still have empty intersection.
              Consistency is settled only by combining the equations, not by
              inspecting them one by one.
          - text: >
              The system is inconsistent
            feedback: >
              There is no such reversal either — a system of four individually
              solvable equations may very well be consistent. The check simply
              carries no information.
        feedback: >
          Individual solvability tells you each $S_i$ is nonempty; consistency
          is about whether $S_1 \cap \cdots \cap S_m$ is nonempty, and nonempty
          sets can certainly have empty intersection.
      - teach: >
          Ask existence first, uniqueness second. "Is there a solution?" and
          "how many are there?" are different questions, and the second one
          means nothing until the first is answered yes.
      - ask: >
          Which of these systems is inconsistent?
        choices:
          - text: >
              $x_1 + x_2 = 3$, $x_1 - x_2 = 1$, $2x_1 = 4$
            feedback: >
              Three equations in two unknowns, but $(2,1)$ satisfies all three:
              $3 = 3$, $1 = 1$, $4 = 4$. Extra equations are not automatically
              contradictions.
          - text: >
              $x_1 + x_2 + x_3 = 1$, $x_1 + x_2 + x_3 = 4$
            correct: true
            feedback: >
              Subtracting the first from the second gives $0 = 3$. The two left
              sides are identical, so they cannot take two different values, and
              the solution set is empty.
          - text: >
              $x_1 + x_2 = 0$
            feedback: >
              A single equation with all coefficients nonzero always has
              solutions — $(0,0)$ and $(1,-1)$ among them — so this system is
              consistent.
        feedback: >
          The inconsistent one is the pair with the same left side and different
          right sides: no tuple makes one expression equal two different
          numbers. The three-equation system is consistent, which shows that
          counting equations settles nothing.

  - node: linear-algebra.systems.def-augmented-matrix
    hook: >
      Every time you rewrite a system, the letters $x_1$, the plus signs and the
      equals signs are copied unchanged and only the numbers move. Stripping
      them away is the first real step toward a procedure.
    explanation: >
      Write the system $x_1 + 2x_3 = 4$, $3x_2 - x_3 = 0$, $2x_1 + x_2 = 7$
      three or four times while solving it and you will notice how much of the
      writing is ritual. The information is carried by the coefficients and the
      constants; everything else is punctuation. So agree on an order for the
      unknowns — here $x_1$, then $x_2$, then $x_3$ — and record only the
      numbers, in position.

      For a system of $m$ equations in $n$ unknowns, the *coefficient matrix* is
      the $m \times n$ array $A$ whose $i$-th row is
      $(a_{i1}, a_{i2}, \dots, a_{in})$: one row per equation, one column per
      unknown. The *constant column* is $b = (b_1, \dots, b_m)$, one entry per
      equation. The *augmented matrix* $[A \mid b]$ is the $m \times (n+1)$
      array obtained by appending $b$ as a final column, so its $i$-th row is
      $(a_{i1}, \dots, a_{in} \mid b_i)$. The vertical bar is a reminder, not an
      operation: it marks the place where "coefficient of an unknown" stops and
      "constant" begins.

      For the system above, the augmented matrix has rows $(1, 0, 2 \mid 4)$,
      $(0, 3, -1 \mid 0)$ and $(2, 1, 0 \mid 7)$. Read the zeros carefully. The
      $0$ in the first row's second slot is there because $x_2$ does not appear
      in the first equation, and it must be written: if you compress the first
      row to $(1, 2 \mid 4)$ the entry $2$ slides into the column belonging to
      $x_2$ and the array now describes a different system entirely. The array
      means what it means only because every position is filled and the order of
      the unknowns was fixed in advance.

      Nothing has been gained mathematically — the augmented matrix is the
      system, in shorthand. What has been gained is that manipulating a system
      is now manipulating an array of numbers, and arrays of numbers are the
      kind of thing an algorithm can be written for.
    worked: >
      Take the system $2x_1 - x_2 + 3x_3 = 1$, $x_2 - x_3 = 4$,
      $-x_1 + 5x_3 = 0$, $3x_1 = 6$, with the unknowns ordered $x_1, x_2, x_3$.
      There are $m = 4$ equations and $n = 3$ unknowns, so the coefficient
      matrix is $4 \times 3$ and the augmented matrix is $4 \times 4$. Its rows
      are $(2, -1, 3 \mid 1)$, $(0, 1, -1 \mid 4)$, $(-1, 0, 5 \mid 0)$ and
      $(3, 0, 0 \mid 6)$. Every silence in the original has become a $0$: no
      $x_1$ in the second equation, no $x_2$ in the third, and no $x_2$ or $x_3$
      in the fourth. Reading the array back the other way, the row
      $(-1, 0, 5 \mid 0)$ is the equation $-x_1 + 0 x_2 + 5 x_3 = 0$, which is
      the third equation as written.
    pitfalls: >
      Dropping the constant column is the most expensive slip available: you
      would then be reducing the coefficient matrix alone and solving a
      different system, the one with all right-hand sides zero. Omitting a zero
      for a missing unknown shifts every later entry of that row one column left
      and silently changes which unknown a coefficient belongs to. And the
      augmented matrix of a system in $n$ unknowns has $n+1$ columns, not $n$ —
      the last column is not an unknown's column and never will be.
    recap: >
      The augmented matrix $[A \mid b]$ records one row per equation, one of the
      first $n$ columns per unknown in a fixed order, and the constants in a
      final column, so that operating on a system becomes operating on an array.
    steps:
      - teach: >
          Solving a system by hand means writing it out repeatedly, and each
          time the unknowns, the plus signs and the equals signs are copied
          unchanged. Only the numbers ever move.
      - teach: >
          So fix an order for the unknowns and record only the numbers. The
          coefficient matrix $A$ is the $m \times n$ array whose $i$-th row
          holds the coefficients of the $i$-th equation, one column per unknown.
      - teach: >
          Append the constants as a final column and you have the augmented
          matrix $[A \mid b]$, of size $m \times (n+1)$. The bar is punctuation:
          it marks where the coefficients stop and the constants begin.
      - ask: >
          A system has $4$ equations in $3$ unknowns. How many columns does its
          augmented matrix have?
        expects: "4"
        hint: >
          One column for each unknown, plus one more.
        feedback: >
          Three columns for the three unknowns and one for the constants, so
          $n + 1 = 4$ columns. The array is $4 \times 4$ here, but only by
          coincidence: the number of rows is the number of equations, which has
          nothing to do with $n + 1$.
      - teach: >
          An unknown missing from an equation contributes a $0$ in its column.
          That zero is not optional — leave it out and every entry to its right
          slides into the wrong unknown's column.
      - ask: >
          Which row list is the augmented matrix of the system
          $x_1 + 2x_3 = 4$, $3x_2 - x_3 = 0$, $2x_1 + x_2 = 7$, with unknowns
          ordered $x_1, x_2, x_3$?
        choices:
          - text: >
              $(1, 2 \mid 4)$, $(3, -1 \mid 0)$, $(2, 1 \mid 7)$
            feedback: >
              Each row has dropped the zero for its missing unknown, so the rows
              have only two coefficient entries instead of three. In the first
              row the $2$ has slid into the column of $x_2$, turning the
              equation into $x_1 + 2x_2 = 4$.
          - text: >
              $(1, 0, 2 \mid 4)$, $(0, 3, -1 \mid 0)$, $(2, 1, 0 \mid 7)$
            correct: true
            feedback: >
              Every position is filled: $x_2$ is absent from the first equation
              and $x_1$ from the second and $x_3$ from the third, and each
              absence is recorded as a $0$ in the right column.
          - text: >
              $(1, 0, 2)$, $(0, 3, -1)$, $(2, 1, 0)$
            feedback: >
              This is the coefficient matrix with the constant column thrown
              away. It describes the system with all right-hand sides equal to
              $0$, which is a different system.
        feedback: >
          One row per equation, one of the first three columns per unknown in
          the agreed order, zeros for the absences, and the constants in a
          fourth column behind the bar.
      - ask: >
          In that augmented matrix, what is the entry in row $3$, column $2$?
        expects: "1"
        hint: >
          Row $3$ is the third equation; column $2$ belongs to $x_2$.
        feedback: >
          The third equation is $2x_1 + x_2 = 7$, whose row is
          $(2, 1, 0 \mid 7)$, so the second entry is $1$ — the coefficient of
          $x_2$ there. The $0$ in that row's third slot records that $x_3$ does
          not appear.
      - teach: >
          Nothing mathematical has been gained yet: the array *is* the system.
          What has been gained is that operating on a system is now operating on
          a grid of numbers, which is the kind of thing a procedure can be
          written for.

  - node: linear-algebra.systems.row-operations
    hook: >
      You already make these three moves when you solve two equations in two
      unknowns by hand. Naming them, and checking that each one can be undone,
      is what turns a habit into a procedure an algorithm can be built on.
    explanation: >
      Solve $x_1 + x_2 = 5$ and $2x_1 - x_2 = 1$ the way you always have. You
      might reorder the equations to put a friendlier one on top, multiply one
      through by a constant, or add a multiple of one equation to another to
      make an unknown disappear. Adding these two as they stand kills $x_2$ and
      leaves $3x_1 = 6$, so $x_1 = 2$ and then $x_2 = 3$. Every legitimate move
      in that computation was one of exactly three kinds.

      On the augmented matrix those three become the *elementary row
      operations*. Interchange exchanges two rows,
      $R_i \leftrightarrow R_j$. Scaling multiplies a row by a scalar
      $c \ne 0$, written $R_i \to c R_i$. Replacement adds a multiple of one row
      to a *different* row, $R_i \to R_i + c R_j$ with $j \ne i$ and $c$ any
      scalar whatever. A row is an equation, so these say: reorder the
      equations, multiply an equation through by a nonzero constant, add a
      multiple of one equation to another.

      The two side conditions carry the whole content of the definition, and
      both are there for one reason: each operation must be undone by an
      operation of the same three kinds. An interchange undoes itself. Scaling
      by $c$ is undone by scaling by $1/c$, and that reciprocal exists exactly
      because $c \ne 0$ — in a field every nonzero element has a multiplicative
      inverse. Replacement by $+c R_j$ is undone by replacement by $-c R_j$, and
      that works only because row $j$ was left untouched while row $i$ changed,
      which is what $j \ne i$ guarantees.

      Drop either condition and reversibility dies on the spot. Scaling by
      $c = 0$ flattens a row to all zeros, and no sequence of operations can
      reconstruct what was there; the equation is simply gone. Allowing $j = i$
      would licence $R_i \to R_i - R_i$, which does the same damage by another
      route. The restrictions are not fastidiousness — they are what makes these
      three moves safe.
    worked: >
      Take the matrix with rows $(0, 2 \mid 6)$ and $(3, 1 \mid 9)$. The first
      row has no $x_1$ to work with, so interchange:
      $R_1 \leftrightarrow R_2$ leaves rows $(3, 1 \mid 9)$ and $(0, 2 \mid 6)$.
      Scale the top row, $R_1 \to \frac{1}{3} R_1$, giving
      $(1, \frac{1}{3} \mid 3)$, and scale the bottom one,
      $R_2 \to \frac{1}{2} R_2$, giving $(0, 1 \mid 3)$. One replacement
      finishes it: $R_1 \to R_1 - \frac{1}{3} R_2$ turns the top row into
      $(1, 0 \mid 3 - 1) = (1, 0 \mid 2)$. The two rows now read $x_1 = 2$ and
      $x_2 = 3$, and the original equations confirm it: $2(3) = 6$ and
      $3(2) + 3 = 9$. Every step reverses. Apply
      $R_1 \to R_1 + \frac{1}{3} R_2$, then $R_2 \to 2 R_2$, then
      $R_1 \to 3 R_1$, then $R_1 \leftrightarrow R_2$, and the rows
      $(0, 2 \mid 6)$ and $(3, 1 \mid 9)$ are back, entry for entry.
    pitfalls: >
      Scaling a row by $0$ is barred, and not out of tidiness: it replaces an
      equation by $0 = 0$, which every tuple satisfies, so the array afterwards
      can admit answers the original refused. Adding a multiple of a row to
      *itself* is barred for the same reason, since $R_i \to R_i - R_i$ wipes
      the row out. And a replacement rewrites only the row named on the left of
      the arrow: in $R_2 \to R_2 - 3R_1$ the first row is copied down unchanged,
      so two replacements that each want to read the other row's old version
      cannot be carried out in the same step.
    recap: >
      Three moves on the rows — interchange, scaling by a nonzero constant, and
      adding a multiple of one row to a different row — each undone by a move of
      the same kind, which is precisely what the two side conditions buy.
    steps:
      - teach: >
          When you solve $x_1 + x_2 = 5$ and $2x_1 - x_2 = 1$ by hand you
          reorder equations, multiply one by a constant, and add one to another.
          Adding these two kills $x_2$ and leaves $3x_1 = 6$.
      - teach: >
          Those are the only three moves you ever need, and on the augmented
          matrix they are the elementary row operations: interchange
          $R_i \leftrightarrow R_j$, scaling $R_i \to c R_i$ with $c \ne 0$, and
          replacement $R_i \to R_i + c R_j$ with $j \ne i$.
      - ask: >
          A matrix has rows $(1, 4 \mid 2)$ and $(3, 5 \mid 1)$. After
          $R_2 \to R_2 - 3R_1$, what is the entry in row $2$, column $2$?
        expects: "-7"
        hint: >
          Only the second row changes, and it changes entry by entry.
        feedback: >
          The new second row is $(3, 5 \mid 1) - 3(1, 4 \mid 2)$, computed slot
          by slot: $3 - 3 = 0$, then $5 - 12 = -7$, then $1 - 6 = -5$. So the
          row becomes $(0, -7 \mid -5)$ and the entry asked for is $-7$. The
          first row is copied down untouched.
      - teach: >
          What makes the three moves trustworthy is that each is undone by a
          move of the same kind. An interchange undoes itself; scaling by $c$ is
          undone by scaling by $1/c$; replacement by $+c R_j$ is undone by
          replacement by $-c R_j$.
      - ask: >
          Which single operation undoes $R_2 \to R_2 + 4R_1$?
        choices:
          - text: >
              $R_2 \to R_2 - 4R_1$
            correct: true
            feedback: >
              Row $1$ was never altered, so subtracting the same multiple of it
              takes row $2$ straight back: $(R_2 + 4R_1) - 4R_1 = R_2$.
          - text: >
              $R_1 \to R_1 - 4R_2$
            feedback: >
              This changes the wrong row. Row $1$ is already correct; it is row
              $2$ that was rewritten and needs restoring.
          - text: >
              $R_2 \to \frac{1}{4} R_2$
            feedback: >
              Scaling cannot undo a replacement. The damage was additive — a
              multiple of another row was added on — so the repair must subtract
              that same multiple.
        feedback: >
          Each kind of operation is undone by its own kind, and a replacement is
          undone by the replacement with the opposite sign. This works only
          because $R_1$ survived the first operation unchanged, which is exactly
          what the condition $j \ne i$ protects.
      - teach: >
          Both side conditions exist to keep that reversibility. Scaling needs
          $c \ne 0$ because $1/c$ has to exist, and replacement needs
          $j \ne i$ because the row being added must not be the row being
          rewritten.
      - ask: >
          Which of these is *not* an elementary row operation?
        choices:
          - text: >
              $R_2 \leftrightarrow R_4$
            feedback: >
              An interchange of two rows, and the tamest of the three: it undoes
              itself by being performed again.
          - text: >
              $R_1 \to 0 \cdot R_1$
            correct: true
            feedback: >
              Scaling requires a nonzero constant. This one turns the row into
              all zeros, and since $1/0$ does not exist there is no scaling that
              brings the row back — the equation it recorded is lost.
          - text: >
              $R_3 \to R_3 + 5R_1$
            feedback: >
              A replacement with $c = 5$ and $j = 1 \ne 3$, so both conditions
              hold. The constant in a replacement may be anything, zero
              included; it is only *scaling* that needs $c \ne 0$.
        feedback: >
          Two of these are reversible and one destroys information. Multiplying
          a row by $0$ leaves nothing to work back from, which is why the
          definition rules it out rather than treating it as a harmless special
          case.
      - teach: >
          So you have three moves, each with an inverse of the same kind, acting
          on an array that *is* the system. The next question is what they do to
          the answers — and it is the question the whole method rests on.

  - node: linear-algebra.systems.row-equivalence
    hook: >
      A computation is a chain of row operations, not one. Naming the relation
      "reachable from one another by such a chain" is what lets you talk about
      the start and the end of a computation as two faces of one object.
    explanation: >
      Two $m \times n$ matrices $A$ and $B$ are *row equivalent*, written
      $A \sim B$, when some finite sequence of elementary row operations carries
      $A$ to $B$. The sequence may be as long as you like and may mix the three
      kinds freely; all that is asked is that it exist.

      The definition looks lopsided — it names a starting matrix and a
      destination — but it is not, and checking why is worth doing carefully.
      Reflexivity: $A \sim A$, because the empty sequence of operations is a
      sequence and it leaves $A$ alone. Transitivity: if a sequence takes $A$ to
      $B$ and another takes $B$ to $C$, performing the first and then the second
      takes $A$ to $C$, so $A \sim C$. Symmetry is the interesting one. Given a
      sequence carrying $A$ to $B$, run it backwards, replacing each operation
      by its inverse and undoing the last one first. Every inverse is itself an
      elementary row operation — this is exactly what the side conditions on
      scaling and replacement were for — so the reversed list is a legal
      sequence, and it carries $B$ to $A$.

      Row equivalence is therefore an equivalence relation on the set of
      $m \times n$ matrices, and the matrices of a given size fall into
      disjoint classes: every matrix belongs to exactly one, and two matrices in
      the same class are reachable from each other in both directions. That is a
      genuine reorganisation of the subject. Instead of a one-way process
      applied to a particular array, you have a partition, and the sensible next
      question is whether each class contains one especially readable member.
    worked: >
      Start from the matrix with rows $(1, 2 \mid 3)$ and $(2, 5 \mid 8)$.
      Apply $R_2 \to R_2 - 2R_1$: the second row becomes
      $(2 - 2, 5 - 4 \mid 8 - 6) = (0, 1 \mid 2)$. Apply
      $R_1 \to R_1 - 2R_2$: the first row becomes
      $(1, 2 - 2 \mid 3 - 4) = (1, 0 \mid -1)$. So the matrix with rows
      $(1, 2 \mid 3)$, $(2, 5 \mid 8)$ is row equivalent to the one with rows
      $(1, 0 \mid -1)$, $(0, 1 \mid 2)$. Now run the chain backwards, undoing
      the *last* operation first: $R_1 \to R_1 + 2R_2$ restores
      $(1, 0 + 2 \mid -1 + 4) = (1, 2 \mid 3)$, and then
      $R_2 \to R_2 + 2R_1$ restores
      $(0 + 2, 1 + 4 \mid 2 + 6) = (2, 5 \mid 8)$. Two operations out, two back,
      and both matrices sit in the same class.
    pitfalls: >
      Reversing a chain means undoing the last operation first, not replaying
      the inverses in the original order — the two give different answers, as
      the worked example shows if you try it the wrong way round. Row
      equivalence compares matrices of the same size only, since no row
      operation changes how many rows or columns there are. And if scaling by
      $0$ were permitted, symmetry would collapse: the rows $(1, 2)$, $(0, 1)$
      would reach $(0, 0)$, $(0, 1)$, and nothing would bring the lost row back.
    recap: >
      $A \sim B$ means some finite chain of row operations carries $A$ to $B$,
      and because every operation has an elementary inverse this is an
      equivalence relation, splitting the matrices of a given size into disjoint
      classes.
    steps:
      - teach: >
          One row operation is never the whole story; a computation is a chain
          of them. Say $A \sim B$, read "$A$ is row equivalent to $B$", when
          some finite sequence of elementary row operations carries $A$ to $B$.
      - teach: >
          The sequence may be any length and may mix the three kinds however it
          likes. Nothing is demanded of it except that it exist — no shortest
          route, no preferred order.
      - ask: >
          Apply $R_2 \to R_2 - 2R_1$ and then $R_1 \to R_1 - 2R_2$ to the matrix
          with rows $(1, 2 \mid 3)$ and $(2, 5 \mid 8)$. What is the last entry
          of the resulting first row?
        expects: "-1"
        hint: >
          Do the operations in the order given; the second one uses the *new*
          second row.
        feedback: >
          The first operation makes row $2$ into
          $(2-2, 5-4 \mid 8-6) = (0, 1 \mid 2)$. The second then makes row $1$
          into $(1, 2-2 \mid 3-4) = (1, 0 \mid -1)$, so the last entry is $-1$.
      - teach: >
          The definition names a start and a destination, so it looks one-way.
          It is not. Reflexivity is free — the empty sequence carries $A$ to
          $A$ — and transitivity is free too, since one sequence followed by
          another is again a sequence.
      - teach: >
          Symmetry is the one with content. Run the chain backwards, undoing the
          last operation first and replacing each by its inverse. Every inverse
          is itself an elementary operation, so the reversed list is legal and
          carries $B$ back to $A$.
      - ask: >
          Which sequence carries the rows $(1, 0 \mid -1)$, $(0, 1 \mid 2)$ back
          to $(1, 2 \mid 3)$, $(2, 5 \mid 8)$?
        choices:
          - text: >
              $R_1 \to R_1 + 2R_2$, then $R_2 \to R_2 + 2R_1$
            correct: true
            feedback: >
              The forward chain was $R_2 \to R_2 - 2R_1$ and then
              $R_1 \to R_1 - 2R_2$, so undo the second one first. The first step
              gives $(1, 2 \mid 3)$, and the second gives
              $(0+2, 1+4 \mid 2+6) = (2, 5 \mid 8)$.
          - text: >
              $R_2 \to R_2 + 2R_1$, then $R_1 \to R_1 + 2R_2$
            feedback: >
              Right inverses, wrong order. This gives $(2, 1 \mid 0)$ for row
              $2$ and then $(5, 2 \mid -1)$ for row $1$, which is neither
              matrix. A chain is undone from the back.
          - text: >
              $R_1 \to R_1 - 2R_2$, then $R_2 \to R_2 - 2R_1$
            feedback: >
              These repeat the forward operations instead of inverting them.
              Subtracting again moves further away: row $1$ becomes
              $(1, -2 \mid -5)$.
        feedback: >
          Undo a chain from the back, replacing each operation by its inverse.
          The last thing done is the first thing undone, and only then does the
          matrix arrive back where it started.
      - ask: >
          Suppose scaling a row by $0$ counted as an elementary operation. Which
          property of row equivalence would fail?
        choices:
          - text: >
              Reflexivity
            feedback: >
              Reflexivity needs only the empty sequence, which is still
              available. Adding a bad operation to the list cannot take away a
              good one.
          - text: >
              Symmetry
            correct: true
            feedback: >
              Scale the first row of $(1, 2)$, $(0, 1)$ by $0$ and you reach
              $(0, 0)$, $(0, 1)$. No chain returns: adding multiples of
              $(0, 1)$ to a zero row only ever produces $(0, a)$, never
              $(1, 2)$. So the relation would run one way and not the other.
          - text: >
              Transitivity
            feedback: >
              Transitivity only asks that two sequences performed in turn form
              a sequence, which stays true whatever operations are on the menu.
        feedback: >
          Symmetry is the property that rests on reversibility, and
          reversibility is what the condition $c \ne 0$ protects. This is why
          the definition of the three operations was worth being fussy about.
      - teach: >
          So the matrices of a given size split into disjoint row equivalence
          classes, each one a family of arrays reachable from one another in
          both directions. The subject now has a shape: find the most readable
          member of a class.

  - node: linear-algebra.systems.row-ops-preserve-solutions
    hook: >
      Every method ahead rewrites a system into a different-looking one and then
      reads the answer off the rewrite. This theorem is the permission slip: it
      says the rewriting never gains or loses a single solution.
    explanation: >
      The claim: if the augmented matrices of two systems in the same $n$
      unknowns, written with the unknowns in the same order, are row equivalent,
      then the two systems have exactly the same solution set.

      Because row equivalence is a finite chain, it is enough to prove this for
      one operation and then apply it link by link. Let $(s_1, \dots, s_n)$
      satisfy the original system. An interchange changes no equation at all,
      only their order, and a tuple satisfying a list of equations satisfies the
      same list rearranged. After $R_i \to c R_i$ the new $i$-th equation is $c$
      times the old $i$-th; multiplying a true numerical statement by $c$ keeps
      it true, so the tuple still satisfies it. After $R_i \to R_i + c R_j$ the
      new $i$-th equation is the old $i$-th plus $c$ times the old $j$-th, and
      the tuple satisfies both of those, so it satisfies their combination. No
      other equation moved. Hence every solution of the old system solves the
      new one.

      That is one inclusion. The other comes free, and this is where the
      reversibility built into the operations pays for itself: each elementary
      operation has an elementary inverse, so the new matrix is row equivalent
      to the old one, and the argument just given runs in the other direction.
      Two inclusions, one set.

      Notice which side condition did which job. The forward inclusion never
      needed $c \ne 0$ — even scaling by $0$ sends a solution of the old
      equation to a solution of $0 = 0$. It is the *reverse* inclusion that
      collapses without it, and the collapse is one-sided in exactly the way you
      would expect: the rewritten system would have more solutions, never fewer.
      The ordering hypothesis matters too. An array only records which
      coefficient belongs to which unknown once the order is agreed; read the
      rows $(1, 0 \mid 1)$, $(0, 1 \mid 2)$ with the order $x_1, x_2$ and the
      answer is $(1,2)$, read them with the order $x_2, x_1$ and it is $(2,1)$.
    worked: >
      Solve $2x_1 + x_2 = 7$ and $x_1 - x_2 = 2$ by rewriting. The augmented
      rows are $(2, 1 \mid 7)$ and $(1, -1 \mid 2)$. Interchange them,
      $R_1 \leftrightarrow R_2$, to get $(1, -1 \mid 2)$ and $(2, 1 \mid 7)$,
      then apply $R_2 \to R_2 - 2R_1$, which turns the second row into
      $(2 - 2, 1 + 2 \mid 7 - 4) = (0, 3 \mid 3)$. The new system reads
      $x_1 - x_2 = 2$ and $3x_2 = 3$, so $x_2 = 1$ and $x_1 = 3$: the solution
      set of the rewritten system is $\{(3, 1)\}$. The theorem says this must
      also be the solution set of the original, and it is:
      $2(3) + 1 = 7$ and $3 - 1 = 2$, both true, and no other pair works, since
      the rewritten system already forced the answer.
    pitfalls: >
      Multiplying an equation by $0$ can enlarge the solution set and is the
      reason scaling excludes it: the system $x_1 = 5$, $x_2 = 1$ has the single
      solution $(5,1)$, while scaling the first equation by $0$ gives $0 = 0$,
      $x_2 = 1$, whose solutions are all pairs $(t, 1)$. The theorem promises
      equal solution sets, not similar-looking systems — the rewritten system
      may have fewer visible equations, different coefficients, and a completely
      different appearance. And the hypothesis that both systems are written
      with the unknowns in the same order cannot be dropped, since without it
      the same array describes different systems.
    recap: >
      Row equivalent augmented matrices, with the unknowns in the same order,
      describe systems with identical solution sets — which is the licence to
      solve a system by reducing its matrix to something easier to read.
    steps:
      - teach: >
          You are about to start rewriting systems on purpose, replacing an
          awkward one by a tidier one. That is only useful if the tidier system
          has the same answers. This theorem says it does.
      - teach: >
          Precisely: if two systems in the same $n$ unknowns, written with the
          unknowns in the same order, have row equivalent augmented matrices,
          then their solution sets are equal.
      - teach: >
          The proof needs to handle only one operation, because a chain is
          operations applied one at a time — settle a single link and the whole
          chain follows.
      - ask: >
          A tuple satisfies every equation of a system. Why does it satisfy the
          new second equation after $R_2 \to R_2 + 5R_1$?
        choices:
          - text: >
              Because the new second equation is $5$ times the old second
              equation
            feedback: >
              That describes a scaling, not a replacement. A replacement adds a
              multiple of *another* row, so the old second equation is still
              there, with something added to it.
          - text: >
              Because the new second equation is the old second plus $5$ times
              the old first, and the tuple makes both of those true
            correct: true
            feedback: >
              Substituting the tuple turns the old second equation and the old
              first equation into true numerical statements. Adding $5$ times
              the second true statement to the first yields a true statement,
              and that statement is exactly the new second equation evaluated at
              the tuple.
          - text: >
              Because row operations do not change the entries of a matrix
            feedback: >
              They certainly do change entries — that is the point of
              performing them. What is preserved is the solution set, and that
              is what needs proving.
        feedback: >
          Each of the three operations builds the new equation out of old
          equations the tuple already satisfies, so the tuple satisfies the new
          one. Interchange reorders, scaling multiplies a true statement by a
          constant, replacement adds two true statements.
      - teach: >
          That gives one inclusion: every old solution is a new solution. The
          reverse comes free, since each operation has an elementary inverse, so
          the new matrix is row equivalent to the old and the same argument runs
          backwards.
      - ask: >
          Apply $R_1 \leftrightarrow R_2$ and then $R_2 \to R_2 - 2R_1$ to the
          augmented rows $(2, 1 \mid 7)$, $(1, -1 \mid 2)$. Reading off the
          result, what is $x_1$ in the solution of the original system?
        expects: "3"
        hint: >
          After the two operations the second row involves only $x_2$.
        feedback: >
          The interchange gives $(1, -1 \mid 2)$, $(2, 1 \mid 7)$, and the
          replacement turns the second row into
          $(0, 3 \mid 3)$. So $3x_2 = 3$, giving $x_2 = 1$, and the first row
          $x_1 - x_2 = 2$ gives $x_1 = 3$. Checking against the original,
          $2(3) + 1 = 7$ and $3 - 1 = 2$.
      - teach: >
          Look at which condition did which job. The forward inclusion never
          needed $c \ne 0$; even scaling by $0$ sends a solution of the old
          equation to a solution of $0 = 0$. It is the reverse inclusion that
          fails without it.
      - ask: >
          Which manipulation of a system can *enlarge* its solution set?
        choices:
          - text: >
              Swapping two equations
            feedback: >
              A tuple satisfies a list of equations regardless of the order they
              are written in, so nothing at all changes.
          - text: >
              Multiplying one equation through by $0$
            correct: true
            feedback: >
              The system $x_1 = 5$, $x_2 = 1$ has the single solution $(5,1)$.
              Multiply the first equation by $0$ and it becomes $0 = 0$, which
              every tuple satisfies, so the solutions become all pairs
              $(t, 1)$ — infinitely many where there was one.
          - text: >
              Adding $5$ times the first equation to the third
            feedback: >
              This is a legal replacement, and it is reversible by adding
              $-5$ times the first equation to the third, so the solution set is
              unchanged in both directions.
        feedback: >
          Only the barred move can gain solutions, and it gains them by throwing
          a constraint away. The legal three trade one system for another that
          constrains the unknowns in exactly the same way.
      - teach: >
          So elimination is safe. Whatever chain of legal operations you run, the
          array at the end describes a system with precisely the answers the
          array at the start did — and now the question is which array to aim
          for.

  - node: linear-algebra.systems.def-row-echelon
    hook: >
      Row operations are safe but aimless until you know what shape to steer
      toward. This is the shape: a staircase, in which every equation is shorter
      than the one above it.
    explanation: >
      Suppose a system's augmented matrix arrived with rows
      $(1, 2, -1 \mid 4)$, $(0, 3, 1 \mid 5)$, $(0, 0, 2 \mid 6)$. The last
      equation involves one unknown, the middle one two, the top one three, so
      the system unravels from the bottom without any cleverness. That is the
      shape worth naming.

      A matrix is in *row echelon form* when two conditions hold. First, every
      row of all zeros lies below every nonzero row — the zero rows are swept to
      the bottom, none stranded in the middle. Second, in each nonzero row the
      *leading entry*, meaning the leftmost nonzero entry of that row and called
      a *pivot*, lies strictly to the right of the leading entry of the row
      above it.

      "Strictly to the right" is doing more than it looks. Since the pivot of
      row $i$ is the leftmost nonzero entry of that row, everything to its left
      in row $i$ is zero; and since each row's pivot sits further right than the
      one above, every row below row $i$ has zeros all the way out to at least
      the pivot column of row $i$. So underneath every pivot, in the pivot's own
      column, the entries are all zero, and the pivots march down and to the
      right in a staircase. Their positions are called *pivot positions* and the
      columns holding them *pivot columns*. Each pivot occupies a row of its own
      and a column of its own, so an $m \times n$ matrix has at most
      $\min(m, n)$ pivots.

      Two things echelon form does not ask for. A pivot need not equal $1$, and
      the entries *above* a pivot may be anything at all. Because of this the
      form is not unique: scale any row of an echelon matrix by a nonzero
      constant and it is still in echelon form, with the pivots in the same
      places. So "an echelon form of $A$" is the honest phrase and "the echelon
      form" is not.
    worked: >
      Test the matrix with rows $(0, 2, -1, 3 \mid 5)$, $(0, 0, 0, 4 \mid 1)$
      and $(0, 0, 0, 0 \mid 0)$, clause by clause. There is one zero row and it
      is at the bottom, so the first condition holds. The leading entry of row
      $1$ is the $2$ in column $2$; the leading entry of row $2$ is the $4$ in
      column $4$, which is strictly to the right of column $2$; row $3$ has no
      leading entry to compare. So the second condition holds and the matrix is
      in row echelon form, with pivots in positions $(1,2)$ and $(2,4)$, pivot
      columns $2$ and $4$, and two pivots in all. Column $1$ being entirely zero
      is no obstacle — nothing in the definition requires a pivot in the first
      column. Two near misses, for contrast: rows $(1, 2 \mid 3)$,
      $(0, 0 \mid 0)$, $(0, 1 \mid 4)$ fail the first condition, since a zero
      row sits above a nonzero one; and rows $(1, 2 \mid 3)$, $(2, 1 \mid 0)$
      fail the second, since both leading entries sit in column $1$ and neither
      is strictly right of the other.
    pitfalls: >
      A zero row parked in the middle breaks echelon form even when the nonzero
      rows above and below are perfectly staircased — sweep it to the bottom
      with an interchange. Pivots equal to $1$ and zeros above the pivots are
      not required here; demanding them gives a stricter form, and confusing the
      two makes you do arithmetic you do not owe. And echelon form is not
      unique, so nothing you conclude may depend on which one you happened to
      produce — only on facts, such as where the pivots sit, that all of them
      share.
    recap: >
      Row echelon form means zero rows at the bottom and each row's leading
      entry strictly right of the one above, so the pivots descend in a
      staircase with only zeros beneath them and the equations get shorter as
      you read down.
    steps:
      - teach: >
          Look at the rows $(1, 2, -1 \mid 4)$, $(0, 3, 1 \mid 5)$,
          $(0, 0, 2 \mid 6)$. The bottom equation has one unknown, the middle
          two, the top three. A system in that shape falls apart from the bottom
          with no ingenuity at all.
      - teach: >
          Condition one for row echelon form: every row of all zeros lies below
          every nonzero row. Zero rows go to the bottom, and none is stranded
          between two nonzero rows.
      - teach: >
          Condition two: in each nonzero row, the leading entry — the leftmost
          nonzero entry, called a pivot — lies strictly to the right of the
          leading entry of the row above.
      - ask: >
          Which of these matrices is in row echelon form?
        choices:
          - text: >
              Rows $(1, 2, 3 \mid 4)$, $(0, 0, 0 \mid 0)$, $(0, 0, 5 \mid 1)$
            feedback: >
              The zero row sits above a nonzero row, which condition one
              forbids. Interchanging rows $2$ and $3$ would fix it.
          - text: >
              Rows $(2, 1, 0 \mid 3)$, $(0, 0, -4 \mid 1)$, $(0, 0, 0 \mid 0)$
            correct: true
            feedback: >
              The single zero row is at the bottom, and the leading entries sit
              in column $1$ and column $3$, with $3$ strictly to the right of
              $1$. Both conditions hold; the pivots are the $2$ and the $-4$.
          - text: >
              Rows $(1, 1, 1 \mid 2)$, $(3, 0, 0 \mid 1)$, $(0, 0, 0 \mid 0)$
            feedback: >
              Both of the first two leading entries lie in column $1$, so the
              second is not strictly to the right of the first. Condition two
              fails.
        feedback: >
          Read the two conditions off the picture: zero rows at the bottom, and
          leading entries stepping strictly rightward as you go down. Anything
          else is not echelon form yet, however tidy it looks.
      - teach: >
          The two conditions together force the staircase. Everything left of a
          pivot in its own row is zero, and every row below has zeros at least
          that far out, so directly beneath each pivot its whole column is zero.
      - ask: >
          How many pivots does the matrix with rows $(0, 4, 1, 7)$,
          $(0, 0, 2, 3)$ and $(0, 0, 0, 0)$ have?
        expects: "2"
        hint: >
          Count the leading entries; a row of zeros has none.
        feedback: >
          Row $1$ leads with the $4$ in column $2$ and row $2$ leads with the
          $2$ in column $3$, which is strictly to the right, so the matrix is in
          echelon form with pivots in columns $2$ and $3$. Row $3$ is all zeros
          and contributes no pivot, so there are $2$ pivots.
      - teach: >
          Each pivot claims a row of its own and a column of its own, so a
          matrix with $m$ rows and $n$ columns can hold at most $\min(m, n)$ of
          them. Rows and columns both cap the count.
      - ask: >
          At most how many pivots can a matrix with $4$ rows and $7$ columns
          have?
        expects: "4"
        hint: >
          Two ceilings apply at once, and the smaller one wins.
        feedback: >
          No two pivots share a row, so there are at most $4$; no two share a
          column, so there are at most $7$. Both bounds hold, so the count is at
          most $\min(4, 7) = 4$ — the rows run out first.
      - teach: >
          Echelon form asks nothing about the *size* of a pivot or about the
          entries above it, so scaling a row leaves an echelon matrix echelon.
          The form is not unique, which is why "an echelon form of $A$" is the
          careful phrase.

  - node: linear-algebra.systems.def-pivot-free
    hook: >
      Once the staircase is in place, the unknowns stop being interchangeable.
      Some of them head an equation and are determined by the rest; the leftover
      ones are dials you may turn at will, and counting them counts the answers.
    explanation: >
      Take a system in the unknowns $x_1, \dots, x_n$ and an echelon form of its
      augmented matrix. That array has $n+1$ columns, and only the first $n$
      belong to unknowns. Among those first $n$, the ones carrying a pivot are
      the pivot columns, and their unknowns are the *basic* variables, also
      called leading variables. Every other unknown is a *free* variable. If $r$
      of the first $n$ columns are pivot columns, there are $r$ basic variables
      and $n - r$ free ones.

      The names describe how the array gets used. Read any nonzero row as an
      equation. Its leading entry is a pivot, so the first unknown it mentions
      is that row's basic variable, and every other unknown in the row lies
      further to the right. So the row can be solved for its basic variable in
      terms of variables to its right, and no other row will ever compete for
      that same basic variable, since each pivot sits in a column of its own.
      Give the free variables any values you like, and the basic variables are
      then forced — one per nonzero row, computed from the bottom up.

      One caveat belongs with the recipe. If the echelon form contains a row
      $(0, \dots, 0 \mid c)$ with $c \ne 0$, that row is the equation
      $0 x_1 + \cdots + 0 x_n = c$ and no assignment of values rescues it; the
      free variables are not free of anything then, because there is nothing to
      compute. The split into basic and free is still perfectly well defined —
      it depends only on where the pivots sit — but the recipe for building
      solutions out of it needs that row to be absent.

      The split depends on pivot *positions* only, never on the entries
      themselves. Scale a row, and the same columns carry pivots and the same
      unknowns are basic. The free variables are not "the last few" either: in a
      form with pivots in columns $1$ and $3$ of four unknown columns, the basic
      variables are $x_1$ and $x_3$ and the free ones are $x_2$ and $x_4$,
      interleaved.
    worked: >
      Take the echelon form with rows $(1, 2, 0, 3 \mid 4)$,
      $(0, 0, 1, -1 \mid 2)$, $(0, 0, 0, 0 \mid 0)$, coming from a system in
      $n = 4$ unknowns. The leading entries sit in columns $1$ and $3$, both
      among the first four, so $r = 2$: the basic variables are $x_1$ and $x_3$
      and the free ones are $x_2$ and $x_4$, giving $n - r = 2$ free variables.
      The fifth column holds the constants and belongs to no unknown. Now use
      the split. Row $2$ reads $x_3 - x_4 = 2$, so $x_3 = 2 + x_4$, its basic
      variable in terms of a variable to its right. Row $1$ reads
      $x_1 + 2x_2 + 3x_4 = 4$, so $x_1 = 4 - 2x_2 - 3x_4$. Set $x_2 = 0$ and
      $x_4 = 0$: then $x_3 = 2$ and $x_1 = 4$, and the tuple $(4, 0, 2, 0)$
      satisfies both rows, since $4 + 0 + 0 + 0 = 4$ and $0 + 0 + 2 - 0 = 2$.
      Set $x_2 = 1$ and $x_4 = 1$ instead: then $x_3 = 3$ and
      $x_1 = 4 - 2 - 3 = -1$, and $(-1, 1, 3, 1)$ works too, since
      $-1 + 2 + 0 + 3 = 4$ and $0 + 0 + 3 - 1 = 2$.
    pitfalls: >
      The last column of the augmented matrix is not an unknown's column, so a
      pivot there is not a basic variable and must never be counted in $r$ —
      only the first $n$ columns split the unknowns. The number of free
      variables is $n - r$ and has nothing to do with the number of equations: a
      system of ten equations in three unknowns whose echelon form has three
      pivots has no free variables at all. And free does not mean "last": in a
      form with pivots in columns $1$ and $3$, the free variable $x_2$ sits
      between two basic ones.
    recap: >
      The pivot columns among the first $n$ mark the basic variables, one per
      nonzero row and each solvable from its own row, and the remaining
      $n - r$ unknowns are free variables whose values may be chosen at will.
    steps:
      - teach: >
          An echelon form sorts the unknowns into two kinds. Some of them head
          an equation of their own and are determined by the others; the rest
          are left over, and the leftovers are where all the freedom lives.
      - teach: >
          Look at the first $n$ columns only — the last column holds constants.
          A column among those first $n$ carrying a pivot is a pivot column and
          its unknown is a *basic* variable; every other unknown is *free*.
      - ask: >
          A system in $4$ unknowns has an echelon form with rows
          $(1, 2, 0, 3 \mid 4)$, $(0, 0, 1, -1 \mid 2)$, $(0, 0, 0, 0 \mid 0)$.
          How many free variables does it have?
        expects: "2"
        hint: >
          Find the leading entries, note which of the first four columns they
          occupy, and subtract.
        feedback: >
          The leading entries are the $1$ in column $1$ and the $1$ in column
          $3$, so $r = 2$ of the first four columns are pivot columns. That
          leaves $n - r = 4 - 2 = 2$ free variables, namely $x_2$ and $x_4$.
      - teach: >
          The names say how the array is used. A nonzero row's leading entry is
          a pivot, so the first unknown that row mentions is its basic variable
          and everything else in the row lies to the right — the row can be
          solved for that one unknown.
      - ask: >
          In the echelon form with rows $(1, 2, 0, 3 \mid 4)$,
          $(0, 0, 1, -1 \mid 2)$, $(0, 0, 0, 0 \mid 0)$, for a system in $4$
          unknowns, which unknowns are the basic variables?
        choices:
          - text: >
              $x_1$ and $x_2$, since they come first
            feedback: >
              Position in the list is irrelevant; only pivot columns count.
              Column $2$ carries no leading entry, so $x_2$ is free.
          - text: >
              $x_1$ and $x_3$
            correct: true
            feedback: >
              The pivots lie in columns $1$ and $3$, so those unknowns head the
              two nonzero rows: row $1$ can be solved for $x_1$ and row $2$ for
              $x_3$. The remaining $x_2$ and $x_4$ are free.
          - text: >
              $x_1$, $x_3$ and $x_5$, one for each column with a pivot
            feedback: >
              There is no $x_5$ — the system has four unknowns, and the fifth
              column of the array holds the constants. It carries no pivot here
              in any case.
        feedback: >
          Match pivot columns to unknowns, and only among the first $n$ columns.
          Basic variables are interleaved with free ones however the staircase
          happens to fall; they are not the first few by default.
      - teach: >
          Give the free variables any values at all and every basic variable is
          then forced, one per nonzero row. That is the sense in which the
          leftovers are dials and the rest merely follow.
      - ask: >
          A system in $6$ unknowns has an echelon form with $4$ pivots, all of
          them among the first $6$ columns. How many free variables are there?
        expects: "2"
        hint: >
          Every unknown is either basic or free, and the basic ones are counted
          by the pivots.
        feedback: >
          Four pivot columns give $r = 4$ basic variables, so the free ones
          number $n - r = 6 - 4 = 2$. Which two they are depends on where the
          pivots landed, but there are two of them however the elimination went.
      - teach: >
          Count pivots in the first $n$ columns only. A pivot in the last column
          belongs to no unknown, and if such a row appears it reads
          $0 = c$ with $c \ne 0$, which no choice of the free variables can
          repair.
      - teach: >
          So an echelon form hands you two numbers before you compute anything:
          how many unknowns are pinned down, and how many are still yours to
          choose.

  - node: linear-algebra.systems.def-rref
    hook: >
      An echelon form still makes you work: the top row mentions every unknown,
      so you have to substitute your way back up. Push the reduction further and
      that work disappears into the array itself.
    explanation: >
      Echelon form clears the entries *below* each pivot and stops. The rows
      then read as equations of decreasing length, which is convenient, but the
      top ones still mix several unknowns together. Nothing forbids going on:
      row operations are still available, and there is one more thing they can
      do.

      A matrix is in *reduced row echelon form* when it is in row echelon form
      and, in addition, every pivot equals $1$ and each pivot is the only
      nonzero entry in its column. The first extra condition is cosmetic — a
      pivot is nonzero, so scaling its row by the reciprocal always achieves it.
      The second is the substantive one: an echelon form clears below each
      pivot, a reduced echelon form clears above as well, so every pivot column
      becomes a single $1$ with zeros everywhere else.

      Read as a system, this says something sharp. Each unknown whose column
      carries a pivot — each basic variable — appears in exactly one of the
      equations, and there with coefficient $1$. So that equation already
      isolates it, and there is nothing left to substitute.

      What the definition does *not* say matters just as much. Columns without a
      pivot are untouched by the extra condition and keep whatever entries they
      have. In a reduced form with rows $(1, 2, 0 \mid 5)$ and
      $(0, 0, 1 \mid 2)$, column $2$ still carries its $2$, and it should: that
      column belongs to a free variable, and the $2$ records how $x_1$ depends
      on it. Only the pivot columns get flattened.
    worked: >
      Start from the echelon rows $(2, 4, 1 \mid 6)$, $(0, 0, 3 \mid 9)$,
      $(0, 0, 0 \mid 0)$. The leading entries are the $2$ in column $1$ and the
      $3$ in column $3$, so this is echelon but not reduced: neither pivot is
      $1$. Scale both rows: $R_1 \to \frac{1}{2} R_1$ gives
      $(1, 2, \frac{1}{2} \mid 3)$ and $R_2 \to \frac{1}{3} R_2$ gives
      $(0, 0, 1 \mid 3)$. Still not reduced, because the entry above the second
      pivot is $\frac{1}{2}$ rather than $0$. One replacement fixes it:
      $R_1 \to R_1 - \frac{1}{2} R_2$ turns the first row into
      $(1, 2, 0 \mid 3 - \frac{3}{2}) = (1, 2, 0 \mid \frac{3}{2})$. The rows
      $(1, 2, 0 \mid \frac{3}{2})$, $(0, 0, 1 \mid 3)$, $(0, 0, 0 \mid 0)$ are
      now in reduced row echelon form: pivots $1$ in columns $1$ and $3$, each
      alone in its column. Column $2$ still holds a $2$, and that is correct —
      it is not a pivot column. As a system the rows say
      $x_1 + 2x_2 = \frac{3}{2}$ and $x_3 = 3$.
    pitfalls: >
      Clearing only below the pivots leaves you in ordinary echelon form; the
      reduced form is the one that clears above them too, and forgetting the
      upward sweep is the usual way of stopping one step short. Scaling each
      pivot to $1$ is part of the definition rather than a stylistic choice, so
      rows $(2, 0 \mid 4)$, $(0, 1 \mid 3)$ are not reduced however tidy they
      look. And do not expect every column to become a single $1$: the columns
      of free variables keep their entries, and those entries are exactly the
      information the solution needs.
    recap: >
      Reduced row echelon form is echelon form with every pivot equal to $1$ and
      alone in its column, so each basic variable appears in exactly one
      equation with coefficient $1$ and nothing remains to substitute back.
    steps:
      - teach: >
          An echelon form is convenient but not finished. Its bottom row is
          short, but the top row still mentions every unknown, so reading the
          answer takes work. Row operations have not run out.
      - teach: >
          A matrix is in *reduced row echelon form* when it is in row echelon
          form, every pivot equals $1$, and each pivot is the only nonzero entry
          in its column.
      - teach: >
          The first extra condition is easy — scale each pivot row by the
          reciprocal of its pivot. The second is the real one: echelon form
          clears below a pivot, reduced form clears above it as well.
      - ask: >
          Which of these matrices is in reduced row echelon form?
        choices:
          - text: >
              Rows $(1, 3, 0 \mid 2)$, $(0, 1, 4 \mid 5)$
            feedback: >
              Both pivots are $1$, but the pivot in column $2$ is not alone in
              its column — there is a $3$ sitting above it. Echelon form, not
              reduced.
          - text: >
              Rows $(1, 0, 2 \mid 3)$, $(0, 1, -1 \mid 4)$
            correct: true
            feedback: >
              Pivots in columns $1$ and $2$, both equal to $1$, and each is the
              only nonzero entry of its column. Column $3$ has entries $2$ and
              $-1$, but it carries no pivot, so the definition asks nothing of
              it.
          - text: >
              Rows $(2, 0, 1 \mid 6)$, $(0, 1, 3 \mid 1)$
            feedback: >
              Each pivot is alone in its column, but the first pivot is $2$
              rather than $1$. Scaling the first row by $\frac{1}{2}$ would
              finish the job.
        feedback: >
          Check three things in turn: echelon shape, every pivot equal to $1$,
          and every pivot alone in its column. Non-pivot columns are exempt from
          the last two — nothing is required of them at all.
      - ask: >
          Carry the echelon rows $(2, 4, 1 \mid 6)$, $(0, 0, 3 \mid 9)$ to
          reduced row echelon form. What is the last entry of the first row?
        expects: "3/2"
        hint: >
          Scale both rows so the pivots are $1$, then clear the entry above the
          second pivot.
        feedback: >
          Scaling gives $(1, 2, \frac{1}{2} \mid 3)$ and $(0, 0, 1 \mid 3)$.
          Then $R_1 \to R_1 - \frac{1}{2} R_2$ makes the first row
          $(1, 2, 0 \mid 3 - \frac{3}{2})$, and
          $3 - \frac{3}{2} = \frac{3}{2}$.
      - teach: >
          Read the reduced form as a system and it says this: each basic
          variable appears in exactly one equation, with coefficient $1$. That
          equation already isolates it, so no substituting is left to do.
      - teach: >
          Columns without a pivot are left alone. In the rows
          $(1, 2, 0 \mid 5)$, $(0, 0, 1 \mid 2)$ the $2$ in column $2$ survives
          the reduction, and it must: it records how $x_1$ depends on the free
          variable $x_2$.
      - ask: >
          In a matrix in reduced row echelon form, which columns consist of a
          single $1$ and zeros elsewhere?
        choices:
          - text: >
              Every column
            feedback: >
              That would be a very special matrix. Free-variable columns keep
              their entries, and those entries are what makes the solution
              usable.
          - text: >
              Exactly the pivot columns
            correct: true
            feedback: >
              The definition asks that each pivot be $1$ and alone in its
              column, which is precisely the description of a pivot column. It
              asks nothing about the others.
          - text: >
              Every column except the last
            feedback: >
              The last column has no special standing here — the definition is
              about a matrix, not about an augmented matrix, and in any case
              non-pivot columns anywhere keep their entries.
        feedback: >
          Reduced echelon form flattens the pivot columns and only those. Which
          columns those are was already decided by the staircase; the extra
          conditions just tidy them.
      - teach: >
          So there are two stopping places. Echelon form is cheap and leaves
          substitution to do; reduced echelon form costs more arithmetic and
          leaves nothing to do. Both are reached by legal moves, so both answer
          the same question.

  - node: linear-algebra.systems.gaussian-elimination
    hook: >
      You know the legal moves and the shape to aim for. What is missing is a
      procedure that reaches that shape from any starting matrix, without
      inspiration and without ever getting stuck.
    explanation: >
      Work on the augmented matrix, with all rows initially available. Locate
      the leftmost column, say column $j$, having a nonzero entry in some
      available row. If the topmost available row has a zero there, interchange
      it with a row below that does not. Call the entry now in that position the
      pivot $p$ and its row the pivot row $R_k$. For each available row $i$
      below row $k$, apply $R_i \to R_i - (a_{ij}/p) R_k$, where $a_{ij}$ is
      that row's entry in column $j$; the multiplier is exactly what makes the
      new entry $a_{ij} - (a_{ij}/p) p = 0$. Then set the pivot row aside and
      repeat on the rows that remain.

      Two things make this an algorithm rather than a hope. It never divides by
      zero, because $p$ was chosen nonzero. And it halts: each pass sets one row
      aside and starts the next search at least one column further right, so
      there are at most $\min(m, n)$ passes and no step can loop. When the
      available rows run out, or every remaining entry is zero, the array is in
      row echelon form, because each pass leaves zeros below its pivot and each
      pivot sits strictly right of the last.

      That proves a theorem in passing: every matrix is row equivalent to a
      matrix in row echelon form. And since only elementary operations were
      used, the system at the end has exactly the solution set of the system at
      the start — the array has been reshaped, not re-answered.

      One case deserves attention. If the pivot position holds a zero and every
      entry below it in that column is zero too, no interchange helps; the
      column simply has no pivot, and the algorithm moves one column to the
      right with the same rows still available. That is how columns without
      pivots arise, and later how free variables do.
    worked: >
      Solve $x_1 + 2x_2 - x_3 = 2$, $2x_1 + 5x_2 + x_3 = 9$,
      $-x_1 + x_2 + 4x_3 = 7$. The augmented rows are $(1, 2, -1 \mid 2)$,
      $(2, 5, 1 \mid 9)$, $(-1, 1, 4 \mid 7)$. Pass one: column $1$ has a
      nonzero top entry, so no interchange is needed and the pivot is $p = 1$ in
      row $1$. The multipliers are $2/1$ and $-1/1$, so
      $R_2 \to R_2 - 2R_1$ gives $(0, 1, 3 \mid 5)$ and
      $R_3 \to R_3 + R_1$ gives $(0, 3, 3 \mid 9)$. Set row $1$ aside. Pass two:
      among the remaining rows the leftmost nonzero column is column $2$, and
      row $2$ has a $1$ there, so $p = 1$ again and
      $R_3 \to R_3 - 3R_2$ gives $(0, 0, 3 - 9 \mid 9 - 15) = (0, 0, -6 \mid -6)$.
      Set row $2$ aside; one row is left and its leading entry is a pivot. The
      echelon form is $(1, 2, -1 \mid 2)$, $(0, 1, 3 \mid 5)$,
      $(0, 0, -6 \mid -6)$, with three pivots, in columns $1$, $2$ and $3$. The
      bottom row reads $-6x_3 = -6$, so $x_3 = 1$, and with no free variables
      the two rows above pin the rest down.
    pitfalls: >
      The operation must be applied across the whole row, constant column
      included; clearing the coefficients and leaving the constants alone solves
      a different system and is the commonest arithmetic slip in the subject.
      When the pivot position holds $0$ and every entry below it is $0$ as well,
      do not interchange with a row *above* — those rows are finished and
      swapping them back in destroys the staircase; move right instead, keeping
      the same rows available. And the pivot row is fixed for the whole pass:
      clear every row beneath it against the same pivot row, not against each
      other's freshly updated versions.
    recap: >
      Find the leftmost usable column, swap a nonzero entry into the pivot
      position, subtract the right multiple of the pivot row from every row
      beneath it, set that row aside and repeat — and any matrix reaches echelon
      form in at most $\min(m, n)$ passes.
    steps:
      - teach: >
          The moves are legal and the target shape is named. What is still
          missing is a route from any matrix to that shape that works every
          time, with no cleverness required at any step.
      - teach: >
          One pass. Among the rows still available, find the leftmost column
          holding a nonzero entry. If the topmost available row has a zero
          there, interchange it with one below that does not. The entry now in
          place is the pivot $p$, and its row is the pivot row.
      - teach: >
          Then clear beneath. For each available row $i$ below the pivot row
          $R_k$, apply $R_i \to R_i - (a_{ij}/p) R_k$. That multiplier is chosen
          so the new entry is $a_{ij} - (a_{ij}/p)p = 0$, and $p \ne 0$ makes
          the division safe.
      - ask: >
          Run the first pass on the augmented rows $(1, 2, -1 \mid 2)$,
          $(2, 5, 1 \mid 9)$, $(-1, 1, 4 \mid 7)$, with row $1$ as the pivot
          row. What is the middle entry of the new third row?
        expects: "3"
        hint: >
          The third row's entry in column $1$ is $-1$ and the pivot is $1$, so
          the multiplier is $-1$.
        feedback: >
          The operation is $R_3 \to R_3 - (-1/1)R_1$, that is
          $R_3 \to R_3 + R_1$, giving
          $(-1 + 1, 1 + 2, 4 - 1 \mid 7 + 2) = (0, 3, 3 \mid 9)$. The middle
          entry is $3$.
      - teach: >
          Now set the pivot row aside and repeat on what is left. Each pass
          consumes one row and starts its search at least one column further
          right, so the process stops after at most $\min(m, n)$ pivots and can
          never loop.
      - ask: >
          The pivot position holds $0$, and every entry below it in that column
          is $0$ as well. What does the algorithm do?
        choices:
          - text: >
              Interchange with a row above, to bring a nonzero entry into place
            feedback: >
              The rows above have been set aside and their pivots are already
              placed. Swapping one back down would undo the staircase built so
              far.
          - text: >
              Move one column to the right, keeping the same rows available, and
              look for a pivot there
            correct: true
            feedback: >
              That column has no pivot, and nothing is wrong — it just means no
              available row constrains that unknown first. Columns skipped this
              way are exactly the ones whose unknowns turn out to be free.
          - text: >
              Scale that row until the entry becomes nonzero
            feedback: >
              Scaling multiplies, so a zero entry stays zero whatever the
              constant. And scaling by $0$ is not permitted in any case.
        feedback: >
          A column with nothing usable in it is skipped, not fought. The
          algorithm moves right, the same rows stay in play, and the pivot count
          simply comes out lower than the number of columns.
      - ask: >
          Continuing that elimination, the second pass uses $(0, 1, 3 \mid 5)$
          as pivot row and applies $R_3 \to R_3 - 3R_2$ to $(0, 3, 3 \mid 9)$.
          What is the constant entry of the new third row?
        expects: "-6"
        hint: >
          Subtract three times the pivot row from the third row, slot by slot.
        feedback: >
          The new third row is
          $(0, 3 - 3, 3 - 9 \mid 9 - 15) = (0, 0, -6 \mid -6)$, so the constant
          entry is $-6$. The echelon form is now $(1, 2, -1 \mid 2)$,
          $(0, 1, 3 \mid 5)$, $(0, 0, -6 \mid -6)$, with three pivots.
      - teach: >
          Two things come free. Every matrix is row equivalent to one in echelon
          form, since the algorithm always finishes; and because only elementary
          operations were used, the system at the end has exactly the answers
          the system at the start had.
      - teach: >
          Apply every operation across the whole row, constant column included.
          Clearing the coefficients and leaving the constants behind quietly
          replaces the system by a different one, and the arithmetic afterwards
          will look perfectly convincing.

  - node: linear-algebra.systems.back-substitution
    hook: >
      Elimination hands you a staircase, not an answer. This is the second half
      of the computation: how to turn that staircase into a description of every
      solution the system has, all at once.
    explanation: >
      Take an echelon form of a consistent system. Its unknowns are already
      split: the pivot columns among the first $n$ mark the basic variables, and
      the rest are free. Give every free variable a parameter of its own,
      $x_j = t_j$, ranging over all of $\mathbb{R}$.

      Now work *upward*, starting at the lowest nonzero row. That row's leading
      entry is a pivot, so its first unknown is its basic variable, and every
      other unknown it mentions lies to the right — which means those unknowns
      are either free, and now carry parameters, or basic and already computed
      on an earlier step. Either way their values are known, so the row can be
      solved for its own basic variable. Move up one row and repeat. Each
      nonzero row has a basic variable of its own, and no two rows compete for
      the same one, so the process reaches the top with every basic variable
      expressed in terms of the parameters.

      That output is not one answer; it is the entire solution set. Each choice
      of parameter values gives a solution, because the rows were solved to make
      them true. Distinct choices give distinct tuples, since two different
      parameter values already disagree in that free variable's own coordinate.
      And every solution arises this way: given any solution, read off its free
      coordinates, use those as the parameters, and the basic coordinates are
      then forced to the values the procedure computes.

      If there are no free variables the description carries no parameters and
      names a single tuple. Nothing about the method changes — there is simply
      nothing left to choose.
    worked: >
      Take the echelon form with rows $(1, -2, 1, 3 \mid 4)$,
      $(0, 0, 2, -4 \mid 6)$, $(0, 0, 0, 0 \mid 0)$, from a system in four
      unknowns. The pivots sit in columns $1$ and $3$, so $x_1$ and $x_3$ are
      basic and $x_2$ and $x_4$ are free; there is no row
      $(0, 0, 0, 0 \mid c)$ with $c \ne 0$, so the system is consistent. Put
      $x_2 = s$ and $x_4 = t$. The lowest nonzero row reads $2x_3 - 4x_4 = 6$,
      so $2x_3 = 6 + 4t$ and $x_3 = 3 + 2t$. Move up: the first row reads
      $x_1 - 2x_2 + x_3 + 3x_4 = 4$, so
      $x_1 = 4 + 2s - (3 + 2t) - 3t = 1 + 2s - 5t$. The solution set is every
      tuple $(1 + 2s - 5t,\ s,\ 3 + 2t,\ t)$ with $s, t \in \mathbb{R}$. Check
      two of them. At $s = t = 0$ the tuple is $(1, 0, 3, 0)$, and
      $1 - 0 + 3 + 0 = 4$ and $0 - 0 + 6 - 0 = 6$. At $s = t = 1$ it is
      $(-2, 1, 5, 1)$, and $-2 - 2 + 5 + 3 = 4$ and $0 - 0 + 10 - 4 = 6$.
    pitfalls: >
      The number of parameters is the number of free variables, counted from the
      pivot positions, and never the number of equations: the echelon form above
      has three rows and two parameters. A row of all zeros is not an equation
      to be solved — it says $0 = 0$ and is skipped. Working downward instead of
      upward stalls immediately, since the top row mentions every unknown and
      cannot be solved until the ones below it have been. And parameters go on
      the *free* variables; assigning a value to a basic variable overdetermines
      the system and will usually produce a contradiction that is entirely your
      own doing.
    recap: >
      Give each free variable a parameter, solve the lowest nonzero row for its
      basic variable, substitute upward row by row, and the result names every
      solution exactly once.
    steps:
      - teach: >
          Elimination stops at a staircase. Turning that staircase into an
          answer is a separate procedure, and its output is not a tuple but a
          description of the whole solution set.
      - teach: >
          Start by giving each free variable a parameter of its own,
          $x_j = t_j$, ranging over $\mathbb{R}$. The basic variables get no
          parameters — they are about to be computed.
      - teach: >
          Now work upward from the lowest nonzero row. Its leading entry is a
          pivot, so its first unknown is its basic variable and everything else
          it mentions lies to the right, where the values are already known.
      - ask: >
          In the echelon form with rows $(1, -2, 1, 3 \mid 4)$,
          $(0, 0, 2, -4 \mid 6)$, $(0, 0, 0, 0 \mid 0)$, the second row is the
          lowest nonzero one. With the free variable $x_4$ set to $0$, what is
          $x_3$?
        expects: "3"
        hint: >
          Write out the second row as an equation and substitute $x_4 = 0$.
        feedback: >
          The row reads $2x_3 - 4x_4 = 6$. With $x_4 = 0$ this is $2x_3 = 6$, so
          $x_3 = 3$. In general $2x_3 = 6 + 4x_4$, giving $x_3 = 3 + 2x_4$.
      - teach: >
          Move up one row and repeat. Each nonzero row owns a basic variable no
          other row claims, so the sweep reaches the top with every basic
          variable written in terms of the parameters.
      - ask: >
          Solving that echelon form with $x_2 = s$ and $x_4 = t$ gives
          $x_3 = 3 + 2t$ and $x_1 = 1 + 2s - 5t$. What is $x_1$ when
          $s = 1$ and $t = 1$?
        expects: "-2"
        hint: >
          Substitute both parameter values into the expression for $x_1$.
        feedback: >
          $x_1 = 1 + 2(1) - 5(1) = 1 + 2 - 5 = -2$. The full tuple is
          $(-2, 1, 5, 1)$, and it checks out: $-2 - 2 + 5 + 3 = 4$ and
          $0 - 0 + 10 - 4 = 6$.
      - teach: >
          A row of all zeros is skipped, not solved. It says $0 = 0$, which is
          true and useless, and it contributes no basic variable — which is why
          the parameter count comes from the pivots and not from the row count.
      - ask: >
          Why is the parametric output the *entire* solution set rather than a
          supply of examples?
        choices:
          - text: >
              Because every choice of the parameters gives a solution
            feedback: >
              That is half of it — it shows the description produces only
              solutions. It does not yet rule out solutions the description
              misses.
          - text: >
              Because every choice gives a solution, distinct choices give
              distinct tuples, and every solution arises from some choice
            correct: true
            feedback: >
              The first clause says nothing false is admitted; the third says
              nothing true is left out. The middle one is a bonus: the
              parameters name each solution exactly once, so a description with
              two parameters really has two independent degrees of freedom.
          - text: >
              Because a consistent system with a free variable has infinitely
              many solutions
            feedback: >
              True, but it is a count, not a proof of completeness. Infinitely
              many solutions could still be described by a list that misses
              infinitely many others.
        feedback: >
          Completeness is the point. Given any solution, read off its free
          coordinates as the parameter values; the rows then force the basic
          coordinates to be exactly what the procedure computed, so that
          solution is on the list.
      - teach: >
          When there are no free variables the description carries no parameters
          and names one tuple. Nothing about the method changes — there is
          simply nothing left to choose.

  - node: linear-algebra.systems.gauss-jordan
    hook: >
      Back-substitution is a second pass over the array by hand. If you are
      willing to spend a little more arithmetic during the elimination itself,
      you can buy an array that needs no second pass at all.
    explanation: >
      Gauss-Jordan elimination is Gaussian elimination continued past the
      echelon form. After the forward phase, scale each pivot row by the
      reciprocal of its pivot so that every pivot becomes $1$ — legitimate
      because a pivot is nonzero. Then work from the *rightmost* pivot
      leftwards: if that pivot is the entry of row $k$ in column $j$, apply
      $R_i \to R_i - a_{ij} R_k$ for each row $i$ above row $k$, clearing the
      entries above the pivot just as the forward phase cleared the ones below.

      Going right to left is the efficient order, and the reason is worth
      seeing. When you clear above the rightmost pivot, the pivot row you are
      subtracting has zeros in every pivot column to its left, so the columns
      you have already finished are not disturbed. Sweeping left to right
      instead reaches the same destination but reintroduces entries you then
      have to clear a second time.

      The result is in reduced row echelon form and was reached by elementary
      row operations alone, so it is row equivalent to the matrix you began
      with and describes a system with the same solutions. The payoff: unless
      the reduced array contains the row $(0, \dots, 0 \mid 1)$, each of its
      nonzero equations contains exactly one basic variable, already isolated,
      with only free variables on the other side. Nothing is left to substitute.

      The cost is real arithmetic, which is why hand computation usually stops
      at echelon form and substitutes back, while the reduced form is what
      theory reaches for — a canonical destination is worth more to a proof than
      a short computation is.
    worked: >
      Continue from the echelon rows $(2, 4, -2 \mid 6)$, $(0, 3, 3 \mid 9)$,
      $(0, 0, 5 \mid 10)$. Scale each pivot to $1$:
      $R_1 \to \frac{1}{2} R_1$ gives $(1, 2, -1 \mid 3)$,
      $R_2 \to \frac{1}{3} R_2$ gives $(0, 1, 1 \mid 3)$, and
      $R_3 \to \frac{1}{5} R_3$ gives $(0, 0, 1 \mid 2)$. Now clear upward from
      the rightmost pivot, the $1$ in column $3$ of row $3$:
      $R_2 \to R_2 - R_3$ gives $(0, 1, 0 \mid 1)$ and $R_1 \to R_1 + R_3$
      gives $(1, 2, 0 \mid 5)$. Move to the pivot in column $2$ of row $2$:
      $R_1 \to R_1 - 2R_2$ gives $(1, 0, 0 \mid 3)$. The reduced row echelon
      form is $(1, 0, 0 \mid 3)$, $(0, 1, 0 \mid 1)$, $(0, 0, 1 \mid 2)$, which
      reads $x_1 = 3$, $x_2 = 1$, $x_3 = 2$ with nothing to substitute. Checking
      against the echelon rows we started from: $2(3) + 4(1) - 2(2) = 6$,
      $3(1) + 3(2) = 9$, and $5(2) = 10$.
    pitfalls: >
      Free-variable columns are never cleared, so with a free variable present
      the reduced form is not a list of values: the rows $(1, 2, 0 \mid 5)$,
      $(0, 0, 1 \mid 2)$ say $x_1 = 5 - 2x_2$ and $x_3 = 2$, not $x_1 = 5$.
      Clearing above the pivots from the left instead of from the right is not
      wrong but is wasteful — the entries you clear first get repopulated by the
      later sweeps and must be cleared again. And every pivot must be scaled to
      $1$ before the upward clearing, or the multipliers $a_{ij}$ used in
      $R_i \to R_i - a_{ij} R_k$ are the wrong ones.
    recap: >
      Scale every pivot to $1$, then clear above each pivot working from the
      rightmost leftwards; the result is the reduced row echelon form, from
      which the solution is read off with no back-substitution at all.
    steps:
      - teach: >
          Echelon form leaves a second pass to do by hand. Gauss-Jordan spends
          more arithmetic during the elimination and buys an array from which
          the answer is simply read.
      - teach: >
          Phase one: scale each pivot row by the reciprocal of its pivot, so
          every pivot becomes $1$. A pivot is nonzero by construction, so the
          reciprocal always exists.
      - ask: >
          Scale the echelon rows $(2, 4, -2 \mid 6)$, $(0, 3, 3 \mid 9)$,
          $(0, 0, 5 \mid 10)$ so that every pivot is $1$. What is the constant
          entry of the new third row?
        expects: "2"
        hint: >
          The third row's pivot is $5$, so multiply that whole row by
          $\frac{1}{5}$.
        feedback: >
          $R_3 \to \frac{1}{5} R_3$ turns $(0, 0, 5 \mid 10)$ into
          $(0, 0, 1 \mid 2)$, so the constant is $2$. The other two rows become
          $(1, 2, -1 \mid 3)$ and $(0, 1, 1 \mid 3)$.
      - teach: >
          Phase two: starting at the *rightmost* pivot and moving left, subtract
          the right multiple of its row from every row above it, clearing the
          entries above the pivot exactly as the forward phase cleared those
          below.
      - ask: >
          From the rows $(1, 2, -1 \mid 3)$, $(0, 1, 1 \mid 3)$,
          $(0, 0, 1 \mid 2)$, clear above the pivots. What is $x_1$?
        expects: "3"
        hint: >
          Clear column $3$ first using the bottom row, then column $2$ using the
          middle row.
        feedback: >
          Column $3$ first: $R_2 \to R_2 - R_3$ gives $(0, 1, 0 \mid 1)$ and
          $R_1 \to R_1 + R_3$ gives $(1, 2, 0 \mid 5)$. Then column $2$:
          $R_1 \to R_1 - 2R_2$ gives $(1, 0, 0 \mid 3)$. So $x_1 = 3$, with
          $x_2 = 1$ and $x_3 = 2$.
      - teach: >
          Right to left is the efficient order. The pivot row you subtract has
          zeros in every pivot column to its left, so the columns already
          finished stay finished; going left to right lands in the same place
          after clearing some entries twice.
      - teach: >
          Only elementary operations were used, so the reduced array is row
          equivalent to the one you started with and its system has the same
          solutions. What has changed is how easy the array is to read.
      - ask: >
          A system's reduced row echelon form has rows $(1, 2, 0 \mid 5)$ and
          $(0, 0, 1 \mid 2)$. What does it tell you?
        choices:
          - text: >
              $x_1 = 5$ and $x_3 = 2$
            feedback: >
              The first row is not $x_1 = 5$; it is $x_1 + 2x_2 = 5$. The $2$ in
              column $2$ has not gone anywhere, because column $2$ carries no
              pivot.
          - text: >
              $x_1 = 5 - 2x_2$ and $x_3 = 2$, with $x_2$ free
            correct: true
            feedback: >
              Each basic variable is isolated with coefficient $1$, and what
              remains on the other side is the free variable. That is exactly
              what the reduced form promises when a free variable is present.
          - text: >
              Nothing, since the matrix is not reduced — column $2$ still has a
              nonzero entry
            feedback: >
              The conditions apply to pivot columns only. Column $2$ has no
              pivot, so nothing is asked of it, and the matrix is genuinely in
              reduced row echelon form.
        feedback: >
          Reduced echelon form isolates the basic variables; it does not
          eliminate the free ones. When free variables are present the reduced
          rows are a parametric answer already written out, not a list of
          numbers.
      - teach: >
          So the choice is a trade. Stop at echelon form and substitute back by
          hand, or spend the extra arithmetic and read the answer off. Hand
          computation usually takes the first; theory wants the second.

  - node: linear-algebra.systems.rref-unique
    hook: >
      Two people reduce the same matrix, take completely different routes, and
      write down the same final array. That this always happens is not
      bookkeeping — it is the theorem that turns pivot counts into properties of
      the matrix.
    explanation: >
      Every matrix is row equivalent to one and only one matrix in reduced row
      echelon form. Existence is Gauss-Jordan elimination, which always
      terminates. Uniqueness is the substantive half, and it is worth pausing on
      how unlikely it looks: a matrix has many echelon forms, the sequences of
      operations reaching a reduced one are endless, and different people will
      pivot on different rows. Yet the destination never differs.

      Here is the mechanism. For a matrix $R$, let $S(R)$ be the set of tuples
      satisfying the equations whose coefficients are the rows of $R$ and whose
      constants are all $0$. Appending a column of zeros to $R$ gives an
      augmented matrix, and a zero column stays zero under every row operation,
      so if $R \sim R'$ then those augmented matrices are row equivalent too and
      hence $S(R) = S(R')$. Now notice that a reduced row echelon form can be
      *read off* from $S$. Setting one free variable to $1$ and all other free
      variables to $0$ produces a particular tuple of $S$, and its basic
      coordinates are exactly the negatives of the entries of that free
      variable's column. So once the pivot positions are known, every entry of
      the reduced form is determined by $S$ alone, and $S$ cannot depend on the
      route. That the pivot positions themselves cannot differ is the remaining
      half, proved by an induction along the columns, and it is the reason this
      is a theorem rather than a remark.

      The consequences are what you will use. Since the destination is unique,
      $\operatorname{rref}(A)$ is an invariant of $A$, and two matrices are row
      equivalent exactly when their reduced row echelon forms are equal — a
      finite, decidable test for a relation that was defined by an unbounded
      search over sequences of operations. The pivot positions are the same in
      every echelon form of $A$, so which variables of a system are basic and
      which are free is a fact about the system and not about how you eliminated.
    worked: >
      Reduce the rows $(1, 2 \mid 3)$, $(2, 3 \mid 4)$ twice, by different
      routes. Route one: $R_2 \to R_2 - 2R_1$ gives
      $(0, 3 - 4 \mid 4 - 6) = (0, -1 \mid -2)$; then $R_2 \to -R_2$ gives
      $(0, 1 \mid 2)$; then $R_1 \to R_1 - 2R_2$ gives
      $(1, 0 \mid 3 - 4) = (1, 0 \mid -1)$. Route two, starting with a swap:
      $R_1 \leftrightarrow R_2$ gives $(2, 3 \mid 4)$, $(1, 2 \mid 3)$; then
      $R_1 \to R_1 - R_2$ gives $(1, 1 \mid 1)$; then $R_2 \to R_2 - R_1$ gives
      $(1 - 1, 2 - 1 \mid 3 - 1) = (0, 1 \mid 2)$; then $R_1 \to R_1 - R_2$
      gives $(1, 0 \mid 1 - 2) = (1, 0 \mid -1)$. Different first moves,
      different intermediate arrays, different numbers of steps — and both end
      at the rows $(1, 0 \mid -1)$, $(0, 1 \mid 2)$.
    pitfalls: >
      Uniqueness is for the *reduced* form only. Ordinary echelon forms are
      many: $(1, 2 \mid 3)$, $(0, -1 \mid -2)$ and $(1, 2 \mid 3)$,
      $(0, 1 \mid 2)$ are both echelon forms of the same matrix, which is why
      "an echelon form" and "the reduced row echelon form" are phrased
      differently. Sharing a size and a pivot count does not make two matrices
      row equivalent — the rows $(1, 0 \mid 0)$, $(0, 1 \mid 0)$ and
      $(1, 0 \mid 1)$, $(0, 1 \mid 0)$ are both reduced, both have two pivots,
      and are not row equivalent, since their reduced forms differ. And equal
      solution sets is a weaker condition than row equivalence: two systems may
      share a solution set while their augmented matrices differ in size, and
      row equivalence only ever compares matrices of the same shape.
    recap: >
      Every matrix has exactly one reduced row echelon form, so
      $\operatorname{rref}(A)$ is a property of $A$ itself and the pivot
      positions — hence the basic and free variables — do not depend on how the
      elimination was carried out.
    steps:
      - teach: >
          Existence is settled: Gauss-Jordan always terminates, so every matrix
          has *a* reduced row echelon form. The open question is whether the
          destination depends on the route taken.
      - teach: >
          There is real reason to doubt it. A matrix has many echelon forms, the
          sequences of operations reaching a reduced one never run out, and two
          people will pivot on different rows and scale in different orders.
      - ask: >
          Reduce the rows $(1, 2 \mid 3)$, $(2, 3 \mid 4)$ to reduced row
          echelon form, beginning with $R_1 \leftrightarrow R_2$. What is the
          last entry of the first row?
        expects: "-1"
        hint: >
          After the swap, $R_1 \to R_1 - R_2$ makes the leading entry a $1$.
        feedback: >
          The swap gives $(2, 3 \mid 4)$, $(1, 2 \mid 3)$; then
          $R_1 \to R_1 - R_2$ gives $(1, 1 \mid 1)$; then $R_2 \to R_2 - R_1$
          gives $(0, 1 \mid 2)$; then $R_1 \to R_1 - R_2$ gives
          $(1, 0 \mid -1)$. The last entry is $-1$ — the same array reached by
          the more obvious route.
      - teach: >
          The theorem says the doubt is unfounded. Every matrix is row
          equivalent to one and only one matrix in reduced row echelon form,
          however the reduction is performed.
      - teach: >
          The mechanism: let $S(R)$ be the solutions of the equations given by
          the rows of $R$ with all constants $0$. A zero constant column stays
          zero under every row operation, so row equivalent matrices have the
          same $S$ — and a reduced form is read off from $S$.
      - teach: >
          Read off how? Set one free variable to $1$ and the others to $0$; the
          resulting tuple of $S$ has basic coordinates equal to the negatives of
          that column's entries. Once the pivot positions are pinned down, every
          entry is. Pinning the pivot positions takes an induction along the
          columns, and that is the half that makes this a theorem.
      - ask: >
          Which statement does the uniqueness theorem actually make?
        choices:
          - text: >
              Every matrix has exactly one row echelon form
            feedback: >
              False, and easily so: scale any row of an echelon matrix by $2$
              and you have another echelon form with the same pivot positions.
              Uniqueness needs the *reduced* form.
          - text: >
              Every matrix is row equivalent to exactly one matrix in reduced
              row echelon form
            correct: true
            feedback: >
              Existence comes from Gauss-Jordan and uniqueness is the theorem.
              Together they make $\operatorname{rref}(A)$ a well-defined object
              attached to $A$.
          - text: >
              Every sequence of row operations applied to $A$ ends at the same
              matrix
            feedback: >
              Wildly false — a single interchange ends somewhere else entirely.
              The claim is about sequences that reach a *reduced* form, not
              about sequences in general.
        feedback: >
          The theorem constrains the destination, not the journey. Any route is
          allowed and any number of steps, but every route that ends in reduced
          row echelon form ends at the same array.
      - ask: >
          How many matrices in reduced row echelon form is a given
          $3 \times 5$ matrix row equivalent to?
        expects: "1"
        hint: >
          Existence and uniqueness are being asserted together.
        feedback: >
          Exactly $1$. Gauss-Jordan produces at least one, and the theorem says
          there is no second, so the count is one for every matrix of every
          size.
      - teach: >
          So $\operatorname{rref}(A)$ belongs to $A$. Two matrices are row
          equivalent exactly when their reduced forms agree, which turns an
          unbounded search over sequences into a finite check, and the pivot
          positions — hence which variables are basic and which are free —
          become facts about the system rather than about your arithmetic.

  - node: linear-algebra.systems.consistency-criterion
    hook: >
      Consistency was defined but never tested. Elimination supplies the test,
      and it is a glance rather than a computation: one row shape, present or
      absent, settles whether the system has any answers at all.
    explanation: >
      Let $[A \mid b]$ be the augmented matrix of a system in $n$ unknowns and
      let $E$ be any row echelon form of it. The system is inconsistent if and
      only if $E$ contains a row $(0, 0, \dots, 0 \mid c)$ with $c \ne 0$.

      One direction is immediate. Such a row is the equation
      $0 x_1 + \cdots + 0 x_n = c$, whose left side is $0$ for every tuple, so
      no tuple satisfies it and the system $E$ describes has no solutions. Row
      operations preserve solution sets, so the original system has none either.

      The other direction is the one that does work. Suppose no such row occurs.
      Then every pivot of $E$ lies in one of the first $n$ columns, so every
      nonzero row has a basic variable of its own. Set all the free variables to
      $0$ and solve the nonzero rows from the bottom up: each one determines its
      own basic variable, and the zero rows say $0 = 0$ and ask nothing. What
      comes out is an actual tuple satisfying every equation. So the absence of
      a contradictory row is not merely the absence of one obstruction — it
      hands you a solution, which is why it is the *only* obstruction.

      The same criterion has a second phrasing worth carrying. A pivot in column
      $n+1$ is a leading entry, so everything to its left in that row is zero,
      which is exactly the shape $(0, \dots, 0 \mid c)$ with $c \ne 0$. So the
      system is inconsistent precisely when the last column is a pivot column.
      Either way the verdict is read off the shape of $E$ before a single
      solution is computed.
    worked: >
      Reduce the system $x_1 + x_2 + x_3 = 2$, $2x_1 + 3x_2 + x_3 = 3$,
      $x_1 + 2x_2 = 2$. Its augmented rows are $(1, 1, 1 \mid 2)$,
      $(2, 3, 1 \mid 3)$, $(1, 2, 0 \mid 2)$. Apply $R_2 \to R_2 - 2R_1$ to get
      $(0, 1, -1 \mid -1)$ and $R_3 \to R_3 - R_1$ to get $(0, 1, -1 \mid 0)$,
      then $R_3 \to R_3 - R_2$ to get $(0, 0, 0 \mid 1)$. That last row is the
      equation $0 = 1$, so the system is inconsistent — and equivalently, the
      pivot in that row sits in column $4$, the constant column. Now change one
      number: replace the third equation's constant by $1$. The same three
      operations give $(0, 1, -1 \mid -1)$, then $(0, 1, -1 \mid -1)$, then
      $(0, 0, 0 \mid 0)$, and there is no contradictory row. Following the
      recipe, the free variable is $x_3$; set it to $0$, and the second row
      gives $x_2 = -1$ while the first gives $x_1 = 2 - (-1) - 0 = 3$. The tuple
      $(3, -1, 0)$ satisfies all three: $3 - 1 + 0 = 2$, $6 - 3 + 0 = 3$, and
      $3 - 2 + 0 = 1$.
    pitfalls: >
      A row of all zeros including the constant, $(0, \dots, 0 \mid 0)$, is
      harmless: it says $0 = 0$, which is true, and it means one equation was
      redundant rather than contradictory. Only a nonzero constant beside zero
      coefficients is a contradiction. The test needs an echelon form, not the
      original array — an inconsistent system usually looks completely
      unremarkable before elimination, since each of its equations is solvable
      on its own. And a pivot in the last column is not a basic variable: the
      constant column belongs to no unknown, so it must never be counted when
      splitting the unknowns into basic and free.
    recap: >
      A system is inconsistent exactly when some echelon form of its augmented
      matrix has a row with zero coefficients and a nonzero constant —
      equivalently, when the last column is a pivot column — and that shape is
      the only way a linear system can fail.
    steps:
      - teach: >
          Consistency has a definition and no test. Elimination supplies one,
          and it turns out to be a matter of looking at the shape of the
          echelon form rather than computing anything.
      - teach: >
          The criterion: a system is inconsistent if and only if some echelon
          form of its augmented matrix contains a row
          $(0, 0, \dots, 0 \mid c)$ with $c \ne 0$.
      - ask: >
          Row-reduce the augmented rows $(1, 1, 1 \mid 2)$, $(2, 3, 1 \mid 3)$,
          $(1, 2, 0 \mid 2)$. The bottom row of the echelon form is
          $(0, 0, 0 \mid c)$. What is $c$?
        expects: "1"
        hint: >
          Clear the first column with $R_2 \to R_2 - 2R_1$ and
          $R_3 \to R_3 - R_1$, then compare the two new rows.
        feedback: >
          Those two operations give $(0, 1, -1 \mid -1)$ and
          $(0, 1, -1 \mid 0)$. Subtracting, $R_3 \to R_3 - R_2$ leaves
          $(0, 0, 0 \mid 0 - (-1)) = (0, 0, 0 \mid 1)$, so $c = 1$ and the
          system is inconsistent.
      - teach: >
          One direction is immediate. Such a row is $0x_1 + \cdots + 0x_n = c$,
          which no tuple satisfies. Row operations preserve solution sets, so
          the original system has no solutions either.
      - teach: >
          The other direction does real work. With no such row, every pivot sits
          in one of the first $n$ columns, so every nonzero row owns a basic
          variable. Set the free variables to $0$, sweep up, and out comes an
          actual solution.
      - ask: >
          Which of these echelon forms belongs to an inconsistent system?
        choices:
          - text: >
              Rows $(1, 2, 0 \mid 3)$, $(0, 0, 1 \mid 4)$, $(0, 0, 0 \mid 0)$
            feedback: >
              The bottom row reads $0 = 0$, which is true and simply says one
              equation was redundant. Setting the free variable $x_2$ to $0$
              gives the solution $(3, 0, 4)$.
          - text: >
              Rows $(1, 2, 0 \mid 3)$, $(0, 0, 1 \mid 4)$, $(0, 0, 0 \mid 5)$
            correct: true
            feedback: >
              The bottom row is the equation $0 = 5$. Every tuple makes its left
              side $0$, so none satisfies it, and the system above it has no
              solutions however innocent it looks.
          - text: >
              Rows $(1, 2, 0 \mid 0)$, $(0, 0, 1 \mid 0)$
            feedback: >
              No row here has zero coefficients at all, so the criterion finds
              nothing wrong. Setting $x_2 = 0$ gives the solution $(0, 0, 0)$.
        feedback: >
          Look for zero coefficients paired with a nonzero constant. Zeros all
          the way across, constant included, are harmless; a nonzero constant
          beside them is the one fatal shape.
      - teach: >
          The criterion has a second phrasing. A pivot in column $n+1$ is a
          leading entry, so its whole row is zero to its left — exactly the
          contradictory shape. So inconsistency means the last column is a pivot
          column.
      - ask: >
          An echelon form of a system in $4$ unknowns has $3$ pivots, one of
          them in the last column. How many of the unknowns are basic?
        expects: "2"
        hint: >
          Only pivots among the first $4$ columns belong to unknowns.
        feedback: >
          One of the three pivots sits in column $5$, the constant column, which
          belongs to no unknown. That leaves $3 - 1 = 2$ pivots among the first
          four columns, so $2$ basic variables — and the pivot in the last
          column tells you the system is inconsistent, so those variables never
          get values.
      - teach: >
          So consistency is settled before any solving begins. Reduce, look for
          zero coefficients beside a nonzero constant, and you know whether
          there is anything to find.

  - node: linear-algebra.systems.trichotomy
    hook: >
      Ask how many solutions a linear system has and there are only three
      possible answers. Not "it depends" — three, and an echelon form tells you
      which before you finish solving.
    explanation: >
      A system of linear equations with real coefficients has no solution, or
      exactly one solution, or infinitely many. No other count occurs: no system
      has exactly two solutions, or exactly seventeen.

      An echelon form $E$ of the augmented matrix decides which case holds, in
      two questions. First, does $E$ contain a row $(0, \dots, 0 \mid c)$ with
      $c \ne 0$? If so the system is inconsistent and the count is zero. If not
      it is consistent, and the second question is whether any free variable
      exists.

      If there is none, every unknown is basic, and the parametric description
      produced by back-substitution has no parameters in it: it names one tuple,
      and it names every solution, so the count is exactly one. If there is at
      least one free variable, that variable takes a parameter ranging over
      $\mathbb{R}$, and two different parameter values produce two different
      tuples, since they already disagree in that free variable's own
      coordinate. There are infinitely many real numbers to choose from, so
      there are infinitely many solutions.

      Look at where "exactly two" would have to come from. It would need a
      consistent system with a free variable that somehow admitted only two
      values for it — but the free variable is unconstrained by construction, so
      any real number works. Between "no freedom at all" and "a whole line of
      freedom" there is nothing in between. That is the shape of the theorem,
      and it is what the word *linear* buys: a quadratic in one unknown happily
      has exactly two solutions, and a linear system never can. Only the third
      case leans on the scalars being infinite; stated so as not to, the
      trichotomy reads: none, exactly one, or more than one.
    worked: >
      Three systems in two unknowns, differing only in the last constant. First,
      $x_1 + x_2 = 3$ and $x_1 - x_2 = 1$: the rows $(1, 1 \mid 3)$,
      $(1, -1 \mid 1)$ become $(1, 1 \mid 3)$, $(0, -2 \mid -2)$ under
      $R_2 \to R_2 - R_1$. No contradictory row, and pivots in both of the
      first two columns, so no free variable — exactly one solution, namely
      $x_2 = 1$ and then $x_1 = 2$, the tuple $(2, 1)$. Second,
      $x_1 + x_2 = 3$ and $2x_1 + 2x_2 = 6$: $R_2 \to R_2 - 2R_1$ gives
      $(0, 0 \mid 0)$. No contradictory row, one pivot, so $x_2$ is free —
      infinitely many solutions, namely every $(3 - t, t)$. Third,
      $x_1 + x_2 = 3$ and $2x_1 + 2x_2 = 7$: the same operation gives
      $(0, 0 \mid 1)$, a contradictory row, so there are no solutions. Three
      systems, two equations and two unknowns each, and all three cases.
    pitfalls: >
      Counting equations against unknowns settles nothing: the first and third
      systems above have two equations in two unknowns and land in different
      cases. A free variable means infinitely many solutions only *after*
      consistency has been checked — the third system has a free variable in its
      coefficient columns and no solutions at all, because a contradictory row
      overrules everything. And the instinct that an equation might have exactly
      two answers comes from quadratics; linearity is precisely what forbids it
      here.
    recap: >
      No solutions when the echelon form has zero coefficients beside a nonzero
      constant, exactly one when it is consistent with no free variable, and
      infinitely many when it is consistent with at least one — and nothing
      else is possible.
    steps:
      - teach: >
          Whatever system you write down, the number of solutions is one of
          three things: none, exactly one, or infinitely many. There is no
          fourth possibility to worry about.
      - teach: >
          An echelon form decides it in two questions. First: is there a row
          with zero coefficients and a nonzero constant? If yes, the system is
          inconsistent and the count is zero.
      - ask: >
          The system $x_1 + x_2 = 3$, $x_1 - x_2 = 1$ reduces to the rows
          $(1, 1 \mid 3)$, $(0, -2 \mid -2)$. How many solutions does it have?
        expects: "1"
        hint: >
          Check for a contradictory row, then count the free variables.
        feedback: >
          No row has zero coefficients, so the system is consistent, and both of
          the first two columns carry pivots, so there is no free variable. The
          answer is unique: $-2x_2 = -2$ gives $x_2 = 1$ and then $x_1 = 2$, the
          single tuple $(2, 1)$.
      - teach: >
          Second question, asked only of a consistent system: is there a free
          variable? With none, every unknown is basic, back-substitution
          produces a description with no parameters in it, and that description
          names one tuple.
      - teach: >
          With at least one free variable, that variable carries a parameter
          ranging over $\mathbb{R}$, and two different values give two different
          tuples — they already disagree in that coordinate. Infinitely many
          reals, infinitely many solutions.
      - ask: >
          A linear system with real coefficients turns out to have more than one
          solution. How many does it have?
        choices:
          - text: >
              Possibly exactly two, if two of the equations happen to meet twice
            feedback: >
              That is a quadratic's behaviour, not a linear system's. More than
              one solution forces a free variable, and a free variable accepts
              every real number, not two of them.
          - text: >
              Infinitely many
            correct: true
            feedback: >
              More than one solution means the system is consistent with at
              least one free variable, and that variable ranges over all of
              $\mathbb{R}$, each value giving a distinct solution.
          - text: >
              It depends on how many equations there are
            feedback: >
              The number of equations never enters. Two equations in two
              unknowns can give none, one, or infinitely many, depending only on
              the shape of the echelon form.
        feedback: >
          Once a second solution exists there is a free variable, and a free
          variable is unconstrained — every real value of it yields a solution.
          That is why no finite count above one is possible.
      - teach: >
          Order the two questions carefully. A free variable promises infinitely
          many solutions only once consistency is known; the system
          $x_1 + x_2 = 3$, $2x_1 + 2x_2 = 7$ has a free variable in its
          coefficient columns and no solutions whatever.
      - ask: >
          An echelon form of a system in $5$ unknowns has $4$ pivots, all among
          the first $5$ columns. How many free variables are there?
        expects: "1"
        hint: >
          Every unknown is basic or free, and no pivot sits in the constant
          column.
        feedback: >
          Four pivots among the first five columns give four basic variables, so
          $5 - 4 = 1$ unknown is free. No pivot lies in the constant column, so
          the system is consistent, and one free variable puts it in the
          infinitely-many case.
      - teach: >
          So the answer to "how many solutions?" is available from the staircase
          alone. Contradictory row: none. No free variable: one. A free
          variable: a whole continuum.

  - node: linear-algebra.systems.def-rank
    hook: >
      Elimination produces a number almost incidentally — how many pivots turned
      up. That number, and not any individual entry, is what governs everything
      the system does.
    explanation: >
      The *rank* of a matrix $A$, written $\rank A$, is the number of pivots in
      an echelon form of $A$; equivalently, the number of nonzero rows of
      $\operatorname{rref}(A)$. The rank of a system is the rank of its
      coefficient matrix.

      That definition has to be defended, because it refers to "an echelon
      form", and a matrix has many. The defence is the uniqueness of the reduced
      row echelon form: every reduction of $A$ ends at the same reduced array,
      and the pivot positions are the same in every echelon form of $A$, so the
      count cannot depend on which elimination you performed or on how much you
      fumbled along the way. The rank belongs to the matrix.

      Two bounds come straight from the staircase. Each pivot occupies a row of
      its own and a column of its own, so $\rank A \le \min(m, n)$ for an
      $m \times n$ matrix: a wide flat matrix has small rank no matter what its
      entries are. And adjoining the constant column can add at most one more
      pivot, since that one extra column can host at most one, so
      $\rank A \le \rank [A \mid b] \le \rank A + 1$.

      Informally, the rank counts how many of the $m$ equations impose genuinely
      independent constraints. The equations that repeat information already
      carried by the others are exactly the ones elimination flattens into zero
      rows, and every zero row is an equation that cost the system nothing.
    worked: >
      Take $A$ with rows $(1, 2, -1)$, $(2, 4, -2)$, $(3, 1, 0)$. Apply
      $R_2 \to R_2 - 2R_1$, which gives $(0, 0, 0)$, and
      $R_3 \to R_3 - 3R_1$, which gives $(0, 1 - 6, 0 + 3) = (0, -5, 3)$. A
      zero row now sits above a nonzero one, so interchange rows $2$ and $3$:
      the echelon form is $(1, 2, -1)$, $(0, -5, 3)$, $(0, 0, 0)$, with pivots
      in columns $1$ and $2$. So $\rank A = 2$, even though $A$ has three
      nonzero rows — the second equation was twice the first and contributed
      nothing. Now attach constants. With $b = (1, 2, 4)$ the same operations
      give $(1, 2, -1 \mid 1)$, $(0, -5, 3 \mid 1)$, $(0, 0, 0 \mid 0)$, so
      $\rank [A \mid b] = 2 = \rank A$. With $b = (1, 3, 4)$ instead,
      $R_2 \to R_2 - 2R_1$ gives $(0, 0, 0 \mid 3 - 2) = (0, 0, 0 \mid 1)$, and
      after the interchange the echelon form is $(1, 2, -1 \mid 1)$,
      $(0, -5, 3 \mid 1)$, $(0, 0, 0 \mid 1)$ with pivots in columns $1$, $2$
      and $4$: now $\rank [A \mid b] = 3 = \rank A + 1$. Both allowed cases,
      from one coefficient matrix.
    pitfalls: >
      Rank counts pivots after reduction, never nonzero rows before it — the
      matrix above has three nonzero rows and rank $2$. The bound
      $\rank A \le \min(m, n)$ is often the whole story: a $2 \times 5$ matrix
      has rank at most $2$ however elaborate its entries, because there are only
      two rows for pivots to sit in. And the rank of a *system* means the rank
      of its coefficient matrix; $\rank [A \mid b]$ is a different number, equal
      to it or one larger, and the difference is exactly what the constants do
      to the system.
    recap: >
      The rank is the number of pivots elimination produces, well defined
      because the reduced row echelon form is unique, at most $\min(m, n)$, and
      counting how many of the equations genuinely constrain anything.
    steps:
      - teach: >
          Every elimination ends by handing you a count — how many pivots
          appeared. That count turns out to control existence, uniqueness and
          the size of the solution set, so it deserves a name.
      - teach: >
          The rank of $A$, written $\rank A$, is the number of pivots in an
          echelon form of $A$, equivalently the number of nonzero rows of
          $\operatorname{rref}(A)$. The rank of a system is the rank of its
          coefficient matrix.
      - ask: >
          What is the rank of the matrix with rows $(1, 2, -1)$, $(2, 4, -2)$
          and $(3, 1, 0)$?
        expects: "2"
        hint: >
          Clear the first column and see how many nonzero rows survive.
        feedback: >
          $R_2 \to R_2 - 2R_1$ gives $(0, 0, 0)$ and $R_3 \to R_3 - 3R_1$ gives
          $(0, -5, 3)$. Interchanging to put the zero row at the bottom leaves
          $(1, 2, -1)$, $(0, -5, 3)$, $(0, 0, 0)$: two pivots, so the rank is
          $2$. The second row was twice the first and vanished.
      - ask: >
          Why does the rank not depend on which elimination you happened to
          perform?
        choices:
          - text: >
              Because every matrix has exactly one row echelon form
            feedback: >
              It does not — scale any row of an echelon matrix and you get
              another. What is unique is the *reduced* form.
          - text: >
              Because every matrix is row equivalent to exactly one reduced row
              echelon form, so the pivot positions are the same in every echelon
              form of $A$
            correct: true
            feedback: >
              Uniqueness of the reduced form is precisely what makes the count
              an invariant. Without it, "the number of pivots" would be a
              feature of your arithmetic rather than of the matrix.
          - text: >
              Because row operations do not change the entries of the matrix
            feedback: >
              Row operations change entries constantly; that is what they are
              for. The invariance being claimed is about the pivot count, not
              the entries.
        feedback: >
          The rank is well defined only because the destination of a reduction
          is fixed. That is what earlier work on uniqueness bought, and this is
          the first place the purchase pays off.
      - teach: >
          Two bounds fall out of the staircase. Each pivot claims a row and a
          column of its own, so $\rank A \le \min(m, n)$ — a matrix that is
          short or narrow has small rank no matter what is in it.
      - ask: >
          At most what can the rank of a $2 \times 5$ matrix be?
        expects: "2"
        hint: >
          Two ceilings apply, and the smaller wins.
        feedback: >
          No two pivots share a row, so the count is at most $2$; no two share a
          column, so it is at most $5$. Hence
          $\rank A \le \min(2, 5) = 2$, whatever the entries are.
      - teach: >
          Attaching the constant column can add at most one pivot, since one
          column hosts at most one, so
          $\rank A \le \rank [A \mid b] \le \rank A + 1$. There are exactly two
          possibilities, and which one holds is the constants' doing.
      - teach: >
          Read the rank informally as the number of equations that genuinely
          constrain anything. The redundant ones are precisely those elimination
          flattens into zero rows, and a zero row is an equation that cost the
          system nothing.

  - node: linear-algebra.systems.rank-criterion
    hook: >
      Existence and uniqueness looked like two separate investigations. One
      number answers both — you only have to know where to compare it.
    explanation: >
      Consider a system of $m$ equations in $n$ unknowns with coefficient matrix
      $A$ and augmented matrix $[A \mid b]$. It is consistent if and only if
      $\rank A = \rank [A \mid b]$.

      That follows from what each rank counts. Inconsistency means the last
      column is a pivot column, so the augmented matrix has one pivot that the
      coefficient matrix does not, which is exactly the case
      $\rank [A \mid b] = \rank A + 1$. Since those two ranks can differ by at
      most one, the only remaining possibility is equality, and that is
      consistency. Nothing is lost between them.

      When the system is consistent, the second question is answered by the same
      number. The basic variables are counted by the pivots in the first $n$
      columns, and all of them lie there, so there are $\rank A$ basic variables
      and exactly $n - \rank A$ free ones. Back-substitution turns each free
      variable into a parameter, so the solution set needs precisely
      $n - \rank A$ parameters: the solution is unique if and only if
      $\rank A = n$, and there are infinitely many if and only if
      $\rank A < n$.

      One consequence is worth memorising, because it lets you rule things out
      without computing. Since $\rank A \le m$, a consistent system with fewer
      equations than unknowns has $n - \rank A \ge n - m > 0$ free variables and
      so can never have a unique solution. The converse fear is unfounded: more
      equations than unknowns does not make a system inconsistent. What matters
      is the rank, never the raw count of equations.
    worked: >
      A system in $n = 4$ unknowns reduces to the echelon rows
      $(1, 2, 0, -1 \mid 3)$, $(0, 0, 1, 2 \mid 1)$, $(0, 0, 0, 0 \mid 0)$. The
      coefficient part has pivots in columns $1$ and $3$, so $\rank A = 2$; the
      augmented matrix has the same two pivots and no more, so
      $\rank [A \mid b] = 2$. The ranks agree, so the system is consistent, and
      it needs $n - \rank A = 4 - 2 = 2$ parameters. Setting $x_2 = s$ and
      $x_4 = t$, the second row gives $x_3 = 1 - 2t$ and the first gives
      $x_1 = 3 - 2s + t$, so the solution set is every
      $(3 - 2s + t,\ s,\ 1 - 2t,\ t)$. At $s = t = 0$ this is $(3, 0, 1, 0)$,
      and indeed $3 + 0 + 0 - 0 = 3$ and $0 + 0 + 1 + 0 = 1$; at $s = t = 1$ it
      is $(2, 1, -1, 1)$, and $2 + 2 + 0 - 1 = 3$ and $0 + 0 - 1 + 2 = 1$. Now
      change the bottom row's constant to $5$. The coefficient matrix is
      untouched, so $\rank A = 2$ still, but the row $(0, 0, 0, 0 \mid 5)$
      contributes a third pivot in the last column, so
      $\rank [A \mid b] = 3 = \rank A + 1$ and the system is inconsistent.
    pitfalls: >
      Because $\rank A \le m$, a consistent system with fewer equations than
      unknowns always has free variables: three equations in five unknowns can
      never pin down a single answer, however cleverly the equations are chosen.
      The reverse instinct is also wrong — more equations than unknowns is not
      inconsistency, since the extra equations may simply repeat what the others
      said. And $\rank [A \mid b]$ never exceeds $\rank A + 1$, so there is no
      such thing as a system that fails worse than by one pivot; consistency has
      exactly two verdicts.
    recap: >
      A system is consistent exactly when $\rank A = \rank [A \mid b]$, and when
      it is, its solution set needs exactly $n - \rank A$ parameters — unique
      when $\rank A = n$ and infinite otherwise.
    steps:
      - teach: >
          Existence and uniqueness have been two separate investigations so far.
          One number settles both, provided you compare it in the right two
          places.
      - teach: >
          Existence first: the system is consistent if and only if
          $\rank A = \rank [A \mid b]$. Inconsistency means the last column
          carries a pivot, which is exactly one extra pivot in the augmented
          matrix.
      - ask: >
          A system of $4$ equations in $3$ unknowns has $\rank A = 3$ and
          $\rank [A \mid b] = 3$. How many solutions does it have?
        expects: "1"
        hint: >
          Compare the two ranks first, then compare $\rank A$ with the number of
          unknowns.
        feedback: >
          The ranks agree, so the system is consistent. Then
          $n - \rank A = 3 - 3 = 0$ free variables, so the description has no
          parameters and names exactly one tuple. Having four equations for
          three unknowns caused no trouble at all.
      - teach: >
          Uniqueness next, from the same number. All $\rank A$ pivots lie in the
          first $n$ columns, so there are $\rank A$ basic variables and
          $n - \rank A$ free ones — and that is the number of parameters.
      - ask: >
          A consistent system in $6$ unknowns has $\rank A = 4$. How many
          parameters does its solution set need?
        expects: "2"
        hint: >
          Every unknown is basic or free, and the pivots count the basic ones.
        feedback: >
          There are $\rank A = 4$ basic variables, so $6 - 4 = 2$ free ones, and
          back-substitution gives each free variable a parameter. Two
          parameters, hence infinitely many solutions.
      - teach: >
          So the solution is unique exactly when $\rank A = n$, and infinite
          exactly when $\rank A < n$. The two questions have collapsed into two
          comparisons of one number.
      - ask: >
          Can a consistent system of $3$ equations in $5$ unknowns have exactly
          one solution?
        choices:
          - text: >
              Yes, if the three equations are chosen carefully enough
            feedback: >
              No choice of equations helps. Three rows can host at most three
              pivots, and five unknowns need five basic variables for
              uniqueness.
          - text: >
              No, because $\rank A \le 3 < 5$, so at least two variables are
              free
            correct: true
            feedback: >
              Each pivot needs a row of its own, so $\rank A \le m = 3$. Then
              $n - \rank A \ge 5 - 3 = 2$, and a consistent system with free
              variables has infinitely many solutions.
          - text: >
              No, because a system with fewer equations than unknowns is always
              inconsistent
            feedback: >
              The conclusion is right and the reason is wrong. Such a system may
              be perfectly consistent — $x_1 + x_2 = 1$ has solutions in
              abundance. What it cannot be is uniquely solvable.
        feedback: >
          The bound $\rank A \le m$ does the work. Too few equations cannot
          produce enough pivots, and every unknown left without one becomes a
          parameter.
      - teach: >
          The reverse instinct is wrong too: more equations than unknowns is not
          inconsistency, because the surplus equations may merely repeat the
          others. Rank decides; the raw count of equations never does.

  - node: linear-algebra.systems.def-homogeneous
    hook: >
      A system whose right-hand sides are all zero can never fail, because
      everything being zero always works. That removes the existence question
      entirely and leaves one sharper one in its place.
    explanation: >
      A linear system is *homogeneous* when every constant term is zero, so its
      $i$-th equation reads $a_{i1} x_1 + \cdots + a_{in} x_n = 0$ and its
      augmented matrix is $[A \mid 0]$. The word is about the constants only;
      the coefficients may be anything at all.

      Substitute the zero tuple $(0, 0, \dots, 0)$ into any homogeneous
      equation and the left side is $0$, which is what the right side demands.
      So every homogeneous system has that tuple as a solution — the *trivial*
      solution — and is therefore always consistent. Asking whether a
      homogeneous system has a solution is asking a question that answers
      itself. The live question is whether it has a *nontrivial* solution, one
      with $x_j \ne 0$ for at least one $j$.

      The zero column is remarkably inert. An interchange moves zeros among
      themselves; scaling multiplies $0$ by $c$ and gets $0$; a replacement adds
      $c$ times $0$ to $0$ and gets $0$. So the last column of $[A \mid 0]$ is
      still all zeros after any sequence of row operations, which means you may
      run the elimination on $A$ alone and carry the column along in your head.
      It also means no row $(0, \dots, 0 \mid c)$ with $c \ne 0$ can ever
      appear — the consistency criterion agreeing, from the other direction,
      that a homogeneous system cannot be inconsistent.

      Finally, every system $[A \mid b]$ has an *associated* homogeneous system
      $[A \mid 0]$, got by replacing all the constants by $0$ and keeping the
      coefficients. Since elimination touches the coefficient columns in exactly
      the same way for both, the two systems have the same pivot positions, the
      same basic and free variables, and the same number of parameters — when
      the original is consistent at all.
    worked: >
      Solve $x_1 + 2x_2 - x_3 = 0$ and $2x_1 + 4x_2 + 3x_3 = 0$. The augmented
      rows are $(1, 2, -1 \mid 0)$ and $(2, 4, 3 \mid 0)$, and
      $R_2 \to R_2 - 2R_1$ gives $(0, 0, 5 \mid 0)$ — the constant stays $0$, as
      it must. The pivots lie in columns $1$ and $3$, so $x_2$ is free. The
      second row says $5x_3 = 0$, so $x_3 = 0$, and the first says
      $x_1 = -2x_2$. Putting $x_2 = t$, the solutions are all $(-2t, t, 0)$. At
      $t = 0$ that is the trivial solution; at $t = 1$ it is $(-2, 1, 0)$, and
      checking, $-2 + 2 - 0 = 0$ and $-4 + 4 + 0 = 0$. So this system has
      nontrivial solutions in abundance. Contrast $x_1 + x_2 = 0$ and
      $x_1 - x_2 = 0$: here $R_2 \to R_2 - R_1$ gives $(0, -2 \mid 0)$, both
      columns carry pivots, no variable is free, and the only solution is
      $(0, 0)$. Both outcomes are available, so the question is a real one.
    pitfalls: >
      Homogeneity is a condition on the constants, not the coefficients: the
      system $0x_1 + 0x_2 = 3$ has all-zero coefficients and is not homogeneous,
      while $7x_1 - \sqrt{2} x_2 = 0$ has ugly coefficients and is. Asking
      whether a homogeneous system is consistent wastes a question, since it
      always is; ask instead whether a nonzero solution exists. And dropping the
      zero column while eliminating is legitimate but easy to misremember — the
      answers you compute are the solutions of $[A \mid 0]$, not of the system
      $[A \mid b]$ you may have started from.
    recap: >
      A homogeneous system has all constants zero, always has the trivial
      solution and so is never inconsistent, keeps its zero column under every
      row operation, and poses exactly one question: is there a solution other
      than all zeros?
    steps:
      - teach: >
          Some systems arrive with every right-hand side equal to zero. That
          shape is special enough to name: a system is *homogeneous* when every
          constant term is $0$, so its augmented matrix is $[A \mid 0]$.
      - teach: >
          Substitute the zero tuple into any homogeneous equation and the left
          side is $0$, exactly what is asked. So every homogeneous system has
          the *trivial* solution and is always consistent.
      - ask: >
          Which of these systems is homogeneous?
        choices:
          - text: >
              $x_1 + x_2 = 0$, $x_1 - x_2 = 1$
            feedback: >
              The first constant is $0$ but the second is not, and homogeneity
              asks it of every equation. This system may well be inconsistent
              for all the definition can tell.
          - text: >
              $2x_1 - 5x_2 + x_3 = 0$, $x_1 + x_3 = 0$
            correct: true
            feedback: >
              Every constant term is $0$, which is the whole requirement. The
              coefficients are unremarkable and entirely irrelevant to the
              question.
          - text: >
              $0x_1 + 0x_2 = 3$
            feedback: >
              The zeros here are in the coefficients, where nothing is asked of
              them. The constant is $3$, so the system is not homogeneous — and
              in fact it has no solutions.
        feedback: >
          Look only to the right of the equals signs. All zeros there, whatever
          the coefficients, is homogeneous; a single nonzero constant anywhere
          is not.
      - teach: >
          Since existence is automatic, it is not worth asking. The live
          question is whether a *nontrivial* solution exists — a tuple with
          $x_j \ne 0$ for at least one $j$.
      - ask: >
          In the homogeneous system $x_1 + 2x_2 - x_3 = 0$,
          $2x_1 + 4x_2 + 3x_3 = 0$, the operation $R_2 \to R_2 - 2R_1$ gives the
          row $(0, 0, 5 \mid 0)$, so $x_3 = 0$. Taking $x_2 = 1$, what is $x_1$?
        expects: "-2"
        hint: >
          Substitute $x_2 = 1$ and $x_3 = 0$ into the first equation.
        feedback: >
          The first equation becomes $x_1 + 2 - 0 = 0$, so $x_1 = -2$ and the
          tuple is $(-2, 1, 0)$. Checking both equations, $-2 + 2 - 0 = 0$ and
          $-4 + 4 + 0 = 0$: a genuinely nontrivial solution.
      - teach: >
          The zero column never changes. Interchange moves zeros among
          themselves, scaling gives $c \cdot 0 = 0$, replacement gives
          $0 + c \cdot 0 = 0$. So elimination can be run on $A$ alone, and no
          contradictory row can ever appear.
      - ask: >
          A homogeneous system in $3$ unknowns has an echelon form with $3$
          pivots. How many solutions does it have?
        expects: "1"
        hint: >
          Count the free variables, and remember which solution is always there.
        feedback: >
          Three pivots among three unknown columns leave $3 - 3 = 0$ free
          variables, so a consistent system has exactly one solution — and the
          trivial solution is always one, so it is that one. The system has only
          $(0, 0, 0)$.
      - teach: >
          Every system $[A \mid b]$ has an associated homogeneous system
          $[A \mid 0]$, the same coefficients with the constants replaced by
          zero. Elimination treats their coefficient columns identically, so
          they share pivot positions, basic variables and free variables.

  - node: linear-algebra.systems.more-unknowns-nontrivial
    hook: >
      Here is a conclusion drawn from counting alone: if a homogeneous system
      has more unknowns than equations, it *must* have a solution other than all
      zeros — whatever its coefficients happen to be.
    explanation: >
      The claim: a homogeneous system of $m$ linear equations in $n$ unknowns
      with $n > m$ has a nontrivial solution, and over $\mathbb{R}$ it has
      infinitely many.

      The proof is short because the machinery is already built. Reduce
      $[A \mid 0]$ to echelon form. Each pivot occupies a row of its own, so
      $\rank A \le m$, and $m < n$ gives $\rank A < n$. The number of free
      variables is $n - \rank A \ge 1$, so at least one exists. The system is
      consistent — it has the trivial solution — so back-substitution applies:
      assign the value $1$ to one free variable, $0$ to the others, and sweep
      upward. The tuple that comes out has a $1$ in that free variable's
      coordinate, so it is not the zero tuple. That is a nontrivial solution.
      Letting the free variable run over $\mathbb{R}$ instead of stopping at $1$
      gives infinitely many.

      Both hypotheses carry weight. Homogeneity cannot be dropped: the system
      $x_1 + x_2 + x_3 = 1$ together with $x_1 + x_2 + x_3 = 2$ has three
      unknowns, two equations and no solution at all, since subtracting gives
      $0 = 1$. The counting argument still produces a free variable there, but
      with an inconsistent system there is nothing for it to be free *in*.

      The inequality $n > m$ is also only sufficient, never necessary. What
      actually does the work is $\rank A < n$, and a system with $m \ge n$ can
      manage that easily by repeating itself — $x_1 + x_2 = 0$ together with
      $2x_1 + 2x_2 = 0$ has two equations, two unknowns, and the nontrivial
      solutions $(-t, t)$. Counting equations is a shortcut that is sometimes
      available; the rank is the truth underneath it.
    worked: >
      Take $x_1 + 2x_2 + 3x_3 = 0$ and $2x_1 + 5x_2 + 4x_3 = 0$, so $m = 2$ and
      $n = 3$ and the theorem promises a nontrivial solution before any
      arithmetic. The augmented rows are $(1, 2, 3 \mid 0)$ and
      $(2, 5, 4 \mid 0)$, and $R_2 \to R_2 - 2R_1$ gives
      $(0, 1, -2 \mid 0)$. The pivots lie in columns $1$ and $2$, so
      $\rank A = 2$ and the single free variable is $x_3$, matching
      $n - \rank A = 3 - 2 = 1$. Set $x_3 = 1$. The second row reads
      $x_2 - 2x_3 = 0$, so $x_2 = 2$; the first reads
      $x_1 + 2x_2 + 3x_3 = 0$, so $x_1 = -4 - 3 = -7$. The tuple $(-7, 2, 1)$ is
      nontrivial, and it checks: $-7 + 4 + 3 = 0$ and $-14 + 10 + 4 = 0$.
      Letting $x_3 = t$ instead gives the whole family $(-7t, 2t, t)$,
      infinitely many solutions as promised.
    pitfalls: >
      Homogeneity is not decoration: $x_1 + x_2 + x_3 = 1$ and
      $x_1 + x_2 + x_3 = 2$ have more unknowns than equations and no solutions
      whatever, because the counting argument only produces free variables and
      free variables are worthless in an inconsistent system. The converse fails
      as well — $n \le m$ does not force the trivial solution to be the only
      one, as $x_1 + x_2 = 0$ with $2x_1 + 2x_2 = 0$ shows. And "nontrivial"
      means at least one coordinate is nonzero, not that all of them are: the
      tuple $(-7, 2, 1)$ and the tuple $(0, 0, 1)$ would both qualify.
    recap: >
      More unknowns than equations caps the rank below $n$, which leaves a free
      variable, which a homogeneous system can always exploit — so such a system
      always has a solution other than all zeros, and over $\mathbb{R}$
      infinitely many.
    steps:
      - teach: >
          Some conclusions come from counting rather than from the numbers. This
          is one: a homogeneous system with more unknowns than equations always
          has a solution other than all zeros, whatever its coefficients are.
      - teach: >
          The reason is a chain of bounds. Each pivot needs a row of its own, so
          $\rank A \le m$; and $m < n$ gives $\rank A < n$; so the free variable
          count $n - \rank A$ is at least $1$.
      - ask: >
          A homogeneous system has $3$ equations in $7$ unknowns. At least how
          many free variables must it have?
        expects: "4"
        hint: >
          Bound the rank by the number of rows, then subtract from the number of
          unknowns.
        feedback: >
          Three rows can host at most three pivots, so $\rank A \le 3$. The free
          variables number $n - \rank A \ge 7 - 3 = 4$. There may be more if the
          equations repeat one another, but never fewer.
      - teach: >
          A free variable is only useful if there is something to solve. Here
          there is: the system is homogeneous, so the trivial solution exists
          and the system is consistent, and back-substitution applies.
      - ask: >
          For $x_1 + 2x_2 + 3x_3 = 0$, $2x_1 + 5x_2 + 4x_3 = 0$, elimination
          gives the second row $(0, 1, -2 \mid 0)$. Setting the free variable
          $x_3 = 1$, what is $x_1$?
        expects: "-7"
        hint: >
          Get $x_2$ from the second row first, then substitute both into the
          first.
        feedback: >
          The second row says $x_2 - 2x_3 = 0$, so $x_2 = 2$. The first says
          $x_1 + 2x_2 + 3x_3 = 0$, so $x_1 = -4 - 3 = -7$. The tuple
          $(-7, 2, 1)$ is nontrivial, and $-7 + 4 + 3 = 0$ with
          $-14 + 10 + 4 = 0$.
      - teach: >
          Assigning $1$ to a free variable and $0$ to the rest guarantees the
          result is not the zero tuple, since that coordinate is $1$. Letting
          the free variable run over $\mathbb{R}$ instead gives infinitely many.
      - ask: >
          Why does the theorem insist the system be homogeneous?
        choices:
          - text: >
              Because homogeneous systems have simpler coefficients to work with
            feedback: >
              Homogeneity says nothing about the coefficients — they may be as
              awkward as you like. It is a condition on the constants alone.
          - text: >
              Because homogeneity guarantees consistency, and free variables are
              worthless without it
            correct: true
            feedback: >
              The system $x_1 + x_2 + x_3 = 1$, $x_1 + x_2 + x_3 = 2$ has three
              unknowns, two equations and a free variable by the same count —
              and no solutions at all, since subtracting gives $0 = 1$. Without
              consistency the counting proves nothing.
          - text: >
              Because a nontrivial solution must have every coordinate nonzero
            feedback: >
              Nontrivial asks for at least one nonzero coordinate, not all of
              them. The tuple $(0, 0, 1)$ is perfectly nontrivial.
        feedback: >
          The count produces a free variable in either case. Homogeneity is what
          supplies the solution the free variable then gets to vary, and it does
          so for free, because the zero tuple always works.
      - teach: >
          Counting equations is a shortcut, not the mechanism. What matters is
          $\rank A < n$, and a system with as many equations as unknowns manages
          that by repeating itself: $x_1 + x_2 = 0$ with $2x_1 + 2x_2 = 0$ has
          the nontrivial solutions $(-t, t)$.

  - node: linear-algebra.systems.solution-structure
    hook: >
      Change only the constants of a system and the solution set moves without
      changing shape. That observation, made precise, splits every solution into
      a position and a direction of freedom.
    explanation: >
      Let a system with coefficient matrix $A$ and constant column $b$ be
      consistent, and let $p = (p_1, \dots, p_n)$ be any one of its solutions —
      a *particular* solution. Then its solution set is exactly the set of
      tuples $p + h$, where $h$ runs over the solutions of the associated
      homogeneous system $[A \mid 0]$.

      Both directions are one line of arithmetic. Suppose $x$ is a solution.
      Look at equation $i$ for $x$ and for $p$ and subtract: the left sides give
      $a_{i1}(x_1 - p_1) + \cdots + a_{in}(x_n - p_n)$ and the right sides give
      $b_i - b_i = 0$. So $h = x - p$ satisfies every homogeneous equation, and
      $x = p + h$. Conversely, if $h$ solves the homogeneous system then
      equation $i$ evaluated at $p + h$ gives
      $a_{i1}(p_1 + h_1) + \cdots + a_{in}(p_n + h_n) = b_i + 0 = b_i$, so
      $p + h$ solves the original.

      Two consequences follow. First, the solution set of a consistent system is
      a *translate* of the solution set of its homogeneous counterpart: the same
      shape, shifted off the origin by any one solution. The coefficients decide
      the shape and the constants decide where it sits. Second, a consistent
      system has a unique solution if and only if its homogeneous counterpart
      has only the trivial solution — because if $h \ne 0$ solved the
      homogeneous system then $p$ and $p + h$ would be two different solutions,
      and conversely two solutions would give a nonzero $h$ as their difference.
      Uniqueness is therefore a question about $A$ alone, and $b$ has no vote
      in it.

      Notice which piece is *not* claimed. The solutions of a consistent
      nonhomogeneous system are not closed under addition: adding two of them
      adds the constants too, and $b_i + b_i$ is not $b_i$ unless $b_i = 0$.
      Differences of solutions are homogeneous; sums of them are nothing in
      particular.
    worked: >
      Solve $x_1 + 2x_2 - x_3 = 4$ and $2x_1 + 4x_2 + x_3 = 5$. The augmented
      rows are $(1, 2, -1 \mid 4)$ and $(2, 4, 1 \mid 5)$, and
      $R_2 \to R_2 - 2R_1$ gives $(0, 0, 3 \mid -3)$, so $x_3 = -1$. The pivots
      lie in columns $1$ and $3$, so $x_2$ is free; put $x_2 = t$, and the first
      row gives $x_1 = 4 - 2t + x_3 = 3 - 2t$. The solution set is every
      $(3 - 2t, t, -1)$, which is $(3, 0, -1) + t(-2, 1, 0)$. Now solve the
      associated homogeneous system, $(1, 2, -1 \mid 0)$ and
      $(2, 4, 1 \mid 0)$: the same operation gives $(0, 0, 3 \mid 0)$, so
      $x_3 = 0$ and $x_1 = -2t$, and its solutions are exactly the tuples
      $t(-2, 1, 0)$. The two answers line up perfectly: a particular solution
      $p = (3, 0, -1)$, which checks since $3 + 0 + 1 = 4$ and $6 + 0 - 1 = 5$,
      plus the whole homogeneous family. Taking $p' = (1, 1, -1)$ instead — the
      $t = 1$ member — gives the same set, since $p' + t(-2,1,0)$ runs through
      the same tuples with the parameter shifted by one.
    pitfalls: >
      The particular solution must genuinely be a solution; starting from a
      plausible guess that fails one equation produces a whole family of
      non-solutions and nothing warns you. The homogeneous part must be the
      *associated* system, with the same coefficients — a different homogeneous
      system describes a different set of directions. And solutions of a
      nonhomogeneous system do not add: $(3, 0, -1)$ and $(1, 1, -1)$ both solve
      $x_1 + 2x_2 - x_3 = 4$, but their sum $(4, 1, -2)$ gives
      $4 + 2 + 2 = 8$, not $4$. It is *differences* of solutions that are
      homogeneous.
    recap: >
      Every solution of a consistent system is one fixed solution plus a
      solution of the associated homogeneous system, so the constants say where
      the solution set sits and the coefficients say what shape it is.
    steps:
      - teach: >
          Change only the constants of a system and the solution set moves
          without changing shape. This theorem says exactly what that means:
          every solution is a fixed one plus something the coefficients allow.
      - teach: >
          Precisely: if the system is consistent and $p$ is any one of its
          solutions, then its solution set is all tuples $p + h$ with $h$
          running over the solutions of the associated homogeneous system.
      - teach: >
          Half the proof is subtraction. If $x$ and $p$ both solve equation $i$,
          subtracting gives
          $a_{i1}(x_1 - p_1) + \cdots + a_{in}(x_n - p_n) = b_i - b_i = 0$, so
          $x - p$ solves the homogeneous system.
      - ask: >
          The tuples $(3, 0, -1)$ and $(1, 1, -1)$ both solve
          $x_1 + 2x_2 - x_3 = 4$, $2x_1 + 4x_2 + x_3 = 5$. Their difference
          solves the associated homogeneous system. What is its first
          coordinate?
        expects: "2"
        hint: >
          Subtract the second tuple from the first, coordinate by coordinate.
        feedback: >
          The difference is $(3 - 1,\ 0 - 1,\ -1 - (-1)) = (2, -1, 0)$, so the
          first coordinate is $2$. It does solve the homogeneous system:
          $2 - 2 - 0 = 0$ and $4 - 4 + 0 = 0$.
      - teach: >
          The other half is addition. If $h$ solves the homogeneous system then
          equation $i$ at $p + h$ gives $b_i + 0 = b_i$, so $p + h$ solves the
          original. Two inclusions, and the description is exact.
      - ask: >
          Which describes the solution set of a consistent system?
        choices:
          - text: >
              All tuples $h$ solving the associated homogeneous system
            feedback: >
              That set contains the zero tuple, which solves the original only
              when all the constants are zero. The description is missing the
              shift by a particular solution.
          - text: >
              All tuples $p + h$, with $p$ one fixed solution and $h$ any
              solution of the associated homogeneous system
            correct: true
            feedback: >
              Every solution has this form, since $x - p$ is homogeneous, and
              every tuple of this form is a solution, since the homogeneous part
              contributes $0$ to each constant. Any solution may serve as $p$.
          - text: >
              All tuples $p + q$, with $p$ and $q$ both solutions
            feedback: >
              Adding two solutions adds the constants too. For
              $x_1 + 2x_2 - x_3 = 4$, the solutions $(3, 0, -1)$ and
              $(1, 1, -1)$ sum to $(4, 1, -2)$, which gives $8$ rather than $4$.
        feedback: >
          One position plus every allowed direction. The particular solution
          says where the set sits, and the homogeneous solutions say which way
          it extends — and any member of the set can play the role of $p$.
      - ask: >
          The tuples $(3, 0, -1)$ and $(1, 1, -1)$ both solve
          $x_1 + 2x_2 - x_3 = 4$. Evaluate that left side at their sum,
          $(4, 1, -2)$. What do you get?
        expects: "8"
        hint: >
          Just substitute; there is nothing subtle in the arithmetic.
        feedback: >
          $4 + 2(1) - (-2) = 4 + 2 + 2 = 8$, and the equation demanded $4$. Each
          solution supplied a $4$, and adding them supplied $8$ — which is why
          sums of solutions are not solutions unless the constants are zero.
      - teach: >
          Two consequences. The solution set is a translate of the homogeneous
          one — same shape, shifted. And the solution is unique exactly when the
          homogeneous system has only the trivial solution, so uniqueness is a
          question about the coefficients alone.

  - node: linear-algebra.systems.intuition-geometry
    hook: >
      Every result of this unit has a picture behind it, and the picture
      explains why the answers come out flat: each equation slices space with a
      plane, and slicing flat things with flat things leaves flat things.
    explanation: >
      In two unknowns, an equation $a x_1 + b x_2 = c$ with $(a, b) \ne (0, 0)$
      describes a line in the plane. So a system in two unknowns is an
      intersection of lines, and there are exactly three pictures. Two lines
      that are not parallel cross at one point — the unique solution. Two
      distinct parallel lines never meet — inconsistent. Two equations
      describing the same line leave that entire line — infinitely many
      solutions. That is the trichotomy, drawn.

      In three unknowns, $a x_1 + b x_2 + c x_3 = d$ with
      $(a, b, c) \ne (0, 0, 0)$ describes a plane, and a system's solution set
      is an intersection of planes. The possibilities are empty, a single point,
      a line, or a whole plane — and nothing else, because intersecting flat
      pieces of space produces flat pieces of space.

      The pattern behind both pictures is the one the rank already told you.
      Each equation cuts one dimension out of the possibilities, provided it
      says something the others did not. The rank counts how many independent
      cuts were actually made, and $n - \rank A$ counts the directions nobody
      cut — the parameters. A consistent system with $\rank A = n$ has had every
      direction removed and leaves a point; one with $\rank A = n - 1$ leaves a
      line; one with $\rank A = n - 2$ leaves a plane.

      This is why a nonempty solution set is always *flat*: a point, a line, a
      plane, or a higher flat piece of $\mathbb{R}^n$. It is never a circle,
      never a curve, and never two isolated points. If a picture of your
      solution set bends anywhere, the equations were not linear.
    worked: >
      Three pairs of lines, all sharing the first equation $2x_1 + x_2 = 4$.
      Pair one adds $x_1 - x_2 = -1$: adding the two equations gives
      $3x_1 = 3$, so $x_1 = 1$ and $x_2 = 2$. Two pivots, $\rank A = 2 = n$, no
      parameters — the two lines cross at the single point $(1, 2)$. Pair two
      adds $4x_1 + 2x_2 = 9$: here $R_2 \to R_2 - 2R_1$ gives $(0, 0 \mid 1)$, a
      contradictory row, so the set is empty. Geometrically the second line has
      the same coefficients doubled and so runs in the same direction, but its
      constant is $9$ rather than $8$ — parallel and distinct, never meeting.
      Pair three adds $4x_1 + 2x_2 = 8$: now $R_2 \to R_2 - 2R_1$ gives
      $(0, 0 \mid 0)$, so $\rank A = 1$ and $n - \rank A = 1$ parameter. The
      second equation is exactly twice the first and describes the same line,
      and the solution set is all of it: every $(t, 4 - 2t)$.
    pitfalls: >
      An equation with every coefficient zero is not a line at all: $0x_1 +
      0x_2 = 0$ is the whole plane and $0x_1 + 0x_2 = 1$ is empty, so the
      picture needs $(a, b) \ne (0, 0)$ before it means anything. Two planes in
      $\mathbb{R}^3$ do not always meet in a line — $x_1 + x_2 + x_3 = 1$ and
      $x_1 + x_2 + x_3 = 2$ are parallel and distinct, and the contradictory row
      elimination produces is exactly that failure written in algebra. And no
      solution set is ever a curve or a pair of isolated points; if that is what
      you have drawn, some equation in the system was not linear.
    recap: >
      Each linear equation is a flat slice — a line in the plane, a plane in
      space — the rank counts how many independent slices were taken, and
      $n - \rank A$ counts the directions left over, which is why the answer is
      always empty or flat.
    steps:
      - teach: >
          In two unknowns, an equation $a x_1 + b x_2 = c$ with $(a,b)$ not both
          zero is a line in the plane. Solving a system means finding where the
          lines meet.
      - teach: >
          There are only three pictures. Two lines that are not parallel cross
          at one point. Two distinct parallel lines never meet. Two equations
          describing the same line leave the whole line. That is the trichotomy,
          drawn.
      - ask: >
          The system $2x_1 + x_2 = 4$, $4x_1 + 2x_2 = 9$ reduces to a row
          $(0, 0 \mid 1)$. What does that say about the two lines?
        choices:
          - text: >
              They are the same line
            feedback: >
              Then every point of it would be a solution and the row would have
              read $(0, 0 \mid 0)$. Doubling the first equation gives constant
              $8$, not $9$, so the two are not the same.
          - text: >
              They are parallel and distinct, so they never meet
            correct: true
            feedback: >
              The second equation's coefficients are twice the first's, so the
              lines run in the same direction; its constant is $9$ rather than
              $8$, so they are different lines. Parallel and distinct means no
              common point, which is what $0 = 1$ records.
          - text: >
              They cross at the origin
            feedback: >
              The origin satisfies neither equation: $2(0) + 0 = 0$, not $4$. A
              contradictory row means there is no crossing point anywhere.
        feedback: >
          A contradictory row is the algebraic signature of two lines that are
          parallel and distinct. Same direction, different position, no
          intersection — and
          elimination reports it as $0$ equalling something nonzero.
      - teach: >
          In three unknowns an equation is a plane, and a system's solution set
          is an intersection of planes. It can be empty, a single point, a line,
          or a whole plane — those four and no others.
      - ask: >
          Two planes in $\mathbb{R}^3$ that are not parallel give a consistent
          system with $n = 3$ and $\rank A = 2$. How many parameters does its
          solution set need?
        expects: "1"
        hint: >
          Count the directions the two equations did not cut.
        feedback: >
          The parameters number $n - \rank A = 3 - 2 = 1$. One parameter traces
          out a line, which is exactly what two non-parallel planes share.
      - teach: >
          The pattern is the rank, seen geometrically. Each equation that says
          something new cuts one dimension out of the possibilities; $\rank A$
          counts the cuts that were genuinely new, and $n - \rank A$ counts the
          directions nobody cut.
      - ask: >
          Which of these can be the solution set of a linear system in three
          unknowns?
        choices:
          - text: >
              A circle lying in some plane
            feedback: >
              A circle bends, and linear equations cannot bend anything. Every
              nonempty solution set is flat, so a circle is out of reach.
          - text: >
              A whole plane
            correct: true
            feedback: >
              This is the case $\rank A = 1$: one genuinely independent
              equation, two free variables, two parameters. A single equation
              like $x_1 + x_2 + x_3 = 1$ does exactly this.
          - text: >
              Two isolated points
            feedback: >
              That would be a system with exactly two solutions, which the
              trichotomy forbids. Two solutions force a free variable, and a
              free variable brings a whole line with it.
        feedback: >
          Empty, a point, a line, or a plane — those are the four. Anything that
          bends or comes in separated pieces is beyond what linear equations can
          describe.
      - teach: >
          So the geometry and the algebra say the same thing twice. Flat slices
          intersected with flat slices give flat answers, which is why the count
          of solutions is never a finite number bigger than one.

  - node: linear-algebra.systems.ex-three-planes
    hook: >
      Three planes in space can miss each other in two quite different ways, and
      only one of them looks like anything is wrong. The other is the standard
      warning against reading a system two equations at a time.
    explanation: >
      Three equations in three unknowns are three planes, and elimination
      reports which configuration you have before you draw anything. Three
      pivots and no free variable: the planes meet in a single point. Two pivots
      and one zero row, so one free variable: they share a common line. One
      pivot and two free variables: all three equations describe the same plane,
      and the solution set is that plane. A row $(0, 0, 0 \mid c)$ with
      $c \ne 0$: empty.

      Emptiness is the case worth dwelling on, because it has more than one
      cause. The obvious one is two of the planes being parallel and distinct;
      then nothing that the third plane does can help, since the first two
      already share no point.

      The instructive one is the triangular prism. Suppose no two of the three
      planes are parallel. Then each *pair* meets in a line, so every pair of
      equations is consistent and any two of them look perfectly healthy
      together. But the three lines of intersection can be parallel to one
      another and distinct — three edges of an infinite prism, with a triangular
      cross-section and no point common to all three planes. Elimination reports
      it as a row $(0, 0, 0 \mid c)$ with $c \ne 0$, the same signature as any
      other inconsistency.

      The moral is worth carrying past this example. Pairwise consistency does
      not imply consistency, so checking equations two at a time can never
      settle a system. And "no solution" is not a synonym for "two of the
      equations are parallel" — the prism has no parallel pair at all.
    worked: >
      Take $x_1 + x_2 = 0$, $x_2 + x_3 = 0$ and $x_1 - x_3 = 1$. No two of the
      coefficient triples $(1, 1, 0)$, $(0, 1, 1)$, $(1, 0, -1)$ is a multiple
      of another, so no two planes are parallel. Check the pairs by eliminating.
      Planes $1$ and $2$: rows $(1, 1, 0 \mid 0)$, $(0, 1, 1 \mid 0)$, with
      $x_3 = t$ free, give $x_2 = -t$ and $x_1 = t$, the line $(t, -t, t)$.
      Planes $2$ and $3$: after an interchange, $(1, 0, -1 \mid 1)$,
      $(0, 1, 1 \mid 0)$ give $x_2 = -t$ and $x_1 = 1 + t$, the line
      $(1 + t, -t, t)$. Planes $1$ and $3$: $R_2 \to R_2 - R_1$ turns
      $(1, 1, 0 \mid 0)$, $(1, 0, -1 \mid 1)$ into
      $(1, 1, 0 \mid 0)$, $(0, -1, -1 \mid 1)$, giving $x_2 = -1 - t$ and
      $x_1 = 1 + t$, the line $(1 + t, -1 - t, t)$. All three lines advance by
      $(1, -1, 1)$ as $t$ increases by $1$, so they are parallel; and they pass
      through $(0, 0, 0)$, $(1, 0, 0)$ and $(1, -1, 0)$ respectively, three
      different points, so they are distinct. A prism. The full system agrees:
      $R_3 \to R_3 - R_1$ gives $(0, -1, -1 \mid 1)$ and then
      $R_3 \to R_3 + R_2$ gives $(0, 0, 0 \mid 1)$ — inconsistent, with every
      pair of equations perfectly solvable.
    pitfalls: >
      Checking a system two equations at a time can never establish consistency,
      as the prism shows: all three pairs there have whole lines of common
      solutions and the three together have none. Inconsistency does not require
      a parallel pair, so scanning the coefficient rows for multiples of one
      another is not a test. And three equations in three unknowns do not
      guarantee a single point — three equations describing the same plane
      produce one pivot, two free variables and a two-parameter answer.
    recap: >
      Three pivots give a point, two give a line, one gives a plane, and a
      contradictory row gives nothing — and the prism shows that nothing can
      happen even when every pair of the three planes meets in a line.
    steps:
      - teach: >
          Three equations in three unknowns are three planes, and elimination
          tells you which configuration you have. The four outcomes are a point,
          a line, a plane, and nothing.
      - teach: >
          Match them to the report. Three pivots and no free variable: a single
          point. Two pivots and one free variable: a common line. One pivot and
          two free variables: all three equations describe the same plane.
      - ask: >
          Three planes in $\mathbb{R}^3$ meet in exactly one point. How many
          pivots does an echelon form of the system have?
        expects: "3"
        hint: >
          A unique solution means no unknown is left free.
        feedback: >
          A single point means no parameters, so $n - \rank A = 0$ and
          $\rank A = 3$: all three unknown columns carry pivots. The constant
          column carries none, or the system would be inconsistent.
      - teach: >
          The fourth outcome, emptiness, has more than one cause. The obvious
          one is two planes parallel and distinct — they already share no point,
          so whatever the third plane does is irrelevant.
      - teach: >
          The instructive one is the triangular prism. No two planes are
          parallel, so each pair meets in a line; but the three lines are
          parallel to one another and distinct, so no point lies on all three
          planes.
      - ask: >
          Three distinct planes share a common line. Their system has $3$
          unknowns; how many free variables does it have?
        expects: "1"
        hint: >
          A line is traced by one parameter.
        feedback: >
          A line needs exactly one parameter, so $n - \rank A = 1$ and
          $\rank A = 2$. The echelon form has two pivots and one zero row — the
          third equation repeated what the first two already said.
      - ask: >
          The system $x_1 + x_2 = 0$, $x_2 + x_3 = 0$, $x_1 - x_3 = 1$ is
          inconsistent, and no two of its planes are parallel. What does that
          establish?
        choices:
          - text: >
              That one of the equations must be a multiple of another
            feedback: >
              None is: the coefficient triples $(1,1,0)$, $(0,1,1)$ and
              $(1,0,-1)$ are pairwise non-proportional, which is exactly why no
              two planes are parallel.
          - text: >
              That pairwise consistency does not imply consistency
            correct: true
            feedback: >
              Each pair of planes meets in a line — $(t, -t, t)$, $(1+t, -t, t)$
              and $(1+t, -1-t, t)$ — so every pair of equations is solvable.
              Those three lines are parallel and distinct, so no point lies on
              all three planes, and elimination returns $(0, 0, 0 \mid 1)$.
          - text: >
              That the system has infinitely many solutions
            feedback: >
              It has none. Each *pair* of equations has infinitely many common
              solutions, which is a different claim and precisely the one that
              makes the example instructive.
        feedback: >
          Checking equations two at a time can never certify a system. Three
          healthy pairs and an empty intersection is exactly what the prism is,
          and no scan for parallel coefficient rows would have caught it.
      - teach: >
          So read the whole echelon form, never a pair of equations. The
          contradictory row is the same signature whatever the geometry behind
          it, and the geometry can be far less obvious than two parallel planes.

  - node: linear-algebra.systems.ex-worked
    hook: >
      Everything in this unit meets in one computation. Solving a system is
      always the same five questions in the same order, and it is worth watching
      them go by once with nothing hidden.
    explanation: >
      A full solve answers five questions, always in this order. Write the
      augmented matrix. Eliminate to an echelon form. Is there a row with zero
      coefficients and a nonzero constant? If not, which columns carry pivots,
      so which unknowns are free? Give the free ones parameters and sweep
      upward.

      Two things a worked example teaches that a list of rules does not. The
      first is what a zero row means. When elimination flattens a row to
      $(0, \dots, 0 \mid 0)$, it is not a failure and not a warning: it is the
      record of an equation that repeated information the others already
      carried. The system was three equations, but only two of them constrained
      anything, and the zero row is the receipt.

      The second is how little separates a solvable system from an unsolvable
      one. The same elimination, run on the same coefficients with one constant
      altered, ends with $(0, \dots, 0 \mid c)$ for a nonzero $c$ instead. Not
      one coefficient changed, so the *shape* the answer would have had — how
      many parameters, which variables are free — is untouched; what changed is
      whether the answer exists. The coefficients decide the shape and the
      constants decide the existence, which is the same division of labour the
      particular-plus-homogeneous description makes.

      Writing the final answer as one tuple plus a parameter times another puts
      that division on the page: the first tuple is a place, the second is a
      direction, and the parameter is the freedom the pivots left behind.
    worked: >
      Solve $x_1 - x_2 + 2x_3 = 5$, $2x_1 - 2x_2 + 3x_3 = 8$,
      $3x_1 - 3x_2 + 4x_3 = 11$. The augmented rows are $(1, -1, 2 \mid 5)$,
      $(2, -2, 3 \mid 8)$, $(3, -3, 4 \mid 11)$. Eliminate:
      $R_2 \to R_2 - 2R_1$ gives $(0, 0, -1 \mid -2)$, and
      $R_3 \to R_3 - 3R_1$ gives $(0, 0, -2 \mid -4)$, and then
      $R_3 \to R_3 - 2R_2$ gives $(0, 0, 0 \mid 0)$. The echelon form is
      $(1, -1, 2 \mid 5)$, $(0, 0, -1 \mid -2)$, $(0, 0, 0 \mid 0)$. No row has
      zero coefficients beside a nonzero constant, so the system is consistent.
      The pivots sit in columns $1$ and $3$, so $x_1$ and $x_3$ are basic and
      $x_2$ is free. Put $x_2 = t$. The second row says $-x_3 = -2$, so
      $x_3 = 2$; the first says $x_1 - t + 4 = 5$, so $x_1 = 1 + t$. The
      solution set is every $(1 + t, t, 2)$, which is
      $(1, 0, 2) + t(1, 1, 0)$. Check $t = 1$, the tuple $(2, 1, 2)$:
      $2 - 1 + 4 = 5$, $4 - 2 + 6 = 8$, $6 - 3 + 8 = 11$. And check the
      direction $(1, 1, 0)$ against the associated homogeneous system:
      $1 - 1 + 0 = 0$, $2 - 2 + 0 = 0$, $3 - 3 + 0 = 0$. Now change one number:
      make the third constant $12$. The same operations give
      $R_3 \to R_3 - 3R_1$ as $(0, 0, -2 \mid -3)$ and then
      $R_3 \to R_3 - 2R_2$ as $(0, 0, 0 \mid 1)$ — inconsistent, with not one
      coefficient altered.
    pitfalls: >
      The number of free variables comes from the pivot positions and never from
      the number of equations: three equations here, and one free variable. A
      zero row is a redundancy, not an inconsistency — reading
      $(0, 0, 0 \mid 0)$ as a contradiction throws away a perfectly good answer.
      And $(1, 0, 2)$ is one member of the solution set, not the solution set;
      the answer owed is the whole family $(1 + t, t, 2)$.
    recap: >
      Reduce, look for a contradictory row, read the pivots to find the free
      variables, parametrise and sweep upward — and write the answer as a place
      plus a direction, because the coefficients fix the shape and the constants
      fix whether it exists.
    steps:
      - teach: >
          Solving a system is a routine, not an inspiration. Write the augmented
          matrix, eliminate, check for a contradictory row, read off the free
          variables, parametrise and sweep upward. Always in that order.
      - teach: >
          Take $x_1 - x_2 + 2x_3 = 5$, $2x_1 - 2x_2 + 3x_3 = 8$,
          $3x_1 - 3x_2 + 4x_3 = 11$. The augmented rows are
          $(1, -1, 2 \mid 5)$, $(2, -2, 3 \mid 8)$, $(3, -3, 4 \mid 11)$.
      - ask: >
          Apply $R_2 \to R_2 - 2R_1$, then $R_3 \to R_3 - 3R_1$, then
          $R_3 \to R_3 - 2R_2$. What is the constant entry of the bottom row?
        expects: "0"
        hint: >
          Work out the two new rows first; they turn out to be proportional.
        feedback: >
          The first operation gives $(0, 0, -1 \mid -2)$ and the second gives
          $(0, 0, -2 \mid -4)$, which is exactly twice it. So
          $R_3 \to R_3 - 2R_2$ leaves $(0, 0, 0 \mid 0)$ and the constant is
          $0$.
      - teach: >
          A zero row is not a failure. It is the receipt for an equation that
          repeated what the others already said: three equations were written,
          only two of them constrained anything, and no contradiction appeared.
      - ask: >
          The echelon form is $(1, -1, 2 \mid 5)$, $(0, 0, -1 \mid -2)$,
          $(0, 0, 0 \mid 0)$, for a system in $3$ unknowns. How many free
          variables are there?
        expects: "1"
        hint: >
          Find the pivot columns among the first three, then subtract.
        feedback: >
          The leading entries lie in columns $1$ and $3$, so $x_1$ and $x_3$ are
          basic and $3 - 2 = 1$ unknown is free, namely $x_2$. The count came
          from the pivots, not from the three equations.
      - teach: >
          Now parametrise and sweep. Put $x_2 = t$; the second row says
          $-x_3 = -2$, so $x_3 = 2$; the first says $x_1 - t + 4 = 5$, so
          $x_1 = 1 + t$. The solution set is every $(1 + t, t, 2)$.
      - ask: >
          Change the third equation's constant from $11$ to $12$ and run exactly
          the same three operations. What is the constant entry of the bottom
          row now?
        expects: "1"
        hint: >
          Only the third row's constant changes, so redo just that arithmetic.
        feedback: >
          $R_3 \to R_3 - 3R_1$ now gives $(0, 0, -2 \mid 12 - 15) =
          (0, 0, -2 \mid -3)$, and $R_3 \to R_3 - 2R_2$ gives
          $(0, 0, 0 \mid -3 + 4) = (0, 0, 0 \mid 1)$. That row reads $0 = 1$, so
          the system is now inconsistent — with not one coefficient altered.
      - teach: >
          So the coefficients fix the shape of the answer and the constants fix
          whether there is one. Writing the family as
          $(1, 0, 2) + t(1, 1, 0)$ puts both on the page: a place, a direction,
          and the freedom the pivots left behind.
      - teach: >
          Answer with the family, never with a member of it. $(1, 0, 2)$ is a
          true remark; $(1 + t, t, 2)$ for every real $t$ is the solution of the
          system.
