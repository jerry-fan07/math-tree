unit: foundations.cardinality
opening: >
  How many elements does a set have? For a finite set you count, and for an
  infinite set counting has nothing to say — so this unit replaces counting with
  pairing: two sets have the same size when their elements can be matched one
  for one. That single move turns "how big is infinity" into a question with
  real answers, and the answers are surprising. The integers, the rationals and
  the algebraic numbers all fit into a single list; the reals do not, by an
  argument of Cantor's that you will run twice and then recognise as one
  technique; and the power set of any set outruns it, so there is no largest
  infinity at all. By the end you should be able to build a bijection to order,
  prove a set countable in three different ways, run a diagonal argument, and
  say exactly what the continuum hypothesis asserts and why nobody will ever
  prove it.
lessons:
  - node: foundations.cardinality.def-equinumerous
    hook: >
      Counting is a finite habit: nobody counts $\mathbb{N}$ and nobody counts
      $\mathbb{R}$, yet those two sets will turn out to have different sizes.
      Pairing is the notion of "same size" that survives the passage to
      infinity, and everything in this unit is built on it.
    explanation: >
      Ask how a shepherd with no numbers checks that every sheep has a pen. He
      walks the flock in and pairs them off: one sheep, one pen. If nothing is
      left over on either side, the two collections match. That test uses no
      arithmetic whatsoever, and it is the whole definition.

      Made precise: sets $A$ and $B$ are *equinumerous*, written $A \approx B$
      or $|A| = |B|$, when there exists a bijection $f : A \to B$. Recall what a
      bijection demands. Injective says no two elements of $A$ land on the same
      element of $B$ — no pen is double-booked. Surjective says every element of
      $B$ is hit — no pen is left empty. Together: a perfect pairing, nothing
      doubled and nothing missed.

      On finite sets this agrees with counting, which is what earns it the name
      "same size". $\{a,b,c\}$ and $\{1,2,3\}$ are equinumerous, and $\{a,b,c\}$
      and $\{1,2\}$ are not, because the pens run out. The payoff is that the
      definition never mentions a number, so it keeps working where there is no
      number to mention. "Do these two infinite sets have the same size?"
      becomes a question you can settle: exhibit a bijection, or prove that
      every function between them fails.

      One asymmetry is worth noticing now, because it governs every proof
      ahead. To establish $A \approx B$ you need *one* bijection, and you are
      free to design it. To establish that $A$ and $B$ are not equinumerous you
      must defeat *every* function from $A$ to $B$ — a far heavier obligation,
      and the reason the uncountability of $\mathbb{R}$ needs a genuine idea
      rather than a failed attempt. A map that happens not to work proves
      nothing at all: $n \mapsto 2n$ from $\mathbb{N}$ to $\mathbb{N}$ is not
      surjective, and yet $|\mathbb{N}| = |\mathbb{N}|$ by the identity.
    worked: >
      Take $A = [0,1]$ and $B = [0,2]$, a segment and one twice as long, and
      define $f : [0,1] \to [0,2]$ by $f(x) = 2x$. First check $f$ lands where
      it should: $0 \le x \le 1$ gives $0 \le 2x \le 2$, so every value is in
      $B$. Injective: if $2x = 2y$ then $x = y$. Surjective: given any $y \in
      [0,2]$, the number $y/2$ satisfies $0 \le y/2 \le 1$, so it lies in $A$,
      and $f(y/2) = y$. All three checks pass, so $f$ is a bijection and $[0,1]
      \approx [0,2]$. The doubled segment has exactly as many points as the
      original, and the pairing that proves it is $x \leftrightarrow 2x$.
    pitfalls: >
      A single map that fails is not evidence of anything: to deny $A \approx B$
      you must rule out *all* bijections, not exhibit one bad candidate. And
      check both halves before calling a map a bijection — $x \mapsto x^{2}$ on
      $\mathbb{R}$ is neither injective nor onto, while $x \mapsto x^{2}$ from
      the non-negative reals to the non-negative reals is both.
    recap: >
      Two sets are the same size when their elements can be paired off with none
      doubled and none missed — a test that needs no numbers, and therefore
      still works when the sets are infinite.
    steps:
      - teach: >
          Counting compares two collections by naming a number for each. That
          method stops dead at infinite sets, so mathematics needs a comparison
          that never names a number at all.
      - teach: >
          Pair the elements instead. Sets $A$ and $B$ are equinumerous, written
          $A \approx B$ or $|A| = |B|$, if there is a bijection $f : A \to B$ —
          nothing doubled, since $f$ is injective, and nothing missed, since $f$
          is surjective.
      - teach: >
          On finite sets this reproduces counting exactly. $\{a,b,c\} \approx
          \{1,2,3\}$ by the obvious matching, and no map $\{a,b,c\} \to \{1,2\}$
          is injective, because the targets run out.
      - ask: >
          How many different bijections are there from $\{a,b,c\}$ to
          $\{1,2,3\}$?
        expects: "6"
        hint: >
          Choose the image of $a$, then of $b$; the image of $c$ is then forced.
        feedback: >
          Six. There are $3$ choices for $f(a)$, then $2$ remaining for $f(b)$,
          and $f(c)$ is whatever is left, so $3 \times 2 \times 1 = 6$. Note the
          definition asks only that *some* bijection exist — here there are six,
          and any one of them settles $|\{a,b,c\}| = 3$.
      - teach: >
          Now take $A = [0,1]$ and $B = [0,2]$ and pair by $f(x) = 2x$. Values
          land in $B$ since $0 \le 2x \le 2$; it is injective since $2x = 2y$
          forces $x = y$; and it is onto since $f(y/2) = y$. A segment and a
          segment twice as long have equally many points.
      - ask: >
          Someone writes down $g : \mathbb{N} \to \mathbb{N}$, $g(n) = 2n$,
          notices it misses every odd number, and concludes that $\mathbb{N}$ is
          somehow bigger than itself. What went wrong?
        choices:
          - text: >
              Nothing — $g$ misses infinitely many values, so the two copies of
              $\mathbb{N}$ really do differ in size
            feedback: >
              They cannot: the identity $\mathbb{N} \to \mathbb{N}$ is a
              bijection, so $|\mathbb{N}| = |\mathbb{N}|$. A conclusion that
              contradicts an exhibited bijection is a conclusion drawn wrongly.
          - text: >
              Equinumerosity asks whether *some* bijection exists, and one map
              that fails rules nothing out
            correct: true
            feedback: >
              Exactly. $g$ is injective but not surjective, so $g$ is not a
              bijection — and that is a fact about $g$, not about
              $\mathbb{N}$. The identity is a bijection, which is all the
              definition requires.
          - text: >
              $g$ is not injective, so it was never a candidate
            feedback: >
              $g$ is injective: $2m = 2n$ forces $m = n$. Its failure is
              surjectivity, and that failure still says nothing about whether
              some other map succeeds.
        feedback: >
          To prove $A \approx B$ you produce one bijection of your choosing. To
          deny it you must defeat every function there is — which is why
          uncountability will take a real argument rather than a failed attempt.
      - teach: >
          Keep that asymmetry in view. Almost every positive result ahead is
          "here is the pairing", and the two negative results — the reals are
          not listable, a power set is not matchable — are the hard theorems of
          the unit.
      - ask: >
          Which of these pairs is *not* shown equinumerous by the map given?
        choices:
          - text: >
              $[0,1]$ and $[0,2]$, by $x \mapsto 2x$
            feedback: >
              This one works: it lands in $[0,2]$, it is injective, and every
              $y$ is hit by $y/2$.
          - text: >
              $\mathbb{R}$ and $\mathbb{R}$, by $x \mapsto x^{2}$
            correct: true
            feedback: >
              Squaring is neither injective on $\mathbb{R}$, since $f(-1) =
              f(1)$, nor surjective onto it, since no square is negative. (The
              two sets are equinumerous — by the identity — but not by this
              map.)
          - text: >
              $\{a,b,c\}$ and $\{1,2,3\}$, by $a \mapsto 2$, $b \mapsto 3$, $c
              \mapsto 1$
            feedback: >
              This is a bijection: three distinct inputs, three distinct
              outputs, and all of $\{1,2,3\}$ covered.
        feedback: >
          Check a candidate in three beats — does it land in the codomain, is it
          injective, is it onto — and only then call it a bijection.

  - node: foundations.cardinality.intuition-proper-subset
    hook: >
      The first infinite set you look at with the pairing definition breaks a
      rule you have believed since childhood: the whole is greater than the
      part. Meeting that failure head-on now is what makes the rest of the unit
      readable.
    explanation: >
      Let $E = \{0, 2, 4, 6, \dots\}$ be the even naturals. It is a proper
      subset of $\mathbb{N}$ — it omits $1$, and infinitely many others. Yet
      $n \mapsto 2n$ pairs $\mathbb{N}$ with $E$ perfectly: distinct $n$ give
      distinct $2n$, and every even number $2k$ is the image of $k$. So
      $\mathbb{N} \approx E$, and throwing away half the naturals left a set of
      exactly the same size.

      Hilbert's hotel tells the same fact as a story. The hotel has rooms $0, 1,
      2, \dots$, one for each natural number, and every room is occupied. A new
      guest arrives. In a finite hotel you turn her away; here you ask each
      occupant of room $n$ to move to room $n+1$. Everybody still has a room,
      nobody shares, and room $0$ is now empty. Infinitely many guests arrive?
      Move the occupant of room $n$ to room $2n$ and hand the newcomers every
      odd-numbered room.

      What has failed is the Euclidean maxim that a part is smaller than the
      whole. The response is not to distrust the pairing definition — it is the
      only definition that survives at all — but to notice *which* sets do this.
      A finite set never can: shifting the occupants of a five-room hotel along
      by one leaves somebody in the corridor. Only infinite sets absorb their
      own proper subsets, so this behaviour is not a paradox but a usable
      criterion for being infinite, and the next lessons will turn it into one.

      One conclusion to refuse, firmly. "Infinite sets can match their proper
      subsets" does not mean "all infinite sets are the same size". Sizes above
      the finite ones will turn out to form a whole ladder; $\mathbb{N}$ and
      $\mathbb{R}$ sit on different rungs.
    worked: >
      Here is the hotel trick performed on $\mathbb{Z}$, evicting the single
      element $0$. Define $f : \mathbb{Z} \to \mathbb{Z} \setminus \{0\}$ by
      $f(k) = k+1$ for $k \ge 0$ and $f(k) = k$ for $k < 0$. Where does it send
      things? The non-negative integers $0, 1, 2, \dots$ go to $1, 2, 3, \dots$,
      and the negative integers stay put. Injective: the two clauses have
      disjoint images, the positives and the negatives, and each clause is
      injective on its own piece. Surjective: a positive $m$ is $f(m-1)$ and a
      negative $m$ is $f(m)$; the value $0$ is never taken, which is exactly
      what was wanted. So $\mathbb{Z} \approx \mathbb{Z} \setminus \{0\}$, and
      deleting an element from an infinite set can leave it the same size.
    pitfalls: >
      The trap this lesson exists to defuse is treating "infinite" as a single
      size — the failure of whole-greater-than-part invites the guess that any
      two infinite sets can be matched, and Cantor's diagonal argument will kill
      that guess outright. A second one: the pairing $n \mapsto 2n$ shows
      $\mathbb{N} \approx E$ and says nothing about $E$ being "half" of
      $\mathbb{N}$ — density and proportion are not cardinality. And note that a
      *finite* set genuinely cannot do this, so the phenomenon is diagnostic
      rather than universal.
    recap: >
      An infinite set can be paired perfectly with a proper subset of itself —
      the whole need not exceed the part — and only infinite sets can.
    steps:
      - teach: >
          The even naturals $E = \{0,2,4,\dots\}$ leave out infinitely many
          numbers, so surely $E$ is smaller than $\mathbb{N}$. Test that against
          the definition rather than against intuition.
      - teach: >
          The map $n \mapsto 2n$ from $\mathbb{N}$ to $E$ is injective, since
          $2m = 2n$ forces $m = n$, and surjective, since every even number
          $2k$ is the image of $k$. So $\mathbb{N} \approx E$. The part is the
          same size as the whole.
      - teach: >
          Hilbert's hotel is the same fact as a story: rooms $0, 1, 2, \dots$,
          all full, and a new guest arrives. Ask the occupant of room $n$ to
          move to room $n+1$. Nobody shares, nobody is homeless, and room $0$ is
          free.
      - ask: >
          Infinitely many new guests now arrive, so every current occupant of
          room $n$ moves to room $2n$. Which room does the guest from room $9$
          end up in?
        expects: "18"
        hint: >
          Apply the rule literally to $n = 9$.
        feedback: >
          Room $18$, since $2 \times 9 = 18$. After the move the occupied rooms
          are exactly the even ones, so all the odd-numbered rooms — infinitely
          many — are free for the newcomers, and no guest has been disturbed
          more than once.
      - ask: >
          What exactly fails in the passage to infinite sets?
        choices:
          - text: >
              The claim that a proper subset must be strictly smaller
            correct: true
            feedback: >
              That is the casualty. $E \subsetneq \mathbb{N}$ and yet $|E| =
              |\mathbb{N}|$; the Euclidean maxim that the whole exceeds the part
              is a theorem about finite sets only.
          - text: >
              The definition of bijection, which needs repair for infinite sets
            feedback: >
              The definition is untouched — injective and surjective mean what
              they always meant, and $n \mapsto 2n$ satisfies both. It is the
              intuition that has to give way, not the definition.
          - text: >
              The claim that two sets can be compared at all
            feedback: >
              Comparison works fine here: the two sets are compared and found
              equal. What broke is only the expectation about which answer that
              comparison gives.
        feedback: >
          Whole-greater-than-part is a finite phenomenon. Everything else — the
          meaning of bijection, of injection, of size — is unchanged.
      - teach: >
          Notice which sets can pull this off. Shift the guests of a five-room
          hotel along by one and somebody is in the corridor. Absorbing a proper
          subset is something only infinite sets manage, and that will shortly
          become the definition of infinite.
      - ask: >
          A reader concludes from all this that any two infinite sets are
          equinumerous. Is that right?
        choices:
          - text: >
              Yes — once a set is infinite there is always room to shuffle, so
              all infinite sets match
            feedback: >
              Room to shuffle inside one set says nothing about matching two
              different ones. You will shortly prove that no map $\mathbb{N}
              \to \mathbb{R}$ is onto, so those two infinite sets do not
              match.
          - text: >
              No — "infinite" is not a size, and different infinite sets can
              have genuinely different cardinalities
            correct: true
            feedback: >
              Right. The lesson of the hotel is that infinite sets behave
              unlike finite ones, not that they all behave alike. $\mathbb{N}$
              and $\mathbb{R}$ will land on different rungs of a whole ladder of
              sizes.
          - text: >
              Yes for subsets of $\mathbb{N}$, no otherwise, and nothing more
              can be said
            feedback: >
              The first half is nearly right — an infinite subset of
              $\mathbb{N}$ is equinumerous with $\mathbb{N}$, which you will
              prove — but a great deal more can be said, and the rest of the
              unit says it.
        feedback: >
          Take exactly this much from the hotel: the part-versus-whole intuition
          is gone, and it has been replaced by pairing, which is a test you can
          actually run.
      - teach: >
          So one infinite set can swallow a proper part of itself and stay the
          same size. Hold on to the pairing, discard the intuition, and treat
          "how big is this infinite set" as a question that still needs
          answering case by case.

  - node: foundations.cardinality.equinumerosity-equivalence
    hook: >
      Before "the cardinality of $A$" can mean anything, same-size has to behave
      like a genuine sameness — otherwise $|A| = |B|$ and $|B| = |C|$ would not
      give $|A| = |C|$, and every countability proof in this unit would collapse.
    explanation: >
      Three facts, each a one-line consequence of something you already know
      about bijections.

      *Reflexive*: $A \approx A$, because the identity map $\mathrm{id}_A$ is a
      bijection. *Symmetric*: if $A \approx B$ then $B \approx A$, because a
      bijection is invertible and its inverse is again a bijection — that is the
      content of the theorem identifying invertible maps with bijective ones.
      *Transitive*: if $A \approx B$ and $B \approx C$ then $A \approx C$,
      because a composite of bijections is a bijection: composing two injections
      gives an injection, composing two surjections gives a surjection, so
      $g \circ f$ has both properties when $f$ and $g$ do.

      Transitivity is the one you will use most often, and it licenses a working
      habit: to show that two awkward sets match, route through a convenient
      third. Nearly every proof ahead does this, with $\mathbb{N}$ as the
      staging post. Symmetry is why you may build the bijection in whichever
      direction is easier — if listing $A$ as a sequence is natural, do that,
      and read the map backwards when you need $A \to \mathbb{N}$.

      A caveat about the words. An equivalence relation lives on a set, and
      there is no set of all sets — Russell's paradox forbids it — so
      equinumerosity is not literally an equivalence relation, and its
      "classes" are not sets. Everything usable survives: the three properties
      hold for all sets $A$, $B$, $C$, and that is exactly what makes "the
      cardinality of $A$" a sensible thing to speak of. What does not survive is
      the temptation to manufacture cardinal numbers as a quotient set, the way
      you built the integers modulo $n$.
    worked: >
      Chain two bijections and read off the composite. Let $E$ be the even
      naturals and $O = \{1,3,5,\dots\}$ the odd ones. First, $f : \mathbb{N}
      \to E$ with $f(n) = 2n$ is a bijection, so $\mathbb{N} \approx E$. Second,
      $g : E \to O$ with $g(m) = m+1$ is a bijection — injective since $m+1 =
      m'+1$ forces $m = m'$, and onto since an odd $2k+1$ is $g(2k)$ — so $E
      \approx O$. Transitivity gives $\mathbb{N} \approx O$, and the composite
      is explicit: $(g \circ f)(n) = g(2n) = 2n+1$. Check it on $n = 6$: $6
      \mapsto 12 \mapsto 13$. Symmetry then hands over the reverse pairing for
      free, $m \mapsto (m-1)/2$, which sends $13$ back to $6$.
    pitfalls: >
      Transitivity needs the *same* middle set: $A \approx B$ and $C \approx D$
      combine into nothing. And the composite must be taken in a legal order —
      $g \circ f$ requires the codomain of $f$ to be the domain of $g$, which is
      why the chain above went $\mathbb{N} \to E \to O$ and not the reverse.
      Finally, resist building a quotient set of "all sets of a given size";
      there is no set for the relation to live on, so the classes are proper
      collections and not objects you may take a quotient by.
    recap: >
      Same-size is reflexive, symmetric and transitive, so cardinality is a
      well-behaved notion and bijections may be chained — even though there is
      no set for the relation to be a relation on.
    steps:
      - teach: >
          If $|A| = |B|$ is to read as an equality, it had better behave like
          one. Three properties are needed, and each falls straight out of a
          fact about bijections you already have.
      - teach: >
          Reflexive: $\mathrm{id}_A$ is a bijection, so $A \approx A$.
          Symmetric: a bijection is invertible and its inverse is a bijection,
          so $A \approx B$ gives $B \approx A$. Transitive: a composite of
          bijections is a bijection, so $A \approx B \approx C$ gives $A \approx
          C$.
      - ask: >
          Which fact about functions is transitivity of $\approx$ actually
          resting on?
        choices:
          - text: >
              That the inverse of a bijection is a bijection
            feedback: >
              That is what gives *symmetry*. Transitivity needs to combine two
              maps into one, which is composition, not inversion.
          - text: >
              That a composite of injections is injective and a composite of
              surjections is surjective
            correct: true
            feedback: >
              Exactly. If $f : A \to B$ and $g : B \to C$ are both bijections
              then $g \circ f$ inherits injectivity from the first fact and
              surjectivity from the second, so it is a bijection $A \to C$.
          - text: >
              That every injection $A \to B$ has a left inverse
            feedback: >
              One-sided inverses are a different result, and they do not
              assemble two bijections into one. Composition is the tool here.
        feedback: >
          Reflexivity uses the identity, symmetry uses inverses, transitivity
          uses composition. Each of the three is one line.
      - teach: >
          Transitivity is the workhorse. To match two awkward sets, route
          through a convenient third — and in this unit the convenient third is
          almost always $\mathbb{N}$.
      - ask: >
          Let $E$ be the even naturals and $O$ the odd ones. Given the
          bijections $f(n) = 2n$ from $\mathbb{N}$ to $E$ and $g(m) = m+1$ from
          $E$ to $O$, what does the composite $g \circ f$ send $6$ to?
        expects: "13"
        hint: >
          Apply $f$ first, then $g$.
        feedback: >
          $13$. Indeed $f(6) = 12$ and $g(12) = 13$, so $(g \circ f)(n) = 2n+1$,
          a bijection $\mathbb{N} \to O$. Symmetry then gives the reverse map
          for free: $m \mapsto (m-1)/2$ sends $13$ back to $6$.
      - teach: >
          Because $\approx$ is symmetric you may build the pairing in whichever
          direction is easier. Listing a set as a sequence indexed by
          $\mathbb{N}$ is usually the easy direction, and reading that list
          backwards costs nothing.
      - ask: >
          Why is it wrong to call $\approx$ an equivalence relation and take its
          quotient?
        choices:
          - text: >
              Because $\approx$ fails transitivity for infinite sets
            feedback: >
              It does not fail: the composite of two bijections is a bijection
              whatever the sets, finite or infinite. The three properties hold
              universally.
          - text: >
              Because a relation lives on a set, and there is no set of all sets
              for this one to live on
            correct: true
            feedback: >
              Right — Russell's paradox rules out a set of all sets, so
              $\approx$ is not a relation in the official sense and its classes
              are not sets. The three properties still hold for all $A$, $B$,
              $C$, which is all that "the cardinality of $A$" needs.
          - text: >
              Because equinumerous sets need not have the same elements
            feedback: >
              Equivalence classes never require equal elements — that is the
              point of them. The obstruction is set-theoretic, not about the
              members.
        feedback: >
          Keep the three properties, drop the quotient construction. Cardinal
          numbers cannot be built here the way the integers modulo $n$ were.
      - teach: >
          With reflexivity, symmetry and transitivity in hand, "$A$ and $B$ have
          the same cardinality" is safe to say and safe to chain. Every later
          proof will silently use all three.

  - node: foundations.cardinality.def-finite
    hook: >
      "Finite" has been used informally for a whole course; here it finally gets
      a definition in terms of pairing alone, and the pigeonhole principle
      supplies the missing guarantee that a set cannot have two different
      numbers of elements.
    explanation: >
      Define a set $A$ to be *finite* if $A \approx \{1, 2, \dots, n\}$ for some
      integer $n \ge 0$. Unpacked, a bijection $\{1,\dots,n\} \to A$ is exactly a
      labelling of the elements of $A$ as $a_1, a_2, \dots, a_n$ with no
      repetition and no omission — it is counting, written as a pairing. The
      case $n = 0$ reads as $A = \emptyset$, matched by the empty function,
      which is vacuously a bijection because there is nothing to check.

      There is a gap to close before writing $|A| = n$. Could the same set be
      matched with $\{1,\dots,5\}$ and also with $\{1,\dots,7\}$? If it could,
      "the number of elements" would be meaningless. Chaining the two bijections
      through $A$ — symmetry, then transitivity — would give a bijection
      $\{1,\dots,7\} \to \{1,\dots,5\}$, in particular an injection from a
      seven-element set into a five-element one, and the pigeonhole principle
      forbids that: two of the seven must collide. So $m \ne n$ is impossible,
      the $n$ is unique, and $|A| = n$ is well defined.

      A set that is not finite is *infinite*. That is a negative definition —
      $\mathbb{N}$ is infinite because no $\{1,\dots,n\}$ can be matched with
      it — and it is deliberately weak: it says nothing about how large the set
      is. The notation $|A|$ is still written for infinite $A$ and still means
      "the size of $A$", compared always through bijections; it is simply no
      longer a natural number, and $|A| = |B|$ continues to abbreviate
      $A \approx B$.
    worked: >
      Take $A = \{x \in \mathbb{Z} : x^{2} \le 5\}$ and settle its cardinality
      from the definition. Which integers qualify? $0, 1, -1, 2, -2$ have
      squares $0, 1, 1, 4, 4$, all at most $5$; and $3$ and $-3$ have square
      $9$, which is too big, as does anything further out. So $A = \{-2, -1, 0,
      1, 2\}$. Now build the bijection: $g : A \to \{1,2,3,4,5\}$ with $g(x) = x
      + 3$ sends $-2, -1, 0, 1, 2$ to $1, 2, 3, 4, 5$ respectively. It is
      injective because $x + 3 = y + 3$ forces $x = y$, and surjective because
      each of $1,\dots,5$ is $x+3$ for the $x = k-3$ in $A$. Hence $A \approx
      \{1,\dots,5\}$, so $A$ is finite and $|A| = 5$ — and by uniqueness there
      is no other $n$ that would have worked.
    pitfalls: >
      The case $n = 0$ is not an oversight to be patched later: $\emptyset$ is
      finite with $|\emptyset| = 0$, and the empty function is the bijection
      that says so. Do not confuse $\emptyset$ with $\{\emptyset\}$, which is
      finite of cardinality $1$. And uniqueness of $n$ is a theorem resting on
      pigeonhole, not a convention — without it, $|A|$ would not be a
      well-defined number at all.
    recap: >
      A set is finite when its elements can be labelled $1$ through $n$ without
      repetition or omission, and pigeonhole is what guarantees that the $n$ is
      not ambiguous.
    steps:
      - teach: >
          Counting a finite set is exactly pairing it with an initial stretch of
          the positive integers. So define: $A$ is finite if $A \approx
          \{1,2,\dots,n\}$ for some integer $n \ge 0$.
      - teach: >
          A bijection $\{1,\dots,n\} \to A$ is a labelling $a_1, \dots, a_n$ of
          the elements of $A$ with nothing repeated and nothing left out. The
          case $n = 0$ means $A = \emptyset$, matched by the empty function.
      - ask: >
          Let $A = \{x \in \mathbb{Z} : x^{2} \le 5\}$. What is $|A|$?
        expects: "5"
        hint: >
          List the integers whose square is at most $5$, negatives included.
        feedback: >
          Five. The qualifying integers are $-2, -1, 0, 1, 2$, since $(\pm 2)^2
          = 4 \le 5$ while $(\pm 3)^2 = 9$ is too large. The bijection $x
          \mapsto x+3$ carries them onto $\{1,2,3,4,5\}$, so $A \approx
          \{1,\dots,5\}$ and $|A| = 5$.
      - teach: >
          One thing has to be checked before $|A| = n$ is even meaningful: that
          a set cannot be matched with $\{1,\dots,5\}$ and with $\{1,\dots,7\}$
          at once. Otherwise its "number of elements" would depend on which
          labelling you happened to use.
      - ask: >
          Which principle rules that out?
        choices:
          - text: >
              The pigeonhole principle
            correct: true
            feedback: >
              Yes. Chaining the two bijections through $A$ would give an
              injection $\{1,\dots,7\} \to \{1,\dots,5\}$, and pigeonhole says
              two of the seven must collide. So no such pair of matchings
              exists, and $n$ is unique.
          - text: >
              The well-ordering principle for $\mathbb{N}$
            feedback: >
              Least elements are not what is at stake. The obstruction is that
              seven things cannot be injected into five slots, which is
              pigeonhole.
          - text: >
              Extensionality
            feedback: >
              Extensionality says which sets are equal, not how many elements
              they have. Uniqueness of $n$ is a counting fact.
        feedback: >
          Uniqueness of $n$ is a theorem, not a convention, and pigeonhole is
          the whole proof of it. That theorem is what licenses the notation
          $|A| = n$.
      - teach: >
          A set that is not finite is *infinite*. That definition is negative
          and deliberately weak — it records only that no $\{1,\dots,n\}$ fits,
          and says nothing about how large the set is.
      - ask: >
          Which of these sets is *not* finite?
        choices:
          - text: >
              $\emptyset$
            feedback: >
              The empty set is finite, with $n = 0$: the empty function is
              vacuously a bijection $\{1,\dots,0\} \to \emptyset$, so
              $|\emptyset| = 0$.
          - text: >
              $\mathcal{P}(\{a,b,c\})$
            feedback: >
              A power set of a three-element set has $8$ elements, which can be
              labelled $1$ through $8$. Finite.
          - text: >
              The set of even natural numbers
            correct: true
            feedback: >
              No $\{1,\dots,n\}$ matches it: for each $n$ the evens contain more
              than $n$ elements, namely $0, 2, \dots, 2n$. So it is infinite —
              and, as you saw, equinumerous with $\mathbb{N}$ itself.
        feedback: >
          Finite means "matched with some $\{1,\dots,n\}$"; infinite means no
          such $n$ exists. Both $\emptyset$ and an eight-element power set clear
          the bar; the evens never will.
      - teach: >
          For infinite $A$ the symbol $|A|$ is still written and still means the
          size of $A$, compared through bijections as always. It is simply no
          longer a natural number.

  - node: foundations.cardinality.finite-pigeonhole
    hook: >
      Hilbert's hotel was a trick only an infinite set can perform. Turn that
      around and you get a positive characterisation of finiteness that never
      mentions a number $n$ at all — and it is the criterion that proves sets
      infinite in one line.
    explanation: >
      The theorem: a set $A$ is finite if and only if every injection $A \to A$
      is surjective; equivalently, if and only if $A$ is not equinumerous with
      any proper subset of itself. A set that *is* equinumerous with a proper
      subset of itself is called *Dedekind-infinite*.

      One direction you already hold. If $A$ is finite, then it is in bijection
      with some $\{1,\dots,n\}$, and on a finite set injective and surjective
      coincide — that is the pigeonhole principle in its "equal size" form. So
      an injection $A \to A$ that missed something would be an injection of $A$
      onto a proper subset, which pigeonhole forbids. Contrapositively, a set
      that can be matched with a proper part of itself cannot be finite, and
      this is the direction you will actually use: exhibit an injection $A \to
      A$ that misses a point, and $A$ is infinite, with no need to reason about
      every $n$.

      The converse — every infinite set is Dedekind-infinite — is harder than it
      looks. To match an infinite $A$ with a proper subset you first extract a
      sequence of distinct elements $a_0, a_1, a_2, \dots$ from $A$ and then
      shift along it, sending $a_i$ to $a_{i+1}$ and fixing everything else,
      which misses $a_0$. The extraction is the delicate part: infinitude
      guarantees that at each stage something is left over to pick, but making
      infinitely many such picks at once is an appeal to a weak form of the
      axiom of choice, and the implication is genuinely not provable in
      $\mathrm{ZF}$ alone. Worth knowing, and never worth worrying about in
      practice.
    worked: >
      First watch the forward direction bite on a finite set. Let $A =
      \{1,2,3,4\}$ and suppose $f : A \to A$ is injective with $f(1) = 3$, $f(2)
      = 1$ and $f(3) = 4$. What is $f(4)$? Injectivity forbids the values $3$,
      $1$ and $4$, which are already used, so $f(4) = 2$ — forced, and the map
      is now surjective, exactly as the theorem promises. No injection of $A$
      into itself can afford to skip a value.

      Now the reverse, used as a test. Take $A = \mathbb{Z}$ and $f(k) = 2k$.
      It is injective, since $2k = 2k'$ gives $k = k'$. It is not surjective: $3$
      is odd, so $3 = 2k$ has no integer solution. So $\mathbb{Z}$ carries an
      injection into itself that is not onto, hence $\mathbb{Z}$ is equinumerous
      with the proper subset of even integers, hence $\mathbb{Z}$ is
      Dedekind-infinite — and therefore infinite. That whole argument is three
      lines and never mentions $\{1,\dots,n\}$.
    pitfalls: >
      The criterion needs the injection to go from $A$ *to $A$*: a map $A \to B$
      that misses points of a larger $B$ says nothing. And "misses a value"
      must be checked, not assumed — $k \mapsto k+1$ on $\mathbb{Z}$ is a
      bijection, so it witnesses nothing, while the same formula on $\mathbb{N}$
      misses $0$ and does the job. Finally, the two directions are not equally
      cheap: the converse quietly uses a form of the axiom of choice, so
      "infinite implies Dedekind-infinite" is not a $\mathrm{ZF}$ theorem.
    recap: >
      Finiteness is exactly the impossibility of matching a set with a proper
      part of itself, so one injection $A \to A$ that skips a value proves $A$
      infinite outright.
    steps:
      - teach: >
          Finiteness was defined by comparison with $\{1,\dots,n\}$, which means
          checking every $n$. There is an equivalent condition that mentions no
          number at all, and it is far easier to apply.
      - teach: >
          The theorem: $A$ is finite if and only if every injection $A \to A$ is
          surjective — equivalently, if and only if $A$ is *not* equinumerous
          with a proper subset of itself. Sets that are equinumerous with a
          proper subset are called Dedekind-infinite.
      - ask: >
          Let $f : \{1,2,3,4\} \to \{1,2,3,4\}$ be injective with $f(1) = 3$,
          $f(2) = 1$ and $f(3) = 4$. What must $f(4)$ be?
        expects: "2"
        hint: >
          Injectivity forbids reusing a value that has already been taken.
        feedback: >
          $f(4) = 2$. The values $3$, $1$ and $4$ are used up, and injectivity
          leaves exactly one legal choice. Notice the consequence: $f$ came out
          surjective without being asked to, which is the forward direction of
          the theorem in miniature.
      - teach: >
          That forcing is the pigeonhole principle: on a finite set, an
          injection has nowhere to hide a gap, so injective and surjective
          coincide. An injection onto a proper subset would be exactly such a
          gap.
      - ask: >
          Which map proves that $\mathbb{Z}$ is infinite?
        choices:
          - text: >
              $k \mapsto k+1$ on $\mathbb{Z}$
            feedback: >
              This is injective but also surjective — every integer $m$ is
              $(m-1)+1$ — so it is a bijection and witnesses nothing. The same
              formula on $\mathbb{N}$ would work, because there it misses $0$.
          - text: >
              $k \mapsto 2k$ on $\mathbb{Z}$
            correct: true
            feedback: >
              Injective, since $2k = 2k'$ forces $k = k'$, and not surjective,
              since $3$ is not $2k$ for any integer $k$. An injection $A \to A$
              that misses a value makes $A$ Dedekind-infinite, hence infinite.
          - text: >
              $k \mapsto k^{2}$ on $\mathbb{Z}$
            feedback: >
              This one is not injective — $(-1)^2 = 1^2$ — so the criterion does
              not apply to it at all. The map must be injective before its
              failure to be onto means anything.
        feedback: >
          The recipe for proving a set infinite: produce an injection from the
          set to itself and point at one value it never takes. Three lines, and
          no reasoning about every $n$.
      - teach: >
          The converse — every infinite set is Dedekind-infinite — is the hard
          direction. You extract distinct elements $a_0, a_1, a_2, \dots$ from
          $A$ and shift along them, sending $a_i$ to $a_{i+1}$ and fixing the
          rest, which misses $a_0$.
      - ask: >
          What is delicate about that extraction?
        choices:
          - text: >
              It might run out of elements after finitely many steps
            feedback: >
              It cannot: at every stage only finitely many elements have been
              taken, and $A$ is infinite, so something is always left. Existence
              at each stage is not the problem.
          - text: >
              It makes infinitely many independent choices at once, which needs
              a weak form of the axiom of choice
            correct: true
            feedback: >
              Exactly. Each stage offers a nonempty set of candidates and no
              rule for picking one; assembling all the picks into a single
              sequence is an appeal to countable choice, and the implication is
              not provable in $\mathrm{ZF}$ alone.
          - text: >
              The shift map is not injective
            feedback: >
              The shift is perfectly injective: distinct $a_i$ go to distinct
              $a_{i+1}$, and the points left fixed are distinct from those. Its
              only feature is that it misses $a_0$.
        feedback: >
          Existence at each stage is free; making all the choices at once is
          not. This is the first of two places in the unit where a choice
          principle is doing invisible work.
      - teach: >
          Keep the usable half in your pocket: one injection of a set into
          itself that skips a value, and the set is infinite. The hotel was the
          first example, and $k \mapsto 2k$ on $\mathbb{Z}$ is the second.

  - node: foundations.cardinality.def-countable
    hook: >
      This is the word the rest of the unit is about. "Countable" names the
      smallest kind of infinity — the sets you can write out as a list — and
      almost every set you have met so far turns out to be one.
    explanation: >
      Throughout, $\mathbb{N} = \{0, 1, 2, \dots\}$. A set $A$ is *countably
      infinite* (or denumerable) if $A \approx \mathbb{N}$; it is *countable* if
      it is finite or countably infinite; and *uncountable* otherwise.
      $\mathbb{N}$ is itself countably infinite, the identity serving as the
      bijection.

      The reason this definition is workable is a translation. A bijection $f :
      \mathbb{N} \to A$ is the same thing as a listing $a_0, a_1, a_2, \dots$ of
      the elements of $A$, where $a_n = f(n)$. Injectivity says no element
      appears twice on the list; surjectivity says none is left off. So
      "countably infinite" and "the elements can be written out as an infinite
      sequence with no repetitions and no omissions" say exactly the same thing,
      and from here on you may build either object and claim the other.

      That is why countability is so often provable: you are not asked for a
      clever structural map, only for a plan that visits every element of $A$
      exactly once and never gets stuck. The cardinality of a countably infinite
      set is written $\aleph_0$ — the first letter of the Hebrew alphabet, and
      the smallest infinite size there is.

      A note on usage before it trips you: here every finite set is countable,
      because the definition offers finite-or-denumerable. Some authors reserve
      "countable" for the infinite case, so when you read a theorem elsewhere,
      check which convention is in force before applying it to $\emptyset$.
    worked: >
      Let $S = \{0, 1, 4, 9, 16, \dots\}$ be the set of perfect squares, a
      proper subset of $\mathbb{N}$. Claim: $S$ is countably infinite. Take $f :
      \mathbb{N} \to S$ with $f(n) = n^{2}$. It is injective on $\mathbb{N}$
      because $m^{2} = n^{2}$ with $m, n \ge 0$ forces $m = n$; it is surjective
      onto $S$ because every element of $S$ is by definition $n^{2}$ for some
      $n \in \mathbb{N}$. So $f$ is a bijection and $S \approx \mathbb{N}$,
      giving $|S| = \aleph_0$. Read as a listing, it is $a_0 = 0$, $a_1 = 1$,
      $a_2 = 4$, $a_3 = 9$, $a_4 = 16$, $a_5 = 25$ — every square appears, each
      exactly once, and $25$ sits at index $5$. The squares thin out
      dramatically inside $\mathbb{N}$, and it costs them nothing in size.
    pitfalls: >
      A listing that repeats is not a bijection: $0, 0, 1, 1, 2, 2, \dots$ hits
      every natural number but is not injective, so on the definition as stated
      it does not by itself establish $A \approx \mathbb{N}$. Sparseness is not
      smallness either — the squares and the primes are as numerous as
      $\mathbb{N}$ itself. And "countable" here includes the finite sets,
      $\emptyset$ among them, so a theorem concluding "countable" is not
      promising you an infinite set.
    recap: >
      A set is countable when its elements can be arranged in one list indexed
      by $\mathbb{N}$ — possibly a finite one — and a bijection with
      $\mathbb{N}$ is nothing but such a list with no repeats and no gaps.
    steps:
      - teach: >
          Fix the convention $\mathbb{N} = \{0,1,2,\dots\}$. A set $A$ is
          countably infinite if $A \approx \mathbb{N}$, countable if it is
          finite or countably infinite, and uncountable if it is neither.
      - teach: >
          The useful translation: a bijection $f : \mathbb{N} \to A$ is exactly
          a listing $a_0, a_1, a_2, \dots$ of $A$ with $a_n = f(n)$. Injective
          means no element listed twice; surjective means none left out.
      - teach: >
          So to prove a set countably infinite you never have to invent a
          structural map. You describe a plan that visits every element exactly
          once and never stalls. The size of such a set is written $\aleph_0$.
      - ask: >
          Let $S$ be the set of perfect squares, listed by $a_n = n^{2}$ from
          $a_0 = 0$ onwards. What is $a_7$?
        expects: "49"
        hint: >
          The listing is just $n \mapsto n^{2}$, indexed from $0$.
        feedback: >
          $a_7 = 7^{2} = 49$. The listing runs $0, 1, 4, 9, 16, 25, 36, 49,
          \dots$; every square appears and none appears twice, so $n \mapsto
          n^{2}$ is a bijection $\mathbb{N} \to S$ and $|S| = \aleph_0$.
      - teach: >
          Dwell on that. The squares are vanishingly sparse in $\mathbb{N}$ —
          only ten of them below $100$ — and they are still exactly as numerous
          as $\mathbb{N}$. Thinness on the number line is not smallness in
          cardinality.
      - ask: >
          Which of these does *not* show that a set $A$ is countably infinite?
        choices:
          - text: >
              A listing $a_0, a_1, a_2, \dots$ of $A$ in which every element
              appears exactly once
            feedback: >
              This is precisely a bijection $\mathbb{N} \to A$ written as a
              sequence, so it does the job.
          - text: >
              A listing $a_0, a_1, a_2, \dots$ of $A$ in which some elements
              appear more than once
            correct: true
            feedback: >
              Such a listing is a surjection but not an injection, so it is not
              a bijection and the definition as stated is not met. (A repeating
              listing *will* be shown to suffice — but that is a theorem, and
              you do not have it yet.)
          - text: >
              A bijection $g : A \to \mathbb{N}$
            feedback: >
              Its inverse is a bijection $\mathbb{N} \to A$, and symmetry of
              $\approx$ lets you use whichever direction is convenient.
        feedback: >
          Right now the definition demands a perfect pairing: every element
          once, no element twice. Loosening that is the business of the next
          few lessons.
      - ask: >
          Is $\emptyset$ countable?
        choices:
          - text: >
              Yes — it is finite, and countable means finite or countably
              infinite
            correct: true
            feedback: >
              Correct on the convention used here. Some authors reserve
              "countable" for the infinite case, so when you import a theorem
              from elsewhere, check which convention it assumes.
          - text: >
              No — there is no listing of its elements
            feedback: >
              The empty listing is a perfectly good listing of no elements, and
              in any case $\emptyset$ qualifies as countable simply by being
              finite.
          - text: >
              Only if you also assume the axiom of choice
            feedback: >
              No choice principle is anywhere near this. $\emptyset$ is finite,
              and finite sets are countable by definition.
        feedback: >
          Countable here means finite or denumerable, $\emptyset$ included — so
          a theorem that concludes "countable" is not promising you an infinite
          set.

  - node: foundations.cardinality.subset-of-countable
    hook: >
      Cut a countable set down as savagely as you like and it stays countable —
      and if what is left is infinite, it is still a full copy of $\mathbb{N}$.
      There is nothing strictly between finite and $\aleph_0$.
    explanation: >
      Claim: every subset of a countable set is countable, and every infinite
      subset of a countably infinite set is countably infinite. Since any
      countable set can be transported to $\mathbb{N}$ along a bijection, it is
      enough to handle an infinite $S \subseteq \mathbb{N}$ and produce a
      bijection $\mathbb{N} \to S$.

      Do the obvious thing: list $S$ in increasing order. Written as a
      recursion, $f(0) = \min S$ and $f(n+1) = \min (S \setminus \{f(0), \dots,
      f(n)\})$. Every minimum called for actually exists, because the set in
      question is a nonempty subset of $\mathbb{N}$ — nonempty exactly because
      $S$ is infinite and only finitely many elements have been removed — and
      the well-ordering principle hands least elements to nonempty subsets of
      $\mathbb{N}$.

      Two checks finish it. The sequence is strictly increasing, since each new
      value is drawn from a set that excludes all earlier ones and any smaller
      candidate would have been chosen sooner; strictly increasing forces
      injective. For surjectivity, a strictly increasing sequence of naturals
      starting at $f(0) \ge 0$ satisfies $f(n) \ge n$ for every $n$ — each step
      raises the value by at least one. So given $s \in S$, the value $s$ must
      already have appeared among $f(0), \dots, f(s)$. Suppose it had not.
      Then $s$ is still an unused candidate at stage $s$, so $f(s)$, being the
      minimum of what remains, satisfies $f(s) \le s$; together with $f(s) \ge
      s$ that forces $f(s) = s$, and $s$ is listed after all. Hence $f$ is onto
      $S$.

      The consequence to remember is a dichotomy. A subset of $\mathbb{N}$ is
      finite, or it is in bijection with all of $\mathbb{N}$. Nothing sits in
      between.
    worked: >
      Run the recursion on $S = \{2, 3, 5, 7, 11, 13, \dots\}$, the primes,
      which is an infinite subset of $\mathbb{N}$. Then $f(0) = \min S = 2$;
      $f(1) = \min(S \setminus \{2\}) = 3$; $f(2) = \min(S \setminus \{2,3\}) =
      5$; $f(3) = 7$; $f(4) = 11$; $f(5) = 13$. The listing is the primes in
      increasing order, which is what "list it in increasing order" always
      produces. Check $f(n) \ge n$ on these values: $2 \ge 0$, $3 \ge 1$, $5 \ge
      2$, $7 \ge 3$, $11 \ge 4$, $13 \ge 5$. So to find where the prime $13$
      sits you need only look at $f(0), \dots, f(13)$, and it turns up at index
      $5$. The primes are therefore countably infinite: $|S| = \aleph_0$, and
      $\mathbb{N}$ has been matched with a very thin part of itself once more.
    pitfalls: >
      The recursion needs $S$ infinite: on a finite $S$ it runs out of elements
      and $\min$ is applied to $\emptyset$, which is why the finite case is
      stated separately rather than proved this way. Ordering by size is
      essential — an arbitrary listing of $S$ need not be increasing and the
      argument $f(n) \ge n$ would collapse. And the dichotomy is about subsets
      of a *countable* set; it says nothing about subsets of $\mathbb{R}$,
      where sets of many sizes live.
    recap: >
      Enumerating an infinite subset of $\mathbb{N}$ in increasing order is
      already a bijection with $\mathbb{N}$, so a countable set has no subset
      that is anything other than finite or countably infinite.
    steps:
      - teach: >
          Take an infinite $S \subseteq \mathbb{N}$ and ask for a bijection
          $\mathbb{N} \to S$. Every countable set transports to $\mathbb{N}$
          along a bijection, so this one case settles the general claim.
      - teach: >
          List $S$ in increasing order: $f(0) = \min S$, and $f(n+1) = \min(S
          \setminus \{f(0),\dots,f(n)\})$. Each minimum exists because the set
          being minimised is a nonempty subset of $\mathbb{N}$, and the
          well-ordering principle supplies least elements.
      - ask: >
          Where does the hypothesis that $S$ is *infinite* actually get used?
        choices:
          - text: >
              To guarantee that $S \setminus \{f(0),\dots,f(n)\}$ is nonempty at
              every stage, so the minimum exists
            correct: true
            feedback: >
              Exactly. Only finitely many elements have been removed, so an
              infinite $S$ always has more; on a finite $S$ the recursion
              eventually asks for the minimum of $\emptyset$ and stops.
          - text: >
              To make $f$ injective
            feedback: >
              Injectivity comes from strict increase, which holds however long
              the recursion runs. Infinitude is what keeps it running.
          - text: >
              To apply the well-ordering principle
            feedback: >
              Well-ordering applies to any nonempty subset of $\mathbb{N}$,
              finite or infinite. What infinitude supplies is the
              *nonemptiness* at each stage.
        feedback: >
          The recursion is a machine that needs fuel at every step, and
          infinitude is the fuel. That is also why the finite case is stated
          separately rather than squeezed through this proof.
      - teach: >
          The sequence is strictly increasing, hence injective. For
          surjectivity, note that a strictly increasing sequence of naturals
          satisfies $f(n) \ge n$: each step adds at least one. So any $s \in S$
          must already have been listed by index $s$.
      - ask: >
          Run the recursion on the set of primes. With $f(0) = 2$, what is
          $f(5)$?
        expects: "13"
        hint: >
          The recursion just lists the set in increasing order, starting at
          index $0$.
        feedback: >
          $13$. The values are $f(0)=2$, $f(1)=3$, $f(2)=5$, $f(3)=7$, $f(4)=11$,
          $f(5)=13$ — the primes in increasing order. So the primes are
          countably infinite, another thin subset of $\mathbb{N}$ that is the
          same size as all of it.
      - teach: >
          The headline consequence is a dichotomy: a subset of $\mathbb{N}$ is
          finite, or it is in bijection with the whole of $\mathbb{N}$. Between
          the finite sizes and $\aleph_0$ there is nothing at all.
      - ask: >
          Which conclusion does this proposition *not* support?
        choices:
          - text: >
              The set of primes is countably infinite
            feedback: >
              It does support this: the primes form an infinite subset of
              $\mathbb{N}$, so they are countably infinite.
          - text: >
              Every infinite subset of $\mathbb{R}$ is countably infinite
            correct: true
            feedback: >
              The dichotomy is about subsets of a *countable* set, and
              $\mathbb{R}$ will turn out not to be one — so nothing proved here
              applies to its infinite subsets.
          - text: >
              A subset of a countable set is never uncountable
            feedback: >
              It does support this: every subset of a countable set is
              countable, so no subset of one can be uncountable.
        feedback: >
          Shrinking a countable set can only produce something finite or
          countably infinite. Read the hypothesis before exporting the
          conclusion to sets that were never countable.

  - node: foundations.cardinality.countability-criteria
    hook: >
      Building an exact bijection with $\mathbb{N}$ is fiddly work, and after
      this lesson you will almost never have to. Two much sloppier objects — an
      injection into $\mathbb{N}$, or a list that is allowed to repeat itself —
      do the same job.
    explanation: >
      Three statements about a set $A$: (i) $A$ is countable; (ii) there is an
      injection $A \to \mathbb{N}$; (iii) there is a surjection $\mathbb{N} \to
      A$, that is, $A$ can be listed as $a_0, a_1, a_2, \dots$ with repetitions
      allowed. Then (i) and (ii) are equivalent always, and all three are
      equivalent whenever $A \ne \emptyset$.

      Why (ii) gives (i) is where the previous result earns its keep. An
      injection $g : A \to \mathbb{N}$ is a bijection from $A$ onto its image
      $g(A)$, which is a subset of $\mathbb{N}$ and therefore countable; so $A$
      is equinumerous with a countable set and is countable. The reverse
      direction is immediate: compose the bijection $A \to \{1,\dots,n\}$ or $A
      \to \mathbb{N}$ with an injection into $\mathbb{N}$.

      The repeating list is the same idea run backwards. Given a surjection with
      repetitions, define $g(a)$ to be the *least* $n$ with $a_n = a$ — the
      well-ordering principle supplies that least index, and distinct elements
      have distinct first appearances, so $g : A \to \mathbb{N}$ is injective.
      Going the other way, a bijection is already a surjection, and a finite set
      is listed by naming its elements and then repeating the first one forever.
      The empty set is the sole exception, for the silly reason that there is no
      function at all from $\mathbb{N}$ to $\emptyset$.

      Two consequences get used constantly, and they are worth memorising in
      this shape: a set that injects into a countable set is countable, and the
      image of a countable set under any function is countable. Almost every
      countability proof in the rest of the unit is one of those two sentences
      applied to a well-chosen map.
    worked: >
      Let $T = \{1, 2, 4, 8, 16, \dots\} \cup \{1, 3, 9, 27, \dots\}$, the
      powers of $2$ together with the powers of $3$. Rather than sorting $T$,
      just interleave: define $a_{2k} = 2^{k}$ and $a_{2k+1} = 3^{k}$, giving the
      listing $1, 1, 2, 3, 4, 9, 8, 27, 16, 81, \dots$. Every element of $T$
      appears somewhere, so this is a surjection $\mathbb{N} \to T$ — and $T$ is
      nonempty, so criterion (iii) applies and $T$ is countable.

      Now extract the injection the proof promises, $g(a) = $ the least index at
      which $a$ appears. Reading off the listing: $g(1) = 0$, because $1$ first
      appears at index $0$ and its second appearance at index $1$ is discarded;
      $g(2) = 2$; $g(3) = 3$; $g(4) = 4$; $g(9) = 5$; $g(8) = 6$. Distinct
      elements have distinct first appearances, so $g$ is injective, and $T$
      injects into $\mathbb{N}$ exactly as criterion (ii) requires.
    pitfalls: >
      The directions are not interchangeable, and swapping them is the standard
      error. A surjection $A \to \mathbb{N}$ says $A$ is at least as big as
      $\mathbb{N}$ and leaves it possibly far bigger; an injection $\mathbb{N}
      \to A$ says the same thing. What proves countability is an injection *into*
      $\mathbb{N}$ or a surjection *from* $\mathbb{N}$ — the arrows point the
      other way. Note also that (iii) fails for $A = \emptyset$ purely for want
      of any function into the empty set, so nonemptiness is a real hypothesis
      even though it is a trivial one.
    recap: >
      To prove a set countable, injecting it into $\mathbb{N}$ or listing it
      with repetitions allowed is enough — no exact bijection is ever required.
    steps:
      - teach: >
          Exhibiting a bijection with $\mathbb{N}$ means hitting every element
          exactly once, and dodging duplicates is usually the hardest part of
          the work. Two weaker objects turn out to suffice.
      - teach: >
          For any $A$: $A$ is countable if and only if there is an injection $A
          \to \mathbb{N}$. And if $A$ is nonempty, both are equivalent to having
          a surjection $\mathbb{N} \to A$ — a listing $a_0, a_1, \dots$ of $A$
          with repetitions allowed.
      - teach: >
          The injection case rests on the previous result. An injection $g : A
          \to \mathbb{N}$ is a bijection onto its image, the image is a subset of
          $\mathbb{N}$, and every subset of $\mathbb{N}$ is countable. So $A$ is
          countable.
      - ask: >
          List $T$ = powers of $2$ and powers of $3$ by $a_{2k} = 2^{k}$,
          $a_{2k+1} = 3^{k}$, giving $1, 1, 2, 3, 4, 9, 8, 27, \dots$ indexed
          from $0$. The proof turns this into an injection by sending each
          element to its *least* index. What is the index assigned to $9$?
        expects: "5"
        hint: >
          Write out $a_0$ through $a_5$ and find the first place $9$ occurs.
        feedback: >
          Index $5$. The listing runs $a_0 = 1$, $a_1 = 1$, $a_2 = 2$, $a_3 =
          3$, $a_4 = 4$, $a_5 = 9$, so $9$ first appears at index $5$. The
          duplicate $1$ at index $1$ is discarded by the "least" rule, and that
          is exactly how a repeating list becomes an injection.
      - teach: >
          The well-ordering principle is what makes that rule legal: the set of
          indices where a given element appears is a nonempty subset of
          $\mathbb{N}$, so it has a least member, and distinct elements first
          appear in distinct places.
      - ask: >
          Which of these actually proves that a nonempty set $A$ is countable?
        choices:
          - text: >
              A surjection $A \to \mathbb{N}$
            feedback: >
              Wrong direction. A surjection $A \to \mathbb{N}$ puts a floor
              under $A$ — at least $\aleph_0$ elements — and no ceiling at all.
              Countability is a ceiling, and this map supplies none.
          - text: >
              An injection $\mathbb{N} \to A$
            feedback: >
              Also wrong direction: this only says $A$ has at least $\aleph_0$
              elements. The inclusion $\mathbb{N} \to \mathbb{R}$ is such an
              injection.
          - text: >
              An injection $A \to \mathbb{N}$
            correct: true
            feedback: >
              Yes — $A$ is then in bijection with a subset of $\mathbb{N}$, and
              every subset of $\mathbb{N}$ is countable. The other admissible
              object is a surjection $\mathbb{N} \to A$, the listing with
              repetitions.
        feedback: >
          Countability is proved by squeezing $A$ *into* $\mathbb{N}$ or
          covering it *from* $\mathbb{N}$. Maps in the opposite directions
          bound $A$ from below and prove nothing.
      - teach: >
          Two consequences carry the rest of the unit: a set that injects into a
          countable set is countable, and the image of a countable set under any
          function is countable. Nearly every proof ahead is one of those
          sentences plus a well-chosen map.
      - ask: >
          Why does the equivalence with (iii) need $A \ne \emptyset$?
        choices:
          - text: >
              Because there is no function at all from $\mathbb{N}$ to
              $\emptyset$, so no surjection either
            correct: true
            feedback: >
              Right, and that is the whole of it. $\emptyset$ is countable and
              injects into $\mathbb{N}$ by the empty function, but nothing maps
              onto it, so (iii) alone fails for a trivial reason.
          - text: >
              Because $\emptyset$ is not countable
            feedback: >
              $\emptyset$ is countable — it is finite. The failure is only in
              criterion (iii).
          - text: >
              Because the least-index construction needs $A$ to be infinite
            feedback: >
              The least-index construction is fine on finite nonempty sets; a
              finite set is listed by naming its elements and then repeating the
              first forever. Emptiness is the only obstruction.
        feedback: >
          One genuinely empty edge case, and no others. Everywhere else the
          three criteria may be used interchangeably.

  - node: foundations.cardinality.z-countable
    hook: >
      Here is the first set that looks bigger than $\mathbb{N}$ — it stretches
      infinitely in both directions — and the first explicit bijection you will
      write to prove it is not.
    explanation: >
      The trouble with listing $\mathbb{Z}$ is that there is no natural place to
      start. Beginning at $0$ and walking upwards never reaches $-1$; beginning
      at some negative number is impossible, because there is no least integer.
      The fix is to refuse to walk in one direction at all and alternate
      instead: $0, -1, 1, -2, 2, -3, 3, \dots$. Every integer appears in this
      list, and each appears once, because an integer $k$ is reached as soon as
      the listing has passed $\lvert k \rvert$ in size.

      Write the listing as a formula. Define $f : \mathbb{N} \to \mathbb{Z}$ by
      $f(n) = n/2$ when $n$ is even and $f(n) = -(n+1)/2$ when $n$ is odd. Both
      clauses produce integers, since the numerator is even in the first case
      and $n+1$ is even in the second. The even indices $0, 2, 4, 6, \dots$
      produce $0, 1, 2, 3, \dots$, and the odd indices $1, 3, 5, \dots$ produce
      $-1, -2, -3, \dots$. Between them the two clauses cover every integer
      exactly once — the non-negatives from the evens, the negatives from the
      odds, and no overlap because no integer is both.

      The inverse is just as explicit, which is the cleanest proof that $f$ is a
      bijection: send $k \ge 0$ to $2k$, and $k < 0$ to $-2k-1$. Check that these
      compose to the identity in both directions and the pairing is verified
      with no appeal to any theorem.

      What deserves a pause is the conclusion. $\mathbb{N}$ is a proper subset
      of $\mathbb{Z}$, and $\mathbb{Z}$ is in a real sense two copies of
      $\mathbb{N}$ laid end to end, and $|\mathbb{N}| = |\mathbb{Z}|$ all the
      same. Doubling a countably infinite set costs nothing.
    worked: >
      Tabulate the first eight values: $f(0) = 0$, $f(1) = -1$, $f(2) = 1$,
      $f(3) = -2$, $f(4) = 2$, $f(5) = -3$, $f(6) = 3$, $f(7) = -4$. Each
      integer of small size has turned up exactly once, as promised.

      Now run it backwards. Where is $-7$ in this list? It is negative, so the
      inverse formula applies: $-2(-7) - 1 = 14 - 1 = 13$. Check directly: $13$
      is odd, so $f(13) = -(13+1)/2 = -7$. And where is $6$? It is non-negative,
      so the index is $2 \times 6 = 12$; check: $12$ is even, so $f(12) = 12/2 =
      6$. The bijection is fully computable in both directions, which is as
      concrete as an equality of cardinalities ever gets: $|\mathbb{Z}| =
      \aleph_0$.
    pitfalls: >
      Do not try to list $\mathbb{Z}$ by taking all the non-negatives first and
      the negatives afterwards — that assigns no index at all to $-1$, since the
      first phase never terminates. Any listing must reach each element after
      *finitely* many steps. And check that a formula like $-(n+1)/2$ really
      returns an integer on the indices where it is used; a "bijection" whose
      values leave the codomain is not a function into $\mathbb{Z}$ at all.
    recap: >
      Alternating between the non-negatives and the negatives lists every
      integer exactly once, so $\mathbb{Z}$ is countably infinite despite
      running off to infinity in two directions.
    steps:
      - teach: >
          $\mathbb{Z}$ has no least element, so no listing can simply start at
          the bottom and climb. Starting at $0$ and going up is no better: that
          list never gets round to $-1$.
      - teach: >
          Alternate instead: $0, -1, 1, -2, 2, -3, 3, \dots$. Every integer $k$
          shows up once the list has worked out to size $\lvert k \rvert$, so
          every integer shows up after finitely many steps.
      - teach: >
          As a formula, $f(n) = n/2$ for even $n$ and $f(n) = -(n+1)/2$ for odd
          $n$. Even indices deliver $0, 1, 2, \dots$ and odd indices deliver
          $-1, -2, -3, \dots$, so between them every integer is produced exactly
          once.
      - ask: >
          In this enumeration, indexed from $n = 0$, what index does the integer
          $-7$ receive?
        expects: "13"
        hint: >
          Negative integers sit at odd indices; the inverse rule sends $k < 0$
          to $-2k-1$.
        feedback: >
          Index $13$. The inverse formula gives $-2(-7) - 1 = 14 - 1 = 13$, and
          checking forwards, $13$ is odd so $f(13) = -(13+1)/2 = -7$. The
          negatives occupy the odd indices in order: $-1$ at $1$, $-2$ at $3$,
          $-3$ at $5$, and so on.
      - ask: >
          What is $f(12)$?
        expects: "6"
        hint: >
          $12$ is even, so use the first clause.
        feedback: >
          $f(12) = 12/2 = 6$. Even indices carry the non-negative integers in
          order, so $k \ge 0$ sits at index $2k$ — and together with the odd
          indices carrying the negatives, that is a complete and
          non-overlapping account of $\mathbb{Z}$.
      - teach: >
          Because the inverse is written down explicitly — $k \ge 0$ to $2k$,
          and $k < 0$ to $-2k-1$ — the bijection needs no theorem to certify it.
          Two formulas that undo each other are all the proof there is.
      - ask: >
          Why does "list all the non-negative integers first, then all the
          negative ones" fail to be an enumeration of $\mathbb{Z}$?
        choices:
          - text: >
              Because the negatives are more numerous than the non-negatives
            feedback: >
              They are not — each of those two sets is countably infinite, and
              they are equinumerous with each other. The problem is the order,
              not the quantity.
          - text: >
              Because no index in $\mathbb{N}$ is ever assigned to $-1$: the
              first phase never finishes
            correct: true
            feedback: >
              Exactly. A listing is a function on $\mathbb{N}$, so every element
              must arrive at some finite index. Concatenating an infinite list
              with another one strands everything in the second.
          - text: >
              Because $f$ would fail to be injective
            feedback: >
              Injectivity is not the issue — nothing is listed twice. The
              failure is surjectivity: infinitely many integers get no index at
              all.
        feedback: >
          Every enumeration argument in this unit obeys the same rule: each
          element must be reached in finitely many steps. Interleaving obeys it;
          concatenation does not.
      - teach: >
          So $\mathbb{Z}$ properly contains $\mathbb{N}$, amounts to two copies
          of it end to end, and has exactly the same cardinality. Doubling a
          countably infinite set is free.

  - node: foundations.cardinality.nxn-countable
    hook: >
      This is the manoeuvre almost every later countability proof reduces to: an
      infinite two-dimensional grid can be walked through in a single line,
      provided you walk it the right way.
    explanation: >
      $\mathbb{N} \times \mathbb{N}$ is the infinite grid of pairs $(m,n)$. The
      naive plan is to list it row by row — all of row $0$, then all of row $1$
      — and it fails for the reason concatenation always fails: row $0$ is
      infinite, so row $1$ never starts, and $(1,0)$ receives no index.

      Sweep by diagonals instead. Group the pairs by the value of $m + n$. For
      each $d$, there are exactly $d+1$ pairs with $m + n = d$, namely $(d,0),
      (d-1,1), \dots, (0,d)$ — a *finite* group. That is the load-bearing fact:
      finitely many pairs per diagonal means each diagonal is exhausted in
      finitely many steps, so the listing $(0,0)$; $(1,0), (0,1)$; $(2,0),
      (1,1), (0,2)$; $(3,0), (2,1), (1,2), (0,3)$; and onwards reaches every
      pair after a finite wait, and reaches each exactly once.

      That listing has a formula. Counting from index $0$, all the pairs on
      diagonals $0$ through $d-1$ come first, and there are $1 + 2 + \cdots + d
      = \dfrac{d(d+1)}{2}$ of them; within diagonal $d$ the pair $(m,n)$ sits at
      position $n$. So with $d = m+n$, the Cantor pairing function $\pi(m,n) =
      \dfrac{(m+n)(m+n+1)}{2} + n$ is a bijection $\mathbb{N} \times \mathbb{N}
      \to \mathbb{N}$.

      If all you want is countability, you do not even need the bijection: by
      the criteria, an injection into $\mathbb{N}$ suffices, and $(m,n) \mapsto
      2^{m} 3^{n}$ is injective by uniqueness of prime factorisation. Keep both.
      The pairing function is what you use when the actual index matters; the
      prime trick is what you reach for when it does not.
    worked: >
      Compute the index of $(2,3)$ two ways. By formula: $m + n = 5$, so
      $\pi(2,3) = \dfrac{5 \times 6}{2} + 3 = 15 + 3 = 18$. By listing:
      diagonals $0,1,2,3,4$ contain $1+2+3+4+5 = 15$ pairs, occupying indices
      $0$ through $14$, so diagonal $5$ starts at index $15$ with $(5,0)$; then
      $(4,1)$ at $16$, $(3,2)$ at $17$, and $(2,3)$ at $18$. The two agree.

      Run it backwards as a check on the whole scheme. Which pair sits at index
      $10$? Diagonals $0$ through $3$ fill indices $0$ through $9$, so index
      $10$ opens diagonal $4$, and the pair is $(4,0)$. And the prime injection
      applied to the same pair gives $2^{2} 3^{3} = 4 \times 27 = 108$ — a
      perfectly good injective label, just not a consecutive one.
    pitfalls: >
      Row by row is the trap, and it is worth naming precisely: it is not slow,
      it is *undefined*, because $(1,0)$ never receives an index. The same
      objection kills "list the first coordinate in all its values first". Note
      also that the prime map $(m,n) \mapsto 2^{m} 3^{n}$ is injective but not
      surjective — $5$ is not of that form — so it proves countability via the
      criteria and is not itself an enumeration. And $\pi$ counts from $0$: an
      answer computed with the diagonals numbered from $1$ will be off.
    recap: >
      Sweeping the grid along its finite anti-diagonals lists every pair of
      naturals exactly once, so $\mathbb{N} \times \mathbb{N}$ is countable —
      and $\pi(m,n) = \dfrac{(m+n)(m+n+1)}{2} + n$ gives the index outright.
    steps:
      - teach: >
          $\mathbb{N} \times \mathbb{N}$ is an infinite grid of pairs. Listing it
          row by row fails immediately: row $0$ never ends, so $(1,0)$ is never
          assigned an index at all.
      - teach: >
          Sweep by anti-diagonals instead — group the pairs by $m+n$. Diagonal
          $d$ holds exactly $d+1$ pairs, from $(d,0)$ to $(0,d)$. Finitely many
          per diagonal is the whole point: each group is finished in finitely
          many steps.
      - teach: >
          So the listing runs $(0,0)$; $(1,0), (0,1)$; $(2,0), (1,1), (0,2)$;
          $(3,0), (2,1), (1,2), (0,3)$; and so on. Every pair appears after a
          finite wait, and each appears exactly once.
      - ask: >
          In that zig-zag enumeration, with $(0,0)$ at index $0$, what index
          does the pair $(2,1)$ receive?
        expects: "7"
        hint: >
          Count how many pairs lie on the diagonals before $m+n = 3$, then count
          along that diagonal.
        feedback: >
          Index $7$. Diagonals $0$, $1$ and $2$ hold $1 + 2 + 3 = 6$ pairs,
          filling indices $0$ through $5$, so diagonal $3$ opens at index $6$
          with $(3,0)$, and $(2,1)$ comes next at index $7$. The formula agrees:
          $\dfrac{3 \times 4}{2} + 1 = 6 + 1 = 7$.
      - teach: >
          That computation is the general formula. The diagonals before $d =
          m+n$ contribute $1 + 2 + \cdots + d = \dfrac{d(d+1)}{2}$ pairs, and
          $(m,n)$ sits at position $n$ within its own diagonal, giving
          $\pi(m,n) = \dfrac{(m+n)(m+n+1)}{2} + n$.
      - ask: >
          Use the formula: what is $\pi(2,3)$?
        expects: "18"
        hint: >
          Here $m+n = 5$; add the count of earlier pairs to the position $n$.
        feedback: >
          $18$. With $m+n = 5$, the earlier diagonals hold $\dfrac{5 \times
          6}{2} = 15$ pairs at indices $0$ through $14$, so diagonal $5$ starts
          at $15$ with $(5,0)$; adding $n = 3$ gives $18$, which is $(2,3)$.
      - teach: >
          For countability alone the criteria let you be lazier. The map $(m,n)
          \mapsto 2^{m} 3^{n}$ is injective by uniqueness of prime
          factorisation, and an injection into $\mathbb{N}$ is all that is
          needed — no index computed, no diagonals counted.
      - ask: >
          Why is $(m,n) \mapsto 2^{m} 3^{n}$ not an enumeration of $\mathbb{N}
          \times \mathbb{N}$ in the sense of a bijection?
        choices:
          - text: >
              It is not injective, since different pairs can give the same value
            feedback: >
              It is injective: $2^{m}3^{n} = 2^{m'}3^{n'}$ forces $m = m'$ and
              $n = n'$ by uniqueness of prime factorisation. That is exactly why
              it works as a countability proof.
          - text: >
              It is not surjective — no pair maps to $5$, for instance
            correct: true
            feedback: >
              Right. Its image is only the numbers of the form $2^{m}3^{n}$, so
              it misses $5$, $7$, $10$ and infinitely many others. It certifies
              countability through the injection criterion, but it does not list
              the pairs in order.
          - text: >
              It leaves the codomain $\mathbb{N}$ for some pairs
            feedback: >
              Every value $2^{m}3^{n}$ is a natural number, so the map lands
              exactly where it should. The gap is in coverage, not in
              well-definedness.
        feedback: >
          Two tools with different jobs: $\pi$ when the index matters, the prime
          map when only countability does. The diagonal sweep is the idea both
          of them encode, and it is the idea reused for products, unions and
          $\mathbb{Q}$.

  - node: foundations.cardinality.product-countable
    hook: >
      One diagonal sweep through $\mathbb{N} \times \mathbb{N}$ pays for every
      finite product of countable sets at once — pairs, triples, lattice points,
      coefficient vectors — and those are the raw material of the countability
      theorems still to come.
    explanation: >
      If $A$ and $B$ are countable then so is $A \times B$. The proof is the
      criteria plus the grid, and nothing else.

      Deal with the degenerate case first: if either factor is empty then $A
      \times B$ is empty, hence countable. Otherwise both factors are countable
      and nonempty, so each admits a listing with repetitions allowed — a
      surjection $g : \mathbb{N} \to A$ and a surjection $h : \mathbb{N} \to
      B$. Combine them coordinatewise: $(m,n) \mapsto (g(m), h(n))$ is a
      surjection $\mathbb{N} \times \mathbb{N} \to A \times B$, since any $(a,b)$
      is hit by choosing $m$ with $g(m) = a$ and $n$ with $h(n) = b$. Compose
      with a bijection $\mathbb{N} \to \mathbb{N} \times \mathbb{N}$ — the
      zig-zag — and you have a surjection $\mathbb{N} \to A \times B$, so
      $A \times B$ is countable.

      Induction extends this to any finite product $A_1 \times \cdots \times
      A_k$: read a $k$-tuple as a pair consisting of a $(k-1)$-tuple and a last
      entry. In particular $\mathbb{N}^{k}$ is countable for every $k \ge 1$,
      and so is $\mathbb{Z}^{k}$.

      The restriction to *finitely* many factors is not an artefact of the
      proof, and it is worth flagging now so that no one generalises past it.
      The set of all infinite binary sequences is a product of countably many
      two-element sets, and it is uncountable. Each extra factor is harmless;
      infinitely many of them are not.
    worked: >
      Take the lattice $\mathbb{Z} \times \mathbb{Z}$, the set of integer points
      in the plane. Both factors are countable, so the corollary applies — but
      run the machine explicitly. Let $g : \mathbb{N} \to \mathbb{Z}$ be the
      alternating enumeration $0, -1, 1, -2, 2, \dots$, so that $g(0) = 0$,
      $g(1) = -1$, $g(2) = 1$, $g(3) = -2$, $g(4) = 2$. Then $(m,n) \mapsto
      (g(m), g(n))$ surjects $\mathbb{N} \times \mathbb{N}$ onto $\mathbb{Z}
      \times \mathbb{Z}$.

      Where does the lattice point $(2,-2)$ come from? Since $g(4) = 2$ and
      $g(3) = -2$, it is the image of the pair $(4,3)$. And the zig-zag puts
      $(4,3)$ at index $\dfrac{7 \times 8}{2} + 3 = 28 + 3 = 31$. So composing
      the two maps sends $31$ to $(2,-2)$: the lattice point has an explicit
      finite address, and $\mathbb{Z} \times \mathbb{Z}$ is countable.
    pitfalls: >
      The empty factor really does need its own line — there is no surjection
      $\mathbb{N} \to \emptyset$, so the listing criterion has nothing to say
      and the conclusion has to be read off directly instead. The far more
      serious trap is extending the corollary to infinitely many factors: "a
      product of countable sets is countable" is true for every finite number of
      factors and false for countably many, the set of infinite binary sequences
      being the counterexample. Note too that the composite map here is a
      surjection, not a bijection, so it delivers countability without
      delivering a repetition-free list.
    recap: >
      A grid of lists is itself a list, so a finite product of countable sets is
      countable — a fact that fails, and fails badly, for infinitely many
      factors.
    steps:
      - teach: >
          A pair drawn from two countable sets is a point in a grid whose rows
          and columns are both lists. The zig-zag already knows how to walk such
          a grid, so the work is mostly bookkeeping.
      - teach: >
          Suppose $A$ and $B$ are countable and nonempty. Take listings with
          repetitions allowed, $g : \mathbb{N} \to A$ and $h : \mathbb{N} \to B$,
          and form $(m,n) \mapsto (g(m), h(n))$. That surjects $\mathbb{N} \times
          \mathbb{N}$ onto $A \times B$.
      - teach: >
          Compose with a bijection $\mathbb{N} \to \mathbb{N} \times \mathbb{N}$
          and you have a surjection $\mathbb{N} \to A \times B$, which by the
          countability criteria is enough. Induction then covers $A_1 \times
          \cdots \times A_k$ and, in particular, $\mathbb{N}^{k}$ and
          $\mathbb{Z}^{k}$.
      - ask: >
          Let $g$ be the enumeration $g(0)=0$, $g(1)=-1$, $g(2)=1$, $g(3)=-2$,
          $g(4)=2$ of $\mathbb{Z}$, and index $\mathbb{N} \times \mathbb{N}$ by
          the zig-zag from $0$. At what index does the lattice point $(2,-2)$
          appear?
        expects: "31"
        hint: >
          Find the pair $(m,n)$ with $g(m) = 2$ and $g(n) = -2$, then apply
          $\pi(m,n) = \dfrac{(m+n)(m+n+1)}{2} + n$.
        feedback: >
          Index $31$. Here $g(4) = 2$ and $g(3) = -2$, so the lattice point
          comes from the pair $(4,3)$, and $\pi(4,3) = \dfrac{7 \times 8}{2} + 3
          = 28 + 3 = 31$. Every integer point in the plane has a finite address
          like this one.
      - ask: >
          Why is the case where $A$ or $B$ is empty handled separately?
        choices:
          - text: >
              Because the product of an empty set with a nonempty one is not
              defined
            feedback: >
              It is perfectly well defined and equal to $\emptyset$ — there are
              no pairs to form. The problem is elsewhere.
          - text: >
              Because there is no surjection $\mathbb{N} \to \emptyset$, so the
              listing criterion supplies no map to work with
            correct: true
            feedback: >
              Right. With an empty factor there is no listing to combine, so the
              proof has nothing to start from. The conclusion is read off
              directly instead: $A \times B = \emptyset$, which is countable.
          - text: >
              Because the zig-zag is undefined on an empty grid
            feedback: >
              The zig-zag is a map on $\mathbb{N} \times \mathbb{N}$ and never
              notices what $A$ and $B$ are. The gap is the missing listing of
              the empty factor.
        feedback: >
          One trivial edge case, patched in one line — and the same edge case as
          in the countability criteria, for the same reason.
      - teach: >
          Each extra factor costs nothing, so triples, quadruples and
          coefficient vectors are all countable. That is exactly what the
          algebraic numbers will need.
      - ask: >
          "A product of countable sets is countable." How far does that slogan
          hold?
        choices:
          - text: >
              For any number of factors, finite or infinite
            feedback: >
              False for infinitely many. The set of infinite binary sequences is
              a product of countably many copies of $\{0,1\}$, and it is
              uncountable.
          - text: >
              For finitely many factors only
            correct: true
            feedback: >
              Yes. The induction adds one factor at a time and never reaches an
              infinite product, and that limitation is real rather than
              technical: countably many two-element factors already produce an
              uncountable set.
          - text: >
              For finitely many factors, and for infinitely many provided each
              factor is finite
            feedback: >
              The counterexample has factors of size two — as finite as they
              come — and is still uncountable. Finiteness of the factors does
              not rescue an infinite product.
        feedback: >
          Say "finite product" out loud every time you use this corollary. The
          infinite case is not merely unproved here; it is false.
      - teach: >
          Keep the shape of the argument, because it repeats: turn the objects
          into tuples of countably many kinds of data, list each kind, and walk
          the resulting grid diagonally.

  - node: foundations.cardinality.q-countable
    hook: >
      Between any two rationals lies another, and every real is a limit of
      rationals, so $\mathbb{Q}$ feels far thicker than $\mathbb{N}$. It is not.
      This is the result that severs density from size.
    explanation: >
      Every rational number is $p/q$ for some integers $p$ and $q$ with $q \ne
      0$. Read that as a statement about maps: the function $\mathbb{Z} \times
      (\mathbb{Z} \setminus \{0\}) \to \mathbb{Q}$ sending $(p,q)$ to $p/q$ is
      *surjective*, because "every rational is a quotient of integers" is
      exactly the assertion that nothing is missed.

      Now count the domain. $\mathbb{Z}$ is countable and so is $\mathbb{Z}
      \setminus \{0\}$, being a subset of it, so their product is countable as a
      product of two countable sets. And $\mathbb{Q}$ is the image of that
      countable set under a function, which the countability criteria already
      declare countable. It is infinite because it contains $\mathbb{Z}$, so it
      is countably infinite: $|\mathbb{Q}| = \aleph_0$.

      Notice how little the surjection was asked to do. It is wildly
      non-injective — $(1,2)$, $(2,4)$ and $(-3,-6)$ all map to $1/2$ — and the
      criteria simply do not care. Handling duplicates was the entire reason for
      proving that a listing with repetitions suffices.

      What the theorem costs you is an intuition. $\mathbb{Q}$ is dense in the
      line: between any two rationals sits a third, and there is no "next"
      rational after $1/2$ the way there is a next integer after $1$. None of
      that has any bearing on cardinality. Density describes how a set sits
      inside an order; cardinality counts its elements; and the two are
      independent. The listing you build will not respect the order at all —
      that is the price, and it is the only price.
    worked: >
      Here is an actual list of the positive rationals, ordered so that the
      pattern is checkable. Write each in lowest terms as $p/q$ with $p, q \ge
      1$, group them by the value of $p + q$, and inside a group go in
      increasing $p$. Group $p+q = 2$: $1/1$. Group $3$: $1/2$, $2/1$. Group
      $4$: $1/3$, $3/1$ — note $2/2$ is skipped, since it is not in lowest terms
      and $1/1$ has already been listed. Group $5$: $1/4$, $2/3$, $3/2$, $4/1$.

      Counting from index $0$, the list reads $1/1, 1/2, 2/1, 1/3, 3/1, 1/4,
      2/3, 3/2, 4/1, \dots$, so $2/3$ sits at index $6$. Each group is finite —
      at most $p+q-1$ fractions before the lowest-terms filter — so every
      positive rational is reached after finitely many steps, and the
      lowest-terms rule means none is reached twice. That is a bijection
      $\mathbb{N} \to \mathbb{Q}^{+}$ written out by hand.
    pitfalls: >
      Do not conclude anything about order from this list: $1/2$ appears at
      index $1$ and $1/3$ at index $3$, so the enumeration runs backwards
      through the order as often as forwards, and no enumeration of $\mathbb{Q}$
      can be increasing. Do not try to list $\mathbb{Q}$ by sweeping an interval
      — "all the rationals in $[0,1]$ first" strands everything larger, the same
      failure as listing a grid row by row. And resist the inference that
      because $\mathbb{Q}$ is dense in $\mathbb{R}$ and countable, $\mathbb{R}$
      must be countable too: density says the rationals come arbitrarily close
      to every real, not that they exhaust them.
    recap: >
      Every rational is a pair of integers in disguise, so $\mathbb{Q}$ is the
      image of a countable set and is countable — density in the line
      notwithstanding.
    steps:
      - teach: >
          Every rational is $p/q$ with $p, q$ integers and $q \ne 0$. That
          sentence says the map $(p,q) \mapsto p/q$ from $\mathbb{Z} \times
          (\mathbb{Z} \setminus \{0\})$ to $\mathbb{Q}$ is surjective.
      - teach: >
          The domain is countable: $\mathbb{Z}$ is countable, so is $\mathbb{Z}
          \setminus \{0\}$ as a subset of it, and a product of two countable
          sets is countable. So $\mathbb{Q}$ is the image of a countable set,
          hence countable — and infinite, since it contains $\mathbb{Z}$.
      - teach: >
          The map is nowhere near injective: $(1,2)$, $(2,4)$ and $(-3,-6)$ all
          give $1/2$. That is exactly the sloppiness the countability criteria
          were built to tolerate.
      - ask: >
          List the positive rationals in lowest terms by increasing $p+q$, and
          inside each group by increasing $p$: $1/1$; $1/2, 2/1$; $1/3, 3/1$;
          $1/4, 2/3, 3/2, 4/1$; and so on. Counting from index $0$, what index
          does $2/3$ get?
        expects: "6"
        hint: >
          Write out the list in order and count, remembering that $2/2$ is
          skipped as not being in lowest terms.
        feedback: >
          Index $6$. The list runs $1/1, 1/2, 2/1, 1/3, 3/1, 1/4, 2/3, \dots$ at
          indices $0$ through $6$. The group $p+q=4$ contributes only $1/3$ and
          $3/1$, because $2/2$ is not in lowest terms and its value $1/1$ was
          listed already.
      - ask: >
          How many positive rationals in lowest terms have $p + q = 6$?
        expects: "2"
        hint: >
          Write down all pairs $(p,q)$ of positive integers with $p+q=6$ and
          discard those with a common factor.
        feedback: >
          Two: $1/5$ and $5/1$. The candidates are $(1,5), (2,4), (3,3), (4,2),
          (5,1)$, and $(2,4)$, $(3,3)$, $(4,2)$ all share a factor with their
          partner, so they are dropped. Every group is finite, which is why the
          listing reaches each rational after finitely many steps.
      - teach: >
          Both facts about the grouping matter. Finite groups mean nothing waits
          forever; the lowest-terms filter means nothing is listed twice. That
          is a bijection $\mathbb{N} \to \mathbb{Q}^{+}$, built by hand.
      - ask: >
          $\mathbb{Q}$ is dense in $\mathbb{R}$ and $\mathbb{Q}$ is countable.
          What follows about $\mathbb{R}$?
        choices:
          - text: >
              $\mathbb{R}$ is countable, since the rationals come arbitrarily
              close to every real
            feedback: >
              Coming arbitrarily close is not the same as being there. The
              inference has no support whatever, and its conclusion will turn
              out to be false into the bargain.
          - text: >
              Nothing about the size of $\mathbb{R}$
            correct: true
            feedback: >
              Correct. Density describes how $\mathbb{Q}$ sits inside the order
              on $\mathbb{R}$; cardinality counts elements. The two notions are
              independent, and the size of $\mathbb{R}$ needs a separate
              argument.
          - text: >
              $\mathbb{R}$ is countable, because a countable set cannot be dense
              in an uncountable one
            feedback: >
              There is no theorem of this shape. Density constrains how a set
              sits inside an order; it never constrains how many elements the
              surrounding set has.
        feedback: >
          Density and cardinality have nothing to do with each other, and the
          rationals are the example that proves it: no gaps in the order, and
          still just a list.
      - teach: >
          One thing genuinely is lost. Any enumeration of $\mathbb{Q}$ jumps
          around the order — $1/2$ before $1/3$, and so on — because a listing
          respecting the order would need a least element and a next one, and
          $\mathbb{Q}$ has neither.

  - node: foundations.cardinality.countable-union
    hook: >
      Countably many lists, stacked, are still one list. This is the tool that
      turns a decomposition of a set into a countability proof, and the
      algebraic numbers will fall to it directly.
    explanation: >
      Let $I$ be a countable index set and let every $A_i$, for $i \in I$, be
      countable. Then $\bigcup_{i \in I} A_i$ is countable.

      The proof is the zig-zag applied to a two-dimensional index. Discard the
      empty $A_i$, which contribute nothing, and use a listing of $I$ to assume
      $I \subseteq \mathbb{N}$. For each $i$ pick a surjection $f_i : \mathbb{N}
      \to A_i$, available because $A_i$ is countable and nonempty. Now every
      element of the union is $f_i(n)$ for some pair $(i,n)$, so $(i,n) \mapsto
      f_i(n)$ is a surjection from a subset of $\mathbb{N} \times \mathbb{N}$
      onto the union. That subset is countable, and a set covered by a countable
      set is countable.

      Notice where the two-dimensional index came from and why it had to be
      handled diagonally. The obvious plan — list all of $A_0$, then all of
      $A_1$ — never starts $A_1$ when $A_0$ is infinite. Sweeping the pairs
      $(i,n)$ by diagonals interleaves the lists instead, taking one element
      from an early list, then two, then three, and every element of every $A_i$
      is reached after a finite wait.

      One word in that proof does real work: *pick*. Each $A_i$ has many
      surjections and the argument needs one from each, simultaneously, for
      infinitely many $i$. That is the axiom of countable choice, and the
      theorem is genuinely not provable in $\mathrm{ZF}$ without it. When the
      index set is finite, or when the enumerations are given by an explicit
      rule rather than chosen, no such appeal is needed.
    worked: >
      For each $i \in \mathbb{N}$ let $A_i = \{2^{i}(2n+1) : n \in \mathbb{N}\}$
      — the positive integers whose highest power of $2$ is exactly $2^{i}$. So
      $A_0 = \{1, 3, 5, 7, \dots\}$, $A_1 = \{2, 6, 10, 14, \dots\}$, $A_2 =
      \{4, 12, 20, 28, \dots\}$, and each is countably infinite, listed by the
      explicit rule $f_i(n) = 2^{i}(2n+1)$ — no choosing required. Every
      positive integer is uniquely a power of two times an odd number, so the
      union of the $A_i$ is exactly the set of positive integers.

      Flatten with the zig-zag. Index $7$ of the diagonal enumeration is the
      pair $(2,1)$, and $f_2(1) = 2^{2} \times 3 = 12$. So the flattened listing
      puts $12$ at index $7$. Working through the early indices in the same way
      gives $1, 2, 3, 4, 6, 5, 8, 12, 10, 7, \dots$ — an enumeration of the
      positive integers that no one would have invented directly, assembled out
      of countably many separate lists.
    pitfalls: >
      Concatenation is the trap: "first all of $A_0$, then all of $A_1$" assigns
      no index at all to any element of $A_1$ once $A_0$ is infinite, and the
      whole point of the diagonal sweep is to avoid it. The theorem also needs
      the *index* set countable — a union of uncountably many singletons can be
      as large as you like, since every set is such a union. And keep the choice
      caveat in view: with countably many arbitrary countable sets the proof
      leans on countable choice, though a family whose enumerations are given by
      a formula, as in the worked example, needs nothing of the sort.
    recap: >
      Countably many countable sets have a countable union, because the pairs
      "which set, which element" form a grid and the grid can be walked
      diagonally.
    steps:
      - teach: >
          Suppose you have countably many sets $A_0, A_1, A_2, \dots$, each of
          them countable, and you want to count their union. Each element of the
          union is named by two numbers: which set it came from, and where it
          sits in that set's list.
      - teach: >
          Two numbers means a grid. Choosing a listing $f_i : \mathbb{N} \to
          A_i$ for each $i$ makes $(i,n) \mapsto f_i(n)$ a surjection from
          $\mathbb{N} \times \mathbb{N}$ onto the union, and $\mathbb{N} \times
          \mathbb{N}$ is countable — so the union is countable.
      - ask: >
          Why can the union not simply be listed as "all of $A_0$, then all of
          $A_1$, then all of $A_2$"?
        choices:
          - text: >
              Because the $A_i$ may overlap, so elements would be listed twice
            feedback: >
              Overlaps are harmless: the criteria permit repetitions in a
              listing. The failure is more basic than duplication.
          - text: >
              Because if $A_0$ is infinite the listing never reaches $A_1$, so
              its elements get no index at all
            correct: true
            feedback: >
              Exactly the concatenation trap. A listing is a function on
              $\mathbb{N}$, so every element needs a *finite* index. The
              diagonal sweep interleaves the lists instead: one from the first,
              then two, then three.
          - text: >
              Because the $A_i$ need not be disjoint from $\mathbb{N}$
            feedback: >
              The elements can be anything at all; the proof only ever indexes
              them. What breaks is the order of listing, not the nature of the
              elements.
        feedback: >
          Any argument that finishes one infinite list before starting the next
          has already failed. Walk the grid diagonally and every entry arrives
          in finite time.
      - teach: >
          Take $A_i = \{2^{i}(2n+1) : n \in \mathbb{N}\}$, so $A_0$ is the odd
          numbers, $A_1 = \{2,6,10,\dots\}$, $A_2 = \{4,12,20,\dots\}$. Every
          positive integer is uniquely an odd number times a power of $2$, so
          the union is exactly the positive integers.
      - ask: >
          Flatten that family with the zig-zag, whose index $7$ is the pair
          $(2,1)$. Which element of the union sits at index $7$?
        expects: "12"
        hint: >
          The pair $(i,n) = (2,1)$ means: take the element $f_i(n) =
          2^{i}(2n+1)$.
        feedback: >
          $12$. The pair $(2,1)$ names the entry $f_2(1) = 2^{2}(2 \times 1 + 1)
          = 4 \times 3 = 12$. The flattened list begins $1, 2, 3, 4, 6, 5, 8,
          12, \dots$ — an enumeration of the positive integers built out of
          countably many separate lists.
      - teach: >
          In that example the listings $f_i$ were given by a formula, so nothing
          had to be chosen. In the general theorem each $A_i$ offers many
          possible listings and the proof needs one from each, all at once, for
          infinitely many $i$.
      - ask: >
          What is that "one from each, all at once" an appeal to?
        choices:
          - text: >
              The well-ordering principle for $\mathbb{N}$
            feedback: >
              Well-ordering would pick a least element of a subset of
              $\mathbb{N}$, but the $A_i$ are arbitrary sets and their listings
              are not indexed by $\mathbb{N}$ in any canonical way, so there is
              no least one to take.
          - text: >
              The axiom of countable choice
            correct: true
            feedback: >
              Yes — countably many nonempty sets of candidate listings, one pick
              from each, assembled into a single family. The theorem is
              genuinely unprovable in $\mathrm{ZF}$ without it, though a finite
              union, or a family with explicit listings, needs no such appeal.
          - text: >
              The pigeonhole principle
            feedback: >
              Pigeonhole is a finite counting fact and has nothing to offer
              here. The difficulty is making infinitely many arbitrary
              selections at once.
        feedback: >
          This is the second place in the unit where choice hides in a proof
          that looks routine — the other being the claim that every infinite set
          is Dedekind-infinite.
      - teach: >
          Read the hypotheses tightly: countably many sets, each countable. A
          union of uncountably many singletons is any set at all, so the
          countability of the *index* set is as essential as the countability of
          the pieces.

  - node: foundations.cardinality.r-uncountable
    hook: >
      Everything so far has been countable, and it starts to look as though
      everything is. This is the theorem that stops it — and the moment
      "infinite" stops being one size.
    explanation: >
      Claim: no function $f : \mathbb{N} \to \mathbb{R}$ is surjective, so
      $\mathbb{R}$ cannot be listed and is uncountable. Since countability
      passes to subsets, it is enough to defeat every $f : \mathbb{N} \to
      [0,1]$: if $[0,1]$ cannot be listed, neither can anything containing it.

      Here is the move. You are handed a list — any list — and you build a
      number it misses. Write each listed value in decimal, $f(n) = 0.d_{n0}
      d_{n1} d_{n2} \dots$, so that $d_{nk}$ is the $k$-th digit of the $n$-th
      number. Now define $x = 0.e_0 e_1 e_2 \dots$ by walking down the diagonal:
      $e_n = 4$ if $d_{nn} = 5$, and $e_n = 5$ otherwise. By construction, for
      each $n$ the number $x$ and the number $f(n)$ disagree at decimal place
      $n$ — one guaranteed disagreement per entry, and that is all that is
      needed.

      Two things have to be checked, and skipping either is where diagonal
      arguments go wrong. First, $x$ is a legitimate real number in $[0,1]$: its
      digits all lie in $\{4,5\}$, so the series $\sum_{n \ge 0} e_n
      10^{-(n+1)}$ has bounded partial sums, and completeness of $\mathbb{R}$
      gives it a limit between $0.444\dots$ and $0.555\dots$. Second, disagreeing
      in a digit really makes it a different number. That is not automatic: two
      decimal strings can name the same real, but only when one ends in an
      endless tail of nines and the other in zeros, as in $0.4999\dots =
      0.5000\dots$. Confining the digits of $x$ to $4$ and $5$ means it has
      neither tail, so a digit disagreement is a genuine disagreement.

      So $x \in [0,1]$ and $x \ne f(n)$ for every $n$: the list missed it.
      Since $f$ was arbitrary, no list of the reals is complete — and
      uncountable sets exist.
    worked: >
      Suppose someone offers the list $f(0) = 1/3 = 0.3333\dots$, $f(1) = 1/2 =
      0.5000\dots$, $f(2) = 1/4 = 0.2500\dots$, $f(3) = 5/9 = 0.5555\dots$,
      $f(4) = 1/7 = 0.142857\dots$, and so on. Read the diagonal digits, taking
      the $n$-th decimal place of the $n$-th number and counting places from
      $0$: $d_{00} = 3$; $d_{11} = 0$; $d_{22} = 0$, since $1/4$ is $0.2, 5, 0,
      0, \dots$; $d_{33} = 5$; $d_{44} = 5$, since $1/7$ is $0.1, 4, 2, 8, 5,
      \dots$.

      Apply the rule $e_n = 4$ if $d_{nn} = 5$ and $e_n = 5$ otherwise: $e_0 =
      5$, $e_1 = 5$, $e_2 = 5$, $e_3 = 4$, $e_4 = 4$. So $x = 0.55544\dots$.
      Check it against the list: $x$ differs from $1/3$ in the first decimal
      place ($5$ against $3$), from $1/2$ in the second ($5$ against $0$), from
      $1/4$ in the third ($5$ against $0$), from $5/9$ in the fourth ($4$
      against $5$), and from $1/7$ in the fifth ($4$ against $5$). Whatever the
      rest of the list holds, $x$ will differ from its $n$-th entry at place
      $n$, so $x$ is a real number in $[0,1]$ that the list does not contain.
    pitfalls: >
      The diagonal number must differ from the $n$-th entry *at place $n$*, for
      every $n$ — that is one disagreement per entry, not a number that differs
      from everything everywhere, which is neither needed nor achievable.
      Digits $0$ and $9$ must be avoided, because $0.4999\dots$ and $0.5000\dots$
      are the same real number, and a "difference" of that kind proves nothing.
      And the argument does not say "the list forgot some reals, so add them":
      the construction runs against *any* list, including the repaired one, so
      no listing survives. Someone who claims to have listed all the reals has
      already been refuted, whatever the list is.
    recap: >
      Any proposed list of the reals is beaten by a number built to differ from
      the $n$-th entry in its $n$-th digit, so $\mathbb{R}$ cannot be enumerated
      at all.
    steps:
      - teach: >
          Every infinite set so far has been countable. The reals are not, and
          the proof is not a failed attempt at a listing — it is a machine that
          defeats every listing anyone could propose.
      - teach: >
          Suppose $f : \mathbb{N} \to [0,1]$ is any function. Write $f(n) =
          0.d_{n0}d_{n1}d_{n2}\dots$ and build a new number $x = 0.e_0e_1e_2
          \dots$ by the diagonal rule: $e_n = 4$ if $d_{nn} = 5$, and $e_n = 5$
          otherwise.
      - ask: >
          A list begins $f(0) = 0.3333\dots$, $f(1) = 0.5000\dots$, $f(2) =
          0.2500\dots$, $f(3) = 0.5555\dots$. Counting decimal places from $0$,
          what is the digit $e_3$ of the diagonal number?
        expects: "4"
        hint: >
          Find the fourth decimal digit of $f(3)$, then apply the rule.
        feedback: >
          $e_3 = 4$. The number $f(3) = 0.5555\dots$ has $d_{33} = 5$, and the
          rule says $e_n = 4$ exactly when $d_{nn} = 5$. So $x$ and $f(3)$
          differ in the fourth decimal place, which is all that is asked of
          them.
      - teach: >
          Repeating that at every index gives $x = 0.55544\dots$ for this list.
          For each $n$, the numbers $x$ and $f(n)$ disagree at decimal place $n$
          — one guaranteed disagreement per entry.
      - ask: >
          Why does the construction confine the digits of $x$ to $4$ and $5$
          instead of, say, adding $1$ to each diagonal digit?
        choices:
          - text: >
              To keep $x$ inside the interval $[0,1]$
            feedback: >
              Any decimal $0.e_0e_1\dots$ lies in $[0,1]$ whatever the digits
              are, so that is not what the restriction buys.
          - text: >
              To avoid the ambiguity $0.4999\dots = 0.5000\dots$, so that
              differing in a digit really means differing as a number
            correct: true
            feedback: >
              Exactly. Two decimal strings name the same real only when one ends
              in all nines and the other in all zeros. A number whose digits are
              all $4$ or $5$ has neither tail, so a digit disagreement is a
              genuine disagreement.
          - text: >
              To make $x$ irrational
            feedback: >
              Nothing in the proof needs $x$ irrational, and the construction
              does not guarantee it. What it guarantees is that $x$ is not any
              of the listed numbers.
        feedback: >
          Every diagonal argument owes two checks: that the constructed object
          is legitimate, and that differing in one coordinate genuinely makes it
          different. Digits $4$ and $5$ pay the second debt.
      - teach: >
          The first check is completeness. All the digits of $x$ lie in
          $\{4,5\}$, so the series $\sum_{n \ge 0} e_n 10^{-(n+1)}$ has bounded
          partial sums and converges to a real number between $0.444\dots$ and
          $0.555\dots$. So $x$ really is an element of $[0,1]$.
      - ask: >
          Someone answers: "fine — add $x$ to the front of the list and now
          everything is enumerated." What is wrong?
        choices:
          - text: >
              Nothing, provided the list is extended infinitely often
            feedback: >
              Repairing the list infinitely often does not help: at every stage
              you have some list, and the construction defeats it. The repair
              never converges to a complete listing.
          - text: >
              The construction applies to the new list too, producing a fresh
              missing number
            correct: true
            feedback: >
              Right. The theorem quantifies over *all* functions $\mathbb{N} \to
              [0,1]$: whatever list is offered, its own diagonal beats it. That
              is why this proves uncountability rather than merely exhibiting an
              oversight.
          - text: >
              The new list is no longer indexed by $\mathbb{N}$
            feedback: >
              Prepending one element to a list indexed by $\mathbb{N}$ gives
              another list indexed by $\mathbb{N}$ — shift every index by one.
              The problem is that the new list is beatable in turn.
        feedback: >
          The diagonal argument is not a complaint about a particular list. It
          is a uniform procedure that turns any list into a counterexample to
          itself.
      - teach: >
          So $[0,1]$ is uncountable, and $\mathbb{R}$ contains it, so
          $\mathbb{R}$ is uncountable too. Uncountable sets exist, and
          "infinite" has stopped being a single size.

  - node: foundations.cardinality.def-cardinal-comparison
    hook: >
      Equinumerosity says when two sets match. Now that some sets are provably
      bigger than others, you need a relation that says *which way* — and it is
      defined by fitting inside, not by counting.
    explanation: >
      Write $|A| \le |B|$ if there is an injection $A \to B$, and $|A| < |B|$ if
      $|A| \le |B|$ while no bijection $A \to B$ exists. Read the first as "$A$
      fits inside $B$ with room to spare or not": an injection places a distinct
      copy of each element of $A$ somewhere in $B$, using up no more of $B$ than
      $A$ has elements.

      The relation is about cardinalities and not about the particular sets,
      because it respects equinumerosity. If $A \approx A'$ and $|A| \le |B|$,
      compose the bijection $A' \to A$ with the injection $A \to B$: composites
      of injections are injections, so $|A'| \le |B|$ as well. Replacing either
      side by an equinumerous set changes nothing, which is what makes the
      notation $|A| \le |B|$ honest.

      Two easy consequences fix the meaning. If $A \subseteq B$ then $|A| \le
      |B|$, the inclusion being injective. And on finite sets $\le$ reproduces
      the usual order: $|\{1,\dots,m\}| \le |\{1,\dots,n\}|$ holds exactly when
      $m \le n$, since an injection from a bigger finite set into a smaller one
      is what pigeonhole forbids.

      Two things are deliberately *not* built into the definition, and it is
      worth knowing which. That $|A| \le |B|$ together with $|B| \le |A|$ forces
      $|A| = |B|$ looks obvious and is not: it is a theorem, the
      Schröder–Bernstein theorem, and nothing may assume it before it is proved.
      That any two cardinalities are comparable at all — that for all $A$ and
      $B$ either $|A| \le |B|$ or $|B| \le |A|$ — is not provable without the
      axiom of choice. The definition is careful precisely because these two
      familiar-looking properties are not free.
    worked: >
      Compare $A = \{1,2,3\}$ with $B = \{1,2,3,4\}$. The inclusion $A \to B$ is
      an injection, so $|A| \le |B|$. Is it strict? A bijection $A \to B$ would
      be an injection $B \to A$ after inversion, and pigeonhole forbids
      injecting four elements into three, so no bijection exists. Hence $|A| <
      |B|$, which is the statement $3 < 4$ in its cardinal form.

      Now the infinite case. The inclusion $\mathbb{N} \to \mathbb{R}$ is an
      injection, so $|\mathbb{N}| \le |\mathbb{R}|$. Strict? A bijection
      $\mathbb{N} \to \mathbb{R}$ would in particular be a surjection, and the
      diagonal argument says no function $\mathbb{N} \to \mathbb{R}$ is
      surjective. So no bijection exists and $|\mathbb{N}| < |\mathbb{R}|$: a
      strict inequality between two infinite sizes, written down and proved.
    pitfalls: >
      $|A| < |B|$ is not "an injection that misses something" — the map $n
      \mapsto 2n$ from $\mathbb{N}$ to $\mathbb{N}$ misses every odd number and
      certainly does not show $|\mathbb{N}| < |\mathbb{N}|$. Strictness requires
      that *no* bijection exists, which is a statement about all functions.
      Beware also of assuming the two properties the definition withholds:
      antisymmetry is a theorem to be proved, and comparability of arbitrary
      cardinalities needs the axiom of choice.
    recap: >
      $|A| \le |B|$ means an injection $A \to B$ exists, and $|A| < |B|$ adds
      that no bijection does — "no bigger than" defined by fitting inside rather
      than by counting.
    steps:
      - teach: >
          Some sets are now known to be bigger than others, so "same size" needs
          a companion: $|A| \le |B|$ means there is an injection $A \to B$.
          Every element of $A$ gets its own distinct place inside $B$.
      - teach: >
          Strictness is defined by denial: $|A| < |B|$ means $|A| \le |B|$ *and*
          no bijection $A \to B$ exists. The second half is a statement about
          every function, not about the injection you happened to build.
      - ask: >
          How many injections are there from $\{1,2\}$ into $\{1,2,3\}$?
        expects: "6"
        hint: >
          Pick the image of $1$, then a different image for $2$.
        feedback: >
          Six: three choices for the image of $1$, then two remaining for the
          image of $2$, so $3 \times 2 = 6$. Any one of them certifies
          $|\{1,2\}| \le |\{1,2,3\}|$ — the definition asks only that some
          injection exist.
      - teach: >
          The relation compares sizes, not sets: if $A \approx A'$ then
          composing the bijection $A' \to A$ with an injection $A \to B$ gives
          an injection $A' \to B$. Swapping either side for an equinumerous set
          changes nothing.
      - ask: >
          Does the map $n \mapsto 2n$ from $\mathbb{N}$ to $\mathbb{N}$, which
          misses every odd number, show $|\mathbb{N}| < |\mathbb{N}|$?
        choices:
          - text: >
              Yes — it is an injection that is not surjective, which is what
              strictness means
            feedback: >
              That is not what strictness means. Strictness requires that *no*
              bijection exists, and the identity is one, so $|\mathbb{N}| =
              |\mathbb{N}|$.
          - text: >
              No — strictness needs no bijection to exist, and the identity
              $\mathbb{N} \to \mathbb{N}$ is one
            correct: true
            feedback: >
              Right. One injection failing to be onto is a fact about that map.
              Strict inequality is a claim about every function from $A$ to $B$,
              which is why it is always the harder half.
          - text: >
              No, because $n \mapsto 2n$ is not injective
            feedback: >
              It is injective: $2m = 2n$ gives $m = n$. Its shortcoming is
              surjectivity, and that shortcoming is not what strictness is
              about.
        feedback: >
          The two halves of $<$ are asymmetric in difficulty: exhibiting one
          injection, then ruling out all bijections.
      - teach: >
          A genuine strict inequality: the inclusion $\mathbb{N} \to \mathbb{R}$
          gives $|\mathbb{N}| \le |\mathbb{R}|$, and the diagonal argument says
          no function $\mathbb{N} \to \mathbb{R}$ is onto, so no bijection
          exists. Hence $|\mathbb{N}| < |\mathbb{R}|$.
      - ask: >
          Which of these is *not* part of the definition of $\le$ on
          cardinalities?
        choices:
          - text: >
              That $A \subseteq B$ implies $|A| \le |B|$
            feedback: >
              This is not part of the definition, but it is an immediate
              consequence of it: the inclusion map is an injection. It costs one
              line.
          - text: >
              That $|A| \le |B|$ and $|B| \le |A|$ together give $|A| = |B|$
            correct: true
            feedback: >
              Correct — that is deliberately withheld. Two injections do not
              obviously assemble into a bijection; that they always do is the
              Schröder–Bernstein theorem, and until it is proved nothing may
              assume it.
          - text: >
              That an injection $A \to B$ exists
            feedback: >
              That *is* the definition of $|A| \le |B|$, word for word.
        feedback: >
          The definition is deliberately thin. Antisymmetry has to be earned,
          and comparability of any two cardinalities cannot be earned at all
          without the axiom of choice.
      - teach: >
          So the vocabulary is in place: equinumerous for equality, injections
          for $\le$, and the absence of any bijection for $<$. What is missing
          is a supply of theorems, and the next ones produce strict inequalities
          in bulk.

  - node: foundations.cardinality.cantor-theorem
    hook: >
      The reals are bigger than the naturals — but is there a biggest set? This
      theorem answers no, permanently, with an argument that needs no
      hypotheses and works on every set there is.
    explanation: >
      Cantor's theorem: for every set $X$, $|X| < |\mathcal{P}(X)|$. Both halves
      of the strict inequality have to be supplied.

      The easy half: $x \mapsto \{x\}$ is a map $X \to \mathcal{P}(X)$, and it is
      injective, since $\{x\} = \{y\}$ forces $x = y$. So $|X| \le
      |\mathcal{P}(X)|$.

      The strict half is the diagonal argument wearing different clothes. Let $f
      : X \to \mathcal{P}(X)$ be *any* function and consider $D = \{x \in X : x
      \notin f(x)\}$ — the elements that are missing from the subset they are
      assigned to. $D$ is a subset of $X$, hence an element of $\mathcal{P}(X)$,
      so it is a legitimate target. Could $D = f(a)$ for some $a \in X$? Ask
      whether $a \in D$. By the definition of $D$, $a \in D$ holds exactly when
      $a \notin f(a)$; and $f(a) = D$, so that reads: $a \in D$ exactly when $a
      \notin D$. Contradiction. So $D$ is outside the image of $f$, no $f$ is
      surjective, and in particular no bijection $X \to \mathcal{P}(X)$ exists.

      Two consequences. There is no largest cardinality: the tower $|X| <
      |\mathcal{P}(X)| < |\mathcal{P}(\mathcal{P}(X))| < \cdots$ climbs forever,
      so the infinite sizes form an endless ladder rather than a top rung. And
      the theorem has no hypotheses at all — take $X$ finite and it says $n <
      2^{n}$; take $X = \mathbb{N}$ and it produces an uncountable set without
      any mention of decimals.
    worked: >
      Test the construction on $X = \{1,2,3\}$ with the map $f(1) = \{1,2\}$,
      $f(2) = \emptyset$, $f(3) = \{3\}$. Work out $D = \{x : x \notin f(x)\}$
      element by element. Is $1 \in f(1) = \{1,2\}$? Yes, so $1 \notin D$. Is $2
      \in f(2) = \emptyset$? No, so $2 \in D$. Is $3 \in f(3) = \{3\}$? Yes, so
      $3 \notin D$. Hence $D = \{2\}$.

      Now check the promise. The image of $f$ is $\{\{1,2\}, \emptyset,
      \{3\}\}$, and $\{2\}$ is not among those three, exactly as the theorem
      guarantees. The count confirms it from the outside as well: $X$ has $3$
      elements and $\mathcal{P}(X)$ has $2^{3} = 8$, so any $f$ leaves at least
      five subsets unhit — but the theorem does better than counting, because
      it names one of the missing subsets from $f$ itself, and that is what
      keeps working when $X$ is infinite and no counting is available.
    pitfalls: >
      $D$ is allowed to be empty — if $x \in f(x)$ for every $x$ then $D =
      \emptyset$, which is still a perfectly good element of $\mathcal{P}(X)$
      and still outside the image. The theorem is about $\mathcal{P}(X)$, not
      about some larger set of your choosing: it says the *subsets* of $X$
      outnumber $X$, and $|X| < |\mathcal{P}(X)|$ is proved for every $X$ with
      no hypothesis whatever, finite ones included. And the contradiction is
      driven by $a \in D$ against $a \notin D$; if you find yourself needing $X$
      to be infinite, or needing $f$ to be injective, the argument has been
      misremembered.
    recap: >
      The subsets of a set always outnumber the set, because the collection of
      elements missing from their own assigned subset is a subset nobody was
      assigned — so there is no largest infinity.
    steps:
      - teach: >
          $\mathbb{R}$ beat $\mathbb{N}$, so sizes come in at least two infinite
          flavours. The natural next question is whether the ladder has a top.
          Cantor's theorem answers it for every set at once.
      - teach: >
          The claim is $|X| < |\mathcal{P}(X)|$. Half of it is immediate: $x
          \mapsto \{x\}$ is an injection $X \to \mathcal{P}(X)$, since $\{x\} =
          \{y\}$ forces $x = y$. So $|X| \le |\mathcal{P}(X)|$.
      - ask: >
          For $X = \{1,2,3\}$, how many elements does $\mathcal{P}(X)$ have?
        expects: "8"
        hint: >
          Each element is either in a given subset or out of it, independently.
        feedback: >
          $8 = 2^{3}$. In the finite case Cantor's theorem is just the
          inequality $n < 2^{n}$ — true, and provable by counting. The point of
          the theorem is that its proof never counts, so it survives into the
          infinite case.
      - teach: >
          For strictness, take *any* $f : X \to \mathcal{P}(X)$ and form $D = \{x
          \in X : x \notin f(x)\}$: the elements missing from the subset they
          were assigned. $D$ is a subset of $X$, so it is a legitimate element
          of $\mathcal{P}(X)$.
      - ask: >
          Let $X = \{1,2,3\}$ with $f(1) = \{1,2\}$, $f(2) = \emptyset$, $f(3) =
          \{3\}$. What is $D$?
        choices:
          - text: >
              $D = \{2\}$
            correct: true
            feedback: >
              Check each element: $1 \in f(1)$, so $1$ is out; $2 \notin f(2) =
              \emptyset$, so $2$ is in; $3 \in f(3)$, so $3$ is out. And indeed
              $\{2\}$ is not $\{1,2\}$, not $\emptyset$ and not $\{3\}$ — the
              image misses it.
          - text: >
              $D = \{1,3\}$
            feedback: >
              That is the complement — the elements that *do* belong to their
              assigned subset. $D$ collects the ones that do not, so the test is
              $x \notin f(x)$.
          - text: >
              $D = \emptyset$
            feedback: >
              $D$ is empty only when every $x$ lies in $f(x)$. Here $2 \notin
              f(2) = \emptyset$, so $2$ qualifies and $D$ is not empty. (An
              empty $D$ would still prove the theorem: $\emptyset$ is a subset
              too.)
        feedback: >
          $D$ is assembled from $f$ itself, which is why it can dodge every
          value of $f$ — and why the argument does not need to count anything.
      - teach: >
          Now suppose $D = f(a)$ for some $a$. Then $a \in D$ holds exactly when
          $a \notin f(a)$, and $f(a)$ is $D$, so $a \in D$ exactly when $a
          \notin D$. Absurd — so $D$ is outside the image and no $f$ is
          surjective.
      - ask: >
          What does the theorem then give you?
        choices:
          - text: >
              That $\mathcal{P}(\mathbb{N})$ is uncountable, and that no
              cardinality is largest
            correct: true
            feedback: >
              Both. With $X = \mathbb{N}$ it produces an uncountable set with no
              mention of decimals, and iterating gives $|X| < |\mathcal{P}(X)| <
              |\mathcal{P}(\mathcal{P}(X))| < \cdots$, an endless ladder of
              sizes.
          - text: >
              That $\mathcal{P}(X)$ is uncountable for every $X$
            feedback: >
              Not for finite $X$: $\mathcal{P}(\{1,2,3\})$ has eight elements
              and is as countable as anything. The theorem says $\mathcal{P}(X)$
              is *bigger than $X$*, not that it is uncountable.
          - text: >
              That every uncountable set is a power set
            feedback: >
              The theorem produces uncountable sets; it never claims they are
              all of that form, and nothing in the argument would support such a
              claim.
        feedback: >
          One argument, no hypotheses, every set: the subsets of a set always
          outnumber the set, so the sizes climb forever.
      - teach: >
          The set $D$ should look familiar. It is Russell's set relativised to
          $f$ — the same self-reference that made naive comprehension
          inconsistent, harnessed here to prove a theorem instead of wrecking a
          theory.

  - node: foundations.cardinality.diagonalisation
    hook: >
      You have now run essentially the same argument twice, on decimals and on
      subsets. Naming the pattern turns two theorems into one reusable
      technique — the same one that later yields the halting problem and Gödel's
      incompleteness theorems.
    explanation: >
      The setting for a diagonal argument has three ingredients. Each object in
      play is determined by a function on some index set — a real number by its
      sequence of digits, a subset of $X$ by its membership test on $X$. A
      candidate enumeration assigns an object $O_i$ to each index $i$. And the
      index set of the enumeration is the same as the index set of the data, so
      the pair $(i,i)$ makes sense.

      Picture the objects as the rows of a table whose $(i,j)$ entry is the
      $j$-th datum of $O_i$. Now build a new object whose $i$-th datum is
      *chosen to differ* from the entry at $(i,i)$. Then the new object
      disagrees with $O_i$ at coordinate $i$, for every $i$ — one guaranteed
      disagreement per row — so it is not on the list, and the list was
      incomplete.

      Both earlier proofs are this scheme. Taking objects to be reals, data to
      be digits, and "differ" to mean a different digit gives the uncountability
      of $\mathbb{R}$. Taking objects to be subsets, data to be answers to $x
      \in \cdot$, and "differ" to mean the negation of $x \in f(x)$ gives
      Cantor's theorem — the diagonal set being exactly $D = \{x : x \notin
      f(x)\}$.

      Two checks are never skippable. First, the diagonal object must be a
      legitimate object of the kind being listed: a real number really exists
      with those digits, a subset really exists with that membership rule. That
      check is the reason completeness of $\mathbb{R}$ appeared in the decimal
      proof. Second, differing in one coordinate must really make it a different
      object — and that is the reason the digits $0$ and $9$ had to be avoided,
      since $0.4999\dots$ and $0.5000\dots$ differ in every digit and are the
      same number. Skip either check and the argument proves nothing.
    worked: >
      Apply the scheme to infinite binary sequences, where the objects are
      functions $\mathbb{N} \to \{0,1\}$. Suppose someone lists four of them and
      claims to be building a complete enumeration: $s_0 = 0,0,0,0,\dots$; $s_1
      = 1,0,1,0,\dots$; $s_2 = 1,1,1,1,\dots$; $s_3 = 0,1,0,1,\dots$.

      Read down the diagonal, taking the $i$-th entry of $s_i$ with positions
      counted from $0$: $s_0(0) = 0$, $s_1(1) = 0$, $s_2(2) = 1$, $s_3(3) = 1$.
      Flip each one — with two possible values, "differ" means the other value —
      to get $t = 1, 1, 0, 0, \dots$. Check row by row: $t$ and $s_0$ differ at
      position $0$ ($1$ against $0$); $t$ and $s_1$ differ at position $1$ ($1$
      against $0$); $t$ and $s_2$ at position $2$ ($0$ against $1$); $t$ and
      $s_3$ at position $3$ ($0$ against $1$). Both checks pass here for free:
      $t$ is a perfectly good binary sequence, and two binary sequences
      differing at a position are different sequences. So no list of binary
      sequences is complete, and the set of them is uncountable.
    pitfalls: >
      The constructed object must differ from row $i$ *at coordinate $i$*, and
      that is the only disagreement you are entitled to — an attempt to make it
      differ from everything everywhere is both unnecessary and impossible. The
      legitimacy check is the one most often dropped: if the diagonal recipe
      produced something that is not an object of the listed kind, the argument
      collapses, which is why a decimal expansion needs completeness and a
      membership rule needs the power set. And the scheme needs the data indexed
      by the same set that indexes the list — diagonalising a table whose rows
      and columns are indexed differently has no $(i,i)$ to look at.
    recap: >
      Lay the candidate list out as a table and build an object that differs
      from row $i$ in column $i$: it cannot be on the list, and that single
      manoeuvre underlies uncountability, Cantor's theorem and the classical
      undecidability results.
    steps:
      - teach: >
          Two proofs, one shape. In both, the objects were determined by
          functions on an index set, a list of them was proposed, and a new
          object was built by disagreeing along the diagonal of the resulting
          table.
      - teach: >
          The general recipe: given a candidate enumeration $O_0, O_1, O_2,
          \dots$, form the table whose $(i,j)$ entry is the $j$-th datum of
          $O_i$, and construct an object whose $i$-th datum differs from the
          entry at $(i,i)$. It disagrees with every row, so it is not listed.
      - teach: >
          Both instances fit. Reals with digits as data and "a different digit"
          as differing gives the uncountability of $\mathbb{R}$. Subsets with
          membership as data and the negation of $x \in f(x)$ as differing gives
          Cantor's theorem, the diagonal object being $D$.
      - ask: >
          Diagonalise the list of binary sequences $s_0 = 0,0,0,0,\dots$, $s_1 =
          1,0,1,0,\dots$, $s_2 = 1,1,1,1,\dots$, $s_3 = 0,1,0,1,\dots$ by
          flipping the diagonal entries. Counting positions from $0$, what is
          the entry of the new sequence at position $2$?
        expects: "0"
        hint: >
          Find $s_2(2)$ and take the other value.
        feedback: >
          $0$. The diagonal entry is $s_2(2) = 1$, since $s_2$ is constantly
          $1$, and flipping gives $0$. The whole diagonal sequence starts $1, 1,
          0, 0, \dots$, and it differs from $s_i$ at position $i$ for each $i$.
      - teach: >
          Two checks are never skippable. The diagonal object must be a
          legitimate object of the kind being listed, and differing in one
          coordinate must really make it a different object.
      - ask: >
          Which earlier detail was the second check being paid for?
        choices:
          - text: >
              Restricting the diagonal digits to $4$ and $5$
            correct: true
            feedback: >
              Yes. Two decimal strings can name the same real through a tail of
              nines against a tail of zeros — $0.4999\dots$ and $0.5000\dots$
              differ in *every* digit and are equal — so digits $0$ and $9$ had
              to be kept out for a digit disagreement to be a real
              disagreement.
          - text: >
              Reducing to the interval $[0,1]$
            feedback: >
              That reduction was a convenience — it made the objects writable as
              decimals — and had nothing to do with whether differing in a digit
              means differing as a number.
          - text: >
              Using completeness of $\mathbb{R}$
            feedback: >
              Completeness paid for the *first* check: it guaranteed that the
              constructed digit string names an actual real number.
        feedback: >
          Legitimacy of the object and genuineness of the disagreement — two
          debts, two payments. A diagonal argument that pays neither proves
          nothing at all.
      - ask: >
          What does a successful diagonal argument establish?
        choices:
          - text: >
              That the particular list offered was badly chosen and can be
              repaired
            feedback: >
              The construction applies to the repaired list too, and to its
              repair. That is why the conclusion is about all lists rather than
              about one.
          - text: >
              That *no* enumeration of the objects is complete, since the
              construction runs against any list at all
            correct: true
            feedback: >
              Exactly. The recipe takes an arbitrary list as input and outputs a
              missing object, so it refutes every list uniformly — which is
              what a claim about all functions requires.
          - text: >
              That the objects cannot be described at all
            feedback: >
              They can be described perfectly well — individually. What fails is
              indexing all of them by $\mathbb{N}$ at once.
        feedback: >
          Uniformity is the whole force of the technique: one procedure, every
          list, no survivors.
      - teach: >
          The same manoeuvre, run on programs indexed by their own codes, gives
          the undecidability of the halting problem; run on formulas indexed by
          their own codes, it gives Gödel's incompleteness theorems. It is worth
          recognising on sight.

  - node: foundations.cardinality.schroder-bernstein
    hook: >
      Two injections, one each way, are usually easy to find; a bijection is
      usually hard to build. This theorem converts the easy thing into the hard
      thing for free, and it is the workhorse of every cardinality computation
      that follows.
    explanation: >
      The Schröder–Bernstein theorem: if there is an injection $f : A \to B$ and
      an injection $g : B \to A$, then there is a bijection $A \to B$. In the
      notation of cardinal comparison, $|A| \le |B|$ and $|B| \le |A|$ together
      give $|A| = |B|$.

      The temptation is to think this is obvious. It is not: $f$ and $g$ may
      have wildly different images, and nothing about them suggests how to
      splice them. The construction that works starts from the part of $A$ that
      $g$ never reaches. Put $C_0 = A \setminus g(B)$, then $C_{n+1} =
      g(f(C_n))$, and let $C = \bigcup_{n \in \mathbb{N}} C_n$ — the elements
      reachable from $C_0$ by going out with $f$ and back with $g$, any number
      of times.

      Now define $h : A \to B$ by $h(a) = f(a)$ when $a \in C$, and $h(a) =
      g^{-1}(a)$ when $a \notin C$. The second clause is legal precisely because
      $a \notin C$ implies $a \notin C_0$, so $a \in g(B)$, and $g$ is a
      bijection onto its image, so $g^{-1}(a)$ exists and is unique. That is the
      load-bearing step: $C_0$ was defined as exactly the set where $g^{-1}$
      would fail, so the two clauses cover $A$ without overlap and without
      gaps.

      The rest is checking. $h$ is injective: the two clauses cannot collide,
      because $f(a) = g^{-1}(a')$ with $a \in C$ and $a' \notin C$ would give
      $a' = g(f(a))$, putting $a'$ in some $C_{n+1}$ and so in $C$. And $h$ is
      surjective: given $b \in B$, either $g(b) \notin C$, in which case $h(g(b))
      = b$; or $g(b) \in C_{n+1}$ for some $n$, which means $g(b) = g(f(c))$ for
      some $c \in C_n$, whence $b = f(c) = h(c)$ by injectivity of $g$. No form
      of the axiom of choice appears anywhere.
    worked: >
      Watch the machine run on $A = B = \mathbb{N}$ with $f(a) = a+1$ and $g(b)
      = b+1$, both injections and neither surjective. Then $g(B) = \{1,2,3,
      \dots\}$, so $C_0 = \mathbb{N} \setminus g(B) = \{0\}$. Next $C_1 =
      g(f(C_0)) = g(f(\{0\})) = g(\{1\}) = \{2\}$, and $C_2 = g(f(\{2\})) =
      g(\{3\}) = \{4\}$. The pattern is clear: $C_n = \{2n\}$, so $C$ is the set
      of even numbers.

      Read off $h$. For even $a$, which lies in $C$, $h(a) = f(a) = a+1$. For
      odd $a$, which does not, $h(a) = g^{-1}(a) = a-1$. So $h(0) = 1$, $h(1) =
      0$, $h(2) = 3$, $h(3) = 2$, $h(4) = 5$, $h(5) = 4$: the map that swaps
      each even number with its odd successor. That is visibly a bijection
      $\mathbb{N} \to \mathbb{N}$, assembled out of two maps neither of which
      was onto.
    pitfalls: >
      The theorem needs injections in *both* directions; one injection and one
      surjection is a different statement, and deriving a bijection from those
      does require the axiom of choice. Do not read $C$ as $A \setminus g(B)$ —
      that is only $C_0$, and stopping there breaks injectivity of $h$, since
      the chains $g(f(C_0)), g(f(g(f(C_0)))), \dots$ must all be swept into $C$
      as well. And note the clause $h(a) = g^{-1}(a)$ is well defined only off
      $C$: applying it on $C_0$ is exactly what the construction was designed to
      avoid.
    recap: >
      Injections both ways splice into a single bijection — following the chains
      that start where $g$ never reaches decides which of the two maps to use on
      each element — so two sets each fitting inside the other are the same size.
    steps:
      - teach: >
          Finding one injection each way is usually routine. Finding a bijection
          is usually not. Schröder–Bernstein says the routine work suffices:
          $|A| \le |B|$ and $|B| \le |A|$ give $|A| = |B|$.
      - teach: >
          The construction begins where $g$ cannot reach: $C_0 = A \setminus
          g(B)$. Then follow the chains out and back, $C_{n+1} = g(f(C_n))$, and
          collect $C = \bigcup_{n \in \mathbb{N}} C_n$.
      - teach: >
          Define $h(a) = f(a)$ for $a \in C$ and $h(a) = g^{-1}(a)$ for $a
          \notin C$. Each element of $A$ gets exactly one clause, and the choice
          of clause is decided by whether it lies on one of those chains.
      - ask: >
          Why is the clause $h(a) = g^{-1}(a)$ legitimate?
        choices:
          - text: >
              Because $g$ is surjective, so $g^{-1}$ is defined on all of $A$
            feedback: >
              $g$ is only assumed injective, and typically misses a great deal
              of $A$ — in the worked example it misses $0$. Surjectivity is
              exactly what is not available.
          - text: >
              Because $a \notin C$ forces $a \notin C_0$, so $a \in g(B)$, where
              $g$ is a bijection onto its image
            correct: true
            feedback: >
              That is the load-bearing step. $C_0$ was defined as precisely the
              set where $g^{-1}$ would fail, so removing $C$ removes that
              failure, and injectivity of $g$ makes the preimage unique.
          - text: >
              Because $f$ and $g$ are inverse to each other
            feedback: >
              Nothing relates $f$ and $g$ in the hypotheses — they are two
              unrelated injections. If they were inverse the theorem would be
              trivial.
        feedback: >
          Every element off $C$ is in the image of $g$, and $g$ is a bijection
          onto its image, so $g^{-1}$ is available exactly where it is used.
      - ask: >
          Run the construction with $A = B = \mathbb{N}$, $f(a) = a+1$, $g(b) =
          b+1$. Then $C_0 = \{0\}$, $C_1 = \{2\}$, $C_2 = \{4\}$, so $C$ is the
          set of even numbers. What is $h(7)$?
        expects: "6"
        hint: >
          Is $7$ in $C$? Apply the clause that decision selects.
        feedback: >
          $h(7) = 6$. Since $7$ is odd it is not in $C$, so the second clause
          applies: $h(7) = g^{-1}(7) = 6$. On the evens the first clause gives
          $h(a) = a+1$, so $h$ swaps $0$ with $1$, $2$ with $3$, $4$ with $5$ —
          a bijection built out of two maps, neither of them onto.
      - teach: >
          Injectivity of $h$ is the one check with content. A collision $f(a) =
          g^{-1}(a')$ with $a \in C$ and $a' \notin C$ would give $a' = g(f(a))$,
          which lands in some $C_{n+1}$ and so in $C$ — contradicting $a' \notin
          C$.
      - ask: >
          Does the proof use the axiom of choice?
        choices:
          - text: >
              Yes — infinitely many sets $C_n$ are formed, one per $n$
            feedback: >
              Forming $C_{n+1} = g(f(C_n))$ is a recursion with an explicit rule,
              not a choice: each set is determined by the previous one and by the
              given maps. No selection is being made.
          - text: >
              No — every step is an explicit construction from $f$ and $g$
            correct: true
            feedback: >
              Right. $C_0$, the recursion, the union and both clauses of $h$ are
              all determined outright by the two given injections. That makes
              Schröder–Bernstein a theorem of $\mathrm{ZF}$, unlike several
              other results in this unit.
          - text: >
              Only when $A$ and $B$ are uncountable
            feedback: >
              The construction does not care about the size of $A$ and $B$ and
              never branches on it. It is choice-free in every case.
        feedback: >
          Worth remembering, because it makes the theorem safe to use anywhere —
          including inside proofs that are trying to avoid choice.
      - teach: >
          The practical upshot: to prove two sets equinumerous, stop hunting for
          a bijection and produce one injection each way. That is how the size of
          $\mathbb{R}$ will be pinned down exactly.

  - node: foundations.cardinality.cardinal-order
    hook: >
      With Schröder–Bernstein in hand, "no bigger than" can finally be checked
      against the axioms of an order — and the one axiom that fails turns out to
      be equivalent to the axiom of choice.
    explanation: >
      Test $\le$ on cardinalities against the three requirements of a partial
      order. *Reflexive*: $|A| \le |A|$, since the identity is injective.
      *Transitive*: $|A| \le |B|$ and $|B| \le |C|$ give $|A| \le |C|$, since a
      composite of injections is injective. *Antisymmetric*: $|A| \le |B|$ and
      $|B| \le |A|$ give $|A| = |B|$ — and this is not a one-liner, it is the
      Schröder–Bernstein theorem. So $\le$ partially orders the cardinalities.

      Totality is a different matter entirely. The claim is that for all $A$ and
      $B$, either $|A| \le |B|$ or $|B| \le |A|$: any two sets are comparable in
      size. This is *not* provable in $\mathrm{ZF}$. It follows from the axiom
      of choice, and the standard derivation uses Zorn's lemma: order the
      partial injections from $A$ to $B$ — functions defined on a subset of $A$,
      injective into $B$ — by extension, check that the union of a chain of such
      is again one, and take a maximal element. A maximal partial injection must
      be defined on all of $A$ or onto all of $B$, since otherwise there is an
      unused element on each side and it could be extended by pairing them. That
      gives an injection one way or the other.

      The converse holds too: comparability of all cardinalities implies the
      axiom of choice. So "any two sets can be compared in size" is not a mild
      structural fact but a full-strength choice principle. Without choice, two
      sets can be genuinely incomparable — neither injects into the other — and
      the partial order really is only partial.
    worked: >
      Use antisymmetry to compute a cardinality without ever building a
      bijection. Take $A = \mathbb{Q}$ and $B = \mathbb{N}$. The inclusion
      $\mathbb{N} \to \mathbb{Q}$ is an injection, so $|\mathbb{N}| \le
      |\mathbb{Q}|$. In the other direction, $\mathbb{Q}$ is countable, so by
      the countability criteria there is an injection $\mathbb{Q} \to
      \mathbb{N}$, giving $|\mathbb{Q}| \le |\mathbb{N}|$. Antisymmetry — that
      is, Schröder–Bernstein — now yields $|\mathbb{Q}| = |\mathbb{N}| =
      \aleph_0$.

      Compare that with the work done earlier: an explicit enumeration of the
      positive rationals, grouped by $p+q$ and filtered for lowest terms. Both
      reach the same conclusion, and only one of them required care about
      duplicates. That is the trade the theorem offers, and from here on it is
      almost always worth taking.
    pitfalls: >
      Antisymmetry is not free — it *is* Schröder–Bernstein, so a proof that
      uses "two injections, hence equal" is using a substantial theorem and
      should say so. Do not slide from partial order to total order: without the
      axiom of choice two cardinalities may be incomparable, so "either $|A| \le
      |B|$ or $|B| \le |A|$" is a hypothesis, not a step. And a maximal partial
      injection produced by Zorn's lemma is maximal, not greatest: what the
      argument extracts from it is that it cannot be extended, and nothing more.
    recap: >
      Cardinal comparison is a partial order — reflexive, transitive, and
      antisymmetric by Schröder–Bernstein — while totality is exactly as strong
      as the axiom of choice.
    steps:
      - teach: >
          Now that $\le$ on cardinalities has a supporting theorem, check it
          against the axioms of a partial order. Reflexivity is the identity map;
          transitivity is composition of injections. Both are one line.
      - ask: >
          Transitivity is composition. If $f : \{1,2,3\} \to \mathbb{N}$ is
          $f(k) = 2k$ and $g : \mathbb{N} \to \mathbb{N}$ is $g(n) = n^{2}$, the
          composite is the injection witnessing the chained inequality. What
          does it send $3$ to?
        expects: "36"
        hint: >
          Apply $f$ first, then $g$.
        feedback: >
          $36$. Here $f(3) = 6$ and $g(6) = 36$, so $(g \circ f)(3) = 36$. Both
          maps are injective, so the composite is, and that is the entire proof
          of transitivity.
      - teach: >
          Antisymmetry is the interesting one: $|A| \le |B|$ and $|B| \le |A|$
          give $|A| = |B|$. That is precisely the Schröder–Bernstein theorem, so
          the third axiom costs a full theorem rather than a line.
      - ask: >
          Use antisymmetry on $\mathbb{Q}$. Which pair of facts gives
          $|\mathbb{Q}| = \aleph_0$ with no enumeration built by hand?
        choices:
          - text: >
              The inclusion $\mathbb{N} \to \mathbb{Q}$, and an injection
              $\mathbb{Q} \to \mathbb{N}$ from countability
            correct: true
            feedback: >
              Exactly: $|\mathbb{N}| \le |\mathbb{Q}|$ from the inclusion,
              $|\mathbb{Q}| \le |\mathbb{N}|$ from countability, and
              Schröder–Bernstein closes the gap — no worrying about duplicate
              fractions.
          - text: >
              A surjection $\mathbb{Q} \to \mathbb{N}$ and a surjection
              $\mathbb{N} \to \mathbb{Q}$
            feedback: >
              Antisymmetry is stated for injections. Two surjections do give the
              conclusion, but only via the axiom of choice, which is a strictly
              stronger assumption than the theorem needs.
          - text: >
              That $\mathbb{Q}$ is dense in $\mathbb{R}$ and $\mathbb{R}$ is
              uncountable
            feedback: >
              Density says nothing about cardinality, and the uncountability of
              $\mathbb{R}$ bounds $\mathbb{Q}$ from neither side.
        feedback: >
          One injection each way, then the theorem. This is the standard way to
          compute a cardinality from now on.
      - teach: >
          Totality is the axiom that does not come free. "For all $A$ and $B$,
          either $|A| \le |B|$ or $|B| \le |A|$" is not provable in
          $\mathrm{ZF}$: two sets may be genuinely incomparable in size.
      - teach: >
          With the axiom of choice it does hold, by Zorn's lemma. Order the
          partial injections from $A$ to $B$ by extension, check that a chain of
          them has the union as an upper bound, and take a maximal one.
      - ask: >
          Why must a maximal partial injection be defined on all of $A$ or onto
          all of $B$?
        choices:
          - text: >
              Because otherwise there is an unused element on each side, and
              pairing them extends the injection
            correct: true
            feedback: >
              Exactly — an unused $a \in A$ and an unused $b \in B$ could be
              matched, producing a strictly larger partial injection and
              contradicting maximality. So one of the two sides must be
              exhausted.
          - text: >
              Because a maximal element of a poset is a greatest element
            feedback: >
              It is not. Maximal means nothing lies strictly above it; greatest
              means it lies above everything. Zorn only ever delivers the former.
          - text: >
              Because every chain of partial injections has an upper bound
            feedback: >
              That is the hypothesis that lets Zorn apply, not the reason a
              maximal element is total or onto. That reason is the extension
              argument.
        feedback: >
          The extension argument is the whole content: an incomplete pairing
          with slack on both sides is not maximal.
      - teach: >
          The converse holds as well — comparability of all cardinalities
          implies the axiom of choice — so "any two sets can be compared in size"
          is not a mild structural fact but a full-strength choice principle.

  - node: foundations.cardinality.continuum-cardinality
    hook: >
      Cantor's theorem produced an uncountable set out of $\mathbb{N}$, and the
      diagonal argument produced another out of decimals. This proposition says
      they are the *same* uncountable set, which is why the size of the line is
      written $2^{\aleph_0}$.
    explanation: >
      Claim: $\mathbb{R} \approx \mathcal{P}(\mathbb{N})$. The common cardinality
      is called the cardinality of the continuum, written $\mathfrak{c}$ or
      $2^{\aleph_0}$. Building a bijection directly is unpleasant, so use
      Schröder–Bernstein and produce one injection each way.

      From subsets to reals: send $S \subseteq \mathbb{N}$ to $\sum_{n \in S}
      3^{-(n+1)}$. Read that as a base-$3$ expansion whose $n$-th digit is $1$
      when $n \in S$ and $0$ when it is not, so the number records $S$ digit by
      digit. It converges, being dominated by a geometric series, and distinct
      sets give distinct numbers — this is exactly the ambiguity check from the
      diagonal argument, and base $3$ passes it. In base $2$ the strings
      $0.0111\dots$ and $0.1000\dots$ name the same number and the map would not
      be injective; using only the digits $0$ and $1$ out of the three available
      in base $3$ leaves too much room between values for any collision.

      From reals to subsets: send $x \in \mathbb{R}$ to $\{q \in \mathbb{Q} : q
      < x\}$, the set of rationals below it. This is injective because
      $\mathbb{Q}$ is dense in $\mathbb{R}$: if $x < y$ then some rational lies
      strictly between them, and that rational belongs to the second set and not
      the first, so the two sets differ. The values land in
      $\mathcal{P}(\mathbb{Q})$ rather than $\mathcal{P}(\mathbb{N})$ — but
      $\mathbb{Q}$ is countable, and a bijection $\mathbb{Q} \to \mathbb{N}$
      carries subsets to subsets bijectively, so $\mathcal{P}(\mathbb{Q})
      \approx \mathcal{P}(\mathbb{N})$.

      Two injections, so $|\mathbb{R}| = |\mathcal{P}(\mathbb{N})|$. Combined
      with Cantor's theorem, which gives $|\mathbb{N}| <
      |\mathcal{P}(\mathbb{N})|$, this is a second and completely
      decimal-free proof that $\mathbb{R}$ is uncountable.
    worked: >
      Push a specific set through the first injection. Take $S = \{0, 2, 3\}
      \subseteq \mathbb{N}$. The recipe gives $3^{-(0+1)} + 3^{-(2+1)} +
      3^{-(3+1)} = \dfrac{1}{3} + \dfrac{1}{27} + \dfrac{1}{81}$. Put those over
      the common denominator $81$: $\dfrac{27}{81} + \dfrac{3}{81} +
      \dfrac{1}{81} = \dfrac{31}{81}$.

      Read the answer as a base-$3$ expansion and the encoding is visible:
      $31/81 = 0.1011$ in base $3$, whose digits after the point are $1, 0, 1,
      1$ — precisely the membership pattern of $S$ in positions $0, 1, 2, 3$.
      Every subset of $\mathbb{N}$ gets its own real number this way, so
      $|\mathcal{P}(\mathbb{N})| \le |\mathbb{R}|$.
    pitfalls: >
      Base $2$ is the natural first attempt and it fails: $\{1,2,3,\dots\}$ and
      $\{0\}$ would both map to $1/2$, since $0.0111\dots = 0.1000\dots$ in
      binary, so the map would not be injective. The second injection lands in
      $\mathcal{P}(\mathbb{Q})$, and the step to $\mathcal{P}(\mathbb{N})$ needs
      the countability of $\mathbb{Q}$ — leaving it out leaves the proof
      incomplete. And note that neither map is anywhere near surjective; the
      equality comes from Schröder–Bernstein, not from either map being a
      bijection.
    recap: >
      A real number carries exactly as much information as a set of naturals,
      established by an injection each way and Schröder–Bernstein, which is why
      the size of the continuum is written $2^{\aleph_0}$.
    steps:
      - teach: >
          Two different arguments produced uncountable sets: the diagonal
          argument gave $\mathbb{R}$, Cantor's theorem gave
          $\mathcal{P}(\mathbb{N})$. The claim now is that these are the same
          size, and the tool is one injection each way.
      - teach: >
          From subsets to reals: send $S \subseteq \mathbb{N}$ to $\sum_{n \in
          S} 3^{-(n+1)}$. That is a base-$3$ expansion whose $n$-th digit is $1$
          exactly when $n \in S$, so the number is a transcript of $S$.
      - ask: >
          What does the set $S = \{1,2\}$ map to under that injection?
        expects: "4/27"
        hint: >
          Add $3^{-2}$ and $3^{-3}$ over a common denominator.
        feedback: >
          $\dfrac{1}{9} + \dfrac{1}{27} = \dfrac{3}{27} + \dfrac{1}{27} =
          \dfrac{4}{27}$. In base $3$ that is $0.011$, whose digits record
          membership at positions $0$, $1$ and $2$ — absent, present, present —
          which is exactly $S$.
      - ask: >
          Why base $3$ with digits $0$ and $1$, rather than base $2$?
        choices:
          - text: >
              Because a base-$2$ sum might diverge
            feedback: >
              It converges perfectly well: $\sum_{n \in S} 2^{-(n+1)}$ is
              bounded by $1$. Convergence is not the issue.
          - text: >
              Because in base $2$ different sets can give the same number, as
              $0.0111\dots = 0.1000\dots$
            correct: true
            feedback: >
              Exactly the ambiguity from the diagonal argument, met again.
              $\{1,2,3,\dots\}$ and $\{0\}$ would both map to $1/2$ in base $2$.
              Using only two of the three available digits in base $3$ leaves
              gaps between values, so no collision is possible.
          - text: >
              Because $\mathcal{P}(\mathbb{N})$ has three elements for each
              natural number
            feedback: >
              A subset makes a two-way decision at each natural number. The base
              is chosen for the injectivity check, not to match a count.
        feedback: >
          Whenever an object is encoded by digits, the same question arises: can
          two codes name the same object? Base $3$ answers no.
      - teach: >
          From reals to subsets: send $x$ to $\{q \in \mathbb{Q} : q < x\}$. If
          $x < y$ then density of $\mathbb{Q}$ puts a rational strictly between
          them, and that rational lies in the second set and not the first — so
          the map is injective.
      - ask: >
          That map lands in $\mathcal{P}(\mathbb{Q})$, not
          $\mathcal{P}(\mathbb{N})$. What closes the gap?
        choices:
          - text: >
              $\mathbb{Q}$ is countable, and a bijection $\mathbb{Q} \to
              \mathbb{N}$ carries subsets to subsets bijectively
            correct: true
            feedback: >
              Right: a bijection between the ground sets induces a bijection
              between their power sets, so $\mathcal{P}(\mathbb{Q}) \approx
              \mathcal{P}(\mathbb{N})$ and the injection can be composed into
              the right target.
          - text: >
              $\mathbb{Q}$ is dense in $\mathbb{R}$, so
              $\mathcal{P}(\mathbb{Q})$ and $\mathcal{P}(\mathbb{N})$ are the
              same set
            feedback: >
              Density was already used, to prove the map injective, and it says
              nothing about power sets. They are certainly not the same set —
              equinumerous is the most that is claimed.
          - text: >
              $\mathbb{Q} \subseteq \mathbb{R}$, so every subset of $\mathbb{Q}$
              is a subset of $\mathbb{N}$
            feedback: >
              Subsets of $\mathbb{Q}$ contain rationals such as $1/2$, which are
              not natural numbers. The transfer has to go through a bijection,
              not an inclusion.
        feedback: >
          Countability of $\mathbb{Q}$ is doing quiet work in a theorem about
          the *uncountable*. That is typical: countable scaffolding, uncountable
          conclusion.
      - teach: >
          Two injections and Schröder–Bernstein give $|\mathbb{R}| =
          |\mathcal{P}(\mathbb{N})|$. This common size is the cardinality of the
          continuum, written $\mathfrak{c}$ or $2^{\aleph_0}$ — the second
          notation recording that a subset of $\mathbb{N}$ is a two-way choice
          at each of $\aleph_0$ places.
      - teach: >
          Combine it with Cantor's theorem and you get $|\mathbb{N}| <
          |\mathcal{P}(\mathbb{N})| = |\mathbb{R}|$: a second proof that
          $\mathbb{R}$ is uncountable, this one with no decimals in it anywhere.

  - node: foundations.cardinality.continuum-hypothesis
    hook: >
      You now know $|\mathbb{N}| < |\mathbb{R}|$. The obvious next question — is
      there anything in between? — is the most famous question in set theory,
      and the answer is that it has no answer.
    explanation: >
      The *continuum hypothesis* asserts that there is no set $A$ with
      $|\mathbb{N}| < |A| < |\mathbb{R}|$. Equivalently: every uncountable
      subset of $\mathbb{R}$ is equinumerous with $\mathbb{R}$, so an infinite
      set of reals is either countable or as big as the whole line, with nothing
      in the middle.

      Separate the two claims carefully. That $|\mathbb{N}| < |\mathbb{R}|$ is a
      *theorem* — the diagonal argument, proved and finished. The hypothesis is
      the further assertion that the gap between those two sizes contains
      nothing. That extra claim is what has no proof.

      And "no proof" here means something sharper than "nobody has found one".
      Gödel showed in 1940 that if $\mathrm{ZFC}$ is consistent, then so is
      $\mathrm{ZFC}$ together with the continuum hypothesis. Cohen showed in
      1963 that if $\mathrm{ZFC}$ is consistent, then so is $\mathrm{ZFC}$
      together with its negation. Between them: the standard axioms of set
      theory settle neither the hypothesis nor its denial. It is *independent*
      of $\mathrm{ZFC}$, in the same technical sense in which the parallel
      postulate is independent of the other axioms of geometry.

      So the hypothesis is recorded here as a statement and nothing else —
      nothing in this unit assumes it, and no result proved here depends on
      which way you settle it. The generalised continuum hypothesis makes the
      same claim one rung further up for every infinite $X$: no cardinality lies
      strictly between $|X|$ and $|\mathcal{P}(X)|$.
    pitfalls: >
      Independent does not mean unknown, and it does not mean false: it means
      the axioms have nothing to say, so both the hypothesis and its negation
      can be added consistently. Do not confuse the hypothesis with the theorem
      it builds on — $|\mathbb{N}| < |\mathbb{R}|$ is proved, and only the
      "nothing in between" part is undecided. And note that the hypothesis
      concerns cardinalities strictly between two given ones; it does not claim
      that $\mathbb{R}$ is the second-smallest infinite set in some absolute
      sense that would settle the sizes further up the ladder.
    recap: >
      The continuum hypothesis says nothing sits strictly between
      $|\mathbb{N}|$ and $|\mathbb{R}|$, and the standard axioms of set theory
      can neither prove nor refute it.
    steps:
      - teach: >
          The diagonal argument put $\mathbb{R}$ strictly above $\mathbb{N}$.
          The natural question is whether it is the *next* size up, or whether
          some set squeezes in between.
      - teach: >
          The continuum hypothesis is the assertion that nothing does: there is
          no set $A$ with $|\mathbb{N}| < |A| < |\mathbb{R}|$. Equivalently,
          every uncountable subset of $\mathbb{R}$ is equinumerous with the
          whole of $\mathbb{R}$.
      - ask: >
          Which part of that is already a theorem?
        choices:
          - text: >
              That $|\mathbb{N}| < |\mathbb{R}|$
            correct: true
            feedback: >
              Yes — that is the diagonal argument, proved outright. The
              hypothesis is only the additional claim that the gap between those
              two sizes is empty.
          - text: >
              That no set lies strictly between them
            feedback: >
              That is precisely the undecided part. It is the hypothesis, not a
              theorem.
          - text: >
              That every uncountable set is equinumerous with $\mathbb{R}$
            feedback: >
              This is false as stated — $\mathcal{P}(\mathbb{R})$ is uncountable
              and strictly larger than $\mathbb{R}$ by Cantor's theorem. Even
              restricted to subsets of $\mathbb{R}$ it is exactly the
              hypothesis, not a theorem.
        feedback: >
          Keep the two apart. One is settled and used throughout this unit; the
          other is a statement recorded and never assumed.
      - teach: >
          Gödel showed in 1940 that $\mathrm{ZFC}$ together with the continuum
          hypothesis is consistent if $\mathrm{ZFC}$ is. Cohen showed in 1963
          that $\mathrm{ZFC}$ together with its *negation* is consistent too.
      - ask: >
          What do those two results together establish?
        choices:
          - text: >
              That the continuum hypothesis is false
            feedback: >
              Cohen's half shows the negation is consistent; Gödel's half shows
              the hypothesis is too. Neither is refuted, which is the whole
              point.
          - text: >
              That the continuum hypothesis is independent of $\mathrm{ZFC}$ —
              neither provable nor refutable from those axioms
            correct: true
            feedback: >
              Exactly. The standard axioms leave the question open in a precise
              and permanent sense: both answers can be adopted without
              introducing a contradiction that was not already there.
          - text: >
              That set theory is inconsistent
            feedback: >
              Both results are conditional on the consistency of $\mathrm{ZFC}$
              and neither threatens it. Independence is a normal feature of
              axiom systems, not a symptom of trouble.
        feedback: >
          The situation is exactly that of the parallel postulate in geometry:
          the remaining axioms decide nothing, and both extensions are
          coherent.
      - teach: >
          So "independent" is a much stronger statement than "open". It is not
          that a proof is missing; it is that no proof exists to be found, and
          the same for a refutation.
      - ask: >
          What does the *generalised* continuum hypothesis add?
        choices:
          - text: >
              That for every infinite $X$, no cardinality lies strictly between
              $|X|$ and $|\mathcal{P}(X)|$
            correct: true
            feedback: >
              Right — the same "nothing in between" claim made at every rung of
              the ladder rather than only at the bottom one. Cantor's theorem
              guarantees the strict inequality; the hypothesis is about the gap.
          - text: >
              That $|\mathcal{P}(X)|$ is strictly bigger than $|X|$ for every
              infinite $X$
            feedback: >
              That is Cantor's theorem, proved and unconditional. No hypothesis
              is needed for it.
          - text: >
              That every set can be well-ordered
            feedback: >
              That is the well-ordering theorem, equivalent to the axiom of
              choice, and a separate matter entirely.
        feedback: >
          One statement, repeated up the ladder. Like the original, it is
          recorded and not assumed — nothing else in this unit depends on it.

  - node: foundations.cardinality.algebraic-countable
    hook: >
      Every number you can name by an equation with integer coefficients —
      $\sqrt{2}$, the golden ratio, all the roots of every polynomial you will
      ever write down — fits into a single list. That is the last and most
      striking countability result of the unit.
    explanation: >
      Call a real or complex number $\alpha$ *algebraic* if $p(\alpha) = 0$ for
      some nonzero polynomial $p$ with integer coefficients, and
      *transcendental* otherwise. Every rational $p/q$ is algebraic, being a
      root of $qx - p$, and so is $\sqrt{2}$, a root of $x^{2} - 2$. Claim: the
      algebraic numbers are countably infinite.

      The proof counts polynomials first. A polynomial of degree at most $d$ is
      determined by its coefficient vector in $\mathbb{Z}^{d+1}$, and
      $\mathbb{Z}^{d+1}$ is countable as a finite product of countable sets. So
      for each fixed $d$ there are only countably many integer polynomials of
      degree at most $d$. The set of *all* nonzero integer polynomials is the
      union over $d \in \mathbb{N}$ of those countable sets — a countable union
      of countable sets, hence countable.

      Now count roots. A nonzero polynomial of degree $d$ has at most $d$ roots,
      so each polynomial contributes a finite set of algebraic numbers, and the
      algebraic numbers are the union of those finite sets, indexed by the
      countable set of polynomials. A countable union of finite sets is
      countable. Infinitude is free: every integer $n$ is algebraic as a root of
      $x - n$.

      Take in what has been counted. There are only countably many *equations*
      to write, because an equation is a finite list of integers, and each
      equation admits only finitely many solutions. Countably many finite
      harvests make a countable crop, however wildly the individual roots
      behave.
    worked: >
      Confirm that $\alpha = \sqrt{2} + \sqrt{3}$ is algebraic by producing its
      polynomial. Square it: $\alpha^{2} = 2 + 2\sqrt{6} + 3 = 5 + 2\sqrt{6}$.
      Isolate the surd: $\alpha^{2} - 5 = 2\sqrt{6}$. Square again: $\alpha^{4} -
      10\alpha^{2} + 25 = 4 \times 6 = 24$. So $\alpha^{4} - 10\alpha^{2} + 1 =
      0$, and $\alpha$ is a root of $x^{4} - 10x^{2} + 1$, a nonzero polynomial
      with integer coefficients. Hence $\sqrt{2} + \sqrt{3}$ is algebraic.

      Its coefficient vector is $(1, 0, -10, 0, 1) \in \mathbb{Z}^{5}$, which is
      the point of the proof: this number is fully pinned down by five integers,
      together with a note of which of the at most four roots is meant. Five
      integers is a point of a countable set, and that is all the counting the
      theorem needs.
    pitfalls: >
      The polynomial must be *nonzero*: the zero polynomial vanishes at every
      number, so allowing it would make everything algebraic and the argument
      would prove nothing. The proof also needs the degree bound on roots —
      finitely many roots per polynomial — since a countable union of *countable*
      sets would still be countable but a countable union of arbitrary sets
      would not. And countability of the algebraic numbers is not a statement
      that they are easy to find: it counts them, and says nothing about
      deciding whether a given number is one.
    recap: >
      Each algebraic number is pinned down by a finite list of integers and a
      choice among finitely many roots, and there are only countably many such
      descriptions, so all the roots of all integer polynomials together form a
      single list.
    steps:
      - teach: >
          A number is algebraic if it is a root of some nonzero polynomial with
          integer coefficients, and transcendental if it is not. Every rational
          $p/q$ is algebraic, being a root of $qx - p$; so is $\sqrt{2}$, a root
          of $x^{2} - 2$.
      - teach: >
          The counting starts with the polynomials, not the numbers. A
          polynomial of degree at most $d$ is exactly a coefficient vector in
          $\mathbb{Z}^{d+1}$, which is countable as a finite product of
          countable sets.
      - ask: >
          How many polynomials of degree at most $2$ have all their coefficients
          in $\{-1, 0, 1\}$ and are nonzero?
        expects: "26"
        hint: >
          Count all coefficient triples first, then discard the one that gives
          the zero polynomial.
        feedback: >
          $26$. There are $3^{3} = 27$ coefficient triples $(a,b,c)$ with
          entries in $\{-1,0,1\}$, and exactly one of them, $(0,0,0)$, gives the
          zero polynomial, which is excluded. Restricting the coefficient range
          keeps the count finite — and letting it grow through all of
          $\mathbb{Z}^{3}$ keeps it countable.
      - teach: >
          Taking the union over all degrees $d \in \mathbb{N}$ makes the set of
          all nonzero integer polynomials a countable union of countable sets,
          hence countable. There are only countably many equations to write
          down.
      - ask: >
          At most how many roots can a nonzero integer polynomial of degree $5$
          have?
        expects: "5"
        hint: >
          A nonzero polynomial has at most as many roots as its degree.
        feedback: >
          At most $5$. Each polynomial therefore contributes a *finite* set of
          algebraic numbers, and the algebraic numbers are the union of those
          finite sets over the countably many polynomials — a countable union of
          finite sets, so countable.
      - teach: >
          Infinitude needs one line: every integer $n$ is a root of $x - n$, so
          there are already infinitely many algebraic numbers. Countable and
          infinite means countably infinite.
      - ask: >
          Where exactly would the proof break if the zero polynomial were
          allowed?
        choices:
          - text: >
              The set of polynomials would stop being countable
            feedback: >
              Adding one element to a countable set leaves it countable. The
              damage is elsewhere.
          - text: >
              The zero polynomial vanishes everywhere, so every number would
              count as algebraic and the "finitely many roots" step would fail
            correct: true
            feedback: >
              Exactly. The degree bound on roots is what makes each polynomial
              contribute a finite set, and the zero polynomial contributes
              everything — which would make the conclusion say nothing at all.
          - text: >
              Nothing — the zero polynomial has no roots
            feedback: >
              It has every number as a root: $0 = 0$ holds whatever you
              substitute. That is precisely why it must be excluded.
        feedback: >
          Two finiteness facts carry the theorem: an equation is a finite list
          of integers, and it has finitely many solutions. Remove either and the
          count collapses.
      - ask: >
          Show that $\sqrt{2} + \sqrt{3}$ is algebraic. Which polynomial does it
          satisfy?
        choices:
          - text: >
              $x^{4} - 10x^{2} + 1$
            correct: true
            feedback: >
              Square $\alpha = \sqrt{2} + \sqrt{3}$ to get $5 + 2\sqrt{6}$, so
              $\alpha^{2} - 5 = 2\sqrt{6}$; squaring again gives $\alpha^{4} -
              10\alpha^{2} + 25 = 24$, that is, $\alpha^{4} - 10\alpha^{2} + 1 =
              0$. Five integers pin the number down.
          - text: >
              $x^{2} - 5$
            feedback: >
              That is satisfied by $\sqrt{5}$, not by $\sqrt{2} + \sqrt{3}$:
              squaring the latter gives $5 + 2\sqrt{6}$, not $5$. The cross term
              is what forces a fourth-degree polynomial.
          - text: >
              $x^{2} - 6$
            feedback: >
              That is the polynomial of $\sqrt{6}$, which is the product of
              $\sqrt2$ and $\sqrt3$ rather than their sum. Sums of surds
              generally need a higher degree than the pieces do.
        feedback: >
          Two squarings clear both radicals, and the result is a coefficient
          vector $(1,0,-10,0,1)$ — one point of a countable set, which is
          exactly what the theorem counts.

  - node: foundations.cardinality.transcendental-exist
    hook: >
      Here is the payoff of the whole unit: a proof that numbers beyond all
      algebra exist, which works by counting and names not one of them.
    explanation: >
      A transcendental number is a real (or complex) number that satisfies no
      nonzero polynomial with integer coefficients. Do any exist? Count.

      The real algebraic numbers form a countable subset of $\mathbb{R}$, and
      $\mathbb{R}$ is uncountable. A countable set cannot exhaust an uncountable
      one — if it did, $\mathbb{R}$ would be countable — so some real number is
      not algebraic. Transcendental numbers exist.

      A second turn of the same handle says much more. $\mathbb{R}$ is the union
      of the algebraic reals and the transcendental reals. If the transcendental
      reals were countable, then $\mathbb{R}$ would be the union of two countable
      sets, hence countable, which it is not. So the transcendental reals are
      uncountable: in the sense of cardinality, almost every real number is
      transcendental. And since every rational is algebraic, every
      transcendental is in particular irrational, so the same count shows the
      irrationals to be uncountable too.

      What is remarkable is what the proof does not do. It names no
      transcendental number, exhibits no equation, computes no digits. It is a
      non-constructive existence proof of the purest kind: it counts the
      candidates, finds them too few to fill the line, and concludes that
      something else must be there. Producing an actual example is a separate
      and much harder problem — Liouville constructed the first explicit
      transcendental in 1844, Hermite proved $e$ transcendental in 1873, and
      Lindemann proved $\pi$ transcendental in 1882, thereby settling the
      ancient question of squaring the circle in the negative.
    worked: >
      Apply the count inside a tiny interval, where intuition is least helpful.
      Is there a transcendental number between $0$ and $0.001$? The map $x
      \mapsto x/1000$ is a bijection from $[0,1]$ onto $[0, 0.001]$ — injective
      because $x/1000 = y/1000$ forces $x = y$, and surjective because any $y$
      in the small interval is the image of $1000y$ in $[0,1]$. Since $[0,1]$ is
      uncountable, so is $[0,0.001]$.

      Now the algebraic numbers lying in $[0,0.001]$ form a subset of the
      algebraic numbers, which are countable, so they are countable. A countable
      subset cannot be all of an uncountable set. Hence some element of
      $[0,0.001]$ is not algebraic: there is a transcendental number between $0$
      and one thousandth. The argument works in every interval, however short —
      and it still has not named a single one of them.
    pitfalls: >
      The count gives existence, not identification: nothing here lets you
      decide whether a particular number, $e + \pi$ say, is transcendental, and
      that question remains open to this day. Do not reverse the roles — it is
      the *algebraic* numbers that are countable and the transcendentals that
      are uncountable, which is the opposite of how the two are usually
      encountered. And "almost every real is transcendental" is a statement
      about cardinality alone; it is not a statement about which numbers turn up
      in practice, where the familiar constants are nearly all algebraic or
      famously hard-won exceptions.
    recap: >
      There are too few algebraic numbers to fill the real line, so
      transcendentals exist and are in fact uncountable — an existence proof
      that produces no example.
    steps:
      - teach: >
          The algebraic numbers are countable. $\mathbb{R}$ is uncountable. Put
          those two facts side by side and something has to give.
      - teach: >
          A countable subset cannot exhaust an uncountable set, since otherwise
          $\mathbb{R}$ would itself be countable. So some real number satisfies
          no integer polynomial: transcendental numbers exist.
      - ask: >
          How many explicit transcendental numbers does that argument produce?
        expects: "0"
        hint: >
          Look back over the steps and ask which one names a number.
        feedback: >
          None — zero. The proof counts candidates, finds them too few to fill
          the line, and concludes that something is left over without ever
          identifying it. This is a non-constructive existence proof in its
          purest form.
      - teach: >
          The same count run once more says much more. If the transcendental
          reals were countable, $\mathbb{R}$ would be a union of two countable
          sets and hence countable. So the transcendentals are *uncountable*: in
          the sense of cardinality, almost every real is transcendental.
      - ask: >
          Which of these follows from that second count?
        choices:
          - text: >
              The irrational numbers are uncountable
            correct: true
            feedback: >
              Yes. Every rational is algebraic, so every transcendental is
              irrational; the irrationals therefore contain an uncountable set
              and are uncountable themselves.
          - text: >
              The algebraic numbers are finite in number
            feedback: >
              They are countably infinite — every integer $n$ is algebraic, as a
              root of $x - n$. Countable is not the same as finite.
          - text: >
              Every irrational number is transcendental
            feedback: >
              $\sqrt{2}$ is irrational and algebraic, being a root of $x^{2} -
              2$. The implication runs the other way: transcendental implies
              irrational, and not conversely.
        feedback: >
          Two countable sets cannot union to an uncountable one, and that single
          observation delivers both the uncountability of the transcendentals
          and the uncountability of the irrationals.
      - teach: >
          The count works inside any interval. Since $x \mapsto x/1000$ is a
          bijection from $[0,1]$ onto $[0,0.001]$, the small interval is
          uncountable too, while the algebraic numbers inside it are still
          countable — so a transcendental lives between $0$ and one thousandth.
      - ask: >
          What is the honest description of what has been proved?
        choices:
          - text: >
              A method for constructing transcendental numbers
            feedback: >
              No construction appears anywhere. The proof never writes down a
              digit or an equation; it compares two cardinalities.
          - text: >
              That transcendentals exist and are uncountable, with no example
              produced
            correct: true
            feedback: >
              Exactly. Existence follows from a shortage of algebraic
              candidates, and exhibiting an actual transcendental is a separate
              and much harder problem.
          - text: >
              That every real number is transcendental
            feedback: >
              The algebraic numbers are real numbers too, and there are
              infinitely many of them. "Almost every" here is a statement about
              cardinality, not a claim that the exceptions are absent.
        feedback: >
          Counting settles existence and stops there — which is exactly the
          shape of a non-constructive existence proof.
      - teach: >
          History bears that out. Liouville constructed the first explicit
          transcendental in 1844, Hermite proved $e$ transcendental in 1873, and
          Lindemann proved $\pi$ transcendental in 1882 — which settled the
          impossibility of squaring the circle, some decades after counting had
          shown such numbers had to exist.
