# The math tree's program (§6.6): every subbranch of the canonical outline as a
# unit, in the order an undergraduate curriculum teaches them, grouped into
# parts by branch. The validator holds the order to a linear extension of
# cross-unit `requires` — except for the four edges declared under `forward:`
# (D15.2), which are the price of the foundations units genuinely needing each
# other: relations ↔ functions (a quotient's canonical projection is a function;
# a function is a relation) and number systems ↔ cardinality (Q is countable
# once Q exists; the tower's intuition looks ahead to Cantor).
#
# Parts follow the branches, and inside a part the order is pedagogical rather
# than alphabetical: sequences after single-variable calculus because that is
# how the corpus was authored (`analysis.sequences` requires `analysis.svc`
# nodes), the abstract algebra chain groups → actions → rings → polynomials →
# modules → fields → Galois, and so on. 67 of the 82 units are outlined but not
# yet authored; the course states that rather than hiding them.

parts:
  - title: "Foundations"
    units:
      - foundations.logic
      - foundations.proof
      - foundations.sets
      - foundations.relations
      - foundations.functions
      - foundations.induction
      - foundations.real
      - foundations.number-systems
      - foundations.cardinality

  - title: "Analysis"
    units:
      - analysis.svc
      - analysis.sequences
      - analysis.mvc
      - analysis.vector-calculus
      - analysis.metric-spaces
      - analysis.function-sequences
      - analysis.measure
      - analysis.complex
      - analysis.fourier

  - title: "Linear Algebra"
    units:
