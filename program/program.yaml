# Cross-unit `requires` edges that point *forward* in this order, each accepted
# with a note saying what the reader brings to the earlier step. The validator
# reports any forward edge not listed here, and any entry here that is not a
# forward edge, so the list is exact.
forward:
  - node: foundations.relations.def-quotient-set
    requires: foundations.functions.def-surjective
    note: >
      The canonical projection onto a quotient is introduced as a map that hits
      every class; "surjective" is used in its everyday sense here and defined
      precisely in the next unit.
  - node: foundations.relations.def-quotient-set
    requires: foundations.functions.def-preimage
    note: >
      Each equivalence class is the set of points the projection sends to it —
      a preimage, named informally here and defined precisely in the next unit.
  - node: foundations.relations.well-defined-on-quotient
    requires: foundations.functions.def-composition
    note: >
      Well-definedness is that a map on classes factors through the projection;
      the reader needs only "apply one map after another", made precise in the
      next unit.
  - node: foundations.number-systems.intuition-tower
    requires: foundations.cardinality.r-uncountable
    note: >
      The intuition that each extension of the number tower "charges for" its
      repair looks ahead to Cantor's diagonal argument, which the next unit
      proves; the reader takes uncountability on trust for one step.
