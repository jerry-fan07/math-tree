unit: analysis.sequences
opening: >
  A limit is the first idea in analysis you cannot settle by looking, so this
  unit replaces looking with a bargain: you name a tolerance, and the sequence
  must produce a point past which every term meets it. From that one definition
  everything here follows — uniqueness of the limit, boundedness, the algebra of
  limits and the squeeze — and then three theorems that cash out the
  completeness of $\mathbb{R}$ as working tools: an increasing sequence under a
  ceiling converges, a bounded sequence always has a convergent subsequence, and
  a sequence converges exactly when its own terms bunch together. The second
  half turns all of it on infinite sums, which are not a new kind of limit but
  the limit of the partial sums, and works through the standard tests —
  comparison, ratio, root, integral, alternating — nearly every one of which is
  secretly a comparison against the geometric series or the harmonic one. By the
  end you should be able to hand back an $N$ for a given $\varepsilon$, prove a
  limit by squeezing, and decide a series you have never seen by naming the
  right test and the right comparator.
lessons:
  - node: analysis.sequences.def-convergence
    hook: >
      Every limit in analysis — of a function, a derivative, an integral, an
      infinite sum — is eventually cashed out as a statement about a sequence.
      This is the definition that turns "gets close to" from something you see
      into something you can prove.
    explanation: >
      Start with a sequence you can compute: $a_n = \frac{3n + 1}{n}$, whose
      terms are $4$, $3.5$, $3.333\ldots$, $3.25$, $3.2$. Divide through and it
      is $3 + \frac{1}{n}$, so it is drifting toward $3$. Saying so is easy;
      saying it in a way that rules out $3.0001$ is the whole problem. Any
      finite stretch of the list is compatible with a great many "limits", so
      the definition cannot be about what you can see.

      Here is the bargain. Someone hands you a tolerance $\varepsilon > 0$ — as
      small as they like — and you must hand back an index $N$ such that every
      term from $a_N$ onward satisfies $|a_n - L| < \varepsilon$. If you can
      always win, $a_n \to L$. The absolute value is a distance, so
      $|a_n - L| < \varepsilon$ says $a_n$ lies in the interval of radius
      $\varepsilon$ centred at $L$: past the index $N$, the whole tail is inside
      that band.

      Do it for real. With $L = 3$ we have $|a_n - 3| = \frac{1}{n}$, so the
      demand $\frac{1}{n} < \varepsilon$ is the demand $n > \frac{1}{\varepsilon}$.
      Challenged with $\varepsilon = 0.1$ you answer $N = 11$; with
      $\varepsilon = 0.001$ you answer $N = 1001$. What you have really produced
      is a rule, $N(\varepsilon) =$ the first integer past $1/\varepsilon$, and
      that single rule answers every challenge at once. This is what a
      convergence proof always looks like: solve $|a_n - L| < \varepsilon$ for
      $n$, and read off $N$.

      The quantifier order carries the content. $\varepsilon$ comes first and
      $N$ second, so $N$ is allowed to depend on $\varepsilon$ and grow without
      bound as the tolerance shrinks. Reversing them would say one $N$ serves
      every tolerance, which forces $a_n$ to be exactly $L$ from that point on.
      Note also that only the tail is constrained: nothing before $N$ is
      mentioned, so changing finitely many terms changes neither convergence nor
      the limit.
    worked: >
      Show $\frac{2n + 3}{n + 1} \to 2$ and produce the threshold for
      $\varepsilon = 0.001$. First compute the distance:
      $\left| \frac{2n + 3}{n + 1} - 2 \right| =
      \left| \frac{2n + 3 - 2n - 2}{n + 1} \right| = \frac{1}{n + 1}$. Now solve
      the demand: $\frac{1}{n + 1} < 0.001$ holds exactly when $n + 1 > 1000$,
      that is when $n \ge 1000$. So $N = 1000$ works, and no smaller $N$ does,
      since $n = 999$ gives distance exactly $0.001$, which is not less than
      $0.001$. For a general $\varepsilon$ the same line gives
      $n > \frac{1}{\varepsilon} - 1$, so taking $N$ to be any integer past
      $\frac{1}{\varepsilon}$ always works — the bargain is won for every
      tolerance, and the limit is $2$.
    pitfalls: >
      Reversing the quantifiers is the standard wreck: "there is $N$ such that
      for every $\varepsilon > 0$, $|a_n - L| < \varepsilon$ for $n \ge N$" says
      the terms are eventually *equal* to $L$, a far stronger and almost always
      false claim. Second, "each term is closer to $L$ than the last" is not
      convergence to $L$: the terms of $1 + \frac{1}{n}$ move steadily closer to
      $0$ and never get within $1$ of it. Third, one $\varepsilon$ proves
      nothing — the definition is a promise about *every* positive tolerance, so
      exhibiting a single successful $N$ is the start of the argument, not the
      end.
    recap: >
      Convergence is a promise you can keep for every tolerance: given
      $\varepsilon > 0$ you can name an index past which every term sits within
      $\varepsilon$ of the limit, and $N$ is allowed to depend on
      $\varepsilon$.
    steps:
      - teach: >
          The terms $4, 3.5, 3.333\ldots, 3.25, 3.2$ of $a_n = 3 + \frac{1}{n}$
          are clearly heading for $3$. But no finite stretch of a list can rule
          out $3.0001$, so "heading for" has to be made into a test you can run.
      - teach: >
          The test is a bargain. Someone names a tolerance $\varepsilon > 0$;
          you must name an index $N$ with $|a_n - L| < \varepsilon$ for every
          $n \ge N$. Win for every $\varepsilon$ and $a_n \to L$.
      - teach: >
          Play one round with $a_n = 3 + \frac{1}{n}$ and $L = 3$. The distance
          is $|a_n - 3| = \frac{1}{n}$, so $\varepsilon = 0.1$ demands
          $\frac{1}{n} < 0.1$, that is $n > 10$. Answer: $N = 11$.
      - ask: >
          Now the tolerance is $\varepsilon = 0.01$. For $a_n = 3 + \frac{1}{n}$,
          what is the smallest $N$ such that $|a_n - 3| < 0.01$ for every
          $n \ge N$?
        expects: "101"
        hint: >
          Solve $\frac{1}{n} < 0.01$ for $n$, then take the first integer that
          satisfies it.
        feedback: >
          $N = 101$. The distance is $\frac{1}{n}$, and $\frac{1}{n} < 0.01$
          exactly when $n > 100$. At $n = 100$ the distance is exactly $0.01$,
          which is not strictly less, so $100$ fails and $101$ is the first
          index that works.
      - teach: >
          What you actually produced is a rule: $N(\varepsilon)$ is the first
          integer past $\frac{1}{\varepsilon}$. One rule answers every
          challenge, which is what "for every $\varepsilon$" demands — not one
          lucky threshold but a recipe for all of them.
      - ask: >
          Which statement is the definition of $a_n \to L$?
        choices:
          - text: >
              There is an $N$ such that for every $\varepsilon > 0$,
              $|a_n - L| < \varepsilon$ for all $n \ge N$.
            feedback: >
              This is the quantifiers reversed. One $N$ serving every tolerance
              forces $|a_n - L|$ to be smaller than every positive number, so
              $a_n = L$ exactly from $N$ onward — almost never true.
          - text: >
              For every $\varepsilon > 0$ there is an $N$ such that
              $|a_n - L| < \varepsilon$ for all $n \ge N$.
            correct: true
            feedback: >
              Tolerance first, threshold second: $N$ may depend on
              $\varepsilon$ and usually grows as $\varepsilon$ shrinks.
          - text: >
              For every $\varepsilon > 0$ and every $N$,
              $|a_n - L| < \varepsilon$ for all $n \ge N$.
            feedback: >
              Taking $N = 1$ would force every term to be within every
              tolerance of $L$, so again $a_n = L$ for all $n$. The point of
              $N$ is that early terms are exempt.
        feedback: >
          Order is the content. $\varepsilon$ is given, $N$ is produced in
          response, and any larger $N$ works too — so you never have to find the
          smallest one.
      - teach: >
          Nothing before $N$ is mentioned, so only the tail is constrained.
          Replace the first million terms of a convergent sequence with anything
          you like and it still converges, to the same limit.
      - ask: >
          Let $a_n = \frac{1}{n}$, so $a_n \to 0$. Which modification destroys
          convergence to $0$?
        choices:
          - text: >
              Replace $a_1$ through $a_{1000}$ by $7$.
            feedback: >
              Finitely many terms are invisible to the definition. Any
              $\varepsilon$ is still met from $N = 1001$ onward, and the limit
              is still $0$.
          - text: >
              Replace every term with an even index by $7$.
            correct: true
            feedback: >
              That is infinitely many terms at distance $7$ from $0$, and they
              appear past every index — so no $N$ can work for
              $\varepsilon = 1$.
          - text: >
              Delete the first ten terms and renumber.
            feedback: >
              Discarding a finite block just shifts every threshold down by ten.
              The tail is untouched, so the limit is untouched.
        feedback: >
          The definition looks only at tails, so the question to ask is always
          whether the offending terms recur past every index or stop.
      - teach: >
          The pattern to carry forward: to prove a limit, compute
          $|a_n - L|$, solve $|a_n - L| < \varepsilon$ for $n$, and read off
          $N$. Almost every proof in this unit ends in exactly that move.

  - node: analysis.sequences.limit-unique
    hook: >
      You have been writing $\lim_{n \to \infty} a_n = L$ with a definite
      article and an equals sign. Both are unlicensed until you know a sequence
      cannot approach two different numbers at once.
    explanation: >
      Suppose, for contradiction's sake, that both $a_n \to L$ and $a_n \to M$.
      The definition is available twice over, once for each claim, and each
      instance may be run with a tolerance of your choosing. That freedom is the
      whole proof.

      Let $\varepsilon > 0$ be given, and spend it in two halves. From
      $a_n \to L$ get $N_1$ with $|a_n - L| < \frac{\varepsilon}{2}$ for
      $n \ge N_1$; from $a_n \to M$ get $N_2$ with
      $|a_n - M| < \frac{\varepsilon}{2}$ for $n \ge N_2$. Neither threshold
      controls the other, so take $n \ge \max(N_1, N_2)$: past that index both
      estimates hold simultaneously. Now insert that single term between the two
      candidate limits with the triangle inequality:
      $|L - M| \le |L - a_n| + |a_n - M| < \frac{\varepsilon}{2} +
      \frac{\varepsilon}{2} = \varepsilon$.

      Read what has been proved. The number $|L - M|$ is fixed — it does not
      depend on $n$ or on $\varepsilon$ — and it has just been shown smaller
      than $\varepsilon$, for an arbitrary $\varepsilon > 0$. A nonnegative
      number smaller than every positive number can only be $0$: if $|L - M| =
      c > 0$, then choosing $\varepsilon = c$ gives the false statement
      $c < c$. So $|L - M| = 0$ and $L = M$.

      Two moves in that argument will recur constantly, and it is worth naming
      them now. *Splitting $\varepsilon$*: when an estimate will be assembled
      from two pieces, ask each piece for $\frac{\varepsilon}{2}$ so the total
      lands on $\varepsilon$. *Taking the maximum*: two separate promises become
      one simultaneous promise past the larger of their thresholds. You will use
      both in the algebra of limits, in the squeeze theorem, and in every
      argument about Cauchy sequences.
    worked: >
      Watch the argument bite on a concrete false claim. Someone asserts that
      $a_n = 2 + \frac{1}{n}$ converges both to $L = 2$ and to $M = 2.4$. Their
      gap is $|L - M| = 0.4$, so run the proof with $\varepsilon = 0.4$ and each
      half equal to $0.2$. The first promise is genuine: $|a_n - 2| =
      \frac{1}{n} < 0.2$ for all $n \ge 6$. The second cannot be kept:
      $|a_n - 2.4| = \left| \frac{1}{n} - 0.4 \right| < 0.2$ requires
      $0.2 < \frac{1}{n} < 0.6$, that is $n < 5$, so it holds for at most
      finitely many $n$ and fails for every $n \ge 5$. There is no $N_2$, the
      second claim is false, and at $n = 6$ the numbers say it plainly:
      $a_6 \approx 2.1667$ sits $0.2333$ away from $2.4$.
    pitfalls: >
      The step people skip is $\max(N_1, N_2)$: with only $n \ge N_1$ in hand,
      the second estimate is not yet available, and the triangle inequality has
      nothing to stand on. And the conclusion is about a *fixed* quantity — the
      argument works because $|L - M|$ does not move while $\varepsilon$ does.
      An inequality like $|a_n - L| < \varepsilon$, where the left side depends
      on $n$, does not force anything to be zero.
    recap: >
      Splitting an arbitrary $\varepsilon$ in half between the two claims makes
      $|L - M|$ smaller than every positive number, and a nonnegative quantity
      with that property is $0$.
    steps:
      - teach: >
          The notation $\lim_{n \to \infty} a_n = L$ treats the limit as an
          object you can name and equate. That is only honest if a sequence
          cannot converge to two different numbers, which is what this
          proposition establishes.
      - teach: >
          Assume both $a_n \to L$ and $a_n \to M$. You now hold two promises,
          and each can be invoked with whatever tolerance you like — that is the
          only resource the proof uses.
      - teach: >
          Given $\varepsilon > 0$, spend it in halves: get $N_1$ with
          $|a_n - L| < \frac{\varepsilon}{2}$, and $N_2$ with
          $|a_n - M| < \frac{\varepsilon}{2}$.
      - ask: >
          For which indices $n$ are *both* estimates available at once?
        choices:
          - text: >
              $n \ge \min(N_1, N_2)$
            feedback: >
              Past the smaller threshold only one promise has kicked in. If
              $N_1 = 5$ and $N_2 = 900$, then $n = 5$ tells you nothing about
              the distance to $M$.
          - text: >
              $n \ge \max(N_1, N_2)$
            correct: true
            feedback: >
              Past the larger of the two, both $n \ge N_1$ and $n \ge N_2$ hold,
              so both estimates apply to the same term — which is exactly what
              lets you compare $L$ and $M$ through it.
          - text: >
              $n = N_1 + N_2$ only
            feedback: >
              That index does work, but the argument needs a whole tail, and
              nothing singles out this particular sum. Taking the maximum is the
              clean statement.
        feedback: >
          Two promises become one simultaneous promise past the larger
          threshold. Taking a maximum of finitely many thresholds is a move you
          will make in almost every proof from here on.
      - teach: >
          Fix such an $n$ and route from $L$ to $M$ through the term:
          $|L - M| \le |L - a_n| + |a_n - M| < \frac{\varepsilon}{2} +
          \frac{\varepsilon}{2} = \varepsilon$. The term cancels out and only
          the two candidate limits remain.
      - ask: >
          You now know $|L - M| \ge 0$ and $|L - M| < \varepsilon$ for
          *every* $\varepsilon > 0$. What follows?
        choices:
          - text: >
              $|L - M|$ is very small but possibly positive.
            feedback: >
              No positive number is smaller than every positive number — it is
              not smaller than itself. "Very small" is not a state a fixed real
              number can be in.
          - text: >
              $|L - M| = 0$, so $L = M$.
            correct: true
            feedback: >
              If $|L - M| = c > 0$, take $\varepsilon = c$ and the inequality
              reads $c < c$, which is false. So no positive value is possible
              and the nonnegative quantity must be $0$.
          - text: >
              Nothing, since $\varepsilon$ was arbitrary.
            feedback: >
              Arbitrariness is the strength of the conclusion, not a weakness:
              the inequality holds for every choice at once, and you get to pick
              the choice that hurts.
        feedback: >
          A nonnegative number below every positive number is zero. This little
          lemma closes a large fraction of the proofs in analysis.
      - ask: >
          Suppose someone claims a sequence converges both to $2$ and to $2.6$.
          What is the largest $\varepsilon$ whose choice already exposes the
          contradiction $|L - M| < \varepsilon$?
        expects: "0.6"
        hint: >
          You need an $\varepsilon$ that the true gap $|L - M|$ fails to beat.
        feedback: >
          $\varepsilon = 0.6$. The gap is $|2 - 2.6| = 0.6$, and the argument
          concludes $|L - M| < \varepsilon$; with $\varepsilon = 0.6$ that reads
          $0.6 < 0.6$, already false. Any smaller $\varepsilon$ also works, so
          $0.6$ is the largest.
      - teach: >
          Keep the two moves, not just the result: split $\varepsilon$ into
          halves when an estimate is assembled from two pieces, and take the
          maximum when two thresholds must hold together.

  - node: analysis.sequences.def-bounded
    hook: >
      Boundedness is the cheapest useful hypothesis in the subject: it names no
      target, needs no limit, and is often all you can verify about a sequence
      you do not understand — yet the Bolzano–Weierstrass Theorem extracts a
      convergent subsequence from nothing more.
    explanation: >
      A sequence is bounded above if one fixed number sits at or above every
      term: there is $M \in \mathbb{R}$ with $a_n \le M$ for all $n$. It is
      bounded below if some $m$ sits at or below every term. It is bounded if
      both hold — the whole sequence lives inside the band $[m, M]$.

      A single-number version is usually more convenient. If $m \le a_n \le M$
      for all $n$, put $C = \max(|m|, |M|)$; then $|a_n| \le C$ for every $n$,
      and conversely $|a_n| \le C$ gives the band $[-C, C]$. So "bounded" and
      "there is $C \ge 0$ with $|a_n| \le C$ for all $n$" say the same thing,
      and the second is the form you will actually use in estimates.

      Compare this with convergence, because the differences run in both
      directions. Convergence names a target value; boundedness names none.
      Convergence constrains only the tail; boundedness constrains *every*
      term. The bound need not be attained and need not be the best possible:
      for $a_n = 5 - \frac{3}{n}$ the terms are $2, 3.5, 4, 4.25, \ldots$, and
      $M = 100$ is a perfectly legitimate upper bound even though the smallest
      one is $5$, which no term reaches.

      Boundedness is still insensitive to finitely many terms, for a different
      reason than convergence is. Change $a_1, \ldots, a_k$ to whatever you
      like: those $k$ values have a largest absolute value, and enlarging $C$ to
      include it restores the bound. A finite set of exceptions can always be
      absorbed; an infinite set cannot, which is why $a_n = n$ is unbounded no
      matter how many early terms you tame.
    worked: >
      Take $a_n = (-1)^n \left( 2 + \frac{1}{n} \right)$ and find the best
      bounds. The terms are $-3$, $2.5$, $-2.333\ldots$, $2.25$, $-2.2$,
      $2.1666\ldots$, alternating in sign while $2 + \frac{1}{n}$ decreases
      toward $2$. The positive terms are largest at $n = 2$, giving $2.5$, so
      $M = 2.5$ is the smallest upper bound and it is attained. The negative
      terms are most negative at $n = 1$, giving $-3$, so $m = -3$ is the
      smallest lower bound. For the absolute form, $|a_n| = 2 + \frac{1}{n} \le
      3$ with equality at $n = 1$, so the smallest $C$ with $|a_n| \le C$ for
      all $n$ is $C = 3$. The sequence is bounded, and — worth noticing — it
      does not converge.
    pitfalls: >
      Bounded above is not bounded: $a_n = -n$ has $a_n \le 0$ for every $n$ and
      runs off to $-\infty$. And a bound must cover *every* term, not the tail
      only — a sequence whose first term is $10^{6}$ and which then sits in
      $[0,1]$ is still bounded, but the bound you quote has to be at least
      $10^{6}$, so a bound read off the tail alone is wrong.
    recap: >
      Bounded means one fixed band $[-C, C]$ contains every term of the
      sequence — no target value, no tail, and no requirement that the bound be
      the best one.
    steps:
      - teach: >
          Some sequences you cannot evaluate but can still fence in. Anything of
          the form $\frac{\sin n + 3}{2}$ lives between $1$ and $2$ whatever
          $\sin n$ is doing, and that alone will later be enough to extract a
          convergent subsequence.
      - teach: >
          $(a_n)$ is bounded above if some fixed $M$ has $a_n \le M$ for every
          $n$, bounded below if some fixed $m$ has $a_n \ge m$ for every $n$,
          and bounded if both.
      - teach: >
          The working form collapses the two: with $m \le a_n \le M$, set
          $C = \max(|m|, |M|)$ and you get $|a_n| \le C$ for every $n$. One
          number, one inequality, and it is the shape every estimate wants.
      - ask: >
          For $a_n = 5 - \frac{3}{n}$, what is the smallest $M$ with $a_n \le M$
          for every $n$?
        expects: "5"
        hint: >
          The terms increase; ask what value $\frac{3}{n}$ is shrinking toward.
        feedback: >
          $M = 5$. Since $\frac{3}{n} > 0$ we always have $a_n < 5$, so $5$ is
          an upper bound; and since $\frac{3}{n}$ gets arbitrarily small, the
          terms climb past any number below $5$, so nothing smaller works. Note
          $5$ is never attained — an upper bound need not be a term.
      - ask: >
          Which of these sequences is bounded below but not bounded above?
        choices:
          - text: >
              $a_n = (-1)^n$
            feedback: >
              Its terms are only $1$ and $-1$, so $|a_n| \le 1$ and it is
              bounded on both sides. Failing to converge is a different
              property.
          - text: >
              $a_n = n^{2}$
            correct: true
            feedback: >
              Every term is at least $1$, so $m = 1$ bounds it below; and no $M$
              works above, since $n^{2} > M$ as soon as $n > \sqrt{M}$.
          - text: >
              $a_n = -n$
            feedback: >
              This is the mirror image: bounded above by $0$ and unbounded
              below. Bounded above and bounded below are separate conditions,
              and this sequence has the other one.
        feedback: >
          Check the two directions separately. A sequence can satisfy either,
          both, or neither, and only "both" earns the word bounded.
      - teach: >
          Set this beside convergence. Convergence names a target and constrains
          only the tail; boundedness names no target and constrains every single
          term. Neither condition is a weakened form of the other's statement.
      - ask: >
          For $a_n = 4 + 2(-1)^n$, what is the smallest $C$ with $|a_n| \le C$
          for every $n$?
        expects: "6"
        hint: >
          The sequence takes only two values. Compute both and take the larger
          absolute value.
        feedback: >
          $C = 6$. Odd $n$ gives $4 - 2 = 2$ and even $n$ gives $4 + 2 = 6$, so
          the terms are $2$ and $6$ forever and $\max(|2|, |6|) = 6$. Any
          $C \ge 6$ is a legitimate bound; $6$ is the smallest.
      - teach: >
          Finitely many terms never spoil boundedness: those values have a
          largest absolute value, and enlarging $C$ to cover it repairs the
          bound. Infinitely many exceptions cannot be absorbed that way, which
          is why $a_n = n$ is beyond rescue.

  - node: analysis.sequences.convergent-bounded
    hook: >
      This is the first bridge between the two conditions, and it is a one-way
      bridge. It supplies the boundedness that the product rule in the algebra
      of limits needs, and its contrapositive kills a divergent sequence on
      sight.
    explanation: >
      Convergence constrains only the tail, and boundedness constrains every
      term, so getting from one to the other means handling the head of the
      sequence separately. That is the entire proof, and the trick is that the
      head is *finite*.

      Suppose $a_n \to L$. The definition holds for every $\varepsilon$, so you
      may spend it on a tolerance chosen for convenience rather than smallness:
      take $\varepsilon = 1$. There is an $N$ with $|a_n - L| < 1$ for all
      $n \ge N$, and by the triangle inequality
      $|a_n| \le |a_n - L| + |L| < |L| + 1$ for those $n$. The whole tail is
      now inside a fixed band.

      What is left over is $a_1, \ldots, a_{N-1}$: finitely many numbers. A
      finite list of reals has a largest element, so
      $C = \max(|a_1|, \ldots, |a_{N-1}|, |L| + 1)$ exists and satisfies
      $|a_n| \le C$ for every $n$ — the early terms by construction, the rest
      by the estimate. The sequence is bounded. Notice where finiteness did the
      work: an infinite set of reals need not have a largest element, so the
      argument would collapse if the definition constrained only some sparse
      set of indices instead of a whole tail.

      The converse is false, and the counterexample is one you already have:
      $a_n = (-1)^n$ satisfies $|a_n| \le 1$ and converges to nothing. So
      boundedness is necessary for convergence and not sufficient — which makes
      it exactly the right hypothesis to *assume* in a theorem that wants to
      produce convergence with extra help, and exactly the wrong thing to cite
      as proof of convergence.
    worked: >
      Bound $a_n = 3 + \frac{12}{n}$ by running the proof rather than by
      inspection. The limit is $L = 3$. Take $\varepsilon = 1$: the requirement
      $\left| \frac{12}{n} \right| < 1$ means $n > 12$, so $N = 13$ serves, and
      for $n \ge 13$ we get $|a_n| < |L| + 1 = 4$. The leftover head is
      $a_1, \ldots, a_{12}$, whose absolute values are
      $15, 9, 7, 6, 5.4, 5, \ldots, 4$, decreasing, so the largest is
      $|a_1| = 15$. Hence $C = \max(15, 4) = 15$ bounds the entire sequence, and
      indeed $|a_n| \le 15$ for every $n$ with equality only at $n = 1$.
    pitfalls: >
      Reading the implication backwards is the standard error: bounded does not
      give convergent, as $(-1)^n$ shows, and "the terms stay between $0$ and
      $1$" is never a proof that a limit exists. The proof's finiteness step is
      the other trap — the maximum is taken over the finitely many terms *before*
      $N$, and an argument that tried to take a maximum over all $n$ would be
      assuming what it wants to prove.
    recap: >
      Choosing $\varepsilon = 1$ traps the whole tail within $|L| + 1$, and the
      finitely many terms left over have a largest absolute value, so a
      convergent sequence is bounded — but never the other way round.
    steps:
      - teach: >
          Convergence says something about the tail; boundedness says something
          about every term. To get from one to the other you must deal with the
          head of the sequence separately — and the head is finite, which is the
          whole idea.
      - teach: >
          Suppose $a_n \to L$. You may use the definition with any tolerance, so
          use a convenient one: $\varepsilon = 1$. It gives an $N$ with
          $|a_n - L| < 1$ for all $n \ge N$.
      - ask: >
          From $|a_n - L| < 1$, what bound on $|a_n|$ follows?
        choices:
          - text: >
              $|a_n| < 1$
            feedback: >
              That would say the terms are near zero, but the estimate says they
              are near $L$. A sequence converging to $500$ has terms around
              $500$.
          - text: >
              $|a_n| < |L| + 1$
            correct: true
            feedback: >
              Route through $L$: $|a_n| \le |a_n - L| + |L| < 1 + |L|$. The
              triangle inequality converts "close to $L$" into "no bigger than
              $L$ plus a bit".
          - text: >
              $|a_n| < |L| - 1$
            feedback: >
              Subtracting shrinks the band, and this can even be negative — it
              would be a bound no absolute value could satisfy. The slack has to
              be added.
        feedback: >
          Being within $1$ of $L$ puts you within $|L| + 1$ of the origin. That
          single inequality bounds the entire tail.
      - teach: >
          Only $a_1, \ldots, a_{N-1}$ are still uncovered — finitely many
          numbers. A finite list of reals has a largest element, so
          $C = \max(|a_1|, \ldots, |a_{N-1}|, |L| + 1)$ exists and bounds every
          term.
      - ask: >
          Run the proof on $a_n = 3 + \frac{12}{n}$ with $\varepsilon = 1$. What
          value of $C$ does it produce?
        expects: "15"
        hint: >
          Find the $N$ that $\varepsilon = 1$ forces, then take the largest
          absolute value among the earlier terms and $|L| + 1$.
        feedback: >
          $C = 15$. The limit is $3$, and $\frac{12}{n} < 1$ needs $n \ge 13$,
          so $N = 13$ and the tail is bounded by $|L| + 1 = 4$. The head
          $a_1, \ldots, a_{12}$ is largest at $a_1 = 15$, so
          $C = \max(15, 4) = 15$.
      - teach: >
          Finiteness is load-bearing. An infinite set of real numbers need not
          have a largest element, so the maximum is legitimate only because the
          definition left exactly the terms before $N$ uncovered.
      - ask: >
          Does boundedness imply convergence?
        choices:
          - text: >
              Yes — a bounded sequence has nowhere to escape to.
            feedback: >
              It has nowhere to escape to and it still need not settle. $(-1)^n$
              stays inside $[-1, 1]$ forever while jumping between the ends.
          - text: >
              No — $a_n = (-1)^n$ is bounded and divergent.
            correct: true
            feedback: >
              $|a_n| \le 1$ for every $n$, yet the terms never enter any
              interval of radius $\frac{1}{2}$ and stay there. Boundedness is
              necessary for convergence, not sufficient.
          - text: >
              No — a bounded sequence can be unbounded on a subsequence.
            feedback: >
              It cannot: every subsequence of a bounded sequence uses the same
              terms and obeys the same bound. The real reason is oscillation,
              not size.
        feedback: >
          One-way bridge. Use it forwards to get boundedness for free from
          convergence, and backwards in contrapositive form: unbounded means
          divergent, which disposes of $a_n = n$ and $a_n = 2^{n}$ instantly.
      - teach: >
          The forward direction is the one you will spend. The very next
          theorem's product rule needs some $C$ with $|a_n| \le C$, and this
          proposition is where that $C$ comes from.

  - node: analysis.sequences.algebra-of-limits
    hook: >
      Without this theorem every new sequence would need its own $\varepsilon$–$N$
      argument from scratch. With it, a compound expression comes apart into
      pieces whose limits you already know.
    explanation: >
      The statement is what you would hope for. If $a_n \to A$ and $b_n \to B$
      and $c \in \mathbb{R}$, then $a_n + b_n \to A + B$, $c\,a_n \to cA$,
      $a_n b_n \to AB$, and $\frac{a_n}{b_n} \to \frac{A}{B}$ provided $B \ne 0$
      and no $b_n$ is $0$. The interest is in *why*, because the four proofs are
      not equally cheap.

      Sums cost only the triangle inequality and the split of $\varepsilon$:
      given $\varepsilon > 0$, take $N_1$ beyond which
      $|a_n - A| < \frac{\varepsilon}{2}$ and $N_2$ beyond which
      $|b_n - B| < \frac{\varepsilon}{2}$; past $\max(N_1, N_2)$,
      $|(a_n + b_n) - (A + B)| \le |a_n - A| + |b_n - B| < \varepsilon$.

      Products need one thing more, and it is worth seeing where. The
      difference does not split on its own, so add and subtract:
      $a_n b_n - AB = a_n (b_n - B) + B (a_n - A)$. The second term is small
      because $|a_n - A|$ is, multiplied by the fixed number $|B|$. The first
      term is $|a_n|$ times something small — and $|a_n|$ is a moving quantity,
      so nothing yet says the product is small. What rescues it is that
      $(a_n)$ converges and therefore, since every convergent sequence is
      bounded, satisfies $|a_n| \le C$ for a fixed $C$. That $C$ is the load
      the previous proposition was carrying.

      In practice you use the theorem through one manoeuvre: divide numerator
      and denominator by the highest power of $n$ present, turning every piece
      into a constant plus something of the form $\frac{k}{n^{j}} \to 0$, then
      apply the rules. Limits also respect weak inequalities — $a_n \le b_n$ for
      every $n$ forces $A \le B$ — but not strict ones, since $\frac{1}{n} > 0$
      for every $n$ while the limit is $0$.
    worked: >
      Evaluate $\lim_{n \to \infty} \frac{5n^{2} + 3n - 2}{2n^{2} - n}$. The
      highest power is $n^{2}$, so divide top and bottom by it:
      $\frac{5 + \frac{3}{n} - \frac{2}{n^{2}}}{2 - \frac{1}{n}}$. Every small
      piece tends to $0$: $\frac{3}{n} \to 0$, $\frac{2}{n^{2}} \to 0$,
      $\frac{1}{n} \to 0$. By the sum rule the numerator tends to
      $5 + 0 - 0 = 5$ and the denominator to $2 - 0 = 2$. The denominator's
      limit is $2 \ne 0$, and $2n^{2} - n = n(2n - 1) \ne 0$ for every
      $n \ge 1$, so the quotient rule applies and the limit is $\frac{5}{2}$.
      Sanity check at $n = 100$: the expression is
      $\frac{50298}{19900} \approx 2.528$, near $2.5$ as promised.
    pitfalls: >
      The rules require both limits to exist first. From $a_n + b_n \to 0$ you
      may not conclude anything about $a_n$ and $b_n$ separately — take
      $a_n = n$ and $b_n = -n$. The quotient rule genuinely needs $B \ne 0$:
      $a_n = \frac{1}{n}$ and $b_n = \frac{1}{n^{2}}$ both tend to $0$ while
      $\frac{a_n}{b_n} = n$ diverges. And strict inequalities are not inherited
      — $a_n < b_n$ for every $n$ gives only $A \le B$, as
      $\frac{1}{n} < \frac{2}{n}$ with both limits $0$ shows.
    recap: >
      Limits pass through sums, scalar multiples, products and nonzero
      quotients, the product case working only because a convergent sequence is
      bounded — so compute a compound limit by dividing out the dominant term
      and assembling the pieces.
    steps:
      - teach: >
          You do not want to run an $\varepsilon$–$N$ argument for
          $\frac{5n^{2} + 3n - 2}{2n^{2} - n}$. This theorem lets you break such
          an expression into pieces whose limits are already known and put the
          answer back together.
      - teach: >
          If $a_n \to A$ and $b_n \to B$: sums go to $A + B$, scalar multiples
          to $cA$, products to $AB$, and quotients to $\frac{A}{B}$ as long as
          $B \ne 0$ and no $b_n$ vanishes.
      - teach: >
          The sum is the cheap case. Ask each sequence for
          $\frac{\varepsilon}{2}$, take the larger threshold, and the triangle
          inequality gives
          $|(a_n + b_n) - (A + B)| \le |a_n - A| + |b_n - B| < \varepsilon$.
      - teach: >
          The product does not split so easily. Add and subtract to get
          $a_n b_n - AB = a_n (b_n - B) + B(a_n - A)$: the second term is a
          fixed multiple of something small, and the first is $|a_n|$ times
          something small.
      - ask: >
          Why is $a_n (b_n - B)$ small — what makes the factor $|a_n|$
          harmless?
        choices:
          - text: >
              $|a_n|$ is small, since $a_n - A$ is small.
            feedback: >
              $a_n$ is close to $A$, not close to $0$. If $A = 1000$ then
              $|a_n|$ is around $1000$ and is not small at all.
          - text: >
              $(a_n)$ converges, so it is bounded: $|a_n| \le C$ for a fixed
              $C$.
            correct: true
            feedback: >
              A moving factor is harmless as soon as it is *bounded*, and every
              convergent sequence is bounded. Then
              $|a_n (b_n - B)| \le C |b_n - B|$, which is a constant times
              something you can make as small as you like.
          - text: >
              $b_n - B \to 0$ makes the whole product $0$ regardless of $a_n$.
            feedback: >
              Not regardless: $a_n = n$ and $b_n - B = \frac{1}{n}$ have product
              $1$ for every $n$. Something must stop the first factor from
              growing.
        feedback: >
          Small times bounded is small; small times unbounded is anybody's
          guess. This is exactly why the proposition that convergent sequences
          are bounded had to come first.
      - teach: >
          The practical move: divide numerator and denominator by the highest
          power of $n$ present. Everything becomes a constant plus terms
          $\frac{k}{n^{j}}$, all of which tend to $0$, and the rules assemble
          the answer.
      - ask: >
          What is $\lim_{n \to \infty} \frac{3n^{2} + 2n}{5n^{2} - n}$?
        expects: "3/5"
        hint: >
          Divide top and bottom by $n^{2}$ and send every leftover
          $\frac{1}{n}$ to zero.
        feedback: >
          $\frac{3}{5}$. Dividing by $n^{2}$ gives
          $\frac{3 + \frac{2}{n}}{5 - \frac{1}{n}}$; the numerator tends to $3$,
          the denominator to $5 \ne 0$, and the quotient rule finishes it.
      - teach: >
          Limits also respect order, but only weakly: $a_n \le b_n$ for every
          $n$ gives $A \le B$. The passage to the limit can turn a strict
          inequality into an equality.
      - ask: >
          Suppose $a_n < b_n$ for every $n$, with $a_n \to A$ and $b_n \to B$.
          What can you conclude?
        choices:
          - text: >
              $A < B$
            feedback: >
              Strictness is lost in the limit. Take $a_n = \frac{1}{n}$ and
              $b_n = \frac{2}{n}$: the inequality is strict at every index and
              both limits are $0$.
          - text: >
              $A \le B$
            correct: true
            feedback: >
              Weak inequalities survive and strict ones do not. If $A > B$ were
              possible, the terms would eventually have to separate the wrong
              way, contradicting $a_n < b_n$.
          - text: >
              Nothing, since limits ignore the order of the terms.
            feedback: >
              Limits do respect order — that is the last clause of the theorem.
              What they fail to preserve is only the strictness.
        feedback: >
          Remember $\frac{1}{n} > 0$: every term is strictly positive and the
          limit is exactly $0$. Taking limits can close a gap but never open
          one.

  - node: analysis.sequences.squeeze
    hook: >
      Some sequences are too irregular to attack head-on — anything with
      $\sin n$ or $(-1)^n$ buried inside oscillates forever and has no formula
      for $|a_n - L|$ to solve. The squeeze gets the limit anyway, from two
      bounds you can compute.
    explanation: >
      Suppose three sequences satisfy $a_n \le b_n \le c_n$ for every $n$, and
      the outer two converge to the *same* number $L$. Then $(b_n)$ is trapped:
      it has nowhere to go but $L$. Picture two curves closing on a common
      height, dragging everything between them along.

      The proof is one chain of inequalities. Given $\varepsilon > 0$, choose
      $N_1$ with $|a_n - L| < \varepsilon$ for $n \ge N_1$, which in particular
      gives $L - \varepsilon < a_n$; choose $N_2$ with $c_n < L + \varepsilon$
      for $n \ge N_2$. Past $\max(N_1, N_2)$ both hold, and threading the
      hypothesis through the middle gives
      $L - \varepsilon < a_n \le b_n \le c_n < L + \varepsilon$, which is
      exactly $|b_n - L| < \varepsilon$. Notice what was never assumed:
      convergence of $(b_n)$. The theorem *produces* it, which is what makes it
      usable on sequences you cannot analyse directly.

      The form you will use nine times out of ten is the special case around
      zero. If $|b_n| \le c_n$ and $c_n \to 0$, then $-c_n \le b_n \le c_n$ with
      both outer sequences tending to $0$, so $b_n \to 0$. Any oscillation
      wrapped in an absolute value that you can bound is finished by this. Take
      $b_n = \frac{\sin n}{n}$: you know nothing about $\sin n$ except
      $|\sin n| \le 1$, and that is enough, since $|b_n| \le \frac{1}{n} \to 0$.

      Two hypotheses do real work. The outer limits must be equal — from
      $a_n \to 0$ and $c_n \to 2$ you learn only that $(b_n)$ eventually lives
      in a band of width $2$, and it may oscillate inside it forever. The
      inequality need only hold *eventually*, since the first finitely many
      terms never affect a limit.
    worked: >
      Find $\lim_{n \to \infty} \frac{2 + (-1)^{n}}{n}$. The numerator takes
      only the values $1$ and $3$ and never settles, so no algebraic
      manipulation will produce it — but it is caught between constants:
      $1 \le 2 + (-1)^{n} \le 3$ for every $n$. Divide by the positive number
      $n$, which preserves the inequalities:
      $\frac{1}{n} \le \frac{2 + (-1)^{n}}{n} \le \frac{3}{n}$. The left
      sequence tends to $0$, and so does the right, since $\frac{3}{n}$ is a
      constant times $\frac{1}{n}$. The outer limits agree, so the squeeze
      applies and the limit is $0$. Concretely, at $n = 100$ the term is either
      $0.01$ or $0.03$, and both bounds have already closed to within $0.03$ of
      the answer.
    pitfalls: >
      The outer limits must be the *same* number: $-1 \le \sin n \le 1$ is true
      and gives nothing, because $-1$ and $1$ are different. And the inequality
      must genuinely bracket $(b_n)$ — a one-sided bound $b_n \le c_n$ with
      $c_n \to 0$ leaves $b_n$ free to run to $-\infty$. When you squeeze
      toward zero, bound $|b_n|$, not $b_n$.
    recap: >
      A sequence pinned between two sequences with a common limit converges to
      that limit, and the workhorse case is $|b_n| \le c_n$ with $c_n \to 0$,
      which forces $b_n \to 0$.
    steps:
      - teach: >
          What is $\lim_{n \to \infty} \frac{\sin n}{n}$? You cannot solve
          $\left| \frac{\sin n}{n} \right| < \varepsilon$ for $n$, because
          $\sin n$ has no pattern in $n$. You can, however, bound it.
      - teach: >
          The theorem: if $a_n \le b_n \le c_n$ for every $n$, and both
          $a_n \to L$ and $c_n \to L$ with the same $L$, then $b_n \to L$.
      - teach: >
          The proof is one line of inequalities. Past a threshold where both
          outer estimates hold,
          $L - \varepsilon < a_n \le b_n \le c_n < L + \varepsilon$, which says
          $|b_n - L| < \varepsilon$. Convergence of $(b_n)$ was never assumed —
          it came out.
      - ask: >
          Suppose $a_n \le b_n \le c_n$ with $a_n \to 0$ and $c_n \to 2$. What
          may you conclude about $(b_n)$?
        choices:
          - text: >
              $b_n \to 1$, the midpoint of the two limits.
            feedback: >
              Nothing points at the midpoint. Take $b_n = c_n$: then
              $b_n \to 2$, and the same bounds hold.
          - text: >
              Only that $(b_n)$ is eventually inside a band of width about $2$;
              it need not converge.
            correct: true
            feedback: >
              With different outer limits the trap never closes.
              $b_n = 1 + (-1)^{n}$ satisfies $0 \le b_n \le 2$ and diverges.
          - text: >
              $(b_n)$ converges to some limit between $0$ and $2$.
            feedback: >
              Boundedness does not deliver convergence — $(-1)^{n} + 1$ is the
              standing counterexample. The squeeze needs the two limits to
              coincide.
        feedback: >
          Equal outer limits is the hypothesis that does the work. A gap between
          them leaves room for $(b_n)$ to oscillate forever.
      - teach: >
          The version you will reach for constantly: if $|b_n| \le c_n$ and
          $c_n \to 0$, then $-c_n \le b_n \le c_n$ squeezes $b_n \to 0$. So
          $\left| \frac{\sin n}{n} \right| \le \frac{1}{n}$ settles that first
          question at once.
      - ask: >
          What is $\lim_{n \to \infty} \frac{n + 4\cos n}{n}$?
        expects: "1"
        hint: >
          Split the fraction, then bound the piece containing $\cos n$ using
          $|\cos n| \le 1$.
        feedback: >
          The limit is $1$. Write the term as $1 + \frac{4 \cos n}{n}$. Since
          $|\cos n| \le 1$, the second piece satisfies
          $\left| \frac{4\cos n}{n} \right| \le \frac{4}{n} \to 0$, so it is
          squeezed to $0$ and the whole expression tends to $1 + 0 = 1$.
      - ask: >
          What is $\lim_{n \to \infty} \frac{(-1)^{n}}{\sqrt{n}}$?
        expects: "0"
        hint: >
          Take absolute values first — the sign is the only thing making this
          look hard.
        feedback: >
          The limit is $0$. The absolute value is
          $\left| \frac{(-1)^{n}}{\sqrt{n}} \right| = \frac{1}{\sqrt{n}}$, which
          tends to $0$ because $\frac{1}{\sqrt{n}} < \varepsilon$ as soon as
          $n > \frac{1}{\varepsilon^{2}}$. Bounding the absolute value by a
          sequence tending to $0$ forces the original to $0$.
      - teach: >
          Two conveniences worth knowing. The bracketing need only hold from
          some index on, since finitely many terms never affect a limit; and the
          theorem is the standard route to any limit where an unruly factor sits
          inside something small.

  - node: analysis.sequences.mct
    hook: >
      Every convergence proof so far has needed the limit in advance — you
      cannot solve $|a_n - L| < \varepsilon$ without an $L$. This is the first
      theorem that establishes convergence with no candidate limit in hand, and
      it is where the completeness of $\mathbb{R}$ starts paying out.
    explanation: >
      Call $(a_n)$ increasing if $a_n \le a_{n+1}$ for every $n$, decreasing if
      $a_n \ge a_{n+1}$ for every $n$, monotone if it is one of the two. The
      theorem: an increasing sequence that is bounded above converges, and its
      limit is $\sup\{a_n : n \ge 1\}$; a decreasing sequence bounded below
      converges to $\inf\{a_n : n \ge 1\}$.

      The proof shows exactly where the real numbers are needed. The set
      $\{a_n : n \ge 1\}$ is nonempty and bounded above, so by the completeness
      axiom it has a least upper bound $S$. That $S$ is the candidate limit,
      manufactured out of the hypothesis rather than guessed. Now take
      $\varepsilon > 0$. Since $S$ is the *least* upper bound,
      $S - \varepsilon$ is not an upper bound, so some term escapes it: there is
      an $N$ with $a_N > S - \varepsilon$. Monotonicity now drags the entire
      tail along, since $a_n \ge a_N$ for $n \ge N$, and $S$ caps it from above:
      $S - \varepsilon < a_N \le a_n \le S$ for all $n \ge N$. That is
      $|a_n - S| < \varepsilon$, so $a_n \to S$.

      Read the two hypotheses as a pair. Boundedness alone gives nothing —
      $(-1)^{n}$ is bounded and divergent. Monotonicity alone gives nothing —
      $a_n = n$ increases forever. Together they leave no room: the sequence
      cannot turn back and cannot break through the ceiling, so it must settle,
      and it settles at the lowest ceiling that exists.

      This is the practical face of completeness, and the reason it fails over
      $\mathbb{Q}$: the truncations $1, 1.4, 1.41, 1.414, \ldots$ of $\sqrt{2}$
      increase and are bounded above by $2$, but inside the rationals there is
      no least upper bound for them to converge to. The theorem's typical use is
      on a recursively defined sequence — prove increasing, prove bounded, and
      only then use the algebra of limits on the recursion to identify the
      limit, which is legitimate only once you know a limit exists.
    worked: >
      Let $a_1 = 0$ and $a_{n+1} = \frac{a_n + 6}{2}$; the terms are $0, 3,
      4.5, 5.25, 5.625, \ldots$. First, every term is below $6$: if $a_n < 6$
      then $a_{n+1} = \frac{a_n + 6}{2} < \frac{6 + 6}{2} = 6$, and $a_1 = 0 <
      6$, so induction gives $a_n < 6$ for all $n$. Second, the sequence
      increases: $a_{n+1} - a_n = \frac{a_n + 6}{2} - a_n = \frac{6 - a_n}{2} >
      0$ precisely because $a_n < 6$. Increasing and bounded above, so by the
      theorem it converges to some $L$. Only now may you find $L$: taking limits
      on both sides of the recursion — the left side is the same sequence
      shifted, so it also tends to $L$ — gives $L = \frac{L + 6}{2}$, hence
      $2L = L + 6$ and $L = 6$. The limit is $6$, and no term ever reaches it.
    pitfalls: >
      Solving the fixed-point equation *before* proving convergence is the
      classic error: for $a_1 = 1$ and $a_{n+1} = 2a_n$ the equation $L = 2L$
      obediently returns $L = 0$, while the sequence runs to infinity. The
      equation only identifies a limit already known to exist. And the theorem
      is sufficient, not necessary — $\frac{(-1)^{n}}{n}$ converges to $0$
      without being monotone, so a sequence failing the hypotheses has not been
      shown to diverge.
    recap: >
      Completeness hands you the supremum, the fact that it is the *least*
      upper bound puts some term above $S - \varepsilon$, and monotonicity
      carries the whole tail up there with it.
    steps:
      - teach: >
          To use the definition of convergence you need the limit first — it
          appears in $|a_n - L| < \varepsilon$. So how do you ever prove a
          sequence converges when you cannot guess where to?
      - teach: >
          The theorem: an increasing sequence bounded above converges, and its
          limit is the supremum of its terms. Symmetrically, a decreasing
          sequence bounded below converges to the infimum.
      - teach: >
          Step one supplies the missing limit. The set of terms is nonempty and
          bounded above, so the completeness axiom produces
          $S = \sup\{a_n : n \ge 1\}$. Nothing was guessed; $S$ came out of the
          hypothesis.
      - ask: >
          Given $\varepsilon > 0$, why must some term satisfy
          $a_N > S - \varepsilon$?
        choices:
          - text: >
              Because $S$ is an upper bound for the terms.
            feedback: >
              Being an upper bound gives $a_n \le S$ — an inequality in the
              wrong direction. It says nothing about terms getting close to
              $S$.
          - text: >
              Because $S$ is the *least* upper bound, so $S - \varepsilon$ is
              not an upper bound at all.
            correct: true
            feedback: >
              If every term were $\le S - \varepsilon$, then $S - \varepsilon$
              would be an upper bound smaller than $S$, contradicting
              leastness. So some term must exceed it.
          - text: >
              Because the sequence is increasing.
            feedback: >
              Monotonicity is what spreads the estimate from $a_N$ to the whole
              tail, but something must first put one term above
              $S - \varepsilon$, and that is leastness.
        feedback: >
          Leastness produces one good term; monotonicity then gives
          $S - \varepsilon < a_N \le a_n \le S$ for every $n \ge N$, which is
          $|a_n - S| < \varepsilon$.
      - teach: >
          Both hypotheses earn their place. $(-1)^{n}$ is bounded and does not
          converge; $a_n = n$ is increasing and does not converge. Together they
          leave the sequence nowhere to go but up to its ceiling.
      - teach: >
          The standard use is a recursion: prove it increases, prove it is
          bounded, conclude a limit $L$ exists — and only then take limits in
          the recursion to compute $L$.
      - ask: >
          Let $a_1 = 0$ and $a_{n+1} = 1 + \frac{a_n}{3}$. It is increasing and
          bounded above by $\frac{3}{2}$. What is its limit?
        expects: "3/2"
        hint: >
          The limit satisfies the same equation as the recursion once you send
          both sides to it.
        feedback: >
          $L = \frac{3}{2}$. Since a limit exists, both $a_{n+1}$ and $a_n$ tend
          to it, so $L = 1 + \frac{L}{3}$; then $\frac{2L}{3} = 1$ and
          $L = \frac{3}{2}$. The terms $0, 1, \frac{4}{3}, \frac{13}{9}$ do
          climb toward $1.5$.
      - ask: >
          A sequence is increasing with $\sup\{a_n : n \ge 1\} = 7$. What is
          $\lim_{n \to \infty} a_n$?
        expects: "7"
        hint: >
          The theorem does not merely assert convergence; it names the limit.
        feedback: >
          $7$. An increasing sequence with a finite supremum converges to that
          supremum. The value $7$ need never be attained — the terms only have
          to climb arbitrarily close to it.
      - teach: >
          Over $\mathbb{Q}$ this all collapses: $1, 1.4, 1.41, 1.414, \ldots$
          increases and stays below $2$, yet has no rational supremum to
          converge to. The theorem is completeness in working clothes.

  - node: analysis.sequences.def-subsequence
    hook: >
      Two of the sharpest tools in this unit are built from subsequences: the
      standard proof that a sequence diverges, and the extraction of order out
      of a bounded sequence. Both depend on the definition being strict about
      what may and may not be done to the terms.
    explanation: >
      Choose indices $n_1 < n_2 < n_3 < \cdots$, strictly increasing, from
      $\mathbb{N}$. The subsequence is the sequence $k \mapsto a_{n_k}$, written
      $(a_{n_k})_{k \ge 1}$. So $(a_{2k}) = a_2, a_4, a_6, \ldots$ keeps the
      even-indexed terms, and $(a_{k^{2}}) = a_1, a_4, a_9, \ldots$ keeps the
      ones at square indices.

      Everything is in the words "strictly increasing". Strict rules out
      $n_k = n_{k+1}$, so no term is used twice. Increasing rules out going
      backwards, so the original order is preserved. And an infinite strictly
      increasing list of naturals cannot stop, so infinitely many terms are
      kept. Discard as many as you like; reorder or repeat nothing.

      One consequence gets used in every proof about subsequences:
      $n_k \ge k$ for every $k$. Induction gives it — $n_1 \ge 1$ since $n_1$ is
      a natural number, and if $n_k \ge k$ then $n_{k+1} > n_k \ge k$ forces
      $n_{k+1} \ge k + 1$, integers having no room in between. In words, a
      subsequence has always travelled at least as far along the original list
      as its own index suggests, so a threshold on $n$ is automatically a
      threshold on $k$.

      Two easy facts round it out. Every sequence is a subsequence of itself,
      via $n_k = k$. And a subsequence of a subsequence is a subsequence of the
      original, because composing two strictly increasing index maps gives a
      strictly increasing index map — so you may thin a sequence repeatedly
      without leaving the category.
    worked: >
      Take $a_n = (-1)^{n} \left( 1 + \frac{1}{n} \right)$, whose terms are
      $-2$, $1.5$, $-1.333\ldots$, $1.25$, $-1.2$, $1.1666\ldots$, and select
      the indices $n_k = 2k$, which are strictly increasing as required. The
      subsequence is $a_{n_k} = a_{2k} = (-1)^{2k}\left(1 +
      \frac{1}{2k}\right) = 1 + \frac{1}{2k}$, since $(-1)^{2k} = 1$. Its first
      four terms are $1.5$, $1.25$, $1.1666\ldots$, $1.125$ — the even-numbered
      terms of the original, in order, with the odd ones dropped. Check the
      index bound: $n_3 = 6 \ge 3$, as promised. Selecting $n_k = 2k - 1$
      instead gives $-\left(1 + \frac{1}{2k-1}\right)$, the terms $-2$,
      $-1.333\ldots$, $-1.2$, $-1.1428\ldots$ — a different subsequence of the
      same sequence, heading somewhere else entirely.
    pitfalls: >
      Reordering is not thinning: $a_2, a_1, a_4, a_3, \ldots$ uses each term
      once but its index list is not increasing, so it is not a subsequence.
      Repeating is likewise out — $a_1, a_1, a_2, a_2, \ldots$ needs
      $n_1 = n_2$, and the increase is required to be strict. And a subsequence
      is infinite by construction, so "the first ten terms" is not one.
    recap: >
      A subsequence keeps infinitely many terms in their original order and
      repeats none, which is exactly what a strictly increasing index list
      $n_1 < n_2 < \cdots$ encodes — and it forces $n_k \ge k$.
    steps:
      - teach: >
          Given a sequence, you often want to keep only part of it: the
          even-indexed terms, or the terms at square indices, or some cleverly
          chosen selection. The definition has to say precisely which
          selections are legal.
      - teach: >
          Pick strictly increasing indices $n_1 < n_2 < n_3 < \cdots$ in
          $\mathbb{N}$. The subsequence is $k \mapsto a_{n_k}$. With $n_k = 2k$
          you get $a_2, a_4, a_6, \ldots$; with $n_k = k^{2}$ you get $a_1,
          a_4, a_9, \ldots$.
      - teach: >
          Strict increase says three things at once: order is preserved, no
          term is reused, and infinitely many terms survive. Anything you drop
          is gone, and nothing may be moved.
      - ask: >
          Which of these is a subsequence of $a_n = \frac{1}{n}$?
        choices:
          - text: >
              $\frac{1}{2}, 1, \frac{1}{4}, \frac{1}{3}, \ldots$
            feedback: >
              The indices run $2, 1, 4, 3, \ldots$, which is not increasing.
              Swapping terms is reordering, and a subsequence may not reorder.
          - text: >
              $1, 1, \frac{1}{2}, \frac{1}{2}, \ldots$
            feedback: >
              This needs $n_1 = n_2 = 1$, and the index list must increase
              *strictly*. Repetition is not allowed.
          - text: >
              $\frac{1}{3}, \frac{1}{9}, \frac{1}{27}, \ldots$
            correct: true
            feedback: >
              The indices are $3, 9, 27, \ldots$, that is $n_k = 3^{k}$, which
              is strictly increasing. Terms are dropped, never moved or
              repeated.
        feedback: >
          Read the index list, not the values: it must be strictly increasing,
          and then anything goes.
      - teach: >
          A consequence used everywhere: $n_k \ge k$. Indeed $n_1 \ge 1$, and
          $n_{k+1} > n_k \ge k$ forces $n_{k+1} \ge k+1$ since these are
          integers. A subsequence is always at least as far along as its own
          index.
      - ask: >
          A subsequence has $n_1 = 5$. What is the smallest value $n_4$ could
          take?
        expects: "8"
        hint: >
          The indices are integers and each must be strictly larger than the
          one before.
        feedback: >
          $8$. The cheapest legal continuation is $5, 6, 7, 8$, so $n_4 = 8$.
          Notice it still satisfies $n_4 \ge 4$ with room to spare — the bound
          $n_k \ge k$ is never tight after a late start.
      - ask: >
          Let $a_n = n^{2}$ and take $n_k = 2k - 1$. What is the fourth term of
          the subsequence?
        expects: "49"
        hint: >
          Find the fourth index first, then evaluate the original sequence
          there.
        feedback: >
          $49$. The fourth index is $n_4 = 2 \cdot 4 - 1 = 7$, and
          $a_7 = 7^{2} = 49$. The subsequence is $1, 9, 25, 49, \ldots$: the
          squares of the odd numbers.
      - teach: >
          Two closing facts. Every sequence is a subsequence of itself, taking
          $n_k = k$; and a subsequence of a subsequence is again one, since
          composing strictly increasing index maps keeps them strictly
          increasing. You may thin repeatedly without ever leaving the setting.

  - node: analysis.sequences.subsequence-limit
    hook: >
      The definition of convergence gives you no direct way to prove a sequence
      *diverges* — you would have to rule out every possible limit at once. This
      proposition supplies the standard way: find two subsequences that
      disagree.
    explanation: >
      If $a_n \to L$, then every subsequence converges to the same $L$. The
      proof is short because the index bound does all the work. Given
      $\varepsilon > 0$, take $N$ with $|a_n - L| < \varepsilon$ for all
      $n \ge N$. Now if $k \ge N$ then $n_k \ge k \ge N$, so the term $a_{n_k}$
      is one of the terms already covered by the estimate, and
      $|a_{n_k} - L| < \varepsilon$. The same $N$ that worked for the sequence
      works for the subsequence.

      That is intuitive — thinning a list cannot change where it is heading —
      but the contrapositive is what you will actually use. If some subsequence
      fails to converge to $L$, then the sequence does not converge to $L$. And
      if two subsequences converge to *different* values, the sequence converges
      to nothing at all: convergence would force both subsequential limits to
      equal the same $L$, and uniqueness of the limit forbids two values.

      So the divergence recipe is: exhibit two subsequences with different
      limits. For $a_n = (-1)^{n}$ the even-indexed terms are constantly $1$ and
      the odd-indexed constantly $-1$, giving subsequential limits $1$ and $-1$;
      the sequence diverges. No $\varepsilon$ argument, no case analysis over
      candidate limits.

      A single convergent subsequence proves nothing in the other direction.
      $a_n = (-1)^{n}$ has a subsequence converging to $1$ and diverges anyway,
      so "some subsequence converges" is a much weaker statement than "the
      sequence converges" — a gap the Bolzano–Weierstrass Theorem will exploit
      rather than close.
    worked: >
      Show that $a_n = \frac{(-1)^{n} n}{n + 1}$ diverges. Take the
      even-indexed subsequence, $n_k = 2k$: since $(-1)^{2k} = 1$, it is
      $a_{2k} = \frac{2k}{2k + 1} = \frac{1}{1 + \frac{1}{2k}}$, which tends to
      $1$ by the algebra of limits — its terms are $\frac{2}{3},
      \frac{4}{5}, \frac{6}{7}, \ldots$. Take the odd-indexed subsequence,
      $n_k = 2k - 1$: it is $-\frac{2k-1}{2k}$, with terms $-\frac{1}{2},
      -\frac{3}{4}, -\frac{5}{6}, \ldots$, tending to $-1$. If $(a_n)$
      converged to some $L$, both subsequences would have to converge to that
      same $L$, forcing $1 = L = -1$. They do not, so $(a_n)$ diverges — even
      though $|a_n| \to 1$ and the sequence is perfectly bounded.
    pitfalls: >
      The proposition runs one way only: every subsequence converging is what
      convergence gives you, not what proves it. Exhibiting one subsequence with
      a limit shows nothing, as $(-1)^{n}$ demonstrates. And when you use the
      contrapositive, the two subsequential limits must actually differ —
      showing that the even and odd terms both tend to $3$ is evidence *for*
      convergence, not against it.
    recap: >
      Since $n_k \ge k$, the threshold that works for a sequence works for all
      its subsequences — so two subsequences with different limits is a proof of
      divergence.
    steps:
      - teach: >
          Proving convergence means producing an $N$ for each $\varepsilon$.
          Proving *divergence* from the definition would mean ruling out every
          real number as a limit, one at a time. There is a much better way.
      - teach: >
          First the positive statement: if $a_n \to L$, then every subsequence
          also converges to $L$. Thinning a list cannot change where it is
          heading.
      - ask: >
          Where does the proof use $n_k \ge k$?
        choices:
          - text: >
              To show the subsequence is increasing.
            feedback: >
              The *indices* increase, not the terms. Nothing here says the
              subsequence is monotone, and it usually is not.
          - text: >
              To guarantee that $k \ge N$ makes $a_{n_k}$ one of the terms the
              original estimate already covers.
            correct: true
            feedback: >
              $k \ge N$ gives $n_k \ge k \ge N$, so $|a_{n_k} - L| <
              \varepsilon$ by the estimate you already hold. The same $N$ serves
              both.
          - text: >
              To show the subsequence has the same terms as the sequence.
            feedback: >
              It has *some* of them, which is the point. The bound is about how
              far along the original list the $k$-th selected term sits.
        feedback: >
          A subsequence is always at least as deep into the sequence as its own
          index, so any threshold you have already met is met again.
      - teach: >
          Now read it backwards. If two subsequences converge to different
          values, the sequence cannot converge: convergence would force both of
          those values to equal the one limit, and a limit is unique.
      - ask: >
          For $a_n = \frac{(-1)^{n} n}{n+1}$, what is the limit of the
          even-indexed subsequence?
        expects: "1"
        hint: >
          At even indices the sign factor is $+1$; then divide top and bottom by
          $n$.
        feedback: >
          $1$. With $n = 2k$ the term is $\frac{2k}{2k+1} = \frac{1}{1 +
          \frac{1}{2k}} \to 1$. The odd-indexed subsequence tends to $-1$ by the
          same computation with a minus sign, so the sequence diverges.
      - teach: >
          That is the whole recipe for divergence: find two selections of
          indices along which the sequence heads for different places. For
          $(-1)^{n}$ the even terms are constantly $1$ and the odd ones
          constantly $-1$, and you are done in a line.
      - ask: >
          A sequence has a subsequence converging to $5$. What follows?
        choices:
          - text: >
              The sequence converges to $5$.
            feedback: >
              $(-1)^{n}$ has a subsequence converging to $1$ and converges to
              nothing. One well-behaved selection says nothing about the rest.
          - text: >
              Nothing about convergence of the sequence; but if it *does*
              converge, its limit is $5$.
            correct: true
            feedback: >
              Exactly. Convergence would force every subsequence to the same
              limit, so $5$ is the only candidate — while the sequence may
              still diverge.
          - text: >
              The sequence diverges.
            feedback: >
              A convergent sequence has convergent subsequences too, so this
              observation is compatible with convergence. It simply does not
              decide the question.
        feedback: >
          One convergent subsequence identifies the only possible limit and
          proves nothing on its own. It takes two disagreeing subsequences to
          decide against convergence.
      - teach: >
          Keep both directions straight: convergence pushes down to every
          subsequence, and disagreement between two subsequences pushes back up
          to divergence.

  - node: analysis.sequences.bolzano-weierstrass
    hook: >
      Boundedness is almost no information — it permits any amount of
      oscillation. This theorem converts it into something strong anyway, and
      the Cauchy criterion, the Extreme Value Theorem and most compactness
      arguments you will meet run on it.
    explanation: >
      Every bounded sequence of real numbers has a convergent subsequence. No
      monotonicity, no pattern, no formula: whatever a bounded sequence is
      doing, some infinite selection of its terms settles down.

      The proof has two moves, and the first is the surprise: *every* sequence,
      bounded or not, has a monotone subsequence. Call an index $m$ a peak if
      $a_m \ge a_n$ for every $n > m$ — no later term ever gets above it. Split
      into cases on how many peaks there are.

      If there are infinitely many peak indices $m_1 < m_2 < \cdots$, take the
      terms at them. Each $m_j$ is a peak and $m_{j+1} > m_j$, so
      $a_{m_j} \ge a_{m_{j+1}}$: the selected terms decrease, and you have a
      decreasing subsequence. If instead there are finitely many peaks, start at
      any index $n_1$ past the last one. Since $n_1$ is not a peak, some
      $n_2 > n_1$ has $a_{n_2} > a_{n_1}$; and $n_2$ is not a peak either, so
      some $n_3 > n_2$ has $a_{n_3} > a_{n_2}$. Iterating gives a strictly
      increasing subsequence.

      The second move is a one-liner. A subsequence of a bounded sequence uses
      the same terms, so it is bounded too; being also monotone, it converges by
      the Monotone Convergence Theorem. That is the whole theorem — and note
      that completeness is doing the work underneath, entering through the
      Monotone Convergence Theorem. Boundedness cannot be dropped: $a_n = n$ has
      every subsequence unbounded, hence divergent.
    worked: >
      Extract a convergent subsequence from $a_n = (-1)^{n}\left(1 +
      \frac{1}{n}\right)$, whose terms are $-2$, $1.5$, $-1.333\ldots$, $1.25$,
      $-1.2$, $1.1666\ldots$ and which satisfies $|a_n| \le 2$. Hunt for peaks.
      Let $m$ be even, so $a_m = 1 + \frac{1}{m} > 1$. Any later term is either
      negative (odd index) or $1 + \frac{1}{n}$ with $n > m$, hence smaller. So
      every even index is a peak, and there are infinitely many of them. The
      construction therefore takes the terms at even indices:
      $1.5, 1.25, 1.1666\ldots, 1.125, \ldots$, which is decreasing and bounded
      below by $1$, so by the Monotone Convergence Theorem it converges — to
      $\inf\left\{1 + \frac{1}{2k}\right\} = 1$. The original sequence diverges;
      the extracted subsequence converges to $1$.
    pitfalls: >
      The conclusion is about a subsequence and nothing more: $(-1)^{n}$ is
      bounded, has subsequences converging to $1$ and to $-1$, and itself
      converges to neither. The theorem also gives no control over *which* limit
      you get or which indices are selected — it is pure existence, so any
      argument needing a specific subsequence must construct it separately.
    recap: >
      Every sequence has a monotone subsequence, by the peak dichotomy; if the
      sequence is bounded that subsequence is bounded too, and the Monotone
      Convergence Theorem finishes the job.
    steps:
      - teach: >
          Bounded sequences can behave terribly — $(-1)^{n}$, or a sequence that
          lists every rational in $[0,1]$. Yet each of them contains an infinite
          selection of terms that converges. That is what this theorem claims.
      - teach: >
          The plan is two steps. First: every sequence, bounded or not, has a
          monotone subsequence. Second: a monotone bounded sequence converges,
          which you already have.
      - teach: >
          Call an index $m$ a peak if $a_m \ge a_n$ for every $n > m$ — no
          later term ever rises above it. For a decreasing sequence every index
          is a peak; for an increasing one none is.
      - ask: >
          How many peak indices does $a_n = n$ have?
        expects: "0"
        hint: >
          A peak needs $a_m \ge a_n$ for every later $n$. Is that ever possible
          here?
        feedback: >
          None, so $0$. A peak at $m$ would need $m \ge n$ for every $n > m$,
          which is false already at $n = m + 1$. With finitely many peaks —
          zero of them — the second case of the proof applies and builds an
          increasing subsequence, which for this sequence is the sequence
          itself.
      - teach: >
          Case one: infinitely many peaks $m_1 < m_2 < \cdots$. Since each
          $m_j$ is a peak and $m_{j+1}$ comes later, $a_{m_j} \ge a_{m_{j+1}}$
          — the terms at the peaks form a decreasing subsequence.
      - teach: >
          Case two: finitely many peaks. Start past the last one. That index is
          not a peak, so some later term is bigger; that index is not a peak
          either, so some later term is bigger still. Iterating gives an
          increasing subsequence.
      - ask: >
          You now hold a monotone subsequence of a bounded sequence. What
          finishes the proof?
        choices:
          - text: >
              The subsequence is bounded and monotone, so the Monotone
              Convergence Theorem gives it a limit.
            correct: true
            feedback: >
              A subsequence reuses the original terms, so the same bound applies
              to it; monotone plus bounded is exactly the hypothesis of that
              theorem — and that is where completeness enters.
          - text: >
              A monotone sequence always converges.
            feedback: >
              $a_n = n$ is monotone and diverges. Boundedness is a genuine
              second hypothesis, supplied here by the original sequence.
          - text: >
              The original sequence is bounded, so it converges.
            feedback: >
              Bounded sequences need not converge — $(-1)^{n}$ does not. The
              conclusion is only ever about the extracted subsequence.
        feedback: >
          Monotone subsequence plus inherited bound plus the Monotone
          Convergence Theorem. Completeness is doing the real work, one level
          down.
      - ask: >
          For $a_n = (-1)^{n}\left(2 - \frac{1}{n}\right)$, the even indices are
          all peaks. What is the limit of the subsequence taken at them?
        expects: "2"
        hint: >
          At even indices the sign is $+1$, so write down that subsequence
          explicitly.
        feedback: >
          $2$. The even-indexed terms are $2 - \frac{1}{2k}$, which increase
          toward $2$ — so the extraction lands on $2$, while the original
          sequence, oscillating between roughly $-2$ and $2$, diverges.
      - teach: >
          Boundedness cannot be dropped: every subsequence of $a_n = n$ is
          itself unbounded, hence divergent. And the theorem is pure existence —
          it never tells you which indices or which limit you get.
