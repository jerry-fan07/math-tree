unit: number-theory.divisibility
opening: >
  Every integer above $1$ is built out of primes in exactly one way, and this
  unit earns that sentence from scratch. It starts not with an operation but
  with a relation — $a \mid b$ asks whether some integer $c$ makes $b = ac$ —
  and turns it into machinery: division with remainder, the greatest common
  divisor, the Euclidean algorithm that computes gcds without factorising
  anything, and Bézout's identity, which writes the gcd as $ax + by$ and is the
  hinge the rest of the subject swings on. Out of Bézout come coprimality,
  Euclid's lemma, and the fundamental theorem of arithmetic; out of unique
  factorisation come divisor counts, gcd and lcm read off exponents, primality
  testing, and the irrationality of $\sqrt{2}$. By the end you should be able to
  run the Euclidean algorithm on any pair, produce Bézout coefficients by
  back-substitution, factor a number by trial division, and say which claims
  about primes really need Euclid's lemma and which are just bookkeeping.
lessons:
  - node: number-theory.divisibility.def-divisibility
    hook: >
      Divisibility is the single relation this whole unit is about, and it is
      not division: writing $a \mid b$ commits you to producing an integer, not
      to a quotient looking tidy on a calculator.
    explanation: >
      Start with something you can see. Is $12$ a multiple of $3$? Yes, because
      $12 = 3 \cdot 4$, and $4$ is an integer. Is $13$? The multiples of $3$ run
      $\ldots, 9, 12, 15, \ldots$ and $13$ is not among them, so no. That test
      is the whole definition: $a \mid b$ means *there exists* an integer $c$
      with $b = ac$. You produce a witness $c$, or you show none can exist.

      Notice what the definition never writes down: the quotient $b/a$. It is an
      existence claim about a third integer, not a division carried out. That is
      not fussiness — it is what lets the definition survive $a = 0$ without any
      special pleading, since $0 \mid b$ simply asks whether some $c$ has
      $b = 0 \cdot c$, and $0 \cdot c$ is $0$ whatever $c$ is. So $0 \mid 0$ is
      true, with witness $c = 5$ or any other integer, while $0 \mid 7$ is
      false.

      Two more consequences fall straight out of the shape of the definition.
      Every integer divides $0$, because $0 = a \cdot 0$ always. And $1$ divides
      everything, because $b = 1 \cdot b$ always. Those two are the extremes the
      relation runs between.

      Signs are invisible to it. If $12 = 3 \cdot 4$ then also
      $12 = (-3) \cdot (-4)$ and $-12 = 3 \cdot (-4)$, so $3 \mid 12$,
      $-3 \mid 12$ and $3 \mid -12$ all hold together. Divisibility is a
      statement about a pair of integers — true or false — and never a number
      you can add to something.
    worked: >
      Does $7 \mid -91$? Look for an integer $c$ with $-91 = 7c$. Since
      $7 \cdot 13 = 91$, take $c = -13$: then $7 \cdot (-13) = -91$, and $-13$
      is an integer, so yes, $7 \mid -91$. Now does $6 \mid 92$? Any witness
      would need $6c = 92$. Walk the multiples of $6$ past $92$:
      $6 \cdot 15 = 90$ and $6 \cdot 16 = 96$, and nothing sits between them, so
      no integer $c$ works and $6 \nmid 92$. Finally list every divisor of
      $20$: the positive ones are $1, 2, 4, 5, 10, 20$, and each has a negative
      partner, so $20$ has $12$ divisors in all and $6$ positive ones.
    pitfalls: >
      The bar points the small way: $a \mid b$ says $a$ is a factor of $b$, so
      $3 \mid 12$ is true and $12 \mid 3$ is false — reading it backwards is the
      most common slip of all. The zero cases invert what people guess: $7 \mid
      0$ is true and $0 \mid 7$ is false, and $0 \mid 0$ is true even though no
      quotient exists. And $a \mid b$ is a claim, not a value; an expression
      like $3 \mid 12 + 1$ has no meaning until you say what is being asserted.
    recap: >
      $a \mid b$ means some integer $c$ satisfies $b = ac$ — an existence claim
      about a witness, which is why it never divides anything and never trips
      over zero or a minus sign.
    steps:
      - teach: >
          Before you can say an integer breaks into prime factors, you need to
          say what a factor is — and you need to say it without dividing,
          because "the division came out even" is a statement about a
          calculator, not about the integers.
      - teach: >
          Here is the definition. For integers $a$ and $b$, we write
          $a \mid b$ when there exists an integer $c$ with $b = ac$. The witness
          $c$ is what you must produce; the quotient $b/a$ is never written.
      - teach: >
          So $3 \mid 12$ holds, with witness $c = 4$, because
          $12 = 3 \cdot 4$. And $3 \nmid 13$, because the multiples of $3$ step
          from $12$ straight to $15$ and skip $13$ entirely.
      - ask: >
          Take $a = 7$ and $b = 91$. What integer $c$ witnesses $7 \mid 91$?
        expects: "13"
        hint: >
          You need the integer that $7$ must be multiplied by to reach $91$.
        feedback: >
          $c = 13$, because $7 \cdot 13 = 91$. That single equation is the
          entire proof that $7 \mid 91$ — no division is performed anywhere in
          it.
      - teach: >
          Because the definition only asks for a witness, zero causes no
          trouble. Every $a$ divides $0$, since $0 = a \cdot 0$. But $0 \mid b$
          asks for $b = 0 \cdot c$, and $0 \cdot c$ is always $0$, so $0$
          divides only $0$.
      - ask: >
          Which of these three statements is *false*?
        choices:
          - text: >
              $7 \mid 0$
            feedback: >
              True. Take $c = 0$: then $0 = 7 \cdot 0$, so the witness exists
              and $7 \mid 0$. Every integer divides $0$.
          - text: >
              $0 \mid 7$
            correct: true
            feedback: >
              False. A witness would need $7 = 0 \cdot c$, but $0 \cdot c$ is
              $0$ for every integer $c$, and $0 \ne 7$. Zero divides nothing but
              zero.
          - text: >
              $0 \mid 0$
            feedback: >
              True, and it surprises people. Take $c = 1$: then
              $0 = 0 \cdot 1$. The definition asks for a witness, not for a
              quotient, so the undefined fraction $0/0$ never comes up.
        feedback: >
          Zero is a fine dividend and a hopeless divisor: $a \mid 0$ for every
          $a$, while $0 \mid b$ forces $b = 0$.
      - teach: >
          Signs are invisible to the relation. From $12 = 3 \cdot 4$ you also
          get $12 = (-3)(-4)$ and $-12 = 3 \cdot (-4)$, so $3 \mid 12$,
          $-3 \mid 12$ and $3 \mid -12$ stand or fall together.
      - ask: >
          How many *positive* integers divide $20$?
        expects: "6"
        hint: >
          Test $1, 2, 3, \ldots$ up to $20$ and keep the ones that leave nothing
          over.
        feedback: >
          Six: $1, 2, 4, 5, 10$ and $20$. Counting negatives as well would give
          twelve, since each positive divisor has a negative partner — which is
          why "positive" has to be said out loud.
      - teach: >
          Hold on to the shape of it: divisibility is a true-or-false statement
          about a pair of integers, proved by exhibiting one integer. Every
          proof in this unit ends by exhibiting one.

  - node: number-theory.divisibility.divisibility-properties
    hook: >
      These are the five facts every later argument in the unit actually runs
      on — the Euclidean algorithm, Bézout's identity and Euclid's proof that
      the primes never run out are all one of them applied twice.
    explanation: >
      Divisibility chains. If $3 \mid 21$ and $21 \mid 105$, then $3 \mid 105$,
      and you can watch the witnesses compose: $21 = 3 \cdot 7$ and
      $105 = 21 \cdot 5$, so $105 = (3 \cdot 7) \cdot 5 = 3 \cdot 35$. In
      general $a = ds$ and $b = at$ give $b = d(st)$, and $st$ is the witness.
      Together with $a \mid a$ this makes divisibility reflexive and transitive.

      Linearity is the one to memorise. If $d$ divides $a$ and $d$ divides $b$,
      then $d$ divides $ax + by$ for *any* integers $x$ and $y$. Again the
      proof is one line of algebra: $a = ds$ and $b = dt$ give
      $ax + by = d(sx + ty)$. Concretely, $7 \mid 91$ and $7 \mid 35$, so $7$
      must divide $91 \cdot 3 - 35 \cdot 5 = 273 - 175 = 98$, and indeed
      $98 = 7 \cdot 14$. Sums, differences and multiples are all special cases:
      take $(x,y) = (1,1)$, $(1,-1)$, $(c, 0)$.

      The size bound keeps things finite. If $a \mid b$ and $b \ne 0$, then
      $|a| \le |b|$ — because $b = ac$ with $c \ne 0$ forces $|c| \ge 1$, so
      $|b| = |a||c| \ge |a|$. The hypothesis $b \ne 0$ is doing real work, and
      dropping it is fatal: $5 \mid 0$ while $|5| > |0|$. The payoff is that a
      nonzero integer has only finitely many divisors, all inside
      $[-|b|, |b|]$, so you can list them and pick the biggest — which is
      exactly what the greatest common divisor will need.

      Two more. Antisymmetry: if $a \mid b$ and $b \mid a$ then $a = \pm b$, and
      $a = b$ when both are positive. Cancellation: $a \mid b$ gives
      $ac \mid bc$, and the converse holds whenever $c \ne 0$.
    worked: >
      Suppose $d$ divides both $96$ and $42$; deduce as much as you can without
      knowing $d$. Linearity says $d$ divides $96 - 42 = 54$, and
      $96 + 42 = 138$, and $96 \cdot 4 - 42 \cdot 7 = 384 - 294 = 90$. It also
      says $d \mid 96 - 2 \cdot 42 = 12$, which is the sharpest of these, and by
      the size bound it forces $d \le 12$. Check against the truth: the common
      divisors of $96$ and $42$ are $1, 2, 3$ and $6$, and every one of them
      does divide $54$, $138$, $90$ and $12$. Taking $d = 6$: $54 = 6 \cdot 9$,
      $138 = 6 \cdot 23$, $90 = 6 \cdot 15$ and $12 = 6 \cdot 2$.
    pitfalls: >
      Linearity runs one way only. From $5 \mid a + b$ you may not conclude
      $5 \mid a$ — take $a = 3$, $b = 7$. The size bound needs $b \ne 0$, and
      $a \mid 0$ for every $a$ is the standing counterexample to the version
      without it. And linearity needs the *same* divisor on both sides: from
      $2 \mid 4$ and $3 \mid 9$ nothing at all follows about $4 + 9$.
    recap: >
      A common divisor of two integers divides every integer combination of
      them, and a divisor of a nonzero integer is never bigger than it — those
      two facts carry the rest of the unit.
    steps:
      - teach: >
          Almost every proof ahead has the same shape: you know $d$ divides two
          numbers, and you want $d$ to divide some third number built out of
          them. This card set is that toolkit.
      - teach: >
          Divisibility chains. From $3 \mid 21$ and $21 \mid 105$ you get
          $3 \mid 105$, because the witnesses multiply: $21 = 3 \cdot 7$ and
          $105 = 21 \cdot 5$ give $105 = 3 \cdot 35$.
      - teach: >
          Linearity is the workhorse. If $d \mid a$ and $d \mid b$ then
          $d \mid ax + by$ for all integers $x, y$, since $a = ds$ and $b = dt$
          give $ax + by = d(sx + ty)$.
      - ask: >
          $7$ divides both $91$ and $35$, so $7$ divides
          $91 \cdot 3 - 35 \cdot 5$. What integer is that quotient — that is,
          the $k$ with $91 \cdot 3 - 35 \cdot 5 = 7k$?
        expects: "14"
        hint: >
          Work out the combination first, then divide it by $7$.
        feedback: >
          $91 \cdot 3 - 35 \cdot 5 = 273 - 175 = 98$, and $98 = 7 \cdot 14$, so
          $k = 14$. Linearity predicted this without any of the arithmetic:
          $91 = 7 \cdot 13$ and $35 = 7 \cdot 5$, so the combination is
          $7(13 \cdot 3 - 5 \cdot 5) = 7 \cdot 14$.
      - ask: >
          Which of these does *not* follow from the properties of divisibility?
        choices:
          - text: >
              If $d \mid a$ and $d \mid b$, then $d \mid 3a - 7b$.
            feedback: >
              This does follow — it is linearity with $x = 3$ and $y = -7$.
          - text: >
              If $d \mid a + b$, then $d \mid a$ and $d \mid b$.
            correct: true
            feedback: >
              This does not follow. $5 \mid 3 + 7$, yet $5$ divides neither $3$
              nor $7$. Linearity builds a combination out of two divisibilities;
              it cannot be run backwards to take one apart.
          - text: >
              If $d \mid a$, then $d \mid 5a$.
            feedback: >
              This does follow — linearity with $x = 5$ and $y = 0$, or just
              $a = ds$ giving $5a = d(5s)$.
        feedback: >
          Linearity assembles; it never disassembles. Knowing $d$ divides a sum
          tells you nothing about the summands taken singly.
      - teach: >
          The size bound: if $a \mid b$ and $b \ne 0$ then $|a| \le |b|$, since
          $b = ac$ with $c \ne 0$ forces $|c| \ge 1$. So a nonzero integer has
          only finitely many divisors — you can list them all.
      - ask: >
          Every common divisor of $96$ and $42$ also divides
          $96 - 2 \cdot 42$. What number is that?
        expects: "12"
        hint: >
          Just evaluate the combination; linearity guarantees the conclusion
          whatever it comes to.
        feedback: >
          $96 - 84 = 12$. So every common divisor of $96$ and $42$ divides $12$,
          and by the size bound none of them exceeds $12$ — a big pair of
          numbers has been replaced by a small one at no cost. That trick,
          repeated, is the Euclidean algorithm.
      - teach: >
          The last two facts round the list off: mutual divisibility between
          positives forces equality, and you may cancel a nonzero $c$ from
          $ac \mid bc$ to get $a \mid b$.

  - node: number-theory.divisibility.division-algorithm
    hook: >
      You have said "the remainder" all your life; this is the theorem that
      earns the word "the", by proving that exactly one quotient-remainder pair
      exists. Without it, modular arithmetic has nothing to stand on.
    explanation: >
      Divide $47$ by $6$ by hand. Walk up the multiples of $6$ until you would
      overshoot: $6 \cdot 7 = 42 \le 47$, while $6 \cdot 8 = 48 > 47$. So take
      $q = 7$ and let $r$ be what is left, $r = 47 - 42 = 5$. That gives
      $47 = 6 \cdot 7 + 5$ with $0 \le 5 < 6$. The theorem says this always
      works, for any $a$ and any $b \ne 0$, and that the pair $(q, r)$ you land
      on is the only one.

      Existence is where well-ordering enters. Consider all the leftovers
      $a - bq$ as $q$ ranges over the integers, and keep the nonnegative ones;
      call that set $S$. It is nonempty — with $b > 0$, taking $q = -|a|$ gives
      $a + b|a| \ge a + |a| \ge 0$. So $S$ is a nonempty set of nonnegative
      integers and has a least element $r = a - bq$. Here is the load-bearing
      step: if $r$ were still as big as $b$, then $r - b = a - b(q+1)$ would be
      nonnegative too and smaller than $r$, contradicting leastness. So
      $0 \le r < b$, forced not by cleverness but by minimality.

      Uniqueness is a size argument. If $bq_1 + r_1 = bq_2 + r_2$ with both
      remainders in $[0, b)$, then $b(q_1 - q_2) = r_2 - r_1$. The right side
      has absolute value less than $b$; the left side is a multiple of $b$. The
      only multiple of $b$ smaller than $b$ in size is $0$, so $r_1 = r_2$ and
      then $q_1 = q_2$.

      Negative $a$ is where hands slip. For $a = -47$, $b = 6$: the multiples of
      $6$ below $-47$ start at $6 \cdot (-8) = -48$, so $q = -8$ and
      $r = -47 - (-48) = 1$, giving $-47 = 6 \cdot (-8) + 1$. Not $-5$: the
      remainder is required to be nonnegative, so the quotient is pushed *down*
      rather than truncated toward zero. Finally, $r = 0$ happens exactly when
      $b \mid a$ — so the remainder measures precisely how far divisibility
      fails.
    worked: >
      Divide $a = -100$ by $b = 7$. Find the largest multiple of $7$ that does
      not exceed $-100$: $7 \cdot (-14) = -98$ is too big, and
      $7 \cdot (-15) = -105$ is not, so $q = -15$. Then
      $r = -100 - (-105) = 5$. The answer is $-100 = 7 \cdot (-15) + 5$, and the
      constraint checks out: $0 \le 5 < 7$. Two rival-looking equations are not
      answers — $-100 = 7 \cdot (-14) + (-2)$ has a negative remainder, and
      $-100 = 7 \cdot (-16) + 12$ has a remainder that is too large — and
      uniqueness says only one of the three can satisfy $0 \le r < 7$.
    pitfalls: >
      Negative dividends are the classic trap: dividing $-17$ by $5$ gives
      $q = -4$ and $r = 3$, because $-17 = 5 \cdot (-4) + 3$; the answer $-2$
      comes from truncating toward zero and violates $r \ge 0$. For a negative
      divisor the bound is $0 \le r < |b|$, so dividing $17$ by $-5$ gives
      $q = -3$ and $r = 2$. And an equation $a = bq + r$ on its own proves
      nothing — $47 = 6 \cdot 6 + 11$ is perfectly true and is not the division
      algorithm, because $11 \ge 6$.
    recap: >
      Any integer divided by a nonzero one leaves exactly one quotient and one
      remainder with $0 \le r < |b|$, and $r = 0$ says precisely that the
      division was exact.
    steps:
      - teach: >
          Everything ahead — the Euclidean algorithm, Bézout, modular
          arithmetic — depends on being able to say *the* remainder. That word
          needs a theorem behind it: one such pair exists, and no second one
          does.
      - teach: >
          The statement. For integers $a$ and $b$ with $b \ne 0$, there are
          unique integers $q$ and $r$ with $a = bq + r$ and $0 \le r < |b|$. The
          bound on $r$ is not decoration; it is what makes the pair unique.
      - teach: >
          By hand, for $47$ and $6$: climb the multiples of $6$ until the next
          one overshoots. $6 \cdot 7 = 42 \le 47 < 48 = 6 \cdot 8$, so $q = 7$
          and $r = 47 - 42 = 5$, giving $47 = 6 \cdot 7 + 5$.
      - ask: >
          What is the remainder when $100$ is divided by $7$?
        expects: "2"
        hint: >
          Find the largest multiple of $7$ that does not exceed $100$.
        feedback: >
          $7 \cdot 14 = 98$ and $7 \cdot 15 = 105$, so $q = 14$ and
          $r = 100 - 98 = 2$. The pair $(14, 2)$ is the only one meeting
          $0 \le r < 7$.
      - teach: >
          The proof of existence: collect the nonnegative leftovers $a - bq$ as
          $q$ varies. That set is nonempty, so by well-ordering it has a least
          element, and we call it $r$.
      - ask: >
          In that proof, what forces the least leftover $r$ to satisfy
          $r < b$?
        choices:
          - text: >
              The set of leftovers is nonempty.
            feedback: >
              Nonemptiness is what lets you speak of a least element at all. It
              says nothing about how big that element is.
          - text: >
              If $r \ge b$ then $r - b = a - b(q+1)$ is a smaller nonnegative
              leftover, contradicting leastness.
            correct: true
            feedback: >
              Exactly. Subtracting $b$ from a leftover produces another
              leftover, so a leftover of size $b$ or more is never the smallest.
              Minimality alone does all the work.
          - text: >
              The uniqueness half of the theorem, applied to $r$ and $r - b$.
            feedback: >
              Uniqueness is proved afterwards and from the bound $0 \le r < b$,
              so using it here would be circular.
        feedback: >
          The bound on the remainder is not imposed; it falls out of choosing
          the *least* nonnegative leftover.
      - teach: >
          Negative dividends push the quotient down, not toward zero. For
          $a = -47$, $b = 6$: the multiples of $6$ reach $-48$ before $-47$, so
          $q = -8$ and $r = -47 - (-48) = 1$.
      - ask: >
          What is the remainder when $-17$ is divided by $5$?
        expects: "3"
        hint: >
          The remainder must be nonnegative, so pick the multiple of $5$ that
          sits just *below* $-17$.
        feedback: >
          $5 \cdot (-4) = -20 \le -17$, so $q = -4$ and
          $r = -17 - (-20) = 3$, giving $-17 = 5 \cdot (-4) + 3$. Truncating
          toward zero would offer $-2$, which the condition $0 \le r$ rules out.
      - teach: >
          One consequence to carry forward: $r = 0$ exactly when $b \mid a$. The
          remainder is a numerical measure of how badly divisibility fails, and
          the next few lessons exploit that it is small.

  - node: number-theory.divisibility.def-gcd
    hook: >
      Putting a fraction in lowest terms, or asking how much two integers have
      in common multiplicatively, both need one number that captures everything
      they share — and the definition of it is surprisingly cheap.
    explanation: >
      Take $84$ and $36$ and just list. The positive divisors of $84$ are
      $1, 2, 3, 4, 6, 7, 12, 14, 21, 28, 42, 84$; those of $36$ are
      $1, 2, 3, 4, 6, 9, 12, 18, 36$. Cross off everything not on both lists and
      you are left with $1, 2, 3, 4, 6, 12$. The largest is $12$, so
      $\gcd(84, 36) = 12$. That is the definition, and nothing more subtle is
      going on.

      Why does the largest always exist? Two facts you already have. The set of
      common divisors is nonempty, because $1$ divides everything. And it is
      finite, because at least one of $a$ and $b$ is nonzero, and by the size
      bound every divisor of a nonzero integer $n$ satisfies $|d| \le |n|$. A
      nonempty finite set of integers has a largest element. So $\gcd(a,b)$
      exists whenever $a$ and $b$ are not both zero, and it satisfies
      $1 \le \gcd(a,b) \le \max(|a|, |b|)$ — in particular it is always
      positive.

      Several identities are immediate from the listing picture, because the
      list of common divisors does not change. Order does not matter, so
      $\gcd(a,b) = \gcd(b,a)$; signs do not matter, so
      $\gcd(a,b) = \gcd(|a|,|b|)$ and $\gcd(-8, 12) = \gcd(8,12) = 4$. And
      $\gcd(a, 0) = |a|$ for $a \ne 0$, because every integer divides $0$, so
      the common divisors of $a$ and $0$ are just the divisors of $a$. Only
      $\gcd(0,0)$ is problematic — every integer is a common divisor and there
      is no largest — so it is fixed by the convention $\gcd(0,0) = 0$.

      One thing the definition does *not* say, and it matters later. Look at the
      common divisors of $84$ and $36$ again: $1, 2, 3, 4, 6, 12$. Every one of
      them divides $12$. That looks like it must be automatic, but nothing in
      "largest" implies it — being no bigger than $12$ is a far weaker claim
      than dividing $12$. Making it a theorem takes Bézout's identity.
    worked: >
      Reduce $60/45$ using the definition alone. The positive divisors of $60$
      are $1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60$, and those of $45$ are
      $1, 3, 5, 9, 15, 45$. The common ones are $1, 3, 5, 15$, so
      $\gcd(60, 45) = 15$. Divide it out: $60 = 15 \cdot 4$ and
      $45 = 15 \cdot 3$, so $60/45 = 4/3$. The result is in lowest terms because
      the only positive common divisor of $4$ and $3$ is $1$ — and notice how
      much labour listing every divisor of both numbers took, which is the
      reason the Euclidean algorithm exists.
    pitfalls: >
      $\gcd(0, n) = |n|$, not $0$ and not undefined — every integer divides
      $0$, so $0$ imposes no constraint at all. $\gcd(0,0) = 0$ is a convention
      chosen to make later formulas work, not a computation. And the gcd is
      always positive even when its inputs are not: $\gcd(-8, -12) = 4$, never
      $-4$.
    recap: >
      The greatest common divisor is the largest integer dividing both inputs,
      and it exists for the cheap reason that the candidates are finite in
      number and $1$ is always one of them.
    steps:
      - teach: >
          Two integers may share factors. To compare them, or to cancel a
          fraction down, you want a single number that carries all the sharing —
          the biggest thing that goes into both.
      - teach: >
          List and intersect. The positive divisors of $84$ are
          $1, 2, 3, 4, 6, 7, 12, 14, 21, 28, 42, 84$; those of $36$ are
          $1, 2, 3, 4, 6, 9, 12, 18, 36$. The common ones are
          $1, 2, 3, 4, 6, 12$.
      - ask: >
          From that list of common divisors, what is $\gcd(84, 36)$?
        expects: "12"
        hint: >
          The definition asks only for the largest entry on the shared list.
        feedback: >
          $12$. The common divisors are $1, 2, 3, 4, 6, 12$ and the greatest is
          $12$; check it directly with $84 = 12 \cdot 7$ and
          $36 = 12 \cdot 3$.
      - teach: >
          The largest always exists, for two reasons you already hold: $1$ is
          always a common divisor, so the list is nonempty; and by the size
          bound every divisor of the nonzero input is at most that input in
          absolute value, so the list is finite.
      - teach: >
          Because only the list of common divisors matters, $\gcd(a,b)$ ignores
          order and sign, and $\gcd(a, 0) = |a|$ — every integer divides $0$, so
          the second slot rules nothing out. The leftover case $\gcd(0,0)$ is
          set to $0$ by convention.
      - ask: >
          What is $\gcd(0, 7)$?
        expects: "7"
        hint: >
          Which integers are common divisors of $0$ and $7$? Remember what
          divides $0$.
        feedback: >
          $7$. Every integer divides $0$, so the common divisors of $0$ and $7$
          are exactly the divisors of $7$, namely $\pm 1$ and $\pm 7$, and the
          greatest is $7$. Answering $0$ mistakes the input for the output.
      - ask: >
          Which of these is *not* part of the definition of $\gcd(a,b)$?
        choices:
          - text: >
              It divides $a$ and it divides $b$.
            feedback: >
              That is half the definition: the gcd is chosen from among the
              common divisors, so it certainly is one.
          - text: >
              No common divisor of $a$ and $b$ is larger than it.
            feedback: >
              That is the other half — "greatest" means greatest in size among
              the common divisors.
          - text: >
              Every common divisor of $a$ and $b$ divides it.
            correct: true
            feedback: >
              True for the integers, but not by definition. Being no larger than
              $12$ is much weaker than dividing $12$, and closing that gap needs
              Bézout's identity.
        feedback: >
          The definition delivers a maximum and nothing else. The stronger
          divisibility property is a theorem, and it is the one that will
          matter.
      - teach: >
          Keep the shape in mind: the gcd is defined by a search over a finite
          list, which is a fine existence proof and a terrible algorithm. The
          next few lessons replace the search entirely.

  - node: number-theory.divisibility.bezout
    hook: >
      One equation, $ax + by = d$, promotes the gcd from a fact about lists of
      divisors to an algebraic object you can multiply through — and nearly
      every theorem in the rest of this unit is a corollary of it.
    explanation: >
      Look again at $84$ and $36$, whose gcd is $12$. Something more is true
      than "the largest common divisor is $12$": you can *build* $12$ out of
      them. $84 \cdot 1 + 36 \cdot (-2) = 84 - 72 = 12$. Bézout's identity says
      this is never an accident. For any $a, b$ not both zero, there are
      integers $x, y$ with $ax + by = \gcd(a,b)$. More sharply, $\gcd(a,b)$ is
      the *smallest positive* integer of the form $ax + by$, and the values
      $ax + by$ take are exactly the multiples of it. With $84$ and $36$ you can
      hit $12, 24, 36, \ldots$ and their negatives, and nothing else — $6$ and
      $8$ are unreachable.

      The proof. Let $S$ be the set of positive integers of the form $ax + by$.
      It is nonempty, since $a \cdot a + b \cdot b = a^2 + b^2 > 0$ lies in it.
      By well-ordering, $S$ has a least element $e = ax_0 + by_0$. Now the
      load-bearing step: divide $a$ by $e$, giving $a = eq + r$ with
      $0 \le r < e$. Rewrite the remainder,
      $r = a - eq = a(1 - qx_0) + b(-qy_0)$ — it is again of the form
      $ax + by$. It is smaller than $e$, and $e$ was the least *positive* such
      value, so $r$ cannot be positive: $r = 0$, and $e \mid a$. The same
      argument with $b$ gives $e \mid b$.

      Finish it off. Since $e$ is a common divisor, $e \le d$ where
      $d = \gcd(a,b)$. And since $d \mid a$ and $d \mid b$, linearity says $d$
      divides the combination $ax_0 + by_0 = e$, so $d \le e$. Hence $e = d$:
      the least positive combination *is* the gcd.

      Two warnings that come with the theorem. The coefficients are never
      unique — if $ax + by = d$ then so does
      $(x + kb/d,\; y - ka/d)$ for every integer $k$, so for $84$ and $36$ the
      pair $(1, -2)$ can be traded for $(4, -9)$, and $84 \cdot 4 + 36 \cdot
      (-9) = 336 - 324 = 12$. And the proof is pure existence: it names $e$ as
      the least element of a set, which is no help at all if you actually want
      the numbers. Producing them is the job of the extended Euclidean
      algorithm.
    worked: >
      Take $a = 6$ and $b = 15$, so $d = \gcd(6,15) = 3$. Search small
      combinations: $6 \cdot (-2) + 15 \cdot 1 = -12 + 15 = 3$, so $(x,y) =
      (-2, 1)$ works. Bézout also says every value of $6x + 15y$ is a multiple
      of $3$, which settles two questions at once. The equation $6x + 15y = 7$
      has no integer solution, since $3 \nmid 7$. The equation $6x + 15y = 21$
      does: $21 = 3 \cdot 7$, so multiply the coefficients through by $7$ to get
      $(x, y) = (-14, 7)$, and check, $-84 + 105 = 21$.
    pitfalls: >
      An integer combination of $a$ and $b$ is not automatically the gcd:
      $6 \cdot 1 + 15 \cdot 1 = 21$ is a perfectly good combination, and the gcd
      is $3$. What is true is that every combination is a multiple of the gcd,
      and only the least positive one equals it — so exhibiting $ax + by = 1$
      does prove the gcd is $1$, while exhibiting $ax + by = 6$ proves only that
      the gcd divides $6$. And there is no such thing as *the* Bézout
      coefficients; infinitely many pairs work.
    recap: >
      The gcd of two integers is the least positive integer you can write as
      $ax + by$, and every such combination is one of its multiples.
    steps:
      - teach: >
          So far the gcd is the answer to a search. Bézout's identity turns it
          into an equation you can do algebra with — and equations, unlike
          searches, can be multiplied through by anything.
      - teach: >
          The statement: for $a, b$ not both zero there exist integers $x, y$
          with $ax + by = \gcd(a,b)$, this is the least positive value $ax + by$
          takes, and the full set of values is exactly the multiples of the gcd.
      - teach: >
          A first instance. $\gcd(84, 36) = 12$, and sure enough
          $84 \cdot 1 + 36 \cdot (-2) = 84 - 72 = 12$. Combinations of $84$ and
          $36$ reach every multiple of $12$ and nothing between them.
      - ask: >
          What is the smallest positive integer of the form $6x + 15y$ with
          $x, y$ integers?
        expects: "3"
        hint: >
          Bézout names this number. You can also just hunt: try to beat $6$ and
          $15$ by subtracting one from a multiple of the other.
        feedback: >
          $3$, which is $\gcd(6, 15)$. Explicitly
          $6 \cdot (-2) + 15 \cdot 1 = 3$. Nothing smaller is reachable, since
          $3$ divides both $6$ and $15$ and therefore divides every combination
          of them.
      - teach: >
          The proof starts with well-ordering. Let $e$ be the least positive
          value of $ax + by$, say $e = ax_0 + by_0$; the set is nonempty because
          $a^2 + b^2$ is in it. The whole theorem now rests on showing
          $e \mid a$.
      - ask: >
          Divide $a$ by $e$: $a = eq + r$ with $0 \le r < e$, and rewrite
          $r = a(1 - qx_0) + b(-qy_0)$. Why must $r$ be $0$?
        choices:
          - text: >
              Because $r < e$ and $r$ is itself of the form $ax + by$, and $e$
              is the least *positive* value of that form.
            correct: true
            feedback: >
              Exactly. A positive $r$ would be a combination smaller than the
              smallest one, so $r$ has no choice but to be $0$ — which says
              $e \mid a$.
          - text: >
              Because $e$ is a common divisor of $a$ and $b$, so it divides $a$
              exactly.
            feedback: >
              That $e$ is a common divisor is what this step is *proving*.
              Assuming it here makes the argument circular.
          - text: >
              Because the division algorithm always returns remainder $0$ when
              the divisor is the least element of a set.
            feedback: >
              The division algorithm makes no such promise; it only bounds $r$
              by the divisor. Minimality of $e$, not the division algorithm, is
              what kills $r$.
        feedback: >
          The pattern is worth naming, because it recurs: build a smaller
          element of the same shape, and let minimality forbid it.
      - ask: >
          $84 \cdot 4 + 36y = 12$ for some integer $y$. What is $y$?
        expects: "-9"
        hint: >
          Work out $84 \cdot 4$, subtract $12$, and see how many $36$s that is.
        feedback: >
          $84 \cdot 4 = 336$, and $336 - 12 = 324 = 36 \cdot 9$, so $y = -9$.
          Together with the earlier pair $(1, -2)$ this shows the coefficients
          are not unique: adding $3$ to $x$ and subtracting $7$ from $y$ leaves
          the value alone, since $3 = 36/12$ and $7 = 84/12$.
      - teach: >
          One trap to store. A combination of $a$ and $b$ need not be the gcd:
          $6 \cdot 1 + 15 \cdot 1 = 21$, while $\gcd(6,15) = 3$. Every
          combination is a multiple of the gcd; only the least positive one is
          the gcd itself.
