# Problems targeting quant-games.game-theory — strategic play.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No payoff table here repeats a
# lesson's worked example. Payoff matrices are written as prose row lists, never
# a matrix environment, and money is written with the word "dollars". Every
# number below was checked with Python fractions. See ../README.md.

problems:
  # --- normal-form games -------------------------------------------------------

  - id: qgt-normal-form-01
    kind: work
    difficulty: demanding
    statement: >
      Four trading desks play a one-shot quoting game. Desks $1$ and $2$ each
      choose among $3$ quotes, desk $3$ chooses between $2$, and desk $4$ chooses
      among $5$. Writing the game down in normal form means giving every desk a
      payoff at every combination of choices. How many individual payoff numbers
      does the full specification contain?
    answer: >
      $360$. A strategy profile is one choice per player, so the number of
      profiles is the product of the strategy-set sizes:
      $3 \times 3 \times 2 \times 5 = 90$. The payoff function has to assign a
      number to *each player* at *each* profile, and there are four players, so
      the count is $4 \times 90 = 360$ numbers. The trap is stopping at $90$ —
      that is the number of cells, not the number of entries, and a cell of a
      four-player game holds a vector of four payoffs, not one. The size of the
      object is why later concepts exist: dominance and equilibrium let you avoid
      inspecting all $90$ cells by hand.
    expects: "360"
    rubric:
      - >
        Multiplies the strategy-set sizes to get $90$ profiles rather than adding
        them.
      - >
        Multiplies by the number of players, because every profile carries one
        payoff per player, giving $360$ rather than $90$.
    targets:
      - quant-games.game-theory.normal-form

  - id: qgt-normal-form-02
    kind: decide
    difficulty: standard
    statement: >
      A candidate is handed a payoff table and told "this is the game". Of the
      four items below, which one is *not* part of the data a normal-form game
      records?
    answer: >
      The order in which the players move. Normal form records exactly three
      things: the list of players, each player's set of pure strategies, and a
      payoff number for every player at every strategy profile. Timing is
      deliberately absent — all players are treated as choosing once,
      simultaneously and without communication, which is why the same table can
      model a genuinely simultaneous game or a game where the moves happen at
      different clock times but nobody observes anybody else. Sequence and
      observation live in the *extensive* form, the tree with information sets;
      collapsing a tree to profiles and payoffs throws that structure away, and
      that is the whole difference between the two representations.
    choices:
      - text: >
          The order in which the players move.
        correct: true
        feedback: >
          Right — timing and observation live in the extensive form, not in a
          payoff table.
      - text: >
          The set of pure strategies available to each player.
        feedback: >
          This is part of the data: a normal-form game is players, strategy sets
          and payoffs.
      - text: >
          The payoff each player receives at every strategy profile.
        feedback: >
          This is the payoff function itself — the third and largest piece of the
          specification.
      - text: >
          The list of players.
        feedback: >
          This is the first piece of the specification; without it there is no
          game to write down.
    rubric:
      - >
        Names players, strategy sets and payoffs as the whole of the normal form,
        and places move order in the extensive form instead.
    targets:
      - quant-games.game-theory.normal-form

  # --- dominance and iterated elimination --------------------------------------

  - id: qgt-dominance-01
    kind: work
    difficulty: demanding
    statement: >
      Rows $A, B, C$ face columns $L, M, R$, payoffs $(\text{row},
      \text{column})$ — row $A$: $(6,2)$ against $L$, $(3,4)$ against $M$,
      $(1,5)$ against $R$; row $B$: $(5,3)$ against $L$, $(4,6)$ against $M$,
      $(2,1)$ against $R$; row $C$: $(2,5)$ against $L$, $(1,2)$ against $M$,
      $(0,4)$ against $R$. Run iterated elimination of strictly dominated
      strategies to the end. What payoff does the *row* player receive at the
      surviving profile?
    answer: >
      $4$, at the profile $(B, M)$. Nothing on the column side is dominated at
      the start, so begin with the rows. Row $C$ pays $2, 1, 0$ against $L, M, R$
      while row $A$ pays $6, 3, 1$ — strictly more in every column — so $C$ goes.
      With $C$ deleted the column player compares $L$, worth $2$ against $A$ and
      $3$ against $B$, with $M$, worth $4$ and $6$: $M$ strictly beats $L$, so
      $L$ goes. Note that this deletion was unavailable before, since $C$'s row
      gave $L$ a payoff of $5$ against $M$'s $2$. Now the row player compares $A$,
      paying $3$ and $1$ across $M$ and $R$, with $B$, paying $4$ and $2$: $B$
      strictly dominates, so $A$ goes. Finally the column player, facing only row
      $B$, takes $M$'s $6$ over $R$'s $1$. The survivor is $(B, M)$, paying
      $(4,6)$, and it is also the game's unique pure Nash equilibrium — strict
      elimination never deletes one.
    expects: "4"
    rubric:
      - >
        Checks the columns first and finds nothing dominated there, so the chain
        has to open on the row side with $C$.
      - >
        Re-examines the column player only *after* $C$ is gone, since $M$ beats
        $L$ only once row $C$'s payoff of $5$ at $L$ is off the table.
      - >
        Reports the row player's payoff $4$ at $(B,M)$ rather than the column
        player's $6$.
    targets:
      - quant-games.game-theory.dominance
    exercises:
      - quant-games.game-theory.normal-form

  - id: qgt-dominance-02
    kind: decide
    difficulty: standard
    statement: >
      The row player has strategies $X, Y, Z$ against columns $L$ and $R$, with
      row payoffs — $X$: $5$ against $L$, $2$ against $R$; $Y$: $3$ against $L$,
      $4$ against $R$; $Z$: $3$ against $L$, $1$ against $R$. Which statement
      about strict dominance among the row player's strategies is correct?
    answer: >
      $Z$ is strictly dominated by $X$. Compare column by column: $X$ pays $5$
      against $L$ where $Z$ pays $3$, and $2$ against $R$ where $Z$ pays $1$ —
      strictly more in *both* columns, which is exactly the definition. The trap
      is to compare $Z$ only with its nearest neighbour $Y$: there the payoffs
      tie at $3$ against $L$ and $Y$ wins $4$ to $1$ against $R$, so $Y$ only
      *weakly* dominates $Z$, and a candidate who checks that pairing alone
      reports weak dominance and hesitates to delete. Strict dominance needs only
      *some* strategy to beat $Z$ everywhere, and $X$ does. Nothing else is
      dominated: $X$ loses to $Y$ against $R$ ($2$ versus $4$) and $Y$ loses to
      $X$ against $L$ ($3$ versus $5$), so neither dominates the other.
    choices:
      - text: >
          $Z$ is strictly dominated, because $X$ pays more than $Z$ against both
          $L$ and $R$.
        correct: true
        feedback: >
          Exactly — dominance is an existential claim, so one strategy beating
          $Z$ everywhere is enough.
      - text: >
          $Z$ is only weakly dominated, by $Y$, so deleting it could destroy an
          equilibrium.
        feedback: >
          $Y$ does only weakly dominate $Z$, but $X$ dominates it *strictly*, and
          strict deletion is safe.
      - text: >
          $Y$ is strictly dominated by $X$, since $5 > 3$ against $L$.
        feedback: >
          One column is not enough — against $R$, $Y$ pays $4$ to $X$'s $2$, so
          neither dominates.
      - text: >
          No row strategy is strictly dominated, since no row is worst in both
          columns.
        feedback: >
          Being worst everywhere is sufficient but not necessary; $Z$ is beaten
          everywhere by $X$ alone.
    rubric:
      - >
        Tests dominance by comparing a candidate against *every* other row, not
        only the adjacent one.
      - >
        Distinguishes strict from weak dominance and notes that only strict
        deletion is order-independent and equilibrium-preserving.
    targets:
      - quant-games.game-theory.dominance

  # --- the prisoners' dilemma ---------------------------------------------------

  - id: qgt-prisoners-dilemma-01
    kind: work
    difficulty: demanding
    statement: >
      Two exchanges each choose to Hold their fee or Undercut. Payoffs
      $(\text{row}, \text{column})$ — row Hold: $(7,7)$ against Hold, $(2,11)$
      against Undercut; row Undercut: $(11,2)$ against Hold, $(4,4)$ against
      Undercut. By how much does the *joint* payoff at the game's equilibrium
      fall short of the joint payoff the exchanges would collect by both holding?
    answer: >
      $6$. First confirm the structure: with $T = 11$, $R = 7$, $P = 4$ and
      $S = 2$ the ordering $11 > 7 > 4 > 2$ is the prisoners' dilemma signature.
      Undercutting strictly dominates for each exchange — against a holder it
      pays $11$ versus $7$, against an undercutter $4$ versus $2$ — so both
      undercut and the equilibrium is (Undercut, Undercut) with joint payoff
      $4 + 4 = 8$. Mutual holding would pay $7 + 7 = 14$. The shortfall is
      $14 - 8 = 6$. Two things worth saying out loud: the comparison never
      depends on what the opponent does, which is what makes the prediction so
      robust, and the equilibrium is Pareto-dominated by a cell neither exchange
      can reach alone — equilibrium is a statement about unilateral deviation,
      never a claim that the outcome is good.
    expects: "6"
    rubric:
      - >
        Establishes dominance by comparing Undercut with Hold in each column
        separately, rather than asserting it from the shape of the table.
      - >
        Compares the *joint* payoffs $8$ and $14$, not one player's $4$ and $7$,
        and reports the difference $6$.
    targets:
      - quant-games.game-theory.prisoners-dilemma
    exercises:
      - quant-games.game-theory.dominance

  - id: qgt-prisoners-dilemma-02
    kind: decide
    difficulty: standard
    statement: >
      Two research desks each choose to Share a signal or Hoard it. Payoffs
      $(\text{row}, \text{column})$ — row Share: $(5,5)$ against Share, $(0,6)$
      against Hoard; row Hoard: $(6,0)$ against Share, $(2,2)$ against Hoard.
      Which statement about this game is correct?
    answer: >
      (Hoard, Hoard) is the unique Nash equilibrium, and both desks prefer
      (Share, Share) to it. Hoarding strictly dominates sharing for each desk:
      against a sharer it pays $6$ versus $5$, against a hoarder $2$ versus $0$.
      A profile of strictly dominant strategies is automatically an equilibrium
      and no other profile survives, so (Hoard, Hoard) at $(2,2)$ is unique. Yet
      $(5,5)$ beats $(2,2)$ for *both* players, which is the whole point: a Nash
      equilibrium is stable against one player changing their own strategy alone,
      and it says nothing about whether a coordinated change would help. The
      common error is to promote (Share, Share) to an equilibrium because it
      maximises the joint payoff — but a lone desk facing a sharer gains $1$ by
      hoarding, so it is not stable, however attractive it is.
    choices:
      - text: >
          (Hoard, Hoard) is the unique Nash equilibrium, and both desks prefer
          (Share, Share) to it.
        correct: true
        feedback: >
          Right — dominance settles the equilibrium, and Pareto-ranking is a
          separate question the concept never answers.
      - text: >
          (Share, Share) is a Nash equilibrium, because it maximises the sum of
          the two payoffs.
        feedback: >
          Maximising the joint payoff is not the test; facing a sharer, a desk
          gains by hoarding, $6$ against $5$.
      - text: >
          (Hoard, Share) is a Nash equilibrium, because $6$ is the largest payoff
          anywhere in the table.
        feedback: >
          The sharing desk would deviate to Hoard and lift its own payoff from
          $0$ to $2$, so the profile is not stable.
      - text: >
          The game has no pure Nash equilibrium, so both desks must randomise.
        feedback: >
          A dominant strategy exists for both, so a pure equilibrium certainly
          exists — mixing is never forced here.
    rubric:
      - >
        Establishes dominance column by column and concludes uniqueness from it.
      - >
        States that equilibrium constrains unilateral deviations only, so a
        Pareto-superior cell can sit outside it.
    targets:
      - quant-games.game-theory.prisoners-dilemma

  # --- Nash equilibrium (prominence 2) -----------------------------------------

  - id: qgt-nash-01
    kind: work
    difficulty: demanding
    statement: >
      Rows $A, B, C$ face columns $L, M, R$, payoffs $(\text{row},
      \text{column})$ — row $A$: $(5,4)$ against $L$, $(3,1)$ against $M$,
      $(2,3)$ against $R$; row $B$: $(1,2)$ against $L$, $(6,5)$ against $M$,
      $(4,0)$ against $R$; row $C$: $(3,4)$ against $L$, $(2,2)$ against $M$,
      $(7,6)$ against $R$. How many pure-strategy Nash equilibria does this game
      have?
    answer: >
      $3$. Mark best responses. Down each column, the row player's best row is:
      column $L$, $\max(5,1,3) = 5$ at $A$; column $M$, $\max(3,6,2) = 6$ at $B$;
      column $R$, $\max(2,4,7) = 7$ at $C$. Across each row, the column player's
      best column is: row $A$, $\max(4,1,3) = 4$ at $L$; row $B$,
      $\max(2,5,0) = 5$ at $M$; row $C$, $\max(4,2,6) = 6$ at $R$. A profile is a
      pure equilibrium exactly where the two marks coincide, and that happens at
      $(A,L)$, $(B,M)$ and $(C,R)$ — three of them, paying $(5,4)$, $(6,5)$ and
      $(7,6)$. Two traps: scanning for "the" equilibrium and stopping at the
      first hit, and picking $(C,R)$ alone because $(7,6)$ is the best cell in
      the table. Equilibrium is a local, per-player stability test, so nothing
      forbids three of them, ranked or not.
    expects: "3"
    rubric:
      - >
        Computes best responses column-by-column for the row player and
        row-by-row for the column player, rather than eyeballing large payoffs.
      - >
        Reports every profile where the two best-response marks coincide, giving
        a count of $3$ rather than stopping at the first or the largest.
    targets:
      - quant-games.game-theory.nash

  - id: qgt-nash-02
    kind: decide
    difficulty: standard
    statement: >
      Rows $U, D$ face columns $L, R$, payoffs $(\text{row}, \text{column})$ —
      row $U$: $(4,6)$ against $L$, $(7,2)$ against $R$; row $D$: $(3,1)$ against
      $L$, $(5,8)$ against $R$. Which profile is a Nash equilibrium?
    answer: >
      $(U, L)$, paying $(4,6)$. Check it directly: holding $L$ fixed, the row
      player's alternative $D$ pays $3$ against $U$'s $4$, so no unilateral
      gain; holding $U$ fixed, the column player's alternative $R$ pays $2$
      against $L$'s $6$, so none there either. Now check the tempting cell. At
      $(D, R)$ the payoffs are $(5,8)$, better for *both* players than $(4,6)$ —
      but from $(D,R)$ the row player deviates to $U$ and collects $7$ instead of
      $5$, so the profile is not stable and cannot be an equilibrium. This is the
      trap in one picture: the equilibrium is Pareto-dominated by a cell the
      players cannot hold, because the row player's private incentive breaks it.
      $(U,R)$ fails on the column side ($2 < 6$) and $(D,L)$ fails on the row
      side ($3 < 4$), so $(U,L)$ is unique.
    choices:
      - text: >
          $(U, L)$, paying $(4,6)$.
        correct: true
        feedback: >
          Right — and note that it is the *only* profile from which neither
          player gains by moving alone.
      - text: >
          $(D, R)$, paying $(5,8)$, since both players do better there than
          anywhere else they might agree on.
        feedback: >
          Both do prefer it, but the row player deviates to $U$ for $7$, so it is
          not stable — the classic reading of Nash as "the best outcome".
      - text: >
          $(U, R)$, since $7$ is the row player's largest payoff in the table.
        feedback: >
          The column player then switches from $R$'s $2$ to $L$'s $6$, so this
          profile does not survive.
      - text: >
          $(D, L)$, since $D$ is the row player's cautious choice.
        feedback: >
          The row player gains immediately by moving to $U$, $4$ against $3$.
    rubric:
      - >
        Tests each candidate profile by asking whether *either* player gains from
        a unilateral switch, checking both sides.
      - >
        Notes explicitly that $(D,R)$ pays both players more and still fails the
        test, so Pareto ranking and equilibrium are different questions.
    targets:
      - quant-games.game-theory.nash

  - id: qgt-nash-03
    kind: justify
    difficulty: standard
    statement: >
      Argue that if every player has a strictly dominant strategy, then the
      profile in which each plays it is a Nash equilibrium — and explain why the
      converse fails, so that an equilibrium need not involve dominant
      strategies.
    answer: >
      Forward direction. Fix a player $i$ whose strategy $s_i$ strictly dominates
      every alternative, meaning $s_i$ pays $i$ strictly more than any other
      strategy of $i$ *against every* profile of opponents' strategies. The
      equilibrium test asks something weaker: that $s_i$ be at least as good as
      any alternative against the *one particular* profile the others are playing.
      Dominance holds against every opponent profile, so in particular it holds
      against that one; hence no deviation by $i$ pays. The argument used nothing
      about $i$, so it applies to every player at once, and the dominant-strategy
      profile is a Nash equilibrium. Note the direction of the quantifier — this
      is why the dominant-strategy prediction is stronger: it requires no belief
      about what the opponents do, while equilibrium requires beliefs that happen
      to be correct.
      Converse. Best response is a condition *relative to a fixed opponent
      profile*, so it can hold for one profile and fail for another. Take rows
      $U, D$ against columns $L, R$ with row payoffs $U$: $3$ against $L$, $0$
      against $R$, and $D$: $0$ against $L$, $3$ against $R$, and give the column
      player the same numbers so that $(U,L)$ and $(D,R)$ are both equilibria.
      Neither $U$ nor $D$ dominates: $U$ wins against $L$ and loses against $R$.
      So each equilibrium is supported entirely by the belief that the opponent
      is playing their half of it. Dominance implies equilibrium; equilibrium
      implies only mutual best response.
    rubric:
      - >
        States the two conditions precisely — dominance quantifies over *all*
        opponent profiles, best response over the one being played — and derives
        one from the other by instantiating the quantifier.
      - >
        Applies the argument to every player simultaneously, so the whole profile,
        not just one player's strategy, satisfies the definition.
      - >
        Exhibits a concrete game with an equilibrium in which no strategy is
        dominant, and says why coordination games are the natural source.
    targets:
      - quant-games.game-theory.nash

  # --- mixed strategies ---------------------------------------------------------

  - id: qgt-mixed-strategy-01
    kind: work
    difficulty: demanding
    statement: >
      The row player has strategies $U, D$ and the column player has $L, M, R$.
      Row payoffs are $U$: $6$ against $L$, $-2$ against $M$, $3$ against $R$;
      $D$: $1$ against $L$, $4$ against $M$, $-1$ against $R$. The row player
      mixes $U$ with probability $3/10$ and the column player mixes $L$ with
      probability $1/5$, $M$ with probability $1/2$ and $R$ with probability
      $3/10$. What is the row player's expected payoff?
    answer: >
      $1.66$. Because payoffs against mixes are expectations, the value is the
      weighted average $\sum_{i,j} p_i a_{ij} q_j$ over all six cells, and the
      cleanest route is to condition on the row first. Given $U$, the row player
      faces $(1/5)(6) + (1/2)(-2) + (3/10)(3) = 1.2 - 1 + 0.9 = 1.1$. Given $D$,
      they face $(1/5)(1) + (1/2)(4) + (3/10)(-1) = 0.2 + 2 - 0.3 = 1.9$. Now
      average over the row mix: $(3/10)(1.1) + (7/10)(1.9) = 0.33 + 1.33 = 1.66$.
      Nothing here claims these probabilities are optimal — indeed $D$ is worth
      more than $U$ against this column mix, so the row player would shift all
      weight to $D$ and collect $1.9$. The point is the mechanics: the payoff is
      linear in each player's own probabilities, which is precisely why the best
      mixed reply is never worth more than the best pure reply.
    expects: "1.66"
    rubric:
      - >
        Weights all six cells by the product $p_i q_j$, or equivalently computes
        the payoff of each pure row against the column mix and then averages.
      - >
        Keeps the negative payoffs signed, so $M$ contributes $-1$ under $U$
        rather than $+1$.
      - >
        Observes that linearity makes the mixed payoff a convex combination of
        the two pure-row values $1.1$ and $1.9$, so it must land between them.
    targets:
      - quant-games.game-theory.mixed-strategy

  - id: qgt-mixed-strategy-02
    kind: work
    difficulty: standard
    statement: >
      Rows $U, D$ face columns $L, R$, with row payoffs $U$: $8$ against $L$, $0$
      against $R$; $D$: $2$ against $L$, $6$ against $R$. The column player will
      play $L$ with probability $3/8$ and $R$ otherwise. What is the largest
      expected payoff the row player can secure against that mix?
    answer: >
      $4.5$. Price each pure row against the announced mix. Playing $U$ pays
      $(3/8)(8) + (5/8)(0) = 3$. Playing $D$ pays
      $(3/8)(2) + (5/8)(6) = 0.75 + 3.75 = 4.5$. So $D$ is the better pure reply
      at $4.5$. No mixture can beat it: a mix over $U$ and $D$ with weight $p$ on
      $U$ earns $3p + 4.5(1-p) = 4.5 - 1.5p$, a convex combination of $3$ and
      $4.5$ that is maximised at $p = 0$. That is the general fact — the best
      mixed reply is worth exactly as much as the best pure reply, so randomising
      never raises your own payoff and is only ever worth doing to keep an
      opponent from reading you. The trap is averaging the row's own payoffs
      unweighted, giving $U$ a spurious $4$ and $D$ a spurious $4$.
    expects: "4.5"
    rubric:
      - >
        Weights each row's payoffs by the opponent's probabilities $3/8$ and
        $5/8$ rather than averaging them evenly.
      - >
        Argues that no mixture improves on the better pure reply, because the
        mixed payoff is a convex combination of $3$ and $4.5$.
    targets:
      - quant-games.game-theory.mixed-strategy

  # --- existence ----------------------------------------------------------------

  - id: qgt-nash-existence-01
    kind: decide
    difficulty: demanding
    statement: >
      Nash's theorem guarantees at least one mixed-strategy equilibrium under a
      specific hypothesis. For which of these games does the theorem *fail to
      apply*?
    answer: >
      The pricing game with a continuum of strategies. Nash's theorem needs
      finitely many players and, for each of them, a *finite* set of pure
      strategies; those are what make the mixed-strategy simplices compact and
      finite-dimensional, so Kakutani's fixed-point theorem can be applied to the
      best-response correspondence. Two firms choosing a price anywhere in an
      interval have a continuum of pure strategies, so the hypothesis is gone and
      existence has to be argued separately — sometimes it holds, sometimes no
      equilibrium exists at all. The other three are all finite games and are all
      covered, whatever their payoffs look like: a game can be zero-sum, wildly
      asymmetric, or have no *pure* equilibrium, and none of that touches the
      theorem, which promises a mixed equilibrium and nothing more. Note what
      the theorem also does not promise: uniqueness, efficiency, or any way of
      finding the equilibrium.
    choices:
      - text: >
          Two firms each choose a price anywhere in the interval $[0, 100]$.
        correct: true
        feedback: >
          Right — a continuum of pure strategies breaks the finiteness the
          fixed-point argument needs.
      - text: >
          Three players, each choosing among $4$ pure strategies, with payoffs
          filled in arbitrarily.
        feedback: >
          Finite players and finite strategy sets are exactly the hypothesis, so
          an equilibrium is guaranteed however the payoffs run.
      - text: >
          A two-player zero-sum game with a $5 \times 5$ payoff matrix.
        feedback: >
          Finite and covered; von Neumann's theorem even sharpens the conclusion
          to a unique value here.
      - text: >
          A finite $2 \times 2$ game with no pure Nash equilibrium.
        feedback: >
          This is the case the theorem exists for — no pure equilibrium, and a
          mixed one guaranteed anyway.
    rubric:
      - >
        Names finiteness of the strategy sets as the operative hypothesis, and
        ties it to the compactness the fixed-point argument uses.
      - >
        Notes that the absence of a *pure* equilibrium is no obstacle, since the
        conclusion is about mixed strategies.
    targets:
      - quant-games.game-theory.nash-existence

  - id: qgt-nash-existence-02
    kind: work
    difficulty: standard
    statement: >
      Rows $U, D$ face columns $L, R$, payoffs $(\text{row}, \text{column})$ —
      row $U$: $(4,1)$ against $L$, $(1,4)$ against $R$; row $D$: $(2,5)$ against
      $L$, $(5,2)$ against $R$. How many pure-strategy Nash equilibria does this
      game have?
    answer: >
      $0$. Check all four cells. At $(U,L)$ the row player is happy ($4 > 2$) but
      the column player moves to $R$ for $4$ against $1$. At $(U,R)$ the row
      player moves to $D$ for $5$ against $1$. At $(D,R)$ the row player is happy
      ($5 > 1$) but the column player moves to $L$ for $5$ against $2$. At
      $(D,L)$ the row player moves to $U$ for $4$ against $2$. Every cell has a
      profitable unilateral deviation, so there is no pure equilibrium — the
      best-response cycle $(U,L) \to (U,R) \to (D,R) \to (D,L) \to (U,L)$ never
      closes. This is not a failure of the theory. Nash's theorem still
      guarantees an equilibrium *in mixed strategies*, and here indifference
      pins it down; the count of pure equilibria being $0$ is exactly the
      situation the mixed extension was introduced to cover.
    expects: "0"
    rubric:
      - >
        Checks both players' deviations at every one of the four profiles rather
        than concluding from the shape of the table.
      - >
        States that $0$ pure equilibria does not contradict Nash's theorem, whose
        conclusion is about mixed strategies.
    targets:
      - quant-games.game-theory.nash-existence
    exercises:
      - quant-games.game-theory.nash

  # --- the indifference principle (prominence 2) --------------------------------

  - id: qgt-mixed-indifference-01
    kind: work
    difficulty: demanding
    statement: >
      Rows $U, D$ face columns $L, R$, payoffs $(\text{row}, \text{column})$ —
      row $U$: $(6,2)$ against $L$, $(1,5)$ against $R$; row $D$: $(2,8)$ against
      $L$, $(7,3)$ against $R$. In the mixed equilibrium, with what probability
      does the *row* player play $U$? Give an exact fraction.
    answer: >
      $5/8$. First confirm mixing is forced: no cell survives a deviation check —
      at $(U,L)$ the column player jumps to $R$ ($5 > 2$), at $(U,R)$ the row
      player jumps to $D$ ($7 > 1$), at $(D,R)$ the column player jumps to $L$
      ($8 > 3$), and at $(D,L)$ the row player jumps to $U$ ($6 > 2$), so there
      are no pure equilibria. Now the principle: the row player's probability $p$
      on $U$ is fixed by making the *column* player indifferent, so the equation
      is written from the column player's payoffs. Column's expected payoff from
      $L$ is $2p + 8(1-p) = 8 - 6p$; from $R$ it is $5p + 3(1-p) = 3 + 2p$.
      Setting $8 - 6p = 3 + 2p$ gives $5 = 8p$, so $p = 5/8$, which lies in
      $[0,1]$ as a probability must. The trap is to write the indifference
      equation from the row player's own payoffs — those give the *column*
      player's probability, $q = 3/5$ on $L$, not this one.
    expects: "5/8"
    rubric:
      - >
        Verifies that no pure equilibrium exists before reaching for mixing, so
        the support guess of both strategies is justified.
      - >
        Writes the indifference equation using the *column* player's payoffs,
        $8 - 6p = 3 + 2p$, because it is the column player who must be left
        indifferent by the row player's mix.
      - >
        Checks that the solution lies in $[0,1]$, the diagnostic that catches a
        wrong support guess.
    targets:
      - quant-games.game-theory.mixed-indifference
    exercises:
      - quant-games.game-theory.mixed-strategy

  - id: qgt-mixed-indifference-02
    kind: work
    difficulty: standard
    statement: >
      Rows $U, D$ face columns $L, R$, payoffs $(\text{row}, \text{column})$ —
      row $U$: $(4,5)$ against $L$, $(10,2)$ against $R$; row $D$: $(9,1)$
      against $L$, $(3,8)$ against $R$. In the mixed equilibrium, what is the row
      player's expected payoff?
    answer: >
      $6.5$. The row player's payoff is determined by the *column* player's mix,
      so solve for $q$, the probability the column player puts on $L$, using the
      row player's payoffs. Row's expected payoff from $U$ is
      $4q + 10(1-q) = 10 - 6q$; from $D$ it is $9q + 3(1-q) = 3 + 6q$. Setting
      $10 - 6q = 3 + 6q$ gives $12q = 7$, so $q = 7/12$. Substituting back,
      $10 - 6(7/12) = 10 - 3.5 = 6.5$, and the other branch confirms it:
      $3 + 6(7/12) = 3 + 3.5 = 6.5$. That agreement is the whole content of
      indifference — in equilibrium every pure strategy in your support is worth
      the same, so either expression gives the value. For completeness the row
      player's own mix is $p = 7/10$ on $U$, found from the column player's
      payoffs, but it is not needed to price the row player's payoff.
    expects: "6.5"
    rubric:
      - >
        Solves for the *opponent's* probability $q = 7/12$ from the row player's
        own payoffs, then substitutes to get the value.
      - >
        Checks the value on both branches, $10 - 6q$ and $3 + 6q$, as the
        arithmetic self-check indifference provides.
    targets:
      - quant-games.game-theory.mixed-indifference

  - id: qgt-mixed-indifference-03
    kind: justify
    difficulty: standard
    statement: >
      Explain why, in a mixed equilibrium, a player's own randomisation is
      computed from their *opponent's* payoff numbers rather than their own — and
      say what a solution outside $[0,1]$ is telling you.
    answer: >
      The reason is the linearity of expected payoff in each player's own
      probabilities. If a player puts positive weight on two pure strategies,
      their payoff is a convex combination of what those strategies earn against
      the opponent's mix. Whenever one earns strictly more, shifting all weight
      onto it strictly increases the payoff, so a genuine mixture can be optimal
      only if the strategies in its support earn *equal* expected payoffs. That
      is a condition on the mixing player, but it is written in terms of the
      opponent's mix. Turn it around: for *your* opponent to be willing to
      randomise, *you* must choose probabilities that equalise the payoffs
      *they* receive from the strategies in their support — and those payoffs are
      entries of their matrix, not yours. Hence the inversion. It also explains
      the equilibrium's strange feel: your mix is not chosen to serve your own
      payoff, which is the same against every opponent mix in equilibrium, but to
      remove the opponent's incentive to move.
      A probability outside $[0,1]$ is not an arithmetic slip but a rejected
      hypothesis. The equations were written assuming a support — usually all
      strategies — and the algebra is only valid on that assumption. A negative
      or above-one solution says no equilibrium has that support, which in a
      $2 \times 2$ means some strategy is never played, so drop it and re-solve;
      typically the game has a pure equilibrium after all, often reachable by
      deleting a dominated strategy.
    rubric:
      - >
        Derives the indifference condition from linearity — a strictly better
        strategy in the support could absorb all the weight — rather than
        asserting it.
      - >
        States the inversion explicitly: your probabilities are set to equalise
        the opponent's payoffs, so they come from the opponent's matrix.
      - >
        Reads a solution outside $[0,1]$ as a falsified support guess, and gives
        the repair — drop the excluded strategy and re-solve.
    targets:
      - quant-games.game-theory.mixed-indifference

  # --- matching pennies and rock-paper-scissors --------------------------------

  - id: qgt-matching-pennies-01
    kind: work
    difficulty: demanding
    statement: >
      An asymmetric coin game: the row player's payoffs are $+5$ when both show
      $H$, $-3$ when row shows $H$ and column shows $T$, $-2$ when row shows $T$
      and column shows $H$, and $+4$ when both show $T$; the column player
      receives the negative of each. In equilibrium, with what probability does
      the row player show $H$? Give an exact fraction.
    answer: >
      $3/7$. The game is zero-sum, so the column player's payoffs are the
      negatives of the row player's, and the column player is indifferent exactly
      when the *row* player's payoff is the same against $H$ and against $T$.
      Writing $p$ for the row player's probability on $H$: against column $H$ the
      row player earns $5p - 2(1-p) = 7p - 2$; against column $T$ they earn
      $-3p + 4(1-p) = 4 - 7p$. Setting $7p - 2 = 4 - 7p$ gives $14p = 6$, so
      $p = 3/7$. Substituting, the value of the game is $7(3/7) - 2 = 1$ to the
      row player. The mirrored computation gives $q = 1/2$ for the column
      player's probability on $H$, and it confirms the same value:
      $5(1/2) - 3(1/2) = 1$. The trap is the reflex answer $1/2$ — that is the
      symmetric game's mix, and it is the *column* player's mix here, not the
      row player's. Asymmetric payoffs move the probabilities off a half and the
      value off zero.
    expects: "3/7"
    rubric:
      - >
        Writes the indifference equation for the opponent, so the row player's
        $p$ solves $7p - 2 = 4 - 7p$.
      - >
        Reports $3/7$ rather than defaulting to $1/2$, and notes that $1/2$ is
        the column player's mix in this game.
      - >
        Confirms the value $1$ on both branches, so the arithmetic is checked
        against itself.
    targets:
      - quant-games.game-theory.matching-pennies
    exercises:
      - quant-games.game-theory.mixed-indifference

  - id: qgt-matching-pennies-02
    kind: work
    difficulty: standard
    statement: >
      You are playing rock–paper–scissors for one dollar a round: a win pays $+1$,
      a loss $-1$, a tie $0$. Your opponent's throws are known to be Rock with
      probability $1/2$, Paper with probability $3/10$ and Scissors with
      probability $1/5$. What is your expected payoff per round, in dollars, from
      your best reply?
    answer: >
      $0.3$. Price each of your three throws against the opponent's distribution.
      Rock beats Scissors, ties Rock and loses to Paper:
      $0(1/2) - 1(3/10) + 1(1/5) = -0.1$. Paper beats Rock, ties Paper and loses
      to Scissors: $1(1/2) + 0(3/10) - 1(1/5) = 0.3$. Scissors beats Paper, ties
      Scissors and loses to Rock:
      $-1(1/2) + 1(3/10) + 0(1/5) = -0.2$. The best reply is Paper, worth $0.3$
      dollars per round — and since a mixed reply is a convex combination of these
      three numbers, no randomisation beats it. Compare the equilibrium mix,
      uniform $1/3$ on each throw, which earns
      $(1/3)(-0.1) + (1/3)(0.3) + (1/3)(-0.2) = 0$ against this same opponent.
      That is the point worth carrying away: an equilibrium mix is
      *unexploitable*, not *exploiting*. It guarantees $0$ against anybody, and
      collects nothing extra from a player who is visibly off-balance. The
      uniform mix is the right choice only when you have no read; here you have
      one, and playing pure Paper is what the read is worth.
    expects: "0.3"
    rubric:
      - >
        Prices all three pure throws against the stated distribution, keeping the
        sign convention for wins and losses straight.
      - >
        Identifies Paper at $0.3$ dollars and argues no mixture improves on the
        best pure reply.
      - >
        Contrasts the equilibrium uniform mix, worth $0$ here, and states that
        equilibrium play is unexploitable rather than exploiting.
    targets:
      - quant-games.game-theory.matching-pennies
      - quant-probability.expectation.symmetry-expectation
    connects:
      - quant-games.game-theory.matching-pennies ~ quant-probability.expectation.symmetry-expectation

  # --- an asymmetric coordination game ------------------------------------------

  - id: qgt-battle-of-sexes-01
    kind: work
    difficulty: demanding
    statement: >
      Dana and Eli must independently pick an evening plan. Payoffs
      $(\text{Dana}, \text{Eli})$ — row Concert: $(5,2)$ against Concert, $(0,0)$
      against Talk; row Talk: $(0,0)$ against Concert, $(2,4)$ against Talk. In
      the mixed equilibrium, what is the probability they fail to coordinate?
      Give an exact fraction.
    answer: >
      $4/7$. Solve each player's mix from the *other* player's payoffs. Let $p$
      be Dana's probability of Concert. Eli earns $2p$ from Concert and
      $4(1-p)$ from Talk; setting $2p = 4 - 4p$ gives $6p = 4$, so $p = 2/3$. Let
      $q$ be Eli's probability of Concert. Dana earns $5q$ from Concert and
      $2(1-q)$ from Talk; setting $5q = 2 - 2q$ gives $7q = 2$, so $q = 2/7$.
      Miscoordination happens when the two pick differently:
      $p(1-q) + (1-p)q = (2/3)(5/7) + (1/3)(2/7) = 10/21 + 2/21 = 12/21 = 4/7$.
      More than half the time they end up at a $(0,0)$ cell. That is what makes
      the mixed equilibrium so unattractive: Dana's expected payoff is
      $5q = 10/7 \approx 1.43$ and Eli's is $2p = 4/3 \approx 1.33$, both below
      the $2$ that even their *less* preferred pure equilibrium would pay them.
      The trap is assuming each player leans toward their own favourite — Dana
      does play Concert most of the time, but Eli plays Concert only $2/7$ of the
      time, because his mix is dictated by Dana's numbers, not his.
    expects: "4/7"
    rubric:
      - >
        Computes each probability from the opponent's payoff column, giving
        $p = 2/3$ and $q = 2/7$ rather than a common value.
      - >
        Adds both mismatch cells, $p(1-q)$ and $(1-p)q$, rather than one of them.
      - >
        Notes that both expected payoffs fall below either pure equilibrium, so
        mixing here is a coordination failure, not a compromise.
    targets:
      - quant-games.game-theory.battle-of-sexes
    exercises:
      - quant-games.game-theory.mixed-indifference

  - id: qgt-battle-of-sexes-02
    kind: work
    difficulty: standard
    statement: >
      Two colleagues independently pick a meeting room. Payoffs
      $(\text{row}, \text{column})$ — row Rooftop: $(4,1)$ against Rooftop,
      $(0,0)$ against Basement; row Basement: $(0,0)$ against Rooftop, $(1,3)$
      against Basement. Counting pure and mixed equilibria together, how many
      Nash equilibria does this game have?
    answer: >
      $3$. Start with the pure profiles. At (Rooftop, Rooftop) the row player
      moving to Basement drops from $4$ to $0$ and the column player moving to
      Basement drops from $1$ to $0$, so it is an equilibrium; the identical check
      makes (Basement, Basement) one too, paying $(1,3)$. The two mismatched
      cells pay $(0,0)$, and either player gains by switching, so they are not
      equilibria — two pure equilibria so far. Now the mixed one, which is easy
      to forget. Let $p$ be the row player's probability of Rooftop: the column
      player is indifferent when $p \cdot 1 = (1-p) \cdot 3$, so $p = 3/4$. Let
      $q$ be the column player's: the row player is indifferent when
      $4q = 1 - q$, so $q = 1/5$. Both lie strictly inside $[0,1]$, so a genuine
      mixed equilibrium exists, bringing the total to $3$. The general pattern:
      a $2 \times 2$ coordination game with two pure equilibria almost always
      hides a third, mixed one between them.
    expects: "3"
    rubric:
      - >
        Checks all four pure profiles for unilateral deviations and finds exactly
        two equilibria.
      - >
        Solves for the mixed equilibrium as well, verifying $p = 3/4$ and
        $q = 1/5$ both lie strictly inside $[0,1]$, and counts it.
    targets:
      - quant-games.game-theory.battle-of-sexes

  # --- zero-sum games and security levels ---------------------------------------

  - id: qgt-zero-sum-01
    kind: work
    difficulty: demanding
    statement: >
      A zero-sum game is given by the row player's payoff matrix, rows $R_1, R_2,
      R_3$ against columns $C_1, C_2, C_3$ — $R_1$: $6, 1, 8$; $R_2$: $3, 7, 2$;
      $R_3$: $5, 4, 9$. The column player receives the negative of each entry.
      How large is the gap between the row player's maximin security level and
      the column player's minimax security level?
    answer: >
      $2$. The row player commits to a row first and is then held to the worst
      column, so their guarantee is $\max_i \min_j a_{ij}$. Row minima are
      $\min(6,1,8) = 1$, $\min(3,7,2) = 2$ and $\min(5,4,9) = 4$, so the maximin
      is $4$, secured by $R_3$. The column player commits to a column and is then
      held to the best row, so their guarantee is $\min_j \max_i a_{ij}$. Column
      maxima are $\max(6,3,5) = 6$, $\max(1,7,4) = 7$ and $\max(8,2,9) = 9$, so
      the minimax is $6$, secured by $C_1$. The gap is $6 - 4 = 2$. Two checks
      worth making. Maximin never exceeds minimax — committing first cannot help
      — and $4 \le 6$ confirms no arithmetic slipped. And a positive gap means no
      cell is simultaneously its row's minimum and its column's maximum, so there
      is no saddle point and no pure equilibrium; the value of this game lives
      strictly between $4$ and $6$ and is only reached by mixing. The trap is
      taking column *minima* for the column player: the column player suffers the
      largest entry in their chosen column, not the smallest.
    expects: "2"
    rubric:
      - >
        Takes row minima then their maximum for the row player, and column maxima
        then their minimum for the column player — not minima on both sides.
      - >
        Confirms maximin $\le$ minimax as a sanity check, and reads the positive
        gap as the absence of a saddle point.
    targets:
      - quant-games.game-theory.zero-sum

  - id: qgt-zero-sum-02
    kind: work
    difficulty: standard
    statement: >
      A zero-sum game has row-payoff rows $R_1$: $9, 2, 7$ and $R_2$: $4, 6, 5$
      against columns $C_1, C_2, C_3$. What payoff can the row player guarantee
      themselves, whatever the column player does?
    answer: >
      $4$. A guarantee is a worst case, so evaluate each row at its worst column
      and then pick the best of those. Row $R_1$ has minimum $\min(9,2,7) = 2$;
      row $R_2$ has minimum $\min(4,6,5) = 4$. The row player therefore commits
      to $R_2$ and is guaranteed at least $4$ no matter which column appears —
      that is the maximin, $\max_i \min_j a_{ij} = 4$. The trap is choosing $R_1$
      because it contains the single largest entry, $9$: that entry is available
      only if the column player cooperates by playing $C_1$, and in a zero-sum
      game the column player is doing the exact opposite of cooperating, since
      every dollar you gain is a dollar they lose. For contrast, the column
      player's own guarantee is $\min_j \max_i a_{ij} = \min(9,6,7) = 6$, so the
      value of this game sits somewhere in $[4, 6]$.
    expects: "4"
    rubric:
      - >
        Computes the worst case within each row first, then maximises across
        rows, rather than reading off the largest entry of the matrix.
      - >
        Explains that the largest entry $9$ is unreachable against a minimising
        opponent.
    targets:
      - quant-games.game-theory.zero-sum

  # --- the minimax theorem (prominence 2) ---------------------------------------

  - id: qgt-minimax-01
    kind: work
    difficulty: demanding
    statement: >
      A zero-sum game has row-payoff rows $R_1$: $4$ against $C_1$, $-1$ against
      $C_2$; and $R_2$: $0$ against $C_1$, $3$ against $C_2$. What is the value of
      the game to the row player?
    answer: >
      $1.5$. Check for a saddle first, because if one exists there is nothing to
      solve. Row minima are $-1$ and $0$, so the maximin is $0$; column maxima are
      $4$ and $3$, so the minimax is $3$. They disagree, so there is no saddle and
      the value is found by mixing. Let $p$ be the row player's probability on
      $R_1$. Against a pure $C_1$ the row player earns $4p + 0(1-p) = 4p$;
      against a pure $C_2$ they earn $-p + 3(1-p) = 3 - 4p$. The optimal $p$
      equalises these — any imbalance is something the column player would
      exploit by playing the cheaper column — so $4p = 3 - 4p$, giving $p = 3/8$
      and a value of $4(3/8) = 1.5$. The column player's side confirms it: with
      $q$ on $C_1$, the row player earns $4q - (1-q) = 5q - 1$ from $R_1$ and
      $3(1-q)$ from $R_2$, and $5q - 1 = 3 - 3q$ gives $q = 1/2$ with value
      $5(1/2) - 1 = 1.5$. That the two computations agree is the minimax theorem
      in miniature, and the value $1.5$ lies strictly between the maximin $0$ and
      the minimax $3$, exactly as closing a security gap should.
    expects: "1.5"
    rubric:
      - >
        Looks for a saddle point first and finds none, since maximin $0$ and
        minimax $3$ disagree.
      - >
        Equalises the row player's payoff against each pure column, giving
        $p = 3/8$, and states why equalising is optimal against a minimiser.
      - >
        Verifies the same value $1.5$ from the column player's side, and checks
        it lies between the two security levels.
    targets:
      - quant-games.game-theory.minimax
    exercises:
      - quant-games.game-theory.zero-sum

  - id: qgt-minimax-02
    kind: work
    difficulty: standard
    statement: >
      A zero-sum game has row-payoff rows $R_1$: $2$ against $C_1$, $8$ against
      $C_2$; and $R_2$: $6$ against $C_1$, $3$ against $C_2$. With what
      probability does the *column* player play $C_1$ in their optimal strategy?
      Give an exact fraction.
    answer: >
      $5/9$. The column player is minimising the row player's payoff, and their
      optimal mix is the one that makes the row player indifferent between the
      rows — otherwise the row player would move all weight to the better row and
      collect more. Writing $q$ for the probability on $C_1$: the row player
      earns $2q + 8(1-q) = 8 - 6q$ from $R_1$, and $6q + 3(1-q) = 3 + 3q$ from
      $R_2$. Setting $8 - 6q = 3 + 3q$ gives $9q = 5$, so $q = 5/9$, and the
      resulting value is $3 + 3(5/9) = 14/3 \approx 4.67$. The row player's own
      optimal mix, found the mirrored way from $6 - 4p = 3 + 5p$, is $p = 1/3$ on
      $R_1$, and it yields the same $14/3$ — the two sides of the dual pair. The
      trap is to compute $q$ from the *column* player's own numbers, which in a
      zero-sum game are just the negatives of these and simply reproduce the row
      player's equation with the signs flipped, or to skip straight to $1/2$
      because there are two columns.
    expects: "5/9"
    rubric:
      - >
        Sets the column player's mix so the row player is indifferent between
        $R_1$ and $R_2$, solving $8 - 6q = 3 + 3q$.
      - >
        Reports the value $14/3$ and notes that the row player's optimal $p = 1/3$
        delivers the same number.
    targets:
      - quant-games.game-theory.minimax
    exercises:
      - quant-games.game-theory.mixed-strategy

  - id: qgt-minimax-03
    kind: justify
    difficulty: standard
    statement: >
      Explain why the maximin can never exceed the minimax in a two-player
      zero-sum game — an argument that needs no theorem — and then say precisely
      what von Neumann's theorem adds beyond that inequality.
    answer: >
      The inequality first. Let the row player's optimal maximin mix be $p^{*}$
      and the column player's optimal minimax mix be $q^{*}$, and let $V(p,q)$ be
      the row player's expected payoff. By definition of $p^{*}$, the quantity
      $\min_q V(p^{*}, q)$ is the maximin; by definition of $q^{*}$,
      $\max_p V(p, q^{*})$ is the minimax. Now evaluate both at the single pair
      $(p^{*}, q^{*})$: the maximin is a minimum over $q$, hence at most
      $V(p^{*}, q^{*})$, while the minimax is a maximum over $p$, hence at least
      $V(p^{*}, q^{*})$. Chaining them, maximin $\le V(p^{*},q^{*}) \le$ minimax.
      The intuition is that committing first cannot help: the second mover knows
      everything the first knew and one thing more.
      What the theorem adds is that the inequality is an *equality* once mixing
      is allowed — the gap, which is genuinely positive for many matrices in pure
      strategies, closes to zero. That upgrade carries real consequences. There
      is a single number $v$, the value: the row player can guarantee at least
      $v$ and the column player can hold them to at most $v$, so the game has a
      determinate price. Optimal strategies exist on both sides, the Nash
      equilibria are exactly the pairs of optimal strategies, every one of them
      pays $v$, and they are interchangeable — pairing any optimal $p$ with any
      optimal $q$ still gives an equilibrium. That last property is what a
      general-sum game lacks, and it is why zero-sum games have no
      equilibrium-selection problem at all.
    rubric:
      - >
        Proves the inequality by evaluating both security levels at the same
        strategy pair, so a minimum bounds above and a maximum bounds below.
      - >
        Identifies the theorem's contribution as equality under mixing, not the
        existence of the two security levels.
      - >
        Draws out at least one consequence — a determinate value, or the
        interchangeability that removes equilibrium selection.
    targets:
      - quant-games.game-theory.minimax

  # --- extensive form ------------------------------------------------------------

  - id: qgt-extensive-form-01
    kind: work
    difficulty: demanding
    statement: >
      Player $1$ moves at the root, choosing $A$, $B$ or $C$. Choice $C$ ends the
      game. Choice $B$ leads to a node where player $2$ chooses among three
      actions, each ending the game. Choice $A$ leads to a node where player $2$
      chooses between two actions: one ends the game, the other returns play to
      player $1$ for a final choice between two actions, each ending the game.
      How many strategy profiles does the induced normal form have?
    answer: >
      $36$. Count each player's complete contingent plans separately. Player $1$
      moves at two decision nodes — the root, with $3$ actions, and the final
      node reached only via $A$ and then player $2$'s second action, with $2$
      actions. A strategy must name an action at *both*, even at the final node
      when the root choice was $C$ and that node can never be reached, so player
      $1$ has $3 \times 2 = 6$ strategies. Player $2$ also moves at two decision
      nodes — after $A$, with $2$ actions, and after $B$, with $3$ — and a
      strategy names an action at both even though at most one is ever reached,
      giving $2 \times 3 = 6$ strategies. The normal form is therefore
      $6 \times 6 = 36$ profiles. The trap is counting *outcomes* instead: the
      tree has only $7$ leaves — one under $C$, three under $B$, and three under
      $A$ — so $36$ profiles map onto $7$ possible plays, many-to-one. Strategy
      counts and outcome counts are different objects, and it is the strategy
      count that decides how big the matrix is.
    expects: "36"
    rubric:
      - >
        Multiplies the action counts across each player's decision nodes, not
        across the tree's leaves.
      - >
        Includes nodes that a player's own earlier choice rules out, since a
        strategy is a plan for every node of theirs.
      - >
        Distinguishes the $36$ profiles from the $7$ leaves.
    targets:
      - quant-games.game-theory.extensive-form
    exercises:
      - quant-games.game-theory.normal-form

  - id: qgt-extensive-form-02
    kind: decide
    difficulty: standard
    statement: >
      In a finite extensive-form game, which of the following is the correct
      description of a *strategy* for one player?
    answer: >
      A choice of action at every one of that player's decision nodes, including
      nodes that their own earlier choices make unreachable. This is the point
      that trips people up: a strategy is a full contingent plan, not a path
      through the tree. A plan that says only "play $A$ at the root" is
      incomplete, because the normal form needs a payoff for it against every
      plan of the opponent, and evaluating some of those requires knowing what
      this player would do further down. Specifying actions at unreachable nodes
      looks wasteful, and it is precisely what makes subgame perfection possible:
      the whole content of "would you really carry out that threat?" is a
      question about behaviour at a node the equilibrium path never visits. The
      cost is that strategy counts grow multiplicatively in the number of
      decision nodes, which is why a tree with a handful of leaves can induce a
      normal form with dozens of profiles. Under imperfect information the same
      rule applies with nodes replaced by information sets, since actions cannot
      differ across nodes the player cannot tell apart.
    choices:
      - text: >
          An action at every one of the player's decision nodes, including nodes
          their own earlier choices rule out.
        correct: true
        feedback: >
          Right — and specifying the off-path actions is exactly what lets
          subgame perfection test a threat.
      - text: >
          The sequence of actions the player actually takes in the play that
          occurs.
        feedback: >
          That is a path, not a strategy; it says nothing about what would have
          happened elsewhere in the tree.
      - text: >
          An action at every decision node the player can still reach given their
          own earlier choices.
        feedback: >
          The standard definition covers unreachable nodes too, which is what
          makes credibility checkable.
      - text: >
          A probability distribution over the leaves of the tree.
        feedback: >
          Leaves are outcomes, and no single player controls which one is
          reached.
    rubric:
      - >
        Defines a strategy as a complete contingent plan over the player's
        decision nodes, not as a realised path.
      - >
        Explains why off-path actions must be specified — the normal form and
        subgame perfection both need them.
    targets:
      - quant-games.game-theory.extensive-form

  # --- backward induction ---------------------------------------------------------

  - id: qgt-backward-induction-games-01
    kind: work
    difficulty: demanding
    statement: >
      A pot game alternates. At node $1$ player $1$ may Grab, ending the game at
      payoffs $(5,1)$, or Pass. At node $2$ player $2$ may Grab, ending at
      $(2,8)$, or Pass. At node $3$ player $1$ may Grab, ending at $(9,4)$, or
      Pass. At node $4$ player $2$ may Grab, ending at $(6,11)$, or Pass, ending
      at $(10,10)$. Payoffs are written $(\text{player } 1, \text{player } 2)$.
      What does player $2$ receive under backward induction?
    answer: >
      $1$. Fold from the last decision. At node $4$ player $2$ compares Grab's
      $11$ against Pass's $10$ and grabs, so node $4$ is worth $(6,11)$. At node
      $3$ player $1$ compares Grab's $9$ against the continuation value of $6$
      and grabs, so node $3$ is worth $(9,4)$. At node $2$ player $2$ compares
      Grab's $8$ against the continuation value of $4$ and grabs, so node $2$ is
      worth $(2,8)$. At node $1$ player $1$ compares Grab's $5$ against the
      continuation value of $2$ and grabs. The game ends immediately at $(5,1)$,
      so player $2$ collects $1$ — the worst payoff either player receives
      anywhere in the tree except player $2$'s own $1$. The trap is arguing that
      both players would rather reach $(10,10)$ and so will cooperate: they
      would, but no player can commit to passing, and the unravelling is driven
      entirely by the last mover's preference. Each player grabs only because
      they anticipate being grabbed on next, one layer at a time.
    expects: "1"
    rubric:
      - >
        Starts at node $4$ and replaces each node by the payoff vector its mover
        prefers, rather than reasoning forward from the root.
      - >
        Compares each mover's Grab payoff against the *continuation value* of the
        subtree, not against the payoffs at the final leaf.
      - >
        Reports player $2$'s payoff of $1$ and explains why the mutually better
        $(10,10)$ is unreachable without commitment.
    targets:
      - quant-games.game-theory.backward-induction-games
      - quant-processes.stopping.backward-induction
    connects:
      - quant-games.game-theory.backward-induction-games ~ quant-processes.stopping.backward-induction

  - id: qgt-backward-induction-games-02
    kind: work
    difficulty: standard
    statement: >
      A pot of $100$ tokens is split by alternating offers. Player $1$ proposes a
      whole-token split; if player $2$ rejects, the pot shrinks to $60$ tokens
      and player $2$ proposes; if player $1$ then rejects, both receive nothing.
      A responder accepts any offer of at least one token and rejects an offer of
      zero. How many tokens does player $1$ keep in the subgame-perfect
      equilibrium?
    answer: >
      $40$. Solve the last round first. If the game reaches round two, player $2$
      is proposing over $60$ tokens against a responder who accepts one token, so
      player $2$ offers exactly $1$ and keeps $59$. That fixes the continuation
      values: rejecting in round one is worth $59$ to player $2$ and $1$ to
      player $1$. Back to round one. Player $2$ accepts any round-one offer worth
      strictly more than $59$, so the cheapest acceptable offer is $60$ tokens,
      and player $1$ keeps $100 - 60 = 40$. Check that player $1$ prefers this to
      being rejected: $40$ against a continuation of $1$, so yes. Notice what
      does the work — the *shrinkage*. The pot falling from $100$ to $60$ is why
      player $2$'s threat to reject is worth only $59$, and why player $1$ keeps
      anything at all; with no shrinkage the second-round proposer would hold out
      for the whole pot and the first mover's advantage would vanish.
    expects: "40"
    rubric:
      - >
        Solves the second round first and turns it into a continuation value for
        the first, rather than reasoning forward.
      - >
        Uses the continuation value $59$ as the responder's reservation, so the
        round-one offer is $60$ and player $1$ keeps $40$.
    targets:
      - quant-games.game-theory.backward-induction-games

  # --- credible threats -----------------------------------------------------------

  - id: qgt-credible-threats-01
    kind: work
    difficulty: demanding
    statement: >
      A challenger chooses Out or Enter. Out ends the game at payoffs
      $(\text{challenger}, \text{incumbent}) = (0, 12)$. After Enter, the
      incumbent chooses a Price war, paying $(-3, 4)$, or to Share, paying
      $(4, 7)$. The profile in which the challenger stays Out and the incumbent
      plans a price war is a Nash equilibrium of the normal form. By how much
      does the incumbent's payoff fall when the non-credible threat is stripped
      out by subgame perfection?
    answer: >
      $5$. Take the two predictions in turn. Under (Out, price-war-if-Enter) the
      challenger is best-responding — entering into a war pays $-3$ against Out's
      $0$ — and the incumbent's plan is never tested, so the profile satisfies the
      Nash condition and the incumbent collects $12$. Now impose subgame
      perfection, which requires the plan to be optimal in *every* subgame,
      including the one entry would create. In that subgame the incumbent
      compares a war's $4$ against sharing's $7$ and strictly prefers to share.
      The threat is therefore not credible, and the challenger, anticipating a
      share, enters for $4$ rather than staying out for $0$. The subgame-perfect
      outcome is (Enter, Share), paying $(4, 7)$, so the incumbent's payoff falls
      from $12$ to $7$, a drop of $5$. The whole of that $5$ is the value of a
      threat the incumbent cannot actually make stick — recovering it requires
      changing the payoffs in advance, by contract, by capacity built before
      demand arrives, or by a reputation worth more than the $3$ that fighting
      costs.
    expects: "5"
    rubric:
      - >
        Verifies that (Out, price war) really does satisfy the Nash condition,
        including why the untested off-path plan costs the incumbent nothing.
      - >
        Applies optimality inside the entry subgame, where sharing's $7$ beats a
        war's $4$, to eliminate the threat.
      - >
        Compares the incumbent's $12$ under the Nash profile with $7$ under the
        subgame-perfect one, reporting the difference $5$.
    targets:
      - quant-games.game-theory.credible-threats
    exercises:
      - quant-games.game-theory.backward-induction-games

  - id: qgt-credible-threats-02
    kind: decide
    difficulty: standard
    statement: >
      A startup chooses Hold or Launch. Hold ends the game at payoffs
      $(\text{startup}, \text{incumbent}) = (1, 9)$. After Launch, the incumbent
      chooses to Sue, paying $(-4, 3)$, or Ignore, paying $(6, 5)$. Which
      statement about this game is correct?
    answer: >
      (Hold, sue-if-Launch) is a Nash equilibrium but is not subgame perfect. It
      passes the Nash test: facing the announced threat, the startup compares
      Hold's $1$ against Launch's $-4$ and holds, and since Launch never happens
      the incumbent's plan is never priced, so any plan is a best response.
      Subgame perfection asks more — the plan must be optimal in the entry
      subgame too, and there suing pays $3$ against ignoring's $5$, so the
      incumbent would not sue. Folding back, the startup launches for $6$ rather
      than holding for $1$, and the unique subgame-perfect outcome is (Launch,
      Ignore) at $(6,5)$. The reason to insist on the refinement is that the Nash
      prediction here rests on a belief the startup should not hold: the
      incumbent's own numbers say suing is self-harming. A threat becomes
      credible only when the payoffs make carrying it out preferable, which
      requires a prior commitment — the threat itself is not one.
    choices:
      - text: >
          (Hold, sue-if-Launch) is a Nash equilibrium but is not subgame perfect.
        correct: true
        feedback: >
          Right — it survives the Nash test only because the threat is never
          priced, and fails once the entry subgame is checked.
      - text: >
          (Hold, sue-if-Launch) is not a Nash equilibrium, because suing is worse
          for the incumbent than ignoring.
        feedback: >
          The comparison is right but irrelevant to the Nash test, which never
          reaches that subgame — the profile is Nash.
      - text: >
          (Launch, Ignore) is subgame perfect but not a Nash equilibrium.
        feedback: >
          Every subgame-perfect equilibrium is a Nash equilibrium; the refinement
          only removes profiles, never adds them.
      - text: >
          The game has no subgame-perfect equilibrium, since the incumbent is
          indifferent after Launch.
        feedback: >
          The incumbent is not indifferent — $5$ against $3$ — and backward
          induction always delivers one here.
    rubric:
      - >
        Explains why the profile passes the Nash test, namely that an off-path
        plan is costless in that check.
      - >
        Applies optimality inside the launch subgame and folds back, naming
        (Launch, Ignore) as the subgame-perfect outcome.
    targets:
      - quant-games.game-theory.credible-threats

  # --- moving first versus moving second -------------------------------------------

  - id: qgt-first-mover-01
    kind: work
    difficulty: demanding
    statement: >
      A zero-sum game has row-payoff rows $R_1$: $3$ against $C_1$, $-2$ against
      $C_2$; and $R_2$: $-4$ against $C_1$, $5$ against $C_2$. Played
      simultaneously, the game has a mixed equilibrium. Suppose instead the row
      player must choose a row and reveal it before the column player moves. How
      much does the row player's expected payoff fall?
    answer: >
      $2.5$. Price both regimes. Simultaneously, no cell is stable, so mix: with
      $p$ on $R_1$ the row player earns $3p - 4(1-p) = 7p - 4$ against $C_1$ and
      $-2p + 5(1-p) = 5 - 7p$ against $C_2$, and equalising gives $14p = 9$, so
      $p = 9/14$ and the value is $7(9/14) - 4 = 4.5 - 4 = 0.5$. Under forced
      revelation the column player observes the row and picks the minimising
      column, so $R_1$ yields $\min(3, -2) = -2$ and $R_2$ yields
      $\min(-4, 5) = -4$; the row player, anticipating this, reveals $R_1$ and
      collects $-2$. The fall is $0.5 - (-2) = 2.5$. Nothing about the tree
      changed — the same matrix, the same payoffs — only who knows what when, and
      that alone is worth $2.5$ per play. This is the general fact about games
      whose only equilibria are mixed: concealment is the entire asset, so
      revealing your action first can only hurt, and the first-mover advantage
      people expect from sequential play is a commitment story, not a timing one.
    expects: "2.5"
    rubric:
      - >
        Solves the simultaneous game by indifference to get the value $0.5$,
        rather than reading a security level off the matrix.
      - >
        Evaluates forced revelation as the row minimum of the revealed row,
        because the column player best-responds after observing.
      - >
        Reports the difference $2.5$ and attributes it to lost concealment rather
        than to any change in payoffs.
    targets:
      - quant-games.game-theory.first-mover
    exercises:
      - quant-games.game-theory.matching-pennies
      - quant-games.game-theory.mixed-indifference

  - id: qgt-first-mover-02
    kind: decide
    difficulty: standard
    statement: >
      A desk can choose whether to act before or after a rival in a repeated
      strategic setting. In which of these situations does moving *first* raise
      the desk's payoff?
    answer: >
      When the desk can make an irreversible commitment the rival must
      best-respond to. Moving first is valuable only through commitment: building
      capacity that cannot be unbuilt, signing a contract with a penalty, or
      publishing a price that would be costly to walk back. The rival then
      optimises against a number they believe, and the first mover has effectively
      chosen a point on the rival's best-response curve rather than meeting them
      at the simultaneous equilibrium. If the announcement can be revised, the
      rival knows it can be revised and the commitment evaporates, which is why
      cheap talk moves nothing. The mirror case is concealment: in a game whose
      equilibria are all mixed, moving first hands the opponent the one thing your
      randomisation exists to deny them, and the payoff strictly falls. The two
      questions to ask, in order: can I commit in a way the rival must believe,
      and does my move leak information worth more than that commitment? Timing is
      never the primitive — commitment and information are.
    choices:
      - text: >
          When the desk can make an irreversible commitment the rival must
          best-respond to.
        correct: true
        feedback: >
          Right — irreversibility is the mechanism; without it the first move is
          just information given away.
      - text: >
          When the game's only equilibria are mixed, so moving first pins down
          the randomisation.
        feedback: >
          This is the worst case for moving first: revealing a realised action
          destroys exactly what mixing protects.
      - text: >
          Whenever the desk announces its intention, since announcements shape the
          rival's beliefs.
        feedback: >
          A revisable announcement is cheap talk; the rival discounts it precisely
          because it can be revised.
      - text: >
          Always, because the first mover chooses from the full strategy set while
          the second is constrained.
        feedback: >
          The second mover's set is not smaller — they simply choose later, with
          more information.
    rubric:
      - >
        Names commitment, not timing, as the source of any first-mover advantage,
        and requires irreversibility.
      - >
        Identifies mixed-equilibrium games as the case where moving first strictly
        hurts, because concealment is the asset.
    targets:
      - quant-games.game-theory.first-mover

  # --- guess two-thirds of the average ---------------------------------------------

  - id: qgt-two-thirds-01
    kind: work
    difficulty: demanding
    statement: >
      In the classic game every player names a number in $[0,100]$ and the winner
      is closest to $2/3$ of the average. Each round of iterated elimination of
      weakly dominated strategies multiplies the ceiling on surviving guesses by
      $2/3$, starting from $100$. After how many rounds does that ceiling first
      fall below $1$?
    answer: >
      $12$. The average of numbers in $[0, M]$ can never exceed $M$, so the target
      can never exceed $(2/3)M$ and every guess above $(2/3)M$ is weakly
      dominated. Deleting those replaces the ceiling $M$ by $(2/3)M$, and the
      argument repeats, so after $k$ rounds the ceiling is $100(2/3)^{k}$. Solve
      $100(2/3)^{k} < 1$. Taking logarithms, $k > \ln(100)/\ln(1.5) \approx
      4.605/0.405 \approx 11.36$, so the first integer that works is $k = 12$;
      checking directly, $100(2/3)^{11} \approx 1.156$ is still above $1$ while
      $100(2/3)^{12} \approx 0.771$ is below. The cascade converges to $0$, the
      unique Nash equilibrium, and that is the answer theory gives. It is also
      the losing answer against real people: observed averages in newspaper and
      classroom runs sit near $22$, roughly two rounds in, so a player who names
      $0$ is beaten by a player who stopped at level $2$. Equilibrium here is
      where the reasoning ends, not where the population is.
    expects: "12"
    rubric:
      - >
        Models the ceiling after $k$ rounds as $100(2/3)^{k}$, from the fact that
        the target cannot exceed $2/3$ of the largest surviving guess.
      - >
        Solves the inequality and rounds *up* to $12$, checking the round-$11$
        ceiling of about $1.16$ is still above $1$.
      - >
        Separates the equilibrium $0$ from the winning guess against a real
        population near $22$.
    targets:
      - quant-games.game-theory.two-thirds
    exercises:
      - quant-games.game-theory.dominance

  - id: qgt-two-thirds-02
    kind: work
    difficulty: standard
    statement: >
      The same game is played, but every guess must lie in $[20, 100]$ — the rule
      is still that the winner is closest to $2/3$ of the average, and a guess
      below $20$ is not allowed. What number does everyone name at the unique Nash
      equilibrium?
    answer: >
      $20$. Run the same elimination. With all guesses at most $100$ the target is
      at most $66.7$, so guesses above $66.7$ are dominated; with all guesses at
      most $66.7$ the target is at most $44.4$; and each round multiplies the
      ceiling by $2/3$. The difference from the unrestricted game is the floor.
      The ceiling cannot fall below $20$, because $20$ is the smallest legal
      guess, so the cascade halts there rather than converging to $0$. Check that
      everyone naming $20$ is an equilibrium: the average is $20$, the target is
      $(2/3)(20) \approx 13.3$, and the closest legal guess to $13.3$ is the floor
      $20$ itself, which everyone is already naming, so no player can move closer
      by deviating — anything larger is strictly further away. The trap is
      answering $0$ from memory: the equilibrium of this family of games is the
      fixed point of the elimination *within the permitted range*, and here the
      constraint binds before the multiplier finishes its work.
    expects: "20"
    rubric:
      - >
        Runs the elimination and notices the ceiling is bounded below by the legal
        floor, so the limit is $20$ rather than $0$.
      - >
        Verifies the equilibrium directly — the target $13.3$ is below the floor,
        so every legal deviation moves further from it.
    targets:
      - quant-games.game-theory.two-thirds

  # --- levels of reasoning ----------------------------------------------------------

  - id: qgt-levels-of-reasoning-01
    kind: work
    difficulty: demanding
    statement: >
      Players name a number in $[0,100]$ and the winner is closest to $3/5$ of the
      average. Model the population as a cognitive hierarchy: level $0$ guesses
      uniformly at random, and each level $k$ best-responds to the belief that
      everyone else is at level $k-1$. What number does a level-$3$ player name?
    answer: >
      $10.8$. Level $0$ draws uniformly on $[0,100]$, so the average it produces
      is $50$. A level-$1$ player believes everyone else is level $0$ and so
      believes the average is $50$; their best guess is the target
      $(3/5)(50) = 30$. A level-$2$ player believes everyone else is level $1$,
      hence that the average is $30$, and names $(3/5)(30) = 18$. A level-$3$
      player believes the average is $18$ and names $(3/5)(18) = 10.8$. In closed
      form the ladder is $50 (3/5)^{k}$, and $50(0.6)^{3} = 10.8$. Two things are
      worth noticing. The ladder converges to $0$, the Nash equilibrium, but each
      rung is a *different* answer, and the whole content of the model is that
      real populations stop between rungs $1$ and $2$ rather than taking the
      limit. And the multiplier controls the speed: a target of $3/5$ collapses
      faster than $2/3$ and slower than $1/2$, so the same reasoning depth lands
      on a different number in each variant. The trap is starting the ladder at
      $100$ rather than at the mean $50$ of the level-$0$ distribution.
    expects: "10.8"
    rubric:
      - >
        Starts the ladder at the mean of the level-$0$ distribution, $50$, not at
        the top of the range.
      - >
        Applies the multiplier once per level, giving $30$, $18$ and $10.8$ — or
        equivalently $50(3/5)^{3}$.
      - >
        Notes that the ladder's limit is the Nash equilibrium $0$ but that the
        model's whole point is that populations stop short of it.
    targets:
      - quant-games.game-theory.levels-of-reasoning
    exercises:
      - quant-games.game-theory.two-thirds

  - id: qgt-levels-of-reasoning-02
    kind: decide
    difficulty: standard
    statement: >
      You are entering a guess-two-thirds-of-the-average contest on $[0,100]$
      against a large room of experienced but non-specialist players, whose
      reasoning depth in past runs has centred between levels $1$ and $2$. Which
      guess maximises your chance of winning?
    answer: >
      About $22$, the level-$3$ answer. Build the ladder: level $0$ averages $50$,
      level $1$ answers $(2/3)(50) \approx 33$, level $2$ answers
      $(2/3)(33) \approx 22$, and level $3$ answers $(2/3)(22) \approx 15$. If the
      population centres between levels $1$ and $2$, the *average guess* it
      produces sits between $33$ and $22$, call it around $28$; the winning number
      is $2/3$ of that, which lands near $19$ to $22$ — one step above where the
      room actually is. That is the operating rule: play one level above the flow,
      not one level above the theory. Both errors are real. Naming $0$ is the
      equilibrium and loses badly, because it best-responds to opponents who do
      not exist in this room; naming $33$ answers the crowd's average rather than
      the target derived from it, and is one step too shallow. The equilibrium is
      still worth computing — it is where a room of specialists would converge,
      and knowing which room you are in is the whole skill.
    choices:
      - text: >
          About $22$, one reasoning step beyond where the room actually sits.
        correct: true
        feedback: >
          Right — and observed winning guesses in runs like this really do land in
          the high teens to low twenties.
      - text: >
          $0$, the unique Nash equilibrium of the game.
        feedback: >
          The equilibrium answer loses here: it best-responds to infinitely deep
          opponents, and this room is two levels deep.
      - text: >
          About $33$, since that is what the room's typical player will name.
        feedback: >
          That matches the crowd rather than beating it — the target is $2/3$ of
          the average, not the average.
      - text: >
          $50$, the mean of the range, since guesses are spread across it.
        feedback: >
          This is level-$0$ play and ignores that the target is strictly below the
          average.
    rubric:
      - >
        Builds the level ladder from the mean $50$ and locates the population
        between levels $1$ and $2$.
      - >
        Plays one step beyond the observed depth rather than either matching the
        crowd or taking the equilibrium limit.
    targets:
      - quant-games.game-theory.levels-of-reasoning

  # --- repeated play ----------------------------------------------------------------

  - id: qgt-repeated-cooperation-01
    kind: work
    difficulty: demanding
    statement: >
      Two shipping lines repeat a prisoners' dilemma each period with payoffs
      $(\text{row}, \text{column})$ — row Cooperate: $(8,8)$ against Cooperate,
      $(1,12)$ against Defect; row Defect: $(12,1)$ against Cooperate, $(3,3)$
      against Defect. The horizon is infinite and each line discounts the next
      period by $\delta$. Under grim trigger — cooperate until any defection, then
      defect forever — what is the smallest $\delta$ that sustains cooperation?
      Give an exact fraction.
    answer: >
      $4/9$. Compare the two infinite streams from the first period. Cooperating
      forever pays $8$ every period, worth
      $8(1 + \delta + \delta^{2} + \dots) = 8/(1-\delta)$. Defecting once pays the
      temptation $12$ now and then triggers permanent mutual defection at $3$ per
      period from the next period on, worth $12 + 3\delta/(1-\delta)$.
      Cooperation is sustainable when $8/(1-\delta) \ge 12 + 3\delta/(1-\delta)$.
      Multiplying through by $1-\delta$ gives $8 \ge 12(1-\delta) + 3\delta$, that
      is $8 \ge 12 - 9\delta$, so $9\delta \ge 4$ and $\delta \ge 4/9$. The
      general formula reproduces it: with temptation $T = 12$, reward $R = 8$ and
      punishment $P = 3$, the threshold is
      $(T-R)/(T-P) = (12-8)/(12-3) = 4/9$. At $\delta = 4/9$ both sides equal
      $14.4$, so the line is exactly indifferent. What sustains cooperation is
      patience, not goodwill — a low $\delta$ is a player who barely values
      tomorrow, and no punishment reaches them.
    expects: "4/9"
    rubric:
      - >
        Prices both infinite streams with the geometric sum $1/(1-\delta)$, and
        starts the punishment stream one period late.
      - >
        Solves the inequality to $\delta \ge 4/9$, matching
        $(T-R)/(T-P)$ with $T = 12$, $R = 8$, $P = 3$.
      - >
        Reads the threshold as a statement about patience rather than about
        players' preferences over outcomes.
    targets:
      - quant-games.game-theory.repeated-cooperation
    exercises:
      - quant-games.game-theory.prisoners-dilemma

  - id: qgt-repeated-cooperation-02
    kind: work
    difficulty: standard
    statement: >
      The same prisoners' dilemma is played exactly $25$ times, and both players
      know the number of rounds in advance. In the unique subgame-perfect
      equilibrium, in how many of the $25$ rounds do the players cooperate?
    answer: >
      $0$. Apply backward induction to the whole repeated game. Round $25$ is the
      last, so nothing follows it and no future punishment can be threatened; it
