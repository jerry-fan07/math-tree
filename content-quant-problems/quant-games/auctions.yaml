# Problems targeting quant-games.auctions — bidding under uncertainty.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's instance. Prices are written as bare numbers with
# the word "dollars", never a currency sign. See ../README.md.

problems:
  # --- an auction as a game ---------------------------------------------------

  - id: qauc-setup-01
    kind: work
    difficulty: demanding
    statement: >
      A seller of a wine lot announces the rules before bids arrive: the highest
      bid wins, and the winner pays the average of the two highest *losing*
      bids. Five sealed bids come in — $22$, $35$, $48$, $51$ and your own $64$,
      all in dollars — and your true value for the lot is $64$ dollars. What is
      your payoff, in dollars?
    answer: >
      $14.5$. Read the two rules separately. The allocation rule is
      highest-bid-wins, so your $64$ takes the lot; the payment rule is the
      average of the two highest losing bids, and the losing bids are $22$, $35$,
      $48$ and $51$, whose two highest are $51$ and $48$. The price is therefore
      $(51 + 48)/2 = 49.5$ dollars, and the payoff is value minus price,
      $64 - 49.5 = 14.5$ dollars. The two wrong reflexes are worth naming: $0$
      comes from assuming an auction always charges the winner their own bid, and
      $64 - 51 = 13$ comes from assuming it always charges the single
      second-highest number. Neither rule was announced here — the framework
      fixes only that *some* allocation rule and *some* payment rule are
      committed to in advance.
    expects: "14.5"
    rubric:
      - >
        Separates the allocation rule from the payment rule and applies the one
        actually announced, rather than defaulting to pay-your-bid or
        pay-the-runner-up.
      - >
        Averages the two highest *losing* bids, $51$ and $48$, and does not
        include the winning bid of $64$ in that average.
    targets:
      - quant-games.auctions.setup

  - id: qauc-setup-02
    kind: work
    difficulty: standard
    statement: >
      A photocopier is sold under this rule: the highest bid wins and pays the
      midpoint between the highest and the second-highest bid. Three bids arrive
      — $140$, $205$ and your own $260$ dollars — and the copier is worth $300$
      dollars to you. What is your payoff, in dollars?
    answer: >
      $67.5$. Your $260$ is the highest bid, so the allocation rule hands you the
      copier. The announced payment rule is the midpoint of the top two bids:
      $(260 + 205)/2 = 232.5$ dollars. Payoff is value minus price,
      $300 - 232.5 = 67.5$ dollars. Notice what this rule does to your incentives
      even though we are not asked about them: half of every extra dollar you bid
      comes straight back at you as price, so your own number is partly
      self-charging, which puts this rule in the same family as pay-your-bid
      rather than the same family as pay-the-runner-up.
    expects: "67.5"
    rubric:
      - >
        Averages the top two bids, $260$ and $205$, to get the price of $232.5$
        dollars rather than charging either number outright.
      - >
        Subtracts the price from the *value* of $300$ dollars, not from the
        winning bid of $260$.
    targets:
      - quant-games.auctions.setup

  # --- the four standard formats ----------------------------------------------

  - id: qauc-formats-01
    kind: work
    difficulty: demanding
    statement: >
      A tractor is sold by English clock. The price starts at $100$ dollars and
      rises in steps of $5$ dollars; a bidder stays in as long as the current
      price is at or below their value, and drops out irrevocably once it goes
      above. The four values in the room are $118$, $147$, $206$ and $262$
      dollars. At what price does the auction end — that is, what price does the
      winner pay, in dollars?
    answer: >
      $210$. Walk the clock. At $115$ everybody is still in; at $120$ the
      $118$-value bidder is gone. The next exit is the $147$-value bidder, who
      survives $145$ and quits at $150$, leaving two. The auction is still live
      because two bidders remain, and it ends the moment only one does: the
      $206$-value bidder survives $205$ and quits at $210$, so the $262$-value
      bidder is alone at a price of $210$ dollars and pays it. The price is set
      by the runner-up's exit, not by the winner's own value, which is exactly
      the English format's signature — and the grid matters, since with a
      continuous clock the price would have been just above $206$ rather than the
      $210$ the discrete steps produce.
    expects: "210"
    rubric:
      - >
        Ends the auction when the second-to-last bidder leaves, so the price
        comes from the runner-up's exit and not from the winner's own value of
        $262$.
      - >
        Respects the $5$-dollar grid — the $206$-value bidder stays at $205$ and
        leaves at $210$ — rather than reporting $206$.
    targets:
      - quant-games.auctions.formats
    exercises:
      - quant-games.auctions.setup

  - id: qauc-formats-02
    kind: work
    difficulty: standard
    statement: >
      A Dutch descending clock opens at $500$ dollars and falls by $15$ dollars
      every ten seconds. Four bidders have each decided in advance the highest
      price at which they would claim the object: $410$, $365$, $455$ and $320$
      dollars. What price does the winner pay, in dollars?
    answer: >
      $455$. The clock reads $500$, then $485$, then $470$, then $455$. Nobody
      accepts at $500$, $485$ or $470$, because the highest pre-committed price
      in the room is $455$ and all four bidders are still waiting for the clock
      to reach their own number. At $455$ the third bidder accepts, and a Dutch
      auction stops the instant somebody does — so the object is sold at $455$
      dollars and the other three commitments are never revealed. The lesson of
      the format is in that last clause: nothing about the rivals is learned
      before you commit, so the only decision you ever make is the single number
      at which you would stop the clock, which is why Dutch is pay-your-bid.
    expects: "455"
    rubric:
      - >
        Takes the winner to be whoever holds the *highest* stopping price, since
        a falling clock reaches that number first.
      - >
        Charges the price at which the clock was stopped, $455$, rather than any
        rival's number.
    targets:
      - quant-games.auctions.formats
    exercises:
      - quant-games.auctions.setup

  # --- private, common and interdependent values ------------------------------

  - id: qauc-value-models-01
    kind: decide
    difficulty: demanding
    statement: >
      A fund bids for a book of distressed consumer loans it intends to hold to
      maturity. Whoever wins collects exactly the same stream of repayments, and
      every fund in the room has run its own credit model over the same loan
      tape. Which value model is this?
    answer: >
      Common value. The test is not "will I keep it or resell it" but "would
      learning what my rivals know change the number I assign to the object". The
      loan book pays the same cash to whoever holds it, so there is a single
      unknown $V$ — the realised repayments — and each fund's credit model is a
      noisy signal $X_i$ of that one number. Holding to maturity is a red
      herring: it fixes *how* the value is realised, not *whether* the value is
      shared. The consequence is the one this unit exists for: winning means your
      credit model was the most optimistic in the room, which is evidence it ran
      high, so the bid must be built from
      $\mathbb{E}[V \mid X_i = x, \text{you win}]$ rather than from the model's
      raw output.
    choices:
      - text: >
          Common value — the same repayment stream accrues to whoever wins, and
          each fund's credit model is a noisy signal of that one unknown number.
        correct: true
        feedback: >
          Right, and the tell is that a rival's model output, if you could see
          it, would move your own estimate — that is precisely what a shared
          unknown means.
      - text: >
          Private values — the fund holds the loans itself rather than reselling
          them, so its value is its own affair.
        feedback: >
          Holding to maturity does not make the value private; the repayments are
          the same for every holder, so learning a rival's model would change
          your estimate.
      - text: >
          Private values — every fund runs a different credit model, so the
          valuations genuinely differ across the room.
        feedback: >
          Differing *estimates* of one shared number is exactly the common-value
          setup; private values means the numbers differ even when everyone knows
          everything.
      - text: >
          Neither — with no resale market the framework does not apply.
        feedback: >
          A resale market is not part of any of these definitions; the allocation
          and payment rules plus the value model are all the framework needs.
    rubric:
      - >
        Applies the test "would learning what a rival knows change my own number",
        rather than asking whether the object will be resold or held.
      - >
        Names the consequence for bidding: winning means the credit model was the most
        optimistic in the room, so the bid must come from the expectation conditional on
        winning.
    targets:
      - quant-games.auctions.value-models

  - id: qauc-value-models-02
    kind: decide
    difficulty: standard
    statement: >
      A charity auctions a cooking lesson with a well-known chef. The winner
      attends personally, the lesson cannot be transferred or resold, and each
      bidder simply knows how much an evening with that chef is worth to them.
      Which value model is this?
    answer: >
      Independent private values. Each bidder already knows $v_i$ exactly, and
      hearing every rival's valuation would not shift it by a cent — the whole
      point of a non-transferable personal experience. Adding that the room's
      tastes are drawn from one common pool makes it IPV specifically, which is
      the hypothesis the shading formula and revenue equivalence both need. The
      practical payoff of the classification is that under private values winning
      is informationally neutral: it tells you your value was the highest, which
      you already knew was possible and which does not revise $v_i$ at all. That
      is why no winner's-curse correction belongs anywhere near this problem.
    choices:
      - text: >
          Independent private values — each bidder knows their own value, and no
          rival's opinion could move it.
        correct: true
        feedback: >
          Right — a non-transferable personal experience is the cleanest
          private-values case there is, and winning teaches the winner nothing.
      - text: >
          Common value — the chef's reputation is the same for everybody, so the
          object is worth the same to whoever wins.
        feedback: >
          A shared *reputation* is not a shared value; what the evening is worth
          depends entirely on the individual attending, and no rival's estimate
          would revise it.
      - text: >
          Interdependent values — the bidders' valuations are correlated because
          they all admire the same chef.
        feedback: >
          Interdependent values means a rival's private information would move
          your own value; correlated tastes alone leave each value known and
          fixed to its owner.
    rubric:
      - >
        Identifies a non-transferable personal experience as leaving each value known to
        its owner and unmoved by any rival's opinion.
      - >
        Says that no winner's-curse correction belongs here, because under private values
        winning is informationally neutral.
    targets:
      - quant-games.auctions.value-models

  # --- which formats are the same game ----------------------------------------

  - id: qauc-strategic-equivalence-01
    kind: work
    difficulty: demanding
    statement: >
      Five bidders hold private values $12$, $38$, $55$, $74$ and $89$ dollars
      for a lot, and an English clock rises continuously. Four of them play the
      dominant strategy of staying in until the price reaches their value, but
      the $74$-value bidder loses their nerve and drops out at $60$ dollars. By
      how many dollars is the seller's revenue short of what a fully truthful
      English run would have raised?
    answer: >
      $14$. In the truthful run the exits happen at $12$, $38$, $55$ and $74$;
      the auction ends when the second-to-last bidder leaves, so the $89$-value
      bidder wins at essentially $74$ dollars — the same price the second-price
      sealed-bid auction would charge, which is the outcome equivalence at work.
      In the run described, the last rival to quit does so at $60$ instead, so
      the clock stops there and the winner pays about $60$ dollars. The shortfall
      is $74 - 60 = 14$ dollars. The point the arithmetic makes is that the
      English price is set by the *second-highest drop-out*, never by the
      second-highest value, and the two coincide only when everyone plays the
      dominant strategy — which is exactly why English and second-price are
      outcome-equivalent rather than strategically equivalent.
    expects: "14"
    rubric:
      - >
        Prices the truthful run at the second-highest value, $74$ dollars, using
        the second-to-last exit rather than the winner's own value of $89$.
      - >
        Recognises that the early exit at $60$ moves the price, so the English
        price tracks drop-outs and not values, and reports the difference $14$.
    targets:
      - quant-games.auctions.strategic-equivalence
    exercises:
      - quant-games.auctions.formats

  - id: qauc-strategic-equivalence-02
    kind: decide
    difficulty: standard
    statement: >
      Dutch and first-price sealed-bid are strategically equivalent, while
      English and second-price are only outcome-equivalent. What is the reason
      for the difference in strength?
    answer: >
      Strategic equivalence is a claim about strategy sets and payoffs, not about
      prices. A Dutch bidder learns nothing at all before the moment they accept,
      so their entire strategy is one number chosen in advance — literally the
      same object a first-price sealed bid asks for, with the same payoff at
      every profile. An English bidder instead makes a live sequence of
      stay-or-quit decisions while watching rivals leave, a strategy space with
      no counterpart in a single sealed envelope. Under private values those
      richer strategies happen to produce the same winner at the same price, so
      the two are outcome-equivalent — and that weaker link snaps under common
      values, where the exits an English clock reveals are information a sealed
      bid cannot use.
    choices:
      - text: >
          A Dutch bidder learns nothing before choosing the single price at which
          to claim the object, so the strategy is one number; an English bidder
          makes a sequence of stay-or-quit decisions while watching rivals leave.
        correct: true
        feedback: >
          Exactly — identical strategy sets and payoffs is the strong claim, and
          only the pair with genuinely identical decision problems satisfies it.
      - text: >
          Dutch and first-price both charge the winner's own number, while
          English and second-price both charge a rival's number.
        feedback: >
          That is the payment-rule split, which sorts all four formats into two
          buckets; it does not distinguish identical strategy sets from merely
          identical prices.
      - text: >
          One clock falls and the other rises, and a falling clock reveals less
          simply because it is faster.
        feedback: >
          Speed is not the issue — the Dutch clock reveals nothing because nobody
          acts before the winner does, while every English exit is a public
          event.
    rubric:
      - >
        Distinguishes identical strategy sets and payoffs from merely identical prices,
        rather than sorting the four formats by payment rule.
      - >
        Names the asymmetry: a Dutch bidder commits to one number with nothing revealed
        first, while an English bidder makes a live sequence of stay-or-quit decisions.
    targets:
      - quant-games.auctions.strategic-equivalence

  # --- Vickrey: truthful bidding is dominant ----------------------------------

  - id: qauc-vickrey-01
    kind: work
    difficulty: demanding
    statement: >
      A second-price sealed-bid auction, private values, and yours is $76$
      dollars. You are weighing an inflated bid of $91$ against bidding
      truthfully. From where you sit the highest rival bid is equally likely to
      be $40$, $70$, $84$ or $110$ dollars. What is your expected profit from
      bidding $91$ minus your expected profit from bidding $76$, in dollars?
    answer: >
      $-2$. Price the two bids scenario by scenario, remembering that the price
      is always the highest rival bid $p$, never your own number. Bidding $76$:
      you win at $40$ for $36$, win at $70$ for $6$, and lose at $84$ and $110$
      for $0$ each, so the expectation is $(36 + 6 + 0 + 0)/4 = 10.5$ dollars.
      Bidding $91$: the first two scenarios are untouched, at $110$ you still
      lose, but at $84$ the inflated bid now wins and pays $84$ for an object
      worth $76$, a profit of $-8$. That expectation is
      $(36 + 6 - 8 + 0)/4 = 8.5$ dollars, so the difference is
      $8.5 - 10.5 = -2$ dollars. Every scenario where the two bids differ is a
      scenario where the inflated bid buys something above your value; that is
      the whole content of the overbidding half of the dominance proof, and it
      needs no assumption about how the rival bids are distributed.
    expects: "-2"
    rubric:
      - >
        Charges the highest rival bid $p$ as the price in every winning scenario,
        not the bidder's own $76$ or $91$.
      - >
        Isolates the only scenario in which the two bids differ, $p = 84$, and
        finds a negative profit $76 - 84$ there — so inflating can only subtract.
    targets:
      - quant-games.auctions.vickrey

  - id: qauc-vickrey-02
    kind: work
    difficulty: standard
    statement: >
      Four bidders in a second-price sealed-bid auction with private values all
      play the dominant strategy. Their values are $31$, $47$, $59$ and $84$
      dollars. What is the winner's profit, in dollars?
    answer: >
      $25$. Dominance says each bidder submits their own value, so the bids are
      $31$, $47$, $59$ and $84$. The highest bid wins — the $84$-value bidder —
      and the price is the second-highest bid submitted, $59$ dollars, so the
      profit is $84 - 59 = 25$ dollars. Two standard slips are worth ruling out
      explicitly: the winner is the highest bidder, not the second-highest, so
      the $59$-value bidder takes nothing; and the price is a rival's number, so
      the answer is not $84 - 84 = 0$. The gap $84 - 59$ is exactly the surplus
      truthful bidding is designed to capture, and it is available precisely
      because the winner's own bid never touched the price.
    expects: "25"
    rubric:
      - >
        Awards the object to the highest bid and charges the second-highest bid —
        "second-price" names the price, not the winner.
      - >
        Computes profit as value minus price, $84 - 59$, rather than as the gap
        between any two bids that are not the winner's value and the price.
    targets:
      - quant-games.auctions.vickrey

  - id: qauc-vickrey-03
    kind: decide
    difficulty: standard
    statement: >
      Vickrey's argument concludes that bidding your true value weakly dominates
      every other bid in a second-price sealed-bid auction with private values.
      What does the argument assume about the rivals?
    answer: >
      Nothing. The proof fixes an arbitrary highest rival bid $p$ and compares
      your outcomes at that $p$: shading to $b < v$ changes the outcome only when
      $b \le p < v$, where truth wins at $v - p \ge 0$ and the shade wins
      nothing; inflating to $b > v$ changes the outcome only when
      $v < p \le b$, where the inflated bid wins at $v - p < 0$ and truth
      correctly walks away. Because the comparison holds for every $p$
      separately, it holds however the rivals bid — rationally, irrationally, in
      collusion, or at random. That is the difference between a *dominant*
      strategy and an equilibrium strategy, and it is why "bid your value" can be
      stated with no distributional assumption attached, unlike the first-price
      shading rule, which is a Bayes–Nash equilibrium and needs both.
    choices:
      - text: >
          Nothing at all — the comparison is made separately for every possible
          highest rival bid, so it holds whatever the rivals do.
        correct: true
        feedback: >
          Right, and that is what makes it dominance rather than equilibrium: no
          belief about rivals enters the argument anywhere.
      - text: >
          That the rivals also bid their true values, so that the price is the
          second-highest value.
        feedback: >
          That assumption is needed to compute the *expected price*, not to prove
          dominance; the dominance argument fixes an arbitrary rival bid and
          never asks where it came from.
      - text: >
          That the rivals' values are independent draws from a common
          distribution.
        feedback: >
          Symmetric IPV is what the first-price shading formula and revenue
          equivalence need; Vickrey's dominance argument uses no distribution at
          all.
      - text: >
          That the rivals are risk-neutral, so their bids maximise expected
          profit.
        feedback: >
          Your own risk attitude does not even matter here, since truth-telling
          dominates outcome by outcome; rivals' attitudes matter still less.
    rubric:
      - >
        States that the proof fixes an arbitrary highest rival bid $p$ and compares
        outcomes at that $p$, so no belief about the rivals enters anywhere.
      - >
        Separates dominance from equilibrium, and contrasts it with the first-price
        shading rule, which does need a distributional assumption.
    targets:
      - quant-games.auctions.vickrey

  - id: qauc-vickrey-04
    kind: justify
    difficulty: demanding
    statement: >
      Prove that in a sealed-bid second-price auction with private values,
      bidding your true value $v$ weakly dominates any bid $b \ne v$. Structure
      the argument by fixing the highest rival bid $p$ and treating the two cases
      $b < v$ and $b > v$ separately, and say in one sentence what breaks if the
      same advice is carried across to a first-price auction.
    answer: >
      Fix $p$, the highest bid among the rivals, and note first that your own bid
      enters the outcome only through the comparison with $p$ — it sets whether
      you win, never what you pay. Case $b < v$: for $p < b$ both bids win and
      both pay $p$; for $p \ge v$ both bids lose; the two differ only when
      $b \le p < v$, and there truth wins at profit $v - p \ge 0$ while $b$ wins
      nothing. Case $b > v$: for $p < v$ both win and pay $p$; for $p \ge b$ both
      lose; the two differ only when $v < p \le b$, and there $b$ wins at profit
      $v - p < 0$ while truth takes $0$. In both cases truth is at least as good
      for every $p$ and strictly better for some, which is weak dominance, and
      since $p$ was arbitrary no assumption about the rivals was used. Carried
      across to first-price the argument collapses at its first line: there your
      bid *is* your price, so winning at $b = v$ pays $v - v = 0$ and the entire
      surplus is competed away — which is why first-price needs an equilibrium
      shading rule instead of a dominance argument.
    rubric:
      - >
        Fixes an arbitrary highest rival bid $p$ before comparing bids, and says
        explicitly that the bidder's own number never enters the price.
      - >
        Handles $b < v$ and $b > v$ separately, and in each case isolates the
        range of $p$ where the two bids give different outcomes rather than
        arguing over all $p$ at once.
      - >
        Concludes *weak* dominance — the two bids tie for most $p$ — and notes
        that no assumption about rivals' rationality or distribution was used.
      - >
        Names the first-price failure: with pay-your-bid, bidding $v$ wins only
        at zero profit, so the advice does not transfer.
    targets:
      - quant-games.auctions.vickrey
    exercises:
      - quant-games.game-theory.dominance

  # --- order statistics of uniforms -------------------------------------------

  - id: qauc-uniform-order-stats-01
    kind: work
    difficulty: demanding
    statement: >
      Let $U_1,\dots,U_9$ be independent and uniform on $[0,1]$. What is the
      expected gap between the largest and the third-largest of the nine, as an
      exact fraction?
    answer: >
      $1/5$. The nine order statistics cut $[0,1]$ into $10$ intervals — below
      the smallest, the eight gaps between consecutive order statistics, and
      above the largest — and by symmetry every one of those intervals has
      expected width $1/10$. So $\mathbb{E}[U_{(k)}] = (n+1-k)/(n+1)$ gives
      $9/10$ for the largest and $7/10$ for the third-largest, and the expected
      gap is $9/10 - 7/10 = 2/10 = 1/5$. The equal-gaps picture gives the same
      answer with no formula at all: the largest and the third-largest are two
      gaps apart, each of expected width $1/10$, so the expected distance is
      $2/10$. Linearity of expectation is doing the work here — the gap is a
      difference of two order statistics from the *same* sample, so no
      independence is needed.
    expects: "1/5"
    rubric:
      - >
        Uses $n+1 = 10$ equal expected gaps, not $n = 9$, so the largest sits at
        $9/10$ rather than at $1$.
      - >
        Takes the difference of the two means directly by linearity, rather than
        attempting a joint density of the pair.
    targets:
      - quant-games.auctions.uniform-order-stats

  - id: qauc-uniform-order-stats-02
    kind: work
    difficulty: standard
    statement: >
      Seven values are independent and uniform on $[0,84]$ dollars. What is the
      expected value of the runner-up — the second-largest of the seven — in
      dollars?
    answer: >
      $63$. Scaling is the only step beyond the base fact. On $[0,1]$ the
      $k$-th largest of $n$ draws averages $(n+1-k)/(n+1)$, so with $n = 7$ and
      $k = 2$ the runner-up averages $(8-2)/8 = 6/8 = 3/4$. A uniform on
      $[0,84]$ is $84$ times a uniform on $[0,1]$, and expectation is
      homogeneous, so the answer is $84 \cdot 3/4 = 63$ dollars. Sanity-check it
      against the equal-gaps picture: eight gaps of expected width
      $84/8 = 10.5$ dollars, and the runner-up sits two gaps down from the top,
      at $84 - 2 \cdot 10.5 = 63$. This is the number a second-price auction with
      seven truthful bidders collects, which is why it is worth having cold.
    expects: "63"
    rubric:
      - >
        Uses $(n+1-k)/(n+1)$ with $n+1 = 8$ in the denominator, giving $3/4$ and
        not $6/7$.
      - >
        Rescales by the interval width $84$ rather than leaving the answer on
        $[0,1]$.
    targets:
      - quant-games.auctions.uniform-order-stats

  - id: qauc-uniform-order-stats-03
    kind: work
    difficulty: demanding
    statement: >
      Twelve errors are independent and uniform on $[-33,33]$. What is the
      expected value of the second-largest of the twelve, as an exact fraction?
    answer: >
      $297/13$. Re-centring is the whole trick. Write each error as
      $33(2U - 1)$ with $U$ uniform on $[0,1]$; order statistics survive the
      increasing map, so the second-largest error is
      $33(2U_{(2)} - 1)$ where $U_{(2)}$ is the second-largest of twelve
      uniforms, with mean $(13-2)/13 = 11/13$. Hence the answer is
      $33(22/13 - 1) = 33 \cdot 9/13 = 297/13 \approx 22.85$. The compact form is
      $a(n+1-2k)/(n+1)$ with $a = 33$, $n = 12$, $k = 2$, which reproduces
      $33 \cdot (13-4)/13$ directly. The common slip is to apply the
      $[0,1]$ formula to the half-width and report $33 \cdot 11/13$, which
      forgets that the interval is centred at zero and so is twice as wide as its
      half-width.
    expects: "297/13"
    rubric:
      - >
        Maps $[0,1]$ to $[-33,33]$ with the affine map of width $66$, not width
        $33$, so the factor $n+1-2k$ appears rather than $n+1-k$.
      - >
        Keeps $n+1 = 13$ in the denominator and reports the exact fraction
        $297/13$ rather than a truncated decimal.
    targets:
      - quant-games.auctions.uniform-order-stats

  # --- first-price shading ----------------------------------------------------

  - id: qauc-shading-01
    kind: work
    difficulty: demanding
    statement: >
      In a first-price sealed-bid auction with $n$ risk-neutral bidders whose
      private values are independent and uniform on $[0,1]$, a bidder whose value
      is $0.81$ submits the symmetric equilibrium bid $0.72$. How many bidders
      are in the room?
    answer: >
      $9$. The symmetric equilibrium bid is $b(v) = \frac{n-1}{n}v$, so the
      shading factor here is $0.72/0.81 = 72/81 = 8/9$. Setting
      $(n-1)/n = 8/9$ gives $9n - 9 = 8n$, so $n = 9$. Check the reading rather
      than just the algebra: with nine bidders, conditional on your $0.81$
      beating all eight rivals, those rivals are uniform on $[0,0.81]$ and their
      maximum averages $0.81 \cdot 8/9 = 0.72$ — the equilibrium bid is exactly
      what you expect to have to beat, given that you win. A bidder who instead
      submitted their value $0.81$ would win more often and earn exactly zero
      every time, which is the first trap this formula exists to close.
    expects: "9"
    rubric:
      - >
        Reads the shading factor off the ratio $0.72/0.81 = 8/9$ and solves
        $(n-1)/n = 8/9$ for $n$, rather than solving $(n-1)/(n+1)$ or a revenue
        formula.
      - >
        Interprets the bid as the expected highest rival value conditional on
        winning, not as an arbitrary fraction.
    targets:
      - quant-games.auctions.shading
    exercises:
      - quant-games.auctions.uniform-order-stats

  - id: qauc-shading-02
    kind: work
    difficulty: standard
    statement: >
      Three risk-neutral bidders draw private values independently and uniformly
      on $[0,150]$ dollars. Yours comes out at $126$ dollars. What is your
      symmetric equilibrium bid, in dollars?
    answer: >
      $84$. The equilibrium bid function is $b(v) = \frac{n-1}{n}v$, and the
      formula is scale-free — a uniform on $[0,150]$ is just $150$ times a
      uniform on $[0,1]$, and both sides of the bid function scale together — so
      with $n = 3$ the bid is $\frac{2}{3} \cdot 126 = 84$ dollars. The reading
      confirms it: conditional on your $126$ beating both rivals, their values
      are uniform on $[0,126]$ and the larger of the two averages
      $126 \cdot 2/3 = 84$ dollars, exactly the bid. Bidding your value $126$
      would guarantee a payoff of $0$ on every win, and bidding a flat "ten
      percent off" would ignore that the right shade depends on $n$ and on
      nothing else here.
    expects: "84"
    rubric:
      - >
        Uses $(n-1)/n$ with $n = 3$, the total number of bidders, and does not
        substitute the interval width $150$ anywhere in the fraction.
      - >
        Names the trap of bidding one's own value in a pay-your-bid format, which
        wins at exactly zero profit.
    targets:
      - quant-games.auctions.shading

  - id: qauc-shading-03
    kind: work
    difficulty: demanding
    statement: >
      Five risk-neutral bidders draw private values independently and uniformly
      on $[0,1]$ and all play the symmetric equilibrium. Your value is $0.6$.
      What is your expected profit, as a decimal?
    answer: >
      $0.015552$. Three steps. The equilibrium bid is
      $b = \frac{n-1}{n}v = \frac{4}{5} \cdot 0.6 = 0.48$. You win exactly when
      all four rivals have values below $0.6$ — the bid function is increasing,
      so outbidding them is the same event as out-valuing them — which has
      probability $0.6^{4} = 0.1296$. Your profit when you win is
      $v - b = 0.6 - 0.48 = 0.12$, a constant, so the expected profit is
      $0.12 \cdot 0.1296 = 0.015552$. Notice how little a bidder makes: the
      margin is thin because five bidders force a bid close to value, and the win
      probability is thin because $0.6$ is not a high draw. Bidding your value
      would raise the win probability to $1$ against these rivals but collapse
      the margin to $0$, which is the trade-off the formula resolves.
    expects: "0.015552"
    rubric:
      - >
        Converts "I outbid everyone" into "my value is highest" using the fact
        that the symmetric bid function is increasing, giving $0.6^{4}$ and not
        $0.48^{4}$.
      - >
        Multiplies the constant winning margin $v - b = 0.12$ by that
        probability, rather than integrating an unnecessary conditional
        expectation.
    targets:
      - quant-games.auctions.shading
    exercises:
      - quant-games.auctions.uniform-order-stats

  # --- revenue equivalence ----------------------------------------------------

  - id: qauc-revenue-equivalence-01
    kind: work
    difficulty: demanding
    statement: >
      Five risk-neutral bidders draw private values independently and uniformly
      on $[0,140]$ dollars. What is the seller's expected revenue from a
      first-price sealed-bid auction with no reserve, as an exact fraction of a
      dollar?
    answer: >
      $280/3$. Compute it the first-price way and check it the second-price way.
      First-price: every bidder submits $\frac{n-1}{n}v = \frac{4}{5}v$, the
      highest value wins, and the highest of five uniforms on $[0,140]$ averages
      $140 \cdot 5/6 = 350/3$ dollars, so revenue is
      $\frac{4}{5} \cdot \frac{350}{3} = \frac{280}{3} \approx 93.33$ dollars.
      Second-price: everyone bids truthfully and the seller collects the
      runner-up value, which averages $140 \cdot 4/6 = 280/3$ dollars — the same
      number. That agreement is revenue equivalence rather than a coincidence:
      the general statement is $w(n-1)/(n+1)$ for width $w$, and the two formats
      reach it by opposite routes, one collecting a shaded bid from a high value
      and the other an unshaded bid from a lower one.
    expects: "280/3"
    rubric:
      - >
        Applies the shading factor to the *expected highest value*, not to the
        interval endpoint, so the chain is $140 \cdot 5/6$ then $\times 4/5$.
      - >
        Cross-checks against the second-price route $w(n-1)/(n+1)$ and gets the
        same $280/3$, rather than reporting two different revenues.
    targets:
      - quant-games.auctions.revenue-equivalence
    exercises:
      - quant-games.auctions.shading
      - quant-games.auctions.uniform-order-stats

  - id: qauc-revenue-equivalence-02
    kind: decide
    difficulty: standard
    statement: >
      Revenue equivalence says that a family of auction formats raises the same
      expected revenue. Which set of assumptions does the theorem actually
      require?
    answer: >
      Symmetric independent private values from a common atomless distribution,
      risk-neutral bidders, and a mechanism whose equilibrium gives the object to
      the highest value while leaving the lowest possible type zero expected
      surplus. Under those hypotheses expected revenue is pinned down by the
      allocation alone, so first-price, second-price, English and Dutch all
      collect the same amount. What the list does *not* contain is as important:
      no minimum number of bidders, no reserve price, no requirement that bidders
      see each other's bids. And the two standard breaks follow straight from the
      list — risk aversion violates risk neutrality and tips revenue toward
      first-price, while common or correlated values violate independent private
      values and tip it toward ascending formats.
    choices:
      - text: >
          Symmetric independent private values from a common atomless
          distribution, risk-neutral bidders, and an equilibrium that awards the
          object to the highest value with zero surplus to the lowest type.
        correct: true
        feedback: >
          Right — and knowing the list is what lets you answer the follow-up,
          since risk aversion and common values are exactly the two hypotheses an
          interviewer will break next.
      - text: >
          Only that the auction is efficient — the object goes to the bidder who
          values it most — with no restriction on the value model.
        feedback: >
          Efficiency is one of the hypotheses but not all of them; drop
          independent private values and ascending formats pull ahead, which is
          why common-value objects are usually sold by English auction.
      - text: >
          That every bidder observes the others' bids before the auction closes,
          so that the formats convey the same information.
        feedback: >
          No format in the family requires that, and second-price sealed-bid
          plainly does not have it; the theorem is about equilibrium payments,
          not about what bidders see.
      - text: >
          That a reserve price is set at the seller's own valuation, so that the
          object is never sold below cost.
        feedback: >
          Reserves change revenue in every format and are not part of the
          statement; the benchmark comparison is run with no reserve at all.
    rubric:
      - >
        Lists symmetric independent private values, risk neutrality and an efficient
        equilibrium giving the lowest type zero surplus, without smuggling in a reserve
        price or a minimum number of bidders.
      - >
        Names the two standard breaks — risk aversion and common or correlated values —
        and which format each tips revenue toward.
    targets:
      - quant-games.auctions.revenue-equivalence

  - id: qauc-revenue-equivalence-03
    kind: work
    difficulty: demanding
    statement: >
      Values are independent and uniform on $[0,1]$, bidders are risk-neutral and
      symmetric, and there is no reserve. How many bidders must be in the room
      for the seller's expected revenue to equal $0.75$?
    answer: >
      $7$. Revenue equivalence lets you pick whichever format is easiest to
      compute, and second-price is easiest: the seller collects the runner-up
      value, which for $n$ uniforms on $[0,1]$ averages $(n-1)/(n+1)$. Setting
      $(n-1)/(n+1) = 3/4$ gives $4n - 4 = 3n + 3$, so $n = 7$. Confirm through
      first-price, where the seller collects $\frac{n-1}{n}$ of the winning
      value: $\frac{6}{7} \cdot \frac{7}{8} = \frac{6}{8} = 0.75$, the same
      number. The trap is using $(n-1)/n$ — the *shading factor* — as the revenue
      formula; that would give $n = 4$, and it confuses what a single bidder pays
      per unit of value with what the seller expects to collect.
    expects: "7"
    rubric:
      - >
        Uses the revenue formula $(n-1)/(n+1)$ rather than the shading factor
        $(n-1)/n$, and says which format the formula came from.
      - >
        Solves the resulting linear equation exactly and verifies the answer by
        the other format, getting $0.75$ both ways.
    targets:
      - quant-games.auctions.revenue-equivalence
    exercises:
      - quant-games.auctions.uniform-order-stats

  # --- the common-value signal model ------------------------------------------

  - id: qauc-common-value-model-01
    kind: work
    difficulty: demanding
    statement: >
      A sealed crate is worth either $300$ or $500$ dollars to whoever owns it,
      each equally likely before any information arrives. Every bidder gets one
      private signal, either "heavy" or "light", and the signal reads "heavy"
      with probability $0.8$ when the crate is worth $500$ and with probability
      $0.3$ when it is worth $300$; signals are conditionally independent across
      bidders given the crate's worth. Your signal reads "heavy". Ignoring the
      auction entirely, what is $\mathbb{E}[V \mid X_i = \text{heavy}]$, in
      dollars, as an exact fraction?
    answer: >
      $4900/11 \approx 445.45$ dollars. This is the naive estimate — your own
      signal and nothing else — so it is a plain Bayes update. The unconditional
      chance of reading "heavy" is
      $0.5 \cdot 0.8 + 0.5 \cdot 0.3 = 0.55$, so the posterior on the high value
      is $0.5 \cdot 0.8 / 0.55 = 0.4/0.55 = 8/11$, leaving $3/11$ on the low one.
      Hence
      $\mathbb{E}[V \mid X_i = \text{heavy}] = 500 \cdot 8/11 + 300 \cdot 3/11
      = (4000 + 900)/11 = 4900/11$. Two things deserve naming. The signal is
      informative but far from decisive — the estimate moves from the prior mean
      of $400$ only to about $445$. And this number is emphatically *not* the
      right bid: the relevant quantity is
      $\mathbb{E}[V \mid X_i = \text{heavy}, \text{you win}]$, which conditions
      also on nobody having outbid you, and in a room of bidders reading the same
      crate that extra conditioning pulls the estimate down.
    expects: "4900/11"
    rubric:
      - >
        Computes the marginal probability of the observed signal, $0.55$, before
        dividing — not treating $0.8$ as the posterior.
      - >
        Reports the posterior *mean* $500 \cdot 8/11 + 300 \cdot 3/11$ rather
        than the more likely value $500$.
      - >
        Says explicitly that this is the estimate that ignores the auction, and
        that the bidding-relevant expectation conditions on winning as well.
    targets:
      - quant-games.auctions.common-value-model
    exercises:
      - quant-probability.conditioning.conditional-expectation

  - id: qauc-common-value-model-02
    kind: decide
    difficulty: standard
    statement: >
      In the standard working model a bidder's signal is
      $X_i = V + \varepsilon_i$, with the errors independent of $V$, independent
      across bidders and mean zero, so that
      $\mathbb{E}[X_i \mid V] = V$. What exactly does that last equation claim?
    answer: >
      It claims that the signal is unbiased *on average over the noise*: fix the
      true value $V$, average $X_i$ over the distribution of $\varepsilon_i$, and
      you recover $V$ exactly. It says nothing whatever about any particular
      draw, which may land far above or far below $V$ — indeed the whole
      winner's curse lives in the fact that the auction does not sample a
      typical draw, it selects the largest one in the room. Nor does it say the
      realised signals in any finite room average to $V$; three signals of $760$,
      $815$ and $840$ are perfectly consistent with unbiasedness. Unbiasedness is
      a property of the population of signals, not a guarantee about a
      realisation, and confusing the two is what makes "my estimate is honest, so
      I will bid it" sound reasonable.
    choices:
      - text: >
          Averaged over the noise at a fixed true value, the signal recovers $V$
          — a property of the population of signals, not a promise about any one
          draw.
        correct: true
        feedback: >
          Right, and holding on to that distinction is what lets you accept that
          every estimate in the room is honest while the winning one is
          systematically too high.
      - text: >
          Each bidder's signal equals $V$ up to a small error that becomes
          negligible once enough bidders are in the room.
        feedback: >
          Nothing in the model shrinks an individual error as $n$ grows; adding
          bidders enlarges the *maximum* error, which is precisely the wrong
          direction for a bidder.
      - text: >
          The signals realised in any given room average out to exactly $V$.
        feedback: >
          That would be a statement about a finite sample average; unbiasedness
          is about the expectation, and a room of three signals can average well
          away from $V$.
      - text: >
          The errors are independent across bidders, which is what makes the
          signals unbiased.
        feedback: >
          Independence across bidders is a separate assumption in the model; a
          single signal would be unbiased even with only one bidder in the room.
    rubric:
      - >
        Reads $\mathbb{E}[X_i \mid V] = V$ as an average over the noise at a fixed $V$,
        not as a claim about any realised signal or about a finite room's average.
      - >
        Connects the distinction to bidding: honest estimates and a losing winner are
        perfectly consistent, because the auction selects the extreme draw.
    targets:
      - quant-games.auctions.common-value-model

  # --- the winner's curse -----------------------------------------------------

  - id: qauc-winners-curse-01
    kind: work
    difficulty: demanding
    statement: >
      A commodity lot is worth the same $4400$ dollars to any of the twelve firms
      bidding for it, though none of them knows that number. Each firm sees
      $X_i = V + \varepsilon_i$ with the errors independent and uniform on
      $[-260,260]$, and every firm naively bids its own signal in a *second-price*
      sealed-bid auction. What is the winner's expected profit, in dollars?
    answer: >
      $-180$. Because $V$ is a constant here, the ordering of the signals is the
      ordering of the errors, so the winner is the firm with the largest error
      and the price is the *second*-largest signal,
      $V + \varepsilon_{(2)}$. For $n$ errors uniform on $[-a,a]$ the $k$-th
      largest averages $a(n+1-2k)/(n+1)$, so with $a = 260$, $n = 12$, $k = 2$
      the expected second-largest error is
      $260 \cdot (13 - 4)/13 = 260 \cdot 9/13 = 180$ dollars. The expected price
      is therefore $4400 + 180 = 4580$ dollars and the winner's expected profit
      is $4400 - 4580 = -180$ dollars. The moral is the one the curse always
      carries: moving to a second-price rule softens the loss — it would have
      been $260 \cdot 11/13 = 220$ dollars under first-price — but it does not
      remove it, because the price is still drawn from the top of a selected
      pile. Naive bidding loses money in *either* format; the fix is to shade the
      signal before submitting it, not to change the payment rule.
    expects: "-180"
    rubric:
      - >
        Identifies the price as the second-largest signal, so the relevant order
        statistic is $k = 2$ and not $k = 1$.
      - >
        Uses the centred formula $a(n+1-2k)/(n+1)$ with the full half-width
        $a = 260$ and $n + 1 = 13$.
      - >
        Reports a *negative* expected profit and attributes it to selection — the
        winner is whoever's error ran highest — rather than to biased signals.
    targets:
      - quant-games.auctions.winners-curse
    exercises:
      - quant-games.auctions.common-value-model

  - id: qauc-winners-curse-02
    kind: work
    difficulty: standard
    statement: >
      Five appraisers bid for a shipment whose true worth is $900$ dollars, the
      same for all of them and unknown to all of them. Each appraisal is
      $X_i = 900 + \varepsilon_i$ with the errors independent and uniform on
      $[-72,72]$, and every appraiser bids their own appraisal in a first-price
      sealed-bid auction. What is the expected winning bid, in dollars?
    answer: >
      $948$. The winning bid is the largest of the five appraisals, and since
      $900$ is a constant that is $900$ plus the largest of the five errors. The
      largest of $n$ draws uniform on $[-a,a]$ averages $a(n-1)/(n+1)$, so with
      $a = 72$ and $n = 5$ the expected overshoot is
      $72 \cdot 4/6 = 48$ dollars, and the expected winning bid is
      $900 + 48 = 948$ dollars. Every appraiser in this room is honest and every
      appraisal is unbiased, yet the sale price sits $48$ dollars above the
      truth: the auction never polls the room's average opinion, it selects the
      single most optimistic one. That $48$ dollars is exactly the correction a
      bidder should have subtracted before submitting.
    expects: "948"
    rubric:
      - >
        Takes the winning bid to be the *maximum* signal, so $k = 1$ in the order
        statistic, and adds it to the true value.
      - >
        Uses $a(n-1)/(n+1)$ with $n = 5$ total bidders, not $n - 1 = 4$ rivals,
        and concludes the winner overpays despite unbiased signals.
    targets:
      - quant-games.auctions.winners-curse
    exercises:
      - quant-games.auctions.common-value-model

  - id: qauc-winners-curse-03
    kind: decide
    difficulty: demanding
    statement: >
      The same common-value tract is offered to two rooms with the same signal
      noise: room A holds four bidders, room B holds forty. In both rooms every
      bidder submits their own unbiased estimate. How do the winners' expected
      losses compare?
    answer: >
      The loss is larger in room B. Winning means holding the largest of $n$
      signals, and the expected overshoot of that maximum grows with $n$ — for
      errors uniform on $[-a,a]$ it is $a(n-1)/(n+1)$, rising from
      $a \cdot 3/5 = 0.6a$ at $n = 4$ to $a \cdot 39/41 \approx 0.95a$ at
      $n = 40$, and climbing toward $a$ as the room fills. The tempting opposite
      story — "forty independent estimates average out the noise, so the room is
      collectively wiser" — is true about the *average* of the forty and
      irrelevant, because the auction pays no attention to the average. It
      selects the extreme. This is the sharpest form of the trap: more
      competition on a common-value object is a reason to bid *lower*, not
      higher, and it is the same adverse selection a market maker meets when
      informed flow lifts an offer.
    choices:
      - text: >
          Larger in room B — winning means holding the largest of forty signals
          rather than of four, and the expected overshoot of the maximum grows
          with the number of signals.
        correct: true
        feedback: >
          Right — the correction $a(n-1)/(n+1)$ climbs toward $a$, so a fuller
          room makes the curse worse and calls for a lower bid, not a higher one.
      - text: >
          Smaller in room B — forty independent unbiased estimates average out
          the noise, so the room as a whole is closer to the truth.
        feedback: >
          The room's *average* is indeed more accurate, but the auction never
          charges the average; it charges the top of the pile, and the top of a
          bigger pile is further out.
      - text: >
          The same in both — every signal is unbiased in either room, so the
          expected loss cannot depend on how many bidders there are.
        feedback: >
          Unbiasedness is a property of a typical draw, and the winner is never a
          typical draw; conditioning on being the maximum is exactly what makes
          $n$ matter.
      - text: >
          Larger in room A — with fewer bidders there is less information in the
          room, so the winner is more likely to be badly wrong.
        feedback: >
          Each individual signal has the same accuracy in both rooms; what
          changes with $n$ is how extreme the selected one is, and that gets
          worse as $n$ grows.
    rubric:
      - >
        Compares the expected maximum of $n$ errors across the two rooms, rather than the
        accuracy of an individual estimate, so the answer moves with $n$.
      - >
        Rejects the wisdom-of-the-crowd reading by noting that the auction charges the top
        of the pile and never the average.
    targets:
      - quant-games.auctions.winners-curse

  # --- bid as if your estimate is the highest ---------------------------------

  - id: qauc-bid-as-if-highest-01
    kind: work
    difficulty: demanding
    statement: >
      Six dealers bid for a rare instrument of unknown common value, each seeing
      $X_i = V + \varepsilon_i$ with the errors independent and uniform on
      $[-84,84]$ dollars. Your own signal reads $1330$ dollars. What should you
      bid, after correcting for the winner's curse, in dollars?
    answer: >
      $1270$. Do not bid the signal; bid the value you would assign if you
      already knew your signal were the largest of the six in the room. Under
      this model that means subtracting the expected overshoot of the maximum of
      $n$ errors, which for errors uniform on $[-a,a]$ is $a(n-1)/(n+1)$: here
      $84 \cdot 5/7 = 60$ dollars. So the corrected bid is
      $1330 - 60 = 1270$ dollars. Two guardrails. The $n$ in the formula is the
      total number of signals in the room, six, not the five rivals — the maximum
      being conditioned on runs over your own signal too, and using $n = 5$ would
      give $84 \cdot 4/6 = 56$ and shade too little. And $1270$ only brings
      expected profit conditional on winning to about zero; an equilibrium bid
      shades a little further still, to leave some surplus rather than break even
      on every win.
    expects: "1270"
    rubric:
      - >
        Subtracts $a(n-1)/(n+1)$ from the raw signal rather than bidding the
        signal itself.
      - >
        Uses $n = 6$, the total count of signals including one's own, and not
        $n = 5$ rivals.
      - >
        Notes that the correction merely zeroes expected profit conditional on
        winning, so an equilibrium bid sits a little below it.
    targets:
      - quant-games.auctions.bid-as-if-highest
    exercises:
      - quant-games.auctions.uniform-order-stats
      - quant-games.auctions.winners-curse

  - id: qauc-bid-as-if-highest-02
    kind: work
    difficulty: standard
    statement: >
      Four funds bid for a portfolio of unknown common value, each seeing
      $X_i = V + \varepsilon_i$ with the errors independent and uniform on
      $[-120,120]$ dollars. Your signal reads $3050$ dollars. What is your
      curse-corrected bid, in dollars?
    answer: >
      $2978$. The correction is the expected overshoot of the largest of the four
      signals, $a(n-1)/(n+1) = 120 \cdot 3/5 = 72$ dollars, so the bid is
      $3050 - 72 = 2978$ dollars. Compare that with the six-dealer case: a wider
      error band pushes the correction up, while a smaller room pulls it down,
      and here the wider band wins — $72$ dollars against $60$. Sanity-check the
      direction rather than only the arithmetic: the correction is always
      positive, always below the half-width $a$, and always increasing in $n$, so
      any answer above $3050$ or below $3050 - 120$ is wrong before the number is
      even checked.
    expects: "2978"
    rubric:
      - >
        Applies $a(n-1)/(n+1)$ with $a = 120$ and $n = 4$, getting a correction
        of $72$ dollars.
      - >
        Subtracts rather than adds, and checks the correction lies strictly
        between $0$ and the half-width $120$.
    targets:
      - quant-games.auctions.bid-as-if-highest
    exercises:
      - quant-games.auctions.winners-curse

  - id: qauc-bid-as-if-highest-03
    kind: justify
    difficulty: demanding
    statement: >
      The German-tank estimator *adds* a correction to the largest serial number
      observed, while a common-value bid *subtracts* a correction from the
      largest signal it expects to hold. Explain why the two corrections point in
      opposite directions even though both are repairing the same defect, and say
      what makes the sample maximum a biased object in each case.
    answer: >
      Both are corrections for the predictable bias of a sample maximum, and the
      sign is set by which side of the maximum the truth lies on. In the
      German-tank problem the unknown $N$ is an upper bound: every observed
      serial number is at most $N$, so the sample maximum systematically
      *understates* $N$, missing it by about one average gap, and the estimator
      adds that gap back. In a common-value auction the unknown $V$ is a centre,
      not a bound: signals scatter above and below it with mean-zero errors, so
      the largest of $n$ signals systematically *overstates* $V$ by
      $\mathbb{E}[\max_j \varepsilon_j]$, and the bid subtracts that overshoot.
      The shared structure is that in both problems you never get to use a
      typical draw — the estimator is handed the extreme order statistic, whose
      expectation is displaced from the parameter by a gap that shrinks in the
      tank case and grows in the auction case as $n$ rises. And in the auction
      the conditioning is forced on you by the rules rather than chosen: you only
      pay when you win, and winning is precisely the event that your draw was the
      extreme one.
    rubric:
      - >
        Identifies the common defect: an extreme order statistic is used in place
        of a typical draw, so its expectation is displaced from the parameter.
      - >
        Explains the sign from the geometry — $N$ is an upper bound the maximum
        falls short of, while $V$ is a centre the maximum overshoots.
      - >
        Notes that in the auction the conditioning is imposed by the rules
        (you pay only when you win, and winning means holding the maximum),
        rather than being a modelling choice.
    targets:
      - quant-games.auctions.bid-as-if-highest
      - quant-statistics.estimation.german-tank
    connects:
      - quant-games.auctions.bid-as-if-highest ~ quant-statistics.estimation.german-tank

  # --- the jar of coins -------------------------------------------------------

  - id: qauc-jar-of-coins-01
    kind: work
    difficulty: demanding
    statement: >
      A jar holding exactly $380$ dollars in coins is auctioned first-price
      sealed-bid to a room of $19$ people. Model each guess as
      $X_i = 380 + \varepsilon_i$ with the errors independent and uniform on
      $[-90,90]$ dollars, and suppose every one of them bids their own guess.
      What is the expected winning bid, in dollars?
    answer: >
      $461$. The winning bid is the largest of the nineteen guesses, which is
      $380$ plus the largest of the nineteen errors. For errors uniform on
      $[-a,a]$ the expected maximum is $a(n-1)/(n+1)$, so here
      $90 \cdot 18/20 = 81$ dollars, and the expected winning bid is
      $380 + 81 = 461$ dollars. The room is collectively right — the guesses
      average $380$ — and the winner still pays $81$ dollars too much, which is
      the whole lesson of the jar: the auction does not poll the room's opinion,
      it selects the largest error in it. Note also what has *not* been assumed.
      Nobody here is careless or biased; the loss falls out of the selection
      alone, and it would fall out just as surely from a room of professional
      appraisers.
    expects: "461"
    rubric:
      - >
        Recognises the winning bid as the maximum of the guesses and uses the
        maximum's expectation $a(n-1)/(n+1)$ with $n = 19$.
      - >
        Adds the overshoot to the true total rather than reporting the overshoot
        alone, and names the selection effect rather than blaming careless
        guessing.
    targets:
      - quant-games.auctions.jar-of-coins
    exercises:
      - quant-games.auctions.bid-as-if-highest
      - quant-games.auctions.winners-curse

  - id: qauc-jar-of-coins-02
    kind: work
    difficulty: standard
    statement: >
      A jar of coins of unknown total is auctioned to a room of $11$ bidders,
      each of whom forms an unbiased guess with error uniform on $[-72,72]$
      dollars. Your own guess reads $705$ dollars. What should you bid, in
      dollars?
    answer: >
      $645$. Recognise the setup first: this is a common-value auction with
      eleven signals, not an estimation exercise, so the answer is not your
      guess. The correction is the expected overshoot of the largest of the
      eleven errors, $a(n-1)/(n+1) = 72 \cdot 10/12 = 60$ dollars, so the bid is
      $705 - 60 = 645$ dollars. Answering $705$ — "my best guess" — is exactly
      the naive response the jar question is built to expose, because that bid
      wins precisely on the occasions when it was the most inflated guess in the
      room. Note that the jar's true total never entered the calculation and does
      not need to: the correction depends only on the spread of the guesses and
      the size of the room.
    expects: "645"
    rubric:
      - >
        Names the setup as common-value with $n$ signals before computing, rather
        than treating it as a pure estimation question.
      - >
        Subtracts $a(n-1)/(n+1)$ with $a = 72$ and $n = 11$ from the raw guess,
        and does not need the jar's true total to do it.
    targets:
      - quant-games.auctions.jar-of-coins
    exercises:
      - quant-games.auctions.bid-as-if-highest

  # --- acquiring a company ----------------------------------------------------

  - id: qauc-acquire-a-company-01
    kind: work
    difficulty: demanding
    statement: >
      A firm's value $T$ to its current owner is uniform on $[0,300]$ dollars.
      The owner observes $T$ and accepts a bid $b$ exactly when $T \le b$; you
      observe nothing. Under your management the firm would be worth $2.4T$. What
      bid maximises your expected profit, in dollars?
    answer: >
      $300$. Write the expectation honestly, including the chance that nothing
      happens. For $0 \le b \le 300$ the owner accepts with probability
      $b/300$, and conditional on acceptance $T$ is uniform on $[0,b]$ with mean
      $b/2$, so the firm you acquire is worth $2.4 \cdot b/2 = 1.2b$ against a
      price of $b$. Expected profit is therefore
      $(b/300)(1.2b - b) = 0.2b^{2}/300$, which increases in $b$, so the best bid
      in that range is the top of it, $b = 300$, worth
      $0.2 \cdot 300 = 60$ dollars. Bidding above $300$ only wastes money:
      acceptance is then certain, $\mathbb{E}[T] = 150$, and profit is
      $360 - b$, falling away from $60$. So the optimum is the corner $b = 300$.
      The structure is the point. Conditioning on acceptance halves the expected
      value you are buying, so a multiplier of $m$ is really a multiplier of
      $m/2$ once the selection is priced in; here $2.4/2 = 1.2 > 1$ and bidding
      aggressively pays, while any $m$ below $2$ makes every positive bid a loser
      and the correct bid $0$.
    expects: "300"
    rubric:
      - >
        Multiplies the conditional profit by the acceptance probability $b/300$
        rather than optimising the conditional profit alone.
      - >
        Uses $\mathbb{E}[T \mid T \le b] = b/2$, not the unconditional
        $\mathbb{E}[T] = 150$.
      - >
        Recognises the objective is increasing on $[0,300]$ and checks the region
        $b > 300$ before declaring the corner $b = 300$ optimal.
    targets:
      - quant-games.auctions.acquire-a-company
    exercises:
      - quant-games.auctions.winners-curse

  - id: qauc-acquire-a-company-02
    kind: work
    difficulty: standard
    statement: >
      A target firm's value $T$ to its owner is uniform on $[0,80]$ dollars, and
      the owner accepts a bid $b$ exactly when $T \le b$. Under your management
      the firm would be worth $1.4T$. You bid $b = 50$ dollars. Conditional on
      the owner accepting, what is your expected profit, in dollars?
    answer: >
      $-15$. Acceptance is the event $T \le 50$, and conditional on it $T$ is
      uniform on $[0,50]$ with mean $25$ dollars. So the firm you actually buy is
      worth $1.4 \cdot 25 = 35$ dollars under your management, while you paid
      $50$: expected profit $35 - 50 = -15$ dollars. Contrast the reasoning the
      question is built to catch. Unconditionally $\mathbb{E}[T] = 40$, the firm
      would look worth $1.4 \cdot 40 = 56$ dollars to you, and a bid of $50$
      would look like a $6$-dollar bargain. That calculation prices a firm you
      were handed at random; you are not handed one at random, you are sold one
      by somebody who has seen $T$ and only agrees when it is low. The selection
      costs you exactly a factor of two in expected value, and with a multiplier
      of $1.4 < 2$ no positive bid survives it.
    expects: "-15"
    rubric:
      - >
        Uses $\mathbb{E}[T \mid T \le b] = b/2 = 25$, not the unconditional mean
        of $40$.
      - >
        Names the trap explicitly — the trade happens only when the informed side
        agrees, so the unconditional valuation is the wrong input.
    targets:
      - quant-games.auctions.acquire-a-company
    exercises:
      - quant-games.auctions.winners-curse

  - id: qauc-acquire-a-company-03
    kind: justify
    difficulty: demanding
    statement: >
      In the acquisition problem the fair value of the firm to you, computed
      before anything happens, is a perfectly good number — and it is the wrong
      number to bid. Explain what the fair value of a game prices, why an offer
      to an informed counterparty prices something else, and what the correct
      object is. Say what would have to change for the two to coincide.
    answer: >
      Fair value prices a game you have already been handed: it is the
      expectation over everything that can happen, on the assumption you are
      playing every branch of it. Under a uniform $T$ with multiplier $m$ the
      fair value of owning the firm is $m \cdot \mathbb{E}[T]$, and that is the
      right price if the firm arrives whatever $T$ turns out to be. A bid is not
      that. It is an offer the informed owner may decline, and the owner declines
      exactly on the branches where $T$ is high — so the object you actually buy
      is the firm *conditional on acceptance*, $T \le b$, whose mean is $b/2$
      rather than $\mathbb{E}[T]$. The correct object is therefore
      $\mathbb{E}[mT - b \mid T \le b]$, which equals $(m/2 - 1)b$, and the whole
      difference between the two answers is that one conditions on the trade
      happening and the other does not. They coincide only when acceptance
      carries no information about $T$ — an owner who accepts for reasons
      unrelated to value, or a bid above the top of $T$'s support, where every
      type accepts and the conditioning event is the whole space. Any structure
      that makes the counterparty's agreement a signal breaks the identification,
      which is the same reason a market maker cannot quote a fair value and stand
      there.
    rubric:
      - >
        States what fair value prices — the unconditional expectation of a game
        you are playing in full — and computes it for this model.
      - >
        Identifies acceptance as an informative event and replaces
        $\mathbb{E}[T]$ with $\mathbb{E}[T \mid T \le b] = b/2$, giving profit
        $(m/2 - 1)b$.
      - >
        Names a condition under which the two agree — acceptance independent of
        $T$, or a bid above the support so that every type accepts.
    targets:
      - quant-games.auctions.acquire-a-company
      - quant-games.ev-games.fair-value
    connects:
      - quant-games.auctions.acquire-a-company ~ quant-games.ev-games.fair-value

  # --- more bidders cuts both ways --------------------------------------------

  - id: qauc-more-bidders-01
    kind: work
    difficulty: demanding
    statement: >
      Values are independent and uniform on $[0,1]$, bidders are risk-neutral and
      symmetric, and there is no reserve. By how much does the seller's expected
      revenue rise when the room grows from three bidders to eight? Give an exact
      fraction.
    answer: >
      $5/18$. Expected revenue with $n$ symmetric IPV bidders on $[0,1]$ is
      $(n-1)/(n+1)$, whichever efficient format is used. At $n = 3$ that is
      $2/4 = 1/2$; at $n = 8$ it is $7/9$. The increase is
      $7/9 - 1/2 = (14 - 9)/18 = 5/18 \approx 0.278$. The mechanism behind the
      rise is worth stating, because it is exactly what flips under common
      values: with more rivals a bidder can shade less — the equilibrium bid
      $(n-1)v/n$ climbs from $2v/3$ to $7v/8$ here — and the winning value itself
      is drawn from a larger sample, so both effects push the price up. Note the
      diminishing returns as well: revenue is bounded by $1$ and approaches it
      slowly, so the seller's fifth extra bidder is worth far less than the
      first.
    expects: "5/18"
    rubric:
      - >
        Uses the revenue formula $(n-1)/(n+1)$ at both $n$ values rather than the
        shading factor $(n-1)/n$.
      - >
        Subtracts exactly, giving $5/18$, and explains the direction — a fuller
        room means less shading under private values.
    targets:
      - quant-games.auctions.more-bidders
    exercises:
      - quant-games.auctions.shading
      - quant-games.auctions.uniform-order-stats

  - id: qauc-more-bidders-02
    kind: decide
    difficulty: standard
    statement: >
      You hold a signal for a common-value mineral tract, with signal errors
      independent and uniform on $[-45,45]$ dollars. The room, which you had
      expected to hold five bidders, turns out to hold fourteen. Which way does
      your bid move, and by how much?
    answer: >
      Down by $9$ dollars. The curse correction is the expected overshoot of the
      largest of $n$ signal errors, $a(n-1)/(n+1)$. At $n = 5$ that is
      $45 \cdot 4/6 = 30$ dollars; at $n = 14$ it is
      $45 \cdot 13/15 = 39$ dollars. The bid is the signal minus that correction,
      so a larger room means a *lower* bid, down by $39 - 30 = 9$ dollars. The
      reflex being tested is "more competition, so bid up", which is right under
      private values — there the equilibrium bid $(n-1)v/n$ climbs toward $v$ —
      and exactly backwards here. The distinction is the value model and nothing
      else: with private values extra rivals only squeeze your margin, while with
      common values extra rivals also make the news contained in winning worse.
    choices:
      - text: >
          Down by $9$ dollars — the correction rises from $45 \cdot 4/6 = 30$ to
          $45 \cdot 13/15 = 39$ dollars as the room grows.
        correct: true
        feedback: >
          Right — a fuller room means the winning signal is a more extreme
          overshoot, so more of the raw estimate has to be shaded off.
      - text: >
          Up by $9$ dollars — more competition means you must bid closer to your
          own estimate to have any chance of winning.
        feedback: >
          That is the private-values reflex; on a common-value object the extra
          rivals worsen the selection, and bidding up is precisely how the curse
          gets you.
      - text: >
          Unchanged — the signals are unbiased whatever the size of the room, so
          the number of bidders does not enter the bid.
        feedback: >
          Unbiasedness of a typical signal is not the issue; the bid is built
          from the expected maximum of $n$ errors, which depends on $n$ directly.
    rubric:
      - >
        Computes $a(n-1)/(n+1)$ at both room sizes and subtracts, rather than arguing the
        direction from intuition alone.
      - >
        Names the private-values reflex as the trap and says the value model is the only
        thing that decides the sign.
    targets:
      - quant-games.auctions.more-bidders
    exercises:
      - quant-games.auctions.winners-curse
