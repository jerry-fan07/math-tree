# Problems targeting quant-games.kelly — bet sizing as log-wealth optimization.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's instance. Bankrolls are written as bare numbers
# with the word "dollars", never a currency sign. Where an answer is a rounded
# decimal the problem states the logarithms it needs and carries a matching
# absolute `tolerance`. See ../README.md.

problems:
  # --- fixed-fraction betting -------------------------------------------------

  - id: qkelly-fixed-fraction-01
    kind: work
    difficulty: demanding
    statement: >
      You start with a bankroll of $250$ dollars and stake the same fraction
      $f = 0.4$ of your *current* bankroll on an even-money bet, round after
      round. Over five rounds you win three and lose two. What is the bankroll
      at the end, in dollars?
    answer: >
      $246.96$. Under fixed-fraction betting each round multiplies the bankroll
      rather than adding to it: a win at even money multiplies by
      $1 + f = 1.4$, a loss by $1 - f = 0.6$. Wealth is the product
      $W_5 = 250 \times (1.4)^{3} \times (0.6)^{2}$, and because multiplication
      commutes the order of the wins and losses is irrelevant — only the counts
      matter. Compute: $(1.4)^{3} = 2.744$, $(0.6)^{2} = 0.36$, and
      $2.744 \times 0.36 = 0.98784$, so $W_5 = 250 \times 0.98784 = 246.96$
      dollars. The point worth carrying away is the sign: you won a majority of
      the rounds and still finished *below* where you started, because a $40\%$
      stake gains $40\%$ on a win but the compounding factor $1.4 \times 0.6 =
      0.84$ for a win-loss pair is a $16\%$ loss. A fixed *stake* of $100$
      dollars would have ended at $250 + 300 - 200 = 350$ dollars; the product
      and the sum are different animals.
    expects: "246.96"
    tolerance: 0.005
    rubric:
      - >
        Multiplies by $1 + f = 1.4$ on each win and $1 - f = 0.6$ on each loss,
        rather than adding and subtracting a fixed dollar stake.
      - >
        Recognises that only the counts of wins and losses matter, so the
        answer is $250 (1.4)^{3} (0.6)^{2}$ regardless of the order.
    targets:
      - quant-games.kelly.fixed-fraction

  - id: qkelly-fixed-fraction-02
    kind: work
    difficulty: standard
    statement: >
      A bet pays $4$ to $1$ and you stake $f = 0.25$ of the current bankroll
      every round, starting from $800$ dollars. The first four rounds go win,
      loss, loss, win. What is the bankroll after the fourth round, in dollars?
    answer: >
      $1800$. For a bet at odds of $b$ to $1$, a win multiplies the bankroll by
      $1 + bf = 1 + 4(0.25) = 2$ and a loss multiplies it by
      $1 - f = 0.75$. Walk the sequence: $800 \to 1600$ on the win,
      $1600 \to 1200$ on the first loss, $1200 \to 900$ on the second, and
      $900 \to 1800$ on the final win. Equivalently
      $800 \times 2^{2} \times (0.75)^{2} = 800 \times 4 \times 0.5625 = 1800$
      dollars. The stake is recomputed every round off what is actually left —
      the fourth round risked $0.25 \times 900 = 225$ dollars, not the $200$
      dollars the opening bankroll would have suggested.
    expects: "1800"
    rubric:
      - >
        Uses the win multiplier $1 + bf = 2$, not $1 + f$ — the odds $b$ enter
        the winning factor and not the losing one.
      - >
        Recomputes the stake off the current bankroll each round rather than
        off the starting $800$ dollars.
    targets:
      - quant-games.kelly.fixed-fraction

  # --- long-run growth is expected log wealth ---------------------------------

  - id: qkelly-log-growth-01
    kind: work
    difficulty: demanding
    statement: >
      A bet pays $2$ to $1$ and wins with probability $0.45$; you stake
      $f = 0.15$ of the bankroll every round. What is the almost-sure growth
      rate $g(f) = \mathbb{E}[\ln(1 + fX)]$ per round, to four decimal places?
      Use $\ln 1.3 = 0.262364$ and $\ln 0.85 = -0.162519$.
    answer: >
      $0.0287$. The bet has two outcomes, so the expectation is a two-term sum.
      A win multiplies the bankroll by $1 + bf = 1 + 2(0.15) = 1.3$ and a loss
      by $1 - f = 0.85$, so
      $g(0.15) = 0.45\ln 1.3 + 0.55\ln 0.85$. Substituting,
      $0.45(0.262364) = 0.118064$ and $0.55(-0.162519) = -0.089386$, and the
      sum is $0.028679$, or $0.0287$ to four places. Read what this number is:
      the strong law makes $\frac{1}{n}\ln(W_n/W_0)$ converge almost surely to
      it, so $W_n \approx W_0 e^{0.0287 n}$ — about $2.9\%$ compound growth per
      round, not per bet placed. The trap is averaging the multipliers instead
      of their logarithms: $0.45(1.3) + 0.55(0.85) = 1.0525$ suggests $5.25\%$
      a round, and that arithmetic mean is a number no bankroll ever reaches,
      because compounding takes the geometric mean.
    expects: "0.0287"
    tolerance: 0.00005
    rubric:
      - >
        Takes the logarithm inside the expectation — $p\ln(1+bf) + q\ln(1-f)$ —
        rather than the logarithm of the expected multiplier.
      - >
        Builds the multipliers correctly, $1 + 2(0.15) = 1.3$ on a win and
        $1 - 0.15 = 0.85$ on a loss.
    targets:
      - quant-games.kelly.log-growth
    exercises:
      - quant-games.kelly.fixed-fraction

  - id: qkelly-log-growth-02
    kind: work
    difficulty: standard
    statement: >
      A repeated bet is sized so that its almost-sure growth rate is
      $g = 0.025$ per round. Using $W_n \approx W_0 e^{n g}$, how many rounds
      does the bankroll take to double? Use $\ln 2 = 0.6931$.
    answer: >
      About $27.72$ rounds. Doubling means $W_n / W_0 = 2$, so
      $e^{n g} = 2$, so $n g = \ln 2$ and $n = \ln 2 / g = 0.6931 / 0.025 =
      27.724$. That is the whole practical use of the growth rate: it converts
      a per-round number into a doubling time the same way a continuously
      compounded interest rate does, and a strategy with twice the growth rate
      doubles in half the rounds. Note what the almost-sure statement licenses
      and what it does not — the bankroll does not double *on* round $28$, it
      is that the exponential trend line crosses double there, and the actual
      path oscillates around it. The trap is treating $0.025$ as a simple
      per-round percentage and answering $1/0.025 = 40$ rounds, which is the
      time to gain one bankroll additively rather than to double
      multiplicatively.
    expects: "27.72"
    tolerance: 0.01
    rubric:
      - >
        Sets $e^{ng} = 2$ and solves $n = \ln 2 / g$, rather than dividing $1$
        by the growth rate.
      - >
        Reports the doubling time as a property of the almost-sure exponential
        trend, not a guarantee about one particular round.
    targets:
      - quant-games.kelly.log-growth

  - id: qkelly-log-growth-03
    kind: decide
    difficulty: standard
    statement: >
      A candidate is asked what quantity the Kelly stake actually maximises,
      once wealth is reinvested in full round after round. Which answer is
      right?
    choices:
      - text: >
          The expected wealth $\mathbb{E}[W_n]$ after $n$ rounds.
        feedback: >
          No — that is the arithmetic mean of a product, and it is maximised by
          staking the entire bankroll. Kelly deliberately maximises something
          else.
      - text: >
          The expected log wealth $\mathbb{E}[\ln(1 + fX)]$ per round, which is
          the almost-sure exponential growth rate of the bankroll and the
          geometric mean of the round multipliers.
        correct: true
        feedback: >
          Right. Taking logarithms turns the product into a sum of iid terms,
          the strong law hands you a deterministic per-round rate, and that
          rate is what one bettor needs to beat another eventually with
          probability $1$.
      - text: >
          The probability of finishing a fixed number of rounds with a profit.
        feedback: >
          No — that objective is maximised by staking almost nothing, since a
          tiny stake makes a small gain nearly certain. Kelly would then never
          recommend a substantial bet.
      - text: >
          The wealth reached on the single most favourable sequence of
          outcomes.
        feedback: >
          No — that is the all-wins path, and it is exactly what
          expected-wealth maximisation chases. Kelly prices that path at its
          probability, not at its size.
    answer: >
      Expected log wealth. The chain is short and worth reciting: fixed-fraction
      betting makes $W_n = W_0 \prod_{i=1}^{n}(1 + fX_i)$, taking logarithms
      turns that product into $\ln(W_n/W_0) = \sum_{i=1}^{n} \ln(1 + fX_i)$, a
      sum of iid terms, and the strong law says the per-round average converges
      almost surely to $g(f) = \mathbb{E}[\ln(1 + fX)]$. So
      $W_n \approx W_0 e^{n g(f)}$ and the whole of long-run performance is
      compressed into that one number. Maximising $g$ is therefore maximising
      the geometric mean of the round multipliers, and a strategy with the
      larger $g$ overtakes any rival eventually with probability $1$ — a much
      stronger promise than any statement about $\mathbb{E}[W_n]$, which is an
      average over paths almost none of which you will walk.
    rubric:
      - >
        Names expected log wealth, equivalently the almost-sure growth rate or
        the geometric mean of the multipliers, as the maximised objective.
      - >
        Explains why the logarithm is the right transform — it turns the
        product into a sum a law of large numbers governs.
    targets:
      - quant-games.kelly.log-growth

  # --- expected wealth is the wrong objective ---------------------------------

  - id: qkelly-ev-vs-growth-01
    kind: work
    difficulty: demanding
    statement: >
      A bet pays $3$ to $1$ and wins with probability $0.35$. A gambler stakes
      the *entire* bankroll on it, six rounds in a row. By what multiple does
      the calculation $\mathbb{E}[W_n] = W_0 (1 + f\mu)^{n}$ say the expected
      bankroll grows over those six rounds? Give the multiple to four decimal
      places.
    answer: >
      $7.5295$. First get the per-unit mean profit: $X = 3$ with probability
      $0.35$ and $X = -1$ with probability $0.65$, so
      $\mu = 3(0.35) - 0.65 = 1.05 - 0.65 = 0.4$. With $f = 1$ each round has
      expected multiplier $1 + f\mu = 1.4$, and since the rounds are
      independent the expectations multiply:
      $\mathbb{E}[W_6]/W_0 = (1.4)^{6} = 7.5295$. Now look at what that number
      is made of. Staking everything means one loss ends the game at zero, so
      the bankroll is non-zero after six rounds only if all six win, which has
      probability $(0.35)^{6} \approx 0.0018$ — under $1$ chance in $500$. The
      entire expectation of $7.53$ is carried by that path, where wealth is
      $4^{6} = 4096$ times the start; every other path contributes exactly
      nothing. Two traps to name: $\mu$ is the profit per unit staked, $0.4$,
      not the win probability $0.35$ and not the payoff $3$; and an expectation
      this large is a fact about an average over paths, not about the bankroll
      you will actually be holding.
    expects: "7.5295"
    tolerance: 0.0005
    rubric:
      - >
        Computes $\mu = bp - q = 0.4$ as the expected profit per unit staked,
        not $p$, $b$, or $bp$.
      - >
        Uses the independence of rounds to multiply the per-round expected
        multiplier, giving $(1.4)^{6}$.
      - >
        Contrasts the expectation with the survival probability $(0.35)^{6}$,
        so the huge mean is identified as one path's contribution.
    targets:
      - quant-games.kelly.ev-vs-growth
    exercises:
      - quant-games.kelly.fixed-fraction

  - id: qkelly-ev-vs-growth-02
    kind: work
    difficulty: standard
    statement: >
      A bet pays $2$ to $1$ and wins with probability $0.5$, and a trader
      stakes the whole bankroll on it eight times running. What is
      $\mathbb{E}[W_8]/W_0$, to four decimal places?
    answer: >
      $25.6289$. The per-unit mean is $\mu = 2(0.5) - 0.5 = 0.5$, so with
      $f = 1$ the expected multiplier per round is $1.5$ and independence gives
      $\mathbb{E}[W_8]/W_0 = (1.5)^{8} = 25.6289$. Set that beside the actual
      distribution: the bankroll is non-zero after eight rounds only on the
      all-wins path, probability $(0.5)^{8} = 1/256 \approx 0.0039$, and on
      that path wealth is $3^{8} = 6561$ times the start. So more than $99.6\%$
      of the time this trader is wiped out, and the expectation of $25.6$ is
      manufactured by the $0.4\%$ where they are not. Expectation is the wrong
      functional under compounding because a product is hostage to its worst
      factor, and a factor of zero is permanent — which is exactly the defect
      the logarithm repairs by pricing ruin at $-\infty$.
    expects: "25.6289"
    tolerance: 0.0005
    rubric:
      - >
        Gets $\mu = bp - q = 0.5$ and raises $1 + \mu = 1.5$ to the eighth
        power.
      - >
        Notes that survival requires all eight wins, probability $(0.5)^{8}$,
        so the mean describes a path almost never taken.
    targets:
      - quant-games.kelly.ev-vs-growth

  # --- the growth function of a binary bet ------------------------------------

  - id: qkelly-growth-function-01
    kind: work
    difficulty: demanding
    statement: >
      A bet pays $5$ to $1$ and wins with probability $0.2$, and a bettor
      stakes $f = 0.10$ of the bankroll each round. Evaluate
      $g(f) = p\ln(1 + bf) + q\ln(1 - f)$ at that stake, to four decimal
      places. Use $\ln 1.5 = 0.405465$ and $\ln 0.9 = -0.105361$.
    answer: >
      $-0.0032$. A win multiplies by $1 + bf = 1 + 5(0.10) = 1.5$ and a loss by
      $1 - f = 0.9$, so
      $g(0.10) = 0.2\ln 1.5 + 0.8\ln 0.9 = 0.2(0.405465) + 0.8(-0.105361)
      = 0.081093 - 0.084289 = -0.003195$, which is $-0.0032$ to four places.
      The bet itself is favourable: the origin slope is
      $g'(0) = pb - q = 5(0.2) - 0.8 = 0.2$, a $20\%$ expected profit per unit
      staked, so $g$ rises out of $g(0) = 0$ and some positive stake does help.
      What has happened is that $0.10$ is past the hump — $g$ is strictly
      concave, since
      $g''(f) = -\frac{pb^{2}}{(1+bf)^{2}} - \frac{q}{(1-f)^{2}} < 0$
      everywhere, so it climbs to a single peak and then falls, crossing back
      through zero. Positive expectation per bet and negative growth per round
      are perfectly compatible, and the gap between them is the whole reason
      this unit exists.
    expects: "-0.0032"
    tolerance: 0.00005
    rubric:
      - >
        Assembles $g(f) = p\ln(1+bf) + q\ln(1-f)$ with the right multipliers,
        $1.5$ on a win and $0.9$ on a loss.
      - >
        Reconciles the negative growth with the positive origin slope
        $pb - q = 0.2$ by appealing to strict concavity — the stake is past the
        peak, not the edge being negative.
    targets:
      - quant-games.kelly.growth-function
    exercises:
      - quant-games.kelly.log-growth

  - id: qkelly-growth-function-02
    kind: work
    difficulty: standard
    statement: >
      A bet pays $3$ to $1$ and wins with probability $0.45$. Using
      $g'(f) = \frac{pb}{1 + bf} - \frac{q}{1 - f}$, what is the slope of the
      growth function at $f = 0.2$?
    answer: >
      $0.15625$. Substitute $p = 0.45$, $q = 0.55$, $b = 3$ and $f = 0.2$:
      the winning term is $\frac{0.45(3)}{1 + 3(0.2)} = \frac{1.35}{1.6} =
      0.84375$ and the losing term is $\frac{0.55}{1 - 0.2} = \frac{0.55}{0.8}
      = 0.6875$, so $g'(0.2) = 0.84375 - 0.6875 = 0.15625$. The sign is the
      information: the slope is still positive at $f = 0.2$, so growth is still
      increasing there and the optimum lies further out — indeed
      $f^{*} = (bp - q)/b = (1.35 - 0.55)/3 = 0.2667$. Compare the slope at the
      origin, $g'(0) = pb - q = 0.8$: the marginal value of an extra unit of
      stake has already fallen to about a fifth of what the first unit was
      worth, which is concavity showing up as a shrinking derivative rather
      than as a shape you have to draw.
    expects: "0.15625"
    rubric:
      - >
        Substitutes into $g'(f) = pb/(1+bf) - q/(1-f)$ correctly, keeping $b$
        in the numerator of the winning term as well as the denominator.
      - >
        Reads the positive sign as saying the optimal stake is larger than
        $0.2$.
    targets:
      - quant-games.kelly.growth-function

  # --- the Kelly criterion ----------------------------------------------------

  - id: qkelly-kelly-fraction-01
    kind: work
    difficulty: demanding
    statement: >
      A bet pays $3$ to $1$ and wins with probability $0.6$, and you can repeat
      it as often as you like with divisible stakes and full reinvestment. What
      fraction of the bankroll maximises the long-run growth rate? Give the
      answer as an exact fraction.
    answer: >
      $7/15$. Check the edge first: $bp = 3(0.6) = 1.8$ exceeds $q = 0.4$, so
      betting helps and the optimum is interior. Then
      $f^{*} = \frac{bp - q}{b} = \frac{1.8 - 0.4}{3} = \frac{1.4}{3} =
      \frac{7}{15} \approx 0.4667$ — a striking $46.7\%$ of the bankroll,
      because a $3$-to-$1$ payoff on a bet you win more often than not is an
      enormous edge. The derivation is worth keeping in the hand: set
      $g'(f) = \frac{pb}{1+bf} - \frac{q}{1-f} = 0$, cross-multiply to
      $pb(1 - f) = q(1 + bf)$, expand to $pb - pbf = q + qbf$, and collect
      $pb - q = bf(p + q) = bf$, so $f^{*} = (bp - q)/b$. Two traps: the
      numerator $bp - q = 1.4$ is the *edge*, not the fraction, and answering
      $1.4$ would have you staking more than the bankroll; and $p - q = 0.2$ is
      the even-money answer, which ignores that the payoff here is three times
      the stake.
    expects: "7/15"
    rubric:
      - >
        Verifies $bp > q$ before using the interior formula.
      - >
        Divides the edge $bp - q$ by the odds $b$, giving $1.4/3 = 7/15$,
        rather than reporting the edge itself or the even-money $p - q$.
    targets:
      - quant-games.kelly.kelly-fraction
    exercises:
      - quant-games.kelly.growth-function

  - id: qkelly-kelly-fraction-02
    kind: work
    difficulty: standard
    statement: >
      A bet pays $6$ to $1$ and wins with probability $0.2$. What is the Kelly
      fraction? Give the answer as an exact fraction.
    answer: >
      $1/15$. The edge is $bp - q = 6(0.2) - 0.8 = 1.2 - 0.8 = 0.4$, which is
      positive, so $bp > q$ and the optimum is interior. Divide by the odds:
      $f^{*} = 0.4/6 = 1/15 \approx 0.0667$, so about $6.7\%$ of the bankroll.
      The edge is a healthy $40\%$ expected profit per unit staked, and yet the
      stake is tiny — the long payoff means a loss is the likely outcome of any
      single round, four times in five, and the growth rate cannot tolerate
      that many multiplications by $1 - f$ at a large $f$. Had the same $40\%$
      edge come at even money, the formula would have prescribed $0.4$ of the
      bankroll, six times as much.
    expects: "1/15"
    rubric:
      - >
        Computes the edge $bp - q = 0.4$ and confirms it is positive.
      - >
        Divides by $b = 6$ rather than by $b + 1 = 7$ or reporting the edge.
    targets:
      - quant-games.kelly.kelly-fraction

  - id: qkelly-kelly-fraction-03
    kind: justify
    difficulty: demanding
    statement: >
      Derive the Kelly fraction $f^{*} = (bp - q)/b$ from the growth function
      $g(f) = p\ln(1 + bf) + q\ln(1 - f)$, and explain what licenses you to
      call the stationary point you find the *global* maximum over $0 \le f
      < 1$ without evaluating $g$ anywhere else.
    answer: >
      Differentiate: $g'(f) = \frac{pb}{1 + bf} - \frac{q}{1 - f}$, which reads
      as the marginal log gain from a win against the marginal log loss from a
      loss. Set it to zero, so $pb(1 - f) = q(1 + bf)$; expand to
      $pb - pbf = q + qbf$; collect the $f$ terms, $pb - q = bf(p + q) = bf$
      since $p + q = 1$; hence $f^{*} = (bp - q)/b = p - q/b$. Now the
      promotion to a global maximum. The second derivative is
      $g''(f) = -\frac{pb^{2}}{(1 + bf)^{2}} - \frac{q}{(1 - f)^{2}}$, a sum of
      two strictly negative terms for every $f$ in the domain, so $g$ is
      *strictly* concave there. A strictly concave function on an interval has
      at most one stationary point, and any stationary point of a concave
      function is a global maximum — so finding one is finding the answer, and
      no comparison with other values of $f$ is needed. Concavity also settles
      the boundary case: if $bp \le q$ then $g'(0) = pb - q \le 0$, so $g$ is
      non-increasing from the start and the maximum over $[0, 1)$ sits at the
      endpoint $f^{*} = 0$ — no edge, no bet. Finally, the domain matters:
      $g(f) \to -\infty$ as $f \to 1$, which is why no interior maximum can be
      lost to the right-hand end.
    rubric:
      - >
        Sets $g'(f) = 0$ and carries the algebra through to
        $f^{*} = (bp - q)/b$, using $p + q = 1$ to collect the $f$ terms.
      - >
        Computes $g''(f) < 0$ and invokes strict concavity — a stationary point
        of a concave function is the unique global maximum — rather than
        checking sample values.
      - >
        Handles the no-edge case separately, noting that $bp \le q$ pushes the
        maximum to the endpoint $f = 0$.
    targets:
      - quant-games.kelly.kelly-fraction
    exercises:
      - quant-games.kelly.growth-function
      - quant-tools.optimization.foc

  # --- edge over odds ---------------------------------------------------------

  - id: qkelly-edge-over-odds-01
    kind: work
    difficulty: demanding
    statement: >
      A bookmaker quotes a horse at $11$ to $4$ — a winning stake of $4$
      returns a profit of $11$ — and your model puts its win probability at
      $0.42$. What fraction of the bankroll does Kelly stake? Give the answer
      as an exact fraction.
    answer: >
      $23/110$. Fractional odds of $11$ to $4$ mean $b = 11/4 = 2.75$ in profit
      per unit staked. The edge is
      $bp - q = 2.75(0.42) - 0.58 = 1.155 - 0.58 = 0.575$, and edge over odds
      gives $f^{*} = 0.575/2.75 = 575/2750 = 23/110 \approx 0.2091$, so about
      $20.9\%$ of the bankroll. The trap this problem exists for is the
      denominator. Bookmakers also quote *decimal* odds, which for this horse
      are $b + 1 = 3.75$ — the total return per unit, stake included — and
      dividing the edge by $3.75$ gives $0.1533$, a materially smaller stake
      that is simply wrong. Kelly divides by the net odds $b$, the profit, not
      by the gross return. A useful check on the arithmetic: $f^{*} = p - q/b =
      0.42 - 0.58/2.75 = 0.42 - 0.2109 = 0.2091$, the same number by the other
      reading of the formula.
    expects: "23/110"
    rubric:
      - >
        Converts the quoted $11$ to $4$ into net odds $b = 2.75$, profit per
        unit staked.
      - >
        Divides the edge by $b = 2.75$ and not by the decimal odds
        $b + 1 = 3.75$, naming that as the trap.
    targets:
      - quant-games.kelly.edge-over-odds

  - id: qkelly-edge-over-odds-02
    kind: work
    difficulty: standard
    statement: >
      A long shot pays $19$ to $1$ and your estimate of its win probability is
      $0.08$. What is the Kelly fraction? Give the answer as an exact fraction.
    answer: >
      $3/95$. The edge is $bp - q = 19(0.08) - 0.92 = 1.52 - 0.92 = 0.6$ — a
      $60\%$ expected profit on every unit staked, which is a huge edge by any
      standard. Dividing by the odds gives
      $f^{*} = 0.6/19 = 3/95 \approx 0.0316$, barely over $3\%$ of the
      bankroll. That is the corollary's whole content read in one instance: bet
      more as the edge grows, *less* as the odds lengthen, and the two effects
      pull against each other here with the denominator winning easily. The
      reason is not timidity but arithmetic — you lose $92\%$ of the time, so
      the factor $1 - f$ is applied again and again, and only a small $f$ keeps
      that erosion below the rare $1 + 19f$ payoff. Notice too that the
      bankroll never entered the calculation; the rule is scale-free.
    expects: "3/95"
    rubric:
      - >
        Computes the edge $bp - q = 0.6$ and divides by $b = 19$.
      - >
        Explains that the long odds, not a small edge, are what shrink the
        stake.
    targets:
      - quant-games.kelly.edge-over-odds

  # --- the coin example -------------------------------------------------------

  - id: qkelly-coin-example-01
    kind: work
    difficulty: demanding
    statement: >
      A biased coin comes up heads with probability $0.62$, pays even money,
      and you may bet on it as often as you like. Staking the Kelly fraction
      every toss, what is the growth rate per toss, to four decimal places? Use
      $\ln 1.24 = 0.215111$ and $\ln 0.76 = -0.274437$.
    answer: >
      $0.0291$. At even money $b = 1$, so the Kelly fraction is the edge
      itself: $f^{*} = 2p - 1 = 2(0.62) - 1 = 0.24$, a $24\%$ stake. A win then
      multiplies the bankroll by $1 + f^{*} = 1.24$ and a loss by
      $1 - f^{*} = 0.76$, so
      $g(0.24) = 0.62\ln 1.24 + 0.38\ln 0.76 = 0.62(0.215111) +
      0.38(-0.274437) = 0.133369 - 0.104286 = 0.029083$, which is $0.0291$ to
      four places. So the bankroll multiplies by about $e^{0.0291} \approx
      1.0295$ per toss, roughly $2.95\%$ compound growth, doubling in
      $\ln 2 / 0.0291 \approx 24$ tosses. Mind the gap this example is famous
      for: the bet's expected profit is $f^{*}(2p - 1) = 0.24(0.24) = 0.0576$,
      or $5.76\%$ of bankroll per toss, and only about half of that survives
      compounding. The missing half is variance drag, and it is not a fee you
      can negotiate away — it is what the arithmetic mean was always
      overstating.
    expects: "0.0291"
    tolerance: 0.00005
    rubric:
      - >
        Gets $f^{*} = 2p - 1 = 0.24$ from the even-money case before
        evaluating anything.
      - >
        Evaluates $p\ln(1 + f^{*}) + q\ln(1 - f^{*})$ with the correct
        multipliers $1.24$ and $0.76$.
      - >
        Names the gap between the $5.76\%$ arithmetic edge and the $2.91\%$
        growth rate as variance drag.
    targets:
      - quant-games.kelly.coin-example
    exercises:
      - quant-games.kelly.kelly-fraction

  - id: qkelly-coin-example-02
    kind: work
    difficulty: standard
    statement: >
      A coin lands heads with probability $0.56$ and pays even money. Staking
      the Kelly fraction, what is the *expected profit* per toss, as a fraction
      of the bankroll?
    answer: >
      $0.0144$. The Kelly fraction at even money is $f^{*} = 2p - 1 = 0.12$,
      and the expected profit per unit staked is also $2p - 1 = 0.12$, so the
      expected profit per toss as a fraction of the bankroll is
      $f^{*}(2p - 1) = 0.12 \times 0.12 = 0.0144$, or $1.44\%$. Now set that
      beside what actually compounds:
      $g(0.12) = 0.56\ln 1.12 + 0.44\ln 0.88 \approx 0.0072$, about $0.72\%$
      per toss — almost exactly half. That halving is not a coincidence of
      these numbers. For a small edge the quadratic expansion gives
      $g^{*} \approx \mu^{2}/(2\sigma^{2})$ while the arithmetic profit at the
      Kelly stake is $\mu^{2}/\sigma^{2}$, so the ratio tends to one half
      whenever the edge is thin. Quoting the $1.44\%$ as your growth rate is
      the standard error here.
    expects: "0.0144"
    rubric:
      - >
        Identifies $f^{*} = 2p - 1 = 0.12$ and multiplies by the per-unit edge
        $2p - 1$, not by $p$.
      - >
        Distinguishes the arithmetic expected profit from the compound growth
        rate, which is roughly half of it.
    targets:
      - quant-games.kelly.coin-example

  # --- the small-stake expansion ----------------------------------------------

  - id: qkelly-quadratic-approximation-01
    kind: work
    difficulty: demanding
    statement: >
      A market-making strategy earns a mean profit of $\mu = 0.024$ per unit of
      capital committed, with variance $\sigma^{2} = 0.16$ per round. Using the
      small-stake expansion, what is the best attainable growth rate per round?
    answer: >
      $0.0018$. Expanding the logarithm gives
      $g(f) \approx f\mu - \frac{f^{2}\sigma^{2}}{2}$, a downward parabola in
      $f$. Its peak sits at $f^{*} \approx \mu/\sigma^{2} = 0.024/0.16 = 0.15$,
      so stake $15\%$ of capital, and substituting back gives
      $g^{*} \approx \frac{\mu^{2}}{2\sigma^{2}} =
      \frac{(0.024)^{2}}{2(0.16)} = \frac{0.000576}{0.32} = 0.0018$, or
      $0.18\%$ per round. The Sharpe reading confirms it: the single-bet Sharpe
      ratio is $S = \mu/\sigma = 0.024/0.4 = 0.06$, and
      $S^{2}/2 = 0.0036/2 = 0.0018$ — the best growth any stake can buy is half
      the squared Sharpe ratio, full stop. Two things that trip people here.
      The expansion uses $\mathbb{E}[X^{2}] = \sigma^{2} + \mu^{2}$, which is
      $0.160576$ rather than $0.16$; with an edge this thin the difference
      moves nothing, but it is why the result is an approximation. And $g^{*}$
      is *not* $f^{*}\mu = 0.0036$ — that is the arithmetic profit at the Kelly
      stake, exactly twice the growth rate, the same factor-of-two gap the coin
      example shows.
    expects: "0.0018"
    tolerance: 0.00005
    rubric:
      - >
        Locates the peak of $f\mu - f^{2}\sigma^{2}/2$ at
        $f^{*} = \mu/\sigma^{2} = 0.15$ before substituting back.
      - >
        Reports $g^{*} = \mu^{2}/(2\sigma^{2}) = 0.0018$ rather than
        $f^{*}\mu = 0.0036$, and recognises it as half the squared Sharpe
        ratio.
    targets:
      - quant-games.kelly.quadratic-approximation
    exercises:
      - quant-games.kelly.growth-function

  - id: qkelly-quadratic-approximation-02
    kind: work
    difficulty: standard
    statement: >
      A repeated trade has mean profit $\mu = 0.05$ per unit staked and
      variance $\sigma^{2} = 0.2$ per round, and the edge is small enough for
      the second-order expansion to be trusted. What fraction of the bankroll
      should be staked?
    answer: >
      $0.25$. The expansion replaces the exact growth curve by the parabola
      $g(f) \approx f\mu - \frac{f^{2}\sigma^{2}}{2}$, whose maximum is at
      $f^{*} \approx \mu/\sigma^{2} = 0.05/0.2 = 0.25$ — a quarter of the
      bankroll. Edge over variance is the general form of edge over odds: it
      needs only the first two moments of the profit per unit staked, so it
      applies to a trade with a continuum of outcomes where "odds of $b$ to $1$"
      means nothing. The best growth this stake buys is
      $g^{*} \approx \mu^{2}/(2\sigma^{2}) = 0.0025/0.4 = 0.00625$ per round.
      The approximation is worth distrusting when $f$ comes out large or the
      profit distribution has a fat left tail, because the discarded
      $O(f^{3})$ terms are exactly the ones that punish the bad outcomes the
      parabola smooths over.
    expects: "0.25"
    rubric:
      - >
        Applies $f^{*} \approx \mu/\sigma^{2}$, the edge-over-variance form of
        the rule.
      - >
        States a condition under which the approximation should be distrusted —
        a large $f^{*}$ or a heavy left tail.
    targets:
      - quant-games.kelly.quadratic-approximation

  # --- continuously rebalanced Kelly ------------------------------------------

  - id: qkelly-continuous-kelly-01
    kind: work
    difficulty: demanding
    statement: >
      An asset has drift $\mu = 0.075$ a year and volatility $\sigma = 0.15$,
      and cash earns a riskless $r = 0.03$. Holding a constant fraction of
      wealth in the asset and rebalancing continuously, what is the log-wealth
      growth rate at the optimal fraction?
    answer: >
      $0.075$ a year. The log-wealth drift of a continuously rebalanced
      position is exactly
      $g(f) = r + f(\mu - r) - \frac{f^{2}\sigma^{2}}{2}$, where the subtracted
      term is the Itô correction on a position whose volatility is $f\sigma$.
      Maximising this exact parabola gives
      $f^{*} = \frac{\mu - r}{\sigma^{2}} = \frac{0.075 - 0.03}{0.0225} = 2$,
      so hold twice your wealth in the asset, funding the extra unit at the
      riskless rate. The growth achieved is
      $g^{*} = r + \frac{(\mu - r)^{2}}{2\sigma^{2}} = 0.03 +
      \frac{0.002025}{0.045} = 0.03 + 0.045 = 0.075$ a year. Equivalently, with
      Sharpe ratio $S = (\mu - r)/\sigma = 0.045/0.15 = 0.3$, the answer is
      $r + S^{2}/2 = 0.03 + 0.045$. Note what did *not* happen: the leverage
      $f^{*}$ never used $r$ except through the excess return, and the growth
      rate is not $\mu = 0.075$ by coincidence of these numbers rather than by
      any rule — levering to $f^{*} = 2$ doubles the excess drift to $0.09$ and
      then hands back $\frac{f^{2}\sigma^{2}}{2} = \frac{4(0.0225)}{2} = 0.045$
      to drag.
    expects: "0.075"
    tolerance: 0.00005
    rubric:
      - >
        Uses $f^{*} = (\mu - r)/\sigma^{2}$ with the *excess* return in the
        numerator, giving $f^{*} = 2$.
      - >
        Adds the riskless rate back, reporting
        $r + (\mu - r)^{2}/(2\sigma^{2})$ and not the excess growth alone.
    targets:
      - quant-games.kelly.continuous-kelly

  - id: qkelly-continuous-kelly-02
    kind: work
    difficulty: standard
    statement: >
      A strategy is expected to beat cash by $12$ percentage points a year with
      an annualised volatility of $30\%$. What fraction of wealth does
      continuous-time Kelly hold in it? Give the answer as an exact fraction.
    answer: >
      $4/3$. The continuous-case fraction is $f^{*} = (\mu - r)/\sigma^{2}$
      with the excess return in the numerator and the *variance*, not the
      volatility, below: $\sigma^{2} = (0.30)^{2} = 0.09$, so
      $f^{*} = 0.12/0.09 = 4/3 \approx 1.333$ — about $133\%$ of wealth in the
      strategy, a third of it borrowed. The commonest error is dividing by
      $\sigma = 0.30$ instead, which gives $0.4$ and understates the position
      by more than a factor of three; the units settle it, since $\mu$ and
      $\sigma^{2}$ are both per-year rates while $\sigma$ is not. Reading the
      answer as $f^{*} = S/\sigma$ with $S = 0.12/0.30 = 0.4$ makes the
      practical point: a modest Sharpe ratio on a low-volatility strategy still
      demands leverage, which is why quiet edges get levered and loud ones do
      not.
    expects: "4/3"
    rubric:
      - >
        Squares the volatility before dividing, so the denominator is
        $\sigma^{2} = 0.09$ and not $\sigma = 0.30$.
      - >
        Reports a fraction above $1$ as leverage rather than treating it as an
        impossible answer.
    targets:
      - quant-games.kelly.continuous-kelly

  - id: qkelly-continuous-kelly-03
    kind: decide
    difficulty: standard
    statement: >
      In $g(f) = r + f(\mu - r) - \frac{f^{2}\sigma^{2}}{2}$ for a
      continuously rebalanced position, the growth rate is described as exact
      rather than approximate. What is the subtracted term
      $\frac{f^{2}\sigma^{2}}{2}$?
    choices:
      - text: >
          The second-order remainder of a Taylor expansion, which is why the
          formula is only good for small $f$.
        feedback: >
          No — that is the discrete story. In continuous time nothing is
          truncated, so the formula holds for any $f$, including the levered
          fractions above $1$ that the discrete expansion would strain at.
      - text: >
          The volatility drag on the levered position — the gap between the
          arithmetic drift and the log-wealth drift of a geometric Brownian
          motion, applied to a position whose volatility is $f\sigma$.
        correct: true
        feedback: >
          Right. It is the same $-\sigma^{2}/2$ that separates the drift of
          $\ln S_t$ from that of $S_t$, scaled to the position actually held.
      - text: >
          A transaction-cost term charged for rebalancing continuously.
        feedback: >
          No — the model has no trading costs at all. The subtraction is
          intrinsic to holding a volatile position, and would be there under
          costless trading.
      - text: >
          A risk-aversion penalty imposed by the choice of a logarithmic
          utility function.
        feedback: >
          No — the term appears in the dynamics before any objective is chosen.
          It is what compounding does to a fluctuating multiplier, not a
          preference.
    answer: >
      It is volatility drag. For a geometric Brownian motion with drift $\mu$
      and volatility $\sigma$, the log of the price has drift
      $\mu - \frac{\sigma^{2}}{2}$: a fluctuating multiplier compounds to less
      than its arithmetic mean, and the shortfall is exactly half the variance
      rate. Holding a fraction $f$ of wealth in the asset produces a portfolio
      whose volatility is $f\sigma$ and whose arithmetic excess drift is
      $f(\mu - r)$, so the same correction applied to the levered position
      subtracts $\frac{(f\sigma)^{2}}{2} = \frac{f^{2}\sigma^{2}}{2}$. Nothing
      is truncated, which is why this parabola is exact where the discrete
      quadratic expansion is only a second-order fit. Kelly is then simply the
      choice of $f$ at which the linear edge term stops outrunning that drag:
      the edge grows like $f$ and the drag like $f^{2}$, so beyond
      $f^{*} = (\mu - r)/\sigma^{2}$ each extra unit of leverage costs more in
      drag than it earns in excess return, and at $f = 2f^{*}$ the two have
      cancelled entirely.
    rubric:
      - >
        Identifies the term as the Itô or volatility drag on a position of
        volatility $f\sigma$, not as an approximation error or a cost.
      - >
        Explains the linear-versus-quadratic race that fixes $f^{*}$ and makes
        growth vanish at $2f^{*}$.
    targets:
      - quant-games.kelly.continuous-kelly
      - quant-processes.ito.vol-drag
    connects:
      - quant-games.kelly.continuous-kelly ~ quant-processes.ito.vol-drag

  # --- the growth curve and the double-Kelly cliff -----------------------------

  - id: qkelly-overbetting-01
    kind: work
    difficulty: demanding
    statement: >
      A coin comes up heads with probability $0.68$ and pays even money. A
      bettor stakes exactly *twice* the Kelly fraction on every toss. What is
      the true growth rate per toss, to four decimal places? Use
      $\ln 1.72 = 0.542324$ and $\ln 0.28 = -1.272966$.
    answer: >
      $-0.0386$. The Kelly fraction at even money is
      $f^{*} = 2p - 1 = 2(0.68) - 1 = 0.36$, so twice Kelly is $f = 0.72$. A
      win multiplies the bankroll by $1 + f = 1.72$ and a loss by
      $1 - f = 0.28$, so
      $g(0.72) = 0.68\ln 1.72 + 0.32\ln 0.28 = 0.68(0.542324) +
      0.32(-1.272966) = 0.368781 - 0.407349 = -0.038568$, which is $-0.0386$ to
      four places. Compare the two predictions. The parabola
      $g(cf^{*}) = (2c - c^{2})g^{*}$ says double Kelly gives exactly zero,
      since $2(2) - 2^{2} = 0$. The exact discrete curve is *worse* than that:
      it has already crossed zero before $2f^{*}$, so the honest answer is a
      loss of about $3.9\%$ per toss. And this from a coin you win more than
      two thirds of the time, staked at a fraction whose expected profit is
      $0.72(0.36) = 0.259$, nearly $26\%$ of bankroll per toss. Positive
      expectation on every single bet, and a bankroll shrinking to zero — that
      is the cliff. Full Kelly here would have grown at
      $g(0.36) = 0.68\ln 1.36 + 0.32\ln 0.64 \approx 0.0663$ per toss.
    expects: "-0.0386"
    tolerance: 0.00005
    rubric:
      - >
        Computes $f^{*} = 0.36$ and doubles it to $0.72$ before evaluating $g$,
        rather than doubling the growth rate or the edge.
      - >
        Evaluates the exact binary growth function and notes that it is
        strictly worse than the parabola's prediction of zero at $2f^{*}$.
      - >
        Names the paradox: every individual bet still has positive expectation
        while the bankroll decays.
    targets:
      - quant-games.kelly.overbetting
    exercises:
      - quant-games.kelly.kelly-fraction

  - id: qkelly-overbetting-02
    kind: justify
    difficulty: standard
    statement: >
      Working in the quadratic model $g(f) = f\mu - \frac{f^{2}\sigma^{2}}{2}$,
      show that the growth rate at $f = 2f^{*}$ is exactly zero, and explain
      how that is consistent with every individual bet having strictly positive
      expected profit.
    answer: >
      Write $g(f) = f\mu - \frac{f^{2}\sigma^{2}}{2} = f\left(\mu -
      \frac{f\sigma^{2}}{2}\right)$. This vanishes when $f = 0$ or when
      $\mu = \frac{f\sigma^{2}}{2}$, that is when
      $f = 2\mu/\sigma^{2} = 2f^{*}$, since $f^{*} = \mu/\sigma^{2}$. So the
      parabola has its two roots at $0$ and $2f^{*}$, and its peak at the
      midpoint $f^{*}$, which also re-derives $f^{*}$ without calculus. More
      generally $g(cf^{*}) = c f^{*}\mu - \frac{c^{2}f^{*2}\sigma^{2}}{2} =
      (2c - c^{2})g^{*}$, which is zero at $c = 2$ and negative beyond. The
      consistency question is the point. Expected profit per round is linear in
      the stake, $f\mu$, and is positive for every $f > 0$; the drag is
      quadratic, $\frac{f^{2}\sigma^{2}}{2}$, and eventually outruns it.
      Expected wealth and typical wealth are different quantities: expectation
      averages over paths and is dominated by rare enormous ones, while the
      growth rate governs the median path, which is what the bettor walks. At
      $f = 2f^{*}$ the two effects exactly cancel in the log, so the bankroll
      wanders without trend, drifting neither up nor down while
      $\mathbb{E}[W_n]$ still grows without bound. Past $2f^{*}$ the drag wins,
      $g < 0$, and $W_n \to 0$ almost surely even though no single bet was ever
      a bad bet.
    rubric:
      - >
        Factors $g(f) = f(\mu - f\sigma^{2}/2)$ or substitutes $c = 2$ into
        $(2c - c^{2})g^{*}$ to get zero at $f = 2f^{*}$.
      - >
        Explains the linear edge against the quadratic drag, so the
        cancellation is structural rather than a coincidence of the numbers.
      - >
        Distinguishes expected wealth from the almost-sure growth rate, so
        positive per-bet expectation and zero growth do not contradict.
    targets:
      - quant-games.kelly.overbetting

  # --- fractional Kelly -------------------------------------------------------

  - id: qkelly-fractional-01
    kind: work
    difficulty: demanding
    statement: >
      A bet pays $5$ to $2$ — a winning stake of $2$ returns a profit of $5$ —
      and your model gives it a win probability of $0.44$. Your desk's rule is
      to stake half of the Kelly fraction. With a bankroll of $6000$ dollars,
      how many dollars do you put on this bet?
    answer: >
      $648$ dollars. Net odds are $b = 5/2 = 2.5$. The edge is
      $bp - q = 2.5(0.44) - 0.56 = 1.1 - 0.56 = 0.54$, so full Kelly is
      $f^{*} = 0.54/2.5 = 0.216$, and half Kelly is $0.5(0.216) = 0.108$. On a
      $6000$-dollar bankroll that is $0.108 \times 6000 = 648$ dollars. Why
      halve at all, when the formula already gives the growth-optimal number?
      Because the growth curve is steeply asymmetric. Half Kelly retains
      $(2c - c^{2})g^{*}$ with $c = 0.5$, which is $0.75 g^{*}$ — three
      quarters of the growth — while halving the log-wealth volatility and
      quartering the variance. Meanwhile the probability $0.44$ is an estimate,
      and if the true value is lower then your "full Kelly" is over-betting;
      betting full Kelly on an edge overestimated twofold *is* betting
      $2f^{*}$, where growth is zero. Shading down costs a quarter of the
      growth and buys insurance against exactly the error you cannot rule out.
      The trap to avoid is halving the wrong thing — halve the fraction, not
      the odds, the probability, or the edge.
    expects: "648"
    rubric:
      - >
        Converts $5$ to $2$ into net odds $b = 2.5$ and computes
        $f^{*} = (bp - q)/b = 0.216$.
      - >
        Halves the fraction and applies it to the bankroll, giving
        $0.108 \times 6000 = 648$ dollars.
      - >
        Gives a quantitative reason for shading down — three quarters of the
        growth at half the volatility, and protection against an overestimated
        edge.
    targets:
      - quant-games.kelly.fractional
    exercises:
      - quant-games.kelly.kelly-fraction
      - quant-games.kelly.overbetting

  - id: qkelly-fractional-02
    kind: decide
    difficulty: standard
    statement: >
      A colleague has a genuine edge, has computed $f^{*}$ correctly, and asks
      why anyone would deliberately stake less than the growth-optimal
      fraction. Which reason is the strongest?
    choices:
      - text: >
          Because the growth curve is flat near its peak but steep past it, so
          under-betting by a factor $c$ costs only $(1 - c)^{2}$ of the peak
          growth while over-betting by the same factor can cost all of it — and
          the edge is an estimate that could be wrong in either direction.
        correct: true
        feedback: >
          Right, and the asymmetry is the load-bearing half. Half Kelly keeps
          three quarters of the growth; double Kelly keeps none, and an edge
          overestimated twofold turns "full Kelly" into double Kelly.
      - text: >
          Because staking less raises the expected profit per round.
        feedback: >
          No — expected profit per round is $f\mu$, strictly increasing in $f$.
          Shading down lowers it. What shading down protects is the compound
          growth rate and the path you actually walk.
      - text: >
          Because the Kelly fraction is derived for a single bet and does not
          apply to repeated ones.
        feedback: >
          Backwards — Kelly is derived precisely for the repeated, fully
          reinvested case. A genuinely one-shot bet is where its guarantee has
          least to say.
      - text: >
          Because a smaller stake makes the bankroll grow faster once losses
          are taken into account.
        feedback: >
          No — below $f^{*}$ a smaller stake grows the bankroll strictly more
          slowly. The trade is growth given up in exchange for lower volatility
          and robustness to a mis-estimated edge, not free growth.
    answer: >
      The asymmetry of the growth curve, compounded by estimation error. Along
      the parabola, growth at $c$ times Kelly is $(2c - c^{2})g^{*}$, so
      $c = 0.5$ keeps $0.75g^{*}$ while $c = 2$ keeps $0$ and $c > 2$ is
      negative — the penalty for timidity is quadratic and small, the penalty
      for greed is unbounded. That alone would argue for shading. Estimation
      seals it: $p$ and $\mu$ are estimates, and while the *height* of the
      optimum is flat in $f$, its *location* is not, so ordinary noise in the
      edge moves $f^{*}$ a long way. If your true edge is half what you think,
      your "full Kelly" is $2f^{*}$ and your growth is zero. Half Kelly also
      halves log-wealth volatility and quarters its variance, so you buy three
      quarters of the growth for half the swing, which is the trade every real
      desk takes. The rule of thumb is to stake between a quarter and a half of
      $f^{*}$, and to shade down, never up.
    rubric:
      - >
        Names the asymmetry quantitatively — $(2c - c^{2})g^{*}$, so half Kelly
        keeps three quarters and double Kelly keeps none.
      - >
        Adds estimation error as the reason the asymmetry bites: an
        overestimated edge silently converts full Kelly into over-betting.
    targets:
      - quant-games.kelly.fractional

  # --- drawdowns under fractional Kelly ---------------------------------------

  - id: qkelly-drawdown-01
    kind: work
    difficulty: demanding
    statement: >
      Under the diffusion approximation, staking $c$ times the Kelly fraction
      makes the probability of the bankroll ever falling to a multiple $\alpha$
      of its starting value equal to $\alpha^{2/c - 1}$. A risk committee will
      tolerate a $1$ in $16$ chance of the bankroll ever halving. What value of
      $c$ meets that limit exactly?
    answer: >
      $c = 0.4$, two fifths of Kelly. Halving means $\alpha = 0.5$, so the
      requirement is $(0.5)^{2/c - 1} = 1/16$. Write the right-hand side in the
      same base: $1/16 = (0.5)^{4}$. Since the base is fixed and below $1$, the
      exponents must match: $2/c - 1 = 4$, so $2/c = 5$ and $c = 2/5 = 0.4$.
      Sanity-check the direction — a smaller $c$ means a larger exponent on a
      number below $1$, hence a smaller probability, so a tighter drawdown
      limit should push $c$ down, and $0.4$ is indeed below full Kelly. It is
      worth seeing what full Kelly would have given: $c = 1$ makes the exponent
      $1$, so the probability of ever halving the bankroll is $\alpha = 0.5$
      itself — a coin flip. Cutting to $40\%$ of Kelly costs
      $(2c - c^{2})g^{*} = (0.8 - 0.16)g^{*} = 0.64g^{*}$, so about a third of
      the growth, and buys an eightfold reduction in that drawdown
      probability. And because the bound is scale-free it reapplies from every
      new high-water mark, which is what makes full Kelly unlivable in
      practice.
    expects: "0.4"
    tolerance: 0.0005
    rubric:
      - >
        Rewrites $1/16$ as $(0.5)^{4}$ so the exponents can be equated, giving
        $2/c - 1 = 4$.
      - >
        Solves to $c = 0.4$ and checks the direction — a tighter limit forces a
        smaller fraction of Kelly.
    targets:
      - quant-games.kelly.drawdown

  - id: qkelly-drawdown-02
    kind: work
    difficulty: standard
    statement: >
      A trader stakes half the Kelly fraction. Using
      $\Pr(\text{bankroll ever falls to } \alpha W_0) = \alpha^{2/c - 1}$, what
      is the probability that the bankroll ever falls to a quarter of its
      starting value?
    answer: >
      $0.015625$, or $1$ in $64$. At half Kelly $c = 0.5$, so the exponent is
      $2/c - 1 = 4 - 1 = 3$, and with $\alpha = 0.25$ the probability is
      $(0.25)^{3} = 0.015625$. Put that next to full Kelly, where the exponent
      is $1$ and the same $75\%$ drawdown has probability $0.25$ — one chance
      in four, against one in sixty-four. Halving the stake has cut the
      drawdown probability by a factor of sixteen while costing only a quarter
      of the growth rate, which is the entire case for fractional Kelly in two
      numbers. The bound comes from a hitting probability for Brownian motion
      with drift, $e^{-2mL/s^{2}}$ at level $L = \ln(1/\alpha)$, and being
      scale-free it applies again from any new high-water mark — so "ever" here
      really does mean over the whole future, not over some fixed horizon.
    expects: "0.015625"
    rubric:
      - >
        Computes the exponent $2/c - 1 = 3$ at $c = 0.5$ before raising
        $\alpha$ to it.
      - >
        Compares against full Kelly's $\alpha^{1} = 0.25$ to show what the
        shading buys.
    targets:
      - quant-games.kelly.drawdown

  # --- fixed-fraction betting never goes bankrupt -----------------------------

  - id: qkelly-no-bankruptcy-01
    kind: justify
    difficulty: demanding
    statement: >
      Explain why a bettor who always stakes a fixed fraction $f$ with
      $0 \le f < 1$ of the current bankroll, on a bet that cannot lose more
      than the stake, can never be bankrupted — and say precisely what happens
      instead when the fraction chosen is too large.
    answer: >
      Wealth under fixed-fraction betting is the product
      $W_n = W_0 \prod_{i=1}^{n}(1 + fX_i)$. The bet cannot lose more than the
      stake, so $X_i \ge -1$, and therefore every factor satisfies
      $1 + fX_i \ge 1 - f > 0$ whenever $f < 1$. A finite product of strictly
      positive numbers is strictly positive, so $W_n > 0$ for every $n$: there
      is no absorbing state at zero, and this is exactly why the Kelly
      objective can be maximised with no survival constraint bolted on. The
      mechanism is that the stake is recomputed off what is left, so a loss
      shrinks the next stake in the same proportion and can never exhaust the
      bankroll. What replaces bankruptcy is exponential decay. If $g(f) < 0$
      then $W_n \approx W_0 e^{ng(f)} \to 0$ almost surely — the bankroll
      converges to zero without ever reaching it, which is ruin in every
      practical sense and none of the mathematical one. Two caveats restore
      genuine ruin. A minimum bet size turns the fraction into a fixed stake
      once the bankroll is small enough, and fixed stakes do have an absorbing
      barrier. And any position that can lose more than its notional —
      leverage, short options, $X < -1$ — has a range of $f$ for which
      $1 + fX < 0$ is possible, at which point the argument's premise fails
      outright. Divisible stakes and a bounded downside are not decoration;
      they are the hypothesis.
    rubric:
      - >
        Bounds each multiplier below by $1 - f > 0$ using $X \ge -1$ and
        $f < 1$, concluding $W_n > 0$ for all $n$.
      - >
        Names exponential decay to zero as the substitute for bankruptcy when
        $g(f) < 0$, distinguishing convergence to zero from reaching it.
      - >
        Identifies at least one hypothesis whose failure restores real ruin — a
        minimum stake, or a loss that can exceed the stake.
    targets:
      - quant-games.kelly.no-bankruptcy

  - id: qkelly-no-bankruptcy-02
    kind: work
    difficulty: standard
    statement: >
      A bettor with $2000$ dollars stakes $f = 0.45$ of the current bankroll
      every round and loses six rounds in a row. How many dollars remain, to
      the nearest cent?
    answer: >
      $55.36$ dollars. Each loss multiplies the bankroll by
      $1 - f = 0.55$, so after six losses
      $W_6 = 2000 \times (0.55)^{6}$. Compute in stages:
      $(0.55)^{2} = 0.3025$, $(0.55)^{3} = 0.166375$, and squaring that gives
      $(0.55)^{6} = 0.02768064$, so $W_6 = 2000 \times 0.02768064 = 55.36$
      dollars. Battered, but strictly positive, and the seventh bet is still
      placeable at $0.45 \times 55.36 = 24.91$ dollars. Contrast a bettor who
      commits the same *dollar* amount every round, $0.45 \times 2000 = 900$:
      after one loss they hold $1100$, after two they hold $200$, and the third
      bet cannot be placed at all. That is the difference the fraction makes —
      rescaling the stake to the surviving bankroll converts an absorbing
      barrier at zero into an exponential decay that never quite gets there.
    expects: "55.36"
    tolerance: 0.005
    rubric:
      - >
        Applies the loss multiplier $1 - f = 0.55$ six times rather than
        subtracting a fixed dollar stake.
      - >
        Observes that the bankroll stays strictly positive and the next bet
        remains placeable, unlike the fixed-stake comparison.
    targets:
      - quant-games.kelly.no-bankruptcy
    exercises:
      - quant-games.kelly.fixed-fraction

  - id: qkelly-no-bankruptcy-03
    kind: decide
    difficulty: standard
    statement: >
      A gambler with no edge plays a fair game against a house with unlimited
      capital, and keeps playing forever. Which comparison between fixed stakes
      and fixed fractions is correct?
    choices:
      - text: >
          Fixed stakes lead to ruin with probability $1$ against an infinitely
          rich opponent, while fixed-fraction betting has no absorbing state at
          zero — though with no edge the bankroll still decays to zero almost
          surely, since $g(f) < 0$ for every $f > 0$.
        correct: true
        feedback: >
          Right on both halves. Removing the absorbing barrier is a real
          structural change, and it is not the same thing as being safe: with
          no edge, only $f = 0$ has non-negative growth.
      - text: >
          Both schemes reach exactly zero with probability $1$, so the
          distinction is a technicality with no consequences.
        feedback: >
          No — fixed-fraction wealth is a product of strictly positive factors
          and never equals zero. The distinction is what lets Kelly maximise
          growth without a separate survival constraint.
      - text: >
          Fixed-fraction betting protects the bankroll, so with no edge it
          drifts sideways rather than declining.
        feedback: >
          No — a fair game has $\mu = 0$, and $g(f) = \mathbb{E}[\ln(1 + fX)]$
          is strictly negative for any $f > 0$ by strict concavity. Sideways
          requires staking nothing.
      - text: >
          Fixed stakes survive longer because the stake does not shrink after
          losses.
        feedback: >
          Not shrinking is precisely the problem: a fixed stake that exceeds
          what remains ends the game outright, which is the absorbing barrier
          fractional betting removes.
    answer: >
      Fixed stakes against an infinitely rich opponent mean certain ruin even
      in a fair game — the gambler's-ruin probability goes to $1$ as the
      opponent's capital grows without bound, because a random walk with no
      drift hits every level eventually and the level at zero is absorbing.
      Rescaling the stake to the surviving bankroll removes that barrier
      entirely: every multiplier $1 + fX$ is strictly positive for
      $0 \le f < 1$, so $W_n > 0$ for all $n$ and the walk in $\ln W$ has no
      absorbing state. What the rescaling converts ruin *into* is an
      exponential rate $g(f)$, which a positive edge can make positive. Without
      an edge it cannot: for a fair bet $\mathbb{E}[X] = 0$, and strict
      concavity of the logarithm gives
      $\mathbb{E}[\ln(1 + fX)] < \ln(1 + f\mathbb{E}[X]) = 0$ for every
      $f > 0$, so the bankroll decays to zero almost surely without ever
      arriving. The absorbing barrier is gone; the arithmetic is not.
    rubric:
      - >
        States that fixed stakes against an unlimited opponent give ruin with
        probability $1$, while fixed fractions have no absorbing state at zero.
      - >
        Does not overclaim: with no edge the fixed-fraction bankroll still
        tends to zero almost surely, by strict concavity of the logarithm.
    targets:
      - quant-games.kelly.no-bankruptcy
      - quant-processes.ruin.infinite-opponent
    connects:
      - quant-games.kelly.no-bankruptcy ~ quant-processes.ruin.infinite-opponent

  # --- simultaneous and correlated bets ---------------------------------------

  - id: qkelly-simultaneous-bets-01
    kind: work
    difficulty: demanding
    statement: >
      Two bets settle at the same time and share one bankroll. Each has mean
      profit $0.05$ per unit staked and variance $0.04$, and their correlation
      is $0.5$. In the Gaussian case the optimal weight vector solves
      $f^{*} = \Sigma^{-1}\mu$. What fraction of the bankroll goes on each bet?
      Give the answer as an exact fraction.
    answer: >
      $5/6$ on each. Build the covariance matrix: the diagonal entries are the
      variances, $0.04$ each, and the off-diagonal entry is
      $\rho\sigma_1\sigma_2 = 0.5(0.2)(0.2) = 0.02$, so $\Sigma$ has rows
      $(0.04, 0.02)$ and $(0.02, 0.04)$. By symmetry both bets get the same
      weight $f$, and the first row of $\Sigma f = \mu$ reads
      $0.04f + 0.02f = 0.05$, so $0.06f = 0.05$ and $f = 5/6 \approx 0.8333$.
      Now read the number. Sized standalone, each bet would take
      $\mu/\sigma^{2} = 0.05/0.04 = 1.25$ of the bankroll, for a combined
      exposure of $2.5$; the joint optimum puts $5/6$ on each, a combined
      $5/3$, a third less. The correlation is what does it: positively
      correlated bets are partly one larger bet in disguise, their risks land
      in the same round multiplier, and the shared bankroll cannot pretend
      otherwise. The trap is sizing each bet against its own variance and
      adding — that is exactly the calculation $\Sigma^{-1}\mu$ corrects,
      and the correction is severe as $\rho \to 1$.
    expects: "5/6"
    rubric:
      - >
        Builds $\Sigma$ with off-diagonal $\rho\sigma_1\sigma_2 = 0.02$, not
        the correlation $0.5$ itself.
      - >
        Solves $\Sigma f = \mu$ — by symmetry $0.06f = 0.05$ — rather than
        inverting each variance separately.
      - >
        Compares against the standalone $1.25$ each and attributes the
        reduction to the positive correlation.
    targets:
      - quant-games.kelly.simultaneous-bets
    exercises:
      - quant-games.kelly.quadratic-approximation

  - id: qkelly-simultaneous-bets-02
    kind: work
    difficulty: standard
    statement: >
      Two *independent* bets settle simultaneously. The first has mean profit
      $0.04$ per unit staked and variance $0.16$; the second has mean $0.09$
      and variance $0.18$. Sizing them jointly in the Gaussian model, what
      total fraction of the bankroll is at risk across both?
    answer: >
      $0.75$. Independence makes $\Sigma$ diagonal, so $\Sigma^{-1}\mu$
      decouples into the scalar rule applied bet by bet: the first gets
      $0.04/0.16 = 0.25$ and the second $0.09/0.18 = 0.5$, for a total
      exposure of $0.25 + 0.5 = 0.75$ of the bankroll. This is the one case
      where sizing each bet on its own and adding is correct, and it is worth
      being clear about why — the covariance terms that would otherwise couple
      the stakes are all zero, so no bet's risk shows up in another's
      multiplier. Two things still deserve a look. The total is what the
      bankroll actually carries, so if it approached $1$ a single bad round
      could be fatal and the stakes would need shrinking together. And the
      second bet takes twice the stake of the first despite a similar variance,
      because its mean is more than twice as large — in this model the stake
      tracks the mean linearly and the variance inversely, nothing else.
    expects: "0.75"
    rubric:
      - >
        Uses independence to size each bet by $\mu_i/\sigma_i^{2}$ separately,
        and says why that is legitimate here.
      - >
        Adds the two fractions to report the total exposure the shared bankroll
        carries.
    targets:
      - quant-games.kelly.simultaneous-bets

  # --- what Kelly assumes -----------------------------------------------------

  - id: qkelly-assumptions-01
    kind: decide
    difficulty: demanding
    statement: >
      A hedge fund has a genuine edge and computes $f^{*} = 0.30$. Its
      investors may redeem quarterly, and historically they redeem heavily
      after any drawdown beyond $20\%$. Which of Kelly's assumptions does this
      situation break, and what follows?
    choices:
      - text: >
          Full reinvestment with no withdrawals. Redemptions after a drawdown
          remove capital exactly when the bankroll is smallest, so the
          compounding the criterion optimises does not happen and the fund
          should stake well below $f^{*}$.
        correct: true
        feedback: >
          Right. Kelly's guarantee is asymptotic for a bankroll reinvested in
          full, forever; capital that leaves after a loss breaks that, and it
          leaves precisely in the states full Kelly makes most likely.
      - text: >
          Divisibility of stakes. A fund cannot stake exactly $30\%$ of its
          capital, so the formula does not apply.
        feedback: >
          Divisibility is a real assumption but not the binding one here — a
          fund of any size can size a position to well within a percentage
          point. The redemption behaviour is what changes the objective.
      - text: >
          Independence of successive bets. Redemptions make the returns
          serially correlated.
        feedback: >
          Redemptions change the *capital base*, not the dependence structure
          of the returns themselves. The broken assumption is about the
          bankroll, not the bets.
      - text: >
          None of them. Kelly maximises growth, so it remains optimal whatever
          the investors do.
        feedback: >
          Kelly maximises one specific objective under specific hypotheses.
          When capital can leave after a loss, the fund is no longer playing
          the game the criterion solves.
    answer: >
      The assumption that breaks is full reinvestment with no deposits or
      withdrawals — and, alongside it, the absence of any horizon or benchmark.
      Kelly's optimality statement is asymptotic: it says a bankroll compounded
      forever at rate $g(f^{*})$ overtakes any rival eventually with
      probability $1$. Redemptions destroy that in the worst possible way,
      because they arrive after drawdowns, which is exactly the state full
      Kelly visits often — the drawdown bound $\alpha^{2/c - 1}$ at $c = 1$
      puts the probability of ever losing $20\%$ at $0.8$, so the trigger is
      near-certain rather than exceptional. Capital withdrawn at the bottom
      never participates in the recovery, so the realised growth rate falls
      below $g(f^{*})$ and the fund is optimising a quantity it does not get to
      keep. The practical answer is to stake a fraction of $f^{*}$ chosen so
      that the drawdown probability sits below the redemption trigger, which
      here means a $c$ well under $0.5$. The interview habit worth building:
      state $f^{*}$ from the formula, then name the assumption you distrust and
      the fraction of $f^{*}$ you would actually stake.
    rubric:
      - >
        Identifies full reinvestment with no withdrawals as the broken
        assumption, rather than divisibility or independence.
      - >
        Connects the redemption trigger to the drawdown behaviour of full
        Kelly and concludes that the fund should shade the stake down.
    targets:
      - quant-games.kelly.assumptions
    exercises:
      - quant-games.kelly.log-growth

  - id: qkelly-assumptions-02
    kind: decide
    difficulty: standard
    statement: >
      A trader estimates a win probability from $40$ past trades, gets
      $\hat{p} = 0.6$ at even money, and proposes staking the resulting
      $f^{*} = 0.2$. Which objection carries the most weight?
    choices:
      - text: >
          Kelly assumes the probability is known, and $\hat{p}$ from $40$
          observations has a standard error near $0.08$ — so the true $f^{*}$
          could plausibly be half the estimate, which would make the proposed
          stake close to double Kelly.
        correct: true
        feedback: >
          Exactly the right shape of objection: the growth peak is flat in $f$
          but its *location* is not, so ordinary sampling noise in $p$ moves
          $f^{*}$ a long way, and the error that matters is the one that makes
          you over-bet.
      - text: >
          Kelly requires bets at odds longer than even money, so the formula
          does not apply at $b = 1$.
        feedback: >
          No — even money is the standard case, where $f^{*} = 2p - 1$. Nothing
          in the derivation needs $b > 1$.
      - text: >
          Kelly maximises expected wealth, which is the wrong objective here.
        feedback: >
          It maximises expected *log* wealth, which is the right objective for
          a compounding bankroll. The problem is the input, not the objective.
      - text: >
          The bankroll size was not stated, so $f^{*}$ cannot be computed.
        feedback: >
          The Kelly fraction is scale-free — only $p$ and $b$ enter. The
          bankroll is needed to convert the fraction into a stake, not to find
          it.
    answer: >
      Kelly presumes correctly known probabilities, and here $p$ is estimated.
      With $n = 40$ and $\hat{p} = 0.6$ the standard error is
      $\sqrt{\hat{p}(1 - \hat{p})/n} = \sqrt{0.24/40} \approx 0.077$, so a true
      $p$ of $0.52$ sits about one standard error away and is entirely
      plausible. At $p = 0.52$ the true optimum is $f^{*} = 0.04$, and the
      proposed stake of $0.2$ is five times that — far past $2f^{*}$, where
      growth is not merely reduced but negative. Evaluating the true growth
      function at the proposed stake makes it concrete: $0.52\ln 1.2 +
      0.48\ln 0.8 \approx -0.012$, a loss of over $1\%$ per round on a bet that,
      correctly measured, still has a positive edge. The asymmetry does the
      damage — the growth peak is flat in $f$, so being at the wrong $f$ costs
      little near the top, but the *location* of the peak moves sharply with
      $p$, and the direction that hurts is the one where you over-bet. The
      standard response is fractional Kelly: stake a quarter to a half of the
      estimated $f^{*}$, and shade down rather than up.
    rubric:
      - >
        Names known probabilities as the assumption at stake and quantifies the
        estimation error, roughly $0.08$ on $40$ observations.
      - >
        Traces the consequence: a modestly overestimated $p$ turns the proposed
        stake into over-betting past $2f^{*}$, where growth is negative.
    targets:
      - quant-games.kelly.assumptions
