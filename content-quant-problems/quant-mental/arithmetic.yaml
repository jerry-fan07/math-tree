# Problems targeting quant-mental.arithmetic — the mental-arithmetic toolkit.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. Every instance here is fresh: no
# problem reuses a lesson's worked example or a card's numbers. Because the unit
# is arithmetic, nearly every answer is an exact integer, fraction or percentage
# and is typed rather than self-reported; the `decide` rows exist where the skill
# really is a choice of route (which anchor, which trade, which check fires) and
# the `justify` rows where it is an explanation of why a trick is valid at all.
# See ../README.md.

problems:
  # --- complements and near-base multiplication --------------------------------

  - id: qarith-base-tricks-01
    kind: work
    difficulty: demanding
    statement: >
      Compute $993 \times 1008$ by anchoring both factors at $1000$.
    answer: >
      $1000944$. Write the factors as $1000 - 7$ and $1000 + 8$ and expand
      $(B+a)(B+b) = B^{2} + B(a+b) + ab$ with $B = 1000$, $a = -7$, $b = +8$.
      The three pieces are all cheap: $B^{2} = 1000000$ is a one-appended-zeros
      square, the cross term is $1000(-7+8) = 1000 \times 1 = +1000$, and the
      offset product is $(-7)(+8) = -56$. Adding, $1000000 + 1000 - 56 =
      1001000 - 56 = 1000944$. The trap is the cross term: the offsets are
      *signed*, so $a+b = +1$, not $15$ — reading them unsigned gives
      $1000 \times 15 = 15000$ and the badly wrong $1014944$. A second trap is
      the sign of $ab$: one offset is negative, so the last correction is
      subtracted. The last-digit check confirms it, since $3 \times 8 = 24$
      ends in $4$ and so does $1000944$.
    expects: "1000944"
    rubric:
      - >
        Uses the signed offsets $-7$ and $+8$ in the cross term, so
        $B(a+b) = +1000$ rather than $15000$.
      - >
        Subtracts the offset product $56$ rather than adding it, because
        exactly one offset is negative.
      - >
        Never performs a digit-by-digit long multiplication — all three pieces
        are round-number arithmetic.
    targets:
      - quant-mental.arithmetic.base-tricks

  - id: qarith-base-tricks-02
    kind: work
    difficulty: standard
    statement: >
      Compute $10{,}004 - 3{,}997 - 2{,}998$ in one pass, using complements for
      both subtractions.
    answer: >
      $3009$. Round each subtrahend up to its nearby base and keep a running
      tally of what you over-subtracted: $3997 \to 4000$ costs $3$ too much and
      $2998 \to 3000$ costs $2$ too much. The rounded computation is pure
      round-number arithmetic, $10004 - 4000 - 3000 = 3004$, and then you pay
      back the total overshoot $3 + 2 = 5$, giving $3004 + 5 = 3009$. Doing it
      the long way confirms the number: $10004 - 3997 = 6007$ and
      $6007 - 2998 = 3009$. The trap is the direction of the correction — you
      subtracted *too much*, so the corrections are added back; subtracting
      them instead gives $2999$ and is the single most common slip in the
      complement move.
    expects: "3009"
    rubric:
      - >
        Rounds both subtrahends up and accumulates the overshoot $3 + 2 = 5$
        before correcting once at the end.
      - >
        Adds the overshoot back rather than subtracting it, since rounding a
        subtrahend up removes too much.
    targets:
      - quant-mental.arithmetic.base-tricks

  - id: qarith-base-tricks-03
    kind: decide
    difficulty: standard
    statement: >
      You are asked for $88 \times 91$ under a stopwatch. Which near-base
      decomposition should you reach for, and what does it give?
    answer: >
      Anchor at $90$, not $100$. The offsets are then $-2$ and $+1$, and
      $(90-2)(90+1) = 90^{2} + 90(-2+1) + (-2)(+1) = 8100 - 90 - 2 = 8008$ —
      three pieces you can hold in your head at once. Anchoring at $100$ is
      not wrong, but the offsets $-12$ and $-9$ are large enough that the
      corrections, $100 \times (-21) = -2100$ and $(-12)(-9) = +108$, are
      themselves multi-digit arithmetic; the trick stops paying once an offset
      passes roughly $10$. The named trap is reading the offsets unsigned:
      $90(2+1) = 270$ gives $8100 - 270 - 2 = 7828$, which is off by $180$
      because the $+1$ offset was flipped to $-1$ inside the cross term.
    choices:
      - text: >
          Base $100$, offsets $-12$ and $-9$: $10000 + 100(-21) + 108 = 8008$.
        feedback: >
          This does land on $8008$, but the corrections $-2100$ and $+108$ are
          bigger than the digits of the answer itself. Offsets that large mean
          the anchor is the wrong one.
      - text: >
          Base $90$, offsets $-2$ and $+1$: $8100 + 90(-1) - 2 = 8008$.
        correct: true
        feedback: >
          Right — the closest round anchor makes both corrections single-digit
          work, and $8100 - 90 - 2 = 8008$.
      - text: >
          Base $90$, offsets $2$ and $1$: $8100 - 90(2+1) - 2 = 7828$.
        feedback: >
          The cross term uses *signed* offsets. Since $91 = 90 + 1$, its offset
          is $+1$, so $a+b = -1$ and the cross term is $-90$, not $-270$.
    rubric:
      - >
        Picks the anchor that makes both offsets small — $90$ here, not the
        reflexive $100$.
      - >
        Keeps the offsets signed inside $B(a+b)$, so the cross term is $-90$.
    targets:
      - quant-mental.arithmetic.base-tricks

  # --- squares and difference of squares ---------------------------------------

  - id: qarith-squares-01
    kind: work
    difficulty: demanding
    statement: >
      Compute $68^{2} - 32^{2}$ without ever squaring either number.
    answer: >
      $3600$. Factor first: $a^{2} - b^{2} = (a-b)(a+b)$, so
      $68^{2} - 32^{2} = (68-32)(68+32) = 36 \times 100 = 3600$. The whole
      point of reading the difference of squares right-to-left is that the sum
      collapses to a round number here, turning a two-square subtraction into
      one trivial product. The brute-force route agrees and is worth doing once
      as a check, each square itself by anchoring: $68^{2} = (70-2)^{2} =
      4900 - 280 + 4 = 4624$ and $32^{2} = (30+2)^{2} = 900 + 120 + 4 = 1024$,
      and $4624 - 1024 = 3600$. The trap is squaring the *difference* instead
      of factoring — $(68-32)^{2} = 36^{2} = 1296$ answers a different question.
    expects: "3600"
    rubric:
      - >
        Factors as $(68-32)(68+32)$ rather than computing two squares, and
        notices that the sum is the round $100$.
      - >
        Does not confuse $a^{2}-b^{2}$ with $(a-b)^{2}$.
    targets:
      - quant-mental.arithmetic.squares

  - id: qarith-squares-02
    kind: work
    difficulty: standard
    statement: >
      Compute $43 \times 57$ by spotting the midpoint.
    answer: >
      $2451$. The two factors average to $(43+57)/2 = 50$, and each sits a
      distance $d = 7$ from it, so the product is $(50-7)(50+7) =
      50^{2} - 7^{2} = 2500 - 49 = 2451$. Finding the midpoint is the whole
      skill: average the two numbers, and if the average is round you have an
      instant answer. Two traps sit here. The first is subtracting the distance
      rather than its square, giving $2500 - 7 = 2493$. The second is choosing
      the wrong anchor — squaring $43$ or $57$ instead of the midpoint $50$
      throws away the round number the identity was built to exploit. Casting
      out nines confirms the result: $7 \times 3 = 21 \to 3$, and $2451$ has
      digit sum $12 \to 3$.
    expects: "2451"
    rubric:
      - >
        Averages the two factors to find the midpoint $50$ and the common
        distance $7$ before multiplying.
      - >
        Subtracts $d^{2} = 49$, not $d = 7$.
    targets:
      - quant-mental.arithmetic.squares

  - id: qarith-squares-03
    kind: work
    difficulty: demanding
    statement: >
      The anchored square $(x+h)^{2} = x^{2} + 2xh + h^{2}$ is just the
      degree-2 row of the binomial theorem, and the same expansion runs one row
      further. Compute $103^{3}$ by expanding $(100+3)^{3}$.
    answer: >
      $1092727$. The degree-3 binomial coefficients are
      $\binom{3}{0},\binom{3}{1},\binom{3}{2},\binom{3}{3} = 1, 3, 3, 1$, so
      $(100+3)^{3} = 100^{3} + 3\cdot100^{2}\cdot3 + 3\cdot100\cdot3^{2} +
      3^{3}$. Each term is a round-number multiplication: $1000000$, then
      $3 \times 30000 = 90000$, then $3 \times 900 = 2700$, then $27$. Adding
      down the place values, $1000000 + 90000 + 2700 + 27 = 1092727$. Notice
      that the familiar squaring rule is the row above with coefficients
      $1, 2, 1$ — the $2xh$ everyone memorizes is $\binom{2}{1}$, and the only
      thing that changes at degree 3 is that the middle coefficients become
      $3$ and $3$. The trap is carrying the degree-2 pattern upward and writing
      $1000000 + 2\cdot100^{2}\cdot3 + 3^{3}$, which both uses the wrong
      coefficient and silently drops the $3\cdot100\cdot9$ term.
    expects: "1092727"
    rubric:
      - >
        Uses the coefficients $1, 3, 3, 1$ and keeps all four terms, including
        the easily dropped $3 \cdot 100 \cdot 9 = 2700$.
      - >
        Names the connection explicitly: the $2xh$ of the anchored square is
        $\binom{2}{1}xh$, so the squaring trick is one row of the same theorem.
    targets:
      - quant-mental.arithmetic.squares
      - quant-probability.counting.binomial-theorem
    exercises:
      - quant-mental.arithmetic.base-tricks
    connects:
      - "quant-mental.arithmetic.squares ~ quant-probability.counting.binomial-theorem"

  # --- multiplying by 11 -------------------------------------------------------

  - id: qarith-eleven-trick-01
    kind: work
    difficulty: demanding
    statement: >
      Compute $4{,}859 \times 11$ by the digit-sweep, carrying where you must.
    answer: >
      $53449$. Sweep right to left. The units digit is the original units digit,
      $9$. Next comes $5+9 = 14$: write $4$, carry $1$. Next $8+5 = 13$, plus
      the carry gives $14$: write $4$, carry $1$. Next $4+8 = 12$, plus the
      carry gives $13$: write $3$, carry $1$. Finally the leading digit is
      $4+1 = 5$. Reading the written digits back, $5\,3\,4\,4\,9 = 53449$.
      The trap is a carry that has to propagate twice in a row, as it does
      here: forgetting to add the carry into the *next* pair sum gives the
      wrong $53339$, and writing the two-digit sums in place without carrying
      at all gives the nonsense $4\,12\,13\,14\,9$. Check it against
      $4859 \times 11 = 4859 \times 10 + 4859 = 48590 + 4859 = 53449$.
    expects: "53449"
    rubric:
      - >
        Adds each carry into the next adjacent-pair sum, not just into the
        digit being written — the carry propagates through two consecutive
        pairs here.
      - >
        Leaves the outer digits alone except for the final carry into the
        leading digit.
    targets:
      - quant-mental.arithmetic.eleven-trick

  - id: qarith-eleven-trick-02
    kind: decide
    difficulty: standard
    statement: >
      A candidate computes $58 \times 11$ and reasons: "outer digits $5$ and
      $8$, interior sum $5+8 = 13$." Which completion is correct?
    answer: >
      $638$. The interior sum $13$ does not fit in one slot, so you write its
      units digit $3$ in the middle and carry the $1$ *leftward*, into the
      leading digit: $5 + 1 = 6$. The digits read $6\,3\,8 = 638$, confirmed by
      $58 \times 10 + 58 = 580 + 58 = 638$. The two named traps are both about
      the carry. Writing the whole two-digit sum between the outer digits gives
      $5138$, roughly ten times too big, and carrying into the units digit
      instead of the leading digit gives $648$ — right length, wrong direction.
      A carry in this trick always moves toward the more significant end,
      because the middle slot is worth ten times the units slot.
    choices:
      - text: >
          $5138$ — write the interior sum $13$ between the outer digits.
        feedback: >
          A slot holds one digit. Writing $13$ there inflates the answer by
          about a factor of ten; the tens part of the sum has to be carried.
      - text: >
          $638$ — write the $3$ and carry the $1$ into the leading digit.
        correct: true
        feedback: >
          Right: $5+1 = 6$, then $3$, then the untouched $8$, giving
          $638 = 580 + 58$.
      - text: >
          $648$ — write the $3$ and carry the $1$ into the units digit.
        feedback: >
          The carry moves left, toward the more significant digit, never right.
          Carrying into the units digit changes a digit worth $1$ using a carry
          worth $100$.
    rubric:
      - >
        Sends the carry leftward into the leading digit, giving $5+1 = 6$.
      - >
        Keeps the outer digits $5$ and $8$ otherwise untouched.
    targets:
      - quant-mental.arithmetic.eleven-trick

  # --- multiplying and dividing by 5 -------------------------------------------

  - id: qarith-five-trick-01
    kind: work
    difficulty: demanding
    statement: >
      Compute $2{,}946 \times 5 - 7{,}310/5$, using the halve-or-double
      reframing for both halves of the expression.
    answer: >
      $13268$. For the product, $\times 5$ is halve-then-append-a-zero: half of
      $2946$ is $1473$, so $2946 \times 5 = 14730$. For the quotient, $/5$ runs
      the trade backwards — double, then drop a zero: $7310 \times 2 = 14620$,
      and dropping the trailing zero gives $7310/5 = 1462$. Subtracting,
      $14730 - 1462 = 13268$; the complement move makes even that step cheap,
      since $14730 - 1500 = 13230$ and adding back the $38$ you over-subtracted
      gives $13268$. The trap is running the trade in the wrong direction:
      halving before dividing, or doubling before multiplying, moves the answer
      by a factor of four and produces $3682.5$ or $58920$ — both a long way
      from a number whose last digit must be $0 - 2 = 8$.
    expects: "13268"
    rubric:
      - >
        Halves then appends a zero for $\times 5$, and doubles then drops a
        zero for $/5$ — the two directions are inverses, not the same move.
      - >
        Carries out the final subtraction cleanly, ideally by rounding
        $1462$ to $1500$ and correcting by $38$.
    targets:
      - quant-mental.arithmetic.five-trick

  - id: qarith-five-trick-02
    kind: work
    difficulty: standard
    statement: >
      Compute $3{,}715/5$.
    answer: >
      $743$. Dividing by $5$ is multiplying by $2/10$, so double and drop a
      zero: $3715 \times 2 = 7430$, and removing the trailing zero gives $743$.
      Doubling is the cheapest operation in mental arithmetic and never carries
      more than one, which is exactly why this beats long division by $5$ every
      time. Sanity-check the size before committing: $3715$ is a little under
      $4000$, and $4000/5 = 800$, so an answer in the $700$s is right and an
      answer near $1800$ would signal that you halved instead of doubled. The
      last-digit check agrees too, since $743 \times 5 = 3715$ ends in $5$.
    expects: "743"
    rubric:
      - >
        Doubles rather than halves — the $/5$ direction of the trade — and only
        then drops the trailing zero.
      - >
        Places the decimal correctly: dropping one zero, not two.
    targets:
      - quant-mental.arithmetic.five-trick

  # --- 25s and general halving–doubling ----------------------------------------

  - id: qarith-twentyfive-halving-doubling-01
    kind: work
    difficulty: demanding
    statement: >
      Compute $36 \times 125 + 44 \times 25$ by trading factors, without
      writing anything down.
    answer: >
      $5600$. Take the terms separately. For $36 \times 125$, halve and double
      until one side is round: $36 \times 125 = 18 \times 250 = 9 \times 500 =
      4500$, and each step is a single halving paired with a single doubling,
      so the product never changes. For $44 \times 25$, use $25 = 100/4$:
      $44/4 = 11$, so $44 \times 25 = 1100$. Adding, $4500 + 1100 = 5600$. The
      route matters more than the arithmetic here — reaching for $125 = 1000/8$
      would ask you for $36/8 = 4.5$, a fraction you then have to carry through
      a multiplication by $1000$, whereas the halve-double chain stays on whole
      numbers the entire way. The trap is halving *both* factors, which
      quarters the product: $18 \times 62.5$ is still $1125$, not $4500$.
    expects: "5600"
    rubric:
      - >
        Halves one factor while doubling the other, keeping the product
        invariant, and stops as soon as one side is round.
      - >
        Uses $25 = 100/4$ on the second term rather than multiplying out, and
        chooses a chain that avoids fractional intermediates.
    targets:
      - quant-mental.arithmetic.twentyfive-halving-doubling
    exercises:
      - quant-mental.arithmetic.five-trick

  - id: qarith-twentyfive-halving-doubling-02
    kind: decide
    difficulty: standard
    statement: >
      For $18 \times 350$, which halving–doubling trade lands on a round factor
      fastest while keeping every intermediate a whole number?
    answer: >
      Halve $18$ to $9$ and double $350$ to $700$: $9 \times 700 = 6300$. The
      test for a good trade is not "is it legal" but "does it reach a round
      number in one step" — halving the even factor here immediately produces
      $700$, a round number times a single digit. Halving $350$ instead gives
      $36 \times 175$, which is the same product but leaves you multiplying two
      awkward numbers. The real trap is halving both factors at once: that is
      not a trade at all, it divides the product by $4$, and $9 \times 175 =
      1575$ is exactly a quarter of $6300$.
    choices:
      - text: >
          Halve $350$ to $175$ and double $18$ to $36$: $36 \times 175$.
        feedback: >
          Legal — the product is still $6300$ — but neither factor is round, so
          you have gained nothing and still face a two-digit multiplication.
      - text: >
          Halve $18$ to $9$ and double $350$ to $700$: $9 \times 700 = 6300$.
        correct: true
        feedback: >
          Right: one trade turns the problem into a single digit times a round
          hundred.
      - text: >
          Halve both factors: $9 \times 175 = 1575$.
        feedback: >
          Halving both divides the product by $4$. A trade must halve one side
          and double the other to leave the product unchanged.
    rubric:
      - >
        Halves one factor and doubles the other — exactly one of each — so the
        product is invariant.
      - >
        Chooses the direction that makes a factor round rather than the one
        that merely stays legal.
    targets:
      - quant-mental.arithmetic.twentyfive-halving-doubling

  # --- fraction–decimal fluency ------------------------------------------------

  - id: qarith-fraction-decimal-01
    kind: work
    difficulty: demanding
    statement: >
      Compute $7/16 + 1/6$ as a decimal, rounded to four decimal places.
    answer: >
      $0.6042$. Read both terms off the table rather than dividing. The
      sixteenths are the halved eighths: $1/16 = 0.0625$, so
      $7/16 = 7 \times 0.0625 = 0.4375$ — or, faster,
      $7/16 = 1/2 - 1/16 = 0.5 - 0.0625$. The sixth is
      $1/6 = 0.1\overline{6}$. Adding, $0.4375 + 0.16666\ldots = 0.60416\ldots$,
      which rounds to $0.6042$. The exact value is $29/48$, since
      $7/16 = 21/48$ and $1/6 = 8/48$, and $29/48 = 0.604166\ldots$ confirms
      the decimal. The trap is truncating $1/6$ to $0.17$ or $0.167$ before
      adding: rounding an operand rather than the final sum pushes the fourth
      decimal place around, and $0.4375 + 0.167 = 0.6045$ is wrong in the place
      you were asked for.
    expects: "0.6042"
    tolerance: 0.00005
    rubric:
      - >
        Recalls $1/16 = 0.0625$ and $1/6 = 0.1\overline{6}$ from the table
        instead of long-dividing either one.
      - >
        Keeps the repeating sixth unrounded until the final sum, so the fourth
        decimal place is right.
    targets:
      - quant-mental.arithmetic.fraction-decimal

  - id: qarith-fraction-decimal-02
    kind: work
    difficulty: standard
    statement: >
      A readout shows the repeating decimal $0.\overline{571428}$. Write it as
      a fraction in lowest terms.
    answer: >
      $4/7$. The six-digit block $571428$ is a rotation of $142857$, which is
      the signature of a seventh — every $k/7$ has the same cycle read from a
      different starting point. To find which seventh, place the value: it sits
      just above $0.5714$, and the sevenths run $1/7 = 0.1428\ldots$,
      $2/7 = 0.2857\ldots$, $3/7 = 0.4285\ldots$, $4/7 = 0.5714\ldots$, so the
      answer is $4/7$. The block's leading digit settles it on its own: the six
      rotations of $142857$ begin with $1, 2, 4, 5, 7, 8$, and those are the
      leading digits of $1/7$ through $6/7$ in order, so a block starting at $5$
      is the fourth of them. The trap is seeing six repeating digits and reaching for a denominator like
      $999999$; that is technically true but useless, and the reduction
      $571428/999999 = 4/7$ is work the table already did for you.
    expects: "4/7"
    rubric:
      - >
        Recognizes $571428$ as a rotation of the $1/7$ cycle $142857$, so the
        denominator is $7$.
      - >
        Fixes the numerator by locating the value between $3/7 = 0.4285\ldots$
        and $5/7 = 0.7142\ldots$.
    targets:
      - quant-mental.arithmetic.fraction-decimal

  - id: qarith-fraction-decimal-03
    kind: work
    difficulty: routine
    statement: >
      What is $11/16$ as an exact decimal?
    answer: >
      $0.6875$. Sixteenths terminate, because $16 = 2^{4}$ and the only prime
      in the denominator is $2$, so there is no repeating tail to worry about.
      The fastest route is the table entry $1/16 = 0.0625$ scaled up, but the
      halving ladder is even quicker to reconstruct if the entry has gone:
      $1/2 = 0.5$, $1/4 = 0.25$, $1/8 = 0.125$, $1/16 = 0.0625$, so
      $11/16 = 8/16 + 2/16 + 1/16 = 0.5 + 0.125 + 0.0625 = 0.6875$. The trap is
      a misplaced decimal — $1/16$ has a leading zero after the point, and
      writing $0.625$ instead of $0.6875$ silently answers $5/8$.
    expects: "0.6875"
    rubric:
      - >
        Produces the exact terminating decimal, not a rounded one — sixteenths
        never repeat.
      - >
        Does not confuse $11/16 = 0.6875$ with the neighbouring $5/8 = 0.625$.
    targets:
      - quant-mental.arithmetic.fraction-decimal

  # --- percent changes compose multiplicatively --------------------------------

  - id: qarith-percent-composition-01
    kind: work
    difficulty: demanding
    statement: >
      A position falls $40\%$, then rises $25\%$, then falls $10\%$. What is
      the net percent change over the three moves? Give a signed percentage.
    answer: >
      $-32.5\%$. Convert each move to a factor and multiply:
      $0.60 \times 1.25 \times 0.90$. Take the easy pair first —
      $0.60 \times 1.25 = 0.75$, because $\times 1.25$ is $+1/4$ and a quarter
      of $0.6$ is $0.15$ — and then $0.75 \times 0.90 = 0.675$. A final factor
      of $0.675$ means the position ends at $67.5\%$ of where it started, a net
      change of $0.675 - 1 = -0.325$, i.e. $-32.5\%$. The additive guess,
      $-40 + 25 - 10 = -25\%$, is wrong by more than seven points, and wrong in
      the direction it always is after a large loss: the $+25\%$ is earned on a
      base that the $-40\%$ already shrank, so it buys back less than its
      headline. Order is irrelevant, since multiplication commutes, but the
      base is not.
    expects: "-32.5%"
    rubric:
      - >
        Multiplies the three factors $0.6$, $1.25$ and $0.9$ rather than adding
        the percentages.
      - >
        Converts the final factor back to a signed percent change by
        subtracting $1$, so $0.675$ reads as $-32.5\%$ and not $67.5\%$.
    targets:
      - quant-mental.arithmetic.percent-composition

  - id: qarith-percent-composition-02
    kind: work
    difficulty: standard
    statement: >
      A stock rises $60\%$ and then falls $25\%$. What is the net percent
      change?
    answer: >
      $+20\%$. The factors are $1.60$ and $0.75$, and
      $1.60 \times 0.75 = 1.20$ — easiest as three-quarters of $1.6$, which is
      $1.6 - 0.4 = 1.2$. A factor of $1.2$ is a net $+20\%$. The additive guess
      would say $+35\%$, and the gap is the whole lesson: the $-25\%$ is taken
      on the enlarged base, so it costs more than $25$ points of the original.
      A useful cross-check is that $0.75 = 3/4$ and $1.6 = 8/5$, so the product
      is $24/20 = 6/5 = 1.2$ exactly. The trap is subtracting the percentages
      and then, noticing something is off, subtracting again — the correct
      operation is one multiplication, then one subtraction of $1$ at the very
      end.
    expects: "20%"
    rubric:
      - >
        Uses the factors $1.6$ and $0.75$, and reports $1.2$ as $+20\%$ rather
        than $120\%$.
      - >
        Explains why the answer is below the additive $+35\%$: the decline is
        taken on the larger base.
    targets:
      - quant-mental.arithmetic.percent-composition

  - id: qarith-percent-composition-03
    kind: justify
    difficulty: demanding
    statement: >
      Explain why a gain of $p\%$ followed by a loss of $p\%$ always leaves you
      strictly below your starting value for any $p > 0$, give the exact size
      of the shortfall as a percentage in terms of $p$, and say why the order
      of the two moves does not matter.
    answer: >
      The two moves multiply to $(1 + p/100)(1 - p/100) = 1 - (p/100)^{2}$ by
      difference of squares, so the net factor is strictly less than $1$
      whenever $p > 0$, and the shortfall is exactly $p^{2}/100$ percent. At
      $p = 20$ that is $400/100 = 4\%$, matching the familiar $1.2 \times 0.8 =
      0.96$; at $p = 10$ it is only $1\%$, and at $p = 50$ it is a full $25\%$
      — the penalty is quadratic, so it is negligible for small moves and
      brutal for large ones. Order is irrelevant because multiplication of
      scalars commutes: $(1+p/100)(1-p/100)$ and $(1-p/100)(1+p/100)$ are the
      same number. The intuition behind the algebra is that the two moves are
      taken on different bases — the loss is applied to the enlarged value, so
      it removes more absolute value than the gain added. Note that this is
      precisely why the exactly-flat pair is $+25\%$ then $-20\%$: those
      factors, $1.25$ and $0.8$, are reciprocals rather than a symmetric pair.
    rubric:
      - >
        Multiplies the two factors and recognizes the difference of squares,
        landing on the net factor $1 - (p/100)^{2}$.
      - >
        States the shortfall as $p^{2}/100$ percent and notes that it grows
        quadratically in $p$, checking it against a concrete case.
      - >
        Justifies order-independence by the commutativity of multiplication,
        while noting that the *base* each move acts on does differ.
    targets:
      - quant-mental.arithmetic.percent-composition

  # --- percent-of-a-number via easy fractions ----------------------------------

  - id: qarith-percent-quick-fractions-01
    kind: work
    difficulty: demanding
    statement: >
      What is $37.5\%$ of $464$? Use a table fraction rather than multiplying by
      a decimal.
    answer: >
      $174$. Read $37.5\%$ off the eighths: $12.5\% = 1/8$, so
      $37.5\% = 3/8$. Dividing first keeps every step an integer —
      $464/8 = 58$, since $464 = 400 + 64$ and $400/8 = 50$, $64/8 = 8$ — and
      then $3 \times 58 = 174$. Multiplying by $0.375$ instead means a
      three-digit decimal multiplication and an invitation to misplace the
      point. The block route agrees and is a good cross-check:
      $10\% = 46.4$, so $30\% = 139.2$; $5\% = 23.2$ and $2.5\% = 11.6$, and
      $139.2 + 23.2 + 11.6 = 174$. The trap is dividing by the wrong eighth —
      $37.5\%$ is three eighths, not $1/3.75$ — and the size check catches it,
      since three eighths of $464$ must land between a third ($155$) and a half
      ($232$).
    expects: "174"
    rubric:
      - >
        Converts $37.5\%$ to $3/8$ from the table rather than multiplying by
        $0.375$.
      - >
        Divides before multiplying so every intermediate stays an integer:
        $464/8 = 58$, then $\times 3$.
    targets:
      - quant-mental.arithmetic.percent-quick-fractions
    exercises:
      - quant-mental.arithmetic.fraction-decimal

  - id: qarith-percent-quick-fractions-02
    kind: work
    difficulty: standard
    statement: >
      What is $18\%$ of $650$, built from $10\%$, $5\%$ and $1\%$ blocks?
    answer: >
      $117$. The blocks are all shifts and halvings: $10\%$ of $650$ is $65$,
      $5\%$ is half of that, $32.5$, and $1\%$ is $6.5$. Assemble $18\%$ as
      $10\% + 5\% + 3 \times 1\% = 65 + 32.5 + 19.5 = 117$. Building downward
      is just as fast and worth knowing as a check: $20\% = 130$ and
      $2\% = 13$, so $18\% = 130 - 13 = 117$ — one subtraction instead of two
      additions, and the better route whenever the target percentage sits just
      under a round block. The trap is the decimal point on the $1\%$ block:
      $1\%$ of $650$ is $6.5$, not $65$ or $0.65$, and a slip there moves the
      answer by tens.
    expects: "117"
    rubric:
      - >
        Gets the blocks right, in particular $1\%$ of $650 = 6.5$, and combines
        them without multiplying by $0.18$.
      - >
        Recognizes the cheaper complement route $20\% - 2\%$ as a check on the
        same number.
    targets:
      - quant-mental.arithmetic.percent-quick-fractions

  # --- weighted averages by anchor and distance --------------------------------

  - id: qarith-weighted-average-01
    kind: work
    difficulty: demanding
    statement: >
      An order fills in two pieces: $300$ shares at a price of $41.20$ and
      $700$ shares at $41.90$, prices in dollars. What is the average fill
      price? Read the same calculation as an expectation and say what plays the
      role of the probabilities.
    answer: >
      $41.69$. Anchor on the cheaper fill and move a weight-fraction of the gap:
      the gap is $41.90 - 41.20 = 0.70$, the far side carries weight
      $700/1000 = 0.7$, so the average is $41.20 + 0.7 \times 0.70 =
      41.20 + 0.49 = 41.69$. The long form agrees —
      $(300 \times 41.20 + 700 \times 41.90)/1000 = (12360 + 29330)/1000 =
      41.69$ — but costs two four-digit products you never needed. Read as an
      expectation, this is exactly $\mathbb{E}[X] = \sum x\,p(x)$ with the
      normalized weights $0.3$ and $0.7$ playing the part of probabilities:
      picking a share uniformly at random from the filled order gives a price
      $X$ with $\Pr(X = 41.20) = 0.3$, and the average fill price is its mean.
      The trap is anchoring at one price but multiplying by that same side's
      weight — $41.20 + 0.3 \times 0.70 = 41.41$ — which drags the answer toward
      the light side instead of the heavy one. The sanity check is immediate:
      most of the size traded at $41.90$, so the average must sit above the
      midpoint $41.55$.
    expects: "41.69"
    rubric:
      - >
        Moves the *other* side's weight-fraction of the gap: $0.7$ of $0.70$
        from the $41.20$ anchor, not $0.3$.
      - >
        Checks the answer against the midpoint $41.55$ and argues it must lie
        above, since the heavier weight sits at the higher price.
      - >
        Identifies the normalized weights $0.3$ and $0.7$ as the probabilities
        in $\mathbb{E}[X] = \sum x\,p(x)$.
    targets:
      - quant-mental.arithmetic.weighted-average
      - quant-probability.expectation.expectation
    exercises:
      - quant-mental.arithmetic.percent-composition
    connects:
      - "quant-mental.arithmetic.weighted-average ~ quant-probability.expectation.expectation"

  - id: qarith-weighted-average-02
    kind: work
    difficulty: standard
    statement: >
      A book is $35\%$ in a sleeve that returned $+12\%$ and $65\%$ in one that
      returned $-4\%$. What is the total return, as a percentage?
    answer: >
      $+1.6\%$. Anchor at the losing sleeve and walk toward the winner: the gap
      is $12 - (-4) = 16$ percentage points, and the winner carries weight
      $0.35$, so the blend is $-4 + 0.35 \times 16 = -4 + 5.6 = 1.6$, i.e.
      $+1.6\%$. Anchoring at the other end gives the same number, as it must:
      $12 - 0.65 \times 16 = 12 - 10.4 = 1.6$. The gap is the step people get
      wrong when one value is negative — it is $16$, not $8$, because you cross
      zero — and a gap of $8$ would give the wrong $-1.2\%$. Note also that the
      answer is small and positive: the bigger weight sits on the loser, so the
      blend must land much nearer $-4$ than $+12$ — exactly $0.35$ of the way up
      the gap, which is where the heavy-side intuition and the arithmetic meet.
    expects: "1.6%"
    rubric:
      - >
        Computes the gap across zero correctly as $16$ percentage points, not
        $8$.
      - >
        Applies the weight of the value being moved *toward*, and checks the
        answer by anchoring at the other end.
    targets:
      - quant-mental.arithmetic.weighted-average

  - id: qarith-weighted-average-03
    kind: decide
    difficulty: standard
    statement: >
      You are blending $120$ units at a value of $45$ with $30$ units at $85$,
      anchoring at $45$. Which anchor-and-gap step is the correct one?
    answer: >
      Move $30/150 = 1/5$ of the gap $40$, giving $45 + 8 = 53$. The rule is
      $\bar{v} = v_{1} + \frac{w_{2}}{w_{1}+w_{2}}(v_{2}-v_{1})$: the fraction
      you travel is the weight of the value you are travelling *toward*, over
      the *total* weight. Both parts of that are traps. Using the anchor's own
      weight, $120/150 = 4/5$, sends you nearly all the way to $85$ and gives
      $77$ — the exact opposite of what the weights say, since most of the mass
      sits at $45$. Using $30/120$, the other weight rather than the total,
      gives $55$; it is close enough here to survive a careless glance, which
      is what makes it dangerous. The long form settles it:
      $(120 \times 45 + 30 \times 85)/150 = (5400 + 2550)/150 = 7950/150 = 53$.
    choices:
      - text: >
          Move $30/150 = 1/5$ of the gap $40$: $45 + 8 = 53$.
        correct: true
        feedback: >
          Right — the far side's weight over the total weight, applied to the
          gap, added to the anchor.
      - text: >
          Move $120/150 = 4/5$ of the gap $40$: $45 + 32 = 77$.
        feedback: >
          That is the anchor's own weight. It pushes the blend toward the
          lightly weighted value, when four fifths of the mass is at $45$.
      - text: >
          Move $30/120$ of the gap $40$: $45 + 10 = 55$.
        feedback: >
          The denominator must be the *total* weight $150$, not the other
          weight $120$. The answer looks plausible, which is exactly why this
          slip survives.
    rubric:
      - >
        Uses the far side's weight over the total weight — $30/150$, not
        $120/150$ or $30/120$.
      - >
        Sanity-checks the direction: with four fifths of the mass at $45$, the
        blend must sit far nearer $45$ than $85$.
    targets:
      - quant-mental.arithmetic.weighted-average

  # --- divisibility by 3 and 9 -------------------------------------------------

  - id: qarith-divisibility-3-9-01
    kind: work
    difficulty: demanding
    statement: >
      A five-digit number has digits $4$, $7$, $d$, $2$, $9$ in that order, with
      $d$ a single decimal digit. For which $d$ is the number divisible by $9$?
    answer: >
      $d = 5$. The known digits sum to $4 + 7 + 2 + 9 = 22$, so the full digit
      sum is $22 + d$, and divisibility by $9$ asks for $22 + d \equiv 0
      \pmod 9$. Since $22 = 18 + 4$, the sum already sits $4$ past a multiple of
      $9$, so you need $d \equiv -4 \equiv 5 \pmod 9$. The digit choices are
      $0$ through $9$, and only $d = 5$ works: it gives a digit sum of $27$,
      whose own digit sum is $9$. The near-miss $d = 14$ that also solves the
      congruence is not a digit, which is the whole reason the answer is unique
      here. The trap is stopping at divisibility by $3$: $22 + d \equiv 0
      \pmod 3$ admits $d \in \{2, 5, 8\}$, so a candidate who tests the wrong
      modulus finds three answers and cannot tell which is wanted. Check the
      winner: $47529 = 9 \times 5281$.
    expects: "5"
    rubric:
      - >
        Reduces the known digits to $22$ and solves $22 + d \equiv 0 \pmod 9$
        rather than testing all ten digits by long division.
      - >
        Distinguishes the mod-$9$ condition from the weaker mod-$3$ one, which
        would admit $2$, $5$ and $8$.
    targets:
      - quant-mental.arithmetic.divisibility-3-9

  - id: qarith-divisibility-3-9-02
    kind: work
    difficulty: standard
    statement: >
      What is the remainder when $8{,}472{,}615$ is divided by $9$?
    answer: >
      $6$. Because $10 \equiv 1 \pmod 9$, every digit contributes its own face
      value no matter which column it sits in, so the number is congruent to
      its digit sum: $8 + 4 + 7 + 2 + 6 + 1 + 5 = 33$. Reduce again —
      $3 + 3 = 6$ — and since $6$ is already in the range $0$ to $8$, that is
      the remainder. Group the addition to make it painless: $8 + 1 = 9$ and
      $4 + 5 = 9$ both fall out as zeros mod $9$, leaving $7 + 2 + 6 = 15 \to 6$.
      Casting the nines out as you go is faster than summing to $33$ and is the
      habit worth building. The trap is reporting $33$, or reporting the digit
      sum of a number that is itself a multiple of $9$ as $0$ when the
      convention in use writes $9$ — here the value is $6$, so no ambiguity
      arises.
    expects: "6"
    rubric:
      - >
        Justifies the digit-sum rule by $10 \equiv 1 \pmod 9$, so place value
        drops out.
      - >
        Reduces all the way to a single digit in $0$ to $8$, casting out
        matched nines to shorten the addition.
    targets:
      - quant-mental.arithmetic.divisibility-3-9

  - id: qarith-divisibility-3-9-03
    kind: justify
    difficulty: demanding
    statement: >
      Explain why summing the digits decides divisibility by $9$ and by $3$,
      but no digit-sum rule of that kind exists for $7$. Your explanation
      should identify the exact property of the base that the rule depends on.
    answer: >
      Write a number in base ten as $\sum_{k} d_{k} 10^{k}$. Modulo $9$ we have
      $10 \equiv 1$, so $10^{k} \equiv 1^{k} = 1$ for every $k$ and the whole
      sum collapses to $\sum_{k} d_{k}$ — the digit sum — regardless of where
      each digit sits. That is the entire content of the rule: place value
      becomes invisible mod $9$ precisely because the base is one more than the
      modulus. The same argument runs mod $3$ because $3$ divides $9$, so
      $10 \equiv 1 \pmod 3$ as well, and it is why one digit sum answers both
      questions at once. For $7$ the property fails: $10 \equiv 3 \pmod 7$, so
      the powers cycle $1, 3, 2, 6, 4, 5$ with period $6$ instead of staying at
      $1$. Digits in different columns therefore carry different weights, and no
      unweighted sum can work. A *weighted* sum still does — reduce
      $8{,}253$ as $8\cdot6 + 2\cdot2 + 5\cdot3 + 3\cdot1 = 48+4+15+3 = 70$,
      a multiple of $7$ — but nobody wants to memorize a six-term weight cycle
      under time pressure, which is exactly why the practical $7$-test is the
      double-and-subtract recursion instead. The $11$-rule is the other easy
      case for the same structural reason: $10 \equiv -1 \pmod{11}$, so the
      weights alternate $+1, -1$ and the alternating digit sum is the rule.
    rubric:
      - >
        Expands the number as $\sum d_{k}10^{k}$ and uses $10 \equiv 1 \pmod 9$
        to kill every power of ten — the rule is about the base, not the digits.
      - >
        Explains the mod-$3$ case as a consequence of $3 \mid 9$, rather than
        as a separate coincidence.
      - >
        Shows why $7$ fails: $10 \equiv 3 \pmod 7$ has multiplicative order $6$,
        so the column weights cycle instead of being constant — optionally
        contrasting $10 \equiv -1 \pmod{11}$, which gives the alternating sum.
    targets:
      - quant-mental.arithmetic.divisibility-3-9

  # --- divisibility by 4 and 8 -------------------------------------------------

  - id: qarith-divisibility-4-8-01
    kind: work
    difficulty: demanding
    statement: >
      What is the remainder when $7{,}396{,}542$ is divided by $8$?
    answer: >
      $6$. Everything to the left of the last three digits is a multiple of
      $1000$, and $1000 = 8 \times 125$, so the leading $7396$ thousands
      contribute nothing at all modulo $8$. The whole seven-digit number is
      therefore congruent to its trailing block $542$. Now reduce that: $542 =
      480 + 62 = 8 \times 60 + 62$, and $62 = 56 + 6 = 8 \times 7 + 6$, so
      $542 = 8 \times 67 + 6$ and the remainder is $6$. The trap is truncating
      to the wrong length — the last *two* digits, $42$, answer the mod-$4$
      question ($42 = 40 + 2$, remainder $2$) and say nothing reliable about
      mod $8$, because $100$ is not a multiple of $8$. Consistency is worth
      noting: a remainder of $6$ mod $8$ must reduce to $6 \bmod 4 = 2$ mod $4$,
      and it does.
    expects: "6"
    rubric:
      - >
        Discards everything above the last three digits, justified by
        $1000 = 8 \times 125$, rather than dividing the full number.
      - >
        Uses three trailing digits for the mod-$8$ question, not the two that
        answer mod $4$.
    targets:
      - quant-mental.arithmetic.divisibility-4-8

  - id: qarith-divisibility-4-8-02
    kind: work
    difficulty: standard
    statement: >
      What is the remainder when $283{,}514$ is divided by $8$?
    answer: >
      $2$. Only the trailing three digits matter, since $1000$ is a multiple of
      $8$, so the question is what $514$ leaves. The nearest multiple of $8$
      below it is easy to find by halving twice: $514/2 = 257$, $257/2 = 128.5$,
      so $514$ is $4$ times something non-integral and cannot be a multiple of
      $8$; concretely $512 = 8 \times 64$ is the multiple just below, and
      $514 - 512 = 2$. The remainder is $2$. The mod-$4$ answer comes free from
      the last two digits, $14 = 12 + 2$, also a remainder of $2$ — and it must
      agree with the mod-$8$ answer reduced, which it does. The trap is
      reaching for the digit sum: $2+8+3+5+1+4 = 23$ tells you about $9$ and
      $3$, and absolutely nothing about $8$.
    expects: "2"
    rubric:
      - >
        Keeps only the trailing three digits and compares $514$ to the nearby
        power-based multiple $512 = 8 \times 64$.
      - >
        Does not apply a digit-sum rule to a power-of-two modulus.
    targets:
      - quant-mental.arithmetic.divisibility-4-8

  # --- divisibility by 7 and 11 ------------------------------------------------

  - id: qarith-divisibility-7-11-01
    kind: work
    difficulty: demanding
    statement: >
      Use the alternating digit sum to find the remainder when $9{,}174{,}538$
      is divided by $11$.
    answer: >
      $10$. Because $10 \equiv -1 \pmod{11}$, the column weights alternate
      $+1, -1, +1, \ldots$ starting from the units digit, so the number is
      congruent to the alternating digit sum taken from the right:
      $8 - 3 + 5 - 4 + 7 - 1 + 9$. Pair the terms as you sweep to keep the
      running total small — $8 - 3 = 5$, $5 + 5 = 10$, $10 - 4 = 6$, $6 + 7 =
      13$, $13 - 1 = 12$, $12 + 9 = 21$ — giving $21$. Reduce into range:
      $21 - 11 = 10$, so the remainder is $10$, and the number is one short of
      a multiple of $11$. The trap is starting the alternation from the *left*:
      that flips every sign and yields $-21 \equiv 1$, which is the remainder of
      the negative of the number, not of the number. The signs only fall the
      right way when the units digit is the one that gets the $+$, because it
      is $10^{0} = 1$ that has weight $+1$.
    expects: "10"
    rubric:
      - >
        Anchors the alternation at the units digit with a $+$, justified by
        $10 \equiv -1 \pmod{11}$.
      - >
        Reduces the alternating sum $21$ into the range $0$ to $10$ rather than
        reporting $21$.
    targets:
      - quant-mental.arithmetic.divisibility-7-11

  - id: qarith-divisibility-7-11-02
    kind: work
    difficulty: standard
    statement: >
      Apply the double-and-subtract $7$-test to $2{,}954$ twice — strip the last
      digit, double it, subtract from what remains, and repeat once more. What
      number does the second pass leave?
    answer: >
      $14$. First pass: strip the $4$, double it to $8$, and subtract from the
      remaining $295$, giving $295 - 8 = 287$. Second pass: strip the $7$,
      double it to $14$, and subtract from $28$, giving $28 - 14 = 14$. Since
      $14 = 7 \times 2$ is visibly a multiple of $7$, the original number is
      too — confirmed by $2954 = 7 \times 422$. The reason the test is valid is
      worth holding on to: stripping and subtracting turns $10a + b$ into
      $a - 2b$, and $10(a-2b) = (10a + b) - 21b$ differs from the original by a
      multiple of $21$, so the two share divisibility by $7$. The trap is
      expecting the *remainder* to survive: the test preserves only whether $7$
      divides the number, not what is left over, because each pass multiplies
      the residue by an inverse of $10$. Adding instead of subtracting the
      doubled digit is the other common slip, and it breaks the test outright.
    expects: "14"
    rubric:
      - >
        Runs both passes correctly, including re-stripping the *result* of the
        first pass rather than the original number.
      - >
        Notes that the test decides divisibility only — the surviving small
        number is not the remainder mod $7$.
    targets:
      - quant-mental.arithmetic.divisibility-7-11

  # --- digit-sum (mod 9) and last-digit verification ---------------------------

  - id: qarith-digit-checks-01
    kind: work
    difficulty: demanding
    statement: >
      Compute $3{,}069 \times 47$, then verify your product with both the
      casting-out-nines check and the last-digit check. Give the product.
    answer: >
      $144243$. Split the multiplier: $3069 \times 47 = 3069 \times 40 +
      3069 \times 7 = 122760 + 21483 = 144243$. Now the two checks, in the order
      a fast calculator runs them. Casting out nines: $3069$ has digit sum
      $3+0+6+9 = 18 \to 9$, and $47$ has $4+7 = 11 \to 2$, so the product's
      shadow must be $9 \times 2 = 18 \to 9$; the claimed answer's digit sum is
      $1+4+4+2+4+3 = 18 \to 9$, which matches. Last digit: $9 \times 7 = 63$
      ends in $3$, and $144243$ ends in $3$, which matches too. A size check
      seals it — $3000 \times 47 = 141000$, so an answer just above $144000$ is
      the right order of magnitude. The trap is a dropped carry in the partial
      products, which is exactly what these checks are for: writing $122760 +
      21483$ as $143243$ would leave the last digit right and the mod-$9$
      shadow at $8$, and the mismatch would catch it in one second.
    expects: "144243"
    rubric:
      - >
        Produces the product by a clean split — $\times 40$ plus $\times 7$ —
        rather than a full long multiplication.
      - >
        Runs both checks and states what each one concludes: the shadows agree
        at $9$, and the last digits agree at $3$.
    targets:
      - quant-mental.arithmetic.digit-checks
    exercises:
      - quant-mental.arithmetic.divisibility-3-9

  - id: qarith-digit-checks-02
    kind: decide
    difficulty: standard
    statement: >
      A candidate reports $58 \times 46 = 2{,}678$. Which of the two one-second
      checks actually exposes the error?
    answer: >
      Casting out nines does; the last-digit check does not. The operand shadows
      are $5+8 = 13 \to 4$ and $4+6 = 10 \to 1$, so the product's shadow must be
      $4 \times 1 = 4$. The claimed $2678$ has digit sum $2+6+7+8 = 23 \to 5$,
      and $5 \ne 4$, so the claim is provably wrong. The last-digit check is
      silent here: $8 \times 6 = 48$ ends in $8$, and $2678$ does end in $8$, so
      that test passes on a wrong answer — a reminder that it constrains only
      one digit out of four. The true product is $58 \times 46 = 2668$, whose
      digit sum $22 \to 4$ matches the required shadow. The general lesson is
      that the two checks fail in different directions, so running both costs
      nothing and catches strictly more than either alone.
    choices:
      - text: >
          The last-digit check: $8 \times 6 = 48$ ends in $8$, and $2678$ does
          not.
        feedback: >
          $2678$ does end in $8$, so this check passes. It is silent on this
          error.
      - text: >
          Casting out nines: the operand shadows give $4 \times 1 = 4$, but
          $2678$ has shadow $5$.
        correct: true
        feedback: >
          Right — a shadow mismatch is conclusive proof of an error, and here it
          is the only one of the two checks that fires.
      - text: >
          Neither check fires; only recomputing the product finds the error.
        feedback: >
          The mod-$9$ shadows disagree, $4$ against $5$, which settles it
          without recomputing anything.
    rubric:
      - >
        Computes the operand shadows $4$ and $1$ and compares their product to
        the claimed answer's shadow of $5$.
      - >
        Notices that the last-digit check passes on this wrong answer, so a
        pass there proves nothing.
    targets:
      - quant-mental.arithmetic.digit-checks

  - id: qarith-digit-checks-03
    kind: justify
    difficulty: demanding
    statement: >
      A mod-$9$ mismatch proves an arithmetic error, but a match proves nothing.
      Explain why the check is one-directional, estimate roughly what fraction
      of wrong answers slip through it, say what the last-digit check adds and
      what it does not, and name one whole class of errors that neither check
      can ever catch.
    answer: >
      Both checks are homomorphisms into a small quotient. Reduction mod $9$
      respects addition and multiplication, so a correct computation must have
      matching shadows — the contrapositive is the useful half: mismatch implies
      error, with certainty and no false alarms. A match, though, only says the
      answer landed in the correct residue class mod $9$, and there are nine
      classes, so a wrong answer that is otherwise unrelated to the right one
      has roughly a $1$ in $9$ chance — about $11$ percent — of matching by
      luck. The last-digit check is the same idea mod $10$, and it adds
      genuinely independent information because $9$ and $10$ are coprime:
      running both effectively checks mod $90$, cutting the slip-through rate to
      roughly $1$ in $90$. What it does not add is any constraint on the
      leading digits, which is why a size estimate remains worth the second it
      costs. The class neither check can ever catch is a *transposition* of
      digits within the answer: swapping two digits leaves the digit sum
      identical, so the mod-$9$ shadow is unchanged, and if the swap does not
      involve the units digit the last-digit check is unmoved as well —
      miscopying $7362$ as $7632$ passes both tests cleanly. The same blindness
      covers inserting or deleting a zero in the interior, and any error that is
      an exact multiple of $9$ in size.
    rubric:
      - >
        Explains the one-directional logic: reduction mod $9$ is a homomorphism,
        so mismatch is proof of error while a match only pins down one residue
        class out of nine.
      - >
        Estimates the false-pass rate at about $1/9$ for the nines check alone
        and about $1/90$ for both together, arguing that $9$ and $10$ being
        coprime is what makes the two independent.
      - >
        Names transposition of digits — or any error that is a multiple of $9$
        — as invisible to casting out nines, and notes that an interior
        transposition also escapes the last-digit check.
    targets:
      - quant-mental.arithmetic.digit-checks
