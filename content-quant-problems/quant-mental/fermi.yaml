# Problems targeting quant-mental.fermi — decompose, bound, multiply.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. A Fermi estimate is checkable only
# when the statement *gives* the inputs, so every `work` problem here hands over
# its assumptions and grades the number they determine; the `answer` then says
# what a real estimate would have had to guess. No problem reuses a lesson's
# worked example or a card's instance. See ../README.md.

problems:
  # --- decomposition into estimable factors -----------------------------------

  - id: qfermi-decomposition-01
    kind: work
    difficulty: demanding
    statement: >
      Estimate how many mattresses are sold in a country in a year. Assume a
      population of $210$ million at $2.8$ people per household, that $15\%$ of
      households buy at least one mattress in a given year, and that a buying
      household buys $1.4$ mattresses on average. How many mattresses is that,
      in millions?
    answer: >
      $15.75$ million. Build the chain symbolically first: (mattresses per
      year) $=$ (people) $/$ (people per household) $\times$ (fraction of
      households buying) $\times$ (mattresses per buying household). The units
      cancel to a pure count per year, so the shape is right before any number
      is entered. Now substitute: households $= 210\times10^{6}/2.8 =
      75\times10^{6}$; buying households $= 75\times10^{6}\times0.15 =
      11.25\times10^{6}$; mattresses $= 11.25\times10^{6}\times1.4 =
      15.75\times10^{6}$. The trap is applying a *household* purchase rate to
      *people*: $210\times10^{6}\times0.15\times1.4 = 44.1$ million, too large
      by exactly the household size of $2.8$, because the population was never
      converted into buying units. In a real estimate the population and the
      household size are solid to $10\%$ or so, while the $15\%$ replacement
      rate is the shaky factor — it encodes an average mattress lifetime near
      seven years, and anything from five to twelve is defensible.
    expects: "15.75"
    tolerance: 0.4
    rubric:
      - >
        Converts the population into households before applying a per-household
        rate, rather than multiplying the $15\%$ into the headcount.
      - >
        Writes the chain as a product of named factors and checks the units
        cancel to a count per year before substituting numbers.
      - >
        Identifies the $15\%$ replacement rate as the factor carrying most of
        the uncertainty, not the population.
    targets:
      - quant-mental.fermi.decomposition

  - id: qfermi-decomposition-02
    kind: work
    difficulty: standard
    statement: >
      Estimate the number of school buses a state needs. Assume $900{,}000$
      K–12 students, that $55\%$ of them ride a bus, that a bus holds $60$
      students, and that each bus runs $2$ separate routes every morning. How
      many buses?
    answer: >
      $4125$ buses. Riders $= 900{,}000\times0.55 = 495{,}000$. The capacity
      factor is the one that needs care: a bus does not carry $60$ students a
      morning, it carries $60$ students per route and runs $2$ routes, so its
      daily capacity is $60\times2 = 120$ students. Buses
      $= 495{,}000/120 = 4125$. Dropping the second route gives
      $495{,}000/60 = 8250$, exactly twice too many — the classic slip of
      taking a per-trip figure as though it were a per-day figure. A real
      estimate would also have to guess the ridership fraction (rural states
      run far above $55\%$, dense urban districts far below) and note that
      staggered bell times are what make the two-route trick possible at all.
    expects: "4125"
    tolerance: 60
    rubric:
      - >
        Multiplies bus capacity by the number of routes to get a daily
        capacity, rather than dividing riders by the seat count alone.
      - >
        Divides riders by capacity — a count divided by a count-per-bus — and
        checks the result is a number of buses.
    targets:
      - quant-mental.fermi.decomposition

  - id: qfermi-decomposition-03
    kind: decide
    difficulty: standard
    statement: >
      A candidate estimates the disposable diapers a country uses in a year
      from four factors: $4$ million births a year, $2.5$ years spent in
      diapers, $6$ diapers a day, $365$ days a year. They announce $60$
      million. The chain is right; one factor was mishandled. Which slip
      produced $60$ million?
    answer: >
      The $6$-per-day figure was multiplied as though it were $6$ per year, so
      the factor of $365$ never entered. The correct product is
      $4\times10^{6}\times2.5\times6\times365 = 2.19\times10^{10}$, about
      $22$ billion diapers a year. Dropping the $365$ leaves
      $4\times10^{6}\times2.5\times6 = 6\times10^{7}$ — precisely the announced
      $60$ million, and short by a factor of $365$. The other candidate slips
      land elsewhere: dropping the $2.5$-year duration gives
      $4\times10^{6}\times6\times365 = 8.76\times10^{9}$, and dividing by
      $2.5$ instead of multiplying gives $3.5\times10^{9}$ — both still in the
      billions, so neither can explain a number in the tens of millions. The
      order-of-magnitude gap between $10^{7}$ and $10^{10}$ is what identifies
      the missing factor: only a slip worth roughly $10^{2.6}$ fits, and $365$
      is the only factor of that size in the chain.
    choices:
      - text: >
          The daily rate was treated as an annual rate — the factor of $365$
          was never applied.
        correct: true
        feedback: >
          Right: $4\times10^{6}\times2.5\times6 = 6\times10^{7}$ exactly, and
          restoring the $365$ gives $2.19\times10^{10}$.
      - text: >
          The $2.5$-year duration was omitted.
        feedback: >
          That gives $4\times10^{6}\times6\times365 = 8.76\times10^{9}$ —
          still billions, more than a hundred times the announced figure.
      - text: >
          The chain divided by the $2.5$-year duration instead of multiplying
          by it.
        feedback: >
          That gives $3.5\times10^{9}$, off by only $6.25\times$ from the
          truth — nowhere near enough to land at $60$ million.
    rubric:
      - >
        Sizes the gap between the announced number and the correct one
        ($\approx 365\times$) and matches it against the factors in the chain,
        rather than re-deriving the whole estimate.
      - >
        Names the failure as a units slip — a per-day rate used as a per-year
        rate — not as a bad assumption.
    targets:
      - quant-mental.fermi.decomposition

  # --- anchor inventory -------------------------------------------------------

  - id: qfermi-anchor-inventory-01
    kind: work
    difficulty: demanding
    statement: >
      A market-data system records one event every millisecond, around the
      clock, and each event occupies $250$ bytes on disk. Using the anchor
      seconds per year $\approx \pi\times10^{7}$, and taking $1$ terabyte to be
      $10^{12}$ bytes, how many terabytes does a year of recording take?
    answer: >
      $7.85$ terabytes. One event per millisecond is $1000$ events a second, so
      the anchor does the rest: events per year $\approx
      3.14\times10^{7}\times1000 = 3.14\times10^{10}$. At $250$ bytes each that
      is $3.14\times10^{10}\times250 = 7.85\times10^{12}$ bytes, and dividing
      by $10^{12}$ gives $7.85$ terabytes. The anchor is what makes this a
      ten-second calculation: nobody needs $365\times24\times3600 =
      31{,}536{,}000$ when $\pi\times10^{7}$ is within half a percent of it. The trap
      is the millisecond: reading the rate as one event per *second* gives
      $7.85\times10^{9}$ bytes, or $0.00785$ terabytes, a thousand-fold miss
      from a single dropped unit conversion. A real estimate would keep the
      $250$ bytes as the shakiest input — record layouts vary by a factor of
      two or three — while the seconds-per-year anchor is exact enough to
      contribute no error at all.
    expects: "7.85"
    tolerance: 0.25
    rubric:
      - >
        Converts one event per millisecond into $1000$ events per second
        before applying the seconds-per-year anchor.
      - >
        Uses $\pi\times10^{7}$ rather than recomputing
        $365\times24\times3600$, and says why that substitution is safe here.
      - >
        Divides by $10^{12}$ at the end so the answer is in terabytes, not
        bytes.
    targets:
      - quant-mental.fermi.anchor-inventory

  - id: qfermi-anchor-inventory-02
    kind: decide
    difficulty: standard
    statement: >
      Mid-interview you need the *metro* population of a city whose city proper
      holds about $3.5$ million people. You have no memorized figure for its
      metro area. Which estimate should you state, and on what grounds?
    answer: >
      Roughly $7$ to $10$ million, from the anchor that a large city's metro
      area runs about $2$–$3\times$ its city proper. The anchor inventory is
      deliberately short and deliberately coarse: it holds the city-proper
      range ($3$–$8$ million for a large US city), the metro multiplier
      ($2$–$3\times$), household size ($\approx2.5$) and a handful of others,
      each good to one significant figure and no more. Quoting $3.5$ million
      for the metro confuses two different boundaries and understates by the
      whole multiplier; quoting $35$ million applies a factor of $10$ that no
      real metro area reaches outside the very largest in the world. The point
      of stating the multiplier out loud is that an interviewer who prefers
      $2.5\times$ can correct you in one line, and the chain downstream barely
      moves.
    choices:
      - text: >
          About $7$ to $10$ million — the metro area of a large city runs
          $2$–$3\times$ its city proper.
        correct: true
        feedback: >
          Right, and stating the multiplier rather than the product is what
          lets the interviewer redirect it cheaply.
      - text: >
          About $3.5$ million — the city proper is the best figure available.
        feedback: >
          That discards the multiplier entirely and answers a different
          question: city proper and metro area are different boundaries.
      - text: >
          About $35$ million — metro areas are roughly an order of magnitude
          larger.
        feedback: >
          A factor of $10$ overshoots badly; only a handful of the world's
          largest metros approach that ratio to their central city.
    rubric:
      - >
        Reaches for the metro multiplier anchor ($2$–$3\times$) rather than
        for a remembered figure or a fresh guess.
      - >
        Reports the answer as a range at one significant figure, which is all
        the anchor inventory supports.
    targets:
      - quant-mental.fermi.anchor-inventory

  # --- multiplicative errors add on the log scale -----------------------------

  - id: qfermi-log-error-01
    kind: work
    difficulty: demanding
    statement: >
      A four-factor chain has three factors you trust to within a factor of $2$
      either way. The finished estimate must be good to within a factor of
      $20$. Using $\log_{10}2\approx0.301$ and $\log_{10}20\approx1.301$, what
      is the largest multiplicative error the fourth factor may carry?
    answer: >
      A factor of $2.5$. Work the budget in log space, where the errors are
      additive: the target allows a total of $\log_{10}20\approx1.301$, and the
      three known factors consume $3\times0.301 = 0.903$. What remains for the
      fourth is $1.301-0.903 = 0.398$, and converting back gives
      $10^{0.398}\approx2.50$. The check is a sanity one: $2\times2\times2
      \times2.5 = 20$, as it must be, since exponentiating a sum of logs is the
      same as multiplying the errors. The trap is subtracting the error
      *factors* rather than their logs — $20-3\times2 = 14$ is meaningless,
      because multiplicative errors never combine by addition. The practical
      reading is a budget: three clean factors leave room for one genuinely
      soft one, and a fourth factor trusted only to a factor of $5$ would blow
      the target to $40$.
    expects: "2.5"
    tolerance: 0.1
    rubric:
      - >
        Converts the target and the known errors to logs, subtracts there, and
        exponentiates back — never subtracts the raw factors.
      - >
        Verifies the answer by multiplying the four error factors back to the
        target, $2\times2\times2\times2.5 = 20$.
      - >
        Reads the result as a budget for the remaining factor rather than as a
        prediction of the actual error.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.log-error

  - id: qfermi-log-error-02
    kind: decide
    difficulty: standard
    statement: >
      A chain for annual coffee cups multiplies four factors: adult population
      (good to a factor of $1.05$), the fraction of adults who drink coffee
      daily (good to a factor of $1.2$), cups per drinker per day (good to a
      factor of $1.3$), and days per year (exact). You have time to tighten
      exactly one factor. Which one dominates the total uncertainty?
    answer: >
      Cups per drinker per day. Convert each error to its log contribution and
      the ranking is immediate: $\log_{10}1.05\approx0.021$,
      $\log_{10}1.2\approx0.079$, $\log_{10}1.3\approx0.114$, and the exact
      factor contributes $0$. The total budget is
      $0.021+0.079+0.114\approx0.214$, an overall error factor of
      $10^{0.214}\approx1.64$. The cups-per-day factor alone supplies more than
      half of that budget, and the population supplies about a tenth of it, so
      halving the population's error would move the total from $1.64$ to about
      $1.60$ — invisible. This is the practical payoff of working in log
      space: the budget is a sum, so the largest term is visible at a glance,
      and effort spent anywhere else is wasted.
    choices:
      - text: >
          Cups per drinker per day, at $\log_{10}1.3\approx0.114$ — more than
          half the total budget of $0.214$.
        correct: true
        feedback: >
          Right: the log contributions rank the factors directly, and this one
          is the largest term in the sum.
      - text: >
          Adult population, since it multiplies every other factor and so
          scales the whole answer.
        feedback: >
          Every factor multiplies every other — that is what makes the errors
          combine multiplicatively. Its own error, $0.021$, is the smallest
          term in the budget.
      - text: >
          Days per year, since $365$ is the largest number in the chain.
        feedback: >
          The size of a factor has nothing to do with its uncertainty. This
          one is exact, contributing $\log_{10}1 = 0$.
    rubric:
      - >
        Ranks the factors by $\log$ of their error factor, not by the size of
        the factor itself.
      - >
        Notes that the total budget is a sum, so the largest single term is
        where tightening pays.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.log-error

  - id: qfermi-log-error-03
    kind: decide
    difficulty: standard
    statement: >
      An analyst estimates annual pallet-rack inspections in a warehouse as
      ($60{,}000$ racks) $\times$ ($4$-year inspection interval) and reports
      $240{,}000$ inspections a year — $16$ times the correct $15{,}000$. Which
      diagnosis of this failure is right?
    answer: >
      The unit check catches it instantly and the log-error budget never would.
      Racks $\times$ years has units of rack-years, not inspections per year;
      the interval belongs in the denominator, giving
      $60{,}000/4 = 15{,}000$ inspections a year. Because the wrong operation
      both multiplies and divides by the same $4$, the answer is off by
      $4^{2} = 16$. A log-error budget cannot see this: a budget describes the
      drift you expect when honestly-guessed factors are each a little wrong,
      and a chain of five factors each trusted to a factor of $2$ already
      carries a budget near $10^{5\times0.301}\approx30$. A $16\times$ error
      sits comfortably inside that, so the budget would have blessed a
      structural blunder. The two checks are complementary: units catch the
      wrong operation, log-error tracks ordinary magnitude drift, and neither
      substitutes for the other.
    choices:
      - text: >
          The unit check catches it — racks $\times$ years gives rack-years,
          not a rate — while the log-error budget cannot distinguish a
          structural blunder from ordinary drift.
        correct: true
        feedback: >
          Right: units test the shape of the chain, independently of whether
          any number in it is well guessed.
      - text: >
          The log-error budget catches it, since a $16\times$ miss exceeds any
          reasonable budget.
        feedback: >
          A five-factor chain of factor-$2$ guesses has a budget near $30$, so
          $16$ sits inside it. The budget would have raised no objection.
      - text: >
          Neither check helps; only a second, independent decomposition would
          have exposed it.
        feedback: >
          A second path would indeed disagree, but the unit check finds this
          one first and at no cost — before a single number is chosen.
    rubric:
      - >
        Identifies the wrong operation from the units alone, without appealing
        to the plausibility of the final number.
      - >
        Explains that a log-error budget describes drift from honest guessing
        and is silent about a mis-specified chain.
    connects:
      - quant-mental.fermi.dimensional-check ~ quant-mental.fermi.log-error
    targets:
      - quant-mental.fermi.log-error
      - quant-mental.fermi.dimensional-check

  # --- geometric mean of bounds -----------------------------------------------

  - id: qfermi-geometric-mean-bounds-01
    kind: work
    difficulty: demanding
    statement: >
      You are confident a quantity exceeds $8{,}000$ and is under $2$ million,
      with nothing narrower to go on. What is the geometric-mean guess, in
      thousands?
    answer: >
      About $126$ thousand. The product is
      $8\times10^{3}\times2\times10^{6} = 1.6\times10^{10}$, and the square
      root is easiest taken by making the exponent even:
      $\sqrt{16\times10^{9}} = 4\times\sqrt{10^{9}}\approx4\times31{,}623
      \approx126{,}500$. The exponent shortcut agrees:
      $\log_{10}8000\approx3.9$ and $\log_{10}(2\times10^{6})\approx6.3$
      average to $5.1$, and $10^{5.1}\approx126{,}000$. The arithmetic mean
      would say $(8{,}000+2{,}000{,}000)/2 = 1{,}004{,}000$ — a guess sitting
      within half a percent of the upper bound and a full $125\times$ above the
      lower one, which is not a midpoint in any sense that matters when the
      uncertainty is multiplicative. The geometric mean sits $15.8\times$ above
      the lower bound and $15.8\times$ below the upper: equally far from both,
      measured in the only units the bounds were stated in.
    expects: "126.5"
    tolerance: 4
    rubric:
      - >
        Takes $\sqrt{LU}$, or equivalently averages the two exponents, rather
        than $(L+U)/2$.
      - >
        Handles the square root by pairing the mantissa with an even power of
        ten instead of attempting $\sqrt{1.6\times10^{10}}$ directly.
      - >
        Checks the answer is the same multiplicative distance from each bound.
    exercises:
      - quant-mental.fermi.log-error
    targets:
      - quant-mental.fermi.geometric-mean-bounds

  - id: qfermi-geometric-mean-bounds-02
    kind: justify
    difficulty: standard
    statement: >
      Argue why the geometric mean is the right guess between a confident lower
      bound $L$ and a confident upper bound $U$ when the uncertainty is
      multiplicative, and say what would have to be true about the quantity for
      the arithmetic mean to be the better choice instead.
    answer: >
      A Fermi bound is a statement in log space: "surely more than $L$, surely
      less than $U$" means the true value's logarithm lies between $\log L$ and
      $\log U$, and having no further information means treating that interval
      as flat. The natural point estimate of a flat interval is its midpoint,
      $(\log L+\log U)/2$, and exponentiating returns $\sqrt{LU}$ — so the
      geometric mean is the ordinary midpoint, just measured in the coordinate
      the uncertainty actually lives in. The arithmetic mean answers the same
      question in linear coordinates, where a wide bracket is dominated by $U$:
      for $L = 8{,}000$, $U = 2\times10^{6}$ it lands at $1{,}004{,}000$,
      $125\times$ above the lower bound and $2\times$ below the upper, which
      quietly asserts the truth is near the ceiling. The arithmetic mean
      becomes the right choice exactly when the error is additive rather than
      multiplicative — a measurement with a fixed absolute error bar, or a
      bracket only a few percent wide, where $\sqrt{LU}$ and $(L+U)/2$ agree to
      within that width anyway.
    rubric:
      - >
        Frames the bounds as an interval in log space and identifies the
        geometric mean as its midpoint, exponentiated back.
      - >
        Shows concretely that the arithmetic mean of a wide bracket sits near
        the upper bound, and says why that is a substantive claim rather than a
        neutral one.
      - >
        Names the condition under which the arithmetic mean is correct —
        additive, absolute uncertainty, or a bracket narrow enough that the two
        means coincide.
    exercises:
      - quant-mental.fermi.log-error
    targets:
      - quant-mental.fermi.geometric-mean-bounds

  # --- dimensional consistency as a check -------------------------------------

  - id: qfermi-dimensional-check-01
    kind: work
    difficulty: demanding
    statement: >
      A wind farm has $60$ turbines rated at $2.5$ megawatts each, and averages
      $35\%$ of its rated output over the year. A household uses $900$
      kilowatt-hours a month. Taking a year to be $8760$ hours, how many
      households does the farm supply, in thousands?
    answer: >
      About $42.6$ thousand households. Track the units at every step. Rated
      power $= 60\times2.5 = 150$ megawatts; average power
      $= 150\times0.35 = 52.5$ megawatts $= 52{,}500$ kilowatts. Power becomes
      energy only after multiplying by time: $52{,}500\,\text{kW}\times8760
      \,\text{h} = 4.599\times10^{8}$ kilowatt-hours a year. The household
      figure must be annualised to match: $900\times12 = 10{,}800$
      kilowatt-hours a year. Then
      $4.599\times10^{8}/10{,}800\approx42{,}583$ households. The trap is
      comparing a power to an energy — dividing $52{,}500$ kilowatts by $900$
      kilowatt-hours gives a number with units of reciprocal hours, and the
      $58$ it produces is not a count of anything. A real estimate would treat
      the $35\%$ capacity factor as the soft input; onshore sites run from
      $25\%$ to $45\%$, a spread of nearly a factor of two.
    expects: "42.6"
    tolerance: 1.2
    rubric:
      - >
        Multiplies average power by hours to get energy before comparing with a
        household's consumption, rather than dividing power by energy.
      - >
        Puts both sides on the same period — annual kilowatt-hours against
        annual kilowatt-hours — instead of mixing a monthly figure into a
        yearly total.
      - >
        Converts megawatts to kilowatts once, explicitly, so the final division
        is unit-free.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.dimensional-check

  - id: qfermi-dimensional-check-02
    kind: work
    difficulty: standard
    statement: >
      A pipeline moves $40{,}000$ barrels of oil a day. One barrel is $159$
      litres. How many litres per second does the pipeline move?
    answer: >
      About $73.6$ litres per second. Write the conversion as a chain of
      fractions, each arranged so the unit to be cancelled sits in the next
      numerator: $40{,}000\,\dfrac{\text{bbl}}{\text{day}}\times
      159\,\dfrac{\text{L}}{\text{bbl}} = 6.36\times10^{6}\,
      \dfrac{\text{L}}{\text{day}}$, then divide by the seconds in a day,
      $86{,}400$, to get $6.36\times10^{6}/86{,}400\approx73.6$ litres a
      second. Barrels cancel against barrels and days against days, leaving
      litres per second, which is the target unit — so the chain is right
      before the arithmetic is checked. The trap is dividing by $3600$ instead
      of $86{,}400$, which silently answers "litres per second if the daily
      total were pumped in one hour" and gives $1767$, high by exactly $24$.
    expects: "73.6"
    tolerance: 2
    rubric:
      - >
        Writes each conversion as a fraction and confirms barrels and days
        cancel, leaving litres per second.
      - >
        Divides by $86{,}400$ seconds in a day, not by $3600$ seconds in an
        hour.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.dimensional-check

  # --- round every factor to one significant figure ---------------------------

  - id: qfermi-rounding-one-sig-fig-01
    kind: work
    difficulty: demanding
    statement: >
      A chain estimates the charcoal a country burns in a year from four
      factors: $2{,}840{,}000$ households, $43\%$ of which own a barbecue, each
      owning household buying $1.8$ bags a year, at $3.6$ kilograms a bag.
      Round every factor to one significant figure, then multiply. What is the
      rounded estimate, in tonnes?
    answer: >
      $9600$ tonnes. Round first: $2{,}840{,}000\to3\times10^{6}$,
      $0.43\to0.4$, $1.8\to2$, $3.6\to4$. Then multiply in an order that keeps
      the arithmetic trivial:
      $3\times10^{6}\times0.4 = 1.2\times10^{6}$, $\times2 = 2.4\times10^{6}$,
      $\times4 = 9.6\times10^{6}$ kilograms, which is $9600$ tonnes. Carrying
      full precision gives $2.84\times10^{6}\times0.43\times1.8\times3.6
      = 7.91\times10^{6}$ kilograms, or $7913$ tonnes — the rounded answer is
      high by about $21\%$, far inside the factor-of-two uncertainty already
      sitting in the ownership rate and the bags-per-year figure, and it was
      reached without writing anything down. The trap is truncating instead of
      rounding: taking $1.8\to1$ and $3.6\to3$ gives $3.6\times10^{6}$
      kilograms, low by more than a factor of two, and that error is a habit
      rather than noise, so it accumulates in one direction across a long
      chain.
    expects: "9600"
    tolerance: 300
    rubric:
      - >
        Rounds each factor to the nearest single significant figure — $1.8\to
        2$, $3.6\to4$ — rather than truncating downward.
      - >
        Multiplies the rounded factors in a convenient order and reports one
        significant figure, not a spuriously precise decimal.
      - >
        Compares the rounded result with the full-precision one and observes
        the gap is smaller than the uncertainty in the inputs.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.rounding-one-sig-fig

  - id: qfermi-rounding-one-sig-fig-02
    kind: decide
    difficulty: standard
    statement: >
      Three factors are about to be rounded to one significant figure:
      $8{,}700$, a rate of $0.62$, and a count of $1.5$. Which rounding costs
      the most in relative terms, and what does that tell you about when to
      keep a second digit?
    answer: >
      Rounding $1.5$ costs the most. Relative error is what matters, not
      absolute: $8{,}700\to9{,}000$ moves the factor by $3.4\%$, and
      $0.62\to0.6$ by $3.2\%$, but $1.5\to2$ moves it by $33\%$ — an order of
      magnitude worse than either. The reason is structural: one significant
      figure is coarsest near the bottom of a decade, where consecutive single
      digits differ by large fractions ($1\to2$ is a $100\%$ step), and finest
      near the top, where $8\to9$ is only $12\%$. So the rule "one significant
      figure" is safe for a mantissa of $6$ or $9$ and lossy for a mantissa
      near $1.5$ or $2.5$. Even $33\%$ is comfortably inside a factor-of-two
      uncertainty, so none of these roundings will wreck the estimate; but if
      one factor is known much better than the rest, that is exactly the
      factor whose second digit is worth carrying.
    choices:
      - text: >
          The $1.5$, at a $33\%$ relative shift — one significant figure is
          coarsest for mantissas near the bottom of a decade.
        correct: true
        feedback: >
          Right: $1\to2$ is a $100\%$ step, so a mantissa near $1.5$ is where
          one significant figure hurts.
      - text: >
          The $8{,}700$, since it is by far the largest number and so absorbs
          the biggest absolute change.
        feedback: >
          The absolute change is $300$, but the relative change is only
          $3.4\%$ — and only relative error propagates through a product.
      - text: >
          The $0.62$, since rounding a rate distorts every factor it
          multiplies.
        feedback: >
          A rate is no more privileged than any other factor. $0.62\to0.6$ is
          a $3.2\%$ shift, the smallest of the three.
    rubric:
      - >
        Compares the three roundings by relative rather than absolute change.
      - >
        Explains why one significant figure is coarsest for mantissas near $1$
        and finest near $9$.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.rounding-one-sig-fig

  # --- state every assumption out loud ----------------------------------------

  - id: qfermi-stating-assumptions-01
    kind: justify
    difficulty: demanding
    statement: >
      You are asked, live, to estimate the number of bicycles sold in a country
      in a year and you reach $2.4$ million. Set out the assumption ledger you
      would have narrated on the way there, identify the single assumption you
      would flag as shakiest, and explain what a one-line correction from the
      interviewer would cost you at that point versus at the end.
    answer: >
      A narratable ledger names each factor as it is chosen, with its value and
      its grounds: population $\approx60$ million; households
      $\approx60/2.5 = 24$ million; suppose $1$ household in $2$ buys a bicycle
      once a decade, so $2.4$ million households buy in a given year, times
      roughly one bicycle each, giving $2.4$ million. Four assumptions, four
      places the interviewer can intervene. The shakiest is the replacement
      cadence — "once a decade" is a guess spanning perhaps five to twenty
      years, a factor of four, while the population and household size are good
      to $10\%$ and the bicycles-per-purchase figure hardly varies. Flagging it
      explicitly is what converts it from a hidden error into a shared
      assumption. The cost asymmetry is the whole point: corrected at the
      moment it is stated, "make that once every five years" is a one-line
      substitution and the chain continues; discovered at the end, the
      interviewer has no way to tell a deliberate assumption from a slip, and
      the only remedy is to re-run the estimate — spending the scarce resource,
      time, and forfeiting the credit for reasoning that was actually sound.
    rubric:
      - >
        Lists the factors as an ordered ledger with a value and a stated
        ground for each, rather than presenting a single finished number.
      - >
        Picks out one assumption as the dominant uncertainty and quantifies
        roughly how wide it is.
      - >
        Contrasts the cost of an early correction with a late one, and says
        that an unstated assumption is indistinguishable from an error when
        questioned.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.stating-assumptions

  - id: qfermi-stating-assumptions-02
    kind: decide
    difficulty: standard
    statement: >
      A candidate estimating the meals served on commercial flights worldwide
      each day needs a figure for daily flights. Which of these ways of
      supplying it best serves the interview?
    answer: >
      Stating the sub-decomposition — "about $20{,}000$ commercial aircraft,
      each flying roughly $5$ legs a day, so about $100{,}000$ legs" — is the
      one that serves you. All three routes reach the same $10^{5}$, so they
      cannot be told apart by the number; they are told apart by how much of
      the reasoning is exposed. The decomposed version offers two separate
      handles, the fleet size and the legs per aircraft, and an interviewer who
      thinks a modern narrowbody flies six or seven legs a day can correct one
      of them in a sentence without disturbing the other. A flatly asserted
      $100{,}000$ offers no handle at all: it may be right, but it reads as
      recall, and if it is wrong there is nothing to fix, only a number to
      dispute. Explicitly citing memory is the weakest of the three, because it
      declares that no reasoning is available to grade.
    choices:
      - text: >
          "About $20{,}000$ commercial aircraft, each flying roughly $5$ legs a
          day, so about $100{,}000$ legs a day."
        correct: true
        feedback: >
          Right: two named factors, each independently correctable, and the
          product stated so the arithmetic is auditable too.
      - text: >
          "I will take $100{,}000$ flights a day," stated and moved past.
        feedback: >
          It may well be the right figure, but it exposes nothing to correct —
          the interviewer cannot see whether it was reasoned or recalled.
      - text: >
          "The figure is about $10^{5}$ a day; I remember reading it."
        feedback: >
          This is the failure the node names: an appeal to memory offers no
          decomposition, and the decomposition is what is being graded.
    rubric:
      - >
        Judges the three by how much of the reasoning they expose, not by
        whether the number is right — all three land at $10^{5}$.
      - >
        Notes that a decomposed figure gives the interviewer a specific factor
        to redirect at a cost of one line.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.stating-assumptions

  # --- cross-check with a second decomposition --------------------------------

  - id: qfermi-cross-check-second-path-01
    kind: work
    difficulty: demanding
    statement: >
      Estimate daily tea drinking in a country two ways. Demand side: $67$
      million people, each drinking $1.8$ cups a day. Supply side: $95{,}000$
      tonnes of tea leaf consumed a year, at $2.5$ grams of leaf per cup, over
      $365$ days. By what factor do the two daily estimates differ, larger
      divided by smaller?
    answer: >
      About $1.16$. Demand side: $67\times10^{6}\times1.8 = 1.206\times10^{8}$
      cups a day, or $120.6$ million. Supply side: $95{,}000$ tonnes is
      $9.5\times10^{10}$ grams, and at $2.5$ grams a cup that is
      $3.8\times10^{10}$ cups a year; dividing by $365$ gives
      $1.041\times10^{8}$ cups a day, or $104.1$ million. The ratio is
      $120.6/104.1\approx1.16$. Agreement to $16\%$ across two chains that
      share no factor at all — one built from headcount and habit, the other
      from import tonnage and leaf mass — is much stronger evidence than either
      chain alone could supply, because a blunder in one would have to be
      matched by a coincidentally equal blunder in the other. Disagreement by a
      factor of $10$ would have signalled something structural: a tonne
      mistaken for a kilogram, or annual leaf compared against daily cups. Note
      what the check does not do — both paths could share a wrong national
      population, and no amount of cross-checking would reveal it.
    expects: "1.16"
    tolerance: 0.05
    rubric:
      - >
        Puts both paths on the same footing — cups per day against cups per day
        — before comparing, converting the annual supply figure down.
      - >
        Converts tonnes to grams correctly ($10^{6}$ grams per tonne) so the
        leaf mass per cup cancels.
      - >
        Reads a ratio near $1$ as evidence about the order of magnitude, and
        says what a shared wrong assumption would hide from the check.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.cross-check-second-path

  - id: qfermi-cross-check-second-path-02
    kind: justify
    difficulty: standard
    statement: >
      For the number of commercial refrigerators running in a mid-sized city,
      give one construction that is certainly a lower bound and one that is
      certainly an upper bound, then explain what the ratio between them tells
      you and how a second, independent decomposition adds something that
      bounding alone cannot.
    answer: >
      A certain lower bound: every supermarket has at least one, so
      (supermarkets) $\times1$ — for a city of $500{,}000$ at roughly one
      supermarket per $10{,}000$ residents, at least $50$. A certain upper
      bound: no food business can have more than, say, $50$ units, and no city
      of that size has more than one food business per $200$ residents, giving
      at most $2500\times50 = 125{,}000$. The bracket spans a factor of
      $2500$, so its geometric mean, $\sqrt{50\times125{,}000}\approx2500$, is
      the honest guess from bounding alone — and the width of the bracket is
      itself the report: a factor of $2500$ says the bounds are nearly
      uninformative and the estimate needs real structure. A second
      decomposition supplies exactly that structure. Bounds are guaranteed but
      loose, because each is built by pushing every factor to its extreme
      simultaneously; a second path is not guaranteed, but it is a point
      estimate built from different factors, so agreement with the first
      constrains the answer far more tightly than any bracket. The two are
      complementary: bounds cannot be wrong but can be useless, while a second
      path can be wrong but is rarely wrong in the same direction as the first.
    rubric:
      - >
        States a lower bound and an upper bound that are each genuinely
        certain, naming the extreme assumption that makes them so.
      - >
        Reads the width of the bracket as information about how much the
        bounding argument achieved, and takes the geometric mean rather than
        the arithmetic one.
      - >
        Distinguishes a guaranteed-but-loose bound from an unguaranteed-but-
        sharp second decomposition, and says why agreement between independent
        paths is strong evidence.
    exercises:
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.cross-check-second-path

  # --- split into weighted subpopulations -------------------------------------

  - id: qfermi-subpopulation-weighting-01
    kind: work
    difficulty: demanding
    statement: >
      A stadium holds $45{,}000$ people on a match day. Of them, $8\%$ buy a
      full meal of $3$ concession items, $30\%$ buy a single item, and the rest
      buy nothing. How many concession items are sold?
    answer: >
      $24{,}300$ items. Weight each subpopulation by its own rate rather than
      blending: the big spenders are $45{,}000\times0.08 = 3600$ people at $3$
      items each, giving $10{,}800$; the single-item buyers are
      $45{,}000\times0.30 = 13{,}500$ people at $1$ item each, giving
      $13{,}500$; the remaining $62\%$ contribute $0$. The total is
      $10{,}800+13{,}500 = 24{,}300$, which is the weighted average
      $\sum_i w_i r_i = 0.08\times3+0.30\times1+0.62\times0 = 0.54$ items per
      attendee, times $45{,}000$. The trap is averaging the three *rates*
      without their weights: $(3+1+0)/3 = 1.33$ items per attendee gives
      $60{,}000$, high by a factor of $2.5$, because it hands the $8\%$ group a
      full third of the weight. In a real estimate the group shares are the
      soft inputs — the $8\%$ could plausibly be $5\%$ or $15\%$ — while the
      attendance figure is essentially known.
    expects: "24300"
    tolerance: 700
    rubric:
      - >
        Multiplies each group's headcount by that group's own rate and sums,
        rather than applying one blended rate to everyone.
      - >
        Counts the non-buying $62\%$ explicitly at rate $0$, so the weights sum
        to $1$.
      - >
        Recognises the unweighted average of rates as an overestimate here, and
        says why: the smallest group has the largest rate.
    exercises:
      - quant-mental.arithmetic.weighted-average
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.subpopulation-weighting

  - id: qfermi-subpopulation-weighting-02
    kind: decide
    difficulty: standard
    statement: >
      You are estimating the number of airline trips a country's residents take
      in a year. Which split buys you the most accuracy for the least work?
    answer: >
      Split frequent business flyers from everyone else. The gain from
      subdividing a population comes entirely from how skewed the rate is
      across the resulting groups, and air travel is about as skewed as
      consumption gets: a few percent of the population flies twenty or more
      times a year while the median resident flies roughly once, so a two-group
      split of, say, $3\%$ at $20$ trips and $97\%$ at $1$ trip gives
      $0.03\times20+0.97\times1 = 1.57$ trips per resident — well above the
      median and well below the blended guess of $3$ that an unsplit estimate
      would casually adopt. Splitting by age band costs more work and yields
      less, because the rate varies by perhaps a factor of two across bands
      rather than a factor of twenty. A single blended rate does no work at
      all, and its error runs in whichever direction the guesser's intuition
      happened to lean — the classic failure of applying one average to a
      population with a heavy tail.
    choices:
      - text: >
          Frequent business flyers (a few percent, roughly $20$ trips a year)
          against everyone else (about $1$ trip a year).
        correct: true
        feedback: >
          Right: a two-group split along the axis where the rate varies by a
          factor of twenty captures nearly all the available accuracy.
      - text: >
          Five age bands, each with its own trips-per-year rate.
        feedback: >
          Five groups is four times the work for a rate that varies by perhaps
          a factor of two across bands — the wrong axis to split on.
      - text: >
          No split: apply one blended rate of about $3$ trips a year to the
          whole population.
        feedback: >
          That is exactly the failure the node names. A heavy tail makes the
          blended rate a guess with no anchor, and it will typically overstate.
    rubric:
      - >
        Chooses the split axis along which the rate varies most, not the one
        with the most groups.
      - >
        Notes that a heavy-tailed rate is what makes a flat blended average
        unreliable.
    exercises:
      - quant-mental.arithmetic.weighted-average
      - quant-mental.fermi.decomposition
    targets:
      - quant-mental.fermi.subpopulation-weighting

  # --- piano tuners in Chicago: the population-to-providers template ----------

  - id: qfermi-piano-tuners-chicago-01
    kind: work
    difficulty: demanding
    statement: >
      Apply the piano-tuner template to optometrists. A metro area holds $6$
      million people; assume $60\%$ wear corrective lenses and each of those
      has an eye exam once every $2$ years. An optometrist sees $14$ patients a
      day, $5$ days a week, $46$ weeks a year. How many optometrists does the
      metro support?
    answer: >
      About $559$, call it $600$. The template has four blanks — population,
      incidence rate, service frequency, provider capacity — and they fill in
      the same order every time. Demand: $6\times10^{6}\times0.6 =
      3.6\times10^{6}$ lens wearers, each generating $1/2$ an exam a year, so
      $1.8\times10^{6}$ exams a year. Capacity: $14\times5\times46 = 3220$
      exams per optometrist per year. Providers:
      $1.8\times10^{6}/3220\approx559$. The trap is the frequency factor: "once
      every $2$ years" must be *divided* in, not multiplied, and multiplying
      would give $7.2\times10^{6}$ exams and $2236$ optometrists, four times
      too many, because the same erroneous factor of $2$ appears twice over.
      A real estimate would round $559$ straight to $600$ — the incidence rate
      and the patients-per-day figure are each guesses good to perhaps $30\%$,
      so three significant figures assert precision the chain never had.
    expects: "559"
    tolerance: 25
    rubric:
      - >
        Converts "an exam every $2$ years" into a rate of $0.5$ exams a year
        per person, dividing rather than multiplying.
      - >
        Builds provider capacity from a working-year budget
        ($14\times5\times46$) rather than guessing an annual figure directly.
      - >
        Divides annual demand by annual capacity per provider, and rounds the
        result to the one significant figure the inputs support.
    exercises:
      - quant-mental.fermi.anchor-inventory
      - quant-mental.fermi.rounding-one-sig-fig
    targets:
      - quant-mental.fermi.piano-tuners-chicago

  - id: qfermi-piano-tuners-chicago-02
    kind: work
    difficulty: standard
    statement: >
      Same template, chimney sweeps. A metro of $2$ million people at $2.5$
      people per household; assume $1$ household in $10$ has a working
      fireplace and has it swept every $2$ years. A sweep does $3$ jobs a day,
      $5$ days a week, $45$ weeks a year. How many chimney sweeps does the
      metro support?
    answer: >
      About $59$, call it $60$. Households:
      $2\times10^{6}/2.5 = 8\times10^{5}$. Fireplaces:
      $8\times10^{5}/10 = 8\times10^{4}$. Sweepings a year:
      $8\times10^{4}/2 = 4\times10^{4}$. Capacity per sweep:
      $3\times5\times45 = 675$ jobs a year. Sweeps:
      $4\times10^{4}/675\approx59.3$. The chain is the piano-tuner chain with
      different nouns, which is the point of learning it as a template: a
      population converted into units of demand, a frequency turned into an
      annual rate, and a provider capacity built from a working-year budget.
      Forgetting to convert people into households is the usual slip and
      inflates the answer by $2.5\times$ to about $148$ sweeps.
    expects: "59"
    tolerance: 3
    rubric:
      - >
        Divides the population by household size before applying a
        per-household ownership rate.
      - >
        Turns "every $2$ years" into $0.5$ jobs a year per fireplace.
      - >
        Builds the sweep's annual capacity as $3\times5\times45$ rather than
        guessing it.
    exercises:
      - quant-mental.fermi.anchor-inventory
      - quant-mental.fermi.rounding-one-sig-fig
    targets:
      - quant-mental.fermi.piano-tuners-chicago

  - id: qfermi-piano-tuners-chicago-03
    kind: decide
    difficulty: standard
    statement: >
      In the piano-tuner chain — metro population, households, fraction of
      households owning a piano, tunings per piano per year, tunings per tuner
      per year — which factor carries most of the uncertainty in the final
      answer?
    answer: >
      The fraction of households owning a piano. Rank the factors by how wide a
      multiplicative range each honestly deserves. The metro population is an
      anchor good to perhaps $20\%$; household size at $2.5$ is good to $10\%$;
      the tuner's annual capacity, built from $8$ hours a day, $5$ days a week,
      $50$ weeks a year at $2$ hours a tuning, is a working-year budget good to
      maybe $30\%$; the tuning frequency of once a year is a convention good to
      a factor of about $1.5$. The ownership fraction is the outlier: "$1$
      household in $20$" could defensibly be $1$ in $10$ or $1$ in $50$, a
      spread of a factor of $5$, and no lived experience pins it down the way
      the others are pinned. In log terms it contributes about $0.7$ to a total
      budget near $1.0$ — over two-thirds of it — so it is both the factor to
      state most explicitly and the one to tighten first if the interviewer
      offers a figure.
    choices:
      - text: >
          The fraction of households owning a piano — defensibly anywhere from
          $1$ in $10$ to $1$ in $50$, a spread of about $5\times$.
        correct: true
        feedback: >
          Right: it contributes roughly $0.7$ of a total log budget near $1.0$,
          more than every other factor combined.
      - text: >
          The metro population, since it sits at the head of the chain and
          every later factor scales it.
        feedback: >
          Position in the chain does not affect uncertainty — a product does
          not care about order. It is an anchor good to about $20\%$.
      - text: >
          The tuner's annual capacity, since it depends on hours, days and
          weeks all at once.
        feedback: >
          Several factors, but each is well constrained by how a working year
          actually runs; the compounded uncertainty is only about $30\%$.
    rubric:
      - >
        Compares the factors by the multiplicative range each deserves, not by
        their size or their position in the chain.
      - >
        Identifies the ownership fraction as the one factor with no anchor in
        lived experience.
    exercises:
      - quant-mental.fermi.anchor-inventory
      - quant-mental.fermi.rounding-one-sig-fig
    targets:
      - quant-mental.fermi.piano-tuners-chicago

  # --- windows in a city ------------------------------------------------------

  - id: qfermi-windows-in-city-01
    kind: work
    difficulty: demanding
    statement: >
      Estimate the windows in a metro area of $3$ million people at $2.4$
      people per household. Assume $55\%$ of households are apartments with $5$
      windows each and $45\%$ are houses with $13$ windows each, then add a
      further $25\%$ of the residential total for commercial and municipal
      buildings. How many windows, in millions?
    answer: >
      About $13.4$ million. Households:
      $3\times10^{6}/2.4 = 1.25\times10^{6}$. Apartments:
      $0.55\times1.25\times10^{6} = 687{,}500$ at $5$ windows
      $= 3.44\times10^{6}$. Houses:
      $0.45\times1.25\times10^{6} = 562{,}500$ at $13$ windows
      $= 7.31\times10^{6}$. Residential total
      $= 1.075\times10^{7}$; adding $25\%$ gives
      $1.075\times10^{7}\times1.25 = 1.344\times10^{7}$, or $13.4$ million.
      Two traps sit close together. The first is a blended window count: using
      the mean of $5$ and $13$, which is $9$, gives
      $1.25\times10^{6}\times9 = 1.125\times10^{7}$ residential windows, wrong
      because the two housing types do not split evenly. The second is applying
      the commercial $25\%$ to *households* rather than to windows, which adds
      $312{,}500$ instead of $2.7$ million — a units slip that quietly turns a
      building count into a window count. The residential split dominates the
      answer, so it deserves the care; the commercial add-on is a rough
      surcharge and rounding it to $20\%$ or $30\%$ moves the total by less
      than the split does.
    expects: "13.4"
    tolerance: 0.5
    rubric:
      - >
        Applies each housing type's own window count to its own share of
        households, rather than a blended average.
      - >
        Applies the $25\%$ commercial add-on to the residential *window* total,
        not to the household count.
      - >
        Notes that the residential split is the dominant term and the
        commercial surcharge is a rough one.
    exercises:
      - quant-mental.fermi.subpopulation-weighting
      - quant-mental.fermi.anchor-inventory
    targets:
      - quant-mental.fermi.windows-in-city

  # --- weight of a 747 --------------------------------------------------------

  - id: qfermi-weight-of-747-01
    kind: work
    difficulty: demanding
    statement: >
      Estimate the takeoff weight of a regional jet by structure. Model the
      fuselage as a cylindrical shell $30\,\text{m}$ long and $3\,\text{m}$
      across, with aluminium skin $3\,\text{mm}$ thick at a density of
      $2.7\,\text{t/m}^{3}$. Assume wings, engines and internals add $4$ times
      the skin's weight, that the aircraft carries $5$ tonnes of fuel, and that
      $80$ passengers with baggage average $110\,\text{kg}$ each. What is the
      total, in tonnes?
    answer: >
      About $25.3$ tonnes. The skin is a *shell*, so its volume is surface area
      times thickness, not the cylinder's volume: area
      $= \pi\times3\times30\approx283\,\text{m}^{2}$, and at $3\,\text{mm}$
      that is $283\times0.003\approx0.85\,\text{m}^{3}$ of aluminium, weighing
      $0.85\times2.7\approx2.29$ tonnes. Structure is skin plus $4$ times skin,
      so $5\times2.29\approx11.45$ tonnes. Fuel adds $5$ tonnes and payload
      adds $80\times110 = 8800\,\text{kg} = 8.8$ tonnes, for
      $11.45+5+8.8\approx25.3$ tonnes. The trap is filling the cylinder:
      $\pi r^{2}L = \pi\times1.5^{2}\times30\approx212\,\text{m}^{3}$ of
      aluminium would weigh $573$ tonnes, off by a factor of $250$ — and the
      dimensional check catches it, because a skin thickness that never appears
      in the arithmetic means the wrong geometric quantity was computed. A real
      estimate would flag the $4\times$ multiplier as the softest input;
      anything from $3$ to $6$ is defensible, and it moves the answer by
      several tonnes.
    expects: "25.3"
    tolerance: 1.2
    rubric:
      - >
        Computes the skin as surface area times thickness, not as the
        cylinder's full volume — the thickness must appear in the arithmetic.
      - >
        Keeps the three contributions (structure, fuel, payload) in the same
        units before summing, converting the payload from kilograms.
      - >
        Names the structural multiplier as the softest assumption rather than
        the geometry.
    exercises:
      - quant-mental.fermi.dimensional-check
      - quant-mental.fermi.rounding-one-sig-fig
    targets:
      - quant-mental.fermi.weight-of-747

  - id: qfermi-windows-in-city-02
    kind: decide
    difficulty: standard
    statement: >
      The windows-in-a-city chain and the weight-of-an-aircraft chain both end
      in a single number, but they do not compose their factors the same way.
      Which description of the difference is right?
    answer: >
      The windows chain is a weighted sum over subpopulations; the aircraft
      chain is a sum over physically distinct components. In the first, one
      population is split by type and each share is multiplied by its own rate
      — $0.55\times1.25\times10^{6}\times5$ plus
      $0.45\times1.25\times10^{6}\times13$ — so the pieces are shares of one
      whole and the weights must sum to $1$. In the second, structure, fuel and
      payload are separate physical things sized by different arguments
      entirely: geometry times density for the shell, a range-and-burn-rate
      guess for the fuel, a headcount times a mass for the payload. Nothing
      constrains those three to sum to anything in particular, and each could
      be omitted without making the others wrong. What the two share is the
      Fermi discipline — every term is a product of independently guessable
      factors, and every term's units are checked before it joins the sum — but
      neither is a single unbroken product, and treating either as one is how
      an estimator ends up multiplying a share by a component weight.
