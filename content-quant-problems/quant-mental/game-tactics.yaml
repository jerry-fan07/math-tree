# Problems targeting quant-mental.game-tactics — playing a timed round well.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. The tactics here are only worth
# anything if they are *computed*, so every `work` and `decide` problem lands on
# a checked number or a named choice: the expected score a stated strategy
# yields, the pace that maximises points per second, the check that fires. No
# problem reuses a lesson's worked example or a card's instance. See ../README.md.

problems:
  # --- scoring rules ----------------------------------------------------------

  - id: qtact-scoring-rules-01
    kind: work
    difficulty: demanding
    statement: >
      A firm's timed round is advertised as $+8$ for a correct answer, $-2$ for
      a wrong one, and $+1$ for any question you deliberately skip. Every
      tactic in this unit is stated for rules that pay $0$ on a skip, so first
      re-express this round as an equivalent $+a/-b/0$ rule, then report $b/a$
      for the re-expressed rule as a fraction.
    answer: >
      $3/7$. Adding the same constant to all three payoffs shifts your total
      score by that constant times the number of questions on the paper, which
      is fixed before you make a single decision — so no comparison between two
      strategies changes. Subtract the skip value $1$ from each of the three
      payoffs: correct becomes $8 - 1 = 7$, wrong becomes $-2 - 1 = -3$, and the
      skip becomes $1 - 1 = 0$. The normalised rule is $+7/-3/0$, so
      $b/a = 3/7 \approx 0.4286$. The trap is reading $b/a = 2/8 = 1/4$ straight
      off the advertisement, which understates the harshness badly: a
      guaranteed $+1$ for skipping makes a wrong answer cost you $3$ points of
      opportunity, not $2$, and every downstream threshold computed from $1/4$
      would tell you to guess in situations where guessing loses money.
    expects: "3/7"
    tolerance: 0.0005
    rubric:
      - >
        Normalises the skip payoff to $0$ by subtracting it from all three
        outcomes, and says why that is legitimate — the shift moves every
        strategy's total by the same fixed amount.
      - >
        Reports $3/7$, not the advertised $2/8 = 1/4$, and identifies the
        wrong-answer cost as the $3$-point swing away from the skip.
    targets:
      - quant-mental.game-tactics.scoring-rules

  - id: qtact-scoring-rules-02
    kind: decide
    difficulty: standard
    statement: >
      An interviewer describes a timed arithmetic round and then asks whether
      you would guess on a question you are unsure about. Which of the following
      descriptions of the round is enough, on its own, to answer that question?
    answer: >
      Only the third: two points for a right answer, one point off for a wrong
      one, nothing for a skip. The guess-or-skip decision is a comparison of
      expected values, and expected value needs a number attached to each of the
      three outcomes — correct, incorrect, skipped. Nothing else about the round
      enters. A qualitative description like "wrong answers are penalised
      heavily" names no $a$ and no $b$, so it supports no threshold; a total
      point count and a question count give the scale of the paper but say
      nothing about what an individual wrong answer costs; and a penalty quoted
      without its reward is exactly half a rule, since every decision depends on
      the *ratio* $b/a$ and a quarter-point penalty means one thing against a
      one-point reward and something quite different against a ten-point one.
      The habit worth building is stating the rule back before solving: mis-stating
      the question you were asked is the cheapest way to lose a problem you
      could otherwise do.
    choices:
      - text: >
          The round penalises wrong answers heavily, so accuracy matters more
          than speed.
        feedback: >
          This is a mood, not a rule. "Heavily" names no number, so no
          threshold can be computed from it.
      - text: >
          The round is worth $100$ points in total and has $40$ questions.
        feedback: >
          That fixes the scale of the paper, not the payoff of one wrong
          answer. Two rounds with these same totals can have opposite guessing
          thresholds.
      - text: >
          Two points for a right answer, one point off for a wrong one, nothing
          for a skip.
        correct: true
        feedback: >
          Right — all three outcomes carry a number, so $b/a = 1/2$ and every
          tactic downstream is computable.
      - text: >
          You lose a quarter of a point for every wrong answer.
        feedback: >
          Half a rule. A quarter-point penalty against a one-point reward is a
          very different game from a quarter-point penalty against a ten-point
          reward.
    rubric:
      - >
        Names the three payoffs the decision needs — correct, incorrect and
        skipped — and rejects any description missing one of them.
      - >
        Says why a penalty quoted alone is not enough: every tactic depends on
        the ratio $b/a$, so the reward is half the rule.
    targets:
      - quant-mental.game-tactics.scoring-rules

  # --- the guessing threshold -------------------------------------------------

  - id: qtact-guessing-ev-01
    kind: work
    difficulty: demanding
    statement: >
      A round scores $+4$ for a correct answer, $-6$ for a wrong one and $0$ for
      a skip, and you have time to look at all twelve questions. On five of them
      your confidence is $0.9$, on four it is $0.6$, and on three it is $0.3$.
      You attempt exactly those questions whose confidence clears the guessing
      threshold and skip the rest. What is the expected score of that strategy?
    answer: >
      $15$. The threshold is $b/(a+b) = 6/10 = 0.6$, so attempt only where
      confidence strictly exceeds $0.6$. Take the tiers in turn. At $p = 0.9$
      the attempt is worth $0.9(4) - 0.1(6) = 3.6 - 0.6 = 3$ points each, and
      five of them give $15$. At $p = 0.6$ the attempt is worth
      $0.6(4) - 0.4(6) = 2.4 - 2.4 = 0$ — exactly the indifference point the
      threshold names, so those four questions contribute nothing whether you
      answer them or leave them blank. At $p = 0.3$ the attempt is worth
      $0.3(4) - 0.7(6) = 1.2 - 4.2 = -3$ each, so skipping saves $3$ points a
      question and the three of them contribute $0$. Total: $15 + 0 + 0 = 15$.
      The trap is answering everything on the grounds that a blank scores
      nothing: that strategy earns $15 + 0 - 9 = 6$, losing more than half the
      score to three questions you were never going to get.
    expects: "15"
    rubric:
      - >
        Computes the threshold as $b/(a+b) = 0.6$ and applies it tier by tier,
        rather than attempting every question because a skip pays nothing.
      - >
        Weights the penalty by $(1-p)$ inside each tier's expected value, and
        notes that the $p = 0.6$ tier is exactly indifferent so it contributes
        $0$ either way.
    targets:
      - quant-mental.game-tactics.guessing-ev
    exercises:
      - quant-mental.game-tactics.scoring-rules

  - id: qtact-guessing-ev-02
    kind: work
    difficulty: standard
    statement: >
      You are designing a timed round that pays $+1$ for a correct answer and
      $0$ for a skip, and you want a candidate to attempt a question only when
      their confidence exceeds $0.8$. What wrong-answer penalty $b$ makes $0.8$
      the break-even confidence exactly?
    answer: >
      $b = 4$. The break-even confidence under a $+a/-b/0$ rule is
      $b/(a+b)$, so with $a = 1$ the requirement is $b/(1+b) = 0.8$. Clearing
      the denominator gives $b = 0.8 + 0.8b$, so $0.2b = 0.8$ and $b = 4$: the
      round must take four points off for a wrong answer. Check it forward — at
      $p = 0.8$ the attempt is worth $0.8(1) - 0.2(4) = 0.8 - 0.8 = 0$, exactly
      indifferent, and any higher confidence tips it positive. The trap is
      solving $b/a = 0.8$ and answering $b = 0.8$; that rule has a real
      threshold of $0.8/1.8 \approx 0.444$, so it would invite guessing at
      barely better than even odds — nowhere near the bar you wanted to set.
    expects: "4"
    rubric:
      - >
        Sets $b/(a+b) = 0.8$ with $a = 1$ and solves for $b$, rather than
        setting the ratio $b/a$ equal to the target confidence.
      - >
        Verifies forward that $p = 0.8$ gives an expected score of exactly $0$
        under $+1/-4$.
    targets:
      - quant-mental.game-tactics.guessing-ev
    exercises:
      - quant-mental.game-tactics.scoring-rules

  - id: qtact-guessing-ev-03
    kind: decide
    difficulty: standard
    statement: >
      A round scores $+3$ for a correct answer and $-2$ for a wrong one. A
      candidate says: "the ratio $b/a$ is $2/3$, so I attempt only when I am
      more than about $67$ percent sure." What is wrong with that, and what
      follows?
    answer: >
      The candidate has used the wrong ratio. The break-even confidence is
      $b/(a+b) = 2/5 = 0.4$, not $b/a = 2/3$: the denominator is the *swing*
      between being right and being wrong, because attempting moves you from
      $-b$ to $+a$, a distance of $a+b$, not a distance of $a$. Setting the bar
      at $0.67$ when the true bar is $0.4$ means every question in the band
      between them gets skipped, and each of those skips throws away real
      points — at $p = 0.5$, for instance, attempting is worth
      $0.5(3) - 0.5(2) = 1.5 - 1 = 0.5$ points, and the candidate takes $0$
      instead. The error is conservative rather than reckless, which is what
      makes it hard to notice: nothing ever blows up, the score is just quietly
      lower than it should be. The two ratios coincide only in the limit where
      $b$ is negligible against $a$, which is exactly when the decision does not
      matter.
    choices:
      - text: >
          Nothing is wrong — $b/a$ is the standard threshold, and $0.67$ is the
          right bar for this rule.
        feedback: >
          $b/a$ measures how harsh the rule is, but it is not the threshold.
          The threshold divides by the full swing $a+b$.
      - text: >
          The threshold is $b/(a+b) = 0.4$, so the candidate's bar is far too
          high and they will skip questions worth real points.
        correct: true
        feedback: >
          Right — the swing from a wrong answer to a right one is $a+b = 5$, so
          the break-even confidence is $2/5$.
      - text: >
          The threshold is $a/(a+b) = 0.6$, so the candidate's bar is slightly
          too high.
        feedback: >
          The numerator is the penalty, not the reward. A harsher penalty must
          *raise* the bar, and $a/(a+b)$ moves it the wrong way.
      - text: >
          Since a skip scores $0$ and an attempt has positive expected value
          whenever $p > 0$, the candidate should attempt everything.
        feedback: >
          An attempt has positive expected value only when $pa > (1-p)b$; below
          $p = 0.4$ here it is strictly negative.
    rubric:
      - >
        Distinguishes $b/a$, which measures the rule's harshness, from
        $b/(a+b)$, the break-even confidence, and explains that the denominator
        is the swing $a+b$ between a wrong answer and a right one.
      - >
        Names the cost of the candidate's error concretely — questions in the
        band between $0.4$ and $0.67$ get skipped despite positive expected
        value.
    targets:
      - quant-mental.game-tactics.guessing-ev
    exercises:
      - quant-mental.game-tactics.scoring-rules

  # --- eliminating an option --------------------------------------------------

  - id: qtact-partial-credit-guessing-01
    kind: work
    difficulty: demanding
    statement: >
      A four-choice question scores $+1$ for a correct answer and
      $-\tfrac{1}{3}$ for a wrong one. Before reading the options you have no
      information at all. Reading them, you see that two of the four are
      negative numbers while the quantity asked for is a probability, so both
      are impossible; between the two survivors your belief splits three to one
      in favour of the first. What is the expected score of answering the
      favoured option?
    answer: >
      $2/3$. The eliminations are a Bayesian update, not a change to the scoring
      rule: ruling out two options moves their probability onto the survivors,
      and the three-to-one split then puts $p = 3/4$ on the favoured one. Feed
      that into the same expected-score expression the rule always uses:
      $\mathbb{E} = p(1) - (1-p)\tfrac{1}{3} = \tfrac{3}{4} -
      \tfrac{1}{4}\cdot\tfrac{1}{3} = \tfrac{3}{4} - \tfrac{1}{12} =
      \tfrac{9}{12} - \tfrac{1}{12} = \tfrac{8}{12} = \tfrac{2}{3}$. Two
      landmarks put that number in context. A blind guess at $p = 1/4$ is worth
      $\tfrac{1}{4} - \tfrac{3}{4}\cdot\tfrac{1}{3} = 0$, exactly break-even,
      because this rule is calibrated with $b = a/(n-1)$. Eliminating down to
      two survivors with no preference between them gives $p = 1/2$ and a value
      of $\tfrac{1}{2} - \tfrac{1}{2}\cdot\tfrac{1}{3} = \tfrac{1}{3}$. The
      trap is applying the penalty in full rather than weighting it by
      $1-p$, which gives $\tfrac{3}{4} - \tfrac{1}{3} = \tfrac{5}{12}$ and
      understates the attempt.
    expects: "2/3"
    tolerance: 0.0005
    rubric:
      - >
        Treats the two eliminations as an update that redistributes belief onto
        the survivors, arriving at $p = 3/4$ before any scoring arithmetic
        happens.
      - >
        Weights the $-\tfrac{1}{3}$ penalty by $1-p = 1/4$, not applying it in
        full, and lands on $2/3$.
    targets:
      - quant-mental.game-tactics.partial-credit-guessing
      - quant-probability.conditional.bayes
    connects:
      - quant-mental.game-tactics.partial-credit-guessing ~ quant-probability.conditional.bayes
    exercises:
      - quant-mental.game-tactics.guessing-ev

  - id: qtact-partial-credit-guessing-02
    kind: work
    difficulty: standard
    statement: >
      A four-choice test scores $+1$ for a correct answer and $-\tfrac{1}{3}$
      for a wrong one. On each of nine questions you can rule out exactly one
      option and then have no preference among the three that remain, so you
      pick uniformly at random. What is your expected total score across the
      nine questions?
    answer: >
      $1$ point. With one option eliminated and three left, a uniform pick is
      right with probability $p = 1/3$. Each question is then worth
      $\tfrac{1}{3}(1) - \tfrac{2}{3}\cdot\tfrac{1}{3} = \tfrac{1}{3} -
      \tfrac{2}{9} = \tfrac{3}{9} - \tfrac{2}{9} = \tfrac{1}{9}$, and
      expectation adds over the nine questions regardless of how they depend on
      one another, giving $9 \times \tfrac{1}{9} = 1$. The comparison that
      matters is with the blind guess: at $p = 1/4$ the same rule pays
      $\tfrac{1}{4} - \tfrac{3}{4}\cdot\tfrac{1}{3} = 0$, so all nine points of
      expected value came from one elimination per question. The trap is
      concluding from that break-even calibration that guessing "never helps" on
      this test and leaving the nine blank — the calibration is a statement
      about the *blind* guess only, and it stops applying the moment you know
      anything at all.
    expects: "1"
    rubric:
      - >
        Gets $p = 1/3$ from three surviving options and computes
        $\tfrac{1}{9}$ per question rather than reusing the blind-guess value.
      - >
        Adds expectations across the nine questions, and contrasts the total
        with the $0$ a blind guess would have earned.
    targets:
      - quant-mental.game-tactics.partial-credit-guessing
    exercises:
      - quant-mental.game-tactics.guessing-ev

  # --- the shape of the error curve -------------------------------------------

  - id: qtact-speed-accuracy-01
    kind: work
    difficulty: demanding
    statement: >
      You time yourself on four practice blocks and record, for each pace, the
      seconds per question and the error rate in percentage points: $20$
      seconds at $2$, $15$ seconds at $5$, $12$ seconds at $11$, and $10$
      seconds at $26$. For each step to the next-faster pace, compute the
      accuracy cost per second of time saved. By what factor does that cost
      grow from the first step to the last?
    answer: >
      $12.5$. The comparison has to be per second saved, because the steps are
      not the same size. From $20$ to $15$ seconds you save $5$ seconds and pay
      $5 - 2 = 3$ percentage points, a cost of $3/5 = 0.6$ points per second.
      From $15$ to $12$ you save $3$ seconds and pay $11 - 5 = 6$ points, a cost
      of $6/3 = 2$ per second. From $12$ to $10$ you save $2$ seconds and pay
      $26 - 11 = 15$ points, a cost of $15/2 = 7.5$ per second. The growth
      factor from first step to last is $7.5/0.6 = 12.5$: the same second of
      speed costs twelve and a half times as much accuracy at the fast end as
      it does at the slow end, which is the convexity of the curve stated as a
      number. The trap is comparing the raw error jumps, $15$ against $3$, and
      reporting a factor of $5$ — that answer silently credits the last step
      with the same time saving as the first, when it actually bought less than
      half as much time.
    expects: "12.5"
    rubric:
      - >
        Normalises each step by the seconds it actually saves before comparing,
        rather than comparing the raw jumps in error rate.
      - >
        Reports $12.5$ and reads it as convexity — the marginal cost of speed
        rising steeply near the limit, not a constant trade.
    targets:
      - quant-mental.game-tactics.speed-accuracy

  - id: qtact-speed-accuracy-02
    kind: decide
    difficulty: standard
    statement: >
      In a full-length practice round you worked at a deliberate pace, made
      almost no mistakes, and reached only two thirds of the questions before
      time was called. Which reading of the speed–accuracy curve does this
      support?
    answer: >
      You are sitting well below the knee, and the near-zero error rate is the
      evidence. The curve is flat in its slow region: a pace increase there
      costs almost no accuracy, because the errors that speed causes only start
      appearing as you approach your sustainable limit. An error rate near zero
      is therefore not a sign of a well-chosen pace — it is a sign that you have
      bought accuracy you were already going to get, and paid for it with an
      entire third of the paper left blank. The right response is to move
      faster in steps and watch where the error rate first starts to climb
      noticeably, which is where the knee actually is. The two traps in the
      other options are the mirror images of each other: treating a low error
      rate as proof of optimality, and treating the curve as a straight line so
      that any speed-up looks like a proportional accuracy loss. It is precisely
      because the curve is *not* a straight line that the slow region is nearly
      free and the fast region is expensive.
    choices:
      - text: >
          The pace is close to optimal — a near-zero error rate is exactly what
          a well-chosen pace produces.
        feedback: >
          A near-zero error rate is what the flat, slow region produces. It is
          evidence you are below the knee, not at it.
      - text: >
          The pace is well below the knee, where extra speed costs very little
          accuracy, so speeding up should gain far more than it loses.
        correct: true
        feedback: >
          Right — a third of the paper unreached is a large loss, and the flat
          region is where speed is nearly free.
      - text: >
          Any speed increase costs accuracy in proportion, so reaching more
          questions cannot help.
        feedback: >
          That assumes a straight-line curve. The whole point of convexity is
          that the proportion is small when slow and large when fast.
      - text: >
          The unreached third should be filled with blind guesses at the end,
          and the pace left alone.
        feedback: >
          Whether a blind guess pays depends on the scoring rule, and either way
          it does not address a pace sitting far below the knee.
    rubric:
      - >
        Reads a near-zero error rate as evidence of sitting in the flat, slow
        region of the curve rather than as evidence of a well-chosen pace.
      - >
        Weighs the unreached third of the paper against the small accuracy cost
        of speeding up in that region, instead of assuming a straight-line
        trade.
    targets:
      - quant-mental.game-tactics.speed-accuracy

  # --- choosing a pace --------------------------------------------------------

  - id: qtact-optimal-pace-01
    kind: work
    difficulty: demanding
    statement: >
      A round scores $+3$ for a correct answer and $-1$ for a wrong one, and
      questions may be attempted in any order with no time limit per question.
      You have three rehearsed paces: A takes $12$ seconds per question at
      accuracy $0.85$, B takes $8$ seconds at $0.75$, and C takes $5$ seconds at
      $0.55$. Which pace maximises expected points per second, and what is that
      rate?
    answer: >
      Pace B, at $0.25$ points per second. Expected score per question is
      $pa - (1-p)b = 3p - (1-p) = 4p - 1$, so A is worth
      $4(0.85) - 1 = 2.4$ points, B is worth $4(0.75) - 1 = 2$, and C is worth
      $4(0.55) - 1 = 1.2$. Those numbers alone would pick A, and that is the
      trap: what a timed round pays out is points per second, so divide by the
      time each question consumes. A gives $2.4/12 = 0.2$, B gives $2/8 = 0.25$,
      and C gives $1.2/5 = 0.24$ points per second. The maximum sits at B, the
      middle pace — strictly below top speed, because C's accuracy has already
      fallen onto the steep part of the curve, and strictly above the careful
      pace, because A spends half again as long per question to buy accuracy
      that is no longer scarce. Note how close B and C are, $0.25$ against
      $0.24$: the ranking is not visible by eye from the accuracies, which is
      exactly why the rate has to be computed rather than felt.
    expects: "0.25"
    rubric:
      - >
        Divides each pace's expected score per question by its time per
        question, rather than ranking paces by accuracy or by expected score
        alone.
      - >
        Identifies B, the middle pace, and reports $0.25$ points per second —
        noting that the optimum sits strictly below top speed.
    targets:
      - quant-mental.game-tactics.optimal-pace
    exercises:
      - quant-mental.game-tactics.speed-accuracy
      - quant-mental.game-tactics.guessing-ev

  - id: qtact-optimal-pace-02
    kind: justify
    difficulty: standard
    statement: >
      Under time pressure a candidate reasons: "more questions attempted means
      more points, so I should always work at my top sustainable speed."
      Explain why the score-rate criterion refutes this whenever the error curve
      bends up near the limit, and say exactly which way the optimal pace moves
      when the wrong-answer penalty $b$ is doubled with $a$ held fixed.
    answer: >
      The argument treats the numerator of the score rate as if it were
      constant. Expected points per second is
      $(p(v)a - (1 - p(v))b)/t(v)$: raising your speed does shrink $t(v)$, but
      it also shrinks $p(v)$, and near the limit it shrinks $p(v)$ fast. In the
      flat region the numerator barely moves while the denominator falls, so
      speeding up is a clear gain — that part of the candidate's instinct is
      right. Past the knee the numerator falls faster in relative terms than the
      denominator does, and the ratio turns over. The maximum therefore sits
      strictly inside, at the pace where a one percent gain in speed costs
      exactly one percent of the numerator. Convexity is doing the work: if
      $p(v)$ fell linearly with no bend, the accuracy cost of the last second
      would equal the cost of the first and the optimum could genuinely sit at
      the limit. Doubling $b$ moves the optimum slower. Each wrong answer now
      subtracts more, so the numerator is more sensitive to a drop in $p$: the
      accuracy term is weighted more heavily against the time term, and the
      turnover point where they balance arrives at a lower speed. At the other
      extreme, $b = 0$ removes the accuracy penalty from the numerator entirely
      and the criterion collapses toward raw speed — which is why "always go
      flat out" is not simply wrong, but is a statement about a scoring rule the
      candidate has not checked they are playing.
    rubric:
      - >
        Writes the score rate as expected points divided by time per question
        and argues about the *ratio*, not about either factor alone.
      - >
        Uses the convexity of $p(v)$ near the limit to place the maximum
        strictly interior, and says what a straight-line error curve would
        change.
      - >
        Concludes that doubling $b$ shifts the optimum slower, and connects the
        $b = 0$ case to the candidate's claim.
    targets:
      - quant-mental.game-tactics.optimal-pace
    exercises:
      - quant-mental.game-tactics.speed-accuracy
      - quant-mental.game-tactics.scoring-rules

  # --- sequencing -------------------------------------------------------------

  - id: qtact-sequencing-01
    kind: work
    difficulty: demanding
    statement: >
      A round scores $+2$ for a correct answer and $-1$ for a wrong one, and you
      may work the questions in any order. Six questions remain with $300$
      seconds on the clock: four quick ones taking $35$ seconds each at
      confidence $0.85$, and two slow ones taking $110$ seconds each at
      confidence $0.7$. Working in the order that maximises expected score, what
      do you expect to score?
    answer: >
      $7.3$ points. Expected score per question is $2p - (1-p) = 3p - 1$, so a
      quick question is worth $3(0.85) - 1 = 1.55$ and a slow one is worth
      $3(0.7) - 1 = 1.1$. Rank by expected score per second, not per question:
      a quick question returns $1.55/35 \approx 0.0443$ points per second
      against $1.1/110 = 0.01$ for a slow one, more than four times as much, so
      every quick question comes first. Banking all four consumes
      $4 \times 35 = 140$ seconds for $4(1.55) = 6.2$ points and leaves $160$
      seconds, enough for one slow question at $1.1$, so the total is
      $6.2 + 1.1 = 7.3$ with $50$ seconds unused. Compare the paper's printed
      order, which happens to put the slow pair first: those consume $220$
      seconds for $2.2$ points, leaving $80$ seconds for only two quick
      questions at $3.1$, a total of $5.3$. The same six questions and the same
      clock differ by $2$ full points on ordering alone. The trap is judging
      questions by expected score — the slow ones are worth $1.1$ each, which
      looks respectable until you notice that each one costs the time of three
      quick ones.
    expects: "7.3"
    tolerance: 0.0005
    rubric:
      - >
        Ranks by expected score per second rather than by expected score per
        question, and shows the two rates.
      - >
        Runs the clock down explicitly, finding that only one slow question
        fits after the four quick ones, for a total of $7.3$.
    targets:
      - quant-mental.game-tactics.sequencing
    exercises:
      - quant-mental.game-tactics.guessing-ev

  - id: qtact-sequencing-02
    kind: decide
    difficulty: standard
    statement: >
      A firm's online round shows one question at a time, will not let you go
      back, and gives no indication of what is coming next. It scores $+1$
      correct, $-1$ wrong, $0$ skip. Which tactic from this unit still applies,
      and how?
    answer: >
      The guessing threshold still applies question by question; the
      bank-easy-points-first rule does not, because its hypothesis — that you
      may choose the order — has been removed. What survives is the per-question
      decision: at $+1/-1$ the threshold is $b/(a+b) = 1/2$, so attempt whenever
      you lean right at all and skip otherwise. What replaces sequencing is a
      time discipline: since a slow question consumes time that unseen later
      questions could have used, you set a rehearsed cap on how long any single
      question gets and skip out when it is reached, which is the sequential
      version of the same points-per-second logic. The trap here is transporting
      a tactic past its hypothesis — "sort by expected score per second" is a
      statement about a set of questions you can see and reorder, and neither
      condition holds. The opposite trap is the sunk-cost one: having spent
      ninety seconds on a question you cannot return to, the ninety seconds are
      gone whichever way you decide, and only the time still on the clock should
      enter the choice.
    choices:
      - text: >
          Sort the remaining questions by expected score per second and take the
          best first, as usual.
        feedback: >
          There is nothing to sort. Sorting assumes you can see the remaining
          questions and choose the order, and here you can do neither.
      - text: >
          Apply the guessing threshold to each question as it appears, and cap
          the time any single question may take before skipping on.
        correct: true
        feedback: >
          Right — the threshold is a per-question rule and survives intact; the
          time cap is what sequencing turns into when order is forced.
      - text: >
          Attempt every question regardless of confidence, since a skip scores
          $0$ and you cannot come back to it.
        feedback: >
          A skip scores $0$, but a wrong answer scores $-1$. Below $p = 1/2$
          the attempt is strictly worse than the blank.
      - text: >
          Skip every question you cannot finish inside the cap, and never guess
          on it, since the time is already spent.
        feedback: >
          Two decisions get conflated. Stop working the question by all means,
          but the guess itself is free — take it whenever your confidence clears
          $1/2$.
    rubric:
      - >
        Separates the tactic whose hypothesis survives — the per-question
        guessing threshold — from the one whose hypothesis has been removed,
        namely reordering questions you can see.
      - >
        Replaces sequencing with a rehearsed per-question time cap, and does not
        let time already spent enter the decision.
    targets:
      - quant-mental.game-tactics.sequencing
    exercises:
      - quant-mental.game-tactics.guessing-ev

  # --- cheap checks -----------------------------------------------------------

  - id: qtact-cheap-checks-01
    kind: work
    difficulty: demanding
    statement: >
      Working fast, you compute $84 \times 76$ and write down $6284$. Run the
      one-second checks — parity, last digit, rough magnitude, and casting out
      nines — on that answer. Exactly one of them fires. What is the correct
      product?
    answer: >
      $6384$; the mod-$9$ check is the one that fires. Take them in order.
      Parity: $84$ is even, so the product must be even, and $6284$ is even —
      passes. Last digit: $4 \times 6 = 24$, so the product must end in $4$, and
      $6284$ does — passes. Magnitude: $80 \times 80 = 6400$, so the answer
      should sit just under $6400$, and $6284$ does — passes. Casting out nines:
      $84$ has digit sum $12 \equiv 3$ and $76$ has digit sum $13 \equiv 4$, so
      the product must be $3 \times 4 = 12 \equiv 3 \pmod 9$, while $6284$ has
      digit sum $20 \equiv 2$ — fails. The true product is
      $84 \times 76 = 84 \times 70 + 84 \times 6 = 5880 + 504 = 6384$, whose
      digit sum $21 \equiv 3$ agrees. The lesson is that these checks cover
      different failure modes and are not interchangeable: three of the four
      were blind to an error in the tens digit, and a candidate who runs only a
      magnitude estimate and stops would have submitted $6284$ with confidence.
    expects: "6384"
    rubric:
      - >
        Runs all four checks and reports which passes and which fails, rather
        than recomputing the product directly.
      - >
        Gets the mod-$9$ residues right — $3$ and $4$ from the factors, so $3$
        for the product against the claimed answer's $2$.
      - >
        States the correct product $6384$ and confirms it against the same
        checks.
    targets:
      - quant-mental.game-tactics.cheap-checks
    exercises:
      - quant-mental.arithmetic.digit-checks

  - id: qtact-cheap-checks-02
    kind: decide
    difficulty: standard
    statement: >
      A timed question asks for $17$ percent of $240$. Under the clock you
      answer $48$. Which one-second check rejects that answer before you would
      have to redo any arithmetic?
    answer: >
      The bracket check: $10$ percent of $240$ is $24$ and $20$ percent is $48$,
      so $17$ percent must lie strictly between $24$ and $48$ — and $48$ is
      exactly the $20$ percent landmark, so the answer cannot be right. It is
      not a near miss but a signature: landing precisely on a neighbouring
      landmark is what happens when the wrong percentage gets computed, here
      $20$ in place of $17$. The correct value is
      $24 + 7(2.4) = 24 + 16.8 = 40.8$, comfortably inside the bracket. The
      other checks are silent here, which is the point worth carrying away.
      Parity says nothing about a non-integer answer. The last digit of $48$ is
      unremarkable for a percentage of $240$. Magnitude in the loose sense —
      "tens, not hundreds" — passes, since $48$ and $40.8$ have the same order
      of size, and that is exactly why bracketing between two landmarks you can
      compute instantly beats a vague sense that a number "looks about right".
    choices:
      - text: >
          The parity check — $48$ is even, and $17$ percent of an even number
          must be odd.
        feedback: >
          Parity is not defined for the true answer here, which is $40.8$. This
          check has nothing to say about percentages.
      - text: >
          The bracket check — $17$ percent lies strictly between the $10$
          percent landmark of $24$ and the $20$ percent landmark of $48$, and
          $48$ is the endpoint itself.
        correct: true
        feedback: >
          Right — landing exactly on a neighbouring landmark is the signature of
          computing the wrong percentage.
      - text: >
          The magnitude check — $48$ is an order of size too large for $17$
          percent of $240$.
        feedback: >
          It is not. $40.8$ and $48$ are both in the tens, so a loose magnitude
          check passes this answer.
      - text: >
          Casting out nines — the digit sums of $17$, $240$ and $48$ are
          inconsistent.
        feedback: >
          Mod-$9$ arithmetic works on whole-number products. A percentage
          landing on $40.8$ is outside what this check can speak to.
    rubric:
      - >
        Brackets $17$ percent between the $10$ percent and $20$ percent
        landmarks, $24$ and $48$, and notices the answer sits exactly on the
        upper landmark.
      - >
        Says why the other checks are silent here — parity and mod-$9$ do not
        apply to a non-integer answer, and $48$ and $40.8$ share an order of
        size.
    targets:
      - quant-mental.game-tactics.cheap-checks
    exercises:
      - quant-mental.arithmetic.digit-checks

  # --- how much checking to buy -----------------------------------------------

  - id: qtact-verification-budget-01
    kind: work
    difficulty: demanding
    statement: >
      You are working at a rate of $0.24$ points per second on a round that
      scores $+5$ correct and $-3$ wrong. A check that catches a mistake turns a
      wrong answer into a right one, a swing of $a+b$ points, and you judge that
      a particular check catches a mistake with probability $0.15$. How many
      seconds long can that check be and still be worth running?
    answer: >
      Just under $5$ seconds. A check of length $T$ costs you the points you
      would have earned in that time at your working rate, $rT$, and gains you
      the swing it protects times the probability it fires, $q(a+b)$. It pays
      while $q(a+b) > rT$, that is while $T < q(a+b)/r$. Here the swing is
      $a + b = 5 + 3 = 8$ points, so the gain is $0.15(8) = 1.2$ points, and
      the break-even length is $1.2/0.24 = 5$ seconds. Anything shorter is
      profitable; a check running longer than five seconds costs more in
      forgone questions than the mistakes it catches are worth. Two traps sit
      either side of this. Comparing the catch rate against the reward $a = 5$
      alone rather than the swing $a+b = 8$ understates the gain by nearly half,
      because a caught mistake does not merely win $5$ — it also avoids losing
      $3$. And leaving out the rate $r$ entirely makes every check look free,
      which is the reasoning that turns a careful candidate into one who
      finishes half the paper.
    expects: "5"
    rubric:
      - >
        Values a catch at the full swing $a+b = 8$, not at the reward $a$
        alone.
      - >
        Prices the time cost as $rT$ at the working rate and solves
        $q(a+b) > rT$ for $T$, landing on $5$ seconds.
    targets:
      - quant-mental.game-tactics.verification-budget
    exercises:
      - quant-mental.game-tactics.optimal-pace
      - quant-mental.game-tactics.cheap-checks

  - id: qtact-verification-budget-02
    kind: work
    difficulty: standard
    statement: >
      On a round scoring $+2$ correct and $-1$ wrong you are working at $0.3$
      points per second. You are considering a $4$-second check that would catch
      a mistake with probability $0.2$. What is the expected net gain, in
      points, of running that check on one answer?
    answer: >
      $-0.6$ points, so do not run it. The gain side is the probability the
      check fires times the swing it repairs: $0.2 \times (2 + 1) = 0.6$ points.
      The cost side is the time it consumes valued at your working rate:
      $0.3 \times 4 = 1.2$ points of questions you will not reach. The net is
      $0.6 - 1.2 = -0.6$, a loss of six tenths of a point every time you run it.
      A one-second version of the same check would cost only $0.3$ and net
      $+0.3$, which is why the cheap checks earn their place on every answer
      while a long one does not. The trap is treating the check's time as free
      because it feels like diligence: on a timed round every second is priced
      by the rate at which you convert seconds into points, and a check has to
      out-earn that price like anything else.
    expects: "-0.6"
    tolerance: 0.0005
    rubric:
      - >
        Computes both sides — $q(a+b) = 0.6$ against $rT = 1.2$ — rather than
        looking only at what the check might catch.
      - >
        Reports a negative net of $-0.6$ and concludes the check should be
        skipped at this length.
    targets:
      - quant-mental.game-tactics.verification-budget
    exercises:
      - quant-mental.game-tactics.optimal-pace
      - quant-mental.game-tactics.cheap-checks

  # --- composure --------------------------------------------------------------

  - id: qtact-composure-01
    kind: justify
    difficulty: demanding
    statement: >
      A candidate objects: "a pre-committed routine can only lower my expected
      score, since by construction it sometimes overrides the better move I can
      see in front of me." Explain why the objection fails, naming the quantity
      the routine actually improves and the reason the candidate's in-the-moment
      judgement is not the thing they think it is.
    answer: >
      The objection assumes the live judgement it compares against is the same
      quality as the judgement that wrote the routine. It is not. The routine
      was written calmly, with the scoring rule in front of you and no clock
      running; the override is proposed under exactly the pressure that degrades
      decisions, and it is proposed most insistently in the situations where the
      pressure is highest — the question that will not crack, the sudden sense
      of being behind. So the comparison is not "rule versus better move" but
      "rule versus a move chosen by a decision process you have already measured
      as unreliable". Two things follow. First, the routine's benefit is a
      variance reduction: it removes a whole class of improvised choices, and
      the ones it removes are drawn disproportionately from the tail where
      panic-driven shortcuts push you past the knee of the speed-accuracy curve
      without your noticing the accuracy has gone. Second, the candidate is
      right that the expected cost is not zero — a routine does occasionally
      block a genuinely better move, and that is the premium being paid. The
      trade is worth it when the mean cost is small and the variance saved is
      large, which is the usual case for a timed round, and it stops being worth
      it for a routine so rigid it fires in situations it was never designed
      for. An interviewer watching a candidate is reading the same signal: a
      stated default they actually follow is evidence about behaviour under
      pressure, where "I stay calm and push through" is evidence about nothing.
    rubric:
      - >
        Identifies that the routine and the override are produced by decision
        processes of different quality, and that the override arrives precisely
        when the process is worst.
      - >
        Names variance reduction, not higher mean speed, as what the routine
        buys, and links the removed choices to the steep part of the
        speed-accuracy curve.
      - >
        Concedes the real premium — a routine sometimes blocks a better move —
        rather than claiming the routine is free.
    targets:
      - quant-mental.game-tactics.composure
    exercises:
      - quant-mental.game-tactics.speed-accuracy

  - id: qtact-composure-02
    kind: decide
    difficulty: standard
    statement: >
      Twenty minutes into a timed round you realise you are about three
      questions behind the pace you rehearsed, with roughly ninety seconds left.
      Your pulse jumps. What is the composed response?
    answer: >
      Hold the rehearsed pace, work the remaining questions in the order you
      would have anyway, and apply the guessing threshold to each one, accepting
      that some questions will go unattempted. Being behind pace changes nothing
      about which pace maximises points per second: that pace was chosen from
      your error curve and the scoring rule, and neither of those has moved
      because the clock has. Sprinting to catch up is the classic panic
      shortcut — it pushes you past the knee, where the accuracy cost of a
      second is many times what it is in the flat region, so the extra questions
      you reach arrive at an error rate that can make them worth less than
      nothing under a penalty rule. Freezing is the opposite failure and just as
      expensive: skipping the rest to "avoid mistakes" throws away every
      question whose confidence clears the threshold, each of which has strictly
      positive expected value. Going back to recheck banked answers is worse
      still, since a full recheck almost never clears the verification budget's
      bar. The composed move is the boring one, and its being pre-committed is
      what makes it available at the moment you least want to choose it.
    choices:
      - text: >
          Speed up to your maximum for the remaining ninety seconds to close the
          gap.
        feedback: >
          This is the panic shortcut. Past the knee, a second of speed costs
          many times the accuracy it costs in the flat region.
      - text: >
          Hold the rehearsed pace and apply the guessing threshold to each
          remaining question, accepting that some go unattempted.
        correct: true
        feedback: >
          Right — neither the error curve nor the scoring rule changed when the
          clock did, so the optimal pace did not either.
      - text: >
          Skip the rest of the round to avoid making mistakes under pressure.
        feedback: >
          Every remaining question whose confidence clears the threshold has
          strictly positive expected value. Skipping them buys calm with points.
      - text: >
          Stop attempting new questions and spend the ninety seconds rechecking
          the answers already banked.
        feedback: >
          A full recheck of answers you were confident in almost never clears
          the verification budget's bar — that time is worth more on a new
          question.
    rubric:
      - >
        Holds the pace, arguing that neither the error curve nor the scoring
        rule changed when the clock did.
      - >
        Names both failure modes — sprinting past the knee and freezing into a
        blanket skip — and rejects rechecking banked answers on
        verification-budget grounds.
    targets:
      - quant-mental.game-tactics.composure
    exercises:
      - quant-mental.game-tactics.speed-accuracy
