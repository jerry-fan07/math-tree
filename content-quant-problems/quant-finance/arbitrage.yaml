# Problems targeting quant-finance.arbitrage — prices forced by "no free lunch".
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. Every quote, rate and strike here
# is a fresh instance: no lesson worked example or card number is reused. Every
# exponential a reader needs is stated in the problem, amounts are bare numbers
# or "dollars" and never a currency sign, and each answer names the trap — the
# directional bet called arbitrage, the forgotten dividend, the unpaid borrow.
# See ../README.md.

problems:
  # --- the no-arbitrage axiom -------------------------------------------------

  - id: qarb-no-arbitrage-01
    kind: work
    difficulty: demanding
    statement: >
      The same non-dividend stock is quoted on two venues at the same instant.
      Venue A shows a bid of 27.85 for 2000 shares and an ask of 27.88 for 5000
      shares; venue B shows a bid of 27.94 for 3000 shares and an ask of 27.97
      for 1000 shares. Each venue charges the aggressor half a cent per share,
      and shares bought on one venue settle in time to deliver against the sale
      on the other. What is the largest riskless profit available, in dollars?
    answer: >
      $150$. You must cross the correct pair of quotes: buy where you can buy,
      at venue A's ask of 27.88, and sell where you can sell, at venue B's bid
      of 27.94. The gross edge is $27.94 - 27.88 = 0.06$ per share. Both legs
      are aggressive, so you pay the taker fee twice, $0.005 + 0.005 = 0.01$ per
      share, leaving $0.05$ net. Size is capped by the thinner of the two sides
      you actually consume — 5000 offered at A against only 3000 bid at B — so
      the trade is 3000 shares and the profit is $3000 \times 0.05 = 150$. Two
      traps live here. Reading the bid on A against the ask on B gives
      $27.85 - 27.97 < 0$ and the wrong conclusion that nothing is there.
      Ignoring the fees gives $180$, and a mispricing that does not clear its
      own round-trip cost is not an arbitrage at all — here it clears it, but
      only just.
    expects: "150"
    rubric:
      - >
        Buys at the ask on the cheap venue and sells at the bid on the rich
        venue, not bid against bid or ask against ask.
      - >
        Caps the size at the 3000 shares bid on venue B and charges the taker
        fee on both legs before declaring the edge.
    targets:
      - quant-finance.arbitrage.no-arbitrage

  - id: qarb-no-arbitrage-02
    kind: decide
    difficulty: standard
    statement: >
      Four positions are described. Taking each description at face value, which
      one meets the definition of an arbitrage?
    answer: >
      The package that costs nothing today and pays $3$ in one state and $0$ in
      every other. That is the definition exactly: zero cost to put on, a payoff
      never negative, and strictly positive in at least one state. Nothing about
      how likely that state is enters the test — the axiom carries no
      probabilities. The credit of $5$ against a possible loss of $40$ fails on
      the second clause: negative cost today is allowed, but the payoff must
      never be negative, and here one state loses. The bet paying $25$ with
      probability $0.6$ for a cost of $10$ has expected value $15 - 10 = 5$ and
      is simply a good bet; it loses the whole stake four times in ten. The
      share bought at $30$ against a model value of $34$ is a directional view,
      not a riskless trade — calling that arbitrage is the standing red flag in
      an interview, because the model can be wrong and the position can lose.
    choices:
      - text: >
          A package that costs nothing to assemble today and pays $3$ at $T$ in
          one state and $0$ in every other state.
        correct: true
        feedback: >
          Right — zero cost, never negative, strictly positive somewhere. That
          is the whole definition, and no probability appears in it.
      - text: >
          A position entered for a credit of $5$ today whose payoff at $T$ is
          $0$ in most states and $-40$ in one.
        feedback: >
          Negative cost today is fine, but the payoff must never be negative.
          One losing state disqualifies it.
      - text: >
          A bet costing $10$ that pays $25$ with probability $0.6$ and nothing
          otherwise.
        feedback: >
          Expected value $15$ against a cost of $10$ is a good bet, not an
          arbitrage — it loses the stake four times in ten.
      - text: >
          A share bought at $30$ that the buyer's valuation model says is worth
          $34$.
        feedback: >
          A directional view with real downside. Calling this arbitrage is the
          single most common slip in the definition.
    rubric:
      - >
        Applies all three clauses — zero or negative cost, never-negative
        payoff, strictly positive somewhere — rather than checking only one.
      - >
        Separates positive expected value from risklessness, and says why a
        model-based valuation gap is not an arbitrage.
    targets:
      - quant-finance.arbitrage.no-arbitrage

  - id: qarb-no-arbitrage-03
    kind: work
    difficulty: standard
    statement: >
      One bookmaker prices the three mutually exclusive and exhaustive outcomes
      of a match at decimal odds $2.50$, $3.60$ and $4.50$: a stake of $1$ at
      odds $d$ returns $d$ in total if that outcome wins and nothing otherwise,
      and you may back all three. You choose stakes so that the return is
      exactly $1000$ whichever outcome occurs. What riskless profit, in dollars,
      does that set of stakes lock in?
    answer: >
      $100$. To return $1000$ on an outcome quoted at $d$ you must stake
      $1000/d$, so the three stakes are $1000/2.50 = 400$, $1000/3.60 = 277.78$
      and $1000/4.50 = 222.22$. They total $900$, and exactly one outcome wins,
      so the return is $1000$ whatever happens: a certain $1000 - 900 = 100$ on
      an outlay of $900$. Equivalently, the implied probabilities are
      $1/2.50 = 0.4$, $1/3.60 = 0.2778$ and $1/4.50 = 0.2222$, summing to
      $0.90$; a book whose implied probabilities sum to less than one is a Dutch
      book, the betting-shop instance of the no-arbitrage axiom failing. The
      trap is staking equally: $300$ on each returns $750$, $1080$ or $1350$,
      which loses in one state and is therefore not an arbitrage at all. The
      stakes have to be inversely proportional to the odds, which is what makes
      the payoff riskless rather than merely favourable.
    expects: "100"
    rubric:
      - >
        Stakes $1000/d$ on each outcome so the return is the same in every
        state, rather than staking equal amounts.
      - >
        Reads the total outlay $900$ against the certain return $1000$, and
        connects it to implied probabilities summing to $0.90$ rather than one.
    targets:
      - quant-finance.arbitrage.no-arbitrage
      - quant-games.betting-markets.dutch-book
    connects:
      - "quant-finance.arbitrage.no-arbitrage ~ quant-games.betting-markets.dutch-book"

  # --- law of one price -------------------------------------------------------

  - id: qarb-law-of-one-price-01
    kind: justify
    difficulty: demanding
    statement: >
      Portfolios $X$ and $Y$ have identical payoffs in every state at time $T$.
      Prove from the no-arbitrage axiom that they must have the same price at
      every earlier time, exhibiting the trade explicitly. Then say precisely
      what survives of the conclusion when a round trip between $X$ and $Y$
      costs $0.30$ per unit to execute.
    answer: >
      Suppose at some time $t < T$ the prices differ, say $X_t > Y_t$. Sell one
      unit of $X$ and buy one unit of $Y$, banking $X_t - Y_t > 0$ today. At $T$
      the two payoffs are equal in every state, so the short position in $X$ and
      the long position in $Y$ cancel state by state and the portfolio is worth
      exactly zero however the world turns out. The position therefore had
      strictly negative cost and a payoff that is never negative — an arbitrage,
      which the axiom forbids. The symmetric trade rules out $Y_t > X_t$, so
      $X_t = Y_t$. Two corollaries follow immediately: prices are additive, and
      a payoff that is zero in every state is worth zero. With a round-trip cost
      of $0.30$ the equality weakens to a band rather than collapsing: any gap
      strictly larger than $0.30$ is still traded away, so $|X_t - Y_t| \le
      0.30$ must hold, but a quoted gap of $0.20$ can persist indefinitely
      because closing it would cost more than it pays. The theorem is not false
      in a market with frictions; it is true up to the cost of enforcing it.
    rubric:
      - >
        Names the trade — sell the dear portfolio, buy the cheap one — and
        shows the terminal payoffs cancel in every state, not merely on average.
      - >
        Concludes with the no-arbitrage contradiction in both directions, so the
        prices are equal rather than merely ordered.
      - >
        States the frictional conclusion as a no-trade band of width the
        round-trip cost, $|X_t - Y_t| \le 0.30$, rather than abandoning the law.
    targets:
      - quant-finance.arbitrage.law-of-one-price

  - id: qarb-law-of-one-price-02
    kind: work
    difficulty: standard
    statement: >
      An exchange-traded fund holds exactly 2 shares of X and 3 shares of Y per
      unit and nothing else, and authorised participants may create or redeem
      units in kind at any time at no cost. X trades at 41.30, Y trades at
      27.60, and the fund trades at 164.95. What riskless profit, in dollars,
      does one unit's round trip capture?
    answer: >
      $0.45$. The unit and the basket have identical payoffs in every state,
      because in-kind redemption converts one into the other on demand, so the
      law of one price says they must cost the same. The basket costs
      $2 \times 41.30 + 3 \times 27.60 = 82.60 + 82.80 = 165.40$, while the unit
      trades at $164.95$: the fund is cheap by
      $165.40 - 164.95 = 0.45$ per unit. Buy the unit for $164.95$, short 2
      shares of X and 3 of Y for $165.40$, then redeem the unit in kind and
      deliver the shares to close both shorts. Every share position nets to
      zero, nothing is held to expiry, and $0.45$ is banked today. This is the
      additivity corollary doing the work: a package is worth the sum of its
      pieces, and the mechanism that enforces it is the creation-redemption
      right — remove that right, or charge for it, and $0.45$ becomes a
      persistent discount inside the no-trade band rather than an arbitrage.
    expects: "0.45"
    rubric:
      - >
        Prices the basket additively at 165.40 and compares it with the traded
        unit price rather than with either single-name price.
      - >
        Names the in-kind creation or redemption as the mechanism that makes the
        two payoffs identical, and shows all share positions net to zero.
    targets:
      - quant-finance.arbitrage.law-of-one-price

  # --- pricing by replication -------------------------------------------------

  - id: qarb-replication-01
    kind: work
    difficulty: demanding
    statement: >
      Over one period a stock now trading at 96 will be worth either 120 or 90,
      and nothing else can happen. A zero-coupon bond paying 100 at the end of
      that period trades at 96 today. A claim pays 24 if the stock ends at 120
      and 6 if it ends at 90. What is the claim worth today?
    answer: >
      $11.52$. Write the replicating portfolio as $\Delta$ shares plus a face
      amount $B$ of the bond. Matching both states,
      $120\Delta + B = 24$ and $90\Delta + B = 6$; subtracting gives
      $30\Delta = 18$, so $\Delta = 0.6$ and $B = 24 - 0.6 \times 120 = -48$ —
      six tenths of a share, funded partly by shorting 48 face of the bond. The
      bond's price per unit of face is $96/100 = 0.96$, so the portfolio costs
      $0.6 \times 96 - 48 \times 0.96 = 57.60 - 46.08 = 11.52$, and by the law
      of one price that is the claim's price. Check it the other way: the
      discount factor is $0.96$, so the risk-neutral up-weight solves
      $p(120) + (1-p)(90) = 96/0.96 = 100$, giving $p = 1/3$, and
      $0.96 \times (24/3 + 12/3 \cdot 1) = 0.96 \times 12 = 11.52$. The trap is
      weighting the two payoffs by a guessed real-world probability — no
      probability was given and none is needed.
    expects: "11.52"
    tolerance: 0.005
    rubric:
      - >
        Solves the two state equations for the share and bond holdings rather
        than averaging the payoffs under an assumed probability.
      - >
        Prices the bond leg at $0.96$ per unit of face and sums the cost of the
        portfolio to get the claim's price.
    targets:
      - quant-finance.arbitrage.replication
    exercises:
      - quant-finance.arbitrage.law-of-one-price

  - id: qarb-replication-02
    kind: work
    difficulty: standard
    statement: >
      A stock trades at 44 today and over one period moves to either 55 or 40,
      with nothing else possible. The riskless rate is zero over that period.
      The risk-neutral probability of the up move is the weight $p$ that makes
      the expected terminal stock price equal today's price. Give $p$ as an
      exact fraction.
    answer: >
      $4/15$. Solve $55p + 40(1-p) = 44$, which is $40 + 15p = 44$, so
      $15p = 4$ and $p = 4/15 \approx 0.2667$. The weight is forced by the
      requirement that the stock itself be priced correctly under it; every
      other claim on this stock is then priced by the same weights, which is why
      replication and risk-neutral pricing are the same statement written twice.
      Two traps. First, $p$ is not a forecast — nobody believes the stock rises
      with probability $4/15$; it is the weight that removes arbitrage, and the
      real-world probability never enters a no-arbitrage price. Second, do not
      read $p$ off the sizes of the moves, as in $4/15$ versus $11/15$ by
      distance: here the arithmetic happens to agree because the rate is zero
      and the tree has two states, but with a nonzero rate the numerator becomes
      $Se^{rT} - S_d$ and the coincidence disappears.
    expects: "4/15"
    rubric:
      - >
        Sets the weighted average of the two terminal prices equal to today's
        price (undiscounted, since the rate is zero) and solves for $p$.
      - >
        Reports the exact fraction $4/15$ and says $p$ is a pricing weight, not
        a forecast of the up move.
    targets:
      - quant-finance.arbitrage.replication

  - id: qarb-replication-03
    kind: decide
    difficulty: routine
    statement: >
      A claim pays $\max(S_T, 60)$ at time $T$, where $S_T$ is the terminal
      price of a non-dividend stock. Which package replicates it exactly, state
      by state?
    answer: >
      One share plus a European put struck at 60 expiring at $T$. In every
      state that package pays $S_T + \max(60 - S_T, 0)$, which is $S_T$ when
      $S_T \ge 60$ and $60$ when $S_T < 60$ — precisely $\max(S_T, 60)$. This
      is the protective put, and the replication reads as insurance: hold the
      asset and buy the right to sell it at 60. Share plus call pays
      $S_T + \max(S_T - 60, 0)$, which doubles the upside and is wrong above 60.
      Sixty of bond face plus a put pays $60 + \max(60 - S_T, 0)$, which is
      $\max(60, 120 - S_T)$ and blows up as the stock falls. Call plus put at
      the same strike is the straddle, $|S_T - 60|$, which pays nothing at
      $S_T = 60$ and so is not even close. Once the package is identified the
      price follows by additivity: $S + P$, with no distribution of $S_T$ used
      anywhere.
    choices:
      - text: >
          One share plus a European put struck at 60 with the same expiry.
        correct: true
        feedback: >
          Right — the protective put pays $S_T$ above the strike and $60$ below
          it, which is $\max(S_T, 60)$ in every state.
      - text: >
          One share plus a European call struck at 60 with the same expiry.
        feedback: >
          Above 60 that pays $2S_T - 60$, not $S_T$. The call adds upside where
          you needed a floor.
      - text: >
          60 face value of zero-coupon bonds maturing at $T$, plus a European
          put struck at 60.
        feedback: >
          That pays $\max(60, 120 - S_T)$ — it grows as the stock falls, which
          the target payoff never does.
      - text: >
          A European call struck at 60 plus a European put struck at 60.
        feedback: >
          The straddle pays $|S_T - 60|$, which is zero at $S_T = 60$ where the
          target pays 60.
    rubric:
      - >
        Writes the target payoff piecewise in $S_T$ and checks a candidate
        package in both regions rather than only one.
      - >
        Identifies the protective put and notes that the price then follows by
        additivity, with no distribution assumed.
    targets:
      - quant-finance.arbitrage.replication

  # --- what relative pricing does and does not buy ----------------------------

  - id: qarb-relative-pricing-01
    kind: decide
    difficulty: demanding
    statement: >
      Four desks each describe a trade as an arbitrage. Taking every description
      at face value, which one actually is one?
    answer: >
      The box spread bought below its discounted value. A box built from
      European options at strikes 80 and 95 with a common expiry pays exactly
      $95 - 80 = 15$ at expiry in every state, so it is a synthetic zero-coupon
      bond; buying it at $14.20$ when the discounted value of that certain 15 is
      $14.55$ is buying a known cash flow for less than its price, and holding
      to expiry needs no view about anything. The merger trade is deal risk —
      the spread is compensation for the chance the deal breaks, and it can lose
      badly. The stock at 22 against a model value of 27 is a directional bet
      dressed in a valuation. Selling an option above model value and delta
      hedging leaves gamma, vega and discrete-hedging error on the book, and a
      trade whose profit depends on the model being right is exactly what
      arbitrage is not. The distinction interviewers test: an arbitrage is
      riskless and self-financing by construction, not favourable on average.
    choices:
      - text: >
          Buy a box spread on European options, strikes 80 and 95, common
          expiry, for 14.20 when the discounted value of its certain 15 payoff
          is 14.55, and hold to expiry.
        correct: true
        feedback: >
          Right — the payoff is 15 in every state, so this is a bond bought
          cheap. No model, no view, no path risk.
      - text: >
          Long the target and short the acquirer in an announced all-stock
          merger at a 3 percent spread, held to close.
        feedback: >
          The spread is payment for deal risk. If the deal breaks the loss is
          large, so the payoff is not never-negative.
      - text: >
          Buy a stock at 22 that a discounted-cash-flow model values at 27 and
          wait for the gap to close.
        feedback: >
          Relative pricing never tells you the underlying is cheap. This is a
          directional view with a model attached.
      - text: >
          Sell a one-year option for 4.00 whose model value is 3.10, and delta
          hedge daily.
        feedback: >
          Delta hedging leaves gamma, vega and discretisation risk, and the edge
          exists only if the model is right. Not riskless.
    rubric:
      - >
        Tests each trade against the riskless, self-financing definition rather
        than against expected profit.
      - >
        Identifies the box as a synthetic bond with a state-independent payoff,
        and names the specific risk that disqualifies each of the other three.
    targets:
      - quant-finance.arbitrage.relative-pricing

  - id: qarb-relative-pricing-02
    kind: decide
    difficulty: standard
    statement: >
      A fund puts on a convergence trade it is certain will pay off at expiry
      and finances it on margin. The spread widens first, the position is marked
      to market, the fund meets two margin calls and is then forced to unwind at
      a loss — well before the date on which the trade was guaranteed to
      converge. Which limit to arbitrage does this illustrate?
    answer: >
      Financing and mark-to-market risk: the trade was riskless at expiry but
      not along the path, and the fund had to be able to hold it to get paid.
      Nothing about the terminal payoff was wrong, and the law of one price is
      not contradicted — the position would have converged. What failed is an
      assumption the frictionless model makes silently, that you can borrow
      freely and in unlimited size at the riskless rate, which in practice means
      posting variation margin against every adverse move. This is why textbook
      arbitrages survive on real screens: capital is finite, and a mispricing
      that widens before it narrows can bankrupt the trader who is right. It is
      not a borrow recall, which is the separate failure of the costless
      short-sale assumption on the short leg, and it is certainly not evidence
      the trade had negative expected value — the fund's arithmetic was correct
      and it still lost.
    choices:
      - text: >
          Financing and margin: the payoff was riskless at expiry but not along
          the path, and the fund had to survive to collect it.
        correct: true
        feedback: >
          Right — free unlimited borrowing is one of the standing frictionless
          assumptions, and mark-to-market margin is exactly where it fails.
      - text: >
          The law of one price is simply false in practice.
        feedback: >
          The spread would have converged. The law held; the fund's balance
          sheet did not.
      - text: >
          The trade had negative expected value from the start.
        feedback: >
          Its terminal payoff was positive and certain. The loss came from being
          forced out early, not from bad odds.
      - text: >
          Short-sale constraints: the borrow on the cheap leg was recalled.
        feedback: >
          Borrow recall is a real limit to arbitrage, but a different one —
          nothing here was recalled, the position was margined out.
    rubric:
      - >
        Names the failing frictionless assumption — free unlimited borrowing —
        rather than blaming the pricing relation.
      - >
        Distinguishes path risk before convergence from the terminal payoff, and
        separates margin pressure from borrow recall.
    targets:
      - quant-finance.arbitrage.relative-pricing

  # --- forward price by cash and carry ----------------------------------------

  - id: qarb-forward-pricing-01
    kind: work
    difficulty: demanding
    statement: >
      A non-dividend asset with no storage cost trades at 48. The riskless rate
      is 3 percent continuously compounded and you are long a forward on the
      asset struck at $K = 53$ with exactly two years left to delivery. Take
      $e^{rT} = e^{0.06} = 1.061837$, so $e^{-rT} = 0.941765$. What is that
      existing contract worth today?
    answer: >
      $-1.91$. First the fair forward for two-year delivery:
      $F = Se^{rT} = 48 \times 1.061837 = 50.97$. Your contract obliges you to
      pay 53 for something the market will hand over for 50.97, so it is a
      liability, and an existing forward struck at $K$ is worth
      $(F - K)e^{-rT} = (50.97 - 53) \times 0.941765 = -1.91$. The same number
      falls out of replication directly:
      $S - Ke^{-rT} = 48 - 53 \times 0.941765 = 48 - 49.91 = -1.91$, because a
      long forward is one unit of the asset minus $K$ of bonds. The trap is
      quoting $F - K = -2.03$ and forgetting to discount: the difference is paid
      at delivery, not today, so its present value is smaller in magnitude. A
      second trap is refusing a negative answer — a forward can certainly be a
      liability once the market has moved away from its strike, which is exactly
      why only a newly struck forward at $K = F$ is worth zero.
    expects: "-1.91"
    tolerance: 0.005
    rubric:
      - >
        Computes the fair forward $F = Se^{rT} = 50.97$ before touching the
        existing strike.
      - >
        Discounts the difference, $(F - K)e^{-rT}$, or equivalently prices
        $S - Ke^{-rT}$ directly, and reports the negative value.
    targets:
      - quant-finance.arbitrage.forward-pricing
    exercises:
      - quant-finance.arbitrage.replication

  - id: qarb-forward-pricing-02
    kind: justify
    difficulty: standard
    statement: >
      An asset pays no income and costs nothing to store, the riskless rate is
      $r$ continuously compounded, borrowing and short selling are free, and
      delivery is at $T$. Prove that $F = Se^{rT}$ is the only arbitrage-free
      forward price by exhibiting the trade that profits whenever $F$ exceeds
      that level and the trade that profits whenever it falls short.
    answer: >
      Suppose $F > Se^{rT}$. Borrow $S$, buy one unit of the asset, and sell one
      forward — all three legs cost nothing today, since the loan funds the
      purchase and entering a forward is free. At $T$ deliver the asset against
      the forward for $F$ and repay $Se^{rT}$, keeping $F - Se^{rT} > 0$ with
      certainty in every state. That is cash and carry, and it is an arbitrage,
      so the axiom rules the price out. Now suppose $F < Se^{rT}$. Short one
      unit of the asset for $S$, lend the proceeds, and buy one forward; again
      nothing is paid today. At $T$ collect $Se^{rT}$ from the loan, take
      delivery at $F$, and return the borrowed unit, keeping
      $Se^{rT} - F > 0$ with certainty. That is the reverse cash and carry. Both
      inequalities are excluded, so $F = Se^{rT}$. Note what the proof needs and
      what it does not: it needs free borrowing, a costless short, and an asset
      that neither pays nor costs anything to hold, but no distribution for
      $S_T$ anywhere — which is why $F$ is today's spot carried forward and not
      a forecast of the future price.
    rubric:
      - >
        Gives both trades explicitly, each with zero cost today and a strictly
        positive certain payoff at $T$, and concludes by excluding both
        inequalities.
      - >
        Names the assumptions the argument leans on — free borrowing and
        lending, costless short selling, no income and no storage cost.
      - >
        Says $F$ is not a forecast of $S_T$: no probability appears in the
        argument.
    targets:
      - quant-finance.arbitrage.forward-pricing

  # --- cash and carry, both directions ----------------------------------------

  - id: qarb-cash-and-carry-01
    kind: work
    difficulty: demanding
    statement: >
      A non-dividend share trades at 145 and the riskless rate is 4 percent
      continuously compounded; take $e^{rT} = e^{0.02} = 1.020201$ for the
      six-month horizon. A forward for delivery in six months is quoted at
      145.50. Borrowing the share for those six months costs a fee of 0.60,
      payable at delivery. What riskless profit per share, in dollars, does the
      trade lock in?
    answer: >
      $1.83$. The fair forward is
      $F = 145 \times 1.020201 = 147.93$, so at 145.50 the forward is cheap and
      the trade is the reverse cash and carry: short the share for 145, lend the
      proceeds at 4 percent, and buy the forward at 145.50. Nothing is paid
      today. At delivery the loan returns
      $145 \times 1.020201 = 147.93$, you pay 145.50 to take delivery of the
      share and return it to the lender, and you pay the 0.60 borrow fee. The
      profit is $147.93 - 145.50 - 0.60 = 1.83$ per share, certain in every
      state. The trap the question is built around is quoting $2.43$ by
      forgetting the borrow: the short leg of a reverse cash and carry is not
      free, and the fee is precisely why cheap forwards persist longer than rich
      ones. Note that the direction matters too — running the ordinary cash and
      carry here, borrowing to buy the share and selling the forward at 145.50,
      loses $2.43$ with certainty.
    expects: "1.83"
    tolerance: 0.005
    rubric:
      - >
        Compares the quoted 145.50 with the fair forward 147.93 and chooses the
        reverse cash and carry — short the share, lend, buy the forward.
      - >
        Subtracts the 0.60 borrow fee from the gross edge of 2.43 before
        reporting the profit.
    targets:
      - quant-finance.arbitrage.cash-and-carry
    exercises:
      - quant-finance.arbitrage.forward-pricing

  - id: qarb-cash-and-carry-02
    kind: work
    difficulty: standard
    statement: >
      A non-dividend share trades at 210, the riskless rate is 5 percent
      continuously compounded, and a one-year forward is quoted at 224.00.
      Financing and short sales are free. Take $e^{rT} = e^{0.05} = 1.051271$.
      What riskless profit per share, in dollars, does the trade lock in?
    answer: >
      $3.23$. The fair forward is
      $F = 210 \times 1.051271 = 220.77$, and the market is quoting 224.00, so
      the forward is rich and the trade is the ordinary cash and carry: borrow
      210, buy the share, and sell the forward at 224.00. The three legs net to
      zero cash today. At delivery you hand over the share you already own,
      collect 224.00, and repay the loan of
      $210 \times 1.051271 = 220.77$, keeping
      $224.00 - 220.77 = 3.23$ in every state — you never had to guess where the
      share would trade. Two traps. Comparing the forward with the spot rather
      than with the carried spot gives $224.00 - 210 = 14.00$ and hugely
      overstates the edge, because carrying the share for a year genuinely costs
      the interest. And selling the share instead of buying it here would lock
      in a certain loss of 3.23: the rich side is the one you sell, and here
      that is the forward, not the stock.
    expects: "3.23"
    tolerance: 0.005
    rubric:
      - >
        Computes the fair forward 220.77 and identifies the quoted forward as
        rich, so the share is bought and the forward sold.
      - >
        Nets the delivery proceeds against the loan repayment, not against the
        original spot price.
    targets:
      - quant-finance.arbitrage.cash-and-carry

  # --- cost of carry ----------------------------------------------------------

  - id: qarb-cost-of-carry-01
    kind: work
    difficulty: demanding
    statement: >
      A share trades at 96 and will pay a single known dividend of 3.00 in
      exactly six months. The riskless rate is 5 percent continuously
      compounded and the forward is for delivery in one year. Take
      $e^{-0.025} = 0.975310$ and $e^{0.05} = 1.051271$. What is the fair
      forward price?
    answer: >
      $97.85$. The holder of the physical share collects the dividend and the
      forward holder does not, so only the ex-dividend part of the spot has to
      be carried:
      $F = (S - \operatorname{PV}(D))e^{rT}$. The dividend is paid at six
      months, so it is discounted over half a year:
      $\operatorname{PV}(D) = 3.00 \times 0.975310 = 2.93$. Then
      $F = (96 - 2.93) \times 1.051271 = 93.07 \times 1.051271 = 97.85$,
      comfortably below the $96 \times 1.051271 = 100.92$ a non-dividend share
      would command. Two traps sit either side of the right answer. Subtracting
      the raw 3.00 instead of its present value gives
      $93 \times 1.051271 = 97.77$ — close enough to look right and wrong for
      the reason that matters, since the dividend arrives before delivery.
      Adding the dividend rather than subtracting it gives 104.09 and inverts
      the economics: income you receive while carrying the asset reduces what
      the forward must cost, it does not increase it.
    expects: "97.85"
    tolerance: 0.005
    rubric:
      - >
        Discounts the dividend to today over its own six-month horizon before
        subtracting it from the spot.
      - >
        Carries the ex-dividend spot forward over the full year at $e^{rT}$ and
        gets a forward below the no-dividend value.
    targets:
      - quant-finance.arbitrage.cost-of-carry

  - id: qarb-cost-of-carry-02
    kind: work
    difficulty: standard
    statement: >
      An equity index trades at 500 and pays a continuous dividend yield of
      $q = 2.2\%$. The riskless rate is $r = 4.7\%$ continuously compounded,
      there is no storage cost, and delivery is in two years. Take
      $e^{0.05} = 1.051271$. What is the fair forward price?
    answer: >
      $525.64$. With a continuous income yield the carry formula is
      $F = Se^{(r + u - q)T}$ with storage $u = 0$, so the exponent is
      $(0.047 - 0.022) \times 2 = 0.025 \times 2 = 0.05$ and
      $F = 500 \times 1.051271 = 525.64$. Read the structure rather than the
      arithmetic: the index earns $q$ while you hold it and costs $r$ to
      finance, so the forward has to compensate only for the net drag, and the
      curve is in contango here because $r > q$. Had the yield exceeded the
      financing rate — say $q = 6\%$ against $r = 4.7\%$ — the exponent would
      turn negative and the forward would sit below the spot, which is
      backwardation. The trap is using $e^{rT}$ and then subtracting a dividend
      amount, mixing the two conventions: with a continuous yield the income
      belongs in the exponent, and with known cash dividends it is subtracted
      from the spot first, never both.
    expects: "525.64"
    tolerance: 0.005
    rubric:
      - >
        Puts the yield in the exponent as $e^{(r-q)T}$ rather than subtracting a
        cash amount from the spot.
      - >
        Computes the exponent $0.05$ over the two-year horizon and reads the
        curve as contango because $r > q$.
    targets:
      - quant-finance.arbitrage.cost-of-carry

  # --- put-call parity --------------------------------------------------------

  - id: qarb-put-call-parity-01
    kind: work
    difficulty: demanding
    statement: >
      European options on a non-dividend stock share a strike of $K = 50$ and an
      expiry $T = 0.75$ years. The stock trades at 46, the riskless rate is 3
      percent continuously compounded, and the call is quoted at 2.35. Take
      $e^{-rT} = e^{-0.0225} = 0.977751$. What must the put be worth?
    answer: >
      $5.24$. Parity says $C - P = S - Ke^{-rT}$, so
      $P = C - S + Ke^{-rT}$. The discounted strike is
      $50 \times 0.977751 = 48.89$, so
      $P = 2.35 - 46 + 48.89 = 5.24$. Sanity-check the sign before you commit:
      the strike is above the spot, the option pair is well out of the money for
      the call, and $S - Ke^{-rT} = 46 - 48.89 = -2.89$ is negative, so the put
      must be worth about 2.89 more than the call — and $5.24 - 2.35 = 2.89$
      confirms it. The standing trap is discounting the wrong quantity, writing
      $P = C - Se^{-rT} + K$: the spot is already a present value and must never
      be discounted, while the strike is a payment made at $T$ and always must
      be. That slip gives $P = 2.35 - 45.23 + 50 = 7.12$, an error of nearly two
      dollars on a five-dollar option. Nothing here assumes a distribution for
      $S_T$; parity is an identity, so it holds whatever the market believes.
    expects: "5.24"
    tolerance: 0.005
    rubric:
      - >
        Rearranges parity to $P = C - S + Ke^{-rT}$ and discounts only the
        strike, leaving the spot undiscounted.
      - >
        Checks the sign against $S - Ke^{-rT} < 0$, so the put exceeds the call.
    targets:
      - quant-finance.arbitrage.put-call-parity

  - id: qarb-put-call-parity-02
    kind: decide
    difficulty: standard
    statement: >
      A candidate applies $C - P = S - Ke^{-rT}$ to a call and a put on a
      non-dividend stock. The two options share a strike and an expiry, the rate
      is constant, and the market flatly contradicts the answer. Both options
      are American. Which hypothesis of the theorem has failed?
    answer: >
      European exercise. The proof compares two portfolios only at $T$: a call
      plus $K$ of bonds against a put plus a share, both worth
      $\max(S_T, K)$ at expiry. That comparison is only decisive if neither
      option can be exercised before $T$, because an American option's holder
      can break the payoff match early. For American options on a non-dividend
      stock the identity degrades to the two-sided band
      $S - K \le C_A - P_A \le S - Ke^{-rT}$, since the American call is worth
      exactly its European counterpart while the American put is worth strictly
      more. The other three candidate hypotheses are all satisfied as stated:
      the stock pays no dividends, the strikes and expiries match, and the rate
      is constant. Naming the right failed hypothesis is the whole skill here —
      parity is not approximately true for Americans, it is replaced by a band,
      and quoting a single number for $C_A - P_A$ is what the market contradicts.
    choices:
      - text: >
          European exercise: with early exercise possible the identity is
          replaced by the band $S - K \le C_A - P_A \le S - Ke^{-rT}$.
        correct: true
        feedback: >
          Right — the proof matches payoffs only at $T$, and an American holder
          need not wait until $T$.
      - text: >
          No dividends before expiry.
        feedback: >
          The stock is stated to pay none, so this hypothesis holds. It is the
          usual culprit, but not here.
      - text: >
          The two options must share a strike.
        feedback: >
          They do share a strike. Parity across different strikes is a different
          relation entirely.
      - text: >
          A constant riskless rate.
        feedback: >
          The rate is stated constant. In any case a deterministic rate curve
          would only change $Ke^{-rT}$ to the traded discount factor.
    rubric:
      - >
        Identifies European exercise as the failed hypothesis and explains that
        the replication proof compares payoffs only at expiry.
      - >
        States the American replacement as a band, noting $C_A = C$ and
        $P_A > P$ on a non-dividend stock.
    targets:
      - quant-finance.arbitrage.put-call-parity

  - id: qarb-put-call-parity-03
    kind: justify
    difficulty: standard
    statement: >
      State in full the hypotheses under which put–call parity holds, then prove
      $C - P = S - Ke^{-rT}$ by exhibiting two portfolios and comparing their
      payoffs state by state. Say explicitly which step would break if the
      underlying paid a dividend before expiry.
    answer: >
      Hypotheses: a European call and a European put on the same underlying,
      the same strike $K$, the same expiry $T$; no dividends or other income on
      the underlying before $T$; a constant riskless rate $r$ at which one may
      borrow and lend freely; no frictions. Portfolio A is the call plus $K$
      face value of zero-coupon bonds maturing at $T$; portfolio B is the put
      plus one share. At expiry A pays $K + \max(S_T - K, 0)$, which is $K$ when
      $S_T \le K$ and $S_T$ when $S_T > K$; B pays $S_T + \max(K - S_T, 0)$,
      which is $K$ when $S_T \le K$ and $S_T$ when $S_T > K$. Both equal
      $\max(S_T, K)$ in every state, so by the law of one price their costs
      today are equal: $C + Ke^{-rT} = P + S$, which rearranges to
      $C - P = S - Ke^{-rT}$. A dividend before $T$ breaks the payoff match, not
      the logic: portfolio B holds the share and so collects the dividend, so B
      is worth strictly more than A at $T$ by the dividend's future value, and
      the identity is corrected to
      $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$. Note that no distribution
      of $S_T$ appears anywhere, which is why parity constrains prices under any
      model whatsoever.
    rubric:
      - >
        Lists the hypotheses: European exercise, common strike and expiry, no
        income before $T$, constant rate, free borrowing and lending.
      - >
        Evaluates both portfolios in both regions $S_T \le K$ and $S_T > K$ and
        shows each equals $\max(S_T, K)$, then invokes the law of one price.
      - >
        Identifies the share leg of portfolio B as the step a dividend breaks,
        and gives the corrected identity.
    targets:
      - quant-finance.arbitrage.put-call-parity

  # --- parity worked ----------------------------------------------------------

  - id: qarb-parity-worked-01
    kind: work
    difficulty: demanding
    statement: >
      A non-dividend stock trades at 130. European options struck at $K = 125$
      expire in one year, the riskless rate is 3 percent continuously
      compounded, and the put is quoted at 4.15. Take
      $e^{-0.03} = 0.970446$. What must the call be worth?
    answer: >
      $12.84$. The discounted strike is
      $125 \times 0.970446 = 121.31$, so the parity gap is
      $C - P = 130 - 121.31 = 8.69$: the call must beat the put by 8.69, and
      with the put at 4.15 the call is
      $4.15 + 8.69 = 12.84$. The gap has an economic reading worth having ready
      in an interview — the call holder defers paying the strike for a year, and
      the interest forgone on 125 over that year, $125 - 121.31 = 3.69$, is part
      of what the call is paid for; the rest, $130 - 125 = 5$, is the moneyness.
      The traps are both about which quantity gets discounted. Using the
      undiscounted strike gives a gap of $130 - 125 = 5$ and a call of 9.15, and
      subtracting in the wrong direction gives $121.31 - 130 = -8.69$ and a call
      of $-4.54$, a negative price that should stop you immediately. Parity pins
      the difference, never either price on its own.
    expects: "12.84"
    tolerance: 0.005
    rubric:
      - >
        Discounts the strike to 121.31 and computes the gap $S - Ke^{-rT}$ in
        the right direction.
      - >
        Adds the gap to the quoted put, and reads the interest on the strike as
        the source of the call's premium over the put.
    targets:
      - quant-finance.arbitrage.parity-worked

  - id: qarb-parity-worked-02
    kind: work
    difficulty: standard
    statement: >
      A non-dividend stock trades at 88. European options struck at $K = 95$
      expire in six months and the riskless rate is 2 percent continuously
      compounded. Take $e^{-0.01} = 0.990050$. What is $C - P$?
    answer: >
      $-6.05$. The discounted strike is
      $95 \times 0.990050 = 94.05$, so
      $C - P = 88 - 94.05 = -6.05$. The negative sign is the point of the
      question: with the strike well above the spot the put is the more valuable
      of the two, by just over six dollars, and a candidate who assumes $C > P$
      always will report $6.05$ and be wrong by twelve. The condition is
      exactly $S > Ke^{-rT}$; at these numbers $88 < 94.05$, so the inequality
      runs the other way. Notice also how little the discounting matters here
      compared with the moneyness: the raw gap $88 - 95 = -7$ moves only to
      $-6.05$ once six months of interest on the strike is taken out, because
      the rate is low and the horizon short. Parity gives you the difference
      exactly and tells you nothing about either price alone — you still need a
      model, or a quote, for that.
    expects: "-6.05"
    tolerance: 0.005
    rubric:
      - >
        Discounts the strike over the half-year horizon and subtracts in the
        order $S - Ke^{-rT}$, keeping the negative sign.
      - >
        States the condition for $C > P$ as $S > Ke^{-rT}$ and notes it fails
        here.
    targets:
      - quant-finance.arbitrage.parity-worked

  # --- trading a parity violation ---------------------------------------------

  - id: qarb-parity-violation-01
    kind: work
    difficulty: demanding
    statement: >
      A non-dividend stock trades at 45. European options struck at $K = 45$
      expire in one year and the riskless rate is 6 percent continuously
      compounded; take $e^{0.06} = 1.061837$ and $e^{-0.06} = 0.941765$. The
      screen shows $C = 6.20$ and $P = 2.60$. You put on the conversion and fund
      the net outlay by borrowing at $r$. What riskless profit, in dollars per
      share, does the position pay at expiry?
    answer: >
      $1.04$. The fair gap is
      $S - Ke^{-rT} = 45 - 45 \times 0.941765 = 45 - 42.38 = 2.62$, while the
      screen shows $6.20 - 2.60 = 3.60$: the call is rich by $0.98$. Sell the
      rich side. The conversion is short the call for $+6.20$, long the put for
      $-2.60$, long the share for $-45$, a net outlay of
      $45 + 2.60 - 6.20 = 41.40$, borrowed at 6 percent. At expiry the package
      share plus put minus call is worth exactly $K = 45$ whatever $S_T$ does:
      above 45 the call is assigned and the share is delivered for 45, below 45
      the put is exercised and the share is sold for 45. Repay
      $41.40 \times 1.061837 = 43.96$ and keep
      $45 - 43.96 = 1.04$, which is the $0.98$ mispricing carried one year
      forward, $0.98 \times 1.061837 = 1.04$. The trap is banking the $0.98$ as
      cash today and also claiming the expiry profit — it is one edge, quoted at
      two different dates.
    expects: "1.04"
    tolerance: 0.005
    rubric:
      - >
        Compares the quoted gap 3.60 with the fair gap 2.62 and sells the call,
        buying the put and the share.
      - >
        Shows the package is worth exactly $K$ at expiry in both regions, and
        repays the financed outlay at $e^{rT}$ before quoting the profit.
    targets:
      - quant-finance.arbitrage.parity-violation
    exercises:
      - quant-finance.arbitrage.put-call-parity

  - id: qarb-parity-violation-02
    kind: decide
    difficulty: standard
    statement: >
      Same terms as before — a non-dividend stock at 45, European options struck
      at 45 expiring in one year, $r = 6\%$ continuously compounded, so the fair
      gap is $C - P = 2.62$. Now the screen shows $C = 3.10$ and $P = 3.40$, a
      gap of $-0.30$. Which trade captures the mispricing?
    answer: >
      The reversal: buy the call, sell the put, short the share, and lend the
      net credit at $r$ until expiry. The quoted gap of $-0.30$ sits far below
      the fair 2.62, which means the call is cheap relative to the put — so buy
      the call and sell the put, and hedge the resulting long exposure by
      shorting the share. The cash today is
      $45 + 3.40 - 3.10 = 45.30$ received, which you lend; at expiry the package
      long call, short put, short share is worth exactly $-K = -45$ in every
      state, so you pay 45 to close and keep
      $45.30 \times 1.061837 - 45 = 3.10$ of certain profit, the $2.92$
      mispricing carried forward. Running the conversion here — selling the
      cheap call and buying the rich put — locks in a certain loss of the same
      size, which is why identifying the rich side before touching the keyboard
      matters more than remembering the name of the trade.
    choices:
      - text: >
          Reversal: buy the call, sell the put, short the share, and lend the
          net credit at $r$ until expiry.
        correct: true
        feedback: >
          Right — the call is cheap against the put, so you buy the call, sell
          the put, and short the share to stay delta flat.
      - text: >
          Conversion: sell the call, buy the put, buy the share, funded by
          borrowing.
        feedback: >
          That is the trade for a rich call. Here the quoted gap is below fair,
          so the conversion locks in a certain loss.
      - text: >
          Buy both the call and the put and wait for a large move in the stock.
        feedback: >
          A straddle is a volatility bet with real downside, not an arbitrage.
          Parity says nothing about how far the stock moves.
      - text: >
          Buy the share and buy the call, since both look cheap.
        feedback: >
          That is a leveraged long with no offsetting short. Parity violations
          are captured by packages that are flat in $S_T$.
    rubric:
      - >
        Compares the quoted gap with the fair gap and identifies the call as the
        cheap leg, so the call is bought and the put sold.
      - >
        Adds the short share to make the package flat in $S_T$, and lends rather
        than borrows because the reversal opens with a credit.
    targets:
      - quant-finance.arbitrage.parity-violation

  # --- conversions, reversals and boxes ---------------------------------------

  - id: qarb-synthetics-01
    kind: work
    difficulty: demanding
    statement: >
      A box spread is built from European options on a non-dividend stock at
      strikes $K_1 = 40$ and $K_2 = 55$, all with the same expiry in two years.
      The riskless rate is 3.5 percent continuously compounded; take
      $e^{0.07} = 1.072508$ and $e^{-0.07} = 0.932394$. The package is quoted at
      13.60. You buy it and fund the purchase by borrowing at $r$. What riskless
      profit, in dollars, does the position pay at expiry?
    answer: >
      $0.41$. A box is a conversion at $K_1$ against a reversal at $K_2$, so it
      pays exactly $K_2 - K_1 = 15$ at expiry in every state — it is a synthetic
      zero-coupon bond, which is how desks lend and borrow through the options
      market. Its fair value today is that certain 15 discounted:
      $15 \times 0.932394 = 13.99$. The quote of 13.60 is below that, so buy the
      box, borrow 13.60 at 3.5 percent, and hold to expiry. At expiry collect
      the guaranteed 15 and repay
      $13.60 \times 1.072508 = 14.59$, keeping
      $15 - 14.59 = 0.41$ whatever the stock has done. The trap is comparing the
      quote with the raw spread of 15 and calling the box cheap by 1.40: the 15
      arrives in two years, and 13.99 is what it is worth today, so the real
      edge is 0.39 today or 0.41 at expiry. In practice the four legs' bid-ask
      spreads and any early-assignment risk on American options are what stand
      between that 0.41 and a filled trade.
    expects: "0.41"
    tolerance: 0.005
    rubric:
      - >
        Prices the box as the discounted spread $(K_2 - K_1)e^{-rT} = 13.99$,
        not as the raw spread 15.
      - >
        Finances the purchase and repays $13.60e^{rT}$ against the certain 15 at
        expiry.
    targets:
      - quant-finance.arbitrage.synthetics
    exercises:
      - quant-finance.arbitrage.put-call-parity

  - id: qarb-synthetics-02
    kind: decide
    difficulty: standard
    statement: >
      Which package replicates a synthetic long put at strike $K$ and expiry
      $T$, on a non-dividend stock?
    answer: >
      Long the call struck at $K$, short one share, and long $K$ face value of
      zero-coupon bonds maturing at $T$. Rearrange parity: from
      $C - P = S - Ke^{-rT}$ we get
      $P = C - S + Ke^{-rT}$, and the three terms on the right are read
      literally as positions — buy the call, short the share, and lend
      $Ke^{-rT}$ today so that $K$ arrives at expiry. Check it state by state:
      above $K$ the call pays $S_T - K$, the short share costs $S_T$, and the
      bond pays $K$, netting zero, which is what a put pays there; below $K$ the
      call expires worthless and the position pays $K - S_T$, exactly the put.
      The common error is dropping the bond leg and calling long call plus short
      share a synthetic put — that package pays $-K$ above the strike and
      $-S_T$ below it, so it is short a bond, not flat. Every one of the four
      instruments in parity is manufacturable from the other three the same way,
      which is what conversions, reversals and boxes are.
    choices:
      - text: >
          Long the call struck at $K$, short one share, and long $K$ face value
          of zero-coupon bonds maturing at $T$.
        correct: true
        feedback: >
          Right — this is $P = C - S + Ke^{-rT}$ read off as positions, and it
          matches the put in both regions.
      - text: >
          Long the call struck at $K$, long one share, and short $K$ face value
          of bonds.
        feedback: >
          Both risky legs are long here, so the package gains as the stock
          rises. A put does the opposite.
      - text: >
          Short the call struck at $K$, long one share, and long $K$ face value
          of bonds.
        feedback: >
          Share plus bond minus call pays $\min(S_T, K) + K$, which is nothing
          like a put.
      - text: >
          Long the call, short the put, and long one share.
        feedback: >
          That has a put in it already and is long two units of upside. Synthetic
          positions are built from the other three legs, not from the target.
    rubric:
      - >
        Rearranges parity to $P = C - S + Ke^{-rT}$ and reads each term as a
        position, keeping the bond leg.
      - >
        Verifies the payoff in both regions $S_T \le K$ and $S_T > K$.
    targets:
      - quant-finance.arbitrage.synthetics

  # --- parity with dividends and carry ----------------------------------------

  - id: qarb-parity-dividends-01
    kind: work
    difficulty: demanding
    statement: >
      A stock trades at 72 and will pay a single known dividend of 1.50 in
      exactly six months. European options struck at $K = 70$ expire in one
      year and the riskless rate is 5 percent continuously compounded. Take
      $e^{-0.025} = 0.975310$ and $e^{-0.05} = 0.951229$. What is $C - P$?
    answer: >
      $3.95$. With a known cash dividend before expiry the identity picks up one
      extra term:
      $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$, because the replicating
      portfolio that holds the share also collects the dividend, so only the
      ex-dividend part of the spot has to be funded. Here
      $\operatorname{PV}(D) = 1.50 \times 0.975310 = 1.46$ and
      $Ke^{-rT} = 70 \times 0.951229 = 66.59$, so
      $C - P = 72 - 1.46 - 66.59 = 3.95$. Ignoring the dividend entirely gives
      $72 - 66.59 = 5.41$, overstating the call's premium over the put by 1.46:
      dividends move value from calls to puts, since the forward the call is
      really a claim on is lower. Discounting the dividend to expiry rather than
      to today is the other slip. The tidiest way to remember all of this is the
      forward form $C - P = (F - K)e^{-rT}$, which absorbs dividends, yields and
      storage at once and reduces to the same 3.95 here.
    expects: "3.95"
    tolerance: 0.01
    rubric:
      - >
        Subtracts the present value of the dividend from the spot before
        differencing against the discounted strike.
      - >
        Notes the direction — dividends shrink $C - P$ — and checks against the
        no-dividend value 5.41.
    targets:
      - quant-finance.arbitrage.parity-dividends
    exercises:
      - quant-finance.arbitrage.cost-of-carry

  - id: qarb-parity-dividends-02
    kind: work
    difficulty: standard
    statement: >
      An index trades at 260 and pays a continuous dividend yield of $q = 2\%$.
      European options struck at $K = 250$ expire in $T = 1.5$ years and the
      riskless rate is $r = 4\%$ continuously compounded. Take
      $e^{-0.03} = 0.970446$ and $e^{-0.06} = 0.941765$. What is $C - P$?
    answer: >
      $16.87$. With a continuous yield the identity is
      $C - P = Se^{-qT} - Ke^{-rT}$: the spot leg is discounted at the dividend
      yield because holding the index throws off income the option holder never
      sees, and the strike leg is discounted at the riskless rate because it is
      a cash payment at $T$. Here $qT = 0.02 \times 1.5 = 0.03$ and
      $rT = 0.04 \times 1.5 = 0.06$, so
      $C - P = 260 \times 0.970446 - 250 \times 0.941765
      = 252.316 - 235.441 = 16.87$. Against the no-yield value
      $260 - 235.441 = 24.56$, the yield has moved nearly eight dollars from the
      call to the put over eighteen months. The trap is discounting the index at
      the riskless rate as well, or at $r - q$: each leg has its own rate, and
      mixing the continuous-yield form with a subtracted cash dividend
      double-counts the same income.
    expects: "16.87"
    tolerance: 0.02
    rubric:
      - >
        Discounts the spot at $q$ and the strike at $r$, using the correct
        exponents over the 1.5-year horizon.
      - >
        Compares with the no-yield gap to check the direction: a yield shrinks
        $C - P$.
    targets:
      - quant-finance.arbitrage.parity-dividends

  # --- model-free option bounds -----------------------------------------------

  - id: qarb-option-bounds-01
    kind: work
    difficulty: demanding
    statement: >
      A European call on a non-dividend stock is struck at $K = 50$ with 1.5
      years to expiry. The stock trades at 58, the riskless rate is 4 percent
      continuously compounded, and the call is quoted at 10.40. Take
      $e^{-0.06} = 0.941765$. Trading is free and short selling is costless.
      What riskless profit, in dollars per share, can you bank today?
    answer: >
      $0.51$. The model-free floor for a European call is
      $C \ge (S - Ke^{-rT})^{+}$, and
      $Ke^{-rT} = 50 \times 0.941765 = 47.09$, so the floor is
      $58 - 47.09 = 10.91$. The quote of 10.40 is below it, so the call is
      cheap against the arbitrage bound, not merely against someone's model. The
      trade: buy the call for 10.40, short the share for 58, and lend 47.09 for
      1.5 years. That nets
      $58 - 10.40 - 47.09 = 0.51$ in your pocket today. At expiry the loan
      returns exactly 50. If $S_T > 50$, exercise the call, pay the 50, take
      delivery of the share and return it to the lender, netting zero. If
      $S_T \le 50$, let the call lapse, buy the share in the market for $S_T$
      using the 50, return it, and keep $50 - S_T \ge 0$. The payoff is never
      negative in any state, so the 0.51 today is riskless. The trap is
      comparing 10.40 with the intrinsic value $S - K = 8$ and concluding the
      call is fairly priced: the binding floor discounts the strike.
    expects: "0.51"
    tolerance: 0.005
    rubric:
      - >
        Uses the discounted-strike floor $S - Ke^{-rT} = 10.91$ rather than the
        intrinsic value $S - K = 8$.
      - >
        States the three legs — buy the call, short the share, lend $Ke^{-rT}$ —
        and shows the terminal payoff is never negative in either region.
    targets:
      - quant-finance.arbitrage.option-bounds
    exercises:
      - quant-finance.arbitrage.put-call-parity

  - id: qarb-option-bounds-02
    kind: decide
    difficulty: standard
    statement: >
      European options on a non-dividend stock have $S = 40$, $K = 45$,
      $T = 1$ and $r = 3\%$ continuously compounded, so $Ke^{-rT} = 43.67$.
      Four quotes are reported. Judged on its own against the model-free bounds,
      which one is impossible?
    answer: >
      The put quoted at 44.10. A European put can never be worth more than
      $Ke^{-rT}$, because the most it can ever pay is $K$ at expiry, and $K$
      received at $T$ is worth $43.67$ today; a quote of 44.10 exceeds that, so
      you sell the put for 44.10, lend 43.67, and at expiry you hold 45 against
      a liability of at most $45 - S_T \le 45$, keeping the difference plus the
      $0.43$ banked today. Check the other three against their own boxes. The
      call's box is $(S - Ke^{-rT})^{+} \le C \le S$, which here is
      $0 \le C \le 40$ since $40 < 43.67$ makes the parity floor vanish, so both
      1.20 and 39.50 are legal — 39.50 is expensive but not impossible. The
      put's box is $(Ke^{-rT} - S)^{+} \le P \le Ke^{-rT}$, that is
      $3.67 \le P \le 43.67$, so 5.00 is comfortable. The trap is rejecting the
      call at 39.50 because it looks absurd next to a strike of 45: absurd is
      not the test, the bound is.
    choices:
      - text: >
          The put quoted at 44.10.
        correct: true
        feedback: >
          Right — a European put cannot exceed $Ke^{-rT} = 43.67$, since $K$ at
          expiry is the most it can ever pay.
      - text: >
          The call quoted at 1.20.
        feedback: >
          The call's floor is $(40 - 43.67)^{+} = 0$ and its ceiling is $S = 40$,
          so 1.20 sits well inside the box.
      - text: >
          The put quoted at 5.00.
        feedback: >
          The put's floor is $43.67 - 40 = 3.67$ and its ceiling 43.67. A quote
          of 5.00 is legal.
      - text: >
          The call quoted at 39.50.
        feedback: >
          Expensive, but a call may cost anything up to the share itself. The
          ceiling is $S = 40$, and 39.50 is under it.
    rubric:
      - >
        Writes both boxes explicitly — $(S - Ke^{-rT})^{+} \le C \le S$ and
        $(Ke^{-rT} - S)^{+} \le P \le Ke^{-rT}$ — before judging any quote.
      - >
        Identifies the put's ceiling as the violated bound and names the trade
        that exploits it.
    targets:
      - quant-finance.arbitrage.option-bounds

  # --- never exercise an American call early ----------------------------------

  - id: qarb-no-early-exercise-01
    kind: work
    difficulty: demanding
    statement: >
      An American call on a stock that pays no dividend before expiry is struck
      at $K = 60$ with two years to run. The stock trades at 75 and the riskless
      rate is 4 percent continuously compounded; take $e^{-0.08} = 0.923116$. A
      holder who exercises today collects the intrinsic value. How much value,
      in dollars per share, does exercising throw away at minimum?
    answer: >
      $4.61$. Exercising now collects $S - K = 75 - 60 = 15$. Holding is worth
      at least the European floor, since the American call is worth at least its
      European counterpart:
      $C_A \ge C \ge S - Ke^{-rT} = 75 - 60 \times 0.923116 = 75 - 55.39
      = 19.61$. The gap is
      $19.61 - 15 = 4.61$ per share, and it is a lower bound on the loss because
      the true option value may be higher still. The economics behind the number
      are worth saying out loud: exercising pays the strike two years early and
      forfeits the interest on it, $60 - 55.39 = 4.61$, which is exactly the
      gap. By parity the same amount can be read as the value of the put you
      throw away, since holding the call keeps downside protection that
      exercising destroys. So the American call on a non-dividend stock is never
      exercised early and is worth exactly the European call; a holder who wants
      cash sells the option instead. Dividends break the argument — exercising
      just before a large one can be optimal.
    expects: "4.61"
    tolerance: 0.005
    rubric:
      - >
        Compares the intrinsic value $S - K$ with the arbitrage floor
        $S - Ke^{-rT}$, not with an assumed model price.
      - >
        Reads the gap as the interest forgone on the strike, or equivalently as
        the discarded put by parity, and notes dividends break the result.
    targets:
      - quant-finance.arbitrage.no-early-exercise
    exercises:
      - quant-finance.arbitrage.option-bounds

  - id: qarb-no-early-exercise-02
    kind: decide
    difficulty: standard
    statement: >
      A trader holds a deep in-the-money American call on a stock that will pay
      no dividend before expiry, and needs cash today. Which action is best?
    answer: >
      Sell the call in the market. Its price is at least
      $S - Ke^{-rT}$, which with $r > 0$ and time remaining is strictly greater
      than the $S - K$ that exercising collects, so selling raises more cash
      than exercising in every case — the gap is the interest on the strike,
      which exercising simply hands back to the counterparty. Exercising also
      destroys the downside protection embedded in the position: by parity, the
      call is the share plus a put minus the discounted strike, and exercising
      converts it into the share alone, throwing the put away for nothing. That
      the option is deep in the money does not make its time value zero, which
      is the usual mistaken premise; it makes the option behave like the stock,
      which is a statement about delta, not about price. Exercising and re-buying
      the same call is worse than either, since it pays the strike early and
      then pays the spread to get the optionality back.
    choices:
      - text: >
          Sell the call in the market: its price is at least $S - Ke^{-rT}$,
          which strictly exceeds the $S - K$ that exercising collects.
        correct: true
        feedback: >
          Right — the option is always worth more alive than exercised on a
          non-dividend stock, so selling dominates.
      - text: >
          Exercise immediately: deep in the money, the option is worth its
          intrinsic value.
        feedback: >
          Its arbitrage floor already exceeds intrinsic value by the interest on
          the strike. Exercising gives that away.
      - text: >
          Exercise and immediately buy the same call back in the market.
        feedback: >
          That pays the strike early and pays the spread twice. Strictly worse
          than simply selling.
      - text: >
          Exercise, because a deep in-the-money option has no time value left.
        feedback: >
          Deep in the money means delta near one, not price equal to intrinsic.
          The interest on the strike is still there.
    rubric:
      - >
        Compares the sale proceeds, floored at $S - Ke^{-rT}$, with the $S - K$
        collected by exercising.
      - >
        Names what exercising forfeits — the interest on the strike, and by
        parity the embedded put.
    targets:
      - quant-finance.arbitrage.no-early-exercise

  # --- American puts ----------------------------------------------------------

  - id: qarb-american-put-early-01
    kind: work
    difficulty: demanding
    statement: >
      An American put on a non-dividend stock is struck at $K = 65$ with two
      years to expiry, the riskless rate is 5 percent continuously compounded,
      and the stock has collapsed to 3. Take $e^{-0.10} = 0.904837$. By at least
      how much, in dollars, must the American put exceed the most an otherwise
      identical European put could possibly be worth?
    answer: >
      $3.19$. Exercising the American put right now pays
      $K - S = 65 - 3 = 62$ in cash today, so $P_A \ge 62$. The European put on
      the same terms can never be worth more than $Ke^{-rT}$, because the most
      it can ever pay is $K$ and that payment cannot arrive before expiry:
      $65 \times 0.904837 = 58.81$. Hence
      $P_A - P \ge 62 - 58.81 = 3.19$, and the inequality is strict, so the
      American put is worth strictly more than the European one — the single
      early-exercise case that survives on a non-dividend underlying. The reason
      is the mirror image of the call argument: the put holder is owed cash, and
      waiting means being paid later, so the interest runs against holding
      rather than for it. Below a critical stock price early exercise is
      optimal, and that boundary has no closed form. The trap is applying the
      call result by symmetry and concluding $P_A = P$; the interview summary is
      American call equals European call, American put strictly exceeds it.
    expects: "3.19"
    tolerance: 0.005
    rubric:
      - >
        Uses the immediate exercise value $K - S$ as a lower bound on $P_A$ and
        $Ke^{-rT}$ as the ceiling on the European put.
      - >
        Concludes $P_A > P$ strictly and explains why the interest argument
        reverses for puts.
    targets:
      - quant-finance.arbitrage.american-put-early
    exercises:
      - quant-finance.arbitrage.option-bounds

  - id: qarb-american-put-early-02
    kind: decide
    difficulty: standard
    statement: >
      For American options on a non-dividend stock, which model-free relation
      replaces put–call parity?
    answer: >
      The two-sided band
      $S - K \le C_A - P_A \le S - Ke^{-rT}$. The upper end is the European
      identity, which still holds as an inequality because
      $C_A = C$ on a non-dividend stock while
      $P_A \ge P$, so subtracting a larger put can only lower the difference.
      The lower end comes from the possibility of immediate exercise on both
      sides. The band is not a weaker approximation of the identity; it is the
      exact model-free statement, and it collapses to the identity precisely
      when $r = 0$ or $T = 0$, since $Ke^{-rT}$ and $K$ coincide there. Asserting
      the equality $C_A - P_A = S - Ke^{-rT}$ is the common slip and it uses
      $P_A = P$, which is false — an American put on a deeply depressed stock is
      worth strictly more than its European twin. The band is also why quoting a
      single implied difference for American names, as parity lets you do for
      European ones, is not something an interviewer will let pass.
    choices:
      - text: >
          $S - K \le C_A - P_A \le S - Ke^{-rT}$
        correct: true
        feedback: >
          Right — the upper end is European parity, weakened because
          $P_A \ge P$, and the lower end comes from immediate exercise.
      - text: >
          $C_A - P_A = S - Ke^{-rT}$ exactly, since the American call equals the
          European call.
        feedback: >
          The call leg is fine; the put leg is not. $P_A$ strictly exceeds $P$,
          so the difference is only bounded above by this.
      - text: >
          $C_A - P_A = S - K$ exactly.
        feedback: >
          That is the lower end of the band, not an identity. It would say the
          rate never matters.
      - text: >
          $Ke^{-rT} - S \le C_A - P_A \le K - S$
        feedback: >
          The signs are inverted — this would make the call cheaper than the put
          whenever the stock is above the strike.
    rubric:
      - >
        States the band with the correct endpoints and orientation.
      - >
        Justifies the upper end from $C_A = C$ and $P_A \ge P$, and notes the
        band collapses to the identity when $r = 0$.
    targets:
      - quant-finance.arbitrage.american-put-early

  # --- triangular FX ----------------------------------------------------------

  - id: qarb-fx-triangular-01
    kind: work
    difficulty: demanding
    statement: >
      Three quotes print at the same instant, with no spreads: EUR/USD
      $= 1.0800$, meaning one euro buys 1.08 dollars; USD/CHF $= 0.8800$,
      meaning one dollar buys 0.88 francs; and a direct EUR/CHF quote of
      $0.9600$, meaning one euro buys 0.96 francs. Starting with 1,000,000
      dollars you run the loop dollars to euros to francs and back to dollars.
      What is the riskless profit, in dollars?
    answer: >
      $10101.01$. First check which way the loop pays. The cross implied by the
      two dollar legs is
      $1.0800 \times 0.8800 = 0.9504$ francs per euro, while the direct market
      quotes $0.9600$, so the euro buys more francs directly than through the
      dollar — sell euros for francs on the direct quote. The loop: 1,000,000
      dollars buys $1000000/1.08 = 925925.93$ euros; those euros sell for
      $925925.93 \times 0.96 = 888888.89$ francs; and those francs sell for
      dollars at 0.88 francs per dollar, giving
      $888888.89/0.88 = 1010101.01$ dollars. The profit is
      $1010101.01 - 1000000 = 10101.01$, held for no time and with no position
      left over — the ratio $0.9600/0.9504 = 1.0101$ is the whole edge. Two
      traps. Multiplying where you should divide, because EUR/USD and USD/CHF
      are quoted in opposite directions, sends the loop the wrong way and loses
      the same 1 percent. And in a real book the three round-trip spreads are
      the hurdle this 1.01 percent has to clear, which is why the business is
      about latency, not arithmetic.
    expects: "10101.01"
    tolerance: 0.5
    rubric:
      - >
        Computes the implied cross $1.08 \times 0.88 = 0.9504$ and compares it
        with the direct 0.9600 to fix the direction of the loop.
      - >
        Divides or multiplies correctly at each leg according to how the pair is
        quoted, and subtracts the starting million.
    targets:
      - quant-finance.arbitrage.fx-triangular

  - id: qarb-fx-triangular-02
    kind: work
    difficulty: standard
    statement: >
      Two quotes print: EUR/USD $= 1.0600$, meaning one euro buys 1.06 dollars,
      and USD/MXN $= 17.50$, meaning one dollar buys 17.50 pesos. What EUR/MXN
      cross do these two legs imply — that is, how many pesos does one euro buy
      if you route through dollars?
    answer: >
      $18.55$. Chain the two legs in the direction the quotes run: one euro buys
      1.06 dollars, and each of those dollars buys 17.50 pesos, so one euro buys
      $1.06 \times 17.50 = 18.55$ pesos. The no-arbitrage condition on the three
      rates is that they multiply to one around the loop, which is exactly the
      law of one price applied to currencies: a euro is a euro whichever route
      you take to it. If the market's direct EUR/MXN quote were 18.70, the euro
      would be rich against pesos on the direct leg, so you would buy euros with
      dollars, sell them for pesos directly, and convert back — capturing
      $18.70/18.55 - 1 = 0.81\%$ per loop. If it were 18.40 you would run the
      triangle the other way. The trap is dividing rather than multiplying: the
      two quotes here chain head to tail, euro into dollars and dollars into
      pesos, so no inversion is needed anywhere.
    expects: "18.55"
    rubric:
      - >
        Chains the two quotes in the correct direction, multiplying because the
        pairs share the dollar head to tail.
      - >
        States the no-arbitrage condition as the three rates multiplying to one
        around the loop.
    targets:
      - quant-finance.arbitrage.fx-triangular

  - id: qarb-fx-triangular-03
    kind: work
    difficulty: standard
    statement: >
      A bookmaker quotes three mutually exclusive and exhaustive outcomes at
      decimal odds $2.50$, $4.00$ and $2.50$: a stake of 1 at odds $d$ returns
      $d$ in total if that outcome wins, so the implied probability of that
      outcome is $1/d$. What is the overround — the amount by which the three
      implied probabilities exceed one?
    answer: >
      $0.05$. The implied probabilities are
      $1/2.50 = 0.40$, $1/4.00 = 0.25$ and $1/2.50 = 0.40$, and they sum to
      $0.40 + 0.25 + 0.40 = 1.05$, so the overround is
      $1.05 - 1 = 0.05$, five percent. This is the same failure the triangular
      FX check looks for, seen from the other side of the counter: quoted prices
      that do not multiply — or here, add — to one around a closed loop of
      states. The direction of the failure decides who captures it. Sum below
      one and a backer can stake $1/d$ on every outcome, guarantee 1 back and
      pay less than 1 for it, which is a Dutch book and an arbitrage; sum above
      one, as here, and that same set of stakes costs 1.05 to return 1, so the
      excess is the bookmaker's margin and there is no arbitrage for the
      customer at all. The trap is calling any deviation from one an arbitrage:
      an overround is a spread, and a spread is what the market maker is paid.
    expects: "0.05"
    rubric:
      - >
        Converts each decimal odd to $1/d$ and sums the three implied
        probabilities to 1.05.
      - >
        Reads the sign: above one is the bookmaker's margin, not an arbitrage,
        and connects it to the FX loop failing to multiply to one.
    targets:
      - quant-finance.arbitrage.fx-triangular
      - quant-games.betting-markets.overround
    connects:
      - "quant-finance.arbitrage.fx-triangular ~ quant-games.betting-markets.overround"
