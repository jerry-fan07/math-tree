# Problems targeting quant-programming.complexity — costing computation.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. Every instance here is fresh: no
# problem reuses a lesson's worked example or a card's numbers. Loops are
# described in prose rather than code, per content-quant/style.md. See
# ../README.md.

problems:
  # --- Big-O, Big-Ω, Big-Θ -----------------------------------------------------

  - id: qcplx-big-o-01
    kind: work
    difficulty: demanding
    statement: >
      Three nested counters run as follows. The outer counter $i$ takes every
      value from $1$ to $n$; for each $i$, a middle counter $j$ takes every
      value from $1$ to $i$; for each $j$, an inner counter $k$ takes every
      value from $1$ to $j$; and the innermost body executes exactly once per
      triple. For $n = 20$, exactly how many times does the body run?
    answer: >
      $1540$. The body runs once for each triple with $1 \le k \le j \le i \le
      n$, which is the number of size-$3$ multisets drawn from $n$ values:
      $\binom{n+2}{3} = n(n+1)(n+2)/6$. At $n = 20$ that is
      $20 \cdot 21 \cdot 22 / 6 = 9240/6 = 1540$. The same total comes from
      summing the middle loop's own triangular counts,
      $\sum_{i=1}^{20} i(i+1)/2$. The trap is reading "three nested loops" as
      $n^{3} = 8000$: the inner bounds move with the outer counters, so the
      true count is smaller by a factor approaching $6$. It does not change the
      growth class — $n(n+1)(n+2)/6$ is $\Theta(n^{3})$, because the $1/6$ is a
      constant factor and $\Theta$ discards constant factors — but it is the
      difference between $1540$ and $8000$ operations at the size you are
      actually asked about.
    expects: "1540"
    rubric:
      - >
        Notices that the middle and inner bounds depend on the enclosing
        counters, so the count is the number of non-decreasing triples rather
        than $n^{3}$.
      - >
        Separates the exact count from the growth class: $1540 \ne 8000$, yet
        both are $\Theta(n^{3})$ because the constant factor drops out.
    targets:
      - quant-programming.complexity.big-o

  - id: qcplx-big-o-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of the four functions below is $\Theta(2^{n})$. Which one?
    answer: >
      $2^{n+3}$. It equals $8 \cdot 2^{n}$, so $2^{n} \le 2^{n+3} \le 8 \cdot
      2^{n}$ for every $n$ — witnesses $c_{1} = 1$, $c_{2} = 8$, $n_{0} = 1$ —
      and $\Theta$ discards the constant factor $8$. The other three all grow
      strictly faster, and the ratio test shows it: $2^{2n}/2^{n} = 2^{n} \to
      \infty$, $n\,2^{n}/2^{n} = n \to \infty$, and $3^{n}/2^{n} =
      (3/2)^{n} \to \infty$. Each is therefore $\Omega(2^{n})$ but not
      $O(2^{n})$. The lesson to carry out is where a constant may sit: a
      constant *added to the exponent* is a constant factor and is free, while
      a constant *multiplying the exponent* is not — $2^{2n} = 4^{n}$ is a
      different growth class entirely.
    choices:
      - text: >
          $2^{n+3}$
        correct: true
        feedback: >
          Right — $2^{n+3} = 8 \cdot 2^{n}$, a constant factor of $8$, which
          $\Theta$ throws away.
      - text: >
          $2^{2n}$
        feedback: >
          $2^{2n} = 4^{n}$, and $4^{n}/2^{n} = 2^{n} \to \infty$. A constant in
          the exponent is not a constant factor.
      - text: >
          $n\,2^{n}$
        feedback: >
          The ratio to $2^{n}$ is $n$, which is unbounded — so this is
          $\Omega(2^{n})$ but never $O(2^{n})$.
      - text: >
          $3^{n}$
        feedback: >
          $3^{n}/2^{n} = (3/2)^{n} \to \infty$. Different bases are different
          growth classes, unlike different bases inside a logarithm.
    rubric:
      - >
        Uses the ratio $f(n)/2^{n}$ and asks whether it stays bounded, rather
        than eyeballing which expression looks larger.
      - >
        Says why a constant added to the exponent is free but a constant
        multiplying it is not.
    targets:
      - quant-programming.complexity.big-o

  - id: qcplx-big-o-03
    kind: work
    difficulty: standard
    statement: >
      A routine runs two phases one after the other. In phase one, for each $i$
      from $1$ to $n$ an inner counter runs a fixed $50$ steps. In phase two, a
      single counter runs from $1$ to $n^{2}$, one step each. For $n = 30$, how
      many steps does the routine take in total?
    answer: >
      $2400$. Phase one costs $50n = 50 \cdot 30 = 1500$ steps and phase two
      costs $n^{2} = 900$, and sequential phases add rather than multiply, so
      the total is $1500 + 900 = 2400$. The instructive part is that at
      $n = 30$ the *linear* phase is the larger of the two, yet the routine is
      $\Theta(n^{2})$: $50n + n^{2} \le 2n^{2}$ for every $n \ge 50$, and
      $50n + n^{2} \ge n^{2}$ always, so the quadratic term is the one that
      survives. The crossover is exactly $n = 50$, where $50n = n^{2} = 2500$.
      The trap is letting the tested size decide the class — the term that is
      bigger at the $n$ in front of you is not necessarily the term that
      dominates asymptotically, and the whole point of $\Theta$ is that it
      reports the latter.
    expects: "2400"
    rubric:
      - >
        Adds the two sequential phases instead of multiplying them, giving
        $1500 + 900$ rather than $1500 \cdot 900$.
      - >
        States that the routine is $\Theta(n^{2})$ even though the linear term
        is larger at $n = 30$, and locates the crossover at $n = 50$.
    targets:
      - quant-programming.complexity.big-o

  - id: qcplx-big-o-04
    kind: justify
    difficulty: demanding
    statement: >
      Show that $n^{2}$ is not $O(n\log_{2} n)$ — that is, no pair of constants
      $c > 0$ and $n_{0}$ satisfies $n^{2} \le c\,n\log_{2} n$ for every
      $n \ge n_{0}$. Give an explicit $n$ that breaks any proposed $c$.
    answer: >
      Suppose such $c$ and $n_{0}$ existed. Dividing the claimed inequality by
      $n > 0$ turns it into $n \le c\log_{2} n$ for all $n \ge n_{0}$, so the
      whole question is whether $n/\log_{2} n$ stays bounded. It does not: it
      tends to $\infty$, so no single $c$ can dominate it. For an explicit
      counterexample, take any $c \ge 1$ (a smaller $c$ is only harder to
      satisfy, so proving it for $c \ge 1$ suffices) and set $n = 2^{2c}$. Then
      $\log_{2} n = 2c$, so the right-hand side is $c \log_{2} n = 2c^{2}$,
      while the left-hand side is $n = 4^{c}$. Since $4^{c} > 2c^{2}$ for every
      $c \ge 1$ — it holds at $c = 1$ as $4 > 2$, and the left side multiplies
      by $4$ per unit step while the right side grows only quadratically — the
      inequality fails at that $n$. Larger $n$ of the same form fail too, so
      the failure is not a one-off that a bigger $n_{0}$ could exclude, which
      is exactly what the definition of $O$ requires. The reverse direction is
      true and worth stating alongside it: $n\log_{2} n = O(n^{2})$, since
      $\log_{2} n \le n$ for $n \ge 1$.
    rubric:
      - >
        Divides through by $n$ and reduces the claim to the boundedness of
        $n/\log_{2} n$, rather than arguing from a plot or from "everyone knows
        $n^{2}$ is worse".
      - >
        Exhibits an $n$ that defeats an arbitrary $c$ — $n = 2^{2c}$ works —
        and notes that arbitrarily large such $n$ exist, so no $n_{0}$ rescues
        the bound.
      - >
        Does not confuse the two directions: $n\log_{2} n = O(n^{2})$ holds,
        and the failure is only of the reverse.
    targets:
      - quant-programming.complexity.big-o

  # --- the growth ladder, timed ------------------------------------------------

  - id: qcplx-growth-ranking-01
    kind: work
    difficulty: demanding
    statement: >
      A $\Theta(n\log n)$ sort takes $3.5$ seconds on $n = 2^{20}$ records.
      Model its running time as exactly $c\,n\log_{2} n$ for some fixed
      constant $c$. How many seconds should it take on $n = 2^{24}$ records?
    answer: >
      $67.2$ seconds. The constant cancels in the ratio, so only the two sizes
      matter: the time scales by
      $(2^{24} \cdot 24)/(2^{20} \cdot 20) = 16 \cdot (24/20) = 16 \cdot 1.2 =
      19.2$. Hence $3.5 \cdot 19.2 = 67.2$ seconds. Two separate slips are
      worth naming. Scaling by the $16\times$ growth in $n$ alone gives
      $3.5 \cdot 16 = 56$ seconds — the log factor ignored. Scaling as if the
      sort were quadratic gives $3.5 \cdot 256 = 896$ seconds, which is the
      error that makes a perfectly fine algorithm look unusable. Note also how
      mild the log factor is: a sixteen-fold larger input costs only $20\%$
      more per element, which is the practical reason $n\log n$ is treated as
      "essentially linear" when sizing a solution.
    expects: "67.2"
    rubric:
      - >
        Takes the ratio $n_{2}\log_{2} n_{2}$ to $n_{1}\log_{2} n_{1}$ so the
        unknown constant cancels, rather than trying to recover $c$.
      - >
        Keeps the log factor: the answer is $16 \cdot 1.2 = 19.2$ times longer,
        not $16$ times.
    targets:
      - quant-programming.complexity.growth-ranking
    exercises:
      - quant-programming.complexity.big-o

  - id: qcplx-growth-ranking-02
    kind: decide
    difficulty: standard
    statement: >
      A routine does three things in order: it sorts an array of $n$ numbers,
      costing $\Theta(n\log n)$; then, for each of the $n$ elements, it runs one
      binary search into the sorted array, costing $\Theta(\log n)$ per search;
      then it makes one final linear pass. What is the tight growth class of
      the whole routine?
    answer: >
      $\Theta(n\log n)$. Cost the three phases separately and add, because they
      run one after another rather than nested inside one another: the sort is
      $\Theta(n\log n)$, the searching phase is $n$ searches at $\Theta(\log
      n)$ each, which is $\Theta(n\log n)$, and the final pass is $\Theta(n)$.
      The sum $n\log n + n\log n + n = 2n\log n + n$ is $\Theta(n\log n)$,
      since a sum of terms is $\Theta$ of its largest term and the factor $2$
      is a constant. The trap is multiplying: writing $n\log n$ times $n\log n$
      because both phases were mentioned in the same sentence gives
      $\Theta(n^{2}\log^{2} n)$, an answer that would wrongly rule the routine
      out at $n = 10^{6}$. Multiplication is for nesting — a loop *inside* a
      loop — while sequencing adds.
    choices:
      - text: >
          $\Theta(n\log n)$
        correct: true
        feedback: >
          Right — the phases add: $n\log n + n\log n + n = \Theta(n\log n)$,
          the largest term.
      - text: >
          $\Theta(n^{2}\log n)$
        feedback: >
          That multiplies the sort by the search phase. Multiplication is for
          nested work; sequential phases add.
      - text: >
          $\Theta(n\log^{2} n)$
        feedback: >
          That would need $\log n$ searches per element, not one. Each element
          gets a single $\Theta(\log n)$ search.
      - text: >
          $\Theta(n)$
        feedback: >
          Only the last phase is linear. The sort alone already forces
          $\Omega(n\log n)$.
    rubric:
      - >
        Adds sequential phases and multiplies only nested ones, then keeps the
        largest term.
      - >
        Costs the middle phase as $n$ searches times $\Theta(\log n)$ each,
        which is where the second $n\log n$ comes from.
    targets:
      - quant-programming.complexity.growth-ranking
    exercises:
      - quant-programming.complexity.big-o

  # --- log n is halving ---------------------------------------------------------

  - id: qcplx-log-halving-01
    kind: work
    difficulty: demanding
    statement: >
      A counter starts at $3$. Each pass through a loop executes the body once
      and then multiplies the counter by $3$; the loop keeps going while the
      counter is at most $10^{6}$. Exactly how many passes execute?
    answer: >
      $12$. The counter takes the values $3^{1}, 3^{2}, \dots$ at the start of
      successive passes, and a pass executes exactly when its value is at most
      $10^{6}$. Since $3^{12} = 531441 \le 10^{6}$ and $3^{13} = 1594323 >
      10^{6}$, the passes run for $3^{1}$ through $3^{12}$ — twelve of them.
      Equivalently the count is
      $\lfloor \log_{3} 10^{6} \rfloor = \lfloor 12.58 \rfloor = 12$, using
      $\log_{3} 10^{6} = 6\ln 10 / \ln 3 = 13.8155/1.0986$. The named trap here
      is log base confusion: a multiply-by-$3$ loop is counted by $\log_{3}$,
      not $\log_{2}$, and reflexively answering $\log_{2} 10^{6} \approx 20$
      overcounts by two thirds. Base only ever changes a growth rate by a
      constant factor — $\log_{3} n = \log_{2} n / \log_{2} 3$ — which is why
      $O(\log n)$ can be written without a base, but an *exact* pass count
      needs the right one.
    expects: "12"
    rubric:
      - >
        Counts the powers of $3$ that stay at or below $10^{6}$, landing on
        $3^{12} = 531441$ as the last one.
      - >
        Uses base $3$, not base $2$, for the exact count, and says why the base
        is invisible inside $O(\log n)$ but not here.
    targets:
      - quant-programming.complexity.log-halving
    exercises:
      - quant-programming.complexity.big-o

  - id: qcplx-log-halving-02
    kind: work
    difficulty: standard
    statement: >
      A sorted file holds $n = 5 \times 10^{8}$ records. Binary search's worst
      case is $\lfloor \log_{2} n \rfloor + 1$ comparisons. How many
      comparisons is that?
    answer: >
      $29$. Bracket $n$ between powers of two: $2^{28} = 268435456$ and
      $2^{29} = 536870912$, and $2^{28} \le 5 \times 10^{8} < 2^{29}$, so
      $\lfloor \log_{2} n \rfloor = 28$ and the worst case is
      $28 + 1 = 29$ comparisons. The point the number makes is the one the node
      is about: half a billion records are searched in under thirty
      comparisons, and going to five billion records would add only three or
      four more, because each factor of two in $n$ costs exactly one extra
      comparison. The trap is base confusion again — $\log_{10}(5 \times
      10^{8}) \approx 8.7$ suggests about nine comparisons, which is off by
      more than a factor of three because halving, not tenthing, is what
      binary search does.
    expects: "29"
    rubric:
      - >
        Brackets $5 \times 10^{8}$ between $2^{28}$ and $2^{29}$ rather than
        reaching for a calculator's $\log_{10}$.
      - >
        Applies the stated $\lfloor \log_{2} n \rfloor + 1$ rather than
        rounding $\log_{2} n$ up or down at will.
    targets:
      - quant-programming.complexity.log-halving
    exercises:
      - quant-programming.complexity.big-o

  # --- n log n from divide-and-conquer -----------------------------------------

  - id: qcplx-divide-conquer-recurrence-01
    kind: work
    difficulty: demanding
    statement: >
      A divide-and-conquer routine satisfies $T(1) = 1$ and
      $T(n) = 2T(n/2) + n$ for every $n$ that is a power of two. Compute
      $T(64)$ exactly.
    answer: >
      $448$. Unroll by levels. The recursion tree on $n = 64$ has subproblem
      sizes $64, 32, 16, 8, 4, 2, 1$ down the levels. Every level above the
      leaves contributes its combine term, and those terms sum to $64$ per
      level: one problem of size $64$, then two of size $32$, then four of size
      $16$, and so on. There are $\log_{2} 64 = 6$ such levels, giving
      $6 \cdot 64 = 384$. The bottom level holds $64$ leaves, each costing
      $T(1) = 1$, adding $64$. Total $384 + 64 = 448$. In closed form
      $T(n) = n\log_{2} n + n$, which checks at the base: $T(2) = 2 \cdot 1 + 2
      = 4$, and directly $2T(1) + 2 = 4$. Two errors are worth naming. Ignoring
      the non-recursive term $+n$ collapses the recurrence to $T(n) = 2T(n/2)$,
      whose answer is $64$ — the leaf count alone, off by a factor of seven.
      Dropping the base cost instead gives $384$ and quietly assumes the leaves
      are free.
    expects: "448"
    rubric:
      - >
        Accounts for both parts: $\log_{2} 64 = 6$ levels of combine work at
        $64$ each, plus $64$ leaves at cost $1$.
      - >
        Does not drop the non-recursive $+n$; states the closed form
        $n\log_{2} n + n$ and verifies it against a small case.
    targets:
      - quant-programming.complexity.divide-conquer-recurrence
    exercises:
      - quant-programming.complexity.log-halving

  - id: qcplx-divide-conquer-recurrence-02
    kind: decide
    difficulty: standard
    statement: >
      An algorithm splits its input into two halves, recurses on both, and then
      spends quadratic time combining: $T(n) = 2T(n/2) + n^{2}$. Which is its
      tight bound?
    answer: >
      $\Theta(n^{2})$. Compare the leaf work against the root work. With $a = 2$
      subproblems of size $n/b = n/2$, the leaves contribute
      $n^{\log_{b} a} = n^{\log_{2} 2} = n$, while the combine term is
      $n^{2}$ — polynomially larger — so the root dominates and the master
      theorem's third case applies, giving $\Theta(n^{2})$. The level sums show
      it concretely: the root does $n^{2}$, the next level does
      $2(n/2)^{2} = n^{2}/2$, the next $4(n/4)^{2} = n^{2}/4$, and the
      geometric series $n^{2}(1 + 1/2 + 1/4 + \dots) < 2n^{2}$ is dominated by
      its first term. This is the structural contrast the node insists on:
      merge sort's $T(n) = 2T(n/2) + n$ has *equal* work on every level, which
      is where the extra $\log n$ comes from, and changing the combine cost
      destroys that balance. The trap is pattern-matching the $2T(n/2)$ prefix
      to $n\log n$ without reading the non-recursive term at all.
    choices:
      - text: >
          $\Theta(n^{2})$
        correct: true
        feedback: >
          Right — the combine term beats the leaf work $n$, so the top level
          dominates a geometric series.
      - text: >
          $\Theta(n^{2}\log n)$
        feedback: >
          That is the case where leaf work and combine work are *equal* in
          order. Here $n^{2}$ strictly beats $n$.
      - text: >
          $\Theta(n\log n)$
        feedback: >
          That is merge sort's answer, which needs a linear combine step. The
          non-recursive term here is $n^{2}$.
      - text: >
          $\Theta(n^{3})$
        feedback: >
          Nothing multiplies the combine cost by $n$; the level sums form a
          decreasing geometric series bounded by $2n^{2}$.
    rubric:
      - >
        Compares $n^{\log_{2} 2} = n$ against the combine term $n^{2}$ and
        identifies which one dominates, rather than matching the recurrence's
        shape to a memorised answer.
      - >
        Reads the non-recursive term: $2T(n/2)$ alone determines nothing.
    targets:
      - quant-programming.complexity.divide-conquer-recurrence
    exercises:
      - quant-programming.complexity.log-halving

  - id: qcplx-divide-conquer-recurrence-03
    kind: work
    difficulty: standard
    statement: >
      The recursion tree of $T(n) = 4T(n/4) + n$ is drawn for $n = 4^{7} =
      16384$, and it bottoms out at subproblems of size $1$. Counting both the
      root level and the leaf level, how many levels does the tree have?
    answer: >
      $8$. The subproblem sizes down the tree are $4^{7}, 4^{6}, 4^{5}, \dots,
      4^{0}$ — that is $16384, 4096, 1024, 256, 64, 16, 4, 1$ — so there are
      $\log_{4} 16384 = 7$ divisions and therefore $7 + 1 = 8$ levels once both
      ends are counted. Each level does $16384$ units of combine work in total
      ($4^{i}$ subproblems of size $4^{7-i}$), so the whole tree does
      $8 \cdot 16384$ units, which is the $\Theta(n\log n)$ shape again with a
      different base. Two traps sit here. The first is base confusion:
      splitting into quarters is counted by $\log_{4}$, and reaching for
      $\log_{2} 16384 = 14$ nearly doubles the answer. The second is the
      off-by-one — $\log_{4} n = 7$ counts the *divisions*, and the level count
      exceeds it by one whenever the leaf level is included, which is why the
      convention has to be stated rather than assumed.
    expects: "8"
    rubric:
      - >
        Uses $\log_{4}$, not $\log_{2}$, because the branching factor divides
        the size by $4$.
      - >
        Handles the stated convention explicitly: $7$ divisions means $8$
        levels when root and leaves are both counted.
    targets:
      - quant-programming.complexity.divide-conquer-recurrence
    exercises:
      - quant-programming.complexity.log-halving

  - id: qcplx-divide-conquer-recurrence-04
    kind: work
    difficulty: demanding
    statement: >
      A multiplication algorithm splits each input in half and makes $3$
      recursive calls on the halves, with linear work to combine:
      $T(n) = 3T(n/2) + n$. The master theorem gives $T(n) = \Theta(n^{k})$.
      What is $k$, to three decimal places?
    answer: >
      $1.585$. With $a = 3$ subproblems of size $n/2$, the leaves contribute
      $n^{\log_{2} 3}$, and the combine term $n$ is $n^{1}$, which is
      polynomially smaller since $\log_{2} 3 > 1$. The leaves therefore
      dominate — the master theorem's first case — and
      $T(n) = \Theta(n^{\log_{2} 3})$. Numerically
      $\log_{2} 3 = \ln 3 / \ln 2 = 1.0986/0.6931 = 1.58496$, so
      $k = 1.585$ to three places. Sanity-check it against the tree: the level
      sums are $n, (3/2)n, (3/2)^{2}n, \dots$, growing geometrically toward the
      leaves, which confirms the bottom level is the expensive one. This is
      Karatsuba's exponent, and the reason it is worth remembering is the
      comparison it invites: $\Theta(n^{1.585})$ beats the $\Theta(n^{2})$ of
      schoolbook multiplication precisely because the third recursive call was
      bought back by algebra instead of a fourth, which would give
      $\log_{2} 4 = 2$ and no saving at all.
    expects: "1.585"
    tolerance: 0.0005
    rubric:
      - >
        Compares $n^{\log_{2} 3}$ against the linear combine term and concludes
        the leaves dominate, rather than reading the exponent off the combine
        step.
      - >
        Computes $\log_{2} 3 = 1.58496$ and notes that $4$ subproblems would
        give exactly $2$, the schoolbook exponent.
    targets:
      - quant-programming.complexity.divide-conquer-recurrence
    exercises:
      - quant-programming.complexity.log-halving

  # --- amortized analysis -------------------------------------------------------

  - id: qcplx-amortized-01
    kind: work
    difficulty: demanding
    statement: >
      A binary counter starts at $0$ and is incremented $32$ times, ending at
      $32$. Each increment flips some bits: the lowest bit flips on every
      increment, the next bit on every second increment, the next on every
      fourth, and so on. Charging one unit per bit flipped, what is the
      amortized cost per increment over this run? Give it as an exact fraction.
    answer: >
      $63/32$. Bit $i$ flips once every $2^{i}$ increments, so over $n$
      increments from zero it flips $\lfloor n/2^{i} \rfloor$ times, and the
      total is $\sum_{i \ge 0} \lfloor n/2^{i} \rfloor$. At $n = 32$ that is
      $32 + 16 + 8 + 4 + 2 + 1 = 63$ — the highest term is the single flip of
      bit $5$ on the very last increment, when $31$ becomes $32$. Dividing by
      the $32$ increments gives $63/32 = 1.96875$ units each. The general bound
      is the same geometric argument: the sum is strictly less than
      $n(1 + 1/2 + 1/4 + \dots) = 2n$, so the amortized cost is under $2$ flips
      per increment for every $n$, and incrementing is $O(1)$ amortized. The
      trap the node names is reporting the extreme as typical: the increment
      from $31$ to $32$ flips $6$ bits at once, and quoting $6$ — or, in
      general, $\Theta(\log n)$ — as the cost per increment ignores that such
      increments are rare by construction, one in thirty-two here.
    expects: "63/32"
    rubric:
      - >
        Counts flips per bit position, $\lfloor 32/2^{i} \rfloor$, rather than
        counting bits per increment and guessing an average.
      - >
        Distinguishes the $6$-bit worst single increment from the amortized
        $63/32 < 2$, and gives the geometric reason the bound is $2n$ for any
        $n$.
    targets:
      - quant-programming.complexity.amortized
    exercises:
      - quant-programming.complexity.big-o

  - id: qcplx-amortized-02
    kind: decide
    difficulty: standard
    statement: >
      A data structure's operations are advertised as $O(1)$ amortized. Which
      statement is exactly what that guarantees?
    answer: >
      Any sequence of $n$ operations costs $O(n)$ in total, whatever order the
      operations come in. That is the definition: the amortized cost is total
      cost over sequence length, so the guarantee attaches to sequences, not to
      calls. Two neighbouring claims are strictly stronger and are not implied.
      "Each individual operation is $O(1)$" is a worst-case-per-operation
      claim, and it fails for the standard examples — the push that triggers a
      resize really does cost $\Theta(n)$. "It is $O(1)$ on random inputs" is
      an average-case claim over a distribution, which is weaker in a different
      direction: amortized bounds carry no distribution at all and survive an
      adversary who picks the worst possible order, because the counting
      argument charges each unit of work to an operation that has already
      happened. Keeping those three apart — worst case per call, average over
      inputs, amortized over a sequence — is most of what the term is for.
    choices:
      - text: >
          Any sequence of $n$ operations, including the worst order an
          adversary could choose, costs $O(n)$ in total.
        correct: true
        feedback: >
          Right — the guarantee is about the whole sequence, and it holds
          against an adversary because it is a counting argument, not a
          probabilistic one.
      - text: >
          Every individual call costs $O(1)$.
        feedback: >
          That is worst case per operation, which is strictly stronger. A
          resize-triggering push is $\Theta(n)$ and the amortized bound still
          holds.
      - text: >
          The average cost is $O(1)$ when the operation sequence is drawn at
          random, but an adversary can force more.
        feedback: >
          That is average-case analysis. Amortized bounds assume no
          distribution and do not break under adversarial ordering.
      - text: >
          The cost becomes $O(1)$ once the structure is large enough.
        feedback: >
          Amortized says nothing about a warm-up period; the total-over-$n$
          bound holds from the first operation.
    rubric:
      - >
        Attaches the guarantee to the whole sequence — total cost over
        operation count — rather than to any one call.
      - >
        Separates amortized from average-case, noting that the amortized bound
        survives adversarial ordering because it is a counting argument.
    targets:
      - quant-programming.complexity.amortized
    exercises:
      - quant-programming.complexity.big-o

  - id: qcplx-amortized-03
    kind: work
    difficulty: routine
    statement: >
      A structure charges $1$ unit for each operation and, immediately after
      every fourth operation, rebuilds itself at a further cost of $10$ units.
      Over a run of exactly $30$ operations, what is the amortized cost per
      operation? Give it as an exact fraction.
    answer: >
      $10/3$. The operations themselves cost $30$ units. Rebuilds fire after
      operations $4, 8, 12, 16, 20, 24$ and $28$ — that is
      $\lfloor 30/4 \rfloor = 7$ rebuilds, since the eighth would come after
      operation $32$ and the run stops at $30$ — costing $7 \cdot 10 = 70$
      units. The total is $30 + 70 = 100$ units over $30$ operations, so the
      amortized cost is $100/30 = 10/3 \approx 3.33$ units. Note that the
      rebuild cost here is a *constant*, so the amortized cost stays $O(1)$;
      the answer would be very different if the rebuild cost grew with the
      size, which is exactly the distinction the doubling array turns on. The
      slip to avoid is dividing $30/4 = 7.5$ and charging $7.5$ rebuilds: a
      rebuild either happened within the run or it did not, so the count is a
      floor.
    expects: "10/3"
    rubric:
      - >
        Takes $\lfloor 30/4 \rfloor = 7$ rebuilds rather than $7.5$, and says
        why the count is a floor.
      - >
        Divides the total cost, operations plus rebuilds, by the operation
        count — not the rebuild cost alone.
    targets:
      - quant-programming.complexity.amortized
    exercises:
      - quant-programming.complexity.big-o

  # --- doubling array: total copies -------------------------------------------

  - id: qcplx-doubling-worked-01
    kind: work
    difficulty: demanding
    statement: >
      A dynamic array starts at capacity $1$ and *triples* its capacity
      whenever a push overflows it, copying every element already stored into
      the new block. After $250$ pushes, how many element copies have been
      performed in total?
    answer: >
      $364$. The capacities visited are $1, 3, 9, 27, 81, 243, 729$, and a
      resize away from capacity $c$ copies exactly $c$ elements. Within $250$
      pushes the resizes that fire are those leaving capacities
      $1, 3, 9, 27, 81$ and $243$ — the last of them on push $244$, when the
      array holding $243$ elements overflows — so the copies total
      $1 + 3 + 9 + 27 + 81 + 243 = 364$. The next resize would leave capacity
      $729$, far beyond the run. The geometric series is what makes this
      $O(1)$ amortized: copies sum to
      $(3 \cdot 243 - 1)/2 = 364$, and in general a growth factor $r$ gives
      total copies below $n \cdot r/(r-1)$, here $250 \cdot 1.5 = 375$. So the
      amortized copies per push are $364/250 = 1.456$, a constant. The trap is
      assuming a bigger growth factor makes copying asymptotically cheaper: it
      only changes the constant, from under $2$ per push at doubling to under
      $1.5$ here, while wasting more memory. Growing by a fixed *increment*
      instead of a factor is the change that actually breaks the bound.
    expects: "364"
    rubric:
      - >
        Lists the capacities as powers of three and charges each resize the
        capacity it is leaving, stopping before the resize that would fire past
        push $250$.
      - >
        Uses the geometric sum to bound total copies by $n \cdot r/(r-1)$, and
        says that the growth factor changes the constant, not the class.
    targets:
      - quant-programming.complexity.doubling-worked
    exercises:
      - quant-programming.complexity.amortized

  - id: qcplx-doubling-worked-02
    kind: work
    difficulty: standard
    statement: >
      A dynamic array starts at capacity $1$ and doubles on overflow. Charge
      one unit for each of the $40$ pushes and one unit for each element copied
      during a resize. What is the total cost per push, averaged over the $40$
      pushes?
    answer: >
      $2.575$. The resizes fire when the array is full at capacities
      $1, 2, 4, 8, 16$ and $32$, copying that many elements each time, so
      copying costs $1 + 2 + 4 + 8 + 16 + 32 = 63$ units; the next resize would
      be at capacity $64$, past the end of the run. Adding the $40$ pushes
      themselves gives $40 + 63 = 103$ units, and $103/40 = 2.575$ units per
      push. The geometric bound behind it is the reason the average stays flat
      as $n$ grows: copies are always under $2n$, so total cost is under $3n$
      and the amortized cost per push is a constant under $3$, no matter how
      large $n$ becomes. The trap is charging every push the worst case:
      $40$ pushes at the cost of the most expensive one, $32$ copies, suggests
      quadratic behaviour, when in fact expensive pushes get rarer at exactly
      the rate their cost grows.
    expects: "2.575"
    rubric:
      - >
        Sums the copies over the capacities actually reached, $1$ through $32$,
        rather than assuming a resize at every push or at a fixed interval.
      - >
        Adds the pushes themselves before averaging, and notes that the bound
        stays constant as $n$ grows because copies are under $2n$.
    targets:
      - quant-programming.complexity.doubling-worked
    exercises:
      - quant-programming.complexity.amortized

  # --- space–time tradeoffs -----------------------------------------------------

  - id: qcplx-space-time-tradeoff-01
    kind: work
    difficulty: demanding
    statement: >
      An unsorted array of $n = 2^{16} = 65536$ numbers must answer membership
      queries. Option A scans linearly every time, $n$ comparisons per query.
      Option B sorts the array once at a cost of $n\log_{2} n$ comparisons and
      then binary-searches, $\log_{2} n$ comparisons per query. Counting
      comparisons only, what is the smallest number of queries $q$ for which
      Option B costs strictly less in total?
    answer: >
      $17$. Option A costs $65536q$ and Option B costs
      $65536 \cdot 16 + 16q = 1048576 + 16q$, since $\log_{2} 65536 = 16$.
      Option B wins when $1048576 + 16q < 65536q$, that is
      $1048576 < 65520q$, so $q > 16.0039$ and the smallest integer is
      $q = 17$. Check the boundary: at $q = 16$, Option B costs
      $1048576 + 256 = 1048832$ against Option A's $1048576$ — Option B still
      loses, by $256$ comparisons. At $q = 17$ it costs $1048848$ against
      $1114112$ and wins comfortably. The trap is dividing the setup cost by
      the per-query saving carelessly: $n\log_{2} n / n = \log_{2} n = 16$
      invites the answer $16$, which ignores that a binary search is not free
      either. It is also the honest summary of the tradeoff — the precompute
      pays for itself after a handful of queries, which is why "can you do
      better?" is so often answered by precomputing.
    expects: "17"
    rubric:
      - >
        Writes both totals as functions of $q$ and solves the strict
        inequality, rather than comparing per-query costs alone.
      - >
        Keeps the $16$ comparisons each binary search still costs — the
        crossover is at $q > 1048576/65520$, not at $\log_{2} n$.
    targets:
      - quant-programming.complexity.space-time-tradeoff
    exercises:
      - quant-programming.complexity.growth-ranking

  - id: qcplx-space-time-tradeoff-02
    kind: work
    difficulty: standard
    statement: >
      A prefix-sum array over $n = 5 \times 10^{6}$ values buys $O(1)$
      range-sum queries in exchange for one extra array of the same length,
      each entry an $8$-byte integer. Taking one megabyte as $10^{6}$ bytes,
      how many megabytes of extra memory does that cost?
    answer: >
      $40$. The extra array holds $5 \times 10^{6}$ entries at $8$ bytes each,
      so it needs $5 \times 10^{6} \cdot 8 = 4 \times 10^{7}$ bytes, which is
      $40$ megabytes. That is the whole trade stated in the units that decide
      it: $40$ megabytes of memory buys the drop from $5 \times 10^{6}$
      additions per range query to a single subtraction, so a workload of even
      a thousand queries saves on the order of $5 \times 10^{9}$ operations for
      $40$ megabytes. The trap is quoting the element *count* as the memory
      cost and answering $5$: the width of the stored type is exactly what
      turns a length into a footprint, and it is also why widening the sums to
      $8$ bytes to avoid overflow doubles the memory bill of a $4$-byte
      original.
    expects: "40"
    rubric:
      - >
        Multiplies the entry count by the $8$-byte width before converting to
        megabytes, rather than reporting the count.
      - >
        States the trade in both directions: memory spent against operations
        per query saved.
    targets:
      - quant-programming.complexity.space-time-tradeoff
    exercises:
      - quant-programming.complexity.growth-ranking

  # --- hashing: expected O(1) ---------------------------------------------------

  - id: qcplx-hashing-cost-01
    kind: work
    difficulty: demanding
    statement: >
      An open-addressed hash table with $m = 4096$ slots currently holds
      $n = 3584$ keys. Under the uniform-probing model, an unsuccessful search
      — and therefore an insertion, which probes until it finds an empty slot —
      takes an expected $1/(1-\alpha)$ probes, where $\alpha = n/m$ is the load
      factor. How many probes is that here?
    answer: >
      $8$. The load factor is $\alpha = 3584/4096 = 0.875$, so the expected
      probe count is $1/(1-0.875) = 1/0.125 = 8$. The number is the honest
      content of "expected $O(1)$": the bound is constant *in $n$* — doubling
      both $m$ and $n$ leaves it at $8$ — but the constant is a function of
      $\alpha$ and it explodes as the table fills. At $\alpha = 0.5$ it is
      $2$ probes, at $0.875$ it is $8$, and at $0.9375$ it is $16$; each
      halving of the free space doubles the work. That is precisely why real
      implementations rehash into a larger table at a load threshold rather
      than filling to the brim, and why the amortized cost of those rehashes is
      the price paid to keep this constant small. The trap is hearing
      "expected $O(1)$" as "about one probe" and sizing a latency budget on
      that basis.
    expects: "8"
    rubric:
      - >
        Computes $\alpha = 3584/4096 = 0.875$ before substituting, rather than
        reading a load factor off the slot count.
      - >
        Reads the $O(1)$ correctly: constant in $n$, but with a constant that
        blows up as $\alpha \to 1$, which is what forces rehashing.
    targets:
      - quant-programming.complexity.hashing-cost
    exercises:
      - quant-programming.complexity.big-o

  - id: qcplx-hashing-cost-02
    kind: work
    difficulty: standard
    statement: >
      A chained hash table has $m = 600$ buckets holding $n = 1500$ keys spread
      by a good hash function. A successful lookup costs one comparison plus,
      on average, half of the rest of its bucket's chain — an expected
      $1 + \alpha/2$ comparisons at load factor $\alpha = n/m$. How many
      comparisons is that?
    answer: >
      $2.25$. The load factor is $\alpha = 1500/600 = 2.5$, so the expected
      count is $1 + 2.5/2 = 1 + 1.25 = 2.25$ comparisons. The sharper textbook
      form, $1 + (n-1)/(2m) = 1 + 1499/1200 = 2.2492$, agrees to two decimal
      places, which is all the precision the model deserves. Two things are
      worth reading off the number. First, $\alpha > 1$ is perfectly healthy
      for chaining — buckets simply hold $2.5$ items on average — unlike open
      addressing, where $\alpha$ cannot exceed $1$ at all; treating a load
      factor above one as a bug is a confusion between the two collision
      strategies. Second, the cost depends only on $\alpha$, not on $n$: ten
      times the keys in ten times the buckets still costs $2.25$ comparisons,
      which is the entire content of the expected-$O(1)$ claim. An unsuccessful
      lookup scans a whole chain instead of half of one, costing
      $1 + \alpha = 3.5$.
    expects: "2.25"
    tolerance: 0.005
    rubric:
      - >
        Computes $\alpha = 2.5$ and substitutes into $1 + \alpha/2$, rather
        than assuming $\alpha$ must be below $1$.
      - >
        Notes that the answer depends on $\alpha$ alone, so growing $n$ and $m$
        together leaves it unchanged.
    targets:
      - quant-programming.complexity.hashing-cost
    exercises:
      - quant-programming.complexity.big-o

  - id: qcplx-hashing-cost-03
    kind: decide
    difficulty: standard
    statement: >
      An adversary who can read the program's hash function submits $n$ keys
      chosen so that every one of them lands in the same bucket. What happens
      to lookup cost, and what does that say about the $O(1)$ claim?
    answer: >
      Lookups degrade to $\Theta(n)$, and the expected-$O(1)$ guarantee is
      simply void, because its hypothesis — that keys spread roughly uniformly
      over buckets — is exactly what the adversary destroyed. With every key in
      one bucket the table is a linked list, and a lookup walks it: $n/2$
      comparisons on average for a hit, $n$ for a miss. Nothing about the
      analysis was wrong; the expectation was taken over a well-behaved
      assignment of keys to buckets, and an attacker who knows the function
      chooses the one assignment where that expectation does not apply. This is
      a real attack class, and the standard defence is randomisation — a seed
      chosen at run time, so the adversary cannot know which function is in use
      — which restores the expectation over the seed rather than over the keys.
      The general lesson is the one the node insists on: expected $O(1)$ is not
      worst-case $O(1)$, and the gap is $\Theta(n)$ wide.
    choices:
      - text: >
          Lookups become $\Theta(n)$: every guarantee collapses, because the
          uniformity the expectation assumed is gone.
        correct: true
        feedback: >
          Right — the table degenerates to one long chain, and the fix is a
          randomised hash seed the adversary cannot predict.
      - text: >
          Lookups stay expected $O(1)$, since the analysis is an expectation
          over random hash values.
        feedback: >
          The expectation assumed keys spread uniformly. An adversary choosing
          the keys is choosing the one case where it fails.
      - text: >
          Lookups degrade to $\Theta(\log n)$, as in a balanced tree.
        feedback: >
          A chain is not a tree — there is no ordering or balancing to exploit,
          so the walk is linear.
      - text: >
          The table detects the imbalance and rehashes, so cost stays $O(1)$.
        feedback: >
          Rehashing with the same function reproduces the same collisions.
          Only changing the function, ideally at random, helps.
    rubric:
      - >
        Names the hypothesis that fails — near-uniform spreading — rather than
        treating the $O(1)$ bound as unconditional.
      - >
        Gives the cost under the attack, $\Theta(n)$ per lookup, and the
        defence: a hash seed randomised at run time.
    targets:
      - quant-programming.complexity.hashing-cost
    exercises:
      - quant-programming.complexity.big-o

  # --- how few insertions it takes to collide ----------------------------------

  - id: qcplx-hash-collision-scale-01
    kind: work
    difficulty: demanding
    statement: >
      A system will issue $10^{9}$ identifiers drawn uniformly at random from a
      space of $m$ values, and wants the chance that some two collide to stay
      at or below about one half. Using the birthday rule that even odds arrive
      after roughly $1.2\sqrt{m}$ draws, what is the smallest identifier width
      in whole bits that suffices?
    answer: >
      $60$ bits. The requirement is $1.2\sqrt{m} \ge 10^{9}$, so
      $\sqrt{m} \ge 10^{9}/1.2 = 8.33 \times 10^{8}$ and
      $m \ge (8.33 \times 10^{8})^{2} = 6.94 \times 10^{17}$. Taking base-two
      logarithms, $\log_{2}(6.94 \times 10^{17}) = 59.27$, so $59$ bits is not
      enough and $60$ is. Checking both directly settles it: at $59$ bits,
      $m = 5.76 \times 10^{17}$ and $1.2\sqrt{m} = 9.11 \times 10^{8}$, short
      of $10^{9}$; at $60$ bits, $m = 1.15 \times 10^{18}$ and
      $1.2\sqrt{m} = 1.29 \times 10^{9}$, which clears it. The trap is sizing
      the space to the *count* of identifiers rather than to its square:
      $10^{9}$ ids sound like they need $30$ bits, and that reasoning is wrong
      by a factor of two in the exponent, because collisions arrive at the
      square root of the space, not at the space itself. The same square-root
      law is why widening a hash by $k$ bits multiplies the safe issuance count
      by $2^{k/2}$.
    expects: "60"
    rubric:
      - >
        Inverts the rule correctly — $m \ge (10^{9}/1.2)^{2}$ — instead of
        setting $m \ge 10^{9}$.
      - >
        Rounds up to a whole bit width and verifies that $59$ bits genuinely
        falls short.
    targets:
      - quant-programming.complexity.hash-collision-scale
    exercises:
      - quant-programming.complexity.hashing-cost

  - id: qcplx-hash-collision-scale-02
    kind: work
    difficulty: standard
    statement: >
      A content-addressed store keys objects by a $50$-bit hash, so
      $m = 2^{50}$ possible digests. Using $k \approx 1.2\sqrt{m}$, about how
      many objects can it hold before the chance of some collision reaches
      about one half? Give the answer in millions, rounded to the nearest
      million.
    answer: >
      About $40$ million. The square root of $2^{50}$ is $2^{25} = 33554432$,
      and $1.2 \cdot 33554432 = 40265318$, which is $40$ million to the nearest
      million. The gap between that and the size of the digest space is the
      point: $2^{50}$ is about $1.1 \times 10^{15}$, so even odds of a
      collision arrive after storing roughly one object per $28$ million
      available digests — seven orders of magnitude below the space, and well
      inside what a real store would hold. The trap is quoting the space size
      itself as the safe capacity, which overstates it by a factor of
      $\sqrt{m}/1.2$, about $28$ million here. This is the practical reason
      content addressing uses $128$ bits or more rather than the $50$ that a
      naive count of expected objects would suggest.
    expects: "40"
    rubric:
      - >
        Uses $\sqrt{2^{50}} = 2^{25}$ rather than halving the exponent
        incorrectly or working with $2^{50}$ directly.
      - >
        Compares the answer against the digest-space size to show how far below
        it the collision threshold sits.
    targets:
      - quant-programming.complexity.hash-collision-scale
    exercises:
      - quant-programming.complexity.hashing-cost

  # --- floating point ------------------------------------------------------------

  - id: qcplx-floating-point-01
    kind: work
    difficulty: demanding
    statement: >
      A double stores a $52$-bit fraction, so between $2^{e}$ and $2^{e+1}$ the
      representable values are evenly spaced $2^{e-52}$ apart. What is the gap
      between consecutive doubles immediately above $2^{60}$?
    answer: >
      $256$. Substituting $e = 60$ gives a spacing of
      $2^{60-52} = 2^{8} = 256$. Near $2^{60} \approx 1.15 \times 10^{18}$,
      then, no double distinguishes two values less than $256$ apart: adding
      $100$ to such a number returns the number unchanged, and a loop that
      increments a counter of that magnitude by one never moves. The same
      formula explains the familiar landmark from the other end — the spacing
      first exceeds $1$ when $e - 52 > 0$, that is above $2^{53}$, which is why
      $2^{53}$ is the last point at which every integer is still exact. The
      trap is treating doubles as if precision were absolute rather than
      relative: they carry about $16$ significant digits *wherever* they sit,
      so the absolute gap grows in proportion to the magnitude, and an
      $\varepsilon$ of $10^{-9}$ that is a sensible tolerance near $1$ is
      finer than the representation itself near $10^{18}$.
    expects: "256"
    rubric:
      - >
        Substitutes $e = 60$ into the stated spacing $2^{e-52}$ rather than
        quoting a fixed absolute precision.
      - >
        Draws the consequence: near $2^{60}$ an addition smaller than $256$ is
        lost entirely, and a fixed absolute $\varepsilon$ becomes meaningless.
    targets:
      - quant-programming.complexity.floating-point

  - id: qcplx-floating-point-02
    kind: work
    difficulty: standard
    statement: >
      A single-precision float stores a $23$-bit fraction plus one implicit
      leading bit, giving $24$ bits of integer precision. What is the smallest
      positive integer that a single-precision float cannot represent exactly?
    answer: >
      $16777217$. With $24$ bits of precision every integer from $0$ up to
      $2^{24} = 16777216$ is representable exactly, because each needs at most
      $24$ significant bits. The next integer, $2^{24} + 1 = 16777217$, needs
      $25$ significant bits — a leading one, twenty-three zeros, and a trailing
      one — so it has no exact representation and rounds to $16777216$. The
      visible symptom is a counter that silently stops advancing once it
      reaches about $16.8$ million, having incremented into a value that rounds
      straight back. Two slips to avoid: answering $2^{24} = 16777216$ names a
      number that *is* representable, since it is $1 \cdot 2^{24}$ with an
      all-zero fraction; and answering $2^{23}$ forgets the implicit leading
      bit, which buys one extra bit of precision for free. The double's
      analogue is the same argument with $53$ bits instead of $24$.
    expects: "16777217"
    rubric:
      - >
        Distinguishes $2^{24}$, which is exactly representable, from
        $2^{24}+1$, which needs a $25$th significant bit.
      - >
        Counts the implicit leading bit, so the precision is $24$ bits and not
        $23$.
    targets:
      - quant-programming.complexity.floating-point

  - id: qcplx-floating-point-03
    kind: decide
    difficulty: standard
    statement: >
      An engineer argues: "Big-O told me the algorithm is $\Theta(n)$, and a
      double carries about $16$ significant digits, so I can ignore the
      constant factor and I can ignore rounding." Which correction is right?
    answer: >
      Both notations are silent about a term that can dominate, and each bites
      when its hidden term does. $\Theta$ suppresses the constant factor, so it
      cannot decide between two routines in the same class: a $\Theta(n)$ pass
      costing $200$ operations per element loses to a $\Theta(n\log_{2} n)$ one
      costing $5$ per element-level until $200n = 5n\log_{2} n$, that is
      $\log_{2} n = 40$, or $n \approx 10^{12}$ — for every realistic input the
      asymptotically worse algorithm is the faster one. A double suppresses
      representation error, which is about $10^{-16}$ relative *per operation*
      and accumulates: summing $10^{12}$ values can lose several digits, and a
      single subtraction of two nearly equal numbers can lose all of them at
      once. The two are the same kind of abstraction leak, which is why they
      are worth learning together — each reports the shape of the answer
      honestly while saying nothing about the size of what it dropped.
    choices:
      - text: >
          Both abstractions hide a term that can dominate: the constant factor
          $\Theta$ drops decides which of two same-class routines wins at
          realistic $n$, and the per-operation rounding a double hides
          accumulates over long computations.
        correct: true
        feedback: >
          Right — each is honest about the shape of the cost and silent about
          the magnitude of what it discarded.
      - text: >
          Big-O may safely ignore constants, but a double with $16$ digits
          never loses meaningful precision.
        feedback: >
          One subtraction of nearly equal values can destroy every significant
          digit, and long sums degrade steadily.
      - text: >
          Neither abstraction hides anything; the two ideas are unrelated.
        feedback: >
          Both are approximations that discard a term, which is exactly what
          makes them comparable.
      - text: >
          Constants matter only for exponential algorithms, and rounding
          matters only for very large numbers.
        feedback: >
          Constants matter most *within* a class, and rounding bites hardest
          for nearly equal values of any size.
    rubric:
      - >
        Names what each notation discards — constant factors for $\Theta$,
        representation error for a double — instead of defending or attacking
        one of them alone.
      - >
        Gives a case where the discarded term decides the outcome, such as a
        crossover $n$ so large it never arrives, or a cancelling subtraction.
    targets:
      - quant-programming.complexity.floating-point
      - quant-programming.complexity.big-o
    connects:
      - "quant-programming.complexity.big-o ~ quant-programming.complexity.floating-point"

  # --- cancellation, tolerance, summation order --------------------------------

  - id: qcplx-cancellation-tolerance-01
    kind: work
    difficulty: demanding
    statement: >
      Evaluating $(1-\cos x)/x^{2}$ in double precision at $x = 10^{-8}$
      returns exactly $0$: $\cos(10^{-8})$ rounds to $1$, and the subtraction
      throws away every significant digit. Rewriting the numerator by the
      identity $1-\cos x = 2\sin^{2}(x/2)$ cancels nothing. What value does the
      rewritten expression return at $x = 10^{-8}$, to three decimal places?
    answer: >
      $0.5$. The rewritten expression is
      $2\sin^{2}(x/2)/x^{2} = \frac{1}{2}\left(\frac{\sin(x/2)}{x/2}\right)^{2}$,
      and since $\sin t / t \to 1$ as $t \to 0$, the value is
      $\frac{1}{2}(1)^{2} = 0.5$ up to a correction of order $x^{2}/24$, which
      at $x = 10^{-8}$ is about $4 \times 10^{-18}$ and invisible. Crucially
      the rewritten form is stable in floating point too: $\sin(5 \times
      10^{-9})$ is computed to full *relative* accuracy — small results are
      represented finely, and no subtraction of nearly equal numbers happens
      anywhere — so squaring and dividing preserves it and the machine really
      does return $0.5$. The naive form returns $0$, an error of $100\%$,
      because $1 - \cos x$ subtracts two numbers that agree in all $16$ digits.
      The trap is believing the $0$: it looks like a clean limit and is in fact
      the signature of catastrophic cancellation, the same failure that makes
      $\sqrt{x+1}-\sqrt{x}$ unusable at large $x$ until it is rewritten.
    expects: "0.5"
    tolerance: 0.0005
    rubric:
      - >
        Recognises $\sin t / t \to 1$ and reduces the rewritten expression to
        $\frac{1}{2}$, rather than evaluating term by term.
      - >
        Explains why the rewrite is numerically safe — no subtraction of nearly
        equal quantities, and small values keep full relative precision — and
        names the naive $0$ as cancellation, not a limit.
    targets:
      - quant-programming.complexity.cancellation-tolerance
    exercises:
      - quant-programming.complexity.floating-point

  - id: qcplx-cancellation-tolerance-02
    kind: decide
    difficulty: standard
    statement: >
      A million positive doubles, ranging in magnitude from about $10^{-6}$ up
      to about $10^{6}$, must be added together as accurately as possible.
      Which procedure is right?
    answer: >
      Sort ascending and add smallest first, or use compensated (Kahan)
      summation. The failure mode to design against is a running total that has
      grown far larger than the next value being added: near a total of
      $10^{6}$ the spacing between representable doubles is about
      $10^{-10}$, so a value of $10^{-6}$ still registers, but the same value
      added to a total near $10^{12}$ would vanish entirely. Adding ascending
      keeps the accumulator as small as possible for as long as possible, so
      the small values are combined with each other — where they are
      comparable — before they meet the large ones. Kahan summation attacks the
      same problem differently, carrying the rounding error of each addition in
      a compensation variable and folding it back in, which bounds the total
      error independently of the ordering. Descending is exactly backwards, and
      "order cannot matter" mistakes floating-point addition for an associative
      operation: it is commutative but not associative, and reordering a long
      sum genuinely changes the result.
    choices:
      - text: >
          Sort ascending and add the smallest values first, or use compensated
          (Kahan) summation.
        correct: true
        feedback: >
          Right — keep the accumulator small while the small values are being
          combined, or carry the lost low-order bits explicitly.
      - text: >
          Sort descending, so the large values are added while the accumulator
          is still exact.
        feedback: >
          That maximises the gap between accumulator and addend exactly when
          the small values arrive, so they round away.
      - text: >
          Order cannot matter, because addition is associative.
        feedback: >
          Floating-point addition is commutative but *not* associative, and
          reordering a long sum changes the answer.
      - text: >
          Round every value to six decimals first, then add.
        feedback: >
          That discards real information up front and does nothing about the
          accumulator growing past the addends.
    rubric:
      - >
        Identifies the mechanism — an addend smaller than the accumulator's
        representable spacing is lost — rather than asserting a rule of thumb.
      - >
        Notes that floating-point addition is not associative, so summation
        order genuinely changes the result, and names Kahan summation as the
        order-independent alternative.
    targets:
      - quant-programming.complexity.cancellation-tolerance
    exercises:
      - quant-programming.complexity.floating-point

  # --- integer overflow at 2^31 -------------------------------------------------

  - id: qcplx-integer-overflow-01
    kind: work
    difficulty: demanding
    statement: >
      A program counts unordered pairs of items, $n(n-1)/2$, and stores the
      count in a signed $32$-bit integer whose largest value is $2147483647$.
      What is the largest $n$ for which the count still fits?
    answer: >
      $65536$. Solve $n(n-1)/2 \le 2147483647$, that is
      $n^{2} - n - 4294967294 \le 0$, giving
      $n \le (1 + \sqrt{1 + 4 \cdot 4294967294})/2 \approx 65536.5$. Check both
      sides of that boundary exactly: $n = 65536$ gives
      $65536 \cdot 65535/2 = 2147450880$, which fits with $32767$ to spare, and
      $n = 65537$ gives $65537 \cdot 65536/2 = 2147516416$, over the limit by
      $32769$. So the answer is $65536$, and the coincidence is worth
      remembering — a signed $32$-bit pair counter overflows at about $2^{16}$
      items, because squaring the count is what fills a $32$-bit box with a
      $16$-bit input. The trap is checking the wrong quantity: $n$ itself is
      nowhere near $2^{31}$ at $65536$, so a habit of asking "could this input
      be over two billion?" passes, while the *derived* quantity — a count of
      pairs, a sum of squares, a product of two inputs — is the thing that
      actually overflows.
    expects: "65536"
    rubric:
      - >
        Solves the quadratic against $2147483647$ and then verifies the two
        integers around the root rather than trusting the square root alone.
      - >
        Checks the derived quantity $n(n-1)/2$, not $n$, and says why that is
        where overflow hides.
    targets:
      - quant-programming.complexity.integer-overflow

  - id: qcplx-integer-overflow-02
    kind: work
    difficulty: standard
    statement: >
      In a signed $32$-bit integer, a program computes the product
      $46341 \times 46341$. The true value is $2147488281$, just past the
      maximum $2147483647$. Two's-complement wraparound subtracts
      $2^{32} = 4294967296$ from any true value that lands in the upper half of
      the range. What value does the variable end up holding?
    answer: >
      $-2147479015$. The true product exceeds the signed maximum by
      $2147488281 - 2147483647 = 4634$, so the bit pattern has its sign bit
      set, and interpreting it as two's complement means subtracting $2^{32}$:
      $2147488281 - 4294967296 = -2147479015$. Two positive factors have
      produced a large negative result, which is the visible signature of the
      bug — and the reason it is worth knowing that $46340^{2} = 2147395600$
      fits while $46341^{2}$ does not, making $46341$ the first integer whose
      square overflows a signed $32$-bit int. The traps are both arithmetic:
      subtracting $2^{31}$ instead of $2^{32}$ gives $-4634$, a plausible-
      looking small negative that is simply wrong; and expecting an error to be
      raised misreads what happens, since the wrap is silent in some languages
      and undefined behaviour in others, never a thrown exception.
    expects: "-2147479015"
    rubric:
      - >
        Subtracts $2^{32}$, not $2^{31}$, to reinterpret the bit pattern as a
        signed value.
      - >
        Notes that no error is raised — a positive-times-positive silently
        yielding a negative is the only symptom.
    targets:
      - quant-programming.complexity.integer-overflow

  - id: qcplx-integer-overflow-03
    kind: work
    difficulty: standard
    statement: >
      A dynamic array holds its capacity in a signed $32$-bit integer, starts
      at capacity $1$, and doubles that variable on every overflow. After how
      many doublings does the capacity variable first hold a value that is not
      a positive number?
    answer: >
      $31$. The capacity takes the values $2^{1}, 2^{2}, \dots$, and
      $2^{30} = 1073741824$ still sits comfortably below the signed maximum
      $2147483647$, so the first thirty doublings are fine. The thirty-first
      wants $2^{31} = 2147483648$, one past the maximum; the bit pattern is a
      lone set sign bit, which as a signed value is $-2147483648$. From that
      moment the array's own bookkeeping is nonsense: a negative capacity makes
      every "is the array full?" comparison and every allocation size wrong,
      and the failure appears as a crash or a corrupt allocation rather than
      as an honest out-of-memory error. The point of pairing this with the
      doubling array is that the amortized argument and the arithmetic are
      independent guarantees — the geometric series still proves $O(1)$
      amortized copying, and says nothing whatever about the integer that
      computes the next capacity. The traps are answering $32$, reading the bit
      width as the count, or $30$, stopping at the last value that fits.
    expects: "31"
    rubric:
      - >
        Tracks the capacity as $2^{k}$ and finds the first $k$ with
        $2^{k} > 2147483647$, which is $k = 31$, not $32$.
      - >
        Says that the amortized $O(1)$ analysis of doubling is untouched by
        this — it is a separate failure in the arithmetic that computes the
        capacity.
    targets:
      - quant-programming.complexity.integer-overflow
      - quant-programming.complexity.doubling-worked
    connects:
      - "quant-programming.complexity.doubling-worked ~ quant-programming.complexity.integer-overflow"
