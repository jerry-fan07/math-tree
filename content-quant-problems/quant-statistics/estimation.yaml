# Problems targeting quant-statistics.estimation — scoring a guess at a parameter.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's instance. See ../README.md.

problems:
  # --- estimator, estimate, sampling distribution -----------------------------

  - id: qest-estimator-01
    kind: work
    difficulty: demanding
    statement: >
      Four analysts independently price the same illiquid bond. Their quotes
      $X_1,\dots,X_4$ are uncorrelated, each with mean $\mu$ and variance
      $\sigma^{2} = 36$. A desk head blends them by seniority as
      $T = 0.4X_1 + 0.3X_2 + 0.2X_3 + 0.1X_4$. What is the standard error of
      $T$, to four decimals?
    answer: >
      $3.2863$. The weights sum to $1$, so $\mathbb{E}[T] = \mu$ by linearity
      and $T$ is a genuine unbiased estimator, not merely a number. Because the
      quotes are uncorrelated the variance passes through as a sum of squared
      weights: $\operatorname{Var}(T) = \sigma^{2}(0.4^{2} + 0.3^{2} + 0.2^{2}
      + 0.1^{2}) = 36(0.16 + 0.09 + 0.04 + 0.01) = 36(0.30) = 10.8$, so the
      standard error is $\sqrt{10.8} \approx 3.2863$. The comparison is the
      point: equal weights give squared-weight sum $4(0.25)^{2} = 0.25$,
      variance $9$ and standard error exactly $3$. Seniority weighting bought
      nothing and cost precision — among unbiased linear blends of uncorrelated
      equal-variance quotes, the flat average is the quietest.
    expects: "3.2863"
    tolerance: 0.0005
    rubric:
      - >
        Squares the weights before multiplying by $\sigma^{2}$, rather than
        summing the weights themselves.
      - >
        Checks that the weights sum to $1$, which is what makes $T$ unbiased,
        and compares the result against the equal-weight standard error $3$.
    targets:
      - quant-statistics.estimation.estimator
    exercises:
      - quant-probability.expectation.variance

  - id: qest-estimator-02
    kind: decide
    difficulty: standard
    statement: >
      Observations $X_1,\dots,X_n$ are iid $N(\mu,\sigma^{2})$ with both
      parameters unknown. Which one of the following rules is a statistic —
      something you could actually evaluate once the sample is in hand?
    answer: >
      Only $\frac{1}{n-1}\sum_{i}(X_i - \bar{X})^{2}$ qualifies. A statistic is
      a function of the data alone, and the test is mechanical: read the
      formula and ask whether every symbol in it is either an observation or a
      constant you know. That rule passes, since $\bar{X}$ is itself computed
      from the sample. The other three all smuggle in an unknown: two of them
      name $\mu$, which is exactly what you do not have, and the last names
      $\sigma$, the population standard deviation, which involves no data at
      all and is a number about the model rather than about the sample. A rule
      that mentions $\theta$ can never be evaluated, so it cannot be an
      estimator of $\theta$ — the estimator has to work without already knowing
      the answer.
    choices:
      - text: >
          $\frac{1}{n-1}\sum_{i}(X_i - \bar{X})^{2}$
        correct: true
        feedback: >
          Right — every symbol is an observation or is built from
          observations, so the rule returns a number on any sample.
      - text: >
          $\frac{1}{n}\sum_{i}(X_i - \mu)^{2}$
        feedback: >
          This centres the deviations at the unknown $\mu$. It is a perfectly
          good formula and a hopeless statistic: you cannot evaluate it.
      - text: >
          $\bar{X} - \mu$
        feedback: >
          Same slip in simpler dress — knowing this quantity would mean already
          knowing $\mu$, since $\bar{X}$ is observed.
      - text: >
          $\sqrt{\operatorname{Var}(X_1)}$, the population standard deviation
        feedback: >
          This is a feature of the model, not a function of the sample; it
          would take the same value whatever data arrived.
    rubric:
      - >
        Applies the data-only test symbol by symbol rather than judging the
        formulas by how reasonable they look.
      - >
        Distinguishes a population quantity such as $\operatorname{Var}(X_1)$
        from a sample quantity computed from the $X_i$.
    targets:
      - quant-statistics.estimation.estimator

  # --- bias, variance and mean squared error ----------------------------------

  - id: qest-bias-mse-01
    kind: work
    difficulty: demanding
    statement: >
      A miscalibrated instrument reports $\hat{\theta} = 0.9X + 1$, where the
      raw reading $X$ has mean $\theta$ and variance $25$. The quantity being
      measured is $\theta = 20$. What is $\operatorname{MSE}(\hat{\theta})$ at
      this value?
    answer: >
      $21.25$. Take the two pieces separately.
      $\mathbb{E}[\hat{\theta}] = 0.9(20) + 1 = 19$, so the bias is
      $19 - 20 = -1$. Scaling multiplies the variance by the square of the
      factor and the additive constant contributes nothing:
      $\operatorname{Var}(\hat{\theta}) = 0.9^{2}(25) = 20.25$. Therefore
      $\operatorname{MSE} = \operatorname{Var} + \operatorname{bias}^{2} =
      20.25 + 1 = 21.25$. The trap is the value of $\theta$ at which the bias
      vanishes: $0.9\theta + 1 = \theta$ solves to $\theta = 10$, and an
      instrument that happened to be pointed at $\theta = 10$ would look
      unbiased. Unbiasedness is required for *every* $\theta \in \Theta$, so
      this instrument is biased, and getting lucky at one value does not
      change that.
    expects: "21.25"
    rubric:
      - >
        Uses $0.9^{2}$ on the variance and ignores the additive $1$ there,
        while keeping the $1$ in the mean.
      - >
        Notes that the bias vanishes only at $\theta = 10$, so the estimator is
        biased even though one value makes it look otherwise.
    targets:
      - quant-statistics.estimation.bias-mse
    exercises:
      - quant-probability.expectation.variance

  - id: qest-bias-mse-02
    kind: decide
    difficulty: standard
    statement: >
      Two estimators of the same $\theta$ are quoted at the value of $\theta$
      you care about. Estimator A is unbiased with variance $9$. Estimator B
      has bias $2$ and variance $4$. Which should you prefer, and why?
    answer: >
      B, because it has the smaller mean squared error.
      $\operatorname{MSE}(A) = 9 + 0^{2} = 9$ while
      $\operatorname{MSE}(B) = 4 + 2^{2} = 8$, so B is closer to $\theta$ in
      squared error despite missing systematically. Unbiasedness is a
      constraint you may impose, not the thing you are scored on: A never leans
      one way, but it swings so much that its typical squared miss is larger.
      The comparison holds only at this $\theta$, since bias and variance are
      both functions of the unknown parameter; B could lose elsewhere. That
      caveat is the honest form of the answer, and it is why a uniformly
      smaller MSE is a real victory and rarely available.
    choices:
      - text: >
          B, since $\operatorname{MSE}(B) = 8 < 9 = \operatorname{MSE}(A)$.
        correct: true
        feedback: >
          Right — variance plus squared bias, compared at the same $\theta$.
      - text: >
          A, since an unbiased estimator is always the safer choice.
        feedback: >
          That answers "which estimator is unbiased", not "which is more
          accurate". A's extra variance costs more than B's offset does.
      - text: >
          Neither — bias and variance are different quantities and cannot be
          traded against each other.
        feedback: >
          They combine exactly, on the squared-error scale:
          $\operatorname{MSE} = \operatorname{Var} +
          \operatorname{bias}^{2}$, which is a single number in the units of
          $\theta^{2}$.
    rubric:
      - >
        Computes both mean squared errors rather than comparing bias alone or
        variance alone.
      - >
        Says the verdict is stated at this $\theta$, since both quantities move
        with the unknown parameter.
    targets:
      - quant-statistics.estimation.bias-mse

  - id: qest-bias-mse-03
    kind: work
    difficulty: routine
    statement: >
      An estimator of $\theta$ satisfies $\mathbb{E}[\hat{\theta}] = 1.2\theta$
      and has standard error $5$, both at $\theta = 10$. What is its mean
      squared error there?
    answer: >
      $29$. Read the two ingredients off the statement. The mean is
      $1.2(10) = 12$, so the bias is $12 - 10 = 2$; the standard error is the
      standard deviation of the estimator, so the variance is $5^{2} = 25$.
      Then $\operatorname{MSE} = \operatorname{Var} +
      \operatorname{bias}^{2} = 25 + 4 = 29$. Two slips are worth naming. The
      standard error is not the variance, and squaring it is not optional —
      answering $5 + 4 = 9$ mixes the two scales. And the bias here is a
      proportional error of $20\%$, which grows with $\theta$: at
      $\theta = 100$ the bias would be $20$ and the squared bias $400$, so this
      estimator degrades badly for large parameters even with its variance
      fixed.
    expects: "29"
    rubric:
      - >
        Converts the standard error to a variance by squaring before adding.
      - >
        Computes the bias as $\mathbb{E}[\hat{\theta}] - \theta$ at the stated
        $\theta$, not as the multiplier $1.2$.
    targets:
      - quant-statistics.estimation.bias-mse

  # --- MSE = variance + bias squared ------------------------------------------

  - id: qest-mse-decomp-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $\hat{\theta}$ estimate $\theta$ with $\mathbb{E}[\hat{\theta}^{2}]$
      finite. Prove that $\mathbb{E}[(\hat{\theta} - \theta)^{2}] =
      \operatorname{Var}(\hat{\theta}) + (\mathbb{E}[\hat{\theta}] -
      \theta)^{2}$, and state exactly which hypotheses the proof consumes.
    answer: >
      Write $m = \mathbb{E}[\hat{\theta}]$ and $b = m - \theta$, and split the
      error at the estimator's own mean:
      $\hat{\theta} - \theta = (\hat{\theta} - m) + b$. The constant $b$ is not
      random, which is the whole point of splitting there. Squaring,
      $(\hat{\theta} - \theta)^{2} = (\hat{\theta} - m)^{2} +
      2b(\hat{\theta} - m) + b^{2}$, and taking expectations term by term gives
      $\operatorname{Var}(\hat{\theta}) + 2b\,\mathbb{E}[\hat{\theta} - m] +
      b^{2}$. The cross term vanishes because
      $\mathbb{E}[\hat{\theta} - m] = m - m = 0$: a variable's deviation from
      its own mean has mean zero, always. Hence
      $\operatorname{MSE} = \operatorname{Var} + b^{2}$. The only hypothesis
      used is a finite second moment, which is what makes every expectation
      above exist; linearity of expectation does the rest. Nothing is assumed
      about independence, about the sample, or about normality — the identity
      is about one random variable and one constant. Two readings follow: for
      an unbiased estimator the MSE is exactly the variance, so the best
      unbiased estimator is simply the quietest one; and squared bias enters on
      the same scale as variance, so a small bias costs little while a large
      variance always costs.
    rubric:
      - >
        Splits the error at $\mathbb{E}[\hat{\theta}]$ rather than at $\theta$,
        so that the cross term is the deviation from the estimator's own mean.
      - >
        Shows the cross term is zero by $\mathbb{E}[\hat{\theta} -
        \mathbb{E}[\hat{\theta}]] = 0$, not by assuming independence.
      - >
        Names the finite second moment as the only hypothesis, and says
        explicitly that no independence or normality is used.
    targets:
      - quant-statistics.estimation.mse-decomp
    exercises:
      - quant-probability.expectation.linearity

  - id: qest-mse-decomp-02
    kind: work
    difficulty: standard
    statement: >
      An estimator $\hat{\theta}$ takes the value $4$ with probability $0.2$,
      $7$ with probability $0.5$ and $11$ with probability $0.3$. It is
      estimating $\theta = 8$. What is $\operatorname{MSE}(\hat{\theta})$?
    answer: >
      $6.4$, by either route. Directly:
      $0.2(4-8)^{2} + 0.5(7-8)^{2} + 0.3(11-8)^{2} = 0.2(16) + 0.5(1) +
      0.3(9) = 3.2 + 0.5 + 2.7 = 6.4$. Through the decomposition:
      $\mathbb{E}[\hat{\theta}] = 0.8 + 3.5 + 3.3 = 7.6$, so the bias is
      $7.6 - 8 = -0.4$, and
      $\operatorname{Var}(\hat{\theta}) = 0.2(4-7.6)^{2} + 0.5(7-7.6)^{2} +
      0.3(11-7.6)^{2} = 2.592 + 0.18 + 3.468 = 6.24$, giving
      $6.24 + (-0.4)^{2} = 6.24 + 0.16 = 6.4$. The two agree because the
      identity is an identity. The instructive detail is that the variance is
      computed around $7.6$ and the MSE around $8$, and the gap between those
      two centres is precisely what the squared bias pays for.
    expects: "6.4"
    rubric:
      - >
        Centres the variance at $\mathbb{E}[\hat{\theta}] = 7.6$ and the MSE at
        $\theta = 8$, rather than using one centre for both.
      - >
        Cross-checks the two routes and gets the same number.
    targets:
      - quant-statistics.estimation.mse-decomp

  - id: qest-mse-decomp-03
    kind: decide
    difficulty: standard
    statement: >
      At a particular $\theta$, an estimator's mean squared error is found to
      equal its variance exactly. What does that tell you?
    answer: >
      That its bias is zero at that $\theta$. The decomposition gives
      $\operatorname{MSE} - \operatorname{Var} = \operatorname{bias}^{2}$, and
      a squared real number is zero only when the number is, so the two agreeing
      forces $\mathbb{E}[\hat{\theta}] = \theta$ there. Note the scope
      carefully: this is a statement at one $\theta$, and unbiasedness in the
      defined sense demands the equality at every $\theta \in \Theta$, so a
      single coincidence is not yet unbiasedness. It says nothing about the
      size of the variance — the estimator may still be very noisy — and
      nothing at all about consistency, which is a statement about a whole
      sequence of estimators as $n$ grows, not about one estimator at one
      sample size.
    choices:
      - text: >
          Its bias is zero at that $\theta$.
        correct: true
        feedback: >
          Right — $\operatorname{bias}^{2} = \operatorname{MSE} -
          \operatorname{Var} = 0$ forces the bias itself to vanish there.
      - text: >
          Its variance is zero, so it is a constant.
        feedback: >
          The equality says the squared bias is zero, not the variance; a very
          noisy unbiased estimator satisfies it too.
      - text: >
          It is consistent for $\theta$.
        feedback: >
          Consistency concerns a sequence $\hat{\theta}_n$ as $n \to \infty$;
          nothing about one estimator at one $n$ implies it. An unbiased
          estimator with fixed variance is never consistent.
    rubric:
      - >
        Rearranges the identity to isolate $\operatorname{bias}^{2}$ rather
        than guessing.
      - >
        Keeps the conclusion local to the stated $\theta$, and does not read
        consistency out of a single-sample statement.
    targets:
      - quant-statistics.estimation.mse-decomp

  # --- minimum MSE tolerates bias ---------------------------------------------

  - id: qest-unbiased-not-optimal-01
    kind: work
    difficulty: demanding
    statement: >
      For $n = 9$ iid draws from $N(\mu,\sigma^{2})$, consider the family
      $\hat{\sigma}^{2}_{d} = \frac{1}{d}\sum_{i}(X_i - \bar{X})^{2}$ indexed
      by the divisor $d$. Using the fact that
      $\sum_{i}(X_i - \bar{X})^{2}$ has the law of
      $\sigma^{2}\chi^{2}_{n-1}$, which divisor $d$ minimizes the mean squared
      error?
    answer: >
      $d = 10$. Write $c = 1/d$. Since $\chi^{2}_{n-1}$ has mean $n-1$ and
      variance $2(n-1)$, the estimator has mean $c(n-1)\sigma^{2}$ and variance
      $2c^{2}(n-1)\sigma^{4}$, so
      $\operatorname{MSE}(c) = \sigma^{4}[2c^{2}(n-1) + (c(n-1)-1)^{2}]$.
      Differentiating in $c$ and setting to zero gives
      $4c(n-1) + 2(n-1)(c(n-1)-1) = 0$, that is $c[2 + (n-1)] = 1$, so
      $c = 1/(n+1)$ and $d = n+1 = 10$. Check the three candidates with
      $n = 9$, in units of $\sigma^{4}$: $d = 8$ (the unbiased $s^{2}$) gives
      $2(1/64)(8) + 0 = 0.25$; $d = 9$ (the maximum-likelihood divisor) gives
      $2(1/81)(8) + (8/9 - 1)^{2} \approx 0.2099$; $d = 10$ gives
      $2(1/100)(8) + (8/10 - 1)^{2} = 0.16 + 0.04 = 0.2$. The winner divides by
      *more* than $n$, accepting a downward bias to buy a quieter estimator.
      Unbiasedness is a constraint, and here it costs a quarter more squared
      error than the best choice.
    expects: "10"
    rubric:
      - >
        Uses both the mean and the variance of the chi-square law, so that MSE
        has a variance term as well as a bias term.
      - >
        Lands on $d = n+1$ and states that it beats both the unbiased divisor
        $n-1$ and the maximum-likelihood divisor $n$.
    targets:
      - quant-statistics.estimation.unbiased-not-optimal
    exercises:
      - quant-statistics.estimation.mse-decomp

  - id: qest-unbiased-not-optimal-02
    kind: work
    difficulty: standard
    statement: >
      A location parameter $\theta$ is estimated from a single observation $X$
      with mean $\theta$ and $\operatorname{Var}(X) = 4$, using the shrinkage
      family $\hat{\theta}_c = cX$. At the true value $\theta = 3$, which $c$
      minimizes the mean squared error? Give an exact fraction or four
      decimals.
    answer: >
      $9/13 \approx 0.6923$. The bias of $cX$ is $c\theta - \theta =
      (c-1)\theta$ and its variance is $c^{2}\operatorname{Var}(X) = 4c^{2}$,
      so $\operatorname{MSE}(c) = 4c^{2} + 9(c-1)^{2}$ at $\theta = 3$.
      Differentiating, $8c + 18(c-1) = 0$, so $26c = 18$ and $c = 9/13$. The
      payoff: $\operatorname{MSE}(9/13) = 4(81/169) + 9(16/169) =
      (324 + 144)/169 = 468/169 = 36/13 \approx 2.769$, against
      $\operatorname{MSE}(1) = 4$ for the unbiased choice — a saving of nearly
      a third. The general form is $c = \theta^{2}/(\theta^{2} +
      \operatorname{Var}(X))$, which depends on the unknown $\theta$, so the
      optimal shrinkage is not something you can implement exactly. That is the
      honest limit of the idea: shrinkage provably helps, but by an amount you
      must estimate.
    expects: "9/13"
    tolerance: 0.0005
    rubric:
      - >
        Writes MSE as $4c^{2} + 9(c-1)^{2}$, with the variance scaled by
        $c^{2}$ and the bias by $\theta$.
      - >
        Notes that the minimizer $\theta^{2}/(\theta^{2} +
        \operatorname{Var}(X))$ depends on the unknown $\theta$.
    targets:
      - quant-statistics.estimation.unbiased-not-optimal

  - id: qest-unbiased-not-optimal-03
    kind: decide
    difficulty: standard
    statement: >
      A candidate asserts: "for normal data, $s^{2}$ has the smallest mean
      squared error of any estimator of $\sigma^{2}$, because it is the
      unbiased one." What is the verdict?
    answer: >
      False, and the counterexample is close at hand. Within the single family
      $\frac{1}{d}\sum_{i}(X_i - \bar{X})^{2}$, the MSE-minimizing divisor is
      $d = n+1$, which beats the unbiased $d = n-1$ at every $n$ and every
      $\sigma^{2}$ — and even the maximum-likelihood divisor $d = n$ sits
      between them, so $s^{2}$ is not merely beaten, it is third of three. The
      reasoning in the assertion is the real error: unbiasedness is a
      restriction on the class of estimators considered, and adding a
      restriction can only fail to improve the best achievable MSE. What
      $s^{2}$ actually is, on normal data, is the minimum-variance estimator
      *among the unbiased ones* — a genuine but conditional title, and one
      whose condition is doing all the work.
    choices:
      - text: >
          False — the divisor $n+1$ has strictly smaller MSE, and even the
          divisor $n$ beats $s^{2}$.
        correct: true
        feedback: >
          Right — unbiasedness restricts the search, so it cannot by itself
          deliver the smallest MSE.
      - text: >
          True — an unbiased estimator has $\operatorname{MSE} =
          \operatorname{Var}$, which is the smallest MSE achievable.
        feedback: >
          $\operatorname{MSE} = \operatorname{Var}$ holds only within the
          unbiased class; a biased rival can have a smaller total.
      - text: >
          False, but only because $s$ is a biased estimator of $\sigma$.
        feedback: >
          That is a true fact about the square root and irrelevant here — the
          claim under test is about $s^{2}$ and $\sigma^{2}$.
    rubric:
      - >
        Names an explicitly smaller-MSE estimator rather than arguing in the
        abstract.
      - >
        Restates the correct title — minimum variance among unbiased estimators
        — instead of minimum MSE outright.
    targets:
      - quant-statistics.estimation.unbiased-not-optimal
    exercises:
      - quant-statistics.estimation.mse-decomp

  # --- the sample mean --------------------------------------------------------

  - id: qest-sample-mean-unbiased-01
    kind: work
    difficulty: demanding
    statement: >
      Four monthly performance readings each have standard deviation $12$, and
      every pair of them has correlation $0.25$ rather than being independent.
      What is the standard error of their average, to four decimals?
    answer: >
      $7.9373$. With equicorrelated readings the variance of the mean picks up
      the covariances: $\operatorname{Var}(\bar{X}) =
      \frac{\sigma^{2}}{n}[1 + (n-1)\rho] = \frac{144}{4}[1 + 3(0.25)] =
      36(1.75) = 63$, so the standard error is
      $\sqrt{63} \approx 7.9373$. Reporting $\sigma/\sqrt{n} = 12/2 = 6$
      instead would understate the noise by a third. Unbiasedness is untouched
      — $\mathbb{E}[\bar{X}] = \mu$ needs only identical means, never
      independence — but the $\sigma^{2}/n$ formula needs the readings
      uncorrelated, and it is only that half of the result that breaks. Note
      also that the bracket does not vanish as $n$ grows: with fixed positive
      $\rho$ the variance tends to $\rho\sigma^{2} > 0$, so more overlapping
      readings never drive the error to zero.
    expects: "7.9373"
    tolerance: 0.0005
    rubric:
      - >
        Adds the $n(n-1)$ covariance terms, giving the factor
        $1 + (n-1)\rho$, rather than using $\sigma^{2}/n$ unmodified.
      - >
        Says which half of the proposition survives correlation — unbiasedness
        does, the variance formula does not.
    targets:
      - quant-statistics.estimation.sample-mean-unbiased
    exercises:
      - quant-probability.expectation.variance

  - id: qest-sample-mean-unbiased-02
    kind: work
    difficulty: standard
    statement: >
      A quantity has population standard deviation $60$. How many independent
      observations are needed for the sample mean to have a standard error of
      at most $2.5$?
    answer: >
      $576$. Set $\sigma/\sqrt{n} \le 2.5$, so $\sqrt{n} \ge 60/2.5 = 24$ and
      $n \ge 24^{2} = 576$. The square-root law is what makes the number feel
      large: the precision demanded is $24$ times the population spread's
      reciprocal, and the cost is that ratio *squared*. Halving the target to a
      standard error of $1.25$ would require $n = 2304$, four times as much
      data for twice the resolution. Answering $n = 24$ is the common slip — it
      solves $\sigma/n \le 2.5$, forgetting that the standard error falls like
      $\sqrt{n}$ and not like $n$.
    expects: "576"
    rubric:
      - >
        Solves $\sigma/\sqrt{n} \le 2.5$ and squares, rather than dividing
        $\sigma$ by the target directly.
      - >
        States the cost in the square-root form: a $k$-fold tightening needs
        $k^{2}$ times the data.
    targets:
      - quant-statistics.estimation.sample-mean-unbiased
    exercises:
      - quant-statistics.descriptive.sample-mean

  - id: qest-sample-mean-unbiased-03
    kind: decide
    difficulty: standard
    statement: >
      Observations $X_1,\dots,X_n$ are identically distributed with mean $\mu$
      and variance $\sigma^{2}$, but they are positively correlated rather than
      independent. Of the two claims "$\bar{X}$ is unbiased for $\mu$" and
      "$\operatorname{Var}(\bar{X}) = \sigma^{2}/n$", which survive?
    answer: >
      The first survives and the second fails. Unbiasedness is pure linearity:
      $\mathbb{E}[\bar{X}] = \frac{1}{n}\sum_{i}\mathbb{E}[X_i] = \mu$ uses
      only that the means are identical, and expectation is linear whether or
      not the $X_i$ are dependent. The variance is different, because expanding
      $\operatorname{Var}(\sum_{i} X_i)$ produces $n$ variance terms and
      $n(n-1)$ covariance terms; independence is what kills the second group,
      and positive correlation leaves them positive, pushing the true variance
      strictly above $\sigma^{2}/n$. The practical reading is a standing
      warning: a standard error computed as $s/\sqrt{n}$ on autocorrelated data
      is too small, so an effect looks better resolved than the data can
      support.
    choices:
      - text: >
          Unbiasedness survives; the variance formula fails, understating the
          true variance.
        correct: true
        feedback: >
          Right — linearity needs no independence, the variance expansion does.
      - text: >
          Both survive, since neither statement mentions independence
          explicitly.
        feedback: >
          The variance of a sum equals the sum of variances only when the
          covariance terms vanish, which is exactly what correlation prevents.
      - text: >
          Neither survives — correlation biases the sample mean upward as well.
        feedback: >
          Correlation changes how much $\bar{X}$ moves, never where it is
          centred; $\mathbb{E}[\bar{X}] = \mu$ still holds exactly.
    rubric:
      - >
        Separates the linearity argument from the variance argument and says
        which hypothesis each one consumes.
      - >
        Gets the direction right: positive correlation inflates the true
        variance, so $\sigma^{2}/n$ is an understatement.
    targets:
      - quant-statistics.estimation.sample-mean-unbiased

  # --- why s squared divides by n minus 1 -------------------------------------

  - id: qest-nminus1-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $X_1,\dots,X_n$ be iid with mean $\mu$ and variance
      $\sigma^{2} < \infty$, $n \ge 2$. Prove that
      $s^{2} = \frac{1}{n-1}\sum_{i}(X_i - \bar{X})^{2}$ is unbiased for
      $\sigma^{2}$, and explain in one sentence where the lost degree of
      freedom went.
    answer: >
      Start from the algebraic identity
      $\sum_{i}(X_i - \bar{X})^{2} = \sum_{i} X_i^{2} - n\bar{X}^{2}$, obtained
      by expanding the square and using $\sum_{i} X_i = n\bar{X}$ to collapse
      the cross term. Now take expectations of each piece using
      $\mathbb{E}[Y^{2}] = \operatorname{Var}(Y) + (\mathbb{E}[Y])^{2}$. For a
      single observation, $\mathbb{E}[X_i^{2}] = \sigma^{2} + \mu^{2}$, so the
      first sum has expectation $n(\sigma^{2} + \mu^{2})$. For the mean,
      $\operatorname{Var}(\bar{X}) = \sigma^{2}/n$ — this is the one place
      independence is used — so
      $\mathbb{E}[\bar{X}^{2}] = \sigma^{2}/n + \mu^{2}$ and
      $n\mathbb{E}[\bar{X}^{2}] = \sigma^{2} + n\mu^{2}$. Subtracting,
      $\mathbb{E}\left[\sum_{i}(X_i - \bar{X})^{2}\right] =
      n\sigma^{2} + n\mu^{2} - \sigma^{2} - n\mu^{2} = (n-1)\sigma^{2}$, so
      dividing by $n-1$ gives $\mathbb{E}[s^{2}] = \sigma^{2}$ for every
      $\sigma^{2}$ and every $\mu$. Normality is never used. Where the degree of
      freedom went: the deviations are measured from $\bar{X}$, which is fitted
      from the same data and therefore sits closer to the sample than the true
      $\mu$ does, so $\sum_{i}(X_i - \bar{X})^{2}$ is systematically smaller
      than $\sum_{i}(X_i - \mu)^{2}$ — by exactly $n(\bar{X}-\mu)^{2}$ on
      average $\sigma^{2}$ — and the divisor $n-1$ repairs precisely that
      shortfall. Caution for the follow-up: $s$ is not unbiased for $\sigma$,
      since Jensen applied to the strictly concave square root gives
      $\mathbb{E}[s] < \sigma$.
    rubric:
      - >
        Uses the identity $\sum_{i}(X_i - \bar{X})^{2} = \sum_{i} X_i^{2} -
        n\bar{X}^{2}$ rather than attempting the expansion term by term.
      - >
        Applies $\mathbb{E}[Y^{2}] = \operatorname{Var}(Y) +
        (\mathbb{E}[Y])^{2}$ to both $X_i$ and $\bar{X}$, and identifies
        $\operatorname{Var}(\bar{X}) = \sigma^{2}/n$ as the only use of
        independence.
      - >
        States that no normality is assumed, and that unbiasedness of $s^{2}$
        does not transfer to $s$.
    targets:
      - quant-statistics.estimation.nminus1
    exercises:
      - quant-statistics.estimation.sample-mean-unbiased
      - quant-probability.expectation.variance

  - id: qest-nminus1-02
    kind: work
    difficulty: standard
    statement: >
      Compute $s^{2}$, the unbiased sample variance, for the sample
      $3, 7, 8, 14$. Give an exact fraction or four decimals.
    answer: >
      $62/3 \approx 20.6667$. The sample mean is
      $(3 + 7 + 8 + 14)/4 = 32/4 = 8$. The deviations are
      $-5, -1, 0, 6$, whose squares are $25, 1, 0, 36$ and sum to $62$. With
      $n = 4$ the unbiased divisor is $n - 1 = 3$, giving
      $s^{2} = 62/3 \approx 20.6667$. The divisor-$n$ version would report
      $62/4 = 15.5$, which is $25\%$ smaller — the same proportional gap
      $(n-1)/n = 3/4$ that separates the two on any sample of size four. A
      useful check on the arithmetic: the deviations must sum to zero, and here
      $-5 - 1 + 0 + 6 = 0$, confirming the mean was computed correctly before
      anything was squared.
    expects: "62/3"
    tolerance: 0.0005
    rubric:
      - >
        Divides the sum of squared deviations by $n - 1 = 3$, not by $n = 4$.
      - >
        Checks that the deviations sum to zero before squaring them.
    targets:
      - quant-statistics.estimation.nminus1
    exercises:
      - quant-statistics.descriptive.sample-variance

  - id: qest-nminus1-03
    kind: work
    difficulty: routine
    statement: >
      A sample of $n = 6$ observations comes from a population with
      $\sigma^{2} = 90$. Someone computes the variance with divisor $n$ rather
      than $n - 1$. What is the bias of that estimator?
    answer: >
      $-15$. The $n$-divisor estimator is
      $\hat{\sigma}^{2} = \frac{n-1}{n}s^{2}$, and since
      $\mathbb{E}[s^{2}] = \sigma^{2}$ this gives
      $\mathbb{E}[\hat{\sigma}^{2}] = \frac{n-1}{n}\sigma^{2} =
      \frac{5}{6}(90) = 75$. The bias is therefore $75 - 90 = -15$, which is
      exactly $-\sigma^{2}/n = -90/6$. Two things are worth carrying away. The
      bias is negative for every sample size — the $n$-divisor version is
      always too small on average, never too large — and it shrinks like $1/n$,
      so at $n = 6$ it costs a sixth of the variance while at $n = 600$ it
      costs a sixth of a percent. That is why the correction matters in small
      samples and is nearly invisible in large ones.
    expects: "-15"
    rubric:
      - >
        Uses $\mathbb{E}[\hat{\sigma}^{2}] = \frac{n-1}{n}\sigma^{2}$ and
        subtracts $\sigma^{2}$, giving a negative bias.
      - >
        Identifies the bias as $-\sigma^{2}/n$ and notes it vanishes like
        $1/n$.
    targets:
      - quant-statistics.estimation.nminus1

  # --- likelihood and log-likelihood ------------------------------------------

  - id: qest-likelihood-01
    kind: work
    difficulty: demanding
    statement: >
      Three iid observations from an $\operatorname{Exponential}(\lambda)$ model
      with density $\lambda e^{-\lambda x}$ come in at $0.5, 1.5, 2.0$. What is
      the likelihood ratio $L(1)/L(0.5)$, to four decimals?
    answer: >
      $1.0827$. The likelihood is
      $L(\lambda) = \prod_{i} \lambda e^{-\lambda x_i} =
      \lambda^{3}e^{-\lambda \sum_{i} x_i}$, and $\sum_{i} x_i = 4$, so
      $L(\lambda) = \lambda^{3}e^{-4\lambda}$. Then
      $L(1) = e^{-4}$ and $L(0.5) = (0.125)e^{-2}$, and the ratio is
      $\frac{e^{-4}}{0.125\,e^{-2}} = 8e^{-2} \approx 1.0827$. Read what that
      does and does not say: $\lambda = 1$ makes this particular data set about
      $8\%$ more probable than $\lambda = 0.5$ does, and nothing more. It is
      not a $52$-to-$48$ split of belief between the two values, because $L$ is
      not a distribution over $\lambda$ and does not integrate to $1$ there.
      Only ratios carry meaning, which is why any factor free of $\lambda$ may
      be discarded before comparing. In passing, the maximizer of
      $\lambda^{3}e^{-4\lambda}$ is $\hat{\lambda} = 3/4$, so both candidates
      here are off the peak.
    expects: "1.0827"
    tolerance: 0.0005
    rubric:
      - >
        Collapses the product to $\lambda^{3}e^{-\lambda\sum_i x_i}$ using the
        sum of the observations, rather than multiplying three densities
        numerically.
      - >
        Reads the ratio as a comparison of how probable the data is, not as a
        probability about $\lambda$.
    targets:
      - quant-statistics.estimation.likelihood

  - id: qest-likelihood-02
    kind: work
    difficulty: standard
    statement: >
      Four Bernoulli trials produce $2$ successes. Evaluate the likelihood
      $L(p) = p^{2}(1-p)^{2}$ at $p = 0.25$, as an exact fraction.
    answer: >
      $9/256 \approx 0.0352$. Substituting,
      $L(0.25) = (0.25)^{2}(0.75)^{2} = \frac{1}{16}\cdot\frac{9}{16} =
      \frac{9}{256}$. The likelihood here is written for a *specific* sequence
      of four trials with two successes, so the binomial coefficient
      $\binom{4}{2} = 6$ has already been dropped — legitimately, since it does
      not involve $p$ and therefore cannot move the maximizer or change any
      ratio. For comparison, $L(0.5) = (0.5)^{4} = 1/16 = 16/256$, so
      $p = 0.5$ makes this data almost twice as probable as $p = 0.25$ does,
      and the maximizer is $\hat{p} = 2/4 = 0.5$. The number $9/256$ is
      therefore not "the probability that $p = 0.25$"; it is the probability of
      one particular data sequence under that value.
    expects: "9/256"
    rubric:
      - >
        Evaluates $p^{2}(1-p)^{2}$ at the stated value rather than maximizing
        it.
      - >
        Says why dropping $\binom{4}{2}$ is legitimate — it is free of $p$.
    targets:
      - quant-statistics.estimation.likelihood

  - id: qest-likelihood-03
    kind: decide
    difficulty: standard
    statement: >
      From the same four trials with two successes, a candidate reports:
      "$L(0.25) = 9/256 \approx 0.035$, so there is about a $3.5\%$ chance the
      coin has $p = 0.25$." What is wrong with that sentence?
    answer: >
      The direction of conditioning is reversed. $L(p)$ is the probability of
      the *data* computed under the parameter value $p$, with the data held
      fixed; it is a function of $p$, not a distribution over $p$, and there is
      no reason for it to integrate to $1$ over $\Theta$ — here
      $\int_{0}^{1} p^{2}(1-p)^{2}\,dp = 1/30$, not $1$. Turning a likelihood
      into a probability about the parameter requires a prior and Bayes'
      theorem, which the sentence has not supplied. The number is also not the
      probability of the observed *event* "two successes in four trials", which
      is $\binom{4}{2}(0.25)^{2}(0.75)^{2} = 54/256 \approx 0.211$; the
      coefficient was dropped, harmlessly for comparing values of $p$ and not
      harmlessly for quoting a probability.
    choices:
      - text: >
          $L$ gives the probability of the data given $p$, never a probability
          that $p$ takes a value; and the quoted number also omits the
          $\binom{4}{2}$ factor.
        correct: true
        feedback: >
          Right — likelihood ranks parameter values by how well they explain
          fixed data; it is not a distribution over those values.
      - text: >
          Nothing is wrong: the likelihood is a probability, so reporting it as
          a percentage is fair.
        feedback: >
          It is a probability of the data, under an assumed $p$. Reading it as
          a chance about $p$ inverts the conditioning.
      - text: >
          The only error is the missing $\binom{4}{2}$; with it, $54/256$ is
          the chance that $p = 0.25$.
        feedback: >
          The coefficient fixes the data probability, not the direction of the
          statement — $54/256$ is still a probability about the data.
    rubric:
      - >
        Names the reversal of conditioning explicitly, rather than only fixing
        the arithmetic.
      - >
        Notes that $L$ need not integrate to $1$ over the parameter, so it is
        not a density in $p$.
    targets:
      - quant-statistics.estimation.likelihood

  # --- maximum likelihood estimation ------------------------------------------

  - id: qest-mle-01
    kind: work
    difficulty: standard
    statement: >
      Five iid observations from a geometric model with
      $\Pr(X = k) = (1-p)^{k-1}p$ for $k = 1, 2, \dots$ come in at
      $2, 3, 1, 4, 5$. What is the maximum likelihood estimate of $p$? Give an
      exact fraction or four decimals.
    answer: >
      $1/3 \approx 0.3333$. The log-likelihood is
      $\ell(p) = n\log p + \left(\sum_{i} x_i - n\right)\log(1-p)$ with
      $n = 5$ and $\sum_{i} x_i = 15$, so
      $\ell'(p) = \frac{5}{p} - \frac{10}{1-p} = 0$ gives $5(1-p) = 10p$,
      $15p = 5$ and $\hat{p} = 1/3$. Equivalently
      $\hat{p} = n/\sum_{i} x_i = 1/\bar{x} = 1/3$, the reciprocal of the mean
      waiting time, which is what the model's $\mathbb{E}[X] = 1/p$ makes you
      expect. The second derivative $-5/p^{2} - 10/(1-p)^{2}$ is negative
      throughout $(0,1)$, so this stationary point is the global maximum and
      step three of the recipe is discharged. The boundary needs no separate
      argument here because $\ell \to -\infty$ at both ends of $(0,1)$.
    expects: "1/3"
    tolerance: 0.0005
    rubric:
      - >
        Counts the failures as $\sum_{i} x_i - n$, not $\sum_{i} x_i$, when
        writing the log-likelihood.
      - >
        Confirms the maximum by a negative second derivative rather than
        stopping at the score equation.
    targets:
      - quant-statistics.estimation.mle
    exercises:
      - quant-statistics.estimation.likelihood

  - id: qest-mle-02
    kind: justify
    difficulty: demanding
    statement: >
      Derive the maximum likelihood estimator of $\lambda$ for $n$ iid
      $\operatorname{Exponential}(\lambda)$ observations with density
      $\lambda e^{-\lambda x}$ on $x > 0$, carrying out every step of the
      recipe, and then state the MLE of the mean $1/\lambda$ with the reason.
    answer: >
      Step one, the log-likelihood:
      $L(\lambda) = \lambda^{n}e^{-\lambda\sum_{i} x_i}$, so
      $\ell(\lambda) = n\log\lambda - \lambda\sum_{i} x_i$ for $\lambda > 0$.
      Step two, the score equation:
      $\ell'(\lambda) = \frac{n}{\lambda} - \sum_{i} x_i = 0$ gives
      $\hat{\lambda} = n/\sum_{i} x_i = 1/\bar{x}$, which is positive whenever
      the data is, so it lies in the parameter space. Step three, the second
      derivative: $\ell''(\lambda) = -n/\lambda^{2} < 0$ for every
      $\lambda > 0$, so $\ell$ is strictly concave and the stationary point is
      the unique global maximum. Step four, the boundary of $\Theta = (0,
      \infty)$: as $\lambda \to 0^{+}$, $\ell \to -\infty$ because
      $n\log\lambda$ dominates, and as $\lambda \to \infty$, $\ell \to -\infty$
      because $-\lambda\sum_{i} x_i$ dominates, so no boundary value competes —
      unlike the uniform model, where step four is where the answer actually
      lives. For the mean, invariance settles it: the MLE of $g(\lambda)$ is
      $g(\hat{\lambda})$ for any $g$, so the MLE of $1/\lambda$ is
      $1/\hat{\lambda} = \bar{x}$. Worth adding unprompted: $\bar{X}$ is
      unbiased for $1/\lambda$, but $\hat{\lambda} = 1/\bar{X}$ is *not*
      unbiased for $\lambda$ — its mean is $\frac{n}{n-1}\lambda$ — which is
      invariance and Jensen colliding exactly as the technique's caveat
      predicts.
    rubric:
      - >
        Writes $\ell$ before differentiating and solves
        $\ell'(\lambda) = 0$ rather than differentiating the product $L$.
      - >
        Confirms the maximum with $\ell'' < 0$ and separately checks that no
        boundary of $(0,\infty)$ competes.
      - >
        Uses invariance for $1/\lambda$ and notes that the MLE of $\lambda$
        itself is biased in finite samples.
    targets:
      - quant-statistics.estimation.mle
    exercises:
      - quant-statistics.estimation.likelihood

  - id: qest-mle-03
    kind: work
    difficulty: demanding
    statement: >
      Three iid observations come from the density
      $f(x;\theta) = \theta x^{\theta-1}$ on $0 < x < 1$, with $\theta > 0$.
      The observed values satisfy $\log x_1 = -1$, $\log x_2 = -2$ and
      $\log x_3 = -1$. What is the maximum likelihood estimate of $\theta$?
    answer: >
      $3/4 = 0.75$. The log-likelihood is
      $\ell(\theta) = n\log\theta + (\theta - 1)\sum_{i}\log x_i$, which is
      linear in $\theta$ apart from the $\log\theta$ term. Here $n = 3$ and
      $\sum_{i}\log x_i = -1 - 2 - 1 = -4$, so
      $\ell(\theta) = 3\log\theta - 4(\theta - 1)$ and
      $\ell'(\theta) = \frac{3}{\theta} - 4 = 0$ gives
      $\hat{\theta} = 3/4$. In general
      $\hat{\theta} = -n/\sum_{i}\log x_i$, and the minus sign is not
      cosmetic: every $\log x_i$ is negative on $(0,1)$, so the estimate is
      positive as required. The check:
      $\ell''(\theta) = -3/\theta^{2} < 0$ everywhere, so this is the global
      maximum. Sanity: $\hat{\theta} < 1$ means the fitted density decreases on
      $(0,1)$, piling mass near zero — consistent with observations as small as
      $e^{-2} \approx 0.135$.
    expects: "3/4"
    rubric:
      - >
        Differentiates $n\log\theta + (\theta-1)\sum_i \log x_i$ in $\theta$,
        treating $\sum_i \log x_i$ as a constant.
      - >
        Keeps the sign straight, so that a negative $\sum_i \log x_i$ produces
        a positive $\hat{\theta}$.
    targets:
      - quant-statistics.estimation.mle
    exercises:
      - quant-statistics.estimation.likelihood

  # --- MLE for a Bernoulli p --------------------------------------------------

  - id: qest-mle-bernoulli-01
    kind: work
    difficulty: demanding
    statement: >
      A model's directional calls are right $45$ times out of $300$ independent
      attempts at a rare event. Treating the calls as
      $\operatorname{Bernoulli}(p)$, report the standard error of $\hat{p}$
      estimated by plugging in $\hat{p}$, to four decimals.
    answer: >
      $0.0206$. The MLE is $\hat{p} = 45/300 = 0.15$, and
      $\operatorname{Var}(\hat{p}) = p(1-p)/n$, estimated as
      $0.15(0.85)/300 = 0.1275/300 = 0.000425$, so the standard error is
      $\sqrt{0.000425} \approx 0.0206$. Two remarks an interviewer listens for.
      The true variance is a function of the unknown $p$, so what is reported
      is an estimate of a standard error and not the thing itself. And the
      worst-case bound $1/(2\sqrt{n}) = 1/(2\sqrt{300}) \approx 0.0289$ is
      attained only at $p = 1/2$; quoting it here would overstate the noise by
      $40\%$, because $p(1-p)$ is small near the ends of the range. That
      asymmetry cuts both ways — rare events are estimated precisely in
      absolute terms and imprecisely in relative terms, since $0.0206$ is
      nearly $14\%$ of $0.15$.
    expects: "0.0206"
    tolerance: 0.0005
    rubric:
      - >
        Uses $\hat{p}(1-\hat{p})/n$ and takes the square root, rather than
        reporting the variance.
      - >
        Distinguishes the plug-in standard error from the worst-case bound
        $1/(2\sqrt{n})$, which holds at $p = 1/2$.
    targets:
      - quant-statistics.estimation.mle-bernoulli
    exercises:
      - quant-probability.discrete.bernoulli

  - id: qest-mle-bernoulli-02
    kind: work
    difficulty: standard
    statement: >
      In $65$ independent Bernoulli trials, $26$ succeed. What is the maximum
      likelihood estimate of $p$? Give an exact fraction or a decimal.
    answer: >
      $2/5 = 0.4$. Maximizing $L(p) = p^{k}(1-p)^{n-k}$ means solving
      $\ell'(p) = k/p - (n-k)/(1-p) = 0$, which rearranges to
      $k(1-p) = (n-k)p$ and hence $\hat{p} = k/n$ — the observed success rate,
      with no dependence on how the successes were ordered. Here
      $\hat{p} = 26/65 = 2/5 = 0.4$. Since $\ell$ is strictly concave on
      $(0,1)$ whenever $0 < k < n$, this is the global maximum and no boundary
      case arises. The estimator is unbiased, and its estimated variance is
      $0.4(0.6)/65 \approx 0.00369$, so the standard error is about $0.0608$ —
      a reminder that $0.4$ and, say, $0.45$ are not distinguishable from
      $65$ trials.
    expects: "2/5"
    rubric:
      - >
        Reports $k/n$ from the score equation rather than guessing the sample
        proportion without deriving it.
      - >
        Notes that the estimate does not depend on the order of the trials.
    targets:
      - quant-statistics.estimation.mle-bernoulli
    exercises:
      - quant-probability.discrete.bernoulli

  - id: qest-mle-bernoulli-03
    kind: decide
    difficulty: standard
    statement: >
      A forecaster is right on all $9$ of her calls. Asked for the maximum
      likelihood estimate of her hit rate $p$, what is the correct answer and
      the correct caveat?
    answer: >
      The MLE really is $\hat{p} = 1$. With $k = n$ the likelihood is
      $L(p) = p^{9}$, strictly increasing on $[0,1]$, so it is maximized at the
      right-hand boundary; the score equation has no interior root, and this is
      step four of the recipe doing its job rather than a breakdown. The caveat
      is that maximum likelihood is answering the question it was asked — which
      $p$ makes this data most probable — and nine successes are indeed most
      probable under $p = 1$. It is a claim of certainty from nine trials, and
      the sampling distribution says so: even $p = 0.8$ produces nine straight
      hits about $13\%$ of the time. The usual repair is the Laplace-smoothed
      $(k+1)/(n+2) = 10/11 \approx 0.909$, which is not the MLE but is the
      number a desk would actually use.
    choices:
      - text: >
          $\hat{p} = 1$, since $L(p) = p^{9}$ is maximized at the boundary —
          but it is a certainty claim from nine trials, which is why
          $10/11$ is often substituted.
        correct: true
        feedback: >
          Right — a boundary maximum is still a maximum; the caution belongs to
          the interpretation, not to the calculation.
      - text: >
          The MLE is undefined, because $\ell'(p) = 0$ has no solution in
          $(0,1)$.
        feedback: >
          The score equation finds interior maxima only. A likelihood with no
          interior stationary point is maximized on the boundary, which is
          exactly the case here.
      - text: >
          $\hat{p} = 10/11$, since Laplace smoothing gives the maximum
          likelihood estimate for extreme counts.
        feedback: >
          Smoothing is a deliberate departure from maximum likelihood, not a
          version of it; the MLE is $1$ and $10/11$ is a different estimator.
    rubric:
      - >
        Checks the boundary rather than declaring the estimate undefined when
        the score equation has no root.
      - >
        Separates the calculation, which is correct, from the interpretation,
        which is the part that needs care.
    targets:
      - quant-statistics.estimation.mle-bernoulli

  # --- MLE for a normal mean and variance -------------------------------------

  - id: qest-mle-normal-01
    kind: work
    difficulty: demanding
    statement: >
      Six iid $N(\mu,\sigma^{2})$ observations, both parameters unknown, come
      in at $3, 11, 7, 5, 9, 13$. What is the maximum likelihood estimate of
      $\sigma^{2}$? Give an exact fraction or four decimals.
    answer: >
      $35/3 \approx 11.6667$. First $\hat{\mu} = \bar{x} =
      (3+11+7+5+9+13)/6 = 48/6 = 8$, which maximizes $\ell$ in $\mu$ whatever
      $\sigma^{2}$ is. The deviations are $-5, 3, -1, -3, 1, 5$, whose squares
      are $25, 9, 1, 9, 1, 25$ and sum to $70$. The maximum likelihood
      estimator divides that by $n$, not by $n-1$:
      $\hat{\sigma}^{2} = 70/6 = 35/3 \approx 11.6667$. The unbiased
      alternative is $s^{2} = 70/5 = 14$, larger by the factor
      $n/(n-1) = 6/5$; equivalently $\hat{\sigma}^{2} =
      \frac{n-1}{n}s^{2} = \frac{5}{6}(14) = 35/3$. Answering $14$ is the
      standard slip, and it is a slip about what was asked: maximum likelihood
      optimizes fit to the observed data, and the fit is best when the spread
      is measured about the fitted centre with the full sample size in the
      denominator. The price is a bias of $-\sigma^{2}/6$.
    expects: "35/3"
    tolerance: 0.0005
    rubric:
      - >
        Divides the sum of squared deviations by $n = 6$, and says explicitly
        that $s^{2}$ answers a different question.
      - >
        Computes $\hat{\mu} = \bar{x}$ first and notes it does not depend on
        $\sigma^{2}$.
    targets:
      - quant-statistics.estimation.mle-normal
    exercises:
      - quant-probability.continuous.normal

  - id: qest-mle-normal-02
    kind: work
    difficulty: standard
    statement: >
      A report quotes $s^{2} = 24.5$ from $n = 8$ normal observations. What is
      the maximum likelihood estimate of $\sigma^{2}$ from the same data?
    answer: >
      $21.4375$. The two estimators differ only in the divisor applied to the
      same sum of squared deviations, so
      $\hat{\sigma}^{2} = \frac{n-1}{n}s^{2} = \frac{7}{8}(24.5) = 21.4375$.
      No access to the raw observations is needed — the sum of squared
      deviations is $7(24.5) = 171.5$, and $171.5/8 = 21.4375$. The gap is
      $24.5 - 21.4375 = 3.0625 = s^{2}/8$, which is the size of the bias
      relative to $s^{2}$ at this sample size, about $12.5\%$. Going the wrong
      way — multiplying by $8/7$ instead of $7/8$ — gives $28$, and the sign
      check catches it at once: the maximum likelihood estimate of a variance
      is always the smaller of the two.
    expects: "21.4375"
    rubric:
      - >
        Applies the factor $(n-1)/n$ in the correct direction, producing a
        smaller number than $s^{2}$.
      - >
        Recovers the sum of squared deviations from $s^{2}$ rather than needing
        the raw data.
    targets:
      - quant-statistics.estimation.mle-normal
    exercises:
      - quant-statistics.estimation.nminus1

  - id: qest-mle-normal-03
    kind: decide
    difficulty: standard
    statement: >
      The maximum likelihood estimator of $\sigma^{2}$ for normal data is
      biased low. Does that make it worse than $s^{2}$?
    answer: >
      Not by the criterion that matters. The bias is real and exact —
      $\mathbb{E}[\hat{\sigma}^{2}] = \frac{n-1}{n}\sigma^{2}$, so the
      shortfall is $\sigma^{2}/n$ — but on normal data the maximum likelihood
      version has the smaller mean squared error of the two, because its lower
      variance more than pays for the offset. Within the family
      $\frac{1}{d}\sum_{i}(X_i - \bar{X})^{2}$ the MSE is minimized at
      $d = n+1$, so the ranking on squared error runs $n+1$, then $n$, then
      $n-1$: the unbiased $s^{2}$ comes last of the three. Neither estimator is
      wrong; they answer different questions, and "biased" is a description of
      the estimator rather than a verdict on it.
    choices:
      - text: >
          No — it is biased low by $\sigma^{2}/n$, yet on normal data its mean
          squared error is smaller than that of $s^{2}$.
        correct: true
        feedback: >
          Right — the lower variance outweighs the squared bias, which is the
          decomposition doing its job.
      - text: >
          Yes — an unbiased estimator is preferable whenever one is available,
          so $s^{2}$ dominates.
        feedback: >
          That answers "which estimator is unbiased". On MSE the maximum
          likelihood version wins, and the divisor $n+1$ beats them both.
      - text: >
          The question does not arise: the maximum likelihood estimator of
          $\sigma^{2}$ is unbiased once $n \ge 2$.
        feedback: >
          It is biased at every $n$, with
          $\mathbb{E}[\hat{\sigma}^{2}] = \frac{n-1}{n}\sigma^{2}$; the bias
          only shrinks, it never vanishes.
    rubric:
      - >
        Compares on mean squared error rather than on bias alone.
      - >
        States the exact bias $-\sigma^{2}/n$ instead of describing it
        qualitatively.
    targets:
      - quant-statistics.estimation.mle-normal
    exercises:
      - quant-statistics.estimation.bias-mse

  # --- MLE for a uniform theta ------------------------------------------------

  - id: qest-mle-uniform-01
    kind: work
    difficulty: demanding
    statement: >
      Four iid draws are taken from $\operatorname{Uniform}(0,\theta)$ with
      $\theta = 10$. What is the mean squared error of the maximum likelihood
      estimator $\hat{\theta} = X_{(4)}$? Give an exact fraction or four
      decimals.
    answer: >
      $20/3 \approx 6.6667$. The sample maximum has
      $\Pr(X_{(n)} \le t) = (t/\theta)^{n}$ and hence density
      $nt^{n-1}/\theta^{n}$ on $(0,\theta)$, giving
      $\mathbb{E}[X_{(n)}] = \frac{n}{n+1}\theta$ and
      $\mathbb{E}[X_{(n)}^{2}] = \frac{n}{n+2}\theta^{2}$. So the bias is
      $-\theta/(n+1)$, the variance is
      $\left(\frac{n}{n+2} - \frac{n^{2}}{(n+1)^{2}}\right)\theta^{2} =
      \frac{n\theta^{2}}{(n+1)^{2}(n+2)}$, and the two combine to
      $\operatorname{MSE} = \frac{2\theta^{2}}{(n+1)(n+2)}$. With $n = 4$ and
      $\theta = 10$ that is $\frac{2(100)}{5 \cdot 6} = \frac{200}{30} =
      \frac{20}{3} \approx 6.6667$. For contrast, the bias-corrected
      $\frac{n+1}{n}X_{(n)}$ has MSE $\frac{\theta^{2}}{n(n+2)} = 100/24
      \approx 4.17$, so removing the bias here genuinely helps. Note the rate:
      both errors shrink like $1/n^{2}$, so $\hat{\theta}$ converges at rate
      $n$ rather than the usual $\sqrt{n}$ — possible only because the support
      moves with $\theta$ and the regularity conditions fail.
    expects: "20/3"
    tolerance: 0.0005
    rubric:
      - >
        Gets both moments of $X_{(n)}$ from the CDF $(t/\theta)^{n}$ rather
        than assuming the estimator is unbiased.
      - >
        Combines variance and squared bias into
        $\frac{2\theta^{2}}{(n+1)(n+2)}$ and notes the $1/n^{2}$ rate.
    targets:
      - quant-statistics.estimation.mle-uniform
      - quant-probability.random-variables.order-statistics
    connects:
      - "quant-probability.random-variables.order-statistics ~ quant-statistics.estimation.mle-uniform"

  - id: qest-mle-uniform-02
    kind: work
    difficulty: standard
    statement: >
      Six iid draws from $\operatorname{Uniform}(0,\theta)$ have sample maximum
      $21.3$. What is the bias-corrected estimate
      $\frac{n+1}{n}X_{(n)}$?
    answer: >
      $24.85$. The maximum likelihood estimate is $X_{(n)} = 21.3$ itself, and
      it is biased low by necessity: the sample maximum can never exceed
      $\theta$, so its error has a fixed sign. Since
      $\mathbb{E}[X_{(n)}] = \frac{n}{n+1}\theta$, scaling by the reciprocal
      cures it exactly, and $\frac{7}{6}(21.3) = 149.1/6 = 24.85$. The
      correction adds about a seventh of the observed maximum, which is the
      expected size of the gap between $\theta$ and the largest of six draws.
      Note the estimator remains feasible — $24.85$ is above every observation,
      as any estimate of $\theta$ must be — and this is exactly where the
      method-of-moments alternative $2\bar{X}$ can embarrass itself by landing
      below an observed value.
    expects: "24.85"
    rubric:
      - >
        Multiplies by $(n+1)/n$ rather than by $n/(n+1)$, so the corrected
        estimate is larger than the maximum.
      - >
        Says why the bias must be downward: $X_{(n)} \le \theta$ always.
    targets:
      - quant-statistics.estimation.mle-uniform
    exercises:
      - quant-probability.continuous.uniform

  - id: qest-mle-uniform-03
    kind: work
    difficulty: standard
    statement: >
      Five iid draws from $\operatorname{Uniform}(0,\theta)$ have sample mean
      $4.1$ and sample maximum $9.4$. A candidate differentiates the
      log-likelihood, finds no root, and falls back on $2\bar{X}$. What is the
      maximum likelihood estimate of $\theta$?
    answer: >
      $9.4$, the sample maximum. The likelihood is
      $L(\theta) = \theta^{-5}$ for $\theta \ge \max_{i} x_i$ and $0$ below it,
      so it jumps from zero up to its largest value exactly at
      $\theta = 9.4$ and then decays monotonically. There is no stationary
      point to find, and the absence of a root is the signal to check the
      boundary rather than to change estimators. The fallback answer
      $2\bar{x} = 8.2$ is the method-of-moments estimate, and it is not merely
      different: it is *impossible*, since a $\operatorname{Uniform}(0,8.2)$
      model assigns probability zero to the observed value $9.4$. That is the
      cleanest demonstration that an estimator can be unbiased — $2\bar{X}$ is
      — and still return an answer the data rules out.
    expects: "9.4"
    rubric:
      - >
        Maximizes $\theta^{-n}$ over $\theta \ge \max_i x_i$ by inspection
        instead of differentiating.
      - >
        Names $2\bar{x} = 8.2$ as infeasible because it lies below an observed
        value.
    targets:
      - quant-statistics.estimation.mle-uniform
    exercises:
      - quant-probability.continuous.uniform

  # --- score and Fisher information -------------------------------------------

  - id: qest-fisher-information-01
    kind: work
    difficulty: demanding
    statement: >
      For the $\operatorname{Exponential}(\lambda)$ model with density
      $\lambda e^{-\lambda x}$, compute the Fisher information carried by a
      sample of $n = 50$ observations at $\lambda = 0.4$.
    answer: >
      $312.5$. Take logs: $\log f(x;\lambda) = \log\lambda - \lambda x$. Then
      $\frac{\partial}{\partial\lambda}\log f = \frac{1}{\lambda} - x$ and
      $\frac{\partial^{2}}{\partial\lambda^{2}}\log f = -\frac{1}{\lambda^{2}}$,
      which does not involve $x$ at all, so the expectation is immediate and
      $I(\lambda) = 1/\lambda^{2}$. Information adds over independent
      observations, so the sample carries
      $nI(\lambda) = 50/0.4^{2} = 50/0.16 = 312.5$. The sanity check is the
      reciprocal: $1/312.5 = 0.0032$, and this is the Cramér–Rao floor for
      unbiased estimators of $\lambda$. Note how strongly the information
      depends on where you stand — at $\lambda = 0.8$ the same $50$
      observations carry only $78.125$, because a larger rate means shorter
      waits and a flatter log-likelihood in relative terms.
    expects: "312.5"
    rubric:
      - >
        Uses the second-derivative form and notices that
        $\partial^{2}\log f/\partial\lambda^{2}$ is free of $x$, so no
        expectation is needed.
      - >
        Multiplies the single-observation information by $n$, giving
        $nI(\lambda)$ rather than $I(\lambda)$.
    targets:
      - quant-statistics.estimation.fisher-information

  - id: qest-fisher-information-02
    kind: work
    difficulty: standard
    statement: >
      For the $\operatorname{Poisson}(\lambda)$ model, the Fisher information
      of one observation is $I(\lambda) = 1/\lambda$. What is the total
      information in $n = 20$ observations at $\lambda = 5$?
    answer: >
      $4$. Information is additive over independent observations, so
      $nI(\lambda) = 20/5 = 4$. Where the single-observation value comes from:
      $\log f(x;\lambda) = -\lambda + x\log\lambda - \log x!$, so
      $\frac{\partial^{2}}{\partial\lambda^{2}}\log f = -x/\lambda^{2}$ and
      $I(\lambda) = -\mathbb{E}[-X/\lambda^{2}] = \lambda/\lambda^{2} =
      1/\lambda$, using $\mathbb{E}[X] = \lambda$ — here the expectation is
      genuinely needed, unlike the exponential case. The reciprocal
      $1/(nI) = 0.25$ equals $\lambda/n = 5/20$, which is
      $\operatorname{Var}(\bar{X})$: the sample mean is efficient for a Poisson
      rate. Reporting $I(\lambda) = 0.2$ answers a different question — that
      is one observation's worth, not the sample's.
    expects: "4"
    rubric:
      - >
        Multiplies by $n$ rather than quoting the single-observation
        information.
      - >
        Checks the reciprocal against $\operatorname{Var}(\bar{X}) =
        \lambda/n$.
    targets:
      - quant-statistics.estimation.fisher-information

  # --- consistency ------------------------------------------------------------

  - id: qest-consistency-01
    kind: decide
    difficulty: demanding
    statement: >
      Four estimators of $\mu$ are built from $n$ iid draws with mean $\mu$ and
      finite variance $\sigma^{2}$. Exactly one of them is consistent for $\mu$
      yet biased at every finite $n$. Which?
    answer: >
      $\frac{n}{n+1}\bar{X}_n$. Its mean is $\frac{n}{n+1}\mu$, so its bias is
      $-\mu/(n+1)$, which is nonzero for every finite $n$ whenever
      $\mu \ne 0$ — and unbiasedness must hold for every parameter value, so
      the estimator is biased at each $n$. It is nevertheless consistent: its
      variance is $\frac{n\sigma^{2}}{(n+1)^{2}} \to 0$ and its squared bias is
      $\mu^{2}/(n+1)^{2} \to 0$, so $\operatorname{MSE} \to 0$ and Chebyshev
      finishes the argument. Contrast the others. $\bar{X}_n$ is consistent but
      unbiased, so it fails the second half of the question.
      $\frac{1}{2}(X_1 + X_2)$ is unbiased and has fixed variance
      $\sigma^{2}/2$, so it never concentrates — the standard unbiased-but-
      inconsistent example. And $X_1 + 1/n$ is biased and has fixed variance
      $\sigma^{2}$, so it fails consistency too. The pairing is the lesson:
      consistency and unbiasedness are logically independent, and all four
      combinations occur.
    choices:
      - text: >
          $\frac{n}{n+1}\bar{X}_n$
        correct: true
        feedback: >
          Right — bias $-\mu/(n+1)$ at every $n$, and both bias and variance
          vanish in the limit, so the MSE does.
      - text: >
          $\bar{X}_n$
        feedback: >
          Consistent, yes, but unbiased at every $n$ — it fails the second half
          of the requirement.
      - text: >
          $\frac{1}{2}(X_1 + X_2)$
        feedback: >
          Unbiased, and its variance stays at $\sigma^{2}/2$ however much data
          arrives, so it never concentrates. Consistency does not follow from
          unbiasedness.
      - text: >
          $X_1 + 1/n$
        feedback: >
          Biased, but its variance stays at $\sigma^{2}$, so it does not
          converge in probability to $\mu$ — the shrinking offset does not fix
          a fixed spread.
    rubric:
      - >
        Tests both properties on each candidate rather than assuming one
        implies the other.
      - >
        Argues consistency by $\operatorname{MSE} \to 0$ plus Chebyshev, and
        notes that a fixed variance rules it out however the bias behaves.
    targets:
      - quant-statistics.estimation.consistency
    exercises:
      - quant-statistics.estimation.mse-decomp

  - id: qest-consistency-02
    kind: work
    difficulty: standard
    statement: >
      An unbiased estimator $\hat{\theta}_n$ has variance $8/n$. At
      $n = 5000$ and $\varepsilon = 0.2$, what bound does Chebyshev's
      inequality give for
      $\Pr(|\hat{\theta}_n - \theta| > \varepsilon)$?
    answer: >
      $0.04$. Chebyshev applied to $\hat{\theta}_n$ about its mean gives
      $\Pr(|\hat{\theta}_n - \theta| > \varepsilon) \le
      \operatorname{MSE}(\hat{\theta}_n)/\varepsilon^{2}$, and here the
      estimator is unbiased so the MSE is the variance:
      $\frac{8/5000}{0.2^{2}} = \frac{0.0016}{0.04} = 0.04$. The bound is
      loose — the true probability is far smaller — but its behaviour in $n$ is
      what matters: it is $\frac{8}{n\varepsilon^{2}}$, which tends to $0$ for
      every fixed $\varepsilon > 0$, and that is precisely the definition of
      consistency. Note that $\varepsilon$ enters squared, so tightening the
      tolerance from $0.2$ to $0.1$ quadruples the bound to $0.16$ at the same
      sample size; consistency is a statement at fixed $\varepsilon$ as $n$
      grows, never a claim about any particular $n$.
    expects: "0.04"
    rubric:
      - >
        Divides the MSE by $\varepsilon^{2}$, not by $\varepsilon$.
      - >
        Says the bound tends to $0$ for each fixed $\varepsilon$, which is what
        consistency requires.
    targets:
      - quant-statistics.estimation.consistency
    exercises:
      - quant-probability.inequalities.chebyshev

  - id: qest-consistency-03
    kind: work
    difficulty: standard
    statement: >
      An estimator has $\operatorname{MSE}(\hat{\theta}_n) = 12/n$, so its root
      mean squared error at $n = 300$ is $0.2$. How large must $n$ be for the
      root mean squared error to fall to $0.05$?
    answer: >
      $4800$. The root mean squared error is
      $\sqrt{12/n}$, so setting $\sqrt{12/n} = 0.05$ gives
      $12/n = 0.0025$ and $n = 12/0.0025 = 4800$. The check at the stated
      anchor: $\sqrt{12/300} = \sqrt{0.04} = 0.2$, as claimed. The structure is
      the $1/\sqrt{n}$ rate — error falls like the reciprocal square root, so
      shrinking it by a factor of $4$ costs $4^{2} = 16$ times the data, and
      indeed $300 \times 16 = 4800$. Consistency says only that this error
      eventually reaches zero; the rate says what that costs, which is the
      number a desk actually needs when asking how many observations establish
      an edge of a given size.
    expects: "4800"
    rubric:
      - >
        Works with the root mean squared error, squaring correctly, rather than
        solving $12/n = 0.05$.
      - >
        States the rate: a $k$-fold reduction in error costs $k^{2}$ times the
        sample.
    targets:
      - quant-statistics.estimation.consistency
      - quant-probability.limits.root-n
    connects:
      - "quant-probability.limits.root-n ~ quant-statistics.estimation.consistency"

  # --- Cramer-Rao lower bound -------------------------------------------------

  - id: qest-cramer-rao-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $\hat{\theta}$ be an unbiased estimator of $\theta$ built from one
      observation, and let $U(\theta) =
      \frac{\partial}{\partial\theta}\log f(X;\theta)$ be the score, under the
      usual regularity conditions. Show that
      $\operatorname{Cov}(\hat{\theta}, U) = 1$, and deduce
      $\operatorname{Var}(\hat{\theta}) \ge 1/I(\theta)$ from
      Cauchy–Schwarz.
    answer: >
      Two facts about the score come first. Since $\int f(x;\theta)\,dx = 1$
      for every $\theta$, differentiating under the integral sign gives
      $\int \frac{\partial f}{\partial\theta}\,dx = 0$, and writing
      $\frac{\partial f}{\partial\theta} = f\,\frac{\partial \log f}
      {\partial\theta}$ turns that into $\mathbb{E}[U] = 0$. Consequently
      $I(\theta) = \operatorname{Var}(U) = \mathbb{E}[U^{2}]$. Now differentiate
      the unbiasedness statement $\int \hat{\theta}(x) f(x;\theta)\,dx =
      \theta$ in $\theta$: the right side gives $1$, and the same substitution
      turns the left side into
      $\int \hat{\theta}(x)\,U(x;\theta)\,f(x;\theta)\,dx =
      \mathbb{E}[\hat{\theta}U]$. Since $\mathbb{E}[U] = 0$, that expectation
      is exactly $\operatorname{Cov}(\hat{\theta}, U)$, so
      $\operatorname{Cov}(\hat{\theta}, U) = 1$. Cauchy–Schwarz for covariance
      says $\operatorname{Cov}(\hat{\theta},U)^{2} \le
      \operatorname{Var}(\hat{\theta})\operatorname{Var}(U)$, and substituting
      the two computed quantities gives
      $1 \le \operatorname{Var}(\hat{\theta})\,I(\theta)$, that is
      $\operatorname{Var}(\hat{\theta}) \ge 1/I(\theta)$. For $n$ iid
      observations the score is the sum of the individual scores, whose
      variance is $nI(\theta)$, giving the familiar $1/(nI(\theta))$. Two
      hypotheses did real work and should be named: unbiasedness, which is what
      forced the covariance to be $1$ rather than $g'(\theta)$; and the
      interchange of differentiation and integration, which fails when the
      support depends on $\theta$ — so the bound says nothing about the
      uniform model. Equality holds exactly when $\hat{\theta} - \theta$ is a
      constant multiple of $U$, which is the algebraic content of efficiency.
    rubric:
      - >
        Establishes $\mathbb{E}[U] = 0$ first, so that
        $\mathbb{E}[\hat{\theta}U]$ can be read as a covariance.
      - >
        Differentiates the unbiasedness identity in $\theta$ to get the value
        $1$, rather than assuming the covariance.
      - >
        Names both hypotheses — unbiasedness and the legitimacy of
        differentiating under the integral — and says where the second one
        fails.
    targets:
      - quant-statistics.estimation.cramer-rao
      - quant-probability.inequalities.cs-covariance
    connects:
      - "quant-probability.inequalities.cs-covariance ~ quant-statistics.estimation.cramer-rao"

  - id: qest-cramer-rao-02
    kind: work
    difficulty: demanding
    statement: >
      From $n = 40$ iid $\operatorname{Exponential}(\lambda)$ observations, an
      analyst estimates the mean $1/\lambda$ rather than $\lambda$ itself. At
      $\lambda = 0.5$, what is the Cramér–Rao lower bound on the variance of an
      unbiased estimator of the mean?
    answer: >
      $0.1$. Use the general form for a target $g(\theta)$:
      $\operatorname{Var}(\hat{\theta}) \ge g'(\lambda)^{2}/(nI(\lambda))$.
      Here $g(\lambda) = 1/\lambda$, so $g'(\lambda) = -1/\lambda^{2}$ and
      $g'(\lambda)^{2} = 1/\lambda^{4} = 16$ at $\lambda = 0.5$. The
      exponential model has $I(\lambda) = 1/\lambda^{2} = 4$, so
      $nI(\lambda) = 160$, and the bound is $16/160 = 0.1$. Equivalently
      $1/(n\lambda^{2})$. The bound is attained:
      $\bar{X}$ is unbiased for $1/\lambda$ with variance
      $\frac{1}{n\lambda^{2}} = \frac{1}{40(0.25)} = 0.1$, so the sample mean
      is efficient for the exponential mean and nothing unbiased can beat it.
      Forgetting the $g'$ factor and quoting $1/(nI) = 0.00625$ answers the
      question about $\lambda$, whose scale is completely different.
    expects: "0.1"
    rubric:
      - >
        Uses the $g'(\theta)^{2}/(nI(\theta))$ form, since the target is a
        function of the parameter rather than the parameter.
      - >
        Verifies the bound is attained by $\bar{X}$, whose variance is
        $1/(n\lambda^{2})$.
    targets:
      - quant-statistics.estimation.cramer-rao
    exercises:
      - quant-statistics.estimation.fisher-information

  - id: qest-cramer-rao-03
    kind: work
    difficulty: standard
    statement: >
      For $n = 48$ iid $\operatorname{Poisson}(\lambda)$ observations with
      $I(\lambda) = 1/\lambda$, what is the Cramér–Rao lower bound on the
      variance of an unbiased estimator of $\lambda$ at $\lambda = 6$?
    answer: >
      $0.125$. The bound is
      $\frac{1}{nI(\lambda)} = \frac{1}{48 \cdot (1/6)} = \frac{6}{48} =
      0.125$, that is $\lambda/n$. It is attained exactly:
      $\bar{X}$ is unbiased for $\lambda$ with
      $\operatorname{Var}(\bar{X}) = \lambda/n = 6/48 = 0.125$, so the sample
      mean is efficient and the search for a better unbiased estimator of a
      Poisson rate is closed. Two cautions the bound carries. It restricts
      unbiased estimators only — a biased estimator may have smaller variance,
      and even smaller MSE, without contradiction. And it needs the regularity
      conditions, which hold here because the Poisson support
      $\{0,1,2,\dots\}$ does not depend on $\lambda$.
    expects: "0.125"
    rubric:
      - >
        Takes the reciprocal of $nI(\lambda)$, not of $I(\lambda)$ alone.
      - >
        Checks attainment against $\operatorname{Var}(\bar{X}) = \lambda/n$ and
        notes the bound binds only unbiased estimators.
    targets:
      - quant-statistics.estimation.cramer-rao
    exercises:
      - quant-statistics.estimation.fisher-information

  # --- asymptotic normality of the MLE ----------------------------------------

  - id: qest-mle-asymptotics-01
    kind: work
    difficulty: demanding
    statement: >
      From $n = 100$ iid $\operatorname{Poisson}(\lambda)$ observations the
      sample mean is $4$. Using $I(\lambda) = 1/\lambda$ and the asymptotic
      normality of the MLE, what is the half-width
      $1.96/\sqrt{nI(\hat{\lambda})}$ of the approximate $95\%$ interval?
    answer: >
      $0.392$. The MLE for a Poisson rate is $\hat{\lambda} = \bar{x} = 4$.
      Plugging in, $I(\hat{\lambda}) = 1/4$ and
      $nI(\hat{\lambda}) = 100/4 = 25$, so the half-width is
      $1.96/\sqrt{25} = 1.96/5 = 0.392$ and the interval is
      $4 \pm 0.392$, roughly $(3.61, 4.39)$. The equivalent familiar form is
      $\hat{\lambda} \pm 1.96\sqrt{\hat{\lambda}/n} =
      4 \pm 1.96\sqrt{0.04}$, which is the same arithmetic wearing different
      clothes. Two things are being assumed and should be said: the information
      is evaluated at $\hat{\lambda}$ rather than the unknown $\lambda$, which
      is legitimate only because $\hat{\lambda}$ is consistent, and the normal
      shape is an $n \to \infty$ approximation, adequate here because
      $n\hat{\lambda} = 400$ expected events is a large count.
    expects: "0.392"
    rubric:
      - >
        Evaluates the information at $\hat{\lambda}$ and multiplies by $n$
        before taking the reciprocal square root.
      - >
        Says the plug-in step relies on consistency and the interval on an
        asymptotic approximation.
    targets:
      - quant-statistics.estimation.mle-asymptotics
    exercises:
      - quant-statistics.estimation.fisher-information

  - id: qest-mle-asymptotics-02
    kind: work
    difficulty: standard
    statement: >
      From $n = 400$ Bernoulli trials with $100$ successes, what is the
      half-width $1.96/\sqrt{nI(\hat{p})}$ of the approximate $95\%$ interval
      for $p$, to four decimals?
    answer: >
      $0.0424$. The MLE is $\hat{p} = 100/400 = 0.25$, and the Bernoulli
      information is $I(p) = 1/(p(1-p))$, so
      $I(\hat{p}) = 1/(0.25 \times 0.75) = 1/0.1875 \approx 5.3333$ and
      $nI(\hat{p}) = 400/0.1875 \approx 2133.33$. The half-width is
      $1.96/\sqrt{2133.33} \approx 0.0424$, giving the interval
      $0.25 \pm 0.0424$, about $(0.208, 0.292)$. This is the familiar
      $1.96\sqrt{\hat{p}(1-\hat{p})/n} = 1.96\sqrt{0.000469}$ written through
      the information, which is the general recipe: the same formula produces
      an interval for any MLE once you can compute $I$. Reporting
      $1.96/\sqrt{I(\hat{p})} \approx 0.849$ omits the $n$ and gives a
      half-width wider than the parameter space.
    expects: "0.0424"
    tolerance: 0.0005
    rubric:
      - >
        Includes the factor $n$ inside the square root, so the half-width
        shrinks like $1/\sqrt{n}$.
      - >
        Recognises the result as $1.96\sqrt{\hat{p}(1-\hat{p})/n}$ in the
        information form.
    targets:
      - quant-statistics.estimation.mle-asymptotics

  - id: qest-mle-asymptotics-03
    kind: decide
    difficulty: standard
    statement: >
      For $X_1,\dots,X_n$ iid $\operatorname{Uniform}(0,\theta)$, what happens
      to the maximum likelihood estimator $\hat{\theta}_n = X_{(n)}$ as
      $n \to \infty$?
    answer: >
      It is consistent, but the asymptotic normality theorem does not apply and
      its conclusion is false here. The regularity conditions require the
      support of $f(\cdot\,;\theta)$ to be free of $\theta$, and for the
      uniform the support is $(0,\theta)$ itself, so differentiation under the
      integral sign is not licensed and $I(\theta)$ is not the right object.
      What actually holds is
      $\Pr(n(\theta - \hat{\theta}_n) > t) = (1 - t/(n\theta))^{n} \to
      e^{-t/\theta}$, so $n(\theta - \hat{\theta}_n)$ converges to an
      exponential law with mean $\theta$. Two departures at once: the scaling
      is $n$, not $\sqrt{n}$, so the estimator converges faster than the usual
      rate; and the limit is a one-sided exponential rather than a symmetric
      normal, because $\hat{\theta}_n$ approaches $\theta$ strictly from below.
      This is the standard example of the hypotheses of the theorem doing real
      work.
    choices:
      - text: >
          $n(\theta - \hat{\theta}_n)$ converges to an exponential law with
          mean $\theta$ — rate $n$, and not normal.
        correct: true
        feedback: >
          Right — the moving support breaks the regularity conditions, and both
          the rate and the shape change.
      - text: >
          $\sqrt{n}(\hat{\theta}_n - \theta) \to N(0, 1/I(\theta))$, as for
          every maximum likelihood estimator.
        feedback: >
          The theorem is conditional. Its support condition fails here, so its
          conclusion cannot be quoted.
      - text: >
          $\hat{\theta}_n$ is not consistent, since it is biased at every $n$.
        feedback: >
          It is consistent: the bias $-\theta/(n+1)$ and the variance both
          vanish, so the MSE does. Bias at finite $n$ never rules out
          consistency.
    rubric:
      - >
        Checks the support condition before invoking the theorem, rather than
        applying it to every MLE.
      - >
        Names both departures — the rate $n$ and the exponential limit — and
        keeps consistency intact.
    targets:
      - quant-statistics.estimation.mle-asymptotics

  # --- method of moments ------------------------------------------------------

  - id: qest-mom-01
    kind: work
    difficulty: demanding
    statement: >
      A sample is modelled as iid $\operatorname{Uniform}(a,b)$ with both
      endpoints unknown. The sample mean is $10$ and the sample second central
      moment $\frac{1}{n}\sum_{i}(x_i - \bar{x})^{2}$ is $3$. What is the
      method-of-moments estimate of $b$?
    answer: >
      $13$. Two unknowns need two moment equations. The population mean is
      $(a+b)/2$ and the population variance is $(b-a)^{2}/12$, so set
      $\frac{\hat{a}+\hat{b}}{2} = 10$ and
      $\frac{(\hat{b}-\hat{a})^{2}}{12} = 3$. The second gives
      $(\hat{b}-\hat{a})^{2} = 36$, so the width is $\hat{b}-\hat{a} = 6$
      taking the positive root, and the first gives
      $\hat{a}+\hat{b} = 20$. Adding, $2\hat{b} = 26$ and $\hat{b} = 13$, with
      $\hat{a} = 7$. The method works cleanly here because the two moments
      determine the two parameters, but it inherits the usual defect: nothing
      in the procedure checks that every observation lies inside
      $[\hat{a},\hat{b}]$, so a sample containing a value above $13$ would be
      handed an interval that assigns it probability zero. The
      likelihood-based answer, $(\min_i x_i, \max_i x_i)$, cannot fail that
      way.
    expects: "13"
    rubric:
      - >
        Sets up two equations for two parameters, using the variance
        $(b-a)^{2}/12$ rather than only the mean.
      - >
        Solves the pair rather than estimating one endpoint and guessing the
        other, and notes the feasibility risk.
    targets:
      - quant-statistics.estimation.mom

  - id: qest-mom-02
    kind: work
    difficulty: standard
    statement: >
      Four iid draws from $\operatorname{Uniform}(0,\theta)$ come in at
      $1.2, 3.4, 5.0, 6.4$. What is the method-of-moments estimate of $\theta$?
    answer: >
      $8$. The single population moment is $\mathbb{E}[X] = \theta/2$, so
      setting it equal to the sample mean gives $\hat{\theta} = 2\bar{x}$. Here
      $\bar{x} = (1.2 + 3.4 + 5.0 + 6.4)/4 = 16.0/4 = 4.0$, so
      $\hat{\theta} = 8$. The estimator is unbiased with variance
      $\theta^{2}/(3n)$, which at $n = 4$ and $\theta = 8$ is about $5.3$ —
      compare the maximum likelihood estimate $X_{(4)} = 6.4$, whose mean
      squared error is $\frac{2\theta^{2}}{(n+1)(n+2)} \approx 4.3$ even before
      bias correction. So the moment estimator is unbiased and still the worse
      of the two, which is the whole reason maximum likelihood is the default.
      It also survives feasibility here only by luck: had the largest draw been
      $8.5$ instead of $6.4$, $2\bar{x}$ would have fallen below an observed
      value.
    expects: "8"
    rubric:
      - >
        Equates $\theta/2$ to the sample mean rather than to the sample
        maximum.
      - >
        Compares against the likelihood-based estimator and does not treat
        unbiasedness as settling the comparison.
    targets:
      - quant-statistics.estimation.mom

  - id: qest-mom-03
    kind: decide
    difficulty: standard
    statement: >
      Six iid draws come from $\operatorname{Uniform}(0,\theta)$ with the true
      $\theta = 12$. Three estimators are on the table: the moment estimator
      $2\bar{X}$, the sample maximum $X_{(6)}$, and the corrected maximum
      $\frac{7}{6}X_{(6)}$. Which has the smallest mean squared error?
    answer: >
      The corrected maximum, and by a wide margin. Its MSE is
      $\frac{\theta^{2}}{n(n+2)} = \frac{144}{6 \cdot 8} = 3$. The raw maximum
      has $\frac{2\theta^{2}}{(n+1)(n+2)} = \frac{288}{56} \approx 5.14$. The
      moment estimator is unbiased with variance
      $\frac{\theta^{2}}{3n} = \frac{144}{18} = 8$, the worst of the three
      despite carrying no bias at all. So the ranking is corrected maximum,
      then raw maximum, then $2\bar{X}$ — and the unbiased candidate finishes
      last. The reason is structural: the maximum is a sufficient statistic for
      $\theta$, so estimators built from it use everything the sample says
      about the parameter, while the mean discards most of it.
    choices:
      - text: >
          $\frac{7}{6}X_{(6)}$, with MSE $3$, ahead of $X_{(6)}$ at about
          $5.14$ and $2\bar{X}$ at $8$.
        correct: true
        feedback: >
          Right — the corrected maximum is unbiased *and* quietest, because it
          is built from the sufficient statistic.
      - text: >
          $2\bar{X}$, since it is unbiased and the other two are built from a
          biased starting point.
        feedback: >
          That answers "which estimator is unbiased". On MSE it is the worst of
          the three, at $8$ against $3$ — being unbiased is not being best.
      - text: >
          $X_{(6)}$, since the maximum likelihood estimator is asymptotically
          efficient.
        feedback: >
          Asymptotic efficiency does not apply to this model at all — the
          support moves with $\theta$ — and at $n = 6$ the corrected version
          beats it outright.
    rubric:
      - >
        Computes all three mean squared errors rather than ranking by bias.
      - >
        Explains the ordering by sufficiency: the maximum retains the
        information about $\theta$ that the mean throws away.
    targets:
      - quant-statistics.estimation.mom

  # --- sufficiency ------------------------------------------------------------

  - id: qest-sufficiency-01
    kind: work
    difficulty: demanding
    statement: >
      Let $X_1, X_2, X_3$ be iid $\operatorname{Bernoulli}(p)$ and take the
      crude unbiased estimator $\hat{p} = X_1$. Rao–Blackwellize it against the
      sufficient statistic $T = \sum_{i} X_i$: what is
      $\mathbb{E}[X_1 \mid T = 2]$? Give an exact fraction or four decimals.
    answer: >
      $2/3 \approx 0.6667$. Given $T = 2$, the three sequences with two
      successes — $(1,1,0)$, $(1,0,1)$ and $(0,1,1)$ — each have the same
      probability $p^{2}(1-p)$, so conditionally they are equally likely, and
      $X_1 = 1$ in two of the three. Hence
      $\mathbb{E}[X_1 \mid T = 2] = 2/3$. Note that the answer contains no $p$
      whatsoever, which is exactly what sufficiency of $T$ guarantees — the
      conditional law of the sample given $T$ is free of the parameter, so this
      conditional expectation really is a statistic and can be used as an
      estimator. In general $\mathbb{E}[X_1 \mid T = t] = t/n$, so
      Rao–Blackwellizing $X_1$ produces $\bar{X}$. The theorem says the result
      is still unbiased and has variance no larger: $X_1$ has variance
      $p(1-p)$ and $\bar{X}$ has $p(1-p)/3$, a threefold improvement obtained
      for free by conditioning on a sufficient statistic.
    expects: "2/3"
    tolerance: 0.0005
    rubric:
      - >
        Counts the equally likely sequences with $T = 2$ rather than trying to
        integrate the parameter out.
      - >
        Notices that the answer is free of $p$, which is what makes the
        conditional expectation a legitimate statistic.
    targets:
      - quant-statistics.estimation.sufficiency

  - id: qest-sufficiency-02
    kind: decide
    difficulty: standard
    statement: >
      For $X_1,\dots,X_n$ iid $\operatorname{Exponential}(\lambda)$ with
      density $\lambda e^{-\lambda x}$, which of the following statistics is
      sufficient for $\lambda$?
    answer: >
      $\sum_{i} X_i$. Write the likelihood and read the factorization off it:
      $L(\lambda) = \lambda^{n}e^{-\lambda\sum_{i} x_i}$, which is already in
      the Fisher–Neyman form $g(T(x),\lambda)\,h(x)$ with
      $T(x) = \sum_{i} x_i$, $g(T,\lambda) = \lambda^{n}e^{-\lambda T}$ and
      $h(x) = 1$. Every appearance of $\lambda$ is paired with the sum and with
      nothing else, so once the total is known the individual waiting times say
      nothing further about the rate. No conditional distribution ever has to
      be computed. The maximum $\max_{i} X_i$ is sufficient for the *uniform*
      model, where the support moves with the parameter, and importing it here
      is the usual confusion of two different examples;
      $\sum_{i} X_i^{2}$ appears in the normal model with unknown variance and
      plays no role in this likelihood at all.
    choices:
      - text: >
          $\sum_{i} X_i$
        correct: true
        feedback: >
          Right — $L(\lambda) = \lambda^{n}e^{-\lambda\sum_i x_i}$ touches the
          data only through that sum.
      - text: >
          $\max_{i} X_i$
        feedback: >
          That is the sufficient statistic for
          $\operatorname{Uniform}(0,\theta)$, where the support depends on the
          parameter. The exponential likelihood never mentions the maximum.
      - text: >
          $\sum_{i} X_i^{2}$
        feedback: >
          The sum of squares does not appear anywhere in
          $\lambda^{n}e^{-\lambda\sum_i x_i}$; it is the normal model's second
          coordinate, not this one's.
      - text: >
          The pair $(X_1, X_n)$
        feedback: >
          Two particular observations discard the other $n-2$, and the
          likelihood plainly depends on all of them through their total.
    rubric:
      - >
        Uses the Fisher–Neyman factorization on the written likelihood rather
        than the conditional-distribution definition.
      - >
        Keeps the exponential and uniform examples apart, rather than reaching
        for the maximum by habit.
    targets:
      - quant-statistics.estimation.sufficiency
    exercises:
      - quant-statistics.estimation.likelihood

  # --- German tank problem ----------------------------------------------------

  - id: qest-german-tank-01
    kind: work
    difficulty: demanding
    statement: >
      Six vehicles are captured, carrying serial numbers
      $4, 19, 37, 58, 71, 96$ from a fleet numbered $1,\dots,N$. What is the
      unbiased estimate of $N$?
    answer: >
      $111$. Here $k = 6$ and the largest serial is $m = 96$. The maximum
      likelihood estimate is $\hat{N} = m = 96$, biased low because $m$ can
      never exceed $N$. Since $\Pr(m = j) =
      \binom{j-1}{k-1}/\binom{N}{k}$ gives
      $\mathbb{E}[m] = \frac{k(N+1)}{k+1}$, inverting yields the unbiased
      estimator $\hat{N} = \frac{k+1}{k}m - 1 = m + \frac{m}{k} - 1$. Here that
      is $96 + 16 - 1 = 111$. The formula reads as arithmetic you can defend
      out loud: six serials spread over the range leave gaps averaging
      $m/k = 16$, so add one expected gap beyond the largest seen and step back
      one for the fencepost. Its standard deviation runs near $N/k \approx 18$,
      so this is an estimate with real uncertainty — and still far better than
      the wartime intelligence estimates it displaced, which ran several times
      too high.
    expects: "111"
    rubric:
      - >
        Uses $m + m/k - 1$ with $m$ the largest serial and $k$ the number
        captured, not the sample mean.
      - >
        States that the plain MLE $m$ is biased low, and why the correction has
        the size it does.
    targets:
      - quant-statistics.estimation.german-tank
    exercises:
      - quant-statistics.estimation.mle-uniform

  - id: qest-german-tank-02
    kind: work
    difficulty: standard
    statement: >
      Three vehicles are captured with serials $12, 40, 87$. What is the
      unbiased estimate of the fleet size $N$?
    answer: >
      $115$. With $k = 3$ and $m = 87$, the estimator
      $\hat{N} = m + \frac{m}{k} - 1$ gives $87 + 29 - 1 = 115$. Notice how
      much heavier the correction is than in a larger sample: with only three
      serials the average gap $m/k = 29$ is a third of the largest serial seen,
      so the estimate sits a third above it. That is the right behaviour —
      fewer captures mean the largest observed serial is likely to fall much
      further short of $N$ — and it is also a warning about precision, since
      the standard deviation runs near $N/k \approx 38$. The two serials $12$
      and $40$ have not been ignored: they enter through $k$, which is what
      sets the size of the correction, and only through $k$.
    expects: "115"
    rubric:
      - >
        Uses only $m$ and $k$, and does not average the serials.
      - >
        Notes that a small $k$ produces a large correction and a wide
        uncertainty.
    targets:
      - quant-statistics.estimation.german-tank

  - id: qest-german-tank-03
    kind: decide
    difficulty: standard
    statement: >
      Two vehicles are captured, with serials $31$ and $44$. One analyst
      reports the maximum likelihood estimate $44$; a second reports
      $m + m/k - 1 = 65$; a third treats the serials as draws from a discrete
      uniform on $\{1,\dots,N\}$ and reports the moment estimate
      $2\bar{x} - 1 = 74$. Which should be preferred?
    answer: >
      $65$. All three are computable and only one is both unbiased and built
      from the right statistic. The maximum likelihood answer $44$ is biased
      low by construction, since the largest captured serial can never exceed
      $N$; with $k = 2$ that bias is severe, because two serials leave a large
      expected gap above the observed maximum. The moment estimate $74$ is
      unbiased as well, but it is a function of the sample mean, and the mean
      is not sufficient for $N$ — the maximum is. Discarding the sufficient
      statistic costs variance, which is Rao–Blackwell read in reverse, and
      that is why $65$ is the answer to give even though $74$ has the same zero
      bias. The general lesson: unbiasedness alone never settles a comparison,
      and here it does not even distinguish the two candidates.
    choices:
      - text: >
          $65$ — unbiased, and built from the sample maximum, which is
          sufficient for $N$.
        correct: true
        feedback: >
          Right — same zero bias as the moment estimate, less variance, because
          it uses the statistic that carries the information.
      - text: >
          $74$ — also unbiased, and a larger estimate is the safer error to
          make.
        feedback: >
          That answers "which estimator is unbiased" without asking which has
          lower variance. The mean is not sufficient for $N$, so this estimate
          is noisier at the same bias.
      - text: >
          $44$ — the maximum likelihood estimate, which is the default choice.
        feedback: >
          Maximum likelihood is biased low here, badly so at $k = 2$; its
          asymptotic guarantees do not apply when the support depends on the
          parameter.
    rubric:
      - >
        Rules out the maximum likelihood estimate for downward bias, giving the
        reason rather than the label.
      - >
        Separates the two unbiased candidates by variance, naming the sample
        maximum as the sufficient statistic.
    targets:
      - quant-statistics.estimation.german-tank
