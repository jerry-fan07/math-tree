# Problems targeting quant-processes.poisson — the Poisson process: exponential
# gaps, superposition and thinning, conditional uniformity, and the inspection
# paradox.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. Every instance here is fresh: no
# problem reuses a lesson's worked example or a card's numbers. See ../README.md.

problems:
  # --- the process itself ------------------------------------------------------

  - id: qpois-pp-01
    kind: work
    difficulty: demanding
    statement: >
      Client orders arrive as a Poisson process of rate $\lambda = 5$ per hour,
      and $N(t)$ counts the orders in $[0,t]$ with $t$ measured in hours. What
      is $\operatorname{Var}(N(2) + N(6))$?
    answer: >
      $60$. The two counts overlap, so they are *not* independent and their
      variances do not simply add. Split at the boundary instead: write
      $N(6) = N(2) + (N(6) - N(2))$, so that
      $N(2) + N(6) = 2N(2) + (N(6) - N(2))$. The windows $(0,2]$ and $(2,6]$
      are disjoint, so those two pieces are independent Poisson counts with
      means $\lambda \cdot 2 = 10$ and $\lambda \cdot 4 = 20$, and for a
      Poisson process $\operatorname{Var}(N(t)) = \lambda t$ on each. Hence
      $\operatorname{Var}(2N(2)) = 4 \cdot 10 = 40$ and
      $\operatorname{Var}(N(6) - N(2)) = 20$, totalling $60$. The trap is
      reporting $10 + 30 = 40$ by adding $\operatorname{Var}(N(2))$ and
      $\operatorname{Var}(N(6))$ as if the two windows were disjoint; the
      missing piece is $2\operatorname{Cov}(N(2), N(6)) =
      2\operatorname{Var}(N(2)) = 20$, because the overlap between them is
      exactly $N(2)$.
    expects: "60"
    rubric:
      - >
        Decomposes $N(6)$ into the disjoint increments $N(2)$ and
        $N(6) - N(2)$ rather than treating $N(2)$ and $N(6)$ as independent.
      - >
        Applies $\operatorname{Var}(N(t)) = \lambda t$ on each disjoint window
        and squares the coefficient on the repeated piece.
    targets:
      - quant-processes.poisson.pp
    exercises:
      - quant-probability.expectation.variance

  - id: qpois-pp-02
    kind: work
    difficulty: standard
    statement: >
      Defaults in a large bond portfolio occur as a Poisson process of rate
      $2.5$ per year. What is the probability of exactly $2$ defaults over the
      next $18$ months? Use $e^{-3.75} = 0.023518$.
    answer: >
      $0.1654$. The window is $t = 1.5$ years, so the count over it is
      $\operatorname{Poisson}(\lambda t)$ with
      $\lambda t = 2.5 \cdot 1.5 = 3.75$: the rate multiplies the window
      length, and it is that product, never the bare rate, that enters the pmf.
      Then $\Pr(N = 2) = e^{-3.75}(3.75)^{2}/2! = 0.023518 \cdot 14.0625/2 =
      0.023518 \cdot 7.03125 = 0.1654$. Two slips sit either side. Using the
      rate itself as the mean gives $e^{-2.5}(2.5)^{2}/2! = 0.2565$, which
      answers the question for a one-year window. Reading "$18$ months" as
      $t = 18$ without converting gives a mean of $45$ and a probability near
      zero — the units of $\lambda$ and of $t$ have to match before they are
      multiplied.
    expects: "0.1654"
    tolerance: 0.0005
    rubric:
      - >
        Forms the mean as $\lambda t = 3.75$ over the stated window rather than
        using the rate $2.5$ on its own.
      - >
        Applies the Poisson pmf at $k = 2$, dividing by $2!$.
    targets:
      - quant-processes.poisson.pp
    exercises:
      - quant-probability.discrete.poisson

  - id: qpois-pp-03
    kind: decide
    difficulty: standard
    statement: >
      Trades print as a Poisson process of constant rate. A colleague sees an
      unusually heavy first half hour and says: "the count ran well above
      average, so the second half hour should come in light." Which verdict is
      right, and which axiom settles it?
    answer: >
      The claim is wrong, and independent increments is the axiom that settles
      it. The counts over the two disjoint half hours are independent
      $\operatorname{Poisson}(\lambda/2)$ variables, so the realised value of
      the first carries no information at all about the second: the conditional
      mean of the second count given the first is still $\lambda/2$. Nothing in
      the model pulls a run back toward its average — that is the gambler's
      fallacy, and independence is precisely what forbids it. Stationarity is a
      different axiom doing a different job: it says the two windows share a
      distribution because they have equal length, not that their realised
      counts are linked. The one honest inference from a heavy window runs the
      other way — that $\lambda$ itself may be larger than assumed, which is a
      question about the model rather than about the next window.
    choices:
      - text: >
          Wrong — independent increments make the counts over disjoint windows
          independent, so the first says nothing about the second
        correct: true
        feedback: >
          Exactly the property in play: disjoint-window counts are independent
          Poisson variables, so the conditional mean of the second is
          $\lambda/2$ whatever the first turned out to be.
      - text: >
          Right — stationary increments force both half hours toward the same
          count $\lambda/2$
        feedback: >
          Stationarity equalises the two distributions, not the two realised
          counts; it gives no mechanism that would pull the second window down.
      - text: >
          Right — the hour's total is $\operatorname{Poisson}(\lambda)$, so a
          heavy first half leaves less for the second
        feedback: >
          The hourly total is itself random, not fixed at $\lambda$.
          Conditioning on a known total is a different problem, and only there
          do the two halves trade off against each other.
      - text: >
          Wrong, but only because the rate is constant — with a drifting rate
          the inference would be valid
        feedback: >
          Independent increments survive a drifting rate, so the
          non-homogeneous process forbids this inference too; stationarity, not
          independence, is what a drifting rate costs you.
    rubric:
      - >
        Names independent increments, not stationarity, as the property that
        makes the two disjoint half hours uninformative about each other.
      - >
        Says that the hourly total is random, so no "budget" is being shared
        between the halves.
    targets:
      - quant-processes.poisson.pp

  - id: qpois-pp-04
    kind: work
    difficulty: demanding
    statement: >
      A Poisson process with $\lambda t = 4$ over some window is approximated
      the classical way: chop the window into $n = 200$ equal slots and let
      each slot independently hold one arrival with probability
      $p = 4/200 = 0.02$ and none otherwise. For this finite-$n$ slot model,
      what is $\operatorname{Var}(N)/\mathbb{E}[N]$?
    answer: >
      $0.98$. Under the slot model $N$ is
      $\operatorname{Binomial}(n,p)$, so $\mathbb{E}[N] = np = 200 \cdot 0.02
      = 4$ and $\operatorname{Var}(N) = np(1-p) = 4 \cdot 0.98 = 3.92$; the
      ratio is $np(1-p)/(np) = 1 - p = 0.98$, with the mean cancelling out
      entirely. This is the binomial-to-Poisson limit seen from one angle: the
      approximating model is slightly *under*-dispersed, and the whole deficit
      is $p = \lambda t/n$, which vanishes as $n \to \infty$ with $\lambda t$
      held fixed. Only in the limit does the ratio reach $1$, matching
      $\mathbb{E}[N(t)] = \operatorname{Var}(N(t)) = \lambda t$ for the process
      itself. Answering $1$ reports the limit rather than the finite-$n$ model;
      answering $3.92$ reports the variance and forgets to divide by the mean.
    expects: "0.98"
    rubric:
      - >
        Uses $\operatorname{Var} = np(1-p)$ and $\mathbb{E} = np$ for the slot
        model rather than assuming the Poisson identity in advance.
      - >
        Reports the finite-$n$ value $1 - p$ and says it rises to $1$ only as
        $n \to \infty$.
    targets:
      - quant-processes.poisson.pp
      - quant-probability.discrete.poisson-limit
    exercises:
      - quant-probability.discrete.binomial
    connects:
      - "quant-probability.discrete.poisson-limit ~ quant-processes.poisson.pp"

  # --- the local rate characterization ------------------------------------------

  - id: qpois-infinitesimal-definition-01
    kind: work
    difficulty: demanding
    statement: >
      A pump fails at a constant hazard: over any interval of length $h$ hours
      the chance of exactly one failure is $0.04h + o(h)$ and the chance of two
      or more is $o(h)$, and failures in disjoint intervals are independent.
      What is the probability of at least one failure over a $30$-hour run?
      Use $e^{-1.2} = 0.301194$.
    answer: >
      $0.6988$. The two local conditions plus independent stationary increments
      are exactly the infinitesimal characterization, so the process is Poisson
      and $\lambda$ is read straight off the coefficient of $h$:
      $\lambda = 0.04$ per hour. Over $t = 30$ hours the count is
      $\operatorname{Poisson}(\lambda t)$ with $\lambda t = 1.2$, so
      $\Pr(N \ge 1) = 1 - \Pr(N = 0) = 1 - e^{-1.2} = 1 - 0.301194 = 0.6988$.
      The trap the $o(h)$ exists to prevent is scaling the local rule up
      directly: $0.04 \cdot 30 = 1.2$ is a mean count, not a probability, and
      quoting it as one produces an impossible answer above $1$. The linear
      form $\lambda h$ is a first-order statement about a *shrinking* window
      only; for $h$ of any real size the exact answer needs the Poisson law
      that the limit produces.
    expects: "0.6988"
    tolerance: 0.0005
    rubric:
      - >
        Reads $\lambda = 0.04$ off the coefficient of $h$ and forms the mean
        $\lambda t = 1.2$ over the $30$-hour window.
      - >
        Computes the complement $1 - e^{-\lambda t}$ rather than reporting
        $\lambda t$ itself as a probability.
    targets:
      - quant-processes.poisson.infinitesimal-definition
    exercises:
      - quant-probability.discrete.poisson

  - id: qpois-infinitesimal-definition-02
    kind: decide
    difficulty: standard
    statement: >
      A logging system has independent stationary increments and satisfies
      $\Pr(N(h) = 1) = \lambda h + o(h)$, but its events genuinely arrive in
      pairs, so $\Pr(N(h) = 2) = \mu h + o(h)$ for some $\mu > 0$. Is this a
      Poisson process?
    answer: >
      No: orderliness fails, and with it the characterization. The
      infinitesimal definition asks for two local conditions, not one —
      $\Pr(N(h) = 1) = \lambda h + o(h)$ *and* $\Pr(N(h) \ge 2) = o(h)$ — and
      here the second is violated outright, since $\mu h$ is of order $h$, not
      $o(h)$. The consequence is visible in the counts: this is a batch
      process, a Poisson stream of *events* each carrying one or two arrivals,
      so $N(t)$ is a compound Poisson variable with
      $\mathbb{E}[N(t)] = (\lambda + 2\mu)t$ but
      $\operatorname{Var}(N(t)) = (\lambda + 4\mu)t$, strictly larger. Since a
      genuine Poisson process has variance equal to its mean, no choice of rate
      makes this one Poisson. Independence and stationarity are necessary but
      nowhere near sufficient — orderliness is what rules out coincident
      arrivals, and it is the condition doing real work here.
    choices:
      - text: >
          No — $\Pr(N(h) \ge 2)$ is of order $h$ rather than $o(h)$, so
          orderliness fails and this is a batch process
        correct: true
        feedback: >
          Orderliness is exactly the condition being broken, and the damage
          shows in the moments: variance $(\lambda + 4\mu)t$ exceeds the mean
          $(\lambda + 2\mu)t$, which no Poisson process can do.
      - text: >
          Yes — it is Poisson at rate $\lambda + 2\mu$, the mean arrival rate
        feedback: >
          Matching the mean rate is not the test. A process with that Poisson
          law would have variance $(\lambda + 2\mu)t$, whereas the paired
          arrivals here give $(\lambda + 4\mu)t$.
      - text: >
          No — independence of increments fails once arrivals come in pairs
        feedback: >
          Independence is granted in the setup and is not what breaks; the two
          members of a pair land in the same instant, not in different
          intervals.
      - text: >
          Yes — increments are independent and stationary, which is all the
          definition requires
        feedback: >
          Those two are necessary but not sufficient; without orderliness the
          local rule no longer forces a Poisson count, and batch arrivals slip
          through.
    rubric:
      - >
        Identifies orderliness, $\Pr(N(h) \ge 2) = o(h)$, as the failed
        condition rather than independence or stationarity.
      - >
        Backs the verdict with a moment check — variance strictly above the
        mean is impossible for a Poisson count.
    targets:
      - quant-processes.poisson.infinitesimal-definition

  # --- the gaps ------------------------------------------------------------------

  - id: qpois-interarrival-01
    kind: work
    difficulty: demanding
    statement: >
      Messages arrive as a Poisson process of rate $\lambda = 12$ per hour,
      with gaps $X_1, X_2, \dots$ between consecutive arrivals. What is
      $\Pr(X_2 > 2X_1)$?
    answer: >
      $1/3 \approx 0.3333$, and the rate never enters. The gaps are independent
      and each is $\operatorname{Exp}(\lambda)$, so condition on $X_1 = x$ and
      apply the survival function of the second gap:
      $\Pr(X_2 > 2x \mid X_1 = x) = e^{-2\lambda x}$. Averaging over $X_1$,
      $\Pr(X_2 > 2X_1) = \int_{0}^{\infty} \lambda e^{-\lambda x}
      e^{-2\lambda x}\,dx = \lambda \int_{0}^{\infty} e^{-3\lambda x}\,dx =
      \lambda/(3\lambda) = 1/3$. The cancellation is the whole point: two
      exponentials of a common rate compare on a scale-free basis, so
      $\lambda = 12$ is a distraction and any answer that mentions it is wrong.
      The symmetric case checks the method, $\Pr(X_2 > X_1) =
      \lambda/(2\lambda) = 1/2$, as it must be for two iid continuous
      variables. The trap is calling $X_1$ and $X_2$ dependent because they
      share the arrival between them; they are not, and the restart of the
      process at each arrival is exactly why.
    expects: "1/3"
    tolerance: 0.0005
    rubric:
      - >
        Uses independence of $X_1$ and $X_2$ to condition on $X_1$ and apply
        the exponential survival function to $X_2$.
      - >
        Notices that $\lambda$ cancels, so $1/3$ is the answer at every rate.
    targets:
      - quant-processes.poisson.interarrival
    exercises:
      - quant-probability.continuous.exponential

  - id: qpois-interarrival-02
    kind: work
    difficulty: standard
    statement: >
      Trucks reach a weigh station as a Poisson process of rate $5$ per hour.
      What is the probability that the gap between two consecutive trucks lies
      between $6$ and $18$ minutes? Use $e^{-0.5} = 0.606531$ and
      $e^{-1.5} = 0.223130$.
    answer: >
      $0.3834$. Each gap is $\operatorname{Exp}(5)$ with time in hours, so
      convert first: $6$ minutes is $0.1$ hour and $18$ minutes is $0.3$ hour.
      The survival function delivers both ends at once,
      $\Pr(X > t) = e^{-\lambda t}$, giving
      $\Pr(0.1 < X < 0.3) = \Pr(X > 0.1) - \Pr(X > 0.3) = e^{-0.5} - e^{-1.5}
      = 0.606531 - 0.223130 = 0.3834$. Mixing units is the standard wreck:
      pairing $\lambda = 5$ per hour with $t = 6$ and $t = 18$ in minutes gives
      $e^{-30} - e^{-90}$, effectively zero. Note also that the mean gap is
      $1/5$ hour $= 12$ minutes, yet the window $[6,18]$ is not balanced about
      it in probability — $\Pr(X < 12\text{ minutes}) = 1 - e^{-1} = 0.632$,
      well over half, because the exponential density is largest at $0$.
    expects: "0.3834"
    tolerance: 0.0005
    rubric:
      - >
        Converts both endpoints into the units of $\lambda$ before applying the
        exponential.
      - >
        Differences the two survival probabilities rather than the two
        densities.
    targets:
      - quant-processes.poisson.interarrival
    exercises:
      - quant-probability.continuous.exponential

  - id: qpois-interarrival-03
    kind: justify
    difficulty: demanding
    statement: >
      For a Poisson process of rate $\lambda$, prove that the first gap
      satisfies $\Pr(X_1 > s + t \mid X_1 > s) = \Pr(X_1 > t)$ for all
      $s, t > 0$, and explain why every later gap inherits the same
      memorylessness with no separate argument. Name the axiom each step uses.
    answer: >
      Start with the identity that converts a waiting time into a count: the
      event $\{X_1 > u\}$ is the event $\{N(u) = 0\}$, since the first arrival
      is later than $u$ exactly when the window $(0,u]$ is empty. The count
      axiom then gives $\Pr(X_1 > u) = e^{-\lambda u}$ directly. For the
      conditional statement, $\{X_1 > s+t\} \subset \{X_1 > s\}$, so
      $\Pr(X_1 > s+t \mid X_1 > s) = e^{-\lambda(s+t)}/e^{-\lambda s} =
      e^{-\lambda t} = \Pr(X_1 > t)$. Read structurally rather than
      algebraically, the same line says
      $\{X_1 > s+t\} \cap \{X_1 > s\}$ decomposes into "nothing in $(0,s]$" and
      "nothing in $(s, s+t]$", two disjoint windows: independent increments
      make them independent, and stationary increments give the second one the
      law of a fresh window of length $t$. That is the derivation, and it uses
      both of the first two axioms and none of the exponential's algebra. For
      the later gaps, nothing new is needed: fix the $(n-1)$-th arrival epoch
      and the same two axioms restart the process there, so
      $\Pr(X_n > t \mid \text{history}) = e^{-\lambda t}$, which simultaneously
      gives every gap the $\operatorname{Exp}(\lambda)$ law and makes it
      independent of everything before it. The common error is to prove the
      first gap exponential and then argue the second one separately by
      integrating over $X_1$ — correct but wasteful, and it obscures that the
      independence and the common law come from the same restart.
    rubric:
      - >
        Converts $\{X_1 > u\}$ into $\{N(u) = 0\}$ and reads
        $e^{-\lambda u}$ off the count axiom, rather than assuming the gap is
        exponential at the start.
      - >
        Attributes the two halves of the argument correctly: independent
        increments for the factorisation, stationary increments for the second
        window's law.
      - >
        Gets every later gap from the restart at an arrival epoch rather than
        re-deriving one gap at a time.
    targets:
      - quant-processes.poisson.interarrival
    exercises:
      - quant-probability.continuous.memoryless-exponential

  - id: qpois-interarrival-04
    kind: work
    difficulty: routine
    statement: >
      Emails land in an inbox as a Poisson process of rate $24$ per hour. What
      is the standard deviation of the gap between consecutive emails, in
      minutes?
    answer: >
      $2.5$ minutes. Every gap is $\operatorname{Exp}(\lambda)$ with
      $\lambda = 24$ per hour, and the exponential has
      $\mathbb{E}[X] = 1/\lambda$ and
      $\operatorname{Var}(X) = 1/\lambda^{2}$, so its standard deviation
      equals its mean: $1/24$ hour, which is $60/24 = 2.5$ minutes. That
      coincidence is worth carrying — a coefficient of variation of exactly
      $1$ is the signature of exponential gaps, and it is why Poisson arrivals
      look so uneven. The trap is reaching for $\sqrt{\lambda t}$, which is the
      standard deviation of the *count* over a window of length $t$; it is a
      pure number, not a time, and answers a different question.
    expects: "2.5"
    rubric:
      - >
        Uses $\operatorname{Var}(X) = 1/\lambda^{2}$ for the gap, so the
        standard deviation is $1/\lambda$.
      - >
        Converts $1/24$ hour into minutes rather than leaving it in hours.
    targets:
      - quant-processes.poisson.interarrival
    exercises:
      - quant-probability.continuous.exponential

  # --- arrival times and the count-time duality -----------------------------------

  - id: qpois-arrival-times-01
    kind: work
    difficulty: demanding
    statement: >
      Cargo ships enter a port as a Poisson process of rate $8$ per hour. What
      is the probability that the third ship of the shift has still not
      arrived half an hour in? Use $e^{-4} = 0.018316$.
    answer: >
      $0.2381$. Integrating the Erlang density of $T_3$ is the slow route; the
      count-time duality converts the question in one line. Since
      $\{T_3 \le t\} = \{N(t) \ge 3\}$, the complement gives
      $\Pr(T_3 > t) = \Pr(N(t) \le 2)$, and with $t = 0.5$ hour the mean is
      $\lambda t = 8 \cdot 0.5 = 4$. So
      $\Pr(T_3 > 0.5) = e^{-4}(1 + 4 + 4^{2}/2!) = e^{-4}(1 + 4 + 8) =
      13 \cdot 0.018316 = 0.2381$. The trap is the inequality direction: "the
      third ship has not arrived" is $N \le 2$, not $N < 3$ misread as
      $N \le 3$, and it is certainly not $N = 2$. Reporting $\Pr(N = 2) =
      8e^{-4} = 0.1465$ answers "exactly two ships", a strictly smaller event
      that leaves out the empty and single-arrival cases.
    expects: "0.2381"
    tolerance: 0.0005
    rubric:
      - >
        Uses $\{T_n \le t\} = \{N(t) \ge n\}$ to trade the Erlang tail for a
        Poisson partial sum.
      - >
        Sums $k = 0, 1, 2$ rather than taking the single term $k = 2$ or
        including $k = 3$.
    targets:
      - quant-processes.poisson.arrival-times
    exercises:
      - quant-probability.discrete.poisson

  - id: qpois-arrival-times-02
    kind: work
    difficulty: standard
    statement: >
      Insurance claims arrive as a Poisson process of rate $3$ per day. What is
      the variance, in days squared, of the time until the twelfth claim?
    answer: >
      $4/3 \approx 1.3333$. The twelfth arrival time is
      $T_{12} = X_1 + \cdots + X_{12}$, a sum of twelve independent
      $\operatorname{Exp}(3)$ gaps — that is exactly the
      $\operatorname{Gamma}(12, 3)$ variable, with the process supplying its
      meaning as the epoch of the twelfth claim. Variances of independent
      summands add, and each gap has
      $\operatorname{Var}(X_i) = 1/\lambda^{2} = 1/9$, so
      $\operatorname{Var}(T_{12}) = 12/9 = 4/3$ days squared, alongside
      $\mathbb{E}[T_{12}] = 12/3 = 4$ days. No density is needed for either.
      The slip to avoid is $\operatorname{Var}(T_n) = n/\lambda$, which
      confuses the variance with the mean and is not even dimensionally a time
      squared; the second is dividing by $n$ as though $T_{12}$ were an
      average of gaps rather than their sum.
    expects: "4/3"
    tolerance: 0.0005
    rubric:
      - >
        Writes $T_{12}$ as a sum of iid exponential gaps and adds their
        variances instead of reaching for the Gamma density.
      - >
        Uses $\operatorname{Var}(X_i) = 1/\lambda^{2}$, giving
        $n/\lambda^{2}$ rather than $n/\lambda$.
    targets:
      - quant-processes.poisson.arrival-times
      - quant-probability.continuous.gamma
    exercises:
      - quant-probability.continuous.exponential
    connects:
      - "quant-probability.continuous.gamma ~ quant-processes.poisson.arrival-times"

  - id: qpois-arrival-times-03
    kind: decide
    difficulty: standard
    statement: >
      Server outages occur as a Poisson process of rate $2$ per hour. A
      candidate computes the expected time until the fourth outage as
      $4 \cdot 2 = 8$ hours. What is the verdict?
    answer: >
      Wrong: the correct value is $n/\lambda = 4/2 = 2$ hours, and the
      candidate has multiplied by the rate where the formula divides. The check
      that catches it costs no algebra — units. A rate carries "per hour", so
      multiplying a count by a rate produces something in outages squared per
      hour, whereas $n/\lambda$ produces hours, which is what an expected time
      must be. The structural reason is that $T_4$ sums four gaps each of mean
      $1/\lambda = 0.5$ hour, so $\mathbb{E}[T_4] = 4 \cdot 0.5 = 2$. Sanity
      also points the same way: a faster process should reach its fourth outage
      *sooner*, and $n\lambda$ says the opposite, growing without bound as the
      rate rises. The value $8$ would be right only for a rate of $1/2$ per
      hour, that is, one outage every two hours.
    choices:
      - text: >
          Wrong — the answer is $n/\lambda = 2$ hours; the candidate multiplied
          by the rate instead of dividing
        correct: true
        feedback: >
          $T_4$ sums four gaps of mean $1/\lambda = 0.5$ hour, so the expected
          epoch is $2$ hours; the units alone rule out $n\lambda$.
      - text: >
          Right — $\mathbb{E}[T_n] = n\lambda$ because expectations of
          independent sums multiply
        feedback: >
          Expectations of sums add, they do not multiply, and each gap
          contributes its own mean $1/\lambda$, not $\lambda$.
      - text: >
          Wrong — the answer is $n/\lambda^{2} = 1$ hour
        feedback: >
          $n/\lambda^{2}$ is the variance of $T_n$, in hours squared; the mean
          is $n/\lambda$.
      - text: >
          Right, provided the four outages are independent of each other
        feedback: >
          The gaps are independent here, and even so the mean is $n/\lambda$;
          independence was never what made $n\lambda$ wrong.
    rubric:
      - >
        Corrects $n\lambda$ to $n/\lambda$ and gives the value $2$ hours.
      - >
        Justifies the direction — a faster rate must shorten the wait — or
        checks the units.
    targets:
      - quant-processes.poisson.arrival-times

  # --- the process starts over -----------------------------------------------------

  - id: qpois-fresh-start-01
    kind: work
    difficulty: demanding
    statement: >
      Prints hit a tape as a Poisson process of rate $3$ per hour. A trader
      starts watching at 10:00 and by 10:25 has seen nothing. What is the
      probability that no print arrives before 10:45 and that exactly one print
      arrives between 10:45 and 11:45? Use $e^{-1} = 0.367879$ and
      $e^{-3} = 0.049787$.
    answer: >
      $0.0549$. The $25$ minutes of silence are worth nothing and cost
      nothing: the fresh-start property says that from 10:25 the process is a
      brand-new rate-$3$ Poisson process independent of everything before, so
      condition on nothing and work forward. The window 10:25 to 10:45 has
      length $1/3$ hour and mean $\lambda t = 1$, giving
      $\Pr(N = 0) = e^{-1} = 0.367879$. The window 10:45 to 11:45 is disjoint
      from it, so its count is independent with mean $3$, giving
      $\Pr(N = 1) = 3e^{-3} = 3 \cdot 0.049787 = 0.149361$. Multiplying,
      $0.367879 \cdot 0.149361 = 0.0549$. The trap is treating the drought as
      information — shortening the first window's mean, or conditioning the
      second window on the first — when independent increments make the two
      factors free of each other and of the past.
    expects: "0.0549"
    tolerance: 0.0005
    rubric:
      - >
        Discards the elapsed $25$ minutes rather than using them to adjust
        either window.
      - >
        Multiplies the two disjoint windows' probabilities, with means
        $\lambda t = 1$ and $\lambda t = 3$ computed separately.
    targets:
      - quant-processes.poisson.fresh-start
    exercises:
      - quant-probability.continuous.memoryless-exponential

  - id: qpois-fresh-start-02
    kind: work
    difficulty: standard
    statement: >
      A router logs packet-drop events as a Poisson process of rate $0.75$ per
      hour. Five hours have passed since the last drop. What is the expected
      further wait, in minutes, until the next one?
    answer: >
      $80$ minutes. Fresh start applies at the fixed time "now": conditional on
      the whole history, the forward wait is a fresh
      $\operatorname{Exp}(0.75)$ variable, so its mean is
      $1/\lambda = 1/0.75 = 4/3$ hour $= 80$ minutes. The five hours of silence
      enter nowhere. Two wrong instincts pull in opposite directions and both
      fail. "A drop is overdue, so the wait should be shorter than $80$
      minutes" is the gambler's fallacy — the process has no memory of the
      drought. "Five hours with no drop suggests the rate is lower, so the wait
      should be longer" is a statement about estimating $\lambda$ from data,
      not about the model, which fixes $\lambda = 0.75$ by assumption. Under
      the stated model the answer is $80$ minutes however long you have waited.
    expects: "80"
    rubric:
      - >
        Uses $1/\lambda$ for the forward wait and ignores the elapsed five
        hours entirely.
      - >
        Converts $4/3$ hour into minutes rather than reporting $1.3333$.
    targets:
      - quant-processes.poisson.fresh-start

  - id: qpois-fresh-start-03
    kind: decide
    difficulty: standard
    statement: >
      A discrete analogue runs in one-minute slots, each independently
      containing an event with probability $p = 0.1$. You have watched $20$
      empty slots. Which statement correctly lines this up with the Poisson
      process's fresh-start property?
    answer: >
      The number of further slots until the first event is again geometric
      with the same $p = 0.1$, mean $10$ slots, exactly as the forward wait of
      a Poisson process is a fresh $\operatorname{Exp}(\lambda)$ variable with
      mean $1/\lambda$ however long the drought has run. The two facts are the
      same phenomenon on two clocks: the geometric is the only lattice waiting
      law with no memory and the exponential the only continuous one, and
      letting the slot length shrink with $p$ shrinking in proportion carries
      one into the other — which is also why per-slot Bernoulli trials converge
      to a Poisson process. What the $20$ empty slots change is nothing:
      $\Pr(\text{first event more than } k \text{ further slots away}) =
      0.9^{k}$, the unconditional value. The tempting alternative, that a run
      of failures makes the next slot more likely to fire, is exactly the
      memorylessness that both laws rule out.
    choices:
      - text: >
          The further wait is geometric with the same $p$, mean $10$ slots —
          the discrete twin of a fresh $\operatorname{Exp}(\lambda)$ forward
          wait
        correct: true
        feedback: >
          Memorylessness is the shared property: the geometric is the only
          lattice waiting law with it, the exponential the only continuous one,
          and neither remembers the $20$ empty slots.
      - text: >
          The further wait is shorter than $10$ slots, because $20$ chances
          have already been used up
        feedback: >
          Slots are independent, so nothing is "used up" — this is the
          gambler's fallacy, and memorylessness is precisely what forbids it.
      - text: >
          The analogy fails: only the exponential is memoryless, so no discrete
          waiting law matches fresh start
        feedback: >
          The geometric is memoryless on the lattice, which is why Bernoulli
          slots converge to a Poisson process as the slot length shrinks.
      - text: >
          The further wait is geometric but with mean $10 - 20 < 0$, so the
          model has broken down
        feedback: >
          Nothing is subtracted from the mean; the count restarts at $10$ slots
          expected, and the negative value comes from applying a formula that
          the memoryless property does not contain.
    rubric:
      - >
        States the further wait as geometric with the *same* $p$ and mean
        $1/p = 10$ slots.
      - >
        Names memorylessness as the property the geometric and the exponential
        share, and says the elapsed slots are irrelevant.
    targets:
      - quant-processes.poisson.fresh-start
      - quant-probability.discrete.memoryless-geometric
    connects:
      - "quant-probability.discrete.memoryless-geometric ~ quant-processes.poisson.fresh-start"

  # --- merging streams --------------------------------------------------------------

  - id: qpois-superposition-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $N_1$ and $N_2$ be independent Poisson processes of rates
      $\lambda_1$ and $\lambda_2$. Prove that $N = N_1 + N_2$ is a Poisson
      process of rate $\lambda_1 + \lambda_2$, and show by an explicit
      counterexample that independence of the components cannot be dropped
      even when the rates are unchanged.
    answer: >
      Check the three axioms. Increments of $N$ over disjoint intervals are
      sums of the corresponding increments of $N_1$ and $N_2$; each component
      has independent increments and the two components are independent of one
      another, so the joint collection over disjoint intervals is independent
      and independence passes to the sums. Stationarity passes across the same
      way, since each component's increment law depends only on the window
      length. For the count law, condition on how the total splits:
      $\Pr(N(t) = k) = \sum_{j=0}^{k} \Pr(N_1(t) = j)\Pr(N_2(t) = k - j)$ by
      independence, and substituting the two Poisson pmfs and factoring out
      $e^{-(\lambda_1 + \lambda_2)t}/k!$ leaves
      $\sum_{j} \binom{k}{j} (\lambda_1 t)^{j}(\lambda_2 t)^{k-j}$, which the
      binomial theorem collapses to $((\lambda_1 + \lambda_2)t)^{k}$ — exactly
      the $\operatorname{Poisson}((\lambda_1 + \lambda_2)t)$ pmf. For the
      counterexample, take a single rate-$\lambda$ process and set
      $N_1 = N_2 = N_0$, so the merged process lists every arrival twice. Its
      mean rate is $2\lambda$, matching the theorem's arithmetic, but the
      arrivals land in coincident pairs, so $N(t) = 2N_0(t)$ is always even,
      $\operatorname{Var}(N(t)) = 4\lambda t$ is twice the mean $2\lambda t$,
      and orderliness fails outright. Rates adding is a conclusion, never the
      hypothesis.
    rubric:
      - >
        Verifies all three axioms, not only the count law, and says where the
        components' mutual independence is used in each.
      - >
        Computes the convolution and identifies the binomial theorem step that
        collapses the sum.
      - >
        Gives a concrete dependent pair with the right total rate and shows
        it fails — coincident arrivals, or variance above the mean.
    targets:
      - quant-processes.poisson.superposition
    exercises:
      - quant-probability.discrete.poisson

  - id: qpois-superposition-02
    kind: work
    difficulty: standard
    statement: >
      Three independent alerting systems fire as Poisson processes at $1.5$,
      $2.5$ and $6$ alerts per hour. What is the probability that no alert of
      any kind arrives in the next $15$ minutes? Use $e^{-2.5} = 0.082085$.
    answer: >
      $0.0821$. Superposition merges the three independent streams into a
      single Poisson process whose rate is the sum,
      $\lambda = 1.5 + 2.5 + 6 = 10$ per hour, so the merged count over a
      window of length $t = 0.25$ hour is $\operatorname{Poisson}(2.5)$ and
      $\Pr(N = 0) = e^{-2.5} = 0.0821$. The same number arrives from the other
      direction, which is a useful check: an empty merged window means all
      three components are empty, and by independence
      $e^{-1.5(0.25)}e^{-2.5(0.25)}e^{-6(0.25)} = e^{-2.5}$. The trap is
      averaging rather than summing — using $\lambda = 10/3$ per hour treats
      the three feeds as one feed observed three ways and badly understates how
      fast the merged stream fires.
    expects: "0.0821"
    tolerance: 0.0005
    rubric:
      - >
        Adds the three rates to $10$ per hour rather than averaging them.
      - >
        Converts $15$ minutes to $0.25$ hour before forming $\lambda t = 2.5$.
    targets:
      - quant-processes.poisson.superposition
    exercises:
      - quant-probability.discrete.poisson

  - id: qpois-superposition-03
    kind: work
    difficulty: demanding
    statement: >
      A desk sees two independent Poisson order streams at $4$ and $6$ orders
      per minute. What is the probability that the merged flow delivers exactly
      $2$ orders in the first $30$ seconds and exactly $3$ in the following
      $30$ seconds? Use $e^{-10} = 0.000045400$.
    answer: >
      $0.011823$. Merge first: the streams are independent, so the combined
      flow is Poisson at $\lambda = 4 + 6 = 10$ per minute, and each half-minute
      window has mean $\lambda t = 5$. The two windows are disjoint, so their
      counts are independent and the probabilities multiply:
      $\Pr(N_1 = 2)\Pr(N_2 = 3) = \left(e^{-5}\frac{5^{2}}{2!}\right)
      \left(e^{-5}\frac{5^{3}}{3!}\right) = e^{-10}\frac{25}{2}\cdot
      \frac{125}{6} = e^{-10}\frac{3125}{12} = 260.4167 \cdot 0.000045400 =
      0.011823$. Collecting the two exponentials into $e^{-10}$ before
      multiplying is what keeps the arithmetic short. The tempting shortcut —
      "$5$ orders in one minute", $\Pr(N = 5) = e^{-10}10^{5}/5! =
      0.0378$ — answers a different and larger question, since it allows every
      split of those five orders across the two halves rather than the single
      split $2$ then $3$.
    expects: "0.011823"
    tolerance: 0.00005
    rubric:
      - >
        Sums the rates once, then treats the merged process as an ordinary
        Poisson process on each window.
      - >
        Multiplies the two disjoint-window probabilities rather than answering
        the aggregated "$5$ in a minute" question.
    targets:
      - quant-processes.poisson.superposition
    exercises:
      - quant-probability.discrete.poisson

  # --- splitting a stream ------------------------------------------------------------

  - id: qpois-thinning-01
    kind: justify
    difficulty: demanding
    statement: >
      A rate-$\lambda$ Poisson process is labelled arrival by arrival: each
      arrival is type 1 with probability $p$ and type 2 with probability
      $1 - p$, independently of the other labels and of the arrival times.
      Prove that the type-1 and type-2 streams are Poisson processes of rates
      $\lambda p$ and $\lambda(1-p)$ and that they are independent, then say
      exactly which hypothesis fails if instead a *fixed* number $n$ of
      arrivals is labelled the same way.
    answer: >
      Work with the joint count over a window of length $t$ and write
      $m = \lambda t$. Conditional on the total $N(t) = j + k$, the labels are
      independent coin flips, so the number of type-1 arrivals is
      $\operatorname{Binomial}(j+k, p)$ and
      $\Pr(N_1 = j, N_2 = k) = \Pr(N(t) = j+k)\binom{j+k}{j}p^{j}(1-p)^{k}$.
      Substituting $\Pr(N(t) = j+k) = e^{-m}m^{j+k}/(j+k)!$, the factorial in
      the binomial coefficient cancels the one in the pmf, leaving
      $e^{-m}(mp)^{j}(m(1-p))^{k}/(j!\,k!)$. Now split the exponential as
      $e^{-mp}e^{-m(1-p)}$ and the expression factors exactly into
      $\left(e^{-mp}(mp)^{j}/j!\right)\left(e^{-m(1-p)}(m(1-p))^{k}/k!\right)$
      — the product of two Poisson pmfs with means $\lambda p t$ and
      $\lambda(1-p)t$. Factoring for every $(j,k)$ is simultaneously the
      marginal claim and the independence claim. Independent and stationary
      increments carry over to each labelled stream because the labels are iid
      and independent of the times, so each is a Poisson process at its rate.
      With a fixed total $n$ the factorisation is impossible: $N_1 + N_2 = n$
      identically, so $N_2 = n - N_1$ is a deterministic function of $N_1$,
      the two counts are perfectly negatively dependent, and each is binomial
      rather than Poisson. The randomness of the Poisson total is what buys the
      independence, and dropping it is the only thing that has changed.
    rubric:
      - >
        Conditions on the total, uses the binomial labelling, and shows the
        joint pmf factors — not just that each marginal is Poisson.
      - >
        Cancels $(j+k)!$ against the binomial coefficient and splits
        $e^{-m}$ into $e^{-mp}e^{-m(1-p)}$.
      - >
        Says that a fixed total forces $N_2 = n - N_1$, so the counts are
        binomial and perfectly negatively dependent.
    targets:
      - quant-processes.poisson.thinning
    exercises:
      - quant-probability.discrete.binomial

  - id: qpois-thinning-02
    kind: work
    difficulty: demanding
    statement: >
      Prints arrive on a venue as a Poisson process of rate $90$ per hour, and
      each print is independently a block print with probability $1/6$. In a
      given hour, exactly $20$ block prints are observed. What is the expected
      number of non-block prints in that same hour?
    answer: >
      $75$. Thinning splits the venue into two independent Poisson processes:
      block prints at $90 \cdot 1/6 = 15$ per hour and non-block prints at
      $90 \cdot 5/6 = 75$ per hour. Independence is the whole content of the
      question — the observed block count of $20$ carries no information about
      the non-block count, so the conditional expectation equals the
      unconditional one, $\mathbb{E}[N_2(1)] = 75$ prints. The trap is treating
      the hourly total as a fixed budget: if exactly $90$ prints had been
      guaranteed, the answer would be $90 - 20 = 70$, and the two counts would
      be perfectly negatively dependent. The total here is
      $\operatorname{Poisson}(90)$ and therefore random, which is precisely
      what makes the split independent. A second trap reads $20$ as evidence
      that the hour is running heavy and revises $75$ upward; that would be an
      inference about $\lambda$, not a calculation inside the stated model.
    expects: "75"
    rubric:
      - >
        Computes the non-block rate as $\lambda(1-p) = 75$ per hour rather than
        subtracting from a total.
      - >
        States that the two thinned counts are independent, so conditioning on
        the block count changes nothing.
    targets:
      - quant-processes.poisson.thinning
    exercises:
      - quant-probability.foundations.independence-events

  - id: qpois-thinning-03
    kind: work
    difficulty: standard
    statement: >
      Support tickets arrive as a Poisson process of rate $36$ per hour, and
      each is independently urgent with probability $0.15$. What is the
      probability of exactly one urgent ticket in a $20$-minute window? Use
      $e^{-1.8} = 0.165299$.
    answer: >
      $0.2975$. Scale the rate before doing anything else: urgent tickets form
      a Poisson process of rate $\lambda p = 36 \cdot 0.15 = 5.4$ per hour. The
      window is $t = 1/3$ hour, so the urgent count is
      $\operatorname{Poisson}(5.4/3) = \operatorname{Poisson}(1.8)$ and
      $\Pr(N = 1) = e^{-1.8}(1.8)^{1}/1! = 1.8 \cdot 0.165299 = 0.2975$. Two
      slips are common. Using the unscaled rate gives a mean of $12$ and a
      probability near $0.00007$, wildly wrong. Computing with the full stream
      and then multiplying by $p$ — as in $\Pr(N = 1 \text{ overall}) \cdot
      0.15$ — is not the same event at all; thinning says to scale the rate,
      not the answer.
    expects: "0.2975"
    tolerance: 0.0005
    rubric:
      - >
        Scales the rate to $\lambda p = 5.4$ per hour before forming the mean.
      - >
        Converts the $20$-minute window to $1/3$ hour, giving $\lambda p t =
        1.8$.
    targets:
      - quant-processes.poisson.thinning
    exercises:
      - quant-probability.discrete.poisson

  - id: qpois-thinning-example-01
    kind: work
    difficulty: demanding
    statement: >
      A tape prints at $480$ per hour and each print is independently a buy
      with probability $0.25$. Over the next two minutes, exactly five sell
      prints hit the tape. Given that, what is the probability that no buy
      print hits the tape in those same two minutes? Use
      $e^{-4} = 0.018316$.
    answer: >
      $0.018316$. The conditioning is a decoy. Thinning makes the buy stream
      and the sell stream independent Poisson processes, so the observed five
      sells tell you nothing about the buys and the conditional probability
      equals the unconditional one. Buys run at $480 \cdot 0.25 = 120$ per hour
      $= 2$ per minute, so the two-minute buy count is
      $\operatorname{Poisson}(4)$ and $\Pr(N = 0) = e^{-4} = 0.018316$. The
      trap is to reason that five sells in two minutes is a busy patch, so buys
      are likely too — true of most real order flow, and false in this model,
      where the total is Poisson and the split is by independent coin flip. If
      the setup instead fixed the *total* number of prints in the window, the
      counts would be dependent and the answer would change: with a total of
      exactly five, all of them sells, the chance of no buy would be $1$.
    expects: "0.018316"
    tolerance: 0.00005
    rubric:
      - >
        Drops the sell count as irrelevant, on the grounds that thinned streams
        are independent.
      - >
        Uses the scaled buy rate of $2$ per minute, so the two-minute mean is
        $4$.
    targets:
      - quant-processes.poisson.thinning-example
    exercises:
      - quant-probability.foundations.independence-events

  - id: qpois-thinning-example-02
    kind: work
    difficulty: standard
    statement: >
      Requests for quote reach a dealer as a Poisson process of rate $150$ per
      hour, and each comes independently from a tier-one client with
      probability $0.28$. What is the tier-one arrival rate, in requests per
      hour?
    answer: >
      $42$ per hour. Thinning by an independent per-arrival label scales the
      rate by the label probability: $\lambda p = 150 \cdot 0.28 = 42$, and the
      tier-one requests then form a Poisson process in their own right, so
      every downstream question about them is an ordinary single-rate Poisson
      calculation at $42$ per hour. The remaining requests form an independent
      Poisson process at $150 \cdot 0.72 = 108$ per hour, and the two rates add
      back to $150$ as they must. Note that the mean wait for a tier-one
      request is $1/42$ hour, about $86$ seconds, regardless of how many
      other-tier requests arrive meanwhile — the streams do not queue behind
      one another. The one hypothesis worth flagging aloud in an interview is
      that the tier of a request must be independent of its timing; if
      tier-one clients cluster around the open, the split is not Poisson and
      the shortcut fails.
    expects: "42"
    rubric:
      - >
        Multiplies the rate by the label probability rather than the window
        length or the complement.
      - >
        Notes that the two thinned rates add back to the original.
    targets:
      - quant-processes.poisson.thinning-example

  # --- racing clocks -------------------------------------------------------------------

  - id: qpois-rate-race-01
    kind: work
    difficulty: demanding
    statement: >
      Buy orders and sell orders arrive as independent Poisson processes at $8$
      and $12$ per minute. What is the expected number of buy orders that
      arrive before the third sell order?
    answer: >
      $2$. Merge and then thin. Superposition makes the combined flow Poisson
      at $8 + 12 = 20$ per minute, and thinning makes each merged arrival
      independently a sell with probability
      $12/20 = 0.6$, independently of when it occurs. So the merged stream is a
      sequence of independent trials, and the buys preceding the first sell
      form a geometric count on $\{0, 1, 2, \dots\}$ with success probability
      $0.6$ and mean $0.4/0.6 = 8/12 = 2/3$. By the fresh-start property the
      same race restarts after each sell, so the buys before the second sell
      and before the third have the same mean, and linearity of expectation
      gives $3 \cdot 2/3 = 2$. Note the rates enter only through their ratio
      $\lambda_{\text{buy}}/\lambda_{\text{sell}}$, so doubling both changes
      nothing. Inverting that ratio to $12/8$ and reporting $4.5$ is the
      standard slip — it would say a faster buy stream produces *fewer* buys
      before the third sell, which is backwards.
    expects: "2"
    rubric:
      - >
        Reduces the race to independent per-arrival trials with sell
        probability $\lambda_2/(\lambda_1 + \lambda_2)$.
      - >
        Uses the geometric mean $\lambda_1/\lambda_2$ per sell and adds three
        of them by linearity, rather than inverting the ratio.
    targets:
      - quant-processes.poisson.rate-race
    exercises:
      - quant-probability.continuous.min-exponentials

  - id: qpois-rate-race-02
    kind: work
    difficulty: standard
    statement: >
      Two independent news wires publish as Poisson processes at $15$ and $25$
      items per hour. What is the probability that the next item to appear on
      either wire comes from the slower one?
    answer: >
      $3/8 = 0.375$. The winner of a race between independent Poisson clocks is
      type $i$ with probability $\lambda_i / \sum_j \lambda_j$, so the slower
      wire wins with probability $15/(15 + 25) = 15/40 = 3/8$. Equivalently,
      the next item from each wire is an independent exponential and
      $\Pr(\operatorname{Exp}(15) < \operatorname{Exp}(25)) =
      15/(15+25)$. Two features are worth stating out loud. The winning time,
      $\operatorname{Exp}(40)$ with mean $1.5$ minutes, is independent of the
      winner's identity, so no amount of waiting shifts the odds toward either
      wire. And the answer does not depend on when the wires last published,
      because each clock restarts memorylessly. The trap is answering
      $15/25 = 0.6$, a ratio of rates rather than a share of the total, which
      is not even guaranteed to be a probability.
    expects: "3/8"
    rubric:
      - >
        Uses $\lambda_i/(\lambda_1 + \lambda_2)$ rather than the ratio
        $\lambda_1/\lambda_2$.
      - >
        Says the winner's identity is independent of the winning time.
    targets:
      - quant-processes.poisson.rate-race

  - id: qpois-rate-race-03
    kind: decide
    difficulty: standard
    statement: >
      Two dealers stream quotes independently as Poisson processes, dealer A at
      $10$ per hour and dealer B at $30$ per hour. A candidate reports the mean
      number of A quotes arriving before B's first quote as
      $30/10 = 3$. What is the verdict?
    answer: >
      Wrong: the mean is $\lambda_A/\lambda_B = 10/30 = 1/3$, and the candidate
      has the ratio upside down. Each merged arrival is independently from A
      with probability $10/40 = 0.25$ and from B with probability $0.75$, so
      the A quotes preceding B's first form a geometric count on
      $\{0, 1, 2, \dots\}$ with success probability $0.75$ and mean
      $0.25/0.75 = 1/3$. The direction is the fastest check available: B is
      three times faster than A, so B's first quote typically lands before any
      A quote at all, and a mean well below $1$ is what that has to look like.
      The candidate's $3$ answers the mirrored question — how many B quotes
      precede A's first — and swapping the two rates in a race is the single
      most common slip here. Note also that $1/3$ is not a probability: it is
      the mean of an unbounded count, and $\Pr(\text{no A quote first}) = 0.75$
      is the separate quantity people sometimes conflate with it.
    choices:
      - text: >
          Wrong — the mean is $\lambda_A/\lambda_B = 1/3$; the candidate
          inverted the ratio
        correct: true
        feedback: >
          The geometric count of A quotes before B's first has mean
          $\lambda_A/\lambda_B$; with B three times faster, a value below $1$
          is the only sensible direction.
      - text: >
          Right — $\lambda_B/\lambda_A$ is the mean of the geometric count
        feedback: >
          That expression says a *faster* B produces *more* A quotes before it
          fires, which reverses the mechanism; it answers the mirrored
          question instead.
      - text: >
          Wrong — the mean is $\lambda_A/(\lambda_A + \lambda_B) = 0.25$
        feedback: >
          $0.25$ is the probability that a single merged arrival is from A, not
          the mean number of A quotes before B's first.
      - text: >
          Right, but only over a long enough horizon for both dealers to quote
        feedback: >
          The race has no warm-up: by fresh start the per-arrival odds are
          $0.25$ from the very first instant, and the mean is $1/3$ whatever
          the horizon.
    rubric:
      - >
        Corrects the ratio to $\lambda_A/\lambda_B$ and gives $1/3$.
      - >
        Checks the direction — the faster clock should win first, so the count
        must be small.
    targets:
      - quant-processes.poisson.rate-race

  # --- where the arrivals sit, given how many ---------------------------------------------

  - id: qpois-conditional-uniformity-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $N$ be a Poisson process of rate $\lambda$. Prove that conditional on
      $N(t) = n$, the ordered arrival times $(T_1, \dots, T_n)$ have the law of
      the order statistics of $n$ iid $\operatorname{Uniform}(0,t)$ variables.
      Explain where $\lambda$ disappears, and why the conclusion would fail for
      a non-homogeneous process.
    answer: >
      A slot argument gives the whole result. Cut $[0,t]$ into $m$ equal
      subintervals of length $t/m$. By stationarity every slot carries the same
      chance of holding an arrival, and by orderliness the chance of two in one
      slot is negligible as $m$ grows; by independent increments the slots are
      independent. Conditional on exactly $n$ of the $m$ slots being occupied,
      all $\binom{m}{n}$ choices of which $n$ are equally likely, because they
      have identical probability $p^{n}(1-p)^{m-n}$ and the common factor
      cancels in the conditioning — and that cancellation is exactly where
      $\lambda$ leaves: it sets $p \approx \lambda t/m$, hence how many slots
      are occupied, but never which ones. Letting $m \to \infty$ turns uniform
      choice among slots into $n$ iid uniform points on $[0,t]$, and reading
      them in increasing order gives the order statistics. The density route
      confirms it: the joint density of $(T_1, \dots, T_n)$ restricted to
      $N(t) = n$ is $\lambda^{n}e^{-\lambda t}$ on
      $0 < t_1 < \cdots < t_n < t$, and dividing by
      $\Pr(N(t) = n) = e^{-\lambda t}(\lambda t)^{n}/n!$ gives the constant
      $n!/t^{n}$ — free of $\lambda$, and precisely the order-statistic density
      of $n$ uniforms. For a non-homogeneous process the slots are no longer
      equally likely: the chance a given arrival lands in $[a,b]$ is
      $(m(b) - m(a))/m(t)$, so the points are iid with density
      $\lambda(u)/m(t)$ rather than uniform. Constant rate is what makes the
      conditional law flat.
    rubric:
      - >
        Runs the slot argument with all three axioms named — stationarity for
        equal slot probabilities, independence for the product form,
        orderliness for at most one arrival per slot.
      - >
        Identifies the step at which $\lambda$ cancels, and says it governs how
        many arrivals occur rather than where they sit.
      - >
        Says that a varying rate replaces the uniform law by the density
        $\lambda(u)/m(t)$, so the conclusion is special to a constant rate.
    targets:
      - quant-processes.poisson.conditional-uniformity
    exercises:
      - quant-probability.random-variables.order-statistics
      - quant-probability.continuous.uniform

  - id: qpois-conditional-uniformity-02
    kind: work
    difficulty: demanding
    statement: >
      Trades arrive as a Poisson process of rate $20$ per hour. Given that
      exactly $6$ trades occurred in a particular hour, what is the probability
      that exactly $2$ of them fell in the first $20$ minutes of that hour?
      Give an exact fraction.
    answer: >
      $80/243 \approx 0.3292$. Given $N(60\text{ min}) = 6$, the six times are
      six iid uniform points on the hour, so each falls in the first $20$
      minutes independently with probability $s/t = 20/60 = 1/3$ — and the rate
      $20$ per hour drops out of the conditional law completely, appearing
      nowhere in the answer. The count in the subinterval is therefore
      $\operatorname{Binomial}(6, 1/3)$, giving
      $\binom{6}{2}(1/3)^{2}(2/3)^{4} = 15 \cdot \frac{1}{9} \cdot
      \frac{16}{81} = \frac{240}{729} = \frac{80}{243}$. Two wrong routes are
      worth naming. Treating the first $20$ minutes as an unconditional
      $\operatorname{Poisson}(20/3)$ window and reporting
      $\Pr(N = 2) = e^{-20/3}(20/3)^{2}/2! = 0.0283$ ignores the conditioning
      entirely. And spreading the six trades evenly — "two per twenty minutes,
      so the probability is $1$" — confuses the conditional mean, which is
      indeed $6/3 = 2$, with certainty.
    expects: "80/243"
    tolerance: 0.0005
    rubric:
      - >
        Converts the conditioning into $\operatorname{Binomial}(n, s/t)$ rather
        than using an unconditional Poisson count.
      - >
        Notes that $\lambda$ cancels, so the rate never enters the arithmetic.
    targets:
      - quant-processes.poisson.conditional-uniformity
    exercises:
      - quant-probability.discrete.binomial

  - id: qpois-conditional-uniformity-03
    kind: work
    difficulty: standard
    statement: >
      Deliveries reach a depot as a Poisson process, and exactly $7$ arrive
      during an $8$-hour shift. What is the expected arrival time of the fifth
      delivery, measured in hours from the start of the shift?
    answer: >
      $5$ hours. Conditional on $N(t) = n$, the arrival times are the order
      statistics of $n$ uniform points on $[0,t]$, and those $n$ points cut the
      shift into $n+1$ exchangeable gaps that sum to $t$. By symmetry each gap
      has mean $t/(n+1)$, and $T_k$ is the sum of the first $k$ of them, so
      $\mathbb{E}[T_k \mid N(t) = n] = kt/(n+1)$. Here
      $k = 5$, $n = 7$ and $t = 8$, giving $5 \cdot 8/8 = 5$ hours. The rate is
      not given and is not needed, which is the point: once the count is known,
      the rate has done its work. The frequent slip is dividing by $n$ instead
      of $n+1$ — that would put the seventh delivery at exactly $8$ hours, on
      the boundary, whereas the correct $7 \cdot 8/8 = 7$ hours leaves the
      expected final gap of $1$ hour that symmetry demands.
    expects: "5"
    rubric:
      - >
        Uses $\mathbb{E}[T_k \mid N(t) = n] = kt/(n+1)$, dividing by $n+1$
        rather than $n$.
      - >
        Observes that the answer does not need $\lambda$.
    targets:
      - quant-processes.poisson.conditional-uniformity
    exercises:
      - quant-probability.continuous.uniform

  - id: qpois-uniformity-waiting-01
    kind: work
    difficulty: demanding
    statement: >
      Visitors enter an exhibition as a Poisson process of rate $30$ per hour
      and each stays until the doors close, exactly $3$ hours from now. What is
      the expected total number of visitor-hours accumulated inside by closing
      time?
    answer: >
      $135$ visitor-hours. The quantity is
      $\sum_i (t - T_i)$ over the visitors arriving in $[0,t]$, and the clean
      route never conditions on how many arrive. Each instant $s$ contributes
      $\lambda\,ds$ expected arrivals, and a visitor arriving at $s$ accrues
      $t - s$ hours before closing, so the expected total is
      $\int_{0}^{t} \lambda(t - s)\,ds = \lambda t^{2}/2 =
      30 \cdot 9/2 = 135$. The conditional route agrees: given $N(t) = n$, the
      arrival times are uniform, so the total is $n$ times the mean residual
      $t/2$, and averaging over $N(t)$ with mean $\lambda t = 90$ gives
      $90 \cdot 1.5 = 135$. The traps sit on either side of the factor of two:
      $\lambda t^{2} = 270$ forgets that a visitor arriving at a uniform time
      accrues only half the window on average, and $\lambda t = 90$ reports the
      expected *number* of visitors rather than their accumulated time, which
      is not even in the right units.
    expects: "135"
    rubric:
      - >
        Integrates $\lambda(t-s)$ over the window, or equivalently multiplies
        the mean count by the mean residual $t/2$.
      - >
        Keeps the factor of $1/2$, and reports visitor-hours rather than a
        visitor count.
    targets:
      - quant-processes.poisson.uniformity-waiting
    exercises:
      - quant-probability.expectation.linearity

  - id: qpois-uniformity-waiting-02
    kind: work
    difficulty: standard
    statement: >
      Exactly $9$ parcels arrive at a sorting bay during a $4$-hour window. A
      handler has been on shift since the window opened and waits for each
      parcel in turn. What is the expected total of the nine waits, in
      parcel-hours, each measured from the start of the window to that
      parcel's arrival?
    answer: >
      $18$ parcel-hours. Given $N(t) = n$, the arrival times are uniform on the
      window, so $\mathbb{E}[T_k \mid N(t) = n] = kt/(n+1)$ and the total
      $\sum_{k=1}^{n} \mathbb{E}[T_k]$ is
      $\frac{t}{n+1} \cdot \frac{n(n+1)}{2} = \frac{nt}{2}$ — the arithmetic
      series collapses and the $n+1$ cancels. With $n = 9$ and $t = 4$ that is
      $9 \cdot 4/2 = 18$. Two remarks make it memorable. The rate is neither
      given nor needed, since conditioning on the count strips it out. And the
      same $nt/2$ is what $n$ points at their average position $t/2$ would
      give, which is why the answer looks like a symmetry statement rather than
      a computation. Do not confuse it with the unconditional aggregate
      $\lambda t^{2}/2$, which averages over a random count instead of using
      the $9$ you were handed.
    expects: "18"
    rubric:
      - >
        Sums the order-statistic means over $k$ and simplifies to $nt/2$.
      - >
        Uses the given count $n = 9$ rather than the unconditional
        $\lambda t^{2}/2$.
    targets:
      - quant-processes.poisson.uniformity-waiting

  # --- showing up at a random moment -------------------------------------------------------

  - id: qpois-inspection-paradox-01
    kind: work
    difficulty: demanding
    statement: >
      Shuttles run as a Poisson process of rate $6$ per hour and have been
      running since long before you arrive. You turn up at a fixed clock time.
      What is the probability that the gap between the shuttle before you and
      the shuttle after you exceeds $30$ minutes? Use $e^{-3} = 0.049787$.
    answer: >
      $0.1991$. The gap you land inside is the backward recurrence time plus
      the forward wait. Both are $\operatorname{Exp}(6)$ and independent — the
      forward one by fresh start, the backward one because the process run in
      reverse from a fixed time is equally memoryless — so the straddling gap
      is $\operatorname{Gamma}(2, 6)$ with mean $2/\lambda = 20$ minutes. Its
      tail comes free from the count-time duality: a sum of two independent
      $\operatorname{Exp}(\lambda)$ variables exceeds $x$ exactly when a
      rate-$\lambda$ window of length $x$ holds at most one arrival, so
      $\Pr(\text{gap} > x) = \Pr(N(x) \le 1) = e^{-\lambda x}(1 + \lambda x)$. With $x = 0.5$ hour, $\lambda x = 3$ and
      the answer is $e^{-3}(1 + 3) = 4 \cdot 0.049787 = 0.1991$. The trap is
      answering with an ordinary gap: $\Pr(X > 0.5) = e^{-3} = 0.0498$ is four
      times smaller, and using it silently assumes the gap you sampled by
      landing in it is a typical gap. It is not — a fixed instant falls in a
      long gap in proportion to its length.
    expects: "0.1991"
    tolerance: 0.0005
    rubric:
      - >
        Recognises the straddling gap as backward plus forward, both
        $\operatorname{Exp}(\lambda)$ and independent, hence
        $\operatorname{Gamma}(2,\lambda)$.
      - >
        Uses $\Pr(N(x) \le 1) = e^{-\lambda x}(1 + \lambda x)$ rather than the
        single-gap tail $e^{-\lambda x}$.
    targets:
      - quant-processes.poisson.inspection-paradox
    exercises:
      - quant-probability.discrete.poisson

  - id: qpois-inspection-paradox-02
    kind: work
    difficulty: standard
    statement: >
      Trams arrive as a Poisson process averaging $9$ per hour and have been
      running all day. You reach the stop at a moment unrelated to the
      timetable. What is the expected length, in minutes, of the gap between
      the last tram before you and the first tram after you?
    answer: >
      $13.3333$ minutes. The gap you land in splits at your arrival into a
      backward piece and a forward piece, each $\operatorname{Exp}(9)$ with
      mean $1/\lambda = 60/9 = 6.6667$ minutes, so the whole gap has mean
      $2/\lambda = 120/9 = 13.3333$ minutes. Contrast that with the average gap
      between consecutive trams, which is $1/\lambda = 6.6667$ minutes: the gap
      you happen to occupy averages exactly twice the typical gap. Nothing has
      gone wrong — a fixed instant is more likely to fall inside a long gap
      than a short one, in proportion to length, so sampling by time
      systematically over-selects the long ones. The wait you actually
      experience is the forward piece alone, $6.6667$ minutes, which is the
      full mean gap rather than half of it; answering $3.3333$ by halving the
      average gap is the classic error this example exists to kill.
    expects: "13.3333"
    tolerance: 0.0005
    rubric:
      - >
        Splits the straddling gap into two independent
        $\operatorname{Exp}(\lambda)$ pieces and reports $2/\lambda$.
      - >
        Distinguishes the straddling gap $2/\lambda$ from the forward wait
        $1/\lambda$ and from the typical gap $1/\lambda$.
    targets:
      - quant-processes.poisson.inspection-paradox

  - id: qpois-inspection-paradox-03
    kind: decide
    difficulty: standard
    statement: >
      Buses on a route arrive as a Poisson process, one every $12$ minutes on
      average. A candidate says: "I turn up at a random moment, so on average I
      land in the middle of a gap and wait about $6$ minutes." What is the
      verdict?
    answer: >
      Wrong: the expected wait is the full $12$ minutes. The reasoning fails
      twice over, and the two failures do not cancel. First, the gap you land
      in is not a typical gap: sampling by time favours long gaps in proportion
      to their length, so the straddling gap averages
      $2/\lambda = 24$ minutes, not $12$. Second, you do land in the middle of
      it on average, and half of $24$ is $12$. The direct route is shorter:
      fresh start says the forward wait from any fixed clock time is a brand
      new $\operatorname{Exp}(\lambda)$ variable with mean $1/\lambda = 12$
      minutes, whatever has happened before. The candidate's $6$ minutes would
      be right for a timetable with exact $12$-minute spacing, where the gap
      really is $12$ and a random arrival really does wait half of it —
      variability in the gaps is the entire difference between the two answers.
    choices:
      - text: >
          Wrong — the expected wait is $12$ minutes, the full mean gap, because
          the forward wait is a fresh $\operatorname{Exp}(\lambda)$ draw
        correct: true
        feedback: >
          Memorylessness gives the forward wait mean $1/\lambda$ from any fixed
          instant; the "half a gap" picture is repaired by the straddling gap
          averaging $24$ minutes, not $12$.
      - text: >
          Right — a random arrival lands uniformly inside a gap, so the wait is
          half the mean gap
        feedback: >
          The uniform-position step is fine; what fails is using $12$ minutes
          for the gap you landed in, which averages $24$ because time-sampling
          over-selects long gaps.
      - text: >
          Wrong — the expected wait is $24$ minutes, the mean of the gap you
          land in
        feedback: >
          $24$ minutes is the whole straddling gap, backward plus forward; the
          wait is only the forward half of it.
      - text: >
          Right for an exact $12$-minute timetable and for a Poisson stream
          alike, since both average one bus every $12$ minutes
        feedback: >
          Matching mean gaps is not enough: the timetable has zero gap variance
          and gives a $6$-minute wait, the Poisson stream gives $12$, and the
          variance is exactly the difference.
    rubric:
      - >
        Gives $1/\lambda = 12$ minutes and justifies it by the fresh-start
        property rather than by halving anything.
      - >
        Explains why the "half a gap" argument fails — the sampled gap averages
        $2/\lambda$, not $1/\lambda$.
    targets:
      - quant-processes.poisson.inspection-paradox

  - id: qpois-inspection-paradox-04
    kind: work
    difficulty: demanding
    statement: >
      Trams run as a Poisson process of rate $9$ per hour and have been running
      all day. You reach the stop at a fixed clock time and no tram has come in
      the $4$ minutes since. What is now the expected total length, in minutes,
      of the gap you are standing inside?
    answer: >
      $17.3333$ minutes. Decompose the gap into three stretches: the time back
      from your arrival to the previous tram, the $4$ minutes you have observed,
      and the remaining forward wait. The backward piece is
      $\operatorname{Exp}(9)$ with mean $60/9 = 6.6667$ minutes, and it is
      determined by the past, so the four empty minutes that followed your
      arrival — an event in the future of that instant — leave it untouched by
      independent increments. The remaining wait is a fresh
      $\operatorname{Exp}(9)$ by memorylessness, mean $6.6667$ minutes. The
      middle stretch is the known $4$. Adding, $6.6667 + 4 + 6.6667 =
      17.3333$ minutes. The instructive part is that waiting has made the gap
      you occupy *longer* in expectation than the $13.3333$ minutes it averaged
      when you arrived, and by exactly the $4$ minutes observed: standing there
      is itself a length-biasing act. Answering $13.3333 - 4 = 9.3333$ inverts
      the effect, and answering $13.3333$ ignores the information you have
      gained.
    expects: "17.3333"
    tolerance: 0.0005
    rubric:
      - >
        Splits the gap into backward, observed and remaining pieces rather than
        adjusting a single exponential.
      - >
        Keeps the backward piece at $1/\lambda$ — the later silence is in its
        future — and restarts the forward piece at $1/\lambda$.
    targets:
      - quant-processes.poisson.inspection-paradox
    exercises:
      - quant-probability.continuous.memoryless-exponential

  # --- sampling by time rather than by event -----------------------------------------------

  - id: qpois-length-bias-01
    kind: work
    difficulty: demanding
    statement: >
      A shuttle's gaps are iid, equal to $6$ minutes with probability $0.8$ and
      to $36$ minutes with probability $0.2$. A passenger turns up at a moment
      unrelated to the shuttles. What is the expected length, in minutes, of
      the gap the passenger lands inside?
    answer: >
      $24$ minutes. Sampling an interval by hitting it with a point weights it
      in proportion to its own length, so the gap you land in has the
      size-biased law $xf(x)/\mathbb{E}[X]$ and mean
      $\mathbb{E}[X^{2}]/\mathbb{E}[X]$. Here
      $\mathbb{E}[X] = 0.8(6) + 0.2(36) = 12$ and
      $\mathbb{E}[X^{2}] = 0.8(36) + 0.2(1296) = 28.8 + 259.2 = 288$, so the
      answer is $288/12 = 24$ minutes. The decomposition
      $\mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$ says the same
      thing: $\operatorname{Var}(X) = 288 - 144 = 144$, and
      $12 + 144/12 = 24$. Two readings are worth keeping. The listed gaps
      average $12$ minutes but only $20$ percent of them are long, yet those
      long ones cover $0.2(36)/12 = 60$ percent of the timeline, which is why
      the passenger usually lands in one. And the doubling here is a
      coincidence of these numbers — it holds because
      $\operatorname{Var}(X) = \mathbb{E}[X]^{2}$ happens to be true, exactly
      as it is for an exponential; a different pair of gap lengths with the same
      mean would give a different multiple.
    expects: "24"
    rubric:
      - >
        Uses the size-biased mean $\mathbb{E}[X^{2}]/\mathbb{E}[X]$ rather than
        $\mathbb{E}[X]$.
      - >
        Computes $\mathbb{E}[X^{2}]$ from the two-point law rather than
        squaring the mean.
    targets:
      - quant-processes.poisson.length-bias
    exercises:
      - quant-probability.expectation.lotus

  - id: qpois-length-bias-02
    kind: work
    difficulty: standard
    statement: >
      A school runs $60$ classes of $10$ students and $20$ classes of $40$
      students. A student is picked uniformly at random and asked how large
      their class is. What is the expected size they report?
    answer: >
      $27.1429$. This is length-biased sampling with class size in place of gap
      length: a class of size $x$ is reached by a random student in proportion
      to $x$, so the reported size has mean
      $\mathbb{E}[X^{2}]/\mathbb{E}[X]$ over the *list* of classes. There are
      $60(10) + 20(40) = 1400$ students, and summing size over students gives
      $600(10) + 800(40) = 38000$, so the reported mean is
      $38000/1400 = 27.1429$. The school's own average is a different
      calculation over a different population: $1400/80 = 17.5$ students per
      class. The gap between $17.5$ and $27.1429$ is exactly
      $\operatorname{Var}(X)/\mathbb{E}[X]$, with
      $\mathbb{E}[X^{2}] = (60(100) + 20(1600))/80 = 475$ and
      $\operatorname{Var}(X) = 475 - 306.25 = 168.75$, giving
      $168.75/17.5 = 9.6429$. Neither number is wrong; they answer different
      questions, and no reporting error or dropout is needed to produce the
      discrepancy.
    expects: "27.1429"
    tolerance: 0.0005
    rubric:
      - >
        Averages over students, not over classes — equivalently uses
        $\mathbb{E}[X^{2}]/\mathbb{E}[X]$.
      - >
        Reports the school's own average $17.5$ separately rather than
        conflating the two.
    targets:
      - quant-processes.poisson.length-bias
    exercises:
      - quant-probability.expectation.expectation

  - id: qpois-length-bias-03
    kind: decide
    difficulty: standard
    statement: >
      A candidate states a rule: "for any iid gap distribution with mean $m$,
      someone arriving at a random time lands in a gap of expected length
      $2m$." What is the verdict?
    answer: >
      Wrong: the general answer is
      $\mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$, and the doubling
      is the exponential's special case. The size-biased mean is
      $\mathbb{E}[X^{2}]/\mathbb{E}[X]$, which equals $2m$ precisely when
      $\operatorname{Var}(X) = m^{2}$ — true for the exponential, false in
      general. Two extremes fix the range. A deterministic timetable has zero
      variance, so the sampled gap has mean exactly $m$ and there is no bias at
      all. A highly variable gap law can inflate the sampled mean without
      bound: gaps of $1$ minute with probability $0.99$ and $101$ minutes with
      probability $0.01$ have $m = 2$, yet the sampled mean is
      $\mathbb{E}[X^{2}]/m = (0.99 + 102.01)/2 = 51.5$ minutes, over twenty-five
      times the average gap. The correct general statement is that the penalty
      is $\operatorname{Var}(X)/\mathbb{E}[X]$, and it is variability, not the
      mean, that sets its size.
    choices:
      - text: >
          Wrong — the sampled gap has mean
          $\mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$, which is $2m$
          only when $\operatorname{Var}(X) = m^{2}$
        correct: true
        feedback: >
          The doubling is the exponential's coincidence; the general penalty is
          $\operatorname{Var}(X)/\mathbb{E}[X]$, which is zero for a timetable
          and unbounded for a heavy-tailed gap.
      - text: >
          Right — the sampled gap always splits into a backward and a forward
          piece, each of mean $m$
        feedback: >
          Both pieces have mean $m$ only for the exponential; for a general gap
          law the backward and forward times are not distributed like a gap at
          all.
      - text: >
          Wrong — the sampled gap always has mean $m$, since it is drawn from
          the same list of gaps
        feedback: >
          It is not drawn from the list: hitting the timeline with a point
          selects a gap in proportion to its length, which strictly inflates
          the mean unless the gaps are deterministic.
      - text: >
          Right, provided the gaps are independent of one another
        feedback: >
          Independence is not the issue — iid gaps are already assumed, and the
          multiple still depends entirely on
          $\operatorname{Var}(X)/\mathbb{E}[X]^{2}$.
    rubric:
      - >
        Replaces $2m$ by $\mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$
        and says the factor of two is exponential-specific.
      - >
        Names the zero-variance case as the sanity check at one end.
    targets:
      - quant-processes.poisson.length-bias

  # --- totalling marks over the arrivals -----------------------------------------------------

  - id: qpois-compound-01
    kind: work
    difficulty: demanding
    statement: >
      Two desks have the same expected hourly volume. Desk A fills $100$ trades
      per hour, every one of exactly $500$ shares; desk B fills $500$ trades
      per hour, every one of exactly $100$ shares. Both arrival streams are
      Poisson and both trade sizes are deterministic. What is the ratio of desk
      A's variance of hourly volume to desk B's?
    answer: >
      $5$. Compound Poisson volume $S(t) = \sum_{i=1}^{N(t)} Y_i$ has
      $\operatorname{Var}(S(t)) = \lambda t\,\mathbb{E}[Y^{2}] =
      \lambda t(\sigma^{2} + \mu^{2})$. Deterministic sizes make
      $\sigma^{2} = 0$, so the variance is $\lambda t\mu^{2}$ and every bit of
      it comes from the randomness of the *count*. Desk A gets
      $100 \cdot 500^{2} = 25{,}000{,}000$ and desk B gets
      $500 \cdot 100^{2} = 5{,}000{,}000$, a ratio of $5$ — equal to the ratio
      of the trade sizes, since scaling $\mu$ by a factor $c$ while dividing
      $\lambda$ by $c$ holds the mean $\lambda t\mu = 50{,}000$ shares fixed
      but multiplies the variance by $c$. The lesson is the one a fixed-count
      model cannot see: with $\sigma^{2} = 0$ a deterministic-count model would
      report zero variance for both desks, whereas the true risk is driven
      entirely by $\mu^{2}$, and fewer, larger fills are the riskier way to
      trade the same volume.
    expects: "5"
    rubric:
      - >
        Uses $\operatorname{Var}(S) = \lambda t(\sigma^{2} + \mu^{2})$ and
        keeps the $\mu^{2}$ term when $\sigma^{2} = 0$.
      - >
        Concludes that equal mean volume does not mean equal variance, and says
        which desk carries more.
    targets:
      - quant-processes.poisson.compound
    exercises:
      - quant-probability.conditioning.random-sums

  - id: qpois-compound-02
    kind: work
    difficulty: standard
    statement: >
      Insurance claims arrive as a Poisson process of rate $5$ per day. Claim
      sizes are iid, independent of the arrivals, with mean $40$ and standard
      deviation $30$, both measured in thousands of dollars. What is the
      variance of the total daily claim amount, in squared thousands of
      dollars?
    answer: >
      $12500$. The daily total is a random sum
      $S = \sum_{i=1}^{N} Y_i$ with $N \sim \operatorname{Poisson}(5)$, and the
      Poisson case collapses the two-term random-sum formula into one:
      $\operatorname{Var}(S) = \lambda t\,\sigma^{2} + \lambda t\,\mu^{2} =
      \lambda t\,\mathbb{E}[Y^{2}]$, because
      $\operatorname{Var}(N) = \mathbb{E}[N]$ for a Poisson count. So
      $\mathbb{E}[Y^{2}] = 30^{2} + 40^{2} = 900 + 1600 = 2500$ and
      $\operatorname{Var}(S) = 5 \cdot 2500 = 12500$, alongside
      $\mathbb{E}[S] = 5 \cdot 40 = 200$ thousand dollars and a standard
      deviation of $\sqrt{12500} \approx 111.8$ thousand dollars. The trap is
      reporting $\lambda t\,\sigma^{2} = 5 \cdot 900 = 4500$, which treats the
      number of claims as fixed at its mean; the missing $\lambda t\,\mu^{2} =
      8000$ is the contribution of a random count and dominates here.
    expects: "12500"
    rubric:
      - >
        Computes $\mathbb{E}[Y^{2}] = \sigma^{2} + \mu^{2}$ rather than using
        $\sigma^{2}$ alone.
      - >
        Says why the two variance terms collapse — a Poisson count has variance
        equal to its mean.
    targets:
      - quant-processes.poisson.compound
    exercises:
      - quant-probability.expectation.variance

  - id: qpois-compound-03
    kind: decide
    difficulty: standard
    statement: >
      Storm claims arrive as a Poisson process, but heavy days are heavy in
      both senses: on days when many claims arrive, the individual claims also
      tend to be larger. An actuary still reports
      $\operatorname{Var}(S) = \lambda t\,\mathbb{E}[Y^{2}]$. What is the
      verdict?
    answer: >
      Wrong, and the error is in the direction that matters: the formula
      assumes the marks are iid *and independent of the arrival count*, and
      positive dependence between size and count makes the true variance
      strictly larger. The general random-sum decomposition is
      $\operatorname{Var}(S) = \mathbb{E}[\operatorname{Var}(S \mid N)] +
      \operatorname{Var}(\mathbb{E}[S \mid N])$; the compound Poisson answer
      comes from $\mathbb{E}[S \mid N] = N\mu$ with $\mu$ the *same* on every
      day. When heavy days carry larger claims, $\mathbb{E}[S \mid N] = N\mu_N$
      with $\mu_N$ increasing in $N$, so the second term grows and the reported
      figure understates the risk — precisely the wrong way to be wrong for a
      capital calculation. Note what is not the problem: the arrivals may
      remain perfectly Poisson, and each day's claim sizes may remain
      identically distributed *given* the count. Independence between the marks
      and the count is a separate hypothesis, and it is the one this scenario
      breaks.
    choices:
      - text: >
          Wrong — the formula needs the marks independent of the count, and
          positive dependence makes the true variance larger
        correct: true
        feedback: >
          $\operatorname{Var}(\mathbb{E}[S \mid N])$ grows once the mean mark
          rises with $N$, so $\lambda t\,\mathbb{E}[Y^{2}]$ understates the
          risk.
      - text: >
          Right — the arrivals are still Poisson, which is all the formula
          requires
        feedback: >
          A Poisson count is necessary but not sufficient; the derivation also
          uses marks that are iid and independent of the count.
      - text: >
          Wrong — the true variance is smaller, since large claims cluster on
          fewer days
        feedback: >
          Clustering large claims with large counts adds variability to the
          daily total rather than removing it; the dependence pushes the
          variance up.
      - text: >
          Right, provided the claim sizes are identically distributed on every
          day
        feedback: >
          They are not identically distributed unconditionally here — the size
          law shifts with the count, which is exactly the dependence the
          formula forbids.
    rubric:
      - >
        Names independence of the marks from the count, not the Poisson
        property of the arrivals, as the failed hypothesis.
      - >
        Gets the direction right — the reported variance understates the truth.
    targets:
      - quant-processes.poisson.compound

  # --- when the rate moves ----------------------------------------------------------------------

  - id: qpois-nonhomogeneous-01
    kind: work
    difficulty: demanding
    statement: >
      Defaults in a young loan book follow a non-homogeneous Poisson process
      with intensity $\lambda(t) = 0.4 + 0.6t$ per year, with $t$ measured in
      years from origination. What is the probability of exactly $3$ defaults
      over the first three years? Use $e^{-3.9} = 0.020242$.
    answer: >
      $0.2001$. The count over $[a,b]$ is Poisson with mean
      $m(b) - m(a)$, where $m(t) = \int_{0}^{t}\lambda(u)\,du$. Integrating,
      $m(t) = 0.4t + 0.3t^{2}$, so the mean over the first three years is
      $m(3) - m(0) = 1.2 + 2.7 = 3.9$. The count law is then an ordinary
      $\operatorname{Poisson}(3.9)$, and
      $\Pr(N = 3) = e^{-3.9}(3.9)^{3}/3! = 0.020242 \cdot 59.319/6 =
      0.020242 \cdot 9.8865 = 0.2001$. The trap is using a snapshot rate in
      place of the integral: $\lambda(0) \cdot 3 = 1.2$ takes the rate at
      origination and $\lambda(3) \cdot 3 = 6.6$ takes it at the end, and
      neither is the accumulated mean. Because this particular intensity is
      linear, the midpoint value happens to agree —
      $\lambda(1.5) \cdot 3 = 1.3 \cdot 3 = 3.9$ — which is a useful arithmetic
      check but not a general rule; a curved intensity breaks it.
    expects: "0.2001"
    tolerance: 0.0005
    rubric:
      - >
        Integrates the intensity to $m(3) = 3.9$ rather than multiplying an
        endpoint rate by the window length.
      - >
        Applies the ordinary Poisson pmf to the accumulated mean.
    targets:
      - quant-processes.poisson.nonhomogeneous
    exercises:
      - quant-probability.discrete.poisson

  - id: qpois-nonhomogeneous-02
    kind: decide
    difficulty: standard
    statement: >
      A non-homogeneous Poisson process has a strictly increasing intensity
      $\lambda(t)$. Which of the following properties of the ordinary
      constant-rate process survives?
    answer: >
      Independent increments survive; everything built on a common law does
      not. Dropping stationarity leaves the local construction untouched — an
      arrival still occurs in $[t, t+dt]$ with chance $\lambda(t)\,dt$,
      independently of everything outside that instant — so counts over
      disjoint windows remain independent, and each is still Poisson, now with
      mean $m(b) - m(a) = \int_{a}^{b}\lambda(u)\,du$. What breaks is
      everything that needed windows of equal length to look alike. Gaps are no
      longer iid exponential: a gap that starts in a busy stretch is typically
      shorter than one that starts in a quiet stretch, so the $X_i$ are neither
      identically distributed nor exponential. For the same reason the forward
      wait from a fixed time $s$ has a law that depends on $s$, so there is no
      single $\operatorname{Exp}(\lambda)$ describing it — the fresh-start
      property survives only as independence of the future from the past, not
      as a common distribution. A time change on $m$ restores the standard
      case, which is how one simulates these: draw rate-$1$ arrivals and map
      them through $m^{-1}$.
    choices:
      - text: >
          Increments over disjoint intervals are still independent
        correct: true
        feedback: >
          Only stationarity was dropped; the instant-by-instant construction
          still makes disjoint windows carry no information about each other.
      - text: >
          The gaps between consecutive arrivals are still iid
          $\operatorname{Exp}(\lambda)$
        feedback: >
          A gap beginning in a busy stretch is typically shorter than one
          beginning in a quiet stretch, so the gaps are neither identically
          distributed nor exponential.
      - text: >
          Increments are still stationary, since only the rate has changed
        feedback: >
          Stationarity is exactly what a moving rate costs: the law of a window
          now depends on where it starts, not only on its length.
      - text: >
          The forward wait from any fixed time is still
          $\operatorname{Exp}(\lambda)$ for a common $\lambda$
        feedback: >
          There is no common $\lambda$ any more; the forward wait's law depends
          on the starting time, so fresh start survives only as independence,
          not as a shared distribution.
    rubric:
      - >
        Selects independent increments and says stationarity is the axiom being
        dropped.
      - >
        Explains why iid exponential gaps fail — the rate at which a gap starts
        now matters.
    targets:
      - quant-processes.poisson.nonhomogeneous

  # --- why the points look bunched ----------------------------------------------------------------

  - id: qpois-clumping-01
    kind: work
    difficulty: demanding
    statement: >
      Alerts fire as a Poisson process of rate $20$ per hour. Over a $3$-hour
      shift, $74$ alerts are logged. How many standard deviations above the
      mean is that count? Give the answer to four decimal places.
    answer: >
      $1.8074$. For a Poisson process the count over the shift has
      $\mathbb{E}[N] = \operatorname{Var}(N) = \lambda t = 20 \cdot 3 = 60$, so
      the standard deviation is $\sqrt{60} \approx 7.745967$ — not $60$, and
      not something requiring a separate variance formula. The standardised
      value is $(74 - 60)/\sqrt{60} = 14/7.745967 = 1.8074$. The reading
      matters more than the number: an excess of $14$ alerts sounds alarming in
      absolute terms and is under two standard deviations, entirely ordinary
      for a stream running at its stated rate. This is the arithmetic behind
      why counts "wobble": the typical deviation grows like $\sqrt{\lambda t}$
      while the mean grows like $\lambda t$, so a shift at $\lambda t = 60$
      routinely lands anywhere from about $45$ to $75$. The trap is judging the
      excess against the mean instead of against $\sqrt{\lambda t}$, which
      would make $14/60 = 23$ percent look like a large deviation.
    expects: "1.8074"
    tolerance: 0.0005
    rubric:
      - >
        Uses $\operatorname{Var}(N) = \lambda t$, so the standard deviation is
        $\sqrt{\lambda t}$ rather than $\lambda t$.
      - >
        Standardises against $\sqrt{\lambda t}$, not against the mean itself.
    targets:
      - quant-processes.poisson.clumping
    exercises:
      - quant-probability.expectation.variance

  - id: qpois-clumping-02
    kind: work
    difficulty: standard
    statement: >
      For a Poisson process of any rate, what fraction of the gaps between
      consecutive arrivals are shorter than one quarter of the mean gap? Use
      $e^{-0.25} = 0.778801$.
    answer: >
      $0.2212$. The gaps are $\operatorname{Exp}(\lambda)$ with mean
      $1/\lambda$, so the question asks for
      $\Pr(X < 1/(4\lambda)) = 1 - e^{-\lambda/(4\lambda)} = 1 - e^{-0.25} =
      1 - 0.778801 = 0.2212$, and $\lambda$ cancels — the fraction is the same
      for every Poisson process, which is why the question can be posed without
      a rate. More than one gap in five is under a quarter of the average, and
      that is the whole explanation for why a scatter of Poisson arrivals looks
      bunched: the exponential density is largest at $0$ and decreasing, so
      short gaps are the most likely outcome rather than a sign of a burst. The
      instinct that "a quarter of the mean should be rare" comes from imagining
      gaps concentrated near their average, which is what a timetable does, not
      what a memoryless process does.
    expects: "0.2212"
    tolerance: 0.0005
    rubric:
      - >
        Applies the exponential cdf and notices that $\lambda$ cancels, so the
        answer is rate-free.
      - >
        Reads the result as evidence that visible clustering is the norm, not
        an anomaly.
    targets:
      - quant-processes.poisson.clumping
    exercises:
      - quant-probability.continuous.exponential

  - id: qpois-clumping-03
    kind: decide
    difficulty: standard
    statement: >
      A desk logs message counts over $240$ disjoint five-minute windows and
      finds a sample mean of $8.2$ and a sample variance of $26.6$. A junior
      analyst separately points at the scatter plot and says the arrivals
      "obviously cluster". Which conclusion is best supported?
    answer: >
      The data do support clustering, but only the dispersion figure is
      evidence: the index of dispersion is
      $\operatorname{Var}(N)/\mathbb{E}[N] \approx 26.6/8.2 \approx 3.24$,
      more than three times the value of $1$ that a Poisson process must
      produce, and that is a quantitative signal the model is wrong. The
      scatter plot is not evidence of anything. Exponential gaps make visible
      bunching completely routine — more than a fifth of gaps fall below a
      quarter of the mean — so a picture of genuinely Poisson arrivals looks
      clumpy to almost everyone who sees one, and eyeballing it cannot separate
      real clustering from ordinary randomness. The right habit is to run the
      test in the direction that can fail: a ratio near $1$ is consistent with
      Poisson, well above $1$ indicates genuine clustering, and well below $1$
      indicates something closer to a timetable.
    choices:
      - text: >
          The dispersion index of about $3.24$ is evidence of genuine
          clustering; the appearance of the plot is not
        correct: true
        feedback: >
          A Poisson count has $\operatorname{Var}(N)/\mathbb{E}[N] = 1$
          exactly, so $3.24$ is a real signal — while a clumpy-looking plot is
          what ordinary Poisson arrivals produce anyway.
      - text: >
          Both the dispersion index and the plot point the same way, so the
          visual check is confirmed as a valid diagnostic
        feedback: >
          The visual check would have said "clustered" for a genuinely Poisson
          stream too, so agreeing with the correct answer here does not make it
          diagnostic.
      - text: >
          The stream is consistent with Poisson: a sample variance above the
          sample mean is expected from sampling noise
        feedback: >
          Over $240$ windows the dispersion index is estimated tightly; a value
          above $3$ is far outside what sampling noise around $1$ produces.
      - text: >
          The stream is under-dispersed, so the arrivals are closer to a
          timetable than to a Poisson process
        feedback: >
          Under-dispersion means a ratio below $1$; here the ratio is above
          $3$, which is the opposite finding.
    rubric:
      - >
        Computes the index of dispersion and compares it to $1$ rather than
        judging by the plot.
      - >
        Says explicitly that visible bunching is normal for Poisson arrivals,
        so the plot carries no evidence either way.
    targets:
      - quant-processes.poisson.clumping
