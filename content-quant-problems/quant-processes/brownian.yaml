# Problems targeting quant-processes.brownian — Brownian motion.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's numbers. See ../README.md.

problems:
  # --- standard Brownian motion -----------------------------------------------

  - id: qbm-bm-01
    kind: work
    difficulty: demanding
    statement: >
      Let $(B_t)_{t \ge 0}$ be a standard Brownian motion. Compute
      $\mathbb{E}[B_3^{2} B_7^{2}]$.
    answer: >
      $39$. Split the later value along the increment: $B_7 = B_3 + X$ with
      $X = B_7 - B_3 \sim N(0,4)$, independent of $B_3$ because the intervals
      $[0,3]$ and $[3,7]$ are disjoint, and with variance the elapsed time
      $7 - 3 = 4$. Then $B_3^{2}B_7^{2} = B_3^{2}(B_3 + X)^{2} = B_3^{4} +
      2B_3^{3}X + B_3^{2}X^{2}$. Take expectations term by term, factoring the
      mixed pieces by independence: $\mathbb{E}[B_3^{4}] = 3 \cdot 3^{2} = 27$,
      since a mean-zero normal has fourth moment $3\sigma^{4}$ and here
      $\sigma^{2} = 3$; $\mathbb{E}[B_3^{3}]\mathbb{E}[X] = 0$ because the
      increment has mean $0$; and $\mathbb{E}[B_3^{2}]\mathbb{E}[X^{2}] =
      3 \cdot 4 = 12$. The total is $27 + 12 = 39$. The trap is treating the two
      positions as independent and answering
      $\mathbb{E}[B_3^{2}]\mathbb{E}[B_7^{2}] = 3 \cdot 7 = 21$: it is the
      increments that are independent, never the positions, which overlap on
      $[0,3]$.
    expects: "39"
    rubric:
      - >
        Decomposes $B_7$ as $B_3$ plus an independent $N(0,4)$ increment rather
        than treating the two positions as independent.
      - >
        Uses the mean-zero normal fourth moment $3\sigma^{4}$, giving
        $\mathbb{E}[B_3^{4}] = 27$ and not $9$.
    targets:
      - quant-processes.brownian.bm
    exercises:
      - quant-probability.continuous.normal
      - quant-probability.continuous.normal-sums

  - id: qbm-bm-02
    kind: work
    difficulty: standard
    statement: >
      For a standard Brownian motion, compute $\Pr(B_{20} - B_4 > 5)$. Use
      $\Phi(1.25) = 0.8944$ and give four decimal places.
    answer: >
      $0.1056$. The law of an increment depends only on the elapsed time, not on
      where the interval sits on the clock, so $B_{20} - B_4 \sim N(0, 20 - 4) =
      N(0,16)$ with standard deviation $\sqrt{16} = 4$. Standardizing,
      $\Pr(B_{20} - B_4 > 5) = \Pr(Z > 5/4) = \Pr(Z > 1.25) = 1 - \Phi(1.25) =
      1 - 0.8944 = 0.1056$. Two slips are worth naming. Dividing by the elapsed
      time rather than by its square root gives $z = 5/16 = 0.3125$ and a badly
      inflated answer — the variance is $t$, so the standard deviation is
      $\sqrt{t}$, never $t$. And standardizing by $\sqrt{20} \approx 4.47$, the
      standard deviation of $B_{20}$ itself, answers a question about the
      endpoint instead of about the increment.
    expects: "0.1056"
    tolerance: 0.0005
    rubric:
      - >
        Uses the elapsed time $16$ for the increment's variance, so the standard
        deviation is $4$.
      - >
        Divides by $\sqrt{16}$, not by $16$ and not by $\sqrt{20}$.
    targets:
      - quant-processes.brownian.bm
    exercises:
      - quant-probability.continuous.standardization

  - id: qbm-bm-03
    kind: decide
    difficulty: demanding
    statement: >
      Draw a single standard normal $Z \sim N(0,1)$ once and define
      $X_t = \sqrt{t}\,Z$ for $t \ge 0$. Which of the four defining properties
      of Brownian motion does $X$ fail?
    answer: >
      Independence of increments is the property that breaks, and nothing else
      does. The marginals are exactly right, $X_t = \sqrt{t}\,Z \sim N(0,t)$;
      the paths $t \mapsto \sqrt{t}\,Z$ are continuous for every realization of
      $Z$; and $X_0 = 0$. But one draw of $Z$ fixes the whole path, so no two
      pieces of it are independent:
      $\operatorname{Cov}(X_1, X_2 - X_1) = (\sqrt{2} - 1)\operatorname{Var}(Z)
      = \sqrt{2} - 1 \approx 0.414$, whereas a Brownian motion has
      $\operatorname{Cov}(B_1, B_2 - B_1) = 0$. The covariance function gives it
      away just as fast: $\operatorname{Cov}(X_s, X_t) = \sqrt{st}$, not
      $\min(s,t)$, and the two agree only when $s = t$. The lesson is that
      matching every one-dimensional marginal is never enough to identify a
      process — the joint law across times is what the four properties pin down,
      and this candidate matches the marginals precisely so that it can fail the
      joint law.
    choices:
      - text: >
          It fails $X_0 = 0$.
        feedback: >
          $X_0 = \sqrt{0}\,Z = 0$ for every draw of $Z$, so this property holds
          exactly — it is a normalization, and this candidate respects it.
      - text: >
          It fails independence of increments.
        correct: true
        feedback: >
          One draw of $Z$ determines the entire path, so $X_1 = Z$ and
          $X_2 - X_1 = (\sqrt{2}-1)Z$ have correlation $1$. The process carries
          no fresh randomness after time $0$.
      - text: >
          It fails to have the right marginal law $X_t \sim N(0,t)$.
        feedback: >
          $\sqrt{t}\,Z$ is exactly $N(0,t)$ at each fixed $t$ — matching every
          marginal is precisely what makes this candidate tempting.
      - text: >
          It fails to have continuous sample paths.
        feedback: >
          $t \mapsto \sqrt{t}\,Z$ is continuous for every realization of $Z$;
          continuity is not where this candidate breaks.
    rubric:
      - >
        Checks the marginals, the starting value and continuity before rejecting
        the candidate, rather than guessing.
      - >
        Exhibits a nonzero covariance between a value and a later increment, or
        equivalently notes $\operatorname{Cov}(X_s,X_t) = \sqrt{st} \ne
        \min(s,t)$.
    targets:
      - quant-processes.brownian.bm
    exercises:
      - quant-probability.continuous.normal

  # --- Brownian motion as the scaling limit of a walk --------------------------

  - id: qbm-walk-limit-01
    kind: work
    difficulty: demanding
    statement: >
      A signal moves a position by $+3$ ticks with probability $1/4$ and by
      $-1$ tick with probability $3/4$, independently each period. After $1200$
      periods, estimate $\Pr(S_{1200} \ge 105)$. Use $\Phi(1.75) = 0.9599$ and
      give four decimal places.
    answer: >
      $0.0401$. Donsker's principle says the rescaled walk converges to
      $\sigma B$ for any step law with mean $0$ and finite variance
      $\sigma^{2}$, so only two numbers about a step survive the limit. The mean
      is $3(1/4) - 1(3/4) = 3/4 - 3/4 = 0$, so the walk is genuinely driftless
      despite its lopsided steps, and the variance is
      $\mathbb{E}[X^{2}] = 9(1/4) + 1(3/4) = 9/4 + 3/4 = 3$. After $n = 1200$
      independent steps the sum has variance $3 \cdot 1200 = 3600$ and standard
      deviation $\sqrt{3600} = 60$, so the threshold sits at $z = 105/60 =
      1.75$ and $\Pr(S_{1200} \ge 105) \approx 1 - \Phi(1.75) = 1 - 0.9599 =
      0.0401$. The skew of the step is a distraction the invariance principle
      deletes. Rescaling by $\sqrt{n} \approx 34.64$ and forgetting the factor
      $\sigma = \sqrt{3}$ is the standard slip: it gives $z \approx 3.03$ and
      understates the tail by an order of magnitude.
    expects: "0.0401"
    tolerance: 0.0005
    rubric:
      - >
        Computes the step mean and confirms it is $0$ before applying any normal
        approximation.
      - >
        Uses $\sigma\sqrt{n} = \sqrt{3 \cdot 1200} = 60$, not $\sqrt{n}$ alone.
    targets:
      - quant-processes.brownian.walk-limit
    exercises:
      - quant-probability.limits.clt
      - quant-probability.expectation.variance

  - id: qbm-walk-limit-02
    kind: work
    difficulty: standard
    statement: >
      A fair $\pm 1$ walk runs for $40000$ steps. Using the Donsker rescaling
      $W^{(n)}_t = S_{\lfloor nt \rfloor}/\sqrt{n}$ at $t = 1$, estimate
      $\Pr(S_{40000} \le -400)$. Use $\Phi(2) = 0.9772$ and give four decimal
      places.
    answer: >
      $0.0228$. At $t = 1$ the rescaled endpoint is
      $W^{(n)}_1 = S_{40000}/\sqrt{40000} = S_{40000}/200$, and Donsker's
      theorem sends it to $B_1 \sim N(0,1)$. So
      $\Pr(S_{40000} \le -400) = \Pr(W^{(n)}_1 \le -2) \approx \Phi(-2) =
      1 - \Phi(2) = 1 - 0.9772 = 0.0228$. The whole computation is the
      observation that a $400$-step deficit is not "a lot of tails" but exactly
      two standard deviations, because a fair walk's standard deviation after
      $n$ steps is $\sqrt{n} = 200$. Reading a raw lead as extreme because it is
      a large number, instead of converting it into $\sqrt{n}$ units first, is
      the error the rescaling exists to prevent — and the same conversion is why
      the answer does not depend on $n$ and the threshold separately, only on
      their ratio.
    expects: "0.0228"
    tolerance: 0.0005
    rubric:
      - >
        Converts the threshold to $\sqrt{n}$ units, getting $z = -2$, before
        quoting any normal tail.
      - >
        Identifies the limit at $t = 1$ as $N(0,1)$, so no extra variance factor
        is needed.
    targets:
      - quant-processes.brownian.walk-limit
    exercises:
      - quant-probability.limits.clt

  - id: qbm-walk-limit-03
    kind: decide
    difficulty: demanding
    statement: >
      Four walks with independent, identically distributed steps are rescaled by
      $\sqrt{n}$ in space and $n$ in time. Which one does *not* converge to a
      possibly rescaled standard Brownian motion?
    answer: >
      The biased $\pm 1$ walk with $\Pr(+1) = 0.6$ is the one that fails, and
      the reason is its mean, not its shape. Donsker's principle asks only that
      the step have mean $0$ and finite variance; the shape is then irrelevant,
      which is why the walk uniform on $\{-2,-1,1,2\}$ (mean $0$, variance
      $2.5$) converges to $\sqrt{2.5}\,B$ and the visibly asymmetric $+2/-1$
      walk (mean $0$, variance $2$) converges to $\sqrt{2}\,B$. With
      $\Pr(+1) = 0.6$ the step mean is $0.2$, so $S_n$ carries a deterministic
      drift $0.2n$; dividing by $\sqrt{n}$ leaves $0.2\sqrt{n}$, which diverges,
      and the rescaled path runs off to infinity rather than converging.
      Recentring the steps repairs it: the recentred walk converges to
      $\sqrt{4pq}\,B = \sqrt{0.96}\,B$. The other load-bearing hypothesis is
      finite variance — a heavy-tailed step law with infinite variance has no
      Brownian limit under any rescaling at all.
    choices:
      - text: >
          $+1$ or $-1$ with probability $1/2$ each
        feedback: >
          Mean $0$, variance $1$ — the canonical case, whose limit is $B$
          itself.
      - text: >
          $+1$ with probability $0.6$, $-1$ with probability $0.4$
        correct: true
        feedback: >
          The step mean is $0.2 \ne 0$, so the walk accumulates a drift $0.2n$
          that the $\sqrt{n}$ rescaling turns into $0.2\sqrt{n} \to \infty$.
          Recentre the steps and the recentred walk converges fine.
      - text: >
          Uniform on $\{-2,-1,1,2\}$
        feedback: >
          Mean $0$ and variance $(4+1+1+4)/4 = 2.5$, so it converges to
          $\sqrt{2.5}\,B$. The step's shape never enters the limit.
      - text: >
          $+2$ with probability $1/3$, $-1$ with probability $2/3$
        feedback: >
          Mean $2/3 - 2/3 = 0$ and variance $4/3 + 2/3 = 2$, so it converges to
          $\sqrt{2}\,B$ despite being visibly asymmetric.
    rubric:
      - >
        Computes the mean of each step law and rejects on the mean, not on
        visual asymmetry.
      - >
        Says what the surviving walks converge to — $\sigma B$ with $\sigma$ the
        step standard deviation — rather than just passing them.
    targets:
      - quant-processes.brownian.walk-limit
    exercises:
      - quant-probability.limits.clt

  # --- scaling and the symmetries of the path ---------------------------------

  - id: qbm-scaling-01
    kind: work
    difficulty: demanding
    statement: >
      Time inversion sets $Y_t = t\,B_{1/t}$ for $t > 0$, with $Y_0 = 0$.
      Compute $\operatorname{Cov}(Y_2, Y_5)$.
    answer: >
      $2$. Work straight from the Brownian covariance function:
      $\operatorname{Cov}(Y_s, Y_t) = \operatorname{Cov}(sB_{1/s},\, tB_{1/t}) =
      st\operatorname{Cov}(B_{1/s}, B_{1/t}) = st\min(1/s, 1/t)$. The smaller of
      two reciprocals is the reciprocal of the larger time, so
      $st\min(1/s,1/t) = st/\max(s,t) = \min(s,t)$. With $s = 2$ and $t = 5$
      this is $\min(2,5) = 2$. The general identity
      $\operatorname{Cov}(Y_s,Y_t) = \min(s,t)$ is the whole proof that time
      inversion produces another standard Brownian motion: $Y$ is mean zero,
      jointly Gaussian as a linear image of $B$, continuous on $(0,\infty)$, and
      now has Brownian covariance. The trap lives in the reciprocals, since
      $1/s > 1/t$ exactly when $s < t$: reading $\min(1/2, 1/5)$ as $1/2$ turns
      the answer into $st/\min(s,t) = \max(s,t) = 5$, a covariance larger than
      $\sqrt{\operatorname{Var}(Y_2)\operatorname{Var}(Y_5)} = \sqrt{10}$ and so
      impossible.
    expects: "2"
    rubric:
      - >
        Pulls the deterministic factors $s$ and $t$ out of the covariance before
        applying $\min$.
      - >
        Inverts the times correctly, noting $\min(1/s,1/t) = 1/\max(s,t)$, and
        so lands on $\min(s,t)$ rather than $\max(s,t)$.
    targets:
      - quant-processes.brownian.scaling
      - quant-processes.brownian.covariance
    exercises:
      - quant-processes.brownian.bm

  - id: qbm-scaling-02
    kind: work
    difficulty: standard
    statement: >
      A standard Brownian motion has expected displacement
      $\mathbb{E}|B_t| = \sqrt{2t/\pi}$. At what time $t$ does
      $\mathbb{E}|B_t|$ equal $2$? Give four decimal places.
    answer: >
      $t = 2\pi \approx 6.2832$. Set $\sqrt{2t/\pi} = 2$, square both sides to
      get $2t/\pi = 4$, and solve $t = 2\pi \approx 6.2832$. The check is
      immediate: $\mathbb{E}|B_{2\pi}| = \sqrt{2(2\pi)/\pi} = \sqrt{4} = 2$
      exactly. The exponent is the point of the exercise. Displacement grows
      like $\sqrt{t}$, not like $t$, so doubling the target displacement costs
      four times the horizon: the time at which $\mathbb{E}|B_t| = 1$ is
      $t = \pi/2 \approx 1.5708$, and the answer here is four times that, not
      twice. Reading the scaling as linear gives $t = \pi \approx 3.1416$ and
      understates the wait by half, which is the same instinct that expects a
      four-day volatility to be four times a one-day volatility rather than
      twice it.
    expects: "6.2832"
    tolerance: 0.0005
    rubric:
      - >
        Squares the relation rather than scaling linearly, so the answer is
        $2\pi$ and not $\pi$.
      - >
        Verifies by substituting back that $\mathbb{E}|B_{2\pi}| = 2$.
    targets:
      - quant-processes.brownian.scaling
    exercises:
      - quant-processes.brownian.bm

  - id: qbm-scaling-03
    kind: justify
    difficulty: demanding
    statement: >
      Fix $c > 0$ and set $\tilde{B}_t = c^{-1/2}B_{ct}$. Prove that
      $\tilde{B}$ is a standard Brownian motion, checking each defining
      property, and say which single computation carries the argument.
    answer: >
      The variance identity is the only step with content; the other three
      properties are inherited for free. First, $\tilde{B}_0 = c^{-1/2}B_0 = 0$.
      Second, for $0 \le t_0 < t_1 < \dots < t_n$ the scaled times
      $ct_0 < ct_1 < \dots < ct_n$ are still increasing, so the increments
      $\tilde{B}_{t_i} - \tilde{B}_{t_{i-1}} = c^{-1/2}(B_{ct_i} -
      B_{ct_{i-1}})$ are fixed multiples of increments of $B$ over disjoint
      intervals and are therefore independent: a linear rescaling of the time
      axis maps disjoint intervals to disjoint intervals. Third, for $s < t$ the
      increment $\tilde{B}_t - \tilde{B}_s = c^{-1/2}(B_{ct} - B_{cs})$ is a
      constant times an $N(0, ct - cs)$ variable, hence normal with mean $0$ and
      variance $c^{-1}(ct - cs) = t - s$ — the two rescalings cancel exactly,
      and this line is the whole proof. Fourth, $t \mapsto B_{ct}$ is continuous
      because $B$ is, and multiplying by the constant $c^{-1/2}$ preserves
      continuity. The trap is rescaling one axis only: $B_{ct}$ alone has
      variance $ct$ and $c^{-1/2}B_t$ has variance $t/c$, and neither is
      standard unless $c = 1$. Space must shrink by $\sqrt{c}$ exactly when time
      stretches by $c$.
    rubric:
      - >
        Checks all four properties and names the variance computation
        $c^{-1} \cdot ct = t$ as the only one carrying content.
      - >
        Explains that independence and stationarity survive because a linear
        time rescaling sends disjoint intervals to disjoint intervals.
    targets:
      - quant-processes.brownian.scaling
    exercises:
      - quant-processes.brownian.bm

  # --- the covariance function min(s,t) ---------------------------------------

  - id: qbm-covariance-01
    kind: work
    difficulty: demanding
    statement: >
      For a standard Brownian motion, compute
      $\operatorname{Var}(B_2 + B_5 + B_9)$.
    answer: >
      $34$. Expand the variance of a sum:
      $\operatorname{Var}(B_2 + B_5 + B_9) = \operatorname{Var}(B_2) +
      \operatorname{Var}(B_5) + \operatorname{Var}(B_9) +
      2[\operatorname{Cov}(B_2,B_5) + \operatorname{Cov}(B_2,B_9) +
      \operatorname{Cov}(B_5,B_9)]$. Each variance is its own time, so the first
      block is $2 + 5 + 9 = 16$. Each covariance is the shared elapsed time
      $\min(s,t)$: $\min(2,5) = 2$, $\min(2,9) = 2$ and $\min(5,9) = 5$, summing
      to $9$. The total is $16 + 2(9) = 34$. Two errors are worth naming.
      Dropping the covariances — treating the three positions as independent
      because the increments are — gives $16$ and misses more than half the
      answer. Reading $\min$ as $\max$ gives $5 + 9 + 9 = 23$ for the covariance
      block and $62$ overall; that answer is impossible on its face, since
      Cauchy–Schwarz caps $\operatorname{Cov}(B_2,B_9)$ at
      $\sqrt{2 \cdot 9} \approx 4.24$, well below $9$.
    expects: "34"
    rubric:
      - >
        Includes all three cross terms with the factor $2$, rather than summing
        variances alone.
      - >
        Uses $\min(s,t)$ for each covariance and checks the result against the
        Cauchy–Schwarz bound $\sqrt{st}$.
    targets:
      - quant-processes.brownian.covariance
    exercises:
      - quant-processes.brownian.bm
      - quant-probability.expectation.variance

  - id: qbm-covariance-02
    kind: work
    difficulty: standard
    statement: >
      A path is observed to satisfy $B_{12} = 3$. Conditional on that
      observation, what is $\operatorname{Var}(B_8)$?
    answer: >
      $8/3 \approx 2.6667$. Every finite collection of Brownian values is
      jointly Gaussian, which makes conditioning linear: for $t < T$, given
      $B_T = x$, the value $B_t$ is normal with mean $(t/T)x$ and variance
      $t(T-t)/T$. Here $t = 8$ and $T = 12$, so the conditional variance is
      $8(12 - 8)/12 = 32/12 = 8/3 \approx 2.6667$, and the conditional mean is
      $(8/12)(3) = 2$. Notice what the variance does not contain: the observed
      value $3$ never appears, exactly as the residual variance in a linear
      regression is free of the regressor's value. Two structural checks keep
      the formula honest — it vanishes at $t = 0$ and at $t = T$, where the path
      is pinned, and it peaks at the midpoint $t = T/2$, where it equals
      $T/4 = 3$. Reporting the unconditional $\operatorname{Var}(B_8) = 8$
      ignores the observation entirely and triples the true spread.
    expects: "8/3"
    tolerance: 0.0005
    rubric:
      - >
        Uses the bridge variance $t(T-t)/T$ rather than the unconditional $t$.
      - >
        Notes that the conditional variance does not depend on the observed
        value $3$.
    targets:
      - quant-processes.brownian.covariance
    exercises:
      - quant-processes.brownian.bm

  - id: qbm-covariance-03
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $\operatorname{Cov}(B_s, B_t) = \min(s,t)$, and explain why
      $\max(s,t)$ could not possibly be the answer.
    answer: >
      Take $s \le t$ without loss of generality and split the later value along
      the increment, $B_t = B_s + (B_t - B_s)$, where the increment is
      independent of $B_s$ because $[0,s]$ and $[s,t]$ are disjoint. Bilinearity
      of covariance then gives
      $\operatorname{Cov}(B_s, B_t) = \operatorname{Cov}(B_s, B_s) +
      \operatorname{Cov}(B_s, B_t - B_s) = \operatorname{Var}(B_s) + 0 = s$.
      Since $s$ was the smaller time and covariance is symmetric in its
      arguments, the general statement is
      $\operatorname{Cov}(B_s,B_t) = \min(s,t)$: two values are coupled by
      exactly the stretch of path they have lived through together. Ruling out
      $\max$ needs no probability beyond Cauchy–Schwarz, which gives
      $|\operatorname{Cov}(B_s,B_t)| \le
      \sqrt{\operatorname{Var}(B_s)\operatorname{Var}(B_t)} = \sqrt{st}$; but
      $\max(s,t) > \sqrt{st}$ for every $s \ne t$, so the $\max$ answer violates
      the bound at every distinct pair of times. The same division reads off the
      correlation, $\min(s,t)/\sqrt{st} = \sqrt{s/t}$ for $s \le t$, which is at
      most $1$ as it must be — while $\max(s,t)/\sqrt{st} = \sqrt{t/s} > 1$
      would be a correlation above one.
    rubric:
      - >
        Splits $B_t = B_s + (B_t - B_s)$ and cites independence over disjoint
        intervals to kill the cross term.
      - >
        Rules out $\max(s,t)$ by Cauchy–Schwarz, noting $\max(s,t) > \sqrt{st}$
        whenever $s \ne t$.
    targets:
      - quant-processes.brownian.covariance
    exercises:
      - quant-processes.brownian.bm

  # --- Markov and strong Markov properties ------------------------------------

  - id: qbm-markov-property-01
    kind: work
    difficulty: demanding
    statement: >
      A path is observed to satisfy $B_4 = 1$. Compute
      $\mathbb{E}[B_9 B_{16} \mid B_4 = 1]$.
    answer: >
      $6$. The Markov property at the fixed time $4$ says $W_u = B_{4+u} - B_4$
      is a standard Brownian motion independent of everything up to time $4$, so
      conditioning on $B_4 = 1$ turns the question into an unconditional one
      about $W$. Rewrite both values with the clock reset: $B_9 = 1 + W_5$ and
      $B_{16} = 1 + W_{12}$, the elapsed times being $9 - 4 = 5$ and
      $16 - 4 = 12$ rather than $9$ and $16$. Expanding and using
      $\mathbb{E}[W_u] = 0$,
      $\mathbb{E}[(1 + W_5)(1 + W_{12})] = 1 + \mathbb{E}[W_5] +
      \mathbb{E}[W_{12}] + \mathbb{E}[W_5 W_{12}] = 1 + 0 + 0 + \min(5,12) =
      1 + 5 = 6$. The named slip is failing to shift the clock and writing
      $1 + \min(9,16) = 10$: the restarted process begins at time $4$, so every
      elapsed time must be measured from there, and the covariance is the
      overlap of the restarted intervals, not of the original ones.
    expects: "6"
    rubric:
      - >
        Restarts the process at time $4$ and re-expresses both values as
        $1 + W_5$ and $1 + W_{12}$, with elapsed times $5$ and $12$.
      - >
        Applies $\operatorname{Cov}(W_u, W_v) = \min(u,v)$ to the restarted
        times, giving $5$ and not $9$.
    targets:
      - quant-processes.brownian.markov-property
    exercises:
      - quant-processes.brownian.bm

  - id: qbm-markov-property-02
    kind: work
    difficulty: standard
    statement: >
      A path is observed to satisfy $B_2 = -1$. Compute
      $\Pr(B_{11} > 1.25 \mid B_2 = -1)$. Use $\Phi(0.75) = 0.7734$ and give
      four decimal places.
    answer: >
      $0.2266$. Shift the origin to the observed value: $W_u = B_{2+u} + 1$ is a
      standard Brownian motion independent of the past, so the event
      $\{B_{11} > 1.25\}$ becomes $\{W_9 > 1.25 - (-1)\} = \{W_9 > 2.25\}$. The
      elapsed time is $11 - 2 = 9$, so $W_9 \sim N(0,9)$ with standard deviation
      $3$, and $z = 2.25/3 = 0.75$. Hence the probability is
      $1 - \Phi(0.75) = 1 - 0.7734 = 0.2266$. Both halves of the shift matter.
      Using the elapsed time $11$ instead of $9$ inflates the standard deviation
      to $\sqrt{11} \approx 3.32$; and forgetting that the path stands at $-1$
      rather than $0$ makes the required move $1.25$ instead of $2.25$, lifting
      the answer to about $0.34$. Conditioning on a Brownian path is always this
      pair of moves: shift the level, then measure the remaining time.
    expects: "0.2266"
    tolerance: 0.0005
    rubric:
      - >
        Measures the required move from the conditioned level, giving $2.25$ and
        not $1.25$.
      - >
        Uses the elapsed time $9$, so the standard deviation is $3$.
    targets:
      - quant-processes.brownian.markov-property
    exercises:
      - quant-probability.continuous.standardization

  - id: qbm-markov-property-03
    kind: decide
    difficulty: demanding
    statement: >
      Let $\tau$ be the first time a standard Brownian motion reaches level $3$,
      and set $W_u = B_{\tau + u} - 3$. Which statement is exactly what the
      strong Markov property grants?
    answer: >
      The theorem grants that $W$ is a standard Brownian motion independent of
      the entire history $\mathcal{F}_\tau$, not merely of the value $B_\tau$.
      Both halves are load-bearing. That $\tau$ may be random is the upgrade
      over the ordinary Markov property, and it is legal here because a first
      hitting time is decidable from the path up to that instant with no
      look-ahead; a time such as "when the maximum over $[0,10]$ is attained"
      would not qualify, since deciding it needs the future. That the
      independence is from the whole past, rather than from where the path
      stands, is what licenses throwing away every detail of how the level was
      reached — the route, the near-misses, the time consumed. The reflection
      principle rests on exactly this: after the first touch of $a$ the
      restarted path is symmetric, so it is equally likely to finish above or
      below $a$, and that symmetry would not follow from independence of the
      value $B_\tau$ alone.
    choices:
      - text: >
          $W$ is a standard Brownian motion independent of the whole history
          $\mathcal{F}_\tau$ of the path up to $\tau$.
        correct: true
        feedback: >
          Independence is from the entire pre-$\tau$ path, which is what lets an
          argument discard everything before the first touch.
      - text: >
          $W$ is a standard Brownian motion independent of the value $B_\tau$
          alone, but its law may still depend on how the path reached level $3$.
        feedback: >
          This understates the theorem. Independence is from the full
          $\sigma$-algebra $\mathcal{F}_\tau$, so the route to the level is
          irrelevant — that is precisely the content being claimed.
      - text: >
          $W$ is a standard Brownian motion started at $3$ rather than at $0$.
        feedback: >
          Subtracting $3$ is exactly what restarts it at $0$. The process
          $B_{\tau+u}$ starts at $3$; $W$ does not.
      - text: >
          The conclusion needs $\tau$ to be a deterministic time; at a random
          time only the ordinary Markov property applies.
        feedback: >
          Upgrading a fixed time to a stopping time is the theorem's whole
          content, and a first hitting time is a stopping time — decidable from
          the path so far.
    rubric:
      - >
        Says the restarted process is independent of $\mathcal{F}_\tau$, the
        whole past, not just of $B_\tau$.
      - >
        Notes that $\tau$ is a stopping time, and gives an example of a random
        time that is not one.
    targets:
      - quant-processes.brownian.markov-property
    exercises:
      - quant-processes.brownian.bm

  # --- the three Brownian martingales -----------------------------------------

  - id: qbm-martingale-property-01
    kind: work
    difficulty: demanding
    statement: >
      For which constant $c$ is $B_t^{3} - c\,t\,B_t$ a martingale with respect
      to the Brownian filtration?
    answer: >
      $c = 3$. Condition on $\mathcal{F}_s$ for $s < t$ and write
      $B_t = B_s + X$ with $X = B_t - B_s$ independent of the past,
      $\mathbb{E}[X] = 0$, $\mathbb{E}[X^{2}] = t - s$ and
      $\mathbb{E}[X^{3}] = 0$, since a mean-zero normal has vanishing odd
      moments. Expanding the cube,
      $\mathbb{E}[B_t^{3} \mid \mathcal{F}_s] = B_s^{3} +
      3B_s^{2}\mathbb{E}[X] + 3B_s\mathbb{E}[X^{2}] + \mathbb{E}[X^{3}] =
      B_s^{3} + 3B_s(t-s)$, while
      $\mathbb{E}[t B_t \mid \mathcal{F}_s] = tB_s$. The martingale requirement
      is that $B_s^{3} + 3B_s(t-s) - ctB_s$ equal $B_s^{3} - csB_s$; cancelling
      and dividing by $B_s$ leaves $3(t-s) - ct = -cs$, that is
      $(3 - c)(t - s) = 0$ for every $s < t$, so $c = 3$. The trap is
      pattern-matching the $-t$ in $B_t^{2} - t$ and answering $c = 1$: the
      compensator is whatever cancels the leftover, and the leftover from a cube
      carries the binomial factor $3$.
    expects: "3"
    rubric:
      - >
        Expands $(B_s + X)^{3}$ and uses $\mathbb{E}[X] = \mathbb{E}[X^{3}] = 0$
        with $\mathbb{E}[X^{2}] = t - s$.
      - >
        Requires the identity to hold for all $s < t$, which is what forces
        $c = 3$ rather than merely permitting it.
    targets:
      - quant-processes.brownian.martingale-property
    exercises:
      - quant-processes.brownian.bm

  - id: qbm-martingale-property-02
    kind: work
    difficulty: standard
    statement: >
      Use the exponential martingale $\exp(\lambda B_t - \lambda^{2}t/2)$ to
      compute $\mathbb{E}[e^{B_8/2}]$. Give four decimal places.
    answer: >
      $e \approx 2.7183$. The process $M_t = \exp(\lambda B_t -
      \lambda^{2}t/2)$ is a martingale for every real $\lambda$ and starts at
      $M_0 = \exp(0) = 1$, so $\mathbb{E}[M_t] = 1$ for all $t$, which
      rearranges to $\mathbb{E}[e^{\lambda B_t}] = e^{\lambda^{2}t/2}$. Taking
      $\lambda = 1/2$ and $t = 8$ gives
      $\mathbb{E}[e^{B_8/2}] = e^{(1/4)(8)/2} = e^{1} \approx 2.7183$. The same
      value is the normal moment generating function read off directly, since
      $B_8 \sim N(0,8)$ and $\mathbb{E}[e^{\lambda Y}] =
      e^{\lambda^{2}\sigma^{2}/2}$ for a mean-zero normal $Y$. The slip to avoid
      is exchanging the exponential with the expectation and answering
      $e^{\mathbb{E}[B_8/2]} = e^{0} = 1$: the exponential is convex, so
      Jensen's inequality already forces an answer above $1$, and the gap
      $e - 1 \approx 1.72$ is exactly what the $-\lambda^{2}t/2$ term
      compensates.
    expects: "2.7183"
    tolerance: 0.0005
    rubric:
      - >
        Sets $\mathbb{E}[M_t] = M_0 = 1$ and rearranges to
        $\mathbb{E}[e^{\lambda B_t}] = e^{\lambda^{2}t/2}$.
      - >
        Substitutes $\lambda = 1/2$ and $t = 8$ correctly, so the exponent is
        $1$ and not $2$ or $4$.
    targets:
      - quant-processes.brownian.martingale-property
    exercises:
      - quant-probability.continuous.normal

  - id: qbm-martingale-property-03
    kind: work
    difficulty: demanding
    statement: >
      For a fair $\pm 1$ walk stopped at $N = \min\{n : |S_n| = 12\}$, optional
      stopping on the discrete martingale $S_n^{2} - n$ gives
      $\mathbb{E}[N] = 144$. Under the same rescaling that carries
      $S_n^{2} - n$ to $B_t^{2} - t$, let $\tau = \inf\{t : |B_t| = 12\}$. What
      is $\mathbb{E}[\tau]$?
    answer: >
      $144$. The two martingales are one object seen on either side of Donsker's
      limit, and the argument transfers line for line. Stop $B_t^{2} - t$ at
      $\tau$ — legal because $\tau$ has finite mean and the stopped process is
      bounded by $144$ — and optional stopping gives
      $\mathbb{E}[B_\tau^{2}] - \mathbb{E}[\tau] = B_0^{2} - 0 = 0$. At $\tau$
      the path stands at $+12$ or $-12$, so $B_\tau^{2} = 144$ with probability
      $1$ and $\mathbb{E}[\tau] = 144 = 12^{2}$. That the discrete and
      continuous answers agree exactly is the point: one step of the walk
      carries one unit of variance and one unit of time, which is precisely
      $\operatorname{Var}(B_t) = t$ in the limit. The trap is reaching for the
      wrong martingale. Stopping $B_t$ instead gives $\mathbb{E}[B_\tau] = 0$,
      which is true but says only that the two exits are equally likely; it
      carries no information about how long the wait is.
    expects: "144"
    rubric:
      - >
        Chooses $B_t^{2} - t$ rather than $B_t$, and says why the first answers
        a time question and the second a probability question.
      - >
        Evaluates $\mathbb{E}[B_\tau^{2}] = 144$ from the fact that the stopped
        path is at $\pm 12$, then reads off $\mathbb{E}[\tau]$.
    targets:
      - quant-processes.brownian.martingale-property
      - quant-processes.martingales.examples-zoo
    exercises:
      - quant-processes.brownian.bm
    connects:
      - "quant-processes.brownian.martingale-property ~ quant-processes.martingales.examples-zoo"

  # --- quadratic variation -----------------------------------------------------

  - id: qbm-quadratic-variation-01
    kind: work
    difficulty: demanding
    statement: >
      Partition $[0,t]$ into $n$ equal pieces and let
      $Q_n = \sum_{i=1}^{n}(B_{t_i} - B_{t_{i-1}})^{2}$. How large must $n$ be
      for the standard deviation of $Q_n$ to be at most $1\%$ of $t$?
    answer: >
      $n = 20000$. Each squared increment has mean $\Delta = t/n$ and variance
      $2\Delta^{2}$, because the increment equals $\sqrt{\Delta}\,Z$ in law for
      a standard normal $Z$ and $\operatorname{Var}(Z^{2}) = 2$. The $n$ terms
      are independent, so $\mathbb{E}[Q_n] = n\Delta = t$ exactly for every $n$
      — no limit needed — and
      $\operatorname{Var}(Q_n) = 2n\Delta^{2} = 2n(t/n)^{2} = 2t^{2}/n$. The
      standard deviation is therefore $t\sqrt{2/n}$. Requiring
      $t\sqrt{2/n} \le 0.01t$ cancels $t$ outright and leaves
      $2/n \le 10^{-4}$, so $n \ge 20000$. Two things survive the arithmetic.
      The horizon drops out, so the same partition count serves $[0,1]$ and
      $[0,100]$ alike; and the concentration is slow, since halving the relative
      error costs four times as many pieces.
    expects: "20000"
    rubric:
      - >
        Derives $\operatorname{Var}(Q_n) = 2t^{2}/n$ from
        $\operatorname{Var}(Z^{2}) = 2$ and independence of the pieces.
      - >
        Notices that $t$ cancels, so the required $n$ does not depend on the
        horizon.
    targets:
      - quant-processes.brownian.quadratic-variation
    exercises:
      - quant-processes.brownian.scaling

  - id: qbm-quadratic-variation-02
    kind: work
    difficulty: standard
    statement: >
      Let $X_t = 3B_t$ for a standard Brownian motion $B$. What is the quadratic
      variation $\langle X \rangle_7$?
    answer: >
      $63$. Quadratic variation is built from squared increments, so a constant
      multiplier enters squared:
      $\sum_i (X_{t_i} - X_{t_{i-1}})^{2} = 9\sum_i (B_{t_i} -
      B_{t_{i-1}})^{2} \to 9t$, giving $\langle X \rangle_t = 9t$ and
      $\langle X \rangle_7 = 9 \cdot 7 = 63$. In differential shorthand the same
      statement is $(dX)^{2} = 9(dB)^{2} = 9\,dt$. A consistency check comes
      from the variance: $\operatorname{Var}(X_7) = 9 \cdot 7 = 63$ as well,
      because for a driftless scaled Brownian motion the quadratic variation and
      the variance coincide numerically. Answering $21$ scales by $\sigma = 3$
      instead of $\sigma^{2} = 9$ — the standard-deviation-versus-variance slip
      in its stochastic-calculus costume, and the same one that turns a
      four-fold horizon into a four-fold spread.
    expects: "63"
    rubric:
      - >
        Squares the multiplier, so the factor is $9$ and not $3$.
      - >
        States the general form $\langle \sigma B \rangle_t = \sigma^{2}t$
        rather than only the numerical answer.
    targets:
      - quant-processes.brownian.quadratic-variation
    exercises:
      - quant-processes.brownian.scaling

  - id: qbm-quadratic-variation-03
    kind: work
    difficulty: demanding
    statement: >
      Let $X_t = 2B_t + 5t$. What is the quadratic variation
      $\langle X \rangle_3$?
    answer: >
      $12$. Only the Brownian part contributes. Over a partition of mesh
      $\delta$ the drift piece changes by $5\Delta_i$, so its squared
      contribution is $25\sum_i \Delta_i^{2} \le 25\delta\sum_i \Delta_i =
      25\delta t \to 0$: any continuously differentiable, finite-variation term
      has quadratic variation $0$. The cross term dies too, since by
      Cauchy–Schwarz its absolute value is at most
      $2\sqrt{\sum_i (2\Delta B_i)^{2}}\sqrt{\sum_i (5\Delta_i)^{2}}$, whose
      second factor tends to $0$ while the first stays bounded near
      $\sqrt{4t}$. What survives is $\langle 2B \rangle_3 = 4 \cdot 3 = 12$, or
      $(dX)^{2} = 4\,dt$. The trap is folding the drift in and answering
      $4 \cdot 3 + 5 \cdot 3 = 27$, or worse $(2 + 5)^{2} \cdot 3 = 147$: drift
      moves the mean and never the quadratic variation, which is exactly why
      Itô's lemma keeps a second-order term in $dB$ and none in $dt$.
    expects: "12"
    rubric:
      - >
        Argues the drift term contributes $0$, via
        $\sum_i \Delta_i^{2} \le \delta t \to 0$ or by citing finite variation.
      - >
        Keeps the factor $\sigma^{2} = 4$ on the Brownian part, giving $12$
        rather than $6$.
    targets:
      - quant-processes.brownian.quadratic-variation
    exercises:
      - quant-processes.brownian.scaling

  # --- why the path is nowhere differentiable ----------------------------------

  - id: qbm-nondifferentiability-01
    kind: work
    difficulty: routine
    statement: >
      Over a window of length $h$ a Brownian increment is of typical size
      $\sqrt{h}$, so the difference quotient is of order $h^{-1/2}$. Evaluate
      $h^{-1/2}$ at $h = 4 \times 10^{-6}$.
    answer: >
      $500$. Take the square root first,
      $\sqrt{4 \times 10^{-6}} = 2 \times 10^{-3} = 0.002$, then invert:
      $1/0.002 = 500$. The number is the whole argument in miniature. The
      typical increment across this window is only about $0.002$ — tiny, as
      continuity demands — yet dividing by the far tinier $h = 0.000004$ leaves
      a slope of order $500$, and shrinking $h$ by a further factor of $100$
      multiplies that slope by $10$. There is no value for the difference
      quotient to settle down to, which is the heuristic behind
      nowhere-differentiability. Answering $h^{-1} = 250000$ confuses the
      increment's size $\sqrt{h}$ with $h$ itself, and answering
      $\sqrt{h} = 0.002$ reports the increment rather than the slope.
    expects: "500"
    rubric:
      - >
        Computes $\sqrt{h} = 0.002$ before inverting, rather than inverting $h$
        directly.
      - >
        Reads the answer as a slope that grows without bound as $h$ shrinks, not
        as a fixed large number.
    targets:
      - quant-processes.brownian.nondifferentiability
    exercises:
      - quant-processes.brownian.scaling

  - id: qbm-nondifferentiability-02
    kind: justify
    difficulty: demanding
    statement: >
      Give the one-line heuristic for why a Brownian path is nowhere
      differentiable, then prove rigorously that the path has infinite total
      variation on every interval.
    answer: >
      Heuristic: over a window of length $h$ the increment is of typical size
      $\sqrt{h}$, so the difference quotient $(B_{t+h} - B_t)/h$ is of order
      $\sqrt{h}/h = h^{-1/2}$, which diverges as $h \to 0$ rather than settling
      to a limit. That is only suggestive — a typical size is not every
      realization, and a fixed time is not every time — but the conclusion is a
      theorem: with probability $1$ the path is differentiable at no time at
      all. The rigorous companion statement follows from quadratic variation.
      For any partition of $[0,t]$, factor out the largest jump:
      $\sum_i (\Delta B_i)^{2} \le \left(\max_i |\Delta B_i|\right)
      \sum_i |\Delta B_i|$. Continuity on a compact interval gives uniform
      continuity, so $\max_i |\Delta B_i| \to 0$ as the mesh shrinks. If the
      total variation $\sum_i |\Delta B_i|$ stayed bounded, the right-hand side
      would be a bounded quantity times something tending to $0$, forcing
      $\sum_i (\Delta B_i)^{2} \to 0$. But that sum converges to $t > 0$. The
      contradiction shows the total variation is infinite on every interval,
      however short. This is exactly why $\int f\,dB$ cannot be built as a
      pathwise Riemann–Stieltjes integral, and it matches the sharp regularity:
      paths are Hölder continuous of every order $\alpha < 1/2$ and of no order
      $\alpha \ge 1/2$.
    rubric:
      - >
        Produces the $\sqrt{h}/h = h^{-1/2}$ heuristic and says explicitly that
        it is a heuristic, not the proof.
      - >
        Runs the bound
        $\sum (\Delta B)^{2} \le (\max|\Delta B|)\sum|\Delta B|$ and derives the
        contradiction with $\langle B \rangle_t = t$.
    targets:
      - quant-processes.brownian.nondifferentiability
    exercises:
      - quant-processes.brownian.quadratic-variation

  - id: qbm-nondifferentiability-03
    kind: decide
    difficulty: demanding
    statement: >
      Which statement about the sample paths of a standard Brownian motion holds
      with probability $1$?
    answer: >
      With probability $1$ the path is differentiable at no time at all. The
      heuristic is the size mismatch — an increment over a window of length $h$
      is of order $\sqrt{h}$, so the difference quotient is of order
      $h^{-1/2} \to \infty$ — and the theorem upgrades "at a fixed time, almost
      surely" to "almost surely, at every time simultaneously", which is why the
      exceptional set is empty rather than merely small. The last option inverts
      the two variations and is worth pinning down. Quadratic variation is
      finite, equal to $t$, and it is precisely that finiteness at a nonzero
      value which forces the total variation to be infinite, through
      $\sum_i (\Delta B_i)^{2} \le (\max_i |\Delta B_i|)\sum_i |\Delta B_i|$
      together with $\max_i |\Delta B_i| \to 0$. Ordinary calculus has the
      pattern the other way round: a continuously differentiable path has finite
      total variation and quadratic variation $0$.
    choices:
      - text: >
          The path is differentiable at almost every time, and fails to be
          differentiable only on a set of Lebesgue measure $0$.
        feedback: >
          That is the picture for an ordinary continuous function of bounded
          variation. Brownian motion is the opposite case: the exceptional set
          is everything.
      - text: >
          The path is differentiable at no time whatsoever.
        correct: true
        feedback: >
          The failure is simultaneous at every time, not confined to isolated
          points — a far stronger statement than "continuous but jagged in
          places".
      - text: >
          The path is differentiable except at the countably many times it
          returns to $0$.
        feedback: >
          The zero set is uncountable, and in any case the path is no better
          behaved away from it — differentiability has nothing to do with the
          level the path happens to sit at.
      - text: >
          The path has finite total variation but infinite quadratic variation.
        feedback: >
          Exactly backwards. Quadratic variation is finite and equals $t$; total
          variation is infinite, and finite total variation would force the
          quadratic variation to $0$.
    rubric:
      - >
        States that non-differentiability holds at every time simultaneously,
        not merely at almost every time.
      - >
        Gets the two variations the right way round: quadratic variation $t$,
        total variation infinite.
    targets:
      - quant-processes.brownian.nondifferentiability
    exercises:
      - quant-processes.brownian.quadratic-variation

  # --- the reflection principle -------------------------------------------------

  - id: qbm-reflection-bm-01
    kind: work
    difficulty: demanding
    statement: >
      What is the probability that a standard Brownian motion stays strictly
      below $4.5$ throughout $[0,9]$? Use $\Phi(1.5) = 0.9332$ and give four
      decimal places.
    answer: >
      $0.8664$. The event is the complement of $\{M_9 \ge 4.5\}$, where
      $M_t = \max_{0 \le s \le t} B_s$ is the running maximum. Reflection gives
      $\Pr(M_t \ge a) = 2(1 - \Phi(a/\sqrt{t}))$, and here
      $a/\sqrt{t} = 4.5/\sqrt{9} = 4.5/3 = 1.5$, so
      $\Pr(M_9 \ge 4.5) = 2(1 - 0.9332) = 2(0.0668) = 0.1336$ and the answer is
      $1 - 0.1336 = 0.8664$. Equivalently,
      $\Pr(M_t < a) = 2\Phi(a/\sqrt{t}) - 1 = 2(0.9332) - 1 = 0.8664$. The slip
      the factor of $2$ exists to prevent is answering
      $\Phi(1.5) = 0.9332$, which is $\Pr(B_9 < 4.5)$ — the probability of
      finishing below the level, an event that silently admits every path which
      touched $4.5$ and came back down. The gap between $0.9332$ and $0.8664$ is
      exactly that population of round trips.
    expects: "0.8664"
    tolerance: 0.0005
    rubric:
      - >
        Converts the "never touches" event into the complement of
        $\{M_9 \ge 4.5\}$ before computing anything.
      - >
        Keeps the factor of $2$ in $\Pr(M_t \ge a)$, so the answer is not
        $\Phi(1.5)$.
    targets:
      - quant-processes.brownian.reflection-bm
    exercises:
      - quant-processes.brownian.markov-property

  - id: qbm-reflection-bm-02
    kind: work
    difficulty: standard
    statement: >
      Find the level $a$ for which a standard Brownian motion has probability
      exactly $0.05$ of ever reaching $a$ during $[0,16]$. Use
      $\Phi(1.96) = 0.975$.
    answer: >
      $a = 7.84$. Reflection gives
      $\Pr(M_{16} \ge a) = 2(1 - \Phi(a/\sqrt{16})) = 2(1 - \Phi(a/4))$.
      Setting that to $0.05$ halves the tail: $1 - \Phi(a/4) = 0.025$, so
      $\Phi(a/4) = 0.975$ and $a/4 = 1.96$, giving $a = 4(1.96) = 7.84$. The
      halving is the whole exercise, and it explains why a barrier question and
      a two-sided endpoint question land on the same quantile: since
      $\Pr(M_t \ge a) = \Pr(|B_t| \ge a)$, the level touched with probability
      $0.05$ is exactly the level a $95\%$ two-sided interval for $B_{16}$
      reaches. Forgetting the factor of $2$ and solving
      $1 - \Phi(a/4) = 0.05$ instead gives $a = 4(1.645) = 6.58$, understating
      the level by well over a unit and, in a barrier-pricing setting,
      understating the knock-out risk.
    expects: "7.84"
    rubric:
      - >
        Halves the target probability before inverting $\Phi$, so the quantile
        is $1.96$ and not $1.645$.
      - >
        Multiplies by $\sqrt{16} = 4$ rather than by $16$ when converting the
        quantile back to a level.
    targets:
      - quant-processes.brownian.reflection-bm
    exercises:
      - quant-probability.continuous.standardization

  - id: qbm-reflection-bm-03
    kind: justify
    difficulty: demanding
    statement: >
      Prove the reflection principle $\Pr(M_t \ge a) = 2\Pr(B_t \ge a)$ for
      $a > 0$, and say exactly where the strong Markov property is used.
    answer: >
      Let $\tau_a = \inf\{s : B_s = a\}$, so that $\{M_t \ge a\}$ and
      $\{\tau_a \le t\}$ are the same event, and split it by where the path
      finishes. On $\{\tau_a \le t\}$ apply the strong Markov property at the
      random time $\tau_a$ — legal because a first hitting time is a stopping
      time, decidable from the path so far — which says the restarted process
      $W_u = B_{\tau_a + u} - a$ is a standard Brownian motion independent of
      everything up to $\tau_a$. That is the single place the theorem enters,
      and nothing weaker will do: $\tau_a$ is random, so an ordinary
      fixed-time Markov restart does not apply. Because $W$ is symmetric, given
      the past it is equally likely to finish above or below $a$, so
      $\Pr(M_t \ge a,\, B_t > a) = \Pr(M_t \ge a,\, B_t < a)$. The first of
      these collapses, since finishing above $a$ already forces the maximum
      above $a$: $\Pr(M_t \ge a,\, B_t > a) = \Pr(B_t > a)$. Adding the two
      halves gives $\Pr(M_t \ge a) = 2\Pr(B_t > a) =
      2(1 - \Phi(a/\sqrt{t}))$. The boundary case costs nothing, because
      $\Pr(B_t = a) = 0$ for a continuous law, so $\Pr(B_t > a)$ and
      $\Pr(B_t \ge a)$ agree.
    rubric:
      - >
        Applies the strong Markov property at $\tau_a$ and explains why a
        fixed-time restart would not suffice.
      - >
        Collapses $\Pr(M_t \ge a,\, B_t > a)$ to $\Pr(B_t > a)$ by noting that
        finishing above $a$ forces $M_t \ge a$, and disposes of the boundary
        case.
    targets:
      - quant-processes.brownian.reflection-bm
    exercises:
      - quant-processes.brownian.markov-property
      - quant-processes.random-walks.reflection

  - id: qbm-reflection-bm-04
    kind: decide
    difficulty: standard
    statement: >
      For $a > 0$, which expression equals $\Pr(M_t < a)$, the probability that
      a standard Brownian motion never reaches level $a$ during $[0,t]$?
    answer: >
      $\Pr(M_t < a) = 2\Phi(a/\sqrt{t}) - 1$. Start from reflection,
      $\Pr(M_t \ge a) = 2(1 - \Phi(a/\sqrt{t}))$, and complement:
      $1 - 2 + 2\Phi(a/\sqrt{t}) = 2\Phi(a/\sqrt{t}) - 1$. Two limits confirm
      it. As $a \to \infty$ the expression tends to $2(1) - 1 = 1$, since a
      distant level is never reached; as $a \to 0^{+}$ it tends to
      $2(1/2) - 1 = 0$, since the path revisits $0$ immediately after time $0$.
      It also matches the other face of the identity, because
      $\Pr(M_t < a) = \Pr(|B_t| < a) = \Phi(a/\sqrt{t}) - \Phi(-a/\sqrt{t}) =
      2\Phi(a/\sqrt{t}) - 1$. Reaching for $\Phi(a/\sqrt{t})$ answers a question
      about where the path finishes rather than about whether it ever touched,
      and it is the single most common error in barrier problems.
    choices:
      - text: >
          $\Phi(a/\sqrt{t})$
        feedback: >
          This is $\Pr(B_t < a)$, the chance of finishing below the level. It
          counts as successes all the paths that touched $a$ and returned, so it
          is too large.
      - text: >
          $2\Phi(a/\sqrt{t}) - 1$
        correct: true
        feedback: >
          Complementing the reflection identity gives
          $1 - 2(1 - \Phi(a/\sqrt{t})) = 2\Phi(a/\sqrt{t}) - 1$, which is also
          $\Pr(|B_t| < a)$, exactly as reflection demands.
      - text: >
          $1 - 2\Phi(a/\sqrt{t})$
        feedback: >
          This is negative whenever $\Phi(a/\sqrt{t}) > 1/2$, which holds for
          every $a > 0$ — a sign the complement was taken on the wrong side.
      - text: >
          $2(1 - \Phi(a/\sqrt{t}))$
        feedback: >
          This is $\Pr(M_t \ge a)$ itself, the probability of the opposite
          event.
    rubric:
      - >
        Complements the reflection formula rather than the plain normal tail.
      - >
        Checks the limits $a \to \infty$ and $a \to 0^{+}$, or the identity with
        $\Pr(|B_t| < a)$.
    targets:
      - quant-processes.brownian.reflection-bm
    exercises:
      - quant-probability.continuous.standardization

  # --- the running maximum ------------------------------------------------------

  - id: qbm-running-max-law-01
    kind: work
    difficulty: demanding
    statement: >
      Compute $\Pr(M_4 \ge 3,\ B_4 \le 1)$, where $M_4$ is the running maximum
      of a standard Brownian motion over $[0,4]$. Use $\Phi(2.5) = 0.9938$ and
      give four decimal places.
    answer: >
      $0.0062$. The joint reflection identity is
      $\Pr(M_t \ge a,\, B_t \le b) = \Pr(B_t \ge 2a - b)$, valid whenever
      $a \ge \max(b,0)$; here $a = 3$ and $b = 1$, and
      $3 \ge \max(1,0) = 1$, so it applies. Mirroring the endpoint in the level
      gives $2a - b = 2(3) - 1 = 5$, and $B_4 \sim N(0,4)$ has standard
      deviation $2$, so
      $\Pr(B_4 \ge 5) = 1 - \Phi(5/2) = 1 - \Phi(2.5) = 1 - 0.9938 = 0.0062$.
      The picture behind the algebra: reflect the path in the horizontal line at
      height $a$ after its first touch, and a finish at $b$ becomes a finish at
      its mirror image $2a - b$. Two errors are worth naming. Multiplying by $2$
      — importing the marginal formula's factor — double-counts, because this
      mirroring is a bijection rather than a two-to-one split. And using
      $a - b = 2$ in place of $2a - b = 5$ reflects in the wrong line and
      inflates the answer to about $1 - \Phi(1) = 0.1587$.
    expects: "0.0062"
    tolerance: 0.0005
    rubric:
      - >
        Checks $a \ge \max(b,0)$ before applying the joint formula.
      - >
        Uses the mirrored endpoint $2a - b = 5$ and does not attach an extra
        factor of $2$.
    targets:
      - quant-processes.brownian.running-max-law
    exercises:
      - quant-processes.brownian.reflection-bm

  - id: qbm-running-max-law-02
    kind: work
    difficulty: standard
    statement: >
      For what horizon $t$ does the expected running maximum
      $\mathbb{E}[M_t]$ equal $5$? Give four decimal places.
    answer: >
      $t = 25\pi/2 \approx 39.2699$. Reflection makes $M_t$ a folded normal with
      the law of $|B_t|$, so $\mathbb{E}[M_t] = \mathbb{E}|B_t| =
      \sqrt{2t/\pi}$. Setting $\sqrt{2t/\pi} = 5$ and squaring gives
      $2t/\pi = 25$, so $t = 25\pi/2 \approx 39.2699$; substituting back,
      $\sqrt{2(39.2699)/\pi} = \sqrt{25} = 5$. Two traps sit in this one line.
      Using $\mathbb{E}[M_t] = \sqrt{t}$ — the endpoint's standard deviation —
      drops the folding factor $\sqrt{2/\pi} \approx 0.798$ and returns
      $t = 25$, understating the horizon by more than a third. And arguing from
      $\mathbb{E}[M_t^{2}] = t = \mathbb{E}[B_t^{2}]$ that $M_t$ and $B_t$ share
      a law is wrong: they agree on that one moment and on nothing else, their
      means already differing by $\sqrt{2t/\pi}$ against $0$.
    expects: "39.2699"
    tolerance: 0.0005
    rubric:
      - >
        Uses the folded-normal mean $\sqrt{2t/\pi}$, not $\sqrt{t}$.
      - >
        Squares the relation correctly, giving $t = 25\pi/2$ rather than
        $t = 25$ or $t = 5\pi/2$.
    targets:
      - quant-processes.brownian.running-max-law
    exercises:
      - quant-processes.brownian.reflection-bm

  - id: qbm-running-max-law-03
    kind: decide
    difficulty: demanding
    statement: >
      A candidate observes that $\mathbb{E}[M_t^{2}] = t = \mathbb{E}[B_t^{2}]$
      and concludes that the running maximum and the endpoint have the same
      distribution. What is the correct assessment?
    answer: >
      The conclusion is wrong and the premise is right, which is what makes the
      trap effective. Reflection gives $M_t$ the law of $|B_t|$, and folding a
      symmetric variable leaves $x^{2}$ untouched, so
      $\mathbb{E}[M_t^{2}] = \mathbb{E}[B_t^{2}] = t$ genuinely holds.
      Everything else differs: $M_t \ge 0$ with probability $1$ while $B_t$ is
      symmetric about $0$; $\mathbb{E}[M_t] = \sqrt{2t/\pi} \approx
      0.798\sqrt{t}$ against $\mathbb{E}[B_t] = 0$; and
      $\operatorname{Var}(M_t) = t - 2t/\pi = t(1 - 2/\pi) \approx 0.363t$
      against $\operatorname{Var}(B_t) = t$. One matching moment never
      identifies a law. The practical version of the confusion is quoting the
      endpoint's distribution when asked for the high-water mark of a driftless
      price: the peak sits systematically above the finish, by $\sqrt{2t/\pi}$
      in expectation, and the drawdown $M_t - B_t$ from that peak is itself
      another copy of $|B_t|$.
    choices:
      - text: >
          Correct — matching second moments of two mean-zero quantities forces
          equality in law.
        feedback: >
          Neither variable is mean-zero here, since
          $\mathbb{E}[M_t] = \sqrt{2t/\pi} > 0$, and in any case one matching
          moment never determines a distribution.
      - text: >
          Wrong — $M_t$ has the law of $|B_t|$, so it agrees with $B_t$ on this
          moment alone; $M_t \ge 0$ always, while $B_t$ is symmetric about $0$.
        correct: true
        feedback: >
          The shared second moment is an artefact of folding, which preserves
          $x^{2}$ exactly and changes everything else about the law.
      - text: >
          Wrong — $\mathbb{E}[M_t^{2}]$ is actually $2t$, so the premise itself
          is false.
        feedback: >
          The premise is right. $M_t$ has the law of $|B_t|$ and
          $|B_t|^{2} = B_t^{2}$, so the second moments genuinely coincide at
          $t$.
      - text: >
          Correct, but only for $t \le 1$.
        feedback: >
          Nothing here depends on the horizon — self-similarity makes every $t$
          a relabelling of $t = 1$.
    rubric:
      - >
        Accepts the premise $\mathbb{E}[M_t^{2}] = t$ rather than disputing it,
        and locates the error in the inference.
      - >
        Separates the two laws by a concrete difference — nonnegativity, the
        mean $\sqrt{2t/\pi}$, or the variance $t(1 - 2/\pi)$.
    targets:
      - quant-processes.brownian.running-max-law
    exercises:
      - quant-processes.brownian.reflection-bm

  # --- hitting a level ----------------------------------------------------------

  - id: qbm-hitting-time-01
    kind: work
    difficulty: standard
    statement: >
      For a standard Brownian motion let $\tau_5$ be the first time level $5$ is
      reached. Compute $\Pr(\tau_5 \le 16)$. Use $\Phi(1.25) = 0.8944$ and give
      four decimal places.
    answer: >
      $0.2112$. The event $\{\tau_a \le t\}$ is literally the event
      $\{M_t \ge a\}$ — the level has been reached by time $t$ exactly when the
      running maximum has got there — so reflection supplies the answer with no
      new argument:
      $\Pr(\tau_5 \le 16) = 2(1 - \Phi(5/\sqrt{16})) = 2(1 - \Phi(1.25)) =
      2(1 - 0.8944) = 2(0.1056) = 0.2112$. The factor of $2$ carries the whole
      content. The quantity $\Pr(B_{16} \ge 5) = 0.1056$ counts only paths that
      finish at or above $5$ and misses every path that touched the level and
      drifted back below it before time $16$, so the chance of a visit is
      exactly twice the chance of a finish. That is also why a barrier claim
      that pays on any touch is worth more than the otherwise identical claim
      that pays only on the terminal value.
    expects: "0.2112"
    tolerance: 0.0005
    rubric:
      - >
        Identifies $\{\tau_a \le t\}$ with $\{M_t \ge a\}$ before reaching for
        any formula.
      - >
        Standardizes by $\sqrt{16} = 4$ and keeps the factor of $2$.
    targets:
      - quant-processes.brownian.hitting-time
    exercises:
      - quant-processes.brownian.reflection-bm

  - id: qbm-hitting-time-02
    kind: work
    difficulty: demanding
    statement: >
      For a standard Brownian motion, find the median of the hitting time
      $\tau_5$ of level $5$ — the time $t$ with $\Pr(\tau_5 \le t) = 1/2$. Use
      $\Phi(0.6745) = 0.75$ and give the answer to two decimal places.
    answer: >
      $\approx 54.95$. Set the reflection formula to a half:
      $2(1 - \Phi(5/\sqrt{t})) = 0.5$, so $\Phi(5/\sqrt{t}) = 0.75$ and
      $5/\sqrt{t} = 0.6745$. Then $\sqrt{t} = 5/0.6745 = 7.4129$ and
      $t = 7.4129^{2} \approx 54.95$. Notice the halving: a median hitting time
      is read off the upper quartile of the normal, not off its median, and that
      is entirely because of reflection's factor of $2$. Self-similarity
      confirms the shape, since $\tau_a$ has the law of $a^{2}\tau_1$: the
      median of $\tau_1$ is $1/(0.6745)^{2} \approx 2.198$, so the median of
      $\tau_5$ is $25(2.198) \approx 54.95$. Distance costs quadratically in
      time — five times the level, twenty-five times the typical wait — while
      $\mathbb{E}[\tau_5]$ stays infinite regardless, dragged there by the
      $t^{-3/2}$ tail of the hitting density.
    expects: "54.95"
    tolerance: 0.05
    rubric:
      - >
        Halves the target probability, so the quantile solved for is
        $\Phi^{-1}(0.75)$ and not $\Phi^{-1}(0.5) = 0$.
      - >
        Squares to recover $t$, and notes that the median scales as $a^{2}$
        while the mean is infinite.
    targets:
      - quant-processes.brownian.hitting-time
    exercises:
      - quant-processes.brownian.reflection-bm
      - quant-processes.brownian.scaling

  - id: qbm-hitting-time-03
    kind: work
    difficulty: routine
    statement: >
      The median of the hitting time $\tau_a$ scales as $a^{2}$. If level $2$ is
      reached within $8.8$ time units half the time, what is the median hitting
      time of level $6$?
    answer: >
      $79.2$. Self-similarity gives $\tau_a$ the law of $a^{2}\tau_1$, so every
      quantile of the hitting time — the median included — scales by $a^{2}$.
      Going from $a = 2$ to $a = 6$ triples the level and therefore multiplies
      the median by $3^{2} = 9$, giving $8.8 \times 9 = 79.2$ time units. The
      same answer through $\tau_1$: its median is $8.8/2^{2} = 2.2$, and
      $6^{2}(2.2) = 36(2.2) = 79.2$. The trap is scaling linearly and answering
      $8.8 \times 3 = 26.4$, which is the displacement law read backwards —
      distance grows like $\sqrt{t}$, so time grows like distance squared. Note
      what does not scale at all: $\mathbb{E}[\tau_a] = \infty$ for every
      $a > 0$, so no finite multiple relates the means of these two waits.
    expects: "79.2"
    rubric:
      - >
        Scales by $(6/2)^{2} = 9$, not by $6/2 = 3$.
      - >
        Attributes the quadratic scaling to $\tau_a$ having the law of
        $a^{2}\tau_1$.
    targets:
      - quant-processes.brownian.hitting-time
    exercises:
      - quant-processes.brownian.scaling

  # --- two-sided exit -----------------------------------------------------------

  - id: qbm-two-sided-exit-01
    kind: work
    difficulty: demanding
    statement: >
      A standard Brownian motion runs until it leaves the band $(-b, a)$, with
      $a, b > 0$. The exit occurs at the upper barrier with probability $0.4$,
      and the expected duration is $24$. Find $a$.
    answer: >
      $a = 6$, with $b = 4$. Two martingales give two equations. Optional
      stopping on $B_t$ gives $0 = \mathbb{E}[B_\tau] = ap - b(1-p)$, so
      $p = b/(a+b)$; setting that to $0.4$ yields $0.6b = 0.4a$, that is
      $b = (2/3)a$. Optional stopping on $B_t^{2} - t$ gives
      $\mathbb{E}[\tau] = \mathbb{E}[B_\tau^{2}] = a^{2}\frac{b}{a+b} +
      b^{2}\frac{a}{a+b} = ab$; setting $ab = 24$ and substituting
      $b = (2/3)a$ gives $(2/3)a^{2} = 24$, so $a^{2} = 36$ and $a = 6$. Check
      both conditions: $b/(a+b) = 4/10 = 0.4$ and $ab = 6(4) = 24$. The named
      slip is inverting the ruin formula and writing $p = a/(a+b)$, which puts
      the near barrier in the numerator. The correct reading is that a path
      exits more often at the barrier it starts closer to, so an upper-barrier
      probability of only $0.4$ means the upper barrier is the farther one,
      $a > b$.
    expects: "6"
    rubric:
      - >
        Uses $p = b/(a+b)$ with the opposite distance in the numerator, and
        sanity-checks the direction against $p < 1/2$.
      - >
        Uses $\mathbb{E}[\tau] = ab$ from the compensated square, then solves
        the two equations simultaneously.
    targets:
      - quant-processes.brownian.two-sided-exit
    exercises:
      - quant-processes.brownian.martingale-property
      - quant-processes.martingales.ost

  - id: qbm-two-sided-exit-02
    kind: work
    difficulty: standard
    statement: >
      A standard Brownian motion runs until it hits $+3$ or $-7$. What is the
      probability that it hits $+3$ first?
    answer: >
      $0.7$. Optional stopping on the martingale $B_t$ at the exit time $\tau$
      — legal because $\tau$ has finite mean and the stopped process stays
      between $-7$ and $3$ — gives
      $0 = B_0 = \mathbb{E}[B_\tau] = 3p + (-7)(1 - p)$, so $10p = 7$ and
      $p = 7/10 = 0.7$. The general form is $p = b/(a+b)$ with $a = 3$ the
      upper distance and $b = 7$ the lower: the opposite distance sits in the
      numerator, so the nearer barrier is the likelier exit. The reason is that
      a fair game conserves its expected value, and the only way to balance a
      small gain of $3$ against a large loss of $7$ is to make the small gain
      much more frequent. Answering $3/10 = 0.3$ puts the wrong distance on top;
      the sanity check is that $p = 0.3$ would make the expected exit value
      $3(0.3) - 7(0.7) = -4$ rather than $0$.
    expects: "0.7"
    tolerance: 0.0005
    rubric:
      - >
        Applies optional stopping to $B_t$ and solves $ap = b(1-p)$ rather than
        guessing a ratio.
      - >
        Checks the answer by verifying $\mathbb{E}[B_\tau] = 0$.
    targets:
      - quant-processes.brownian.two-sided-exit
    exercises:
      - quant-processes.brownian.martingale-property
      - quant-processes.martingales.ost

  - id: qbm-two-sided-exit-03
    kind: decide
    difficulty: standard
    statement: >
      A standard Brownian motion runs until it exits the band $(-8, 2)$. Which
      pairing of the exit probability $p$ at the upper barrier $a = 2$ with the
      expected duration $\mathbb{E}[\tau]$ is correct?
    answer: >
      $p = 0.8$ with $\mathbb{E}[\tau] = 16$. Each number comes from its own
      martingale and the two never swap roles. Optional stopping on $B_t$ gives
      $0 = 2p - 8(1-p)$, so $10p = 8$ and $p = 0.8$: the barrier the path starts
      nearer is the likelier exit, which is the only way a fair game can balance
      a frequent small gain against a rare large loss. Optional stopping on
      $B_t^{2} - t$ gives
      $\mathbb{E}[\tau] = \mathbb{E}[B_\tau^{2}] = 4(0.8) + 64(0.2) =
      3.2 + 12.8 = 16$, matching the general formula $ab = 2(8)$. The reliable
      structural check is that the expected duration must be a product and never
      a sum: it has the dimensions of a squared distance, so doubling both
      barriers quadruples it, whereas the width $a + b$ would only double.
    choices:
      - text: >
          $p = 0.8$ and $\mathbb{E}[\tau] = 16$
        correct: true
        feedback: >
          $p = b/(a+b) = 8/10 = 0.8$ and $\mathbb{E}[\tau] = ab = 2(8) = 16$ —
          the near barrier is the likely exit, and the duration is the product
          of the two distances.
      - text: >
          $p = 0.2$ and $\mathbb{E}[\tau] = 16$
        feedback: >
          The duration is right but the probability is inverted — $a/(a+b)$
          instead of $b/(a+b)$. The upper barrier is only $2$ away, so it should
          be the likely exit, not the unlikely one.
      - text: >
          $p = 0.8$ and $\mathbb{E}[\tau] = 10$
        feedback: >
          Here $10$ is the width $a + b$. The expected duration is the product
          $ab$, which comes from $\mathbb{E}[B_\tau^{2}]$, not from the width of
          the band.
      - text: >
          $p = 0.5$ and $\mathbb{E}[\tau] = 25$
        feedback: >
          This treats the band as symmetric. Symmetric barriers would give
          $p = 1/2$ and $\mathbb{E}[\tau] = a^{2}$, but $(-8,2)$ is not
          symmetric about the starting point $0$.
    rubric:
      - >
        Reads $p = b/(a+b)$ with the opposite distance on top, so the nearer
        barrier is the likelier exit.
      - >
        Uses $\mathbb{E}[\tau] = ab$, a product of the two distances, rather
        than the width $a + b$.
    targets:
      - quant-processes.brownian.two-sided-exit
    exercises:
      - quant-processes.brownian.martingale-property
      - quant-processes.martingales.ost

  # --- Brownian motion with drift -----------------------------------------------

  - id: qbm-bm-with-drift-01
    kind: work
    difficulty: demanding
    statement: >
      A strategy's cumulative profit follows $X_t = 0.05t + 0.2B_t$ with
      $X_0 = 0$, time measured in years. What is the probability that it is
      under water at the sixteen-year mark, $\Pr(X_{16} < 0)$? Use
      $\Phi(1) = 0.8413$ and give four decimal places.
    answer: >
      $0.1587$. The two terms scale by different powers of $t$, and that is the
      entire computation. The mean is $\mu t = 0.05(16) = 0.8$, growing
      linearly; the standard deviation is $\sigma\sqrt{t} = 0.2\sqrt{16} =
      0.2(4) = 0.8$, growing only as a square root. So
      $X_{16} \sim N(0.8,\, 0.64)$ and
      $\Pr(X_{16} < 0) = \Pr(Z < (0 - 0.8)/0.8) = \Pr(Z < -1) = 1 - \Phi(1) =
      1 - 0.8413 = 0.1587$. At this particular horizon drift and noise happen to
      coincide, which is exactly the statement that the accumulated Sharpe ratio
      $(\mu/\sigma)\sqrt{t} = 0.25(4) = 1$ has reached one standard error. The
      trap is scaling volatility linearly: $\sigma t = 0.2(16) = 3.2$ would give
      $z = -0.25$ and an overstated loss probability near $0.40$.
    expects: "0.1587"
    tolerance: 0.0005
    rubric:
      - >
        Scales the drift by $t$ and the standard deviation by $\sqrt{t}$, giving
        $0.8$ for each here.
      - >
        Standardizes with the correct sign, so the answer is the lower tail
        $1 - \Phi(1)$ rather than $\Phi(1)$.
    targets:
      - quant-processes.brownian.bm-with-drift
    exercises:
      - quant-processes.brownian.bm

  - id: qbm-bm-with-drift-02
    kind: work
    difficulty: routine
    statement: >
      Let $X_t = 3 + 0.1t + 0.4B_t$. What is $\operatorname{Var}(X_{25})$?
    answer: >
      $4$. Only the Brownian term is random. At a fixed time the starting level
      $3$ and the drift term $0.1(25) = 2.5$ are deterministic constants, and
      adding a constant never changes a variance, so
      $\operatorname{Var}(X_{25}) = \operatorname{Var}(0.4B_{25}) =
      0.4^{2}\operatorname{Var}(B_{25}) = 0.16(25) = 4$. The full law is
      $X_{25} \sim N(5.5,\, 4)$, mean $3 + 2.5 = 5.5$ and standard deviation
      $\sqrt{4} = 2$. Two slips are worth naming: folding the drift into the
      spread, for instance by answering $0.16(25) + 0.1(25) = 6.5$, treats a
      deterministic shift as noise; and forgetting to square the volatility
      gives $0.4(25) = 10$. Variance carries $\sigma^{2}$ and $t$ and nothing
      else — the drift touches neither factor.
    expects: "4"
    rubric:
      - >
        Discards the constant and the drift term, since neither contributes to a
        variance.
      - >
        Squares the volatility, so the coefficient is $0.16$ and not $0.4$.
    targets:
      - quant-processes.brownian.bm-with-drift
    exercises:
      - quant-processes.brownian.bm

  - id: qbm-bm-with-drift-03
    kind: work
    difficulty: demanding
    statement: >
      A strategy's cumulative profit is $X_t = \mu t + \sigma B_t$ with annual
      Sharpe ratio $\mu/\sigma = 0.4$. Over what horizon $t$, in years, does the
      accumulated drift reach three times the standard deviation of the
      cumulative profit?
    answer: >
      $t = 56.25$ years. After $t$ years the drift is $\mu t$ and the standard
      deviation is $\sigma\sqrt{t}$, so their ratio is
      $\mu t/(\sigma\sqrt{t}) = (\mu/\sigma)\sqrt{t} = 0.4\sqrt{t}$ — the annual
      Sharpe ratio multiplied by $\sqrt{t}$, never by $t$. Setting
      $0.4\sqrt{t} = 3$ gives $\sqrt{t} = 7.5$ and $t = 7.5^{2} = 56.25$. That
      number is the practical content of the node: a genuinely good strategy,
      Sharpe $0.4$, needs more than half a century of live track record before
      its drift stands three standard errors clear of zero, which is why edges
      are invisible over short samples even when they are real. The trap is
      scaling the ratio linearly and answering $3/0.4 = 7.5$ years, mistaking
      $\sqrt{t}$ for $t$ and understating the requirement by a factor of $7.5$.
    expects: "56.25"
    rubric:
      - >
        Forms the ratio $(\mu/\sigma)\sqrt{t}$, recognising that only the
        Sharpe ratio and $\sqrt{t}$ enter.
      - >
        Squares after isolating $\sqrt{t}$, so the answer is $56.25$ and not
        $7.5$.
    targets:
      - quant-processes.brownian.bm-with-drift
    exercises:
      - quant-processes.brownian.bm

  # --- hitting under drift --------------------------------------------------------

  - id: qbm-drift-hitting-01
    kind: work
    difficulty: demanding
    statement: >
      A fund's log-equity follows $X_t = \mu t + \sigma B_t$ with $\mu = 0.09$
      and $\sigma = 0.30$ per year. What is the probability that it ever falls
      $0.30$ below its starting level? Use $e^{-0.6} \approx 0.5488$ and give
      four decimal places.
    answer: >
      $0.5488$. Since
      $\mathbb{E}[e^{\theta X_t}] = e^{(\theta\mu + \theta^{2}\sigma^{2}/2)t}$,
      the process $e^{\theta X_t}$ is a martingale exactly when
      $\theta\mu + \theta^{2}\sigma^{2}/2 = 0$, that is at $\theta = 0$ and at
      the working root $\theta = -2\mu/\sigma^{2}$. Optional stopping with that
      root, in the limit of an infinitely distant upper barrier, gives the
      one-sided formula $\Pr(\inf_t X_t \le -b) = e^{-2\mu b/\sigma^{2}}$ for
      $\mu > 0$. Here $2\mu/\sigma^{2} = 2(0.09)/0.09 = 2$, so the probability
      is $e^{-2(0.30)} = e^{-0.6} \approx 0.5488$. Read it as a warning: a
      Sharpe ratio of $0.3$ still leaves better than a coin flip of a $30\%$
      drawdown at some point, because $\sigma$ enters the exponent squared. The
      trap is writing $2\mu b/\sigma$ instead, which gives
      $e^{-0.18} \approx 0.8353$ — dimensionally wrong, since what the drift
      must overcome is accumulated variance $\sigma^{2}t$, not accumulated
      volatility.
    expects: "0.5488"
    tolerance: 0.0005
    rubric:
      - >
        Finds the nonzero root $\theta = -2\mu/\sigma^{2}$ of the exponent
        rather than guessing the formula.
      - >
        Squares the volatility in the exponent, giving $2\mu b/\sigma^{2} = 0.6$
        and not $0.18$.
    targets:
      - quant-processes.brownian.drift-hitting
    exercises:
      - quant-processes.brownian.bm-with-drift
      - quant-processes.brownian.martingale-property

  - id: qbm-drift-hitting-02
    kind: work
    difficulty: demanding
    statement: >
      Let $X_t = 0.5t + B_t$ with $X_0 = 0$, and let $\tau$ be the first exit
      from $(-1, 1)$. What is the probability that the exit is at $+1$? Use
      $e = 2.7183$ and $e^{-1} = 0.3679$, and give four decimal places.
    answer: >
      $0.7311$. The exponential martingale is driftless at the nonzero root
      $\theta = -2\mu/\sigma^{2} = -2(0.5)/1 = -1$, so $e^{-X_t}$ is a
      martingale. Optional stopping at $\tau$ — legal because both barriers are
      finite, so the stopped process is bounded — gives
      $p\,e^{-1} + (1-p)e^{1} = e^{0} = 1$, where $p$ is the chance of exiting
      at $+1$. Substituting, $0.3679p + 2.7183(1-p) = 1$, so
      $2.7183 - 2.3504p = 1$ and $p = 1.7183/2.3504 = 0.7311$. The general form
      $p = (1 - e^{-\theta b})/(e^{\theta a} - e^{-\theta b})$ collapses here to
      the logistic value $1/(1 + e^{-1}) = 0.7311$. Two checks: with $\mu = 0$
      the same algebra returns the driftless $b/(a+b) = 1/2$, and a positive
      drift must push $p$ above $1/2$, which it does. The trap is using the
      driftless formula anyway and answering $0.5$, discarding exactly the edge
      the question is about.
    expects: "0.7311"
    tolerance: 0.0005
    rubric:
      - >
        Identifies $\theta = -2\mu/\sigma^{2}$ and writes the optional-stopping
        identity $p\,e^{\theta a} + (1-p)e^{-\theta b} = 1$.
      - >
        Checks that the answer exceeds the driftless $1/2$, and that
        $\mu \to 0$ recovers $b/(a+b)$.
    targets:
      - quant-processes.brownian.drift-hitting
    exercises:
      - quant-processes.brownian.bm-with-drift
      - quant-processes.brownian.two-sided-exit

  - id: qbm-drift-hitting-03
    kind: decide
    difficulty: standard
    statement: >
      In discrete time, a biased walk starting $k$ steps above ruin is governed
      by the factor $(q/p)^{k}$. Which continuous-time expression is the limit
      of that factor for $X_t = \mu t + \sigma B_t$ with $\mu > 0$ — the chance
      of ever drawing down by $b$?
    answer: >
      The continuum limit of $(q/p)^{k}$ is $e^{-2\mu b/\sigma^{2}}$. Both come
      from the same construction: find the exponent that makes an exponential of
      the process a martingale, then apply optional stopping at the exit time.
      In discrete time the root of $\mathbb{E}[r^{X_1}] = 1$ is $r = q/p$; in
      continuous time the root of $\theta\mu + \theta^{2}\sigma^{2}/2 = 0$ is
      $\theta = -2\mu/\sigma^{2}$, and evaluating $e^{\theta x}$ at the lower
      barrier $x = -b$ produces $e^{-2\mu b/\sigma^{2}}$. The structural point
      is that $\sigma$ appears squared: what the drift has to overcome is
      accumulated variance, not accumulated volatility, so halving the
      volatility cuts the drawdown exponent by a factor of four rather than
      two. As $\mu \to 0$ both expressions degenerate to $1$ — $(q/p)^{k} \to 1$
      for a fair walk and $e^{-2\mu b/\sigma^{2}} \to 1$ for a driftless
      diffusion — recovering the certainty of eventual ruin against an
      unbounded opponent.
    choices:
      - text: >
          $e^{-2\mu b/\sigma^{2}}$
        correct: true
        feedback: >
          Same exponential martingale, same optional-stopping geometry: the
          walk's step size and bias are replaced by a volatility and a drift,
          and $(q/p)^{k}$ becomes $e^{-2\mu b/\sigma^{2}}$.
      - text: >
          $e^{-2\mu b/\sigma}$
        feedback: >
          The volatility must enter squared. The exponent compares an
          accumulated displacement $b$ against a variance rate $\sigma^{2}$, and
          only $2\mu b/\sigma^{2}$ is dimensionless.
      - text: >
          $b/(a + b)$
        feedback: >
          That is the driftless two-barrier answer, recovered as $\mu \to 0$; it
          cannot be the limit of $(q/p)^{k}$, which is identically $1$ for a
          fair walk.
      - text: >
          $e^{-2\mu b/\sigma^{2}}$ multiplied by the elapsed horizon $t$
        feedback: >
          The one-sided drawdown probability is taken over all time and carries
          no horizon at all — a probability growing with $t$ would eventually
          exceed $1$.
    rubric:
      - >
        Names the shared mechanism — the root of the exponential martingale
        plus optional stopping — rather than matching formulas by shape.
      - >
        Says why $\sigma$ appears squared, and checks the $\mu \to 0$ limit
        against the fair-walk case.
    targets:
      - quant-processes.brownian.drift-hitting
      - quant-processes.ruin.biased
    exercises:
      - quant-processes.brownian.bm-with-drift
    connects:
      - "quant-processes.brownian.drift-hitting ~ quant-processes.ruin.biased"

  # --- square-root-of-time volatility scaling ------------------------------------

  - id: qbm-vol-scaling-01
    kind: work
    difficulty: demanding
    statement: >
      A strategy has annual drift $0.06$ and annual volatility $0.24$, with
      uncorrelated returns. Over a single month — one twelfth of a year — what
      is the ratio of expected profit to the standard deviation of profit? Give
      four decimal places.
    answer: >
      $0.0722$. Drift and volatility move between horizons by different powers
      of $T$: the drift scales as $T$ and the volatility as $\sqrt{T}$. Over
      $T = 1/12$ the expected profit is $0.06/12 = 0.005$ and the standard
      deviation is $0.24/\sqrt{12} = 0.24/3.4641 = 0.06928$, so the ratio is
      $0.005/0.06928 = 0.0722$. Equivalently, take the annual Sharpe ratio
      $0.06/0.24 = 0.25$ and divide by $\sqrt{12}$, since the ratio itself
      scales as $\sqrt{T}$: $0.25/3.4641 = 0.0722$. The trap is scaling both
      quantities the same way. Dividing both by $12$ leaves the ratio at
      $0.25$, which would claim a month of evidence is as convincing as a year
      of it; dividing both by $\sqrt{12}$ makes the mirror-image error. Only the
      mismatch of exponents produces the $\sqrt{T}$ growth of the Sharpe ratio,
      and the same mismatch run the other way gives the desk factor
      $\sqrt{252} \approx 16$.
    expects: "0.0722"
    tolerance: 0.0005
    rubric:
      - >
        Scales the drift by $T$ and the volatility by $\sqrt{T}$, not both the
        same way.
      - >
        Cross-checks against the annual Sharpe ratio divided by $\sqrt{12}$.
    targets:
      - quant-processes.brownian.vol-scaling
    exercises:
      - quant-processes.brownian.scaling

  - id: qbm-vol-scaling-02
    kind: work
    difficulty: routine
    statement: >
      A fund's weekly return volatility is $2.5\%$, with uncorrelated weeks.
      What is its volatility over a four-week period, in percent?
    answer: >
      $5$ percent. Variances add over disjoint, uncorrelated periods, so
      volatilities add in quadrature rather than linearly:
      $\sigma(T) = \sigma(1)\sqrt{T}$ with $T$ counted in weeks. Four weeks give
      $\sigma(4) = 2.5\sqrt{4} = 2.5(2) = 5$ percent. Through variances the same
      statement reads $4(2.5^{2}) = 4(6.25) = 25$, and $\sqrt{25} = 5$.
      Quadrupling the horizon only doubles the spread, which is the practical
      face of $\operatorname{Var}(B_t) = t$. Answering $2.5 \times 4 = 10$ adds
      the weekly volatilities linearly, which would be right only if the four
      weekly returns were perfectly correlated — the single case in which no
      diversification across time occurs at all, and the reason the rule fails
      on a trending series.
    expects: "5"
    rubric:
      - >
        Multiplies by $\sqrt{4} = 2$, not by $4$.
      - >
        Names the independence assumption that lets the variances add.
    targets:
      - quant-processes.brownian.vol-scaling
    exercises:
      - quant-processes.brownian.scaling

  - id: qbm-vol-scaling-03
    kind: work
    difficulty: demanding
    statement: >
      Daily returns are uncorrelated with standard deviation $0.01$. Over $400$
      trading days, form two numbers: the standard deviation of the cumulative
      return, and the standard error of the average daily return. What is the
      ratio of the first to the second?
    answer: >
      $400$. The same $\sqrt{n}$ governs both quantities, pulling in opposite
      directions. The cumulative return over $400$ days is a sum of $400$
      uncorrelated daily returns, so its standard deviation is
      $0.01\sqrt{400} = 0.01(20) = 0.2$: accumulated risk grows like
      $\sqrt{n}$. The average of the same returns has standard error
      $0.01/\sqrt{400} = 0.01/20 = 0.0005$: estimation error shrinks like
      $1/\sqrt{n}$. The ratio is $0.2/0.0005 = 400$, and in general it is
      exactly $n$, since $\sigma\sqrt{n}$ divided by $\sigma/\sqrt{n}$ is $n$.
      That identity is the whole relationship between the two square-root laws:
      they are one statement about variance addition read from opposite ends,
      one multiplying a total by $\sqrt{n}$ and the other dividing a mean by it.
      The trap is expecting the two square roots to cancel; they compound, which
      is why a long sample can pin down a mean while leaving the cumulative
      outcome wildly uncertain.
    expects: "400"
    rubric:
      - >
        Computes the cumulative spread as $\sigma\sqrt{n}$ and the standard
        error as $\sigma/\sqrt{n}$, keeping the two directions apart.
      - >
        Reports the ratio as $n$ rather than $\sqrt{n}$ or $1$.
    targets:
      - quant-processes.brownian.vol-scaling
      - quant-probability.limits.root-n
    exercises:
      - quant-processes.brownian.scaling
    connects:
      - "quant-probability.limits.root-n ~ quant-processes.brownian.vol-scaling"

  # --- zeros and the arcsine law --------------------------------------------------

  - id: qbm-arcsine-01
    kind: work
    difficulty: demanding
    statement: >
      Let $A$ be the fraction of the interval $[0,1]$ that a standard Brownian
      motion spends above $0$. What is $\Pr(A \le 0.05)$? Use
      $\arcsin\sqrt{0.05} = 0.2255$ and give four decimal places.
    answer: >
      $0.1436$. The arcsine law gives
      $\Pr(A \le x) = \frac{2}{\pi}\arcsin\sqrt{x}$, so
      $\Pr(A \le 0.05) = \frac{2}{\pi}(0.2255) = 0.6366(0.2255) = 0.1436$. The
      number is the point of the exercise. A uniform law would put probability
      $0.05$ on this event; the arcsine law puts nearly three times as much,
      because its density $1/(\pi\sqrt{x(1-x)})$ blows up at both endpoints. By
      symmetry $\Pr(A \ge 0.95) = 0.1436$ as well, so a fair contest that is
      lopsided at least $95$ to $5$ in one direction or the other has
      probability $0.2872$ — better than one chance in four. The trap is
      reasoning from the mean: $\mathbb{E}[A] = 1/2$ exactly, but $1/2$ is where
      this U-shaped density is lowest, so the mean is the least representative
      summary available.
    expects: "0.1436"
    tolerance: 0.0005
    rubric:
      - >
        Applies $\frac{2}{\pi}\arcsin\sqrt{x}$ to the distribution function, not
        to the density.
      - >
        Compares the answer against the uniform benchmark $0.05$ and explains
        the excess by the density's blow-up at the endpoints.
    targets:
      - quant-processes.brownian.arcsine

  - id: qbm-arcsine-02
    kind: work
    difficulty: standard
    statement: >
      The last time a standard Brownian motion visits $0$ before time $1$ obeys
      the same arcsine law as the time spent positive. What is the probability
      that this last zero occurs after time $0.75$? Use
      $\arcsin\sqrt{0.75} = \pi/3$.
    answer: >
      $1/3 \approx 0.3333$. Write $L$ for the last zero in $[0,1]$. The arcsine
      law gives $\Pr(L \le x) = \frac{2}{\pi}\arcsin\sqrt{x}$, so
      $\Pr(L \le 0.75) = \frac{2}{\pi}\cdot\frac{\pi}{3} = \frac{2}{3}$ and
      $\Pr(L > 0.75) = 1 - 2/3 = 1/3$. The U-shape is doing something specific
      here: the last zero is more likely to sit very early or very late than in
      the middle, so the path typically settles onto one side of the axis and
      stays there. That two thirds of paths have finished crossing before three
      quarters of the interval has elapsed is the "leads are sticky" statement
      seen through the zero set rather than through the occupation time. The
      trap is treating $L$ as roughly uniform and answering $0.25$; the arcsine
      law puts a third more mass in that final quarter than a uniform law would.
    expects: "1/3"
    tolerance: 0.0005
    rubric:
      - >
        Uses the arcsine distribution function and then complements, rather than
        reporting $\Pr(L \le 0.75)$.
      - >
        Contrasts the answer with the uniform benchmark $0.25$ and attributes
        the excess to the density's mass near the endpoints.
    targets:
      - quant-processes.brownian.arcsine

  - id: qbm-arcsine-03
    kind: decide
    difficulty: standard
    statement: >
      For the arcsine density $1/(\pi\sqrt{x(1-x)})$ of the time $A$ a standard
      Brownian motion spends positive during $[0,1]$, at which value of $x$ is
      the density lowest?
    answer: >
      The density is lowest at $x = 1/2$. It equals
      $1/(\pi\sqrt{x(1-x)})$, and the product $x(1-x)$ is maximised at
      $x = 1/2$, where it is $1/4$; the density there is
      $1/(\pi\sqrt{1/4}) = 2/\pi \approx 0.637$, and it increases without bound
      as $x$ approaches either endpoint. So the mean of $A$, which is exactly
      $1/2$ by symmetry, sits in its least likely neighbourhood — the standard
      cautionary example that a mean need not describe a typical outcome. The
      reading for a fair game is that leads are sticky: one side usually holds
      the lead for nearly the whole contest, and the near-even split that
      intuition expects from a fair game is the rare case. Quantitatively, one
      side leads for at least $90\%$ of the time with probability
      $\frac{4}{\pi}\arcsin\sqrt{0.1} \approx 0.41$.
    choices:
      - text: >
          At $x = 1/2$
        correct: true
        feedback: >
          The product $x(1-x)$ is largest at $1/2$, so its reciprocal square
          root is smallest there. The mean of $A$ and its least likely value
          coincide.
      - text: >
          Near $x = 0$
        feedback: >
          There $x(1-x) \to 0$, so the density diverges — this is where mass
          piles up, not where it thins out.
      - text: >
          Near $x = 1$
        feedback: >
          By symmetry this mirrors $x = 0$: the density diverges here too, which
          is exactly why a lopsided game is the common outcome.
      - text: >
          Nowhere — the density is constant on $[0,1]$
        feedback: >
          A constant density would be the uniform law. The arcsine density
          ranges from $2/\pi \approx 0.637$ at the middle to unbounded at the
          two ends.
    rubric:
      - >
        Maximises $x(1-x)$ to minimise the density, rather than guessing from
        the shape of the name.
      - >
        Says explicitly that the mean $1/2$ is the least typical value, not the
        most likely one.
    targets:
      - quant-processes.brownian.arcsine
