# Problems targeting quant-processes.martingales — fair games, stopping rules
# and the exact boundary of optional stopping.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's instance. See ../README.md.

problems:
  # --- filtration and adapted processes ---------------------------------------

  - id: qmart-filtration-01
    kind: work
    difficulty: demanding
    statement: >
      Let $Z_1, Z_2, \dots$ be independent and identically distributed with
      $\Pr(Z_i = 3) = \Pr(Z_i = -1) = 1/2$, let $S_n = Z_1 + \cdots + Z_n$, and
      let $\mathcal{F}_n = \sigma(Z_1, \dots, Z_n)$. On a path with $Z_1 = 3$
      and $Z_2 = -1$, compute $\mathbb{E}[S_4^{2} \mid \mathcal{F}_2]$.
    answer: >
      $24$. Split $S_4$ into the part $\mathcal{F}_2$ has already fixed and the
      part still independent of it: $S_4 = S_2 + U$ with $S_2 = 3 + (-1) = 2$
      known and $U = Z_3 + Z_4$ independent of $\mathcal{F}_2$. Expanding,
      $\mathbb{E}[S_4^{2} \mid \mathcal{F}_2] = S_2^{2} + 2 S_2 \mathbb{E}[U]
      + \mathbb{E}[U^{2}]$, since the known factor $S_2$ pulls straight out of
      the conditioning. One step has mean $\mathbb{E}[Z_i] = (3 - 1)/2 = 1$ and
      second moment $\mathbb{E}[Z_i^{2}] = (9 + 1)/2 = 5$, so $\mathbb{E}[U] = 2$
      and $\mathbb{E}[U^{2}] = 2 \cdot 5 + 2 \cdot 1 \cdot 1 = 12$ — the two
      squared terms plus the cross term $2\mathbb{E}[Z_3]\mathbb{E}[Z_4]$. Hence
      $4 + 2 \cdot 2 \cdot 2 + 12 = 24$. The trap is answering
      $\mathbb{E}[S_4 \mid \mathcal{F}_2]^{2} = 4^{2} = 16$: conditional
      expectation does not commute with squaring, and the missing
      $\operatorname{Var}(U) = 8$ is exactly the gap.
    expects: "24"
    rubric:
      - >
        Splits $S_4$ into the $\mathcal{F}_2$-measurable part and the
        independent part before doing any algebra.
      - >
        Uses $\mathbb{E}[U^{2}] = 12$ rather than $\mathbb{E}[U]^{2} = 4$ — the
        variance of the two unseen steps does not vanish.
    targets:
      - quant-processes.martingales.filtration
    exercises:
      - quant-probability.conditioning.conditional-expectation

  - id: qmart-filtration-02
    kind: work
    difficulty: standard
    statement: >
      Let $W_1, W_2, \dots$ be independent with $\Pr(W_i = 4) = 1/4$ and
      $\Pr(W_i = 0) = 3/4$, let $S_n = W_1 + \cdots + W_n$, and let
      $\mathcal{F}_n = \sigma(W_1, \dots, W_n)$. On a path with $W_1 = 0$,
      $W_2 = 4$ and $W_3 = 0$, compute $\mathbb{E}[S_3 S_6 \mid \mathcal{F}_3]$.
    answer: >
      $28$. Two rules settle it. First, $S_3 = 0 + 4 + 0 = 4$ is already fixed by
      $\mathcal{F}_3$, so it passes through the conditioning as a constant
      factor: $\mathbb{E}[S_3 S_6 \mid \mathcal{F}_3]
      = S_3 \, \mathbb{E}[S_6 \mid \mathcal{F}_3]$. Second,
      $S_6 = S_3 + (W_4 + W_5 + W_6)$, and those three steps are independent of
      $\mathcal{F}_3$, so they contribute their plain mean: each has
      $\mathbb{E}[W_i] = 4 \cdot (1/4) + 0 \cdot (3/4) = 1$, giving
      $\mathbb{E}[S_6 \mid \mathcal{F}_3] = 4 + 3 = 7$. Hence $4 \cdot 7 = 28$.
      Answering $\mathbb{E}[S_3]\,\mathbb{E}[S_6] = 3 \cdot 6 = 18$ throws away
      the conditioning entirely and averages over a path that has already been
      revealed.
    expects: "28"
    rubric:
      - >
        Pulls the $\mathcal{F}_3$-measurable factor $S_3 = 4$ out of the
        conditional expectation rather than averaging it.
      - >
        Adds three unit means for the unseen steps, giving
        $\mathbb{E}[S_6 \mid \mathcal{F}_3] = 7$, not $\mathbb{E}[S_6] = 6$.
    targets:
      - quant-processes.martingales.filtration
    exercises:
      - quant-probability.conditioning.conditional-expectation

  # --- martingale ---------------------------------------------------------------

  - id: qmart-martingale-01
    kind: work
    difficulty: demanding
    statement: >
      Let $S_n$ be the simple symmetric random walk from $S_0 = 0$, with $\pm 1$
      steps of probability $1/2$ each. There is exactly one constant $c$ for
      which $M_n = S_n^{3} - c\,n\,S_n$ is a martingale. Find $c$.
    answer: >
      $c = 3$. Condition one step on $\mathcal{F}_n$ and expand the cube.
      Writing $X$ for the next step,
      $\mathbb{E}[(S_n + X)^{3} \mid \mathcal{F}_n] = S_n^{3}
      + 3 S_n^{2}\mathbb{E}[X] + 3 S_n \mathbb{E}[X^{2}] + \mathbb{E}[X^{3}]$,
      and for a fair $\pm 1$ step $\mathbb{E}[X] = 0$, $\mathbb{E}[X^{2}] = 1$
      and $\mathbb{E}[X^{3}] = 0$, so the cube drifts up by exactly $3 S_n$ per
      step. Then $\mathbb{E}[M_{n+1} \mid \mathcal{F}_n] = S_n^{3} + 3 S_n
      - c(n+1) S_n$, and setting this equal to $M_n = S_n^{3} - c n S_n$ leaves
      $3 S_n - c S_n = 0$ for every value of $S_n$, so $c = 3$ and
      $S_n^{3} - 3 n S_n$ is the martingale. This is not a coincidence: the odd
      moments vanish because the step is symmetric, which is what leaves a drift
      proportional to $S_n$ rather than to $S_n^{2}$, and hence a compensator
      linear in $n$ times $S_n$.
    expects: "3"
    rubric:
      - >
        Expands the cube of the conditioned sum and uses
        $\mathbb{E}[X] = \mathbb{E}[X^{3}] = 0$ with $\mathbb{E}[X^{2}] = 1$.
      - >
        Matches the coefficient of $n S_n$ as well as of $S_n$ — the $-cnS_n$
        term must cancel identically, not merely at one $n$.
    targets:
      - quant-processes.martingales.martingale
    exercises:
      - quant-processes.martingales.filtration

  - id: qmart-martingale-02
    kind: work
    difficulty: standard
    statement: >
      $(X_n)$ is a martingale with $X_0 = 2$. Define $M_n = 3 X_n - 2n + 5$.
      Compute $\mathbb{E}[M_{10}]$.
    answer: >
      $-9$. $M_n$ is *not* a martingale — the $-2n$ term drags its mean down by
      $2$ every step — but its expectation at a fixed time is still one line,
      because expectation is linear and the martingale part contributes nothing
      new. The constant-mean property gives $\mathbb{E}[X_{10}]
      = \mathbb{E}[X_0] = 2$, with no information about the path whatsoever, so
      $\mathbb{E}[M_{10}] = 3\,\mathbb{E}[X_{10}] - 2 \cdot 10 + 5
      = 6 - 20 + 5 = -9$. The slip to resist is deciding that
      $\mathbb{E}[X_{10}]$ needs the increment distribution: it does not, and
      that is exactly the point of the definition — $\mathbb{E}[X_n]
      = \mathbb{E}[X_0]$ at every fixed time no matter what the increments look
      like.
    expects: "-9"
    rubric:
      - >
        Uses $\mathbb{E}[X_{10}] = \mathbb{E}[X_0] = 2$ from the constant-mean
        property, without needing the increment law.
      - >
        Keeps the deterministic terms $-20 + 5$: $M_n$ is an affine function of
        a martingale, not itself one.
    targets:
      - quant-processes.martingales.martingale
    exercises:
      - quant-probability.conditioning.tower

  - id: qmart-martingale-03
    kind: justify
    difficulty: demanding
    statement: >
      Let $(X_n)$ be a martingale with $\mathbb{E}[X_n^{2}] < \infty$ for every
      $n$, and write $D_k = X_k - X_{k-1}$ for its increments. Prove that the
      increments are orthogonal, $\mathbb{E}[D_j D_k] = 0$ whenever $j \ne k$,
      and deduce that $\mathbb{E}[(X_n - X_0)^{2}]
      = \sum_{k=1}^{n} \mathbb{E}[D_k^{2}]$.
    answer: >
      Take $j < k$ without loss of generality, and condition on
      $\mathcal{F}_{k-1}$ — the information available just before the later
      increment is revealed. Since $j \le k-1$, the factor $D_j = X_j - X_{j-1}$
      is already fixed by $\mathcal{F}_{k-1}$ and pulls out:
      $\mathbb{E}[D_j D_k \mid \mathcal{F}_{k-1}]
      = D_j \, \mathbb{E}[X_k - X_{k-1} \mid \mathcal{F}_{k-1}] = D_j \cdot 0
      = 0$, using the martingale property in increment form. Taking
      expectations and applying the tower property gives
      $\mathbb{E}[D_j D_k] = 0$. For the second claim write
      $X_n - X_0 = \sum_{k=1}^{n} D_k$, square, and expand: the $n$ diagonal
      terms give $\sum_k \mathbb{E}[D_k^{2}]$, and every one of the $n(n-1)$
      cross terms vanishes by orthogonality. Square-integrability is what makes
      each of these expectations finite and hence the rearrangement legitimate;
      without it the sum can be meaningless even though the conditional
      computation still formally goes through. The identity is the discrete
      Pythagorean theorem behind the compensated square: a fair game's spread
      accumulates additively even though its mean does not move at all.
    rubric:
      - >
        Conditions on $\mathcal{F}_{k-1}$ for the *later* index $k$, so that the
        earlier increment $D_j$ is measurable there and pulls out.
      - >
        Invokes $\mathbb{E}[D_k \mid \mathcal{F}_{k-1}] = 0$, the conditional
        form, rather than the unconditional $\mathbb{E}[D_k] = 0$.
      - >
        Says where $\mathbb{E}[X_n^{2}] < \infty$ is used — every term of the
        expansion must be finite for the sum to mean anything.
    targets:
      - quant-processes.martingales.martingale
    exercises:
      - quant-processes.martingales.filtration
      - quant-probability.conditioning.tower

  # --- sub- and supermartingales -------------------------------------------------

  - id: qmart-sub-supermartingale-01
    kind: work
    difficulty: demanding
    statement: >
      Let $S_n$ be the fair $\pm 1$ walk with $S_0 = 0$ and put
      $Y_n = e^{S_n}$. Since $S_n$ is a martingale and the exponential is
      convex, Jensen's inequality makes $(Y_n)$ a submartingale. Compute the
      multiplicative drift
      $\mathbb{E}[Y_{n+1} \mid \mathcal{F}_n] / Y_n$, to four decimal places.
    answer: >
      $1.5431$. Conditioning on $\mathcal{F}_n$, $Y_{n+1} = e^{S_n} e^{X_{n+1}}$
      with $e^{S_n}$ already known and $X_{n+1}$ independent of the past, so
      $\mathbb{E}[Y_{n+1} \mid \mathcal{F}_n] = Y_n \, \mathbb{E}[e^{X_{n+1}}]$
      and the ratio is a constant, not a function of the state. That constant is
      $\mathbb{E}[e^{X}] = \tfrac{1}{2}e + \tfrac{1}{2}e^{-1} = \cosh 1
      = 1.543080\dots$, so the answer is $1.5431$. It exceeds $1$, confirming
      the submartingale direction, and the excess is exactly what Jensen
      predicts: $\mathbb{E}[e^{X}] \ge e^{\mathbb{E}[X]} = e^{0} = 1$, strictly
      because the step is genuinely random. The classic slip is to reason that
      $\mathbb{E}[X] = 0$ forces $\mathbb{E}[e^{X}] = 1$ — that is precisely the
      swap Jensen's inequality forbids, and the gap $0.5431$ per step is the
      upward drift convexity injects into a process that drifts nowhere.
    expects: "1.5431"
    tolerance: 0.0005
    rubric:
      - >
        Factorises $e^{S_{n+1}} = e^{S_n} e^{X_{n+1}}$ and notes the second
        factor is independent of $\mathcal{F}_n$, so the drift is multiplicative
        and free of the state.
      - >
        Reports a ratio strictly above $1$ and names Jensen's inequality, rather
        than assuming $\mathbb{E}[e^{X}] = e^{\mathbb{E}[X]}$.
    targets:
      - quant-processes.martingales.sub-supermartingale
    exercises:
      - quant-processes.martingales.martingale

  - id: qmart-sub-supermartingale-02
    kind: decide
    difficulty: standard
    statement: >
      A fund reports net asset value $V_n \ge 0$ at the close of day $n$, and
      its manager can prove the one-step relation
      $\mathbb{E}[V_{n+1} \mid \mathcal{F}_n] = 1.02\, V_n$ for every $n$. What
      is $(V_n)$?
    answer: >
      A submartingale. The definitions compare exactly two quantities,
      $\mathbb{E}[V_{n+1} \mid \mathcal{F}_n]$ and $V_n$, and here the first is
      $1.02 V_n$. Because $V_n \ge 0$, $1.02 V_n \ge V_n$ at every state and
      along every path, which is the submartingale inequality; the drift is
      strict wherever $V_n > 0$. Two checks are worth making out loud. The name
      is the counterintuitive one — a submartingale drifts *up*, and it is a
      supermartingale that drifts down, the shape a house edge produces. And
      nonnegativity is load-bearing: if the fund could report a negative value
      then $1.02 V_n \le V_n$ there, and the process would be neither sub- nor
      supermartingale. Taking expectations confirms the direction,
      $\mathbb{E}[V_n] = 1.02^{n}\,\mathbb{E}[V_0]$, which is nondecreasing in
      $n$ exactly as the sub case requires.
    choices:
      - text: >
          A martingale, because the multiplier $1.02$ is a constant.
        feedback: >
          A constant multiplier still moves the conditional mean: a martingale
          needs $\mathbb{E}[V_{n+1} \mid \mathcal{F}_n] = V_n$ exactly, and
          $1.02 V_n$ equals $V_n$ only where $V_n = 0$.
      - text: >
          A submartingale.
        correct: true
        feedback: >
          $\mathbb{E}[V_{n+1} \mid \mathcal{F}_n] = 1.02 V_n \ge V_n$ for every
          $V_n \ge 0$, which is the submartingale inequality — the fund drifts
          up, and the names are the ones that read backwards.
      - text: >
          A supermartingale.
        feedback: >
          That is the downward-drifting case, the one a house edge produces;
          here the conditional mean rises two percent a day. Swapping the two
          names is the single most common slip in the unit — the mnemonic is
          that life is not fair, so a supermartingale goes down.
      - text: >
          Neither, because the relation is multiplicative rather than additive.
        feedback: >
          The definitions only compare $\mathbb{E}[V_{n+1} \mid \mathcal{F}_n]$
          with $V_n$; whether that comparison arises additively or
          multiplicatively is irrelevant to which name applies.
    rubric:
      - >
        Compares $\mathbb{E}[V_{n+1} \mid \mathcal{F}_n]$ with $V_n$ and gets
        the inequality's direction right, using $V_n \ge 0$.
      - >
        Names it a submartingale, resisting the pull of the mnemonic that a
        rising process ought to be the super one.
    targets:
      - quant-processes.martingales.sub-supermartingale
    exercises:
      - quant-processes.martingales.martingale

  # --- the martingale zoo --------------------------------------------------------

  - id: qmart-examples-zoo-01
    kind: work
    difficulty: demanding
    statement: >
      A biased $\pm 1$ walk has $\Pr(X_i = +1) = 5/8$ and starts at $S_0 = 0$.
      Using the compensated square $(S_n - n(p-q))^{2} - 4pq\,n$, compute
      $\mathbb{E}[S_{16}^{2}]$.
    answer: >
      $31$. The compensated square is a martingale starting at $0$, so
      $\mathbb{E}[(S_n - n(p-q))^{2}] = 4pq\,n$ at every fixed $n$ — that is the
      whole content of the construction, and it says the walk's spread about its
      drift line grows linearly at rate $4pq$. Here $p - q = 5/8 - 3/8 = 1/4$
      and $4pq = 4 \cdot (5/8)(3/8) = 15/16$. At $n = 16$ the mean is
      $\mathbb{E}[S_{16}] = 16 \cdot 1/4 = 4$ and the variance is
      $\operatorname{Var}(S_{16}) = (15/16) \cdot 16 = 15$, so
      $\mathbb{E}[S_{16}^{2}] = \operatorname{Var}(S_{16})
      + \mathbb{E}[S_{16}]^{2} = 15 + 16 = 31$. Two wrong turns are worth
      naming: using $S_n^{2} - n$, the symmetric-case martingale, gives $16$ and
      silently assumes $p = 1/2$; and stopping at the variance gives $15$, which
      is $\mathbb{E}[(S_{16} - 4)^{2}]$ — the centred second moment, not the raw
      one the question asks for.
    expects: "31"
    rubric:
      - >
        Computes $4pq = 15/16$ from the actual $p$, rather than reaching for the
        $p = 1/2$ compensator $n$.
      - >
        Converts back with $\mathbb{E}[S_{16}^{2}] = \operatorname{Var}(S_{16})
        + \mathbb{E}[S_{16}]^{2}$ instead of leaving the answer at $15$.
    targets:
      - quant-processes.martingales.examples-zoo
    exercises:
      - quant-processes.martingales.martingale

  - id: qmart-examples-zoo-02
    kind: work
    difficulty: standard
    statement: >
      A $\pm 1$ walk has $\Pr(X_i = +1) = 3/7$. Find the base $b \ne 1$ for
      which $b^{S_n}$ is a martingale.
    answer: >
      $b = 4/3$. A multiplicative process is driftless exactly when its one-step
      multiplier averages to $1$: $\mathbb{E}[b^{S_{n+1}} \mid \mathcal{F}_n]
      = b^{S_n}\,\mathbb{E}[b^{X}]$, so the requirement is
      $p\,b + q\,b^{-1} = 1$. With $p = 3/7$ and $q = 4/7$ the nontrivial root
      is $b = q/p = (4/7)/(3/7) = 4/3$, and substituting checks it:
      $(3/7)(4/3) + (4/7)(3/4) = 4/7 + 3/7 = 1$. The other root of that
      quadratic is $b = 1$, giving the constant process and no information. The
      standing sign trap is writing $(p/q)^{S_n} = (3/4)^{S_n}$ instead: its
      multiplier averages to $(3/7)(3/4) + (4/7)(4/3) = 27/84 + 64/84 = 91/84$,
      which is not $1$, so that process is not a martingale at all.
    expects: "4/3"
    tolerance: 0.0005
    rubric:
      - >
        Sets up $p\,b + q\,b^{-1} = 1$ and takes the root $b = q/p$, discarding
        the trivial root $b = 1$.
      - >
        Gets the ratio the right way up — $q/p$, not $p/q$ — and verifies by
        substitution.
    targets:
      - quant-processes.martingales.examples-zoo
    exercises:
      - quant-processes.martingales.martingale

  - id: qmart-examples-zoo-03
    kind: work
    difficulty: standard
    statement: >
      A process $S_n = X_1 + \cdots + X_n$ has independent steps drawn uniformly
      from $\{1, 2, 3, 4\}$. The general compensated square for iid steps is
      $(S_n - n\mu)^{2} - c\,n$. Find $c$.
    answer: >
      $c = 1.25$. The general construction recentres at the step mean and
      compensates by the step variance, so $\mu = \mathbb{E}[X]$ and
      $c = \operatorname{Var}(X)$. Here $\mu = (1+2+3+4)/4 = 5/2$ and
      $\mathbb{E}[X^{2}] = (1 + 4 + 9 + 16)/4 = 15/2$, so
      $c = 15/2 - 25/4 = 5/4 = 1.25$. Verifying directly takes one line: with
      $D_{n+1} = X_{n+1} - \mu$ of conditional mean $0$ and conditional second
      moment $c$, $\mathbb{E}[(S_{n+1} - (n+1)\mu)^{2} \mid \mathcal{F}_n]
      = (S_n - n\mu)^{2} + 2(S_n - n\mu)\mathbb{E}[D_{n+1}]
      + \mathbb{E}[D_{n+1}^{2}] = (S_n - n\mu)^{2} + c$, and subtracting
      $c(n+1)$ restores equality. Answering $c = 15/2$ uses the raw second
      moment and forgets to recentre; answering $c = 1$ imports the $\pm 1$
      walk's compensator, which is that walk's variance and nobody else's.
    expects: "1.25"
    rubric:
      - >
        Identifies the compensator as the step *variance*, computed as
        $\mathbb{E}[X^{2}] - \mu^{2}$.
      - >
        Recentres at $n\mu$ with $\mu = 5/2$ before squaring — the two pieces of
        the construction travel together.
    targets:
      - quant-processes.martingales.examples-zoo
    exercises:
      - quant-processes.martingales.filtration

  # --- the exponential martingale ------------------------------------------------

  - id: qmart-exponential-martingale-01
    kind: work
    difficulty: demanding
    statement: >
      A walk has iid steps with $\Pr(X_i = 2) = \Pr(X_i = -1) = 1/2$ and
      $S_0 = 0$, so it drifts upward at rate $1/2$ per step. Find the nontrivial
      root $e^{\theta}$ of $\phi(\theta) = \mathbb{E}[e^{\theta X_1}] = 1$, to
      three decimal places.
    answer: >
      $e^{\theta} \approx 0.618$. Write $y = e^{\theta}$; then
      $\phi(\theta) = \tfrac{1}{2}y^{2} + \tfrac{1}{2}y^{-1}$, and
      $\phi(\theta) = 1$ becomes $y^{3} + 1 = 2y$ after multiplying through by
      $2y$, that is $y^{3} - 2y + 1 = 0$. The trivial root $y = 1$ — present for
      every step distribution, since $\phi(0) = 1$ always — factors out as
      $(y - 1)(y^{2} + y - 1) = 0$, leaving the positive root
      $y = (\sqrt{5} - 1)/2 = 0.61803\dots$. Checking:
      $\tfrac{1}{2}(0.618034)^{2} + \tfrac{1}{2}/0.618034
      = 0.190983 + 0.809017 = 1$. The sign is the lesson here: $y < 1$ means
      $\theta < 0$, which is exactly right for an upward-drifting walk — the
      exponential martingale $e^{\theta S_n}$ has to *decay* in the direction
      the walk moves, or it could not keep a constant mean. Stopping at the
      trivial root, and taking the negative root of the quadratic, are the two
      ways this goes wrong.
    expects: "0.618"
    tolerance: 0.0005
    rubric:
      - >
        Substitutes $y = e^{\theta}$, clears the denominator, and factors out
        the trivial root $y = 1$ before solving.
      - >
        Takes the positive root and notes that $y < 1$, hence $\theta < 0$, is
        the correct sign for a walk with positive drift.
    targets:
      - quant-processes.martingales.exponential-martingale
    exercises:
      - quant-processes.martingales.examples-zoo

  - id: qmart-exponential-martingale-02
    kind: work
    difficulty: standard
    statement: >
      Let $S_n$ be the fair $\pm 1$ walk from $S_0 = 0$. Use the exponential
      martingale at $\theta = \ln 2$ to compute $\mathbb{E}[2^{S_4}]$ exactly.
    answer: >
      $625/256 = 2.44140625$. At $\theta = \ln 2$ the moment generating function
      of one step is $\phi(\theta) = \mathbb{E}[2^{X}]
      = \tfrac{1}{2}(2) + \tfrac{1}{2}(1/2) = 5/4$, which is not $1$, so
      $2^{S_n}$ is not itself a martingale. What is one is
      $M_n = 2^{S_n}/(5/4)^{n}$, with $M_0 = 2^{0}/1 = 1$. The constant-mean
      property gives $\mathbb{E}[M_4] = 1$, hence
      $\mathbb{E}[2^{S_4}] = (5/4)^{4} = 625/256$. The independent-steps
      cross-check agrees: $\mathbb{E}[2^{S_4}] = \mathbb{E}[2^{X}]^{4}
      = (5/4)^{4}$. The error the construction exists to prevent is dropping the
      denominator and declaring $\mathbb{E}[2^{S_4}] = 1$ — true only at a
      $\theta$ tuned so that $\phi(\theta) = 1$, and $\ln 2$ is not that
      $\theta$ for this walk.
    expects: "625/256"
    tolerance: 0.0005
    rubric:
      - >
        Computes $\phi(\ln 2) = 5/4$ and keeps the $\phi(\theta)^{n}$
        denominator rather than assuming $e^{\theta S_n}$ is a martingale on its
        own.
      - >
        Evaluates at $n = 4$ from $M_0 = 1$, giving $(5/4)^{4}$.
    targets:
      - quant-processes.martingales.exponential-martingale
    exercises:
      - quant-processes.martingales.martingale

  - id: qmart-exponential-martingale-03
    kind: justify
    difficulty: demanding
    statement: >
      Let $X_1, X_2, \dots$ be iid with $\phi(\theta) = \mathbb{E}[e^{\theta
      X_1}] < \infty$ for a fixed $\theta$, and let $S_n = X_1 + \cdots + X_n$
      with $S_0 = 0$. Prove that $M_n = e^{\theta S_n}/\phi(\theta)^{n}$ is a
      martingale for the filtration the steps generate, and explain what changes
      when $\theta$ is chosen so that $\phi(\theta) = 1$.
    answer: >
      Integrability first: $\mathbb{E}|M_n| = \mathbb{E}[e^{\theta
      S_n}]/\phi(\theta)^{n} = \phi(\theta)^{n}/\phi(\theta)^{n} = 1 < \infty$,
      using independence to factor the expectation of the product; and $M_n$ is
      adapted, being a function of $X_1, \dots, X_n$. For the martingale
      property, split off the new step:
      $M_{n+1} = M_n \cdot e^{\theta X_{n+1}}/\phi(\theta)$. The factor $M_n$ is
      fixed by $\mathcal{F}_n$ and pulls out, while $X_{n+1}$ is independent of
      $\mathcal{F}_n$, so its contribution collapses to a plain mean:
      $\mathbb{E}[M_{n+1} \mid \mathcal{F}_n] = M_n \, \mathbb{E}[e^{\theta
      X_{n+1}}]/\phi(\theta) = M_n \cdot \phi(\theta)/\phi(\theta) = M_n$. The
      denominator is exactly the compensator cancelling the factor each new step
      contributes. When $\theta$ solves $\phi(\theta) = 1$ the denominator is
      identically $1$, so $e^{\theta S_n}$ is itself a martingale with
      $M_0 = 1$, and the payoff is that optional stopping at a hitting time then
      involves no time-dependent term at all — which is what turns a hitting
      probability into a single linear equation. Note $\theta = 0$ always solves
      $\phi(\theta) = 1$ and yields $M_n \equiv 1$; the useful root is the other
      one.
    rubric:
      - >
        Checks adaptedness and $\mathbb{E}|M_n| < \infty$ before the conditional
        computation, not only the conditional identity.
      - >
        Pulls $M_n$ out of $\mathbb{E}[\cdot \mid \mathcal{F}_n]$ and replaces
        the new step's factor by its unconditional mean $\phi(\theta)$, citing
        independence.
      - >
        Explains that $\phi(\theta) = 1$ removes the compensator entirely, and
        notes $\theta = 0$ as the trivial root.
    targets:
      - quant-processes.martingales.exponential-martingale
    exercises:
      - quant-processes.martingales.filtration
      - quant-processes.martingales.martingale

  # --- finding the martingale a problem wants -------------------------------------

  - id: qmart-spotting-martingales-01
    kind: work
    difficulty: demanding
    statement: >
      A Markov chain moves on $\{0, 1, 2, 3\}$ with $0$ and $3$ absorbing. From
      state $1$ it goes to $0$ or to $2$ with probability $1/2$ each; from state
      $2$ it goes to $1$ with probability $1/4$ and to $3$ with probability
      $3/4$. Starting from state $1$, find the probability of absorption at $3$.
    answer: >
      $3/7 \approx 0.4286$. Probabilities want a harmonic function, so look for
      an $f$ with zero one-step drift,
      $\mathbb{E}[f(X_{n+1}) \mid X_n = x] = f(x)$, subject to the boundary
      values $f(0) = 0$ and $f(3) = 1$; then $f(X_n)$ is a bounded martingale
      and optional stopping gives $f(1) = \mathbb{E}[f(X_T)]
      = \Pr(\text{absorb at } 3)$ directly. The interior equations are
      $f(1) = \tfrac{1}{2}f(0) + \tfrac{1}{2}f(2) = \tfrac{1}{2}f(2)$ and
      $f(2) = \tfrac{1}{4}f(1) + \tfrac{3}{4}f(3) = \tfrac{1}{4}f(1)
      + \tfrac{3}{4}$. Substituting the first into the second,
      $f(2) = \tfrac{1}{8}f(2) + \tfrac{3}{4}$, so $\tfrac{7}{8}f(2)
      = \tfrac{3}{4}$ and $f(2) = 6/7$; hence $f(1) = 3/7$. The trap the recipe
      exists to defuse is guessing $f(x) = x$: its drift from state $1$ is $0$
      but from state $2$ it is $\tfrac{1}{4}(-1) + \tfrac{3}{4}(+1) = 1/2$, so
      the drift depends on the state and the level is not harmonic here — the
      equation has to be solved, not guessed.
    expects: "3/7"
    tolerance: 0.0005
    rubric:
      - >
        Writes the zero-drift (harmonic) equations at the two interior states
        and attaches the boundary values $f(0) = 0$, $f(3) = 1$.
      - >
        Solves the pair simultaneously rather than assuming $f(x) = x$ — the
        chain's steps are not symmetric, so the level is not harmonic.
    targets:
      - quant-processes.martingales.spotting-martingales
    exercises:
      - quant-processes.martingales.martingale

  - id: qmart-spotting-martingales-02
    kind: work
    difficulty: standard
    statement: >
      A process $S_n$ has independent steps drawn uniformly from
      $\{-2, -1, 0, 1, 2, 3\}$. Applying the drift recipe to the candidate
      $f(x) = x$, find the constant $c$ for which $S_n - c\,n$ is a martingale.
    answer: >
      $c = 1/2$. The recipe is to compute the candidate's one-step drift and
      read off the case. For $f(x) = x$,
      $D(x) = \mathbb{E}[S_{n+1} - S_n \mid S_n = x] = \mathbb{E}[X]
      = (-2 - 1 + 0 + 1 + 2 + 3)/6 = 3/6 = 1/2$, the same value at every state —
      a nonzero *constant*, which is the time case rather than the probability
      case. Subtracting the running total of that drift kills it:
      $\mathbb{E}[S_{n+1} - c(n+1) \mid \mathcal{F}_n] = S_n + 1/2 - c(n+1)$,
      which equals $S_n - cn$ exactly when $c = 1/2$. So $c = 1/2$, and the
      recipe has reproduced the level martingale $S_n - n\mu$ rather than
      requiring it be looked up. Had $D$ come out state-dependent, no constant
      subtraction would work and the harmonic equation would be the next move.
    expects: "1/2"
    tolerance: 0.0005
    rubric:
      - >
        Computes the drift as the plain step mean and checks it does not depend
        on the state before subtracting any compensator.
      - >
        Subtracts $cn$ and matches the coefficient so the identity holds at
        every $n$, not just one.
    targets:
      - quant-processes.martingales.spotting-martingales
    exercises:
      - quant-processes.martingales.martingale

  # --- the martingale transform ---------------------------------------------------

  - id: qmart-martingale-transform-01
    kind: work
    difficulty: demanding
    statement: >
      Bet on fair $\pm 1$ tosses, writing $X_n$ for the walk so that
      $X_k - X_{k-1}$ is toss $k$. Your stake on round $k$ is $H_k = 1 + h_{k-1}$
      where $h_{k-1}$ is the number of heads among the first $k-1$ tosses, so
      $H_1 = 1$. With $(H \cdot X)_n = \sum_{k=1}^{n} H_k (X_k - X_{k-1})$,
      compute $\mathbb{E}[(H \cdot X)_3^{2}]$.
    answer: >
      $8$. The transform's increments are orthogonal, which collapses the
      square to a sum: for $j < k$, conditioning on $\mathcal{F}_{k-1}$ leaves
      $H_j$, the $j$-th increment and $H_k$ all known, and
      $\mathbb{E}[X_k - X_{k-1} \mid \mathcal{F}_{k-1}] = 0$ kills the term. So
      with each squared increment equal to $1$,
      $\mathbb{E}[(H \cdot X)_3^{2}] = \sum_{k=1}^{3} \mathbb{E}[H_k^{2}]$. Now
      $H_1 = 1$ always, so $\mathbb{E}[H_1^{2}] = 1$. $H_2$ is $1$ or $2$ with
      probability $1/2$ each, so $\mathbb{E}[H_2^{2}] = (1 + 4)/2 = 5/2$. $H_3$
      is $1 + h_2$ with $h_2$ taking $0, 1, 2$ with probabilities
      $1/4, 1/2, 1/4$, so $\mathbb{E}[H_3^{2}] = \tfrac{1}{4}(1) +
      \tfrac{1}{2}(4) + \tfrac{1}{4}(9) = 9/2$. The total is
      $1 + 5/2 + 9/2 = 8$. The mean is still $\mathbb{E}[(H \cdot X)_3] = 0$:
      sizing the bet on past information moved the second moment from $3$, its
      value under flat unit stakes, to $8$, and left the expectation exactly
      where it started.
    expects: "8"
    rubric:
      - >
        Uses that a predictable stake makes the transform's increments
        orthogonal, so the second moment is $\sum_k \mathbb{E}[H_k^{2}]$ with no
        cross terms.
      - >
        Computes each $\mathbb{E}[H_k^{2}]$ from the distribution of the head
        count in the first $k-1$ tosses, not as $(\mathbb{E}[H_k])^{2}$.
    targets:
      - quant-processes.martingales.martingale-transform
    exercises:
      - quant-processes.martingales.filtration
      - quant-processes.martingales.martingale

  - id: qmart-martingale-transform-02
    kind: work
    difficulty: standard
    statement: >
      Fair $\pm 1$ tosses again, with the staking rule $H_k = 3$ if the running
      total after $k-1$ tosses is strictly positive and $H_k = 1$ otherwise. The
      realised tosses are $+1, +1, -1, +1, +1$. Compute $(H \cdot X)_5$.
    answer: >
      $7$. Read each stake off the total *before* the round it governs — that
      one-step lag is the whole point of predictability. The running totals
      before rounds $1$ through $5$ are $0, 1, 2, 1, 2$, so the stakes are
      $1, 3, 3, 3, 3$. Dotting against the increments $+1, +1, -1, +1, +1$ gives
      $1(+1) + 3(+1) + 3(-1) + 3(+1) + 3(+1) = 1 + 3 - 3 + 3 + 3 = 7$. The
      off-by-one slip is to set $H_k$ from the total *after* toss $k$, which
      would make every stake $3$ and give the different total
      $3(1 + 1 - 1 + 1 + 1) = 9$ — and that rule is not predictable at all,
      since it peeks at the very outcome it is betting on. Whatever the realised
      value, the theorem promises $\mathbb{E}[(H \cdot X)_5] = 0$: sizing
      reshapes the distribution, never its mean.
    expects: "7"
    rubric:
      - >
        Fixes each $H_k$ from $\mathcal{F}_{k-1}$ — the total before round $k$ —
        obtaining stakes $1, 3, 3, 3, 3$.
      - >
        Sums $H_k$ times the $k$-th increment, keeping the sign of the losing
        round.
    targets:
      - quant-processes.martingales.martingale-transform
    exercises:
      - quant-processes.martingales.filtration

  - id: qmart-martingale-transform-03
    kind: justify
    difficulty: standard
    statement: >
      Let $(X_n)$ be a martingale and let $(H_n)$ be predictable with
      $|H_n| \le C$ for a constant $C$. Prove that
      $(H \cdot X)_n = \sum_{k=1}^{n} H_k (X_k - X_{k-1})$, with
      $(H \cdot X)_0 = 0$, is a martingale, and say precisely where
      predictability is used.
    answer: >
      The transform is adapted, since each term is built from $H_k$ and $X_k$
      with $k \le n$, and it is integrable because $|(H \cdot X)_n| \le C
      \sum_{k \le n} |X_k - X_{k-1}|$, a finite sum of integrable terms. For the
      martingale property, isolate the newest term:
      $(H \cdot X)_{n+1} = (H \cdot X)_n + H_{n+1}(X_{n+1} - X_n)$, and
      condition on $\mathcal{F}_n$. The first piece is $\mathcal{F}_n$-
      measurable and passes through unchanged. In the second, $H_{n+1}$ is fixed
      by $\mathcal{F}_n$ — this is exactly predictability, and it is the only
      place it is used — so it pulls out as a constant, leaving
      $H_{n+1}\,\mathbb{E}[X_{n+1} - X_n \mid \mathcal{F}_n] = H_{n+1} \cdot 0
      = 0$ by the martingale property of $X$. Hence
      $\mathbb{E}[(H \cdot X)_{n+1} \mid \mathcal{F}_n] = (H \cdot X)_n$, and
      taking $n = 0$ gives $\mathbb{E}[(H \cdot X)_n] = 0$ at every fixed $n$. A
      merely adapted stake breaks the argument at precisely that step:
      $H_{n+1}$ would depend on $X_{n+1}$ and could not be treated as known, and
      indeed the rule "stake $1$ if the next toss is a head, $0$ otherwise"
      turns a fair game into a strictly profitable one.
    rubric:
      - >
        Conditions on $\mathcal{F}_n$ and pulls $H_{n+1}$ out, naming
        predictability as the reason it may be treated as known.
      - >
        Cites $\mathbb{E}[X_{n+1} - X_n \mid \mathcal{F}_n] = 0$ for the
        remaining factor, and observes that adaptedness alone would not suffice.
      - >
        Says something about integrability, using the bound on $|H_n|$.
    targets:
      - quant-processes.martingales.martingale-transform
    exercises:
      - quant-processes.martingales.filtration
      - quant-processes.martingales.martingale

  # --- stopping times --------------------------------------------------------------

  - id: qmart-stopping-time-01
    kind: decide
    difficulty: demanding
    statement: >
      A desk watches one stock's daily closing price and considers four exit
      rules, each phrased in terms of the price history alone. Exactly one fails
      to be a stopping time for the filtration generated by the daily closes.
      Which one?
    answer: >
      The last one. The test is always $\{T = n\} \in \mathcal{F}_n$: standing
      at the close of day $n$, with only the prices through day $n$ in hand, you
      must already be able to say whether you have sold. "The last day the price
      closes below $100$" fails outright — certifying today as the last such day
      requires knowing that no later close dips below $100$, which is the whole
      remaining year. The other three pass, and two of them deserve to be named
      because they look suspicious. The minimum of a hitting time and a fixed
      horizon is a stopping time, since $\{T \le n\}$ is a union of two events
      each decided by day $n$. And $T + 3$ is a stopping time whenever $T$ is,
      because $\{T + 3 = n\} = \{T = n - 3\} \in \mathcal{F}_{n-3} \subseteq
      \mathcal{F}_n$ — shifting *forward* is free, and it is the backward shift,
      "the day before the price first hits $120$", that needs foresight. A
      moving-average crossover is a stopping time however many lags it uses,
      because every lag is already in the past.
    choices:
      - text: >
          Sell on the first day the price closes at or above $120$, or on the
          sixtieth trading day, whichever comes first.
        feedback: >
          The minimum of a hitting time and a deterministic time is a stopping
          time: on each day you already know both whether the level has been
          reached and what day it is.
      - text: >
          Sell on the first day the twenty-day moving average closes above the
          fifty-day moving average.
        feedback: >
          Both averages are computed from prices already observed, so the
          crossing is visible the day it happens — a genuine stopping time,
          however elaborate the statistic.
      - text: >
          Sell three trading days after the first day the price closes at or
          above $120$.
        feedback: >
          This is $T + 3$ for a stopping time $T$, and shifting forward is fine:
          on the day in question you already know the level was reached three
          days ago. It is shifting backwards that needs the future.
      - text: >
          Sell on the last day of the year on which the price closes below
          $100$.
        correct: true
        feedback: >
          Declaring a day to be the last such day requires knowing every later
          close — the classic last-visit non-example. Optional stopping has
          nothing whatever to say about it.
    rubric:
      - >
        Tests each rule against $\{T = n\} \in \mathcal{F}_n$ — decidable at the
        close of day $n$ — rather than against how natural the rule sounds.
      - >
        Recognises that $T + 3$ and $\min(T, 60)$ are stopping times, so the
        only failure is the backward-looking last-day rule.
    targets:
      - quant-processes.martingales.stopping-time
    exercises:
      - quant-processes.martingales.filtration

  - id: qmart-stopping-time-02
    kind: decide
    difficulty: standard
    statement: >
      A fair coin is tossed repeatedly and $\mathcal{F}_n$ records the first $n$
      tosses. Which of these rules *is* a stopping time?
    answer: >
      The running-excess rule. At toss $n$, using only tosses $1$ through $n$,
      can you already say whether you have stopped? For the running excess of
      heads over tails, yes — the difference is computed from what you have
      seen, and the first time it equals $3$ is announced the instant it
      happens, so $\{T = n\} \in \mathcal{F}_n$. The other three all need
      information not yet available. "Where the longest run of heads in the
      first hundred tosses begins" and "where the head-minus-tail difference is
      maximal over the first fifty" both need the whole window before any
      candidate can be certified, so the event $\{T = n\}$ sits in
      $\mathcal{F}_{100}$ or $\mathcal{F}_{50}$ rather than in $\mathcal{F}_n$.
      "The toss immediately preceding two heads in a row" needs one step of
      foresight, which is one step too many. Note what a stopping time *is*
      allowed to be: infinite with positive probability, and arbitrarily large.
      What it is never allowed to be is clairvoyant.
    choices:
      - text: >
          $T$ is the toss at which the longest run of heads in the first one
          hundred tosses begins.
        feedback: >
          You cannot know a run is the longest until all one hundred tosses are
          in, so $\{T = n\}$ is decided by $\mathcal{F}_{100}$, not by
          $\mathcal{F}_n$.
      - text: >
          $T$ is the first toss by which heads have occurred three more times
          than tails.
        correct: true
        feedback: >
          The running difference is a function of the tosses already seen, so
          the moment it first reaches $3$ is visible on the spot — a first
          hitting time, always a stopping time.
      - text: >
          $T$ is the toss immediately preceding the first appearance of two
          heads in a row.
        feedback: >
          Calling a toss the one before the pattern completes requires knowing
          the next toss, which is a one-step peek into the future.
      - text: >
          $T$ is the toss at which the running head-minus-tail difference
          attains its maximum over the first fifty tosses.
        feedback: >
          The time of a maximum is the standard non-example — no value can be
          certified as the maximum until the whole window has been seen.
    rubric:
      - >
        Applies the test $\{T = n\} \in \mathcal{F}_n$ to each candidate
        individually.
      - >
        Identifies "first time a running statistic reaches a level" as the
        legitimate shape, and time-of-maximum and one-step-before as the two
        families that need the future.
    targets:
      - quant-processes.martingales.stopping-time
    exercises:
      - quant-processes.martingales.filtration

  - id: qmart-stopping-time-03
    kind: justify
    difficulty: standard
    statement: >
      Let $S$ and $T$ be stopping times for a filtration $(\mathcal{F}_n)$.
      Prove that $S \wedge T$, $S \vee T$ and $T + 5$ are stopping times, and
      exhibit a filtration and a stopping time $T$ for which $T - 1$ is not.
    answer: >
      Use the equivalent form $\{T \le n\} \in \mathcal{F}_n$. For the minimum,
      $\{S \wedge T \le n\} = \{S \le n\} \cup \{T \le n\}$, a union of two
      events in $\mathcal{F}_n$ and hence in $\mathcal{F}_n$; for the maximum,
      $\{S \vee T \le n\} = \{S \le n\} \cap \{T \le n\}$, likewise. In words:
      you have stopped by time $n$ under the earlier rule exactly when at least
      one rule has fired, and under the later rule exactly when both have. For
      the forward shift, $\{T + 5 = n\} = \{T = n - 5\} \in \mathcal{F}_{n-5}
      \subseteq \mathcal{F}_n$, using that the filtration increases — knowing
      five steps ago whether you stopped is more than enough to know it now. The
      backward shift genuinely fails. Take fair $\pm 1$ tosses with
      $\mathcal{F}_n$ generated by the first $n$, and let $T$ be the first time
      the walk hits $+1$. Then $\{T - 1 = 0\} = \{T = 1\} = \{X_1 = +1\}$, which
      is not in $\mathcal{F}_0$: at time $0$ nothing has been observed, yet the
      rule already demands you know how the first toss lands. That is the
      step-just-before family of non-examples, and it is why optional stopping
      never applies to selling one step before the top.
    rubric:
      - >
        Uses $\{T \le n\} \in \mathcal{F}_n$ and writes the min and max events
        as a union and an intersection.
      - >
        Justifies the forward shift with $\mathcal{F}_{n-5} \subseteq
        \mathcal{F}_n$, citing that the filtration increases.
      - >
        Exhibits a concrete $T$ with $\{T - 1 = n\} \notin \mathcal{F}_n$,
        rather than only asserting that the backward shift fails.
    targets:
      - quant-processes.martingales.stopping-time
    exercises:
      - quant-processes.martingales.filtration

  # --- the stopped process ----------------------------------------------------------

  - id: qmart-stopped-martingale-01
    kind: work
    difficulty: demanding
    statement: >
      Bet on fair even-money tosses with the doubling system: stake $1$ on the
      first round, double after each loss, and quit at $T$, the first win. Let
      $X_n$ be the net position after $n$ rounds, with $X_0 = 0$. Compute
      $\mathbb{E}[X_{T \wedge 3}]$.
    answer: >
      $0$. The stopped process is a martingale at every finite horizon with no
      hypotheses on $T$ beyond its being a stopping time, so the answer is
      $\mathbb{E}[X_0] = 0$ before any enumeration. Enumerating confirms it and
      shows what is really going on. With stakes $1, 2, 4$: a win in round $1$
      (probability $1/2$) leaves $+1$; a loss then a win (probability $1/4$)
      leaves $-1 + 2 = +1$; two losses then a win (probability $1/8$) leaves
      $-1 - 2 + 4 = +1$; and three losses (probability $1/8$) leave
      $-1 - 2 - 4 = -7$. So $\mathbb{E}[X_{T \wedge 3}] = \tfrac{7}{8}(1) +
      \tfrac{1}{8}(-7) = 0$: the rare large loss exactly pays for the many small
      wins, at every finite horizon. This is the sharpest way to see that
      $\mathbb{E}[X_T] = 1 \ne 0$ is not a failure of the stopped-process
      theorem but of the limit $n \to \infty$. Truncating is free; the whole
      difficulty is that the $-7$ branch never disappears, it only migrates
      further out and grows.
    expects: "0"
    rubric:
      - >
        Names $X_{T \wedge n}$ as a martingale at every fixed horizon, requiring
        no condition on $T$.
      - >
        Confirms by enumerating the four branches at horizon $3$, including the
        triple-loss branch worth $-7$, and gets exactly $0$.
    targets:
      - quant-processes.martingales.stopped-martingale
    exercises:
      - quant-processes.martingales.stopping-time
      - quant-processes.martingales.martingale-transform

  - id: qmart-stopped-martingale-02
    kind: work
    difficulty: standard
    statement: >
      A fair $\pm 1$ walk starts at $S_0 = 2$ and is absorbed on hitting $0$ or
      $7$. Compute $\mathbb{E}[S_{T \wedge 3}]$ by enumerating the eight
      three-step sign patterns.
    answer: >
      $2$. Track the eight equally likely patterns, remembering that the walk
      freezes the moment it touches a barrier. After two steps: $++$ reaches
      $4$, $+-$ and $-+$ return to $2$, and $--$ hits $0$ and is absorbed there.
      The third step splits each surviving branch: from $4$ to $5$ or $3$; from
      $2$ to $3$ or $1$, twice over. So $S_{T \wedge 3}$ takes the values
      $5, 3, 3, 1, 3, 1$ each with probability $1/8$, and the value $0$ with
      probability $2/8$, giving $(5 + 3 + 3 + 1 + 3 + 1)/8 = 16/8 = 2 = S_0$.
      That is the stopped-process theorem in action, and it holds at every
      horizon rather than only at $3$: no condition on $T$ is needed for the
      truncated statement, and a path absorbed early does not spoil it, because
      it simply contributes its frozen value from then on.
    expects: "2"
    rubric:
      - >
        Freezes a path at the moment it touches a barrier rather than letting it
        continue past $0$.
      - >
        Averages the eight equally likely outcomes and recovers $S_0 = 2$,
        recognising this as $\mathbb{E}[S_{T \wedge n}] = \mathbb{E}[S_0]$.
    targets:
      - quant-processes.martingales.stopped-martingale
    exercises:
      - quant-processes.martingales.stopping-time

  # --- optional stopping -------------------------------------------------------------

  - id: qmart-ost-01
    kind: work
    difficulty: demanding
    statement: >
      A fair $\pm 1$ walk starts at $0$ and stops at $T$, the first time it hits
      $-4$ or $+6$. Compute $\mathbb{E}[|S_T|]$, the expected distance from the
      start at the moment of stopping.
    answer: >
      $24/5 = 4.8$. First the licence: the stopped walk never leaves
      $[-4, 6]$, so $|S_{T \wedge n}| \le 6$ and condition (b) — a bounded
      stopped process — applies, giving $\mathbb{E}[S_T] = \mathbb{E}[S_0] = 0$.
      Since $S_T$ is $+6$ with probability $u$ and $-4$ with probability
      $1 - u$, that reads $6u - 4(1-u) = 0$, so $10u = 4$ and $u = 2/5$. Now the
      absolute value: $\mathbb{E}[|S_T|] = 6 \cdot \tfrac{2}{5} + 4 \cdot
      \tfrac{3}{5} = \tfrac{12}{5} + \tfrac{12}{5} = \tfrac{24}{5} = 4.8$. The
      two contributions being equal is no accident — each barrier contributes
      its distance times the probability of reaching it, and for a fair walk
      those probabilities are inversely proportional to the distances, so both
      terms equal $4 \cdot 6/10$. The trap is applying optional stopping to
      $|S_n|$ directly: $|S_n|$ is a submartingale, not a martingale, so
      $\mathbb{E}[|S_T|] = |S_0| = 0$ would be nonsense — the absolute value has
      to be averaged after the exit distribution is known.
    expects: "24/5"
    tolerance: 0.0005
    rubric:
      - >
        Names an optional-stopping condition — here the bounded stopped process
        — before writing $\mathbb{E}[S_T] = 0$.
      - >
        Derives the exit distribution first and only then averages $|S_T|$,
        rather than stopping $|S_n|$, which is a submartingale.
    targets:
      - quant-processes.martingales.ost
    exercises:
      - quant-processes.martingales.stopped-martingale

  - id: qmart-ost-02
    kind: work
    difficulty: standard
    statement: >
      A fair $\pm 1$ walk starts at $0$ and stops at $T$, the first time it hits
      $-5$ or $+15$. Find $\Pr(S_T = 15)$.
    answer: >
      $1/4 = 0.25$. The stopped walk stays inside $[-5, 15]$, so
      $|S_{T \wedge n}| \le 15$ and condition (b) licenses
      $\mathbb{E}[S_T] = \mathbb{E}[S_0] = 0$; naming the condition first is the
      whole discipline of the theorem. The exit value takes only two values, so
      with $u = \Pr(S_T = 15)$ we get $15u - 5(1 - u) = 0$, hence $20u = 5$ and
      $u = 1/4$. The shape worth remembering is that the probability of reaching
      a barrier is the *opposite* distance over the total width: the far barrier
      at $+15$ is three times as far as the near one at $-5$, so it is reached a
      third as often, $1/4$ against $3/4$. Reading it the other way round, as
      $15/20$, is the standard slip, and the check that catches it is that a
      fair walk starting much closer to one barrier must hit that one more
      often.
    expects: "1/4"
    tolerance: 0.0005
    rubric:
      - >
        States which optional-stopping condition is in force before using
        $\mathbb{E}[S_T] = 0$.
      - >
        Solves $15u - 5(1-u) = 0$ and reports the opposite-distance ratio
        $5/20$, not $15/20$.
    targets:
      - quant-processes.martingales.ost
    exercises:
      - quant-processes.martingales.stopped-martingale

  - id: qmart-ost-03
    kind: decide
    difficulty: demanding
    statement: >
      A fair $\pm 1$ walk starts at $0$ and $T$ is the first time it reaches
      $+1$. It is standard that $\Pr(T < \infty) = 1$, so $S_T = 1$ almost
      surely and $\mathbb{E}[S_T] = 1 \ne 0 = \mathbb{E}[S_0]$. Which of the
      three optional stopping conditions is satisfied here?
    answer: >
      None of the three, which is why the conclusion is false rather than merely
      unproved. Condition (a) fails because $T$ is unbounded:
      $\Pr(T > n) > 0$ for every $n$, and finite almost surely is not the same
      claim as bounded. Condition (b) fails because boundedness must be
      two-sided — $S_{T \wedge n} \le 1$ always, but the walk may descend to any
      depth before its first visit to $+1$, so no constant $C$ gives
      $|S_{T \wedge n}| \le C$. Condition (c) fails on its second half: the
      increments are $\pm 1$ and so are bounded, but $\mathbb{E}[T] = \infty$
      for the one-barrier fair walk — the same fact that appears as
      $k(N-k) \to \infty$ when a two-barrier problem has one barrier pushed to
      infinity. With every condition failing, the theorem simply declines to
      apply, and $\mathbb{E}[S_T] = 1$ is no contradiction at all. This walk is
      the one-barrier companion of the doubling strategy, and it exists to
      punish the unit's most common error: invoking $\mathbb{E}[S_T] =
      \mathbb{E}[S_0]$ for an unbounded stopping time without checking anything.
    choices:
      - text: >
          Condition (a): $T$ is bounded.
        feedback: >
          $\Pr(T > n) > 0$ for every $n$ — a walk can stay below $+1$ for
          arbitrarily long — so no constant $N$ bounds $T$. Note
          $\Pr(T < \infty) = 1$ is strictly weaker than boundedness.
      - text: >
          Condition (b): the stopped process is bounded.
        feedback: >
          It is bounded above by $1$, but boundedness means a two-sided bound
          $|S_{T \wedge n}| \le C$, and the walk can wander arbitrarily far
          below $0$ before it first reaches $+1$.
      - text: >
          Condition (c): $\mathbb{E}[T] < \infty$ together with bounded
          increments.
        feedback: >
          The increments are bounded by $1$, so half of (c) holds — but the
          one-barrier fair walk has $\mathbb{E}[T] = \infty$, which is exactly
          the half that fails.
      - text: >
          None of the three.
        correct: true
        feedback: >
          All three fail at once, which is why $\mathbb{E}[S_T] \ne
          \mathbb{E}[S_0]$ here is not a paradox: certain absorption at $+1$
          coexists with infinite expected time and unbounded excursions below.
    rubric:
      - >
        Rejects (a) by distinguishing $\Pr(T < \infty) = 1$ from boundedness of
        $T$.
      - >
        Rejects (b) by noticing the bound must hold on both sides, and (c) by
        identifying $\mathbb{E}[T] = \infty$ as the failing half.
    targets:
      - quant-processes.martingales.ost
    exercises:
      - quant-processes.martingales.stopping-time
      - quant-processes.martingales.stopped-martingale

  # --- optional stopping for unfavourable games -------------------------------------

  - id: qmart-ost-supermartingale-01
    kind: work
    difficulty: demanding
    statement: >
      A gambler starts with $12$ chips. At every round, and regardless of
      history, his stack rises by one chip with probability $0.48$ and falls by
      one with probability $0.52$. He quits at $T$, the first time he holds $0$
      or $40$ chips. Without solving the biased ruin recursion, give the
      sharpest upper bound optional stopping supplies for the probability that
      he reaches $40$.
    answer: >
      $3/10 = 0.3$. His stack satisfies $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n]
      = X_n + 0.48 - 0.52 = X_n - 0.04 \le X_n$, so it is a supermartingale, and
      $0 \le X_{T \wedge n} \le 40$ makes the stopped process bounded, which is
      condition (b). The supermartingale form of the theorem therefore gives
      $\mathbb{E}[X_T] \le \mathbb{E}[X_0] = 12$. The exit value is $40$ with
      probability $u$ and $0$ otherwise, so $40u \le 12$ and $u \le 12/40 =
      3/10$. The argument is worth its two lines because it needs no formula for
      biased ruin, only the sign of the edge and the two barrier levels. It is
      also loose, knowingly: the exact biased-ruin value here is about $0.068$,
      since with $q/p = 13/12$ the drift compounds over the twenty-eight chips
      he would have to climb. Equality would require a genuine martingale, which
      a game with an edge is not.
    expects: "3/10"
    tolerance: 0.0005
    rubric:
      - >
        Identifies the stack as a supermartingale from the sign of the per-round
        edge, and names the bounded stopped process as the condition.
      - >
        Uses $\mathbb{E}[X_T] \le \mathbb{E}[X_0]$ with $\mathbb{E}[X_T] = 40u$
        to get $u \le 12/40$, and says the bound is one-sided and loose.
    targets:
      - quant-processes.martingales.ost-supermartingale
    exercises:
      - quant-processes.martingales.ost

  - id: qmart-ost-supermartingale-02
    kind: decide
    difficulty: standard
    statement: >
      A trader's cumulative profit and loss $X_n$ loses $0.3$ units per round in
      conditional expectation, whatever the history, and $X_0 = 0$. She adopts
      the rule: stop as soon as cumulative profit reaches $+50$ units, or after
      $1000$ rounds, whichever comes first. Which statement about
      $\mathbb{E}[X_T]$ is correct, and for what reason?
    answer: >
      $\mathbb{E}[X_T] \le 0$, licensed by condition (a). The process is a
      supermartingale, since $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n] = X_n - 0.3
      \le X_n$ at every state. The exit rule is a stopping time — reaching $+50$
      is visible the round it happens, and counting to $1000$ needs no
      information at all — and the deadline makes it *bounded*, $T \le 1000$,
      which is condition (a) and requires nothing further to be checked. The
      supermartingale form then gives $\mathbb{E}[X_T] \le \mathbb{E}[X_0] = 0$.
      The content of that inequality is the corollary's practical reading: no
      stop-loss, take-profit or quit-while-ahead rule turns a negative-edge
      strategy into a nonnegative-edge one, because every such rule is a
      stopping time and stopping never helps a supermartingale. The deadline is
      doing real work here — without it $T$ would be unbounded and the process
      unbounded below, and you would have to argue for (b) or (c) instead.
    choices:
      - text: >
          $\mathbb{E}[X_T] \le 0$, licensed by condition (a) — the rule stops at
          or before round $1000$, so $T$ is a bounded stopping time.
        correct: true
        feedback: >
          Exactly: the hard deadline bounds $T$ by $1000$, condition (a) needs
          nothing else, and the supermartingale form then gives
          $\mathbb{E}[X_T] \le \mathbb{E}[X_0] = 0$.
      - text: >
          $\mathbb{E}[X_T] = 0$, since stopping rules never change a game's
          expectation.
        feedback: >
          Equality is the martingale conclusion; with a strictly negative drift
          the process is a supermartingale and the theorem promises only the
          one-sided bound.
      - text: >
          $\mathbb{E}[X_T] \ge 0$, since the rule locks in a gain whenever the
          take-profit triggers.
        feedback: >
          That is the submartingale direction. The take-profit does trigger
          sometimes, but it is paid for by the paths that run the full thousand
          rounds at a loss — the rule reshapes the distribution, not its mean.
      - text: >
          Nothing can be said, because $T$ depends on the path and so is not
          bounded.
        feedback: >
          Depending on the path is what a stopping time does; what matters is
          that this one can never exceed $1000$, which is precisely condition
          (a).
    rubric:
      - >
        Establishes the supermartingale property from the constant negative
        conditional drift.
      - >
        Names condition (a) specifically — the deadline bounds $T$ — rather than
        asserting the conclusion unconditionally, and keeps the inequality
        one-sided.
    targets:
      - quant-processes.martingales.ost-supermartingale
    exercises:
      - quant-processes.martingales.ost
      - quant-processes.martingales.stopping-time

  # --- gambler's ruin in three lines --------------------------------------------------

  - id: qmart-ruin-via-ost-01
    kind: work
    difficulty: demanding
    statement: >
      A walker starts at $3$, steps $+1$ with probability $1/3$ and $-1$ with
      probability $2/3$, and stops on reaching $0$ or $7$. Find the probability
      that he reaches $7$ before $0$.
    answer: >
      $7/127 \approx 0.0551$. The level $S_n$ is not a martingale here — its
      drift is $p - q = -1/3$ — so reach instead for the geometric martingale
      $(q/p)^{S_n} = 2^{S_n}$, whose one-step multiplier averages to
      $p(q/p) + q(p/q) = q + p = 1$. It is bounded on $[0, 7]$, so condition (b)
      applies and optional stopping is licensed:
      $2^{3} = \mathbb{E}[2^{S_T}] = u \cdot 2^{7} + (1 - u) \cdot 2^{0}$ with
      $u = \Pr(\text{reach } 7)$. That is $8 = 128u + 1 - u = 127u + 1$, so
      $u = 7/127$. The general formula
      $u = (1 - (q/p)^{k})/(1 - (q/p)^{N})$ at $(q/p, k, N) = (2, 3, 7)$ gives
      $(1 - 8)/(1 - 128) = 7/127$ identically. Note how brutal the bias is:
      starting past the midpoint he still reaches the top barrier only about
      once in eighteen attempts, because each unit of climb costs a factor of
      $2$ in probability. Using $S_n$ here — the fair case's martingale — would
      have produced the wrong answer $3/7$.
    expects: "7/127"
    tolerance: 0.0005
    rubric:
      - >
        Rejects $S_n$ as the martingale once $p \ne 1/2$ and uses
        $(q/p)^{S_n}$ instead.
      - >
        Names the boundedness of $(q/p)^{S_n}$ on $[0, N]$ as the
        optional-stopping condition, then solves the single linear equation.
    targets:
      - quant-processes.martingales.ruin-via-ost
      - quant-processes.ruin.biased
    exercises:
      - quant-processes.martingales.ost
      - quant-processes.martingales.examples-zoo
    connects:
      - quant-processes.martingales.ruin-via-ost ~ quant-processes.ruin.biased

  - id: qmart-ruin-via-ost-02
    kind: work
    difficulty: standard
    statement: >
      A fair $\pm 1$ walker starts at $9$ between absorbing barriers at $0$ and
      $24$. Find the probability he is absorbed at $24$.
    answer: >
      $3/8 = 0.375$. In the fair case $S_n$ is itself the martingale, and the
      two-barrier setup supplies the condition for free: the walk is trapped in
      $[0, 24]$ until it stops, so $0 \le S_{T \wedge n} \le 24$ and condition
      (b) holds. Condition (c) also holds, since any run of $24$ consecutive
      up-moves ends the game, so $T$ is dominated by a geometric number of such
      blocks and $\mathbb{E}[T] < \infty$, while the increments are $\pm 1$.
      Optional stopping then reads $9 = \mathbb{E}[S_0] = \mathbb{E}[S_T] =
      24\Pr(\text{hit } 24) + 0$, so $\Pr(\text{hit } 24) = 9/24 = 3/8$ and the
      ruin probability is $5/8$. This is the same $k/N$ a first-step recurrence
      produces after solving a linear system; martingales get it in one
      substitution, because $\mathbb{E}[S_T]$ is fixed before the exit
      distribution is known.
    expects: "3/8"
    tolerance: 0.0005
    rubric:
      - >
        Uses $S_n$ as the martingale and names a condition — bounded stopped
        process, or $\mathbb{E}[T] < \infty$ with bounded increments — before
        applying the theorem.
      - >
        Reads $\mathbb{E}[S_T] = N \Pr(\text{hit } N)$ off the two-point exit
        distribution and solves for $k/N$.
    targets:
      - quant-processes.martingales.ruin-via-ost
      - quant-processes.ruin.fair
    exercises:
      - quant-processes.martingales.ost
      - quant-processes.martingales.examples-zoo
    connects:
      - quant-processes.martingales.ruin-via-ost ~ quant-processes.ruin.fair

  - id: qmart-ruin-via-ost-03
    kind: justify
    difficulty: demanding
    statement: >
      A walker starts at $k$ with $0 < k < N$, steps $+1$ with probability
      $p \ne 1/2$ and $-1$ with probability $q = 1 - p$, and stops at $T$, the
      first time he reaches $0$ or $N$. Derive
      $\Pr(\text{reach } N) = (1 - (q/p)^{k})/(1 - (q/p)^{N})$ by optional
      stopping, naming and justifying the condition you use.
    answer: >
      Take $M_n = (q/p)^{S_n}$. It is a martingale: $M_{n+1} = M_n
      (q/p)^{X_{n+1}}$, the factor $M_n$ is fixed by $\mathcal{F}_n$, and the
      new step is independent of the past with $\mathbb{E}[(q/p)^{X}] =
      p(q/p) + q(p/q) = q + p = 1$, so $\mathbb{E}[M_{n+1} \mid \mathcal{F}_n]
      = M_n$. Now the condition. Until it stops the walk lies in
      $\{0, 1, \dots, N\}$, so $M_{T \wedge n}$ lies between $\min(1,
      (q/p)^{N})$ and $\max(1, (q/p)^{N})$ for every $n$: the stopped process is
      bounded, which is condition (b), and nothing further is needed. Condition
      (c) is also available, since any block of $N$ consecutive up-moves ends
      the game, so $T$ is dominated by a geometric number of blocks and
      $\mathbb{E}[T] < \infty$, while $M$ has bounded increments because it is
      bounded. Optional stopping therefore gives $\mathbb{E}[M_T] = M_0 =
      (q/p)^{k}$. Since $S_T \in \{0, N\}$, writing $u = \Pr(S_T = N)$ makes the
      left side $u(q/p)^{N} + (1 - u)$, and solving $(q/p)^{k} = u(q/p)^{N} + 1
      - u$ gives $u((q/p)^{N} - 1) = (q/p)^{k} - 1$, that is
      $u = (1 - (q/p)^{k})/(1 - (q/p)^{N})$. Two remarks: $p \ne 1/2$ is used
      only to keep $q/p \ne 1$ so the denominator is nonzero, and $S_n$ is not
      available in place of $M_n$ the moment $p \ne 1/2$, because it then has
      drift $p - q \ne 0$.
    rubric:
      - >
        Verifies $\mathbb{E}[(q/p)^{X}] = 1$ explicitly — this is what makes
        $(q/p)^{S_n}$ a martingale, and the whole derivation rests on it.
      - >
        Names an optional-stopping condition and justifies it from the two
        barriers, rather than applying the theorem silently.
      - >
        Solves the single linear equation correctly and notes the derivation
        needs $q/p \ne 1$.
    targets:
      - quant-processes.martingales.ruin-via-ost
    exercises:
      - quant-processes.martingales.ost
      - quant-processes.martingales.examples-zoo

  # --- expected duration via the compensated square ------------------------------------

  - id: qmart-hitting-time-quadratic-01
    kind: work
    difficulty: demanding
    statement: >
      A walker starts at $2$, steps $+1$ with probability $1/3$ and $-1$ with
      probability $2/3$, and stops at $T$, the first time he reaches $0$ or $5$.
      Compute $\mathbb{E}[T]$ exactly.
    answer: >
      $141/31 \approx 4.548$. In the biased case the compensated square is not
      the tool; the recentred level is. First get the exit distribution from the
      geometric martingale $2^{S_n}$: with $q/p = 2$,
      $u = \Pr(\text{reach } 5) = (1 - 2^{2})/(1 - 2^{5}) = (-3)/(-31) = 3/31$.
      Now stop the level martingale $S_n - n(p - q)$, whose increments are
      bounded and for which $\mathbb{E}[T] < \infty$, so condition (c) applies:
      $\mathbb{E}[S_T] - (p - q)\mathbb{E}[T] = S_0 = 2$. The drift is
      $p - q = -1/3$ and the exit mean is $\mathbb{E}[S_T] = 5u = 15/31$, so
      $\mathbb{E}[T] = (\mathbb{E}[S_T] - k)/(p - q) = (15/31 - 2)/(-1/3) =
      (-47/31)(-3) = 141/31$. A first-step recurrence $E_k = 1 + pE_{k+1} +
      qE_{k-1}$ with $E_0 = E_5 = 0$ returns the same $141/31$ after four
      simultaneous equations, which is exactly the work optional stopping
      avoids. The characteristic slip is reaching for $k(N - k) = 6$: that is
      the *fair* walk's duration and has no business in a biased problem.
    expects: "141/31"
    tolerance: 0.0005
    rubric:
      - >
        Computes the biased exit probability first, then feeds
        $\mathbb{E}[S_T]$ into the stopped level martingale — the two steps in
        that order.
      - >
        Uses $S_n - n(p-q)$ rather than $S_n^{2} - n$, and does not quote
        $k(N-k)$, which belongs to the fair case.
    targets:
      - quant-processes.martingales.hitting-time-quadratic
    exercises:
      - quant-processes.martingales.ruin-via-ost

  - id: qmart-hitting-time-quadratic-02
    kind: work
    difficulty: standard
    statement: >
      A fair $\pm 1$ walker starts at $9$ between absorbing barriers at $0$ and
      $24$. Compute the expected number of steps until absorption.
    answer: >
      $135$. Stop the compensated square $S_n^{2} - n$, whose increments
      $2S_nX_{n+1} + 1$ are bounded by $2 \cdot 24 + 1$ while the walk is
      trapped in $[0, 24]$, and for which $\mathbb{E}[T] < \infty$ — condition
      (c). Optional stopping gives $\mathbb{E}[S_T^{2}] - \mathbb{E}[T] =
      S_0^{2} = 81$. The exit position is already known from the ruin
      computation: $S_T$ is $24$ with probability $9/24$ and $0$ otherwise, so
      $\mathbb{E}[S_T^{2}] = 24^{2}(9/24) = 216$. Hence $\mathbb{E}[T] = 216 -
      81 = 135$, which is $k(N - k) = 9 \cdot 15$ as the general formula
      promises. Reaching for $S_n$ again cannot work: it was spent on the exit
      probability and carries no time information, and its stopped identity
      $\mathbb{E}[S_T] = 9$ says nothing about $T$ at all. As a sanity check the
      duration is maximal at the midpoint $k = 12$, where it is $144$.
    expects: "135"
    rubric:
      - >
        Stops $S_n^{2} - n$, not $S_n$, and says why the level cannot deliver a
        time.
      - >
        Substitutes the already-known exit distribution to get
        $\mathbb{E}[S_T^{2}] = kN$, then rearranges to $k(N-k)$.
    targets:
      - quant-processes.martingales.hitting-time-quadratic
      - quant-processes.ruin.duration
    exercises:
      - quant-processes.martingales.ruin-via-ost
    connects:
      - quant-processes.martingales.hitting-time-quadratic ~ quant-processes.ruin.duration

  # --- Wald's identity --------------------------------------------------------------------

  - id: qmart-wald-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed repeatedly. Each head pays you $5$ units and each
      tail costs you $2$ units. You stop at $N$, the toss on which the fourth
      head appears. Compute your expected total winnings $\mathbb{E}[S_N]$.
    answer: >
      $12$. Wald's identity needs two inputs and one hypothesis. The hypothesis:
      $N$ is a stopping time, since counting heads uses only tosses already
      seen, and $\mathbb{E}[N] < \infty$. The inputs: the per-toss mean is
      $\mu = \tfrac{1}{2}(5) + \tfrac{1}{2}(-2) = 3/2$, and $N$ is a sum of four
      independent geometric waits each of mean $1/p = 2$, so $\mathbb{E}[N] =
      8$. Wald gives $\mathbb{E}[S_N] = \mu\,\mathbb{E}[N] = \tfrac{3}{2}
      \cdot 8 = 12$. The direct count confirms it and is worth doing: the
      stopped sequence contains exactly $4$ heads, worth $20$, and on average
      $8 - 4 = 4$ tails, costing $8$, for $20 - 8 = 12$. The temptation to
      resist is adjusting $\mu$ for the stopping event — reasoning that the last
      toss is certainly a head, so the average toss must be better than $3/2$.
      It is not: $N$ looks only backwards, and Wald's whole content is that this
      leaves $\mathbb{E}[X_i]$ untouched on the event $\{N \ge i\}$.
    expects: "12"
    rubric:
      - >
        Computes $\mathbb{E}[N] = 8$ as four independent geometric waits and
        $\mu = 3/2$ as the unconditional per-toss mean.
      - >
        Checks $N$ is a stopping time with finite mean before applying the
        identity, and does not adjust $\mu$ for the final toss being a head.
    targets:
      - quant-processes.martingales.wald
    exercises:
      - quant-processes.martingales.stopping-time

  - id: qmart-wald-02
    kind: work
    difficulty: standard
    statement: >
      A bag holds five chips numbered $1$ through $5$. You draw one uniformly at
      random, note its number, return it, and repeat until the first time you
      draw the chip numbered $5$. Compute the expected total of all the numbers
      you noted.
    answer: >
      $15$. The number of draws $N$ is geometric with success probability $1/5$,
      so $\mathbb{E}[N] = 5$; the per-draw mean is $\mu = (1+2+3+4+5)/5 = 3$;
      and $N$ is a stopping time, since whether you have stopped by draw $i$ is
      decided by draws $1$ through $i$. Wald's identity therefore gives
      $\mathbb{E}[S_N] = \mu\,\mathbb{E}[N] = 3 \cdot 5 = 15$. The direct route
      agrees: the final draw contributes exactly $5$, and the preceding draws
      number $\mathbb{E}[N] - 1 = 4$ on average and are uniform on
      $\{1, 2, 3, 4\}$ with mean $5/2$, for $5 + 4 \cdot \tfrac{5}{2} = 15$.
      That the two routes agree is the point: Wald's $\mu$ is the plain
      unconditional mean $3$, even though no individual draw in the stopped
      sequence actually has that distribution.
    expects: "15"
    rubric:
      - >
        Identifies $\mathbb{E}[N] = 5$ from the geometric law and $\mu = 3$ as
        the unconditional draw mean.
      - >
        Applies $\mathbb{E}[S_N] = \mu\,\mathbb{E}[N]$ rather than splitting the
        sequence into its last draw and the rest and losing a term.
    targets:
      - quant-processes.martingales.wald
    exercises:
      - quant-processes.martingales.stopping-time

  # --- Wald's second identity -------------------------------------------------------------

  - id: qmart-wald-second-01
    kind: work
    difficulty: demanding
    statement: >
      A fair $\pm 1$ walk starts at $0$ and stops at $T$, the first time it hits
      $-5$ or $+6$. Use Wald's second identity to compute $\mathbb{E}[T]$.
    answer: >
      $30$. With mean-zero, unit-variance increments the identity reads
      $\mathbb{E}[S_T^{2}] = \sigma^{2}\mathbb{E}[T] = \mathbb{E}[T]$, so
      computing the exit position's second moment computes the exit time. The
      exit distribution comes from stopping the level: $\mathbb{E}[S_T] = 0$
      gives $6u - 5(1 - u) = 0$, so $u = \Pr(S_T = 6) = 5/11$ and
      $\Pr(S_T = -5) = 6/11$. Then $\mathbb{E}[S_T^{2}] = 36 \cdot \tfrac{5}{11}
      + 25 \cdot \tfrac{6}{11} = \tfrac{180 + 150}{11} = 30$, so
      $\mathbb{E}[T] = 30$. The pattern is worth keeping: for barriers at $-a$
      and $+b$ the expected exit time of a fair walk is exactly $ab$, here
      $5 \cdot 6$. What must not be written is $\operatorname{Var}(S_T) =
      \sigma^{2}\mathbb{E}[T]$ — the random-sums variance formula needs $T$
      independent of the increments, and for a barrier-hitting time they are as
      dependent as two things can be. Here $\mathbb{E}[S_T] = 0$ happens to make
      the two numerically equal, which is precisely the coincidence that lets
      the error pass unnoticed elsewhere.
    expects: "30"
    rubric:
      - >
        Derives the exit distribution first, then uses $\mathbb{E}[S_T^{2}] =
        \sigma^{2}\mathbb{E}[T]$ in its $\mu = 0$ form.
      - >
        Distinguishes the identity from $\operatorname{Var}(S_T)$, naming the
        independence hypothesis the variance formula would need.
    targets:
      - quant-processes.martingales.wald-second
    exercises:
      - quant-processes.martingales.wald

  - id: qmart-wald-second-02
    kind: work
    difficulty: standard
    statement: >
      Independent, identically distributed increments have mean $\mu = 2$ and
      variance $\sigma^{2} = 9$. A stopping time $N$ for the sequence has
      $\mathbb{E}[N] = 6$ and $\operatorname{Var}(N) = 4$. Compute
      $\mathbb{E}[(S_N - 2N)^{2}]$.
    answer: >
      $54$. Wald's second identity is $\mathbb{E}[(S_N - N\mu)^{2}] =
      \sigma^{2}\,\mathbb{E}[N]$, which holds for any stopping time with
      $\mathbb{E}[N] < \infty$ and asks nothing else of $N$. Substituting,
      $9 \cdot 6 = 54$. Note what the answer does *not* use:
      $\operatorname{Var}(N) = 4$ is a deliberate distractor. The formula that
      would consume it, $\operatorname{Var}(S_N) = \sigma^{2}\mathbb{E}[N] +
      \mu^{2}\operatorname{Var}(N) = 54 + 16 = 70$, is the variance of a
      randomly stopped sum and requires $N$ to be *independent* of the increment
      sequence — a strictly stronger hypothesis than being a stopping time, and
      one this problem never grants. So $70$ answers a different question, and
      would also be the wrong value for $\operatorname{Var}(S_N)$ unless
      independence were separately assumed. The identity asked for is the one
      built to survive exactly that dependence.
    expects: "54"
    rubric:
      - >
        Applies $\sigma^{2}\mathbb{E}[N]$ directly and leaves
        $\operatorname{Var}(N)$ unused.
      - >
        Names why the random-sums variance formula does not apply: it needs $N$
        independent of the increments, not merely a stopping time.
    targets:
      - quant-processes.martingales.wald-second
    exercises:
      - quant-processes.martingales.wald

  # --- ABRACADABRA -----------------------------------------------------------------------

  - id: qmart-abracadabra-01
    kind: work
    difficulty: demanding
    statement: >
      A monkey types letters independently and uniformly from a $26$-letter
      alphabet, one per second. Using the team-of-gamblers construction, compute
      the expected number of seconds until the word ALFALFA first appears.
    answer: >
      $8032267178$ seconds. Run the casino: just before each second a fresh
      gambler stakes one unit at fair odds of $26$ to $1$ on the next letter
      being A, then parlays everything onto L, then F, and so on through
      ALFALFA, cashing $26^{7}$ if he completes it and going broke at the first
      mismatch. Every gambler plays a fair game, so the pooled holding $W_n$
      makes $M_n = W_n - n$ a martingale from $0$; the increments are bounded
      and $\mathbb{E}[T] < \infty$ because disjoint seven-letter blocks each
      spell the word with probability $26^{-7}$, so optional stopping gives
      $\mathbb{E}[T] = \mathbb{E}[W_T]$. The survivors at $T$ are the gamblers
      whose progress matches a self-overlap — a prefix equal to a suffix of the
      same length. Checking all seven lengths: $j = 1$ gives A against A, a
      match; $j = 2$ gives AL against FA, no; $j = 3$ gives ALF against LFA, no;
      $j = 4$ gives ALFA against ALFA, a match; $j = 5$ gives ALFAL against
      FALFA, no; $j = 6$ gives ALFALF against LFALFA, no; and $j = 7$ always
      matches. So $\mathbb{E}[T] = 26^{7} + 26^{4} + 26 = 8031810176 + 456976 +
      26 = 8032267178$. Missing the $j = 4$ overlap — easy to overlook, being
      neither the whole word nor a single letter — costs $456976$ seconds.
    expects: "8032267178"
    rubric:
      - >
        Checks every overlap length $j = 1, \dots, 7$ rather than only the
        single letter and the whole word, finding matches at $1$, $4$ and $7$.
      - >
        Sums $26^{j}$ over the matches and justifies optional stopping with
        bounded increments and $\mathbb{E}[T] < \infty$.
    targets:
      - quant-processes.martingales.abracadabra
    exercises:
      - quant-processes.martingales.ost

  - id: qmart-abracadabra-02
    kind: work
    difficulty: standard
    statement: >
      Same typing monkey and same $26$-letter alphabet. Compute the expected
      number of seconds until the word TOTO first appears.
    answer: >
      $457652$ seconds. Set up the same casino — a new gambler each second,
      staking one unit at $26$-to-$1$ odds on T and parlaying through O, T, O —
      and read off which gamblers are still solvent when the word first
      completes. The self-overlaps of TOTO are the lengths $j$ at which the
      first $j$ letters equal the last $j$: $j = 1$ compares T with O, no;
      $j = 2$ compares TO with TO, a match; $j = 3$ compares TOT with OTO, no;
      and $j = 4$ is the whole word, always a match. The survivors therefore
      hold $26^{4} + 26^{2} = 456976 + 676 = 457652$ units, and since
      $W_n - n$ is a martingale from $0$ with bounded increments and
      $\mathbb{E}[T] < \infty$, optional stopping gives $\mathbb{E}[T] =
      \mathbb{E}[W_T] = 457652$. Compare TOTA, which has no self-overlap at all
      and waits only $26^{4} = 456976$ seconds: the extra $676$ is the price of
      TOTO being able to half-restart inside itself.
    expects: "457652"
    rubric:
      - >
        Finds the single nontrivial overlap at $j = 2$ and also includes the
        trivial $j = 4$ term.
      - >
        Reads $\mathbb{E}[T]$ off as the survivors' total holding, having noted
        that $W_n - n$ is a martingale.
    targets:
      - quant-processes.martingales.abracadabra
    exercises:
      - quant-processes.martingales.ost

  - id: qmart-abracadabra-03
    kind: justify
    difficulty: demanding
    statement: >
      In the ABRACADABRA casino a fresh gambler enters just before each second,
      stakes one unit at fair odds of $26$ to $1$ on the next letter matching
      the first letter of the target word, and parlays his whole holding through
      the word, going broke at the first mismatch. Let $W_n$ be the gamblers'
      total holding after $n$ seconds. Prove that $M_n = W_n - n$ is a
      martingale starting at $0$, and state and justify the optional-stopping
      condition that turns this into $\mathbb{E}[T] = \mathbb{E}[W_T]$.
    answer: >
      Fix one gambler and let $G_n$ be his holding. A parlay at fair odds is a
      fair bet: whatever he holds, he either multiplies it by $26$ with
      probability $1/26$ or loses all of it, so $\mathbb{E}[G_{n+1} \mid
      \mathcal{F}_n] = \tfrac{1}{26}(26 G_n) + \tfrac{25}{26}(0) = G_n$; a
      gambler already broke stays at $0$ and one who has finished holds a fixed
      amount, so the identity is trivial for them too. Each gambler's holding is
      therefore a martingale, and $W_n$ is a sum of them — but a *growing* sum,
      because one new unit of stake enters each second. Precisely,
      $\mathbb{E}[W_{n+1} \mid \mathcal{F}_n] = W_n + 1$: the existing holdings
      are conditionally unchanged and the new gambler contributes his stake of
      $1$. Subtracting the running total of that constant drift,
      $\mathbb{E}[M_{n+1} \mid \mathcal{F}_n] = W_n + 1 - (n+1) = W_n - n =
      M_n$, so $M_n$ is a martingale, and $M_0 = W_0 - 0 = 0$ since nobody has
      staked yet. For the condition use (c). The increments of $M$ are bounded,
      since between consecutive seconds the total holding changes by at most the
      largest possible parlay plus the one new unit, a constant fixed by the
      word's length. And $\mathbb{E}[T] < \infty$: cut the letter stream into
      disjoint blocks of the word's length, each spelling the word with
      probability $26^{-\ell} > 0$ independently of the others, so $T$ is
      dominated by that length times a geometric number of blocks. Both halves
      of (c) hold, so $\mathbb{E}[M_T] = 0$, that is $\mathbb{E}[T] =
      \mathbb{E}[W_T]$. The finiteness is not free — the disjoint-block argument
      earns it — and skipping it is the standard omission.
    rubric:
      - >
        Shows one gambler's holding is a martingale from the fair-odds parlay,
        then handles the entering stake as a constant drift of $+1$ per second.
      - >
        Identifies $M_0 = 0$ and subtracts $n$ as the compensator, rather than
        claiming $W_n$ itself is a martingale.
      - >
        Names condition (c) and justifies both halves: bounded increments, and
        $\mathbb{E}[T] < \infty$ by a disjoint-block domination argument.
    targets:
      - quant-processes.martingales.abracadabra
    exercises:
      - quant-processes.martingales.ost
      - quant-processes.martingales.martingale

  # --- waiting time for any pattern ---------------------------------------------------------

  - id: qmart-pattern-waiting-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed repeatedly. Compute the expected number of tosses
      until the pattern HTHTH first appears.
    answer: >
      $42$. The overlap sum is $\mathbb{E}[T] = \sum_j 1/\Pr(\text{the first } j
      \text{ letters})$, one term for each length $j$ at which the pattern's
      first $j$ letters equal its last $j$. For HTHTH: $j = 1$ compares H with
      H, a match; $j = 2$ compares HT with TH, no; $j = 3$ compares HTH with
      HTH, a match; $j = 4$ compares HTHT with THTH, no; and $j = 5$ is the
      whole pattern. With a fair coin the first $j$ letters have probability
      $2^{-j}$, so $\mathbb{E}[T] = 2^{5} + 2^{3} + 2^{1} = 32 + 8 + 2 = 42$.
      The comparison that makes the mechanism visible: HTHTT has the same length
      but no self-overlap at all, and waits only $32$ tosses. The extra ten
      tosses for HTHTH are the price of its two ways of half-restarting — a
      failure at the last letter still leaves three letters of progress, which
      sounds like an advantage and is really a symptom of how many near-misses
      the pattern generates. Dropping the $j = 3$ overlap, the easy one to miss,
      gives the wrong answer $34$.
    expects: "42"
    rubric:
      - >
        Checks all five overlap lengths and finds matches at $j = 1, 3, 5$.
      - >
        Sums the reciprocal prefix probabilities $2^{j}$, including the trivial
        full-pattern term.
    targets:
      - quant-processes.martingales.pattern-waiting
    exercises:
      - quant-processes.martingales.abracadabra

  - id: qmart-pattern-waiting-02
    kind: work
    difficulty: standard
    statement: >
      A biased coin shows heads with probability $1/3$. Compute the expected
      number of tosses until two heads in a row first appear.
    answer: >
      $12$. The overlap formula is stated in terms of prefix *probabilities*,
      not pattern length, so a biased coin needs no new argument. HH
      self-overlaps at $j = 1$, since its first letter equals its last, and at
      $j = 2$, the whole pattern, so $\mathbb{E}[T] = 1/\Pr(HH) + 1/\Pr(H) =
      9 + 3 = 12$. First-step analysis confirms it: writing $E$ for the wait
      from scratch and $E_1$ for the wait having just seen one head,
      $E = 1 + \tfrac{1}{3}E_1 + \tfrac{2}{3}E$ and $E_1 = 1 + \tfrac{2}{3}E$,
      which give $E = 12$ and $E_1 = 9$ — the same numbers, from a linear system
      the overlap sum skips entirely. The contrast with the non-overlapping HT
      is sharper here than for a fair coin: HT waits $1/\Pr(HT) =
      1/(\tfrac{1}{3}\cdot\tfrac{2}{3}) = 9/2$ tosses against $12$ for HH, even
      though a given pair of tosses is likelier to read HT than HH. Setting
      $p = 1/2$ recovers the familiar $4 + 2 = 6$ against $4$.
    expects: "12"
    rubric:
      - >
        Uses reciprocal prefix probabilities $1/\Pr(HH)$ and $1/\Pr(H)$ rather
        than powers of $2$.
      - >
        Includes the $j = 1$ overlap; dropping it would give $9$, the answer for
        a pattern of the same probability with no self-overlap.
    targets:
      - quant-processes.martingales.pattern-waiting
      - quant-tools.recurrences.hh-vs-ht
    exercises:
      - quant-processes.martingales.abracadabra
    connects:
      - quant-processes.martingales.pattern-waiting ~ quant-tools.recurrences.hh-vs-ht

  # --- why doubling is not free money ---------------------------------------------------------

  - id: qmart-martingale-betting-fallacy-01
    kind: work
    difficulty: demanding
    statement: >
      A player uses the doubling system on a roulette even-money bet that wins
      with probability $18/38$: stake $1$, double after each loss, and quit at
      the first win. His bankroll is $7$ units, so he can afford at most three
      rounds and is wiped out by three straight losses. Compute his expected net
      outcome exactly.
    answer: >
      $-1141/6859 \approx -0.1664$ units. The bankroll bounds the stopping time
      — condition (a) — so optional stopping applies and there is no paradox to
      resolve; the only question is what the two outcomes are worth. He wins
      exactly $1$ unit unless he loses three times running, in which case he has
      staked $1 + 2 + 4 = 7$ and lost all of it. A loss has probability
      $20/38 = 10/19$, so three straight losses have probability
      $(10/19)^{3} = 1000/6859$, and the expectation is
      $1 \cdot (1 - \tfrac{1000}{6859}) - 7 \cdot \tfrac{1000}{6859} =
      \tfrac{5859 - 7000}{6859} = -\tfrac{1141}{6859}$. The lesson is the one
      the fair case hides: with a fair coin the same bounded strategy returns
      exactly $0$, so doubling neither helps nor hurts, but against an edge it
      returns the edge times the expected total stake — and doubling makes that
      stake *larger*. Indeed the expected total staked is
      $1 + 2(\tfrac{10}{19}) + 4(\tfrac{100}{361}) = \tfrac{361 + 380 +
      400}{361} = \tfrac{1141}{361}$, and multiplying by the per-unit edge
      $-\tfrac{1}{19}$ returns $-\tfrac{1141}{6859}$ exactly.
    expects: "-1141/6859"
    tolerance: 0.0005
    rubric:
      - >
        Computes the ruin probability as $(10/19)^{3}$ and weights the two
        outcomes $+1$ and $-7$.
      - >
        Notes that the bankroll bounds $T$ so the theorem applies, and that the
        shortfall equals the house edge times the expected total stake, which
        doubling inflates.
    targets:
      - quant-processes.martingales.martingale-betting-fallacy
    exercises:
      - quant-processes.martingales.ost

  - id: qmart-martingale-betting-fallacy-02
    kind: work
    difficulty: standard
    statement: >
      A player uses the doubling system on fair even-money bets with a bankroll
      of $127$ units, so he can stake $1, 2, 4, \dots, 64$ and is wiped out only
      by seven straight losses. Find the probability that he loses his entire
      bankroll.
    answer: >
      $1/128 = 0.0078125$. The stakes $1, 2, 4, \dots, 64$ sum to
      $2^{7} - 1 = 127$, so the bankroll funds exactly seven rounds and ruin
      means seven consecutive losses: $\Pr = (1/2)^{7} = 1/128$. The point of
      the number is what it buys. With probability $127/128$ he walks away
      exactly $1$ unit ahead, and with probability $1/128$ he is down $127$, so
      the expected net is $\tfrac{127}{128}(1) + \tfrac{1}{128}(-127) = 0$ —
      fairness restored the instant a finite bound is imposed. That is the whole
      resolution of the doubling paradox: the unbounded version wins $+1$ almost
      surely only because it may lose unboundedly much for unboundedly long, and
      all three optional stopping conditions fail together. Capping the bankroll
      bounds the stopping time, the stopped process and the increments at once,
      and the theorem immediately returns the answer it always should have.
    expects: "1/128"
    tolerance: 0.0005
    rubric:
      - >
        Recognises that a bankroll of $2^{m} - 1$ funds exactly $m$ doublings,
        here $m = 7$.
      - >
        Reports $(1/2)^{7}$ and confirms the strategy's expected net is exactly
        $0$ once the bankroll is finite.
    targets:
      - quant-processes.martingales.martingale-betting-fallacy
    exercises:
      - quant-processes.martingales.ost

  # --- the maximal inequality -------------------------------------------------------------------

  - id: qmart-maximal-inequality-01
    kind: work
    difficulty: demanding
    statement: >
      A fair $\pm 1$ walk starts at $0$ and is stopped for good if it ever
      reaches $-6$. Use the maximal inequality to bound
      $\Pr(\sup_n S_n \ge 15)$, the probability that the walk ever reaches
      $+15$.
    answer: >
      $2/7 \approx 0.2857$. The maximal inequality needs a *nonnegative*
      supermartingale, and $S_n$ is neither nonnegative nor stopped, so shift
      and stop first: let $X_n = S_{T \wedge n} + 6$, where $T$ is the first hit
      of $-6$. Then $X_n$ is a constant plus a stopped martingale, hence a
      martingale and in particular a supermartingale, and it is nonnegative
      because the stopped walk never goes below $-6$. Its start is $X_0 = 6$.
      The event that the walk ever reaches $+15$ becomes
      $\sup_n X_n \ge 21$ in the shifted coordinates — note the shift moves the
      threshold as well as the process, which is where this goes wrong if done
      carelessly. The inequality then gives
      $\Pr(\sup_n X_n \ge 21) \le \mathbb{E}[X_0]/21 = 6/21 = 2/7$. Here the
      bound is in fact attained: the exact two-barrier answer for a fair walk
      starting $6$ above the lower barrier and $15$ below the upper is also
      $6/21$, which is the general truth that the inequality is tight for a
      nonnegative martingale that can actually reach the level. Forgetting to
      shift the threshold, and bounding by $6/15$, is the error the shift is
      designed to expose.
    expects: "2/7"
    tolerance: 0.0005
    rubric:
      - >
        Shifts the walk to make it nonnegative and stops it at the lower
        barrier, producing a nonnegative supermartingale.
      - >
        Shifts the threshold by the same amount — the bound is
        $\mathbb{E}[X_0]/21$, not $\mathbb{E}[X_0]/15$.
    targets:
      - quant-processes.martingales.maximal-inequality
    exercises:
      - quant-processes.martingales.stopped-martingale

  - id: qmart-maximal-inequality-02
    kind: work
    difficulty: standard
    statement: >
      A nonnegative submartingale $(X_n)$ has $\mathbb{E}[X_0] = 4$ and
      $\mathbb{E}[X_{40}] = 9$. Give the bound Doob's maximal inequality
      supplies for $\Pr(\max_{k \le 40} X_k \ge 60)$.
    answer: >
      $3/20 = 0.15$. Doob's submartingale form bounds the running maximum over a
      finite window by the mean at the *end* of that window:
      $\Pr(\max_{k \le n} X_k \ge a) \le \mathbb{E}[X_n]/a$. Here $n = 40$ and
      $a = 60$, so the bound is $9/60 = 3/20$. The distractor is
      $\mathbb{E}[X_0] = 4$, which would give $4/60 = 1/15$ — a smaller and
      entirely unjustified bound. The asymmetry has a reason: a submartingale
      drifts up, so its mean is largest at the horizon, and only that largest
      mean controls the whole path; using the starting mean would amount to
      claiming the path is controlled by where it began, which is exactly what
      upward drift denies. The supermartingale form runs the other way — there
      the mean is largest at the start, so $\mathbb{E}[X_0]/a$ is the right
      numerator and the bound covers the infinite horizon.
    expects: "3/20"
    tolerance: 0.0005
    rubric:
      - >
        Uses $\mathbb{E}[X_{40}]$, the mean at the horizon, in the submartingale
        form — not $\mathbb{E}[X_0]$.
      - >
        Explains why the two forms use different endpoints: a submartingale's
        mean grows, a supermartingale's shrinks.
    targets:
      - quant-processes.martingales.maximal-inequality
    exercises:
      - quant-processes.martingales.sub-supermartingale

  # --- the martingale convergence theorem ----------------------------------------------------------

  - id: qmart-convergence-theorem-01
    kind: work
    difficulty: demanding
    statement: >
      A Polya urn starts with $2$ red and $3$ blue balls. At each step a ball is
      drawn uniformly at random, then returned together with one further ball of
      the same colour. Let $R_n$ be the fraction of red balls after $n$ steps.
      Compute $\mathbb{E}[R_\infty]$, the mean of its almost sure limit.
    answer: >
      $2/5 = 0.4$. First, $R_n$ is a martingale. If after $n$ steps there are
      $r$ red among $m$ balls, so $R_n = r/m$, then with probability $r/m$ a red
      is drawn and the fraction becomes $(r+1)/(m+1)$, and otherwise it becomes
      $r/(m+1)$; the conditional mean is $\tfrac{r}{m}\cdot\tfrac{r+1}{m+1} +
      \tfrac{m-r}{m}\cdot\tfrac{r}{m+1} = \tfrac{r(r+1) + r(m-r)}{m(m+1)} =
      \tfrac{r(m+1)}{m(m+1)} = \tfrac{r}{m} = R_n$. Second,
      $0 \le R_n \le 1$, so the martingale is uniformly bounded; the convergence
      theorem gives almost sure convergence to some $R_\infty$, and uniform
      boundedness upgrades that to $L^{1}$ convergence, which is exactly what
      licenses passing the limit through the expectation. Hence
      $\mathbb{E}[R_\infty] = \mathbb{E}[R_0] = 2/5$. The subtlety worth saying
      out loud is that $R_\infty$ is *random*, not the constant $2/5$: for this
      urn it is Beta distributed with parameters $2$ and $3$, and converging
      almost surely never means converging to a number.
    expects: "2/5"
    tolerance: 0.0005
    rubric:
      - >
        Verifies the red fraction is a martingale by the two-case conditional
        computation, not by an appeal to symmetry.
      - >
        Cites uniform boundedness as the route to $L^{1}$ convergence, and notes
        the limit is a random variable rather than the constant $2/5$.
    targets:
      - quant-processes.martingales.convergence-theorem
    exercises:
      - quant-processes.martingales.martingale

  - id: qmart-convergence-theorem-02
    kind: work
    difficulty: standard
    statement: >
      A martingale $(X_n)$ satisfies $0 \le X_n \le 12$ for every $n$ and
      $X_0 = 3$. It converges almost surely to a limit $X_\infty$ that takes
      only the two values $0$ and $12$. Find $\Pr(X_\infty = 12)$.
    answer: >
      $1/4 = 0.25$. Two facts have to be chained. The martingale is uniformly
      bounded, so the convergence theorem gives almost sure convergence and, in
      the uniformly bounded case, convergence in $L^{1}$ as well — and it is the
      $L^{1}$ mode, not the almost sure one, that lets the limit pass through
      the expectation: $\mathbb{E}[X_\infty] = \mathbb{E}[X_0] = 3$. The
      two-point limit then does the rest: $\mathbb{E}[X_\infty] =
      12\Pr(X_\infty = 12) + 0$, so $\Pr(X_\infty = 12) = 3/12 = 1/4$. The step
      that must not be skipped is the first one. Almost sure convergence on its
      own says nothing whatever about $\mathbb{E}[X_\infty]$ — the doubling
      strategy converges almost surely to $+1$ from a start of $0$ — and here it
      is the uniform bound $0 \le X_n \le 12$, given in the statement precisely
      for this purpose, that closes the gap.
    expects: "1/4"
    tolerance: 0.0005
    rubric:
      - >
        Uses uniform boundedness to obtain $L^{1}$ convergence and hence
        $\mathbb{E}[X_\infty] = \mathbb{E}[X_0] = 3$, rather than asserting it
        from almost sure convergence alone.
      - >
        Solves $12p = 3$ for the two-point limit.
    targets:
      - quant-processes.martingales.convergence-theorem
    exercises:
      - quant-processes.martingales.sub-supermartingale
