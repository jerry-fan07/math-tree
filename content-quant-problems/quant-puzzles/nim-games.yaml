# Problems targeting quant-puzzles.nim-games — take-away and combinatorial games.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. Every heap, subtraction set and
# board here is fresh: no lesson worked example and no card instance is reused,
# and every number was verified by brute-force game search. See ../README.md.

problems:
  # --- impartial games under normal play --------------------------------------

  - id: qnim-combinatorial-game-01
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four games is finite, two-player, alternating,
      perfect-information, chance-free *and* impartial — the class the
      P/N machinery of this unit solves outright. Which one?
    answer: >
      The shared pile with a common take set. Impartial means the set of legal
      moves depends on the position alone and not on whose turn it is, so
      "remove $1$, $2$ or $6$ counters from the shared pile" qualifies: both
      players face literally the same options from a pile of $n$. The pile
      strictly decreases every turn, so the game is finite; nothing is hidden
      and nothing is rolled. The other three each break exactly one hypothesis.
      Owning your own tokens makes the game partizan — the same board offers
      different moves to the two players, which is why chess is outside this
      theory. Rolling a die inserts a chance device, so "who wins" is replaced
      by "with what probability", and no two-valued label can carry that.
      Allowing counters to be added as well as removed destroys termination,
      and the backward labelling has no end to start from. Note that fairness
      is not the test: a game can be badly lopsided and still be impartial, and
      a symmetric-looking game with per-player pieces is still partizan.
    choices:
      - text: >
          Two players share a pile of $30$ counters; a turn removes $1$, $2$ or
          $6$ counters, and the player taking the last counter wins.
        correct: true
        feedback: >
          All four hypotheses hold: the same take set for both players
          (impartial), a strictly shrinking pile (finite), no die, nothing
          hidden. This is exactly what backward labelling solves.
      - text: >
          Each player owns four tokens on a strip and may move only their own
          tokens forward; the player unable to move loses.
        feedback: >
          Partizan, not impartial: from one and the same position the two
          players have different legal moves, so a single P/N label per
          position is not enough — this is the hypothesis chess fails.
      - text: >
          A turn rolls a fair die and removes that many counters from the pile;
          the player taking the last counter wins.
        feedback: >
          A chance device. The outcome is no longer forced by either player, so
          the question stops being "who wins" and becomes "with what
          probability", which two labels cannot express.
      - text: >
          A turn either removes $1$ or $2$ counters or adds $1$ counter to the
          pile; the player taking the last counter wins.
        feedback: >
          Play need not terminate — two players can add and remove forever — so
          there is no end of the game to label backwards from, and the
          induction that defines P and N never gets started.
    rubric:
      - >
        Names impartiality as a property of the *move set* — the same options
        for whoever is to move — and not as fairness or symmetry of the
        position.
      - >
        Rejects each of the other three by naming the single hypothesis it
        breaks: partizan, chance, or non-termination.
    targets:
      - quant-puzzles.nim-games.combinatorial-game

  - id: qnim-combinatorial-game-02
    kind: decide
    difficulty: standard
    statement: >
      Here is a variant. Two players share a pile of $25$ counters; a turn
      removes $1$, $2$ or $3$ counters, but no player may take the same number
      they themselves took on their own previous turn. Last to take wins. Which
      hypothesis of the unit does this variant break, as stated?
    answer: >
      Impartiality. The rules are the same for both players and the pile still
      shrinks every turn, so the game is finite, chance-free and fully visible;
      what fails is that the legal moves from a pile of $n$ are no longer a
      function of $n$ alone. Whether taking $2$ is legal depends on what the
      mover did last turn, so two players staring at the same pile of $25$ can
      face different option sets — precisely what impartial forbids. There is a
      standard repair worth naming: enlarge the position to the pair (pile
      size, the mover's own last take), and the move set *is* a function of
      that enlarged position, so the game becomes impartial again on a state
      space of $26 \cdot 4$ positions instead of $26$. That is the general
      trick — fold whatever the rules consult into the position — and it is why
      "impartial" is a statement about how you have chosen to describe the
      state, not only about the rules.
    choices:
      - text: >
          Impartiality — the legal moves are not determined by the pile size
          alone.
        correct: true
        feedback: >
          Right. The move set consults the mover's own history, so it is not a
          function of the position as stated; folding the last take into the
          position repairs it.
      - text: >
          Finiteness — the extra rule can make play run forever.
        feedback: >
          Every legal move still removes at least one counter from a pile of
          $25$, so play ends after at most $25$ turns.
      - text: >
          Perfect information — the constraint is hidden from the opponent.
        feedback: >
          Nothing is hidden: both players watched every take, so both know
          which number is currently barred.
      - text: >
          The normal-play convention — the last player to move no longer wins.
        feedback: >
          The convention is stated unchanged: last to take wins. The variant
          touches the move set, not who is declared the winner.
    rubric:
      - >
        Says the move set must be a function of the position alone, and points
        at the mover's own last take as the extra thing it consults.
      - >
        Confirms the other three hypotheses still hold rather than only
        asserting the right answer.
    targets:
      - quant-puzzles.nim-games.combinatorial-game

  # --- N-positions and P-positions --------------------------------------------

  - id: qnim-np-positions-01
    kind: work
    difficulty: demanding
    statement: >
      A single pile; a move removes exactly $3$, $4$ or $5$ counters, and the
      player who takes the last counter wins. (A player facing a pile too small
      to take from has no legal move and therefore loses.) From a pile of $31$,
      what pile size does the winning move leave?
    answer: >
      $26$. Build the labels from the bottom, using only the definition: a
      position with no legal move is P, a position with a move to some P is N,
      and a position all of whose moves land on N is P. Here $n = 0, 1, 2$ have
      no legal move at all, so all three are P — that is the whole trap in this
      game. Then $n = 3, 4, 5$ each reach $0$, $1$ or $2$, so they are N;
      $n = 6$ reaches $3, 2, 1$ and lands on the P-position $2$, so N; $n = 7$
      reaches $4, 3, 2$ and lands on $2$, so N; $n = 8$ reaches $5, 4, 3$, all
      N, so $8$ is P. The block of eight repeats, and the P-positions are
      exactly $n \equiv 0, 1, 2 \pmod 8$. Since $31 = 8 \cdot 3 + 7$, the pile
      of $31$ is an N-position. Its three options are $28$ ($\equiv 4$, N),
      $27$ ($\equiv 3$, N) and $26$ ($\equiv 2$, P), so the unique winning move
      takes $5$ and leaves $26$. Answering $24$ misapplies the memorized
      "multiples of $k+1$" rule, which holds only when the take set is
      $\{1, 2, \dots, k\}$ and every small residue is reachable; here $1$ and
      $2$ are dead ends, which is exactly why the modulus is $8$ and the
      losing residues are three wide instead of one.
    expects: "26"
    rubric:
      - >
        Labels $n = 1$ and $n = 2$ as P-positions because no legal move exists
        from them, not as N-positions.
      - >
        Applies the definition — N when some option is P, P when every option
        is N — rather than quoting the $\{1, \dots, k\}$ shortcut.
      - >
        Checks all three options of $31$ and reports the pile size left, $26$,
        not the number removed.
    targets:
      - quant-puzzles.nim-games.np-positions

  - id: qnim-np-positions-02
    kind: work
    difficulty: standard
    statement: >
      Same game — remove exactly $3$, $4$ or $5$ counters, last to take wins,
      and a player with no legal move loses. Among the pile sizes
      $n = 0, 1, 2, \dots, 25$, how many are P-positions?
    answer: >
      $11$. The backward labelling gives P exactly at
      $n \equiv 0, 1, 2 \pmod 8$: the three starved sizes $0, 1, 2$ are P by
      default, $3$ through $7$ all reach one of them and are N, and $8, 9, 10$
      have every option inside $\{3, \dots, 7\}$, so they are P and the pattern
      restarts with period $8$. Listing the P-positions up to $25$ gives
      $0, 1, 2, 8, 9, 10, 16, 17, 18, 24, 25$ — that is three full blocks of
      three plus the tail $24, 25$, so $3 + 3 + 3 + 2 = 11$. The count is not
      $\lfloor 26/8 \rfloor \cdot 3 = 9$: the range stops mid-block, and
      $24$ and $25$ are both P. Nor is it $3$ — the pattern repeats forever
      rather than dying out after the first block.
    expects: "11"
    rubric:
      - >
        States the losing residues as $0, 1, 2 \pmod 8$ and justifies the
        modulus by the block of three starved sizes plus the five reachable
        ones.
      - >
        Counts the partial block at the top of the range, so $24$ and $25$ are
        included.
    targets:
      - quant-puzzles.nim-games.np-positions

  - id: qnim-np-positions-03
    kind: decide
    difficulty: standard
    statement: >
      An interviewer says: "You keep drawing these P/N tables. Isn't that just
      backward induction on the game tree, which I already know from game
      theory?" Which reply is right?
    answer: >
      It is the same recursion with a smaller object at the leaves. Backward
      induction on a finite extensive-form game of perfect information walks
      the tree from the terminal nodes upwards, and at each node the player to
      move picks the child maximizing their own payoff; the answer carried up
      is a payoff vector, one number per player. P/N labelling is that
      procedure with the payoff vector collapsed to a single bit, which is
      legitimate precisely because an impartial game under normal play is
      strictly competitive with no draws: "I win" and "you win" exhaust the
      outcomes, so one label per position — not one per player — suffices.
      The rules become "terminal is P" and "N if some child is P, P if every
      child is N", which is just the maximizing step written for a two-valued
      payoff. Both need perfect information and finiteness; neither needs
      mixing, because there is nothing to randomize over once the outcome set
      has two elements and the game is determined.
    choices:
      - text: >
          Yes — it is backward induction with the payoff vector replaced by one
          win/lose bit, which works because the game is finite, determined and
          has no draws.
        correct: true
        feedback: >
          Exactly. Two exhaustive outcomes collapse the payoff vector to a
          single label, and "maximize your own payoff" becomes "move to a
          P-position if one exists".
      - text: >
          No — backward induction needs numeric payoffs, and impartial games
          have none, so the two procedures are unrelated.
        feedback: >
          Win and lose *are* payoffs, just a two-point scale. The recursion is
          identical; only the codomain shrank.
      - text: >
          No — backward induction requires perfect information, while P/N
          labelling works with hidden state too.
        feedback: >
          Backwards from this unit: P/N labelling assumes perfect information
          just as firmly. Hidden state breaks both.
      - text: >
          Yes, but only for two-pile games; with three or more piles the
          labelling stops agreeing with backward induction.
        feedback: >
          Pile count is irrelevant to the recursion. Three piles only make the
          table too big to draw, which is why the nim-sum exists.
    rubric:
      - >
        Identifies the leaves as the shared starting point and names what
        differs: a payoff vector per player versus one label per position.
      - >
        Says why one label suffices — two exhaustive outcomes, no draws, so the
        game is determined.
    targets:
      - quant-puzzles.nim-games.np-positions
      - quant-games.game-theory.backward-induction-games
    connects:
      - quant-games.game-theory.backward-induction-games ~ quant-puzzles.nim-games.np-positions

  # --- labelling the position table -------------------------------------------

  - id: qnim-backward-labelling-01
    kind: work
    difficulty: demanding
    statement: >
      A move removes a perfect-square number of counters from the pile — $1$,
      $4$, $9$, $16$ or $25$ — and the player who takes the last counter wins.
      Among the pile sizes $n = 0, 1, 2, \dots, 30$, how many are losses for
      the player to move?
    answer: >
      $10$. Tabulate. Writing P and N for $n = 0$ upwards:
      P N P N N P N P N N P N P N N P N P N N P N P N N N N N N N N. Reading
      the P entries off: $0, 2, 5, 7, 10, 12, 15, 17, 20, 22$, which is ten of
      them. The interesting part is where the eye goes wrong. Through $n = 24$
      the P-positions are exactly $n \equiv 0$ or $2 \pmod 5$, and a table
      stopped at $20$ would confidently predict $25, 27$ and $30$ as further
      P-positions, giving $13$. The pattern breaks at $n = 25$ because $25$ is
      itself an allowed take: $25 - 25 = 0$ is a P-position, so $25$ is N. That
      poisons the tail — $27 - 25 = 2$ is P so $27$ is N, and $30 - 25 = 5$ is
      P so $30$ is N — and in fact every $n$ from $23$ to $30$ is an
      N-position. The moral is the one the technique insists on: a subtraction
      game is only guaranteed periodic once the take set is *finite and
      exhausted*, so the window you match must be at least $\max S$ wide, and
      here $\max S$ grows with $n$ until $n$ passes $25$. Six table entries
      expose a period only when they are past the largest legal take.
    expects: "10"
    rubric:
      - >
        Builds the table from $n = 0$ by the definition rather than guessing a
        modulus from the first few entries.
      - >
        Notices that $25$ enters the take set and explains why that breaks the
        apparent period $5$, so the answer is $10$ and not $13$.
    targets:
      - quant-puzzles.nim-games.backward-labelling
    exercises:
      - quant-puzzles.nim-games.np-positions

  - id: qnim-backward-labelling-02
    kind: work
    difficulty: standard
    statement: >
      A move removes exactly $2$ or $3$ counters, and the player who takes the
      last counter wins; a player facing a pile of $0$ or $1$ has no legal move
      and loses. From a pile of $37$, what pile size does the winning move
      leave?
    answer: >
      $35$. Table first. $n = 0$ is terminal, so P; $n = 1$ has no legal move
      either, so it is also P — a counter you cannot take is not a counter you
      can win with. Then $n = 2$ reaches $0$ and $n = 3$ reaches $1$ and $0$,
      so both are N; $n = 4$ reaches $2$ (N) and $1$ (P), so N; $n = 5$ reaches
      $3$ and $2$, both N, so P; $n = 6$ reaches $4$ and $3$, both N, so P. The
      labels therefore run P P N N N P P N N N …, period $5$, and the
      P-positions are $n \equiv 0$ or $1 \pmod 5$. Since $37 \equiv 2 \pmod 5$,
      the pile of $37$ is an N-position, and of its two options — $35$
      ($\equiv 0$, P) and $34$ ($\equiv 4$, N) — only $35$ is a P-position. So
      take $2$ and leave $35$; from then on answer every take of $2$ with $3$
      and every take of $3$ with $2$, keeping the total removed per round at
      $5$, and hand back $35, 30, 25, \dots, 5, 0$.
    expects: "35"
    rubric:
      - >
        Labels $n = 1$ as a P-position — the mover is stuck, so the mover
        loses — instead of assuming a lone counter is always a win.
      - >
        Checks both options of $37$ and names the pile left, $35$, together
        with the $2$-answers-$3$ pairing that maintains it.
    targets:
      - quant-puzzles.nim-games.backward-labelling
    exercises:
      - quant-puzzles.nim-games.np-positions

  # --- subtraction games are periodic -----------------------------------------

  - id: qnim-subtraction-game-period-01
    kind: work
    difficulty: demanding
    statement: >
      Take the subtraction game with $S = \{2, 5, 6\}$: a move removes exactly
      $2$, $5$ or $6$ counters, and the last player to take wins. What is the
      period of its Grundy sequence $g(0), g(1), g(2), \dots$?
    answer: >
      $11$. Compute by mex, where $g(n)$ is the smallest nonnegative integer
      missing from $\{g(n-s) : s \in S,\ n - s \ge 0\}$. Then $g(0) = 0$ and
      $g(1) = 0$ (no legal move, so the mex of the empty set);
      $g(2) = \operatorname{mex}\{0\} = 1$;
      $g(3) = \operatorname{mex}\{0\} = 1$;
      $g(4) = \operatorname{mex}\{1\} = 0$;
      $g(5) = \operatorname{mex}\{1, 0\} = 2$;
      $g(6) = \operatorname{mex}\{0, 0, 0\} = 1$;
      $g(7) = \operatorname{mex}\{2, 1, 0\} = 3$;
      $g(8) = \operatorname{mex}\{1, 1, 1\} = 0$;
      $g(9) = \operatorname{mex}\{3, 0, 1\} = 2$;
      $g(10) = \operatorname{mex}\{0, 2, 0\} = 1$. The sequence so far is
      $0, 0, 1, 1, 0, 2, 1, 3, 0, 2, 1$, and continuing gives
      $g(11) = 0, g(12) = 0, g(13) = 1, g(14) = 1, g(15) = 0, g(16) = 2$ — the
      opening six values again. Since $\max S = 6$, six consecutive matching
      values pin every later value, so the sequence is purely periodic with
      period $11$, and no smaller shift works (the block
      $0, 0, 1, 1, 0, 2, 1, 3, 0, 2, 1$ has no proper period). Two wrong
      answers are instructive: $6$ mistakes the width of the matching window
      for the period, and $8$ comes from reading only the P-positions
      $0, 1, 4, 8, 11, 12, 15, 19, \dots$ and stopping before the pattern
      restarts at $11$.
    expects: "11"
    rubric:
      - >
        Uses mex on the option values, with $g(0) = g(1) = 0$ because those
        positions have no legal move.
      - >
        Confirms the period by matching a window of at least $\max S = 6$
        consecutive values, and checks no shorter shift works.
    targets:
      - quant-puzzles.nim-games.subtraction-game-period

  - id: qnim-subtraction-game-period-02
    kind: work
    difficulty: standard
    statement: >
      In the subtraction game with $S = \{2, 3, 5\}$ — remove exactly $2$, $3$
      or $5$ counters, last to take wins — how many of the pile sizes
      $n = 1, 2, \dots, 50$ are losses for the player to move?
    answer: >
      $15$. Label from the bottom: $n = 0$ and $n = 1$ are P (no legal move
      from either); $n = 2, 3, 4$ each reach $0$ or $1$, so N; $n = 5$ reaches
      $3, 2, 0$ — and $0$ is P — so N; $n = 6$ reaches $4, 3, 1$, and $1$ is P,
      so N; $n = 7$ reaches $5, 4, 2$, all N, so P; $n = 8$ reaches $6, 5, 3$,
      all N, so P. So the labels read P P N N N N N P P N N N N N …, period
      $7$, and the P-positions are exactly $n \equiv 0$ or $1 \pmod 7$. In the
      range $1$ to $50$ that is $7, 14, 21, 28, 35, 42, 49$ — seven multiples
      of $7$ — together with $1, 8, 15, 22, 29, 36, 43, 50$ — eight values
      $\equiv 1$ — for $7 + 8 = 15$ in total. Answering $16$ counts $n = 0$,
      which the stated range excludes; answering $8$ applies the multiples-of-
      $(k+1)$ rule for $S = \{1, \dots, k\}$, which does not govern this take
      set at all.
    expects: "15"
    rubric:
      - >
        Derives the losing residues $0$ and $1 \pmod 7$ from the table rather
        than assuming a multiples-of-something pattern.
      - >
        Counts each residue class separately inside $1 \le n \le 50$ and
        excludes $n = 0$.
    targets:
      - quant-puzzles.nim-games.subtraction-game-period

  # --- race to a target -------------------------------------------------------

  - id: qnim-race-to-n-01
    kind: work
    difficulty: demanding
    statement: >
      We alternate adding a whole number from $1$ to $9$ to a running total
      that starts at $0$; whoever says exactly $88$ wins. You may choose to
      move first or second. What number should the winner open with?
    answer: >
      $8$ — and you take the first move to say it. Work backwards from the
      goal. You want to say $88$, so you must hand your opponent $78$: from
      $78$ they reach $79$ through $87$, and you finish from any of those.
      Repeating, the totals to stand on are $88, 78, 68, 58, 48, 38, 28, 18,
      8$ — exactly the totals $\equiv 88 \equiv 8 \pmod{10}$, since each round
      of two moves can always be made to add $10$: whatever the opponent adds
      as $k$, you answer $10 - k$, and $1 \le 10 - k \le 9$ is always legal.
      The opening total $0$ is not $\equiv 8$, so the position is a win for the
      mover, and $8$ is reachable in one move because $1 \le 8 \le 9$. So go
      first, say $8$, and thereafter reply $10 - k$; the totals you announce
      are $8, 18, 28, \dots, 78, 88$. Answering $1$ is the classic reflex from
      the race to $100$, where the control residue happens to be
      $100 \equiv 1 \pmod{11}$; the residue is a property of the target and the
      step limit together, not a constant, and here opening with $1$ hands the
      opponent the chance to say $8$ and win.
    expects: "8"
    rubric:
      - >
        Derives the control set as the totals congruent to the target modulo
        (largest step $+ 1$), i.e. $8 \pmod{10}$, working backwards from $88$.
      - >
        Checks that the first control total is reachable from $0$ in one legal
        move, which is what makes the first player the winner.
      - >
        States the maintenance rule — answer $k$ with $10 - k$ — and not just
        the opening number.
    targets:
      - quant-puzzles.nim-games.race-to-n

  - id: qnim-race-to-n-02
    kind: decide
    difficulty: standard
    statement: >
      Same shape, different numbers: players alternate adding a whole number
      from $1$ to $7$ to a total starting at $0$, and whoever says exactly $56$
      wins. Which seat do you want?
    answer: >
      Second. The control totals are those congruent to the target modulo one
      more than the largest step: $56 \equiv 0 \pmod 8$, so the winner wants to
      stand on $56, 48, 40, 32, 24, 16, 8, 0$. The last of those is $0$ — the
      starting total, before anybody has moved. So the player who *faces* $0$
      is the one standing on a control total, and that player is the one about
      to move, which means they must break it: any $k$ from $1$ to $7$ leaves a
      total not divisible by $8$. The second player then answers $8 - k$ and
      restores the invariant every round, arriving at $56$. This is the general
      rule: whenever the target is an exact multiple of (largest step $+ 1$),
      the second player wins; otherwise the first player opens with the target's
      residue. The reflex answer "go first and say $1$" loses here, because
      after $1$ the opponent replies $7$ and owns every control total
      thereafter.
    choices:
      - text: >
          Second — $56$ is a multiple of $8$, so the starting total $0$ is
          already a control total and the mover must break it.
        correct: true
        feedback: >
          Right. The control set is $0, 8, 16, \dots, 56$; it contains the
          start, so the player to move is the one who has to leave it.
      - text: >
          First, opening with $1$, then answering the opponent's $k$ with
          $8 - k$.
        feedback: >
          After your $1$ the opponent says $7$ to reach $8$, and from then on
          they hold every multiple of $8$ — you have handed them the control
          set.
      - text: >
          First, opening with $7$ to take the largest possible step.
        feedback: >
          Step size is not the point; the residue is. From $7$ the opponent
          says $1$ to reach $8$ and owns the control set.
      - text: >
          It does not matter — with an even target both players can force a
          win.
        feedback: >
          A finite game of perfect information with no draws is determined:
          exactly one player can force it, never both.
    rubric:
      - >
        Computes $56 \bmod 8 = 0$ and reads the seat off that, rather than
        reaching for the race-to-$100$ answer.
      - >
        Explains that a control set containing the starting total is what makes
        the second player the winner.
    targets:
      - quant-puzzles.nim-games.race-to-n

  - id: qnim-race-to-n-03
    kind: justify
    difficulty: standard
    statement: >
      For the race to $88$ in steps of $1$ to $9$, write the strategy as an
      invariant and prove both halves of the invariant argument: that the
      opponent can never restore the invariant, and that you always can. Then
      say what the argument would need if the step set were $\{1, 2, 4\}$
      instead of $\{1, \dots, 9\}$.
    answer: >
      The invariant is: *after my move, the running total is
      $\equiv 8 \pmod{10}$*. Half one, the opponent cannot preserve it. From a
      total $t \equiv 8$, any legal move produces $t + k$ with
      $1 \le k \le 9$, and $t + k \equiv 8 + k \pmod{10}$, which is congruent
      to $8$ only when $10 \mid k$ — impossible for $1 \le k \le 9$, since
      $10 \nmid k$ for every such $k$. So every position the opponent
      hands back violates the invariant. Half two, I can always restore it.
      From $t + k$ I add $10 - k$, which lies in $1$ through $9$ and so is
      legal, returning the total to $t + 10 \equiv 8$. Termination and the
      finish: the total strictly increases by $10$ each round, so after finitely
      many rounds it reaches $88$, and it reaches $88$ on *my* move, since the
      totals $\equiv 8 \pmod{10}$ are exactly the ones I announce. Finally,
      $8$ is reachable from the start, $1 \le 8 \le 9$, so I can establish the
      invariant with my opening move. That is the complete pattern:
      establish, preserve, and finish on it. With a step set such as
      $\{1, 2, 5\}$ the second half is what fails: a residue argument needs a
      constant $c$ with $c - k$ legal for every legal $k$, and no $c$ works
      here — $c = 6$ would demand the step $4$, $c = 7$ the step $6$, and no
      smaller $c$ covers the step $5$ at all. Without a restoring reply there
      is no single residue to defend, and the argument must be replaced by the
      full backward labelling of totals.
    rubric:
      - >
        States the invariant as a congruence maintained *after the author's own
        move*, with the modulus one more than the largest step.
      - >
        Proves both halves separately: no legal opponent move preserves the
        congruence, and $10 - k$ is always a legal restoring reply.
      - >
        Says why the invariant finishes the game — the total advances by $10$
        each round and the announced totals are exactly the control set, so
        $88$ is announced by the invariant's owner.
      - >
        Identifies restorability, not preservation, as the half that fails for
        a step set that is not $\{1, \dots, k\}$.
    targets:
      - quant-puzzles.nim-games.race-to-n
      - quant-puzzles.strategies.invariant
    connects:
      - quant-puzzles.nim-games.race-to-n ~ quant-puzzles.strategies.invariant

  # --- the rules of Nim -------------------------------------------------------

  - id: qnim-nim-rules-01
    kind: work
    difficulty: demanding
    statement: >
      Nim on piles $(4, 4, 7)$. A position is the multiset of pile sizes: order
      does not matter and empty piles are discarded. How many *distinct
      positions* can the player to move produce in one move?
    answer: >
      $11$. Split by which pile is cut. Cutting the seven-pile down to any of
      $0, 1, 2, 3, 4, 5, 6$ gives seven positions, all different from one
      another: $(4,4)$, $(1,4,4)$, $(2,4,4)$, $(3,4,4)$, $(4,4,4)$, $(4,4,5)$,
      $(4,4,6)$. Cutting a four-pile down to $v \in \{0, 1, 2, 3\}$ gives the
      multiset $\{v, 4, 7\}$ — and here is the point: it makes no difference
      *which* of the two four-piles was cut, because the two results have the
      same multiset of sizes and Nim positions are multisets. So that stage
      contributes four positions, not eight: $(4,7)$, $(1,4,7)$, $(2,4,7)$,
      $(3,4,7)$. The two groups cannot overlap: every position in the second
      group still contains a pile of $7$, and no position in the first group
      does. The total is $7 + 4 = 11$. Counting (pile, amount) pairs gives
      $4 + 4 + 7 = 15$, which double-counts the four mirrored cuts of the equal
      piles.
    expects: "11"
    rubric:
      - >
        Treats the position as a multiset, so cutting either of the two equal
        piles to the same size counts once.
      - >
        Separates the count by which pile is reduced and checks the two groups
        do not overlap, reaching $7 + 4 = 11$ rather than $15$.
    targets:
      - quant-puzzles.nim-games.nim-rules

  - id: qnim-nim-rules-02
    kind: decide
    difficulty: routine
    statement: >
      Nim on piles $(2, 5, 9)$, normal play. Which of these is a legal move?
    answer: >
      Removing $4$ counters from the nine-pile, leaving $(2, 5, 5)$. A Nim move
      has exactly three requirements: it names one pile, it removes a strictly
      positive number of counters, and it removes at most the whole of that
      pile. Taking $4$ from a pile of $9$ satisfies all three, and the result
      $(2, 5, 5)$ is a perfectly ordinary position. Each of the others breaks
      exactly one requirement. Touching two piles in a turn is the rule change
      that turns Nim into Moore's Nim or Wythoff's game, both of which have
      completely different P-positions, so it is not a harmless variation.
      Passing is barred because a move must remove a positive number — and
      without that, the game would not terminate and the whole backward
      labelling would collapse. Removing more counters than a pile holds is
      barred because pile sizes are nonnegative. Note also that removing the
      whole of a pile *is* allowed: from $(2,5,9)$ the move to $(2,5)$ is
      legal, and it is very often the winning one.
    choices:
      - text: >
          Remove $4$ counters from the nine-pile, leaving $(2, 5, 5)$.
        correct: true
        feedback: >
          One pile, a positive amount, no more than the pile holds — legal.
      - text: >
          Remove $1$ counter from the two-pile and $1$ from the five-pile,
          leaving $(1, 4, 9)$.
        feedback: >
          A Nim move touches exactly one pile. Allowing two piles at once is a
          different game with different P-positions.
      - text: >
          Remove no counters at all, passing the turn.
        feedback: >
          A move must remove a strictly positive number; passing would also
          break the guarantee that play terminates.
      - text: >
          Remove $6$ counters from the five-pile, leaving $(2, 9)$ and a debt
          of one.
        feedback: >
          You cannot take more than a pile holds. Taking all $5$ is legal and
          leaves $(2, 9)$; taking $6$ is not.
    rubric:
      - >
        States the three conditions on a legal move — one pile, a positive
        amount, at most the whole pile — and tests each option against them.
      - >
        Notes that emptying a pile completely is legal, so the bar is "at most
        the pile", not "strictly fewer".
    targets:
      - quant-puzzles.nim-games.nim-rules

  # --- two equal piles: mirror the opponent -----------------------------------

  - id: qnim-equal-piles-mirroring-01
    kind: work
    difficulty: demanding
    statement: >
      Nim on five equal piles, $(7, 7, 7, 7, 7)$: a move removes any positive
      number of counters from exactly one pile, and the last player to take
      wins. The mover has exactly one winning move. How many counters does it
      remove?
    answer: >
      $7$ — the whole of one pile. Mirroring is a *pairing* argument, and what
      it actually proves is that an even number of equal piles is a loss for
      the mover: split the piles into pairs, and answer any move inside a pair
      by copying it in that pair's partner, so every position you hand back is
      again a set of matched pairs, the total strictly falls, and the empty
      position is always the opponent's to face. So $(7,7,7,7)$ is a
      P-position. Five equal piles is that P-position plus one spare, which
      makes it an N-position, and the winning move is to delete the spare:
      take all $7$ counters from one pile and hand over $(7,7,7,7)$. Bouton
      confirms it and shows the move is unique. In binary $7 = 111_{2}$, and
      XOR-ing five copies column by column adds five $1$s in each of the three
      columns, which is odd, so the nim-sum is $111_{2} = 7$. To zero it you
      must reduce some pile $a$ to $a \oplus 7$, and every pile has $a = 7$
      with $7 \oplus 7 = 0$, so the only move to a nim-sum of $0$ empties a
      pile — there is no partial take that works. Two wrong instincts:
      answering that the mover loses, which reads "equal piles" as the whole
      story rather than "equal piles in pairs", and answering $14$, which
      would need two piles touched in one turn.
    expects: "7"
    rubric:
      - >
        States the mirroring result as pairing — an *even* number of equal
        piles is a P-position — and not as "equal piles lose" in general.
      - >
        Identifies the fifth pile as the spare and removes all of it, leaving
        four equal piles, rather than trimming a pile part-way.
      - >
        Cross-checks with the nim-sum $7 \oplus 7 \oplus 7 \oplus 7 \oplus 7
        = 7$ and notes the winning move is unique.
    targets:
      - quant-puzzles.nim-games.equal-piles-mirroring
    exercises:
      - quant-puzzles.nim-games.nim-rules
      - quant-puzzles.strategies.symmetry-strategy

  - id: qnim-equal-piles-mirroring-02
    kind: work
    difficulty: standard
    statement: >
      Nim on two piles, $(23, 14)$: remove any positive number of counters from
      one pile, last to take wins. How many counters does the winning move
      remove?
    answer: >
      $9$. Two unequal piles are an N-position, and the winning move is always
      the same one: equalize. Remove $23 - 14 = 9$ counters from the larger
      pile to reach $(14, 14)$, which the mirroring argument has already
      settled as a loss for whoever faces it — from $(a,a)$, answer every take
      of $c$ from one pile with a take of $c$ from the other, so the piles are
      equal again after each of your replies, the total strictly falls, and the
      opponent is the one eventually staring at $(0,0)$ with nothing to take.
      The nim-sum agrees and shows there is no second winning move: $23 =
      10111_{2}$ and $14 = 01110_{2}$, so column by column the nim-sum is
      $11001_{2} = 25$, nonzero. Its leading bit is the $16$s bit, which only
      $23$ carries, so the one pile you may touch is the pile of $23$, and it
      must go to $23 \oplus 25 = 10111_{2} \oplus 11001_{2} = 01110_{2} = 14$.
      Answering $14$ confuses the pile size you leave with the number you
      remove; answering $9$ from the *smaller* pile is not even legal in the
      direction that helps, since taking from $14$ only widens the gap.
    expects: "9"
    rubric:
      - >
        Equalizes by taking $|a - b|$ from the larger pile and names the
        resulting position $(14, 14)$ as the P-position that mirroring proves.
      - >
        Reports the number removed, $9$, rather than the pile size left, $14$.
    targets:
      - quant-puzzles.nim-games.equal-piles-mirroring
    exercises:
      - quant-puzzles.nim-games.nim-rules

  # --- Bouton's theorem: the Nim XOR rule --------------------------------------

  - id: qnim-nim-xor-01
    kind: work
    difficulty: demanding
    statement: >
      Nim on piles $(3, 6, 10, 13)$, normal play. A position is the multiset of
      pile sizes. How many distinct positions can the mover reach that are
      P-positions — that is, how many winning moves does the position have?
    answer: >
      $3$. First the nim-sum. In binary $3 = 0011_{2}$, $6 = 0110_{2}$,
      $10 = 1010_{2}$, $13 = 1101_{2}$. Column by column, the $8$s column holds
      $0,0,1,1$ — two $1$s, so $0$; the $4$s column holds $0,1,0,1$, so $0$;
      the $2$s column holds $1,1,1,0$ — three $1$s, so $1$; the $1$s column
      holds $1,0,0,1$, so $0$. The nim-sum is $0010_{2} = 2$, nonzero, so the
      mover wins. Now count the moves that zero it. Bouton's construction says
      a move to nim-sum $0$ must reduce some pile $a$ to $a \oplus s$, and that
      is legal exactly when $a \oplus s < a$, which happens exactly when $a$
      carries the leading bit of $s$. Here $s = 2$, whose leading bit is the
      $2$s bit, and three of the four piles carry it: $6 = 0110_{2}$,
      $10 = 1010_{2}$ and $3 = 0011_{2}$, while $13 = 1101_{2}$ does not. So
      there are three winning moves — $6 \to 4$, $10 \to 8$, $3 \to 1$ —
      landing on $(3, 4, 10, 13)$, $(3, 6, 8, 13)$ and $(1, 6, 10, 13)$, three
      genuinely different positions since the piles are all distinct. The
      common wrong answer is $1$: the construction *exhibits* a winning move,
      it does not claim uniqueness, and the number of them is exactly the
      number of piles carrying the leading bit of the nim-sum.
    expects: "3"
    rubric:
      - >
        Computes the nim-sum by XOR-ing binary columns with no carries,
        reaching $s = 2$.
      - >
        Characterizes the winning moves as the piles carrying the leading bit
        of $s$, each reduced to $a \oplus s$, rather than assuming there is
        exactly one.
      - >
        Checks the three resulting positions are distinct and that $13$ is
        excluded because it lacks the $2$s bit.
    targets:
      - quant-puzzles.nim-games.nim-xor
    exercises:
      - quant-puzzles.nim-games.nim-rules

  - id: qnim-nim-xor-02
    kind: work
    difficulty: standard
    statement: >
      Nim on piles $(12, 18, 25)$, normal play. What is the nim-sum of this
      position?
    answer: >
      $7$. Write the three sizes in binary to five bits: $12 = 01100_{2}$,
      $18 = 10010_{2}$, $25 = 11001_{2}$. XOR adds each column modulo $2$ with
      no carries at all, so read the columns from the top: the $16$s column
      holds $0, 1, 1$, an even count of $1$s, giving $0$; the $8$s column holds
      $1, 0, 1$, giving $0$; the $4$s column holds $1, 0, 0$, giving $1$; the
      $2$s column holds $0, 1, 0$, giving $1$; the $1$s column holds
      $0, 0, 1$, giving $1$. That is $00111_{2} = 7$. Since the nim-sum is not
      $0$, Bouton's theorem says the position is an N-position and the mover
      wins; the leading bit of $7$ is the $4$s bit, carried only by
      $12 = 01100_{2}$, so the winning move takes that pile to
      $12 \oplus 7 = 01100_{2} \oplus 00111_{2} = 01011_{2} = 11$, removing
      one counter. The classic error is to add rather than XOR — $12 + 18 + 25
      = 55$ — or to carry between columns, which turns the operation into
      ordinary binary addition and destroys the theorem, since the whole proof
      rests on each column being independent.
    expects: "7"
    rubric:
      - >
        XORs column by column with no carries, showing the binary expansions
        $01100_{2}$, $10010_{2}$ and $11001_{2}$.
      - >
        Reads the nonzero nim-sum as "the mover wins" rather than reporting a
        decimal sum.
    targets:
      - quant-puzzles.nim-games.nim-xor
    exercises:
      - quant-puzzles.nim-games.np-positions

  - id: qnim-nim-xor-03
    kind: decide
    difficulty: routine
    statement: >
      Exactly one of these four Nim positions is a P-position — a loss for the
      player to move — under normal play. Which one?
    answer: >
      $(6, 10, 12)$. Bouton's theorem makes this a single computation per
      position. For $(6, 10, 12)$: $6 = 0110_{2}$, $10 = 1010_{2}$,
      $12 = 1100_{2}$, and column by column the $8$s column has two $1$s, the
      $4$s column has two, the $2$s column has two, the $1$s column has none —
      every column even, so the nim-sum is $0$ and the mover loses. Checking
      the others the same way: $5 \oplus 9 = 0101_{2} \oplus 1001_{2} =
      1100_{2} = 12$ and $12 \oplus 13 = 1100_{2} \oplus 1101_{2} = 1$, so
      $(5, 9, 13)$ has nim-sum $1$; $4 \oplus 11 = 0100_{2} \oplus 1011_{2} =
      1111_{2} = 15$ and $15 \oplus 14 = 1$, so $(4, 11, 14)$ has nim-sum $1$
      as well; and $2 \oplus 7 = 5$ with $5 \oplus 8 = 13$, so $(2, 7, 8)$ has
      nim-sum $13$. Note that none of the surface features help: the pile
      count is three in every case, $(6, 10, 12)$ has all-even piles while
      $(2, 7, 8)$ has an even total and neither fact decides anything.
    choices:
      - text: >
          $(6, 10, 12)$
        correct: true
        feedback: >
          Every binary column has an even number of $1$s, so the nim-sum is
          $0$ — the player to move loses.
      - text: >
          $(5, 9, 13)$
        feedback: >
          $5 \oplus 9 = 12$ and $12 \oplus 13 = 1$, a nim-sum of $1$: the mover
          wins by taking one counter from the pile of $13$.
      - text: >
          $(4, 11, 14)$
        feedback: >
          $4 \oplus 11 = 15$ and $15 \oplus 14 = 1$, so the nim-sum is $1$ and
          the mover wins.
      - text: >
          $(2, 7, 8)$
        feedback: >
          $2 \oplus 7 = 5$ and $5 \oplus 8 = 13$, a nim-sum of $13$ — as far
          from a P-position as this list gets.
    rubric:
      - >
        Applies "P-position exactly when the nim-sum is $0$" to each option
        rather than guessing from pile parity or the decimal total.
      - >
        Shows at least one XOR column by column, with no carries.
    targets:
      - quant-puzzles.nim-games.nim-xor
    exercises:
      - quant-puzzles.nim-games.np-positions

  # --- finding the winning Nim move at the table ------------------------------

  - id: qnim-nim-move-recipe-01
    kind: work
    difficulty: demanding
    statement: >
      Misère Nim on piles $(1, 1, 1, 1, 6)$ — the rules of Nim, except that the
      player who takes the *last* counter loses. How many counters does the
      winning move remove?
    answer: >
      $5$: reduce the six-pile to a single counter, leaving $(1,1,1,1,1)$. The
      recipe is normal-play Nim until at most one pile exceeds $1$, and this
      position is already at that switching point, so the misère rule takes
      over. With every pile of size $1$, all play is forced — each turn takes a
      whole singleton — so from $k$ singletons the players simply alternate
      until the counters run out, and the mover takes the last counter exactly
      when $k$ is odd. You therefore want to hand over an *odd* number of
      singletons. There are currently four singletons, an even count, so the
      six-pile must become one more singleton: remove $6 - 1 = 5$ counters and
      leave five ones, which the opponent faces and loses. The trap is playing
      the normal-play move out of habit: $1 \oplus 1 \oplus 1 \oplus 1 \oplus 6
      = 0110_{2} = 6$, so normal play would empty the six-pile to make the
      nim-sum $0$, leaving four singletons — an even count, which under misère
      rules is a win for the opponent, not for you. Note the two rules
      genuinely disagree only here, at the last big pile.
    expects: "5"
    rubric:
      - >
        Recognizes the misère switching point — at most one pile above $1$ —
        and stops using the nim-sum there.
      - >
        Argues that $k$ singletons is a loss for the mover exactly when $k$ is
        odd, so an odd number must be handed over.
      - >
        Leaves $(1,1,1,1,1)$ by removing $5$, and says why emptying the pile
        entirely — the normal-play move — loses.
    targets:
      - quant-puzzles.nim-games.nim-move-recipe
    exercises:
      - quant-puzzles.nim-games.nim-xor

  - id: qnim-nim-move-recipe-02
    kind: work
    difficulty: standard
    statement: >
      Nim on piles $(9, 14, 22)$, normal play. Run the recipe: after the
      winning move, what is the size of the pile you reduced?
    answer: >
      $7$. Step one, binary: $9 = 01001_{2}$, $14 = 01110_{2}$,
      $22 = 10110_{2}$. Step two, XOR the columns: the $16$s column is
      $0,0,1 \to 1$; the $8$s column is $1,1,0 \to 0$; the $4$s column is
      $0,1,1 \to 0$; the $2$s column is $0,1,1 \to 0$; the $1$s column is
      $1,0,0 \to 1$. So the nim-sum is $s = 10001_{2} = 17$, nonzero, and the
      mover wins. Step three, the leading bit of $s$ is the $16$s bit, and only
      $22$ carries it — $9$ and $14$ are both below $16$ — so the pile of $22$
      is the one to cut, and it is the only choice. Step four, replace it by
      $22 \oplus 17 = 10110_{2} \oplus 10001_{2} = 00111_{2} = 7$, which means
      removing $22 - 7 = 15$ counters and leaving $(9, 14, 7)$. Check:
      $9 \oplus 14 = 01001_{2} \oplus 01110_{2} = 00111_{2} = 7$, and
      $7 \oplus 7 = 0$. The recipe's own trap is answering $5$ — removing $s =
      17$ counters instead of setting the pile to $a \oplus s$; those two
      agree only by accident, and here $22 - 17 = 5$ leaves nim-sum
      $9 \oplus 14 \oplus 5 = 2$, not $0$.
    expects: "7"
    rubric:
      - >
        Runs the four steps in order — binary, XOR, leading bit, replace $a$ by
        $a \oplus s$ — and identifies $22$ as the only pile carrying the
        leading bit.
      - >
        Sets the pile to $a \oplus s = 7$ rather than removing $s = 17$
        counters, and verifies the new nim-sum is $0$.
    targets:
      - quant-puzzles.nim-games.nim-move-recipe
    exercises:
      - quant-puzzles.nim-games.nim-xor

  # --- strategy stealing -------------------------------------------------------

  - id: qnim-strategy-stealing-01
    kind: justify
    difficulty: demanding
    statement: >
      Schuh's divisor game. Fix $N = 72$ and write down all of its divisors. A
      move names a divisor still on the board and erases it together with every
      remaining multiple of it; the player forced to erase $1$ loses. Prove the
      first player wins, and say exactly what your proof does and does not
      supply. Then say why $N = 1$ has to be excluded.
    answer: >
      The game is finite — every move erases at least one of the twelve
      divisors of $72$ — it has perfect information, no chance, and no draws,
      since play stops only when someone erases $1$ and that someone loses. So
      exactly one player can force a win, and it is enough to rule out the
      second. Suppose the second player had a winning strategy $\sigma$. The
      top divisor $72$ is dominated by every other move: any $d$ with
      $d \mid 72$ erases all remaining multiples of $d$, and $72$ is a multiple
      of every divisor, so *every* legal move already erases $72$. Now let the
      first player open by naming $72$ itself, which erases $72$ and nothing
      else, and let $M$ be the reply $\sigma$ prescribes. Playing $M$ straight
      from the full board reaches exactly the same position, because $M$
      erases $72$ along with everything else it erases. So the position after
      "open with $72$, then $\sigma$ replies $M$" is a position the first
      player could have produced with a single opening move $M$ — and by
      assumption it is a won position for the player who is now to move
      second, which is the original first player. The first player therefore
      wins, contradicting that $\sigma$ wins for the second player. Hence the
      first player wins. What the proof supplies is one bit — the identity of
      the winner. What it does not supply is a move: it never says whether $M$
      is $8$, or $36$, or anything else, and the argument is happy to remain
      ignorant of it. Excluding $N = 1$ is not a subtlety but a degeneracy:
      the board is the single divisor $1$, the only legal move erases it, and
      the first player loses at once, with no opening move left over to steal
      with. This is the same shape as Chomp on a $1 \times 1$ board.
    rubric:
      - >
        Checks the hypotheses first — finite, perfect information, no draws —
        and invokes determinacy to reduce the claim to "the second player has
        no winning strategy".
      - >
        Identifies $72$ as the dominated element, on the ground that every
        legal move already erases it, and uses it as the harmless opening.
      - >
        Runs the contradiction correctly: the stolen reply $M$ played straight
        from the full board reaches the same position, so the first player
        occupies the winning seat.
      - >
        Says the conclusion is non-constructive — a winner, not a move — and
        excludes $N = 1$ because there is no spare move to waste.
    targets:
      - quant-puzzles.nim-games.strategy-stealing
    exercises:
      - quant-puzzles.nim-games.np-positions

  - id: qnim-strategy-stealing-02
    kind: decide
    difficulty: standard
    statement: >
      Two players alternately claim unclaimed cells of a $5 \times 5$ grid,
      the first player going first; a player wins the moment they hold an
      entire row or an entire column, and if the board fills with neither
      holding one, the game is a draw. Claiming extra cells never hurts. What
      does strategy stealing establish here?
    answer: >
      Only that the second player cannot force a win. The stealing argument
      itself runs fine: suppose the second player had a winning strategy
      $\sigma$; the first player claims any cell, then follows $\sigma$,
      treating the extra cell as a spare — legitimate because holding more
      cells is never a liability in a game whose winning condition is holding
      a whole line, and because if $\sigma$ ever calls for the cell already
      claimed, any other free cell can be taken instead. That produces a win
      for the first player, contradicting $\sigma$. So no winning strategy for
      the second player exists. The step that fails is the *next* one. In Nim
      or Chomp the game is drawless, so "the second player cannot force a win"
      plus determinacy immediately gives "the first player can", because there
      is nothing else the outcome could be. Here draws exist — fill the board
      so that every row and every column is mixed and nobody has a line — so
      the outcome set has three elements, and ruling out one player's forced
      win leaves the other with a forced win *or* a forced draw. The honest
      conclusion is that the first player can guarantee at least a draw. That
      is exactly the standard status of tic-tac-toe-shaped games, and it is
      why the no-draws hypothesis is stated as a hypothesis and not as
      scenery.
    choices:
      - text: >
          The second player cannot force a win, so the first player can
          guarantee at least a draw — but not that the first player can force
          a win.
        correct: true
        feedback: >
          Right. Stealing rules out a second-player win; with draws in the
          outcome set, determinacy cannot upgrade that to a first-player win.
      - text: >
          The first player can force a win, exactly as in Chomp.
        feedback: >
          That upgrade needs the no-draws hypothesis. With draws available,
          ruling out a second-player win leaves a first-player win or a draw.
      - text: >
          Nothing at all — the argument needs the extra-move-never-hurts
          hypothesis, which fails here.
        feedback: >
          It holds here: the winning condition is holding a whole line, so an
          extra claimed cell can only help. The hypothesis that fails is
          drawlessness.
      - text: >
          Nothing at all — the game is partizan, and strategy stealing applies
          only to impartial games.
        feedback: >
          Strategy stealing never needed impartiality; it is used on Hex and
          on tic-tac-toe-shaped games, both partizan. Drawlessness is the
          missing hypothesis.
    rubric:
      - >
        Separates the two steps: stealing rules out a second-player win, and
        determinacy is what would turn that into a first-player win.
      - >
        Names drawlessness — not the extra-move hypothesis, which holds here —
        as what fails, and states the conclusion as "at least a draw".
    targets:
      - quant-puzzles.nim-games.strategy-stealing
    exercises:
      - quant-puzzles.nim-games.combinatorial-game

  # --- Chomp -------------------------------------------------------------------

  - id: qnim-chomp-01
    kind: work
    difficulty: demanding
    statement: >
      Chomp on a $3 \times 3$ board, bottom-left square poisoned: a move names a
      remaining square and eats it together with every remaining square above
      and to the right of it, and whoever eats the poison loses. Of the eight
      opening moves that do not eat the poison outright, exactly one wins. How
      many squares are left on the board after it?
    answer: >
      $5$. The winning opening eats the square one to the right of the poison
      and one above it — the centre of the board — which also eats the whole
      $2 \times 2$ block above and to its right, four squares in all. What
      remains is an L: the bottom row of three squares and the left column of
      three squares, sharing the poisoned corner, so $3 + 3 - 1 = 5$ squares
      survive. That shape is the point of the move, because an L with two arms
      of equal length is where mirroring takes over: whatever the opponent eats
      from one arm, eat the same amount from the other, restoring equal arms
      every time, until the opponent is left with the poison alone. Every other
      opening loses. Eating the top-right square leaves a $3 \times 3$ board
      minus one corner, and the opponent replies with the centre and hands the
      L back to you; eating a whole top row or right column leaves a
      $2 \times 3$ or $3 \times 2$ board, and the opponent takes the corner of
      that to leave an L again; eating the square above the poison leaves the
      bottom row alone, three squares, and the opponent eats the square next to
      the poison and leaves you the poison. So the answer is not $8$ (the
      top-right corner move, the one strategy stealing uses as a *wasted*
      move — it proves a winner exists but is not itself the winner) and not
      $6$; it is $5$.
    expects: "5"
    rubric:
      - >
        Names the winning move as the centre square, whose eaten block is the
        whole $2 \times 2$ upper-right corner, and counts the surviving L as
        $3 + 3 - 1 = 5$.
      - >
        Explains why the L with equal arms wins — mirror the opponent's bite
        in the other arm — rather than only asserting the count.
      - >
        Distinguishes the winning move from the top-right corner, which
        strategy stealing uses precisely because it is harmless, not because
        it wins.
    targets:
      - quant-puzzles.nim-games.chomp
    exercises:
      - quant-puzzles.nim-games.strategy-stealing

  - id: qnim-chomp-02
    kind: decide
    difficulty: routine
    statement: >
      Chomp on a $1 \times 7$ board — a single row of seven squares, the
      leftmost poisoned. A move names a remaining square and eats it together
      with every square to its right. Which opening move wins?
    answer: >
      Eat the second square from the left, which also eats squares three
      through seven and leaves the opponent the poisoned square alone. On one
      row the general theory collapses into something you can just see: eating
      the square in position $k$ leaves exactly the first $k-1$ squares, so a
      move is nothing more than "choose how many squares to leave", and the
      only position that loses for the player to move is the one square that
      is the poison. Leaving one square is therefore the whole game, and it
      takes one move from any starting length. This is the smallest case where
      strategy stealing's promise — the first player wins every board bigger
      than $1 \times 1$ — is matched by an explicit move, which is exactly what
      makes wider boards striking: the winner is known there too, and the move
      is not. Eating the seventh square only leaves six, which is a board of
      the same kind with the roles swapped, and the opponent then plays the
      winning move you passed up.
    choices:
      - text: >
          Eat the second square from the left, leaving only the poison.
        correct: true
        feedback: >
          It eats squares two through seven in one bite and hands over the
          poisoned square with no other option available.
      - text: >
          Eat the rightmost square, leaving six squares.
        feedback: >
          That hands back a $1 \times 6$ board with the opponent to move, and
          they win it by eating its second square.
      - text: >
          Eat the poisoned square itself, ending the game immediately.
        feedback: >
          Eating the poison is how you lose, not how you win. It is legal, and
          it is an instant loss.
      - text: >
          No opening move wins; the second player wins a single row.
        feedback: >
          Strategy stealing already promises the first player wins any board
          bigger than $1 \times 1$, and here the move is explicit.
    rubric:
      - >
        Observes that on one row a move is equivalent to choosing the number of
        squares left standing.
      - >
        Names leaving exactly the poisoned square as the winning move, and not
        the rightmost bite.
    targets:
      - quant-puzzles.nim-games.chomp
    exercises:
      - quant-puzzles.nim-games.strategy-stealing

  # --- Sprague–Grundy values ---------------------------------------------------

  - id: qnim-grundy-01
    kind: work
    difficulty: demanding
    statement: >
      Two independent games sit side by side and a turn moves in exactly one of
      them. Game $A$ is a pile of $12$ counters under the rule "remove $1$, $3$
      or $4$ counters"; game $B$ is an ordinary Nim pile of $6$. Under normal
      play, what is the Grundy value of the combined game?
    answer: >
      $5$. Grundy the two components separately, then XOR. For $A$, apply mex
      to the option values, where $\operatorname{mex}$ is the smallest
      nonnegative integer missing from the set: $g(0) = 0$;
      $g(1) = \operatorname{mex}\{0\} = 1$;
      $g(2) = \operatorname{mex}\{1\} = 0$;
      $g(3) = \operatorname{mex}\{0, 0\} = 1$;
      $g(4) = \operatorname{mex}\{1, 1, 0\} = 2$;
      $g(5) = \operatorname{mex}\{2, 0, 1\} = 3$;
      $g(6) = \operatorname{mex}\{3, 1, 0\} = 2$;
      $g(7) = \operatorname{mex}\{2, 2, 1\} = 0$ — careful here, the option
      values are $\{2, 2, 1\}$, which is missing $0$, so the mex is $0$ and
      not $3$. The values then repeat
      with period $7$: the sequence from $n = 0$ is
      $0, 1, 0, 1, 2, 3, 2, 0, 1, 0, 1, 2, 3, 2, \dots$, so
      $g(12) = g(12 - 7) = g(5) = 3$. For $B$, an ordinary Nim pile has Grundy
      value equal to its size, so $g(B) = 6$. The sum's value is the XOR:
      $3 \oplus 6 = 011_{2} \oplus 110_{2} = 101_{2} = 5$. Nonzero, so the
      mover wins, and the winning move is in $B$ — take it down to
      $6 \oplus 5 = 3$ counters, so the two values become $3$ and $3$ and XOR
      to $0$. The wrong answer $9$ comes from adding the Grundy values instead
      of XOR-ing them, and reading each component as a bare P/N label decides
      nothing at all: both components here are N-positions, and two
      N-positions can sum to a win or to a loss depending on exactly the
      information a single bit throws away.
    expects: "5"
    rubric:
      - >
        Computes $g$ for the subtraction game by mex — the smallest missing
        nonnegative integer, not one more than the largest present — and gets
        $g(12) = 3$.
      - >
        Uses that an ordinary Nim pile's Grundy value is its size, so
        $g(B) = 6$.
      - >
        Combines with XOR, not addition, giving $3 \oplus 6 = 5$, and reads
        nonzero as a win for the mover.
    targets:
      - quant-puzzles.nim-games.grundy
    exercises:
      - quant-puzzles.nim-games.nim-xor

  - id: qnim-grundy-02
    kind: work
    difficulty: standard
    statement: >
      A single pile under the rule "remove exactly $1$ or exactly $4$
      counters", normal play. What is the Grundy value $g(14)$?
    answer: >
      $2$. Build the mex table upward, where the options of $n$ are $n-1$ and
      $n-4$ whenever those are nonnegative. $g(0) = \operatorname{mex}\{\} = 0$
      because a position with no options has the empty set of option values;
      $g(1) = \operatorname{mex}\{0\} = 1$;
      $g(2) = \operatorname{mex}\{1\} = 0$;
      $g(3) = \operatorname{mex}\{0\} = 1$;
      $g(4) = \operatorname{mex}\{1, 0\} = 2$;
      $g(5) = \operatorname{mex}\{2, 1\} = 0$;
      $g(6) = \operatorname{mex}\{0, 0\} = 1$;
      $g(7) = \operatorname{mex}\{1, 1\} = 0$;
      $g(8) = \operatorname{mex}\{0, 2\} = 1$;
      $g(9) = \operatorname{mex}\{1, 0\} = 2$. The block
      $0, 1, 0, 1, 2$ has now repeated, and since the window of the last
      $\max S = 4$ values has recurred, the sequence is periodic with period
      $5$ from the start. So $g(14) = g(14 - 5 \cdot 2) = g(4) = 2$. Two
      readings to keep apart: $g(14) = 2 \ne 0$ says $14$ is an N-position, and
      the extra information over the bare label is that this pile behaves
      exactly like a Nim pile of $2$ counters when it is one summand of a
      larger game. Answering $3$ mistakes mex for "one more than the largest
      option value" — at $n = 4$ the options are $\{1, 0\}$ and the smallest
      missing nonnegative integer is $2$, which happens to agree, but at
      $n = 5$ the options are $\{2, 1\}$ and mex is $0$, not $3$.
    expects: "2"
    rubric:
      - >
        Uses $g(n) = \operatorname{mex}\{g(n-1), g(n-4)\}$ with
        $g(0) = 0$ from the empty option set.
      - >
        Detects the period $5$ by matching a window of at least $\max S = 4$
        consecutive values, then reduces $14$ to $4$.
      - >
        Reports $g(14) = 2$ and reads it as "equivalent to a Nim pile of $2$",
        not merely as "N".
    targets:
      - quant-puzzles.nim-games.grundy
    exercises:
      - quant-puzzles.nim-games.backward-labelling
