  - id: qclas-water-jugs-02
    kind: work
    difficulty: standard
    statement: >
      Unmarked jugs of $15$ and $21$ gallons, a tap and a drain, with the usual
      moves. How many different positive whole numbers of gallons can be made to
      stand in one of the jugs?
    answer: >
      $7$. Every move — fill, empty, or pour until the source empties or the
      target fills — leaves each jug holding an integer combination
      $15a + 21b$, so every reachable amount is a multiple of
      $\gcd(15, 21) = 3$; that is the obstruction, and it rules out $1$, $2$,
      $4$, $5$ and every other non-multiple. The only other constraint is
      capacity: an amount standing in a jug is at most $21$. So the candidates
      are $3, 6, 9, 12, 15, 18, 21$ — seven of them — and each is attained. The
      base case is $3 = 3 \cdot 15 - 2 \cdot 21$: fill the $15$ and pour it into
      the $21$ three times, emptying the $21$ whenever it fills, and $3$ gallons
      remain in the small jug. From there $15$ and $21$ are a single fill each,
      $18 = 15 + 3$ and $6 = 3 + 3$ come from carrying a residue across, and the
      rest follow the same way. Scaling the puzzle by $3$ makes it obvious: $15$
      and $21$ behave exactly like $5$ and $7$ measured in three-gallon units,
      and coprime jugs reach every whole number of units up to the larger jug.
    expects: "7"
    rubric:
      - >
        Identifies the reachable amounts as the multiples of $\gcd(15, 21) = 3$,
        with capacity capping them at $21$.
      - >
        Counts the positive multiples $3$ through $21$ and gets seven, not eight
        (zero is not positive).
      - >
        Justifies attainability, for instance by rescaling to coprime jugs of
        $5$ and $7$ three-gallon units.
    targets:
      - quant-puzzles.classics.water-jugs
    exercises:
      - quant-puzzles.classics.chameleons
