# Problems targeting quant-tools.series-calculus — the closed forms, asymptotics
# and special integrals the rest of the quant tree assumes are automatic.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. Landmark nodes (geometric-series,
# taylor, gaussian-integral, stirling) carry three. See ../README.md.

problems:
  # --- arithmetic series -----------------------------------------------------

  - id: qser-arithmetic-series-01
    kind: work
    difficulty: demanding
    statement: >
      What is the sum of all the integers from $1$ to $200$ that are divisible
      by $3$ but not by $5$?
    answer: >
      $5268$. Take the multiples of $3$ and subtract the multiples of $15$,
      since an integer divisible by both $3$ and $5$ is divisible by $15$. The
      multiples of $3$ run $3, 6, \dots, 198$, which is
      $\lfloor 200/3 \rfloor = 66$ terms, and count times average gives
      $\dfrac{66(3 + 198)}{2} = 33 \times 201 = 6633$. The multiples of $15$ run
      $15, 30, \dots, 195$, which is $13$ terms, summing to
      $\dfrac{13(15 + 195)}{2} = 13 \times 105 = 1365$. So the answer is
      $6633 - 1365 = 5268$. The usual slip is the term count: the last multiple
      of $3$ below $200$ is $198$, not $200$, so the count is a floor and the
      endpoint used in the average must be the real last term.
    expects: "5268"
    rubric:
      - >
        Removes the multiples of $15$, not the multiples of $5$ — the overlap is
        at the least common multiple.
      - >
        Counts the terms as $\lfloor 200/3 \rfloor = 66$ and uses $198$, not
        $200$, as the last term in the average.
    targets:
      - quant-tools.series-calculus.arithmetic-series

  - id: qser-arithmetic-series-02
    kind: work
    difficulty: standard
    statement: >
      A desk holds $11$ lots on day $1$ and increases its holding by exactly
      $4$ lots on each following day. Over the first $25$ days, what is the
      total of its daily holdings?
    answer: >
      $1475$. The daily holdings are arithmetic with $a_1 = 11$ and $d = 4$, so
      day $25$ holds $a_{25} = 11 + 24 \times 4 = 107$ lots — twenty-four steps
      after day $1$, not twenty-five. Count times average gives
      $\dfrac{25(11 + 107)}{2} = \dfrac{25 \times 118}{2} = 25 \times 59 = 1475$.
      The split form checks it: $na + d\,\dfrac{n(n-1)}{2}
      = 25(11) + 4\left(\dfrac{25 \times 24}{2}\right) = 275 + 1200 = 1475$.
      Using $a_{25} = 11 + 25 \times 4 = 111$ would give $1525$, and that
      off-by-one on the number of steps is the whole difficulty here.
    expects: "1475"
    rubric:
      - >
        Uses $a_n = a_1 + (n-1)d$, so the last term is $107$ rather than $111$.
      - >
        Applies count times average, or the equivalent
        $na + d\,n(n-1)/2$, and gets the same number both ways.
    targets:
      - quant-tools.series-calculus.arithmetic-series

  # --- geometric series (landmark: three problems) ----------------------------

  - id: qser-geometric-series-01
    kind: work
    difficulty: demanding
    statement: >
      An infinite geometric series of real terms sums to $9$, and the series
      obtained by squaring each of its terms sums to $27$. What is the common
      ratio of the original series?
    answer: >
      $r = \dfrac{1}{2}$. Write the series as $\sum_{k \ge 0} a r^{k}$ with
      $|r| < 1$, so $\dfrac{a}{1-r} = 9$. Squaring every term produces
      $\sum_{k \ge 0} a^{2} (r^{2})^{k}$ — a geometric series whose ratio is
      $r^{2}$, not $r$ — so $\dfrac{a^{2}}{1 - r^{2}} = 27$. Substituting
      $a = 9(1-r)$ into the second equation gives
      $\dfrac{81(1-r)^{2}}{(1-r)(1+r)} = \dfrac{81(1-r)}{1+r} = 27$, hence
      $3(1-r) = 1+r$, so $4r = 2$ and $r = \dfrac{1}{2}$, with
      $a = \dfrac{9}{2}$. Check both: $\dfrac{4.5}{0.5} = 9$ and
      $\dfrac{20.25}{0.75} = 27$. Note $|r^{2}| < 1$ automatically once
      $|r| < 1$, so the second series converges for free.
    expects: "1/2"
    tolerance: 0.0005
    rubric:
      - >
        Identifies the squared series as geometric with ratio $r^{2}$ rather
        than squaring the sum $9$.
      - >
        Eliminates $a$ between the two equations instead of treating them as two
        independent unknowns, and cancels the factor $(1-r)$ legitimately.
    targets:
      - quant-tools.series-calculus.geometric-series

  - id: qser-geometric-series-02
    kind: work
    difficulty: standard
    statement: >
      A ball is dropped from a height of $10$ metres and rebounds to $60\%$ of
      its previous height after every bounce. What total vertical distance does
      it travel before coming to rest?
    answer: >
      $40$ metres. The first drop contributes $10$. After that the ball rises to
      $6$ and falls $6$, rises to $3.6$ and falls $3.6$, and so on, so every
      later height is travelled twice: the total is
      $10 + 2\sum_{k \ge 1} 10(0.6)^{k}
      = 10 + 2 \times \dfrac{10(0.6)}{1 - 0.6} = 10 + 2 \times 15 = 40$. The
      tail form is what does the work — the geometric part starts at $k = 1$,
      not $k = 0$, because the initial $10$ is not a rebound. Forgetting the
      factor of $2$ gives $25$; folding the initial drop into the geometric sum
      gives $50$. Since $|r| = 0.6 < 1$, infinitely many bounces cover a finite
      distance in finite time.
    expects: "40"
    rubric:
      - >
        Counts every rebound height twice — once up, once down — and the
        initial drop only once.
      - >
        Sums the rebound heights as a geometric tail starting at $k = 1$, and
        checks $|r| < 1$ before using $a/(1-r)$.
    targets:
      - quant-tools.series-calculus.geometric-series

  - id: qser-geometric-series-03
    kind: work
    difficulty: routine
    statement: >
      Evaluate the finite sum $\sum_{k=0}^{5} 3 \cdot 2^{k}$.
    answer: >
      $189$. The finite formula $a\,\dfrac{1 - r^{n}}{1 - r}$ holds for every
      $r \ne 1$ — convergence is irrelevant to a sum of finitely many terms, so
      $r = 2$ is perfectly legal here. With $a = 3$, $r = 2$ and $n = 6$ terms,
      $3 \times \dfrac{1 - 2^{6}}{1 - 2} = 3 \times \dfrac{-63}{-1}
      = 3 \times 63 = 189$. Directly:
      $3 + 6 + 12 + 24 + 48 + 96 = 189$. The count is the trap — $k$ runs from
      $0$ to $5$, which is six terms, so the exponent is $6$; using $n = 5$
      would give $3 \times 31 = 93$.
    expects: "189"
    rubric:
      - >
        Uses $n = 6$ terms for indices $k = 0, \dots, 5$.
      - >
        Applies the finite formula with $r > 1$ rather than refusing it because
        the infinite series would diverge.
    targets:
      - quant-tools.series-calculus.geometric-series

  # --- differentiating the geometric series ----------------------------------

  - id: qser-geometric-derivative-01
    kind: work
    difficulty: demanding
    statement: >
      A biased coin lands heads with probability $1/3$. It is tossed until the
      first head appears; let $N$ be the number of tosses required. Compute
      $\mathbb{E}[N^{2}]$.
    answer: >
      $15$. Write $p = 1/3$ and $q = 2/3$, so $\Pr(N = k) = q^{k-1}p$ for
      $k \ge 1$ and $\mathbb{E}[N^{2}] = p\sum_{k \ge 1} k^{2} q^{k-1}
      = \dfrac{p}{q}\sum_{k \ge 1} k^{2} q^{k}$. Differentiating the geometric
      series twice gives $\sum_{k \ge 1} k^{2}x^{k}
      = \dfrac{x(1+x)}{(1-x)^{3}}$, and at $x = q$ the denominator is
      $(1-q)^{3} = p^{3}$, so the sum is $\dfrac{q(1+q)}{p^{3}}$. Hence
      $\mathbb{E}[N^{2}] = \dfrac{p}{q}\cdot\dfrac{q(1+q)}{p^{3}}
      = \dfrac{1+q}{p^{2}} = \dfrac{5/3}{1/9} = 15$. Cross-check with the
      variance: $\mathbb{E}[N] = 1/p = 3$, so
      $\operatorname{Var}(N) = 15 - 9 = 6$, matching the standard
      $q/p^{2} = (2/3)(9) = 6$.
    expects: "15"
    rubric:
      - >
        Converts $\sum k^{2} q^{k-1}$ into $\sum k^{2} q^{k}$ by pulling out
        $1/q$, rather than losing the extra power.
      - >
        Uses $\sum_{k \ge 1} k^{2}x^{k} = x(1+x)/(1-x)^{3}$, not
        $x/(1-x)^{2}$.
      - >
        Checks the result against $\operatorname{Var}(N) = q/p^{2}$.
    targets:
      - quant-tools.series-calculus.geometric-derivative
    exercises:
      - quant-tools.series-calculus.geometric-series

  - id: qser-geometric-derivative-02
    kind: work
    difficulty: standard
    statement: >
      Evaluate $\sum_{k \ge 1} k\,(0.6)^{k}$.
    answer: >
      $3.75$. Differentiating $\sum_{k \ge 0} x^{k} = \dfrac{1}{1-x}$ term by
      term — legal strictly inside $|x| < 1$, and $0.6$ qualifies — gives
      $\sum_{k \ge 1} k x^{k-1} = \dfrac{1}{(1-x)^{2}}$. Multiplying by $x$
      restores the power that differentiation removed:
      $\sum_{k \ge 1} k x^{k} = \dfrac{x}{(1-x)^{2}}$. At $x = 0.6$ that is
      $\dfrac{0.6}{(0.4)^{2}} = \dfrac{0.6}{0.16} = 3.75$. Stopping one step
      early and reporting $\dfrac{1}{0.16} = 6.25$ answers a different question
      — the sum with the powers shifted down by one.
    expects: "3.75"
    rubric:
      - >
        Multiplies the differentiated identity by $x$, so the answer is
        $x/(1-x)^{2}$ and not $1/(1-x)^{2}$.
      - >
        Confirms $|x| < 1$ before differentiating term by term.
    targets:
      - quant-tools.series-calculus.geometric-derivative
    exercises:
      - quant-tools.series-calculus.geometric-series

  # --- telescoping -----------------------------------------------------------

  - id: qser-telescoping-01
    kind: work
    difficulty: demanding
    statement: >
      Evaluate the product $\prod_{k=2}^{50}\left(1 - \dfrac{1}{k^{2}}\right)$.
    answer: >
      $\dfrac{51}{100} = 0.51$. Factor each term first:
      $1 - \dfrac{1}{k^{2}} = \dfrac{(k-1)(k+1)}{k^{2}}$, so the product splits
      into $\left(\prod_{k=2}^{50}\dfrac{k-1}{k}\right)
      \left(\prod_{k=2}^{50}\dfrac{k+1}{k}\right)$. Each factor telescopes
      through ratios exactly as a sum telescopes through differences: the first
      is $\dfrac{1}{2}\cdot\dfrac{2}{3}\cdots\dfrac{49}{50} = \dfrac{1}{50}$ and
      the second is $\dfrac{3}{2}\cdot\dfrac{4}{3}\cdots\dfrac{51}{50}
      = \dfrac{51}{2}$. Their product is
      $\dfrac{51}{100}$. In general the answer is $\dfrac{n+1}{2n}$, which tends
      to $\dfrac{1}{2}$ rather than to $0$ — the terms approach $1$ fast enough
      that the infinite product does not collapse.
    expects: "51/100"
    tolerance: 0.0005
    rubric:
      - >
        Factors the difference of squares and splits the product into two
        separately telescoping ratio products.
      - >
        Reads off the surviving endpoints of each — $1/50$ and $51/2$ — rather
        than only one of the two.
    targets:
      - quant-tools.series-calculus.telescoping

  - id: qser-telescoping-02
    kind: work
    difficulty: standard
    statement: >
      Evaluate $\sum_{k=1}^{30}\dfrac{1}{(3k-2)(3k+1)}$.
    answer: >
      $\dfrac{30}{91}$. The two factors differ by $3$, so partial fractions give
      $\dfrac{1}{(3k-2)(3k+1)}
      = \dfrac{1}{3}\left(\dfrac{1}{3k-2} - \dfrac{1}{3k+1}\right)$ — check at
      $k = 1$: $\dfrac{1}{3}\left(1 - \dfrac{1}{4}\right) = \dfrac{1}{4}$, which
      is $\dfrac{1}{1 \times 4}$. Setting $b_k = \dfrac{1}{3k-2}$, the summand is
      $\dfrac{1}{3}(b_k - b_{k+1})$, consecutive terms of one sequence, so the
      sum is $\dfrac{1}{3}(b_1 - b_{31})
      = \dfrac{1}{3}\left(1 - \dfrac{1}{91}\right)
      = \dfrac{1}{3}\cdot\dfrac{90}{91} = \dfrac{30}{91} \approx 0.3297$. The
      factor $\dfrac{1}{3}$ from the decomposition is the piece most often
      dropped.
    expects: "30/91"
    tolerance: 0.0005
    rubric:
      - >
        Produces the decomposition with the factor $1/3$ in front, and verifies
        it on one value of $k$.
      - >
        Identifies $b_{31} = 1/91$ as the surviving upper endpoint, so exactly
        one term is left at each end.
    targets:
      - quant-tools.series-calculus.telescoping

  # --- sums of powers --------------------------------------------------------

  - id: qser-power-sums-01
    kind: work
    difficulty: demanding
    statement: >
      What is the sum of the squares of the first $15$ odd numbers,
      $1^{2} + 3^{2} + 5^{2} + \cdots + 29^{2}$?
    answer: >
      $4495$. Take all the squares up to $30$ and remove the even ones:
      $\sum_{j=1}^{30} j^{2} - \sum_{k=1}^{15}(2k)^{2}
      = \sum_{j=1}^{30} j^{2} - 4\sum_{k=1}^{15} k^{2}$, since squaring $2k$
      pulls out a factor of $4$, not $2$. Now
      $\sum_{j=1}^{30} j^{2} = \dfrac{30 \times 31 \times 61}{6} = 9455$ and
      $\sum_{k=1}^{15} k^{2} = \dfrac{15 \times 16 \times 31}{6} = 1240$, so the
      answer is $9455 - 4 \times 1240 = 9455 - 4960 = 4495$. Expanding instead
      gives the same number:
      $\sum_{k=1}^{15}(2k-1)^{2} = 4\sum k^{2} - 4\sum k + 15
      = 4960 - 480 + 15 = 4495$. As a size check, $\sum_{k} k^{2}$ over
      $1$ to $30$ should be near $30^{3}/3 = 9000$, and $9455$ is.
    expects: "4495"
    rubric:
      - >
        Pulls a factor of $4$, not $2$, out of the even squares.
      - >
        Evaluates $\sum k^{2} = n(n+1)(2n+1)/6$ correctly at both $n = 30$ and
        $n = 15$.
      - >
        Reaches the same total by a second route, or checks it against the
        $n^{3}/3$ growth rate.
    targets:
      - quant-tools.series-calculus.power-sums

  - id: qser-power-sums-02
    kind: work
    difficulty: standard
    statement: >
      Evaluate $\sum_{k=1}^{20}\left(k^{2} + k\right)$.
    answer: >
      $3080$. Split it: $\sum_{k=1}^{20} k^{2}
      = \dfrac{20 \times 21 \times 41}{6} = 2870$ and
      $\sum_{k=1}^{20} k = \dfrac{20 \times 21}{2} = 210$, so the total is
      $2870 + 210 = 3080$. A second route avoids the square formula entirely:
      $k^{2} + k = k(k+1) = 2\binom{k+1}{2}$, and
      $\sum_{k=1}^{20}\binom{k+1}{2} = \binom{22}{3}
      = \dfrac{22 \times 21 \times 20}{6} = 1540$, twice which is $3080$. As a
      size check the leading behaviour is $\dfrac{20^{3}}{3} \approx 2667$ plus
      lower-order terms, the right order of magnitude.
    expects: "3080"
    rubric:
      - >
        Uses $n(n+1)(2n+1)/6$ with the $6$ in the denominator and the
        $(2n+1)$ factor present.
      - >
        Adds the linear sum rather than dropping it, and confirms the answer by
        a second route or a size check.
    targets:
      - quant-tools.series-calculus.power-sums
    exercises:
      - quant-tools.series-calculus.arithmetic-series

  # --- comparing a sum to an integral ----------------------------------------

  - id: qser-integral-comparison-01
    kind: decide
    difficulty: demanding
    statement: >
      For which real $p$ does $\sum_{k \ge 2}\dfrac{1}{k(\ln k)^{p}}$ converge?
    answer: >
      Exactly when $p > 1$. The function $f(x) = \dfrac{1}{x(\ln x)^{p}}$ is
      positive and eventually decreasing on $[2,\infty)$, so the sum and the
      integral $\int_{2}^{\infty} f(x)\,dx$ converge or diverge together.
      Substituting $u = \ln x$, so that $du = dx/x$, turns that integral into
      $\int_{\ln 2}^{\infty}\dfrac{du}{u^{p}}$ — the ordinary $p$-integral,
      finite exactly when $p > 1$. At the boundary $p = 1$ the antiderivative is
      $\ln\ln x$, which grows without bound, so the sum diverges there, even
      more slowly than the harmonic series itself. The factor $1/k$ alone
      settles nothing: the logarithm attached to it decides the case.
    choices:
      - text: >
          For every $p > 0$, since $(\ln k)^{p} \to \infty$
        feedback: >
          Growing to infinity is not enough — $\ln\ln x$ also grows to infinity,
          and that is exactly the divergent case $p = 1$.
      - text: >
          Exactly when $p > 1$
        correct: true
        feedback: >
          The substitution $u = \ln x$ turns the integral into
          $\int u^{-p}\,du$, whose convergence threshold is $p = 1$.
      - text: >
          Exactly when $p > 1/2$
        feedback: >
          There is no square root anywhere here; the substitution leaves the
          exponent $p$ untouched, so the threshold is $1$.
      - text: >
          For no $p$ — the factor $1/k$ already forces divergence
        feedback: >
          The comparison with $\sum 1/k$ only gives an upper bound on the terms.
          A large enough power of $\ln k$ does make the sum converge.
    rubric:
      - >
        Checks that $f$ is positive and decreasing before invoking the integral
        comparison at all.
      - >
        Makes the substitution $u = \ln x$ and recognises the resulting
        $p$-integral.
      - >
        Treats $p = 1$ as a separate boundary case rather than assuming the
        strict inequality.
    targets:
      - quant-tools.series-calculus.integral-comparison

  - id: qser-integral-comparison-02
    kind: work
    difficulty: standard
    statement: >
      Use the integral comparison to give the sharpest upper bound it provides
      on the tail $\sum_{k \ge 11}\dfrac{1}{k^{3}}$.
    answer: >
      $0.005$. For a nonnegative decreasing $f$, each term $f(k)$ is at most the
      area of the unit strip immediately to its left,
      $\int_{k-1}^{k} f(x)\,dx$, and those strips tile $[10,\infty)$ without
      overlap, so $\sum_{k \ge 11} f(k) \le \int_{10}^{\infty} f(x)\,dx$. With
      $f(x) = x^{-3}$ that is
      $\left[-\dfrac{1}{2x^{2}}\right]_{10}^{\infty} = \dfrac{1}{2 \times 100}
      = \dfrac{1}{200} = 0.005$. Starting the integral at $11$ instead gives
      $\dfrac{1}{2 \times 121} \approx 0.00413$, which is the *lower* bound,
      because those strips lie to the right of their terms. The true tail is
      $\approx 0.004525$, trapped between the two as promised — and choosing the
      lower limit one step below the first index is the whole content of the
      comparison.
    expects: "0.005"
    rubric:
      - >
        Starts the bounding integral at $10$, one step below the first index,
        rather than at $11$.
      - >
        Knows which side each integral bounds, and can say why the strip lies
        left or right of the term for a decreasing $f$.
    targets:
      - quant-tools.series-calculus.integral-comparison

  # --- harmonic numbers ------------------------------------------------------

  - id: qser-harmonic-numbers-01
    kind: work
    difficulty: demanding
    statement: >
      A fair six-sided die is rolled repeatedly. What is the expected number of
      rolls needed until at least five distinct faces have appeared?
    answer: >
      $8.7$. Break the wait into stages. Once $j$ distinct faces have been seen,
      each roll shows a new one with probability $\dfrac{6-j}{6}$, so the wait
      for the next new face is geometric with mean $\dfrac{6}{6-j}$, and the
      stages are added by linearity. Summing over $j = 0, 1, 2, 3, 4$ — five
      stages, because the fifth new face is where we stop — gives
      $\dfrac{6}{6} + \dfrac{6}{5} + \dfrac{6}{4} + \dfrac{6}{3} + \dfrac{6}{2}
      = 1 + 1.2 + 1.5 + 2 + 3 = 8.7$. This is $6(H_6 - H_1)$, a harmonic sum
      with its *smallest* term removed. The full collection costs
      $6H_6 = 14.7$, so the sixth face alone accounts for $6$ of those $14.7$
      rolls: nearly all the waiting is in the last coupon, which is exactly what
      the harmonic tail is telling you.
    expects: "8.7"
    rubric:
      - >
        Adds five geometric waiting times with means $6/(6-j)$, rather than
        computing the full $6H_6$ and stopping there.
      - >
        Reads the stage probabilities as $(6-j)/6$ with $j$ the number of faces
        already seen, so the first stage costs exactly $1$ roll.
      - >
        Recognises the answer as a truncated harmonic sum, $6(H_6 - H_1)$.
    targets:
      - quant-tools.series-calculus.harmonic-numbers

  - id: qser-harmonic-numbers-02
    kind: work
    difficulty: standard
    statement: >
      The numbers $1, 2, \dots, 10$ are written in a uniformly random order. A
      term is a *record* if it exceeds every term before it, so the first term
      is always a record. What is the expected number of records? Give four
      decimal places.
    answer: >
      $\approx 2.9290$. Let $I_k$ be the indicator that the $k$-th term is a
      record. Among the first $k$ terms every one is equally likely to be the
      largest, so $\Pr(I_k = 1) = \dfrac{1}{k}$ — a symmetry argument that needs
      nothing about the other positions. Linearity of expectation, which does
      not care that the $I_k$ are dependent, then gives the expected count as
      $\sum_{k=1}^{10}\dfrac{1}{k} = H_{10}
      = 1 + 0.5 + 0.3333 + 0.25 + 0.2 + 0.1667 + 0.1429 + 0.125 + 0.1111 + 0.1
      = 2.9290$. The approximation $\ln 10 + \gamma = 2.3026 + 0.5772 = 2.8798$
      is already within $0.05$ and tightens as $n$ grows. A harmonic sum falling
      out of a counting answer is the signature of a record problem.
    expects: "2.9290"
    tolerance: 0.0005
    rubric:
      - >
        Gets $\Pr(I_k = 1) = 1/k$ by symmetry among the first $k$ terms.
      - >
        Uses linearity of expectation without needing the indicators to be
        independent — they are not.
      - >
        Evaluates $H_{10}$ rather than reporting $\ln 10 + \gamma$ when four
        decimals are asked for.
    targets:
      - quant-tools.series-calculus.harmonic-numbers

  # --- Taylor's theorem (landmark: three problems) ----------------------------

  - id: qser-taylor-01
    kind: work
    difficulty: demanding
    statement: >
      A function $f$ is three times differentiable on $[1, 1.2]$ with
      $|f'''(x)| \le 6$ throughout, and $f(1) = 2$, $f'(1) = -1$,
      $f''(1) = 4$. Its quadratic Taylor polynomial at $a = 1$ is used to
      estimate $f(1.2)$. What upper bound on the absolute error does the
      Lagrange remainder guarantee?
    answer: >
      $0.008$. The quadratic polynomial is
      $P_2(x) = f(1) + f'(1)(x-1) + \dfrac{f''(1)}{2}(x-1)^{2}$, and Taylor's
      theorem says $f(1.2) - P_2(1.2) = \dfrac{f'''(\xi)}{3!}(0.2)^{3}$ for some
      $\xi$ strictly between $1$ and $1.2$. Since $\xi$ is unknown, the only
      usable bound is the worst case of $|f'''|$ on the interval:
      $|R_2| \le \dfrac{6}{6}(0.2)^{3} = 0.008$. The given values of $f$, $f'$
      and $f''$ fix the estimate — $P_2(1.2) = 2 - 0.2 + 2(0.04) = 1.88$ — but
      contribute nothing to the error, which is the point of the question. The
      two standard slips are dividing by $2!$ rather than $3!$, and raising
      $0.2$ to the second power rather than the third: the remainder always
      carries one more power and one more factorial than the last term kept.
    expects: "0.008"
    rubric:
      - >
        Uses $(x-a)^{n+1}/(n+1)! = (0.2)^{3}/6$, one order beyond the last term
        retained.
      - >
        Bounds the unknown $f'''(\xi)$ by its supremum on the whole interval
        rather than by $f'''(1)$.
      - >
        Does not let $f(1)$, $f'(1)$ or $f''(1)$ enter the error bound.
    targets:
      - quant-tools.series-calculus.taylor

  - id: qser-taylor-02
    kind: work
    difficulty: standard
    statement: >
      Use a first-order Taylor expansion about a well-chosen point to
      approximate $8.12^{1/3}$. Give four decimal places.
    answer: >
      $\approx 2.0100$. Put $f(x) = x^{1/3}$ and expand at $a = 8$, the nearest
      perfect cube, where the value is exactly $2$ — choosing the expansion
      point is most of the work. Then $f'(x) = \dfrac{1}{3}x^{-2/3}$, so
      $f'(8) = \dfrac{1}{3}\cdot\dfrac{1}{4} = \dfrac{1}{12}$, and the linear
      approximation is $f(8.12) \approx 2 + \dfrac{0.12}{12} = 2.01$. The true
      value is $2.00995$, an error of about $5 \times 10^{-5}$, which the
      remainder predicts: $f''(x) = -\dfrac{2}{9}x^{-5/3}$ gives
      $f''(8) = -\dfrac{1}{144}$, and
      $\dfrac{f''(8)}{2}(0.12)^{2} \approx -5 \times 10^{-5}$. Expanding about
      $a = 1$ instead would be legal but useless — the displacement $7.12$ makes
      the remainder swamp the linear term.
    expects: "2.0100"
    tolerance: 0.0005
    rubric:
      - >
        Expands about $a = 8$, where the cube root is exact, rather than about a
        point where $f(a)$ must itself be approximated.
      - >
        Computes $f'(8) = 1/12$, using $x^{-2/3}$ and not $x^{-1/3}$.
      - >
        Sizes the error from the second-order term rather than asserting the
        answer is close.
    targets:
      - quant-tools.series-calculus.taylor

  - id: qser-taylor-03
    kind: decide
    difficulty: routine
    statement: >
      Taylor's theorem with the Lagrange remainder is applied to $f$ at the
      point $a$ to estimate $f(x)$. Which hypothesis does the remainder formula
      actually require?
    answer: >
      That $f$ is $n+1$ times differentiable on an open interval containing both
      $a$ and $x$. The polynomial itself only needs the derivatives at $a$ — it
      is built from $f(a), f'(a), \dots, f^{(n)}(a)$ and nothing else. But the
      remainder is $\dfrac{f^{(n+1)}(\xi)}{(n+1)!}(x-a)^{n+1}$ for an unknown
      $\xi$ strictly between $a$ and $x$, so $f^{(n+1)}$ has to exist at every
      point it might land on. A kink or a blow-up anywhere in between voids the
      bound even when $f$ is perfectly smooth at $a$ itself. Nothing stronger is
      needed: the theorem is a statement about one finite truncation, so it
      never asks that the full Taylor series converge to $f$.
    choices:
      - text: >
          That $f$ has $n+1$ derivatives at the single point $a$
        feedback: >
          That is enough to write the polynomial down, but the remainder is
          evaluated at an unknown $\xi$ between $a$ and $x$ — the derivative has
          to exist there too.
      - text: >
          That $f$ is $n+1$ times differentiable on an open interval containing
          both $a$ and $x$
        correct: true
        feedback: >
          The unknown $\xi$ can be anywhere strictly between $a$ and $x$, so the
          hypothesis has to cover the whole interval.
      - text: >
          That $f$ is infinitely differentiable and its Taylor series converges
          to $f$ near $a$
        feedback: >
          That is analyticity, far more than the theorem needs — Taylor's
          theorem is about a single finite truncation and its error, not about
          an infinite series.
    rubric:
      - >
        Separates what builds the polynomial (derivatives at $a$) from what
        justifies the remainder (derivatives across the interval).
      - >
        Does not require convergence of the infinite series, which is a strictly
        stronger and unnecessary condition.
    targets:
      - quant-tools.series-calculus.taylor

  # --- the standard Maclaurin expansions -------------------------------------

  - id: qser-standard-series-01
    kind: work
    difficulty: demanding
    statement: >
      Evaluate $\lim_{x \to 0}\dfrac{\sin x - x\cos x}{x^{3}}$.
    answer: >
      $\dfrac{1}{3}$. Expand both pieces to the same order in $x$:
      $\sin x = x - \dfrac{x^{3}}{6} + O(x^{5})$, and
      $x\cos x = x\left(1 - \dfrac{x^{2}}{2} + O(x^{4})\right)
      = x - \dfrac{x^{3}}{2} + O(x^{5})$. Subtracting, the $x$ terms cancel
      exactly and $\sin x - x\cos x
      = \left(\dfrac{1}{2} - \dfrac{1}{6}\right)x^{3} + O(x^{5})
      = \dfrac{x^{3}}{3} + O(x^{5})$, so the quotient tends to $\dfrac{1}{3}$.
      The discipline that matters is expanding both terms to order $x^{3}$:
      truncating $\cos x$ at $1$ leaves $\sin x - x$ and gives
      $-\dfrac{1}{6}$, the wrong sign as well as the wrong size. Three rounds of
      L'Hopital's rule reach the same number with considerably more work.
    expects: "1/3"
    tolerance: 0.0005
    rubric:
      - >
        Expands $\sin x$ and $x\cos x$ to the same order, $x^{3}$, before
        subtracting.
      - >
        Gets the coefficient $\dfrac{1}{2} - \dfrac{1}{6} = \dfrac{1}{3}$ with
        the correct sign.
    targets:
      - quant-tools.series-calculus.standard-series

  - id: qser-standard-series-02
    kind: work
    difficulty: standard
    statement: >
      Use the binomial series, keeping terms through $x^{2}$, to estimate
      $\dfrac{1}{\sqrt{1.04}}$ to four decimal places.
    answer: >
      $\approx 0.9806$. Take $\alpha = -\dfrac{1}{2}$ in
      $(1+x)^{\alpha} = 1 + \alpha x + \dfrac{\alpha(\alpha-1)}{2}x^{2}
      + \cdots$. The quadratic coefficient is
      $\dfrac{(-1/2)(-3/2)}{2} = \dfrac{3}{8}$, so
      $(1+x)^{-1/2} \approx 1 - \dfrac{x}{2} + \dfrac{3}{8}x^{2}$. At
      $x = 0.04$ this gives
      $1 - 0.02 + \dfrac{3}{8}(0.0016) = 1 - 0.02 + 0.0006 = 0.9806$, against
      the true $0.980581$ — three terms already good to four decimals. The
      series is legal because $|x| = 0.04 < 1$; at $x = 2$ the binomial series
      does not merely lose accuracy, it diverges. The coefficient's second
      factor is $\alpha - 1 = -\dfrac{3}{2}$, not $-\dfrac{1}{2}$, which is
      where the arithmetic usually goes wrong.
    expects: "0.9806"
    tolerance: 0.0005
    rubric:
      - >
        Uses $\alpha = -1/2$ and computes the $x^{2}$ coefficient as
        $\alpha(\alpha-1)/2 = 3/8$, positive.
      - >
        Notes that $|x| < 1$ is required for the binomial series, unlike
        $e^{x}$, $\sin x$ or $\cos x$.
    targets:
      - quant-tools.series-calculus.standard-series

  # --- the compounding limit -------------------------------------------------

  - id: qser-exp-limit-01
    kind: work
    difficulty: demanding
    statement: >
      Evaluate $\lim_{n \to \infty}\left(\dfrac{n+3}{n+1}\right)^{n}$ to four
      decimal places.
    answer: >
      $e^{2} \approx 7.3891$. Rewrite the base so the limit is visible:
      $\dfrac{n+3}{n+1} = 1 + \dfrac{2}{n+1}$. Then
      $\left(1 + \dfrac{2}{n+1}\right)^{n+1}
      = \left(1 + \dfrac{2}{n+1}\right)^{n}\left(1 + \dfrac{2}{n+1}\right)$,
      where the left side is the standard limit with $x = 2$ and index $n+1$,
      tending to $e^{2}$, and the trailing factor tends to $1$; so the quantity
      asked for tends to $e^{2} = 7.3891$. The log route confirms it:
      $n\ln\left(1 + \dfrac{2}{n+1}\right)
      = n\left(\dfrac{2}{n+1} - \dfrac{2}{(n+1)^{2}} + \cdots\right) \to 2$. A
      common wrong answer is $e^{3}$, from reading the base as
      $1 + \dfrac{3}{n}$ and ignoring the denominator's shift — the increment is
      $\dfrac{2}{n+1}$, because $\dfrac{n+3}{n+1}$ exceeds $1$ by the
      *difference* of the two offsets, not by the larger one.
    expects: "7.3891"
    tolerance: 0.0005
    rubric:
      - >
        Writes the base as $1 + \dfrac{2}{n+1}$, so the increment is the
        difference of the offsets.
      - >
        Handles the mismatch between the exponent $n$ and the index $n+1$,
        rather than assuming it is harmless without saying why.
    targets:
      - quant-tools.series-calculus.exp-limit
    exercises:
      - quant-tools.series-calculus.standard-series

  - id: qser-exp-limit-02
    kind: work
    difficulty: standard
    statement: >
      A hash table has $n$ buckets and receives $2n$ keys, each landing in a
      uniformly random bucket independently of the others. For large $n$, what
      fraction of the buckets is expected to remain empty? Give four decimal
      places.
    answer: >
      $e^{-2} \approx 0.1353$. A fixed bucket is missed by one key with
      probability $1 - \dfrac{1}{n}$, and the keys are independent, so the
      bucket stays empty with probability
      $\left(1 - \dfrac{1}{n}\right)^{2n}
      = \left[\left(1 - \dfrac{1}{n}\right)^{n}\right]^{2}
      \to (e^{-1})^{2} = e^{-2} \approx 0.1353$. By linearity of expectation the
      expected *fraction* of empty buckets is that same number, even though the
      buckets are not independent of one another. Two guards: the exponent is
      $2n$, so the limit is $e^{-2}$ and not $e^{-1}$; and the approach is from
      below and slow, so at $n = 100$ the exact value is
      $(0.99)^{200} \approx 0.1340$, about $1\%$ short of the limit.
    expects: "0.1353"
    tolerance: 0.0005
    rubric:
      - >
        Raises $(1 - 1/n)$ to the power $2n$, giving $e^{-2}$ rather than
        $e^{-1}$.
      - >
        Uses linearity of expectation to pass from one bucket to the expected
        fraction, without needing independence between buckets.
    targets:
      - quant-tools.series-calculus.exp-limit

  # --- exchanging the order of summation --------------------------------------

  - id: qser-sum-exchange-01
    kind: work
    difficulty: demanding
    statement: >
      A random variable $X$ takes values in $\{0, 1, 2, \dots\}$ and satisfies
      $\Pr(X \ge k) = \dfrac{1}{k(k+1)}$ for every $k \ge 1$. Compute
      $\mathbb{E}[X]$.
    answer: >
      $1$. Write $X = \sum_{k \ge 1}\mathbf{1}\{X \ge k\}$: for an outcome with
      $X = m$, exactly $m$ of those indicators fire, so the identity is exact
      pointwise. Taking expectations and exchanging the sum with the
      expectation — legal because every term is nonnegative, which is the
      Tonelli side of the hypothesis — gives the tail formula
      $\mathbb{E}[X] = \sum_{k \ge 1}\Pr(X \ge k)$. That sum telescopes:
      $\dfrac{1}{k(k+1)} = \dfrac{1}{k} - \dfrac{1}{k+1}$, so the partial sums
      are $1 - \dfrac{1}{n+1}$, and $\mathbb{E}[X] = 1$. Two details decide the
      answer: the sum starts at $k = 1$, since including
      $\Pr(X \ge 0) = 1$ would add a spurious unit, and the exchange needs the
      nonnegativity, not just finiteness of the answer.
    expects: "1"
    rubric:
      - >
        Derives $\mathbb{E}[X] = \sum_{k \ge 1}\Pr(X \ge k)$ from the indicator
        decomposition and an exchange of sum and expectation.
      - >
        Names the hypothesis that licenses the infinite exchange —
        nonnegative terms.
      - >
        Telescopes the resulting sum to $1$, starting the index at $k = 1$.
    targets:
      - quant-tools.series-calculus.sum-exchange
    exercises:
      - quant-tools.series-calculus.telescoping

  - id: qser-sum-exchange-02
    kind: work
    difficulty: standard
    statement: >
      Evaluate $\sum_{i=1}^{100}\sum_{j=1}^{i} j$.
    answer: >
      $171700$. Sum by columns rather than by rows. The index region is the
      triangle $1 \le j \le i \le 100$; fixing $j$, the valid $i$ run from $j$
      to $100$, which is $101 - j$ of them, so the double sum becomes
      $\sum_{j=1}^{100} j(101 - j)
      = 101\sum_{j=1}^{100} j - \sum_{j=1}^{100} j^{2}
      = 101(5050) - 338350 = 510050 - 338350 = 171700$. The row-by-row route
      agrees: $\sum_{i=1}^{100}\dfrac{i(i+1)}{2}
      = \dfrac{338350 + 5050}{2} = 171700$. The step that decides it is the
      inner limit after the flip — $i$ from $j$ to $100$, not from $1$ to
      $100$; keeping the original-looking bounds would give
      $100\sum j = 505000$.
    expects: "171700"
    rubric:
      - >
        Redraws the index region and reads the flipped inner limits as
        $i = j$ to $100$.
      - >
        Evaluates $\sum j$ and $\sum j^{2}$ at $n = 100$ correctly, and checks
        the total against the unflipped route.
    targets:
      - quant-tools.series-calculus.sum-exchange
    exercises:
      - quant-tools.series-calculus.power-sums

  # --- the Gaussian integral (landmark: three problems) ----------------------

  - id: qser-gaussian-integral-01
    kind: work
    difficulty: demanding
    statement: >
      Evaluate $\int_{-\infty}^{\infty} e^{-2x^{2} + 4x - 3}\,dx$ to four
      decimal places.
    answer: >
      $\approx 0.4611$. Complete the square in the exponent, remembering to
      factor the $-2$ out of both the quadratic and the linear term:
      $-2x^{2} + 4x - 3 = -2(x^{2} - 2x) - 3
      = -2\left((x-1)^{2} - 1\right) - 3 = -2(x-1)^{2} - 1$. The constant
      $e^{-1}$ comes out front, and translating $u = x - 1$ leaves the domain as
      the whole line, so
      $\int_{-\infty}^{\infty} e^{-2x^{2}+4x-3}\,dx
      = e^{-1}\int_{-\infty}^{\infty} e^{-2u^{2}}\,du
      = e^{-1}\sqrt{\dfrac{\pi}{2}}$. Numerically
      $\sqrt{\pi/2} = 1.25331$ and $e^{-1} = 0.36788$, giving $0.46107$. The
      scaled form is $\sqrt{\pi/a}$ with $a = 2$; reaching for the
      $e^{-x^{2}/2}$ normalisation $\sqrt{2\pi}$ without rescaling would be off
      by a factor of $2$.
    expects: "0.4611"
    tolerance: 0.0005
    rubric:
      - >
        Factors $-2$ out of both $x^{2}$ and $x$ before completing the square,
        so the constant is $e^{-1}$ and not $e^{-3}$ or $e^{+1}$.
      - >
        Uses $\int e^{-ax^{2}}dx = \sqrt{\pi/a}$ with $a = 2$, and notes that
        translating the variable leaves the full-line integral unchanged.
    targets:
      - quant-tools.series-calculus.gaussian-integral

  - id: qser-gaussian-integral-02
    kind: work
    difficulty: standard
    statement: >
      Evaluate $\int_{0}^{\infty} e^{-x^{2}/8}\,dx$ to four decimal places.
    answer: >
      $\approx 2.5066$. Read the exponent as $-ax^{2}$ with
      $a = \dfrac{1}{8}$. The full-line integral is
      $\sqrt{\dfrac{\pi}{a}} = \sqrt{8\pi} = 5.01326$, and the integrand is
      even, so the half-line integral is exactly half of it, $2.50663$. That it
      equals $\sqrt{2\pi}$ is not a coincidence: $e^{-x^{2}/8}$ is the
      $e^{-x^{2}/(2\sigma^{2})}$ shape with $\sigma = 2$, whose full integral is
      $\sigma\sqrt{2\pi}$. The slip to avoid is reading $a$ as $8$ rather than
      $\dfrac{1}{8}$, which gives $\sqrt{\pi/8} \approx 0.627$ — smaller than
      $\sqrt{2\pi}$, when a flatter bell must enclose more area, not less.
    expects: "2.5066"
    tolerance: 0.0005
    rubric:
      - >
        Identifies $a = 1/8$, so the full-line value is $\sqrt{8\pi}$ and not
        $\sqrt{\pi/8}$.
      - >
        Halves the full-line integral by evenness rather than treating the
        half-line case as a new computation.
    targets:
      - quant-tools.series-calculus.gaussian-integral

  - id: qser-gaussian-integral-03
    kind: work
    difficulty: routine
    statement: >
      Evaluate $\int_{-\infty}^{\infty} e^{-x^{2}/4}\,dx$ to four decimal
      places.
    answer: >
      $\approx 3.5449$. Match the exponent to $-ax^{2}$: here
      $a = \dfrac{1}{4}$, so the value is
      $\sqrt{\dfrac{\pi}{a}} = \sqrt{4\pi} = 2\sqrt{\pi} = 3.54491$. The same
      number arrives by the density route: $\dfrac{x^{2}}{4}
      = \dfrac{x^{2}}{2\sigma^{2}}$ forces $\sigma^{2} = 2$, and the full
      integral of $e^{-x^{2}/(2\sigma^{2})}$ is $\sigma\sqrt{2\pi}
      = \sqrt{2}\sqrt{2\pi} = 2\sqrt{\pi}$. Both are rescalings of the single
      fact $\int_{-\infty}^{\infty} e^{-x^{2}/2}\,dx = \sqrt{2\pi}$; the
      substitution $u = x/\sigma$ is what carries the factor $\sigma$ out of the
      integral.
    expects: "3.5449"
    tolerance: 0.0005
    rubric:
      - >
        Applies $\int e^{-ax^{2}}dx = \sqrt{\pi/a}$ with $a = 1/4$, giving a
        value larger than $\sqrt{2\pi}$, not smaller.
      - >
        Can reach the same answer by rescaling $\int e^{-x^{2}/2}dx
        = \sqrt{2\pi}$ with $u = x/\sigma$.
    targets:
      - quant-tools.series-calculus.gaussian-integral

  # --- moments of the Gaussian density ---------------------------------------

  - id: qser-gaussian-moments-01
    kind: work
    difficulty: demanding
    statement: >
      Let $Z$ be a standard normal random variable. Compute
      $\mathbb{E}\left[(1 + Z)^{4}\right]$.
    answer: >
      $10$. Expand with the binomial theorem and take the expectation term by
      term: $\mathbb{E}[(1+Z)^{4}]
      = 1 + 4\mathbb{E}[Z] + 6\mathbb{E}[Z^{2}] + 4\mathbb{E}[Z^{3}]
      + \mathbb{E}[Z^{4}]$. The odd moments $\mathbb{E}[Z]$ and
      $\mathbb{E}[Z^{3}]$ are exactly $0$ — an odd integrand against an even
      density over a symmetric interval, a structural fact rather than a small
      quantity. The even moments follow the recursion
      $\mathbb{E}[Z^{2k}] = (2k-1)\mathbb{E}[Z^{2k-2}]$ from
      $\mathbb{E}[Z^{0}] = 1$, giving $\mathbb{E}[Z^{2}] = 1$ and
      $\mathbb{E}[Z^{4}] = 3$. So the total is $1 + 0 + 6 + 0 + 3 = 10$. Using
      $\mathbb{E}[Z^{4}] = 1$, as if the fourth moment matched the variance,
      would give $8$; the excess of $3$ over $1$ is exactly the kurtosis
      benchmark.
    expects: "10"
    rubric:
      - >
        Sets both odd moments to exactly zero, by symmetry rather than by
        approximation.
      - >
        Uses $\mathbb{E}[Z^{4}] = 3$ from the $(2k-1)$ recursion, with the
        binomial coefficients $1, 4, 6, 4, 1$ attached correctly.
    targets:
      - quant-tools.series-calculus.gaussian-moments

  - id: qser-gaussian-moments-02
    kind: work
    difficulty: standard
    statement: >
      Let $X$ be normally distributed with mean $0$ and variance $4$. Compute
      $\mathbb{E}[X^{4}]$.
    answer: >
      $48$. A variance of $4$ means a standard deviation of $2$, so write
      $X = 2Z$ with $Z$ standard normal. Then
      $\mathbb{E}[X^{4}] = 2^{4}\,\mathbb{E}[Z^{4}] = 16 \times 3 = 48$, using
      the fourth standard moment $3 = 3!!$ produced by the recursion
      $\mathbb{E}[Z^{2k}] = (2k-1)\mathbb{E}[Z^{2k-2}]$. In general a centred
      normal has $\mathbb{E}[X^{4}] = 3\sigma^{4}$, so the ratio
      $\mathbb{E}[X^{4}]/\sigma^{4} = 3$ is scale-free — which is precisely why
      $3$ is quoted as *the* kurtosis benchmark rather than something that
      depends on the variance. Scaling by $\sigma^{2} = 4$ instead of
      $\sigma^{4} = 16$ would give $12$.
    expects: "48"
    rubric:
      - >
        Scales by $\sigma^{4} = 16$, not $\sigma^{2} = 4$, when passing from
        $Z$ to $X$.
      - >
        Uses $\mathbb{E}[Z^{4}] = 3$ and notes that the resulting kurtosis is
        independent of $\sigma$.
    targets:
      - quant-tools.series-calculus.gaussian-moments

  # --- the Gamma function ----------------------------------------------------

  - id: qser-gamma-function-01
    kind: work
    difficulty: demanding
    statement: >
      Evaluate $\int_{0}^{\infty} x^{5} e^{-x^{2}/2}\,dx$.
    answer: >
      $8$. The integrand is not $t^{n}e^{-\lambda t}$ as written, but one
      substitution makes it so. Put $u = \dfrac{x^{2}}{2}$, so that
      $du = x\,dx$ and $x^{2} = 2u$. Then one factor of $x$ is consumed by
      $du$ and the remaining even power rewrites cleanly:
      $x^{5}\,dx = x^{4}\cdot x\,dx = (2u)^{2}\,du = 4u^{2}\,du$. The integral
      becomes $\int_{0}^{\infty} 4u^{2}e^{-u}\,du = 4\,\Gamma(3)
      = 4 \times 2! = 8$. Note $\Gamma(3) = 2! = 2$, not $3! = 6$ — the
      off-by-one in $\Gamma(n) = (n-1)!$ is the trap here. The odd power of $x$
      is what makes the substitution work at all; an even power would leave a
      stray $\sqrt{u}$ and send you to a half-integer $\Gamma$ instead.
    expects: "8"
    rubric:
      - >
        Substitutes $u = x^{2}/2$ and accounts for the single factor of $x$
        absorbed by $du$.
      - >
        Evaluates $\Gamma(3)$ as $2! = 2$, not $3! = 6$.
    targets:
      - quant-tools.series-calculus.gamma-function

  - id: qser-gamma-function-02
    kind: work
    difficulty: standard
    statement: >
      Evaluate $\int_{0}^{\infty}\sqrt{t}\,e^{-2t}\,dt$ to four decimal places.
    answer: >
      $\approx 0.3133$. Substituting $s = \lambda t$ in the definition gives the
      rescaled identity $\int_{0}^{\infty} t^{z-1}e^{-\lambda t}\,dt
      = \dfrac{\Gamma(z)}{\lambda^{z}}$. Here $\sqrt{t} = t^{1/2}$ means
      $z - 1 = \dfrac{1}{2}$, so $z = \dfrac{3}{2}$ and $\lambda = 2$, and the
      value is $\dfrac{\Gamma(3/2)}{2^{3/2}}$. The half-integer comes from the
      Gaussian anchor $\Gamma(1/2) = \sqrt{\pi}$ through the functional
      equation: $\Gamma(3/2) = \dfrac{1}{2}\Gamma(1/2)
      = \dfrac{\sqrt{\pi}}{2} = 0.886227$. Dividing by
      $2^{3/2} = 2.828427$ gives $0.313329$. The exponent on $\lambda$ is
      $z = \dfrac{3}{2}$, not the visible power $\dfrac{1}{2}$ — the same
      shift-by-one that $\Gamma$ always invites.
    expects: "0.3133"
    tolerance: 0.0005
    rubric:
      - >
        Reads off $z = 3/2$ from $t^{z-1} = t^{1/2}$, and puts the same $z$ in
        the exponent of $\lambda$.
      - >
        Gets $\Gamma(3/2) = \sqrt{\pi}/2$ from $\Gamma(1/2) = \sqrt{\pi}$ and
        the functional equation.
    targets:
      - quant-tools.series-calculus.gamma-function

  # --- the Beta function -----------------------------------------------------

  - id: qser-beta-function-01
    kind: work
    difficulty: demanding
    statement: >
      Evaluate $\int_{0}^{2} t^{3}(2-t)^{3}\,dt$.
    answer: >
      $\dfrac{32}{35}$. The factorial identity lives on $[0,1]$, so rescale
      first. Put $t = 2u$, so $dt = 2\,du$, $2 - t = 2(1-u)$, and $u$ runs from
      $0$ to $1$. Then
      $t^{3}(2-t)^{3}\,dt = (8u^{3})\left(8(1-u)^{3}\right)(2\,du)
      = 128\,u^{3}(1-u)^{3}\,du$ — the scale factor is
      $2^{3}\cdot 2^{3}\cdot 2 = 2^{7} = 128$, one power of the interval length
      for each exponent *and* one for $dt$, and dropping that last one is the
      standard slip. Now the integer form applies:
      $\int_{0}^{1} u^{3}(1-u)^{3}\,du = \dfrac{3!\,3!}{7!}
      = \dfrac{36}{5040} = \dfrac{1}{140}$, so the answer is
      $\dfrac{128}{140} = \dfrac{32}{35} \approx 0.9143$. Symmetry checks it:
      substituting $s = t - 1$ turns the integrand into $(1 - s^{2})^{3}$ on
      $[-1,1]$, and $2\int_{0}^{1}\left(1 - 3s^{2} + 3s^{4} - s^{6}\right)ds
      = 2\left(1 - 1 + \dfrac{3}{5} - \dfrac{1}{7}\right) = \dfrac{32}{35}$.
    expects: "32/35"
    tolerance: 0.0005
    rubric:
      - >
        Substitutes $t = 2u$ and collects all seven powers of $2$, including the
        one from $dt$.
      - >
        Applies $\int_{0}^{1} u^{m}(1-u)^{n}du = m!\,n!/(m+n+1)!$ with the
        denominator $7!$, one more than $m + n$.
    targets:
      - quant-tools.series-calculus.beta-function

  - id: qser-beta-function-02
    kind: work
    difficulty: standard
    statement: >
      Evaluate $\int_{0}^{1} x^{5}(1-x)^{2}\,dx$.
    answer: >
      $\dfrac{1}{168}$. This is the integer Beta identity with $m = 5$ and
      $n = 2$: $\int_{0}^{1} x^{m}(1-x)^{n}\,dx = \dfrac{m!\,n!}{(m+n+1)!}
      = \dfrac{5!\,2!}{8!} = \dfrac{120 \times 2}{40320} = \dfrac{240}{40320}
      = \dfrac{1}{168} \approx 0.005952$. The denominator is $8!$, one more
      than $m + n = 7$; using $7!$ would give $\dfrac{1}{21}$, eight times too
      large, and that missing $+1$ is the identity's one real trap. Symmetry is
      a free check: $B(a,b) = B(b,a)$, so $\int_{0}^{1} x^{2}(1-x)^{5}\,dx$ must
      give the same number, and $\dfrac{2!\,5!}{8!}$ plainly does.
    expects: "1/168"
    tolerance: 0.0005
    rubric:
      - >
        Uses $(m+n+1)! = 8!$ in the denominator rather than $(m+n)! = 7!$.
      - >
        Checks the answer against the symmetry $B(a,b) = B(b,a)$.
    targets:
      - quant-tools.series-calculus.beta-function

  # --- Stirling's approximation (landmark: three problems) -------------------

  - id: qser-stirling-01
    kind: work
    difficulty: demanding
    statement: >
      How many decimal digits does $200!$ have?
    answer: >
      $375$. The number itself is unmanageable, so work in logs. Stirling's log
      form gives $\ln(200!) = 200\ln 200 - 200 + \dfrac{1}{2}\ln(400\pi)$. With
      $\ln 200 = 5.29832$ that is
      $1059.663 - 200 + \dfrac{1}{2}(7.1365) = 859.663 + 3.568 = 863.231$.
      Converting to base ten, $\log_{10}(200!)
      = \dfrac{863.231}{2.302585} = 374.897$. A positive integer $N$ has
      $\lfloor \log_{10} N\rfloor + 1$ digits, so $200!$ has $375$ of them.
      Reporting $374$ — forgetting the $+1$ — is the usual mistake. The
      neglected $O(1/n)$ term is about $\dfrac{1}{2400}$ in the natural log,
      far smaller than the $0.1$ of slack to the nearest integer, so the answer
      is safe.
    expects: "375"
    rubric:
      - >
        Uses the log form including the $\tfrac{1}{2}\ln(2\pi n)$ correction,
        and converts to base ten.
      - >
        Applies $\lfloor \log_{10} N\rfloor + 1$ for the digit count.
      - >
        Checks that the approximation's error is far too small to change the
        integer part.
    targets:
      - quant-tools.series-calculus.stirling

  - id: qser-stirling-02
    kind: work
    difficulty: standard
    statement: >
      Use Stirling's log form to estimate $\ln(40!)$ to two decimal places.
    answer: >
      $\approx 110.32$. The log form is
      $\ln(n!) = n\ln n - n + \dfrac{1}{2}\ln(2\pi n) + O(1/n)$. At $n = 40$:
      $\ln 40 = 3.68888$, so $40\ln 40 = 147.5551$; and $2\pi n = 251.327$ with
      $\ln 251.327 = 5.52684$, half of which is $2.76342$. Assembling,
      $147.5551 - 40 + 2.7634 = 110.3186$, so $110.32$ to two decimals. The
      exact value is $\ln(40!) = 110.32064$, a gap of about $0.0021$ —
      essentially the predicted $\dfrac{1}{12n} = \dfrac{1}{480} = 0.00208$.
      Dropping the $\dfrac{1}{2}\ln(2\pi n)$ term would give $107.56$, wrong in
      the second digit, so that correction is not optional at this size.
    expects: "110.32"
    tolerance: 0.005
    rubric:
      - >
        Keeps the $\tfrac{1}{2}\ln(2\pi n)$ term rather than stopping at
        $n\ln n - n$.
      - >
        Evaluates $2\pi n$ at $n = 40$, not $\pi n$ or $2\pi$, inside the
        logarithm.
    targets:
      - quant-tools.series-calculus.stirling

  - id: qser-stirling-03
    kind: decide
    difficulty: routine
    statement: >
      The leading Stirling form $\sqrt{2\pi n}\,\left(\dfrac{n}{e}\right)^{n}$
      is compared with the exact value of $25!$. Which describes the
      comparison?
    answer: >
      It underestimates $25!$ by about $0.33\%$. The exact statement is
      $n! = \sqrt{2\pi n}\left(\dfrac{n}{e}\right)^{n}e^{\theta_n/(12n)}$ with
      $\theta_n \in (0,1)$, so the exponential factor is strictly greater than
      $1$ and the leading form always falls short — the direction of the error
      is fixed, not a matter of luck at particular $n$. The size is about
      $\dfrac{1}{12n}$, which at $n = 25$ is
      $\dfrac{1}{300} \approx 0.0033$, or $0.33\%$; the actual ratio of the
      leading form to $25!$ is $0.99667$, matching. Because the relative error
      falls like $1/n$, it is percent-level for single-digit $n$ and negligible
      by the hundreds.
    choices:
      - text: >
          It underestimates $25!$ by about $0.33\%$
        correct: true
        feedback: >
          The correction factor $e^{\theta_n/(12n)}$ exceeds $1$, so the leading
          form is low, by about $1/(12n) = 1/300$.
      - text: >
          It overestimates $25!$ by about $0.33\%$
        feedback: >
          The size is right but the sign is not: the missing factor
          $e^{\theta_n/(12n)}$ is greater than $1$, so the leading form is below
          the truth.
      - text: >
          It underestimates $25!$ by about $4\%$
        feedback: >
          That is roughly the error at $n = 2$. The relative error falls like
          $1/(12n)$, so by $n = 25$ it is under half a percent.
      - text: >
          It is exact for every integer $n$
        feedback: >
          Stirling's leading form is asymptotic, never exact — the ratio to
          $n!$ tends to $1$ but is never equal to it.
    rubric:
      - >
        Gets the direction from the sign of $\theta_n/(12n)$, not from a
        remembered example.
      - >
        Sizes the relative error as $1/(12n)$ evaluated at $n = 25$.
    targets:
      - quant-tools.series-calculus.stirling

  # --- the central binomial coefficient --------------------------------------

  - id: qser-stirling-central-binomial-01
    kind: work
    difficulty: demanding
    statement: >
      Using the central-binomial asymptotic, how many decimal digits does
      $\binom{200}{100}$ have?
    answer: >
      $59$. The asymptotic is $\binom{2n}{n} \sim \dfrac{4^{n}}{\sqrt{\pi n}}$,
      so with $n = 100$,
      $\log_{10}\binom{200}{100} \approx 100\log_{10} 4
      - \dfrac{1}{2}\log_{10}(100\pi)
      = 200\log_{10} 2 - \dfrac{1}{2}\log_{10}(314.159)$. Now
      $200\log_{10} 2 = 60.2060$ and $\log_{10}(314.159) = 2.49715$, so the
      logarithm is $60.2060 - 1.2486 = 58.957$. The digit count is
      $\lfloor 58.957\rfloor + 1 = 59$, and indeed
      $\binom{200}{100} \approx 9.055 \times 10^{58}$. The asymptotic's relative
      error is about $\dfrac{1}{8n} = 0.00125$, which shifts the base-ten
      logarithm by only $0.0005$ — nowhere near enough to cross an integer
      boundary, so the digit count is safe. Note $n = 100$, half the top index.
    expects: "59"
    rubric:
      - >
        Sets $n = 100$, half of $200$, in $4^{n}/\sqrt{\pi n}$.
      - >
        Subtracts $\tfrac{1}{2}\log_{10}(\pi n)$ rather than answering from
        $4^{n}$ alone.
      - >
        Converts a base-ten logarithm to a digit count with the $+1$.
    targets:
      - quant-tools.series-calculus.stirling-central-binomial

  - id: qser-stirling-central-binomial-02
    kind: work
    difficulty: standard
    statement: >
      In $144$ tosses of a fair coin, estimate the probability of exactly $72$
      heads. Give four decimal places.
    answer: >
      $\approx 0.0665$. The exact probability is $\binom{144}{72}2^{-144}$, and
      the asymptotic $\binom{2n}{n} \sim \dfrac{4^{n}}{\sqrt{\pi n}}$ makes the
      enormous factors cancel outright:
      $\dfrac{4^{n}}{\sqrt{\pi n}}\cdot 4^{-n} = \dfrac{1}{\sqrt{\pi n}}$, so no
      large-number arithmetic is needed at all. With $n = 72$ — half the number
      of tosses, not $144$ — we get $\pi n = 226.19$,
      $\sqrt{226.19} = 15.040$, and the estimate
      $\dfrac{1}{15.040} = 0.06649$. The exact value is $0.06638$, high by
      about $0.17\%$, which is the size of the neglected $\dfrac{1}{8n}$
      correction.
    expects: "0.0665"
    tolerance: 0.0005
    rubric:
      - >
        Uses $n = 72$, so the estimate is $1/\sqrt{72\pi}$ and not
        $1/\sqrt{144\pi}$.
      - >
        Sees the $4^{n}$ cancel against $2^{-2n}$, leaving no large numbers to
        evaluate.
    targets:
      - quant-tools.series-calculus.stirling-central-binomial

  # --- AM-GM -----------------------------------------------------------------

  - id: qser-am-gm-01
    kind: work
    difficulty: demanding
    statement: >
      For $x > 0$, what is the minimum value of $x^{2} + \dfrac{16}{x}$?
    answer: >
      $12$, attained at $x = 2$. Applying AM–GM to the two terms as written
      gives $2\sqrt{16x}$, a bound that still depends on $x$ and so bounds
      nothing. The move is to split the second term until the product is free of
      $x$: write $x^{2} + \dfrac{8}{x} + \dfrac{8}{x}$, three nonnegative terms
      whose product is $x^{2}\cdot\dfrac{64}{x^{2}} = 64$, a constant. Then
      three-term AM–GM gives $x^{2} + \dfrac{8}{x} + \dfrac{8}{x}
      \ge 3\,(64)^{1/3} = 3 \times 4 = 12$. Equality needs all three terms
      equal, so $x^{2} = \dfrac{8}{x}$, giving $x^{3} = 8$ and $x = 2$, where
      the value is $4 + 8 = 12$. The number of pieces is forced by the
      arithmetic: two pieces or four would leave a power of $x$ in the product
      and the bound would not be constant.
    expects: "12"
    rubric:
      - >
        Splits $16/x$ into two equal pieces so that the three-term product is
        free of $x$.
      - >
        Applies the $n$-term inequality with $n = 3$ and evaluates
        $3(64)^{1/3} = 12$.
      - >
        Checks the equality condition — all three terms equal — and exhibits
        $x = 2$.
    targets:
      - quant-tools.series-calculus.am-gm

  - id: qser-am-gm-02
    kind: work
    difficulty: standard
    statement: >
      For $x > 0$, what is the minimum value of $4x + \dfrac{25}{x}$?
    answer: >
      $20$, attained at $x = \dfrac{5}{2}$. Both terms are positive and their
      product $4x \cdot \dfrac{25}{x} = 100$ is free of $x$, so two-term AM–GM
      applies directly: $\dfrac{4x + 25/x}{2} \ge \sqrt{100} = 10$, hence
      $4x + \dfrac{25}{x} \ge 20$. Equality requires the two terms to be equal,
      $4x = \dfrac{25}{x}$, so $x^{2} = \dfrac{25}{4}$ and $x = \dfrac{5}{2}$;
      there the value is $10 + 10 = 20$. Stating the bound without the equality
      case answers only half the question — a bound that is never attained is
      not a minimum, and part of the work is showing that this one is.
    expects: "20"
    rubric:
      - >
        Checks that the product of the two terms is constant before applying the
        inequality.
      - >
        Produces the minimising $x = 5/2$ from the equality condition, not by
        calculus alone.
    targets:
      - quant-tools.series-calculus.am-gm

  # --- Cauchy-Schwarz --------------------------------------------------------

  - id: qser-cauchy-schwarz-01
    kind: work
    difficulty: demanding
    statement: >
      Positive reals $a$, $b$, $c$ satisfy $a + b + c = 1$. What is the minimum
      value of $\dfrac{1}{a} + \dfrac{1}{b} + \dfrac{1}{c}$?
    answer: >
      $9$, attained at $a = b = c = \dfrac{1}{3}$. Choose the vectors
      $\left(\sqrt{a}, \sqrt{b}, \sqrt{c}\right)$ and
      $\left(\dfrac{1}{\sqrt{a}}, \dfrac{1}{\sqrt{b}},
      \dfrac{1}{\sqrt{c}}\right)$, whose inner product is $1 + 1 + 1 = 3$ — a
      constant, which is the whole point of that pairing. Cauchy–Schwarz then
      gives $9 = 3^{2}
      \le (a + b + c)\left(\dfrac{1}{a} + \dfrac{1}{b} + \dfrac{1}{c}\right)
      = \dfrac{1}{a} + \dfrac{1}{b} + \dfrac{1}{c}$, using the constraint on the
      first factor. Equality demands the two vectors be proportional, i.e.
      $a = b = c$, and the constraint forces each to be $\dfrac{1}{3}$, where
      the sum of reciprocals is exactly $9$. The same bound is the
      arithmetic-mean-versus-harmonic-mean inequality in disguise.
    expects: "9"
    rubric:
      - >
        Pairs $\sqrt{a}$ with $1/\sqrt{a}$, so the inner product is the constant
        $3$ rather than something depending on $a, b, c$.
      - >
        Uses the constraint to replace $a + b + c$ by $1$ in the bound.
      - >
        Confirms attainment through the proportionality condition, giving
        $a = b = c = 1/3$.
    targets:
      - quant-tools.series-calculus.cauchy-schwarz

  - id: qser-cauchy-schwarz-02
    kind: work
    difficulty: standard
    statement: >
      What is the maximum value of $x + 2y + 3z$ subject to
      $x^{2} + y^{2} + z^{2} = 56$?
    answer: >
      $28$. Apply Cauchy–Schwarz with $a = (1, 2, 3)$ and $b = (x, y, z)$:
      $(x + 2y + 3z)^{2} \le (1 + 4 + 9)(x^{2} + y^{2} + z^{2})
      = 14 \times 56 = 784$, so the linear form is at most
      $\sqrt{784} = 28$. Equality holds exactly when $(x,y,z)$ is a positive
      multiple of $(1,2,3)$: writing $(x,y,z) = t(1,2,3)$, the constraint gives
      $14t^{2} = 56$, so $t = 2$ and the maximiser is $(2,4,6)$, where
      $2 + 8 + 18 = 28$. Quoting $28$ without exhibiting that point would leave
      open whether the bound is achieved; it is, because the constraint sphere
      meets the line through $(1,2,3)$.
    expects: "28"
    rubric:
      - >
        Uses the coefficient vector $(1,2,3)$, so the first factor is
        $1 + 4 + 9 = 14$.
      - >
        Exhibits the maximising point from the proportionality condition rather
        than stopping at the inequality.
    targets:
      - quant-tools.series-calculus.cauchy-schwarz

  # --- which term dominates --------------------------------------------------

  - id: qser-asymptotic-hierarchy-01
    kind: decide
    difficulty: demanding
    statement: >
      Order $n^{\ln n}$, $2^{n}$, $(\ln n)^{n}$ and $n!$ from slowest to fastest
      growth as $n \to \infty$.
    answer: >
      $n^{\ln n} \ll 2^{n} \ll (\ln n)^{n} \ll n!$. Take logarithms and rank
      those instead, which turns every comparison into arithmetic:
      $\ln\left(n^{\ln n}\right) = (\ln n)^{2}$, $\ln\left(2^{n}\right)
      = n\ln 2$, $\ln\left((\ln n)^{n}\right) = n\ln\ln n$, and by Stirling
      $\ln(n!) = n\ln n - n + O(\ln n)$. Now: $(\ln n)^{2}$ is negligible beside
      $n$, so it loses to $n\ln 2$; $\ln\ln n$ tends to infinity and so
      eventually exceeds the fixed constant $\ln 2$, putting $n\ln\ln n$ above
      $n\ln 2$; and $\ln n$ grows faster than $\ln\ln n$, putting
      $n\ln n - n$ on top. The general lesson is in the middle two: a base that
      itself grows with $n$ eventually beats any fixed base, however large that
      fixed base looks at small $n$.
    choices:
      - text: >
          $n^{\ln n} \ll 2^{n} \ll (\ln n)^{n} \ll n!$
        correct: true
        feedback: >
          The logarithms are $(\ln n)^{2}$, $n\ln 2$, $n\ln\ln n$ and
          $n\ln n - n$, which rank in exactly that order.
      - text: >
          $2^{n} \ll n^{\ln n} \ll (\ln n)^{n} \ll n!$
        feedback: >
          $\ln\left(n^{\ln n}\right) = (\ln n)^{2}$ is far smaller than
          $n\ln 2$: a power of $\ln n$ can never keep up with a multiple of
          $n$.
      - text: >
          $n^{\ln n} \ll (\ln n)^{n} \ll 2^{n} \ll n!$
        feedback: >
          $\ln\ln n$ grows without bound, so $n\ln\ln n$ eventually passes the
          fixed multiple $n\ln 2$ — $(\ln n)^{n}$ overtakes $2^{n}$, not the
          other way round.
      - text: >
          $n^{\ln n} \ll 2^{n} \ll n! \ll (\ln n)^{n}$
        feedback: >
          Compare $n\ln n - n$ with $n\ln\ln n$: since $\ln n$ dominates
          $\ln\ln n$, it is $n!$ that ends up on top.
    rubric:
      - >
        Compares logarithms rather than raw magnitudes, and writes all four out
        explicitly.
      - >
        Uses Stirling for $\ln(n!)$ instead of guessing where the factorial
        sits.
      - >
        Places $(\ln n)^{n}$ above $2^{n}$ on the grounds that its base grows.
    targets:
      - quant-tools.series-calculus.asymptotic-hierarchy

  - id: qser-asymptotic-hierarchy-02
    kind: work
    difficulty: standard
    statement: >
      What is the smallest positive integer $n$ for which $n! > 10^{n}$?
    answer: >
      $25$. Compare logarithms: the condition is
      $\ln(n!) > n\ln 10 = 2.302585\,n$, and Stirling gives
      $\ln(n!) \approx n\ln n - n + \dfrac{1}{2}\ln(2\pi n)$. Dividing through
      by $n$, the condition reads
      $\ln n - 1 + \dfrac{\ln(2\pi n)}{2n} > 2.302585$. Near $n = 25$ the last
      term is $\dfrac{5.057}{50} \approx 0.101$, so we need
      $\ln n > 3.202$, that is $n > 24.6$ — which points straight at $25$, and
      the neighbours confirm it. At $n = 24$:
      $24(3.17805) - 24 + \dfrac{1}{2}\ln(150.80) = 76.273 - 24 + 2.508
      = 54.781 < 24\ln 10 = 55.262$. At $n = 25$:
      $25(3.21888) - 25 + \dfrac{1}{2}\ln(157.08) = 80.472 - 25 + 2.528
      = 58.000 > 25\ln 10 = 57.565$. Exactly,
      $24! \approx 6.20 \times 10^{23}$ and
      $25! \approx 1.55 \times 10^{25}$.
    expects: "25"
    rubric:
      - >
        Takes logarithms of both sides rather than comparing the raw numbers.
      - >
        Uses Stirling to locate the crossover, then verifies the two
        neighbouring integers instead of trusting the estimate alone.
    targets:
      - quant-tools.series-calculus.asymptotic-hierarchy
    exercises:
      - quant-tools.series-calculus.stirling
