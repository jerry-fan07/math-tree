# Problems targeting quant-tools.linear-algebra — matrices as the desk's
# language: eigenstructure, PSD, projection and least squares, PCA.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's
# ending with something the lesson just handed over. Every problem *instance*
# here is fresh — no matrix, data set or number being solved for appears in the
# unit's content or in its lesson cards; the corpus's named counterexamples
# (the shear, the quarter-turn, the Fibonacci matrix) are cited only inside
# explanations. See ../README.md.

problems:
  # --- matrix algebra --------------------------------------------------------

  - id: qlin-matrix-algebra-01
    kind: work
    difficulty: demanding
    statement: >
      Let $A$ have rows $(2,0)$ and $(1,3)$, and let $B$ have rows $(1,-1)$ and
      $(2,1)$. What is the $(2,1)$ entry of $(AB)^{-1}$?
    answer: >
      $-7/18 \approx -0.3889$. Route one: form $AB$, whose rows are
      $(2 \cdot 1 + 0 \cdot 2,\; 2(-1) + 0 \cdot 1) = (2,-2)$ and
      $(1 \cdot 1 + 3 \cdot 2,\; 1(-1) + 3 \cdot 1) = (7,2)$. Then
      $\det(AB) = 2 \cdot 2 - (-2)(7) = 18$, so $(AB)^{-1}$ is
      $\tfrac{1}{18}$ times the matrix with rows $(2,2)$ and $(-7,2)$, and the
      $(2,1)$ entry is $-7/18$. Route two, which is the check: inverting a
      product reverses the order, so $(AB)^{-1} = B^{-1}A^{-1}$, with
      $B^{-1} = \tfrac{1}{3}$ times rows $(1,1)$, $(-2,1)$ and
      $A^{-1} = \tfrac{1}{6}$ times rows $(3,0)$, $(-1,2)$; their product is
      $\tfrac{1}{18}$ times rows $(2,2)$, $(-7,2)$ — the same matrix. Writing
      $A^{-1}B^{-1}$ instead gives $\tfrac{1}{18}$ times rows $(3,3)$,
      $(-5,1)$, and the wrong entry $-5/18$.
    expects: "-7/18"
    tolerance: 0.0005
    rubric:
      - >
        Multiplies $AB$ as a composition — row of $A$ against column of $B$ —
        rather than entrywise.
      - >
        If the inverse is taken factor by factor, reverses the order to
        $B^{-1}A^{-1}$.
      - >
        Reads the $(2,1)$ entry, row two and column one, of the inverse.
    targets:
      - quant-tools.linear-algebra.matrix-algebra

  - id: qlin-matrix-algebra-02
    kind: decide
    difficulty: standard
    statement: >
      $A$ and $B$ are matrices for which the product $A^{T}B$ is defined. Which
      expression equals $(A^{T}B)^{T}$?
    answer: >
      $B^{T}A$. Transposing a product reverses the order and transposes each
      factor: $(A^{T}B)^{T} = B^{T}(A^{T})^{T} = B^{T}A$, since transposing
      twice returns the original matrix. The shapes confirm it — if $A$ is
      $m \times n$ and $B$ is $m \times p$, then $A^{T}B$ is $n \times p$, so
      its transpose is $p \times n$, and only $B^{T}A$ has that shape. Leaving
      the order alone would give $A B^{T}$, which is usually not even defined.
    choices:
      - text: >
          $B^{T}A$
        correct: true
        feedback: >
          Order reverses and each factor transposes, and $(A^{T})^{T} = A$.
      - text: >
          $A B^{T}$
        feedback: >
          You transposed each factor but did not reverse the order; with $A$
          of size $m \times n$ and $B$ of size $m \times p$ this product is
          not even defined.
      - text: >
          $A^{T}B^{T}$
        feedback: >
          This transposes $B$ a second time and keeps the order — two errors
          that do not cancel.
      - text: >
          $B A^{T}$
        feedback: >
          The order is reversed but the transposes are not applied to the
          factors, so the shapes do not match.
    rubric:
      - >
        Reverses the order of the product under the transpose.
      - >
        Uses $(A^{T})^{T} = A$ on the first factor rather than leaving a
        double transpose in place.
    targets:
      - quant-tools.linear-algebra.matrix-algebra

  # --- rank and solvability --------------------------------------------------

  - id: qlin-rank-solvability-01
    kind: work
    difficulty: demanding
    statement: >
      A factor model writes the returns of $10$ assets as $r = Bf$, where $B$
      is the $10 \times 4$ matrix of factor loadings and $f$ collects the $4$
      factor returns. The desk discovers that $\operatorname{rank}(B) = 3$.
      For an observed $r$ that does lie in the column space of $B$, the set of
      factor vectors $f$ reproducing it exactly is an affine subspace — what
      is its dimension?
    answer: >
      $1$. Rank–nullity applies to the number of *columns*, not rows: with
      $n = 4$ factors, $\operatorname{rank}(B) + \dim \ker(B) = 4$, so
      $\dim \ker(B) = 4 - 3 = 1$. Because $r$ is in the column space the
      system is consistent, and the full solution set is one particular $f$
      plus the null space, hence a line of factor vectors — the factors are
      not identified, since one combination of them loads on nothing. The
      common slip is to use $10$, the number of assets: the ambient dimension
      of $r$ constrains how large the rank can be but never enters the count
      of free parameters. Note also that had $r$ fallen outside the column
      space the answer would be "no solutions at all", not a smaller family.
    expects: "1"
    rubric:
      - >
        Applies rank–nullity with $n$ equal to the number of columns of $B$
        ($4$), not the number of rows ($10$).
      - >
        Uses consistency of $r$ to say the solution set is a translate of
        $\ker(B)$, so its dimension is $\dim \ker(B)$.
    targets:
      - quant-tools.linear-algebra.rank-solvability

  - id: qlin-rank-solvability-02
    kind: work
    difficulty: standard
    statement: >
      $A$ is a $4 \times 6$ matrix whose null space has dimension $2$. What is
      $\operatorname{rank}(A)$?
    answer: >
      $4$. Rank–nullity gives
      $\operatorname{rank}(A) = n - \dim \ker(A) = 6 - 2 = 4$. This is the
      largest a rank can be here, since the rank is at most
      $\min(4,6) = 4$ — so the columns span all of $\mathbb{R}^{4}$ and
      $Ax = b$ is solvable for every $b$, always with a $2$-dimensional family
      of solutions. Subtracting from $4$ instead of $6$ would give $2$ and
      describe a matrix that is neither onto nor consistent with the given
      nullity.
    expects: "4"
    rubric:
      - >
        Subtracts the nullity from the number of columns, $6$.
      - >
        Checks the answer against the ceiling $\operatorname{rank}(A) \le
        \min(4,6)$.
    targets:
      - quant-tools.linear-algebra.rank-solvability

  # --- determinant and trace -------------------------------------------------

  - id: qlin-determinant-trace-01
    kind: work
    difficulty: demanding
    statement: >
      The matrix $A$ with rows $(2,1,0)$, $(1,3,1)$ and $(0,1,2)$ maps the unit
      cube to a parallelepiped. A candidate reports its volume as
      $\operatorname{tr} A = 7$. What is the correct volume?
    answer: >
      $8$. Volume is scaled by $|\det A|$, not by the trace — the trace is the
      sum of the diagonal, an invariant of a completely different kind.
      Expanding along the first row,
      $\det A = 2(3 \cdot 2 - 1 \cdot 1) - 1(1 \cdot 2 - 1 \cdot 0)
      + 0 = 2 \cdot 5 - 2 = 8$. Check by elimination, which must agree since
      adding a multiple of one row to another leaves the determinant alone:
      $R_2 \to R_2 - \tfrac{1}{2}R_1$ gives $(0, 2.5, 1)$, then
      $R_3 \to R_3 - \tfrac{2}{5}R_2$ gives $(0,0,1.6)$, and the product of
      the pivots is $2 \cdot 2.5 \cdot 1.6 = 8$. The unit cube has volume $1$,
      so the image has volume $8$; the sign is positive, so orientation is
      preserved as well.
    expects: "8"
    rubric:
      - >
        Uses $|\det A|$ as the volume factor and says why the trace is not it.
      - >
        Computes the $3 \times 3$ determinant by a method that can be checked
        a second way — cofactors and elimination agree at $8$.
    targets:
      - quant-tools.linear-algebra.determinant-trace

  - id: qlin-determinant-trace-02
    kind: work
    difficulty: standard
    statement: >
      $A$ has rows $(4,7)$ and $(2,-1)$, and $B = P^{-1}AP$ for some invertible
      $P$. What is $\operatorname{tr} B$?
    answer: >
      $3$. The trace is unchanged by a change of basis. The reason is
      $\operatorname{tr}(XY) = \operatorname{tr}(YX)$: taking
      $X = P^{-1}$ and $Y = AP$ gives
      $\operatorname{tr}(P^{-1}AP) = \operatorname{tr}(APP^{-1}) =
      \operatorname{tr}(A)$. So the answer is
      $\operatorname{tr} A = 4 + (-1) = 3$, whatever $P$ is — and no
      information about $P$ was needed, which is the point of calling the
      trace an invariant. The determinant is invariant here too, at
      $-4 - 14 = -18$, but the individual entries of $B$ are not.
    expects: "3"
    rubric:
      - >
        Cites $\operatorname{tr}(XY) = \operatorname{tr}(YX)$ rather than
        attempting to compute $B$.
      - >
        Adds the diagonal of $A$ correctly, including the negative entry.
    targets:
      - quant-tools.linear-algebra.determinant-trace

  # --- rules for determinants ------------------------------------------------

  - id: qlin-determinant-properties-01
    kind: work
    difficulty: demanding
    statement: >
      $A$ and $B$ are $3 \times 3$ with $\det A = 2$ and $\det B = -3$. What is
      $\det(2A^{T}B^{-1}A^{2})$?
    answer: >
      $-64/3 \approx -21.3333$. Take the rules one at a time. Scaling pulls
      out $c^{n}$ with $n = 3$, so the factor is $2^{3} = 8$ — not $2$, the
      single most common error here. Then determinants multiply across the
      product: $\det(A^{T}) = \det A = 2$;
      $\det(B^{-1}) = 1/\det B = -1/3$; and
      $\det(A^{2}) = (\det A)^{2} = 4$. Multiplying,
      $8 \cdot 2 \cdot (-1/3) \cdot 4 = -64/3$. The order of the factors never
      mattered, because determinants are scalars even though the matrices do
      not commute. Note that no rule was available for a sum — had the
      expression contained $A + B$, nothing could have been said.
    expects: "-64/3"
    tolerance: 0.0005
    rubric:
      - >
        Uses $\det(cA) = c^{n} \det A$ with $n = 3$, giving a factor of $8$.
      - >
        Handles $A^{T}$, $B^{-1}$ and $A^{2}$ with the right rule each — value
        unchanged, reciprocal, and square.
      - >
        Tracks the sign through the reciprocal of $-3$.
    targets:
      - quant-tools.linear-algebra.determinant-properties

  - id: qlin-determinant-properties-02
    kind: work
    difficulty: standard
    statement: >
      $A$ has rows $(3,5,2)$, $(0,-1,4)$ and $(0,0,6)$. What is
      $\det(A^{-1})$?
    answer: >
      $-1/18 \approx -0.0556$. The matrix is upper triangular, so its
      determinant is the product of the diagonal entries:
      $3 \cdot (-1) \cdot 6 = -18$. Since this is nonzero, $A$ is invertible,
      and $\det(A^{-1}) = 1/\det A = -1/18$. Nothing above the diagonal
      matters — the $5$, the $2$ and the $4$ never enter, which is exactly why
      elimination to triangular form is the practical algorithm. Reporting
      $-18$ answers a question that was not asked, and reporting $18$ loses
      the negative entry on the diagonal.
    expects: "-1/18"
    tolerance: 0.0005
    rubric:
      - >
        Reads the determinant off the diagonal, ignoring the entries above it.
      - >
        Inverts the result, and keeps the sign of the single negative pivot.
    targets:
      - quant-tools.linear-algebra.determinant-properties

  # --- invertibility ---------------------------------------------------------

  - id: qlin-invertibility-01
    kind: work
    difficulty: demanding
    statement: >
      For which value of $k$ is the matrix with rows $(1,2,3)$, $(2,5,7)$ and
      $(3,7,k)$ singular?
    answer: >
      $k = 10$. Singular means $\det = 0$, so compute the determinant with $k$
      carried along. Expanding along the first row,
      $\det = 1(5k - 49) - 2(2k - 21) + 3(14 - 15)
      = 5k - 49 - 4k + 42 - 3 = k - 10$, which vanishes exactly at $k = 10$.
      The structural check confirms it: at $k = 10$ the third row is
      $(3,7,10) = (1,2,3) + (2,5,7)$, the sum of the first two, so the rows
      are dependent and the rank drops to $2$. Every other equivalent
      condition then follows at once — the columns are dependent, $\ker$ is a
      line, and $Ax = b$ has either no solution or a one-parameter family, but
      never a unique one.
    expects: "10"
    rubric:
      - >
        Sets $\det = 0$ rather than testing some other condition numerically.
      - >
        Expands the $3 \times 3$ determinant with the sign pattern
        $+,-,+$ across the row.
      - >
        Verifies the answer by exhibiting the row dependence at $k = 10$.
    targets:
      - quant-tools.linear-algebra.invertibility

  - id: qlin-invertibility-02
    kind: decide
    difficulty: standard
    statement: >
      $A$ is a nonzero $3 \times 3$ real matrix with $A^{2} = 0$. Is $A$
      invertible?
    answer: >
      No. Determinants multiply, so
      $(\det A)^{2} = \det(A^{2}) = \det(0) = 0$, forcing $\det A = 0$ and
      hence singularity. A second route uses the equivalent conditions
      directly: if $A^{-1}$ existed then
      $A = A^{-1}(A^{2}) = A^{-1} \cdot 0 = 0$, contradicting $A \ne 0$. Such
      matrices exist — the one with rows $(0,1,0)$, $(0,0,0)$, $(0,0,0)$ is
      nonzero and squares to zero — so the hypothesis is not vacuous, and
      being nonzero is very far from being invertible.
    choices:
      - text: >
          Yes — a nonzero matrix has a nonzero determinant
        feedback: >
          Nonzero entries say nothing about the determinant; the matrix with
          rows $(1,1)$ and $(1,1)$ is nonzero and singular.
      - text: >
          No — $(\det A)^{2} = \det(A^{2}) = 0$, so $\det A = 0$
        correct: true
        feedback: >
          Multiplicativity of the determinant settles it in one line, and
          $A = A^{-1}A^{2} = 0$ gives the same contradiction.
      - text: >
          It depends on $A$ — some such matrices are invertible
        feedback: >
          None are. Invertibility would give $A = A^{-1}A^{2} = 0$, which the
          hypothesis $A \ne 0$ rules out.
    rubric:
      - >
        Argues from $\det(A^{2}) = (\det A)^{2}$, or from
        $A = A^{-1}A^{2}$, rather than from the entries.
      - >
        Does not treat "nonzero matrix" as implying "nonzero determinant".
    targets:
      - quant-tools.linear-algebra.invertibility

  # --- eigenvalues and eigenvectors ------------------------------------------

  - id: qlin-eigen-01
    kind: work
    difficulty: demanding
    statement: >
      A square matrix $A$ satisfies $Av = 3v$ for some $v \ne 0$. What is the
      eigenvalue of $2A^{2} - 5A + I$ belonging to the same $v$?
    answer: >
      $4$. Apply the matrix to $v$ term by term:
      $A^{2}v = A(Av) = A(3v) = 3(Av) = 9v$, so
      $(2A^{2} - 5A + I)v = 2(9v) - 5(3v) + v = (18 - 15 + 1)v = 4v$. In other
      words, for any polynomial $p$, $v$ is still an eigenvector of $p(A)$ and
      its eigenvalue is $p(3) = 2 \cdot 9 - 15 + 1 = 4$ — the eigenvector does
      not move, only the stretch factor is transformed. Two traps: the
      identity contributes $+1$, not $0$, and squaring the *matrix* squares
      the eigenvalue rather than doubling it, so $p(3) \ne 2 \cdot 3 - 5
      \cdot 3 + 1$.
    expects: "4"
    rubric:
      - >
        Uses $A^{2}v = \lambda^{2}v$, derived by applying $A$ twice rather
        than asserted.
      - >
        Evaluates the polynomial at $\lambda = 3$ including the constant term
        from $I$.
    targets:
      - quant-tools.linear-algebra.eigen

  - id: qlin-eigen-02
    kind: work
    difficulty: demanding
    statement: >
      $A$ is the $3 \times 3$ matrix with rows $(2,1,0)$, $(0,2,1)$ and
      $(0,0,2)$. What is the dimension of the eigenspace belonging to
      $\lambda = 2$?
    answer: >
      $1$. The matrix is upper triangular, so
      $\det(A - \lambda I) = (2-\lambda)^{3}$ and $\lambda = 2$ is the only
      eigenvalue, with algebraic multiplicity $3$. The eigenspace, however, is
      $\ker(A - 2I)$, and $A - 2I$ has rows $(0,1,0)$, $(0,0,1)$, $(0,0,0)$:
      solving forces $x_2 = 0$ and $x_3 = 0$ while leaving $x_1$ free, so the
      kernel is the line spanned by $(1,0,0)$ and the geometric multiplicity
      is $1$. This is the general bound $1 \le$ geometric $\le$ algebraic
      showing its lower end, and it is why this matrix cannot be
      diagonalized: three independent eigenvectors would be needed and only
      one direction exists.
    expects: "1"
    rubric:
      - >
        Distinguishes the algebraic multiplicity ($3$, from the characteristic
        polynomial) from the geometric one ($\dim \ker(A - 2I)$).
      - >
        Solves $(A - 2I)x = 0$ rather than reading the multiplicity off the
        diagonal.
    targets:
      - quant-tools.linear-algebra.eigen

  - id: qlin-eigen-03
    kind: work
    difficulty: standard
    statement: >
      $A$ has rows $(0,-4)$ and $(1,0)$. Its eigenvalues are purely imaginary,
      $\pm ci$ with $c > 0$. What is $c$?
    answer: >
      $2$. The characteristic polynomial is
      $\det(A - \lambda I) = (-\lambda)(-\lambda) - (-4)(1)
      = \lambda^{2} + 4$, whose roots are $\lambda = \pm 2i$, so $c = 2$. A
      real matrix can perfectly well have no real eigenvalue: this $A$ sends
      $(1,0)$ to $(0,1)$ and $(0,1)$ to $(-4,0)$, a rotation-like twist
      composed with a stretch, and it fixes no direction. The characteristic
      polynomial still has two roots over $\mathbb{C}$, conjugate to each
      other because the coefficients are real.
    expects: "2"
    rubric:
      - >
        Forms $\det(A - \lambda I)$ correctly, keeping the sign of the
        off-diagonal product.
      - >
        Accepts complex roots rather than concluding that no eigenvalue
        exists.
    targets:
      - quant-tools.linear-algebra.eigen

  # --- trace and determinant as the spectrum ---------------------------------

  - id: qlin-trace-det-eigen-01
    kind: work
    difficulty: demanding
    statement: >
      A $3 \times 3$ matrix $A$ has $\operatorname{tr} A = 6$,
      $\operatorname{tr}(A^{2}) = 14$ and $\det A = 6$. What is its largest
      eigenvalue?
    answer: >
      $3$. The three symmetric functions of the eigenvalues are all in reach.
      The trace gives $e_1 = \lambda_1 + \lambda_2 + \lambda_3 = 6$; the
      determinant gives $e_3 = \lambda_1\lambda_2\lambda_3 = 6$; and since the
      eigenvalues of $A^{2}$ are the squares of those of $A$,
      $\operatorname{tr}(A^{2}) = \sum_i \lambda_i^{2} = 14$, so
      $e_2 = \dfrac{e_1^{2} - \sum_i \lambda_i^{2}}{2}
      = \dfrac{36 - 14}{2} = 11$. The characteristic polynomial is therefore
      $\lambda^{3} - 6\lambda^{2} + 11\lambda - 6 = (\lambda-1)(\lambda-2)
      (\lambda-3)$, so the spectrum is $\{1,2,3\}$ and the largest eigenvalue
      is $3$. Check all three inputs: $1+2+3 = 6$, $1+4+9 = 14$,
      $1 \cdot 2 \cdot 3 = 6$.
    expects: "3"
    rubric:
      - >
        Reads $\operatorname{tr}(A^{2})$ as $\sum_i \lambda_i^{2}$, not as
        $(\operatorname{tr} A)^{2}$.
      - >
        Recovers the middle coefficient from
        $e_2 = (e_1^{2} - \sum \lambda_i^{2})/2$.
      - >
        Verifies the recovered spectrum against all three given quantities.
    targets:
      - quant-tools.linear-algebra.trace-det-eigen

  - id: qlin-trace-det-eigen-02
    kind: work
    difficulty: standard
    statement: >
      A $2 \times 2$ matrix has $\operatorname{tr} A = 5$ and
      $\det A = -14$. What is its smaller eigenvalue?
    answer: >
      $-2$. For $n = 2$ the characteristic polynomial is
      $\lambda^{2} - (\operatorname{tr} A)\lambda + \det A$, so
      $\lambda = \dfrac{\operatorname{tr} A}{2} \pm
      \sqrt{\left(\dfrac{\operatorname{tr} A}{2}\right)^{2} - \det A}
      = 2.5 \pm \sqrt{6.25 + 14} = 2.5 \pm 4.5$, giving $7$ and $-2$. No
      expansion of a matrix was needed, only the two invariants. Check:
      $7 + (-2) = 5$ matches the trace and $7 \cdot (-2) = -14$ matches the
      determinant. A negative determinant always means eigenvalues of opposite
      sign, so a negative answer was expected before any arithmetic.
    expects: "-2"
    rubric:
      - >
        Uses the trace/determinant formula rather than expanding
        $\det(A - \lambda I)$ from entries that were never given.
      - >
        Subtracts a negative determinant, so the discriminant grows rather
        than shrinks.
      - >
        Checks the pair against both the trace and the determinant.
    targets:
      - quant-tools.linear-algebra.trace-det-eigen

  # --- 2x2 eigenvalues in practice -------------------------------------------

  - id: qlin-eigen-2x2-01
    kind: work
    difficulty: demanding
    statement: >
      $A$ has rows $(1,6)$ and $(2,-3)$. What is $\det(A^{2} + 2A + 5I)$?
    answer: >
      $400$. Get the spectrum first: $\operatorname{tr} A = -2$ and
      $\det A = -3 - 12 = -15$, so
      $\lambda = -1 \pm \sqrt{1 + 15} = -1 \pm 4$, giving $3$ and $-5$. For
      any polynomial $p$ the eigenvalues of $p(A)$ are $p$ evaluated at the
      eigenvalues of $A$, and here $p(t) = t^{2} + 2t + 5$ gives
      $p(3) = 9 + 6 + 5 = 20$ and $p(-5) = 25 - 10 + 5 = 20$. The determinant
      is the product of the eigenvalues, so
      $\det(p(A)) = 20 \cdot 20 = 400$. Direct check:
      $A^{2}$ has rows $(13,-12)$ and $(-4,21)$, so $A^{2} + 2A + 5I$ has rows
      $(20,0)$ and $(0,20)$ — it really is $20I$, determinant $400$. The trap
      is $\det(A^{2} + 2A + 5I) \ne \det(A^{2}) + 2\det(A) + 5$; determinants
      do not add.
    expects: "400"
    rubric:
      - >
        Finds both eigenvalues from trace and determinant, not by expanding a
        characteristic polynomial from scratch.
      - >
        Maps them through the polynomial before multiplying, rather than
        splitting the determinant across the sum.
    targets:
      - quant-tools.linear-algebra.eigen-2x2
    exercises:
      - quant-tools.linear-algebra.trace-det-eigen

  - id: qlin-eigen-2x2-02
    kind: work
    difficulty: standard
    statement: >
      $A$ has rows $(8,-3)$ and $(2,1)$. What is its smaller eigenvalue?
    answer: >
      $2$. Trace and determinant are $\operatorname{tr} A = 8 + 1 = 9$ and
      $\det A = 8 \cdot 1 - (-3)(2) = 8 + 6 = 14$, so
      $\lambda = 4.5 \pm \sqrt{20.25 - 14} = 4.5 \pm 2.5$, that is $7$ and
      $2$. Confirm before moving on: $7 + 2 = 9$ and $7 \cdot 2 = 14$. The
      sign of the off-diagonal product is where this one is lost — the
      determinant is $8 + 6$, not $8 - 6$, and taking $2$ there would give
      the wrong pair $\{1, 8\}$ with the right trace.
    expects: "2"
    rubric:
      - >
        Computes $\det A = 8 + 6 = 14$, handling the negative off-diagonal
        entry.
      - >
        Verifies the pair against both trace and determinant.
    targets:
      - quant-tools.linear-algebra.eigen-2x2

  # --- dot product, norm, angle ----------------------------------------------

  - id: qlin-inner-product-01
    kind: work
    difficulty: demanding
    statement: >
      Two centred return series $x$ and $y$ in $\mathbb{R}^{n}$ satisfy
      $\lVert x \rVert = 5$, $\lVert y \rVert = 13$ and
      $\lVert x - y \rVert = 12$. What is the correlation between them — that
      is, $\cos\theta$?
    answer: >
      $5/13 \approx 0.3846$. Expand the one length that mixes the vectors:
      $\lVert x - y \rVert^{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2}
      - 2x^{T}y$, so $144 = 25 + 169 - 2x^{T}y$ and
      $x^{T}y = \dfrac{194 - 144}{2} = 25$. Then
      $\cos\theta = \dfrac{x^{T}y}{\lVert x \rVert \lVert y \rVert}
      = \dfrac{25}{65} = \dfrac{5}{13} \approx 0.3846$. Because the series are
      already centred, this cosine *is* the correlation coefficient. Sanity
      check with Cauchy–Schwarz: $|x^{T}y| = 25 \le 5 \cdot 13 = 65$, so the
      cosine lies in $[-1,1]$ as it must; and the three lengths satisfy the
      triangle inequality, $|13 - 5| \le 12 \le 18$, so the data are
      consistent.
    expects: "5/13"
    tolerance: 0.0005
    rubric:
      - >
        Recovers $x^{T}y$ by expanding $\lVert x - y \rVert^{2}$ rather than
        assuming orthogonality.
      - >
        Divides by the product of the norms, not by their sum or by
        $\lVert x - y \rVert$.
      - >
        Checks the result against Cauchy–Schwarz.
    targets:
      - quant-tools.linear-algebra.inner-product

  - id: qlin-inner-product-02
    kind: work
    difficulty: standard
    statement: >
      For which value of $t$ are $x = (2, t, 3)$ and $y = (4, -1, -2)$
      orthogonal?
    answer: >
      $t = 2$. Orthogonality means the dot product vanishes:
      $x^{T}y = 2 \cdot 4 + t(-1) + 3(-2) = 8 - t - 6 = 2 - t$, which is $0$
      exactly when $t = 2$. Check by substituting back:
      $(2,2,3) \cdot (4,-1,-2) = 8 - 2 - 6 = 0$. Note that orthogonality is a
      statement about the dot product alone — neither vector is a unit vector
      here, and normalising them would change the lengths but not the angle,
      so it would not change the answer.
    expects: "2"
    rubric:
      - >
        Sets the dot product to zero rather than matching the vectors
        entrywise.
      - >
        Keeps the signs of the negative components of $y$.
    targets:
      - quant-tools.linear-algebra.inner-product

  # --- orthogonal matrices ---------------------------------------------------

  - id: qlin-orthogonal-matrix-01
    kind: work
    difficulty: demanding
    statement: >
      $Q$ is an orthogonal matrix, and $x, y$ satisfy $\lVert x \rVert = 3$,
      $\lVert y \rVert = 4$ and $x^{T}y = -6$. What is
      $\lVert Q(x + 2y) \rVert^{2}$?
    answer: >
      $49$. An orthogonal $Q$ is an isometry — from $Q^{T}Q = I$,
      $\lVert Qv \rVert^{2} = (Qv)^{T}(Qv) = v^{T}Q^{T}Qv = v^{T}v
      = \lVert v \rVert^{2}$ — so $Q$ can simply be dropped:
      $\lVert Q(x + 2y) \rVert^{2} = \lVert x + 2y \rVert^{2}$. Expanding,
      $\lVert x \rVert^{2} + 4x^{T}y + 4\lVert y \rVert^{2}
      = 9 + 4(-6) + 4(16) = 9 - 24 + 64 = 49$. Two things to notice: the cross
      term carries a factor $4$, not $2$, because the $2$ multiplies $y$ on
      both sides; and no property of $Q$ beyond orthogonality was used, so the
      answer is the same for every rotation and every reflection. The data are
      consistent with Cauchy–Schwarz, $|-6| \le 3 \cdot 4$.
    expects: "49"
    rubric:
      - >
        Discards $Q$ by citing $\lVert Qv \rVert = \lVert v \rVert$, derived
        from $Q^{T}Q = I$.
      - >
        Expands $\lVert x + 2y \rVert^{2}$ with the cross term
        $2 \cdot 2 \, x^{T}y = 4x^{T}y$.
    targets:
      - quant-tools.linear-algebra.orthogonal-matrix

  - id: qlin-orthogonal-matrix-02
    kind: decide
    difficulty: standard
    statement: >
      Is the matrix $M$ with rows $(1,1)$ and $(1,-1)$ orthogonal?
    answer: >
      No. Its two columns, $(1,1)$ and $(1,-1)$, are indeed perpendicular, but
      each has length $\sqrt{2}$ rather than $1$, so
      $M^{T}M = 2I$ and not $I$. Orthogonal means *orthonormal* columns; the
      normalisation is half the condition and the half that is usually
      dropped. Scaling fixes it: $\tfrac{1}{\sqrt{2}}M$ is orthogonal, and it
      is the reflection with $\det = -1$. Consistently, $\det M = -2$, whereas
      an orthogonal matrix must have $\det = \pm 1$, and $M$ doubles squared
      lengths instead of preserving them.
    choices:
      - text: >
          Yes — its columns are perpendicular
        feedback: >
          Perpendicular is not enough. Each column must also have length $1$,
          and these have length $\sqrt{2}$.
      - text: >
          No — the columns are perpendicular but not unit, so
          $M^{T}M = 2I$
        correct: true
        feedback: >
          Orthogonality of the matrix means orthonormal columns; dividing by
          $\sqrt{2}$ repairs it.
      - text: >
          Yes — every symmetric matrix with entries $\pm 1$ is orthogonal
        feedback: >
          No such rule exists; $\det M = -2$ already contradicts
          $\det = \pm 1$.
      - text: >
          No — an orthogonal matrix cannot have negative entries
        feedback: >
          Plenty do; a rotation by $90$ degrees has an entry $-1$. The failure
          here is the scaling, not the sign.
    rubric:
      - >
        Tests $M^{T}M = I$, checking both perpendicularity and unit length.
      - >
        Identifies the repair — divide by $\sqrt{2}$ — rather than only
        rejecting the matrix.
    targets:
      - quant-tools.linear-algebra.orthogonal-matrix

  # --- the spectral theorem --------------------------------------------------

  - id: qlin-spectral-01
    kind: work
    difficulty: demanding
    statement: >
      A symmetric $2 \times 2$ matrix $A$ has eigenvalue $10$ with eigenvector
      $(2,1)$, and its other eigenvalue is $5$. What is the $(1,1)$ entry of
      $A$?
    answer: >
      $9$. Symmetry supplies the missing eigenvector: eigenvectors for
      distinct eigenvalues of a symmetric matrix are orthogonal, so the second
      one must be $(-1,2)$ up to scale. Normalising,
      $q_1 = (2,1)/\sqrt{5}$ and $q_2 = (-1,2)/\sqrt{5}$, and the spectral
      decomposition $A = 10\,q_1q_1^{T} + 5\,q_2q_2^{T}$ gives
      $\tfrac{10}{5}$ times rows $(4,2), (2,1)$ plus $\tfrac{5}{5}$ times rows
      $(1,-2), (-2,4)$ — that is, rows $(8,4), (4,2)$ plus rows
      $(1,-2), (-2,4)$, so $A$ has rows $(9,2)$ and $(2,6)$ and the $(1,1)$
      entry is $9$. Check: $\operatorname{tr} A = 15 = 10 + 5$ and
      $\det A = 54 - 4 = 50 = 10 \cdot 5$. A quicker route writes
      $A$ with rows $(a,b)$, $(b,d)$, imposes $A(2,1) = 10(2,1)$ and
      $a + d = 15$, and solves $2a + b = 20$, $2b + d = 10$ for $b = 2$,
      $a = 9$.
    expects: "9"
    rubric:
      - >
        Gets the second eigenvector from orthogonality, which is what symmetry
        buys, rather than treating it as unknown.
      - >
        Normalises the eigenvectors before forming
        $\sum_i \lambda_i q_iq_i^{T}$, or equivalently divides by
        $\lVert v \rVert^{2}$.
      - >
        Checks the reconstructed matrix against the trace and the
        determinant.
    targets:
      - quant-tools.linear-algebra.spectral

  - id: qlin-spectral-02
    kind: work
    difficulty: demanding
    statement: >
      $A$ is a real symmetric $3 \times 3$ matrix whose eigenvalues, listed
      with algebraic multiplicity, are $4$, $4$ and $-2$. What is
      $\dim \ker(A - 4I)$?
    answer: >
      $2$. For a general matrix the geometric multiplicity can be strictly
      smaller than the algebraic one — the shear with rows $(1,1)$ and
      $(0,1)$ has algebraic multiplicity $2$ at $\lambda = 1$ and a
      one-dimensional eigenspace. Symmetry removes that gap: the spectral
      theorem provides an orthonormal basis of $\mathbb{R}^{3}$ made of
      eigenvectors of $A$, so the eigenvectors for $\lambda = 4$ span a
      subspace of dimension equal to how often $4$ appears in $\Lambda$,
      namely $2$. Equivalently $A = Q\Lambda Q^{T}$ with
      $\Lambda = $ the diagonal $(4,4,-2)$, so $A - 4I = Q(\Lambda - 4I)Q^{T}$
      has rank $1$ and, by rank–nullity, a kernel of dimension $3 - 1 = 2$.
    expects: "2"
    rubric:
      - >
        Invokes symmetry, and does not assume geometric equals algebraic
        multiplicity in general.
      - >
        Reaches the dimension by an argument — a full eigenbasis, or
        rank–nullity applied to $A - 4I$ — rather than by assertion.
    targets:
      - quant-tools.linear-algebra.spectral

  - id: qlin-spectral-03
    kind: decide
    difficulty: standard
    statement: >
      Which of these real $2 \times 2$ matrices is guaranteed to have an
      orthonormal basis of eigenvectors of $\mathbb{R}^{2}$?
    answer: >
      The one with rows $(5,-2)$ and $(-2,5)$, because it is symmetric — that
      is exactly the hypothesis of the spectral theorem, and its eigenvalues
      are $3$ and $7$ with orthogonal eigenvectors $(1,1)$ and $(1,-1)$.
      Invertibility is irrelevant: rows $(2,5)$, $(1,3)$ is invertible with two
      distinct real eigenvalues, but it is not symmetric and its eigenvectors
      are not perpendicular. The rotation with
      rows $(0,-1)$ and $(1,0)$ has no real eigenvector at all, its
      eigenvalues being $\pm i$. Symmetry, not size or invertibility, is what
      buys the orthonormal eigenbasis.
    choices:
      - text: >
          Rows $(5,-2)$ and $(-2,5)$
        correct: true
        feedback: >
          Symmetric, so the spectral theorem applies: eigenvalues $7$ and $3$
          with orthogonal eigenvectors $(1,-1)$ and $(1,1)$.
      - text: >
          Rows $(2,5)$ and $(1,3)$
        feedback: >
          Invertible, with two distinct real eigenvalues — but not symmetric,
          so its eigenvectors are not perpendicular.
      - text: >
          Rows $(0,-1)$ and $(1,0)$
        feedback: >
          A quarter-turn: no real eigenvector exists, since its eigenvalues
          are $\pm i$.
      - text: >
          Rows $(3,1)$ and $(0,3)$
        feedback: >
          Triangular with a repeated eigenvalue $3$ and only a
          one-dimensional eigenspace — not diagonalizable at all.
    rubric:
      - >
        Selects on symmetry rather than on invertibility or on having real
        eigenvalues.
      - >
        Can say what fails in each of the others.
    targets:
      - quant-tools.linear-algebra.spectral

  # --- quadratic forms -------------------------------------------------------

  - id: qlin-quadratic-form-01
    kind: work
    difficulty: demanding
    statement: >
      Let $A$ have rows $(3,5)$ and $(-1,4)$ — note it is not symmetric — and
      let $q(x) = x^{T}Ax$. What is $q(2,1)$?
    answer: >
      $24$. Compute directly: $Ax = (3 \cdot 2 + 5 \cdot 1,\;
      -1 \cdot 2 + 4 \cdot 1) = (11, 2)$, so
      $x^{T}(Ax) = 2 \cdot 11 + 1 \cdot 2 = 24$. The instructive route is the
      symmetrisation. Only the symmetric part of $A$ affects the form, because
      $x^{T}Ax$ is a scalar and hence equals its own transpose
      $x^{T}A^{T}x$, so $x^{T}Ax = x^{T}\left(\tfrac{1}{2}(A + A^{T})\right)x$.
      Here $\tfrac{1}{2}(A + A^{T})$ has rows $(3,2)$ and $(2,4)$, giving
      $q(x) = 3x_1^{2} + 4x_1x_2 + 4x_2^{2}$ and
      $q(2,1) = 12 + 8 + 4 = 24$ — the same number. The off-diagonal entries
      $5$ and $-1$ never appear separately; only their average, $2$, does,
      which is why one always replaces $A$ by its symmetric part.
    expects: "24"
    rubric:
      - >
        Evaluates $x^{T}Ax$ correctly, either directly or through the
        symmetric part.
      - >
        Explains that only $\tfrac{1}{2}(A + A^{T})$ matters, rather than
        assuming $A$ was symmetric all along.
    targets:
      - quant-tools.linear-algebra.quadratic-form

  - id: qlin-quadratic-form-02
    kind: work
    difficulty: standard
    statement: >
      $A$ is symmetric with rows $(4,-3)$ and $(-3,2)$, and
      $q(x) = x^{T}Ax$. What is $q(1,2)$?
    answer: >
      $0$. With $A$ symmetric the coefficient of $x_1x_2$ is $2a_{12} = -6$,
      so $q(x) = 4x_1^{2} - 6x_1x_2 + 2x_2^{2}$ and
      $q(1,2) = 4 - 12 + 8 = 0$. Check the other way:
      $A(1,2) = (4 - 6,\; -3 + 4) = (-2, 1)$ and
      $(1,2) \cdot (-2,1) = -2 + 2 = 0$. A quadratic form vanishing at a
      nonzero vector is informative: $q$ is neither positive definite nor
      negative definite, and since $q(1,0) = 4 > 0$ while
      $\det A = 8 - 9 = -1 < 0$ forces one negative eigenvalue, the form is
      indefinite — $(1,2)$ is one of the two directions along the boundary
      between its positive and negative cones.
    expects: "0"
    rubric:
      - >
        Doubles the off-diagonal entry when writing the form out, giving
        $-6x_1x_2$.
      - >
        Recognises that vanishing at a nonzero $x$ rules out definiteness in
        either sign.
    targets:
      - quant-tools.linear-algebra.quadratic-form

  # --- positive semidefiniteness ---------------------------------------------

  - id: qlin-psd-01
    kind: work
    difficulty: demanding
    statement: >
      Two assets have variances $4$ and $9$ and covariance $c$, so their
      covariance matrix is symmetric with rows $(4,c)$ and $(c,9)$. What is
      the largest value of $c$ for which this matrix is positive
      semidefinite?
    answer: >
      $6$. For a symmetric $2 \times 2$ matrix, PSD is equivalent to a
      nonnegative trace and a nonnegative determinant — or, run through the
      eigenvalues, to $\lambda_{\min} \ge 0$. Here the diagonal is already
      positive, so the binding condition is
      $\det = 36 - c^{2} \ge 0$, that is $|c| \le 6$, and the largest
      admissible $c$ is $6$. Check at the boundary:
      $\operatorname{tr} = 13$ and $\det = 0$ give eigenvalues $13$ and $0$,
      so the matrix is PSD but singular — the combination $a = (3,-2)$ has
      variance $a^{T}\Sigma a = 9 \cdot 4 + 2(3)(-2)(6) + 4 \cdot 9
      = 36 - 72 + 36 = 0$, a riskless portfolio. The same bound in correlation
      terms is $\rho = c/\sqrt{4 \cdot 9} \le 1$: the two assets are then perfectly
      correlated, and any larger $c$ would make some portfolio's variance
      negative.
    expects: "6"
    rubric:
      - >
        Tests PSD through the determinant (or the eigenvalues), not through
        the diagonal entries alone.
      - >
        Recognises the boundary case as PSD-but-singular, and can name the
        zero-variance combination or the correlation $\rho = 1$.
    targets:
      - quant-tools.linear-algebra.psd

  - id: qlin-psd-02
    kind: work
    difficulty: demanding
    statement: >
      A candidate certifies the symmetric matrix $A$ with rows $(1,1,1)$,
      $(1,1,1)$ and $(1,1,0)$ as positive semidefinite because its leading
      principal minors are $1$, $0$ and $0$ — none of them negative. Evaluate
      $x^{T}Ax$ at $x = (0,1,-1)$.
    answer: >
      $-1$, so the matrix is not PSD and the certificate is worthless. With
      $x_1 = 0$ only the lower-right block contributes:
      $x^{T}Ax = a_{22}x_2^{2} + 2a_{23}x_2x_3 + a_{33}x_3^{2}
      = 1 \cdot 1 + 2 \cdot 1 \cdot 1 \cdot (-1) + 0 \cdot 1 = 1 - 2 = -1$.
      Confirm by matrix–vector product: $Ax = (0, 0, 1)$ and
      $x^{T}(Ax) = 0 + 0 + (-1)(1) = -1$. The error is a real one and worth
      naming: Sylvester's criterion characterizes positive *definiteness*, and
      only through *strict* positivity of the leading minors. For PSD the
      correct test asks every principal minor — not only the leading ones — to
      be $\ge 0$, and here the principal minor formed from rows and columns
      $\{2,3\}$ is $1 \cdot 0 - 1 \cdot 1 = -1 < 0$, which is precisely the
      $2$-dimensional slice the vector $(0,1,-1)$ exploits.
    expects: "-1"
    rubric:
      - >
        Evaluates the form correctly, doubling the off-diagonal contribution.
      - >
        States that nonnegative *leading* minors do not certify PSD, and
        names the failing principal minor or eigenvalue.
    targets:
      - quant-tools.linear-algebra.psd
    exercises:
      - quant-tools.linear-algebra.quadratic-form

  - id: qlin-psd-03
    kind: decide
    difficulty: standard
    statement: >
      $A$ is symmetric. Which condition certifies that $A$ is positive
      semidefinite?
    answer: >
      Every eigenvalue is $\ge 0$. By the spectral theorem
      $A = Q\Lambda Q^{T}$, so writing $y = Q^{T}x$ gives
      $x^{T}Ax = \sum_i \lambda_i y_i^{2}$, which is $\ge 0$ for all $x$
      exactly when no $\lambda_i$ is negative. The other candidates all fail:
      nonnegative leading principal minors do not suffice (rows $(0,0)$ and
      $(0,-1)$ have leading minors $0$ and $0$ yet $x^{T}Ax = -1$ at
      $x = (0,1)$); a nonnegative determinant and trace do not either, since
      an even number of negative eigenvalues leaves the determinant positive —
      the diagonal matrix with entries $-1, -1, 3$ has $\det = 3$ and
      $\operatorname{tr} = 1$ and is plainly not PSD; and nonnegative entries
      say nothing at all, as rows $(1,3)$ and $(3,1)$ show, with eigenvalues
      $4$ and $-2$.
    choices:
      - text: >
          All leading principal minors are $\ge 0$
        feedback: >
          That is Sylvester's criterion with the strict inequality dropped,
          and dropping it breaks it: rows $(0,0)$, $(0,-1)$ pass and are not
          PSD.
      - text: >
          All eigenvalues are $\ge 0$
        correct: true
        feedback: >
          Diagonalize: $x^{T}Ax = \sum_i \lambda_i y_i^{2}$, nonnegative for
          every $x$ precisely when every $\lambda_i$ is.
      - text: >
          $\det A \ge 0$ and $\operatorname{tr} A \ge 0$
        feedback: >
          An even number of negative eigenvalues keeps the determinant
          positive: the diagonal matrix with entries $-1, -1, 3$ has
          $\det = 3$ and $\operatorname{tr} = 1$, and is not PSD.
      - text: >
          Every entry of $A$ is $\ge 0$
        feedback: >
          Entrywise nonnegativity is unrelated: rows $(1,3)$ and $(3,1)$ have
          eigenvalues $4$ and $-2$.
    rubric:
      - >
        Chooses the eigenvalue test and can justify it by diagonalizing the
        form.
      - >
        Knows that Sylvester's minor test is a positive-definite criterion and
        does not survive relaxation to $\ge$.
    targets:
      - quant-tools.linear-algebra.psd

  # --- the Rayleigh quotient -------------------------------------------------

  - id: qlin-rayleigh-quotient-01
    kind: work
    difficulty: demanding
    statement: >
      $A$ is symmetric with rows $(11,2)$ and $(2,14)$. What is the maximum of
      $x^{T}Ax$ subject to $\lVert x \rVert = 3$?
    answer: >
      $135$. The Rayleigh bound is stated for the *quotient*:
      $x^{T}Ax/x^{T}x \le \lambda_{\max}$, with equality at the top
      eigenvector. Here $\operatorname{tr} A = 25$ and
      $\det A = 154 - 4 = 150$, so
      $\lambda = 12.5 \pm \sqrt{156.25 - 150} = 12.5 \pm 2.5$, giving
      $\lambda_{\max} = 15$ and $\lambda_{\min} = 10$. On the sphere of radius
      $3$, $x^{T}x = 9$, and the form is homogeneous of degree two, so
      $x^{T}Ax = 9 \cdot \dfrac{x^{T}Ax}{x^{T}x} \le 9\lambda_{\max} = 135$,
      attained at $3$ times the unit eigenvector for $15$. Answering $15$
      forgets the radius; the constraint is not $\lVert x \rVert = 1$.
    expects: "135"
    rubric:
      - >
        Finds $\lambda_{\max}$ from trace and determinant.
      - >
        Scales by $\lVert x \rVert^{2} = 9$, using that the form is
        homogeneous of degree two.
    targets:
      - quant-tools.linear-algebra.rayleigh-quotient

  - id: qlin-rayleigh-quotient-02
    kind: work
    difficulty: standard
    statement: >
      $A$ is symmetric with rows $(11,2)$ and $(2,14)$, whose eigenvalues are
      $10$ and $15$. What is the Rayleigh quotient
      $x^{T}Ax/x^{T}x$ at $x = (2,1)$?
    answer: >
      $13.2$. The numerator is
      $x^{T}Ax = 11 \cdot 2^{2} + 2 \cdot 2 \cdot 2 \cdot 1 + 14 \cdot 1^{2}
      = 44 + 8 + 14 = 66$, remembering that the off-diagonal entry enters
      twice, and the denominator is $x^{T}x = 4 + 1 = 5$. The quotient is
      $66/5 = 13.2$. The check that costs nothing: it must lie in
      $[\lambda_{\min}, \lambda_{\max}] = [10, 15]$, and it does. It is not an
      endpoint because $(2,1)$ is not an eigenvector — the quotient is a
      weighted average of $10$ and $15$, with the weights given by the squared
      coordinates of $x$ in the eigenbasis.
    expects: "13.2"
    rubric:
      - >
        Doubles the off-diagonal term in the numerator.
      - >
        Divides by $x^{T}x$ rather than by $\lVert x \rVert$, and checks the
        answer against $[\lambda_{\min}, \lambda_{\max}]$.
    targets:
      - quant-tools.linear-algebra.rayleigh-quotient

  # --- covariance matrices ---------------------------------------------------

  - id: qlin-covariance-psd-01
    kind: work
    difficulty: demanding
    statement: >
      Two uncorrelated assets have variances $1$ and $4$. A portfolio puts
      weight $w$ on the first and $1-w$ on the second, with $w$ unrestricted.
      What is the smallest variance the portfolio can have?
    answer: >
      $0.8$. The portfolio variance is the quadratic form $a^{T}\Sigma a$ with
      $a = (w, 1-w)$ and $\Sigma$ the diagonal matrix with entries $1$ and
      $4$, so it equals $w^{2} + 4(1-w)^{2} = 5w^{2} - 8w + 4$. This is a
      parabola opening upwards, minimized at $w = 8/10 = 0.8$, where the value
      is $4 - \dfrac{8^{2}}{4 \cdot 5} = 4 - 3.2 = 0.8$. Check directly:
      $0.8^{2} \cdot 1 + 0.2^{2} \cdot 4 = 0.64 + 0.16 = 0.8$. Two readings
      worth keeping. First, the minimum is strictly below the smaller
      individual variance of $1$ — that is diversification, and it is exactly
      the reciprocal-sum formula
      $1/(1/\sigma_1^{2} + 1/\sigma_2^{2})
      = \sigma_1^{2}\sigma_2^{2}/(\sigma_1^{2} + \sigma_2^{2}) = 4/5$ for
      uncorrelated assets — half the harmonic mean of the two variances.
      Second, the minimum is positive, as it must be:
      $\Sigma$ is PSD, so no weighting can ever produce a negative variance,
      and only a zero eigenvalue could produce a riskless one.
    expects: "0.8"
    rubric:
      - >
        Writes the portfolio variance as $a^{T}\Sigma a$ and drops the
        covariance term because the assets are uncorrelated.
      - >
        Minimizes the resulting quadratic in $w$ rather than assuming equal
        weights.
      - >
        Notes that the answer must be nonnegative because $\Sigma$ is PSD.
    targets:
      - quant-tools.linear-algebra.covariance-psd

  - id: qlin-covariance-psd-02
    kind: work
    difficulty: standard
    statement: >
      $X$ and $Y$ have covariance matrix $\Sigma$ with rows $(9,-6)$ and
      $(-6,16)$. What is $\operatorname{Var}(X - Y)$?
    answer: >
      $37$. The variance of a linear combination is the quadratic form in its
      weights: with $a = (1,-1)$,
      $\operatorname{Var}(X - Y) = a^{T}\Sigma a
      = 9 + 16 - 2(-6) = 25 + 12 = 37$. The covariance is negative, so
      differencing the two series *adds* risk rather than cancelling it:
      $\operatorname{Var}(X - Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)
      - 2\operatorname{Cov}(X,Y)$, and with $\operatorname{Cov}(X,Y) = -6$ that
      last term contributes $+12$. As a check on the data,
      $\rho = -6/\sqrt{9 \cdot 16} = -0.5$ lies in $[-1,1]$, so $\Sigma$ is a
      legitimate PSD covariance matrix, and indeed $37 \ge 0$ as any variance
      must be.
    expects: "37"
    rubric:
      - >
        Uses $a^{T}\Sigma a$ with $a = (1,-1)$ rather than adding the
        variances alone.
      - >
        Gets the sign of the cross term right — a negative covariance
        increases $\operatorname{Var}(X-Y)$.
    targets:
      - quant-tools.linear-algebra.covariance-psd

  # --- what correlations are possible ----------------------------------------

  - id: qlin-correlation-matrix-bound-01
    kind: work
    difficulty: demanding
    statement: >
      Assets $1$, $2$ and $3$ satisfy $\rho_{12} = \rho_{13} = 0.8$. What is
      the smallest value $\rho_{23}$ can take?
    answer: >
      $0.28$. A correlation matrix must be PSD, and for a $3 \times 3$ one
      with unit diagonal that reduces to
      $1 + 2\rho_{12}\rho_{13}\rho_{23} - \rho_{12}^{2} - \rho_{13}^{2}
      - \rho_{23}^{2} \ge 0$. Writing $r = \rho_{23}$ and substituting
      $0.8$ twice gives
      $1 + 1.28r - 0.64 - 0.64 - r^{2} \ge 0$, i.e.
      $r^{2} - 1.28r + 0.28 \le 0$. The roots are
      $\dfrac{1.28 \pm \sqrt{1.6384 - 1.12}}{2}
      = \dfrac{1.28 \pm 0.72}{2}$, that is $0.28$ and $1$, so
      $r \in [0.28, 1]$ and the minimum is $0.28$. The closed form confirms
      it: $\rho_{23} \ge \rho_{12}\rho_{13}
      - \sqrt{(1-\rho_{12}^{2})(1-\rho_{13}^{2})}
      = 0.64 - \sqrt{0.36 \cdot 0.36} = 0.64 - 0.36 = 0.28$. The intuition is
      the one that makes this an interview favourite: if $2$ and $3$ each move
      closely with $1$, they cannot move against each other, so $-1$ was never
      available.
    expects: "0.28"
    rubric:
      - >
        Imposes PSD on the whole $3 \times 3$ matrix rather than checking the
        pairs one at a time.
      - >
        Solves the resulting quadratic inequality and keeps the interval, not
        just one root.
      - >
        Sanity-checks that the bound is above $-1$ and explains why.
    targets:
      - quant-tools.linear-algebra.correlation-matrix-bound

  - id: qlin-correlation-matrix-bound-02
    kind: work
    difficulty: standard
    statement: >
      Ten assets are equicorrelated: every pairwise correlation equals the
      same $\rho$. What is the smallest value $\rho$ can take?
    answer: >
      $-1/9 \approx -0.1111$. The equicorrelated matrix is
      $(1-\rho)I + \rho J$ with $J$ all ones, so its eigenvalues are
      $1 + (n-1)\rho$ once — on the all-ones vector, where $J$ acts as
      multiplication by $n$ — and $1 - \rho$ with multiplicity $n-1$. PSD
      needs both to be nonnegative, giving
      $-\dfrac{1}{n-1} \le \rho \le 1$. With $n = 10$ the floor is
      $-1/9$. Check at the boundary: $1 + 9(-1/9) = 0$, so the matrix is
      singular there — the equally weighted portfolio has zero variance, which
      is the extreme case rather than an impossible one. The bound tightens as
      $n$ grows: many assets simply cannot all disagree with one another.
    expects: "-1/9"
    tolerance: 0.0005
    rubric:
      - >
        Uses the two eigenvalues $1 + (n-1)\rho$ and $1 - \rho$ of the
        equicorrelated matrix.
      - >
        Substitutes $n = 10$, so the floor is $-1/9$ rather than $-1/10$.
    targets:
      - quant-tools.linear-algebra.correlation-matrix-bound

  # --- projection and the normal equations -----------------------------------

  - id: qlin-projection-01
    kind: work
    difficulty: demanding
    statement: >
      Let $V$ be the plane in $\mathbb{R}^{3}$ spanned by $(1,1,0)$ and
      $(0,1,1)$, and let $b = (3,1,5)$. What is the squared distance from $b$
      to $V$, that is $\lVert b - \hat{b} \rVert^{2}$ for the orthogonal
      projection $\hat{b}$?
    answer: >
      $49/3 \approx 16.3333$. Take $A$ with those two vectors as columns. Then
      $A^{T}A$ has rows $(2,1)$ and $(1,2)$, and
      $A^{T}b = (3+1,\; 1+5) = (4,6)$. The normal equations
      $2x_1 + x_2 = 4$, $x_1 + 2x_2 = 6$ give $x_1 = 2/3$ and $x_2 = 8/3$, so
      $\hat{b} = \tfrac{2}{3}(1,1,0) + \tfrac{8}{3}(0,1,1)
      = (2/3,\, 10/3,\, 8/3)$ and the residual is
      $b - \hat{b} = (7/3,\, -7/3,\, 7/3)$. Its squared length is
      $3 \cdot (7/3)^{2} = 49/3$. Two checks, both cheap. Orthogonality: the
      residual dots to $7/3 - 7/3 = 0$ against $(1,1,0)$ and to
      $-7/3 + 7/3 = 0$ against $(0,1,1)$, which is the defining property of
      the projection. Pythagoras: $\lVert b \rVert^{2} = 35$ and
      $\lVert \hat{b} \rVert^{2} = (4 + 100 + 64)/9 = 56/3$, and
      $56/3 + 49/3 = 35$.
    expects: "49/3"
    tolerance: 0.0005
    rubric:
      - >
        Solves $A^{T}A\hat{x} = A^{T}b$ rather than projecting onto the two
        spanning vectors separately — they are not orthogonal.
      - >
        Verifies that the residual is orthogonal to both spanning vectors.
      - >
        Reports the squared distance, and can confirm it by Pythagoras
        against $\lVert b \rVert^{2}$.
    targets:
      - quant-tools.linear-algebra.projection
    exercises:
      - quant-tools.linear-algebra.inner-product

  - id: qlin-projection-02
    kind: work
    difficulty: demanding
    statement: >
      A regression uses an $8 \times 3$ design matrix $A$ with linearly
      independent columns, and $P = A(A^{T}A)^{-1}A^{T}$ is the projector onto
      its column space. What is $\operatorname{tr}(I - P)$, with $I$ the
      $8 \times 8$ identity?
    answer: >
      $5$. A projector has $P^{2} = P$, so every eigenvalue satisfies
      $\lambda^{2} = \lambda$ and is $0$ or $1$; since $P$ is also symmetric it
      is diagonalizable, and the eigenvalue $1$ occurs exactly
      $\dim V = \operatorname{rank}(A) = 3$ times — the columns are
      independent, so they span a $3$-dimensional space. Hence
      $\operatorname{tr} P = 3$ and, by linearity of the trace,
      $\operatorname{tr}(I - P) = 8 - 3 = 5$. There is a shortcut worth
      knowing: $\operatorname{tr}(A(A^{T}A)^{-1}A^{T})
      = \operatorname{tr}((A^{T}A)^{-1}A^{T}A) = \operatorname{tr}(I_3) = 3$
      using $\operatorname{tr}(XY) = \operatorname{tr}(YX)$, which never forms
      $P$ at all. Statistically this $5$ is the residual degrees of freedom,
      $n - k$: eight observations, three fitted coefficients.
    expects: "5"
    rubric:
      - >
        Uses $\operatorname{tr} P = \dim V$, justified by $P$ having only the
        eigenvalues $0$ and $1$ (or by the cyclic trace identity).
      - >
        Takes $\dim V = 3$ from the independence of the columns, not $8$.
    targets:
      - quant-tools.linear-algebra.projection

  - id: qlin-projection-03
    kind: work
    difficulty: standard
    statement: >
      Project $b = (6,2)$ onto the line spanned by $a = (3,4)$. What is
      $\lVert \hat{b} \rVert$?
    answer: >
      $5.2$. For a single spanning vector the normal equations collapse to one
      scalar equation: $\hat{x} = \dfrac{a^{T}b}{a^{T}a}
      = \dfrac{18 + 8}{9 + 16} = \dfrac{26}{25}$, so
      $\hat{b} = \tfrac{26}{25}(3,4)$ and
      $\lVert \hat{b} \rVert = \tfrac{26}{25}\lVert a \rVert
      = \tfrac{26}{25} \cdot 5 = \tfrac{26}{5} = 5.2$. Check the residual:
      $b - \hat{b} = (72/25,\, -54/25)$, and its dot product with $a$ is
      $(216 - 216)/25 = 0$, so the projection is right. Note
      $5.2 \le \lVert b \rVert = \sqrt{40} \approx 6.32$, as a projection can
      only shorten.
    expects: "5.2"
    rubric:
      - >
        Divides by $a^{T}a$, not by $\lVert a \rVert$, when computing
        $\hat{x}$.
      - >
        Checks that the residual is orthogonal to $a$, or that
        $\lVert \hat{b} \rVert \le \lVert b \rVert$.
    targets:
      - quant-tools.linear-algebra.projection

  # --- least squares in coordinates ------------------------------------------

  - id: qlin-least-squares-fit-01
    kind: work
    difficulty: demanding
    statement: >
      Fit $y = a + bx$ by least squares to the four points $(1,2)$, $(2,2)$,
      $(3,5)$ and $(4,7)$. What is the minimized sum of squared residuals?
    answer: >
      $1.8$. The normal equations need four sums: $n = 4$,
      $\sum x_i = 10$, $\sum y_i = 16$, $\sum x_i^{2} = 30$ and
      $\sum x_iy_i = 2 + 4 + 15 + 28 = 49$. Then
      $b = \dfrac{n\sum x_iy_i - \sum x_i \sum y_i}{n\sum x_i^{2}
      - (\sum x_i)^{2}} = \dfrac{196 - 160}{120 - 100} = \dfrac{36}{20}
      = 1.8$ and $a = \dfrac{16 - 1.8 \cdot 10}{4} = -0.5$. The fitted values
      are $1.3$, $3.1$, $4.9$, $6.7$, so the residuals are $0.7$, $-1.1$,
      $0.1$, $0.3$ and the sum of their squares is
      $0.49 + 1.21 + 0.01 + 0.09 = 1.8$. Check the projection property before
      trusting it: the residual must be orthogonal to both columns of the
      design matrix, and indeed the residuals sum to
      $0.7 - 1.1 + 0.1 + 0.3 = 0$ (the intercept column) and
      $1(0.7) + 2(-1.1) + 3(0.1) + 4(0.3) = 0$ (the $x$ column).
    expects: "1.8"
    rubric:
      - >
        Solves the two normal equations for both $a$ and $b$, not the slope
        alone.
      - >
        Squares the residuals and adds, rather than reporting their sum or
        their absolute values.
      - >
        Verifies orthogonality: the residuals sum to zero and are orthogonal
        to the $x$ column.
    targets:
      - quant-tools.linear-algebra.least-squares-fit

  - id: qlin-least-squares-fit-02
    kind: work
    difficulty: standard
    statement: >
      Fit $y = a + bx$ by least squares to the three points $(1,1)$, $(2,3)$
      and $(3,4)$. What is the slope $b$?
    answer: >
      $1.5$. With $n = 3$, $\sum x_i = 6$, $\sum y_i = 8$,
      $\sum x_i^{2} = 14$ and $\sum x_iy_i = 1 + 6 + 12 = 19$, the normal
      equations are $3a + 6b = 8$ and $6a + 14b = 19$. Doubling the first and
      subtracting gives $2b = 3$, so $b = 1.5$, and then
      $a = (8 - 9)/3 = -1/3$. The fitted values are $7/6$, $8/3$, $25/6$ and
      the residuals are $-1/6$, $1/3$, $-1/6$, which sum to $0$ and satisfy
      $1(-1/6) + 2(1/3) + 3(-1/6) = 0$ — the orthogonality that says this
      really is the projection and not merely a plausible line.
    expects: "1.5"
    rubric:
      - >
        Forms $A^{T}A$ and $A^{T}y$ from the four sums, keeping $n$ in the
        top-left entry.
      - >
        Checks the residuals sum to zero, which the intercept column forces.
    targets:
      - quant-tools.linear-algebra.least-squares-fit

  # --- principal components --------------------------------------------------

  - id: qlin-pca-01
    kind: work
    difficulty: demanding
    statement: >
      Three assets have the covariance matrix $\Sigma$ with rows $(2,1,1)$,
      $(1,2,1)$ and $(1,1,2)$. What fraction of the total variance does the
      first principal component explain?
    answer: >
      $2/3 \approx 0.6667$. Recognise the structure: $\Sigma = I + J$ with $J$
      the all-ones matrix. $J$ has eigenvalue $3$ on the all-ones vector and
      $0$ on the plane orthogonal to it, so $\Sigma$ has eigenvalues
      $1 + 3 = 4$ once and $1 + 0 = 1$ twice. The total variance is
      $\operatorname{tr}\Sigma = 6$, which matches $4 + 1 + 1$, and the share
      carried by the leading component is
      $\lambda_1/\operatorname{tr}\Sigma = 4/6 = 2/3$. The first principal
      direction is $q_1 = (1,1,1)/\sqrt{3}$, the equally weighted portfolio —
      with everything positively correlated, the common market move is the
      dominant source of variance. Note the two remaining eigenvalues are
      tied, so those directions are not determined individually: any
      orthonormal pair spanning the plane orthogonal to $(1,1,1)$ serves.
    expects: "2/3"
    tolerance: 0.0005
    rubric:
      - >
        Gets the spectrum $\{4,1,1\}$, by the $I + J$ structure or by solving
        the characteristic equation.
      - >
        Divides by $\operatorname{tr}\Sigma$, the total variance, not by the
        number of assets.
      - >
        Notices that the tie among the two smaller eigenvalues leaves those
        directions undetermined.
    targets:
      - quant-tools.linear-algebra.pca

  - id: qlin-pca-02
    kind: work
    difficulty: standard
    statement: >
      A covariance matrix $\Sigma$ has rows $(13,6)$ and $(6,4)$. What is the
      variance of the first principal component score?
    answer: >
      $16$. The variance of the $k$-th component score is $\lambda_k$, so the
      question asks for $\lambda_{\max}$. From $\operatorname{tr}\Sigma = 17$
      and $\det\Sigma = 52 - 36 = 16$,
      $\lambda = 8.5 \pm \sqrt{72.25 - 16} = 8.5 \pm 7.5$, giving $16$ and
      $1$. Both are positive, as a PSD matrix requires, and they sum to the
      trace. The first component therefore carries $16/17 \approx 94.1\%$ of
      the total variance — two assets this closely aligned are nearly a single
      risk factor. The leading direction solves $(\Sigma - 16I)q = 0$, whose
      rows are $(-3,6)$ and $(6,-12)$, so $q_1$ points along $(2,1)$.
    expects: "16"
    rubric:
      - >
        Identifies the score variance with the eigenvalue, not with a diagonal
        entry of $\Sigma$.
      - >
        Checks the eigenvalue pair against the trace and determinant.
    targets:
      - quant-tools.linear-algebra.pca

  # --- powers by diagonalization ---------------------------------------------

  - id: qlin-diagonalization-powers-01
    kind: work
    difficulty: demanding
    statement: >
      A market alternates between a calm and a stressed regime. Writing the
      state as a row vector of probabilities and updating by right
      multiplication with the transition matrix $P$ whose rows are
      $(0.9, 0.1)$ and $(0.4, 0.6)$, what is the long-run probability of the
      calm regime?
    answer: >
      $0.8$. Long-run behaviour is the dominant eigendirection.
      $\operatorname{tr}P = 1.5$ and $\det P = 0.54 - 0.04 = 0.5$, so
      $\lambda^{2} - 1.5\lambda + 0.5 = 0$ and the eigenvalues are $1$ and
      $0.5$ — a stochastic matrix always has the eigenvalue $1$, and here the
      other has modulus below $1$, so $0.5^{k} \to 0$ and $P^{k}$ converges to
      the rank-one matrix whose rows are both the stationary distribution.
      That distribution is the left eigenvector for $\lambda = 1$: solving
      $\pi P = \pi$ gives $\pi_1 = 0.9\pi_1 + 0.4\pi_2$, i.e.
      $0.1\pi_1 = 0.4\pi_2$, so $\pi_1 = 4\pi_2$, and normalising
      $\pi_1 + \pi_2 = 1$ yields $\pi = (0.8, 0.2)$. Check by applying $P$:
      $(0.8)(0.9) + (0.2)(0.4) = 0.72 + 0.08 = 0.8$, unchanged. The common
      error is to solve $P\pi = \pi$ with $\pi$ a *column* — that gives
      $(1,1)$, which carries no information at all.
    expects: "0.8"
    rubric:
      - >
        Solves the left eigenvector equation $\pi P = \pi$, matching the
        row-vector convention stated.
      - >
        Normalises the eigenvector so its entries sum to $1$.
      - >
        Justifies convergence by the second eigenvalue having modulus below
        $1$.
    targets:
      - quant-tools.linear-algebra.diagonalization-powers

  - id: qlin-diagonalization-powers-02
    kind: work
    difficulty: standard
    statement: >
      $A$ is a $2 \times 2$ matrix with eigenvalue $3$ for the eigenvector
      $(1,1)$ and eigenvalue $-2$ for the eigenvector $(1,-1)$. What is the
      $(1,1)$ entry of $A^{3}$?
    answer: >
      $9.5$. Two independent eigenvectors mean $A = PDP^{-1}$ with $P$ having
      columns $(1,1)$ and $(1,-1)$ and $D$ the diagonal $(3,-2)$, and the
      inner factors telescope: $A^{3} = PD^{3}P^{-1}$ with
      $D^{3}$ the diagonal $(27,-8)$. Since $P^{-1}
      = \tfrac{1}{2}$ times rows $(1,1)$ and $(1,-1)$, the spectral form
      $A^{3} = 27\,q_1q_1^{T} + (-8)\,q_2q_2^{T}$ with normalised
      $q_i$ gives $\tfrac{27}{2}$ times rows $(1,1), (1,1)$ minus $\tfrac{8}{2}$
      times rows $(1,-1), (-1,1)$, so $A^{3}$ has rows $(9.5, 17.5)$ and
      $(17.5, 9.5)$. Check: $\operatorname{tr}(A^{3}) = 19 = 27 - 8$, and
      $\det(A^{3}) = 90.25 - 306.25 = -216 = (3 \cdot -2)^{3}$. Cubing the
      entries of $A$ — which has rows $(0.5, 2.5)$ and $(2.5, 0.5)$ — would
      give $0.125$, and is wrong: powers act on eigenvalues, not on entries.
    expects: "9.5"
    rubric:
      - >
        Raises the eigenvalues to the third power and conjugates back, rather
        than cubing entries.
      - >
        Keeps the sign of $(-2)^{3} = -8$.
      - >
        Checks the result against $\operatorname{tr}(A^{3}) = \sum
        \lambda_i^{3}$.
    targets:
      - quant-tools.linear-algebra.diagonalization-powers

  # --- recurrences as matrix powers ------------------------------------------

  - id: qlin-fibonacci-matrix-01
    kind: work
    difficulty: demanding
    statement: >
      A sequence satisfies $a_{n+1} = 3a_n - 2a_{n-1}$ with $a_0 = 1$ and
      $a_1 = 4$. What is $a_5$?
    answer: >
      $94$. The recurrence is the matrix $A$ with rows $(3,-2)$ and $(1,0)$
      acting on $(a_n, a_{n-1})$, exactly as the Fibonacci matrix acts on
      consecutive Fibonacci numbers. Its trace is $3$ and its determinant is
      $2$, so $\lambda^{2} - 3\lambda + 2 = 0$ and the eigenvalues are $1$ and
      $2$ — distinct, so $A$ is diagonalizable and
      $a_n = \alpha \cdot 1^{n} + \beta \cdot 2^{n}$. Matching the initial
      values, $\alpha + \beta = 1$ and $\alpha + 2\beta = 4$ give
      $\beta = 3$, $\alpha = -2$, so $a_n = 3 \cdot 2^{n} - 2$ and
      $a_5 = 96 - 2 = 94$. Verify by iterating the recurrence itself:
      $a_2 = 12 - 2 = 10$, $a_3 = 30 - 8 = 22$, $a_4 = 66 - 20 = 46$,
      $a_5 = 138 - 44 = 94$. The growth rate is the dominant eigenvalue $2$,
      which is what the closed form makes visible and the recurrence does not.
    expects: "94"
    rubric:
      - >
        Builds the companion matrix (or the characteristic equation
        $\lambda^{2} = 3\lambda - 2$) rather than only iterating.
      - >
        Fits both constants to $a_0$ and $a_1$, not to $a_1$ alone.
      - >
        Confirms the closed form against a few iterated terms.
    targets:
      - quant-tools.linear-algebra.fibonacci-matrix

  - id: qlin-fibonacci-matrix-02
    kind: work
    difficulty: standard
    statement: >
      Using $F_0 = 0$ and $F_1 = 1$, what is $F_{10}F_8 - F_9^{2}$?
    answer: >
      $-1$. This is Cassini's identity
      $F_{n+1}F_{n-1} - F_n^{2} = (-1)^{n}$ at $n = 9$, and $9$ is odd, so the
      value is $-1$. It comes from taking determinants in
      $A^{n}$, where $A$ has rows $(1,1)$ and $(1,0)$: since $A^{n}$ has rows
      $(F_{n+1}, F_n)$ and $(F_n, F_{n-1})$, its determinant is
      $F_{n+1}F_{n-1} - F_n^{2}$, and determinants multiply, so it equals
      $(\det A)^{n} = (-1)^{n}$. Direct check with
      $F_8 = 21$, $F_9 = 34$, $F_{10} = 55$:
      $55 \cdot 21 - 34^{2} = 1155 - 1156 = -1$. The sign is the whole
      question — reporting $+1$ means the parity of $n$ was not tracked.
    expects: "-1"
    rubric:
      - >
        Identifies $n = 9$, so the sign is $(-1)^{9} = -1$.
      - >
        Can derive the identity from $\det(A^{n}) = (\det A)^{n}$, or verifies
        it against the actual Fibonacci values.
    targets:
      - quant-tools.linear-algebra.fibonacci-matrix

  # --- square roots and Cholesky ---------------------------------------------

  - id: qlin-matrix-square-root-01
    kind: work
    difficulty: demanding
    statement: >
      $A$ is symmetric with rows $(10,6)$ and $(6,10)$. What is the $(1,1)$
      entry of its unique positive semidefinite square root $A^{1/2}$?
    answer: >
      $3$. Diagonalize first: $\operatorname{tr}A = 20$ and
      $\det A = 100 - 36 = 64$, so $\lambda = 10 \pm 6$, giving $16$ and $4$,
      both positive, so $A$ is PD and the PSD square root exists and is
      unique. The eigenvectors are $(1,1)$ and $(1,-1)$, orthogonal as
      symmetry guarantees, so with $q_1 = (1,1)/\sqrt{2}$ and
      $q_2 = (1,-1)/\sqrt{2}$,
      $A^{1/2} = \sqrt{16}\,q_1q_1^{T} + \sqrt{4}\,q_2q_2^{T}
      = 2$ times rows $(1,1),(1,1)$ plus $1$ times rows $(1,-1),(-1,1)$, that
      is rows $(3,1)$ and $(1,3)$. Check by squaring: rows $(3,1)$, $(1,3)$
      squared gives rows $(9+1,\, 3+3) = (10,6)$ and $(6,10)$ — the original
      matrix. So the $(1,1)$ entry is $3$. This is not the Cholesky factor,
      which is lower triangular with $L_{11} = \sqrt{10} \approx 3.162$: both
      satisfy a factorization of $A$, but only the symmetric one deserves the
      name square root.
    expects: "3"
    rubric:
      - >
        Takes nonnegative square roots of the eigenvalues and conjugates back
        with the orthonormal eigenvectors.
      - >
        Verifies $A^{1/2}A^{1/2} = A$ rather than stopping at the
        construction.
      - >
        Distinguishes the symmetric square root from the Cholesky factor.
    targets:
      - quant-tools.linear-algebra.matrix-square-root
    exercises:
      - quant-tools.linear-algebra.spectral

  - id: qlin-matrix-square-root-02
    kind: work
    difficulty: standard
    statement: >
      A covariance matrix has rows $(9,3)$ and $(3,5)$. In its Cholesky
      factorization $A = LL^{T}$ with $L$ lower triangular and positive
      diagonal, what is $L_{22}$?
    answer: >
      $2$. Write $L$ with rows $(L_{11}, 0)$ and $(L_{21}, L_{22})$ and match
      entries of $LL^{T}$ to $A$ one at a time. The $(1,1)$ entry gives
      $L_{11}^{2} = 9$, so $L_{11} = 3$ taking the positive root. The $(2,1)$
      entry gives $L_{21}L_{11} = 3$, so $L_{21} = 1$. The $(2,2)$ entry gives
      $L_{21}^{2} + L_{22}^{2} = 5$, so $L_{22} = \sqrt{5 - 1} = 2$. Check:
      $L$ with rows $(3,0)$ and $(1,2)$ has $LL^{T}$ with rows
      $(9,3)$ and $(3, 1 + 4) = (3,5)$, as required. The quantity under the
      root, $5 - L_{21}^{2}$, is the residual variance of the second asset
      after the first is projected out; had it come out negative, the input
      would not have been a valid covariance matrix at all. To simulate,
      $z$ with uncorrelated unit-variance entries gives $Lz$ covariance
      $LL^{T} = A$.
    expects: "2"
    rubric:
      - >
        Matches entries of $LL^{T}$ to $A$ in order, solving for $L_{11}$
        before $L_{21}$.
      - >
        Subtracts $L_{21}^{2}$ before taking the root for $L_{22}$.
    targets:
      - quant-tools.linear-algebra.matrix-square-root
