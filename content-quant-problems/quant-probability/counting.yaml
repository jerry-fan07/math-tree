# Problems targeting quant-probability.counting — the counting toolkit.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's numbers. See ../README.md.

problems:
  # --- the multiplication principle -------------------------------------------

  - id: qcnt-multiplication-principle-01
    kind: work
    difficulty: demanding
    statement: >
      A vault code is four digits long, each digit drawn from $1$ through $9$,
      subject to one rule: no digit may equal the digit immediately before it.
      Digits may otherwise repeat. How many codes are there?
    answer: >
      $4608$. Fill the slots left to right. The first digit has $9$ options.
      Every later digit is barred from exactly one value — whatever its
      immediate predecessor was — so it has $9 - 1 = 8$ options, and crucially
      that count is $8$ no matter which digit preceded it. The option count is
      constant at each stage even though the permitted *set* shifts, which is
      precisely the hypothesis the product rule needs, so the total is
      $9 \cdot 8 \cdot 8 \cdot 8 = 9 \cdot 512 = 4608$. Two neighbouring wrong
      answers show what the rule does and does not say: $9^{4} = 6561$ ignores
      the constraint, and $9 \cdot 8 \cdot 7 \cdot 6 = 3024$ answers the
      different question in which all four digits must be distinct.
    expects: "4608"
    rubric:
      - >
        Checks that the number of options at each stage after the first is $8$
        regardless of which digit was chosen before it, and says so before
        multiplying.
      - >
        Bars only the immediate predecessor, not every earlier digit — so the
        answer is not the falling factorial $9 \cdot 8 \cdot 7 \cdot 6$.
    targets:
      - quant-probability.counting.multiplication-principle

  - id: qcnt-multiplication-principle-02
    kind: work
    difficulty: standard
    statement: >
      A prix fixe menu lists $6$ starters, $5$ main courses and $4$ desserts. A
      diner takes exactly one main and exactly one dessert, and may either take
      one starter or skip the starter course entirely. How many distinct meals
      are possible?
    answer: >
      $140$. Skipping is itself an option, so the starter stage offers
      $6 + 1 = 7$ outcomes rather than $6$; the main and dessert stages offer
      $5$ and $4$, and neither count depends on what came before. The product
      rule then gives $7 \cdot 5 \cdot 4 = 140$. Handling the skip as a case
      split gives the same number and is a useful cross-check: $6 \cdot 5 \cdot
      4 = 120$ meals with a starter plus $5 \cdot 4 = 20$ without, totalling
      $140$. Answering $6 \cdot 5 \cdot 4 = 120$ silently makes the starter
      compulsory.
    expects: "140"
    rubric:
      - >
        Counts "no starter" as one further option at that stage, giving $7$ and
        not $6$.
      - >
        Multiplies the three stage counts rather than adding them.
    targets:
      - quant-probability.counting.multiplication-principle

  # --- permutations -----------------------------------------------------------

  - id: qcnt-permutations-01
    kind: work
    difficulty: demanding
    statement: >
      How many distinguishable arrangements of the seven letters of SUCCESS
      have the two C's *not* adjacent?
    answer: >
      $300$. SUCCESS has seven letters with three S's, two C's and one each of U
      and E, so the multiset count of all arrangements is
      $7!/(3!\,2!) = 5040/12 = 420$. Count the bad ones by gluing: treat CC as a
      single indivisible tile, leaving six objects — the tile, three S's, U, E —
      which arrange in $6!/3! = 720/6 = 120$ distinguishable ways. There is no
      further factor of $2$ for the tile's internal order, because the two C's
      are identical and swapping them changes nothing. Subtracting,
      $420 - 120 = 300$. The gap-insertion route confirms it: arrange the five
      non-C letters in $5!/3! = 20$ ways, then choose $2$ of the $6$ gaps for
      the C's, giving $20 \cdot \binom{6}{2} = 20 \cdot 15 = 300$.
    expects: "300"
    rubric:
      - >
        Divides by $3!$ for the S's and $2!$ for the C's in the total, rather
        than using $7!$.
      - >
        Does *not* multiply the glued-block count by $2$ — the two C's are
        identical, so the block has one internal order, not two.
    targets:
      - quant-probability.counting.permutations

  - id: qcnt-permutations-02
    kind: work
    difficulty: standard
    statement: >
      A desk of $11$ analysts publishes a ranked shortlist naming its first,
      second, third and fourth choices, all four distinct. How many shortlists
      are possible?
    answer: >
      $7920$. Four ordered slots are filled from eleven distinct people, so this
      is the $4$-permutation $P(11,4) = 11 \cdot 10 \cdot 9 \cdot 8 = 7920$ —
      exactly four falling factors starting at $11$, equivalently
      $11!/7!$. The two standard slips are visible here: $11! = 39916800$ ranks
      all eleven analysts rather than four, and $\binom{11}{4} = 330$ drops the
      ranking, counting the unordered set of four names instead of the ordered
      list. The ratio between those two, $7920/330 = 24 = 4!$, is the number of
      orders each set of four could be listed in.
    expects: "7920"
    rubric:
      - >
        Uses exactly four falling factors from $11$, not the full factorial and
        not a binomial coefficient.
      - >
        Keeps the ranking: the four positions are distinguishable, so the count
        is $4!$ times the unordered count.
    targets:
      - quant-probability.counting.permutations

  # --- circular arrangements --------------------------------------------------

  - id: qcnt-circular-arrangements-01
    kind: work
    difficulty: demanding
    statement: >
      Ten people are seated uniformly at random around a round table at which
      only relative order matters. What is the probability that three
      particular people among them — say the three partners — end up in three
      consecutive seats?
    answer: >
      $1/12 \approx 0.0833$. Distinguishable seatings number $(10-1)! = 9! =
      362880$. For the favourable ones, glue the three partners into a single
      block: the block plus the other seven people make eight objects around the
      table, arranged in $(8-1)! = 7! = 5040$ ways, and the block's own internal
      order contributes $3! = 6$, for $5040 \cdot 6 = 30240$ seatings. The
      probability is $30240/362880 = 1/12$. A one-line check avoids the
      factorials entirely: fix one partner anywhere and ask where the other two
      land among the $9$ remaining seats. There are $\binom{9}{2} = 36$ equally
      likely pairs of seats, and only three of them keep the trio consecutive
      (both partners immediately clockwise, both immediately anticlockwise, or
      one on each side), giving $3/36 = 1/12$.
    expects: "1/12"
    tolerance: 0.0005
    rubric:
      - >
        Uses $(n-1)!$ for both the total and the glued-block count, so the
        rotation symmetry is quotiented out on both sides of the fraction.
      - >
        Multiplies the block count by $3!$ for the partners' internal order.
    targets:
      - quant-probability.counting.circular-arrangements

  - id: qcnt-circular-arrangements-02
    kind: work
    difficulty: standard
    statement: >
      Nine distinct beads are strung onto a bracelet that can be freely rotated
      and also flipped over. How many distinguishable bracelets result?
    answer: >
      $20160$. Laying the nine beads out in a line gives $9! = 362880$
      arrangements, but the bracelet identifies two arrangements whenever one is
      a rotation of the other, and each cyclic pattern appears as $9$ linear
      arrangements, leaving $9!/9 = 8! = 40320$. Because the bracelet can also
      be turned over, each cyclic pattern is further identified with its
      reversal, and for $n \ge 3$ no arrangement of distinct beads equals its own
      reversal, so every bracelet is counted exactly twice: $40320/2 = 20160$.
      Stopping at $8! = 40320$ answers the round-table question, where flipping
      is not available.
    expects: "20160"
    rubric:
      - >
        Divides by $9$ for rotation and then by $2$ for the flip, naming each
        symmetry as it is removed.
      - >
        Removes both symmetries exactly once — the answer is $8!/2 = 20160$,
        not $9!/2 = 181440$ (rotation left in) and not $8!/4 = 10080$ (the flip
        divided out twice).
    targets:
      - quant-probability.counting.circular-arrangements

  # --- combinations (landmark) ------------------------------------------------

  - id: qcnt-combinations-01
    kind: work
    difficulty: demanding
    statement: >
      A five-person project team is drawn from a group of $7$ traders and $5$
      quants. The team must contain at least two quants. How many teams satisfy
      the requirement?
    answer: >
      $596$. Complementary counting is the short route: all teams number
      $\binom{12}{5} = 792$; teams with no quant number $\binom{7}{5} = 21$; and
      teams with exactly one quant number $\binom{5}{1}\binom{7}{4} = 5 \cdot 35
      = 175$. Subtracting the two bad cases, $792 - 21 - 175 = 596$. The direct
      sum agrees, which is the check worth doing:
      $\binom{5}{2}\binom{7}{3} + \binom{5}{3}\binom{7}{2} +
      \binom{5}{4}\binom{7}{1} + \binom{5}{5}\binom{7}{0}
      = 10 \cdot 35 + 10 \cdot 21 + 5 \cdot 7 + 1 = 350 + 210 + 35 + 1 = 596$.
      The classic wrong answer is $\binom{5}{2}\binom{10}{3} = 10 \cdot 120 =
      1200$ — "pick two quants first, then anyone for the rest" — which
      double-counts every team holding three or more quants, once for each pair
      of quants that could have been the designated two.
    expects: "596"
    rubric:
      - >
        Splits by the number of quants (or takes the complement), rather than
        reserving two quant seats and filling the rest freely.
      - >
        Gets the same number by both routes, or explains why the
        reserve-two-seats count overcounts.
    targets:
      - quant-probability.counting.combinations

  - id: qcnt-combinations-02
    kind: work
    difficulty: standard
    statement: >
      An interview panel of $5$ is to be formed from $14$ available employees,
      with no roles or ranking attached to the seats. How many panels are
      possible?
    answer: >
      $2002$. The seats carry no order, so this is the number of $5$-element
      subsets of a $14$-element set:
      $\binom{14}{5} = \dfrac{14!}{5!\,9!} =
      \dfrac{14 \cdot 13 \cdot 12 \cdot 11 \cdot 10}{5 \cdot 4 \cdot 3 \cdot 2
      \cdot 1} = \dfrac{240240}{120} = 2002$. The numerator is the ordered count
      $P(14,5) = 240240$ and the division by $5! = 120$ removes the orderings
      that describe the same panel — the ordered-then-divide pattern that
      defines the binomial coefficient. Cancelling before multiplying keeps the
      arithmetic small: $14 \cdot 13 \cdot 12 \cdot 11 \cdot 10 / 120$ reduces to
      $7 \cdot 13 \cdot 11 \cdot 2 = 2002$.
    expects: "2002"
    rubric:
      - >
        Recognises that the panel is unordered and divides the ordered count by
        $5!$.
      - >
        Computes $\binom{14}{5}$ correctly, cancelling factors rather than
        expanding $14!$.
    targets:
      - quant-probability.counting.combinations

  - id: qcnt-combinations-03
    kind: work
    difficulty: routine
    statement: >
      Evaluate $\binom{20}{17}$.
    answer: >
      $1140$. Symmetry does the work: choosing which $17$ of the $20$ items to
      include is the same act as choosing which $3$ to leave out, so
      $\binom{20}{17} = \binom{20}{20-17} = \binom{20}{3}$. That is
      $\dfrac{20 \cdot 19 \cdot 18}{3 \cdot 2 \cdot 1} = \dfrac{6840}{6} = 1140$.
      Working from the definition without flipping first means expanding a
      $17$-factor product and cancelling it against $17!$ — the same answer at
      several times the cost, and the usual source of an arithmetic slip under
      time pressure.
    expects: "1140"
    rubric:
      - >
        Applies $\binom{n}{k} = \binom{n}{n-k}$ to replace $k = 17$ by $k = 3$
        before computing.
      - >
        Evaluates $\binom{20}{3} = 1140$ correctly.
    targets:
      - quant-probability.counting.combinations

  # --- count with labels, then divide -----------------------------------------

  - id: qcnt-symmetry-division-01
    kind: work
    difficulty: demanding
    statement: >
      Twelve distinct analysts are to be split into four teams of three. The
      teams are unlabelled — no team has a name, a room or a role, so only the
      partition into groups matters. How many splits are there?
    answer: >
      $15400$. Count the labelled version first: assigning the twelve analysts
      to four *named* teams of three is the multinomial
      $\dfrac{12!}{3!\,3!\,3!\,3!} = \dfrac{479001600}{1296} = 369600$. Every
      unlabelled split arises from exactly $4! = 24$ of those labelled
      assignments, one for each way of attaching the four names to the four
      groups, and the overcount factor is the same $24$ for every split because
      all four groups have the same size and so are interchangeable. Dividing,
      $369600/24 = 15400$. The division is legal precisely because of that
      uniformity: had the sizes been $3, 3, 3, 3$ replaced by, say, $4, 4, 2, 2$,
      only the equal-sized groups could be swapped and the correct divisor would
      be $2!\,2!$, not $4!$.
    expects: "15400"
    rubric:
      - >
        Computes the labelled count $12!/(3!)^{4}$ first, then divides by $4!$
        for the interchangeable team names.
      - >
        States why the overcount factor is the same for every split — all four
        groups have equal size — rather than dividing by $4!$ reflexively.
    targets:
      - quant-probability.counting.symmetry-division

  - id: qcnt-symmetry-division-02
    kind: work
    difficulty: standard
    statement: >
      Eight distinct people are to be paired off into four unlabelled pairs for
      a round of practice interviews. How many pairings are there?
    answer: >
      $105$. Label the pairs first: dealing eight people into four named pairs is
      $\dfrac{8!}{2!\,2!\,2!\,2!} = \dfrac{40320}{16} = 2520$, and each
      unlabelled pairing is produced by $4! = 24$ of those, so
      $2520/24 = 105$. The sequential count is a good check and is faster by
      hand: the lowest-numbered unmatched person has $7$ possible partners, then
      the lowest remaining has $5$, then $3$, then $1$, giving
      $7 \cdot 5 \cdot 3 \cdot 1 = 105$ with no division at all, because fixing
      "the lowest unmatched person" as the one who chooses already breaks every
      symmetry.
    expects: "105"
    rubric:
      - >
        Divides out both the order inside each pair and the order of the four
        pairs, or uses the double-factorial route that never introduces either.
      - >
        Arrives at $105$, not $2520$ (pairs left labelled) and not $\binom{8}{2}
        \binom{6}{2}\binom{4}{2}\binom{2}{2} = 2520$ undivided.
    targets:
      - quant-probability.counting.symmetry-division

  # --- multinomial coefficients -----------------------------------------------

  - id: qcnt-multinomial-01
    kind: work
    difficulty: demanding
    statement: >
      Ten distinct stocks are allocated to three named portfolios: portfolio A
      takes $4$ of them, portfolios B and C take $3$ each. In how many of these
      allocations do two particular stocks — say the two energy names — land in
      the same portfolio?
    answer: >
      $1120$. All allocations number
      $\dfrac{10!}{4!\,3!\,3!} = \dfrac{3628800}{864} = 4200$. Split the
      favourable ones by which portfolio holds the pair. If it is A, the two
      energy names occupy two of A's four slots and the remaining eight stocks
      fill sizes $2, 3, 3$, giving $\dfrac{8!}{2!\,3!\,3!} = \dfrac{40320}{72} =
      560$. If it is B, the pair uses two of B's three slots and the other eight
      stocks fill sizes $4, 1, 3$, giving $\dfrac{8!}{4!\,1!\,3!} =
      \dfrac{40320}{144} = 280$; portfolio C is identical, another $280$. The
      three cases are disjoint, so the total is $560 + 280 + 280 = 1120$ — a
      fraction $1120/4200 = 4/15$ of all allocations. The cases cannot be merged
      into one multinomial, because the number of remaining slots depends on
      which portfolio absorbed the pair.
    expects: "1120"
    rubric:
      - >
        Splits into the three cases by which portfolio holds the pair, and
        removes two slots from that portfolio's size in each case.
      - >
        Uses the multinomial $8!/(n_1!\,n_2!\,n_3!)$ with the reduced sizes
        rather than reusing $10!/(4!\,3!\,3!)$ with a fudge factor.
    targets:
      - quant-probability.counting.multinomial

  - id: qcnt-multinomial-02
    kind: work
    difficulty: standard
    statement: >
      How many distinct arrangements are there of the ten letters of
      BOOKKEEPER?
    answer: >
      $151200$. The letter multiset is E three times, O twice, K twice, and one
      each of B, P and R — ten letters in all, since $3 + 2 + 2 + 1 + 1 + 1 =
      10$. The multiset arrangement count is the multinomial coefficient
      $\dfrac{10!}{3!\,2!\,2!\,1!\,1!\,1!} = \dfrac{3628800}{6 \cdot 2 \cdot 2}
      = \dfrac{3628800}{24} = 151200$. The denominator is exactly the number of
      ways to permute identical copies among themselves without changing what
      the word looks like, which is why each visible arrangement is produced by
      $3!\,2!\,2! = 24$ of the $10!$ labelled orderings. Mis-tallying the E's as
      two rather than three is the usual failure, and it inflates the answer to
      $10!/(2!\,2!\,2!) = 453600$.
    expects: "151200"
    rubric:
      - >
        Tallies the letter multiplicities correctly — three E's, two O's, two
        K's — and checks that they sum to $10$.
      - >
        Divides $10!$ by the product of the factorials of the multiplicities.
    targets:
      - quant-probability.counting.multinomial

  # --- the binomial theorem ---------------------------------------------------

  - id: qcnt-binomial-theorem-01
    kind: work
    difficulty: demanding
    statement: >
      In the expansion of $(x^{2} + 2/x)^{9}$, what is the coefficient of
      $x^{3}$?
    answer: >
      $4032$. The general term is
      $\binom{9}{k}(x^{2})^{k}(2/x)^{9-k} = \binom{9}{k}2^{9-k}x^{2k-(9-k)}
      = \binom{9}{k}2^{9-k}x^{3k-9}$, so the exponent of $x$ is $3k - 9$ and the
      term contributes to $x^{3}$ exactly when $3k - 9 = 3$, that is $k = 4$.
      Its coefficient is $\binom{9}{4}2^{9-4} = 126 \cdot 32 = 4032$. Two things
      make this harder than the textbook case: the powers of $x$ do not step by
      one, so the target exponent must be solved for rather than read off, and
      the constant $2$ rides on the *second* factor, so its exponent is $9-k$
      and not $k$. Taking $k = 3$ (the exponent you want) instead of solving
      $3k - 9 = 3$ gives $\binom{9}{3}2^{6} = 84 \cdot 64 = 5376$, the usual
      wrong answer.
    expects: "4032"
    rubric:
      - >
        Writes the general term with both factors' exponents and solves
        $3k - 9 = 3$ for $k$ rather than reading $k$ off the target power.
      - >
        Attaches $2^{9-k}$, not $2^{k}$, to the binomial coefficient.
    targets:
      - quant-probability.counting.binomial-theorem

  - id: qcnt-binomial-theorem-02
    kind: work
    difficulty: standard
    statement: >
      Evaluate $\sum_{k=0}^{5}\binom{5}{k}2^{k}$.
    answer: >
      $243$. The sum is the binomial expansion of $(x+y)^{5}$ read backwards,
      with $x = 2$ and $y = 1$: since
      $\sum_{k=0}^{5}\binom{5}{k}x^{k}y^{5-k} = (x+y)^{5}$, substituting gives
      $\sum_{k=0}^{5}\binom{5}{k}2^{k} = (2+1)^{5} = 3^{5} = 243$. Term by term
      the sum is $1 + 10 + 40 + 80 + 80 + 32 = 243$, which confirms it. The
      counting reading is just as direct: each of the five factors either
      contributes a $2$ or a $1$, so the sum counts the $3^{5}$ ways to label
      five positions with one of three symbols — a $1$, or one of the two things
      the $2$ stands for.
    expects: "243"
    rubric:
      - >
        Recognises the sum as $(x+y)^{n}$ with $x = 2$, $y = 1$ rather than
        expanding all six terms blindly.
      - >
        Gets $3^{5} = 243$, not $2^{5} = 32$ — the substitution is $x+y$, not
        $x$ alone.
    targets:
      - quant-probability.counting.binomial-theorem

  # --- double counting and bijections -----------------------------------------

  - id: qcnt-double-counting-01
    kind: work
    difficulty: demanding
    statement: >
      How many ordered pairs of sets $(A, B)$ satisfy
      $A \subseteq B \subseteq \{1,2,3,4,5,6\}$?
    answer: >
      $729$. Do not sum over the size of $B$ — biject instead. A pair
      $(A,B)$ with $A \subseteq B$ is determined by deciding, independently for
      each of the six elements, which of exactly three states it occupies: in
      neither set, in $B$ only, or in both. Nothing else is possible, since
      being in $A$ but not in $B$ would break the containment. So the pairs
      correspond one-to-one with strings of length $6$ over a three-letter
      alphabet, and there are $3^{6} = 729$ of them. Counting the same set the
      slow way is the double-counting check: fix $|B| = j$, choose $B$ in
      $\binom{6}{j}$ ways and then any $A$ inside it in $2^{j}$ ways, giving
      $\sum_{j=0}^{6}\binom{6}{j}2^{j} = (2+1)^{6} = 729$ by the binomial
      theorem. The two routes agreeing is exactly the identity
      $\sum_j \binom{n}{j}2^{j} = 3^{n}$.
    expects: "729"
    rubric:
      - >
        Assigns each element one of three states and justifies that the fourth
        combination (in $A$, not in $B$) is forbidden.
      - >
        Cross-checks against the sum over $|B|$, and gets the same number.
    targets:
      - quant-probability.counting.double-counting

  - id: qcnt-double-counting-02
    kind: work
    difficulty: standard
    statement: >
      At a networking event, each of the $8$ attendees shakes hands with exactly
      $3$ of the others. How many handshakes take place?
    answer: >
      $12$. Count the pairs (person, handshake that person took part in) two
      ways. Summing over people gives $8 \cdot 3 = 24$, since each of the eight
      attendees reports three handshakes. Summing over handshakes gives $2H$,
      where $H$ is the number of handshakes, because every handshake involves
      exactly two people and so is reported twice. The two counts are of the
      same set, so $2H = 24$ and $H = 12$. This is the handshake lemma
      $\sum_i \deg(i) = 2|E|$, and the factor of $2$ is the whole content: the
      unwary answer $8 \cdot 3 = 24$ counts each handshake once from each end.
      The same identity also shows why an event where every one of $9$
      attendees shakes exactly $3$ hands is impossible — $27$ is odd.
    expects: "12"
    rubric:
      - >
        Counts the person-handshake incidences and equates the two totals,
        rather than multiplying and stopping.
      - >
        Divides by $2$ because each handshake is reported by both participants.
    targets:
      - quant-probability.counting.double-counting

  # --- hockey stick and Vandermonde -------------------------------------------

  - id: qcnt-binomial-identities-01
    kind: work
    difficulty: demanding
    statement: >
      Evaluate $\sum_{k=0}^{5}\binom{5}{k}^{2}$ without expanding all six
      terms — name the identity you are using.
    answer: >
      $252$. Flip one factor by symmetry, $\binom{5}{k} = \binom{5}{5-k}$, so
      the sum is $\sum_{k}\binom{5}{k}\binom{5}{5-k}$, which is Vandermonde's
      convolution $\sum_{k}\binom{m}{k}\binom{n}{p-k} = \binom{m+n}{p}$ with
      $m = n = 5$ and $p = 5$. Hence the value is $\binom{10}{5} = 252$. The
      counting story behind Vandermonde is the fastest way to remember it:
      choosing $5$ people from a room of $5$ men and $5$ women, split on how
      many of the chosen are men, and the $k$-th term counts the selections with
      exactly $k$ men. Expanding confirms:
      $1 + 25 + 100 + 100 + 25 + 1 = 252$.
    expects: "252"
    rubric:
      - >
        Uses the symmetry $\binom{n}{k} = \binom{n}{n-k}$ to turn the square
        into a product of two different lower indices.
      - >
        Names Vandermonde (or gives its committee argument) and lands on
        $\binom{2n}{n}$ with $n = 5$.
    targets:
      - quant-probability.counting.binomial-identities

  - id: qcnt-binomial-identities-02
    kind: work
    difficulty: standard
    statement: >
      Evaluate $\binom{2}{2} + \binom{3}{2} + \binom{4}{2} + \binom{5}{2} +
      \binom{6}{2} + \binom{7}{2}$.
    answer: >
      $56$. This is a column of Pascal's triangle summed from its top, which the
      hockey-stick identity $\sum_{i=r}^{n}\binom{i}{r} = \binom{n+1}{r+1}$
      collapses in one step: with $r = 2$ and $n = 7$ the sum is
      $\binom{8}{3} = 56$. The proof is a classification rather than an
      induction — every $3$-element subset of $\{0,1,\dots,7\}$ has a largest
      element $i$, and once that largest element is fixed the other two come
      from $\{0,\dots,i-1\}$ in $\binom{i}{2}$ ways, so summing over $i$
      reproduces the left-hand side. Direct addition agrees:
      $1 + 3 + 6 + 10 + 15 + 21 = 56$.
    expects: "56"
    rubric:
      - >
        Identifies the sum as hockey stick with $r = 2$, not as a Vandermonde or
        a row sum.
      - >
        Uses $\binom{n+1}{r+1}$ with the correct shift — $\binom{8}{3}$, not
        $\binom{7}{3}$ or $\binom{8}{2}$.
    targets:
      - quant-probability.counting.binomial-identities

  # --- stars and bars ---------------------------------------------------------

  - id: qcnt-stars-bars-01
    kind: work
    difficulty: demanding
    statement: >
      How many solutions in nonnegative integers does
      $x_1 + x_2 + x_3 + x_4 = 14$ have if every variable also satisfies
      $x_i \le 6$?
    answer: >
      $206$. Stars and bars handles the equation without the cap: the
      unrestricted count is $\binom{14 + 4 - 1}{4 - 1} = \binom{17}{3} = 680$.
      Upper caps are not a stars-and-bars feature, so remove them by
      inclusion–exclusion on the violations. If $x_1 \ge 7$, substitute
      $y_1 = x_1 - 7$ to get $y_1 + x_2 + x_3 + x_4 = 7$, with
      $\binom{7+3}{3} = \binom{10}{3} = 120$ solutions; there are $4$ choices of
      the offending variable, so subtract $4 \cdot 120 = 480$. Two variables can
      both exceed the cap, since $7 + 7 = 14$ is attainable: subtracting $7$
      twice leaves a total of $0$, which has $\binom{0+3}{3} = 1$ solution, and
      there are $\binom{4}{2} = 6$ such pairs, so add back $6$. Three violations
      would need $21 > 14$ and cannot happen. The count is
      $680 - 480 + 6 = 206$.
    expects: "206"
    rubric:
      - >
        Computes the uncapped stars-and-bars count $\binom{17}{3}$ and then
        corrects it, rather than trying to encode the cap directly.
      - >
        Shifts a violating variable by $7$ (one more than the cap), not by $6$.
      - >
        Adds back the double violations — checks that $7 + 7 \le 14$ makes them
        possible — and stops there.
    targets:
      - quant-probability.counting.stars-bars

  - id: qcnt-stars-bars-02
    kind: work
    difficulty: standard
    statement: >
      Nine identical bonus units are to be divided among $5$ desks, and every
      desk must receive at least one unit. How many divisions are possible?
    answer: >
      $70$. The units are identical and the desks are distinguishable, so this
      is the number of positive integer solutions of
      $x_1 + \cdots + x_5 = 9$. Substituting $y_i = x_i - 1$ turns the positivity
      constraint into nonnegativity and drops the total to $9 - 5 = 4$, leaving
      $y_1 + \cdots + y_5 = 4$ with
      $\binom{4 + 5 - 1}{5 - 1} = \binom{8}{4} = 70$ solutions. The bar picture
      says the same thing directly: nine stars in a row leave $8$ internal gaps,
      and choosing $4$ of them for the bars guarantees no gap is empty, which is
      $\binom{8}{4} = 70$ again. Forgetting the "at least one" and answering
      $\binom{13}{4} = 715$ is the standard slip.
    expects: "70"
    rubric:
      - >
        Applies the shift $y_i = x_i - 1$ (or places bars in the internal gaps)
        so that the "at least one" constraint is enforced.
      - >
        Uses $\binom{n-1}{k-1}$ with $n = 9$, $k = 5$ rather than the
        nonnegative form $\binom{n+k-1}{k-1}$.
    targets:
      - quant-probability.counting.stars-bars

  # --- the four sampling modes ------------------------------------------------

  - id: qcnt-sampling-table-01
    kind: work
    difficulty: demanding
    statement: >
      Three fair six-sided dice are rolled. A candidate argues that the possible
      results, ignoring which die showed what, number
      $\binom{6+3-1}{3} = \binom{8}{3} = 56$, so the chance of seeing the values
      $1$, $2$ and $3$ is $1/56$. What is the correct probability?
    answer: >
      $1/36 \approx 0.0278$. The count of $56$ is right — that is the
      unordered-with-replacement cell of the sampling table, the number of
      multisets of size $3$ from $6$ types. The error is using it as a
      denominator. Those $56$ multisets are not equally likely: the mechanism
      produces $6^{3} = 216$ equally likely *ordered* triples, and a multiset of
      three distinct values corresponds to $3! = 6$ of them while a triple such
      as $(4,4,4)$ corresponds to just one. So the probability of the multiset
      $\{1,2,3\}$ is $6/216 = 1/36$, whereas a triple like $\{4,4,4\}$ has
      probability $1/216$ — nowhere near a common value of $1/56$. The rule of
      thumb: classify by order and replacement to get the *count*, but take the
      equally likely outcomes from the ordered-with-replacement cell.
    expects: "1/36"
    tolerance: 0.0005
    rubric:
      - >
        Identifies that the $56$ multisets are not equally likely, and says
        which cell of the sampling table supplies the equally likely outcomes.
      - >
        Counts the $3! = 6$ ordered triples realising $\{1,2,3\}$ and divides by
        $6^{3} = 216$.
    targets:
      - quant-probability.counting.sampling-table

  - id: qcnt-sampling-table-02
    kind: work
    difficulty: standard
    statement: >
      A shop sells $8$ flavours of ice cream. A cup holds $4$ scoops; scoops may
      repeat a flavour, and the scoops in the cup are not distinguishable from
      one another. How many different cups are possible?
    answer: >
      $330$. Classify before computing: repeats are allowed and order does not
      matter, which is the unordered-with-replacement cell, counted by
      $\binom{n + k - 1}{k}$ with $n = 8$ types and $k = 4$ draws. That is
      $\binom{11}{4} = \dfrac{11 \cdot 10 \cdot 9 \cdot 8}{24} = 330$. The other
      three cells answer different questions and are worth writing down to see
      the contrast: $8^{4} = 4096$ if the scoops sat in a labelled stack,
      $8 \cdot 7 \cdot 6 \cdot 5 = 1680$ if they were stacked and no flavour
      could repeat, and $\binom{8}{4} = 70$ if repeats were banned in the cup.
      Equivalently, the cup is a solution of $x_1 + \cdots + x_8 = 4$ in
      nonnegative integers — the stars-and-bars form of the same cell.
    expects: "330"
    rubric:
      - >
        Names both axes — repeats allowed, order irrelevant — before choosing a
        formula.
      - >
        Uses $\binom{n+k-1}{k} = \binom{11}{4}$, not $\binom{8}{4}$ and not
        $8^{4}$.
    targets:
      - quant-probability.counting.sampling-table

  # --- lattice paths ----------------------------------------------------------

  - id: qcnt-lattice-paths-01
    kind: work
    difficulty: demanding
    statement: >
      A courier walks on the integer grid from $(0,0)$ to $(6,6)$ using only
      unit steps right and up. Roadworks close the intersections $(2,2)$ and
      $(4,4)$. How many routes avoid both?
    answer: >
      $300$. All monotone routes number $\binom{12}{6} = 924$. Count the banned
      ones by inclusion–exclusion. Routes through $(2,2)$ split at that point
      into two independent legs: $\binom{4}{2}\binom{8}{4} = 6 \cdot 70 = 420$.
      Routes through $(4,4)$ are $\binom{8}{4}\binom{4}{2} = 70 \cdot 6 = 420$
      by the same argument. These two families overlap, because a monotone path
      can visit both closures, and such routes are
      $\binom{4}{2}\binom{4}{2}\binom{4}{2} = 6^{3} = 216$ — three legs,
      $(0,0)$ to $(2,2)$ to $(4,4)$ to $(6,6)$. So the routes hitting at least
      one closure number $420 + 420 - 216 = 624$, and the answer is
      $924 - 624 = 300$. Subtracting $420$ twice without adding the overlap back
      gives $84$, which is the trap: the two blocked points lie on a common
      monotone path, so the events are not disjoint.
    expects: "300"
    rubric:
      - >
        Multiplies the legs at a checkpoint rather than adding them, in each of
        the three counts.
      - >
        Adds back the routes through both closures — recognising that $(2,2)$
        and $(4,4)$ can lie on the same monotone path.
    targets:
      - quant-probability.counting.lattice-paths

  - id: qcnt-lattice-paths-02
    kind: work
    difficulty: standard
    statement: >
      How many monotone lattice paths built from unit right and up steps run
      from $(0,0)$ to $(7,3)$?
    answer: >
      $120$. Every such path uses exactly $7$ right steps and $3$ up steps in
      some order, and the path is completely determined by that order — it is a
      word of length $10$ over the two letters R and U with three U's. Choosing
      which $3$ of the $10$ positions carry the up steps gives
      $\binom{10}{3} = \dfrac{10 \cdot 9 \cdot 8}{6} = 120$, and choosing the
      seven R positions instead gives $\binom{10}{7}$, the same number by
      symmetry. The bijection with words is what makes the count immediate: no
      recursion, no grid drawing, just $\binom{m+n}{n}$ with $m = 7$ and
      $n = 3$.
    expects: "120"
    rubric:
      - >
        Translates the path into a word with $7$ R's and $3$ U's, so the total
        number of steps is $10$.
      - >
        Evaluates $\binom{10}{3} = 120$ (equivalently $\binom{10}{7}$).
    targets:
      - quant-probability.counting.lattice-paths

  # --- Catalan numbers --------------------------------------------------------

  - id: qcnt-catalan-01
    kind: work
    difficulty: demanding
    statement: >
      Eight people queue at a box office in a uniformly random order. A ticket
      costs $10$; four of the eight carry a single note worth $10$ and four
      carry a single note worth $20$, and the till starts empty. A customer with
      a $20$ note can only be served if the till already holds a $10$ note to
      give as change. What is the probability that everybody is served without
      the queue stalling?
    answer: >
      $1/5 = 0.2$. Read the queue as a word: write $+1$ for a customer paying
      with a $10$ note and $-1$ for one paying with a $20$. The till holds the
      running partial sum, so the queue never stalls exactly when every partial
      sum stays $\ge 0$ — the Catalan condition on a sequence of four $+1$s and
      four $-1$s. The number of such sequences is
      $C_4 = \dfrac{1}{5}\binom{8}{4} = 70/5 = 14$, equivalently
      $\binom{8}{4} - \binom{8}{5} = 70 - 56 = 14$ by the reflection argument.
      All $\binom{8}{4} = 70$ orders of the note types are equally likely, so
      the probability is $14/70 = 1/5$. In general the answer for $n$ of each is
      $C_n/\binom{2n}{n} = 1/(n+1)$, which is worth quoting: with four of each,
      one queue in five works.
    expects: "1/5"
    tolerance: 0.0005
    rubric:
      - >
        Encodes the queue as $\pm 1$ steps and states the stalling condition as
        a partial sum going negative.
      - >
        Uses $C_4 = 14$ over $\binom{8}{4} = 70$ — counting orders of the note
        types, not orderings of the eight distinguishable people.
    targets:
      - quant-probability.counting.catalan

  - id: qcnt-catalan-02
    kind: work
    difficulty: standard
    statement: >
      Twelve people sit around a round table. They pair off and shake hands
      simultaneously, every person in exactly one handshake, with no two arms
      crossing over the table. In how many ways can this be done?
    answer: >
      $132$. Non-crossing perfect matchings of $2m$ points on a circle are
      counted by the Catalan number $C_m$, so with $12$ people, $m = 6$ and the
      answer is
      $C_6 = \dfrac{1}{7}\binom{12}{6} = \dfrac{924}{7} = 132$. The reason the
      Catalan recursion applies is worth seeing: fix one person; their partner
      must leave an even number of people on each side, since anyone stranded on
      a side with an odd count would have to reach across the handshake. If $2i$
      people sit on one side and $2(m-1-i)$ on the other, the two sides are
      matched independently, giving $C_{m} = \sum_{i} C_i C_{m-1-i}$ — the
      recursion whose solution is the Catalan sequence
      $1, 1, 2, 5, 14, 42, 132$.
    expects: "132"
    rubric:
      - >
        Identifies $m = 6$ pairs from $12$ people, so the answer is $C_6$ and
        not $C_{12}$.
      - >
        Evaluates $C_6 = \binom{12}{6}/7 = 132$.
    targets:
      - quant-probability.counting.catalan

  # --- complementary counting -------------------------------------------------

  - id: qcnt-complementary-counting-01
    kind: work
    difficulty: demanding
    statement: >
      How many strings of six digits, each digit drawn from $0$ through $9$,
      contain at least one $0$ *and* at least one $9$?
    answer: >
      $199262$. Two "at least one" conditions at once: complement each of them
      rather than the pair. Write $U$ for all $10^{6} = 1000000$ strings, $A$
      for the strings with no $0$ and $B$ for the strings with no $9$. Each of
      $A$ and $B$ restricts every slot to $9$ symbols, so
      $|A| = |B| = 9^{6} = 531441$, and $A \cap B$ bans both digits, leaving
      $8$ symbols per slot and $|A \cap B| = 8^{6} = 262144$. The strings
      failing at least one requirement number
      $|A \cup B| = 531441 + 531441 - 262144 = 800738$, so the answer is
      $1000000 - 800738 = 199262$. Subtracting $|A|$ and $|B|$ without adding
      the overlap back gives $-62882$, a negative count that immediately signals
      the missing term; and answering
      $6 \cdot 5 \cdot 10^{4} = 300000$ — "place the $0$, place the $9$, fill
      the rest" — double-counts every string containing more than one $0$ or
      more than one $9$.
    expects: "199262"
    rubric:
      - >
        Complements each requirement separately, counting "no $0$" and "no $9$"
        rather than trying to place a $0$ and a $9$ directly.
      - >
        Adds back the strings avoiding both digits, and checks the final number
        is positive and below $10^{6}$.
    targets:
      - quant-probability.counting.complementary-counting

  - id: qcnt-complementary-counting-02
    kind: work
    difficulty: standard
    statement: >
      How many strings of five letters drawn from the $26$ lowercase letters
      contain at least one repeated letter?
    answer: >
      $3987776$. The direct count would have to track which letters repeat and
      how often, so complement instead: "at least one repeat" fails exactly when
      all five letters are distinct. Strings with all letters distinct are
      ordered selections without replacement,
      $P(26,5) = 26 \cdot 25 \cdot 24 \cdot 23 \cdot 22 = 7893600$, out of
      $26^{5} = 11881376$ strings in total. Subtracting,
      $11881376 - 7893600 = 3987776$ — a shade over a third of all strings. As a
      sanity check on the shape of the answer, the same complement gives the
      probability of a repeat as $1 - 7893600/11881376 \approx 0.336$, which is
      the birthday computation with $26$ days and $5$ people.
    expects: "3987776"
    rubric:
      - >
        Takes "all five letters distinct" as the complement, rather than
        counting repeat patterns case by case.
      - >
        Uses the ordered count $P(26,5)$, not $\binom{26}{5}$ — the positions in
        a string are distinguishable.
    targets:
      - quant-probability.counting.complementary-counting

  # --- inclusion–exclusion (landmark) -----------------------------------------

  - id: qcnt-inclusion-exclusion-01
    kind: work
    difficulty: demanding
    statement: >
      Eight distinct prizes are handed out to $4$ children, each prize to
      exactly one child. In how many ways can this be done so that no child goes
      away empty-handed?
    answer: >
      $40824$. Unrestricted, each prize independently picks a child, giving
      $4^{8} = 65536$ distributions; the constraint is that the map from prizes
      to children is onto. Let $A_i$ be the set of distributions missing child
      $i$. A distribution missing a specified child uses only $3$ children, so
      $|A_i| = 3^{8} = 6561$; missing two specified children leaves
      $2^{8} = 256$; missing three leaves $1^{8} = 1$; missing all four is
      impossible. Inclusion–exclusion counts the distributions in *none* of the
      $A_i$ as the alternating sum
      $4^{8} - \binom{4}{1}3^{8} + \binom{4}{2}2^{8} - \binom{4}{3}1^{8}
      = 65536 - 4 \cdot 6561 + 6 \cdot 256 - 4
      = 65536 - 26244 + 1536 - 4 = 40824$. Note what the surjection count is
      *not*: choosing one prize for each child first and dealing the rest
      freely, $8 \cdot 7 \cdot 6 \cdot 5 \cdot 4^{4} = 430080$, overcounts
      wildly, because a child holding several prizes can be reached through any
      of them.
    expects: "40824"
    rubric:
      - >
        Defines $A_i$ as "child $i$ is missed" and computes each $k$-wise
        intersection as $(4-k)^{8}$.
      - >
        Weights the $k$-th term by $\binom{4}{k}$ and alternates the signs,
        stopping at $k = 3$.
    targets:
      - quant-probability.counting.inclusion-exclusion

  - id: qcnt-inclusion-exclusion-02
    kind: work
    difficulty: standard
    statement: >
      How many integers from $1$ to $1000$ inclusive are divisible by at least
      one of $2$, $3$ and $5$?
    answer: >
      $734$. Let $A$, $B$, $C$ be the multiples of $2$, $3$ and $5$ in the
      range. Counting by floor division,
      $|A| = 500$, $|B| = 333$, $|C| = 200$. Pairwise intersections are the
      multiples of the products, since $2$, $3$ and $5$ are pairwise coprime:
      $|A \cap B| = 166$ (multiples of $6$), $|A \cap C| = 100$ (of $10$),
      $|B \cap C| = 66$ (of $15$), and $|A \cap B \cap C| = 33$ (of $30$).
      Inclusion–exclusion gives
      $500 + 333 + 200 - 166 - 100 - 66 + 33 = 734$. The complement is the
      cross-check: $1000 - 734 = 266$ integers are divisible by none of the
      three, and the density estimate
      $1000 \cdot (1/2)(2/3)(4/5) = 266.7$ lands right beside it.
    expects: "734"
    rubric:
      - >
        Uses floor division for each count, so $|B| = 333$ rather than
        $1000/3$.
      - >
        Takes the pairwise intersections to be multiples of $6$, $10$, $15$ and
        the triple to be multiples of $30$, with the signs alternating.
    targets:
      - quant-probability.counting.inclusion-exclusion

  - id: qcnt-inclusion-exclusion-03
    kind: work
    difficulty: routine
    statement: >
      In a class of $40$ students, $22$ study French, $17$ study German, and $9$
      study both. How many study neither language?
    answer: >
      $10$. The two-set case of inclusion–exclusion gives the number studying at
      least one language as
      $|F \cup G| = |F| + |G| - |F \cap G| = 22 + 17 - 9 = 30$; the students
      studying both were counted once in each of the first two terms, so exactly
      one copy has to come out. The rest of the class studies neither:
      $40 - 30 = 10$. Adding $22 + 17 = 39$ and stopping would leave only one
      student studying neither, which is the error the subtraction exists to
      prevent. A quick consistency check on the data: $22 - 9 = 13$ study French
      alone and $17 - 9 = 8$ study German alone, and $13 + 8 + 9 + 10 = 40$.
    expects: "10"
    rubric:
      - >
        Subtracts the overlap once when computing $|F \cup G|$.
      - >
        Subtracts the union from the class total to answer the question actually
        asked.
    targets:
      - quant-probability.counting.inclusion-exclusion

  # --- derangements -----------------------------------------------------------

  - id: qcnt-derangements-01
    kind: work
    difficulty: demanding
    statement: >
      Five letters are placed into five addressed envelopes uniformly at random,
      one letter per envelope. What is the probability that *exactly* two
      letters end up in their correct envelopes?
    answer: >
      $1/6 \approx 0.1667$. "Exactly two" means choosing which two letters are
      correct and then insisting the other three are all wrong — a derangement
      of the remaining three, not a free permutation of them. The choice of the
      correct pair is $\binom{5}{2} = 10$, and the derangements of three objects
      number $D_3 = 2$ (the two $3$-cycles), so the favourable permutations are
      $10 \cdot 2 = 20$ out of $5! = 120$, giving $20/120 = 1/6$. Dropping the
      derangement condition and answering
      $\binom{5}{2}3!/5! = 60/120 = 1/2$ counts every permutation fixing *at
      least* those two letters, so permutations with three, four or five matches
      are counted repeatedly. Running the same recipe at every $k$ — the number
      of permutations of five objects with exactly $k$ fixed points is
      $\binom{5}{k}D_{5-k}$ — gives the counts $44, 45, 20, 10, 0, 1$ for
      $k = 0, \dots, 5$, which sum to $120$ as they must.
    expects: "1/6"
    tolerance: 0.0005
    rubric:
      - >
        Requires the other three letters to be *deranged*, using $D_3 = 2$
        rather than $3! = 6$.
      - >
        Multiplies by $\binom{5}{2}$ for the choice of the matched pair and
        divides by $5! = 120$.
    targets:
      - quant-probability.counting.derangements

  - id: qcnt-derangements-02
    kind: work
    difficulty: standard
    statement: >
      Given $D_6 = 265$ and $D_7 = 1854$, use the recurrence
      $D_n = (n-1)(D_{n-1} + D_{n-2})$ to find $D_8$.
    answer: >
      $14833$. Substituting $n = 8$ gives
      $D_8 = 7(D_7 + D_6) = 7(1854 + 265) = 7 \cdot 2119 = 14833$. The
      recurrence's story: guest $8$ receives one of the $7$ other hats, say
      guest $j$'s; then either guest $j$ takes guest $8$'s hat, leaving a
      derangement of the remaining $6$ guests ($D_6$ ways), or guest $j$ does
      not, in which case treating "guest $8$'s hat" as forbidden for guest $j$
      makes the remaining assignment a derangement of $7$ objects ($D_7$ ways).
      The nearest-integer form is the cross-check: $8!/e = 40320/2.71828 =
      14832.9$, and $D_8$ is indeed the nearest integer, $14833$. The
      probability of a full derangement is then $14833/40320 = 0.367882$,
      already agreeing with $e^{-1} = 0.367879$ to five decimal places.
    expects: "14833"
    rubric:
      - >
        Uses the coefficient $n - 1 = 7$, not $n = 8$.
      - >
        Checks the answer against $n!/e$ — $D_8$ must be the nearest integer to
        $40320/e$.
    targets:
      - quant-probability.counting.derangements

  # --- pigeonhole -------------------------------------------------------------

  - id: qcnt-pigeonhole-01
    kind: work
    difficulty: demanding
    statement: >
      What is the smallest $m$ with this property: every $m$-element subset of
      $\{1, 2, \dots, 30\}$ contains two elements whose difference is exactly
      $10$?
    answer: >
      $m = 21$. Build the boxes so that "difference exactly $10$" becomes
      "same box, adjacent slots". Split $\{1,\dots,30\}$ into the ten chains
      $\{a, a+10, a+20\}$ for $a = 1, \dots, 10$; two numbers differ by $10$
      exactly when they are neighbours within one chain. From a chain of three
      you may take at most two elements without taking neighbours — the two
      ends, $a$ and $a+20$ — so a subset avoiding every difference of $10$ has
      at most $2 \cdot 10 = 20$ elements, and $\{1,\dots,10\} \cup
      \{21,\dots,30\}$ achieves $20$ with no forbidden pair. Hence $m = 20$ is
      not enough, while any $21$ elements must put three into some chain,
      forcing two neighbours. Note that the pigeonhole boxes here are the chains
      and not the individual pairs: pairing $\{a, a+10\}$ alone would give $20$
      boxes and prove nothing useful, because each element lies in two such
      pairs.
    expects: "21"
    rubric:
      - >
        Chooses boxes in which "differ by $10$" is the same as "adjacent in the
        box", namely the ten chains of length three.
      - >
        Exhibits an explicit $20$-element subset with no forbidden pair, so the
        bound is shown to be tight rather than merely sufficient.
    targets:
      - quant-probability.counting.pigeonhole

  - id: qcnt-pigeonhole-02
    kind: work
    difficulty: standard
    statement: >
      How many people must be in a room to guarantee that at least $4$ of them
      were born in the same calendar month?
    answer: >
      $37$. The boxes are the $12$ months. With $36$ people the guarantee fails,
      because $3$ people per month is a genuinely possible distribution and no
      month then holds $4$. With $37$ people, if every month held at most $3$
      the total would be at most $12 \cdot 3 = 36 < 37$, a contradiction, so some
      month holds at least $4$. In the general form, $N$ objects in $n$ boxes
      force some box to hold at least $\lceil N/n \rceil$, and
      $\lceil 37/12 \rceil = 4$ while $\lceil 36/12 \rceil = 3$ — the threshold
      is $n(k-1) + 1$ with $n = 12$ and $k = 4$. Nothing is assumed about how
      birthdays are distributed; unlike the birthday problem, this is a
      certainty, not a probability.
    expects: "37"
    rubric:
      - >
        Uses the threshold $n(k-1) + 1$ rather than $nk$ — the answer is $37$,
        not $48$ or $36$.
      - >
        Exhibits the $36$-person distribution that fails, so the bound is shown
        to be the smallest one that works.
    targets:
      - quant-probability.counting.pigeonhole

  # --- cycle structure --------------------------------------------------------

  - id: qcnt-permutation-cycles-01
    kind: work
    difficulty: demanding
    statement: >
      A permutation of $\{1, 2, \dots, 10\}$ is chosen uniformly at random. What
      is the probability that $1$ and $2$ lie in the same cycle?
    answer: >
      $1/2$, and remarkably the answer is $1/2$ for every $n \ge 2$. Trace the
      cycle containing $1$ using the standard construction: from the current
      element the permutation sends you to one of the still-unused elements, or
      back to $1$ to close the cycle, and at each step those options are equally
      likely. Follow the trace until the first moment it either reaches $2$ or
      closes. At every step of that race, "close the cycle" and "step to $2$"
      are two of the equally likely options, so by symmetry the race is a fair
      coin: reaching $2$ first — which is exactly the event that $1$ and $2$
      share a cycle — has probability $1/2$. The counting version says the same:
      permutations placing $1$ and $2$ in a common cycle of length $k$ number
      $\binom{n-2}{k-2}(k-1)!(n-k)!$, and summing over $k$ gives $n!/2$. The
      surprise is that the answer does not shrink with $n$ — long permutations
      have few, long cycles.
    expects: "1/2"
    tolerance: 0.0005
    rubric:
      - >
        Uses the cycle-tracing construction and compares "close" against "step
        to $2$" as two equally likely options at each step.
      - >
        Concludes a value independent of $n$, rather than something decaying
        like $1/n$.
    targets:
      - quant-probability.counting.permutation-cycles

  - id: qcnt-permutation-cycles-02
    kind: work
    difficulty: standard
    statement: >
      How many permutations of $\{1, 2, \dots, 7\}$ factor into exactly two
      cycles, one of length $3$ and one of length $4$?
    answer: >
      $420$. Choose the three elements forming the short cycle in
      $\binom{7}{3} = 35$ ways; the other four are forced into the long cycle.
      A set of $3$ elements can be arranged into a cycle in $(3-1)! = 2$ ways
      and a set of $4$ into $(4-1)! = 6$ ways — the circular-arrangement count,
      because a cycle has no starting point. Multiplying,
      $35 \cdot 2 \cdot 6 = 420$. The general cycle-type formula agrees: for
      distinct cycle lengths the count is
      $n!$ divided by the product of the lengths, here
      $7!/(3 \cdot 4) = 5040/12 = 420$. Since the two lengths differ there is no
      further division for interchangeable cycles; a type such as
      $3 + 3 + 1$ on $7$ elements would additionally need a division by $2!$ for
      the two equal-length cycles.
    expects: "420"
    rubric:
      - >
        Uses $(k-1)!$ for the number of cycles on a chosen set of $k$ elements,
        not $k!$.
      - >
        Does not divide by $2!$ — the two cycles have different lengths and so
        are not interchangeable.
    targets:
      - quant-probability.counting.permutation-cycles

  # --- the birthday problem (landmark) ----------------------------------------

  - id: qcnt-birthday-problem-01
    kind: work
    difficulty: demanding
    statement: >
      Suppose the day of the month on which a person is born is uniform over
      $30$ equally likely values, independently across people. What is the
      smallest group size for which two people sharing a day-of-month is more
      likely than not?
    answer: >
      $7$. The all-distinct probability for $n$ people is the shrinking product
      $\dfrac{30}{30}\cdot\dfrac{29}{30}\cdots\dfrac{30-n+1}{30}$. At $n = 6$ it
      is $\dfrac{29 \cdot 28 \cdot 27 \cdot 26 \cdot 25}{30^{5}} =
      \dfrac{14250600}{24300000} = 0.5864$, so a collision has probability
      $0.4136$ — still under a half. Multiplying by the next factor $24/30 =
      0.8$ gives $0.4692$ at $n = 7$, so the collision probability is $0.5308$
      and the threshold is $n = 7$. The exponential approximation reaches the
      same place in one line: $\Pr(\text{match}) \approx 1 -
      e^{-n(n-1)/60}$, with even odds near $n \approx \sqrt{60 \ln 2} \approx
      6.45$, so the first integer past it is $7$. Note the scale — $7$ people
      for $30$ days, $23$ for $365$ — growing like $\sqrt{N}$, not like $N/2$.
    expects: "7"
    rubric:
      - >
        Multiplies the shrinking factors $(30-i)/30$ rather than treating the
        pairs as independent events.
      - >
        Identifies the first $n$ whose all-distinct probability drops below
        $1/2$, and checks $n - 1$ fails.
    targets:
      - quant-probability.counting.birthday-problem

  - id: qcnt-birthday-problem-02
    kind: work
    difficulty: standard
    statement: >
      With $365$ equally likely birthdays and independence, what is the
      probability that at least two people in a group of $10$ share a birthday?
      Give four decimal places.
    answer: >
      $0.1169$. Count ordered birthday lists: there are $365^{10}$ of them, and
      the all-distinct lists number $365 \cdot 364 \cdots 356$, so
      $\Pr(\text{all distinct}) = \dfrac{365 \cdot 364 \cdots 356}{365^{10}} =
      \prod_{i=1}^{9}\left(1 - \dfrac{i}{365}\right) = 0.8831$, and the answer is
      $1 - 0.8831 = 0.1169$. The approximation confirms the magnitude:
      $\ln\Pr(\text{all distinct}) \approx -n(n-1)/730 = -90/730 = -0.1233$, so
      $\Pr(\text{match}) \approx 1 - e^{-0.1233} = 0.1160$, within a tenth of a
      percentage point. Ten people is well short of even odds — the probability
      climbs steeply because the number of *pairs* grows quadratically, from
      $\binom{10}{2} = 45$ here to $\binom{23}{2} = 253$ at the crossover.
    expects: "0.1169"
    tolerance: 0.0005
    rubric:
      - >
        Computes the all-distinct probability as a product of nine shrinking
        factors and subtracts from $1$.
      - >
        Does not multiply $45$ pairs by $1/365$ and stop — that overestimate,
        $0.1233$, ignores the overlaps between pair events.
    targets:
      - quant-probability.counting.birthday-problem

  - id: qcnt-birthday-problem-03
    kind: work
    difficulty: routine
    statement: >
      With $365$ equally likely birthdays and independence, what is the smallest
      number of people for which the probability that at least two share a
      birthday exceeds one half?
    answer: >
      $23$. The all-distinct probability
      $\dfrac{365!}{(365-n)!\,365^{n}}$ falls below $1/2$ for the first time at
      $n = 23$: at $n = 22$ it is $0.5243$, so a match has probability $0.4757$,
      and at $n = 23$ it is $0.4927$, so a match has probability $0.5073$. The
      number is worth knowing cold because intuition says something near $180$;
      the reason it is so much smaller is that $23$ people supply
      $\binom{23}{2} = 253$ pairs, and $253/365 \approx 0.69$ is already of order
      one. The approximation $1 - e^{-n(n-1)/730}$ puts the crossover at
      $n \approx \sqrt{730 \ln 2} \approx 22.5$, which rounds up to the same
      answer.
    expects: "23"
    rubric:
      - >
        Names $23$, and states the associated probability as just over one half
        rather than exactly one half.
      - >
        Explains the smallness through the $\binom{n}{2}$ pair count rather than
        the $n$ people.
    targets:
      - quant-probability.counting.birthday-problem

  # --- collisions arrive at the square root -----------------------------------

  - id: qcnt-collision-scaling-01
    kind: work
    difficulty: demanding
    statement: >
      A service must mint $10^{9}$ identifiers, each drawn uniformly at random
      from all bit strings of a fixed length $b$. What is the smallest $b$ for
      which the probability of any collision among the $10^{9}$ identifiers
      stays below one half?
    answer: >
      $b = 60$. With $N = 2^{b}$ equally likely values, even odds of a collision
      arrive at about $n \approx 1.177\sqrt{N}$, so staying below one half needs
      $1.177 \cdot 2^{b/2} > 10^{9}$, that is $2^{b/2} > 8.50 \times 10^{8}$ and
      $b/2 > \log_2(8.50 \times 10^{8}) \approx 29.66$, so $b > 59.3$ and the
      smallest integer is $60$. Checking the two candidates directly:
      $b = 59$ gives $1.177\sqrt{2^{59}} \approx 8.94 \times 10^{8}$, short of
      $10^{9}$, so a collision is already more likely than not, while $b = 60$
      gives $1.264 \times 10^{9}$, comfortably past. The lesson is the halved
      exponent: $10^{9}$ identifiers do not need $30$ bits, they need about
      $60$ — the collision scale is $\sqrt{N}$, so the bit budget doubles.
    expects: "60"
    rubric:
      - >
        Sets $1.177\sqrt{2^{b}} > 10^{9}$ rather than $2^{b} > 10^{9}$ — the
        threshold is on the square root of the space.
      - >
        Rounds *up* to the next integer bit count and verifies that the previous
        value fails.
    targets:
      - quant-probability.counting.collision-scaling

  - id: qcnt-collision-scaling-02
    kind: work
    difficulty: standard
    statement: >
      Values are drawn uniformly and independently from a pool of $N = 4096$
      equally likely possibilities. Roughly how many draws are needed before two
      of them coincide with probability about one half?
    answer: >
      About $75$. The rule is $n \approx 1.177\sqrt{N}$, and $\sqrt{4096} = 64$,
      so $n \approx 1.177 \cdot 64 = 75.4$. The derivation behind the constant:
      $n$ draws make $\binom{n}{2}$ pairs, each coinciding with probability
      $1/N$, so $\Pr(\text{no collision}) \approx e^{-n(n-1)/(2N)}$, and setting
      that to $1/2$ gives $n \approx \sqrt{2N\ln 2} = 1.177\sqrt{N}$. Summing
      the exact product $\prod_{i=1}^{n-1}(1 - i/4096)$ crosses one half at
      $n = 76$, so the estimate is off by one draw out of seventy-five. The
      point is the order of magnitude: seventy-odd draws from four thousand
      values, not two thousand.
    expects: "75"
    tolerance: 1.0
    rubric:
      - >
        Uses $1.177\sqrt{N}$ (or $\sqrt{2N \ln 2}$), not $N/2$ and not $\sqrt{N}$
        alone.
      - >
        Evaluates $\sqrt{4096} = 64$ correctly and lands in the mid-seventies.
    targets:
      - quant-probability.counting.collision-scaling

  # --- poker hands ------------------------------------------------------------

  - id: qcnt-poker-hands-01
    kind: work
    difficulty: demanding
    statement: >
      A five-card hand is dealt from a standard $52$-card deck. How many hands
      are flushes — all five cards of one suit — but *not* straight flushes?
    answer: >
      $5108$. Count all one-suited hands first, picking the suit and then the
      five ranks within it: $4\binom{13}{5} = 4 \cdot 1287 = 5148$. That total
      includes the hands whose five ranks also run consecutively, which are
      ranked as straight flushes rather than flushes. Consecutive runs of five
      ranks number $10$ per suit — the lowest starting at ace (ace playing low,
      through $5$) and the highest at $10$ (through ace) — so straight flushes
      number $4 \cdot 10 = 40$. Subtracting, $5148 - 40 = 5108$ flushes proper,
      a probability of $5108/2598960 \approx 0.001965$, about $1$ in $509$. The
      trap is the hidden hypothesis rather than the arithmetic: $\binom{13}{5}$
      counts *all* rank sets, and the hand rankings define a flush as a
      one-suited hand that is not also a straight, so the $40$ must come out.
      Counting $10$ runs, rather than $9$ or $11$, requires deciding the ace's
      double role deliberately.
    expects: "5108"
    rubric:
      - >
        Computes the one-suited total as $4\binom{13}{5}$, choosing ranks after
        the suit.
      - >
        Subtracts the $40$ straight flushes, with the run count $10$ per suit
        justified by letting the ace play both high and low.
    targets:
      - quant-probability.counting.poker-hands

  - id: qcnt-poker-hands-02
    kind: work
    difficulty: standard
    statement: >
      A five-card hand is dealt from a standard $52$-card deck. How many hands
      hold five cards of consecutive rank, with the ace allowed to sit either
      below the $2$ or above the king? Count the hands that happen to be
      single-suited as well.
    answer: >
      $10240$. Follow the discipline of ranks first, suits second. A run of five
      consecutive ranks is fixed by its lowest rank, and the possible lowest
      ranks are ace, $2$, $3$, $\dots$, $10$ — ten of them, since a run starting
      at the jack would need cards above the ace. That is $10$ rank sets. Each
      of the five chosen ranks then contributes one card, freely from any of its
      $4$ suits, giving $4^{5} = 1024$ suit patterns per rank set and
      $10 \cdot 1024 = 10240$ hands in total, a probability of
      $10240/2598960 \approx 0.00394$. Of those, $40$ are single-suited, so
      straights proper number $10240 - 40 = 10200$. Answering
      $13 \cdot 4^{5}$ would allow runs that wrap past the ace, and
      $\binom{13}{5} \cdot 4^{5}$ would abandon consecutiveness entirely.
    expects: "10240"
    rubric:
      - >
        Counts exactly $10$ possible runs, identifying them by lowest rank and
        allowing the ace at both ends without wrapping around.
      - >
        Multiplies by $4^{5}$ for the suits — one free suit per rank, not
        $\binom{4}{5}$ or a single shared suit.
    targets:
      - quant-probability.counting.poker-hands

  # --- the central binomial coefficient ---------------------------------------

  - id: qcnt-central-binomial-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed $100$ times. Using the estimate
      $\binom{2n}{n} \sim 4^{n}/\sqrt{\pi n}$, what is the probability of
      getting exactly $50$ heads? Give four decimal places.
    answer: >
      $0.0798$. The probability is $\binom{100}{50}/2^{100}$. Write
      $n = 50$, so the numerator is the central binomial coefficient
      $\binom{2n}{n}$ and the denominator is $2^{2n} = 4^{n}$; the estimate
      therefore collapses the whole expression to
      $\dfrac{4^{n}/\sqrt{\pi n}}{4^{n}} = \dfrac{1}{\sqrt{\pi n}} =
      \dfrac{1}{\sqrt{50\pi}} = \dfrac{1}{12.533} = 0.0798$, with the enormous
      $4^{50}$ never needing to be evaluated. The exact value is
      $0.07959$, so the estimate is high by about a quarter of a percent. The
      structural reading is worth keeping: the most likely single outcome count
      still carries under $8\%$ of the mass, and its share decays like
      $1/\sqrt{n}$ — which is the counting fact behind a binomial distribution
      being about $\sqrt{n}$ wide rather than concentrated on its mode.
    expects: "0.0798"
    tolerance: 0.0005
    rubric:
      - >
        Recognises $2^{100} = 4^{50}$, so that the $4^{n}$ in the estimate
        cancels and the answer is $1/\sqrt{\pi n}$.
      - >
        Uses $n = 50$, not $n = 100$, in $\sqrt{\pi n}$.
    targets:
      - quant-probability.counting.central-binomial

  - id: qcnt-central-binomial-02
    kind: work
    difficulty: standard
    statement: >
      For large $n$, by what factor does $\binom{2n+2}{n+1}$ exceed
      $\binom{2n}{n}$?
    answer: >
      By a factor approaching $4$. The estimate
      $\binom{2n}{n} \sim 4^{n}/\sqrt{\pi n}$ makes this immediate: the ratio is
      $\dfrac{4^{n+1}/\sqrt{\pi(n+1)}}{4^{n}/\sqrt{\pi n}} =
      4\sqrt{\dfrac{n}{n+1}} \to 4$, since the square-root correction tends to
      $1$. Exactly, the ratio is
      $\dfrac{(2n+2)(2n+1)}{(n+1)^{2}} = \dfrac{2(2n+1)}{n+1}$, which is $4$
      minus a term of order $1/n$ — at $n = 50$ it equals
      $202/51 = 3.9608$, and at $n = 10$ it is $42/11 = 3.818$. So the central
      coefficients grow essentially like $4^{n}$, exactly as the row sum
      $\sum_k \binom{2n}{k} = 4^{n}$ demands, with the $1/\sqrt{\pi n}$ factor
      recording the slowly shrinking share the middle term takes of that row.
    expects: "4"
    rubric:
      - >
        Gets $4$ as the limit, recognising that the $\sqrt{n}$ factors cancel to
        $1$ and leave only the base of $4^{n}$.
      - >
        Confirms with the exact ratio $2(2n+1)/(n+1)$, which approaches $4$ from
        below.
    targets:
      - quant-probability.counting.central-binomial
