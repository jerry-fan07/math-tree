# Problems targeting quant-probability.random-variables.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. See ../README.md.
#
# Every instance here is fresh: none reuses a lesson's worked example or the
# numbers of one of its cards.

problems:
  # --- random variable -------------------------------------------------------

  - id: qrv-rv-01
    kind: work
    difficulty: demanding
    statement: >
      Two fair dice are rolled and $X$ is the absolute difference of the two
      faces shown. What is $\Pr(X \le 1)$?
    answer: >
      $4/9$. $X$ is the function sending the ordered pair $(a,b)$ to
      $\lvert a - b \rvert$, so the probability asked for is the probability of
      the event $\{X \le 1\}$ — the set of ordered pairs that $X$ sends to $0$
      or to $1$. Among the $36$ equally likely pairs, six have $a = b$ and give
      $X = 0$; the pairs at distance one are $(1,2),(2,1),(2,3),(3,2),(3,4),
      (4,3),(4,5),(5,4),(5,6),(6,5)$, ten of them. So $6 + 10 = 16$ outcomes lie
      in the event and $\Pr(X \le 1) = 16/36 = 4/9$. The whole move is the
      translation: a claim about the number $X$ is a claim about a subset of
      $\Omega$, and only there is the counting done.
    expects: "4/9"
    tolerance: 0.0005
    rubric:
      - >
        Treats $X$ as a function on the $36$ ordered pairs rather than as an
        outcome in its own right.
      - >
        Counts the ten ordered pairs at distance $1$ without collapsing $(1,2)$
        and $(2,1)$ into a single outcome.
    targets:
      - quant-probability.random-variables.rv

  - id: qrv-rv-02
    kind: work
    difficulty: standard
    statement: >
      A fair coin is tossed three times. Let $X$ be the number of the toss on
      which the first head appears, with $X = 0$ if no head appears at all. What
      is $\Pr(X = 2)$?
    answer: >
      $1/4$. The experiment has eight equally likely sequences, and $X$ assigns
      a number to each of them: $X = 2$ exactly on the sequences that begin
      $TH$, namely $THH$ and $THT$. So $\Pr(X = 2) = 2/8 = 1/4$. Notice that the
      rule is stated in words and needs a special case — no head at all — yet
      $X$ is a perfectly legitimate random variable, because the definition asks
      only that every outcome of $\Omega$ receive exactly one real number, not
      that the rule be given by a formula.
    expects: "1/4"
    tolerance: 0.0005
    rubric:
      - >
        Identifies $\{X = 2\}$ as the two sequences beginning $TH$, not as the
        single outcome "head on the second toss".
      - >
        Accepts the $X = 0$ convention as part of the function rather than as a
        defect in it.
    targets:
      - quant-probability.random-variables.rv

  # --- cumulative distribution function --------------------------------------

  - id: qrv-cdf-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ has CDF $F(t) = 0$ for $t < 0$, $F(t) = (t+1)/4$ for $0 \le t < 1$,
      and $F(t) = 1$ for $t \ge 1$. What is $\Pr(1/2 < X < 1)$?
    answer: >
      $1/8$. Both inequalities are strict, so the event is
      $\{X < 1\} \setminus \{X \le 1/2\}$ and its probability is
      $F(1^{-}) - F(1/2)$, with the *left* limit at $1$. Here
      $F(1^{-}) = (1+1)/4 = 1/2$ from the middle branch, and
      $F(1/2) = (3/2)/4 = 3/8$, so the answer is $1/2 - 3/8 = 1/8$. Using
      $F(1) - F(1/2) = 5/8$ instead is the trap: $F$ jumps from $1/2$ to $1$ at
      $t = 1$, and that jump is the atom $\Pr(X = 1) = 1/2$, which the strict
      inequality excludes. This law also has an atom at $0$, of size
      $F(0) - F(0^{-}) = 1/4$.
    expects: "1/8"
    tolerance: 0.0005
    rubric:
      - >
        Uses the left-hand limit $F(1^{-})$ at the upper endpoint because the
        inequality there is strict.
      - >
        Identifies the jump at $t = 1$ as the atom $\Pr(X = 1) = 1/2$ and
        excludes it.
    targets:
      - quant-probability.random-variables.cdf

  - id: qrv-cdf-02
    kind: work
    difficulty: standard
    statement: >
      A positive random variable has survival function
      $S(t) = \Pr(X > t) = 1/(1+t)^{2}$ for $t \ge 0$. What is
      $\Pr(1 < X \le 3)$?
    answer: >
      $3/16$. Reading from the right is the whole point of $S$: since
      $F = 1 - S$, the difference $F(3) - F(1)$ equals $S(1) - S(3)$ with the
      $1$s cancelling. So $\Pr(1 < X \le 3) = 1/(1+1)^{2} - 1/(1+3)^{2} =
      1/4 - 1/16 = 3/16$. The interval form $\Pr(a < X \le b) = F(b) - F(a)$ is
      the one that needs no correction, and here $S$ is continuous, so $X$ has
      no atoms and the endpoints could be included or excluded freely.
    expects: "3/16"
    tolerance: 0.0005
    rubric:
      - >
        Converts between $S$ and $F$ correctly, so that the answer comes out as
        $S(1) - S(3)$ rather than $S(3) - S(1)$.
      - >
        Notes that $S$ is continuous, so no endpoint correction is needed.
    targets:
      - quant-probability.random-variables.cdf

  - id: qrv-cdf-03
    kind: decide
    difficulty: routine
    statement: >
      Which of these functions is the CDF of some random variable?
    answer: >
      The staircase-free option that is $0$ below $0$, $t^{2}$ on $[0,1)$ and
      $1$ from $1$ on. A function is a CDF exactly when it is non-decreasing,
      right-continuous, and tends to $0$ at $-\infty$ and to $1$ at $+\infty$;
      that one satisfies all four, and it is the law of a variable with density
      $2t$ on $(0,1)$. Each of the others breaks exactly one of the conditions —
      one goes negative to the left, one fails right-continuity at $0$, and one
      decreases — which is why checking all four properties in turn is faster
      than trying to recognise the law.
    choices:
      - text: >
          $F(t) = 1 - e^{-t}$ for every real $t$
        feedback: >
          Right on $t \ge 0$, but at $t = -1$ it equals $1 - e \approx -1.72$.
          A CDF is a probability, so it can never be negative, and it must tend
          to $0$ rather than to $-\infty$.
      - text: >
          $F(t) = 0$ for $t \le 0$ and $F(t) = 1$ for $t > 0$
        feedback: >
          This fails right-continuity at $0$: $F(0) = 0$ while
          $F(t) \to 1$ as $t \to 0$ from above. The convention $F(t) = \Pr(X \le
          t)$ forces the jump to be closed on the left, so the correct version
          puts $F(0) = 1$.
      - text: >
          $F(t) = 0$ for $t < 0$, $F(t) = t^{2}$ for $0 \le t < 1$, and
          $F(t) = 1$ for $t \ge 1$
        correct: true
        feedback: >
          Non-decreasing, right-continuous, and running from $0$ to $1$ — all
          four properties hold, so some variable has this law.
      - text: >
          $F(t) = 0$ for $t < 0$, $F(t) = 1/2$ for $0 \le t < 1$,
          $F(t) = 1/3$ for $1 \le t < 2$, and $F(t) = 1$ for $t \ge 2$
        feedback: >
          It decreases from $1/2$ to $1/3$ at $t = 1$, which would make
          $\Pr(0 < X \le 1)$ negative. Monotonicity is not optional.
    rubric:
      - >
        Checks all four defining properties rather than stopping at the first
        one that holds.
      - >
        Reads a failure of right-continuity as a failure, not as a harmless
        convention.
    targets:
      - quant-probability.random-variables.cdf

  # --- equality in distribution ----------------------------------------------

  - id: qrv-equality-in-distribution-01
    kind: work
    difficulty: demanding
    statement: >
      $U$ is uniform on $(0,1)$ and $V = 1 - U$. Noting that $U$ and $V$ have
      the same law, a candidate replaces $V$ by an independent copy of $U$ and
      reports $\Pr(U - V > 1/2) = 1/8$. What is the correct value?
    answer: >
      $1/4$. Equality in distribution constrains each variable on its own and
      says nothing about how the two move together, so it cannot be used inside
      an expression that involves both. Here $V$ is a deterministic function of
      $U$: $U - V = U - (1 - U) = 2U - 1$, so $\{U - V > 1/2\}$ is
      $\{U > 3/4\}$, of probability $1/4$. The candidate's $1/8$ is the right
      answer to a different question — for independent $U_1, U_2$ uniform on
      $(0,1)$, $\Pr(U_1 - U_2 > 1/2)$ is the area of the triangle
      $\{u_1 > u_2 + 1/2\}$ in the unit square, with legs $1/2$, so $1/8$. Two
      setups, the same marginals, different answers.
    expects: "1/4"
    tolerance: 0.0005
    rubric:
      - >
        Substitutes $V = 1 - U$ rather than treating $V$ as an independent copy
        of $U$.
      - >
        Names the reason the substitution is illegitimate: $U \sim V$ pins down
        each marginal, not the joint law.
    targets:
      - quant-probability.random-variables.equality-in-distribution

  - id: qrv-equality-in-distribution-02
    kind: work
    difficulty: standard
    statement: >
      A ball is drawn uniformly at random from twenty balls numbered $1$ through
      $20$, and $X$ is the number on it. Let $Y = 21 - X$. What is
      $\Pr(Y \le 6)$?
    answer: >
      $3/10$. The map $x \mapsto 21 - x$ is a bijection of $\{1, \dots, 20\}$
      onto itself, so it relabels the twenty equally likely values without
      changing any probability: $Y$ is again uniform on $\{1, \dots, 20\}$, that
      is $Y \sim X$. The transfer is then free:
      $\Pr(Y \le 6) = \Pr(X \le 6) = 6/20 = 3/10$. Computing directly agrees —
      $Y \le 6$ means $X \ge 15$, which is the six values $15, \dots, 20$, again
      $6/20$. This is equality in distribution used forwards, the direction in
      which it does real work.
    expects: "3/10"
    tolerance: 0.0005
    rubric:
      - >
        Argues that $x \mapsto 21 - x$ permutes the value set, so the uniform
        law is preserved.
      - >
        Concludes $\Pr(Y \le 6) = \Pr(X \le 6)$ from $Y \sim X$, rather than
        from $Y = X$.
    targets:
      - quant-probability.random-variables.equality-in-distribution

  # --- discrete, continuous and mixed ----------------------------------------

  - id: qrv-discrete-vs-continuous-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ has CDF $F(t) = 0$ for $t < 0$, $F(t) = t/2$ for $0 \le t < 1$,
      $F(t) = 3/4$ for $1 \le t < 2$, and $F(t) = 1$ for $t \ge 2$. What is the
      total probability that $X$ places on individual points?
    answer: >
      $1/2$. Atoms are the jumps of $F$, so hunt for them at the two joins. At
      $t = 1$: $F(1^{-}) = 1/2$ from the branch $t/2$, while $F(1) = 3/4$, a
      jump of $1/4$. At $t = 2$: $F(2^{-}) = 3/4$ and $F(2) = 1$, another jump
      of $1/4$. At $t = 0$ the value $F(0) = 0$ matches the limit from the left,
      so there is no atom there. The atoms therefore carry
      $1/4 + 1/4 = 1/2$. The rest is continuous growth: $F$ climbs at rate
      $1/2$ across $(0,1)$, spreading the other $1/2$ as a density, and is flat
      on $[1,2)$, so $X$ never lands strictly between $1$ and $2$. Half discrete
      and half continuous — the law is mixed.
    expects: "1/2"
    tolerance: 0.0005
    rubric:
      - >
        Computes each jump as $F(t) - F(t^{-})$ at the joins, and checks $t = 0$
        as well as $t = 1$ and $t = 2$.
      - >
        Reads the flat stretch on $[1,2)$ as carrying no probability rather than
        as a second atom.
    targets:
      - quant-probability.random-variables.discrete-vs-continuous

  - id: qrv-discrete-vs-continuous-02
    kind: decide
    difficulty: standard
    statement: >
      Which of these variables is mixed — neither discrete nor continuous?
    answer: >
      The knock-out payoff $L\,\mathbf{1}\{L > 3\}$. With $L$ uniform on
      $(0,10)$ it equals $0$ whenever $L \le 3$, an event of probability $0.3$,
      so its CDF jumps by $0.3$ at the single value $0$; on $(3,10)$ it inherits
      $L$'s density of $1/10$, so the remaining $0.7$ is spread continuously.
      Jumps plus continuous growth is exactly the mixed shape. The test is
      always the same: classify by the shape of $F$, not by whether the values
      look like counts or like measurements.
    choices:
      - text: >
          The number of heads in twenty tosses of a fair coin
        feedback: >
          Purely discrete: $F$ is a staircase whose $21$ jumps carry the whole
          probability, with no stretch of continuous growth anywhere.
      - text: >
          $L^{2}$, where $L$ is uniform on $(0,10)$
        feedback: >
          Squaring is strictly increasing and continuous on $(0,10)$, so no
          single value acquires positive probability — $L^{2}$ is still
          continuous, just no longer uniform.
      - text: >
          $L\,\mathbf{1}\{L > 3\}$, where $L$ is uniform on $(0,10)$
        correct: true
        feedback: >
          An atom of $0.3$ at the value $0$ sits on top of a density on
          $(3,10)$ carrying the other $0.7$ — jumps and continuous growth
          together.
    rubric:
      - >
        Classifies by the shape of $F$ — jumps, flats, smooth climbs — rather
        than by whether the values are counts.
      - >
        Recognises that a smooth strictly monotone transformation of a
        continuous variable stays continuous.
    targets:
      - quant-probability.random-variables.discrete-vs-continuous

  # --- probability mass function ---------------------------------------------

  - id: qrv-pmf-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ takes the values $1, 2, 3, \dots$ with
      $p(x) = \dfrac{c}{x(x+1)}$. What is $\Pr(X \le 3)$?
    answer: >
      $3/4$. Normalisation fixes $c$ first, and the sum telescopes:
      $\dfrac{1}{x(x+1)} = \dfrac{1}{x} - \dfrac{1}{x+1}$, so the partial sums
      are $\sum_{x=1}^{n}\left(\dfrac{1}{x} - \dfrac{1}{x+1}\right) =
      1 - \dfrac{1}{n+1}$, which tends to $1$. The weights already sum to $1$,
      so $c = 1$. Then $p(1) = 1/2$, $p(2) = 1/6$, $p(3) = 1/12$, and
      $\Pr(X \le 3) = 6/12 + 2/12 + 1/12 = 9/12 = 3/4$. The telescoped partial
      sum gives the same thing in one step: $F(3) = 1 - 1/4 = 3/4$, which is
      also the check that no probability has gone missing.
    expects: "3/4"
    tolerance: 0.0005
    rubric:
      - >
        Sums the infinite family by telescoping rather than by truncating it.
      - >
        Concludes $c = 1$ from $\sum_{x \ge 1} p(x) = 1$ before computing any
        probability.
    targets:
      - quant-probability.random-variables.pmf

  - id: qrv-pmf-02
    kind: work
    difficulty: standard
    statement: >
      A box holds four red balls and six blue balls. Three are drawn without
      replacement and $X$ counts the red ones among them. What is
      $p(2) = \Pr(X = 2)$?
    answer: >
      $3/10$. Choosing the three balls uniformly from the $\binom{10}{3} = 120$
      possible sets, the sets with exactly two red are counted by picking which
      two reds, $\binom{4}{2} = 6$ ways, and which single blue,
      $\binom{6}{1} = 6$ ways: $36$ of them. So $p(2) = 36/120 = 3/10$. The
      whole pmf is $p(0) = 20/120$, $p(1) = 60/120$, $p(2) = 36/120$,
      $p(3) = 4/120$, which sums to $120/120 = 1$ — the check that the list of
      weights really is a law and not just four plausible fractions.
    expects: "3/10"
    tolerance: 0.0005
    rubric:
      - >
        Counts unordered draws consistently in numerator and denominator.
      - >
        Verifies that the four weights sum to $1$.
    targets:
      - quant-probability.random-variables.pmf

  # --- probability density function ------------------------------------------

  - id: qrv-pdf-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ has density $f(x) = c\,(1 - x^{2})$ on $(-1,1)$ and $0$ elsewhere.
      What is $\Pr(\lvert X \rvert < 1/2)$?
    answer: >
      $11/16$. Normalise first:
      $\int_{-1}^{1}(1 - x^{2})\,dx = \left[x - \dfrac{x^{3}}{3}\right]_{-1}^{1}
      = 2 - \dfrac{2}{3} = \dfrac{4}{3}$, so $c = 3/4$. Then
      $\Pr(\lvert X \rvert < 1/2) = \dfrac{3}{4}\int_{-1/2}^{1/2}(1 - x^{2})\,dx
      = \dfrac{3}{4}\cdot 2\left(\dfrac{1}{2} - \dfrac{1}{24}\right)
      = \dfrac{3}{4}\cdot\dfrac{11}{12} = \dfrac{11}{16} = 0.6875$. Two things
      worth noticing: the peak value $c = 3/4$ is below $1$ here only by
      accident of the support's width, and $\lvert X \rvert < 1/2$ and
      $\lvert X \rvert \le 1/2$ have the same probability, because a density
      gives every single point probability $0$.
    expects: "11/16"
    tolerance: 0.0005
    rubric:
      - >
        Finds $c$ from $\int f = 1$ before computing any probability.
      - >
        Integrates over $(-1/2, 1/2)$, using the symmetry or the antiderivative,
        rather than over $(0,1/2)$ alone.
    targets:
      - quant-probability.random-variables.pdf

  - id: qrv-pdf-02
    kind: work
    difficulty: standard
    statement: >
      $X$ has density $f(x) = 2(1 - x)$ on $(0,1)$ and $0$ elsewhere. What is
      $\Pr(X > 1/3)$?
    answer: >
      $4/9$. The density is legitimate: $f \ge 0$ on $(0,1)$ and
      $\int_{0}^{1} 2(1-x)\,dx = \left[-(1-x)^{2}\right]_{0}^{1} = 0 + 1 = 1$.
      The same antiderivative gives the tail directly:
      $\Pr(X > 1/3) = \int_{1/3}^{1} 2(1-x)\,dx =
      \left[-(1-x)^{2}\right]_{1/3}^{1} = 0 + \left(\dfrac{2}{3}\right)^{2}
      = \dfrac{4}{9}$. Sanity check on the shape: the density is largest near
      $0$ and falls to $0$ at $1$, so more than half the mass should sit below
      $1/3$ — and indeed $1 - 4/9 = 5/9 > 1/2$.
    expects: "4/9"
    tolerance: 0.0005
    rubric:
      - >
        Integrates the density over $(1/3, 1)$ rather than evaluating $f$ at a
        point.
      - >
        Checks the total integral is $1$, or checks the answer against the shape
        of $f$.
    targets:
      - quant-probability.random-variables.pdf

  - id: qrv-pdf-03
    kind: work
    difficulty: routine
    statement: >
      $X$ is uniform on $(2,8)$, so $f(x) = 1/6$ there and $0$ elsewhere. What
      is $\Pr(X = 5) + \Pr(3 \le X \le 5)$?
    answer: >
      $1/3$. The first term is $\int_{5}^{5} f(x)\,dx = 0$: a continuous
      variable places no probability on any single value, which is exactly why
      strict and weak inequalities agree for such laws. The second term is the
      area of a rectangle of width $5 - 3 = 2$ and height $1/6$, namely
      $2/6 = 1/3$. So the sum is $0 + 1/3 = 1/3$. Note that the density value
      $1/6$ is not itself a probability of anything — only areas under $f$
      are — and that $\Pr(3 < X < 5)$ would come out the same.
    expects: "1/3"
    tolerance: 0.0005
    rubric:
      - >
        States $\Pr(X = 5) = 0$ and justifies it by the vanishing integral, not
        by "$5$ is impossible".
      - >
        Computes the interval probability as an area, so that the width and the
        height both appear.
    targets:
      - quant-probability.random-variables.pdf

  # --- a density is a rate ---------------------------------------------------

  - id: qrv-density-not-probability-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is continuous with a density $f$ that is continuous near $3$, and a
      simulation reports $\Pr(2.998 < X < 3.002) = 0.0016$. Estimate $f(3)$.
    answer: >
      $0.4$. The local reading of a density is
      $\Pr(x < X \le x + dx) \approx f(x)\,dx$, so over a short interval the
      probability is roughly the density times the width. Here the width is
      $3.002 - 2.998 = 0.004$, so $f(3) \approx 0.0016/0.004 = 0.4$. The number
      to resist is $0.0016$ itself: that is a probability, and $f(3)$ is a rate
      — probability per unit of $x$ — obtained by dividing by the width. The
      units make the point. Rescale the axis to thousandths of the current unit
      and the same interval becomes $4$ units wide, the probability stays
      $0.0016$, and the density becomes $0.0004$: only areas survive a change of
      units, never the height.
    expects: "0.4"
    tolerance: 0.0005
    rubric:
      - >
        Divides the probability by the width of the interval rather than
        reporting the probability as the density.
      - >
        States the local approximation $\Pr(x < X \le x + dx) \approx f(x)\,dx$
        as the reason.
    targets:
      - quant-probability.random-variables.density-not-probability

  - id: qrv-density-not-probability-02
    kind: decide
    difficulty: standard
    statement: >
      $X$ is a continuous random variable with density $f$. Which statement is
      correct?
    answer: >
      That $\Pr(X = 3) = 0$ and yet $X = 3$ is not impossible. Every single
      value of a continuous variable has probability $0$, since
      $\int_{3}^{3} f = 0$, and yet the experiment always produces some value —
      so the set of outcomes with probability zero is not the empty set.
      Impossibility is a statement about $\Omega$; probability zero is a
      statement about measure, and for continuous laws the two come apart. The
      other trap is reading $f(3)$ as a probability: $f$ is probability per unit
      of $x$, so its value moves when the units of $x$ move, while a probability
      does not.
    choices:
      - text: >
          $\Pr(X = 3) = 0$, so the outcome $X = 3$ can never occur
        feedback: >
          Probability zero is not impossibility. Every value has probability
          $0$ here, and yet one of them occurs on every run of the experiment.
      - text: >
          $\Pr(X = 3) = 0$, and yet the outcome $X = 3$ is not impossible
        correct: true
        feedback: >
          The integral over a single point vanishes, but the union of all those
          probability-zero values is the whole line.
      - text: >
          $f(3) = \Pr(X = 3)$
        feedback: >
          A density is a rate, not a probability: switch the units of $x$ and
          $f(3)$ changes, while any probability stays where it was. And
          $\Pr(X = 3)$ is $0$ while $f(3)$ generally is not.
    rubric:
      - >
        Separates "probability zero" from "impossible" and says which one
        $\Pr(X = 3) = 0$ asserts.
      - >
        Rejects $f(3) = \Pr(X = 3)$ on the grounds that $f$ carries units.
    targets:
      - quant-probability.random-variables.density-not-probability

  # --- quantiles and the median ----------------------------------------------

  - id: qrv-quantiles-01
    kind: work
    difficulty: demanding
    statement: >
      A discrete variable has $p(1) = 0.2$, $p(3) = 0.3$ and $p(4) = 0.5$. What
      is the median $q(0.5)$?
    answer: >
      $3$. The CDF is $F(1) = 0.2$, $F(3) = 0.5$, $F(4) = 1$, and the quantile
      is $q(u) = \inf\{x : F(x) \ge u\}$. At $u = 0.5$ the value $x = 1$ fails
      because $0.2 < 0.5$, while $x = 3$ succeeds because $F(3) = 0.5 \ge 0.5$ —
      the inequality in the definition is not strict, which is the whole point
      of the case where $u$ lands exactly on a value of $F$. So $q(0.5) = 3$.
      The two tempting wrong answers both come from importing intuition that
      does not apply: $3.5$ averages the two "middle" values as one would for a
      data sample, and $4$ comes from demanding $F(x) > 0.5$ strictly. Note that
      here $\Pr(X \le 3) = 0.5$ and $\Pr(X \ge 3) = 0.8$, so the median is not
      forced to split the mass evenly.
    expects: "3"
    rubric:
      - >
        Uses $F(x) \ge u$ with a weak inequality, so a value where $F$ hits $u$
        exactly qualifies.
      - >
        Takes the infimum of the qualifying set rather than averaging two
        candidate values.
    targets:
      - quant-probability.random-variables.quantiles

  - id: qrv-quantiles-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is a positive random variable whose CDF is continuous and strictly
      increasing, and its median is $16$. What is the median of $\sqrt{X}$?
    answer: >
      $4$. Quantiles commute with increasing transformations. If $g$ is
      continuous and strictly increasing then $\{g(X) \le g(x)\} = \{X \le x\}$,
      so $F_{g(X)}(g(x)) = F_X(x)$ and the generalized inverse carries across:
      $q_{g(X)}(u) = g(q_X(u))$ for every $u$. With $g(x) = \sqrt{x}$ and
      $u = 1/2$ this gives $\operatorname{med}(\sqrt{X}) =
      \sqrt{\operatorname{med}(X)} = \sqrt{16} = 4$. Directly:
      $\Pr(\sqrt{X} \le 4) = \Pr(X \le 16) = 1/2$. This is a property averages
      lack — the mean of $\sqrt{X}$ is not the square root of the mean of $X$ —
      and it is why medians are the quantity that survives a change of scale
      such as taking logarithms.
    expects: "4"
    rubric:
      - >
        Invokes the equivariance $q_{g(X)}(u) = g(q_X(u))$ for increasing $g$,
        or re-derives it from $\{\sqrt{X} \le 4\} = \{X \le 16\}$.
      - >
        Does not attempt to average or transform in the way a mean would
        require.
    targets:
      - quant-probability.random-variables.quantiles

  # --- symmetric laws --------------------------------------------------------

  - id: qrv-symmetric-01
    kind: work
    difficulty: demanding
    statement: >
      A loss $X$ has a continuous, strictly increasing CDF and is symmetric
      about $20$. Its $0.05$-quantile is $8$. What is its $0.95$-quantile?
    answer: >
      $32$. Symmetry about $c$ means $X - c$ and $c - X$ have the same law, so
      $F(c + t) = 1 - F(c - t)$ for every $t$ when $F$ is continuous. Applying
      the quantile function to that identity pairs the two tails:
      $q(u) + q(1-u) = 2c$. With $c = 20$ and $q(0.05) = 8$ we get
      $q(0.95) = 40 - 8 = 32$. Read on the picture: $8$ sits $12$ below the
      centre, so its mirror image sits $12$ above it. One tail prices the other,
      which is exactly how a symmetric risk model turns a single quoted
      $\operatorname{VaR}$ into both ends of the interval.
    expects: "32"
    rubric:
      - >
        Uses the pairing $q(u) + q(1-u) = 2c$, or the reflection
        $F(c+t) = 1 - F(c-t)$ that produces it.
      - >
        Measures the distance from the centre of symmetry rather than from $0$.
    targets:
      - quant-probability.random-variables.symmetric

  - id: qrv-symmetric-02
    kind: work
    difficulty: standard
    statement: >
      A fair coin is tossed six times and $N$ counts the heads, so
      $\Pr(N = 3) = 5/16$. What is $\Pr(N \ge 4)$?
    answer: >
      $11/32$. Swapping the labels heads and tails is a relabelling of the
      experiment that preserves probabilities and sends $N$ to $6 - N$, so
      $N \sim 6 - N$: the law is symmetric about $c = 3$. Symmetry gives
      $\Pr(N > 3) = \Pr(N < 3)$, and since the three events
      $\{N < 3\}$, $\{N = 3\}$, $\{N > 3\}$ partition everything,
      $\Pr(N \ge 4) = \Pr(N > 3) = \dfrac{1 - \Pr(N = 3)}{2}
      = \dfrac{1 - 5/16}{2} = \dfrac{11/16}{2} = \dfrac{11}{32}$. The check by
      enumeration agrees: $(15 + 6 + 1)/64 = 22/64 = 11/32$. The atom at the
      centre has to be removed before halving — that is where the answer $1/2$
      comes from.
    expects: "11/32"
    tolerance: 0.0005
    rubric:
      - >
        Identifies the symmetry as $N \sim 6 - N$, from swapping the two
        labels.
      - >
        Removes the central atom before halving, giving
        $(1 - \Pr(N = 3))/2$ rather than $1/2$.
    targets:
      - quant-probability.random-variables.symmetric

  - id: qrv-symmetric-03
    kind: justify
    difficulty: standard
    statement: >
      Let $X$ be symmetric about $c$, meaning that $X - c$ and $c - X$ have the
      same law. Prove that $\Pr(X > c) = \Pr(X < c)$, and deduce that $c$ is a
      median of $X$ — without assuming $\Pr(X = c) = 0$.
    answer: >
      Write $Y = X - c$, so the hypothesis is $Y \sim -Y$. Then
      $\Pr(X > c) = \Pr(Y > 0) = \Pr(-Y > 0) = \Pr(Y < 0) = \Pr(X < c)$, where
      the middle equality is equality in distribution applied to the set
      $(0, \infty)$ and the next one just rewrites $-Y > 0$ as $Y < 0$. Call
      this common value $\alpha$. Since $\{Y < 0\}$, $\{Y = 0\}$, $\{Y > 0\}$
      partition $\Omega$, $2\alpha + \Pr(X = c) = 1$, so
      $\alpha = (1 - \Pr(X = c))/2$. For the median, add the atom back on each
      side: $\Pr(X \le c) = \alpha + \Pr(X = c) = (1 + \Pr(X = c))/2 \ge 1/2$,
      and by the same arithmetic $\Pr(X \ge c) = \alpha + \Pr(X = c) \ge 1/2$.
      Both inequalities hold at once, which is exactly what it means for $c$ to
      be a median — and when $\Pr(X = c) = 0$ they are both equalities. Note
      that the argument never needed a density,
      or continuity, or a strictly increasing $F$ — only the distributional
      identity.
    rubric:
      - >
        Derives $\Pr(X > c) = \Pr(X < c)$ from equality in distribution applied
        to a set, not from a picture of a symmetric density.
      - >
        Handles the atom at $c$ explicitly, so the conclusion is
        $\Pr(X \le c) \ge 1/2$ and $\Pr(X \ge c) \ge 1/2$ rather than an
        equality.
    targets:
      - quant-probability.random-variables.symmetric

  # --- indicators ------------------------------------------------------------

  - id: qrv-indicator-01
    kind: work
    difficulty: demanding
    statement: >
      Events $A$ and $B$ have $\Pr(A) = 0.7$, $\Pr(B) = 0.4$ and
      $\Pr(A \cap B) = 0.3$. Define
      $Z = \mathbf{1}\{A\}\,\mathbf{1}\{B\} +
      (1 - \mathbf{1}\{A\})(1 - \mathbf{1}\{B\})$, which registers whether $A$
      and $B$ agree. What is $\Pr(Z = 1)$?
    answer: >
      $0.5$. Read the algebra one term at a time. The first product is
      $\mathbf{1}\{A\}\,\mathbf{1}\{B\} = \mathbf{1}\{A \cap B\}$, and the
      second is $\mathbf{1}\{A^{c}\}\,\mathbf{1}\{B^{c}\} =
      \mathbf{1}\{A^{c} \cap B^{c}\} = \mathbf{1}\{(A \cup B)^{c}\}$, using
      $\mathbf{1}\{A^{c}\} = 1 - \mathbf{1}\{A\}$ and De Morgan. The two events
      are disjoint, so $Z$ takes only the values $0$ and $1$ — it is itself an
      indicator, of the event that $A$ and $B$ agree — and
      $\Pr(Z = 1) = \Pr(A \cap B) + \Pr((A \cup B)^{c})$. Inclusion-exclusion
      gives $\Pr(A \cup B) = 0.7 + 0.4 - 0.3 = 0.8$, hence
      $\Pr((A \cup B)^{c}) = 0.2$, and $\Pr(Z = 1) = 0.3 + 0.2 = 0.5$. So $Z$ is
      Bernoulli with parameter $0.5$, and the two events were no more likely to
      agree than a coin flip.
    expects: "0.5"
    tolerance: 0.0005
    rubric:
      - >
        Converts each product of indicators into the indicator of an
        intersection, and $1 - \mathbf{1}\{A\}$ into $\mathbf{1}\{A^{c}\}$.
      - >
        Notes the two events are disjoint, so the probabilities add and $Z$ is
        itself an indicator.
    targets:
      - quant-probability.random-variables.indicator

  - id: qrv-indicator-02
    kind: work
    difficulty: standard
    statement: >
      $A_1, A_2, A_3$ are pairwise disjoint events, each of probability $0.2$,
      and $N = \mathbf{1}\{A_1\} + \mathbf{1}\{A_2\} + \mathbf{1}\{A_3\}$ counts
      how many of them occur. What is $\Pr(N = 0)$?
    answer: >
      $0.4$. Every count is a sum of indicators, and here disjointness makes the
      count easy: at most one of the three events can occur, so $N$ takes only
      the values $0$ and $1$. Then $\{N \ge 1\} = A_1 \cup A_2 \cup A_3$, whose
      probability is $0.2 + 0.2 + 0.2 = 0.6$ by finite additivity — no
      inclusion-exclusion correction, because the pairwise intersections are
      empty. Hence $\Pr(N = 0) = 1 - 0.6 = 0.4$. Worth noticing: with disjoint
      events the sum of indicators is again an indicator, namely
      $\mathbf{1}\{A_1 \cup A_2 \cup A_3\}$; drop disjointness and $N$ can reach
      $2$ or $3$ and the union probability falls below $0.6$.
    expects: "0.4"
    tolerance: 0.0005
    rubric:
      - >
        Uses disjointness to add the three probabilities without an
        inclusion-exclusion correction.
      - >
        Identifies $\{N \ge 1\}$ with the union of the three events.
    targets:
      - quant-probability.random-variables.indicator

  # --- a capped payoff is a mixed law ----------------------------------------

  - id: qrv-mixed-01
    kind: work
    difficulty: demanding
    statement: >
      A collar pays $X = \min(\max(Y, 2), 7)$, where $Y$ is uniform on $(0,10)$
      — a floor at $2$ and a cap at $7$. What is the $0.8$-quantile of $X$?
    answer: >
      $7$. Build $F_X$ first. For $t < 2$, $\Pr(X \le t) = 0$, because $X$ is
      never below the floor. For $2 \le t < 7$, $X \le t$ exactly when
      $Y \le t$, so $F_X(t) = t/10$. For $t \ge 7$, $F_X(t) = 1$. The law is
      mixed on both ends: an atom $\Pr(X = 2) = \Pr(Y \le 2) = 0.2$, a density
      of $1/10$ across $(2,7)$ carrying $0.5$, and an atom
      $\Pr(X = 7) = \Pr(Y \ge 7) = 0.3$. Now
      $q(0.8) = \inf\{x : F_X(x) \ge 0.8\}$. Just below the cap $F_X$ has only
      reached $0.7$, and at $x = 7$ it is $1$, so the infimum is $7$. Solving
      $t/10 = 0.8$ to get $8$ is the trap: the linear branch is valid only up to
      the cap, and $X$ never exceeds $7$ at all.
    expects: "7"
    rubric:
      - >
        Writes $F_X$ piecewise and identifies both atoms, at the floor and at
        the cap.
      - >
        Reads $q(0.8)$ off the jump at the cap instead of extending the linear
        branch past $t = 7$.
    targets:
      - quant-probability.random-variables.mixed

  - id: qrv-mixed-02
    kind: work
    difficulty: standard
    statement: >
      A policy reimburses a loss $L$, uniform on $(0,8)$, only in excess of a
      deductible of $2$: the payment is $B = \max(L - 2, 0)$. What is the median
      of $B$?
    answer: >
      $2$. The deductible creates an atom at zero:
      $\Pr(B = 0) = \Pr(L \le 2) = 2/8 = 1/4$. Above it, for $0 \le t \le 6$,
      $F_B(t) = \Pr(L \le t + 2) = (t+2)/8$, a straight climb from $1/4$ at
      $t = 0$ to $1$ at $t = 6$ — so $B$ carries a density of $1/8$ on $(0,6)$
      holding the other $3/4$. The median is the smallest $t$ with
      $F_B(t) \ge 1/2$; since the atom only reaches $1/4 < 1/2$, the median sits
      in the continuous part, and $(t+2)/8 = 1/2$ gives $t = 2$. Had the
      deductible been large enough for the atom to exceed $1/2$, the median
      would have been $0$ — the atom, not the linear branch, would have decided
      it.
    expects: "2"
    rubric:
      - >
        Computes the atom $\Pr(B = 0)$ and checks whether it already reaches
        $1/2$ before solving on the continuous part.
      - >
        Uses $F_B(t) = \Pr(L \le t + 2)$, shifting by the deductible rather than
        rescaling.
    targets:
      - quant-probability.random-variables.mixed

  # --- the CDF method --------------------------------------------------------

  - id: qrv-cdf-method-01
    kind: decide
    difficulty: demanding
    statement: >
      $X$ is uniform on $(-3,1)$ and $Y = X^{2}$. Which is the density of $Y$?
    answer: >
      $f_Y(y) = \dfrac{1}{4\sqrt{y}}$ on $(0,1)$ and $\dfrac{1}{8\sqrt{y}}$ on
      $(1,9)$. Work through the CDF. For $0 < y < 1$ the inequality
      $x^{2} \le y$ describes $[-\sqrt{y}, \sqrt{y}]$, which lies wholly inside
      the support, so $F_Y(y) = 2\sqrt{y}/4 = \sqrt{y}/2$ and differentiating
      gives $1/(4\sqrt{y})$. For $1 \le y < 9$ the upper root $\sqrt{y}$ has
      passed the right end of the support, so the set is really
      $[-\sqrt{y}, 1)$, of length $1 + \sqrt{y}$, giving
      $F_Y(y) = (1 + \sqrt{y})/4$ and density $1/(8\sqrt{y})$. Half the mass
      sits in each piece: $\int_{0}^{1} 1/(4\sqrt{y})\,dy = 1/2$ and
      $\int_{1}^{9} 1/(8\sqrt{y})\,dy = 3/4 - 1/4 = 1/2$, which is the check
      that the break at $y = 1$ was put in the right place. Fixing the range of
      $y$ before differentiating is the whole discipline here.
    choices:
      - text: >
          $\dfrac{1}{4\sqrt{y}}$ on $(0,9)$
        feedback: >
          Correct only below $y = 1$. Past that, one of the two roots
          $\pm\sqrt{y}$ has left the support, so only one contributes; this
          formula double-counts and integrates to $3/2$, not $1$.
      - text: >
          $\dfrac{1}{4\sqrt{y}}$ on $(0,1)$ and $\dfrac{1}{8\sqrt{y}}$ on
          $(1,9)$
        correct: true
        feedback: >
          Two roots below $y = 1$, one above, so the density halves exactly at
          the break — and each piece carries mass $1/2$.
      - text: >
          $\dfrac{1}{8\sqrt{y}}$ on $(0,1)$ and $\dfrac{1}{4\sqrt{y}}$ on
          $(1,9)$
        feedback: >
          The pieces are swapped. It is the small values of $y$ that receive
          contributions from both $+\sqrt{y}$ and $-\sqrt{y}$, so the density is
          larger, not smaller, there.
      - text: >
          $\dfrac{1}{2\sqrt{y}}$ on $(0,1)$ and $0$ elsewhere
        feedback: >
          That is the answer for $X$ uniform on $(-1,1)$. This support runs to
          $-3$, so $Y$ reaches all the way to $9$ and none of the mass above
          $y = 1$ may be discarded.
    rubric:
      - >
        Solves $x^{2} \le y$ as a set and intersects it with the support before
        differentiating.
      - >
        Splits the range of $y$ at $1$, where the interval stops being
        symmetric.
      - >
        Checks that the two pieces integrate to $1$ in total.
    targets:
      - quant-probability.random-variables.cdf-method

  - id: qrv-cdf-method-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is uniform on $(-2,2)$ and $Y = X^{2}$. What is $\Pr(Y \le 2.25)$?
    answer: >
      $0.75$. Do not reach for a change-of-variables formula: $g(x) = x^{2}$ is
      not one-to-one on $(-2,2)$, so solve the inequality as a set instead.
      $Y \le 2.25$ means $x^{2} \le 2.25$, that is
      $-1.5 \le X \le 1.5$, an interval of length $3$ sitting inside a support
      of length $4$. With $X$ uniform, $\Pr(Y \le 2.25) = 3/4 = 0.75$. The
      symmetric support is what keeps this a single case — both roots
      $\pm 1.5$ are available — whereas an asymmetric support would force the
      range of $y$ to be split.
    expects: "0.75"
    tolerance: 0.0005
    rubric:
      - >
        Translates $\{Y \le 2.25\}$ into the interval $[-1.5, 1.5]$ for $X$
        rather than taking a single square root.
      - >
        Measures that interval against the full support $(-2,2)$.
    targets:
      - quant-probability.random-variables.cdf-method

  # --- change of variables for monotone g ------------------------------------

  - id: qrv-transformation-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is uniform on $(0,1)$ and $Y = \dfrac{X}{1 - X}$, the odds
      corresponding to a probability drawn at random. What is $f_Y(3)$?
    answer: >
      $1/16$. Check the hypotheses first: on $(0,1)$ the map
      $g(x) = x/(1-x)$ is differentiable with
      $g'(x) = 1/(1-x)^{2} > 0$, so it is strictly increasing, and it carries
      $(0,1)$ onto $(0,\infty)$. Invert: $y = x/(1-x)$ gives
      $x = g^{-1}(y) = \dfrac{y}{1+y}$, and
      $(g^{-1})'(y) = \dfrac{(1+y) - y}{(1+y)^{2}} = \dfrac{1}{(1+y)^{2}}$.
      Since $f_X \equiv 1$ on $(0,1)$, the change-of-variables formula gives
      $f_Y(y) = 1 \cdot \dfrac{1}{(1+y)^{2}}$ for $y > 0$, so
      $f_Y(3) = 1/16 = 0.0625$. Two checks: the density integrates to
      $\left[-1/(1+y)\right]_{0}^{\infty} = 1$, and
      $\Pr(Y > 1) = \Pr(X > 1/2) = 1/2$ matches
      $\int_{1}^{\infty}(1+y)^{-2}\,dy = 1/2$.
    expects: "1/16"
    tolerance: 0.0005
    rubric:
      - >
        Verifies that $g$ is strictly monotone and differentiable on the support
        before applying the formula.
      - >
        Differentiates $g^{-1}$ rather than $g$, and evaluates the result at
        $y = 3$ rather than at $x = 3$.
    targets:
      - quant-probability.random-variables.transformation

  - id: qrv-transformation-02
    kind: decide
    difficulty: standard
    statement: >
      $X$ is uniform on $(0,1)$ and $Y = e^{X}$. Which is the density of $Y$?
    answer: >
      $f_Y(y) = 1/y$ on $(1, e)$, and $0$ elsewhere. The exponential is strictly
      increasing and differentiable, and it carries $(0,1)$ onto $(1,e)$ — so
      the support of $Y$ is $(1,e)$, not $(0,1)$. Inverting, $x = \ln y$ with
      $(g^{-1})'(y) = 1/y$, and since $f_X \equiv 1$ the formula gives
      $f_Y(y) = f_X(\ln y)\cdot(1/y) = 1/y$ there. The check is immediate:
      $\int_{1}^{e} dy/y = \ln e - \ln 1 = 1$. Equivalently
      $f_Y(y) = f_X(x)/\lvert g'(x)\rvert$ at $x = \ln y$, and
      $g'(x) = e^{x} = y$.
    choices:
      - text: >
          $f_Y(y) = 1/y$ on $(1, e)$
        correct: true
        feedback: >
          Right support and right stretch factor: $g$ maps $(0,1)$ onto
          $(1,e)$, and $\lvert g' \rvert = e^{x} = y$ divides the density there.
      - text: >
          $f_Y(y) = 1/y$ on $(0, 1)$
        feedback: >
          The formula is right but the support is not: $Y = e^{X}$ can never be
          less than $1$. And $\int_{0}^{1} dy/y$ diverges, so this is not a
          density at all.
      - text: >
          $f_Y(y) = e^{y}$ on $(1, e)$
        feedback: >
          This multiplies by the stretch factor instead of dividing by it, and
          evaluates it at $y$ rather than at $x = \ln y$. Where $g$ spreads
          values apart the density must thin, not thicken.
      - text: >
          $f_Y(y) = \ln y$ on $(1, e)$
        feedback: >
          That substitutes $g^{-1}$ itself where the formula asks for its
          derivative. The Jacobian factor is $(g^{-1})'(y) = 1/y$.
    rubric:
      - >
        Gets the support $g(I) = (1,e)$ right, not just the algebraic form.
      - >
        Divides by the local stretch factor, evaluated at $x = g^{-1}(y)$.
    targets:
      - quant-probability.random-variables.transformation

  # --- affine maps -----------------------------------------------------------

  - id: qrv-linear-transformation-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ has a continuous, strictly increasing CDF with $q_X(0.1) = 2$ and
      $q_X(0.9) = 14$. Let $Y = -5X + 100$. What is $q_Y(0.9)$?
    answer: >
      $90$. The slope is negative, so the affine map reverses order and the
      quantiles pair up the other way round:
      $q_Y(u) = a\,q_X(1-u) + b$ when $a < 0$. Here
      $q_Y(0.9) = -5\,q_X(0.1) + 100 = -5(2) + 100 = 90$. Directly, for
      $a < 0$: $\Pr(Y \le y) = \Pr(-5X + 100 \le y) = \Pr\!\left(X \ge
      \dfrac{y - 100}{-5}\right) = 1 - F_X\!\left(\dfrac{y-100}{-5}\right)$
      for a continuous $F_X$, and setting that to $0.9$ needs
      $F_X((y-100)/(-5)) = 0.1$, that is $(y-100)/(-5) = 2$, so $y = 90$. The
      trap is $-5\,q_X(0.9) + 100 = 30$: multiplying by a negative number sends
      the upper tail of $X$ to the *lower* tail of $Y$, and $30$ is in fact
      $q_Y(0.1)$.
    expects: "90"
    rubric:
      - >
        Uses $q_Y(u) = a\,q_X(1-u) + b$ for $a < 0$, or re-derives the order
        reversal from $\Pr(Y \le y)$.
      - >
        Reports $90$ rather than $30$, and can say that $30$ is $q_Y(0.1)$.
    targets:
      - quant-probability.random-variables.linear-transformation

  - id: qrv-linear-transformation-02
    kind: work
    difficulty: standard
    statement: >
      $X$ has a density $f_X$ with $f_X(3) = 0.4$. Let $Y = 2X - 1$. What is
      $f_Y(5)$?
    answer: >
      $0.2$. For $Y = aX + b$ the density is
      $f_Y(y) = \dfrac{1}{\lvert a \rvert} f_X\!\left(\dfrac{y - b}{a}\right)$.
      Here $a = 2$ and $b = -1$, and $y = 5$ corresponds to
      $x = (5 + 1)/2 = 3$, the one point where $f_X$ is given. So
      $f_Y(5) = \dfrac{1}{2} f_X(3) = 0.2$. The division by
      $\lvert a \rvert$ is the stretch: doubling every value spreads the same
      probability over twice as much length, so the height must halve. Note the
      answer needs $f_X$ at $3$, not at $5$ — finding the matching $x$ first is
      the step that is skipped most often.
    expects: "0.2"
    tolerance: 0.0005
    rubric:
      - >
        Maps $y = 5$ back to $x = 3$ before evaluating $f_X$.
      - >
        Divides by $\lvert a \rvert = 2$ rather than multiplying by it.
    targets:
      - quant-probability.random-variables.linear-transformation

  # --- probability integral transform ----------------------------------------

  - id: qrv-pit-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ has density $f(x) = 1/2$ on $(0,1)$ and on $(2,3)$, and $0$
      elsewhere — so its CDF is continuous but flat across $[1,2]$. Let
      $U = F(X)$. What is $\Pr(U \le 0.7)$?
    answer: >
      $0.7$. The probability integral transform needs only that $F$ be
      continuous; it does not need $F$ to be strictly increasing, so the flat
      stretch is not an obstacle and $U$ is uniform on $[0,1]$, giving
      $\Pr(U \le 0.7) = 0.7$ immediately. Confirming it by hand:
      $F(x) = x/2$ on $[0,1]$, $F(x) = 1/2$ on $[1,2]$, and
      $F(x) = (x-1)/2$ on $[2,3]$. Then $q(0.7)$ solves $(x-1)/2 = 0.7$, giving
      $x = 2.4$, and since $F$ is non-decreasing
      $\{F(X) \le 0.7\} = \{X \le 2.4\}$ up to a probability-zero set, whose
      probability is $F(2.4) = 0.7$. The flat stretch costs nothing precisely
      because $X$ lands in $[1,2]$ with probability $0$.
    expects: "0.7"
    tolerance: 0.0005
    rubric:
      - >
        States that continuity of $F$, not strict monotonicity, is the
        hypothesis the theorem needs.
      - >
        Explains why the flat stretch is harmless — $X$ falls in it with
        probability $0$.
    targets:
      - quant-probability.random-variables.pit

  - id: qrv-pit-02
    kind: work
    difficulty: standard
    statement: >
      $X$ has CDF $F(x) = 1 - (1-x)^{4}$ on $[0,1]$. A uniform draw returns
      $U = 0.9375$ and the inverse-transform method reports $X = q(U)$. What is
      $X$?
    answer: >
      $0.5$. The converse half of the transform says that if $U$ is uniform on
      $(0,1)$ then $q(U)$ has CDF $F$, so simulating $X$ is a matter of
      inverting $F$. Here $F$ is continuous and strictly increasing on $[0,1]$,
      so $q = F^{-1}$: solve $1 - (1-x)^{4} = 0.9375$, giving
      $(1-x)^{4} = 0.0625 = 1/16$, so $1 - x = (1/16)^{1/4} = 1/2$ and
      $x = 0.5$. The sanity check is that $F(0.5) = 1 - (0.5)^{4} = 0.9375$
      returns the $U$ we started from. This direction, unlike the forward one,
      needs no continuity at all — $q$ is defined for every law, which is why
      one uniform stream can generate samples from anything.
    expects: "0.5"
    tolerance: 0.0005
    rubric:
      - >
        Inverts $F$ rather than evaluating it, so the fourth root is taken of
        $0.0625$ and not of $0.9375$.
      - >
        Checks the answer by pushing $0.5$ back through $F$.
    targets:
      - quant-probability.random-variables.pit

  - id: qrv-pit-03
    kind: decide
    difficulty: routine
    statement: >
      For which of these variables is $F(X)$ uniform on $[0,1]$, where $F$ is
      that variable's own CDF?
    answer: >
      The one with density $1/3$ on $(0,1)$ and on $(4,6)$. The forward
      transform needs exactly one hypothesis — that $F$ be continuous,
      equivalently that $X$ have no atoms — and a law with a gap in its support
      still has a continuous $F$; the flat stretch of $F$ across $[1,4]$ is
      visited with probability $0$, so it does nothing. The other two both carry
      atoms, and an atom of size $p$ in the law of $X$ becomes an atom of size
      $p$ in the law of $F(X)$, which a uniform does not have.
    choices:
      - text: >
          $X$ uniform on $\{1, 2, \dots, 6\}$, a fair die
        feedback: >
          $F$ is a staircase, so $F(X)$ takes only the six values
          $1/6, 2/6, \dots, 1$, each with probability $1/6$ — as far from
          uniform on $[0,1]$ as a law can be.
      - text: >
          $X = \min(Z, 1)$, where $Z$ is uniform on $(0,2)$
        feedback: >
          The cap puts an atom of $1/2$ at the value $1$, so $F$ jumps there and
          $F(X)$ inherits an atom of $1/2$ at $1$.
      - text: >
          $X$ with density $1/3$ on $(0,1)$ and on $(4,6)$
        correct: true
        feedback: >
          $F$ is continuous — a flat stretch is fine, only a jump is fatal — so
          the forward transform applies exactly as stated.
    rubric:
      - >
        Names continuity of $F$ (no atoms) as the hypothesis, and does not
        additionally demand that $F$ be strictly increasing.
      - >
        Traces an atom in the law of $X$ to an atom in the law of $F(X)$.
    targets:
      - quant-probability.random-variables.pit

  # --- maxima and minima -----------------------------------------------------

  - id: qrv-min-max-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ and $Y$ are independent, $X$ uniform on $(0,1)$ and $Y$ uniform on
      $(0,2)$. What is $\Pr(\min(X, Y) > 1/2)$?
    answer: >
      $3/8$. Minima multiply survival functions:
      $\{\min(X,Y) > t\} = \{X > t\} \cap \{Y > t\}$, and independence
      factorises the intersection, so
      $\Pr(\min(X,Y) > t) = (1 - F_X(t))(1 - F_Y(t))$. The two variables are
      not identically distributed, so the two factors must be computed
      separately: $\Pr(X > 1/2) = 1/2$ from the support of length $1$, and
      $\Pr(Y > 1/2) = 1.5/2 = 3/4$ from the support of length $2$. The product
      is $(1/2)(3/4) = 3/8$. Using $(1 - F(1/2))^{2}$ with a single common $F$
      would be the error to avoid here; the iid formula is a special case, not
      the rule.
    expects: "3/8"
    tolerance: 0.0005
    rubric:
      - >
        Writes $\{\min > t\}$ as the intersection of the two tail events before
        using independence.
      - >
        Computes the two survival probabilities separately, since the supports
        differ.
    targets:
      - quant-probability.random-variables.min-max
    exercises:
      - quant-probability.foundations.independence-events

  - id: qrv-min-max-02
    kind: work
    difficulty: standard
    statement: >
      $X_1, \dots, X_4$ are independent and identically distributed with CDF
      $F(t) = t^{2}$ on $(0,1)$. What is $\Pr(\min_i X_i > 1/2)$?
    answer: >
      $81/256$. The minimum exceeds $t$ exactly when every draw does, so
      $\Pr(\min_i X_i > t) = (1 - F(t))^{4}$ in the iid case. Here
      $F(1/2) = (1/2)^{2} = 1/4$, so the common survival probability is
      $1 - 1/4 = 3/4$ and the answer is $(3/4)^{4} = 81/256 \approx 0.3164$.
      Note what would happen with the maximum instead:
      $\Pr(\max_i X_i \le 1/2) = F(1/2)^{4} = 1/256$, a very different number —
      maxima multiply CDFs, minima multiply survival functions, and mixing the
      two up is the standard slip.
    expects: "81/256"
    tolerance: 0.0005
    rubric:
      - >
        Multiplies survival probabilities, not CDF values, for the minimum.
      - >
        Evaluates $F(1/2) = 1/4$ from the given CDF rather than assuming a
        uniform law.
    targets:
      - quant-probability.random-variables.min-max

  - id: qrv-min-max-03
    kind: justify
    difficulty: standard
    statement: >
      Let $X_1, \dots, X_n$ be independent with CDFs $F_1, \dots, F_n$, and put
      $M = \max_i X_i$ and $m = \min_i X_i$. Derive
      $F_M(t) = \prod_i F_i(t)$ and $F_m(t) = 1 - \prod_i (1 - F_i(t))$, and say
      exactly where independence is used and what fails without it.
    answer: >
      For the maximum, the largest value is at most $t$ precisely when every
      value is: $\{M \le t\} = \bigcap_i \{X_i \le t\}$. This step is pure set
      theory and holds for any variables at all. Independence then factorises
      the probability of the intersection,
      $\Pr\!\left(\bigcap_i \{X_i \le t\}\right) = \prod_i \Pr(X_i \le t) =
      \prod_i F_i(t)$, which is the only place it is used. For the minimum,
      complement first: $\{m > t\} = \bigcap_i \{X_i > t\}$, again by set
      theory, so $\Pr(m > t) = \prod_i (1 - F_i(t))$ by the same factorisation,
      and $F_m(t) = 1 - \Pr(m > t)$ gives the stated form. Without independence
      the intersection simply does not factor. Take $n = 2$ with
      $X_2 = X_1$, both with CDF $F$: then $M = X_1$, so $F_M = F$, whereas the
      product formula would claim $F^{2}$ — and these differ everywhere
      $0 < F(t) < 1$. The direction of the error is instructive too:
      positively dependent variables have maxima that are stochastically
      smaller than the independent formula predicts, because the draws fail to
      explore separately.
    rubric:
      - >
        Separates the set identity $\{M \le t\} = \bigcap_i \{X_i \le t\}$, true
        always, from the factorisation, which needs independence.
      - >
        Handles the minimum through its survival function rather than trying to
        intersect $\{X_i \le t\}$ events.
      - >
        Gives a concrete dependent counterexample showing the product formula
        fails.
    targets:
      - quant-probability.random-variables.min-max

  # --- maximum of uniforms ---------------------------------------------------

  - id: qrv-max-of-uniforms-01
    kind: work
    difficulty: demanding
    statement: >
      Seven independent uniform $(0,1)$ draws are taken and $M$ is the largest.
      What is the $95$th percentile of $M$? Give four decimal places.
    answer: >
      $0.9927$. The CDF of the maximum is $F_M(t) = t^{7}$ on $[0,1]$, and it is
      continuous and strictly increasing there, so the $95$th percentile solves
      $t^{7} = 0.95$ exactly: $t = 0.95^{1/7} = \exp\!\left(\dfrac{\ln
      0.95}{7}\right) = \exp(-0.0073276) = 0.992699\dots$, which rounds to
      $0.9927$. Note how compressed the law is against the ceiling — the median
      of $M$ is $2^{-1/7} \approx 0.9057$, so half of $M$'s distribution is
      squeezed into the last $9.4\%$ of the range and the top twentieth of it
      into the last $0.73\%$. The reflex answer $0.95$ is the percentile of a
      single draw, not of the largest of seven.
    expects: "0.9927"
    tolerance: 0.0005
    rubric:
      - >
        Solves $t^{7} = 0.95$ rather than $t = 0.95$ or $7t = 0.95$.
      - >
        Takes the seventh root of $0.95$, not of $0.05$.
    targets:
      - quant-probability.random-variables.max-of-uniforms

  - id: qrv-max-of-uniforms-02
    kind: work
    difficulty: standard
    statement: >
      Three independent uniform $(0,1)$ draws are taken and $M$ is the largest.
      What is $\Pr(M \le 0.7)$?
    answer: >
      $0.343$. The maximum is at most $0.7$ exactly when all three draws are, so
      by independence $\Pr(M \le 0.7) = \Pr(X_1 \le 0.7)^{3} = 0.7^{3} = 0.343$
      — maxima multiply CDFs, and for a uniform on $(0,1)$ the CDF is just
      $F(t) = t$. The complementary reading is
      $\Pr(M > 0.7) = 0.657$: with only three draws it is already better than
      even money that one of them clears $0.7$, which is the crowding towards
      the top of the range that this family is famous for. The mistake to avoid
      is $3 \times 0.7$, which is not even a probability.
    expects: "0.343"
    tolerance: 0.0005
    rubric:
      - >
        Cubes the CDF value rather than multiplying it by $3$.
      - >
        Uses $F(t) = t$ for a uniform on $(0,1)$.
    targets:
      - quant-probability.random-variables.max-of-uniforms

  # --- order statistics ------------------------------------------------------

  - id: qrv-order-statistics-01
    kind: work
    difficulty: demanding
    statement: >
      $X_1, \dots, X_4$ are iid with CDF $F(x) = 1 - 1/x$ for $x \ge 1$. What is
      $\Pr(X_{(3)} \le 2)$, where $X_{(3)}$ is the third smallest of the four?
    answer: >
      $5/16$. Use the binomial-count form rather than integrating a density.
      Saying $X_{(3)} \le 2$ is saying that at least three of the four draws
      landed at or below $2$, and each draw does so independently with
      probability $F(2) = 1 - 1/2 = 1/2$. So the count of draws below $2$ is
      binomial with $n = 4$ and $p = 1/2$, and
      $\Pr(X_{(3)} \le 2) = \binom{4}{3}(1/2)^{3}(1/2)^{1} +
      \binom{4}{4}(1/2)^{4} = \dfrac{4}{16} + \dfrac{1}{16} = \dfrac{5}{16}$.
      The tempting error is to compute only the $j = 3$ term: "exactly three
      below" is not the event, because a fourth draw below $2$ still leaves the
      third smallest below $2$.
    expects: "5/16"
    tolerance: 0.0005
    rubric:
      - >
        Translates $\{X_{(3)} \le x\}$ into "at least three draws are at most
        $x$", and sums $j = 3$ and $j = 4$.
      - >
        Evaluates $F(2) = 1/2$ from the given CDF before counting.
    targets:
      - quant-probability.random-variables.order-statistics
    exercises:
      - quant-probability.counting.combinations

  - id: qrv-order-statistics-02
    kind: work
    difficulty: standard
    statement: >
      $X_1, \dots, X_5$ are iid with CDF $F$ and density $f$. At a point $x$
      where $F(x) = 1/2$ and $f(x) = 2$, what is $f_{(2)}(x)$, the density of
      the second smallest?
    answer: >
      $2.5$. The order-statistic density is
      $f_{(k)}(x) = \dfrac{n!}{(k-1)!\,(n-k)!}\,F(x)^{k-1}(1 - F(x))^{n-k}
      f(x)$. With $n = 5$ and $k = 2$ the constant is
      $\dfrac{5!}{1!\,3!} = \dfrac{120}{6} = 20$ — one draw sits at $x$, one of
      the remaining four falls below it, and three fall above. Substituting,
      $f_{(2)}(x) = 20 \cdot (1/2)^{1} \cdot (1/2)^{3} \cdot 2 =
      20 \cdot \dfrac{1}{16} \cdot 2 = 2.5$. The exponents are the count worth
      checking: $k - 1 = 1$ below and $n - k = 3$ above, which is why the second
      smallest of five is pushed towards the lower end of the range.
    expects: "2.5"
    tolerance: 0.0005
    rubric:
      - >
        Uses $n!/((k-1)!\,(n-k)!)$ with $k - 1$ below and $n - k$ above, not
        $\binom{n}{k}$.
      - >
        Includes the factor $f(x)$ as well as the two powers of $F$ and
        $1 - F$.
    targets:
      - quant-probability.random-variables.order-statistics

  # --- uniform order statistics ----------------------------------------------

  - id: qrv-uniform-order-statistics-01
    kind: work
    difficulty: demanding
    statement: >
      Five independent uniform $(0,1)$ draws are taken. What is
      $\Pr(X_{(2)} > 1/2)$, where $X_{(2)}$ is the second smallest?
    answer: >
      $3/16$. Uniform draws make $F(x) = x$, so the density of the second
      smallest of five is
      $f_{(2)}(x) = \dfrac{5!}{1!\,3!}\,x(1-x)^{3} = 20x(1-x)^{3}$ on $(0,1)$.
      Then $\Pr(X_{(2)} > 1/2) = \int_{1/2}^{1} 20x(1-x)^{3}\,dx$, and
      substituting $u = 1 - x$ turns it into
      $\int_{0}^{1/2} 20(1-u)u^{3}\,du =
      20\left[\dfrac{u^{4}}{4} - \dfrac{u^{5}}{5}\right]_{0}^{1/2} =
      20\left(\dfrac{1}{64} - \dfrac{1}{160}\right) = 20 \cdot \dfrac{3}{320} =
      \dfrac{3}{16}$. The counting route confirms it without any integral:
      $X_{(2)} > 1/2$ says at most one of the five draws is below $1/2$, so the
      probability is $\dfrac{\binom{5}{0} + \binom{5}{1}}{2^{5}} =
      \dfrac{6}{32} = \dfrac{3}{16}$.
    expects: "3/16"
    tolerance: 0.0005
    rubric:
      - >
        Builds $f_{(2)}(x) = 20x(1-x)^{3}$ from the general formula with
        $F(x) = x$, or reasons directly with the binomial count.
      - >
        Integrates over $(1/2, 1)$, or counts "at most one draw below $1/2$",
        rather than "exactly one".
    targets:
      - quant-probability.random-variables.uniform-order-statistics
    exercises:
      - quant-probability.random-variables.order-statistics

  - id: qrv-uniform-order-statistics-02
    kind: work
    difficulty: standard
    statement: >
      Five independent uniform $(0,1)$ draws are taken. What is
      $f_{(4)}(1/2)$, the density of the fourth smallest at the point $1/2$?
    answer: >
      $1.25$. With $F(x) = x$ and $f(x) = 1$ the general formula collapses to
      $f_{(k)}(x) = \dfrac{n!}{(k-1)!\,(n-k)!}\,x^{k-1}(1-x)^{n-k}$, the Beta
      family. For $n = 5$ and $k = 4$ the constant is
      $\dfrac{5!}{3!\,1!} = \dfrac{120}{6} = 20$, and the density is
      $20x^{3}(1-x)$ on $(0,1)$. At $x = 1/2$ this is
      $20 \cdot \dfrac{1}{8} \cdot \dfrac{1}{2} = \dfrac{20}{16} = 1.25$. The
      shape says the rest: $20x^{3}(1-x)$ peaks at $x = 3/4$, which is where the
      fourth smallest of five draws is most likely to sit — high in the range,
      but not as high as $4/5$, because one draw always remains above it.
    expects: "1.25"
    tolerance: 0.0005
    rubric:
      - >
        Uses exponents $k - 1 = 3$ on $x$ and $n - k = 1$ on $1 - x$, in that
        order.
      - >
        Computes the constant as $5!/(3!\,1!) = 20$ rather than as
        $\binom{5}{4} = 5$.
    targets:
      - quant-probability.random-variables.uniform-order-statistics
