# Problems targeting quant-probability.conditioning — conditional expectation,
# the tower property, total variance and random sums.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. Every instance here is fresh: no
# problem reuses a lesson's worked example or a card's numbers. See ../README.md.

problems:
  # --- conditioning on an event ----------------------------------------------

  - id: qcnd-conditional-given-event-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed five times and $X$ counts the heads. Given that at
      least one head appears, what is the expected number of heads?
    answer: >
      $80/31 \approx 2.5806$. Use
      $\mathbb{E}[X \mid A] = \mathbb{E}[X\mathbf{1}\{A\}]/\Pr(A)$ with
      $A = \{X \ge 1\}$. The numerator costs nothing: $X\mathbf{1}\{A\}$ and $X$
      differ only on $\{X = 0\}$, where $X$ is already $0$, so
      $\mathbb{E}[X\mathbf{1}\{A\}] = \mathbb{E}[X] = 5/2$. The denominator is
      $\Pr(X \ge 1) = 1 - (1/2)^{5} = 31/32$. Hence
      $\mathbb{E}[X \mid A] = (5/2)(32/31) = 80/31$. Two traps sit either side of
      it. Reporting $2.5$ keeps the numerator and forgets to renormalise — the
      division by $\Pr(A)$ is the whole content of conditioning. Reporting $3$
      conditions on the wrong event: "at least one head" is not "the first toss
      is a head", and only the second lets you set one head aside and add
      $4 \times 1/2$ to it.
    expects: "80/31"
    tolerance: 0.0005
    rubric:
      - >
        Notices that $\mathbb{E}[X\mathbf{1}\{A\}] = \mathbb{E}[X]$ here,
        because $X$ vanishes on $A^{c}$.
      - >
        Divides by $\Pr(A) = 31/32$ rather than reporting the unconditional
        mean $5/2$.
      - >
        Does not silently replace $\{X \ge 1\}$ by "the first toss is a head".
    targets:
      - quant-probability.conditioning.conditional-given-event
    exercises:
      - quant-probability.expectation.expectation

  - id: qcnd-conditional-given-event-02
    kind: work
    difficulty: standard
    statement: >
      A ticket is drawn uniformly from those numbered $1$ through $12$. Given
      that the number drawn divides $12$ exactly, what is its expected value?
    answer: >
      $14/3 \approx 4.6667$. Conditioning on an event with equally likely
      outcomes is restriction plus renormalisation, and nothing else. The
      divisors of $12$ inside the range are $1, 2, 3, 4, 6, 12$, so $\Pr(A) =
      6/12 = 1/2$ and, given $A$, each of those six tickets carries conditional
      probability $1/6$. The conditional mean is therefore
      $(1 + 2 + 3 + 4 + 6 + 12)/6 = 28/6 = 14/3$. The formula route agrees:
      $\mathbb{E}[X\mathbf{1}\{A\}] = 28/12 = 7/3$ and dividing by $\Pr(A) =
      1/2$ doubles it to $14/3$. Stopping at $7/3$ is the classic slip — that
      number weights the divisors against the *original* twelve tickets, which
      is the answer to "what does a random ticket contribute", not "what does a
      divisor average".
    expects: "14/3"
    tolerance: 0.0005
    rubric:
      - >
        Lists the six divisors and treats them as equally likely inside $A$.
      - >
        Divides by $\Pr(A) = 1/2$, so the answer is $14/3$ and not $7/3$.
    targets:
      - quant-probability.conditioning.conditional-given-event

  # --- the conditional law given a variable -----------------------------------

  - id: qcnd-conditional-distribution-01
    kind: work
    difficulty: demanding
    statement: >
      Let $Y \sim \operatorname{Uniform}(0,1)$ and, given $Y = y$, let
      $X \sim \operatorname{Uniform}(0,y)$. What is $\mathbb{E}[Y \mid X = 1/2]$?
    answer: >
      $0.7213$. Build the joint density from the hierarchy:
      $f(x,y) = f_{X \mid Y}(x \mid y)f_Y(y) = 1/y$ on the wedge
      $0 < x < y < 1$. To reverse the conditioning, first marginalise out $y$:
      $f_X(x) = \int_x^1 (1/y)\,dy = -\ln x$ for $0 < x < 1$. Then
      $f_{Y \mid X}(y \mid x) = (1/y)/(-\ln x)$ on $(x, 1)$, and the $1/y$
      cancels against the $y$ in the integrand:
      $\mathbb{E}[Y \mid X = x] = \int_x^1 y \cdot (1/y)/(-\ln x)\,dy =
      (1-x)/(-\ln x)$. At $x = 1/2$ this is $0.5/\ln 2 \approx 0.7213$. The trap
      is answering $0.75$, the midpoint of $(1/2, 1)$: the conditional law of
      $Y$ given $X$ is *not* uniform, because small values of $Y$ concentrate
      their mass on a shorter interval and so explain the observation
      $X = 1/2$ better.
    expects: "0.7213"
    tolerance: 0.0005
    rubric:
      - >
        Writes the joint density as $f_{X \mid Y}f_Y = 1/y$ on the wedge, not
        as a product of marginals.
      - >
        Marginalises to $f_X(x) = -\ln x$ before forming the reversed ratio.
      - >
        Does not assume the conditional law of $Y$ given $X$ is uniform.
    targets:
      - quant-probability.conditioning.conditional-distribution
    exercises:
      - quant-probability.joint.joint-law

  - id: qcnd-conditional-distribution-02
    kind: work
    difficulty: standard
    statement: >
      A pair $(X, Y)$ has $\Pr(X=1, Y=0) = 0.10$, $\Pr(X=2, Y=0) = 0.20$,
      $\Pr(X=3, Y=0) = 0.10$, $\Pr(X=1, Y=1) = 0.30$, $\Pr(X=2, Y=1) = 0.15$
      and $\Pr(X=3, Y=1) = 0.15$. What is $\mathbb{E}[X \mid Y = 0]$?
    answer: >
      $2$. Slice the joint table at $Y = 0$ and renormalise. The marginal is
      $p_Y(0) = 0.10 + 0.20 + 0.10 = 0.40$, so the conditional pmf is
      $p_{X \mid Y}(1 \mid 0) = 0.10/0.40 = 0.25$,
      $p_{X \mid Y}(2 \mid 0) = 0.20/0.40 = 0.50$ and
      $p_{X \mid Y}(3 \mid 0) = 0.10/0.40 = 0.25$ — a legitimate distribution
      summing to $1$. Averaging, $\mathbb{E}[X \mid Y = 0] = 1(0.25) + 2(0.50)
      + 3(0.25) = 2$. Skipping the renormalisation and averaging $x$ against the
      raw joint probabilities gives $0.8$, which is $\mathbb{E}[X\mathbf{1}\{Y =
      0\}]$ — a perfectly meaningful number, but not a conditional mean. The
      other slice, $\mathbb{E}[X \mid Y = 1] = 1.75$, shows the two slices are
      genuinely different laws.
    expects: "2"
    rubric:
      - >
        Computes the marginal $p_Y(0) = 0.40$ and divides each joint
        probability by it.
      - >
        Checks the conditional pmf sums to $1$ before averaging, so the answer
        is $2$ and not $0.8$.
    targets:
      - quant-probability.conditioning.conditional-distribution

  # --- E[X|Y] as a random variable -------------------------------------------

  - id: qcnd-conditional-expectation-01
    kind: work
    difficulty: demanding
    statement: >
      Let $U_1$ and $U_2$ be independent $\operatorname{Uniform}(0,1)$ variables
      and let $M = \max(U_1, U_2)$. What is $\mathbb{E}[U_1 \mid M = 0.8]$?
    answer: >
      $0.6$. Work out the conditional law first. Given $M = m$, symmetry says
      $U_1$ is the maximum with probability $1/2$, in which case $U_1 = m$
      exactly; otherwise $U_1$ is the smaller of the two, and conditionally it
      is uniform on $(0, m)$ with mean $m/2$. So
      $\mathbb{E}[U_1 \mid M = m] = \tfrac{1}{2}m + \tfrac{1}{2}(m/2) = 3m/4$,
      and $\mathbb{E}[U_1 \mid M] = 3M/4$ — a random variable, a function of $M$
      alone. Evaluating the function at $m = 0.8$ gives $0.6$. Two checks. The
      tower property returns $\mathbb{E}[U_1] = (3/4)\mathbb{E}[M] = (3/4)(2/3)
      = 1/2$, as it must. And $0.8$ is the wrong answer for the wrong reason:
      it conditions on "$U_1$ is the larger", a strictly finer piece of
      information than the value of the maximum.
    expects: "0.6"
    rubric:
      - >
        Splits on which variable attains the maximum, using symmetry to give
        each case probability $1/2$.
      - >
        Uses that the loser is conditionally uniform on $(0, m)$, contributing
        $m/2$.
      - >
        Reports $\mathbb{E}[U_1 \mid M] = 3M/4$ as a function of $M$ and only
        then evaluates it.
    targets:
      - quant-probability.conditioning.conditional-expectation

  - id: qcnd-conditional-expectation-02
    kind: work
    difficulty: standard
    statement: >
      A bag holds three red and five blue chips. Two are drawn without
      replacement. Let $Y$ be $1$ if the first chip is red and $0$ otherwise,
      and let $X$ be the total number of red chips drawn. What is
      $\mathbb{E}[X \mid Y = 1]$?
    answer: >
      $9/7 \approx 1.2857$. Given $Y = 1$ the first chip is red and already
      contributes $1$ to $X$, so $X = 1 + \mathbf{1}\{\text{second is red}\}$.
      After the first red is removed the bag holds two red and five blue chips,
      so the second draw is red with conditional probability $2/7$. Therefore
      $\mathbb{E}[X \mid Y = 1] = 1 + 2/7 = 9/7$. The number to compare it with
      is $\mathbb{E}[X] = 2(3/8) = 3/4$ by linearity and symmetry: the
      conditional forecast $\mathbb{E}[X \mid Y]$ takes the value $9/7$ when
      $Y = 1$ and $\mathbb{E}[X \mid Y = 0] = 3/7$ when $Y = 0$, and averaging
      those two with weights $3/8$ and $5/8$ returns $3/4$. Reporting $2(2/7)$
      is the standard slip — it re-randomises the first chip after conditioning
      on it.
    expects: "9/7"
    tolerance: 0.0005
    rubric:
      - >
        Treats the first chip as known, so it contributes exactly $1$ rather
        than a probability.
      - >
        Updates the bag to two red and five blue before pricing the second
        draw.
    targets:
      - quant-probability.conditioning.conditional-expectation

  - id: qcnd-conditional-expectation-03
    kind: decide
    difficulty: standard
    statement: >
      Let $X$ be the face of a fair six-sided die and let $Y$ be the number of
      heads in two tosses of a fair coin, independent of the die. A candidate
      writes $\mathbb{E}[X + Y \mid Y] = 4.5$. What is the verdict?
    answer: >
      Wrong: $\mathbb{E}[X + Y \mid Y] = 3.5 + Y$, a random variable, and $4.5$
      is its expectation rather than its value. Linearity splits the conditional
      mean into $\mathbb{E}[X \mid Y] + \mathbb{E}[Y \mid Y]$. The first term
      collapses to the constant $\mathbb{E}[X] = 3.5$ because the die and the
      coins are independent; the second is $Y$ itself, since anything already
      determined by $Y$ passes through untouched. So the answer moves with the
      data: it is $3.5$ when $Y = 0$, $4.5$ when $Y = 1$ and $5.5$ when
      $Y = 2$. The candidate has computed
      $\mathbb{E}[\mathbb{E}[X + Y \mid Y]] = 3.5 + 1 = 4.5$, which is the
      tower property applied one step too early — the whole point of
      $\mathbb{E}[\,\cdot \mid Y]$ is that it is not yet averaged over $Y$.
    choices:
      - text: >
          Wrong — the correct value is $3.5 + Y$, and $4.5$ is its
          unconditional average
        correct: true
        feedback: >
          $\mathbb{E}[Y \mid Y] = Y$, so the answer is a function of $Y$; the
          tower property turns it into $4.5$ only after averaging.
      - text: >
          Right — the die and the coins are independent, so conditioning on $Y$
          changes nothing
        feedback: >
          Independence collapses $\mathbb{E}[X \mid Y]$ to $3.5$, but it says
          nothing about the $Y$ term, which is known exactly once $Y$ is.
      - text: >
          Wrong — the correct value is $3.5Y$
        feedback: >
          Linearity adds the two conditional means; nothing here multiplies
          them.
      - text: >
          Right, provided the coin is tossed before the die is rolled
        feedback: >
          The order is irrelevant. $\mathbb{E}[X + Y \mid Y]$ is a function of
          $Y$ whatever the timing.
    rubric:
      - >
        Splits by linearity and applies $\mathbb{E}[h(Y) \mid Y] = h(Y)$ to the
        second term.
      - >
        Names $4.5$ correctly as $\mathbb{E}[\mathbb{E}[X + Y \mid Y]]$, the
        tower average, not the conditional expectation itself.
    targets:
      - quant-probability.conditioning.conditional-expectation

  # --- the four rules ---------------------------------------------------------

  - id: qcnd-conditional-expectation-rules-01
    kind: work
    difficulty: demanding
    statement: >
      Let $Y$ be uniform on $\{1,2,3,4\}$ and let $W$ be independent of $Y$ with
      $\mathbb{E}[W] = 3$ and $\mathbb{E}[W^{2}] = 13$. What is
      $\mathbb{E}[(Y + W)^{2} \mid Y]$ evaluated at $Y = 2$?
    answer: >
      $29$. Expand first, then apply the rules term by term:
      $(Y+W)^{2} = Y^{2} + 2YW + W^{2}$. Linearity splits the conditional mean
      into three pieces. The first, $\mathbb{E}[Y^{2} \mid Y] = Y^{2}$, passes
      through untouched because it is already a function of $Y$. The second uses
      taking out what is known and then independence:
      $\mathbb{E}[2YW \mid Y] = 2Y\,\mathbb{E}[W \mid Y] = 2Y\,\mathbb{E}[W] =
      6Y$. The third is a constant, $\mathbb{E}[W^{2} \mid Y] =
      \mathbb{E}[W^{2}] = 13$. So $\mathbb{E}[(Y+W)^{2} \mid Y] = Y^{2} + 6Y +
      13$, and at $Y = 2$ that is $4 + 12 + 13 = 29$. The trap is squaring the
      conditional mean instead of conditioning the square: $(\mathbb{E}[Y + W
      \mid Y])^{2} = (Y+3)^{2} = 25$ at $Y = 2$, and the missing $4$ is exactly
      $\operatorname{Var}(W) = 13 - 9$.
    expects: "29"
    rubric:
      - >
        Expands the square before conditioning, rather than conditioning and
        then squaring.
      - >
        Uses taking out what is known on the cross term and independence to
        replace $\mathbb{E}[W \mid Y]$ by $\mathbb{E}[W]$.
    targets:
      - quant-probability.conditioning.conditional-expectation-rules
    exercises:
      - quant-probability.conditioning.conditional-expectation

  - id: qcnd-conditional-expectation-rules-02
    kind: decide
    difficulty: standard
    statement: >
      $X$ is independent of $Y$ with $\mathbb{E}[X] = 2$. A candidate simplifies
      $\mathbb{E}[e^{Y} + XY \mid Y]$ to $\mathbb{E}[e^{Y}] + 2Y$. What is wrong
      with it?
    answer: >
      The first term should stay $e^{Y}$: anything already determined by $Y$ is
      a constant once $Y$ is known, so $\mathbb{E}[e^{Y} \mid Y] = e^{Y}$ and
      averaging it away is exactly the move the conditioning forbids. The second
      term is right — taking out what is known gives
      $\mathbb{E}[XY \mid Y] = Y\,\mathbb{E}[X \mid Y]$ and independence
      collapses $\mathbb{E}[X \mid Y]$ to $2$, so that piece is $2Y$. The
      correct simplification is $e^{Y} + 2Y$, a random variable. The candidate's
      version is a hybrid: it averages one function of $Y$ out and keeps the
      other in, which no rule licenses. A useful sanity check is that the answer
      must be a function of $Y$ alone, and $\mathbb{E}[e^{Y}]$ is a number.
    choices:
      - text: >
          The first term: $\mathbb{E}[e^{Y} \mid Y] = e^{Y}$, so the answer is
          $e^{Y} + 2Y$
        correct: true
        feedback: >
          A function of $Y$ passes through conditioning on $Y$ untouched — that
          is rule four, and it is the rule the candidate skipped.
      - text: >
          The second term: it should be $2\mathbb{E}[Y]$
        feedback: >
          $Y$ is known once you condition on $Y$, so it stays as $Y$; averaging
          it would erase the very information being conditioned on.
      - text: >
          Nothing — both terms are correctly simplified
        feedback: >
          $\mathbb{E}[e^{Y}]$ is a number, so the candidate's expression mixes a
          constant with a function of $Y$ for no reason.
      - text: >
          The two terms should be multiplied, not added, since $X$ and $Y$ are
          independent
        feedback: >
          Linearity of conditional expectation splits a sum into a sum;
          independence has nothing to do with the operation between terms.
    rubric:
      - >
        Applies $\mathbb{E}[h(Y) \mid Y] = h(Y)$ to the exponential term rather
        than averaging it.
      - >
        Confirms the $XY$ term is handled correctly by taking out what is known
        plus independence.
    targets:
      - quant-probability.conditioning.conditional-expectation-rules

  # --- probabilities are expectations of indicators ---------------------------

  - id: qcnd-indicator-conditional-01
    kind: work
    difficulty: demanding
    statement: >
      Three cards are dealt in order from a well-shuffled standard $52$-card
      deck. Let $Y$ be the number of hearts among the first two cards and let
      $A$ be the event that the third card is a heart. What is
      $\mathbb{E}[\mathbf{1}\{A\} \mid Y = 1]$?
    answer: >
      $6/25 = 0.24$. The indicator identity says this is the same object as
      $\Pr(A \mid Y = 1)$, so there is nothing new to compute — just count.
      Given that exactly one of the first two cards is a heart, $50$ cards
      remain and $13 - 1 = 12$ of them are hearts, and every one of those $50$
      is equally likely to be the third card. Hence
      $\mathbb{E}[\mathbf{1}\{A\} \mid Y = 1] = 12/50 = 6/25$. The comparison
      that makes the conditioning visible: unconditionally $\Pr(A) = 1/4$ by
      symmetry, and the three conditional values $13/50$, $12/50$, $11/50$ for
      $Y = 0, 1, 2$ average back to it against the distribution of $Y$. The trap
      is answering $1/4$ on the grounds that "position three is symmetric" —
      symmetry holds before $Y$ is observed, not after.
    expects: "6/25"
    tolerance: 0.0005
    rubric:
      - >
        Identifies $\mathbb{E}[\mathbf{1}\{A\} \mid Y = 1]$ with
        $\Pr(A \mid Y = 1)$ and computes a probability, not a separate
        expectation.
      - >
        Updates both counts after the two known cards: $12$ hearts out of $50$.
    targets:
      - quant-probability.conditioning.indicator-conditional

  - id: qcnd-indicator-conditional-02
    kind: decide
    difficulty: standard
    statement: >
      Let $Y$ be the face of a fair die and $A$ some event. A candidate asserts
      that $\Pr(A \mid Y)$ is a number lying in $[0, 1]$. What is the verdict?
    answer: >
      Wrong: $\Pr(A \mid Y) = \mathbb{E}[\mathbf{1}\{A\} \mid Y]$, and a
      conditional expectation given a *variable* is a random variable — here a
      function of $Y$ taking up to six different values. What lies in $[0,1]$
      is each of its values $\Pr(A \mid Y = y)$, which are numbers because they
      condition on an event. The distinction is the whole reason the indicator
      identity is worth stating: it says conditional probability inherits every
      property of conditional expectation, including being random. Two
      consequences follow immediately. $\Pr(A \mid Y)$ has a variance, and the
      tower property applied to the indicator gives
      $\mathbb{E}[\Pr(A \mid Y)] = \Pr(A)$, which is the law of total
      probability written in one symbol.
    choices:
      - text: >
          Wrong — it is a random variable, a function of $Y$, whose *values*
          $\Pr(A \mid Y = y)$ are the numbers in $[0,1]$
        correct: true
        feedback: >
          $\Pr(A \mid Y) = \mathbb{E}[\mathbf{1}\{A\} \mid Y]$, and conditioning
          on a variable always returns a variable.
      - text: >
          Right — every probability is a number in $[0,1]$
        feedback: >
          $\Pr(A \mid Y = y)$ is such a number; $\Pr(A \mid Y)$ is the whole
          collection of them, packaged as a function of $Y$.
      - text: >
          Wrong — it is random, and can therefore take values outside $[0,1]$
        feedback: >
          Random, yes; unbounded, no. Every value it takes is a genuine
          conditional probability and so lies in $[0,1]$.
      - text: >
          Right — $\Pr(A \mid Y) = \sum_y \Pr(A \mid Y = y)\Pr(Y = y)$, which is
          a number
        feedback: >
          That sum is $\Pr(A)$, the tower average of the random variable, not
          the random variable itself.
    rubric:
      - >
        Writes $\Pr(A \mid Y)$ as $\mathbb{E}[\mathbf{1}\{A\} \mid Y]$ and
        argues from what conditioning on a variable produces.
      - >
        Separates the random variable from its values, rather than denying that
        the values are probabilities.
    targets:
      - quant-probability.conditioning.indicator-conditional

  # --- the tower property -----------------------------------------------------

  - id: qcnd-tower-01
    kind: work
    difficulty: demanding
    statement: >
      A fair four-sided die is rolled repeatedly until it shows a $4$, and the
      rolls stop there. What is the expected sum of all the rolls made,
      including the final $4$?
    answer: >
      $10$. Let $N$ be the number of rolls. Condition on $N$: given $N = n$, the
      last roll is a $4$ and the other $n-1$ rolls are each uniform on
      $\{1,2,3\}$, with mean $2$. So
      $\mathbb{E}[S \mid N] = 2(N-1) + 4$, and the tower property gives
      $\mathbb{E}[S] = 2(\mathbb{E}[N] - 1) + 4$. Since $N$ counts trials to the
      first success at rate $1/4$, $\mathbb{E}[N] = 4$, and
      $\mathbb{E}[S] = 2(3) + 4 = 10$. The trap is using $2.5$, the
      unconditional mean of a roll, for the $N-1$ earlier ones: conditioning on
      "not a $4$" moves their mean to $2$, and $3(2.5) + 4 = 11.5$ is the answer
      you get by forgetting that. A second route confirms $10$ and is worth
      knowing — $N$ is a stopping rule that never peeks ahead, so Wald's identity
      gives $\mathbb{E}[S] = \mathbb{E}[N]\,\mathbb{E}[\text{roll}] =
      4 \times 2.5 = 10$ — and the two agree because the conditional means $2$
      before the stop and $4$ at it average back to $2.5$, as they must.
    expects: "10"
    rubric:
      - >
        Conditions on the number of rolls, treating the final roll as a known
        $4$ and the earlier ones as uniform on $\{1,2,3\}$ with mean $2$.
      - >
        Uses $\mathbb{E}[N] = 4$ and averages the conditional means with the
        tower property.
    targets:
      - quant-probability.conditioning.tower
    exercises:
      - quant-probability.conditioning.conditional-expectation

  - id: qcnd-tower-02
    kind: work
    difficulty: standard
    statement: >
      A box holds four coins: two fair, one landing heads with probability
      $0.3$, and one landing heads with probability $0.8$. One coin is drawn
      uniformly at random and tossed ten times. What is the expected number of
      heads?
    answer: >
      $5.25$. Let $C$ be the coin drawn and $p_C$ its heads probability. Given
      the coin, the tosses are independent with a fixed bias, so
      $\mathbb{E}[X \mid C] = 10\,p_C$ — the conditional mean of a binomial
      count. The tower property averages that over the four equally likely
      coins:
      $\mathbb{E}[X] = 10 \cdot (0.5 + 0.5 + 0.3 + 0.8)/4 = 10(0.525) = 5.25$.
      Notice what conditioning bought: the unconditional law of $X$ is a
      four-component mixture and is not binomial at all, yet its mean needed
      only the average bias. What does *not* transfer is the variance — the
      mixture is more dispersed than a $\operatorname{Binomial}(10, 0.525)$,
      because the coin identity adds a between-group term the tower property
      never sees.
    expects: "5.25"
    rubric:
      - >
        Conditions on the coin, so that the conditional count is binomial with
        a known bias.
      - >
        Weights the four conditional means equally and does not confuse the
        mixture with a single binomial.
    targets:
      - quant-probability.conditioning.tower
    exercises:
      - quant-probability.conditional.total-probability

  - id: qcnd-tower-03
    kind: decide
    difficulty: standard
    statement: >
      A candidate recovers an unconditional mean by writing
      $\mathbb{E}[X] = \sum_y \mathbb{E}[X \mid Y = y]$, summing over the four
      values $Y$ can take. What is the verdict?
    answer: >
      Wrong: the conditional means must be weighted by $\Pr(Y = y)$, so the
      identity is $\mathbb{E}[X] = \sum_y \mathbb{E}[X \mid Y = y]\Pr(Y = y)$.
      The unweighted sum is not even dimensionally a mean — take $X$ constant at
      $c$, so every conditional mean is $c$ and the candidate's sum returns
      $4c$. That example also kills the two tempting rescues. Uniformity of $Y$
      does not help: with four equally likely values the sum is
      $4\,\mathbb{E}[X]$, out by exactly the number of cases. Independence does
      not help either: it makes every conditional mean equal to
      $\mathbb{E}[X]$, which is the constant case again. The weights are what
      make the tower property an average rather than a total, and dropping them
      is the most common way the identity is misapplied.
    choices:
      - text: >
          Wrong — the terms need the weights $\Pr(Y = y)$, giving
          $\mathbb{E}[X] = \sum_y \mathbb{E}[X \mid Y = y]\Pr(Y = y)$
        correct: true
        feedback: >
          The tower property averages the conditional forecasts over the law of
          $Y$; without the weights it totals them instead.
      - text: >
          Right whenever $Y$ is uniform on its four values
        feedback: >
          Then each weight is $1/4$ and the unweighted sum is
          $4\,\mathbb{E}[X]$ — off by a factor of four, not correct.
      - text: >
          Right whenever $X$ and $Y$ are independent
        feedback: >
          Independence makes every term $\mathbb{E}[X]$, so the sum is
          $4\,\mathbb{E}[X]$. Independence removes the variation, not the
          missing weights.
      - text: >
          Right, since the conditional probabilities already sum to $1$
        feedback: >
          It is $\sum_y \Pr(Y = y)$ that sums to $1$, and those are precisely
          the weights that have been dropped.
    rubric:
      - >
        States the weighted form of the law of total expectation.
      - >
        Refutes the unweighted version with a concrete counterexample, such as
        a constant $X$.
    targets:
      - quant-probability.conditioning.tower

  # --- nested conditioning ----------------------------------------------------

  - id: qcnd-tower-nested-01
    kind: work
    difficulty: demanding
    statement: >
      Let $Y$ be uniform on $\{1, 2\}$; given $Y = y$, let $Z$ be uniform on
      $\{1, \dots, 2y\}$; and given $(Y, Z)$, let $X$ be uniform on
      $\{1, \dots, Z\}$. What is $\mathbb{E}[X \mid Y = 2]$?
    answer: >
      $1.75$. Build the answer from the inside out, which is exactly what nested
      conditioning licenses. The innermost stage is trivial once $Z$ is known:
      $\mathbb{E}[X \mid Y, Z] = (Z + 1)/2$, since $X$ is uniform on
      $\{1, \dots, Z\}$. Smoothing back down to $Y$,
      $\mathbb{E}[X \mid Y] = \mathbb{E}[\mathbb{E}[X \mid Y, Z] \mid Y] =
      (\mathbb{E}[Z \mid Y] + 1)/2$. Given $Y = 2$, $Z$ is uniform on
      $\{1,2,3,4\}$ with mean $2.5$, so the answer is $(2.5 + 1)/2 = 1.75$. The
      trap is evaluating the inner formula at the mean of $Z$ without noticing
      that this is legitimate only because $(Z+1)/2$ is *linear* in $Z$; had the
      innermost stage been, say, $\mathbb{E}[X \mid Y, Z] = Z^{2}$, the second
      moment $\mathbb{E}[Z^{2} \mid Y = 2] = 7.5$ would be needed and $2.5^{2} =
      6.25$ would be wrong.
    expects: "1.75"
    rubric:
      - >
        Evaluates the innermost conditional expectation first, as a function of
        $Z$, then averages $Z$ out given $Y$.
      - >
        Uses $\mathbb{E}[Z \mid Y = 2] = 2.5$ rather than the unconditional mean
        of $Z$.
    targets:
      - quant-probability.conditioning.tower-nested
    exercises:
      - quant-probability.conditioning.tower

  - id: qcnd-tower-nested-02
    kind: work
    difficulty: standard
    statement: >
      Roll a fair six-sided die to get $Y$ and independently flip a fair coin,
      setting $Z = 1$ for heads and $Z = 0$ for tails. Let $X = Y(1 + Z)$. What
      is $\mathbb{E}[\mathbb{E}[X \mid Y, Z] \mid Y]$ evaluated at $Y = 5$?
    answer: >
      $7.5$. The inner expectation is free: $X = Y(1+Z)$ is already determined
      by the pair $(Y, Z)$, so $\mathbb{E}[X \mid Y, Z] = Y(1 + Z)$. Averaging
      $Z$ out and using that $Z$ is independent of $Y$ with mean $0.5$,
      $\mathbb{E}[Y(1+Z) \mid Y] = Y\,(1 + \mathbb{E}[Z]) = 1.5Y$, which at
      $Y = 5$ is $7.5$. That is the point of the smoothing rule: the answer
      equals $\mathbb{E}[X \mid Y = 5]$ computed directly, so conditioning on
      the finer information $(Y,Z)$ and then discarding $Z$ manufactured
      nothing. The wrong answer $10$ comes from keeping $Z$ at its largest
      value, and $\mathbb{E}[X] = 3.5 \times 1.5 = 5.25$ comes from peeling one
      layer too many and averaging $Y$ away as well.
    expects: "7.5"
    rubric:
      - >
        Recognises $X$ as a function of $(Y, Z)$, so the inner conditional
        expectation is $X$ itself.
      - >
        Averages out only $Z$, leaving a function of $Y$ rather than a number.
    targets:
      - quant-probability.conditioning.tower-nested

  # --- conditional variance ---------------------------------------------------

  - id: qcnd-conditional-variance-01
    kind: work
    difficulty: demanding
    statement: >
      On a day of regime $Y$, a desk's number of fills $X$ satisfies
      $\mathbb{E}[X \mid Y] = 30Y$ and $\mathbb{E}[X^{2} \mid Y] = 900Y^{2} +
      50Y$. What is $\operatorname{Var}(X \mid Y = 3)$?
    answer: >
      $150$. Use the computational form, which is the one you actually evaluate:
      $\operatorname{Var}(X \mid Y) = \mathbb{E}[X^{2} \mid Y] -
      (\mathbb{E}[X \mid Y])^{2} = (900Y^{2} + 50Y) - (30Y)^{2} = 50Y$. The
      $900Y^{2}$ cancels exactly, and what survives is $50Y$ — a *random
      variable*, a function of the regime, not a single number. At $Y = 3$ it
      takes the value $150$. Two things are worth reading off. The cancellation
      is what makes the answer small relative to either term separately, so
      subtracting rounded versions of $8100$ and $8250$ is a good way to lose
      all the precision. And $\operatorname{Var}(X \mid Y) = 50Y$ is
      nonnegative for every admissible $Y$, as any conditional variance must be
      — a formula that could go negative would signal an algebra error rather
      than an unusual regime.
    expects: "150"
    rubric:
      - >
        Uses $\mathbb{E}[X^{2} \mid Y] - (\mathbb{E}[X \mid Y])^{2}$ rather than
        squaring or averaging in the wrong order.
      - >
        Reports $\operatorname{Var}(X \mid Y) = 50Y$ as a function of $Y$ before
        evaluating at $Y = 3$.
    targets:
      - quant-probability.conditioning.conditional-variance
    exercises:
      - quant-probability.expectation.variance

  - id: qcnd-conditional-variance-02
    kind: work
    difficulty: standard
    statement: >
      A coin is chosen with heads probability $Y$, where $Y = 0.2$ or $Y = 0.6$
      with probability $1/2$ each. Given $Y$, the coin is tossed five times and
      $X$ counts the heads. What is $\operatorname{Var}(X \mid Y = 0.6)$?
    answer: >
      $1.2$. Conditioning on $Y$ fixes the bias, and given a fixed bias the five
      tosses are independent, so the conditional law of $X$ is
      $\operatorname{Binomial}(5, 0.6)$ with variance $5(0.6)(0.4) = 1.2$. The
      companion value is $\operatorname{Var}(X \mid Y = 0.2) = 5(0.2)(0.8) =
      0.8$, so $\operatorname{Var}(X \mid Y)$ is a two-valued random variable
      averaging to $1.0$ — and that average is only the within-group half of
      the story. The full spread of $X$ also picks up
      $\operatorname{Var}(\mathbb{E}[X \mid Y]) = \operatorname{Var}(5Y) =
      25(0.2)^{2} = 1$, so $\operatorname{Var}(X) = 2$, twice the conditional
      figure. Quoting $1.2$ as "the variance of $X$" is the mistake this problem
      is set up to expose.
    expects: "1.2"
    rubric:
      - >
        Uses that the conditional law given the bias is binomial, so the
        conditional variance is $np(1-p)$.
      - >
        Keeps $\operatorname{Var}(X \mid Y = 0.6)$ distinct from
        $\operatorname{Var}(X)$.
    targets:
      - quant-probability.conditioning.conditional-variance

  # --- the law of total variance ----------------------------------------------

  - id: qcnd-total-variance-01
    kind: work
    difficulty: demanding
    statement: >
      Draw $Y$ uniformly from $\{0, 1, 2\}$, then toss a fair coin $Y + 2$ times
      and let $X$ be the number of heads. What is $\operatorname{Var}(X)$?
    answer: >
      $11/12 \approx 0.9167$. Given $Y$, the count is
      $\operatorname{Binomial}(Y + 2, 1/2)$, so
      $\mathbb{E}[X \mid Y] = (Y+2)/2$ and
      $\operatorname{Var}(X \mid Y) = (Y+2)/4$. Now assemble the two terms.
      Within-group: $\mathbb{E}[\operatorname{Var}(X \mid Y)] =
      (\mathbb{E}[Y] + 2)/4 = (1 + 2)/4 = 3/4$, using $\mathbb{E}[Y] = 1$.
      Between-group: $\operatorname{Var}(\mathbb{E}[X \mid Y]) =
      \operatorname{Var}(Y)/4$, and $Y$ uniform on three consecutive integers
      has $\operatorname{Var}(Y) = 2/3$, giving $1/6$. So
      $\operatorname{Var}(X) = 3/4 + 1/6 = 11/12$. The trap is stopping at
      $3/4$: that is the variance you would have if the number of tosses were
      fixed at its mean of three, and it misses the extra spread contributed by
      not knowing how many tosses there will be. Averaging the conditional
      variances is never the whole answer unless the conditional means all
      coincide.
    expects: "11/12"
    tolerance: 0.0005
    rubric:
      - >
        Writes both $\mathbb{E}[X \mid Y]$ and $\operatorname{Var}(X \mid Y)$ as
        functions of $Y$ before averaging anything.
      - >
        Adds the between-group term $\operatorname{Var}(Y)/4$ rather than
        stopping at the within-group average $3/4$.
    targets:
      - quant-probability.conditioning.total-variance
    exercises:
      - quant-probability.conditioning.conditional-variance

  - id: qcnd-total-variance-02
    kind: work
    difficulty: standard
    statement: >
      A trainee is assigned to desk A with probability $0.5$ (daily P&L of mean
      $2$ and variance $4$), desk B with probability $0.3$ (mean $6$, variance
      $9$), or desk C with probability $0.2$ (mean $-1$, variance $25$). What is
      the variance of the trainee's daily P&L?
    answer: >
      $15.94$. The overall mean comes first, by the tower property:
      $\mathbb{E}[X] = 0.5(2) + 0.3(6) + 0.2(-1) = 2.6$. Within-group is the
      average of the three variances against the same weights:
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] = 0.5(4) + 0.3(9) + 0.2(25) =
      2 + 2.7 + 5 = 9.7$. Between-group is the variance of the three means:
      $\operatorname{Var}(\mathbb{E}[X \mid Y]) = 0.5(4) + 0.3(36) + 0.2(1) -
      2.6^{2} = 13 - 6.76 = 6.24$. Adding, $\operatorname{Var}(X) = 9.7 + 6.24 =
      15.94$. Desk C is instructive: it carries only a fifth of the weight but
      supplies more than half the within-group term, because variances, unlike
      means, are not tempered by a small probability once they are large.
      Reporting $9.7$ prices the trainee as if the desk assignment were already
      known.
    expects: "15.94"
    rubric:
      - >
        Computes $\mathbb{E}[X] = 2.6$ first and uses it in the between-group
        term.
      - >
        Averages the variances for the first term and takes the variance of the
        means for the second, without mixing the two.
    targets:
      - quant-probability.conditioning.total-variance
    exercises:
      - quant-probability.conditioning.tower

  - id: qcnd-total-variance-03
    kind: justify
    difficulty: demanding
    statement: >
      Show that $\operatorname{Var}(\mathbb{E}[X \mid Y]) \le
      \operatorname{Var}(X)$ for any $X$ with $\mathbb{E}[X^{2}] < \infty$, and
      characterise exactly when equality holds.
    answer: >
      The law of total variance gives
      $\operatorname{Var}(X) = \mathbb{E}[\operatorname{Var}(X \mid Y)] +
      \operatorname{Var}(\mathbb{E}[X \mid Y])$, and the first summand is the
      mean of a nonnegative random variable — $\operatorname{Var}(X \mid Y = y)$
      is a variance for every $y$ — so it is at least $0$. Dropping it yields
      $\operatorname{Var}(\mathbb{E}[X \mid Y]) \le \operatorname{Var}(X)$
      immediately. Equality forces
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] = 0$, and a nonnegative variable
      with mean zero is zero almost surely, so
      $\operatorname{Var}(X \mid Y) = 0$ for almost every value of $Y$: given
      $Y$, the variable $X$ has collapsed to a point, which says precisely that
      $X = \mathbb{E}[X \mid Y]$ almost surely, i.e. $X$ is (almost surely) a
      function of $Y$. The interpretation is the one worth carrying into an
      interview: a forecast can never be more variable than what it forecasts,
      and it matches that variability only when it is not forecasting at all but
      reporting. The mirror inequality
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] \le \operatorname{Var}(X)$ comes
      from dropping the other summand, with equality exactly when
      $\mathbb{E}[X \mid Y]$ is constant.
    rubric:
      - >
        Cites the two-term decomposition and argues from nonnegativity of
        $\operatorname{Var}(X \mid Y)$ pointwise in $Y$.
      - >
        Uses that a nonnegative variable with zero mean vanishes almost surely,
        rather than asserting the equality case.
      - >
        States the equality case as "$X$ is almost surely a function of $Y$",
        not as independence or as $X = Y$.
    targets:
      - quant-probability.conditioning.total-variance
    exercises:
      - quant-probability.conditioning.tower

  # --- the best mean-square predictor -----------------------------------------

  - id: qcnd-best-predictor-01
    kind: work
    difficulty: demanding
    statement: >
      A signal $Y$ is $\operatorname{Uniform}(0,1)$ and, given $Y = y$, a payoff
      $X$ equals $1$ with probability $y$ and $0$ otherwise. Over all functions
      $g$, what is the smallest value of $\mathbb{E}[(X - g(Y))^{2}]$?
    answer: >
      $1/6 \approx 0.1667$. The minimum is attained at $g(Y) = \mathbb{E}[X \mid
      Y]$ and equals $\mathbb{E}[\operatorname{Var}(X \mid Y)]$, so the work is
      to compute that. Given $Y = y$ the payoff is
      $\operatorname{Bernoulli}(y)$, so $\mathbb{E}[X \mid Y] = Y$ and
      $\operatorname{Var}(X \mid Y) = Y(1 - Y)$. Averaging over the signal,
      $\mathbb{E}[Y(1-Y)] = \mathbb{E}[Y] - \mathbb{E}[Y^{2}] = 1/2 - 1/3 =
      1/6$. Sanity checks in both directions. The best *constant* guess is
      $\mathbb{E}[X] = 1/2$, whose error is $\operatorname{Var}(X) = 1/4$, and
      $1/6 < 1/4$ as it must be; the gap $1/4 - 1/6 = 1/12$ is exactly
      $\operatorname{Var}(\mathbb{E}[X \mid Y]) = \operatorname{Var}(Y)$, the
      variance the signal explains. Answering $0$ is the trap: knowing $Y$ pins
      down the *distribution* of $X$, never $X$ itself.
    expects: "1/6"
    tolerance: 0.0005
    rubric:
      - >
        Identifies the minimum as $\mathbb{E}[\operatorname{Var}(X \mid Y)]$
        rather than searching over candidate functions.
      - >
        Computes $\operatorname{Var}(X \mid Y) = Y(1-Y)$ from the conditional
        Bernoulli law and averages it correctly.
    targets:
      - quant-probability.conditioning.best-predictor
    exercises:
      - quant-probability.conditioning.total-variance

  - id: qcnd-best-predictor-02
    kind: work
    difficulty: standard
    statement: >
      $Y$ takes the values $-1$ and $+1$ with probability $1/2$ each and, given
      $Y$, the variable $X$ has mean $3Y$ and variance $4$. By how much does the
      mean-squared error of the best constant predictor of $X$ exceed the
      mean-squared error of the best predictor of any shape?
    answer: >
      $9$. The best predictor of any shape is $\mathbb{E}[X \mid Y] = 3Y$, whose
      mean-squared error is $\mathbb{E}[\operatorname{Var}(X \mid Y)] = 4$,
      since the conditional variance is $4$ whatever $Y$ is. The best constant
      predictor is $c = \mathbb{E}[X] = 0$, and its mean-squared error is
      $\mathbb{E}[(X - \mathbb{E}[X])^{2}] = \operatorname{Var}(X)$, which the
      law of total variance gives as $4 + \operatorname{Var}(3Y) = 4 + 9 = 13$.
      The gap is $13 - 4 = 9$. That is no coincidence: the excess is always
      exactly $\operatorname{Var}(\mathbb{E}[X \mid Y])$, the between-group term,
      so "how much is the signal worth under squared error" and "how much does
      the conditional forecast move" are the same question. A constant predictor
      is the projection onto the smallest possible subspace, and everything the
      signal explains is what it gives up.
    expects: "9"
    rubric:
      - >
        Uses $\mathbb{E}[\operatorname{Var}(X \mid Y)]$ for the minimum error
        and $\operatorname{Var}(X)$ for the constant predictor's error.
      - >
        Identifies the difference as the between-group term
        $\operatorname{Var}(\mathbb{E}[X \mid Y])$.
    targets:
      - quant-probability.conditioning.best-predictor

  - id: qcnd-best-predictor-03
    kind: work
    difficulty: demanding
    statement: >
      A pair $(X, Y)$ is bivariate normal with $\mu_X = 10$, $\sigma_X = 4$,
      $\mu_Y = 2$, $\sigma_Y = 8$ and correlation $\rho = 0.6$. What is
      $\mathbb{E}[X \mid Y = 10]$?
    answer: >
      $12.4$. The bivariate normal is the case in which the best mean-square
      predictor happens to be affine:
      $\mathbb{E}[X \mid Y] = \mu_X + \rho(\sigma_X/\sigma_Y)(Y - \mu_Y)$.
      Substituting, $10 + 0.6(4/8)(10 - 2) = 10 + 0.6(0.5)(8) = 10 + 2.4 =
      12.4$. Two readings are worth carrying away. The slope is
      $\rho\,\sigma_X/\sigma_Y = 0.3$, not $\rho$ — the correlation is
      unit-free and has to be rescaled by the ratio of the spreads, and
      inverting that ratio gives the common wrong answer $10 + 0.6(2)(8) =
      19.6$. And the residual risk is
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] = \sigma_X^{2}(1 - \rho^{2}) =
      16(0.64) = 10.24$, constant in $Y$, so here regression loses nothing:
      the true best predictor and the best affine predictor coincide, which is
      exactly what fails for a general joint law.
    expects: "12.4"
    rubric:
      - >
        Uses the slope $\rho\,\sigma_X/\sigma_Y$ rather than $\rho$ or the
        inverted ratio.
      - >
        Measures the deviation from $\mu_Y$, not from $0$.
      - >
        Says why the linear form is legitimate here — normality — rather than
        assuming best predictors are always linear.
    targets:
      - quant-probability.conditioning.best-predictor
      - quant-probability.joint.bivariate-normal
    connects:
      - "quant-probability.conditioning.best-predictor ~ quant-probability.joint.bivariate-normal"

  # --- conditioning as projection ---------------------------------------------

  - id: qcnd-projection-view-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $\mathbb{E}[X^{2}] < \infty$ and write $R = X - \mathbb{E}[X \mid Y]$.
      Say what the projection picture predicts about
      $\operatorname{Cov}(R, \mathbb{E}[X \mid Y])$ before any computation, then
      verify it.
    answer: >
      The picture predicts $0$. Treat square-integrable variables as vectors
      under $\langle U, V \rangle = \mathbb{E}[UV]$; the functions of $Y$ form a
      subspace, $\mathbb{E}[X \mid Y]$ is the orthogonal projection of $X$ onto
      it, and $R$ is by construction the component perpendicular to that
      subspace. Since $\mathbb{E}[X \mid Y]$ *lies in* the subspace, the two are
      orthogonal, and orthogonality plus $\mathbb{E}[R] = 0$ is exactly zero
      covariance. Verification: for any $h$ with $\mathbb{E}[h(Y)^{2}] <
      \infty$, taking out what is known and the tower property give
      $\mathbb{E}[R\,h(Y)] = \mathbb{E}[h(Y)\mathbb{E}[X - \mathbb{E}[X \mid Y]
      \mid Y]] = \mathbb{E}[h(Y) \cdot 0] = 0$; take $h(Y) = \mathbb{E}[X \mid
      Y]$, and note $\mathbb{E}[R] = 0$ by the tower property again, so
      $\operatorname{Cov}(R, \mathbb{E}[X \mid Y]) = \mathbb{E}[R\,\mathbb{E}[X
      \mid Y]] = 0$. This is the cross term that vanishes in the proof of the
      law of total variance, which is why that identity is Pythagoras:
      $\lVert X \rVert^{2}$ splits into the squared length of the projection
      plus the squared length of the residual, with no interaction term.
    rubric:
      - >
        Names the inner product $\mathbb{E}[UV]$ and identifies the subspace as
        the square-integrable functions of $Y$.
      - >
        Proves $\mathbb{E}[R\,h(Y)] = 0$ by taking $h(Y)$ out and applying the
        tower property, not by assuming independence of $R$ and $Y$.
      - >
        Connects the vanishing cross term to the two-term form of the law of
        total variance.
    targets:
      - quant-probability.conditioning.projection-view
    exercises:
      - quant-probability.conditioning.best-predictor

  - id: qcnd-projection-view-02
    kind: decide
    difficulty: standard
    statement: >
      In the projection picture, conditioning on the pair $(Y, Z)$ rather than
      on $Y$ alone corresponds to what change of subspace?
    answer: >
      A *larger* subspace, one that contains the functions of $Y$. Every
      function of $Y$ is also a function of $(Y, Z)$ — it simply ignores its
      second argument — so the functions of $Y$ sit inside the functions of
      $(Y,Z)$, and projecting onto a bigger subspace can only shorten the
      residual. That single fact packages three results at once. It explains why
      $\mathbb{E}[\operatorname{Var}(X \mid Y, Z)] \le
      \mathbb{E}[\operatorname{Var}(X \mid Y)]$: more information cannot raise
      the expected residual risk. It explains nested conditioning,
      $\mathbb{E}[\mathbb{E}[X \mid Y, Z] \mid Y] = \mathbb{E}[X \mid Y]$, as
      projecting onto a subspace and then onto a subspace of it. And it makes
      the plain tower property the extreme case, where the inner subspace is the
      constants. The intuition that "more conditions means a smaller space" is
      the trap: the conditions are on the *information*, and more information
      means more admissible predictors.
    choices:
      - text: >
          To a larger subspace, which contains the square-integrable functions
          of $Y$
        correct: true
        feedback: >
          Every function of $Y$ is a function of $(Y,Z)$, so the old subspace
          sits inside the new one.
      - text: >
          To a smaller subspace, since two conditions are imposed instead of one
        feedback: >
          Conditioning adds information, not constraints on the predictor: the
          set of usable functions grows.
      - text: >
          To the same subspace, since $Z$ is averaged out again anyway
        feedback: >
          That describes the nested-tower step, which projects the finer
          forecast back down — a second projection, not the same subspace.
      - text: >
          To a rotation of the same subspace, preserving all lengths
        feedback: >
          Nothing is rotated, and lengths are not preserved: the residual
          strictly shortens whenever $Z$ carries new information about $X$.
    rubric:
      - >
        Argues from the inclusion of function classes rather than from the
        number of conditioning variables.
      - >
        Draws the right consequence — the residual can only shrink — and links
        it to nested conditioning.
    targets:
      - quant-probability.conditioning.projection-view

  # --- information reduces uncertainty on average -----------------------------

  - id: qcnd-conditioning-reduces-variance-01
    kind: work
    difficulty: demanding
    statement: >
      A signal $Y$ about tomorrow's P&L $X$ satisfies $\operatorname{Var}(X) =
      25$ and $\operatorname{Var}(\mathbb{E}[X \mid Y]) = 4$. On one particular
      reading $y_0$, the residual variance is unusually large:
      $\operatorname{Var}(X \mid Y = y_0) = 30$. What is the largest value
      $\Pr(Y = y_0)$ could take?
    answer: >
      $0.7$. The law of total variance fixes the *average* residual risk:
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] = 25 - 4 = 21$. Now split that
      average by whether $Y = y_0$. Writing $p = \Pr(Y = y_0)$,
      $21 = 30p + (1-p)\,\mathbb{E}[\operatorname{Var}(X \mid Y) \mid Y \ne
      y_0]$, and the second term is an average of conditional variances, so it
      is at least $0$. Hence $30p \le 21$ and $p \le 0.7$, attained in the limit
      where every other reading resolves $X$ exactly. The problem exists to make
      one point precisely: $\operatorname{Var}(X \mid Y = y_0) = 30 >
      \operatorname{Var}(X) = 25$ is perfectly legal — a particular signal
      reading can leave you *more* uncertain than you started — but the
      inequality $\mathbb{E}[\operatorname{Var}(X \mid Y)] \le
      \operatorname{Var}(X)$ then caps how often that can happen.
    expects: "0.7"
    rubric:
      - >
        Recovers $\mathbb{E}[\operatorname{Var}(X \mid Y)] = 21$ from the law of
        total variance rather than treating $25$ as the residual risk.
      - >
        Bounds the remaining conditional variances below by $0$ to isolate $p$.
      - >
        Notes that a single reading may exceed $\operatorname{Var}(X)$ — only
        the average is constrained.
    targets:
      - quant-probability.conditioning.conditioning-reduces-variance
    exercises:
      - quant-probability.conditioning.total-variance

  - id: qcnd-conditioning-reduces-variance-02
    kind: decide
    difficulty: standard
    statement: >
      A quant reports that adding a second signal $Z$ alongside $Y$ raised the
      expected residual variance:
      $\mathbb{E}[\operatorname{Var}(X \mid Y, Z)] >
      \mathbb{E}[\operatorname{Var}(X \mid Y)]$. What should you conclude?
    answer: >
      The computation is wrong. Applying the law of total variance *inside* the
      conditional world of $Y$ gives
      $\operatorname{Var}(X \mid Y) = \mathbb{E}[\operatorname{Var}(X \mid Y, Z)
      \mid Y] + \operatorname{Var}(\mathbb{E}[X \mid Y, Z] \mid Y)$, and both
      terms are nonnegative, so taking expectations yields
      $\mathbb{E}[\operatorname{Var}(X \mid Y, Z)] \le
      \mathbb{E}[\operatorname{Var}(X \mid Y)]$ always. Extra information can
      never raise expected residual uncertainty; at worst $Z$ is pure noise and
      the two are equal. The two near-misses are worth separating. A *single*
      realisation can go the wrong way — $\operatorname{Var}(X \mid Y = y, Z =
      z)$ may exceed $\operatorname{Var}(X \mid Y = y)$ — but the reported
      quantity is an expectation, where no such freedom exists. And dependence
      between $Y$ and $Z$ changes nothing: the inequality is a consequence of
      nesting the information, not of any independence assumption.
    choices:
      - text: >
          The computation is wrong — nesting the information forces
          $\mathbb{E}[\operatorname{Var}(X \mid Y, Z)] \le
          \mathbb{E}[\operatorname{Var}(X \mid Y)]$
        correct: true
        feedback: >
          Apply total variance inside the world of $Y$: the two nonnegative
          pieces sum to $\operatorname{Var}(X \mid Y)$.
      - text: >
          $Z$ is pure noise and should be dropped
        feedback: >
          Noise leaves the expected residual variance unchanged; it can never
          raise it, so noise does not explain the reported number.
      - text: >
          It can happen when $Z$ is strongly dependent on $Y$
        feedback: >
          The inequality never uses independence. Dependence only affects how
          much $Z$ adds, not the direction.
      - text: >
          It can happen at particular values of $(Y, Z)$, so the report stands
        feedback: >
          A single realisation may indeed go the wrong way, but the report is
          about the expectation, which cannot.
    rubric:
      - >
        Applies the law of total variance within the conditional world of $Y$
        rather than quoting the unconditional version.
      - >
        Distinguishes the constrained expectation from an individual
        realisation, which is unconstrained.
    targets:
      - quant-probability.conditioning.conditioning-reduces-variance

  # --- conditioning on the first step -----------------------------------------

  - id: qcnd-condition-first-step-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed repeatedly until two heads appear in a row. What is
      the expected number of tosses?
    answer: >
      $6$. Condition on the first thing that happens, tracking how much of the
      pattern is already built. Let $a$ be the expected number of further tosses
      from a fresh start and $b$ the expected number from a state where the last
      toss was a head. From a fresh start, one toss is spent and lands heads or
      tails with probability $1/2$ each: $a = 1 + \tfrac{1}{2}b +
      \tfrac{1}{2}a$. From the "one head so far" state, the next toss either
      finishes the pattern or sends you back to a fresh start:
      $b = 1 + \tfrac{1}{2}(0) + \tfrac{1}{2}a$. Substituting the second into
      the first gives $a = 1 + \tfrac{1}{2}(1 + \tfrac{1}{2}a) +
      \tfrac{1}{2}a$, so $\tfrac{1}{4}a = \tfrac{3}{2}$ and $a = 6$. The trap
      is treating each toss as an independent $1/4$ chance of completing the
      pattern and answering $1/(1/4) = 4$: that ignores the overlap, since a
      tail after a head throws the partial progress away instead of leaving it
      intact. The comparison that makes the point is the pattern HT, where the
      same two-state argument gives $4$ — a failure there leaves you still
      holding an $H$, so nothing is lost, and only for a pattern that cannot
      trip over itself does the naive count come out right.
    expects: "6"
    rubric:
      - >
        Introduces a state for partial progress rather than a single unknown.
      - >
        Writes each equation as "one toss, then the conditional value of the
        state reached", and solves the pair.
      - >
        Explains why $4$ is wrong: a tail destroys the partial pattern.
    targets:
      - quant-probability.conditioning.condition-first-step
    exercises:
      - quant-probability.conditioning.tower

  - id: qcnd-condition-first-step-02
    kind: work
    difficulty: standard
    statement: >
      A gambler starts with $2$ dollars and repeatedly stakes $1$ dollar on a
      fair coin, stopping on reaching $0$ or $5$ dollars. What is the
      probability of reaching $5$ dollars before going broke?
    answer: >
      $2/5 = 0.4$. Let $h(k)$ be the probability of reaching $5$ starting from
      $k$ dollars. Condition on the first bet: with probability $1/2$ the
      fortune becomes $k+1$ and with probability $1/2$ it becomes $k-1$, and in
      each case the process restarts from that fortune, so
      $h(k) = \tfrac{1}{2}h(k+1) + \tfrac{1}{2}h(k-1)$ for $1 \le k \le 4$, with
      $h(0) = 0$ and $h(5) = 1$. The recurrence says $h$ has constant increments,
      so $h$ is linear: $h(k) = k/5$, and $h(2) = 2/5$. There is a one-line
      version of the same argument — the fortune is a fair game, so its expected
      final value equals its starting value, giving $5h(2) + 0 = 2$ — and it is
      the tower property in disguise. The common wrong answer $1/2$ treats the
      two barriers as symmetric; they are not, since $0$ is two steps away and
      $5$ is three.
    expects: "2/5"
    tolerance: 0.0005
    rubric:
      - >
        Conditions on the first bet to produce a recurrence with the two
        boundary values $h(0) = 0$ and $h(5) = 1$.
      - >
        Solves the recurrence rather than assuming the two barriers are equally
        likely.
    targets:
      - quant-probability.conditioning.condition-first-step

  - id: qcnd-condition-first-step-03
    kind: work
    difficulty: standard
    statement: >
      A biased coin lands heads with probability $0.3$. By conditioning on the
      first toss, find the expected number of tosses until the first head.
    answer: >
      $10/3 \approx 3.3333$. Let $m$ be the expected number of tosses. Spend one
      toss and condition on it: with probability $0.3$ it is a head and the
      process is over; with probability $0.7$ it is a tail, and — this is the
      whole content of the argument — the situation facing you is *identical* to
      the one you started in, so the conditional expected number of further
      tosses is $m$ again. Hence $m = 1 + 0.7m$, giving $0.3m = 1$ and
      $m = 10/3$. The restart is not an approximation: the tosses are
      independent and identically distributed, which is exactly the geometric
      law's defining property, and it is what lets one equation in one unknown
      close. Without it the first step would leave a genuinely different
      problem, as in a pattern-matching wait, and a whole system of equations
      would be needed instead of one.
    expects: "10/3"
    tolerance: 0.0005
    rubric:
      - >
        Conditions on the first toss and identifies the post-tail state with the
        original state.
      - >
        Solves $m = 1 + (1-p)m$ rather than summing a series term by term.
      - >
        Names the restart property as what makes a single equation sufficient.
    targets:
      - quant-probability.conditioning.condition-first-step
      - quant-probability.discrete.geometric
    connects:
      - "quant-probability.conditioning.condition-first-step ~ quant-probability.discrete.geometric"

  # --- random sums ------------------------------------------------------------

  - id: qcnd-random-sums-01
    kind: work
    difficulty: demanding
    statement: >
      A market stall serves $N$ customers in a day, with $\mathbb{E}[N] = 12$
      and $\operatorname{Var}(N) = 30$. Each customer spends an amount
      independent of $N$ and of the others, with mean $8$ dollars and standard
      deviation $5$ dollars. What is the standard deviation of the day's total
      takings, in dollars?
    answer: >
      About $47.12$ dollars. Condition on the count. Given $N$, the total is a
      sum of $N$ iid amounts, so $\mathbb{E}[S \mid N] = 8N$ and
      $\operatorname{Var}(S \mid N) = 25N$. The law of total variance then gives
      the two terms: within-count
      $\mathbb{E}[\operatorname{Var}(S \mid N)] = 25\,\mathbb{E}[N] = 25(12) =
      300$, and between-count
      $\operatorname{Var}(\mathbb{E}[S \mid N]) = 64\operatorname{Var}(N) =
      64(30) = 1920$. So $\operatorname{Var}(S) = 2220$ and the standard
      deviation is $\sqrt{2220} \approx 47.12$ dollars. The structure is the
      lesson: with a mean spend of $8$ dollars against a spread of $5$, the
      *count* supplies $1920$ of the $2220$ — nearly seven times the trade-level
      noise. Treating the day as $12$ fixed customers gives $\sqrt{300} \approx
      17.3$ dollars and understates the risk by a factor of nearly three.
    expects: "47.12"
    tolerance: 0.005
    rubric:
      - >
        Conditions on $N$ to get $\mathbb{E}[S \mid N] = \mu N$ and
        $\operatorname{Var}(S \mid N) = \sigma^{2} N$.
      - >
        Uses $\mathbb{E}[N]\sigma^{2} + \operatorname{Var}(N)\mu^{2}$, so the
        second term carries $\mu^{2}$ and not $\sigma^{2}$.
      - >
        Takes a square root at the end, reporting a standard deviation rather
        than a variance.
    targets:
      - quant-probability.conditioning.random-sums
    exercises:
      - quant-probability.conditioning.total-variance

  - id: qcnd-random-sums-02
    kind: work
    difficulty: standard
    statement: >
      A fund receives $N$ redemption requests in a quarter, with
      $\mathbb{E}[N] = 50$ and $\operatorname{Var}(N) = 50$. Each request's size
      is independent of the count and of the others, with mean $4$ million
      dollars and variance $1$. What is the variance of the total redeemed, in
      squared millions?
    answer: >
      $850$. Substitute into
      $\operatorname{Var}(S) = \mathbb{E}[N]\sigma^{2} +
      \operatorname{Var}(N)\mu^{2} = 50(1) + 50(16) = 50 + 800 = 850$. The split
      is the whole message: only $50$ of the $850$ comes from not knowing how
      big each redemption is, and $800$ from not knowing how many there will be.
      That is because $\mu = 4$ dwarfs $\sigma = 1$, so each extra request that
      arrives moves the total by about $4$ while each request's own size wobbles
      by about $1$. Two wrong turns are worth naming. Reporting $50$ is the
      fixed-count answer, valid only if $N$ were known to be $50$. And reporting
      $\operatorname{Var}(N)\operatorname{Var}(X) = 50$ multiplies the two
      variances, which is not a term in the formula at all — the count enters
      through $\mu^{2}$, the *squared mean* of a request.
    expects: "850"
    rubric:
      - >
        Pairs $\mathbb{E}[N]$ with $\sigma^{2}$ and $\operatorname{Var}(N)$ with
        $\mu^{2}$, not the other way round.
      - >
        Keeps both terms rather than reporting the fixed-count variance $50$.
    targets:
      - quant-probability.conditioning.random-sums

  - id: qcnd-random-sums-03
    kind: decide
    difficulty: demanding
    statement: >
      For $S = X_1 + \dots + X_N$ with $N$ independent of the iid $X_i$, a
      candidate reports
      $\operatorname{Var}(S) = \mathbb{E}[N]\operatorname{Var}(X)$. Under what
      circumstance is that actually right?
    answer: >
      Exactly when $\mathbb{E}[X] = 0$. The correct formula is
      $\operatorname{Var}(S) = \mathbb{E}[N]\operatorname{Var}(X) +
      \operatorname{Var}(N)(\mathbb{E}[X])^{2}$, so the candidate has dropped the
      between-count term, and that term vanishes precisely when
      $\mathbb{E}[X] = 0$ (or when the count is deterministic, so
      $\operatorname{Var}(N) = 0$). The reason is worth stating in words: the
      count moves the total only through the *typical size* of a summand, so a
      mean-zero summand makes extra draws contribute noise but no drift, and the
      uncertainty in $N$ stops mattering. This is why a market-neutral book with
      zero expected edge per trade genuinely does have variance
      $\mathbb{E}[N]\sigma^{2}$, while any book with an edge does not. Note what
      is *not* sufficient: independence of $N$ from the $X_i$ is the assumption
      that makes the two-term formula valid in the first place, not a reason to
      lose a term.
    choices:
      - text: >
          When $\mathbb{E}[X] = 0$
        correct: true
        feedback: >
          The dropped term is $\operatorname{Var}(N)(\mathbb{E}[X])^{2}$, which
          vanishes exactly when the summands have mean zero.
      - text: >
          When $\operatorname{Var}(N) = \mathbb{E}[N]$, as for a Poisson count
        feedback: >
          That turns the second term into $\mathbb{E}[N](\mathbb{E}[X])^{2}$,
          which is generally nonzero — it does not disappear.
      - text: >
          Always, since $N$ is independent of the $X_i$
        feedback: >
          Independence is what licenses the two-term formula; it is not a reason
          to delete one of the two terms.
      - text: >
          When $\mathbb{E}[N]$ is large, since the count term is then negligible
        feedback: >
          Both terms grow with the count, so no asymptotic rescues the omission;
          the ratio of the two is unchanged for a Poisson-like $N$.
    rubric:
      - >
        Quotes the two-term formula and identifies which term the candidate
        dropped.
      - >
        Says why a mean-zero summand kills that term, rather than appealing to
        independence.
    targets:
      - quant-probability.conditioning.random-sums

  # --- a desk's P&L with a random trade count ---------------------------------

  - id: qcnd-random-sums-desk-01
    kind: work
    difficulty: demanding
    statement: >
      A desk trades $N$ times a day with $\mathbb{E}[N] = 250$ and
      $\operatorname{Var}(N) = 1000$, and each trade's P&L is independent of the
      count and of the others with standard deviation $10$ dollars. At what mean
      P&L per trade, in dollars, do the trade-level and count-level contributions
      to $\operatorname{Var}(S)$ become equal?
    answer: >
      $5$ dollars. The two contributions are
      $\mathbb{E}[N]\sigma^{2} = 250(100) = 25\,000$ from trade-level noise and
      $\operatorname{Var}(N)\mu^{2} = 1000\mu^{2}$ from the uncertain count.
      Setting them equal gives $1000\mu^{2} = 25\,000$, so $\mu^{2} = 25$ and
      $\mu = 5$ dollars. In general the crossover sits at
      $\mu = \sigma\sqrt{\mathbb{E}[N]/\operatorname{Var}(N)}$, here
      $10\sqrt{250/1000} = 10(0.5) = 5$, which is the formula worth carrying:
      the count matters more the larger the edge per trade and the noisier the
      count. Below $5$ dollars of edge the day's risk is dominated by trade-level
      noise and a fixed-count model is a decent approximation; above it the
      count term takes over and ignoring $\operatorname{Var}(N)$ understates
      risk badly. At exactly $\mu = 5$ the total is $50\,000$ and the daily
      standard deviation is about $224$ dollars.
    expects: "5"
    rubric:
      - >
        Writes the two variance contributions separately and equates them.
      - >
        Solves for $\mu$, not for $\sigma$ or for the total variance.
      - >
        Takes the positive root, since $\mu$ is being read as an edge per trade.
    targets:
      - quant-probability.conditioning.random-sums-desk
    exercises:
      - quant-probability.conditioning.random-sums

  - id: qcnd-random-sums-desk-02
    kind: work
    difficulty: standard
    statement: >
      A desk trades $N$ times a day with $\mathbb{E}[N] = 80$ and
      $\operatorname{Var}(N) = 160$; each trade's P&L is independent of the count
      and of the others, with mean $3$ dollars and standard deviation $6$
      dollars. What is the standard deviation of the day's P&L, in dollars?
    answer: >
      About $65.73$ dollars. Trade-level noise contributes
      $\mathbb{E}[N]\sigma^{2} = 80(36) = 2880$ and the uncertain count
      contributes $\operatorname{Var}(N)\mu^{2} = 160(9) = 1440$, so
      $\operatorname{Var}(S) = 4320$ and the standard deviation is
      $\sqrt{4320} \approx 65.73$ dollars. Against an expected P&L of
      $\mathbb{E}[N]\mu = 240$ dollars, that is a daily Sharpe-like ratio of
      about $3.65$. The count carries a third of the variance here, so a
      fixed-count model would report $\sqrt{2880} \approx 53.7$ dollars and
      understate the spread by about $18\%$ — smaller than the previous desk's
      error, because $\mu = 3$ is only half of $\sigma = 6$. Adding the two
      standard deviations instead of the two variances would give
      $53.7 + 37.9 \approx 91.6$ and overstate it: variances add, standard
      deviations do not.
    expects: "65.73"
    tolerance: 0.005
    rubric:
      - >
        Adds the two variance contributions before taking any square root.
      - >
        Reports a standard deviation in dollars, not a variance.
    targets:
      - quant-probability.conditioning.random-sums-desk

  # --- truncated means --------------------------------------------------------

  - id: qcnd-truncated-mean-01
    kind: work
    difficulty: demanding
    statement: >
      Let $X \sim \operatorname{Exp}(\lambda)$ with mean $1/\lambda = 6$
      minutes. What is $\mathbb{E}[X \mid X < 6]$, in minutes?
    answer: >
      About $2.5081$ minutes. This is the truncation memorylessness does *not*
      simplify, so compute it. The numerator is
      $\mathbb{E}[X\mathbf{1}\{X < t\}] = \int_0^t x\lambda e^{-\lambda x}\,dx =
      (1 - e^{-\lambda t})/\lambda - te^{-\lambda t}$, by parts, and the
      denominator is $\Pr(X < t) = 1 - e^{-\lambda t}$. Dividing,
      $\mathbb{E}[X \mid X < t] = 1/\lambda - te^{-\lambda t}/(1 -
      e^{-\lambda t})$. With $\lambda t = 1$ this is
      $6 - 6e^{-1}/(1 - e^{-1}) = 6 - 6(0.58198) \approx 2.5081$ minutes. Two
      readings. The answer is well below the midpoint $3$ of the interval
      $(0,6)$, because the exponential density is decreasing and piles mass near
      zero. And it is the exact complement of the memoryless case: conditioning
      *above* $t$ gives $t + 1/\lambda = 12$, so the two truncations average
      back to $6$ against the weights $1 - e^{-1}$ and $e^{-1}$ — a tower-property
      check worth running: $0.63212(2.5081) + 0.36788(12) = 6$.
    expects: "2.5081"
    tolerance: 0.0005
    rubric:
      - >
        Integrates by parts to get $\mathbb{E}[X\mathbf{1}\{X < t\}]$ rather
        than reusing the memoryless shortcut, which applies only above $t$.
      - >
        Divides by $\Pr(X < t) = 1 - e^{-\lambda t}$, not by $1$.
      - >
        Sanity-checks the answer against the midpoint $3$ and against the tower
        average of the two truncations.
    targets:
      - quant-probability.conditioning.truncated-mean
    exercises:
      - quant-probability.conditioning.conditional-given-event

  - id: qcnd-truncated-mean-02
    kind: work
    difficulty: standard
    statement: >
      A component's lifetime is uniform on $(0, 15)$ years. Given that it has
      already survived $9$ years, what is its expected *remaining* life, in
      years?
    answer: >
      $3$ years. Conditioning a uniform variable on $\{X > t\}$ leaves a uniform
      variable on $(t, 15)$ — the density is flat, so renormalising a flat
      density over a shorter interval keeps it flat. The conditional mean of the
      total lifetime is therefore the midpoint $(9 + 15)/2 = 12$ years, and the
      expected remaining life is $12 - 9 = 3$ years, which is also
      $(15 - 9)/2$ directly. The point of the question is the contrast with the
      exponential: a uniform component *ages*, and its expected remaining life
      $(15 - t)/2$ shrinks steadily towards zero, whereas an exponential
      component's expected remaining life is $1/\lambda$ no matter how long it
      has run. Reporting $12$ answers a different question — the expected total
      lifetime — and $7.5$ ignores the conditioning entirely.
    expects: "3"
    rubric:
      - >
        Uses that the conditional law is uniform on $(9, 15)$, so the remaining
        life is $(15-9)/2$.
      - >
        Reports the remaining life, not the total lifetime $12$ or the
        unconditional mean $7.5$.
    targets:
      - quant-probability.conditioning.truncated-mean

  - id: qcnd-truncated-mean-03
    kind: decide
    difficulty: standard
    statement: >
      Machine A's time to failure is exponential with mean $5$ hours; machine
      B's is uniform on $(0, 10)$ hours. Both have been running for $4$ hours
      without failing. Which has the larger expected remaining life, and by how
      much?
    answer: >
      A, by $2$ hours. For the exponential machine, memorylessness says the
      conditional law of the overshoot $X - 4$ given $\{X > 4\}$ is again
      exponential with the same rate, so the expected remaining life is $5$
      hours — exactly what it was at time zero, and what it will be at any later
      time. For the uniform machine, conditioning on $\{X > 4\}$ leaves a uniform
      on $(4, 10)$, so the expected remaining life is $(10 - 4)/2 = 3$ hours,
      down from $5$ hours at time zero. The gap is $5 - 3 = 2$ hours. Both
      machines had the same mean lifetime of $5$ hours when new; four hours of
      survival is *good* news for the exponential machine only in the sense that
      it changes nothing, and unambiguously bad news for the uniform one, whose
      remaining life is now on a countdown.
    choices:
      - text: >
          A, by $2$ hours — $5$ hours against $3$
        correct: true
        feedback: >
          Memorylessness holds A's residual mean at $5$; the uniform's falls to
          $(10-4)/2 = 3$.
      - text: >
          B, by $2$ hours
        feedback: >
          The direction is inverted: it is the uniform machine that ages, so its
          residual mean is the smaller one.
      - text: >
          Neither — both had mean $5$ hours when new, so both still expect $5$
        feedback: >
          Equal means at time zero say nothing after conditioning; only the
          exponential keeps its residual mean.
      - text: >
          A, by $4$ hours
        feedback: >
          $4$ hours is the elapsed time, not the gap. The gap is
          $5 - 3 = 2$ hours.
    rubric:
      - >
        Invokes memorylessness for the exponential rather than recomputing a
        truncated integral.
      - >
        Renormalises the uniform on $(4, 10)$ and reports a remaining life, not
        a total lifetime.
    targets:
      - quant-probability.conditioning.truncated-mean
      - quant-probability.continuous.memoryless-exponential
    connects:
      - "quant-probability.conditioning.truncated-mean ~ quant-probability.continuous.memoryless-exponential"

  # --- two-regime mixtures ----------------------------------------------------

  - id: qcnd-regime-mixture-01
    kind: work
    difficulty: demanding
    statement: >
      A day's P&L is quiet with probability $p$, giving mean $0$ and standard
      deviation $1$, and busy with probability $1 - p$, giving mean $10$ and
      standard deviation $1$. Over all $p$ in $[0,1]$, what is the largest
      possible $\operatorname{Var}(X)$?
    answer: >
      $26$. Split by the law of total variance. The within-group term does not
      depend on $p$ at all, since both regimes have variance $1$:
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] = p(1) + (1-p)(1) = 1$. The
      between-group term is the variance of a two-point variable taking $0$ and
      $10$, which is $p(1-p)(10 - 0)^{2} = 100p(1-p)$. So
      $\operatorname{Var}(X) = 1 + 100p(1-p)$, maximised where $p(1-p)$ is, at
      $p = 1/2$, giving $1 + 25 = 26$. The shape of the answer is the lesson:
      risk here is dominated not by either regime's own noise but by *not
      knowing which regime you are in*, and that ignorance peaks when the two
      are equally likely. At $p = 0$ or $p = 1$ the variance collapses to $1$,
      the within-regime figure. Averaging the two variances alone would report
      $1$ for every $p$ and miss the entire effect.
    expects: "26"
    rubric:
      - >
        Sees that the within-group term is $1$ for every $p$ and isolates the
        $p$-dependence in the between-group term.
      - >
        Uses $p(1-p)\Delta^{2}$ for the variance of the two-point conditional
        mean and maximises it at $p = 1/2$.
    targets:
      - quant-probability.conditioning.regime-mixture
    exercises:
      - quant-probability.conditioning.total-variance

  - id: qcnd-regime-mixture-02
    kind: work
    difficulty: standard
    statement: >
      A market is calm with probability $0.75$, giving a return of mean $0.5$
      and standard deviation $1$, and stressed with probability $0.25$, giving
      mean $-2$ and standard deviation $4$. What is the standard deviation of
      the return?
    answer: >
      About $2.4335$. Within-group:
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] = 0.75(1) + 0.25(16) = 0.75 + 4
      = 4.75$. Between-group, using the two-point shortcut
      $p(1-p)(m_1 - m_2)^{2}$: $0.75(0.25)(0.5 - (-2))^{2} = 0.1875(6.25) =
      1.171875$. Adding, $\operatorname{Var}(X) = 5.921875$ and the standard
      deviation is $\sqrt{5.921875} \approx 2.4335$. Two comparisons. Averaging
      the variances alone gives $\sqrt{4.75} \approx 2.18$, understating the
      spread by about a tenth — mild here, because the two means are only $2.5$
      apart. And averaging the two *standard deviations*, $0.75(1) + 0.25(4) =
      1.75$, is worse still and is never a valid step: it is variances, not
      standard deviations, that combine additively across regimes.
    expects: "2.4335"
    tolerance: 0.0005
    rubric:
      - >
        Averages variances, not standard deviations, for the within-group term.
      - >
        Computes the between-group term from the gap between the two conditional
        means and takes a square root only at the end.
    targets:
      - quant-probability.conditioning.regime-mixture

  # --- conditioning a summand on its total ------------------------------------

  - id: qcnd-exchangeable-share-01
    kind: work
    difficulty: demanding
    statement: >
      A standard $52$-card deck is shuffled and dealt into four hands of $13$.
      Let $T_i$ be the number of aces in hand $i$. Given that hands $1$ and $2$
      together hold three aces, what is $\mathbb{E}[T_1 \mid T_1 + T_2 = 3]$?
    answer: >
      $1.5$. No hypergeometric computation is needed, only symmetry. A uniform
      shuffle makes the hands exchangeable, so hands $1$ and $2$ are
      interchangeable and $\mathbb{E}[T_1 \mid T_1 + T_2] = \mathbb{E}[T_2 \mid
      T_1 + T_2]$. Their sum is $\mathbb{E}[T_1 + T_2 \mid T_1 + T_2] = T_1 +
      T_2$, so each equals half of it: $\mathbb{E}[T_1 \mid T_1 + T_2 = 3] =
      3/2 = 1.5$. Notice what the conditioning did and did not do. It did not
      require knowing that $T_1$ is hypergeometric, nor that the four hands are
      independent — they are not. And the answer is nowhere near the
      unconditional $\mathbb{E}[T_1] = 1$, because learning that two hands hold
      three of the four aces is strong news about hand $1$. Reporting $3/4$,
      dividing the three aces among all four hands, conditions on the wrong
      event: hands $3$ and $4$ are excluded by the conditioning, not shared in
      it.
    expects: "1.5"
    rubric:
      - >
        Argues from exchangeability of the two hands, not from the marginal law
        of $T_1$.
      - >
        Uses $\mathbb{E}[T_1 + T_2 \mid T_1 + T_2] = T_1 + T_2$ to pin the
        common value.
      - >
        Divides the total by $2$, the number of hands being conditioned on, not
        by $4$.
    targets:
      - quant-probability.conditioning.exchangeable-share
    exercises:
      - quant-probability.conditioning.conditional-expectation-rules

  - id: qcnd-exchangeable-share-02
    kind: work
    difficulty: standard
    statement: >
      A basket holds eight stocks whose one-day returns are exchangeable by the
      construction of the basket. Given that the eight returns sum to $52$ basis
      points, what is the conditional expected return of the third stock, in
      basis points?
    answer: >
      $6.5$ basis points. Exchangeability makes the eight conditional means
      $\mathbb{E}[X_i \mid S]$ identical — permuting the stocks permutes nothing
      that the conditioning can see — and they must sum to
      $\mathbb{E}[S \mid S] = S$. Eight equal numbers summing to $52$ are each
      $52/8 = 6.5$. The answer does not depend on which stock is named, so the
      third is no different from the first, and no distributional information
      about the returns was used: not their marginal law, not their variances,
      not their pairwise correlations. What the argument does need is
      exchangeability rather than independence — the returns here are almost
      certainly dependent, through the common market factor, and the equal-share
      conclusion survives that untouched.
    expects: "6.5"
    rubric:
      - >
        States that the conditional means are equal by symmetry before dividing.
      - >
        Divides the given total by $8$, and notes that no marginal law was
        needed.
    targets:
      - quant-probability.conditioning.exchangeable-share

  - id: qcnd-exchangeable-share-03
    kind: decide
    difficulty: standard
    statement: >
      $X_1$ is the face of a fair six-sided die and $X_2$ the face of a fair
      ten-sided die, rolled independently, and $S = X_1 + X_2$. A candidate
      applies the equal-share rule and reports $\mathbb{E}[X_1 \mid S = 9] =
      4.5$. What is the verdict?
    answer: >
      Wrong: the two variables are not exchangeable, and the true value is
      $3.5$. The equal-share rule needs the summands to be interchangeable, and
      here they plainly are not — one ranges over $\{1, \dots, 6\}$ and the
      other over $\{1, \dots, 10\}$, so swapping them changes the joint law.
      Count instead. The event $\{S = 9\}$ is realised by the six pairs
      $(x_1, 9 - x_1)$ for $x_1 = 1, \dots, 6$, since $9 - x_1$ then runs over
      $3, \dots, 8$, all admissible for the ten-sided die, and each pair has the
      same probability $(1/6)(1/10)$. So $X_1$ is conditionally uniform on
      $\{1, \dots, 6\}$ and $\mathbb{E}[X_1 \mid S = 9] = 3.5$. The trap is
      reading "independent, identically shaped, symmetric-looking" as
      exchangeable; independence is neither necessary nor sufficient for the
      rule, and symmetry between the summands is precisely what fails here.
    choices:
      - text: >
          Wrong — the two dice are not exchangeable, and the true value is $3.5$
        correct: true
        feedback: >
          Swapping the summands changes the law, so the equal-share argument
          never gets started; counting the six admissible pairs gives $3.5$.
      - text: >
          Right — independence is all the equal-share rule needs
        feedback: >
          The hypothesis is exchangeability. Independent summands with different
          marginals break the symmetry the rule relies on.
      - text: >
          Wrong — the rule fails only because $9$ is odd
        feedback: >
          Parity is irrelevant; the rule fails at every total here, because the
          two dice are differently distributed.
      - text: >
          Right — by symmetry each summand contributes half the total
        feedback: >
          There is no symmetry between a six-sided and a ten-sided die, which is
          exactly the hypothesis being assumed away.
    rubric:
      - >
        Names exchangeability, not independence, as the hypothesis the rule
        needs, and says why it fails here.
      - >
        Computes the true conditional mean by counting the equally likely pairs
        summing to $9$.
    targets:
      - quant-probability.conditioning.exchangeable-share
      - quant-probability.conditional.symmetry-exchangeability
    connects:
      - "quant-probability.conditional.symmetry-exchangeability ~ quant-probability.conditioning.exchangeable-share"
