# Problems targeting quant-probability.geometric — probability as area.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's instance. See ../README.md.

problems:
  # --- uniform random point in a region ---------------------------------------

  - id: qgeo-uniform-point-01
    kind: work
    difficulty: demanding
    statement: >
      A square ceramic tile of side $4$ is glazed everywhere except a border
      strip of width $1$ running along all four edges. A speck of dust settles
      uniformly at random on the tile. What is the probability that it lands on
      the unglazed border?
    answer: >
      $3/4$. The glazed interior is the concentric square left after trimming
      $1$ from each of the four sides, so its side is $4 - 2 = 2$ and its area
      is $4$. The border is whatever is left of the tile, $16 - 4 = 12$.
      Uniformity turns the question into a ratio of areas,
      $12/16 = 3/4$, and where the strip sits is irrelevant — only how much of
      the tile it occupies. The trap is to price the strip as perimeter times
      width, $16 \cdot 1 = 16$, which is the area of the whole tile and so
      visibly wrong: that product walks around the border and counts each of
      the four corner unit squares twice, overstating the area by exactly $4$.
      Subtracting the inner square never double counts.
    expects: "3/4"
    rubric:
      - >
        Computes the border as the tile minus the concentric inner square of
        side $2$, rather than as perimeter times width.
      - >
        Divides by the tile's area to get a dimensionless ratio, and does not
        let the strip's position enter the answer.
    targets:
      - quant-probability.geometric.uniform-point
    exercises:
      - quant-probability.foundations.classical

  - id: qgeo-uniform-point-02
    kind: work
    difficulty: standard
    statement: >
      A coin lands uniformly at random on a rectangular table top measuring
      $12$ by $9$. Let $A$ be the union of the disc of radius $3$ centred at
      the table's midpoint together with both diagonals of the rectangle, drawn
      as lines. Give $\Pr(P \in A)$ as a decimal to four places.
    answer: >
      $0.2618$. The table has area $12 \cdot 9 = 108$ and the disc contributes
      $\pi \cdot 3^{2} = 9\pi$. The two diagonals are one-dimensional segments
      inside a two-dimensional region, so they have area $0$ and contribute
      nothing whatever: under a uniform point every curve is a
      probability-zero event, which is also why it never matters whether the
      disc's boundary circle is counted in or out. Hence
      $\Pr(P \in A) = 9\pi/108 = \pi/12 = 0.261799\ldots$, that is $0.2618$ to
      four places. There are two ways to get this wrong, and both confuse
      length with area: giving the drawn lines a positive width, or adding the
      circle's circumference $6\pi$ to the numerator instead of its area.
    expects: "0.2618"
    tolerance: 0.00005
    rubric:
      - >
        Assigns the diagonals probability $0$ because a curve has zero area,
        rather than estimating a width for them.
      - >
        Reports $\pi/12$ rounded to the stated four places, not the unrounded
        symbol or a circumference.
    targets:
      - quant-probability.geometric.uniform-point

  - id: qgeo-uniform-point-03
    kind: decide
    difficulty: routine
    statement: >
      An engineer computes that a uniform point on a region $S$ lands in a
      subregion $A$ with probability $0.4$. The blueprint is then redrawn at
      five times the scale, so every length is multiplied by $5$ and $S$ and
      $A$ grow together. What is the probability now?
    choices:
      - text: >
          $0.4$, unchanged
        correct: true
        feedback: >
          Both areas are multiplied by $5^{2} = 25$ and the factor cancels in
          the ratio $|A|/|S|$. A probability is dimensionless, so it survives
          any rescaling of the picture.
      - text: >
          $2$
        feedback: >
          This applies the length factor $5$. Areas, not lengths, enter the
          ratio — and a probability cannot exceed $1$, which is the immediate
          tell.
      - text: >
          $10$
        feedback: >
          This applies the area factor $25$ to the numerator only. The
          denominator is scaled by the same $25$, so it cancels rather than
          surviving.
      - text: >
          $0.016$
        feedback: >
          This divides by $25$ instead of cancelling it — the same slip with
          the exponent's sign flipped.
    answer: >
      $0.4$, unchanged. Rescaling every length by a factor $k$ multiplies every
      area by $k^{2}$, so $|A|/|S|$ becomes $k^{2}|A|/(k^{2}|S|)$, which is the
      original ratio. Here $k = 5$ and $k^{2} = 25$ appears in numerator and
      denominator alike. This is the second consequence of the definition of a
      uniform point, and it is worth reaching for on sight: a geometric
      probability never carries units, so any answer that changes when the
      drawing is enlarged has an arithmetic error in it. It is also the licence
      to rescale an awkward window to the unit square before computing.
    rubric:
      - >
        Recognises that both areas scale by $k^{2}$, so the ratio is unchanged.
      - >
        Says why a probability must be dimensionless, rather than checking the
        arithmetic case by case.
    targets:
      - quant-probability.geometric.uniform-point

  # --- independent uniforms make a uniform point in a box ---------------------

  - id: qgeo-independent-coordinates-01
    kind: work
    difficulty: demanding
    statement: >
      A point $(X,Y)$ is uniform on the triangle with vertices $(0,0)$,
      $(1,0)$ and $(0,1)$. Compute $\Pr(X \le 1/2 \text{ and } Y \le 1/2)$, and
      compare it with the product of the two marginal probabilities.
    answer: >
      $1/2$. The triangle has area $1/2$. The event is the square
      $[0,1/2] \times [0,1/2]$ met with the triangle, but every point of that
      square satisfies $x + y \le 1/2 + 1/2 = 1$, so the square lies entirely
      inside the triangle and the favourable area is its full $1/4$. The ratio
      is $(1/4)/(1/2) = 1/2$. Now the comparison. The excluded corner
      $\{x > 1/2\}$ is a triangle with legs $1/2$ and area $1/8$, a fraction
      $(1/8)/(1/2) = 1/4$ of the region, so $\Pr(X \le 1/2) = 3/4$ and
      likewise for $Y$. Their product is $9/16$, which is not $1/2 = 8/16$. A
      uniform point has independent coordinates on a box and essentially
      nowhere else: on the triangle, knowing $X$ shortens the range left for
      $Y$ to $[0, 1-X]$.
    expects: "1/2"
    rubric:
      - >
        Checks that the whole square $[0,1/2]^{2}$ lies inside the triangle
        before using its area, rather than clipping it against $x + y \le 1$.
      - >
        Computes the two marginals and shows their product $9/16$ differs from
        the joint $1/2$, naming the failure of the product hypothesis.
    targets:
      - quant-probability.geometric.independent-coordinates
    exercises:
      - quant-probability.geometric.uniform-point

  - id: qgeo-independent-coordinates-02
    kind: work
    difficulty: standard
    statement: >
      Three sensors report independent readings $X, Y, Z \sim U(0,5)$. What is
      $\Pr(X > 4 \text{ and } Y > 3 \text{ and } Z > 1)$?
    answer: >
      $8/125 = 0.064$. Independent uniform coordinates make $(X,Y,Z)$ a uniform
      point in the cube $[0,5]^{3}$, of volume $125$. The event is the box with
      side lengths $5 - 4 = 1$, $5 - 3 = 2$ and $5 - 1 = 4$, of volume $8$, so
      the probability is the volume ratio $8/125$. The same number falls out of
      the product rule one coordinate at a time,
      $(1/5)(2/5)(4/5) = 8/125$, and that agreement is the whole content of the
      proposition: a product of one-dimensional uniform probabilities and a
      ratio of volumes in a box are the same arithmetic written two ways.
      Averaging the three surviving lengths and cubing,
      $((1 + 2 + 4)/15)^{3} \approx 0.101$, is the standard wrong move — the
      sides differ, so the favourable region is a box and not a cube.
    expects: "8/125"
    rubric:
      - >
        Reads the three independent uniforms as one uniform point in a cube and
        the event as a sub-box with sides $1$, $2$ and $4$.
      - >
        Multiplies the three marginal probabilities rather than averaging or
        adding the thresholds.
    targets:
      - quant-probability.geometric.independent-coordinates

  - id: qgeo-independent-coordinates-03
    kind: justify
    difficulty: standard
    statement: >
      A uniform point on the unit square has independent coordinates. Show by
      an explicit computation that a uniform point on the unit disc
      $x^{2} + y^{2} \le 1$ does not, and name the hypothesis that fails.
    answer: >
      Let $(X,Y)$ be uniform on the disc of radius $1$, of area $\pi$, and take
      $A = \{X > 0.9\}$ and $B = \{Y > 0.9\}$. Each is a circular segment, and
      by symmetry the two have the same probability $p$. The segment cut off at
      $0.9$ has area $\arccos(0.9) - 0.9\sqrt{1 - 0.81} \approx 0.4510 -
      0.3923 = 0.0587$, so $p \approx 0.0587/\pi \approx 0.0187$, comfortably
      positive. But $A \cap B$ is empty: $x > 0.9$ and $y > 0.9$ force
      $x^{2} + y^{2} > 1.62 > 1$, which is outside the disc. Hence
      $\Pr(A \cap B) = 0 \ne p^{2} > 0$ and the coordinates are dependent. The
      hypothesis that fails is that the region be a product
      $[a,b] \times [c,d]$: the disc is not one, and knowing $X$ confines $Y$
      to $|Y| \le \sqrt{1 - X^{2}}$.
    rubric:
      - >
        Exhibits two specific events whose joint probability differs from the
        product of the marginals, rather than asserting dependence.
      - >
        Names the product-region hypothesis as the one that fails, and says how
        knowing $X$ restricts $Y$.
    targets:
      - quant-probability.geometric.independent-coordinates
    exercises:
      - quant-probability.geometric.uniform-point

  # --- probability as an area ratio (landmark) --------------------------------

  - id: qgeo-probability-as-area-01
    kind: work
    difficulty: demanding
    statement: >
      Let $X$ and $Y$ be independent $U(0,1)$. What is $\Pr(XY \le 1/2)$? Give
      a decimal to four places.
    answer: >
      $0.8466$. Draw the unit square and the hyperbola $y = 1/(2x)$, which
      enters the square at $(1/2, 1)$ and leaves it at $(1, 1/2)$. For
      $x \le 1/2$ the product satisfies $xy \le x \le 1/2$ automatically, so
      the whole vertical strip is favourable and contributes area $1/2$. For
      $x$ between $1/2$ and $1$ the condition is $y \le 1/(2x)$, contributing
      $\int_{1/2}^{1} 1/(2x)\,dx = (1/2)\ln 2 \approx 0.34657$. The total
      favourable area is $1/2 + (1/2)\ln 2 = 0.846574\ldots$ against a square
      of area $1$, so the probability is $0.8466$ to four places. The trap is
      to treat $XY$ as though it were uniform on $[0,1]$ and answer $1/2$; a
      product of two numbers below $1$ is smaller than either of them, so $XY$
      piles up near $0$.
    expects: "0.8466"
    tolerance: 0.00005
    rubric:
      - >
        Splits the square at $x = 1/2$, where the boundary curve leaves the
        top edge, instead of integrating $1/(2x)$ across the whole interval.
      - >
        Evaluates the favourable area as $1/2 + (1/2)\ln 2$ and reports it to
        the four places asked for.
    targets:
      - quant-probability.geometric.probability-as-area
    exercises:
      - quant-probability.geometric.independent-coordinates

  - id: qgeo-probability-as-area-02
    kind: work
    difficulty: standard
    statement: >
      Let $X$ and $Y$ be independent $U(0,1)$. What is
      $\Pr(X^{2} + Y^{2} \le 1)$? Give a decimal to four places.
    answer: >
      $0.7854$. The pair is a uniform point in the unit square, of area $1$,
      and the condition $x^{2} + y^{2} \le 1$ carves out the part of the unit
      disc lying in the first quadrant — a quarter disc, of area
      $\pi/4 = 0.785398\ldots$. Dividing by the square's area of $1$ leaves
      $\pi/4$ itself, so $0.7854$ to four places. This is the Monte Carlo
      estimator for $\pi$ read backwards: throw darts at the square, take the
      fraction landing inside the quarter circle, multiply by $4$. Two slips
      worth naming. Using the half-disc area $\pi/2$ forgets that only one
      quadrant of the disc lies inside the square. Using the arc length
      $\pi/2$ compares a length with an area, and the answer has to be
      dimensionless.
    expects: "0.7854"
    tolerance: 0.00005
    rubric:
      - >
        Identifies the favourable region as a quarter disc of area $\pi/4$
        inside a square of area $1$.
      - >
        Compares area with area, not arc length with area, and rounds to the
        stated four places.
    targets:
      - quant-probability.geometric.probability-as-area

  - id: qgeo-probability-as-area-03
    kind: work
    difficulty: routine
    statement: >
      A machine's two independent settings are $X \sim U(0,6)$ and
      $Y \sim U(0,4)$. What is $\Pr(Y \ge X)$?
    answer: >
      $1/3$. The pair is a uniform point in the $6$ by $4$ rectangle, of area
      $24$. The condition $y \ge x$ is the part of the rectangle above the line
      $y = x$, and that line leaves the rectangle through the corner point
      $(4,4)$ because the rectangle is only $4$ tall. The favourable region is
      therefore the triangle with vertices $(0,0)$, $(0,4)$ and $(4,4)$, a
      right isosceles triangle with legs $4$ and area $4 \cdot 4/2 = 8$. So
      $\Pr(Y \ge X) = 8/24 = 1/3$. Answering $1/2$ is the reflex imported from
      the square: the symmetry between $X$ and $Y$ needs the two to share a
      range, and here they do not — $X$ is likelier to be the larger simply
      because it can reach further.
    expects: "1/3"
    tolerance: 0.0005
    rubric:
      - >
        Draws the rectangle rather than a square, and notices that $y = x$
        exits through $(4,4)$.
      - >
        Does not invoke a symmetry between $X$ and $Y$ that their unequal
        ranges destroy.
    targets:
      - quant-probability.geometric.probability-as-area

  # --- the meeting problem (landmark) -----------------------------------------

  - id: qgeo-meeting-problem-01
    kind: work
    difficulty: demanding
    statement: >
      Two traders each arrive at the coffee machine at a uniformly random time
      between $10$ and $11$, independently, and each waits $12$ minutes for the
      other before giving up. Given that they meet, what is the probability
      that both arrived in the first half hour?
    answer: >
      $4/9 \approx 0.4444$. Measure time in minutes after $10$ and let
      $X, Y \sim U(0,60)$, so the pair is a uniform point in a $60$ by $60$
      square of area $3600$ and meeting is the diagonal band
      $|X - Y| \le 12$. The band's area is the square less two right isosceles
      corner triangles of leg $60 - 12 = 48$, that is
      $3600 - 48^{2} = 3600 - 2304 = 1296$. The joint event — both early and
      they meet — is the same band drawn inside the $30$ by $30$ sub-square,
      of area $30^{2} - 18^{2} = 900 - 324 = 576$. Conditioning divides one
      area by the other, $576/1296 = 4/9$. The trap is to answer $1/4$, the
      unconditional chance that both arrive early: early arrivals are packed
      into a smaller window, so they meet more often than average, and
      conditioning on a meeting therefore tilts the evidence towards them.
    expects: "4/9"
    tolerance: 0.0005
    rubric:
      - >
        Computes both areas inside the same square and divides, rather than
        multiplying the meeting probability by $1/4$.
      - >
        Uses the corner-triangle complement in both the $60$ by $60$ square and
        the $30$ by $30$ sub-square, with legs $48$ and $18$ respectively.
    targets:
      - quant-probability.geometric.meeting-problem
    exercises:
      - quant-probability.geometric.probability-as-area

  - id: qgeo-meeting-problem-02
    kind: work
    difficulty: standard
    statement: >
      Two colleagues agree to meet at a café between $1$ pm and $2$ pm, each
      arriving at a uniformly random time in that hour, independently. Each
      waits $20$ minutes and then leaves. What is the probability they meet?
    answer: >
      $5/9 \approx 0.5556$. With $X, Y \sim U(0,60)$ in minutes past $1$ pm the
      pair is a uniform point in a square of side $60$, area $3600$, and they
      meet exactly when $|X - Y| \le 20$. Take the complement, which is two
      right isosceles corner triangles with legs $60 - 20 = 40$: together they
      have area $2 \cdot 40^{2}/2 = 40^{2} = 1600$. Hence
      $\Pr(\text{meet}) = 1 - 1600/3600 = 1 - 4/9 = 5/9$. Counting the band
      directly returns the same number and is the easier computation to botch,
      which is why subtracting corners is the habit to build. Answering
      $20/60 = 1/3$ treats the difference $X - Y$ as though it were uniform,
      and it is not.
    expects: "5/9"
    tolerance: 0.0005
    rubric:
      - >
        Draws the square of arrival pairs and writes the meeting condition as
        $|X - Y| \le 20$.
      - >
        Subtracts the two corner triangles of leg $40$ rather than measuring
        the band directly or treating $X - Y$ as uniform.
    targets:
      - quant-probability.geometric.meeting-problem

  - id: qgeo-meeting-problem-03
    kind: decide
    difficulty: standard
    statement: >
      A candidate is asked for the probability that two independent uniform
      arrivals in a $60$-minute window, each willing to wait $15$ minutes,
      meet. He answers that $X - Y$ runs over $[-60,60]$, a range of length
      $120$, that meeting means the difference lies in $[-15,15]$, of length
      $30$, and so the answer is $30/120 = 1/4$. The correct answer is $7/16$.
      Which statement identifies his error?
    choices:
      - text: >
          $X - Y$ is not uniform on $[-60,60]$: its density is triangular and
          peaks at $0$, so the central band carries more probability than its
          length suggests.
        correct: true
        feedback: >
          Right. The difference of two independent $U(0,60)$ variables has
          density $(60 - |t|)/3600$ on $[-60,60]$; integrating that over
          $[-15,15]$ gives $7/16$, not the length ratio $1/4$.
      - text: >
          The waiting window should be $[-30,30]$, since either person may wait
          $15$ minutes.
        feedback: >
          The condition really is $|X - Y| \le 15$ — whoever arrives first
          waits $15$ minutes, so a gap of up to $15$ suffices in either order.
          The band is correctly identified; the measure placed on it is not.
      - text: >
          The two arrival times are not independent, because both people are
          trying to meet.
        feedback: >
          Independence is handed over by the mechanism: each arrives uniformly
          and without knowledge of the other. The fault lies in treating the
          derived variable $X - Y$ as uniform, not in the inputs.
      - text: >
          The sample space should be unordered pairs, so the difference ranges
          only over $[0,60]$.
        feedback: >
          Folding to $|X - Y|$ on $[0,60]$ is legitimate, but $|X - Y|$ is not
          uniform either — its density $2(60 - t)/3600$ decreases. The same
          slip survives the fold and would give $15/60 = 1/4$ again.
    answer: >
      The error is treating $X - Y$ as uniform. On the square $[0,60]^{2}$ the
      event $|X - Y| \le 15$ is a diagonal band whose area is the square less
      two corner triangles of leg $45$: $3600 - 45^{2} = 3600 - 2025 = 1575$,
      so the probability is $1575/3600 = 7/16 = 0.4375$. The length-ratio
      argument silently spreads probability evenly along the difference axis,
      but the difference of two independent uniforms has a triangular density
      concentrated at $0$, so a band near zero is worth far more than its
      length. Naming the sample space out loud — the square of arrival pairs,
      not an interval of differences — is what prevents the substitution.
    rubric:
      - >
        Locates the fault in the distribution of $X - Y$, not in the
        independence of the arrivals or the width of the band.
      - >
        Recovers $7/16$ from the square by subtracting the two corner triangles
        of leg $45$.
    targets:
      - quant-probability.geometric.meeting-problem

  # --- the general waiting window ---------------------------------------------

  - id: qgeo-waiting-window-general-01
    kind: work
    difficulty: demanding
    statement: >
      Two couriers must both be at a depot during the same $24$-minute window,
      each arriving at a uniformly random time, independently. Courier A waits
      $6$ minutes for B if she arrives first; courier B waits $9$ minutes for A
      if he arrives first. What is the probability they overlap?
    answer: >
      $67/128 \approx 0.5234$. Put A's arrival on the horizontal axis and B's
      on the vertical, both $U(0,24)$, so the pair is a uniform point in a
      square of area $576$. They miss in two ways, and the patiences differ
      between them. B arrives more than $6$ minutes after A: a corner triangle
      with legs $24 - 6 = 18$, area $18^{2}/2 = 162$. Or A arrives more than
      $9$ minutes after B: a corner triangle with legs $24 - 9 = 15$, area
      $15^{2}/2 = 112.5$. So missing has probability
      $(162 + 112.5)/576 = 274.5/576$ and overlapping has probability
      $301.5/576 = 67/128$. The tempting shortcut — average the patiences to
      $7.5$ and use the equal-patience formula — gives
      $1 - (16.5/24)^{2} = 0.5273$, close but wrong: the map
      $t \mapsto 1 - (1 - t/T)^{2}$ is concave, so averaging inside it
      overstates.
    expects: "67/128"
    tolerance: 0.0005
    rubric:
      - >
        Uses two corner triangles of different legs, $24 - 6$ and $24 - 9$,
        matching each patience to the order of arrival it applies in.
      - >
        Does not average the two patiences and feed the mean into the
        equal-patience formula.
    targets:
      - quant-probability.geometric.waiting-window-general
    exercises:
      - quant-probability.geometric.meeting-problem

  - id: qgeo-waiting-window-general-02
    kind: work
    difficulty: standard
    statement: >
      Two ships each arrive at a single-berth terminal at a uniformly random
      time during a $12$-hour window, independently, and each occupies the
      berth for $1$ hour. What is the probability of a conflict?
    answer: >
      $23/144 \approx 0.1597$. Only the ratio of patience to window matters,
      and here $t/T = 1/12$, so
      $\Pr(\text{conflict}) = 1 - (1 - 1/12)^{2} = 1 - (11/12)^{2}
      = 1 - 121/144 = 23/144$. Drawn out, the two arrivals are a uniform point
      in a $12$ by $12$ square of area $144$, and the two corner triangles
      where the gap exceeds an hour have legs $11$ and combined area
      $11^{2} = 121$. The expanded form
      $2t/T - (t/T)^{2} = 24/144 - 1/144$ shows exactly how the answer sits
      below the naive $2t/T = 1/6$: the subtracted square is the overlap that
      doubling the one-sided chance counts twice, and it is small precisely
      because the occupancy is a small fraction of the window.
    expects: "23/144"
    tolerance: 0.0005
    rubric:
      - >
        Works with the ratio $t/T = 1/12$ rather than carrying hours through
        the arithmetic.
      - >
        Uses $1 - (1 - t/T)^{2}$, not $2t/T$, and can say what the subtracted
        square accounts for.
    targets:
      - quant-probability.geometric.waiting-window-general

  # --- expected gap between two random arrivals -------------------------------

  - id: qgeo-expected-separation-01
    kind: work
    difficulty: demanding
    statement: >
      Let $X$ and $Y$ be independent $U(0,1)$. A colleague insists that
      $\Pr(|X - Y| \le 3/8)$ and $\Pr(|X + Y - 1| \le 3/8)$ must differ, since
      one reads a difference and the other a sum. Compute their common value.
    answer: >
      $39/64 = 0.609375$. Substitute $Y' = 1 - Y$. Reflection carries $U(0,1)$
      to itself and leaves independence intact, so $(X, Y')$ has the same joint
      law as $(X,Y)$; and $X + Y - 1 = X - Y'$, so the two events have equal
      probability. Now compute either one. On the unit square the band
      $|X - Y| \le 3/8$ is the square less two right isosceles corner triangles
      of leg $1 - 3/8 = 5/8$, whose combined area is $(5/8)^{2} = 25/64$, so
      the probability is $1 - 25/64 = 39/64$. Geometrically the substitution is
      just flipping the square top to bottom, which carries the diagonal band
      onto the anti-diagonal band — the same picture that makes the triangular
      density of $X + Y$ and the triangular tail of $|X - Y|$ one computation
      seen from two sides.
    expects: "39/64"
    tolerance: 0.0005
    rubric:
      - >
        Justifies the equality by the reflection $Y \mapsto 1 - Y$, which
        preserves both the uniform law and independence.
      - >
        Evaluates the band as one minus two corner triangles of leg $5/8$,
        giving $39/64$ rather than a length ratio.
    targets:
      - quant-probability.geometric.expected-separation
      - quant-probability.continuous.uniform-sum
    exercises:
      - quant-probability.geometric.meeting-problem
    connects:
      - "quant-probability.continuous.uniform-sum ~ quant-probability.geometric.expected-separation"

  - id: qgeo-expected-separation-02
    kind: work
    difficulty: standard
    statement: >
      Two couriers each arrive at a uniformly random time during a $2$-hour
      window, independently. In minutes after the window opens, what is the
      expected arrival time of the later of the two?
    answer: >
      $80$ minutes. With $X, Y \sim U(0,T)$ and $T = 120$, the later arrival is
      $M = \max(X,Y)$, and $\Pr(M \le t) = (t/T)^{2}$ because both arrivals
      must be at most $t$ — in the square that is the sub-square of side $t$.
      Differentiating gives density $2t/T^{2}$ on $[0,T]$, so
      $\mathbb{E}[M] = \int_{0}^{T} 2t^{2}/T^{2}\,dt = 2T/3 = 80$ minutes. Two
      cross-checks. By symmetry $\mathbb{E}[\min] = T/3 = 40$, and
      $\mathbb{E}[\max] + \mathbb{E}[\min] = \mathbb{E}[X] + \mathbb{E}[Y] =
      T = 120$, which $80 + 40$ satisfies. And
      $\mathbb{E}[\max] - \mathbb{E}[\min] = 40 = T/3$ is the expected gap.
      Answering $60$ treats the later arrival as if it were itself uniform on
      the window.
    expects: "80"
    rubric:
      - >
        Gets $\Pr(\max \le t) = (t/T)^{2}$ from the sub-square, then integrates
        or uses the tail.
      - >
        Checks the answer against $\mathbb{E}[\max] + \mathbb{E}[\min] = T$
        rather than assuming the maximum is uniform.
    targets:
      - quant-probability.geometric.expected-separation
    exercises:
      - quant-probability.geometric.meeting-problem

  # --- breaking a stick into a triangle ---------------------------------------

  - id: qgeo-stick-triangle-01
    kind: work
    difficulty: demanding
    statement: >
      A stick of length $1$ is broken at two independent uniform points. What
      is the probability that no piece is longer than $0.6$?
    answer: >
      $13/25 = 0.52$. Write $m = \min(X,Y)$ and $M = \max(X,Y)$ for the two
      break points, so the pieces are $m$, $M - m$ and $1 - M$. Fix a threshold
      $c \ge 1/2$. At most one piece can exceed $c$, since two of them would
      already sum past $1$, so the three bad events are disjoint and their
      probabilities simply add. Each is $(1-c)^{2}$: the left piece exceeds $c$
      when both breaks land in $(c,1)$; the right piece exceeds $c$ when both
      land in $(0,1-c)$; and the middle piece exceeds $c$ on the two corner
      triangles $|X - Y| > c$, of combined area $(1-c)^{2}$. Hence
      $\Pr(\text{some piece exceeds } c) = 3(1-c)^{2}$, which at $c = 0.6$ is
      $3(0.4)^{2} = 0.48$, leaving $1 - 0.48 = 0.52 = 13/25$. The check at
      $c = 1/2$ returns $3/4$, the familiar failure probability of the triangle
      condition. The trap is reusing $3(1-c)^{2}$ for $c < 1/2$, where two
      pieces can exceed $c$ at once, the regions overlap, and the sum
      over-counts.
    expects: "13/25"
    tolerance: 0.0005
    rubric:
      - >
        Checks that the three bad regions are disjoint, which needs
        $c \ge 1/2$, before adding their areas.
      - >
        Gets each bad region's area as $(1-c)^{2}$ — two of them squares in the
        unit square, one a pair of corner triangles.
    targets:
      - quant-probability.geometric.stick-triangle
    exercises:
      - quant-probability.geometric.probability-as-area

  - id: qgeo-stick-triangle-02
    kind: work
    difficulty: standard
    statement: >
      A stick of length $1$ is broken at two independent uniform points $X$ and
      $Y$. Given that both breaks land in the left half of the stick, what is
      the probability that the three pieces form a triangle?
    answer: >
      $0$. If $X < 1/2$ and $Y < 1/2$ then $M = \max(X,Y) < 1/2$, so the
      right-hand piece has length $1 - M > 1/2$. Three lengths summing to $1$
      form a triangle only when every piece is under $1/2$, so that single
      long piece kills every configuration in the conditioning event. In the
      unit square the conditioning event is the quarter $[0,1/2]^{2}$, which is
      precisely one of the three disjoint quarter-area blocks the triangle
      condition already excluded, so the favourable area inside it is $0$ and
      the conditional probability is $0/(1/4) = 0$. The trap is to reason from
      the unconditional $1/4$ that conditioning on half of each coordinate
      should leave something behind: conditioning is not rescaling, and this
      particular quarter is exactly where the answer was already zero.
    expects: "0"
    rubric:
      - >
        Identifies $1 - \max(X,Y) > 1/2$ as forced by the conditioning, and the
        triangle condition as "no piece exceeds $1/2$".
      - >
        Concludes $0$ rather than rescaling the unconditional $1/4$ onto the
        smaller square.
    targets:
      - quant-probability.geometric.stick-triangle

  # --- lengths of the broken pieces -------------------------------------------

  - id: qgeo-stick-piece-lengths-01
    kind: work
    difficulty: demanding
    statement: >
      A stick of length $1$ is broken at four independent uniform points,
      leaving five pieces. What is the expected length of the longest piece?
    answer: >
      $137/300 \approx 0.4567$. For $n$ breaks the $n+1$ spacings have expected
      maximum $H_{n+1}/(n+1)$, where $H_{k} = 1 + 1/2 + \cdots + 1/k$. With
      $n = 4$ that is
      $H_{5}/5 = (1 + 1/2 + 1/3 + 1/4 + 1/5)/5 = (137/60)/5 = 137/300$. The
      derivation runs through the tail: for $t \le 1/5$ inclusion and exclusion
      gives $\Pr(\text{some spacing exceeds } t) = \sum_{k} (-1)^{k+1}
      \binom{5}{k}(1 - kt)^{4}$, and integrating that tail collapses the
      alternating sum to the harmonic one. Two sanity checks. Each individual
      spacing averages $1/5 = 0.2$ by exchangeability, and $137/300$ is more
      than twice that — the longest of five competitors is nothing like a
      typical one. And the answer must lie between $1/5$ and $1$, which it
      does. Answering $1/5$ confuses the mean of a fixed piece with the mean of
      the winner.
    expects: "137/300"
    tolerance: 0.0005
    rubric:
      - >
        Uses the longest-spacing formula $H_{n+1}/(n+1)$ with $n+1 = 5$, or
        derives it by integrating the inclusion-exclusion tail.
      - >
        Distinguishes the mean of a named piece, $1/5$, from the mean of the
        maximum, and checks the answer exceeds it.
    targets:
      - quant-probability.geometric.stick-piece-lengths
    exercises:
      - quant-probability.geometric.stick-triangle

  - id: qgeo-stick-piece-lengths-02
    kind: work
    difficulty: standard
    statement: >
      A stick of length $1$ is broken at four independent uniform points,
      leaving five pieces in a row. What is the expected length of the second
      piece from the left?
    answer: >
      $1/5$. Do not integrate. The five spacings are exchangeable — permuting
      the four break points, or equivalently reflecting the stick, permutes the
      spacings without changing their joint law — and by construction they sum
      to $1$. Equal expectations adding to a known total force each to be
      $1/5 = 0.2$, the second piece included. This is the same move that
      spreads a deck's non-aces evenly across the gaps between aces: a known
      total plus exchangeability delivers the mean with no distribution in
      sight. Two traps. Supposing the interior pieces must be shorter than the
      outer ones assumes an asymmetry that is not there. And reaching for the
      joint density of the first two order statistics is legitimate but
      needless, and it returns $1/5$ as well.
    expects: "1/5"
    rubric:
      - >
        Argues from exchangeability of the five spacings plus their known total
        of $1$, rather than computing an order-statistic density.
      - >
        States that all five pieces have the same mean, so no piece is
        privileged by its position.
    targets:
      - quant-probability.geometric.stick-piece-lengths
      - quant-probability.expectation.symmetry-expectation
    exercises:
      - quant-probability.geometric.stick-triangle
    connects:
      - "quant-probability.expectation.symmetry-expectation ~ quant-probability.geometric.stick-piece-lengths"

  - id: qgeo-stick-piece-lengths-03
    kind: justify
    difficulty: demanding
    statement: >
      A stick of length $1$ is broken at two independent uniform points,
      leaving three pieces. Show that the shortest piece $S$ satisfies
      $\Pr(S > t) = (1 - 3t)^{2}$ for $0 \le t \le 1/3$, and deduce
      $\mathbb{E}[S]$.
    answer: >
      Let the breaks be $X, Y \sim U(0,1)$, independent, with $m = \min(X,Y)$
      and $M = \max(X,Y)$. All three pieces exceed $t$ exactly when $m > t$,
      $M - m > t$ and $1 - M > t$. Take the ordering $X < Y$ and substitute
      $u = X - t$, $v = Y - X - t$: the three conditions become $u \ge 0$,
      $v \ge 0$ and $u + v \le 1 - 3t$, a right triangle of area
      $(1 - 3t)^{2}/2$, which is the unconstrained ordered triangle of area
      $1/2$ scaled by $1 - 3t$ in each direction. The ordering $Y < X$
      contributes the mirror image, so the total favourable area in the unit
      square is $(1 - 3t)^{2}$ and, the square having area $1$,
      $\Pr(S > t) = (1 - 3t)^{2}$ for $0 \le t \le 1/3$, and $0$ beyond, since
      three pieces cannot all exceed $1/3$. Integrating the tail,
      $\mathbb{E}[S] = \int_{0}^{1/3}(1 - 3t)^{2}\,dt = 1/9$. The same
      substitution with $n$ breaks gives $(1 - (n+1)t)^{n}$ and mean
      $1/(n+1)^{2}$.
    rubric:
      - >
        Reduces the three simultaneous constraints to a scaled copy of the
        original region by shifting each spacing down by $t$.
      - >
        Notes the tail vanishes past $t = 1/3$ and integrates it to get
        $\mathbb{E}[S] = 1/9$, rather than integrating a density.
    targets:
      - quant-probability.geometric.stick-piece-lengths
    exercises:
      - quant-probability.geometric.stick-triangle

  # --- breaking the stick in two stages ---------------------------------------

  - id: qgeo-stick-sequential-break-01
    kind: work
    difficulty: demanding
    statement: >
      A stick of length $1$ is broken at a uniform point $X$, and the left-hand
      piece is then broken at a point uniform along its own length. Given that
      the first break landed beyond $3/4$, what is the probability the three
      pieces form a triangle? Give a decimal to four places.
    answer: >
      $0.1507$. Condition on $X = x$. The pieces are the two parts of the left
      piece, of lengths $Z$ and $x - Z$ with $Z \sim U(0,x)$, and the untouched
      right piece of length $1 - x$. A triangle needs every piece below $1/2$.
      First $1 - x < 1/2$, that is $x > 1/2$, which holds throughout
      $(3/4, 1)$. Then $Z < 1/2$ and $x - Z < 1/2$ together confine $Z$ to the
      window $(x - 1/2,\; 1/2)$, of length $1 - x$ inside a piece of length
      $x$, so the conditional probability is $(1-x)/x$. Averaging over $x$
      uniform on $(3/4, 1)$, which has length $1/4$:
      $\Pr = 4\int_{3/4}^{1} (1-x)/x\,dx = 4\,[\ln x - x]_{3/4}^{1}
      = 4(0.0376821) = 0.1507284$, so $0.1507$. Note how far this sits from the
      $1/4$ of two simultaneous breaks — the mechanism, not the phrase "at
      random", fixes the answer.
    expects: "0.1507"
    tolerance: 0.00005
    rubric:
      - >
        Derives the conditional probability $(1-x)/x$ by locating the window
        the second break must fall in, measured against the left piece's own
        length $x$.
      - >
        Divides by the conditioning probability $1/4$ after integrating over
        $(3/4,1)$, and rounds to the stated four places.
    targets:
      - quant-probability.geometric.stick-sequential-break
    exercises:
      - quant-probability.geometric.stick-triangle

  - id: qgeo-stick-sequential-break-02
    kind: work
    difficulty: standard
    statement: >
      A stick of length $1$ is broken at a uniformly random point $X$, and the
      left-hand piece is then cut exactly in half. What is the probability that
      the three pieces form a triangle?
    answer: >
      $1/2$. The pieces are $x/2$, $x/2$ and $1 - x$. A triangle needs each
      below $1/2$. The two equal pieces satisfy $x/2 < 1/2$ automatically,
      since $x < 1$, so the only binding condition is $1 - x < 1/2$, that is
      $x > 1/2$. With $X \sim U(0,1)$ that has probability $1/2$. The same
      condition read as a triangle inequality: the two short pieces must
      together beat the long one, $x/2 + x/2 = x > 1 - x$. A deterministic
      second cut is still a mechanism, and it is a genuinely different one:
      two simultaneous uniform breaks give $1/4$, re-breaking the left piece
      uniformly gives $\ln 2 - 1/2 \approx 0.193$, and halving the left piece
      gives $1/2$. Nothing in the phrase "broken into three pieces" chooses
      among them.
    expects: "1/2"
    rubric:
      - >
        Reduces the triangle condition to the single inequality $x > 1/2$,
        noting the two equal pieces are never the offender.
      - >
        Treats the deterministic halving as a mechanism in its own right rather
        than importing the $1/4$ of two uniform breaks.
    targets:
      - quant-probability.geometric.stick-sequential-break

  # --- Buffon's needle --------------------------------------------------------

  - id: qgeo-buffon-01
    kind: work
    difficulty: demanding
    statement: >
      A needle is dropped on a floor ruled with parallel lines $10$ centimetres
      apart. How long must the needle be, in centimetres to three decimal
      places, for it to cross a line exactly half the time?
    answer: >
      $7.854$ centimetres. Buffon's formula for a needle of length $\ell$ on
      lines spaced $d$ apart, valid while $\ell \le d$, is
      $\Pr(\text{cross}) = 2\ell/(\pi d)$. Setting that equal to $1/2$ and
      solving gives $\ell = \pi d/4 = 10\pi/4 = 7.853981\ldots$, so $7.854$ to
      three places. The hypothesis $\ell \le d$ must be checked and it holds,
      since $\pi/4 \approx 0.785 < 1$; had the answer exceeded $d$ the formula
      would have been reporting an expected number of crossings rather than a
      probability, and no length would solve the problem as posed. Answering
      $d/2 = 5$ assumes the crossing chance is $\ell/d$ with constant $1$, but
      the constant is $2/\pi \approx 0.6366$, and it comes from averaging
      $\sin\theta$ over the needle's uniform orientation.
    expects: "7.854"
    tolerance: 0.0005
    rubric:
      - >
        Inverts $2\ell/(\pi d) = 1/2$ to $\ell = \pi d/4$ rather than treating
        the crossing chance as $\ell/d$.
      - >
        Verifies $\ell \le d$, so the formula is a probability and not an
        expected count.
    targets:
      - quant-probability.geometric.buffon
    exercises:
      - quant-probability.geometric.probability-as-area

  - id: qgeo-buffon-02
    kind: work
    difficulty: standard
    statement: >
      A matchstick of length $5$ centimetres is dropped repeatedly on a floor
      ruled with parallel lines $8$ centimetres apart. Over $2000$ drops, what
      is the expected total number of crossings, to the nearest whole number?
    answer: >
      $796$. A single drop crosses with probability
      $2\ell/(\pi d) = 2 \cdot 5/(8\pi) = 10/(8\pi) = 0.3978874\ldots$, and
      because $\ell \le d$ this really is a probability: the needle is too
      short to meet two lines, so its crossing count is $0$ or $1$ and its
      expectation equals the probability. Linearity then gives
      $2000 \cdot 0.3978874 = 795.775$ expected crossings, which rounds to
      $796$. The usual slip is to read the ratio as $\ell/d = 0.625$ and answer
      $1250$; that drops the factor $2/\pi$, which comes from averaging the
      projected half-length $(\ell/2)\sin\theta$ over a uniform angle and is
      the whole content of the formula.
    expects: "796"
    tolerance: 0.5
    rubric:
      - >
        Computes the per-drop probability as $2\ell/(\pi d)$ and multiplies by
        $2000$, rather than using $\ell/d$.
      - >
        Says why the per-drop expectation equals the per-drop probability here,
        namely $\ell \le d$.
    targets:
      - quant-probability.geometric.buffon

  # --- Buffon's noodle --------------------------------------------------------

  - id: qgeo-buffon-noodle-01
    kind: work
    difficulty: demanding
    statement: >
      A rigid equilateral triangular loop of wire, of side $d/2$, is dropped in
      a uniformly random position and orientation on a floor ruled with
      parallel lines a distance $d$ apart. What is its expected number of
      crossings? Give a decimal to four places.
    answer: >
      $0.9549$. Only total length matters. The loop has perimeter
      $\ell = 3d/2$, so the expected number of crossings is
      $2\ell/(\pi d) = 2(3d/2)/(\pi d) = 3/\pi = 0.954929\ldots$, that is
      $0.9549$. The argument is linearity of expectation applied to badly
      dependent pieces: cut the loop into short segments, whose crossing counts
      add exactly, and take expectations term by term — legitimate whether or
      not the segments are independent, and here they are welded into one rigid
      object, so they are as dependent as pieces can be. A segment of length
      $s$ contributes $2s/(\pi d)$, so only $\sum s = \ell$ survives the sum,
      and the triangle's shape drops out. Note that this is an expectation and
      not a probability: a small convex loop crosses $0$ or $2$ times, so the
      chance of touching a line at all is $3/(2\pi) \approx 0.4775$, and
      reporting $0.9549$ as a probability would be the error to avoid.
    expects: "0.9549"
    tolerance: 0.00005
    rubric:
      - >
        Uses the perimeter $3d/2$ in $2\ell/(\pi d)$ and does not attempt to
        model the triangle's geometry.
      - >
        Distinguishes the expected count from a probability, using that a
        convex loop crosses an even number of times.
    targets:
      - quant-probability.geometric.buffon-noodle
      - quant-probability.expectation.linearity
    exercises:
      - quant-probability.geometric.buffon
    connects:
      - "quant-probability.expectation.linearity ~ quant-probability.geometric.buffon-noodle"

  - id: qgeo-buffon-noodle-02
    kind: decide
    difficulty: standard
    statement: >
      A rigid V-shaped wire is made of two straight arms, each of length $d$,
      welded together at a right angle. It is dropped in a uniformly random
      position and orientation on a floor ruled with parallel lines a distance
      $d$ apart. What is its expected number of crossings?
    choices:
      - text: >
          $4/\pi \approx 1.273$
        correct: true
        feedback: >
          The total length is $2d$, so the expected count is
          $2(2d)/(\pi d) = 4/\pi$. Neither the shape nor the weld angle enters;
          only length does.
      - text: >
          $2/\pi \approx 0.637$
        feedback: >
          That is one arm's expected count. Crossing counts add along the wire
          and so do their expectations, so the whole wire's count is twice an
          arm's.
      - text: >
          $8/\pi^{2} \approx 0.811$
        feedback: >
          This multiplies the two arms' expectations, as though the arms
          contributed independent events to be combined. Expectation of a sum
          is the sum of expectations; no independence is needed, and none is
          available for two welded arms.
      - text: >
          $1$, since the arms are perpendicular and on average one of them lies
          along the lines
        feedback: >
          Averaging orientations does not let you treat one arm as parallel to
          the lines. Each arm contributes $2d/(\pi d) = 2/\pi$ to the
          expectation, and the total $4/\pi \approx 1.273$ legitimately exceeds
          $1$, because the wire can cross more than once.
    answer: >
      $4/\pi \approx 1.2732$. The noodle result reads the expected crossing
      count off total length alone: $2\ell/(\pi d)$ with $\ell = 2d$ gives
      $4/\pi$. What makes it work is that crossing counts add along the curve
      and expectation is additive regardless of dependence — and the two arms
      of a rigid V are about as dependent as two pieces can be, since they move
      together as one object. Because $4/\pi > 1$ the number is plainly an
      expectation rather than a probability, which is the honest reading
      whenever the curve is long enough to meet a line more than once. The
      probability of at least one crossing is a harder and shape-dependent
      quantity, and the noodle theorem says nothing about it.
    rubric:
      - >
        Adds the two arms' lengths and applies $2\ell/(\pi d)$ once, rather
        than combining per-arm probabilities.
      - >
        Recognises that a value above $1$ is fine for an expected count and
        would not be for a probability.
    targets:
      - quant-probability.geometric.buffon-noodle
    exercises:
      - quant-probability.geometric.buffon

  # --- uniform point in a disc ------------------------------------------------

  - id: qgeo-uniform-in-disc-01
    kind: work
    difficulty: demanding
    statement: >
      A dart lands uniformly at random on a circular board of radius $9$
      inches, and $D$ is its distance from the centre. Given that $D > 4.5$,
      what is the probability that $D$ lies between $3$ and $6$ inches?
    answer: >
      $7/27 \approx 0.2593$. Distances obey $\Pr(D \le r) = r^{2}/R^{2}$, the
      ratio of the disc of radius $r$ to the board of radius $R = 9$. The
      conditioning event has probability
      $1 - (4.5/9)^{2} = 1 - 1/4 = 3/4$, or $60.75/81$ in eighty-firsts of the
      board. The intersection is $4.5 < D < 6$, because the part of the
      annulus below $4.5$ is cut away by the conditioning, and it has
      probability $(6^{2} - 4.5^{2})/9^{2} = (36 - 20.25)/81 = 15.75/81$.
      Dividing, $15.75/60.75 = 7/27$. The trap is to work in radii rather than
      areas: the interval $(4.5,6)$ is a third of the surviving interval
      $(4.5,9)$, which suggests $1/3$. But the radius is not uniform — its
      density is $2r/R^{2}$ — so the outer part of the board carries more
      probability than its width alone would earn.
    expects: "7/27"
    tolerance: 0.0005
    rubric:
      - >
        Intersects the two events correctly, so the numerator is
        $\Pr(4.5 < D < 6)$ and not $\Pr(3 < D < 6)$.
      - >
        Compares areas rather than radii, using $\Pr(D \le r) = r^{2}/R^{2}$.
    targets:
      - quant-probability.geometric.uniform-in-disc
    exercises:
      - quant-probability.geometric.probability-as-area

  - id: qgeo-uniform-in-disc-02
    kind: work
    difficulty: standard
    statement: >
      A point is chosen uniformly at random in a disc of radius $R$. What is
      the probability that it lands closer to the rim than to the centre?
    answer: >
      $3/4$. Let $D$ be the distance from the centre. The distance to the rim,
      measured along the radius through the point, is $R - D$, so "closer to
      the rim" is $R - D < D$, that is $D > R/2$. Since
      $\Pr(D \le r) = r^{2}/R^{2}$, this is
      $1 - (1/2)^{2} = 1 - 1/4 = 3/4$. The intuitive answer $1/2$ treats the
      radius as if it were uniform; it is not, and the picture says why — the
      outer half of the radius sweeps out the outer annulus, three quarters of
      the area, because circumference grows with radius. The same fact puts the
      median distance at $R/\sqrt{2} \approx 0.707R$ rather than $R/2$, and it
      is why sampling $r \sim U(0,R)$ crowds simulated points near the centre.
    expects: "3/4"
    rubric:
      - >
        Converts "closer to the rim" into $D > R/2$ before computing anything.
      - >
        Uses the area ratio $r^{2}/R^{2}$ rather than assuming the radius is
        uniform.
    targets:
      - quant-probability.geometric.uniform-in-disc

  # --- Bertrand's chord paradox (landmark) ------------------------------------

  - id: qgeo-bertrand-paradox-01
    kind: work
    difficulty: demanding
    statement: >
      A chord of a circle of radius $R$ is drawn by the random-radius
      mechanism: pick a radius, take a point uniform along it, and draw the
      chord perpendicular to the radius through that point. What is the
      probability the chord is longer than $R\sqrt{2}$, the side of the
      inscribed square? Give a decimal to four places.
    answer: >
      $0.7071$. A chord whose distance from the centre is $x$ has length
      $2\sqrt{R^{2} - x^{2}}$. Requiring $2\sqrt{R^{2} - x^{2}} > R\sqrt{2}$
      gives $4(R^{2} - x^{2}) > 2R^{2}$, hence $x^{2} < R^{2}/2$ and
      $x < R/\sqrt{2}$. Under this mechanism $x$ is uniform on $[0,R]$ — that
      is what "a point uniform along the radius" means — so the probability is
      the length ratio $(R/\sqrt{2})/R = 1/\sqrt{2} = 0.707106\ldots$, that is
      $0.7071$. The number depends entirely on the mechanism: with a uniform
      midpoint in the disc the same threshold $x < R/\sqrt{2}$ is measured by
      area and returns $(1/\sqrt{2})^{2} = 1/2$. Squaring or not squaring is
      exactly the fault line the paradox sits on.
    expects: "0.7071"
    tolerance: 0.00005
    rubric:
      - >
        Converts the length condition into $x < R/\sqrt{2}$ on the chord's
        distance from the centre.
      - >
        Measures $x$ by length, because this mechanism makes it uniform on
        $[0,R]$, and does not square the ratio.
    targets:
      - quant-probability.geometric.bertrand-paradox
    exercises:
      - quant-probability.geometric.uniform-in-disc

  - id: qgeo-bertrand-paradox-02
    kind: work
    difficulty: standard
    statement: >
      The same question — is the chord longer than $R\sqrt{2}$, the side of the
      inscribed square? — is now asked under the random-midpoint mechanism,
      with the chord's midpoint uniform in the disc. What is the probability?
    answer: >
      $1/2$. A chord with midpoint at distance $x$ from the centre is longer
      than $R\sqrt{2}$ exactly when $x < R/\sqrt{2}$, the same threshold as
      before. What changes is the measure: the midpoint is now a uniform point
      in the disc, so the probability is a ratio of areas,
      $\pi(R/\sqrt{2})^{2}/(\pi R^{2}) = 1/2$. Set beside the random-radius
      answer $1/\sqrt{2} \approx 0.7071$, the pair makes the paradox concrete
      on a second target — the inscribed square rather than the inscribed
      triangle. One wrinkle worth knowing: the random-endpoint mechanism also
      returns $1/2$ here, since the chord beats $R\sqrt{2}$ exactly when the
      central angle exceeds $90^{\circ}$, half of the available
      $180^{\circ}$. So the three mechanisms need not always give three
      different numbers; they are simply not guaranteed to agree.
    expects: "1/2"
    rubric:
      - >
        Keeps the threshold $x < R/\sqrt{2}$ and changes only the measure, from
        length along a radius to area in the disc.
      - >
        Squares the ratio because the midpoint is two-dimensional, giving
        $1/2$ rather than $1/\sqrt{2}$.
    targets:
      - quant-probability.geometric.bertrand-paradox
    exercises:
      - quant-probability.geometric.uniform-in-disc

  - id: qgeo-bertrand-paradox-03
    kind: decide
    difficulty: standard
    statement: >
      An interviewer asks for the probability that a chord of a circle, drawn
      at random, is longer than the side of the inscribed equilateral triangle.
      Which response is the right one?
    choices:
      - text: >
          The question has no single answer until the drawing mechanism is
          fixed; name the mechanism you will assume, compute under it, and say
          what the other standard mechanisms would give.
        correct: true
        feedback: >
          This is the content of the paradox. Random endpoints give $1/3$, a
          uniform point along a radius gives $1/2$, a uniform midpoint in the
          disc gives $1/4$ — each correct for its own experiment.
      - text: >
          $1/3$, because the endpoints of a chord are what is genuinely random,
          so the endpoint mechanism is the canonical one.
        feedback: >
          No mechanism is canonical. "Endpoints are what is random" is itself a
          choice of parameterization, and a nonlinear change of parameter
          destroys uniformity — which is exactly why the three answers differ.
      - text: >
          $1/4$, because the midpoint is the only genuinely two-dimensional
          uniform, so the classical model licenses that mechanism alone.
        feedback: >
          Dimension does not privilege a mechanism. The classical model asks
          which list of outcomes is being called equally likely; midpoints,
          radii and endpoint pairs are three such lists, and favourable over
          total is defined only after one of them is chosen.
      - text: >
          The three answers should be averaged, giving
          $(1/3 + 1/2 + 1/4)/3 = 13/36$.
        feedback: >
          Averaging three models does not produce a fourth. Without a stated
          distribution over mechanisms the average means nothing, and no
          physical procedure yields $13/36$.
    answer: >
      There is no answer until the mechanism is named. Random endpoints give
      $1/3$: fix one endpoint and the other must land in the opposite
      $120^{\circ}$ arc. A uniform point along a radius gives $1/2$: the chord
      is long exactly when that point lies within $R/2$ of the centre, half of
      the radius by length. A uniform midpoint in the disc gives $1/4$: the
      midpoint must land in the concentric disc of radius $R/2$, an area ratio
      of $(1/2)^{2}$. All three are correct computations of different
      experiments. This is the continuous form of the classical model's fine
      print — favourable over total presupposes a decision about which outcomes
      are equally likely — and the interview craft is to say so aloud, choose
      one, and price it.
    rubric:
      - >
        Refuses to name a single number without a mechanism, rather than
        picking one of the three and defending it as standard.
      - >
        Can produce at least two of $1/3$, $1/2$ and $1/4$ with the mechanism
        each belongs to.
    targets:
      - quant-probability.geometric.bertrand-paradox
      - quant-probability.foundations.classical
    connects:
      - "quant-probability.foundations.classical ~ quant-probability.geometric.bertrand-paradox"

  # --- uniform in what? -------------------------------------------------------

  - id: qgeo-specify-the-mechanism-01
    kind: work
    difficulty: demanding
    statement: >
      A cube is manufactured with its edge length uniform on $[0,2]$
      centimetres. What is the expected volume of the cube, in cubic
      centimetres?
    answer: >
      $2$. With $S \sim U(0,2)$ the volume is $S^{3}$, so
      $\mathbb{E}[S^{3}] = \dfrac{1}{2}\int_{0}^{2} s^{3}\,ds
      = \dfrac{1}{2} \cdot \dfrac{2^{4}}{4} = \dfrac{16}{8} = 2$. Two other
      numbers are worth naming, because each answers a different question.
      Cubing the mean edge gives $(\mathbb{E}[S])^{3} = 1^{3} = 1$: that is not
      the same quantity, and it must understate, since cubing is convex on
      $[0,2]$. And modelling "a random cube with edge at most $2$" by taking
      the volume uniform on $[0,8]$ gives mean $4$ — a defensible-sounding
      sentence describing a third experiment entirely, in which the edge has
      density concentrated near $2$. Uniform in the edge, uniform in the volume
      and "the average cube" are three different objects, and the English does
      not choose between them.
    expects: "2"
    rubric:
      - >
        Computes $\mathbb{E}[S^{3}]$ rather than $(\mathbb{E}[S])^{3}$, and can
        say which way the inequality between them runs.
      - >
        Notes that "volume uniform on $[0,8]$" is a different mechanism with a
        different answer, not a restatement of the same one.
    targets:
      - quant-probability.geometric.specify-the-mechanism

  - id: qgeo-specify-the-mechanism-02
    kind: decide
    difficulty: standard
    statement: >
      An interviewer says: "A stick is broken at random into three pieces. What
      is the probability they form a triangle?" What should you do first?
    choices:
      - text: >
          Ask which mechanism is meant — two simultaneous uniform breaks, or
          one break followed by a re-break of a named piece — because the
          answers differ.
        correct: true
        feedback: >
          Exactly. Two simultaneous uniform breaks give $1/4$; re-breaking the
          left piece uniformly gives $\ln 2 - 1/2 \approx 0.193$; re-breaking
          the longer piece gives $2\ln 2 - 1 \approx 0.386$; re-breaking the
          shorter piece gives $0$. State the assumption, then compute.
      - text: >
          Answer $1/4$ at once, since that is the standard broken-stick result.
        feedback: >
          $1/4$ is right for two simultaneous uniform breaks and wrong for
          every sequential mechanism. Producing it without saying which
          experiment you priced is the failure the question is probing for.
      - text: >
          Point out that the three pieces are exchangeable whatever the
          mechanism, so all mechanisms must agree.
        feedback: >
          Exchangeability fails as soon as the breaks are sequential: the
          untouched piece has a different distribution from the two parts of
          the re-broken one, and that asymmetry is precisely what moves the
          answer.
      - text: >
          Rescale the stick to length $1$; since only ratios matter, the answer
          is then determined.
        feedback: >
          Rescaling is legitimate and changes nothing, which is the point — it
          cannot resolve the ambiguity, because the ambiguity is about which
          measure you started from, not about units.
    answer: >
      Ask for the mechanism. In a continuous problem "at random" fixes nothing
      until the variable that is uniform has been named, and the broken stick
      is the cleanest demonstration. Two independent uniform breaks give
      $1/4$. A first break at $X \sim U(0,1)$ followed by a uniform re-break of
      the left piece gives $\ln 2 - 1/2 \approx 0.193$. Re-breaking the longer
      piece instead gives $2\ln 2 - 1 \approx 0.386$. Re-breaking the shorter
      piece gives $0$, because the untouched piece is then always at least half
      the stick. Four procedures, four answers, one sentence of English. The
      craft is to say which one you are pricing before you price it, and to
      flag the ambiguity rather than hide it.
    rubric:
      - >
        Asks for the mechanism before computing, instead of producing the most
        familiar number.
      - >
        Can name at least two mechanisms and the different answers they give.
    targets:
      - quant-probability.geometric.specify-the-mechanism

  # --- n points on a semicircle -----------------------------------------------

  - id: qgeo-semicircle-01
    kind: work
    difficulty: demanding
    statement: >
      Six points are placed independently and uniformly at random on a circle.
      What is the probability that all six lie within some arc of
      $120^{\circ}$?
    answer: >
      $2/81 \approx 0.0247$. Generalise the semicircle anchor argument. For an
      arc covering a fraction $p$ of the circle with $p \le 1/2$, let $A_i$ be
      the event that the other $n-1$ points all lie in the arc of length $p$
      starting at point $i$ and running clockwise; each has probability
      $p^{n-1}$. If a covering arc exists at all, its clockwise-most point is
      the unique point that can serve as anchor, so the $A_i$ are disjoint and
      their union is exactly the event asked about. Adding,
      $\Pr = n p^{n-1}$. Here $n = 6$ and $p = 1/3$, giving
      $6(1/3)^{5} = 6/243 = 2/81$. Setting $p = 1/2$ recovers the familiar
      $n/2^{n-1}$. The hypothesis $p \le 1/2$ is what the argument turns on:
      for an arc of $200^{\circ}$ two different points could each anchor a
      covering arc, the events overlap, and plain addition over-counts.
    expects: "2/81"
    tolerance: 0.0005
    rubric:
      - >
        Uses the anchor construction with $p = 1/3$, giving $n p^{n-1}$ rather
        than $n/2^{n-1}$.
      - >
        States why the $A_i$ are disjoint, and that this needs the arc to be at
        most a semicircle.
    targets:
      - quant-probability.geometric.semicircle
    exercises:
      - quant-probability.geometric.probability-as-area

  - id: qgeo-semicircle-02
    kind: work
    difficulty: standard
    statement: >
      Each of seven analysts independently picks a uniformly random direction
      on a compass. What is the probability that all seven directions fall
      within some half of the compass?
    answer: >
      $7/64 \approx 0.1094$. For each analyst $i$ let $A_i$ be the event that
      the other six directions all lie in the semicircle beginning at $i$'s
      direction and running clockwise; that has probability
      $(1/2)^{6} = 1/64$. If some semicircle contains all seven directions,
      its clockwise-most direction is the unique one able to serve as anchor,
      so the seven events are disjoint and their union is precisely the event
      in question. Adding, $\Pr = 7/2^{6} = 7/64$. Coincident directions have
      probability $0$, so the anchor is always well defined. Two slips to
      avoid: multiplying the seven probabilities, and reaching for inclusion
      and exclusion. Both assume the $A_i$ can overlap, and the disjointness is
      exactly what makes plain addition correct here.
    expects: "7/64"
    tolerance: 0.0005
    rubric:
      - >
        Anchors on the clockwise-most point, giving $n$ disjoint events of
        probability $(1/2)^{n-1}$ each.
      - >
        Adds rather than multiplying or applying inclusion and exclusion.
    targets:
      - quant-probability.geometric.semicircle

  # --- does the random triangle contain the centre? ---------------------------

  - id: qgeo-triangle-contains-centre-01
    kind: work
    difficulty: demanding
    statement: >
      Points are placed independently and uniformly at random on a circle. What
      is the smallest number of points for which the probability that their
      convex hull contains the centre first exceeds $0.99$?
    answer: >
      $12$. The hull misses the centre exactly when all $n$ points lie in some
      semicircle, an event of probability $n/2^{n-1}$, so the hull contains the
      centre with probability $1 - n/2^{n-1}$ and the requirement is
      $n/2^{n-1} < 0.01$. Tabulating the tail: $n = 10$ gives
      $10/512 = 0.01953$, still too large; $n = 11$ gives
      $11/1024 = 0.010742$, only just too large; $n = 12$ gives
      $12/2048 = 0.005859$, which clears the bar. So $n = 12$. The near miss at
      $n = 11$ is the point of the problem — halving $10/512$ once suggests
      eleven points suffice, but the linear factor $n$ in the numerator grows
      alongside the halving denominator and holds $11/1024$ above $0.01$. An
      answer that stops at the first plausible $n$ without evaluating $n = 11$
      lands one short.
    expects: "12"
    rubric:
      - >
        Takes the complement, so the target inequality is
        $n/2^{n-1} < 0.01$ rather than $1 - n/2^{n-1} < 0.99$.
      - >
        Evaluates $n = 11$ explicitly instead of extrapolating from $n = 10$ by
        halving.
    targets:
      - quant-probability.geometric.triangle-contains-centre
    exercises:
      - quant-probability.geometric.semicircle

  - id: qgeo-triangle-contains-centre-02
    kind: work
    difficulty: standard
    statement: >
      Eight points are placed independently and uniformly at random on a
      circle. What is the probability that their convex hull contains the
      centre?
    answer: >
      $15/16 = 0.9375$. The hull fails to contain the centre exactly when all
      eight points lie in some semicircle. If they do, the hull sits strictly
      on one side of the diameter bounding that semicircle and the centre is
      outside it; if they do not, no line through the centre has all eight
      points on one side, which is what containment means. The semicircle
      probability is $n/2^{n-1} = 8/2^{7} = 8/128 = 1/16$, so the answer is
      $1 - 1/16 = 15/16$. Keep the three-point case beside it as a contrast:
      there the semicircle event has probability $3/4$, so a random inscribed
      triangle contains the centre only a quarter of the time. Five extra
      points take the answer from $1/4$ to $15/16$, because the semicircle
      event decays like $n/2^{n-1}$.
    expects: "15/16"
    rubric:
      - >
        Identifies "hull misses the centre" with "all points in a semicircle",
        and says why the two are the same event.
      - >
        Evaluates $8/2^{7} = 1/16$ and subtracts, rather than reporting the
        semicircle probability itself.
    targets:
      - quant-probability.geometric.triangle-contains-centre
    exercises:
      - quant-probability.geometric.semicircle
