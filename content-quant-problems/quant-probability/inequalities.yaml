# Problems targeting quant-probability.inequalities — the bounding toolkit.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's numbers. See ../README.md.

problems:
  # --- Markov's inequality (landmark) -----------------------------------------

  - id: qineq-markov-01
    kind: work
    difficulty: demanding
    statement: >
      A desk's overnight P&L $Y$, in thousands of dollars, is held above $-50$
      by a hard stop-loss and has mean $\mathbb{E}[Y] = -2$. Nothing else about
      its distribution is known. Give the sharpest bound on $\Pr(Y \ge 30)$
      that Markov's inequality can produce.
    answer: >
      $3/5$. Markov cannot be applied to $Y$ as it stands, because $Y$ takes
      negative values; but the stop-loss hands over a shift that repairs
      exactly that. Put $X = Y + 50$, which is nonnegative by construction and
      has $\mathbb{E}[X] = -2 + 50 = 48$ by linearity. The event is unchanged
      by the shift: $\{Y \ge 30\} = \{X \ge 80\}$. Markov then gives
      $\Pr(X \ge 80) \le 48/80 = 3/5$. The trap is applying Markov to $Y$
      directly and reporting $\mathbb{E}[Y]/30 = -2/30 \approx -0.067$ — a
      negative number offered as an upper bound on a probability, which is the
      loudest possible signal that the nonnegativity hypothesis was skipped.
      Note also how little the shift buys: $3/5$ is a weak statement, because
      the shift inflates the mean from $-2$ to $48$ and Markov sees only that
      inflated mean.
    expects: "3/5"
    rubric:
      - >
        Shifts by the known lower bound to manufacture a nonnegative variable
        before invoking Markov, rather than applying it to $Y$ directly.
      - >
        Translates the threshold along with the variable, so the event becomes
        $\{X \ge 80\}$ and not $\{X \ge 30\}$.
      - >
        Says what applying Markov to $Y$ unshifted would have produced, and why
        a negative bound is nonsense rather than merely loose.
    targets:
      - quant-probability.inequalities.markov
    exercises:
      - quant-probability.expectation.expectation

  - id: qineq-markov-02
    kind: work
    difficulty: standard
    statement: >
      A warehouse's daily shipment count $X$ is nonnegative with mean
      $\mathbb{E}[X] = 45$. Bound the probability that some day sees at least
      $300$ shipments.
    answer: >
      $3/20$. Markov applies as written, since a count cannot be negative:
      $\Pr(X \ge 300) \le \mathbb{E}[X]/300 = 45/300 = 3/20 = 0.15$. The
      rescaled form reads the same number off without dividing: $300$ is
      $20/3$ times the mean, so $k = 20/3$ and the bound is $1/k = 3/20$. Two
      things are worth saying out loud when quoting this. First, nothing but
      the mean went in, so nothing but the mean can come out — the true
      probability may be anywhere in $[0, 3/20]$, and on a realistic count
      distribution it will be far nearer $0$. Second, the bound is only
      informative because $300$ sits well above $45$; at a threshold of $40$
      the same formula would return $45/40 > 1$ and say nothing at all.
    expects: "3/20"
    rubric:
      - >
        Divides the mean by the threshold, and checks the nonnegativity
        hypothesis rather than assuming it.
      - >
        Presents $3/20$ as a ceiling, not as an estimate of the actual
        probability.
    targets:
      - quant-probability.inequalities.markov

  - id: qineq-markov-03
    kind: justify
    difficulty: standard
    statement: >
      Prove Markov's inequality, $\Pr(X \ge a) \le \mathbb{E}[X]/a$ for
      $X \ge 0$ and $a > 0$, from the pointwise comparison with an indicator.
      Say exactly which step consumes the nonnegativity hypothesis, and exhibit
      a variable showing the conclusion is false without it.
    answer: >
      Fix $a > 0$ and compare $X$ with the step function
      $a\mathbf{1}\{X \ge a\}$ outcome by outcome. On the event $\{X \ge a\}$
      the step equals $a$, which is at most $X$ there by definition of the
      event. Off that event the step equals $0$, and $X \ge 0$ is precisely
      what makes $X \ge 0$ true there — this second case is the only place
      nonnegativity is used, and it is used essentially. So
      $X \ge a\mathbf{1}\{X \ge a\}$ pointwise, and monotonicity of expectation
      gives $\mathbb{E}[X] \ge a\,\mathbb{E}[\mathbf{1}\{X \ge a\}] =
      a\Pr(X \ge a)$, since the mean of an indicator is the probability of its
      event. Dividing by $a > 0$ finishes. Without nonnegativity the conclusion
      is false, not merely unproved: let $X$ equal $4$ or $-4$ with equal
      probability, so $\mathbb{E}[X] = 0$ while $\Pr(X \ge 1) = 1/2$. The
      claimed bound would read $\Pr(X \ge 1) \le 0$. The mass at $-4$ is doing
      the damage: it pays for the mass at $4$ inside the mean, which is exactly
      the compensation the step-function comparison forbids.
    rubric:
      - >
        Builds the pointwise inequality $X \ge a\mathbf{1}\{X \ge a\}$ by
        splitting on the event, and takes expectations of both sides.
      - >
        Identifies the off-event branch as the one that needs $X \ge 0$, rather
        than gesturing at nonnegativity in general.
      - >
        Gives a signed variable for which the conclusion actually fails, not
        merely one for which the proof stalls.
    targets:
      - quant-probability.inequalities.markov
    exercises:
      - quant-probability.expectation.expectation

  # --- Markov is tight, and usually terrible ----------------------------------

  - id: qineq-markov-tightness-01
    kind: work
    difficulty: demanding
    statement: >
      $X \ge 0$ has mean $5$ and nothing else is known about it. What is the
      sharpest upper bound on $\Pr(X \ge 4)$ that the mean alone permits?
    answer: >
      $1$. Markov's formula returns $\mathbb{E}[X]/a = 5/4 = 1.25$, and a
      candidate who writes that number down has quoted a probability bound
      above $1$ — true, but weaker than the trivial statement every probability
      already satisfies. The honest answer is therefore $1$, and $1$ cannot be
      improved: the constant variable $X \equiv 5$ is nonnegative, has mean $5$
      and satisfies $\Pr(X \ge 4) = 1$ exactly, so no mean-only bound below $1$
      can be correct. The general rule this instance illustrates is that Markov
      is vacuous whenever the threshold sits at or below the mean, since
      $a \le \mu$ forces $\mu/a \ge 1$. Checking $a > \mathbb{E}[X]$ before
      quoting the formula is the whole of the discipline here.
    expects: "1"
    rubric:
      - >
        Notices that $5/4$ exceeds $1$ and reports the sharpest true bound
        rather than the formula's output.
      - >
        Exhibits a law attaining $1$, so the answer is the best possible and not
        merely a safe fallback.
    targets:
      - quant-probability.inequalities.markov-tightness
    exercises:
      - quant-probability.inequalities.markov

  - id: qineq-markov-tightness-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is uniform on $[0, 10]$. By what factor does Markov's bound on
      $\Pr(X \ge 8)$ exceed the true probability?
    answer: >
      $3.125$. The mean is $\mathbb{E}[X] = 5$, so Markov gives
      $\Pr(X \ge 8) \le 5/8 = 0.625$, while the truth is the length ratio
      $2/10 = 0.2$. The factor is $0.625/0.2 = 3.125$. The gap is not evidence
      that Markov is wrong or improvable in general — it is evidence about the
      uniform law. The two-point variable putting mass $5/8$ at $8$ and the
      rest at $0$ has mean $8 \cdot (5/8) = 5$ and $\Pr(X \ge 8) = 5/8$
      exactly, so among all nonnegative laws with mean $5$ the bound is
      attained. What the uniform lacks is the spike at the threshold: it
      spreads its mass evenly, which is the shape Markov is worst on, and it is
      much closer to what real data looks like.
    expects: "3.125"
    rubric:
      - >
        Computes both the Markov bound $5/8$ and the exact uniform tail $0.2$
        before taking the ratio.
      - >
        Attributes the gap to the shape of the uniform law, and names the
        two-point law that makes the same bound exact.
    targets:
      - quant-probability.inequalities.markov-tightness
    exercises:
      - quant-probability.inequalities.markov

  # --- Chebyshev's inequality (landmark) --------------------------------------

  - id: qineq-chebyshev-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is the total of two independent rolls of a fair four-sided die with
      faces $1, 2, 3, 4$. Use Chebyshev to bound $\Pr(|X - 5| \ge 3)$, as an
      exact fraction.
    answer: >
      $5/18$. Nothing is handed over, so both moments must be built. One die
      has mean $(1+2+3+4)/4 = 5/2$ and second moment $(1+4+9+16)/4 = 15/2$, so
      its variance is $15/2 - 25/4 = 5/4$. The two rolls are independent, so
      means and variances both add: $\mathbb{E}[X] = 5$ and
      $\operatorname{Var}(X) = 5/2$. Chebyshev at $t = 3$ then gives
      $\Pr(|X - 5| \ge 3) \le (5/2)/3^{2} = 5/18 \approx 0.278$. The exact
      answer is available here and worth computing as a check on how much the
      distribution-free bound gives away: $|X - 5| \ge 3$ means $X = 2$ or
      $X = 8$, each requiring both dice to agree on an extreme, so each has
      probability $1/16$, for a total of $1/8 = 0.125$. The bound is loose by a
      factor of about $2.2$ — the price of using only two moments of a law
      whose shape was fully known.
    expects: "5/18"
    tolerance: 0.0005
    rubric:
      - >
        Derives the single-die variance $5/4$ from $\mathbb{E}[D^{2}] -
        (\mathbb{E}[D])^{2}$ and adds variances across the two independent
        rolls.
      - >
        Squares $t$: the bound is $\sigma^{2}/t^{2} = (5/2)/9$, not
        $\sigma^{2}/t$.
      - >
        Reports $5/18$ as a ceiling and, if the exact value is computed, keeps
        the two numbers distinct.
    targets:
      - quant-probability.inequalities.chebyshev
    exercises:
      - quant-probability.expectation.variance

  - id: qineq-chebyshev-02
    kind: work
    difficulty: standard
    statement: >
      An order's fill time has mean $20$ and standard deviation $3$, with the
      shape of the distribution unknown. Bound $\Pr(|X - 20| \ge 7.5)$.
    answer: >
      $4/25$. The variance is $\sigma^{2} = 9$ and the deviation is $t = 7.5$,
      so $t^{2} = 56.25$ and Chebyshev gives $\Pr(|X - 20| \ge 7.5) \le
      9/56.25 = 0.16 = 4/25$. Two slips are worth naming because both produce
      plausible-looking numbers. Forgetting to square $t$ gives $9/7.5 = 1.2$,
      a bound above $1$ that is a giveaway on sight. Dividing the standard
      deviation rather than the variance gives $3/7.5 = 0.4$, which is neither
      above $1$ nor obviously wrong, and is the more dangerous of the two. The
      correct reading is that $7.5$ is $2.5$ standard deviations, so the
      $k$-sigma form returns $1/2.5^{2} = 0.16$ directly.
    expects: "4/25"
    rubric:
      - >
        Uses $\sigma^{2}/t^{2}$ with the variance on top and the *square* of
        the deviation below.
      - >
        Arrives at $0.16$ rather than $1.2$ (unsquared $t$) or $0.4$
        ($\sigma/t$).
    targets:
      - quant-probability.inequalities.chebyshev

  - id: qineq-chebyshev-03
    kind: justify
    difficulty: standard
    statement: >
      Derive Chebyshev's inequality from Markov's. Say which of Markov's
      hypotheses the squaring step supplies, what the finite-variance
      assumption is doing, and why the resulting bound is two-sided for free.
    answer: >
      Write $\mu = \mathbb{E}[X]$ and $\sigma^{2} = \operatorname{Var}(X)$, and
      fix $t > 0$. Set $Z = (X - \mu)^{2}$. Then $Z \ge 0$ automatically — that
      is what the squaring supplies, and it supplies Markov's structural
      hypothesis for *every* $X$, signed or not, which is why Chebyshev has no
      sign restriction of its own. Next, the events $\{|X - \mu| \ge t\}$ and
      $\{Z \ge t^{2}\}$ are literally the same set of outcomes, because
      squaring is increasing on the nonnegative numbers, so bounding one bounds
      the other. Markov applied to $Z$ at the level $t^{2} > 0$ gives
      $\Pr(|X - \mu| \ge t) = \Pr(Z \ge t^{2}) \le \mathbb{E}[Z]/t^{2}$, and
      $\mathbb{E}[Z] = \sigma^{2}$ by the definition of variance, so the bound
      is $\sigma^{2}/t^{2}$. Finiteness of the variance is Markov's other
      hypothesis in disguise — Markov needs $Z$ to have a finite mean — and it
      is the *only* thing assumed about the distribution: no shape, no
      symmetry, no independence, no bounded range. The bound is two-sided for
      free because $Z$ discarded the sign of the deviation before Markov ever
      saw it; there is no separate argument for the lower tail because there
      was never a separate quantity.
    rubric:
      - >
        Applies Markov to $(X - \mu)^{2}$ at level $t^{2}$, not to $|X - \mu|$
        at level $t$.
      - >
        Names the squaring as the source of nonnegativity and the finite
        variance as the finite mean Markov requires.
      - >
        Explains the two-sidedness as a consequence of the square, rather than
        asserting it.
    targets:
      - quant-probability.inequalities.chebyshev
    exercises:
      - quant-probability.inequalities.markov
      - quant-probability.expectation.variance

  # --- k-sigma bounds ---------------------------------------------------------

  - id: qineq-k-sigma-01
    kind: work
    difficulty: demanding
    statement: >
      A risk memo must quote a distribution-free ceiling on
      $\Pr(|X - \mu| \ge 2.5\sigma)$ and, beside it, the exact two-sided normal
      tail at the same threshold, which is $0.0124$. By what factor does the
      distribution-free ceiling exceed the normal number? Give one decimal
      place.
    answer: >
      $12.9$. Setting $t = k\sigma$ in Chebyshev cancels the scale and leaves
      $1/k^{2}$, so at $k = 2.5$ the ceiling is $1/6.25 = 0.16$ — a guarantee
      that holds for every law with finite variance, whatever its shape. The
      normal at the same threshold puts $0.0124$ in the two tails combined. The
      ratio is $0.16/0.0124 \approx 12.9$. The memo should present these as
      answers to two different questions, not as competing estimates of one:
      $0.16$ is what can be promised knowing only a variance, and $0.0124$ is
      what is true if the normal shape is granted. The gap is what the shape
      assumption is worth, and it widens fast — at $k = 5$ the ceiling is
      $0.04$ against a normal tail near $6 \times 10^{-7}$, a factor of about
      seventy thousand. Reporting $0.16$ as "the chance of a $2.5\sigma$ move"
      confuses a ceiling with an estimate.
    expects: "12.9"
    tolerance: 0.05
    rubric:
      - >
        Computes $1/k^{2}$ at $k = 2.5$ as $0.16$, not $1/2.5 = 0.4$.
      - >
        Divides the distribution-free ceiling by the normal tail, and says
        which number answers which question.
      - >
        Notes that the ratio grows with $k$, so the comparison at one threshold
        does not calibrate the bound generally.
    targets:
      - quant-probability.inequalities.k-sigma
    exercises:
      - quant-probability.inequalities.chebyshev

  - id: qineq-k-sigma-02
    kind: work
    difficulty: standard
    statement: >
      What is the smallest integer $k$ for which the $k$-sigma bound guarantees
      that at least $96\%$ of any distribution's mass lies within $k$ standard
      deviations of the mean?
    answer: >
      $5$. The complementary reading of the $k$-sigma bound says at least
      $1 - 1/k^{2}$ of the mass sits within $k$ standard deviations, so the
      requirement is $1 - 1/k^{2} \ge 0.96$, that is $1/k^{2} \le 0.04$, that
      is $k^{2} \ge 25$ and $k \ge 5$. Checking the neighbours confirms it:
      $k = 4$ guarantees only $1 - 1/16 = 0.9375$, short of the target, while
      $k = 5$ guarantees $1 - 1/25 = 0.96$ exactly. Note how expensive
      distribution-free confidence is in these units — a normal law already has
      $96\%$ of its mass within about $2.06$ standard deviations, so assuming
      nothing about shape costs a factor of nearly $2.5$ in width.
    expects: "5"
    rubric:
      - >
        Uses the complementary form $1 - 1/k^{2}$ rather than bounding the tail
        by $0.96$.
      - >
        Solves $1/k^{2} \le 0.04$ correctly and confirms $k = 4$ fails.
    targets:
      - quant-probability.inequalities.k-sigma
    exercises:
      - quant-probability.inequalities.chebyshev

  # --- one-sided Chebyshev (Cantelli) -----------------------------------------

  - id: qineq-cantelli-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ has mean $10$ and variance $25$; its shape is unknown and there is no
      reason to believe it symmetric. Bound $\Pr(X \ge 22)$ as sharply as two
      moments allow, as an exact fraction.
    answer: >
      $25/169$. The question is one-sided, so the tool is Cantelli, with
      $t = 22 - 10 = 12$: $\Pr(X - \mu \ge t) \le \sigma^{2}/(\sigma^{2} +
      t^{2}) = 25/(25 + 144) = 25/169 \approx 0.148$. Compare the two
      alternatives a candidate might reach for. Chebyshev at the same $t$ gives
      $25/144 \approx 0.174$, correct but weaker, because it is paying for a
      lower tail nobody asked about. Halving Chebyshev gives
      $25/288 \approx 0.087$, which is *not* a valid bound: halving assumes the
      two tails carry the deviation equally, and a right-skewed law can load
      the whole of its deviation above the mean, in which case the one-sided
      probability is essentially all of what Chebyshev was bounding. Reporting
      $0.087$ would understate the risk, which is the wrong direction for a
      conservative bound to fail in.
    expects: "25/169"
    tolerance: 0.0005
    rubric:
      - >
        Uses $\sigma^{2}/(\sigma^{2} + t^{2})$ with $t$ measured from the mean,
        so $t = 12$ and not $t = 22$.
      - >
        States that halving Chebyshev is invalid without symmetry, and that the
        error runs in the unsafe direction.
    targets:
      - quant-probability.inequalities.cantelli
    exercises:
      - quant-probability.inequalities.chebyshev

  - id: qineq-cantelli-02
    kind: work
    difficulty: standard
    statement: >
      $X$ has mean $0$ and variance $16$. At what one-sided deviation $t$ does
      Cantelli's bound first fall to $1/5$?
    answer: >
      $8$. Solve $\sigma^{2}/(\sigma^{2} + t^{2}) = 1/5$ with $\sigma^{2} = 16$:
      cross-multiplying gives $80 = 16 + t^{2}$, so $t^{2} = 64$ and $t = 8$.
      Since $\sigma = 4$, that is $k = t/\sigma = 2$ standard deviations, and
      the $k$-form of Cantelli confirms it directly: $1/(1 + k^{2}) =
      1/(1 + 4) = 1/5$. The bound is decreasing in $t$, so $1/5$ is first
      reached at $t = 8$ and is beaten for every larger deviation. Chebyshev at
      the same $t$ returns $16/64 = 1/4$, the two-sided ceiling — larger than
      $1/5$, as it must be, and not twice it.
    expects: "8"
    rubric:
      - >
        Inverts $\sigma^{2}/(\sigma^{2} + t^{2}) = 1/5$ rather than the
        Chebyshev form $\sigma^{2}/t^{2}$.
      - >
        Cross-checks against $1/(1 + k^{2})$ at $k = t/\sigma = 2$.
    targets:
      - quant-probability.inequalities.cantelli
    exercises:
      - quant-probability.inequalities.chebyshev

  # --- sample size from Chebyshev ---------------------------------------------

  - id: qineq-chebyshev-sample-size-01
    kind: work
    difficulty: demanding
    statement: >
      A desk estimates an unknown mean by averaging independent draws whose
      variance is at most $2.25$. Assuming nothing about the shape of the
      draws, how many are needed to guarantee the sample mean lands within
      $0.05$ of the truth at least $98\%$ of the time?
    answer: >
      $45\,000$. The sample mean of $n$ independent draws has variance
      $\sigma^{2}/n$, so Chebyshev gives $\Pr(|\bar{X} - \mu| \ge \varepsilon)
      \le \sigma^{2}/(n\varepsilon^{2})$. Requiring that to be at most the
      failure rate $\alpha = 1 - 0.98 = 0.02$ rearranges to
      $n \ge \sigma^{2}/(\alpha\varepsilon^{2}) = 2.25/(0.02 \times 0.0025) =
      2.25/0.00005 = 45\,000$. The trap is plugging in the confidence $0.98$
      where the failure rate belongs: that returns
      $2.25/(0.98 \times 0.0025) \approx 918$, too few by a factor of $49$, and
      the error is invisible in the arithmetic because both numbers lie in
      $(0,1)$. Worth stating alongside the answer: this is a distribution-free
      count, and a normal approximation would ask for roughly
      $(2.33)^{2}(2.25)/(0.05)^{2} \approx 4\,886$ draws, about a ninth as
      many.
    expects: "45000"
    rubric:
      - >
        Uses the variance of the *mean*, $\sigma^{2}/n$, rather than
        $\sigma^{2}$, before inverting.
      - >
        Puts the failure rate $\alpha = 0.02$ in the denominator, not the
        confidence $0.98$.
      - >
        Presents the count as a conservative distribution-free requirement, not
        as the number of draws actually needed.
    targets:
      - quant-probability.inequalities.chebyshev-sample-size
    exercises:
      - quant-probability.inequalities.chebyshev

  - id: qineq-chebyshev-sample-size-02
    kind: work
    difficulty: standard
    statement: >
      The same desk keeps the failure rate at $0.02$ and the variance bound at
      $2.25$, but relaxes the tolerance from $0.05$ to $0.15$. By what factor
      does the required sample size fall?
    answer: >
      $9$. The requirement $n \ge \sigma^{2}/(\alpha\varepsilon^{2})$ is
      proportional to $1/\varepsilon^{2}$ with everything else fixed, so
      tripling the tolerance divides the count by $3^{2} = 9$. The explicit
      numbers agree: $2.25/(0.02 \times 0.15^{2}) = 2.25/0.00045 = 5\,000$, and
      $45\,000/5\,000 = 9$. The quadratic dependence is the fact to carry away,
      and it bites in the expensive direction too — each extra decimal digit of
      precision costs a hundredfold in data, which is why distribution-free
      precision is bought sparingly.
    expects: "9"
    rubric:
      - >
        Reads the factor off the $1/\varepsilon^{2}$ dependence rather than
        recomputing from scratch — or recomputes and gets $5\,000$.
      - >
        Answers $9$, not $3$ (linear in $\varepsilon$) or $1/9$ (wrong
        direction).
    targets:
      - quant-probability.inequalities.chebyshev-sample-size
    exercises:
      - quant-probability.inequalities.chebyshev

  # --- Jensen's inequality (landmark) -----------------------------------------

  - id: qineq-jensen-01
    kind: work
    difficulty: demanding
    statement: >
      Let $\varphi(x) = x^{3}$ and let $X$ take the values $-3$ and $1$ with
      equal probability. Compute $\mathbb{E}[\varphi(X)] -
      \varphi(\mathbb{E}[X])$, and say what the sign of the answer shows.
    answer: >
      $-12$. The mean is $\mathbb{E}[X] = (-3 + 1)/2 = -1$, so
      $\varphi(\mathbb{E}[X]) = (-1)^{3} = -1$, while
      $\mathbb{E}[\varphi(X)] = ((-27) + 1)/2 = -13$. The difference is
      $-13 - (-1) = -12$, strictly negative — the opposite of the direction
      Jensen states for a convex $\varphi$. This is not a counterexample to
      Jensen: it is a demonstration that the convexity hypothesis is about the
      whole range of $X$, not about the function's name. The map $x \mapsto
      x^{3}$ is convex only on $x \ge 0$ and concave on $x \le 0$, and the
      range $\{-3, 1\}$ straddles the inflection at $0$, so no single
      supporting line lies below the graph everywhere $X$ can land and the
      proof's pointwise step fails. Restrict to a range on one side of $0$ and
      the direction returns: for $X$ equal to $1$ or $3$ with equal
      probability, $\mathbb{E}[X^{3}] = 14$ against
      $\varphi(\mathbb{E}[X]) = 8$, a gap of $+6$.
    expects: "-12"
    rubric:
      - >
        Computes both sides separately — $-13$ and $-1$ — rather than assuming
        an inequality and reporting its direction.
      - >
        Attributes the negative gap to $x^{3}$ failing to be convex across the
        range of $X$, not to Jensen being violated.
    targets:
      - quant-probability.inequalities.jensen
    exercises:
      - quant-tools.optimization.convexity

  - id: qineq-jensen-02
    kind: work
    difficulty: standard
    statement: >
      $X$ takes the values $1$, $5$ and $9$ with equal probability and
      $\varphi(x) = x^{2}$. Compute the Jensen gap
      $\mathbb{E}[\varphi(X)] - \varphi(\mathbb{E}[X])$ as an exact fraction.
    answer: >
      $32/3$. The mean is $(1 + 5 + 9)/3 = 5$, so $\varphi(\mathbb{E}[X]) =
      25$, and $\mathbb{E}[X^{2}] = (1 + 25 + 81)/3 = 107/3$. The gap is
      $107/3 - 25 = (107 - 75)/3 = 32/3 \approx 10.67$, positive as Jensen
      requires for the convex square. It is worth recognising what this number
      is: $\mathbb{E}[X^{2}] - (\mathbb{E}[X])^{2}$ is the variance, so for
      $\varphi(x) = x^{2}$ the Jensen gap is not merely positive but exactly
      $\operatorname{Var}(X)$ — the statement $\mathbb{E}[X^{2}] \ge
      (\mathbb{E}[X])^{2}$ and the statement $\operatorname{Var}(X) \ge 0$ are
      the same statement. It vanishes only for a constant $X$, which is Jensen's
      equality case for a strictly convex $\varphi$.
    expects: "32/3"
    tolerance: 0.0005
    rubric:
      - >
        Applies $\varphi$ before averaging on one side and after averaging on
        the other, keeping the two orders distinct.
      - >
        Identifies the gap as $\operatorname{Var}(X)$ rather than treating it as
        an unrelated number.
    targets:
      - quant-probability.inequalities.jensen

  - id: qineq-jensen-03
    kind: justify
    difficulty: standard
    statement: >
      Prove $\mathbb{E}[\varphi(X)] \ge \varphi(\mathbb{E}[X])$ for convex
      $\varphi$ using the supporting line at $\mu = \mathbb{E}[X]$. Say which
      step reverses for a concave $\varphi$, and which step fails when
      $\varphi$ is convex on only part of the range of $X$.
    answer: >
      A convex $\varphi$ admits a supporting line at every interior point of
      its domain: there is a slope $c$ with $\varphi(x) \ge \varphi(\mu) +
      c\,(x - \mu)$ for every $x$ in the domain, where $c$ is any subgradient
      at $\mu$ and equals $\varphi'(\mu)$ wherever $\varphi$ is
      differentiable. Because that inequality holds for every $x$, it holds at
      $x = X$ outcome by outcome, giving the pointwise bound $\varphi(X) \ge
      \varphi(\mu) + c\,(X - \mu)$. Take expectations of both sides. The right
      side is $\varphi(\mu) + c\,(\mathbb{E}[X] - \mu) = \varphi(\mu)$, since
      the linear term has mean zero by construction — and this is precisely
      where $\mathbb{E}[X]$ being finite is needed, both to define $\mu$ and to
      kill that term. So $\mathbb{E}[\varphi(X)] \ge \varphi(\mathbb{E}[X])$.
      For a concave $\varphi$ the same line at $\mu$ lies *above* the graph
      rather than below, so the pointwise inequality reverses and the
      conclusion reverses with it. If $\varphi$ is convex on only part of the
      range of $X$, the first step is what breaks: no single line supports the
      graph everywhere $X$ can land, so there is nothing pointwise to take
      expectations of, and the conclusion can genuinely go the other way.
    rubric:
      - >
        Builds the supporting line at $\mu = \mathbb{E}[X]$ specifically, not
        at an arbitrary point, so the linear term has mean zero.
      - >
        Points at the vanishing linear term as the place finiteness of
        $\mathbb{E}[X]$ is used.
      - >
        Locates the failure for partially convex $\varphi$ in the pointwise
        step, not in the expectation step.
    targets:
      - quant-probability.inequalities.jensen
    exercises:
      - quant-tools.optimization.convexity

  # --- the standard Jensen substitutions --------------------------------------

  - id: qineq-jensen-second-moment-01
    kind: work
    difficulty: demanding
    statement: >
      A fund's annual growth factor $G$ is $1.4$ or $0.8$ with equal
      probability, independently each year, so its arithmetic mean growth
      factor is $1.1$. Compute $\mathbb{E}[\ln G]$ to four decimal places.
    answer: >
      $0.0567$. Directly, $\ln 1.4 \approx 0.336472$ and
      $\ln 0.8 \approx -0.223144$, so $\mathbb{E}[\ln G] =
      (0.336472 - 0.223144)/2 \approx 0.056664$, that is $0.0567$. Set this
      against $\ln \mathbb{E}[G] = \ln 1.1 \approx 0.095310$. The average of
      the logs falls short of the log of the average by about $0.0386$, exactly
      as Jensen requires for the concave $\ln$, and the shortfall is what
      volatility drag names. The consequence is not cosmetic: compounding
      grows at $e^{\mathbb{E}[\ln G]} \approx e^{0.056664} \approx 1.0583$ a
      year, so the fund compounds at about $5.8\%$ while advertising an
      arithmetic mean return of $10\%$. The slip to avoid is asserting the
      convex direction, $\mathbb{E}[\ln G] \ge \ln \mathbb{E}[G]$ — it would
      predict long-run compounding *above* the arithmetic mean, which no
      sequence of returns can deliver.
    expects: "0.0567"
    tolerance: 0.00005
    rubric:
      - >
        Averages the two logs rather than taking the log of the average.
      - >
        Uses the concave direction for $\ln$, so the answer lands below
        $\ln 1.1 \approx 0.0953$.
      - >
        Connects the gap to compounded growth, not merely to an inequality
        symbol.
    targets:
      - quant-probability.inequalities.jensen-second-moment
    exercises:
      - quant-probability.inequalities.jensen

  - id: qineq-jensen-second-moment-02
    kind: decide
    difficulty: standard
    statement: >
      A desk records the bid–ask spread $S > 0$ over many days, with genuine
      day-to-day variation, and reports the reciprocal of the average spread as
      its estimate of the average reciprocal spread. Which way does that
      estimate err?
    answer: >
      It understates. The map $x \mapsto 1/x$ is convex on $x > 0$, so Jensen
      gives $\mathbb{E}[1/S] \ge 1/\mathbb{E}[S]$, and the reported number is
      the smaller side. A two-day instance makes the size of the error
      concrete: if $S$ is $1$ or $4$ with equal probability, then
      $\mathbb{E}[S] = 2.5$ and $1/\mathbb{E}[S] = 0.4$, while
      $\mathbb{E}[1/S] = (1 + 0.25)/2 = 0.625$ — the report is low by more than
      a third. The mechanism is that the small values of $S$ contribute very
      large reciprocals, and convexity is exactly the statement that those
      contributions dominate. Equality would force $S$ to be constant, so
      genuine variation makes the inequality strict.
    choices:
      - text: >
          It understates: $1/\mathbb{E}[S] \le \mathbb{E}[1/S]$, since $1/x$ is
          convex on $x > 0$
        correct: true
        feedback: >
          Convexity of $1/x$ fixes the direction, and the gap grows with the
          spread's variability.
      - text: >
          It overstates: averaging reciprocals must give something smaller,
          since larger denominators shrink the terms
        feedback: >
          This reverses the direction. Large values of $S$ do shrink their
          terms, but small values of $S$ blow theirs up far more, and convexity
          is the statement that the blow-up wins.
      - text: >
          It is exact, because expectation is linear
        feedback: >
          Linearity moves sums and constants through an expectation, not a
          nonlinear function. Equality here would force $S$ to be constant,
          which the stated day-to-day variation rules out.
    rubric:
      - >
        Names the convexity of $1/x$ on the positive axis and reads the
        direction off it.
      - >
        States that the inequality is strict because $S$ genuinely varies.
    targets:
      - quant-probability.inequalities.jensen-second-moment
    exercises:
      - quant-probability.inequalities.jensen

  # --- AM–GM as a case of Jensen ----------------------------------------------

  - id: qineq-jensen-am-gm-01
    kind: work
    difficulty: demanding
    statement: >
      For $x > 0$, find the minimum value of $f(x) = x^{2} + 16/x$.
    answer: >
      $12$. Applying AM–GM to the two terms as written gives
      $f(x) \ge 2\sqrt{x^{2} \cdot 16/x} = 8\sqrt{x}$, which still depends on
      $x$ and bounds nothing — the equality condition $x^{2} = 16/x$ has to be
      reachable *and* the geometric mean has to be constant. Splitting fixes
      both: write $f(x) = x^{2} + 8/x + 8/x$ as three positive terms carrying
      equal weights $1/3$. Then the weighted AM–GM gives
      $\tfrac{1}{3}f(x) \ge \left(x^{2} \cdot \tfrac{8}{x} \cdot
      \tfrac{8}{x}\right)^{1/3} = 64^{1/3} = 4$, so $f(x) \ge 12$ for every
      $x > 0$, with the $x$ cancelling out of the product exactly because the
      split made the exponents balance. Equality in AM–GM needs all three terms
      equal: $x^{2} = 8/x$, so $x^{3} = 8$ and $x = 2$, where
      $f(2) = 4 + 8 = 12$. The bound is attained, so $12$ is the minimum and
      not merely a floor.
    expects: "12"
    rubric:
      - >
        Splits $16/x$ into two equal pieces so the geometric mean is free of
        $x$, rather than applying AM–GM to the two terms as given.
      - >
        Checks the equality condition and exhibits $x = 2$, so the bound is
        shown to be attained.
    targets:
      - quant-probability.inequalities.jensen-am-gm
      - quant-tools.series-calculus.am-gm
    exercises:
      - quant-probability.inequalities.jensen
    connects:
      - "quant-probability.inequalities.jensen-am-gm ~ quant-tools.series-calculus.am-gm"

  - id: qineq-jensen-am-gm-02
    kind: work
    difficulty: standard
    statement: >
      The positive numbers $2$, $3$ and $12$ carry weights $1/2$, $1/3$ and
      $1/6$. Compute their weighted geometric mean $\prod_i x_i^{w_i}$ to three
      decimal places.
    answer: >
      $3.086$. Take logs, which is where the Jensen argument lives: the
      weighted log-average is $\tfrac{1}{2}\ln 2 + \tfrac{1}{3}\ln 3 +
      \tfrac{1}{6}\ln 12 \approx 0.346574 + 0.366204 + 0.414151 = 1.126929$,
      and exponentiating gives $e^{1.126929} \approx 3.086$. The weighted
      arithmetic mean is $\tfrac{1}{2}(2) + \tfrac{1}{3}(3) + \tfrac{1}{6}(12)
      = 1 + 1 + 2 = 4$. So $3.086 \le 4$, which is weighted AM–GM: the weights
      are nonnegative and sum to $1$, so they define a genuine law on the three
      numbers, and concavity of $\ln$ gives $\mathbb{E}[\ln X] \le
      \ln \mathbb{E}[X]$. The inequality is strict because the three numbers are
      not all equal and $\ln$ is strictly concave. Note that the unweighted
      geometric mean $(2 \cdot 3 \cdot 12)^{1/3} \approx 4.16$ answers a
      different question and is not comparable to $4$ at all.
    expects: "3.086"
    tolerance: 0.0005
    rubric:
      - >
        Raises each number to its own weight rather than taking a plain cube
        root.
      - >
        Confirms the weights are nonnegative and sum to $1$, which is what makes
        the randomisation legitimate.
    targets:
      - quant-probability.inequalities.jensen-am-gm
    exercises:
      - quant-probability.inequalities.jensen

  # --- the union bound --------------------------------------------------------

  - id: qineq-union-bound-01
    kind: work
    difficulty: demanding
    statement: >
      Each of $n$ subsystems fails on a given day with probability at most
      $0.003$, and nothing is known about how the failures depend on one
      another. What is the largest $n$ for which the union bound still
      guarantees at least a $97\%$ chance that no subsystem fails?
    answer: >
      $10$. Work with the complementary reading, which is the one that
      guarantees something: $\Pr\left(\bigcap_i A_i^{c}\right) \ge 1 -
      \sum_i \Pr(A_i) \ge 1 - 0.003n$. Requiring $1 - 0.003n \ge 0.97$ gives
      $0.003n \le 0.03$, so $n \le 10$. At $n = 10$ the guarantee is exactly
      $0.97$; at $n = 11$ it falls to $1 - 0.033 = 0.967$ and the target is
      missed. No independence was used anywhere, which is the whole point — the
      answer holds even if every subsystem shares one power supply. And at this
      failure rate the caution is nearly free: were the failures independent,
      the survival probability at $n = 10$ would be
      $0.997^{10} \approx 0.9704$ against the union bound's $0.97$, and the
      independent answer to the same question would still be $n = 10$, since
      $0.997^{11} \approx 0.9675$ misses the target too.
    expects: "10"
    rubric:
      - >
        Uses the complementary form $1 - \sum_i \Pr(A_i)$ rather than bounding
        the survival probability directly.
      - >
        Solves the inequality for an integer $n$ and checks that $n = 11$ fails.
      - >
        Says explicitly that no independence assumption entered.
    targets:
      - quant-probability.inequalities.union-bound
    exercises:
      - quant-probability.foundations.union-two

  - id: qineq-union-bound-02
    kind: work
    difficulty: standard
    statement: >
      A pricing pipeline runs six validation checks, failing with
      probabilities $0.006$, $0.013$, $0.004$, $0.009$, $0.021$ and $0.011$,
      with unknown dependence between them. What is the guaranteed floor on the
      probability that all six pass?
    answer: >
      $0.936$. The failure probabilities sum to
      $0.006 + 0.013 + 0.004 + 0.009 + 0.021 + 0.011 = 0.064$, so the union
      bound gives $\Pr(\text{some check fails}) \le 0.064$ and hence
      $\Pr(\text{all pass}) \ge 1 - 0.064 = 0.936$. The bound is trustworthy
      here because the sum sits far below $1$: if the checks happened to be
      independent, the true survival probability would be
      $\prod_i (1 - p_i) \approx 0.9376$, so the union bound gives away about
      $0.0016$. That is the regime to remember — while the failure
      probabilities are small and few, summing them costs almost nothing, and
      it costs nothing in *knowledge* either, since the $0.936$ holds whatever
      the dependence turns out to be.
    expects: "0.936"
    rubric:
      - >
        Sums the failure probabilities and subtracts from $1$, rather than
        multiplying survival probabilities.
      - >
        Notes that the floor requires no independence, and that the sum being
        well under $1$ is what keeps it useful.
    targets:
      - quant-probability.inequalities.union-bound
    exercises:
      - quant-probability.foundations.union-two

  # --- bounding a collision probability ---------------------------------------

  - id: qineq-collision-bound-01
    kind: work
    difficulty: demanding
    statement: >
      Identifiers are drawn independently and uniformly from
      $m = 1\,048\,576$ possible values. What is the largest number of
      identifiers $n$ for which the pairwise union bound still certifies a
      collision probability of at most $0.001$?
    answer: >
      $46$. One event per pair gives $\Pr(\text{some collision}) \le
      \binom{n}{2}/m = n(n-1)/(2m)$, so the requirement is
      $n(n-1)/2 \le 0.001 \times 1\,048\,576 = 1048.576$, that is
      $n(n-1) \le 2097.152$. Since $n(n-1)$ is close to $n^{2}$, the crossing
      is near $\sqrt{2097} \approx 45.8$, and checking the two candidates
      settles it: $46 \times 45 = 2070$, giving a bound of
      $1035/1\,048\,576 \approx 0.00099$, inside the target, while
      $47 \times 46 = 2162$ gives $1081/1\,048\,576 \approx 0.00103$, outside
      it. So $n = 46$. The quadratic growth is the lesson — quadrupling the
      label space only doubles the safe count, which is why collision
      thresholds scale like $\sqrt{m}$.
    expects: "46"
    rubric:
      - >
        Bounds by $\binom{n}{2}/m$, one event per pair, rather than by $n/m$.
      - >
        Solves the quadratic and checks both $n = 46$ and $n = 47$ against the
        target rather than rounding a square root.
    targets:
      - quant-probability.inequalities.collision-bound
    exercises:
      - quant-probability.inequalities.union-bound

  - id: qineq-collision-bound-02
    kind: work
    difficulty: standard
    statement: >
      Twelve analysts are each issued an independent uniformly random
      four-digit PIN, drawn from the $10\,000$ possibilities. Bound the
      probability that two of them share a PIN, as an exact fraction.
    answer: >
      $33/5000$. There are $\binom{12}{2} = 66$ pairs, each of which collides
      with probability exactly $1/10\,000$, since the second analyst's PIN is
      uniform over the $10\,000$ values whatever the first's was. Summing over
      the pairs, $\Pr(\text{some shared PIN}) \le 66/10\,000 = 33/5000 =
      0.0066$. The bound is well under $1$, which is exactly the regime where
      it is close to exact: the true probability, $1 - \prod_{j=0}^{11}
      (1 - j/10\,000)$, is about $0.00658$, so the union bound overstates by
      under half a percent of itself. The over-counting it ignores is a double
      collision, a second-order event out here.
    expects: "33/5000"
    rubric:
      - >
        Counts $\binom{12}{2} = 66$ pairs, not $12$ analysts.
      - >
        Presents $0.0066$ as an upper bound and says why it is nearly exact in
        this regime.
    targets:
      - quant-probability.inequalities.collision-bound
    exercises:
      - quant-probability.inequalities.union-bound

  # --- Chernoff bound: exponential Markov -------------------------------------

  - id: qineq-chernoff-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is Poisson with mean $4$, so $M_X(t) = \exp(4(e^{t} - 1))$. Carry the
      Chernoff recipe through to the optimized bound on $\Pr(X \ge 10)$, and
      report it to four decimal places.
    answer: >
      $0.0423$. Exponentiate, apply Markov, optimize. For every $t > 0$,
      $\Pr(X \ge 10) \le e^{-10t}M_X(t) = \exp\left(4(e^{t} - 1) - 10t\right)$.
      Minimizing the exponent $g(t) = 4(e^{t} - 1) - 10t$ needs
      $g'(t) = 4e^{t} - 10 = 0$, so $e^{t} = 10/4 = 2.5$ and
      $t = \ln 2.5 \approx 0.9163$; the second derivative $4e^{t}$ is positive,
      so this is the minimum. Substituting, $g = 4(2.5 - 1) - 10\ln 2.5 =
      6 - 9.1629 = -3.1629$, and the bound is
      $e^{-3.1629} \approx 0.0423$. Two comparisons make the case for doing the
      optimization at all. Markov alone gives $4/10 = 0.4$, nearly ten times
      weaker; and a lazily chosen $t = 1$ gives
      $\exp(4(e - 1) - 10) \approx 0.0439$, valid but needlessly loose. The
      exact Poisson tail is about $0.0081$, so even the optimized exponential
      bound remains a ceiling, not an estimate.
    expects: "0.0423"
    tolerance: 0.0005
    rubric:
      - >
        Writes the bound as $e^{-ta}M_X(t)$ valid for *every* $t > 0$, then
        minimizes over $t$ rather than picking one.
      - >
        Solves $4e^{t} = 10$ for the optimal $t = \ln 2.5$ and substitutes back
        into the exponent.
      - >
        Compares against Markov's $0.4$ to show what exponentiating bought.
    targets:
      - quant-probability.inequalities.chernoff
    exercises:
      - quant-probability.inequalities.markov
      - quant-probability.mgf.mgf

  - id: qineq-chernoff-02
    kind: decide
    difficulty: standard
    statement: >
      A candidate bounds $\Pr(S \ge 30)$ for a sum $S$ of independent variables
      by writing $\Pr(S \ge 30) \le e^{-30t}M_S(t)$, and then chooses the
      $t > 0$ that makes $M_S(t)$ as small as possible. What is wrong with that
      last step?
    answer: >
      The product, not either factor, is what must be minimized. The bound
      $e^{-30t}M_S(t)$ is a product of two factors that move in opposite
      directions as $t$ grows: $e^{-30t}$ falls, and $M_S(t) =
      \mathbb{E}[e^{tS}]$ rises. Minimizing $M_S(t)$ alone over $t > 0$ pushes
      $t$ toward $0$, where $M_S(t) \to M_S(0) = 1$ and $e^{-30t} \to 1$, so
      the bound degenerates to $\Pr(S \ge 30) \le 1$ — true and empty. The
      whole value of the method sits in the trade-off: the correct step is to
      minimize $h(t) = e^{-30t}M_S(t)$, equivalently to minimize
      $\ln M_S(t) - 30t$, which for a sum of independent pieces is a sum of
      per-piece terms and so is usually a one-line derivative. The hypothesis
      that does need separate checking is that $M_S(t)$ is finite at the
      chosen $t$; nonnegativity of $S$ does not, because $e^{tS} > 0$ whatever
      the sign of $S$.
    choices:
      - text: >
          Nothing is wrong — the smallest moment generating function gives the
          smallest bound
        feedback: >
          The two factors move opposite ways. Driving $M_S(t)$ down means
          pushing $t$ toward $0$, where $e^{-30t}$ climbs to $1$ and the bound
          reads $\Pr(S \ge 30) \le 1$.
      - text: >
          The whole product $e^{-30t}M_S(t)$ must be minimized over $t > 0$,
          not either factor on its own
        correct: true
        feedback: >
          Exponentiate, apply Markov, then optimize the product — the third step
          is where the exponential decay is actually bought.
      - text: >
          Chernoff requires $S \ge 0$, and that was never checked
        feedback: >
          Exponentiating is precisely what removes Markov's nonnegativity
          requirement: $e^{tS} > 0$ whatever the sign of $S$. What must be
          checked instead is that $M_S(t)$ is finite at the $t$ used.
    rubric:
      - >
        Identifies the two factors as moving in opposite directions in $t$.
      - >
        States what the degenerate choice $t \to 0$ actually yields, rather than
        only saying the bound is "weaker".
    targets:
      - quant-probability.inequalities.chernoff
    exercises:
      - quant-probability.mgf.mgf

  - id: qineq-chernoff-03
    kind: work
    difficulty: standard
    statement: >
      $S$ is the number of heads in $20$ independent fair tosses, so
      $M_S(t) = ((1 + e^{t})/2)^{20}$ — the twentieth power of a single toss's
      moment generating function. Optimize the Chernoff bound on
      $\Pr(S \ge 15)$ and report it to four decimal places.
    answer: >
      $0.0731$. The bound is $e^{-15t}((1 + e^{t})/2)^{20}$ for every $t > 0$.
      Write $u = e^{t} > 1$ and minimize the logarithm,
      $-15\ln u + 20\ln(1 + u) - 20\ln 2$; the derivative $-15/u + 20/(1 + u)$
      vanishes when $15(1 + u) = 20u$, that is $u = 3$, so $t = \ln 3$. The
      bound is then $3^{-15} \cdot 2^{20} = 1\,048\,576/14\,348\,907 \approx
      0.0731$. The factorisation is what makes this cheap: because the tosses
      are independent, the moment generating function of the sum is the product
      of twenty identical one-toss factors, so the optimized exponent is
      linear in the number of tosses and the bound decays exponentially in it.
      The exact tail, $\sum_{k=15}^{20}\binom{20}{k}/2^{20} =
      21\,700/1\,048\,576 \approx 0.0207$, confirms the bound is a ceiling with
      a factor of about $3.5$ to spare.
    expects: "0.0731"
    tolerance: 0.0005
    rubric:
      - >
        Uses the product form of the sum's moment generating function rather
        than trying to compute the binomial tail directly.
      - >
        Solves for $u = e^{t} = 3$ by differentiating the log of the bound, and
        evaluates $2^{20}/3^{15}$.
    targets:
      - quant-probability.inequalities.chernoff
      - quant-probability.mgf.mgf-sums
    exercises:
      - quant-probability.mgf.mgf
    connects:
      - "quant-probability.inequalities.chernoff ~ quant-probability.mgf.mgf-sums"

  # --- Chernoff versus Chebyshev on coin tosses -------------------------------

  - id: qineq-chernoff-binomial-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed $200$ times. Using the $\pm 1$ recentring and the
      bound $e^{-s^{2}/(2n)}$, bound $\Pr(H \ge 120)$ to four decimal places.
    answer: >
      $0.0183$. Write $S = \sum_{i=1}^{200}\varepsilon_i$ with
      $\varepsilon_i = \pm 1$, so $H = (S + 200)/2$ and the event
      $\{H \ge 120\}$ is exactly $\{S \ge 40\}$. Since
      $\mathbb{E}[e^{t\varepsilon}] = \cosh t \le e^{t^{2}/2}$, independence
      gives $\Pr(S \ge s) \le e^{-ts}\,e^{nt^{2}/2}$, whose exponent
      $nt^{2}/2 - ts$ is minimized at $t = s/n$, leaving $e^{-s^{2}/(2n)}$.
      With $s = 40$ and $n = 200$ that is $e^{-1600/400} = e^{-4} \approx
      0.0183$. The recentring is where the arithmetic goes wrong most often: a
      $20$-head deviation from the mean is a $40$-unit deviation in $S$, and
      using $s = 20$ would report $e^{-1} \approx 0.368$. The other standard
      slip is dropping the factor of $2$ in the exponent — writing
      $e^{-s^{2}/n} = e^{-8} \approx 0.00034$ — which comes from mishandling
      the $\cosh t \le e^{t^{2}/2}$ step and claims a bound about $55$ times
      stronger than the one actually proved.
    expects: "0.0183"
    tolerance: 0.0005
    rubric:
      - >
        Converts the head count to the $\pm 1$ sum correctly, so $s = 40$ rather
        than $20$.
      - >
        Uses $e^{-s^{2}/(2n)}$ with the factor of $2$, and says where that
        factor comes from.
    targets:
      - quant-probability.inequalities.chernoff-binomial
    exercises:
      - quant-probability.inequalities.chernoff

  - id: qineq-chernoff-binomial-02
    kind: work
    difficulty: standard
    statement: >
      The same $200$ fair tosses. What does Chebyshev give as a bound on
      $\Pr(H \ge 120)$, as an exact fraction?
    answer: >
      $1/8$. The head count has mean $100$ and variance $200 \times
      \tfrac{1}{4} = 50$, so $\sigma_H = \sqrt{50} \approx 7.07$. The deviation is
      $t = 120 - 100 = 20$, and Chebyshev bounds the two-sided event:
      $\Pr(|H - 100| \ge 20) \le 50/400 = 1/8 = 0.125$. Since
      $\{H \ge 120\}$ sits inside that event, $1/8$ bounds it too. Set this
      beside the Chernoff bound $e^{-4} \approx 0.0183$ at the same threshold:
      Chebyshev is about seven times weaker, and the ratio grows without bound
      as the threshold moves out, because $1/t^{2}$ decays polynomially while
      $e^{-s^{2}/(2n)}$ decays exponentially. Cantelli sharpens the one-sided
      reading to $50/(50 + 400) = 1/9 \approx 0.111$, better than $1/8$ but
      still far behind the exponential bound.
    expects: "1/8"
    rubric:
      - >
        Uses $\operatorname{Var}(H) = np(1-p) = 50$, not $\sigma = 50$ or
        $\operatorname{Var} = 200$.
      - >
        Notes that the two-sided Chebyshev bound covers the one-sided event, and
        compares the number with the Chernoff bound.
    targets:
      - quant-probability.inequalities.chernoff-binomial
    exercises:
      - quant-probability.inequalities.chebyshev

  # --- Cauchy–Schwarz for random variables ------------------------------------

  - id: qineq-cauchy-schwarz-rv-01
    kind: work
    difficulty: demanding
    statement: >
      Three real numbers satisfy $a_1 + a_2 + a_3 = 12$. Let $I$ be uniform on
      $\{1, 2, 3\}$ and put $X = a_I$. Using Cauchy–Schwarz for random
      variables with $Y = 1$, find the smallest possible value of
      $a_1^{2} + a_2^{2} + a_3^{2}$.
    answer: >
      $48$. The randomisation turns the two sums into moments:
      $\mathbb{E}[X] = (a_1 + a_2 + a_3)/3 = 4$ and $\mathbb{E}[X^{2}] =
      (a_1^{2} + a_2^{2} + a_3^{2})/3$. Cauchy–Schwarz with $Y = 1$ reads
      $(\mathbb{E}[XY])^{2} \le \mathbb{E}[X^{2}]\mathbb{E}[Y^{2}]$, that is
      $(\mathbb{E}[X])^{2} \le \mathbb{E}[X^{2}]$, so
      $(a_1^{2} + a_2^{2} + a_3^{2})/3 \ge 16$ and the sum of squares is at
      least $48$. It is attained at $a_1 = a_2 = a_3 = 4$, which is exactly the
      equality case: there $X$ is a constant, hence a scalar multiple of
      $Y = 1$ with probability $1$. Cleared of the probability language this is
      the sum form $(\sum_i a_i)^{2} \le 3\sum_i a_i^{2}$ — the same
      discriminant argument, run on a uniform law over three points instead of
      on a list of three numbers, which is why the two statements are one
      statement.
    expects: "48"
    rubric:
      - >
        Chooses $Y = 1$, so the inequality specialises to
        $(\mathbb{E}[X])^{2} \le \mathbb{E}[X^{2}]$.
      - >
        Converts back from moments to sums with the correct factor of $3$.
      - >
        Exhibits the equal-values case as the equality case of Cauchy–Schwarz,
        so the minimum is attained.
    targets:
      - quant-probability.inequalities.cauchy-schwarz-rv
      - quant-tools.series-calculus.cauchy-schwarz
    connects:
      - "quant-probability.inequalities.cauchy-schwarz-rv ~ quant-tools.series-calculus.cauchy-schwarz"

  - id: qineq-cauchy-schwarz-rv-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is uniform on $\{1, 2, 3, 4\}$ and $Y = X^{2}$. Compute the slack
      $\mathbb{E}[X^{2}]\mathbb{E}[Y^{2}] - (\mathbb{E}[XY])^{2}$ in
      Cauchy–Schwarz.
    answer: >
      $38.75$. Everything is a moment of $X$: $\mathbb{E}[X^{2}] =
      (1 + 4 + 9 + 16)/4 = 7.5$; $\mathbb{E}[Y^{2}] = \mathbb{E}[X^{4}] =
      (1 + 16 + 81 + 256)/4 = 354/4 = 88.5$; and $\mathbb{E}[XY] =
      \mathbb{E}[X^{3}] = (1 + 8 + 27 + 64)/4 = 100/4 = 25$. The inequality
      therefore reads $25^{2} = 625 \le 7.5 \times 88.5 = 663.75$, and the
      slack is $663.75 - 625 = 38.75$. The slack is strictly positive, and
      Cauchy–Schwarz says why: equality needs $X = t_0 Y$ with probability $1$
      for a single constant $t_0$, which here would mean $X = t_0 X^{2}$, that
      is $X$ constant — false for a variable taking four values. The
      inequality is close to tight only because $X^{2}$ is nearly proportional
      to $X$ over this narrow range.
    expects: "38.75"
    rubric:
      - >
        Recognises $\mathbb{E}[Y^{2}]$ as $\mathbb{E}[X^{4}]$ and
        $\mathbb{E}[XY]$ as $\mathbb{E}[X^{3}]$.
      - >
        Explains the positive slack by the failure of exact proportionality,
        not by arithmetic accident.
    targets:
      - quant-probability.inequalities.cauchy-schwarz-rv

  # --- covariance and correlation bounds --------------------------------------

  - id: qineq-cs-covariance-01
    kind: work
    difficulty: demanding
    statement: >
      Two strategies have return standard deviations $\sigma_X = 12$ and
      $\sigma_Y = 5$, with the correlation between them unknown. What is the
      smallest possible standard deviation of the combined book $X + Y$?
    answer: >
      $7$. Expand: $\operatorname{Var}(X + Y) = \sigma_X^{2} + \sigma_Y^{2} +
      2\operatorname{Cov}(X, Y) = 144 + 25 + 2\operatorname{Cov}(X, Y) =
      169 + 2\operatorname{Cov}(X, Y)$. Cauchy–Schwarz on the centred variables
      caps the covariance: $|\operatorname{Cov}(X, Y)| \le \sigma_X\sigma_Y =
      60$. So the variance is confined to $[169 - 120, 169 + 120] = [49, 289]$
      and the standard deviation to $[7, 17]$ — which is
      $[\,|\sigma_X - \sigma_Y|,\; \sigma_X + \sigma_Y\,]$, the triangle
      inequality in both directions. Both ends are attained, at $\rho = -1$ and
      $\rho = +1$, where $Y$ is an exact affine function of $X$. The trap is
      answering $\sqrt{169} = 13$: that is the zero-correlation value, and zero
      correlation was never given — it is a much stronger assumption than the
      "unknown correlation" the question supplies.
    expects: "7"
    rubric:
      - >
        Expands $\operatorname{Var}(X + Y)$ with the covariance term rather than
        assuming the variances simply add.
      - >
        Bounds $|\operatorname{Cov}(X, Y)|$ by $\sigma_X\sigma_Y$ and takes the
        lower end of the resulting variance interval.
      - >
        Distinguishes the answer from the zero-correlation value $13$.
    targets:
      - quant-probability.inequalities.cs-covariance
    exercises:
      - quant-probability.inequalities.cauchy-schwarz-rv
      - quant-probability.joint.correlation

  - id: qineq-cs-covariance-02
    kind: decide
    difficulty: standard
    statement: >
      A risk system reports $\sigma_X = 8$, $\sigma_Y = 15$ and
      $\operatorname{Cov}(X, Y) = -126$ for two books. What should you
      conclude?
    answer: >
      At least one of the three numbers is wrong. Cauchy–Schwarz applied to the
      centred variables gives $|\operatorname{Cov}(X, Y)| \le
      \sigma_X\sigma_Y = 8 \times 15 = 120$, and the report has
      $|-126| = 126 > 120$. Equivalently the implied correlation is
      $\rho = -126/120 = -1.05$, outside $[-1, 1]$, which no joint
      distribution can produce. The sign is irrelevant: the bound is on the
      absolute value, because it comes from squaring, and the squaring is blind
      to sign. This is the cheapest sanity check available on an estimated
      covariance matrix — one multiplication per off-diagonal entry — and it
      catches a real class of errors, typically a covariance computed on one
      sample window against standard deviations computed on another.
    choices:
      - text: >
          The numbers are consistent, and $\rho = -1.05$ indicates unusually
          strong negative dependence
        feedback: >
          No correlation of either sign can lie outside $[-1, 1]$. A reported
          $-1.05$ is the symptom of the error, not a finding about the books.
      - text: >
          At least one of the three numbers is wrong, since Cauchy–Schwarz
          forces $|\operatorname{Cov}(X, Y)| \le \sigma_X\sigma_Y = 120$
        correct: true
        feedback: >
          The bound is arithmetic, not empirical, so a violation is an error in
          the numbers rather than a fact about the market.
      - text: >
          It is consistent, because the bound $|\operatorname{Cov}(X, Y)| \le
          \sigma_X\sigma_Y$ constrains only positive covariances
        feedback: >
          The bound is on the absolute value. It follows from squaring the
          centred product, which discards the sign entirely.
    rubric:
      - >
        Computes $\sigma_X\sigma_Y = 120$ and compares it with $|-126|$.
      - >
        Treats the violation as an arithmetic error rather than a market
        phenomenon.
    targets:
      - quant-probability.inequalities.cs-covariance
    exercises:
      - quant-probability.inequalities.cauchy-schwarz-rv
      - quant-probability.joint.correlation

  # --- Paley–Zygmund and the second-moment method -----------------------------

  - id: qineq-paley-zygmund-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is the number of fixed points of a uniformly random permutation of
      $12$ objects; it is known that $\mathbb{E}[X] = 1$ and
      $\operatorname{Var}(X) = 1$. What lower bound does the second-moment
      method give for $\Pr(X \ge 1)$?
    answer: >
      $1/2$. First convert the variance into a second moment:
      $\mathbb{E}[X^{2}] = \operatorname{Var}(X) + (\mathbb{E}[X])^{2} =
      1 + 1 = 2$. The $\theta = 0$ case of Paley–Zygmund then gives
      $\Pr(X > 0) \ge (\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}] = 1/2$, and since
      $X$ counts things, $\{X > 0\}$ and $\{X \ge 1\}$ are the same event. The
      true probability is $1$ minus the derangement fraction, about
      $1 - 1/e \approx 0.632$, so the bound is valid and not sharp — the usual
      state of affairs for a two-moment argument. What matters is the
      direction: Markov applied to the same data says only
      $\Pr(X \ge 1) \le \mathbb{E}[X]/1 = 1$, an upper bound, and upper is the
      wrong way round for a question asking whether a fixed point exists at
      all. The second moment is what rules out the degenerate alternative in
      which $X$ is almost always $0$ and occasionally enormous.
    expects: "1/2"
    rubric:
      - >
        Recovers $\mathbb{E}[X^{2}] = 2$ from the variance and the mean rather
        than using the variance directly.
      - >
        Uses the $\theta = 0$ form and identifies $\{X > 0\}$ with
        $\{X \ge 1\}$ for an integer count.
      - >
        Says why Markov cannot answer the question, rather than only that it
        gives a different number.
    targets:
      - quant-probability.inequalities.paley-zygmund
    exercises:
      - quant-probability.inequalities.cauchy-schwarz-rv

  - id: qineq-paley-zygmund-02
    kind: work
    difficulty: standard
    statement: >
      $X \ge 0$ has $\mathbb{E}[X] = 8$ and $\mathbb{E}[X^{2}] = 100$. What
      lower bound does Paley–Zygmund with $\theta = 1/2$ give for
      $\Pr(X > 4)$?
    answer: >
      $0.16$. The threshold in Paley–Zygmund is $\theta\,\mathbb{E}[X] =
      (1/2)(8) = 4$, which is why $\theta = 1/2$ is the right parameter for
      this event. The bound is
      $(1 - \theta)^{2}(\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}] =
      (1/2)^{2} \times 64/100 = 0.25 \times 0.64 = 0.16$. Two checks. Dropping
      the $(1-\theta)^{2}$ factor reports $0.64$, which is the $\theta = 0$
      answer and bounds $\Pr(X > 0)$, a strictly larger event — so it is not a
      valid bound for $\Pr(X > 4)$. And the bound is decreasing in $\theta$, as
      it must be, since raising the threshold can only shrink the probability
      being bounded from below.
    expects: "0.16"
    rubric:
      - >
        Identifies the threshold as $\theta\,\mathbb{E}[X] = 4$, matching the
        event.
      - >
        Keeps the $(1 - \theta)^{2}$ factor rather than reporting the
        $\theta = 0$ value.
    targets:
      - quant-probability.inequalities.paley-zygmund
    exercises:
      - quant-probability.inequalities.cauchy-schwarz-rv

  # --- which inequality to reach for ------------------------------------------

  - id: qineq-choosing-a-bound-01
    kind: decide
    difficulty: demanding
    statement: >
      You are told only this: a strategy's daily return $R$ has mean $0.2$ and
      standard deviation $1.5$, both in percent; the shape of the distribution
      is unknown and there is no reason to assume symmetry; and you must give a
      defensible ceiling on the chance of a loss worse than $-4$. Which tool is
      calibrated to exactly that information?
    answer: >
      Cantelli's one-sided bound. The inputs are a mean, a variance, one tail
      and no shape — which names the tool before any arithmetic happens. The
      deviation from the mean is $t = 0.2 - (-4) = 4.2$, so
      $\Pr(R - \mu \le -t) \le \sigma^{2}/(\sigma^{2} + t^{2}) =
      2.25/(2.25 + 17.64) = 2.25/19.89 \approx 0.113$. Each of the discarded
      options fails on a hypothesis rather than on arithmetic. Markov needs
      $R \ge 0$, and a return is signed. Halving Chebyshev's $2.25/17.64
      \approx 0.128$ to $0.064$ assumes the two tails split the deviation
      evenly, which the question explicitly refuses to grant, and errs by
      understating a downside — the unsafe direction. Chernoff needs the moment
      generating function, which was not supplied; reaching for it invents
      information. Naming the hypothesis you were handed, then the bound
      calibrated to it, is the part being graded.
    choices:
      - text: >
          Markov applied to $R$ directly, giving $0.2/(-4)$
        feedback: >
          $R$ can be negative, so Markov's hypothesis fails before the
          arithmetic does — and the number it returns is negative, which no
          probability bound can be.
      - text: >
          Chebyshev's two-sided bound, halved, since the question names only one
          tail
        feedback: >
          Halving assumes the two tails carry the deviation equally, true only
          for a symmetric law. A skewed return can load its whole deviation on
          the loss side, so halving understates the risk.
      - text: >
          Cantelli's one-sided bound with $t = 4.2$, giving
          $\sigma^{2}/(\sigma^{2} + t^{2})$
        correct: true
        feedback: >
          Mean, variance, one tail, no shape — exactly Cantelli's hypothesis.
          Here $2.25/19.89 \approx 0.113$.
      - text: >
          Chernoff, since it always gives the sharpest available bound
        feedback: >
          Chernoff needs the moment generating function, which was never
          supplied. Sharpness is not available for free; it is bought with a
          hypothesis you do not have.
    rubric:
      - >
        Reads the available hypotheses off the question before choosing a
        formula.
      - >
        Measures the deviation from the mean, so $t = 4.2$ rather than $4$.
      - >
        Says why halving the two-sided bound fails in the unsafe direction.
    targets:
      - quant-probability.inequalities.choosing-a-bound
    exercises:
      - quant-probability.inequalities.markov
      - quant-probability.inequalities.chebyshev

  - id: qineq-choosing-a-bound-02
    kind: decide
    difficulty: standard
    statement: >
      A sum of $n$ independent bounded pieces needs a tail bound that vanishes
      faster than any fixed power of $n$. Which tool does that, and on what
      extra input?
    answer: >
      Chernoff, on the moment generating function. The ladder of hypotheses
      settles it: a mean buys Markov's $1/k$, a variance buys Chebyshev's
      $1/k^{2}$, and only the moment generating function buys exponential
      decay. What makes it cheap here is independence — the moment generating
      function of a sum factorises into a product over the pieces, so the
      optimized exponent is a sum of $n$ per-piece terms and grows linearly in
      $n$, giving a bound like $e^{-cn}$ rather than any power of $1/n$.
      Chebyshev cannot do it at any variance, because $\sigma^{2}/t^{2}$ is
      polynomial by construction. The union bound is answering a different
      question, about a union of listed events, and its sum grows with $n$
      rather than shrinking. Jensen is not a tail bound at all: it fixes the
      direction of $\mathbb{E}[e^{X}]$ against $e^{\mathbb{E}[X]}$, and the
      tail only appears once Markov is applied after the exponentiation.
    choices:
      - text: >
          Chebyshev, on the variance of the sum
        feedback: >
          Chebyshev decays like $1/k^{2}$ in the number of standard deviations —
          polynomial by construction, so it cannot beat every fixed power.
      - text: >
          Chernoff, on the moment generating function, which factorises over the
          independent pieces
        correct: true
        feedback: >
          The factorisation makes the optimized exponent grow linearly in $n$,
          which is exactly the exponential decay being asked for.
      - text: >
          The union bound, on the list of the $n$ pieces
        feedback: >
          The union bound needs no moments, but summing $n$ per-piece
          probabilities grows with $n$. It bounds a union of bad events, not
          the tail of a sum.
      - text: >
          Jensen, on the convexity of the exponential
        feedback: >
          Jensen fixes the direction of $\mathbb{E}[e^{X}]$ versus
          $e^{\mathbb{E}[X]}$ but produces no tail bound by itself — the tail
          comes from applying Markov after exponentiating.
    rubric:
      - >
        Names the moment generating function as the extra input, not just the
        tool.
      - >
        Explains the exponential decay through the factorisation over
        independent pieces.
    targets:
      - quant-probability.inequalities.choosing-a-bound
    exercises:
      - quant-probability.inequalities.chebyshev
      - quant-probability.inequalities.chernoff
      - quant-probability.inequalities.union-bound
      - quant-probability.inequalities.jensen
