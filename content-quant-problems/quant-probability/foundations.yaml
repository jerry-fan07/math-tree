# Problems targeting quant-probability.foundations — the quant tree's first bank.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. See ../README.md.

problems:
  # --- the sample space ------------------------------------------------------

  - id: qfnd-sample-space-01
    kind: work
    difficulty: demanding
    statement: >
      Two fair dice are rolled. Let $E$ be the event that the larger of the two
      values shown is exactly $4$, where a tie counts as both dice showing the
      larger value. How many outcomes of $\Omega$ lie in $E$?
    answer: >
      Seven. Take $\Omega$ to be the $36$ ordered pairs. The maximum is exactly
      $4$ when at least one die shows $4$ and neither shows $5$ or $6$ — so both
      values lie in $\{1,2,3,4\}$ and at least one is a $4$. There are $4^{2} =
      16$ pairs from $\{1,2,3,4\}$ and $3^{2} = 9$ of them avoid $4$ entirely,
      leaving $16 - 9 = 7$: the pairs $(1,4), (2,4), (3,4), (4,4), (4,1), (4,2),
      (4,3)$. Counting "one die is $4$, the other is at most $4$" as $4 + 4 = 8$
      double-counts $(4,4)$, which is the trap.
    expects: "7"
    rubric:
      - >
        Works in a sample space of ordered pairs, so $(1,4)$ and $(4,1)$ are
        two outcomes rather than one.
      - >
        Handles the tie $(4,4)$ exactly once rather than twice or not at all.
    targets:
      - quant-probability.foundations.sample-space

  - id: qfnd-sample-space-02
    kind: work
    difficulty: standard
    statement: >
      A fair coin is tossed twice. A candidate takes $\Omega$ to be
      $\{\text{no heads}, \text{one head}, \text{two heads}\}$ and concludes that
      the probability of exactly one head is $1/3$. What is the correct
      probability?
    answer: >
      One half. The three descriptions are events, not equally likely outcomes.
      The mechanism produces the four ordered sequences $HH$, $HT$, $TH$, $TT$,
      each with probability $1/4$, and exactly one head occurs in two of them, so
      the probability is $2/4 = 1/2$. The candidate's $\Omega$ is a legitimate
      partition of the real one — it is only the uniformity claim on it that is
      false.
    expects: "1/2"
    rubric:
      - >
        Identifies that the three-element description is a coarsening, and that
        coarsening a uniform space need not leave it uniform.
      - >
        Recomputes over the four ordered sequences rather than patching the
        wrong space.
    targets:
      - quant-probability.foundations.sample-space

  # --- event algebra ---------------------------------------------------------

  - id: qfnd-event-algebra-01
    kind: work
    difficulty: demanding
    statement: >
      With $\Pr(A) = 0.5$, $\Pr(B) = 0.4$ and $\Pr(A \cap B) = 0.2$, what is the
      probability that exactly one of $A$ and $B$ occurs?
    answer: >
      $0.5$. "Exactly one" is the disjoint union $(A \setminus B) \cup (B
      \setminus A)$, and the difference rule gives $\Pr(A \setminus B) = \Pr(A) -
      \Pr(A \cap B) = 0.3$ and $\Pr(B \setminus A) = 0.4 - 0.2 = 0.2$, totalling
      $0.5$. Equivalently $\Pr(A) + \Pr(B) - 2\Pr(A \cap B)$: the overlap is
      removed twice, once from each side, because it belongs to neither piece.
    expects: "0.5"
    rubric:
      - >
        Expresses "exactly one" as a union of two disjoint set differences rather
        than as $A \cup B$.
      - >
        Subtracts the overlap twice, not once — the coefficient is what separates
        this from the union formula.
    targets:
      - quant-probability.foundations.event-algebra
    exercises:
      - quant-probability.foundations.sample-space

  - id: qfnd-event-algebra-02
    kind: decide
    difficulty: standard
    statement: >
      Which event is $(A \cap B)^{c}$?
    answer: >
      "At least one of $A$, $B$ fails", i.e. $A^{c} \cup B^{c}$ — this is De
      Morgan's second law. It is strictly weaker than "neither occurs", which is
      $A^{c} \cap B^{c} = (A \cup B)^{c}$: "not both" still permits exactly one
      of them to happen.
    choices:
      - text: >
          $A^{c} \cap B^{c}$ — neither occurs
        feedback: >
          That is $(A \cup B)^{c}$, the complement of "at least one". You have
          complemented the wrong operation.
      - text: >
          $A^{c} \cup B^{c}$ — at least one of them fails
        correct: true
        feedback: >
          De Morgan sends the complement of an intersection to the union of the
          complements.
      - text: >
          $A \cup B$ — at least one occurs
        feedback: >
          That is not a complement of anything here; it overlaps $A \cap B$
          rather than excluding it.
    rubric:
      - >
        Applies De Morgan in the correct direction, swapping intersection for
        union under the complement.
    targets:
      - quant-probability.foundations.event-algebra
    exercises:
      - quant-probability.foundations.sample-space

  # --- the axioms ------------------------------------------------------------

  - id: qfnd-axioms-01
    kind: work
    difficulty: demanding
    statement: >
      A model puts $\Omega = \{1, 2, 3, \dots\}$ and assigns
      $\Pr(\{k\}) = c \, 3^{-k}$ for every $k \ge 1$. For which $c$ is this a
      probability measure?
    answer: >
      $c = 2$. Countable additivity applied to the singletons forces
      $\sum_{k \ge 1} c \, 3^{-k} = \Pr(\Omega) = 1$. The geometric sum is
      $\sum_{k \ge 1} 3^{-k} = \dfrac{1/3}{1 - 1/3} = \dfrac{1}{2}$, so
      $c/2 = 1$ and $c = 2$. Nonnegativity then holds automatically since
      $c > 0$. Note that normalisation alone does not pick $c$ — it is
      normalisation plus countable additivity over an infinite family, which is
      exactly the axiom finite additivity would not have supplied.
    expects: "2"
    rubric:
      - >
        Uses countable additivity over infinitely many singletons, not finite
        additivity.
      - >
        Evaluates $\sum_{k \ge 1} 3^{-k}$ as $1/2$ — starting the index at $k=1$
        rather than $k=0$.
      - >
        Checks nonnegativity as well as normalisation.
    targets:
      - quant-probability.foundations.axioms
    exercises:
      - quant-probability.foundations.event-algebra

  - id: qfnd-axioms-02
    kind: decide
    difficulty: standard
    statement: >
      Is "$\Pr(A) \le 1$ for every event $A$" an axiom of a probability space, or
      a consequence of the axioms?
    answer: >
      A consequence. The axioms demand only nonnegativity, $\Pr(\Omega) = 1$ and
      countable additivity. From these, $A$ and $A^{c}$ are disjoint with union
      $\Omega$, so $\Pr(A) + \Pr(A^{c}) = 1$, and since $\Pr(A^{c}) \ge 0$ we get
      $\Pr(A) \le 1$. Knowing which facts are assumed and which are derived is
      what lets you rebuild the subject when a formula stops making sense.
    choices:
      - text: >
          An axiom — probabilities are defined to lie in $[0,1]$
        feedback: >
          The upper bound is never assumed. Only nonnegativity,
          $\Pr(\Omega) = 1$ and additivity are.
      - text: >
          A consequence of additivity, normalisation and nonnegativity
        correct: true
        feedback: >
          Split $\Omega$ into $A$ and $A^{c}$ and use that both probabilities are
          nonnegative.
    rubric:
      - >
        Names the three axioms correctly and does not include the upper bound
        among them.
      - >
        Derives $\Pr(A) \le 1$ from the complement split rather than asserting it.
    targets:
      - quant-probability.foundations.axioms
    exercises:
      - quant-probability.foundations.event-algebra

  # --- finite additivity -----------------------------------------------------

  - id: qfnd-finite-additivity-01
    kind: work
    difficulty: demanding
    statement: >
      $\Omega$ is partitioned into countably many events $A_1, A_2, \dots$ with
      $\Pr(A_k) = 2^{-k}$. What is
      $\Pr(A_1 \cup A_3 \cup A_5 \cup \cdots)$ — the union of the
      odd-indexed blocks?
    answer: >
      $2/3$. The blocks are pairwise disjoint, so countable additivity applies
      directly to the sub-family: the answer is
      $\sum_{j \ge 0} 2^{-(2j+1)} = \tfrac{1}{2}\sum_{j \ge 0} 4^{-j}
      = \dfrac{1/2}{1 - 1/4} = \dfrac{2}{3}$. As a check, the whole family sums
      to $\sum_{k \ge 1} 2^{-k} = 1$, as a partition of $\Omega$ must, so the
      even blocks take the remaining $1/3$.
    expects: "2/3"
    tolerance: 0.0005
    rubric:
      - >
        Applies additivity to the disjoint sub-family without needing to
        re-derive it.
      - >
        Sums the geometric series with ratio $1/4$, not $1/2$.
      - >
        Checks that the full partition sums to $1$.
    targets:
      - quant-probability.foundations.finite-additivity
    exercises:
      - quant-probability.foundations.axioms

  - id: qfnd-finite-additivity-02
    kind: justify
    difficulty: standard
    statement: >
      Prove from the axioms that $\Pr(\emptyset) = 0$, and say where countable
      rather than finite additivity is used.
    answer: >
      The sequence $\emptyset, \emptyset, \emptyset, \dots$ is pairwise disjoint
      — distinct copies of the empty set intersect in $\emptyset$ — and its union
      is $\emptyset$. Countable additivity gives
      $\Pr(\emptyset) = \sum_{i \ge 1} \Pr(\emptyset)$. Writing
      $p = \Pr(\emptyset) \ge 0$, the right side is an infinite sum of copies of
      $p$, which is finite only when $p = 0$; and it must be finite because
      $\Pr(\emptyset) \le 1$. Hence $p = 0$. Finite additivity alone cannot run
      this argument — a finite sum of copies of $p$ is finite for every $p$, so
      nothing forces $p$ down.
    rubric:
      - >
        Uses an infinite disjoint sequence, and says why finite additivity does
        not suffice.
      - >
        Argues that an infinite sum of a positive constant cannot be bounded.
      - >
        Does not assume $\Pr(\emptyset) = 0$ anywhere in the derivation.
    targets:
      - quant-probability.foundations.finite-additivity
    exercises:
      - quant-probability.foundations.axioms

  # --- complement, monotonicity, difference ----------------------------------

  - id: qfnd-complement-01
    kind: work
    difficulty: demanding
    statement: >
      $\Pr(A) = 0.6$ and $\Pr(B) = 0.7$, with nothing else known about how the
      two events relate. What is the smallest value $\Pr(A \cap B)$ can take?
    answer: >
      $0.3$. Since $\Pr(A \cup B) \le 1$ and
      $\Pr(A \cup B) = \Pr(A) + \Pr(B) - \Pr(A \cap B)$, rearranging gives
      $\Pr(A \cap B) \ge \Pr(A) + \Pr(B) - 1 = 0.3$ — the two-event Bonferroni
      bound. It is attained: if $A \cup B = \Omega$ the overlap is exactly $0.3$.
      The upper bound is $\min(0.6, 0.7) = 0.6$ by monotonicity, so the overlap
      lives in $[0.3, 0.6]$ and no smaller value is consistent with the axioms.
    expects: "0.3"
    rubric:
      - >
        Uses $\Pr(A \cup B) \le 1$, which is monotonicity plus normalisation,
        rather than assuming independence.
      - >
        Shows the bound is attained rather than only proving the inequality.
    targets:
      - quant-probability.foundations.complement
    exercises:
      - quant-probability.foundations.finite-additivity

  - id: qfnd-complement-02
    kind: work
    difficulty: standard
    statement: >
      $A$ and $B$ are disjoint, $\Pr(A \cup B) = 0.8$ and $\Pr(B) = 0.5$. What is
      $\Pr(A^{c})$?
    answer: >
      $0.7$. Disjointness gives $\Pr(A) = \Pr(A \cup B) - \Pr(B) = 0.3$ by finite
      additivity, and the complement rule then gives
      $\Pr(A^{c}) = 1 - 0.3 = 0.7$. The question asks for the complement rather
      than for $\Pr(A)$ on purpose: stopping at $0.3$ is the standard slip.
    expects: "0.7"
    rubric:
      - >
        Uses disjointness to subtract, rather than the general union formula with
        an unknown overlap.
      - >
        Answers the question asked — the complement, not $\Pr(A)$.
    targets:
      - quant-probability.foundations.complement
    exercises:
      - quant-probability.foundations.finite-additivity

  # --- unions and inclusion-exclusion ----------------------------------------

  - id: qfnd-union-two-01
    kind: work
    difficulty: demanding
    statement: >
      Three events each have probability $0.4$, each pairwise intersection has
      probability $0.15$, and the triple intersection has probability $0.05$.
      What is $\Pr(A \cup B \cup C)$?
    answer: >
      $0.8$. Inclusion–exclusion for three events alternates by the size of the
      intersection: $3(0.4) - 3(0.15) + 0.05 = 1.2 - 0.45 + 0.05 = 0.8$. The
      triple term is added: it was counted three times by the singles and
      removed three times by the pairs, so it needs to come back once. Dropping
      it would give $0.75$ and quietly under-count every outcome lying in all
      three events.
    expects: "0.8"
    rubric:
      - >
        Uses all seven terms with alternating signs, including the triple
        intersection with a plus.
      - >
        Sanity-checks that the result lies in $[0,1]$ and is at least the largest
        single probability.
    targets:
      - quant-probability.foundations.union-two
    exercises:
      - quant-probability.foundations.complement

  - id: qfnd-union-two-02
    kind: work
    difficulty: standard
    statement: >
      $\Pr(A) = 0.3$ and $\Pr(B) = 0.45$. What is the largest value
      $\Pr(A \cup B)$ can take?
    answer: >
      $0.75$. The union formula gives
      $\Pr(A \cup B) = 0.75 - \Pr(A \cap B)$, which is largest when the overlap
      is smallest, and the overlap can be $0$ here because $0.3 + 0.45 \le 1$
      leaves room for the two events to be disjoint. So the maximum is the union
      bound $\Pr(A) + \Pr(B) = 0.75$, attained exactly when they are disjoint.
    expects: "0.75"
    rubric:
      - >
        Identifies that maximising the union means minimising the overlap.
      - >
        Checks that a zero overlap is actually consistent — the two probabilities
        sum to at most $1$.
    targets:
      - quant-probability.foundations.union-two
    exercises:
      - quant-probability.foundations.complement

  # --- the classical model ---------------------------------------------------

  - id: qfnd-classical-01
    kind: work
    difficulty: demanding
    statement: >
      Five cards are dealt from a standard $52$-card deck. What is the
      probability that all five ranks are distinct — that the hand contains no
      pair of any kind? Give four decimal places.
    answer: >
      $\approx 0.5071$. Work with unordered hands throughout, so
      $|\Omega| = \binom{52}{5} = 2{,}598{,}960$. To build a hand with five
      distinct ranks, choose the five ranks in $\binom{13}{5} = 1287$ ways and
      then a suit for each independently, $4^{5} = 1024$ ways, giving
      $1287 \times 1024 = 1{,}317{,}888$ favourable hands. The probability is
      $1{,}317{,}888 / 2{,}598{,}960 \approx 0.5071$. The count is not
      $\binom{13}{5}\binom{4}{1}$ — each of the five ranks gets its own suit
      choice.
    expects: "0.5071"
    tolerance: 0.0005
    rubric:
      - >
        Takes numerator and denominator over the same $\Omega$ — both unordered.
      - >
        Chooses a suit for each of the five ranks independently, giving $4^{5}$
        rather than $4$.
      - >
        Reads "no pair" as "all ranks distinct", which also excludes trips, quads
        and full houses.
    targets:
      - quant-probability.foundations.classical
    exercises:
      - quant-probability.foundations.axioms

  - id: qfnd-classical-02
    kind: work
    difficulty: standard
    statement: >
      Four fair coins are tossed. What is the probability of exactly two heads?
    answer: >
      $3/8$. There are $2^{4} = 16$ equally likely sequences and
      $\binom{4}{2} = 6$ of them show exactly two heads, so the probability is
      $6/16 = 3/8 = 0.375$. Counting over "number of heads" instead would give
      five outcomes and the wrong answer of $1/5$ — those five are events of
      unequal weight, not equally likely outcomes.
    expects: "3/8"
    tolerance: 0.0005
    rubric:
      - >
        Counts over sequences, so that the outcomes being divided are genuinely
        equally likely.
      - >
        Uses $\binom{4}{2} = 6$ for the favourable count.
    targets:
      - quant-probability.foundations.classical
    exercises:
      - quant-probability.foundations.axioms

  # --- uniformity is earned, not assumed -------------------------------------

  - id: qfnd-uniformity-assumption-01
    kind: work
    difficulty: demanding
    statement: >
      A stick of length $1$ is broken at a point chosen uniformly along it. A
      candidate argues that the longer piece is "either more than twice the
      shorter one or not, so it is $1/2$". What is the correct probability that
      the longer piece is more than twice the shorter?
    answer: >
      $2/3$. Let $x$ be the break point, uniform on $[0,1]$. The pieces are $x$
      and $1-x$, and the longer exceeds twice the shorter exactly when
      $x < 1/3$ or $x > 2/3$ — at $x = 1/3$ the pieces are $1/3$ and $2/3$, the
      break-even ratio. Those two intervals have total length $2/3$. The
      candidate's error is applying uniformity to a two-element description
      ("more than twice" or not) rather than to the mechanism, which is uniform
      on the break point.
    expects: "2/3"
    tolerance: 0.0005
    rubric:
      - >
        Puts the uniform measure on the break point, which is where the mechanism
        actually is.
      - >
        Solves the ratio condition to get the threshold $1/3$, and takes both
        tails.
      - >
        Names the candidate's error as coarsening rather than as arithmetic.
    targets:
      - quant-probability.foundations.uniformity-assumption
    exercises:
      - quant-probability.foundations.classical

  - id: qfnd-uniformity-assumption-02
    kind: decide
    difficulty: standard
    statement: >
      Two fair dice are rolled. Are the eleven possible sums equally likely?
    answer: >
      No. The $36$ ordered pairs are equally likely, and the sums group them
      unevenly: a $7$ arises from six pairs and a $2$ from one, so $7$ is six
      times as likely as $2$. Coarsening a uniform space almost never leaves it
      uniform, and the sums are a coarsening.
    choices:
      - text: >
          Yes — each sum is a possible result of the experiment
        feedback: >
          Being possible is not being equally likely. The sums are events built
          from different numbers of underlying outcomes.
      - text: >
          No — the sums group different numbers of ordered pairs
        correct: true
        feedback: >
          Six pairs give $7$ and one gives $2$; the weights differ by a factor of
          six.
    rubric:
      - >
        Locates the uniformity at the level of ordered pairs, not sums.
      - >
        Quantifies the disparity rather than only asserting it.
    targets:
      - quant-probability.foundations.uniformity-assumption
    exercises:
      - quant-probability.foundations.classical

  # --- dice sums -------------------------------------------------------------

  - id: qfnd-dice-sum-seven-01
    kind: work
    difficulty: demanding
    statement: >
      Three fair dice are rolled. How many of the $216$ ordered triples sum to
      $11$?
    answer: >
      $27$. Substitute $x = a-1$, $y = b-1$, $z = c-1$, so the question is the
      number of solutions of $x + y + z = 8$ with each variable in
      $\{0,1,\dots,5\}$. Ignoring the upper bound, stars and bars give
      $\binom{10}{2} = 45$. Subtract the solutions with some variable at least
      $6$: fixing which one and setting it to $6 + x'$ leaves
      $x' + y + z = 2$, with $\binom{4}{2} = 6$ solutions, and three choices of
      which variable, so $18$. Two variables cannot both exceed $5$ since
      $12 > 8$, so no term is added back: $45 - 18 = 27$, and
      $\Pr = 27/216 = 1/8$.
    expects: "27"
    rubric:
      - >
        Counts ordered triples, not partitions.
      - >
        Applies the upper-bound correction, and argues that the two-variable term
        vanishes rather than silently omitting it.
    targets:
      - quant-probability.foundations.dice-sum-seven
    exercises:
      - quant-probability.foundations.classical

  - id: qfnd-dice-sum-seven-02
    kind: work
    difficulty: standard
    statement: >
      Two fair dice are rolled. What is the probability that the sum is $7$ or
      $11$?
    answer: >
      $2/9$. Six ordered pairs sum to $7$ and two — $(5,6)$ and $(6,5)$ — sum to
      $11$; the two events are disjoint, so the counts simply add:
      $8/36 = 2/9 \approx 0.2222$. This is the natural-win probability on the
      come-out roll in craps.
    expects: "2/9"
    tolerance: 0.0005
    rubric:
      - >
        Notes the two events are disjoint, so no overlap is subtracted.
      - >
        Gets two ordered pairs for $11$, not one.
    targets:
      - quant-probability.foundations.dice-sum-seven
    exercises:
      - quant-probability.foundations.classical

  # --- inclusion-exclusion in the wild ---------------------------------------

  - id: qfnd-divisibility-union-01
    kind: work
    difficulty: demanding
    statement: >
      An integer is drawn uniformly from $1$ to $1000$. What is the probability
      it is divisible by $7$, $11$ or $13$?
    answer: >
      $0.28$. The single counts are $\lfloor 1000/7 \rfloor = 142$,
      $\lfloor 1000/11 \rfloor = 90$ and $\lfloor 1000/13 \rfloor = 76$. The
      pairwise overlaps use the products, which here are also the least common
      multiples since the three are coprime:
      $\lfloor 1000/77 \rfloor = 12$, $\lfloor 1000/91 \rfloor = 10$,
      $\lfloor 1000/143 \rfloor = 6$. The triple overlap is
      $\lfloor 1000/1001 \rfloor = 0$. Inclusion–exclusion gives
      $142 + 90 + 76 - 12 - 10 - 6 + 0 = 280$, so the probability is
      $280/1000 = 0.28$.
    expects: "0.28"
    rubric:
      - >
        Uses floor division for every count, including the overlaps.
      - >
        Takes the pairwise overlaps at the least common multiples, and says why
        the products serve here.
      - >
        Notices that the triple overlap is empty rather than assuming it is.
    targets:
      - quant-probability.foundations.divisibility-union
    exercises:
      - quant-probability.foundations.union-two

  - id: qfnd-divisibility-union-02
    kind: work
    difficulty: standard
    statement: >
      An integer is drawn uniformly from $1$ to $100$. What is the probability it
      is divisible by $4$ or $6$?
    answer: >
      $0.33$. There are $\lfloor 100/4 \rfloor = 25$ multiples of $4$ and
      $\lfloor 100/6 \rfloor = 16$ of $6$. The overlap is the multiples of
      $\operatorname{lcm}(4,6) = 12$, of which there are
      $\lfloor 100/12 \rfloor = 8$ — not the multiples of $24$. So
      $25 + 16 - 8 = 33$ and the probability is $0.33$. Using the product $24$
      would give $4$ and an answer of $0.37$.
    expects: "0.33"
    rubric:
      - >
        Takes the overlap at $\operatorname{lcm}(4,6) = 12$ rather than at the
        product $24$.
      - >
        Uses floor division rather than exact ratios.
    targets:
      - quant-probability.foundations.divisibility-union
    exercises:
      - quant-probability.foundations.union-two

  # --- independence ----------------------------------------------------------

  - id: qfnd-independence-events-01
    kind: work
    difficulty: demanding
    statement: >
      $A$ and $B$ are independent, $\Pr(A) = 0.4$ and $\Pr(A \cup B) = 0.7$. What
      is $\Pr(B)$?
    answer: >
      $0.5$. Independence lets the union formula be written in one unknown:
      $\Pr(A \cup B) = \Pr(A) + \Pr(B) - \Pr(A)\Pr(B)$, so
      $0.7 = 0.4 + b(1 - 0.4) = 0.4 + 0.6b$ and $b = 0.3/0.6 = 0.5$. The
      complementary route is quicker and worth having: independence makes
      "neither occurs" factorise, so $1 - 0.7 = (1 - 0.4)(1 - b)$, giving
      $0.3 = 0.6(1-b)$ and the same $b = 0.5$.
    expects: "0.5"
    rubric:
      - >
        Substitutes $\Pr(A \cap B) = \Pr(A)\Pr(B)$ before solving, rather than
        treating the overlap as a second unknown.
      - >
        Solves the resulting linear equation correctly.
    targets:
      - quant-probability.foundations.independence-events
    exercises:
      - quant-probability.foundations.axioms

  - id: qfnd-independence-events-02
    kind: decide
    difficulty: standard
    statement: >
      Two fair dice are rolled. Let $A$ be "the first die is even" and $B$ be
      "the sum is $8$". Are $A$ and $B$ independent?
    answer: >
      No. $\Pr(A) = 1/2$ and $\Pr(B) = 5/36$, since $(2,6), (3,5), (4,4), (5,3),
      (6,2)$ are the five ordered pairs summing to $8$. Of those, three start with
      an even value, so $\Pr(A \cap B) = 3/36 = 1/12 = 6/72$, while
      $\Pr(A)\Pr(B) = 5/72$. The two differ, so independence fails — and note how
      close it is: the same test with "the sum is $7$" does factorise, so the
      answer cannot be guessed from the setup.
    choices:
      - text: >
          Yes — the dice are independent, so any events about them are
        feedback: >
          Independence of the dice does not pass to arbitrary events built from
          both of them; $B$ couples the two values.
      - text: >
          No — $\Pr(A \cap B) = 1/12$ but $\Pr(A)\Pr(B) = 5/72$
        correct: true
        feedback: >
          The product test is the definition, and here the two sides differ by
          $1/72$.
      - text: >
          Yes — both are $1/2$ by symmetry
        feedback: >
          $\Pr(B) = 5/36$, not $1/2$; only five of the $36$ pairs sum to $8$.
    rubric:
      - >
        Applies the product definition rather than reasoning about physical
        influence.
      - >
        Gets $\Pr(B) = 5/36$ — five ordered pairs, with $(4,4)$ counted once.
    targets:
      - quant-probability.foundations.independence-events
    exercises:
      - quant-probability.foundations.axioms

  - id: qfnd-independence-complements-01
    kind: work
    difficulty: demanding
    statement: >
      $A$, $B$ and $C$ are mutually independent with probabilities $0.2$, $0.3$
      and $0.5$. What is the probability that exactly one of them occurs?
    answer: >
      $0.47$. Because independence passes to complements, each of the three
      disjoint cases factorises directly:
      $0.2 \times 0.7 \times 0.5 = 0.07$,
      $0.8 \times 0.3 \times 0.5 = 0.12$, and
      $0.8 \times 0.7 \times 0.5 = 0.28$. The three cases are disjoint, so they
      add to $0.47$. Without the complement lemma each term would need its own
      argument; with it, "exactly one" is three products.
    expects: "0.47"
    tolerance: 0.0005
    rubric:
      - >
        Uses independence of complements to factorise each term, rather than
        re-deriving it.
      - >
        Splits into three disjoint cases and adds, rather than subtracting from
        the union.
    targets:
      - quant-probability.foundations.independence-complements
    exercises:
      - quant-probability.foundations.independence-events

  - id: qfnd-independence-complements-02
    kind: work
    difficulty: standard
    statement: >
      $A$ and $B$ are independent with $\Pr(A) = 0.6$ and $\Pr(B) = 0.25$. What
      is the probability that neither occurs?
    answer: >
      $0.3$. "Neither" is $A^{c} \cap B^{c}$, and the lemma says $A^{c}$ and
      $B^{c}$ are independent whenever $A$ and $B$ are, so the probability is
      $(1 - 0.6)(1 - 0.25) = 0.4 \times 0.75 = 0.3$. Equivalently, one minus the
      union: $1 - (0.6 + 0.25 - 0.15) = 0.3$.
    expects: "0.3"
    rubric:
      - >
        Factorises the intersection of complements, citing the lemma rather than
        assuming it.
      - >
        Arrives at the same number by the union route as a check.
    targets:
      - quant-probability.foundations.independence-complements
    exercises:
      - quant-probability.foundations.independence-events

  - id: qfnd-pairwise-vs-mutual-01
    kind: work
    difficulty: demanding
    statement: >
      Toss two fair coins. Let $A$ be "the first is heads", $B$ be "the second is
      heads", and $C$ be "the two agree". Compute
      $\Pr(A \cap B \cap C) - \Pr(A)\Pr(B)\Pr(C)$.
    answer: >
      $1/8$. Each event has probability $1/2$, so the product is $1/8$. But
      $A \cap B$ is "both heads", which already forces agreement, so
      $A \cap B \cap C = A \cap B$ and $\Pr(A \cap B \cap C) = 1/4$. The
      difference is $1/4 - 1/8 = 1/8$. Every pair here does factorise —
      each pairwise intersection has probability $1/4 = (1/2)(1/2)$ — so this is
      the canonical example of pairwise independence without mutual
      independence.
    expects: "1/8"
    tolerance: 0.0005
    rubric:
      - >
        Recognises that $A \cap B$ implies $C$, so the triple intersection is not
        an eighth.
      - >
        Verifies the pairwise factorisations, so the example is shown to be
        pairwise independent rather than merely asserted.
    targets:
      - quant-probability.foundations.pairwise-vs-mutual
    exercises:
      - quant-probability.foundations.independence-events

  - id: qfnd-pairwise-vs-mutual-02
    kind: work
    difficulty: standard
    statement: >
      How many separate equations does mutual independence of $A_1, \dots, A_5$
      require?
    answer: >
      $26$. One equation per subset of size at least $2$, so
      $2^{5} - 5 - 1 = 26$: the $\binom{5}{2} = 10$ pairs, $\binom{5}{3} = 10$
      triples, $\binom{5}{4} = 5$ quadruples and the single quintuple. Checking
      only the ten pairwise ones leaves sixteen conditions untested, which is the
      gap the two-coin counterexample walks through.
    expects: "26"
    rubric:
      - >
        Counts subsets of size $\ge 2$, subtracting the singletons and the empty
        set from $2^{n}$.
      - >
        Does not stop at the $\binom{5}{2}$ pairwise conditions.
    targets:
      - quant-probability.foundations.pairwise-vs-mutual
    exercises:
      - quant-probability.foundations.independence-events

  # --- complementary counting ------------------------------------------------

  - id: qfnd-at-least-one-01
    kind: work
    difficulty: demanding
    statement: >
      How many rolls of a single fair die are needed before the probability of
      seeing at least one six first exceeds $0.9$?
    answer: >
      $13$. The condition is $1 - (5/6)^{n} > 0.9$, i.e. $(5/6)^{n} < 0.1$, so
      $n > \dfrac{\ln 0.1}{\ln(5/6)} = \dfrac{-2.3026}{-0.1823} \approx 12.63$
      and the least integer is $n = 13$. Check the boundary: $(5/6)^{12} \approx
      0.1122$, giving $0.8878$, while $(5/6)^{13} \approx 0.0935$, giving
      $0.9065$. Note that dividing the inequality by a negative logarithm
      flips it — doing that mechanically without flipping is the standard error.
    expects: "13"
    rubric:
      - >
        Works with the complement, $(5/6)^{n}$, rather than with the union.
      - >
        Flips the inequality when dividing by $\ln(5/6) < 0$.
      - >
        Rounds up and verifies the boundary case rather than trusting the
        rounding.
    targets:
      - quant-probability.foundations.at-least-one
    exercises:
      - quant-probability.foundations.independence-events
      - quant-probability.foundations.complement

  - id: qfnd-at-least-one-02
    kind: work
    difficulty: standard
    statement: >
      Five independent signals each fire with probability $0.2$. What is the
      probability that at least one fires? Give four decimal places.
    answer: >
      $\approx 0.6723$. None of them fires with probability
      $0.8^{5} = 0.32768$, so at least one fires with probability
      $1 - 0.32768 = 0.67232$. The naive $5 \times 0.2 = 1$ is the union bound
      being read as an equality — it is only tight when the events are disjoint,
      and independent events with positive probability never are.
    expects: "0.6723"
    tolerance: 0.0005
    rubric:
      - >
        Computes the complement as a product, using independence.
      - >
        Does not report $5 \times 0.2$, and can say why that bound is loose here.
    targets:
      - quant-probability.foundations.at-least-one
    exercises:
      - quant-probability.foundations.independence-events
      - quant-probability.foundations.complement

  # --- limits of events ------------------------------------------------------

  - id: qfnd-continuity-limits-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed forever. Let $B_n$ be the event that the first $n$
      tosses are all heads. What is $\Pr(\bigcap_{n \ge 1} B_n)$, and what does
      the answer say about the outcome "every toss is heads"?
    answer: >
      $0$. The $B_n$ are decreasing — $B_1 \supseteq B_2 \supseteq \cdots$ — so
      continuity along monotone sequences gives
      $\Pr(\bigcap_n B_n) = \lim_n \Pr(B_n) = \lim_n 2^{-n} = 0$. The
      intersection is the single outcome "every toss is heads", which is
      therefore an event of probability $0$ that is nonetheless possible: it
      lies in $\Omega$. Probability zero does not mean impossible, and this is
      the cleanest place to see the difference.
    expects: "0"
    rubric:
      - >
        Identifies the sequence as decreasing and applies the matching continuity
        statement.
      - >
        Distinguishes probability zero from impossibility, rather than concluding
        the outcome is not in $\Omega$.
    targets:
      - quant-probability.foundations.continuity-limits
    exercises:
      - quant-probability.foundations.finite-additivity

  - id: qfnd-continuity-limits-02
    kind: justify
    difficulty: standard
    statement: >
      Prove that if $A_1 \subseteq A_2 \subseteq \cdots$ then
      $\Pr(\bigcup_n A_n) = \lim_n \Pr(A_n)$, given countable additivity.
    answer: >
      Disjointify. Put $B_1 = A_1$ and $B_n = A_n \setminus A_{n-1}$ for
      $n \ge 2$. The $B_n$ are pairwise disjoint: for $m < n$, $B_m \subseteq
      A_m \subseteq A_{n-1}$ while $B_n$ avoids $A_{n-1}$. Their union is
      $\bigcup_n A_n$, and $\bigcup_{k \le n} B_k = A_n$ by nesting. Countable
      additivity then gives $\Pr(\bigcup_n A_n) = \sum_{k \ge 1} \Pr(B_k)$, whose
      $n$-th partial sum is $\Pr(A_n)$ by finite additivity. A series is the
      limit of its partial sums, so the total equals $\lim_n \Pr(A_n)$.
    rubric:
      - >
        Constructs the disjointified sequence and verifies both that it is
        pairwise disjoint and that it has the same union.
      - >
        Identifies the partial sums with $\Pr(A_n)$, which is where the nesting
        is used.
      - >
        Invokes countable additivity, not merely finite additivity.
    targets:
      - quant-probability.foundations.continuity-limits
    exercises:
      - quant-probability.foundations.finite-additivity

  - id: qfnd-first-head-odd-01
    kind: work
    difficulty: demanding
    statement: >
      Two players alternate tossing a biased coin that lands heads with
      probability $1/3$. The first player to throw a head wins, and player $A$
      goes first. What is the probability that $A$ wins?
    answer: >
      $3/5$. Condition on the first two tosses. $A$ wins immediately with
      probability $p = 1/3$; otherwise both miss, with probability
      $(1-p)^{2} = 4/9$, and the game restarts with $A$ to throw. So
      $q = p + (1-p)^{2} q$, giving
      $q = \dfrac{p}{1 - (1-p)^{2}} = \dfrac{1/3}{5/9} = \dfrac{3}{5}$. The
      series route agrees: $\sum_{j \ge 0} p(1-p)^{2j} = \dfrac{1/3}{1 - 4/9}$.
      Going first is worth more as the coin gets less likely to land heads it
      is not — at $p \to 0$ the advantage shrinks to $1/2$.
    expects: "3/5"
    tolerance: 0.0005
    rubric:
      - >
        Sets up a first-step recursion or an equivalent geometric series, rather
        than enumerating.
      - >
        Uses $(1-p)^{2}$ for a full round, not $(1-p)$.
      - >
        Checks the answer against the fair case $p = 1/2$, which gives $2/3$.
    targets:
      - quant-probability.foundations.first-head-odd
    exercises:
      - quant-probability.foundations.continuity-limits
      - quant-probability.foundations.independence-events

  - id: qfnd-first-head-odd-02
    kind: work
    difficulty: standard
    statement: >
      A fair coin is tossed until the first head. What is the probability the
      first head arrives on an even-numbered toss?
    answer: >
      $1/3$. The first head lands on toss $k$ with probability $2^{-k}$, so the
      even case is
      $\sum_{j \ge 1} 2^{-2j} = \dfrac{1/4}{1 - 1/4} = \dfrac{1}{3}$. As a check,
      the odd case is $2/3$ and the two sum to $1$ — so the never-a-head outcome
      carries probability $0$.
    expects: "1/3"
    tolerance: 0.0005
    rubric:
      - >
        Sums over $k = 2, 4, 6, \dots$, indexing the geometric series correctly.
      - >
        Checks that odd and even together account for probability $1$.
    targets:
      - quant-probability.foundations.first-head-odd
    exercises:
      - quant-probability.foundations.continuity-limits
      - quant-probability.foundations.independence-events

  # --- odds and market prices ------------------------------------------------

  - id: qfnd-odds-01
    kind: work
    difficulty: demanding
    statement: >
      A price is quoted as $11$ to $4$ against. What are the equivalent decimal
      odds?
    answer: >
      $3.75$. "$11$ to $4$ against" means you win $11$ per $4$ staked, so a
      winning $4$ returns $11$ in profit plus the $4$ stake, $15$ in total —
      a return of $15/4 = 3.75$ per unit staked. Decimal odds include the stake,
      which is exactly the difference between the two conventions; the implied
      probability is $1/3.75 = 4/15 \approx 0.2667$, matching $b/(a+b)$.
    expects: "3.75"
    rubric:
      - >
        Reads "against" in the correct direction — the larger number is the
        profit.
      - >
        Includes the stake in the decimal figure, giving $15/4$ rather than
        $11/4$.
      - >
        Cross-checks against the implied probability $b/(a+b)$.
    targets:
      - quant-probability.foundations.odds
    exercises:
      - quant-probability.foundations.complement

  - id: qfnd-odds-02
    kind: work
    difficulty: standard
    statement: >
      An event has probability $0.6$. What are the odds in favour of it, as a
      single number?
    answer: >
      $1.5$, that is $3$ to $2$ on. The odds in favour are
      $p/(1-p) = 0.6/0.4 = 1.5$. Inverting recovers the probability:
      $o/(1+o) = 1.5/2.5 = 0.6$. Decimal odds would be $1/0.6 \approx 1.667$ —
      a third scale, and confusing it with the odds ratio is the usual slip.
    expects: "1.5"
    rubric:
      - >
        Uses $p/(1-p)$ rather than $1/p$.
      - >
        Can invert back to $0.6$ as a check.
    targets:
      - quant-probability.foundations.odds
    exercises:
      - quant-probability.foundations.complement

  - id: qfnd-implied-probability-vig-01
    kind: work
    difficulty: demanding
    statement: >
      A three-way market is quoted at decimal $2.30$, $3.30$ and $3.60$. What is
      the overround — the amount by which the implied probabilities exceed $1$?
      Give four decimal places.
    answer: >
      $\approx 0.0156$. The implied probabilities are
      $1/2.30 \approx 0.43478$, $1/3.30 \approx 0.30303$ and
      $1/3.60 \approx 0.27778$, summing to $\approx 1.01559$. The overround is
      that sum minus $1$, so $\approx 0.0156$, or about $1.56\%$. The book's hold
      as a fraction of turnover is the smaller number
      $1 - 1/1.01559 \approx 1.54\%$ — the two are routinely conflated, and the
      difference grows as the margin does.
    expects: "0.0156"
    tolerance: 0.0005
    rubric:
      - >
        Converts each decimal price to $1/d$ before summing.
      - >
        Reports the excess over $1$, not the sum itself.
      - >
        Distinguishes the overround from the hold as a fraction of turnover.
    targets:
      - quant-probability.foundations.implied-probability-vig
    exercises:
      - quant-probability.foundations.odds

  - id: qfnd-implied-probability-vig-02
    kind: work
    difficulty: standard
    statement: >
      A two-way market is quoted at decimal $1.95$ on both sides. What do the two
      implied probabilities sum to? Give four decimal places.
    answer: >
      $\approx 1.0256$. Each side implies $1/1.95 \approx 0.51282$, and twice
      that is $\approx 1.02564$. Normalising recovers the fair price of $0.5$ a
      side, as symmetry demands. A sum below $1$ would be an arbitrage, which
      is why it only ever appears across two books rather than within one.
    expects: "1.0256"
    tolerance: 0.0005
    rubric:
      - >
        Converts to implied probabilities with $1/d$ and adds both sides.
      - >
        Recognises the excess as the book's margin rather than as a rounding
        artefact.
    targets:
      - quant-probability.foundations.implied-probability-vig
    exercises:
      - quant-probability.foundations.odds
