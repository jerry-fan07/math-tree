# Problems targeting quant-probability.continuous — the named continuous laws.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. See ../README.md.

problems:
  # --- the continuous uniform ------------------------------------------------

  - id: qcont-uniform-01
    kind: work
    difficulty: demanding
    statement: >
      A shuttle departs at a moment distributed uniformly over the next $30$
      minutes. You have already waited $10$ minutes and it has not left. What is
      your expected additional wait, in minutes?
    answer: >
      $10$ minutes. Conditioning a uniform on a subinterval leaves a uniform:
      given $\{X > 10\}$, the departure time is $U(10,30)$, so the residual wait
      $X - 10$ is $U(0,20)$ with mean $10$. The unconditional mean wait was
      $15$, so the ten minutes already spent bought you five minutes off the
      expected remainder — a uniform lifetime *does* age. That is exactly the
      contrast with $\operatorname{Exp}(\lambda)$, where the residual mean stays
      $1/\lambda$ forever; answering $15$ here is applying memorylessness to the
      one common law on a bounded interval that does not have it.
    expects: "10"
    rubric:
      - >
        Renormalises the density onto $(10,30)$ rather than reusing the
        unconditional mean $15$.
      - >
        Reports the residual wait $X - 10$, not the conditional departure time
        $\mathbb{E}[X \mid X > 10] = 20$.
    targets:
      - quant-probability.continuous.uniform

  - id: qcont-uniform-02
    kind: work
    difficulty: standard
    statement: >
      $X \sim U(a,b)$ has mean $10$ and variance $3$. What is $b$?
    answer: >
      $b = 13$. The variance fixes the width first: $(b-a)^{2}/12 = 3$ gives
      $(b-a)^{2} = 36$ and $b - a = 6$, taking the positive root since $b > a$.
      The mean then fixes the location: $(a+b)/2 = 10$ gives $a + b = 20$.
      Adding the two equations, $2b = 26$, so $b = 13$ and $a = 7$. Check
      $U(7,13)$: midpoint $10$, width $6$, variance $36/12 = 3$. Reading the
      variance as $(b-a)/12$ or as $(b-a)^{2}/2$ is what breaks this — the
      denominator is $12$ and the width is squared.
    expects: "13"
    rubric:
      - >
        Uses $\operatorname{Var}(X) = (b-a)^{2}/12$ to recover the width before
        touching the mean.
      - >
        Solves the pair of equations and checks the resulting interval against
        both given numbers.
    targets:
      - quant-probability.continuous.uniform

  # --- the sum of two uniforms ----------------------------------------------

  - id: qcont-uniform-sum-01
    kind: work
    difficulty: demanding
    statement: >
      Independent $U(0,1)$ draws are added one at a time until the running total
      first exceeds $1/2$. What is the expected number of draws? Give four
      decimal places.
    answer: >
      $\approx 1.6487$, that is $e^{1/2}$. Let $N$ be the number of draws. The
      tail identity $\mathbb{E}[N] = \sum_{n \ge 0}\Pr(N > n)$ is the right tool,
      because $\{N > n\}$ is simply $\{U_1 + \dots + U_n \le 1/2\}$: the total
      has not yet passed the threshold. The simplex volume gives
      $\Pr(U_1 + \dots + U_n \le x) = x^{n}/n!$ for any $0 \le x \le 1$, so
      $\mathbb{E}[N] = \sum_{n \ge 0} (1/2)^{n}/n! = e^{1/2} \approx 1.6487$.
      The familiar answer $e$ is the threshold $x = 1$ case; the general
      threshold gives $e^{x}$, and at $x = 1/2$ just over three halves of a draw
      is enough on average.
    expects: "1.6487"
    tolerance: 0.0005
    rubric:
      - >
        Uses $\mathbb{E}[N] = \sum_{n \ge 0}\Pr(N > n)$ and identifies
        $\{N > n\}$ with the sum staying below the threshold.
      - >
        Uses the simplex volume $x^{n}/n!$ with $x = 1/2$, not the $x = 1$
        special case $1/n!$.
      - >
        Includes the $n = 0$ term, which contributes the $1$ that makes the
        series an exponential.
    targets:
      - quant-probability.continuous.uniform-sum

  - id: qcont-uniform-sum-02
    kind: work
    difficulty: standard
    statement: >
      $S = U_1 + U_2$ with $U_1, U_2$ independent and uniform on $(0,1)$. What is
      the value of the density of $S$ at $s = 1.3$?
    answer: >
      $0.7$. The density is the triangle $f(s) = s$ on $[0,1]$ and
      $f(s) = 2 - s$ on $[1,2]$, so at $s = 1.3$, past the peak, the value is
      $2 - 1.3 = 0.7$. Reading $f(1.3) = 1.3$ uses the rising branch beyond its
      range, and a density that large would put more than the whole probability
      under the curve: the triangle has base $2$ and peak $1$, hence area
      $\tfrac{1}{2}(2)(1) = 1$, exactly as a density must. Symmetry gives the
      same value at $s = 0.7$.
    expects: "0.7"
    rubric:
      - >
        Uses the falling branch $2 - s$ because $1.3 > 1$, rather than the rising
        branch.
      - >
        Can check the triangle integrates to $1$, so the peak value is $1$ and no
        density value exceeds it.
    targets:
      - quant-probability.continuous.uniform-sum

  # --- Beta and the order statistics of uniforms -----------------------------

  - id: qcont-beta-01
    kind: work
    difficulty: demanding
    statement: >
      Five points are drawn independently and uniformly from $(0,1)$. What is the
      probability that the second smallest of them is at most $1/2$?
    answer: >
      $13/16$. The second smallest is
      $\operatorname{Beta}(2,4)$ by the order-statistic match
      $\operatorname{Beta}(k, n-k+1)$ with $k = 2$, $n = 5$, but the CDF is
      easier read combinatorially: the second smallest is at most $1/2$ exactly
      when at least two of the five draws land below $1/2$. Each draw does so
      independently with probability $1/2$, so the count is
      $\operatorname{Binomial}(5, 1/2)$ and the answer is
      $\left[\binom{5}{2} + \binom{5}{3} + \binom{5}{4} + \binom{5}{5}\right]/2^{5}
      = (10 + 10 + 5 + 1)/32 = 26/32 = 13/16$. That Beta-to-binomial bridge —
      $\Pr(X_{(k)} \le t) = \Pr(\operatorname{Binomial}(n,t) \ge k)$ — converts
      every uniform order-statistic tail into a coin count.
    expects: "13/16"
    tolerance: 0.0005
    rubric:
      - >
        Translates $\{X_{(2)} \le 1/2\}$ into "at least two of five draws fall
        below $1/2$" rather than integrating a Beta density.
      - >
        Sums the binomial tail from $k = 2$ upward, not from $k = 3$, and does
        not stop at the single term $\binom{5}{2}$.
    targets:
      - quant-probability.continuous.beta

  - id: qcont-beta-02
    kind: work
    difficulty: standard
    statement: >
      What is the variance of the largest of four independent $U(0,1)$ draws?
    answer: >
      $2/75 \approx 0.0267$. The maximum is the $k = n$ order statistic, so it is
      $\operatorname{Beta}(n, 1) = \operatorname{Beta}(4,1)$, whose mean is
      $4/5$ — the general $k/(n+1)$. The Beta variance
      $ab/((a+b)^{2}(a+b+1))$ with $a = 4$, $b = 1$ gives
      $4/(25 \times 6) = 4/150 = 2/75$. As a check by hand,
      $\Pr(M \le x) = x^{4}$ gives $\mathbb{E}[M^{2}] = \int_{0}^{1} x^{2}
      \cdot 4x^{3}\,dx = 4/6 = 2/3$, and $2/3 - 16/25 = 50/75 - 48/75 = 2/75$.
    expects: "2/75"
    tolerance: 0.0005
    rubric:
      - >
        Identifies the maximum as $\operatorname{Beta}(4,1)$, taking the
        parameters in that order rather than reversed.
      - >
        Substitutes into $ab/((a+b)^{2}(a+b+1))$ with the correct $a+b+1 = 6$.
    targets:
      - quant-probability.continuous.beta

  # --- spacings --------------------------------------------------------------

  - id: qcont-uniform-spacings-01
    kind: work
    difficulty: demanding
    statement: >
      Three points are dropped independently and uniformly on $(0,1)$, cutting it
      into four pieces. What is the probability that the longest piece is longer
      than $1/2$?
    answer: >
      $1/2$. Two pieces cannot both exceed $1/2$, since the four lengths sum to
      $1$, so the four events "this particular piece exceeds $1/2$" are pairwise
      disjoint and their probabilities simply add. The spacings are
      exchangeable, so all four have the same chance, and the leftmost one is
      easiest: it exceeds $1/2$ exactly when all three points land above $1/2$,
      with probability $(1/2)^{3} = 1/8$. Hence the answer is
      $4 \times 1/8 = 1/2$. Adding without checking disjointness would be a union
      bound rather than an identity — here it is an identity, which is what makes
      the count exact.
    expects: "1/2"
    tolerance: 0.0005
    rubric:
      - >
        Argues that at most one piece can exceed $1/2$, so the four events are
        disjoint and the probabilities add exactly.
      - >
        Computes one spacing's tail as $(1/2)^{3}$ and multiplies by the number
        of spacings, $n+1 = 4$, not by $n = 3$.
    targets:
      - quant-probability.continuous.uniform-spacings

  - id: qcont-uniform-spacings-02
    kind: work
    difficulty: standard
    statement: >
      Five points are dropped independently and uniformly on a rod of length
      $12$. What is the expected distance from the right end of the rod to the
      nearest point?
    answer: >
      $2$. The five points cut the rod into $n + 1 = 6$ spacings, which are
      exchangeable and sum to $12$, so each has mean $12/6 = 2$ — including the
      rightmost one, which is exactly the distance asked for. The same fact read
      through the maximum agrees: the largest of five uniforms on $(0,12)$ has
      mean $12 \times 5/6 = 10$, leaving $12 - 10 = 2$ to the right end. Dividing
      by $5$ instead of $6$ is the standard slip — $n$ points make $n+1$ gaps.
    expects: "2"
    rubric:
      - >
        Counts $n + 1 = 6$ spacings, not $n = 5$.
      - >
        Uses exchangeability to give the end spacing the same mean as any
        interior one, rather than treating it as special.
    targets:
      - quant-probability.continuous.uniform-spacings

  # --- the exponential -------------------------------------------------------

  - id: qcont-exponential-01
    kind: work
    difficulty: demanding
    statement: >
      A taxi's arrival time is exponential with mean $10$ minutes. You will give
      up and walk if none has arrived after $15$ minutes. What is your expected
      waiting time, in minutes? Use $e^{-1.5} = 0.2231$ and give four decimal
      places.
    answer: >
      $\approx 7.7687$ minutes. The quantity is $\mathbb{E}[\min(X, 15)]$, and
      the survival-function route avoids all integration by parts:
      $\mathbb{E}[\min(X,c)] = \int_{0}^{c}\Pr(X > t)\,dt
      = \int_{0}^{c} e^{-\lambda t}\,dt = (1 - e^{-\lambda c})/\lambda$. With
      $\lambda = 1/10$ and $c = 15$ this is
      $10(1 - e^{-1.5}) = 10(1 - 0.2231) = 7.769$. Sanity: capping can only
      shorten the wait, so the answer must be below both the uncapped mean $10$
      and the cap $15$, and it is. Answering $10$ ignores the cap; answering
      $10 \times 0.7769 + 15 \times 0.2231$ double-counts, because on the
      truncated branch you wait $15$, not $15$ plus a fresh mean.
    expects: "7.7687"
    tolerance: 0.0005
    rubric:
      - >
        Writes the capped wait as $\int_{0}^{c} \Pr(X > t)\,dt$ or an equivalent
        split, rather than as the unconditional mean.
      - >
        Uses the cap $15$ on the truncated branch, not $15$ plus a further
        expected wait.
      - >
        Checks the answer lies below $\min(10, 15)$.
    targets:
      - quant-probability.continuous.exponential

  - id: qcont-exponential-02
    kind: work
    difficulty: standard
    statement: >
      $X \sim \operatorname{Exp}(\lambda)$ satisfies $\Pr(X > 2) = 0.3$. What is
      $\mathbb{E}[X]$? Use $\ln(10/3) = 1.2040$ and give four decimal places.
    answer: >
      $\approx 1.6612$. The survival function is the fastest way in:
      $\Pr(X > 2) = e^{-2\lambda} = 0.3$, so $2\lambda = \ln(1/0.3) =
      \ln(10/3) = 1.2040$ and $\lambda = 0.6020$ per unit time. The mean is the
      reciprocal of the rate, $\mathbb{E}[X] = 1/\lambda \approx 1.6612$. Two
      traps sit here: quoting $\lambda = 0.6020$ itself as the mean, and using
      the CDF $1 - e^{-\lambda x}$ in place of the survival function, which would
      solve $e^{-2\lambda} = 0.7$ and give a mean of $5.6$.
    expects: "1.6612"
    tolerance: 0.0005
    rubric:
      - >
        Sets $e^{-2\lambda} = 0.3$, using the survival function rather than the
        CDF.
      - >
        Reports $1/\lambda$, not $\lambda$.
    targets:
      - quant-probability.continuous.exponential

  - id: qcont-exponential-03
    kind: work
    difficulty: routine
    statement: >
      Trades in a name arrive as an exponential waiting time at a rate of $12$
      per hour. What is the standard deviation of the wait for the next trade, in
      minutes?
    answer: >
      $5$ minutes. The mean wait is $1/\lambda = 1/12$ hour, which is
      $60/12 = 5$ minutes, and the exponential's signature is that its standard
      deviation equals its mean: $\operatorname{Var}(X) = 1/\lambda^{2}$, so the
      standard deviation is $1/\lambda$ as well. No second computation is needed
      once the mean is in hand — which is exactly the fact worth volunteering
      unprompted in an interview. Reporting the variance $1/144$ hour squared, or
      converting it as though it scaled linearly with time, is the usual slip.
    expects: "5"
    rubric:
      - >
        Converts the rate to a mean wait of $5$ minutes before saying anything
        about spread.
      - >
        Uses $\operatorname{Var}(X) = 1/\lambda^{2}$, so the standard deviation
        equals the mean.
    targets:
      - quant-probability.continuous.exponential

  # --- memorylessness --------------------------------------------------------

  - id: qcont-memoryless-exponential-01
    kind: work
    difficulty: demanding
    statement: >
      $X \sim \operatorname{Exp}(1)$. What is $\mathbb{E}[X \mid X < 1]$? Use
      $e^{-1} = 0.3679$ and give four decimal places.
    answer: >
      $\approx 0.4180$. Memorylessness runs one way only: conditioning on
      $\{X > s\}$ returns a fresh exponential, but conditioning on
      $\{X < s\}$ does not, and this is the computation that shows it. The
      conditional mean is
      $\int_{0}^{1} x e^{-x}\,dx \,/\, \Pr(X < 1)$. Integrating by parts,
      $\int_{0}^{1} x e^{-x}\,dx = [-(x+1)e^{-x}]_{0}^{1} = 1 - 2e^{-1}
      = 0.2642$, while $\Pr(X < 1) = 1 - e^{-1} = 0.6321$, so the ratio is
      $\approx 0.4180$. Equivalently $1/\lambda - s e^{-\lambda s}/
      (1 - e^{-\lambda s})$. Sanity: it must lie in $(0,1)$ and below the
      unconditional mean $1$, and the right-skew pulls it well under the
      midpoint $0.5$.
    expects: "0.4180"
    tolerance: 0.0005
    rubric:
      - >
        Divides by $\Pr(X < 1) = 1 - e^{-1}$ rather than integrating the density
        over $(0,1)$ and stopping.
      - >
        Does not apply memorylessness, which describes conditioning on
        $\{X > s\}$ and says nothing about $\{X < s\}$.
      - >
        Checks the answer lies below the unconditional mean $1$.
    targets:
      - quant-probability.continuous.memoryless-exponential

  - id: qcont-memoryless-exponential-02
    kind: work
    difficulty: standard
    statement: >
      A machine's lifetime is exponential with mean $5$ years, and it has already
      run for $3$ years. What is the probability it fails between year $6$ and
      year $8$? Use $e^{-0.6} = 0.5488$ and $e^{-1} = 0.3679$.
    answer: >
      $\approx 0.1809$. By memorylessness, the remaining life given survival past
      year $3$ is a fresh $\operatorname{Exp}(1/5)$, so the question becomes: what
      is the chance a fresh lifetime falls between $3$ and $5$ years? That is
      $\Pr(Y > 3) - \Pr(Y > 5) = e^{-3/5} - e^{-5/5} = 0.5488 - 0.3679 = 0.1809$.
      Working with the original clock instead gives the same thing:
      $[e^{-6/5} - e^{-8/5}]/e^{-3/5}$, where the conditioning denominator is
      exactly what the shift removes. Forgetting to condition — computing
      $e^{-1.2} - e^{-1.6} = 0.0995$ — is the standard error.
    expects: "0.1809"
    tolerance: 0.0005
    rubric:
      - >
        Shifts the clock by the elapsed $3$ years, or divides by
        $\Pr(X > 3)$ — not neither.
      - >
        Takes a difference of two survival probabilities rather than a single
        tail.
    targets:
      - quant-probability.continuous.memoryless-exponential

  # --- hazard ----------------------------------------------------------------

  - id: qcont-hazard-rate-01
    kind: work
    difficulty: demanding
    statement: >
      A component's hazard rate is $h(x) = 0.5 + 0.2x$ per year. What is the
      probability it survives past year $4$? Use $e^{-3.6} = 0.0273$.
    answer: >
      $\approx 0.0273$. The hazard determines the law through its integral, not
      its value: $\Pr(X > x) = \exp(-\int_{0}^{x} h(u)\,du)$. Here
      $\int_{0}^{4}(0.5 + 0.2u)\,du = 0.5(4) + 0.1(16) = 2 + 1.6 = 3.6$, the
      cumulative hazard, so the survival probability is $e^{-3.6} \approx
      0.0273$. Two wrong moves are common: treating the law as exponential with
      the terminal rate $h(4) = 1.3$, which gives $e^{-5.2} = 0.0055$, and using
      the initial rate $0.5$, which gives $e^{-2} = 0.1353$. The true answer sits
      between them, because a rising hazard means the constant-rate models
      bracket it.
    expects: "0.0273"
    tolerance: 0.0005
    rubric:
      - >
        Integrates the hazard over $[0,4]$ rather than evaluating it at a single
        point.
      - >
        Exponentiates minus the cumulative hazard, giving a survival probability
        rather than a CDF value.
      - >
        Recognises the rising hazard as aging, so the answer must sit between the
        two constant-rate approximations.
    targets:
      - quant-probability.continuous.hazard-rate

  - id: qcont-hazard-rate-02
    kind: work
    difficulty: standard
    statement: >
      $X \sim U(0,10)$. What is its hazard rate at $x = 6$?
    answer: >
      $0.25$ per unit time. The density is $f(6) = 1/10$ and the survival
      probability is $1 - F(6) = 1 - 6/10 = 0.4$, so
      $h(6) = 0.1/0.4 = 0.25$. Note $h(6) = 0.25$ is well above the density
      $0.1$: dividing by a survival probability below $1$ can only raise the
      value. The uniform is a strongly aging law — $h(x) = 1/(10-x)$ climbs to
      infinity as $x \to 10$ — which is the exact opposite of the exponential's
      flat hazard, even though a uniform lifetime "spreads its risk evenly" in
      unconditional terms.
    expects: "0.25"
    rubric:
      - >
        Divides the density by the survival probability $1 - F$, not by $F$.
      - >
        Notes $h(6) > f(6)$, as dividing by a number at most $1$ requires.
    targets:
      - quant-probability.continuous.hazard-rate

  # --- races between clocks --------------------------------------------------

  - id: qcont-min-exponentials-01
    kind: work
    difficulty: demanding
    statement: >
      Three independent clocks fire at rates $1$, $2$ and $3$ per hour. What is
      the probability that the rate-$1$ clock is the *last* of the three to fire?
    answer: >
      $7/12$. Rates share out the first firing, and after it the surviving clocks
      restart, so condition on who goes first. The rate-$2$ clock is first with
      probability $2/(1+2+3) = 1/3$; the remaining race is then between rates $3$
      and $1$, and the rate-$3$ clock wins it with probability $3/(3+1) = 3/4$,
      contributing $1/3 \times 3/4 = 1/4$. The rate-$3$ clock is first with
      probability $3/6 = 1/2$; then rate $2$ beats rate $1$ with probability
      $2/3$, contributing $1/3$. Total $1/4 + 1/3 = 7/12 \approx 0.5833$. The
      tempting shortcut $\lambda_1^{-1}$-weighting, or "slowest is last with
      probability $1 - 1/3 - \ldots$", fails because being last is not the
      mirror image of being first: $\Pr(\text{rate }1\text{ first}) = 1/6$, and
      $1 - 1/6$ is not the answer.
    expects: "7/12"
    tolerance: 0.0005
    rubric:
      - >
        Conditions on which clock fires first and uses the rate-share formula
        twice.
      - >
        Uses the reduced rate total for the second race, dropping the clock that
        has already fired.
      - >
        Does not treat "last" as the complement of "first".
    targets:
      - quant-probability.continuous.min-exponentials

  - id: qcont-min-exponentials-02
    kind: work
    difficulty: standard
    statement: >
      Two independent exponential service times have means $4$ and $6$ minutes.
      What is the expected time until the first of the two completes, in minutes?
    answer: >
      $2.4$ minutes. Rates, not means, are what add under a minimum:
      $\lambda_1 = 1/4$ and $\lambda_2 = 1/6$ per minute, so the minimum is
      $\operatorname{Exp}(1/4 + 1/6) = \operatorname{Exp}(5/12)$ and its mean is
      $12/5 = 2.4$ minutes. Averaging the means to get $5$ is the classic
      mistake, and it fails a sanity check: the first of two completions must
      come sooner than either alone, so the answer has to be below $4$.
    expects: "2.4"
    rubric:
      - >
        Converts means to rates, adds the rates, and inverts — rather than
        combining the means directly.
      - >
        Checks the answer is smaller than the smaller of the two means.
    targets:
      - quant-probability.continuous.min-exponentials

  # --- the two-teller puzzle -------------------------------------------------

  - id: qcont-bank-teller-01
    kind: work
    difficulty: demanding
    statement: >
      Three tellers are serving customers $A$, $B$ and $C$, and you are fourth in
      line; all service times are iid $\operatorname{Exp}(\lambda)$. What is the
      probability that you are the last of the four to leave?
    answer: >
      $1/3$. Wait for the first of the three services to finish and take that
      window. At that instant the two customers still being served have, by
      memorylessness, fresh $\operatorname{Exp}(\lambda)$ remaining times, and
      your own service is an independent $\operatorname{Exp}(\lambda)$ starting
      now. So three exchangeable clocks start together and you are last with
      probability exactly $1/3$ — the elapsed service of the two incumbents is
      worth nothing. The customer who left first is out of the running already,
      which is why the answer is $1/3$ and not $1/4$. In general, with $n$
      tellers the answer is $1/n$; the familiar two-teller $1/2$ is the case
      $n = 2$.
    expects: "1/3"
    tolerance: 0.0005
    rubric:
      - >
        Uses memorylessness to restart the two incumbent services at the moment a
        teller frees up.
      - >
        Counts three clocks in the final race, not four — the first customer to
        finish has already left.
    targets:
      - quant-probability.continuous.bank-teller
    exercises:
      - quant-probability.continuous.memoryless-exponential

  - id: qcont-bank-teller-02
    kind: work
    difficulty: standard
    statement: >
      Two tellers are serving customers and you are third in line; all service
      times are iid exponential with mean $6$ minutes. What is your expected
      total time in the bank, in minutes?
    answer: >
      $9$ minutes. The total splits into two independent pieces. First you wait
      for a teller: that is the minimum of two $\operatorname{Exp}(\lambda)$
      services, which is $\operatorname{Exp}(2\lambda)$ with mean
      $1/(2\lambda) = 3$ minutes. Then your own service takes a further
      $1/\lambda = 6$ minutes on average. Adding, $3 + 6 = 9$ minutes, the
      general $3/(2\lambda)$. Note this is a different question from "do you
      leave last", which is $1/2$ here and does not enter the time calculation
      at all.
    expects: "9"
    rubric:
      - >
        Uses $1/(2\lambda)$ for the wait, recognising the minimum of two
        exponentials doubles the rate.
      - >
        Adds the full expected service $1/\lambda$ on top, rather than reporting
        either piece alone.
    targets:
      - quant-probability.continuous.bank-teller

  # --- the discrete clock ----------------------------------------------------

  - id: qcont-geometric-limit-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is exponential with mean $2$. What is $\mathbb{E}[\lceil X \rceil]$?
      Use $e^{-1/2} = 0.6065$ and give four decimal places.
    answer: >
      $\approx 2.5415$. Rounding up lands exactly on a geometric: for integer
      $k$, $\{\lceil X \rceil > k\}$ is the same event as $\{X > k\}$, so
      $\Pr(\lceil X \rceil > k) = e^{-\lambda k} = (e^{-\lambda})^{k}$, the
      survival function of a geometric on $\{1,2,\dots\}$ with
      $p = 1 - e^{-\lambda}$. Here $\lambda = 1/2$, so
      $p = 1 - 0.6065 = 0.3935$ and the mean is
      $1/p \approx 2.5415$. The rounding costs about half a unit but not
      exactly half: $\mathbb{E}[\lceil X \rceil] - \mathbb{E}[X] \approx 0.5415$,
      and it would be exactly $1/2$ only for a law spread evenly across each
      unit interval. Setting $p = \lambda = 0.5$, which would give a mean of
      $2$, is the trap.
    expects: "2.5415"
    tolerance: 0.0005
    rubric:
      - >
        Matches survival functions to get $p = 1 - e^{-\lambda}$, not
        $p = \lambda$.
      - >
        Uses the mean $1/p$ of a geometric supported on $\{1,2,\dots\}$ rather
        than $(1-p)/p$.
      - >
        Notices the answer exceeds $\mathbb{E}[X] = 2$, as rounding up must make
        it.
    targets:
      - quant-probability.continuous.geometric-limit

  - id: qcont-geometric-limit-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is exponential with rate $\lambda = \ln 2$. What is
      $\Pr(\lceil X \rceil > 3)$?
    answer: >
      $1/8$. Since $\lceil X \rceil > 3$ if and only if $X > 3$ — the ceiling
      exceeds an integer exactly when the number itself does — the probability is
      $e^{-3\lambda} = e^{-3\ln 2} = 2^{-3} = 1/8$. Read through the
      correspondence, this $\lambda$ makes $p = 1 - e^{-\ln 2} = 1/2$, so
      $\lceil X \rceil$ is the number of tosses of a fair coin up to and
      including the first head, whose survival $(1/2)^{3} = 1/8$ agrees exactly.
      No approximation is involved in this direction.
    expects: "1/8"
    tolerance: 0.0005
    rubric:
      - >
        Identifies $\{\lceil X \rceil > k\}$ with $\{X > k\}$ at integer $k$.
      - >
        Cross-checks against the matching geometric with $p = 1/2$.
    targets:
      - quant-probability.continuous.geometric-limit

  # --- waiting for the n-th arrival ------------------------------------------

  - id: qcont-gamma-01
    kind: work
    difficulty: demanding
    statement: >
      Arrivals have iid exponential gaps at rate $\lambda = 2$ per hour. What is
      the probability that the third arrival happens after time $2$ hours? Use
      $e^{-4} = 0.0183$ and give four decimal places.
    answer: >
      $\approx 0.2381$. The wait $T_3$ is $\operatorname{Gamma}(3,2)$, but do not
      integrate its density — read the clock from the other end. The third
      arrival lands after time $2$ exactly when at most two arrivals occur in
      $[0,2]$, and that count is Poisson with mean $\lambda t = 4$. So
      $\Pr(T_3 > 2) = e^{-4}(1 + 4 + 4^{2}/2) = 13e^{-4} \approx 0.2381$. The
      mean wait is $3/2 = 1.5$ hours, comfortably under $2$, so a probability
      near a quarter is the right size. Stopping the sum at $k = 3$ instead of
      $k = 2$ is the off-by-one that costs this problem.
    expects: "0.2381"
    tolerance: 0.0005
    rubric:
      - >
        Converts the Gamma tail into a Poisson partial sum rather than
        integrating the Erlang density.
      - >
        Sums the Poisson terms $k = 0, 1, 2$ — at most $n-1$ arrivals — and stops
        there.
      - >
        Uses the Poisson mean $\lambda t = 4$, not $\lambda = 2$.
    targets:
      - quant-probability.continuous.gamma

  - id: qcont-gamma-02
    kind: work
    difficulty: standard
    statement: >
      Arrivals have iid exponential gaps at rate $5$ per hour. What is the
      standard deviation of the waiting time for the fourth arrival, in hours?
    answer: >
      $0.4$ hour, that is $24$ minutes. The wait is a sum of four independent
      $\operatorname{Exp}(5)$ gaps, so variances add:
      $\operatorname{Var}(T_4) = 4/\lambda^{2} = 4/25$, and the standard
      deviation is $2/5 = 0.4$. The mean is $4/5 = 0.8$ hour, so the ratio of
      standard deviation to mean has fallen to $1/\sqrt{4} = 1/2$ from the single
      exponential's $1$ — summing concentrates. Multiplying the single-gap
      standard deviation by $4$ rather than by $\sqrt{4}$ is the usual slip.
    expects: "0.4"
    rubric:
      - >
        Adds variances, $n/\lambda^{2}$, rather than scaling the standard
        deviation by $n$.
      - >
        Takes the square root at the end, reporting a standard deviation and not
        a variance.
    targets:
      - quant-probability.continuous.gamma

  # --- the bell itself -------------------------------------------------------

  - id: qcont-normal-01
    kind: work
    difficulty: demanding
    statement: >
      The density of $X \sim \mathcal{N}(\mu, \sigma^{2})$ with $\sigma = 4$
      drops to exactly half its peak value at two points. How far apart are
      those two points? Use $\sqrt{2\ln 2} = 1.1774$ and give four decimal
      places.
    answer: >
      $\approx 9.4192$. The normalizing constant cancels in a ratio, so half
      height is the equation $\exp(-(x-\mu)^{2}/(2\sigma^{2})) = 1/2$, that is
      $(x-\mu)^{2} = 2\sigma^{2}\ln 2$ and $|x-\mu| = \sigma\sqrt{2\ln 2}$. The
      two solutions sit symmetrically either side of $\mu$, so their separation
      is $2\sigma\sqrt{2\ln 2} = 2(4)(1.1774) = 9.4192$ — about $2.35$ standard
      deviations, a width that does not depend on $\mu$ at all. Answering $8$
      is the trap: $\mu \pm \sigma$ are the inflection points, the bell's
      shoulders, and the curve is still well above half height there.
    expects: "9.4192"
    tolerance: 0.0005
    rubric:
      - >
        Works with the ratio $f(x)/f(\mu)$ so that $1/(\sigma\sqrt{2\pi})$
        cancels, rather than evaluating two densities.
      - >
        Doubles the half-width, reporting the distance between the two points
        and not $\sigma\sqrt{2\ln 2}$ alone.
      - >
        Does not confuse the half-height points with the inflection points at
        $\mu \pm \sigma$.
    targets:
      - quant-probability.continuous.normal

  - id: qcont-normal-02
    kind: work
    difficulty: standard
    statement: >
      The density of $X \sim \mathcal{N}(\mu,\sigma^{2})$ takes the same value
      at $x = 2$ and at $x = 14$, and $\Pr(X < 5) = 0.20$. What is
      $\Pr(X > 11)$?
    answer: >
      $0.20$. The density is symmetric about $\mu$ and strictly decreasing as
      you move away from it, so two distinct points can share a density value
      only by straddling the mean at equal distance: $\mu = (2+14)/2 = 8$. Now
      $5$ and $11$ are themselves equidistant from $8$, three units either
      side, so the lower tail below $5$ and the upper tail above $11$ are
      mirror images and carry equal mass: $\Pr(X > 11) = \Pr(X < 5) = 0.20$.
      No value of $\sigma$ is needed, and none can be recovered from what is
      given — reaching for $(x-\mu)/\sigma$ here stalls on an unknown, which is
      exactly the trap. Symmetry settles it outright.
    expects: "0.2"
    rubric:
      - >
        Places $\mu$ at the midpoint of the two points sharing a density value.
      - >
        Matches $5$ and $11$ as mirror images about $\mu$ and transfers the
        tail probability without standardizing.
    targets:
      - quant-probability.continuous.normal

  - id: qcont-normal-03
    kind: decide
    difficulty: standard
    statement: >
      A desk models daily returns as $\mathcal{N}(0,\sigma^{2})$, with $\sigma$
      fitted to a decade of data — roughly $2500$ trading days — and finds that
      three of those days moved by more than $5\sigma$. Use
      $\Pr(|Z| > 5) = 5.7 \times 10^{-7}$. Which reading of the mismatch is
      correct?
    answer: >
      The returns are not normal. Under the fitted model the expected number of
      $5\sigma$ days in $2500$ is $2500 \times 5.7 \times 10^{-7} \approx
      0.0014$ — about one such decade in $700$. Observing
      three is not an unlucky draw from the model but evidence against it. The
      cause is structural: the normal density decays like $e^{-x^{2}/2}$,
      faster than any exponential, so it assigns almost nothing beyond four or
      five sigma, while real return series deliver such days regularly. That
      gap between assumed and realised tail weight is the standard critique of
      normal-return models, and it is why tail risk is priced with fatter-tailed
      laws rather than by nudging $\sigma$ upward.
    choices:
      - text: >
          The returns are not normal — the model expects about $0.0014$ such
          days in $2500$, so three is decisive evidence against it.
        correct: true
        feedback: >
          $2500 \times 5.7 \times 10^{-7} \approx 0.0014$: the observed count
          is off by a factor near two thousand, which no reasonable fit
          absorbs.
      - text: >
          Nothing is wrong — $\sigma$ was estimated from the same data, and
          estimation error alone accounts for three $5\sigma$ days.
        feedback: >
          Estimation error moves $\sigma$ by a few percent. Because the tail
          decays like $e^{-x^{2}/2}$, a few percent in $\sigma$ changes the
          expected count by a factor near one, not by the factor of two
          thousand required.
      - text: >
          $\Phi$ has no elementary closed form, so a $5\sigma$ probability
          cannot be pinned down and the comparison means nothing.
        feedback: >
          No closed form is not the same as not computable: $\Phi(5)$ is known
          to many digits, and the statement hands you the value.
      - text: >
          The normal is asymmetric far out in the tail, so gains and losses
          have to be counted separately before comparing.
        feedback: >
          The density satisfies $f(\mu+x) = f(\mu-x)$ everywhere, so the two
          tails are exact mirrors; the two-sided figure already counts both.
    rubric:
      - >
        Converts the quoted tail probability into an expected count over
        $2500$ days before judging the model.
      - >
        Attributes the mismatch to the $e^{-x^{2}/2}$ tail decay rather than to
        arithmetic uncertainty or to a mis-estimated $\sigma$.
    targets:
      - quant-probability.continuous.normal

  # --- why the constant is what it is ----------------------------------------

  - id: qcont-normal-normalization-01
    kind: work
    difficulty: demanding
    statement: >
      Evaluate $\int_{-\infty}^{\infty} e^{-3x^{2}}\,dx$. Use
      $\sqrt{\pi} = 1.7725$ and $\sqrt{3} = 1.7321$, and give four decimal
      places.
    answer: >
      $\approx 1.0233$. Do not hunt for an antiderivative — $e^{-3x^{2}}$ has
      none in elementary terms, which is precisely why the normal's constant is
      established by a trick rather than by integration. Match the integrand to
      a normal density instead: $e^{-x^{2}/(2\sigma^{2})}$ is $e^{-3x^{2}}$
      when $2\sigma^{2} = 1/3$, so $\sigma = 1/\sqrt{6}$. Since the density
      $\frac{1}{\sigma\sqrt{2\pi}}e^{-x^{2}/(2\sigma^{2})}$ integrates to $1$,
      the bare exponential integrates to $\sigma\sqrt{2\pi} = \sqrt{2\pi/6}
      = \sqrt{\pi/3} = 1.7725/1.7321 = 1.0233$. Reading $\sigma^{2} = 1/3$
      instead of $2\sigma^{2} = 1/3$ is the slip; it returns $\sqrt{2\pi/3}
      = 1.4472$, too large by exactly $\sqrt{2}$.
    expects: "1.0233"
    tolerance: 0.0005
    rubric:
      - >
        Matches the exponent to $-x^{2}/(2\sigma^{2})$, keeping the factor of
        $2$, rather than reading the coefficient as $1/\sigma^{2}$.
      - >
        Recovers the integral as $\sigma\sqrt{2\pi}$ from the fact that the
        normalized density integrates to $1$.
    targets:
      - quant-probability.continuous.normal-normalization
    exercises:
      - quant-tools.series-calculus.gaussian-integral

  - id: qcont-normal-normalization-02
    kind: work
    difficulty: standard
    statement: >
      A random variable has density $f(x) = c\,\exp(-(x-5)^{2}/18)$ for all
      real $x$. What is $c$? Use $\sqrt{2\pi} = 2.5066$ and give four decimal
      places.
    answer: >
      $\approx 0.1330$. The constant is not a free choice: it is whatever makes
      the density integrate to $1$, and matching the exponent against the
      normal's $-(x-\mu)^{2}/(2\sigma^{2})$ fixes it. Here $2\sigma^{2} = 18$,
      so $\sigma^{2} = 9$ and $\sigma = 3$ — the mean is $\mu = 5$, though this
      question never needs it — and therefore
      $c = 1/(\sigma\sqrt{2\pi}) = 1/(3 \times 2.5066) = 0.1330$. Reading the
      denominator as $\sigma^{2} = 18$, hence $\sigma = 4.2426$, is the
      standard slip and returns $0.0940$. The factor of $2$ inside the exponent
      is the only thing separating the two answers.
    expects: "0.1330"
    tolerance: 0.0005
    rubric:
      - >
        Solves $2\sigma^{2} = 18$ for $\sigma = 3$ rather than taking
        $\sigma^{2} = 18$.
      - >
        Reports $1/(\sigma\sqrt{2\pi})$, the constant forced by normalization,
        not $1/\sqrt{2\pi}$ alone.
    targets:
      - quant-probability.continuous.normal-normalization

  # --- standardizing ---------------------------------------------------------

  - id: qcont-standardization-01
    kind: work
    difficulty: demanding
    statement: >
      A machine's cycle time is normally distributed. It exceeds $95$ seconds
      on $2.28\%$ of cycles and falls below $50$ seconds on $15.87\%$. What is
      the mean cycle time, in seconds? Use $\Phi(1) = 0.8413$ and
      $\Phi(2) = 0.9772$.
    answer: >
      $65$ seconds. Turn each percentage into a signed $z$ before touching the
      unknowns. $\Pr(X > 95) = 0.0228 = 1 - \Phi(2)$ puts $95$ two standard
      deviations above the mean, so $95 = \mu + 2\sigma$; and
      $\Pr(X < 50) = 0.1587 = 1 - \Phi(1) = \Phi(-1)$ puts $50$ one standard
      deviation below, so $50 = \mu - \sigma$. Subtracting the second from the
      first, $45 = 3\sigma$, so $\sigma = 15$ and $\mu = 50 + 15 = 65$. Check:
      $(95-65)/15 = 2$ and $(50-65)/15 = -1$. The trap is reading $0.1587$ as
      $z = +1$ because $\Phi(1) = 0.8413$ is the memorized number — a
      probability below one half sits *below* the mean, and that sign is the
      whole problem.
    expects: "65"
    rubric:
      - >
        Converts both tail probabilities into signed $z$ values, using
        $\Phi(-z) = 1 - \Phi(z)$ for the lower one.
      - >
        Solves the two linear equations for $\sigma$ first and then $\mu$,
        rather than assuming either.
    targets:
      - quant-probability.continuous.standardization

  - id: qcont-standardization-02
    kind: work
    difficulty: standard
    statement: >
      Delivery times are $\mathcal{N}(45, 64)$ minutes and the shop promises
      delivery between $33$ and $61$ minutes. What fraction of deliveries keeps
      the promise? Use $\Phi(1.5) = 0.9332$ and $\Phi(2) = 0.9772$.
    answer: >
      $\approx 0.9104$. The second parameter is the variance, so $\sigma = 8$ —
      take the square root before standardizing, since dividing by $64$ is the
      most common slip in this move. The endpoints become
      $z_1 = (33-45)/8 = -1.5$ and $z_2 = (61-45)/8 = 2$, so the answer is
      $\Phi(2) - \Phi(-1.5)$. Symmetry supplies the negative argument:
      $\Phi(-1.5) = 1 - \Phi(1.5) = 1 - 0.9332 = 0.0668$, hence
      $0.9772 - 0.0668 = 0.9104$. Adding the two $\Phi$ values, or writing
      $\Phi(-1.5) = -0.9332$, are the two ways this goes wrong, and both are
      caught by asking whether the result lies in $[0,1]$.
    expects: "0.9104"
    tolerance: 0.0005
    rubric:
      - >
        Standardizes with $\sigma = 8$, the square root of the stated variance.
      - >
        Uses $\Phi(-z) = 1 - \Phi(z)$ for the lower endpoint and subtracts the
        two CDF values.
    targets:
      - quant-probability.continuous.standardization

  # --- the sigma table -------------------------------------------------------

  - id: qcont-empirical-rule-01
    kind: work
    difficulty: demanding
    statement: >
      A filling machine's bag weights are $\mathcal{N}(500, 4)$ grams. Quality
      control rejects any bag lying outside the interval centred on $500$ that
      holds $99\%$ of production. What is the upper reject threshold, in grams?
    answer: >
      $\approx 505.15$ grams. Two conversions, in this order. The second
      parameter is the variance, so $\sigma = 2$ grams. A centred interval
      holding $99\%$ leaves $0.5\%$ in each tail, so its half-width is the
      *two-sided* $99\%$ cutoff $z = 2.576$ — not the one-tailed $1\%$ cutoff
      $2.33$. The threshold is $500 + 2.576(2) = 505.152$ grams. Confusing the
      two cutoffs is what this tests: $2.33$ gives $504.66$, which rejects
      about $1\%$ of bags on the high side alone and $2\%$ overall, twice the
      intended rate, while the $95\%$ cutoff $1.96$ gives $503.92$ and is
      further off still. Recalling the cutoff as $2.58$ rather than $2.576$
      shifts the threshold by under a hundredth of a gram and is fine.
    expects: "505.152"
    tolerance: 0.01
    rubric:
      - >
        Splits the $1\%$ outside the interval into two tails and reaches for
        the two-sided cutoff $2.576$, not the one-tailed $2.33$.
      - >
        Converts back to grams as $\mu + z\sigma$ with $\sigma = 2$, the square
        root of the variance.
    targets:
      - quant-probability.continuous.empirical-rule
    exercises:
      - quant-probability.continuous.standardization

  - id: qcont-empirical-rule-02
    kind: work
    difficulty: standard
    statement: >
      For $X \sim \mathcal{N}(\mu, \sigma^{2})$, what fraction of the
      distribution lies between $\mu + \sigma$ and $\mu + 2\sigma$? Use
      $\Pr(|X - \mu| \le \sigma) = 0.6827$ and
      $\Pr(|X - \mu| \le 2\sigma) = 0.9545$.
    answer: >
      $\approx 0.1359$. Both landmarks describe intervals centred on the mean,
      so their difference $0.9545 - 0.6827 = 0.2718$ is the mass in the two
      bands between one and two sigma — the one to the left of the mean *and*
      the one to the right. The question asks for a single band, so halve it:
      $0.2718/2 = 0.1359$. Reporting $0.2718$ is the trap, and a sanity check
      catches it at once: everything beyond $\mu + \sigma$ is only
      $(1 - 0.6827)/2 = 0.1587$, so no band inside that region can carry
      $0.27$. The same arithmetic gives $(0.9973 - 0.9545)/2 = 0.0214$ between
      two and three sigma.
    expects: "0.1359"
    tolerance: 0.0005
    rubric:
      - >
        Differences the two central masses to isolate the one-to-two-sigma
        region.
      - >
        Halves the difference, because the central bands are symmetric and only
        one side is asked for.
    targets:
      - quant-probability.continuous.empirical-rule

  # --- adding normals --------------------------------------------------------

  - id: qcont-normal-sums-01
    kind: work
    difficulty: demanding
    statement: >
      A desk's daily profit, in thousands of dollars, is iid
      $\mathcal{N}(50, 400)$ across days. Over $25$ trading days, what is the
      probability that the *average* daily profit comes in below $40$? Use
      $\Phi(2.5) = 0.9938$.
    answer: >
      $\approx 0.0062$. The average of iid normals is exactly normal, with no
      limit theorem needed: $\bar{X} \sim \mathcal{N}(\mu, \sigma^{2}/n)$. Here
      $\sigma = \sqrt{400} = 20$, so $\bar{X}$ has variance $400/25 = 16$ and
      standard deviation $4$ — the variance divides by $n$, which means the
      standard deviation divides by $\sqrt{n} = 5$. Standardizing,
      $z = (40-50)/4 = -2.5$, so the probability is
      $\Phi(-2.5) = 1 - \Phi(2.5) = 1 - 0.9938 = 0.0062$. Two errors are
      common: dividing $\sigma$ itself by $n = 25$, which gives a spread of
      $0.8$ and an absurdly tiny answer, and forgetting the averaging
      altogether, which uses $\sigma = 20$, $z = -0.5$ and returns about
      $0.31$.
    expects: "0.0062"
    tolerance: 0.0005
    rubric:
      - >
        Divides the variance by $n$, hence the standard deviation by
        $\sqrt{n}$, before standardizing.
      - >
        Uses the exact normality of the average rather than appealing to a
        limit theorem.
      - >
        Applies $\Phi(-z) = 1 - \Phi(z)$ for the lower tail.
    targets:
      - quant-probability.continuous.normal-sums
    exercises:
      - quant-probability.continuous.standardization

  - id: qcont-normal-sums-02
    kind: work
    difficulty: standard
    statement: >
      $X \sim \mathcal{N}(10, 12)$ and $Y \sim \mathcal{N}(4, 8)$ are
      independent. What is $\operatorname{Var}(X - 2Y)$?
    answer: >
      $44$. Coefficients enter the variance squared and the sign never
      survives: $\operatorname{Var}(aX + bY) = a^{2}\operatorname{Var}(X)
      + b^{2}\operatorname{Var}(Y)$ for independent $X$ and $Y$, the covariance
      cross-term being what independence kills. With $a = 1$ and $b = -2$ this
      is $1(12) + 4(8) = 12 + 32 = 44$, so the standard deviation is
      $\sqrt{44} \approx 6.63$ and $X - 2Y \sim \mathcal{N}(2, 44)$, since the
      means do subtract: $10 - 2(4) = 2$. The two traps are subtracting the
      variances, $12 - 32 = -20$, which is not even a legal variance, and
      forgetting to square the coefficient, $12 + 2(8) = 28$.
    expects: "44"
    rubric:
      - >
        Squares the coefficient $-2$, contributing $4\operatorname{Var}(Y)$.
      - >
        Adds the two contributions rather than subtracting them, the minus sign
        reaching the mean only.
    targets:
      - quant-probability.continuous.normal-sums

  # --- exponentiating a normal -----------------------------------------------

  - id: qcont-lognormal-01
    kind: work
    difficulty: demanding
    statement: >
      $Y = e^{X}$ with $X \sim \mathcal{N}(0,1)$. What is the density of $Y$ at
      $y = e$? Use $\varphi(1) = 0.2420$ and $e = 2.7183$, and give four
      decimal places.
    answer: >
      $\approx 0.0890$. A monotone change of variable carries a Jacobian:
      $y = e^{x}$ inverts to $x = \ln y$ with $dx/dy = 1/y$, so
      $f_Y(y) = f_X(\ln y)\,/\,y$, which is the lognormal density
      $\frac{1}{y\sigma\sqrt{2\pi}}\exp(-(\ln y - \mu)^{2}/(2\sigma^{2}))$. At
      $y = e$ we have $\ln y = 1$, so
      $f_Y(e) = \varphi(1)/e = 0.2420/2.7183 = 0.0890$. Reporting $0.2420$ — the
      normal density at the matching point — is the trap: it ignores the
      $1/y$ factor, and the whole difference between the two densities is that
      factor. It also fails a check, since $f_Y$ must integrate to $1$ over a
      support stretched out by exponentiation, so its values run smaller out
      here.
    expects: "0.0890"
    tolerance: 0.0005
    rubric:
      - >
        Applies the change-of-variables formula with the Jacobian $1/y$ rather
        than reading off $\varphi(\ln y)$ alone.
      - >
        Evaluates the normal factor at $\ln y = 1$, not at $y = e$.
    targets:
      - quant-probability.continuous.lognormal
      - quant-probability.random-variables.transformation
    exercises:
      - quant-probability.continuous.normal
    connects:
      - "quant-probability.continuous.lognormal ~ quant-probability.random-variables.transformation"

  - id: qcont-lognormal-02
    kind: work
    difficulty: standard
    statement: >
      A lognormal $Y$ has mean $1.2$ and median $1$. What is $\sigma$, the
      standard deviation of $\ln Y$? Use $\ln 1.2 = 0.1823$ and give four
      decimal places.
    answer: >
      $\approx 0.6038$. Read the two facts in the right order. The median is
      $e^{\mu}$, because exponentiation is monotone and so commutes with
      quantiles; $e^{\mu} = 1$ gives $\mu = 0$. The mean is
      $e^{\mu + \sigma^{2}/2}$, which with $\mu = 0$ is $e^{\sigma^{2}/2}
      = 1.2$, so $\sigma^{2} = 2\ln 1.2 = 0.3646$ and
      $\sigma = \sqrt{0.3646} = 0.6038$. Note the ratio of mean to median is
      $e^{\sigma^{2}/2}$ whatever $\mu$ is, so the spread of the log is
      recoverable from that ratio alone — a convexity gap, since $e^{x}$ is
      convex and $\mathbb{E}[e^{X}] > e^{\mathbb{E}[X]}$ for any $X$ with
      spread. Stopping at $0.3646$ reports the variance where a standard
      deviation was asked for.
    expects: "0.6038"
    tolerance: 0.0005
    rubric:
      - >
        Uses the median $e^{\mu}$ to fix $\mu = 0$ before touching the mean.
      - >
        Solves $e^{\sigma^{2}/2} = 1.2$ and takes the square root, reporting
        $\sigma$ rather than $\sigma^{2}$.
    targets:
      - quant-probability.continuous.lognormal

  # --- squaring and summing normals ------------------------------------------

  - id: qcont-chi-square-01
    kind: work
    difficulty: demanding
    statement: >
      $(Z_1, Z_2)$ has independent standard normal coordinates. What is the
      probability the point lands between $1$ and $2$ units from the origin?
      Use $e^{-0.5} = 0.6065$ and $e^{-2} = 0.1353$.
    answer: >
      $\approx 0.4712$. Work with the squared distance, because that is what
      has a name: $R^{2} = Z_1^{2} + Z_2^{2}$ is $\chi^{2}_{2}$, which is
      $\operatorname{Gamma}(1, 1/2)$, which is exactly
      $\operatorname{Exp}(1/2)$. So the survival function is
      $\Pr(R^{2} > t) = e^{-t/2}$, and the annulus is a difference of two
      tails: $\Pr(1 < R < 2) = \Pr(1 < R^{2} < 4)
      = e^{-1/2} - e^{-4/2} = 0.6065 - 0.1353 = 0.4712$. The trap is feeding
      the radii into the exponential instead of their squares, giving
      $e^{-0.5} - e^{-1} = 0.6065 - 0.3679 = 0.2386$; the exponential law lives
      on $R^{2}$, not on $R$, which is itself Rayleigh.
    expects: "0.4712"
    tolerance: 0.0005
    rubric:
      - >
        Identifies $Z_1^{2} + Z_2^{2}$ as $\chi^{2}_{2} =
        \operatorname{Exp}(1/2)$ rather than integrating a bivariate density.
      - >
        Squares both radii before applying the survival function $e^{-t/2}$.
      - >
        Takes a difference of two tails for the annulus.
    targets:
      - quant-probability.continuous.chi-square
    exercises:
      - quant-probability.continuous.exponential

  - id: qcont-chi-square-02
    kind: work
    difficulty: standard
    statement: >
      $Q = Z_1^{2} + \dots + Z_5^{2}$ with $Z_1, \dots, Z_5$ iid standard
      normal. What is $\mathbb{E}[Q^{2}]$?
    answer: >
      $35$. Do not attempt the fourth moments of five variables directly; go
      through the variance. A chi-square with $k$ degrees of freedom has
      $\mathbb{E}[Q] = k$ and $\operatorname{Var}(Q) = 2k$, since each squared
      standard normal contributes mean $\mathbb{E}[Z^{2}] = 1$ and variance
      $\mathbb{E}[Z^{4}] - 1 = 3 - 1 = 2$, and both add over the independent
      terms. With $k = 5$ that is $\mathbb{E}[Q] = 5$ and
      $\operatorname{Var}(Q) = 10$, so
      $\mathbb{E}[Q^{2}] = \operatorname{Var}(Q) + (\mathbb{E}[Q])^{2}
      = 10 + 25 = 35$. Answering $25$ is the trap — that is
      $(\mathbb{E}[Q])^{2}$, and the variance is exactly the gap that
      $\mathbb{E}[Q^{2}] \ne (\mathbb{E}[Q])^{2}$ measures.
    expects: "35"
    rubric:
      - >
        Uses $\mathbb{E}[Q] = k$ and $\operatorname{Var}(Q) = 2k$ for
        $k = 5$.
      - >
        Recovers the second moment as $\operatorname{Var}(Q) +
        (\mathbb{E}[Q])^{2}$ rather than squaring the mean.
    targets:
      - quant-probability.continuous.chi-square

  # --- dividing normals ------------------------------------------------------

  - id: qcont-cauchy-01
    kind: work
    difficulty: demanding
    statement: >
      $Z_1$ and $Z_2$ are independent standard normals. What is
      $\Pr(Z_1/Z_2 > 1)$?
    answer: >
      $1/4$. The ratio of two independent standard normals is standard Cauchy,
      with CDF $1/2 + \arctan(x)/\pi$. At $x = 1$, $\arctan 1 = \pi/4$, so
      $\Pr(C \le 1) = 1/2 + 1/4 = 3/4$ and the answer is $1 - 3/4 = 1/4$ —
      which is just the statement that $\pm 1$ are the quartiles of the Cauchy.
      Answering $1/2$ is the trap: symmetry gives $\Pr(Z_1/Z_2 > 0) = 1/2$, not
      $\Pr(> 1)$, and the extra requirement that the numerator beat the
      denominator in magnitude costs exactly a quarter. A check with no Cauchy
      at all: $\{|Z_1| > |Z_2|\}$ has probability $1/2$ by exchangeability, and
      half of those cases have the ratio negative, leaving $1/4$.
    expects: "1/4"
    tolerance: 0.0005
    rubric:
      - >
        Recognises the ratio of independent standard normals as standard
        Cauchy.
      - >
        Uses $\arctan 1 = \pi/4$, or the quartiles $\pm 1$, rather than
        answering $1/2$ from symmetry alone.
    targets:
      - quant-probability.continuous.cauchy

  - id: qcont-cauchy-02
    kind: work
    difficulty: standard
    statement: >
      $X_1, \dots, X_{100}$ are iid standard Cauchy and $\bar{X}$ is their
      average. What is $\Pr(|\bar{X}| > 1)$?
    answer: >
      $1/2$. Averaging buys nothing here: the average of $n$ iid standard
      Cauchy variables is again *exactly* standard Cauchy, for every $n$, so
      $\bar{X}$ has the same law as $X_1$ and the sample size is a red herring.
      The quartiles of the standard Cauchy are $\pm 1$, so half the mass lies
      beyond distance $1$ from the centre: $\Pr(|\bar{X}| > 1) = 1/2$, the same
      answer as for a single draw. The trap is Gaussian instinct — expecting
      the spread to shrink like $1/\sqrt{100}$ and the probability to collapse
      towards $0$. That reasoning needs a finite mean to converge to, and the
      Cauchy has none, so the law of large numbers simply does not apply.
    expects: "1/2"
    tolerance: 0.0005
    rubric:
      - >
        Uses the exact stability of the Cauchy under averaging, so $\bar{X}$ is
        standard Cauchy whatever $n$ is.
      - >
        Reads $\Pr(|X| > 1) = 1/2$ off the quartiles at $\pm 1$.
      - >
        Does not shrink the spread by $1/\sqrt{n}$ — no finite mean, no law of
        large numbers.
    targets:
      - quant-probability.continuous.cauchy
