# Problems targeting quant-probability.expectation.
#
# Authored mastery-first (§6.7) like the foundations file: every node carries a
# `demanding` problem so `masterySet(for:)` opens with one. This unit is where
# typed answers earn the most — nearly every question here ends in a number.

problems:
  # --- the mean --------------------------------------------------------------

  - id: qexp-expectation-01
    kind: work
    difficulty: demanding
    statement: >
      A game costs $c$ dollars to enter. You roll a fair die; if it shows $6$ you
      are paid $30$ dollars, and otherwise nothing. What entry price $c$ makes
      the game fair, in dollars?
    answer: >
      $5$. The payoff is $30$ with probability $1/6$ and $0$ otherwise, so the
      expected payoff is $30/6 = 5$. A fair price is the one that makes the
      expected profit zero, so $c = 5$. Note the price is not a value the payoff
      can take — you never receive $5$ dollars — which is the standing reminder
      that a mean is a long-run average and not a forecast of any single play.
    expects: "5"
    rubric:
      - >
        Computes the expected payoff before comparing it to a price.
      - >
        States fairness as zero expected profit rather than as a guarantee about
        any single play.
    targets:
      - quant-probability.expectation.expectation

  - id: qexp-expectation-02
    kind: work
    difficulty: standard
    statement: >
      $X$ takes the value $-4$ with probability $0.25$, $0$ with probability
      $0.5$, and $8$ with probability $0.25$. What is $\mathbb{E}[X]$?
    answer: >
      $1$. The weighted sum is $0.25(-4) + 0.5(0) + 0.25(8) = -1 + 0 + 2 = 1$.
      The weights are a probability distribution — they sum to $1$ — which is
      the first thing to check before averaging anything.
    expects: "1"
    rubric:
      - >
        Checks that the three probabilities sum to $1$.
      - >
        Carries the sign of the negative value through the weighting.
    targets:
      - quant-probability.expectation.expectation

  # --- when the mean fails to exist ------------------------------------------

  - id: qexp-nonexistence-01
    kind: decide
    difficulty: demanding
    statement: >
      $X$ has the Cauchy density $f(x) = 1/(\pi(1 + x^{2}))$, which is symmetric
      about $0$. What is $\mathbb{E}[X]$?
    answer: >
      Undefined. Both the positive and the negative part have infinite mean:
      $\int_{0}^{\infty} x/(\pi(1+x^{2}))\,dx$ diverges logarithmically, and by
      symmetry so does the negative side. The mean would have to be
      $\infty - \infty$, which has no value. Symmetry is not enough to rescue
      it — a symmetric assignment of $0$ would depend on the order of
      integration, and the order of the outcomes is not part of the data. The
      empirical signature is that sample averages of Cauchy draws never settle:
      they keep being dragged by fresh extremes.
    choices:
      - text: >
          $0$, by symmetry
        feedback: >
          Symmetry would give $0$ only if the mean existed. Both tails have
          infinite mass, so there is nothing for symmetry to act on.
      - text: >
          Undefined
        correct: true
        feedback: >
          Both parts diverge, so the mean would have to be $\infty - \infty$.
      - text: >
          $+\infty$
        feedback: >
          That is the verdict when only the positive part diverges. Here the
          negative part diverges too.
    rubric:
      - >
        Distinguishes undefined from infinite, and says which regime this is.
      - >
        Explains why symmetry does not supply a value.
    targets:
      - quant-probability.expectation.nonexistence
    exercises:
      - quant-probability.expectation.expectation

  - id: qexp-nonexistence-02
    kind: decide
    difficulty: standard
    statement: >
      $X \ge 0$ and the sum $\sum_x x\,p(x)$ diverges. Is $\mathbb{E}[X]$
      infinite or undefined?
    answer: >
      Infinite — $+\infty$ is a legitimate value here. A nonnegative variable has
      no negative part to cancel against, so the divergence has an unambiguous
      direction and the mean always exists in $[0, \infty]$. Undefined is
      reserved for the case where both parts diverge and the difference has no
      value.
    choices:
      - text: >
          Undefined — a divergent sum has no value
        feedback: >
          Divergence to $+\infty$ is a value in the extended sense, and
          nonnegativity is what makes the direction unambiguous.
      - text: >
          Infinite, and that is a legitimate answer
        correct: true
        feedback: >
          For $X \ge 0$ the mean always exists in $[0, \infty]$.
    rubric:
      - >
        Uses nonnegativity to rule out the $\infty - \infty$ case.
      - >
        Names $[0, \infty]$ as the range in which the mean always exists.
    targets:
      - quant-probability.expectation.nonexistence
    exercises:
      - quant-probability.expectation.expectation

  # --- order and bounds ------------------------------------------------------

  - id: qexp-monotonicity-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is the number of heads in $10$ fair tosses and $Y = \min(X, 3)$. Give
      an upper bound for $\mathbb{E}[Y]$ that follows from monotonicity alone,
      without computing the distribution of $Y$.
    answer: >
      $3$. Since $Y \le 3$ pointwise, the range bound gives
      $\mathbb{E}[Y] \le 3$. Monotonicity also gives the other side —
      $Y \le X$ pointwise, so $\mathbb{E}[Y] \le \mathbb{E}[X] = 5$ — but $3$ is
      the sharper of the two, and neither required knowing the law of $Y$. The
      true value is about $2.83$, so the bound is close as well as free.
    expects: "3"
    rubric:
      - >
        Uses a pointwise inequality, valid outcome by outcome, rather than an
        inequality between the two means asserted directly.
      - >
        Identifies $3$ as the sharper of the two available bounds.
    targets:
      - quant-probability.expectation.monotonicity
    exercises:
      - quant-probability.expectation.expectation

  - id: qexp-monotonicity-02
    kind: work
    difficulty: standard
    statement: >
      $X$ satisfies $2 \le X \le 9$ with probability $1$. What is the largest
      value $\mathbb{E}[X]$ can take?
    answer: >
      $9$, attained when $X = 9$ with probability $1$. The range bound
      $a \le X \le b \Rightarrow a \le \mathbb{E}[X] \le b$ is immediate from
      monotonicity applied to the constant variables $a$ and $b$, and it is the
      cheapest sanity check available on any expectation.
    expects: "9"
    rubric:
      - >
        Derives the range bound from monotonicity against constants rather than
        quoting it.
      - >
        Notes that the bound is attained, so it cannot be improved.
    targets:
      - quant-probability.expectation.monotonicity
    exercises:
      - quant-probability.expectation.expectation

  # --- LOTUS -----------------------------------------------------------------

  - id: qexp-lotus-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is uniform on $\{1, 2, 3, 4\}$. What is $\mathbb{E}[1/X]$? Give four
      decimal places.
    answer: >
      $\approx 0.5208$. By LOTUS the law of $1/X$ is never needed:
      $\mathbb{E}[1/X] = \tfrac{1}{4}(1 + \tfrac{1}{2} + \tfrac{1}{3} +
      \tfrac{1}{4}) = \tfrac{25}{48} \approx 0.5208$. Compare
      $1/\mathbb{E}[X] = 1/2.5 = 0.4$: the two differ because $1/x$ is convex,
      and Jensen's inequality says the LOTUS value must be the larger one.
      Substituting the mean into a nonlinear function is the error this problem
      exists to catch.
    expects: "0.5208"
    tolerance: 0.0005
    rubric:
      - >
        Averages $1/x$ over the four values rather than inverting the mean.
      - >
        Says why the two disagree, and in which direction convexity sends the
        difference.
    targets:
      - quant-probability.expectation.lotus
    exercises:
      - quant-probability.expectation.expectation

  - id: qexp-lotus-02
    kind: work
    difficulty: standard
    statement: >
      For one roll of a fair die, what is $\mathbb{E}[X^{2}] - (\mathbb{E}[X])^{2}$?
      Give four decimal places.
    answer: >
      $\approx 2.9167$. LOTUS gives
      $\mathbb{E}[X^{2}] = (1+4+9+16+25+36)/6 = 91/6 \approx 15.1667$, and
      $(\mathbb{E}[X])^{2} = 3.5^{2} = 12.25$, so the difference is
      $35/12 \approx 2.9167$. That difference is the die's variance, which is no
      coincidence — it is the computational form of the definition.
    expects: "2.9167"
    tolerance: 0.0005
    rubric:
      - >
        Uses LOTUS for the second moment rather than finding the law of
        $X^{2}$.
      - >
        Recognises the difference as the variance.
    targets:
      - quant-probability.expectation.lotus
    exercises:
      - quant-probability.expectation.expectation

  # --- linearity -------------------------------------------------------------

  - id: qexp-linearity-01
    kind: work
    difficulty: demanding
    statement: >
      Five cards are dealt from a standard $52$-card deck. What is the expected
      number of aces in the hand? Give four decimal places.
    answer: >
      $\approx 0.3846$. Put one indicator on each of the five positions: by
      symmetry each holds an ace with probability $4/52 = 1/13$, so the expected
      count is $5/13 \approx 0.3846$. The positions are dependent — the cards
      are drawn without replacement — and linearity does not require
      independence, which is the entire point. The hypergeometric distribution
      of the count is never needed.
    expects: "0.3846"
    tolerance: 0.0005
    rubric:
      - >
        Decomposes the count into indicators before computing anything.
      - >
        States explicitly that linearity holds despite the dependence induced by
        drawing without replacement.
    targets:
      - quant-probability.expectation.linearity
    exercises:
      - quant-probability.expectation.expectation

  - id: qexp-linearity-02
    kind: work
    difficulty: standard
    statement: >
      $X$ and $Y$ are dependent, with $\mathbb{E}[X] = 2$ and
      $\mathbb{E}[Y] = 5$. What is $\mathbb{E}[3X - Y + 4]$?
    answer: >
      $5$. Linearity applies term by term regardless of the dependence:
      $3(2) - 5 + 4 = 5$. No joint distribution is needed, and none would help.
      The contrast worth holding: $\mathbb{E}[XY]$ cannot be computed from these
      two numbers at all, because products need independence or a covariance.
    expects: "5"
    rubric:
      - >
        Applies the coefficients and the constant correctly.
      - >
        Notes that the same data would not determine $\mathbb{E}[XY]$.
    targets:
      - quant-probability.expectation.linearity
    exercises:
      - quant-probability.expectation.expectation

  # --- indicators ------------------------------------------------------------

  - id: qexp-indicator-expectation-01
    kind: work
    difficulty: demanding
    statement: >
      $A$ and $B$ are events with $\Pr(A) = 0.5$, $\Pr(B) = 0.4$ and
      $\Pr(A \cap B) = 0.3$. Let
      $Z = \mathbf{1}\{A\} + \mathbf{1}\{B\}$. What is $\mathbb{E}[Z^{2}]$?
    answer: >
      $1.5$. Expand: $Z^{2} = \mathbf{1}\{A\}^{2} + 2\mathbf{1}\{A\}\mathbf{1}\{B\}
      + \mathbf{1}\{B\}^{2}$. Indicators are idempotent, so the outer terms are
      just $\mathbf{1}\{A\}$ and $\mathbf{1}\{B\}$, and the product of two
      indicators is the indicator of the intersection. Taking expectations,
      $\mathbb{E}[Z^{2}] = \Pr(A) + 2\Pr(A \cap B) + \Pr(B) = 0.5 + 0.6 + 0.4 =
      1.5$. Note $(\mathbb{E}[Z])^{2} = 0.81$, so $Z$ has variance $0.69$.
    expects: "1.5"
    rubric:
      - >
        Uses idempotence to collapse the squared indicators.
      - >
        Identifies the cross-term as the indicator of $A \cap B$, and keeps the
        factor of $2$.
    targets:
      - quant-probability.expectation.indicator-expectation
    exercises:
      - quant-probability.expectation.expectation

  - id: qexp-indicator-expectation-02
    kind: work
    difficulty: standard
    statement: >
      For which value of $\Pr(A)$ is the variance of $\mathbf{1}\{A\}$ largest?
    answer: >
      $1/2$. The variance is $\Pr(A)(1 - \Pr(A))$, a downward parabola in
      $\Pr(A)$ with its maximum at $1/2$, where the value is $1/4$. Maximum
      uncertainty sits at even odds — the same shape entropy has, and the reason
      a $50$–$50$ event is the most expensive thing to be wrong about.
    expects: "0.5"
    rubric:
      - >
        Derives the variance as $p(1-p)$ using idempotence.
      - >
        Maximises correctly and reports the maximal value $1/4$ as well as the
        location.
    targets:
      - quant-probability.expectation.indicator-expectation
    exercises:
      - quant-probability.expectation.expectation

  - id: qexp-indicator-trick-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed $100$ times. What is the expected number of positions
      $i$ at which tosses $i$, $i+1$ and $i+2$ all show heads?
    answer: >
      $12.25$. There are $98$ starting positions for a window of three, and each
      window is $HHH$ with probability $1/8$, so the expected count is
      $98/8 = 12.25$. The windows overlap heavily and are strongly dependent —
      $HHHH$ contributes two — but linearity never asks. The position count is
      where this goes wrong: $100$ tosses give $98$ windows of length $3$, not
      $100$ and not $97$.
    expects: "12.25"
    rubric:
      - >
        Counts $n - 2 = 98$ windows, not $n$ or $n - 3$.
      - >
        Applies linearity across dependent indicators and says so explicitly.
    targets:
      - quant-probability.expectation.indicator-trick
    exercises:
      - quant-probability.expectation.linearity
      - quant-probability.expectation.indicator-expectation

  - id: qexp-indicator-trick-02
    kind: work
    difficulty: standard
    statement: >
      A fair die is rolled $60$ times. What is the expected number of rolls
      showing a six?
    answer: >
      $10$. One indicator per roll, each with probability $1/6$, so the expected
      count is $60/6 = 10$. Here the indicators happen to be independent, which
      changes nothing about the computation — the identical argument would hold
      for rolls rigged to be dependent, and that robustness is the point.
    expects: "10"
    rubric:
      - >
        Decomposes into indicators rather than reaching for the binomial mean.
      - >
        Notes that independence was not used.
    targets:
      - quant-probability.expectation.indicator-trick
    exercises:
      - quant-probability.expectation.linearity
      - quant-probability.expectation.indicator-expectation

  # --- classic indicator problems --------------------------------------------

  - id: qexp-fixed-points-01
    kind: work
    difficulty: demanding
    statement: >
      $n$ hats are returned to $n$ people uniformly at random and $N$ is the
      number of people who get their own hat. For $n = 7$, what is
      $\mathbb{E}[N^{2}]$?
    answer: >
      $2$. Write $N = \sum_i \mathbf{1}\{A_i\}$ with
      $\Pr(A_i) = 1/n$, so $\mathbb{E}[N] = 1$. For the second moment count
      ordered pairs: there are $n(n-1)$ pairs $i \ne j$, each with
      $\Pr(A_i \cap A_j) = \dfrac{1}{n(n-1)}$, so
      $\mathbb{E}[N(N-1)] = 1$ and hence
      $\mathbb{E}[N^{2}] = \mathbb{E}[N(N-1)] + \mathbb{E}[N] = 2$. Both answers
      are free of $n$ — mean $1$ and variance $1$ for every size, the Poisson
      signature the count converges to.
    expects: "2"
    rubric:
      - >
        Computes $\Pr(A_i \cap A_j) = 1/(n(n-1))$ rather than $1/n^{2}$.
      - >
        Recovers $\mathbb{E}[N^{2}]$ from the factorial moment by adding
        $\mathbb{E}[N]$ back.
      - >
        Notices the answer does not depend on $n$.
    targets:
      - quant-probability.expectation.fixed-points
    exercises:
      - quant-probability.expectation.indicator-trick

  - id: qexp-fixed-points-02
    kind: work
    difficulty: standard
    statement: >
      $52$ cards are shuffled and dealt one at a time while you count
      $1, 2, \dots, 52$ aloud. What is the expected number of positions where the
      card's rank-and-suit index matches the number you say?
    answer: >
      $1$. This is the hat-check problem with $n = 52$: one indicator per
      position, each matching with probability $1/52$, so the expected number of
      matches is $52 \cdot (1/52) = 1$. The $n$ cancels, so the answer is $1$ for
      a deck of any size — which is why the game stays interesting no matter how
      many cards you use.
    expects: "1"
    rubric:
      - >
        Recognises the problem as a uniformly random permutation.
      - >
        Notes the cancellation, so the answer is independent of the deck size.
    targets:
      - quant-probability.expectation.fixed-points
    exercises:
      - quant-probability.expectation.indicator-trick

  - id: qexp-birthday-pairs-01
    kind: work
    difficulty: demanding
    statement: >
      How many people must be in a room, at minimum, for the expected number of
      birthday-sharing pairs to be at least $1$? Assume $365$ equally likely
      birthdays and no twins.
    answer: >
      $28$. With $n$ people the expected number of sharing pairs is
      $\binom{n}{2}/365 = n(n-1)/730$, and we need $n(n-1) \ge 730$. At
      $n = 27$, $n(n-1) = 702 < 730$; at $n = 28$, $756 \ge 730$. So $28$. Note
      this is a different threshold from the familiar $23$, which is where the
      probability of at least one shared birthday first exceeds $1/2$ — an
      expected count and a probability are different quantities, and this problem
      is built to separate them.
    expects: "28"
    rubric:
      - >
        Uses $\binom{n}{2}$ pairs, not $n$.
      - >
        Solves the inequality and checks the boundary at $n = 27$ rather than
        rounding a real-valued root.
      - >
        Distinguishes this threshold from the classic $23$.
    targets:
      - quant-probability.expectation.birthday-pairs
    exercises:
      - quant-probability.expectation.indicator-trick

  - id: qexp-birthday-pairs-02
    kind: work
    difficulty: standard
    statement: >
      In a room of $23$ people with $365$ equally likely birthdays, what is the
      expected number of pairs sharing a birthday? Give three decimal places.
    answer: >
      $\approx 0.693$. There are $\binom{23}{2} = 253$ pairs, each sharing with
      probability $1/365$, so the expected count is
      $253/365 \approx 0.693$. This is not the probability that some pair shares
      a birthday, which is about $0.507$; the two are close here only through the
      Poisson heuristic $1 - e^{-0.693} \approx 0.5$.
    expects: "0.693"
    tolerance: 0.0005
    rubric:
      - >
        Counts pairs rather than people.
      - >
        States that the answer is an expected count and not a probability.
    targets:
      - quant-probability.expectation.birthday-pairs
    exercises:
      - quant-probability.expectation.indicator-trick

  - id: qexp-records-01
    kind: work
    difficulty: demanding
    statement: >
      A stream of $1000$ distinct values arrives in uniformly random order. What
      is the expected number of records — values exceeding everything before
      them? Give two decimal places.
    answer: >
      $\approx 7.49$. The $i$-th value is a record with probability $1/i$ by
      symmetry, so the expected count is
      $H_{1000} \approx \ln 1000 + \gamma = 6.9078 + 0.5772 \approx 7.485$.
      A thousand values and fewer than eight records: the count grows
      logarithmically, so going from $1000$ to $2000$ adds only
      $\ln 2 \approx 0.69$ more.
    expects: "7.49"
    tolerance: 0.02
    rubric:
      - >
        Uses $\Pr(\text{record at } i) = 1/i$, justified by symmetry of the
        first $i$ values.
      - >
        Approximates $H_n$ by $\ln n + \gamma$ rather than by $\ln n$ alone.
    targets:
      - quant-probability.expectation.records
    exercises:
      - quant-probability.expectation.indicator-trick

  - id: qexp-records-02
    kind: work
    difficulty: standard
    statement: >
      Ten distinct values arrive in uniformly random order. What is the expected
      number of records? Give three decimal places.
    answer: >
      $\approx 2.929$. The answer is $H_{10} = 1 + 1/2 + \cdots + 1/10 \approx
      2.929$. The first value is always a record, contributing the leading $1$ —
      forgetting that the $i = 1$ term is $1$ rather than $0$ is the usual slip.
    expects: "2.929"
    tolerance: 0.002
    rubric:
      - >
        Includes $i = 1$, whose probability is $1$.
      - >
        Sums the harmonic terms rather than approximating at this small $n$.
    targets:
      - quant-probability.expectation.records
    exercises:
      - quant-probability.expectation.indicator-trick

  # --- tails -----------------------------------------------------------------

  - id: qexp-tail-sum-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed repeatedly and $X$ is the number of tosses up to and
      including the first head. Use the tail-sum formula to find
      $\mathbb{E}[X]$.
    answer: >
      $2$. The event $X \ge k$ means the first $k-1$ tosses were all tails, so
      $\Pr(X \ge k) = 2^{-(k-1)}$. Then
      $\mathbb{E}[X] = \sum_{k \ge 1} 2^{-(k-1)} = \sum_{j \ge 0} 2^{-j} = 2$.
      The tail route is the easy one here: the pmf $\Pr(X = k) = 2^{-k}$ leads to
      $\sum k 2^{-k}$, which needs a differentiated geometric series, while the
      tail sum is geometric on sight.
    expects: "2"
    rubric:
      - >
        Gets the exponent right: $X \ge k$ constrains $k - 1$ tosses, not $k$.
      - >
        Sums the geometric series with the index starting at the correct place.
      - >
        Says why the tail route beats the pmf route here.
    targets:
      - quant-probability.expectation.tail-sum
    exercises:
      - quant-probability.expectation.indicator-trick

  - id: qexp-tail-sum-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is the roll of a fair die. Compute $\sum_{k=1}^{6} \Pr(X \ge k)$.
    answer: >
      $3.5$. The terms are $1, 5/6, 4/6, 3/6, 2/6, 1/6$, summing to
      $(6+5+4+3+2+1)/6 = 21/6 = 3.5$ — the same value as the direct computation,
      as the tail-sum formula guarantees for a nonnegative integer variable.
    expects: "3.5"
    rubric:
      - >
        Starts the sum at $k = 1$, where the term is $1$.
      - >
        Cross-checks against the direct computation of the mean.
    targets:
      - quant-probability.expectation.tail-sum
    exercises:
      - quant-probability.expectation.indicator-trick

  - id: qexp-max-of-dice-01
    kind: work
    difficulty: demanding
    statement: >
      Three independent fair dice are rolled and $M$ is the largest value shown.
      What is $\mathbb{E}[M]$? Give four decimal places.
    answer: >
      $\approx 4.9583$. The tail is a product: $\Pr(M \le k) = (k/6)^{3}$, so
      $\Pr(M \ge k) = 1 - ((k-1)/6)^{3}$. Summing over $k = 1, \dots, 6$ gives
      $\mathbb{E}[M] = 6 - (0 + 1 + 8 + 27 + 64 + 125)/216 = 6 - 225/216 =
      1071/216 \approx 4.9583$. Sanity: above the two-dice answer of
      $4.472$ and below $6$, as taking a maximum over more dice must be.
    expects: "4.9583"
    tolerance: 0.0005
    rubric:
      - >
        Uses independence to write $\Pr(M \le k)$ as a cube.
      - >
        Shifts the index correctly: $\Pr(M \ge k)$ involves $k-1$, not $k$.
      - >
        Checks the answer against the two-dice value and the upper bound of $6$.
    targets:
      - quant-probability.expectation.max-of-dice
    exercises:
      - quant-probability.expectation.tail-sum

  - id: qexp-max-of-dice-02
    kind: work
    difficulty: standard
    statement: >
      Two independent fair dice are rolled. Given that $\mathbb{E}[\max]
      = 161/36$, what is $\mathbb{E}[\min]$?
    answer: >
      $91/36 \approx 2.5278$. The maximum and the minimum together are the two
      dice, so $\max + \min$ is the sum whatever they show, and linearity gives
      $\mathbb{E}[\max] + \mathbb{E}[\min] = 7$. Hence
      $\mathbb{E}[\min] = 7 - 161/36 = 252/36 - 161/36 = 91/36$. No tail sum is
      needed — and this identity is the cheapest check on any pair of such
      computations.
    expects: "91/36"
    tolerance: 0.0005
    rubric:
      - >
        Uses that $\max + \min$ equals the sum of the two dice pointwise.
      - >
        Applies linearity rather than recomputing the minimum's tail.
    targets:
      - quant-probability.expectation.max-of-dice
    exercises:
      - quant-probability.expectation.tail-sum

  # --- spread ----------------------------------------------------------------

  - id: qexp-variance-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ has mean $3$ and variance $4$. What is $\mathbb{E}[(2X - 1)^{2}]$?
    answer: >
      $41$. Let $Y = 2X - 1$. Then $\mathbb{E}[Y] = 2(3) - 1 = 5$ and
      $\operatorname{Var}(Y) = 2^{2}(4) = 16$, so
      $\mathbb{E}[Y^{2}] = \operatorname{Var}(Y) + (\mathbb{E}[Y])^{2} =
      16 + 25 = 41$. Expanding directly agrees:
      $\mathbb{E}[4X^{2} - 4X + 1] = 4(13) - 12 + 1 = 41$, using
      $\mathbb{E}[X^{2}] = 4 + 9 = 13$. The affine rule and the definition are
      the same fact twice.
    expects: "41"
    rubric:
      - >
        Uses $\operatorname{Var}(aX+b) = a^{2}\operatorname{Var}(X)$, with the
        shift contributing nothing to the variance.
      - >
        Recovers the second moment as variance plus squared mean rather than
        confusing the two.
    targets:
      - quant-probability.expectation.variance
    exercises:
      - quant-probability.expectation.lotus
      - quant-probability.expectation.linearity

  - id: qexp-variance-02
    kind: work
    difficulty: standard
    statement: >
      $\operatorname{Var}(X) = 4$. What is $\operatorname{Var}(3X + 10)$?
    answer: >
      $36$. The affine rule gives
      $\operatorname{Var}(aX + b) = a^{2}\operatorname{Var}(X) = 9 \cdot 4 = 36$.
      The $+10$ contributes nothing: a shift moves the values and the mean
      together, so every deviation from the mean is unchanged.
    expects: "36"
    rubric:
      - >
        Squares the multiplicative constant.
      - >
        Explains why the additive constant drops out, rather than only stating
        that it does.
    targets:
      - quant-probability.expectation.variance
    exercises:
      - quant-probability.expectation.lotus
      - quant-probability.expectation.linearity

  - id: qexp-standard-deviation-01
    kind: work
    difficulty: demanding
    statement: >
      A signal has standard deviation $2$ per observation, and observations are
      independent. How many observations are needed for the standard deviation of
      their average to fall to $0.25$?
    answer: >
      $64$. The average of $n$ independent copies has standard deviation
      $\sigma/\sqrt{n} = 2/\sqrt{n}$, and setting that equal to $0.25$ gives
      $\sqrt{n} = 8$, so $n = 64$. The square-root law is the practical content:
      each halving of the standard error costs a factor of four in sample size,
      so precision gets expensive fast. Averaging standard deviations rather than
      variances — and so writing $2/n$ — is the standard error, and it would give
      $8$.
    expects: "64"
    rubric:
      - >
        Uses $\sigma/\sqrt{n}$, not $\sigma/n$.
      - >
        Solves for $n$ rather than for $\sqrt{n}$ and stopping.
    targets:
      - quant-probability.expectation.standard-deviation
    exercises:
      - quant-probability.expectation.variance

  - id: qexp-standard-deviation-02
    kind: work
    difficulty: standard
    statement: >
      One fair die has variance $35/12$. What is its standard deviation? Give
      three decimal places.
    answer: >
      $\approx 1.708$. $\sqrt{35/12} \approx 1.708$, in the units of the die
      itself — which is the whole reason for taking the root. Beside a mean of
      $3.5$ it reads as "a typical roll is about $1.7$ away from average", a
      sentence the variance $2.917$ cannot support because it is in squared pips.
    expects: "1.708"
    tolerance: 0.001
    rubric:
      - >
        Takes the root of the variance and reports it in the original units.
      - >
        Can state what the number means beside the mean.
    targets:
      - quant-probability.expectation.standard-deviation
    exercises:
      - quant-probability.expectation.variance

  - id: qexp-moments-01
    kind: decide
    difficulty: demanding
    statement: >
      A positive variable has tail $\Pr(X > t) = t^{-\alpha}$ for $t \ge 1$, with
      $\alpha = 1.5$. Does $X$ have a finite mean, and does it have a finite
      variance?
    answer: >
      Finite mean, infinite variance. A power-law tail has finite $k$-th moment
      exactly when $k < \alpha$. Here $1 < 1.5$, so the mean exists, while
      $2 > 1.5$, so the second moment diverges. Existence is nested downward — a
      finite second moment would force a finite first — but never upward, so a
      finite mean says nothing about the variance. Financial return series
      routinely sit in this regime, which quietly invalidates every
      $\sigma$-based risk number computed on them.
    choices:
      - text: >
          Both are finite — the mean exists, so the variance does
        feedback: >
          Nesting runs downward only. A finite mean gives no information about
          higher moments.
      - text: >
          Finite mean, infinite variance
        correct: true
        feedback: >
          Moments are finite exactly for $k < \alpha$, and $1 < 1.5 < 2$.
      - text: >
          Neither is finite
        feedback: >
          The mean is finite because $1 < \alpha$; it is only the second moment
          that fails.
    rubric:
      - >
        States the $k < \alpha$ criterion and applies it to both $k = 1$ and
        $k = 2$.
      - >
        Gets the direction of nesting right — downward, not upward.
    targets:
      - quant-probability.expectation.moments
    exercises:
      - quant-probability.expectation.variance

  - id: qexp-moments-02
    kind: work
    difficulty: standard
    statement: >
      What is the kurtosis of a normal distribution?
    answer: >
      $3$. The fourth central moment of a normal law is $3\sigma^{4}$, so the
      normalised quantity $\mathbb{E}[(X-\mu)^{4}]/\sigma^{4}$ is $3$. This is
      why practitioners quote excess kurtosis, kurtosis minus $3$: a positive
      excess means tails heavier than normal, which on a desk means the risk
      model is understating how bad the bad days get.
    expects: "3"
    rubric:
      - >
        Gives the normalised fourth central moment, not the raw one.
      - >
        Explains the excess-kurtosis convention and why the baseline is $3$.
    targets:
      - quant-probability.expectation.moments
    exercises:
      - quant-probability.expectation.variance

  - id: qexp-squared-error-scale-01
    kind: justify
    difficulty: demanding
    statement: >
      Give two distinct structural reasons why squared error, rather than
      absolute error, is the default scale for measuring spread — and one real
      cost of that choice.
    answer: >
      First, decomposition: the variance is exactly the error of the best
      constant forecast of $X$, so it answers a decision problem rather than
      being a convenient summary. Independent contributions add, and uncorrelated
      variables behave like perpendicular vectors, so Pythagoras applies and the
      algebra stays linear — nothing comparable holds for absolute deviations.
      Second, smoothness: $x^{2}$ is differentiable at $0$ where $|x|$ is not, so
      optimisation under squared error has closed forms while least absolute
      deviations needs an algorithm. The cost: a point ten deviations out weighs
      a hundred times a one-deviation point, so squared error is hostage to
      outliers — and the answer arrives in squared units, which is why the number
      quoted is $\sigma$.
    rubric:
      - >
        Gives two reasons that are genuinely structural — additivity or the
        best-constant-forecast property, and differentiability at the origin —
        rather than two phrasings of "it is conventional".
      - >
        Names a real cost, with the quadratic outlier weighting made concrete.
      - >
        Does not claim absolute error is simply worse; it is correct under a
        different loss.
    targets:
      - quant-probability.expectation.squared-error-scale
    exercises:
      - quant-probability.expectation.variance

  - id: qexp-squared-error-scale-02
    kind: decide
    difficulty: standard
    statement: >
      Why is $x^{2}$ easier to optimise under than $|x|$?
    answer: >
      Because it is differentiable at $0$, where $|x|$ has a corner. Setting a
      derivative to zero is available everywhere for squared error, which is what
      gives least squares its closed forms; least absolute deviations has no
      such formula and is solved numerically.
    choices:
      - text: >
          It is differentiable at $0$, where $|x|$ is not
        correct: true
        feedback: >
          Which is exactly why least squares has closed-form solutions and least
          absolute deviations does not.
      - text: >
          It is always smaller than $|x|$
        feedback: >
          It is larger for $|x| > 1$, and relative size is not what makes an
          objective tractable.
      - text: >
          It is bounded
        feedback: >
          It is unbounded, and that unboundedness is one of its costs.
    rubric:
      - >
        Identifies differentiability at the origin as the reason.
      - >
        Connects it to the existence of closed-form minimisers.
    targets:
      - quant-probability.expectation.squared-error-scale
    exercises:
      - quant-probability.expectation.variance

  - id: qexp-mean-median-loss-01
    kind: work
    difficulty: demanding
    statement: >
      A lottery pays $0$ with probability $0.99$ and $1000$ with probability
      $0.01$. Under absolute loss, what single number is your best guess?
    answer: >
      $0$. Absolute loss is minimised by a median, and the median here is $0$
      since $\Pr(X \le 0) = 0.99 \ge 1/2$. Squared error would ask instead for
      the mean, $\mathbb{E}[X] = 10$. Neither is wrong: they answer different
      questions, and on a lottery-shaped payoff they disagree completely. "Your
      best guess" is undefined until the scoring rule is fixed, which makes
      asking which rule applies a legitimate clarifying question.
    expects: "0"
    rubric:
      - >
        Identifies that absolute loss selects a median, not a mean.
      - >
        Computes the median correctly from the given probabilities.
      - >
        States the mean as the contrasting answer under squared error rather
        than dismissing it.
    targets:
      - quant-probability.expectation.mean-median-loss
    exercises:
      - quant-probability.expectation.variance

  - id: qexp-mean-median-loss-02
    kind: work
    difficulty: standard
    statement: >
      $X$ has mean $4$ and variance $9$. What is $\mathbb{E}[(X - 6)^{2}]$?
    answer: >
      $13$. The decomposition $\mathbb{E}[(X-c)^{2}] = \operatorname{Var}(X) +
      (\mu - c)^{2}$ gives $9 + (4-6)^{2} = 9 + 4 = 13$. The identity also shows
      why $c = \mu$ is the unique minimiser: the first term does not depend on
      $c$ and the second is a square, bottoming out at $0$.
    expects: "13"
    rubric:
      - >
        Uses the variance-plus-squared-bias decomposition rather than expanding
        from scratch.
      - >
        Squares the bias, keeping it positive despite $c > \mu$.
    targets:
      - quant-probability.expectation.mean-median-loss
    exercises:
      - quant-probability.expectation.variance

  # --- symmetry --------------------------------------------------------------

  - id: qexp-symmetry-expectation-01
    kind: work
    difficulty: demanding
    statement: >
      A standard deck is shuffled. What is the expected number of cards strictly
      between the first and second aces?
    answer: >
      $9.6$. The four aces cut the $48$ non-aces into five gaps, and those gaps
      are exchangeable: any relabelling of the aces' positions permutes them
      without changing the distribution. Their sizes sum to $48$, so linearity
      forces each to average $48/5 = 9.6$. The gap between the first and second
      aces is one of the five, so its expectation is $9.6$ — no conditioning and
      no integral. Note that all five gaps have the same mean even though they
      plainly do not have the same distribution.
    expects: "9.6"
    rubric:
      - >
        Counts five gaps, not three or four.
      - >
        Argues exchangeability, and uses that the total is fixed at $48$.
      - >
        Does not confuse equal means with equal distributions.
    targets:
      - quant-probability.expectation.symmetry-expectation
    exercises:
      - quant-probability.expectation.linearity

  - id: qexp-symmetry-expectation-02
    kind: work
    difficulty: standard
    statement: >
      Two fair dice are rolled. Using symmetry alone, what is the expected value
      of their sum?
    answer: >
      $7$. The sum $S$ takes values in $\{2, \dots, 12\}$ and $14 - S$ has the
      same law as $S$ — swapping each die's face $x$ for $7 - x$ is a bijection
      of the sample space preserving probabilities. So
      $\mathbb{E}[S] = 14/2 = 7$, with no summation. Linearity gives the same
      answer by a different route, which is the check.
    expects: "7"
    rubric:
      - >
        Exhibits the symmetry as a measure-preserving map, not merely as a
        picture of the histogram.
      - >
        Uses $\mathbb{E}[X] = c/2$ correctly with $c = 14$, not $c = 7$.
    targets:
      - quant-probability.expectation.symmetry-expectation
    exercises:
      - quant-probability.expectation.linearity

  - id: qexp-first-ace-01
    kind: work
    difficulty: demanding
    statement: >
      A standard deck is shuffled. At what position, on average, does the last
      ace appear?
    answer: >
      $42.4$. Mirror the first-ace argument: reverse the deck, and the last ace
      becomes the first. The expected position of the first ace is $10.6$ — the
      $48$ non-aces each precede all four aces with probability $1/5$, giving
      $9.6$ cards before it, plus one — so by symmetry the last ace sits at
      $53 - 10.6 = 42.4$. Equivalently, count the expected number of non-aces
      after the last ace, which is again $9.6$, so the last ace is at
      $52 - 9.6 = 42.4$.
    expects: "42.4"
    tolerance: 0.005
    rubric:
      - >
        Uses a reversal or mirror argument rather than a fresh computation.
      - >
        Handles the off-by-one correctly: $53 - 10.6$, not $52 - 10.6$.
    targets:
      - quant-probability.expectation.first-ace
    exercises:
      - quant-probability.expectation.symmetry-expectation
      - quant-probability.expectation.indicator-trick

  - id: qexp-first-ace-02
    kind: work
    difficulty: standard
    statement: >
      A standard deck is shuffled. At what position, on average, does the first
      ace appear?
    answer: >
      $10.6$. Put one indicator on each of the $48$ non-aces: such a card
      precedes all four aces exactly when it comes first among those five cards,
      which by uniformity of their relative order has probability $1/5$. So
      $48/5 = 9.6$ cards precede the first ace, and the ace itself occupies the
      next position: $9.6 + 1 = 10.6$. Forgetting the $+1$ answers a different
      question — how many cards come before it — and is the standard miss.
    expects: "10.6"
    tolerance: 0.005
    rubric:
      - >
        Uses $\Pr = 1/5$ from the relative order of one non-ace and four aces.
      - >
        Adds the final $1$ to convert a count into a position.
    targets:
      - quant-probability.expectation.first-ace
    exercises:
      - quant-probability.expectation.symmetry-expectation
      - quant-probability.expectation.indicator-trick

  - id: qexp-st-petersburg-01
    kind: work
    difficulty: demanding
    statement: >
      In the St. Petersburg game a fair coin is tossed until the first head; a
      head on toss $n$ pays $2^{n}$. Suppose the house can pay at most $2^{30}$,
      truncating every larger payoff to that cap. What is the value of the capped
      game?
    answer: >
      $31$. For $n \le 30$ each term contributes $2^{-n} \cdot 2^{n} = 1$, giving
      $30$. Every outcome with $n > 30$ pays the cap $2^{30}$, and those outcomes
      have total probability $2^{-30}$, contributing
      $2^{30} \cdot 2^{-30} = 1$. So the value is $30 + 1 = 31$. The point is the
      rate: the cap is a billion-fold larger than the $2^{20}$ version, and the
      value rose only from $21$ to $31$ — value grows like the logarithm of the
      cap, which is why an infinite expectation never turns into a large price.
    expects: "31"
    rubric:
      - >
        Splits at the cap and handles the truncated tail as a single lump.
      - >
        Gets the tail's probability right: $\Pr(n > 30) = 2^{-30}$.
      - >
        Observes that the value grows logarithmically in the cap.
    targets:
      - quant-probability.expectation.st-petersburg
    exercises:
      - quant-probability.expectation.nonexistence

  - id: qexp-st-petersburg-02
    kind: work
    difficulty: standard
    statement: >
      In the uncapped St. Petersburg game, what does each term $n$ contribute to
      the expected payoff?
    answer: >
      Exactly $1$. The first head lands on toss $n$ with probability $2^{-n}$ and
      pays $2^{n}$, so the contribution is $2^{-n} \cdot 2^{n} = 1$ for every
      $n$. Summing over all $n$ therefore diverges, and since the payoff is
      nonnegative the expectation is legitimately $+\infty$ rather than
      undefined.
    expects: "1"
    rubric:
      - >
        Multiplies probability by payoff and observes the cancellation.
      - >
        Concludes $+\infty$ rather than "undefined", using nonnegativity.
    targets:
      - quant-probability.expectation.st-petersburg
    exercises:
      - quant-probability.expectation.nonexistence
