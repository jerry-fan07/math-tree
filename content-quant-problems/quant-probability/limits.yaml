# Problems targeting quant-probability.limits — the limit theorems.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's numbers, and every CLT estimate states the $\Phi$
# value it needs. See ../README.md.

problems:
  # --- convergence in probability ----------------------------------------------

  - id: qlim-convergence-in-probability-01
    kind: work
    difficulty: demanding
    statement: >
      For every $n \ge 3$, the variable $X_n$ equals $n$ with probability $3/n$
      and $0$ otherwise. Fix the tolerance $\varepsilon = 1$ before anything
      else. What is the smallest $n$ at which $\Pr(|X_n| > 1) \le 0.01$?
    answer: >
      $300$. For $n \ge 3$ the only value above the tolerance is $n$ itself, so
      the deviation event is exactly $\{X_n = n\}$ and
      $\Pr(|X_n| > 1) = 3/n$; the requirement $3/n \le 0.01$ first holds at
      $n = 300$. The same argument runs for any fixed $\varepsilon > 0$ — once
      $n > \varepsilon$ the deviation event is again $\{X_n = n\}$, of
      probability $3/n \to 0$ — so $X_n \to 0$ in probability. The trap sits one
      line away: $\mathbb{E}[X_n] = n \cdot (3/n) = 3$ for every $n$, so the
      mean never moves at all. Convergence in probability controls where the
      mass sits, not where the average sits, and upgrading it to convergence of
      expectations needs uniform integrability, which a spike of height $n$
      destroys.
    expects: "300"
    rubric:
      - >
        Identifies the deviation event as $\{X_n = n\}$ for the fixed tolerance,
        rather than re-deriving it after letting $n$ grow.
      - >
        Fixes $\varepsilon$ first and draws no conclusion about
        $\mathbb{E}[X_n]$, which is constant at $3$.
    targets:
      - quant-probability.limits.convergence-in-probability

  - id: qlim-convergence-in-probability-02
    kind: work
    difficulty: standard
    statement: >
      $Y_n$ is the largest of $n$ independent draws from the uniform
      distribution on $(0,1)$, and $Y_n \to 1$ in probability. With the
      tolerance fixed at $\varepsilon = 0.1$, what is $\Pr(|Y_n - 1| > 0.1)$ at
      $n = 20$? Use $0.9^{10} = 0.3487$.
    answer: >
      $0.1216$. A maximum of draws from $(0,1)$ can never exceed $1$, so the
      deviation event is one-sided: $|Y_n - 1| > 0.1$ means $Y_n < 0.9$, which
      needs every one of the $n$ draws to land below $0.9$. Hence
      $\Pr(|Y_n - 1| > 0.1) = 0.9^{n}$, and at $n = 20$ that is
      $(0.9^{10})^{2} = 0.3487^{2} = 0.1216$. Note the rate: the miss
      probability decays geometrically in $n$, far faster than the $1/n$ that
      Chebyshev delivers for sample averages, which is why extreme order
      statistics concentrate so quickly. The slip is doubling the answer for a
      two-sided window; there is no upper branch, because
      $\Pr(Y_n > 1.1) = 0$.
    expects: "0.1216"
    tolerance: 0.0005
    rubric:
      - >
        Recognizes that the window around $1$ is one-sided, so no factor of $2$
        appears.
      - >
        Computes $\Pr(Y_n < 0.9)$ as the $n$-fold product $0.9^{n}$, using that
        the draws are independent.
    targets:
      - quant-probability.limits.convergence-in-probability

  - id: qlim-convergence-in-probability-03
    kind: justify
    difficulty: demanding
    statement: >
      Suppose $X_n \to 0$ in probability and $Y_n \to 0$ in probability, with no
      assumption about how the two sequences are related. Prove directly from
      the definition that $X_n + Y_n \to 0$ in probability.
    answer: >
      Fix $\varepsilon > 0$ once, at the start. By the triangle inequality
      $|X_n + Y_n| \le |X_n| + |Y_n|$, so if both $|X_n| \le \varepsilon/2$ and
      $|Y_n| \le \varepsilon/2$ then $|X_n + Y_n| \le \varepsilon$. Taking
      complements, the event $\{|X_n + Y_n| > \varepsilon\}$ is contained in
      $\{|X_n| > \varepsilon/2\} \cup \{|Y_n| > \varepsilon/2\}$, and the union
      bound gives
      $\Pr(|X_n + Y_n| > \varepsilon) \le \Pr(|X_n| > \varepsilon/2) +
      \Pr(|Y_n| > \varepsilon/2)$. Each term tends to $0$, because
      $\varepsilon/2$ is itself a legitimate fixed tolerance in each hypothesis,
      so the left side does too. Two moves carry the proof: splitting the
      tolerance in half so the two halves reassemble to $\varepsilon$, and using
      the union bound rather than a product — which is precisely why no
      independence is needed anywhere.
    rubric:
      - >
        Fixes $\varepsilon$ first and splits it as $\varepsilon/2$ for each
        sequence, rather than using $\varepsilon$ for both.
      - >
        Bounds the union rather than multiplying probabilities, and says
        explicitly that independence is never used.
      - >
        States the inclusion of events before applying the bound, rather than
        adding probabilities of events that were never compared.
    targets:
      - quant-probability.limits.convergence-in-probability

  # --- convergence in distribution ---------------------------------------------

  - id: qlim-convergence-in-distribution-01
    kind: work
    difficulty: demanding
    statement: >
      $T_n$ is the smallest of $n$ independent uniform draws on $(0,1)$. The
      rescaled minimum $nT_n$ converges in distribution as $n \to \infty$. What
      is the limiting value of $\Pr(nT_n > 2)$? Use $e^{-2} = 0.1353$.
    answer: >
      $0.1353$. The minimum exceeds $t/n$ exactly when all $n$ draws do, so for
      $0 \le t \le n$, $\Pr(nT_n > t) = \Pr(T_n > t/n) = (1 - t/n)^{n}$. That is
      the standard limit $(1 - t/n)^{n} \to e^{-t}$, so the limiting law is
      exponential with rate $1$ and the value at $t = 2$ is
      $e^{-2} = 0.1353$. This is convergence in distribution and nothing
      stronger: the variables themselves go nowhere useful — $T_n \to 0$ while
      $nT_n$ stays spread out on a scale that never shrinks — and only the CDFs
      line up. The convergence is quick, too: at $n = 50$ the exact value
      $(1 - 0.04)^{50} \approx 0.1299$ is already within $0.006$ of the limit.
    expects: "0.1353"
    tolerance: 0.0005
    rubric:
      - >
        Writes the exact survival function $(1 - t/n)^{n}$ before taking any
        limit, rather than guessing the exponential shape.
      - >
        Names the limit law as exponential with rate $1$ and evaluates its
        survival function at $2$, not its density.
    targets:
      - quant-probability.limits.convergence-in-distribution

  - id: qlim-convergence-in-distribution-02
    kind: work
    difficulty: standard
    statement: >
      $X_n$ is uniform on the $n$ grid points $\{1/n, 2/n, \dots, n/n\}$, so
      $X_n$ converges in distribution to the uniform law on $(0,1)$. At
      $n = 40$, what is $F_{40}(0.62) = \Pr(X_{40} \le 0.62)$?
    answer: >
      $0.6$. The grid points at or below $0.62$ are $k/40$ with $k \le 24.8$,
      that is $k = 1, \dots, 24$, and each carries probability $1/40$, so
      $F_{40}(0.62) = 24/40 = 0.6$. The limiting CDF is $F(x) = x$ on $(0,1)$,
      giving $F(0.62) = 0.62$; the gap of $0.02$ is no accident, since
      $|F_n(x) - x| \le 1/n$ at every $x$, so the staircase climbs to the
      straight line uniformly. The limit is continuous everywhere, so the
      continuity proviso in the definition excuses nothing here — pointwise
      convergence is genuinely required, and holds, at every $x$. The wrong move
      is answering $0.62$ because the limit says so; a discrete $X_n$ only ever
      jumps at its own grid points.
    expects: "0.6"
    rubric:
      - >
        Counts the grid points at or below $0.62$ exactly, rather than reading
        the limiting CDF.
      - >
        Notes that the limit law is continuous, so no point is excused by the
        continuity proviso.
    targets:
      - quant-probability.limits.convergence-in-distribution
    exercises:
      - quant-probability.random-variables.cdf

  # --- almost sure convergence -------------------------------------------------

  - id: qlim-almost-sure-convergence-01
    kind: work
    difficulty: demanding
    statement: >
      $U$ is uniform on $(0,1)$ and $X_n = n^{2}U^{n}$. What is
      $\mathbb{E}[X_9]$?
    answer: >
      $8.1$. Since $\mathbb{E}[U^{n}] = \int_{0}^{1} u^{n}\,du = 1/(n+1)$, we
      get $\mathbb{E}[X_n] = n^{2}/(n+1)$, so
      $\mathbb{E}[X_9] = 81/10 = 8.1$. The number matters because $X_n \to 0$
      almost surely: for every outcome with $u < 1$ — a set of probability $1$,
      since $\Pr(U = 1) = 0$ — the numerical sequence $n^{2}u^{n}$ tends to $0$,
      geometric decay beating polynomial growth at any fixed $u < 1$. So the
      entire trajectory settles at $0$ with probability one while
      $\mathbb{E}[X_n] = n^{2}/(n+1) \to \infty$. Almost sure convergence
      constrains paths, not means: the mass carrying the expectation lives on an
      ever-shrinking sliver near $u = 1$, and confusing the two is the standard
      error here.
    expects: "8.1"
    rubric:
      - >
        Integrates $u^{n}$ over $(0,1)$ to get $1/(n+1)$ rather than assuming
        $\mathbb{E}[U^{n}] = (\mathbb{E}[U])^{n}$.
      - >
        Separates the almost sure limit of the trajectory from the behaviour of
        the sequence of expectations.
    targets:
      - quant-probability.limits.almost-sure-convergence

  - id: qlim-almost-sure-convergence-02
    kind: work
    difficulty: standard
    statement: >
      $Z_1, Z_2, \dots$ are independent and uniform on $\{1,2,3,4,5\}$, and
      $M_n = \max(Z_1, \dots, Z_n)$. What is the smallest $n$ for which
      $\Pr(M_n \ne 5) \le 0.01$? Use $\ln 0.8 = -0.2231$ and
      $\ln 0.01 = -4.6052$.
    answer: >
      $21$. The maximum misses $5$ exactly when all $n$ draws avoid it, so
      $\Pr(M_n \ne 5) = 0.8^{n}$. Solving $0.8^{n} \le 0.01$ gives
      $n \ge \ln 0.01 / \ln 0.8 = (-4.6052)/(-0.2231) \approx 20.64$, so
      $n = 21$ is the first integer that works. The mode of convergence here is
      the strong one, and for a structural reason rather than a numerical one:
      $M_n$ is nondecreasing, so once a $5$ is drawn the sequence sits at $5$
      for ever. Every outcome that ever draws a $5$ — probability $1$ — has its
      whole trajectory converge, which is exactly almost sure convergence, not
      merely a per-$n$ miss probability that happens to shrink.
    expects: "21"
    rubric:
      - >
        Writes the miss probability as $0.8^{n}$ and inverts it with logarithms,
        rounding up rather than down.
      - >
        Explains the almost sure claim through monotonicity of the running
        maximum, not through the shrinking probability alone.
    targets:
      - quant-probability.limits.almost-sure-convergence

  # --- how the modes rank ------------------------------------------------------

  - id: qlim-convergence-hierarchy-01
    kind: work
    difficulty: demanding
    statement: >
      A fair six-sided die is rolled once, giving $X$, and for every $n$ we set
      $X_n = 7 - X$. What is $\Pr(|X_n - X| \ge 3)$?
    answer: >
      $2/3$. Because $7 - X$ is uniform on $\{1,\dots,6\}$ whenever $X$ is,
      $X_n$ has exactly the same law as $X$ for every $n$, so $X_n \to X$ in
      distribution trivially — the CDFs are not merely close, they are
      identical. Yet $|X_n - X| = |7 - 2X|$, which takes the values
      $5, 3, 1, 1, 3, 5$ as $X$ runs from $1$ to $6$, so
      $\Pr(|X_n - X| \ge 3) = \Pr(X \in \{1,2,5,6\}) = 4/6 = 2/3$, a constant
      that never shrinks. Convergence in probability therefore fails outright.
      Identical marginals say nothing about joint behaviour, which is the whole
      gap between the two weakest modes; the single repair is a constant limit,
      and $X$ here is anything but constant.
    expects: "2/3"
    rubric:
      - >
        Checks that $7 - X$ is uniform, so the convergence in distribution is
        exact rather than approximate.
      - >
        Evaluates $|7 - 2X|$ over all six faces before counting, rather than
        assuming the gap is always the same size.
    targets:
      - quant-probability.limits.convergence-hierarchy
    exercises:
      - quant-probability.limits.convergence-in-distribution
      - quant-probability.limits.convergence-in-probability

  - id: qlim-convergence-hierarchy-02
    kind: decide
    difficulty: standard
    statement: >
      The strong law gives $\bar{X}_n \to \mu$ almost surely for iid draws with
      $\mathbb{E}|X_1| < \infty$. Which further conclusion follows immediately,
      with no extra hypothesis?
    answer: >
      Both weaker modes follow at once. The chain runs almost surely implies in
      probability implies in distribution, each implication one-directional, so
      an almost sure conclusion hands you the other two for free. Nothing about
      variance enters: finite variance is what Chebyshev's *proof* of the weak
      law consumes, not what the implication between modes requires, and the
      strong law's own hypothesis is only $\mathbb{E}|X_1| < \infty$. The
      converses are where care is needed — a sequence can converge in
      probability without converging almost surely, and in distribution without
      converging in probability — with exactly one exception, a limit that is a
      constant, which is what makes the weak law statable in either of the two
      weaker modes.
    choices:
      - text: >
          $\bar{X}_n \to \mu$ in probability and in distribution.
        correct: true
        feedback: >
          Right — the modes are ordered, and the strongest one implies both
          others with nothing added.
      - text: >
          $\bar{X}_n \to \mu$ in distribution, but convergence in probability
          additionally needs finite variance.
        feedback: >
          Finite variance belongs to the Chebyshev proof of the weak law, never
          to the implication between modes; almost sure convergence gives
          convergence in probability with no moment condition at all.
      - text: >
          Nothing further — the three modes are logically independent.
        feedback: >
          They are ranked, not independent: almost sure implies in probability
          implies in distribution. Only the converses fail.
    rubric:
      - >
        States the ranking in the correct direction, with almost sure as the
        strongest of the three.
      - >
        Does not attach a variance hypothesis to an implication between modes.
    targets:
      - quant-probability.limits.convergence-hierarchy

  # --- mean and variance of a sample mean --------------------------------------

  - id: qlim-sample-mean-moments-01
    kind: work
    difficulty: demanding
    statement: >
      $X_1, \dots, X_9$ are pairwise uncorrelated with common mean $\mu$ and
      common variance $\sigma^{2} = 12$. A junior analyst reports the weighted
      average $W = \tfrac{1}{2}X_1 + \tfrac{1}{16}(X_2 + \dots + X_9)$ rather
      than the sample mean. What is $\operatorname{Var}(W)$?
    answer: >
      $3.375$. The weights sum to $1/2 + 8 \cdot (1/16) = 1$, so $W$ is
      unbiased — $\mathbb{E}[W] = \mu$, exactly like the sample mean. The
      variance is where the two part. Pairwise uncorrelated kills every cross
      term, so a weighted sum has variance $\sigma^{2}\sum_i w_i^{2}$, here
      $12\left[(1/2)^{2} + 8(1/16)^{2}\right] = 12(0.25 + 0.03125) =
      12 \cdot 0.28125 = 3.375$. The sample mean takes $w_i = 1/9$ throughout
      and gets $\sigma^{2}/9 = 12/9 \approx 1.3333$, more than twice as tight.
      That is the real content of $\operatorname{Var}(\bar{X}_n) =
      \sigma^{2}/n$: equal weights minimize $\sum_i w_i^{2}$ subject to
      $\sum_i w_i = 1$, so $1/n$ is the best any unbiased linear combination can
      do. Overweighting one observation costs variance without buying bias.
    expects: "3.375"
    rubric:
      - >
        Squares each weight before multiplying by $\sigma^{2}$, rather than
        summing the weights themselves.
      - >
        Uses pairwise uncorrelatedness to drop the cross terms, and notes that
        full independence is not needed.
      - >
        Checks that the weights sum to $1$, so the comparison with the sample
        mean is between two unbiased estimates.
    targets:
      - quant-probability.limits.sample-mean-moments
    exercises:
      - quant-probability.joint.variance-sum

  - id: qlim-sample-mean-moments-02
    kind: work
    difficulty: standard
    statement: >
      Daily P&Ls at a desk are iid with variance $\sigma^{2} = 45$. How many
      days of data are needed before the standard error of the sample mean is at
      most $0.5$?
    answer: >
      $180$. The sample mean has variance $\sigma^{2}/n = 45/n$, so its standard
      error is $\sqrt{45/n}$. Requiring $\sqrt{45/n} \le 0.5$ squares to
      $45/n \le 0.25$, that is $n \ge 45/0.25 = 180$, and $n = 180$ hits the
      target exactly. Square before solving, not after: dividing the standard
      deviation by $n$ instead of by $\sqrt{n}$ gives
      $\sqrt{45}/n \le 0.5$ and the badly undersized answer $n \ge 14$. The
      quadratic cost is visible in the answer — halving the target to $0.25$
      would need $n = 720$, four times the data.
    expects: "180"
    rubric:
      - >
        Divides the variance by $n$ and takes a square root, rather than
        dividing the standard deviation by $n$.
      - >
        Solves for $n$ from the squared requirement and rounds up to an integer
        number of days.
    targets:
      - quant-probability.limits.sample-mean-moments

  - id: qlim-sample-mean-moments-03
    kind: work
    difficulty: routine
    statement: >
      $X_1, \dots, X_{144}$ are iid with mean $7$ and standard deviation $6$.
      What is the standard deviation of the total $S_{144}$?
    answer: >
      $72$. Independence makes the variances add with no help from the number of
      terms: $\operatorname{Var}(S_n) = n\sigma^{2} = 144 \cdot 36 = 5184$, so
      the standard deviation is $\sqrt{5184} = 72$, which is just
      $\sigma\sqrt{n} = 6 \cdot 12$. The mean never enters — it fixes where
      $S_{144}$ sits, at $144 \cdot 7 = 1008$, not how far it wanders. Keep the
      two directions apart: the average of the same draws has standard deviation
      $\sigma/\sqrt{n} = 6/12 = 0.5$, and the product of the two spreads is
      $72 \cdot 0.5 = 36 = \sigma^{2}$, which is the cleanest way to remember
      that one grows like $\sqrt{n}$ exactly as fast as the other shrinks.
    expects: "72"
    rubric:
      - >
        Multiplies the variance by $n$ and then takes the square root, giving
        $\sigma\sqrt{n}$ and not $n\sigma$.
      - >
        Leaves the mean out of the spread calculation entirely.
    targets:
      - quant-probability.limits.sample-mean-moments

  # --- the weak law ------------------------------------------------------------

  - id: qlim-wlln-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove the weak law of large numbers for iid $X_1, X_2, \dots$ with mean
      $\mu$ and finite variance $\sigma^{2}$, and say exactly where the
      finite-variance hypothesis is consumed.
    answer: >
      Fix $\varepsilon > 0$. The sample mean is unbiased,
      $\mathbb{E}[\bar{X}_n] = \mu$, and independence gives
      $\operatorname{Var}(\bar{X}_n) = \sigma^{2}/n$. Chebyshev's inequality
      applied to $\bar{X}_n$ about its own mean then reads
      $\Pr(|\bar{X}_n - \mu| \ge \varepsilon) \le
      \operatorname{Var}(\bar{X}_n)/\varepsilon^{2} =
      \sigma^{2}/(n\varepsilon^{2})$. With $\varepsilon$ held fixed the right
      side tends to $0$ as $n \to \infty$, which is verbatim the definition of
      $\bar{X}_n \to \mu$ in probability. Finite variance is consumed in exactly
      one place — Chebyshev's inequality is only informative when the variance
      it divides by is finite, and with $\sigma^{2} = \infty$ the bound reads
      $\infty$ at every $n$. It is a feature of this proof, not of the theorem:
      Khinchin's weak law reaches the same conclusion assuming only
      $\mathbb{E}|X_1| < \infty$, by a truncation or characteristic-function
      argument instead. Worth adding aloud that the bound is crude — at
      $\sigma = 2$, $\varepsilon = 0.25$ it reads $64/n$, which is above $1$ and
      so says nothing at all until $n$ passes $64$ — so it proves the law while badly mispricing the
      probability.
    rubric:
      - >
        Establishes $\operatorname{Var}(\bar{X}_n) = \sigma^{2}/n$ before
        invoking Chebyshev, rather than applying the inequality to a single
        $X_i$.
      - >
        Fixes $\varepsilon$ first and reads the conclusion off as the definition
        of convergence in probability, naming the mode.
      - >
        Attributes finite variance to the Chebyshev step and notes that
        Khinchin's version drops it.
    targets:
      - quant-probability.limits.wlln
    exercises:
      - quant-probability.inequalities.chebyshev
      - quant-probability.limits.sample-mean-moments
      - quant-probability.limits.convergence-in-probability

  - id: qlim-wlln-02
    kind: work
    difficulty: standard
    statement: >
      $X_1, X_2, \dots$ are iid with variance $\sigma^{2} = 6$, and the
      tolerance is fixed at $\varepsilon = 0.5$. How many observations does
      Chebyshev's inequality need before it can guarantee
      $\Pr(|\bar{X}_n - \mu| \ge 0.5) \le 0.02$?
    answer: >
      $1200$. Chebyshev applied to $\bar{X}_n$, whose variance is
      $\sigma^{2}/n = 6/n$, gives
      $\Pr(|\bar{X}_n - \mu| \ge 0.5) \le 6/(n \cdot 0.5^{2}) = 24/n$. Setting
      $24/n \le 0.02$ yields $n \ge 1200$. Read what that means: the guarantee
      is about the bound, not about the true probability, which at $n = 1200$ is
      far smaller — the sample mean is then about $22$ standard errors away from
      needing to miss by $0.5$, so a normal approximation would call the event
      astronomically rare. Chebyshev is deliberately distribution-free and pays
      for it in sharpness; the same crudeness is why the bound is vacuous, above
      $1$, for every $n \le 24$.
    expects: "1200"
    rubric:
      - >
        Squares the tolerance in the denominator, giving $24/n$ rather than
        $12/n$.
      - >
        Solves the inequality for $n$ and reports the bound's requirement, not
        the true probability.
    targets:
      - quant-probability.limits.wlln
    exercises:
      - quant-probability.inequalities.chebyshev

  - id: qlim-wlln-03
    kind: decide
    difficulty: demanding
    statement: >
      Draws $X_1, X_2, \dots$ are iid from the density $f(x) = 1/x^{2}$ on
      $x > 1$. A candidate says $\bar{X}_n$ converges to the mean by the law of
      large numbers. What is the correct verdict?
    answer: >
      The claim fails, because there is no mean to converge to. The density is
      legitimate — $\int_{1}^{\infty} x^{-2}\,dx = 1$ — but
      $\mathbb{E}[X_1] = \int_{1}^{\infty} x \cdot x^{-2}\,dx =
      \int_{1}^{\infty} dx/x$, which diverges logarithmically. Both laws of
      large numbers, weak and strong, require a finite first moment: the weak
      law's Chebyshev proof needs finite variance and Khinchin's version needs
      $\mathbb{E}|X_1| < \infty$, and neither holds here. What actually happens
      is the opposite of convergence — the running average drifts upward without
      limit, dragged by ever-larger record draws, since the tail
      $\Pr(X_1 > t) = 1/t$ is heavy enough that the largest of $n$ draws is of
      order $n$ itself. Being iid is never on its own enough.
    choices:
      - text: >
          Correct as stated — the weak law needs only that the draws are iid.
        feedback: >
          Being iid is not enough. Both laws need a finite mean for the average
          to converge to, and this law has none.
      - text: >
          The conclusion fails: $\mathbb{E}|X_1| = \infty$, so no law of large
          numbers applies and the average does not settle.
        correct: true
        feedback: >
          Right — the first moment diverges logarithmically, so there is no
          limit on offer for either law.
      - text: >
          The weak law fails for want of a finite variance, but the strong law
          still delivers almost sure convergence.
        feedback: >
          Reversed. The strong law asks for $\mathbb{E}|X_1| < \infty$, which is
          exactly what fails here; a missing variance alone would not have
          stopped Khinchin's version of the weak law.
    rubric:
      - >
        Computes $\mathbb{E}[X_1]$ from the density and finds it infinite,
        rather than assuming a mean exists.
      - >
        Names the finite first moment as the hypothesis that fails, not the
        variance.
    targets:
      - quant-probability.limits.wlln

  # --- the strong law ----------------------------------------------------------

  - id: qlim-slln-01
    kind: decide
    difficulty: demanding
    statement: >
      Trading returns $R_1, R_2, \dots$ are iid with a finite mean $\mu$ but
      infinite variance — a $t$ law with two degrees of freedom. Which law of
      large numbers applies to the running average $\bar{R}_n$?
    answer: >
      The strong law applies in full, and the weak conclusion comes with it.
      Kolmogorov's strong law asks only for iid draws with
      $\mathbb{E}|R_1| < \infty$, which holds here, and concludes
      $\bar{R}_n \to \mu$ almost surely; almost sure convergence implies
      convergence in probability, so the weak law's conclusion follows even
      though its Chebyshev proof cannot be run. That is the distinction the
      question is testing: finite variance is a property of the *proof* usually
      taught for the weak law, not a hypothesis of either theorem. The infinite
      variance does cost something real — it is the CLT that breaks, so there is
      no $\sigma/\sqrt{n}$ error bar and no normal confidence interval around
      $\bar{R}_n$ — but convergence itself is untouched.
    choices:
      - text: >
          Neither: both laws of large numbers require finite variance.
        feedback: >
          Only the Chebyshev proof of the weak law requires it. Neither theorem
          does, and the strong law asks for strictly less.
      - text: >
          The strong law applies, giving $\bar{R}_n \to \mu$ almost surely, and
          convergence in probability follows from it.
        correct: true
        feedback: >
          Correct — a finite first moment is the whole hypothesis, and the
          stronger mode implies the weaker one.
      - text: >
          Only the weak law, since almost sure convergence is the stronger
          claim and so needs the stronger hypothesis.
        feedback: >
          Stronger conclusion, weaker hypothesis — that is the surprise of the
          strong law. It assumes only $\mathbb{E}|R_1| < \infty$.
    rubric:
      - >
        Separates the hypothesis of the weak law from the hypothesis of the
        Chebyshev argument used to prove it.
      - >
        Notes that the strong conclusion implies the weak one, so no separate
        argument is needed.
    targets:
      - quant-probability.limits.slln

  - id: qlim-slln-02
    kind: work
    difficulty: standard
    statement: >
      A biased coin lands heads with probability $0.37$. You are paid $3$
      dollars for every head and lose $2$ dollars for every tail. By the strong
      law, what value does your average payout per toss converge to with
      probability one?
    answer: >
      $-0.15$ dollars per toss. The payouts $X_i$ are iid with
      $\mathbb{E}[X_i] = 3(0.37) - 2(0.63) = 1.11 - 1.26 = -0.15$, a finite
      mean, so the strong law gives $\bar{X}_n \to -0.15$ almost surely: the one
      infinite run you actually play has its running average settle there, for
      every outcome outside a set of probability zero. What the law does not say
      is anything about a finite run. Here $\mathbb{E}[X^{2}] =
      9(0.37) + 4(0.63) = 5.85$, so $\sigma^{2} = 5.85 - 0.0225 = 5.8275$ and
      $\sigma \approx 2.414$; after $100$ tosses the average still carries a
      standard error of about $0.241$, larger in size than the edge itself, so a
      hundred tosses can easily show a profit while the limit is a loss.
    expects: "-0.15"
    rubric:
      - >
        Weights both outcomes by their probabilities, rather than averaging the
        two payouts.
      - >
        Names almost sure convergence as the mode, and does not read the limit
        as a claim about any finite number of tosses.
    targets:
      - quant-probability.limits.slln

  # --- the central limit theorem -----------------------------------------------

  - id: qlim-clt-01
    kind: work
    difficulty: demanding
    statement: >
      $X_1, X_2, \dots$ are iid uniform on the interval $(-3, 3)$, and
      $S_n = X_1 + \dots + X_n$. Estimate $\Pr(S_{1200} \ge 90)$. Use
      $\Phi(1.5) = 0.9332$.
    answer: >
      $0.0668$. A uniform on $(a,b)$ has mean $(a+b)/2 = 0$ and variance
      $(b-a)^{2}/12 = 36/12 = 3$. So $S_{1200}$ has mean $0$ and variance
      $1200 \cdot 3 = 3600$, standard deviation $\sqrt{3600} = 60$; the flat
      shape of the summand has now done all the work it will ever do. Standardize:
      $z = (90 - 0)/60 = 1.5$, so
      $\Pr(S_{1200} \ge 90) \approx 1 - \Phi(1.5) = 1 - 0.9332 = 0.0668$. No
      continuity correction belongs here — $S_{1200}$ is a continuous variable,
      and the half-unit shift exists only to grant an integer atom its width.
      The standard slip is standardizing by $\sigma$ rather than
      $\sigma\sqrt{n}$: that reports $z = 90/\sqrt{3} \approx 52$ and a
      probability indistinguishable from zero.
    expects: "0.0668"
    tolerance: 0.0005
    rubric:
      - >
        Derives the summand's variance as $(b-a)^{2}/12$ and multiplies by $n$
        before taking the square root.
      - >
        Standardizes by $\sigma\sqrt{n} = 60$, not by $\sigma$ or by
        $\sigma/\sqrt{n}$.
      - >
        Applies no continuity correction, because the summand is continuous.
    targets:
      - quant-probability.limits.clt
    exercises:
      - quant-probability.limits.sample-mean-moments

  - id: qlim-clt-02
    kind: work
    difficulty: standard
    statement: >
      Execution slippage per order is iid with mean $1.5$ basis points and
      standard deviation $0.8$ basis points. Over $n = 100$ orders, estimate the
      probability that the average slippage exceeds $1.6$ basis points. Use
      $\Phi(1.25) = 0.8944$.
    answer: >
      $0.1056$. The average of $100$ draws has mean $1.5$ and standard error
      $\sigma/\sqrt{n} = 0.8/10 = 0.08$, and the CLT says its shape is
      approximately normal whatever the shape of a single order's slippage.
      Standardizing, $z = (1.6 - 1.5)/0.08 = 1.25$, so the estimate is
      $1 - \Phi(1.25) = 1 - 0.8944 = 0.1056$. Note which spread was used: the
      average's, $\sigma/\sqrt{n}$, not one order's $\sigma = 0.8$. Using $0.8$
      would give $z = 0.125$ and a probability near $0.45$, an answer that
      ignores the whole point of averaging. The total's spread points the other
      way, $\sigma\sqrt{n} = 8$ basis points across the hundred orders.
    expects: "0.1056"
    tolerance: 0.0005
    rubric:
      - >
        Uses the standard error $\sigma/\sqrt{n}$ of the average, not the
        single-order standard deviation.
      - >
        Converts the one-sided tail as $1 - \Phi(z)$ rather than $\Phi(z)$.
    targets:
      - quant-probability.limits.clt

  - id: qlim-clt-03
    kind: justify
    difficulty: demanding
    statement: >
      Sketch the transform proof of the central limit theorem for iid $X_i$ with
      mean $0$, variance $\sigma^{2}$ and a moment generating function finite
      near the origin. Say precisely which step needs the identification theorem
      for MGFs.
    answer: >
      Standardize first: $Z_n = S_n/(\sigma\sqrt{n})$. Independence turns the
      MGF of a sum into a product, so
      $M_{Z_n}(t) = [M_X(t/(\sigma\sqrt{n}))]^{n}$. Expand $M_X$ about the
      origin: $M_X(s) = 1 + \mu s + \frac{\sigma^{2}s^{2}}{2} + o(s^{2})$, and
      the linear term vanishes because $\mu = 0$. Substituting
      $s = t/(\sigma\sqrt{n})$ gives
      $M_{Z_n}(t) = [1 + t^{2}/(2n) + o(1/n)]^{n} \to \exp(t^{2}/2)$, which is
      the standard normal's MGF. That is where the argument stops being
      elementary: convergence of transforms is not yet convergence of laws. The
      identification theorem says an MGF finite on a neighbourhood of $0$
      determines its distribution uniquely, and the continuity theorem attached
      to it upgrades pointwise convergence of MGFs into convergence in
      distribution — which is the mode the CLT actually asserts. Finite variance
      is what makes the quadratic term the leading one after the linear term
      dies; with an infinite second moment the expansion has no $s^{2}$ term to
      collect and the limit is not $\exp(t^{2}/2)$ at all.
    rubric:
      - >
        Standardizes before taking transforms, so the MGF being expanded is that
        of a variable with mean $0$ and variance $1$.
      - >
        Uses independence to write the MGF of the sum as an $n$-th power, and
        expands only to second order.
      - >
        Names identification, and the continuity theorem built on it, as the
        step converting convergence of MGFs into convergence in distribution.
    targets:
      - quant-probability.limits.clt
      - quant-probability.mgf.identification
    connects:
      - "quant-probability.limits.clt ~ quant-probability.mgf.identification"

  # --- de Moivre–Laplace -------------------------------------------------------

  - id: qlim-de-moivre-laplace-01
    kind: work
    difficulty: demanding
    statement: >
      $S \sim \operatorname{Bin}(2500, 0.2)$. Using the plain De Moivre–Laplace
      standardization, with no continuity correction, what is the smallest
      integer $k$ for which the approximation gives $\Pr(S \ge k) \le 0.05$? Use
      the standard normal quantile $z_{0.95} = 1.645$.
    answer: >
      $533$. Bernoulli($0.2$) summands have mean $p = 0.2$ and variance
      $p(1-p) = 0.16$, so $S$ has $\mu = np = 500$ and
      $\sigma = \sqrt{np(1-p)} = \sqrt{400} = 20$; the usability check passes
      comfortably, $np(1-p) = 400 \ge 10$. De Moivre–Laplace reads
      $\Pr(S \ge k) \approx 1 - \Phi((k - \mu)/\sigma)$, which is at most $0.05$
      once $(k - 500)/20 \ge 1.645$, that is $k \ge 500 + 32.9 = 532.9$; the
      smallest integer is $533$. Two neighbouring wrong answers are worth
      naming. Standardizing with $\sqrt{np} = 22.36$ instead of
      $\sqrt{np(1-p)}$ inflates the spread and reports $k = 537$. Applying the
      continuity correction — legitimate, just not what was asked — solves
      $k - 0.5 \ge 532.9$ and gives $k = 534$, one integer higher, which is
      exactly the half-unit's worth of shift.
    expects: "533"
    rubric:
      - >
        Uses $\sigma = \sqrt{np(1-p)}$, not $\sqrt{np}$, and checks
        $np(1-p) \ge 10$ before approximating.
      - >
        Inverts the tail through the quantile $1.645$ and rounds up to the next
        integer, since the requirement is an upper bound on the probability.
    targets:
      - quant-probability.limits.de-moivre-laplace
    exercises:
      - quant-probability.discrete.binomial

  - id: qlim-de-moivre-laplace-02
    kind: work
    difficulty: standard
    statement: >
      A fair coin is tossed $6400$ times. Using De Moivre–Laplace without a
      continuity correction, estimate the probability of at least $3248$ heads.
      Use $\Phi(1.2) = 0.8849$.
    answer: >
      $0.1151$. With $n = 6400$ and $p = 1/2$, the count has $\mu = np = 3200$
      and $\sigma = \sqrt{np(1-p)} = \sqrt{1600} = 40$, and $np(1-p) = 1600$ is
      far above the usability threshold of $10$. Standardizing,
      $z = (3248 - 3200)/40 = 1.2$, so
      $\Pr(S \ge 3248) \approx 1 - \Phi(1.2) = 1 - 0.8849 = 0.1151$. Read the
      excess in standard-error units rather than in heads: $48$ extra heads out
      of $6400$ is only $1.2$ standard errors, an unremarkable result, whereas
      the same $48$ in $400$ tosses would be nearly $5$ standard errors. Worth
      noting what the correction would do — using $3247.5$ gives $z = 1.1875$
      and about $0.1175$, a shift of some $0.0024$, small precisely because
      $\sigma = 40$ is large.
    expects: "0.1151"
    tolerance: 0.0005
    rubric:
      - >
        Computes $\sigma = \sqrt{np(1-p)} = 40$ and standardizes the excess of
        $48$ heads against it.
      - >
        Reports the upper tail as $1 - \Phi(z)$ and applies no correction, as
        the question specifies.
    targets:
      - quant-probability.limits.de-moivre-laplace
    exercises:
      - quant-probability.discrete.binomial

  - id: qlim-de-moivre-laplace-03
    kind: justify
    difficulty: demanding
    statement: >
      Use Stirling's approximation to show that
      $\binom{2n}{n}2^{-2n} \approx 1/\sqrt{\pi n}$, and check that the answer
      agrees with the de Moivre–Laplace normal density at the centre of a
      $\operatorname{Bin}(2n, 1/2)$.
    answer: >
      Stirling reads $m! \approx \sqrt{2\pi m}\,(m/e)^{m}$. Applying it three
      times, $\binom{2n}{n} = (2n)!/(n!)^{2} \approx
      \frac{\sqrt{4\pi n}\,(2n/e)^{2n}}{2\pi n\,(n/e)^{2n}}$. The exponential
      factors cancel down to $2^{2n}$, and the prefactor is
      $\sqrt{4\pi n}/(2\pi n) = 1/\sqrt{\pi n}$, so
      $\binom{2n}{n} \approx 2^{2n}/\sqrt{\pi n}$ and therefore
      $\Pr(S_{2n} = n) = \binom{2n}{n}2^{-2n} \approx 1/\sqrt{\pi n}$. Now the
      normal side. A $\operatorname{Bin}(2n, 1/2)$ has $\mu = n$ and
      $\sigma = \sqrt{2n \cdot 1/4} = \sqrt{n/2}$, and the local form of the
      approximation assigns the atom at the centre the density value
      $1/(\sigma\sqrt{2\pi}) = 1/(\sqrt{n/2}\,\sqrt{2\pi}) = 1/\sqrt{\pi n}$.
      The two agree exactly, which is the whole content of the historical
      derivation: the Gaussian shape was not imported from anywhere, it fell out
      of Stirling's factorials. At $n = 50$ both sides give
      $1/\sqrt{50\pi} \approx 0.0798$.
    rubric:
      - >
        Applies Stirling to all three factorials and cancels the
        $(\cdot/e)$ powers before comparing prefactors.
      - >
        Computes $\sigma = \sqrt{n/2}$ for the $\operatorname{Bin}(2n, 1/2)$ and
        evaluates the normal density at its own centre, where the exponential
        factor is $1$.
      - >
        Concludes that the agreement is exact in the leading term, rather than
        asserting the normal shape without deriving it.
    targets:
      - quant-probability.limits.de-moivre-laplace
      - quant-tools.series-calculus.stirling
    connects:
      - "quant-probability.limits.de-moivre-laplace ~ quant-tools.series-calculus.stirling"

  # --- the continuity correction -----------------------------------------------

  - id: qlim-normal-approx-binomial-01
    kind: work
    difficulty: demanding
    statement: >
      $S \sim \operatorname{Bin}(625, 0.2)$. Estimate $\Pr(115 \le S \le 135)$
      with the continuity correction. Use $\Phi(1.05) = 0.8531$.
    answer: >
      $0.7062$. Here $\mu = np = 125$ and
      $\sigma = \sqrt{np(1-p)} = \sqrt{625 \cdot 0.2 \cdot 0.8} = \sqrt{100} =
      10$. Both endpoints are included, so both must be granted their full unit
      of width and the corrected interval is $[114.5, 135.5]$ — the lower
      boundary moves *down* and the upper moves *up*, both outward, because the
      band includes its own endpoints. Standardizing,
      $z_{\text{hi}} = (135.5 - 125)/10 = 1.05$ and
      $z_{\text{lo}} = (114.5 - 125)/10 = -1.05$, so the estimate is
      $\Phi(1.05) - \Phi(-1.05) = 2\Phi(1.05) - 1 = 2(0.8531) - 1 = 0.7062$.
      Shifting both boundaries the same way, as if the correction had one fixed
      direction, is the standard error here: it would give $[115.5, 135.5]$ and
      a visibly narrower band. Skipping the correction entirely gives
      $2\Phi(1) - 1 \approx 0.6826$, understating the answer by more than two
      points of probability.
    expects: "0.7062"
    tolerance: 0.0005
    rubric:
      - >
        Moves the lower boundary down and the upper boundary up, both outward,
        because the interval includes its endpoints.
      - >
        Computes the two-sided probability as $\Phi(z) - \Phi(-z)$, equivalently
        $2\Phi(z) - 1$, rather than as a single tail.
    targets:
      - quant-probability.limits.normal-approx-binomial

  - id: qlim-normal-approx-binomial-02
    kind: work
    difficulty: standard
    statement: >
      A fair coin is tossed $400$ times. Estimate the probability of at least
      $218$ heads, with the continuity correction. Use $\Phi(1.75) = 0.9599$.
    answer: >
      $0.0401$. The count has $\mu = np = 200$ and
      $\sigma = \sqrt{400 \cdot 0.5 \cdot 0.5} = \sqrt{100} = 10$. A $\ge$ tail
      pushes the boundary *down* half a unit, so that the atom at $218$ counts
      as inside: $z = (218 - 0.5 - 200)/10 = 17.5/10 = 1.75$, and the estimate
      is $1 - \Phi(1.75) = 1 - 0.9599 = 0.0401$. Skipping the correction gives
      $z = 1.8$ and about $0.0359$, roughly a tenth of the answer lost. Shifting
      the wrong way, to $218.5$, gives $z = 1.85$ and about $0.0322$ — a larger
      error than not correcting at all, which is why the direction is worth
      deriving rather than memorizing: the boundary always moves so as to
      include the boundary integer's full unit of width.
    expects: "0.0401"
    tolerance: 0.0005
    rubric:
      - >
        Shifts the boundary down to $217.5$ for a $\ge$ tail, and says why that
        direction includes the atom at $218$.
      - >
        Reports the upper tail as $1 - \Phi(z)$ with
        $\sigma = \sqrt{np(1-p)} = 10$.
    targets:
      - quant-probability.limits.normal-approx-binomial

  - id: qlim-normal-approx-binomial-03
    kind: work
    difficulty: demanding
    statement: >
      $S \sim \operatorname{Bin}(400, 0.1)$. Estimate $\Pr(S = 40)$ — the
      probability of exactly $40$ successes — using the continuity correction.
      Use $\Phi(0.0833) = 0.5332$.
    answer: >
      $0.0664$. Here $\mu = np = 40$ and
      $\sigma = \sqrt{400 \cdot 0.1 \cdot 0.9} = \sqrt{36} = 6$. A single
      integer is not a point for the normal — a continuous law assigns every
      point probability zero — so the correction is not optional here, it is the
      only thing that makes the question answerable: the atom at $40$ becomes
      the interval $[39.5, 40.5]$. Standardizing,
      $z = \pm 0.5/6 = \pm 0.0833$, and the estimate is
      $\Phi(0.0833) - \Phi(-0.0833) = 2(0.5332) - 1 = 0.0664$. The local form of
      the same approximation is a useful cross-check: at the centre the normal
      density is $1/(\sigma\sqrt{2\pi}) = 1/(6 \cdot 2.5066) \approx 0.0665$,
      and multiplying a density by the atom's unit width reproduces the same
      number. Answering $0$, or reaching for $1 - \Phi(0)$, both miss that a
      discrete atom has to be given width before a density can be integrated
      over it.
    expects: "0.0664"
    tolerance: 0.0005
    rubric:
      - >
        Turns the single integer into the interval $[39.5, 40.5]$ before
        standardizing, rather than evaluating the normal at a point.
      - >
        Computes the difference of two $\Phi$ values, and sanity-checks it
        against the density $1/(\sigma\sqrt{2\pi})$ times one unit of width.
    targets:
      - quant-probability.limits.normal-approx-binomial
    exercises:
      - quant-probability.discrete.binomial

  - id: qlim-normal-approx-binomial-04
    kind: work
    difficulty: routine
    statement: >
      $S \sim \operatorname{Bin}(900, 0.5)$, and you want to estimate
      $\Pr(S \ge 470)$ with the continuity correction. What is the standardized
      value $z$ you should look up?
    answer: >
      $1.3$. The count has $\mu = np = 450$ and
      $\sigma = \sqrt{900 \cdot 0.5 \cdot 0.5} = \sqrt{225} = 15$. A $\ge$ tail
      shifts the boundary down by half a unit, to $469.5$, so
      $z = (469.5 - 450)/15 = 19.5/15 = 1.3$. Without the correction the value
      would be $20/15 \approx 1.333$; the gap of $0.033$ in $z$ is worth roughly
      $0.006$ in probability here, small but not nothing. The half-unit is
      always $0.5/\sigma$ in standardized terms, so its importance is set
      entirely by $\sigma$ — negligible for a wide count, decisive for a narrow
      one.
    expects: "1.3"
    rubric:
      - >
        Subtracts the half unit before standardizing, not after.
      - >
        Divides by $\sigma = \sqrt{np(1-p)} = 15$ rather than by the variance.
    targets:
      - quant-probability.limits.normal-approx-binomial

  # --- Poisson or normal -------------------------------------------------------

  - id: qlim-poisson-vs-normal-01
    kind: decide
    difficulty: demanding
    statement: >
      A quality check inspects $n = 200$ independent items, each defective with
      probability $p = 0.08$. Which approximation should you quote for the
      number of defectives, and on what evidence?
    answer: >
      The continuity-corrected normal, because $np(1-p) = 200(0.08)(0.92) =
      14.72$ clears the threshold of $10$. This case is deliberately borderline:
      $p = 0.08$ looks small, which is the cue people associate with Poisson,
      but $\lambda = np = 16$ is not moderate and the count has ample room to
      spread symmetrically about its mean, $\sigma = \sqrt{14.72} \approx 3.84$.
      The Poisson approximation is not disastrous here — Le Cam's bound caps its
      total-variation error at $np^{2} = 1.28$, which is uselessly weak — but
      the normal is the accurate call. The diagnostic is always the arithmetic,
      $np(1-p)$ against $10$ and $\lambda p$ for the Poisson error, never the
      adjective attached to $p$.
    choices:
      - text: >
          Poisson with $\lambda = 16$, since $p = 0.08$ is small.
        feedback: >
          Small $p$ is only half the cue — the Poisson regime also wants
          $\lambda = np$ moderate, and Le Cam's error bound here is
          $np^{2} = 1.28$, far too loose to trust.
      - text: >
          The continuity-corrected normal, since $np(1-p) = 14.72 \ge 10$.
        correct: true
        feedback: >
          Correct — the count has room to spread symmetrically, which is exactly
          what the threshold tests.
      - text: >
          Neither: with $n$ only $200$ the count is too small for any limit
          theorem.
        feedback: >
          The threshold is on $np(1-p)$, not on $n$. A modest $n$ with $p$ near
          the middle can be perfectly normal-shaped.
    rubric:
      - >
        Computes $np(1-p)$ and compares it against $10$, rather than judging $p$
        by eye.
      - >
        Checks Le Cam's $np^{2}$ before considering the Poisson route, and finds
        it too large.
    targets:
      - quant-probability.limits.poisson-vs-normal

  - id: qlim-poisson-vs-normal-02
    kind: work
    difficulty: standard
    statement: >
      A book of $30\,000$ independent micro-loans each defaults with probability
      $0.00005$. Estimate the probability that at least two default. Use
      $e^{-1.5} = 0.2231$.
    answer: >
      $0.4422$. This is squarely the rare-event regime: $p$ is tiny and
      $\lambda = np = 30\,000 \cdot 0.00005 = 1.5$ is moderate, while
      $np(1-p) \approx 1.5$ sits far below the normal threshold of $10$, so a
      normal approximation would be useless. Poisson with $\lambda = 1.5$ gives
      $\Pr(S = 0) = e^{-1.5} = 0.2231$ and
      $\Pr(S = 1) = 1.5e^{-1.5} = 0.3347$, so
      $\Pr(S \ge 2) = 1 - (1 + 1.5)e^{-1.5} = 1 - 2.5(0.2231) = 1 - 0.5578 =
      0.4422$. Le Cam's bound puts the total-variation error at
      $np^{2} = 0.000075$, so the third decimal is trustworthy. Going through
      the tail directly rather than the complement — summing
      $\Pr(S = 2), \Pr(S = 3), \dots$ — is the slow route to the same number.
    expects: "0.4422"
    tolerance: 0.0005
    rubric:
      - >
        Identifies the regime by checking that $p$ is tiny and
        $\lambda = np = 1.5$ moderate, before choosing a formula.
      - >
        Computes the complement $1 - \Pr(S \le 1)$ with both Poisson terms,
        rather than dropping the $\Pr(S = 1)$ term.
    targets:
      - quant-probability.limits.poisson-vs-normal
      - quant-probability.discrete.poisson-limit
    connects:
      - "quant-probability.discrete.poisson-limit ~ quant-probability.limits.poisson-vs-normal"

  - id: qlim-poisson-vs-normal-03
    kind: work
    difficulty: standard
    statement: >
      For that same book — $n = 30\,000$ loans, each defaulting independently
      with probability $p = 0.00005$ — what does Le Cam's bound $np^{2}$ give
      for the total-variation error of the Poisson approximation?
    answer: >
      $0.000075$. Directly, $np^{2} = 30\,000 \cdot (0.00005)^{2} =
      30\,000 \cdot 2.5 \cdot 10^{-9} = 7.5 \cdot 10^{-5}$. Read the bound in
      its other form, $\lambda p$: with $\lambda = 1.5$ held fixed, the error is
      proportional to $p$ itself, so the Poisson approximation gets *better* as
      $p$ shrinks with $\lambda$ constant — the opposite of the normal
      approximation's behaviour, which needs $p$ away from the edges. It also
      says every probability computed from this Poisson model is right to about
      four decimal places, which is why quoting $0.4422$ rather than $0.44$ is
      honest here. The common slip is squaring $np$ rather than $p$, which would
      report $2.25$ and suggest the approximation is worthless.
    expects: "0.000075"
    rubric:
      - >
        Squares $p$, not $np$, and multiplies by $n$.
      - >
        Reads the bound as $\lambda p$ and concludes the approximation improves
        as $p$ shrinks with $\lambda$ fixed.
    targets:
      - quant-probability.limits.poisson-vs-normal

  # --- summing many dice -------------------------------------------------------

  - id: qlim-dice-sum-clt-01
    kind: work
    difficulty: demanding
    statement: >
      A fair four-sided die, faces $1$ through $4$, is rolled $80$ times.
      Estimate the probability that the total is at least $223$, using the
      continuity correction. Use $\Phi(2.25) = 0.9878$.
    answer: >
      $0.0122$. One roll has $\mu = (1+2+3+4)/4 = 2.5$ and
      $\mathbb{E}[X^{2}] = (1+4+9+16)/4 = 7.5$, so
      $\sigma^{2} = 7.5 - 6.25 = 1.25$. Multiply by $n$: the total has mean
      $80(2.5) = 200$ and variance $80(1.25) = 100$, standard deviation $10$.
      The total is an integer, so the atom at $223$ gets its half-unit and
      $z = (223 - 0.5 - 200)/10 = 22.5/10 = 2.25$, giving
      $1 - \Phi(2.25) = 1 - 0.9878 = 0.0122$. Notice what never appeared after
      the second line: the die's pmf. A flat four-point law is about as far from
      bell-shaped as a law gets, and only its two moments survive into the
      approximation. Two slips are common — carrying one roll's variance
      $1.25$ into the total instead of $n\sigma^{2} = 100$, and dropping the
      correction, which gives $z = 2.3$ and about $0.0107$, a tenth of the
      answer thrown away.
    expects: "0.0122"
    tolerance: 0.0005
    rubric:
      - >
        Extracts $\mu$ and $\sigma^{2}$ for one roll and multiplies both by
        $n = 80$ before standardizing.
      - >
        Applies the continuity correction downward for a $\ge$ tail on an
        integer total.
    targets:
      - quant-probability.limits.dice-sum-clt
    exercises:
      - quant-probability.limits.sample-mean-moments

  - id: qlim-dice-sum-clt-02
    kind: work
    difficulty: standard
    statement: >
      One roll of a fair six-sided die has variance $35/12$. How many rolls are
      needed before the standard deviation of the running total first reaches
      $50$?
    answer: >
      $858$. The total of $n$ independent rolls has variance $n \cdot 35/12$, so
      its standard deviation is $\sqrt{35n/12}$. Requiring
      $\sqrt{35n/12} \ge 50$ squares to $35n/12 \ge 2500$, that is
      $n \ge 30\,000/35 \approx 857.14$, so $n = 858$ is the first roll count
      that qualifies — a check: $858 \cdot 35/12 = 2502.5$ and
      $\sqrt{2502.5} \approx 50.02$, while $n = 857$ gives $49.996$. The point
      of the arithmetic is the direction of travel. The total's spread grows
      like $\sqrt{n}$ without bound, so it takes over eight hundred rolls to
      reach a spread of $50$ around a mean of $3003$; the *average* over those
      same rolls has standard deviation $50/858 \approx 0.058$ and is tightening
      all the while.
    expects: "858"
    rubric:
      - >
        Multiplies the single-roll variance by $n$ and takes a square root,
        rather than multiplying the standard deviation by $n$.
      - >
        Rounds up to the first integer that meets the requirement.
    targets:
      - quant-probability.limits.dice-sum-clt

  # --- uniforms into a normal --------------------------------------------------

  - id: qlim-uniform-sum-normal-01
    kind: work
    difficulty: demanding
    statement: >
      $S$ is the sum of $27$ independent draws from the uniform distribution on
      $(0,1)$. Estimate $\Pr(S > 15.9)$. Use $\Phi(1.6) = 0.9452$.
    answer: >
      $0.0548$. Each uniform has mean $1/2$ and variance $1/12$, so $S$ has mean
      $27/2 = 13.5$ and variance $27/12 = 2.25$, standard deviation exactly
      $1.5$ — the pleasant arithmetic that makes multiples of $12$ the usual
      choice for this construction. Standardizing,
      $z = (15.9 - 13.5)/1.5 = 1.6$ and
      $\Pr(S > 15.9) \approx 1 - \Phi(1.6) = 1 - 0.9452 = 0.0548$. No continuity
      correction: $S$ is continuous. The estimate is trustworthy here precisely
      because $1.6$ standard deviations is still the body of the distribution.
      Push out to $z = 9$ and it collapses — $S$ is confined to $[0, 27]$, so
      $\Pr(S > 27) = 0$ exactly while the fitted normal still assigns positive
      mass. A bounded, symmetric summand converges unusually fast in the centre
      and stays structurally wrong in the far tail no matter how large $n$ gets.
    expects: "0.0548"
    tolerance: 0.0005
    rubric:
      - >
        Uses $\operatorname{Var}(U) = 1/12$ and multiplies by $n$ to get
        $\sigma = 1.5$, rather than dividing.
      - >
        Applies no continuity correction, and flags that the approximation is
        being read in the body rather than the far tail.
    targets:
      - quant-probability.limits.uniform-sum-normal

  - id: qlim-uniform-sum-normal-02
    kind: work
    difficulty: standard
    statement: >
      How many independent uniform draws on $(0,1)$ must be added for the total
      to have standard deviation exactly $2$?
    answer: >
      $48$. Each draw contributes variance $1/12$, and independence makes the
      variances add, so the sum of $n$ of them has variance $n/12$. Setting
      $n/12 = 4$ gives $n = 48$. The construction generalizes the familiar
      twelve-uniform recipe: twelve draws give variance exactly $1$, so
      $S_{12} - 6$ is a passable standard normal, and $48$ draws give exactly
      twice that spread, so $(S_{48} - 24)/2$ is the standard normal version
      here. Solving $n/12 = 2$ — matching the standard deviation to the variance
      formula without squaring — is the slip, and gives the wrong answer $24$.
    expects: "48"
    rubric:
      - >
        Squares the target standard deviation before solving, so the equation is
        $n/12 = 4$ and not $n/12 = 2$.
      - >
        Adds variances rather than standard deviations across the independent
        draws.
    targets:
      - quant-probability.limits.uniform-sum-normal

  # --- the law of averages, misread --------------------------------------------

  - id: qlim-law-of-averages-fallacy-01
    kind: work
    difficulty: demanding
    statement: >
      A fair coin is tossed $n$ times and $H_n$ counts the heads. Comparing
      $n = 2500$ with $n = 250\,000$: by what factor does the standard deviation
      of the raw excess $H_n - n/2$ grow?
    answer: >
      $10$. The excess is a sum of $n$ centred indicators, each of variance
      $1/4$, so $\operatorname{Var}(H_n - n/2) = n/4$ and the standard deviation
      is $\sqrt{n}/2$: that is $25$ at $n = 2500$ and $250$ at
      $n = 250\,000$, a factor of $\sqrt{100} = 10$. The typical distance from a
      dead heat grows tenfold, in raw heads, as the record lengthens. Meanwhile
      the *fraction* $H_n/n - 1/2$ has standard deviation $1/(2\sqrt{n})$,
      falling from $0.01$ to $0.001$ — the same factor of $10$, the other way.
      Both facts describe one sequence, and that is the whole content of the
      fallacy: an excess of $40$ tails at $n = 2500$ is not repaid, it is
      diluted. Its expected value at $n = 250\,000$ is still exactly $40$, but
      as a share of the record it has fallen from $1.6\%$ to $0.016\%$.
    expects: "10"
    rubric:
      - >
        Computes the standard deviation of the raw excess as $\sqrt{n}/2$, not
        as a fraction of $n$.
      - >
        States that the ratio's standard deviation shrinks by the same factor,
        so convergence of the average and divergence of the difference hold
        simultaneously.
    targets:
      - quant-probability.limits.law-of-averages-fallacy
    exercises:
      - quant-probability.limits.slln

  - id: qlim-law-of-averages-fallacy-02
    kind: decide
    difficulty: standard
    statement: >
      After eight consecutive losses on a fair even-money bet, a colleague
      doubles his stake, saying the law of large numbers means he is due. Which
      response is correct?
    answer: >
      The law of large numbers promises only that the *ratio* settles, and it
      does so by dilution rather than correction. Each future bet has expected
      profit zero regardless of what came before, so the expected value of the
      accumulated deficit never moves: eight losses stay eight losses in
      expectation, for ever. What shrinks is their share of the record, since
      the denominator grows while the deficit does not. Nothing in either law
      touches the difference $H_n - n/2$, whose standard deviation in fact grows
      like $\sqrt{n}$. Doubling after losses converts a zero-expectation game
      into a zero-expectation game with a much fatter left tail; it prices a
      correction that the theorem never promised.
    choices:
      - text: >
          He is right — the law of large numbers guarantees the deficit is made
          up by future outcomes.
        feedback: >
          The law is about the ratio, never the difference. Future bets have
          expected profit zero, so nothing makes the deficit up.
      - text: >
          He is wrong — the law constrains only the ratio, and the expected
          future profit is zero, so the deficit is diluted rather than repaid.
        correct: true
        feedback: >
          Correct — convergence of $H_n/n$ and divergence of $H_n - n/2$ are
          simultaneously true of the same sequence.
      - text: >
          He is wrong, but only because eight is too small a sample for the law
          to apply yet.
        feedback: >
          Sample size is not the issue. However long the streak, the next bet's
          expectation is unchanged, so the reasoning never becomes valid.
    rubric:
      - >
        Distinguishes the ratio, which converges, from the difference, which
        does not.
      - >
        Says that the expected future profit is zero, so the fallacy is about
        the mechanism, not about the length of the streak.
    targets:
      - quant-probability.limits.law-of-averages-fallacy

  # --- what the CLT does not buy -----------------------------------------------

  - id: qlim-clt-caveats-01
    kind: decide
    difficulty: demanding
    statement: >
      An analyst averages $n = 10\,000$ iid standard Cauchy draws and reports a
      $95\%$ interval of half-width $1.96/\sqrt{n} = 0.0196$ around the sample
      mean. What is wrong with the report?
    answer: >
      Everything downstream of the first step: the Cauchy law has no finite
      variance, so the CLT does not apply and there is no
      $\sigma/\sqrt{n}$ to divide by. Worse than merely being inaccurate, the
      sample mean of $n$ iid standard Cauchy draws has *exactly* the standard
      Cauchy law for every $n$ — the family is stable with index $1$, so
      averaging is a no-op. Ten thousand draws buy precisely as much precision
      as one draw, and the honest interval containing $95\%$ of the sample
      mean's mass is $\pm\tan(0.475\pi) \approx \pm 12.7$, some six hundred
      times wider than the reported one. The lesson generalizes: heavy tails
      without a finite second moment converge to non-normal stable laws, not to
      a normal, and no amount of data repairs that.
    choices:
      - text: >
          Nothing is wrong — $n = 10\,000$ is large enough for the CLT to apply
          to any iid sequence.
        feedback: >
          Large $n$ is never sufficient. The CLT's one non-negotiable hypothesis
          is $0 < \sigma^{2} < \infty$, which the Cauchy law fails.
      - text: >
          The Cauchy law has infinite variance, so there is no normal limit; the
          sample mean has the same standard Cauchy law as a single draw and the
          interval is meaningless.
        correct: true
        feedback: >
          Correct — stability of the Cauchy family means averaging buys no
          precision at all, at any $n$.
      - text: >
          The CLT applies but converges slowly, so the interval is merely too
          narrow by a modest factor.
        feedback: >
          There is no convergence to be slow. The average does not concentrate
          around anything as $n$ grows, so this is not a rate problem.
    rubric:
      - >
        Names the failed hypothesis as finite variance, rather than treating the
        problem as a sample-size or rate issue.
      - >
        States the stability fact — the Cauchy sample mean has the same law as
        one draw — rather than only asserting the CLT fails.
    targets:
      - quant-probability.limits.clt-caveats
      - quant-probability.continuous.cauchy
    connects:
      - "quant-probability.continuous.cauchy ~ quant-probability.limits.clt-caveats"

  - id: qlim-clt-caveats-02
    kind: work
    difficulty: standard
    statement: >
      For a given iid summand, the Berry–Esseen bound on the worst-case CDF
      error of the normal approximation reads $0.045$ at $n = 400$. How large
      must $n$ be before the bound falls to $0.009$?
    answer: >
      $10\,000$. Berry–Esseen bounds the error by
      $C\rho/(\sigma^{3}\sqrt{n})$, and with the summand fixed everything except
      $\sqrt{n}$ is a constant, so the bound scales as $1/\sqrt{n}$. Cutting it
      from $0.045$ to $0.009$ is a factor of $5$, which needs $\sqrt{n}$ five
      times larger, so $n$ must grow $25$-fold: $400 \cdot 25 = 10\,000$. The
      quadratic cost is the same one the standard error pays everywhere in this
      unit, applied here to the *approximation's* worst-case error rather than
      to a confidence interval. Scaling $n$ linearly with the improvement — the
      standard slip — would give $n = 2000$ and a bound still near $0.02$.
      Worth adding that the bound is uniform over $z$ but only informative near
      the centre; deep in the tail the relative error can be unbounded whatever
      the bound says.
    expects: "10000"
    rubric:
      - >
        Uses the $1/\sqrt{n}$ scaling and squares the improvement factor, rather
        than scaling $n$ linearly.
      - >
        Notes that the bound is a worst-case cap over $z$ and does not control
        relative error in the far tail.
    targets:
      - quant-probability.limits.clt-caveats

  - id: qlim-clt-caveats-03
    kind: justify
    difficulty: demanding
    statement: >
      Explain why the central limit theorem cannot drop the hypothesis
      $0 < \sigma^{2} < \infty$. Say what breaks in the statement itself, not
      merely in one proof of it.
    answer: >
      The hypothesis is load-bearing on both sides of the inequality. If
      $\sigma^{2} = 0$ the summand is a constant, the standardization
      $(S_n - n\mu)/(\sigma\sqrt{n})$ divides by zero, and there is nothing
      random left to have a limiting law. If $\sigma^{2} = \infty$ the
      normalization itself is wrong: the theorem asserts that fluctuations of
      $S_n$ have size $\sqrt{n}$, and that scale comes directly from
      $\operatorname{Var}(S_n) = n\sigma^{2}$, which is the one place the second
      moment enters. With an infinite second moment there is no such scale — for
      a heavy tail with index $\alpha < 2$ the right normalization is
      $n^{1/\alpha}$, and the limit is a non-normal stable law rather than a
      normal one. The extreme case is $\alpha = 1$: an average of iid standard
      Cauchy draws has exactly the standard Cauchy law for every $n$, so no
      rescaling produces a normal limit at any $n$. This is a failure of the
      conclusion, not of a technique — Lindeberg and Lyapunov relax the iid
      hypothesis freely, and neither relaxes finite variance, because there is
      nothing to relax it to.
    rubric:
      - >
        Handles both ends of $0 < \sigma^{2} < \infty$, not only the infinite
        case.
      - >
        Locates the second moment in the $\sqrt{n}$ normalization, and says the
        correct scale for a heavy tail is $n^{1/\alpha}$ instead.
      - >
        Distinguishes a failure of the conclusion from a limitation of one
        proof, citing the Cauchy law as a concrete counterexample.
    targets:
      - quant-probability.limits.clt-caveats

  # --- Slutsky -----------------------------------------------------------------

  - id: qlim-slutsky-01
    kind: decide
    difficulty: demanding
    statement: >
      You have $\sqrt{n}(\bar{X}_n - \mu)/\sigma \to N(0,1)$ in distribution and
      want to replace the unknown $\sigma$ in the denominator. Three candidates
      are available: the sample standard deviation $s_n$, which satisfies
      $s_n \to \sigma$ in probability; a fresh independent standard normal draw
      $W_n$ for each $n$; and a sequence $c_n \to 0$ in probability. Which
      substitution does Slutsky's theorem license?
    answer: >
      Only $s_n$. Slutsky's quotient rule needs the divisor to converge *in
      probability to a constant* $c \ne 0$, and $s_n \to \sigma > 0$ is exactly
      that; the conclusion is that $\sqrt{n}(\bar{X}_n - \mu)/s_n$ has the same
      standard normal limit as the version with the true $\sigma$, which is the
      single step making a confidence interval computable from data alone. The
      other two fail for different reasons. $W_n$ converges in distribution but
      to a genuinely random limit, and distributional convergence carries no
      information about joint behaviour — the numerator and $W_n$ could
      correlate arbitrarily, so nothing about the quotient is determined. And
      $c_n \to 0$ violates the explicit $c \ne 0$: dividing by a sequence
      collapsing to zero blows the statistic up rather than stabilizing it.
    choices:
      - text: >
          $s_n$, because it converges in probability to the nonzero constant
          $\sigma$.
        correct: true
        feedback: >
          Right — a constant, nonzero probability limit is the entire hypothesis
          the quotient rule leans on.
      - text: >
          $W_n$, because convergence in distribution is all Slutsky requires of
          the second sequence.
        feedback: >
          The second sequence must converge in probability to a *constant*. A
          random limit leaves the joint behaviour unconstrained, and the rule is
          false in that generality.
      - text: >
          $c_n$, because any probability limit at all is enough.
        feedback: >
          The quotient rule carries an explicit $c \ne 0$. A divisor collapsing
          to zero makes the ratio diverge instead of converging.
    rubric:
      - >
        Names the hypothesis as convergence in probability to a constant, and
        checks the constant is nonzero for the quotient.
      - >
        Explains why a random limit is not enough, in terms of joint behaviour
        that distributional convergence does not pin down.
    targets:
      - quant-probability.limits.slutsky

  - id: qlim-slutsky-02
    kind: work
    difficulty: standard
    statement: >
      Suppose $\sqrt{n}(\bar{X}_n - \mu) \to N(0, 25)$ in distribution and a
      separate sequence satisfies $c_n \to 0.8$ in probability. Slutsky's
      product rule gives $c_n\sqrt{n}(\bar{X}_n - \mu) \to N(0, v)$. What is
      $v$?
    answer: >
      $16$. Slutsky's product rule sends $X_nY_n \to cX$ when $Y_n \to c$ in
      probability, so the limit here is $0.8$ times an $N(0, 25)$ variable.
      Scaling a normal by a constant multiplies its standard deviation by that
      constant and its variance by the square: the limiting standard deviation
      is $0.8 \cdot 5 = 4$ and the variance is $0.8^{2} \cdot 25 = 0.64 \cdot 25
      = 16$. The trap is multiplying the variance by $0.8$ rather than by
      $0.8^{2}$, which reports $20$ — the same squaring slip that shows up in
      the delta method. Note also what Slutsky does not require: no independence
      between the two sequences, and no assumption that $c_n$ has a limiting
      distribution beyond collapsing to its constant.
    expects: "16"
    rubric:
      - >
        Squares the constant when passing to the variance, rather than scaling
        the variance linearly.
      - >
        Names the product rule and notes that no independence between the two
        sequences is assumed.
    targets:
      - quant-probability.limits.slutsky

  # --- the delta method --------------------------------------------------------

  - id: qlim-delta-method-01
    kind: work
    difficulty: demanding
    statement: >
      Service times at a queue are iid with mean $\mu = 5$ minutes and standard
      deviation $\sigma = 3$ minutes. From $n = 900$ observations you report the
      throughput $g(\bar{X}_n) = 1/\bar{X}_n$, in jobs per minute. What is the
      approximate standard error of that report?
    answer: >
      $0.004$ jobs per minute. The sample mean carries standard error
      $\sigma/\sqrt{n} = 3/30 = 0.1$ minutes. The delta method pushes that
      through $g$ by multiplying by $|g'(\mu)|$: with $g(x) = 1/x$ we have
      $g'(x) = -1/x^{2}$, so $|g'(5)| = 1/25 = 0.04$ and the reported
      throughput carries standard error $0.04 \cdot 0.1 = 0.004$ about the true
      value $g(5) = 0.2$. Two things are worth saying aloud. The derivative is
      evaluated at the true $\mu$, not at $\bar{X}_n$ — in practice one
      substitutes $\bar{X}_n$ and appeals to Slutsky to say the limit is
      unchanged. And the sign is irrelevant to a standard error: a negative
      derivative reverses the direction of an error, not its size. Squaring at
      the wrong moment is the usual mistake; the asymptotic *variance* is
      $g'(\mu)^{2}\sigma^{2}/n = 0.0016 \cdot 9/900 = 1.6 \cdot 10^{-5}$, whose
      square root is $0.004$ again.
    expects: "0.004"
    rubric:
      - >
        Evaluates $g'$ at the true $\mu$ and multiplies the sample mean's
        standard error by $|g'(\mu)|$, unsquared.
      - >
        Keeps the variance and the standard error apart, squaring $g'(\mu)$ only
        for the former.
    targets:
      - quant-probability.limits.delta-method
    exercises:
      - quant-tools.series-calculus.taylor
      - quant-probability.limits.slutsky

  - id: qlim-delta-method-02
    kind: work
    difficulty: standard
    statement: >
      $X_1, \dots, X_{400}$ are iid with mean $2$ and standard deviation $4$,
      and you report $g(\bar{X}_n) = \bar{X}_n^{3}$. What is the approximate
      standard error of the report?
    answer: >
      $2.4$. The sample mean has standard error $\sigma/\sqrt{n} = 4/20 = 0.2$.
      With $g(x) = x^{3}$ the derivative is $g'(x) = 3x^{2}$, so
      $g'(2) = 12$ and the delta method gives
      $12 \cdot 0.2 = 2.4$ as the standard error of the report about its true
      value $g(2) = 8$. Evaluating the derivative anywhere but at $\mu$ is the
      first slip — $g'(8) = 192$, sixteen times too large, comes from confusing
      the argument with the value. The second is worth naming because it is the
      method's one genuine limitation: had $\mu$ been $0$, then $g'(0) = 0$, the
      linear term the whole Taylor argument leans on would vanish, and the limit
      would be a multiple of a chi-square rather than a normal — a different
      shape, not merely a smaller spread.
    expects: "2.4"
    rubric:
      - >
        Evaluates $g'$ at $\mu = 2$, not at $g(\mu)$ or at a sample value.
      - >
        Multiplies the sample mean's standard error by $|g'(\mu)|$ rather than
        by $g(\mu)$ or by $g'(\mu)^{2}$.
    targets:
      - quant-probability.limits.delta-method
    exercises:
      - quant-tools.series-calculus.taylor

  # --- Borel–Cantelli ----------------------------------------------------------

  - id: qlim-borel-cantelli-01
    kind: work
    difficulty: demanding
    statement: >
      $A_2, A_3, \dots$ are independent events with $\Pr(A_n) = 1/n$. What is
      the probability that none of $A_2, A_3, A_4, A_5$ occurs?
    answer: >
      $1/5$. Independence turns "none occurs" into a product:
      $\prod_{n=2}^{5}(1 - 1/n) = \frac{1}{2}\cdot\frac{2}{3}\cdot\frac{3}{4}
      \cdot\frac{4}{5} = \frac{1}{5}$, the telescoping leaving only the first
      numerator and the last denominator. The general form is the second
      Borel–Cantelli lemma made concrete: $\prod_{n=2}^{N}(1 - 1/n) = 1/N \to
      0$, so with probability one at least one of $A_2, \dots, A_N$ eventually
      occurs — and since the same computation runs from any starting index, with
      probability one infinitely many occur. That is exactly the lemma's
      conclusion, and the divergence of $\sum_n 1/n$ is what drives it.
      Independence is doing real work here: without it the product is
      unavailable and a divergent sum proves nothing at all. Contrast the first
      lemma, which needs no independence but does need summability — at
      $\Pr(A_n) = 1/n^{2}$ only finitely many would occur.
    expects: "1/5"
    rubric:
      - >
        Uses independence to multiply the complements, and telescopes rather
        than multiplying out.
      - >
        Connects $\prod_{n=2}^{N}(1 - 1/n) = 1/N \to 0$ to the second lemma's
        conclusion, naming the divergence of the harmonic series.
    targets:
      - quant-probability.limits.borel-cantelli

  - id: qlim-borel-cantelli-02
    kind: decide
    difficulty: standard
    statement: >
      For each $n$, $A_n$ is the event that a desk's $n$th model beats its
      benchmark by more than three standard deviations, with
      $\Pr(A_n) = n^{-1.5}$. Nothing is assumed about independence. What
      follows?
    answer: >
      With probability one only finitely many of the $A_n$ occur. The series
      $\sum_n n^{-1.5}$ is a $p$-series with $p = 1.5 > 1$, so it converges, and
      the first Borel–Cantelli lemma applies: a summable sequence of event
      probabilities forces all but finitely many of the events to fail, with
      probability one. The proof is a union bound on the tail — the chance that
      some $A_m$ with $m \ge n$ occurs is at most $\sum_{m \ge n}\Pr(A_m)$, which
      is the tail of a convergent series and so shrinks to $0$ — and a union
      bound never needs independence. That is the whole point of the first
      lemma, and the reason the missing independence assumption is a red
      herring here; it is the second lemma, the one with the divergent sum, that
      cannot do without it.
    choices:
      - text: >
          With probability one only finitely many $A_n$ occur.
        correct: true
        feedback: >
          Correct — $\sum_n n^{-1.5}$ converges, and the first lemma needs
          nothing but summability.
      - text: >
          With probability one infinitely many occur, since the probabilities
          never actually reach zero.
        feedback: >
          That is the second lemma's conclusion, which needs a *divergent* sum
          and independence. Here the sum converges.
      - text: >
          Nothing can be concluded without an independence assumption.
        feedback: >
          The first lemma is precisely the one that needs none — its proof is a
          union bound, which holds for any events at all.
    rubric:
      - >
        Tests the series for convergence rather than only noting that the terms
        tend to zero.
      - >
        Identifies the first lemma as the applicable one and says why
        independence is not needed for it.
    targets:
      - quant-probability.limits.borel-cantelli

  # --- one over root n ---------------------------------------------------------

  - id: qlim-root-n-01
    kind: work
    difficulty: demanding
    statement: >
      A Monte Carlo pricer reports a standard error of $0.004$ after $50\,000$
      simulated paths. How many paths are needed to bring the standard error
      down to $0.001$?
    answer: >
      $800\,000$. Monte Carlo error is an ordinary standard error: it shrinks
      like $\sigma/\sqrt{n}$ with $\sigma$ fixed by the payoff being priced, so
      the two error levels stand in the inverse ratio of $\sqrt{n}$. Cutting
      $0.004$ to $0.001$ is a fourfold improvement, needing $\sqrt{n}$ four
      times larger and therefore $n$ sixteen times larger:
      $50\,000 \cdot 16 = 800\,000$ paths. Scaling linearly is the standard
      slip — $200\,000$ paths only reaches $0.004/\sqrt{4} = 0.002$, still twice
      the target. The strategic reading matters more than the arithmetic: since
      accuracy costs quadratically in paths but only linearly in $\sigma$, a
      variance-reduction technique that halves $\sigma$ is worth exactly as much
      as quadrupling the path count, and costs far less to run.
    expects: "800000"
    rubric:
      - >
        Squares the improvement factor when converting an error ratio into a
        sample-size ratio.
      - >
        Identifies the Monte Carlo error as the same $\sigma/\sqrt{n}$ governing
        every other estimate in the unit.
    targets:
      - quant-probability.limits.root-n
    exercises:
      - quant-probability.limits.sample-mean-moments

  - id: qlim-root-n-02
    kind: work
    difficulty: standard
    statement: >
      A strategy has an edge worth $0.05$ standard deviations per trade. How
      many trades are needed before the cumulative edge amounts to three
      standard errors?
    answer: >
      $3600$. Over $n$ trades the accumulated edge grows like $n$ times the
      per-trade edge while the noise grows like $\sigma\sqrt{n}$, so in
      standard-error units the signal is $\sqrt{n}$ times the edge measured in
      standard deviations. Setting $\sqrt{n}(0.05) = 3$ gives $\sqrt{n} = 60$
      and $n = 3600$ trades. The quadratic law is visible in the neighbours:
      halving the requirement to $1.5$ standard errors needs only $900$ trades,
      doubling it to $6$ needs $14\,400$. Treating the requirement as linear —
      $n = 3/0.05 = 60$ trades — is the slip, and delivers only
      $\sqrt{60}(0.05) \approx 0.39$ standard errors, an eighth of what was
      asked. The same inversion answers "how long until a backtest can tell this
      edge from noise."
    expects: "3600"
    rubric:
      - >
        Writes the signal-to-noise ratio as $\sqrt{n}$ times the per-trade edge,
        not $n$ times it.
      - >
        Solves for $n$ by squaring, rather than dividing the target by the edge.
    targets:
      - quant-probability.limits.root-n

  - id: qlim-root-n-03
    kind: work
    difficulty: standard
    statement: >
      A poll wants a proportion pinned to within $1$ percentage point at $99\%$
      confidence, using the conservative worst-case standard deviation
      $\sigma = 0.5$ and the quantile $z = 2.58$. How many respondents are
      needed?
    answer: >
      $16\,641$. Solve $z\sigma/\sqrt{n} = \text{tolerance}$ for $n$: with
      $z = 2.58$, $\sigma = 0.5$ and a tolerance of $0.01$,
      $\sqrt{n} = 2.58(0.5)/0.01 = 129$, so $n = 129^{2} = 16\,641$. Both
      knobs price quadratically, which is the number's real lesson — loosening
      the tolerance to $2$ percentage points halves $\sqrt{n}$ and cuts the
      sample to $\lceil 64.5^{2} \rceil = 4161$, a saving of three quarters for
      one point of precision. The choice $\sigma = 0.5$ is deliberately
      conservative: $p(1-p)$ is largest at $p = 1/2$, where it equals $0.25$, so
      no true proportion could need a larger sample than this. Solving linearly
      in the tolerance — around $129$ respondents — undersizes by two orders of
      magnitude.
    expects: "16641"
    rubric:
      - >
        Solves $z\sigma/\sqrt{n} = \text{tolerance}$ and squares, rather than
        scaling $n$ linearly with the tolerance.
      - >
        Uses $\sigma = 0.5$ as the worst case and says why $p = 1/2$ maximizes
        $p(1-p)$.
    targets:
      - quant-probability.limits.root-n

  - id: qlim-root-n-04
    kind: work
    difficulty: routine
    statement: >
      An estimate's error shrinks like $\sigma/\sqrt{n}$. By what factor must
      $n$ grow to cut the error to one third of its current size?
    answer: >
      $9$. The error is proportional to $1/\sqrt{n}$, so dividing it by $3$
      requires $\sqrt{n}$ to grow by a factor of $3$, and therefore $n$ to grow
      by $3^{2} = 9$. The general rule behind every sample-size question in this
      unit: to divide the error by $k$, multiply the data by $k^{2}$ — halving
      an error costs four times the data, and gaining one more decimal digit
      costs a hundredfold. Answering $3$ treats the relationship as linear and
      leaves the error at $\sigma/\sqrt{3n} \approx 0.58$ of its original size,
      not $0.33$.
    expects: "9"
    rubric:
      - >
        Squares the reduction factor, since $n$ enters through $\sqrt{n}$.
      - >
        States the general form — divide the error by $k$, multiply $n$ by
        $k^{2}$.
    targets:
      - quant-probability.limits.root-n
