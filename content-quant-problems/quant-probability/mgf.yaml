# Problems targeting quant-probability.mgf — generating functions and transforms.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. No problem here reuses a lesson's
# worked example or a card's instance, and a problem states the transform it
# needs rather than assuming a table taught later in the unit. See ../README.md.

problems:
  # --- probability generating function ----------------------------------------

  - id: qmgf-pgf-01
    kind: work
    difficulty: demanding
    statement: >
      An urn holds $3$ red and $5$ blue balls. Three are drawn without
      replacement and $X$ counts the red ones among them. Evaluate the
      probability generating function of $X$ at $s = 2$, that is, find
      $\mathbb{E}[2^{X}]$.
    answer: >
      $69/28 \approx 2.4643$. The PGF is a LOTUS computation with
      $g(x) = s^{x}$, so nothing is needed beyond the pmf. There are
      $\binom{8}{3} = 56$ equally likely triples, and counting by the number of
      red balls drawn gives $\binom{5}{3} = 10$, $\binom{3}{1}\binom{5}{2} =
      30$, $\binom{3}{2}\binom{5}{1} = 15$ and $\binom{3}{3} = 1$ triples for
      $X = 0, 1, 2, 3$; those total $56$, which is the first check. Hence
      $G_X(s) = (10 + 30s + 15s^{2} + s^{3})/56$, and
      $G_X(2) = (10 + 60 + 60 + 8)/56 = 138/56 = 69/28$. Two free readings
      confirm the polynomial: $G_X(1) = 56/56 = 1$, the pmf's normalization,
      and $G_X(0) = 10/56 = 5/28 = \Pr(X = 0)$. The trap is treating $s$ as a
      probability and expecting $G_X(2) \le 1$ — $s$ is a dummy variable, and
      $\mathbb{E}[2^{X}]$ is perfectly allowed to exceed $1$.
    expects: "69/28"
    tolerance: 0.0005
    rubric:
      - >
        Builds the pmf first and checks the four counts total $\binom{8}{3}$
        before reading them off as coefficients.
      - >
        Treats $s = 2$ as a legitimate evaluation point rather than expecting
        the value to be a probability.
    targets:
      - quant-probability.mgf.pgf
    exercises:
      - quant-probability.expectation.lotus

  - id: qmgf-pgf-02
    kind: work
    difficulty: standard
    statement: >
      A count $X$ on $\{0,1,2,3\}$ has probability generating function
      $G_X(s) = c\,(1 + s + 4s^{2} + 2s^{3})$ for some constant $c$. Find
      $\Pr(X = 0)$.
    answer: >
      $1/8 = 0.125$. The constant is pinned by the one identity every PGF
      satisfies: $G_X(1) = \sum_k p_k = 1$. Here $G_X(1) = c(1 + 1 + 4 + 2) =
      8c$, so $c = 1/8$. Then the second free reading applies: $G_X(0) = p_0$,
      because every term after the constant carries a factor of $s$ and dies at
      $s = 0$. So $\Pr(X = 0) = c = 1/8$. The full pmf is
      $1/8, 1/8, 1/2, 1/4$, which sums to $1$ as it must. The slip to avoid is
      normalizing by the largest coefficient, or by $4$ because there are four
      outcomes; the normalization is always through $G_X(1)$.
    expects: "1/8"
    rubric:
      - >
        Uses $G_X(1) = 1$ to find $c$, not any other normalization.
      - >
        Reads $\Pr(X = 0)$ as $G_X(0)$, the constant term, rather than as the
        coefficient of $s$.
    targets:
      - quant-probability.mgf.pgf
    exercises:
      - quant-probability.random-variables.pmf

  - id: qmgf-pgf-03
    kind: decide
    difficulty: standard
    statement: >
      Which of these functions is a genuine probability generating function of
      some random variable on $\{0,1,2,\dots\}$?
    answer: >
      $\exp(3(s-1))$. Two conditions must both hold: the function is a power
      series in nonnegative powers of $s$ with nonnegative coefficients, and
      those coefficients sum to $1$, which is exactly $G(1) = 1$. For
      $\exp(3(s-1)) = e^{-3}\sum_{k \ge 0} 3^{k}s^{k}/k!$ every coefficient is
      $e^{-3}3^{k}/k! > 0$ and $G(1) = e^{0} = 1$; it is the Poisson$(3)$ PGF.
      The instructive failures are the two that pass one test and fail the
      other. $2 - s$ has $G(1) = 1$ but coefficient $-1$ on $s$, so the
      $G(1) = 1$ check is necessary and not sufficient. And $(1+s)/(2s) =
      1/(2s) + 1/2$ also has $G(1) = 1$ with positive coefficients, but the
      $s^{-1}$ term would mean mass at $-1$, which a count cannot have.
    choices:
      - text: >
          $G(s) = (1 + s)/3$
        feedback: >
          $G(1) = 2/3 \ne 1$, so the coefficients do not sum to $1$ — this is
          a pmf missing a third of its mass.
      - text: >
          $G(s) = 2 - s$
        feedback: >
          It does satisfy $G(1) = 1$, which is why it is tempting, but the
          coefficient of $s$ is $-1$ and no probability is negative.
      - text: >
          $G(s) = \exp(3(s-1))$
        correct: true
        feedback: >
          Expanding gives coefficients $e^{-3}3^{k}/k!$, all positive, and
          $G(1) = 1$ — the Poisson$(3)$ PGF.
      - text: >
          $G(s) = (1 + s)/(2s)$
        feedback: >
          $G(1) = 1$ and the coefficients are positive, but the $s^{-1}$ term
          assigns mass to $-1$; a PGF has only nonnegative powers of $s$.
    rubric:
      - >
        Applies both conditions — nonnegative coefficients on nonnegative
        powers, and $G(1) = 1$ — rather than only the second.
      - >
        Rejects $(1+s)/(2s)$ on the ground that a PGF is a power series in
        nonnegative powers, not because of its value anywhere.
    targets:
      - quant-probability.mgf.pgf
    exercises:
      - quant-probability.random-variables.pmf

  # --- reading probabilities off a PGF ----------------------------------------

  - id: qmgf-pgf-probabilities-01
    kind: work
    difficulty: demanding
    statement: >
      A count $X$ has probability generating function $G(s) = e^{3(s-1)}$. What
      is the probability that $X$ is even, counting $0$ as even? Give four
      decimal places.
    answer: >
      $0.5012$. Do not touch the pmf. Evaluating at $s = -1$ gives
      $G(-1) = \sum_k p_k(-1)^{k} = \Pr(X \text{ even}) -
      \Pr(X \text{ odd})$, while $G(1) = 1$ gives
      $\Pr(X \text{ even}) + \Pr(X \text{ odd}) = 1$. Adding the two and
      halving isolates $\Pr(X \text{ even}) = (1 + G(-1))/2$. Here
      $G(-1) = e^{3(-1-1)} = e^{-6} \approx 0.0024788$, so the answer is
      $(1 + 0.0024788)/2 \approx 0.5012394$. The number is barely above one
      half, and it should be: the alternating sum $e^{-6}$ is the only thing
      breaking the tie, and it is tiny. The trap is evaluating at $s = 0$ out
      of habit, which returns $\Pr(X = 0) = e^{-3}$ and answers a different
      question entirely.
    expects: "0.5012"
    tolerance: 0.0005
    rubric:
      - >
        Uses $s = -1$ to build the alternating sum, and combines it with
        $G(1) = 1$ rather than summing even-indexed terms one at a time.
      - >
        Reports a value just above $1/2$, and can say why the excess is
        $e^{-6}/2$.
    targets:
      - quant-probability.mgf.pgf-probabilities
    exercises:
      - quant-probability.mgf.pgf

  - id: qmgf-pgf-probabilities-02
    kind: work
    difficulty: standard
    statement: >
      A count $X$ has probability generating function
      $G(s) = (1 + 3s)^{4}/256$. Find $\Pr(X = 3)$.
    answer: >
      $27/64 \approx 0.4219$. Expand rather than differentiate:
      $(1+3s)^{4} = 1 + 4(3s) + 6(3s)^{2} + 4(3s)^{3} + (3s)^{4} =
      1 + 12s + 54s^{2} + 108s^{3} + 81s^{4}$, so
      $G(s) = (1 + 12s + 54s^{2} + 108s^{3} + 81s^{4})/256$ and the coefficient
      of $s^{3}$ is $108/256 = 27/64$. The normalization check passes:
      $G(1) = 4^{4}/256 = 1$. The derivative route agrees and shows where the
      factorial divisor lives — $G'''(s) = 4 \cdot 3 \cdot 2 \cdot 27
      (1+3s)/256$, so $G'''(0)/3! = (648/256)/6 = 108/256$ — and forgetting to
      divide by $3!$ is the one slip that route invites.
    expects: "27/64"
    tolerance: 0.0005
    rubric:
      - >
        Expands the fourth power and reads the $s^{3}$ coefficient rather than
        evaluating $G$ anywhere.
      - >
        If differentiating instead, divides $G'''(0)$ by $3!$.
    targets:
      - quant-probability.mgf.pgf-probabilities
    exercises:
      - quant-probability.mgf.pgf

  # --- factorial moments from derivatives at 1 --------------------------------

  - id: qmgf-pgf-factorial-moments-01
    kind: work
    difficulty: demanding
    statement: >
      A count $X$ has probability generating function
      $G(s) = \dfrac{0.4s}{1 - 0.6s}$, valid for $|s| < 5/3$. Find
      $\operatorname{Var}(X)$.
    answer: >
      $3.75$. Differentiate and evaluate at $s = 1$, not at $s = 0$. Writing
      $G(s) = 0.4s(1-0.6s)^{-1}$, the product rule gives
      $G'(s) = 0.4(1-0.6s)^{-1} + 0.24s(1-0.6s)^{-2}$, and at $s = 1$, where
      $1 - 0.6 = 0.4$, this is $0.4/0.4 + 0.24/0.16 = 1 + 1.5 = 2.5 =
      \mathbb{E}[X]$. Differentiating once more,
      $G''(s) = 0.24(1-0.6s)^{-2} + 0.24(1-0.6s)^{-2} + 0.288s(1-0.6s)^{-3}$,
      so $G''(1) = 1.5 + 1.5 + 0.288/0.064 = 3 + 4.5 = 7.5 =
      \mathbb{E}[X(X-1)]$. Then
      $\operatorname{Var}(X) = G''(1) + G'(1) - (G'(1))^{2} =
      7.5 + 2.5 - 6.25 = 3.75$. This is the geometric law with $p = 0.4$
      counted from the first trial, and the closed forms confirm both numbers:
      $1/p = 2.5$ and $(1-p)/p^{2} = 0.6/0.16 = 3.75$. The trap is dropping the
      $+G'(1)$ term, which converts the factorial moment
      $\mathbb{E}[X(X-1)]$ back into $\mathbb{E}[X^{2}]$; without it the
      variance would come out as $1.25$.
    expects: "3.75"
    rubric:
      - >
        Evaluates both derivatives at $s = 1$, and says why that is the point
        for moments even though probabilities are read at $s = 0$.
      - >
        Keeps the $+G'(1)$ correction in
        $\operatorname{Var}(X) = G''(1) + G'(1) - (G'(1))^{2}$.
    targets:
      - quant-probability.mgf.pgf-factorial-moments
    exercises:
      - quant-probability.mgf.pgf
      - quant-probability.expectation.expectation

  - id: qmgf-pgf-factorial-moments-02
    kind: work
    difficulty: standard
    statement: >
      A count $X$ has probability generating function
      $G(s) = (0.4 + 0.6s)^{5}$. Find $\mathbb{E}[X(X-1)]$.
    answer: >
      $7.2$. The second factorial moment is $G''(1)$. Differentiating twice by
      the chain rule, $G'(s) = 5(0.6)(0.4+0.6s)^{4}$ and
      $G''(s) = 5 \cdot 4 \cdot (0.6)^{2}(0.4+0.6s)^{3} =
      7.2\,(0.4+0.6s)^{3}$; at $s = 1$ the bracket is $1$, so $G''(1) = 7.2$.
      The law is Binomial$(5, 0.6)$, and the closed form agrees:
      $\mathbb{E}[X(X-1)] = n(n-1)p^{2} = 20(0.36) = 7.2$. As a check on the
      whole apparatus, $G'(1) = 3 = np$ and
      $\operatorname{Var}(X) = 7.2 + 3 - 9 = 1.2 = npq$. Answering $\mathbb{E}
      [X^{2}] = 10.2$ is the standard confusion: the derivative at $1$ gives
      the factorial moment, and the raw second moment needs $G'(1)$ added back.
    expects: "7.2"
    rubric:
      - >
        Differentiates twice and evaluates at $s = 1$, collapsing the bracket
        to $1$.
      - >
        Reports $\mathbb{E}[X(X-1)]$ and not $\mathbb{E}[X^{2}]$.
    targets:
      - quant-probability.mgf.pgf-factorial-moments
    exercises:
      - quant-probability.mgf.pgf

  # --- PGFs of the named discrete laws ----------------------------------------

  - id: qmgf-standard-pgfs-01
    kind: work
    difficulty: demanding
    statement: >
      Independent trials succeed with probability $0.4$ each. Let $X$ be the
      trial on which the third success arrives. Write the PGF from the table
      and use it to find $\Pr(X = 5)$.
    answer: >
      $0.13824$. The geometric PGF for the trial of the first success is
      $ps/(1-qs)$, and $X$ is the sum of three independent such waiting times,
      so the negative binomial entry applies:
      $G(s) = \left(\dfrac{0.4s}{1-0.6s}\right)^{3} =
      0.064\,s^{3}(1-0.6s)^{-3}$. Expanding the last factor with the
      generalized binomial series, $(1-0.6s)^{-3} =
      \sum_{j \ge 0}\binom{j+2}{2}(0.6s)^{j}$, so the coefficient of $s^{5}$
      needs $j = 2$: $0.064 \cdot \binom{4}{2} \cdot 0.36 =
      0.064 \cdot 6 \cdot 0.36 = 0.13824$. The direct pmf agrees —
      $\binom{4}{2}(0.4)^{3}(0.6)^{2}$, choosing which $2$ of the first $4$
      trials failed — which is the check worth running. The trap is starting
      the support at $0$: $X$ cannot be less than $3$, so $s^{3}$ must factor
      out before any coefficient is read.
    expects: "0.13824"
    tolerance: 0.00005
    rubric:
      - >
        Raises the geometric PGF to the third power rather than multiplying
        the geometric pmf by $3$.
      - >
        Factors out $s^{3}$ so that the coefficient extracted is at the right
        index, and cross-checks against
        $\binom{4}{2}(0.4)^{3}(0.6)^{2}$.
    targets:
      - quant-probability.mgf.standard-pgfs
    exercises:
      - quant-tools.series-calculus.geometric-series
      - quant-probability.counting.combinations

  - id: qmgf-standard-pgfs-02
    kind: decide
    difficulty: standard
    statement: >
      Which function is the probability generating function of a Poisson
      variable with mean $4$?
    answer: >
      $\exp(4(s-1))$. Derive it rather than recall it:
      $G(s) = \sum_{k \ge 0} e^{-4}4^{k}s^{k}/k! = e^{-4}\sum_{k \ge 0}
      (4s)^{k}/k! = e^{-4}e^{4s} = e^{4(s-1)}$, the exponential series doing
      all the work. Every wrong form here is caught by one of the two standing
      checks. $\exp(4s-1)$ gives $G(1) = e^{3} \ne 1$ and $4e^{s-1}$ gives
      $G(1) = 4$, so both fail normalization on sight. The subtle one is
      $\exp(4(1-s))$: it satisfies $G(1) = 1$, but expanding gives
      $e^{4}\sum_k(-4s)^{k}/k!$, whose odd coefficients are negative — the sign
      inside the exponent is not cosmetic.
    choices:
      - text: >
          $G(s) = \exp(4(s-1))$
        correct: true
        feedback: >
          Factoring $e^{-4}$ out of the Poisson pmf leaves the exponential
          series in $4s$, giving $e^{-4}e^{4s}$.
      - text: >
          $G(s) = \exp(4(1-s))$
        feedback: >
          The sign is reversed. This still has $G(1) = 1$, which is why it
          survives the quick check, but its odd coefficients are negative.
      - text: >
          $G(s) = \exp(4s - 1)$
        feedback: >
          The $4$ must multiply the whole of $s-1$. As written,
          $G(1) = e^{3} \ne 1$.
      - text: >
          $G(s) = 4e^{s-1}$
        feedback: >
          The mean has been pulled outside the exponential, so $G(1) = 4$; the
          parameter belongs in the exponent.
    rubric:
      - >
        Derives the form from the Poisson pmf and the exponential series
        rather than quoting it.
      - >
        Runs $G(1) = 1$ on the candidates, and knows it does not by itself
        eliminate $\exp(4(1-s))$.
    targets:
      - quant-probability.mgf.standard-pgfs
    exercises:
      - quant-probability.discrete.poisson

  - id: qmgf-standard-pgfs-03
    kind: work
    difficulty: standard
    statement: >
      $X$ is geometric with $p = 0.2$ on $\{1,2,\dots\}$, so the table gives
      $G(s) = ps/(1-qs)$. Evaluate $G(1.1)$, after checking that $1.1$ lies in
      the domain of the closed form.
    answer: >
      $11/6 \approx 1.8333$. The closed form comes from summing
      $\sum_{k \ge 1}q^{k-1}p\,s^{k}$ as a geometric series, which converges
      exactly when $|qs| < 1$, that is $|s| < 1/q$. Here $q = 0.8$, so the
      domain is $|s| < 1.25$ and $s = 1.1$ is inside it, comfortably but not
      by much. Substituting, $G(1.1) = 0.2(1.1)/(1 - 0.8(1.1)) =
      0.22/(1 - 0.88) = 0.22/0.12 = 11/6$. The value exceeding $1$ is not an
      error: $G$ is increasing and already equals $1$ at $s = 1$, so anything
      to the right of $1$ must be larger. The trap is quoting the formula with
      no domain, then using it at $s = 1.5$, where the underlying series
      diverges and the closed form returns a meaningless negative number.
    expects: "11/6"
    tolerance: 0.0005
    rubric:
      - >
        States the domain $|s| < 1/q$ and checks $1.1$ against it before
        substituting.
      - >
        Does not object to a PGF value greater than $1$ for $s > 1$.
    targets:
      - quant-probability.mgf.standard-pgfs
    exercises:
      - quant-tools.series-calculus.geometric-series

  # --- PGF of a sum of independents -------------------------------------------

  - id: qmgf-pgf-sums-01
    kind: work
    difficulty: demanding
    statement: >
      Three fair four-sided dice, faces $1$ to $4$, are rolled independently.
      Using generating functions, find the probability that the three faces
      total $7$.
    answer: >
      $3/16 = 0.1875$. One die has $G(s) = (s + s^{2} + s^{3} + s^{4})/4 =
      s(1 + s + s^{2} + s^{3})/4$, so three independent dice have
      $G(s)^{3} = s^{3}(1 + s + s^{2} + s^{3})^{3}/64$. A total of $7$ is the
      coefficient of $s^{7}$ there, which after pulling out $s^{3}$ is the
      coefficient of $s^{4}$ in $(1 + s + s^{2} + s^{3})^{3}$ — the number of
      triples $(a,b,c)$ of integers in $\{0,1,2,3\}$ summing to $4$. Without
      the upper bound, stars and bars gives $\binom{6}{2} = 15$; the excluded
      cases are those with some coordinate at least $4$, and since the total is
      only $4$ each such case is one of the three triples
      $(4,0,0), (0,4,0), (0,0,4)$. So the count is $15 - 3 = 12$ and the
      probability is $12/64 = 3/16$. The trap is forgetting that multiplying
      three polynomials already accounts for the ordering of the dice; there is
      no further factor to apply for permutations.
    expects: "3/16"
    rubric:
      - >
        Factors $s^{3}$ out of the cube before extracting a coefficient, so the
        index sought is $4$ and not $7$.
      - >
        Subtracts the three over-four cases from the unbounded stars-and-bars
        count rather than using $\binom{6}{2}$ directly.
    targets:
      - quant-probability.mgf.pgf-sums
    exercises:
      - quant-probability.mgf.pgf

  - id: qmgf-pgf-sums-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is Bernoulli$(0.25)$ and $Y$ is Bernoulli$(0.75)$, independent. Find
      $\Pr(X + Y = 1)$ by multiplying probability generating functions.
    answer: >
      $0.625$. The two PGFs are $G_X(s) = 0.75 + 0.25s$ and
      $G_Y(s) = 0.25 + 0.75s$, and independence lets them be multiplied:
      $G_{X+Y}(s) = (0.75 + 0.25s)(0.25 + 0.75s) =
      0.1875 + (0.5625 + 0.0625)s + 0.1875s^{2} =
      0.1875 + 0.625s + 0.1875s^{2}$. The coefficient of $s^{1}$ is $0.625$,
      and the three coefficients sum to $1$, which is the check. Direct
      convolution agrees: $\Pr(X{=}1,Y{=}0) + \Pr(X{=}0,Y{=}1) =
      0.25(0.25) + 0.75(0.75) = 0.0625 + 0.5625 = 0.625$. Note that the sum is
      *not* Binomial$(2, p)$ for any $p$ — the two success probabilities
      differ, so multiplying PGFs is doing real work here rather than
      reproducing a table entry.
    expects: "0.625"
    rubric:
      - >
        Multiplies the two polynomials and reads the $s^{1}$ coefficient,
        rather than adding the two probabilities.
      - >
        Does not treat the sum as binomial: the success probabilities are
        unequal.
    targets:
      - quant-probability.mgf.pgf-sums
    exercises:
      - quant-probability.mgf.pgf

  # --- no two loaded dice give a uniform sum -----------------------------------

  - id: qmgf-loaded-dice-01
    kind: work
    difficulty: demanding
    statement: >
      Two independent eight-sided dice, faces $1$ to $8$, are loaded however
      you like. Suppose their sum were uniform on the $15$ values
      $\{2,3,\dots,16\}$. Writing $G_i(s) = s\,h_i(s)$ and matching against the
      target $s^{2}(1 + s + \cdots + s^{14})/15$, what degree is each $h_i$
      forced to have?
    answer: >
      $7$, and the contradiction follows immediately. Each die has
      $G_i(s) = \sum_{k=1}^{8} p_{i,k}s^{k} = s\,h_i(s)$ with $h_i$ real of
      degree at most $7$. Independence gives $G_1G_2 = s^{2}h_1h_2$, and the
      uniform target is $s^{2}(1 + s + \cdots + s^{14})/15$, so
      $h_1h_2 = (1 + s + \cdots + s^{14})/15$, of degree $14$. Hence
      $\deg h_1 + \deg h_2 = 14$ with each at most $7$, which forces each to be
      exactly $7$. Now $7$ is odd, so each $h_i$ — a real polynomial of odd
      degree — takes values of both signs and by continuity has a real root
      $r$, whence $h_1(r)h_2(r) = 0$. But
      $1 + s + \cdots + s^{14} = (s^{15}-1)/(s-1)$ vanishes only at fifteenth
      roots of unity other than $1$, and since $15$ is odd, $-1$ is not among
      them; there are no real roots at all. So no loading works. The step to
      check before reusing this argument is exactly the parity of the forced
      degree: with an odd number of faces it comes out even and the one-line
      root argument does not fire.
    expects: "7"
    rubric:
      - >
        Matches degrees to get $\deg h_1 + \deg h_2 = 14$ with each bounded by
        $7$, and concludes each is exactly $7$.
      - >
        Notes that $7$ is odd, which is what supplies the real root, and that
        $(s^{15}-1)/(s-1)$ has none because $15$ is odd.
    targets:
      - quant-probability.mgf.loaded-dice
    exercises:
      - quant-probability.mgf.pgf-sums

  - id: qmgf-loaded-dice-02
    kind: decide
    difficulty: standard
    statement: >
      In the six-sided argument the target factor $1 + s + \cdots + s^{10} =
      (s^{11}-1)/(s-1)$ is said to have no real root. Which reason is correct?
    answer: >
      Its roots are the eleventh roots of unity other than $1$, and $11$ is
      odd, so $-1$ — the only real root of unity besides $1$ — is not among
      them. That is the whole argument: the eleven solutions of $s^{11} = 1$
      are $e^{2\pi i k/11}$, exactly one of which, $s = 1$, is real, and that
      one is cancelled by the denominator $s - 1$. The remaining ten come in
      conjugate pairs off the real axis. Contrast the six-sided factorization,
      where each $h_i$ is forced to degree $5$ and so must have a real root:
      the two facts cannot both hold, and that is the contradiction. Degree
      alone decides nothing here, and neither does positivity of the
      coefficients — $1 + s + s^{2} + s^{3}$ has all coefficients positive and
      a real root at $s = -1$.
    choices:
      - text: >
          Its roots are the eleventh roots of unity other than $1$, and $11$ is
          odd, so the only other real root of unity, $-1$, is not among them
        correct: true
        feedback: >
          Exactly — $(-1)^{11} = -1 \ne 1$, so $-1$ does not solve
          $s^{11} = 1$, and every remaining root is off the real axis.
      - text: >
          A polynomial of even degree never has a real root
        feedback: >
          False in general: $s^{2} - 1$ has degree $2$ and two real roots.
          Even degree only removes the *guarantee* of one.
      - text: >
          All its coefficients are positive, so it is positive for every real
          $s$
        feedback: >
          Positive coefficients force positivity only for $s \ge 0$. The
          polynomial $1 + s + s^{2} + s^{3}$ has all coefficients positive and
          vanishes at $s = -1$.
      - text: >
          It has degree $10$, and the fundamental theorem of algebra supplies
          only complex roots
        feedback: >
          The theorem supplies ten roots in the complex plane, and real
          numbers are complex numbers — it never rules a real root out.
    rubric:
      - >
        Identifies the roots as eleventh roots of unity and uses the oddness of
        $11$ to exclude $-1$.
      - >
        Does not argue from the degree alone or from positive coefficients.
    targets:
      - quant-probability.mgf.loaded-dice
    exercises:
      - quant-probability.mgf.pgf-sums

  # --- Sicherman dice ----------------------------------------------------------

  - id: qmgf-sicherman-dice-01
    kind: work
    difficulty: demanding
    statement: >
      A Sicherman pair has faces $\{1,2,2,3,3,4\}$ and $\{1,3,4,5,6,8\}$, each
      die fair. What is $\Pr(\text{the total is at least } 11)$?
    answer: >
      $1/12 \approx 0.0833$. Enumerate over the second die, whose large faces
      are the only ones that can reach $11$. With $b = 8$ the first die needs
      $a \ge 3$, and $\{1,2,2,3,3,4\}$ supplies three such faces — two $3$s and
      one $4$ — giving $3$ ordered outcomes. With $b = 6$ the requirement is
      $a \ge 5$, which no face of the first die meets, and every smaller $b$ is
      worse. So $3$ of the $36$ equally likely face pairs qualify:
      $3/36 = 1/12$. Standard dice give the same number — totals $11$ and $12$
      arise in $2 + 1 = 3$ ways — as they must, since the two pairs share the
      generating polynomial $s^{2}(1+s)^{2}(1+s+s^{2})^{2}(1-s+s^{2})^{2}$ and
      therefore share every coefficient. The trap is counting faces rather than
      ordered pairs: the two $3$s on the first die are distinct outcomes, and
      collapsing them to one would give $2/36$.
    expects: "1/12"
    tolerance: 0.0005
    rubric:
      - >
        Counts ordered face pairs out of $36$, treating the repeated $3$ on the
        first die as two outcomes.
      - >
        Checks the answer against the standard pair, and can say why the two
        must agree.
    targets:
      - quant-probability.mgf.sicherman-dice
    exercises:
      - quant-probability.mgf.loaded-dice

  - id: qmgf-sicherman-dice-02
    kind: work
    difficulty: standard
    statement: >
      For the same Sicherman pair, faces $\{1,2,2,3,3,4\}$ and
      $\{1,3,4,5,6,8\}$, what is $\Pr(\text{the total is } 6)$?
    answer: >
      $5/36 \approx 0.1389$. Run through the ways to write $6 = a + b$ with $a$
      on the first die and $b$ on the second. $a = 1, b = 5$: one way.
      $a = 2, b = 4$: two ways, because the face $2$ appears twice.
      $a = 3, b = 3$: two ways, again from the repeated $3$. $a = 4$ would need
      $b = 2$, which the second die does not carry, and $a = 5$ does not exist.
      Total $1 + 2 + 2 = 5$ out of $36$, so $5/36$ — exactly the standard-dice
      probability of a six, from $(1,5),(2,4),(3,3),(4,2),(5,1)$. The whole
      distribution is preserved because the product $G_1G_2$ is literally the
      same polynomial after regrouping its factors, not merely because the two
      pairs have the same average face.
    expects: "5/36"
    tolerance: 0.0005
    rubric:
      - >
        Weights each face pair by its multiplicity on the first die.
      - >
        Attributes the agreement with standard dice to the identical product
        polynomial, not to matching means.
    targets:
      - quant-probability.mgf.sicherman-dice
    exercises:
      - quant-probability.mgf.pgf-sums

  # --- compounding is composition ----------------------------------------------

  - id: qmgf-pgf-random-sums-01
    kind: work
    difficulty: demanding
    statement: >
      Claims arriving at a desk in one day number $N$, with
      $G_N(u) = \exp(4(u-1))$. Each claim is independently *large* with
      probability $0.25$. Let $L$ be the number of large claims that day. Find
      $\Pr(L = 0)$ to four decimal places.
    answer: >
      $0.3679$. Write $L = X_1 + \cdots + X_N$ with each $X_i$ the indicator of
      a large claim, so $G_X(s) = 0.75 + 0.25s$, and compose:
      $G_L(s) = G_N(G_X(s)) = \exp\left(4(0.75 + 0.25s - 1)\right) =
      \exp(4 \cdot 0.25 (s-1)) = \exp(s-1)$. That is again the exponential
      shape, now with parameter $1$, so $L$ is Poisson$(1)$ — thinning a
      Poisson stream by an independent coin leaves a Poisson stream with the
      rate multiplied by the coin's probability. Reading the answer off,
      $\Pr(L = 0) = G_L(0) = e^{-1} \approx 0.3679$. The mean check agrees:
      $\mathbb{E}[L] = \mathbb{E}[N]\mathbb{E}[X] = 4(0.25) = 1$. The trap is
      composing the wrong way round: $G_X(G_N(s))$ is
      $0.75 + 0.25\exp(4(s-1))$, which is not even a Poisson PGF, and the count
      of items must be the outer function.
    expects: "0.3679"
    tolerance: 0.0005
    rubric:
      - >
        Substitutes $G_X$ into $G_N$, in that order, and simplifies the
        exponent to $0.25 \cdot 4 (s-1)$.
      - >
        Identifies the result as Poisson$(1)$ and reads $\Pr(L=0)$ as
        $G_L(0)$.
    targets:
      - quant-probability.mgf.pgf-random-sums
    exercises:
      - quant-probability.mgf.pgf-sums

  - id: qmgf-pgf-random-sums-02
    kind: work
    difficulty: standard
    statement: >
      $N$ takes the values $0$, $1$ and $2$ with probabilities $0.2$, $0.5$ and
      $0.3$, and each $X_i$ is $0$ or $1$ with probability $0.5$ each, all
      independent. For $S = X_1 + \cdots + X_N$, find $\Pr(S = 1)$.
    answer: >
      $0.4$. The two ingredient PGFs are $G_N(u) = 0.2 + 0.5u + 0.3u^{2}$ and
      $G_X(s) = 0.5 + 0.5s$, and compounding composes them:
      $G_S(s) = G_N(G_X(s)) = 0.2 + 0.5(0.5+0.5s) + 0.3(0.5+0.5s)^{2}$.
      Expanding, $0.3(0.25 + 0.5s + 0.25s^{2}) =
      0.075 + 0.15s + 0.075s^{2}$, so
      $G_S(s) = 0.525 + 0.4s + 0.075s^{2}$, whose coefficients sum to $1$. The
      coefficient of $s^{1}$ is $\Pr(S = 1) = 0.4$. Conditioning directly
      confirms it: $N = 1$ with a success contributes $0.5(0.5) = 0.25$, and
      $N = 2$ with exactly one success contributes $0.3 \cdot 2 \cdot 0.25 =
      0.15$, totalling $0.4$. The empty sum matters — $N = 0$ contributes to
      $\Pr(S = 0)$, not to $\Pr(S = 1)$.
    expects: "0.4"
    rubric:
      - >
        Substitutes $G_X(s)$ for the argument of $G_N$ and expands before
        reading a coefficient.
      - >
        Handles $N = 0$ as the empty sum $S = 0$ rather than dropping it.
    targets:
      - quant-probability.mgf.pgf-random-sums
    exercises:
      - quant-probability.mgf.pgf

  # --- the moment generating function ------------------------------------------

  - id: qmgf-mgf-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ has the two-sided exponential density $f(x) = \dfrac{1}{2}e^{-|x|}$
      on all of $\mathbb{R}$. Find the set of $t$ where $M_X(t)$ is finite, and
      evaluate $M_X(0.5)$.
    answer: >
      $M_X(t) = \dfrac{1}{1-t^{2}}$ for $|t| < 1$, so
      $M_X(0.5) = 1/(1 - 0.25) = 4/3 \approx 1.3333$. By LOTUS, split the
      integral at the origin:
      $M_X(t) = \dfrac{1}{2}\int_{-\infty}^{0}e^{(t+1)x}\,dx +
      \dfrac{1}{2}\int_{0}^{\infty}e^{(t-1)x}\,dx$. The first converges exactly
      when $t + 1 > 0$ and equals $\dfrac{1}{2(1+t)}$; the second converges
      exactly when $t - 1 < 0$ and equals $\dfrac{1}{2(1-t)}$. Adding,
      $\dfrac{1}{2}\left(\dfrac{1}{1+t} + \dfrac{1}{1-t}\right) =
      \dfrac{1}{1-t^{2}}$ on $|t| < 1$, and outside that interval one tail
      integral diverges, so $M_X$ is genuinely infinite there. Two checks:
      $M_X(0) = 1$, as for every random variable, and $M_X$ is even, which it
      must be since the density is symmetric about $0$. The finite set is an
      interval containing $0$ and nothing larger — the standing hypothesis of
      this whole subject, met here with $h = 1$.
    expects: "4/3"
    tolerance: 0.0005
    rubric:
      - >
        Splits the integral at $0$ and derives the convergence condition on
        each half separately, arriving at $|t| < 1$.
      - >
        Checks $M_X(0) = 1$ and the evenness forced by the symmetric density.
    targets:
      - quant-probability.mgf.mgf

  - id: qmgf-mgf-02
    kind: work
    difficulty: standard
    statement: >
      $X$ takes the values $-1$, $0$ and $2$ with probabilities $0.5$, $0.2$
      and $0.3$. Compute $M_X(\ln 2)$.
    answer: >
      $1.65$. By LOTUS, $M_X(t) = 0.5e^{-t} + 0.2 + 0.3e^{2t}$, finite for
      every real $t$ because the support is finite. At $t = \ln 2$ the
      exponentials become powers of $2$: $e^{-\ln 2} = 1/2$ and
      $e^{2\ln 2} = 4$, so $M_X(\ln 2) = 0.5(0.5) + 0.2 + 0.3(4) =
      0.25 + 0.2 + 1.2 = 1.65$. Notice what could not have been done here: $X$
      takes a negative value, so $s^{X}$ is not defined for general $s$ and the
      PGF has nothing to say — this is precisely the gap $e^{tX}$ fills, since
      $e^{tx}$ makes sense for every real $x$. The check $M_X(0) = 0.5 + 0.2 +
      0.3 = 1$ still applies and catches a mis-transcribed weight.
    expects: "1.65"
    rubric:
      - >
        Writes $M_X$ as a weighted sum of $e^{tx}$ over the three values, with
        the negative value giving $e^{-t}$.
      - >
        Says why the PGF is unavailable here, rather than substituting $s = 2$
        into a PGF that does not exist.
    targets:
      - quant-probability.mgf.mgf

  - id: qmgf-mgf-03
    kind: decide
    difficulty: demanding
    statement: >
      Which of these functions cannot be the moment generating function of any
      random variable?
    answer: >
      $M(t) = \dfrac{1}{1+t^{2}}$. It passes the obvious test, $M(0) = 1$, and
      fails a structural one. For each fixed outcome $x$ the map
      $t \mapsto e^{tx}$ is convex, and an average of convex functions is
      convex, so every MGF is convex on the interval where it is finite. But
      $M(t) = (1+t^{2})^{-1}$ has $M'(t) = -2t(1+t^{2})^{-2}$ and
      $M''(0) = -2 < 0$: it is strictly concave at the origin, so no random
      variable has it. The same computation says it more sharply once moments
      are in hand, since $M''(0)$ would have to be $\mathbb{E}[X^{2}] \ge 0$.
      The other three are all genuine: $\exp(t^{2})$ is $N(0,2)$,
      $\tfrac{1}{2} + \tfrac{1}{2}e^{-t}$ belongs to the variable taking $0$
      and $-1$ with equal probability, and $\exp(3(e^{t}-1))$ is Poisson$(3)$.
    choices:
      - text: >
          $M(t) = \exp(t^{2})$
        feedback: >
          This is a normal MGF, $\exp(\mu t + \sigma^{2}t^{2}/2)$ with
          $\mu = 0$ and $\sigma^{2} = 2$ — convex, and finite for all $t$.
      - text: >
          $M(t) = \dfrac{1}{2} + \dfrac{1}{2}e^{-t}$
        feedback: >
          A negative exponent is not a defect: this is the variable taking $0$
          and $-1$ with probability $1/2$ each.
      - text: >
          $M(t) = \dfrac{1}{1+t^{2}}$
        correct: true
        feedback: >
          $M(0) = 1$, but $M''(0) = -2$, so the function is concave at the
          origin while every MGF is convex where it is finite.
      - text: >
          $M(t) = \exp(3(e^{t}-1))$
        feedback: >
          This is the Poisson$(3)$ MGF, obtained from the PGF
          $\exp(3(s-1))$ by the substitution $s = e^{t}$.
    rubric:
      - >
        Uses convexity of $t \mapsto e^{tX}$, or the sign of $M''(0)$, rather
        than only checking $M(0) = 1$.
      - >
        Recognises the three legitimate forms instead of rejecting one for
        carrying a negative exponent.
    targets:
      - quant-probability.mgf.mgf

  # --- moments from derivatives at 0 --------------------------------------------

  - id: qmgf-mgf-moments-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ has moment generating function $M_X(t) = (1-2t)^{-3}$, finite for
      $t < 1/2$. Find $\operatorname{Var}(X)$.
    answer: >
      $12$. Take logarithms first. The cumulant generating function is
      $K(t) = \ln M_X(t) = -3\ln(1-2t)$, so $K'(t) = 6/(1-2t)$ and
      $K''(t) = 12/(1-2t)^{2}$; evaluating at $0$ gives
      $\mathbb{E}[X] = K'(0) = 6$ and $\operatorname{Var}(X) = K''(0) = 12$,
      with no subtraction of squares anywhere. The direct route confirms it:
      $M_X'(t) = 6(1-2t)^{-4}$ and $M_X''(t) = 48(1-2t)^{-5}$, so
      $\mathbb{E}[X] = 6$ and $\mathbb{E}[X^{2}] = 48$, whence
      $48 - 36 = 12$. The law is the gamma with shape $3$ and rate $1/2$, whose
      mean $3/(1/2) = 6$ and variance $3/(1/2)^{2} = 12$ agree. Two traps: the
      derivatives go at $t = 0$, not at $t = 1$ where PGF moments live, and
      $K''(0)$ is the variance directly — reporting $48$ is $\mathbb{E}[X^{2}]$
      and reporting $36$ is the square of the mean.
    expects: "12"
    rubric:
      - >
        Evaluates derivatives at $t = 0$, and says why that differs from the
        PGF's $s = 1$.
      - >
        Either uses $K = \ln M$ and reads $K''(0)$, or subtracts
        $(\mathbb{E}[X])^{2}$ from $\mathbb{E}[X^{2}]$ — not both mixed
        together.
    targets:
      - quant-probability.mgf.mgf-moments
    exercises:
      - quant-probability.mgf.mgf

  - id: qmgf-mgf-moments-02
    kind: work
    difficulty: standard
    statement: >
      $X$ has moment generating function $M_X(t) = \exp(2t + 3t^{2})$, finite
      for every real $t$. Find $\mathbb{E}[X^{2}]$.
    answer: >
      $10$. Differentiate the exponential form. With
      $M_X(t) = e^{g(t)}$ and $g(t) = 2t + 3t^{2}$,
      $M_X'(t) = (2+6t)M_X(t)$, so $M_X'(0) = 2 = \mathbb{E}[X]$; and
      $M_X''(t) = 6M_X(t) + (2+6t)^{2}M_X(t)$, so
      $M_X''(0) = 6 + 4 = 10 = \mathbb{E}[X^{2}]$. The cumulant route gives the
      same pieces faster: $K(t) = 2t + 3t^{2}$ already, so $K'(0) = 2$ is the
      mean and $K''(0) = 6$ is the variance, and
      $\mathbb{E}[X^{2}] = 6 + 2^{2} = 10$. Matching the shape
      $\exp(\mu t + \sigma^{2}t^{2}/2)$ identifies $X$ as $N(2,6)$, which is
      the same reading. The common slip is answering $6$ — that is the
      variance, and the raw second moment needs the squared mean added back.
    expects: "10"
    rubric:
      - >
        Applies the product rule to $(2+6t)M_X(t)$ rather than differentiating
        the exponent alone.
      - >
        Reports $\mathbb{E}[X^{2}]$, adding $(\mathbb{E}[X])^{2}$ to the
        variance rather than reporting the variance.
    targets:
      - quant-probability.mgf.mgf-moments
    exercises:
      - quant-probability.mgf.mgf

  - id: qmgf-mgf-moments-03
    kind: justify
    difficulty: standard
    statement: >
      Assume $M_X(t) < \infty$ for $|t| < h$ with $h > 0$. Derive
      $M_X''(0) = \mathbb{E}[X^{2}]$, and say precisely which step consumes the
      finiteness hypothesis and what goes wrong without it.
    answer: >
      Expand the integrand: $e^{tX} = \sum_{k \ge 0} X^{k}t^{k}/k!$ pointwise.
      To take the expectation term by term, note first that all moments are
      finite: fix any $h'$ with $0 < h' < h$, so that $M_X(\pm h')$ are both
      finite by hypothesis, and use
      $|x|^{k} \le k!\,e^{h'|x|}/(h')^{k}$ — the single term
      $(h')^{k}|x|^{k}/k!$ of the series for $e^{h'|x|}$ — together with
      $\mathbb{E}[e^{h'|X|}] \le M_X(h') + M_X(-h') < \infty$. With that bound
      the partial sums are dominated for $|t| < h'$, so exchanging sum and
      expectation is legitimate and
      $M_X(t) = \sum_{k \ge 0}\mathbb{E}[X^{k}]t^{k}/k!$ there; letting
      $h' \uparrow h$ covers all of $(-h,h)$. That is
      an honest power series with radius at least $h$, hence infinitely
      differentiable term by term inside its interval, and differentiating
      twice at $0$ kills every term but the $k = 2$ one, leaving
      $M_X''(0) = 2!\,\mathbb{E}[X^{2}]/2! = \mathbb{E}[X^{2}]$. The
      hypothesis is consumed exactly at the exchange, and with it at the claim
      that the series has positive radius. Without finiteness on a
      neighbourhood the manipulation is empty: the Cauchy law has
      $M_X(t) = \infty$ for every $t \ne 0$, so $M_X$ is the constant $1$ only
      at the single point $0$ and there is nothing to differentiate — and
      indeed $\mathbb{E}[X^{2}]$ does not exist. Finiteness at isolated points,
      or finiteness of each moment separately, is not a substitute.
    rubric:
      - >
        Justifies the interchange of expectation and infinite sum, citing the
        bound $|x|^{k} \le k!\,e^{h'|x|}/(h')^{k}$ at an interior $h' < h$, or
        an equivalent domination — not at the endpoint $h$, where nothing is
        assumed.
      - >
        Locates the hypothesis at the interchange and at the positivity of the
        radius, not merely as a decorative preamble.
      - >
        Gives a case where it fails — the Cauchy, or any law with
        $M_X$ finite only at $0$ — rather than asserting the derivation always
        works.
    targets:
      - quant-probability.mgf.mgf-moments
    exercises:
      - quant-probability.mgf.mgf
      - quant-tools.series-calculus.taylor

  # --- MGF under affine maps -----------------------------------------------------

  - id: qmgf-mgf-scaling-01
    kind: work
    difficulty: demanding
    statement: >
      $X \sim N(3, 16)$, so $M_X(u) = \exp(3u + 8u^{2})$ for every real $u$.
      Let $Y = (5 - X)/2$. Find $M_Y(0.5)$ to four decimal places.
    answer: >
      $2.7183$. Write $Y$ in affine form first: $Y = aX + b$ with
      $a = -1/2$ and $b = 5/2$. The rule is
      $M_Y(t) = e^{bt}M_X(at)$, so
      $M_Y(t) = e^{2.5t}\exp\left(3(-t/2) + 8(t/2)^{2}\right) =
      e^{2.5t}\exp(-1.5t + 2t^{2}) = \exp(t + 2t^{2})$. That is the normal
      shape $\exp(\mu t + \sigma^{2}t^{2}/2)$ with $\mu = 1$ and
      $\sigma^{2} = 4$, matching the direct reading
      $\mathbb{E}[Y] = (5-3)/2 = 1$ and
      $\operatorname{Var}(Y) = 16/4 = 4$. At $t = 0.5$ the exponent is
      $0.5 + 2(0.25) = 1$, so $M_Y(0.5) = e \approx 2.7183$. Two traps: the
      shift contributes $e^{bt}$ and not $e^{b}$, and the scale enters as
      $M_X(at)$ — squaring or negating $a$ in the wrong place turns the
      variance from $4$ into $64$ or the mean from $1$ into $-1$.
    expects: "2.7183"
    tolerance: 0.0005
    rubric:
      - >
        Identifies $a = -1/2$ and $b = 5/2$ before applying
        $M_{aX+b}(t) = e^{bt}M_X(at)$.
      - >
        Cross-checks the resulting exponent against
        $\mathbb{E}[Y] = 1$ and $\operatorname{Var}(Y) = 4$.
    targets:
      - quant-probability.mgf.mgf-scaling
    exercises:
      - quant-probability.mgf.mgf

  - id: qmgf-mgf-scaling-02
    kind: work
    difficulty: standard
    statement: >
      $X$ has $M_X(u) = \dfrac{3}{3-u}$ for $u < 3$. Let $Y = 2X + 1$. Find
      $M_Y(0.5)$ to four decimal places, and state the domain of $M_Y$.
    answer: >
      $2.4731$, with $M_Y$ finite exactly for $t < 3/2$. The affine rule gives
      $M_Y(t) = e^{t}M_X(2t) = e^{t}\dfrac{3}{3-2t}$, and the domain transfers
      through the argument: $M_X(2t)$ is finite when $2t < 3$, that is
      $t < 1.5$. At $t = 0.5$ this is $e^{0.5}\cdot\dfrac{3}{3-1} =
      1.6487 \times 1.5 \approx 2.4731$. The scale factor genuinely moves the
      boundary — $X$ is exponential with rate $3$ and $Y$ is a shifted
      exponential with rate $3/2$, whose MGF must blow up at its own rate. The
      trap is carrying the original domain $t < 3$ across unchanged and then
      evaluating at, say, $t = 2$, where $3/(3-4)$ returns a negative number
      that no MGF can produce.
    expects: "2.4731"
    tolerance: 0.0005
    rubric:
      - >
        Applies $e^{bt}M_X(at)$ with $a = 2$, $b = 1$, keeping the shift inside
        the exponent.
      - >
        Rescales the domain to $t < 3/2$ rather than reusing $t < 3$.
    targets:
      - quant-probability.mgf.mgf-scaling
    exercises:
      - quant-probability.mgf.mgf

  # --- MGF of a sum of independents ----------------------------------------------

  - id: qmgf-mgf-sums-01
    kind: work
    difficulty: demanding
    statement: >
      $X \sim N(1,4)$, so $M_X(t) = \exp(t + 2t^{2})$, and independently $Y$
      takes the values $0$ and $2$ with probability $1/2$ each. Find
      $M_{X+Y}(1)$ to four decimal places.
    answer: >
      $84.2493$. Independence is what licenses the factorization:
      $e^{tX}$ and $e^{tY}$ are independent, so
      $M_{X+Y}(t) = \mathbb{E}[e^{tX}e^{tY}] = M_X(t)M_Y(t)$ wherever both are
      finite, which here is every real $t$. At $t = 1$,
      $M_X(1) = \exp(1+2) = e^{3}$ and
      $M_Y(1) = \tfrac{1}{2} + \tfrac{1}{2}e^{2}$, so
      $M_{X+Y}(1) = e^{3}\cdot\dfrac{1 + e^{2}}{2} =
      \dfrac{e^{3} + e^{5}}{2} \approx
      \dfrac{20.0855 + 148.4132}{2} \approx 84.2493$. Notice the sum is a
      mixture of two normals, $N(1,4)$ and $N(3,4)$, and not normal at all —
      multiplying MGFs is correct without the product landing on a table entry.
      The trap is reaching for a shortcut like $\exp(\mathbb{E}[X+Y])$ or
      adding the two MGF values; the rule is a product, and only because the
      variables are independent.
    expects: "84.2493"
    tolerance: 0.0005
    rubric:
      - >
        Multiplies $M_X(1)$ and $M_Y(1)$, naming independence as the step that
        allows it.
      - >
        Does not assume the sum is normal, or otherwise force the product into
        a named family.
    targets:
      - quant-probability.mgf.mgf-sums
    exercises:
      - quant-probability.mgf.mgf
      - quant-probability.joint.independence-rvs

  - id: qmgf-mgf-sums-02
    kind: work
    difficulty: standard
    statement: >
      $X$ takes $0$ or $2$ with probabilities $0.4$ and $0.6$, and
      independently $Y$ takes $0$ or $1$ with probabilities $0.2$ and $0.8$.
      Multiply moment generating functions to find $\Pr(X + Y = 2)$.
    answer: >
      $0.12$. The two MGFs are $M_X(t) = 0.4 + 0.6e^{2t}$ and
      $M_Y(t) = 0.2 + 0.8e^{t}$, and independence gives
      $M_{X+Y}(t) = M_X(t)M_Y(t) =
      0.08 + 0.32e^{t} + 0.12e^{2t} + 0.48e^{3t}$. For a variable on the
      integers the coefficient attached to $e^{kt}$ is $\Pr(X+Y = k)$, so the
      four coefficients are the whole law of the sum — they total $1$ — and
      $\Pr(X+Y=2) = 0.12$. The convolution done by hand gives the same thing
      one value at a time:
      $\Pr(X+Y=2) = \sum_k \Pr(X=k)\Pr(Y=2-k) =
      \Pr(X{=}0)\Pr(Y{=}2) + \Pr(X{=}2)\Pr(Y{=}0) = 0 + 0.6(0.2) = 0.12$,
      since $Y$ never takes the value $2$. That is the trade the transform
      makes: one multiplication of two short sums replaces a separate
      convolution for every $k$.
    expects: "0.12"
    rubric:
      - >
        Reads $\Pr(X+Y=k)$ off the coefficient of $e^{kt}$, and checks the four
        coefficients sum to $1$.
      - >
        Runs the convolution sum as a cross-check, noticing that
        $\Pr(Y = 2) = 0$ kills one of its two terms.
    targets:
      - quant-probability.mgf.mgf-sums
      - quant-probability.joint.convolution
    exercises:
      - quant-probability.joint.independence-rvs
    connects:
      - "quant-probability.joint.convolution ~ quant-probability.mgf.mgf-sums"

  - id: qmgf-mgf-sums-03
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $M_{X+Y}(t) = M_X(t)M_Y(t)$ for independent $X$ and $Y$ on the
      common interval where both are finite. Then exhibit a *dependent* pair
      for which the identity still holds, so that the converse fails.
    answer: >
      For the proof: fix $t$ with both MGFs finite. Independence of $X$ and $Y$
      makes $e^{tX}$ and $e^{tY}$ independent, since each is a measurable
      function of one variable alone, and the expectation of a product of
      independent integrable variables factors. Hence
      $M_{X+Y}(t) = \mathbb{E}[e^{t(X+Y)}] = \mathbb{E}[e^{tX}e^{tY}] =
      \mathbb{E}[e^{tX}]\,\mathbb{E}[e^{tY}] = M_X(t)M_Y(t)$, and finiteness of
      the product is what keeps the left side finite too. Note what is used:
      independence, not zero correlation — uncorrelatedness gives
      $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$ and says nothing about
      $\mathbb{E}[e^{tX}e^{tY}]$. For the converse, let $X$ and $Y$ each be
      uniform on $\{0,1,2\}$ with the joint probabilities, in units of $1/9$,
      given by the rows $(1,2,0)$, $(0,1,2)$ and $(2,0,1)$, where row $i$ is
      $X = i$ and column $j$ is $Y = j$. Every row and every column totals $3$
      units, so both marginals are uniform on $\{0,1,2\}$ as claimed, yet
      $\Pr(X{=}0,Y{=}2) = 0 \ne \tfrac{1}{9}$, so the pair is dependent.
      Collecting cells by $X + Y$ gives $1, 2, 3, 2, 1$ units for the totals
      $0,1,2,3,4$ — exactly the counts the independent product would give. So
      $X+Y$ has the convolution law, $M_{X+Y} = M_XM_Y$ holds identically, and
      independence still fails. A matching product MGF is a consequence of
      independence and never a certificate of it.
    rubric:
      - >
        Derives the factorization from independence of $e^{tX}$ and $e^{tY}$,
        and says explicitly that uncorrelatedness would not suffice.
      - >
        Exhibits a dependent pair whose sum has the convolution law, and
        verifies both the marginals and the totals rather than asserting them.
      - >
        Concludes that the implication runs one way only.
    targets:
      - quant-probability.mgf.mgf-sums
    exercises:
      - quant-probability.joint.independence-rvs

  # --- MGFs of the named laws ------------------------------------------------------

  - id: qmgf-standard-mgfs-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is gamma with shape $4$ and rate $\lambda = 5$. Write its MGF from
      the table, state the domain, and evaluate $M_X(2)$.
    answer: >
      $M_X(t) = \left(\dfrac{5}{5-t}\right)^{4}$ for $t < 5$, so
      $M_X(2) = (5/3)^{4} = 625/81 \approx 7.7160$. The entry is the
      exponential's raised to the shape, because a gamma of integer shape $4$
      and rate $5$ is the sum of four independent Exponential$(5)$ variables
      and independent MGFs multiply. The domain does not change under that
      power: each factor needs $t < \lambda = 5$, so the product does too, and
      the cut-off sits at the rate at which the tail decays rather than at
      $4\lambda$ or $\lambda/4$. Substituting, $5 - 2 = 3$ and
      $(5/3)^{4} = 625/81$. Two checks: $M_X(0) = 1$, and
      $\mathbb{E}[X] = M_X'(0) = 4/5$, matching shape over rate. Answering
      $(5/(5-2))^{1} = 5/3$ drops the shape; using $t = 2$ with a domain of
      $t < 20$ would be harmless here but wrong in general.
    expects: "625/81"
    tolerance: 0.0005
    rubric:
      - >
        Raises the exponential entry to the fourth power and keeps the domain
        at $t < \lambda$, not $t < 4\lambda$.
      - >
        Evaluates $(5/3)^{4}$ rather than $5/3$, and can justify the power by
        the sum of four independent exponentials.
    targets:
      - quant-probability.mgf.standard-mgfs
    exercises:
      - quant-probability.mgf.mgf

  - id: qmgf-standard-mgfs-02
    kind: decide
    difficulty: standard
    statement: >
      A variable has $M(t) = \dfrac{0.3e^{t}}{1 - 0.7e^{t}}$, finite for
      $t < \ln(10/7)$. Which law is it?
    answer: >
      The geometric law with $p = 0.3$ counted as the trial of the first
      success, on $\{1,2,\dots\}$. Its PGF is $ps/(1-qs)$, and the substitution
      $s = e^{t}$ turns that into $pe^{t}/(1-qe^{t})$ — which is the given
      function with $p = 0.3$, $q = 0.7$. The domain agrees too: convergence
      needs $qe^{t} < 1$, that is $t < \ln(1/q) = \ln(10/7) \approx 0.357$. The
      factor $e^{t}$ in the numerator is the whole tell. Counting failures
      before the first success instead shifts the support down by one and
      removes exactly that factor, leaving $p/(1-qe^{t})$; the two conventions
      differ by a mean of $1$, so mixing them costs an entire unit of
      expectation.
    choices:
      - text: >
          Geometric$(0.3)$ counted as the trial of the first success, on
          $\{1,2,\dots\}$
        correct: true
        feedback: >
          Substituting $s = e^{t}$ into the PGF $ps/(1-qs)$ gives exactly this,
          and the domain $t < \ln(1/q)$ matches.
      - text: >
          Geometric$(0.3)$ counted as failures before the first success, on
          $\{0,1,\dots\}$
        feedback: >
          That version has MGF $p/(1-qe^{t})$, with no $e^{t}$ upstairs. The
          missing factor is exactly the shift of the support by one.
      - text: >
          Bernoulli$(0.3)$
        feedback: >
          Bernoulli has the polynomial MGF $0.7 + 0.3e^{t}$, finite for every
          real $t$ — a bounded variable never has a one-sided domain.
      - text: >
          Exponential with rate $0.3$
        feedback: >
          The exponential MGF is $\lambda/(\lambda - t)$, a rational function
          of $t$ itself. A rational function of $e^{t}$ signals a lattice law.
    rubric:
      - >
        Recovers the form by substituting $s = e^{t}$ into a PGF rather than
        matching by eye.
      - >
        Uses the numerator factor $e^{t}$, or the stated domain, to pick
        between the two geometric conventions.
    targets:
      - quant-probability.mgf.standard-mgfs
    exercises:
      - quant-probability.mgf.mgf

  - id: qmgf-standard-mgfs-03
    kind: work
    difficulty: standard
    statement: >
      $X$ is geometric with $p = 0.4$ on $\{1,2,\dots\}$, with MGF
      $pe^{t}/(1-qe^{t})$. The set of $t$ where $M_X(t)$ is finite is an
      interval $(-\infty, t^{*})$. Give $t^{*}$ to four decimal places.
    answer: >
      $0.5108$. The defining sum is
      $\sum_{k \ge 1}q^{k-1}p\,e^{tk} = pe^{t}\sum_{k \ge 1}(qe^{t})^{k-1}$, a
      geometric series in the ratio $qe^{t}$, which converges exactly when
      $qe^{t} < 1$. With $q = 0.6$ that is $e^{t} < 1/0.6 = 5/3$, that is
      $t < \ln(5/3) \approx 0.5108256$, so
      $t^{*} = \ln(5/3) \approx 0.5108$. The boundary is not a technicality:
      at $t = t^{*}$ the ratio is exactly $1$ and the series is a sum of
      constants, which diverges, and beyond it the terms grow. The pattern is
      general — a law whose tail decays like $q^{k}$ can absorb an extra
      $e^{tk}$ only up to the rate at which it decays — and the same reasoning
      places the exponential's cut-off at its rate $\lambda$. Reporting
      $\ln(1/p) = \ln 2.5$ swaps $p$ for $q$ and is the standard slip.
    expects: "0.5108"
    tolerance: 0.0005
    rubric:
      - >
        Derives the condition $qe^{t} < 1$ from the geometric series rather
        than recalling a bound.
      - >
        Uses $q = 0.6$, not $p = 0.4$, in $\ln(1/q)$.
    targets:
      - quant-probability.mgf.standard-mgfs
    exercises:
      - quant-probability.mgf.mgf

  # --- uniqueness: a transform identifies the law ------------------------------------

  - id: qmgf-identification-01
    kind: work
    difficulty: demanding
    statement: >
      A count $X$ has $M_X(t) = \dfrac{1}{(2 - e^{t})^{3}}$ for $t < \ln 2$.
      Identify the law and find $\Pr(X = 3)$.
    answer: >
      $5/32 = 0.15625$. Match the transform to a known form rather than
      inverting anything. Rewrite one factor as
      $\dfrac{1}{2-e^{t}} = \dfrac{1/2}{1 - \tfrac{1}{2}e^{t}}$, which is
      $p/(1-qe^{t})$ with $p = q = 1/2$ — the geometric MGF in the convention
      that counts failures before the first success, on $\{0,1,2,\dots\}$, and
      whose domain $qe^{t} < 1$ is exactly the stated $t < \ln 2$. Cubing it
      is the MGF of a sum of three independent such variables, so $X$ is
      negative binomial with $r = 3$ and $p = 1/2$, counting failures. By
      uniqueness that identification is complete, and the pmf may be read from
      the table: $\Pr(X = k) = \binom{k+2}{2}(1/2)^{3}(1/2)^{k}$, so
      $\Pr(X = 3) = \binom{5}{2}(1/2)^{6} = 10/64 = 5/32$. Expanding the
      transform directly agrees — $\tfrac{1}{8}\sum_{j}\binom{j+2}{2}
      (e^{t}/2)^{j}$ has $\binom{5}{2}/64$ on $e^{3t}$. The trap is reading
      $M_X(0) = 1$ as confirmation of the answer: every MGF satisfies it, so it
      confirms only that no algebra was dropped.
    expects: "5/32"
    rubric:
      - >
        Normalizes $1/(2-e^{t})$ into the $p/(1-qe^{t})$ shape before naming
        anything, and reads $p = 1/2$ off it.
      - >
        Uses the cube to get $r = 3$, and picks the failures-counted
        convention, checking it against the support and the stated domain.
    targets:
      - quant-probability.mgf.identification
    exercises:
      - quant-probability.mgf.mgf

  - id: qmgf-identification-02
    kind: decide
    difficulty: standard
    statement: >
      $X$ and $Y$ have MGFs that are finite everywhere and satisfy
      $M_X(t) = M_Y(t)$ at the three points $t = -1, 0, 1$ and nowhere else is
      it known. What follows about their laws?
    answer: >
      Nothing. The uniqueness theorem asks for agreement on an interval around
      $0$, not at finitely many points, and here only two of the three
      equations carry any information at all: $M_X(0) = M_Y(0) = 1$ holds for
      every pair of variables whatsoever. A concrete pair settles it. Let $X$
      take $-1$ and $1$ with probability $1/2$ each, so
      $M_X(t) = (e^{t}+e^{-t})/2$ and $M_X(\pm 1) = \cosh 1 \approx 1.5431$.
      Let $Y$ take $-2$ and $2$ with probability $w$ each and $0$ with
      probability $1-2w$, so $M_Y(\pm 1) = 1 + w(e^{2}+e^{-2}-2)$; choosing
      $w = (\cosh 1 - 1)/(e^{2}+e^{-2}-2) \approx 0.0983$ makes that equal
      $\cosh 1$ as well. Both MGFs are finite everywhere and agree at
      $t = -1, 0, 1$, yet the laws differ — different supports, and different
      variances, $1$ against $8w \approx 0.7864$. The pair here is symmetric
      only because that makes the arithmetic short: two equations leave a
      law on three or more atoms a free degree, so pairs differing in the mean
      as well are just as easy to build. Two equations cannot pin down
      a distribution. The correct hypothesis is agreement, and finiteness, on
      $(-h,h)$ for some $h > 0$.
    choices:
      - text: >
          They have the same distribution
        feedback: >
          That is the conclusion of the uniqueness theorem, but its hypothesis
          is agreement on an interval around $0$, which three points are not.
      - text: >
          Nothing about their laws: uniqueness needs agreement on an interval
          around $0$, not at isolated points
        correct: true
        feedback: >
          Finitely many equations cannot pin down a distribution, and the
          equation at $t = 0$ is satisfied by every pair of variables.
      - text: >
          They have the same mean and the same variance
        feedback: >
          Those come from derivatives at $0$, and a derivative needs the
          function on a whole neighbourhood — three sample values give none.
      - text: >
          They have the same mean, but their variances may differ
        feedback: >
          Even the mean is out of reach: $M_X'(0)$ cannot be computed from the
          values of $M_X$ at three isolated points.
    rubric:
      - >
        States the hypothesis of MGF uniqueness as agreement on an interval
        around $0$, with both sides finite there.
      - >
        Notes that $M_X(0) = M_Y(0) = 1$ carries no information at all.
    targets:
      - quant-probability.mgf.identification
    exercises:
      - quant-probability.mgf.mgf

  - id: qmgf-identification-03
    kind: justify
    difficulty: demanding
    statement: >
      A candidate argues: "$X$ and $Y$ have $\mathbb{E}[X^{k}] =
      \mathbb{E}[Y^{k}]$ for every $k \ge 1$, and all these moments are finite,
      so $X$ and $Y$ have the same law." Say what is wrong, name the standard
      counterexample, and state a hypothesis that does repair the argument.
    answer: >
      The argument is invalid as it stands. Matching every moment is strictly
      weaker than matching the transform, because the moments determine the law
      only when the series $\sum_k \mathbb{E}[X^{k}]t^{k}/k!$ actually
      converges for some $t \ne 0$ — that is, only when an MGF exists near $0$.
      Finiteness of each moment separately says nothing about the growth of the
      sequence, and it is the growth that decides. The standard counterexample
      is the lognormal: if $Z$ is standard normal and $X = e^{Z}$, then
      $\mathbb{E}[X^{k}] = \mathbb{E}[e^{kZ}] = e^{k^{2}/2}$, finite for every
      $k$ yet growing fast enough that the moment series has radius of
      convergence $0$ and $M_X(t) = \infty$ for every $t > 0$. Perturbing the
      lognormal density by a factor $1 + a\sin(2\pi\ln x)$ with $|a| \le 1$
      gives a whole family of genuinely different densities whose every moment
      agrees with the lognormal's, so the hypothesis of the candidate's claim
      holds while its conclusion fails. The repair is exactly the hypothesis of
      the uniqueness theorem: require that $M_X$ and $M_Y$ be finite and equal
      on $(-h,h)$ for some $h > 0$. Then the two laws coincide, and the
      matching moments come along for free rather than being assumed. A weaker
      sufficient condition is Carleman's, that
      $\sum_k \mathbb{E}[X^{2k}]^{-1/(2k)}$ diverge, which controls precisely
      the growth the lognormal violates.
    rubric:
      - >
        Locates the gap in the growth of the moment sequence, not in whether
        the individual moments exist.
      - >
        Names the lognormal, and says both that it has all moments finite and
        that it shares them with other laws.
      - >
        Replaces the hypothesis with finiteness and agreement of the MGFs on a
        neighbourhood of $0$, rather than with a longer list of moments.
    targets:
      - quant-probability.mgf.identification
    exercises:
      - quant-probability.mgf.mgf

  # --- sums of named laws by multiplying MGFs -----------------------------------------

  - id: qmgf-additive-families-01
    kind: work
    difficulty: demanding
    statement: >
      $X \sim$ Binomial$(8, 0.25)$ and $Y \sim$ Binomial$(4, 0.25)$ are
      independent. Find $\Pr(X + Y = 1)$ to four decimal places.
    answer: >
      $0.1267$. Multiply the transforms and read the product off the table:
      $M_X(t)M_Y(t) = (0.75 + 0.25e^{t})^{8}(0.75 + 0.25e^{t})^{4} =
      (0.75 + 0.25e^{t})^{12}$, which is the Binomial$(12, 0.25)$ MGF, so by
      uniqueness $X + Y \sim$ Binomial$(12, 0.25)$. Hence
      $\Pr(X+Y=1) = \binom{12}{1}(0.25)(0.75)^{11} = 3(0.75)^{11} \approx
      3(0.0422351) \approx 0.1267$. The bases had to match for this to work:
      the exponents add only because both factors are powers of the *same*
      $0.75 + 0.25e^{t}$. Two independent binomials with different success
      probabilities — say $0.25$ and $0.4$ — give a product that matches no
      entry, and their sum has no name. The other trap is adding the
      parameters indiscriminately and reporting Binomial$(12, 0.5)$.
    expects: "0.1267"
    tolerance: 0.0005
    rubric:
      - >
        Adds the exponents only after checking that both MGFs are powers of the
        same base, so the shared $p$ is what makes the family additive.
      - >
        Uses $n = 12$ and $p = 0.25$ in the pmf, not a summed or averaged $p$.
    targets:
      - quant-probability.mgf.additive-families
    exercises:
      - quant-probability.mgf.mgf-sums
      - quant-probability.mgf.standard-mgfs

  - id: qmgf-additive-families-02
    kind: decide
    difficulty: standard
    statement: >
      $X \sim$ Poisson$(3)$ and $Y \sim$ Binomial$(5, 0.6)$ are independent.
      What does multiplying their MGFs tell you about $X + Y$?
    answer: >
      That its MGF is $\exp(3(e^{t}-1))\,(0.4 + 0.6e^{t})^{5}$, and that this
      matches no entry of the table, so $X + Y$ has no standard name. The
      product rule always applies — independence is all it needs — but the
      recognition step is a separate matter, and it succeeds only when the two
      factors belong to a family closed under multiplication of its
      transforms. Poisson MGFs multiply into Poisson MGFs because their
      exponents add; binomial MGFs with a common $p$ multiply into binomial
      MGFs because their exponents add; a Poisson and a binomial share no such
      shape. What survives regardless is the arithmetic of moments:
      $\mathbb{E}[X+Y] = 3 + 3 = 6$ and, by independence,
      $\operatorname{Var}(X+Y) = 3 + 5(0.6)(0.4) = 4.2$. Matching means is
      exactly the reasoning that produces the wrong answer Poisson$(6)$ here,
      since a Poisson would need its variance to be $6$ as well.
    choices:
      - text: >
          Nothing beyond the product itself: $\exp(3(e^{t}-1))(0.4+0.6e^{t})^{5}$
          matches no table entry, so the sum has no standard name
        correct: true
        feedback: >
          The product rule holds, but recognition needs the two factors to
          share an algebraic shape, and these do not.
      - text: >
          $X + Y \sim$ Poisson$(6)$, since the means add
        feedback: >
          Means always add, for any variables at all. A Poisson$(6)$ would also
          need variance $6$, whereas $\operatorname{Var}(X+Y) = 4.2$.
      - text: >
          $X + Y \sim$ Binomial$(8, 0.6)$
        feedback: >
          Binomials add only when they share $p$ and the transform is a power
          of the same base; a Poisson factor is not such a power.
      - text: >
          The product rule does not apply, because the two laws are of
          different types
        feedback: >
          It applies to any independent pair, discrete or continuous. What
          fails is only the step of naming the product.
    rubric:
      - >
        Separates the product rule, which always holds under independence, from
        the recognition step, which needs a shared shape.
      - >
        Rejects Poisson$(6)$ on the variance, not on a vague appeal to
        different families.
    targets:
      - quant-probability.mgf.additive-families
    exercises:
      - quant-probability.mgf.standard-mgfs

  # --- when the MGF is infinite ---------------------------------------------------------

  - id: qmgf-mgf-nonexistence-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is exponential with rate $2$, so $M_X(t) = \dfrac{2}{2-t}$ for
      $t < 2$. Optimize the bound $\Pr(X \ge 3) \le e^{-3t}M_X(t)$ over
      $t \in (0,2)$ and report the best bound to four decimal places.
    answer: >
      $0.0404$. The bound itself comes from Markov applied to $e^{tX}$: for
      $t > 0$, $\Pr(X \ge 3) = \Pr(e^{tX} \ge e^{3t}) \le
      \mathbb{E}[e^{tX}]e^{-3t}$. Minimize the logarithm, which is easier:
      $f(t) = -3t + \ln 2 - \ln(2-t)$ has $f'(t) = -3 + \dfrac{1}{2-t}$, zero
      when $2 - t = 1/3$, that is $t = 5/3$, which lies in $(0,2)$; and
      $f''(t) = (2-t)^{-2} > 0$, so this is the minimum. The value there is
      $e^{-5}\cdot\dfrac{2}{1/3} = 6e^{-5} \approx 6(0.00673795) \approx
      0.0404277$. Sanity: the true probability is $e^{-6} \approx 0.00248$, so
      the bound is valid and about sixteen times loose — Chernoff buys the
      right exponential decay, not the right constant. The trap is letting $t$
      drift to the edge of the domain: as $t \uparrow 2$ the factor
      $2/(2-t)$ blows up faster than $e^{-3t}$ shrinks, so the bound becomes
      infinite and says nothing.
    expects: "0.0404"
    tolerance: 0.0005
    rubric:
      - >
        Optimizes over $t$ rather than picking one, and checks the optimum lies
        strictly inside the domain of $M_X$.
      - >
        Compares the bound with the exact $e^{-6}$ and reports it as an upper
        bound, not as the probability.
    targets:
      - quant-probability.mgf.mgf-nonexistence
    exercises:
      - quant-probability.mgf.mgf

  - id: qmgf-mgf-nonexistence-02
    kind: decide
    difficulty: standard
    statement: >
      For the standard lognormal $X = e^{Z}$ with $Z$ standard normal, every
      moment $\mathbb{E}[X^{k}]$ is finite, yet $M_X(t) = \infty$ for every
      $t > 0$. Which statement resolves the apparent conflict?
    answer: >
      The moment series has radius of convergence $0$. Computing,
      $\mathbb{E}[X^{k}] = \mathbb{E}[e^{kZ}] = e^{k^{2}/2}$ — finite for every
      $k$, but growing like the exponential of a *square*, so the terms
      $\mathbb{E}[X^{k}]t^{k}/k!$ behave like $e^{k^{2}/2}t^{k}/k!$ and, since
      $e^{k^{2}/2}$ beats $k!$, they blow up for every $t \ne 0$. There is no
      conflict because "all moments finite" and "the moment series converges
      somewhere" are different statements, and only the second is equivalent to
      an MGF near $0$. This is why the lognormal is the standard cautionary
      case for uniqueness: its moments are all finite and are shared with other
      laws, so they cannot pin it down.
    choices:
      - text: >
          The moments grow like $e^{k^{2}/2}$, too fast for
          $\sum_k \mathbb{E}[X^{k}]t^{k}/k!$ to converge at any $t \ne 0$
        correct: true
        feedback: >
          Exactly: finiteness of each term says nothing about the growth of the
          sequence, and it is the growth that governs the series.
      - text: >
          Finiteness of every moment does imply a finite MGF, so the premise is
          simply false
        feedback: >
          The implication runs the other way only: a finite MGF near $0$ forces
          every moment finite, never the reverse.
      - text: >
          The lognormal has no mean, so no MGF can exist
        feedback: >
          It has a mean, $\mathbb{E}[X] = e^{1/2} \approx 1.6487$, and a
          variance. The failure is in the right tail, not in the first moment.
      - text: >
          The moments are finite only for even $k$
        feedback: >
          $X$ is positive, so $\mathbb{E}[X^{k}] = e^{k^{2}/2}$ is finite for
          every $k$, odd and even alike.
    rubric:
      - >
        Computes $\mathbb{E}[X^{k}] = e^{k^{2}/2}$ from
        $\mathbb{E}[e^{kZ}]$ rather than asserting the growth rate.
      - >
        Distinguishes each moment being finite from the moment series having
        positive radius of convergence.
    targets:
      - quant-probability.mgf.mgf-nonexistence
      - quant-probability.continuous.lognormal
    exercises:
      - quant-probability.mgf.mgf-moments
    connects:
      - "quant-probability.continuous.lognormal ~ quant-probability.mgf.mgf-nonexistence"

  # --- characteristic function ----------------------------------------------------------

  - id: qmgf-characteristic-function-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is uniform on $\{-1, 0, 1\}$. Find its characteristic function
      $\varphi_X$, then evaluate $\varphi_X(2\pi/3)$.
    answer: >
      $\varphi_X(t) = \dfrac{1 + 2\cos t}{3}$, and
      $\varphi_X(2\pi/3) = 0$. By LOTUS,
      $\varphi_X(t) = \tfrac{1}{3}\left(e^{-it} + e^{0} + e^{it}\right)$, and
      $e^{it} + e^{-it} = 2\cos t$, so $\varphi_X(t) = (1 + 2\cos t)/3$ — real
      valued, as it must be for a law symmetric about $0$. At $t = 2\pi/3$,
      $\cos(2\pi/3) = -1/2$, so $\varphi_X(2\pi/3) = (1 - 1)/3 = 0$. Two things
      to take from the zero. First, a characteristic function may vanish at
      some points — only $\varphi_X(0) = 1$ is guaranteed, and
      $|\varphi_X(t)| \le 1$ everywhere since it averages numbers of modulus
      $1$. Second, the transform is finite here for every real $t$ without any
      assumption on tails, which is the entire reason it replaces the MGF when
      $\mathbb{E}[e^{tX}]$ is infinite. The trap is expecting a modulus that
      stays strictly positive, or reading a zero as a computational error.
    expects: "0"
    rubric:
      - >
        Combines $e^{it}$ and $e^{-it}$ into $2\cos t$ and notes that the
        result is real because the law is symmetric about $0$.
      - >
        Accepts the value $0$, citing $|\varphi_X| \le 1$ with equality only
        forced at $t = 0$.
    targets:
      - quant-probability.mgf.characteristic-function
    exercises:
      - quant-probability.expectation.lotus

  - id: qmgf-characteristic-function-02
    kind: decide
    difficulty: standard
    statement: >
      Which property does the characteristic function have that the moment
      generating function may lack?
    answer: >
      It is finite for every real $t$ and every random variable, with no
      assumption on tails. The reason is one line: $|e^{itx}| = 1$ for all real
      $t$ and $x$, since $\cos^{2} + \sin^{2} = 1$, so $\varphi_X(t) =
      \mathbb{E}[e^{itX}]$ averages quantities of modulus $1$ and can never
      diverge, whereas $e^{tx}$ is unbounded and the MGF can be infinite for
      every $t \ne 0$. What does *not* change is everything that needed
      independence: $\varphi_{X+Y} = \varphi_X\varphi_Y$ still requires
      independent summands. And the free existence does not hand back the
      moments — differentiating $\varphi_X$ at $0$ recovers
      $\mathbb{E}[X^{k}]$ only when that moment exists, and the standard Cauchy
      has the perfectly nice $\varphi(t) = e^{-|t|}$, which is not
      differentiable at $0$ precisely because the mean does not exist.
    choices:
      - text: >
          It is finite for every real $t$ and every random variable, with no
          tail assumption
        correct: true
        feedback: >
          $|e^{itX}| = 1$ bounds the integrand, so the average exists
          unconditionally — the repair for every law with no MGF.
      - text: >
          Its derivatives at $0$ always return the moments
        feedback: >
          Only when the moment exists. The Cauchy's $\varphi(t) = e^{-|t|}$
          exists everywhere yet is not differentiable at $0$.
      - text: >
          It turns sums of dependent variables into products
        feedback: >
          Independence is still required; that hypothesis is untouched by the
          change from $e^{tX}$ to $e^{itX}$.
      - text: >
          It is always real valued
        feedback: >
          It is real exactly when the law is symmetric about $0$. In general it
          is complex, with $\varphi_X(-t)$ the conjugate of $\varphi_X(t)$.
    rubric:
      - >
        Grounds the unconditional existence in $|e^{itX}| = 1$, not in a
        general appeal to complex numbers.
      - >
        Keeps independence as a live hypothesis for the product rule, and does
        not claim the moments come for free.
    targets:
      - quant-probability.mgf.characteristic-function
    exercises:
      - quant-probability.mgf.mgf-nonexistence
