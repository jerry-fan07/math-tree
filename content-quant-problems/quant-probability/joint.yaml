# Problems targeting quant-probability.joint — joint laws, covariance and
# correlation, convolution, and the normal family.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. See ../README.md.
#
# Every instance here is fresh: no problem reuses a lesson's worked example or
# the numbers of one of its cards.

problems:
  # --- joint laws and marginals ----------------------------------------------

  - id: qjnt-joint-law-01
    kind: work
    difficulty: demanding
    statement: >
      The pair $(X,Y)$ has joint density $f(x,y) = 3x$ on the region
      $0 < y < x < 1$, and $0$ elsewhere. What is $\Pr(Y > 1/2)$?
    answer: >
      $5/16 = 0.3125$. First confirm the density: $\int_0^1\int_0^x 3x\,dy\,dx
      = \int_0^1 3x^{2}\,dx = 1$. To get the marginal of $Y$, integrate $x$ out —
      but the support ties the coordinates together, so the limits run from $y$
      to $1$, not from $0$ to $1$: $f_Y(y) = \int_y^1 3x\,dx
      = \tfrac{3}{2}(1 - y^{2})$ for $0<y<1$. Then
      $\Pr(Y > 1/2) = \tfrac{3}{2}\int_{1/2}^{1}(1-y^{2})\,dy
      = \tfrac{3}{2}\left[y - \tfrac{y^{3}}{3}\right]_{1/2}^{1}
      = \tfrac{3}{2}\left(\tfrac{2}{3} - \tfrac{11}{24}\right)
      = \tfrac{3}{2}\cdot\tfrac{5}{24} = \tfrac{5}{16}$. Cross-check by
      integrating the joint straight over $\{1/2 < y < x < 1\}$:
      $\int_{1/2}^{1} 3x\left(x - \tfrac12\right)dx
      = \left[x^{3} - \tfrac{3}{4}x^{2}\right]_{1/2}^{1}
      = \tfrac14 + \tfrac{1}{16} = \tfrac{5}{16}$.
    expects: "5/16"
    tolerance: 0.0005
    rubric:
      - >
        Takes the marginal of $Y$ by integrating $x$ from $y$ to $1$, not from
        $0$ to $1$.
      - >
        Checks that the joint integrates to $1$ over the triangle before using
        it.
    targets:
      - quant-probability.joint.joint-law

  - id: qjnt-joint-law-02
    kind: work
    difficulty: standard
    statement: >
      A joint pmf for $(X,Y)$ has $X \in \{0,1\}$ and $Y \in \{0,1,2\}$. Four of
      the six cells are known: $p(0,0) = 0.10$, $p(0,1) = 0.20$,
      $p(1,0) = 0.15$, $p(1,2) = 0.25$. It is also given that
      $\Pr(Y = 1) = 0.35$. What is $\Pr(X = 1)$?
    answer: >
      $0.55$. The unknown cells are $p(1,1)$ and $p(0,2)$, and there are exactly
      two constraints to pin them down. The marginal of $Y$ at $1$ is a column
      sum: $p(0,1) + p(1,1) = 0.20 + p(1,1) = 0.35$, so $p(1,1) = 0.15$. Total
      mass fixes the last cell: $p(0,2) = 1 - (0.10 + 0.20 + 0.15 + 0.15 + 0.25)
      = 0.15$. The marginal of $X$ at $1$ is then the row sum
      $p(1,0) + p(1,1) + p(1,2) = 0.15 + 0.15 + 0.25 = 0.55$. Marginals are row
      and column sums of the joint — nothing else is needed, and nothing else
      would have sufficed.
    expects: "0.55"
    rubric:
      - >
        Reads $\Pr(Y=1)$ as a column sum of the joint, not as a statement about
        $X$.
      - >
        Uses total mass $1$ to fill the second unknown cell before summing the
        row for $X = 1$.
    targets:
      - quant-probability.joint.joint-law

  # --- independence of random variables --------------------------------------

  - id: qjnt-independence-rvs-01
    kind: work
    difficulty: demanding
    statement: >
      $(X,Y)$ has joint density $f(x,y) = c\,x^{2} y e^{-y}$ on
      $0 < x < 1$, $y > 0$, and $0$ elsewhere. What is $\mathbb{E}[XY]$?
    answer: >
      $3/2$. The support is the product set $(0,1)\times(0,\infty)$ and the
      density splits as $g(x)h(y)$ with $g(x) = x^{2}$ and $h(y) = ye^{-y}$, so
      $X$ and $Y$ are independent — the working test needs nothing normalized.
      For the constant, $\int_0^1 x^{2}dx = 1/3$ and
      $\int_0^{\infty} ye^{-y}dy = 1$, so $c/3 = 1$ and $c = 3$; the marginals
      are $f_X(x) = 3x^{2}$ on $(0,1)$ and $f_Y(y) = ye^{-y}$ on
      $(0,\infty)$, a Gamma with shape $2$ and rate $1$. Independence then turns
      one double integral into two single ones:
      $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]
      = \left(\int_0^1 3x^{3}dx\right)\cdot 2 = \tfrac{3}{4}\cdot 2
      = \tfrac{3}{2}$. The trap is reading $f_Y(y) = ye^{-y}$ as an exponential
      and taking $\mathbb{E}[Y] = 1$.
    expects: "3/2"
    tolerance: 0.0005
    rubric:
      - >
        Checks both halves of the test — a product support and a density that
        splits as a function of $x$ times a function of $y$.
      - >
        Uses $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$ only after
        independence is established.
      - >
        Gets $\mathbb{E}[Y] = 2$ from the density $ye^{-y}$, not $1$.
    targets:
      - quant-probability.joint.independence-rvs
    exercises:
      - quant-probability.joint.joint-law

  - id: qjnt-independence-rvs-02
    kind: decide
    difficulty: standard
    statement: >
      Four joint densities are proposed, each positive exactly on the region
      stated and $0$ elsewhere, with $c$ whatever constant normalizes it. In
      which one are $X$ and $Y$ independent?
    answer: >
      The second. Independence is factorization $f(x,y) = g(x)h(y)$ over a
      support that is itself a product set. Only $c\,x^{3}e^{-2y}$ has both: it
      splits as $(x^{3})(e^{-2y})$ on the rectangle $(0,1)\times(0,\infty)$, and
      normalizing each piece separately gives $f_X(x) = 4x^{3}$ and
      $f_Y(y) = 2e^{-2y}$, whose product is the joint. Of the rest, $1 + xy$ and
      $x^{2}+y^{2}$ are sums rather than products — for $1+xy$ the ratio
      $f(1,y)/f(0,y) = 1 + y$ still depends on $y$, which no factored density
      allows, since that ratio would have to be the constant $g(1)/g(0)$. And
      $c\,e^{-y}$ on $0 < x < y$ has a triangular support, so the range of $X$
      moves with $Y$ and dependence is settled before any algebra.
    choices:
      - text: >
          $f(x,y) = c\,(1 + xy)$ on the unit square $0<x<1$, $0<y<1$
        feedback: >
          A sum is not a product. The ratio $f(1,y)/f(0,y) = 1+y$ depends on
          $y$, which a factored density can never do.
      - text: >
          $f(x,y) = c\,x^{3} e^{-2y}$ on $0<x<1$, $y > 0$
        correct: true
        feedback: >
          A function of $x$ alone times a function of $y$ alone, on a product
          support — the constants sort themselves out.
      - text: >
          $f(x,y) = c\,(x^{2} + y^{2})$ on the unit square $0<x<1$, $0<y<1$
        feedback: >
          Involving each variable separately is not the same as factoring. A
          sum of two pure powers does not split as $g(x)h(y)$.
      - text: >
          $f(x,y) = c\,e^{-y}$ on the region $0 < x < y$
        feedback: >
          The formula involves only $y$, but the support is a triangle: the
          range of $X$ is $(0,y)$, so it moves with $Y$ and independence fails
          on the support alone.
    rubric:
      - >
        Applies the split test to the support as well as to the formula.
      - >
        Rejects a sum of a function of $x$ and a function of $y$ as a
        factorization.
    targets:
      - quant-probability.joint.independence-rvs

  # --- the support test ------------------------------------------------------

  - id: qjnt-support-rectangle-test-01
    kind: decide
    difficulty: demanding
    statement: >
      A joint density is positive exactly on the unit square $0<x<1$, $0<y<1$,
      where it equals $f(x,y) = \tfrac{3}{2}(x^{2} + y^{2})$. What does the
      support test settle here?
    answer: >
      Nothing on its own — and the pair turns out to be dependent. The support
      is the product set $(0,1)\times(0,1)$, so the test passes, and passing it
      rules out nothing: a rectangular support is necessary for independence and
      never sufficient. The factorization then has to be checked directly, and
      it fails: if $f(x,y) = g(x)h(y)$ the ratio $f(x,1/2)/f(x,0)$ would be the
      constant $h(1/2)/h(0)$, but here it is $(x^{2}+1/4)/x^{2}$, which still
      depends on $x$. So $X$ and $Y$ are dependent despite a perfectly
      rectangular support. The density is a legitimate one, incidentally:
      $\tfrac{3}{2}\int_0^1\int_0^1 (x^{2}+y^{2})\,dx\,dy
      = \tfrac{3}{2}\cdot\tfrac{2}{3} = 1$, and a density may exceed $1$ freely.
    choices:
      - text: >
          The support is a rectangle, so $X$ and $Y$ are independent.
        feedback: >
          The test runs one way only. A product support is necessary for
          independence, never sufficient — the density still has to factor.
      - text: >
          The support is a rectangle, so the test is silent; checking the
          factorization shows $f$ does not split, so $X$ and $Y$ are dependent.
        correct: true
        feedback: >
          Exactly the two-step reading: the shape survives the glance, and then
          the ratio $(x^{2}+1/4)/x^{2}$ still depends on $x$, so no split
          exists.
      - text: >
          The support is not a rectangle, so $X$ and $Y$ are dependent.
        feedback: >
          The unit square is precisely a product set $(0,1)\times(0,1)$. The
          shape is not what fails here — the formula is.
      - text: >
          The proposed $f$ is not a density at all, since it exceeds $1$.
        feedback: >
          A density may take any nonnegative value; only its integral must be
          $1$, and $\tfrac{3}{2}\cdot\tfrac{2}{3} = 1$ here.
    rubric:
      - >
        States that the support test is necessary but not sufficient, and does
        not stop once the region turns out to be a rectangle.
      - >
        Shows the factorization fails — for instance by a ratio in one variable
        that still depends on the other.
    targets:
      - quant-probability.joint.support-rectangle-test

  - id: qjnt-support-rectangle-test-02
    kind: decide
    difficulty: standard
    statement: >
      Four joint densities are each positive exactly on the region named below.
      For which one does the support test fail to rule independence out?
    answer: >
      The first. Independence forces the positivity set to be a product
      $S_X \times S_Y$: if $f = f_X f_Y$ then $f > 0$ exactly where both factors
      are positive, and a condition on $x$ together with a separate condition on
      $y$ is what a rectangle is. The set $\{0<x<1,\ 0<y<2\}$ is
      $(0,1)\times(0,2)$, so the test says nothing and the factorization still
      has to be checked. Each of the other three couples the coordinates: in
      $\{0<y<x<1\}$ the variable $Y$ must stay below $X$; in the disc and in the
      diamond the allowed spread of $Y$ shrinks as $|x|$ grows. All three are
      dependent with no computation at all. The test only ever rules
      independence out — it never rules it in.
    choices:
      - text: >
          $\{0 < x < 1,\ 0 < y < 2\}$
        correct: true
        feedback: >
          A product set $(0,1)\times(0,2)$ — a rectangle need not be a square,
          and the test is silent, so the factorization is still open.
      - text: >
          $\{0 < y < x < 1\}$
        feedback: >
          A triangle. The upper limit on $Y$ is $x$ itself, so the range of one
          coordinate moves with the other and independence is dead.
      - text: >
          $\{x^{2} + y^{2} < 1\}$
        feedback: >
          A disc. At $x$ near $\pm 1$ the variable $Y$ is squeezed to nearly a
          point, while at $x = 0$ it ranges over $(-1,1)$.
      - text: >
          $\{|x| + |y| < 1\}$
        feedback: >
          A diamond. The allowed range of $Y$ is $(-(1-|x|),\,1-|x|)$, which
          again depends on $x$.
    rubric:
      - >
        Identifies the product set among the four, including that a rectangle
        need not have equal sides.
      - >
        Says for each of the other three which coordinate's range moves with
        the other.
    targets:
      - quant-probability.joint.support-rectangle-test

  # --- covariance ------------------------------------------------------------

  - id: qjnt-covariance-01
    kind: work
    difficulty: demanding
    statement: >
      $(X,Y)$ is uniform on the triangle $\{x > 0,\ y > 0,\ x + y < 2\}$. What
      is $\operatorname{Cov}(X,Y)$?
    answer: >
      $-1/9 \approx -0.1111$. The triangle has area $2$, so the joint density is
      the constant $1/2$ on it. Marginal:
      $f_X(x) = \int_0^{2-x}\tfrac12\,dy = \tfrac{2-x}{2}$ for $0<x<2$, giving
      $\mathbb{E}[X] = \int_0^2 x\,\tfrac{2-x}{2}\,dx
      = \tfrac12\left(4 - \tfrac83\right) = \tfrac23$, and
      $\mathbb{E}[Y] = \tfrac23$ by symmetry. For the cross moment,
      $\mathbb{E}[XY] = \tfrac12\int_0^2 x\int_0^{2-x} y\,dy\,dx
      = \tfrac14\int_0^2 x(2-x)^{2}dx
      = \tfrac14\left[2x^{2} - \tfrac{4x^{3}}{3} + \tfrac{x^{4}}{4}\right]_0^2
      = \tfrac14\left(8 - \tfrac{32}{3} + 4\right) = \tfrac13$. Hence
      $\operatorname{Cov}(X,Y) = \tfrac13 - \tfrac49 = -\tfrac19$. The sign is
      forced by the budget constraint $X+Y<2$: a large $X$ leaves less room for
      $Y$. The support already proves dependence — a triangle is not a product
      set — but only the integral gives the number.
    expects: "-1/9"
    tolerance: 0.0005
    rubric:
      - >
        Uses the density $1/2$, dividing by the triangle's area, rather than
        treating the joint as $1$ on the region.
      - >
        Takes the inner limit for $y$ as $2-x$, so the support's coupling
        actually enters the computation.
      - >
        Reads the negative sign as the constraint $X+Y<2$ rather than as an
        arithmetic slip.
    targets:
      - quant-probability.joint.covariance
    exercises:
      - quant-probability.joint.joint-law

  - id: qjnt-covariance-02
    kind: work
    difficulty: demanding
    statement: >
      An urn holds $3$ red, $2$ blue and $5$ white balls. Four are drawn without
      replacement. Let $R$ be the number of red drawn and $B$ the number of
      blue. What is $\operatorname{Cov}(R,B)$?
    answer: >
      $-0.16$. Write both counts as sums of indicators:
      $R = \sum_{i=1}^{3}\mathbf{1}\{\text{red } i \text{ is drawn}\}$ and
      $B = \sum_{j=1}^{2}\mathbf{1}\{\text{blue } j \text{ is drawn}\}$. Every
      ball is equally likely to be among the four drawn, with probability
      $4/10$, so $\mathbb{E}[R] = 3(0.4) = 1.2$ and
      $\mathbb{E}[B] = 2(0.4) = 0.8$. The product $RB$ counts red–blue pairs
      that are both drawn, so
      $\mathbb{E}[RB] = \sum_{i}\sum_{j}\Pr(\text{both drawn})
      = 6\cdot\tfrac{4}{10}\cdot\tfrac{3}{9} = 6\cdot\tfrac{2}{15} = 0.8$ — the
      second factor is $3/9$, not $4/10$, because one of the four slots is
      already spent. Hence $\operatorname{Cov}(R,B) = 0.8 - (1.2)(0.8)
      = 0.8 - 0.96 = -0.16$. Sampling without replacement from a fixed number of
      slots always makes two such counts negatively related: a slot a red ball
      occupies is one a blue ball cannot.
    expects: "-0.16"
    rubric:
      - >
        Writes each count as a sum of indicators instead of enumerating the
        joint pmf.
      - >
        Gets the chance that a fixed red and a fixed blue are both drawn as
        $\tfrac{4}{10}\cdot\tfrac{3}{9}$, conditioning the second on the first.
      - >
        Explains the negative sign by the fixed number of draws.
    targets:
      - quant-probability.joint.covariance

  - id: qjnt-covariance-03
    kind: work
    difficulty: standard
    statement: >
      A joint pmf for $(X,Y)$ with $X \in \{0,1,2\}$ and $Y \in \{0,1\}$ has
      cells $p(0,0) = 0.2$, $p(0,1) = 0.1$, $p(1,0) = 0.1$, $p(1,1) = 0.2$,
      $p(2,0) = 0.3$, $p(2,1) = 0.1$. What is $\operatorname{Cov}(X,Y)$?
    answer: >
      $-0.04$. Row sums give the marginal of $X$: $0.3$, $0.3$, $0.4$ at
      $0,1,2$, so $\mathbb{E}[X] = 0(0.3) + 1(0.3) + 2(0.4) = 1.1$. Column sums
      give $\Pr(Y=1) = 0.1 + 0.2 + 0.1 = 0.4$, so $\mathbb{E}[Y] = 0.4$. Only
      cells with both coordinates nonzero reach $\mathbb{E}[XY]$:
      $1\cdot 1\cdot 0.2 + 2\cdot 1\cdot 0.1 = 0.4$. Therefore
      $\operatorname{Cov}(X,Y) = 0.4 - (1.1)(0.4) = 0.4 - 0.44 = -0.04$. Small
      and negative: the largest value of $X$ is the one least often paired with
      $Y = 1$, even though $X = 2$ is the most likely value of $X$ overall.
    expects: "-0.04"
    rubric:
      - >
        Computes $\mathbb{E}[XY]$ by summing $xy\,p(x,y)$ over the table, not by
        multiplying the two marginal means.
      - >
        Gets both marginals right from the row and column sums before
        subtracting.
    targets:
      - quant-probability.joint.covariance

  # --- bilinearity -----------------------------------------------------------

  - id: qjnt-covariance-bilinearity-01
    kind: work
    difficulty: demanding
    statement: >
      $Z_1,\dots,Z_7$ are uncorrelated, each with variance $4$. Write
      $S_k = Z_1 + \cdots + Z_k$. What is
      $\operatorname{Cov}(S_3,\, S_7 - S_2)$?
    answer: >
      $4$. Expand both arguments into increments and let bilinearity do the
      bookkeeping: $S_3 = Z_1 + Z_2 + Z_3$ and
      $S_7 - S_2 = Z_3 + Z_4 + Z_5 + Z_6 + Z_7$, so the covariance is
      $\sum_{i\le 3}\sum_{j\ge 3}\operatorname{Cov}(Z_i,Z_j)$. Every term with
      $i \ne j$ vanishes because the increments are uncorrelated, and the only
      index appearing on both sides is $3$, so the whole $3\times 5$ grid
      collapses to $\operatorname{Cov}(Z_3,Z_3) = \operatorname{Var}(Z_3) = 4$.
      The general rule worth carrying: for a walk with uncorrelated increments,
      the covariance of two blocks is the total variance of the increments they
      share — overlapping windows are correlated exactly through their overlap.
    expects: "4"
    rubric:
      - >
        Expands both blocks into increments and applies bilinearity term by
        term.
      - >
        Keeps only the shared index, rather than multiplying the two blocks'
        variances or their lengths.
    targets:
      - quant-probability.joint.covariance-bilinearity
    exercises:
      - quant-probability.joint.covariance

  - id: qjnt-covariance-bilinearity-02
    kind: work
    difficulty: standard
    statement: >
      $\operatorname{Var}(A) = 9$, $\operatorname{Var}(B) = 16$ and
      $\operatorname{Cov}(A,B) = -4$. What is
      $\operatorname{Cov}(2A - B,\ A + 3B)$?
    answer: >
      $-50$. Bilinearity turns this into a $2\times 2$ coefficient grid with
      $a = 2$, $b = -1$ on the left and $c = 1$, $d = 3$ on the right:
      $\operatorname{Cov}(2A-B,\ A+3B) = ac\operatorname{Var}(A)
      + ad\operatorname{Cov}(A,B) + bc\operatorname{Cov}(B,A)
      + bd\operatorname{Var}(B) = 2(9) + 6(-4) + (-1)(-4) + (-3)(16)
      = 18 - 24 + 4 - 48 = -50$. The two cross-terms carry the same
      $\operatorname{Cov}(A,B)$ but different coefficients, $ad = 6$ and
      $bc = -1$, so they do not merge into one doubled term — that shortcut
      belongs to $\operatorname{Var}$, where both combinations are identical.
    expects: "-50"
    rubric:
      - >
        Produces all four terms of the coefficient grid, including both
        cross-terms.
      - >
        Carries the signs of the negative coefficients through, and does not
        double a single cross-term.
    targets:
      - quant-probability.joint.covariance-bilinearity
    exercises:
      - quant-probability.joint.covariance

  # --- independence implies zero covariance ----------------------------------

  - id: qjnt-independence-zero-covariance-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ and $Y$ are independent, with $\mathbb{E}[X] = 2$,
      $\operatorname{Var}(X) = 3$, $\mathbb{E}[Y] = -1$ and
      $\operatorname{Var}(Y) = 5$. What is $\operatorname{Var}(XY)$?
    answer: >
      $38$. Independence factors the expectation of a product of *functions*, so
      $\mathbb{E}[X^{2}Y^{2}] = \mathbb{E}[X^{2}]\mathbb{E}[Y^{2}]$ as well as
      $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$. Recover the second moments
      from the variances: $\mathbb{E}[X^{2}] = 3 + 2^{2} = 7$ and
      $\mathbb{E}[Y^{2}] = 5 + (-1)^{2} = 6$. Then
      $\operatorname{Var}(XY) = \mathbb{E}[X^{2}Y^{2}] - (\mathbb{E}[XY])^{2}
      = (7)(6) - ((2)(-1))^{2} = 42 - 4 = 38$. Note this is not
      $\operatorname{Var}(X)\operatorname{Var}(Y) = 15$; the identity is
      $\operatorname{Var}(XY) = \operatorname{Var}(X)\operatorname{Var}(Y)
      + \operatorname{Var}(X)(\mathbb{E}[Y])^{2}
      + \operatorname{Var}(Y)(\mathbb{E}[X])^{2} = 15 + 3 + 20 = 38$, which
      agrees. A product of independent variables is noisier than the product of
      their noises, because each variable's mean amplifies the other's spread.
    expects: "38"
    rubric:
      - >
        Applies $\mathbb{E}[g(X)h(Y)] = \mathbb{E}[g(X)]\mathbb{E}[h(Y)]$ with
        $g(x) = x^{2}$ and $h(y) = y^{2}$, not only to $X$ and $Y$ themselves.
      - >
        Recovers $\mathbb{E}[X^{2}]$ and $\mathbb{E}[Y^{2}]$ from the variances
        before multiplying.
      - >
        Does not answer $\operatorname{Var}(X)\operatorname{Var}(Y)$.
    targets:
      - quant-probability.joint.independence-zero-covariance

  - id: qjnt-independence-zero-covariance-02
    kind: decide
    difficulty: standard
    statement: >
      $X$ and $Y$ are independent, every moment written below is finite, and
      $\mathbb{E}[Y] \ne 0$ with $Y > 0$ always. Which equality must hold?
    answer: >
      The first. Independence passes through to functions, so $X^{2}$ and
      $Y^{2}$ are independent too and their expectations multiply. The others
      fail. $\mathbb{E}[X/Y] = \mathbb{E}[X]\,\mathbb{E}[1/Y]$ by the same rule,
      but $\mathbb{E}[1/Y] \ne 1/\mathbb{E}[Y]$ in general — $1/y$ is strictly
      convex on $y > 0$, so Jensen makes the left side strictly larger whenever
      $Y$ is non-degenerate. $\operatorname{Var}(X+Y)$ loses its covariance term
      and becomes $\operatorname{Var}(X) + \operatorname{Var}(Y)$, a sum, never
      a difference. And $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$ vanishes
      only when one of the two means does, which is not given.
    choices:
      - text: >
          $\mathbb{E}[X^{2}Y^{2}] = \mathbb{E}[X^{2}]\,\mathbb{E}[Y^{2}]$
        correct: true
        feedback: >
          Independence carries over to $g(X)$ and $h(Y)$ for any functions, so
          the product rule applies to the squares as well.
      - text: >
          $\mathbb{E}[X/Y] = \mathbb{E}[X]/\mathbb{E}[Y]$
        feedback: >
          Independence gives $\mathbb{E}[X]\,\mathbb{E}[1/Y]$, and
          $\mathbb{E}[1/Y]$ is not $1/\mathbb{E}[Y]$ — by Jensen it is strictly
          larger for any non-degenerate positive $Y$.
      - text: >
          $\operatorname{Var}(X + Y) = \operatorname{Var}(X)
          - \operatorname{Var}(Y)$
        feedback: >
          Zero covariance removes the cross-term, leaving the two variances
          added, not subtracted.
      - text: >
          $\mathbb{E}[XY] = 0$
        feedback: >
          Independence gives $\mathbb{E}[X]\mathbb{E}[Y]$, which is zero only if
          one of the means is — zero covariance is not zero cross moment.
    rubric:
      - >
        Applies the product rule to functions of the variables, not only to the
        variables themselves.
      - >
        Distinguishes the expectation of a ratio from the ratio of
        expectations.
    targets:
      - quant-probability.joint.independence-zero-covariance

  # --- correlation -----------------------------------------------------------

  - id: qjnt-correlation-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ and $Y$ are uncorrelated with $\operatorname{Var}(X) = 1$ and
      $\operatorname{Var}(Y) = 4$. What is $\operatorname{Corr}(X+Y,\ X-Y)$?
    answer: >
      $-0.6$. Bilinearity gives the numerator:
      $\operatorname{Cov}(X+Y,\ X-Y) = \operatorname{Var}(X)
      - \operatorname{Cov}(X,Y) + \operatorname{Cov}(Y,X)
      - \operatorname{Var}(Y) = \operatorname{Var}(X) - \operatorname{Var}(Y)
      = 1 - 4 = -3$; the two cross-terms cancel whatever the covariance is. Both
      denominators are the same here, since the covariance is zero:
      $\operatorname{Var}(X \pm Y) = 1 + 4 = 5$. So
      $\rho = \dfrac{-3}{\sqrt5\,\sqrt5} = -\dfrac{3}{5} = -0.6$. The sum and
      the difference are uncorrelated exactly when the two variances are equal;
      the more unequal they are, the closer $|\rho|$ climbs toward $1$, and at
      $\operatorname{Var}(Y) = 0$ the two combinations are the same variable.
    expects: "-0.6"
    rubric:
      - >
        Cancels the two cross-covariances, leaving the difference of the
        variances in the numerator.
      - >
        Divides by both standard deviations rather than reporting the
        covariance $-3$.
    targets:
      - quant-probability.joint.correlation
    exercises:
      - quant-probability.joint.covariance

  - id: qjnt-correlation-02
    kind: work
    difficulty: demanding
    statement: >
      $X$, $Y$ and $Z$ are pairwise uncorrelated with variances $1$, $2$ and
      $3$. What is $\operatorname{Corr}(X+Y,\ Y+Z)$? Give four decimal places.
    answer: >
      $\approx 0.5164$. The shared variable is the only source of covariance:
      $\operatorname{Cov}(X+Y,\ Y+Z) = \operatorname{Cov}(X,Y)
      + \operatorname{Cov}(X,Z) + \operatorname{Var}(Y)
      + \operatorname{Cov}(Y,Z) = \operatorname{Var}(Y) = 2$. The two spreads
      are $\operatorname{Var}(X+Y) = 1 + 2 = 3$ and
      $\operatorname{Var}(Y+Z) = 2 + 3 = 5$. So
      $\rho = \dfrac{2}{\sqrt3\,\sqrt5} = \dfrac{2}{\sqrt{15}}
      \approx 0.5164$. Two portfolios that share one uncorrelated position are
      correlated purely through that position's share of each one's variance:
      the common leg supplies two thirds of the first combination's variance and
      two fifths of the second, yet $\rho$ is only just over $1/2$ — the
      geometric mean of those shares, $\sqrt{(2/3)(2/5)}$, which is the same
      number.
    expects: "0.5164"
    tolerance: 0.0005
    rubric:
      - >
        Notices that only $\operatorname{Var}(Y)$ survives in the numerator.
      - >
        Uses $\operatorname{Var}(X+Y)$ and $\operatorname{Var}(Y+Z)$ in the
        denominator, not the individual variances.
    targets:
      - quant-probability.joint.correlation
    exercises:
      - quant-probability.joint.covariance

  - id: qjnt-correlation-03
    kind: work
    difficulty: standard
    statement: >
      $\sigma_X = 2$, $\sigma_Y = 6$ and $\operatorname{Cov}(X,Y) = -3$. What is
      $\operatorname{Corr}(5X - 2,\ -4Y + 7)$?
    answer: >
      $0.25$. First $\rho_{XY} = \dfrac{-3}{(2)(6)} = -0.25$. Correlation
      ignores additive constants and keeps only the sign of the product of the
      multipliers: $\operatorname{Corr}(aX+b,\ cY+d)
      = \operatorname{sgn}(ac)\,\rho_{XY}$. Here $ac = (5)(-4) = -20 < 0$, so the
      sign flips and the answer is $-(-0.25) = 0.25$. The long route agrees: the
      covariance becomes $(5)(-4)(-3) = 60$, the standard deviations become
      $5(2) = 10$ and $|-4|(6) = 24$, and $60/240 = 0.25$. The magnitude never
      moves under rescaling — only the sign can, and only when exactly one of
      the two multipliers is negative.
    expects: "0.25"
    rubric:
      - >
        Drops the additive constants $-2$ and $7$ rather than trying to carry
        them.
      - >
        Divides by $|a|\sigma_X$ and $|c|\sigma_Y$, so the magnitude is
        unchanged and only the sign flips.
    targets:
      - quant-probability.joint.correlation
