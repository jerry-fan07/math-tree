# Problems targeting quant-probability.joint — joint laws, covariance and
# correlation, convolution, and the normal family.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. See ../README.md.
#
# Every instance here is fresh: no problem reuses a lesson's worked example or
# the numbers of one of its cards.

problems:
  # --- joint laws and marginals ----------------------------------------------

  - id: qjnt-joint-law-01
    kind: work
    difficulty: demanding
    statement: >
      The pair $(X,Y)$ has joint density $f(x,y) = 3x$ on the region
      $0 < y < x < 1$, and $0$ elsewhere. What is $\Pr(Y > 1/2)$?
    answer: >
      $5/16 = 0.3125$. First confirm the density: $\int_0^1\int_0^x 3x\,dy\,dx
      = \int_0^1 3x^{2}\,dx = 1$. To get the marginal of $Y$, integrate $x$ out —
      but the support ties the coordinates together, so the limits run from $y$
      to $1$, not from $0$ to $1$: $f_Y(y) = \int_y^1 3x\,dx
      = \tfrac{3}{2}(1 - y^{2})$ for $0<y<1$. Then
      $\Pr(Y > 1/2) = \tfrac{3}{2}\int_{1/2}^{1}(1-y^{2})\,dy
      = \tfrac{3}{2}\left[y - \tfrac{y^{3}}{3}\right]_{1/2}^{1}
      = \tfrac{3}{2}\left(\tfrac{2}{3} - \tfrac{11}{24}\right)
      = \tfrac{3}{2}\cdot\tfrac{5}{24} = \tfrac{5}{16}$. Cross-check by
      integrating the joint straight over $\{1/2 < y < x < 1\}$:
      $\int_{1/2}^{1} 3x\left(x - \tfrac12\right)dx
      = \left[x^{3} - \tfrac{3}{4}x^{2}\right]_{1/2}^{1}
      = \tfrac14 + \tfrac{1}{16} = \tfrac{5}{16}$.
    expects: "5/16"
    tolerance: 0.0005
    rubric:
      - >
        Takes the marginal of $Y$ by integrating $x$ from $y$ to $1$, not from
        $0$ to $1$.
      - >
        Checks that the joint integrates to $1$ over the triangle before using
        it.
    targets:
      - quant-probability.joint.joint-law

  - id: qjnt-joint-law-02
    kind: work
    difficulty: standard
    statement: >
      A joint pmf for $(X,Y)$ has $X \in \{0,1\}$ and $Y \in \{0,1,2\}$. Four of
      the six cells are known: $p(0,0) = 0.10$, $p(0,1) = 0.20$,
      $p(1,0) = 0.15$, $p(1,2) = 0.25$. It is also given that
      $\Pr(Y = 1) = 0.35$. What is $\Pr(X = 1)$?
    answer: >
      $0.55$. The unknown cells are $p(1,1)$ and $p(0,2)$, and there are exactly
      two constraints to pin them down. The marginal of $Y$ at $1$ is a column
      sum: $p(0,1) + p(1,1) = 0.20 + p(1,1) = 0.35$, so $p(1,1) = 0.15$. Total
      mass fixes the last cell: $p(0,2) = 1 - (0.10 + 0.20 + 0.15 + 0.15 + 0.25)
      = 0.15$. The marginal of $X$ at $1$ is then the row sum
      $p(1,0) + p(1,1) + p(1,2) = 0.15 + 0.15 + 0.25 = 0.55$. Marginals are row
      and column sums of the joint — nothing else is needed, and nothing else
      would have sufficed.
    expects: "0.55"
    rubric:
      - >
        Reads $\Pr(Y=1)$ as a column sum of the joint, not as a statement about
        $X$.
      - >
        Uses total mass $1$ to fill the second unknown cell before summing the
        row for $X = 1$.
    targets:
      - quant-probability.joint.joint-law

  # --- independence of random variables --------------------------------------

  - id: qjnt-independence-rvs-01
    kind: work
    difficulty: demanding
    statement: >
      $(X,Y)$ has joint density $f(x,y) = c\,x^{2} y e^{-y}$ on
      $0 < x < 1$, $y > 0$, and $0$ elsewhere. What is $\mathbb{E}[XY]$?
    answer: >
      $3/2$. The support is the product set $(0,1)\times(0,\infty)$ and the
      density splits as $g(x)h(y)$ with $g(x) = x^{2}$ and $h(y) = ye^{-y}$, so
      $X$ and $Y$ are independent — the working test needs nothing normalized.
      For the constant, $\int_0^1 x^{2}dx = 1/3$ and
      $\int_0^{\infty} ye^{-y}dy = 1$, so $c/3 = 1$ and $c = 3$; the marginals
      are $f_X(x) = 3x^{2}$ on $(0,1)$ and $f_Y(y) = ye^{-y}$ on
      $(0,\infty)$, a Gamma with shape $2$ and rate $1$. Independence then turns
      one double integral into two single ones:
      $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]
      = \left(\int_0^1 3x^{3}dx\right)\cdot 2 = \tfrac{3}{4}\cdot 2
      = \tfrac{3}{2}$. The trap is reading $f_Y(y) = ye^{-y}$ as an exponential
      and taking $\mathbb{E}[Y] = 1$.
    expects: "3/2"
    tolerance: 0.0005
    rubric:
      - >
        Checks both halves of the test — a product support and a density that
        splits as a function of $x$ times a function of $y$.
      - >
        Uses $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$ only after
        independence is established.
      - >
        Gets $\mathbb{E}[Y] = 2$ from the density $ye^{-y}$, not $1$.
    targets:
      - quant-probability.joint.independence-rvs
    exercises:
      - quant-probability.joint.joint-law

  - id: qjnt-independence-rvs-02
    kind: decide
    difficulty: standard
    statement: >
      Four joint densities are proposed, each positive exactly on the region
      stated and $0$ elsewhere, with $c$ whatever constant normalizes it. In
      which one are $X$ and $Y$ independent?
    answer: >
      The second. Independence is factorization $f(x,y) = g(x)h(y)$ over a
      support that is itself a product set. Only $c\,x^{3}e^{-2y}$ has both: it
      splits as $(x^{3})(e^{-2y})$ on the rectangle $(0,1)\times(0,\infty)$, and
      normalizing each piece separately gives $f_X(x) = 4x^{3}$ and
      $f_Y(y) = 2e^{-2y}$, whose product is the joint. Of the rest, $1 + xy$ and
      $x^{2}+y^{2}$ are sums rather than products — for $1+xy$ the ratio
      $f(1,y)/f(0,y) = 1 + y$ still depends on $y$, which no factored density
      allows, since that ratio would have to be the constant $g(1)/g(0)$. And
      $c\,e^{-y}$ on $0 < x < y$ has a triangular support, so the range of $X$
      moves with $Y$ and dependence is settled before any algebra.
    choices:
      - text: >
          $f(x,y) = c\,(1 + xy)$ on the unit square $0<x<1$, $0<y<1$
        feedback: >
          A sum is not a product. The ratio $f(1,y)/f(0,y) = 1+y$ depends on
          $y$, which a factored density can never do.
      - text: >
          $f(x,y) = c\,x^{3} e^{-2y}$ on $0<x<1$, $y > 0$
        correct: true
        feedback: >
          A function of $x$ alone times a function of $y$ alone, on a product
          support — the constants sort themselves out.
      - text: >
          $f(x,y) = c\,(x^{2} + y^{2})$ on the unit square $0<x<1$, $0<y<1$
        feedback: >
          Involving each variable separately is not the same as factoring. A
          sum of two pure powers does not split as $g(x)h(y)$.
      - text: >
          $f(x,y) = c\,e^{-y}$ on the region $0 < x < y$
        feedback: >
          The formula involves only $y$, but the support is a triangle: the
          range of $X$ is $(0,y)$, so it moves with $Y$ and independence fails
          on the support alone.
    rubric:
      - >
        Applies the split test to the support as well as to the formula.
      - >
        Rejects a sum of a function of $x$ and a function of $y$ as a
        factorization.
    targets:
      - quant-probability.joint.independence-rvs

  # --- the support test ------------------------------------------------------

  - id: qjnt-support-rectangle-test-01
    kind: decide
    difficulty: demanding
    statement: >
      A joint density is positive exactly on the unit square $0<x<1$, $0<y<1$,
      where it equals $f(x,y) = \tfrac{3}{2}(x^{2} + y^{2})$. What does the
      support test settle here?
    answer: >
      Nothing on its own — and the pair turns out to be dependent. The support
      is the product set $(0,1)\times(0,1)$, so the test passes, and passing it
      rules out nothing: a rectangular support is necessary for independence and
      never sufficient. The factorization then has to be checked directly, and
      it fails: if $f(x,y) = g(x)h(y)$ the ratio $f(x,1/2)/f(x,0)$ would be the
      constant $h(1/2)/h(0)$, but here it is $(x^{2}+1/4)/x^{2}$, which still
      depends on $x$. So $X$ and $Y$ are dependent despite a perfectly
      rectangular support. The density is a legitimate one, incidentally:
      $\tfrac{3}{2}\int_0^1\int_0^1 (x^{2}+y^{2})\,dx\,dy
      = \tfrac{3}{2}\cdot\tfrac{2}{3} = 1$, and a density may exceed $1$ freely.
    choices:
      - text: >
          The support is a rectangle, so $X$ and $Y$ are independent.
        feedback: >
          The test runs one way only. A product support is necessary for
          independence, never sufficient — the density still has to factor.
      - text: >
          The support is a rectangle, so the test is silent; checking the
          factorization shows $f$ does not split, so $X$ and $Y$ are dependent.
        correct: true
        feedback: >
          Exactly the two-step reading: the shape survives the glance, and then
          the ratio $(x^{2}+1/4)/x^{2}$ still depends on $x$, so no split
          exists.
      - text: >
          The support is not a rectangle, so $X$ and $Y$ are dependent.
        feedback: >
          The unit square is precisely a product set $(0,1)\times(0,1)$. The
          shape is not what fails here — the formula is.
      - text: >
          The proposed $f$ is not a density at all, since it exceeds $1$.
        feedback: >
          A density may take any nonnegative value; only its integral must be
          $1$, and $\tfrac{3}{2}\cdot\tfrac{2}{3} = 1$ here.
    rubric:
      - >
        States that the support test is necessary but not sufficient, and does
        not stop once the region turns out to be a rectangle.
      - >
        Shows the factorization fails — for instance by a ratio in one variable
        that still depends on the other.
    targets:
      - quant-probability.joint.support-rectangle-test

  - id: qjnt-support-rectangle-test-02
    kind: decide
    difficulty: standard
    statement: >
      Four joint densities are each positive exactly on the region named below.
      For which one does the support test fail to rule independence out?
    answer: >
      The first. Independence forces the positivity set to be a product
      $S_X \times S_Y$: if $f = f_X f_Y$ then $f > 0$ exactly where both factors
      are positive, and a condition on $x$ together with a separate condition on
      $y$ is what a rectangle is. The set $\{0<x<1,\ 0<y<2\}$ is
      $(0,1)\times(0,2)$, so the test says nothing and the factorization still
      has to be checked. Each of the other three couples the coordinates: in
      $\{0<y<x<1\}$ the variable $Y$ must stay below $X$; in the disc and in the
      diamond the allowed spread of $Y$ shrinks as $|x|$ grows. All three are
      dependent with no computation at all. The test only ever rules
      independence out — it never rules it in.
    choices:
      - text: >
          $\{0 < x < 1,\ 0 < y < 2\}$
        correct: true
        feedback: >
          A product set $(0,1)\times(0,2)$ — a rectangle need not be a square,
          and the test is silent, so the factorization is still open.
      - text: >
          $\{0 < y < x < 1\}$
        feedback: >
          A triangle. The upper limit on $Y$ is $x$ itself, so the range of one
          coordinate moves with the other and independence is dead.
      - text: >
          $\{x^{2} + y^{2} < 1\}$
        feedback: >
          A disc. At $x$ near $\pm 1$ the variable $Y$ is squeezed to nearly a
          point, while at $x = 0$ it ranges over $(-1,1)$.
      - text: >
          $\{|x| + |y| < 1\}$
        feedback: >
          A diamond. The allowed range of $Y$ is $(-(1-|x|),\,1-|x|)$, which
          again depends on $x$.
    rubric:
      - >
        Identifies the product set among the four, including that a rectangle
        need not have equal sides.
      - >
        Says for each of the other three which coordinate's range moves with
        the other.
    targets:
      - quant-probability.joint.support-rectangle-test

  # --- covariance ------------------------------------------------------------

  - id: qjnt-covariance-01
    kind: work
    difficulty: demanding
    statement: >
      $(X,Y)$ is uniform on the triangle $\{x > 0,\ y > 0,\ x + y < 2\}$. What
      is $\operatorname{Cov}(X,Y)$?
    answer: >
      $-1/9 \approx -0.1111$. The triangle has area $2$, so the joint density is
      the constant $1/2$ on it. Marginal:
      $f_X(x) = \int_0^{2-x}\tfrac12\,dy = \tfrac{2-x}{2}$ for $0<x<2$, giving
      $\mathbb{E}[X] = \int_0^2 x\,\tfrac{2-x}{2}\,dx
      = \tfrac12\left(4 - \tfrac83\right) = \tfrac23$, and
      $\mathbb{E}[Y] = \tfrac23$ by symmetry. For the cross moment,
      $\mathbb{E}[XY] = \tfrac12\int_0^2 x\int_0^{2-x} y\,dy\,dx
      = \tfrac14\int_0^2 x(2-x)^{2}dx
      = \tfrac14\left[2x^{2} - \tfrac{4x^{3}}{3} + \tfrac{x^{4}}{4}\right]_0^2
      = \tfrac14\left(8 - \tfrac{32}{3} + 4\right) = \tfrac13$. Hence
      $\operatorname{Cov}(X,Y) = \tfrac13 - \tfrac49 = -\tfrac19$. The sign is
      forced by the budget constraint $X+Y<2$: a large $X$ leaves less room for
      $Y$. The support already proves dependence — a triangle is not a product
      set — but only the integral gives the number.
    expects: "-1/9"
    tolerance: 0.0005
    rubric:
      - >
        Uses the density $1/2$, dividing by the triangle's area, rather than
        treating the joint as $1$ on the region.
      - >
        Takes the inner limit for $y$ as $2-x$, so the support's coupling
        actually enters the computation.
      - >
        Reads the negative sign as the constraint $X+Y<2$ rather than as an
        arithmetic slip.
    targets:
      - quant-probability.joint.covariance
    exercises:
      - quant-probability.joint.joint-law

  - id: qjnt-covariance-02
    kind: work
    difficulty: demanding
    statement: >
      An urn holds $3$ red, $2$ blue and $5$ white balls. Four are drawn without
      replacement. Let $R$ be the number of red drawn and $B$ the number of
      blue. What is $\operatorname{Cov}(R,B)$?
    answer: >
      $-0.16$. Write both counts as sums of indicators:
      $R = \sum_{i=1}^{3}\mathbf{1}\{\text{red } i \text{ is drawn}\}$ and
      $B = \sum_{j=1}^{2}\mathbf{1}\{\text{blue } j \text{ is drawn}\}$. Every
      ball is equally likely to be among the four drawn, with probability
      $4/10$, so $\mathbb{E}[R] = 3(0.4) = 1.2$ and
      $\mathbb{E}[B] = 2(0.4) = 0.8$. The product $RB$ counts red–blue pairs
      that are both drawn, so
      $\mathbb{E}[RB] = \sum_{i}\sum_{j}\Pr(\text{both drawn})
      = 6\cdot\tfrac{4}{10}\cdot\tfrac{3}{9} = 6\cdot\tfrac{2}{15} = 0.8$ — the
      second factor is $3/9$, not $4/10$, because one of the four slots is
      already spent. Hence $\operatorname{Cov}(R,B) = 0.8 - (1.2)(0.8)
      = 0.8 - 0.96 = -0.16$. Sampling without replacement from a fixed number of
      slots always makes two such counts negatively related: a slot a red ball
      occupies is one a blue ball cannot.
    expects: "-0.16"
    rubric:
      - >
        Writes each count as a sum of indicators instead of enumerating the
        joint pmf.
      - >
        Gets the chance that a fixed red and a fixed blue are both drawn as
        $\tfrac{4}{10}\cdot\tfrac{3}{9}$, conditioning the second on the first.
      - >
        Explains the negative sign by the fixed number of draws.
    targets:
      - quant-probability.joint.covariance

  - id: qjnt-covariance-03
    kind: work
    difficulty: standard
    statement: >
      A joint pmf for $(X,Y)$ with $X \in \{0,1,2\}$ and $Y \in \{0,1\}$ has
      cells $p(0,0) = 0.2$, $p(0,1) = 0.1$, $p(1,0) = 0.1$, $p(1,1) = 0.2$,
      $p(2,0) = 0.3$, $p(2,1) = 0.1$. What is $\operatorname{Cov}(X,Y)$?
    answer: >
      $-0.04$. Row sums give the marginal of $X$: $0.3$, $0.3$, $0.4$ at
      $0,1,2$, so $\mathbb{E}[X] = 0(0.3) + 1(0.3) + 2(0.4) = 1.1$. Column sums
      give $\Pr(Y=1) = 0.1 + 0.2 + 0.1 = 0.4$, so $\mathbb{E}[Y] = 0.4$. Only
      cells with both coordinates nonzero reach $\mathbb{E}[XY]$:
      $1\cdot 1\cdot 0.2 + 2\cdot 1\cdot 0.1 = 0.4$. Therefore
      $\operatorname{Cov}(X,Y) = 0.4 - (1.1)(0.4) = 0.4 - 0.44 = -0.04$. Small
      and negative: the largest value of $X$ is the one least often paired with
      $Y = 1$, even though $X = 2$ is the most likely value of $X$ overall.
    expects: "-0.04"
    rubric:
      - >
        Computes $\mathbb{E}[XY]$ by summing $xy\,p(x,y)$ over the table, not by
        multiplying the two marginal means.
      - >
        Gets both marginals right from the row and column sums before
        subtracting.
    targets:
      - quant-probability.joint.covariance

  # --- bilinearity -----------------------------------------------------------

  - id: qjnt-covariance-bilinearity-01
    kind: work
    difficulty: demanding
    statement: >
      $Z_1,\dots,Z_7$ are uncorrelated, each with variance $4$. Write
      $S_k = Z_1 + \cdots + Z_k$. What is
      $\operatorname{Cov}(S_3,\, S_7 - S_2)$?
    answer: >
      $4$. Expand both arguments into increments and let bilinearity do the
      bookkeeping: $S_3 = Z_1 + Z_2 + Z_3$ and
      $S_7 - S_2 = Z_3 + Z_4 + Z_5 + Z_6 + Z_7$, so the covariance is
      $\sum_{i\le 3}\sum_{j\ge 3}\operatorname{Cov}(Z_i,Z_j)$. Every term with
      $i \ne j$ vanishes because the increments are uncorrelated, and the only
      index appearing on both sides is $3$, so the whole $3\times 5$ grid
      collapses to $\operatorname{Cov}(Z_3,Z_3) = \operatorname{Var}(Z_3) = 4$.
      The general rule worth carrying: for a walk with uncorrelated increments,
      the covariance of two blocks is the total variance of the increments they
      share — overlapping windows are correlated exactly through their overlap.
    expects: "4"
    rubric:
      - >
        Expands both blocks into increments and applies bilinearity term by
        term.
      - >
        Keeps only the shared index, rather than multiplying the two blocks'
        variances or their lengths.
    targets:
      - quant-probability.joint.covariance-bilinearity
    exercises:
      - quant-probability.joint.covariance

  - id: qjnt-covariance-bilinearity-02
    kind: work
    difficulty: standard
    statement: >
      $\operatorname{Var}(A) = 9$, $\operatorname{Var}(B) = 16$ and
      $\operatorname{Cov}(A,B) = -4$. What is
      $\operatorname{Cov}(2A - B,\ A + 3B)$?
    answer: >
      $-50$. Bilinearity turns this into a $2\times 2$ coefficient grid with
      $a = 2$, $b = -1$ on the left and $c = 1$, $d = 3$ on the right:
      $\operatorname{Cov}(2A-B,\ A+3B) = ac\operatorname{Var}(A)
      + ad\operatorname{Cov}(A,B) + bc\operatorname{Cov}(B,A)
      + bd\operatorname{Var}(B) = 2(9) + 6(-4) + (-1)(-4) + (-3)(16)
      = 18 - 24 + 4 - 48 = -50$. The two cross-terms carry the same
      $\operatorname{Cov}(A,B)$ but different coefficients, $ad = 6$ and
      $bc = -1$, so they do not merge into one doubled term — that shortcut
      belongs to $\operatorname{Var}$, where both combinations are identical.
    expects: "-50"
    rubric:
      - >
        Produces all four terms of the coefficient grid, including both
        cross-terms.
      - >
        Carries the signs of the negative coefficients through, and does not
        double a single cross-term.
    targets:
      - quant-probability.joint.covariance-bilinearity
    exercises:
      - quant-probability.joint.covariance

  # --- independence implies zero covariance ----------------------------------

  - id: qjnt-independence-zero-covariance-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ and $Y$ are independent, with $\mathbb{E}[X] = 2$,
      $\operatorname{Var}(X) = 3$, $\mathbb{E}[Y] = -1$ and
      $\operatorname{Var}(Y) = 5$. What is $\operatorname{Var}(XY)$?
    answer: >
      $38$. Independence factors the expectation of a product of *functions*, so
      $\mathbb{E}[X^{2}Y^{2}] = \mathbb{E}[X^{2}]\mathbb{E}[Y^{2}]$ as well as
      $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$. Recover the second moments
      from the variances: $\mathbb{E}[X^{2}] = 3 + 2^{2} = 7$ and
      $\mathbb{E}[Y^{2}] = 5 + (-1)^{2} = 6$. Then
      $\operatorname{Var}(XY) = \mathbb{E}[X^{2}Y^{2}] - (\mathbb{E}[XY])^{2}
      = (7)(6) - ((2)(-1))^{2} = 42 - 4 = 38$. Note this is not
      $\operatorname{Var}(X)\operatorname{Var}(Y) = 15$; the identity is
      $\operatorname{Var}(XY) = \operatorname{Var}(X)\operatorname{Var}(Y)
      + \operatorname{Var}(X)(\mathbb{E}[Y])^{2}
      + \operatorname{Var}(Y)(\mathbb{E}[X])^{2} = 15 + 3 + 20 = 38$, which
      agrees. A product of independent variables is noisier than the product of
      their noises, because each variable's mean amplifies the other's spread.
    expects: "38"
    rubric:
      - >
        Applies $\mathbb{E}[g(X)h(Y)] = \mathbb{E}[g(X)]\mathbb{E}[h(Y)]$ with
        $g(x) = x^{2}$ and $h(y) = y^{2}$, not only to $X$ and $Y$ themselves.
      - >
        Recovers $\mathbb{E}[X^{2}]$ and $\mathbb{E}[Y^{2}]$ from the variances
        before multiplying.
      - >
        Does not answer $\operatorname{Var}(X)\operatorname{Var}(Y)$.
    targets:
      - quant-probability.joint.independence-zero-covariance

  - id: qjnt-independence-zero-covariance-02
    kind: decide
    difficulty: standard
    statement: >
      $X$ and $Y$ are independent, every moment written below is finite, and
      $\mathbb{E}[Y] \ne 0$ with $Y > 0$ always. Which equality must hold?
    answer: >
      The first. Independence passes through to functions, so $X^{2}$ and
      $Y^{2}$ are independent too and their expectations multiply. The others
      fail. $\mathbb{E}[X/Y] = \mathbb{E}[X]\,\mathbb{E}[1/Y]$ by the same rule,
      but $\mathbb{E}[1/Y] \ne 1/\mathbb{E}[Y]$ in general — $1/y$ is strictly
      convex on $y > 0$, so Jensen makes the left side strictly larger whenever
      $Y$ is non-degenerate. $\operatorname{Var}(X+Y)$ loses its covariance term
      and becomes $\operatorname{Var}(X) + \operatorname{Var}(Y)$, a sum, never
      a difference. And $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$ vanishes
      only when one of the two means does, which is not given.
    choices:
      - text: >
          $\mathbb{E}[X^{2}Y^{2}] = \mathbb{E}[X^{2}]\,\mathbb{E}[Y^{2}]$
        correct: true
        feedback: >
          Independence carries over to $g(X)$ and $h(Y)$ for any functions, so
          the product rule applies to the squares as well.
      - text: >
          $\mathbb{E}[X/Y] = \mathbb{E}[X]/\mathbb{E}[Y]$
        feedback: >
          Independence gives $\mathbb{E}[X]\,\mathbb{E}[1/Y]$, and
          $\mathbb{E}[1/Y]$ is not $1/\mathbb{E}[Y]$ — by Jensen it is strictly
          larger for any non-degenerate positive $Y$.
      - text: >
          $\operatorname{Var}(X + Y) = \operatorname{Var}(X)
          - \operatorname{Var}(Y)$
        feedback: >
          Zero covariance removes the cross-term, leaving the two variances
          added, not subtracted.
      - text: >
          $\mathbb{E}[XY] = 0$
        feedback: >
          Independence gives $\mathbb{E}[X]\mathbb{E}[Y]$, which is zero only if
          one of the means is — zero covariance is not zero cross moment.
    rubric:
      - >
        Applies the product rule to functions of the variables, not only to the
        variables themselves.
      - >
        Distinguishes the expectation of a ratio from the ratio of
        expectations.
    targets:
      - quant-probability.joint.independence-zero-covariance

  # --- correlation -----------------------------------------------------------

  - id: qjnt-correlation-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ and $Y$ are uncorrelated with $\operatorname{Var}(X) = 1$ and
      $\operatorname{Var}(Y) = 4$. What is $\operatorname{Corr}(X+Y,\ X-Y)$?
    answer: >
      $-0.6$. Bilinearity gives the numerator:
      $\operatorname{Cov}(X+Y,\ X-Y) = \operatorname{Var}(X)
      - \operatorname{Cov}(X,Y) + \operatorname{Cov}(Y,X)
      - \operatorname{Var}(Y) = \operatorname{Var}(X) - \operatorname{Var}(Y)
      = 1 - 4 = -3$; the two cross-terms cancel whatever the covariance is. Both
      denominators are the same here, since the covariance is zero:
      $\operatorname{Var}(X \pm Y) = 1 + 4 = 5$. So
      $\rho = \dfrac{-3}{\sqrt5\,\sqrt5} = -\dfrac{3}{5} = -0.6$. The sum and
      the difference are uncorrelated exactly when the two variances are equal;
      the more unequal they are, the closer $|\rho|$ climbs toward $1$, and at
      $\operatorname{Var}(Y) = 0$ the two combinations are the same variable.
    expects: "-0.6"
    rubric:
      - >
        Cancels the two cross-covariances, leaving the difference of the
        variances in the numerator.
      - >
        Divides by both standard deviations rather than reporting the
        covariance $-3$.
    targets:
      - quant-probability.joint.correlation
    exercises:
      - quant-probability.joint.covariance

  - id: qjnt-correlation-02
    kind: work
    difficulty: demanding
    statement: >
      $X$, $Y$ and $Z$ are pairwise uncorrelated with variances $1$, $2$ and
      $3$. What is $\operatorname{Corr}(X+Y,\ Y+Z)$? Give four decimal places.
    answer: >
      $\approx 0.5164$. The shared variable is the only source of covariance:
      $\operatorname{Cov}(X+Y,\ Y+Z) = \operatorname{Cov}(X,Y)
      + \operatorname{Cov}(X,Z) + \operatorname{Var}(Y)
      + \operatorname{Cov}(Y,Z) = \operatorname{Var}(Y) = 2$. The two spreads
      are $\operatorname{Var}(X+Y) = 1 + 2 = 3$ and
      $\operatorname{Var}(Y+Z) = 2 + 3 = 5$. So
      $\rho = \dfrac{2}{\sqrt3\,\sqrt5} = \dfrac{2}{\sqrt{15}}
      \approx 0.5164$. Two portfolios that share one uncorrelated position are
      correlated purely through that position's share of each one's variance:
      the common leg supplies two thirds of the first combination's variance and
      two fifths of the second, yet $\rho$ is only just over $1/2$ — the
      geometric mean of those shares, $\sqrt{(2/3)(2/5)}$, which is the same
      number.
    expects: "0.5164"
    tolerance: 0.0005
    rubric:
      - >
        Notices that only $\operatorname{Var}(Y)$ survives in the numerator.
      - >
        Uses $\operatorname{Var}(X+Y)$ and $\operatorname{Var}(Y+Z)$ in the
        denominator, not the individual variances.
    targets:
      - quant-probability.joint.correlation
    exercises:
      - quant-probability.joint.covariance

  - id: qjnt-correlation-03
    kind: work
    difficulty: standard
    statement: >
      $\sigma_X = 2$, $\sigma_Y = 6$ and $\operatorname{Cov}(X,Y) = -3$. What is
      $\operatorname{Corr}(5X - 2,\ -4Y + 7)$?
    answer: >
      $0.25$. First $\rho_{XY} = \dfrac{-3}{(2)(6)} = -0.25$. Correlation
      ignores additive constants and keeps only the sign of the product of the
      multipliers: $\operatorname{Corr}(aX+b,\ cY+d)
      = \operatorname{sgn}(ac)\,\rho_{XY}$. Here $ac = (5)(-4) = -20 < 0$, so the
      sign flips and the answer is $-(-0.25) = 0.25$. The long route agrees: the
      covariance becomes $(5)(-4)(-3) = 60$, the standard deviations become
      $5(2) = 10$ and $|-4|(6) = 24$, and $60/240 = 0.25$. The magnitude never
      moves under rescaling — only the sign can, and only when exactly one of
      the two multipliers is negative.
    expects: "0.25"
    rubric:
      - >
        Drops the additive constants $-2$ and $7$ rather than trying to carry
        them.
      - >
        Divides by $|a|\sigma_X$ and $|c|\sigma_Y$, so the magnitude is
        unchanged and only the sign flips.
    targets:
      - quant-probability.joint.correlation

  # --- what correlation measures ---------------------------------------------

  - id: qjnt-correlation-linear-only-01
    kind: work
    difficulty: demanding
    statement: >
      A desk fits $Y$ linearly on a signal $X$. The unconditional variance of
      $Y$ is $0.60$; the variance left over after the best linear fit is
      $0.51$. What is $|\operatorname{Corr}(X,Y)|$, to four decimal places?
    answer: >
      $\approx 0.3873$. The only fact needed is the one $\rho$ actually
      encodes: a linear fit removes the fraction $\rho^{2}$ of the target's
      variance, so the residual variance is
      $\operatorname{Var}(Y)(1-\rho^{2})$. Reading that backwards,
      $1 - \rho^{2} = 0.51/0.60 = 0.85$, so $\rho^{2} = 0.15$ and
      $|\rho| = \sqrt{0.15} \approx 0.3873$. The trap is answering $0.15$ —
      that is $\rho^{2}$, the variance share, not the correlation. It is worth
      seeing the numbers side by side: a fit that leaves $85$ percent of the
      variance untouched still corresponds to a correlation near $0.39$, which
      is why quoting $\rho$ rather than $\rho^{2}$ flatters a weak signal.
    expects: "0.3873"
    tolerance: 0.0005
    rubric:
      - >
        Uses residual variance $= \operatorname{Var}(Y)(1-\rho^{2})$ rather
        than treating the residual share as $\rho$ itself.
      - >
        Takes the square root at the end, so the answer is $|\rho|$ and not
        $\rho^{2} = 0.15$.
    targets:
      - quant-probability.joint.correlation-linear-only
    exercises:
      - quant-probability.joint.correlation

  - id: qjnt-correlation-linear-only-02
    kind: decide
    difficulty: standard
    statement: >
      Signal A has correlation $0.7$ with next-day returns and signal B has
      $0.35$. A researcher concludes that A is twice as informative as B.
      Read through the variance a linear fit removes, what is the right
      comparison?
    answer: >
      The second. The honest scale is $\rho^{2}$, the fraction of the target's
      variance a linear fit removes: $0.7^{2} = 0.49$ against
      $0.35^{2} = 0.1225$, a ratio of exactly $4$, not $2$. Doubling a
      correlation quadruples the variance it explains, so every comparison of
      two raw $\rho$ values understates the gap between them. Note also what
      the two numbers are not: $\rho = 0.7$ does not mean "$70$ percent of the
      variance" — it means $49$ percent, and B's $0.35$ means $12.25$ percent,
      a signal that removes about an eighth of the variance while sounding
      like a third of one.
    choices:
      - text: >
          A removes twice the variance B does.
        feedback: >
          That is the raw-number reading squaring is meant to replace. The
          ratio of the variance shares is $0.49/0.1225 = 4$.
      - text: >
          A removes four times the variance B does — $0.49$ against $0.1225$.
        correct: true
        feedback: >
          Right: $\rho^{2}$ is the variance share, and it scales with the
          square, so a doubled correlation is a quadrupled explanation.
      - text: >
          A removes $70$ percent of the variance and B removes $35$ percent.
        feedback: >
          $\rho$ is not itself a fraction of variance; $\rho^{2}$ is. The
          shares are $49$ percent and $12.25$ percent.
      - text: >
          No comparison is possible without knowing $\sigma_Y$.
        feedback: >
          $\rho^{2}$ is already unit-free — the fraction of variance removed
          does not depend on the scale of $Y$ at all.
    rubric:
      - >
        Squares both correlations before comparing them.
      - >
        States the ratio of the variance shares, not the ratio of the raw
        correlations.
    targets:
      - quant-probability.joint.correlation-linear-only
    exercises:
      - quant-probability.joint.correlation

  # --- uncorrelated but not independent --------------------------------------

  - id: qjnt-uncorrelated-not-independent-01
    kind: work
    difficulty: demanding
    statement: >
      $\Theta$ is uniform on $[0, 2\pi)$, and $X = \cos\Theta$,
      $Y = \sin\Theta$, so $(X,Y)$ is a uniform point on the unit circle.
      These two are uncorrelated. What is $\operatorname{Cov}(X^{2}, Y^{2})$?
    answer: >
      $-1/8 = -0.125$. First the premise: $\mathbb{E}[X] = \mathbb{E}[Y] = 0$
      and $\mathbb{E}[XY] = \mathbb{E}[\cos\Theta\sin\Theta]
      = \tfrac12\mathbb{E}[\sin 2\Theta] = 0$, so
      $\operatorname{Cov}(X,Y) = 0$. Now the squares. Over a full period
      $\mathbb{E}[\cos^{2}\Theta] = \mathbb{E}[\sin^{2}\Theta] = 1/2$, so
      $\mathbb{E}[X^{2}] = \mathbb{E}[Y^{2}] = 1/2$. For the cross moment,
      $\cos^{2}\Theta\sin^{2}\Theta = \tfrac14\sin^{2} 2\Theta$, whose mean
      over a period is $\tfrac14\cdot\tfrac12 = \tfrac18$. Hence
      $\operatorname{Cov}(X^{2},Y^{2}) = \tfrac18 - \tfrac12\cdot\tfrac12
      = -\tfrac18$. The trap is concluding from $\operatorname{Cov}(X,Y) = 0$
      that nothing else can be correlated either: $X^{2} + Y^{2} = 1$ holds on
      every outcome, so the squares are perfectly negatively dependent, and
      indeed $\operatorname{Corr}(X^{2},Y^{2}) = -1$ once you divide by
      $\operatorname{Var}(X^{2}) = \operatorname{Var}(Y^{2}) = 1/8$.
    expects: "-1/8"
    tolerance: 0.0005
    rubric:
      - >
        Gets $\mathbb{E}[X^{2}] = \mathbb{E}[Y^{2}] = 1/2$ rather than
        assuming the squares inherit the mean $0$.
      - >
        Computes $\mathbb{E}[X^{2}Y^{2}] = 1/8$, for instance through
        $\cos^{2}\Theta\sin^{2}\Theta = \tfrac14\sin^{2}2\Theta$.
      - >
        Explains the negative answer by the constraint $X^{2} + Y^{2} = 1$,
        which zero correlation of $X$ and $Y$ never ruled out.
    targets:
      - quant-probability.joint.uncorrelated-not-independent
    exercises:
      - quant-probability.joint.covariance

  - id: qjnt-uncorrelated-not-independent-02
    kind: decide
    difficulty: standard
    statement: >
      $X$ is uniform on $\{1,2,3,4\}$ and $Y = \min(X,\ 5-X)$, so $Y$ takes
      the values $1,2,2,1$ as $X$ runs from $1$ to $4$. Which statement is
      correct?
    answer: >
      The second. The arithmetic first: $\mathbb{E}[X] = 2.5$,
      $\mathbb{E}[Y] = (1+2+2+1)/4 = 1.5$, and
      $\mathbb{E}[XY] = (1\cdot 1 + 2\cdot 2 + 3\cdot 2 + 4\cdot 1)/4
      = 15/4 = 3.75$, which is exactly $\mathbb{E}[X]\mathbb{E}[Y]
      = 2.5 \times 1.5$. So $\operatorname{Cov}(X,Y) = 0$ and $\rho = 0$. Yet
      $Y$ is a deterministic function of $X$: given $X = 3$ the value of $Y$
      is $2$ with probability $1$, against an unconditional
      $\Pr(Y = 2) = 1/2$. The cancellation is the usual one — $Y$ is symmetric
      about the midpoint $2.5$ of $X$'s range, so the two values of $X$ that
      produce each value of $Y$ sit equally far either side of the mean and
      their contributions to the covariance cancel.
    choices:
      - text: >
          $\operatorname{Cov}(X,Y) = 0$, so $X$ and $Y$ are independent.
        feedback: >
          Zero covariance is not independence. Here $Y$ is a function of $X$,
          which is the strongest dependence there is.
      - text: >
          $\operatorname{Cov}(X,Y) = 0$, yet $Y$ is determined by $X$, so the
          two are dependent.
        correct: true
        feedback: >
          Exactly. The symmetry of $Y$ about the middle of $X$'s range kills
          the linear signal and leaves the dependence untouched.
      - text: >
          $\operatorname{Cov}(X,Y) \ne 0$, because $Y$ is a deterministic
          function of $X$.
        feedback: >
          A deterministic relation can still have zero covariance when it is
          symmetric — here $\mathbb{E}[XY] = 3.75 = \mathbb{E}[X]\mathbb{E}[Y]$
          exactly.
      - text: >
          $\operatorname{Corr}(X,Y)$ is undefined because $Y$ takes only two
          values.
        feedback: >
          $Y$ is $1$ or $2$ with probability $1/2$ each, so
          $\operatorname{Var}(Y) = 0.25 > 0$ and $\rho$ is perfectly well
          defined — it equals $0$.
    rubric:
      - >
        Computes $\mathbb{E}[XY]$ over the four outcomes and compares it with
        $\mathbb{E}[X]\mathbb{E}[Y]$.
      - >
        Separates "no linear association" from "no association", and names the
        functional relation as the dependence.
    targets:
      - quant-probability.joint.uncorrelated-not-independent
    exercises:
      - quant-probability.joint.covariance
      - quant-probability.joint.independence-rvs

  # --- variance of a sum -----------------------------------------------------

  - id: qjnt-variance-sum-01
    kind: work
    difficulty: demanding
    statement: >
      $\operatorname{Var}(X) = 4$, $\operatorname{Var}(Y) = 9$,
      $\operatorname{Var}(Z) = 1$, with $\operatorname{Cov}(X,Y) = -2$,
      $\operatorname{Cov}(X,Z) = 1$ and $\operatorname{Cov}(Y,Z) = 3$. What is
      $\operatorname{Var}(2X - Y + 3Z)$?
    answer: >
      $36$. With weights $a = 2$, $b = -1$, $c = 3$ the expansion is
      $a^{2}\operatorname{Var}(X) + b^{2}\operatorname{Var}(Y)
      + c^{2}\operatorname{Var}(Z) + 2ab\operatorname{Cov}(X,Y)
      + 2ac\operatorname{Cov}(X,Z) + 2bc\operatorname{Cov}(Y,Z)$. Diagonal
      terms: $4(4) + 1(9) + 9(1) = 34$. Cross-terms:
      $2(2)(-1)(-2) = 8$, then $2(2)(3)(1) = 12$, then
      $2(-1)(3)(3) = -18$, summing to $2$. Total $34 + 2 = 36$. Two places to
      lose it: the weights enter the diagonal squared, so a coefficient of $3$
      contributes a factor of $9$; and each cross-term carries the product of
      two signed weights, so the negative covariance between $X$ and $Y$ ends
      up *increasing* the variance because $b$ is negative. Ignoring the
      cross-terms entirely would have given $34$.
    expects: "36"
    rubric:
      - >
        Squares the weights on the diagonal terms and doubles each of the
        three cross-terms.
      - >
        Carries the sign of $b = -1$ into both cross-terms it appears in, so
        $\operatorname{Cov}(X,Y) = -2$ contributes $+8$.
    targets:
      - quant-probability.joint.variance-sum
    exercises:
      - quant-probability.joint.covariance-bilinearity

  - id: qjnt-variance-sum-02
    kind: work
    difficulty: standard
    statement: >
      Ten positions each have variance $4$, and every pair has covariance
      $1$. What is the variance of their total?
    answer: >
      $130$. There are $n = 10$ diagonal terms and $\binom{10}{2} = 45$
      distinct pairs, each entering twice:
      $\operatorname{Var}\left(\sum_i X_i\right)
      = \sum_i \operatorname{Var}(X_i) + 2\sum_{i<j}\operatorname{Cov}(X_i,X_j)
      = 10(4) + 2(45)(1) = 40 + 90 = 130$. The cross-terms contribute more
      than twice what the variances do, which is the general lesson: the pair
      count $n(n-1)/2$ grows quadratically while the diagonal grows linearly,
      so for a book of any size a small common covariance dominates the total
      risk. Answering $40$ is the error of treating variance as additive; so
      is answering $85$, which counts each pair once instead of twice.
    expects: "130"
    rubric:
      - >
        Counts $\binom{10}{2} = 45$ pairs and multiplies the pair sum by $2$.
      - >
        Notices the covariance contribution exceeds the diagonal, rather than
        treating it as a small correction.
    targets:
      - quant-probability.joint.variance-sum
    exercises:
      - quant-probability.joint.covariance

  - id: qjnt-variance-sum-03
    kind: work
    difficulty: demanding
    statement: >
      For two finite-variance variables, $\operatorname{Var}(X+Y) = 3$ and
      $\operatorname{Var}(X-Y) = 11$. What is $\operatorname{Cov}(X,Y)$?
    answer: >
      $-2$. Write both expansions:
      $\operatorname{Var}(X+Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)
      + 2\operatorname{Cov}(X,Y)$ and
      $\operatorname{Var}(X-Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)
      - 2\operatorname{Cov}(X,Y)$. Subtracting kills the variances and leaves
      $4\operatorname{Cov}(X,Y) = 3 - 11 = -8$, so
      $\operatorname{Cov}(X,Y) = -2$. Adding instead gives the other half of
      the information, $\operatorname{Var}(X) + \operatorname{Var}(Y)
      = (3 + 11)/2 = 7$. Note what is *not* recoverable: the split of that $7$
      between the two variables, hence $\rho$ itself, is not determined by the
      two given numbers — the sum and difference variances pin down the
      covariance and the total variance, and nothing more. Dividing $-8$ by
      $2$ instead of $4$ is the standard slip.
    expects: "-2"
    rubric:
      - >
        Subtracts the two expansions so the variances cancel, and divides the
        difference by $4$.
      - >
        Recognizes that $\operatorname{Var}(X) + \operatorname{Var}(Y) = 7$
        follows but the individual variances, and so $\rho$, do not.
    targets:
      - quant-probability.joint.variance-sum
    exercises:
      - quant-probability.joint.covariance-bilinearity

  # --- variances add when uncorrelated ---------------------------------------

  - id: qjnt-variance-independent-sum-01
    kind: work
    difficulty: demanding
    statement: >
      A trader's individual trades are uncorrelated, each with a standard
      deviation of $4000$ dollars. How many trades are needed before the
      standard deviation of the cumulative profit first exceeds $100000$
      dollars?
    answer: >
      $626$. Uncorrelated summands make variances add, so $n$ trades give
      $\operatorname{Var} = n(4000)^{2}$ and a standard deviation of
      $4000\sqrt{n}$ — the $\sqrt{n}$ law. Solve
      $4000\sqrt{n} > 100000$: $\sqrt{n} > 25$, so $n > 625$, and the first
      integer that works is $626$. At exactly $n = 625$ the standard deviation
      is $4000(25) = 100000$ dollars, which does not exceed the threshold, so
      the strict inequality matters. Two traps sit here: writing
      $\operatorname{Var} = n(4000)$ rather than $n(4000)^{2}$ adds standard
      deviations instead of variances, and reading $\sqrt{n} > 25$ as
      $n > 25$ loses the square. Note the scale — quadrupling the total risk
      takes sixteen times the trade count.
    expects: "626"
    rubric:
      - >
        Adds variances, not standard deviations, so the total standard
        deviation is $4000\sqrt{n}$.
      - >
        Solves the inequality strictly and rounds up, giving $626$ rather
        than $625$.
    targets:
      - quant-probability.joint.variance-independent-sum
    exercises:
      - quant-probability.joint.variance-sum

  - id: qjnt-variance-independent-sum-02
    kind: work
    difficulty: standard
    statement: >
      $X$, $Y$ and $Z$ are pairwise uncorrelated with variances $2$, $3$ and
      $6$. What is $\operatorname{Var}(X - Y + Z)$?
    answer: >
      $11$. Every cross-term carries a covariance factor, and all three
      pairwise covariances are $0$, so the whole off-diagonal sum drops and
      only the weighted diagonal survives:
      $\operatorname{Var}(X - Y + Z) = 1^{2}(2) + (-1)^{2}(3) + 1^{2}(6)
      = 2 + 3 + 6 = 11$. The minus sign is the trap. Weights enter the
      diagonal squared, so $(-1)^{2} = 1$ and subtracting $Y$ adds its
      variance exactly as adding it would: a spread between two uncorrelated
      legs is noisier than either leg, not quieter. Answering $5$ by
      subtracting $\operatorname{Var}(Y)$ is the single most common error in
      this subbranch. Note that pairwise uncorrelated is all that is used —
      full independence is never needed.
    expects: "11"
    rubric:
      - >
        Drops every cross-term on the strength of pairwise zero covariance,
        without assuming independence.
      - >
        Squares the coefficient $-1$, so $\operatorname{Var}(Y)$ is added and
        not subtracted.
    targets:
      - quant-probability.joint.variance-independent-sum
    exercises:
      - quant-probability.joint.variance-sum

  # --- the covariance matrix -------------------------------------------------

  - id: qjnt-covariance-matrix-01
    kind: decide
    difficulty: demanding
    statement: >
      Three variables each have variance $1$, so a proposed covariance matrix
      for them is a symmetric table of pairwise correlations with ones on the
      diagonal. Four are offered below as row lists. Which one cannot be a
      covariance matrix?
    answer: >
      The second. A covariance matrix must satisfy
      $a'\Sigma a = \operatorname{Var}(a'X) \ge 0$ for every weight vector $a$,
      and for rows $(1, 0.9, -0.9)$, $(0.9, 1, 0.9)$, $(-0.9, 0.9, 1)$ the
      choice $a = (1,-1,1)$ gives
      $1 + 1 + 1 + 2\left[(1)(-1)(0.9) + (1)(1)(-0.9) + (-1)(1)(0.9)\right]
      = 3 - 5.4 = -2.4$, a negative variance. So no random vector has these
      covariances, however innocent each entry looks on its own. That is the
      trap: every off-diagonal entry lies in $[-1,1]$, so each *pair* is
      individually legal — $X_1$ and $X_2$ nearly move together, $X_2$ and
      $X_3$ nearly move together, and yet $X_1$ and $X_3$ are asked to move
      nearly opposite. Positive semidefiniteness is a joint condition on the
      whole table, not a check you can run pair by pair.
    choices:
      - text: >
          Rows $(1, 0.8, 0.8)$, $(0.8, 1, 0.8)$, $(0.8, 0.8, 1)$
        feedback: >
          Valid. Every pair shares the same correlation $0.8$, comfortably
          above the floor $-1/2$ for three variables, and
          $\operatorname{Var}(X_1+X_2+X_3) = 3 + 6(0.8) = 7.8 > 0$.
      - text: >
          Rows $(1, 0.9, -0.9)$, $(0.9, 1, 0.9)$, $(-0.9, 0.9, 1)$
        correct: true
        feedback: >
          Right: $\operatorname{Var}(X_1 - X_2 + X_3) = 3 - 5.4 = -2.4 < 0$, so
          this table is not positive semidefinite and no random vector has it.
      - text: >
          Rows $(1, 0.5, -0.5)$, $(0.5, 1, -0.5)$, $(-0.5, -0.5, 1)$
        feedback: >
          Valid. Its determinant is $0.5 > 0$ and both leading minors are
          positive, so the matrix is positive definite.
      - text: >
          Rows $(1, 0, 0.6)$, $(0, 1, 0)$, $(0.6, 0, 1)$
        feedback: >
          Valid. $X_2$ is uncorrelated with both others, and the remaining
          $2 \times 2$ block has determinant $1 - 0.36 = 0.64 > 0$.
    rubric:
      - >
        Tests candidates by finding a weight vector whose quadratic form
        $a'\Sigma a$ is negative, not by checking entries one pair at a time.
      - >
        States that $|\rho| \le 1$ on every pair is necessary but not
        sufficient for the whole table.
    targets:
      - quant-probability.joint.covariance-matrix
      - quant-tools.linear-algebra.psd
    exercises:
      - quant-probability.joint.covariance-bilinearity
    connects:
      - "quant-probability.joint.covariance-matrix ~ quant-tools.linear-algebra.psd"

  - id: qjnt-covariance-matrix-02
    kind: work
    difficulty: demanding
    statement: >
      Two assets have $\operatorname{Var}(X) = 4$, $\operatorname{Var}(Y) = 9$
      and $\operatorname{Cov}(X,Y) = -2$. A portfolio holds weight $w$ in $X$
      and $1-w$ in $Y$. Which $w$ minimizes the portfolio's variance?
    answer: >
      $w = 11/17 \approx 0.6471$. The quadratic form is
      $a'\Sigma a$ with $a = (w,\,1-w)$, that is
      $g(w) = w^{2}(4) + (1-w)^{2}(9) + 2w(1-w)(-2)$. Differentiate:
      $g'(w) = 2w(4) - 2(1-w)(9) + 2(1-2w)(-2)
      = 8w - 18 + 18w - 4 + 8w = 34w - 22$, so $w = 22/34 = 11/17$. In general
      $w^{*} = \dfrac{\sigma_Y^{2} - \operatorname{Cov}}{\sigma_X^{2} + \sigma_Y^{2} - 2\operatorname{Cov}} = \dfrac{9+2}{4+9+4} = \dfrac{11}{17}$, and $g''(w) = 34 > 0$ confirms a
      minimum. The negative covariance pulls weight *toward* the pair rather
      than away from it: it enters both the numerator and the denominator with
      a sign flip, and the resulting minimum variance,
      $g(11/17) = 32/17 \approx 1.88$, sits below the smaller of the two
      variances — the only situation in which combining two positions is
      genuinely quieter than holding the calmer one alone.
    expects: "11/17"
    tolerance: 0.0005
    rubric:
      - >
        Writes the portfolio variance as the quadratic form in $w$, including
        the $2w(1-w)\operatorname{Cov}$ cross-term.
      - >
        Differentiates and solves, or quotes
        $w^{*} = (\sigma_Y^{2} - \operatorname{Cov})/
        (\sigma_X^{2}+\sigma_Y^{2}-2\operatorname{Cov})$, carrying the sign of
        the negative covariance in both places.
    targets:
      - quant-probability.joint.covariance-matrix
    exercises:
      - quant-probability.joint.covariance-bilinearity
      - quant-probability.joint.covariance

  - id: qjnt-covariance-matrix-03
    kind: work
    difficulty: standard
    statement: >
      A covariance matrix has rows $(9, -6, 0)$, $(-6, 16, 8)$ and
      $(0, 8, 25)$. What is the entry of the corresponding correlation matrix
      in row $2$, column $3$?
    answer: >
      $0.4$. The correlation matrix is $D^{-1}\Sigma D^{-1}$ with
      $D = \operatorname{diag}(\sigma_1,\sigma_2,\sigma_3)$, so each entry is
      divided by the two standard deviations of its row and column, and those
      come off the diagonal of $\Sigma$: $\sigma_1 = \sqrt9 = 3$,
      $\sigma_2 = \sqrt{16} = 4$, $\sigma_3 = \sqrt{25} = 5$. Hence
      $\rho_{23} = \dfrac{\Sigma_{23}}{\sigma_2\sigma_3} = \dfrac{8}{(4)(5)}
      = 0.4$. For the record the other two are $\rho_{12} = -6/12 = -0.5$ and
      $\rho_{13} = 0$, so the correlation matrix has rows $(1, -0.5, 0)$,
      $(-0.5, 1, 0.4)$, $(0, 0.4, 1)$ — ones on the diagonal, as it must. The
      trap is dividing by the variances $16$ and $25$ instead of by their
      square roots, which would give $8/400 = 0.02$ and an absurdly weak
      reading of a fairly strong relationship.
    expects: "0.4"
    rubric:
      - >
        Takes the standard deviations from the diagonal by square-rooting, and
        divides by $\sigma_2\sigma_3$, not by $\sigma_2^{2}\sigma_3^{2}$.
      - >
        Checks that the resulting diagonal is all ones.
    targets:
      - quant-probability.joint.covariance-matrix
    exercises:
      - quant-probability.joint.covariance

  # --- correlation is not transitive -----------------------------------------

  - id: qjnt-correlation-transitivity-01
    kind: work
    difficulty: demanding
    statement: >
      $\operatorname{Corr}(X,Y) = \operatorname{Corr}(Y,Z) = 0.7$. What is the
      smallest value $\operatorname{Corr}(X,Z)$ can take?
    answer: >
      $-0.02$. The $3\times 3$ correlation matrix must be positive
      semidefinite, and requiring its determinant to be nonnegative confines
      the third correlation to
      $\rho_{XZ} \in \left[\rho_{XY}\rho_{YZ}
      - \sqrt{(1-\rho_{XY}^{2})(1-\rho_{YZ}^{2})},\;
      \rho_{XY}\rho_{YZ}
      + \sqrt{(1-\rho_{XY}^{2})(1-\rho_{YZ}^{2})}\right]$. Here the centre is
      $0.7^{2} = 0.49$ and the half-width is
      $\sqrt{(1-0.49)(1-0.49)} = 0.51$, so the interval is
      $[0.49 - 0.51,\ 0.49 + 0.51] = [-0.02,\ 1]$ and the minimum is $-0.02$.
      The number is worth remembering for how close it runs: positivity is
      forced only once both legs exceed $1/\sqrt2 \approx 0.7071$, and $0.7$
      sits just under that threshold, so two fairly strong correlations
      through a common variable still leave the outer pair able — barely — to
      be negatively correlated. Answering $0.49$ reports the centre of the
      interval as if the correlation were determined.
    expects: "-0.02"
    rubric:
      - >
        Uses the PSD bound with centre $\rho_{XY}\rho_{YZ}$ and half-width
        $\sqrt{(1-\rho_{XY}^{2})(1-\rho_{YZ}^{2})}$, not a guess.
      - >
        Reports the lower endpoint rather than the centre, and connects the
        sign to the $1/\sqrt2$ threshold.
    targets:
      - quant-probability.joint.correlation-transitivity
    exercises:
      - quant-probability.joint.correlation
      - quant-probability.joint.covariance-matrix

  - id: qjnt-correlation-transitivity-02
    kind: work
    difficulty: standard
    statement: >
      $\operatorname{Corr}(X,Y) = 1$ and $\operatorname{Corr}(Y,Z) = 0.4$.
      What is $\operatorname{Corr}(X,Z)$?
    answer: >
      $0.4$, and it is forced. The bound gives centre
      $\rho_{XY}\rho_{YZ} = (1)(0.4) = 0.4$ and half-width
      $\sqrt{(1 - 1^{2})(1 - 0.4^{2})} = \sqrt{0 \cdot 0.84} = 0$, so the
      interval collapses to the single point $0.4$. The reason is more direct
      than the formula: $|\rho_{XY}| = 1$ means $X = aY + b$ with probability
      $1$ for some $a > 0$, and correlation is unchanged by a positive affine
      rescaling, so $\operatorname{Corr}(X,Z) = \operatorname{Corr}(Y,Z)$
      exactly. Transitivity holds only in this degenerate corner: the moment
      either leg drops below $1$ in absolute value the interval opens up, and
      at $\rho_{XY} = \rho_{YZ} = 0.9$ it is already the whole of
      $[0.62,\ 1]$.
    expects: "0.4"
    rubric:
      - >
        Notices the half-width vanishes when one leg has $|\rho| = 1$, so the
        interval is a single point.
      - >
        Explains the collapse by the exact linear relation between $X$ and $Y$
        and correlation's invariance under positive rescaling.
    targets:
      - quant-probability.joint.correlation-transitivity
    exercises:
      - quant-probability.joint.correlation

  # --- the equicorrelation floor ---------------------------------------------

  - id: qjnt-equicorrelation-bound-01
    kind: work
    difficulty: demanding
    statement: >
      Four strategies each have a standard deviation of $0.2$, and every pair
      has correlation $-0.2$. What is the standard deviation of their equally
      weighted average, to four decimal places?
    answer: >
      $\approx 0.0632$. For $n$ equally correlated variables of common
      variance $\sigma^{2}$, the sum has
      $\operatorname{Var}\left(\sum_i X_i\right)
      = n\sigma^{2}\left(1 + (n-1)\rho\right)$. With $n = 4$,
      $\sigma^{2} = 0.04$ and $\rho = -0.2$ that is
      $4(0.04)\left(1 + 3(-0.2)\right) = 0.16(0.4) = 0.064$. The average is the
      sum divided by $4$, and dividing a variable by $4$ divides its variance
      by $16$: $0.064/16 = 0.004$, so the standard deviation is
      $\sqrt{0.004} \approx 0.0632$. Two checks. The correlation is legal:
      the floor for four variables is $-1/(n-1) = -1/3$, and $-0.2$ clears it.
      And the diversification is real but bounded — independent strategies
      would have given $0.2/\sqrt4 = 0.1$, so the negative correlation buys a
      further reduction of about a third. Forgetting to divide by $n^{2}$ and
      reporting $\sqrt{0.064} \approx 0.253$ is the usual slip.
    expects: "0.0632"
    tolerance: 0.0005
    rubric:
      - >
        Uses $n\sigma^{2}(1 + (n-1)\rho)$ with $n-1 = 3$, not $n = 4$, in the
        correlation term.
      - >
        Divides the sum's variance by $n^{2} = 16$ before taking the square
        root.
      - >
        Checks $-0.2$ against the floor $-1/3$ for four variables.
    targets:
      - quant-probability.joint.equicorrelation-bound
    exercises:
      - quant-probability.joint.variance-sum
      - quant-probability.joint.correlation

  - id: qjnt-equicorrelation-bound-02
    kind: decide
    difficulty: standard
    statement: >
      A risk manager wants seven strategies of equal variance, every pair
      correlated at exactly $-0.15$. Is such a configuration possible?
    answer: >
      Yes. Equicorrelation forces
      $\operatorname{Var}\left(\sum_i X_i\right)
      = n\sigma^{2}(1 + (n-1)\rho) \ge 0$, hence
      $\rho \ge -\dfrac{1}{n-1}$. With $n = 7$ the floor is
      $-1/6 \approx -0.1667$, and $-0.15$ sits above it, so the structure is
      admissible; the sum then has variance
      $7\sigma^{2}(1 + 6(-0.15)) = 7\sigma^{2}(0.1) = 0.7\sigma^{2}$, positive
      as required. The trap is the divisor: the floor is $-1/(n-1)$, counting
      the *other* variables each one is correlated with, not $-1/n$. Using
      $-1/7 \approx -0.1429$ would have rejected a perfectly valid
      configuration. Note how little slack is left — one more strategy pushes
      the floor to $-1/7$ and the same $-0.15$ becomes impossible.
    choices:
      - text: >
          Yes — the floor for $n = 7$ is $-1/6 \approx -0.1667$, and $-0.15$
          clears it.
        correct: true
        feedback: >
          Right. $\rho \ge -1/(n-1)$ is the whole constraint, and the sum's
          variance comes out at $0.7\sigma^{2} > 0$.
      - text: >
          No — the floor for $n = 7$ is $-1/7 \approx -0.1429$, and $-0.15$
          falls below it.
        feedback: >
          The divisor is $n - 1$, not $n$: each variable is correlated with
          the other six, so the floor is $-1/6$.
      - text: >
          No — a common negative correlation is impossible for any $n$ beyond
          $2$.
        feedback: >
          Only $\rho = -1$ is exclusive to $n = 2$. The floor $-1/(n-1)$ stays
          strictly negative for every finite $n$.
      - text: >
          Yes, and $-0.15$ would work for any number of strategies.
        feedback: >
          The floor tightens with $n$: at $n = 8$ it is
          $-1/7 \approx -0.1429$, and $-0.15$ is already below that.
    rubric:
      - >
        Applies $\rho \ge -1/(n-1)$ with the divisor $n-1 = 6$.
      - >
        Justifies the floor by nonnegativity of the variance of the sum, not
        by recall alone.
    targets:
      - quant-probability.joint.equicorrelation-bound
    exercises:
      - quant-probability.joint.variance-sum

  # --- convolution -----------------------------------------------------------

  - id: qjnt-convolution-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is uniform on $[0,1]$ and, independently, $Y$ is exponential with
      rate $1$. Let $S = X + Y$. What is the density $f_S(1)$? Use
      $e^{-1} \approx 0.3679$.
    answer: >
      $1 - e^{-1} \approx 0.6321$. Convolution reads
      $f_S(s) = \int f_X(x) f_Y(s-x)\,dx$, and the limits come from the two
      supports: $f_X$ needs $0 \le x \le 1$ and $f_Y$ needs $s - x \ge 0$,
      that is $x \le s$. At $s = 1$ both conditions give $x \in [0,1]$, so
      $f_S(1) = \int_0^{1} 1 \cdot e^{-(1-x)}\,dx
      = e^{-1}\int_0^{1} e^{x}\,dx = e^{-1}(e - 1) = 1 - e^{-1}
      \approx 0.6321$. The whole difficulty of a convolution is the limits,
      not the integrand: had the question asked for $f_S(3)$ the exponential
      would put no upper bound on $s - x$, so only the uniform's
      $0 \le x \le 1$ would bind, giving
      $\int_0^{1} e^{-(3-x)}dx = e^{-2} - e^{-3}$ instead. Integrating over all of $\mathbb{R}$ without cutting the range
      down to where both densities are positive is the standard error.
    expects: "0.6321"
    tolerance: 0.0005
    rubric:
      - >
        Sets the limits from both supports at once — $0 \le x \le 1$ from the
        uniform and $x \le s$ from the exponential.
      - >
        Evaluates $\int_0^1 e^{-(1-x)}dx = 1 - e^{-1}$ rather than leaving the
        exponential factor outside.
    targets:
      - quant-probability.joint.convolution
    exercises:
      - quant-probability.joint.independence-rvs

  - id: qjnt-convolution-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is uniform on $\{0,1,2\}$ and, independently, $Y$ is uniform on
      $\{0,1,2,3\}$. What is $\Pr(X + Y = 3)$?
    answer: >
      $1/4$. The discrete convolution sums over every split of the target:
      $p_S(3) = \sum_x p_X(x)\,p_Y(3-x)$. Running $x$ over $X$'s support,
      $x = 0$ needs $y = 3$, $x = 1$ needs $y = 2$, and $x = 2$ needs $y = 1$
      — all three land inside $\{0,1,2,3\}$, so all three contribute:
      $p_S(3) = 3 \cdot \tfrac13 \cdot \tfrac14 = \tfrac14$. Independence is
      what licences multiplying the two pmfs cell by cell; without it the
      joint would have to be summed directly. Note that $3$ is the only total
      for which every value of $X$ has a partner, which is why it is the modal
      value of the sum — at $s = 4$, for instance, $x = 0$ would need $y = 4$,
      outside $Y$'s support, and the probability drops to $2/12 = 1/6$.
    expects: "1/4"
    tolerance: 0.0005
    rubric:
      - >
        Sums over the splits $x + y = 3$ and keeps only those with both values
        inside their supports.
      - >
        Multiplies the two pmfs, citing independence as the licence for it.
    targets:
      - quant-probability.joint.convolution
    exercises:
      - quant-probability.joint.independence-rvs

  # --- sums of independent Poissons ------------------------------------------

  - id: qjnt-convolution-poisson-01
    kind: work
    difficulty: demanding
    statement: >
      Two independent Poisson streams arrive at rates $2$ and $6$ per hour. In
      one hour, $12$ arrivals were observed in total. What is the variance of
      the number of them that came from the slower stream?
    answer: >
      $2.25$. Convolving the two pmfs shows the pooled count is
      $\operatorname{Poisson}(2+6) = \operatorname{Poisson}(8)$; reading the
      same computation backwards gives the conditional law, and that is what
      is asked for here. Given a total of $n$, the count from the first source
      is $\operatorname{Binomial}\left(n,\ \lambda/(\lambda+\mu)\right)$ —
      each arrival came from the slower stream with probability
      $2/8 = 0.25$, independently of the others. So the count is
      $\operatorname{Binomial}(12, 0.25)$ and its variance is
      $np(1-p) = 12(0.25)(0.75) = 2.25$. Two traps. The unconditional variance
      of the slower stream's count is its mean, $2$ — conditioning on the
      total changes the answer, and the binomial variance is strictly below
      the mean $np = 3$ because the total is now fixed. And the split
      probability is a share of the pooled rate, $\lambda/(\lambda+\mu)$,
      never the ratio $\lambda/\mu = 1/3$.
    expects: "2.25"
    rubric:
      - >
        Uses the conditional binomial split with $p = \lambda/(\lambda+\mu)$,
        not the unconditional Poisson law.
      - >
        Computes $np(1-p)$ rather than the Poisson variance $np$.
    targets:
      - quant-probability.joint.convolution-poisson
    exercises:
      - quant-probability.joint.convolution

  - id: qjnt-convolution-poisson-02
    kind: work
    difficulty: standard
    statement: >
      $X \sim \operatorname{Poisson}(1.5)$ and $Y \sim
      \operatorname{Poisson}(2.5)$ are independent. What is $\Pr(X + Y = 2)$?
      Use $e^{-4} \approx 0.018316$.
    answer: >
      $\approx 0.1465$. Independent Poisson rates add under convolution, so
      $X + Y \sim \operatorname{Poisson}(1.5 + 2.5)
      = \operatorname{Poisson}(4)$ and the answer is one evaluation of that
      pmf: $\Pr(X+Y=2) = e^{-4}\dfrac{4^{2}}{2!} = 8e^{-4}
      \approx 8(0.018316) = 0.1465$. Doing it the long way agrees and shows
      where the closure comes from:
      $\sum_{k=0}^{2} e^{-1.5}\dfrac{1.5^{k}}{k!}
      e^{-2.5}\dfrac{2.5^{2-k}}{(2-k)!}
      = \dfrac{e^{-4}}{2!}\sum_{k=0}^{2}\binom{2}{k}1.5^{k}2.5^{2-k}
      = \dfrac{e^{-4}}{2}(1.5+2.5)^{2}$, the binomial theorem collapsing the
      sum. The trap is averaging the rates to $2$ instead of adding them: that
      would give $2e^{-2} \approx 0.271$, nearly twice the truth.
    expects: "0.1465"
    tolerance: 0.0005
    rubric:
      - >
        Adds the rates rather than averaging them, giving
        $\operatorname{Poisson}(4)$.
      - >
        Evaluates the Poisson pmf at $2$ with the $2!$ in the denominator.
    targets:
      - quant-probability.joint.convolution-poisson
      - quant-probability.discrete.poisson
    exercises:
      - quant-probability.joint.convolution
    connects:
      - "quant-probability.discrete.poisson ~ quant-probability.joint.convolution-poisson"

  # --- expected max and min --------------------------------------------------

  - id: qjnt-expected-max-min-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ and $Y$ are independent exponentials, each with rate $1$. What is
      $\mathbb{E}[\max(X,Y)]$?
    answer: >
      $3/2$. The identity route needs one number,
      $\mathbb{E}|X - Y|$. Condition on which is larger: by memorylessness,
      given $X > Y$ the overshoot $X - Y$ is again exponential with rate $1$,
      and symmetrically the other way, so $|X-Y| \sim
      \operatorname{Exponential}(1)$ and $\mathbb{E}|X-Y| = 1$. Then
      $\mathbb{E}[\max(X,Y)]
      = \dfrac{\mathbb{E}[X] + \mathbb{E}[Y] + \mathbb{E}|X-Y|}{2}
      = \dfrac{1 + 1 + 1}{2} = \dfrac{3}{2}$, and the minimum is
      $(1+1-1)/2 = 1/2$. The extremes route agrees: for independent variables
      $\Pr(\max \le t) = (1 - e^{-t})^{2}$, so
      $\mathbb{E}[\max] = \int_0^{\infty}\left(2e^{-t} - e^{-2t}\right)dt
      = 2 - \tfrac12 = \tfrac32$, using that $\min(X,Y)$ is exponential with
      rate $2$ and mean $1/2$. The trap is
      $\mathbb{E}|X-Y| = |\mathbb{E}[X] - \mathbb{E}[Y]| = 0$, which would
      make the max and the min both equal $1$ — the two agree only when the
      variables never cross in value, and here they cross half the time.
    expects: "3/2"
    tolerance: 0.0005
    rubric:
      - >
        Gets $\mathbb{E}|X-Y| = 1$ by an argument, not by confusing it with
        $|\mathbb{E}[X] - \mathbb{E}[Y]|$.
      - >
        Applies
        $\mathbb{E}[\max] = (\mathbb{E}[X]+\mathbb{E}[Y]+\mathbb{E}|X-Y|)/2$,
        or checks the answer against the tail integral of $\max$.
    targets:
      - quant-probability.joint.expected-max-min
      - quant-probability.random-variables.min-max
    exercises:
      - quant-probability.joint.joint-law
    connects:
      - "quant-probability.joint.expected-max-min ~ quant-probability.random-variables.min-max"

  - id: qjnt-expected-max-min-02
    kind: work
    difficulty: standard
    statement: >
      Two variables have $\mathbb{E}[X] = 4$, $\mathbb{E}[Y] = 7$ and
      $\mathbb{E}|X - Y| = 5$. Nothing is said about whether they are
      independent. What is $\mathbb{E}[\min(X,Y)]$?
    answer: >
      $3$. Nothing more is needed than the two pointwise identities
      $\max(X,Y) + \min(X,Y) = X + Y$ and
      $\max(X,Y) - \min(X,Y) = |X - Y|$; subtracting them and taking
      expectations, which is linear and needs no independence, gives
      $\mathbb{E}[\min(X,Y)]
      = \dfrac{\mathbb{E}[X] + \mathbb{E}[Y] - \mathbb{E}|X-Y|}{2}
      = \dfrac{4 + 7 - 5}{2} = 3$, with
      $\mathbb{E}[\max] = (4+7+5)/2 = 8$ as the partner. Sanity check: the two
      answers sum to $11 = \mathbb{E}[X] + \mathbb{E}[Y]$, as they must. The
      silence about independence is deliberate — all the dependence is already
      packed into the single number $\mathbb{E}|X-Y|$, so the identity is
      insensitive to it. Note $\mathbb{E}[\min] = 3$ sits below both means,
      which is right: the smaller of two variables is at most either one on
      every outcome.
    expects: "3"
    rubric:
      - >
        Uses the minus sign on $\mathbb{E}|X-Y|$ for the minimum and divides
        the whole thing by $2$.
      - >
        Does not ask for independence, and checks
        $\mathbb{E}[\max] + \mathbb{E}[\min] = \mathbb{E}[X] + \mathbb{E}[Y]$.
    targets:
      - quant-probability.joint.expected-max-min
    exercises:
      - quant-probability.joint.joint-law

  # --- the bivariate normal --------------------------------------------------

  - id: qjnt-bivariate-normal-01
    kind: work
    difficulty: demanding
    statement: >
      $(X,Y)$ is bivariate normal with both marginals standard normal and
      $\rho = 0.6$. What is $\Pr(Y > 1 \mid X = 1)$? Use
      $\Phi(0.5) = 0.6915$.
    answer: >
      $\approx 0.3085$. Conditioning on $X = 1$ leaves $Y$ normal with mean
      $\mu_Y + \rho\dfrac{\sigma_Y}{\sigma_X}(x - \mu_X)
      = 0 + 0.6(1)(1) = 0.6$ and variance
      $\sigma_Y^{2}(1-\rho^{2}) = 1 - 0.36 = 0.64$, so the conditional
      standard deviation is $0.8$. Standardize the event:
      $\Pr(Y > 1 \mid X = 1)
      = \Pr\left(Z > \dfrac{1 - 0.6}{0.8}\right) = \Pr(Z > 0.5)
      = 1 - 0.6915 = 0.3085$. Two things move at once and both must be
      carried. The centre shifts only $\rho$ of the way — a one-sigma move in
      $X$ forecasts a $0.6$-sigma move in $Y$, never a full one — and the
      spread shrinks to $0.8$, so the threshold sits half a conditional sigma
      out rather than the full sigma it was unconditionally. Using the
      unconditional $\Pr(Y > 1) = 0.1587$, or keeping the mean shift while
      forgetting the $(1-\rho^{2})$ shrinkage and computing $\Pr(Z > 0.4)$,
      are the two standard misses.
    expects: "0.3085"
    tolerance: 0.0005
    rubric:
      - >
        Gets the conditional mean $0.6$ from the regression line, not the
        conditioning value $1$.
      - >
        Uses the conditional standard deviation
        $\sqrt{\sigma_Y^{2}(1-\rho^{2})} = 0.8$ when standardizing.
    targets:
      - quant-probability.joint.bivariate-normal
    exercises:
      - quant-probability.joint.correlation
      - quant-probability.continuous.normal

  - id: qjnt-bivariate-normal-02
    kind: work
    difficulty: standard
    statement: >
      $(X,Y)$ is bivariate normal with $\sigma_X = 3$, $\sigma_Y = 4$ and
      $\rho = -0.5$. What is the standard deviation of $2X - Y$, to four
      decimal places?
    answer: >
      $\sqrt{76} \approx 8.7178$. Joint normality does one job here: it
      guarantees that $2X - Y$ is itself normal, so a mean and a variance
      describe it completely. The variance is ordinary bookkeeping. First the
      covariance, $\operatorname{Cov}(X,Y) = \rho\sigma_X\sigma_Y
      = -0.5(3)(4) = -6$. Then
      $\operatorname{Var}(2X - Y) = 4\operatorname{Var}(X)
      + \operatorname{Var}(Y) + 2(2)(-1)\operatorname{Cov}(X,Y)
      = 4(9) + 16 - 4(-6) = 36 + 16 + 24 = 76$, so the standard deviation is
      $\sqrt{76} \approx 8.7178$. The negative correlation *raises* the risk
      of this combination, because the position is a difference: the
      cross-term carries the product of the two weights, $2$ and $-1$, whose
      sign flips the covariance's contribution. Under independence the answer
      would have been $\sqrt{52} \approx 7.2111$.
    expects: "8.7178"
    tolerance: 0.0005
    rubric:
      - >
        Converts $\rho$ to $\operatorname{Cov}(X,Y) = \rho\sigma_X\sigma_Y$
        before using it in the variance.
      - >
        Carries the weight $-1$ into the cross-term, so a negative covariance
        adds to the variance, and takes the square root at the end.
    targets:
      - quant-probability.joint.bivariate-normal
    exercises:
      - quant-probability.joint.correlation
      - quant-probability.continuous.normal

  - id: qjnt-bivariate-normal-03
    kind: decide
    difficulty: demanding
    statement: >
      $(X,Y)$ is bivariate normal with both marginals standard normal and
      $\rho = 0.5$. A trader observes $X = 3$ and says: my forecast for $Y$ is
      $3$, and I am less confident in it than I would be at $X = 0$. Which
      reading is right?
    answer: >
      The first. Both halves of the trader's claim are wrong, and each is
      wrong in a standard way. The conditional mean is
      $\mu_Y + \rho\dfrac{\sigma_Y}{\sigma_X}(x - \mu_X) = 0.5(3) = 1.5$, not
      $3$: a $k$-sigma move in $X$ forecasts a $\rho k$-sigma move in $Y$,
      so a three-sigma observation forecasts one and a half sigma, and only
      $|\rho| = 1$ would give a full move. The conditional variance is
      $\sigma_Y^{2}(1-\rho^{2}) = 1 - 0.25 = 0.75$, a constant free of $x$, so
      the residual standard deviation is $\sqrt{0.75} \approx 0.866$ at
      $X = 3$ exactly as it is at $X = 0$ — confidence does not decay with the
      extremity of the observation. Note also that it is strictly below the
      unconditional $1$: conditioning on $X$ always removes the fraction
      $\rho^{2}$ of $Y$'s variance.
    choices:
      - text: >
          Forecast $1.5$, with residual standard deviation
          $\sqrt{0.75} \approx 0.866$ — the same at every value of $x$.
        correct: true
        feedback: >
          Right on both counts: the mean shrinks by $\rho$, and the
          conditional variance $\sigma_Y^{2}(1-\rho^{2})$ does not depend on
          the conditioning value.
      - text: >
          Forecast $3$, with residual standard deviation
          $\sqrt{0.75} \approx 0.866$.
        feedback: >
          The spread is right but the centre is not. A move of $3$ in $X$
          forecasts $\rho(3) = 1.5$ in $Y$; a one-for-one move needs
          $\rho = 1$.
      - text: >
          Forecast $1.5$, with a residual standard deviation larger at
          $x = 3$ than at $x = 0$.
        feedback: >
          The conditional variance is $\sigma_Y^{2}(1-\rho^{2})$, free of $x$
          — an extreme observation does not make the forecast noisier.
      - text: >
          Forecast $1.5$, with residual standard deviation $1$, since the
          marginal of $Y$ is standard normal.
        feedback: >
          That drops the $(1-\rho^{2})$ shrinkage. Conditioning on $X$ removes
          $\rho^{2} = 25$ percent of $Y$'s variance, leaving $0.75$.
    rubric:
      - >
        Applies the regression line so the forecast shrinks by the factor
        $\rho$.
      - >
        States that the conditional variance is free of $x$, and is strictly
        below the unconditional variance.
    targets:
      - quant-probability.joint.bivariate-normal
    exercises:
      - quant-probability.joint.correlation

  # --- jointly normal and uncorrelated ---------------------------------------

  - id: qjnt-bivariate-normal-independence-01
    kind: work
    difficulty: standard
    statement: >
      $(X,Y)$ is bivariate normal with $\mu_X = 2$, $\sigma_X = 3$,
      $\mu_Y = -1$, $\sigma_Y = 4$ and $\rho = 0$. What is
      $\mathbb{E}[XY^{2}]$?
    answer: >
      $34$. The hypothesis to use first is joint normality: for a bivariate
      normal pair, $\rho = 0$ makes the cross-term in the exponent vanish and
      the density factors into the two normal marginals, so $X$ and $Y$ are
      genuinely independent — not merely uncorrelated. Independence passes to
      functions, so $\mathbb{E}[XY^{2}] = \mathbb{E}[X]\,\mathbb{E}[Y^{2}]$.
      Recover the second moment from the variance:
      $\mathbb{E}[Y^{2}] = \sigma_Y^{2} + \mu_Y^{2} = 16 + 1 = 17$. Hence
      $\mathbb{E}[XY^{2}] = 2(17) = 34$. The trap is thinking $\rho = 0$
      alone licences the split. It does not: zero covariance gives only
      $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$, and says nothing about
      $\mathbb{E}[XY^{2}]$ — it is joint normality that upgrades uncorrelated
      to independent here. The second trap is
      $\mathbb{E}[Y^{2}] = \sigma_Y^{2} = 16$, forgetting that $Y$ has a
      nonzero mean.
    expects: "34"
    rubric:
      - >
        Names joint normality plus $\rho = 0$ as what gives independence,
        before splitting the expectation.
      - >
        Uses $\mathbb{E}[Y^{2}] = \sigma_Y^{2} + \mu_Y^{2} = 17$, not
        $\sigma_Y^{2}$.
    targets:
      - quant-probability.joint.bivariate-normal-independence
    exercises:
      - quant-probability.joint.independence-zero-covariance
      - quant-probability.joint.bivariate-normal

  - id: qjnt-bivariate-normal-independence-02
    kind: decide
    difficulty: demanding
    statement: >
      A pair $(X,Y)$ is drawn by first flipping a fair coin: on heads it is
      bivariate normal with standard normal marginals and $\rho = 0.5$, on
      tails bivariate normal with standard normal marginals and
      $\rho = -0.5$. The coin is not observed. Both marginals of the resulting
      pair are standard normal and $\operatorname{Cov}(X,Y) = 0$. Are $X$ and
      $Y$ independent?
    answer: >
      No. Mixing preserves the marginals — each component has standard normal
      marginals, so the mixture does too — and covariance is linear in the
      mixture weights, giving
      $\tfrac12(0.5) + \tfrac12(-0.5) = 0$. So the pair has two normal
      marginals and zero correlation, and it is still dependent. The
      conditional law shows it. Given $X = x$, each component contributes
      $Y \sim N(\pm 0.5x,\ 0.75)$ and the two remain equally likely, since
      both components give $X$ the same density; so
      $\mathbb{E}[Y \mid X = x] = 0$ but
      $\operatorname{Var}(Y \mid X = x) = 0.75 + 0.25x^{2}$, which grows with
      $|x|$. Knowing $X$ tells you nothing about the level of $Y$ and a great
      deal about its spread — dependence that no correlation can see. What
      fails is the hypothesis, not the theorem: a mixture of normals is not
      normal, and indeed $X + Y$ here is a half-and-half mixture of $N(0,3)$
      and $N(0,1)$, which is not normal at all.
    choices:
      - text: >
          Yes — both marginals are normal and the covariance is zero.
        feedback: >
          That is exactly the hypothesis this construction breaks. The theorem
          needs the *pair* to be jointly normal, not each variable separately.
      - text: >
          No — the mixture is not bivariate normal, and
          $\operatorname{Var}(Y \mid X = x) = 0.75 + 0.25x^{2}$ depends on
          $x$.
        correct: true
        feedback: >
          Right. The conditional spread moves with $x$, which is dependence,
          and $\rho$ is blind to it because the conditional mean stays $0$.
      - text: >
          Yes — a mixture of bivariate normals is bivariate normal, so
          $\rho = 0$ settles it.
        feedback: >
          A mixture of normals is not normal. Here $X+Y$ is a half-and-half
          mixture of $N(0,3)$ and $N(0,1)$, with heavier tails than any single
          normal.
      - text: >
          The question is undetermined, because the correlation of the mixture
          is not fixed by the description.
        feedback: >
          It is fixed: covariance is linear in the mixture, so it is the
          average $\tfrac12(0.5) + \tfrac12(-0.5) = 0$.
    rubric:
      - >
        Checks whether the pair is jointly normal rather than reading
        normality off the two marginals.
      - >
        Exhibits the dependence concretely — a conditional variance, or a
        linear combination that is not normal.
    targets:
      - quant-probability.joint.bivariate-normal-independence
    exercises:
      - quant-probability.joint.uncorrelated-not-independent
      - quant-probability.joint.bivariate-normal

  # --- the multivariate normal -----------------------------------------------

  - id: qjnt-multivariate-normal-01
    kind: work
    difficulty: demanding
    statement: >
      Three assets are jointly normal with mean returns $0.10$, $0.10$ and
      $0.20$, variances $0.09$, $0.04$ and $0.16$, and covariances
      $\operatorname{Cov}(1,2) = 0.01$, $\operatorname{Cov}(1,3) = -0.02$,
      $\operatorname{Cov}(2,3) = -0.01$. A portfolio holds weights
      $a = (0.4, 0.4, 0.2)$. What is the probability its return is negative?
      Use $\Phi(0.75) = 0.7734$.
    answer: >
      $\approx 0.2266$. For a multivariate normal vector every linear
      combination is univariate normal, $a'X \sim N(a'\mu,\ a'\Sigma a)$, so
      the whole question is two dot products and a table lookup. The mean is
      $a'\mu = 0.4(0.10) + 0.4(0.10) + 0.2(0.20) = 0.04+0.04+0.04 = 0.12$. The
      variance is the quadratic form: diagonal terms
      $0.16(0.09) + 0.16(0.04) + 0.04(0.16) = 0.0144 + 0.0064 + 0.0064
      = 0.0272$, cross-terms $2(0.4)(0.4)(0.01) = 0.0032$,
      $2(0.4)(0.2)(-0.02) = -0.0032$ and $2(0.4)(0.2)(-0.01) = -0.0016$,
      summing to $-0.0016$. So $a'\Sigma a = 0.0256$ and the standard
      deviation is $0.16$. Then
      $\Pr(a'X < 0) = \Pr\left(Z < \dfrac{0 - 0.12}{0.16}\right)
      = \Pr(Z < -0.75) = 1 - 0.7734 = 0.2266$. Dropping the off-diagonal terms
      would have given variance $0.0272$ and a standard deviation of about
      $0.165$ — here a small error, but it is the whole dependence structure
      being thrown away.
    expects: "0.2266"
    tolerance: 0.0005
    rubric:
      - >
        Computes $a'\mu$ and $a'\Sigma a$, keeping all three doubled
        cross-terms with their signs.
      - >
        Standardizes with the portfolio's own standard deviation $0.16$ and
        reads the lower tail.
    targets:
      - quant-probability.joint.multivariate-normal
    exercises:
      - quant-probability.joint.covariance-matrix
      - quant-probability.continuous.normal

  - id: qjnt-multivariate-normal-02
    kind: work
    difficulty: standard
    statement: >
      $Z_1$ and $Z_2$ are independent standard normals, and
      $X = (X_1, X_2)$ is built as $X_1 = 2Z_1$, $X_2 = Z_1 + 3Z_2$. What is
      $\operatorname{Var}(X_1 + X_2)$?
    answer: >
      $18$. This is the construction $X = AZ$ with $A$ having rows $(2,0)$ and
      $(1,3)$, which is how any target covariance is realized from independent
      standard normals. Two routes. Substituting,
      $X_1 + X_2 = 2Z_1 + Z_1 + 3Z_2 = 3Z_1 + 3Z_2$, a combination of
      uncorrelated unit-variance pieces, so the variance is $9 + 9 = 18$.
      Or build $\Sigma = A A'$ first: $\operatorname{Var}(X_1) = 4$,
      $\operatorname{Var}(X_2) = 1 + 9 = 10$ and
      $\operatorname{Cov}(X_1,X_2) = 2(1) + 0(3) = 2$, giving
      $4 + 10 + 2(2) = 18$. Both must agree, and the second shows where the
      dependence came from: $X_1$ and $X_2$ share the shock $Z_1$, and that
      shared factor is the entire covariance. Answering $14$ treats the two
      coordinates as uncorrelated, which the shared $Z_1$ rules out.
    expects: "18"
    rubric:
      - >
        Reduces $X_1 + X_2$ to a combination of the independent $Z_i$, or
        forms $\Sigma = AA'$ before applying variance-of-a-sum.
      - >
        Keeps the covariance $2$ that the shared shock $Z_1$ creates.
    targets:
      - quant-probability.joint.multivariate-normal
    exercises:
      - quant-probability.joint.covariance-matrix
