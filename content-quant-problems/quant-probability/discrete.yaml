# Problems targeting quant-probability.discrete — the named discrete laws.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson just handed over. See ../README.md.
#
# Every instance here is fresh: none reuses a lesson's worked example or the
# numbers of one of its cards, so a reader who has just finished the unit is
# being asked to run the idea again rather than to recall an answer.

problems:
  # --- the single trial ------------------------------------------------------

  - id: qdisc-bernoulli-01
    kind: work
    difficulty: demanding
    statement: >
      An indicator variable $X = \mathbf{1}\{A\}$ has standard deviation exactly
      half its mean. What is $\Pr(A)$?
    answer: >
      $0.8$. Write $p = \Pr(A)$, so the mean is $p$ and the standard deviation
      is $\sqrt{p(1-p)}$. The condition is $\sqrt{p(1-p)} = p/2$; squaring is
      safe because both sides are nonnegative, giving $p(1-p) = p^{2}/4$. The
      degenerate root $p = 0$ has mean $0$ and nothing to halve, so divide by
      $p$: $1 - p = p/4$, hence $p = 4/5 = 0.8$. Check: $\operatorname{Var}(X) =
      0.8 \times 0.2 = 0.16$ and $\sigma = 0.4$, which is half of $0.8$. The
      structural fact is that $\sigma/\mu = \sqrt{(1-p)/p}$ decreases in $p$, so
      the ratio pins $p$ uniquely — a rarer event is noisier relative to its own
      mean.
    expects: "0.8"
    rubric:
      - >
        Sets up $\sqrt{p(1-p)} = p/2$ and squares, rather than comparing
        variance to mean.
      - >
        Discards $p = 0$ explicitly when dividing through by $p$.
    targets:
      - quant-probability.discrete.bernoulli

  - id: qdisc-bernoulli-02
    kind: work
    difficulty: standard
    statement: >
      An indicator variable $X$ satisfies $\mathbb{E}[X^{2}] = 0.45$. What is
      $\operatorname{Var}(X)$?
    answer: >
      $0.2475$. Since $X$ takes only the values $0$ and $1$, $X^{2} = X$, so the
      second moment *is* the first: $\mathbb{E}[X] = \mathbb{E}[X^{2}] = 0.45$,
      and no separate computation is needed to recover $p$. Then
      $\operatorname{Var}(X) = \mathbb{E}[X^{2}] - \mathbb{E}[X]^{2} = 0.45 -
      0.2025 = 0.2475$, which agrees with $p(1-p) = 0.45 \times 0.55$. Treating
      $\mathbb{E}[X^{2}]$ as an independent piece of data and solving for $p$
      from it is the wasted step this collapse exists to avoid.
    expects: "0.2475"
    rubric:
      - >
        Uses $X^{2} = X$ to read $p = 0.45$ off the second moment directly.
      - >
        Reports $p(1-p)$, not $\mathbb{E}[X^{2}]$ itself.
    targets:
      - quant-probability.discrete.bernoulli

  # --- the binomial ----------------------------------------------------------

  - id: qdisc-binomial-01
    kind: work
    difficulty: demanding
    statement: >
      $X \sim \operatorname{Bin}(6, 1/3)$. What is the probability that $X$ is
      even, counting $0$ as even? Give four decimal places.
    answer: >
      $\approx 0.5007$. Summing the pmf over $k = 0, 2, 4, 6$ works, but the
      clean route uses the two expansions
      $\sum_{k}\binom{n}{k}p^{k}q^{n-k} = (p+q)^{n} = 1$ and
      $\sum_{k}\binom{n}{k}(-p)^{k}q^{n-k} = (q-p)^{n}$, with $q = 1-p$.
      Averaging them kills every odd term and doubles every even one, so
      $\Pr(X \text{ even}) = \dfrac{1 + (1-2p)^{n}}{2}$. Here $1 - 2p = 1/3$ and
      $n = 6$, giving $\dfrac{1 + 3^{-6}}{2} = \dfrac{1 + 1/729}{2} =
      \dfrac{365}{729} \approx 0.5007$. The answer sits barely above $1/2$
      because the bias term $(1-2p)^{n}$ decays geometrically — for any $p$ away
      from $0$ and $1$, parity becomes a fair coin fast.
    expects: "0.5007"
    tolerance: 0.0005
    rubric:
      - >
        Either sums the four even terms of the pmf correctly or uses the
        $(q-p)^{n}$ averaging trick.
      - >
        Counts $k = 0$ as even, so the sum has four terms rather than three.
    targets:
      - quant-probability.discrete.binomial

  - id: qdisc-binomial-02
    kind: work
    difficulty: standard
    statement: >
      Seven independent risk checks each fail with probability $0.25$. What is
      the probability that exactly two of them fail? Give four decimal places.
    answer: >
      $\approx 0.3115$. The checks are a fixed number of independent trials with
      a common failure probability, so the count is
      $\operatorname{Bin}(7, 0.25)$ and
      $\Pr(X = 2) = \binom{7}{2}(0.25)^{2}(0.75)^{5} = 21 \times 0.0625 \times
      0.2373046875 \approx 0.31146$. The binomial coefficient is doing real
      work: $21$ is the number of ways to choose *which* two of the seven fail,
      and dropping it would give $0.0148$, the probability of one specific
      pattern of failures.
    expects: "0.3115"
    tolerance: 0.0005
    rubric:
      - >
        Includes the factor $\binom{7}{2} = 21$ rather than pricing a single
        pattern.
      - >
        Raises $0.75$ to the fifth power, not the seventh.
    targets:
      - quant-probability.discrete.binomial

  - id: qdisc-binomial-03
    kind: decide
    difficulty: routine
    statement: >
      $X \sim \operatorname{Bin}(12, 0.7)$ counts the successes in twelve
      trials. What law does the failure count $12 - X$ follow?
    answer: >
      $\operatorname{Bin}(12, 0.3)$. Relabelling every trial's success as a
      failure and vice versa leaves twelve independent trials with a common
      per-trial probability — the two hypotheses the binomial needs — and the
      new success probability is $1 - 0.7 = 0.3$. Formally,
      $\Pr(12 - X = k) = \Pr(X = 12-k) = \binom{12}{12-k}(0.7)^{12-k}(0.3)^{k} =
      \binom{12}{k}(0.3)^{k}(0.7)^{12-k}$, using
      $\binom{n}{k} = \binom{n}{n-k}$. The mean checks out: $12 - 8.4 = 3.6 =
      12 \times 0.3$.
    choices:
      - text: >
          $\operatorname{Bin}(12, 0.3)$
        correct: true
        feedback: >
          Swapping the labels keeps $n$ and replaces $p$ by $1-p$.
      - text: >
          $\operatorname{Bin}(12, 0.7)$ — the count is symmetric in successes
          and failures
        feedback: >
          The two counts have the same law only when $p = 1/2$. Here the means
          are $8.4$ and $3.6$.
      - text: >
          Not binomial — $12 - X$ counts down rather than up
        feedback: >
          Direction of counting is a relabelling, not a change of mechanism; the
          trials are still independent with a common probability.
    rubric:
      - >
        Keeps $n = 12$ and replaces $p$ by $1 - p$, rather than keeping $p$.
      - >
        Can check the claim against the mean, $12 - 12p = 12(1-p)$.
    targets:
      - quant-probability.discrete.binomial

  # --- binomial moments ------------------------------------------------------

  - id: qdisc-binomial-mean-variance-01
    kind: work
    difficulty: demanding
    statement: >
      A binomial count has mean $12$ and variance $9.6$. How many trials does it
      have?
    answer: >
      $60$. The two moments are $np = 12$ and $np(1-p) = 9.6$, so their ratio
      strips out $n$ entirely: $\dfrac{np(1-p)}{np} = 1 - p = \dfrac{9.6}{12} =
      0.8$, giving $p = 0.2$ and then $n = 12/p = 60$. Check: $60 \times 0.2
      \times 0.8 = 9.6$. The ratio $\operatorname{Var}/\mathbb{E} = 1-p$ is the
      whole trick, and it is also the diagnostic that separates a binomial from
      a Poisson, where that ratio is $1$, and from an overdispersed count, where
      it exceeds $1$.
    expects: "60"
    rubric:
      - >
        Takes the ratio of variance to mean to isolate $1 - p$ before solving
        for $n$.
      - >
        Verifies both moments with the recovered pair, not just one.
    targets:
      - quant-probability.discrete.binomial-mean-variance

  - id: qdisc-binomial-mean-variance-02
    kind: work
    difficulty: standard
    statement: >
      $X \sim \operatorname{Bin}(180, 1/3)$. What is $\mathbb{E}[X^{2}]$?
    answer: >
      $3640$. Decompose into indicators rather than summing $k^{2}$ against the
      pmf: $\mathbb{E}[X] = np = 60$ and $\operatorname{Var}(X) = np(1-p) = 180
      \times \tfrac{1}{3} \times \tfrac{2}{3} = 40$. Then the definition of
      variance rearranges to $\mathbb{E}[X^{2}] = \operatorname{Var}(X) +
      \mathbb{E}[X]^{2} = 40 + 3600 = 3640$. Reporting $40$ answers the wrong
      question — the second moment is not the variance, and the gap between them
      is the square of the mean, which here is ninety times larger.
    expects: "3640"
    rubric:
      - >
        Gets $np = 60$ and $np(1-p) = 40$ without touching the pmf.
      - >
        Adds $\mathbb{E}[X]^{2}$ to the variance rather than reporting either
        one alone.
    targets:
      - quant-probability.discrete.binomial-mean-variance

  # --- the mode --------------------------------------------------------------

  - id: qdisc-binomial-mode-01
    kind: work
    difficulty: demanding
    statement: >
      For which success probability $p$ does $\operatorname{Bin}(20, p)$ have
      two tied modes, at $k = 7$ and $k = 8$?
    answer: >
      $p = 8/21 \approx 0.3810$. Consecutive pmf values have ratio
      $\dfrac{\Pr(X=k)}{\Pr(X=k-1)} = \dfrac{n-k+1}{k}\cdot\dfrac{p}{1-p}$, and
      a tie at $k = 8$ means that ratio equals $1$ there:
      $\dfrac{13}{8}\cdot\dfrac{p}{1-p} = 1$, so $p/(1-p) = 8/13$ and
      $p = 8/21$. Equivalently, the modes tie exactly when $(n+1)p$ is an
      integer, and $21p = 8$ gives the same answer. Check: at $p = 8/21$ both
      $\Pr(X=7)$ and $\Pr(X=8)$ equal $\approx 0.17698$, and the mean $np =
      160/21 \approx 7.62$ sits between them, as the mode-within-one-of-the-mean
      rule requires.
    expects: "8/21"
    tolerance: 0.0005
    rubric:
      - >
        Sets the consecutive-ratio equal to $1$ at the upper of the two tied
        values, or equivalently solves $(n+1)p = 8$.
      - >
        Uses $n - k + 1 = 13$ rather than $n - k = 12$ in the ratio.
    targets:
      - quant-probability.discrete.binomial-mode

  - id: qdisc-binomial-mode-02
    kind: work
    difficulty: standard
    statement: >
      $X \sim \operatorname{Bin}(40, 0.17)$. What is the mode?
    answer: >
      $6$. The mode is $\lfloor (n+1)p \rfloor$ and $(n+1)p = 41 \times 0.17 =
      6.97$, which floors to $6$. Note that the mean is $np = 6.8$, so rounding
      the mean would have given $7$ — the wrong answer, though only by one, as
      the mode is always within $1$ of the mean. The ratio test confirms it
      directly: $\Pr(X=7)/\Pr(X=6) = \tfrac{34}{7}\cdot\tfrac{0.17}{0.83}
      \approx 0.995 < 1$, so the pmf has already turned over by $k = 7$.
    expects: "6"
    rubric:
      - >
        Uses $\lfloor (n+1)p \rfloor$, not $\lfloor np \rfloor$ or the rounded
        mean.
      - >
        Notices that $(n+1)p$ is not an integer here, so there is a single mode.
    targets:
      - quant-probability.discrete.binomial-mode

  # --- pooling trials --------------------------------------------------------

  - id: qdisc-binomial-additivity-01
    kind: work
    difficulty: demanding
    statement: >
      $X \sim \operatorname{Bin}(6, 0.5)$ and $Y \sim \operatorname{Bin}(10,
      0.5)$ are independent. What is $\Pr(X + Y = 3)$? Give four decimal places.
    answer: >
      $\approx 0.0085$. Do not convolve. Both variables count successes in
      independent blocks of fair trials, so pooling the blocks gives
      $X + Y \sim \operatorname{Bin}(16, 0.5)$ and
      $\Pr(X+Y=3) = \binom{16}{3}2^{-16} = 560/65536 \approx 0.008545$. The
      convolution $\sum_{i=0}^{3}\Pr(X=i)\Pr(Y=3-i)$ gives the same number after
      four terms, and it is exactly the Vandermonde identity
      $\sum_{i}\binom{6}{i}\binom{10}{3-i} = \binom{16}{3} = 560$ that makes the
      two routes agree. Equal $p$ is what licenses the shortcut; with different
      success probabilities the sum is not binomial at all.
    expects: "0.0085"
    tolerance: 0.0005
    rubric:
      - >
        Pools the trials into $\operatorname{Bin}(16, 0.5)$ instead of summing a
        convolution term by term.
      - >
        Cites the common $p$ and the independence of the two blocks as the
        reason pooling is allowed.
    targets:
      - quant-probability.discrete.binomial-additivity

  - id: qdisc-binomial-additivity-02
    kind: decide
    difficulty: standard
    statement: >
      $X \sim \operatorname{Bin}(10, 0.4)$, and $Y = X$ — the same variable, not
      an independent copy. Is $X + Y = 2X$ distributed as
      $\operatorname{Bin}(20, 0.4)$?
    answer: >
      No. The pooling argument needs two *disjoint, independent* blocks of
      trials; here there is one block, counted twice. The support settles it
      without any algebra: $2X$ takes only even values, while
      $\operatorname{Bin}(20, 0.4)$ puts positive probability on every integer
      from $0$ to $20$. The variances disagree too —
      $\operatorname{Var}(2X) = 4\operatorname{Var}(X) = 9.6$ against
      $20 \times 0.4 \times 0.6 = 4.8$ — even though the means happen to match
      at $8$. Matching means is exactly what makes this trap work.
    choices:
      - text: >
          Yes — the trial counts add and the success probability is unchanged
        feedback: >
          Pooling requires the two blocks of trials to be independent. These are
          the same ten trials counted twice.
      - text: >
          No — $2X$ is supported on the even numbers, and pooling needs
          independent blocks of trials
        correct: true
        feedback: >
          The support alone rules out every binomial on $20$ trials, and the
          variance is doubled twice over.
      - text: >
          No, but $2X$ is $\operatorname{Bin}(20, 0.2)$ instead
        feedback: >
          That law has mean $4$, not $8$, and it too charges odd values a
          positive probability that $2X$ never takes.
    rubric:
      - >
        Names independence of the two blocks as the failed hypothesis, not the
        equality of $p$.
      - >
        Rules the claim out by the support or the variance, rather than by the
        mean, which matches.
    targets:
      - quant-probability.discrete.binomial-additivity

  # --- the geometric ---------------------------------------------------------

  - id: qdisc-geometric-01
    kind: work
    difficulty: demanding
    statement: >
      Two callers independently work their own lists, one call each per round,
      and each call converts with probability $0.4$. What is the probability
      that they get their first conversions on the same round?
    answer: >
      $0.25$. Let $X$ and $Y$ be the two waiting times, independent geometrics
      on $\{1,2,\dots\}$ with $p = 0.4$ and $q = 0.6$. Then
      $\Pr(X = Y) = \sum_{k \ge 1}\Pr(X=k)\Pr(Y=k)
      = \sum_{k \ge 1}(q^{k-1}p)^{2} = p^{2}\sum_{j \ge 0}q^{2j}
      = \dfrac{p^{2}}{1 - q^{2}} = \dfrac{p^{2}}{(1-q)(1+q)}
      = \dfrac{p}{2 - p}$. At $p = 0.4$ that is $0.4/1.6 = 0.25$. The closed
      form is worth keeping: the collision probability rises from $0$ at $p \to
      0$ to $1$ at $p = 1$, and equals $1/3$ for a fair coin. The geometric
      series here has ratio $q^{2}$, not $q$, because both waits must survive
      each round.
    expects: "0.25"
    rubric:
      - >
        Sums the product of the two pmfs over $k$, using independence.
      - >
        Uses ratio $q^{2}$ in the geometric series, giving $p/(2-p)$ rather than
        $p$.
    targets:
      - quant-probability.discrete.geometric

  - id: qdisc-geometric-02
    kind: work
    difficulty: standard
    statement: >
      Each independent attempt succeeds with probability $0.4$. Let $X$ be the
      attempt number of the first success and let $Y = X - 1$ be the number of
      failures before it. Compute $\Pr(X = 3) - \Pr(Y = 3)$.
    answer: >
      $0.0576$. The two conventions carry different pmfs at the same argument:
      $\Pr(X = 3) = (0.6)^{2}(0.4) = 0.144$ counts two failures then a success,
      while $\Pr(Y = 3) = (0.6)^{3}(0.4) = 0.0864$ counts three failures then a
      success — the same event as $X = 4$. The difference is $0.144 - 0.0864 =
      0.0576$. The two laws differ by a shift of exactly $1$, so their means are
      $1/p = 2.5$ and $(1-p)/p = 1.5$; a problem that does not say which is
      meant has to be pinned down before any number is quoted.
    expects: "0.0576"
    rubric:
      - >
        Uses exponent $k-1$ for $X$ and exponent $k$ for $Y$, rather than the
        same pmf twice.
      - >
        Identifies $\{Y = 3\}$ with $\{X = 4\}$, so the shift is by one trial.
    targets:
      - quant-probability.discrete.geometric

  - id: qdisc-geometric-03
    kind: work
    difficulty: routine
    statement: >
      A machine passes each independent inspection with probability $0.7$ and
      fails it with probability $0.3$. What is the probability that the first
      failure comes after the fifth inspection? Give four decimal places.
    answer: >
      $\approx 0.1681$. The index of the first failure is geometric with
      $p = 0.3$, and the tail of a geometric needs no summing:
      $\Pr(X > k) = (1-p)^{k}$, because "no failure in the first $k$
      inspections" is just $k$ independent passes. So
      $\Pr(X > 5) = (0.7)^{5} = 0.16807$. Note the exponent: $\Pr(X > 5)$ uses
      $5$, while $\Pr(X \ge 5) = (0.7)^{4} = 0.2401$ uses $4$ — the two differ
      by the whole of $\Pr(X = 5)$.
    expects: "0.1681"
    tolerance: 0.0005
    rubric:
      - >
        Uses the tail formula $(1-p)^{k}$ rather than summing the pmf from
        $k = 6$ upward.
      - >
        Takes the fifth power for "after the fifth", not the fourth.
    targets:
      - quant-probability.discrete.geometric

  # --- geometric moments -----------------------------------------------------

  - id: qdisc-geometric-moments-01
    kind: work
    difficulty: demanding
    statement: >
      A waiting time $X$ is geometric on $\{1, 2, \dots\}$ with variance $42$.
      What is its success probability $p$?
    answer: >
      $p = 1/7 \approx 0.1429$. The variance is $(1-p)/p^{2} = 42$, which clears
      to the quadratic $42p^{2} + p - 1 = 0$, with roots
      $p = \dfrac{-1 \pm \sqrt{1 + 168}}{84} = \dfrac{-1 \pm 13}{84}$. The
      negative root is not a probability, so $p = 12/84 = 1/7$. Check:
      $(1 - 1/7)/(1/7)^{2} = (6/7)\times 49 = 42$, and the mean is $1/p = 7$
      with $\sigma = \sqrt{42} \approx 6.48$ — the standard deviation is almost
      the whole mean, which is the geometric's signature and a useful sanity
      check on any root you pick.
    expects: "1/7"
    tolerance: 0.0005
    rubric:
      - >
        Uses $(1-p)/p^{2}$, not $1/p^{2}$ or $(1-p)/p$.
      - >
        Solves the quadratic and discards the negative root.
    targets:
      - quant-probability.discrete.geometric-moments

  - id: qdisc-geometric-moments-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is geometric on $\{1, 2, \dots\}$ with $p = 0.4$. What is
      $\mathbb{E}[X^{2}]$?
    answer: >
      $10$. Two routes agree. Directly,
      $\mathbb{E}[X^{2}] = (2-p)/p^{2} = 1.6/0.16 = 10$. Or assemble it from the
      pieces: $\mathbb{E}[X] = 1/p = 2.5$ and
      $\operatorname{Var}(X) = (1-p)/p^{2} = 0.6/0.16 = 3.75$, so
      $\mathbb{E}[X^{2}] = \operatorname{Var}(X) + \mathbb{E}[X]^{2} = 3.75 +
      6.25 = 10$. The second route is the one to carry into an interview, since
      it needs only the two facts you already know rather than a third formula
      to misremember.
    expects: "10"
    rubric:
      - >
        Adds $\mathbb{E}[X]^{2}$ to the variance, or quotes $(2-p)/p^{2}$
        correctly.
      - >
        Does not report the variance $3.75$ as the answer.
    targets:
      - quant-probability.discrete.geometric-moments

  # --- memorylessness --------------------------------------------------------

  - id: qdisc-memoryless-geometric-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is geometric on $\{1, 2, \dots\}$ with $p = 0.2$. Given that the first
      four trials all failed, what is the expected value of $X$ itself — the
      trial number of the first success?
    answer: >
      $9$. Memorylessness says the *remaining* wait, $X - 4$ given $X > 4$, is
      geometric with the same $p$, so its mean is $1/p = 5$. But the question
      asks for $X$, which includes the four trials already spent:
      $\mathbb{E}[X \mid X > 4] = 4 + 1/p = 4 + 5 = 9$. Answering $5$ prices the
      remaining wait and answering $1/p = 5$ unconditionally ignores the
      conditioning entirely; both are the same slip in different clothes. The
      general statement is $\mathbb{E}[X \mid X > m] = m + 1/p$, which is why a
      geometric's conditional mean grows without bound while its conditional
      *residual* mean never moves.
    expects: "9"
    rubric:
      - >
        Applies memorylessness to the residual wait, giving $1/p$ for it.
      - >
        Adds back the $4$ elapsed trials, because the question asks for $X$ and
        not for $X - 4$.
    targets:
      - quant-probability.discrete.memoryless-geometric

  - id: qdisc-memoryless-geometric-02
    kind: work
    difficulty: standard
    statement: >
      $X$ is geometric on $\{1, 2, \dots\}$ with $p = 0.3$. Compute
      $\Pr(X > 7 \mid X > 3)$. Give four decimal places.
    answer: >
      $0.2401$. Either divide tails —
      $\Pr(X > 7)/\Pr(X > 3) = (0.7)^{7}/(0.7)^{3} = (0.7)^{4}$ — or quote
      memorylessness directly: given a run of $3$ failures, the extra wait is
      geometric afresh, so the answer is $\Pr(X > 4) = (0.7)^{4} = 0.2401$. The
      exponent is $7 - 3 = 4$, not $7$; using $7$ would answer the
      unconditional question and understate the probability by a factor of
      $(0.7)^{3}$. Nothing about the four observed failures makes a success more
      "due".
    expects: "0.2401"
    tolerance: 0.0005
    rubric:
      - >
        Divides the two tails, or equivalently applies memorylessness, to get an
        exponent of $4$.
      - >
        Does not adjust the answer for the failures already seen.
    targets:
      - quant-probability.discrete.memoryless-geometric

  # --- waiting times in the wild ---------------------------------------------

  - id: qdisc-waiting-for-a-six-01
    kind: decide
    difficulty: demanding
    statement: >
      A fair coin is tossed until two heads appear *in a row*. A candidate
      argues: "each pair of tosses gives $HH$ with probability $1/4$, so the
      wait is geometric with $p = 1/4$ and the expected number of tosses is
      $4$." Is that right?
    answer: >
      No — the correct expected number of tosses is $6$. The candidate's
      argument chops the sequence into disjoint pairs, but the pattern can
      straddle a boundary, and successive two-toss *windows* overlap and are
      therefore dependent, so the wait is not geometric. First-step analysis
      gets the number. Let $a$ be the expected further tosses with no useful
      progress and $b$ the expected further tosses having just seen one head.
      Then $a = 1 + \tfrac{1}{2}b + \tfrac{1}{2}a$ and
      $b = 1 + \tfrac{1}{2}(0) + \tfrac{1}{2}a$. The first gives $a = 2 + b$,
      and substituting into the second gives $b = 1 + (2+b)/2$, so $b = 4$ and
      $a = 6$. The general pattern formula agrees: for a self-overlapping
      two-symbol run, $\mathbb{E} = 1/p + 1/p^{2} = 2 + 4 = 6$.
    choices:
      - text: >
          Yes — the pairs are independent, so the wait is geometric with mean
          $4$
        feedback: >
          Disjoint pairs miss every occurrence that straddles a boundary, and
          overlapping windows are dependent. The true mean is $6$.
      - text: >
          No — the overlapping windows are dependent, and the expected wait is
          $6$ tosses
        correct: true
        feedback: >
          First-step analysis on "no progress" and "one head so far" gives
          $6$, matching $1/p + 1/p^{2}$.
      - text: >
          No — each pair costs two tosses, so the expected wait is $8$
        feedback: >
          That multiplies the flawed geometric count by $2$ and keeps the flaw;
          the windows still overlap.
    rubric:
      - >
        Rejects the geometric model because the two-toss windows overlap, not
        because $1/4$ is the wrong per-window probability.
      - >
        Produces $6$ by a first-step recursion over the states "no progress" and
        "one head so far".
    targets:
      - quant-probability.discrete.waiting-for-a-six

  - id: qdisc-waiting-for-a-six-02
    kind: work
    difficulty: standard
    statement: >
      A fair die is rolled until it shows either a six or a one. What is the
      expected number of rolls?
    answer: >
      $3$. Each roll independently lands in the target set $\{1, 6\}$ with
      probability $p = 2/6 = 1/3$, so the number of rolls is geometric with that
      $p$ and the mean is $1/p = 3$. Widening the target from one face to two
      halves the expected wait, from $6$ to $3$ — the mean is $1/p$, so it
      responds to the *probability*, not to the number of faces as such. The
      distribution is still right-skewed: $\Pr(X > 3) = (2/3)^{3} \approx 0.296$,
      so nearly a third of the time three rolls produce neither face.
    expects: "3"
    rubric:
      - >
        Collapses the two winning faces into a single per-roll success
        probability of $1/3$.
      - >
        Reports $1/p$ rather than $6/2$ arrived at by an unrelated route, and
        does not add the two separate means $6 + 6$.
    targets:
      - quant-probability.discrete.waiting-for-a-six

  # --- waiting for the r-th success ------------------------------------------

  - id: qdisc-negative-binomial-01
    kind: work
    difficulty: demanding
    statement: >
      Independent trials each succeed with probability $0.4$. What is the
      probability that the third success arrives on or before the fifth trial?
      Give four decimal places.
    answer: >
      $\approx 0.3174$. The slick route is the duality between waiting times and
      counts: the third success arrives by trial $5$ exactly when the first five
      trials contain at least three successes. So with
      $N \sim \operatorname{Bin}(5, 0.4)$,
      $\Pr(X \le 5) = \Pr(N \ge 3) = \binom{5}{3}(0.4)^{3}(0.6)^{2} +
      \binom{5}{4}(0.4)^{4}(0.6) + (0.4)^{5} = 0.2304 + 0.0768 + 0.01024 =
      0.31744$. Summing the negative binomial pmf
      $\binom{k-1}{2}(0.4)^{3}(0.6)^{k-3}$ over $k = 3, 4, 5$ gives $0.064 +
      0.1152 + 0.13824$, the same total by a longer road. The duality is worth
      internalising: any question about "when the $r$-th success lands" can be
      re-asked as "how many successes by trial $n$".
    expects: "0.3174"
    tolerance: 0.0005
    rubric:
      - >
        Converts the waiting-time tail into a binomial count tail, or sums the
        negative binomial pmf over $k = 3, 4, 5$.
      - >
        Includes all three terms $k \ge 3$, rather than only $\Pr(N = 3)$.
    targets:
      - quant-probability.discrete.negative-binomial
    exercises:
      - quant-probability.discrete.binomial

  - id: qdisc-negative-binomial-02
    kind: work
    difficulty: standard
    statement: >
      Each independent trade is profitable with probability $0.2$. What is the
      probability that the second profitable trade is exactly the sixth trade?
      Give four decimal places.
    answer: >
      $\approx 0.0819$. Use $\Pr(X = k) = \binom{k-1}{r-1}p^{r}(1-p)^{k-r}$ with
      $r = 2$ and $k = 6$: the sixth trade must be profitable, and exactly one
      of the first five must be, which can happen in $\binom{5}{1} = 5$ ways. So
      the probability is $5 \times (0.2)^{2}(0.8)^{4} = 5 \times 0.04 \times
      0.4096 = 0.08192$. The binomial coefficient is $\binom{5}{1}$, not
      $\binom{6}{2}$: the last trial is pinned, so only the first $k - 1$ trials
      are free to be arranged.
    expects: "0.0819"
    tolerance: 0.0005
    rubric:
      - >
        Pins the sixth trial as a success and chooses the other success from the
        first five, giving $\binom{5}{1}$.
      - >
        Uses $p^{2}$ and $(1-p)^{4}$, matching two successes and four failures.
    targets:
      - quant-probability.discrete.negative-binomial

  # --- the Poisson -----------------------------------------------------------

  - id: qdisc-poisson-01
    kind: work
    difficulty: demanding
    statement: >
      Cancellations arrive as a Poisson count with mean $\lambda = 2$ per hour.
      Given that at least one cancellation arrived in a particular hour, what is
      the probability that exactly one did? Give four decimal places.
    answer: >
      $\approx 0.3130$. Condition on the event $\{X \ge 1\}$, whose probability
      is $1 - \Pr(X = 0) = 1 - e^{-2} \approx 0.86466$. Since $\{X = 1\}$ is
      contained in $\{X \ge 1\}$, the conditional probability is
      $\dfrac{\Pr(X=1)}{\Pr(X \ge 1)} = \dfrac{\lambda e^{-\lambda}}{1 -
      e^{-\lambda}} = \dfrac{2 e^{-2}}{1 - e^{-2}} \approx
      \dfrac{0.27067}{0.86466} \approx 0.31304$. The unconditional
      $\Pr(X = 1) \approx 0.2707$ is the answer to a different question, and it
      is smaller: knowing something happened raises the odds of the smallest
      positive count. Conditioning on $\{X \ge 1\}$ does *not* leave a Poisson —
      the truncated law has mean $\lambda/(1 - e^{-\lambda}) \approx 2.31$.
    expects: "0.3130"
    tolerance: 0.0005
    rubric:
      - >
        Divides by $1 - e^{-\lambda}$ rather than reporting the unconditional
        $\Pr(X = 1)$.
      - >
        Uses $\Pr(X = 0) = e^{-\lambda}$ for the complement, with the empty
        product $\lambda^{0}/0! = 1$.
    targets:
      - quant-probability.discrete.poisson

  - id: qdisc-poisson-02
    kind: work
    difficulty: standard
    statement: >
      A Poisson count has $\mathbb{E}[X^{2}] = 30$. What is $\lambda$?
    answer: >
      $\lambda = 5$. The Poisson's signature is
      $\mathbb{E}[X] = \operatorname{Var}(X) = \lambda$, so
      $\mathbb{E}[X^{2}] = \operatorname{Var}(X) + \mathbb{E}[X]^{2} = \lambda +
      \lambda^{2}$. Setting $\lambda^{2} + \lambda = 30$ gives
      $(\lambda + 6)(\lambda - 5) = 0$, and a rate must be positive, so
      $\lambda = 5$. The same identity read the other way is the factorial
      moment $\mathbb{E}[X(X-1)] = \lambda^{2}$, which is the fastest way to
      derive the variance in the first place: $\mathbb{E}[X^{2}] - \lambda =
      \lambda^{2}$.
    expects: "5"
    rubric:
      - >
        Uses $\mathbb{E}[X^{2}] = \lambda + \lambda^{2}$, which needs the
        mean-equals-variance identity.
      - >
        Discards the negative root of the quadratic.
    targets:
      - quant-probability.discrete.poisson

  - id: qdisc-poisson-03
    kind: work
    difficulty: routine
    statement: >
      $X \sim \operatorname{Poisson}(2.5)$. What is $\Pr(X = 4)$? Give four
      decimal places.
    answer: >
      $\approx 0.1336$. Substitute into
      $\Pr(X = k) = e^{-\lambda}\lambda^{k}/k!$ with $\lambda = 2.5$ and
      $k = 4$: $e^{-2.5} \approx 0.082085$, $2.5^{4} = 39.0625$ and $4! = 24$,
      so the probability is $0.082085 \times 39.0625 / 24 \approx 0.13360$. The
      factorial in the denominator is what keeps the pmf summable — without it
      the terms $\lambda^{k}$ would grow without bound for $\lambda > 1$. Note
      $\lambda$ need not be an integer; it is a rate, not a count.
    expects: "0.1336"
    tolerance: 0.0005
    rubric:
      - >
        Divides by $4! = 24$, not by $4$.
      - >
        Uses $e^{-2.5}$ rather than $e^{-4}$ in the exponential factor.
    targets:
      - quant-probability.discrete.poisson

  # --- the rare-event limit --------------------------------------------------

  - id: qdisc-poisson-limit-01
    kind: work
    difficulty: demanding
    statement: >
      A book of $10{,}000$ policies each files a claim in a year independently
      with probability $0.0003$. Using the Poisson approximation, what is the
      probability that at least three claims are filed? Give four decimal
      places.
    answer: >
      $\approx 0.5768$. Here $n$ is large, $p$ is tiny and
      $\lambda = np = 10000 \times 0.0003 = 3$ is moderate, exactly the regime
      where $\operatorname{Bin}(n,p) \approx \operatorname{Poisson}(np)$; the
      error is governed by $np^{2} = 0.0009$, which is negligible. Work with the
      complement, since "at least three" needs three terms rather than
      infinitely many:
      $\Pr(X \ge 3) = 1 - e^{-3}\left(1 + 3 + \tfrac{9}{2}\right) = 1 - 8.5
      e^{-3} \approx 1 - 8.5 \times 0.049787 = 1 - 0.42319 = 0.57681$. The exact
      binomial gives $0.57684$, so the approximation is good to four decimal
      places here. Note $\lambda^{2}/2! = 4.5$, not $9$ — the factorial is easy
      to drop when the terms are written out by hand.
    expects: "0.5768"
    tolerance: 0.0005
    rubric:
      - >
        Identifies $\lambda = np = 3$ and says why the approximation is
        licensed, rather than only asserting it.
      - >
        Takes the complement of the three terms $k = 0, 1, 2$, with
        $\lambda^{2}/2! = 4.5$.
    targets:
      - quant-probability.discrete.poisson-limit

  - id: qdisc-poisson-limit-02
    kind: work
    difficulty: standard
    statement: >
      $X \sim \operatorname{Bin}(400, 0.005)$. Using the Poisson approximation,
      what is $\Pr(X = 2)$? Give four decimal places.
    answer: >
      $\approx 0.2707$. The product $\lambda = np = 400 \times 0.005 = 2$ stays
      fixed while $n$ is large and $p$ small, so approximate by
      $\operatorname{Poisson}(2)$:
      $\Pr(X = 2) \approx e^{-2}2^{2}/2! = 2e^{-2} \approx 0.27067$. The exact
      binomial value is $\binom{400}{2}(0.005)^{2}(0.995)^{398} \approx
      0.27135$, agreeing to three decimal places — the discrepancy is of order
      $np^{2} = 0.01$, as the error term predicts. Approximating with
      $\operatorname{Poisson}(0.005)$ instead of $\operatorname{Poisson}(2)$ is
      the classic slip: the parameter is the *mean count*, not the per-trial
      probability.
    expects: "0.2707"
    tolerance: 0.0005
    rubric:
      - >
        Sets $\lambda = np = 2$, not $\lambda = p$.
      - >
        Evaluates $e^{-2}\lambda^{2}/2!$ with the factorial in place.
    targets:
      - quant-probability.discrete.poisson-limit

  # --- merging and splitting streams -----------------------------------------

  - id: qdisc-poisson-additivity-01
    kind: work
    difficulty: demanding
    statement: >
      Monitor A raises alerts as a Poisson count with rate $1.5$ per hour and
      monitor B, independently, at rate $2.5$ per hour. An hour passes with
      exactly five alerts in total. What is the probability that at least four
      of them came from A? Give four decimal places.
    answer: >
      $\approx 0.0692$. Conditional on the total, the split is not Poisson:
      given five alerts, each one came from A independently with probability
      $\lambda/(\lambda+\mu) = 1.5/4 = 3/8$, so the A-count is
      $\operatorname{Bin}(5, 3/8)$. Hence
      $\Pr(\ge 4) = \binom{5}{4}\left(\tfrac{3}{8}\right)^{4}\tfrac{5}{8} +
      \left(\tfrac{3}{8}\right)^{5} = \dfrac{5 \cdot 81 \cdot 5 + 243}{8^{5}} =
      \dfrac{2268}{32768} \approx 0.06921$. The trap is to keep the A-count as
      $\operatorname{Poisson}(1.5)$ and answer $\Pr(N_A \ge 4) \approx 0.0656$:
      once the total is known the only randomness left is *which* stream each
      alert came from, and that allocation is binomial in the rate ratio.
    expects: "0.0692"
    tolerance: 0.0005
    rubric:
      - >
        Conditions on the total and uses the binomial split
        $\operatorname{Bin}(5, \lambda/(\lambda+\mu))$ rather than the
        unconditional Poisson count.
      - >
        Adds both terms $k = 4$ and $k = 5$, with $p = 3/8$ and not $1/2$.
    targets:
      - quant-probability.discrete.poisson-additivity
    exercises:
      - quant-probability.discrete.binomial

  - id: qdisc-poisson-additivity-02
    kind: work
    difficulty: standard
    statement: >
      Three independent desks send cancellations as Poisson counts at rates
      $0.8$, $1.2$ and $2.0$ per minute. What is the probability that the merged
      stream produces exactly two cancellations in a minute? Give four decimal
      places.
    answer: >
      $\approx 0.1465$. Independent Poisson counts add their rates, and the
      two-stream statement extends to three by applying it twice, so the merged
      count is $\operatorname{Poisson}(\lambda)$ with
      $\lambda = 0.8 + 1.2 + 2.0 = 4$ — no convolution is needed. Then
      $\Pr(X = 2) = e^{-\lambda}\lambda^{2}/2! = e^{-4} \times 16/2 = 8e^{-4}
      \approx 8 \times 0.0183156 \approx 0.14653$. Averaging the three rates to
      $\lambda = 4/3$ is the slip: rates add rather than average, so the merged
      stream is busier than any desk on its own.
    expects: "0.1465"
    tolerance: 0.0005
    rubric:
      - >
        Adds the three rates to $\lambda = 4$ rather than averaging them.
      - >
        Evaluates $e^{-\lambda}\lambda^{2}/2!$ with the factorial in place.
    targets:
      - quant-probability.discrete.poisson-additivity

  # --- sampling without replacement ------------------------------------------

  - id: qdisc-hypergeometric-01
    kind: work
    difficulty: demanding
    statement: >
      A drawer holds $9$ red chips and $7$ blue chips. Five are drawn at once,
      without replacement. What is the probability that at least four of them
      are red? Give an exact fraction.
    answer: >
      $3/13$. The five chips are a uniformly random $5$-subset of the sixteen,
      so the red count is hypergeometric with $N = 16$, $K = 9$, $n = 5$ and
      $\Pr(X = k) = \binom{9}{k}\binom{7}{5-k}/\binom{16}{5}$. With
      $\binom{16}{5} = 4368$, the case $k = 4$ contributes
      $\binom{9}{4}\binom{7}{1} = 126 \times 7 = 882$ subsets and $k = 5$
      contributes $\binom{9}{5}\binom{7}{0} = 126$, so the answer is
      $(882 + 126)/4368 = 1008/4368 = 3/13 \approx 0.2308$. Pricing this as
      $\operatorname{Bin}(5, 9/16)$ gives $\approx 0.2753$: the draws deplete the
      drawer, so each red drawn makes the next red less likely, and ignoring that
      inflates the upper tail.
    expects: "3/13"
    rubric:
      - >
        Counts $5$-subsets with three binomial coefficients rather than
        multiplying a constant per-draw probability.
      - >
        Adds the two cases $k = 4$ and $k = 5$, rather than answering
        $\Pr(X = 4)$ alone.
    targets:
      - quant-probability.discrete.hypergeometric
    exercises:
      - quant-probability.counting.combinations

  - id: qdisc-hypergeometric-02
    kind: work
    difficulty: standard
    statement: >
      A batch of $12$ sensors contains $4$ faulty ones. An inspector tests three
      of the twelve at random, without replacement. What is the probability that
      exactly one tested sensor is faulty? Give an exact fraction.
    answer: >
      $28/55$. Choose which one of the $4$ faulty sensors is drawn and which two
      of the $8$ sound ones join it, over all $3$-subsets of the batch:
      $\binom{4}{1}\binom{8}{2}/\binom{12}{3} = 4 \times 28/220 = 112/220 =
      28/55 \approx 0.5091$. The sequential route agrees and shows the depletion
      explicitly: $3 \times \tfrac{4}{12}\cdot\tfrac{8}{11}\cdot\tfrac{7}{10} =
      3 \times \tfrac{224}{1320} = 28/55$, the factor $3$ counting which draw is
      the faulty one. Treating the tests as $\operatorname{Bin}(3, 1/3)$ would
      give $4/9 \approx 0.4444$, because a constant $1/3$ ignores that removing a
      faulty sensor leaves the batch cleaner.
    expects: "28/55"
    rubric:
      - >
        Pairs $\binom{4}{1}$ with $\binom{8}{2}$ over $\binom{12}{3}$, or runs
        the equivalent sequential product with its three orderings.
      - >
        Does not use a binomial pmf with a constant $p = 1/3$.
    targets:
      - quant-probability.discrete.hypergeometric
    exercises:
      - quant-probability.counting.combinations

  - id: qdisc-hypergeometric-03
    kind: decide
    difficulty: routine
    statement: >
      An urn holds $11$ items, five of which are successes; four items are drawn
      without replacement and $X$ counts the successes among them. Which
      expression gives $\Pr(X = 2)$?
    answer: >
      $\binom{5}{2}\binom{6}{2}/\binom{11}{4}$. Every $4$-subset of the urn is
      equally likely, so count the favourable ones: choose which two of the five
      successes are drawn and which two of the six failures fill the rest. That
      is $10 \times 15 = 150$ favourable subsets out of $\binom{11}{4} = 330$,
      giving $150/330 = 5/11 \approx 0.4545$. The denominator must be
      $\binom{N}{n}$ with the $n$ actually drawn — using $\binom{11}{2} = 55$
      instead returns $30/11 > 1$, which is not a probability at all, and is the
      fastest way to catch that slip without any further arithmetic.
    choices:
      - text: >
          $\binom{5}{2}\binom{6}{2}/\binom{11}{4}$
        correct: true
        feedback: >
          Two of the five successes and two of the six failures, over all
          $4$-subsets of the urn.
      - text: >
          $\binom{4}{2}\left(\tfrac{5}{11}\right)^{2}
          \left(\tfrac{6}{11}\right)^{2}$
        feedback: >
          The binomial pmf holds the per-draw probability at $5/11$, but every
          draw changes the urn. It gives $\approx 0.3688$, not $5/11$.
      - text: >
          $\binom{6}{2}\binom{5}{2}/\binom{11}{2}$
        feedback: >
          The denominator counts $2$-subsets while four items are drawn, so the
          ratio exceeds $1$ and cannot be a probability.
    rubric:
      - >
        Uses three binomial coefficients with $\binom{N}{n} = \binom{11}{4}$ in
        the denominator.
      - >
        Rejects the binomial pmf because the draws deplete the urn rather than
        because the numbers are wrong.
    targets:
      - quant-probability.discrete.hypergeometric

  # --- moments without independence ------------------------------------------

  - id: qdisc-hypergeometric-moments-01
    kind: work
    difficulty: demanding
    statement: >
      A standard $52$-card deck is shuffled uniformly and dealt face down. Let
      $X$ be the number of kings sitting in positions $3$, $17$ and $40$ — three
      named positions, not a block. What is $\operatorname{Var}(X)$? Give four
      decimal places.
    answer: >
      $\approx 0.2047$. Exchangeability does the modelling: in a uniformly
      shuffled deck any three named positions have the same joint law as any
      other three, so scattering them changes nothing and $X$ is hypergeometric
      with $N = 52$, $K = 4$, $n = 3$. The mean follows from three indicators,
      each a king with probability $4/52$ however they depend on one another:
      $\mathbb{E}[X] = nK/N = 3/13 \approx 0.2308$. The variance is the binomial
      form times the finite-population correction,
      $\operatorname{Var}(X) = 3 \cdot \dfrac{1}{13}\cdot\dfrac{12}{13}
      \cdot\dfrac{52-3}{51} = \dfrac{36}{169}\cdot\dfrac{49}{51} =
      \dfrac{588}{2873} \approx 0.20466$. Stopping at $36/169 \approx 0.2130$
      overstates the spread; that factor $49/51$ is the only place the dependence
      between positions ever surfaces.
    expects: "0.2047"
    tolerance: 0.0005
    rubric:
      - >
        Recognises three named positions as a size-$3$ sample without
        replacement, by exchangeability, rather than as three independent draws.
      - >
        Multiplies $np(1-p)$ by $(N-n)/(N-1) = 49/51$ instead of stopping at the
        binomial variance.
    targets:
      - quant-probability.discrete.hypergeometric-moments
      - quant-probability.conditional.symmetry-exchangeability
    exercises:
      - quant-probability.expectation.linearity
    connects:
      - "quant-probability.conditional.symmetry-exchangeability ~ quant-probability.discrete.hypergeometric-moments"

  - id: qdisc-hypergeometric-moments-02
    kind: work
    difficulty: standard
    statement: >
      A pool of $60$ items is sampled $15$ at a time without replacement, and
      the number of successes drawn has mean $3$. What is its variance? Give
      four decimal places.
    answer: >
      $\approx 1.8305$. The mean is $nK/N$, the binomial mean in disguise, so
      $15 \times K/60 = 3$ gives $K/N = 0.2$ and $K = 12$ — the mean alone pins
      the success fraction, which is exactly why it cannot detect sampling
      without replacement. The variance is where the dependence shows:
      $\operatorname{Var}(X) = n\dfrac{K}{N}\left(1 - \dfrac{K}{N}\right)
      \dfrac{N-n}{N-1} = 15 \times 0.2 \times 0.8 \times \dfrac{45}{59} = 2.4
      \times 0.76271 \approx 1.83051$. Reporting $2.4$ answers the
      with-replacement question: the sample is a quarter of the pool here, so the
      correction strips away almost a quarter of the variance.
    expects: "1.8305"
    tolerance: 0.0005
    rubric:
      - >
        Recovers $K/N = 0.2$ from the mean before touching the variance.
      - >
        Applies the correction $(N-n)/(N-1) = 45/59$, not $(N-n)/N$.
    targets:
      - quant-probability.discrete.hypergeometric-moments

  # --- with replacement or without -------------------------------------------

  - id: qdisc-binomial-vs-hypergeometric-01
    kind: work
    difficulty: demanding
    statement: >
      A pool contains a fraction $0.4$ of successes. Drawing $20$ items from it
      without replacement gives a success count with variance $4.32$. How large
      is the pool?
    answer: >
      $N = 191$. With replacement the same draw would be
      $\operatorname{Bin}(20, 0.4)$, of variance $np(1-p) = 20 \times 0.4 \times
      0.6 = 4.8$. Sampling without replacement multiplies that by the
      finite-population correction, so $4.8 \cdot \dfrac{N-20}{N-1} = 4.32$, i.e.
      $\dfrac{N-20}{N-1} = 0.9$. Clearing denominators gives $N - 20 = 0.9N -
      0.9$, so $0.1N = 19.1$ and $N = 191$; check $171/190 = 0.9$ exactly. The
      mean is no help at all here — it is $8$ for every $N$ — which is the whole
      point of this node: the pool size is invisible in the mean and legible only
      in the variance.
    expects: "191"
    rubric:
      - >
        Writes the observed variance as $np(1-p)$ times $(N-n)/(N-1)$ and solves
        for $N$.
      - >
        Notes that the mean carries no information about $N$, so the variance is
        the only route.
    targets:
      - quant-probability.discrete.binomial-vs-hypergeometric
    exercises:
      - quant-probability.discrete.binomial-mean-variance
      - quant-probability.discrete.hypergeometric-moments

  - id: qdisc-binomial-vs-hypergeometric-02
    kind: decide
    difficulty: standard
    statement: >
      A shipment of $10{,}000$ units contains $500$ defective ones. A colleague
      samples $40$ units without replacement but models the defective count as
      $\operatorname{Bin}(40, 0.05)$. What does that substitution do to the mean
      and to the standard deviation?
    answer: >
      It leaves the mean exactly right and overstates the standard deviation, by
      about $0.2$ percent. Both laws have mean $nK/N = 40 \times 0.05 = 2$;
      replacement never touches the mean, because linearity does not care that
      the draws are dependent. The hypergeometric variance is the binomial's
      $np(1-p) = 40 \times 0.05 \times 0.95 = 1.9$ times $(N-n)/(N-1) =
      9960/9999 \approx 0.99610$, so the standard deviations are $\sqrt{1.9}
      \approx 1.3784$ against $\approx 1.3757$. Since $n = 40$ is $0.4$ percent
      of $N$, well inside the $n \le 0.05N$ rule of thumb, the substitution is
      safe — but safe because the pool is enormous, not because the two laws
      agree.
    choices:
      - text: >
          Nothing to the mean; it overstates the standard deviation slightly
        correct: true
        feedback: >
          Both laws share the mean $2$, and the binomial drops the shrinking
          factor $\sqrt{(N-n)/(N-1)} \approx 0.998$.
      - text: >
          It overstates both the mean and the standard deviation
        feedback: >
          The means are equal at $2$. Replacement changes how much the count
          fluctuates, never its average.
      - text: >
          Nothing to either — the two laws coincide as soon as $n < N$
        feedback: >
          They coincide only in the large-pool limit. Here they differ by the
          factor $9960/9999$ — small, but not zero.
      - text: >
          Nothing to the mean; it understates the standard deviation
        feedback: >
          The correction $(N-n)/(N-1)$ is at most $1$, so the
          without-replacement spread is the smaller one and the binomial
          overstates it.
    rubric:
      - >
        States that the means agree exactly and only the spread moves.
      - >
        Gets the direction right: the finite-population correction shrinks the
        variance, so the binomial is the wider of the two laws.
    targets:
      - quant-probability.discrete.binomial-vs-hypergeometric

  # --- equally likely labels -------------------------------------------------

  - id: qdisc-uniform-discrete-01
    kind: work
    difficulty: demanding
    statement: >
      $X$ is uniform on the consecutive integers $\{a, a+1, \dots, b\}$, with
      mean $20$ and variance $30$. What is $b$?
    answer: >
      $b = 29$. The variance of a uniform block does not depend on where the
      block sits, only on how many values it holds: with $m = b - a + 1$ values,
      $(m^{2}-1)/12 = 30$ gives $m^{2} = 361$ and $m = 19$, so $b - a = 18$. The
      mean of a symmetric block is its midpoint, $(a+b)/2 = 20$, so $a + b = 40$.
      Adding the two linear equations gives $2b = 58$, hence $b = 29$ and
      $a = 11$. Check: the nineteen integers from $11$ to $29$ have midpoint $20$
      and variance $(19^{2}-1)/12 = 360/12 = 30$. The trap is putting $b$ itself
      into $(n^{2}-1)/12$; the formula wants the *count* of values, and shifting
      a block moves its mean while leaving its variance alone.
    expects: "29"
    rubric:
      - >
        Uses the count $m = b - a + 1$, not $b$, inside $(m^{2}-1)/12$.
      - >
        Solves the pair $a + b = 40$ and $b - a = 18$ rather than assuming
        $a = 1$.
    targets:
      - quant-probability.discrete.uniform-discrete
    exercises:
      - quant-probability.expectation.variance

  - id: qdisc-uniform-discrete-02
    kind: work
    difficulty: standard
    statement: >
      A raffle ticket number is drawn uniformly at random from
      $\{1, 2, \dots, 50\}$. What is the probability that the number drawn is a
      multiple of $7$?
    answer: >
      $0.14$. A discrete uniform law is the classical equally-likely model with
      its outcomes labelled by numbers, so probability is still favourable over
      total, $\Pr(A) = |A|/|\Omega|$, and no pmf algebra is needed. The multiples
      of $7$ in range are $7, 14, 21, 28, 35, 42, 49$ — that is
      $\lfloor 50/7 \rfloor = 7$ of them — so the probability is $7/50 = 0.14$.
      Rounding $50/7 \approx 7.14$ up to $\lceil 50/7 \rceil = 8$ is the usual
      slip, and it counts $56$, which is out of range. As a check on the model,
      the same law gives $\mathbb{E}[X] = (50+1)/2 = 25.5$ and
      $\operatorname{Var}(X) = (50^{2}-1)/12 = 208.25$.
    expects: "0.14"
    rubric:
      - >
        Counts the favourable labels, $\lfloor 50/7 \rfloor = 7$, against the
        $50$ equally likely ones.
      - >
        Rounds $50/7$ down rather than up.
    targets:
      - quant-probability.discrete.uniform-discrete
      - quant-probability.foundations.classical
    exercises:
      - quant-probability.foundations.sample-space
    connects:
      - "quant-probability.discrete.uniform-discrete ~ quant-probability.foundations.classical"

  # --- collecting the whole set ----------------------------------------------

  - id: qdisc-coupon-collector-01
    kind: work
    difficulty: demanding
    statement: >
      A machine dispenses one of eight equally likely toy types on each purchase,
      independently. A collector wants any three *distinct* types, not the whole
      set. What is the expected number of purchases? Give four decimal places.
    answer: >
      $\approx 3.4762$. Split the wait by progress exactly as for a full
      collection, then stop the sum early. Holding $i-1$ distinct types, a
      purchase is new with probability $(8-i+1)/8$, so the wait $T_i$ for the
      $i$-th distinct type is geometric with mean $8/(8-i+1)$, and only the first
      three terms are wanted: $\mathbb{E}[T] = \dfrac{8}{8} + \dfrac{8}{7} +
      \dfrac{8}{6} = 1 + 1.142857 + 1.333333 = \dfrac{73}{21} \approx 3.47619$.
      Linearity adds the $T_i$ without needing them to be independent. For
      contrast, the full set costs $8H_8 \approx 21.74$ purchases — six times as
      much for less than three times the types, because the expense of the coupon
      collector sits entirely in the last few types, which a partial target
      skips.
    expects: "3.4762"
    tolerance: 0.0005
    rubric:
      - >
        Sums only the first three geometric waits, with means $8/8$, $8/7$ and
        $8/6$.
      - >
        Does not compute $8H_8$, which prices the whole set rather than three
        types.
    targets:
      - quant-probability.discrete.coupon-collector
    exercises:
      - quant-probability.discrete.geometric-moments
      - quant-probability.expectation.linearity

  - id: qdisc-coupon-collector-02
    kind: work
    difficulty: standard
    statement: >
      Seven prize types are equally likely and independent on each draw. What is
      the expected number of draws needed to see all seven?
    answer: >
      $18.15$. Write $T = T_1 + \dots + T_7$, where $T_i$ is the wait from $i-1$
      distinct types to $i$: holding $i-1$, a draw is new with probability
      $(7-i+1)/7$, so $\mathbb{E}[T_i] = 7/(7-i+1)$. Linearity adds these even
      though the $T_i$ are dependent, giving $\mathbb{E}[T] = 7H_7 = 7\left(1 +
      \tfrac{1}{2} + \dots + \tfrac{1}{7}\right) = 7 \times \dfrac{363}{140} =
      \dfrac{363}{20} = 18.15$. Guessing something near $7$ is the standard miss:
      the total grows like $n\ln n$, and the last type alone costs $7$ draws on
      average — more than the first four stages put together, which come to about
      $5.32$.
    expects: "18.15"
    rubric:
      - >
        Splits $T$ into geometric waits of mean $7/(7-i+1)$ and adds them by
        linearity.
      - >
        Reports $7H_7$, not $H_7$ alone and not a number near $7$.
    targets:
      - quant-probability.discrete.coupon-collector
    exercises:
      - quant-tools.series-calculus.harmonic-numbers

  - id: qdisc-coupon-collector-03
    kind: decide
    difficulty: standard
    statement: >
      Deck A: nine distinct cards are shuffled uniformly, and $C$ is the number
      of cycles of the resulting permutation. Deck B: draws are made uniformly
      and independently from nine coupon types until all nine have appeared, and
      $T$ is the number of draws. How do $\mathbb{E}[C]$ and $\mathbb{E}[T]/9$
      compare?
    answer: >
      They are equal, both $H_9 = 7129/2520 \approx 2.8290$. Trace the cycle
      through card $1$: with $m$ cards still unused the current cycle closes at
      the next step with probability $1/m$, so $C$ is a sum of independent
      indicators with probabilities $1/9, 1/8, \dots, 1$ and $\mathbb{E}[C] =
      H_9$. Meanwhile $T$ splits into geometric waits of means $9/9, 9/8, \dots,
      9/1$, so $\mathbb{E}[T] = 9H_9 \approx 25.46$ and $\mathbb{E}[T]/9 = H_9$.
      The same harmonic sum appears because both problems add the reciprocal of a
      pool that shrinks by one at each stage; the coupon collector carries the
      extra factor $9$ only because each of its stages is a geometric wait rather
      than a single indicator.
    choices:
      - text: >
          They are equal — both are $H_9 \approx 2.8290$
        correct: true
        feedback: >
          A pool shrinking by one at each stage contributes $1/i$ in either
          problem, so both means are the harmonic sum $H_9$.
      - text: >
          $\mathbb{E}[T]/9$ is larger, because a coupon wait can run arbitrarily
          long
        feedback: >
          Each coupon stage has mean $9/(9-i+1)$, so dividing by $9$ returns
          precisely the $1/(9-i+1)$ that the cycle count contributes.
      - text: >
          $\mathbb{E}[C]$ is larger — a permutation of nine elements averages
          about $4.5$ cycles
        feedback: >
          The mean cycle count is $H_9 \approx 2.83$, not $n/2$; cycles in a
          random permutation are typically long, so there are few of them.
    rubric:
      - >
        Identifies both quantities as $H_9$ rather than comparing them by
        estimate.
      - >
        Names the shared mechanism — a pool shrinking by one at each stage —
        instead of treating the agreement as a coincidence.
    targets:
      - quant-probability.discrete.coupon-collector
      - quant-probability.counting.permutation-cycles
    exercises:
      - quant-tools.series-calculus.harmonic-numbers
    connects:
      - "quant-probability.counting.permutation-cycles ~ quant-probability.discrete.coupon-collector"

  # --- reading the story -----------------------------------------------------

  - id: qdisc-identify-the-law-01
    kind: decide
    difficulty: demanding
    statement: >
      A recruiter works down an effectively unlimited list, calling candidates
      one at a time; each accepts independently with probability $0.15$. She
      stops as soon as four have accepted. Let $X$ be the number of calls made.
      Which law is $X$, and what is its mean?
    answer: >
      Negative binomial with $r = 4$ and $p = 0.15$, mean $r/p = 4/0.15 \approx
      26.67$ calls. Run the checklist. The number of *successes* is fixed at four
      while the number of *trials* is random — the exact inversion of the
      binomial, which fixes $n$ in advance and lets the success count vary. It is
      not geometric, since a geometric stops at the first acceptance with mean
      $1/0.15 \approx 6.67$; $X$ is a sum of four such independent waits, which
      is why the mean is four times as large. And it is not Poisson: there is a
      genuine per-call probability here, whereas Poisson is what you reach for
      when no trial count exists at all. The pmf, if wanted, is $\Pr(X = k) =
      \binom{k-1}{3}(0.15)^{4}(0.85)^{k-4}$ for $k \ge 4$.
    choices:
      - text: >
          Negative binomial with $r = 4$, $p = 0.15$; mean $\approx 26.67$
        correct: true
        feedback: >
          Fixed successes with random trials — a sum of four geometric waits, so
          the mean is $r/p$.
      - text: >
          $\operatorname{Bin}(4, 0.15)$; mean $0.6$
        feedback: >
          That reads $r$ as a number of trials. Four is the stopping count, and a
          mean below $4$ is impossible when at least four calls are always made.
      - text: >
          Geometric with $p = 0.15$; mean $\approx 6.67$
        feedback: >
          A geometric stops at the first acceptance. She keeps going to the
          fourth, so four geometric waits stack up.
      - text: >
          $\operatorname{Poisson}(4)$; mean $4$
        feedback: >
          Poisson is for counts in a window with no natural trial count. Here
          every call is a trial carrying probability $0.15$.
    rubric:
      - >
        Names the fixed-successes, random-trials shape as the tell for the
        negative binomial rather than the binomial.
      - >
        Gives the mean as $r/p$, recognising $X$ as a sum of $r$ geometric waits.
    targets:
      - quant-probability.discrete.identify-the-law
    exercises:
      - quant-probability.discrete.negative-binomial

  - id: qdisc-identify-the-law-02
    kind: decide
    difficulty: standard
    statement: >
      A year of daily outage counts for a service has sample mean $3.1$ and
      sample variance $11.4$. A candidate proposes modelling the daily count as
      Poisson. What does the data say?
    answer: >
      Poisson is ruled out: the counts are overdispersed. A Poisson count has
      $\mathbb{E}[X] = \operatorname{Var}(X) = \lambda$, so fitting
      $\operatorname{Poisson}(3.1)$ from the mean also *predicts* a variance near
      $3.1$, and $11.4$ is more than three times that — far outside sampling
      noise over a year of observations. The binomial fails from the other side:
      $np(1-p) < np$ always, so a binomial is underdispersed and can never show a
      variance above its mean. Overdispersion of this size usually means the rate
      is not constant — outages cluster, or the daily rate itself varies — and
      the standard repair is a mixture such as the negative binomial, not a
      larger $\lambda$.
    choices:
      - text: >
          Poisson is ruled out — the variance far exceeds the mean, so the counts
          are overdispersed
        correct: true
        feedback: >
          Mean equal to variance is the Poisson signature, and $11.4$ against
          $3.1$ breaks it decisively.
      - text: >
          Poisson fits, with $\lambda = 3.1$ taken from the mean
        feedback: >
          The mean does fix $\lambda$, but it then predicts a variance of $3.1$
          as well — and that prediction is contradicted by the observed $11.4$.
      - text: >
          Poisson is ruled out, but a binomial with $np = 3.1$ would match the
          spread
        feedback: >
          A binomial has variance $np(1-p) < np = 3.1$, smaller still. No law of
          independent constant-probability trials reaches $11.4$.
    rubric:
      - >
        Compares the sample variance with the sample mean rather than fitting
        $\lambda$ from the mean and stopping there.
      - >
        Gets the direction right: a variance above the mean is overdispersion,
        which the binomial cannot produce either.
    targets:
      - quant-probability.discrete.identify-the-law
    exercises:
      - quant-probability.discrete.poisson

  - id: qdisc-identify-the-law-03
    kind: decide
    difficulty: routine
    statement: >
      A fair twelve-sided die, with faces $1$ through $12$, is rolled once and
      the face value recorded. What law describes the value, and what is its
      mean?
    answer: >
      Discrete uniform on $\{1, \dots, 12\}$, with mean $(n+1)/2 = 13/2 = 6.5$.
      The story contains no success or failure to count and nothing to wait for —
      just an equally likely label — which is the discrete uniform's signature
      and the one case in this unit where the variable is a *value* rather than a
      count or a wait. Note that fairness is stated in the problem rather than
      assumed: uniformity is a modelling claim that has to be earned. For
      completeness, $\operatorname{Var}(X) = (n^{2}-1)/12 = 143/12 \approx
      11.917$, so $\sigma \approx 3.45$ — a spread of nearly a third of the
      range.
    choices:
      - text: >
          Discrete uniform on $\{1,\dots,12\}$, mean $6.5$
        correct: true
        feedback: >
          Equally likely labels with no successes to count; the mean is
          $(n+1)/2$.
      - text: >
          $\operatorname{Bin}(12, 1/2)$, mean $6$
        feedback: >
          Nothing here counts successes over twelve trials. A single roll returns
          a label, and a binomial would pile its mass near $6$ rather than
          spreading it evenly over the faces.
      - text: >
          Geometric with $p = 1/12$, mean $12$
        feedback: >
          Geometric answers "how many rolls until", but nothing is being waited
          for — the die is rolled exactly once.
    rubric:
      - >
        Reads "equally likely label, one roll" as uniform rather than as a count
        or a wait.
      - >
        Quotes the mean as $(n+1)/2$, not as $n/2$.
    targets:
      - quant-probability.discrete.identify-the-law
    exercises:
      - quant-probability.discrete.uniform-discrete
