nodes:
  - id: quant-puzzles.nim-games
    kind: subbranch
    title: "Take-Away & Combinatorial Games"
    summary: >
      Games you can solve outright — N/P positions, the Nim XOR theorem,
      races to N, and strategy stealing.
    parent: quant-puzzles
    also_under: []
    tags: []

  - id: quant-puzzles.nim-games.combinatorial-game
    kind: definition
    prominence: 1
    title: "Impartial games under normal play"
    statement: >
      The games solved here are finite, two-player, perfect-information games
      with no chance device and no hidden state: a position, a set of legal
      moves that depends only on the position and not on whose turn it is
      (impartial), alternating play, and a guarantee that play terminates. The
      normal-play convention is that the player unable to move loses —
      equivalently, the player who takes the last object wins; misère play
      reverses this and is usually harder. There are no payoffs and no mixing
      here: a finite game of perfect information with no draws is determined,
      so exactly one of the two players can force a win. The only questions an
      interviewer can ask are therefore which player wins and what the first
      move is.
    summary: >
      Finite, impartial, chance-free games under the normal-play convention:
      the last player to move wins, and one of the two sides can always force
      it.
    parent: quant-puzzles.nim-games
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-puzzles.nim-games.np-positions
    kind: definition
    prominence: 2
    title: "N-positions and P-positions"
    statement: >
      Label each position by who wins from it under optimal play, naming the
      labels for the player about to move. A P-position is a win for the
      previous player, so the player to move loses; an N-position is a win for
      the next player, so the player to move wins. The labelling is forced from
      the end of the game backwards: a terminal position, with no legal move,
      is a P-position; a position is an N-position if at least one move leads
      to a P-position; a position is a P-position if every move leads to an
      N-position. Because the game is finite this labels every position, and
      the label of the starting position is the answer to "who wins?". Playing
      well is then mechanical: always hand your opponent a P-position.
    summary: >
      P means the player to move loses and N means the player to move wins;
      label the terminal positions P, propagate backwards, then always move
      onto a P-position.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.combinatorial-game
      - quant-puzzles.strategies.working-backwards
    relates:
      - id: quant-games.game-theory.backward-induction-games
        note: >
          The same recursion run from the end of the game tree; there the
          leaves carry numeric payoffs and each player maximizes their own,
          while here the leaves carry only win or lose, so two labels replace
          the whole payoff calculation.
    tags: []

  - id: quant-puzzles.nim-games.backward-labelling
    kind: technique
    prominence: 1
    title: "Labelling the position table"
    statement: >
      Reach for this whenever a take-away game has a single integer state $n$:
      tabulate the P/N label for $n = 0, 1, 2, \dots$ until the pattern
      repeats, then confirm the pattern by induction. Worked, for "remove $1$,
      $2$ or $3$ counters, last to take wins": $n = 0$ is P because it is
      terminal; $n = 1, 2, 3$ are N because each can move to $0$; $n = 4$ is P
      because the three legal moves land on $3, 2, 1$, all N. The block of four
      then repeats forever, so the P-positions are exactly the $n$ with
      $4 \mid n$. From $n = 17$, take $1$ to leave $16$ and restore a multiple
      of $4$ on every later turn. Six to eight table entries almost always
      expose the period at the table.
    summary: >
      Write the win/lose table out from $n = 0$ until it repeats — for "take
      $1$ to $3$" the losing positions are the multiples of $4$.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.np-positions
    relates: []
    tags: []

  - id: quant-puzzles.nim-games.subtraction-game-period
    kind: proposition
    prominence: 1
    title: "Subtraction games are periodic"
    statement: >
      Fix a finite set $S$ of allowed take sizes; a position is a count $n$, a
      move removes exactly $s$ counters for some $s \in S$, and the player
      taking the last counter wins. The label of $n$ depends only on the labels
      of the $n - s$, so the window of the last $\max S$ labels determines
      everything after it and the P/N pattern is eventually periodic. Two cases
      are worth memorizing. If $S = \{1, 2, \dots, k\}$ the P-positions are
      exactly the multiples of $k+1$: from a multiple every move leaves a
      non-multiple, and from a non-multiple $n$ removing $n \bmod (k+1)$
      restores one. If $S = \{1, 3, 4\}$ the labels for $n = 0, \dots, 8$ read
      P, N, P, N, N, N, N, P, N, so the P-positions are $n \equiv 0$ or
      $2 \pmod 7$.
    summary: >
      Take-away games with a fixed set of legal takes settle into a periodic
      win/lose pattern — multiples of $k+1$ when the takes are $1$ through $k$,
      and $0$ or $2 \pmod 7$ when they are $\{1,3,4\}$.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.backward-labelling
    relates: []
    tags: []

  - id: quant-puzzles.nim-games.race-to-n
    kind: example
    prominence: 1
    title: "Race to 100"
    statement: >
      "We alternate adding a whole number from $1$ to $10$ to a running total
      that starts at $0$; whoever says $100$ wins. Do you want to go first?"
      Work backwards from the goal. You want to say $100$, so you must leave
      your opponent at $89$: from $89$ they can only reach $90$ through $99$,
      and you finish. Repeating, the positions to stand on are $100, 89, 78,
      67, 56, 45, 34, 23, 12, 1$ — exactly the totals $\equiv 1 \pmod{11}$.
      Since $1$ is reachable on the opening move, go first, say $1$, and
      thereafter answer an opponent's $k$ with $11 - k$. In the misère version,
      where saying $100$ loses, the control set is $99, 88, \dots, 11, 0$;
      $0$ is where the game starts, so there the second player wins.
    summary: >
      Adding $1$ to $10$ up to $100$: control the totals $1, 12, 23, \dots, 89,
      100$, so go first, open with $1$, and always reply $11 - k$.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.subtraction-game-period
    relates:
      - id: quant-puzzles.strategies.invariant
        note: >
          The residue $1 \pmod{11}$ is the invariant of the race: the opponent
          cannot preserve it and you can always restore it, which is the
          general invariant-plus-restoration pattern in its purest form.
    tags: []

  - id: quant-puzzles.nim-games.nim-rules
    kind: definition
    prominence: 1
    title: "Nim"
    statement: >
      Nim is played with several piles of counters. A move selects one pile and
      removes any positive number of counters from it, up to the whole pile;
      under normal play the player who takes the last counter wins. A position
      is the multiset of pile sizes: order does not matter and empty piles may
      be discarded. One pile of size $n$ is an immediate win for the mover, who
      takes all $n$; the standard interview instances are two and three piles,
      quoted most often as $(3,5,7)$. Nim is not just one puzzle among many:
      every finite impartial game under normal play is equivalent to a single
      Nim pile, which makes it the universal example of the whole class.
    summary: >
      Piles of counters, remove any number you like from one pile, last counter
      wins — the canonical impartial game, usually posed with piles $(3,5,7)$.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.combinatorial-game
    relates: []
    tags: []

  - id: quant-puzzles.nim-games.equal-piles-mirroring
    kind: example
    prominence: 1
    title: "Two equal piles: mirror the opponent"
    statement: >
      Two piles of $7$ counters, remove as many as you like from one pile, last
      counter wins — who wins? The second player, by mirroring: whatever the
      opponent removes from one pile, remove exactly the same amount from the
      other. Every position the mirrorer hands back has two equal piles, the
      total strictly decreases, so the empty position $(0,0)$ — which is a loss
      for whoever faces it — is always handed to the opponent, never faced by
      the mirrorer. Hence $(a,a)$ is a P-position, and $(a,b)$ with $a \ne b$ is an
      N-position: equalize by taking $|a - b|$ from the larger pile. The same
      copycat idea settles the coins-on-a-round-table game, where the first
      player takes the centre and then mirrors every move through it.
    summary: >
      Two equal Nim piles lose for the player to move — copy each move in the
      other pile; unequal piles win, by equalizing them.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.nim-rules
      - quant-puzzles.nim-games.np-positions
      - quant-puzzles.strategies.symmetry-strategy
    relates: []
    tags: []

  - id: quant-puzzles.nim-games.nim-xor
    kind: theorem
    prominence: 2
    title: "Bouton's theorem: the Nim XOR rule"
    statement: >
      Write the pile sizes in binary and define the nim-sum
      $a_1 \oplus a_2 \oplus \dots \oplus a_m$, the bitwise XOR: add each
      binary column modulo $2$ with no carries. Under normal play, a Nim
      position is a P-position exactly when its nim-sum is $0$. Two facts prove
      it. From nim-sum $0$, any move alters exactly one pile and so must make
      the nim-sum nonzero. From nim-sum $s \ne 0$, take the highest set bit of
      $s$, choose a pile $a$ having that bit; then $a \oplus s < a$, so
      removing $a - (a \oplus s)$ counters is a legal move and it zeroes the
      nim-sum. Worked on $(3,5,7)$: $3 \oplus 5 = 6$ and $6 \oplus 7 = 1$,
      nonzero, so the mover wins — remove $1$ from the seven-pile to leave
      $(3,5,6)$, whose nim-sum is $0$.
    summary: >
      Nim is a loss for the player to move exactly when the XOR of the pile
      sizes is $0$; $(3,5,7)$ has nim-sum $1$, so the mover wins by taking one
      counter from any pile.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.nim-rules
      - quant-puzzles.nim-games.np-positions
    relates: []
    tags: []

  - id: quant-puzzles.nim-games.nim-move-recipe
    kind: technique
    prominence: 1
    title: "Finding the winning Nim move at the table"
    statement: >
      Do it in this order. Write the piles in binary; XOR them column by
      column; if the nim-sum is $0$, ask to move second; otherwise find the
      leading $1$ of the nim-sum $s$, pick any pile $a$ whose binary carries
      that bit, and move that pile to $a \oplus s$. Worked on $(7,9,12)$:
      $7 \oplus 9 = 14$ and $14 \oplus 12 = 2$, so $s = 2$. Only $7 = 111_2$
      carries the $2$-bit, and $7 \oplus 2 = 5$, so take $2$ from the
      seven-pile, leaving $(5,9,12)$ — a P-position, since $5 \oplus 9 = 12$.
      In misère Nim, where the last counter loses, play the identical strategy
      until exactly one pile still exceeds $1$; at that moment reduce it so as
      to leave an odd number of piles of size $1$.
    summary: >
      Binary, XOR, leading bit, replace $a$ by $a \oplus s$ — and in misère Nim
      switch strategy at the last big pile, leaving an odd number of
      singletons.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.nim-xor
    relates: []
    tags: []

  - id: quant-puzzles.nim-games.strategy-stealing
    kind: technique
    prominence: 1
    title: "Strategy stealing"
    statement: >
      Reach for this when you must show that the first player wins but cannot
      exhibit a strategy. The argument has a fixed shape. The game is finite
      with no draws, so exactly one player can force a win. Suppose it were the
      second player. Let the first player make an arbitrary opening move and
      then follow the second player's winning strategy, treating the extra
      piece already on the board as a spare; this is legitimate precisely when
      an extra move can never hurt you and when every reply the stolen strategy
      calls for is still available. The first player then wins, contradicting
      the assumption. Hence the first player wins. Note what the argument does
      not give: it names no move, and for Chomp and Hex no explicit winning
      strategy is known in general.
    summary: >
      In a finite draw-free game where an extra move never hurts, assume the
      second player wins, steal that strategy after any opening, and hit a
      contradiction — the first player wins, non-constructively.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.np-positions
    relates: []
    tags: []

  - id: quant-puzzles.nim-games.chomp
    kind: example
    prominence: 1
    title: "Chomp: the first player wins, but nobody knows how"
    statement: >
      Chomp is played on an $m \times n$ grid whose bottom-left square is
      poisoned. A move names a remaining square and eats it together with every
      square above and to the right of it; whoever eats the poisoned square
      loses. Claim: on any grid other than $1 \times 1$, the first player wins.
      Steal the strategy. Suppose the second player had a winning strategy, and
      let the first player eat just the top-right square. The winning reply to
      that is some move $M$. But the top-right square lies above and to the
      right of every square, so any move already removes it, and playing $M$
      straight from the full grid reaches the same position — with the first
      player now in the winning seat. Contradiction. Explicit play is known
      only in small cases: in $2 \times n$ Chomp, always leave the bottom row
      one square longer than the top.
    summary: >
      Eating the corner and stealing the reply shows the first player wins
      every non-trivial Chomp grid, without ever naming a winning move.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.strategy-stealing
    relates: []
    tags: []

  - id: quant-puzzles.nim-games.grundy
    kind: definition
    prominence: 0
    title: "Sprague–Grundy values"
    statement: >
      For an impartial game under normal play, define the Grundy value $g(x)$
      of a position recursively as the mex — the minimum excludant, the
      smallest nonnegative integer that is not the Grundy value of an option:
      $g(x) = \operatorname{mex}\{g(y) : x \to y\}$. Then $g(x) = 0$ exactly at
      the P-positions, and a position of Grundy value $g$ behaves in every
      respect like a single Nim pile of $g$ counters. For a disjunctive sum of
      independent games, where a move acts in exactly one component, the Grundy
      value of the sum is $g(x_1) \oplus \dots \oplus g(x_m)$; taking each
      component to be one pile, whose Grundy value is its size, recovers
      Bouton's theorem. Interview use is as a pointer: "this is a sum of games,
      so compute Grundy values and XOR them".
    summary: >
      Every impartial position is equivalent to one Nim pile of size $g$,
      computed by mex, and independent games in a sum have their Grundy values
      XORed.
    parent: quant-puzzles.nim-games
    also_under: []
    requires:
      - quant-puzzles.nim-games.nim-xor
      - quant-puzzles.nim-games.backward-labelling
    relates: []
    tags: []
