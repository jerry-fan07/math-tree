nodes:
  - id: quant-puzzles.strategies
    kind: subbranch
    title: "Puzzle Strategies"
    summary: >
      The moves that crack puzzles — invariants, parity, symmetry,
      extremal arguments, coloring, and working backwards.
    parent: quant-puzzles
    also_under: []
    tags: []

  - id: quant-puzzles.strategies.small-cases
    kind: technique
    prominence: 1
    title: "Compute the small cases first"
    statement: >
      Reach for this whenever the problem carries a size parameter $n$ and offers
      no handle: work out $n = 1, 2, 3, 4$ by hand, tabulate, and read off the
      pattern. Small cases usually expose the invariant, the recurrence or the
      losing positions all at once, and they cost thirty seconds of an interview.
      A table is a conjecture, never an answer — say the guess out loud, then
      prove it by induction or by a direct argument. Cautionary instance: put $n$
      points on a circle in general position and draw every chord, counting
      regions. For $n = 1,\dots,5$ the counts are $1, 2, 4, 8, 16$ and everybody
      says $2^{n-1}$; the true count at $n = 6$ is $31$.
    summary: >
      Tabulate the first few cases to find the pattern, and treat the pattern as
      a conjecture — the circle-chord counts $1,2,4,8,16,31$ are the warning.
    parent: quant-puzzles.strategies
    also_under: []
    requires: []
    relates:
      - id: quant-tools.recurrences.linear-recurrence
        note: >
          The table of small cases is usually where the recurrence is spotted;
          solving that recurrence is what turns the guessed pattern into a proof.
    tags: []

  - id: quant-puzzles.strategies.invariant
    kind: technique
    prominence: 2
    title: "Invariants"
    statement: >
      An invariant is a quantity or property that every legal move leaves
      unchanged. The tell is a reachability question — "can you reach ...?", "is
      it possible to end with ...?" — with local, repeatable moves. Method:
      evaluate a candidate quantity before and after one generic move; if it never
      changes, it is constant on everything reachable from the start, so a target
      with a different value is unreachable. Invariants also compute: write
      $1,\dots,n$ on a board and repeatedly erase two numbers, replacing them by
      their sum; the total is invariant, so the last number standing is
      $n(n+1)/2$ no matter how you choose. An invariant proves impossibility, so
      possibility still needs an explicit construction.
    summary: >
      Find a quantity every move preserves: start and target with different
      values can never be joined, and a preserved total often hands you the
      answer outright.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.small-cases
    relates: []
    tags: []

  - id: quant-puzzles.strategies.parity
    kind: technique
    prominence: 1
    title: "Parity arguments"
    statement: >
      Parity is the invariant to test first, because it is free: count something
      mod $2$. The tell is a move that changes a count by an even amount, objects
      that come in pairs, a board whose squares alternate, or a shuffle described
      by swaps. Worked: three cups stand upside down and a move inverts exactly
      two of them — can all three end upright? Each move changes the number of
      upside-down cups by $+2$, $0$ or $-2$, so that number's parity never moves;
      it starts at $3$, which is odd, and the target $0$ is even, so no sequence
      of moves works. Standard parities to try: the count of objects in a state,
      the coordinate sum $x + y$ of a square, and the sign of a permutation, which
      flips with every transposition.
    summary: >
      The cheapest invariant: something counted mod $2$ that no move can change —
      three cups flipped two at a time can never all stand upright.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.invariant
    relates: []
    tags: []

  - id: quant-puzzles.strategies.mod-invariant
    kind: technique
    prominence: 1
    title: "Invariants modulo m"
    statement: >
      When parity says nothing, try residues modulo the modulus the move sizes
      suggest — a move that shifts counts by $(-1,-1,+2)$ points at $m = 3$.
      Sketch of the standard instance: an island holds $13$ red, $15$ green and
      $17$ blue chameleons, and when two of different colors meet both take the
      third color, so one count falls by $1$, another falls by $1$, and the third
      rises by $2$. Every pairwise difference of counts therefore changes by $0$
      or $\pm 3$ and is invariant mod $3$. The residues start at $1, 0, 2$, all
      distinct, while a monochromatic island has two counts equal to $0$ and hence
      congruent — so the colors can never merge. Generalization: look for a linear
      combination of the state variables that the move fixes mod $m$.
    summary: >
      Residues mod $3$ (or mod $m$) catch what parity misses: the chameleons'
      pairwise count differences are fixed mod $3$, so one color can never take
      over.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.parity
    relates: []
    tags: []

  - id: quant-puzzles.strategies.coloring
    kind: technique
    prominence: 1
    title: "Coloring arguments"
    statement: >
      Color the cells of a board so that every piece, or every legal move, covers
      a fixed pattern of colors; a target whose color counts do not match that
      pattern is unreachable. The tell is tiling, covering, or a
      knight/rook/bishop reachability question. Worked, the mutilated chessboard:
      delete two diagonally opposite corners of an $8 \times 8$ board, which are
      the same color, leaving $32$ squares of one color and $30$ of the other. A
      domino covers exactly one square of each color, so the $31$ dominoes needed
      would cover $31$ and $31$. The counts disagree, so no tiling exists. When
      two colors fail, try stripes, four colors, or coloring by $x + y \bmod 3$
      for triomino-shaped pieces.
    summary: >
      Paint the board so each piece covers a fixed color mix, then count: $32$
      versus $30$ squares kills every domino tiling of the mutilated chessboard.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.parity
    relates: []
    tags: []

  - id: quant-puzzles.strategies.monovariant
    kind: technique
    prominence: 1
    title: "Monovariants and termination"
    statement: >
      A monovariant is a quantity that moves only one way. If a nonnegative
      integer quantity strictly decreases at every legal move, the process must
      stop, and it stops within the initial value's worth of moves — well-ordering
      does the work, no cleverness required. The tell: "show this procedure
      terminates", "show the configuration stabilizes", or any rebalancing or
      sorting loop. Worked: in a list of $n$ distinct numbers, repeatedly swap
      some adjacent out-of-order pair. Each swap destroys exactly one inversion
      and creates none, and there are at most $\binom{n}{2}$ inversions to begin
      with, so the process halts after at most $n(n-1)/2$ swaps in a state with no
      inversions left — a sorted list. The same count bounds the running time.
    summary: >
      A nonnegative integer that strictly decreases every move forces
      termination, and its starting value bounds the number of moves.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.invariant
    relates: []
    tags: []

  - id: quant-puzzles.strategies.symmetry-strategy
    kind: technique
    prominence: 1
    title: "Mirroring and pairing strategies"
    statement: >
      In a two-player game on a symmetric position with a symmetric move set,
      play to restore the symmetry after every opponent move. The restored
      symmetry is your invariant: if the opponent had a legal move, its mirror
      image is legal and unused, so you can never be the player who runs out.
      Worked: two players alternately place identical non-overlapping coins on a
      round table and the last to place wins. Player one puts the first coin
      exactly at the center, then reflects every subsequent opponent coin through
      the center; the reflected spot is always free, so player two is the first
      stuck. Mirroring hands the win to the second player instead when the start
      is already symmetric, such as two equal piles.
    summary: >
      Answer each move with its mirror image and the symmetry never breaks on
      your turn — center-first-then-mirror wins the coins-on-a-table game.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.invariant
    relates: []
    tags: []

  - id: quant-puzzles.strategies.extremal
    kind: technique
    prominence: 1
    title: "The extremal principle"
    statement: >
      The tell is an existence or impossibility claim about a finite
      configuration with no natural place to start. The move: name the largest,
      smallest, closest, first or leftmost object and argue about it, because an
      extreme object obeys constraints a generic one does not — nothing is beyond
      it. Worked: an odd number of people stand at pairwise distinct distances and
      each shoots the person nearest to them; someone is unhit. Consider the
      closest pair, who shoot each other. If some third person also shoots one of
      them, then at most $n - 3$ of the $n$ bullets land among the other $n - 2$
      people and one of them survives; otherwise those $n - 2$ people shoot only
      each other, forming the same problem with $n - 2$ odd, and induction
      finishes it.
    summary: >
      Pick the extreme element — biggest, closest, first — and let its
      extremality do the arguing; the closest pair always shoot each other.
    parent: quant-puzzles.strategies
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-puzzles.strategies.averaging
    kind: technique
    prominence: 1
    title: "Averaging arguments"
    statement: >
      If $n$ quantities sum to $S$, then at least one is $\ge S/n$ and at least
      one is $\le S/n$ — an existence proof with no construction. The
      probabilistic form is the same statement with linearity doing the counting:
      build a random object, compute $\mathbb{E}[X]$, and conclude that some
      object has $X \ge \mathbb{E}[X]$ and some has $X \le \mathbb{E}[X]$. The
      tell is "show that there exists one with at least ...". Worked: in a round
      robin among $n$ players each of the $\binom{n}{2}$ games produces exactly
      one win, so the wins total $n(n-1)/2$ and somebody wins at least $(n-1)/2$
      games. The bound is tight only when all the values are equal, so any spread
      in the data means the extreme beats the average strictly.
    summary: >
      Something is always at least as big as the average, so computing a mean
      proves an object exists without exhibiting it.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.extremal
      - quant-probability.expectation.linearity
    relates: []
    tags: []

  - id: quant-puzzles.strategies.working-backwards
    kind: technique
    prominence: 1
    title: "Working backwards"
    statement: >
      Invert the problem when the goal is tightly constrained and the start is
      not, or when one step is easier to undo than to do. Assume the target state,
      ask what the immediately preceding state must have been, and iterate; the
      backward branching factor is usually far smaller than the forward one, which
      is what makes the search finite. Worked: a culture doubles every minute and
      fills the jar at $60$ minutes, so one step back it was half full at $59$.
      In games the same move means labelling terminal positions as wins or losses
      and propagating the labels one move at a time toward the start. Meet in the
      middle when both ends are constrained: search forward from the start,
      backward from the goal, and intersect.
    summary: >
      Start at the answer and undo moves — the goal usually has far fewer
      predecessors than the start has successors.
    parent: quant-puzzles.strategies
    also_under: []
    requires: []
    relates:
      - id: quant-processes.stopping.backward-induction
        note: >
          Backward induction is this same move made quantitative: values rather
          than win/lose labels are propagated back from the final stage.
    tags: []

  - id: quant-puzzles.strategies.state-space
    kind: technique
    prominence: 0
    title: "State-space framing"
    statement: >
      Recast the puzzle as a graph whose vertices are configurations and whose
      edges are legal moves. Reachability becomes connectivity, "fewest moves"
      becomes a shortest path, and an invariant is exactly a function constant on
      each connected component — which is why exhibiting one proves
      unreachability. The tell is a small discrete state described by a few
      numbers: jug contents $(a,b)$, token positions, a permutation of tiles.
      Worked: sliding-tile states carry the invariant "sign of the tile
      permutation, corrected by the parity of the blank's row distance", preserved
      by every slide, so exactly half of the $16!$ labelings are reachable and the
      board with $14$ and $15$ swapped is not one of them.
    summary: >
      Configurations as vertices, moves as edges: invariants are the functions
      constant on components, which is why half the 15-puzzle positions are
      unreachable.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.parity
      - quant-puzzles.strategies.working-backwards
    relates: []
    tags: []

  - id: quant-puzzles.strategies.adversary
    kind: technique
    prominence: 1
    title: "Adversary and worst-case thinking"
    statement: >
      The tell is the words "guarantee", "worst case", "must", or "at least how
      many". The move: assume the hidden data is chosen by an adversary who
      answers adaptively, consistent with everything you have already seen, and
      who is trying to make you work as long as possible. Your answer is the cost
      against that opponent, not against a typical instance. Worked: a dark drawer
      holds $10$ red and $10$ blue socks — how many must you draw to guarantee a
      matching pair? The adversary gives you one red and one blue, but the third
      sock has only two colors available, so pigeonhole forces a match and the
      answer is $3$. Adversary arguments prove lower bounds; a matching procedure
      proves the upper bound.
    summary: >
      Let a malicious opponent pick the answers as you go: what you can still
      guarantee against them is the worst-case cost, and it is rarely the typical
      one.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-probability.counting.pigeonhole
    relates:
      - id: quant-games.game-theory.minimax
        note: >
          Worst-case puzzle reasoning is the minimax value of a zero-sum game
          played against nature: you maximize over strategies what nature
          minimizes over hidden states.
    tags: []

  - id: quant-puzzles.strategies.guarantee-vs-expectation
    kind: intuition
    prominence: 1
    title: "Guarantees are not expectations"
    statement: >
      "How many draws does it take?" is two different questions. A guarantee is
      the worst case against an adversary; an average is an expectation over a
      stated random model, and the two answers differ. Sock drawer, $10$ red and
      $10$ blue: the guarantee is $3$ draws, but if the socks come out in uniform
      random order the second sock matches the first with probability $9/19$, so
      the expected number of draws to a pair is
      $2 \cdot (9/19) + 3 \cdot (10/19) = 48/19 \approx 2.53$. Interview craft:
      ask which one the interviewer wants, name the random model out loud if you
      switch to the average, and never answer "on average" to a question that
      said "guarantee".
    summary: >
      Worst case and average are separate numbers — $3$ socks guaranteed versus
      $48/19 \approx 2.53$ expected — so state which one you are computing.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.adversary
      - quant-probability.expectation.expectation
    relates: []
    tags: []

  - id: quant-puzzles.strategies.info-lower-bound
    kind: technique
    prominence: 2
    title: "Information-theoretic lower bounds"
    statement: >
      A test with $b$ possible outcomes multiplies the number of histories you can
      tell apart by at most $b$, so $k$ tests distinguish at most $b^{k}$ cases:
      any procedure that must identify one of $N$ possibilities needs
      $k \ge \log_b N$, that is $k \ge \lceil \log_b N \rceil$ tests. Worked: $12$
      coins, one counterfeit that may be heavy or light, and a balance. The answer
      must name the coin and its direction, so $N = 24$, and a weighing has three
      outcomes; since $3^{2} = 9 < 24 \le 27 = 3^{3}$, two weighings are
      impossible and three is the first candidate — a scheme that achieves three
      does exist. Same count: $\lceil \log_2 N \rceil$ yes/no questions, and
      $\log_2(n!)$ comparisons to sort. Counting gives necessity only; you still
      owe a scheme.
    summary: >
      Count outcomes: $k$ tests with $b$ results each separate at most $b^{k}$
      cases, which is why $12$ coins need $3$ weighings and no fewer.
    parent: quant-puzzles.strategies
    also_under: []
    requires:
      - quant-puzzles.strategies.adversary
    relates: []
    tags: []
