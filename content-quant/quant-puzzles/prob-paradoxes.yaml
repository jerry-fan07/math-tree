# quant-puzzles.prob-paradoxes — Probability Paradoxes
# Outline node (53 in content-quant/outline.md's authoring order).
# Internal chain: protocol-matters -> full-observation -> the three
# likelihood puzzles (Monty, Bertrand's box, boy–girl) -> conditioning
# fineness -> Simpson. The airplane seat and the two envelopes hang off
# first-step conditioning and the tower property respectively.
# St. Petersburg is authored in §8 and only related to here.

nodes:
  - id: quant-puzzles.prob-paradoxes
    kind: subbranch
    title: "Probability Paradoxes"
    summary: >
      Where intuition breaks — Monty Hall, boy–girl, two envelopes, St.
      Petersburg, Simpson, and the airplane seat.
    parent: quant-puzzles
    also_under: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.protocol-matters
    kind: technique
    prominence: 2
    title: "Fix the generating protocol before you condition"
    statement: >
      A probability paradox almost always means the question named an event but
      not the procedure that produced it. Before computing, write the experiment
      out in full: (1) the state of the world and its prior; (2) the rule by
      which an observer selects and reports what you are told; (3) the report
      you actually received. Only then is $\Pr(\text{state} \mid \text{report})$
      even defined. "At least one is a boy" is not data until you know whether
      families were screened for boys or a child was met at random; "there is a
      goat behind door 3" is not data until you know whether the host was
      aiming. Interview craft: say out loud which protocol you are assuming,
      price that version, then flag the alternative — every long argument about
      Monty Hall is two people pricing different games.
    summary: >
      Nearly every probability paradox is an underspecified experiment; naming
      the sampling and reporting rule before conditioning dissolves most of
      them.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-probability.conditional.conditional-probability
    relates:
      - id: quant-probability.geometric.specify-the-mechanism
        note: >
          The same demand in continuous dress: there "uniformly at random" is
          undefined until you name the variable it is uniform in, here a verbal
          report is undefined until you name the rule that generated it.
    tags: []

  - id: quant-puzzles.prob-paradoxes.full-observation
    kind: technique
    prominence: 1
    title: "Condition on the whole observation, not just the bare fact"
    statement: >
      The standard error is to treat every hypothesis consistent with what you
      saw as equally supported. Bayes weights instead by the likelihood of the
      exact observation, $\Pr(H \mid O) \propto \Pr(O \mid H)\Pr(H)$, and
      $\Pr(O \mid H)$ is rarely $1$ just because $O$ is possible under $H$.
      Mechanics: for each hypothesis ask how many reports the protocol could
      have produced and with what chance it produced this one. A hypothesis with
      several possible reports has its prior split among them and is penalised;
      a hypothesis forced to emit exactly this report keeps its prior whole.
      That one asymmetry is the engine behind Monty Hall, Bertrand's box and the
      two answers to the boy–girl question.
    summary: >
      Weight hypotheses by how likely they were to yield the exact report you
      received, not by whether they merely permit it.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.protocol-matters
      - quant-probability.conditional.bayes
    relates:
      - id: quant-probability.conditional.disease-test
        note: >
          Two halves of one reflex: the screening test punishes discarding the
          prior, while these puzzles punish discarding the likelihood of the
          observation, and Bayes needs both factors to be respected at once.
    tags: []

  - id: quant-puzzles.prob-paradoxes.monty-hall
    kind: example
    prominence: 2
    title: "Monty Hall"
    statement: >
      Three doors hide one car; you pick door $1$; the host, who knows the
      layout, must open a different door showing a goat and always offers the
      switch. He opens door $3$. The likelihoods are
      $\Pr(O_3 \mid C_1) = 1/2$ because he was free to open either goat door,
      $\Pr(O_3 \mid C_2) = 1$ because door $2$ was forced shut, and
      $\Pr(O_3 \mid C_3) = 0$. Against the uniform prior,
      $\Pr(C_1 \mid O_3) = (1/6)/(1/6 + 1/3) = 1/3$, so switching wins with
      probability $2/3$. Shortcut for the interview: switching wins exactly when
      your first pick was wrong, which is $2/3$ regardless of what the host does
      next. With $100$ doors and $98$ goats revealed, switching wins $99/100$ —
      the version that convinces people.
    summary: >
      Switch: the host's forced reveal leaves your door at $1/3$ and piles the
      whole remaining $2/3$ onto the single other closed door.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.full-observation
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.monty-ignorant-host
    kind: example
    prominence: 1
    title: "Monty Hall with an ignorant host"
    statement: >
      Change one clause: the host does not know where the car is, opens one of
      the two doors you did not pick uniformly at random, and it happens to show
      a goat. Now the joint likelihoods are
      $\Pr(O_3, \text{goat} \mid C_1) = \Pr(O_3, \text{goat} \mid C_2) = 1/2$ and
      $\Pr(O_3, \text{goat} \mid C_3) = 0$, so the posterior on your own door is
      $(1/6)/(1/6 + 1/6) = 1/2$ and switching is worth nothing. The difference
      is that a third of the time this host exposes the car and the round is
      void; those voided rounds are precisely the ones whose probability used to
      be transferred onto the closed door. Identical visible outcome, different
      protocol, different answer — the host's knowledge is not decoration, it is
      the mechanism.
    summary: >
      An ignorant host who happens to uncover a goat leaves the two closed doors
      at $1/2$ each; the extra $2/3$ came from the rounds his knowledge
      suppressed.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.monty-hall
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.monty-host-bias
    kind: example
    prominence: 0
    title: "Monty Hall with a biased host"
    statement: >
      Keep the knowing host but give him a habit: when your door hides the car
      and he is free to choose, he opens door $3$ with probability $q$. Given he
      opens door $3$, $\Pr(C_1 \mid O_3) = q/(1+q)$ and switching wins
      $1/(1+q)$; given he opens door $2$, switching wins $1/(2-q)$. At
      $q = 1/2$ both are the familiar $2/3$. At $q = 1$, his opening door $3$ is
      uninformative and switching wins exactly $1/2$, while his opening door $2$
      proves the car sits behind door $3$ and switching wins $1$. Since
      $1/(1+q) \ge 1/2$ and $1/(2-q) \ge 1/2$ for every $q \in [0,1]$, switching
      is never worse than staying whatever the host's tell — the robust answer
      to give when the interviewer starts editing the rules.
    summary: >
      A biased but knowing host moves the switch probability between $1/2$ and
      $1$; switching still weakly dominates staying for every possible bias.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.monty-hall
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.bertrand-box
    kind: example
    prominence: 1
    title: "Bertrand's box (three cards)"
    statement: >
      Three boxes hold, respectively, two gold coins, one gold and one silver,
      and two silver. Pick a box uniformly, then a coin from it uniformly; the
      coin is gold. What is the chance the other coin in that box is also gold?
      The reflex answer $1/2$ — "it must be the gold-gold or the mixed box" —
      ignores that the gold-gold box had two ways to show gold and the mixed box
      only one. Likelihoods $1$, $1/2$, $0$ against equal priors give
      $(1/3)/(1/3 + 1/6) = 2/3$. Counting coins is faster still: three gold
      coins are in play and two of them live in the gold-gold box, so $2/3$. The
      three-card version — cards red-red, red-white, white-white, a red face
      showing — is the same problem with the same answer.
    summary: >
      A box with two gold coins has twice as many ways to show one, so the
      hidden coin is gold with probability $2/3$ rather than $1/2$.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.full-observation
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.boy-girl
    kind: example
    prominence: 1
    title: "The boy–girl paradox"
    statement: >
      A family has two children, each independently a boy or a girl with
      probability $1/2$, so BB, BG, GB, GG are equally likely. Protocol one —
      families are screened and you are told only that at least one child is a
      boy — leaves three equally likely cases, so $\Pr(\text{BB}) = 1/3$.
      Protocol two — you meet one of the two children, chosen uniformly, and he
      is a boy — has likelihoods $1$, $1/2$, $1/2$, $0$, giving
      $\Pr(\text{BB}) = (1/4)/(1/4 + 1/8 + 1/8) = 1/2$. Being told "the elder is
      a boy" also gives $1/2$. Neither number is wrong; the sentence "at least
      one is a boy" simply does not say which experiment was run, and the point
      of the question is whether you ask.
    summary: >
      Screening families for a boy gives $1/3$; meeting a random child who turns
      out to be a boy gives $1/2$ — the same words, two different experiments.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.full-observation
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.tuesday-boy
    kind: example
    prominence: 1
    title: "The Tuesday-boy variant"
    statement: >
      Keep the screening protocol and sharpen the report to "at least one is a
      boy born on a Tuesday". Each child is one of $14$ equally likely
      sex-and-day pairs, giving $196$ equally likely ordered families. Those
      containing a Tuesday boy number $14 + 14 - 1 = 27$, and among them the
      two-boy families number $7 + 7 - 1 = 13$, so the answer is
      $13/27 \approx 0.481$. As likelihoods: a two-boy family satisfies the tag
      with probability $1 - (6/7)^{2} = 13/49$ against $7/49$ for each mixed
      family. Two boys mean two independent chances at a rare tag, so the rarer
      the tag the closer the answer creeps to $1/2$; strip the tag off entirely
      and it drops back to $1/3$.
    summary: >
      "At least one boy, born on a Tuesday" gives $13/27$ — strictly between the
      $1/3$ of a bare boy and the $1/2$ of a uniquely identified one.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.boy-girl
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.conditioning-fineness
    kind: intuition
    prominence: 1
    title: "How finely you condition is part of the answer"
    statement: >
      The ladder $1/3 \to 13/27 \to 1/2$ is not three attempts at one number: it
      is three different conditioning events, each correct for its own question.
      Refining the event you condition on moves the answer whenever the
      refinement is not independent of the target, and it can move it either
      way — upward here, because the extra detail is easier for a two-boy family
      to satisfy. The working rule is to quote the event alongside the number,
      because a conditional probability is only as well defined as the event
      behind it. Run the ladder the other way, pooling strata instead of
      splitting them, and you reach the coarse-end failure where a comparison
      reverses outright.
    summary: >
      Every conditional probability answers the exact event conditioned on;
      refining or pooling that event legitimately changes the number.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.tuesday-boy
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.airplane-seat
    kind: example
    prominence: 2
    title: "The airplane seat problem"
    statement: >
      A hundred passengers board in order; the first has lost his boarding pass
      and sits uniformly at random, and every later passenger takes their own
      seat if it is free and otherwise a uniformly random free seat. What is the
      chance the last passenger gets seat $100$? The answer is $1/2$. Every
      random choice in the process is made while both seat $1$ and seat $100$
      are still free — if either had gone, the outcome would already be settled
      — and a random chooser is equally likely to take one as the other, so the
      first of those two seats to be occupied is each with probability $1/2$,
      and the last passenger wins exactly when it is seat $1$. First-step check:
      $p_n = 1/n + (1/n)\sum_{k=2}^{n-1} p_{n-k+1}$ with $p_2 = 1/2$ returns
      $1/2$ for every $n$.
    summary: >
      The process ends the first time someone takes seat $1$ or seat $100$, and
      symmetry makes each equally likely to go first — so $1/2$, for any number
      of passengers.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-probability.conditioning.condition-first-step
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.airplane-seat-general
    kind: proposition
    prominence: 0
    title: "Which passengers actually lose their seats"
    statement: >
      Under the same boarding rule with $n$ passengers, passenger $k$ gets their
      own seat with probability $1 - 1/(n-k+2)$ for $2 \le k \le n$. Reason:
      when a displaced passenger $j$ chooses, the free seats are exactly seat
      $1$ together with seats $j+1, \dots, n$, so throughout the chain before
      passenger $k$ boards, seat $1$ and seats $k, \dots, n$ are all still
      available, while a pick numbered below $k$ merely hands the displacement
      to a passenger who has not boarded yet. The chain therefore terminates on
      a uniform draw from those $n-k+2$ special seats, and passenger $k$ loses
      exactly when that draw is seat $k$. So passenger $2$ succeeds with
      probability $1 - 1/n$ and only the last passenger is a coin flip.
    summary: >
      Passenger $k$ keeps their seat with probability $1 - 1/(n-k+2)$: early
      boarders are almost safe, and the $1/2$ is reserved for the last one.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.airplane-seat
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.two-envelopes
    kind: example
    prominence: 1
    title: "The two-envelopes paradox"
    statement: >
      One envelope holds twice the other; yours holds $A$. The tempting
      argument: the other holds $2A$ or $A/2$ with probability $1/2$ each, so
      $\mathbb{E}[B] = (1/2)(2A) + (1/2)(A/2) = (5/4)A$ — switch, and by
      symmetry switch back forever. Two separate things are wrong. Unopened, $A$
      is not a constant: write the pair as $(x, 2x)$ and the tower property
      gives $\mathbb{E}[A] = \mathbb{E}[B] = (3/2)x$ conditional on the pair, the
      $5/4$ having come from letting $A$ mean $x$ in one branch and $2x$ in the
      other. Opened, the step that fails is
      $\Pr(A \text{ is the smaller} \mid A = a) = 1/2$ for every $a$, which
      demands a law flat over an unbounded scale — no such probability
      distribution exists.
    summary: >
      The $5/4$ comes from an amount that quietly changes meaning between the
      two branches, and from a $1/2$-at-every-value prior that cannot be
      normalized.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-probability.conditioning.tower
    relates:
      - id: quant-probability.expectation.st-petersburg
        note: >
          Both are what an unbounded payoff scale does to naive expected-value
          reasoning: there the mean is infinite and the price is not, here the
          prior that would justify switching cannot be normalized at all.
    tags: []

  - id: quant-puzzles.prob-paradoxes.two-envelopes-proper-prior
    kind: proposition
    prominence: 0
    title: "Two envelopes with an honest prior"
    statement: >
      Put a real distribution on it: the pair is $(2^{k}, 2^{k+1})$ with $k$
      uniform on $\{0, \dots, N\}$, and you hold either envelope with
      probability $1/2$. Seeing $a = 2^{j}$ for $1 \le j \le N$, the two
      candidate pairs are equally likely, so switching genuinely gains $25\%$,
      an expected $+2^{j-2}$. But seeing $a = 1$ switching gains $+1$, seeing
      $a = 2^{N+1}$ it loses $2^{N}$, and those two boundary cases carry exactly
      enough weight to cancel every interior gain: the unconditional expected
      gain is
      $\frac{1}{2(N+1)}\left[1 + (2^{N} - 1) - 2^{N}\right] = 0$, as symmetry
      demands. Send $N \to \infty$ and the cancelling term escapes along with
      $\mathbb{E}[A]$, which is the entire trick.
    summary: >
      With a genuine prior, switching is favourable at most observed amounts and
      ruinous at the largest one, and the two cancel to exactly zero expected
      gain.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.two-envelopes
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.simpson
    kind: example
    prominence: 1
    title: "Simpson's paradox"
    statement: >
      Two traders, two market regimes, hit rates. Trader A wins $9$ of $10$
      quiet-market trades ($90\%$) and $30$ of $100$ volatile trades ($30\%$),
      for $39/110 \approx 35\%$ overall. Trader B wins $85$ of $100$ quiet
      trades ($85\%$) and $2$ of $10$ volatile trades ($20\%$), for
      $87/110 \approx 79\%$ overall. A beats B in both regimes and loses the
      pooled comparison badly. Nothing is inconsistent: a pooled rate is a
      weighted average of the regime rates, and A took $91\%$ of his trades in
      the regime where everybody does badly. Reversal is available whenever the
      gap between the strata exceeds the gaps within them and the two mixes lean
      in opposite directions.
    summary: >
      A hits $90\%$ against $85\%$ in quiet markets and $30\%$ against $20\%$ in
      volatile ones, yet loses $35\%$ to $79\%$ pooled — the mix, not the skill,
      drives the headline.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.conditioning-fineness
    relates:
      - id: quant-probability.conditional.simpson-warning
        note: >
          That node derives the warning from the law of total probability —
          pooled rates are weighted averages — and this is the reversal it
          promises, with the weights chosen to make the flip happen.
    tags: []

  - id: quant-puzzles.prob-paradoxes.simpson-pnl
    kind: intuition
    prominence: 1
    title: "Aggregation traps in PnL attribution"
    statement: >
      The reversal is not a curiosity in trading research; it is the default
      failure mode of any pooled statistic. Blended fill quality flatters a desk
      that trades mostly liquid names; an aggregate Sharpe can beat a rival's
      while losing in every single year, sector and volatility bucket; a
      backtest can improve because the sample mix shifted rather than the edge.
      Two habits protect you. Report every comparison stratified by the
      variables that drive the base rate, and decide before pooling whether the
      grouping is a confounder you must control for or a consequence of the very
      decision you are evaluating — controlling for the latter deletes the
      effect you were trying to measure.
    summary: >
      Never compare two pooled numbers whose mixes differ; stratify first, and
      ask whether the stratifier is a confounder or part of the effect itself.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.simpson
    relates: []
    tags: []

  - id: quant-puzzles.prob-paradoxes.sleeping-beauty
    kind: example
    prominence: 0
    title: "Sleeping Beauty"
    statement: >
      On Sunday a fair coin is tossed. On heads Beauty is woken once, on Monday;
      on tails she is woken on Monday and again on Tuesday with her memory of
      Monday erased. Woken, what should her credence in heads be? Halfers say
      $1/2$, since she learned nothing she had not foreseen. Thirders say $1/3$,
      since there are three equally frequent awakenings and one of them follows
      heads. Both compute correctly, on different sample spaces — one of coin
      tosses, one of awakenings. Turning it into a bet kills the ambiguity: paid
      once per awakening, a heads ticket is worth $1/3$; paid once per
      experiment, it is worth $1/2$. The lesson is this file's: name the
      sampling unit.
    summary: >
      $1/2$ per coin toss and $1/3$ per awakening — the puzzle never says which
      sample space, and only a stated betting rule settles it.
    parent: quant-puzzles.prob-paradoxes
    also_under: []
    requires:
      - quant-puzzles.prob-paradoxes.protocol-matters
    relates: []
    tags: []
