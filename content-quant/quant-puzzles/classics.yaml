  - id: quant-puzzles.classics.guarantee-vs-average
    kind: intuition
    prominence: 1
    title: "Guarantees versus averages"
    statement: >
      Two different questions hide behind "how many": a guarantee ("three
      weighings always suffice, whatever the coins do") and an average ("the
      prisoners escape about $31\%$ of the time"). Decide which one is being
      asked before computing, and say so out loud. A guarantee answer has two
      halves and both must be supplied — a lower bound showing that fewer cannot
      work, usually by counting the outcomes a procedure can distinguish, and an
      explicit scheme that meets the bound. Worst-case thinking means assuming an
      adversary picks the hidden configuration after seeing your deterministic
      plan, so a scheme that is usually fast but occasionally slow scores at its
      slowest branch. An average answer instead needs a stated distribution, and
      is worthless without one.
    summary: >
      Interview puzzles ask either for a worst-case guarantee (bound plus
      matching scheme, adversary chooses) or for an expectation (distribution
      required) — never mix the two.
    parent: quant-puzzles.classics
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-puzzles.classics.coin-weighing
    kind: example
    prominence: 2
    title: "Twelve coins in three weighings"
    statement: >
      Twelve coins, one counterfeit of unknown direction, a two-pan balance,
      three weighings. Bound first: the answer is one of $24$ possibilities
      (which coin, heavy or light), three weighings give at most $3^{3} = 27$
      outcomes and two give only $9$, so three is the first plausible number.
      Scheme: weigh $\{1,2,3,4\}$ against $\{5,6,7,8\}$. If they balance the fake
      lies in $\{9,10,11,12\}$; weigh $\{9,10,11\}$ against three known-good
      coins, which reveals the direction and narrows to three (or names $12$,
      then settled against a good coin), and $9$ versus $10$ finishes. If the
      left pan falls, either one of $1$–$4$ is heavy or one of $5$–$8$ is light;
      weigh $\{1,2,5\}$ against $\{3,4,6\}$. Balanced leaves $7,8$ light, so $7$
      versus $8$ finishes; left heavy leaves $1$ or $2$ heavy or $6$ light,
      settled by $1$ versus $2$; right heavy is the mirror image.
    summary: >
      Three weighings suffice for twelve coins because $3^{3} = 27$ beats the
      $24$ answers — and the scheme that achieves it splits $4$–$4$, then
      reshuffles suspects across the pans.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.guarantee-vs-average
      - quant-puzzles.strategies.info-lower-bound
    relates: []
    tags: []

  - id: quant-puzzles.classics.coin-weighing-scaling
    kind: proposition
    prominence: 0
    title: "How many coins n weighings can handle"
    statement: >
      With $n$ weighings and nothing but the suspect coins, the largest pile in
      which a single counterfeit of unknown direction can always be found and
      labelled heavy or light is $(3^{n}-3)/2$: twelve coins for $n = 3$,
      thirty-nine for $n = 4$. The deficit of $3$ is real accounting — the pans
      must hold equally many coins, and the all-balanced outcome sequence carries
      no direction information. With thirteen coins and three weighings you can
      still name the fake but not always its direction, and one extra
      known-genuine coin to pad a pan restores full identification for
      $(3^{n}-1)/2 = 13$. Adaptivity is not needed: assign each coin a fixed
      three-letter code over left, right and off, and read the three tilts as one
      base-$3$ symbol.
    summary: >
      The information bound is essentially tight — $(3^{n}-3)/2$ coins, or
      $(3^{n}-1)/2$ with a reference coin — and a non-adaptive code achieves it.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.coin-weighing
    relates: []
    tags: []

  - id: quant-puzzles.classics.mislabeled-jars
    kind: example
    prominence: 0
    title: "Three mislabeled jars"
    statement: >
      Three jars hold apples, oranges, and a mix; the labels read "apples",
      "oranges", "mixed", and every one of them is wrong. How many fruits must
      you draw, blind, to relabel all three correctly? One, and it must come from
      the jar labelled "mixed". That jar is not mixed, so the single fruit names
      it outright — draw an apple and it is the apple jar. The jar labelled
      "apples" is then not apples and cannot be mixed either, because that would
      force the jar labelled "oranges" to hold oranges and make a label right; so
      it is oranges and the last jar is mixed. Zero draws cannot work: with all
      labels wrong there are exactly two consistent assignments, the two
      derangements of three objects. Drawing from a differently labelled jar can
      also fail — an orange from the "apples" jar leaves it either oranges or
      mixed.
    summary: >
      One fruit from the jar labelled "mixed" pins every label, because the
      all-wrong constraint leaves only two possibilities and that draw separates
      them.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.guarantee-vs-average
    relates: []
    tags: []

  - id: quant-puzzles.classics.egg-drop
    kind: example
    prominence: 2
    title: "Two eggs, one hundred floors"
    statement: >
      Two identical eggs and a $100$-storey building with a threshold floor above
      which an egg breaks; find the threshold, minimizing drops in the worst
      case. Once the first egg breaks the second must sweep the untested floors
      below it one at a time, so a first-egg jump of $s$ floors costs $s$ drops
      in the worst case. Work backwards from a budget of $n$: the first drop can
      be no higher than floor $n$, and after each surviving drop one unit of
      budget is spent, so the jumps must shrink by one each time and the total
      height reachable is $n + (n-1) + \dots + 1 = n(n+1)/2$. Solving
      $n(n+1)/2 \ge 100$ gives $n = 14$, since $14 \cdot 15/2 = 105$ while $13$
      reaches only $91$. Drop from $14, 27, 39, 50, 60, 69, 77, 84, 90, 95, 99,
      100$: a break at floor $14$ costs $13$ more drops, and no branch exceeds
      $14$ in total.
    summary: >
      Fourteen drops, from a ladder of decreasing steps $14, 13, 12, \dots$
      chosen so that every break leaves exactly enough budget to sweep the floors
      below.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.guarantee-vs-average
      - quant-puzzles.strategies.working-backwards
    relates: []
    tags: []

  - id: quant-puzzles.classics.phase-scheduling
    kind: technique
    prominence: 1
    title: "Optimize the rate, not the sequence"
    statement: >
      Reach for this when a puzzle asks for the minimum total time or cost of a
      sequence of moves. Do not search over sequences; find the rate. Cut the
      plan into phases inside which the marginal cost per unit of progress is
      constant, count the units in each phase, and let the only free choices be
      the phase boundaries. A rope lit at one end consumes itself at one rate and
      at two ends at double that rate; a torch party crosses at the pace of the
      slower member of each pair, so the question is only how often each slow
      member is paid for; a camel ferrying bananas spends $5$, then $3$, then $1$
      banana per mile as the number of round trips falls. Listing the rates turns
      the optimization into a one-line comparison and simultaneously proves the
      lower bound, since no schedule beats the best rate available in each phase.
    summary: >
      Minimum-time puzzles are solved by splitting the plan into constant-rate
      phases and optimizing the boundaries — which also supplies the matching
      lower bound.
    parent: quant-puzzles.classics
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-puzzles.classics.bridge-crossing
    kind: example
    prominence: 1
    title: "Bridge crossing in 17 minutes"
    statement: >
      Four people must cross a bridge at night with one torch; the bridge holds
      at most two, a pair moves at the slower one's pace, and the torch must be
      carried back. Crossing times are $1, 2, 5, 10$ minutes. The greedy plan of
      letting the fastest ferry everyone costs $2 + 1 + 5 + 1 + 10 = 19$, because
      the $5$ and the $10$ are each paid separately. The insight is to pay them
      together, once: $1$ and $2$ cross ($2$), $1$ returns ($1$), $5$ and $10$
      cross ($10$), $2$ returns ($2$), $1$ and $2$ cross ($2$), for a total of
      $17$ minutes. Optimality: exactly one crossing must carry the $10$, and it
      either carries the $5$ as well or does not; the second structure forces the
      $5$ into its own crossing and cannot beat $19$. Hence $17$ is the minimum.
    summary: >
      Send the two slowest together and let the two fastest shuttle the torch —
      $17$ minutes, against $19$ for the natural greedy plan.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.phase-scheduling
    relates:
      - id: quant-puzzles.strategies.extremal
        note: >
          The extremal principle chooses the move here: look first at the two
          slowest people and ask how to pay for them once instead of twice.
    tags: []

  - id: quant-puzzles.classics.camel-bananas
    kind: example
    prominence: 0
    title: "Camel and bananas"
    statement: >
      A camel must move $3000$ bananas $1000$ miles; it carries at most $1000$ at
      a time and eats one banana per mile travelled, in either direction. Moving
      the whole stock one mile forward needs $\lceil \text{stock}/1000 \rceil$
      loaded trips and one fewer return, so the cost is $5$ bananas per mile
      while the stock exceeds $2000$, $3$ per mile between $1000$ and $2000$, and
      $1$ per mile below. Phase 1: burn $1000$ bananas at $5$ per mile, covering
      $200$ miles and arriving with $2000$. Phase 2: burn $1000$ at $3$ per mile,
      covering another $333\tfrac{1}{3}$ miles to reach mile $533\tfrac{1}{3}$
      with $1000$ bananas — a single load. Phase 3: walk the remaining
      $466\tfrac{2}{3}$ miles at $1$ per mile. Delivered: $533$ bananas.
    summary: >
      $533$ bananas arrive, because the cost per mile drops from $5$ to $3$ to
      $1$ exactly as the stock passes each $1000$-banana boundary.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.phase-scheduling
    relates: []
    tags: []

  - id: quant-puzzles.classics.fuses
    kind: example
    prominence: 1
    title: "Forty-five minutes from two fuses"
    statement: >
      Two fuses, each burning for exactly $60$ minutes end to end but at a wildly
      uneven rate along its length, and a box of matches: measure $45$ minutes.
      Lighting a fuse at both ends consumes it in exactly $30$ minutes whatever
      the rate profile, because the two flames between them cover the whole
      length, and by symmetry they meet when half the total burn time has passed.
      So light fuse A at both ends and fuse B at one end at time $0$. When A dies
      it is $t = 30$, and B has exactly $30$ minutes of fuse left; light B's far
      end now and it dies $15$ minutes later, at $t = 45$. The non-uniform
      burning is the whole point: cutting a fuse in half measures nothing, and
      only the both-ends trick converts an unknown profile into a known time.
    summary: >
      Light one fuse at both ends and the other at one end: $30$ minutes, then
      both ends of the remainder for $15$ more — $45$ minutes without ever
      knowing the burn rate.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.phase-scheduling
    relates: []
    tags: []

  - id: quant-puzzles.classics.protocol-design
    kind: technique
    prominence: 1
    title: "Designing a protocol under no communication"
    statement: >
      The prisoner puzzles share one shape: the players agree a strategy in
      advance, are then separated, and each must act on a private observation
      with no further communication. The strategy is therefore a fixed function
      from private view to action, chosen before any randomness is revealed. The
      design goal is almost never to make each individual more likely to be right
      — it is to make the mistakes line up, concentrating all the failure mass
      into a few scenarios instead of letting it spread independently. A hundred
      prisoners guessing independently succeed with probability $2^{-100}$; a
      shared public statistic — the parity of what you can see, one designated
      counter, the cycle you happen to stand in — leaves each person's individual
      accuracy untouched yet lifts the joint success to $31\%$, or to a
      certainty for all but one player.
    summary: >
      Pre-agreed protocols win by correlating errors, not by improving anyone's
      individual odds: build every action off one shared public statistic.
    parent: quant-puzzles.classics
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-puzzles.classics.hat-parity
    kind: example
    prominence: 1
    title: "Hats in a line: one bit saves n−1"
    statement: >
      $n$ prisoners stand in a line, each wearing a black or white hat and seeing
      only the hats ahead; starting from the back, each says one colour word, and
      a wrong word is fatal. Guarantee $n-1$ survivors: the rearmost prisoner
      says "black" if he sees an odd number of black hats ahead and "white"
      otherwise, spending his own life on a coin flip in order to publish one bit
      — the parity of the hats he can see. The next prisoner sees all hats ahead
      of him, knows the announced parity, and takes his own hat to be whatever
      restores it. Each later prisoner does the same, correcting for the (correct)
      colours already called behind him. All $n-1$ live with certainty and the
      announcer survives with probability $1/2$, so the expected number saved is
      $n - 1/2$.
    summary: >
      One published parity bit saves everyone but the announcer, who is a coin
      flip — the cleanest example of buying correlation with one player's odds.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.protocol-design
      - quant-puzzles.strategies.parity
    relates: []
    tags: []

  - id: quant-puzzles.classics.hat-mod-n
    kind: example
    prominence: 0
    title: "Simultaneous hats: sum mod n"
    statement: >
      The simultaneous version with $n$ colours labelled $0, 1, \dots, n-1$: each
      of $n$ prisoners sees everyone else's hat and writes a guess at the same
      instant, with no ordering and no information from anyone else. Guarantee
      that at least one guess is right. Protocol: prisoner $i$ assumes that the
      total $\sum_j h_j \equiv i \pmod n$ and writes the value of his own hat
      that this forces, $g_i \equiv i - \sum_{j \ne i} h_j \pmod n$. The true
      total has exactly one residue $r$, so prisoner $r$ is right — and only he
      is, so exactly one prisoner is correct in every configuration. Each guess
      taken alone is right with probability $1/n$, exactly as a blind guess would
      be; the protocol adds nothing to individual accuracy and instead makes the
      $n$ errors mutually exclusive.
    summary: >
      Prisoner $i$ bets the hat total is $i$ modulo $n$, so exactly one prisoner
      is right — a guarantee assembled from $n$ guesses that are individually no
      better than chance.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.hat-parity
    relates: []
    tags: []

  - id: quant-puzzles.classics.light-bulb
    kind: example
    prominence: 1
    title: "Prisoners and the light bulb"
    statement: >
      One hundred prisoners are called into a room one at a time, in a uniformly
      random order with repetition (say one visit a day, forever); the room holds
      a lamp, known to start off, that only they may switch. Any prisoner may
      declare that all hundred have visited: correct and all go free, wrong and
      all die. Protocol: designate one counter. Each of the other $99$ turns the
      lamp on the first time he finds it off, and never touches it again; the
      counter turns it off whenever he finds it on, adding one, and declares at
      $99$. Correctness is exact — each non-counter contributes exactly one
      on-switch. Timing: with $j$ prisoners still to signal, the wait for an
      on-switch is $100/j$ days and the wait for the counter to clear it is
      $100$, so the expected duration is $9900 + 100 H_{99} \approx 10418$ days,
      about $28$ years.
    summary: >
      A single counter and a one-shot signal per prisoner make the count exact;
      the price is roughly $10418$ days, dominated by the $99$ waits for the
      counter to return.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.protocol-design
    relates:
      - id: quant-probability.discrete.coupon-collector
        note: >
          The waiting time has the coupon-collector shape, a harmonic sum over
          the prisoners still to be collected, with one extra fixed wait per
          collection while the counter comes back.
    tags: []

  - id: quant-puzzles.classics.prisoners-boxes
    kind: example
    prominence: 2
    title: "100 prisoners and 100 boxes"
    statement: >
      Boxes $1$ through $100$ hold the prisoners' names in a uniformly random
      order. Each prisoner may open $50$ boxes; all hundred must find their own
      name or everyone dies, and no communication is allowed once the search
      starts. Independent random searching succeeds with probability $2^{-100}$.
      Cycle-following instead: prisoner $i$ opens box $i$, then the box numbered
      by the name he finds, and repeats — he is walking the cycle of the
      permutation containing $i$, so he finds his name within $50$ opens exactly
      when that cycle has length $\le 50$. Everyone succeeds if and only if the
      permutation has no cycle longer than $50$. At most one such cycle can
      exist, and for each $k > 50$ exactly $100!/k$ permutations contain a
      $k$-cycle, so failure has probability
      $\sum_{k=51}^{100} 1/k = H_{100} - H_{50} \approx 0.688$: they live with
      probability $\approx 0.312$.
    summary: >
      Follow the permutation's cycles and the hundred prisoners escape about
      $31\%$ of the time instead of $2^{-100}$ — the failure event is simply "a
      cycle longer than 50 exists".
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.protocol-design
      - quant-probability.counting.permutation-cycles
    relates:
      - id: quant-tools.series-calculus.harmonic-numbers
        note: >
          The escape probability is a tail of the harmonic series,
          $1 - (H_{100} - H_{50})$, which is exactly why the answer sits near
          $1 - \ln 2$ and hardly moves with the number of prisoners.
    tags: []

  - id: quant-puzzles.classics.prisoners-boxes-optimality
    kind: proposition
    prominence: 0
    title: "Why 31% does not decay, and cannot be beaten"
    statement: >
      Two follow-ups the interviewer will ask. First, the answer is stable in the
      size of the problem: with $2n$ prisoners each opening $n$ boxes the success
      probability is $1 - (H_{2n} - H_n) \to 1 - \ln 2 \approx 0.3069$, so a
      million prisoners still escape roughly $31\%$ of the time — the naive
      $2^{-2n}$ collapses while this does not. Second, cycle-following is
      optimal: no strategy, deterministic or randomized, achieves a higher
      success probability (Curtin and Warshauer, 2006). Note what the strategy
      does not do — each individual prisoner still opens $50$ of $100$ boxes and
      still finds his own name with probability exactly $1/2$. All it changes is
      the dependence, piling every failure onto the single event that a long
      cycle exists.
    summary: >
      The escape probability tends to $1 - \ln 2 \approx 30.7\%$ at any scale and
      is provably optimal, while each prisoner's individual chance stays at
      $1/2$.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.prisoners-boxes
    relates: []
    tags: []

  - id: quant-puzzles.classics.ants-stick
    kind: example
    prominence: 1
    title: "Ants on a stick"
    statement: >
      Any number of ants sit at arbitrary points on a stick $100$ cm long, each
      facing left or right; all walk at $1$ cm/s, two ants meeting head-on both
      reverse instantly, and an ant reaching an end falls off. How long until the
      stick is clear, in the worst case? Relabel at every collision: two ants
      that bounce off each other are indistinguishable from two ants that pass
      through each other and swap names, since they are identical and travel at
      the same speed. Under the pass-through picture each phantom ant walks in a
      straight line and leaves within $100$ seconds, and the set of occupied
      positions is identical in the two pictures, so the real stick is also clear
      by $t = 100$ s. The bound is attained by one ant at an end walking the full
      length. The answer does not depend on how many ants there are or where they
      start.
    summary: >
      Collisions are only relabelings, so every ant is off within $100$ seconds
      — the length of the stick divided by the speed, whatever the configuration.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.guarantee-vs-average
      - quant-puzzles.strategies.symmetry-strategy
    relates: []
    tags: []

  - id: quant-puzzles.classics.chameleons
    kind: example
    prominence: 1
    title: "Chameleons: 13, 15, 17"
    statement: >
      An island holds $13$ red, $15$ green and $17$ blue chameleons; whenever two
      of different colours meet, both take on the third colour. Can they all
      become one colour? A meeting of a red and a green sends the counts
      $(r, g, b)$ to $(r-1, g-1, b+2)$, so every pairwise difference changes by
      $0$ or $\pm 3$: all three differences are invariant modulo $3$, whichever
      pair meets. A monochrome island has two counts equal to zero, hence a
      difference $\equiv 0 \pmod 3$. But $13, 15, 17$ are $1, 0, 2$ modulo $3$,
      all distinct, so no difference is divisible by $3$ and no monochrome state
      is reachable — the answer is no, and the invariant is a proof, not
      evidence. Change the counts to $13, 15, 18$ and green and blue agree modulo
      $3$; the obstruction vanishes and an all-red island is genuinely
      attainable.
    summary: >
      No: the pairwise differences of the colour counts are fixed modulo $3$, and
      $13, 15, 17$ are pairwise incongruent, so two counts can never both hit
      zero.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.strategies.invariant
    relates: []
    tags: []

  - id: quant-puzzles.classics.water-jugs
    kind: example
    prominence: 1
    title: "Water jugs and the gcd"
    statement: >
      The same certificate logic as the chameleons, with the invariant now
      arithmetic. Given unmarked $3$- and $5$-gallon jugs, a tap and a drain,
      measure exactly $4$ gallons. Every legal move — fill a jug, empty a jug,
      pour until the source empties or the target fills — leaves both contents
      integer combinations $3a + 5b$, so the reachable amounts are exactly the
      multiples of $\gcd(3,5) = 1$ up to $5$. There is no obstruction, and
      Bézout's identity says how: $4 = 2 \cdot 5 - 2 \cdot 3$, meaning fill the
      $5$ twice and pour off two $3$-jug loads. Concretely: fill the $5$, pour
      into the $3$ (leaving $2$), empty the $3$, move the $2$ across, fill the
      $5$, and top up the $3$ with $1$ — the big jug now holds $4$. The invariant
      bites when it should: $6$- and $8$-gallon jugs have $\gcd = 2$ and can
      never produce $3$.
    summary: >
      Reachable amounts are the multiples of $\gcd(a,b)$, so $3$ and $5$ give
      every whole number up to $5$ — six moves for the $4$ gallons — while $6$
      and $8$ can never measure an odd amount.
    parent: quant-puzzles.classics
    also_under: []
    requires:
      - quant-puzzles.classics.chameleons
    relates: []
    tags: []
