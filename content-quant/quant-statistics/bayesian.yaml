# quant-statistics.bayesian — Bayesian Inference
# Outline node (30 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-statistics.bayesian
    kind: subbranch
    title: "Bayesian Inference"
    summary: >
      Priors updated by likelihoods — beta–binomial coin flipping,
      normal–normal shrinkage, and betting on posteriors.
    parent: quant-statistics
    also_under: []
    tags: []

  - id: quant-statistics.bayesian.parameter-as-random
    kind: definition
    prominence: 1
    title: "The Bayesian stance: parameters carry distributions"
    statement: >
      In the Bayesian framework the unknown parameter $\theta$ is itself a random
      variable, and a prior distribution $\pi(\theta)$ records what you believe
      before seeing data. Probability here measures degree of belief rather than
      long-run frequency, so $\Pr(\theta \in [0.4, 0.6]) = 0.9$ is a legitimate
      sentence; a frequentist may attach probability only to the data-generating
      procedure, never to a fixed parameter. The prior must be a genuine
      distribution over the parameter space — a density on $[0,1]$ for a coin
      bias, a density on $\mathbb{R}$ for an unknown mean. Interview framing:
      "what's your prior?" asks for a centre and a spread, not a philosophy.
    summary: >
      Treat the unknown as random and put a distribution on it — that single move
      is what separates Bayesian from frequentist inference.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-probability.conditional.bayes
    relates: []
    tags: []

  - id: quant-statistics.bayesian.likelihood
    kind: definition
    prominence: 1
    title: "The likelihood function"
    statement: >
      The likelihood is the sampling model $p(x \mid \theta)$ read as a function
      of $\theta$ with the observed data $x$ held fixed: $L(\theta) = p(x \mid
      \theta)$. It is not a distribution over $\theta$ — it need not integrate to
      $1$ — and any factor free of $\theta$ may be discarded, since only relative
      values matter. For $k$ heads in $n$ independent tosses of a coin of bias
      $p$, $L(p) = \binom{n}{k} p^{k}(1-p)^{n-k}$, and the binomial coefficient
      is exactly such a droppable constant, leaving the kernel
      $p^{k}(1-p)^{n-k}$. Conditionally independent observations multiply their
      likelihoods, so log-likelihoods add.
    summary: >
      The probability of the data seen as a function of the parameter — a shape,
      not a distribution, with constants free to be thrown away.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.parameter-as-random
    relates:
      - id: quant-statistics.estimation.mle
        note: >
          Maximum likelihood maximizes exactly this function; the MLE is the
          posterior mode under a flat prior, which is why the Bayesian and
          frequentist point estimates converge once the data swamps the prior.
    tags: []

  - id: quant-statistics.bayesian.posterior
    kind: technique
    prominence: 2
    title: "The update: posterior is proportional to prior times likelihood"
    statement: >
      Bayes' theorem for a parameter reads $\pi(\theta \mid x) = p(x \mid
      \theta)\,\pi(\theta)/p(x)$, where the marginal likelihood $p(x) = \int p(x
      \mid \theta)\pi(\theta)\,d\theta$ does not depend on $\theta$ and can be
      dropped: $\pi(\theta \mid x) \propto \pi(\theta)\,L(\theta)$. The working
      recipe is five steps — (1) state the prior; (2) write the likelihood
      kernel; (3) multiply and collect powers; (4) recognize the result as a
      named density and read off its normalizer instead of integrating;
      (5) report the posterior mean and standard deviation, which is what the
      question is really asking for. Almost every Bayesian interview problem is
      steps (3) and (4).
    summary: >
      Multiply prior by likelihood, ignore the constant, and recognize the
      resulting shape — the whole of practical Bayesian updating.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.likelihood
    relates: []
    tags: []

  - id: quant-statistics.bayesian.posterior-odds
    kind: proposition
    prominence: 1
    title: "Odds form and the Bayes factor"
    statement: >
      For two hypotheses the normalizing constant cancels in the ratio:
      $\Pr(H_1 \mid x)/\Pr(H_0 \mid x) = [\Pr(H_1)/\Pr(H_0)] \cdot [p(x \mid
      H_1)/p(x \mid H_0)]$. The first factor is the prior odds, the second is the
      Bayes factor. Conditionally independent pieces of evidence multiply their
      Bayes factors, so log-odds accumulate additively — the only form of Bayes
      you can run in your head across many observations. Worked: prior odds
      $1$ to $9$ that a coin is two-headed; it lands heads $5$ times in a row;
      the Bayes factor is $1/(1/2)^{5} = 32$, so the posterior odds are $32$ to
      $9$, a probability of $32/41 \approx 0.78$.
    summary: >
      Posterior odds equal prior odds times the likelihood ratio, so evidence
      adds up on the log-odds scale.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.posterior
      - quant-probability.conditional.bayes-odds
    relates: []
    tags: []

  - id: quant-statistics.bayesian.sequential-updating
    kind: proposition
    prominence: 1
    title: "Today's posterior is tomorrow's prior"
    statement: >
      If $x_1$ and $x_2$ are conditionally independent given $\theta$, then
      updating on $x_1$ and using the result as the prior for $x_2$ gives exactly
      the posterior you would get from $(x_1, x_2)$ at once: both are
      proportional to $\pi(\theta)\,p(x_1 \mid \theta)\,p(x_2 \mid \theta)$. Two
      consequences worth stating out loud: the order in which conditionally
      independent evidence arrives is irrelevant, and the current posterior is a
      sufficient summary, so the raw data need never be stored. This is the
      formal content of "move your market after every fill" — each trade against
      your quote is one more likelihood factor multiplied into your view of fair
      value.
    summary: >
      Updating in batches or one observation at a time gives the same answer, and
      the running posterior is all you ever need to keep.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.posterior
    relates: []
    tags: []

  - id: quant-statistics.bayesian.conjugate
    kind: definition
    prominence: 1
    title: "Conjugate priors"
    statement: >
      A family of priors is conjugate to a likelihood when the posterior stays in
      that family, so updating moves parameters instead of changing shape. The
      standard pairs: Beta prior with a Bernoulli or binomial likelihood; Gamma
      prior with a Poisson likelihood; normal prior with a normal likelihood of
      known variance; Gamma prior on the precision of a normal. In each case the
      update is bookkeeping — add successes and failures, add counts and
      exposure, add precisions. The prior parameters then read as
      pseudo-observations: a $\mathrm{Beta}(a,b)$ prior is worth $a+b$ imaginary
      tosses of which $a$ came up heads. Conjugacy earns its place at an
      interview by turning an integral into arithmetic you can say aloud.
    summary: >
      Prior families that survive their own likelihood, so Bayes' theorem reduces
      to adding counts to the prior's parameters.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.posterior
    relates: []
    tags: []

  - id: quant-statistics.bayesian.beta-prior
    kind: definition
    prominence: 1
    title: "Beta prior for an unknown probability"
    statement: >
      $\mathrm{Beta}(a,b)$ with $a, b > 0$ has density $f(p) =
      p^{a-1}(1-p)^{b-1}/B(a,b)$ on $[0,1]$, mean $a/(a+b)$, variance
      $ab/((a+b)^{2}(a+b+1))$, and mode $(a-1)/(a+b-2)$ when $a, b > 1$. It is
      the default prior for a coin bias, a fill probability, or any unknown
      chance. Special cases: $\mathrm{Beta}(1,1)$ is uniform; holding the ratio
      fixed while raising $a+b$ tightens the prior; $\mathrm{Beta}(1/2,1/2)$ is
      the U-shaped Jeffreys prior. Choose $a$ and $b$ by fixing two numbers you
      can defend — the prior mean $a/(a+b)$, and the pseudo-count $a+b$ saying
      how many tosses your belief is worth.
    summary: >
      The workhorse prior on $[0,1]$, parameterized so that its two numbers read
      as a prior mean and a strength in pseudo-tosses.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.conjugate
      - quant-probability.continuous.beta
    relates: []
    tags: []

  - id: quant-statistics.bayesian.beta-binomial
    kind: example
    prominence: 2
    title: "Beta–binomial updating, worked end to end"
    statement: >
      A coin has unknown bias $p$ with prior $\mathrm{Beta}(a,b)$; you observe
      $k$ heads in $n$ tosses. Multiply the kernels: $p^{a-1}(1-p)^{b-1} \cdot
      p^{k}(1-p)^{n-k} = p^{a+k-1}(1-p)^{b+n-k-1}$, which is the
      $\mathrm{Beta}(a+k,\, b+n-k)$ kernel — add heads to $a$, tails to $b$, and
      no integral is ever done. The posterior mean is $(a+k)/(a+b+n)$.
      Concretely, start from $\mathrm{Beta}(2,2)$ (mean $1/2$, worth four
      pseudo-tosses) and see $8$ heads in $10$ tosses: the posterior is
      $\mathrm{Beta}(10,4)$, with mean $10/14 = 5/7 \approx 0.714$ and standard
      deviation $\sqrt{40/(14^{2} \cdot 15)} \approx 0.117$. The sample
      proportion was $0.8$, and belief lands short of it.
    summary: >
      Beta prior plus $k$ heads in $n$ tosses gives $\mathrm{Beta}(a+k, b+n-k)$;
      $\mathrm{Beta}(2,2)$ with 8 of 10 heads lands at a mean of $5/7$.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.beta-prior
      - quant-probability.discrete.binomial
    relates: []
    tags: []

  - id: quant-statistics.bayesian.posterior-mean-weights
    kind: proposition
    prominence: 1
    title: "The posterior mean interpolates prior mean and MLE"
    statement: >
      Split the beta–binomial posterior mean into two pieces:
      $(a+k)/(a+b+n) = [(a+b)/(a+b+n)] \cdot [a/(a+b)] + [n/(a+b+n)] \cdot
      [k/n]$. It is exactly a weighted average of the prior mean $a/(a+b)$ and
      the sample proportion $k/n$, the weights being proportional to the
      pseudo-count $a+b$ and the real count $n$ and summing to $1$. As $n \to
      \infty$ the data weight tends to $1$, so the posterior mean converges to
      the maximum-likelihood value and the prior washes out; for small $n$ the
      prior dominates. Check on the worked case: weights $4/14$ and $10/14$ give
      $(2/7)(1/2) + (5/7)(4/5) = 1/7 + 4/7 = 5/7$.
    summary: >
      Every beta–binomial answer is a convex combination of what you believed and
      what you saw, weighted by pseudo-count against sample size.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.beta-binomial
    relates: []
    tags: []

  - id: quant-statistics.bayesian.succession
    kind: proposition
    prominence: 1
    title: "Laplace's rule of succession"
    statement: >
      Take a uniform $\mathrm{Beta}(1,1)$ prior on $p$ and observe $k$ successes
      in $n$ conditionally independent trials. The posterior is
      $\mathrm{Beta}(k+1,\, n-k+1)$, and since the chance the next trial succeeds
      is the posterior average of $p$, it equals the posterior mean
      $(k+1)/(n+2)$. The rule exists to kill the degenerate frequentist answers:
      $0$ successes in $5$ gives $1/7$ rather than $0$, and $5$ successes in $5$
      gives $6/7 \approx 0.857$ rather than $1$, while no data at all returns
      $1/2$. Operationally it says: add one imaginary success and one imaginary
      failure to the tally before dividing.
    summary: >
      With a flat prior the next trial succeeds with probability $(k+1)/(n+2)$ —
      never $0$ and never $1$, however lopsided the record.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.posterior-mean-weights
    relates: []
    tags: []

  - id: quant-statistics.bayesian.shrinkage
    kind: intuition
    prominence: 1
    title: "Shrinkage: thin data borrows strength from the prior"
    statement: >
      Every conjugate update has the same shape: the estimate sits strictly
      between the prior guess and the raw sample statistic, pulled toward the
      prior by the fraction (prior weight)/(prior weight + data weight). A trader
      who has been filled on $3$ of $4$ quotes has a raw hit rate of $75\%$, but
      against a $\mathrm{Beta}(10,10)$ prior centred at $50\%$ the posterior mean
      is $13/24 \approx 54\%$ — four real tosses against twenty pseudo-tosses.
      This is why a short track record, of a strategy or of a person, should be
      discounted toward the population average, and why the best number in a thin
      sample usually belongs to the luckiest candidate rather than the best one.
    summary: >
      Small samples get pulled toward the prior, so extreme short-run records
      should be discounted rather than believed.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.posterior-mean-weights
    relates:
      - id: quant-statistics.regression.regression-to-mean
        note: >
          Shrinkage and regression to the mean are one phenomenon seen from two
          sides: an extreme sample statistic is part signal and part noise, so
          the honest forecast of the next observation pulls it back toward the
          centre.
    tags: []

  - id: quant-statistics.bayesian.normal-normal
    kind: example
    prominence: 1
    title: "Normal–normal updating: the precision-weighted mean"
    statement: >
      Let $\theta \sim N(\mu_0, \sigma_0^{2})$ and, given $\theta$, let
      $x_1,\dots,x_n$ be independent $N(\theta, \sigma^{2})$ with $\sigma^{2}$
      known. Calling $1/\text{variance}$ the precision, the posterior is normal
      with precision $1/\sigma_0^{2} + n/\sigma^{2}$ and mean
      $\frac{\mu_0/\sigma_0^{2} + n\bar{x}/\sigma^{2}}{1/\sigma_0^{2} +
      n/\sigma^{2}}$: precisions add, and the centre is the precision-weighted
      average of prior mean and sample mean. Worked: $\mu_0 = 0$, $\sigma_0 = 2$,
      and $n = 4$ observations of $\sigma = 1$ averaging $\bar{x} = 3$. The
      precisions $0.25$ and $4$ sum to $4.25$, so the posterior variance is
      $1/4.25 \approx 0.235$ and the posterior mean is $12/4.25 \approx 2.82$.
    summary: >
      Normal prior plus normal data gives a normal posterior whose precisions add
      and whose mean weights each source by its precision.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.conjugate
      - quant-probability.continuous.normal
    relates: []
    tags: []

  - id: quant-statistics.bayesian.precision-weighting
    kind: technique
    prominence: 1
    title: "Combining independent estimates by precision"
    statement: >
      Reach for this whenever two independent unbiased estimates of the same
      quantity must be merged into one number. If $\hat{\theta}_1$ and
      $\hat{\theta}_2$ have variances $v_1$ and $v_2$, the minimum-variance
      combination is $(\hat{\theta}_1/v_1 + \hat{\theta}_2/v_2)/(1/v_1 + 1/v_2)$,
      and its variance is $1/(1/v_1 + 1/v_2)$, smaller than either input. Weight
      by precision, never equally. Two forecasts with standard deviations $1$ and
      $2$ take weights $4/5$ and $1/5$, and the blend has standard deviation
      $2/\sqrt{5} \approx 0.894$. The same arithmetic blends your own view with a
      market consensus: the more confident source moves the answer further.
    summary: >
      Average estimates with weights proportional to $1/\text{variance}$ — the
      result beats both inputs, and the confident one dominates.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.normal-normal
    relates: []
    tags: []

  - id: quant-statistics.bayesian.posterior-predictive
    kind: definition
    prominence: 0
    title: "Posterior predictive distribution"
    statement: >
      To forecast a new observation $\tilde{x}$ rather than the parameter,
      average the sampling model over the posterior: $p(\tilde{x} \mid x) = \int
      p(\tilde{x} \mid \theta)\,\pi(\theta \mid x)\,d\theta$. It is always wider
      than plugging the posterior mean into the likelihood, because it carries
      parameter uncertainty on top of sampling noise. Beta–binomial: the chance
      the next toss is heads is exactly the posterior mean $(a+k)/(a+b+n)$.
      Normal–normal: one new observation is normal with the posterior mean and
      variance $\sigma_{\mathrm{post}}^{2} + \sigma^{2}$, the two uncertainties
      adding. Quoting a prediction interval straight off the posterior is the
      standard mistake.
    summary: >
      Integrate the likelihood against the posterior to predict the next data
      point, picking up parameter uncertainty as extra width.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.beta-binomial
      - quant-statistics.bayesian.normal-normal
    relates: []
    tags: []

  - id: quant-statistics.bayesian.prior-choice
    kind: technique
    prominence: 0
    title: "Choosing a prior; uniform is not uninformative"
    statement: >
      A flat prior is flat only in the coordinate you happened to write it in: if
      $p$ is uniform on $[0,1]$ then the log-odds $\log(p/(1-p))$ are far from
      uniform, so "no information" is not a reparametrization-invariant notion.
      Working discipline: pick a prior mean you would actually bet on, pick a
      pseudo-count matching how much evidence your belief is worth, then check
      that a plausible alternative prior does not flip the decision — if it does,
      the data is too thin to act on. Jeffreys' $\mathrm{Beta}(1/2,1/2)$ is the
      invariant answer for a proportion. Never assign zero prior mass to a
      possible value: no evidence can revive it.
    summary: >
      Priors are choices to be defended and stress-tested; flatness depends on
      the parameterization, and zero prior mass is permanent.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.beta-prior
    relates: []
    tags: []

  - id: quant-statistics.bayesian.credible-interval
    kind: definition
    prominence: 1
    title: "Credible intervals versus confidence intervals"
    statement: >
      A $95\%$ credible interval is any set holding $95\%$ of the posterior mass
      — conventionally the equal-tailed interval between the $2.5\%$ and
      $97.5\%$ posterior quantiles, or the shortest such set, which is the
      highest-density region. Its reading is the intuitive one: given this prior
      and this data, the parameter lies inside with probability $0.95$. A
      confidence interval says something else entirely — the parameter is fixed
      and the interval is random, and $95\%$ of the intervals the procedure
      generates would cover the truth. The two nearly coincide when the prior is
      weak and $n$ is large, which is why the misreading survives.
    summary: >
      The Bayesian interval really does contain the parameter with the stated
      probability; the frequentist one makes a claim about the procedure instead.
    parent: quant-statistics.bayesian
    also_under: []
    requires:
      - quant-statistics.bayesian.posterior
    relates:
      - id: quant-statistics.testing.ci
        note: >
          That node builds the frequentist interval this one contrasts with: in
          the normal case with a flat prior the endpoints numerically agree, yet
          the probability statement attaches to the interval, not the parameter.
    tags: []
