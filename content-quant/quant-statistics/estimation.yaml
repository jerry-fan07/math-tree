# quant-statistics.estimation — Estimation
# Outline node (27 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-statistics.estimation
    kind: subbranch
    title: "Estimation"
    summary: >
      Estimators judged by bias, variance and MSE — MLE and method of
      moments, the Cramér–Rao floor, and the German tank problem.
    parent: quant-statistics
    also_under: []
    tags: []

  - id: quant-statistics.estimation.estimator
    kind: definition
    prominence: 1
    title: "Estimator, estimate and sampling distribution"
    statement: >
      A statistical model asserts that $X_1,\dots,X_n$ are iid draws from a
      family $\{f(\cdot\,;\theta) : \theta \in \Theta\}$ with $\theta$ unknown.
      A statistic is any function $T(X_1,\dots,X_n)$ of the data alone — it may
      not mention $\theta$ — and an estimator $\hat{\theta} = T(X_1,\dots,X_n)$
      is a statistic used to guess $\theta$. Keep the two words apart: the
      estimator is a random variable, the estimate is the single number it
      returns on the sample in hand. Its law across hypothetical repeated
      samples is the sampling distribution, and the standard deviation of that
      law is the standard error; an estimate quoted without one is a number
      whose noise you have not measured. Everything below is a way of scoring a
      sampling distribution against the truth $\theta$.
    summary: >
      An estimator is a data-only function used to guess a parameter — judge it
      by its sampling distribution, never by the one number it happened to
      produce.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-statistics.estimation.bias-mse
    kind: definition
    prominence: 2
    title: "Bias, variance and mean squared error"
    statement: >
      Let $\hat{\theta}$ estimate $\theta$, with $\mathbb{E}[\hat{\theta}^{2}]$
      finite. Its bias is $\operatorname{bias}(\hat{\theta}) =
      \mathbb{E}[\hat{\theta}] - \theta$, and $\hat{\theta}$ is called unbiased
      when that vanishes for every $\theta \in \Theta$, not merely at one
      convenient value. Its variance $\operatorname{Var}(\hat{\theta})$ records
      how far it moves from sample to sample. The single number that scores it
      is the mean squared error $\operatorname{MSE}(\hat{\theta}) =
      \mathbb{E}[(\hat{\theta} - \theta)^{2}] = \operatorname{Var}(\hat{\theta})
      + \operatorname{bias}(\hat{\theta})^{2}$. All three are functions of the
      unknown $\theta$, so one estimator can win at some $\theta$ and lose at
      others; a uniformly smaller MSE is a real victory and is rarely on offer.
    summary: >
      Bias is systematic error, variance is sample-to-sample noise, and MSE —
      their combination as variance plus squared bias — is the score that
      trades them off.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.estimator
    relates: []
    tags: []

  - id: quant-statistics.estimation.mse-decomp
    kind: proposition
    prominence: 1
    title: "MSE = variance + bias²"
    statement: >
      Write $b = \mathbb{E}[\hat{\theta}] - \theta$ and split the error as
      $\hat{\theta} - \theta = (\hat{\theta} - \mathbb{E}[\hat{\theta}]) + b$.
      Squaring and taking expectations gives
      $\operatorname{Var}(\hat{\theta}) + 2b\,\mathbb{E}[\hat{\theta} -
      \mathbb{E}[\hat{\theta}]] + b^{2}$, and the cross term is $0$ because a
      variable's deviation from its own mean has mean $0$. Hence
      $\operatorname{MSE} = \operatorname{Var} + b^{2}$, assuming only a finite
      second moment — no independence, no model, no normality. Two readings: for
      an unbiased estimator the MSE is exactly the variance, so among unbiased
      estimators the best one is simply the quietest; and an estimator may be
      badly biased yet accurate if it barely moves, or perfectly unbiased yet
      useless if it swings.
    summary: >
      Squared error splits into noise plus systematic offset with no cross term
      — the identity every comparison of estimators is run through.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.bias-mse
    relates: []
    tags: []

  - id: quant-statistics.estimation.unbiased-not-optimal
    kind: intuition
    prominence: 1
    title: "Minimum MSE tolerates bias"
    statement: >
      Unbiasedness is a constraint, not an objective, and insisting on it can
      cost accuracy. Take normal data and the family
      $c\sum_{i}(X_i - \bar{X})^{2}$ of estimators of $\sigma^{2}$: since
      $\sum_{i}(X_i - \bar{X})^{2}$ has the law of $\sigma^{2}\chi^{2}_{n-1}$,
      the MSE is $\sigma^{4}[2c^{2}(n-1) + (c(n-1)-1)^{2}]$, minimized at
      $c = 1/(n+1)$ — a divisor of $n+1$, beating the unbiased $n-1$ and the
      maximum-likelihood $n$ alike. Unbiasedness can also be outright absurd:
      the only unbiased estimator of $e^{-2\lambda}$ from a single
      $\operatorname{Poisson}(\lambda)$ draw $X$ is $(-1)^{X}$, which estimates
      a positive quantity by $\pm 1$. Ask what you are scored on before
      demanding $\mathbb{E}[\hat{\theta}] = \theta$.
    summary: >
      A little bias often buys a lot of variance — the minimum-MSE multiple of
      the sum of squared deviations divides by $n+1$, not by $n-1$.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.mse-decomp
    relates: []
    tags: []

  - id: quant-statistics.estimation.sample-mean-unbiased
    kind: proposition
    prominence: 1
    title: "The sample mean: unbiased, variance σ²/n"
    statement: >
      Let $X_1,\dots,X_n$ be iid with mean $\mu$ and variance
      $\sigma^{2} < \infty$. Then $\mathbb{E}[\bar{X}] = \mu$ by linearity —
      identical means suffice, independence is not needed — while
      $\operatorname{Var}(\bar{X}) = \sigma^{2}/n$ does require the $X_i$ to be
      uncorrelated. So $\bar{X}$ is unbiased with
      $\operatorname{MSE} = \sigma^{2}/n$ and standard error $\sigma/\sqrt{n}$,
      reported in practice as $s/\sqrt{n}$. The square-root law is the usable
      content: halving the standard error costs four times the data, and
      resolving an effect ten times smaller costs a hundred times the sample.
      Positive correlation between observations pushes the variance above
      $\sigma^{2}/n$, which is why overlapping windows and autocorrelated
      returns make a backtest look more precise than it is.
    summary: >
      $\bar{X}$ is unbiased with standard error $\sigma/\sqrt{n}$, so precision
      improves only with the square root of the sample size.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.bias-mse
      - quant-statistics.descriptive.sample-mean
    relates: []
    tags: []

  - id: quant-statistics.estimation.nminus1
    kind: proposition
    prominence: 1
    title: "Why s² divides by n − 1"
    statement: >
      Let $X_1,\dots,X_n$ be iid with variance $\sigma^{2} < \infty$ and
      $n \ge 2$. Then $\mathbb{E}[s^{2}] = \sigma^{2}$ for
      $s^{2} = \frac{1}{n-1}\sum_{i}(X_i - \bar{X})^{2}$, with no normality
      assumed. Proof: $\sum_{i}(X_i - \bar{X})^{2} = \sum_{i} X_i^{2} -
      n\bar{X}^{2}$, whose expectation is
      $n(\sigma^{2}+\mu^{2}) - n(\sigma^{2}/n + \mu^{2}) = (n-1)\sigma^{2}$. The
      $n$-divisor version is biased low by exactly $\sigma^{2}/n$: deviations
      are measured from $\bar{X}$, which sits closer to the data than the true
      $\mu$ does, so fitting the centre from the same sample burns one degree of
      freedom. Caution: $s$ is not unbiased for $\sigma$, since Jensen gives
      $\mathbb{E}[s] < \sigma$ — unbiasedness does not survive nonlinear maps.
    summary: >
      Deviations from the sample mean are systematically too small, and the
      $n-1$ divisor repairs exactly that downward bias.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.sample-mean-unbiased
      - quant-statistics.descriptive.sample-variance
    relates: []
    tags: []

  - id: quant-statistics.estimation.consistency
    kind: definition
    prominence: 1
    title: "Consistency"
    statement: >
      A sequence of estimators $\hat{\theta}_n$ is consistent for $\theta$ if
      $\hat{\theta}_n \to \theta$ in probability: for every $\varepsilon > 0$,
      $\Pr(|\hat{\theta}_n - \theta| > \varepsilon) \to 0$. The sufficient
      condition always used in practice is $\operatorname{MSE}(\hat{\theta}_n)
      \to 0$, that is bias and variance both vanishing, since Chebyshev bounds
      the probability above by $\operatorname{MSE}/\varepsilon^{2}$. The weak law
      is the base case, making $\bar{X}$ consistent for $\mu$. Consistency and
      unbiasedness are independent: $\hat{\theta} = X_1$ is unbiased for $\mu$
      and never consistent, while $\frac{1}{n}\sum_{i}(X_i - \bar{X})^{2}$ is
      biased for $\sigma^{2}$ at every $n$ yet consistent. Consistency is a floor
      rather than a recommendation — it says nothing at the $n$ you actually
      have.
    summary: >
      The estimator concentrates on the truth as data accumulates; vanishing MSE
      is the standard route there, and it is unrelated to unbiasedness.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.mse-decomp
      - quant-probability.limits.wlln
    relates:
      - id: quant-probability.limits.root-n
        note: >
          Consistency says the error eventually vanishes; the $1/\sqrt{n}$ rate
          says how fast, and therefore how many observations an edge of a given
          size costs to establish.
    tags: []

  - id: quant-statistics.estimation.likelihood
    kind: definition
    prominence: 1
    title: "Likelihood and log-likelihood"
    statement: >
      Given observed data $x_1,\dots,x_n$ from a model with density or pmf
      $f(\cdot\,;\theta)$, the likelihood is
      $L(\theta) = \prod_{i=1}^{n} f(x_i;\theta)$ in the iid case, read as a
      function of $\theta$ with the data held fixed. It is not a probability
      distribution over $\theta$ and need not integrate to $1$; only ratios
      $L(\theta_1)/L(\theta_2)$ carry meaning, so any factor free of $\theta$ may
      be discarded. Work instead with the log-likelihood
      $\ell(\theta) = \sum_{i=1}^{n} \log f(x_i;\theta)$, which turns the product
      into a sum, is maximized at the same $\theta$ because $\log$ is strictly
      increasing, and keeps the arithmetic clear of underflow.
    summary: >
      The probability of the data seen as a function of the parameter — a
      ranking of candidate parameter values, not a distribution over them.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.estimator
    relates: []
    tags: []

  - id: quant-statistics.estimation.mle
    kind: technique
    prominence: 2
    title: "Maximum likelihood estimation"
    statement: >
      The recipe: (1) write $\ell(\theta) = \sum_{i} \log f(x_i;\theta)$;
      (2) solve the score equation $\ell'(\theta) = 0$; (3) confirm a maximum by
      $\ell''(\theta) < 0$ or by concavity; (4) check the boundary of $\Theta$
      separately, because step 2 finds interior maxima only. Reach for it
      whenever a parametric model is named and a point estimate is wanted: it is
      the default estimator in practice, being consistent, asymptotically
      efficient, and invariant, in that the MLE of $g(\theta)$ is
      $g(\hat{\theta})$ for any $g$. The costs are real. It is generally biased
      in finite samples — invariance plus Jensen guarantees that for nonlinear
      $g$ — and step 4 is where candidates lose the uniform problem.
    summary: >
      Pick the parameter making the observed data most probable: differentiate
      the log-likelihood, solve, check the second derivative, and never skip the
      boundary.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.likelihood
    relates: []
    tags: []

  - id: quant-statistics.estimation.mle-bernoulli
    kind: example
    prominence: 1
    title: "MLE for a Bernoulli p"
    statement: >
      Observe $n$ iid $\operatorname{Bernoulli}(p)$ trials with $k$ successes.
      Then $L(p) = p^{k}(1-p)^{n-k}$ and
      $\ell(p) = k\log p + (n-k)\log(1-p)$, so
      $\ell'(p) = k/p - (n-k)/(1-p) = 0$ gives the sample proportion
      $\hat{p} = k/n$; $\ell$ is strictly concave on $(0,1)$, so this is the
      global maximum. With $7$ heads in $10$ tosses, $\hat{p} = 0.7$. The
      estimator is unbiased with $\operatorname{Var}(\hat{p}) = p(1-p)/n$, so its
      standard error never exceeds $1/(2\sqrt{n})$, the worst case being
      $p = 1/2$. Edge case: $k = 0$ or $k = n$ drives the maximum to the
      boundary and returns $\hat{p} = 0$ or $1$ — an absolute claim from thin
      data, which is why $(k+1)/(n+2)$ is often substituted there.
    summary: >
      The likelihood picks the obvious answer, the observed success rate $k/n$;
      the only trap is the boundary case of zero or $n$ successes.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.mle
      - quant-probability.discrete.bernoulli
    relates: []
    tags: []

  - id: quant-statistics.estimation.mle-normal
    kind: example
    prominence: 1
    title: "MLE for a normal mean and variance"
    statement: >
      For $X_1,\dots,X_n$ iid $N(\mu,\sigma^{2})$ with both parameters unknown,
      $\ell(\mu,\sigma^{2}) = -\frac{n}{2}\log(2\pi\sigma^{2}) -
      \frac{1}{2\sigma^{2}}\sum_{i}(x_i-\mu)^{2}$. Differentiating in $\mu$ gives
      $\hat{\mu} = \bar{x}$ whatever $\sigma^{2}$ is; substituting that back and
      differentiating in $\sigma^{2}$ gives
      $\hat{\sigma}^{2} = \frac{1}{n}\sum_{i}(x_i - \bar{x})^{2}$, the divisor
      being $n$ and not $n-1$. The MLE of the variance is therefore biased low by
      $\sigma^{2}/n$, equal to $\frac{n-1}{n}s^{2}$; it is consistent all the
      same, and on normal data its MSE is in fact smaller than that of $s^{2}$.
      Maximum likelihood optimizes fit, not unbiasedness — the cleanest example
      of the two coming apart.
    summary: >
      $\hat{\mu} = \bar{x}$, and $\hat{\sigma}^{2}$ with divisor $n$ — maximum
      likelihood hands you the biased variance estimate on purpose.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.mle
      - quant-statistics.estimation.nminus1
      - quant-probability.continuous.normal
    relates: []
    tags: []

  - id: quant-statistics.estimation.mle-uniform
    kind: example
    prominence: 1
    title: "MLE for a uniform θ is the sample maximum"
    statement: >
      Let $X_1,\dots,X_n$ be iid $\operatorname{Uniform}(0,\theta)$. Then
      $L(\theta) = \theta^{-n}$ for $\theta \ge \max_{i} x_i$ and $0$ otherwise,
      so the likelihood jumps up at $\theta = \max_{i} x_i$ and decays after it:
      the maximum is found by inspection, not by a derivative, and the MLE is the
      sample maximum $\hat{\theta} = X_{(n)}$. It is biased low of necessity,
      since it can never exceed $\theta$. From $\Pr(X_{(n)} \le t) =
      (t/\theta)^{n}$ we get $\mathbb{E}[X_{(n)}] = \frac{n}{n+1}\theta$, a bias
      of $-\theta/(n+1)$. Rescaling to $\frac{n+1}{n}X_{(n)}$ removes the bias
      and cuts the MSE from $\frac{2\theta^{2}}{(n+1)(n+2)}$ to
      $\frac{\theta^{2}}{n(n+2)}$ for $n \ge 2$. The error shrinks like $1/n$,
      possible only because the support moves with $\theta$ and the usual
      regularity conditions fail.
    summary: >
      The likelihood is maximized at a boundary, so the MLE is the sample max; it
      undershoots $\theta$ by $\theta/(n+1)$, and $\frac{n+1}{n}X_{(n)}$ fixes
      that.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.mle
      - quant-probability.continuous.uniform
    relates:
      - id: quant-probability.random-variables.order-statistics
        note: >
          This MLE is the $n$-th order statistic, and its CDF $(t/\theta)^{n}$ is
          the maximum formula from that node, which is what makes the bias a
          one-line computation.
    tags: []

  - id: quant-statistics.estimation.fisher-information
    kind: definition
    prominence: 1
    title: "Score and Fisher information"
    statement: >
      The score is $U(\theta) = \frac{\partial}{\partial\theta}\log f(X;\theta)$,
      itself a random variable. Under regularity — the support of $f$ free of
      $\theta$, and differentiation under the integral sign legitimate —
      $\mathbb{E}[U(\theta)] = 0$, and the Fisher information is
      $I(\theta) = \operatorname{Var}(U(\theta)) = -\mathbb{E}\left[
      \frac{\partial^{2}}{\partial\theta^{2}}\log f(X;\theta)\right]$, the second
      form being the one to compute. Information adds over independent
      observations, so a sample of size $n$ carries $nI(\theta)$. It measures how
      sharply the log-likelihood peaks: a flat $\ell$ leaves $\theta$ poorly
      pinned down. Worked: $\operatorname{Bernoulli}(p)$ has
      $I(p) = 1/(p(1-p))$, largest near $0$ and $1$; a normal with known variance
      has $I(\mu) = 1/\sigma^{2}$.
    summary: >
      The averaged curvature of the log-likelihood — how much one observation
      says about $\theta$, adding up across independent draws.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.likelihood
    relates: []
    tags: []

  - id: quant-statistics.estimation.cramer-rao
    kind: theorem
    prominence: 2
    title: "Cramér–Rao lower bound"
    statement: >
      Assume the regularity conditions: the support of $f(\cdot\,;\theta)$ does
      not depend on $\theta$, $I(\theta)$ is finite and positive, and
      differentiation under the integral sign is valid. Then every unbiased
      estimator $\hat{\theta}$ of $\theta$ built from $n$ iid observations
      satisfies $\operatorname{Var}(\hat{\theta}) \ge \frac{1}{nI(\theta)}$; more
      generally, an estimator with $\mathbb{E}[\hat{\theta}] = g(\theta)$
      satisfies $\operatorname{Var}(\hat{\theta}) \ge
      g'(\theta)^{2}/(nI(\theta))$. An unbiased estimator attaining the bound is
      called efficient. Worked: for $\operatorname{Bernoulli}(p)$ the bound is
      $p(1-p)/n$, which $\hat{p} = \bar{X}$ attains exactly, so no unbiased
      estimator of $p$ can ever beat the sample proportion. Biased estimators are
      not bound by it, and neither is the moving-support uniform model.
    summary: >
      Fisher information floors the variance of every unbiased estimator at
      $1/(nI(\theta))$ — a floor the Bernoulli sample proportion sits exactly on.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.fisher-information
      - quant-statistics.estimation.bias-mse
    relates:
      - id: quant-probability.inequalities.cs-covariance
        note: >
          The bound is Cauchy–Schwarz applied to the estimator and the score:
          $\operatorname{Cov}(\hat{\theta}, U)^{2} \le
          \operatorname{Var}(\hat{\theta})\operatorname{Var}(U)$, with the
          covariance forced to equal $1$ by unbiasedness.
    tags: []

  - id: quant-statistics.estimation.mle-asymptotics
    kind: theorem
    prominence: 1
    title: "Asymptotic normality of the MLE"
    statement: >
      Under the Cramér–Rao regularity conditions together with identifiability
      and smoothness of $\ell$ in $\theta$, the maximum likelihood estimator from
      $n$ iid observations is consistent and satisfies
      $\sqrt{n}(\hat{\theta}_n - \theta) \to N(0, 1/I(\theta))$ in distribution.
      Three consequences get used constantly: the MLE is asymptotically
      unbiased; its variance approaches the Cramér–Rao floor, making it
      asymptotically efficient, so nothing beats it in large samples; and
      $\hat{\theta}_n \pm 1.96/\sqrt{nI(\hat{\theta}_n)}$ is an approximate
      $95\%$ interval. The hypotheses do real work — for
      $\operatorname{Uniform}(0,\theta)$ the support moves with $\theta$, and
      $n(\theta - \hat{\theta}_n)$ converges to an exponential law with mean
      $\theta$: rate $n$, and not normal at all.
    summary: >
      In large samples the MLE is normal about the truth with variance the
      Cramér–Rao floor $1/(nI(\theta))$ — provided the support does not move with
      $\theta$.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.mle
      - quant-statistics.estimation.fisher-information
      - quant-statistics.estimation.consistency
    relates: []
    tags: []

  - id: quant-statistics.estimation.mom
    kind: technique
    prominence: 1
    title: "Method of moments"
    statement: >
      To estimate $k$ parameters, write the first $k$ population moments
      $\mathbb{E}[X^{j}]$ as functions of $\theta$, set them equal to the sample
      moments $\frac{1}{n}\sum_{i} X_i^{j}$, and solve. Reach for it when the
      likelihood is ugly or has no closed-form maximizer, or as a starting value
      for a numerical MLE. Worked: $\operatorname{Uniform}(0,\theta)$ has
      $\mathbb{E}[X] = \theta/2$, so $\hat{\theta} = 2\bar{X}$, unbiased with
      variance $\theta^{2}/(3n)$ — far worse than the maximum-based estimator,
      and embarrassing whenever $2\bar{X}$ lands below an observed value. For the
      discrete uniform on $\{1,\dots,N\}$ the same move gives
      $\hat{N} = 2\bar{X} - 1$. Moment estimators are consistent under mild
      conditions but are usually less efficient than the MLE.
    summary: >
      Set sample moments equal to population moments and solve — always easy,
      sometimes clumsy, and occasionally capable of returning an impossible
      answer.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.estimator
    relates: []
    tags: []

  - id: quant-statistics.estimation.sufficiency
    kind: definition
    prominence: 0
    title: "Sufficiency and the factorization criterion"
    statement: >
      A statistic $T$ is sufficient for $\theta$ if the conditional distribution
      of the sample given $T$ does not depend on $\theta$: once $T$ is known, the
      rest of the data says nothing further about $\theta$. Fisher–Neyman
      factorization turns this into a calculation — $T$ is sufficient exactly
      when the likelihood factors as $L(\theta) = g(T(x),\theta)\,h(x)$, which is
      read straight off the algebra. Examples: $\sum_{i} X_i$ for
      $\operatorname{Bernoulli}(p)$; the pair
      $(\sum_{i} X_i, \sum_{i} X_i^{2})$ for a normal with both parameters
      unknown; $\max_{i} X_i$ for $\operatorname{Uniform}(0,\theta)$.
      Rao–Blackwell: replacing an unbiased $\hat{\theta}$ by
      $\mathbb{E}[\hat{\theta} \mid T]$ preserves unbiasedness and never
      increases variance, so good estimators are functions of a sufficient
      statistic.
    summary: >
      A statistic that wrings the sample dry of information about $\theta$ — spot
      it by factorizing the likelihood, and build estimators out of nothing else.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.likelihood
    relates: []
    tags: []

  - id: quant-statistics.estimation.german-tank
    kind: example
    prominence: 1
    title: "German tank problem"
    statement: >
      Tanks carry serial numbers $1,\dots,N$ with $N$ unknown; you observe $k$ of
      them drawn without replacement, the largest serial seen being $m$. The MLE
      is $\hat{N} = m$, biased low. Exactly,
      $\Pr(m = j) = \binom{j-1}{k-1}/\binom{N}{k}$ yields
      $\mathbb{E}[m] = \frac{k(N+1)}{k+1}$, so the unbiased estimator is
      $\hat{N} = \frac{k+1}{k}m - 1 = m + \frac{m}{k} - 1$: the largest serial
      seen, plus the average gap between serials, minus one. Worked: serials
      $12, 44, 60, 97$ give $k = 4$, $m = 97$ and
      $\hat{N} = 97 + 24.25 - 1 = 120.25$, so about $120$ tanks. Its standard
      deviation runs near $N/k$ for $k \ll N$, so accuracy improves like $1/k$ —
      this beat wartime intelligence estimates, which ran several times too high.
    summary: >
      Estimate a population size from the largest serial number seen:
      $m + m/k - 1$, which turns four captured tanks into an estimate of about
      $120$.
    parent: quant-statistics.estimation
    also_under: []
    requires:
      - quant-statistics.estimation.mle-uniform
      - quant-statistics.estimation.bias-mse
    relates: []
    tags: []
