nodes:
  - id: quant-statistics.testing
    kind: subbranch
    title: "Hypothesis Testing & Confidence"
    summary: >
      Errors, power and p-values without folklore — z and t tests,
      confidence intervals, and the multiple-testing trap quant research
      lives in.
    parent: quant-statistics
    also_under: []
    tags: []

  - id: quant-statistics.testing.hypotheses
    kind: definition
    prominence: 1
    title: "Null, alternative, test statistic, rejection region"
    statement: >
      A test opposes a null hypothesis $H_0$, which pins down the sampling
      distribution of a statistic $T$ well enough to compute probabilities, to
      an alternative $H_1$ of interest. The test is a rule: reject $H_0$ when
      $T$ falls in a rejection region $R$ chosen in advance so that
      $\Pr_{H_0}(T \in R) \le \alpha$. $H_0$ is simple when it fixes the law
      exactly ($p = 0.5$) and composite when it only constrains it
      ($\mu \le 0$). The logic is one-directional: data can discredit $H_0$,
      never confirm it, so "fail to reject" is not "accept". Interview
      phrasings: "is this coin fair?" ($H_0: p = 0.5$), "does my signal have
      positive mean return?" ($H_0: \mu = 0$ against $\mu > 0$).
    summary: >
      Testing is a pre-committed rule for rejecting a default hypothesis, and
      the null is the one whose distribution you can actually compute under.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.descriptive.sample-mean
      - quant-statistics.estimation.bias-mse
    relates: []
    tags: []

  - id: quant-statistics.testing.type-errors
    kind: definition
    prominence: 1
    title: "Type I and Type II errors, significance and power"
    statement: >
      A Type I error rejects a true $H_0$; its probability is the size, held at
      the significance level $\alpha$ chosen before looking at the data. A Type
      II error fails to reject when a specific alternative is true; its
      probability $\beta$ depends on which alternative — there is no single
      $\beta$. Power at that alternative is $1 - \beta$, the chance the test
      catches an effect of that size. The tension: at fixed sample size, pushing
      the critical value out to shrink $\alpha$ raises $\beta$ at every
      alternative, and only more data or a sharper statistic improves both.
      Conventional settings are $\alpha = 0.05$ and power $0.80$, which is a
      $1$-in-$4$ chance of missing the effect you designed for.
    summary: >
      $\alpha$ is the false-alarm rate you choose; $\beta$ is the miss rate you
      inherit at each alternative, and power $= 1 - \beta$ is what you buy with
      sample size.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.hypotheses
    relates: []
    tags: []

  - id: quant-statistics.testing.power-curve
    kind: proposition
    prominence: 1
    title: "Power as a function of effect, sample size and level"
    statement: >
      For a one-sided level-$\alpha$ test of $H_0: \mu = \mu_0$ against
      $\mu > \mu_0$ with known $\sigma$, reject when
      $\bar{x} > \mu_0 + z_{\alpha}\sigma/\sqrt{n}$. If the true mean is
      $\mu_0 + \delta$ with $\delta > 0$, the power is
      $1 - \beta = \Phi\!\left(\dfrac{\delta\sqrt{n}}{\sigma} - z_{\alpha}\right)$.
      It rises with the effect $\delta$, with $\sqrt{n}$ and with $\alpha$, and
      falls with $\sigma$; at $\delta = 0$ it equals $\alpha$, so a test is never
      less likely to fire under the null than its own level. Two-sided version:
      replace $z_{\alpha}$ by $z_{\alpha/2}$ and ignore the far tail. Worked: an
      effect of one fifth of a standard deviation, $\delta = 0.2\sigma$, with
      $n = 100$ and $\alpha = 0.05$ one-sided gives
      $\Phi(2 - 1.645) = \Phi(0.355) \approx 0.64$.
    summary: >
      Power is $\Phi(\delta\sqrt{n}/\sigma - z_{\alpha})$: only the
      signal-to-noise ratio $\delta\sqrt{n}/\sigma$ and the level matter.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.type-errors
    relates: []
    tags: []

  - id: quant-statistics.testing.pvalue
    kind: definition
    prominence: 2
    title: "The p-value"
    statement: >
      Let $t$ be the observed value of the test statistic $T$. The p-value is
      the probability, computed under $H_0$, of a result at least as extreme as
      $t$, with extremity oriented by the alternative: $p = \Pr_{H_0}(T \ge t)$
      for a right-tailed alternative, $\Pr_{H_0}(|T| \ge |t|)$ for a two-sided
      one. Two consequences. Rejecting exactly when $p \le \alpha$ reproduces the
      level-$\alpha$ test, so $p$ is the smallest level at which this data
      rejects. If $T$ is continuous then $p \sim \operatorname{Uniform}(0,1)$
      under $H_0$, which is why $\Pr(p \le \alpha) = \alpha$ exactly; with a
      discrete statistic the attainable levels are coarse and the test is
      conservative.
    summary: >
      A tail probability computed under the null — the smallest significance
      level at which the observed data would reject.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.hypotheses
    relates:
      - id: quant-probability.random-variables.pit
        note: >
          The null uniformity of the p-value is the probability integral
          transform applied to the test statistic's null CDF — $p = 1 - F_0(T)$
          is uniform exactly when $F_0$ is continuous.
    tags: []

  - id: quant-statistics.testing.pvalue-misreadings
    kind: intuition
    prominence: 1
    title: "What a p-value is not"
    statement: >
      Six standard misreadings, all worth being able to name. It is not
      $\Pr(H_0 \text{ true} \mid \text{data})$ — that is a posterior and needs a
      prior. It is not the probability the result was "due to chance", nor is
      $1 - p$ the probability the finding replicates. It is not an effect size:
      with $n$ large enough any nonzero effect drives $p \to 0$, and with $n$
      small a huge effect can sit at $p = 0.3$. It is not a threshold in nature —
      $p = 0.049$ and $p = 0.051$ are the same evidence. Failing to reject is not
      evidence of no effect; it is often just low power. Practical rule: quote
      the estimate and its standard error first, the p-value second.
    summary: >
      The p-value is a statement about data under the null, not about the
      probability of the null, the size of the effect, or replication.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.pvalue
    relates: []
    tags: []

  - id: quant-statistics.testing.one-two-sided
    kind: definition
    prominence: 0
    title: "One-sided versus two-sided tests"
    statement: >
      A two-sided test of $\mu = \mu_0$ splits $\alpha$ between the tails and
      rejects when $|z| \ge z_{\alpha/2}$ ($1.96$ at $\alpha = 0.05$); a
      one-sided test of $\mu > \mu_0$ spends it all on one side and rejects when
      $z \ge z_{\alpha}$ ($1.645$). For a symmetric null law the two-sided
      p-value is twice the one-sided tail. The direction must be fixed before
      the data is seen: choosing the tail after seeing the sign of $\hat{\mu}$
      turns a nominal $5\%$ one-sided test into a real $10\%$ test. Default to
      two-sided unless a deviation in one direction is genuinely uninteresting;
      a signal that works backwards is not uninteresting.
    summary: >
      Splitting $\alpha$ between two tails costs you $1.96$ versus $1.645$ —
      cheap, and it stops you from picking the tail after the fact.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.pvalue
    relates: []
    tags: []

  - id: quant-statistics.testing.ztest
    kind: technique
    prominence: 1
    title: "The z-test"
    statement: >
      Reach for it when the statistic's null law is normal: $\sigma$ known, or
      $n$ large enough that the CLT applies to $\bar{x}$ (sample means of
      returns, proportions with $np_0$ and $n(1-p_0)$ at least about $10$).
      Recipe: (1) write $H_0$ so it fixes $\mu_0$ and the null standard
      deviation; (2) form $z = (\bar{x} - \mu_0)/(\sigma/\sqrt{n})$; (3) compare
      to $z_{\alpha/2}$ or convert to $p = 2(1 - \Phi(|z|))$; (4) report
      $\bar{x} \pm z_{\alpha/2}\sigma/\sqrt{n}$ alongside. For a proportion use
      the null variance $p_0(1-p_0)$, not the sample's. The three quantiles to
      know cold: $1.645$, $1.96$, $2.576$ for two-sided $90\%$, $95\%$, $99\%$.
    summary: >
      Standardize the estimate by its standard error and read the normal tail —
      the default test whenever the CLT has taken hold.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.type-errors
      - quant-statistics.testing.pvalue
      - quant-probability.limits.clt
    relates: []
    tags: []

  - id: quant-statistics.testing.coin-sixty-heads
    kind: example
    prominence: 1
    title: "60 heads in 100 tosses: is the coin biased?"
    statement: >
      Under $H_0: p = 0.5$ the head count has mean $50$ and standard deviation
      $\sqrt{100 \cdot 0.25} = 5$, so $z = (60 - 50)/5 = 2.0$ and the two-sided
      p-value is $2(1 - \Phi(2)) = 0.0455$ — a bare rejection at $5\%$. The bare
      part is illusory: with the continuity correction $z = (59.5 - 50)/5 = 1.9$
      giving $p = 0.057$, and the exact binomial answer is
      $2\Pr(X \ge 60) = 2(0.0284) = 0.0569$. Both say do not reject at $5\%$, so
      the verdict here sits inside the approximation error. Scale is what
      settles it: the same $60\%$ rate over $1000$ tosses gives
      $z = 100/\sqrt{250} = 6.3$.
    summary: >
      $z = 2$ looks significant and is not — continuity correction and the exact
      binomial both give $p \approx 0.057$, and only $n = 1000$ makes $60\%$
      decisive.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.ztest
      - quant-statistics.testing.one-two-sided
      - quant-probability.limits.normal-approx-binomial
    relates: []
    tags: []

  - id: quant-statistics.testing.t-distribution
    kind: definition
    prominence: 1
    title: "The t-distribution"
    statement: >
      Replacing the unknown $\sigma$ by the sample standard deviation $s$ costs
      you tail weight. For iid normal data,
      $t = (\bar{x} - \mu)/(s/\sqrt{n})$ has the t-distribution with
      $\nu = n - 1$ degrees of freedom, constructed as $Z/\sqrt{V/\nu}$ with $Z$
      standard normal independent of $V \sim \chi^{2}_{\nu}$. It is symmetric
      about $0$ with variance $\nu/(\nu - 2)$ for $\nu > 2$ and undefined
      variance below that. Two-sided $95\%$ critical values: $2.776$ at
      $\nu = 4$, $2.228$ at $\nu = 10$, $2.042$ at $\nu = 30$, tending to $1.96$
      as $\nu \to \infty$. The excess width is the premium for estimating the
      noise level from the same small sample.
    summary: >
      The law of a mean standardized by an estimated standard deviation —
      normal-shaped but fat-tailed, converging to the normal as df grow.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-probability.continuous.normal
    relates:
      - id: quant-probability.continuous.cauchy
        note: >
          The t with one degree of freedom is exactly the Cauchy law: the same
          ratio-of-normals blow-up explains why small-sample t tails are heavy
          and why the mean-free pathology fades as $\nu$ grows.
    tags: []

  - id: quant-statistics.testing.ttest
    kind: technique
    prominence: 1
    title: "The t-test"
    statement: >
      Same recipe as the z-test with $s$ in place of $\sigma$ and the
      $t_{n-1}$ table in place of the normal:
      $t = (\bar{x} - \mu_0)/(s/\sqrt{n})$, reject when $|t| \ge t_{n-1,\alpha/2}$.
      It matters when $n$ is small — at $n = 5$ the critical value $2.776$ is
      over $40\%$ wider than $1.96$ — and is nearly irrelevant past
      $n \approx 30$. Its
      hypothesis is approximately normal data (or an $n$ large enough that
      $\bar{x}$ is normal); it tolerates mild skew but not heavy tails or serial
      dependence, and daily P&L has both, so a raw t-stat on returns overstates
      significance. Paired form: reduce two matched series to their differences
      $d_i$ and run the one-sample test on those.
    summary: >
      The small-sample workhorse: standardize by $s/\sqrt{n}$ and use the
      $t_{n-1}$ tail, remembering it assumes independent, roughly normal draws.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.ztest
      - quant-statistics.testing.t-distribution
    relates: []
    tags: []

  - id: quant-statistics.testing.two-sample
    kind: technique
    prominence: 0
    title: "Comparing two means"
    statement: >
      For independent samples, Welch's test uses
      $t = (\bar{x}_1 - \bar{x}_2)/\sqrt{s_1^{2}/n_1 + s_2^{2}/n_2}$ with a
      fractional df; the pooled-variance version assumes equal variances and is
      rarely worth the assumption. Pair whenever the two series see the same
      shocks. With equal variances $\sigma^{2}$ and correlation $\rho$ between
      matched observations, the difference has variance
      $2\sigma^{2}(1 - \rho)$ instead of $2\sigma^{2}$, so at $\rho = 0.9$ the
      standard error drops by $\sqrt{10} \approx 3.2$. Comparing two strategies
      day by day rather than by their separate averages is exactly this move:
      the market factor cancels.
    summary: >
      Welch for independent groups; pair matched observations to cancel the
      common shock and cut the standard error by $\sqrt{1-\rho}$.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.ttest
    relates: []
    tags: []

  - id: quant-statistics.testing.ci
    kind: definition
    prominence: 2
    title: "Confidence intervals and test duality"
    statement: >
      A $1 - \alpha$ confidence interval for $\theta$ is a random interval
      $C(X)$ with $\Pr_{\theta}(\theta \in C(X)) \ge 1 - \alpha$ for every
      $\theta$. The canonical one for a mean is
      $\bar{x} \pm z_{\alpha/2}\sigma/\sqrt{n}$, or
      $\bar{x} \pm t_{n-1,\alpha/2}\,s/\sqrt{n}$ when $\sigma$ is estimated.
      Duality: $C(X)$ is exactly the set of null values $\mu_0$ that the
      two-sided level-$\alpha$ test would fail to reject, so every test yields
      an interval by inversion and every interval yields a test by asking
      whether it contains $\mu_0$. Width $2z_{\alpha/2}\sigma/\sqrt{n}$ shrinks
      like $1/\sqrt{n}$ — halving it costs four times the data.
    summary: >
      The set of hypotheses the data cannot reject, written as an interval —
      roughly $\pm 2$ standard errors at $95\%$, narrowing only as $1/\sqrt{n}$.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.ztest
    relates: []
    tags: []

  - id: quant-statistics.testing.ci-interpretation
    kind: intuition
    prominence: 1
    title: "What the confidence level is a statement about"
    statement: >
      The $95\%$ attaches to the procedure, not to the interval on your screen:
      across repeated samples, $95\%$ of the intervals the method produces cover
      the fixed unknown $\theta$, and the particular one you computed either
      does or does not. Saying "there is a $95\%$ probability that $\mu$ lies in
      $[a,b]$" is the credible-interval reading, which requires a prior and a
      Bayesian setup. Legitimate readings: values outside are rejected at $5\%$;
      the width states what this much data can resolve. A wide interval
      containing zero and also containing an economically large value means the
      experiment was uninformative, not that the effect is absent.
    summary: >
      Coverage is a long-run property of the recipe; the probability statement
      about your particular interval is the Bayesian one, and needs a prior.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.ci
    relates: []
    tags: []

  - id: quant-statistics.testing.sample-size
    kind: technique
    prominence: 1
    title: "Sample size to resolve an effect"
    statement: >
      Set the power equation $\Phi(\delta\sqrt{n}/\sigma - z_{\alpha}) =
      1 - \beta$ and solve: $\delta\sqrt{n}/\sigma = z_{\alpha} + z_{\beta}$,
      hence $n \approx \left(\dfrac{(z_{\alpha} + z_{\beta})\sigma}{\delta}\right)^{2}$,
      with $z_{\alpha/2}$ in place of $z_{\alpha}$ for a two-sided test. The
      content is the scaling: $n$ grows like $(\sigma/\delta)^{2}$, so an effect
      half as large needs four times the data. Multipliers worth memorizing at
      two-sided $\alpha = 0.05$: power $0.80$ gives
      $(1.96 + 0.84)^{2} = 7.85$, power $0.90$ gives
      $(1.96 + 1.28)^{2} = 10.5$, so $n \approx 8(\sigma/\delta)^{2}$ is the
      back-of-envelope answer.
    summary: >
      $n \approx ((z_{\alpha}+z_{\beta})\sigma/\delta)^{2}$, about
      $8(\sigma/\delta)^{2}$ at the standard $5\%$/$80\%$ settings — halving the
      detectable effect quadruples the data.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.ztest
      - quant-statistics.testing.power-curve
    relates:
      - id: quant-probability.limits.root-n
        note: >
          The $(\sigma/\delta)^{2}$ law is the root-n rule read backwards:
          precision improves like $1/\sqrt{n}$, so buying twice the resolution
          costs four times the sample.
    tags: []

  - id: quant-statistics.testing.detect-coin-edge
    kind: example
    prominence: 1
    title: "How many flips to detect a 55% coin?"
    statement: >
      Take $\delta = 0.05$, null per-flip standard deviation
      $\sigma = \sqrt{0.5 \cdot 0.5} = 0.5$, two-sided $\alpha = 0.05$ and power
      $0.80$, so $z_{\alpha/2} + z_{\beta} = 1.96 + 0.84 = 2.80$. Then
      $n \approx (2.80 \cdot 0.5/0.05)^{2} = 28^{2} = 784$, call it $800$ flips.
      Using the alternative's own standard deviation
      $\sqrt{0.55 \cdot 0.45} = 0.497$ in the power term refines this to $783$;
      a one-sided test at $5\%$ needs only
      $((1.645 + 0.84) \cdot 10)^{2} = 618$. Trading reading: a per-trade edge of
      $0.1\sigma$ takes roughly $800$ trades to establish, and at $100$ trades
      the two-sided test has power $\Phi(1 - 1.96) \approx 0.17$.
    summary: >
      About $784$ flips at the standard $5\%$/$80\%$ settings ($783$ with the
      refined variance, $618$ one-sided) — and $100$ flips have only $17\%$
      power.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.sample-size
    relates: []
    tags: []

  - id: quant-statistics.testing.multiple-testing
    kind: proposition
    prominence: 2
    title: "Family-wise error and Bonferroni"
    statement: >
      Run $m$ tests each at level $\alpha$ when all $m$ nulls are true. The
      family-wise error rate, the probability of at least one false rejection,
      is $1 - (1-\alpha)^{m}$ for independent tests and at most $m\alpha$ in
      general by the union bound, whatever the dependence. Bonferroni inverts
      this: test each hypothesis at $\alpha/m$ and the FWER stays at or below
      $\alpha$. At $\alpha = 0.05$ and $m = 20$ the per-test threshold is
      $0.0025$, a two-sided cutoff of $|z| \ge 3.02$. The price is power, and
      the bound is loose when the tests are correlated, as overlapping backtests
      are. Sharper options: Holm's step-down, which dominates Bonferroni
      uniformly, and Benjamini–Hochberg, which controls the false discovery
      proportion instead.
    summary: >
      Twenty tests at $5\%$ each give a $64\%$ chance of a false alarm; dividing
      the level by the number of tests caps the family-wise rate at the cost of
      power.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.type-errors
      - quant-statistics.testing.pvalue
      - quant-probability.inequalities.union-bound
    relates: []
    tags: []

  - id: quant-statistics.testing.data-snooping
    kind: example
    prominence: 1
    title: "Data snooping in strategy research"
    statement: >
      You backtest $20$ unrelated signals, all pure noise, each judged at $5\%$.
      The chance at least one looks significant is $1 - 0.95^{20} = 0.64$; with
      $100$ variants it is $0.994$ and the expected number of false discoveries
      is $5$. The winner's reported p-value is meaningless because the search is
      not in the model — the correct null is "the best of $20$ noise
      strategies", whose maximum t-stat is far out in the tail. Discipline:
      count every specification tried, including abandoned ones and every
      parameter tweak, hold out data you have not looked at, and prefer a
      hypothesis stated before the fit. Backtest-specific corrections belong
      with backtest evaluation.
    summary: >
      Twenty noise strategies produce a "significant" winner $64\%$ of the time;
      the p-value of the survivor of a search is not a p-value.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.multiple-testing
    relates: []
    tags: []

  - id: quant-statistics.testing.practical-significance
    kind: intuition
    prominence: 1
    title: "Statistical versus practical significance"
    statement: >
      Significance answers whether an effect is distinguishable from zero, not
      whether it is worth trading. With enough data an edge of $0.01$ basis
      points per trade is significant and unprofitable after costs; with little
      data a genuinely strong strategy can fail to clear $5\%$. Read the
      interval, not the star: an estimate with $p = 0.001$ and a $95\%$ interval
      of $[0.02, 0.05]$ bp is precisely measured and useless, while $p = 0.2$
      with an interval of $[-1, +5]$ bp is undecided rather than refuted. What
      converts an effect into money is size against costs, capacity and
      turnover; a t-stat measures only how sure you are that the effect is not
      exactly zero.
    summary: >
      Large $n$ makes trivial effects significant and small $n$ hides real ones
      — quote the effect size and its interval, then ask whether it pays.
    parent: quant-statistics.testing
    also_under: []
    requires:
      - quant-statistics.testing.ci
    relates: []
    tags: []
