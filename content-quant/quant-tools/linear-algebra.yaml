  - id: quant-tools.linear-algebra.matrix-algebra
    kind: definition
    prominence: 1
    title: "Matrix product, transpose and inverse"
    statement: >
      An $m \times n$ matrix $A$ acts on vectors by $x \mapsto Ax$, a linear map
      $\mathbb{R}^{n} \to \mathbb{R}^{m}$; its columns are the images of the
      coordinate vectors. The product $AB$ has $(i,j)$ entry
      $\sum_{k} a_{ik}b_{kj}$ and represents composition, so it is associative
      and distributive but not commutative. The transpose has
      $(A^{T})_{ij} = a_{ji}$, and $(AB)^{T} = B^{T}A^{T}$. A square $A$ is
      invertible when $AB = BA = I$ for some $B$, written $A^{-1}$, and then
      $(AB)^{-1} = B^{-1}A^{-1}$ — both products reverse order, which is the
      cheapest check that an algebraic manipulation is legal. For a $2 \times 2$
      matrix with rows $(a,b)$ and $(c,d)$, $A^{-1}$ is $1/(ad-bc)$ times the
      matrix with rows $(d,-b)$ and $(-c,a)$.
    summary: >
      Matrices as linear maps: multiply by composing, transpose by reflecting,
      and invert only when the map is reversible — with order reversing in both
      $(AB)^{T}$ and $(AB)^{-1}$.
    parent: quant-tools.linear-algebra
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.rank-solvability
    kind: proposition
    prominence: 1
    title: "Rank and the solution set of Ax=b"
    statement: >
      The rank of $A$ is the dimension of its column space, equal to the
      dimension of its row space and to the number of pivots after elimination.
      Rank–nullity: for $A$ of size $m \times n$,
      $\operatorname{rank}(A) + \dim \ker(A) = n$. The system $Ax = b$ is
      solvable exactly when $b$ lies in the column space, equivalently when
      $\operatorname{rank}(A) = \operatorname{rank}$ of the augmented matrix
      $[A \mid b]$; the full solution set is then one particular solution plus
      the null space. Hence exactly three cases: no solution; a unique solution
      when $\operatorname{rank}(A) = n$; or an infinite family of dimension
      $n - \operatorname{rank}(A)$. A real linear system never has exactly two
      solutions — a favourite one-line interview check.
    summary: >
      Rank counts independent columns, and it decides whether $Ax=b$ has none,
      one, or a whole affine family of solutions — never two.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.matrix-algebra
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.determinant-trace
    kind: definition
    prominence: 1
    title: "Determinant and trace"
    statement: >
      The determinant is the unique function of the columns of a square matrix
      that is linear in each column, changes sign when two columns are swapped,
      and gives $\det I = 1$. For $2 \times 2$ with rows $(a,b)$ and $(c,d)$ it
      is $ad - bc$; larger cases expand along a row by cofactors. Geometric
      reading: $A$ scales $n$-dimensional volume by the factor $|\det A|$, and
      the sign of $\det A$ records whether orientation is preserved, so
      $\det A = 0$ says $A$ flattens space onto a lower-dimensional set. The
      trace $\operatorname{tr} A = \sum_{i} a_{ii}$ is linear and satisfies
      $\operatorname{tr}(AB) = \operatorname{tr}(BA)$, hence is unchanged by
      $A \mapsto P^{-1}AP$.
    summary: >
      Determinant is the signed volume-scaling factor of the map (zero exactly
      when it collapses space); trace is the sum of the diagonal, invariant
      under change of basis.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.matrix-algebra
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.determinant-properties
    kind: proposition
    prominence: 0
    title: "Rules for computing determinants"
    statement: >
      For square matrices of the same size: $\det(AB) = \det A \cdot \det B$,
      $\det(A^{T}) = \det A$, $\det(cA) = c^{n}\det A$ for $A$ of size
      $n \times n$, and $\det(A^{-1}) = 1/\det A$ when $A$ is invertible. A
      triangular matrix has determinant equal to the product of its diagonal
      entries, and the same holds blockwise for block-triangular matrices.
      Elimination is therefore the practical algorithm: adding a multiple of one
      row to another leaves the determinant unchanged, swapping two rows flips
      its sign, and scaling a row by $c$ multiplies it by $c$, so reduce to
      triangular form and multiply the pivots. Note that $\det(A+B)$ has no
      useful formula.
    summary: >
      Determinants multiply across products and read off the diagonal of a
      triangular matrix, which makes elimination the way to compute them — but
      they do not add.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.determinant-trace
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.invertibility
    kind: proposition
    prominence: 1
    title: "Equivalent conditions for invertibility"
    statement: >
      For a square $n \times n$ real matrix $A$ the following are equivalent:
      $A$ is invertible; $\operatorname{rank}(A) = n$; $\det A \ne 0$; the
      columns are linearly independent; the columns span $\mathbb{R}^{n}$;
      $\ker(A) = \{0\}$; $Ax = b$ has exactly one solution for every $b$;
      $A^{T}$ is invertible; and — once eigenvalues are available — no
      eigenvalue of $A$ equals $0$. Any one of these can be tested and the rest
      follow. Example: the matrix with rows $(1,2)$ and $(2,4)$ has
      $\det = 4 - 4 = 0$, so it is singular, its columns are proportional, and
      $Ax = b$ has either no solutions or infinitely many. Numerically, a tiny
      nonzero determinant is a warning rather than a reassurance: near-singular
      matrices amplify input error badly.
    summary: >
      Invertible, full rank, nonzero determinant, independent columns and unique
      solutions are all the same condition — check whichever is cheapest.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.rank-solvability
      - quant-tools.linear-algebra.determinant-properties
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.eigen
    kind: definition
    prominence: 2
    title: "Eigenvalues and eigenvectors"
    statement: >
      A scalar $\lambda$ and a nonzero vector $v$ with $Av = \lambda v$ are an
      eigenvalue and eigenvector of the square matrix $A$: the map only rescales
      $v$. Such a $v$ exists exactly when $A - \lambda I$ is singular, so the
      eigenvalues are the roots of the characteristic polynomial
      $\det(A - \lambda I) = 0$, a degree-$n$ polynomial with $n$ roots counted
      with algebraic multiplicity over $\mathbb{C}$. The eigenspace for
      $\lambda$ is $\ker(A - \lambda I)$, whose dimension (the geometric
      multiplicity) is at least $1$ and at most the algebraic multiplicity.
      Eigenvectors belonging to distinct eigenvalues are linearly independent.
      Real matrices can have complex eigenvalues — the quarter-turn with rows
      $(0,-1)$ and $(1,0)$ has $\lambda = \pm i$ and no real eigendirection.
    summary: >
      The directions a matrix merely stretches, and the stretch factors — found
      as the roots of $\det(A-\lambda I)=0$.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.determinant-trace
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.trace-det-eigen
    kind: proposition
    prominence: 1
    title: "Trace is the sum, determinant the product of eigenvalues"
    statement: >
      Let $A$ be $n \times n$ with eigenvalues $\lambda_1,\dots,\lambda_n$
      listed with algebraic multiplicity and allowed to be complex. Then
      $\operatorname{tr} A = \sum_{i} \lambda_i$ and
      $\det A = \prod_{i} \lambda_i$. Both come from comparing coefficients in
      $\det(\lambda I - A) = \prod_{i} (\lambda - \lambda_i)$. For $n = 2$ this
      says the characteristic polynomial is
      $\lambda^{2} - (\operatorname{tr} A)\lambda + \det A$, so
      $\lambda = \operatorname{tr} A/2 \pm \sqrt{(\operatorname{tr} A/2)^{2} -
      \det A}$ — eigenvalues of a $2 \times 2$ matrix in one line, with no
      expansion. Immediate corollaries: $A$ is singular iff some eigenvalue is
      $0$, and $\operatorname{tr} A/n$ is the average eigenvalue.
    summary: >
      Two invariants pin down the spectrum cheaply: the diagonal sums to
      $\sum \lambda_i$ and the determinant multiplies out to
      $\prod \lambda_i$.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.eigen
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.eigen-2x2
    kind: example
    prominence: 1
    title: "Eigenvalues of a 2×2 matrix by trace and determinant"
    statement: >
      Take the symmetric $A$ with rows $(2,1)$ and $(1,2)$. Here
      $\operatorname{tr} A = 4$ and $\det A = 3$, so
      $\lambda = 2 \pm \sqrt{4 - 3} = 2 \pm 1$, giving $\lambda = 3$ and
      $\lambda = 1$. For $\lambda = 3$, $A - 3I$ has rows $(-1,1)$ and
      $(1,-1)$, so the eigenvector is $v = (1,1)$; for $\lambda = 1$, $A - I$
      has rows $(1,1)$ and $(1,1)$, giving $v = (1,-1)$. The two eigenvectors
      are orthogonal, as symmetry guarantees. A second drill: rows $(4,1)$ and
      $(2,3)$ have trace $7$ and determinant $10$, so
      $\lambda = 3.5 \pm \sqrt{12.25 - 10} = 3.5 \pm 1.5$, that is $5$ and $2$.
      Check the pair against $3 + 1 = 4$ and $3 \cdot 1 = 3$ before moving on.
    summary: >
      Eigenvalues $3$ and $1$ with eigenvectors $(1,1)$ and $(1,-1)$ — read off
      from trace and determinant in seconds, then verified against them.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.trace-det-eigen
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.inner-product
    kind: definition
    prominence: 1
    title: "Dot product, norm and orthogonality"
    statement: >
      For $x,y \in \mathbb{R}^{n}$ the dot product is
      $x^{T}y = \sum_{i} x_i y_i$, the Euclidean norm is
      $\lVert x \rVert = \sqrt{x^{T}x}$, and $x$ and $y$ are orthogonal when
      $x^{T}y = 0$, in which case
      $\lVert x + y \rVert^{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2}$.
      Cauchy–Schwarz gives $|x^{T}y| \le \lVert x \rVert \lVert y \rVert$, so
      $\cos \theta = x^{T}y/(\lVert x \rVert \lVert y \rVert)$ lies in $[-1,1]$
      and defines the angle between the vectors; the centred version of this
      cosine is what a correlation coefficient is. The transpose is
      characterized by $x^{T}(Ay) = (A^{T}x)^{T}y$, the identity that moves a
      matrix across a dot product and drives every projection argument below.
    summary: >
      Length, angle and perpendicularity from one bilinear operation — with
      Cauchy–Schwarz making the cosine legitimate.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.matrix-algebra
      - quant-tools.series-calculus.cauchy-schwarz
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.orthogonal-matrix
    kind: definition
    prominence: 0
    title: "Orthogonal matrices"
    statement: >
      A square real $Q$ is orthogonal when $Q^{T}Q = QQ^{T} = I$, that is, its
      columns form an orthonormal basis; then $Q^{-1} = Q^{T}$, which is the
      cheapest inverse in linear algebra. Orthogonal maps are exactly the
      isometries fixing the origin: $\lVert Qx \rVert = \lVert x \rVert$ and
      $(Qx)^{T}(Qy) = x^{T}y$, so lengths and angles are preserved. Since
      $\det(Q)^{2} = \det(Q^{T}Q) = 1$, $\det Q = \pm 1$, the two signs being
      rotations and reflections, and any eigenvalue has modulus $1$. Products of
      orthogonal matrices are orthogonal. Gram–Schmidt orthonormalizes any
      independent set, which is what produces the factorization $A = QR$ with
      $R$ upper triangular.
    summary: >
      Matrices whose columns are orthonormal: they rotate or reflect without
      distorting, and their inverse is just their transpose.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.inner-product
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.spectral
    kind: theorem
    prominence: 2
    title: "Spectral theorem for symmetric matrices"
    statement: >
      Let $A$ be real and symmetric, $A = A^{T}$. Then every eigenvalue of $A$
      is real, and $\mathbb{R}^{n}$ has an orthonormal basis of eigenvectors of
      $A$: there is an orthogonal $Q$ and a diagonal $\Lambda$ of eigenvalues
      with $A = Q\Lambda Q^{T}$, equivalently
      $A = \sum_{i} \lambda_i q_i q_i^{T}$. Orthogonality of eigenvectors for
      distinct eigenvalues is one line: if $Av = \lambda v$ and $Aw = \mu w$
      then $\lambda\, v^{T}w = (Av)^{T}w = v^{T}(Aw) = \mu\, v^{T}w$, so
      $v^{T}w = 0$ when $\lambda \ne \mu$. Symmetry is essential — the matrix
      with rows $(1,1)$ and $(0,1)$ has the single eigenvalue $1$ and only a
      one-dimensional eigenspace, so it is not diagonalizable at all.
      Covariance matrices and Hessians are symmetric, which is why this theorem
      carries so much of quantitative finance.
    summary: >
      A symmetric matrix is a pure rescaling along perpendicular axes:
      $A = Q\Lambda Q^{T}$ with real eigenvalues and orthonormal eigenvectors.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.eigen
      - quant-tools.linear-algebra.orthogonal-matrix
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.quadratic-form
    kind: definition
    prominence: 1
    title: "Quadratic forms"
    statement: >
      A quadratic form is $q(x) = x^{T}Ax = \sum_{i,j} a_{ij}x_i x_j$, a scalar
      that is homogeneous of degree two: $q(cx) = c^{2}q(x)$. Only the symmetric
      part of $A$ matters, because
      $x^{T}Ax = x^{T}\left(\tfrac{1}{2}(A + A^{T})\right)x$, so one always
      takes $A$ symmetric; then the gradient is $2Ax$. With $A$ symmetric the
      coefficient of $x_i x_j$ for $i \ne j$ is $2a_{ij}$: the matrix with rows
      $(2,1)$ and $(1,2)$ gives
      $q(x) = 2x_1^{2} + 2x_1x_2 + 2x_2^{2}$, so $q(1,-1) = 2 - 2 + 2 = 2$.
      Forms are classified by sign behaviour — always positive off the origin,
      always negative, or indefinite (a saddle, positive in some directions and
      negative in others).
    summary: >
      The scalar $x^{T}Ax$ built from a matrix; only the symmetric part
      contributes, and its sign pattern is the whole content.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.inner-product
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.psd
    kind: definition
    prominence: 2
    title: "Positive semidefinite and positive definite matrices"
    statement: >
      A symmetric $A$ is positive semidefinite (PSD) when $x^{T}Ax \ge 0$ for
      all $x$, and positive definite (PD) when $x^{T}Ax > 0$ for all
      $x \ne 0$. Equivalent tests, for symmetric $A$: all eigenvalues are
      $\ge 0$ (respectively $> 0$), by the spectral theorem; and
      $A = B^{T}B$ for some $B$ (PSD), with $B$ of full column rank for PD.
      Sylvester's criterion characterizes PD only: $A$ is PD iff all $n$
      leading principal minors are positive. For PSD it is not enough that the
      leading minors are $\ge 0$ — the matrix with rows $(0,0)$ and $(0,-1)$
      has leading minors $0$ and $0$ yet is not PSD; PSD requires every
      principal minor, not only the leading ones, to be $\ge 0$. A PD matrix is invertible with positive
      diagonal and positive determinant, and sums of PSD matrices are PSD.
    summary: >
      The matrix analogue of "nonnegative": $x^{T}Ax \ge 0$, equivalently no
      negative eigenvalue — with Sylvester's minor test valid only in the
      strict, positive definite case.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.quadratic-form
      - quant-tools.linear-algebra.spectral
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.rayleigh-quotient
    kind: proposition
    prominence: 0
    title: "Rayleigh quotient bounds a quadratic form"
    statement: >
      Let $A$ be symmetric with eigenvalues
      $\lambda_{\min} = \lambda_1 \le \dots \le \lambda_n = \lambda_{\max}$.
      For every $x \ne 0$,
      $\lambda_{\min} \le \dfrac{x^{T}Ax}{x^{T}x} \le \lambda_{\max}$, with
      equality attained at the corresponding eigenvectors. Proof: expand $x$ in
      an orthonormal eigenbasis as $x = \sum_i c_i q_i$; then
      $x^{T}Ax = \sum_i \lambda_i c_i^{2}$ and $x^{T}x = \sum_i c_i^{2}$, so
      the quotient is a weighted average of the eigenvalues. Hence maximizing
      $x^{T}Ax$ over unit vectors returns $\lambda_{\max}$ at the top
      eigenvector — the variational fact underneath principal components. For
      rows $(2,1)$ and $(1,2)$ the quotient sweeps exactly $[1,3]$, hitting $3$
      at $x = (1,1)$.
    summary: >
      A symmetric quadratic form on the unit sphere ranges over
      $[\lambda_{\min}, \lambda_{\max}]$, extremes at the eigenvectors.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.spectral
      - quant-tools.linear-algebra.quadratic-form
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.covariance-psd
    kind: proposition
    prominence: 1
    title: "Covariance matrices are positive semidefinite"
    statement: >
      Let $\Sigma$ be the covariance matrix of a random vector $X$ in
      $\mathbb{R}^{d}$, so $\Sigma_{ij}$ is the covariance of $X_i$ and $X_j$.
      It is symmetric by construction, and for any fixed weights $a$ the scalar
      $a^{T}\Sigma a$ is the variance of the combination $a^{T}X$, which cannot
      be negative — so $\Sigma$ is PSD. This one identity is the whole argument.
      A zero eigenvalue means some combination $a^{T}X$ has zero variance, that
      is, an exact linear relation among the coordinates, so $\Sigma$ is
      invertible precisely when no such redundancy exists. The same holds for a
      sample covariance matrix, which is $\frac{1}{n-1}Y^{T}Y$ for the centred
      data $Y$ and is therefore PSD automatically — and necessarily singular
      when $n - 1 < d$, fewer observations than assets.
    summary: >
      $a^{T}\Sigma a$ is the variance of a portfolio, so it is never negative:
      every covariance or correlation matrix is PSD, and singular exactly when
      some combination is riskless.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.psd
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.correlation-matrix-bound
    kind: example
    prominence: 0
    title: "Can three assets be pairwise correlated −0.6?"
    statement: >
      Ask whether an $n \times n$ correlation matrix with $1$ on the diagonal
      and $\rho$ everywhere off it can exist. Write it as
      $(1-\rho)I + \rho J$ with $J$ the all-ones matrix, whose eigenvalues are
      $n$ (on the all-ones vector) and $0$; the eigenvalues are therefore
      $1 + (n-1)\rho$ once and $1 - \rho$ with multiplicity $n-1$. PSD forces
      both to be $\ge 0$, so $-\dfrac{1}{n-1} \le \rho \le 1$. For $n = 3$ this
      gives $\rho \ge -1/2$, and $\rho = -0.6$ yields the eigenvalue
      $1 - 1.2 = -0.2 < 0$: no three random variables can be that mutually
      negatively correlated. Intuitively, if $X$ and $Y$ both strongly disagree
      with $Z$ they must agree somewhat with each other. For a general triple,
      given each $|\rho_{ij}| \le 1$, PSD reduces to
      $1 + 2\rho_{12}\rho_{13}\rho_{23} - \rho_{12}^{2} - \rho_{13}^{2} -
      \rho_{23}^{2} \ge 0$.
    summary: >
      No — pairwise correlations of $n$ variables cannot all be below
      $-1/(n-1)$, so $-0.6$ is impossible for three, by a two-line eigenvalue
      argument.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.covariance-psd
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.projection
    kind: theorem
    prominence: 2
    title: "Orthogonal projection and the normal equations"
    statement: >
      Let $A$ be $m \times n$ with linearly independent columns and let
      $V$ be their span. For any $b \in \mathbb{R}^{m}$ there is a unique
      $\hat{b} \in V$ minimizing $\lVert b - v \rVert$ over $v \in V$, and it is
      characterized by the residual being orthogonal to $V$:
      $A^{T}(b - \hat{b}) = 0$. Writing $\hat{b} = A\hat{x}$ turns this into the
      normal equations $A^{T}A\hat{x} = A^{T}b$; independence of the columns
      makes $A^{T}A$ invertible, so
      $\hat{x} = (A^{T}A)^{-1}A^{T}b$ and $\hat{b} = Pb$ with
      $P = A(A^{T}A)^{-1}A^{T}$. The projector satisfies $P^{T} = P$ and
      $P^{2} = P$, has eigenvalues $0$ and $1$ only, and
      $\operatorname{tr} P = \dim V$. Pythagoras splits the target:
      $\lVert b \rVert^{2} = \lVert Pb \rVert^{2} + \lVert b - Pb \rVert^{2}$.
    summary: >
      The closest point of a subspace is the one whose error is perpendicular to
      it — which is exactly what the normal equations
      $A^{T}A\hat{x} = A^{T}b$ say.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.inner-product
      - quant-tools.linear-algebra.invertibility
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.least-squares-fit
    kind: example
    prominence: 0
    title: "A least-squares line solved from the normal equations"
    statement: >
      Fit $y = a + bx$ to the three points $(1,1)$, $(2,2)$, $(3,2)$. The design
      matrix $A$ has first column $(1,1,1)$ and second column $(1,2,3)$, so
      $A^{T}A$ has rows $(3,6)$ and $(6,14)$, while
      $A^{T}y = (5, 11)$ from $\sum y_i = 5$ and $\sum x_i y_i = 11$. The normal
      equations $3a + 6b = 5$ and $6a + 14b = 11$ give $2b = 1$, so
      $b = 1/2$ and $a = 2/3$. Fitted values are $7/6$, $5/3$, $13/6$ and the
      residual vector is $(-1/6, 1/3, -1/6)$; it is orthogonal to both columns,
      since the entries sum to $0$ and
      $1(-1/6) + 2(1/3) + 3(-1/6) = 0$. The minimized sum of squares is
      $1/36 + 4/36 + 1/36 = 1/6$.
    summary: >
      Slope $1/2$, intercept $2/3$, residual sum of squares $1/6$ — with the
      residual orthogonal to both columns, which is the check that the
      projection is right.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.projection
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.pca
    kind: technique
    prominence: 1
    title: "Principal components from the covariance eigendecomposition"
    statement: >
      Given a PSD covariance matrix $\Sigma$ of size $d \times d$, write
      $\Sigma = Q\Lambda Q^{T}$ with eigenvalues
      $\lambda_1 \ge \dots \ge \lambda_d \ge 0$ and orthonormal eigenvectors
      $q_i$. The first principal direction is $q_1$: by the Rayleigh bound it
      maximizes $a^{T}\Sigma a$ over unit $a$, with maximum $\lambda_1$; each
      later $q_k$ maximizes the same quantity subject to being orthogonal to the
      previous ones, achieving $\lambda_k$. The component scores $q_i^{T}X$ are
      uncorrelated with variances $\lambda_i$, and
      $\sum_i \lambda_i = \operatorname{tr}\Sigma$ is the total variance, so
      $\lambda_k/\operatorname{tr}\Sigma$ is the share explained. Recipe:
      centre, form $\Sigma$, eigendecompose, keep the top $k$. Caveats: the
      answer changes under rescaling of the variables, and tied eigenvalues
      leave the directions undetermined.
    summary: >
      Diagonalize the covariance matrix: eigenvectors are the uncorrelated
      directions of maximal variance and eigenvalues are the variances they
      carry.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.covariance-psd
      - quant-tools.linear-algebra.rayleigh-quotient
    relates:
      - id: quant-tools.linear-algebra.projection
        note: >
          Keeping the top $k$ components is an orthogonal projection onto their
          span, and it is the projection of that rank losing the least squared
          length.
    tags: []

  - id: quant-tools.linear-algebra.diagonalization-powers
    kind: technique
    prominence: 1
    title: "Matrix powers via diagonalization"
    statement: >
      Suppose the $n \times n$ matrix $A$ has $n$ linearly independent
      eigenvectors — guaranteed when its $n$ eigenvalues are distinct, and
      always true for symmetric $A$. Collect them as the columns of $P$ and put
      the eigenvalues in the diagonal $D$; then $A = PDP^{-1}$ and, telescoping
      the inner factors, $A^{k} = PD^{k}P^{-1}$: raise each eigenvalue to the
      $k$, then conjugate back. The same substitution defines any function of
      $A$, such as $e^{At} = Pe^{Dt}P^{-1}$ or a square root. Reading the
      result: $A^{k}$ is eventually dominated by the largest $|\lambda|$, so
      $A^{k} \to 0$ exactly when every $|\lambda| < 1$, and a matrix with top
      eigenvalue $1$ tends to the corresponding eigendirection. Not every matrix
      qualifies — rows $(1,1)$ and $(0,1)$ have a single eigendirection and need
      Jordan form instead.
    summary: >
      Change to the eigenbasis, where the map is a diagonal rescaling, take
      powers there, change back — and read long-run behaviour off the dominant
      eigenvalue.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.eigen
      - quant-tools.linear-algebra.invertibility
    relates:
      - id: quant-tools.series-calculus.geometric-series
        note: >
          The matrix version of the same sum: $\sum_{k \ge 0} A^{k}$ converges
          to $(I-A)^{-1}$ exactly when every eigenvalue has modulus below $1$,
          which diagonalization reduces to the scalar case term by term.
    tags: []

  - id: quant-tools.linear-algebra.fibonacci-matrix
    kind: example
    prominence: 0
    title: "Fibonacci numbers from a matrix power"
    statement: >
      Let $A$ have rows $(1,1)$ and $(1,0)$. Since
      $A\,(F_{n}, F_{n-1}) = (F_{n}+F_{n-1}, F_{n}) = (F_{n+1}, F_{n})$, the
      power $A^{n}$ has rows $(F_{n+1}, F_{n})$ and $(F_{n}, F_{n-1})$, with
      $F_0 = 0$ and $F_1 = 1$. Its trace is $1$ and determinant $-1$, so
      $\lambda^{2} - \lambda - 1 = 0$ and
      $\lambda = (1 \pm \sqrt{5})/2$: the golden ratio
      $\varphi \approx 1.618$ and $\psi \approx -0.618$. Diagonalizing and
      reading the $(1,2)$ entry gives Binet's formula
      $F_n = (\varphi^{n} - \psi^{n})/\sqrt{5}$; for $n = 5$ that is
      $(11.09 + 0.09)/2.236 = 5$. As $|\psi| < 1$, $F_n$ is the nearest integer
      to $\varphi^{n}/\sqrt{5}$ and $F_{n+1}/F_n \to \varphi$; taking
      determinants of $A^{n}$ gives Cassini's identity
      $F_{n+1}F_{n-1} - F_n^{2} = (-1)^{n}$.
    summary: >
      A linear recurrence is a matrix power: diagonalizing the $2 \times 2$
      Fibonacci matrix produces Binet's closed form and the golden-ratio growth
      rate.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.diagonalization-powers
    relates: []
    tags: []

  - id: quant-tools.linear-algebra.matrix-square-root
    kind: proposition
    prominence: 0
    title: "Square roots and the Cholesky factor of a PSD matrix"
    statement: >
      A symmetric PSD $A = Q\Lambda Q^{T}$ has a unique PSD square root
      $A^{1/2} = Q\Lambda^{1/2}Q^{T}$, taking nonnegative roots of the
      eigenvalues, and it satisfies $A^{1/2}A^{1/2} = A$. Cheaper in practice is
      the Cholesky factorization $A = LL^{T}$ with $L$ lower triangular, which
      is unique with positive diagonal when $A$ is positive definite (for a
      singular PSD matrix a triangular factor still exists but is no longer
      unique). Worked: for the correlation matrix with rows $(1, 0.6)$ and
      $(0.6, 1)$, $L$ has rows $(1, 0)$ and $(0.6, 0.8)$, since
      $0.6^{2} + 0.8^{2} = 1$. Use: if $z$ has uncorrelated unit-variance
      entries then $Lz$ has covariance $LL^{T} = A$, the standard way to
      manufacture correlated draws — and a failed factorization is the signal
      that the input was not a valid covariance matrix.
    summary: >
      Every PSD matrix factors as $LL^{T}$; the triangular Cholesky factor is
      what turns independent noise into draws with a prescribed covariance.
    parent: quant-tools.linear-algebra
    also_under: []
    requires:
      - quant-tools.linear-algebra.psd
    relates: []
    tags: []
