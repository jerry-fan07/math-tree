  - id: quant-tools.optimization.convex-set
    kind: definition
    prominence: 1
    title: "Convex set"
    statement: >
      A set $C \subseteq \mathbb{R}^{n}$ is convex if $tx + (1-t)y \in C$ for
      every $x, y \in C$ and every $t \in [0,1]$: the segment joining two points
      of the set never leaves it. Convex examples: $\mathbb{R}^{n}$, balls
      $\{x : \lVert x - a\rVert \le r\}$, halfspaces $\{x : a'x \le b\}$ (where
      $a'x$ is the inner product), hyperplanes, and the weight simplex
      $\{x : x_i \ge 0, \sum_i x_i = 1\}$. Any intersection of convex sets is
      convex, so a system of linear equalities and inequalities always carves out
      a convex feasible region; unions and spheres
      $\{x : \lVert x\rVert = 1\}$ are not convex.
    summary: >
      A set containing the whole segment between any two of its points — the
      shape a feasible region must have before convex optimization applies.
    parent: quant-tools.optimization
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-tools.optimization.convexity
    kind: definition
    prominence: 2
    title: "Convex function"
    statement: >
      $f : C \to \mathbb{R}$ on a convex set $C$ is convex if
      $f(tx + (1-t)y) \le t f(x) + (1-t) f(y)$ for all $x, y \in C$ and
      $t \in [0,1]$ — every chord lies on or above the graph — equivalently, if
      the epigraph $\{(x,s) : s \ge f(x)\}$ is a convex set. Tests for smooth
      $f$: in one variable on an interval, convex $\iff f'' \ge 0$ throughout;
      in $\mathbb{R}^{n}$, convex $\iff$ the Hessian is positive semidefinite
      everywhere. First-order form: $f(y) \ge f(x) + \nabla f(x)'(y - x)$, so
      every tangent underestimates $f$. $f$ is concave when $-f$ is convex.
      Staples: $x^{2}$, $e^{x}$, $|x|$, $-\ln x$, $\lVert x\rVert$ are convex;
      $\ln x$ and $\sqrt{x}$ are concave. Jensen's inequality, filed with the
      probability inequalities, is this definition with a random point replacing
      the two-point average.
    summary: >
      Chords lie above the graph — the one structural assumption that turns a
      minimization into a solvable problem.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.convex-set
    relates: []
    tags: []

  - id: quant-tools.optimization.convex-operations
    kind: proposition
    prominence: 0
    title: "Operations that preserve convexity"
    statement: >
      Let $f$ and $g$ be convex on a convex set. Then: $af + bg$ is convex for
      $a, b \ge 0$; the pointwise maximum or supremum of any family of convex
      functions is convex, because epigraphs intersect; $x \mapsto f(Ax + b)$ is
      convex for any matrix $A$ and vector $b$; and $h(f(x))$ is convex when $h$
      is convex and nondecreasing. The monotonicity of $h$ is essential —
      $h(u) = -u$ with $f(x) = x^{2}$ gives a concave composite. These rules are
      how you certify convexity in an interview without touching a Hessian: a
      sum of squares plus a norm penalty is convex term by term, and a worst-case
      objective $\max_i f_i(x)$ inherits convexity from its pieces.
    summary: >
      Nonnegative sums, pointwise maxima, affine substitutions and monotone
      convex compositions all stay convex — enough to certify most objectives
      by inspection.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.convexity
    relates: []
    tags: []

  - id: quant-tools.optimization.strict-convexity
    kind: proposition
    prominence: 1
    title: "Strict convexity and uniqueness of the minimizer"
    statement: >
      $f$ is strictly convex if the chord inequality is strict for $x \ne y$ and
      $t \in (0,1)$. Then $f$ has at most one minimizer on a convex set $C$: if
      $x \ne y$ both attained the minimum value $m$, the midpoint would give
      $f((x+y)/2) < m$, which is impossible. Sufficient conditions: $f'' > 0$
      everywhere in one variable, or a positive definite Hessian everywhere in
      $\mathbb{R}^{n}$. These are sufficient, not necessary — $x^{4}$ is strictly
      convex although $f''(0) = 0$. Uniqueness is not existence: $e^{x}$ is
      strictly convex on $\mathbb{R}$ with no minimizer at all. You need a closed
      bounded domain, or coercivity ($f(x) \to \infty$ as
      $\lVert x\rVert \to \infty$), to guarantee that a minimizer exists.
    summary: >
      Strict convexity buys you at most one minimizer; you still have to argue
      separately that one exists.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.convexity
    relates: []
    tags: []

  - id: quant-tools.optimization.stationary-points
    kind: definition
    prominence: 0
    title: "Minima, maxima and stationary points"
    statement: >
      $x^{*} \in S$ is a global minimizer of $f$ over $S$ if
      $f(x^{*}) \le f(x)$ for every $x \in S$, and a local minimizer if that
      holds for every $x \in S$ within some ball around $x^{*}$. For
      differentiable $f$, a point with $\nabla f(x) = 0$ is called stationary or
      critical. In the interior, stationary points come in three kinds: local
      minima, local maxima, and saddles — $f(x,y) = x^{2} - y^{2}$ at the origin
      is a minimum along the $x$-axis and a maximum along the $y$-axis.
      Maximizing $f$ is minimizing $-f$, so one theory serves both. Keep the
      distinction between the optimal value $\min_x f(x)$ and the argument
      $\arg\min_x f(x)$, which may be a set or empty.
    summary: >
      The vocabulary: local versus global, minimizer versus minimum value, and
      the stationary points where the gradient dies.
    parent: quant-tools.optimization
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-tools.optimization.local-global
    kind: proposition
    prominence: 1
    title: "For convex problems, local means global"
    statement: >
      Let $f$ be convex on a convex set $C$. Then every local minimizer of $f$
      over $C$ is a global minimizer, and the set of minimizers is itself
      convex. Proof: suppose $x$ is a local minimizer and $f(y) < f(x)$ for some
      $y \in C$. For small $t > 0$ the point $x + t(y - x)$ lies in $C$, lies in
      every ball around $x$, and satisfies
      $f(x + t(y-x)) \le (1-t)f(x) + t f(y) < f(x)$ — contradicting local
      minimality. This is the whole reason convex problems count as solved: there
      are no local traps, so any descent procedure that stops has finished.
      Nonconvex objectives — most machine-learning losses, portfolio problems
      with cardinality or integer constraints — carry no such guarantee.
    summary: >
      Convexity abolishes local traps: find a point no worse than its neighbours
      and you have found the global optimum.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.convexity
      - quant-tools.optimization.stationary-points
    relates: []
    tags: []

  - id: quant-tools.optimization.foc
    kind: proposition
    prominence: 2
    title: "First-order condition"
    statement: >
      Let $f$ be differentiable on an open set $U$. If $x^{*} \in U$ is a local
      minimizer or maximizer of $f$, then $\nabla f(x^{*}) = 0$. The condition is
      necessary but not sufficient by itself: $f(x) = x^{3}$ is stationary at
      $0$, which is neither. It becomes sufficient under convexity — if $f$ is
      convex on a convex set $C$ and $x^{*}$ is an interior point of $C$ with
      $\nabla f(x^{*}) = 0$, then the tangent-underestimator inequality gives
      $f(y) \ge f(x^{*}) + \nabla f(x^{*})'(y - x^{*}) = f(x^{*})$ for every
      $y \in C$, so $x^{*}$ is a global minimizer. The interview recipe:
      differentiate, set to zero, solve, then justify the answer by convexity or
      by a second-order check rather than by assertion.
    summary: >
      Set the gradient to zero — necessary at any interior optimum, and under
      convexity enough to certify a global minimum.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.local-global
    relates: []
    tags: []

  - id: quant-tools.optimization.boundary-check
    kind: technique
    prominence: 0
    title: "The first-order condition misses boundaries and kinks"
    statement: >
      $\nabla f = 0$ finds interior optima of differentiable functions and
      nothing else, so before answering check three other places. (1) The
      boundary of the feasible set: minimizing $f(x) = x$ on $[0,1]$ has no
      stationary point, and the answer is the endpoint $x = 0$. (2) Points where
      $f$ is not differentiable: $|x|$ is minimized at its kink. (3) Infinity:
      $f(x) = x^{3} - 3x$ has a genuine local minimum at $x = 1$ with value $-2$,
      yet is unbounded below on $\mathbb{R}$, so the local minimum is not the
      answer. Existence is safe when the domain is closed and bounded and $f$ is
      continuous, or when $f$ is continuous and coercive. Habit: list the
      candidate set — stationary points, kinks, endpoints — evaluate $f$ on all
      of it, and compare the numbers.
    summary: >
      Stationarity is only one source of candidates; endpoints, kinks and
      unboundedness are where the wrong answer usually comes from.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.foc
    relates: []
    tags: []

  - id: quant-tools.optimization.gradient-hessian
    kind: definition
    prominence: 1
    title: "Gradient, Hessian and the second-order expansion"
    statement: >
      For $f : \mathbb{R}^{n} \to \mathbb{R}$, the gradient $\nabla f(x)$ is the
      vector of first partials $\partial f/\partial x_i$ and the Hessian $H(x)$
      is the $n \times n$ matrix of second partials
      $\partial^{2} f/\partial x_i \partial x_j$, symmetric whenever those are
      continuous. The second-order Taylor expansion reads
      $f(x + h) = f(x) + \nabla f(x)'h + \tfrac{1}{2} h'H(x)h +
      o(\lVert h\rVert^{2})$. Two derivatives are worth memorizing:
      $\nabla (b'x) = b$, and $\nabla (x'Ax) = (A + A')x$, which is $2Ax$ for
      symmetric $A$, whose Hessian is then $2A$. The quadratic form $h'H(x)h$ is
      the object that decides the local shape of $f$ at a stationary point.
    summary: >
      The multivariate first and second derivatives, and the expansion in which
      the Hessian appears as a quadratic form.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.series-calculus.taylor
      - quant-tools.linear-algebra.quadratic-form
    relates: []
    tags: []

  - id: quant-tools.optimization.soc
    kind: proposition
    prominence: 1
    title: "Second-order conditions"
    statement: >
      Let $f$ be twice continuously differentiable near a stationary point
      $x^{*}$, and write $H = H(x^{*})$. Sufficient: $H$ positive definite
      $\Rightarrow$ $x^{*}$ is a strict local minimum; $H$ negative definite
      $\Rightarrow$ strict local maximum; $H$ indefinite (eigenvalues of both
      signs) $\Rightarrow$ saddle. Necessary: at a local minimum $H$ must be
      positive semidefinite. The singular semidefinite case is genuinely
      inconclusive — $x^{4}$ and $-x^{4}$ both have vanishing second derivative
      at $0$. Global version: if $H(x)$ is positive semidefinite at every point
      of a convex domain then $f$ is convex there, and any stationary point is a
      global minimum. Two-variable shortcut: a symmetric $H$ with rows $(a,b)$
      and $(b,c)$ is positive definite exactly when $a > 0$ and $ac - b^{2} > 0$.
    summary: >
      Read the curvature off the Hessian: positive definite gives a minimum,
      indefinite gives a saddle, and semidefinite-singular decides nothing.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.foc
      - quant-tools.optimization.gradient-hessian
      - quant-tools.linear-algebra.psd
    relates: []
    tags: []

  - id: quant-tools.optimization.quadratic-min
    kind: proposition
    prominence: 1
    title: "Minimizing a quadratic"
    statement: >
      One variable: $q(x) = ax^{2} + bx + c$ with $a > 0$ has its unique minimum
      at $x^{*} = -b/(2a)$, of value $c - b^{2}/(4a)$; with $a < 0$ that point is
      the maximum; with $a = 0$ and $b \ne 0$ the function is unbounded both
      ways. In $\mathbb{R}^{n}$, take $q(x) = \tfrac{1}{2}x'Ax - b'x + c$ with
      $A$ symmetric, so that $\nabla q(x) = Ax - b$ and the Hessian is $A$. If
      $A$ is positive definite the unique global minimizer is $x^{*} = A^{-1}b$,
      with minimum value $c - \tfrac{1}{2}b'A^{-1}b$. If $A$ is positive
      semidefinite and singular, minimizers exist exactly when $b$ lies in the
      range of $A$, and then form an affine set; if $A$ has any negative
      eigenvalue, $q$ is unbounded below.
    summary: >
      Every quadratic minimization is $x^{*} = A^{-1}b$ with value
      $c - \tfrac{1}{2}b'A^{-1}b$ — the formula behind least squares,
      minimum-variance portfolios and Gaussian exponents.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.soc
    relates: []
    tags: []

  - id: quant-tools.optimization.complete-square
    kind: technique
    prominence: 1
    title: "Completing the square"
    statement: >
      Reach for this whenever a quadratic sits inside an optimization or inside
      an exponent; it gives the vertex with no calculus at all.
      $ax^{2} + bx + c = a\left(x + \dfrac{b}{2a}\right)^{2} + c -
      \dfrac{b^{2}}{4a}$, and in vector form, for symmetric positive definite
      $A$, $\tfrac{1}{2}x'Ax - b'x = \tfrac{1}{2}(x - A^{-1}b)'A(x - A^{-1}b) -
      \tfrac{1}{2}b'A^{-1}b$. Worked: $3x^{2} - 12x + 7 = 3(x-2)^{2} - 5$, so the
      minimum is $-5$ at $x = 2$. The same move evaluates Gaussian integrals,
      since $-\alpha x^{2} + \beta x = -\alpha(x - \beta/(2\alpha))^{2} +
      \beta^{2}/(4\alpha)$ gives
      $\int_{-\infty}^{\infty} e^{-\alpha x^{2} + \beta x}\,dx =
      \sqrt{\pi/\alpha}\;e^{\beta^{2}/(4\alpha)}$ for $\alpha > 0$ — the standard
      route to normal moment generating functions.
    summary: >
      Rewrite a quadratic as a perfect square plus a constant: the vertex, the
      minimum value and the Gaussian integral all fall out at once.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.quadratic-min
    relates: []
    tags: []

  - id: quant-tools.optimization.quadratic-example
    kind: example
    prominence: 0
    title: "A two-variable quadratic minimized to a number"
    statement: >
      Minimize $f(x,y) = 2x^{2} + 2xy + 3y^{2} - 4x - 6y$. In the form
      $\tfrac{1}{2}x'Ax - b'x$ the Hessian $A$ has rows $(4,2)$ and $(2,6)$ and
      $b = (4,6)$. Since $4 > 0$ and $\det A = 24 - 4 = 20 > 0$, $A$ is positive
      definite, $f$ is strictly convex, and the stationary point is the global
      minimum. Setting $4x + 2y - 4 = 0$ and $2x + 6y - 6 = 0$ gives
      $y = 2 - 2x$, then $2x + 12 - 12x = 6$, so $x = 3/5$ and $y = 4/5$. The
      minimum value is $f(3/5, 4/5) = -18/5 = -3.6$. Cross-check against
      $-\tfrac{1}{2}b'A^{-1}b = -\tfrac{1}{2}b'x^{*} =
      -\tfrac{1}{2}(4 \cdot 3/5 + 6 \cdot 4/5) = -18/5$.
    summary: >
      Two partial derivatives, one determinant check, and the answer is
      $-3.6$ at $(0.6, 0.8)$ — with the matrix formula as a free cross-check.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.quadratic-min
    relates: []
    tags: []

  - id: quant-tools.optimization.least-squares
    kind: example
    prominence: 1
    title: "Least squares as a quadratic minimization"
    statement: >
      Minimize $S(\beta) = \lVert y - X\beta\rVert^{2} = y'y - 2\beta'X'y +
      \beta'X'X\beta$ over $\beta$. This is exactly the quadratic template with
      $A = 2X'X$ and $b = 2X'y$: the Hessian $2X'X$ is positive semidefinite
      always and positive definite exactly when $X$ has full column rank, so $S$
      is convex and stationarity settles it. Then
      $\nabla S = 2X'X\beta - 2X'y = 0$, the normal equations. Worked, fitting
      $y = \beta_0 + \beta_1 x$ to the points $(1,1), (2,3), (3,4)$: $X'X$ has
      rows $(3,6)$ and $(6,14)$ and $X'y = (8,19)$, so $3\beta_0 + 6\beta_1 = 8$
      and $6\beta_0 + 14\beta_1 = 19$, giving $\beta_1 = 3/2$ and
      $\beta_0 = -1/3$.
    summary: >
      Fitting a line is minimizing one convex quadratic; the normal equations are
      its first-order condition, here giving slope $1.5$ and intercept $-1/3$.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.quadratic-min
    relates:
      - id: quant-tools.linear-algebra.projection
        note: >
          The same minimizer seen geometrically: the fitted vector $X\hat\beta$
          is the orthogonal projection of $y$ onto the column space of $X$, and
          the normal equations say the residual is perpendicular to that space.
    tags: []

  - id: quant-tools.optimization.lagrange
    kind: technique
    prominence: 2
    title: "Lagrange multipliers"
    statement: >
      To optimize $f(x)$ subject to equality constraints
      $g_1(x) = 0, \dots, g_m(x) = 0$, with $f$ and the $g_j$ continuously
      differentiable, solve
      $\nabla f(x^{*}) = \sum_{j} \lambda_j \nabla g_j(x^{*})$ together with the
      $m$ constraints: $n + m$ equations in the $n$ coordinates and the $m$
      multipliers. Equivalently, set every partial derivative of the Lagrangian
      $L(x,\lambda) = f(x) - \sum_j \lambda_j g_j(x)$ to zero; the sign carried
      by an equality multiplier is pure convention. Geometry: at an optimum the
      gradient of $f$ has no component along the constraint surface, so it lies
      in the span of the constraint normals. Regularity is required — the
      $\nabla g_j(x^{*})$ must be linearly independent — and the conditions are
      only necessary, so compare the values at all candidates and rule out
      unboundedness separately.
    summary: >
      At a constrained optimum the objective's gradient is a combination of the
      constraint gradients; solve that system alongside the constraints.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.foc
      - quant-tools.optimization.gradient-hessian
    relates: []
    tags: []

  - id: quant-tools.optimization.shadow-price
    kind: proposition
    prominence: 1
    title: "The multiplier is a shadow price"
    statement: >
      Let $V(c)$ be the optimal value of $f(x)$ subject to $g(x) = c$, attained
      at $x^{*}(c)$ with multiplier $\lambda^{*}(c)$ in the convention
      $L = f - \lambda(g - c)$, and suppose these vary differentiably and the
      constraint gradient is nonzero. Then $V'(c) = \lambda^{*}(c)$: the
      multiplier is the marginal value of one more unit of the constrained
      resource — budget, capital, risk limit — and carries units of objective per
      unit of constraint. The general statement (envelope theorem) is that if
      $f$ and $g$ depend on a parameter $\theta$ then
      $dV/d\theta = \partial L/\partial \theta$ evaluated at the optimum: the
      induced movement of $x^{*}$ contributes nothing, because the first-order
      condition annihilates it.
    summary: >
      $\lambda$ prices the constraint: it is exactly how much the optimal value
      improves per unit of slack you are given.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.lagrange
    relates: []
    tags: []

  - id: quant-tools.optimization.lagrange-example
    kind: example
    prominence: 1
    title: "A constrained minimum worked to a number"
    statement: >
      Minimize $f(x,y,z) = x^{2} + y^{2} + z^{2}$ subject to
      $x + 2y + 3z = 14$ — the squared distance from the origin to a plane. With
      $L = f - \lambda(x + 2y + 3z - 14)$ the stationarity conditions are
      $2x = \lambda$, $2y = 2\lambda$, $2z = 3\lambda$, so
      $(x,y,z) = (\lambda/2)(1,2,3)$. The constraint gives
      $(\lambda/2)(1 + 4 + 9) = 14$, hence $\lambda = 2$, $(x,y,z) = (1,2,3)$ and
      minimum value $1 + 4 + 9 = 14$. In general minimizing
      $\lVert x\rVert^{2}$ subject to $a'x = c$ gives
      $x^{*} = c\,a/\lVert a\rVert^{2}$ and value $c^{2}/\lVert a\rVert^{2}$.
      Shadow-price check: $V(c) = c^{2}/14$, so $V'(14) = 2 = \lambda$, and
      raising the right-hand side to $15$ lifts the minimum to
      $225/14 \approx 16.07$.
    summary: >
      The nearest point of the plane $x + 2y + 3z = 14$ to the origin is
      $(1,2,3)$ at squared distance $14$, with multiplier $\lambda = 2$ pricing
      the constraint.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.shadow-price
    relates: []
    tags: []

  - id: quant-tools.optimization.kkt
    kind: proposition
    prominence: 1
    title: "Inequality constraints and the KKT conditions"
    statement: >
      For minimize $f(x)$ subject to $g_i(x) \le 0$ and $h_j(x) = 0$, write
      $L = f + \sum_i \mu_i g_i + \sum_j \lambda_j h_j$. Under a constraint
      qualification, a local minimizer $x^{*}$ satisfies: stationarity
      $\nabla_x L = 0$; primal feasibility; dual feasibility $\mu_i \ge 0$; and
      complementary slackness $\mu_i\,g_i(x^{*}) = 0$, so each inequality is
      either binding with a positive price or slack with multiplier $0$. Unlike
      the equality case, the sign $\mu_i \ge 0$ is not a convention — relaxing a
      binding constraint can only help. When $f$ and the $g_i$ are convex and the
      $h_j$ affine, and some strictly feasible point exists, KKT is sufficient as
      well as necessary. Practical recipe: guess the binding set, solve the
      resulting equality problem, then verify the guess.
    summary: >
      Equality-constrained Lagrange plus nonnegative multipliers and
      complementary slackness — each inequality either binds or is ignored.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.lagrange
    relates: []
    tags: []

  - id: quant-tools.optimization.flat-optimum
    kind: intuition
    prominence: 1
    title: "Optima are flat"
    statement: >
      At an interior optimum the gradient vanishes, so
      $f(x^{*} + h) = f(x^{*}) + \tfrac{1}{2}h'Hh + o(\lVert h\rVert^{2})$: a
      relative error of size $\varepsilon$ in your choice of $x$ costs only order
      $\varepsilon^{2}$ in the objective. Maximizing $f(x) = x(10 - x)$ gives
      $x^{*} = 5$ with value $25$; a $20\%$ error, $x = 6$, still returns $24$, a
      loss of $4\%$. This is why inputs to an optimizer need less precision than
      its output suggests — half-Kelly stakes, rounded hedge ratios and coarse
      portfolio weights give up almost nothing. The flip side is that a flat
      objective is nearly uninformative about $x^{*}$, so estimation noise can
      move the argmax a long way, which is exactly why optimizers run on
      estimated covariances produce unstable weights.
    summary: >
      Near an optimum the objective is quadratically flat: input errors cost you
      little, but the location of the optimum is correspondingly ill-determined.
    parent: quant-tools.optimization
    also_under: []
    requires:
      - quant-tools.optimization.soc
    relates:
      - id: quant-tools.optimization.shadow-price
        note: >
          Two halves of the same first-order accounting at an optimum: moving the
          decision variable is free to first order, while moving the constraint
          level costs exactly the multiplier per unit.
    tags: []
