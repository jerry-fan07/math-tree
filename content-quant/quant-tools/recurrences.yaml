nodes:
  - id: quant-tools.recurrences
    kind: subbranch
    title: "Recurrences & First-Step Analysis"
    summary: >
      Turning sequential randomness into equations — first-step
      analysis, linear recurrences, and the pattern-waiting classics.
    parent: quant-tools
