nodes:
  - id: quant-tools.series-calculus
    kind: subbranch
    title: "Series, Sums & Special Integrals"
    summary: >
      Closed forms and asymptotics that price out expectations by hand —
      geometric and power sums, Taylor expansions, Stirling, and the
      Gaussian integral.
    parent: quant-tools
    also_under: []
    tags: []

  - id: quant-tools.series-calculus.arithmetic-series
    kind: proposition
    prominence: 0
    title: "Arithmetic series"
    statement: >
      If $a_k = a + (k-1)d$ then $\sum_{k=1}^{n} a_k
      = \dfrac{n(a_1 + a_n)}{2} = na + d\,\dfrac{n(n-1)}{2}$ — the number of
      terms times the average of the first and the last. Gauss's proof: add the
      sum to its own reversal and read off $n$ copies of $a_1 + a_n$. The cases
      to know cold are $1 + 2 + \cdots + n = \dfrac{n(n+1)}{2}$, so
      $1 + \cdots + 100 = 5050$; the first $n$ odd numbers sum to $n^{2}$; the
      first $n$ even numbers sum to $n(n+1)$. Any sum whose consecutive
      differences are constant is arithmetic, so difference the terms before
      reaching for anything harder.
    summary: >
      Equally spaced terms sum to the count times the midpoint value, and
      $1 + \cdots + n = n(n+1)/2$ is the instance you use daily.
    parent: quant-tools.series-calculus
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-tools.series-calculus.geometric-series
    kind: theorem
    prominence: 2
    title: "Geometric series"
    statement: >
      For $r \ne 1$ the finite sum is $\sum_{k=0}^{n-1} a r^{k}
      = a\,\dfrac{1 - r^{n}}{1 - r}$, proved by subtracting $rS$ from $S$ so
      that all but two terms cancel; for $r = 1$ it is $na$. If $|r| < 1$ then
      $r^{n} \to 0$ and the infinite series converges,
      $\sum_{k=0}^{\infty} a r^{k} = \dfrac{a}{1 - r}$; if $|r| \ge 1$ and
      $a \ne 0$ the terms do not vanish and it diverges. Tail form, used
      constantly: $\sum_{k \ge m} r^{k} = \dfrac{r^{m}}{1 - r}$. Worked:
      $\sum_{k \ge 1} 2^{-k} = 1$, $\sum_{k \ge 1} 3^{-k} = \dfrac{1}{2}$, and
      $\sum_{k \ge 0} (0.9)^{k} = 10$.
    summary: >
      A constant ratio between terms gives $a(1-r^{n})/(1-r)$ finitely and
      $a/(1-r)$ when $|r| < 1$ — the most reused closed form in the interview.
    parent: quant-tools.series-calculus
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-tools.series-calculus.geometric-derivative
    kind: technique
    prominence: 1
    title: "Differentiating the geometric series"
    statement: >
      When a geometric sum carries a polynomial weight, differentiate rather
      than resum. A power series may be differentiated term by term strictly
      inside its radius of convergence, so from
      $\sum_{k \ge 0} x^{k} = \dfrac{1}{1-x}$ on $|x| < 1$ one gets
      $\sum_{k \ge 1} k x^{k-1} = \dfrac{1}{(1-x)^{2}}$, hence
      $\sum_{k \ge 1} k x^{k} = \dfrac{x}{(1-x)^{2}}$, and differentiating once
      more, $\sum_{k \ge 1} k^{2} x^{k} = \dfrac{x(1+x)}{(1-x)^{3}}$. Worked at
      $x = 1/2$: $\sum_{k \ge 1} k 2^{-k} = 2$ and
      $\sum_{k \ge 1} k^{2} 2^{-k} = 6$. Integrating instead gives
      $\sum_{k \ge 1} \dfrac{x^{k}}{k} = -\ln(1-x)$.
    summary: >
      Differentiate $1/(1-x)$ term by term to price sums like $\sum k r^{k}$;
      at $r = 1/2$ the answers are $2$ and $6$.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.geometric-series
    relates:
      - id: quant-tools.series-calculus.sum-exchange
        note: >
          The same sums fall out of a double-counting swap with no calculus:
          write $k = \sum_{j=1}^{k} 1$, reverse the order, and
          $\sum_{k \ge 1} k r^{k}$ becomes
          $\sum_{j \ge 1} \dfrac{r^{j}}{1-r} = \dfrac{r}{(1-r)^{2}}$.
    tags: []

  - id: quant-tools.series-calculus.telescoping
    kind: technique
    prominence: 1
    title: "Telescoping sums"
    statement: >
      If the summand can be written as a difference of consecutive terms of some
      sequence, then $\sum_{k=1}^{n} (b_{k+1} - b_k) = b_{n+1} - b_1$ and
      everything interior cancels. Reach for it whenever a rational summand has
      a factorable denominator — partial fractions manufacture the difference.
      Worked: $\dfrac{1}{k(k+1)} = \dfrac{1}{k} - \dfrac{1}{k+1}$, so
      $\sum_{k=1}^{n} \dfrac{1}{k(k+1)} = 1 - \dfrac{1}{n+1} \to 1$; and
      $\dfrac{1}{k(k+2)} = \dfrac{1}{2}\left(\dfrac{1}{k} -
      \dfrac{1}{k+2}\right)$ sums to $\dfrac{3}{4} -
      \dfrac{1}{2}\left(\dfrac{1}{n+1} + \dfrac{1}{n+2}\right) \to \dfrac{3}{4}$.
      Products telescope the same way through ratios.
    summary: >
      Write the summand as a difference of consecutive terms and only the two
      ends survive — $\sum 1/(k(k+1)) = 1$ is the canonical instance.
    parent: quant-tools.series-calculus
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-tools.series-calculus.power-sums
    kind: proposition
    prominence: 1
    title: "Sums of powers"
    statement: >
      $\sum_{k=1}^{n} k = \dfrac{n(n+1)}{2}$,
      $\sum_{k=1}^{n} k^{2} = \dfrac{n(n+1)(2n+1)}{6}$, and
      $\sum_{k=1}^{n} k^{3} = \left(\dfrac{n(n+1)}{2}\right)^{2}$ — the cube sum
      is the square of the first sum. Derivation by telescoping: summing
      $(k+1)^{3} - k^{3} = 3k^{2} + 3k + 1$ over $k = 1,\dots,n$ gives
      $(n+1)^{3} - 1 = 3\sum k^{2} + 3\sum k + n$, which solves for
      $\sum k^{2}$; starting from $(k+1)^{4} - k^{4}$ yields $\sum k^{3}$ the
      same way. At $n = 10$ the three values are $55$, $385$ and $3025$.
      Asymptotically $\sum_{k=1}^{n} k^{p} \sim \dfrac{n^{p+1}}{p+1}$, matching
      $\int_{0}^{n} x^{p}\,dx$.
    summary: >
      The three closed forms every interview assumes, the telescoping recipe
      that generates the next one, and the $n^{p+1}/(p+1)$ growth rate.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.arithmetic-series
      - quant-tools.series-calculus.telescoping
    relates: []
    tags: []

  - id: quant-tools.series-calculus.integral-comparison
    kind: technique
    prominence: 1
    title: "Comparing a sum to an integral"
    statement: >
      Let $f$ be nonnegative on $[1,\infty)$. If $f$ is nonincreasing then
      $\int_{1}^{n+1} f(x)\,dx \le \sum_{k=1}^{n} f(k)
      \le f(1) + \int_{1}^{n} f(x)\,dx$; if $f$ is nondecreasing then
      $\int_{1}^{n} f(x)\,dx \le \sum_{k=1}^{n} f(k)
      \le \int_{1}^{n} f(x)\,dx + f(n)$. Each term is trapped by the unit strip
      beside it. Two payoffs: the integral test, so $\sum k^{-p}$ converges
      exactly when $p > 1$; and cheap asymptotics, since
      $\int_{1}^{n} \dfrac{dx}{x} = \ln n$ pins the harmonic sum and
      $\int_{1}^{n} \ln x\,dx = n\ln n - n + 1$ pins $\ln(n!)$.
    summary: >
      Sandwich a monotone sum between two integrals — the fastest route to
      whether a series converges and how big its partial sums are.
    parent: quant-tools.series-calculus
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-tools.series-calculus.harmonic-numbers
    kind: proposition
    prominence: 1
    title: "Harmonic numbers"
    statement: >
      $H_n = \sum_{k=1}^{n} \dfrac{1}{k}$ diverges — grouping blocks gives
      $H_{2^{m}} \ge 1 + \dfrac{m}{2}$ — but only logarithmically:
      $H_n = \ln n + \gamma + \dfrac{1}{2n} - \dfrac{1}{12n^{2}} + O(n^{-4})$,
      where $\gamma \approx 0.5772$ is the Euler–Mascheroni constant. Values
      worth carrying: $H_{10} \approx 2.929$, $H_{100} \approx 5.187$,
      $H_{1000} \approx 7.485$; doubling $n$ adds only
      $\ln 2 \approx 0.693$. The alternating series does converge,
      $\sum_{k \ge 1} \dfrac{(-1)^{k+1}}{k} = \ln 2$. A harmonic sum in an
      answer is the signature of a coupon-collecting or record-counting setup.
    summary: >
      The harmonic sum grows like $\ln n + 0.577$ — slow divergence, and the
      number that appears whenever an answer counts records or coupons.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.integral-comparison
    relates:
      - id: quant-tools.series-calculus.telescoping
        note: >
          Side by side these fix where the convergence boundary sits:
          $\sum 1/(k(k+1))$ telescopes to $1$, while deleting one factor to get
          $\sum 1/k$ diverges — a whisker apart in size, opposite in behaviour.
    tags: []

  - id: quant-tools.series-calculus.taylor
    kind: theorem
    prominence: 2
    title: "Taylor's theorem"
    statement: >
      Let $f$ be $n+1$ times differentiable on an open interval containing $a$
      and $x$. Then $f(x) = \sum_{k=0}^{n} \dfrac{f^{(k)}(a)}{k!}(x-a)^{k}
      + R_n(x)$ with Lagrange remainder
      $R_n(x) = \dfrac{f^{(n+1)}(\xi)}{(n+1)!}(x-a)^{n+1}$ for some $\xi$
      strictly between $a$ and $x$; taking $a = 0$ gives the Maclaurin form. The
      canonical instance is $e^{x} = \sum_{k \ge 0} \dfrac{x^{k}}{k!}$, whose
      remainder tends to $0$ for every real $x$. Practical reading: the error of
      a truncation is the size of the first omitted term up to the swing of the
      next derivative, so each extra term buys another factor of $|x-a|$ in
      accuracy.
    summary: >
      A smooth function equals its polynomial of derivatives at a point plus a
      remainder shaped like the first dropped term — the licence behind every
      small-$x$ approximation.
    parent: quant-tools.series-calculus
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-tools.series-calculus.standard-series
    kind: proposition
    prominence: 1
    title: "The standard Maclaurin expansions"
    statement: >
      The expansions to have memorized, with the ranges where they are legal:
      $e^{x} = \sum_{k \ge 0} \dfrac{x^{k}}{k!}$ for all $x$;
      $\ln(1+x) = x - \dfrac{x^{2}}{2} + \dfrac{x^{3}}{3} - \cdots$ for
      $-1 < x \le 1$; $(1+x)^{\alpha} = 1 + \alpha x +
      \dfrac{\alpha(\alpha-1)}{2}x^{2} + \cdots$ for $|x| < 1$;
      $\dfrac{1}{1-x} = \sum_{k \ge 0} x^{k}$ for $|x| < 1$;
      $\sin x = x - \dfrac{x^{3}}{6} + \dfrac{x^{5}}{120} - \cdots$ and
      $\cos x = 1 - \dfrac{x^{2}}{2} + \dfrac{x^{4}}{24} - \cdots$ for all $x$.
      Worked: $e^{0.1} \approx 1 + 0.1 + 0.005 + 0.000167 = 1.10517$ and
      $\sqrt{1.02} \approx 1 + 0.01 - 0.00005 = 1.00995$.
    summary: >
      The six series worth reciting, each with the interval on which it is
      valid, plus two numerics that land within a rounding of the truth.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.taylor
      - quant-tools.series-calculus.geometric-series
    relates: []
    tags: []

  - id: quant-tools.series-calculus.exp-limit
    kind: proposition
    prominence: 1
    title: "The limit (1 + x/n)^n → e^x"
    statement: >
      For fixed real $x$, $\left(1 + \dfrac{x}{n}\right)^{n} \to e^{x}$ as
      $n \to \infty$, and more generally $\left(1 + \dfrac{a_n}{n}\right)^{n}
      \to e^{x}$ whenever $a_n \to x$. Proof: take logs, so that
      $n\ln\left(1 + \dfrac{x}{n}\right) = x - \dfrac{x^{2}}{2n} + O(n^{-2})
      \to x$, and exponentiate. The same expansion gives the rate,
      $\left(1 + \dfrac{x}{n}\right)^{n} = e^{x}\left(1 - \dfrac{x^{2}}{2n}
      + O(n^{-2})\right)$, so for $x > 0$ the approach is from below and slow:
      $(1 + 1/12)^{12} \approx 2.613$ against $e \approx 2.71828$. Key instance:
      $(1 - 1/n)^{n} \to e^{-1} \approx 0.3679$, the chance a specified item is
      missed by $n$ independent tries that each hit it with probability $1/n$.
    summary: >
      Compounding $n$ times at rate $x/n$ converges to $e^{x}$, and
      $(1 - 1/n)^{n} \to 1/e$ is the "missed every time" probability behind
      derangement and coupon answers.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.standard-series
    relates: []
    tags: []

  - id: quant-tools.series-calculus.sum-exchange
    kind: technique
    prominence: 1
    title: "Exchanging the order of summation"
    statement: >
      $\sum_i \sum_j a_{ij} = \sum_j \sum_i a_{ij}$ holds unconditionally for
      finitely many terms, for infinitely many when every $a_{ij} \ge 0$
      (Tonelli) or when $\sum_{i,j} |a_{ij}| < \infty$ (Fubini); without one of
      these hypotheses it can genuinely fail. Reach for it when the inner limits
      depend on the outer index: sketch the index region and sum along the other
      axis. Worked: $\sum_{k=1}^{n} k = \sum_{k=1}^{n}\sum_{i=1}^{k} 1
      = \sum_{i=1}^{n}\sum_{k=i}^{n} 1 = \sum_{i=1}^{n}(n-i+1)
      = \dfrac{n(n+1)}{2}$. The sum–integral version reads
      $\int_{0}^{1/2}\dfrac{dx}{1-x} = \sum_{k \ge 0}\int_{0}^{1/2} x^{k}\,dx
      = \sum_{k \ge 0}\dfrac{2^{-(k+1)}}{k+1} = \ln 2$.
    summary: >
      Re-bracket a double sum along the other axis — legal for nonnegative or
      absolutely summable terms, and the cheapest way to turn a count into a
      closed form.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.power-sums
      - quant-tools.series-calculus.geometric-series
    relates: []
    tags: []

  - id: quant-tools.series-calculus.gaussian-integral
    kind: theorem
    prominence: 2
    title: "The Gaussian integral"
    statement: >
      $\int_{-\infty}^{\infty} e^{-x^{2}/2}\,dx = \sqrt{2\pi}$. Proof: the
      integrand is nonnegative, so the square of the integral may be written as
      a double integral and evaluated in polar coordinates,
      $I^{2} = \iint e^{-(x^{2}+y^{2})/2}\,dx\,dy
      = \int_{0}^{2\pi}\!\int_{0}^{\infty} e^{-r^{2}/2} r\,dr\,d\theta = 2\pi$,
      and $I > 0$. Scaled forms: $\int_{-\infty}^{\infty} e^{-ax^{2}}dx
      = \sqrt{\dfrac{\pi}{a}}$ for $a > 0$, and completing the square gives
      $\int_{-\infty}^{\infty} e^{-ax^{2}+bx}\,dx
      = \sqrt{\dfrac{\pi}{a}}\;e^{b^{2}/(4a)}$. This is exactly the constant
      that normalizes the normal density.
    summary: >
      The one integral with no elementary antiderivative you must know cold —
      the value is $\sqrt{2\pi}$, obtained by squaring and going polar.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.sum-exchange
    relates: []
    tags: []

  - id: quant-tools.series-calculus.gaussian-moments
    kind: proposition
    prominence: 0
    title: "Moments of the Gaussian density"
    statement: >
      Write $\varphi(x) = \dfrac{1}{\sqrt{2\pi}}e^{-x^{2}/2}$. Odd moments
      vanish by symmetry, and integration by parts gives the recursion
      $\int_{-\infty}^{\infty} x^{2k}\varphi(x)\,dx
      = (2k-1)\int_{-\infty}^{\infty} x^{2k-2}\varphi(x)\,dx$, so the even
      moments are the double factorials $(2k-1)!!$, namely $1, 1, 3, 15, 105$
      for $k = 0,1,2,3,4$. A standard normal therefore has variance $1$ and
      fourth moment $3$, which is where the kurtosis benchmark of $3$ comes
      from. One-sided: $\int_{0}^{\infty} x e^{-x^{2}/2}\,dx = 1$, so the mean
      absolute value is $\sqrt{2/\pi} \approx 0.798$.
    summary: >
      Even moments of the standard Gaussian are $1, 3, 15, 105, \ldots$ and its
      mean absolute value is $\sqrt{2/\pi} \approx 0.8$.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.gaussian-integral
    relates:
      - id: quant-tools.series-calculus.gamma-function
        note: >
          These two moment tables are one table: the substitution
          $t = x^{2}/2$ turns the even Gaussian moments into half-integer values
          of $\Gamma$, so $(2k-1)!!$ and $\Gamma(k + 1/2)$ carry the same
          information.
    tags: []

  - id: quant-tools.series-calculus.gamma-function
    kind: definition
    prominence: 1
    title: "The Gamma function"
    statement: >
      For $z > 0$, $\Gamma(z) = \int_{0}^{\infty} t^{z-1} e^{-t}\,dt$, which
      converges at both ends. Integration by parts gives the functional equation
      $\Gamma(z+1) = z\,\Gamma(z)$, and $\Gamma(1) = 1$, so
      $\Gamma(n) = (n-1)!$ for positive integers — $\Gamma$ interpolates the
      factorial. Half-integers come from the Gaussian: substituting $t = u^{2}$
      turns $\Gamma(1/2)$ into $2\int_{0}^{\infty} e^{-u^{2}}du = \sqrt{\pi}$,
      whence $\Gamma(3/2) = \dfrac{\sqrt{\pi}}{2}$ and
      $\Gamma(5/2) = \dfrac{3\sqrt{\pi}}{4}$. The workhorse consequence is
      $\int_{0}^{\infty} t^{n} e^{-\lambda t}\,dt
      = \dfrac{n!}{\lambda^{n+1}}$ for $\lambda > 0$.
    summary: >
      The factorial extended to real arguments, with $\Gamma(n) = (n-1)!$,
      $\Gamma(1/2) = \sqrt{\pi}$, and the $n!/\lambda^{n+1}$ identity that kills
      polynomial-times-exponential integrals.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.gaussian-integral
    relates: []
    tags: []

  - id: quant-tools.series-calculus.beta-function
    kind: definition
    prominence: 0
    title: "The Beta function"
    statement: >
      For $a, b > 0$, $B(a,b) = \int_{0}^{1} t^{a-1}(1-t)^{b-1}\,dt
      = \dfrac{\Gamma(a)\Gamma(b)}{\Gamma(a+b)}$, visibly symmetric in $a$ and
      $b$. For nonnegative integers the identity reads
      $\int_{0}^{1} t^{m}(1-t)^{n}\,dt = \dfrac{m!\,n!}{(m+n+1)!}$, which is
      worth memorizing on its own — for instance
      $\int_{0}^{1} t^{3}(1-t)^{2}\,dt = \dfrac{3!\,2!}{6!}
      = \dfrac{12}{720} = \dfrac{1}{60}$. It is the integral that normalizes the
      Beta density, and it is why ordered samples from a uniform distribution
      have such clean means.
    summary: >
      The unit-interval companion of $\Gamma$:
      $\int_0^1 t^{m}(1-t)^{n}dt = m!\,n!/(m+n+1)!$, the integral behind every
      ordered-uniform computation.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.gamma-function
    relates: []
    tags: []

  - id: quant-tools.series-calculus.stirling
    kind: theorem
    prominence: 2
    title: "Stirling's approximation"
    statement: >
      $n! = \sqrt{2\pi n}\left(\dfrac{n}{e}\right)^{n}e^{\theta_n/(12n)}$ for
      some $\theta_n \in (0,1)$; in particular
      $n! \sim \sqrt{2\pi n}\,\left(\dfrac{n}{e}\right)^{n}$, an underestimate
      whose relative error is about $\dfrac{1}{12n}$. The log form is the one
      usually needed: $\ln(n!) = n\ln n - n + \dfrac{1}{2}\ln(2\pi n) + O(1/n)$,
      whose leading part is exactly the integral bound on $\sum \ln k$. It comes
      from Laplace's method applied to
      $\Gamma(n+1) = \int_{0}^{\infty} t^{n}e^{-t}\,dt$, whose integrand peaks
      at $t = n$ and is locally Gaussian — which is where $\sqrt{2\pi}$ enters.
      Worked: $\sqrt{20\pi}\,(10/e)^{10} \approx 3598696$ against the true
      $10! = 3628800$, low by $0.83\%$.
    summary: >
      $n!$ grows like $\sqrt{2\pi n}(n/e)^{n}$, accurate to about $1/(12n)$ —
      the tool that turns any factorial ratio into an evaluable asymptotic.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.integral-comparison
      - quant-tools.series-calculus.gamma-function
    relates: []
    tags: []

  - id: quant-tools.series-calculus.stirling-central-binomial
    kind: example
    prominence: 0
    title: "Central binomial coefficient via Stirling"
    statement: >
      How big is $\binom{2n}{n}$, and how likely is exactly $50$ heads in $100$
      fair tosses? Applying Stirling to $\dfrac{(2n)!}{(n!)^{2}}$ cancels the
      $e^{-n}$ and $n^{n}$ pieces and leaves
      $\binom{2n}{n} \sim \dfrac{4^{n}}{\sqrt{\pi n}}$. At $n = 50$:
      $4^{50} = 2^{100} \approx 1.268 \times 10^{30}$ and
      $\sqrt{50\pi} \approx 12.53$, so
      $\binom{100}{50} \approx 1.011 \times 10^{29}$ against the true
      $1.009 \times 10^{29}$ — high by $0.25\%$, exactly the size of the
      $\dfrac{1}{8n}$ correction. Dividing by $2^{100}$, the chance of exactly
      $50$ heads is $\approx \dfrac{1}{\sqrt{50\pi}} = 0.0798$, versus the exact
      $0.0796$.
    summary: >
      The central binomial coefficient is $4^{n}/\sqrt{\pi n}$ to a quarter of a
      percent, so exactly half heads in $100$ tosses has probability about
      $8\%$.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.stirling
    relates: []
    tags: []

  - id: quant-tools.series-calculus.am-gm
    kind: theorem
    prominence: 1
    title: "AM–GM inequality"
    statement: >
      For nonnegative reals $a_1,\dots,a_n$,
      $\dfrac{a_1 + \cdots + a_n}{n} \ge (a_1 \cdots a_n)^{1/n}$, with equality
      if and only if all the $a_i$ are equal. The two-term case is just
      $(\sqrt{a} - \sqrt{b})^{2} \ge 0$; the general case follows by induction
      or by applying the concavity of $\ln$. Two consequences dominate
      interviews: $x + \dfrac{1}{x} \ge 2$ for $x > 0$, and, for a fixed sum
      $S$, the product of $n$ positive numbers is largest when all equal $S/n$,
      with maximum $(S/n)^{n}$. Worked: split $10$ into three positive parts
      maximizing the product — take each equal to $10/3$, giving
      $\dfrac{1000}{27} \approx 37.04$.
    summary: >
      Arithmetic means beat geometric means unless everything is equal — the
      one-line answer to "maximize the product given the sum".
    parent: quant-tools.series-calculus
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-tools.series-calculus.cauchy-schwarz
    kind: theorem
    prominence: 1
    title: "Cauchy–Schwarz inequality"
    statement: >
      For real $a_i, b_i$,
      $\left(\sum_{i=1}^{n} a_i b_i\right)^{2}
      \le \left(\sum_{i=1}^{n} a_i^{2}\right)
      \left(\sum_{i=1}^{n} b_i^{2}\right)$, with equality exactly when one
      vector is a scalar multiple of the other. Proof:
      $t \mapsto \sum_i (a_i + t b_i)^{2}$ is a nonnegative quadratic in $t$, so
      its discriminant is $\le 0$. The integral form is
      $\left(\int fg\right)^{2} \le \int f^{2} \int g^{2}$. Taking every
      $b_i = 1$ gives $\left|\sum_i a_i\right|
      \le \sqrt{n}\,\sqrt{\sum_i a_i^{2}}$. Worked: maximize $3x + 4y$ subject
      to $x^{2} + y^{2} = 1$ — the bound is $\sqrt{9+16} = 5$, attained at
      $(3/5, 4/5)$.
    summary: >
      An inner product is capped by the product of the lengths, with equality
      only when the vectors line up — the source of every correlation bound.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.am-gm
    relates: []
    tags: []

  - id: quant-tools.series-calculus.asymptotic-hierarchy
    kind: intuition
    prominence: 0
    title: "Which term dominates"
    statement: >
      Order of growth decides what you may throw away, and taking logs settles
      every comparison: $\ln n \ll n^{\alpha} \ll c^{n} \ll n! \ll n^{n}$ for
      any $\alpha > 0$ and any $c > 1$. Stirling makes the third link concrete,
      since $\ln(n!) = n\ln n - n + O(\ln n)$ eventually beats $n \ln c$, so
      $n!/c^{n} \to \infty$ while $c^{n}/n^{\alpha} \to \infty$. At the slow end
      $H_n \sim \ln n$ is the gentlest divergence you will meet, and
      $\sum k^{-p}$ with $p > 1$ does not diverge at all. Habit: name the
      dominant factor before computing anything, so the rest is a correction you
      can size rather than a term you might drop by accident.
    summary: >
      Logs turn growth comparisons into arithmetic —
      $\ln n \ll n^{\alpha} \ll c^{n} \ll n! \ll n^{n}$ — so the dominant term
      is visible before any algebra.
    parent: quant-tools.series-calculus
    also_under: []
    requires:
      - quant-tools.series-calculus.stirling
      - quant-tools.series-calculus.harmonic-numbers
    relates: []
    tags: []
