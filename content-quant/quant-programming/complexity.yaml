  - id: quant-programming.complexity.big-o
    kind: definition
    prominence: 2
    title: "Big-O, Big-Ω, Big-Θ"
    statement: >
      $f(n) = O(g(n))$ means there exist constants $c > 0$ and $n_0$ with
      $f(n) \le c\,g(n)$ for all $n \ge n_0$ — an eventual upper bound up
      to a constant factor. $\Omega$ reverses the inequality for a lower
      bound, and $\Theta$ demands both: $c_1 g(n) \le f(n) \le c_2 g(n)$, a
      tight bound. In practice: drop every constant factor and every
      lower-order term and keep only the fastest-growing piece — $5n^{2} +
      100n + 7$ is $\Theta(n^{2})$. Unqualified "the complexity" defaults
      to worst case unless stated otherwise.
    summary: >
      The asymptotic vocabulary for how cost scales with input size — an
      upper bound ($O$), a lower bound ($\Omega$), or both at once
      ($\Theta$) — with constants and lower-order terms discarded.
    parent: quant-programming.complexity
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-programming.complexity.growth-ranking
    kind: proposition
    prominence: 1
    title: "The growth ladder, timed"
    statement: >
      At $n = 10^{6}$ and roughly $10^{8}$–$10^{9}$ elementary operations
      per second, the ladder $O(1) < O(\log n) < O(\sqrt{n}) < O(n) <
      O(n\log n) < O(n^{2}) < O(2^{n}) < O(n!)$ becomes real time: $O(n)$
      finishes in milliseconds, $O(n\log n) \approx 2\times10^{7}$
      operations is still comfortably under a second, $O(n^{2}) =
      10^{12}$ operations takes hours, and $O(2^{n})$ or $O(n!)$ never
      finish. Rule of thumb for interview bounds: $n \le 10^{8}$ tolerates
      $O(n)$ or $O(n\log n)$, $n \le 10^{4}$ tolerates $O(n^{2})$, and
      $n \le 20$–$25$ tolerates $O(2^{n})$.
    summary: >
      Reading the input size off the growth ladder tells you which
      algorithms are even worth coding — $n^{2}$ at a million elements is
      already too slow.
    parent: quant-programming.complexity
    also_under: []
    requires:
      - quant-programming.complexity.big-o
    relates: []
    tags: []

  - id: quant-programming.complexity.log-halving
    kind: intuition
    prominence: 0
    title: "log n is halving, and it is slow to grow"
    statement: >
      $\log_{2} n$ counts how many times $n$ can be halved before reaching
      $1$ — the number of rounds in binary search, or the depth of a
      balanced binary tree on $n$ items. It grows so slowly that scale
      barely matters: $\log_{2} 10^{6} \approx 19.9$, so a binary search
      among a million items takes about $20$ comparisons, and
      $\log_{2} 10^{9} \approx 30$, so a thousand-fold larger input adds
      only about $10$ more. Treat $\log n$ as "practically constant" — it
      is the one growth rate an interview will rarely worry about
      tightening further.
    summary: >
      Doubling the input size only adds one more comparison to a halving
      process, which is why logarithmic terms barely register in
      practice.
    parent: quant-programming.complexity
    also_under: []
    requires:
      - quant-programming.complexity.big-o
    relates: []
    tags: []

  - id: quant-programming.complexity.divide-conquer-recurrence
    kind: technique
    prominence: 1
    title: "n log n from divide-and-conquer"
    statement: >
      A divide-and-conquer algorithm that splits into $2$ subproblems of
      size $n/2$ and does $O(n)$ work combining them satisfies
      $T(n) = 2T(n/2) + O(n)$. The recursion tree has $\log_{2} n$ levels
      (halving $n$ down to $1$ takes $\log_{2} n$ steps), and each level
      does $O(n)$ total work
      summed across its subproblems, giving $T(n) = O(n\log n)$ — merge
      sort's bound. Drop the linear combine step to $O(1)$ and the same
      tree instead collapses to $T(n) = O(n)$, since the bottom level then
      dominates: whether the combine cost is linear or constant changes
      the whole answer.
    summary: >
      Log n levels of recursion times O(n) work per level is where n log n
      comes from — change the per-level work and the total changes with
      it.
    parent: quant-programming.complexity
    also_under: []
    requires:
      - quant-programming.complexity.log-halving
    relates: []
    tags: []

  - id: quant-programming.complexity.amortized
    kind: definition
    prominence: 1
    title: "Amortized analysis"
    statement: >
      The amortized cost of an operation is the total cost of a sequence
      of $n$ operations divided by $n$, even when individual operations
      vary wildly in cost — it is a guarantee about the whole sequence,
      not any single call. This differs from worst-case-per-operation: a
      dynamic array resize costs $O(n)$ on the operation that triggers it,
      yet spreading that cost over all the pushes since the last resize
      makes the amortized cost per push $O(1)$. Amortized bounds hold for
      every sequence of operations, not merely lucky ones — the guarantee
      survives an adversarial order.
    summary: >
      Average the total cost over the whole sequence of operations rather
      than bounding each one separately — the honest way to price
      occasional expensive steps.
    parent: quant-programming.complexity
    also_under: []
    requires:
      - quant-programming.complexity.big-o
    relates: []
    tags: []

  - id: quant-programming.complexity.doubling-worked
    kind: example
    prominence: 1
    title: "Doubling array: total copies ≤ 2n"
    statement: >
      A dynamic array starts at capacity $1$ and doubles whenever a push
      overflows it, so resizes happen at sizes $1, 2, 4, 8, \dots,
      2^{k}$. Resizing from size $2^{i}$ copies $2^{i}$ old elements, so
      after $n$ pushes the total copying work is
      $1 + 2 + 4 + \dots + 2^{k-1} < 2\cdot 2^{k-1} \le 2n$
      by the geometric series — at most $2$ copies per push on average, on
      top of the $n$ pushes themselves. Concretely, $1024$ pushes trigger
      resizes at $1,2,4,\dots,512$, copying
      $1+2+4+\dots+512 = 1023$ elements in total, not $1024^{2}$: about
      one extra copy per push on top of the push itself, so the amortized
      cost per push is $O(1)$.
    summary: >
      Summing the geometric series of resize costs bounds total copying
      by 2n over n pushes, which is the whole proof that doubling gives
      O(1) amortized inserts.
    parent: quant-programming.complexity
    also_under: []
    requires:
      - quant-programming.complexity.amortized
    relates: []
    tags: []

  - id: quant-programming.complexity.space-time-tradeoff
    kind: intuition
    prominence: 0
    title: "Space–time tradeoffs"
    statement: >
      Many speedups are memory spent to buy time back. A hash-based lookup
      table trades $O(n)$ memory for $O(1)$ expected membership tests
      instead of an $O(n)$ scan; memoization trades memory for time by
      caching results instead of recomputing them; a prefix-sum array
      trades $O(n)$ space for $O(1)$ range-sum queries after $O(n)$
      preprocessing, instead of $O(n)$ per query. The interview question
      "can you do better?" is often answered by asking whether extra
      memory is available to precompute or cache — there is rarely a free
      lunch, only a chosen trade.
    summary: >
      Precomputing or caching turns repeated O(n) work into O(1) lookups
      at the cost of memory — the tradeoff behind hash maps, memoization
      and prefix sums alike.
    parent: quant-programming.complexity
    also_under: []
    requires:
      - quant-programming.complexity.growth-ranking
    relates: []
    tags: []

  - id: quant-programming.complexity.hashing-cost
    kind: proposition
    prominence: 1
    title: "Hashing: expected O(1), and the birthday caveat"
    statement: >
      With a good hash function and a load factor kept bounded (rehashing
      into a doubled table as it fills), insert, lookup and delete take
      expected $O(1)$ time: the expected number of items sharing a bucket
      is the load factor, a constant, so
      $\mathbb{E}[\text{work per operation}]$
      stays $O(1)$ even though a single lookup could in principle scan
      every item. Collisions are still common well before the table is
      full — with $m$ buckets, a birthday-style argument makes some
      collision likely once roughly $\sqrt{m}$ items are inserted.
      Pathological or adversarial hashing collapses every guarantee to
      $O(n)$ per operation.
    summary: >
      Hash tables are O(1) on average, not in the worst case — the same
      birthday-paradox math that predicts shared birthdays predicts
      bucket collisions long before the table fills up.
    parent: quant-programming.complexity
    also_under: []
    requires:
      - quant-programming.complexity.big-o
      - quant-probability.expectation.expectation
      - quant-probability.counting.birthday-problem
    relates: []
    tags: []

  - id: quant-programming.complexity.hash-collision-scale
    kind: example
    prominence: 0
    title: "How few insertions it takes to collide"
    statement: >
      A hash table with $m = 2^{32} \approx 4.3\times10^{9}$ buckets and a
      uniform random hash sounds collision-proof, but the birthday
      approximation says a $50\%$ chance of some collision appears after
      only about $1.2\sqrt{m} \approx 77{,}000$ insertions — five orders
      of magnitude fewer than the bucket count. This is why content
      hashes and unique-ID schemes at real scale use $64$- or $128$-bit
      outputs: doubling the bit width squares $m$ and squares the
      collision-free insertion count along with it.
    summary: >
      A 32-bit hash space collides with even odds after only about 77,000
      items — far sooner than intuition about "4 billion buckets"
      suggests.
    parent: quant-programming.complexity
    also_under: []
    requires:
      - quant-programming.complexity.hashing-cost
    relates: []
    tags: []

  - id: quant-programming.complexity.floating-point
    kind: proposition
    prominence: 2
    title: "Floating point: what doubles can and cannot represent"
    statement: >
      IEEE 754 double precision stores a sign, an $11$-bit exponent and a
      $52$-bit mantissa, giving about $15$–$17$ significant decimal
      digits — exact for binary fractions like $0.5$ or $0.25$, but not
      for most decimal fractions. $1/10$ is an infinite repeating binary
      fraction, so it is stored truncated; the classic symptom is that
      $0.1 + 0.2$ evaluates to $0.30000000000000004$, not $0.3$. This is
      not a bug to be patched but a structural fact about base-2
      representation of base-10 numbers, and it means no floating-point
      computation should ever be trusted to land on an exact decimal
      value.
    summary: >
      Most decimal fractions have no exact binary representation, so 0.1 +
      0.2 ≠ 0.3 is not a rounding mistake but a fact about how doubles
      store numbers.
    parent: quant-programming.complexity
    also_under: []
    requires: []
    relates:
      - id: quant-programming.complexity.big-o
        note: >
          Both are abstractions that hide a real cost: Big-O suppresses
          constant factors, and floating-point arithmetic suppresses
          representation error — both bite when the hidden term
          dominates.
    tags: []

  - id: quant-programming.complexity.cancellation-tolerance
    kind: proposition
    prominence: 1
    title: "Cancellation, tolerance, and summation order"
    statement: >
      Three linked traps. Catastrophic cancellation: subtracting two
      nearly equal floats destroys relative precision, e.g.
      $\sqrt{x+1} - \sqrt{x}$ for large $x$ loses most of its significant
      digits and should be rewritten as $1/(\sqrt{x+1}+\sqrt{x})$, which
      cancels nothing. Never compare floats with exact equality; test
      $|a - b| < \varepsilon$ against an absolute or relative tolerance
      instead. Summation order matters: adding many small numbers before
      a large one preserves precision, while adding a tiny number to a
      huge one can round the tiny one away entirely — sort ascending, or
      use Kahan summation to bound the error of a long running sum.
    summary: >
      Nearly-equal subtraction, exact equality checks, and large-before-
      small summation are the three classic ways floating point quietly
      throws away precision.
    parent: quant-programming.complexity
    also_under: []
    requires:
      - quant-programming.complexity.floating-point
    relates: []
    tags: []

  - id: quant-programming.complexity.integer-overflow
    kind: proposition
    prominence: 1
    title: "Integer overflow at 2^31"
    statement: >
      A signed $32$-bit integer holds $-2^{31}$ to $2^{31}-1$, about
      $\pm 2.1\times10^{9}$; exceeding it overflows, wrapping silently in
      some languages and undefined in others rather than raising an
      error. The classic bug is $(\text{low} + \text{high})/2$ in binary
      search: once $\text{low} + \text{high}$ exceeds $2^{31}-1$ the sum
      overflows before the division runs, fixed by writing
      $\text{low} + (\text{high} - \text{low})/2$. Interview habit: before
      trusting a 32-bit result, check whether a count, a sum of squares,
      or a product of two large inputs could plausibly cross two billion.
    summary: >
      Adding two ordinary-looking 32-bit numbers can silently wrap past
      about 2.1 billion — the reason binary search's midpoint formula is
      written to avoid low + high.
    parent: quant-programming.complexity
    also_under: []
    requires: []
    relates:
      - id: quant-programming.complexity.doubling-worked
        note: >
          The doubling array's capacity computation is itself a place
          this bites: repeatedly doubling a 32-bit capacity variable
          eventually overflows it, silently wrapping to a small or
          negative size.
    tags: []
