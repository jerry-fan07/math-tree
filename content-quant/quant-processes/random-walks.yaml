nodes:
  - id: quant-processes.random-walks
    kind: subbranch
    title: "Random Walks"
    summary: >
      The simple random walk and its path-counting arsenal — reflection,
      ballot counting, first passages and recurrence.
    parent: quant-processes
    also_under: []
    tags: []

  - id: quant-processes.random-walks.ssrw
    kind: definition
    prominence: 2
    title: "Simple symmetric random walk"
    statement: >
      Let $X_1, X_2, \dots$ be independent with
      $\Pr(X_i = +1) = \Pr(X_i = -1) = 1/2$, and set $S_0 = 0$ and
      $S_n = X_1 + \dots + X_n$. A path $(S_0, S_1, \dots, S_n)$ is one of
      $2^{n}$ equally likely $\pm 1$ sequences. Writing $U$ for the number of
      up-steps, $U$ is binomial with parameters $n$ and $1/2$ and
      $S_n = 2U - n$, so
      $\Pr(S_n = k) = \binom{n}{(n+k)/2} 2^{-n}$ when $k$ and $n$ have the same
      parity, and $0$ otherwise — the walk can only sit on sites of the right
      parity. Increments are independent and stationary: $S_{n+m} - S_n$ is an
      independent copy of $S_m$. Interview phrasing: "a gambler stakes $1$ on a
      fair coin over and over — describe where he stands after $n$ flips."
    summary: >
      Add up iid $\pm 1$ steps: $S_n = 2U - n$ with $U$ binomial, so the walk's
      position is a recentred coin count living on one parity class.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-probability.discrete.binomial
    relates: []
    tags: []

  - id: quant-processes.random-walks.moments
    kind: proposition
    prominence: 1
    title: "Mean, variance and increment covariance"
    statement: >
      Each step has $\mathbb{E}[X_i] = 0$ and
      $\operatorname{Var}(X_i) = \mathbb{E}[X_i^{2}] = 1$. Linearity gives
      $\mathbb{E}[S_n] = 0$, and independence of the steps gives
      $\operatorname{Var}(S_n) = n$, so the position has standard deviation
      $\sqrt{n}$. Because disjoint blocks of increments are independent with
      mean zero, $\operatorname{Cov}(S_m, S_n) = \min(m,n)$ and
      $\operatorname{Var}(S_n - S_m) = n - m$ for $m \le n$; the correlation
      between $S_m$ and $S_n$ is therefore $\sqrt{m/n}$, which decays only like
      a square root — a walk remembers its past strongly. Check to quote: after
      10,000 fair flips the net lead is $0 \pm 100$.
    summary: >
      Mean zero, variance exactly $n$, and $\operatorname{Cov}(S_m,S_n) =
      \min(m,n)$ — the walk's whole second-order structure in one line.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.ssrw
    relates: []
    tags: []

  - id: quant-processes.random-walks.sqrt-n-scaling
    kind: intuition
    prominence: 1
    title: "The walk grows like √n, not like n"
    statement: >
      The displacement scale is $\sqrt{n}$: to double the typical distance from
      the origin you need four times the steps. Rescaled, $S_n/\sqrt{n}$ is
      asymptotically standard normal, so $\Pr(|S_n| \le \sqrt{n}) \approx 0.68$
      and $\Pr(|S_n| \le 2\sqrt{n}) \approx 0.95$. Two limits live together and
      are constantly confused: the *proportion* of heads settles down, since
      $S_n/n \to 0$, while the *absolute* lead $|S_n|$ grows without bound and
      never self-corrects. Worked: after a million tosses a surplus of
      $1000$ heads is exactly one standard deviation, wholly unremarkable, and
      the head fraction is $0.5005$. There is no restoring force — only
      dilution by $n$.
    summary: >
      Distance from the origin scales like $\sqrt{n}$, so the fraction of heads
      converges while the raw lead diverges; nothing pulls the walk back.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.moments
    relates:
      - id: quant-probability.limits.clt
        note: >
          The walk is the central limit theorem's canonical example: $S_n$ is a
          sum of iid bounded steps, so $S_n/\sqrt{n}$ is asymptotically
          standard normal and every $\sqrt{n}$ statement here is that theorem
          read on the lattice.
    tags: []

  - id: quant-processes.random-walks.biased-walk
    kind: definition
    prominence: 1
    title: "Biased random walk"
    statement: >
      Take $\Pr(X_i = +1) = p$ and $\Pr(X_i = -1) = q = 1 - p$. Then
      $\Pr(S_n = k) = \binom{n}{(n+k)/2} p^{(n+k)/2} q^{(n-k)/2}$ on the right
      parity, $\mathbb{E}[S_n] = n(p - q) = n(2p - 1)$, and since
      $\operatorname{Var}(X_i) = 1 - (p-q)^{2} = 4pq$ we get
      $\operatorname{Var}(S_n) = 4pqn$. Drift is linear in $n$ while noise is
      only $\sqrt{n}$, so for $p \ne 1/2$ the drift wins once
      $n \gg 4pq/(p-q)^{2}$ and $S_n \to \pm\infty$ almost surely. Worked at
      $p = 0.51$ over $n = 10^{4}$ steps: drift $200$ against standard
      deviation $\sqrt{4(0.51)(0.49)10^{4}} \approx 100$, a two-sigma edge.
      This is
      the "small edge, many trades" model; its absorbing-barrier version is
      gambler's ruin.
    summary: >
      Steps up with probability $p$: mean $n(2p-1)$ and variance $4pqn$, so a
      tiny edge needs of order $1/(p-q)^{2}$ trades to emerge from the noise.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.moments
    relates: []
    tags: []

  - id: quant-processes.random-walks.path-counting
    kind: technique
    prominence: 1
    title: "Path counting"
    statement: >
      For the symmetric walk every path of $n$ steps has probability $2^{-n}$,
      so any probability is (number of favourable paths)$/2^{n}$ and the
      question becomes pure combinatorics. Paths from $(0,a)$ to $(n,b)$ exist
      exactly when $n$ and $b - a$ share parity, and there are
      $\binom{n}{(n + b - a)/2}$ of them — choose which steps go up.
      Constrained counts (stay positive, avoid a level, touch a level) are then
      handled by bijections, reflection being the workhorse. Worked: paths with
      $S_6 = 2$ need $4$ up-steps, so there are $\binom{6}{4} = 15$ and
      $\Pr(S_6 = 2) = 15/64 \approx 0.234$. For the biased walk paths are no
      longer equally likely, but all paths to a fixed endpoint share the weight
      $p^{u}q^{n-u}$, so the same counts still do the work.
    summary: >
      Every $n$-step path has probability $2^{-n}$, so probabilities are path
      counts: $\binom{n}{(n+b-a)/2}$ routes from height $a$ to height $b$.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.ssrw
    relates: []
    tags: []

  - id: quant-processes.random-walks.reflection
    kind: theorem
    prominence: 2
    title: "Reflection principle"
    statement: >
      Fix a level $a \ge 1$ and an endpoint $b < a$ of the right parity. Map
      each $n$-step path from $0$ that touches $a$ and ends at $b$ to the path
      obtained by reflecting everything after the first hitting time of $a$
      about the horizontal line at height $a$. The image ends at $2a - b$, the
      map is a bijection onto all paths ending at $2a - b$, and therefore
      the number of paths with $\max_k S_k \ge a$ and $S_n = b$ equals
      $\binom{n}{(n + 2a - b)/2}$. Equivalent phrasing used for barriers: for
      $x, y > 0$ the paths from $(0,x)$ to $(n,y)$ that touch $0$ are in
      bijection with all paths from $(0,-x)$ to $(n,y)$. The ballot theorem,
      first-passage laws and the running maximum are this one bijection aimed
      at three different targets.
    summary: >
      Reflect a path after its first visit to a level and you count restricted
      paths by counting unrestricted ones — the central trick of the subject.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.path-counting
    relates: []
    tags: []

  - id: quant-processes.random-walks.ballot
    kind: theorem
    prominence: 1
    title: "Ballot problem"
    statement: >
      Candidate A finishes with $p$ votes and B with $q$, where $p > q$. If the
      ballots are counted in uniformly random order, the probability that A is
      strictly ahead at every stage of the count is $(p - q)/(p + q)$. Proof by
      reflection: a count is a path to height $p - q$ using $p$ up and $q$ down
      steps. Paths whose first step is down are a fraction $q/(p+q)$ of the
      total and all of them touch $0$ later; reflecting up to the first return
      maps the bad paths that start up bijectively onto them, so bad paths are
      twice that fraction and $1 - 2q/(p+q) = (p-q)/(p+q)$ remain. Worked: with
      $5$ votes to $3$ the answer is $2/8 = 1/4$. The weak form, A never
      trailing (ties allowed), has probability $(p - q + 1)/(p + 1)$.
    summary: >
      A leads wire to wire with probability $(p-q)/(p+q)$ — one reflection
      bijection, and $1/4$ in the $5$-to-$3$ case.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.reflection
    relates: []
    tags: []

  - id: quant-processes.random-walks.first-passage
    kind: proposition
    prominence: 1
    title: "First passage to a level"
    statement: >
      Let $T_a = \min\{n \ge 1 : S_n = a\}$ for $a \ge 1$. The hitting-time
      theorem, a direct consequence of reflection, is
      $\Pr(T_a = n) = \dfrac{a}{n}\Pr(S_n = a)$ for $n \ge a$ of matching
      parity. For $a = 1$ this reads
      $\Pr(T_1 = 2m+1) = \binom{2m+1}{m+1} / \left((2m+1)2^{2m+1}\right)$,
      giving $1/2$, $1/8$, $1/16$ at $m = 0, 1, 2$. The symmetric walk reaches
      every level eventually, $\Pr(T_a < \infty) = 1$, yet the tail decays only
      like $n^{-3/2}$, so $\mathbb{E}[T_a] = \infty$. Because the walk must
      pass through each intermediate level, $T_a$ is a sum of $a$ independent
      copies of $T_1$. For the biased walk with $p < 1/2$ the level is missed
      outright with positive probability: $\Pr(T_a < \infty) = (p/q)^{a}$.
    summary: >
      $\Pr(T_a = n) = (a/n)\Pr(S_n = a)$: the level is hit with probability $1$
      in the fair case, but the waiting time has infinite mean.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.reflection
    relates: []
    tags: []

  - id: quant-processes.random-walks.max-distribution
    kind: proposition
    prominence: 1
    title: "Law of the running maximum"
    statement: >
      Let $M_n = \max_{0 \le k \le n} S_k$, so $M_n \ge 0$. Since
      $\{M_n \ge a\} = \{T_a \le n\}$, reflection gives, for every integer
      $a \ge 1$,
      $\Pr(M_n \ge a) = \Pr(S_n \ge a) + \Pr(S_n \ge a+1)
      = 2\Pr(S_n \ge a) - \Pr(S_n = a)$,
      and differencing yields $\Pr(M_n = a) = \Pr(S_n = a) + \Pr(S_n = a+1)$.
      The formula fails at $a = 0$, where the boundary term must be handled by
      complement. Scale: $\mathbb{E}[M_n] \approx \sqrt{2n/\pi}$, the same
      order as the typical displacement. In the diffusive limit the running
      maximum and the absolute position share a law, the Brownian identity
      $M_t \sim |B_t|$; at finite $n$ lattice parity keeps them distinct.
    summary: >
      $\Pr(M_n \ge a) = 2\Pr(S_n \ge a) - \Pr(S_n = a)$ — the high-water mark
      of the walk, read off the endpoint law by reflection.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.first-passage
    relates:
      - id: quant-probability.random-variables.min-max
        note: >
          For independent variables the maximum's CDF is a product of CDFs;
          partial sums are heavily dependent, so that route collapses and
          reflection is what replaces it.
    tags: []

  - id: quant-processes.random-walks.reach-level-example
    kind: example
    prominence: 1
    title: "Does the walk reach +3 in ten steps?"
    statement: >
      Toss a fair coin ten times, $+1$ per head and $-1$ per tail: what is the
      chance the running total ever reaches $+3$? Use the maximum law with
      $n = 10$, $a = 3$. Parity kills the odd terms, so $\Pr(S_{10} = 3) = 0$
      and $\Pr(S_{10} \ge 3) = \Pr(S_{10} \ge 4)$, which is the chance of at
      least $7$ heads:
      $(120 + 45 + 10 + 1)/1024 = 176/1024$. Hence
      $\Pr(M_{10} \ge 3) = 176/1024 + 176/1024 = 352/1024 = 11/32 \approx
      0.344$. Compare $\Pr(S_{10} \ge 3) = 0.172$: the walk is exactly twice as
      likely to *visit* $+3$ as to *finish* at or above it. That factor of two
      is the reflection bijection in its most quotable form.
    summary: >
      $11/32 \approx 34\%$ — and touching a level is twice as likely as ending
      above it, which is the reflection principle stated as a number.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.max-distribution
    relates: []
    tags: []

  - id: quant-processes.random-walks.return-origin
    kind: proposition
    prominence: 2
    title: "Return to the origin"
    statement: >
      Parity forbids returns at odd times, and at even times
      $u_{2n} = \Pr(S_{2n} = 0) = \dfrac{\binom{2n}{n}}{4^{n}}$, since exactly
      $n$ of the $2n$ steps must go up. Stirling's formula gives
      $\binom{2n}{n} \sim 4^{n}/\sqrt{\pi n}$ and therefore
      $u_{2n} \sim \dfrac{1}{\sqrt{\pi n}}$. Values: $u_2 = 1/2$,
      $u_{10} = 252/1024 \approx 0.246$, and $u_{100} \approx 0.0796$ against
      the estimate $1/\sqrt{50\pi} \approx 0.0798$. The decay is only
      $n^{-1/2}$, which is slow: after a million tosses the chance of standing
      exactly level is still about $1/\sqrt{\pi \cdot 5 \cdot 10^{5}} \approx
      0.0008$, roughly one game in $1250$. This asymptotic drives the
      first-return
      law, the expected distance and Pólya's recurrence theorem.
    summary: >
      $\Pr(S_{2n} = 0) = \binom{2n}{n}/4^{n} \sim 1/\sqrt{\pi n}$ — the master
      asymptotic of the one-dimensional walk.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.path-counting
      - quant-tools.series-calculus.stirling
    relates: []
    tags: []

  - id: quant-processes.random-walks.first-return
    kind: proposition
    prominence: 1
    title: "First return to the origin"
    statement: >
      Let $T_0 = \min\{n \ge 1 : S_n = 0\}$. Its law is
      $f_{2n} = \Pr(T_0 = 2n) = u_{2n-2} - u_{2n} = \dfrac{u_{2n}}{2n - 1}
      = \dfrac{\binom{2n}{n}}{(2n-1)4^{n}}$,
      whose first values are $1/2$, $1/8$, $1/16$, $5/128$. The middle form
      telescopes, so $\sum_{n \ge 1} f_{2n} = u_0 - \lim_n u_{2n} = 1$: the
      walk returns to its start with probability $1$. But
      $f_{2n} \sim \dfrac{1}{2\sqrt{\pi}\,n^{3/2}}$, so
      $\mathbb{E}[T_0] = \sum_n 2n f_{2n}$ diverges. Certain to happen, with
      infinite expected waiting time — the standard warning that probability
      $1$ says nothing about timing.
    summary: >
      The walk comes home with probability $1$, yet the expected time to do it
      is infinite: $\Pr(T_0 = 2n) \approx n^{-3/2}/(2\sqrt{\pi})$.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.return-origin
    relates:
      - id: quant-tools.recurrences.first-step-analysis
        note: >
          Conditioning on the first step turns the return question into a
          one-line equation for the hitting probability; it recovers
          certainty of return but cannot see the infinite mean, which needs the
          $n^{-3/2}$ tail.
    tags: []

  - id: quant-processes.random-walks.expected-distance
    kind: proposition
    prominence: 1
    title: "Expected distance from the origin"
    statement: >
      The mean absolute displacement has an exact closed form in terms of the
      return probabilities: $\mathbb{E}|S_{2n}| = 2n\,u_{2n}$ and
      $\mathbb{E}|S_{2n+1}| = (2n+1)\,u_{2n}$, where
      $u_{2n} = \binom{2n}{n}/4^{n}$. Feeding in
      $u_{2n} \sim 1/\sqrt{\pi n}$ gives, after $m$ steps,
      $\mathbb{E}|S_m| \sim \sqrt{2m/\pi} \approx 0.798\sqrt{m}$. Numbers:
      $\mathbb{E}|S_2| = 1$ exactly; $\mathbb{E}|S_{10}| = 10 \cdot 252/1024
      \approx 2.46$ against $\sqrt{20/\pi} \approx 2.52$;
      $\mathbb{E}|S_{100}| \approx 7.96$ against $\sqrt{200/\pi} \approx 7.98$.
      So the average distance is about four-fifths of the standard deviation
      $\sqrt{m}$, matching the normal fact
      $\mathbb{E}|Z| = \sigma\sqrt{2/\pi}$ for $Z$ centred with variance
      $\sigma^{2}$.
    summary: >
      Typical distance after $m$ steps is $\sqrt{2m/\pi} \approx 0.8\sqrt{m}$ —
      about $8$ after $100$ tosses.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.return-origin
    relates: []
    tags: []

  - id: quant-processes.random-walks.nonnegative-paths
    kind: proposition
    prominence: 1
    title: "Paths that never go negative"
    statement: >
      The number of $2n$-step paths from $0$ back to $0$ that never dip below
      $0$ is the Catalan number $C_n = \binom{2n}{n}/(n+1)$. Dropping the
      requirement to end at $0$ gives the striking identity
      $\Pr(S_1 \ge 0, \dots, S_{2n} \ge 0) = u_{2n} = \binom{2n}{n}/4^{n}$ —
      numerically equal to the probability of *being* at the origin at time
      $2n$, a coincidence of formulas with a bijective proof. The strict
      version is half of it: $\Pr(S_1 > 0, \dots, S_{2n} > 0) = u_{2n}/2$.
      Worked: over $10$ tosses the chance heads never trails tails is
      $252/1024 \approx 0.246$; over $100$ tosses it is about $0.0796$. Staying
      nonnegative is a $\sqrt{n}$-probability event, not a rare one, which is
      why "the lead never changed hands" happens far more often than people
      guess.
    summary: >
      Catalan numbers count nonnegative excursions, and the walk stays
      nonnegative through $2n$ steps with probability $\binom{2n}{n}/4^{n}$.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.ballot
      - quant-probability.counting.catalan
    relates: []
    tags: []

  - id: quant-processes.random-walks.recurrence-dimension
    kind: theorem
    prominence: 1
    title: "Pólya's recurrence theorem"
    statement: >
      The simple symmetric walk on $\mathbb{Z}^{d}$ — each of the $2d$
      neighbours chosen with probability $1/(2d)$ — returns to its starting
      point with probability $1$ for $d = 1$ and $d = 2$, and with probability
      strictly less than $1$ for every $d \ge 3$. The criterion is
      $\sum_n \Pr(S_n = 0) = \infty$ for recurrence. In one dimension
      $u_{2n} \sim 1/\sqrt{\pi n}$ and the series diverges. In two dimensions a
      $45$-degree rotation splits the walk into two independent one-dimensional
      walks, so $u_{2n} \sim 1/(\pi n)$, still divergent. In three dimensions
      $u_{2n} \sim c\,n^{-3/2}$, the series converges, and the return
      probability is about $0.3405$. Kakutani's slogan: a drunk man finds his
      way home, but a drunk bird may not.
    summary: >
      Recurrent in one and two dimensions, transient from three on — the
      borderline is exactly where $\sum \Pr(S_n = 0)$ stops diverging.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.return-origin
    relates: []
    tags: []

  - id: quant-processes.random-walks.expected-visits
    kind: proposition
    prominence: 0
    title: "Expected number of visits to a site"
    statement: >
      Write $R$ for the probability of ever returning to the origin and $V$ for
      the total number of visits, counting time $0$. Each visit restarts the
      walk, so $V$ is geometric: $\Pr(V = k) = R^{k-1}(1 - R)$ and
      $\mathbb{E}[V] = \dfrac{1}{1 - R} = \sum_{n \ge 0}\Pr(S_n = 0)$, the
      Green's function. In one dimension $R = 1$ and both sides are infinite:
      the walk visits the origin infinitely often with probability $1$, and by
      translation invariance it visits *every* integer infinitely often. In
      three dimensions $R \approx 0.3405$, so the origin is visited about
      $1/0.6595 \approx 1.52$ times on average, only $0.52$ of those after the
      start. Recurrence is all-or-nothing: infinitely many visits almost
      surely, or finitely many almost surely.
    summary: >
      Visits are geometric with mean $1/(1-R)$ — infinite in one dimension,
      about $1.5$ in three.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.recurrence-dimension
    relates: []
    tags: []

  - id: quant-processes.random-walks.arcsine-law
    kind: intuition
    prominence: 0
    title: "Arcsine law: leads are sticky"
    statement: >
      In $2n$ fair tosses the fraction of time the walk spends on the positive
      side is not concentrated near $1/2$; its limiting law has the U-shaped
      arcsine density, with
      $\Pr(\text{fraction} \le x) \to \dfrac{2}{\pi}\arcsin\sqrt{x}$. The
      extremes are the likely outcomes: the fraction is below $0.05$ with
      probability $\tfrac{2}{\pi}\arcsin\sqrt{0.05} \approx 0.144$, and by
      symmetry it exceeds $0.95$ just as often, so nearly $29\%$ of games have
      one side ahead at least $95\%$ of the time, while only about $6\%$ land
      in the "fair-looking" band $[0.45, 0.55]$. The same arcsine law governs
      the time of the last tie, whose law is $u_{2k}u_{2n-2k}$. Lesson for
      reading track records: long one-sided runs are the norm in a fair game,
      not evidence of skill.
    summary: >
      The share of time spent ahead is U-shaped, not bell-shaped — lopsided
      leads are typical in a perfectly fair game.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.first-return
      - quant-processes.random-walks.nonnegative-paths
    relates: []
    tags: []

  - id: quant-processes.random-walks.fair-but-slow
    kind: intuition
    prominence: 1
    title: "Fair, certain, and unboundedly slow"
    statement: >
      Three facts sit together and must be held together. At every fixed time
      $\mathbb{E}[S_n] = 0$, so the game is fair. Recurrence says every level
      is reached eventually, so a gambler who resolves to quit once ahead by
      $100$ units succeeds with probability $1$. The expected time to do it is
      infinite, and so is the maximum drawdown along the way. The "sure win" is
      therefore purchased with unbounded time and unbounded capital, and
      removing either one destroys it — a finite bankroll turns the problem
      into gambler's ruin, and a formal account of which stopping rules
      preserve fairness is the optional stopping theorem. Practical reading:
      "hold until the drawdown comes back" has probability-$1$ success and an
      infinite-mean holding period, which is why risk limits are written in
      capital and time, never in probability.
    summary: >
      Probability-$1$ profit with infinite expected waiting time and unbounded
      drawdown — the reason "certain to win eventually" is not a strategy.
    parent: quant-processes.random-walks
    also_under: []
    requires:
      - quant-processes.random-walks.moments
      - quant-processes.random-walks.first-return
    relates: []
    tags: []
