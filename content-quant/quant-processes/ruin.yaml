# quant-processes.ruin — Gambler's Ruin
# Outline node (19 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-processes.ruin
    kind: subbranch
    title: "Gambler's Ruin"
    summary: >
      The ruin family — fair and biased ruin probabilities, expected
      duration, and what an infinite bankroll opponent means.
    parent: quant-processes
    also_under: []
    tags: []

  - id: quant-processes.ruin.setup
    kind: definition
    prominence: 1
    title: "The two-barrier absorbing walk"
    statement: >
      Fix integers $0 \le k \le N$. A gambler starts with $k$ units and plays
      independent rounds, winning one unit with probability $p$ and losing one
      with probability $q = 1 - p$, until the fortune reaches $0$ (ruin) or $N$
      (target); both levels are absorbing, so play stops on contact. The
      opponent's stack is $N - k$ and $N$ is the combined bankroll. Write $R(k)$
      for the probability of hitting $0$ before $N$ and $W(k) = 1 - R(k)$ for
      the probability of hitting $N$ first, with boundary values $R(0) = 1$ and
      $R(N) = 0$. Every question in this subbranch — fair play, an edge, an
      unlimited opponent, bet sizing — is this one picture with different $p$,
      $k$ and $N$.
    summary: >
      A $\pm 1$ random walk started at $k$ and stopped the moment it touches
      $0$ or $N$: your stack against the opponent's, with no way back once
      either is empty.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.random-walks.ssrw
    relates:
      - id: quant-processes.random-walks.first-passage
        note: >
          Ruin is the two-sided first-passage question: instead of asking when
          the walk first reaches a single level, it asks which of two levels it
          reaches first.
    tags: []

  - id: quant-processes.ruin.absorption-certain
    kind: proposition
    prominence: 0
    title: "The game ends with probability one"
    statement: >
      Assume $0 < p < 1$. Absorption happens with probability $1$, so
      $R(k) + W(k) = 1$ and no probability leaks into playing forever. Proof:
      from any interior state, $N$ consecutive wins reach the top barrier, so
      each disjoint block of $N$ rounds absorbs with probability at least
      $\min(p,q)^{N} > 0$; surviving $m$ blocks unabsorbed has probability at
      most $(1 - \min(p,q)^{N})^{m} \to 0$. The same bound makes the tail of the
      duration geometric, so the expected duration and all its moments are
      finite. This is the licence to solve the first-step equations for a
      bounded solution instead of worrying about paths that never stop.
    summary: >
      Absorption is certain and its time has geometric tails, so ruin and
      success probabilities add to $1$ and the expected game length is finite.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.setup
    relates: []
    tags: []

  - id: quant-processes.ruin.ruin-equation
    kind: technique
    prominence: 1
    title: "The first-step difference equation"
    statement: >
      Condition on the first round. From an interior $k$ the fortune moves to
      $k+1$ with probability $p$ and to $k-1$ with probability $q$, and the
      problem restarts from there, so $R(k) = p\,R(k+1) + q\,R(k-1)$ for
      $0 < k < N$, with $R(0) = 1$ and $R(N) = 0$. Anything depending only on
      the current fortune obeys the same template: the expected duration $D(k)$
      pays one round up front, giving $D(k) = 1 + p\,D(k+1) + q\,D(k-1)$ with
      $D(0) = D(N) = 0$. Reach for this whenever a process is stopped at
      barriers — one unknown per state, one equation per interior state, and
      the boundaries pin down the free constants.
    summary: >
      Write one equation per interior state by conditioning on a single step;
      the two boundary values then determine the whole solution.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.setup
      - quant-tools.recurrences.first-step-analysis
    relates: []
    tags: []

  - id: quant-processes.ruin.fair
    kind: theorem
    prominence: 2
    title: "Fair gambler's ruin: ruin probability 1 - k/N"
    statement: >
      Suppose $p = q = 1/2$. Then
      $R(k) = \tfrac{1}{2}R(k+1) + \tfrac{1}{2}R(k-1)$ says the second
      difference $R(k+1) - 2R(k) + R(k-1)$ vanishes, so $R$ is affine in $k$,
      $R(k) = A + Bk$. The boundaries $R(0) = 1$ and $R(N) = 0$ force
      $R(k) = 1 - k/N = \dfrac{N-k}{N}$, and hence
      $W(k) = k/N$ for reaching the target first. Read it as a share of the
      pot: in a fair game you take the whole thing with probability equal to
      the fraction of it you brought. The martingale subbranch re-derives this
      in one line from $\mathbb{E}[S_T] = S_0$, but nothing beyond the
      difference equation is needed here.
    summary: >
      With a fair coin your chance of running $k$ up to $N$ before busting is
      exactly $k/N$, your share of the combined bankroll.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.ruin-equation
      - quant-processes.ruin.absorption-certain
    relates: []
    tags: []

  - id: quant-processes.ruin.expectation-check
    kind: technique
    prominence: 1
    title: "Pinning the answer by conservation of expectation"
    statement: >
      A check, not a derivation, but it produces the fair answer with no
      algebra. In a fair game the expected fortune does not move, so the
      expected fortune when play stops still equals the starting stack:
      $0 \cdot R(k) + N \cdot W(k) = k$, giving $W(k) = k/N$ at sight. With an
      edge the same bookkeeping uses the drift $p - q$ per round: over an
      expected $D(k)$ rounds the fortune moves by $(p-q)D(k)$ on average, so
      $N\,W(k) - k = (p-q)\,D(k)$ ties ruin probability and expected duration
      together, and either one hands you the other. The formal justification —
      optional stopping for a martingale — lives in the martingale subbranch;
      here it is accounting that must hold once absorption is certain.
    summary: >
      Expected wealth in equals expected wealth out, which recovers $k/N$
      instantly and links the biased ruin probability to the game's length.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.fair
    relates:
      - id: quant-probability.conditioning.tower
        note: >
          The first-step equation is the tower property applied to one round;
          conservation of expectation is the same identity carried all the way
          to the absorption time.
    tags: []

  - id: quant-processes.ruin.fair-example
    kind: example
    prominence: 1
    title: "Ten against ninety on a fair coin"
    statement: >
      You sit down with $10$ against a house holding $90$, bet one unit per
      round on a fair coin, and leave only when you are broke or hold the whole
      $100$. Here $k = 10$ and $N = 100$, so $W(10) = 10/100 = 0.10$: you take
      the pot $10\%$ of the time and go broke $90\%$ of the time. No house edge
      is involved — your expected profit is exactly $0$, because the $90\%$
      chance of losing $10$ offsets the $10\%$ chance of winning $90$. The
      asymmetry is bankroll, not odds: the short stack is the one that busts,
      and the only levers on $W$ are bringing more money or aiming lower.
    summary: >
      Starting with $10$ of a $100$ pot on a fair coin, you go broke $90\%$ of
      the time — the loss is all bankroll asymmetry, not edge.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.fair
    relates: []
    tags: []

  - id: quant-processes.ruin.biased
    kind: theorem
    prominence: 2
    title: "Biased gambler's ruin: the (q/p)^k formula"
    statement: >
      Suppose $p \ne q$ and set $r = q/p$. Rearranged, the first-step equation
      reads $p\,R(k+1) - R(k) + q\,R(k-1) = 0$, with characteristic polynomial
      $p x^{2} - x + q$ whose roots are $x = 1$ and $x = r$, distinct precisely
      because $p \ne q$; hence $R(k) = A + B r^{k}$. Equivalently the increments
      obey $R(k+1) - R(k) = r\,(R(k) - R(k-1))$, a geometric progression whose
      partial sums give the same family. Imposing $R(0) = 1$ and $R(N) = 0$
      yields $R(k) = \dfrac{r^{k} - r^{N}}{1 - r^{N}}$ and
      $W(k) = \dfrac{1 - r^{k}}{1 - r^{N}}$. Letting $r \to 1$ recovers
      $1 - k/N$; the martingale subbranch reproves it with $r^{S_n}$.
    summary: >
      With $p \ne q$ the ruin probability is $(r^{k} - r^{N})/(1 - r^{N})$ where
      $r = q/p$ — powers of the odds ratio replace the fair case's straight
      line.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.ruin-equation
      - quant-processes.ruin.absorption-certain
      - quant-tools.recurrences.linear-recurrence
    relates: []
    tags: []

  - id: quant-processes.ruin.edge-sensitivity
    kind: example
    prominence: 1
    title: "One percentage point of edge, worked"
    statement: >
      Hold $k = 10$ and $N = 100$ fixed and vary only $p$. Fair play gives
      $W = 0.10$. At $p = 0.49$, $r = 51/49 \approx 1.0408$, so
      $r^{10} \approx 1.492$ and $r^{100} \approx 54.6$, giving
      $W = (1 - 1.492)/(1 - 54.6) \approx 0.0092$ — under one percent, an
      elevenfold collapse from a one-point disadvantage. At $p = 0.51$,
      $r = 49/51 \approx 0.9608$, $r^{10} \approx 0.6703$,
      $r^{100} \approx 0.0183$, and
      $W = (1 - 0.6703)/(1 - 0.0183) \approx 0.336$. A two-point swing in $p$
      moves the chance of running $10$ into $100$ from $0.9\%$ to $34\%$: ruin
      probabilities are exponential in the edge times the distance, which is
      why tiny edges dominate everything played at depth.
    summary: >
      Running $10$ up to $100$ succeeds $10\%$ of the time when fair, $0.9\%$ at
      $p = 0.49$, and $34\%$ at $p = 0.51$.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.biased
      - quant-processes.ruin.fair-example
    relates: []
    tags: []

  - id: quant-processes.ruin.doubling-your-money
    kind: corollary
    prominence: 1
    title: "Probability of doubling your stack"
    statement: >
      Take $N = 2k$: play until you double or bust. Since
      $1 - r^{2k} = (1 - r^{k})(1 + r^{k})$, the general formula collapses to
      $W = \dfrac{1}{1 + r^{k}}$ with $r = q/p$, which is $1/2$ exactly when the
      game is fair. When $r > 1$ the dependence on bankroll measured in bets is
      brutal: at $p = 0.49$ a stack of $k = 10$ doubles with probability
      $1/(1 + 1.492) \approx 0.401$, while $k = 100$ doubles with probability
      only $1/(1 + 54.6) \approx 0.018$. Playing a slightly negative game for
      longer does not average out — the chance of doubling decays
      geometrically in the number of bets you intend to place.
    summary: >
      Doubling up succeeds with probability $1/(1 + (q/p)^{k})$: a coin flip
      when fair, but $1.8\%$ for a $100$-unit stack at $p = 0.49$.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.biased
    relates: []
    tags: []

  - id: quant-processes.ruin.duration
    kind: proposition
    prominence: 1
    title: "Expected duration k(N-k) in the fair game"
    statement: >
      With $p = q = 1/2$ the expected number of rounds until absorption,
      starting from $k$, is $D(k) = k(N-k)$. Derivation:
      $D(k) = 1 + \tfrac{1}{2}D(k+1) + \tfrac{1}{2}D(k-1)$ makes the second
      difference equal $-2$, so $-k^{2}$ is a particular solution and
      $D(k) = A + Bk - k^{2}$; then $D(0) = 0$ forces $A = 0$ and $D(N) = 0$
      forces $B = N$. The answer is the product of the two stacks, largest at
      $k = N/2$ where $D = N^{2}/4$. Two readings: doubling both stacks
      quadruples the expected length, and at $10$ against $90$ you should
      expect $10 \cdot 90 = 900$ rounds — a fair coin takes a long time to
      settle a lopsided match.
    summary: >
      Expected game length is the product of the two stack sizes: $900$ rounds
      for $10$ against $90$, and $N^{2}/4$ when the stacks are equal.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.ruin-equation
      - quant-processes.ruin.absorption-certain
    relates: []
    tags: []

  - id: quant-processes.ruin.duration-biased
    kind: proposition
    prominence: 0
    title: "Expected duration with an edge"
    statement: >
      For $p \ne q$ the equation $D(k) = 1 + p\,D(k+1) + q\,D(k-1)$ has
      particular solution $k/(q-p)$, and matching $D(0) = D(N) = 0$ gives
      $D(k) = \dfrac{k - N\,W(k)}{q - p}$, where
      $W(k) = (1 - r^{k})/(1 - r^{N})$ is the success probability from the
      biased formula. That is exactly the drift identity: expected net movement
      $N\,W(k) - k$ equals $(p - q)$ per round times the expected number of
      rounds. Worked at $k = 10$, $N = 100$: with $p = 0.49$ the game lasts
      $(10 - 0.917)/0.02 \approx 454$ rounds; with $p = 0.51$ it lasts
      $(10 - 33.59)/(-0.02) \approx 1179$ rounds. An edge makes the game both
      safer and considerably longer.
    summary: >
      Expected length is $(k - N W(k))/(q-p)$ — about $454$ rounds at
      $p = 0.49$ and $1179$ at $p = 0.51$, from $10$ against $90$.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.duration
      - quant-processes.ruin.biased
    relates: []
    tags: []

  - id: quant-processes.ruin.infinite-opponent
    kind: corollary
    prominence: 1
    title: "Ruin against an infinitely rich opponent"
    statement: >
      Let $N \to \infty$ with $k$ fixed: the house has unlimited money and you
      never walk away. If $p \le 1/2$ then $r \ge 1$ and both formulas send
      $R(k) \to 1$ — ruin is certain, whatever your bankroll and however small
      your bets. If $p > 1/2$ then $r < 1$, $r^{N} \to 0$, and
      $R(k) \to r^{k} = (q/p)^{k}$, so you survive forever with probability
      $1 - (q/p)^{k}$. At $p = 0.51$ a bankroll of $k = 10$ still busts with
      probability $(49/51)^{10} \approx 0.67$, while $k = 100$ busts with
      probability $(49/51)^{100} \approx 0.018$. An edge is worth nothing
      without the capital to outlast its variance.
    summary: >
      Without an edge, an unlimited opponent ruins you with probability $1$;
      with an edge your lifetime bust probability is $(q/p)^{k}$.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.fair
      - quant-processes.ruin.biased
    relates:
      - id: quant-processes.random-walks.recurrence-dimension
        note: >
          Certain ruin against an unlimited bank is one-sided recurrence: the
          symmetric one-dimensional walk returns to every level, including $0$,
          with probability one.
    tags: []

  - id: quant-processes.ruin.unequal-steps
    kind: proposition
    prominence: 0
    title: "Ruin with uneven stakes: the adjustment coefficient"
    statement: >
      Drop the $\pm 1$ restriction. Let each round change the stack by an
      integer $X$ with $\mathbb{E}[X] > 0$, $\Pr(X = -1) > 0$, and no downward
      move larger than one unit, so the walk cannot jump over $0$. Against an
      unlimited opponent the probability of ever going broke from $k$ is
      $\theta^{k}$, where $\theta$ is the unique root in $(0,1)$ of
      $\mathbb{E}[\theta^{X}] = 1$ — the adjustment-coefficient equation of ruin
      theory. For $X = \pm 1$ this reads $p\theta + q/\theta = 1$ with roots $1$
      and $q/p$, recovering the previous node. Worked: winning $2$ or losing $1$
      on a fair coin gives $\theta^{3} - 2\theta + 1 = 0$; removing the factor
      $\theta - 1$ leaves $\theta^{2} + \theta - 1 = 0$, so
      $\theta = (\sqrt{5}-1)/2 \approx 0.618$ and a stack of $5$ busts with
      probability $0.618^{5} \approx 0.090$.
    summary: >
      For general upward jumps the bust probability is still geometric,
      $\theta^{k}$, with $\theta$ solving $\mathbb{E}[\theta^{X}] = 1$ — the
      golden ratio for a win-2-lose-1 fair coin.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.infinite-opponent
    relates: []
    tags: []

  - id: quant-processes.ruin.stake-scaling
    kind: intuition
    prominence: 1
    title: "Bet size rescales the barriers"
    statement: >
      The formulas see the stacks only in units of the bet, so betting $b$ units
      per round at unchanged $p$ replaces $k$ and $N$ by $k/b$ and $N/b$. In a
      fair game $W = k/N$ is untouched: bet size cannot change whether you
      double, only how long it takes, since $D$ scales like $1/b^{2}$. Against
      an edge it matters enormously, because raising $b$ shrinks the exponents
      in $r^{k/b}$ and pushes $W$ up toward the fair value $k/N$. At American
      roulette, $p = 18/38$, running $10$ into $100$ one unit at a time
      succeeds with probability about $5 \cdot 10^{-5}$, one chance in twenty
      thousand; in bets of ten units it is about $0.059$. With the edge on your
      side the inequality reverses and smaller bets are better.
    summary: >
      Only $k/b$ and $N/b$ matter, so bet size is irrelevant in a fair game,
      helps when you are the underdog, and hurts when you have an edge.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.fair
      - quant-processes.ruin.biased
    relates: []
    tags: []

  - id: quant-processes.ruin.bold-play
    kind: intuition
    prominence: 1
    title: "Bold play when you are behind"
    statement: >
      Push stake scaling to its limit. Against a subfair even-money game, the
      strategy maximizing the chance of reaching a target is bold play — stake
      the smaller of your fortune and the amount still needed — while with the
      edge on your side the incentive reverses and shrinking the stake pushes
      the success probability toward $1$, with no optimal bet size at all.
      Concrete: at roulette red, $p = 18/38$, turning $10$ into $20$ one unit at
      a time succeeds with probability
      $1/(1 + (10/9)^{10}) \approx 0.259$, whereas a single $10$ bet succeeds
      with probability $18/38 \approx 0.474$, against a fair-game benchmark of
      $0.5$. Every extra round is another application of the house edge, so beat
      it by touching it as few times as possible.
    summary: >
      Doubling $10$ at roulette pays $25.9\%$ in one-unit bets but $47.4\%$ in a
      single bet — when the game is against you, fewer and bigger is better.
    parent: quant-processes.ruin
    also_under: []
    requires:
      - quant-processes.ruin.stake-scaling
      - quant-processes.ruin.doubling-your-money
    relates: []
    tags: []
