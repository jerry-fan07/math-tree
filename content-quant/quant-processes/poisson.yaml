# quant-processes.poisson — Poisson Processes
# Outline node (23 in content-quant/outline.md's authoring order).
# NEEDS: quant-probability.random-variables.uniform-order-statistics — conditional uniformity wants uniform order statistics directly, but only the generic order-statistics node is in §7's spine, so it is paired with §10's uniform instead.

nodes:
  - id: quant-processes.poisson
    kind: subbranch
    title: "Poisson Processes"
    summary: >
      Memoryless arrivals — exponential gaps, superposition and
      thinning, conditional uniformity, and the inspection paradox.
    parent: quant-processes
    also_under: []
    tags: []

  - id: quant-processes.poisson.pp
    kind: definition
    prominence: 2
    title: "Poisson process"
    statement: >
      A counting process $N(t)$, $t \ge 0$, records arrivals: $N(0) = 0$, the
      paths are nondecreasing and integer-valued, and $N(b) - N(a)$ counts the
      arrivals in $(a,b]$. It is a Poisson process of rate $\lambda > 0$ if
      (i) increments over disjoint intervals are independent, (ii) increments are
      stationary, meaning the law of $N(t+s) - N(s)$ depends on $t$ but not on
      $s$, and (iii) $N(t+s) - N(s) \sim \operatorname{Poisson}(\lambda t)$.
      Consequently $\mathbb{E}[N(t)] = \operatorname{Var}(N(t)) = \lambda t$, and
      the counts in any two disjoint windows are independent Poisson variables.
      At $\lambda = 4$ per hour the count in a quarter of an hour is Poisson with
      mean $1$.
    summary: >
      Arrivals with independent stationary increments whose count over a window
      of length $t$ is Poisson with mean $\lambda t$ — the default model for
      events that carry no memory.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-probability.discrete.poisson
    relates:
      - id: quant-probability.discrete.poisson-limit
        note: >
          Rare events with many chances: the binomial-to-Poisson limit is why
          slicing a window into $n$ tiny slots, each independently holding one
          arrival with chance $\lambda t/n$, reproduces the Poisson count.
    tags: []

  - id: quant-processes.poisson.infinitesimal-definition
    kind: proposition
    prominence: 0
    title: "Infinitesimal rate characterization"
    statement: >
      An equivalent definition replaces the Poisson law by a local rate: a
      counting process with independent stationary increments is a Poisson
      process of rate $\lambda$ if and only if, as $h \downarrow 0$,
      $\Pr(N(h) = 1) = \lambda h + o(h)$ and $\Pr(N(h) \ge 2) = o(h)$. The second
      condition is orderliness — two arrivals never coincide. Reading: in each
      instant of length $dt$ an arrival occurs with chance $\lambda\,dt$,
      independently of everything else, so chopping $[0,t]$ into $n$ equal slots
      makes $N(t)$ approximately $\operatorname{Binomial}(n, \lambda t/n)$, whose
      limit is $\operatorname{Poisson}(\lambda t)$. Reach for this form when a
      problem hands you a hazard rate rather than a distribution.
    summary: >
      The process is equally well described by "chance $\lambda\,dt$ of one
      arrival per instant, never two at once" — the definition to use when the
      data is a rate.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.pp
    relates: []
    tags: []

  - id: quant-processes.poisson.interarrival
    kind: theorem
    prominence: 2
    title: "Interarrival times are iid exponential"
    statement: >
      Let $T_1 < T_2 < \cdots$ be the arrival times of a rate-$\lambda$ Poisson
      process and set $X_1 = T_1$ and $X_n = T_n - T_{n-1}$. Then
      $X_1, X_2, \dots$ are independent and each is $\operatorname{Exp}(\lambda)$.
      The first gap is immediate:
      $\Pr(X_1 > t) = \Pr(N(t) = 0) = e^{-\lambda t}$; independent stationary
      increments restart the clock at each arrival, and memorylessness is exactly
      what keeps every restarted gap exponential with the same rate. The converse
      holds as well — iid $\operatorname{Exp}(\lambda)$ gaps build a Poisson
      process of rate $\lambda$, which is the cleanest way to simulate one. At
      $\lambda = 4$ per hour the mean gap is $1/\lambda = 15$ minutes.
    summary: >
      The gaps between Poisson arrivals are independent exponentials of the same
      rate, and conversely iid exponential gaps generate a Poisson process.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.pp
      - quant-probability.continuous.memoryless-exponential
    relates: []
    tags: []

  - id: quant-processes.poisson.arrival-times
    kind: proposition
    prominence: 1
    title: "Arrival times are Erlang; the count–time duality"
    statement: >
      The $n$-th arrival time $T_n = X_1 + \cdots + X_n$ sums $n$ iid
      $\operatorname{Exp}(\lambda)$ gaps, so it has the Erlang density
      $\lambda^{n} t^{n-1} e^{-\lambda t}/(n-1)!$ on $t > 0$, with
      $\mathbb{E}[T_n] = n/\lambda$ and
      $\operatorname{Var}(T_n) = n/\lambda^{2}$. The bridge between the two
      descriptions of the process is the duality
      $\{T_n \le t\} = \{N(t) \ge n\}$: "the $n$-th arrival has happened by $t$"
      and "at least $n$ arrivals by $t$" are the same event. Read right to left
      it hands over the Erlang cdf for free,
      $\Pr(T_n \le t) = 1 - \sum_{k=0}^{n-1} e^{-\lambda t}(\lambda t)^{k}/k!$.
      At $4$ buses per hour the third bus is expected at $45$ minutes.
    summary: >
      Waiting for the $n$-th arrival is a Gamma$(n,\lambda)$ variable with mean
      $n/\lambda$, and the event "$T_n \le t$" is literally the event
      "$N(t) \ge n$".
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.interarrival
    relates:
      - id: quant-probability.continuous.gamma
        note: >
          $T_n$ is exactly the Gamma variable defined there as a sum of $n$ iid
          exponentials; the process supplies its meaning as the epoch of the
          $n$-th arrival, and the duality converts its cdf into a Poisson tail.
    tags: []

  - id: quant-processes.poisson.fresh-start
    kind: proposition
    prominence: 1
    title: "Fresh start: the process has no memory"
    statement: >
      Fix a time $s$. Conditional on the entire history up to $s$, the shifted
      process $u \mapsto N(s+u) - N(s)$ is again a Poisson process of rate
      $\lambda$, independent of that history. The wait from $s$ to the next
      arrival is $\operatorname{Exp}(\lambda)$ however long it has been since the
      last one, so an arrival is never "due" and no amount of past drought raises
      the odds. The same restart holds at a stopping time — an arrival epoch, or
      the first time the count reaches $k$ — but not at a time chosen with
      knowledge of the future, and "the instant just before the next arrival" is
      not a stopping time. Interview phrasing: a component with exponential
      lifetime is as good as new until it dies.
    summary: >
      From any fixed time or stopping time the process starts over identically
      and independently of the past — the bus is never overdue.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.interarrival
    relates:
      - id: quant-probability.discrete.memoryless-geometric
        note: >
          Discrete twin of the same phenomenon: the geometric is the only lattice
          waiting law with no memory and the exponential the only continuous one,
          which is why per-slot Bernoulli trials converge to this process.
    tags: []

  - id: quant-processes.poisson.superposition
    kind: proposition
    prominence: 1
    title: "Superposition: rates add"
    statement: >
      If $N_1, \dots, N_k$ are independent Poisson processes of rates
      $\lambda_1, \dots, \lambda_k$, the merged process
      $N = N_1 + \cdots + N_k$, which fires whenever any component fires, is a
      Poisson process of rate $\lambda = \lambda_1 + \cdots + \lambda_k$.
      Increments stay independent and stationary because the components are
      independent of one another, and independent Poisson counts add. The
      independence hypothesis is not decoration: listing every arrival of a
      single process twice also gives mean rate $2\lambda$, but the arrivals come
      in coincident pairs and the result is not a Poisson process. With three
      independent feeds at $2$, $3$ and $5$ messages per minute, the wait for the
      next message anywhere is $\operatorname{Exp}(10)$, mean $6$ seconds.
    summary: >
      Merging independent Poisson streams gives a Poisson stream whose rate is
      the sum — so the wait for "the next of any type" uses the total rate.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.pp
    relates: []
    tags: []

  - id: quant-processes.poisson.thinning
    kind: proposition
    prominence: 1
    title: "Thinning: independent splitting by coin flips"
    statement: >
      Take a rate-$\lambda$ Poisson process and label each arrival independently
      as type $i$ with probability $p_i$, where $p_1 + \cdots + p_k = 1$ and the
      labels are independent of the arrival times. Then the type-$i$ arrivals
      form a Poisson process of rate $\lambda p_i$, and — the part that surprises
      people — the $k$ resulting processes are mutually independent. Learning
      that $17$ type-1 arrivals landed in a window tells you nothing about the
      type-2 count there, even though the two must add up to the total. That
      independence is special to a Poisson total: split a fixed number $n$ of
      arrivals instead and the two counts are binomial and perfectly negatively
      dependent.
    summary: >
      Coin-flip labelling of Poisson arrivals produces independent Poisson
      processes with rates $\lambda p_i$ — the counts decouple only because the
      total is Poisson.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.pp
    relates: []
    tags: []

  - id: quant-processes.poisson.thinning-example
    kind: example
    prominence: 0
    title: "Splitting a trade tape by side"
    statement: >
      Prints arrive on a tape as a Poisson process at $300$ per hour and each is
      independently a buy with probability $0.4$. Buys then form a Poisson
      process at $120$ per hour, sells at $180$ per hour, and the two streams are
      independent. Per minute the buy rate is $2$, so the chance of exactly two
      buys in a given minute is $e^{-2}2^{2}/2! \approx 0.271$ and the chance of
      no buy in that minute is $e^{-2} \approx 0.135$. The expected wait for the
      next buy is $30$ seconds no matter how many sells print meanwhile. Real
      order flow is clustered and its side is autocorrelated, so treat this as a
      baseline model rather than a description; the deviations are the subject
      matter of market microstructure.
    summary: >
      A $300$-per-hour tape that is $40\%$ buys splits into independent
      $120$-per-hour and $180$-per-hour Poisson streams.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.thinning
    relates: []
    tags: []

  - id: quant-processes.poisson.rate-race
    kind: proposition
    prominence: 1
    title: "Which process arrives first"
    statement: >
      Let $N_1$ and $N_2$ be independent Poisson processes of rates $\lambda_1$
      and $\lambda_2$. The next arrival overall comes after
      $\operatorname{Exp}(\lambda_1 + \lambda_2)$ time and is of type 1 with
      probability $\lambda_1/(\lambda_1 + \lambda_2)$, independently of when it
      occurs and of everything before it. Running the race repeatedly, the number
      of type-1 arrivals preceding the first type-2 arrival is geometric on
      $\{0, 1, 2, \dots\}$ with success probability
      $\lambda_2/(\lambda_1 + \lambda_2)$ and mean $\lambda_1/\lambda_2$. With
      $\lambda_1 = 3$ and $\lambda_2 = 2$ per hour: the next event is type 1 with
      probability $3/5$, and on average $1.5$ type-1 events arrive before the
      first type-2 event.
    summary: >
      In a race between independent Poisson clocks, the winner is type $i$ with
      probability $\lambda_i/\sum\lambda_j$, independent of the winning time.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.superposition
      - quant-processes.poisson.thinning
      - quant-probability.continuous.min-exponentials
    relates: []
    tags: []

  - id: quant-processes.poisson.conditional-uniformity
    kind: theorem
    prominence: 1
    title: "Conditional uniformity of arrival times"
    statement: >
      Condition on $N(t) = n$. Then the ordered arrival times
      $(T_1, \dots, T_n)$ have exactly the law of the order statistics of $n$ iid
      $\operatorname{Uniform}(0,t)$ variables; equivalently, the unordered set of
      arrival times is $n$ independent uniform points on $[0,t]$. The rate
      $\lambda$ vanishes from the conditional law — it governs how many arrivals
      occur, not where they sit. Two consequences do most of the work in
      problems: $\mathbb{E}[T_k \mid N(t) = n] = kt/(n+1)$, and each arrival
      independently falls in a subinterval of length $s$ with probability $s/t$,
      so the conditional law of $N(s)$ given $N(t) = n$ is
      $\operatorname{Binomial}(n, s/t)$ for $s < t$.
    summary: >
      Given the number of arrivals in a window, their times are just uniform
      points scattered in it — the rate drops out entirely.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.pp
      - quant-probability.random-variables.order-statistics
      - quant-probability.continuous.uniform
    relates: []
    tags: []

  - id: quant-processes.poisson.uniformity-waiting
    kind: example
    prominence: 0
    title: "Waiting accumulated by arrivals in a window"
    statement: >
      Buses run as a Poisson process at $4$ per hour and exactly $3$ arrive in a
      given hour. Given that, the three times are uniform on the hour, so the
      first is expected at $60 \cdot 1/4 = 15$ minutes, the second at $30$ and
      the third at $45$. Passengers who have queued since the start of the hour
      accumulate total waiting $T_1 + T_2 + T_3$, whose conditional mean is
      $3 \cdot 60/2 = 90$ minutes. Unconditionally, the aggregate time-in-system
      of everything that arrives during $[0,t]$, measured up to $t$, is
      $\sum_i (t - T_i)$ with mean $\lambda t \cdot t/2 = \lambda t^{2}/2$ — at
      $\lambda = 4$ and $t = 1$ hour, exactly $2$ hours of aggregate waiting.
    summary: >
      Given $3$ buses in an hour they average $15$, $30$ and $45$ minutes in, and
      the aggregate waiting is $90$ minutes.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.conditional-uniformity
    relates: []
    tags: []

  - id: quant-processes.poisson.inspection-paradox
    kind: example
    prominence: 2
    title: "Inspection paradox: waiting for the bus"
    statement: >
      Buses arrive as a Poisson process at $\lambda = 4$ per hour, so the average
      gap between consecutive buses is $1/\lambda = 15$ minutes. Turn up at any
      fixed clock time: by the fresh-start property your wait for the next bus is
      $\operatorname{Exp}(4)$ with mean $15$ minutes, not $7.5$, and it does not
      shrink if you arrive "late". For a process running since long before, the
      time back to the previous bus is also $\operatorname{Exp}(4)$ with mean
      $15$, so the gap you landed inside has expected length $2/\lambda = 30$
      minutes — double the average gap. No contradiction: a fixed time is more
      likely to fall in a long gap, and the straddling gap has the size-biased
      density $\lambda^{2}xe^{-\lambda x}$, mean $2/\lambda$.
    summary: >
      At $4$ buses an hour you wait $15$ minutes on average whenever you show up,
      and the gap you land in averages $30$ minutes rather than $15$.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.fresh-start
    relates: []
    tags: []

  - id: quant-processes.poisson.length-bias
    kind: intuition
    prominence: 1
    title: "Length-biased sampling"
    statement: >
      Whenever intervals are sampled by hitting them with a point rather than by
      listing them, long intervals are over-represented in proportion to their
      length: the interval you land in has density $xf(x)/\mathbb{E}[X]$ and mean
      $\mathbb{E}[X^{2}]/\mathbb{E}[X]
      = \mathbb{E}[X] + \operatorname{Var}(X)/\mathbb{E}[X]$, which strictly
      exceeds $\mathbb{E}[X]$ unless the gaps are deterministic. Buses on an
      exact $15$-minute timetable give a $15$-minute gap and a $7.5$-minute wait;
      exponential gaps of the same mean give a $30$-minute gap and a $15$-minute
      wait. The identical bias inflates the class size a random student reports,
      the queue a random customer joins, and any statistic computed on
      time-sampled rather than event-sampled data.
    summary: >
      Sampling by time rather than by event inflates what you see by
      $\operatorname{Var}(X)/\mathbb{E}[X]$ — variability in the gaps is the
      whole penalty.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.inspection-paradox
    relates: []
    tags: []

  - id: quant-processes.poisson.compound
    kind: proposition
    prominence: 1
    title: "Compound Poisson process"
    statement: >
      Attach iid marks $Y_1, Y_2, \dots$ with mean $\mu$ and variance
      $\sigma^{2}$, independent of the arrivals, and total them:
      $S(t) = \sum_{i=1}^{N(t)} Y_i$. The random-sum formulas give
      $\mathbb{E}[S(t)] = \lambda t \mu$ and
      $\operatorname{Var}(S(t)) = \lambda t(\sigma^{2} + \mu^{2})
      = \lambda t\,\mathbb{E}[Y^{2}]$ — the variance is driven by the second
      moment of the mark, not its variance, because the random count contributes
      as well. Worked: trades arrive at $600$ per hour with sizes of mean $200$
      and standard deviation $150$ shares, so hourly volume has mean
      $120\,000$ shares and variance $600(150^{2} + 200^{2}) = 37\,500\,000$,
      a standard deviation of about $6\,124$ shares.
    summary: >
      Summing iid marks over Poisson arrivals gives mean $\lambda t \mu$ and
      variance $\lambda t\,\mathbb{E}[Y^{2}]$ — the model for aggregate volume or
      claim size.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.pp
      - quant-probability.conditioning.random-sums
    relates: []
    tags: []

  - id: quant-processes.poisson.nonhomogeneous
    kind: definition
    prominence: 0
    title: "Non-homogeneous Poisson process"
    statement: >
      Drop stationarity and let the rate move. Given an intensity
      $\lambda(t) \ge 0$ with mean function
      $m(t) = \int_{0}^{t}\lambda(u)\,du$, the non-homogeneous Poisson process
      has independent increments and
      $N(b) - N(a) \sim \operatorname{Poisson}(m(b) - m(a))$. Gaps are no longer
      iid exponential, and the fresh-start property survives only as
      independence of the future from the past, not as a common law. A time
      change restores the standard case: running the clock on $m$ turns the
      process into a rate-$1$ Poisson process, so one simulates by drawing
      rate-$1$ arrivals and mapping them through $m^{-1}$. Arrival intensities in
      markets are strongly time-of-day dependent, which is the first correction
      any realistic arrival model makes.
    summary: >
      A Poisson process with a time-varying rate: counts are Poisson with mean
      $\int \lambda$, and a time change converts it back to the standard one.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.infinitesimal-definition
    relates: []
    tags: []

  - id: quant-processes.poisson.clumping
    kind: intuition
    prominence: 1
    title: "Poisson arrivals look clumpy"
    statement: >
      Points of a Poisson process are not evenly spread, and a picture of them
      fools nearly everyone. Gaps are exponential, whose density is largest at
      $0$: the chance a gap is under a tenth of the mean is
      $1 - e^{-0.1} \approx 9.5\%$, so short gaps and visible bunches are the
      norm rather than evidence of a burst. Counts wobble too, since
      $\operatorname{Var}(N(t)) = \lambda t$ makes the typical deviation
      $\sqrt{\lambda t}$ — an expected $100$ arrivals routinely shows up as $90$
      or $110$. The test that runs the other way is worth carrying: an index of
      dispersion $\operatorname{Var}(N)/\mathbb{E}[N]$ well above $1$ signals
      genuine clustering, well below $1$ a timetable.
    summary: >
      Randomness bunches: exponential gaps make clusters ordinary, and
      $\operatorname{Var}(N)/\mathbb{E}[N] = 1$ is the yardstick for calling a
      stream Poisson.
    parent: quant-processes.poisson
    also_under: []
    requires:
      - quant-processes.poisson.interarrival
    relates: []
    tags: []
