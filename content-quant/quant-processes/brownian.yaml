# quant-processes.brownian — Brownian Motion
# Outline node (24 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-processes.brownian
    kind: subbranch
    title: "Brownian Motion"
    summary: >
      The continuum limit of the walk — Gaussian increments, scaling,
      reflection, hitting times and the running maximum.
    parent: quant-processes
    also_under: []
    tags: []

  - id: quant-processes.brownian.bm
    kind: definition
    prominence: 2
    title: "Standard Brownian motion"
    statement: >
      A standard Brownian motion is a process $(B_t)_{t \ge 0}$ with four
      defining properties: $B_0 = 0$; independent increments, meaning
      $B_{t_1} - B_{t_0}, \dots, B_{t_n} - B_{t_{n-1}}$ are independent for
      every $0 \le t_0 < t_1 < \dots < t_n$; stationary Gaussian increments,
      $B_t - B_s \sim N(0, t-s)$ for $s < t$, so the law of an increment depends
      only on the elapsed time and not on where it starts; and continuous sample
      paths with probability $1$. Consequently $B_t \sim N(0,t)$, with mean $0$,
      variance $t$ and standard deviation $\sqrt{t}$. That such a process exists
      is Wiener's theorem; an interview takes it for granted, and everything in
      this subbranch is squeezed out of these four properties.
    summary: >
      Continuous-time randomness in its purest form: start at zero, independent
      normal increments whose variance is the elapsed time, continuous paths.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-probability.continuous.normal-sums
    relates: []
    tags: []

  - id: quant-processes.brownian.walk-limit
    kind: theorem
    prominence: 1
    title: "Brownian motion as the scaling limit of a random walk"
    statement: >
      Let $S_n$ be a simple symmetric random walk. Rescale space by $\sqrt{n}$
      while compressing time by $n$, setting
      $W^{(n)}_t = S_{\lfloor nt \rfloor}/\sqrt{n}$. Then $W^{(n)}$ converges in
      distribution to a standard Brownian motion — Donsker's invariance
      principle. At a single time this is exactly the central limit theorem,
      $S_{\lfloor nt \rfloor}/\sqrt{n} \to N(0,t)$, and independence of disjoint
      blocks of steps becomes independence of increments. Two consequences worth
      carrying into an interview: the limit does not depend on the step law
      provided the steps have mean $0$ and finite variance $\sigma^{2}$ (the
      limit is then $\sigma B$), and every walk formula that survives a
      continuous limit reappears below with $\sqrt{n}$ replaced by $\sqrt{t}$.
    summary: >
      Speed a $\pm 1$ walk up by $n$ and shrink it by $\sqrt{n}$ and you get
      Brownian motion — the central limit theorem applied to whole paths.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.bm
      - quant-processes.random-walks.ssrw
      - quant-probability.limits.clt
    relates: []
    tags: []

  - id: quant-processes.brownian.scaling
    kind: proposition
    prominence: 1
    title: "Scaling and the symmetries of the path"
    statement: >
      Brownian motion is self-similar: for every $c > 0$ the process
      $\tilde{B}_t = c^{-1/2} B_{ct}$ is again a standard Brownian motion, the
      only real content being
      $\operatorname{Var}(c^{-1/2}B_{ct}) = c^{-1} \cdot ct = t$. Three
      companion symmetries: $-B_t$ is a Brownian motion (reflection in the
      axis), $B_{t_0+t} - B_{t_0}$ is one for each fixed $t_0$, and $tB_{1/t}$,
      set to $0$ at $t = 0$, is one (time inversion). The practical content is
      the $\sqrt{t}$ law: displacement by time $t$ is of order $\sqrt{t}$, with
      $\mathbb{E}|B_t| = \sqrt{2t/\pi} \approx 0.80\sqrt{t}$. Quadrupling the
      horizon only doubles the spread, and a plot of $B$ over $[0,1]$ is
      statistically a plot over $[0,100]$ with the axes relabelled.
    summary: >
      Shrink time by $c$ and space by $\sqrt{c}$ and nothing changes; distance
      travelled grows like $\sqrt{t}$, not like $t$.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.bm
    relates: []
    tags: []

  - id: quant-processes.brownian.covariance
    kind: proposition
    prominence: 0
    title: "Covariance function min(s,t)"
    statement: >
      For $s \le t$, independent increments give
      $\operatorname{Cov}(B_s, B_t) = \operatorname{Cov}(B_s, B_s)
      + \operatorname{Cov}(B_s, B_t - B_s) = s$, so in general
      $\operatorname{Cov}(B_s, B_t) = \min(s,t)$ and
      $\operatorname{Corr}(B_s, B_t) = \sqrt{s/t}$. Every finite collection
      $(B_{t_1}, \dots, B_{t_n})$ is a linear image of independent normals and
      hence jointly Gaussian, so "mean-zero Gaussian process with covariance
      $\min(s,t)$, continuous paths" is an equivalent definition. Conditioning
      is linear: given $B_T = x$, the value $B_t$ for $t < T$ is normal with mean
      $(t/T)x$ and variance $t(T-t)/T$, largest at the midpoint. That
      conditioned path is the Brownian bridge, and it is why simulating a path
      by repeated midpoint interpolation works.
    summary: >
      Overlap in time is all that couples two values: covariance is the shared
      time $\min(s,t)$, and conditioning on a later value is linear.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.bm
    relates: []
    tags: []

  - id: quant-processes.brownian.markov-property
    kind: proposition
    prominence: 1
    title: "Markov and strong Markov property"
    statement: >
      Fix $s \ge 0$ and let $\mathcal{F}_s = \sigma(B_u : u \le s)$ record the
      past. Then $W_t = B_{s+t} - B_s$ is a standard Brownian motion independent
      of $\mathcal{F}_s$ — immediate from stationary independent increments. The
      strong Markov property upgrades the fixed time to a random one: if $\tau$
      is a stopping time with $\Pr(\tau < \infty) = 1$, then
      $W_t = B_{\tau+t} - B_\tau$ is again a standard Brownian motion
      independent of the path up to $\tau$. In words, at the first moment the
      path does something — hits a level, sets a new maximum — it forgets
      everything and starts afresh from where it stands. Every argument below
      that restarts the clock at a hitting time is this theorem, and it is what
      makes the reflection principle legal.
    summary: >
      The future given the present is a fresh Brownian motion, and this stays
      true at hitting times, not just at deterministic times.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.bm
    relates: []
    tags: []

  - id: quant-processes.brownian.martingale-property
    kind: proposition
    prominence: 1
    title: "The three Brownian martingales"
    statement: >
      Relative to its own filtration a standard Brownian motion supplies three
      martingales. First $B_t$ itself, since
      $\mathbb{E}[B_t \mid \mathcal{F}_s] = B_s + \mathbb{E}[B_t - B_s] = B_s$.
      Second $B_t^{2} - t$, since
      $\mathbb{E}[B_t^{2} \mid \mathcal{F}_s] = B_s^{2} + (t-s)$ by expanding
      $B_t = B_s + (B_t - B_s)$ and using that the increment has mean $0$ and
      variance $t-s$. Third the exponential martingale
      $\exp(\lambda B_t - \lambda^{2}t/2)$, for every real $\lambda$, which is
      the normal moment generating function
      $\mathbb{E}[e^{\lambda(B_t - B_s)}] = e^{\lambda^{2}(t-s)/2}$ rearranged.
      Paired with optional stopping these three answer almost every hitting
      question without solving a differential equation.
    summary: >
      $B_t$, $B_t^{2}-t$ and $\exp(\lambda B_t - \lambda^{2}t/2)$ are
      martingales — the levers behind every exit probability and exit time here.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.bm
    relates:
      - id: quant-processes.martingales.examples-zoo
        note: >
          These are the continuous-time images of the discrete zoo: $B_t$ plays
          $S_n$, $B_t^{2}-t$ plays $S_n^{2}-n$, and the exponential martingale
          plays $(q/p)^{S_n}$.
    tags: []

  - id: quant-processes.brownian.quadratic-variation
    kind: theorem
    prominence: 2
    title: "Quadratic variation is t"
    statement: >
      Take partitions $0 = t_0 < \dots < t_n = t$ with mesh
      $\max_i \Delta_i \to 0$, where $\Delta_i = t_i - t_{i-1}$. Then
      $\sum_{i=1}^{n} (B_{t_i} - B_{t_{i-1}})^{2} \to t$ in $L^{2}$, written
      $\langle B \rangle_t = t$, or informally $(dB)^{2} = dt$. Proof: the
      squared increments are independent, the $i$-th has mean $\Delta_i$ and
      variance $2\Delta_i^{2}$ because a standard normal has
      $\operatorname{Var}(Z^{2}) = 2$; so the sum has mean $\sum_i \Delta_i = t$
      exactly and variance
      $2\sum_i \Delta_i^{2} \le 2t \max_i \Delta_i \to 0$. A continuously
      differentiable path has quadratic variation $0$, so this is the
      non-classical feature of Brownian paths, and it is the second-order term
      that survives in Itô's lemma.
    summary: >
      Squared increments accumulate to the elapsed time rather than vanishing —
      the single fact that makes stochastic calculus differ from calculus.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.scaling
    relates: []
    tags: []

  - id: quant-processes.brownian.nondifferentiability
    kind: intuition
    prominence: 0
    title: "Why the path is nowhere differentiable"
    statement: >
      Over a window of length $h$ the increment is of size about $\sqrt{h}$, so
      the difference quotient is of order $\sqrt{h}/h = h^{-1/2}$, which blows
      up as $h \to 0$. The heuristic is a theorem: with probability $1$ the path
      is differentiable at no time, and has infinite total variation on every
      interval. The variation claim follows from quadratic variation, since
      $\sum_i (\Delta B_i)^{2} \le \left(\max_i |\Delta B_i|\right)
      \sum_i |\Delta B_i|$ and continuity sends the first factor to $0$, so
      finite total variation would force quadratic variation $0$ instead of $t$.
      Paths are Hölder continuous of every order $\alpha < 1/2$ and of no order
      $\alpha \ge 1/2$. Hence $\int f\,dB$ cannot be a pathwise
      Riemann–Stieltjes integral, which is why stochastic integration is its own
      subject.
    summary: >
      Increments of size $\sqrt{h}$ over windows of length $h$ make every slope
      infinite in the limit; the path wiggles at all scales at once.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.quadratic-variation
    relates: []
    tags: []

  - id: quant-processes.brownian.reflection-bm
    kind: theorem
    prominence: 2
    title: "Reflection principle for Brownian motion"
    statement: >
      Let $M_t = \max_{0 \le s \le t} B_s$ be the running maximum and fix a level
      $a > 0$. Then
      $\Pr(M_t \ge a) = 2\Pr(B_t \ge a) = \Pr(|B_t| \ge a)
      = 2\left(1 - \Phi(a/\sqrt{t})\right)$, where $\Phi$ is the standard normal
      distribution function. Proof: let $\tau_a$ be the first time the level is
      reached. On $\{\tau_a \le t\}$ the strong Markov property restarts the
      path at $a$, and the restarted path is symmetric, so it is equally likely
      to finish above or below $a$; hence
      $\Pr(M_t \ge a,\, B_t < a) = \Pr(M_t \ge a,\, B_t > a) = \Pr(B_t > a)$,
      the last step because finishing above $a$ already forces the maximum above
      $a$. Adding the two halves gives the factor $2$. Worked:
      $\Pr(M_1 \ge 1) = 2(1 - \Phi(1)) = 0.317$, twice the $0.159$ chance of
      ending above $1$.
    summary: >
      The chance of ever touching a level by time $t$ is exactly twice the
      chance of finishing beyond it — mirror the path after it first touches.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.markov-property
      - quant-processes.random-walks.reflection
    relates: []
    tags: []

  - id: quant-processes.brownian.running-max-law
    kind: corollary
    prominence: 1
    title: "Law of the running maximum"
    statement: >
      Reflection says $M_t$ and $|B_t|$ have the same distribution, so $M_t$ is
      a folded normal with density $\sqrt{2/(\pi t)}\,e^{-a^{2}/(2t)}$ for
      $a \ge 0$. Hence $\mathbb{E}[M_t] = \sqrt{2t/\pi} \approx 0.798\sqrt{t}$,
      $\mathbb{E}[M_t^{2}] = t$ and
      $\operatorname{Var}(M_t) = t(1 - 2/\pi) \approx 0.363t$. The joint version
      is $\Pr(M_t \ge a,\, B_t \le b) = \Pr(B_t \ge 2a - b)$ for
      $a \ge \max(b,0)$, the endpoint $2a - b$ being the mirror image of $b$ in
      the level $a$. Worked: a driftless log-price with $20\%$ annualized
      volatility has expected one-year high about
      $0.2\sqrt{2/\pi} \approx 16\%$ above its start. The drawdown from the peak,
      $M_t - B_t$, again has the law of $|B_t|$.
    summary: >
      The running maximum is distributed as $|B_t|$: mean $\sqrt{2t/\pi}$, and
      the drawdown from the peak has that same law.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.reflection-bm
    relates: []
    tags: []

  - id: quant-processes.brownian.hitting-time
    kind: proposition
    prominence: 1
    title: "Hitting time of a level: certain but with infinite mean"
    statement: >
      For $a > 0$ let $\tau_a = \inf\{t \ge 0 : B_t = a\}$. Since
      $\{\tau_a \le t\} = \{M_t \ge a\}$, reflection gives
      $\Pr(\tau_a \le t) = 2\left(1 - \Phi(a/\sqrt{t})\right)$, and
      differentiating in $t$ gives the density
      $f(t) = \dfrac{a}{\sqrt{2\pi t^{3}}}\,e^{-a^{2}/(2t)}$ for $t > 0$. Letting
      $t \to \infty$ the probability tends to $1$, so every level is reached
      eventually. Yet $\mathbb{E}[\tau_a] = \infty$: for large $t$ the density
      behaves like $a\,t^{-3/2}/\sqrt{2\pi}$, and
      $\int^{\infty} t \cdot t^{-3/2}\,dt$ diverges. Scaling fixes the shape:
      $\tau_a$ has the law of $a^{2}\tau_1$, so distance costs quadratically in
      time, and the median is $a^{2}/(0.6745)^{2} \approx 2.20a^{2}$ while the
      mean is dragged to infinity by excursions the wrong way.
    summary: >
      Brownian motion hits every level with probability $1$, but the waiting
      time has a $t^{-3/2}$ tail, so its expectation is infinite.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.reflection-bm
      - quant-processes.brownian.scaling
    relates: []
    tags: []

  - id: quant-processes.brownian.two-sided-exit
    kind: proposition
    prominence: 1
    title: "Two-sided exit: continuous gambler's ruin"
    statement: >
      Fix $a, b > 0$ and let $\tau = \inf\{t \ge 0 : B_t \notin (-b, a)\}$; this
      $\tau$ is finite with probability $1$ and has finite mean, so optional
      stopping applies to bounded stopped martingales. Using $B_t$:
      $0 = \mathbb{E}[B_\tau] = ap - b(1-p)$, so the probability of touching $a$
      before $-b$ is $p = b/(a+b)$. Using $B_t^{2} - t$:
      $\mathbb{E}[\tau] = \mathbb{E}[B_\tau^{2}]
      = a^{2}\dfrac{b}{a+b} + b^{2}\dfrac{a}{a+b} = ab$. Symmetric barriers
      $a = b$ give a coin flip and $\mathbb{E}[\tau] = a^{2}$. Sending
      $b \to \infty$ explains the previous node: $p \to 1$, so the level $a$ is
      certain, while $\mathbb{E}[\tau] = ab \to \infty$.
    summary: >
      Hit $a$ before $-b$ with probability $b/(a+b)$, in expected time $ab$ —
      the $k/N$ ruin formulas read off two martingales.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.martingale-property
      - quant-processes.martingales.ost
    relates: []
    tags: []

  - id: quant-processes.brownian.bm-with-drift
    kind: definition
    prominence: 1
    title: "Brownian motion with drift"
    statement: >
      Arithmetic Brownian motion is $X_t = x_0 + \mu t + \sigma B_t$, with drift
      $\mu$ per unit time and volatility $\sigma > 0$; it has independent
      increments and $X_t \sim N(x_0 + \mu t,\, \sigma^{2}t)$. Signal and noise
      scale differently — the mean like $t$, the standard deviation like
      $\sqrt{t}$ — so their ratio $\mu t/(\sigma\sqrt{t}) = (\mu/\sigma)\sqrt{t}$
      grows like $\sqrt{t}$. That ratio per year is the Sharpe ratio, and its
      slow growth is why real edges are invisible over short horizons. Worked: a
      strategy with $\mu = 8\%$ and $\sigma = 16\%$ per year has Sharpe $0.5$, so
      separating its drift from zero at two standard errors needs
      $0.5\sqrt{t} = 2$, that is $t = 16$ years of track record. The same model
      applied to the log price, rather than the price, is geometric Brownian
      motion.
    summary: >
      A tilted Brownian motion, $\mu t + \sigma B_t$: mean grows linearly, noise
      only like $\sqrt{t}$, so the Sharpe ratio grows like $\sqrt{t}$.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.bm
    relates: []
    tags: []

  - id: quant-processes.brownian.drift-hitting
    kind: proposition
    prominence: 1
    title: "Hitting probabilities under drift"
    statement: >
      Let $X_t = \mu t + \sigma B_t$ with $X_0 = 0$. Since
      $\mathbb{E}[e^{\theta X_t}] = e^{(\theta\mu + \theta^{2}\sigma^{2}/2)t}$,
      the process $e^{\theta X_t}$ is a martingale exactly for $\theta = 0$ and
      $\theta = -2\mu/\sigma^{2}$. Optional stopping with the nonzero root, at
      the exit time from $(-b, a)$, gives
      $p\,e^{\theta a} + (1-p)e^{-\theta b} = 1$, so the chance of reaching $a$
      first is $p = \dfrac{1 - e^{-\theta b}}{e^{\theta a} - e^{-\theta b}}$,
      which returns $b/(a+b)$ as $\mu \to 0$. One-sided, for $\mu > 0$ the chance
      of ever falling to $-b$ is $e^{-2\mu b/\sigma^{2}}$; for $\mu < 0$,
      $\Pr(\sup_t X_t \ge a) = e^{-2|\mu|a/\sigma^{2}}$. Worked: $\mu = 10\%$ and
      $\sigma = 20\%$ per year make $2\mu/\sigma^{2} = 5$, so an eventual $20\%$
      drawdown has probability $e^{-1} \approx 0.37$.
    summary: >
      With drift $\mu$ and volatility $\sigma$, the chance of ever drawing down
      $b$ is $e^{-2\mu b/\sigma^{2}}$ — edge kills the downside exponentially.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.bm-with-drift
      - quant-processes.brownian.two-sided-exit
    relates:
      - id: quant-processes.ruin.biased
        note: >
          $e^{-2\mu b/\sigma^{2}}$ is the continuum limit of the biased-ruin
          factor $(q/p)^{k}$: same exponential martingale, same geometry, walk
          steps replaced by a drift and a volatility.
    tags: []

  - id: quant-processes.brownian.vol-scaling
    kind: technique
    prominence: 1
    title: "Square-root-of-time volatility scaling"
    statement: >
      Because $\operatorname{Var}(B_t) = t$, variances add across disjoint
      periods and volatilities add in quadrature:
      $\sigma(T) = \sigma(1)\sqrt{T}$. Reach for this whenever a quoted
      volatility has to be moved between horizons. Daily to annual over $252$
      trading days uses $\sqrt{252} \approx 15.87 \approx 16$, so a $1\%$ daily
      standard deviation is a $16\%$ annual volatility — the desk shorthand
      "vol of 16 means about a percent a day". Going the other way, a $20\%$
      annual vol is $20/\sqrt{12} \approx 5.8\%$ monthly and
      $20/15.87 \approx 1.26\%$ daily. Drift scales like $T$, not $\sqrt{T}$, so
      Sharpe ratios multiply by $\sqrt{252} \approx 16$ from daily to annual.
      The rule needs uncorrelated increments: mean reversion scales slower,
      trending faster.
    summary: >
      Volatility grows like $\sqrt{T}$ and drift like $T$; $\sqrt{252} \approx
      16$ converts daily to annual in both directions.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.scaling
    relates:
      - id: quant-probability.limits.root-n
        note: >
          The same square-root law seen from the two ends: averaging $n$
          observations shrinks error like $1/\sqrt{n}$, while accumulating $T$
          periods of risk grows spread like $\sqrt{T}$.
    tags: []

  - id: quant-processes.brownian.arcsine
    kind: proposition
    prominence: 0
    title: "Zeros and the arcsine law"
    statement: >
      With probability $1$ the zero set of $B$ in $[0,1]$ is closed and
      uncountable, has Lebesgue measure $0$, and has infinitely many points in
      every interval $(0,\varepsilon)$: self-similarity means the path recrosses
      immediately after each visit. The time $A$ spent positive during $[0,1]$
      follows the arcsine law
      $\Pr(A \le x) = \frac{2}{\pi}\arcsin\sqrt{x}$, with density
      $1/(\pi\sqrt{x(1-x)})$ on $(0,1)$: the mean is $1/2$ but the density is
      U-shaped, with its modes at $0$ and $1$. The last zero before time $1$ and
      the location of the maximum obey the same law. Reading: leads are sticky.
      One side is ahead for at least $90\%$ of a fair game with probability
      $\frac{4}{\pi}\arcsin\sqrt{0.1} \approx 0.41$, so a near-even split of the
      lead is the rare outcome.
    summary: >
      Time spent ahead is not concentrated near half: the arcsine density piles
      up at $0$ and $1$, so one side usually leads nearly the whole way.
    parent: quant-processes.brownian
    also_under: []
    requires:
      - quant-processes.brownian.hitting-time
    relates: []
    tags: []
