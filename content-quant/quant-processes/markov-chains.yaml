nodes:
  - id: quant-processes.markov-chains
    kind: subbranch
    title: "Markov Chains"
    summary: >
      Memoryless state dynamics — transition matrices, absorption
      equations, stationary distributions and reversibility.
    parent: quant-processes
    also_under: []
    tags: []

  - id: quant-processes.markov-chains.markov-property
    kind: definition
    prominence: 2
    title: "Markov property"
    statement: >
      A process $X_0, X_1, X_2, \dots$ taking values in a countable state space
      $S$ is a Markov chain if
      $\Pr(X_{n+1} = j \mid X_n = i, X_{n-1} = i_{n-1}, \dots, X_0 = i_0)
      = \Pr(X_{n+1} = j \mid X_n = i)$
      whenever the conditioning event has positive probability: given the
      present state, the future is conditionally independent of the past. The
      chain is time-homogeneous when that common value $p_{ij}$ does not depend
      on $n$, which is assumed unless stated otherwise. The interview move is to
      engineer the property rather than check it — "how many heads so far" is
      not Markov for a pattern-waiting problem, but "how much of the pattern is
      currently matched" is.
    summary: >
      The future depends on the past only through the present state — and most
      non-Markov problems become Markov once the state is enlarged enough.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-probability.conditional.conditional-probability
    relates: []
    tags: []

  - id: quant-processes.markov-chains.transition-matrix
    kind: definition
    prominence: 2
    title: "Transition matrix"
    statement: >
      Collect the one-step probabilities into $P$ with entries
      $p_{ij} = \Pr(X_{n+1} = j \mid X_n = i)$. Row $i$ is the law of the next
      state given current state $i$, so every entry is nonnegative and every row
      sums to $1$; such a $P$ is called stochastic, and its columns need not sum
      to anything in particular. Distributions are row vectors acting on the
      left: if $\mu_n$ is the law of $X_n$ then $\mu_{n+1} = \mu_n P$ and
      $\mu_n = \mu_0 P^{n}$. Two states, "sunny" and "rainy", with rows
      $(0.9, 0.1)$ and $(0.5, 0.5)$, is the shape almost every interview chain
      takes; write the rows out in words before touching algebra.
    summary: >
      One row per state holding that state's next-step law, so the whole
      dynamics is a nonnegative matrix whose rows sum to $1$.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.markov-property
      - quant-tools.linear-algebra.matrix-algebra
    relates: []
    tags: []

  - id: quant-processes.markov-chains.chapman-kolmogorov
    kind: proposition
    prominence: 1
    title: "Chapman–Kolmogorov equations"
    statement: >
      Write $p^{(n)}_{ij} = \Pr(X_n = j \mid X_0 = i)$. Partitioning on the
      state occupied at an intermediate time and applying the Markov property
      gives $p^{(m+n)}_{ij} = \sum_{k \in S} p^{(m)}_{ik}\,p^{(n)}_{kj}$ for all
      $m, n \ge 0$. That right-hand side is precisely the $(i,j)$ entry of
      $P^{m}P^{n}$, so $n$-step probabilities are the entries of the matrix
      power: $p^{(n)}_{ij} = (P^{n})_{ij}$, with $P^{0} = I$. Matrix
      multiplication is therefore nothing but the law of total probability
      applied to the midpoint. Corollary used constantly: if
      $p^{(m)}_{ik} > 0$ and $p^{(n)}_{kj} > 0$ then $p^{(m+n)}_{ij} > 0$, so
      reachability composes.
    summary: >
      Go from $i$ to $j$ in $m+n$ steps by summing over the midpoint — which is
      exactly why $n$-step probabilities are the entries of $P^{n}$.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.transition-matrix
      - quant-probability.conditional.total-probability
    relates: []
    tags: []

  - id: quant-processes.markov-chains.matrix-powers
    kind: technique
    prominence: 1
    title: "n-step probabilities by diagonalization"
    statement: >
      When you need $P^{n}$ in closed form rather than numerically, diagonalize:
      if $P = VDV^{-1}$ with eigenvalues $\lambda_1, \dots, \lambda_m$ then
      $P^{n} = VD^{n}V^{-1}$, so every entry of $P^{n}$ is a fixed linear
      combination of $\lambda_1^{n}, \dots, \lambda_m^{n}$. Every stochastic
      matrix has $\lambda = 1$ as an eigenvalue, with the all-ones column vector
      as right eigenvector, and all eigenvalues satisfy $|\lambda| \le 1$. The
      $\lambda = 1$ term contributes the constant limit, so the approach to it
      decays like $|\lambda_2|^{n}$, the second-largest modulus. For a two-state
      chain with rows $(1-a, a)$ and $(b, 1-b)$ the eigenvalues are $1$ and
      $1-a-b$.
    summary: >
      Eigenvalues turn $P^{n}$ into a combination of $\lambda^{n}$ terms; the
      second-largest one sets the speed at which the chain settles.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.chapman-kolmogorov
      - quant-tools.linear-algebra.diagonalization-powers
    relates: []
    tags: []

  - id: quant-processes.markov-chains.communicating-classes
    kind: definition
    prominence: 1
    title: "Communicating classes and irreducibility"
    statement: >
      State $j$ is accessible from $i$, written $i \to j$, if
      $p^{(n)}_{ij} > 0$ for some $n \ge 0$; states $i$ and $j$ communicate if
      each is accessible from the other. Communication is an equivalence
      relation, so $S$ splits into disjoint communicating classes. A class is
      closed if no transition leaves it, and an absorbing state is a closed
      class of size one, that is $p_{ii} = 1$. The chain is irreducible when
      there is exactly one class, so every state reaches every other. This is
      the standing hypothesis behind uniqueness of the stationary distribution,
      and a chain with an absorbing state is never irreducible — absorption
      problems and equilibrium problems are the two sides of this dichotomy.
    summary: >
      Group states by mutual reachability; one class means irreducible, and a
      closed class of size one is an absorbing state.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.chapman-kolmogorov
    relates: []
    tags: []

  - id: quant-processes.markov-chains.classification
    kind: definition
    prominence: 1
    title: "Recurrent, transient and periodic states"
    statement: >
      Let $f_i = \Pr(\text{the chain ever returns to } i \mid X_0 = i)$. State
      $i$ is recurrent if $f_i = 1$, in which case it is revisited infinitely
      often with probability $1$, and transient if $f_i < 1$, in which case the
      total number of visits is geometric with finite mean $1/(1-f_i)$.
      Equivalently, $i$ is recurrent exactly when
      $\sum_{n \ge 1} p^{(n)}_{ii} = \infty$. A recurrent state is positive
      recurrent when its mean return time is finite and null recurrent
      otherwise, and its period is $d(i) = \gcd\{n \ge 1 : p^{(n)}_{ii} > 0\}$.
      Recurrence, positive recurrence and period are all class properties,
      shared by every state of a communicating class. In a finite chain, states
      of a closed class are positive recurrent and null recurrence cannot occur.
    summary: >
      Recurrent states come back for certain, transient ones are visited
      finitely often, and recurrence, positive recurrence and period are shared
      across a class.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.communicating-classes
    relates: []
    tags: []

  - id: quant-processes.markov-chains.periodicity
    kind: definition
    prominence: 1
    title: "Period and aperiodicity"
    statement: >
      The period $d(i) = \gcd\{n \ge 1 : p^{(n)}_{ii} > 0\}$ measures the rhythm
      of returns to $i$; the state is aperiodic when $d(i) = 1$, and since the
      period is a class property an irreducible chain has a single period $d$.
      Period $2$ is the case that actually appears: a walk on an even cycle, or
      on any bipartite graph, returns only at even times and $P^{n}$ oscillates
      forever instead of converging. Cheap sufficient conditions for
      aperiodicity in an irreducible chain: some state has $p_{ii} > 0$, or two
      return lengths with greatest common divisor $1$ exist, such as a
      $3$-cycle and a $4$-cycle through the same state. A period-$d$ chain
      splits into $d$ cyclic subclasses visited in fixed rotation.
    summary: >
      The gcd of possible return times; a single self-loop makes an irreducible
      chain aperiodic, while bipartite structure forces period $2$.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.communicating-classes
    relates: []
    tags: []

  - id: quant-processes.markov-chains.absorption
    kind: technique
    prominence: 2
    title: "Absorption probabilities by first-step analysis"
    statement: >
      Reach for this whenever the chain has absorbing states and the question is
      "which one do we end up in?". Fix a target absorbing state $a$ and set
      $h_i = \Pr(\text{absorbed at } a \mid X_0 = i)$. Conditioning on the first
      step gives one linear equation per transient state,
      $h_i = \sum_{j} p_{ij} h_j$, with boundary conditions $h_a = 1$ and
      $h_b = 0$ at every other absorbing state. For a finite chain in which each
      transient state can reach absorption, the transient states are genuinely
      transient, absorption occurs with probability $1$, and the system has a
      unique solution; on an infinite state space take the minimal nonnegative
      solution instead. In practice: one unknown per transient state, merge
      unknowns using every symmetry, then solve.
    summary: >
      One equation per transient state, obtained by conditioning on the first
      move, with the absorbing states supplying the boundary values.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.classification
      - quant-tools.recurrences.first-step-analysis
    relates: []
    tags: []

  - id: quant-processes.markov-chains.tennis-deuce
    kind: example
    prominence: 1
    title: "Winning a game from deuce"
    statement: >
      At deuce a player wins each point independently with probability $p$ and
      must lead by two. The score is a chain on $\{D, A, B, W, L\}$: $D$ is
      deuce, $A$ and $B$ are the two advantage states, and $W$ and $L$ are
      absorbing. With $q = 1-p$ and $h$ the win probability from deuce,
      first-step analysis gives $h_A = p + q\,h$, $h_B = p\,h$, and
      $h = p\,h_A + q\,h_B$. Substituting, $h = p^{2} + 2pq\,h$, so
      $h = \dfrac{p^{2}}{1 - 2pq} = \dfrac{p^{2}}{p^{2}+q^{2}}$. At $p = 0.6$
      this is $0.36/(0.36+0.16) = 9/13 \approx 0.692$. A $60\%$ point-winner
      converts deuce $69\%$ of the time — the two-point margin amplifies a small
      per-point edge.
    summary: >
      Deuce collapses to a three-unknown system with answer
      $p^{2}/(p^{2}+q^{2})$, which is $9/13 \approx 0.69$ when $p = 0.6$.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.absorption
    relates: []
    tags: []

  - id: quant-processes.markov-chains.absorption-time
    kind: technique
    prominence: 1
    title: "Expected time to absorption"
    statement: >
      With the same setup, let $k_i$ be the expected number of steps until
      absorption starting from $i$. Conditioning on the first step costs one
      step and lands you somewhere new:
      $k_i = 1 + \sum_{j \text{ transient}} p_{ij} k_j$ for every transient $i$,
      with $k_a = 0$ at every absorbing state. Absorbing states drop out of the
      sum because they contribute no further steps. In matrix form, if $Q$ is
      the substochastic block of $P$ on the transient states, then
      $k = (I-Q)^{-1}\mathbf{1}$; the fundamental matrix $(I-Q)^{-1}$ has
      $(i,j)$ entry equal to the expected number of visits to $j$ before
      absorption, starting from $i$. Forgetting the $+1$ is the single most
      common error here.
    summary: >
      Same first-step system as for absorption probabilities, but every equation
      picks up a $+1$ for the step just taken.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.absorption
    relates: []
    tags: []

  - id: quant-processes.markov-chains.mouse-maze
    kind: example
    prominence: 1
    title: "Mouse in a maze"
    statement: >
      Rooms $A$, $B$, $C$ and an exit $E$. Two doors leave $A$, to $B$ and to
      $C$; two doors leave $B$, to $A$ and to $E$; room $C$ is a dead end whose
      single door returns to $A$. Each minute the mouse picks uniformly among
      the doors of its current room. The first-step equations are
      $k_A = 1 + \tfrac{1}{2}k_B + \tfrac{1}{2}k_C$,
      $k_B = 1 + \tfrac{1}{2}k_A$ and $k_C = 1 + k_A$. Substituting the last two
      into the first gives $k_A = 2 + \tfrac{3}{4}k_A$, hence $k_A = 8$, and
      then $k_B = 5$ and $k_C = 9$. Starting in $A$ the mouse needs $8$ minutes
      on average; the dead end is what makes it slow, since every visit there
      costs two wasted moves.
    summary: >
      Three unknowns, three equations, and the answer is $8$ minutes to escape
      from room $A$ (and $5$ from $B$, $9$ from the dead end).
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.absorption-time
    relates: []
    tags: []

  - id: quant-processes.markov-chains.drunkard-path
    kind: example
    prominence: 0
    title: "Drunkard on a path with two barriers"
    statement: >
      A walker on $\{0, 1, \dots, N\}$ moves $+1$ with probability $p$ and $-1$
      with probability $q = 1-p$, and the endpoints $0$ and $N$ are absorbing.
      As a chain this is the cleanest absorbing structure there is: two
      absorbing classes, one transient class $\{1, \dots, N-1\}$, and since any
      interior state reaches a barrier within $N$ steps with positive
      probability, absorption is certain — the walker cannot wander forever.
      Writing the first-step equations for the probability of hitting $N$, and
      for the expected duration, reproduces the gambler's ruin recursions
      verbatim; their closed forms in the fair and biased cases are solved in
      the ruin subbranch. What this example contributes is the structure, not
      the formula.
    summary: >
      The two-barrier walk read as a Markov chain: one transient class, two
      absorbing states, certain absorption — with the ruin formulas living
      elsewhere.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.absorption
      - quant-processes.random-walks.ssrw
    relates:
      - id: quant-processes.ruin.fair
        note: >
          Same chain, opposite emphasis: here it illustrates transient and
          absorbing classes, there the first-step system is solved to the
          ruin probability $1 - k/N$.
    tags: []

  - id: quant-processes.markov-chains.stationary
    kind: definition
    prominence: 2
    title: "Stationary distribution"
    statement: >
      A probability vector $\pi$ — nonnegative entries summing to $1$ — is
      stationary for $P$ if $\pi P = \pi$, that is
      $\pi_j = \sum_i \pi_i p_{ij}$ for every $j$. Start the chain from $\pi$
      and every $X_n$ has law $\pi$. Equivalently $\pi$ is a left eigenvector of
      $P$ for eigenvalue $1$, normalized to sum to $1$; in practice you solve
      $m-1$ of the $m$ balance equations, which are always linearly dependent,
      together with $\sum_i \pi_i = 1$. When the chain is irreducible and
      aperiodic, $\pi$ is also the limiting law: $(P^{n})_{ij} \to \pi_j$ from
      every start. Without those hypotheses $\pi$ may fail to exist (the walk on
      $\mathbb{Z}$) or fail to be unique (two absorbing states).
    summary: >
      The law that the chain leaves unchanged, $\pi P = \pi$ — and, for an
      irreducible aperiodic chain, the law it converges to from anywhere.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.transition-matrix
    relates:
      - id: quant-tools.linear-algebra.eigen
        note: >
          The stationary vector is the left eigenvector of $P$ for eigenvalue
          $1$, so existence is an eigenvalue fact and the remaining eigenvalues
          control how fast the chain settles onto it.
    tags: []

  - id: quant-processes.markov-chains.stationary-uniqueness
    kind: theorem
    prominence: 1
    title: "Existence and uniqueness of the stationary distribution"
    statement: >
      If a chain is irreducible and positive recurrent — the latter automatic
      for any finite irreducible chain — then it has exactly one stationary
      distribution $\pi$, and $\pi_i = 1/m_i$ where $m_i$ is the mean return
      time to $i$. Irreducibility is what buys uniqueness: the two-state chain
      in which both states are absorbing satisfies $\pi P = \pi$ for every
      probability vector $\pi$. Positive recurrence is what buys existence: the
      simple symmetric walk on $\mathbb{Z}$ is irreducible and recurrent but
      null recurrent, and carries no stationary probability vector, only an
      unnormalizable uniform measure. Aperiodicity is not needed here at all —
      a period-$2$ chain has a perfectly good unique $\pi$, it just does not
      converge to it.
    summary: >
      Irreducible plus positive recurrent gives one and only one $\pi$, with
      $\pi_i$ the reciprocal of the mean return time; aperiodicity is not part
      of this statement.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.stationary
      - quant-processes.markov-chains.communicating-classes
    relates: []
    tags: []

  - id: quant-processes.markov-chains.convergence-to-equilibrium
    kind: theorem
    prominence: 1
    title: "Convergence to equilibrium"
    statement: >
      If a chain is irreducible, aperiodic and positive recurrent then
      $(P^{n})_{ij} \to \pi_j$ as $n \to \infty$ for every pair of states, hence
      $\mu_0 P^{n} \to \pi$ for every initial law $\mu_0$: the chain forgets
      where it started. Both hypotheses are needed and they fail independently.
      Drop irreducibility and a chain with two absorbing states still converges,
      but to a limit that depends on the starting state. Drop aperiodicity and
      the two-state chain with rows $(0,1)$ and $(1,0)$ is irreducible with
      $\pi = (1/2, 1/2)$, yet $P^{n}$ alternates between the identity and the
      swap and never converges. On a finite chain the convergence is geometric
      at rate $|\lambda_2|$.
    summary: >
      Irreducible and aperiodic together force $P^{n}$ to converge to $\pi$ from
      any start; period $2$ breaks it even though $\pi$ still exists.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.stationary-uniqueness
      - quant-processes.markov-chains.periodicity
    relates: []
    tags: []

  - id: quant-processes.markov-chains.weather-chain
    kind: example
    prominence: 1
    title: "Two-state weather chain solved"
    statement: >
      Sunny is followed by sunny with probability $0.9$ and by rainy with $0.1$;
      rainy is followed by rainy with probability $0.5$ and by sunny with $0.5$
      — rows $(0.9, 0.1)$ and $(0.5, 0.5)$. Stationarity reads
      $\pi_S = 0.9\pi_S + 0.5\pi_R$, so $0.1\pi_S = 0.5\pi_R$ and
      $\pi_S = 5\pi_R$; with $\pi_S + \pi_R = 1$ this gives
      $\pi = (5/6, 1/6) \approx (0.833, 0.167)$. Both self-loops are positive,
      so the chain is irreducible and aperiodic: $\pi$ is unique and $P^{n}$
      converges to the matrix with both rows equal to $\pi$. The eigenvalues are
      $1$ and $1 - 0.1 - 0.5 = 0.4$, so any deviation from equilibrium shrinks
      by a factor $0.4$ per day, and rain recurs every $1/\pi_R = 6$ days on
      average.
    summary: >
      It rains one day in six: $\pi = (5/6, 1/6)$, with deviations decaying by
      the second eigenvalue $0.4$ each day.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.convergence-to-equilibrium
      - quant-processes.markov-chains.matrix-powers
    relates: []
    tags: []

  - id: quant-processes.markov-chains.ergodic-fraction
    kind: theorem
    prominence: 1
    title: "Long-run fraction of time equals π"
    statement: >
      For an irreducible positive recurrent chain, with probability $1$ the
      fraction of the first $n$ steps spent in state $i$ converges to $\pi_i$:
      $\frac{1}{n}\sum_{k=0}^{n-1}\mathbf{1}\{X_k = i\} \to \pi_i$ from any
      starting state, and more generally
      $\frac{1}{n}\sum_{k=0}^{n-1} f(X_k) \to \sum_i \pi_i f(i)$ whenever that
      sum converges absolutely. Note what is absent: aperiodicity. A period-$2$
      chain never has $P^{n}$ converge, yet it still spends half its time in
      each half of the cycle, because averaging over time smooths the
      oscillation away. This is the law of large numbers for dependent data, and
      it is why "long-run frequency" and "stationary probability" are the same
      number in an interview answer.
    summary: >
      Time averages along one trajectory converge to $\pi$ for any irreducible
      positive recurrent chain — no aperiodicity required.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.stationary-uniqueness
    relates:
      - id: quant-probability.limits.slln
        note: >
          The ergodic theorem is the strong law extended to a dependent
          sequence: independence is replaced by irreducibility, and the limit
          is the stationary average rather than a common mean.
    tags: []

  - id: quant-processes.markov-chains.mean-return-time
    kind: corollary
    prominence: 1
    title: "Mean return time is 1/π_i"
    statement: >
      For an irreducible positive recurrent chain, the mean return time to state
      $i$, namely $m_i = \mathbb{E}[\min\{n \ge 1 : X_n = i\} \mid X_0 = i]$,
      equals $1/\pi_i$. It drops straight out of the ergodic theorem: if the
      chain sits in $i$ a fraction $\pi_i$ of the time and successive visits are
      separated by $m_i$ steps on average, then one visit per $m_i$ steps forces
      $\pi_i m_i = 1$. Interview uses: repeated fair-die rolls return to a six
      every $6$ rolls on average, and a chain occupying a rare state $1\%$ of
      the time waits $100$ steps between visits. Careful — this is the return
      time from $i$ itself, not the hitting time from some other state, which
      needs its own linear system.
    summary: >
      Rare states are visited rarely and waited for long: the average gap
      between visits to $i$ is exactly $1/\pi_i$.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.ergodic-fraction
    relates: []
    tags: []

  - id: quant-processes.markov-chains.detailed-balance
    kind: proposition
    prominence: 1
    title: "Detailed balance and reversibility"
    statement: >
      A probability vector $\pi$ satisfies detailed balance for $P$ if
      $\pi_i p_{ij} = \pi_j p_{ji}$ for all $i, j$: the probability flow along
      each edge matches in both directions. Summing over $i$ gives
      $\sum_i \pi_i p_{ij} = \pi_j \sum_i p_{ji} = \pi_j$, so detailed balance
      implies stationarity, and a chain started at such a $\pi$ looks
      statistically identical run backwards — it is called reversible. The
      converse fails: the chain cycling $1 \to 2 \to 3 \to 1$ with probability
      $1$ has stationary $\pi = (1/3, 1/3, 1/3)$ but no reversibility. Payoff:
      for a walk on a connected undirected graph that steps to a uniformly
      chosen neighbour, $\pi_i \propto \deg(i)$ solves detailed balance, since
      both sides equal $1/(2|E|)$ on every edge.
    summary: >
      Edge-by-edge balance is a stronger, far easier condition than
      $\pi P = \pi$ — and it hands you $\pi \propto \deg$ for any graph walk.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.stationary
    relates: []
    tags: []

  - id: quant-processes.markov-chains.graph-walk
    kind: example
    prominence: 1
    title: "Random walk on a small graph"
    statement: >
      Take vertices $A, B, C, D$ with edges $AB$, $BC$, $CA$ and $CD$: a
      triangle with a pendant vertex hanging off $C$. The degrees are $2, 2, 3,
      1$, summing to $2|E| = 8$, so detailed balance hands over
      $\pi = (2/8, 2/8, 3/8, 1/8) = (0.25, 0.25, 0.375, 0.125)$ with no linear
      system solved. Mean return times are the reciprocals: $4$ steps back to
      $A$, $8/3$ to $C$, and $8$ to the pendant $D$, matching the general
      formula $2|E|/\deg(i)$. The triangle makes the graph non-bipartite, so the
      walk is aperiodic and $P^{n}$ converges to $\pi$ from any start; on a
      bipartite graph the same $\pi$ is stationary but the walk oscillates
      forever.
    summary: >
      Degrees $2, 2, 3, 1$ give $\pi = (1/4, 1/4, 3/8, 1/8)$ instantly, and the
      pendant vertex is revisited once every $8$ steps.
    parent: quant-processes.markov-chains
    also_under: []
    requires:
      - quant-processes.markov-chains.detailed-balance
      - quant-processes.markov-chains.mean-return-time
    relates: []
    tags: []

  - id: quant-processes.markov-chains.pagerank
    kind: intuition
    prominence: 0
    title: "PageRank as a stationary distribution"
    statement: >
      PageRank scores web pages by the stationary distribution of a random
      surfer: from the current page follow a uniformly chosen outgoing link with
      probability $d \approx 0.85$, and with probability $1-d$ teleport to a
      uniformly chosen page anywhere. The teleport term is not decoration but
      the repair of the two hypotheses — a raw link graph has dead-end pages and
      disconnected regions, so its chain is neither irreducible nor reliably
      aperiodic, whereas the damped chain has every entry of $P$ strictly
      positive and is therefore both. The scores are then computed by power
      iteration $\mu \mapsto \mu P$, with error decaying like $d^{n}$. The
      transferable idea: any "importance" score is the equilibrium of a flow you
      define.
    summary: >
      Ranking by where a damped random surfer spends his time — and the damping
      exists precisely to force irreducibility and aperiodicity.
