  - id: quant-processes.martingales.maximal-inequality
    kind: proposition
    prominence: 0
    title: "Maximal inequality"
    statement: >
      Let $(X_n)$ be a nonnegative supermartingale. Then for every $a > 0$,
      $\Pr(\sup_{n \ge 0} X_n \ge a) \le \mathbb{E}[X_0]/a$. Proof: let $T$ be
      the first $n$ with $X_n \ge a$; stopping at $T \wedge n$ gives
      $\mathbb{E}[X_0] \ge \mathbb{E}[X_{T \wedge n}] \ge a \Pr(T \le n)$, and
      let $n \to \infty$. Doob's submartingale form is the mirror image: for a
      nonnegative submartingale,
      $\Pr(\max_{k \le n} X_k \ge a) \le \mathbb{E}[X_n]/a$. This is Markov's
      inequality upgraded from a single time point to the whole path, and it
      costs nothing extra. Immediate use: a fair gambler starting at $k$ and
      stopping at $0$ ever reaches $N$ with probability at most $k/N$ — a ruin
      bound with no barrier algebra at all.
    summary: >
      Markov's inequality applied to an entire path: a nonnegative
      supermartingale exceeds $a$ at some time with probability at most
      $\mathbb{E}[X_0]/a$.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.stopped-martingale
    relates: []
    tags: []

  - id: quant-processes.martingales.convergence-theorem
    kind: theorem
    prominence: 0
    title: "Martingale convergence theorem"
    statement: >
      If $(X_n)$ is a martingale, submartingale or supermartingale with
      $\sup_n \mathbb{E}|X_n| < \infty$, then $X_n$ converges almost surely to a
      finite limit $X_\infty$ with $\mathbb{E}|X_\infty| < \infty$. Two
      specialisations are quotable on sight: every nonnegative supermartingale
      converges almost surely, and every uniformly bounded martingale converges
      almost surely and in $L^{1}$, in which case
      $\mathbb{E}[X_\infty] = \mathbb{E}[X_0]$. The attached warning is the one
      optional stopping already carries — almost sure convergence by itself does
      not preserve the mean. Polya's urn illustrates the theorem: start with one
      ball of each colour, draw one and replace it with a copy alongside, and the
      red fraction is a bounded martingale whose limit is uniform on $(0,1)$.
    summary: >
      A fair game that stays integrable must settle down to a limit, though the
      limit need not have the same mean as the start.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.sub-supermartingale
    relates: []
    tags: []
