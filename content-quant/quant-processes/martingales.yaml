nodes:
  - id: quant-processes.martingales
    kind: subbranch
    title: "Martingales & Optional Stopping"
    summary: >
      Fair games formalized — the martingale zoo, stopping times,
      optional stopping, and the pattern-waiting magic it enables.
    parent: quant-processes
    also_under: []
    tags: []

  - id: quant-processes.martingales.filtration
    kind: definition
    prominence: 0
    title: "Filtration and adapted processes"
    statement: >
      A filtration is an increasing family
      $\mathcal{F}_0 \subseteq \mathcal{F}_1 \subseteq \cdots$ of information
      sets, with $\mathcal{F}_n$ read as everything observable by time $n$; for a
      process driven by $X_1, X_2, \dots$ take
      $\mathcal{F}_n = \sigma(X_1, \dots, X_n)$. A process $(Y_n)$ is adapted if
      $Y_n$ is determined by $\mathcal{F}_n$, and predictable if $Y_n$ is
      determined by $\mathcal{F}_{n-1}$ — fixed before step $n$ is revealed. Two
      working rules do almost all the labour: $\mathbb{E}[Y \mid \mathcal{F}_n]
      = Y$ when $Y$ is already known at time $n$, and
      $\mathbb{E}[Y \mid \mathcal{F}_n] = \mathbb{E}[Y]$ when $Y$ is independent
      of everything seen so far. At interview depth no measure theory is needed
      beyond that reading.
    summary: >
      The information available at time $n$, written $\mathcal{F}_n$ — just
      enough structure to say what a gambler knows at the moment they act.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-expectation
    relates: []
    tags: []

  - id: quant-processes.martingales.martingale
    kind: definition
    prominence: 2
    title: "Martingale"
    statement: >
      A process $(X_n)_{n \ge 0}$ adapted to a filtration $(\mathcal{F}_n)$ is a
      martingale if $\mathbb{E}|X_n| < \infty$ for every $n$ and
      $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n] = X_n$ almost surely; equivalently
      the increments have zero conditional drift,
      $\mathbb{E}[X_{n+1} - X_n \mid \mathcal{F}_n] = 0$. Iterating with the
      tower property gives $\mathbb{E}[X_m \mid \mathcal{F}_n] = X_n$ for every
      $m > n$, and hence the constant-mean property
      $\mathbb{E}[X_n] = \mathbb{E}[X_0]$ at every fixed time. Reading: $X_n$ is
      your fortune in a fair game, and the whole history tells you nothing about
      the sign of the next move. Linear combinations of martingales on a common
      filtration are again martingales, which is what licenses assembling one out
      of many small fair bets.
    summary: >
      A fair game: given everything known so far, tomorrow's expected fortune is
      today's, so the mean never moves off $\mathbb{E}[X_0]$.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.filtration
      - quant-probability.conditioning.tower
    relates: []
    tags: []

  - id: quant-processes.martingales.sub-supermartingale
    kind: definition
    prominence: 1
    title: "Sub- and supermartingales"
    statement: >
      Same adaptedness and integrability, with the equality relaxed: $(X_n)$ is a
      submartingale if $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n] \ge X_n$ and a
      supermartingale if $\mathbb{E}[X_{n+1} \mid \mathcal{F}_n] \le X_n$. So
      $\mathbb{E}[X_n]$ is nondecreasing in the sub case and nonincreasing in the
      super case, and a process is a martingale exactly when it is both. The
      names invert the intuition — a supermartingale is the one that drifts down
      — and the standard mnemonic is that life is not fair, so a supermartingale
      goes down. A gambler facing a house edge holds a supermartingale. By
      Jensen's inequality a convex function of a martingale is a submartingale,
      so $|X_n|$ and $X_n^{2}$ both drift up.
    summary: >
      Favourable and unfavourable games: a submartingale drifts up, a
      supermartingale drifts down, and being both is exactly being fair.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.martingale
    relates: []
    tags: []

  - id: quant-processes.martingales.examples-zoo
    kind: proposition
    prominence: 1
    title: "The martingale zoo for a random walk"
    statement: >
      Let $X_1, X_2, \dots$ be iid with $\Pr(X_i = +1) = p$ and
      $\Pr(X_i = -1) = q = 1 - p$, put $S_n = S_0 + X_1 + \cdots + X_n$, and take
      the filtration they generate. Three martingales carry nearly every
      interview problem. (1) The centred walk $S_n - n(p-q)$, which for
      $p = 1/2$ is $S_n$ itself. (2) The compensated square
      $(S_n - n(p-q))^{2} - 4pq\,n$, which for $p = 1/2$ is $S_n^{2} - n$, since
      $\mathbb{E}[S_{n+1}^{2} \mid \mathcal{F}_n] = S_n^{2} + 1$. (3) The
      geometric martingale $(q/p)^{S_n}$ for $0 < p < 1$, because
      $\mathbb{E}[(q/p)^{X_i}] = p(q/p) + q(p/q) = q + p = 1$. For general iid
      increments of mean $\mu$ and variance $\sigma^{2}$ the first two read
      $S_n - n\mu$ and $(S_n - n\mu)^{2} - n\sigma^{2}$.
    summary: >
      The level, the compensated square and the geometric martingale —
      $S_n - n(p-q)$, $(S_n - n(p-q))^{2} - 4pq\,n$ and $(q/p)^{S_n}$ — which
      between them give hitting probabilities and hitting times.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.martingale
      - quant-processes.random-walks.ssrw
    relates: []
    tags: []

  - id: quant-processes.martingales.exponential-martingale
    kind: proposition
    prominence: 1
    title: "Exponential martingale"
    statement: >
      If the increments $X_i$ are iid with finite
      $\phi(\theta) = \mathbb{E}[e^{\theta X_1}]$ and
      $S_n = X_1 + \cdots + X_n$ with $S_0 = 0$, then
      $M_n = e^{\theta S_n} / \phi(\theta)^{n}$ is a martingale with $M_0 = 1$:
      the next increment is independent of the past and contributes exactly
      $\phi(\theta)$, cancelling the extra factor in the denominator. The move
      worth memorising is to choose $\theta$ solving $\phi(\theta) = 1$ — the
      denominator vanishes, $e^{\theta S_n}$ is itself a martingale, and optional
      stopping then reads a hitting probability off directly with no time term to
      estimate. For the $\pm 1$ walk
      $\phi(\theta) = p e^{\theta} + q e^{-\theta}$, whose nontrivial root is
      $e^{\theta} = q/p$, recovering the geometric martingale.
    summary: >
      $e^{\theta S_n}/\phi(\theta)^{n}$ is always a martingale, and tuning
      $\theta$ so that the moment generating function equals $1$ removes the
      compensator entirely.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.examples-zoo
    relates: []
    tags: []

  - id: quant-processes.martingales.spotting-martingales
    kind: technique
    prominence: 1
    title: "Finding the martingale a problem wants"
    statement: >
      Reach for this the moment a question asks for a hitting probability or an
      expected hitting time. Compute the one-step drift
      $D(x) = \mathbb{E}[f(X_{n+1}) - f(X_n) \mid X_n = x]$ for a candidate
      function $f$ of the state and read off the case. If $D \equiv 0$ then
      $f(X_n)$ is a martingale and optional stopping returns a probability. If
      $D \equiv c$ for a nonzero constant, subtract the compensator:
      $f(X_n) - cn$ is a martingale, and stopping it returns an expected time.
      If $D$ depends on the state, solve $D \equiv 0$ for $f$ — for a Markov
      chain with transition matrix $P$ that is the harmonic equation $Pf = f$
      with boundary values $1$ and $0$, while $Pf - f = -1$ is the equation for
      expected time. Probabilities want harmonic functions; times want a
      compensator.
    summary: >
      Guess a function of the state, compute its one-step drift, and kill the
      drift — zero drift gives a probability, constant drift gives a time.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.examples-zoo
    relates: []
    tags: []

  - id: quant-processes.martingales.martingale-transform
    kind: proposition
    prominence: 1
    title: "Martingale transform: no betting system beats a fair game"
    statement: >
      Let $(X_n)$ be a martingale and let $(H_n)$ be predictable, so that $H_n$
      is fixed by $\mathcal{F}_{n-1}$ — your stake on round $n$ is chosen before
      the round is played. If each $H_n$ is bounded, or merely
      $\mathbb{E}|H_n(X_n - X_{n-1})| < \infty$, then the transform
      $(H \cdot X)_n = \sum_{k=1}^{n} H_k (X_k - X_{k-1})$, with
      $(H \cdot X)_0 = 0$, is again a martingale, so
      $\mathbb{E}[(H \cdot X)_n] = 0$ at every fixed $n$. This is the theorem
      under the slogan: varying your stake, however cleverly, reshapes the
      distribution of your fortune and never its mean. If $X$ is a
      supermartingale and $H_n \ge 0$ the transform is a supermartingale. The one
      lever left is choosing when to stop.
    summary: >
      Any stake sequence chosen without foresight turns a fair game into another
      fair game — sizing changes variance, never expectation.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.sub-supermartingale
    relates: []
    tags: []

  - id: quant-processes.martingales.stopping-time
    kind: definition
    prominence: 1
    title: "Stopping time"
    statement: >
      A random time $T$ with values in $\{0, 1, 2, \dots\} \cup \{\infty\}$ is a
      stopping time for $(\mathcal{F}_n)$ if $\{T = n\} \in \mathcal{F}_n$ for
      every $n$, equivalently $\{T \le n\} \in \mathcal{F}_n$: by time $n$ you
      can already tell whether you have stopped, using only what you have seen.
      Examples: the first time a walk hits level $a$; the first time a pattern
      completes; a deterministic time $n_0$; and $S \wedge T$, $S \vee T$ and
      $T + k$ built from stopping times $S, T$. Non-examples, every one of which
      needs the future: the time at which the walk attains its maximum over
      $0, \dots, N$; the step just before the first visit to $a$; the last visit
      to $0$; and every version of selling at the top. Optional stopping says
      nothing whatever about those.
    summary: >
      A rule for quitting that uses only what has already happened — no peeking,
      which is exactly the hypothesis optional stopping cannot do without.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.filtration
    relates: []
    tags: []

  - id: quant-processes.martingales.stopped-martingale
    kind: proposition
    prominence: 1
    title: "The stopped process is a martingale"
    statement: >
      If $(X_n)$ is a martingale and $T$ a stopping time on the same filtration,
      the stopped process $X_{T \wedge n}$ is a martingale, so
      $\mathbb{E}[X_{T \wedge n}] = \mathbb{E}[X_0]$ for every fixed $n$ — with
      no hypotheses on $T$ beyond its being a stopping time. Proof:
      $X_{T \wedge n} = X_0
      + \sum_{k=1}^{n} \mathbf{1}\{T \ge k\}(X_k - X_{k-1})$, and
      $\mathbf{1}\{T \ge k\} = 1 - \mathbf{1}\{T \le k-1\}$ is predictable, so
      this is a martingale transform. The supermartingale version holds
      identically. Everything difficult about optional stopping is the passage
      from this free statement at a fixed horizon to the limit $n \to \infty$,
      where $\mathbb{E}[X_{T \wedge n}] \to \mathbb{E}[X_T]$ can simply fail.
    summary: >
      Truncating a fair game at a stopping time costs nothing at any finite
      horizon; the entire difficulty is taking the horizon to infinity.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.stopping-time
      - quant-processes.martingales.martingale-transform
    relates: []
    tags: []

  - id: quant-processes.martingales.ost
    kind: theorem
    prominence: 2
    title: "Optional stopping theorem"
    statement: >
      Let $(X_n)$ be a martingale and $T$ a stopping time with
      $\Pr(T < \infty) = 1$. Then $\mathbb{E}[X_T] = \mathbb{E}[X_0]$ provided
      any one of the following holds. (a) $T$ is bounded: $T \le N$ for a
      constant $N$. (b) The stopped process is bounded:
      $|X_{T \wedge n}| \le C$ for all $n$ and some constant $C$. (c)
      $\mathbb{E}[T] < \infty$ and the increments are bounded:
      $|X_n - X_{n-1}| \le C$ almost surely. Each condition licenses the
      interchange $\mathbb{E}[X_{T \wedge n}] \to \mathbb{E}[X_T]$, for which the
      sharp criterion is uniform integrability of the family
      $(X_{T \wedge n})_n$. For a supermartingale the same conditions give
      $\mathbb{E}[X_T] \le \mathbb{E}[X_0]$. Name the condition you are using out
      loud: without one the conclusion is false, not merely unproved.
    summary: >
      Stopping a fair game leaves the mean alone — but only under a bounded
      stopping time, a bounded stopped process, or bounded increments with
      $\mathbb{E}[T] < \infty$.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.stopped-martingale
    relates: []
    tags: []

  - id: quant-processes.martingales.ost-supermartingale
    kind: corollary
    prominence: 0
    title: "Optional stopping for unfavourable games"
    statement: >
      For a supermartingale under any of the optional stopping conditions,
      $\mathbb{E}[X_T] \le \mathbb{E}[X_0]$, and for a submartingale the
      inequality reverses. Two consequences are worth having ready. In a game
      with a house edge no stopping rule creates expected profit: stop-losses,
      take-profits and quitting while ahead all reshape the payoff distribution
      and leave its mean where it was. For a nonnegative supermartingale the
      bound $\mathbb{E}[X_T] \le \mathbb{E}[X_0]$ needs no side conditions at
      all, since Fatou's lemma covers even $\Pr(T = \infty) > 0$ with $X_\infty$
      taken as the almost sure limit. The asymmetry is the useful part: fair
      games can be broken by unbounded stopping, unfavourable nonnegative ones
      cannot.
    summary: >
      You cannot stop your way to a profit in a game with an edge against you,
      and for nonnegative wealth the bound holds with no hypotheses at all.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.ost
    relates: []
    tags: []

  - id: quant-processes.martingales.ruin-via-ost
    kind: example
    prominence: 2
    title: "Gambler's ruin in three lines"
    statement: >
      A walker starts at $k$, steps $+1$ with probability $p$ and $-1$ with
      $q = 1-p$, and stops at $T$, the first hit of $0$ or $N$. Any block of $N$
      consecutive up-moves ends the game, so $T$ is dominated by a geometric
      number of such blocks and $\mathbb{E}[T] < \infty$; also
      $0 \le S_{T \wedge n} \le N$, so conditions (b) and (c) both apply. Fair
      case $p = 1/2$: $S_n$ is a martingale, so
      $k = \mathbb{E}[S_T] = N \Pr(\text{hit } N)$, giving
      $\Pr(\text{hit } N) = k/N$ and ruin probability $1 - k/N$. Biased case:
      $(q/p)^{S_n}$ is a bounded martingale, so with
      $u = \Pr(\text{hit } N)$ we get $(q/p)^{k} = u (q/p)^{N} + (1-u)$ and
      $u = \dfrac{1 - (q/p)^{k}}{1 - (q/p)^{N}}$.
    summary: >
      Both ruin formulas drop out of optional stopping applied to $S_n$ and to
      $(q/p)^{S_n}$ — the fastest derivation there is, and the one to give at a
      whiteboard.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.ost
      - quant-processes.martingales.examples-zoo
      - quant-processes.ruin.setup
    relates:
      - id: quant-processes.ruin.fair
        note: >
          That node derives the fair ruin probability $1 - k/N$ from a first-step
          recurrence; the identical formula appears here by stopping the
          martingale $S_n$ at the exit time.
      - id: quant-processes.ruin.biased
        note: >
          The $(q/p)^{k}$ formula obtained there by solving the recurrence is
          exactly what one application of optional stopping to the bounded
          martingale $(q/p)^{S_n}$ delivers.
    tags: []

  - id: quant-processes.martingales.hitting-time-quadratic
    kind: example
    prominence: 1
    title: "Expected duration via the compensated square"
    statement: >
      Fair walk, same two barriers at $0$ and $N$, started at $k$. Use
      $S_n^{2} - n$: up to time $T$ the walk stays in $[0, N]$, so its increments
      $2 S_n X_{n+1}$ are bounded by $2N$, and $\mathbb{E}[T] < \infty$, so
      condition (c) applies and $\mathbb{E}[S_T^{2}] - \mathbb{E}[T] = k^{2}$.
      Since $S_T$ equals $N$ with probability $k/N$ and $0$ otherwise,
      $\mathbb{E}[S_T^{2}] = kN$, hence $\mathbb{E}[T] = k(N-k)$ — starting at
      $50$ between barriers $0$ and $100$, expect $2500$ tosses. Biased case:
      stop $S_n - n(p-q)$ instead to get $\mathbb{E}[T] = (uN - k)/(p-q)$ with
      $u$ the hitting probability above. Letting $N \to \infty$ in the fair case
      shows the walk reaches $0$ with certainty yet takes infinite expected time.
    summary: >
      Stopping $S_n^{2} - n$ turns the exit position into the exit time and gives
      the $k(N-k)$ expected duration in one line.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.ruin-via-ost
    relates:
      - id: quant-processes.ruin.duration
        note: >
          The $k(N-k)$ expected game length recorded there is precisely what the
          compensated square produces here in a single stopping step, and the
          biased formula matches term for term.
    tags: []

  - id: quant-processes.martingales.wald
    kind: theorem
    prominence: 1
    title: "Wald's identity"
    statement: >
      Let $X_1, X_2, \dots$ be iid with $\mathbb{E}|X_1| < \infty$ and mean
      $\mu$, let $S_n = X_1 + \cdots + X_n$, and let $N$ be a stopping time for
      the sequence with $\mathbb{E}[N] < \infty$. Then
      $\mathbb{E}[S_N] = \mu \, \mathbb{E}[N]$. Proof:
      $S_N = \sum_{i \ge 1} X_i \mathbf{1}\{N \ge i\}$, and $\{N \ge i\}$ is
      decided by $X_1, \dots, X_{i-1}$ and so is independent of $X_i$, whence the
      sum is $\mu \sum_{i \ge 1} \Pr(N \ge i) = \mu \mathbb{E}[N]$. That
      independence is the whole hypothesis: $N$ may inspect the past but never
      the future, and an $N$ chosen with foresight breaks the identity. Roll a
      fair die until the first six: $\mathbb{E}[N] = 6$ and $\mu = 3.5$ give
      expected total $21$, which checks as five non-sixes averaging $3$ plus
      the six.
    summary: >
      The expected value of a randomly stopped sum is the mean increment times
      the expected number of terms — provided the stopping rule never looks
      ahead.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.ost
      - quant-processes.martingales.examples-zoo
    relates: []
    tags: []

  - id: quant-processes.martingales.wald-second
    kind: proposition
    prominence: 0
    title: "Wald's second identity"
    statement: >
      Assume in addition that $\operatorname{Var}(X_1) = \sigma^{2} < \infty$,
      with $N$ a stopping time and $\mathbb{E}[N] < \infty$. Then
      $\mathbb{E}[(S_N - N\mu)^{2}] = \sigma^{2}\,\mathbb{E}[N]$, which is the
      compensated square $(S_n - n\mu)^{2} - n\sigma^{2}$ stopped at $N$. When
      $\mu = 0$ it reads $\mathbb{E}[S_N^{2}] = \sigma^{2}\mathbb{E}[N]$, the
      identity that converts an exit position into an exit time. Do not confuse
      it with the variance of a randomly stopped sum:
      $\operatorname{Var}(S_N)
      = \sigma^{2}\mathbb{E}[N] + \mu^{2}\operatorname{Var}(N)$ requires $N$ to
      be independent of the sequence, and is false for a general stopping time —
      for a walk stopped at a barrier, $N$ and the increments are as dependent as
      two things can be.
    summary: >
      Second moments obey Wald too, $\mathbb{E}[(S_N - N\mu)^{2}]
      = \sigma^{2}\mathbb{E}[N]$, which is not the random-sums variance formula.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.wald
    relates: []
    tags: []

  - id: quant-processes.martingales.abracadabra
    kind: example
    prominence: 2
    title: "ABRACADABRA"
    statement: >
      A monkey types letters independently and uniformly from a $26$-letter
      alphabet, one per second. How long until ABRACADABRA first appears? Run a
      casino: just before second $n$ a fresh gambler stakes $1$ unit that letter
      $n$ is A at fair odds of $26$ to $1$, then parlays his entire holding onto
      B, then R, and so on through the eleven letters, going broke at the first
      mismatch and cashing $26^{11}$ if he completes the word. Each gambler plays
      a fair game, so $M_n = W_n - n$ is a martingale starting at $0$, where
      $W_n$ is the gamblers' total holding. At $T$ the survivors are exactly the
      self-overlaps: the full word, the final ABRA, and the final A, holding
      $26^{11} + 26^{4} + 26$. Bounded increments and $\mathbb{E}[T] < \infty$
      (disjoint $11$-letter blocks each complete the word with probability
      $26^{-11}$) give $\mathbb{E}[T] = 3670344487444778$ seconds, some $116$
      million years.
    summary: >
      Expected typing time is $26^{11} + 26^{4} + 26$ seconds — one term for each
      way the word overlaps itself, read off a team of fair gamblers.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.ost
    relates: []
    tags: []

  - id: quant-processes.martingales.pattern-waiting
    kind: technique
    prominence: 1
    title: "Waiting time for any pattern"
    statement: >
      The ABRACADABRA casino generalises. For a target word $w$ of length $\ell$
      over iid letters, let $j$ range over those lengths for which the first $j$
      letters of $w$ equal the last $j$ letters of $w$ — the self-overlaps,
      always including $j = \ell$. Then
      $\mathbb{E}[T] = \sum_j 1/\Pr(\text{the first } j \text{ letters of } w)$,
      one term per overlap. Fair coin: HH overlaps at $j = 2$ and $j = 1$, so
      $\mathbb{E}[T] = 4 + 2 = 6$, while HT overlaps only at $j = 2$ and gives
      $4$; HHH gives $8 + 4 + 2 = 14$. The single letter H gives $2 = 1/p$, the
      geometric mean, as it must. Self-overlapping patterns wait longer, because
      each near-miss throws away more accumulated progress.
    summary: >
      Sum the reciprocal prefix probabilities over the pattern's self-overlaps:
      HH takes $6$ tosses, HT takes $4$, HHH takes $14$.
    parent: quant-processes.martingales
    also_under: []
    requires:
      - quant-processes.martingales.abracadabra
      - quant-probability.discrete.geometric
    relates:
      - id: quant-tools.recurrences.hh-vs-ht
        note: >
          First-step analysis gets $6$ and $4$ by solving a small linear system;
          the overlap sum reproduces both numbers instantly and keeps working for
          patterns too long to set up by hand.
    tags: []

  - id: quant-processes.martingales.martingale-betting-fallacy
    kind: example
    prominence: 1
    title: "Why doubling after every loss is not free money"
    statement: >
      Bet on fair even-money tosses, doubling after each loss: stake
      $1, 2, 4, \dots$ and quit at $T$, the first win. After $n$ straight losses
      your net is $-(2^{n} - 1)$, and at $T$ it is exactly $+1$, while
      $\Pr(T < \infty) = 1$ and $\mathbb{E}[T] = 2$. So
      $\mathbb{E}[X_T] = 1 \ne 0 = X_0$ even though $X_n$ is a genuine
      martingale. Which condition fails? (a) $T$ is unbounded, since
      $\Pr(T > N) = 2^{-N} > 0$ for every $N$. (b) The stopped process is
      unbounded below, reaching $-(2^{n} - 1)$. (c) $\mathbb{E}[T] < \infty$
      holds, but the increments $2^{n-1}$ are unbounded. With a real bankroll of
      $2^{m} - 1$ you win $1$ with probability $1 - 2^{-m}$ and lose
      $2^{m} - 1$ with probability $2^{-m}$: expectation exactly $0$.
    summary: >
      The doubling system turns a fair game into a certain $+1$ only if you may
      lose unboundedly much for unboundedly long — all three optional stopping
      conditions fail at once.
    parent: quant-processes.martingales
    also_under: []
