# quant-mental.arithmetic — Mental Arithmetic
# Outline node (34 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-mental.arithmetic
    kind: subbranch
    title: "Mental Arithmetic"
    summary: >
      Exact mental computation under time pressure — complements,
      anchored squares, fraction–decimal fluency, and fast checks.
    parent: quant-mental
    also_under: []
    tags: []

  - id: quant-mental.arithmetic.base-tricks
    kind: technique
    prominence: 2
    title: "Complements and near-base multiplication"
    statement: >
      Two moves for arithmetic near round numbers. Complements: to add or
      subtract near $10^{k}$, round to the complement and correct —
      $998 + 437 = 1000 + 437 - 2 = 1435$, or $73 - 49 = 73 - 50 + 1 = 24$.
      Near-base multiplication: write each factor as (base $\pm$ offset) and
      expand $(B+a)(B+b) = B^{2} + B(a+b) + ab$, turning an awkward product
      into a squared base plus small corrections —
      $98 \times 97 = (100-2)(100-3) = 10000 - 500 + 6 = 9506$. Reach for this
      whenever both factors sit within about 10 of a round number.
    summary: >
      Round to a nearby base and correct for the offset — turns $998+437$ or
      $98\times97$ into a squared or rounded number plus a small fix.
    parent: quant-mental.arithmetic
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-mental.arithmetic.squares
    kind: technique
    prominence: 1
    title: "Squaring via (x±h)² and difference of squares"
    statement: >
      Two mechanics specialized to squares. Expand
      $(x \pm h)^{2} = x^{2} \pm 2xh + h^{2}$ around an easy anchor:
      $47^{2} = (50-3)^{2} = 2500 - 300 + 9 = 2209$, and
      $97^{2} = (100-3)^{2} = 10000 - 600 + 9 = 9409$. When two factors are
      equidistant from a midpoint, use difference of squares instead:
      $(m-d)(m+d) = m^{2} - d^{2}$, so
      $47 \times 53 = (50-3)(50+3) = 50^{2} - 3^{2} = 2500 - 9 = 2491$. Spot
      equidistant pairs by averaging the two numbers to find $m$.
    summary: >
      Squaring near a round anchor via $(x\pm h)^{2}$, and multiplying
      equidistant factors via $m^{2}-d^{2}$ — $47\times53 = 2500-9 = 2491$.
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.base-tricks
    relates:
      - id: quant-probability.counting.binomial-theorem
        note: >
          The $(x\pm h)^2$ expansion is the binomial theorem's degree-2 case,
          already familiar from the counting branch's general $(x+y)^n$.
    tags: []

  - id: quant-mental.arithmetic.eleven-trick
    kind: technique
    prominence: 0
    title: "Multiplying by 11"
    statement: >
      To multiply by 11, add each pair of adjacent digits and write the
      result, with carry, between them; the outer digits stay fixed. For a
      two-digit $\overline{ab}$ with $a+b<10$: the product is
      $\overline{a(a+b)b}$ — $43 \times 11 = 473$. With a carry:
      $78 \times 11$ has outer digits 7 and 8 and middle digit $7+8=15$; write
      $5$, carry $1$ into the leading digit to get $7+1=8$, giving $858$. The
      same digit-sum-and-carry sweep extends one adjacent pair at a time to
      longer numbers.
    summary: >
      Slide adjacent digits together and add, carrying as needed —
      $43\times11=473$, $78\times11=858$.
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.base-tricks
    relates: []
    tags: []

  - id: quant-mental.arithmetic.five-trick
    kind: technique
    prominence: 0
    title: "Multiplying and dividing by 5"
    statement: >
      $5 = 10/2$, so multiplying by 5 is halve-then-times-10 (or the reverse
      order, whichever avoids a fraction first): $346 \times 5$ — half of
      $346$ is $173$, so the answer is $1730$. Dividing by 5 reverses it:
      $\times 2$ then $/10$ — $835/5 = (835\times2)/10 = 1670/10 = 167$. The
      same halve/double reframing chains for any power-of-5 multiplier, and
      pairs naturally with the 25s trick below.
    summary: >
      Trade a $\times5$ for $\times10$ and a halving — $346\times5=1730$ from
      half of $346$ times ten.
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.base-tricks
    relates: []
    tags: []

  - id: quant-mental.arithmetic.twentyfive-halving-doubling
    kind: technique
    prominence: 0
    title: "25s and general halving–doubling"
    statement: >
      $25 = 100/4$, so multiply by 25 by dividing by 4 then appending two
      zeros, whichever order stays integer-friendly: $68 \times 25$ —
      $68/4 = 17$, so $1700$. More generally, halving one factor while
      doubling the other leaves the product unchanged, so trade an awkward
      factor for a round one: $16 \times 25 = 8 \times 50 = 4 \times 100 =
      400$, and $35 \times 16 = 70 \times 8 = 140 \times 4 = 280 \times 2 =
      560$. Stop doubling once one side is already round.
    summary: >
      $\times25$ is $/4$ then $\times100$; halving one factor while doubling
      the other reaches a round number fast — $16\times25 = 4\times100=400$.
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.five-trick
    relates: []
    tags: []

  - id: quant-mental.arithmetic.fraction-decimal
    kind: technique
    prominence: 1
    title: "Fraction–decimal fluency table"
    statement: >
      Memorize the small-denominator unit fractions cold: $1/6 = 0.1\overline{6}$,
      $1/7 = 0.\overline{142857}$ (a 6-digit repeating cycle — every multiple
      of $1/7$ is a rotation of $142857$, so $3/7 = 0.\overline{428571}$),
      $1/8 = 0.125$, $1/9 = 0.\overline{1}$, $1/11 = 0.\overline{09}$,
      $1/12 = 0.08\overline{3}$, $1/16 = 0.0625$. Reading a decimal like
      $0.428571\ldots$ back as $3/7$, or knowing on sight that
      $5/8 = 0.625$, replaces long division with recall during a timed
      problem.
    summary: >
      The interview-standard table — $1/7=0.\overline{142857}$ cycles through
      all sevenths, $1/8=0.125$, $1/16=0.0625$, and the rest by heart.
    parent: quant-mental.arithmetic
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-mental.arithmetic.percent-composition
    kind: technique
    prominence: 2
    title: "Percent changes compose multiplicatively"
    statement: >
      A $p\%$ change multiplies by $(1+p/100)$, and successive changes
      multiply their factors rather than add their percentages. $+20\%$ then
      $-20\%$ is $1.2 \times 0.8 = 0.96$, a net $-4\%$, not flat — the two
      moves are taken on different bases. Order does not matter, since
      multiplication commutes, but the base does: $+25\%$ then $-20\%$ is
      $1.25 \times 0.8 = 1.0$, exactly flat, because $0.8=1/1.25$ are
      reciprocal factors. Chain any number of moves this way: three $+10\%$
      periods compound to $1.1^{3} = 1.331$, i.e. $+33.1\%$, not $+30\%$.
    summary: >
      Chain percent changes as factors, not sums — $+20\%$ then $-20\%$ nets
      $-4\%$, while $+25\%$ then $-20\%$ is exactly flat.
    parent: quant-mental.arithmetic
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-mental.arithmetic.percent-quick-fractions
    kind: technique
    prominence: 0
    title: "Percent-of-a-number via easy fractions"
    statement: >
      Common percentages are exact small fractions, so compute them by
      division instead of multiplying by a decimal: $10\% = 1/10$,
      $25\% = 1/4$, $12.5\% = 1/8$, $16.\overline{6}\% = 1/6$,
      $8.\overline{3}\% = 1/12$. Worked: $17\%$ of $240$ splits as
      $10\%+5\%+2\% = 24+12+4.8 = 40.8$; or $16.\overline{6}\%$ of
      $240 = 240/6 = 40$ directly, matching the $1/6$ table entry. Building a
      percentage from $10\%/5\%/1\%$ blocks, or spotting it as a table
      fraction, both beat multiplying by $0.17$.
    summary: >
      Read a percentage as a fraction from the table, or build it from
      $10\%/5\%/1\%$ blocks — $17\%$ of $240 = 24+12+4.8=40.8$.
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.fraction-decimal
      - quant-mental.arithmetic.percent-composition
    relates: []
    tags: []

  - id: quant-mental.arithmetic.weighted-average
    kind: technique
    prominence: 1
    title: "Weighted averages by anchor and distance"
    statement: >
      To mix quantities by weight without the full formula, anchor on one
      value and move a weight-fraction of the way to the other:
      $\bar{v} = v_1 + \dfrac{w_2}{w_1+w_2}(v_2 - v_1)$. A class of 30
      averaging 80 combined with a class of 20 averaging 90: anchor at 80,
      move $20/50 = 40\%$ of the gap $10$, giving $80+4=84$ — matching
      $(30\cdot80+20\cdot90)/50=84$ with less arithmetic. The same move
      prices a mix: 3 parts of a 20%-concentration solution with 2 parts of
      5% blends to $20 - (2/5)(15) = 14\%$.
    summary: >
      Move a weight-fraction of the gap from one anchor value toward the
      other — 30 at 80 and 20 at 90 average to $80+0.4(10)=84$.
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.percent-composition
    relates:
      - id: quant-probability.expectation.expectation
        note: >
          A weighted average by weight-fractions is exactly the discrete
          expectation formula $\sum x\,p(x)$ with weights read as
          probabilities.
    tags: []

  - id: quant-mental.arithmetic.divisibility-3-9
    kind: technique
    prominence: 0
    title: "Divisibility by 3 and 9: the digit sum"
    statement: >
      A number is divisible by 3, respectively 9, exactly when its digit sum
      is, because $10 \equiv 1 \pmod 3$ and $\pmod 9$, so each digit
      contributes its own value regardless of place. Check $4{,}731$: digits
      sum to $4+7+3+1=15$; $15$ is divisible by 3 but not 9, so $4731$ is
      divisible by 3 and not 9 — confirmed by $4731 = 3 \times 1577$. Repeat
      the digit sum on the sum itself if it is still large:
      $15 \to 1+5=6$, still a multiple of 3.
    summary: >
      Sum the digits; divisible by 3 or 9 exactly when that sum is —
      $4731$'s digit sum $15$ flags it for 3 but not 9.
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.base-tricks
    relates: []
    tags: []

  - id: quant-mental.arithmetic.divisibility-4-8
    kind: technique
    prominence: 0
    title: "Divisibility by 4 and 8: trailing digits"
    statement: >
      Since $100$ and $1000$ are multiples of 4 and 8, only the last two
      digits decide divisibility by 4, and only the last three decide
      divisibility by 8 — everything further left contributes a multiple of
      the modulus and drops out. Check $7{,}816$: last two digits
      $16=4\times4$, so divisible by 4; last three digits $816=8\times102$,
      so also divisible by 8. Contrast $7{,}812$: last two digits $12$ pass
      the 4-test, but last three digits $812$ are not a multiple of 8, so
      $7812$ is divisible by 4 but not 8.
    summary: >
      Only the last two (mod 4) or three (mod 8) digits matter — $7816$'s
      trailing $816$ passes both, $7812$'s trailing $812$ fails the 8-test.
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.base-tricks
    relates: []
    tags: []

  - id: quant-mental.arithmetic.divisibility-7-11
    kind: technique
    prominence: 0
    title: "Divisibility by 7 and 11"
    statement: >
      For 11, alternate-sum the digits from the right: $2{,}937$ gives
      $7-3+9-2=11$, divisible by 11, and indeed $2937 = 11\times267$. For 7,
      strip the last digit, double it, and subtract from what remains,
      repeating until small: $483 \to 48 - 2(3) = 42$, and $42=7\times6$, so
      $483$ is divisible by 7 — confirmed by $483 = 7\times69$. Both rules
      replace a division with a couple of single-digit operations, useful for
      factoring a suspicious total on the spot.
    summary: >
      Alternating digit sum for 11 ($2937\to7-3+9-2=11$); double-and-subtract
      the last digit for 7 ($483\to48-6=42$).
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.base-tricks
    relates: []
    tags: []

  - id: quant-mental.arithmetic.digit-checks
    kind: technique
    prominence: 1
    title: "Digit-sum (mod 9) and last-digit verification"
    statement: >
      Extend the digit-sum-by-9 rule, casting out nines, into a quick
      arithmetic check: reduce each operand to its digit sum mod 9, do the
      same operation on those single digits, and compare to the digit sum of
      the claimed answer — a mismatch proves an error. Checking
      $47\times53=2491$: digit sums $11\to2$ and $8$ give $2\times8=16\to7$
      mod 9; $2491$'s digit sum is $16\to7$ — consistent. The last digit
      gives a second cheap check: $7\times3=21$ ends in $1$, matching
      $2491$'s last digit. Neither check catches every error, but both catch
      most in one second.
    summary: >
      Cast out nines (digit sum mod 9) and compare last digits —
      $47\times53=2491$ checks out: $2\times8\equiv7$ and $7\times3$ ends
      in $1$.
    parent: quant-mental.arithmetic
    also_under: []
    requires:
      - quant-mental.arithmetic.divisibility-3-9
    relates: []
    tags: []
