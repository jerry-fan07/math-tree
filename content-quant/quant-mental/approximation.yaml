  - id: quant-mental.approximation.truncation-error
    kind: proposition
    prominence: 0
    title: "Truncation error as the next Taylor term"
    statement: >
      For a smooth $f$, truncating its Taylor expansion at order $k$ leaves a
      remainder of order $x^{k+1}$: dropping terms from $x^{k+1}$ on costs
      roughly $|f^{(k+1)}(0)/(k+1)!|\,x^{k+1}$ where that term is small.
      Practical rule: your error bar is the size of the first term you threw
      away, not zero. Worked: $e^{0.1} \approx 1 + 0.1 = 1.1$ keeps one term
      and drops $x^{2}/2 = 0.005$; the exact value is $1.10517$, an error of
      $0.00517$, matching the discarded term to one significant figure.
    summary: >
      The size of a dropped Taylor term is not just theory — it is the
      honest error bar on every estimate in this toolkit.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-tools.series-calculus.taylor
    relates: []
    tags: []

  - id: quant-mental.approximation.log-linearization
    kind: technique
    prominence: 1
    title: "Small-x expansions: ln(1+x) and e^x"
    statement: >
      For $|x|$ small, $\ln(1+x) \approx x - x^{2}/2$ (or just $x$ for a
      cruder pass) and $e^{x} \approx 1 + x + x^{2}/2$, both truncations of
      their Taylor series. Reach for these on rates, growth factors, and
      log-returns where $x$ is a few percent. Error size: the linear pass
      $\ln(1+x)\approx x$ carries error $\approx x^{2}/2$ — for $x=0.05$ that
      is $0.00125$, a $2.4\%$ relative miss. Worked: $\ln(1.05)$ is exactly
      $0.04879$; the linear guess $0.05$ misses by $0.0012$, while the
      quadratic guess $0.05 - 0.00125 = 0.04875$ misses by only $0.00004$.
    summary: >
      The two small-x Taylor truncations everyone reaches for first, with the
      error each one is actually carrying.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.truncation-error
    relates: []
    tags: []

  - id: quant-mental.approximation.binomial-approx
    kind: technique
    prominence: 1
    title: "(1+x)^n ≈ 1+nx and the compounding correction"
    statement: >
      For $|x|$ small and $n$ moderate, $(1+x)^{n} \approx 1 + nx$, the
      leading term of the binomial expansion; the next correction is
      $\binom{n}{2}x^{2} = n(n-1)x^{2}/2$, worth adding once $nx$ itself is
      not tiny. This is the calculus version of the fact that percentage
      changes compound multiplicatively rather than adding. Worked:
      $(1.02)^{10}$ — linear guess $1+10(0.02)=1.20$; exact is $1.21899$, a
      $1.6\%$ miss; adding the correction $45(0.02)^{2}=0.018$ gives $1.218$,
      within $0.1\%$ of exact.
    summary: >
      The leading-order compounding estimate, plus the second-order fix that
      rescues it once the exponent is not small.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.truncation-error
      - quant-mental.arithmetic.percent-composition
    relates: []
    tags: []

  - id: quant-mental.approximation.sqrt-estimate
    kind: technique
    prominence: 1
    title: "Square roots by linearization"
    statement: >
      To estimate $\sqrt{a^{2}+b}$ for $b$ small relative to $a^{2}$,
      linearize at the nearby perfect square: $\sqrt{a^{2}+b} \approx a +
      b/(2a)$ — equivalently one Newton step $x_{1} = x_{0} -
      (x_{0}^{2}-N)/(2x_{0})$ from guess $x_{0}=a$. Error size is the next
      term, $-b^{2}/(8a^{3})$, always making the linear estimate slightly too
      high. Worked: $\sqrt{26} = \sqrt{25+1} \approx 5 + 1/10 = 5.1$; exact is
      $5.09902$, so the estimate is high by about $0.001$, matching
      $-1/(8\cdot125) = -0.001$.
    summary: >
      Roots by linearizing at the nearest perfect square, with a Newton-step
      reading and the error stated in advance.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.truncation-error
    relates: []
    tags: []

  - id: quant-mental.approximation.rule-72
    kind: technique
    prominence: 2
    title: "Rule of 72: doubling time"
    statement: >
      A quantity compounding at rate $r$ per period doubles after $t = \ln
      2/\ln(1+r) \approx 0.693/r$ periods for small $r$ (the "rule of
      69.3"); in practice use $72/r$ ($r$ in percent) instead, because $72$
      has many small divisors ($8\times9$, $6\times12$, $4\times18$) for fast
      mental division, and its extra $2.7$ partly cancels the second-order
      term that $69.3/r$ ignores, keeping the error within about $1\%$ across
      $r$ between $6\%$ and $10\%$, essentially exact near $r=8\%$. Worked: at
      $r=8\%$, $72/8=9$ years; exact is $\ln2/\ln1.08 = 9.006$ years, versus
      $69.3/8=8.66$ years, off by $3.8\%$.
    summary: >
      Doubling time at rate $r\%$ is about $72/r$ years — the mental-math
      winner over the theoretically purer $69.3/r$.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.log-linearization
    relates: []
    tags: []

  - id: quant-mental.approximation.anchors
    kind: technique
    prominence: 1
    title: "Constants worth memorizing"
    statement: >
      A short table pays for itself constantly: $\ln 2 \approx 0.6931$, $\ln
      10 \approx 2.3026$, $\log_{10}2 \approx 0.3010$, $e \approx 2.71828$,
      $\sqrt2 \approx 1.41421$, $\sqrt3 \approx 1.73205$, $\sqrt5 \approx
      2.23607$, $\pi^{2} \approx 9.8696$. Combine them instead of
      re-deriving: $\log_{10}e = 1/\ln10 \approx 0.4343$, $\log_{10}4 =
      2\log_{10}2 \approx 0.6021$, $\sqrt6=\sqrt2\sqrt3\approx2.449$.
      Mechanics: memorize four to five significant figures — enough that
      products and quotients of them stay accurate to the digit an
      interviewer will check.
    summary: >
      The handful of logs, roots and $e$ worth having cold, plus the cheap
      combinations that extend them.
    parent: quant-mental.approximation
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-mental.approximation.powers-of-two
    kind: technique
    prominence: 1
    title: "2^10 ≈ 10^3 and order of magnitude via bits"
    statement: >
      Since $\log_{10}2 \approx 0.301$, $2^{n} \approx 10^{0.301n}$: count
      bits, multiply by $0.301$, and read off the power of ten. The anchor is
      $2^{10}=1024 \approx 10^{3}$, high by $2.4\%$; each further block of
      ten bits compounds that same $2.4\%$. Worked: $2^{30}=(2^{10})^{3}
      \approx 10^{9}\times1.024^{3} \approx 1.0737\times10^{9}$; the exact
      value is $1073741824$, matching to five significant figures. Use this
      to size binary counts, hash spaces, and combinatorial totals fast.
    summary: >
      $2^{10}\approx10^{3}$ turns bit counts into powers of ten almost for
      free, at a known $2.4\%$ per block of ten bits.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.anchors
    relates: []
    tags: []

  - id: quant-mental.approximation.digits-of-2-100
    kind: example
    prominence: 0
    title: "How many digits does 2^100 have?"
    statement: >
      A number $N$ has $\lfloor \log_{10}N \rfloor + 1$ digits, so count
      digits by estimating $\log_{10}(2^{100}) = 100\log_{10}2 \approx
      100\times0.301 = 30.1$. Floor and add one: $31$ digits. Check against
      the bit-block shortcut: $2^{100}=(2^{10})^{10}\approx(10^{3})^{10}
      \times1.024^{10} = 10^{30}\times1.2677\approx1.268\times10^{30}$, and
      the exact value $1267650600228229401496703205376$ indeed has $31$
      digits and starts $1.2677\ldots$, matching to five significant figures.
    summary: >
      Digit-counting a huge power of two by multiplying its bit count by
      $\log_{10}2$ — the anchor and the bit shortcut agree to four figures.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.powers-of-two
    relates: []
    tags: []

  - id: quant-mental.approximation.normal-quantiles
    kind: technique
    prominence: 2
    title: "Normal quantiles: the σ-to-probability table"
    statement: >
      For $Z\sim N(0,1)$, memorize: $\Pr(|Z|\le1)\approx68.27\%$,
      $\Pr(|Z|\le1.645)=90\%$, $\Pr(|Z|\le1.96)\approx95\%$,
      $\Pr(|Z|\le2.576)\approx99\%$; one-sided, $\Pr(Z\le1.645)=95\%$ and
      $\Pr(Z\le2.33)\approx99\%$. Rounding $1.96\to2$ for speed shifts the
      coverage up by about $0.45$ percentage points ($95.45\%$ vs $95\%$) —
      fine for a gut check, not for a quoted confidence interval. Use directly for
      confidence intervals, VaR cutoffs, and "how many sigma is this move"
      questions.
    summary: >
      The sigma cutoffs — $1$, $1.645$, $1.96$, $2.576$ — that convert a
      normal approximation into a quoted probability.
    parent: quant-mental.approximation
    also_under: []
    requires: []
    relates:
      - id: quant-probability.limits.clt
        note: >
          Normal quantiles are the practical payoff of the CLT: once a sum is
          approximately normal, these sigma cutoffs convert directly into
          interval probabilities.
    tags: []

  - id: quant-mental.approximation.annualizing
    kind: technique
    prominence: 0
    title: "Annualizing a rate across horizons"
    statement: >
      A per-period return $r$ compounds to $(1+r)^{n}-1$ over $n$ periods,
      approximated by $nr$ when $nr$ is not too large (the binomial-approx
      correction $\binom{n}{2}r^{2}$ fixes it up). Going the other way, an
      annual rate $R$ implies a per-period rate near $R/n$, refined to
      $(1+R)^{1/n}-1$. Worked: a monthly return of $1\%$ annualizes to
      roughly $12\%$ by the linear pass, versus $(1.01)^{12}-1=12.68\%$
      exactly — the gap is close to the correction term,
      $\binom{12}{2}(0.01)^{2}=0.0066$. Volatility does not annualize this
      way: it scales with the square root of the horizon, not linearly, a
      distinction developed properly later in this tree.
    summary: >
      Converting a rate between horizons by compounding, not adding — with
      the reminder that volatility scales differently from mean return.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.binomial-approx
    relates: []
    tags: []

  - id: quant-mental.approximation.compound-growth-example
    kind: example
    prominence: 0
    title: "Estimating 20-year growth at 7%"
    statement: >
      A quantity grows at $7\%$ per year for $20$ years — estimate the
      multiple without a calculator. Rule of 72 gives a doubling time of
      $72/7\approx10.3$ years, so $20$ years is just under two doublings:
      about $2^{20/10.3}\approx3.85\times$. The linear compounding pass
      $1+20(0.07)=2.40$ is useless here because $nx=1.4$ is not small, so
      lean on the doubling estimate instead. Exact value is
      $(1.07)^{20}=3.8697$, within $1\%$ of the doubling-based guess — good
      enough to sanity-check a spreadsheet.
    summary: >
      Rule of 72 and the compounding correction, run side by side on a
      20-year, 7% growth number — one of them is actually useful here.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.rule-72
      - quant-mental.approximation.binomial-approx
    relates: []
    tags: []

  - id: quant-mental.approximation.vol-quantile-example
    kind: example
    prominence: 0
    title: "Monthly move that is a 2-sigma event"
    statement: >
      A stock has $20\%$ annualized volatility; how large a one-month move
      counts as roughly $2\sigma$? Volatility scales with $\sqrt{t}$, not
      linearly, so monthly volatility is $20\%/\sqrt{12}\approx5.77\%$
      (annualizing runs the multiplication the other way). A $2\sigma$ move
      is then about $2\times5.77\%\approx11.5\%$, and by the normal-quantiles
      table that threshold is crossed with probability near
      $\Pr(|Z|>2)\approx4.6\%$ that month — a genuine outlier, not a routine
      move. The computation chains two approximations: horizon scaling, then
      the sigma-to-probability lookup.
    summary: >
      Chaining $\sqrt{t}$ horizon scaling with the sigma table to price a
      "how unusual was that move" question.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.annualizing
      - quant-mental.approximation.normal-quantiles
    relates: []
    tags: []

  - id: quant-mental.approximation.percent-compounding-trap
    kind: example
    prominence: 1
    title: "+20% then −20% is not back to even"
    statement: >
      A quantity rises $20\%$ then falls $20\%$: $(1+0.2)(1-0.2) = 1-0.2^{2}
      = 0.96$, a net $4\%$ loss, not zero — exactly the cross term the
      linear compounding pass would miss. In general, sequential changes
      $+x$ then $-x$ net to $-x^{2}$, growing with the square of the swing: a
      $10\%$ round trip costs only $1\%$, but a $50\%$ round trip costs
      $25\%$. Interview lesson: never add percentage changes, and expect the
      damage from an up-then-down swing to scale quadratically in its size.
    summary: >
      Why a symmetric percent round trip always loses money, quantified as
      exactly $-x^{2}$.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.binomial-approx
    relates:
      - id: quant-mental.arithmetic.percent-composition
        note: >
          That node establishes that percent changes compose multiplicatively;
          this one quantifies the size of the resulting $-x^{2}$ shortfall.
    tags: []

  - id: quant-mental.approximation.error-discipline
    kind: intuition
    prominence: 0
    title: "State the error, not just the estimate"
    statement: >
      Every technique in this toolkit trades exactness for speed by dropping
      a term; the discipline that makes the trade safe is naming the size of
      what was dropped, not just producing a number. "$\sqrt{26}\approx5.1$"
      is a guess; "$\sqrt{26}\approx5.1$, high by about $0.001$" is an answer
      an interviewer trusts, because it shows the approximation was
      controlled rather than accidental. The rule of thumb throughout: the
      error is comparable to the first omitted term, so glance at its size
      before reporting the estimate.
    summary: >
      An approximation without a stated error bar is a guess — the habit
      that turns this toolkit into something an interviewer trusts.
    parent: quant-mental.approximation
    also_under: []
    requires:
      - quant-mental.approximation.truncation-error
    relates: []
    tags: []
