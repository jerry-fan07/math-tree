# quant-mental.fermi — Fermi Estimation
# Outline node (36 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-mental.fermi
    kind: subbranch
    title: "Fermi Estimation"
    summary: >
      Decompose, bound, and multiply — order-of-magnitude estimation
      with error you can account for.
    parent: quant-mental
    also_under: []
    tags: []

  - id: quant-mental.fermi.decomposition
    kind: technique
    prominence: 2
    title: "Decomposition into estimable factors"
    statement: >
      Rewrite an unstable, unknown quantity as a product of factors you can
      each pin down from lived experience — populations, rates, durations,
      fractions — never a number recalled from memory. Chicago's grocery-store
      count might decompose as (population) × (groceries bought per person per
      week) ÷ (a store's weekly customer volume). Each factor should be
      independently guessable to within a factor of $2$–$3$; the product's
      relative errors partly cancel rather than compound, which is why a
      five-factor chain built from honest ranges still lands within an order
      of magnitude. Multiply through symbolically first, plug in numbers last,
      and round only at the end.
    summary: >
      Turn one impossible number into a product of several easy ones, each
      guessed from experience rather than recalled from memory.
    parent: quant-mental.fermi
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-mental.fermi.anchor-inventory
    kind: technique
    prominence: 1
    title: "Anchor inventory: populations, sizes, rates"
    statement: >
      A short list of memorized figures seeds most decompositions: world
      population $\approx 8\times10^{9}$; US population $\approx
      3.3\times10^{8}$; a large US city proper (Chicago, NYC) holds roughly
      $3$ to $8$ million people, its metro area $2$–$3\times$ that; US
      households $\approx 1.3\times10^{8}$ at $\approx 2.5$ people each;
      seconds per year $\approx \pi\times10^{7}$ (a physicist's trick:
      $365\times24\times3600\approx3.15\times10^{7}$, and
      $\pi\times10^{7}=3.14\times10^{7}$ is close enough to reuse instead of
      recomputing). Treat every entry here as good to one significant figure
      only.
    summary: >
      The handful of population, size and rate figures worth memorizing cold,
      including the seconds-per-year ≈ π×10⁷ trick.
    parent: quant-mental.fermi
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-mental.fermi.log-error
    kind: intuition
    prominence: 1
    title: "Multiplicative errors add on the log scale"
    statement: >
      If each factor in a decomposition is correct only to a multiplicative
      error (say within a factor of $2$, ×/÷), the product's total error is the
      product of the per-factor errors, not their sum — errors compound
      multiplicatively. Taking logs turns this into an ordinary sum:
      $\log(\text{error}) = \sum \log(\text{error}_i)$, so a chain of five
      factors each good to a factor of $2$, ×/÷ ($\log_{10}2\approx0.301$) gives a
      total log-error near $5\times0.301\approx1.5$, i.e. the final answer is
      good to within roughly a factor of $10^{1.5}\approx30$. That is worse
      than any one factor alone, but it is additive, bounded growth in log
      space rather than runaway growth — the reason a five-step Fermi chain
      still lands within an order of magnitude.
    summary: >
      Errors in a product multiply, but in log space they just add — the
      reason a multi-factor Fermi chain still lands within an order of
      magnitude.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.decomposition
      - quant-mental.approximation.anchors
    relates:
      - id: quant-mental.fermi.dimensional-check
        note: >
          Unit checks catch a structural mistake (the wrong operation) while
          log-error tracks ordinary magnitude drift — complementary checks,
          not overlapping ones.
    tags: []

  - id: quant-mental.fermi.geometric-mean-bounds
    kind: technique
    prominence: 1
    title: "Geometric mean of bounds"
    statement: >
      When a quantity is bracketed by a confident lower bound $L$ and upper
      bound $U$ but nothing narrower, guess the geometric mean $\sqrt{LU}$,
      not the arithmetic mean $(L+U)/2$: the arithmetic mean is dragged toward
      $U$ and overstates the typical scale, while $\sqrt{LU}$ sits at the
      midpoint on the log scale, where the error is actually symmetric.
      Worked: bounds of 10,000 and 1,000,000 (confident it exceeds ten
      thousand, confident it is under a million) give
      $\sqrt{10^{4}\cdot10^{6}} = \sqrt{10^{10}} = 10^{5}$, a guess of
      100,000 — against an arithmetic mean of 505,000 that sits absurdly
      close to the upper bound. Equivalent shortcut: average the exponents,
      $(4+6)/2=5$.
    summary: >
      Guess the midpoint in log space, not in linear space — bounds of 10k
      and 1M give a guess of 100k, not 505k.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.log-error
      - quant-mental.approximation.powers-of-two
    relates: []
    tags: []

  - id: quant-mental.fermi.dimensional-check
    kind: technique
    prominence: 1
    title: "Dimensional consistency as a check"
    statement: >
      Before trusting a decomposition, track units through every factor and
      confirm they cancel to the target unit — "cars sold per year" needs
      (people) × (cars per person per year), not (people) × (years per car).
      A unit mismatch catches a wrong operation (multiplying by a rate instead
      of dividing by it) instantly, independent of whether any individual
      number is right. For chained conversions, write each factor as a
      fraction with the unit to cancel sitting in the next factor's
      numerator: $\text{km} \to \text{km}\times\dfrac{\text{mi}}{\text{km}}
      \to \text{mi}$. Treat a Fermi estimate that fails its unit check as
      wrong regardless of how plausible the final number looks.
    summary: >
      Track units through the chain and confirm they cancel to the target
      unit — a check that costs nothing and doesn't depend on any number
      being right.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.decomposition
    relates: []
    tags: []

  - id: quant-mental.fermi.rounding-one-sig-fig
    kind: technique
    prominence: 0
    title: "Round every factor to one significant figure"
    statement: >
      Carry each input to a single significant figure and round aggressively
      at every step (2.7 million becomes 3 million; 8% becomes 1/10) rather
      than preserving decimals a mental estimate cannot support. Since the
      goal is the correct order of magnitude and roughly the right leading
      digit, extra precision in one factor is wasted once it is multiplied
      against factors known only to a factor of $2$, ×/÷. Rounding also keeps the
      arithmetic tractable under time pressure: $2.7\times3.4\times1.8$
      mentally is much harder than $3\times3\times2$, and the two products
      differ by less than the uncertainty already sitting in the inputs.
    summary: >
      Keep one significant figure per factor — extra decimals are wasted
      precision once multiplied against a ×/÷2 estimate.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.decomposition
    relates: []
    tags: []

  - id: quant-mental.fermi.stating-assumptions
    kind: intuition
    prominence: 0
    title: "State every assumption out loud"
    statement: >
      In an interview a Fermi answer is graded on the decomposition, not the
      final digit: narrate each factor as you choose it ("I'll assume the
      average American showers once a day for eight minutes") so the
      interviewer can redirect a bad assumption before it propagates, and so a
      wrong final number reached by sound reasoning still scores well.
      Silence is the failure mode — an unstated assumption buried inside a
      number looks like an error when questioned, while a stated one invites a
      one-line correction that costs seconds rather than the whole estimate.
      Announce the bounds and rounding choices too, not only the point
      values.
    summary: >
      The reasoning chain, spoken aloud, is what gets scored — a wrong number
      with visible assumptions beats a right number with none.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.decomposition
    relates: []
    tags: []

  - id: quant-mental.fermi.cross-check-second-path
    kind: technique
    prominence: 0
    title: "Cross-check with a second decomposition"
    statement: >
      When time allows, estimate the same quantity a second way from
      different factors — total US gasoline burned both from (cars) ×
      (miles per year) ÷ (mpg) and from (gasoline refined) × (fraction sold to
      cars) — and compare. Agreement within a factor of two or three across
      independent paths is strong evidence the order of magnitude is right,
      because the two chains share few or no wrong assumptions; disagreement
      by orders of magnitude flags a blunder (a dropped conversion, a
      double-counted population) rather than ordinary estimation noise. This
      is the Fermi analogue of checking an answer by a different method rather
      than redoing the same algebra.
    summary: >
      Re-derive the number from unrelated factors; two independent chains
      landing close together is the strongest evidence available.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.decomposition
    relates: []
    tags: []

  - id: quant-mental.fermi.subpopulation-weighting
    kind: technique
    prominence: 0
    title: "Split into weighted subpopulations"
    statement: >
      When a rate differs sharply across groups, decompose the population
      first and weight each piece by its own rate rather than applying one
      blended guess to everyone — "coffee cups sold in a city" should split
      into office-worker weekdays, retail weekdays, and weekend traffic, each
      with its own headcount and rate, combined as a weighted average
      $\sum_i w_i r_i$ with $w_i$ the population share of group $i$. A single
      blended rate applied across a skewed population systematically misses,
      because the group with the extreme rate rarely carries the extreme
      weight.
    summary: >
      Blend group-specific rates by population share instead of guessing one
      rate for everyone — a weighted average, not a flat one.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.decomposition
      - quant-mental.arithmetic.weighted-average
    relates: []
    tags: []

  - id: quant-mental.fermi.piano-tuners-chicago
    kind: example
    prominence: 2
    title: "Piano tuners in Chicago"
    statement: >
      Estimate the number of piano tuners working in Chicago. Chain:
      Chicago's metro population $\approx 9\times10^{6}$; households $\approx
      3.5\times10^{6}$ at $2.5$ people each; suppose $1$ in $20$ households
      owns a piano, giving $\approx1.8\times10^{5}$ pianos, plus a rough
      add-on for schools and concert halls, say $2\times10^{5}$ pianos total.
      Each piano is tuned once a year, taking a tuner about $2$ hours
      including travel; a tuner works $8$ hours a day, $5$ days a week, $50$
      weeks a year $\approx 2000$ hours, or $1000$ tunings a year. Tuners
      needed: $2\times10^{5}/1000 = 200$. The commonly quoted "right" answer
      is a few hundred, so $200$ lands in range.
    summary: >
      The Fermi archetype — population to pianos to tunings-per-year to
      tuners, landing near 200, worked factor by factor.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.anchor-inventory
      - quant-mental.fermi.rounding-one-sig-fig
    relates: []
    tags: []

  - id: quant-mental.fermi.windows-in-city
    kind: example
    prominence: 1
    title: "Windows in Chicago"
    statement: >
      Estimate the number of windows in Chicago. Split the housing stock by
      type rather than using one blended rate: of $\approx3.5\times10^{6}$
      metro-area households, say $60\%$ are apartments with $4$ windows each
      and $40\%$ are houses with $12$ windows each, giving
      $0.6\times3.5\times10^{6}\times4 + 0.4\times3.5\times10^{6}\times12
      \approx 8.4\times10^{6} + 1.7\times10^{7} \approx 2.5\times10^{7}$
      residential windows. Add a rough $20\%$ for commercial and municipal
      buildings — lower window density per occupant, but far more floor area
      — for a final estimate near $3\times10^{7}$ windows. The
      residential/commercial split matters more than either window count.
    summary: >
      Housing split by type (apartment vs. house) rather than one flat
      window-per-home rate, landing near 30 million windows.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.anchor-inventory
      - quant-mental.fermi.subpopulation-weighting
    relates:
      - id: quant-mental.fermi.weight-of-747
        note: >
          Both classics chain a physical decomposition to a number; one
          multiplies volumes and densities, the other splits a population by
          housing type.
    tags: []

  - id: quant-mental.fermi.weight-of-747
    kind: example
    prominence: 1
    title: "Weight of a fully loaded 747"
    statement: >
      Estimate the takeoff weight of a Boeing 747. Decompose by structure:
      the fuselage is roughly a cylinder $70\,\text{m}$ long and
      $6\,\text{m}$ across with an aluminum shell a few cm thick, giving a
      metal volume on the order of $10\,\text{m}^{3}$ at aluminum's density
      $\approx2.7\,\text{t/m}^{3}$, roughly $30$ tonnes for the shell alone;
      wings, engines and internals add a comparable multiple, say $5\times$,
      for a dry structure near $150$ tonnes. Fuel for a long-haul flight is
      $\approx150$ tonnes, and $400$ passengers plus cargo at $100\,\text{kg}$
      each add another $40$ tonnes. Total $\approx340$ tonnes, close to the
      real maximum takeoff weight of about $400$ tonnes.
    summary: >
      Structure-plus-fuel-plus-payload decomposition of a 747, landing near
      340 tonnes against a true value around 400.
    parent: quant-mental.fermi
    also_under: []
    requires:
      - quant-mental.fermi.dimensional-check
      - quant-mental.fermi.rounding-one-sig-fig
    relates: []
    tags: []
