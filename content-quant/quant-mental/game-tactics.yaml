# quant-mental.game-tactics — Playing Timed Games
# Outline node (37 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-mental.game-tactics
    kind: subbranch
    title: "Playing Timed Games"
    summary: >
      Meta-skill for arithmetic and estimation games — speed–accuracy
      tradeoffs, when to guess, and error control under a clock.
    parent: quant-mental
    also_under: []
    tags: []

  - id: quant-mental.game-tactics.scoring-rules
    kind: definition
    prominence: 1
    title: "Scoring rules for timed tests"
    statement: >
      Timed quantitative tests score each question by a triple: $+a$ for
      correct, $-b$ for incorrect, and $0$ (or a partial credit $c$) for
      skipped, with $a, b > 0$. Every guessing decision below depends on the
      rule only through the ratio $b/a$. Common conventions: no-penalty
      ($b=0$, always attempt), symmetric $+1/-1$, the SAT's five-choice
      $+1/-\tfrac{1}{4}$, and harsher $+1/-2$ schemes on some trading-firm
      tests. Naming the rule precisely before solving is the first step —
      "should I guess" has no answer until $a$ and $b$ are fixed.
    summary: >
      The point values assigned to right, wrong, and skipped answers —
      everything the guess-or-skip decision needs is packed into the ratio
      $b/a$.
    parent: quant-mental.game-tactics
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-mental.game-tactics.guessing-ev
    kind: technique
    prominence: 2
    title: "Guessing EV: the indifference threshold"
    statement: >
      Under a $+a/-b/0$ scoring rule, attempting a question you'll answer
      correctly with probability $p$ has expected score $pa-(1-p)b$, against
      $0$ for skipping. Solve $pa-(1-p)b>0$: attempt iff
      $p>\dfrac{b}{a+b}$. For the symmetric $+1/-1$ rule this is $p>1/2$ —
      guess whenever you lean right at all. For $+1/-2$ the threshold rises
      to $p>2/3$: a mere lean is not enough, the heavier wrong-answer
      penalty demands real confidence. This threshold is the break-even
      confidence an interviewer means by "should you guess on this
      arithmetic test."
    summary: >
      Attempt a question exactly when your confidence exceeds $b/(a+b)$ —
      $1/2$ under $+1/-1$, $2/3$ under $+1/-2$ — the canonical "should you
      guess" answer.
    parent: quant-mental.game-tactics
    also_under: []
    requires:
      - quant-mental.game-tactics.scoring-rules
      - quant-probability.expectation.expectation
    relates: []
    tags: []

  - id: quant-mental.game-tactics.partial-credit-guessing
    kind: example
    prominence: 0
    title: "Should you guess after eliminating an option?"
    statement: >
      Five-choice questions score $+1$ correct, $-\tfrac{1}{4}$ wrong (SAT-style,
      $b/a=1/4$). A blind guess has $p=1/5$, exactly at the threshold
      $b/(a+b)=1/5$: expected score
      $\tfrac{1}{5}(1)-\tfrac{4}{5}(\tfrac{1}{4})=0$, so blind guessing is precisely
      indifferent — the rule is calibrated that way on purpose. Eliminate one
      wrong choice and $p$ rises to $1/4$: expected score becomes
      $\tfrac{1}{4}(1)-\tfrac{3}{4}(\tfrac{1}{4})=\tfrac{1}{16}>0$, strictly profitable.
      Eliminating even a single option flips a five-choice guess from
      break-even to worth taking.
    summary: >
      On a $+1/-\tfrac{1}{4}$ five-choice test a blind guess is exactly
      break-even; eliminating just one wrong option makes guessing strictly
      profitable.
    parent: quant-mental.game-tactics
    also_under: []
    requires:
      - quant-mental.game-tactics.guessing-ev
    relates:
      - id: quant-probability.conditional.bayes
        note: >
          Eliminating a wrong choice is a live Bayesian update: it raises the
          posterior probability on each surviving option before the
          guessing-EV threshold is applied.
    tags: []

  - id: quant-mental.game-tactics.speed-accuracy
    kind: intuition
    prominence: 1
    title: "The error curve bends up near your speed limit"
    statement: >
      Error rate as a function of pace is not linear: well below your
      maximum sustainable speed, going faster costs almost no accuracy, but
      near the limit the same speed increase produces a disproportionate
      jump in mistakes — the curve is convex, not straight. Practically: the
      last $10\%$ of speed usually costs far more than $10\%$ of accuracy,
      while backing off from your absolute limit by a small margin can
      nearly eliminate errors at little cost in time. Timed tests reward
      finding the knee of this curve, not racing at the edge of it.
    summary: >
      Pushing speed near your personal limit costs accuracy at an
      accelerating, not constant, rate — the fast zone is where mistakes
      cluster.
    parent: quant-mental.game-tactics
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-mental.game-tactics.optimal-pace
    kind: technique
    prominence: 1
    title: "Choosing a pace that maximizes expected score rate"
    statement: >
      Combine the scoring rule with the speed–accuracy curve: expected score
      per unit time is $(p(v)a-(1-p(v))b)/t(v)$, where $v$ is your working
      speed, $p(v)$ your accuracy at that speed, and $t(v)$ the time per
      question. Since $p(v)$ falls off convexly near your limit, the
      maximizing pace sits strictly below top speed — race at the edge and
      the accuracy penalty outweighs the time saved. Under a harsh
      wrong-answer penalty (large $b$) the optimum shifts slower still;
      under no-penalty scoring it shifts toward raw speed.
    summary: >
      The pace that maximizes points per second sits below your top speed,
      and moves slower still as the wrong-answer penalty grows.
    parent: quant-mental.game-tactics
    also_under: []
    requires:
      - quant-mental.game-tactics.guessing-ev
      - quant-mental.game-tactics.speed-accuracy
    relates: []
    tags: []

  - id: quant-mental.game-tactics.sequencing
    kind: technique
    prominence: 1
    title: "Bank easy points first"
    statement: >
      When questions can be answered in any order, sort by expected score
      per unit time rather than by position: answer every question you can
      solve quickly and confidently first, flag anything that looks slow or
      low-confidence, and return to the flagged set only once every cheap
      point is banked. This avoids burning the middle of a timed round on
      one hard question while easy points later in the set go unclaimed
      because time ran out. A flagged question, once revisited, should still
      be attempted only if its confidence clears the guessing threshold
      $b/(a+b)$.
    summary: >
      Clear every fast, confident question before touching a slow one — a
      timed round punishes unclaimed easy points far more than one skipped
      hard question.
    parent: quant-mental.game-tactics
    also_under: []
    requires:
      - quant-mental.game-tactics.guessing-ev
    relates: []
    tags: []

  - id: quant-mental.game-tactics.cheap-checks
    kind: technique
    prominence: 1
    title: "One-second checks before you submit"
    statement: >
      Before committing to an answer, spend a fraction of a second on checks
      far cheaper than redoing the problem: parity (must the answer be
      odd or even), last-digit or digit-sum consistency, and rough magnitude
      (does the answer's order of size match a quick estimate). These catch
      the dominant error modes of fast arithmetic — sign flips, transposed
      digits, misplaced decimal points — without the cost of a full
      recomputation. This is the mod-$9$ and last-digit toolkit applied
      directly under a clock.
    summary: >
      Parity, last-digit, and magnitude checks catch the errors fast
      arithmetic actually makes, at a fraction of the cost of recomputing.
    parent: quant-mental.game-tactics
    also_under: []
    requires:
      - quant-mental.arithmetic.digit-checks
    relates: []
    tags: []

  - id: quant-mental.game-tactics.verification-budget
    kind: technique
    prominence: 0
    title: "Checking pays only while its cost is cheap"
    statement: >
      A check is worth running exactly when its expected time cost is less
      than the expected score it protects: a one-second parity check that
      catches a mistake worth an $a+b$ point swing is a bargain even at a
      modest error rate, but re-deriving an entire problem from scratch to
      confirm an answer you're already confident in rarely pays, because
      that time earns more spent on the next question at your optimal pace.
      Rule of thumb: budget a cheap check on every answer, and reserve a
      full recheck for answers that already feel shaky.
    summary: >
      Run the cheap checks on everything; reserve a full recheck for answers
      that already feel uncertain, since that time is worth more spent on
      the next question.
    parent: quant-mental.game-tactics
    also_under: []
    requires:
      - quant-mental.game-tactics.cheap-checks
      - quant-mental.game-tactics.optimal-pace
    relates: []
    tags: []

  - id: quant-mental.game-tactics.composure
    kind: intuition
    prominence: 0
    title: "Fixed routines reduce variance under pressure"
    statement: >
      A pre-committed routine — a fixed order of operations, a standard way
      to double-check, a default reaction to getting stuck — costs a little
      expected speed but removes the extra error variance that comes from
      improvising decisions live under a clock. Panic-driven shortcuts are
      exactly the moves that push you past the knee of the speed–accuracy
      curve without noticing. Interviewers reading a candidate's process are
      watching for this: composure under time pressure is itself a signal,
      not just a comfort.
    summary: >
      A rehearsed routine trades a little raw speed for a lot less error
      variance — composure is what keeps you off the steep part of the
      speed–accuracy curve.
    parent: quant-mental.game-tactics
    also_under: []
    requires:
      - quant-mental.game-tactics.speed-accuracy
    relates: []
    tags: []
