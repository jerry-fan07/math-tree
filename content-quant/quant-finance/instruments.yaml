  - id: quant-finance.instruments.discounting
    kind: definition
    prominence: 2
    title: "PV, FV and continuous compounding"
    statement: >
      The future value of a present sum $PV$ compounded at annual rate $r$,
      $n$ times per year, for $T$ years is $FV = PV(1+r/n)^{nT}$. Letting the
      compounding frequency $n \to \infty$ gives continuous compounding,
      $FV = PV e^{rT}$, and the present value of a cash flow $C$ received at
      time $T$ is $PV = Ce^{-rT}$. Worked: 100 dollars at $r = 5\%$ compounded
      continuously for 10 years grows to $100e^{0.5} \approx 164.87$ dollars,
      versus $100(1.05)^{10} \approx 162.89$ dollars compounded annually —
      continuous compounding is the limiting, largest case for a fixed nominal
      rate, which is why pricing formulas default to it: rates then add across
      horizons instead of multiplying.
    summary: >
      Money now beats money later by a factor of $e^{rT}$: continuous
      compounding is the limit of ever more frequent discrete compounding, and
      the everyday tool behind every PV/FV number in finance.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-tools.series-calculus.exp-limit
    relates:
      - id: quant-mental.approximation.rule-72
        note: >
          Both read off the same exponential growth curve: the rule-of-72
          doubling time is an approximate solution of $e^{rT} = 2$ for $T$.
    tags: []

  - id: quant-finance.instruments.equity
    kind: definition
    prominence: 1
    title: "Equity: shares and dividends"
    statement: >
      A share of common equity is a claim on a fractional ownership of a
      company's assets, earnings and voting rights, with no fixed maturity and
      no promised payment — unlike a bond's coupon, dividends are declared at
      the board's discretion and can be cut or skipped. Total return to a
      holder over a period combines price change and dividends:
      $R = (P_1 - P_0 + D)/P_0$. A stock bought at 50 dollars, paying a
      1-dollar dividend, and ending the period at 52 dollars returns
      $(52 - 50 + 1)/50 = 6\%$, split into a $4\%$ price return and a $2\%$
      dividend yield. As a residual claim, equity is paid only after debt and
      preferred holders, which is why it carries more risk — and more upside —
      than a bond from the same company.
    summary: >
      A share is a residual, undated claim on a company's cash flows — total
      return splits cleanly into price return plus dividend yield.
    parent: quant-finance.instruments
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-finance.instruments.indices-etfs
    kind: definition
    prominence: 0
    title: "Indices and ETFs"
    statement: >
      A stock index (the S&P 500, e.g.) is a fixed rule for combining the
      prices of a basket of stocks into one number; a market-cap-weighted
      index gives each constituent influence proportional to its market value,
      so a large move in a small constituent barely shifts the index. An
      exchange-traded fund (ETF) is a security that trades all day like a
      stock while holding a basket of assets, typically tracking an index. An
      arbitrage mechanism called creation/redemption lets authorized
      participants exchange baskets of the underlying assets for ETF shares
      and back, which keeps the ETF's market price close to its net asset
      value. The index itself is not directly tradable — only the fund or the
      underlying constituents are.
    summary: >
      An index is just a weighting rule over stock prices; an ETF is a
      tradable wrapper around a basket, kept honest against its own net asset
      value by an arbitrage mechanism.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-finance.instruments.equity
    relates: []
    tags: []

  - id: quant-finance.instruments.bond-pricing
    kind: definition
    prominence: 1
    title: "Bond cash flows and price"
    statement: >
      A coupon bond promises a fixed coupon $cF$ at each of $T$ regular
      periods (coupon rate $c$ on face value $F$) plus the return of $F$ at
      maturity; its fair price is the present value of every promised cash
      flow, discounted at the market's required rate $y$:
      $P = \sum_{t=1}^{T} \dfrac{cF}{(1+y)^{t}} + \dfrac{F}{(1+y)^{T}}$. The
      bond trades at a premium (price above $F$) when its coupon exceeds
      prevailing rates, at a discount (price below $F$) when the coupon is
      stingy relative to rates, and at par (price equal to $F$) exactly when
      $c = y$. A zero-coupon bond is the case $c = 0$: its price is a single
      discounted face value, $F/(1+y)^{T}$.
    summary: >
      A bond's price is nothing but the present value of its promised coupons
      and face value, discounted at the market rate.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-finance.instruments.discounting
    relates: []
    tags: []

  - id: quant-finance.instruments.bond-ytm
    kind: definition
    prominence: 1
    title: "Yield to maturity and the price–yield relation"
    statement: >
      The yield to maturity (YTM) of a bond is the single discount rate $y$
      that equates its market price to the present value of its promised cash
      flows: solve $P = \sum_t cF/(1+y)^{t} + F/(1+y)^{T}$ for $y$ given the
      observed price $P$. Every term in that sum is a decreasing function of
      $y$, so price and yield always move in opposite directions — a bond's
      price falls when yields rise and rises when yields fall — and the
      price–yield relationship is convex rather than a straight line. A
      2-year, $5\%$ annual-coupon, 100-dollar-face bond priced at 98 dollars
      has YTM above $5\%$: paying less for the same promised cash flows means
      the market is discounting them harder.
    summary: >
      Yield to maturity is the single rate that makes a bond's promised cash
      flows discount to its market price — and price and yield always move
      opposite ways.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-finance.instruments.bond-pricing
    relates: []
    tags: []

  - id: quant-finance.instruments.duration
    kind: proposition
    prominence: 1
    title: "Duration as price sensitivity"
    statement: >
      Duration measures a bond's price sensitivity to yield. Macaulay
      duration is the price-weighted average time to receive each cash flow,
      $D = \sum_t t \cdot PV_t / P$; modified duration $D_{mod} = D/(1+y)$
      gives the linear approximation $\%\Delta P \approx -D_{mod}\,\Delta y$,
      so duration is exactly the negative, rescaled slope of price against
      yield. Worked: a 2-year, $5\%$-coupon bond with 100-dollar face value,
      priced at par, pays 5 dollars at $t=1$ and 105 dollars at $t=2$, with
      present values 4.76 and 95.24 dollars; Macaulay duration is
      $(1 \cdot 4.76 + 2 \cdot 95.24)/100 \approx 1.95$ years, so
      $D_{mod} \approx 1.95/1.05 \approx 1.86$. A $1\%$ rise in yield should
      cut the price by about $1.86\%$, to roughly 98.14 dollars — longer
      maturities and lower coupons both raise duration and hence rate
      sensitivity.
    summary: >
      Duration is the slope of price against yield: a weighted-average
      cash-flow timing that converts a small rate move directly into a
      percentage price change.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-finance.instruments.bond-ytm
    relates: []
    tags: []

  - id: quant-finance.instruments.forward-future
    kind: definition
    prominence: 1
    title: "Forwards vs futures"
    statement: >
      A forward contract is a private (OTC) agreement between two
      counterparties to buy or sell an asset at a fixed price on a fixed
      future date; it is customized to the two parties' needs, carries each
      side's default risk, and typically settles once, at expiry. A futures
      contract is the same obligation standardized and traded on an exchange:
      contract size, expiry and deliverable grade are fixed, a clearinghouse
      stands as counterparty to both sides, eliminating bilateral default
      risk, and the position is marked to market daily, with gains and losses
      settled in cash every day rather than saved up to expiry. Being 'long' a
      forward or future is an obligation to buy at the fixed price; 'short' is
      an obligation to sell — unlike an option, there is no choice: the trade
      happens regardless of where the market ends up.
    summary: >
      A forward is a private, single-settlement promise to trade later at a
      fixed price; a future is the same promise standardized, cleared, and
      settled in cash every day.
    parent: quant-finance.instruments
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-finance.instruments.futures-margin
    kind: technique
    prominence: 1
    title: "Futures margin and marking to market"
    statement: >
      Opening a futures position requires posting initial margin — collateral
      sized as a small percentage of contract value, not a down payment on
      price. Each day the exchange marks the contract to that day's settlement
      price and settles the change in cash: a trader long a contract that
      rises 500 dollars has 500 dollars credited to their margin account that
      evening. If the balance falls below the maintenance margin level, a
      margin call requires topping it back up to the initial margin or the
      position is closed out. Worked: initial margin of 5,000 dollars,
      maintenance margin of 3,500 dollars; the position loses 1,600 dollars
      over two days, leaving 3,400 dollars — below maintenance — which
      triggers a call restoring the account to 5,000 dollars. Daily marking
      means futures P&L is realized continuously, unlike a forward's single
      settlement at expiry.
    summary: >
      Futures margin is collateral against daily price moves, not a down
      payment — losses are deducted from the account each night, and running
      low triggers a margin call.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-finance.instruments.forward-future
    relates: []
    tags: []

  - id: quant-finance.instruments.option-vocab
    kind: definition
    prominence: 1
    title: "Option contract vocabulary"
    statement: >
      An option is the right, not the obligation, to trade an underlying
      asset at a fixed strike price $K$ on or before an expiry date $T$. A
      call is the right to buy; a put is the right to sell. A European option
      can be exercised only at expiry; an American option can be exercised any
      time up to and including expiry. The buyer (long the option) pays a
      premium up front for that right and can never owe more than the premium
      already paid; the seller (short, or 'writer') collects the premium and
      takes on the obligation to perform if the buyer chooses to exercise.
      Unlike a forward or future, an option's payoff is asymmetric — exercised
      only when favorable to the holder — and the premium is exactly what that
      asymmetry is priced to cost.
    summary: >
      An option buys the right, never the obligation, to trade at a fixed
      strike by expiry — call/put and long/short is the whole vocabulary of
      the contract.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-finance.instruments.forward-future
    relates: []
    tags: []

  - id: quant-finance.instruments.short-selling
    kind: definition
    prominence: 1
    title: "Short selling: borrow mechanics and loss asymmetry"
    statement: >
      To sell a stock short, a trader borrows shares — typically from a
      broker's inventory or another client's account, for a borrow fee — and
      sells them immediately at the current price, owing the lender shares
      back rather than cash. Profit comes from later buying the shares back at
      a lower price and returning them; in the meantime the short also owes
      any dividends paid on the borrowed stock and pays the borrow rate the
      whole time, which spikes for stock that is 'hard to borrow.' The risk
      profile mirrors a long position: owning stock can lose at most the
      amount invested, since price cannot fall below zero, but a short
      position's loss is unbounded, because there is no ceiling on how high
      the buy-back price can go. This asymmetry is why brokers demand margin
      against short positions and can force a buy-in — a short squeeze — if
      collateral runs short.
    summary: >
      Shorting is selling borrowed shares now to buy them back later, cheaper
      — and unlike owning stock, the potential loss has no ceiling.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-finance.instruments.equity
    relates: []
    tags: []

  - id: quant-finance.instruments.leverage
    kind: definition
    prominence: 1
    title: "Leverage and margin"
    statement: >
      Buying 'on margin' means funding part of a position with a broker's
      loan rather than paying its full price in cash; leverage is the ratio of
      position size to the trader's own capital committed. Leverage scales
      percentage gains and losses on that capital by roughly that ratio, in
      both directions: 5,000 dollars of own capital borrowed up to 10,000
      dollars of stock (2x leverage, $50\%$ margin) turns a $10\%$ rise in the
      stock into roughly a $20\%$ gain on capital — 1,000 dollars profit on
      5,000 — and a $10\%$ fall into roughly a $20\%$ loss, before financing
      costs on the borrowed half. If account equity drops below the
      maintenance margin, the broker issues a margin call or force-liquidates
      the position, so leverage does not just scale returns — it can turn an
      ordinary drawdown into a forced exit at the worst possible time.
    summary: >
      Borrowed capital multiplies both the upside and the downside on your own
      money, and a bad enough move triggers a forced margin call regardless of
      your long-run view.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-finance.instruments.equity
    relates:
      - id: quant-finance.instruments.short-selling
        note: >
          Shorting is inherently leveraged in the same sense: margin is posted
          against borrowed shares rather than a cash loan, with the same
          forced-liquidation risk.
    tags: []

  - id: quant-finance.instruments.linear-vs-optional-payoff
    kind: intuition
    prominence: 0
    title: "Linear exposure vs optionality"
    statement: >
      Stocks, forwards and futures are linear instruments: profit or loss
      scales one-for-one (or by a fixed contract multiplier) with the move in
      the underlying, in either direction, with no cap on the loss of a short
      stock or of a long or short forward/future. Options break that symmetry
      — the payoff bends at the strike, since the holder simply declines to
      exercise when it would be unfavorable. A long stock or future is priced
      purely as a directional bet by no-arbitrage replication; an option
      additionally prices the value of that one-sided choice, which is exactly
      where volatility enters. The first question to ask about any new
      instrument is whether its payoff is a straight line or has a kink
      somewhere.
    summary: >
      Stocks and futures pay off in a straight line; options bend at the
      strike — that kink is what volatility gets priced into.
    parent: quant-finance.instruments
    also_under: []
    requires:
      - quant-finance.instruments.option-vocab
    relates: []
    tags: []
