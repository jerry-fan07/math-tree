# quant-finance.arbitrage — No-Arbitrage & Parity
# Outline node (45 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-finance.arbitrage
    kind: subbranch
    title: "No-Arbitrage & Parity"
    summary: >
      Pricing by replication — law of one price, cost of carry, put–call
      parity, and the option bounds every interview checks.
    parent: quant-finance
    also_under: []
    tags: []

  - id: quant-finance.arbitrage.no-arbitrage
    kind: axiom
    prominence: 2
    title: "No arbitrage"
    statement: >
      An arbitrage is a position you can put on for nothing today whose payoff
      at $T$ is never negative and is strictly positive in at least one state
      — equivalently, one with strictly negative cost today and a payoff that
      is never negative. The axiom says a liquid market contains none: such a
      trade would be taken in unlimited size until the prices permitting it
      moved. The standing frictionless assumptions are that you may borrow and
      lend freely at the riskless rate $r$, sell short at no cost, trade any
      size, and face no credit risk. Note what is absent: no probabilities
      beyond "some state", no drift, no risk preferences. Every price below is
      forced by this one axiom, and the answer to a violation is always the
      explicit trade.
    summary: >
      There is no free lunch: no zero-cost portfolio can have a payoff that is
      never negative and sometimes positive.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.instruments.discounting
      - quant-finance.instruments.short-selling
    relates:
      - id: quant-games.betting-markets.dutch-book
        note: >
          The same argument inside a betting shop: a Dutch book is an
          arbitrage across the states of an event, and de-vigged implied
          probabilities summing to one is that market's law of one price.
    tags: []

  - id: quant-finance.arbitrage.law-of-one-price
    kind: proposition
    prominence: 1
    title: "Law of one price"
    statement: >
      If two portfolios have identical payoffs in every state at time $T$,
      they have identical prices at every earlier time. Proof: if $X$ costs
      more than $Y$, sell $X$ and buy $Y$; the terminal payoffs cancel state
      by state, so the position is riskless and the cash difference is free —
      an arbitrage. Two corollaries do most of the work later: price is
      additive, so a package is worth the sum of its pieces, and a payoff that
      is zero in every state is worth zero today. Frictions weaken the
      equality to a band: bid–ask spreads, borrow fees and financing costs
      mean real screens show near-arbitrages, quotes inside a no-trade band of
      round-trip cost, rather than exact equality.
    summary: >
      Same payoff in every state means same price today — otherwise you sell
      the dear one, buy the cheap one, and keep the difference risklessly.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.no-arbitrage
    relates: []
    tags: []

  - id: quant-finance.arbitrage.replication
    kind: technique
    prominence: 2
    title: "Pricing by replication"
    statement: >
      Reach for this whenever you are asked what something is worth and given
      no distribution. Steps: (1) write the payoff of the target at $T$ as a
      function of the terminal underlying price $S_T$; (2) assemble a
      portfolio of instruments you can already price — shares, zero-coupon
      bonds, forwards, other options — whose payoff matches state by state;
      (3) by the law of one price, the target's price is the cost of that
      portfolio; (4) if the market disagrees, buy the cheap side, sell the
      dear side, and quote the difference as your profit. Worked in one line:
      a forward with delivery price $K$ pays $S_T - K$, which is one share
      minus $K$ bonds, so it is worth $S - Ke^{-rT}$ today.
    summary: >
      Build the payoff out of things you can already price, and the cost of
      that portfolio is the price — no probabilities required.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.law-of-one-price
    relates: []
    tags: []

  - id: quant-finance.arbitrage.relative-pricing
    kind: intuition
    prominence: 0
    title: "What no-arbitrage does and does not buy you"
    statement: >
      No-arbitrage is a relative pricing tool. It tells you what an option is
      worth given the stock and the bond; it never tells you whether the stock
      itself is correctly priced, because there is nothing to replicate it
      with. That is its strength — the conclusions are model-free, surviving
      any distribution of $S_T$ — and its limit. Keep two vocabularies apart
      under questioning: an arbitrage is riskless and self-financing, while a
      positive-expected-value trade is neither, and calling the second one
      arbitrage is a red flag. Real limits to arbitrage are financing cost,
      margin calls before convergence, borrow recall on the short leg, and
      execution risk on the legs.
    summary: >
      Replication prices instruments against each other with no model, but
      says nothing about whether the underlying is cheap.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.replication
    relates: []
    tags: []

  - id: quant-finance.arbitrage.forward-pricing
    kind: theorem
    prominence: 1
    title: "Forward price by cash and carry"
    statement: >
      For an asset with no income and no storage cost, a constant continuously
      compounded rate $r$, and delivery at $T$, the forward price is
      $F = Se^{rT}$. Proof by replication: borrow $S$, buy the asset, and hold
      it. At $T$ you own the asset and owe $Se^{rT}$, which is exactly the
      payoff of a long forward struck at $Se^{rT}$; since entering a forward
      costs nothing today and the replication also costs nothing today, the
      strike that makes the payoffs match must be the traded one. Discretely
      compounded, $F = S(1+r)^{T}$. An existing forward struck at $K$ is worth
      $(F - K)e^{-rT}$. With $S = 100$, $r = 5\%$, $T = 1$: $F = 105.13$. $F$
      is not a forecast of $S_T$ — it is today's spot carried forward.
    summary: >
      The forward price is just the spot compounded at the riskless rate,
      because buying now on borrowed money replicates buying later.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.replication
      - quant-finance.instruments.forward-future
    relates: []
    tags: []

  - id: quant-finance.arbitrage.cash-and-carry
    kind: example
    prominence: 1
    title: "Cash-and-carry arbitrage, both directions"
    statement: >
      Take $S = 100$, $r = 5\%$, $T = 1$, so the fair forward is $105.13$.
      Forward too rich, quoted $108$ — cash and carry: borrow $100$, buy the
      share, sell the forward. At $T$ deliver the share for $108$, repay
      $100e^{0.05} = 105.13$, keep $2.87$. Forward too cheap, quoted $103$ —
      reverse cash and carry: short the share for $100$, lend the proceeds,
      buy the forward. At $T$ collect $105.13$, take delivery for $103$,
      return the borrowed share, keep $2.13$. Both trades cost nothing today
      and pay a certain positive amount, so only $F = 105.13$ is arbitrage
      free. In practice the borrow fee and the short-sale mechanics make the
      reverse leg the harder one, which is why cheap forwards persist longer
      than rich ones.
    summary: >
      A forward at 108 or at 103 against a fair 105.13 is a riskless 2.87 or
      2.13 — the trade that enforces $F = Se^{rT}$ from both sides.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.forward-pricing
    relates: []
    tags: []

  - id: quant-finance.arbitrage.cost-of-carry
    kind: proposition
    prominence: 1
    title: "Cost of carry: dividends, yield and storage"
    statement: >
      Income and costs move the exponent. With a continuous income yield $q$
      and continuous storage cost $u$, $F = Se^{(r + u - q)T}$; with dividends
      known in amount and date, $F = (S - \operatorname{PV}(D))e^{rT}$,
      because the holder of the physical asset collects them while the forward
      holder does not. Worked: $S = 100$, $r = 5\%$, $T = 1$ and one dividend
      of $2$ at six months has
      $\operatorname{PV}(D) = 2e^{-0.025} = 1.95$, so
      $F = 98.05 \cdot e^{0.05} = 103.08$ against $105.13$ with no dividend.
      An index with $q = 2\%$ gives $F = 100e^{0.03} = 103.05$. When
      $q > r + u$ the curve is in backwardation, $F < S$.
    summary: >
      Forward equals spot plus everything carrying the asset costs you minus
      everything it pays you — dividends and yields push $F$ below $Se^{rT}$.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.forward-pricing
    relates: []
    tags: []

  - id: quant-finance.arbitrage.put-call-parity
    kind: theorem
    prominence: 2
    title: "Put–call parity"
    statement: >
      Hypotheses: a European call and a European put on the same underlying,
      the same strike $K$ and the same expiry $T$, no dividends before $T$, a
      constant riskless rate $r$, no frictions. Then
      $C - P = S - Ke^{-rT}$. Proof by replication: portfolio A is the call
      plus $K$ face value of zero-coupon bonds maturing at $T$; portfolio B is
      the put plus one share. At expiry A pays $K + (S_T - K)^{+}$ and B pays
      $S_T + (K - S_T)^{+}$, and both equal $\max(S_T, K)$ in every state, so
      $C + Ke^{-rT} = P + S$. It is an identity, not a model: no distribution
      of $S_T$ appears, so it constrains whatever prices the market puts on
      the two options.
    summary: >
      Call minus put equals stock minus discounted strike, for European
      options on a non-dividend underlying — a model-free identity.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.replication
      - quant-finance.instruments.option-vocab
    relates: []
    tags: []

  - id: quant-finance.arbitrage.parity-worked
    kind: example
    prominence: 1
    title: "Parity worked: spot 100, strike 100, one year"
    statement: >
      Take $S = 100$, $K = 100$, $r = 5\%$ continuously compounded, $T = 1$.
      Then $Ke^{-rT} = 100e^{-0.05} = 95.12$, so
      $C - P = 100 - 95.12 = 4.88$: the at-the-money call is worth $4.88$ more
      than the at-the-money put. Get the sign instantly — the call holder
      defers paying the strike for a year, and the interest on $K$ is exactly
      what that deferral is worth. If the put is quoted at $5.50$, the call
      must be $10.38$. Stretching to $T = 2$ gives $Ke^{-0.10} = 90.48$ and a
      gap of $9.52$; setting $r = 0$ collapses the gap to zero and forces
      $C = P$ at the money. Parity pins the difference and never either price
      alone.
    summary: >
      The canonical numbers: $C - P = 100 - 95.12 = 4.88$, so the ATM call
      beats the ATM put by the interest on the strike.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.put-call-parity
    relates: []
    tags: []

  - id: quant-finance.arbitrage.parity-violation
    kind: example
    prominence: 1
    title: "Conversion arbitrage when parity is violated"
    statement: >
      Same data — $S = 100$, $K = 100$, $r = 5\%$, $T = 1$, fair gap $4.88$ —
      but the screen shows $C = 8.00$ and $P = 2.00$, a gap of $6.00$, so the
      call is rich by $1.12$. Sell the rich side: the conversion is short the
      call $(+8)$, long the put $(-2)$, long the share $(-100)$, a net outlay
      of $94$ funded by borrowing at $5\%$. At expiry the share plus put minus
      call is worth exactly $K = 100$ whatever $S_T$ does; repay
      $94e^{0.05} = 98.82$ and keep $1.18$, which is the $1.12$ mispricing
      carried one year forward. Mirror case: a gap of $4.00$ means the put is
      rich, so run the reversal — long call, short put, short share for a net
      credit of $96$, lend it, and collect $0.92$ at expiry.
    summary: >
      Gap 6.00 against a fair 4.88: the conversion locks 1.12 today, 1.18 at
      expiry, with the reversal as the mirror trade.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.parity-worked
    relates: []
    tags: []

  - id: quant-finance.arbitrage.synthetics
    kind: technique
    prominence: 1
    title: "Conversions, reversals and box spreads"
    statement: >
      Rearranging $C - P = S - Ke^{-rT}$ manufactures any leg out of the other
      three. Synthetic long stock is long call, short put, plus $K$ of bonds:
      $S = C - P + Ke^{-rT}$. Synthetic call is long put, long share, short
      $Ke^{-rT}$ of bonds. A conversion is long share, long put, short call at
      one strike and expiry, worth exactly $K$ at expiry — a synthetic bond —
      and a reversal is its opposite. Two conversions at strikes $K_1 < K_2$
      combine into a box spread, riskless and paying $K_2 - K_1$, which is how
      desks lend and borrow through the options market. Working use: price the
      synthetic, compare it with the screen, and trade whichever leg is out of
      line; the package is delta-flat by construction.
    summary: >
      Any one of call, put, stock and bond is replicable from the other three
      — conversions, reversals and boxes are just parity rearranged.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.put-call-parity
    relates: []
    tags: []

  - id: quant-finance.arbitrage.parity-dividends
    kind: corollary
    prominence: 1
    title: "Parity with dividends and carry"
    statement: >
      With dividends of present value $\operatorname{PV}(D)$ paid before
      expiry, $C - P = S - \operatorname{PV}(D) - Ke^{-rT}$; with a continuous
      yield $q$, $C - P = Se^{-qT} - Ke^{-rT}$. Reason: the replicating
      portfolio holding the share collects the dividends, so only the
      ex-dividend part of the spot has to be funded. Worked: $S = 100$,
      $K = 100$, $r = 5\%$, $T = 1$ with a dividend of $2$ at six months
      $(\operatorname{PV} = 1.95)$ gives
      $C - P = 100 - 1.95 - 95.12 = 2.93$ against $4.88$ with no dividend —
      dividends move value from calls to puts. The tidiest form covers every
      carry at once: $C - P = (F - K)e^{-rT}$, with $F$ the forward price.
    summary: >
      Dividends shrink the call–put gap to $2.93$ here; in forward language
      parity is always $C - P = (F - K)e^{-rT}$.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.put-call-parity
      - quant-finance.arbitrage.cost-of-carry
    relates: []
    tags: []

  - id: quant-finance.arbitrage.option-bounds
    kind: proposition
    prominence: 1
    title: "Model-free option bounds"
    statement: >
      For European options on a non-dividend stock: $0 \le C \le S$ and
      $C \ge (S - Ke^{-rT})^{+}$; $0 \le P \le Ke^{-rT}$ and
      $P \ge (Ke^{-rT} - S)^{+}$. The upper bounds are direct — a call never
      pays more than the share, a put never more than $K$ at expiry, so a call
      quoted above $S$ or a put above $Ke^{-rT}$ is sold against the
      replicating position. The lower bounds come from parity plus
      nonnegativity: $C = P + S - Ke^{-rT} \ge S - Ke^{-rT}$ since $P \ge 0$,
      and symmetrically for $P$ using $C \ge 0$. At $S = K = 100$,
      $r = 5\%$, $T = 1$: $4.88 \le C \le 100$ and $0 \le P \le 95.12$.
      American values add $C_A \ge \max(C, S - K)$ and
      $P_A \ge \max(P, K - S)$.
    summary: >
      Every option price sits in a box fixed by arbitrage alone — a call is at
      least $S - Ke^{-rT}$ and at most $S$, with no model involved.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.put-call-parity
    relates: []
    tags: []

  - id: quant-finance.arbitrage.no-early-exercise
    kind: corollary
    prominence: 1
    title: "Never exercise an American call early (no dividends)"
    statement: >
      For an American call on a stock paying no dividends before $T$, with
      $r > 0$, early exercise is never optimal, so the American call is worth
      exactly the European one. Proof from the bounds:
      $C_A \ge C \ge S - Ke^{-rT} > S - K$, and $S - K$ is all that exercising
      collects, so selling the option always beats exercising it. Numbers:
      $S = 120$, $K = 100$, $r = 5\%$, $T = 1$ has intrinsic value $20$ but a
      floor of $120 - 95.12 = 24.88$. Two economic readings: exercising pays
      the strike a year early and forfeits its interest, and it throws away
      downside protection worth $P$ by parity. Dividends break the argument —
      exercising just before a large dividend can be optimal.
    summary: >
      The call is always worth more alive than exercised, since its arbitrage
      floor $S - Ke^{-rT}$ already exceeds the intrinsic value $S - K$.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.option-bounds
    relates: []
    tags: []

  - id: quant-finance.arbitrage.american-put-early
    kind: proposition
    prominence: 0
    title: "American puts can be worth exercising early"
    statement: >
      Deep in the money the argument reverses. Exercising an American put now
      pays $K - S$ in cash immediately, while a European put can never be
      worth more than $Ke^{-rT}$, the present value of its best possible
      payoff. With $K = 100$, $r = 5\%$, $T = 1$ and $S$ near zero, exercising
      yields about $100$ but the European put is capped at $95.12$; so
      $P_A > P$ strictly, early exercise is optimal below a critical stock
      price, and that boundary has no closed form. For Americans on a
      non-dividend stock, parity degrades to the two-sided band
      $S - K \le C_A - P_A \le S - Ke^{-rT}$. Interview summary: American call
      equals European call, American put strictly exceeds European put.
    summary: >
      Waiting costs interest on the strike, so a deep in-the-money American
      put should be exercised — the one early-exercise case that survives.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.no-early-exercise
    relates: []
    tags: []

  - id: quant-finance.arbitrage.fx-triangular
    kind: example
    prominence: 1
    title: "Triangular FX arbitrage"
    statement: >
      Three quotes: EUR/USD $= 1.1000$, USD/JPY $= 150.00$, EUR/JPY
      $= 166.00$. The cross implied by the first two is
      $1.1000 \times 150.00 = 165.00$, so the euro is quoted one yen rich
      against the market's own legs. Trade the loop: start with one million
      USD, buy euros at $1.10$ to get 909,090.91 EUR, sell those for yen at
      $166$ to get 150,909,091 JPY, sell the yen at $150$ to get
      1,006,060.61 USD — a riskless 6,060.61 USD, or
      $166/165 - 1 = 0.61\%$, with no position held. Were the cross $164$,
      run the triangle the other way. The no-arbitrage condition is that the
      three rates multiply to $1$ around the loop; three round-trip spreads
      are the hurdle, which is why this is a latency business.
    summary: >
      A cross of 166 against an implied 165 turns one million USD into
      1,006,060.61 USD in one loop — the law of one price across currencies.
    parent: quant-finance.arbitrage
    also_under: []
    requires:
      - quant-finance.arbitrage.law-of-one-price
    relates:
      - id: quant-games.betting-markets.overround
        note: >
          A bookmaker's overround is this triangle's round-trip spread seen
          from the other side: quoted prices that fail to multiply to one
          around the loop, with the excess kept by the market maker instead of
          an arbitrageur.
    tags: []
