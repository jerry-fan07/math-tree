# quant-finance.options — Option Pricing
# Outline node (46 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-finance.options
    kind: subbranch
    title: "Option Pricing"
    summary: >
      From payoff diagrams to Black–Scholes — binomial replication,
      risk-neutral probability, implied volatility, and the strategy
      payoffs.
    parent: quant-finance
    also_under: []
    tags: []

  - id: quant-finance.options.payoff-diagrams
    kind: technique
    prominence: 1
    title: "Payoff and P&L diagrams"
    statement: >
      At expiry a European call pays $(S_T - K)^{+}$ and a put pays
      $(K - S_T)^{+}$: plot the payoff against $S_T$ as a hockey stick with its
      kink at $K$ and slopes $0$ and $\pm 1$. The P&L diagram is the payoff
      shifted down by the premium paid, or up by the premium received on a
      short, so a call bought at $c$ breaks even at $K + c$ and a put bought at
      $p$ breaks even at $K - p$. Shorts are the mirror images: a short call
      loses without bound above the strike, a short put loses at most
      $K$ minus the premium. Method for every strategy below: draw each leg,
      add the graphs vertically, then read off max profit, max loss and the
      breakevens where the total crosses zero.
    summary: >
      Draw the kinks, the unit slopes and the premium shift, then add legs
      vertically — payoff diagrams answer "what is my worst case and where do I
      break even?" without algebra.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.instruments.option-vocab
    relates: []
    tags: []

  - id: quant-finance.options.intrinsic-time-value
    kind: definition
    prominence: 1
    title: "Moneyness, intrinsic value and time value"
    statement: >
      Intrinsic value is the payoff if expiry were now, $(S-K)^{+}$ for a call
      and $(K-S)^{+}$ for a put; time value is price minus intrinsic value. A
      call is in the money when $S > K$, at the money when $S \approx K$, out of
      the money when $S < K$, reversed for puts; moneyness is quoted as $S/K$ or
      in standard deviations, $\ln(S/K)/(\sigma\sqrt{T})$. A European call on a
      non-dividend stock always carries nonnegative time value, since
      $C \ge (S - Ke^{-rT})^{+}$; a deep in-the-money European put can trade
      below intrinsic, because the strike arrives only at $T$. Time value is
      largest at the money and decays to zero at expiry.
    summary: >
      Price splits into intrinsic value, the payoff if expiry were now, and time
      value, what you pay for the remaining uncertainty — the latter is fattest
      at the money and gone at expiry.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.payoff-diagrams
    relates: []
    tags: []

  - id: quant-finance.options.binomial-pricing
    kind: technique
    prominence: 2
    title: "One-step binomial pricing by replication"
    statement: >
      One period, stock $S = 100$ moving to $uS = 120$ or $dS = 80$, rate
      $r = 0$, and a call struck at $K = 100$ paying $C_u = 20$ or $C_d = 0$.
      Hold $\Delta$ shares plus $B$ in cash and match the option in both states:
      $\Delta = (C_u - C_d)/(S(u-d)) = 20/40 = 0.5$, then
      $0.5 \cdot 120 + B = 20$ gives $B = -40$. That portfolio costs
      $\Delta S + B = 50 - 40 = 10$ today, so the call is worth exactly $10$;
      at any other price you trade the option against the hedge and bank the
      difference. The same recipe prices the put: $\Delta = -0.5$, $B = 60$,
      price $10$. Note what never entered the calculation — the probability of
      an up move.
    summary: >
      Match the option's two payoffs with $\Delta$ shares and cash; the hedge's
      cost is the price. Worked: $\Delta = 0.5$, borrow $40$, call $= 10$.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.payoff-diagrams
      - quant-finance.arbitrage.replication
    relates: []
    tags: []

  - id: quant-finance.options.risk-neutral
    kind: theorem
    prominence: 2
    title: "Risk-neutral probability and pricing as expectation"
    statement: >
      In the one-step model, no arbitrage is equivalent to
      $d < e^{r\Delta t} < u$; define
      $q = (e^{r\Delta t} - d)/(u - d) \in (0,1)$. Then the replication price of
      any payoff taking values $V_u$ and $V_d$ is
      $V_0 = e^{-r\Delta t}\,(q V_u + (1-q) V_d)$ — substitute the hedge
      $\Delta$ and $B$ and collect terms. Equivalently $q$ is the unique weight
      making the discounted stock a martingale,
      $q\,uS + (1-q)\,dS = S e^{r\Delta t}$. With $u = 1.2$, $d = 0.8$, $r = 0$:
      $q = 0.2/0.4 = 1/2$ and the call is $(1/2)(20) = 10$, matching the hedge.
      One $q$ prices every derivative on that stock.
    summary: >
      Replication is algebraically identical to discounting the payoff's
      expectation under the probability $q$ that makes the stock grow at the
      risk-free rate.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.binomial-pricing
    relates: []
    tags: []

  - id: quant-finance.options.risk-neutral-vs-real
    kind: intuition
    prominence: 1
    title: "Why the real-world probability drops out"
    statement: >
      The standard challenge is "the stock rises with probability $0.9$ — surely
      the call is worth more than $10$?" It is not. The hedge of $0.5$ shares
      financed by $40$ of borrowing reproduces the payoff in both states, so the
      price is pinned by the hedge's cost whatever $p$ is; if $p$ moved the
      option price you would trade option against hedge for free money. So $q$
      is not a forecast, it is the current price of a bet paying $1$ in the up
      state, rescaled. The real drift is already inside today's $S$, and
      counting it again would double count it. This is why $\mu$ is absent from
      Black–Scholes while $\sigma$, which hedging cannot remove, is the input
      that matters.
    summary: >
      The replicating portfolio pins the price, so the true up-probability is
      irrelevant — expected return is already in the spot, and only volatility
      survives the hedge.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.risk-neutral
    relates: []
    tags: []

  - id: quant-finance.options.multi-step-binomial
    kind: technique
    prominence: 1
    title: "Multi-step trees and dynamic replication"
    statement: >
      Apply the one-step rule by backward induction on a recombining tree. Two
      steps with $u = 1.2$, $d = 0.8$, $r = 0$, $K = 100$: terminal prices
      $144, 96, 64$ with call payoffs $44, 0, 0$; the up node is worth
      $(1/2)(44) = 22$, the down node $0$, so today's price is
      $(1/2)(22) = 11$. The hedge is now dynamic: $\Delta_0 = 22/40 = 0.55$,
      rebalanced after one step to $\Delta_u = 44/48 \approx 0.92$ or
      $\Delta_d = 0$, every rebalance self-financing. For $n$ steps the value is
      $e^{-rT}\sum_{k} \binom{n}{k} q^{k}(1-q)^{n-k}\,\text{payoff}(u^{k}d^{n-k}S)$.
      American options use the same sweep with the node value replaced by
      $\max(\text{continuation}, \text{intrinsic})$.
    summary: >
      Roll the risk-neutral expectation backwards node by node; the replicating
      share count changes at every step, which is what "dynamic hedging" means.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.risk-neutral
    relates: []
    tags: []

  - id: quant-finance.options.binomial-convergence
    kind: proposition
    prominence: 0
    title: "The tree's lognormal limit"
    statement: >
      Cox–Ross–Rubinstein calibration: with $n$ steps of length
      $\Delta t = T/n$ take $u = e^{\sigma\sqrt{\Delta t}}$ and $d = 1/u$, so
      that $q \to 1/2 + \tfrac{r - \sigma^{2}/2}{2\sigma}\sqrt{\Delta t}$. Then
      $\ln(S_T/S_0)$ is a sum of $n$ independent $\pm\sigma\sqrt{\Delta t}$
      steps, whose limit law is normal with mean $(r - \sigma^{2}/2)T$ and
      variance $\sigma^{2}T$ — so $S_T$ is lognormal and the tree price
      converges to the Black–Scholes value, at rate about $1/n$ with a
      characteristic odd–even oscillation. This is the cheapest honest
      derivation of the continuous-time formula, and the reason a $50$-step tree
      is already accurate to pennies.
    summary: >
      Shrink the time step with $u = e^{\sigma\sqrt{\Delta t}}$ and the binomial
      terminal price becomes lognormal, carrying the tree price to the
      Black–Scholes price.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.multi-step-binomial
      - quant-probability.continuous.lognormal
    relates:
      - id: quant-probability.limits.clt
        note: >
          The convergence is a central limit theorem applied to the sum of
          independent log-price steps, which is why the limit is lognormal
          rather than anything else.
    tags: []

  - id: quant-finance.options.risk-neutral-dynamics
    kind: proposition
    prominence: 1
    title: "Risk-neutral dynamics of the stock"
    statement: >
      In continuous time the hedging argument again replaces the real drift by
      $r$: under the risk-neutral measure $dS = rS\,dt + \sigma S\,dB$, hence
      $S_T = S_0\exp\left((r - \sigma^{2}/2)T + \sigma\sqrt{T}\,Z\right)$ with
      $Z$ standard normal. Facts to have cold:
      $\mathbb{E}^{Q}[S_T] = S_0 e^{rT}$, the forward price; the median
      $S_0 e^{(r - \sigma^{2}/2)T}$ sits below that mean; $\ln S_T$ has standard
      deviation $\sigma\sqrt{T}$, so uncertainty grows with the square root of
      time. Every European payoff is then priced as
      $e^{-rT}\,\mathbb{E}^{Q}[\text{payoff}(S_T)]$, an integral against this
      lognormal density.
    summary: >
      Under the pricing measure the stock drifts at $r$ and ends lognormal, so
      any European option is a discounted integral of its payoff against that
      density.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.risk-neutral
      - quant-processes.ito.gbm
    relates:
      - id: quant-processes.ito.vol-drag
        note: >
          The $-\sigma^{2}/2$ in the exponent is the same compounding drag: the
          risk-neutral stock has mean growth $r$ precisely because its log grows
          at $r - \sigma^{2}/2$.
    tags: []

  - id: quant-finance.options.black-scholes
    kind: theorem
    prominence: 2
    title: "Black–Scholes formula"
    statement: >
      For a European call on a non-dividend-paying stock,
      $C = S_0\,\Phi(d_1) - Ke^{-rT}\,\Phi(d_2)$, where
      $d_1 = \dfrac{\ln(S_0/K) + (r + \sigma^{2}/2)T}{\sigma\sqrt{T}}$,
      $d_2 = d_1 - \sigma\sqrt{T}$, and $\Phi$ is the standard normal CDF; the
      put is $P = Ke^{-rT}\,\Phi(-d_2) - S_0\,\Phi(-d_1)$, and the pair
      satisfies put–call parity. Assumptions: the stock follows geometric
      Brownian motion with constant $\sigma$, constant $r$, no dividends,
      continuous frictionless trading with no transaction costs, unlimited
      shorting and divisibility, no arbitrage, European exercise. Two
      derivations: integrate the payoff against the risk-neutral lognormal
      density, or solve the PDE satisfied by the delta-hedged portfolio.
    summary: >
      The closed-form European option price under geometric Brownian motion —
      five inputs, of which only $\sigma$ is unobservable.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.risk-neutral-dynamics
    relates: []
    tags: []

  - id: quant-finance.options.exercise-probability
    kind: proposition
    prominence: 1
    title: "Reading the formula: what Φ(d₁) and Φ(d₂) are"
    statement: >
      $\Phi(d_2)$ is the risk-neutral probability that the call finishes in the
      money, $\Pr^{Q}(S_T > K)$, because $S_T > K$ is exactly $Z > -d_2$ in the
      lognormal representation. The first term is
      $S_0\,\Phi(d_1) = e^{-rT}\,\mathbb{E}^{Q}[S_T\,\mathbf{1}\{S_T > K\}]$,
      the present value of the stock you receive on exercise, so the formula
      reads "asset if exercised, minus strike if exercised". $\Phi(d_1)$ is also
      the hedge ratio — the share count in the replicating portfolio, which the
      Greeks subbranch names delta. Always $\Phi(d_1) > \Phi(d_2)$, the gap
      being the $\sigma\sqrt{T}$ shift between the two exercise probabilities.
    summary: >
      $\Phi(d_2)$ is the chance of exercise under the pricing measure and
      $\Phi(d_1)$ the hedge ratio, so Black–Scholes is "asset received minus
      strike paid, each weighted by exercise".
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.black-scholes
    relates: []
    tags: []

  - id: quant-finance.options.implied-vol
    kind: definition
    prominence: 1
    title: "Implied volatility"
    statement: >
      The Black–Scholes price is strictly increasing in $\sigma$, running from
      the zero-vol bound $(S_0 - Ke^{-rT})^{+}$ up to $S_0$, so
      $\sigma \mapsto C$ is invertible: the implied volatility is the unique
      $\sigma$ at which the formula reproduces the market price, obtained
      numerically by bisection or Newton. It is a quoting convention rather than
      a forecast — the wrong number in the wrong formula that yields the right
      price — and traders quote in vol because it compares across strikes,
      maturities and underlyings as prices do not. Example: $S = K = 100$,
      $r = 0$, $T = 0.25$, market price $5$ gives $\sigma = 25\%$, via the
      at-the-money rule of thumb $C \approx 0.4\,\sigma S\sqrt{T}$ carried in
      the Greeks subbranch.
    summary: >
      The volatility that makes Black–Scholes match the market — a change of
      units for the price, unique because the price is monotone in $\sigma$.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.black-scholes
    relates: []
    tags: []

  - id: quant-finance.options.vol-smile
    kind: proposition
    prominence: 1
    title: "Smile, skew and the implied surface"
    statement: >
      If Black–Scholes were true, one $\sigma$ would price every strike and
      maturity. It does not: implied vol plotted against strike is a smile in FX
      and a downward skew in equity indices, and it moves with maturity, giving
      a whole surface. The shape is the model's confession of error — the
      risk-neutral density backed out of market prices has fatter tails and more
      negative skew than the lognormal, because prices jump, volatility is
      itself random and correlated with spot, and downside insurance carries a
      demand premium. Practical rules: price each strike with its own vol, never
      a flat one, and treat butterfly and risk-reversal quotes as direct reads
      on the implied density.
    summary: >
      One vol cannot price all strikes; the smile is the market pricing fat
      tails and crash risk that the lognormal model leaves out.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.implied-vol
    relates:
      - id: quant-statistics.time-series.vol-clustering
        note: >
          Clustered, mean-reverting realized volatility with fat-tailed returns
          is the statistical counterpart of the smile and of its term structure.
    tags: []

  - id: quant-finance.options.straddle
    kind: definition
    prominence: 1
    title: "Straddles and strangles"
    statement: >
      A long straddle is a call and a put at the same strike and expiry; a long
      strangle uses a lower-strike put and a higher-strike call, so it costs
      less and needs a larger move. Running example: $S = 100$, $r = 0$,
      $\sigma = 25\%$, $T = 3$ months, where the $100$ call and put are each
      worth $5$. The straddle costs $10$, loses all of it if the stock pins
      $100$, breaks even at $90$ and $110$, and profits $|S_T - 100| - 10$. The
      $90/110$ strangle costs $1.3 + 1.7 = 3$, with breakevens $87$ and $113$.
      Buy them when you expect a move larger than the implied one, here about
      $\pm 12.5\%$ over the quarter; sell them to collect premium and carry
      unbounded risk.
    summary: >
      Direction-free bets on the size of the move: the straddle breaks even one
      premium either side of the strike, the strangle costs less and needs more.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.payoff-diagrams
    relates: []
    tags: []

  - id: quant-finance.options.vertical-spreads
    kind: definition
    prominence: 1
    title: "Vertical spreads"
    statement: >
      A vertical spread is long one strike and short another of the same type
      and expiry, capping both cost and payoff. Bull call spread on the running
      example ($S = 100$, $\sigma = 25\%$, $T = 0.25$, $r = 0$): buy the $100$
      call at $5.0$, sell the $110$ call at $1.7$, net debit $3.3$; max loss
      $3.3$ at or below $100$, breakeven $103.3$, max profit
      $10 - 3.3 = 6.7$ at or above $110$. Selling the $110$ put at $11.7$ and
      buying the $100$ put at $5.0$ collects $6.7$ for the same shape shifted by
      a bond, exactly as put–call parity demands. Trade them for a directional
      view with defined risk and far less volatility exposure than an outright
      option.
    summary: >
      Buy one strike, sell another: a capped directional bet whose debit is the
      max loss and whose strike gap minus debit is the max profit.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.payoff-diagrams
    relates: []
    tags: []

  - id: quant-finance.options.butterfly
    kind: definition
    prominence: 0
    title: "Butterfly spreads"
    statement: >
      A long call butterfly is long one $K_1$ call, short two $K_2$ calls and
      long one $K_3$ call with $K_2$ midway — the difference of two vertical
      spreads, paying a tent that peaks at $K_2$. On the running example with
      strikes $90/100/110$: buy the $90$ call at $11.3$, sell two $100$ calls at
      $5.0$, buy the $110$ call at $1.7$, net debit $3.0$. The payoff is $10$ if
      the stock pins $100$, so max profit is $7.0$, breakevens are $93$ and
      $107$, and max loss is the $3.0$ paid. Its price is
      $e^{-rT}\mathbb{E}^{Q}$ of a nonnegative tent, hence positive: a butterfly
      quote reads the implied density near $K_2$, and a negative one is an
      arbitrage in the quoted smile.
    summary: >
      A cheap pin bet on the stock finishing near the middle strike, and the
      cleanest market-quoted probe of the risk-neutral density.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.vertical-spreads
    relates: []
    tags: []

  - id: quant-finance.options.synthetics
    kind: technique
    prominence: 1
    title: "Synthetic positions from parity"
    statement: >
      Read $C - P = S - Ke^{-rT}$ as an identity between positions: any leg is
      built from the other three. Long call plus short put at one strike is
      synthetic long stock financed by borrowing; short call plus long put is
      synthetic short; long stock plus short call equals a short put plus a bond
      (a covered call is a naked short put in disguise); long stock plus long
      put equals a long call plus a bond. Check on the running example with
      $S = 100$, $K = 100$, $r = 0$: $C = P = 5$, and $C - P = 0 = S - K$. Use
      it to express a view through whichever leg is cheapest or most liquid, and
      to spot a mispriced quote in one line.
    summary: >
      Parity lets you assemble any option position from the other legs — the
      reason a covered call and a short put are the same trade.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.payoff-diagrams
      - quant-finance.arbitrage.put-call-parity
    relates:
      - id: quant-finance.arbitrage.synthetics
        note: >
          The same parity rearrangement worked in two directions: there it is
          traded as a riskless package (conversion, reversal, box); here it
          restates a position through whichever legs are cheapest.
    tags: []

  - id: quant-finance.options.options-as-vol-bets
    kind: intuition
    prominence: 1
    title: "Options are bets on volatility"
    statement: >
      An option is a bet on realized volatility against the implied volatility
      you paid. Hedge the direction away and the surviving profit over the life
      of the position is essentially realized variance minus implied variance,
      the accounting the Greeks subbranch does with gamma and theta. Hence the
      trader's vocabulary: you buy and sell vol, not calls and puts; an unhedged
      long call is two bets bundled, on direction and on vol; and a straddle,
      whose two deltas cancel near the money, is the clean expression of the vol
      view alone. The interview form is "the stock will move more than the
      market thinks" — which is a straddle, not a call.
    summary: >
      Strip out direction and an option pays the difference between realized and
      implied volatility, which is why the straddle is the canonical volatility
      trade.
    parent: quant-finance.options
    also_under: []
    requires:
      - quant-finance.options.implied-vol
      - quant-finance.options.straddle
    relates: []
    tags: []
