nodes:
  - id: quant-probability.geometric
    kind: subbranch
    title: "Geometric Probability"
    summary: >
      Probability as area — meeting problems, stick breaking, Buffon's
      needle, and the Bertrand warning about "random".
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.geometric.uniform-point
    kind: definition
    prominence: 1
    title: "Uniform random point in a region"
    statement: >
      Let $S \subseteq \mathbb{R}^{d}$ have finite nonzero measure $|S|$ —
      length, area or volume as the dimension dictates. A point $P$ is uniform
      on $S$ when $\Pr(P \in A) = |A|/|S|$ for every subregion $A \subseteq S$,
      equivalently when its density is the constant $1/|S|$ on $S$ and $0$
      outside. Probability has then become measurement: no integration, only
      geometry. Two consequences to say out loud. Any single point, line or
      curve inside $S$ has probability $0$, so open, closed and half-open
      versions of a region are interchangeable. Only the ratio matters, so the
      answer is unchanged by rescaling $S$ and $A$ together, and is always
      dimensionless.
    summary: >
      Pick a point with no preference for any part of the region: probability
      is the fraction of the region occupied, the continuous reading of
      favourable over total.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.continuous.uniform
      - quant-probability.foundations.classical
    relates: []
    tags: []

  - id: quant-probability.geometric.independent-coordinates
    kind: proposition
    prominence: 0
    title: "Independent uniforms make a uniform point in a box"
    statement: >
      If $X \sim U(a,b)$ and $Y \sim U(c,d)$ are independent then the joint
      density is the constant $1/((b-a)(d-c))$ on the rectangle
      $[a,b] \times [c,d]$, so the pair $(X,Y)$ is a uniform point in that
      rectangle; conversely a uniform point in a rectangle has independent
      uniform coordinates. The same equivalence holds for $n$ independent
      uniforms and a box in $\mathbb{R}^{n}$. It fails off products: a uniform
      point in a disc or a triangle has dependent coordinates, since knowing
      $X$ restricts the range of $Y$. The practical content is the translation
      "$k$ independent uniform times, positions or angles" $\iff$ "one uniform
      point in a $k$-dimensional box".
    summary: >
      Independent uniform coordinates and a uniform point in a box are the same
      object — the licence to redraw a list of random times as a single point
      in a square.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.uniform-point
      - quant-probability.joint.independence-rvs
    relates: []
    tags: []

  - id: quant-probability.geometric.probability-as-area
    kind: technique
    prominence: 2
    title: "Probability as an area ratio"
    statement: >
      The standard attack on "at random" questions with a continuum of
      outcomes. (1) Name the independent uniform quantities the mechanism
      produces — arrival times, break points, angles — one coordinate each.
      (2) Draw the region they fill: a square for two uniform times in $[0,T]$,
      a cube for three, a rectangle in $(x,\theta)$ for a dropped needle.
      (3) Rewrite every condition of the problem as an inequality in those
      coordinates, so the favourable event becomes a subregion bounded by lines
      or simple curves. (4) Report the ratio of measures. Because only the ratio
      counts you may rescale to the unit square. Two habits pay: complement
      first, since corner triangles are easier than the band they exclude, and
      check that the answer is dimensionless.
    summary: >
      Turn the randomness into coordinates, the conditions into a region, and
      the answer into an area ratio — usually by subtracting the easy corners.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.independent-coordinates
    relates: []
    tags: []

  - id: quant-probability.geometric.meeting-problem
    kind: example
    prominence: 2
    title: "The meeting problem"
    statement: >
      Two people each arrive at a uniformly random time within the same hour,
      independently, and each waits $15$ minutes for the other before leaving.
      What is the probability they meet? Let $X, Y \sim U(0,60)$ be the arrival
      times, so the pair is a uniform point in a $60 \times 60$ square, and the
      meeting event is the diagonal band $|X - Y| \le 15$. Take the complement:
      the two corner triangles $Y - X > 15$ and $X - Y > 15$ are right isosceles
      with legs $45$, so together they have area $45^{2} = 2025$ out of $3600$.
      Hence $\Pr(\text{meet}) = 1 - 2025/3600 = 1 - 9/16 = 7/16 = 0.4375$,
      slightly worse than a coin flip.
    summary: >
      Two arrivals in an hour with a 15-minute patience meet with probability
      $7/16$ — a band in a square, computed by subtracting two corners.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.probability-as-area
    relates: []
    tags: []

  - id: quant-probability.geometric.waiting-window-general
    kind: proposition
    prominence: 0
    title: "General waiting window"
    statement: >
      With both arrivals uniform on $[0,T]$ and a common patience $t \le T$, the
      same two corner triangles give
      $\Pr(\text{meet}) = 1 - (1 - t/T)^{2} = 2t/T - (t/T)^{2}$, a function of
      the ratio $t/T$ alone. Solving for an even-money meeting, $(1-t/T)^{2}
      = 1/2$ gives $t/T = 1 - 1/\sqrt{2} \approx 0.293$, so within an hour each
      person must be willing to wait about $17.6$ minutes. If the patiences
      differ — the earlier arrival waits $a$, or $b$ in the other order — the
      corners are unequal and $\Pr(\text{meet}) = 1 - ((T-a)^{2} +
      (T-b)^{2})/(2T^{2})$, which returns $7/16$ at $a = b = 15$, $T = 60$.
    summary: >
      The meeting probability is $1-(1-t/T)^{2}$, depending only on patience as
      a fraction of the window; $29\%$ of the window buys even odds.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.meeting-problem
    relates: []
    tags: []

  - id: quant-probability.geometric.expected-separation
    kind: example
    prominence: 0
    title: "Expected gap between two random arrivals"
    statement: >
      Same square, a different question: how far apart are the two arrivals on
      average? For independent $X, Y \sim U(0,1)$ put $D = |X - Y|$. The event
      $D > t$ is the pair of corner triangles of total area $(1-t)^{2}$, so
      $\Pr(D > t) = (1-t)^{2}$ and $D$ has density $2(1-t)$ on $[0,1]$.
      Integrating the tail, $\mathbb{E}[D] = \int_{0}^{1}(1-t)^{2}\,dt = 1/3$,
      and $\mathbb{E}[D^{2}] = 1/6$ gives $\operatorname{Var}(D) = 1/18$. The
      same square yields $\mathbb{E}[\max(X,Y)] = 2/3$ and
      $\mathbb{E}[\min(X,Y)] = 1/3$, consistent because $\max - \min = D$. On a
      $60$-minute window the mean separation is $20$ minutes.
    summary: >
      Two uniform points on a unit interval sit $1/3$ apart on average, with
      density $2(1-t)$ for the gap — the meeting problem's band, integrated.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.meeting-problem
    relates:
      - id: quant-probability.continuous.uniform-sum
        note: >
          $X - Y$ is the reflected twin of $X + Y$, so the triangle density
          there and the triangular tail $(1-t)^{2}$ here are one computation
          seen from two sides of the same square.
    tags: []

  - id: quant-probability.geometric.stick-triangle
    kind: example
    prominence: 1
    title: "Breaking a stick into a triangle"
    statement: >
      Break a stick of length $1$ at two independent uniform points $X, Y$, and
      let $m = \min(X,Y)$, $M = \max(X,Y)$, so the pieces are $m$, $M-m$ and
      $1-M$. Three lengths summing to $1$ satisfy the triangle inequality
      exactly when no piece exceeds $1/2$. In the unit square that rules out
      three disjoint regions, each of area $1/4$: both breaks in the right half
      (then $m > 1/2$), both in the left half (then $1 - M > 1/2$), and the two
      corner triangles $|X - Y| > 1/2$ (then $M - m > 1/2$). Failure has
      probability $3/4$, so the pieces form a triangle with probability
      $1/4$. Note that the same answer covers the degenerate cases, which have
      probability $0$.
    summary: >
      Two uniform breaks give a triangle with probability exactly $1/4$: no
      piece may exceed half, which kills three quarters of the square.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.probability-as-area
    relates: []
    tags: []

  - id: quant-probability.geometric.stick-piece-lengths
    kind: proposition
    prominence: 1
    title: "Lengths of the broken pieces"
    statement: >
      Two uniform breaks on $[0,1]$ leave three spacings that are exchangeable
      and sum to $1$, so each has mean $1/3$ however dependent they are. Sorted,
      they are far from equal: $\mathbb{E}[\text{shortest}] = 1/9$,
      $\mathbb{E}[\text{middle}] = 5/18$ and
      $\mathbb{E}[\text{longest}] = 11/18 \approx 0.611$, so the biggest piece
      is nearly two thirds of the stick on average. For $n$ breaks the $n+1$
      spacings each average $1/(n+1)$, the shortest averages $1/(n+1)^{2}$ and
      the longest averages $H_{n+1}/(n+1)$; at $n = 2$ this is
      $(1 + 1/2 + 1/3)/3 = 11/18$. A single break gives two pieces averaging
      $1/2$, the longer of them $3/4$.
    summary: >
      Every piece averages $1/3$ by symmetry, yet the longest averages $11/18$
      and the shortest only $1/9$ — random partitions are lopsided.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.stick-triangle
    relates:
      - id: quant-probability.expectation.symmetry-expectation
        note: >
          The three spacings are exchangeable pieces of a known total, exactly
          the move that splits a deck's non-aces evenly across the gaps, so
          each mean is $1/3$ with no integration.
    tags: []

  - id: quant-probability.geometric.stick-sequential-break
    kind: example
    prominence: 0
    title: "Breaking the stick in two stages"
    statement: >
      Same stick, a different mechanism, a different answer. Break once at
      $X \sim U(0,1)$, then break one of the two pieces uniformly along its own
      length. If you always break the left piece, a triangle needs $X > 1/2$ and
      the second break inside the window $(X - 1/2, 1/2)$, of length $1-X$
      within a piece of length $X$; the conditional probability is $(1-X)/X$, so
      $\Pr = \int_{1/2}^{1}(1-x)/x\,dx = \ln 2 - 1/2 \approx 0.193$. If instead
      you always break the longer piece, its length $L = \max(X, 1-X)$ has
      density $2$ on $(1/2,1)$ and
      $\Pr = \int_{1/2}^{1} 2(1-\ell)/\ell\,d\ell = 2\ln 2 - 1 \approx 0.386$.
      Neither equals the $1/4$ of two simultaneous breaks.
    summary: >
      Breaking sequentially gives $\ln 2 - 1/2 \approx 0.193$ or
      $2\ln 2 - 1 \approx 0.386$, not $1/4$ — the procedure, not the words,
      fixes the answer.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.stick-triangle
    relates: []
    tags: []

  - id: quant-probability.geometric.buffon
    kind: example
    prominence: 1
    title: "Buffon's needle"
    statement: >
      Drop a needle of length $\ell$ on a floor ruled with parallel lines a
      distance $d \ge \ell$ apart. Two coordinates describe the landing: the
      distance $x$ from the needle's centre to the nearest line, uniform on
      $[0, d/2]$, and the acute angle $\theta$ the needle makes with the lines,
      uniform on $[0, \pi/2]$ and independent of $x$. The needle crosses a line
      exactly when $x \le (\ell/2)\sin\theta$. The favourable area is
      $\int_{0}^{\pi/2} (\ell/2)\sin\theta\,d\theta = \ell/2$ against a total
      area $(\pi/2)(d/2) = \pi d/4$, so $\Pr(\text{cross}) = 2\ell/(\pi d)$.
      With a needle as long as the gap, $\ell = d$, the answer is
      $2/\pi \approx 0.6366$.
    summary: >
      A needle of length $\ell$ crosses one of the lines spaced $d$ apart with
      probability $2\ell/(\pi d)$, which is $2/\pi \approx 0.637$ when
      $\ell = d$.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.probability-as-area
    relates: []
    tags: []

  - id: quant-probability.geometric.buffon-noodle
    kind: proposition
    prominence: 0
    title: "Buffon's noodle: only length matters"
    statement: >
      Replace the needle by any rigid plane curve of length $\ell$ dropped in a
      uniformly random position and orientation on the same ruled floor. The
      expected number of crossings is $2\ell/(\pi d)$ whatever the shape, and
      with no restriction $\ell \le d$. Reason: approximate the curve by short
      segments, whose crossing counts add, and expectation is additive whether
      or not the pieces are independent, so only total length survives the sum.
      When $\ell \le d$ a straight needle can cross at most once, so its
      expected count is a probability and Buffon's formula follows. Check: a
      circle of diameter $d$ has length $\pi d$ and always crosses exactly
      twice, matching $2(\pi d)/(\pi d) = 2$.
    summary: >
      Expected crossings depend only on the curve's length, not its shape —
      the circle of diameter $d$, crossing twice always, pins the constant.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.buffon
    relates:
      - id: quant-probability.expectation.linearity
        note: >
          Cutting the noodle into segments and adding their expected crossings
          is linearity of expectation applied to badly dependent pieces, which
          is precisely why dependence never enters the argument.
    tags: []

  - id: quant-probability.geometric.uniform-in-disc
    kind: proposition
    prominence: 1
    title: "Uniform point in a disc"
    statement: >
      Let $P$ be uniform on the disc of radius $R$ and let $D = |P|$ be its
      distance from the centre. Then $\Pr(D \le r) = \pi r^{2}/(\pi R^{2})
      = r^{2}/R^{2}$, so $D$ has density $2r/R^{2}$: larger radii are more
      likely because there is more circumference out there. Hence
      $\mathbb{E}[D] = 2R/3$ and the median is $R/\sqrt{2} \approx 0.707R$ —
      half the mass lies in the outer ring. The angle is uniform on
      $[0,2\pi)$ and independent of $D$. The standard sampling bug is to draw
      $r \sim U(0,R)$, which crowds points near the centre; the fix is
      $r = R\sqrt{U}$, or rejection sampling from the enclosing square.
    summary: >
      Radius is not uniform — its density is $2r/R^{2}$, mean $2R/3$, median
      $0.707R$ — which is why "pick a random radius" is a different experiment.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.probability-as-area
    relates: []
    tags: []

  - id: quant-probability.geometric.bertrand-paradox
    kind: example
    prominence: 2
    title: "Bertrand's chord paradox"
    statement: >
      "Draw a chord of a circle of radius $R$ at random: what is the chance it
      is longer than the side $R\sqrt{3}$ of the inscribed equilateral
      triangle?" Three mechanisms give three answers. (1) Random endpoints: fix
      one endpoint, take the other uniform on the circle; the chord is long
      exactly when the second endpoint lands in the opposite $120^{\circ}$ arc,
      probability $1/3$. (2) Random radius: pick a radius, a uniform point along
      it, and the chord perpendicular there; long exactly when that point is
      within $R/2$ of the centre, probability $1/2$. (3) Random midpoint,
      uniform in the disc: long exactly when the midpoint lies in the
      concentric disc of radius $R/2$, probability $(1/2)^{2} = 1/4$. All three
      are correct.
    summary: >
      The same words give $1/3$, $1/2$ or $1/4$ depending on how the chord is
      drawn — "at random" is not a specification of a distribution.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.uniform-in-disc
    relates:
      - id: quant-probability.foundations.classical
        note: >
          Bertrand is the continuous form of the classical model's fine print:
          favourable over total is only defined once you fix which list of
          outcomes is being called equally likely.
    tags: []

  - id: quant-probability.geometric.specify-the-mechanism
    kind: intuition
    prominence: 1
    title: "Uniform in what?"
    statement: >
      In a continuous problem "uniformly at random" carries no information
      until you name the variable it is uniform in. Bertrand's chord admits
      three defensible parameterizations and three answers; the broken stick
      returns $1/4$, $2\ln 2 - 1$ or $\ln 2 - 1/2$ depending on how the second
      break is made. The cause is that a nonlinear change of parameter destroys
      uniformity — uniform in the midpoint is not uniform in the endpoint angle.
      Interview craft: state the mechanism you are assuming out loud before you
      compute, and if the question is genuinely ambiguous, say so and price the
      version you chose. A physical procedure — drop, spin, throw — is what
      fixes the measure, which is why Buffon has one answer.
    summary: >
      Name the sampling mechanism before computing: reparameterizing changes
      what "uniform" means, and with it the answer.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.bertrand-paradox
      - quant-probability.geometric.stick-sequential-break
    relates: []
    tags: []

  - id: quant-probability.geometric.semicircle
    kind: example
    prominence: 1
    title: "n points on a semicircle"
    statement: >
      Place $n$ points independently and uniformly on a circle: what is the
      probability that all of them lie within some semicircle? For each $i$ let
      $A_i$ be the event that the other $n-1$ points all lie in the semicircle
      that starts at point $i$ and runs clockwise, which has probability
      $(1/2)^{n-1}$. If a covering semicircle exists, its clockwise-most point
      is the unique anchor, so the $A_i$ are disjoint and their union is the
      event in question. Adding them, $\Pr = n/2^{n-1}$. Worked: $n = 2$ gives
      $1$, $n = 3$ gives $3/4$, $n = 4$ gives $1/2$, and $n = 10$ gives
      $10/512 \approx 0.0195$. Coincident points have probability $0$, so the
      anchor is well defined.
    summary: >
      All $n$ uniform points fall in one semicircle with probability
      $n/2^{n-1}$ — $3/4$ for three points, and vanishingly rare beyond ten.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.probability-as-area
    relates: []
    tags: []

  - id: quant-probability.geometric.triangle-contains-centre
    kind: corollary
    prominence: 1
    title: "Does the random triangle contain the centre?"
    statement: >
      Three points uniform and independent on a circle form a triangle. The
      triangle contains the centre exactly when the three points do not all lie
      in a semicircle, so the probability is $1 - 3/2^{2} = 1 - 3/4 = 1/4$. The
      general version follows the same way: the convex hull of $n$ uniform
      points on the circle contains the centre with probability
      $1 - n/2^{n-1}$, already about $0.98$ at $n = 10$. The nearby question
      about points inside a disc rather than on a circle is much harder and
      worth only quoting: four uniform points in a disc are in convex position
      with probability $1 - 35/(12\pi^{2}) \approx 0.7045$, Sylvester's
      four-point problem.
    summary: >
      A random inscribed triangle contains the centre with probability $1/4$ —
      the semicircle count read as its complement.
    parent: quant-probability.geometric
    also_under: []
    requires:
      - quant-probability.geometric.semicircle
    relates: []
    tags: []
