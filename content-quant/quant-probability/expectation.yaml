# quant-probability.expectation — Expectation & Variance
# Outline node (08 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-probability.expectation
    kind: subbranch
    title: "Expectation & Variance"
    summary: >
      Linearity, LOTUS, tail sums and the indicator trick — the
      workhorse techniques that crack most interview expectations
      without integration.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.expectation.expectation
    kind: definition
    prominence: 2
    title: "Expectation"
    statement: >
      For a discrete $X$ with pmf $p$, $\mathbb{E}[X] = \sum_x x\,p(x)$; for a
      continuous $X$ with density $f$,
      $\mathbb{E}[X] = \int_{-\infty}^{\infty} x f(x)\,dx$. In both cases the
      mean is declared to exist only when the sum or integral converges
      absolutely, that is $\mathbb{E}|X| < \infty$; for $X \ge 0$ it always
      exists as a value in $[0,\infty]$. Basic facts:
      $\mathbb{E}[c] = c$ for a constant, and $\mathbb{E}[X]$ carries the units
      of $X$. Reading: the long-run average of $X$ over independent repetitions,
      hence the fair price of a game paying $X$ once.
    summary: >
      The probability-weighted average value of a random variable — the number
      you would break even paying for one play of the game.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.random-variables.pmf
      - quant-probability.random-variables.pdf
    relates: []
    tags: []

  - id: quant-probability.expectation.nonexistence
    kind: proposition
    prominence: 0
    title: "When the mean fails to exist"
    statement: >
      Split $X$ into positive and negative parts. Three regimes: if
      $\mathbb{E}|X| < \infty$ the mean is a finite number; if $X \ge 0$ and the
      sum diverges the mean is $+\infty$, which is a legitimate answer; if both
      parts have infinite mean the expectation is undefined, not infinite,
      because $\infty - \infty$ has no value. The standard undefined case is the
      density $f(x) = 1/(\pi(1+x^{2}))$, whose sample averages never settle.
      Absolute convergence is demanded because a conditionally convergent sum can
      be rearranged to any value, and the order of the outcomes is not part of
      the data. Rule of thumb: a tail as heavy as
      $\Pr(|X| > t) \approx c/t$ kills the mean.
    summary: >
      Absolute convergence is the price of admission: nonnegative variables may
      have mean $+\infty$, and two-sided heavy tails leave the mean undefined.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.expectation
    relates: []
    tags: []

  - id: quant-probability.expectation.monotonicity
    kind: proposition
    prominence: 0
    title: "Monotonicity and the range bound"
    statement: >
      Suppose the means below exist. If $X \le Y$ with probability $1$ then
      $\mathbb{E}[X] \le \mathbb{E}[Y]$; in particular $X \ge 0$ forces
      $\mathbb{E}[X] \ge 0$, with equality only if $X = 0$ with probability $1$.
      Consequently $a \le X \le b$ implies $a \le \mathbb{E}[X] \le b$, and
      $|\mathbb{E}[X]| \le \mathbb{E}|X|$. Interview use: these are the cheapest
      sanity checks available — an answer of $7.2$ for the expected value of one
      fair die is wrong on sight, and a hard quantity can be bounded by replacing
      it with a simpler variable that dominates it.
    summary: >
      Expectation preserves inequalities, so a variable confined to an interval
      has its mean in that interval — the fastest way to catch a wrong answer.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.expectation
    relates: []
    tags: []

  - id: quant-probability.expectation.lotus
    kind: theorem
    prominence: 1
    title: "LOTUS (law of the unconscious statistician)"
    statement: >
      Let $g$ be a real function with $\mathbb{E}|g(X)| < \infty$. Then
      $\mathbb{E}[g(X)] = \sum_x g(x)\,p(x)$ in the discrete case and
      $\mathbb{E}[g(X)] = \int_{-\infty}^{\infty} g(x) f(x)\,dx$ in the
      continuous case — the law of $Y = g(X)$ is never needed. The two-variable
      form is $\mathbb{E}[g(X,Y)] = \sum_x \sum_y g(x,y)\,p(x,y)$. Worked: for a
      fair die, $\mathbb{E}[X^{2}] = (1+4+9+16+25+36)/6 = 91/6 \approx 15.17$,
      whereas $(\mathbb{E}[X])^{2} = 12.25$. The gap is the standing warning that
      $\mathbb{E}[g(X)] \ne g(\mathbb{E}[X])$ for nonlinear $g$.
    summary: >
      Average $g(x)$ against the law of $X$ instead of hunting for the
      distribution of $g(X)$ — and never slide $g$ through the expectation.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.expectation
    relates: []
    tags: []

  - id: quant-probability.expectation.linearity
    kind: theorem
    prominence: 2
    title: "Linearity of expectation"
    statement: >
      If $X_1,\dots,X_n$ live on the same probability space and each has a finite
      mean, then for any constants $a_1,\dots,a_n,b$,
      $\mathbb{E}[a_1 X_1 + \dots + a_n X_n + b]
      = a_1\mathbb{E}[X_1] + \dots + a_n\mathbb{E}[X_n] + b$. No independence and
      no common distribution is required: the $X_i$ may be as dependent as you
      like. This is the most-used fact in probability interviews — rewrite the
      target as a sum of pieces whose individual means are obvious, and ignore
      how tangled the pieces are. Two dice give
      $\mathbb{E}[\text{sum}] = 3.5 + 3.5 = 7$. It does not extend to products or
      to nonlinear functions.
    summary: >
      The mean of a sum is the sum of the means, dependence or not — decompose
      first, and never worry about how the parts interact.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.expectation
    relates: []
    tags: []

  - id: quant-probability.expectation.indicator-expectation
    kind: proposition
    prominence: 1
    title: "Expectation of an indicator is a probability"
    statement: >
      For an event $A$, the indicator $\mathbf{1}\{A\}$ satisfies
      $\mathbb{E}[\mathbf{1}\{A\}] = 1 \cdot \Pr(A) + 0 \cdot (1 - \Pr(A))
      = \Pr(A)$. Because $\mathbf{1}\{A\}^{2} = \mathbf{1}\{A\}$, its second
      moment is also $\Pr(A)$ and its variance is $\Pr(A)(1 - \Pr(A))$, maximal
      at $\Pr(A) = 1/2$. Products of indicators are indicators of intersections,
      so $\mathbb{E}[\mathbf{1}\{A\}\mathbf{1}\{B\}] = \Pr(A \cap B)$. This one
      line is the bridge between the two languages: every probability is an
      expectation, and every count is a sum of indicators.
    summary: >
      $\mathbb{E}[\mathbf{1}\{A\}] = \Pr(A)$ — the identity that lets
      expectation machinery compute probabilities and vice versa.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.expectation
      - quant-probability.random-variables.indicator
    relates: []
    tags: []

  - id: quant-probability.expectation.indicator-trick
    kind: technique
    prominence: 2
    title: "Indicator trick for expected counts"
    statement: >
      Reach for this whenever the question is "expected number of ...". Steps:
      (1) name the events $A_1,\dots,A_n$ being counted and write
      $N = \sum_{i=1}^{n} \mathbf{1}\{A_i\}$; (2) apply linearity to get
      $\mathbb{E}[N] = \sum_{i=1}^{n} \Pr(A_i)$; (3) evaluate each $\Pr(A_i)$,
      usually by symmetry, so that all terms are equal and
      $\mathbb{E}[N] = n\Pr(A_1)$. Dependence between the $A_i$ never enters.
      Worked: in $100$ fair tosses the expected number of adjacent $HH$ pairs is
      $99 \cdot 1/4 = 24.75$, even though overlapping pairs are dependent and the
      exact law of $N$ is unpleasant.
    summary: >
      Turn a complicated count into a sum of indicators and add up their
      probabilities — the workhorse that makes dependence irrelevant.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.linearity
      - quant-probability.expectation.indicator-expectation
    relates: []
    tags: []

  - id: quant-probability.expectation.fixed-points
    kind: example
    prominence: 1
    title: "Expected fixed points of a random permutation"
    statement: >
      Hats are returned to $n$ people uniformly at random: how many people get
      their own hat? With $A_i = \{\sigma(i) = i\}$ we have $\Pr(A_i) = 1/n$, so
      the number of matches $N$ has $\mathbb{E}[N] = n \cdot (1/n) = 1$ — one
      match on average, for every $n$. For $n \ge 2$ the second moment follows
      the same way: there are $n(n-1)$ ordered pairs $i \ne j$, each with
      $\Pr(A_i \cap A_j) = 1/(n(n-1))$, so $\mathbb{E}[N(N-1)] = 1$, giving
      $\mathbb{E}[N^{2}] = 2$ and $\operatorname{Var}(N) = 2 - 1 = 1$. For large
      $n$ the count is approximately Poisson with mean $1$.
    summary: >
      Exactly one person gets their own hat back on average, whether the party
      has 3 guests or 3 million — mean and variance are both $1$.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.indicator-trick
    relates:
      - id: quant-probability.counting.derangements
        note: >
          Same experiment counted two ways: derangements give the exact chance of
          zero matches, tending to $1/e$, while the mean number of matches stays
          pinned at $1$.
    tags: []

  - id: quant-probability.expectation.birthday-pairs
    kind: example
    prominence: 0
    title: "Expected number of birthday-sharing pairs"
    statement: >
      In a room of $n = 23$ people with $365$ equally likely birthdays and no
      twins, how many pairs share a birthday on average? One indicator per pair:
      there are $\binom{23}{2} = 253$ pairs, each matching with probability
      $1/365$, so the expected number of sharing pairs is
      $253/365 \approx 0.693$. This is not the probability of at least one
      shared birthday, which is about $0.507$; the two agree only loosely,
      through the Poisson heuristic
      $\Pr(\text{at least one}) \approx 1 - e^{-0.693} = 0.5$. Confusing an
      expected count with a probability is the classic error here.
    summary: >
      About $0.69$ matching pairs are expected among 23 people — close to, but
      conceptually distinct from, the famous $50\%$ collision probability.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.indicator-trick
    relates:
      - id: quant-probability.counting.birthday-problem
        note: >
          The expected number of colliding pairs is the quick estimate whose
          exponential form reproduces the exact collision probability computed
          there.
    tags: []

  - id: quant-probability.expectation.records
    kind: example
    prominence: 0
    title: "Expected number of records in a random order"
    statement: >
      Present $n$ distinct values in uniformly random order; call the $i$-th
      value a record if it exceeds all values before it. The $i$-th value is a
      record exactly when it is the largest of the first $i$, which by symmetry
      has probability $1/i$. Summing the indicators gives
      $\mathbb{E}[\text{records}] = \sum_{i=1}^{n} 1/i = H_n \approx \ln n +
      \gamma$. For $n = 10$ this is $H_{10} \approx 2.929$; for $n = 100$ it is
      about $5.19$. Records are therefore logarithmically rare — doubling the
      data adds only $\ln 2 \approx 0.69$ more of them.
    summary: >
      Running maxima appear about $\ln n$ times in a random sequence: 2.9 records
      in 10 values, 5.2 in 100.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.indicator-trick
      - quant-tools.series-calculus.harmonic-numbers
    relates: []
    tags: []

  - id: quant-probability.expectation.tail-sum
    kind: proposition
    prominence: 1
    title: "Tail-sum formula"
    statement: >
      If $X$ takes values in $\{0,1,2,\dots\}$ then
      $\mathbb{E}[X] = \sum_{k=1}^{\infty} \Pr(X \ge k)
      = \sum_{k=0}^{\infty} \Pr(X > k)$. If $X \ge 0$ is continuous then
      $\mathbb{E}[X] = \int_{0}^{\infty} \Pr(X > t)\,dt$, the area under the
      survival curve. Proof: write $X = \sum_{k \ge 1} \mathbf{1}\{X \ge k\}$ and
      take expectations term by term. A general $X$ obeys
      $\mathbb{E}[X] = \int_{0}^{\infty}\Pr(X > t)\,dt
      - \int_{-\infty}^{0}\Pr(X \le t)\,dt$, and the second moment is
      $\mathbb{E}[X^{2}] = \int_{0}^{\infty} 2t\,\Pr(|X| > t)\,dt$. Reach for it
      when tail probabilities beat the pmf — maxima and waiting times.
    summary: >
      Integrate the survival function instead of the density: expectation is the
      total area of the tails, which is often the only tractable route.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.indicator-trick
    relates: []
    tags: []

  - id: quant-probability.expectation.max-of-dice
    kind: example
    prominence: 0
    title: "Expected maximum of two dice"
    statement: >
      Roll two independent fair dice and let $M$ be the larger value. Its tail is
      easy: $\Pr(M \le k) = (k/6)^{2}$, so
      $\Pr(M \ge k) = 1 - ((k-1)/6)^{2}$. Summing over $k = 1,\dots,6$,
      $\mathbb{E}[M] = 6 - (0+1+4+9+16+25)/36 = 6 - 55/36 = 161/36 \approx 4.47$.
      The same computation for the minimum $m$ gives
      $\Pr(m \ge k) = ((7-k)/6)^{2}$ and $\mathbb{E}[m] = 91/36 \approx 2.53$.
      Check the pair against linearity: $M + m$ is the sum of the two dice, and
      indeed $161/36 + 91/36 = 252/36 = 7$.
    summary: >
      The bigger of two dice averages $161/36 \approx 4.47$ — a tail sum in five
      lines, with $\mathbb{E}[M] + \mathbb{E}[m] = 7$ as the check.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.tail-sum
    relates:
      - id: quant-probability.random-variables.min-max
        note: >
          That node supplies the CDFs of the extremes of independent variables;
          the tail sum is what converts such a CDF straight into a mean.
    tags: []

  - id: quant-probability.expectation.variance
    kind: definition
    prominence: 2
    title: "Variance"
    statement: >
      For $X$ with $\mathbb{E}[X^{2}] < \infty$ and mean $\mu$,
      $\operatorname{Var}(X) = \mathbb{E}[(X-\mu)^{2}]
      = \mathbb{E}[X^{2}] - \mu^{2}$, the second form being the one you actually
      compute. It is always $\ge 0$, and equals $0$ exactly when $X$ is constant
      with probability $1$. Affine maps: $\operatorname{Var}(aX+b)
      = a^{2}\operatorname{Var}(X)$ — a shift moves the mean but not the spread,
      a rescale squares. Worked, for one fair die:
      $91/6 - 49/4 = 35/12 \approx 2.917$. Variances of independent summands add;
      the general accounting with cross-terms needs covariance.
    summary: >
      The mean squared deviation from the mean, computed as
      $\mathbb{E}[X^{2}] - (\mathbb{E}[X])^{2}$, scaling like $a^{2}$ and blind
      to shifts.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.lotus
      - quant-probability.expectation.linearity
    relates: []
    tags: []

  - id: quant-probability.expectation.standard-deviation
    kind: definition
    prominence: 1
    title: "Standard deviation"
    statement: >
      $\sigma_X = \sqrt{\operatorname{Var}(X)}$ carries the units of $X$, with
      $\sigma_{aX+b} = |a|\,\sigma_X$. For one fair die
      $\sigma = \sqrt{35/12} \approx 1.71$. Standard deviations do not add: for
      $n$ independent copies the sum has spread $\sigma\sqrt{n}$, so the average
      has spread $\sigma/\sqrt{n}$ — the square-root law behind every
      sample-size estimate. The coefficient of variation $\sigma/\mu$ compares
      spreads across scales. Note $\mathbb{E}|X - \mu| \le \sigma$ always; the
      die's mean absolute deviation is $1.5$, below its $1.71$.
    summary: >
      Spread reported in the variable's own units — additive only in quadrature,
      which is why averaging $n$ observations tightens things by $\sqrt{n}$.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.expectation.moments
    kind: definition
    prominence: 0
    title: "Moments"
    statement: >
      The $k$-th raw moment is $m_k = \mathbb{E}[X^{k}]$ and the $k$-th central
      moment is $\mathbb{E}[(X-\mu)^{k}]$, both evaluated by LOTUS. The first raw
      moment is the mean and the second central moment is the variance;
      normalizing the next two gives skewness
      $\mathbb{E}[(X-\mu)^{3}]/\sigma^{3}$, whose sign marks the longer tail, and
      kurtosis $\mathbb{E}[(X-\mu)^{4}]/\sigma^{4}$, which is $3$ for a normal
      law. Existence is nested: $\mathbb{E}|X|^{k} < \infty$ forces all lower
      moments finite. A power-law tail $\Pr(X > t) = t^{-\alpha}$ has finite
      moments exactly for $k < \alpha$, so a variable can own a mean and no
      variance.
    summary: >
      Higher averages of powers — mean, variance, skew and kurtosis — with the
      warning that heavy tails cut the list of existing moments short.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.expectation.squared-error-scale
    kind: intuition
    prominence: 0
    title: "Why squared error is the natural scale"
    statement: >
      Squaring is not an arbitrary choice of penalty. The variance is exactly the
      error of the best constant forecast of $X$, squares keep the algebra linear
      (independent contributions add, and uncorrelated variables behave like
      perpendicular vectors), and $x^{2}$ is differentiable at $0$ where $|x|$ is
      not, so optimizing under it has closed forms. The costs are real: a point
      ten deviations out weighs a hundred times a one-deviation point, and the
      answer comes back in squared units, which is why the number you quote is
      $\sigma$. If your actual loss is absolute, target the median instead.
    summary: >
      Squared error buys additivity and differentiability at the price of
      outlier sensitivity and awkward units.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.expectation.mean-median-loss
    kind: proposition
    prominence: 1
    title: "Mean minimizes L2 loss, median minimizes L1"
    statement: >
      Let $X$ have finite variance. For any constant $c$,
      $\mathbb{E}[(X-c)^{2}] = \operatorname{Var}(X) + (\mu - c)^{2}$, so the
      unique minimizer of squared error is $c = \mu = \mathbb{E}[X]$ and the
      minimum value is $\operatorname{Var}(X)$. Under absolute loss the picture
      changes: assuming only $\mathbb{E}|X| < \infty$, every median $m$ minimizes
      $\mathbb{E}|X - c|$, and the minimizer is unique when the median is.
      Interview reading: "your best guess" is undefined until the scoring rule is
      fixed — squared error asks for the mean, absolute error for the median. On
      a lottery-shaped payoff the two differ enormously.
    summary: >
      Which centre is "best" depends on the penalty: squared error picks the
      mean, absolute error picks the median.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.variance
      - quant-probability.random-variables.quantiles
    relates: []
    tags: []

  - id: quant-probability.expectation.symmetry-expectation
    kind: technique
    prominence: 1
    title: "Symmetry arguments for expectations"
    statement: >
      Two moves, both of which answer before any algebra starts. First, if
      $X_1,\dots,X_n$ are exchangeable and their sum is a known total $T$, then
      linearity forces $\mathbb{E}[X_i] = \mathbb{E}[T]/n$ for each $i$: the $48$
      non-aces of a deck fall into $5$ exchangeable gaps around the aces, so each
      gap averages $48/5 = 9.6$ cards. Second, if $c - X$ has the same law as $X$
      and the mean exists, then $\mathbb{E}[X] = c/2$: the sum of two dice is
      symmetric about $7$, so its mean is $7$. Look for the symmetry before
      setting up any sum.
    summary: >
      Exchangeable pieces of a known total split it evenly, and a law symmetric
      about $c/2$ has that mean — both give the answer with no computation.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.linearity
    relates: []
    tags: []

  - id: quant-probability.expectation.first-ace
    kind: example
    prominence: 1
    title: "Expected position of the first ace"
    statement: >
      Shuffle a standard $52$-card deck: at what position, on average, does the
      first ace appear? Take one indicator per non-ace. A given non-ace precedes
      all four aces exactly when it comes first among those $5$ cards, whose
      relative order is uniform, so that has probability $1/5$. Hence the
      expected number of cards before the first ace is $48/5 = 9.6$, and the
      expected position of the first ace is $9.6 + 1 = 10.6$. By the mirror
      argument the last ace sits at $53 - 10.6 = 42.4$ on average, and each gap
      between consecutive aces averages $9.6$ cards.
    summary: >
      The first ace turns up at position $10.6$ on average — five equal gaps of
      $9.6$ non-aces, plus the ace itself.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.symmetry-expectation
      - quant-probability.expectation.indicator-trick
    relates:
      - id: quant-probability.conditional.symmetry-exchangeability
        note: >
          The same exchangeability that makes the second card an ace with
          probability $4/52$ is what makes the five inter-ace gaps identically
          distributed here.
    tags: []

  - id: quant-probability.expectation.st-petersburg
    kind: example
    prominence: 0
    title: "St. Petersburg paradox"
    statement: >
      A fair coin is tossed until the first head; if it lands on toss $n$ the
      payoff is $2^{n}$. What should you pay? Each term contributes
      $2^{-n} \cdot 2^{n} = 1$, so the expected payoff is
      $\sum_{n \ge 1} 1 = \infty$, yet nobody bids more than about $20$. The
      resolution is that the mean is carried entirely by outcomes that will never
      occur: cap the payoff at $2^{20}$, roughly a million, and the value drops
      to $\sum_{n=1}^{20} 1 + 2^{20} \cdot 2^{-20} = 21$. Infinite expectation
      does not mean infinite price — bankroll limits and concave utility both
      truncate it.
    summary: >
      An infinite expected payoff worth about $21$ in practice: the mean lives in
      the tail, and any cap on the bank collapses it.
    parent: quant-probability.expectation
    also_under: []
    requires:
      - quant-probability.expectation.nonexistence
    relates: []
    tags: []
