# quant-probability.random-variables — Random Variables
# Outline node (07 in content-quant/outline.md's authoring order).
# Expectation is deliberately absent: it is defined in quant-probability.expectation (08).

nodes:
  - id: quant-probability.random-variables
    kind: subbranch
    title: "Random Variables"
    summary: >
      The machinery of distributions — CDF/PMF/PDF, quantiles,
      transformations, indicators, and order statistics.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.random-variables.rv
    kind: definition
    prominence: 1
    title: "Random variable"
    statement: >
      A random variable is a function $X : \Omega \to \mathbb{R}$ attaching a
      number to each outcome of an experiment, subject to the requirement that
      $\{X \le t\}$ is an event for every real $t$, so that $\Pr(X \le t)$ is
      defined. The shorthand $\{X \le t\}$ abbreviates
      $\{\omega \in \Omega : X(\omega) \le t\}$, and every probability statement
      about $X$ is really a statement about such events. The distribution (or
      law) of $X$ is the induced assignment $B \mapsto \Pr(X \in B)$. Interview
      reading: once the law is written down the underlying $\Omega$ can be
      thrown away — two variables built from utterly different experiments are
      interchangeable the moment their laws agree.
    summary: >
      A numerical readout of a random outcome; everything you can ask about it
      is the probability of an event $\{X \in B\}$.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.foundations.axioms
    relates: []
    tags: []

  - id: quant-probability.random-variables.cdf
    kind: definition
    prominence: 2
    title: "Cumulative distribution function"
    statement: >
      The CDF of $X$ is $F(t) = \Pr(X \le t)$, defined for every real $t$. It is
      non-decreasing, right-continuous, and satisfies $F(t) \to 0$ as
      $t \to -\infty$ and $F(t) \to 1$ as $t \to \infty$; conversely any function
      with those three properties is the CDF of some random variable. It pins
      down the whole law: $\Pr(a < X \le b) = F(b) - F(a)$, and the jump
      $F(t) - F(t^{-})$ equals the atom $\Pr(X = t)$, so $F$ is continuous at $t$
      exactly when $\Pr(X = t) = 0$. The survival function
      $S(t) = 1 - F(t) = \Pr(X > t)$ is the same information read from the right,
      and is the better handle for maxima, waiting times and tail questions.
    summary: >
      $\Pr(X \le t)$ as a function of $t$ — the one description every random
      variable has, with jumps marking atoms and $1 - F$ giving the tail.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.rv
    relates: []
    tags: []

  - id: quant-probability.random-variables.equality-in-distribution
    kind: definition
    prominence: 0
    title: "Equality in distribution"
    statement: >
      Write $X \sim Y$ when $F_X = F_Y$ everywhere, equivalently when
      $\Pr(X \in B) = \Pr(Y \in B)$ for every set $B$. This is far weaker than
      $X = Y$: if $X$ is symmetric about $0$ then $X \sim -X$, although the two
      disagree at every outcome with $X \ne 0$, and the variables need not even
      live on the same probability space. Used forwards it is a workhorse —
      exhibit a relabelling of the experiment that preserves probabilities and
      carries $X$ to $Y$, and every distributional answer transfers for free.
      Used carelessly it is a trap: $X \sim Y$ says nothing about how the two
      move together, so it cannot be applied inside a sum or a difference.
    summary: >
      Same distribution is not the same variable — a probability-preserving
      relabelling transfers every distributional answer, but tells you nothing
      about joint behaviour.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.cdf
    relates:
      - id: quant-probability.conditional.symmetry-exchangeability
        note: >
          Exchangeability is equality in distribution applied to positions:
          permuting the order of a shuffled deck leaves the law unchanged, which
          is exactly why the second card is an ace with probability $4/52$.
    tags: []

  - id: quant-probability.random-variables.discrete-vs-continuous
    kind: definition
    prominence: 1
    title: "Discrete, continuous and mixed variables"
    statement: >
      Variables are classified by the shape of $F$. $X$ is discrete when $F$ is a
      step function whose jumps sit on a countable set carrying total probability
      $1$. $X$ is continuous when $F$ is continuous, so that no single value has
      positive probability; in every case met in practice $F$ is then also the
      integral of a density. $X$ is mixed when $F$ has both jumps and stretches
      of continuous growth, which is what any capped or floored payoff produces.
      Continuity of $F$ alone does not manufacture a density — the Cantor
      distribution is continuous with no density — but that pathology never
      surfaces in an interview.
    summary: >
      Discrete laws jump, continuous laws climb smoothly, and capped payoffs do
      both; the CDF is what tells the three apart.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.cdf
    relates: []
    tags: []

  - id: quant-probability.random-variables.pmf
    kind: definition
    prominence: 1
    title: "Probability mass function"
    statement: >
      For a discrete $X$ with values in a countable set $S$, the probability mass
      function is $p(x) = \Pr(X = x)$, satisfying $p(x) \ge 0$ and
      $\sum_{x \in S} p(x) = 1$. It carries the entire law:
      $\Pr(X \in B) = \sum_{x \in B} p(x)$, and $F(t) = \sum_{x \le t} p(x)$ is a
      staircase rising by $p(x)$ at each $x \in S$; inverting,
      $p(x) = F(x) - F(x^{-})$. A fair die has $p(x) = 1/6$ for
      $x = 1,\dots,6$ and $0$ otherwise. Any nonnegative function on a countable
      set summing to $1$ is a legitimate pmf, which is how the one-off laws of an
      interview question get specified: list the values, list their weights,
      check they sum to $1$.
    summary: >
      The list of point probabilities of a discrete variable — the jumps of its
      staircase CDF, read one at a time.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.discrete-vs-continuous
    relates: []
    tags: []

  - id: quant-probability.random-variables.pdf
    kind: definition
    prominence: 2
    title: "Probability density function"
    statement: >
      $X$ is continuous with density $f$ when
      $\Pr(a \le X \le b) = \int_a^b f(x)\,dx$ for all $a \le b$, where
      $f \ge 0$ and $\int_{-\infty}^{\infty} f(x)\,dx = 1$. Then
      $F(t) = \int_{-\infty}^{t} f(x)\,dx$, and $F'(t) = f(t)$ at every $t$ where
      $f$ is continuous: differentiate the CDF to get the density, integrate the
      density to get the CDF. Because each single value has probability $0$,
      strict and weak inequalities agree,
      $\Pr(a < X < b) = \Pr(a \le X \le b)$, so endpoints can be ignored. The
      local reading is $\Pr(x < X \le x + dx) \approx f(x)\,dx$. A density is not
      capped at $1$ — the uniform law on $(0,1/2)$ has $f = 2$ throughout.
    summary: >
      Probability per unit length: areas under $f$ are probabilities, and $f$ is
      the derivative of the CDF.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.discrete-vs-continuous
    relates: []
    tags: []

  - id: quant-probability.random-variables.density-not-probability
    kind: intuition
    prominence: 0
    title: "A density is a rate, not a probability"
    statement: >
      Three consequences of that distinction. The numerical size of $f$ means
      nothing on its own: $f$ has units of probability per unit of $x$, so
      switching the axis from dollars to cents divides every value by $100$; only
      areas are invariant and only ratios $f(x_1)/f(x_2)$, read as relative
      likelihood, are comparable. Next, $\Pr(X = x) = 0$ for every $x$ and yet
      some value does occur — probability zero is not impossibility, and
      "the close is exactly $100.00$" has probability $0$ while "within a tick of
      $100$" does not. Last, conditioning on an event of probability zero cannot
      use the ratio definition and needs a limiting one instead.
    summary: >
      Densities are rates, so their size depends on the units, and a value of
      probability zero can still be the one that happens.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.pdf
    relates: []
    tags: []

  - id: quant-probability.random-variables.quantiles
    kind: definition
    prominence: 1
    title: "Quantile function and median"
    statement: >
      For $u \in (0,1)$ the $u$-quantile of $X$ is
      $q(u) = \inf\{x \in \mathbb{R} : F(x) \ge u\}$, the generalized inverse of
      $F$; it is well defined for every law because $F$ is non-decreasing and
      right-continuous. The median is $q(1/2)$, the quartiles are $q(0.25)$ and
      $q(0.75)$, the $99$th percentile is $q(0.99)$. The defining equivalence is
      $q(u) \le x \iff u \le F(x)$, and when $F$ is continuous and strictly
      increasing $q = F^{-1}$ with $F(q(u)) = u$. Quantiles commute with
      increasing transformations — the median of $\ln X$ is $\ln$ of the median
      of $X$ — which is a property averages lack. Risk is quoted in this
      language: $\operatorname{VaR}_{0.99}$ is a quantile of the loss.
    summary: >
      The inverse of the CDF, defined even when $F$ has flats or jumps: medians,
      percentiles and value-at-risk all live here.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.cdf
    relates: []
    tags: []

  - id: quant-probability.random-variables.symmetric
    kind: proposition
    prominence: 0
    title: "Symmetric laws and their median"
    statement: >
      Call $X$ symmetric about $c$ when $c - X$ and $X - c$ have the same law; in
      CDF terms $F(c+t) = 1 - F((c-t)^{-})$ for all $t \ge 0$, which reads
      $F(c+t) = 1 - F(c-t)$ whenever $F$ is continuous. Then $c$ is a median:
      $\Pr(X > c) = \Pr(X < c)$, each equal to $(1 - \Pr(X = c))/2$. If $F$ is
      also strictly increasing the quantiles pair up as $q(u) + q(1-u) = 2c$, so
      one tail prices the other. Interview use: spotting the symmetry hands you
      the median with no computation — the sum of two fair dice is symmetric
      about $7$, and the number of heads in $2n$ fair tosses is symmetric about
      $n$.
    summary: >
      If reflecting about $c$ leaves the law unchanged then $c$ is a median and
      the two tails mirror each other — a free answer whenever the setup looks
      balanced.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.quantiles
      - quant-probability.random-variables.equality-in-distribution
    relates: []
    tags: []

  - id: quant-probability.random-variables.indicator
    kind: definition
    prominence: 1
    title: "Indicator random variable"
    statement: >
      For an event $A$, the indicator $\mathbf{1}\{A\}$ is the random variable
      equal to $1$ when $A$ occurs and $0$ otherwise. Its law is Bernoulli with
      parameter $\Pr(A)$: pmf $p(1) = \Pr(A)$ and $p(0) = 1 - \Pr(A)$. The
      algebra is what earns it a node: $\mathbf{1}\{A\}^{2} = \mathbf{1}\{A\}$,
      $\mathbf{1}\{A \cap B\} = \mathbf{1}\{A\}\,\mathbf{1}\{B\}$,
      $\mathbf{1}\{A^{c}\} = 1 - \mathbf{1}\{A\}$, and
      $\mathbf{1}\{A \cup B\} = \mathbf{1}\{A\} + \mathbf{1}\{B\} -
      \mathbf{1}\{A\}\,\mathbf{1}\{B\}$. Every count is a sum of indicators — the
      number of $A_1,\dots,A_n$ that occur is
      $N = \sum_{i=1}^{n} \mathbf{1}\{A_i\}$ — and every variable generates the
      family $\mathbf{1}\{X > t\}$, which turns questions about $X$ into
      questions about events.
    summary: >
      The $0/1$ variable that switches on with an event: a Bernoulli law whose
      algebra converts counting problems into sums.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.pmf
    relates:
      - id: quant-probability.foundations.classical
        note: >
          Classical probability divides favourable outcomes by total outcomes;
          indicators are the variables whose sum performs that count, so counting
          statements and probability statements become one algebra.
    tags: []

  - id: quant-probability.random-variables.mixed
    kind: example
    prominence: 0
    title: "A capped payoff is a mixed law"
    statement: >
      A contract pays $X = \min(Y, 3)$ where $Y$ is uniform on $(0,4)$. For
      $0 \le t < 3$ we get $F_X(t) = \Pr(Y \le t) = t/4$, while $F_X(t) = 1$ for
      $t \ge 3$: the CDF climbs linearly to $3/4$ and then jumps to $1$. So $X$
      carries a density of $1/4$ on $(0,3)$, holding probability $3/4$, plus a
      single atom $\Pr(X = 3) = \Pr(Y \ge 3) = 1/4$ — neither discrete nor
      continuous. Probabilities mix the two pieces:
      $\Pr(X > 2) = 1 - 2/4 = 1/2$, of which $1/4$ sits exactly at the cap. The
      median solves $F_X(t) = 1/2$, giving $2$. Every capped, floored or
      knocked-out payoff has this shape.
    summary: >
      Capping a uniform payoff at $3$ leaves a flat density below the cap and a
      $1/4$ atom at it; the median is $2$.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.pmf
      - quant-probability.random-variables.pdf
      - quant-probability.random-variables.quantiles
    relates: []
    tags: []

  - id: quant-probability.random-variables.cdf-method
    kind: technique
    prominence: 1
    title: "CDF method for the law of g(X)"
    statement: >
      To find the law of $Y = g(X)$ for an arbitrary $g$: write
      $F_Y(y) = \Pr(g(X) \le y)$, solve the inequality $g(x) \le y$ for the set of
      $x$ it describes, express that set's probability through $F_X$ or an
      integral of $f_X$, and only then differentiate if a density is wanted.
      Reach for it whenever $g$ is not one-to-one or has a kink — squares,
      absolute values, caps and maxima all qualify. Worked: $X$ uniform on
      $(-1,1)$ and $Y = X^{2}$. For $0 < y < 1$,
      $F_Y(y) = \Pr(-\sqrt{y} \le X \le \sqrt{y}) = \sqrt{y}$, so
      $f_Y(y) = 1/(2\sqrt{y})$ on $(0,1)$ — an unbounded density that still
      integrates to $1$. Fix the range of $y$ before differentiating; most errors
      here are range errors.
    summary: >
      Always available: get $F_Y$ by solving $g(x) \le y$, then differentiate —
      the fallback whenever $g$ is not monotone.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.pdf
    relates: []
    tags: []

  - id: quant-probability.random-variables.transformation
    kind: technique
    prominence: 1
    title: "Density of g(X) for strictly monotone g"
    statement: >
      Hypotheses: $X$ has density $f_X$ supported on an interval $I$, and $g$ is
      strictly monotone and differentiable on $I$ with $g'(x) \ne 0$ there, so
      that $g^{-1}$ exists and is differentiable on $g(I)$. Then $Y = g(X)$ is
      supported on $g(I)$ with density
      $f_Y(y) = f_X(g^{-1}(y))\,\lvert (g^{-1})'(y) \rvert$, equivalently
      $f_Y(y) = f_X(x)/\lvert g'(x) \rvert$ at $x = g^{-1}(y)$, and $0$ off
      $g(I)$. Derivation: for increasing $g$, $F_Y(y) = F_X(g^{-1}(y))$, for
      decreasing $g$ it is $1 - F_X(g^{-1}(y))$, and differentiating both merges
      into the absolute value. The factor $\lvert g' \rvert$ is a stretch rate:
      where $g$ spreads values apart the density thins. Worked: $X$ uniform on
      $(0,1)$ and $Y = -\ln X$ give $x = e^{-y}$ and $f_Y(y) = e^{-y}$ for
      $y > 0$.
    summary: >
      Change of variables for densities — divide by the local stretch factor
      $\lvert g' \rvert$ — legitimate only when $g$ is strictly monotone and
      differentiable.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.cdf-method
    relates: []
    tags: []

  - id: quant-probability.random-variables.linear-transformation
    kind: proposition
    prominence: 1
    title: "Affine maps: location and scale"
    statement: >
      Let $Y = aX + b$ with $a \ne 0$. For $a > 0$, $F_Y(y) = F_X((y-b)/a)$; for
      $a < 0$, $F_Y(y) = 1 - F_X(((y-b)/a)^{-})$. When $X$ has a density, both
      cases give $f_Y(y) = \dfrac{1}{\lvert a \rvert} f_X((y-b)/a)$. Quantiles are
      equivariant: $q_Y(u) = a\,q_X(u) + b$ for $a > 0$, while $a < 0$ reverses
      the order into $q_Y(u) = a\,q_X(1-u) + b$. A family of laws closed under
      these maps is a location–scale family — the uniform, the normal, the
      exponential with a scale parameter — and that closure is exactly why one
      table of standard values serves a whole family: standardize by
      $Z = (X - b)/a$, look the answer up, map it back.
    summary: >
      Shifting and rescaling shifts and rescales the CDF and the quantiles, and
      divides the density by $\lvert a \rvert$ — the reason a single standard
      table covers a whole family.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.transformation
      - quant-probability.random-variables.quantiles
    relates: []
    tags: []

  - id: quant-probability.random-variables.pit
    kind: proposition
    prominence: 2
    title: "Probability integral transform"
    statement: >
      Hypothesis: $X$ has a continuous CDF $F$, equivalently no atoms; $F$ need
      not be strictly increasing. Then $U = F(X)$ is uniform on $[0,1]$. Proof:
      for $u \in (0,1)$, $\Pr(F(X) \le u) = \Pr(X \le q(u)) = F(q(u)) = u$, the
      last step because continuity of $F$ forces $F(q(u)) = u$; the first
      equality can fail only where $F$ is flat, and $X$ lands in a flat stretch
      with probability $0$. The converse needs
      no continuity: if $U$ is uniform on $(0,1)$ then $q(U)$ has CDF $F$, since
      $q(U) \le x \iff U \le F(x)$. Continuity is essential in the forward
      direction — for a fair coin scored $0/1$, $F(X)$ takes only the values
      $1/2$ and $1$. Uses: p-values are uniform under a continuous null, and a
      uniform stream pushed through $q$ produces samples from any law.
    summary: >
      Push a variable through its own continuous CDF and you always land on a
      uniform; run the quantile function the other way and a uniform becomes any
      distribution you like.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.quantiles
      - quant-probability.random-variables.cdf-method
    relates: []
    tags: []

  - id: quant-probability.random-variables.min-max
    kind: proposition
    prominence: 1
    title: "CDFs of the maximum and the minimum"
    statement: >
      Let $X_1,\dots,X_n$ be independent with CDFs $F_1,\dots,F_n$, and put
      $M = \max_i X_i$, $m = \min_i X_i$. Since
      $\{M \le t\} = \bigcap_i \{X_i \le t\}$, independence gives
      $F_M(t) = \prod_{i=1}^{n} F_i(t)$; since
      $\{m > t\} = \bigcap_i \{X_i > t\}$, it gives
      $\Pr(m > t) = \prod_{i=1}^{n} (1 - F_i(t))$, so
      $F_m(t) = 1 - \prod_{i=1}^{n} (1 - F_i(t))$. In the iid case with common
      CDF $F$ and density $f$ these read $F_M(t) = F(t)^{n}$ and
      $F_m(t) = 1 - (1 - F(t))^{n}$, with densities
      $f_M(t) = n F(t)^{n-1} f(t)$ and $f_m(t) = n(1 - F(t))^{n-1} f(t)$.
      Remember it as: maxima multiply CDFs, minima multiply survival functions.
      Independence does the work — without it the intersection fails to factor.
    summary: >
      Maxima multiply CDFs and minima multiply survival functions, so the
      extremes of independent variables cost one line of algebra.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.cdf
      - quant-probability.foundations.independence-events
    relates: []
    tags: []

  - id: quant-probability.random-variables.max-of-uniforms
    kind: example
    prominence: 0
    title: "Maximum of five uniforms"
    statement: >
      Draw $X_1,\dots,X_5$ independent and uniform on $(0,1)$ and let $M$ be the
      largest. Then $F_M(t) = t^{5}$ on $[0,1]$, so
      $\Pr(M > 0.9) = 1 - 0.9^{5} = 1 - 0.59049 = 0.40951$. The median of $M$
      solves $t^{5} = 1/2$, giving $t = 2^{-1/5} \approx 0.871$, and its $90$th
      percentile solves $t^{5} = 0.9$, giving $t \approx 0.979$ — a badly skewed
      law, piled up against the ceiling. The minimum mirrors it exactly:
      $\Pr(m < 0.1) = 1 - 0.9^{5} = 0.40951$, because $1 - X_i$ is uniform too.
      Scaling: $\Pr(M \le 1 - c/n) = (1 - c/n)^{n} \to e^{-c}$, so the maximum of
      $n$ uniforms sits within about $1/n$ of the top.
    summary: >
      $\Pr(M > 0.9) = 0.40951$ and the median maximum is $0.871$ — extremes of
      $n$ uniforms crowd into the last $1/n$ of the range.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.min-max
      - quant-probability.random-variables.quantiles
    relates: []
    tags: []

  - id: quant-probability.random-variables.order-statistics
    kind: proposition
    prominence: 1
    title: "Density of the k-th order statistic"
    statement: >
      Let $X_1,\dots,X_n$ be iid with CDF $F$ and density $f$, and sort them into
      $X_{(1)} \le \dots \le X_{(n)}$. The CDF form is a binomial count:
      $\Pr(X_{(k)} \le x) = \sum_{j=k}^{n} \binom{n}{j} F(x)^{j}
      (1 - F(x))^{n-j}$, because $X_{(k)} \le x$ says at least $k$ of the $n$
      draws landed at or below $x$, and each does so independently with
      probability $F(x)$. Differentiating — or counting directly — gives the
      density $f_{(k)}(x) = \dfrac{n!}{(k-1)!\,(n-k)!}\,F(x)^{k-1}
      (1 - F(x))^{n-k} f(x)$: choose which draw sits at $x$ ($n$ ways), which
      $k-1$ of the remaining $n-1$ fall below it ($\binom{n-1}{k-1}$ ways), and
      the other $n-k$ above. Taking $k = n$ and $k = 1$ recovers the maximum and
      the minimum.
    summary: >
      Sort $n$ iid draws: the $k$-th smallest has density proportional to
      $F^{k-1}(1-F)^{n-k} f$, read off a binomial count of how many draws fall
      below the point.
    parent: quant-probability.random-variables
    also_under: []
    requires:
      - quant-probability.random-variables.min-max
      - quant-probability.random-variables.pdf
      - quant-probability.counting.combinations
    relates:
      - id: quant-probability.counting.multinomial
        note: >
          The constant $n!/((k-1)!\,1!\,(n-k)!)$ is a multinomial coefficient: it
          splits the sample into the three labelled groups lying below, at, and
          above the observed value.
    tags: []

  - id: quant-probability.random-variables.uniform-order-statistics
    kind: example
    prominence: 0
    title: "Median of three uniforms"
    statement: >
      Take three independent uniform $(0,1)$ draws; the sample median is
      $X_{(2)}$, with density $\dfrac{3!}{1!\,1!}\,x(1-x) = 6x(1-x)$ on $(0,1)$.
      Hence $\Pr(X_{(2)} > 3/4) = \int_{3/4}^{1} 6x(1-x)\,dx$, and since
      $3x^{2} - 2x^{3}$ is an antiderivative this is
      $1 - 0.84375 = 5/32 \approx 0.156$. The density is symmetric about $1/2$,
      so the median of the sample median is $1/2$. In general the $k$-th of $n$
      uniform draws has density $\dfrac{n!}{(k-1)!\,(n-k)!}\,x^{k-1}(1-x)^{n-k}$
      — the Beta family, met again among the continuous laws. Uniform order
      statistics are the standard test case because $F(x) = x$ makes every
      formula explicit.
    summary: >
      The middle of three uniforms has density $6x(1-x)$: it exceeds $3/4$ with
      probability $5/32$ and is itself centred on $1/2$.
