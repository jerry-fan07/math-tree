# quant-probability.conditional — Conditional Probability & Bayes
# Outline node (06 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-probability.conditional
    kind: subbranch
    title: "Conditional Probability & Bayes"
    summary: >
      Conditioning as the central move of probability interviews — chain
      rule, total probability, Bayes in probability and odds form, and
      the base-rate trap.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.conditional.conditional-probability
    kind: definition
    prominence: 2
    title: "Conditional probability"
    statement: >
      Let $A$ and $B$ be events with $\Pr(B) > 0$. The conditional probability of
      $A$ given $B$ is $\Pr(A \mid B) = \dfrac{\Pr(A \cap B)}{\Pr(B)}$; it is
      left undefined when $\Pr(B) = 0$, and every identity built on it silently
      carries that hypothesis. Rearranged, $\Pr(A \cap B) = \Pr(A \mid B)\Pr(B)$,
      which is the form actually used in computation. The bar is not symmetric:
      $\Pr(A \mid B)$ and $\Pr(B \mid A)$ are in general different numbers,
      agreeing only when $\Pr(A) = \Pr(B)$ or the events are disjoint. Worked,
      for one fair die:
      $\Pr(X = 6 \mid X \text{ even}) = (1/6)/(1/2) = 1/3$.
    summary: >
      The chance of $A$ once you know $B$ happened — the joint probability
      renormalized by the probability of what you conditioned on.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.foundations.axioms
    relates: []
    tags: []

  - id: quant-probability.conditional.reduced-sample-space
    kind: intuition
    prominence: 1
    title: "Conditioning shrinks the sample space"
    statement: >
      Conditioning on $B$ deletes every outcome outside $B$ and rescales what
      survives by $1/\Pr(B)$, so the remaining mass sums to $1$ again: $B$ is the
      new sample space. When outcomes are equally likely this collapses to
      counting, $\Pr(A \mid B) = |A \cap B| / |B|$ — no probabilities required,
      just a shorter list. Worked: for two fair dice the $36$ outcomes shrink, on
      the event $\{\text{sum} \ge 10\}$, to the six pairs $(4,6)$, $(5,5)$,
      $(6,4)$, $(5,6)$, $(6,5)$, $(6,6)$, two of which are doubles, so
      $\Pr(\text{double} \mid \text{sum} \ge 10) = 2/6 = 1/3$ against an
      unconditional $1/6$. Under pressure, write out the reduced list before
      reaching for any formula.
    summary: >
      Conditioning is renormalization: throw away the outcomes ruled out and
      rescale the survivors, which with equally likely outcomes is pure counting.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.conditional-probability
      - quant-probability.foundations.classical
    relates: []
    tags: []

  - id: quant-probability.conditional.conditional-measure
    kind: proposition
    prominence: 0
    title: "P(· | B) is itself a probability measure"
    statement: >
      Fix $B$ with $\Pr(B) > 0$. The map $A \mapsto \Pr(A \mid B)$ is
      nonnegative, assigns $1$ to the whole sample space, and is countably
      additive over disjoint events, so it satisfies the axioms. Consequently
      every unconditional identity holds verbatim with $\mid B$ appended
      throughout: $\Pr(A^{c} \mid B) = 1 - \Pr(A \mid B)$,
      $\Pr(A \cup C \mid B) = \Pr(A \mid B) + \Pr(C \mid B) - \Pr(A \cap C
      \mid B)$, inclusion–exclusion, the union bound. What fails
      is the other slot: $\Pr(A \mid B^{c})$ bears no relation to
      $\Pr(A \mid B)$, and $\Pr(A \mid B \cup C)$ is not a sum of
      $\Pr(A \mid B)$ and $\Pr(A \mid C)$. The classic slip is complementing on
      the wrong side of the bar.
    summary: >
      Everything you know about probability still works after conditioning, but
      only in the left-hand slot — the conditioning event is not a variable you
      may manipulate the same way.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.conditional-probability
    relates: []
    tags: []

  - id: quant-probability.conditional.chain-rule
    kind: proposition
    prominence: 1
    title: "Chain (multiplication) rule"
    statement: >
      If $\Pr(A_1 \cap \dots \cap A_{n-1}) > 0$, so that each conditioning event
      below has positive probability, then
      $\Pr(A_1 \cap \dots \cap A_n) = \Pr(A_1)\,\Pr(A_2 \mid A_1)\,
      \Pr(A_3 \mid A_1 \cap A_2) \cdots
      \Pr(A_n \mid A_1 \cap \dots \cap A_{n-1})$. The two-event case is
      $\Pr(A \cap B) = \Pr(A)\Pr(B \mid A)$. Any ordering of the events is valid,
      so pick the one whose conditionals are easiest to read off. Worked: the
      first three cards of a shuffled deck are all spades with probability
      $(13/52)(12/51)(11/50) = 11/850 \approx 0.0129$.
    summary: >
      A joint probability factors into a product of conditionals along any order
      you like — the workhorse for anything drawn in sequence.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.conditional-probability
    relates:
      - id: quant-probability.counting.multiplication-principle
        note: >
          The chain rule is the multiplication principle with probabilities in
          place of counts: each factor prices one sequential choice given
          everything chosen before it.
    tags: []

  - id: quant-probability.conditional.independence-conditioning
    kind: proposition
    prominence: 1
    title: "Independence in conditional language"
    statement: >
      Let $\Pr(B) > 0$. Then $A$ and $B$ are independent, meaning
      $\Pr(A \cap B) = \Pr(A)\Pr(B)$, if and only if $\Pr(A \mid B) = \Pr(A)$;
      if also $\Pr(A) > 0$ this is equivalent to $\Pr(B \mid A) = \Pr(B)$.
      Independence says the news that $B$ occurred moves nothing. The product
      form is the one to state, because it stays meaningful when $\Pr(B) = 0$ and
      it makes the symmetry obvious. The same symmetry governs dependence:
      $\Pr(A \mid B) > \Pr(A)$ holds exactly when
      $\Pr(A \cap B) > \Pr(A)\Pr(B)$, which holds exactly when
      $\Pr(B \mid A) > \Pr(B)$ — so "$B$ is evidence for $A$" is a symmetric
      relation, never a one-way street.
    summary: >
      Independence is "conditioning changes nothing", and being evidence for
      something is always mutual.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.conditional-probability
      - quant-probability.foundations.independence-events
    relates: []
    tags: []

  - id: quant-probability.conditional.conditional-independence
    kind: definition
    prominence: 1
    title: "Conditional independence"
    statement: >
      Events $A$ and $B$ are conditionally independent given $C$, where
      $\Pr(C) > 0$, when $\Pr(A \cap B \mid C) = \Pr(A \mid C)\Pr(B \mid C)$;
      equivalently $\Pr(A \mid B \cap C) = \Pr(A \mid C)$ whenever
      $\Pr(B \cap C) > 0$. Read it as: once $C$ is known, learning $B$ says
      nothing further about $A$. This is a statement about the conditional world
      only, and neither implication with ordinary independence holds — each
      direction fails, as the next node shows. Conditional independence given a
      hidden state is the assumption behind naive Bayes classifiers, factor
      models, and every "given the present, the future ignores the past"
      dynamic.
    summary: >
      Independence inside the world where $C$ is known — a different and
      logically unrelated statement from plain independence.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.independence-conditioning
    relates: []
    tags: []

  - id: quant-probability.conditional.conditioning-breaks-independence
    kind: example
    prominence: 1
    title: "Independence does not survive conditioning, and vice versa"
    statement: >
      Independent becoming dependent: let $X$ and $Y$ be independent fair flips
      and let $C$ be the event that they agree. Unconditionally
      $\Pr(X = H \mid Y = H) = 1/2$, but given $C$ the two are perfectly
      dependent, $\Pr(X = H \mid Y = H, C) = 1$. Dependent becoming independent:
      a coin has bias $p$ equal to $0.3$ or $0.7$ with probability $1/2$ each.
      Its flips are not independent — $\Pr(HH) = (0.09 + 0.49)/2 = 0.29$ while
      $\Pr(H) = 0.5$, so a first head lifts the next head from $0.5$ to
      $0.29/0.5 = 0.58$ — yet they are independent given $p$. Learning about a
      shared cause is exactly what couples repeated trials.
    summary: >
      Two coin examples showing that independence and conditional independence
      imply each other in neither direction.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.conditional-independence
    relates: []
    tags: []

  - id: quant-probability.conditional.explaining-away
    kind: intuition
    prominence: 0
    title: "Common causes versus common effects"
    statement: >
      The two failure directions have a shape worth memorizing. Common cause: if
      $A$ and $B$ are both driven by a hidden $C$ they are dependent, and
      conditioning on $C$ makes them independent — that is the unknown-bias coin,
      and it is why controlling for a confounder is the right move. Common effect
      (a collider): independent causes $A$ and $B$ of an event $E$ become
      dependent once $E$ is known, since if $E$ occurred and $A$ did not, $B$
      must have. Your alarm sounds; hearing there was an earthquake lowers the
      chance of a burglar, though the two are independent a priori. Conditioning
      on a collider — including selecting your sample on an outcome —
      manufactures correlation that was never there.
    summary: >
      Conditioning on something upstream removes dependence; conditioning on
      something downstream creates it, which is how selection effects fake
      correlations.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.conditioning-breaks-independence
    relates: []
    tags: []

  - id: quant-probability.conditional.without-replacement-chain
    kind: technique
    prominence: 1
    title: "Sampling without replacement by the chain rule"
    statement: >
      When items are drawn without replacement, do not reach for a counting
      formula — walk the draws and multiply conditionals, shrinking the pool as
      you go. The first two cards of a shuffled deck are both aces with
      probability $(4/52)(3/51) = 1/221 \approx 0.45\%$, matching
      $\binom{4}{2}/\binom{52}{2} = 6/1326$; the sequential route extends
      painlessly to "and the third is a king", where the counting route needs a
      new setup. The top five cards contain no ace with probability
      $(48/52)(47/51)(46/50)(45/49)(44/48) \approx 0.659$. Rule: counting is
      better for unordered "how many hands" questions, the chain rule for
      anything phrased as a sequence of draws.
    summary: >
      Multiply shrinking fractions draw by draw — the fastest route to any
      urn-or-deck probability stated as a sequence.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.chain-rule
      - quant-probability.counting.combinations
    relates: []
    tags: []

  - id: quant-probability.conditional.symmetry-exchangeability
    kind: technique
    prominence: 1
    title: "Exchangeability of positions in a shuffled deck"
    statement: >
      In a uniformly shuffled deck — or any draw without replacement from a fixed
      pool — the sequence of cards is exchangeable: every position has the same
      marginal law, and any $k$ positions have the same joint law as any other
      $k$. So the second card is an ace with probability $4/52 = 1/13$, and so is
      the fifth, and so is the last; no chain rule is needed for a
      single-position question. The check confirms it:
      $(4/52)(3/51) + (48/52)(4/51) = 204/2652 = 1/13$. Two more consequences:
      for two named cards, $\Pr(\text{ace of spades precedes king of hearts})
      = 1/2$ by relabelling, and burning cards face down changes nothing about
      the law of the next one.
    summary: >
      Every position in a shuffled deck is statistically the same position, so
      "the second card is an ace" is just $4/52$.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.without-replacement-chain
    relates:
      - id: quant-probability.counting.permutations
        note: >
          Exchangeability is the probabilistic reading of the uniform random
          permutation: all $n!$ orders equally likely is exactly what makes every
          position's law identical.
    tags: []

  - id: quant-probability.conditional.total-probability
    kind: theorem
    prominence: 2
    title: "Law of total probability"
    statement: >
      Let $B_1, \dots, B_n$ be a partition of the sample space — pairwise
      disjoint with union everything — and suppose $\Pr(B_i) > 0$ for each $i$.
      Then for every event $A$,
      $\Pr(A) = \sum_{i=1}^{n} \Pr(A \mid B_i)\Pr(B_i)$, and the same holds for a
      countably infinite partition. The two-case form is
      $\Pr(A) = \Pr(A \mid B)\Pr(B) + \Pr(A \mid B^{c})\Pr(B^{c})$. Reading:
      $\Pr(A)$ is a weighted average of the conditional probabilities with the
      case probabilities as weights, so it always lies between the smallest and
      largest $\Pr(A \mid B_i)$. Worked: urn one holds $2$ red and $3$ blue, urn
      two holds $4$ red and $1$ blue; pick an urn by a fair coin and draw, and
      $\Pr(\text{red}) = (1/2)(2/5) + (1/2)(4/5) = 3/5$.
    summary: >
      Split the world into exhaustive cases, solve the easy problem inside each,
      and average with the case probabilities as weights.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.chain-rule
    relates:
      - id: quant-probability.foundations.union-two
        note: >
          Inclusion–exclusion exists to correct for overlap; conditioning on a
          partition avoids the correction entirely, because disjoint cases let
          the probabilities add with no cross-terms.
    tags: []

  - id: quant-probability.conditional.simpson-warning
    kind: intuition
    prominence: 1
    title: "Aggregate rates are hostage to their weights"
    statement: >
      Total probability makes $\Pr(A)$ a weighted average of the
      $\Pr(A \mid B_i)$, so a pooled rate depends as much on the mix of cases as
      on the rates within them. A treatment can win in every subgroup and still
      lose overall when the subgroups differ in size and in severity; two
      departments can each admit women at a higher rate than men while the
      university as a whole admits men at a higher rate. Nothing is
      mathematically paradoxical — the pooled number and the conditional numbers
      answer different questions — but the working rule is hard: never compare
      two pooled rates whose mixes differ, and treat any conditional rate quoted
      without its base as unreadable. The full reversal is worked in the
      probability-paradoxes material.
    summary: >
      Averaging conditionals with different weights can reverse the comparison —
      the Simpson trap, and the reason pooled rates need their mix disclosed.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.total-probability
    relates: []
    tags: []

  - id: quant-probability.conditional.bayes
    kind: theorem
    prominence: 2
    title: "Bayes' theorem"
    statement: >
      Let $B_1, \dots, B_n$ partition the sample space with $\Pr(B_i) > 0$, and
      let $A$ be an event with $\Pr(A) > 0$. Then
      $\Pr(B_k \mid A) = \dfrac{\Pr(A \mid B_k)\Pr(B_k)}
      {\sum_{i=1}^{n} \Pr(A \mid B_i)\Pr(B_i)}$. The two-case version is
      $\Pr(B \mid A) = \dfrac{\Pr(A \mid B)\Pr(B)}
      {\Pr(A \mid B)\Pr(B) + \Pr(A \mid B^{c})\Pr(B^{c})}$. The proof is one
      line: the numerator is the chain rule and the denominator is total
      probability. Its whole purpose is to reverse the conditioning — turning
      $\Pr(\text{evidence} \mid \text{hypothesis})$, which your model hands you,
      into $\Pr(\text{hypothesis} \mid \text{evidence})$, which is what you were
      asked.
    summary: >
      Flip the bar: convert the probability of the evidence under each hypothesis
      into the probability of each hypothesis given the evidence.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.total-probability
    relates: []
    tags: []

  - id: quant-probability.conditional.prior-likelihood-posterior
    kind: definition
    prominence: 1
    title: "Prior, likelihood, posterior"
    statement: >
      Write $H$ for a hypothesis and $E$ for observed evidence, with
      $\Pr(E) > 0$. Then $\Pr(H)$ is the prior, $\Pr(E \mid H)$ is the
      likelihood, $\Pr(H \mid E)$ is the posterior, and $\Pr(E)$ is the marginal
      likelihood, whose only job is to normalize. The likelihood is a function of
      $H$ for the fixed observed $E$; it is not a probability distribution over
      $H$ and need not sum to $1$ across hypotheses. In practice use the
      proportional form, posterior $\propto$ prior $\times$ likelihood: score
      each enumerated hypothesis by that product, then divide by the total at the
      very end. Updating is sequential — the posterior after one observation
      serves as the prior for the next.
    summary: >
      The vocabulary of Bayes: prior belief times the likelihood of what you saw,
      renormalized, gives the posterior.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.bayes
    relates: []
    tags: []

  - id: quant-probability.conditional.bayes-odds
    kind: corollary
    prominence: 1
    title: "Odds form of Bayes"
    statement: >
      Take two exhaustive hypotheses $H$ and $H^{c}$ with
      $\Pr(E \mid H^{c}) > 0$. Dividing the two Bayes formulas cancels the shared
      denominator and leaves
      $\dfrac{\Pr(H \mid E)}{\Pr(H^{c} \mid E)}
      = \dfrac{\Pr(H)}{\Pr(H^{c})} \times
      \dfrac{\Pr(E \mid H)}{\Pr(E \mid H^{c})}$: posterior odds equal prior odds
      times the likelihood ratio. Convert back with $p = O/(1+O)$. This is the
      form to use out loud, because no normalizing constant appears, updates
      simply multiply, and taking logarithms makes evidence additive — a
      likelihood ratio of $2$ is one bit in favour, a ratio of $1$ is no evidence
      at all.
    summary: >
      Posterior odds = prior odds × likelihood ratio — the version you can do in
      your head, with no denominator to compute.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.prior-likelihood-posterior
      - quant-probability.foundations.odds
    relates: []
    tags: []

  - id: quant-probability.conditional.coin-from-bag
    kind: example
    prominence: 1
    title: "Fair coin or two-headed coin"
    statement: >
      A bag holds two coins, one fair and one two-headed. You draw one at random
      and flip it: heads. What is the chance you are holding the two-headed coin?
      Prior odds are $1:1$; the likelihood ratio is
      $\Pr(H \mid \text{two-headed})/\Pr(H \mid \text{fair}) = 1/(1/2) = 2$; so
      the posterior odds are $2:1$ and the answer is $2/3$. Directly:
      $(1/2 \cdot 1)/(1/2 \cdot 1 + 1/2 \cdot 1/2) = (1/2)/(3/4) = 2/3$. The
      standard follow-ups: the next flip is heads with probability
      $(2/3)(1) + (1/3)(1/2) = 5/6$, and after $k$ straight heads the posterior
      on the two-headed coin is $2^{k}/(2^{k}+1)$, never reaching $1$.
    summary: >
      One head makes the two-headed coin twice as likely as the fair one, giving
      $2/3$ — and $5/6$ for the next flip.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.bayes-odds
    relates: []
    tags: []

  - id: quant-probability.conditional.test-characteristics
    kind: definition
    prominence: 0
    title: "Sensitivity, specificity, predictive value"
    statement: >
      For a binary test of a binary condition $D$: the sensitivity, or true
      positive rate, is $\Pr(+ \mid D)$; the specificity is
      $\Pr(- \mid D^{c})$, and the false positive rate is
      $\Pr(+ \mid D^{c}) = 1 - \text{specificity}$. These condition on the truth,
      so they are properties of the test alone and say nothing about any
      population. What a tested person actually wants is the reverse
      conditioning: the positive predictive value $\Pr(D \mid +)$ and the
      negative predictive value $\Pr(D^{c} \mid -)$, both of which depend on the
      prevalence $\Pr(D)$ as well as on the test. Moving the decision threshold
      trades sensitivity against specificity; predictive value can be dismal even
      when both are high.
    summary: >
      Sensitivity and specificity describe the test; predictive value describes
      your situation, and needs the prevalence too.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.conditional-probability
    relates: []
    tags: []

  - id: quant-probability.conditional.disease-test
    kind: example
    prominence: 2
    title: "The positive screening test"
    statement: >
      A disease has prevalence $1\%$. A screening test has sensitivity $99\%$ and
      specificity $95\%$, so it flags $5\%$ of healthy people. You test positive:
      what is the chance you have it? Total probability gives
      $\Pr(+) = (0.01)(0.99) + (0.99)(0.05) = 0.0099 + 0.0495 = 0.0594$, hence
      $\Pr(D \mid +) = 0.0099/0.0594 = 1/6 \approx 16.7\%$. In odds: prior odds
      $1:99$, likelihood ratio $0.99/0.05 = 19.8$, posterior odds
      $19.8:99 = 1:5$, the same $1/6$. Five of every six positives are false,
      because the healthy $99\%$ generate $495$ false positives per $10\,000$
      people against only $99$ true ones. The posterior tracks the prevalence
      almost proportionally: at a prevalence of $0.1\%$ the same test leaves
      posterior odds $19.8:999$, about $1.9\%$.
    summary: >
      Sensitivity $99\%$, specificity $95\%$, prevalence $1\%$ — and a positive
      result still means only a $1/6$ chance of being ill.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.bayes-odds
      - quant-probability.conditional.test-characteristics
    relates: []
    tags: []

  - id: quant-probability.conditional.base-rate-neglect
    kind: intuition
    prominence: 1
    title: "Base-rate neglect and natural frequencies"
    statement: >
      Asked the screening question, most people — physicians included — answer
      near $95\%$ or $99\%$, reading the test's accuracy straight off and
      discarding the prior. The error is treating $\Pr(+ \mid D)$ as if it were
      $\Pr(D \mid +)$. The reliable fix is to restate the problem in natural
      frequencies: out of $10\,000$ people, $100$ are ill and $99$ of them test
      positive, $9\,900$ are healthy and $495$ test positive, so of $594$
      positives only $99$ are ill — $1/6$, with one division at the end. The rule
      to carry into any interview: when the base rate sits far below the false
      positive rate, a positive result still mostly means healthy.
    summary: >
      People substitute the test's accuracy for the posterior; counting people
      instead of multiplying probabilities makes the base rate impossible to
      ignore.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.disease-test
    relates: []
    tags: []

  - id: quant-probability.conditional.transposed-conditional
    kind: intuition
    prominence: 1
    title: "The transposed conditional"
    statement: >
      Bayes says $\Pr(A \mid B)$ and $\Pr(B \mid A)$ differ by the factor
      $\Pr(A)/\Pr(B)$, which can be orders of magnitude. The prosecutor's fallacy
      is the branded version: "the chance of this DNA match if the defendant were
      innocent is one in a million, so he is innocent with probability one in a
      million." With ten million possible suspects and no other evidence, about
      ten innocent people also match, so the posterior odds of guilt are near
      $1:10$, not a million to one. The everyday form is harmless and just as
      wrong: most cyclists are men does not make most men cyclists. Whenever a
      quoted probability sounds damning, ask which way the bar points and what
      the base rate is.
    summary: >
      Swapping the two sides of the conditioning bar is the single most common
      probabilistic error in the wild — the prosecutor's fallacy.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.bayes
    relates: []
    tags: []

  - id: quant-probability.conditional.sequential-updating
    kind: technique
    prominence: 1
    title: "Updating on evidence one piece at a time"
    statement: >
      Reach for this whenever evidence arrives in instalments. Work in odds and
      multiply likelihood ratios: if $E_1, \dots, E_n$ are conditionally
      independent given $H$ and given $H^{c}$, then posterior odds equal prior
      odds times $\prod_{i} \Pr(E_i \mid H)/\Pr(E_i \mid H^{c})$, and the order
      of arrival is irrelevant. That conditional independence is the load-bearing
      hypothesis and is often false — a second reading from the same miscalibrated
      instrument carries no new information at all. Worked: a second, genuinely
      independent positive test in the screening example multiplies the posterior
      odds $1:5$ by $19.8$, giving $3.96:1$, so
      $\Pr(D \mid ++) = 3.96/4.96 \approx 80\%$.
    summary: >
      Independent evidence multiplies likelihood ratios, so a second positive
      screening test lifts the posterior from $17\%$ to about $80\%$.
    parent: quant-probability.conditional
    also_under: []
    requires:
      - quant-probability.conditional.disease-test
      - quant-probability.conditional.conditional-independence
    relates: []
    tags: []
