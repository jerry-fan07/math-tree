nodes:
  - id: quant-probability.continuous
    kind: subbranch
    title: "Continuous Distributions"
    summary: >
      Uniform, exponential, normal and friends — densities, moments,
      memorylessness, and the manipulations interviews expect cold.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.continuous.uniform
    kind: definition
    prominence: 1
    title: "Continuous uniform distribution"
    statement: >
      $X \sim U(a,b)$ has density $f(x) = 1/(b-a)$ for $a \le x \le b$ and $0$
      otherwise, hence CDF $F(x) = (x-a)/(b-a)$ on the interval, $0$ below it and
      $1$ above. Probability is pure length:
      $\Pr(c \le X \le d) = (d-c)/(b-a)$ for any subinterval, which is what makes
      "pick a point at random" questions a matter of measuring rather than
      integrating. Symmetry puts the mean and the median at the midpoint
      $(a+b)/2$. For $U(0,1)$, $\mathbb{E}[X^{2}] = 1/3$ gives
      $\operatorname{Var}(X) = 1/3 - 1/4 = 1/12$ and standard deviation
      $1/\sqrt{12} \approx 0.289$; in general
      $\operatorname{Var}(X) = (b-a)^{2}/12$. Every uniform is affine in a
      standard one: $X = a + (b-a)U$ with $U \sim U(0,1)$.
    summary: >
      The flat law on an interval: probability equals the length ratio, the mean
      is the midpoint, and the variance is $(b-a)^{2}/12$.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.continuous.uniform-sum
    kind: example
    prominence: 1
    title: "Sum of two uniforms: the triangle density"
    statement: >
      Let $S = U_1 + U_2$ with $U_1, U_2$ independent and uniform on $(0,1)$. The
      density is a triangle peaking at $1$: $f(s) = s$ for $0 \le s \le 1$ and
      $f(s) = 2 - s$ for $1 \le s \le 2$, because $\Pr(S \le t)$ is the area
      $t^{2}/2$ of a corner triangle while $t \le 1$. So
      $\Pr(S \le 1/2) = 1/8$, and $\Pr(S \le 1) = 1/2$, which also follows from
      the symmetry $s \mapsto 2-s$. Moments come from linearity:
      $\mathbb{E}[S] = 1$ and $\operatorname{Var}(S) = 2/12 = 1/6$. The pattern
      generalizes — $\Pr(U_1 + \dots + U_n \le 1) = 1/n!$ — so the expected
      number of uniforms you must add before the total passes $1$ is
      $\sum_{n \ge 0} 1/n! = e \approx 2.718$.
    summary: >
      Two uniforms convolve into a triangle: $\Pr(S \le 1) = 1/2$, and on average
      it takes $e \approx 2.718$ uniforms to sum past $1$.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.uniform
    relates: []
    tags: []

  - id: quant-probability.continuous.beta
    kind: definition
    prominence: 1
    title: "Beta distribution"
    statement: >
      For $a, b > 0$, $X \sim \operatorname{Beta}(a,b)$ has density
      $f(x) = x^{a-1}(1-x)^{b-1}/B(a,b)$ on $(0,1)$, where the normalizer is
      $B(a,b) = \int_{0}^{1} t^{a-1}(1-t)^{b-1}\,dt$, equal to
      $(a-1)!\,(b-1)!/(a+b-1)!$ at integer arguments. Its mean is $a/(a+b)$ and
      its variance $ab/((a+b)^{2}(a+b+1))$; $\operatorname{Beta}(1,1)$ is exactly
      $U(0,1)$. The interview signature is order statistics: the $k$-th smallest
      of $n$ iid uniforms has density
      $\dfrac{n!}{(k-1)!\,(n-k)!}x^{k-1}(1-x)^{n-k}$, which is
      $\operatorname{Beta}(k, n-k+1)$, so its mean is $k/(n+1)$ — the median of
      three uniforms is $\operatorname{Beta}(2,2)$ with mean $1/2$. It is also
      the conjugate prior for a coin's bias.
    summary: >
      The flexible law on $(0,1)$ with mean $a/(a+b)$ — and the exact
      distribution of the $k$-th of $n$ uniform draws.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.uniform
      - quant-probability.random-variables.order-statistics
    relates: []
    tags: []

  - id: quant-probability.continuous.uniform-spacings
    kind: example
    prominence: 0
    title: "Spacings of uniform points on an interval"
    statement: >
      Drop $n$ independent uniform points into $(0,1)$; they cut it into $n+1$
      spacings. The spacings are exchangeable and sum to $1$, so each has mean
      $1/(n+1)$, and each one individually is $\operatorname{Beta}(1,n)$ with
      density $n(1-x)^{n-1}$. Summing spacings gives
      $\mathbb{E}[X_{(k)}] = k/(n+1)$: four points sit on average at
      $0.2, 0.4, 0.6, 0.8$, and the maximum of $n$ points averages $n/(n+1)$. The
      largest gap is bigger than the naive guess — its mean is
      $H_{n+1}/(n+1)$, which at $n = 1$ reads
      $\mathbb{E}[\max(U, 1-U)] = (1 + 1/2)/2 = 3/4$ rather than $1/2$.
    summary: >
      $n$ uniform points split the interval into $n+1$ gaps of mean $1/(n+1)$,
      putting the $k$-th point at $k/(n+1)$ on average.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.beta
    relates: []
    tags: []

  - id: quant-probability.continuous.exponential
    kind: definition
    prominence: 2
    title: "Exponential distribution"
    statement: >
      For a rate $\lambda > 0$, $X \sim \operatorname{Exp}(\lambda)$ has density
      $f(x) = \lambda e^{-\lambda x}$ for $x \ge 0$ and $0$ otherwise, CDF
      $F(x) = 1 - e^{-\lambda x}$, and survival function
      $\Pr(X > x) = e^{-\lambda x}$. Integrating the survival function gives
      $\mathbb{E}[X] = 1/\lambda$, and $\mathbb{E}[X^{2}] = 2/\lambda^{2}$ gives
      $\operatorname{Var}(X) = 1/\lambda^{2}$ — the standard deviation equals the
      mean, a signature worth recognizing. The median is
      $\ln 2/\lambda \approx 0.693/\lambda$, well below the mean, since the law
      is right-skewed. Rescaling by any $c > 0$ stays in the family:
      $cX \sim \operatorname{Exp}(\lambda/c)$. Read $\lambda$ as arrivals per
      unit time: at $\lambda = 3$ per hour the wait for the next one averages
      $20$ minutes.
    summary: >
      The continuous waiting-time law with rate $\lambda$: mean and standard
      deviation both $1/\lambda$, and survival $e^{-\lambda x}$.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.continuous.memoryless-exponential
    kind: proposition
    prominence: 1
    title: "Memorylessness of the exponential"
    statement: >
      If $X \sim \operatorname{Exp}(\lambda)$ then for all $s, t \ge 0$,
      $\Pr(X > s+t \mid X > s) = e^{-\lambda(s+t)}/e^{-\lambda s}
      = e^{-\lambda t} = \Pr(X > t)$: a component that has already survived $s$
      hours is as good as new. Equivalently the overshoot $X - s$ given
      $\{X > s\}$ is again $\operatorname{Exp}(\lambda)$, so
      $\mathbb{E}[X \mid X > s] = s + 1/\lambda$. The exponential is the only
      continuous law on $[0,\infty)$ with this property: the survival function
      must satisfy $G(s+t) = G(s)G(t)$, whose only right-continuous solutions
      are $G(t) = e^{-\lambda t}$. Interview trap: asked how much longer a bulb
      burning for $3$ hours will last, the answer is still $1/\lambda$.
    summary: >
      Past waiting tells you nothing about future waiting — and the exponential
      is the unique continuous law for which that is true.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.exponential
    relates: []
    tags: []

  - id: quant-probability.continuous.hazard-rate
    kind: definition
    prominence: 0
    title: "Hazard rate"
    statement: >
      For a positive variable with density $f$ and CDF $F$, the hazard rate is
      $h(x) = f(x)/(1 - F(x))$, the instantaneous failure rate given survival to
      $x$: $\Pr(x < X \le x + \varepsilon \mid X > x) \approx h(x)\,\varepsilon$
      for small $\varepsilon$. The survival function is recovered from it as
      $\Pr(X > x) = \exp(-\int_{0}^{x} h(u)\,du)$, so the hazard determines the
      law completely. Constant hazard $h \equiv \lambda$ integrates to
      $e^{-\lambda x}$, which is exactly the exponential and exactly
      memorylessness. Increasing hazard means aging (a Weibull with shape
      exponent above $1$); decreasing hazard means infant mortality, where a
      used item is genuinely better than a fresh one.
    summary: >
      Failure rate per unit time given survival so far — flat for the
      exponential, rising for things that wear out.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.memoryless-exponential
    relates: []
    tags: []

  - id: quant-probability.continuous.min-exponentials
    kind: proposition
    prominence: 1
    title: "Minimum of exponentials and the race between clocks"
    statement: >
      Let $X \sim \operatorname{Exp}(\lambda_X)$ and
      $Y \sim \operatorname{Exp}(\lambda_Y)$ be independent. Minima multiply
      survival functions, so
      $\Pr(\min(X,Y) > t) = e^{-\lambda_X t}e^{-\lambda_Y t}
      = e^{-(\lambda_X + \lambda_Y)t}$: the first of two independent clocks is
      exponential with the summed rate, with mean
      $1/(\lambda_X + \lambda_Y)$. Which clock wins is the share of rate,
      $\Pr(X < Y) = \int_{0}^{\infty} \lambda_X e^{-\lambda_X t}
      e^{-\lambda_Y t}\,dt = \lambda_X/(\lambda_X + \lambda_Y)$. With $n$
      independent rates, $\min_i X_i \sim
      \operatorname{Exp}(\lambda_1 + \dots + \lambda_n)$ and $X_i$ is the
      smallest with probability $\lambda_i/(\lambda_1 + \dots + \lambda_n)$ —
      and the identity of the winner is independent of the winning time.
    summary: >
      Rates add under a minimum, and the race is won in proportion to rate:
      $\Pr(X < Y) = \lambda_X/(\lambda_X + \lambda_Y)$.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.exponential
    relates:
      - id: quant-probability.random-variables.min-max
        note: >
          That node's general rule — minima multiply survival functions — is
          what makes exponential rates add here, the exponential being the
          family where the product stays in the family.
    tags: []

  - id: quant-probability.continuous.bank-teller
    kind: example
    prominence: 1
    title: "Two tellers: are you the last to leave?"
    statement: >
      Two tellers are serving customers $A$ and $B$ and you are third in line;
      all service times are iid $\operatorname{Exp}(\lambda)$. What is the chance
      you leave last? When the first teller frees up you take that window; by
      memorylessness the customer still being served has a fresh
      $\operatorname{Exp}(\lambda)$ remaining, your own service is an
      independent $\operatorname{Exp}(\lambda)$, and by symmetry you lose that
      race with probability exactly $1/2$ — their head start is worth nothing.
      Your expected time in the bank is
      $1/(2\lambda) + 1/\lambda = 3/(2\lambda)$. With unequal rates the same
      race argument gives $2\lambda_1\lambda_2/(\lambda_1+\lambda_2)^{2}$, which
      is at most $1/2$ by AM–GM.
    summary: >
      You are last out with probability exactly $1/2$ despite starting behind —
      the classic showcase of exponential memorylessness.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.min-exponentials
      - quant-probability.continuous.memoryless-exponential
    relates: []
    tags: []

  - id: quant-probability.continuous.geometric-limit
    kind: proposition
    prominence: 0
    title: "Exponential and geometric are the same law in two clocks"
    statement: >
      Rounding an exponential up produces a geometric: if
      $X \sim \operatorname{Exp}(\lambda)$ then
      $\Pr(\lceil X \rceil > k) = e^{-\lambda k}$, so $\lceil X \rceil$ is
      geometric on $\{1, 2, \dots\}$ with success probability
      $p = 1 - e^{-\lambda}$ — taking $\lambda = \ln 2$ makes it a fair-coin
      count with $p = 1/2$. Running the correspondence the other way, if $G_p$
      is geometric with parameter $p$ then $pG_p \to \operatorname{Exp}(1)$ in
      distribution as $p \to 0$, since
      $\Pr(pG_p > t) = (1-p)^{\lfloor t/p \rfloor} \to e^{-t}$. Each law is the
      unique memoryless one in its setting, and each has mean equal to one over
      its rate.
    summary: >
      The geometric is the exponential on a discrete clock: round one up, or
      shrink the other's step size, and you land on the other.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.memoryless-exponential
    relates:
      - id: quant-probability.discrete.geometric
        note: >
          The discrete first-success law is the exponential's counterpart: its
          mean $1/p$ becomes $1/\lambda$ in the small-$p$ limit, and its
          memorylessness is the same functional equation on the integers.
    tags: []

  - id: quant-probability.continuous.gamma
    kind: definition
    prominence: 1
    title: "Gamma distribution as a sum of exponentials"
    statement: >
      The sum of $n$ iid $\operatorname{Exp}(\lambda)$ variables is
      $\operatorname{Gamma}(n, \lambda)$, the Erlang law, with density
      $f(x) = \lambda^{n}x^{n-1}e^{-\lambda x}/(n-1)!$ for $x > 0$. Replacing
      $(n-1)!$ by $\Gamma(\alpha)$ extends it to any shape $\alpha > 0$:
      $f(x) = \lambda^{\alpha}x^{\alpha-1}e^{-\lambda x}/\Gamma(\alpha)$. Mean
      $\alpha/\lambda$ and variance $\alpha/\lambda^{2}$ follow by adding
      independent exponentials. Gammas at a common rate add:
      $\operatorname{Gamma}(\alpha_1,\lambda)$ plus an independent
      $\operatorname{Gamma}(\alpha_2,\lambda)$ is
      $\operatorname{Gamma}(\alpha_1+\alpha_2,\lambda)$. Worked: at rate
      $\lambda = 2$ per hour the third arrival is expected at
      $3/2 = 1.5$ hours, with standard deviation
      $\sqrt{3}/2 \approx 0.87$ hours.
    summary: >
      Waiting for the $n$-th arrival rather than the first: mean $n/\lambda$,
      variance $n/\lambda^{2}$, and shapes add at a fixed rate.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.exponential
      - quant-tools.series-calculus.gamma-function
    relates:
      - id: quant-probability.discrete.poisson
        note: >
          The two laws read one clock from opposite ends: the $n$-th arrival
          lands after time $t$ exactly when at most $n-1$ arrivals occur by
          $t$, so a Gamma tail equals a Poisson partial sum.
    tags: []

  - id: quant-probability.continuous.normal
    kind: definition
    prominence: 2
    title: "Normal distribution"
    statement: >
      $X \sim \mathcal{N}(\mu, \sigma^{2})$, with $\mu \in \mathbb{R}$ and
      $\sigma > 0$, has density
      $f(x) = \dfrac{1}{\sigma\sqrt{2\pi}}
      \exp(-(x-\mu)^{2}/(2\sigma^{2}))$ on all of $\mathbb{R}$. The graph is the
      bell: symmetric about $\mu$, so mean, median and mode coincide there, with
      inflection points at $\mu \pm \sigma$ and tails decaying like
      $e^{-x^{2}/2}$ — faster than any exponential, which is why the normal
      badly underweights the extreme moves real markets produce. The standard
      case $\mu = 0$, $\sigma = 1$ has density $\varphi$ and CDF $\Phi$, and
      $\Phi$ has no elementary closed form; interviews therefore run on the
      $68$–$95$–$99.7$ landmarks rather than on antiderivatives.
    summary: >
      The bell curve $\mathcal{N}(\mu,\sigma^{2})$ — symmetric, parameterized by
      its mean and variance, with a CDF $\Phi$ you must know numerically.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.continuous.normal-normalization
    kind: lemma
    prominence: 0
    title: "Why the normal density integrates to 1"
    statement: >
      The constant $1/(\sigma\sqrt{2\pi})$ is forced, not chosen. Substituting
      $z = (x-\mu)/\sigma$ turns $\int f(x)\,dx$ into
      $\dfrac{1}{\sqrt{2\pi}}\int_{-\infty}^{\infty} e^{-z^{2}/2}\,dz$, which is
      $1$ precisely because the Gaussian integral equals $\sqrt{2\pi}$. The same
      substitution identifies the parameters: $\mathbb{E}[X] = \mu$ because
      $z e^{-z^{2}/2}$ is odd, and integrating $z^{2}e^{-z^{2}/2}$ by parts
      gives $\int z^{2}\varphi(z)\,dz = 1$, hence
      $\operatorname{Var}(X) = \sigma^{2}$. So $\mu$ and $\sigma^{2}$ really are
      the mean and the variance rather than shape labels, and $\sigma$ is the
      natural unit of distance along the bell.
    summary: >
      One polar-coordinate integral pins the normalizing constant and confirms
      that $\mu$ and $\sigma^{2}$ are the mean and variance.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.normal
      - quant-tools.series-calculus.gaussian-integral
    relates: []
    tags: []

  - id: quant-probability.continuous.standardization
    kind: technique
    prominence: 1
    title: "Standardizing a normal"
    statement: >
      Every affine image of a normal is normal: if
      $X \sim \mathcal{N}(\mu,\sigma^{2})$ then
      $aX + b \sim \mathcal{N}(a\mu + b,\; a^{2}\sigma^{2})$ for $a \ne 0$, and
      in particular $Z = (X-\mu)/\sigma \sim \mathcal{N}(0,1)$. Reach for it
      whenever a normal probability is asked: rewrite the event in units of
      $\sigma$ above the mean and read $\Phi$. Thus
      $\Pr(X \le x) = \Phi((x-\mu)/\sigma)$, with $\Phi(-z) = 1 - \Phi(z)$ by
      symmetry. Worked, for IQ scores modelled as
      $\mathcal{N}(100, 15^{2})$: $\Pr(X > 130) = 1 - \Phi(2) = 0.0228$, about
      $1$ in $44$, and $\Pr(85 < X < 115) = 2\Phi(1) - 1 = 0.6827$.
    summary: >
      Convert to $Z = (X-\mu)/\sigma$ and everything becomes a $\Phi$ lookup —
      the single most-used normal manipulation.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.normal
    relates: []
    tags: []

  - id: quant-probability.continuous.empirical-rule
    kind: proposition
    prominence: 1
    title: "The 68–95–99.7 rule and the tail table"
    statement: >
      For $X \sim \mathcal{N}(\mu,\sigma^{2})$ the central intervals carry
      $\Pr(|X-\mu| \le \sigma) = 0.6827$,
      $\Pr(|X-\mu| \le 2\sigma) = 0.9545$ and
      $\Pr(|X-\mu| \le 3\sigma) = 0.9973$. Inverted, the two-sided cutoffs are
      $1.645$ for $90\%$, $1.96$ for $95\%$ and $2.576$ for $99\%$; one-tailed,
      $\Pr(Z > 1.645) = 5\%$, $\Pr(Z > 1.96) = 2.5\%$ and
      $\Pr(Z > 2.33) = 1\%$. Far out, use the asymptotic
      $\Pr(Z > z) \approx \varphi(z)/z$, which overstates slightly: at $z = 4$
      it returns $3.3 \times 10^{-5}$ against the true
      $3.2 \times 10^{-5}$. These numbers are memorization work — a trading
      interview asks for a normal probability with no table in the room.
    summary: >
      The sigma-to-probability table: $68\%$, $95\%$, $99.7\%$ inside one, two
      and three sigmas, with $1.96$ as the $95\%$ two-sided cutoff.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.standardization
    relates: []
    tags: []

  - id: quant-probability.continuous.normal-sums
    kind: proposition
    prominence: 1
    title: "Sums of independent normals stay normal"
    statement: >
      If $X \sim \mathcal{N}(\mu_1,\sigma_1^{2})$ and
      $Y \sim \mathcal{N}(\mu_2,\sigma_2^{2})$ are independent, then
      $aX + bY \sim \mathcal{N}(a\mu_1 + b\mu_2,\;
      a^{2}\sigma_1^{2} + b^{2}\sigma_2^{2})$ — means add, variances add, and
      the family is closed. The proof convolves the two densities, or more
      cheaply multiplies moment generating functions, the transform machinery
      met later in the tree. Independence is a real hypothesis: dependent
      normals need a covariance cross-term and the sum can fail to be normal at
      all, since $Z + SZ$ with $S = \pm 1$ a fair independent sign is $0$ half
      the time. Consequence: the average of $n$ iid
      $\mathcal{N}(\mu,\sigma^{2})$ draws is exactly
      $\mathcal{N}(\mu, \sigma^{2}/n)$, with no limit theorem needed.
    summary: >
      Independent normals add to a normal with summed means and summed
      variances, so a normal sample mean is exactly normal.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.standardization
    relates: []
    tags: []

  - id: quant-probability.continuous.lognormal
    kind: definition
    prominence: 1
    title: "Lognormal distribution"
    statement: >
      $Y = e^{X}$ with $X \sim \mathcal{N}(\mu,\sigma^{2})$ is lognormal: it
      lives on $(0,\infty)$ with density
      $f(y) = \dfrac{1}{y\sigma\sqrt{2\pi}}
      \exp(-(\ln y - \mu)^{2}/(2\sigma^{2}))$. Completing the square inside the
      normal integral gives the mean $\mathbb{E}[Y] = e^{\mu + \sigma^{2}/2}$,
      while the median is $e^{\mu}$ and the mode $e^{\mu - \sigma^{2}}$; the
      variance is $(e^{\sigma^{2}} - 1)e^{2\mu + \sigma^{2}}$. The mean always
      exceeds the median, by the factor $e^{\sigma^{2}/2}$: at $\mu = 0$,
      $\sigma = 1$ the mean is $e^{0.5} \approx 1.649$ against a median of $1$.
      Independent lognormals multiply to a lognormal because their logs add,
      which is why multiplicative growth — prices compounding — is modelled
      here rather than with a normal.
    summary: >
      The exponential of a normal, with mean $e^{\mu+\sigma^{2}/2}$ sitting
      above its median $e^{\mu}$ — the standard model for compounding prices.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.normal-normalization
      - quant-probability.continuous.normal-sums
    relates:
      - id: quant-probability.random-variables.transformation
        note: >
          The density here is the monotone change-of-variables formula applied
          to $y = e^{x}$, the Jacobian factor $1/y$ being the whole difference
          between the normal density and this one.
    tags: []

  - id: quant-probability.continuous.chi-square
    kind: definition
    prominence: 0
    title: "Chi-square as a sum of squared normals"
    statement: >
      If $Z_1,\dots,Z_k$ are iid standard normal, then
      $Q = Z_1^{2} + \dots + Z_k^{2}$ has the chi-square law with $k$ degrees of
      freedom, which is the same thing as
      $\operatorname{Gamma}(k/2,\, 1/2)$. Since $\mathbb{E}[Z^{2}] = 1$ and
      $\mathbb{E}[Z^{4}] = 3$, each squared normal has mean $1$ and variance
      $2$, so $\mathbb{E}[Q] = k$ and $\operatorname{Var}(Q) = 2k$. The case
      $k = 2$ is worth carrying: $\chi^{2}_{2}$ is
      $\operatorname{Exp}(1/2)$, so the squared distance from the origin of a
      standard bivariate normal is exponential. This is the law behind sample
      variances and variance tests; its right skew fades as $k$ grows.
    summary: >
      Add $k$ squared standard normals and you get $\operatorname{Gamma}(k/2,
      1/2)$, with mean $k$ and variance $2k$.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.gamma
      - quant-probability.continuous.normal
    relates: []
    tags: []

  - id: quant-probability.continuous.cauchy
    kind: example
    prominence: 1
    title: "Cauchy: heavy tails and no mean"
    statement: >
      The standard Cauchy has density $f(x) = 1/(\pi(1+x^{2}))$ on $\mathbb{R}$
      and CDF $1/2 + \arctan(x)/\pi$, so its quartiles are $\pm 1$ and
      $\Pr(|X| > 1) = 1/2$. Two constructions make it appear unbidden: the ratio
      $Z_1/Z_2$ of independent standard normals is Cauchy, and so is
      $\tan\Theta$ for $\Theta$ uniform on $(-\pi/2, \pi/2)$. Its mean does not
      exist, since $\int |x| f(x)\,dx$ diverges logarithmically — undefined
      rather than infinite — leaving the median $0$ as the only sensible centre.
      The punchline: the average of $n$ iid Cauchy draws is again standard
      Cauchy, so averaging buys no precision at all and the law of large numbers
      fails outright.
    summary: >
      Tails like $1/x^{2}$ kill the mean: the ratio of two normals is Cauchy,
      and averaging Cauchy samples never converges.
    parent: quant-probability.continuous
    also_under: []
    requires:
      - quant-probability.continuous.normal
      - quant-probability.continuous.uniform
    relates: []
    tags: []
