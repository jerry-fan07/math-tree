# quant-probability.conditioning — Conditional Expectation & Tower
# Outline node (12 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-probability.conditioning
    kind: subbranch
    title: "Conditional Expectation & Tower"
    summary: >
      E[X|Y] as a random variable, the tower property, total variance,
      and random sums — the machinery of sequential reasoning.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.conditioning.conditional-given-event
    kind: definition
    prominence: 1
    title: "Conditioning on an event"
    statement: >
      Let $A$ be an event with $\Pr(A) > 0$. The conditional law of $X$ given $A$
      assigns mass $\Pr(X = x \mid A)$ to each value (or density
      $f(x)\mathbf{1}\{x \in A\}/\Pr(A)$ in the continuous case when $A$ is an
      event about $X$), and the conditional expectation is
      $\mathbb{E}[X \mid A] = \mathbb{E}[X\,\mathbf{1}\{A\}]/\Pr(A)$, defined
      whenever $\mathbb{E}|X| < \infty$. Picture it as renormalising the world to
      $A$: probabilities inside $A$ keep their ratios and are scaled up by
      $1/\Pr(A)$. For one fair die, $\mathbb{E}[X \mid X \text{ even}]
      = (2+4+6)/3 = 4$ and $\mathbb{E}[X \mid X > 4] = 5.5$.
    summary: >
      Restrict to $A$, rescale by $\Pr(A)$, and average as usual — the conditional
      mean of a fair die given an even face is $4$.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditional.conditional-probability
      - quant-probability.expectation.expectation
    relates: []
    tags: []

  - id: quant-probability.conditioning.conditional-distribution
    kind: definition
    prominence: 1
    title: "Conditional distribution given a variable"
    statement: >
      In the discrete case the conditional pmf is
      $p_{X \mid Y}(x \mid y) = p(x,y)/p_Y(y)$ for every $y$ with $p_Y(y) > 0$,
      which is the law of $X$ given the event $\{Y = y\}$. In the continuous case
      that event has probability $0$, so the conditional density is defined by
      the same ratio $f_{X \mid Y}(x \mid y) = f(x,y)/f_Y(y)$ wherever
      $f_Y(y) > 0$; it is a genuine density in $x$ for each fixed $y$, integrating
      to $1$. Reversing the ratio gives the continuous chain rule
      $f(x,y) = f_{X \mid Y}(x \mid y) f_Y(y)$, the standard way to build a joint
      law from a hierarchy ("draw $Y$, then draw $X$ given $Y$").
    summary: >
      Slice the joint law at $Y = y$ and renormalise — a whole distribution for
      $X$ attached to each value of $Y$, densities included.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-given-event
      - quant-probability.joint.joint-law
    relates: []
    tags: []

  - id: quant-probability.conditioning.conditional-expectation
    kind: definition
    prominence: 2
    title: "Conditional expectation E[X|Y]"
    statement: >
      Assume $\mathbb{E}|X| < \infty$. For each $y$, $g(y) = \mathbb{E}[X \mid Y = y]$
      is a number obtained by averaging $x$ against the conditional law
      $p_{X \mid Y}(\cdot \mid y)$ or $f_{X \mid Y}(\cdot \mid y)$. The
      conditional expectation $\mathbb{E}[X \mid Y] = g(Y)$ is then a random
      variable: a function of $Y$ alone, unknown until $Y$ is observed. Keep the
      two apart — $\mathbb{E}[X \mid Y = 3]$ is a number you can quote,
      $\mathbb{E}[X \mid Y]$ is a forecast that moves with the data. It is defined
      only up to values of $y$ that $Y$ never takes.
    summary: >
      Your best estimate of $X$ once $Y$ is known, packaged as a function of $Y$ —
      a random variable, not a constant.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-distribution
    relates: []
    tags: []

  - id: quant-probability.conditioning.conditional-expectation-rules
    kind: proposition
    prominence: 1
    title: "Algebra of conditional expectation"
    statement: >
      With all means finite: (1) linearity,
      $\mathbb{E}[aX + bZ \mid Y] = a\mathbb{E}[X \mid Y] + b\mathbb{E}[Z \mid Y]$;
      (2) taking out what is known, $\mathbb{E}[h(Y)X \mid Y]
      = h(Y)\mathbb{E}[X \mid Y]$ whenever $\mathbb{E}|h(Y)X| < \infty$, since
      given $Y$ the factor $h(Y)$ is a constant; (3) if $X$ and $Y$ are
      independent then $\mathbb{E}[X \mid Y] = \mathbb{E}[X]$, a constant — knowing
      $Y$ tells you nothing; (4) $\mathbb{E}[h(Y) \mid Y] = h(Y)$, so anything
      already determined by $Y$ passes through untouched. These four rules do
      almost all the work in practice.
    summary: >
      Conditional expectation is linear, treats functions of $Y$ as constants,
      collapses to $\mathbb{E}[X]$ under independence, and fixes functions of $Y$.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-expectation
    relates: []
    tags: []

  - id: quant-probability.conditioning.indicator-conditional
    kind: proposition
    prominence: 0
    title: "Conditional probability is a conditional expectation"
    statement: >
      For an event $A$, $\mathbb{E}[\mathbf{1}\{A\} \mid Y] = \Pr(A \mid Y)$, the
      random variable whose value at $Y = y$ is $\Pr(A \mid Y = y)$. Everything
      proved about conditional expectations therefore applies verbatim to
      conditional probabilities; there is no separate theory. This is the reason
      an interviewer's "what is the chance of $A$?" and "what is the expected
      number of $A$-type events?" respond to exactly the same conditioning moves —
      write the probability as the mean of an indicator, condition, and average
      back.
    summary: >
      $\Pr(A \mid Y)$ is just $\mathbb{E}[\mathbf{1}\{A\} \mid Y]$, so every tool
      for conditional means is a tool for conditional probabilities.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-expectation
    relates: []
    tags: []

  - id: quant-probability.conditioning.tower
    kind: theorem
    prominence: 2
    title: "Tower property (law of iterated expectations)"
    statement: >
      If $\mathbb{E}|X| < \infty$ then
      $\mathbb{E}[\mathbb{E}[X \mid Y]] = \mathbb{E}[X]$. Averaging the
      conditional forecasts over the distribution of $Y$ returns the
      unconditional mean; a forecast cannot be biased on average. For discrete
      $Y$ this is the law of total expectation,
      $\mathbb{E}[X] = \sum_y \mathbb{E}[X \mid Y = y]\Pr(Y = y)$, and applying it
      to $X = \mathbf{1}\{A\}$ reproduces the law of total probability. Worked: a
      fair coin decides whether you roll a $6$-sided or a $20$-sided fair die, so
      $\mathbb{E}[\text{score}] = 0.5 \cdot 3.5 + 0.5 \cdot 10.5 = 7$.
    summary: >
      Average the conditional averages and you recover the plain average — the
      single most useful identity in sequential probability.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-expectation
      - quant-probability.conditional.total-probability
    relates: []
    tags: []

  - id: quant-probability.conditioning.tower-nested
    kind: corollary
    prominence: 0
    title: "Nested conditioning: the coarser information wins"
    statement: >
      For integrable $X$,
      $\mathbb{E}[\mathbb{E}[X \mid Y, Z] \mid Y] = \mathbb{E}[X \mid Y]$.
      Forecasting with the finer information $(Y,Z)$ and
      then averaging out $Z$ leaves the coarser forecast: you cannot manufacture
      information by conditioning on more and then throwing it away. The plain
      tower property is the case where the outer conditioning is on nothing at
      all. Practical use: build the answer in stages, conditioning on whatever
      makes the innermost expectation trivial, then peel the layers off from the
      inside out.
    summary: >
      Conditioning on more and averaging back down to less returns the coarser
      conditional expectation — the smoothing rule behind multi-stage arguments.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.tower
    relates: []
    tags: []

  - id: quant-probability.conditioning.conditional-variance
    kind: definition
    prominence: 1
    title: "Conditional variance Var(X|Y)"
    statement: >
      Assume $\mathbb{E}[X^{2}] < \infty$. Then
      $\operatorname{Var}(X \mid Y)
      = \mathbb{E}[(X - \mathbb{E}[X \mid Y])^{2} \mid Y]
      = \mathbb{E}[X^{2} \mid Y] - (\mathbb{E}[X \mid Y])^{2}$, the second form
      being the one you compute. Like $\mathbb{E}[X \mid Y]$ it is a random
      variable, a function of $Y$, and it is nonnegative for every value of $Y$.
      It measures the uncertainty about $X$ that survives after $Y$ is revealed —
      the residual risk of a position once the regime is known. If $X$ and $Y$ are
      independent it collapses to the constant $\operatorname{Var}(X)$.
    summary: >
      The leftover spread of $X$ once $Y$ is known, itself a random function of
      $Y$ — computed as $\mathbb{E}[X^{2}\mid Y]$ minus the squared conditional
      mean.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-expectation
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.conditioning.total-variance
    kind: theorem
    prominence: 2
    title: "Law of total variance"
    statement: >
      If $\mathbb{E}[X^{2}] < \infty$ then
      $\operatorname{Var}(X) = \mathbb{E}[\operatorname{Var}(X \mid Y)]
      + \operatorname{Var}(\mathbb{E}[X \mid Y])$. Read it as
      within-group plus between-group variation: the average spread inside each
      value of $Y$, plus the spread of the group means. Proof: expand
      $\operatorname{Var}(X) = \mathbb{E}[X^{2}] - (\mathbb{E}[X])^{2}$ and apply
      the tower property to both terms. Both summands are nonnegative, which
      already yields the useful bounds
      $\operatorname{Var}(\mathbb{E}[X \mid Y]) \le \operatorname{Var}(X)$ and
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] \le \operatorname{Var}(X)$.
    summary: >
      Total risk splits into the risk left after knowing $Y$ plus the risk in the
      conditional forecast itself — within-group plus between-group variance.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-variance
      - quant-probability.conditioning.tower
    relates: []
    tags: []

  - id: quant-probability.conditioning.best-predictor
    kind: proposition
    prominence: 1
    title: "E[X|Y] is the best mean-square predictor"
    statement: >
      Let $\mathbb{E}[X^{2}] < \infty$. Among all functions $g$ with
      $\mathbb{E}[g(Y)^{2}] < \infty$, the choice $g(Y) = \mathbb{E}[X \mid Y]$
      uniquely minimises $\mathbb{E}[(X - g(Y))^{2}]$, and the minimum value is
      $\mathbb{E}[\operatorname{Var}(X \mid Y)]$. Proof: write
      $X - g(Y) = (X - \mathbb{E}[X \mid Y]) + (\mathbb{E}[X \mid Y] - g(Y))$; the
      cross-term vanishes because the residual is orthogonal to every function of
      $Y$, that is $\mathbb{E}[(X - \mathbb{E}[X \mid Y])h(Y)] = 0$. No linearity
      is assumed — this is the best predictor of any shape, which is why
      regression is only an approximation to it.
    summary: >
      Under squared-error loss no function of $Y$ beats $\mathbb{E}[X \mid Y]$,
      and the error you are left with is $\mathbb{E}[\operatorname{Var}(X\mid Y)]$.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.total-variance
      - quant-probability.conditioning.conditional-expectation-rules
    relates:
      - id: quant-probability.joint.bivariate-normal
        note: >
          The bivariate normal is the case where the best predictor happens to be
          linear, $\mathbb{E}[X \mid Y] = \mu_X + \rho(\sigma_X/\sigma_Y)(Y -
          \mu_Y)$, so regression loses nothing there and generally does.
    tags: []

  - id: quant-probability.conditioning.projection-view
    kind: intuition
    prominence: 0
    title: "Conditional expectation as a projection"
    statement: >
      Treat square-integrable random variables as vectors with inner product
      $\langle U, V \rangle = \mathbb{E}[UV]$. The functions of $Y$ form a
      subspace, and $\mathbb{E}[X \mid Y]$ is the orthogonal projection of $X$ onto
      it: the residual $X - \mathbb{E}[X \mid Y]$ is perpendicular to that whole
      subspace. Every property falls out of the picture — linearity of projection,
      idempotence ($\mathbb{E}[\mathbb{E}[X \mid Y] \mid Y]$ changes nothing),
      nested conditioning as projecting onto a subspace of a subspace, and
      Pythagoras as the law of total variance. Linear regression is the same
      projection onto the smaller subspace of affine functions of $Y$.
    summary: >
      Geometry for the whole subbranch: conditioning is orthogonal projection onto
      the functions of $Y$, and total variance is the Pythagorean theorem.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.best-predictor
    relates: []
    tags: []

  - id: quant-probability.conditioning.conditioning-reduces-variance
    kind: intuition
    prominence: 0
    title: "Information reduces uncertainty on average"
    statement: >
      Total variance gives
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] \le \operatorname{Var}(X)$: on
      average, learning $Y$ leaves you less uncertain about $X$, and strictly so
      unless $\mathbb{E}[X \mid Y]$ is constant. The averaging matters — a
      particular realisation can hurt, and $\operatorname{Var}(X \mid Y = y)$ may
      well exceed $\operatorname{Var}(X)$ for some $y$; a signal that usually
      resolves the picture can occasionally land you in the murkiest regime. The
      trading reading: a forecast is worth having when
      $\operatorname{Var}(\mathbb{E}[X \mid Y])$ is a large share of
      $\operatorname{Var}(X)$, since that share is exactly the variance the
      forecast explains.
    summary: >
      Conditioning cannot raise expected uncertainty, though an unlucky value of
      the signal can raise it — the explained share is what makes a signal
      valuable.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.total-variance
    relates: []
    tags: []

  - id: quant-probability.conditioning.condition-first-step
    kind: technique
    prominence: 1
    title: "Condition on the first thing that happens"
    statement: >
      Reach for this when a quantity is defined by a process that unfolds in
      stages. Mechanics: (1) pick the natural first event $Y$ — the first toss,
      the first draw, which clock rings first; (2) enumerate its outcomes and
      their probabilities; (3) evaluate the target conditionally on each outcome,
      using whatever structure makes the remainder easy; (4) recombine with the
      tower property. Worked: two players alternately toss a fair coin, first head
      wins, and $p$ is the chance the starter wins. Conditioning on toss one,
      $p = 1/2 + (1/2)(1 - p)$, because after a tail the opponent becomes the
      starter, so $p = 2/3$. Multi-state versions produce a linear system of
      recurrences, solved with the recurrence toolkit.
    summary: >
      Split on the first event, write each branch's conditional value, average by
      the tower — the alternating-coin game gives the starter $2/3$ in one line.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.tower
    relates:
      - id: quant-probability.discrete.geometric
        note: >
          The geometric law is the reason this move closes: after a failed first
          trial the process restarts identically, so the conditional value is the
          original unknown and one equation suffices.
    tags: []

  - id: quant-probability.conditioning.random-sums
    kind: proposition
    prominence: 1
    title: "Mean and variance of a random sum"
    statement: >
      Let $X_1, X_2, \dots$ be iid with mean $\mu$ and variance $\sigma^{2}$, let
      $N \ge 0$ be integer-valued with finite mean and variance, and let $N$ be
      independent of the whole sequence. For $S = X_1 + \dots + X_N$ (with
      $S = 0$ when $N = 0$), conditioning on $N$ gives
      $\mathbb{E}[S \mid N] = N\mu$ and
      $\operatorname{Var}(S \mid N) = N\sigma^{2}$, so
      $\mathbb{E}[S] = \mathbb{E}[N]\mu$ and
      $\operatorname{Var}(S) = \mathbb{E}[N]\sigma^{2}
      + \operatorname{Var}(N)\mu^{2}$. The second term is what a fixed count
      misses. Independence of $N$ is essential; counts chosen by a stopping rule
      that peeks at the $X_i$ need the martingale version.
    summary: >
      $\mathbb{E}[S] = \mathbb{E}[N]\mathbb{E}[X]$ and $\operatorname{Var}(S)
      = \mathbb{E}[N]\operatorname{Var}(X) + \operatorname{Var}(N)(\mathbb{E}
      [X])^{2}$ — randomness in the count adds its own variance term.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.total-variance
      - quant-probability.conditioning.condition-first-step
    relates: []
    tags: []

  - id: quant-probability.conditioning.random-sums-desk
    kind: example
    prominence: 0
    title: "Daily P&L of a desk with a random trade count"
    statement: >
      A desk does $N$ trades a day with $\mathbb{E}[N] = 100$ and
      $\operatorname{Var}(N) = 100$; each trade's P&L is independent of the count
      and of the others, with mean $\mu = 2$ dollars and standard deviation
      $\sigma = 10$ dollars. Then $\mathbb{E}[S] = 100 \cdot 2 = 200$ dollars and
      $\operatorname{Var}(S) = 100 \cdot 100 + 100 \cdot 4 = 10400$, so the daily
      standard deviation is $\sqrt{10400} \approx 102$ dollars. Note the split:
      $10000$ of the variance comes from trade-level noise and only $400$ from the
      uncertain count. Had the count been fixed at $100$ the standard deviation
      would be $100$ — the random count costs about $2\%$ of extra spread here.
    summary: >
      An expected $200$ dollars a day with a standard deviation near $102$ — a
      worked random sum showing how little a Poisson-sized count adds to
      trade-level noise.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.random-sums
    relates: []
    tags: []

  - id: quant-probability.conditioning.truncated-mean
    kind: example
    prominence: 1
    title: "E[X | X > t] for exponential and uniform"
    statement: >
      For $X \sim \operatorname{Exp}(\lambda)$, $\Pr(X > t + s \mid X > t)
      = e^{-\lambda s}$, so the overshoot $X - t$ given $\{X > t\}$ is again
      $\operatorname{Exp}(\lambda)$ and
      $\mathbb{E}[X \mid X > t] = t + 1/\lambda$. With a mean waiting time of $10$
      minutes and $t = 15$ minutes already elapsed, the expected total wait is
      $25$ minutes — the past buys you nothing. The uniform behaves oppositely:
      conditioning $U \sim \operatorname{Uniform}(0,1)$ on $\{U > t\}$ leaves a
      uniform on $(t,1)$, so $\mathbb{E}[U \mid U > t] = (1+t)/2$, which is $0.8$
      at $t = 0.6$; the remaining wait $(1-t)/2$ shrinks as you wait.
    summary: >
      Exponential: $t + 1/\lambda$, the residual wait never shrinks. Uniform:
      $(1+t)/2$, the residual wait halves away with every minute of waiting.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-given-event
      - quant-probability.continuous.exponential
    relates:
      - id: quant-probability.continuous.memoryless-exponential
        note: >
          Memorylessness is exactly the statement that the conditional law of the
          overshoot does not depend on $t$, which is what pins the truncated mean
          at $t + 1/\lambda$ rather than something smaller.
    tags: []

  - id: quant-probability.conditioning.regime-mixture
    kind: example
    prominence: 0
    title: "Variance of a two-regime P&L"
    statement: >
      A day is quiet with probability $0.8$, giving P&L of mean $1$ and standard
      deviation $2$, and busy with probability $0.2$, giving mean $5$ and standard
      deviation $6$. Then $\mathbb{E}[X] = 0.8(1) + 0.2(5) = 1.8$. Within-group:
      $\mathbb{E}[\operatorname{Var}(X \mid Y)] = 0.8(4) + 0.2(36) = 10.4$.
      Between-group: $\mathbb{E}[X \mid Y]$ takes the values $1$ and $5$, so
      $\operatorname{Var}(\mathbb{E}[X \mid Y]) = 0.8 \cdot 0.2 \cdot (5-1)^{2}
      = 2.56$. Total $\operatorname{Var}(X) = 12.96$ and the standard deviation is
      exactly $3.6$. Averaging the two variances alone would have given $10.4$ and
      understated the risk by a fifth.
    summary: >
      Mixing regimes gives standard deviation $3.6$, not the $3.22$ you get from
      averaging variances — the spread between regime means is real risk.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.total-variance
    relates: []
    tags: []

  - id: quant-probability.conditioning.exchangeable-share
    kind: proposition
    prominence: 1
    title: "Conditioning a summand on its total"
    statement: >
      If $X_1, \dots, X_n$ are exchangeable — in particular iid — and
      $S = X_1 + \dots + X_n$ has finite mean, then symmetry makes every
      $\mathbb{E}[X_i \mid S]$ equal, and their sum is $\mathbb{E}[S \mid S] = S$,
      so $\mathbb{E}[X_i \mid S] = S/n$. No distributional computation is needed.
      Worked: for two fair dice, $\mathbb{E}[X \mid X + Y = 8] = 4$, and for $n$
      iid variables summing to a known total each contributes its equal share. The
      hypothesis is exchangeability, not independence, and the conclusion is
      special to the sum — conditioning on $\max(X,Y)$ or on $X - Y$ gives no such
      clean split.
    summary: >
      Given the total, each exchangeable summand has conditional mean $S/n$ — the
      first of two dice averages $4$ given a sum of $8$.
    parent: quant-probability.conditioning
    also_under: []
    requires:
      - quant-probability.conditioning.conditional-expectation-rules
    relates:
      - id: quant-probability.conditional.symmetry-exchangeability
        note: >
          Same symmetry principle one level up: there it makes card positions
          interchangeable, here it makes the conditional means of the summands
          interchangeable given their total.
    tags: []
