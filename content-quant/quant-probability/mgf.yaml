# quant-probability.mgf — Generating Functions & Transforms
# Outline node (14 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-probability.mgf
    kind: subbranch
    title: "Generating Functions & Transforms"
    summary: >
      PGFs and MGFs — turning convolution into multiplication and
      reading moments off derivatives.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.mgf.pgf
    kind: definition
    prominence: 1
    title: "Probability generating function"
    statement: >
      For $X$ taking values in $\{0,1,2,\dots\}$ with $p_k = \Pr(X = k)$, the
      probability generating function is
      $G_X(s) = \mathbb{E}[s^{X}] = \sum_{k \ge 0} p_k s^{k}$, a LOTUS
      computation with $g(x) = s^{x}$. Since $\sum_k p_k = 1$ the series has
      radius of convergence at least $1$, so $G_X$ is finite and infinitely
      differentiable on $(-1,1)$ and continuous on $[-1,1]$. Two readings come
      free: $G_X(0) = p_0$ and $G_X(1) = 1$, the latter being the first check to
      run on any candidate PGF. A fair die scored $1$ to $6$ has
      $G(s) = (s + s^{2} + s^{3} + s^{4} + s^{5} + s^{6})/6$. The point is
      storage: the entire pmf sits in one function of a dummy variable $s$.
    summary: >
      The power series $\mathbb{E}[s^{X}]$ whose coefficients are exactly the
      probabilities — the whole law of a count packed into one function.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.expectation.lotus
    relates: []
    tags: []

  - id: quant-probability.mgf.pgf-probabilities
    kind: proposition
    prominence: 0
    title: "Reading probabilities off a PGF"
    statement: >
      Because $G_X(s) = \sum_{k \ge 0} p_k s^{k}$ is a power series, its
      coefficients are recovered by differentiating at $0$:
      $\Pr(X = k) = G_X^{(k)}(0)/k!$. In practice you expand and read the
      coefficient rather than differentiate. Worked: three independent fair
      coins give $G(s) = ((1+s)/2)^{3} = (1 + 3s + 3s^{2} + s^{3})/8$, so
      $\Pr(X = 2) = 3/8$; by derivative, $G''(s) = 6(1+s)/8$ and
      $G''(0)/2! = (3/4)/2 = 3/8$. Two shortcuts worth carrying:
      $\Pr(X = 0) = G_X(0)$, and the parity trick
      $\Pr(X \text{ is even}) = (G_X(1) + G_X(-1))/2 = (1 + G_X(-1))/2$, which
      answers "is the count even?" without touching the pmf.
    summary: >
      Coefficients are probabilities: $p_k = G^{(k)}(0)/k!$, with $G(-1)$
      throwing in the odd-versus-even split for free.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.pgf
    relates: []
    tags: []

  - id: quant-probability.mgf.pgf-factorial-moments
    kind: proposition
    prominence: 1
    title: "Factorial moments from derivatives at 1"
    statement: >
      Differentiating $G_X(s) = \sum_k p_k s^{k}$ term by term and letting
      $s \uparrow 1$ produces the factorial moments:
      $G_X'(1) = \mathbb{E}[X]$, $G_X''(1) = \mathbb{E}[X(X-1)]$, and generally
      $G_X^{(r)}(1) = \mathbb{E}[X(X-1)\cdots(X-r+1)]$. Each side is a monotone
      limit of nonnegative terms, so the identity holds in $[0,\infty]$ and the
      derivative is finite exactly when the moment is. Variance follows from the
      first two: $\operatorname{Var}(X) = G_X''(1) + G_X'(1) - (G_X'(1))^{2}$.
      Worked, Poisson$(\lambda)$ with $G(s) = e^{\lambda(s-1)}$: $G'(1)=\lambda$
      and $G''(1) = \lambda^{2}$, so the mean is $\lambda$ and the variance is
      $\lambda^{2} + \lambda - \lambda^{2} = \lambda$.
    summary: >
      Derivatives at $s=1$ give $\mathbb{E}[X]$, $\mathbb{E}[X(X-1)]$ and so on,
      which is usually the cheapest route to mean and variance.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.pgf
    relates: []
    tags: []

  - id: quant-probability.mgf.standard-pgfs
    kind: proposition
    prominence: 1
    title: "PGFs of the named discrete laws"
    statement: >
      Write $q = 1-p$. Bernoulli$(p)$: $q + ps$. Binomial$(n,p)$: $(q+ps)^{n}$.
      Geometric$(p)$ counted as the trial of the first success, on
      $\{1,2,\dots\}$: $\sum_{k \ge 1} q^{k-1}p\,s^{k} = ps/(1-qs)$, summed by
      the geometric series and valid for $|s| < 1/q$. Negative binomial with $r$
      successes: $(ps/(1-qs))^{r}$. Poisson$(\lambda)$:
      $\sum_{k \ge 0} e^{-\lambda}\lambda^{k}s^{k}/k! = e^{\lambda(s-1)}$.
      Discrete uniform on $\{1,\dots,n\}$:
      $(s + s^{2} + \cdots + s^{n})/n = s(1-s^{n})/(n(1-s))$. Every entry is one
      line of algebra from the pmf, and every entry equals $1$ at $s = 1$, which
      is the sanity check.
    summary: >
      The short table — Bernoulli, binomial, geometric, negative binomial,
      Poisson and discrete uniform — each derived in a line from its pmf.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.pgf
      - quant-tools.series-calculus.geometric-series
      - quant-probability.discrete.poisson
    relates: []
    tags: []

  - id: quant-probability.mgf.pgf-sums
    kind: proposition
    prominence: 1
    title: "PGF of a sum of independents"
    statement: >
      If $X$ and $Y$ are independent and take values in $\{0,1,2,\dots\}$, then
      $s^{X}$ and $s^{Y}$ are independent functions of them, so
      $G_{X+Y}(s) = \mathbb{E}[s^{X}s^{Y}] = G_X(s)\,G_Y(s)$ wherever both
      series converge; for $n$ independent copies of $X$,
      $G_{S_n}(s) = G_X(s)^{n}$. Extracting the coefficients afterwards is
      exactly the convolution $\Pr(X+Y=m) = \sum_k \Pr(X=k)\Pr(Y=m-k)$, but
      multiplying two polynomials beats convolving two lists by hand. Worked:
      two fair dice give $G(s)^{2} = s^{2}(1+s+\cdots+s^{5})^{2}/36$, whose
      $s^{7}$ coefficient is $6/36 = 1/6$, the familiar chance of a seven.
    summary: >
      Independence turns the convolution of two count distributions into an
      ordinary product of polynomials.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.pgf
    relates: []
    tags: []

  - id: quant-probability.mgf.loaded-dice
    kind: example
    prominence: 1
    title: "No two loaded dice give a uniform sum"
    statement: >
      Two independent six-sided dice are loaded however you like, each face
      $1$ to $6$ carrying any weights. Can the sum be uniform on
      $\{2,3,\dots,12\}$, every total with probability $1/11$? No. Write
      $G_i(s) = s\,h_i(s)$ with $h_i$ a real polynomial of degree at most $5$;
      the target is
      $G_1G_2 = (s^{2}+\cdots+s^{12})/11 = s^{2}(1+s+\cdots+s^{10})/11$.
      Matching degrees, $\deg h_1 + \deg h_2 = 10$ with each at most $5$, so
      both equal $5$. A real polynomial of odd degree has a real root $r$, so
      $h_1(r)h_2(r) = 0$; but $1+s+\cdots+s^{10} = (s^{11}-1)/(s-1)$ vanishes
      only at eleventh roots of unity other than $1$, none of which are real.
      Contradiction — no loading works.
    summary: >
      The interview classic, settled by a root count: the eleven-term uniform
      polynomial has no real roots, while any two dice factors must supply one.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.pgf-sums
    relates:
      - id: quant-probability.discrete.uniform-discrete
        note: >
          The target law is the discrete uniform on the eleven possible totals;
          it is that law's generating polynomial whose lack of real roots
          blocks any factorization into two dice.
    tags: []

  - id: quant-probability.mgf.sicherman-dice
    kind: example
    prominence: 0
    title: "Sicherman dice: relabelling that preserves the sum"
    statement: >
      The same factorization that forbids a uniform sum permits one genuine
      relabelling. A standard die has
      $G(s) = s(1+s)(1+s+s^{2})(1-s+s^{2})$, so a pair has $G(s)^{2}$, and any
      other split of those factors into two polynomials with nonnegative
      integer coefficients and positive faces gives the same sum law. Splitting
      as $s(1+s)(1+s+s^{2}) = s + 2s^{2} + 2s^{3} + s^{4}$ and
      $s(1+s)(1+s+s^{2})(1-s+s^{2})^{2} = s + s^{3} + s^{4} + s^{5} + s^{6}
      + s^{8}$ gives faces $\{1,2,2,3,3,4\}$ and $\{1,3,4,5,6,8\}$. Every total
      from $2$ to $12$ keeps its usual probability — a seven still arrives with
      probability $1/6$.
    summary: >
      Two oddly numbered dice reproduce the standard sum distribution exactly,
      found by regrouping the factors of the die's generating polynomial.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.loaded-dice
    relates: []
    tags: []

  - id: quant-probability.mgf.pgf-random-sums
    kind: proposition
    prominence: 1
    title: "Compounding is composition of PGFs"
    statement: >
      Let $N, X_1, X_2, \dots$ be independent and nonnegative-integer valued
      with the $X_i$ identically distributed, and set
      $S = X_1 + \cdots + X_N$, the empty sum being $0$. Conditioning on $N$
      gives $\mathbb{E}[s^{S} \mid N] = G_X(s)^{N}$, so
      $G_S(s) = G_N(G_X(s))$: a random number of summands composes the two
      generating functions. Differentiating at $s = 1$ by the chain rule
      returns $\mathbb{E}[S] = \mathbb{E}[N]\,\mathbb{E}[X]$. Worked:
      $N \sim$ Poisson$(\lambda)$ with each $X_i$ Bernoulli$(p)$ gives
      $G_S(s) = e^{\lambda(q + ps - 1)} = e^{\lambda p(s-1)}$, so
      $S \sim$ Poisson$(\lambda p)$ — Poisson thinning in one line.
    summary: >
      For a randomly stopped sum of counts the PGFs compose,
      $G_S = G_N \circ G_X$, which reproduces $\mathbb{E}[S]$ and identifies
      thinned Poissons instantly.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.pgf-sums
    relates:
      - id: quant-probability.conditioning.random-sums
        note: >
          Composition of generating functions is the transform version of the
          conditioning argument there, and differentiating it twice regenerates
          the mean and variance formulas for a randomly stopped sum.
    tags: []

  - id: quant-probability.mgf.mgf
    kind: definition
    prominence: 2
    title: "Moment generating function"
    statement: >
      The moment generating function of a real random variable $X$ is
      $M_X(t) = \mathbb{E}[e^{tX}]$, computed by LOTUS and defined at those real
      $t$ where the expectation is finite. Always $M_X(0) = 1$, and by convexity
      of $e^{tx}$ the set where $M_X$ is finite is an interval containing $0$ —
      possibly the single point $t = 0$. The standing hypothesis for everything
      built on the MGF is that $M_X(t) < \infty$ for all $|t| < h$ for some
      $h > 0$; call that "the MGF exists in a neighbourhood of $0$". For a
      nonnegative-integer $X$ the two transforms are one object in different
      coordinates, $M_X(t) = G_X(e^{t})$. Worked: Bernoulli$(p)$ has
      $M_X(t) = 1 - p + pe^{t}$, finite for every $t$.
    summary: >
      $\mathbb{E}[e^{tX}]$, the transform that encodes every moment — provided
      it is finite on an interval around $t = 0$, which is a real assumption.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-tools.series-calculus.taylor
    relates: []
    tags: []

  - id: quant-probability.mgf.mgf-moments
    kind: proposition
    prominence: 1
    title: "Moments from derivatives at 0"
    statement: >
      Suppose $M_X(t) < \infty$ for $|t| < h$ with $h > 0$. Then all moments of
      $X$ are finite, $M_X$ is infinitely differentiable on $(-h,h)$,
      differentiation passes inside the expectation, and
      $M_X^{(k)}(0) = \mathbb{E}[X^{k}]$ — the property the name refers to.
      Equivalently $M_X(t) = \sum_{k \ge 0} \mathbb{E}[X^{k}]\,t^{k}/k!$ there,
      so moments are just Taylor coefficients. Worked, exponential with rate
      $\lambda$: $M(t) = \lambda/(\lambda - t)$ for $t < \lambda$, so
      $M'(t) = \lambda/(\lambda-t)^{2}$ and $M''(t) = 2\lambda/(\lambda-t)^{3}$,
      giving $\mathbb{E}[X] = 1/\lambda$, $\mathbb{E}[X^{2}] = 2/\lambda^{2}$
      and variance $1/\lambda^{2}$. The cumulant generating function
      $K_X = \ln M_X$ is often faster: $K_X'(0) = \mathbb{E}[X]$ and
      $K_X''(0) = \operatorname{Var}(X)$.
    summary: >
      Differentiate $k$ times at $0$ to get $\mathbb{E}[X^{k}]$; taking logs
      first hands you the mean and variance directly.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.mgf
    relates: []
    tags: []

  - id: quant-probability.mgf.mgf-scaling
    kind: proposition
    prominence: 0
    title: "MGF under affine maps"
    statement: >
      Affine maps act on the MGF by a factor and a rescale of $t$:
      $M_{aX+b}(t) = e^{bt}M_X(at)$, finite exactly when $at$ lies in the
      domain of $M_X$. Standardizing, $Z = (X-\mu)/\sigma$ has
      $M_Z(t) = e^{-\mu t/\sigma}M_X(t/\sigma)$. This is how one computation
      covers the whole normal family: completing the square in the Gaussian
      integral gives $M_Z(t) = e^{t^{2}/2}$ for standard normal $Z$, and
      $X = \mu + \sigma Z$ then has
      $M_X(t) = e^{\mu t}e^{\sigma^{2}t^{2}/2} = \exp(\mu t + \sigma^{2}
      t^{2}/2)$. The mirror rule $M_{-X}(t) = M_X(-t)$ says a law symmetric
      about $0$ has an even MGF.
    summary: >
      $M_{aX+b}(t) = e^{bt}M_X(at)$ — shift and scale are free, which is why
      standardizing one member of a family gives the whole family.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.mgf
    relates: []
    tags: []

  - id: quant-probability.mgf.mgf-sums
    kind: proposition
    prominence: 2
    title: "MGF of a sum of independents"
    statement: >
      Let $X$ and $Y$ be independent with MGFs finite on a common interval
      $|t| < h$. Then $e^{tX}$ and $e^{tY}$ are independent, so
      $M_{X+Y}(t) = \mathbb{E}[e^{tX}e^{tY}]
      = \mathbb{E}[e^{tX}]\,\mathbb{E}[e^{tY}] = M_X(t)M_Y(t)$ on that
      interval; for $n$ independent copies, $M_{S_n}(t) = M_X(t)^{n}$, and
      cumulant generating functions simply add, which is why cumulants of a sum
      are sums of cumulants. This is the payoff of the whole subject: the
      convolution defining the law of a sum becomes a product. Two cautions —
      independence is used, not merely zero correlation, and the converse
      fails, since $M_{X+Y} = M_XM_Y$ does not force independence.
    summary: >
      Independent summands multiply their MGFs, converting convolution into
      multiplication and additive families into one line of algebra.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.mgf
      - quant-probability.joint.independence-rvs
    relates:
      - id: quant-probability.joint.convolution
        note: >
          Same operation seen from two sides: the convolution sum or integral
          for the law of a sum is precisely what multiplication of transforms
          performs without any integration.
    tags: []

  - id: quant-probability.mgf.standard-mgfs
    kind: proposition
    prominence: 1
    title: "MGFs of the named laws"
    statement: >
      Write $q = 1-p$; these are expected cold. Bernoulli$(p)$: $q + pe^{t}$,
      all $t$. Binomial$(n,p)$: $(q+pe^{t})^{n}$, all $t$. Poisson$(\lambda)$:
      $\exp(\lambda(e^{t}-1))$, all $t$. Geometric$(p)$ on $\{1,2,\dots\}$:
      $pe^{t}/(1-qe^{t})$, for $t < \ln(1/q)$ only. Exponential$(\lambda)$:
      $\lambda/(\lambda-t)$, for $t < \lambda$. Gamma with shape $n$ and rate
      $\lambda$: $(\lambda/(\lambda-t))^{n}$, for $t < \lambda$.
      Normal$(\mu,\sigma^{2})$: $\exp(\mu t + \sigma^{2}t^{2}/2)$, all $t$.
      Notice which domains are one-sided: the exponential and geometric MGFs
      blow up as soon as $t$ reaches the rate at which their tails decay, and
      that is the general pattern rather than an accident.
    summary: >
      The lookup table for Bernoulli, binomial, Poisson, geometric,
      exponential, gamma and normal, with the domain restrictions that matter.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.mgf
      - quant-probability.continuous.normal
    relates: []
    tags: []

  - id: quant-probability.mgf.identification
    kind: proposition
    prominence: 2
    title: "Uniqueness: a transform identifies the law"
    statement: >
      Stated, not proved — the proof is an inversion argument. If $X$ and $Y$
      have MGFs that are finite and equal for all $|t| < h$ with some $h > 0$,
      then $X$ and $Y$ have the same distribution. The PGF version is easier
      and needs no extra hypothesis: if $G_X = G_Y$ on any interval inside
      $(-1,1)$ then $p_k = q_k$ for every $k$, because a power series
      determines its coefficients. Hence the working recipe: compute the
      transform of the thing you care about, match it against the table, and
      name the law. The hypothesis is not decoration — having every moment
      finite is strictly weaker, and the lognormal has all moments finite, no
      MGF for $t > 0$, and other laws sharing its entire moment sequence.
    summary: >
      Two variables with the same MGF near $0$ have the same distribution, so
      recognizing a transform is a complete identification of the law.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.pgf
      - quant-probability.mgf.mgf
    relates: []
    tags: []

  - id: quant-probability.mgf.additive-families
    kind: example
    prominence: 1
    title: "Sums of named laws by multiplying MGFs"
    statement: >
      Three staples, each done by multiplying MGFs and reading the product off
      the table. Poisson: $X \sim$ Poisson$(2)$ and $Y \sim$ Poisson$(3)$
      independent give
      $M_{X+Y}(t) = e^{2(e^{t}-1)}e^{3(e^{t}-1)} = e^{5(e^{t}-1)}$, so
      $X+Y \sim$ Poisson$(5)$ and $\Pr(X+Y = 0) = e^{-5} \approx 0.0067$.
      Normal: $X \sim N(1,4)$ and $Y \sim N(3,9)$ independent give
      $\exp(t + 2t^{2})\exp(3t + 4.5t^{2}) = \exp(4t + 6.5t^{2})$, which is
      $N(4,13)$, standard deviation $\sqrt{13} \approx 3.61$. Exponential: $n$
      independent Exp$(\lambda)$ variables have product MGF
      $(\lambda/(\lambda-t))^{n}$, the gamma of shape $n$, with mean
      $n/\lambda$.
    summary: >
      Poisson$(2)$ plus Poisson$(3)$ is Poisson$(5)$, $N(1,4)$ plus $N(3,9)$ is
      $N(4,13)$, and $n$ exponentials make a gamma — each in one multiplication.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.mgf-sums
      - quant-probability.mgf.standard-mgfs
      - quant-probability.mgf.identification
    relates: []
    tags: []

  - id: quant-probability.mgf.mgf-nonexistence
    kind: proposition
    prominence: 0
    title: "When the MGF is infinite"
    statement: >
      Finiteness of $M_X$ near $0$ is equivalent to exponentially light tails,
      so it is a real assumption. If $M_X(t) < \infty$ for some $t > 0$, then
      applying Markov's inequality to $e^{tX}$ gives
      $\Pr(X > x) \le e^{-tx}M_X(t)$, an exponentially decaying bound;
      optimizing it over $t$ is the Chernoff argument taken up with the
      probability inequalities. Contrapositive: any law with a heavier tail has
      $M_X(t) = \infty$ for every $t > 0$ — the lognormal, the Pareto and
      Student's $t$ all fail on the right, the Cauchy on both sides.
      Conversely, finiteness on $(-h,h)$ forces $\mathbb{E}|X|^{k} < \infty$
      for every $k$, since $|x|^{k} \le k!\,e^{h|x|}/h^{k}$.
    summary: >
      An MGF finite near $0$ means exponential tails; heavy-tailed laws simply
      have none, which is why the hypothesis is always stated.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.mgf-moments
    relates:
      - id: quant-probability.continuous.lognormal
        note: >
          The lognormal is the standard cautionary case: every moment is
          finite, yet the MGF is infinite for all positive $t$ and the moments
          fail to pin the law down.
    tags: []

  - id: quant-probability.mgf.characteristic-function
    kind: definition
    prominence: 0
    title: "Characteristic function (pointer)"
    statement: >
      When the MGF fails, replace $e^{tX}$ by $e^{itX}$: the characteristic
      function $\varphi_X(t) = \mathbb{E}[e^{itX}]
      = \mathbb{E}[\cos tX] + i\,\mathbb{E}[\sin tX]$ is finite for every real
      $t$ and every $X$, because $|e^{itX}| = 1$ makes the integrand bounded.
      It obeys the same two rules — a product over independent summands and a
      uniqueness theorem — with no side conditions whatever, which is why the
      general theory of limit laws is built on it rather than on the MGF.
      Standard normal: $\varphi(t) = e^{-t^{2}/2}$. Standard Cauchy:
      $\varphi(t) = e^{-|t|}$, a perfectly well-behaved transform for a law
      with no mean. Knowing that it exists, and why, is enough for an interview.
    summary: >
      $\mathbb{E}[e^{itX}]$ always exists and always identifies the law — the
      repair for every distribution whose MGF is infinite.
    parent: quant-probability.mgf
    also_under: []
    requires:
      - quant-probability.mgf.mgf-nonexistence
      - quant-probability.mgf.identification
    relates: []
    tags: []
