nodes:
  - id: quant-probability.counting
    kind: subbranch
    title: "Counting & Combinatorics"
    summary: >
      Permutations, combinations and the classic identities — the
      counting layer under classical probability, with the interview
      staples worked.
    parent: quant-probability
    also_under: []
