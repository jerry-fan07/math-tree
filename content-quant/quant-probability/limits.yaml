# quant-probability.limits — Limit Theorems
# Outline node (16 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-probability.limits
    kind: subbranch
    title: "Limit Theorems"
    summary: >
      LLN, CLT and the approximation toolkit — what large n buys you and
      how to cash it at an interview.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.limits.convergence-in-probability
    kind: definition
    prominence: 1
    title: "Convergence in probability"
    statement: >
      $X_n \to X$ in probability means: for every $\varepsilon > 0$,
      $\Pr(|X_n - X| > \varepsilon) \to 0$ as $n \to \infty$. The limit is
      usually a constant $c$, in which case the claim is that all of the mass of
      $X_n$ eventually piles up inside any fixed window around $c$. What it does
      not claim: that a particular realized sequence settles down. It looks at
      one $n$ at a time and says a large miss at that $n$ is unlikely, leaving
      room for rare misses to keep recurring forever. Two working facts: the
      limit is unique up to a probability-zero set, and continuous maps preserve
      the mode, so $X_n \to c$ in probability forces $g(X_n) \to g(c)$ in
      probability for continuous $g$.
    summary: >
      For each fixed tolerance, the chance of missing the target by more than
      that tolerance goes to zero — the mode of convergence the weak law
      delivers.
    parent: quant-probability.limits
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-probability.limits.convergence-in-distribution
    kind: definition
    prominence: 1
    title: "Convergence in distribution"
    statement: >
      $X_n \to X$ in distribution means $F_n(x) \to F(x)$ at every point $x$
      where the limiting CDF $F$ is continuous. The continuity proviso is not
      pedantry: the deterministic sequence $X_n = 1/n$ should converge to $0$,
      yet $F_n(0) = 0$ while $F(0) = 1$, and $0$ is exactly the discontinuity of
      $F$. This is a statement about laws alone — the $X_n$ need not share a
      probability space, and nothing says the variables themselves get close.
      Equivalent working forms: $\mathbb{E}[h(X_n)] \to \mathbb{E}[h(X)]$ for
      every bounded continuous $h$, and $\Pr(a < X_n \le b) \to \Pr(a < X \le b)$
      whenever $a$ and $b$ are continuity points. This is the mode in which the
      central limit theorem converges.
    summary: >
      The distribution functions converge pointwise wherever the limit law is
      continuous; the variables themselves never have to get close, only their
      laws.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.random-variables.cdf
    relates: []
    tags: []

  - id: quant-probability.limits.almost-sure-convergence
    kind: definition
    prominence: 0
    title: "Almost sure convergence"
    statement: >
      $X_n \to X$ almost surely means $\Pr(\lim_{n \to \infty} X_n = X) = 1$:
      the set of outcomes for which the entire numerical sequence
      $X_1, X_2, \dots$ converges to the right value has probability $1$. The
      object being assigned probability is a property of a whole trajectory,
      which is what makes this mode stronger than convergence in probability,
      where each $n$ is judged separately. Equivalent form: for every
      $\varepsilon > 0$, the probability that $|X_m - X| > \varepsilon$ holds for
      at least one $m \ge n$ tends to $0$ as $n \to \infty$ — the same condition
      as before, with the whole tail of the sequence swept inside a single
      probability.
    summary: >
      With probability one the whole sequence settles at the limit, not merely
      each individual term with high probability.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.convergence-in-probability
    relates: []
    tags: []

  - id: quant-probability.limits.convergence-hierarchy
    kind: proposition
    prominence: 0
    title: "How the convergence modes rank"
    statement: >
      Almost sure convergence implies convergence in probability, which implies
      convergence in distribution; neither converse holds. In probability but
      not almost surely: the typewriter sequence of indicators of the intervals
      $[0,1/2], [1/2,1], [0,1/3], [1/3,2/3], \dots$ evaluated at a uniform draw,
      whose windows shrink but revisit every point infinitely often. In
      distribution but not in probability: take $X$ standard normal and set
      $X_n = -X$ for every $n$, so the laws match exactly while
      $|X_n - X| = 2|X|$ never shrinks. One partial converse is worth
      memorizing: convergence in distribution to a constant does imply
      convergence in probability to that constant, which is why the weak law can
      be phrased in either mode.
    summary: >
      Almost sure beats in probability beats in distribution, with standard
      counterexamples both ways and one exception when the limit is a constant.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.almost-sure-convergence
      - quant-probability.limits.convergence-in-distribution
    relates: []
    tags: []

  - id: quant-probability.limits.sample-mean-moments
    kind: proposition
    prominence: 1
    title: "Mean and variance of a sample mean"
    statement: >
      Let $X_1,\dots,X_n$ be iid with mean $\mu$ and variance
      $\sigma^{2} < \infty$; write $S_n = X_1 + \dots + X_n$ and
      $\bar{X}_n = S_n/n$. Then $\mathbb{E}[\bar{X}_n] = \mu$ exactly, for every
      $n$, and $\operatorname{Var}(\bar{X}_n) = \sigma^{2}/n$, so the standard
      error of the sample mean is $\sigma/\sqrt{n}$. The total behaves in the
      opposite direction: $\mathbb{E}[S_n] = n\mu$ and
      $\operatorname{Var}(S_n) = n\sigma^{2}$, spread $\sigma\sqrt{n}$.
      Independence enters only through the vanishing cross-covariances, so
      pairwise uncorrelated is already enough. These two lines are the whole
      engine of the limit theorems: the average tightens like $1/\sqrt{n}$ while
      the total wanders like $\sqrt{n}$.
    summary: >
      Averaging $n$ independent draws keeps the mean and divides the variance by
      $n$; the sum keeps the same variance per term and so spreads like
      $\sqrt{n}$.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.joint.variance-sum
    relates: []
    tags: []

  - id: quant-probability.limits.wlln
    kind: theorem
    prominence: 1
    title: "Weak law of large numbers"
    statement: >
      Let $X_1, X_2, \dots$ be iid with mean $\mu$ and finite variance
      $\sigma^{2}$. Then $\bar{X}_n \to \mu$ in probability: for every
      $\varepsilon > 0$, $\Pr(|\bar{X}_n - \mu| \ge \varepsilon) \to 0$. The
      proof is the one line an interviewer wants — Chebyshev applied to
      $\bar{X}_n$, whose variance is $\sigma^{2}/n$, gives
      $\Pr(|\bar{X}_n - \mu| \ge \varepsilon) \le \sigma^{2}/(n\varepsilon^{2})$,
      which tends to $0$. Finite variance is an artifact of that argument;
      Khinchin's version assumes only $\mathbb{E}|X_1| < \infty$. Note how weak
      the bound is: at $\sigma = 1$ and $\varepsilon = 0.1$ it reads $100/n$,
      vacuous until $n$ is in the hundreds. Chebyshev proves the law and
      badly misprices the probability, which is the CLT's job.
    summary: >
      Sample averages converge in probability to the true mean, with Chebyshev
      supplying both the proof and a deliberately crude error bound.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.sample-mean-moments
      - quant-probability.limits.convergence-in-probability
      - quant-probability.inequalities.chebyshev
    relates: []
    tags: []

  - id: quant-probability.limits.slln
    kind: theorem
    prominence: 1
    title: "Strong law of large numbers"
    statement: >
      Kolmogorov's strong law: if $X_1, X_2, \dots$ are iid with
      $\mathbb{E}|X_1| < \infty$ and mean $\mu$, then $\bar{X}_n \to \mu$ almost
      surely. One infinite run of draws has its running average converge, for
      every outcome outside a set of probability zero. No variance assumption is
      required, and the condition is sharp: if $\mathbb{E}|X_1| = \infty$ then
      $\limsup_n |\bar{X}_n| = \infty$ almost surely, so the running average of
      Cauchy draws wanders forever instead of settling. The strong law upgrades
      the mode of convergence, not the limit, and it is what licenses the
      frequentist reading of probability as a long-run frequency. Interviews
      want the statement and the contrast with the weak law, never the proof.
    summary: >
      With probability one the running average of iid draws converges to the
      mean, needing only a finite first moment.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.wlln
      - quant-probability.limits.almost-sure-convergence
    relates: []
    tags: []

  - id: quant-probability.limits.clt
    kind: theorem
    prominence: 2
    title: "Central limit theorem"
    statement: >
      Lindeberg–Lévy: let $X_1, X_2, \dots$ be iid with mean $\mu$ and variance
      $\sigma^{2}$ satisfying $0 < \sigma^{2} < \infty$. Then
      $\sqrt{n}(\bar{X}_n - \mu)/\sigma \to N(0,1)$ in distribution, equivalently
      $(S_n - n\mu)/(\sigma\sqrt{n}) \to N(0,1)$, so
      $\Pr(S_n \le n\mu + z\sigma\sqrt{n}) \to \Phi(z)$ for every real $z$.
      Nothing else about the common law matters: discrete or continuous, skewed
      or symmetric, bounded or not. Read it as a decomposition — the total is
      $n\mu$ plus a normal wobble of size $\sigma\sqrt{n}$, the average is $\mu$
      plus a normal wobble of size $\sigma/\sqrt{n}$. The iid hypothesis can be
      relaxed (Lyapunov, Lindeberg conditions); finite positive variance cannot.
    summary: >
      Standardized sums of iid finite-variance variables converge in
      distribution to the standard normal, whatever the shape of the summand.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.convergence-in-distribution
      - quant-probability.limits.sample-mean-moments
      - quant-probability.continuous.normal
    relates:
      - id: quant-probability.mgf.identification
        note: >
          The textbook proof runs through transforms: the MGF of the
          standardized sum converges to $e^{t^{2}/2}$, and identification
          upgrades that to convergence of the laws.
    tags: []

  - id: quant-probability.limits.de-moivre-laplace
    kind: corollary
    prominence: 1
    title: "De Moivre–Laplace: the binomial goes normal"
    statement: >
      Apply the CLT to iid Bernoulli($p$) summands with $0 < p < 1$: if
      $S_n \sim \operatorname{Bin}(n,p)$ then
      $(S_n - np)/\sqrt{np(1-p)} \to N(0,1)$ in distribution. This was
      historically the first central limit theorem (de Moivre in 1733 for
      $p = 1/2$, Laplace in general) and it is the version interviews actually
      use, because binomial counts are everywhere. Rule of thumb for when the
      approximation is usable: $np(1-p) \ge 10$, with accuracy degrading through
      skewness as $p$ moves away from $1/2$. For small $p$ with $np$ moderate the
      binomial has an entirely different limit — Poisson, not normal — so
      identify the regime before reaching for $\Phi$.
    summary: >
      Binomial counts standardize to a standard normal for large $n$; usable
      once $np(1-p) \ge 10$, and replaced by the Poisson limit when $p$ is tiny.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.clt
      - quant-probability.discrete.binomial
    relates:
      - id: quant-tools.series-calculus.stirling
        note: >
          The original derivation is direct rather than abstract: expand the
          binomial coefficient with Stirling's approximation and the Gaussian
          shape $e^{-z^{2}/2}$ drops out of the algebra.
    tags: []

  - id: quant-probability.limits.normal-approx-binomial
    kind: technique
    prominence: 2
    title: "Normal approximation with continuity correction"
    statement: >
      Recipe for $S_n \sim \operatorname{Bin}(n,p)$: set $\mu = np$ and
      $\sigma = \sqrt{np(1-p)}$, then approximate $\Pr(S_n \ge k)$ by
      $1 - \Phi((k - 0.5 - \mu)/\sigma)$ and $\Pr(S_n \le k)$ by
      $\Phi((k + 0.5 - \mu)/\sigma)$. The half-unit shift is the continuity
      correction: a discrete atom is being replaced by a continuous density, so
      each integer must be granted its full unit of width. Worked — $100$ fair
      tosses, $\Pr(S \ge 60)$: $\mu = 50$, $\sigma = 5$, and
      $z = (59.5 - 50)/5 = 1.9$, so the estimate is
      $1 - \Phi(1.9) \approx 0.0287$, just under $2.9\%$, against an exact
      binomial value of $2.84\%$. Skipping the correction gives $z = 2$ and
      $2.3\%$ — a $20\%$ relative error, so always apply it.
    summary: >
      Standardize with the half-integer shift and read off $\Phi$: in $100$ fair
      tosses the chance of at least $60$ heads comes out at $2.9\%$, against an
      exact $2.84\%$.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.de-moivre-laplace
    relates: []
    tags: []

  - id: quant-probability.limits.poisson-vs-normal
    kind: technique
    prominence: 1
    title: "Choosing between the Poisson and normal regimes"
    statement: >
      Both approximations start from $\operatorname{Bin}(n,p)$ with large $n$,
      and the diagnostic is the size of $np$ relative to the spread. Small $p$
      with $\lambda = np$ moderate — rare defaults, arrivals, typos — is the
      Poisson regime; Le Cam's bound caps the total-variation error at
      $np^{2} = \lambda p$, so it is excellent precisely when $p$ is tiny. Once
      $np(1-p) \ge 10$, the count has room to spread symmetrically and the
      continuity-corrected normal takes over. Contrast at $n = 1000$: with
      $p = 0.002$, $\lambda = 2$ and $\Pr(S = 0) \approx e^{-2} = 0.135$, which a
      normal with $\sigma = 1.41$ would mangle; with $p = 0.5$, $\sigma = 15.8$
      and the normal is good to three decimals.
    summary: >
      Rare-event binomials go Poisson with error $\lambda p$; wide ones go
      normal once $np(1-p) \ge 10$. Check which before quoting a number.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.normal-approx-binomial
    relates:
      - id: quant-probability.discrete.poisson-limit
        note: >
          That node proves the other limit of the same binomial — $n \to \infty$
          with $np \to \lambda$ held fixed — and this one says which of the two
          regimes a given $(n,p)$ actually sits in.
    tags: []

  - id: quant-probability.limits.dice-sum-clt
    kind: example
    prominence: 0
    title: "Total of 100 dice"
    statement: >
      Roll a fair die $100$ times: how likely is a total of at least $400$? A
      single die has $\mu = 3.5$ and $\sigma^{2} = 35/12 \approx 2.917$, so the
      total has mean $350$ and variance $291.7$, giving $\sigma \approx 17.08$.
      With the continuity correction, $z = (399.5 - 350)/17.08 \approx 2.90$ and
      the probability is $1 - \Phi(2.90) \approx 0.0019$, under one in five
      hundred. The same standardization answers the calibration question: the
      total lands within $\pm 20$ of $350$ with probability
      $2\Phi(20.5/17.08) - 1 = 2\Phi(1.20) - 1 \approx 0.77$. Note what never
      entered — the shape of the die's law. Only its mean and variance were used.
    summary: >
      A hundred dice total $350 \pm 17$; reaching $400$ has probability about
      $0.19\%$, and the middle $\pm 20$ band holds about $77\%$ of the mass.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.clt
    relates: []
    tags: []

  - id: quant-probability.limits.uniform-sum-normal
    kind: example
    prominence: 0
    title: "Twelve uniforms make a standard normal"
    statement: >
      Add twelve independent $U(0,1)$ draws and subtract $6$. Each uniform has
      mean $1/2$ and variance $1/12$, so the sum has mean $6$ and variance
      exactly $1$, and $S - 6$ is approximately standard normal — the standard
      way to manufacture normals before Box–Muller. The approximation is
      excellent in the body, matching the normal CDF to roughly three decimals
      near the centre, and structurally wrong far out: $S - 6$ is confined to
      $[-6,6]$ and carries excess kurtosis $-6/(5 \cdot 12) = -0.1$, so it is
      slightly light-tailed. The lesson for interviews is how fast the CLT
      bites — $n = 12$ is already large $n$ for a bounded, symmetric summand.
    summary: >
      Twelve uniforms minus six is a passable standard normal, showing that
      "large $n$" can mean a dozen when the summand is tame.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.clt
    relates: []
    tags: []

  - id: quant-probability.limits.law-of-averages-fallacy
    kind: intuition
    prominence: 1
    title: "The law of averages does not repay deficits"
    statement: >
      The law of large numbers says the average converges; it never says a
      shortfall gets made up. After $n$ fair tosses the excess $H_n - n/2$ has
      standard deviation $\sqrt{n}/2$ and grows without bound, while the
      fraction $H_n/n - 1/2$ shrinks like $1/(2\sqrt{n})$. A run of $10$ tails is
      not repaid by future heads, it is diluted by them: after another
      $10\,000$ tosses the expected excess of tails is still exactly $10$, but
      as a share of the record it has fallen from $100\%$ to $0.1\%$.
      Convergence of the ratio and divergence of the difference are perfectly
      compatible. Any strategy premised on an outcome being due — doubling after
      losses, backing the cold number — is pricing a correction that never
      arrives.
    summary: >
      Averages converge because later data outweighs the past, not because the
      past is corrected; the absolute deviation keeps growing like $\sqrt{n}$.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.slln
      - quant-probability.limits.clt
    relates: []
    tags: []

  - id: quant-probability.limits.clt-caveats
    kind: proposition
    prominence: 0
    title: "Rate, region and hypotheses of the CLT"
    statement: >
      Three limits on what the CLT actually buys. Rate: Berry–Esseen bounds the
      worst CDF error by $C\rho/(\sigma^{3}\sqrt{n})$ where
      $\rho = \mathbb{E}|X_1 - \mu|^{3}$ and $C < 0.5$, so accuracy improves only
      like $1/\sqrt{n}$ and skewness dominates the leading correction. Region:
      the theorem controls the centre, not the far tail — for $z$ growing with
      $n$ the relative error in $1 - \Phi(z)$ can be unbounded, which is why tail
      risk is priced with Chernoff or large-deviation bounds instead. Hypotheses:
      with infinite variance there is no normal limit at all, averages of Cauchy
      draws being Cauchy for every $n$, and other heavy tails converge to
      non-normal stable laws.
    summary: >
      The normal limit is accurate to order $1/\sqrt{n}$, only near the centre,
      and only when the variance is finite.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.clt
    relates:
      - id: quant-probability.continuous.cauchy
        note: >
          The Cauchy law is the standing counterexample: with no finite variance
          the average of $n$ draws has exactly the same law as one draw, so
          sampling more buys no precision whatsoever.
    tags: []

  - id: quant-probability.limits.slutsky
    kind: proposition
    prominence: 0
    title: "Slutsky's theorem"
    statement: >
      If $X_n \to X$ in distribution and $Y_n \to c$ in probability for a
      constant $c$, then $X_n + Y_n \to X + c$, $X_n Y_n \to cX$, and
      $X_n/Y_n \to X/c$ when $c \ne 0$, all in distribution. That the second
      limit is a constant is essential — the statement is false for a random
      limit, since convergence in distribution carries no information about
      joint behaviour. The everyday use is substituting an estimate for a
      parameter: the sample standard deviation satisfies $s_n \to \sigma$ in
      probability, so $\sqrt{n}(\bar{X}_n - \mu)/s_n$ has the same standard
      normal limit as the version with $\sigma$, which is what makes a
      confidence interval computable from the data alone.
    summary: >
      A distributional limit survives being added to or multiplied by anything
      converging to a constant — the licence to plug estimates in for unknowns.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.convergence-in-distribution
      - quant-probability.limits.convergence-in-probability
    relates: []
    tags: []

  - id: quant-probability.limits.delta-method
    kind: technique
    prominence: 1
    title: "Delta method"
    statement: >
      Reach for this when the quantity you care about is a smooth function of a
      sample mean. If $\sqrt{n}(\bar{X}_n - \mu) \to N(0,\sigma^{2})$ in
      distribution and $g$ is differentiable at $\mu$ with $g'(\mu) \ne 0$, then
      $\sqrt{n}(g(\bar{X}_n) - g(\mu)) \to N(0, g'(\mu)^{2}\sigma^{2})$: the
      first-order Taylor term $g(\mu) + g'(\mu)(\bar{X}_n - \mu)$ carries the
      whole limit and the remainder washes out. Worked — from $n = 100$
      fair-coin tosses, estimate the odds $g(p) = p/(1-p)$. Here
      $g'(p) = 1/(1-p)^{2}$, so $g'(1/2) = 4$, and $\hat{p}$ has standard error
      $\sqrt{0.25/100} = 0.05$, so the odds estimate carries standard error
      $4 \cdot 0.05 = 0.2$ about the true value $1$. If $g'(\mu) = 0$ the limit
      is a multiple of a chi-square, not a normal.
    summary: >
      Push a CLT through a differentiable function by multiplying the standard
      error by $|g'(\mu)|$ — valid only when that derivative is nonzero.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.clt
      - quant-probability.limits.slutsky
      - quant-tools.series-calculus.taylor
    relates: []
    tags: []

  - id: quant-probability.limits.borel-cantelli
    kind: theorem
    prominence: 0
    title: "Borel–Cantelli lemmas"
    statement: >
      Let $A_1, A_2, \dots$ be events. First lemma: if
      $\sum_{n} \Pr(A_n) < \infty$ then with probability $1$ only finitely many
      of the $A_n$ occur; the proof is the union bound applied to the tail, since
      $\Pr(\text{some } A_m \text{ with } m \ge n) \le \sum_{m \ge n}\Pr(A_m)$,
      which tends to $0$. Second lemma: if the $A_n$ are independent and
      $\sum_n \Pr(A_n) = \infty$ then with probability $1$ infinitely many occur.
      Independence is indispensable in the second and absent from the first. Two
      uses: a monkey typing independently forever produces any fixed finite
      string infinitely often, and summable deviation probabilities upgrade
      convergence in probability to almost sure convergence.
    summary: >
      Summable probabilities mean the events stop happening; divergent sums of
      independent events mean they never stop.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.almost-sure-convergence
    relates: []
    tags: []

  - id: quant-probability.limits.root-n
    kind: intuition
    prominence: 2
    title: "Errors shrink like one over root n"
    statement: >
      Every accuracy claim in this subbranch has one shape: an average of $n$
      independent observations sits within about $\sigma/\sqrt{n}$ of the truth.
      Precision is therefore quadratically expensive — halving the error costs
      four times the data, and one more decimal digit costs a hundredfold. Two
      standard readings. Pinning a mean to $\pm 0.01\sigma$ with $95\%$
      confidence needs $n \approx (1.96/0.01)^{2} \approx 38\,400$ observations.
      Resolving a trading edge worth $0.1$ standard deviations per trade at two
      standard errors needs $\sqrt{n}\,(0.1) = 2$, that is $400$ trades. The same
      $1/\sqrt{n}$ governs Monte Carlo error, which is why variance reduction
      beats buying more paths.
    summary: >
      Statistical precision costs quadratically: four times the data for half
      the error, and 400 trades to see a 0.1-sigma edge at two standard errors.
    parent: quant-probability.limits
    also_under: []
    requires:
      - quant-probability.limits.clt
    relates: []
    tags: []
