# quant-probability.inequalities — Probability Inequalities
# Outline node (15 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-probability.inequalities
    kind: subbranch
    title: "Probability Inequalities"
    summary: >
      Markov, Chebyshev, Jensen, Chernoff and the union bound — the
      standard levers for tail estimates and sanity bounds.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.inequalities.markov
    kind: theorem
    prominence: 2
    title: "Markov's inequality"
    statement: >
      Let $X \ge 0$ with finite mean and let $a > 0$. Then
      $\Pr(X \ge a) \le \mathbb{E}[X]/a$. One-line proof: pointwise
      $X \ge a\,\mathbf{1}\{X \ge a\}$, so taking expectations gives
      $\mathbb{E}[X] \ge a\Pr(X \ge a)$. Nonnegativity is not decoration — a
      variable equal to $\pm 10^{6}$ with equal probability has mean $0$ while
      $\Pr(X \ge 1) = 1/2$, so the bound would read $\le 0$ and be false. The
      rescaled form is the one to quote: $\Pr(X \ge k\,\mathbb{E}[X]) \le 1/k$.
      Since it uses nothing but the mean, it is the weakest tail bound there is
      and the one that always applies; Chebyshev and Chernoff are both Markov
      applied to a transformed variable.
    summary: >
      A nonnegative variable is rarely far above its mean — the chance of
      reaching $a$ is at most $\mathbb{E}[X]/a$, and nothing but the mean is
      needed.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.expectation.expectation
    relates: []
    tags: []

  - id: quant-probability.inequalities.markov-tightness
    kind: example
    prominence: 0
    title: "Markov is tight, and usually terrible"
    statement: >
      Markov cannot be improved knowing only the mean. Fix $\mu > 0$ and
      $a > \mu$, and let $X = a$ with probability $\mu/a$ and $X = 0$
      otherwise. Then $\mathbb{E}[X] = \mu$ and $\Pr(X \ge a) = \mu/a$ exactly,
      so the inequality is an equality at that level for every such $a$. On a
      spread-out law it is badly loose: for one fair die
      $\Pr(X \ge 6) \le 3.5/6 \approx 0.583$ against the true
      $1/6 \approx 0.167$, a factor of $3.5$. Interview reading: quote Markov
      when the mean is all you are given, say out loud that it is loose, and
      reach for the variance or the mgf the moment sharpness matters.
    summary: >
      A two-point law makes Markov an equality, so no better mean-only bound
      exists — which is also why it is off by factors on any realistic
      distribution.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.markov
    relates: []
    tags: []

  - id: quant-probability.inequalities.chebyshev
    kind: theorem
    prominence: 2
    title: "Chebyshev's inequality"
    statement: >
      Let $X$ have finite mean $\mu$ and variance $\sigma^{2}$. For every
      $t > 0$, $\Pr(|X - \mu| \ge t) \le \sigma^{2}/t^{2}$. Proof: apply Markov
      to the nonnegative variable $(X - \mu)^{2}$ at level $t^{2}$, whose mean
      is $\sigma^{2}$. No shape assumption, no independence, no sign
      restriction — two moments are the whole input. It is attained: the law
      with mass $1/(2k^{2})$ at each of $\mu \pm k\sigma$ and the rest at $\mu$
      has variance $\sigma^{2}$ and $\Pr(|X - \mu| \ge k\sigma) = 1/k^{2}$
      exactly. Applied to an average of $n$ independent draws, whose variance
      is $\sigma^{2}/n$, it yields
      $\Pr(|\bar{X} - \mu| \ge t) \le \sigma^{2}/(nt^{2})$, the quantitative
      engine behind the law of large numbers.
    summary: >
      Variance controls both tails: deviating by $t$ from the mean has
      probability at most $\sigma^{2}/t^{2}$, for any distribution whatsoever.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.markov
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.inequalities.k-sigma
    kind: corollary
    prominence: 1
    title: "k-sigma bounds"
    statement: >
      Setting $t = k\sigma$ gives $\Pr(|X - \mu| \ge k\sigma) \le 1/k^{2}$ for
      every law with finite variance: at most $25\%$ at $k = 2$, $11.1\%$ at
      $k = 3$, $6.25\%$ at $k = 4$, $1\%$ at $k = 10$. Equivalently at least
      $1 - 1/k^{2}$ of the mass sits within $k$ standard deviations, and the
      statement is vacuous for $k \le 1$. Compare a normal law, whose true
      two-sided tails at those $k$ are $4.6\%$, $0.27\%$, $6 \times 10^{-5}$
      and about $1.5 \times 10^{-23}$: the distribution-free bound is looser
      by one, two, three, then twenty-one orders of magnitude. That gap is the
      price of assuming nothing about shape, and the reason exponential bounds
      exist.
    summary: >
      At most $1/k^{2}$ of any distribution lies beyond $k$ standard
      deviations — true always, but hundreds of times weaker than the normal
      tails people picture.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.chebyshev
    relates:
      - id: quant-probability.continuous.normal
        note: >
          The empirical rule there gives the exact tails a normal actually has;
          the ratio to $1/k^{2}$ measures what a shape assumption is worth.
    tags: []

  - id: quant-probability.inequalities.cantelli
    kind: proposition
    prominence: 0
    title: "One-sided Chebyshev (Cantelli)"
    statement: >
      With $\mu$ and $\sigma^{2}$ finite and $t > 0$,
      $\Pr(X - \mu \ge t) \le \sigma^{2}/(\sigma^{2} + t^{2})$, and the
      mirrored bound holds for the lower tail. Proof: for any $u > 0$,
      $\Pr(X - \mu \ge t) \le \Pr((X - \mu + u)^{2} \ge (t+u)^{2})
      \le (\sigma^{2} + u^{2})/(t+u)^{2}$ by Markov, and choosing
      $u = \sigma^{2}/t$ minimizes the right side. At $t = k\sigma$ it reads
      $1/(1+k^{2})$, so $0.2$ at $k = 2$ against Chebyshev's two-sided $0.25$.
      The trap: you may not simply halve Chebyshev, because a
      skewed law can load its whole deviation onto one side, and Cantelli is
      the correct one-sided replacement.
    summary: >
      For a single tail the right bound is $\sigma^{2}/(\sigma^{2}+t^{2})$ —
      better than Chebyshev, but not the naive half of it.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.chebyshev
    relates: []
    tags: []

  - id: quant-probability.inequalities.chebyshev-sample-size
    kind: example
    prominence: 1
    title: "Sample size from Chebyshev"
    statement: >
      How many tosses pin an unknown coin bias $p$ to within $\pm 0.01$ with
      confidence $95\%$, assuming nothing about shape? Each toss has variance
      $p(1-p) \le 1/4$, so the sample mean of $n$ tosses has variance at most
      $1/(4n)$ and Chebyshev gives
      $\Pr(|\bar{X} - p| \ge 0.01) \le 1/(4n \cdot 10^{-4}) = 2500/n$.
      Requiring $2500/n \le 0.05$ forces $n \ge 50\,000$. In general
      $n \ge \sigma^{2}/(\alpha \varepsilon^{2})$: halving the tolerance
      quadruples the work. A normal approximation would ask only
      $n \approx (1.96)^{2}(0.25)/(0.01)^{2} \approx 9\,604$, so the safe
      distribution-free answer costs about five times the data.
    summary: >
      Chebyshev turns a precision target into a sample count — $50\,000$
      tosses for $\pm 0.01$ at $95\%$, about five times what the CLT would
      demand.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.chebyshev
    relates: []
    tags: []

  - id: quant-probability.inequalities.jensen
    kind: theorem
    prominence: 2
    title: "Jensen's inequality"
    statement: >
      Let $\varphi$ be convex on an interval $I$ containing the range of $X$,
      with $\mathbb{E}[X]$ finite and $\mathbb{E}[\varphi(X)]$ well defined.
      Then $\mathbb{E}[\varphi(X)] \ge \varphi(\mathbb{E}[X])$; for concave
      $\varphi$ the inequality reverses. Proof: a convex function lies above
      its supporting line at $\mu = \mathbb{E}[X]$, so
      $\varphi(X) \ge \varphi(\mu) + c\,(X - \mu)$ pointwise for some slope
      $c$; take expectations and the linear term dies. If $\varphi$ is
      strictly convex, equality holds only when $X$ is constant with
      probability $1$. Both hypotheses bite: convexity must hold across the
      whole range of $X$, and $\mathbb{E}[X]$ must exist for
      $\varphi(\mathbb{E}[X])$ to mean anything.
    summary: >
      Averaging then bending gives less than bending then averaging:
      $\mathbb{E}[\varphi(X)] \ge \varphi(\mathbb{E}[X])$ for convex
      $\varphi$, with equality only for a constant.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-tools.optimization.convexity
    relates: []
    tags: []

  - id: quant-probability.inequalities.jensen-second-moment
    kind: corollary
    prominence: 1
    title: "The standard Jensen substitutions"
    statement: >
      Every one of these is a single choice of $\varphi$. Taking
      $\varphi(x) = x^{2}$ gives
      $\mathbb{E}[X^{2}] \ge (\mathbb{E}[X])^{2}$, which is exactly
      $\operatorname{Var}(X) \ge 0$. Taking $\varphi(x) = 1/x$ on $x > 0$ gives
      $\mathbb{E}[1/X] \ge 1/\mathbb{E}[X]$: a fair die has
      $\mathbb{E}[1/X] = 49/120 \approx 0.408$ against
      $1/\mathbb{E}[X] \approx 0.286$. Taking $\varphi(x) = e^{x}$ gives
      $\mathbb{E}[e^{X}] \ge e^{\mathbb{E}[X]}$, which is why a lognormal mean
      exceeds $e^{\mu}$; concavity of $\ln$ gives
      $\mathbb{E}[\ln X] \le \ln \mathbb{E}[X]$, the log-versus-linear gap
      behind volatility drag. The interview form is "is $\mathbb{E}[1/X]$ equal
      to $1/\mathbb{E}[X]$?" — no, and Jensen names the direction.
    summary: >
      Reciprocals, squares, exponentials and logs all inherit a fixed
      direction of error from Jensen — the answer to "can I move the function
      inside the expectation?" is no, with a sign.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.jensen
    relates: []
    tags: []

  - id: quant-probability.inequalities.jensen-am-gm
    kind: example
    prominence: 0
    title: "AM–GM as a case of Jensen"
    statement: >
      Put weights $w_i \ge 0$ summing to $1$ on positive numbers
      $x_1,\dots,x_n$ — that is, let $X = x_i$ with probability $w_i$.
      Concavity of $\ln$ gives
      $\sum_i w_i \ln x_i \le \ln\left(\sum_i w_i x_i\right)$, and
      exponentiating turns this into the weighted statement
      $\prod_i x_i^{w_i} \le \sum_i w_i x_i$. Equal weights $w_i = 1/n$ recover
      the classical fact that the geometric mean of $n$ positive numbers never
      exceeds their arithmetic mean, with equality only when all the $x_i$
      agree, since $\ln$ is strictly concave. Check: for $x = (1, 4, 16)$ the
      geometric mean is $4$ and the arithmetic mean is $7$.
    summary: >
      Randomize over the numbers and apply Jensen to $\ln$: the weighted
      AM–GM inequality falls out, with the deterministic version as the
      equal-weights case.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.jensen
    relates:
      - id: quant-tools.series-calculus.am-gm
        note: >
          The deterministic inequality proved there is the equal-weights
          specialisation of this one; the probabilistic route also delivers
          arbitrary real weights for free.
    tags: []

  - id: quant-probability.inequalities.union-bound
    kind: proposition
    prominence: 1
    title: "Union bound (Boole's inequality)"
    statement: >
      For any events $A_1, A_2, \dots$, finitely or countably many and with no
      independence assumed,
      $\Pr\left(\bigcup_i A_i\right) \le \sum_i \Pr(A_i)$. It follows from
      inclusion–exclusion by discarding the subtracted intersection terms, and
      is an equality exactly when the events are pairwise disjoint. The
      complementary reading is usually the useful one:
      $\Pr\left(\bigcap_i A_i^{c}\right) \ge 1 - \sum_i \Pr(A_i)$, so if the
      individual failure probabilities add to something small, everything
      survives. Bonferroni: truncating inclusion–exclusion after an odd number
      of terms over-estimates and after an even number under-estimates. Reach
      for it when the bad events overlap in ways you cannot compute.
    summary: >
      The chance that at least one of several bad things happens is at most
      the sum of their chances — no independence, no structure, no
      computation of overlaps.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.foundations.union-two
    relates: []
    tags: []

  - id: quant-probability.inequalities.collision-bound
    kind: example
    prominence: 0
    title: "Bounding a collision probability"
    statement: >
      Assign $n$ items independent uniform labels out of $m$ possible values
      and bound the chance that two items share a label. Take one event per
      pair: there are $\binom{n}{2}$ pairs, each colliding with probability
      $1/m$, so
      $\Pr(\text{some collision}) \le \binom{n}{2}/m$. With $n = 23$,
      $m = 365$ this reads $253/365 \approx 0.69$ against the true $0.507$ —
      loose, because the bound has drifted close to $1$. With $n = 30$ labels
      drawn from $m = 10^{6}$ it reads $435/10^{6} \approx 0.00044$, within a
      percent of the truth. The rule: the union bound is excellent while the
      sum is well under $1$ and worthless once it passes $1$.
    summary: >
      Sum over pairs to bound any-collision by $\binom{n}{2}/m$ — sharp in the
      rare-collision regime that matters, useless once the estimate approaches
      one.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.union-bound
    relates: []
    tags: []

  - id: quant-probability.inequalities.chernoff
    kind: technique
    prominence: 1
    title: "Chernoff bound: exponential Markov"
    statement: >
      When mean and variance give too weak a tail, apply Markov to the
      exponential. For any $t > 0$ the events $\{X \ge a\}$ and
      $\{e^{tX} \ge e^{ta}\}$ coincide, and $e^{tX} > 0$, so
      $\Pr(X \ge a) \le e^{-ta}\,\mathbb{E}[e^{tX}] = e^{-ta}M_X(t)$ for every
      $t$ at which the mgf is finite; then minimize the right-hand side over
      $t > 0$. For the lower tail run the same argument with $t < 0$. The
      payoff appears for sums of independent variables, where the mgf of the
      sum is the product of the mgfs, so the bound decays exponentially in $n$
      instead of polynomially. Three steps, always: exponentiate, apply
      Markov, optimize $t$.
    summary: >
      Markov applied to $e^{tX}$, then optimized over $t$ — the standard route
      to exponentially small tail bounds for sums of independent pieces.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.markov
      - quant-probability.mgf.mgf
    relates:
      - id: quant-probability.mgf.mgf-sums
        note: >
          Factorising the mgf of a sum into a product is precisely what makes
          the optimized exponent scale linearly in the number of summands.
    tags: []

  - id: quant-probability.inequalities.chernoff-binomial
    kind: example
    prominence: 1
    title: "Chernoff versus Chebyshev on 100 coin tosses"
    statement: >
      Toss a fair coin $100$ times and bound $\Pr(H \ge 60)$. Write
      $S = \sum_{i=1}^{100}\varepsilon_i$ with $\varepsilon_i = \pm 1$, so
      $H \ge 60$ means $S \ge 20$. Since
      $\mathbb{E}[e^{t\varepsilon}] = \cosh t \le e^{t^{2}/2}$, we get
      $\Pr(S \ge s) \le e^{-ts + nt^{2}/2}$, minimized at $t = s/n$ to give
      $e^{-s^{2}/(2n)}$. With $s = 20$, $n = 100$ that is
      $e^{-2} \approx 0.135$, against the exact $0.0284$; Chebyshev, with
      $\sigma = 5$ heads and a $10$-head deviation, manages only
      $25/100 = 0.25$. At $70$ heads the gap opens: Chernoff gives
      $e^{-8} \approx 3.4 \times 10^{-4}$, Chebyshev $25/400 = 0.0625$, and
      the truth is about $3.9 \times 10^{-5}$.
    summary: >
      The exponential bound $e^{-s^{2}/(2n)}$ beats Chebyshev by a factor of two
      at $60$ heads and by a factor of $180$ at $70$ — polynomial decay versus
      exponential.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.chernoff
      - quant-probability.inequalities.chebyshev
    relates: []
    tags: []

  - id: quant-probability.inequalities.cauchy-schwarz-rv
    kind: proposition
    prominence: 1
    title: "Cauchy–Schwarz for random variables"
    statement: >
      If $\mathbb{E}[X^{2}]$ and $\mathbb{E}[Y^{2}]$ are finite then $XY$ is
      integrable and
      $(\mathbb{E}[XY])^{2} \le \mathbb{E}[X^{2}]\,\mathbb{E}[Y^{2}]$. Proof:
      for real $t$ the quadratic
      $q(t) = \mathbb{E}[(X - tY)^{2}]
      = \mathbb{E}[X^{2}] - 2t\,\mathbb{E}[XY] + t^{2}\,\mathbb{E}[Y^{2}]$ is a
      nonnegative expectation for every $t$, so as a quadratic in $t$ it has
      discriminant $4(\mathbb{E}[XY])^{2} - 4\mathbb{E}[X^{2}]\mathbb{E}[Y^{2}]
      \le 0$. Equality forces $q$ to vanish at its double root, that is
      $X = t_0 Y$ with probability $1$ when $\mathbb{E}[Y^{2}] > 0$. Setting
      $Y = 1$ recovers $(\mathbb{E}[X])^{2} \le \mathbb{E}[X^{2}]$.
    summary: >
      The inner-product inequality in probabilistic dress — the expectation of
      a product is bounded by the root-mean-squares, with equality only for
      proportional variables.
    parent: quant-probability.inequalities
    also_under: []
    requires: []
    relates:
      - id: quant-tools.series-calculus.cauchy-schwarz
        note: >
          The sum form there is this statement for a uniform law on $n$
          points, and the discriminant argument is identical in both settings.
    tags: []

  - id: quant-probability.inequalities.cs-covariance
    kind: corollary
    prominence: 1
    title: "|Cov| ≤ σσ and |ρ| ≤ 1"
    statement: >
      Apply Cauchy–Schwarz to the centred variables $X - \mu_X$ and
      $Y - \mu_Y$: $|\operatorname{Cov}(X,Y)| \le \sigma_X \sigma_Y$, so the
      correlation
      $\rho = \operatorname{Cov}(X,Y)/(\sigma_X \sigma_Y)$ lies in $[-1,1]$
      whenever both variances are positive and finite. Equality $|\rho| = 1$
      holds exactly when $Y = a + bX$ with probability $1$, the sign of $b$
      matching that of $\rho$. Two working uses: a portfolio of two legs obeys
      $\sigma_{X+Y} \le \sigma_X + \sigma_Y$, so diversification can never
      make volatility worse than the sum; and a reported correlation outside
      $[-1,1]$, or a covariance matrix implying one, is an arithmetic error —
      the cheapest check on an estimated covariance.
    summary: >
      Covariance is capped by the product of the standard deviations, which is
      why correlation lives in $[-1,1]$ and hits the ends only for exactly
      linear relationships.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.cauchy-schwarz-rv
      - quant-probability.joint.correlation
    relates: []
    tags: []

  - id: quant-probability.inequalities.paley-zygmund
    kind: proposition
    prominence: 0
    title: "Paley–Zygmund and the second-moment method"
    statement: >
      Let $X \ge 0$ with $0 < \mathbb{E}[X^{2}] < \infty$ and let
      $0 \le \theta < 1$. Then
      $\Pr(X > \theta\,\mathbb{E}[X]) \ge
      (1-\theta)^{2}(\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}]$. Proof: split
      $\mathbb{E}[X]$ over the two sides of the threshold to get
      $\mathbb{E}[X] \le \theta\,\mathbb{E}[X]
      + \mathbb{E}[X\,\mathbf{1}\{X > \theta\mathbb{E}[X]\}]$, then bound the
      last term by Cauchy–Schwarz as
      $\sqrt{\mathbb{E}[X^{2}]\Pr(X > \theta\mathbb{E}[X])}$ and square. At
      $\theta = 0$ this is the second-moment method:
      $\Pr(X > 0) \ge (\mathbb{E}[X])^{2}/\mathbb{E}[X^{2}]$, so a nonnegative
      count is positive with non-vanishing probability whenever its second
      moment stays within a constant factor of its mean squared. Markov bounds
      a count from above; this bounds it from below.
    summary: >
      A lower-tail counterpart to Markov: if a nonnegative variable's second
      moment is comparable to its squared mean, it is a constant fraction of
      its mean with constant probability.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.cauchy-schwarz-rv
    relates: []
    tags: []

  - id: quant-probability.inequalities.choosing-a-bound
    kind: intuition
    prominence: 1
    title: "Which inequality to reach for"
    statement: >
      A decision list for "bound this probability". Given only a mean and
      $X \ge 0$: Markov, and say aloud that it is loose. Given mean and
      variance: Chebyshev, decaying like $1/k^{2}$, or Cantelli when the
      question is one-sided. Given a sum of many independent bounded pieces:
      Chernoff, decaying like $e^{-k^{2}/2}$, worth the algebra whenever the
      event is genuinely rare. Given many bad events with unknown overlap: the
      union bound, trustworthy while the total stays under $1$. Given a
      nonlinear function outside an expectation: Jensen, which fixes the
      direction of the error for free. Given a product or a covariance:
      Cauchy–Schwarz. Naming the strength you need is the part being graded.
    summary: >
      Pick the bound by what you are given — mean, variance, mgf, or nothing
      but a list of bad events — and state why that strength is the right one.
    parent: quant-probability.inequalities
    also_under: []
    requires:
      - quant-probability.inequalities.chebyshev
      - quant-probability.inequalities.jensen
      - quant-probability.inequalities.union-bound
      - quant-probability.inequalities.chernoff
      - quant-probability.inequalities.cs-covariance
    relates: []
    tags: []
