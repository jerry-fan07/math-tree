# quant-probability.joint — Joint Distributions & Dependence
# Outline node (11 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-probability.joint
    kind: subbranch
    title: "Joint Distributions & Dependence"
    summary: >
      Joint laws, covariance and correlation, convolution, and the
      bivariate normal — how variables move together.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.joint.joint-law
    kind: definition
    prominence: 1
    title: "Joint distributions and marginals"
    statement: >
      For a pair $(X,Y)$ the joint pmf is $p(x,y) = \Pr(X = x, Y = y)$, summing
      to $1$ over all pairs; in the continuous case a joint density
      $f(x,y) \ge 0$ integrates to $1$ and gives
      $\Pr((X,Y) \in A) = \iint_A f(x,y)\,dx\,dy$. The joint CDF is
      $F(x,y) = \Pr(X \le x, Y \le y)$, and $f$ is its mixed second partial
      derivative where that exists. Marginals recover one coordinate by summing
      or integrating the other out: $p_X(x) = \sum_y p(x,y)$ and
      $f_X(x) = \int_{-\infty}^{\infty} f(x,y)\,dy$. The joint determines the
      marginals; the marginals never determine the joint, because the
      dependence structure is extra information. Conditional laws given a
      variable are the subject of the next subbranch.
    summary: >
      The law of several variables at once — a joint pmf, density or CDF — from
      which each marginal follows by summing the others out, but not conversely.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.random-variables.pmf
      - quant-probability.random-variables.pdf
    relates: []
    tags: []

  - id: quant-probability.joint.independence-rvs
    kind: definition
    prominence: 1
    title: "Independence of random variables"
    statement: >
      $X$ and $Y$ are independent if $\Pr(X \in A, Y \in B)
      = \Pr(X \in A)\Pr(Y \in B)$ for all events $\{X \in A\}$, $\{Y \in B\}$;
      equivalently the joint factors, $F(x,y) = F_X(x)F_Y(y)$ for every $x,y$,
      or $p(x,y) = p_X(x)p_Y(y)$, or $f(x,y) = f_X(x)f_Y(y)$. Variables
      $X_1,\dots,X_n$ are mutually independent when the joint factors across
      every subset, strictly stronger than pairwise independence; iid adds a
      common marginal. Working test: independence holds if and only if the
      joint density splits as $g(x)h(y)$ for some nonnegative $g,h$ — you never
      have to normalize, since the constants sort themselves out. Independence
      is preserved by functions: $g(X)$ and $h(Y)$ are then independent too.
    summary: >
      The joint law factors into the marginals — no information flows from one
      variable to the other, and functions of them stay independent.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.joint-law
      - quant-probability.foundations.independence-events
    relates: []
    tags: []

  - id: quant-probability.joint.support-rectangle-test
    kind: technique
    prominence: 0
    title: "Support test for dependence"
    statement: >
      Look at the support before doing any algebra. If $X$ and $Y$ are
      independent, the set where the joint density is positive must be a
      product set $S_X \times S_Y$ — a rectangle, possibly unbounded — because
      $f_X(x)f_Y(y) > 0$ exactly when both factors are. So any joint supported
      on a triangle, a disc, or any region whose $y$-range moves with $x$ is
      dependent, with no computation. Worked: $(X,Y)$ uniform on
      $\{0 < x < y < 1\}$ has $f = 2$ there, marginals $f_X(x) = 2(1-x)$ and
      $f_Y(y) = 2y$, and $f_X f_Y \ne f$ — indeed $X = 0.9$ forces
      $Y > 0.9$. The test is one-way: a rectangular support proves nothing on
      its own, and you must still check the factorization.
    summary: >
      A non-rectangular support kills independence instantly; a rectangular one
      is necessary but not sufficient.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.independence-rvs
    relates: []
    tags: []

  - id: quant-probability.joint.covariance
    kind: definition
    prominence: 2
    title: "Covariance"
    statement: >
      For $X,Y$ with finite variances,
      $\operatorname{Cov}(X,Y)
      = \mathbb{E}[(X - \mathbb{E}[X])(Y - \mathbb{E}[Y])]
      = \mathbb{E}[XY] - \mathbb{E}[X]\mathbb{E}[Y]$, the second form being the
      one you compute. It is symmetric, satisfies
      $\operatorname{Cov}(X,X) = \operatorname{Var}(X)$, and vanishes when
      either argument is constant. Sign reading: positive when the two tend to
      land on the same side of their means, negative when on opposite sides.
      Its units are those of $X$ times those of $Y$, so the bare number is not
      comparable across problems — that is what correlation repairs. Worked:
      roll a fair die, let $X$ be the face and
      $Y = \mathbf{1}\{X \text{ is even}\}$.
      Then $\mathbb{E}[XY] = (2+4+6)/6 = 2$ and
      $\mathbb{E}[X]\mathbb{E}[Y] = 3.5 \cdot 0.5 = 1.75$, so
      $\operatorname{Cov}(X,Y) = 0.25$.
    summary: >
      The mean product of the two centred variables — a signed, unit-carrying
      measure of whether they deviate from their means together.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.joint-law
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.joint.covariance-bilinearity
    kind: proposition
    prominence: 1
    title: "Covariance is bilinear"
    statement: >
      Assume all variances are finite. Covariance is shift-invariant and
      bilinear: $\operatorname{Cov}(aX + b,\, cY + d)
      = ac\operatorname{Cov}(X,Y)$, and in general
      $\operatorname{Cov}\left(\sum_i a_i X_i,\, \sum_j b_j Y_j\right)
      = \sum_i \sum_j a_i b_j \operatorname{Cov}(X_i, Y_j)$. Constants drop out
      because centring removes them. That is the whole computational content:
      expand, then collect. Worked:
      $\operatorname{Cov}(X + Y,\, X - Y)
      = \operatorname{Var}(X) - \operatorname{Var}(Y)$, so the sum and the
      difference of two equal-variance variables are always uncorrelated. Two
      fair dice illustrate the gap between uncorrelated and independent: sum
      and difference have covariance $0$, yet they always share the same parity.
    summary: >
      Covariance expands over linear combinations and ignores added constants,
      which reduces every covariance computation to bookkeeping.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.covariance
    relates: []
    tags: []

  - id: quant-probability.joint.independence-zero-covariance
    kind: corollary
    prominence: 1
    title: "Independent variables are uncorrelated"
    statement: >
      If $X$ and $Y$ are independent and $\mathbb{E}|X|, \mathbb{E}|Y|$ are
      finite, then $\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]$: integrate the
      product against the factored joint and the double integral separates.
      More generally $\mathbb{E}[g(X)h(Y)]
      = \mathbb{E}[g(X)]\,\mathbb{E}[h(Y)]$ whenever both sides are finite.
      Subtracting gives $\operatorname{Cov}(X,Y) = 0$, so independence implies
      zero covariance and zero correlation. The implication runs one way only.
      Zero covariance says merely that no linear association remains, which is
      a far weaker claim than "no association at all"; treating the two as the
      same is the single most common error in this subbranch.
    summary: >
      Independence factors expectations of products, so it forces covariance to
      be zero — but the converse fails badly.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.covariance
      - quant-probability.joint.independence-rvs
    relates: []
    tags: []

  - id: quant-probability.joint.correlation
    kind: definition
    prominence: 2
    title: "Correlation"
    statement: >
      For $X,Y$ with finite, nonzero variances,
      $\rho_{XY} = \operatorname{Corr}(X,Y)
      = \dfrac{\operatorname{Cov}(X,Y)}{\sigma_X \sigma_Y}$. Applying
      Cauchy–Schwarz to the centred variables gives
      $|\operatorname{Cov}(X,Y)| \le \sigma_X \sigma_Y$, hence
      $-1 \le \rho_{XY} \le 1$; equality $|\rho_{XY}| = 1$ holds exactly when
      $Y = aX + b$ with probability $1$, with $\rho_{XY}$ taking the sign of
      $a$. Correlation is dimensionless and unchanged by rescaling:
      $\operatorname{Corr}(aX+b,\, cY+d) = \operatorname{sgn}(ac)\,\rho_{XY}$.
      That invariance is why $\rho$, and not covariance, is the number anyone
      quotes: $\rho = 0.4$ means the same thing whether the variables are
      measured in ticks or in dollars.
    summary: >
      Covariance divided by the two standard deviations — a unit-free number in
      $[-1,1]$ that hits the endpoints exactly under an exact linear relation.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.covariance
      - quant-tools.series-calculus.cauchy-schwarz
    relates: []
    tags: []

  - id: quant-probability.joint.correlation-linear-only
    kind: intuition
    prominence: 1
    title: "What correlation does and does not measure"
    statement: >
      $\rho$ measures exactly one thing: how close the joint cloud sits to a
      straight line. It is blind to curved dependence, so $\rho = 0$ can
      coexist with one variable determining the other outright, and it says
      nothing about the direction of causation between the two. Read magnitudes
      through $\rho^{2}$, the fraction of variance a linear fit removes:
      $\rho = 0.3$ removes only $9\%$, so mid-range correlations are weaker
      than they sound. The trading counterweight is that a tiny edge repeated
      often is still an edge — a signal with $\rho = 0.05$ against next-period
      returns explains $0.25\%$ of variance and can still be extremely
      valuable, because the payoff scales with the number of independent bets.
    summary: >
      Correlation captures linear co-movement only; square it to read its
      strength honestly, and remember that tiny $\rho$ repeated often still pays.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.correlation
    relates: []
    tags: []

  - id: quant-probability.joint.uncorrelated-not-independent
    kind: example
    prominence: 1
    title: "Uncorrelated but not independent"
    statement: >
      Let $X$ be uniform on $[-1,1]$ and $Y = X^{2}$. By symmetry
      $\mathbb{E}[X] = 0$ and $\mathbb{E}[XY] = \mathbb{E}[X^{3}] = 0$, so
      $\operatorname{Cov}(X,Y) = 0$ and $\rho = 0$ — yet $Y$ is a deterministic
      function of $X$. The dependence is visible in any conditional statement:
      $\Pr(Y > 1/2) = 1 - 1/\sqrt{2} \approx 0.293$, while given $X = 0$ the
      same event has probability $0$. Any law of $X$ symmetric about $0$ with a
      finite third moment works the same way. Second standard example:
      $(X,Y)$ uniform on the unit circle has $\mathbb{E}[XY] = 0$ but
      $X^{2} + Y^{2} = 1$ always. The lesson is one line — zero correlation
      rules out linear structure and nothing else.
    summary: >
      $Y = X^{2}$ with $X$ symmetric about $0$: correlation exactly $0$, yet
      $X$ determines $Y$ completely.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.independence-zero-covariance
      - quant-probability.joint.correlation
    relates: []
    tags: []

  - id: quant-probability.joint.variance-sum
    kind: proposition
    prominence: 2
    title: "Variance of a sum"
    statement: >
      For finite-variance variables,
      $\operatorname{Var}\left(\sum_{i=1}^{n} X_i\right)
      = \sum_{i=1}^{n}\operatorname{Var}(X_i)
      + 2\sum_{i<j}\operatorname{Cov}(X_i,X_j)$, and with weights
      $\operatorname{Var}\left(\sum_i a_i X_i\right)
      = \sum_i \sum_j a_i a_j \operatorname{Cov}(X_i,X_j)$. For two variables,
      $\operatorname{Var}(X \pm Y) = \operatorname{Var}(X)
      + \operatorname{Var}(Y) \pm 2\operatorname{Cov}(X,Y)$. Unlike expectation,
      variance is not additive in general: the cross-terms are exactly where
      dependence enters, and with $n$ variables there are $n$ variance terms
      against $n(n-1)$ covariance terms, so for large $n$ the covariances
      dominate. Worked: if $\sigma_X = \sigma_Y = 1$ and $\rho = 0.5$ then
      $\operatorname{Var}(X+Y) = 3$, against $2$ under independence.
    summary: >
      Variances add only after you pay for the covariance cross-terms — the
      place where dependence enters every risk calculation.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.covariance-bilinearity
    relates: []
    tags: []

  - id: quant-probability.joint.variance-independent-sum
    kind: corollary
    prominence: 1
    title: "Variances add for uncorrelated summands"
    statement: >
      If $X_1,\dots,X_n$ are pairwise uncorrelated — which independence
      supplies but is strictly weaker than it, since only the pair covariances
      need vanish — every cross-term drops and
      $\operatorname{Var}\left(\sum_i X_i\right)
      = \sum_i \operatorname{Var}(X_i)$; for $n$ iid copies of variance
      $\sigma^{2}$ this is $n\sigma^{2}$, giving the familiar $\sqrt{n}$ scale.
      The sign trap: uncorrelated $X,Y$ satisfy
      $\operatorname{Var}(X - Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$,
      not the difference — a spread between two noisy quantities is noisier
      than either leg, which is why hedges only reduce variance when the legs
      are genuinely positively correlated.
    summary: >
      Pairwise zero covariance is all you need for variances to add, and it
      makes differences as noisy as sums.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.variance-sum
      - quant-probability.joint.independence-zero-covariance
    relates: []
    tags: []

  - id: quant-probability.joint.covariance-matrix
    kind: definition
    prominence: 1
    title: "Covariance matrix"
    statement: >
      For a random vector $X = (X_1,\dots,X_n)$ with finite variances, the
      covariance matrix $\Sigma$ has entries
      $\Sigma_{ij} = \operatorname{Cov}(X_i, X_j)$, so its diagonal carries the
      variances and it is symmetric. It is positive semidefinite: for any
      constant vector $a$, the weighted variance-of-a-sum formula reads
      $a'\Sigma a = \operatorname{Var}(a'X) \ge 0$. It is singular exactly when
      some nonzero combination $a'X$ is constant with probability $1$, that is
      when the coordinates obey an exact linear relation. Affine maps transform
      it as $\operatorname{Cov}(AX + b) = A\Sigma A'$. The correlation matrix
      is $D^{-1}\Sigma D^{-1}$ with $D = \operatorname{diag}(\sigma_1,\dots,
      \sigma_n)$, which has ones on the diagonal and is PSD as well.
    summary: >
      All pairwise covariances in one symmetric PSD matrix, whose quadratic
      form $a'\Sigma a$ is the variance of the corresponding combination.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.covariance-bilinearity
    relates:
      - id: quant-tools.linear-algebra.psd
        note: >
          Covariance matrices are the canonical source of positive semidefinite
          matrices: the quadratic form $a'\Sigma a$ is a variance and so cannot
          be negative, and conversely every symmetric PSD matrix is realizable
          as some vector's covariance.
    tags: []

  - id: quant-probability.joint.correlation-transitivity
    kind: proposition
    prominence: 1
    title: "Correlation is not transitive"
    statement: >
      Correlations cannot be assigned freely, because the correlation matrix
      must be positive semidefinite. With $\rho_{XY}$ and $\rho_{YZ}$ fixed,
      the nonnegativity of the $3 \times 3$ determinant confines the third to
      $\rho_{XZ} \in \left[\rho_{XY}\rho_{YZ}
      - \sqrt{(1-\rho_{XY}^{2})(1-\rho_{YZ}^{2})},\;
      \rho_{XY}\rho_{YZ}
      + \sqrt{(1-\rho_{XY}^{2})(1-\rho_{YZ}^{2})}\right]$. Standard interview
      question: if $\operatorname{Corr}(X,Y) = \operatorname{Corr}(Y,Z) = 0.6$,
      what values can $\operatorname{Corr}(X,Z)$ take? The bound gives
      $0.36 \pm 0.64$, that is $[-0.28, 1]$ — $X$ and $Z$ may be negatively
      correlated. Positivity is forced only once both legs exceed
      $1/\sqrt{2}$: at $0.8$ and $0.8$ the range is $[0.28, 1]$.
    summary: >
      Two strong correlations with a common middle variable need not produce a
      third: at $0.6$ and $0.6$, the remaining correlation can be as low as
      $-0.28$.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.correlation
      - quant-probability.joint.covariance-matrix
    relates: []
    tags: []

  - id: quant-probability.joint.equicorrelation-bound
    kind: proposition
    prominence: 0
    title: "How negative can a common correlation be?"
    statement: >
      Suppose $X_1,\dots,X_n$ each have variance $\sigma^{2} > 0$ and every
      pair has the same correlation $\rho$. Then
      $\operatorname{Var}\left(\sum_i X_i\right)
      = n\sigma^{2}\left(1 + (n-1)\rho\right)$, and nonnegativity of a variance
      forces $\rho \ge -\dfrac{1}{n-1}$. So a large collection cannot all be
      mutually negatively correlated: three variables allow $\rho \ge -1/2$,
      ten allow only $\rho \ge -1/9$, and the floor rises to $0$ as
      $n \to \infty$. Only $n = 2$ permits $\rho = -1$. The upper end is never
      binding — $\rho = 1$, all variables equal, is always attainable. The
      asymmetry is worth carrying: everything can move together, but everything
      cannot move apart.
    summary: >
      Equally correlated variables satisfy $\rho \ge -1/(n-1)$, so mutual
      negative correlation is essentially impossible for large $n$.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.variance-sum
      - quant-probability.joint.correlation
    relates: []
    tags: []

  - id: quant-probability.joint.convolution
    kind: technique
    prominence: 1
    title: "Convolution: the law of a sum"
    statement: >
      To find the law of $S = X + Y$ for independent $X$ and $Y$, add up the
      ways of splitting the total. Discrete:
      $p_S(s) = \sum_x p_X(x)\,p_Y(s - x)$. Continuous:
      $f_S(s) = \int_{-\infty}^{\infty} f_X(x)\,f_Y(s-x)\,dx$, with the limits
      cut down by the supports — for nonnegative variables the integral runs
      from $0$ to $s$. The same move handles a difference,
      $f_{X-Y}(d) = \int_{-\infty}^{\infty} f_X(x)\,f_Y(x-d)\,dx$; for a
      product or ratio, change variables in the joint density instead.
      Independence is essential — without it you must integrate the true joint.
      Reach for convolution only when no closure rule applies, since
      generating functions turn the same computation into multiplication.
    summary: >
      Slide one density past the other and integrate: the density of a sum of
      independent variables is the convolution of their densities.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.independence-rvs
    relates: []
    tags: []

  - id: quant-probability.joint.convolution-poisson
    kind: example
    prominence: 0
    title: "Sum of independent Poissons"
    statement: >
      Let $X \sim \operatorname{Poisson}(\lambda)$ and
      $Y \sim \operatorname{Poisson}(\mu)$ be independent. Convolving,
      $\Pr(X + Y = n)
      = \sum_{k=0}^{n} e^{-\lambda}\dfrac{\lambda^{k}}{k!}\,
      e^{-\mu}\dfrac{\mu^{n-k}}{(n-k)!}
      = \dfrac{e^{-(\lambda+\mu)}}{n!}\sum_{k=0}^{n}
      \binom{n}{k}\lambda^{k}\mu^{n-k}
      = e^{-(\lambda+\mu)}\dfrac{(\lambda+\mu)^{n}}{n!}$
      by the binomial theorem, so $X + Y \sim
      \operatorname{Poisson}(\lambda+\mu)$. Reading the middle step backwards
      gives the splitting fact: given $X + Y = n$, $X$ is
      $\operatorname{Binomial}(n, \lambda/(\lambda+\mu))$. With $\lambda = 2$
      and $\mu = 3$ per minute, the pooled stream is Poisson with mean $5$ and
      each arrival came from the first source with probability $0.4$.
    summary: >
      One convolution proves Poisson additivity and, read backwards, the
      binomial splitting of a pooled stream.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.convolution
    relates:
      - id: quant-probability.discrete.poisson
        note: >
          That node records additivity as part of the Poisson law; this is the
          convolution computation behind it, and it also yields the binomial
          conditional split of the total.
    tags: []

  - id: quant-probability.joint.expected-max-min
    kind: technique
    prominence: 1
    title: "Expected max and min of two variables"
    statement: >
      For any $X,Y$ with finite means — no independence needed — use the two
      identities $\max(X,Y) + \min(X,Y) = X + Y$ and
      $\max(X,Y) - \min(X,Y) = |X - Y|$. Taking expectations and solving,
      $\mathbb{E}[\max(X,Y)]
      = \dfrac{\mathbb{E}[X] + \mathbb{E}[Y] + \mathbb{E}|X - Y|}{2}$, and
      $\mathbb{E}[\min(X,Y)]$ is the same expression with a minus sign. All the
      dependence is packed into the single number $\mathbb{E}|X-Y|$. Worked:
      for $X,Y$ iid uniform on $[0,1]$, integrating $|x-y|$ over the unit
      square gives $1/3$, so $\mathbb{E}[\max] = (1/2 + 1/2 + 1/3)/2 = 2/3$ and
      $\mathbb{E}[\min] = 1/3$, matching the order-statistic means
      $k/(n+1)$.
    summary: >
      Max plus min is the sum and max minus min is the absolute difference, so
      both means follow from $\mathbb{E}|X-Y|$ — for two uniforms, $2/3$ and
      $1/3$.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.joint-law
    relates:
      - id: quant-probability.random-variables.min-max
        note: >
          Those CDFs of extremes of independent variables give the alternative
          route to the same means through a tail integral; the identity here
          needs no independence at all.
    tags: []

  - id: quant-probability.joint.bivariate-normal
    kind: proposition
    prominence: 2
    title: "Bivariate normal"
    statement: >
      $(X,Y)$ is bivariate normal when every linear combination $aX + bY$ is
      univariate normal. The law is then pinned by five numbers —
      $\mu_X, \mu_Y, \sigma_X, \sigma_Y, \rho$ — the marginals are
      $N(\mu_X,\sigma_X^{2})$ and $N(\mu_Y,\sigma_Y^{2})$, and $\rho$ is the
      complete description of the dependence. Given $X = x$, the conditional
      law of $Y$ is again normal, with mean
      $\mu_Y + \rho\dfrac{\sigma_Y}{\sigma_X}(x - \mu_X)$ — linear in $x$,
      which is the population regression line — and variance
      $\sigma_Y^{2}(1-\rho^{2})$, free of $x$. Note the shrinkage: a one-sigma
      move in $X$ forecasts only a $\rho$-sigma move in $Y$, never a full one.
    summary: >
      Five parameters describe the whole joint law; conditionals stay normal
      with means linear in the conditioning value and variance
      $\sigma_Y^{2}(1-\rho^{2})$.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.correlation
      - quant-probability.continuous.normal
    relates: []
    tags: []

  - id: quant-probability.joint.bivariate-normal-independence
    kind: corollary
    prominence: 1
    title: "Jointly normal and uncorrelated ⇒ independent"
    statement: >
      If $(X,Y)$ is bivariate normal with $\rho = 0$, the joint density factors
      into the two normal marginals, so $X$ and $Y$ are independent. This is
      the one important family in which uncorrelated and independent coincide,
      and it is why $\rho$ alone settles dependence questions for normals. The
      hypothesis is joint normality, not two normal marginals. Counterexample:
      take $X \sim N(0,1)$ and an independent sign $S = \pm 1$ with equal
      probability, and set $Y = SX$. Then $Y \sim N(0,1)$ and
      $\operatorname{Cov}(X,Y) = \mathbb{E}[S]\,\mathbb{E}[X^{2}] = 0$, yet
      $|Y| = |X|$ always. The pair is not bivariate normal, and indeed
      $X + Y$ equals $0$ half the time.
    summary: >
      Zero correlation means independence for jointly normal pairs only — two
      normal marginals are not enough, as $Y = \pm X$ shows.
    parent: quant-probability.joint
    also_under: []
    requires:
      - quant-probability.joint.bivariate-normal
      - quant-probability.joint.uncorrelated-not-independent
    relates: []
    tags: []

  - id: quant-probability.joint.multivariate-normal
    kind: definition
    prominence: 1
    title: "Multivariate normal"
    statement: >
      A random vector $X = (X_1,\dots,X_n)$ is multivariate normal with mean
      vector $\mu$ and covariance matrix $\Sigma$ when $a'X$ is univariate
      normal for every constant vector $a$; then
      $a'X \sim N(a'\mu,\, a'\Sigma a)$, which is the only computation most
      questions need. Consequences: every subvector is again multivariate
      normal, affine images stay in the family with
      $AX + b \sim N(A\mu + b,\, A\Sigma A')$, and blocks with zero
      cross-covariance are independent. When $\Sigma$ is nonsingular the
      density is proportional to
      $\exp\left(-\tfrac{1}{2}(x-\mu)'\Sigma^{-1}(x-\mu)\right)$. Any $\mu$ and
      any symmetric PSD $\Sigma$ are attainable: set $X = \mu + AZ$ where
      $AA' = \Sigma$ and $Z$ has iid standard normal coordinates.
    summary: >
      Mean vector plus covariance matrix determine the whole law, and every
      linear combination is normal with variance $a'\Sigma a$.
