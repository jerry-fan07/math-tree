# quant-probability.discrete — Discrete Distributions
# Outline node (09 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-probability.discrete
    kind: subbranch
    title: "Discrete Distributions"
    summary: >
      The named discrete laws with their means, variances and interview
      signatures — Bernoulli through Poisson, plus the coupon collector.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.discrete.bernoulli
    kind: definition
    prominence: 1
    title: "Bernoulli distribution"
    statement: >
      $X \sim \operatorname{Bernoulli}(p)$ takes the value $1$ with probability
      $p$ and $0$ otherwise, where $0 \le p \le 1$; it is exactly the indicator
      of an event of probability $p$. Because $X^{2} = X$, the first two moments
      coincide: $\mathbb{E}[X] = \mathbb{E}[X^{2}] = p$, so
      $\operatorname{Var}(X) = p - p^{2} = p(1-p)$, which is maximal at
      $p = 1/2$ where it equals $1/4$ and vanishes at $p = 0$ and $p = 1$. Every
      yes/no question — a coin landing heads, a trade being profitable, a quote
      being lifted — is a Bernoulli, and every other law in this subbranch is
      built by counting or waiting on a stream of them. The convention
      $\text{success} = 1$ is what lets counts be written as sums.
    summary: >
      The single 0/1 trial with mean $p$ and variance $p(1-p)$ — the atom out of
      which the binomial, geometric and negative binomial are assembled.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.expectation.variance
    relates: []
    tags: []

  - id: quant-probability.discrete.binomial
    kind: definition
    prominence: 2
    title: "Binomial distribution"
    statement: >
      $X \sim \operatorname{Bin}(n,p)$ counts the successes in $n$ trials that
      are independent and share the same success probability $p$; both
      hypotheses are needed, and dropping either breaks the pmf. That pmf is
      $\Pr(X = k) = \binom{n}{k} p^{k}(1-p)^{n-k}$ for $k = 0,1,\dots,n$: choose
      which $k$ of the $n$ trials succeed, then pay $p$ for each success and
      $1-p$ for each failure. Special cases and symmetries:
      $\operatorname{Bin}(1,p)$ is Bernoulli$(p)$, and $n - X \sim
      \operatorname{Bin}(n,1-p)$. The pmf's terms are the terms of the expansion
      of $(p + (1-p))^{n} = 1$, the fastest normalization check. Interview
      signature: "a fixed number of trials, count the hits".
    summary: >
      The number of successes in $n$ independent identical trials, with pmf
      $\binom{n}{k}p^{k}(1-p)^{n-k}$ — the default law whenever $n$ is fixed in
      advance.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.bernoulli
      - quant-probability.counting.combinations
      - quant-probability.foundations.independence-events
    relates:
      - id: quant-probability.counting.binomial-theorem
        note: >
          The binomial pmf is literally the term-by-term expansion of
          $(p + q)^{n}$ with $q = 1-p$, which is why its terms sum to $1$.
    tags: []

  - id: quant-probability.discrete.binomial-mean-variance
    kind: proposition
    prominence: 1
    title: "Binomial mean and variance"
    statement: >
      Write $X = X_1 + \dots + X_n$ with the $X_i$ independent Bernoulli$(p)$
      indicators of the individual trials. Linearity gives
      $\mathbb{E}[X] = np$ immediately, and since the summands are independent
      their variances add, so $\operatorname{Var}(X) = np(1-p)$ and
      $\sigma = \sqrt{np(1-p)}$. Neither the pmf nor any sum over $k$ is needed.
      Worked: $100$ fair tosses give mean $50$ and $\sigma = \sqrt{25} = 5$, so
      $60$ heads sits two standard deviations out; $n = 1000$, $p = 0.3$ gives
      mean $300$ and $\sigma = \sqrt{210} \approx 14.5$. The spread grows like
      $\sqrt{n}$ while the mean grows like $n$, so the observed proportion
      $X/n$ has standard deviation $\sqrt{p(1-p)/n}$ and concentrates.
    summary: >
      Mean $np$ by linearity and variance $np(1-p)$ by independence — decompose
      into indicators and never touch the pmf.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.binomial
    relates: []
    tags: []

  - id: quant-probability.discrete.binomial-mode
    kind: proposition
    prominence: 0
    title: "Mode of the binomial"
    statement: >
      Consecutive binomial probabilities have the ratio
      $\dfrac{\Pr(X=k)}{\Pr(X=k-1)} = \dfrac{n-k+1}{k}\cdot\dfrac{p}{1-p}$,
      which is $\ge 1$ exactly when $k \le (n+1)p$. The pmf therefore rises then
      falls, and the mode is $\lfloor (n+1)p \rfloor$; when $(n+1)p$ is an
      integer the two values $(n+1)p$ and $(n+1)p - 1$ are tied modes. Worked:
      $\operatorname{Bin}(10, 0.3)$ has $(n+1)p = 3.3$ and mode $3$, while
      $\operatorname{Bin}(9, 0.3)$ has $(n+1)p = 3$ and modes $2$ and $3$, each
      with probability $\approx 0.267$. The mode is within one of the mean $np$,
      which is the sanity check worth remembering.
    summary: >
      The most likely count is $\lfloor (n+1)p \rfloor$, found by the ratio of
      consecutive pmf values, and it always sits within $1$ of $np$.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.binomial
    relates: []
    tags: []

  - id: quant-probability.discrete.binomial-additivity
    kind: proposition
    prominence: 0
    title: "Sums of independent binomials"
    statement: >
      If $X \sim \operatorname{Bin}(m,p)$ and $Y \sim \operatorname{Bin}(n,p)$
      are independent with the same $p$, then
      $X + Y \sim \operatorname{Bin}(m+n,p)$. The one-line proof is to pool the
      trials: both count successes in disjoint blocks of trials that are
      independent and share $p$. Computing the convolution instead reproduces
      the Vandermonde identity
      $\sum_{k} \binom{m}{k}\binom{n}{j-k} = \binom{m+n}{j}$. The equal-$p$
      hypothesis is essential: a sum of $\operatorname{Bin}(m,p)$ and
      $\operatorname{Bin}(n,q)$ with $p \ne q$ has mean $mp + nq$ but is not
      binomial. Three tosses plus five tosses of a fair coin is
      $\operatorname{Bin}(8, 1/2)$.
    summary: >
      Binomials with a common $p$ add by pooling their trials; different success
      probabilities destroy the property.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.binomial
    relates: []
    tags: []

  - id: quant-probability.discrete.geometric
    kind: definition
    prominence: 2
    title: "Geometric distribution"
    statement: >
      Run independent Bernoulli$(p)$ trials with $p > 0$ and let $X$ be the
      index of the first success. Then $\Pr(X = k) = (1-p)^{k-1}p$ for
      $k = 1,2,\dots$, which sums to $p/(1 - (1-p)) = 1$ by the geometric
      series. The tails are the reason to like this law:
      $\Pr(X \ge k) = (1-p)^{k-1}$ and $\Pr(X > k) = (1-p)^{k}$, so $X$ is
      finite with probability $1$. Convention trap worth stating out loud: many
      texts use $Y = X - 1$, the number of failures before the first success,
      with pmf $(1-p)^{k}p$ on $k = 0,1,2,\dots$ and mean $(1-p)/p$ rather than
      $1/p$. Say which one you are pricing.
    summary: >
      The trial number of the first success, with tail $(1-p)^{k-1}$ — the
      waiting-time law, and the one whose two conventions differ by exactly $1$.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.bernoulli
      - quant-tools.series-calculus.geometric-series
    relates: []
    tags: []

  - id: quant-probability.discrete.geometric-moments
    kind: proposition
    prominence: 1
    title: "Geometric mean and variance"
    statement: >
      For $X$ geometric on $\{1,2,\dots\}$ with parameter $p$, the tail sum
      gives the mean in one line:
      $\mathbb{E}[X] = \sum_{k \ge 1}\Pr(X \ge k)
      = \sum_{k \ge 1}(1-p)^{k-1} = 1/p$. The second moment is
      $\mathbb{E}[X^{2}] = (2-p)/p^{2}$, so
      $\operatorname{Var}(X) = (1-p)/p^{2}$ and
      $\sigma = \sqrt{1-p}\,/p$. For rare successes $\sigma \approx 1/p$: a
      geometric wait is about as uncertain as it is long, which is why a single
      observed waiting time says almost nothing about $p$. Worked at
      $p = 1/6$: mean $6$, variance $30$, $\sigma \approx 5.48$.
    summary: >
      Mean $1/p$ straight off the tail sum, variance $(1-p)/p^{2}$ — and a
      standard deviation nearly equal to the mean when $p$ is small.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.geometric
      - quant-probability.expectation.tail-sum
    relates: []
    tags: []

  - id: quant-probability.discrete.memoryless-geometric
    kind: proposition
    prominence: 1
    title: "Memorylessness of the geometric"
    statement: >
      If $X$ is geometric on $\{1,2,\dots\}$ then for all integers
      $m, n \ge 0$, $\Pr(X > m + n \mid X > m) = \Pr(X > n)$. Proof:
      $\Pr(X > m+n) = (1-p)^{m+n} = (1-p)^{m}(1-p)^{n}$, and divide. The
      geometric is the unique law on $\{1,2,\dots\}$ with this property, since
      $g(k) = \Pr(X > k)$ must satisfy $g(m+n) = g(m)g(n)$ with $g(1) = 1-p$,
      forcing $g(k) = (1-p)^{k}$. Interview use: after ten failed tosses the
      expected number of further tosses to the first head is still $1/p$ — the
      coin has no memory, and "it is due" is the gambler's fallacy. The
      continuous analogue is the exponential law.
    summary: >
      A geometric wait restarts from scratch after any run of failures, and it
      is the unique discrete law that does.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.geometric
    relates: []
    tags: []

  - id: quant-probability.discrete.waiting-for-a-six
    kind: example
    prominence: 1
    title: "Expected rolls to see a six"
    statement: >
      How many rolls of a fair die until the first six? The count is geometric
      with $p = 1/6$, so the answer is $\mathbb{E}[X] = 6$; the same reasoning
      gives $2$ tosses to the first head of a fair coin and $1/p$ in general.
      The distribution is strongly right-skewed, so the mean is not the typical
      value: $\Pr(X > k) = (5/6)^{k}$ gives $\Pr(X > 3) = 0.579$ and
      $\Pr(X > 4) = 0.482$, so the median is $4$, and
      $\Pr(X > 6) = (5/6)^{6} = 0.335$ — a third of the time six rolls produce
      no six at all. Caution: waiting for a two-symbol pattern such as $HH$ is not
      geometric, because overlapping windows are dependent.
    summary: >
      Six rolls on average for a six and two tosses for a head, with a median of
      only $4$ rolls — the geometric mean sits well above its typical value.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.geometric-moments
    relates: []
    tags: []

  - id: quant-probability.discrete.negative-binomial
    kind: definition
    prominence: 1
    title: "Negative binomial distribution"
    statement: >
      Let $X$ be the trial on which the $r$-th success occurs in independent
      Bernoulli$(p)$ trials. Then
      $\Pr(X = k) = \binom{k-1}{r-1}p^{r}(1-p)^{k-r}$ for $k \ge r$: the $k$-th
      trial must be a success and the other $r-1$ successes fall anywhere among
      the first $k-1$ trials. Because $X$ is a sum of $r$ independent geometric
      waits, $\mathbb{E}[X] = r/p$ and
      $\operatorname{Var}(X) = r(1-p)/p^{2}$; $r = 1$ recovers the geometric.
      Convention trap: the "failures before the $r$-th success" version
      $Y = X - r$ has support $\{0,1,2,\dots\}$ and mean $r(1-p)/p$. Worked:
      expected rolls to see three sixes is $3 \cdot 6 = 18$, with
      $\sigma = \sqrt{90} \approx 9.5$.
    summary: >
      The waiting time for the $r$-th success — a sum of $r$ geometrics, mean
      $r/p$, variance $r(1-p)/p^{2}$.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.geometric-moments
      - quant-probability.discrete.binomial
    relates: []
    tags: []

  - id: quant-probability.discrete.poisson
    kind: definition
    prominence: 2
    title: "Poisson distribution"
    statement: >
      $X \sim \operatorname{Poisson}(\lambda)$ with $\lambda > 0$ has
      $\Pr(X = k) = e^{-\lambda}\lambda^{k}/k!$ on $k = 0,1,2,\dots$, which
      normalizes because $\sum_{k \ge 0}\lambda^{k}/k! = e^{\lambda}$. Its
      signature identity is $\mathbb{E}[X] = \operatorname{Var}(X) = \lambda$;
      the quickest derivation uses the factorial moment
      $\mathbb{E}[X(X-1)] = \lambda^{2}$. The mode is
      $\lfloor \lambda \rfloor$, tied with $\lambda - 1$ when $\lambda$ is an
      integer. It models counts of events in a fixed window —
      trades in a second, defaults in a year, typos on a page — when events
      occur independently at a constant rate. Diagnostic: a sample variance far
      above the sample mean means the data is overdispersed and not Poisson.
    summary: >
      The count law with mean and variance both $\lambda$ — what you reach for
      when events are rare, independent, and there is no natural number of
      trials.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.binomial
    relates: []
    tags: []

  - id: quant-probability.discrete.poisson-limit
    kind: theorem
    prominence: 1
    title: "Poisson limit of the binomial (law of rare events)"
    statement: >
      Let $X_n \sim \operatorname{Bin}(n, p_n)$ with $n p_n \to \lambda \in
      (0,\infty)$ as $n \to \infty$. Then for every fixed $k$,
      $\Pr(X_n = k) \to e^{-\lambda}\lambda^{k}/k!$. Sketch: write
      $\binom{n}{k}p^{k}(1-p)^{n-k}
      = \dfrac{n(n-1)\cdots(n-k+1)}{n^{k}}\cdot\dfrac{(np)^{k}}{k!}\cdot
      (1-p)^{n-k}$; the first factor tends to $1$, the middle to
      $\lambda^{k}/k!$, and $(1 - \lambda/n)^{n} \to e^{-\lambda}$ by the
      exponential limit. The error is controlled by $n p^{2}$, so the
      approximation is good for $n \ge 20$ and $p \le 0.05$. Worked: $n = 1000$,
      $p = 0.002$, $\lambda = 2$ gives exact $\Pr(X = 0) = 0.998^{1000} = 0.1351$
      against $e^{-2} = 0.1353$.
    summary: >
      Many trials with tiny success probability and a fixed product $np$ turn
      binomial counts into Poisson counts — the reason Poisson shows up at all.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.poisson
      - quant-tools.series-calculus.exp-limit
    relates: []
    tags: []

  - id: quant-probability.discrete.poisson-additivity
    kind: proposition
    prominence: 0
    title: "Sums and splits of independent Poissons"
    statement: >
      If $X \sim \operatorname{Poisson}(\lambda)$ and
      $Y \sim \operatorname{Poisson}(\mu)$ are independent then
      $X + Y \sim \operatorname{Poisson}(\lambda + \mu)$; by induction, rates of
      independent Poisson counts simply add. Proof: convolve and recognise
      $\sum_{k}\binom{n}{k}\lambda^{k}\mu^{n-k} = (\lambda+\mu)^{n}$. The
      converse split is just as useful: conditional on $X + Y = n$, the first
      component is $\operatorname{Bin}(n, \lambda/(\lambda+\mu))$, so the total
      tells you nothing about the split beyond the rate ratio. Merging order
      flows of $3$ and $5$ per second gives a Poisson stream of $8$ per second,
      and each observed order came from the first flow with probability $3/8$.
    summary: >
      Independent Poisson counts add their rates, and given the total the split
      between them is binomial in the rate proportions.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.poisson
    relates: []
    tags: []

  - id: quant-probability.discrete.hypergeometric
    kind: definition
    prominence: 1
    title: "Hypergeometric distribution"
    statement: >
      An urn holds $N$ items of which $K$ are successes; draw $n$ of them
      without replacement and let $X$ count the successes drawn. Then
      $\Pr(X = k)
      = \dfrac{\binom{K}{k}\binom{N-K}{n-k}}{\binom{N}{n}}$ for
      $\max(0, n - (N-K)) \le k \le \min(n, K)$, and these sum to $1$ by
      Vandermonde's identity. The draws are dependent — each one depletes the
      urn — so this is not a binomial, though the pmf is symmetric under
      swapping the roles of $n$ and $K$ (choosing which $n$ to draw versus which
      $K$ are successes). Interview signature: "five cards from a deck",
      "inspect $10$ of a batch of $200$", "capture–recapture".
    summary: >
      Successes in a sample drawn without replacement from a finite pool — the
      binomial's dependent cousin, counted with three binomial coefficients.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.binomial
    relates: []
    tags: []

  - id: quant-probability.discrete.hypergeometric-moments
    kind: proposition
    prominence: 1
    title: "Hypergeometric mean and variance"
    statement: >
      With $N$ items, $K$ successes and $n$ draws without replacement,
      $\mathbb{E}[X] = n\dfrac{K}{N}$ — identical to the binomial mean with
      $p = K/N$. Proof: one indicator per draw; by exchangeability the $j$-th
      draw is a success with unconditional probability $K/N$, and linearity does
      not care that the draws are dependent. The variance picks up the
      finite-population correction:
      $\operatorname{Var}(X)
      = n\dfrac{K}{N}\left(1 - \dfrac{K}{N}\right)\dfrac{N-n}{N-1}$, a factor
      that is $1$ at $n = 1$ and $0$ at $n = N$, where drawing the whole urn
      leaves nothing random. Worked, hearts in a five-card hand:
      mean $5 \cdot 13/52 = 1.25$, variance $0.9375 \cdot 47/51 = 0.864$,
      $\sigma \approx 0.93$.
    summary: >
      The mean matches the binomial at $p = K/N$, while the variance is shrunk
      by the finite-population factor $(N-n)/(N-1)$.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.hypergeometric
    relates:
      - id: quant-probability.conditional.symmetry-exchangeability
        note: >
          The exchangeability that makes any single card equally likely to be an
          ace is exactly what gives each draw success probability $K/N$ here,
          dependence notwithstanding.
    tags: []

  - id: quant-probability.discrete.binomial-vs-hypergeometric
    kind: intuition
    prominence: 1
    title: "With replacement or without"
    statement: >
      The two sampling laws differ in exactly one modelling choice, and the
      first question to ask is "with replacement or without?". Both have mean
      $np$ with $p = K/N$, but sampling without replacement is self-correcting —
      an unusually rich early sample leaves a poorer urn — so its variance is
      smaller by the factor $(N-n)/(N-1) \le 1$. As $N \to \infty$ with $K/N \to
      p$ the hypergeometric converges to $\operatorname{Bin}(n,p)$, and the
      practical rule is that the difference is negligible when $n \le 0.05N$.
      Worked: hearts in a five-card hand have $\sigma \approx 0.93$, against
      $\sqrt{5 \cdot 0.25 \cdot 0.75} \approx 0.97$ if the cards were replaced.
    summary: >
      Same mean, smaller variance: depleting a finite pool damps fluctuations,
      and the gap vanishes once the sample is a small fraction of the pool.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.hypergeometric-moments
      - quant-probability.discrete.binomial-mean-variance
    relates: []
    tags: []

  - id: quant-probability.discrete.uniform-discrete
    kind: definition
    prominence: 1
    title: "Discrete uniform distribution"
    statement: >
      $X$ is uniform on $\{1,2,\dots,n\}$ when $\Pr(X = k) = 1/n$ for each $k$.
      Then $\mathbb{E}[X] = (n+1)/2$ by symmetry,
      $\mathbb{E}[X^{2}] = (n+1)(2n+1)/6$, and
      $\operatorname{Var}(X) = (n^{2}-1)/12$. On a general integer range
      $\{a, a+1, \dots, b\}$ the mean is $(a+b)/2$ and the variance is
      $((b-a+1)^{2}-1)/12$. A fair die is the case $n = 6$: mean $3.5$, variance
      $35/12 \approx 2.917$, $\sigma \approx 1.71$. Two warnings: uniformity is
      a modelling assumption that must be justified, not a default, and sums of
      independent uniforms are not uniform — two dice peak at $7$.
    summary: >
      Equally likely integer values, with mean $(n+1)/2$ and variance
      $(n^{2}-1)/12$ — the fair die and the fair spinner.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.expectation.variance
    relates:
      - id: quant-probability.foundations.classical
        note: >
          This is the classical equally-likely model given a numerical label, so
          probabilities are still favourable-over-total counts.
    tags: []

  - id: quant-probability.discrete.coupon-collector
    kind: example
    prominence: 1
    title: "Coupon collector"
    statement: >
      There are $n$ coupon types; each draw is uniform over the types and
      independent. Let $T$ be the number of draws until every type has been
      seen. Split $T = T_1 + \dots + T_n$, where $T_i$ is the wait for the
      $i$-th distinct type: holding $i-1$ types, a draw is new with probability
      $p_i = (n-i+1)/n$, so $T_i$ is geometric with
      $\mathbb{E}[T_i] = n/(n-i+1)$. Summing,
      $\mathbb{E}[T] = n\left(1 + \tfrac{1}{2} + \dots + \tfrac{1}{n}\right)
      = nH_n \approx n(\ln n + \gamma)$. For the six faces of a die
      $H_6 = 49/20$, so $\mathbb{E}[T] = 6 \cdot 2.45 = 14.7$ rolls, with
      $\operatorname{Var}(T) = \sum_i (1-p_i)/p_i^{2} \approx 39$ and
      $\sigma \approx 6.2$. For $n = 50$ the answer is about $225$ draws.
    summary: >
      Collecting all $n$ types takes $nH_n$ draws on average — $14.7$ rolls for
      the six faces of a die, about $225$ draws for $50$ coupons.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.geometric-moments
      - quant-tools.series-calculus.harmonic-numbers
    relates:
      - id: quant-probability.counting.permutation-cycles
        note: >
          Both answers are harmonic sums built the same way, by adding the
          reciprocals $1/i$ that a shrinking pool of remaining possibilities
          produces.
    tags: []

  - id: quant-probability.discrete.identify-the-law
    kind: technique
    prominence: 1
    title: "Identifying the right discrete law"
    statement: >
      Read the story, not the formula. A fixed number $n$ of independent trials
      with constant $p$, counting successes, is binomial with mean $np$. Waiting
      for the first success is geometric with mean $1/p$; waiting for the $r$-th
      is negative binomial with mean $r/p$. A fixed-size sample drawn from a
      finite pool without replacement is hypergeometric with mean $nK/N$. Counts
      of rare events in a window with no natural $n$ are Poisson with mean and
      variance both $\lambda$. Equally likely labels are discrete uniform. Two
      checks before committing: is the per-trial probability really constant,
      and are the trials really independent? If sampling depletes a pool it is
      hypergeometric, and if the mean and variance disagree badly it is not
      Poisson.
    summary: >
      A decision procedure from the wording of the problem to the named law and
      its mean, with the constant-$p$ and independence checks that catch the
      usual traps.
    parent: quant-probability.discrete
    also_under: []
    requires:
      - quant-probability.discrete.uniform-discrete
      - quant-probability.discrete.negative-binomial
      - quant-probability.discrete.poisson
      - quant-probability.discrete.hypergeometric
      - quant-probability.discrete.binomial-mean-variance
    relates: []
    tags: []
