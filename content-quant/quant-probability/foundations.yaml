# quant-probability.foundations — Probability Foundations
# Outline node (04 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-probability.foundations
    kind: subbranch
    title: "Probability Foundations"
    summary: >
      Sample spaces, the axioms, equally likely outcomes, and
      independence — the ground everything else stands on.
    parent: quant-probability
    also_under: []
    tags: []

  - id: quant-probability.foundations.sample-space
    kind: definition
    prominence: 1
    title: "Sample space, outcomes, events"
    statement: >
      A random experiment is modelled by a sample space $\Omega$, the set of all
      outcomes the experiment can produce, exactly one of which occurs. An event
      is a subset $A \subseteq \Omega$, and $A$ "occurs" when the realised
      outcome lies in $A$. $\Omega$ itself is the certain event and $\emptyset$
      the impossible one. Outcomes must be mutually exclusive and collectively
      exhaustive: two rolls of a die give $\Omega = \{1,\dots,6\}^{2}$ with $36$
      ordered pairs, and "the sum is $7$" is the six-element event
      $\{(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)\}$. Choosing $\Omega$ is the first
      and most consequential move of any interview problem — write it down
      before computing anything.
    summary: >
      The list of everything that can happen, with events as subsets of that
      list; naming $\Omega$ explicitly is what turns a word problem into
      arithmetic.
    parent: quant-probability.foundations
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-probability.foundations.event-algebra
    kind: definition
    prominence: 1
    title: "Set operations on events"
    statement: >
      Logical connectives on events are set operations: "$A$ and $B$" is
      $A \cap B$, "$A$ or $B$" (inclusive) is $A \cup B$, "not $A$" is the
      complement $A^{c} = \Omega \setminus A$, and "$A$ but not $B$" is
      $A \setminus B = A \cap B^{c}$. Events are disjoint (mutually exclusive)
      when $A \cap B = \emptyset$, and $A$ implies $B$ when $A \subseteq B$. De
      Morgan's laws translate between the two workhorse phrasings:
      $(A \cup B)^{c} = A^{c} \cap B^{c}$, so "none of them happen" is the
      complement of "at least one happens", and
      $(A \cap B)^{c} = A^{c} \cup B^{c}$. A partition of $\Omega$ is a family of
      pairwise disjoint events whose union is $\Omega$; every event splits along
      one.
    summary: >
      And, or, not become intersection, union, complement — and De Morgan turns
      "at least one" into "not none", which is where most of the arithmetic
      savings come from.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.sample-space
    relates: []
    tags: []

  - id: quant-probability.foundations.axioms
    kind: axiom
    prominence: 2
    title: "Kolmogorov axioms"
    statement: >
      A probability space is a triple $(\Omega, \mathcal{F}, \Pr)$ in which
      $\mathcal{F}$ is a collection of events closed under complement and
      countable union (a $\sigma$-algebra — all subsets, when $\Omega$ is
      countable), and $\Pr : \mathcal{F} \to \mathbb{R}$ satisfies three
      demands. Nonnegativity: $\Pr(A) \ge 0$ for every event $A$.
      Normalisation: $\Pr(\Omega) = 1$. Countable additivity: for pairwise
      disjoint $A_1, A_2, \dots$,
      $\Pr(A_1 \cup A_2 \cup \cdots) = \sum_{i \ge 1} \Pr(A_i)$. Everything else
      in probability is a consequence of these three lines plus the definition
      of conditioning. Note what is not assumed — no equally likely outcomes, no
      finiteness, and no interpretation of $\Pr$ as a frequency or a belief.
    summary: >
      Probability is any nonnegative, countably additive set function with total
      mass $1$; the three axioms generate every identity you will use.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.event-algebra
    relates: []
    tags: []

  - id: quant-probability.foundations.finite-additivity
    kind: proposition
    prominence: 0
    title: "Finite additivity and the empty event"
    statement: >
      First, $\Pr(\emptyset) = 0$: the sequence $\emptyset, \emptyset, \dots$ is
      pairwise disjoint, so countable additivity forces
      $\Pr(\emptyset) = \sum_{i \ge 1} \Pr(\emptyset)$, which is finite only if
      the term is $0$. Padding a finite list with copies of $\emptyset$ then
      gives finite additivity: for pairwise disjoint $A_1, \dots, A_n$,
      $\Pr(A_1 \cup \cdots \cup A_n) = \Pr(A_1) + \cdots + \Pr(A_n)$. In
      particular the probabilities assigned to the blocks of a finite partition
      of $\Omega$ sum to $1$, which is the standard consistency check on a
      hand-built model. The converse fails: finitely additive set functions that
      are not countably additive exist, which is why the axiom is stated for
      infinite sequences.
    summary: >
      Disjoint pieces add and the impossible event has probability $0$ — the
      two facts every later computation silently uses.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.axioms
    relates: []
    tags: []

  - id: quant-probability.foundations.complement
    kind: corollary
    prominence: 1
    title: "Complement rule, monotonicity, and the difference rule"
    statement: >
      Since $A$ and $A^{c}$ are disjoint with union $\Omega$,
      $\Pr(A^{c}) = 1 - \Pr(A)$. For nested events $A \subseteq B$, split
      $B = A \cup (B \setminus A)$ into disjoint parts to get the difference
      rule $\Pr(B \setminus A) = \Pr(B) - \Pr(A)$ and hence monotonicity,
      $\Pr(A) \le \Pr(B)$. Without nesting the same split gives
      $\Pr(B \setminus A) = \Pr(B) - \Pr(A \cap B)$. Combining monotonicity with
      $\Pr(\Omega) = 1$ pins every probability into $[0,1]$, so an intermediate
      result outside that range is an arithmetic error, and a bound on a larger
      event bounds a smaller one for free.
    summary: >
      The chance of not-$A$ is $1 - \Pr(A)$, bigger events are more likely, and
      subtracting the overlap gives the probability of the part of $B$ outside
      $A$.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.finite-additivity
    relates: []
    tags: []

  - id: quant-probability.foundations.union-two
    kind: proposition
    prominence: 1
    title: "Union of two or three events"
    statement: >
      For any events, $\Pr(A \cup B) = \Pr(A) + \Pr(B) - \Pr(A \cap B)$: write
      $A \cup B = A \cup (B \setminus A)$ as a disjoint union and apply the
      difference rule to the second piece. Adding $\Pr(A)$ and $\Pr(B)$
      double-counts the overlap exactly once, so subtracting it once repairs the
      count. Dropping the overlap gives the two-event union bound
      $\Pr(A \cup B) \le \Pr(A) + \Pr(B)$, with equality precisely when
      $\Pr(A \cap B) = 0$. Three events alternate:
      $\Pr(A \cup B \cup C) = \Pr(A) + \Pr(B) + \Pr(C) - \Pr(A \cap B)
      - \Pr(A \cap C) - \Pr(B \cap C) + \Pr(A \cap B \cap C)$. The pattern
      continues for $n$ events as the general inclusion–exclusion formula of the
      counting toolkit.
    summary: >
      Add the pieces, subtract the pairwise overlaps, add back the triple
      overlap — and if you only need a bound, drop the overlaps entirely.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.complement
    relates: []
    tags: []

  - id: quant-probability.foundations.classical
    kind: definition
    prominence: 2
    title: "Classical (equally likely) probability"
    statement: >
      If $\Omega$ is finite with $N$ outcomes that are equally likely, then each
      outcome carries probability $1/N$ and finite additivity gives, for every
      event $A$, $\Pr(A) = |A| / |\Omega|$ — favourable outcomes over total
      outcomes. This is the only model in which probability reduces entirely to
      counting, and it is the model behind almost every card, dice and urn
      question. Worked: three fair coin tosses give $\Omega$ of size $8$, and
      exactly two heads occurs in $\binom{3}{2} = 3$ of them, so the probability
      is $3/8 = 0.375$. Both counts must be taken over the same $\Omega$;
      mixing an ordered numerator with an unordered denominator is the standard
      way this goes wrong.
    summary: >
      Favourable over total, valid only when the listed outcomes really are
      equally likely — the bridge from probability to combinatorics.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.axioms
    relates: []
    tags: []

  - id: quant-probability.foundations.uniformity-assumption
    kind: intuition
    prominence: 1
    title: "Equally likely is an assumption, not a default"
    statement: >
      "There are two possibilities, so it is $50$–$50$" is the most expensive
      error in the subject. Equal likelihood is a claim about the physical
      mechanism — a symmetric die, a fair shuffle, a uniform draw — and it holds
      only at the level of description where the symmetry actually lives. Label
      outcomes as finely as the mechanism distinguishes them: the two dice are
      distinguishable, so the $36$ ordered pairs are uniform while the $11$
      possible sums are not, $7$ being six times as likely as $2$. Coarsening a
      uniform space almost never leaves it uniform. When a problem says "at
      random" without saying how, the answer is not determined until you fix the
      mechanism and say so out loud.
    summary: >
      Uniformity has to be earned from the mechanism, and it survives only at
      the finest level of labelling — coarse categories are almost never
      equally likely.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.classical
    relates: []
    tags: []

  - id: quant-probability.foundations.dice-sum-seven
    kind: example
    prominence: 0
    title: "Dice sums, and Galileo's 9 versus 10"
    statement: >
      Two fair dice: $\Omega$ has $36$ equally likely ordered pairs, and the six
      pairs summing to $7$ give $\Pr(\text{sum} = 7) = 6/36 = 1/6$, the modal
      sum. Galileo's gamblers asked why $10$ beats $9$ with three dice, given
      that each has six unordered partitions into values $1$–$6$. Counting
      ordered triples out of $216$ resolves it: $9$ is achieved by $25$ triples
      and $10$ by $27$, so $\Pr(9) = 25/216 \approx 0.1157$ against
      $\Pr(10) = 27/216 = 1/8 = 0.125$. The partitions are not equally likely —
      $(3,3,3)$ arises one way while $(1,3,6)$ arises six — so the unordered
      list is the wrong sample space.
    summary: >
      Sum $7$ has probability $1/6$ with two dice; with three, $10$ beats $9$ by
      $27$ to $25$ out of $216$ because partitions are not equally likely.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.classical
    relates: []
    tags: []

  - id: quant-probability.foundations.divisibility-union
    kind: example
    prominence: 0
    title: "Divisible by 2, 3 or 5 — three-event inclusion–exclusion"
    statement: >
      Draw an integer uniformly from $1$ to $100$ and ask for the probability it
      is divisible by $2$, $3$ or $5$. Counts of multiples: $50$, $33$, $20$
      singly; $16$ for $6$, $10$ for $10$, $6$ for $15$; $3$ for $30$. The
      three-event identity gives
      $50 + 33 + 20 - 16 - 10 - 6 + 3 = 74$ favourable integers, so the
      probability is $74/100 = 0.74$. The complement is the cleaner statement:
      $26$ of the first $100$ integers share no factor with $30$, matching the
      product form $100 \cdot (1 - 1/2)(1 - 1/3)(1 - 1/5) = 26.67$ up to
      rounding at the boundary. Naively adding $50 + 33 + 20 = 103$ exceeds
      $100$, which flags the double counting immediately.
    summary: >
      Three overlapping divisibility events resolve to $74/100$, with the
      near-miss product formula as a sanity check on the alternating sum.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.union-two
      - quant-probability.foundations.classical
    relates: []
    tags: []

  - id: quant-probability.foundations.independence-events
    kind: definition
    prominence: 2
    title: "Independence of two events"
    statement: >
      Events $A$ and $B$ are independent when
      $\Pr(A \cap B) = \Pr(A)\Pr(B)$. The definition is symmetric and needs no
      positive-probability hypothesis; when $\Pr(B) > 0$ it says exactly that
      learning $B$ leaves the chance of $A$ unchanged, the conditional form
      developed later. Independence is a property of the probability measure,
      not of the sets: it can be destroyed by changing the weights alone.
      Worked: roll two fair dice, let $A$ be "first die even" and $B$ be "sum is
      $7$"; then $\Pr(A \cap B) = 3/36 = 1/12 = (1/2)(1/6)$, so they are
      independent despite the obvious physical link. Disjoint is the opposite of
      independent — if $A \cap B = \emptyset$ and both have positive
      probability, each rules the other out.
    summary: >
      Probabilities multiply on the intersection; assume it only when the
      mechanism justifies it, and never confuse it with mutual exclusivity.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.axioms
    relates:
      - id: quant-probability.foundations.union-two
        note: >
          Disjointness is the additive structure and independence the
          multiplicative one; the union identity is what shows two events of
          positive probability cannot be both.
    tags: []

  - id: quant-probability.foundations.independence-complements
    kind: lemma
    prominence: 0
    title: "Independence passes to complements"
    statement: >
      If $A$ and $B$ are independent then so are $A$ and $B^{c}$, $A^{c}$ and
      $B$, and $A^{c}$ and $B^{c}$. Proof of the first:
      $\Pr(A \cap B^{c}) = \Pr(A) - \Pr(A \cap B) = \Pr(A) - \Pr(A)\Pr(B)
      = \Pr(A)(1 - \Pr(B)) = \Pr(A)\Pr(B^{c})$, using the difference rule; the
      others follow by relabelling. Two consequences worth carrying: any event
      of probability $0$ or $1$ is independent of everything, and $A$ is
      independent of itself exactly when $\Pr(A) \in \{0, 1\}$, since
      $p = p^{2}$. This lemma is why "none of them occur" factorises whenever
      "all of them occur" does.
    summary: >
      Negating either side preserves independence, which is what licenses
      multiplying failure probabilities together.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.independence-events
    relates: []
    tags: []

  - id: quant-probability.foundations.pairwise-vs-mutual
    kind: proposition
    prominence: 1
    title: "Pairwise independence does not imply mutual independence"
    statement: >
      Events $A_1, \dots, A_n$ are mutually independent when
      $\Pr(\bigcap_{i \in S} A_i) = \prod_{i \in S} \Pr(A_i)$ for every subset
      $S$ with $|S| \ge 2$ — that is $2^{n} - n - 1$ separate equations, not
      just the $\binom{n}{2}$ pairwise ones. Counterexample with $n = 3$: toss
      two fair coins, let $A$ be "first is heads", $B$ be "second is heads", $C$
      be "the two agree". Each has probability $1/2$ and each pair has
      intersection probability $1/4 = (1/2)(1/2)$, so the three are pairwise
      independent. But $A \cap B \cap C$ is just "both heads", with probability
      $1/4 \ne (1/2)^{3} = 1/8$. Knowing any two of the three determines the
      third, so mutual independence fails badly.
    summary: >
      Checking every pair is not enough: two coins and their agreement event are
      pairwise independent yet completely determined by any two of them.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.independence-events
    relates: []
    tags: []

  - id: quant-probability.foundations.at-least-one
    kind: technique
    prominence: 1
    title: 'Complementary counting for "at least one"'
    statement: >
      Whenever the question says "at least one", compute the probability of none
      and subtract, because "none" is an intersection and intersections
      factorise under independence while unions do not. For independent events
      with probabilities $p_1, \dots, p_n$,
      $\Pr(\text{at least one}) = 1 - \prod_{i=1}^{n}(1 - p_i)$, which is
      $1 - (1-p)^{n}$ in the identical case. Worked, de Méré's two bets: at
      least one six in four rolls of one die is
      $1 - (5/6)^{4} = 671/1296 \approx 0.5177$, a favourable bet, while at
      least one double six in $24$ rolls of two dice is
      $1 - (35/36)^{24} \approx 0.4914$, an unfavourable one — the near miss
      that motivated the subject.
    summary: >
      Turn a union into a complemented product: $1 - (1-p)^{n}$, the identity
      behind de Méré's $0.518$ versus $0.491$.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.complement
      - quant-probability.foundations.independence-events
    relates:
      - id: quant-tools.series-calculus.exp-limit
        note: >
          For small $p$ and large $n$ the product $(1-p)^{n}$ is close to
          $e^{-np}$, which turns the exact answer into a one-second mental
          estimate: $e^{-2/3} \approx 0.513$ against the true $0.509$ for de
          Méré's second bet.
    tags: []

  - id: quant-probability.foundations.continuity-limits
    kind: proposition
    prominence: 0
    title: "Countable additivity as a limit of finite ones"
    statement: >
      Countable additivity is equivalent, given finite additivity, to continuity
      along monotone sequences: if $A_1 \subseteq A_2 \subseteq \cdots$ then
      $\Pr(\bigcup_n A_n) = \lim_n \Pr(A_n)$, and if
      $A_1 \supseteq A_2 \supseteq \cdots$ then
      $\Pr(\bigcap_n A_n) = \lim_n \Pr(A_n)$. Proof of the increasing case:
      disjointify with $B_1 = A_1$ and $B_n = A_n \setminus A_{n-1}$, apply the
      axiom, and recognise the partial sums as $\Pr(A_n)$. The working
      consequence is the licence to split an event into infinitely many disjoint
      cases and sum the resulting series: the probability of a countable
      disjoint union is the value of the infinite sum, not merely bounded by it.
    summary: >
      Probabilities of growing events converge to the probability of the limit,
      so an infinite disjoint decomposition may be summed as a series.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.finite-additivity
    relates: []
    tags: []

  - id: quant-probability.foundations.first-head-odd
    kind: example
    prominence: 0
    title: "First head on an odd toss"
    statement: >
      A fair coin is tossed until the first head appears. What is the
      probability that this happens on an odd-numbered toss? The event splits
      into countably many disjoint cases: the first head lands on toss $k$
      exactly when the first $k-1$ tosses are tails and the $k$-th is a head,
      which by independence has probability $2^{-k}$. Summing the odd $k$,
      $\sum_{j \ge 0} 2^{-(2j+1)} = \tfrac{1}{2}\sum_{j \ge 0} 4^{-j}
      = \dfrac{1/2}{1 - 1/4} = \dfrac{2}{3}$. The totals check out: all $k$ sum
      to $1$, so the never-a-head outcome has probability $0$, and the even
      tosses take the remaining $1/3$. A one-line recursion on the first toss
      gives $q = 1/2 + (1/2)(1 - q)$, hence $q = 2/3$ again.
    summary: >
      The answer is $2/3$ — a countable disjoint decomposition summed as a
      geometric series, with a first-step recursion as the cross-check.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.continuity-limits
      - quant-probability.foundations.independence-events
      - quant-tools.series-calculus.geometric-series
    relates: []
    tags: []

  - id: quant-probability.foundations.odds
    kind: definition
    prominence: 1
    title: "Odds and implied probability"
    statement: >
      The odds in favour of an event are the ratio
      $o = \Pr(A) / \Pr(A^{c}) = p/(1-p)$, inverted by $p = o/(1+o)$. Quoted as
      "$a$ to $b$ on" the implied probability is $a/(a+b)$; quoted as "$a$ to
      $b$ against" — the usual bookmaker convention, meaning you win $a$ per $b$
      staked — it is $b/(a+b)$. Decimal odds $d$ are the total return per unit
      staked, so the implied probability is simply $1/d$. Anchors worth knowing
      cold: $p = 1/2$ is evens and $d = 2.0$; $p = 1/4$ is $3$ to $1$ against
      and $d = 4.0$; $p = 0.8$ is $4$ to $1$ on and $d = 1.25$. Odds, not
      probabilities, are the scale on which evidence updates multiplicatively.
    summary: >
      Odds are the ratio of an event's chance to its complement's, and any
      quoted price converts straight into an implied probability by
      $p = 1/d$.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.complement
    relates: []
    tags: []

  - id: quant-probability.foundations.implied-probability-vig
    kind: example
    prominence: 0
    title: "Two-sided prices and the overround"
    statement: >
      A book quotes decimal $1.90$ on each side of a two-way market. The implied
      probabilities are $1/1.90 = 0.5263$ apiece, summing to $1.0526$ rather
      than $1$ — the excess of $5.26\%$ is the overround, the analogue of a
      bid-ask spread. Normalising by that total recovers the fair prices of
      $0.5$ each. With balanced flow the book stakes $2$ and pays out $1.90$
      whichever way it lands, keeping $0.10$, a hold of $0.10/2 = 5\%$ of
      turnover, which also equals $1 - 1/1.0526$. Reading a quoted price as a
      probability without stripping the overround overstates every outcome, and
      a market whose implied probabilities sum below $1$ is an arbitrage.
    summary: >
      Prices of $1.90$ on both sides imply $105.26\%$ of probability; the
      $5\%$ hold is the spread, and a sum below $100\%$ would be free money.
    parent: quant-probability.foundations
    also_under: []
    requires:
      - quant-probability.foundations.odds
    relates: []
    tags: []
