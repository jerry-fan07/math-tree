# quant-games.market-making-game — The Market-Making Game
# Outline node (43 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-games.market-making-game
    kind: subbranch
    title: "The Market-Making Game"
    summary: >
      "Make me a market on X" — fair value first, width from
      uncertainty, updating on trades, adverse selection, and calibrated
      confidence.
    parent: quant-games
    also_under: []
    tags: []

  - id: quant-games.market-making-game.protocol
    kind: definition
    prominence: 2
    title: "The market-making game: rules of play"
    statement: >
      The interviewer names a quantity — "make me a market on the number of gas
      stations in Manhattan" — and you must answer with two prices, a bid $b$ and
      an ask $a$ with $b < a$, good for a stated size and for both sides at once.
      The interviewer then chooses: sell to you at $b$, buy from you at $a$, or
      pass. You are obliged to honour whichever he picks. When the truth $T$ is
      revealed the trade is marked to it — a unit bought at $b$ scores $T - b$, a
      unit sold at $a$ scores $a - T$, a pass scores nothing. He may trade
      repeatedly, and you re-quote between trades. The grading is mostly on
      process: a defensible centre, a width matching your uncertainty, and
      coherent updating. Refusing to quote, or quoting a joke market like
      $0 / 10^{6}$, fails on the spot.
    summary: >
      Quote a two-sided price you must honour, let the interviewer choose the
      side, and get marked against the truth — the standard trading-interview
      exercise.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.ev-games.fair-value
    relates: []
    tags: []

  - id: quant-games.market-making-game.clarify-the-quantity
    kind: technique
    prominence: 0
    title: "Pin down the quantity before quoting"
    statement: >
      Spend the first ten seconds fixing units, scope, timing and definition.
      "The weight of a 747" can mean empty operating weight, about $180$ tonnes,
      or maximum takeoff weight, about $400$ — a factor of two, wider than any
      spread you would quote, so guessing which is meant costs more than the
      whole edge. Ask one or two closed questions ("metric tonnes, at maximum
      takeoff?"), then commit. Two failure modes bracket the right behaviour:
      interrogating the question until no uncertainty is left, which is not the
      game, and quoting first and reinterpreting the question after being traded
      with, which reads as welching. Ambiguity the interviewer refuses to resolve
      is genuine variance and belongs in your width, not in an argument after the
      reveal.
    summary: >
      Units, scope and definition first — unresolved ambiguity is variance, and
      it has to be paid for in the spread rather than argued about afterwards.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.protocol
    relates: []
    tags: []

  - id: quant-games.market-making-game.fair-value-first
    kind: technique
    prominence: 1
    title: "Fair value before spread"
    statement: >
      Never quote before you have a number. Fix the centre by decomposing the
      unknown into factors you can anchor and multiplying them out, or by
      bracketing it between a bound you are confident is too low and one you are
      confident is too high and averaging those in log space. Say the chain out
      loud: the interviewer is buying your reasoning, and an explicit
      decomposition lets you revise one factor when challenged instead of
      abandoning the whole answer. Only once the centre is fixed do you pick a
      spread around it — the two decisions use different information, the centre
      from your estimate and the width from your uncertainty about it. A quote
      produced without a stated fair value is unimprovable, so every subsequent
      question exposes you.
    summary: >
      Estimate the quantity first and quote around that estimate; the centre and
      the width are separate decisions, made from different information.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.protocol
      - quant-mental.fermi.decomposition
    relates: []
    tags: []

  - id: quant-games.market-making-game.width-uncertainty
    kind: technique
    prominence: 1
    title: "Width from uncertainty"
    statement: >
      Your spread is a public statement about your own uncertainty, so read it
      off your interval rather than off your nerve. Working rule: set the
      half-width near one standard deviation of your belief about $T$, which puts
      roughly a $68\%$ chance of the truth landing inside your market. A centre of
      $300$ with $\pm 30\%$ uncertainty is therefore $210 / 390$, not $290 / 310$.
      Wide is not weak — a wide market you can defend and then tighten beats a
      tight one you get run over in — but arbitrary width is: be able to name the
      uncertainty the spread encodes. Tighten only when information actually
      arrives: a resolved ambiguity, a trade, a hint. Tightening on request with
      no new information is selling optionality for nothing, and the interviewer
      will collect.
    summary: >
      Half-spread $\approx$ one standard deviation of your belief — the quote
      should encode how much you actually know, and only shrink when you learn
      something.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.fair-value-first
      - quant-statistics.testing.ci
    relates:
      - id: quant-mental.fermi.log-error
        note: >
          Estimation error on a Fermi quantity is multiplicative, so the honest
          market is wide by a ratio rather than by an absolute amount — a factor
          of two around $300$, not $\pm 10$ tonnes.
    tags: []

  - id: quant-games.market-making-game.quote-hygiene
    kind: technique
    prominence: 0
    title: "Quoting mechanics: never cross yourself"
    statement: >
      Cheap points, lost surprisingly often. Keep $b < a$ — a crossed market
      ($300$ bid at $290$ offered) hands over free money and ends the interview.
      State the quote in the standard order, bid then ask, with the size attached:
      "$270$ at $330$, one". Round to sensible ticks; $273.4$ at $328.9$ signals
      precision you do not have. Answer within a few seconds, because a long
      silence is itself information about your confidence. Once quoted, honour it:
      do not move the price when asked "are you sure?", since a question carries
      no information about $T$ and flinching invites more pressure. If you want to
      trade smaller, say so when you quote, never after you have been hit.
    summary: >
      Bid below ask, size stated up front, sensible ticks, quick delivery, and no
      flinching when pushed — the mechanical half of looking like a trader.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.protocol
    relates: []
    tags: []

  - id: quant-games.market-making-game.mark-to-truth
    kind: proposition
    prominence: 1
    title: "P&L decomposition: half-spread minus selection"
    statement: >
      Let $V$ be your fair value, $s$ your half-spread, so the market is
      $V - s$ / $V + s$, and let $T$ be the truth. Selling one unit at the ask
      scores $V + s - T = s - (T - V)$; buying one at the bid scores
      $T - (V - s) = s + (T - V)$. Every fill is therefore the half-spread you
      captured, minus your mis-estimate signed by the side traded. If the
      counterparty picks his side without reference to $T$ — a coin flip — the two
      signs cancel and your expected score is exactly $s$ per trade, no matter how
      badly $V$ misses. All losses in this game consequently come from one place:
      correlation between the side he chooses and the sign of $T - V$. Half-spread
      minus selection is the entire economics of quoting.
    summary: >
      Each trade pays you the half-spread and charges you your error signed
      against you — so uninformed flow earns $s$ regardless of accuracy, and only
      informed flow loses money.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.protocol
    relates: []
    tags: []

  - id: quant-games.market-making-game.adverse-selection
    kind: definition
    prominence: 2
    title: "Adverse selection"
    statement: >
      A two-sided quote is a pair of options handed to the counterparty for free:
      your bid is a put struck at $b$, your ask a call struck at $a$, both live at
      once and neither paid for. A counterparty who knows more about $T$ than you
      exercises exactly the profitable one — he lifts the ask when $T > a$, hits
      the bid when $T < b$, and passes otherwise — so the trades you get are
      precisely the trades you did not want. The fills are a biased sample:
      $\mathbb{E}[T \mid \text{lifted}] > \mathbb{E}[T]$ and
      $\mathbb{E}[T \mid \text{hit}] < \mathbb{E}[T]$, so being traded with is
      itself evidence that moves fair value away from you. Adverse selection is
      that conditional gap, and the spread is the premium charged in advance to
      cover it: quote too tight against informed flow and a perfectly centred
      market still loses on every fill.
    summary: >
      Your quotes are free options to better-informed traders, who exercise only
      the side that wins — so the spread exists to be paid for the fills you were
      picked off on.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.mark-to-truth
    relates:
      - id: quant-games.auctions.winners-curse
        note: >
          Same conditioning, two settings: winning the auction means everyone
          else valued the object lower, and getting filled means the informed
          side wanted your price — in both, the event of transacting is bad news.
    tags: []

  - id: quant-games.market-making-game.spread-compensation
    kind: proposition
    prominence: 1
    title: "The spread that survives informed flow"
    statement: >
      Model the flow as a mixture: with probability $\alpha$ the counterparty is
      informed and takes on average $\delta$ of value from you, with probability
      $1 - \alpha$ he trades for reasons unrelated to $T$. An uninformed fill
      scores $s$, an informed fill scores $s - \delta$, so expected profit per
      trade is $(1-\alpha)s + \alpha(s - \delta) = s - \alpha\delta$ and breaking
      even needs a half-spread $s \ge \alpha\delta$. With $\alpha = 0.5$ and
      $\delta = 40$ tonnes, no half-spread under $20$ is viable. Two readings:
      your spread is set by the counterparty's information, not by yours; and if
      every trader is informed ($\alpha = 1$) no finite spread works, which is why
      quotes are pulled before a scheduled announcement.
    summary: >
      Break-even half-spread is $\alpha\delta$ — the chance the counterparty is
      informed times what he takes when he is; pure informed flow admits no
      viable quote.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.adverse-selection
    relates: []
    tags: []

  - id: quant-games.market-making-game.update-on-flow
    kind: technique
    prominence: 1
    title: "Updating on flow: a trade is information"
    statement: >
      Treat each trade as an observation and run Bayes on it. The interviewer
      lifted your $330$ offer: that action is likely when $T$ is well above $330$
      and unlikely when it is below, so the posterior for $T$ shifts up and the
      correct response is to move the whole market up, not to repeat the quote and
      hope for a round trip. Size of the move: if he is fully informed the
      posterior mean is $\mathbb{E}[T \mid T > a]$, which for a diffuse belief sits
      materially above $a$ itself; if he may be trading noise or testing your
      nerve, shrink the move toward zero in proportion to the chance he is
      uninformed. Hard rule: never quote an ask below a price at which you were
      just lifted. Repeated lifts compound the evidence and should compound the
      move.
    summary: >
      A lift says the truth is above your ask, a hit says it is below your bid —
      re-centre on the posterior, and never offer again below where you were just
      taken.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.adverse-selection
      - quant-statistics.bayesian.posterior
    relates: []
    tags: []

  - id: quant-games.market-making-game.inventory-risk
    kind: definition
    prominence: 1
    title: "Inventory risk"
    statement: >
      Inventory is your net position $q$ after fills — positive when long,
      negative when short — carried at average traded price $\bar{p}$. Its mark is
      $q(T - \bar{p})$, so exposure is linear in $q$ and in how wrong you can be
      about $T$, while the risk is quadratic: $\operatorname{Var} =
      q^{2}\operatorname{Var}(T)$. Two units of a quantity you know only to within
      a factor of two is a far bigger bet than anything else in the interview, and
      unlike a real market maker you cannot hedge it — the position only resolves
      when the truth is announced. A flat book carries no mark risk at all, so
      every fill is a deliberate decision to take some, and the point of quoting
      is to be paid the spread for taking it.
    summary: >
      The net position left by your fills, marked at $q(T - \bar{p})$ — risk grows
      like $q^{2}$ and, in this game, cannot be hedged away before the reveal.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.mark-to-truth
    relates: []
    tags: []

  - id: quant-games.market-making-game.quote-skewing
    kind: technique
    prominence: 1
    title: "Skewing quotes against inventory"
    statement: >
      Carrying inventory, stop quoting symmetrically around fair value: shift both
      prices in the direction that makes the trade you want cheap and the trade
      you fear expensive. Short two units with posterior centre $390$ and
      half-spread $25$, quote $375 / 425$ rather than the symmetric $365 / 415$ —
      you pay up to buy back, and demand more to get shorter still. Keep the two
      adjustments separate in your head: first re-centre on what the flow taught
      you, then lean the pair by an amount growing with $|q|$ and with your
      remaining uncertainty. Widening one side alone ($365 / 430$) is the same
      instrument in different dress. Skew is not a view — you lean against a
      position while still believing your centre is right.
    summary: >
      Lean both quotes toward the trade that flattens you, by an amount growing
      with position size — a risk adjustment layered on top of, not instead of,
      the informational re-centring.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.inventory-risk
      - quant-games.market-making-game.update-on-flow
    relates: []
    tags: []

  - id: quant-games.market-making-game.size-discipline
    kind: technique
    prominence: 1
    title: "Sizing the quote"
    statement: >
      Quote a size you can afford to be wrong about. Your edge per trade is at
      most the half-spread minus expected adverse selection, and the game repeats,
      so Kelly logic applies directly: stake in proportion to edge over variance,
      then take a fraction of that, because on an unfamiliar quantity your
      estimate of the edge is itself unreliable. In practice, attach the size to
      the quote ("$270$ at $330$, one"), keep total exposure across the session
      small relative to what you can be wrong about, and cut size — rather than
      widening without limit — when the uncertainty is largest. The classic error
      is doubling size after being picked off in order to look confident: that
      raises the stake immediately after evidence the edge was negative.
    summary: >
      Size from edge over variance and then shade it down; widen or shrink size
      when uncertain, and never scale up to save face after a loss.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.mark-to-truth
      - quant-games.kelly.kelly-fraction
    relates: []
    tags: []

  - id: quant-games.market-making-game.calibration
    kind: technique
    prominence: 1
    title: "Calibration: intervals judged by hit rate"
    statement: >
      An interval is honest only if it hits at its advertised rate: across many
      questions, your $90\%$ ranges should contain the truth about $90\%$ of the
      time. This is testable and worth testing — log your intervals and score
      them. Eighteen hits in $20$ is calibrated; $10$ in $20$ means your intervals
      run about half the width they should. The fix is mechanical rather than
      moral: multiply every width by a constant factor until the hit rate lands,
      and recheck. Calibration is a property of a batch, never of a single quote,
      which is exactly why interviewers ask a series of estimation questions and
      watch the pattern. A trader whose stated confidence matches his realized hit
      rate can be sized up; one whose does not cannot be sized at all.
    summary: >
      Score your intervals against the truth over many questions — a $90\%$
      interval must hit $90\%$ of the time, and widths get rescaled until it does.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.width-uncertainty
    relates: []
    tags: []

  - id: quant-games.market-making-game.overconfidence
    kind: intuition
    prominence: 0
    title: "Everyone's intervals are too tight"
    statement: >
      The default human error runs one way. Asked for $90\%$ ranges on
      general-knowledge quantities, people typically contain the truth only $30\%$
      to $50\%$ of the time; the ranges are not slightly optimistic but roughly
      half the width they need to be. The mechanism is anchoring: the first
      estimate that comes to mind fixes the scale, and the adjustment outward from
      it stops far too early. Countermeasures that work: produce the bounds before
      the point estimate, and ask what would have to be true for the answer to be
      ten times larger — if you can tell a story, the bound is too near. In this
      game the symptom is a market that looks impressively tight and gets picked
      off from both sides over the course of a session.
    summary: >
      Stated $90\%$ intervals hit nearer $40\%$ because we anchor and
      under-adjust; the practical correction is to widen deliberately, roughly by
      a factor of two.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.calibration
    relates: []
    tags: []

  - id: quant-games.market-making-game.worked-747
    kind: example
    prominence: 2
    title: "Worked game: a market on the weight of a 747"
    statement: >
      "Make me a market on the weight of a 747." Clarify: maximum takeoff weight
      of a 747-400, in tonnes. Fermi: certainly above $100$, certainly below
      $1000$, so centre at $\sqrt{100 \cdot 1000} \approx 316$, call it $300$.
      Round 1, quote $270 / 330$; he lifts, leaving you short one at $330$. An
      informed lift says $T > 330$, so re-centre near
      $\mathbb{E}[T \mid T > 330] \approx 355$. Round 2, quote $330 / 380$; he
      lifts again, short two at average $355$, and the second lift pushes the
      centre to $390$. Round 3, symmetric would be $365 / 415$, but short two you
      skew up to $375 / 425$. Truth: $397$. Score
      $(330 - 397) + (380 - 397) = -84$. The damage was done in round 1: $\pm 10\%$
      around $300$ claimed a precision a $100$-to-$1000$ bracket never supported,
      and each lift collected on it.
    summary: >
      Three rounds — $270/330$ lifted, $330/380$ lifted, then $375/425$ skewed for
      the short — against a truth of $397$ for a score of $-84$, all traceable to
      an opening market far too tight for the Fermi behind it.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.clarify-the-quantity
      - quant-games.market-making-game.width-uncertainty
      - quant-games.market-making-game.quote-skewing
      - quant-mental.fermi.geometric-mean-bounds
    relates: []
    tags: []

  - id: quant-games.market-making-game.game-vs-real-markets
    kind: intuition
    prominence: 0
    title: "What the game keeps and what it drops"
    statement: >
      The interview game is a compressed quoting business, and it is worth knowing
      which parts survive the compression. Kept: quote around a fair value, take
      width from uncertainty, re-centre on flow, skew on inventory, and earn the
      spread minus what the informed take. Dropped: an exchange market maker
      quotes continuously into a limit order book with queue priority, gets
      thousands of fills a day so that the law of large numbers does the work two
      interview trades cannot, hedges inventory in correlated instruments instead
      of waiting for a truth to be announced, and competes on latency for the
      right to requote first. Those mechanics belong to market microstructure; the
      decision logic is the one rehearsed here, run at size.
    summary: >
      The game preserves the decision logic of quoting and drops the machinery —
      order books, queues, hedging and latency — which is where microstructure
      picks the story up.
    parent: quant-games.market-making-game
    also_under: []
    requires:
      - quant-games.market-making-game.spread-compensation
      - quant-games.market-making-game.inventory-risk
    relates: []
    tags: []
