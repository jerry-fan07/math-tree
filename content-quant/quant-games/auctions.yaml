# quant-games.auctions — Auctions & Winner's Curse
# Outline node (41 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-games.auctions
    kind: subbranch
    title: "Auctions & Winner's Curse"
    summary: >
      Bidding under uncertainty — Vickrey truthfulness, first-price
      shading, and the winner's curse that haunts common-value auctions.
    parent: quant-games
    also_under: []
    tags: []

  - id: quant-games.auctions.setup
    kind: definition
    prominence: 1
    title: "An auction as a game"
    statement: >
      An auction is a game of incomplete information. Each of $n$ bidders holds
      private information about the object, submits a bid, and the rules fix two
      functions: an allocation rule saying who gets the object, and a payment
      rule saying what is paid. If your value is $v$ and you win at price $p$
      your payoff is $v - p$; every loser gets $0$. A bidder who pays exactly
      their own value earns nothing, so all the profit in an auction comes from
      winning below value — and every strategy question reduces to how far below
      to aim. Unless stated otherwise everything here is single-unit, with no
      reserve price, no budget constraints, no collusion and no resale market.
    summary: >
      Bidders hold private information and submit bids; an allocation rule and a
      payment rule turn those bids into a winner and a price, and profit is value
      minus price.
    parent: quant-games.auctions
    also_under: []
    requires: []
    relates: []
    tags: []

  - id: quant-games.auctions.formats
    kind: definition
    prominence: 1
    title: "The four standard formats"
    statement: >
      English (ascending): the price rises, bidders drop out publicly, and the
      last one standing pays roughly the price at which the second-to-last quit.
      Dutch (descending clock): the price falls from a high start and the first
      bidder to accept takes the object at the price they stopped it at.
      First-price sealed-bid: all bids arrive at once, the highest wins and pays
      their own bid. Second-price sealed-bid, or Vickrey: the highest bid wins
      but pays the second-highest bid. The distinction that drives everything is
      the payment rule — in pay-your-bid formats your bid sets your price, while
      in pay-the-runner-up formats your bid only decides whether you win.
    summary: >
      English, Dutch, first-price sealed and second-price sealed, split by
      whether your own bid determines the price you pay or only whether you win.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.setup
    relates: []
    tags: []

  - id: quant-games.auctions.value-models
    kind: definition
    prominence: 1
    title: "Private, common and interdependent values"
    statement: >
      Private values: bidder $i$ knows their own value $v_i$ exactly, and
      learning everything the rivals know would not change it — a concert ticket
      you either want or do not. Independent private values (IPV) adds that the
      $v_i$ are independent draws from one common distribution. Common value:
      the object is worth the same unknown $V$ to everybody — an oil tract, a jar
      of coins, a firm's future cash flows — and each bidder sees only a noisy
      signal of it. Interdependent values sit in between. The choice decides
      everything downstream: under private values winning teaches you nothing you
      did not already know, while under common values winning is itself evidence
      about $V$.
    summary: >
      Whether your value is something you already know or something you are
      estimating along with everyone else is the fork that separates clean
      bidding theory from the winner's curse.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.setup
    relates: []
    tags: []

  - id: quant-games.auctions.strategic-equivalence
    kind: proposition
    prominence: 0
    title: "Which formats are the same game"
    statement: >
      Dutch and first-price sealed-bid are strategically equivalent: in both, a
      bidder chooses one number — the price at which they will claim the object —
      and nothing is revealed before that moment, so the two games have identical
      strategy sets and payoffs. English and second-price are only
      outcome-equivalent, and only under private values: staying in until the
      clock reaches your value is dominant, so bidding stops just above the
      second-highest value and the winner pays about that. The equivalence breaks
      under common values, where seeing who drops out and when is information a
      sealed bid cannot use — which is why ascending auctions raise more revenue
      on common-value objects.
    summary: >
      Dutch equals first-price as a game; English equals second-price only in
      outcome, and only when values are private.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.formats
      - quant-games.auctions.value-models
    relates: []
    tags: []

  - id: quant-games.auctions.vickrey
    kind: theorem
    prominence: 2
    title: "Vickrey: truthful bidding is dominant in a second-price auction"
    statement: >
      In a sealed-bid second-price auction with private values, bidding your true
      value $v$ weakly dominates every other bid, whatever the rivals do. Let $p$
      be the highest rival bid; note first that your own bid never affects the
      price, only whether you win. Underbidding, $b < v$: outcomes differ from
      truth-telling only when $b \le p < v$, and there truth wins at profit
      $v - p \ge 0$ while the shaded bid wins nothing — you forfeit profitable
      trades and never pay a cent less. Overbidding, $b > v$: outcomes differ
      only when $v < p \le b$, and there the inflated bid wins at profit
      $v - p < 0$ while truth correctly walks away. Both deviations are weakly
      worse, so $b = v$ is optimal with no assumption at all about rivals'
      rationality.
    summary: >
      Your bid sets only whether you win, not what you pay, so the profit-maximizing
      threshold is exactly your value — shading forfeits good wins, inflating buys
      bad ones.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.formats
      - quant-games.game-theory.dominance
    relates: []
    tags: []

  - id: quant-games.auctions.uniform-order-stats
    kind: proposition
    prominence: 1
    title: "Order statistics of uniforms: the auction arithmetic"
    statement: >
      Let $U_1,\dots,U_n$ be iid uniform on $[0,1]$. The $k$-th largest has mean
      $(n+1-k)/(n+1)$, so the order statistics cut $[0,1]$ into $n+1$ equal
      expected gaps: the largest averages $n/(n+1)$ and the runner-up
      $(n-1)/(n+1)$. Conditioning is just rescaling — given that all $n$ values
      lie below $v$, they are iid uniform on $[0,v]$, so their maximum averages
      $vn/(n+1)$. On $[-a,a]$ the $k$-th largest of $n$ has mean
      $a(n+1-2k)/(n+1)$; for instance the largest of $20$ errors uniform on
      $[-40,40]$ averages $40 \cdot 19/21 \approx 36.2$ and the runner-up
      $40 \cdot 17/21 \approx 32.4$. Every number in the formulas below comes
      from these three lines.
    summary: >
      The $k$-th largest of $n$ uniforms averages $(n+1-k)/(n+1)$ — the single
      fact that turns auction rules into closed-form bids and revenues.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-probability.random-variables.order-statistics
      - quant-probability.continuous.uniform
    relates: []
    tags: []

  - id: quant-games.auctions.shading
    kind: proposition
    prominence: 1
    title: "First-price shading: bid (n−1)/n of your value"
    statement: >
      Hypotheses: first-price sealed-bid, $n \ge 2$ risk-neutral bidders,
      independent private values drawn iid uniform on $[0,1]$, no reserve, and a
      symmetric increasing equilibrium. Then the Bayes–Nash equilibrium bid is
      $b(v) = \frac{n-1}{n}v$. Derivation: bidding as if your value were $z$ wins
      with probability $z^{n-1}$, so you maximize $(v - b(z))z^{n-1}$; the
      first-order condition at $z = v$ rearranges to
      $\frac{d}{dv}\left[b(v)v^{n-1}\right] = (n-1)v^{n-1}$, which integrates
      with $b(0) = 0$ to the stated formula. The reading matters more than the
      algebra: $(n-1)v/n$ is exactly the expected highest rival value given that
      all rivals are below $v$, so you bid what you expect to have to beat,
      conditional on winning. Two bidders shade to half of value, ten bidders
      to $90\%$.
    summary: >
      Pay-your-bid forces a trade-off between margin and win probability; with
      $n$ iid uniform values the resolution is to bid the fraction $(n-1)/n$ of
      your value.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.formats
      - quant-games.auctions.value-models
      - quant-games.auctions.uniform-order-stats
      - quant-games.game-theory.nash
    relates: []
    tags: []

  - id: quant-games.auctions.revenue-equivalence
    kind: proposition
    prominence: 0
    title: "Revenue equivalence"
    statement: >
      Under symmetric independent private values from a common atomless
      distribution, risk-neutral bidders, and any mechanism whose equilibrium
      awards the object to the highest value while giving the lowest possible
      type zero expected surplus, the seller's expected revenue is the same
      across mechanisms. Check it on uniforms: second-price collects the
      runner-up value, mean $(n-1)/(n+1)$, while first-price collects
      $\frac{n-1}{n}$ of the winning value, mean
      $\frac{n-1}{n} \cdot \frac{n}{n+1} = (n-1)/(n+1)$ — identical. The
      hypotheses are what an interview probes: risk aversion tips revenue toward
      first-price, correlated or common values tip it toward ascending formats,
      so the theorem is a benchmark rather than a law about real auctions.
    summary: >
      Under symmetric IPV and risk neutrality every efficient format raises the
      same expected revenue; the interesting cases are the ones that break a
      hypothesis.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.vickrey
      - quant-games.auctions.shading
    relates: []
    tags: []

  - id: quant-games.auctions.common-value-model
    kind: definition
    prominence: 1
    title: "The common-value signal model"
    statement: >
      The object is worth the same unknown amount $V$ to every bidder, and
      bidder $i$ observes a private signal $X_i$. The standard working model is
      $X_i = V + \varepsilon_i$ with errors iid, mean zero and independent of
      $V$, so each signal is an unbiased estimate:
      $\mathbb{E}[X_i \mid V] = V$. Two conditional expectations must now be kept
      apart. The naive one is $\mathbb{E}[V \mid X_i = x]$, your estimate before
      you think about the auction at all; the relevant one is
      $\mathbb{E}[V \mid X_i = x, \text{you win}]$, which also uses the fact that
      nobody outbid you. The whole subject of common-value bidding is the gap
      between those two numbers.
    summary: >
      Everyone values the object at the same unknown $V$ and sees an unbiased
      noisy signal of it — so the object of interest is $V$ conditioned on your
      signal and on winning.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.value-models
      - quant-probability.conditioning.conditional-expectation
    relates: []
    tags: []

  - id: quant-games.auctions.winners-curse
    kind: proposition
    prominence: 2
    title: "The winner's curse"
    statement: >
      In a common-value auction with iid signals and bids increasing in the
      signal, the winner is whoever holds the highest signal, so winning is the
      event $X_i = \max_j X_j$ — and that is bad news about $V$. Formally
      $\mathbb{E}[V \mid X_i = x, X_i = \max_j X_j] <
      \mathbb{E}[V \mid X_i = x]$ for $n \ge 2$, and the gap widens with both $n$
      and the dispersion of the signals, because $\mathbb{E}[\max_j
      \varepsilon_j] > 0$ grows in both. Consequence: a bidder who bids their
      unconditional estimate wins exactly when that estimate was the most
      inflated, and loses money on average even though every estimate in the room
      is unbiased. This is selection, not bad luck — the same conditioning a
      market maker meets as adverse selection when informed flow lifts an offer.
    summary: >
      Winning means your estimate beat everyone else's, which is evidence it was
      too high; bidding your unconditional estimate loses money on average.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.common-value-model
    relates: []
    tags: []

  - id: quant-games.auctions.bid-as-if-highest
    kind: technique
    prominence: 1
    title: "Bid as if your estimate is the highest"
    statement: >
      Reach for this whenever the value is common and you hold an estimate. Do
      not bid your estimate; bid the value you would assign if you already knew
      your estimate were the highest of the $n$ in the room. Mechanically, with
      $X_i = V + \varepsilon_i$, subtract $\mathbb{E}[\max_j \varepsilon_j]$ from
      your estimate — for errors uniform on $[-a,a]$ that correction is
      $a(n-1)/(n+1)$, climbing toward $a$ as bidders pile in. That subtraction
      brings expected profit conditional on winning to roughly zero; equilibrium
      shades a little further to leave surplus. In a second-price common-value
      auction the sharp rule conditions on barely winning:
      $b(x) = \mathbb{E}[V \mid X_i = x, \max_{j \ne i} X_j = x]$.
    summary: >
      Fold the news contained in winning into the bid before you make it —
      subtract the expected overshoot of the largest of $n$ signals.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.winners-curse
      - quant-games.auctions.uniform-order-stats
    relates:
      - id: quant-statistics.estimation.german-tank
        note: >
          Both corrections repair the predictable bias of a sample maximum: the
          German-tank estimator adds back what the largest serial number misses
          below $N$, while a common-value bid subtracts what the largest signal
          overshoots $V$.
    tags: []

  - id: quant-games.auctions.jar-of-coins
    kind: example
    prominence: 1
    title: "The jar of coins"
    statement: >
      A jar holding exactly $100$ dollars in coins is auctioned to a room of
      $20$ bidders, first-price sealed-bid. Model each guess as
      $X_i = 100 + \varepsilon_i$ with $\varepsilon_i$ uniform on $[-40,40]$, so
      the room is unbiased and the average guess is about $100$. If everyone
      bids their guess, the winner pays $\max_i X_i$, which averages
      $100 + 40 \cdot 19/21 \approx 136$ — the winner is down $36$ dollars while
      the room's consensus is exactly right. A second-price rule barely helps:
      the runner-up guess averages $100 + 40 \cdot 17/21 \approx 132$. Bidding
      $X_i - 36$ instead restores zero expected profit. The interview point is
      that an auction does not poll the room's opinion, it selects the largest
      error in it.
    summary: >
      Twenty unbiased guesses at a $100$-dollar jar produce a winning bid near
      $136$: the auction picks the biggest overestimate, not the average one.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.bid-as-if-highest
    relates: []
    tags: []

  - id: quant-games.auctions.acquire-a-company
    kind: example
    prominence: 1
    title: "Acquiring a company"
    statement: >
      You may bid for a firm whose value $T$ to its current owner is uniform on
      $[0,100]$; the owner knows $T$ and you do not, and under your management
      the firm would be worth $1.5T$. The owner accepts a bid $b$ exactly when
      $T \le b$. Unconditionally $\mathbb{E}[T] = 50$, so the firm looks worth
      $75$ to you and a bid near $60$ feels safe — the standard wrong answer.
      Condition on acceptance: $T$ given $T \le b$ is uniform on $[0,b]$ with
      mean $b/2$, so the firm you actually buy is worth $1.5 \cdot b/2 = 0.75b$
      and your expected profit is $-0.25b$. Every positive bid loses, and the
      correct bid is $0$. Only a multiplier above $2$ makes any positive bid
      worthwhile.
    summary: >
      A trade that happens only when the informed side agrees is worth
      conditioning on: here the answer is to bid nothing at all.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.winners-curse
    relates:
      - id: quant-games.ev-games.fair-value
        note: >
          Fair value prices a game you have already been handed; a bid only buys
          the game when the counterparty agrees, so the price must be the value
          conditional on acceptance rather than the unconditional expectation.
    tags: []

  - id: quant-games.auctions.more-bidders
    kind: intuition
    prominence: 1
    title: "More bidders cuts both ways"
    statement: >
      Competition pushes bids in opposite directions depending on the value
      model. Under independent private values, more rivals leave less room to
      shade: the uniform equilibrium bid $(n-1)v/n$ climbs from $v/2$ at $n = 2$
      to $0.9v$ at $n = 10$, and expected revenue $(n-1)/(n+1)$ climbs with it,
      which is why a seller wants a crowd. Under common values the sign flips —
      beating more signals means the winning signal is a more extreme error, the
      correction $\mathbb{E}[\max_j \varepsilon_j]$ grows in $n$, and the right
      response to a fuller room is to bid lower. The reflex "there is
      competition, so bid up" is exactly backwards on a common-value object.
    summary: >
      With private values a crowd makes you bid closer to value; with common
      values a crowd makes the curse worse, so you must shade further.
    parent: quant-games.auctions
    also_under: []
    requires:
      - quant-games.auctions.shading
      - quant-games.auctions.winners-curse
    relates: []
    tags: []
