# quant-games.game-theory — Game Theory
# Outline node (40 in content-quant/outline.md's authoring order).

nodes:
  - id: quant-games.game-theory
    kind: subbranch
    title: "Game Theory"
    summary: >
      Strategic play — dominance, Nash, mixed strategies via
      indifference, minimax in zero-sum games, and backward induction.
    parent: quant-games
    also_under: []
    tags: []

  - id: quant-games.game-theory.normal-form
    kind: definition
    prominence: 1
    title: "Normal-form game"
    statement: >
      A normal-form (strategic) game is a finite list of players, a finite set of
      pure strategies for each player, and a payoff function assigning every
      player a number at every strategy profile. Payoffs are utilities on a scale
      where averaging is meaningful, which is what lets randomized play be priced
      by expectation. All players choose once, simultaneously and without
      communication, and the game itself is common knowledge. A two-player game
      is a matrix, written here as prose row lists of
      $(\text{row payoff}, \text{column payoff})$ pairs — with rows $U, D$ and
      columns $L, R$: row $U$: $(a_1,a_2)$ against $L$, $(b_1,b_2)$ against $R$;
      row $D$: $(c_1,c_2)$ against $L$, $(d_1,d_2)$ against $R$. Solving the game
      means saying which profile rational players land on.
    summary: >
      Players, strategy sets and a payoff matrix — the simultaneous-move object
      every solution concept in this subbranch operates on.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.ev-games.fair-value
    relates: []
    tags: []

  - id: quant-games.game-theory.dominance
    kind: definition
    prominence: 1
    title: "Dominance and iterated elimination"
    statement: >
      Strategy $s$ strictly dominates $t$ for a player if $s$ pays strictly more
      than $t$ against every profile of opponent strategies; it weakly dominates
      $t$ if it pays at least as much against everything and strictly more
      against something. A rational player never uses a strictly dominated
      strategy, so those rows and columns can be deleted and the reasoning
      repeated — iterated elimination of strictly dominated strategies. Deleting
      strictly dominated strategies is order-independent and never removes a Nash
      equilibrium; weak elimination is order-dependent and can destroy
      equilibria, so say so when you use it. A strategy dominating all your
      others is dominant, and playing it requires no prediction of the opponent
      at all — the mechanism behind truthful bidding in second-price auctions,
      worked in the auctions subbranch.
    summary: >
      One strategy beats another against everything the opponent can do; delete
      the dominated ones and repeat, and easy games solve themselves.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.normal-form
    relates: []
    tags: []

  - id: quant-games.game-theory.prisoners-dilemma
    kind: example
    prominence: 1
    title: "Prisoners' dilemma"
    statement: >
      Two players independently choose Cooperate or Defect. Payoffs
      $(\text{row}, \text{column})$ — row $C$: $(3,3)$ against $C$, $(0,5)$
      against $D$; row $D$: $(5,0)$ against $C$, $(1,1)$ against $D$. Defect
      strictly dominates for both players: against $C$ it pays $5$ versus $3$,
      against $D$ it pays $1$ versus $0$, so the comparison never depends on the
      opponent's choice. Both defect, both collect $1$, while mutual cooperation
      would have paid $3$ each — the unique equilibrium is Pareto-dominated by an
      outcome neither player can reach alone. The signature is the payoff
      ordering $T > R > P > S$, here $5 > 3 > 1 > 0$: whenever defecting is
      privately optimal and jointly destructive, this is the game you are in.
    summary: >
      A concrete $2 \times 2$ where defection strictly dominates, so rational
      play lands both players on $(1,1)$ instead of $(3,3)$.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.dominance
    relates: []
    tags: []

  - id: quant-games.game-theory.nash
    kind: definition
    prominence: 2
    title: "Nash equilibrium"
    statement: >
      A player's strategy is a best response to the others if no alternative
      strategy of theirs pays more while the opponents' strategies are held
      fixed. A strategy profile is a Nash equilibrium when every player's
      strategy is a best response to the rest — no player gains by deviating
      alone — equivalently a fixed point of the joint best-response map. Two
      readings serve in interviews: it is the only prediction that stays valid
      after being announced, and it is the play you could publish without regret.
      A profile of dominant strategies is automatically an equilibrium, and
      iterated elimination of strictly dominated strategies never deletes one.
      Equilibrium promises nothing about efficiency, as the prisoners' dilemma
      shows, and nothing about uniqueness.
    summary: >
      A profile where nobody can improve by changing their own strategy alone —
      the self-consistent prediction, efficient or not.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.dominance
    relates: []
    tags: []

  - id: quant-games.game-theory.mixed-strategy
    kind: definition
    prominence: 1
    title: "Mixed strategies"
    statement: >
      A mixed strategy is a probability distribution over a player's pure
      strategies, realized by a private randomization the opponent cannot
      observe. Payoffs against mixes are expectations: if the row player uses
      probabilities $p_i$, the column player uses $q_j$, and row payoffs are
      $a_{ij}$, the row player's expected payoff is $\sum_{i,j} p_i a_{ij} q_j$,
      which is linear in each player's own probabilities. Linearity has a
      consequence used constantly: the best mixed reply is worth exactly as much
      as the best pure reply, so a mix is optimal precisely when every pure
      strategy it gives positive weight is itself a best reply. The set of
      strategies receiving positive probability is the support.
    summary: >
      Randomize over your pure strategies; payoffs become expectations that are
      linear in your probabilities, so only best replies belong in the support.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.normal-form
    relates: []
    tags: []

  - id: quant-games.game-theory.nash-existence
    kind: theorem
    prominence: 1
    title: "Existence of equilibrium"
    statement: >
      Nash's theorem: every game with finitely many players, each having finitely
      many pure strategies, has at least one Nash equilibrium in mixed
      strategies. The proof applies the Kakutani fixed-point theorem to the
      best-response correspondence on the product of the players' probability
      simplices — a compact convex set mapped to nonempty convex sets by an
      upper-hemicontinuous correspondence — and yields no construction, so
      finding the equilibrium is a separate job. Pure equilibria really can fail
      to exist, as matching pennies shows, which is why mixing is part of the
      definition rather than a refinement. Existence buys nothing further:
      equilibria need not be unique, and need not be efficient.
    summary: >
      Every finite game has a mixed equilibrium by a fixed-point argument — an
      existence guarantee only, with no uniqueness and no efficiency attached.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.nash
      - quant-games.game-theory.mixed-strategy
    relates: []
    tags: []

  - id: quant-games.game-theory.mixed-indifference
    kind: technique
    prominence: 2
    title: "Indifference principle for mixed equilibria"
    statement: >
      Reach for this whenever a finite game has no pure equilibrium, or the
      question is how often to bluff. The principle: in equilibrium every pure
      strategy inside a player's support earns exactly the same expected payoff
      against the opponent's mix, and no strategy outside the support earns more.
      So the equations pinning down your own randomization are written from your
      opponent's payoffs, not your own — you mix precisely to leave them
      indifferent. Steps: (1) guess a support, usually everything; (2) write one
      indifference equation per opponent strategy in their support; (3) solve for
      your probabilities; (4) check each lies in $[0,1]$ and that no excluded
      strategy beats the common value. A negative probability means the support
      guess was wrong: drop that strategy and re-solve.
    summary: >
      Choose your probabilities to make the opponent indifferent across their
      support — your mix is dictated by their payoff numbers, not yours.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.nash
      - quant-games.game-theory.mixed-strategy
    relates: []
    tags: []

  - id: quant-games.game-theory.matching-pennies
    kind: example
    prominence: 1
    title: "Matching pennies and rock–paper–scissors"
    statement: >
      Both players show a coin; the row player wins $1$ when the faces match and
      loses $1$ when they differ, the column player taking the opposite. Row $H$:
      $+1$ against $H$, $-1$ against $T$; row $T$: $-1$ against $H$, $+1$ against
      $T$. No pure profile is stable — whoever is losing wants to switch. Let the
      row player show $H$ with probability $p$. The column player then earns
      $1 - 2p$ from $H$ and $2p - 1$ from $T$, so indifference forces $p = 1/2$,
      and the mirrored computation gives $q = 1/2$ with value $0$.
      Rock–paper–scissors works the same way: uniform $1/3$ on each throw is the
      unique equilibrium, again with value $0$. Equilibrium mixes are
      unexploitable, not exploiting — against someone who throws rock $40\%$ of
      the time, always playing paper beats the equilibrium mix.
    summary: >
      The canonical no-pure-equilibrium games: mix $1/2$–$1/2$ on pennies and
      $1/3$ each on RPS, both worth $0$, both merely unexploitable.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.mixed-indifference
    relates:
      - id: quant-probability.expectation.symmetry-expectation
        note: >
          Symmetry answers before any algebra here too: a game unchanged by
          relabelling the strategies must be solved by the uniform mix, which is
          how $1/2$ and $1/3$ can be written down on sight.
    tags: []

  - id: quant-games.game-theory.battle-of-sexes
    kind: example
    prominence: 1
    title: "An asymmetric 2×2: battle of the sexes"
    statement: >
      Two people must pick a venue without communicating. Payoffs
      $(\text{Alice}, \text{Bob})$ — row Ballet: $(2,1)$ against Ballet, $(0,0)$
      against Football; row Football: $(0,0)$ against Ballet, $(1,2)$ against
      Football. There are two pure equilibria, each player preferring a different
      one, plus a mixed equilibrium. Let Alice play Ballet with probability $p$:
      Bob earns $p$ from Ballet and $2(1-p)$ from Football, so $p = 2/3$. Let Bob
      play Ballet with probability $q$: Alice earns $2q$ from Ballet and $1-q$
      from Football, so $q = 1/3$. The mixes are unequal, and each is fixed
      entirely by the other player's numbers. They miscoordinate with probability
      $(2/3)(2/3) + (1/3)(1/3) = 5/9$, so each earns only $2/3$ — worse than
      either pure equilibrium.
    summary: >
      Worked asymmetric mixing: Alice plays Ballet $2/3$, Bob plays Ballet
      $1/3$, and the resulting $2/3$ apiece is worse than agreeing on either
      venue.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.mixed-indifference
    relates: []
    tags: []

  - id: quant-games.game-theory.zero-sum
    kind: definition
    prominence: 1
    title: "Zero-sum games and security levels"
    statement: >
      A two-player game is zero-sum when the two payoffs in every cell sum to
      $0$; constant-sum games are the same thing after subtracting a constant. A
      single matrix $A$ of row payoffs then describes everything, with the row
      player maximizing and the column player minimizing, and there is nothing to
      coordinate over. Security levels: choosing a row before the column is
      revealed guarantees the row player $\max_i \min_j a_{ij}$, and the column
      player symmetrically guarantees $\min_j \max_i a_{ij}$; the first is always
      $\le$ the second, since committing first cannot help. When they agree the
      common cell is a saddle point and a pure equilibrium. With rows $R_1$:
      $(3,4)$ and $R_2$: $(2,6)$, the row minima are $3, 2$ and the column maxima
      are $3, 6$, both equal to $3$ at $(R_1, C_1)$. Look for a saddle before
      mixing.
    summary: >
      Strictly opposed interests in one matrix: maximin never exceeds minimax,
      and when they coincide the game has a pure saddle point.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.normal-form
    relates: []
    tags: []

  - id: quant-games.game-theory.minimax
    kind: theorem
    prominence: 2
    title: "Von Neumann's minimax theorem"
    statement: >
      In a finite two-player zero-sum game with row-payoff matrix $A$, allowing
      mixed strategies closes the security gap:
      $\max_p \min_q \sum_{i,j} p_i a_{ij} q_j
      = \min_q \max_p \sum_{i,j} p_i a_{ij} q_j = v$, the maxima and minima
      running over probability vectors. The common number $v$ is the value of the
      game — the expected payoff the row player can guarantee against any play,
      and the most the column player can be forced to concede. Optimal maximin
      mixed strategies exist on both sides, the Nash equilibria are exactly the
      pairs of optimal strategies, every one pays $v$, and they are
      interchangeable, so there is no equilibrium-selection problem. Equivalently
      the two sides solve dual linear programs. Matching pennies has $v = 0$.
    summary: >
      Every finite zero-sum game has a value that both players can guarantee by
      mixing, and its equilibria are interchangeable — the game is fully solved.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.zero-sum
      - quant-games.game-theory.mixed-strategy
      - quant-games.game-theory.nash
    relates: []
    tags: []

  - id: quant-games.game-theory.extensive-form
    kind: definition
    prominence: 1
    title: "Sequential games in extensive form"
    statement: >
      A sequential game is a tree: each node is a decision point labelled with
      the player to move, each edge is an action, and each leaf carries a payoff
      vector. Information sets group nodes the mover cannot distinguish; the game
      has perfect information when every information set is a single node, and a
      simultaneous move is encoded by an information set containing several
      nodes. A strategy is a complete contingent plan — one action at every
      decision node of yours, including nodes your own earlier choices rule out —
      so strategy counts grow fast, two binary decisions already giving four
      strategies. Mapping every strategy profile to its leaf payoffs recovers a
      normal-form game, so dominance, Nash and mixing all still apply.
    summary: >
      The game tree with information sets, where a strategy is a full contingent
      plan; collapsing it to profiles and payoffs gives back a payoff matrix.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.normal-form
    relates: []
    tags: []

  - id: quant-games.game-theory.backward-induction-games
    kind: technique
    prominence: 1
    title: "Backward induction in sequential games"
    statement: >
      Use this on any finite sequential game of perfect information. Start at the
      decision nodes all of whose children are leaves, replace each such node by
      the payoff vector of the action its mover prefers, and fold the tree upward
      one layer at a time; the retained actions form a subgame-perfect
      equilibrium, which exists in pure strategies for every such game (Zermelo)
      and is unique when no player is ever indifferent. Worked: a pot of $10$
      chips, the proposer offers the responder a whole number of chips, the
      responder accepts or rejects, and rejection pays both $0$. The responder
      accepts any offer of $1$ or more, so the proposer offers $1$ and keeps $9$.
      Impartial take-away games, whose positions are labelled winning or losing
      instead of folded by payoffs, belong to the combinatorial-games subbranch.
    summary: >
      Solve the last move first and fold the tree upward — the multi-agent
      version of backward induction, delivering a subgame-perfect equilibrium.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.extensive-form
    relates:
      - id: quant-processes.stopping.backward-induction
        note: >
          The identical fold-from-the-end recursion, with an optimizing opponent
          in place of an expectation over nature: one agent against randomness
          there, two agents against each other here.
    tags: []

  - id: quant-games.game-theory.credible-threats
    kind: proposition
    prominence: 1
    title: "Credible threats and subgame perfection"
    statement: >
      Nash equilibrium is too permissive in sequential games because it tolerates
      plans that would never actually be executed. Entry deterrence: an entrant
      chooses In or Out, and after In an incumbent chooses Fight or Accommodate.
      Payoffs $(\text{entrant}, \text{incumbent})$ — Out: $(0,10)$; In then
      Fight: $(-2,2)$; In then Accommodate: $(3,5)$. The profile (Out, Fight) is
      a Nash equilibrium of the normal form: against Fight, staying out is
      optimal, and against Out the threat is never tested. It is not subgame
      perfect, because once In has happened Accommodate pays $5$ against $2$, so
      backward induction selects (In, Accommodate) with payoffs $(3,5)$. Threats
      become credible only by changing your own payoffs in advance — contracts,
      capacity built before demand, or a reputation you would pay to protect.
    summary: >
      Equilibria can rest on threats nobody would carry out; subgame perfection
      deletes them, and only real commitment makes a threat believable.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.backward-induction-games
      - quant-games.game-theory.nash
    relates: []
    tags: []

  - id: quant-games.game-theory.first-mover
    kind: intuition
    prominence: 1
    title: "First-mover versus second-mover advantage"
    statement: >
      Whether moving first helps is not a fact about the tree but about which
      matters more, commitment or concealment. Commitment favours the first
      mover: a quantity leader who visibly builds capacity forces the follower to
      best-respond to it and earns more than in the simultaneous game, precisely
      because the follower now believes the number. Concealment favours the
      second mover: a row player made to reveal the coin first in matching
      pennies falls from a value of $0$ to $-1$, losing every round, and the same
      holds in any game whose equilibria are all mixed. Ask the two questions in
      order — can I commit in a way the opponent must believe, and does my move
      leak information worth more than that commitment?
    summary: >
      Move first when you can commit and be believed; move second when your
      action would leak information — mixed-equilibrium games always punish
      showing your hand.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.backward-induction-games
      - quant-games.game-theory.matching-pennies
    relates: []
    tags: []

  - id: quant-games.game-theory.two-thirds
    kind: example
    prominence: 1
    title: "Guess two-thirds of the average"
    statement: >
      Every player names a number in $[0,100]$ and whoever is closest to $2/3$ of
      the average wins. The average can never exceed $100$, so the target can
      never exceed $66.7$ and every guess above $66.7$ is weakly dominated.
      Delete those and the average is at most $66.7$, putting the target at most
      $44.4$, so guesses above $44.4$ go next; each round multiplies the
      surviving ceiling by $2/3$, and the cascade converges to $0$, which is the
      unique Nash equilibrium. Real rooms never get there. Level-$0$ play is
      uniform and averages $50$, level $1$ answers $33$, level $2$ answers $22$ —
      and observed averages in newspaper and classroom runs sit near $22$, with
      winning guesses in the teens. Naming $0$ against humans loses.
    summary: >
      Iterated elimination drives the game to $0$, but real populations average
      about $22$ — so the equilibrium answer is the losing answer.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.nash
    relates: []
    tags: []

  - id: quant-games.game-theory.levels-of-reasoning
    kind: intuition
    prominence: 1
    title: "Levels of reasoning"
    statement: >
      The cognitive-hierarchy model reads a population as a mixture of reasoning
      depths: level $0$ plays without modelling anyone, level $k$ best-responds
      to the belief that everyone else sits at level $k-1$, and equilibrium is
      the limit nobody actually reaches. Estimated depths in experiments centre
      between $1$ and $2$, which is exactly why the two-thirds average lands near
      $22$ rather than $0$. The operating rule is to play one step above where
      the flow actually is, not one step above where theory says it should be —
      too shallow and you are the sucker, too deep and you are beating opponents
      who do not exist. The equilibrium is still worth computing: it is the top
      of the ladder, and where a sophisticated counterparty ends up.
    summary: >
      Model the depth of the players you actually face, not the infinite
      regress — one step ahead of the crowd beats the fixed point.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.two-thirds
    relates: []
    tags: []

  - id: quant-games.game-theory.repeated-cooperation
    kind: proposition
    prominence: 0
    title: "Cooperation in repeated games"
    statement: >
      Repeat the prisoners' dilemma a known finite number of times and backward
      induction kills cooperation: the final round is a one-shot dilemma so both
      defect, which makes the second-to-last round's payoff independent of
      behaviour there, and the unravelling runs back to the first round. With an
      infinite horizon, or an end date nobody knows, cooperation can be an
      equilibrium. Under grim trigger — cooperate until any defection, then
      defect forever — with per-period discount factor $\delta$, cooperating pays
      $3/(1-\delta)$ while defecting pays $5 + \delta/(1-\delta)$, so cooperation
      survives exactly when $\delta \ge (5-3)/(5-1) = 1/2$. Patience rather than
      goodwill sustains it, and the folk theorem says most individually rational
      payoff pairs can be supported this way.
    summary: >
      A known last round unravels cooperation completely, while an open-ended
      horizon sustains it whenever the discount factor clears $1/2$.
    parent: quant-games.game-theory
    also_under: []
    requires:
      - quant-games.game-theory.prisoners-dilemma
      - quant-games.game-theory.backward-induction-games
    relates: []
    tags: []
