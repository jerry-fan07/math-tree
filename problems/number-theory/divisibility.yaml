# Problems targeting number-theory.divisibility — divisibility and primes.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's
# ending with something the lesson has just handed over, and a `standard` or
# `routine` one so the unit test has something fair to ask. Every `work` and
# `decide` problem is machine-checked; `justify` is reserved for the real
# proofs — Euclid's lemma out of Bézout, uniqueness in the fundamental
# theorem, the infinitude of the primes — where the rubric is the whole
# instrument. No problem here reuses a lesson's worked example or a card's
# instance. See ../README.md.

problems:
  # --- divisibility, and the facts every later argument runs on ----------------

  - id: divisibility-def-divisibility-01
    kind: work
    difficulty: demanding
    statement: >
      How many integers $b$ with $|b| \le 30$ satisfy $7 \mid b$?
    answer: >
      $9$. The definition asks for an integer $c$ with $b = 7c$, so the $b$ in
      question are exactly the numbers $7c$, and $|7c| \le 30$ forces
      $|c| \le 4$, since $7 \cdot 5 = 35$ already overshoots. That leaves
      $c \in \{-4, -3, -2, -1, 0, 1, 2, 3, 4\}$, nine values, giving the nine
      multiples $-28, -21, -14, -7, 0, 7, 14, 21, 28$. Two habits cost the
      answer here. Forgetting $b = 0$ drops one, because $0 = 7 \cdot 0$ makes
      $7 \mid 0$ true with witness $c = 0$; and counting only positive $b$
      leaves four, since the witness $c$ is allowed to be negative exactly as
      freely as it is allowed to be positive. Nothing was divided anywhere in
      the count — the multiples were generated, which is what the definition
      asks for.
    expects: "9"
    rubric:
      - >
        Reads $7 \mid b$ as the existence of an integer witness $c$ with
        $b = 7c$, and so generates multiples rather than testing divisions.
      - >
        Counts $b = 0$, whose witness is $c = 0$, and both signs — the answer
        is $9$, not $8$ and not $4$.
    targets:
      - number-theory.divisibility.def-divisibility
    exercises: []
    connects: []
    tags: []

  - id: divisibility-def-divisibility-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of these four statements is false. Which one?
    answer: >
      $9 \mid 3$ is the false one. A witness would be an integer $c$ with
      $3 = 9c$, and the multiples of $9$ step from $0$ straight to $9$, missing
      $3$ entirely; the only $c$ that would work is $1/3$, which is not an
      integer. The other three all produce witnesses. For $-6 \mid 42$ take
      $c = -7$, since $(-6)(-7) = 42$. For $13 \mid 13$ take $c = 1$. For
      $5 \mid -5$ take $c = -1$. The instructive one is $9 \mid 3$: reading the
      bar backwards is the single most common slip with this notation, because
      $9$ and $3$ do stand in a divisibility relation — just the other way
      round, $3 \mid 9$.
    choices:
      - text: >
          $-6 \mid 42$
        feedback: >
          True. The witness is $c = -7$: $(-6) \cdot (-7) = 42$. Signs are
          invisible to divisibility, so a negative divisor is no obstacle.
      - text: >
          $13 \mid 13$
        feedback: >
          True, with witness $c = 1$. Every integer divides itself, which is
          the reflexivity of the relation.
      - text: >
          $9 \mid 3$
        correct: true
        feedback: >
          False. No integer $c$ satisfies $3 = 9c$. What is true is
          $3 \mid 9$ — the bar points from the smaller factor to its multiple,
          and reversing it is the standard error.
      - text: >
          $5 \mid -5$
        feedback: >
          True, with witness $c = -1$. A negative multiple is still a
          multiple, since the definition asks only for an integer $c$.
    rubric:
      - >
        Tests each statement by trying to produce the witness $c$, rather than
        by inspecting which number looks larger.
      - >
        Identifies $9 \mid 3$ as the failure and states the true relation
        $3 \mid 9$ that it inverts.
    targets:
      - number-theory.divisibility.def-divisibility
    exercises: []
    connects: []
    tags: []

  - id: divisibility-divisibility-properties-01
    kind: work
    difficulty: demanding
    statement: >
      A positive integer $d$ divides both $4n + 7$ and $6n + 5$ for some
      integer $n$. What is the largest value $d$ can take?
    answer: >
      $11$. Linearity says $d$ divides every integer combination of the two
      numbers, so choose the combination that eliminates $n$:
      $3(4n + 7) - 2(6n + 5) = 12n + 21 - 12n - 10 = 11$. Hence $d \mid 11$,
      and since the positive divisors of $11$ are $1$ and $11$, the only
      candidates are those two. The larger one is attained: at $n = 1$ the two
      numbers are $4 + 7 = 11$ and $6 + 5 = 11$, and $11$ divides both. So the
      answer is $11$. The argument has two halves and needs both — linearity
      supplies a ceiling, and an explicit $n$ shows the ceiling is reached
      rather than merely not ruled out. Note also that $d$ need not divide $n$
      or anything else in sight; all that is being used is that a common
      divisor survives integer combinations.
    expects: "11"
    rubric:
      - >
        Eliminates $n$ with the combination $3(4n + 7) - 2(6n + 5)$ and cites
        linearity for why every common divisor divides the result.
      - >
        Exhibits an $n$ — for instance $n = 1$ — at which the value $11$ is
        actually achieved, so the bound is shown to be attained and not merely
        an upper bound.
    targets:
      - number-theory.divisibility.divisibility-properties
    exercises: []
    connects: []
    tags: []

  - id: divisibility-divisibility-properties-02
    kind: decide
    difficulty: standard
    statement: >
      Three of these follow from the basic properties of divisibility as
      stated. Which one does not?
    answer: >
      The size bound written without its hypothesis — "if $a \mid b$ then
      $|a| \le |b|$" — does not follow. The property requires $b \ne 0$, and
      the reason is visible in its proof: from $b = ac$ with $c \ne 0$ we get
      $|b| = |a||c| \ge |a|$, and $c \ne 0$ is exactly what fails when
      $b = 0$. The standing counterexample is $7 \mid 0$, where $|7| > |0|$;
      indeed every integer divides $0$, so no size bound of any kind is
      available there. The other three are stated properties. Linearity gives
      $d \mid 5a - 8b$ from $d \mid a$ and $d \mid b$, taking $x = 5$,
      $y = -8$. Transitivity gives $a \mid c$ from $a \mid b$ and $b \mid c$,
      the witnesses multiplying. Cancellation gives $a \mid b$ from
      $ac \mid bc$ whenever $c \ne 0$.
    choices:
      - text: >
          If $a \mid b$ then $|a| \le |b|$.
        correct: true
        feedback: >
          This is the size bound with its hypothesis $b \ne 0$ dropped, and it
          is false as stated: $7 \mid 0$ while $|7| > |0|$. Every integer
          divides $0$, so $0$ admits divisors of every size.
      - text: >
          If $d \mid a$ and $d \mid b$ then $d \mid 5a - 8b$.
        feedback: >
          This does follow — it is linearity with $x = 5$ and $y = -8$, and
          $a = ds$, $b = dt$ give $5a - 8b = d(5s - 8t)$.
      - text: >
          If $a \mid b$ and $b \mid c$ then $a \mid c$.
        feedback: >
          This does follow: transitivity, with the witnesses multiplying —
          $b = as$ and $c = bt$ give $c = a(st)$.
      - text: >
          If $ac \mid bc$ and $c \ne 0$ then $a \mid b$.
        feedback: >
          This does follow — it is the cancellation property, and the
          hypothesis $c \ne 0$ is stated there precisely because $c = 0$ makes
          $ac \mid bc$ vacuously true.
    rubric:
      - >
        Recognises that the size bound is the only one of the four missing a
        hypothesis, and names the hypothesis: $b \ne 0$.
      - >
        Supplies a counterexample of the form $a \mid 0$ rather than arguing
        from intuition about size.
    targets:
      - number-theory.divisibility.divisibility-properties
    exercises: []
    connects: []
    tags: []

  # --- division with remainder -------------------------------------------------

  - id: divisibility-division-algorithm-01
    kind: work
    difficulty: demanding
    statement: >
      Apply the division algorithm to $a = 269$ and $b = -8$: there are unique
      integers $q$ and $r$ with $269 = -8q + r$ and $0 \le r < 8$. What is
      $q$?
    answer: >
      $q = -33$. The bound is $0 \le r < |b| = 8$, so the task is to find the
      multiple of $-8$ that lands at or just below $269$. The nearby multiples
      are $-8 \cdot (-33) = 264$ and $-8 \cdot (-34) = 272$; the first does
      not exceed $269$ and the second does, so $q = -33$ and
      $r = 269 - 264 = 5$, giving $269 = -8 \cdot (-33) + 5$ with
      $0 \le 5 < 8$. The tempting answer $q = -34$ comes from rounding the
      real quotient $269 / (-8) \approx -33.6$ away from zero; it produces
      $269 = -8 \cdot (-34) - 3$, and a remainder of $-3$ violates $r \ge 0$.
      Uniqueness is what makes the question have one answer at all: many
      equations $269 = -8q + r$ are true, and exactly one of them meets the
      constraint on $r$.
    expects: "-33"
    rubric:
      - >
        Uses the bound $0 \le r < |b| = 8$, not $0 \le r < b$, which is
        vacuous for a negative divisor.
      - >
        Chooses $q$ so that $-8q$ does not exceed $269$, landing on $q = -33$
        and $r = 5$ rather than the truncated $q = -34$, which forces a
        negative remainder.
    targets:
      - number-theory.divisibility.division-algorithm
    exercises: []
    connects: []
    tags: []

  - id: divisibility-division-algorithm-02
    kind: work
    difficulty: standard
    statement: >
      The division algorithm applied to some integer $a$ and $b = 12$ returns
      quotient $q = -6$ and remainder $r = 7$. What is $a$?
    answer: >
      $-65$. The theorem's equation is $a = bq + r$, so
      $a = 12 \cdot (-6) + 7 = -72 + 7 = -65$, and the returned pair is a
      legitimate output because $0 \le 7 < 12$. Check it in the forward
      direction: dividing $-65$ by $12$, the multiples of $12$ on either side
      are $12 \cdot (-6) = -72$ and $12 \cdot (-5) = -60$, and the largest not
      exceeding $-65$ is $-72$, so the quotient is $-6$ and the remainder is
      $-65 - (-72) = 7$, as claimed. Uniqueness is what makes the question
      well posed: no second integer produces this pair, because $a$ is
      determined outright by $bq + r$.
    expects: "-65"
    rubric:
      - >
        Substitutes into $a = bq + r$ rather than trying to reconstruct $a$
        from a division.
      - >
        Checks $0 \le 7 < 12$, so that the given pair really is an output of
        the algorithm and the reconstruction is legitimate.
    targets:
      - number-theory.divisibility.division-algorithm
    exercises: []
    connects: []
    tags: []

  - id: divisibility-division-algorithm-03
    kind: justify
    difficulty: demanding
    statement: >
      Prove that for every integer $a$ there are unique integers $q$ and $r$
      with $a = 5q + r$ and $-2 \le r \le 2$. (These are the balanced
      remainders modulo $5$.) Say what would go wrong if the range for $r$
      were widened or narrowed by one.
    answer: >
      Existence. Apply the ordinary division algorithm with $b = 5$ to get
      $a = 5q_0 + r_0$ with $0 \le r_0 \le 4$. If $r_0 \le 2$, take
      $(q, r) = (q_0, r_0)$ and there is nothing to do. If $r_0$ is $3$ or
      $4$, subtract $5$ from the remainder and add $1$ to the quotient:
      $a = 5(q_0 + 1) + (r_0 - 5)$, where $r_0 - 5$ is $-2$ or $-1$. Either
      way $-2 \le r \le 2$. Uniqueness. Suppose $5q_1 + r_1 = 5q_2 + r_2$ with
      both remainders in $[-2, 2]$. Then $5(q_1 - q_2) = r_2 - r_1$, and
      $|r_2 - r_1| \le 2 - (-2) = 4 < 5$. The left side is a multiple of $5$;
      a multiple of $5$ of absolute value below $5$ is $0$; so $r_1 = r_2$,
      and then $5(q_1 - q_2) = 0$ gives $q_1 = q_2$. The range matters
      exactly because it holds five integers. Widen it to $-2 \le r \le 3$ and
      uniqueness dies: $3 = 5 \cdot 0 + 3$ and $3 = 5 \cdot 1 + (-2)$ are both
      legal. Narrow it to $-1 \le r \le 2$ and existence dies: $a = 3$ has no
      representation, since $3 - 5q$ never lands in that range.
    rubric:
      - >
        Gets existence from the ordinary division algorithm and repairs the
        cases $r_0 = 3$ and $r_0 = 4$ by subtracting $5$ from the remainder
        and adding $1$ to the quotient.
      - >
        Proves uniqueness by bounding $|r_2 - r_1| \le 4 < 5$ and concluding
        that the multiple $5(q_1 - q_2)$ of $5$ must be $0$ — the same size
        argument the original theorem uses.
      - >
        Names both failures concretely: a six-integer range breaks uniqueness
        (two representations of the same $a$) and a four-integer range breaks
        existence (some $a$ has none).
    targets:
      - number-theory.divisibility.division-algorithm
    exercises: []
    connects: []
    tags: []

  # --- the gcd ----------------------------------------------------------------

  - id: divisibility-def-gcd-01
    kind: work
    difficulty: standard
    statement: >
      Working from the definition alone — list the positive divisors of each
      number and take the largest they share — compute $\gcd(126, 189)$.
    answer: >
      $63$. The positive divisors of $126$ are
      $1, 2, 3, 6, 7, 9, 14, 18, 21, 42, 63, 126$; those of $189$ are
      $1, 3, 7, 9, 21, 27, 63, 189$. The numbers on both lists are
      $1, 3, 7, 9, 21, 63$, and the largest is $63$, so $\gcd(126, 189) = 63$
      — confirmed directly by $126 = 63 \cdot 2$ and $189 = 63 \cdot 3$. The
      definition's guarantee that a largest exists is visible in the two lists:
      $1$ appears on both, so the intersection is nonempty, and every divisor
      of $126$ has absolute value at most $126$, so the intersection is
      finite. Notice also how much labour this cost for a pair of three-digit
      numbers; that expense is the entire motivation for the Euclidean
      algorithm.
    expects: "63"
    rubric:
      - >
        Intersects two complete divisor lists rather than guessing a shared
        factor and stopping.
      - >
        Verifies the answer against the definition with $126 = 63 \cdot 2$ and
        $189 = 63 \cdot 3$.
    targets:
      - number-theory.divisibility.def-gcd
    exercises: []
    connects: []
    tags: []

  - id: divisibility-def-gcd-02
    kind: work
    difficulty: demanding
    statement: >
      For how many integers $a$ with $1 \le a \le 40$ is $\gcd(a, 24) = 8$?
    answer: >
      $4$. Since $\gcd(a, 24)$ divides $a$, the condition forces $8 \mid a$,
      which cuts the candidates down to $8, 16, 24, 32, 40$. Now evaluate each
      gcd from the definition. $\gcd(8, 24) = 8$, since $8$ divides both.
      $\gcd(16, 24) = 8$: the common divisors are $1, 2, 4, 8$.
      $\gcd(24, 24) = 24$, which is too large — this is the one that fails,
      and it fails because $a = 24$ shares all of $24$ rather than just an
      $8$. $\gcd(32, 24) = 8$ and $\gcd(40, 24) = 8$. So four values work:
      $8, 16, 32, 40$. Answering $5$ counts every multiple of $8$ in range
      without checking that the gcd is exactly $8$ rather than merely at least
      $8$, and that distinction is the whole problem.
    expects: "4"
    rubric:
      - >
        Observes that $\gcd(a, 24) \mid a$, so the condition forces $8 \mid a$
        and only five candidates need testing.
      - >
        Rejects $a = 24$, where the gcd is $24$ and not $8$ — the condition is
        an equality, not a lower bound.
    targets:
      - number-theory.divisibility.def-gcd
    exercises: []
    connects: []
    tags: []

  # --- Bézout, and what it upgrades -------------------------------------------

  - id: divisibility-bezout-01
    kind: work
    difficulty: demanding
    statement: >
      Bézout's identity says that the values of $91x + 65y$, as $x$ and $y$
      range over the integers, are exactly the multiples of one particular
      number. What is the smallest positive value $91x + 65y$ takes?
    answer: >
      $13$. The theorem names that least positive value as $\gcd(91, 65)$, so
      compute it: $91 = 1 \cdot 65 + 26$, $65 = 2 \cdot 26 + 13$,
      $26 = 2 \cdot 13 + 0$, giving $\gcd(91, 65) = 13$. And $13$ really is
      reached — $91 \cdot (-2) + 65 \cdot 3 = -182 + 195 = 13$. Nothing
      smaller is available, because $13$ divides both $91 = 13 \cdot 7$ and
      $65 = 13 \cdot 5$ and so divides every combination $91x + 65y$ by
      linearity, leaving no positive value below $13$ in the set. Guessing $1$
      is the standard slip: $1$ would require $91$ and $65$ to be coprime, and
      they share the factor $13$.
    expects: "13"
    rubric:
      - >
        Identifies the least positive value of $ax + by$ as $\gcd(a,b)$ rather
        than hunting for small combinations by trial.
      - >
        Computes $\gcd(91, 65) = 13$ and says why nothing smaller is
        reachable: $13$ divides every combination, by linearity.
    targets:
      - number-theory.divisibility.bezout
    exercises: []
    connects: []
    tags: []

  - id: divisibility-bezout-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of these four equations has a solution in integers $x, y$.
      Which one?
    answer: >
      $18x + 30y = 42$. Bézout says the set of values of $18x + 30y$ is
      exactly the set of multiples of $\gcd(18, 30) = 6$, so an equation
      $18x + 30y = m$ is solvable precisely when $6 \mid m$. Of the four right
      sides, $21$, $15$ and $100$ are not multiples of $6$ — the first two are
      odd, and every combination of two even numbers is even, while
      $100 = 6 \cdot 16 + 4$. Only $42 = 6 \cdot 7$ qualifies. To produce a
      solution, start from $18 \cdot 2 + 30 \cdot (-1) = 36 - 30 = 6$ and
      multiply through by $7$: $18 \cdot 14 + 30 \cdot (-7) = 252 - 210 = 42$.
      So $(x, y) = (14, -7)$ works, and the theorem guaranteed in advance that
      something would.
    choices:
      - text: >
          $18x + 30y = 21$
        feedback: >
          No solution: $21$ is odd, and $18x + 30y$ is always even. More
          sharply, $\gcd(18,30) = 6$ and $6 \nmid 21$.
      - text: >
          $18x + 30y = 42$
        correct: true
        feedback: >
          Solvable, since $42 = 6 \cdot 7$ is a multiple of
          $\gcd(18, 30) = 6$. Scaling $18 \cdot 2 + 30 \cdot (-1) = 6$ by $7$
          gives $(x, y) = (14, -7)$.
      - text: >
          $18x + 30y = 15$
        feedback: >
          No solution: $15$ is odd and $18x + 30y$ is even, and $6 \nmid 15$
          in any case.
      - text: >
          $18x + 30y = 100$
        feedback: >
          No solution. Being even is not enough — the value must be a multiple
          of the gcd, and $100 = 6 \cdot 16 + 4$.
    rubric:
      - >
        Computes $\gcd(18, 30) = 6$ and applies the criterion that
        $ax + by = m$ is solvable exactly when the gcd divides $m$.
      - >
        Does not stop at parity: rejects $100$ for failing divisibility by
        $6$, not merely for looking unlike the others.
    targets:
      - number-theory.divisibility.bezout
    exercises: []
    connects: []
    tags: []

  - id: divisibility-bezout-03
    kind: justify
    difficulty: demanding
    statement: >
      Let $a$ and $b$ be integers, not both zero, and let $d = \gcd(a,b)$.
      Prove that the set $S = \{ax + by : x, y \in \mathbb{Z}\}$ is exactly
      the set of integer multiples of $d$. Prove both inclusions, and say
      which one consumes the theorem.
    answer: >
      One inclusion is pure linearity. Since $d \mid a$ and $d \mid b$, $d$
      divides $ax + by$ for all integers $x$ and $y$; so every element of $S$
      is a multiple of $d$. The other inclusion is where Bézout is spent. The
      identity supplies integers $x_0, y_0$ with $ax_0 + by_0 = d$, so
      $d \in S$; and for any integer $k$, multiplying that equation through by
      $k$ gives $a(kx_0) + b(ky_0) = kd$, so $kd \in S$ as well. The two
      inclusions together say $S$ is precisely the set of multiples of $d$.
      The asymmetry is worth stating: the first inclusion would hold with any
      common divisor of $a$ and $b$ in place of $d$, and proves nothing
      special about the gcd; it is the second — that $d$ itself is attained —
      that is Bézout's entire content. It also explains at once why $d$ is the
      least positive member of $S$: any positive element smaller than $d$
      would be a multiple of $d$ lying strictly between $0$ and $d$, and there
      is no such thing.
    rubric:
      - >
        Proves $S$ is contained in the multiples of $d$ using only linearity
        and the fact that $d$ is a common divisor.
      - >
        Proves the reverse inclusion by citing Bézout for a representation of
        $d$ itself and then scaling that representation by an arbitrary
        integer $k$.
      - >
        Says explicitly which half needs the theorem — the easy half holds for
        every common divisor, so only the attainment of $d$ is Bézout — and
        deduces the least-positive-value statement from the description.
    targets:
      - number-theory.divisibility.bezout
    exercises: []
    connects: []
    tags: []

  - id: divisibility-common-divisors-divide-gcd-01
    kind: work
    difficulty: standard
    statement: >
      Suppose $\gcd(a, b) = 18$. What is $\gcd(7a, 7b)$?
    answer: >
      $126$. Write $18 = ax + by$ by Bézout and multiply through by $7$:
      $126 = (7a)x + (7b)y$. So every common divisor of $7a$ and $7b$ divides
      $126$. And $126 = 7 \cdot 18$ is itself a common divisor of $7a$ and
      $7b$, since $18$ divides both $a$ and $b$. A positive common divisor
      that every common divisor divides is the gcd, so
      $\gcd(7a, 7b) = 126$ — the scaling corollary
      $\gcd(ka, kb) = |k| \gcd(a,b)$ in one instance. Answering $18$ treats
      the gcd as unaffected by scaling both inputs, which a concrete pair
      refutes at once: with $a = 18$ and $b = 36$ we have $\gcd(a,b) = 18$
      while $\gcd(126, 252) = 126$.
    expects: "126"
    rubric:
      - >
        Scales a Bézout representation of $18$ by $7$ to show every common
        divisor of $7a$ and $7b$ divides $126$.
      - >
        Checks that $126$ is itself a common divisor of $7a$ and $7b$, so that
        the divisibility characterisation identifies it as the gcd.
    targets:
      - number-theory.divisibility.common-divisors-divide-gcd
    exercises:
      - number-theory.divisibility.bezout
    connects: []
    tags: []

  - id: divisibility-common-divisors-divide-gcd-02
    kind: justify
    difficulty: demanding
    statement: >
      Let $k$ be a nonzero integer and let $a, b$ be integers, not both zero.
      Prove that $\gcd(ka, kb) = |k| \gcd(a, b)$.
    answer: >
      Write $d = \gcd(a,b)$ and $e = \gcd(ka, kb)$; both are positive. First,
      $|k|d$ is a common divisor of $ka$ and $kb$: from $d \mid a$ we get
      $|k|d \mid |k|a$, and signs are invisible to divisibility, so
      $|k|d \mid ka$; the same runs for $b$. By the corollary that every
      common divisor divides the gcd, $|k|d \mid e$. Second, Bézout gives
      integers $x, y$ with $ax + by = d$; multiplying by $k$ gives
      $(ka)x + (kb)y = kd$, and $e$ divides both $ka$ and $kb$, so $e \mid kd$
      by linearity, hence $e \mid |k|d$. Now $|k|d$ and $e$ are positive
      integers dividing each other, so antisymmetry gives $e = |k|d$. Note
      what the corollary buys. The first half on its own would only give
      $|k|d \le e$, an inequality no algebra can combine with the second half;
      upgrading it to a divisibility is exactly what makes the antisymmetry
      step available.
    rubric:
      - >
        Shows $|k| \gcd(a,b)$ is a common divisor of $ka$ and $kb$ and
        concludes it *divides* $\gcd(ka, kb)$, via the corollary, rather than
        merely being no larger.
      - >
        Uses a Bézout representation of $\gcd(a,b)$ multiplied by $k$ to get
        the reverse divisibility $\gcd(ka,kb) \mid |k| \gcd(a,b)$.
      - >
        Closes with antisymmetry — two positive integers dividing each other
        are equal — rather than comparing sizes.
    targets:
      - number-theory.divisibility.common-divisors-divide-gcd
