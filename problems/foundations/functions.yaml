# Problems targeting foundations.functions — the definition as a triple, range,
# image and preimage, the three adjectives, composition, inverses, pigeonhole.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's
# ending with something the lesson has just handed over, and every node also
# carries something a unit test can fairly ask. Every `work` and `decide`
# problem is machine-checked; `justify` is where the proofs live. No problem
# reuses a lesson's worked example or a card's instance. See ../README.md.

problems:
  # --- the definition ---------------------------------------------------------

  - id: functions-def-function-01
    kind: work
    difficulty: demanding
    statement: >
      Let $A = \{1,2,3\}$ and $B = \{1,2,3,4\}$. The grid $A \times B$ has $12$
      cells, so there are $2^{12}$ relations from $A$ to $B$. How many of those
      relations are the graph of a function $A \to B$?
    answer: >
      $64$. A relation is any subset of $A \times B$; it is the graph of a
      function exactly when every row of the grid — one row per element of $A$ —
      contains exactly one chosen cell. So building a graph is not a free choice
      of a subset but three independent choices, one per row, of which of the $4$
      columns to occupy: $4 \cdot 4 \cdot 4 = 4^{3} = 64$. Both halves of the
      condition are doing work in that count. Allowing a row to be empty would
      give $5$ options per row and admit relations that are not total; allowing a
      row two cells would break single-valuedness. Note which set sizes the base
      and the exponent: the domain indexes the choices and the codomain supplies
      them, so the answer is $4^{3}$ and not $3^{4} = 81$.
    expects: "64"
    rubric:
      - >
        Chooses one cell per row of $A \times B$, using totality and
        single-valuedness as the two constraints that cut $2^{12}$ subsets down
        to a product of row choices.
      - >
        Gets base and exponent the right way round: $|B|^{|A|} = 4^{3}$, not
        $|A|^{|B|} = 3^{4}$.
    targets:
      - foundations.functions.def-function
    exercises:
      - foundations.relations.def-binary-relation
      - foundations.sets.cartesian-product
    connects: []
    tags: []

  - id: functions-def-function-02
    kind: decide
    difficulty: standard
    statement: >
      Let $R = \{(x,y) \in \mathbb{Z} \times \mathbb{Z} : x + 2y = 6\}$, read as
      a relation from $\mathbb{Z}$ to $\mathbb{Z}$. Which clause of the
      definition of a function does $R$ fail?
    answer: >
      Totality fails and single-valuedness holds. For a fixed $x$ the equation
      $x + 2y = 6$ is linear in $y$ and has the single solution $y = (6-x)/2$, so
      no $x$ is ever paired with two values — uniqueness is safe. But that
      solution is an integer only when $x$ is even: for $x = 1$ we would need
      $2y = 5$, which no integer satisfies, so the row above $x = 1$ of the grid
      $\mathbb{Z} \times \mathbb{Z}$ is empty. The relation is therefore the
      graph of a function on the even integers and of nothing on $\mathbb{Z}$,
      which is the reason the domain is part of the data: change the declared
      domain to $2\mathbb{Z}$ and the same set of pairs becomes a function.
    choices:
      - text: >
          Totality: an odd $x$ is paired with nothing, since $(6-x)/2$ is not an
          integer
        correct: true
        feedback: >
          Existence is what fails; every $x$ that is paired at all is paired
          exactly once.
      - text: >
          Single-valuedness: each $x$ is paired with two values of $y$
        feedback: >
          The equation is linear in $y$, so it has one solution or none, never
          two. Two solutions would need a quadratic.
      - text: >
          Both clauses fail
        feedback: >
          Only existence is at risk. Fixing $x$ determines $y$ uniquely, so
          single-valuedness holds for every $x$ whatsoever.
      - text: >
          Neither — $R$ is the graph of a function $\mathbb{Z} \to \mathbb{Z}$
        feedback: >
          Test $x = 1$: $2y = 5$ has no integer solution, so that input is left
          without a value and the relation is not total.
    rubric:
      - >
        Separates the two clauses and tests them independently: fixing $x$ gives at
        most one $y$, so only existence can fail.
      - >
        Names an explicit odd $x$ whose row is empty, rather than asserting that the
        equation "sometimes has no solution".
    targets:
      - foundations.functions.def-function
    exercises:
      - foundations.relations.def-binary-relation
    connects: []
    tags: []

  - id: functions-def-function-03
    kind: work
    difficulty: routine
    statement: >
      How many functions $f : \{1,2,3,4,5\} \to \{0,1\}$ satisfy $f(1) = 0$?
    answer: >
      $16$. A function on a five-element domain is five independent choices of
      value, one per input, each from the two-element codomain, so there are
      $2^{5} = 32$ functions in all. Fixing $f(1) = 0$ removes one of those
      choices and constrains nothing else: single-valuedness ties each input to
      its own value and says nothing about how the inputs relate. The remaining
      four inputs still have two options each, giving $2^{4} = 16$. As a
      cross-check, the same argument with $f(1) = 1$ gives another $16$, and
      $16 + 16 = 32$ recovers the total.
    expects: "16"
    rubric:
      - >
        Treats the four unconstrained inputs as independent, giving $2^{4}$
        rather than subtracting or halving something else.
      - >
        Does not confuse the count of functions with the count of values: the
        answer is a power of the codomain size, exponent the number of free
        inputs.
    targets:
      - foundations.functions.def-function
    exercises: []
    connects: []
    tags: []

  # --- range versus codomain --------------------------------------------------

  - id: functions-def-range-01
    kind: work
    difficulty: demanding
    statement: >
      Let $f : \{1,2,\dots,10\} \to \mathbb{Z}$ be $f(n) = n^{2} - 7n$. How many
      elements does $\operatorname{ran} f$ have?
    answer: >
      $7$. The range is the set of values actually taken, so sweep the domain and
      then discard repeats. A shortcut finds the repeats first: $n^{2} - 7n =
      n(n-7)$ is unchanged when $n$ is replaced by $7 - n$, so $f(1) = f(6)$,
      $f(2) = f(5)$ and $f(3) = f(4)$ — three collisions inside the domain. The
      values are $f(1) = f(6) = -6$, $f(2) = f(5) = -10$, $f(3) = f(4) = -12$,
      and then $f(7) = 0$, $f(8) = 8$, $f(9) = 18$, $f(10) = 30$, all distinct.
      So $\operatorname{ran} f = \{-12,-10,-6,0,8,18,30\}$, which has $7$
      elements against a domain of $10$. Answering $10$ counts inputs rather than
      values; answering that the range is $\mathbb{Z}$ reports the codomain,
      which was chosen at the declaration and is not computed from the rule.
    expects: "7"
    rubric:
      - >
        Collapses repeated values — the range is a set, so $f(1) = f(6)$
        contributes one element and not two.
      - >
        Answers with the values actually taken, not with the declared codomain
        $\mathbb{Z}$ and not with the size of the domain.
    targets:
      - foundations.functions.def-range
    exercises:
      - foundations.functions.def-function
    connects: []
    tags: []

  - id: functions-def-range-02
    kind: decide
    difficulty: standard
    statement: >
      Let $f : \mathbb{Z} \to \mathbb{Z}$ be $f(n) = 3n + 1$. Which set is
      $\operatorname{ran} f$?
    answer: >
      The integers of the form $3k + 1$. Every value $3n + 1$ is one more than a
      multiple of $3$, so the range is contained in that set; conversely any
      integer $3k + 1$ is $f(k)$ with $k \in \mathbb{Z}$, so the containment is
      an equality. The codomain, by contrast, was declared to be $\mathbb{Z}$,
      and it is strictly larger — $2$ and $3$ are values $f$ was allowed to take
      and never does. Nothing is wrong with $f$; a codomain is under no
      obligation to be exhausted, and the gap between the two sets is exactly
      what the word "onto" is about.
    choices:
      - text: >
          The integers of the form $3k+1$
        correct: true
        feedback: >
          Every value is $1$ more than a multiple of $3$, and every such integer
          is hit, so the two inclusions close.
      - text: >
          $\mathbb{Z}$, because the codomain was declared to be $\mathbb{Z}$
        feedback: >
          The codomain is chosen when the function is declared; the range is
          computed from the rule. They coincide only when $f$ is onto.
      - text: >
          The multiples of $3$
        feedback: >
          That is the range of $n \mapsto 3n$. The $+1$ shifts the whole set, and
          $0$ is not a value of $f$.
      - text: >
          The integers $\ge 1$
        feedback: >
          The domain is all of $\mathbb{Z}$, so negative inputs give negative
          values: $f(-1) = -2$.
    rubric:
      - >
        Proves both inclusions: every value has the form $3k+1$, and every such
        integer is a value.
      - >
        Does not report the declared codomain $\mathbb{Z}$ as the range.
    targets:
      - foundations.functions.def-range
    exercises: []
    connects: []
    tags: []

  # --- equality of functions --------------------------------------------------

  - id: functions-def-equality-01
    kind: work
    difficulty: demanding
    statement: >
      Let $A = \{1,2,3\}$. How many functions $f : A \to A$ satisfy $f(a) = a$
      for at least two of the three elements $a \in A$?
    answer: >
      $7$. Split by how many points are fixed. All three fixed: then $f$ agrees
      with the rule $a \mapsto a$ at every point of a common domain and into a
      common codomain, so by extensionality $f$ is that function and there is
      exactly $1$ such $f$. Exactly two fixed: choose which two, $\binom{3}{2} =
      3$ ways, and then the third element must be sent somewhere other than
      itself, which leaves $2$ of the $3$ values — $3 \cdot 2 = 6$ functions.
      Total $1 + 6 = 7$. The point the count makes is that "agrees at two of the
      three points" is not equality: six of these seven functions agree with
      $a \mapsto a$ almost everywhere and are still different functions, because
      equality demands agreement at *every* point, along with matching domain
      and matching codomain.
    expects: "7"
    rubric:
      - >
        Counts the all-fixed case as exactly one function, using extensionality
        — agreement at every point of a common domain and codomain is equality.
      - >
        In the exactly-two case, forces the remaining point to move, so it
        contributes $2$ values and not $3$.
    targets:
      - foundations.functions.def-equality
    exercises: []
    connects: []
    tags: []

  - id: functions-def-equality-02
    kind: decide
    difficulty: standard
    statement: >
      Which of these is a pair of *equal* functions?
    answer: >
      The pair $f, g : \mathbb{R} \to \mathbb{R}$ with $f(x) = (x-1)(x+1)$ and
      $g(x) = x^{2} - 1$. Equality is three conditions: same domain, same
      codomain, same value at every point of that domain. Here the first two
      match by declaration and the third holds because expanding $(x-1)(x+1)$
      gives $x^{2} - 1$ for every real $x$ — how a value is computed is
      irrelevant, which is what extensionality means. Each of the other pairs
      breaks exactly one condition: differing codomains, differing domains, or
      differing values at a point. The last case shows how cheap a disproof is:
      one point where the values differ settles it.
    choices:
      - text: >
          $f : \mathbb{R} \to \mathbb{R}$ with $f(x) = (x-1)(x+1)$ and
          $g : \mathbb{R} \to \mathbb{R}$ with $g(x) = x^{2} - 1$
        correct: true
        feedback: >
          Same domain, same codomain, and the two rules agree at every real $x$
          — the formulas may differ, the functions do not.
      - text: >
          $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = n^{2}$ and
          $g : \mathbb{Z} \to \mathbb{R}$ with $g(n) = n^{2}$
        feedback: >
          The codomains differ, and the codomain is part of the data — this is
          exactly the distinction that makes surjectivity meaningful.
      - text: >
          $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = n$ and
          $g : \{0,1,2\} \to \mathbb{Z}$ with $g(n) = n$
        feedback: >
          The domains differ; $g$ is a restriction of $f$, which is a different
          function, not the same one written twice.
      - text: >
          $f, g : \{1,2\} \to \mathbb{Z}$ with $f(n) = n$ and $g(n) = n^{2}$
        feedback: >
          They agree at $1$ and differ at $2$, and a single point of disagreement
          is a complete disproof.
    rubric:
      - >
        Checks all three conditions — domain, codomain, value at every point — rather
        than comparing formulas.
      - >
        Rejects the two near-misses for the right reason: a changed codomain or a
        changed domain changes the function even when the rule is untouched.
    targets:
      - foundations.functions.def-equality
    exercises:
      - foundations.functions.def-function
    connects: []
    tags: []

  # --- image of a set ---------------------------------------------------------

  - id: functions-def-image-01
    kind: work
    difficulty: demanding
    statement: >
      Let $f : \{1,2,\dots,10\} \to \mathbb{Z}$ send $n$ to $\lfloor 10/n
      \rfloor$. Let $S$ be the set of odd elements of the domain. How many
      elements does $f(S)$ have?
    answer: >
      $4$. Here $S = \{1,3,5,7,9\}$, and the image is what you get by pushing
      each of those forward and collecting the results as a *set*: $f(1) = 10$,
      $f(3) = 3$, $f(5) = 2$, $f(7) = 1$ and $f(9) = 1$. So $f(S) = \{1,2,3,10\}$
      — four elements from a five-element $S$, because $7$ and $9$ both land on
      $1$ and the repeat collapses. That is the general shape of the image: it
      can shrink a set but never grow one, so $|f(S)| \le |S|$ always. Answering
      $5$ counts inputs; answering $10$ takes the largest value rather than the
      number of values.
    expects: "4"
    rubric:
      - >
        Evaluates $f$ only on $S$, not on the whole domain — $f(S)$ is not the
        range.
      - >
        Collects the outputs as a set, so the shared value at $7$ and $9$ is
        counted once.
    targets:
      - foundations.functions.def-image
    exercises: []
    connects: []
    tags: []

  - id: functions-def-image-02
    kind: decide
    difficulty: routine
    statement: >
      Let $f : \{1,2,3,4\} \to \{p,q,r\}$ with $f(1) = p$, $f(2) = r$,
      $f(3) = p$ and $f(4) = q$. What is $f(\{1,3,4\})$?
    answer: >
      $\{p,q\}$. Apply $f$ to each element of the subset and collect the values:
      $f(1) = p$, $f(3) = p$, $f(4) = q$, so the image is $\{p, p, q\} =
      \{p,q\}$, a two-element set. Two things the notation invites you to get
      wrong: the image lives in the codomain, so it is a set of letters and never
      a set of numbers; and it is built from the members of the chosen subset
      only, so $f(2) = r$ plays no part even though $r$ is in the range of $f$.
      The general fact behind the shrinkage is that $b \in f(S)$ asks only that
      *some* $s \in S$ have $f(s) = b$.
    choices:
      - text: >
          $\{p,q\}$
        correct: true
        feedback: >
          The three inputs give $p$, $p$, $q$, and the repeat collapses in a set.
      - text: >
          $\{p,q,r\}$
        feedback: >
          That is $f$ of the whole domain — the range. The value $r$ comes from
          $2$, which is not in the chosen subset.
      - text: >
          $\{1,3,4\}$
        feedback: >
          That is the subset itself. An image lives in the codomain, on the other
          side of the arrow.
      - text: >
          $\{p,r\}$
        feedback: >
          $f(2) = r$ was used, but $2 \notin \{1,3,4\}$; $f(4) = q$ is the value
          that belongs here.
    rubric:
      - >
        Applies $f$ only to the members of the chosen subset, so $f(2)$ is not used.
      - >
        Reports a subset of the codomain, and collapses the repeated value.
    targets:
      - foundations.functions.def-image
    exercises: []
    connects: []
    tags: []

  # --- preimage of a set ------------------------------------------------------

  - id: functions-def-preimage-01
    kind: work
    difficulty: demanding
    statement: >
      Let $f : \{1,2,\dots,20\} \to \mathbb{Z}$ be $f(n) = n^{2} - 10n$, and let
      $T = \{-25,-24,\dots,-16\}$, the ten integers from $-25$ to $-16$. How many
      elements does $f^{-1}(T)$ have?
    answer: >
      $7$. Completing the square gives $f(n) = (n-5)^{2} - 25$, so the membership
      test $f(n) \in T$ reads $-25 \le (n-5)^{2} - 25 \le -16$, that is
      $0 \le (n-5)^{2} \le 9$, that is $|n - 5| \le 3$, that is $2 \le n \le 8$.
      Those seven inputs all lie in the domain, so $f^{-1}(T) = \{2,3,4,5,6,7,8\}$
      and the answer is $7$. Two features worth naming. The sizes of $T$ and of
      $f^{-1}(T)$ are unrelated: $|T| = 10$ here, and in fact only four elements
      of $T$ are ever attained, namely $-25, -24, -21, -16$, so six of the ten
      fibers are empty. And nothing in the computation needed $f$ to be
      invertible — $f^{-1}$ applied to a set is a single symbol, legal for every
      function, and this $f$ has no inverse at all.
    expects: "7"
    rubric:
      - >
        Turns membership in $T$ into an inequality on $n$ and solves it, rather
        than testing all twenty inputs and mis-tallying.
      - >
        Counts elements of the domain that land in $T$, not elements of $T$ —
        the preimage lives on the input side.
    targets:
      - foundations.functions.def-preimage
    exercises: []
    connects: []
    tags: []

  - id: functions-def-preimage-02
    kind: decide
    difficulty: standard
    statement: >
      Let $f : \mathbb{Z} \to \mathbb{Z}$ be $f(n) = n^{2}$. What is
      $f^{-1}(\{4,5\})$?
    answer: >
      $\{-2,2\}$. Run the definition: $f^{-1}(\{4,5\})$ is the set of integers
      $n$ with $n^{2} \in \{4,5\}$. The fiber over $4$ is $\{-2,2\}$, since both
      squares equal $4$; the fiber over $5$ is empty, because $5$ is not a
      perfect square, and an empty fiber contributes nothing rather than being an
      obstruction. So the preimage is $\{-2,2\} \cup \emptyset = \{-2,2\}$. Note
      that $f$ is neither injective nor surjective and the expression was still
      perfectly legal: $f^{-1}$ applied to a subset of the codomain is defined
      for every function whatsoever and asserts nothing about invertibility.
    choices:
      - text: >
          $\{-2,2\}$
        correct: true
        feedback: >
          Both $(-2)^{2}$ and $2^{2}$ equal $4$, and no integer squares to $5$.
      - text: >
          $\{2\}$
        feedback: >
          The negative root was dropped. The fiber over $4$ collects *every*
          input with that value, and there are two.
      - text: >
          $\{4,5\}$
        feedback: >
          That is the set $T$ you started with. A preimage lives in the domain,
          on the other side of the arrow.
      - text: >
          Undefined, since $f$ has no inverse function
        feedback: >
          $f^{-1}$ applied to a *set* is one symbol, not the inverse function
          evaluated somewhere; it is defined for every function.
    rubric:
      - >
        Collects *every* input with value in $T$, so the fiber over $4$ contributes
        both $-2$ and $2$.
      - >
        Treats the empty fiber over $5$ as contributing nothing, rather than as making
        the expression illegal.
    targets:
      - foundations.functions.def-preimage
    exercises: []
    connects: []
    tags: []

  # --- injective, surjective, bijective ---------------------------------------

  - id: functions-def-injective-01
    kind: work
    difficulty: demanding
    statement: >
      How many injective functions $f : \{1,2,3\} \to \{1,2,3,4,5\}$ satisfy
      $f(1) \ne 1$?
    answer: >
      $48$. Count all injections first: $f(1)$ has $5$ choices, and injectivity
      bars each later input from the values already used, so $f(2)$ has $4$ and
      $f(3)$ has $3$, giving $5 \cdot 4 \cdot 3 = 60$. Among these, the ones with
      $f(1) = 1$ are counted by the same falling pattern with the first slot
      fixed: $1 \cdot 4 \cdot 3 = 12$. So the answer is $60 - 12 = 48$. Counting
      directly agrees and is a useful check: $f(1)$ has $4$ permitted values,
      then $f(2)$ has $4$ remaining and $f(3)$ has $3$, giving
      $4 \cdot 4 \cdot 3 = 48$. Answering $5^{3} = 125$ forgets injectivity
      entirely, and answering $60$ forgets the constraint on $f(1)$.
    expects: "48"
    rubric:
      - >
        Uses falling factors, not $5^{3}$ — each new input is barred from every
        value already taken, which is what injectivity says.
      - >
        Removes the $f(1) = 1$ cases by counting them as a fixed first slot with
        the remaining slots still falling, giving $12$ and not $1$.
    targets:
      - foundations.functions.def-injective
    exercises: []
    connects: []
    tags: []

  - id: functions-def-injective-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of these functions $\mathbb{Z} \to \mathbb{Z}$ is injective.
      Which?
    answer: >
      The map $n \mapsto 4n - 9$. Suppose $4a - 9 = 4b - 9$; adding $9$ and
      dividing by $4$ gives $a = b$, and every step was reversible arithmetic, so
      distinct inputs have distinct outputs. Each of the others fails on an
      explicit pair, which is all a disproof of injectivity ever needs, since the
      negation of "for all $a_1, a_2$" is "for some $a_1, a_2$". Note that none
      of these failures has anything to do with the codomain: injectivity is a
      property of the rule together with the domain, and shrinking the domain can
      repair it while shrinking the codomain cannot.
    choices:
      - text: >
          $n \mapsto 4n - 9$
        correct: true
        feedback: >
          $4a - 9 = 4b - 9$ forces $a = b$ by reversible arithmetic.
      - text: >
          $n \mapsto n^{2} + n$
        feedback: >
          $f(0) = 0$ and $f(-1) = 0$ with $0 \ne -1$ — the graph is symmetric
          about $n = -1/2$, so integers pair up.
      - text: >
          $n \mapsto |n| + n$
        feedback: >
          Every $n \le 0$ is sent to $0$, so the whole negative half collapses to
          a single value.
      - text: >
          $n \mapsto \lfloor n/2 \rfloor$
        feedback: >
          $f(0) = f(1) = 0$; rounding down glues each even integer to its
          successor.
    rubric:
      - >
        Proves the injective case by assuming $f(a_1) = f(a_2)$ and deducing
        $a_1 = a_2$.
      - >
        Refutes each other candidate with one explicit pair of distinct inputs sharing
        a value.
    targets:
      - foundations.functions.def-injective
    exercises: []
    connects: []
    tags: []

  - id: functions-def-injective-03
    kind: justify
    difficulty: standard
    statement: >
      Prove from the definition that $f : \mathbb{Z} \to \mathbb{Z}$ with
      $f(n) = 5n - 4$ is injective, and prove that $g : \mathbb{Z} \to
      \mathbb{Z}$ with $g(n) = n^{2} - 4n$ is not.
    answer: >
      For $f$, take arbitrary $a_1, a_2 \in \mathbb{Z}$ and assume
      $f(a_1) = f(a_2)$, that is $5a_1 - 4 = 5a_2 - 4$. Adding $4$ gives
      $5a_1 = 5a_2$ and dividing by $5$ gives $a_1 = a_2$. Since $a_1$ and $a_2$
      were arbitrary, $f$ is injective. For $g$ one pair suffices: $g(0) = 0$ and
      $g(4) = 16 - 16 = 0$, while $0 \ne 4$, so two distinct inputs share a
      value. The asymmetry in the two arguments is the point. Injectivity is a
      universal statement, so establishing it requires an argument valid for
      every pair; its negation is existential, so refuting it requires exactly
      one exhibited pair and no general reasoning at all. Writing $g$ as
      $(n-2)^{2} - 4$ shows where to look for such a pair: the values depend only
      on $|n - 2|$, so $n$ and $4 - n$ always collide.
    rubric:
      - >
        For $f$, starts from $f(a_1) = f(a_2)$ for arbitrary $a_1, a_2$ and
        deduces $a_1 = a_2$ — not the converse, which holds for every function.
      - >
        For $g$, exhibits one explicit pair of distinct inputs with equal values,
        rather than arguing in general.
    targets:
      - foundations.functions.def-injective
    exercises: []
    connects: []
    tags: []

  - id: functions-def-surjective-01
    kind: work
    difficulty: demanding
    statement: >
      How many surjective functions are there from a $4$-element set onto a
      $3$-element set?
    answer: >
      $36$. Surjectivity says the range exhausts the codomain, so count all
      functions and remove those that miss a value. There are $3^{4} = 81$
      functions in total. For each of the $3$ values, the functions missing it
      form a set of size $2^{4} = 16$; for each of the $3$ pairs of values, the
      functions missing both number $1^{4} = 1$; nothing can miss all three.
      Inclusion and exclusion give $81 - 3 \cdot 16 + 3 \cdot 1 = 81 - 48 + 3 =
      36$. A structural count confirms it: a surjection from four inputs onto
      three values must have fiber sizes $2, 1, 1$, so choose the two inputs that
      collide, $\binom{4}{2} = 6$ ways, then match the three resulting blocks
      with the three values in $3! = 6$ ways, giving $6 \cdot 6 = 36$. Answering
      $81$ forgets the condition; answering $4 \cdot 3 \cdot 2 = 24$ counts
      injections, which do not exist here at all.
    expects: "36"
    rubric:
      - >
        Subtracts the functions that miss a value and adds back those that miss
        two, rather than subtracting once and stopping at $81 - 48 = 33$.
      - >
        Recognises that surjectivity forces fiber sizes $2,1,1$, so the count is
        about which inputs collide and which value each block takes.
    targets:
      - foundations.functions.def-surjective
    exercises:
      - foundations.functions.def-range
    connects: []
    tags: []

  - id: functions-def-surjective-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of these functions $\mathbb{Z} \to \mathbb{Z}$ is surjective.
      Which?
    answer: >
      The map $n \mapsto \lceil n/2 \rceil$. To check surjectivity, take an
      arbitrary $m$ in the codomain and produce an input: $\lceil 2m/2 \rceil =
      \lceil m \rceil = m$, and $2m$ is an integer, so $m$ is a value. That is
      the whole method — surjectivity is an existence statement, and a formula
      for the witness proves it in one line. The others each miss something, and
      a single missed value is a complete disproof, since the negation of "for
      every $b$ there exists $a$" is "for some $b$, no $a$ works". Note that
      $n \mapsto n^{3}$ is injective and still fails: the two adjectives are
      independent, and neither implies the other.
    choices:
      - text: >
          $n \mapsto \lceil n/2 \rceil$
        correct: true
        feedback: >
          Given $m$, the input $2m$ has value $m$; every integer is reached, so
          the range exhausts the codomain.
      - text: >
          $n \mapsto 3n$
        feedback: >
          The fiber over $1$ is empty, since $3n = 1$ has no integer solution.
          The range is the multiples of $3$.
      - text: >
          $n \mapsto n^{2}$
        feedback: >
          Every negative integer has an empty fiber, and so does every positive
          non-square.
      - text: >
          $n \mapsto n^{3}$
        feedback: >
          Injective, but $2$ is not the cube of an integer. Injectivity does not
          buy surjectivity.
    rubric:
      - >
        Proves surjectivity by exhibiting an input for an arbitrary target value, not
        by checking a few values.
      - >
        Refutes each other candidate by naming one element of the codomain with an
        empty fiber.
    targets:
      - foundations.functions.def-surjective
    exercises: []
    connects: []
    tags: []

  - id: functions-def-bijective-01
    kind: work
    difficulty: demanding
    statement: >
      How many bijections $f : \{1,2,3,4,5\} \to \{1,2,3,4,5\}$ satisfy
      $f(1) = 2$ and $f(2) \ne 1$?
    answer: >
      $18$. A bijection between two five-element sets matches them element for
      element with nothing left over, so once $f(1) = 2$ is fixed the remaining
      four inputs $2,3,4,5$ must be matched bijectively with the four unused
      values $1,3,4,5$, and there are $4! = 24$ ways to do that. Among those, the
      ones with $f(2) = 1$ leave three inputs to be matched with three values, so
      there are $3! = 6$ of them. Subtracting, $24 - 6 = 18$. The step that needs
      care is why the remaining matching must itself be a bijection: injectivity
      forbids reusing the value $2$, and surjectivity requires every one of
      $1,3,4,5$ to be taken, and with four inputs for four values both demands
      are met only by a perfect pairing.
    expects: "18"
    rubric:
      - >
        Uses both halves of bijectivity to reduce to a bijection between the
        four remaining inputs and the four remaining values, giving $4!$.
      - >
        Subtracts the $f(2) = 1$ cases as $3! = 6$, not as $1$ or as $4!/2$.
    targets:
      - foundations.functions.def-bijective
    exercises:
      - foundations.functions.def-injective
      - foundations.functions.def-surjective
    connects: []
    tags: []

  - id: functions-def-bijective-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of these functions is a bijection. Which?
    answer: >
      The map $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = 3 - n$. Injective:
      $3 - a = 3 - b$ gives $a = b$. Surjective: for any $m \in \mathbb{Z}$ the
      integer $3 - m$ lies in the domain and $f(3-m) = 3 - (3-m) = m$. Both halves
      hold, so $f$ pairs $\mathbb{Z}$ with itself perfectly. Each other option
      fails exactly one half, which is the useful thing to notice: neither
      adjective implies the other, and an infinite domain lets a map be injective
      without being surjective — something impossible between finite sets of the
      same size.
    choices:
      - text: >
          $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = 3 - n$
        correct: true
        feedback: >
          Injective and surjective, and it is its own reverse: applying it twice
          returns every integer to itself.
      - text: >
          $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = 2n + 1$
        feedback: >
          Injective, but every even integer has an empty fiber, so it is not
          onto.
      - text: >
          $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = n^{2} - n$
        feedback: >
          Neither: $f(0) = f(1) = 0$ kills injectivity, and no value is ever
          negative.
      - text: >
          $f : \mathbb{N} \to \mathbb{N}$ with $f(n) = n + 3$
        feedback: >
          Injective and not surjective — the first few elements of the codomain
          are never reached. Infinite sets allow this.
    rubric:
      - >
        Checks both halves for the chosen map, and identifies which single half each
        other option fails.
      - >
        Does not treat injectivity as evidence of surjectivity, or vice versa.
    targets:
      - foundations.functions.def-bijective
    exercises:
      - foundations.functions.def-injective
      - foundations.functions.def-surjective
    connects: []
    tags: []

  # --- images, preimages and the set operations -------------------------------

  - id: functions-image-set-ops-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $f : A \to B$ and $S, S' \subseteq A$. Prove that
      $f(S \cup S') = f(S) \cup f(S')$ for every such $f$, and exhibit an $f$
      together with subsets $S, S'$ that *meet* for which
      $f(S \cap S') \ne f(S) \cap f(S')$.
    answer: >
      Unwind both sides on an arbitrary $b \in B$. Membership $b \in f(S \cup S')$
      says there is an $a \in S \cup S'$ with $f(a) = b$. Such an $a$ lies in $S$
      or in $S'$, so either $b \in f(S)$ or $b \in f(S')$, giving $b \in f(S) \cup
      f(S')$. Conversely, a witness for $b$ in $S$ or in $S'$ is in particular a
      witness in $S \cup S'$, so the reverse inclusion holds too and the sets are
      equal. What made this work is that the existential quantifier distributes
      over "or": a single witness serves both readings. For the intersection, take
      $A = \{1,2,3\}$, $B = \{u,v\}$, $f(1) = f(3) = u$ and $f(2) = v$, with
      $S = \{1,2\}$ and $S' = \{2,3\}$. Then $S \cap S' = \{2\}$, so
      $f(S \cap S') = \{v\}$, whereas $f(S) = \{u,v\}$ and $f(S') = \{u,v\}$ have
      intersection $\{u,v\}$. The element $u$ is in both images through *different*
      witnesses — $1$ on one side, $3$ on the other — and no single witness lies in
      the intersection. That is precisely the step "and" breaks: the inclusion
      $f(S \cap S') \subseteq f(S) \cap f(S')$ survives, and only it.
    rubric:
      - >
        Proves the union identity by both inclusions (or one chain of
        equivalences) and says where the existential quantifier is used.
      - >
        The counterexample has $S \cap S'$ non-empty, and the failure is
        attributed to two *different* witnesses landing on the same value.
      - >
        States which inclusion survives in general —
        $f(S \cap S') \subseteq f(S) \cap f(S')$ — rather than claiming both fail.
    targets:
      - foundations.functions.image-set-ops
    exercises:
      - foundations.functions.def-image
      - foundations.logic.quantifier-existential
      - foundations.sets.def-union
      - foundations.sets.def-intersection
    connects: []
    tags: []

  - id: functions-image-set-ops-02
    kind: work
    difficulty: standard
    statement: >
      Let $f : \{1,2,\dots,9\} \to \mathbb{Z}$ be $f(n) = (n-5)^{2}$, and take
      $S = \{1,2,3,4\}$ and $S' = \{6,7,8,9\}$. How many elements does
      $f(S) \cap f(S')$ have?
    answer: >
      $4$. The values of $f$ are $16, 9, 4, 1, 0, 1, 4, 9, 16$ as $n$ runs from
      $1$ to $9$, since $f(n)$ depends only on $|n - 5|$. So $f(S) =
      \{16,9,4,1\}$ and $f(S') = \{1,4,9,16\}$ — the same four-element set, and
      their intersection has $4$ elements. Now compare the other side of the
      inclusion: $S$ and $S'$ are disjoint, so $S \cap S' = \emptyset$ and
      $f(S \cap S') = \emptyset$, which has $0$ elements. This is the inclusion
      $f(S \cap S') \subseteq f(S) \cap f(S')$ being as strict as it can possibly
      be, and the reason is visible in the table: each value is reached from $S$
      by one input and from $S'$ by a different one.
    expects: "4"
    rubric:
      - >
        Computes $f(S)$ and $f(S')$ separately and intersects the images, rather
        than taking the image of $S \cap S'$.
      - >
        Notes that $f(S \cap S') = \emptyset$ here, so the general inclusion is
        strict and cannot be an equality without a hypothesis on $f$.
    targets:
      - foundations.functions.image-set-ops
    exercises:
      - foundations.functions.def-image
      - foundations.sets.def-intersection
    connects: []
    tags: []

  - id: functions-preimage-set-ops-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $f : A \to B$ and $T \subseteq B$. Prove that
      $f^{-1}(B \setminus T) = A \setminus f^{-1}(T)$, and state exactly what
      hypothesis on $f$ the proof used.
    answer: >
      Fix an arbitrary $a \in A$ and run a chain of equivalences. Membership
      $a \in f^{-1}(B \setminus T)$ says $f(a) \in B \setminus T$, that is
      $f(a) \in B$ and $f(a) \notin T$. The first conjunct is automatic — $f$ is
      a function into $B$, so $f(a)$ exists and lies in $B$ — leaving exactly
      $f(a) \notin T$, which says $a \notin f^{-1}(T)$, which says $a \in A
      \setminus f^{-1}(T)$. Every step was an equivalence, so the two sets have
      the same members and are equal. The hypothesis used is only that $f$ is a
      function: totality and single-valuedness give each $a$ one value $f(a)$,
      and a single value either is or is not in $T$, so negation passes through
      the test unharmed. No injectivity and no surjectivity anywhere. This is the
      structural reason preimages respect every Boolean operation while images do
      not: $a \in f^{-1}(T)$ is a test on one element of $B$, whereas $b \in f(S)$
      is an existential search over $S$, and negating a search does not produce a
      search.
    rubric:
      - >
        Argues elementwise on an arbitrary $a \in A$ with a chain of
        equivalences, rather than proving one inclusion and asserting the other.
      - >
        Identifies where $f(a) \in B$ is used, and concludes that *no* hypothesis
        on $f$ beyond being a function is needed.
    targets:
      - foundations.functions.preimage-set-ops
    exercises:
      - foundations.functions.def-preimage
      - foundations.sets.def-difference
    connects: []
    tags: []

  - id: functions-preimage-set-ops-02
    kind: work
    difficulty: standard
    statement: >
      Let $f : \{1,2,\dots,12\} \to \mathbb{Z}$ send $n$ to $\gcd(n,12)$. With
      $T = \{1,2,3\}$ and $T' = \{3,4,6\}$, how many elements does
      $f^{-1}(T \cup T')$ have?
    answer: >
      $11$. The values of $f$ for $n = 1, \dots, 12$ are
      $1, 2, 3, 4, 1, 6, 1, 4, 3, 2, 1, 12$. Here $T \cup T' = \{1,2,3,4,6\}$, and
      the membership test $f(n) \in T \cup T'$ passes for every $n$ in the domain
      except $n = 12$, whose value $12$ is not in the set. So
      $f^{-1}(T \cup T') = \{1,2,\dots,11\}$, with $11$ elements. The union
      identity gives the same number as a check: $f^{-1}(T) = \{1,2,3,5,7,9,10,11\}$
      and $f^{-1}(T') = \{3,4,6,8,9\}$, whose union is again everything but $12$.
      Note that $T$ and $T'$ overlap in $\{3\}$ and the preimages overlap in
      $\{3,9\}$ — for preimages, unlike images, that correspondence is exact.
    expects: "11"
    rubric:
      - >
        Forms $T \cup T'$ first, or takes the union of the two preimages, and
        gets the same answer either way.
      - >
        Counts elements of the domain, not of $T \cup T'$, and excludes exactly
        the one input whose value is $12$.
    targets:
      - foundations.functions.preimage-set-ops
    exercises:
      - foundations.functions.def-preimage
      - foundations.sets.def-union
    connects: []
    tags: []

  - id: functions-image-preimage-roundtrip-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $f : A \to B$ and $T \subseteq B$. Prove that
      $f(f^{-1}(T)) = T \cap f(A)$, and deduce that $f(f^{-1}(T)) = T$ holds for
      every $T \subseteq B$ exactly when $f$ is surjective.
    answer: >
      For the inclusion from left to right, let $b \in f(f^{-1}(T))$. Then
      $b = f(a)$ for some $a \in f^{-1}(T)$, so $f(a) \in T$, i.e. $b \in T$; and
      $b = f(a)$ with $a \in A$ gives $b \in f(A)$. Hence $b \in T \cap f(A)$.
      For the reverse, let $b \in T \cap f(A)$. Being in $f(A)$ supplies an
      $a \in A$ with $f(a) = b$, and since $b \in T$ that $a$ satisfies
      $f(a) \in T$, so $a \in f^{-1}(T)$ and therefore $b = f(a) \in
      f(f^{-1}(T))$. The two inclusions give the identity. Now the equivalence.
      If $f$ is surjective then $f(A) = B$, so $T \cap f(A) = T$ for every
      $T \subseteq B$ and the round trip returns $T$. Conversely, suppose the
      identity holds for every $T$ and instantiate it at $T = B$: it says
      $f(f^{-1}(B)) = B$, and the left side is $B \cap f(A) = f(A)$, so
      $f(A) = B$ and $f$ is onto. Instantiating at a singleton $T = \{b\}$ works
      just as well and is often quicker to write. The general lesson is that
      pushing forward after pulling back can only *lose* points — the ones in $T$
      that were never values — and surjectivity is exactly the hypothesis that
      there are none.
    rubric:
      - >
        Proves the reverse inclusion by producing a witness $a$ with $f(a) = b$
        and checking that this $a$ lies in $f^{-1}(T)$.
      - >
        For the converse direction, instantiates the universal hypothesis at a
        specific $T$ (say $T = B$, or a singleton) instead of restating it.
      - >
        Keeps the two failures apart: this round trip loses points, and it is
        surjectivity — not injectivity — that repairs it.
    targets:
      - foundations.functions.image-preimage-roundtrip
    exercises:
      - foundations.functions.def-image
      - foundations.functions.def-preimage
      - foundations.functions.def-surjective
    connects: []
    tags: []

  - id: functions-image-preimage-roundtrip-02
    kind: work
    difficulty: standard
    statement: >
      Let $f : \{1,2,\dots,8\} \to \mathbb{Z}$ be $f(n) = n(9-n)$, and take
      $S = \{1,2,3\}$. How many elements does $f^{-1}(f(S))$ have?
    answer: >
      $6$. The values of $f$ are $8, 14, 18, 20, 20, 18, 14, 8$ for
      $n = 1, \dots, 8$, because replacing $n$ by $9 - n$ leaves $n(9-n)$
      unchanged. Pushing $S$ forward, $f(S) = \{8, 14, 18\}$. Pulling that back
      collects every input whose value is one of those three: $8$ comes from $1$
      and $8$, $14$ from $2$ and $7$, $18$ from $3$ and $6$. So
      $f^{-1}(f(S)) = \{1,2,3,6,7,8\}$, which has $6$ elements against the $3$ of
      $S$. The inclusion $S \subseteq f^{-1}(f(S))$ held, as it must, and the
      three extra points are exactly the partners $9 - n$ that share a value with
      a member of $S$. Had $f$ been injective there would have been no partners
      and the round trip would have returned $S$ itself.
    expects: "6"
    rubric:
      - >
        Computes $f(S)$ first and only then pulls it back, rather than answering
        with $|S|$ or with $|f(S)|$.
      - >
        Sweeps the whole domain when pulling back, so the partners $9-n$ outside
        $S$ are collected.
    targets:
      - foundations.functions.image-preimage-roundtrip
    exercises:
      - foundations.functions.def-image
      - foundations.functions.def-preimage
    connects: []
    tags: []

  - id: functions-image-preimage-asymmetry-01
    kind: decide
    difficulty: demanding
    statement: >
      A student argues: "$b \in f(S \cap S')$ says some point of $S \cap S'$ maps
      to $b$; $b \in f(S) \cap f(S')$ says some point of $S$ maps to $b$ and some
      point of $S'$ maps to $b$. Since $\exists$ distributes over $\wedge$, the
      two are the same." Exactly one step is wrong. Which?
    answer: >
      The distribution claim. The unpacking of both sides is correct: images are
      existential by definition. But $(\exists s \in S)(f(s) = b) \wedge (\exists
      s' \in S')(f(s') = b)$ permits the two witnesses to be *different* points,
      while $(\exists s \in S \cap S')(f(s) = b)$ demands a single point lying in
      both sets. The first is therefore strictly weaker, which is exactly the
      inclusion $f(S \cap S') \subseteq f(S) \cap f(S')$ and its strictness. The
      contrast with "or" is what makes the union identity work: a witness for a
      disjunction is one point, and one point already lies in $S \cup S'$, so
      nothing is lost there. And it is the same leak that spoils the round trip
      $S \subseteq f^{-1}(f(S))$, where the extra points are again the witnesses
      that were not the one you started with.
    choices:
      - text: >
          The claim that $\exists$ distributes over $\wedge$ — the right side
          allows two different witnesses, the left demands a single one
        correct: true
        feedback: >
          Exactly: one witness in $S$ and a different one in $S'$ satisfy the
          right side while leaving $S \cap S'$ contributing nothing.
      - text: >
          The unpacking of $b \in f(S \cap S')$ — the image of an intersection is
          defined by a universal condition, not an existential one
        feedback: >
          Images are always existential: $b \in f(X)$ means *some* point of $X$
          maps to $b$. The error is at the quantifier law, not the definition.
      - text: >
          Nothing is wrong — the identity is true, and the usual counterexamples
          only fail because the two subsets are disjoint
        feedback: >
          Subsets that meet can fail it too. What is needed is one value reached
          from each subset by a different point, and that is easy to arrange with
          a non-empty intersection.
    rubric:
      - >
        Locates the error at the quantifier step, not in the definition of the
        image.
      - >
        Says what "two different witnesses" buys, and why the same argument does
        not damage the union identity.
    targets:
      - foundations.functions.image-preimage-asymmetry
    exercises:
      - foundations.functions.image-set-ops
    connects: []
    tags: []

  - id: functions-image-preimage-asymmetry-02
    kind: decide
    difficulty: standard
    statement: >
      The identity $f^{-1}(B \setminus T) = A \setminus f^{-1}(T)$ needs no
      hypothesis on $f$, while $f(A \setminus S)$ and $B \setminus f(S)$ are
      unrelated in general. What is the single source of that difference?
    answer: >
      Membership in a preimage is a test applied to one element — $a \in
      f^{-1}(T)$ asks only whether the single value $f(a)$ lies in $T$ — so its
      negation is again a test on $f(a)$, and every Boolean operation on $T$
      transfers intact. Membership in an image is a search — $b \in f(S)$ asks
      whether *some* point of $S$ maps to $b$ — and the negation of a search is a
      universal statement, not another search, so complements do not transfer.
      Concretely, $b \notin f(S)$ says every point of $S$ misses $b$, which tells
      you nothing about whether some point outside $S$ hits it; a value with two
      preimages, one inside $S$ and one outside, sits in both $f(S)$ and
      $f(A \setminus S)$. The practical consequence is the one worth carrying:
      when a proof offers a choice, push the problem through the preimage.
    choices:
      - text: >
          $a \in f^{-1}(T)$ tests the one value $f(a)$, so negating it is again a
          test on $f(a)$; $b \in f(S)$ is a search over $S$, and the negation of a
          search is not a search
        correct: true
        feedback: >
          One element versus an unbounded search — that single difference is
          behind every place the two constructions fail to match.
      - text: >
          Preimages are always larger sets than images, and larger sets are
          closed under more operations
        feedback: >
          Size is irrelevant and the claim is false: $f^{-1}(T)$ can be empty
          while $f(S)$ is large.
      - text: >
          The two identities live on opposite sides of the arrow, one about
          subsets of $A$ and one about subsets of $B$
        feedback: >
          True but inert. The preimage identity also relates a subset of $B$ to a
          subset of $A$, and it still holds unconditionally.
    rubric:
      - >
        Names the pointwise test versus the existential search as the one source,
        rather than citing a property of images or preimages as sets.
      - >
        Draws the working consequence: prefer the preimage formulation when a
        definition or proof admits both.
    targets:
      - foundations.functions.image-preimage-asymmetry
    exercises:
      - foundations.functions.image-set-ops
      - foundations.functions.preimage-set-ops
    connects: []
    tags: []

  # --- composition, identity, inclusion, restriction --------------------------

  - id: functions-def-composition-01
    kind: work
    difficulty: demanding
    statement: >
      Let $f, g : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = 2n - 3$ and
      $g(n) = n^{2} + n$. Compute $(g \circ f)(4) - (f \circ g)(4)$.
    answer: >
      $-7$. Both composites are legal because domain and codomain are
      $\mathbb{Z}$ throughout, so the matching hypothesis holds in both
      directions — and that is unusual; in general only one of the two exists.
      The notation runs right to left. For $g \circ f$ the function $f$ acts
      first: $f(4) = 8 - 3 = 5$, then $g(5) = 25 + 5 = 30$. For $f \circ g$ the
      function $g$ acts first: $g(4) = 16 + 4 = 20$, then $f(20) = 40 - 3 = 37$.
      The difference is $30 - 37 = -7$. The answer being non-zero is the content
      of the problem: composition is not commutative, and reading $g \circ f$
      left to right as "$g$ first" would have produced $+7$, the negative of the
      right answer.
    expects: "-7"
    rubric:
      - >
        Applies the right-hand function first in each composite — $g \circ f$
        means $g(f(4))$, not $f(g(4))$.
      - >
        Computes the two composites separately and subtracts in the stated order,
        arriving at a negative number.
    targets:
      - foundations.functions.def-composition
    exercises: []
    connects: []
    tags: []

  - id: functions-def-composition-02
    kind: decide
    difficulty: standard
    statement: >
      Let $f : \{1,2,3\} \to \{a,b\}$ and $g : \{a,b,c\} \to \{1,2,3\}$. Which
      composite is defined?
    answer: >
      Only $f \circ g$. The definition requires the codomain of the
      right-hand function to *be* the domain of the left-hand one. For $f \circ
      g$: the codomain of $g$ is $\{1,2,3\}$, which is exactly the domain of $f$,
      so $f \circ g : \{a,b,c\} \to \{a,b\}$ is legal. For $g \circ f$: the
      codomain of $f$ is $\{a,b\}$ while the domain of $g$ is $\{a,b,c\}$, and
      these are different sets, so as declared the composite is not defined.
      There is a looser convention under which $g \circ f$ passes because every
      value of $f$ happens to lie in the domain of $g$; making that legal here
      means first redeclaring $f$ with codomain $\{a,b,c\}$, and by the equality
      of functions that redeclared object is a *different* function from $f$.
      Saying so out loud is the whole point of carrying the codomain as data.
    choices:
      - text: >
          $f \circ g$ only
        correct: true
        feedback: >
          The codomain of $g$ is exactly the domain of $f$, so the composite
          $\{a,b,c\} \to \{a,b\}$ is legal as declared.
      - text: >
          $g \circ f$ only
        feedback: >
          That composite would feed a value of $f$, an element of $\{a,b\}$, into
          $g$, whose declared domain is the larger set $\{a,b,c\}$.
      - text: >
          Both, since every value of $f$ does lie in the domain of $g$
        feedback: >
          That is the looser convention. Under this definition $g \circ f$ is
          legal only after $f$ is redeclared with codomain $\{a,b,c\}$ — and that
          redeclaration is a different function.
      - text: >
          Neither
        feedback: >
          $f \circ g$ matches exactly: codomain of $g$ equals domain of $f$, on
          the nose.
    rubric:
      - >
        Compares the codomain of the inner function with the domain of the outer
        one, in that order, for each candidate.
      - >
        Treats "the values happen to land in the right set" as a different claim
        from "the codomain equals the domain", and says which one the definition
        asks for.
    targets:
      - foundations.functions.def-composition
    exercises: []
    connects: []
    tags: []

  - id: functions-composition-associative-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $f : A \to B$, $g : B \to C$ and $h : C \to D$. Prove
      $h \circ (g \circ f) = (h \circ g) \circ f$ directly from the definition of
      equality of functions. Then give explicit $f, g : \mathbb{R} \to \mathbb{R}$
      with $f \circ g \ne g \circ f$.
    answer: >
      Equality of functions is three conditions, and all three must be checked.
      Domains: $g \circ f : A \to C$, so $h \circ (g \circ f)$ has domain $A$;
      and $h \circ g : B \to D$, so $(h \circ g) \circ f$ also has domain $A$.
      Codomains: both are $D$. Values: let $a \in A$ be arbitrary. Then
      $(h \circ (g \circ f))(a) = h((g \circ f)(a)) = h(g(f(a)))$, and
      $((h \circ g) \circ f)(a) = (h \circ g)(f(a)) = h(g(f(a)))$. The two agree
      at every point of the common domain, so the functions are equal, and the
      common value may be written $h \circ g \circ f$ with no brackets at all.
      Commutativity is a different matter. Take $f(x) = x - 6$ and $g(x) = x^{2}$
      on $\mathbb{R}$. Then $(g \circ f)(x) = (x-6)^{2}$ while
      $(f \circ g)(x) = x^{2} - 6$, and at $x = 0$ these are $36$ and $-6$. One
      point of disagreement is a complete disproof, and in the general setting
      the failure is even cruder: $f \circ g$ often is not defined at all.
    rubric:
      - >
        Checks that the two sides have the same domain and the same codomain
        before comparing values — the value clause alone is not equality.
      - >
        Unwinds both sides at an *arbitrary* $a$, so the conclusion is about the
        functions and not about one input.
      - >
        Disproves commutativity with explicit maps and one point where the two
        composites differ.
    targets:
      - foundations.functions.composition-associative
    exercises:
      - foundations.functions.def-composition
      - foundations.functions.def-equality
    connects: []
    tags: []

  - id: functions-composition-associative-02
    kind: work
    difficulty: standard
    statement: >
      On $\mathbb{R}$ let $f(x) = x - 2$, $g(x) = x^{2}$ and $h(x) = 3x + 1$.
      Compute $(h \circ (g \circ f))(5)$.
    answer: >
      $28$. Working from the inside out: $f(5) = 3$, then $g(3) = 9$, then
      $h(9) = 27 + 1 = 28$. Associativity says the other bracketing must agree,
      and it does: $(h \circ g)(x) = 3x^{2} + 1$, so
      $((h \circ g) \circ f)(5) = (h \circ g)(3) = 27 + 1 = 28$. That agreement
      is exactly why the chain may be written $h \circ g \circ f$ with the
      brackets dropped. Order, by contrast, is not free: the same three functions
      composed as $f \circ g \circ h$ give $h(5) = 16$, then $g(16) = 256$, then
      $f(256) = 254$. Bracketing never matters, the sequence always does.
    expects: "28"
    rubric:
      - >
        Applies the functions right to left, so $f$ acts on $5$ first and $h$
        last.
      - >
        Confirms the answer with the other bracketing rather than assuming it,
        and does not reorder the three maps.
    targets:
      - foundations.functions.composition-associative
    exercises:
      - foundations.functions.def-composition
    connects: []
    tags: []

  - id: functions-composition-inj-surj-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $f : A \to B$ and $g : B \to C$. Prove that (i) if $f$ and $g$ are both
      injective then $g \circ f$ is injective, and (ii) if $g \circ f$ is
      injective then $f$ is injective. Then give finite sets and explicit maps
      showing that in (ii) the map $g$ need not be injective.
    answer: >
      (i) Suppose $(g \circ f)(a_1) = (g \circ f)(a_2)$, that is
      $g(f(a_1)) = g(f(a_2))$. Apply injectivity of $g$ to the two elements
      $f(a_1)$ and $f(a_2)$ of $B$: it gives $f(a_1) = f(a_2)$. Now apply
      injectivity of $f$: it gives $a_1 = a_2$. The order matters — the outer map
      is peeled off first, because it is the one whose inputs are the values in
      question. (ii) Suppose $f(a_1) = f(a_2)$. Applying $g$ to both sides of an
      equality is always legal, and yields
      $(g \circ f)(a_1) = (g \circ f)(a_2)$; injectivity of the composite then
      gives $a_1 = a_2$. Nothing about $g$ was assumed. For the counterexample,
      let $A = \{1,2\}$, $B = \{1,2,3\}$, $C = \{1,2\}$, with $f(1) = 2$,
      $f(2) = 3$ and $g(1) = 1$, $g(2) = 1$, $g(3) = 2$. Then $(g \circ f)(1) = 1$
      and $(g \circ f)(2) = 2$, so the composite is injective, while
      $g(1) = g(2)$ shows $g$ is not. The collision in $g$ is invisible to the
      composite because it happens at $1 \in B$, a point the map $f$ never
      reaches.
    rubric:
      - >
        In (i), applies injectivity of $g$ to the pair $f(a_1), f(a_2)$ before
        applying injectivity of $f$ — outer map first.
      - >
        In (ii), starts from $f(a_1) = f(a_2)$ and applies $g$ to both sides,
        without assuming anything about $g$.
      - >
        The counterexample puts the collision of $g$ outside the range of $f$,
        and says why that is what hides it from the composite.
    targets:
      - foundations.functions.composition-inj-surj
    exercises:
      - foundations.functions.def-composition
      - foundations.functions.def-injective
    connects: []
    tags: []

  - id: functions-composition-inj-surj-02
    kind: decide
    difficulty: standard
    statement: >
      You are told only that $g \circ f$ is surjective, where $f : A \to B$ and
      $g : B \to C$. What follows?
    answer: >
      Only that $g$ is surjective. Let $c \in C$ be arbitrary. Surjectivity of
      the composite supplies an $a \in A$ with $g(f(a)) = c$, and $f(a)$ is an
      element of $B$, so $c$ has a preimage under $g$ — namely $f(a)$. Since $c$
      was arbitrary, $g$ is onto. Nothing follows about $f$: the composite can
      reach all of $C$ while $f$ leaves part of $B$ untouched, provided $g$ maps
      the touched part onto $C$ anyway. The pattern is worth memorising with its
      companion: a surjective composite forces the *last* map to be surjective,
      and an injective composite forces the *first* map to be injective. Each
      partial converse points at the end of the chain nearest the property's own
      side of the arrow.
    choices:
      - text: >
          $g$ is surjective
        correct: true
        feedback: >
          Every $c \in C$ is $g(f(a))$ for some $a$, and $f(a) \in B$ is the
          witness $g$ needs.
      - text: >
          $f$ is surjective
        feedback: >
          Wrong end of the chain. $f$ may miss part of $B$ entirely, as long as
          $g$ carries the rest onto all of $C$.
      - text: >
          Both $f$ and $g$ are surjective
        feedback: >
          The conclusion about $g$ is right and the one about $f$ is not; the
          converse is partial, and in a fixed direction.
      - text: >
          Nothing follows without knowing more
        feedback: >
          Something does: unwinding $g(f(a)) = c$ already exhibits a preimage of
          $c$ under $g$.
    rubric:
      - >
        Produces the witness for $g$ explicitly as $f(a)$, rather than asserting
        the conclusion.
      - >
        Declines to conclude anything about $f$, and states the matching rule for
        injectivity in the opposite direction.
    targets:
      - foundations.functions.composition-inj-surj
    exercises:
      - foundations.functions.def-composition
      - foundations.functions.def-surjective
    connects: []
    tags: []

  - id: functions-def-identity-01
    kind: work
    difficulty: demanding
    statement: >
      Let $f : \{1,2,3\} \to \{1,2,3\}$ be given by $f(1) = 1$, $f(2) = 2$ and
      $f(3) = 2$. How many functions $u : \{1,2,3\} \to \{1,2,3\}$ satisfy
      $f \circ u = f$?
    answer: >
      $4$. One solution is free: $u = \mathrm{id}$ works for every $f$
      whatsoever, since $f \circ \mathrm{id}_A = f$ is precisely the neutrality
      of the identity. The question is whether it is the only one. The equation
      $f \circ u = f$ says $f(u(n)) = f(n)$ for each $n$, that is, $u(n)$ must be
      an input carrying the same value as $n$. The inputs carrying value $1$ are
      just $\{1\}$, and those carrying value $2$ are $\{2,3\}$. So $u(1) = 1$ is
      forced, while $u(2)$ and $u(3)$ may each be $2$ or $3$: $1 \cdot 2 \cdot 2 =
      4$ solutions, of which the identity is the one with $u(2) = 2$ and
      $u(3) = 3$. The general statement the count illustrates: $\mathrm{id}_A$ is
      always a solution, and it is the *unique* solution exactly when $f$ is
      injective, since only then does every value come from a single input.
    expects: "4"
    rubric:
      - >
        Notes that $\mathrm{id}$ solves the equation for every $f$ — that is what
        neutrality means — and then asks whether anything else does.
      - >
        Turns $f \circ u = f$ into the pointwise condition that $u(n)$ carries the
        same value as $n$, and counts the free choices, getting $4$ and not $1$.
    targets:
      - foundations.functions.def-identity
    exercises:
      - foundations.functions.def-composition
    connects: []
    tags: []

  - id: functions-def-identity-02
    kind: work
    difficulty: standard
    statement: >
      Let $A$ be a four-element set. How many functions $f : A \to A$ are
      injective and satisfy $f \circ f = f$?
    answer: >
      $1$ — the identity map, and nothing else. The equation $f \circ f = f$ says
      $f(f(a)) = f(a)$ for every $a \in A$. Read that as an equality of two
      values of $f$, at the inputs $f(a)$ and $a$; injectivity then forces those
      inputs to coincide, so $f(a) = a$ for every $a$. Since the domain and the
      codomain are both $A$ and the values agree at every point, extensionality
      gives $f = \mathrm{id}_A$. Note what the argument did not use: the size $4$
      never appeared, so the same holds on any set at all. Dropping injectivity
      changes the answer completely — every constant map also satisfies
      $f \circ f = f$, and on a four-element set there are four of those.
    expects: "1"
    rubric:
      - >
        Applies injectivity to the equality $f(f(a)) = f(a)$ to conclude
        $f(a) = a$, rather than checking candidate functions one at a time.
      - >
        Concludes $f = \mathrm{id}_A$ by extensionality — same domain, same
        codomain, equal values everywhere — and so answers $1$.
    targets:
      - foundations.functions.def-identity
    exercises:
      - foundations.functions.def-composition
    connects: []
    tags: []

  - id: functions-def-inclusion-01
    kind: work
    difficulty: demanding
    statement: >
      Let $A = \{1,2,3,4,5\}$. For how many subsets $S \subseteq A$ is the
      inclusion map $\iota_S : S \to A$ injective but not surjective?
    answer: >
      $31$. Injectivity is free: $\iota_S(s) = s$, so $\iota_S(s) = \iota_S(s')$
      is literally $s = s'$, and every inclusion whatsoever is injective. The
      condition therefore reduces to failing surjectivity. The range of $\iota_S$
      is $S$ and its codomain is $A$, so $\iota_S$ is surjective exactly when
      $S = A$. Hence the count is all subsets but one: $2^{5} - 1 = 31$. The
      empty set belongs to the $31$ — $\iota_\emptyset : \emptyset \to A$ is
      vacuously injective, and since $A$ is not empty it is not surjective — so
      the answer is $31$ and not $30$. This is the cleanest illustration that the
      codomain is part of the data: every $\iota_S$ has the same assignment rule
      as an identity map, and only the one with $S = A$ *is* an identity map.
    expects: "31"
    rubric:
      - >
        Observes that injectivity holds for every $S$ and reduces the problem to
        counting the subsets with $S \ne A$.
      - >
        Counts $2^{5} - 1$, keeping $S = \emptyset$ in the tally rather than
        discarding it as a degenerate case.
    targets:
      - foundations.functions.def-inclusion
    exercises:
      - foundations.functions.def-injective
      - foundations.functions.def-surjective
    connects: []
    tags: []

  - id: functions-def-inclusion-02
    kind: decide
    difficulty: standard
    statement: >
      Let $S \subseteq A$ with $S \ne A$, and let $\iota_S : S \to A$ be the
      inclusion. What is $\iota_S^{-1}(A \setminus S)$?
    answer: >
      $\emptyset$. Unwind the definition: $\iota_S^{-1}(A \setminus S)$ is the
      set of $s \in S$ with $\iota_S(s) \in A \setminus S$, and $\iota_S(s) = s$,
      so the condition reads $s \in S$ and $s \notin S$ at once — impossible.
      Hence the preimage is empty, even though the set $A \setminus S$ being
      pulled back is not. That is the standard shape of the trap: a preimage is a
      subset of the *domain*, here $S$, and it says nothing about the size of the
      set it came from. It also records the fact that $\iota_S$ is not surjective:
      the elements of $A \setminus S$ all have empty fibers, which is exactly
      what $S \ne A$ costs.
    choices:
      - text: >
          $\emptyset$
        correct: true
        feedback: >
          Every $s \in S$ has $\iota_S(s) = s \in S$, so no element of the domain
          lands outside $S$.
      - text: >
          $A \setminus S$
        feedback: >
          That is the set being pulled back. A preimage lives in the domain $S$,
          which is disjoint from $A \setminus S$.
      - text: >
          $S$
        feedback: >
          That is $\iota_S^{-1}(S)$, the preimage of the other piece of $A$.
      - text: >
          $A$
        feedback: >
          The preimage is a subset of the domain $S$, and $S$ is a proper subset
          of $A$.
    rubric:
      - >
        Applies the definition of preimage to the rule $\iota_S(s) = s$ and
        derives the contradictory condition $s \in S$ and $s \notin S$.
      - >
        Answers with a subset of the domain $S$, not with a subset of $A$.
    targets:
      - foundations.functions.def-inclusion
    exercises: []
    connects: []
    tags: []

  - id: functions-def-restriction-01
    kind: work
    difficulty: demanding
    statement: >
      Let $f : \{1,2,\dots,9\} \to \mathbb{Z}$ be $f(n) = |n - 5|$. How many
      subsets $S$ of the domain with exactly $5$ elements make the restriction
      $f|_S$ injective?
    answer: >
      $16$. Since $f|_S(s) = f(s)$, the restriction is injective exactly when no
      two elements of $S$ share a value of $f$. Group the domain by value:
      $\{5\}$ has value $0$, $\{4,6\}$ has value $1$, $\{3,7\}$ has value $2$,
      $\{2,8\}$ has value $3$ and $\{1,9\}$ has value $4$ — five groups in all.
      A set $S$ with $|S| = 5$ meeting each of five groups at most once must meet
      every group exactly once. The first group forces the element $5$, and each
      of the other four offers two choices, so the count is
      $1 \cdot 2^{4} = 16$. What the answer records is the asymmetry of the
      operation: $f$ itself is not injective, and restricting has *created* a
      property the original lacked, in sixteen different ways. Extension runs the
      other way and is neither automatic nor unique.
    expects: "16"
    rubric:
      - >
        Restates injectivity of $f|_S$ as "$S$ contains at most one input from
        each group of inputs sharing a value".
      - >
        Deduces from $|S| = 5$ and five groups that every group is met exactly
        once, so the count is $1 \cdot 2^{4}$ and not $2^{5}$.
    targets:
      - foundations.functions.def-restriction
    exercises:
      - foundations.functions.def-injective
    connects: []
    tags: []

  - id: functions-def-restriction-02
    kind: decide
    difficulty: standard
    statement: >
      Let $f : \mathbb{R} \to \mathbb{R}$ be $f(x) = x^{2} - 4x$. On which of
      these subsets $S \subseteq \mathbb{R}$ is the restriction $f|_S$ injective?
    answer: >
      On $S = [2,\infty)$. Completing the square gives $f(x) = (x-2)^{2} - 4$, so
      the value depends only on $|x - 2|$ and the inputs $x$ and $4 - x$ always
      collide. A subset makes the restriction injective exactly when it contains
      no such pair, that is, when it lies entirely on one side of $2$. The set
      $[2,\infty)$ does: on it $|x-2| = x - 2$, which is different for different
      $x$, so the values are distinct. Each of the others straddles $2$ and
      carries a colliding pair — $0$ and $4$, or $1$ and $3$. This is restriction
      creating injectivity, exactly as shrinking the domain of $\sin$ does before
      an inverse can be discussed; note that no change of codomain could have
      achieved it, since injectivity does not depend on the codomain at all.
    choices:
      - text: >
          $S = [2,\infty)$
        correct: true
        feedback: >
          On this half-line $|x-2| = x-2$ is injective, so distinct inputs give
          distinct values.
      - text: >
          $S = \mathbb{R}$
        feedback: >
          That is the unrestricted $f$, and $f(0) = f(4) = 0$.
      - text: >
          $S = [0,4]$
        feedback: >
          The endpoints collide: $f(0) = f(4) = 0$.
      - text: >
          $S = [0,3]$
        feedback: >
          $f(1) = f(3) = -3$; the interval straddles $2$, so it contains a
          colliding pair even though it misses $0$ and $4$.
    rubric:
      - >
        Identifies the colliding pairs as $x$ and $4-x$, using
        $f(x) = (x-2)^{2}-4$, rather than testing values at random.
      - >
        Selects a subset lying entirely on one side of $2$, and says that
        shrinking the codomain would not have helped.
    targets:
      - foundations.functions.def-restriction
    exercises:
      - foundations.functions.def-injective
    connects: []
    tags: []

  # --- inverses ---------------------------------------------------------------

  - id: functions-def-inverse-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $f : A \to B$, and suppose $g : B \to A$ satisfies
      $g \circ f = \mathrm{id}_A$ while $h : B \to A$ satisfies
      $f \circ h = \mathrm{id}_B$. Prove that $g = h$, and conclude that $f$ is
      invertible.
    answer: >
      Both $g$ and $h$ are functions $B \to A$, so the domain and codomain
      clauses of equality already match and only the values are in question.
      Compute in one chain: $g = g \circ \mathrm{id}_B = g \circ (f \circ h) =
      (g \circ f) \circ h = \mathrm{id}_A \circ h = h$. Each step is a named
      fact. The first and last use neutrality of the identity — on the right by
      $\mathrm{id}_B$, on the left by $\mathrm{id}_A$, and these are two
      different functions, which is why neutrality has to be stated as two
      equations. The second and fourth substitute the hypotheses. The middle step
      is associativity, and without it $g \circ (f \circ h)$ and
      $(g \circ f) \circ h$ are merely two expressions with no reason to agree.
      Since $g = h$, this single function satisfies both defining equations at
      once, so it is a two-sided inverse and $f$ is invertible. The same chain
      applied to any two two-sided inverses shows the inverse is unique, which is
      what makes the notation $f^{-1}$ unambiguous.
    rubric:
      - >
        Names associativity as the step that converts $g \circ (f \circ h)$ into
        $(g \circ f) \circ h$ — the chain does not close without it.
      - >
        Uses neutrality on both sides and distinguishes $\mathrm{id}_A$ from
        $\mathrm{id}_B$ rather than treating "the identity" as one object.
      - >
        Establishes $g = h$ first, and only then concludes that the common
        function is a two-sided inverse.
    targets:
      - foundations.functions.def-inverse
    exercises:
      - foundations.functions.def-composition
      - foundations.functions.def-identity
      - foundations.functions.composition-associative
    connects: []
    tags: []

  - id: functions-def-inverse-02
    kind: work
    difficulty: standard
    statement: >
      Let $f : \{1,2,3,4,5\} \to \{1,2,3,4,5\}$ be given by $f(1) = 4$,
      $f(2) = 5$, $f(3) = 1$, $f(4) = 3$, $f(5) = 2$, and let $g$ be its
      two-sided inverse. Compute $g(3) + g(5)$.
    answer: >
      $6$. First, an inverse exists: the values $4,5,1,3,2$ are distinct and
      between them exhaust the codomain, so $f$ pairs the set with itself
      perfectly. The defining equations $g \circ f = \mathrm{id}$ and
      $f \circ g = \mathrm{id}$ say that $g$ sends each value back to the input it
      came from, so $g$ is read off the same table backwards. From $f(4) = 3$ we
      get $g(3) = 4$, and from $f(2) = 5$ we get $g(5) = 2$. The sum is
      $4 + 2 = 6$. The slip the problem is built around is reading the table
      forwards, which gives $f(3) + f(5) = 1 + 2 = 3$ — the right arithmetic on
      the wrong function.
    expects: "6"
    rubric:
      - >
        Reads the table backwards: $g(b)$ is the input whose value is $b$, not
        the value at $b$.
      - >
        Checks first that $f$ is a bijection, so that the inverse being asked for
        exists at all.
    targets:
      - foundations.functions.def-inverse
    exercises: []
    connects: []
    tags: []

  - id: functions-inverse-iff-bijection-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove the harder half of the theorem: if $f : A \to B$ is bijective then
      $f$ has a two-sided inverse. Say explicitly which half of bijectivity
      supplies which clause of the definition of a function.
    answer: >
      Define a rule $g$ on $B$ by: for $b \in B$, let $g(b)$ be an $a \in A$ with
      $f(a) = b$. The work is in checking that this rule *is* a function
      $B \to A$, and each of the two clauses comes from one half of bijectivity.
      Surjectivity says that for every $b \in B$ there is at least one such $a$,
      which is totality — no input of $g$ is left without a value. Injectivity
      says there is at most one, since $f(a) = f(a') = b$ forces $a = a'$; that is
      single-valuedness — no input of $g$ gets two values. With $g$ a genuine
      function, both equations follow immediately. For $a \in A$: $g(f(a))$ is by
      construction the unique element that $f$ sends to $f(a)$, and $a$ is such an
      element, so $g(f(a)) = a$ and $g \circ f = \mathrm{id}_A$. For $b \in B$:
      $f(g(b)) = b$ holds by the defining property of $g(b)$, so
      $f \circ g = \mathrm{id}_B$. Hence $g$ is a two-sided inverse. Both
      equations were needed: each alone is strictly weaker, and corresponds to
      only one half of the hypothesis.
    rubric:
      - >
        Pairs surjectivity with totality of $g$ and injectivity with
        single-valuedness of $g$ — checking that the rule is a function is the
        load-bearing step, not verifying the equations.
      - >
        Verifies both $g \circ f = \mathrm{id}_A$ and $f \circ g = \mathrm{id}_B$
        rather than one of them.
      - >
        Does not assume $g$ exists and then check it works; the existence is what
        bijectivity buys.
    targets:
      - foundations.functions.inverse-iff-bijection
    exercises:
      - foundations.functions.def-bijective
      - foundations.functions.def-inverse
      - foundations.functions.def-function
    connects: []
    tags: []

  - id: functions-inverse-iff-bijection-02
    kind: work
    difficulty: standard
    statement: >
      Let $f : \mathbb{R} \to \mathbb{R}$ be $f(x) = 3 - 5x$, which is bijective,
      so $f^{-1}$ exists. Compute $f^{-1}(f^{-1}(3))$.
    answer: >
      $3/5$. Solve $f(x) = y$ once and for all: $3 - 5x = y$ gives $x = (3-y)/5$.
      The fact that this equation has *exactly one* solution for every $y$ is the
      bijectivity the theorem trades for the inverse — one solution for each $y$
      is existence from surjectivity and uniqueness from injectivity. So
      $f^{-1}(y) = (3-y)/5$. Then $f^{-1}(3) = 0/5 = 0$, and applying the same
      formula again, $f^{-1}(0) = 3/5$. Two wrong turns are worth naming:
      applying $f$ twice instead gives $f(f(3)) = f(-12) = 63$, and treating
      $f^{-1}$ as a reciprocal would give $1/f(x)$, which is not an inverse
      function at all.
    expects: "3/5"
    rubric:
      - >
        Derives the formula $f^{-1}(y) = (3-y)/5$ by solving $f(x) = y$, and says
        why the solution is unique.
      - >
        Applies $f^{-1}$ twice, not $f$ twice, and does not read $f^{-1}$ as a
        reciprocal.
    targets:
      - foundations.functions.inverse-iff-bijection
    exercises:
      - foundations.functions.def-inverse
    connects: []
    tags: []

  - id: functions-inverse-iff-bijection-03
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four functions has a two-sided inverse. Which?
    answer: >
      The map $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = 4 - n$. Injective:
      $4 - a = 4 - b$ gives $a = b$. Surjective: for any $m \in \mathbb{Z}$ the
      integer $4 - m$ lies in the domain and $f(4-m) = m$. Bijective, so the
      theorem hands over an inverse — here $f$ is its own inverse. The other
      three are instructive because each fails exactly one half, and two of them
      carry the *same rule* with different declarations. On $\mathbb{Z}$ the cube
      map is injective but misses $2$; on $\mathbb{R}$ the same rule is a
      bijection, so the failure is in the declaration, not the formula.
      Similarly $x \mapsto x^{2}$ is surjective onto $[0,\infty)$ and not
      injective on $\mathbb{R}$, while the same rule restricted to $[0,\infty)$
      and landing in $\mathbb{R}$ is injective and not surjective. Invertibility
      is a property of the triple.
    choices:
      - text: >
          $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = 4 - n$
        correct: true
        feedback: >
          Injective and surjective on $\mathbb{Z}$; applying it twice returns
          every integer to itself, so it is its own inverse.
      - text: >
          $f : \mathbb{Z} \to \mathbb{Z}$ with $f(n) = n^{3}$
        feedback: >
          Injective, but the fiber over $2$ is empty since $2$ is not the cube of
          an integer. A left inverse exists; a two-sided one does not.
      - text: >
          $f : \mathbb{R} \to [0,\infty)$ with $f(x) = x^{2}$
        feedback: >
          Surjective onto $[0,\infty)$, but $f(-1) = f(1)$, so no function can
          undo it on the left.
      - text: >
          $f : [0,\infty) \to \mathbb{R}$ with $f(x) = x^{2}$
        feedback: >
          Injective on $[0,\infty)$, but every negative real has an empty fiber,
          so no function can undo it on the right.
    rubric:
      - >
        Tests both halves for each candidate rather than stopping at the first
        one that holds.
      - >
        Attributes the two $x^{2}$ failures to the declared domain and codomain,
        not to the rule, and likewise for the cube map on $\mathbb{Z}$ against
        $\mathbb{R}$.
    targets:
      - foundations.functions.inverse-iff-bijection
    exercises:
      - foundations.functions.def-bijective
    connects: []
    tags: []

  - id: functions-inverse-of-composite-01
    kind: work
    difficulty: demanding
    statement: >
      Let $f, g : \mathbb{R} \to \mathbb{R}$ be the bijections $f(x) = 2x + 3$
      and $g(x) = x^{3}$. Compute $(g \circ f)^{-1}(64)$.
    answer: >
      $1/2$. The composite of two bijections is a bijection, and its inverse
      reverses the order: $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$ — undo the map
      that acted last, first. So apply $g^{-1}$ to $64$, giving $4$ since
      $4^{3} = 64$, and then $f^{-1}$ to $4$, which solves $2x + 3 = 4$ and gives
      $x = 1/2$. Checking forwards confirms it: $f(1/2) = 4$ and $g(4) = 64$.
      Taking the maps in the other order gives $g^{-1}(f^{-1}(64)) =
      g^{-1}(61/2)$, a different number entirely — and in the general setting,
      where $f : A \to B$ and $g : B \to C$ with three different sets,
      $g^{-1} \circ f^{-1}$ is not even a legal composite.
    expects: "1/2"
    rubric:
      - >
        Applies $g^{-1}$ before $f^{-1}$, matching
        $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$.
      - >
        Verifies the answer by pushing it forward through $g \circ f$, rather
        than trusting the order.
    targets:
      - foundations.functions.inverse-of-composite
    exercises:
      - foundations.functions.def-composition
      - foundations.functions.inverse-iff-bijection
    connects: []
    tags: []

  - id: functions-inverse-of-composite-02
    kind: decide
    difficulty: standard
    statement: >
      Let $f : A \to B$ and $g : B \to C$ be bijections between three pairwise
      different sets. Which of these expressions is a function $C \to A$?
    answer: >
      $f^{-1} \circ g^{-1}$. Track the sets: $g^{-1} : C \to B$ and
      $f^{-1} : B \to A$, and since the notation runs right to left the composite
      $f^{-1} \circ g^{-1}$ starts in $C$, passes through $B$ and ends in $A$. It
      is also, by the corollary, exactly $(g \circ f)^{-1}$. The reversal is
      therefore not a mnemonic but a legality condition: written in the other
      order, $g^{-1} \circ f^{-1}$ would have to begin by applying $f^{-1}$,
      whose domain is $B$ and not $C$, so the expression never gets started. When
      $A$, $B$ and $C$ all coincide both orders are defined and the wrong one is
      still wrong, because inverses are unique and only one of the two satisfies
      the defining equations.
    choices:
      - text: >
          $f^{-1} \circ g^{-1}$
        correct: true
        feedback: >
          $C \to B$ then $B \to A$; it is $(g \circ f)^{-1}$, socks off after
          shoes.
      - text: >
          $g^{-1} \circ f^{-1}$
        feedback: >
          The inner map $f^{-1}$ has domain $B$, not $C$, so the composite cannot
          be formed at all.
      - text: >
          $f \circ g$
        feedback: >
          $g$ has domain $B$; and its codomain $C$ is not the domain $A$ of $f$,
          so this is doubly ill-formed.
      - text: >
          $g \circ f^{-1}$
        feedback: >
          $f^{-1} : B \to A$, and $g$ wants an input from $B$, not from $A$.
    rubric:
      - >
        Checks the domain and codomain of each expression rather than
        pattern-matching on the symbols.
      - >
        States that the reversed order is illegal here, and that uniqueness of
        inverses is what rules it out even when all three sets coincide.
    targets:
      - foundations.functions.inverse-of-composite
    exercises:
      - foundations.functions.def-composition
    connects: []
    tags: []

  - id: functions-one-sided-inverses-01
    kind: work
    difficulty: demanding
    statement: >
      Let $f : \{1,2,3\} \to \{1,2,3,4,5\}$ be $f(n) = 2n - 1$. How many left
      inverses does $f$ have?
    answer: >
      $9$. The values are $f(1) = 1$, $f(2) = 3$, $f(3) = 5$, all distinct, so
      $f$ is injective and left inverses exist. A left inverse is a function
      $g : \{1,2,3,4,5\} \to \{1,2,3\}$ with $g(f(n)) = n$ for every $n$, which
      pins exactly three of $g$'s five values: $g(1) = 1$, $g(3) = 2$,
      $g(5) = 3$. The inputs $2$ and $4$ are not values of $f$, so the equation
      says nothing whatever about $g(2)$ and $g(4)$; each may be any of the three
      elements of the codomain independently, giving $3^{2} = 9$ left inverses.
      This is why a left inverse is not written $f^{-1}$ — it is far from unique,
      and it becomes unique only when $f$ is also surjective and there is no
      unconstrained territory left. As for the other side, $f$ has no right
      inverse at all: $f \circ g$ can never send $2$ to $2$, since $2$ is not a
      value of $f$.
    expects: "9"
    rubric:
      - >
        Recognises that the equation constrains $g$ only on the range of $f$, and
        counts the free inputs as the two elements outside it.
      - >
        Gives each free input all three values of the codomain, for $3^{2}$, and
        does not confuse this with the number of injections.
    targets:
      - foundations.functions.one-sided-inverses
    exercises:
      - foundations.functions.def-injective
    connects: []
    tags: []

  - id: functions-one-sided-inverses-02
    kind: decide
    difficulty: standard
    statement: >
      Let $f : A \to B$ with $A \ne \emptyset$. Which statement is true for every
      such $f$?
    answer: >
      That having both a left and a right inverse forces the two to coincide and
      $f$ to be bijective. A left inverse exists exactly when $f$ is injective
      and a right inverse exactly when $f$ is surjective, so having both is
      having both adjectives, which is bijectivity; and the standard chain
      $g = g \circ \mathrm{id}_B = g \circ (f \circ h) = (g \circ f) \circ h = h$
      shows the two are the same function, which is then the two-sided inverse.
      The other statements each fail in an instructive way. Left inverses are not
      unique: the equation $g \circ f = \mathrm{id}_A$ constrains $g$ only on the
      range of $f$, so an injective non-surjective $f$ has many. Right inverses
      do not come for free: choosing an element of each fiber is possible only
      when no fiber is empty, which is surjectivity, and for an infinite codomain
      the choosing itself is an appeal to the axiom of choice. And the two sides
      are not interchangeable — left goes with injective, right with surjective.
    choices:
      - text: >
          If $f$ has both a left inverse and a right inverse then the two are
          equal and $f$ is bijective
        correct: true
        feedback: >
          Both kinds at once means injective and surjective, and the associativity
          chain collapses the two functions into one.
      - text: >
          A left inverse, when it exists, is unique
        feedback: >
          Off the range of $f$ a left inverse is completely unconstrained, so an
          injective non-surjective $f$ has many.
      - text: >
          Every $f$ has a right inverse, since one can pick an element of each
          fiber
        feedback: >
          Only non-empty fibers admit a pick. A non-surjective $f$ has an empty
          fiber and no right inverse whatsoever.
      - text: >
          $f$ has a left inverse exactly when $f$ is surjective
        feedback: >
          The sides are swapped: left inverses match injectivity, right inverses
          match surjectivity.
    rubric:
      - >
        Matches left with injective and right with surjective, in that pairing.
      - >
        Explains non-uniqueness of a one-sided inverse by the freedom off the
        range of $f$, rather than treating it as an oversight in the definition.
    targets:
      - foundations.functions.one-sided-inverses
    exercises:
      - foundations.functions.def-injective
      - foundations.functions.def-surjective
    connects: []
    tags: []

  # --- sequences and the two counting theorems --------------------------------

  - id: functions-def-sequence-01
    kind: work
    difficulty: demanding
    statement: >
      A finite sequence of length $5$ in the set $\{0,1\}$ is a function
      $x : \{1,2,3,4,5\} \to \{0,1\}$. How many such sequences have range exactly
      $\{0,1\}$?
    answer: >
      $30$. Read as functions, there are $2^{5} = 32$ sequences in all: five
      independent choices of term, one per index. The range is a subset of
      $\{0,1\}$, and it fails to be the whole of $\{0,1\}$ exactly when one of
      the two values is never taken — which happens for the constant sequence
      $0,0,0,0,0$ and for the constant sequence $1,1,1,1,1$, and for nothing
      else. So the count is $32 - 2 = 30$. The number is worth staring at: $30$
      *different* sequences share the single range $\{0,1\}$. The sequence
      records order and repetition and the range does not, which is the whole
      reason for defining a sequence as a function rather than as a set of terms.
    expects: "30"
    rubric:
      - >
        Counts sequences as functions on the index set, giving $2^{5}$, rather
        than counting subsets of $\{0,1\}$.
      - >
        Removes exactly the two constant sequences, and reads the answer as many
        sequences sharing one range.
    targets:
      - foundations.functions.def-sequence
    exercises:
      - foundations.functions.def-range
    connects: []
    tags: []

  - id: functions-def-sequence-02
    kind: decide
    difficulty: standard
    statement: >
      The sequence $x : \{1,2,\dots,6\} \to \mathbb{Z}$ has terms
      $2, 5, 2, 5, 2, 5$. Which statement is correct?
    answer: >
      That $x$ is a function with a six-element domain whose range $\{2,5\}$ has
      two elements. The sequence is the function itself, which records six
      index-value pairs; the range is the *set* of values it takes, so repeats
      collapse and only $2$ and $5$ survive. Keeping the two apart is the entire
      novelty of reading a sequence as a function, and it settles the other
      options at once. The list $2,5,2,5,2,5$ is not a set with six elements. The
      sequence is not injective, since $x_1 = x_3$ with $1 \ne 3$ — injectivity
      compares all pairs of indices, not just neighbouring ones. And nothing in
      the definition forbids a term from repeating: a sequence is any function on
      the index set whatsoever.
    choices:
      - text: >
          $x$ is a function with a six-element domain whose range $\{2,5\}$ has
          two elements
        correct: true
        feedback: >
          Six index-value pairs, two values — the domain and the range are
          counted separately and neither determines the other.
      - text: >
          The range of $x$ is $\{2,5,2,5,2,5\}$, which has six elements
        feedback: >
          A range is a set, so repeated values collapse; six is the size of the
          domain.
      - text: >
          $x$ is injective, because consecutive terms differ
        feedback: >
          Injectivity compares every pair of indices: $x_1 = x_3 = 2$ with
          $1 \ne 3$.
      - text: >
          $x$ is not a sequence, since a sequence may not repeat a term
        feedback: >
          Nothing in the definition forbids repetition — a sequence is any
          function on the index set.
    rubric:
      - >
        Distinguishes the sequence, a function on the index set, from its range,
        a set of values.
      - >
        Tests injectivity across all index pairs rather than only adjacent ones.
    targets:
      - foundations.functions.def-sequence
    exercises:
      - foundations.functions.def-range
    connects: []
    tags: []

  - id: functions-pigeonhole-01
    kind: work
    difficulty: demanding
    statement: >
      Let $B = \{1,2,3,4,5\}$. What is the smallest $m$ such that *every*
      function $f : A \to B$ with $|A| = m$ has some $b \in B$ whose fiber
      $f^{-1}(\{b\})$ contains at least $3$ elements?
    answer: >
      $11$. The generalized pigeonhole principle says that for any $f : A \to B$
      with $|A| = m$ and $|B| = 5$ some fiber has at least $m/5$ elements, hence
      at least the least integer $\ge m/5$. That bound first reaches $3$ at
      $m = 11$, since $11/5 = 2.2$ rounds up to $3$ while $10/5 = 2$ rounds up to
      $2$. So $m = 11$ suffices. It is also smallest, and showing that needs the
      other direction: at $m = 10$ there is a function whose five fibers each hold
      exactly $2$ elements, and it has no fiber of size $3$, so the guarantee
      fails at $10$. The quantifier is the whole problem — pigeonhole is a
      statement about *every* function, so a single well-behaved $f$ at $m = 10$
      is enough to rule that value out.
    expects: "11"
    rubric:
      - >
        Uses the generalized form: some fiber has at least the least integer
        $\ge m/5$, not merely two elements somewhere.
      - >
        Proves minimality by exhibiting a balanced function at $m = 10$ with all
        fibers of size $2$, rather than stopping once a sufficient $m$ is found.
    targets:
      - foundations.functions.pigeonhole
    exercises:
      - foundations.functions.def-preimage
    connects: []
    tags: []

  - id: functions-pigeonhole-02
    kind: justify
    difficulty: demanding
    statement: >
      Let $n \ge 1$ and let $X$ be any set of $n+1$ integers chosen from
      $\{1,2,\dots,2n\}$. Prove that two elements of $X$ are consecutive
      integers.
    answer: >
      Partition $\{1,2,\dots,2n\}$ into the $n$ blocks $\{1,2\}, \{3,4\}, \dots,
      \{2n-1,2n\}$, and define $f : X \to \{1,2,\dots,n\}$ by
      $f(k) = \lceil k/2 \rceil$, the index of the block containing $k$. This is
      a genuine function: every $k$ in the domain lies in exactly one block. Now
      $|X| = n+1 > n = |\{1,\dots,n\}|$, so pigeonhole says $f$ is not injective:
      some block index $j$ has two distinct elements $k \ne k'$ of $X$ in its
      fiber. Both then lie in the block $\{2j-1, 2j\}$, which has exactly two
      elements, so $\{k,k'\} = \{2j-1, 2j\}$ and the two are consecutive. Two
      details carry the argument. Pigeonhole names no particular block — it
      asserts only that *some* fiber is crowded, which is all that is needed —
      and the blocks must have size exactly two, or two elements sharing a block
      would not have to be adjacent. The bound is sharp: the $n$ odd numbers
      $1, 3, \dots, 2n-1$ contain no consecutive pair, so $n+1$ cannot be lowered.
    rubric:
      - >
        Builds an explicit function from the chosen set to a set of $n$ blocks,
        so that pigeonhole applies to a genuine function rather than to an
        informal grouping.
      - >
        Concludes only that *some* fiber has two elements, without naming which
        block.
      - >
        Uses that each block has exactly two elements to turn "same block" into
        "consecutive", and notes the sharpness with the odd numbers.
    targets:
      - foundations.functions.pigeonhole
    exercises:
      - foundations.functions.def-injective
      - foundations.functions.def-preimage
    connects: []
    tags: []

  - id: functions-pigeonhole-03
    kind: decide
    difficulty: standard
    statement: >
      Let $|A| = 40$, $|B| = 9$, and let $f : A \to B$ be any function. Which
      conclusion is guaranteed?
    answer: >
      Some fiber has at least $5$ elements. The generalized pigeonhole gives a
      fiber of size at least the least integer $\ge 40/9$, and $40/9$ lies
      between $4$ and $5$, so that integer is $5$. The reasoning behind the bound
      is a contradiction on the sum: the nine fibers partition $A$ and their sizes
      add to $40$, so if every fiber had at most $4$ elements the total would be
      at most $36 < 40$. The bound cannot be pushed to $6$, because nine fibers of
      size at most $5$ can hold $45$ elements and so a function with maximum fiber
      size $5$ exists. And pigeonhole never speaks about every fiber, nor about
      surjectivity: with $40$ inputs for $9$ values, being onto is easy — it is
      injectivity that is impossible.
    choices:
      - text: >
          Some fiber $f^{-1}(\{b\})$ has at least $5$ elements
        correct: true
        feedback: >
          Nine fibers of size at most $4$ would hold at most $36$ elements, one
          short of $40$.
      - text: >
          Some fiber has at least $6$ elements
        feedback: >
          Not forced: nine fibers of size $5$ hold $45 \ge 40$, so a function
          whose largest fiber is $5$ exists.
      - text: >
          Every fiber has at least $4$ elements
        feedback: >
          Pigeonhole bounds one fiber from below and never all of them; a fiber
          here may even be empty.
      - text: >
          $f$ is not surjective
        feedback: >
          Having more inputs than values makes surjectivity easy, not
          impossible. What $40 > 9$ rules out is injectivity.
    rubric:
      - >
        Computes the least integer $\ge 40/9$ and justifies it by the sum of the
        fiber sizes, not by rounding alone.
      - >
        Claims the bound for *some* fiber, and does not upgrade it to every fiber
        or to a statement about surjectivity.
    targets:
      - foundations.functions.pigeonhole
    exercises:
      - foundations.functions.def-preimage
    connects: []
    tags: []

  - id: functions-finite-inj-surj-equiv-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $A$ and $B$ be finite with $|A| = |B| = n$ and let $f : A \to B$ be
      surjective. Prove that $f$ is injective. Then exhibit a surjective
      non-injective function from an infinite set to itself, and say which step
      of your proof it breaks.
    answer: >
      The fibers $f^{-1}(\{b\})$, one for each of the $n$ elements $b \in B$, are
      pairwise disjoint and cover $A$: every $a \in A$ has a value $f(a)$ by
      totality, so it lies in some fiber, and only one, by single-valuedness. So
      the $n$ fiber sizes are non-negative integers summing to $|A| = n$.
      Surjectivity says each fiber is non-empty, so each size is at least $1$.
      But $n$ integers each at least $1$ and summing to $n$ must all equal $1$
      exactly — any size of $2$ would force another to be $0$. Hence no fiber has
      two elements, and that is injectivity. Infinite counterexample: let
      $g : \mathbb{Z} \to \mathbb{Z}$ be $g(n) = \lfloor n/3 \rfloor$. It is
      surjective, since $g(3m) = m$ for every $m$, and not injective, since
      $g(0) = g(1) = 0$. The step it breaks is the counting one: there are now
      infinitely many fibers and no finite total to constrain them, so a fiber of
      size $3$ costs no other fiber anything. The partition step survives
      untouched — it never used finiteness — which is why the theorem is a
      counting fact and not a fact about functions.
    rubric:
      - >
        Says why the fibers partition $A$, attributing "at least one fiber" to
        totality and "at most one" to single-valuedness.
      - >
        Runs the argument on the fiber *sizes* — $n$ integers each $\ge 1$
        summing to $n$ — rather than on the elements.
      - >
        Locates the failure in the infinite case at the summing step, not at the
        partition.
    targets:
      - foundations.functions.finite-inj-surj-equiv
    exercises:
      - foundations.functions.def-injective
      - foundations.functions.def-surjective
      - foundations.functions.def-preimage
    connects: []
    tags: []

  - id: functions-finite-inj-surj-equiv-02
    kind: decide
    difficulty: standard
    statement: >
      Let $|A| = |B| = 12$ and let $f : A \to B$ be a function with
      $|f^{-1}(\{b_0\})| = 3$ for some $b_0 \in B$. Which follows?
    answer: >
      That $f$ is neither injective nor surjective. The crowded fiber kills
      injectivity directly: three distinct inputs share the value $b_0$. And
      because $|A| = |B|$ is finite, the theorem makes the two conditions
      equivalent, so failing one fails the other — $f$ cannot be surjective
      either. The count confirms it without appealing to the theorem: three of
      the twelve inputs are spent on $b_0$, leaving only nine inputs to cover the
      remaining eleven elements of $B$, so at least two of them have empty
      fibers. That agreement between the two routes is the content of the
      theorem, and it is exactly what fails for infinite sets, where a single
      crowded fiber costs nothing.
    choices:
      - text: >
          $f$ is neither injective nor surjective
        correct: true
        feedback: >
          The crowded fiber rules out injectivity, and for finite sets of equal
          size that rules out surjectivity too.
      - text: >
          $f$ is not injective, but it may still be surjective
        feedback: >
          With three inputs on $b_0$, only nine remain for the other eleven
          values, so at least two values are missed.
      - text: >
          $f$ is surjective, since a fiber that large shows the map is spread out
        feedback: >
          A large fiber is evidence of collapse, not of coverage — it means
          inputs are being used up on one value.
      - text: >
          Nothing follows without knowing the other fiber sizes
        feedback: >
          The equal-size theorem is precisely what turns this one local fact into
          a global conclusion.
    rubric:
      - >
        Uses the equal-size hypothesis to transfer the failure of injectivity to
        surjectivity, rather than treating them as independent.
      - >
        Backs the conclusion with the count — nine inputs left for eleven values
        — and notes that finiteness is what the argument needs.
    targets:
      - foundations.functions.finite-inj-surj-equiv
    exercises:
