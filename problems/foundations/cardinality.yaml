# Problems targeting foundations.cardinality — equinumerosity, countability,
# the two diagonal arguments, and cardinal comparison.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson has just handed over, and a `standard` or `routine`
# one so the unit test has something fair to ask. Every `work` and `decide`
# problem is machine-checked; `justify` is reserved for the proofs, where the
# rubric is the whole instrument. No problem here reuses a lesson's worked
# example or a card's instance. See ../README.md.

problems:
  # --- equinumerosity ---------------------------------------------------------

  - id: cardinality-def-equinumerous-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that the open interval $(0,1)$ is equinumerous with the whole of
      $\mathbb{R}$, by exhibiting a map and verifying both halves of the
      definition of a bijection.
    answer: >
      Take $f : (0,1) \to \mathbb{R}$ with
      $f(x) = \tan\left(\pi x - \dfrac{\pi}{2}\right)$. For $0 < x < 1$ the
      argument $\pi x - \pi/2$ runs over $(-\pi/2, \pi/2)$, where $\tan$ is
      defined, so $f$ is defined on all of $(0,1)$ and its values are real.
      Injective: $\tan$ is strictly increasing on $(-\pi/2, \pi/2)$ and
      $x \mapsto \pi x - \pi/2$ is strictly increasing, so $f$ is strictly
      increasing, and a strictly increasing map cannot repeat a value.
      Surjective: given $y \in \mathbb{R}$, put
      $x = \dfrac{\arctan(y)}{\pi} + \dfrac{1}{2}$; since
      $-\pi/2 < \arctan(y) < \pi/2$ we get $0 < x < 1$, and $f(x) = y$ by
      construction. Both halves hold, so $f$ is a bijection and
      $(0,1) \approx \mathbb{R}$. If a proof without trigonometry is wanted,
      $g(x) = \dfrac{2x-1}{x(1-x)}$ serves: it is strictly increasing on
      $(0,1)$, so injective, and it is continuous with values tending to
      $-\infty$ at $0$ and to $+\infty$ at $1$, so the intermediate value
      theorem supplies every real as a value. The moral is the one the
      definition was built for — a bounded interval and an unbounded line are
      the same size, because length is not what equinumerosity measures.
    rubric:
      - >
        Produces one explicit map, and checks first that it is defined on the
        whole of $(0,1)$ and lands in $\mathbb{R}$.
      - >
        Proves injectivity by an argument that rules out every repeat — strict
        monotonicity, or solving $f(x) = f(y)$ — not by inspection of a picture.
      - >
        Proves surjectivity by naming, for an arbitrary $y \in \mathbb{R}$, a
        preimage inside $(0,1)$ (or by continuity plus the two limits), rather
        than stopping once the map is shown injective.
    targets:
      - foundations.cardinality.def-equinumerous
    exercises:
      - foundations.functions.def-bijective
    connects: []
    tags: []

  - id: cardinality-def-equinumerous-02
    kind: work
    difficulty: standard
    statement: >
      Exactly one increasing map of the form $f(x) = ax + b$ carries the
      interval $[2,6]$ onto the interval $[5,11]$, witnessing
      $[2,6] \approx [5,11]$. What is $f(5)$?
    answer: >
      $9.5$. An increasing map onto $[5,11]$ must send the left endpoint to the
      left endpoint and the right to the right, so $f(2) = 5$ and $f(6) = 11$.
      That fixes the slope as the ratio of the two lengths,
      $a = \dfrac{11-5}{6-2} = \dfrac{6}{4} = \dfrac{3}{2}$, and then
      $b = 5 - \dfrac{3}{2} \cdot 2 = 2$, so $f(x) = \dfrac{3}{2}x + 2$ and
      $f(5) = 7.5 + 2 = 9.5$. It is worth seeing why this is a bijection and not
      merely a formula: $a \ne 0$ makes it injective, since $ax + b = ay + b$
      forces $x = y$, and every $y \in [5,11]$ is hit by
      $x = \dfrac{2(y-2)}{3}$, which lies in $[2,6]$. The two intervals have
      different lengths and exactly the same number of points.
    expects: "9.5"
    rubric:
      - >
        Matches endpoint to endpoint — increasing and onto forces $f(2) = 5$ and
        $f(6) = 11$ — rather than guessing a slope.
      - >
        Evaluates at $5$, not at an endpoint: the answer is $9.5$, and $11$ is
        the value at $6$.
    targets:
      - foundations.cardinality.def-equinumerous
    exercises: []
    connects: []
    tags: []

  - id: cardinality-def-equinumerous-03
    kind: decide
    difficulty: routine
    statement: >
      Let $A = \{1,2,3,4\}$ and $B = \{p,q,r,s\}$. Which of the four
      prescriptions below is a bijection $A \to B$, and so witnesses
      $|A| = |B|$?
    answer: >
      The bijection is $1 \mapsto q$, $2 \mapsto s$, $3 \mapsto p$,
      $4 \mapsto r$: all four inputs receive a value, the four values are
      distinct, and between them they exhaust $B$. Each of the others fails one
      of the three checks that a candidate must survive. Sending $1$ and $3$
      both to $p$ repeats a value, so the map is not injective, and it
      consequently misses $q$ as well — on finite sets of equal size the two
      failures always arrive together, which is the pigeonhole principle at
      work. Sending $3$ and $4$ both to $q$ fails in the same way, missing $p$.
      A prescription that assigns nothing to $4$ is not a function on $A$ at
      all, so the question of bijectivity does not arise. Run the checks in that
      order — defined everywhere, injective, onto — before calling anything a
      bijection.
    choices:
      - text: >
          $1 \mapsto q$, $2 \mapsto s$, $3 \mapsto p$, $4 \mapsto r$
        correct: true
        feedback: >
          Four distinct values covering all of $B$: injective and onto, so
          $|A| = |B|$.
      - text: >
          $1 \mapsto p$, $2 \mapsto r$, $3 \mapsto p$, $4 \mapsto s$
        feedback: >
          Not injective — $1$ and $3$ share the value $p$ — and as a consequence
          $q$ is never hit.
      - text: >
          $1 \mapsto s$, $2 \mapsto r$, $3 \mapsto q$, $4 \mapsto q$
        feedback: >
          Not injective: $3$ and $4$ both land on $q$, and $p$ is left out.
      - text: >
          $1 \mapsto p$, $2 \mapsto q$, $3 \mapsto r$, with $4$ left unassigned
        feedback: >
          This is not a function on $A$: a function must give every element of
          the domain exactly one value before bijectivity can be discussed.
    rubric:
      - >
        Checks injectivity and surjectivity separately, and rejects the
        prescription that is not a function on all of $A$.
      - >
        Names the repeated value in each rejected row, rather than dismissing it
        on appearance.
    targets:
      - foundations.cardinality.def-equinumerous
    exercises:
      - foundations.functions.def-bijective
    connects: []
    tags: []

  # --- an infinite set matches a proper part of itself -------------------------

  - id: cardinality-intuition-proper-subset-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $[0,1] \approx [0,1)$ — a closed interval is equinumerous with
      the half-open interval obtained by deleting one of its endpoints.
    answer: >
      Deleting a point cannot be repaired by moving finitely many things, so
      find a countably infinite ladder inside $[0,1]$ that starts at the doomed
      point and shift along it. Put $a_n = \dfrac{1}{n+1}$ for
      $n \in \mathbb{N}$, so $a_0 = 1$, $a_1 = \dfrac{1}{2}$,
      $a_2 = \dfrac{1}{3}$, and every $a_n$ lies in $[0,1]$. Define
      $h : [0,1] \to [0,1)$ by $h(a_n) = a_{n+1}$ for each $n$, and $h(x) = x$
      for every other $x$. Values land in $[0,1)$: the shifted values are
      $a_1, a_2, \dots$, all at most $1/2$, and a fixed $x$ is neither $1$ nor
      any $a_n$, so $x < 1$. Injective: the two clauses have disjoint images,
      since the first outputs only points of the ladder and the second only
      points off it, and each clause is injective on its own piece —
      $a_{n+1} = a_{m+1}$ forces $n = m$. Surjective: a point of $[0,1)$ that
      is not on the ladder is its own preimage; a ladder point $a_{n+1}$ is
      $h(a_n)$; and $a_0 = 1$ is the one ladder point absent from $[0,1)$,
      which is exactly what was to be deleted. So $h$ is a bijection and the
      closed interval has as many points as the half-open one. This is
      Hilbert's hotel performed inside $[0,1]$: only an infinite set can absorb
      the loss of an element, and the ladder is what supplies the room.
    rubric:
      - >
        Identifies an explicit countably infinite sequence inside $[0,1]$ whose
        first term is the point being deleted, rather than trying to move only
        finitely many points.
      - >
        Checks injectivity *across* the two clauses — a shifted value never
        collides with a fixed one — and not merely within each clause.
      - >
        Confirms surjectivity onto $[0,1)$ by naming a preimage for a ladder
        point and for a non-ladder point separately, and observes that $1$ is
        the only value omitted.
    targets:
      - foundations.cardinality.intuition-proper-subset
    exercises:
      - foundations.cardinality.def-equinumerous
    connects: []
    tags: []

  - id: cardinality-intuition-proper-subset-02
    kind: work
    difficulty: standard
    statement: >
      A hotel has rooms numbered $0, 1, 2, \dots$ and every room is occupied.
      Five new guests arrive, so each occupant of room $n$ moves to room
      $n + 5$. Later infinitely many more arrive, so each occupant of the room
      $m$ he is then in moves to room $2m$. Which room does the guest who began
      in room $7$ finish in?
    answer: >
      $24$. The first move sends him from room $7$ to room $7 + 5 = 12$, and the
      second sends him from room $12$ to room $2 \cdot 12 = 24$; the composite
      is $n \mapsto 2(n+5)$, and $2 \cdot 12 = 24$. Both moves are legitimate
      because each is injective, so no two guests are ever asked to share: after
      the first, the occupied rooms are $5, 6, 7, \dots$ and rooms $0$ through
      $4$ are free for the five arrivals; after the second, the original
      occupants fill the even rooms from $10$ upwards and the five earlier
      arrivals fill the even rooms $0$ through $8$, so every odd room stands
      free for the infinitely many new guests. Answering $14$ applies the doubling to
      the original room number instead of the current one, and answering $17$
      adds $5$ after doubling; the order of the two moves is part of the data.
    expects: "24"
    rubric:
      - >
        Applies the second move to the room the guest occupies *after* the
        first, giving $2(7+5)$ and not $2 \cdot 7 + 5$.
      - >
        Notes that each move is injective, which is what keeps the hotel
        habitable — the freed rooms are what house the newcomers.
    targets:
      - foundations.cardinality.intuition-proper-subset
    exercises: []
    connects: []
    tags: []

  # --- equinumerosity as an equivalence ---------------------------------------

  - id: cardinality-equinumerosity-equivalence-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $\approx$ is reflexive, symmetric and transitive, naming for
      each the fact about functions that carries the argument. Then explain why
      this does not license calling $\approx$ an equivalence relation in the
      technical sense, and what is lost as a result.
    answer: >
      Reflexivity: $\mathrm{id}_A : A \to A$ is injective, since $x = y$
      whenever $x$ and $y$ have the same image, and surjective, since every $x$
      is its own image; so $A \approx A$. Symmetry: if $f : A \to B$ is a
      bijection then $f$ has an inverse $f^{-1} : B \to A$, and the inverse of a
      bijection is a bijection — $f^{-1}$ is injective because $f$ is a
      function, and surjective because $f$ is defined on all of $A$; so
      $B \approx A$. Transitivity: if $f : A \to B$ and $g : B \to C$ are
      bijections then $g \circ f$ is injective, because
      $g(f(x)) = g(f(y))$ gives $f(x) = f(y)$ by injectivity of $g$ and then
      $x = y$ by injectivity of $f$, and surjective, because any $c \in C$ is
      $g(b)$ for some $b$ by surjectivity of $g$ and that $b$ is $f(a)$ for some
      $a$ by surjectivity of $f$; so $A \approx C$. What fails is not any of the
      three properties but the word "relation": a relation is a set of ordered
      pairs drawn from a set, and there is no set of all sets for $\approx$ to
      live on. So its equivalence classes are proper classes, not sets, and the
      usual manufacture of the objects being classified — take the quotient, let
      a cardinal number *be* a class — is unavailable. Cardinals have to be
      produced some other way, by choosing a canonical representative such as
      the least ordinal of that size.
    rubric:
      - >
        Attaches the right fact to each property: the identity for reflexivity,
        the inverse of a bijection for symmetry, the composite of bijections for
        transitivity.
      - >
        For transitivity, argues injectivity and surjectivity of $g \circ f$
        separately rather than asserting that a composite of bijections is a
        bijection.
      - >
        Locates the caveat correctly — no set of all sets, hence no relation and
        no quotient set — rather than claiming one of the three properties
        fails.
    targets:
      - foundations.cardinality.equinumerosity-equivalence
    exercises:
      - foundations.functions.inverse-iff-bijection
      - foundations.functions.composition-inj-surj
    connects: []
    tags: []

  - id: cardinality-equinumerosity-equivalence-02
    kind: work
    difficulty: standard
    statement: >
      Write $3\mathbb{Z}$ for the multiples of $3$. The maps
      $u : \mathbb{Z} \to \mathbb{Z}$ with $u(k) = k - 4$ and
      $v : \mathbb{Z} \to 3\mathbb{Z}$ with $v(m) = -3m$ are both bijections, so
      $\mathbb{Z} \approx \mathbb{Z}$ and $\mathbb{Z} \approx 3\mathbb{Z}$, and
      transitivity of $\approx$ is witnessed by their composite. What is
      $(v \circ u)(9)$?
    answer: >
      $-15$. Transitivity is proved by composing, and composition is applied
      right to left: first $u(9) = 9 - 4 = 5$, then $v(5) = -3 \cdot 5 = -15$.
      Each factor really is a bijection. The shift $u$ has inverse
      $k \mapsto k + 4$. The map $v$ is injective, since $-3m = -3m'$ forces
      $m = m'$, and onto $3\mathbb{Z}$, since a multiple of $3$ is $3t$ and
      $v(-t) = 3t$; its inverse is $j \mapsto -j/3$, which lands in
      $\mathbb{Z}$ precisely because the domain is $3\mathbb{Z}$ and not
      $\mathbb{Z}$. So the composite $v \circ u$ is a bijection
      $\mathbb{Z} \to 3\mathbb{Z}$, exhibiting $\mathbb{Z} \approx 3\mathbb{Z}$
      — an infinite set equinumerous with a proper subset of itself, obtained
      here for free from transitivity. Order matters:
      $(u \circ v)(9) = u(-27) = -31$, a different number, so the composite that
      proves $A \approx C$ from $A \approx B$ and $B \approx C$ has to be
      assembled in the right order.
    expects: "-15"
    rubric:
      - >
        Applies $u$ first and $v$ second, as $v \circ u$ demands — the answer is
        $-15$, while $-31$ is the other order.
      - >
        Treats the composite as the witness of transitivity rather than
        re-deriving a bijection from scratch.
    targets:
      - foundations.cardinality.equinumerosity-equivalence
    exercises: []
    connects: []
    tags: []

  # --- finiteness -------------------------------------------------------------

  - id: cardinality-def-finite-01
    kind: work
    difficulty: demanding
    statement: >
      Let $A = \{(a,b) \in \mathbb{Z} \times \mathbb{Z} : |a| + |b| \le 2\}$.
      The definition of finiteness asks for an integer $n$ with
      $A \approx \{1, \dots, n\}$. What is that $n$?
    answer: >
      $n = 13$. Sort the lattice points by the value of $|a| + |b|$. The value
      $0$ is achieved only by $(0,0)$: one point. For each $k \ge 1$ the points
      with $|a| + |b| = k$ form a diamond with $4k$ points — the four vertices
      $(\pm k, 0)$ and $(0, \pm k)$, together with the $4(k-1)$ points having
      both coordinates nonzero, since $|a|$ may be any of $1, \dots, k-1$ and
      each of $a$ and $b$ then has two possible signs. So the layer $k = 1$
      contributes $4$ points and the layer $k = 2$ contributes $8$, giving
      $1 + 4 + 8 = 13$. Listing them in any order at all is a bijection onto
      $\{1, \dots, 13\}$, which is what the definition asks for. The count $25$
      comes from solving $|a| \le 2$ and $|b| \le 2$ separately, which describes
      a square rather than a diamond and admits twelve further points — the
      eight with $|a| + |b| = 3$ and the four with $|a| + |b| = 4$, among them
      $(2,2)$. That $n$ is unique — no other $m$ has $A \approx \{1, \dots, m\}$ —
      is the pigeonhole principle, and it is what makes $|A| = 13$ well defined
      rather than merely one available label.
    expects: "13"
    rubric:
      - >
        Counts the diamond $|a| + |b| \le 2$ and not the square
        $\max(|a|,|b|) \le 2$, so the twelve points with $|a| + |b| \ge 3$ —
        $(2,2)$ among them — are excluded.
      - >
        Says why the answer is a cardinality and not just a count: the $n$ with
        $A \approx \{1, \dots, n\}$ is unique, by pigeonhole.
    targets:
      - foundations.cardinality.def-finite
    exercises:
      - foundations.cardinality.def-equinumerous
      - foundations.functions.pigeonhole
    connects: []
    tags: []

  - id: cardinality-def-finite-02
    kind: decide
    difficulty: routine
    statement: >
      Exactly one of the following sets is finite in the sense of the
      definition — equinumerous with $\{1, \dots, n\}$ for some
      $n \ge 0$. Which?
    answer: >
      The finite one is $\{n \in \mathbb{N} : n^{2} < 10^{6}\}$. Squaring is
      increasing on $\mathbb{N}$, so the condition $n^{2} < 10^{6}$ says exactly
      $n < 1000$, and the set is $\{0, 1, \dots, 999\}$, equinumerous with
      $\{1, \dots, 1000\}$ by $n \mapsto n+1$. Being large is not being
      infinite. The rationals strictly between $0$ and $1$ are infinite: the
      numbers $1/(n+2)$ for $n \in \mathbb{N}$ are distinct and all lie in the
      interval, so no bijection with any $\{1, \dots, n\}$ exists. The primes
      are infinite by Euclid's argument. And $\mathcal{P}(\mathbb{N})$ contains
      the distinct singletons $\{0\}, \{1\}, \{2\}, \dots$, so it too is
      infinite — spectacularly so, as Cantor's theorem will show.
    choices:
      - text: >
          $\{n \in \mathbb{N} : n^{2} < 10^{6}\}$
        correct: true
        feedback: >
          The condition is $n < 1000$, so the set is $\{0, \dots, 999\}$ — large
          but finite, with cardinality $1000$.
      - text: >
          $\{q \in \mathbb{Q} : 0 < q < 1\}$
        feedback: >
          Bounded is not finite: $1/2, 1/3, 1/4, \dots$ are infinitely many
          distinct elements of this set.
      - text: >
          The set of prime numbers
        feedback: >
          Infinite, by Euclid: no finite list of primes can contain every prime,
          since the product of the list plus one has a prime factor outside it.
      - text: >
          $\mathcal{P}(\mathbb{N})$
        feedback: >
          It already contains one singleton $\{n\}$ for each of infinitely many
          $n$, so it cannot match any $\{1, \dots, n\}$.
    rubric:
      - >
        Separates "bounded" and "large" from "finite" — the interval of
        rationals is bounded and infinite.
      - >
        Reads the defining condition correctly: $n^{2} < 10^{6}$ is $n < 1000$,
        not $n < 10^{6}$.
    targets:
      - foundations.cardinality.def-finite
    exercises: []
    connects: []
    tags: []

  - id: cardinality-finite-pigeonhole-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that if $A$ is finite then every injection $f : A \to A$ is
      surjective. Then show that the statement fails for
      $A = \{2, 3, 4, \dots\}$ by exhibiting an injection that is not
      surjective, and name the property of $A$ that the counterexample is
      exploiting.
    answer: >
      Let $A$ be finite, so there is a bijection $\varphi : A \to
      \{1, \dots, n\}$ for some $n$, and let $f : A \to A$ be injective. Then
      $\varphi \circ f \circ \varphi^{-1}$ is an injection
      $\{1, \dots, n\} \to \{1, \dots, n\}$, and $f$ is surjective if and only
      if that transported map is, so it suffices to treat an initial segment.
      An injection on $\{1, \dots, n\}$ has an image with exactly $n$ elements,
      since distinct inputs give distinct outputs; a subset of an $n$-element
      set with $n$ elements is the whole set, because a proper subset has at
      most $n-1$ elements — that step is the pigeonhole principle. So the image
      is all of $\{1, \dots, n\}$ and the map is surjective. Now take
      $A = \{2, 3, 4, \dots\}$ and $f(k) = k + 1$. It is injective, since
      $k + 1 = m + 1$ forces $k = m$, and it is not surjective, since $2$ is
      never a value: $f(k) = 2$ would need $k = 1 \notin A$. What the
      counterexample exploits is precisely that $A$ is infinite; the equivalence
      is an exact characterisation, so producing an injection of a set into
      itself that misses something *is* a proof that the set is infinite —
      Dedekind-infinite, in the vocabulary of the theorem.
    rubric:
      - >
        Transports the problem to $\{1, \dots, n\}$ along the bijection supplied
        by finiteness, instead of treating $A$ as though it were already an
        initial segment.
      - >
        Uses pigeonhole in the load-bearing step: an $n$-element subset of an
        $n$-element set is the whole set.
      - >
        Gives an explicit injection on the infinite set and names the value it
        misses, rather than asserting that infinite sets have room.
    targets:
      - foundations.cardinality.finite-pigeonhole
    exercises:
      - foundations.cardinality.def-finite
    connects: []
    tags: []

  - id: cardinality-finite-pigeonhole-02
    kind: decide
    difficulty: standard
    statement: >
      A set is Dedekind-infinite when it is equinumerous with a proper subset of
      itself. Exactly one of the sets below is Dedekind-infinite. Which?
    answer: >
      The set of prime numbers. It is infinite, and the theorem says infinite
      and Dedekind-infinite coincide; concretely, list the primes in increasing
      order as $p_0 = 2, p_1 = 3, p_2 = 5, \dots$ and send $p_n$ to $p_{n+1}$.
      That map is injective and its image is the set of primes with $2$
      removed, a proper subset, so the primes are equinumerous with a proper
      part of themselves. The other three are finite, and a finite set can never
      do this: $\mathcal{P}(\{1,2,3,4\})$ has $16$ elements,
      $\{n \in \mathbb{N} : n \le 10^{100}\}$ has $10^{100} + 1$, and the
      distinct letters of MATHEMATICS number eight. For a finite set, an injection into itself is
      forced to be onto, so no proper subset can be matched — that is the
      forward half of the pigeonhole characterisation, and it is what makes
      "matches a proper part of itself" a usable test for being infinite rather
      than a curiosity.
    choices:
      - text: >
          The set of prime numbers
        correct: true
        feedback: >
          Send $p_n$ to $p_{n+1}$: injective, and its image omits $2$, so the
          primes match a proper subset of themselves.
      - text: >
          $\mathcal{P}(\{1,2,3,4\})$
        feedback: >
          This has $16$ elements. Finite sets are never Dedekind-infinite —
          pigeonhole forces an injection into itself to be onto.
      - text: >
          $\{n \in \mathbb{N} : n \le 10^{100}\}$
        feedback: >
          Enormous but finite, with $10^{100} + 1$ elements, so an injection of
          it into itself cannot miss anything.
      - text: >
          The set of letters appearing in the word MATHEMATICS
        feedback: >
          A set of eight letters. Size is irrelevant here — what matters is that
          it is finite.
    rubric:
      - >
        Picks the one infinite set, and gives the shift that exhibits the
        bijection with a proper subset.
      - >
        Rejects the finite candidates by the pigeonhole direction of the
        theorem, not by their size.
    targets:
      - foundations.cardinality.finite-pigeonhole
    exercises: []
    connects: []
    tags: []

  # --- countability -----------------------------------------------------------

  - id: cardinality-def-countable-01
    kind: work
    difficulty: demanding
    statement: >
      Let $S$ be the set of natural numbers divisible by neither $2$ nor $3$,
      and let $a_0, a_1, a_2, \dots$ be its elements in increasing order — the
      listing that exhibits $S$ as countably infinite. What is $a_{10}$?
    answer: >
      $31$. Divisibility by $2$ and by $3$ is decided by the residue modulo $6$,
      so the membership pattern repeats with period $6$: of any six consecutive
      naturals $6k, 6k+1, \dots, 6k+5$, exactly the two with residues $1$ and
      $5$ survive. Hence the listing comes in pairs, $a_{2k} = 6k+1$ and
      $a_{2k+1} = 6k+5$, beginning $1, 5, 7, 11, 13, 17, 19, 23, 25, 29,
      31, \dots$. The index $10$ is even with $k = 5$, so
      $a_{10} = 6 \cdot 5 + 1 = 31$. Two slips are worth naming. Counting the
      list from $1$ instead of $0$ shifts everything by one and gives $29$. And
      $0$ must be excluded from $S$, since $0 = 2 \cdot 0$ is divisible by $2$;
      forgetting that also costs one place. The point of the exercise is that
      the bijection $n \mapsto a_n$ from $\mathbb{N}$ to $S$ is a genuine
      formula, not a promise: $S$ is countably infinite with $|S| = \aleph_0$.
    expects: "31"
    rubric:
      - >
        Uses the period-$6$ pattern — residues $1$ and $5$ survive — rather than
        listing terms one at a time and losing count.
      - >
        Indexes from $a_0 = 1$, as the definition of a listing by $\mathbb{N}$
        requires, and excludes $0$ from $S$.
    targets:
      - foundations.cardinality.def-countable
    exercises: []
    connects: []
    tags: []

  - id: cardinality-def-countable-02
    kind: decide
    difficulty: routine
    statement: >
      Exactly one of the sets below has cardinality $\aleph_0$. Which?
    answer: >
      The odd integers. The symbol $\aleph_0$ is reserved for the countably
      *infinite* case, so the answer must be a set that is infinite and can be
      listed by $\mathbb{N}$ without repetition. The odd integers can: define
      $g : \mathbb{N} \to \{\dots, -3, -1, 1, 3, \dots\}$ by $g(2k) = 2k+1$ and
      $g(2k+1) = -(2k+1)$, producing the listing $1, -1, 3, -3, 5, -5, \dots$ in
      which every odd integer appears exactly once. The set
      $\{n \in \mathbb{N} : n < 10^{10}\}$ is finite, with cardinality
      $10^{10}$, and $\emptyset$ is finite with cardinality $0$ — both are
      countable, but neither has cardinality $\aleph_0$, which is the
      distinction the notation is making. And $\mathcal{P}(\mathbb{N})$ is not
      countable at all, by Cantor's theorem.
    choices:
      - text: >
          The set of odd integers
        correct: true
        feedback: >
          Listed as $1, -1, 3, -3, 5, -5, \dots$, each odd integer exactly once,
          so it is in bijection with $\mathbb{N}$.
      - text: >
          $\{n \in \mathbb{N} : n < 10^{10}\}$
        feedback: >
          Finite, of cardinality $10^{10}$. It is countable, but $\aleph_0$
          names the countably infinite case only.
      - text: >
          $\emptyset$
        feedback: >
          Countable, being finite, but its cardinality is $0$, not $\aleph_0$.
      - text: >
          $\mathcal{P}(\mathbb{N})$
        feedback: >
          Uncountable, by Cantor's theorem — strictly larger than $\mathbb{N}$,
          so it has no listing at all.
    rubric:
      - >
        Distinguishes countable from countably infinite: a finite set is
        countable but its cardinality is not $\aleph_0$.
      - >
        Produces a repetition-free listing for the chosen set, rather than
        asserting that it is "obviously as big as $\mathbb{N}$".
    targets:
      - foundations.cardinality.def-countable
    exercises:
      - foundations.cardinality.def-finite
    connects: []
    tags: []

  - id: cardinality-subset-of-countable-01
    kind: justify
    difficulty: demanding
    statement: >
      For an infinite $S \subseteq \mathbb{N}$ the proposition builds
      $f : \mathbb{N} \to S$ by $f(0) = \min S$ and
      $f(n+1) = \min\left(S \setminus \{f(0), \dots, f(n)\}\right)$. Prove that
      $f$ is strictly increasing, that $f(n) \ge n$ for every $n$, and that
      these two facts together force $f$ to be onto $S$.
    answer: >
      Every minimum called for exists: each set being minimised is a subset of
      $\mathbb{N}$, and it is nonempty because $S$ is infinite while only
      finitely many elements have been removed, so the well-ordering principle
      supplies a least element. Strictly increasing: the set minimised at stage
      $n+1$ is $S \setminus \{f(0), \dots, f(n)\}$, a subset of the set
      $S \setminus \{f(0), \dots, f(n-1)\}$ minimised at stage $n$, so
      $f(n+1) \ge f(n)$; and $f(n+1) \ne f(n)$ because $f(n)$ has been removed.
      Hence $f(n+1) > f(n)$. Next, $f(n) \ge n$ by induction: $f(0) \ge 0$
      holds in $\mathbb{N}$, and $f(n+1) > f(n) \ge n$ gives
      $f(n+1) \ge n+1$, since the values are integers. Now surjectivity. Take
      $s \in S$ and suppose $s$ is never a value of $f$. Then $s$ is never
      removed, so at every stage $s$ lies in the set being minimised, giving
      $f(n) \le s$ for every $n$. But $f(s+1) \ge s+1 > s$, a contradiction. So
      $s = f(n)$ for some $n$, and $f$ is a bijection onto $S$ — injective by
      strict increase, onto by the argument just given. The content of the
      result is that a subset of $\mathbb{N}$ has nothing between the two
      options: it is finite, or it is a list.
    rubric:
      - >
        Justifies the existence of each minimum from the well-ordering
        principle, and says where the hypothesis that $S$ is infinite is what
        keeps the set nonempty.
      - >
        Gets strict increase from the two facts that the minimised sets shrink
        and that $f(n)$ has been removed — not from a picture of the list.
      - >
        Derives $f(n) \ge n$ by induction on the strict increase, and uses it to
        bound the search: if $s$ were missed then $f(n) \le s$ for all $n$,
        which $f(s+1) \ge s+1$ contradicts.
    targets:
      - foundations.cardinality.subset-of-countable
    exercises:
      - foundations.induction.well-ordering
      - foundations.induction.def-recursion
    connects: []
    tags: []

  - id: cardinality-subset-of-countable-02
    kind: work
    difficulty: standard
    statement: >
      Let $S \subseteq \mathbb{N}$ be the set of natural numbers that are a
      perfect square or a perfect cube, and let $f(0) < f(1) < f(2) < \dots$ be
      the increasing enumeration of $S$ that the proposition constructs. For
      which index $n$ is $f(n) = 27$?
    answer: >
      $n = 7$. The squares are $0, 1, 4, 9, 16, 25, 36, \dots$ and the cubes are
      $0, 1, 8, 27, 64, \dots$; merging them in increasing order and listing
      each element once gives $f(0) = 0$, $f(1) = 1$, $f(2) = 4$, $f(3) = 8$,
      $f(4) = 9$, $f(5) = 16$, $f(6) = 25$, $f(7) = 27$. So $27$, the cube of
      $3$, occupies index $7$. Two traps are built in. The numbers $0$ and $1$
      are both squares and cubes, and $S$ is a set, so each is listed once;
      counting them twice pushes $27$ out to index $9$. And the enumeration is
      indexed from $0$, as a bijection with $\mathbb{N} = \{0,1,2,\dots\}$
      requires, so starting the count at $1$ gives $8$. Note also that $S$ is an
      infinite subset of $\mathbb{N}$ and this listing is precisely the
      "enumerate in increasing order" recursion, which is what makes $S$
      countably infinite rather than merely countable.
    expects: "7"
    rubric:
      - >
        Merges the two lists into one, listing $0$ and $1$ once each rather than
        twice.
      - >
        Indexes from $f(0) = 0$, which is what a bijection with $\mathbb{N}$
        demands.
    targets:
      - foundations.cardinality.subset-of-countable
    exercises: []
    connects: []
    tags: []

  - id: cardinality-countability-criteria-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $A$ be nonempty and suppose there is a surjection
      $g : \mathbb{N} \to A$. Prove that $A$ is countable, and point out why no
      appeal to the axiom of choice is needed even though a preimage has to be
      picked for every element of $A$ at once.
    answer: >
      Define $h : A \to \mathbb{N}$ by letting $h(a)$ be the least element of
      $g^{-1}(\{a\}) = \{n \in \mathbb{N} : g(n) = a\}$. That set is nonempty
      for every $a$, because $g$ is surjective, so the well-ordering principle
      gives it a least element and $h$ is defined on all of $A$. It is
      injective: if $h(a) = h(b) = n$ then $a = g(n) = b$. So $A$ injects into
      $\mathbb{N}$; therefore $A$ is equinumerous with $h(A)$, a subset of
      $\mathbb{N}$, and every subset of $\mathbb{N}$ is countable, so $A$ is
      countable. As for choice: infinitely many preimages are indeed being
      fixed, one for each $a$, but they are not being *chosen*. The least
      element of a nonempty subset of $\mathbb{N}$ is determined by the set, so
      $h$ is a single definable function, and the whole assignment is one
      application of well-ordering rather than infinitely many independent
      selections. That is the difference between this proof and the proof that a
      countable union of countable sets is countable, where the enumerations
      being selected have no canonical representative and countable choice is
      genuinely required.
    rubric:
      - >
        Defines the injection by the *least* preimage and says why that set is
        nonempty — surjectivity of $g$ — and why a least element exists.
      - >
        Proves injectivity of $h$ from $a = g(h(a))$, rather than asserting that
        distinct elements have distinct preimages.
      - >
        Closes with the subset proposition: an injection into $\mathbb{N}$ makes
        $A$ equinumerous with a subset of $\mathbb{N}$, which is countable.
      - >
        Explains the absence of choice by canonicity — least elements are
        determined, not selected.
    targets:
      - foundations.cardinality.countability-criteria
    exercises:
      - foundations.cardinality.subset-of-countable
      - foundations.induction.well-ordering
    connects: []
    tags: []

  - id: cardinality-countability-criteria-02
    kind: work
    difficulty: standard
    statement: >
      Let $g : \mathbb{N} \to A$ send $n$ to the last decimal digit of $n^{2}$,
      a surjection onto $A = \{0, 1, 4, 5, 6, 9\}$. The proof that a listing
      with repetitions yields an injection sends each $a \in A$ to the least $n$
      with $g(n) = a$. What index does it assign to $6$?
    answer: >
      $4$. Tabulate $g$ on the first few naturals: $g(0) = 0$, $g(1) = 1$,
      $g(2) = 4$, $g(3) = 9$, $g(4) = 6$, $g(5) = 5$, $g(6) = 6$, $g(7) = 9$,
      $g(8) = 4$, $g(9) = 1$, $g(10) = 0$. The digit $6$ first appears at
      $n = 4$, since $4^{2} = 16$, so $6$ is assigned the index $4$. It appears
      again at $n = 6$, because $6^{2} = 36$, and that is exactly why the
      construction says *least*: without it there is no single answer, and
      picking one for each element of $A$ would be a choice rather than a
      definition. The resulting injection is $0 \mapsto 0$, $1 \mapsto 1$,
      $4 \mapsto 2$, $9 \mapsto 3$, $6 \mapsto 4$, $5 \mapsto 5$, which is
      criterion (ii) delivered from criterion (iii).
    expects: "4"
    rubric:
      - >
        Takes the least index, so $6$ receives $4$ and not $6$.
      - >
        Computes the digits from $n^{2}$ rather than from $n$: $g(4) = 6$
        because $4^{2} = 16$.
    targets:
      - foundations.cardinality.countability-criteria
    exercises: []
    connects: []
    tags: []

  # --- the integers, the grid, products ---------------------------------------

  - id: cardinality-z-countable-01
    kind: decide
    difficulty: demanding
    statement: >
      Define $F : \mathbb{Z} \to \mathbb{N}$ by $F(k) = 2k$ for $k \ge 1$ and
      $F(k) = -2k + 1$ for $k \le 0$. Which verdict on $F$ is correct?
    answer: >
      $F$ is injective but not surjective, so it proves $|\mathbb{Z}| \le
      \aleph_0$ and is not itself a bijection. Check the two halves. The first
      clause sends $1, 2, 3, \dots$ to $2, 4, 6, \dots$, all even and positive;
      the second sends $0, -1, -2, \dots$ to $1, 3, 5, \dots$, all odd. Each
      clause is injective, and their images are disjoint, one even and one odd,
      so $F$ is injective. Its values do lie in $\mathbb{N}$: for $k \le 0$ we
      have $-2k \ge 0$, so $-2k + 1 \ge 1$. But the image is exactly the
      positive integers, and $0$ is never a value, so $F$ is not onto
      $\mathbb{N}$. That is a defect of this particular map and not of
      $\mathbb{Z}$: shifting the clauses to $G(k) = 2k - 1$ for $k \ge 1$ and
      $G(k) = -2k$ for $k \le 0$ gives $G(0) = 0$, $G(1) = 1$, $G(-1) = 2$,
      $G(2) = 3$, and this one is a bijection $\mathbb{Z} \to \mathbb{N}$. The
      countability criteria make even the repair unnecessary: an injection into
      $\mathbb{N}$ already proves $\mathbb{Z}$ countable.
    choices:
      - text: >
          $F$ is injective but misses $0$, so it gives $|\mathbb{Z}| \le
          \aleph_0$ without being a bijection onto $\mathbb{N}$
        correct: true
        feedback: >
          The image is the positive integers. An injection into $\mathbb{N}$ is
          already enough for countability, by the criteria.
      - text: >
          $F$ is a bijection $\mathbb{Z} \to \mathbb{N}$, so it witnesses
          $|\mathbb{Z}| = \aleph_0$
        feedback: >
          Nothing maps to $0$: the first clause gives even values at least $2$,
          the second odd values at least $1$.
      - text: >
          $F$ is not injective, since a positive and a non-positive input can
          share a value
        feedback: >
          They cannot — positive inputs give even values and non-positive ones
          give odd values, so the two clauses can never collide.
      - text: >
          $F$ is not a function into $\mathbb{N}$, because $-2k + 1$ is negative
          when $k \le 0$
        feedback: >
          For $k \le 0$, $-2k \ge 0$, so $-2k + 1 \ge 1$. Every value is a
          natural number.
    rubric:
      - >
        Checks the two clauses separately and observes their images are the
        evens and the odds, which settles injectivity.
      - >
        Identifies the exact value omitted, $0$, rather than concluding that
        $\mathbb{Z}$ is bigger than $\mathbb{N}$.
    targets:
      - foundations.cardinality.z-countable
    exercises:
      - foundations.cardinality.def-countable
    connects: []
    tags: []

  - id: cardinality-z-countable-02
    kind: work
    difficulty: standard
    statement: >
      Let $f : \mathbb{N} \to \mathbb{Z}$ be the enumeration $f(n) = n/2$ for
      even $n$ and $f(n) = -(n+1)/2$ for odd $n$. What is $f(23)$?
    answer: >
      $-12$. Since $23$ is odd, the second clause applies:
      $f(23) = -(23+1)/2 = -24/2 = -12$. The inverse confirms the placement: a
      negative integer $k$ sits at index $-2k - 1$, and
      $-2(-12) - 1 = 24 - 1 = 23$. Applying the wrong clause gives $23/2$, which
      is not even an integer and so signals the mistake immediately; forgetting
      the $+1$ inside gives $-11.5$ for the same reason. The design of the map
      is worth restating: even indices carry the non-negative integers in order
      and odd indices carry the negative ones, so the list reads
      $0, -1, 1, -2, 2, \dots$ and every integer receives exactly one index.
    expects: "-12"
    rubric:
      - >
        Selects the clause by the parity of the *index* $23$, not of the value.
      - >
        Includes the $+1$: the answer is $-12$, not $-11.5$ or $-11$.
    targets:
      - foundations.cardinality.z-countable
    exercises: []
    connects: []
    tags: []

  - id: cardinality-nxn-countable-01
    kind: work
    difficulty: demanding
    statement: >
      In the anti-diagonal enumeration of $\mathbb{N} \times \mathbb{N}$ —
      $(0,0)$ at index $0$, then $(1,0), (0,1)$, then $(2,0), (1,1), (0,2)$,
      and so on — the pair at index $38$ is $(m,n)$. What is $m$?
    answer: >
      $m = 6$. The diagonal $m + n = d$ holds $d + 1$ pairs, so the diagonals
      $0$ through $d-1$ together occupy $1 + 2 + \cdots + d = d(d+1)/2$ indices
      and diagonal $d$ begins at index $d(d+1)/2$. For $d = 8$ that is
      $8 \cdot 9/2 = 36$, and diagonal $9$ begins at $9 \cdot 10/2 = 45$, so
      index $38$ lies in diagonal $8$, at offset $38 - 36 = 2$. Within a
      diagonal the pairs run $(d,0), (d-1,1), (d-2,2), \dots$, so offset $2$ is
      $(8-2, 2) = (6,2)$ and $m = 6$. Check with the Cantor pairing function:
      $\pi(6,2) = \dfrac{8 \cdot 9}{2} + 2 = 36 + 2 = 38$. The step that must be
      done carefully is finding the diagonal: the largest $d$ with
      $d(d+1)/2 \le 38$ is $8$, and taking $d = 9$ instead — because
      $9 \cdot 10 / 2 = 45$ exceeds $38$ — puts the pair on the wrong diagonal
      entirely.
    expects: "6"
    rubric:
      - >
        Finds the diagonal by the largest triangular number at most $38$, namely
        $36 = 8 \cdot 9/2$, rather than by counting pairs one at a time.
      - >
        Orders the diagonal correctly — it starts at $(d,0)$ and the second
        coordinate increases — so offset $2$ gives $(6,2)$ and not $(2,6)$.
    targets:
      - foundations.cardinality.nxn-countable
    exercises: []
    connects: []
    tags: []

  - id: cardinality-nxn-countable-02
    kind: work
    difficulty: standard
    statement: >
      The Cantor pairing function is
      $\pi(m,n) = \dfrac{(m+n)(m+n+1)}{2} + n$. What is $\pi(3,1)$?
    answer: >
      $11$. Here $m + n = 4$, so the first term is
      $\dfrac{4 \cdot 5}{2} = 10$ — the number of pairs lying on the diagonals
      $0$ through $3$, which occupy indices $0$ through $9$ — and the second
      term is $n = 1$, the position within diagonal $4$. So
      $\pi(3,1) = 10 + 1 = 11$. Reading it off the listing agrees: diagonal $4$
      starts at index $10$ with $(4,0)$, and $(3,1)$ comes next, at index $11$.
      The two coordinates are not interchangeable, since only $n$ appears in the
      offset: $\pi(1,3) = 10 + 3 = 13$. That the map is a bijection, not merely
      an injection, is what makes $\mathbb{N} \times \mathbb{N}$ countably
      infinite rather than only countable.
    expects: "11"
    rubric:
      - >
        Uses $m+n$ in the triangular term and $n$ alone in the offset, so
        $\pi(3,1) \ne \pi(1,3)$.
      - >
        Cross-checks against the listing: diagonal $4$ opens at index $10$.
    targets:
      - foundations.cardinality.nxn-countable
    exercises: []
    connects: []
    tags: []

  - id: cardinality-product-countable-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $A \times B$ is countable whenever $A$ and $B$ are. Then
      explain why the induction that extends this to any finite product
      $A_1 \times \cdots \times A_k$ gives nothing at all about a product of
      countably many factors, and name a set that shows the extension is false.
    answer: >
      If either factor is empty then $A \times B = \emptyset$, which is finite
      and so countable. Otherwise both are countable and nonempty, so the
      criteria supply surjections $g : \mathbb{N} \to A$ and
      $h : \mathbb{N} \to B$. Then $(m,n) \mapsto (g(m), h(n))$ is a surjection
      $\mathbb{N} \times \mathbb{N} \to A \times B$, since any $(a,b)$ is hit by
      any pair of preimages; composing with a bijection
      $\mathbb{N} \to \mathbb{N} \times \mathbb{N}$ — the zig-zag — gives a
      surjection $\mathbb{N} \to A \times B$, and the criteria conclude that
      $A \times B$ is countable. Induction on $k$ then handles
      $A_1 \times \cdots \times A_k$, treating it as
      $(A_1 \times \cdots \times A_{k-1}) \times A_k$. What induction proves is
      a statement about every natural number $k$, and "countably many factors"
      is not a natural number: no stage of the induction ever reaches an
      infinite product, and there is no limit step available to take. The
      extension is not merely unproved but false. The set $\{0,1\}^{\mathbb{N}}$
      of all infinite binary sequences is a product of countably many
      two-element sets and is uncountable, by diagonalisation: given any listing
      $s_0, s_1, s_2, \dots$ of such sequences, the sequence whose $i$-th entry
      is $1 - s_i(i)$ differs from every $s_i$ and so is missing from the list.
    rubric:
      - >
        Handles the empty factor separately, since the listing criterion needs a
        nonempty set to supply a surjection.
      - >
        Builds a surjection $\mathbb{N} \times \mathbb{N} \to A \times B$ and
        composes with the zig-zag bijection, invoking the criteria rather than
        constructing a bijection by hand.
      - >
        Says why induction stops at finite $k$ — every stage is a natural
        number, and there is no limit stage — instead of claiming the infinite
        case is merely harder.
      - >
        Names an explicit uncountable countable-product, such as
        $\{0,1\}^{\mathbb{N}}$, and says how diagonalisation defeats a listing
        of it.
    targets:
      - foundations.cardinality.product-countable
    exercises:
      - foundations.cardinality.nxn-countable
      - foundations.cardinality.countability-criteria
    connects: []
    tags: []

  - id: cardinality-product-countable-02
    kind: work
    difficulty: standard
    statement: >
      The map $(m,n,p) \mapsto 2^{m} 3^{n} 5^{p}$ is an injection
      $\mathbb{N}^{3} \to \mathbb{N}$, which by the countability criteria is
      already enough to make $\mathbb{N}^{3}$ countable. What is the image of
      $(2,1,3)$?
    answer: >
      $1500$. Compute the three factors and multiply:
      $2^{2} = 4$, $3^{1} = 3$ and $5^{3} = 125$, so
      $4 \cdot 3 \cdot 125 = 12 \cdot 125 = 1500$. Injectivity is uniqueness of
      prime factorisation: the exponents of $2$, $3$ and $5$ in $1500$ can be
      read back off as $2, 1, 3$, so no other triple has the same image. The map
      is nowhere near surjective — $7$, for instance, is not a value — and that
      is the point of the criteria: an injection into $\mathbb{N}$ suffices, and
      hunting for a bijection is wasted work. Multiplying the bases instead of
      exponentiating, $2 \cdot 3 \cdot 5 = 30$, or adding the exponents, would
      destroy injectivity, since the recovery of the triple depends on the
      primes being raised to those exact powers.
    expects: "1500"
    rubric:
      - >
        Raises each prime to its own exponent and multiplies:
        $4 \cdot 3 \cdot 125$, not $2 \cdot 3 \cdot 5$ or $2 \cdot 1 \cdot 3$.
      - >
        Attributes injectivity to unique factorisation and notes that
        surjectivity is not needed.
    targets:
      - foundations.cardinality.product-countable
    exercises: []
    connects: []
    tags: []

  # --- the rationals, countable unions ----------------------------------------

  - id: cardinality-q-countable-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $\mathbb{Q}$ is countably infinite. Then explain why the same
      style of argument does not also make $\mathbb{R}$ countable, given that
      every real number is a limit of rationals.
    answer: >
      The map $\Phi : \mathbb{Z} \times (\mathbb{Z} \setminus \{0\}) \to
      \mathbb{Q}$ with $\Phi(p,q) = p/q$ is surjective, since every rational is
      by definition a quotient of integers with nonzero denominator. Its domain
      is a subset of $\mathbb{Z} \times \mathbb{Z}$, a product of two countable
      sets and therefore countable, and a subset of a countable set is
      countable. So $\mathbb{Q}$ is the image of a countable set under a
      function, which the countability criteria make countable: compose a
      surjection $\mathbb{N} \to \mathbb{Z} \times (\mathbb{Z} \setminus
      \{0\})$ with $\Phi$ to get a listing of $\mathbb{Q}$ with repetitions,
      which is criterion (iii). Finally $\mathbb{Q} \supseteq \mathbb{Z}$ is
      infinite, so it is countably infinite. Why $\mathbb{R}$ escapes: the
      argument needs a *countable* set of finite data with one datum for each
      element, and a pair of integers is such a datum. A real number has no
      finite datum of this kind. It is a limit of a sequence of rationals, but
      the set of all sequences of rationals is a product of countably many
      countable sets, which is exactly the case where countability fails, so
      "surjection from the sequences onto $\mathbb{R}$" is a surjection from an
      uncountable set and proves nothing. Density is a fact about the order on
      the line and has no bearing on size — the countability of $\mathbb{Q}$ and
      the uncountability of $\mathbb{R}$ coexist precisely because of that.
    rubric:
      - >
        Uses a surjection from a countable set onto $\mathbb{Q}$, rather than
        attempting to build a bijection $\mathbb{N} \to \mathbb{Q}$ by hand, and
        cites the criterion that makes a surjective image countable.
      - >
        Checks that the domain is countable — a subset of a product of two
        countable sets — and excludes the zero denominator.
      - >
        Separates "infinite" from "countable": notes $\mathbb{Z} \subseteq
        \mathbb{Q}$ to upgrade countable to countably infinite.
      - >
        Locates the failure for $\mathbb{R}$ in the passage from finitely many
        integers to an infinite sequence of them, not in density.
    targets:
      - foundations.cardinality.q-countable
    exercises:
      - foundations.cardinality.product-countable
      - foundations.cardinality.z-countable
      - foundations.cardinality.countability-criteria
    connects: []
    tags: []

  - id: cardinality-q-countable-02
    kind: work
    difficulty: standard
    statement: >
      List the rationals in $(0,1)$ in lowest terms by increasing denominator,
      and within a denominator by increasing numerator: $1/2$; then
      $1/3, 2/3$; then $1/4, 3/4$; then $1/5, 2/5, 3/5, 4/5$; and so on.
      Counting from index $0$, what index does $3/5$ receive?
    answer: >
      $7$. The denominator $q$ contributes the fractions $p/q$ with
      $1 \le p < q$ and $\gcd(p,q) = 1$, so it contributes $\varphi(q)$ entries:
      $\varphi(2) = 1$, $\varphi(3) = 2$, $\varphi(4) = 2$ — the fraction $2/4$
      is not in lowest terms and has already appeared as $1/2$ — and
      $\varphi(5) = 4$. The list therefore reads $1/2$ at index $0$, $1/3$ at
      $1$, $2/3$ at $2$, $1/4$ at $3$, $3/4$ at $4$, and then the denominator
      $5$ block begins at index $5$: $1/5$ at $5$, $2/5$ at $6$, $3/5$ at $7$.
      Including $2/4$ would push the answer to $8$, and counting the list from
      $1$ would give $8$ as well; the enumeration has to be by $\mathbb{N}$
      starting at $0$ and has to list each rational once. This listing is a
      genuine bijection $\mathbb{N} \to \mathbb{Q} \cap (0,1)$, which is more
      than the countability proof needs but makes the conclusion concrete.
    expects: "7"
    rubric:
      - >
        Drops the fractions that are not in lowest terms, so the denominator $4$
        block is $1/4, 3/4$ and not $1/4, 2/4, 3/4$.
      - >
        Indexes from $0$ and counts the earlier blocks before entering the
        denominator $5$ block.
    targets:
      - foundations.cardinality.q-countable
    exercises: []
    connects: []
    tags: []

  - id: cardinality-countable-union-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that if $I$ is countable and every $A_i$ is countable then
      $\bigcup_{i \in I} A_i$ is countable. Say exactly which step needs the
      axiom of countable choice, and why a union of finitely many countable sets
      needs no such appeal.
    answer: >
      Discard the empty $A_i$, which change nothing, and use an injection
      $I \to \mathbb{N}$ to assume $I \subseteq \mathbb{N}$. For each $i \in I$
      the set $A_i$ is countable and nonempty, so the criteria say the set
      $E_i$ of surjections $\mathbb{N} \to A_i$ is nonempty. Select one
      $f_i \in E_i$ for each $i$. Then $(i,n) \mapsto f_i(n)$ is a surjection
      from a subset of $\mathbb{N} \times \mathbb{N}$ onto the union: any
      element of the union lies in some $A_i$ and so equals $f_i(n)$ for some
      $n$. Since $\mathbb{N} \times \mathbb{N}$ is countable, so is any subset
      of it, and a surjective image of a countable set is countable; hence the
      union is countable. The load-bearing step is the word "select". Nothing in
      the hypotheses distinguishes one surjection onto $A_i$ from another —
      unlike a least preimage in $\mathbb{N}$, an enumeration of an abstract
      countable set has no canonical representative — so a single choice
      function on the family $(E_i)_{i \in I}$ of nonempty sets is being
      asserted to exist. That is the axiom of countable choice, and the theorem
      is not provable in ZF without it. For finitely many sets the situation is
      different: finitely many existential statements can be instantiated one
      after another, and the resulting finite conjunction is a theorem of ZF by
      induction on the number of sets, so no axiom beyond ZF is used.
    rubric:
      - >
        Builds a surjection from a subset of $\mathbb{N} \times \mathbb{N}$ onto
        the union, and cites the criteria rather than constructing a bijection.
      - >
        Names the choice step precisely — one enumeration selected from each
        $A_i$, simultaneously — and says why no canonical choice is available.
      - >
        Explains the finite case by induction on the number of sets, so that
        finitely many instantiations suffice.
    targets:
      - foundations.cardinality.countable-union
    exercises:
      - foundations.cardinality.nxn-countable
      - foundations.cardinality.countability-criteria
      - foundations.sets.indexed-family
    connects: []
    tags: []

  - id: cardinality-countable-union-02
    kind: work
    difficulty: standard
    statement: >
      For each $i \in \mathbb{N}$ let $A_i = \{i + n(i+1) : n \in \mathbb{N}\}$,
      so that $A_0 = \mathbb{N}$, $A_1 = \{1, 3, 5, \dots\}$,
      $A_2 = \{2, 5, 8, \dots\}$, each listed by the explicit rule
      $f_i(n) = i + n(i+1)$. Flatten the family along the zig-zag, which places
      the pair $(4,1)$ at index $16$. Which element of the union does index
      $16$ carry?
    answer: >
      $9$. The flattening sends the pair $(i,n)$ to $f_i(n)$, so index $16$
      carries $f_4(1) = 4 + 1 \cdot (4+1) = 4 + 5 = 9$. Two things make this
      instance easier than the theorem: the enumerations $f_i$ are given by a
      single formula in $i$ and $n$, so nothing is being chosen and the axiom of
      countable choice is not in play; and the sets overlap heavily — $9$ also
      lies in $A_0$, as $f_0(9) = 9$, and in $A_1$, as $f_1(4) = 9$ — which
      costs nothing, because the flattening only has to be surjective onto the
      union, not injective. Reading the pair in the other order gives
      $f_1(4) = 1 + 4 \cdot 2 = 9$ here by coincidence, but in general
      $f_i(n) \ne f_n(i)$, so the order of the coordinates matters.
    expects: "9"
    rubric:
      - >
        Reads the pair as (index of the set, index within the set) and evaluates
        $f_4(1)$, using the rule $i + n(i+1)$ with $i = 4$ and $n = 1$.
      - >
        Notes that the flattening need only be surjective, so overlaps between
        the $A_i$ do no harm.
    targets:
      - foundations.cardinality.countable-union
    exercises: []
    connects: []
    tags: []

  # --- the reals are uncountable ----------------------------------------------

  - id: cardinality-r-uncountable-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $\Sigma$ be the set of all infinite sequences $(c_0, c_1, c_2, \dots)$
      with every $c_i \in \{1,2\}$. Prove by diagonalisation that $\Sigma$ is
      uncountable, and deduce that $\mathbb{R}$ is uncountable by producing an
      injection $\Sigma \to \mathbb{R}$.
    answer: >
      Suppose $\Sigma$ were countable. It is nonempty, so the criteria give a
      listing $s_0, s_1, s_2, \dots$ of all its elements, repetitions allowed.
      Define $t$ by $t_i = 1$ if $s_i(i) = 2$ and $t_i = 2$ if $s_i(i) = 1$.
      Every $t_i$ lies in $\{1,2\}$, so $t \in \Sigma$ — the diagonal object is
      an object of the kind being listed, which is the first check the technique
      demands. And $t \ne s_i$ for every $i$, since the two disagree in position
      $i$, and two sequences that disagree anywhere are different sequences —
      the second check, which here is free because a sequence *is* its list of
      entries. So $t$ appears nowhere in the listing, contradicting
      completeness; no listing exists and $\Sigma$ is uncountable. Now inject
      $\Sigma$ into $\mathbb{R}$ by $(c_i) \mapsto \sum_{i \ge 0} c_i
      10^{-(i+1)}$, the real number $0.c_0c_1c_2\dots$. The series converges,
      its partial sums being increasing and bounded by $0.2222\dots$, so the
      value is a real number in $[0,1]$; and the map is injective because two
      decimal expansions name the same real only through a tail of nines against
      a tail of zeros, which digits confined to $1$ and $2$ cannot produce.
      Finally, if $\mathbb{R}$ were countable then so would be the image of this
      injection, a subset of $\mathbb{R}$; and $\Sigma$ is equinumerous with
      that image, so $\Sigma$ would be countable. It is not, so $\mathbb{R}$ is
      uncountable.
    rubric:
      - >
        Assumes a listing with repetitions allowed — the criteria's form of
        countability — rather than a bijection, so the contradiction covers
        every countable case.
      - >
        Checks that the diagonal sequence $t$ is itself an element of $\Sigma$
        before using it.
      - >
        Argues that the injection into $\mathbb{R}$ is injective by ruling out
        the nines-against-zeros ambiguity, using the restriction of the digits.
      - >
        Transfers uncountability the right way: a subset of a countable set is
        countable, so an uncountable set injecting into $\mathbb{R}$ makes
        $\mathbb{R}$ uncountable.
    targets:
      - foundations.cardinality.r-uncountable
    exercises:
      - foundations.cardinality.countability-criteria
    connects: []
    tags: []

  - id: cardinality-r-uncountable-02
    kind: work
    difficulty: standard
    statement: >
      A candidate list of numbers in $[0,1]$ begins $f(0) = 0.4071\dots$,
      $f(1) = 0.1502\dots$, $f(2) = 0.9985\dots$, $f(3) = 0.3335\dots$. Cantor's
      construction takes $d_{nn}$, the $n$-th decimal digit of $f(n)$ with
      places counted from $0$, and sets $e_n = 4$ if $d_{nn} = 5$ and
      $e_n = 5$ otherwise. Write the first four digits of the diagonal number as
      the four-digit number $e_0e_1e_2e_3$.
    answer: >
      $5454$. Read the diagonal first. The digits of $f(0)$ are $4, 0, 7, 1$, so
      $d_{00} = 4$; the digits of $f(1)$ are $1, 5, 0, 2$, so $d_{11} = 5$; the
      digits of $f(2)$ are $9, 9, 8, 5$, so $d_{22} = 8$; the digits of $f(3)$
      are $3, 3, 3, 5$, so $d_{33} = 5$. Now apply the rule: $d_{00} = 4 \ne 5$
      gives $e_0 = 5$; $d_{11} = 5$ gives $e_1 = 4$; $d_{22} = 8 \ne 5$ gives
      $e_2 = 5$; $d_{33} = 5$ gives $e_3 = 4$. So the diagonal number begins
      $x = 0.5454\dots$, and the required four-digit number is $5454$. Check
      that it does its job: $x$ differs from $f(0)$ in place $0$ ($5$ against
      $4$), from $f(1)$ in place $1$ ($4$ against $5$), from $f(2)$ in place $2$
      ($5$ against $8$) and from $f(3)$ in place $3$ ($4$ against $5$). The
      common slip is to read the $n$-th digit with places counted from $1$,
      which shifts the whole diagonal and produces a number that may well be on
      the list.
    expects: "5454"
    rubric:
      - >
        Counts decimal places from $0$, so $d_{22}$ is the third digit of
        $f(2)$, namely $8$.
      - >
        Applies the rule in the right direction: $e_n = 4$ only when the
        diagonal digit is $5$, and $e_n = 5$ in every other case.
    targets:
      - foundations.cardinality.r-uncountable
    exercises: []
    connects: []
    tags: []

  - id: cardinality-r-uncountable-03
    kind: decide
    difficulty: standard
    statement: >
      An objection to the diagonal argument runs: "Your recipe produces an
      infinite string of digits. A string of digits is a notation, not a number;
      until you show it names a real number you have produced no witness."
      Which step is the objection aimed at, and what answers it?
    answer: >
      It attacks the legitimacy of the diagonal object, and it is answered by
      convergence. The partial sums of $\sum_{n \ge 0} e_n 10^{-(n+1)}$ increase
      and are bounded above by $\sum_{n \ge 0} 5 \cdot 10^{-(n+1)} = 5/9$, so
      completeness of $\mathbb{R}$ supplies a supremum, and that real number lies
      in $[0,1]$ and has the prescribed digits. The objection is a fair one and
      not a quibble: diagonalisation has exactly two checks that can never be
      skipped, and this is the first — the constructed object must belong to the
      collection being listed. The second check, that differing in one
      coordinate really makes it a different object, is what the restriction of
      the digits to $4$ and $5$ pays for, and it answers a different objection.
      Note also what the objection is not: it is not an attack on the assumption
      that $f$ is surjective, since that assumption is the thing being refuted,
      and switching to base $2$ would make matters worse, since binary
      expansions collide more readily than decimal ones.
    choices:
      - text: >
          It attacks the claim that the diagonal object belongs to $[0,1]$ at
          all; the answer is that the series converges, by completeness of
          $\mathbb{R}$
        correct: true
        feedback: >
          Exactly the first of diagonalisation's two checks: the constructed
          object must be an object of the kind being listed.
      - text: >
          It attacks the claim that $x$ differs from every $f(n)$; the answer is
          that the digits are confined to $4$ and $5$
        feedback: >
          That is the second check, and it answers a different objection — that
          two different digit strings might name the same real.
      - text: >
          It attacks the assumption that $f$ is surjective, which the proof has
          no right to make
        feedback: >
          The proof assumes surjectivity in order to refute it. That is a proof
          by contradiction, not an unjustified assumption.
      - text: >
          It attacks the use of decimal notation, and is answered by rerunning
          the argument in base $2$
        feedback: >
          Base $2$ makes the expansion ambiguity worse, not better — with only
          two digits available there is no room left to dodge the tail of ones.
    rubric:
      - >
        Identifies the objection as aimed at whether the diagonal object exists
        as a real number, not at whether it differs from the listed numbers.
      - >
        Answers it with the convergence of the digit series and completeness,
        rather than with the choice of digits.
    targets:
      - foundations.cardinality.r-uncountable
    exercises:
      - foundations.real.completeness
    connects: []
    tags: []

  # --- comparing cardinalities -------------------------------------------------

  - id: cardinality-def-cardinal-comparison-01
    kind: justify
    difficulty: demanding
    statement: >
      Show that $|A| \le |B|$ is a statement about cardinalities and not about
      the particular sets: if $A \approx A'$ and $B \approx B'$ and there is an
      injection $A \to B$, produce an injection $A' \to B'$. Then show that the
      strict relation $|A| < |B|$ transfers in the same way.
    answer: >
      Let $u : A' \to A$ and $v : B \to B'$ be bijections — they exist because
      equinumerosity is symmetric — and let $f : A \to B$ be injective. Then
      $v \circ f \circ u : A' \to B'$ is injective, being a composite of
      injections: if $v(f(u(x))) = v(f(u(y)))$ then $f(u(x)) = f(u(y))$ since
      $v$ is injective, then $u(x) = u(y)$ since $f$ is, then $x = y$ since $u$
      is. So $|A'| \le |B'|$. For strictness, recall that $|A| < |B|$ means
      $|A| \le |B|$ together with the non-existence of any bijection
      $A \to B$. The first half transfers by what has just been shown. For the
      second, suppose $w : A' \to B'$ were a bijection; then
      $v^{-1} \circ w \circ u^{-1} : A \to B$ is a composite of bijections and
      hence a bijection, contradicting $|A| < |B|$. So no bijection
      $A' \to B'$ exists and $|A'| < |B'|$. The moral is that both clauses of
      the definition are invariant under replacing either set by an equinumerous
      one, which is what entitles one to write $|A| \le |B|$ — a statement about
      two sizes — rather than a statement about two sets.
    rubric:
      - >
        Composes in the correct order, $v \circ f \circ u$, so that the domain
        is $A'$ and the codomain $B'$.
      - >
        Proves the composite injective by unwinding the three injections, rather
        than quoting that composites of injections are injective without saying
        why it applies.
      - >
        Handles the *second* clause of strictness — the non-existence of a
        bijection — by transporting a hypothetical bijection back, not by
        exhibiting an injection that fails to be onto.
    targets:
      - foundations.cardinality.def-cardinal-comparison
    exercises:
      - foundations.cardinality.def-equinumerous
    connects: []
    tags: []

  - id: cardinality-def-cardinal-comparison-02
    kind: decide
    difficulty: standard
    statement: >
      Since $\mathbb{N} \subseteq \mathbb{Q}$, the inclusion is an injection and
      $|\mathbb{N}| \le |\mathbb{Q}|$. Is that inequality strict?
    answer: >
      No: $|\mathbb{N}| = |\mathbb{Q}|$, both being $\aleph_0$. Strictness has
      two clauses, and the second one — that no bijection exists — fails here,
      because $\mathbb{Q}$ is countably infinite and therefore admits a
      bijection with $\mathbb{N}$. That the inclusion misses infinitely many
      rationals is a fact about the inclusion and about nothing else: an
      injection that is not surjective never establishes strictness, since some
      other map may still be a bijection, and here one is. Nor does density
      help; between any two rationals lie infinitely many more, and the size of
      the set is untouched by that. And no appeal to the axiom of choice is
      needed to settle the question, since an explicit enumeration of
      $\mathbb{Q}$ is available.
    choices:
      - text: >
          No — $\mathbb{Q}$ is countably infinite, so a bijection
          $\mathbb{N} \to \mathbb{Q}$ exists and the two cardinalities are equal
        correct: true
        feedback: >
          Strictness requires that *no* bijection exist. One does, so
          $|\mathbb{N}| = |\mathbb{Q}| = \aleph_0$.
      - text: >
          Yes — $\mathbb{N}$ is a proper subset of $\mathbb{Q}$, and a proper
          subset is strictly smaller
        feedback: >
          Only for finite sets. An infinite set is equinumerous with proper
          subsets of itself, which is exactly the lesson of Hilbert's hotel.
      - text: >
          Yes — between any two rationals lie infinitely many more, so
          $\mathbb{Q}$ has strictly more elements
        feedback: >
          Density is a property of the order, not of the size. A countable set
          can be dense, and $\mathbb{Q}$ is.
      - text: >
          It cannot be settled without the axiom of choice
        feedback: >
          An explicit enumeration of $\mathbb{Q}$ is available, so the question
          is settled in ZF outright.
    rubric:
      - >
        Applies the second clause of the definition — no bijection exists — and
        does not read strictness off an injection that fails to be onto.
      - >
        Rejects density as evidence about cardinality.
    targets:
      - foundations.cardinality.def-cardinal-comparison
    exercises: []
    connects: []
    tags: []

  # --- Cantor's theorem --------------------------------------------------------

  - id: cardinality-cantor-theorem-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that for every set $X$ there is no surjection
      $X \to \mathcal{P}(X)$, and conclude that
      $|X| < |\mathcal{P}(X)|$. Then say what the proof delivers in the case
      $X = \emptyset$.
    answer: >
      First the inequality: $x \mapsto \{x\}$ is an injection
      $X \to \mathcal{P}(X)$, since $\{x\} = \{y\}$ forces $x = y$, so
      $|X| \le |\mathcal{P}(X)|$. Now let $f : X \to \mathcal{P}(X)$ be any
      function and put $D = \{x \in X : x \notin f(x)\}$. The condition
      $x \notin f(x)$ is a legitimate test on elements of $X$, since $f(x)$ is a
      subset of $X$, so $D$ is a subset of $X$ and hence an element of
      $\mathcal{P}(X)$ — a member of the codomain, which is what makes it
      eligible to be missed. Suppose $D = f(a)$ for some $a \in X$. Then
      $a \in D$ holds precisely when $a \notin f(a)$, that is precisely when
      $a \notin D$; a statement equivalent to its own negation, which is absurd.
      So $D$ is outside the image and $f$ is not surjective. Since $f$ was
      arbitrary, no surjection exists; in particular no bijection exists, and
      with the injection above that gives $|X| < |\mathcal{P}(X)|$. For
      $X = \emptyset$: $\mathcal{P}(\emptyset) = \{\emptyset\}$ has exactly one
      element, and the only function $\emptyset \to \{\emptyset\}$ is the empty
      function, whose image is empty. The set $D$ is empty, vacuously, and it is
      indeed missed. So the theorem reads $0 < 1$ here — no hypotheses are
      needed anywhere, and for finite $X$ the statement is $n < 2^{n}$.
    rubric:
      - >
        Verifies that $D$ is an element of $\mathcal{P}(X)$ before asking
        whether it is in the image — the step that makes the contradiction
        available.
      - >
        Derives the contradiction from $a \in D \iff a \notin f(a) = D$ for the
        supposed $a$, rather than asserting that $D$ is "clearly" missed.
      - >
        Concludes strictness from both clauses: the singleton injection for
        $\le$, and the absence of a surjection for the absence of a bijection.
      - >
        Reports the empty case correctly: $\mathcal{P}(\emptyset)$ has one
        element and the theorem says $0 < 1$.
    targets:
      - foundations.cardinality.cantor-theorem
    exercises:
      - foundations.cardinality.def-cardinal-comparison
      - foundations.sets.power-set
    connects: []
    tags: []

  - id: cardinality-cantor-theorem-02
    kind: work
    difficulty: standard
    statement: >
      How many elements does $\mathcal{P}(\mathcal{P}(\{a,b\}))$ have?
    answer: >
      $16$. Work outward. The set $\{a,b\}$ has $2$ elements, so
      $\mathcal{P}(\{a,b\}) = \{\emptyset, \{a\}, \{b\}, \{a,b\}\}$ has
      $2^{2} = 4$ elements — one for each way of deciding, for each of $a$ and
      $b$, whether it is in or out. Applying the power set again to a
      $4$-element set gives $2^{4} = 16$. The two common wrong answers are $8$,
      which is $2^{3}$ and comes from miscounting the inner power set as having
      $3$ elements by forgetting $\emptyset$, and $4$, which stops after one
      application. The tower $2 < 4 < 16 < 65536 < \cdots$ is exactly Cantor's
      theorem for finite sets, where it reads $n < 2^{n}$; the content of the
      theorem is that the same strictness holds when the sets are infinite and
      no counting is available.
    expects: "16"
    rubric:
      - >
        Applies the power set twice, computing $2^{2} = 4$ and then
        $2^{4} = 16$, and does not stop at the inner one.
      - >
        Counts $\emptyset$ and the whole set among the subsets at each stage.
    targets:
      - foundations.cardinality.cantor-theorem
    exercises:
      - foundations.sets.power-set
    connects: []
    tags: []

  - id: cardinality-cantor-theorem-03
    kind: decide
    difficulty: demanding
    statement: >
      Take $X = \{1,2,3,4\}$ and the map $f$ with $f(1) = \{2,3\}$,
      $f(2) = \{1,2\}$, $f(3) = \emptyset$ and $f(4) = \{1,3,4\}$. Which row
      correctly gives the set $D = \{x \in X : x \notin f(x)\}$ that Cantor's
      proof builds from this $f$, together with the right reading of what it
      shows?
    answer: >
      $D = \{1,3\}$. Test the four elements one at a time. Is $1 \in f(1) =
      \{2,3\}$? No, so $1 \in D$. Is $2 \in f(2) = \{1,2\}$? Yes, so
      $2 \notin D$. Is $3 \in f(3) = \emptyset$? No, so $3 \in D$. Is
      $4 \in f(4) = \{1,3,4\}$? Yes, so $4 \notin D$. Hence $D = \{1,3\}$, and
      the image of $f$ is $\{\{2,3\}, \{1,2\}, \emptyset, \{1,3,4\}\}$, which
      indeed does not contain $\{1,3\}$ — the proof delivers a specific witness,
      not merely an existence claim. Nothing here depends on $f$ being
      well chosen: the same recipe defeats any of the $16^{4}$ maps
      $X \to \mathcal{P}(X)$, and it must, because $|\mathcal{P}(X)| = 16$
      exceeds $|X| = 4$ and no function from a $4$-element set can cover $16$
      values. The common error is to collect the $x$ with $x \in f(x)$, which
      returns the complement $\{2,4\}$; that set happens also to be outside the
      image here, but for no reason that generalises.
    choices:
      - text: >
          $D = \{1,3\}$, and it lies outside the image of $f$, exactly as the
          proof guarantees
        correct: true
        feedback: >
          The image is $\{\{2,3\}, \{1,2\}, \emptyset, \{1,3,4\}\}$, and
          $\{1,3\}$ is not among those four.
      - text: >
          $D = \{2,4\}$, and it lies outside the image of $f$
        feedback: >
          That is the complement — the set of $x$ with $x \in f(x)$. The
          definition collects the $x$ that are *not* in $f(x)$.
      - text: >
          $D = \emptyset$, since $f(3) = \emptyset$
        feedback: >
          $f(3) = \emptyset$ makes $3$ a member of $D$, because $3 \notin
          \emptyset$. It does not make $D$ empty.
      - text: >
          $D = \{1,3,4\}$, which is in the image, so Cantor's theorem fails for
          finite $X$
        feedback: >
          $4 \in f(4) = \{1,3,4\}$, so $4 \notin D$. The theorem holds for
          finite $X$ too, where it reads $n < 2^{n}$.
    rubric:
      - >
        Tests each $x$ against its own image $f(x)$ and collects the failures of
        membership, not the successes.
      - >
        Confirms that the resulting $D$ is absent from the four listed values of
        $f$, which is the theorem's conclusion made concrete.
    targets:
      - foundations.cardinality.cantor-theorem
    exercises: []
    connects: []
    tags: []

  # --- diagonalisation as a technique ------------------------------------------

  - id: cardinality-diagonalisation-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $\mathcal{F}$ be the set of all functions $\mathbb{N} \to \mathbb{N}$.
      Prove by diagonalisation that $\mathcal{F}$ is uncountable, and name the
      two checks the technique always requires, saying what each one costs in
      this instance.
    answer: >
      Suppose $\mathcal{F}$ were countable. It is nonempty, so the countability
      criteria supply a listing $f_0, f_1, f_2, \dots$ containing every element,
      repetitions allowed. Define $g : \mathbb{N} \to \mathbb{N}$ by
      $g(n) = f_n(n) + 1$. First check — the diagonal object must be an object
      of the kind being listed. Here $g$ is a function from $\mathbb{N}$ to
      $\mathbb{N}$, because $f_n(n)$ is a natural number and $\mathbb{N}$ is
      closed under adding $1$, so $g \in \mathcal{F}$ and the check costs
      nothing. It would not be free if the codomain were, say, $\{0, \dots, 9\}$:
      then $f_n(n) + 1$ could leave the codomain and the recipe would need
      repair, exactly as the decimal argument repairs itself by choosing between
      the digits $4$ and $5$. Second check — differing in one coordinate must
      really make a different object. Two functions are equal precisely when
      they agree at every input, so $g(n) \ne f_n(n)$ already gives
      $g \ne f_n$, and this check is also free. It is not free for real numbers,
      where two different decimal strings can name the same number, which is
      what the restriction of the digits pays for. So $g$ differs from every
      $f_n$ and is absent from a listing that was supposed to be complete — a
      contradiction. No listing exists, so $\mathcal{F}$ is uncountable.
    rubric:
      - >
        Runs the argument against an *arbitrary* listing, so the conclusion is
        that no enumeration is complete rather than that one particular list was
        badly chosen.
      - >
        Verifies that $g$ belongs to $\mathcal{F}$ before deriving the
        contradiction, and says why the same step needs care with a bounded
        codomain.
      - >
        Justifies $g \ne f_n$ from the criterion for equality of functions, and
        contrasts it with the decimal case where differing in a digit does not
        by itself give a different real.
    targets:
      - foundations.cardinality.diagonalisation
    exercises:
      - foundations.cardinality.countability-criteria
    connects: []
    tags: []

  - id: cardinality-diagonalisation-02
    kind: decide
    difficulty: standard
    statement: >
      A student applies the diagonal recipe to the set $B$ of all *finite*
      binary strings. List them as $s_0, s_1, s_2, \dots$, which is possible
      since $B$ is countable, and build a new object by flipping the $i$-th bit
      of $s_i$ for every $i$. What is the status of the argument?
    answer: >
      The argument fails the first of diagonalisation's two checks: the object
      it constructs is an infinite string of bits, and no infinite string is a
      member of $B$, so no element of $B$ has been shown missing and nothing has
      been contradicted. The failure has a visible symptom as well — a string
      $s_i$ of length less than $i+1$ has no $i$-th bit to flip, so the recipe
      is not even well defined without a convention for padding. And the
      conclusion it seemed to reach is false: $B$ really is countable, listed by
      length and then lexicographically within each length, since there are
      $2^{k}$ strings of length $k$ and each block is finite. Compare the
      successful applications. Reals are determined by an *infinite* digit
      sequence and the diagonal object is again such a sequence; subsets of $X$
      are determined by a membership test on all of $X$ and the diagonal object
      is again such a test. In both, the constructed object lands back in the
      collection, which is precisely what fails here.
    choices:
      - text: >
          It fails: the object built is an infinite string, which is not an
          element of $B$, so no member of $B$ has been shown to be missing
        correct: true
        feedback: >
          The first check of the technique. Diagonalising a list of finite
          objects produces an infinite one, which the list never claimed to
          contain.
      - text: >
          It succeeds, and proves that $B$ is uncountable
        feedback: >
          $B$ is countable — list by length, then lexicographically, since there
          are only $2^{k}$ strings of each length $k$.
      - text: >
          It fails because the listing of $B$ has repetitions, and
          diagonalisation needs a repetition-free list
        feedback: >
          Repetitions are harmless: the criteria allow a listing that repeats,
          and the diagonal object still differs from every entry.
      - text: >
          It fails because flipping a bit need not change the string
        feedback: >
          Flipping does change it. The second check is satisfied here; it is the
          first that fails.
    rubric:
      - >
        Locates the failure in the legitimacy of the diagonal object, not in the
        listing or in the flip.
      - >
        Says why the false conclusion is false — $B$ is countable, by length
        then lexicographic order.
    targets:
      - foundations.cardinality.diagonalisation
    exercises: []
    connects: []
    tags: []

  # --- Schröder–Bernstein and the order on cardinalities -----------------------

  - id: cardinality-schroder-bernstein-01
    kind: justify
    difficulty: demanding
    statement: >
      Use the Schröder–Bernstein theorem to prove that
      $|(0,1)| = |[0,1]|$, exhibiting both injections in full. Then say what the
      theorem has bought, by describing what a direct construction would have
      demanded.
    answer: >
      One way: the inclusion $\iota : (0,1) \to [0,1]$, $\iota(x) = x$, is
      injective, so $|(0,1)| \le |[0,1]|$. The other way: define
      $j : [0,1] \to (0,1)$ by $j(x) = \dfrac{x+1}{3}$. For $0 \le x \le 1$ we
      get $\dfrac{1}{3} \le j(x) \le \dfrac{2}{3}$, so the values lie strictly
      inside $(0,1)$ and $j$ really maps into the open interval; and $j$ is
      injective because $\dfrac{x+1}{3} = \dfrac{y+1}{3}$ forces $x = y$. So
      $|[0,1]| \le |(0,1)|$. Schröder–Bernstein now yields a bijection between
      the two intervals, hence $|(0,1)| = |[0,1]|$. What the theorem bought: a
      direct bijection cannot be continuous or monotone in any convenient way,
      and the standard construction has to pick a countable ladder inside
      $(0,1)$ — say $1/2, 1/3, 1/4, \dots$ — and shift along it twice to absorb
      the two extra endpoints, then check injectivity across the clauses. The
      theorem replaces that piece of design with two one-way estimates, each of
      which is a single formula, and it does so without any appeal to the axiom
      of choice: the proof of Schröder–Bernstein constructs its bijection
      explicitly from $f$ and $g$.
    rubric:
      - >
        Exhibits an injection in each direction and checks that the second one
        lands strictly inside $(0,1)$, which is the only step that can go wrong.
      - >
        Invokes Schröder–Bernstein for the conclusion rather than claiming that
        two injections are "obviously" a bijection.
      - >
        Describes the cost avoided — a shift along a countable ladder to absorb
        the endpoints — and notes that no choice is used.
    targets:
      - foundations.cardinality.schroder-bernstein
    exercises:
      - foundations.cardinality.def-cardinal-comparison
    connects: []
    tags: []

  - id: cardinality-schroder-bernstein-02
    kind: work
    difficulty: standard
    statement: >
      Run the proof's construction with $A = B = \mathbb{N}$, $f(a) = a + 2$ and
      $g(b) = b + 1$: put $C_0 = A \setminus g(B)$, $C_{n+1} = g(f(C_n))$ and
      $C = \bigcup_{n \in \mathbb{N}} C_n$, then $h(a) = f(a)$ for $a \in C$ and
      $h(a) = g^{-1}(a)$ for $a \notin C$. What is $h(6)$?
    answer: >
      $8$. First find $C$. The image $g(B)$ is $\{1, 2, 3, \dots\}$, so
      $C_0 = \mathbb{N} \setminus g(B) = \{0\}$. Then
      $C_1 = g(f(\{0\})) = g(\{2\}) = \{3\}$,
      $C_2 = g(f(\{3\})) = g(\{5\}) = \{6\}$ and
      $C_3 = g(f(\{6\})) = g(\{8\}) = \{9\}$; each step adds $3$, so
      $C_n = \{3n\}$ and $C$ is the set of multiples of $3$. Since $6$ is a
      multiple of $3$ it lies in $C$, so the first clause applies and
      $h(6) = f(6) = 8$. The second clause would have given $5$, which is the
      answer for a number outside $C$: $h(7) = g^{-1}(7) = 6$. It is worth
      checking that $h$ really is a bijection here. On $C$ it produces
      $2, 5, 8, 11, \dots$, the naturals congruent to $2$ modulo $3$; off $C$ it
      produces every other natural, since $a \mapsto a - 1$ carries
      $1, 2, 4, 5, 7, 8, \dots$ onto $0, 1, 3, 4, 6, 7, \dots$. The two ranges
      are disjoint and together exhaust $\mathbb{N}$.
    expects: "8"
    rubric:
      - >
        Computes $C$ before evaluating: the chain gives $C_n = \{3n\}$, so $C$
        is the multiples of $3$ and not just $\{0\}$.
      - >
        Applies the clause that matches — $6 \in C$, so $h(6) = f(6) = 8$, not
        $g^{-1}(6) = 5$.
    targets:
      - foundations.cardinality.schroder-bernstein
    exercises: []
    connects: []
    tags: []

  - id: cardinality-cardinal-order-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $\le$ on cardinalities is reflexive, transitive and
      antisymmetric, naming what supplies each. Then explain in what precise
      sense totality — that any two cardinalities are comparable — is a
      different kind of statement.
    answer: >
      Reflexivity: the identity $A \to A$ is injective, so $|A| \le |A|$.
      Transitivity: if $f : A \to B$ and $g : B \to C$ are injective then so is
      $g \circ f$, since $g(f(x)) = g(f(y))$ gives $f(x) = f(y)$ and then
      $x = y$; so $|A| \le |B|$ and $|B| \le |C|$ give $|A| \le |C|$.
      Antisymmetry: this is exactly the Schröder–Bernstein theorem — injections
      both ways produce a bijection, so $|A| \le |B|$ and $|B| \le |A|$ give
      $|A| = |B|$. All three are theorems of ZF, and together they make $\le$ a
      partial order on cardinalities. Totality is different in kind. The
      statement that for all $A$ and $B$ either $|A| \le |B|$ or $|B| \le |A|$
      is not provable in ZF at all. It follows from the axiom of choice: order
      the partial injections from $A$ to $B$ by extension, note that the union
      of a chain of them is again one, and apply Zorn's lemma to get a maximal
      partial injection; if it were neither defined on all of $A$ nor onto all
      of $B$, an unused element on each side could be paired to extend it,
      contradicting maximality. The implication also runs backwards —
      comparability of all cardinalities implies the axiom of choice — so
      totality is not a small extra convenience but precisely as strong as
      choice, and without it two sets can be genuinely incomparable in size.
    rubric:
      - >
        Attaches antisymmetry to Schröder–Bernstein by name, rather than
        treating it as obvious.
      - >
        Proves transitivity from injectivity of a composite, unwinding the
        implication in the right direction.
      - >
        States that totality is unprovable in ZF and equivalent to the axiom of
        choice, and sketches the Zorn argument including why a maximal partial
        injection cannot omit an element on both sides.
    targets:
      - foundations.cardinality.cardinal-order
    exercises:
      - foundations.cardinality.schroder-bernstein
      - foundations.relations.zorn
    connects: []
    tags: []

  - id: cardinality-cardinal-order-02
    kind: work
    difficulty: standard
    statement: >
      Transitivity of $\le$ is composition of injections. With
      $f : \{1,2,3\} \to \mathbb{N}$ given by $f(k) = 3k + 1$ and
      $g : \mathbb{N} \to \mathbb{N}$ given by $g(n) = 2^{n}$, the chained
      inequality is witnessed by $g \circ f$. What is $(g \circ f)(2)$?
    answer: >
      $128$. Apply $f$ first: $f(2) = 3 \cdot 2 + 1 = 7$. Then apply $g$:
      $g(7) = 2^{7} = 128$. Both factors are injective — $3k+1 = 3m+1$ forces
      $k = m$, and $2^{n} = 2^{m}$ forces $n = m$ since $2^{n}$ is strictly
      increasing — so the composite is injective, which is the whole content of
      transitivity: the witness for $|\{1,2,3\}| \le |\mathbb{N}|$ composed with
      the witness for $|\mathbb{N}| \le |\mathbb{N}|$ is a witness for
      $|\{1,2,3\}| \le |\mathbb{N}|$. Reversing the order gives
      $f(g(2)) = f(4)$, which is not even defined, since $4$ is outside the
      domain of $f$ — a reminder that the composite only exists in one order.
    expects: "128"
    rubric:
      - >
        Applies $f$ before $g$, giving $g(7)$ and not $f(4)$.
      - >
        Says why the composite is injective, since that is what makes it a
        witness for the chained inequality.
    targets:
      - foundations.cardinality.cardinal-order
    exercises: []
    connects: []
    tags: []

  # --- the continuum -----------------------------------------------------------

  - id: cardinality-continuum-cardinality-01
    kind: work
    difficulty: demanding
    statement: >
      The injection $\mathcal{P}(\mathbb{N}) \to \mathbb{R}$ used in the proof
      sends a set $S$ to $\sum_{n \in S} 3^{-(n+1)}$. What real number does
      $S = \{0, 3, 4\}$ map to? Give it as a fraction in lowest terms.
    answer: >
      $85/243$. The three terms are $3^{-1} = \dfrac{1}{3}$,
      $3^{-4} = \dfrac{1}{81}$ and $3^{-5} = \dfrac{1}{243}$ — note the
      exponent is $n+1$, so the element $0$ contributes $3^{-1}$ and not
      $3^{0}$. Over the common denominator $243$ these are
      $\dfrac{81}{243}$, $\dfrac{3}{243}$ and $\dfrac{1}{243}$, summing to
      $\dfrac{85}{243}$; the fraction is already in lowest terms, since
      $85 = 5 \cdot 17$ shares no factor with $243 = 3^{5}$. Read in base $3$
      the answer is $0.10011$, whose digits after the point record the
      membership pattern of $S$ at positions $0, 1, 2, 3, 4$ — which is exactly
      why the map is injective: distinct sets give distinct digit strings, and
      digit strings using only $0$ and $1$ in base $3$ can never collide, since
      a collision needs a tail of the largest digit, here $2$.
    expects: "85/243"
    rubric:
      - >
        Uses the exponent $n+1$, so $0 \in S$ contributes $1/3$ rather than $1$.
      - >
        Adds over a common denominator and reduces, arriving at a fraction whose
        base-$3$ expansion is the membership pattern of $S$.
    targets:
      - foundations.cardinality.continuum-cardinality
    exercises:
      - foundations.sets.power-set
    connects: []
    tags: []

  - id: cardinality-continuum-cardinality-02
    kind: decide
    difficulty: standard
    statement: >
      The other injection in the proof sends $x \in \mathbb{R}$ to
      $\{q \in \mathbb{Q} : q < x\}$. What makes it injective?
    answer: >
      Density. If $x \ne y$, say $x < y$, then some rational $q$ satisfies
      $x < q < y$. That $q$ belongs to $\{r \in \mathbb{Q} : r < y\}$ and not to
      $\{r \in \mathbb{Q} : r < x\}$, so the two sets differ and the map
      separates $x$ from $y$. Nothing else in the setup would do this job: that
      $\mathbb{Q}$ is countable is used later, to convert a subset of
      $\mathbb{Q}$ into a subset of $\mathbb{N}$ along a bijection
      $\mathbb{Q} \to \mathbb{N}$, and it says nothing about injectivity; that
      every real is a limit of rationals is true of all reals at once and
      therefore distinguishes none of them; and that each set attached is
      infinite is true but irrelevant. With this injection and the base-$3$ one
      in hand, Schröder–Bernstein delivers
      $\mathbb{R} \approx \mathcal{P}(\mathbb{N})$.
    choices:
      - text: >
          Because $\mathbb{Q}$ is dense: if $x < y$ then some rational lies
          strictly between, and it belongs to one set but not the other
        correct: true
        feedback: >
          Exactly — density is what turns "different reals" into "different sets
          of rationals below them".
      - text: >
          Because $\mathbb{Q}$ is countable, so the attached sets can be listed
        feedback: >
          Countability is used afterwards, to move from
          $\mathcal{P}(\mathbb{Q})$ to $\mathcal{P}(\mathbb{N})$. It has no
          bearing on whether distinct reals get distinct sets.
      - text: >
          Because every real number is the limit of a sequence of rationals
        feedback: >
          True of every real, and so it distinguishes no two of them. What is
          needed is a rational lying strictly between two given reals.
      - text: >
          Because each set $\{q \in \mathbb{Q} : q < x\}$ is infinite
        feedback: >
          Also true, and also no help: two different reals could in principle
          have the same infinite set attached, and density is what rules that
          out.
    rubric:
      - >
        Produces the separating rational strictly between $x$ and $y$, rather
        than appealing to countability or to approximation.
      - >
        Keeps the two roles of $\mathbb{Q}$ apart: density gives injectivity,
        countability converts $\mathcal{P}(\mathbb{Q})$ into
        $\mathcal{P}(\mathbb{N})$.
    targets:
      - foundations.cardinality.continuum-cardinality
    exercises:
      - foundations.number-systems.q-dense
    connects: []
    tags: []

  - id: cardinality-continuum-hypothesis-01
    kind: decide
    difficulty: demanding
    statement: >
      A student proposes to settle the continuum hypothesis by constructing a
      set $A$ with $|\mathbb{N}| < |A| < |\mathbb{R}|$. What do Gödel's and
      Cohen's results say about the prospects of that plan?
    answer: >
      The plan cannot succeed inside $\mathrm{ZFC}$. Gödel showed in 1940 that
      if $\mathrm{ZFC}$ is consistent then so is $\mathrm{ZFC}$ together with
      the continuum hypothesis. A construction of the proposed $A$, carried out
      from the axioms, would be a $\mathrm{ZFC}$ proof that the continuum
      hypothesis is false; combined with Gödel's result that would make
      $\mathrm{ZFC}$ inconsistent. So either the construction smuggles in an
      assumption beyond $\mathrm{ZFC}$, or it is wrong. Cohen's 1963 theorem —
      that $\mathrm{ZFC}$ together with the negation of the hypothesis is also
      consistent — blocks the opposite plan in the same way: no proof from the
      axioms that no such $A$ exists is available either. Together the two
      results say the hypothesis is independent of $\mathrm{ZFC}$. Note what
      neither says: neither result decides whether the hypothesis is true, and
      Gödel did not prove the hypothesis, only that assuming it is safe.
    choices:
      - text: >
          No such construction can be carried out in $\mathrm{ZFC}$: a proof
          that such an $A$ exists, together with Gödel's consistency result,
          would make $\mathrm{ZFC}$ inconsistent
        correct: true
        feedback: >
          That is the force of a relative consistency proof — it rules out any
          refutation of the hypothesis from the axioms.
      - text: >
          The plan is sound and needs only a cleverer $A$, since Cohen showed
          the negation of the hypothesis is consistent
        feedback: >
          Consistency of the negation is not a construction. It says a model
          exists in which such an $A$ is present, not that one can be built from
          the axioms.
      - text: >
          Gödel proved the continuum hypothesis true, so no such $A$ exists
        feedback: >
          He proved it consistent with $\mathrm{ZFC}$, not true. Cohen proved
          its negation consistent as well, which would be impossible if Gödel
          had settled its truth.
      - text: >
          Nothing — those results concern the generalised continuum hypothesis
          only
        feedback: >
          Both results are about the continuum hypothesis itself; the
          generalised form is a separate, stronger statement about every
          infinite $X$.
    rubric:
      - >
        Reads a relative consistency result correctly: it forbids a refutation
        from the axioms, and asserts nothing about truth.
      - >
        Uses both halves — Gödel blocks the construction, Cohen blocks the
        proof that no such set exists — to reach independence.
    targets:
      - foundations.cardinality.continuum-hypothesis
    exercises: []
    connects: []
    tags: []

  - id: cardinality-continuum-hypothesis-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of the statements below is not settled by $\mathrm{ZFC}$ —
      neither provable nor refutable from those axioms. Which?
    answer: >
      The unsettled one is that every uncountable subset of $\mathbb{R}$ is
      equinumerous with $\mathbb{R}$, which is one of the standard formulations
      of the continuum hypothesis: an uncountable subset not equinumerous with
      $\mathbb{R}$ would have cardinality strictly between $|\mathbb{N}|$ and
      $|\mathbb{R}|$, and conversely. By Gödel and Cohen it is independent of
      $\mathrm{ZFC}$. Each of the others is a theorem proved in this subbranch.
      That $|\mathbb{R}| = |\mathcal{P}(\mathbb{N})|$ is the continuum
      cardinality proposition, by two injections and Schröder–Bernstein. That
      $|\mathbb{N}| < |\mathcal{P}(\mathbb{N})|$ is Cantor's theorem at
      $X = \mathbb{N}$. That the algebraic numbers are countable follows from
      the countability of finite products and countable unions. The distinction
      being drilled is between a hard theorem and an undecidable statement:
      difficulty and independence are not the same thing.
    choices:
      - text: >
          Every uncountable subset of $\mathbb{R}$ is equinumerous with
          $\mathbb{R}$
        correct: true
        feedback: >
          This is the continuum hypothesis in another dress, and it is
          independent of $\mathrm{ZFC}$.
      - text: >
          $|\mathbb{R}| = |\mathcal{P}(\mathbb{N})|$
        feedback: >
          A theorem: two injections and Schröder–Bernstein give the bijection.
      - text: >
          $|\mathbb{N}| < |\mathcal{P}(\mathbb{N})|$
        feedback: >
          A theorem — Cantor's, applied to $X = \mathbb{N}$.
      - text: >
          The set of algebraic numbers is countable
        feedback: >
          A theorem, from countable products of $\mathbb{Z}$ and a countable
          union of finite root sets.
    rubric:
      - >
        Recognises the subset formulation as equivalent to the continuum
        hypothesis rather than as a separate theorem.
      - >
        Classifies the other three as proved results and names the proof for at
        least one.
    targets:
      - foundations.cardinality.continuum-hypothesis
    exercises:
      - foundations.cardinality.cantor-theorem
      - foundations.cardinality.r-uncountable
    connects: []
    tags: []

  # --- algebraic and transcendental numbers ------------------------------------

  - id: cardinality-algebraic-countable-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that the set of algebraic numbers is countable, saying which
      countability fact carries each step, and then upgrade the conclusion to
      countably infinite. Explain also why the definition insists on a *nonzero*
      polynomial.
    answer: >
      Fix $d \in \mathbb{N}$. A polynomial of degree at most $d$ with integer
      coefficients is determined by its coefficient vector in
      $\mathbb{Z}^{d+1}$, so the set $P_d$ of such polynomials is equinumerous
      with $\mathbb{Z}^{d+1}$, which is countable as a finite product of
      countable sets. The set of all nonzero integer polynomials is
      $\bigcup_{d \in \mathbb{N}} P_d$ minus the zero polynomial: a countable
      union of countable sets, hence countable — and here the union needs no
      appeal to choice, because each $\mathbb{Z}^{d+1}$ carries an explicit
      enumeration built from the enumeration of $\mathbb{Z}$. Next, each nonzero
      $p$ of degree $d$ has at most $d$ roots, so its root set $R_p$ is finite.
      The algebraic numbers are $\bigcup_p R_p$, indexed by a countable set with
      every piece finite and therefore countable, so a countable union of
      countable sets again: countable. Finally the set is infinite, since every
      integer $n$ is a root of $x - n$ and distinct integers give distinct
      roots; a countable infinite set is countably infinite. The nonzero
      hypothesis is not decoration. The zero polynomial vanishes at every
      number, so allowing it would make every number algebraic and, worse, would
      break the step that matters: the root set would no longer be finite, and
      the final union would no longer be a union of finite sets.
    rubric:
      - >
        Uses the finite product result for $\mathbb{Z}^{d+1}$ and the countable
        union result for the union over degrees, naming each.
      - >
        Uses the bound of $d$ roots to make each root set finite, which is what
        makes the second union a countable union of countable sets.
      - >
        Upgrades countable to countably infinite by exhibiting infinitely many
        algebraic numbers, such as the integers.
      - >
        Explains that the zero polynomial would destroy the finiteness of the
        root sets, not merely enlarge the definition.
    targets:
      - foundations.cardinality.algebraic-countable
    exercises:
      - foundations.cardinality.countable-union
      - foundations.cardinality.product-countable
      - foundations.cardinality.z-countable
    connects: []
    tags: []

  - id: cardinality-algebraic-countable-02
    kind: work
    difficulty: standard
    statement: >
      The number $\alpha = \sqrt{5} - 1$ is algebraic. Find the monic integer
      polynomial of least degree having $\alpha$ as a root. What is its constant
      term?
    answer: >
      $-4$. Isolate the surd and square: $\alpha + 1 = \sqrt{5}$, so
      $(\alpha+1)^{2} = 5$, that is $\alpha^{2} + 2\alpha + 1 = 5$, hence
      $\alpha^{2} + 2\alpha - 4 = 0$. So $\alpha$ is a root of
      $x^{2} + 2x - 4$, whose constant term is $-4$. The degree is least
      possible: a monic integer polynomial of degree $1$ is $x - n$, whose only
      root is the integer $n$, and $\alpha = \sqrt{5} - 1$ is irrational because
      $\sqrt{5}$ is, so no such polynomial works. The point of the exercise is
      the one the countability proof turns on: this number, an infinite
      non-repeating decimal, is completely pinned down by the coefficient vector
      $(1, 2, -4)$ together with a note saying which of the two roots is meant.
      Three integers, and there are only countably many triples of integers.
      Answering $5$ or $-5$ reports the number under the radical rather than the
      constant term of the polynomial.
    expects: "-4"
    rubric:
      - >
        Isolates $\sqrt{5}$ before squaring, so the cross term $2\alpha$ appears
        and the polynomial is $x^{2} + 2x - 4$.
      - >
        Justifies minimality of the degree by the irrationality of $\alpha$,
        rather than assuming degree $2$ because a square root was involved.
    targets:
      - foundations.cardinality.algebraic-countable
    exercises: []
    connects: []
    tags: []

  - id: cardinality-transcendental-exist-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that the set of transcendental real numbers is uncountable. Then
      explain why the proof produces no transcendental number, and say what
      would be needed instead.
    answer: >
      Write $A$ for the set of real algebraic numbers and $T$ for the
      transcendental reals, so that $\mathbb{R} = A \cup T$ and the two are
      disjoint. $A$ is countable. Suppose $T$ were countable as well. Then
      $\mathbb{R}$ would be the union of two countable sets, and a union of
      *finitely* many countable sets is countable — no axiom of choice is
      needed, since only two enumerations are being fixed. That contradicts the
      uncountability of $\mathbb{R}$, so $T$ is uncountable. In particular $T$
      is nonempty, so transcendental numbers exist. The same count says more:
      every rational is algebraic, being a root of $qx - p$, so $T$ is contained
      in the irrationals and the irrationals are uncountable too. Why no example
      emerges: the argument is a contradiction derived from a statement about
      *sizes*. At no point is a real number named, described, or approximated;
      what is refuted is the proposition that $T$ is small, and a refutation of
      smallness constructs nothing. Producing an actual transcendental is a
      different task, requiring an argument that a specific number satisfies no
      integer polynomial — Liouville built the first explicit example in 1844 by
      making the decimal expansion too well approximable by rationals, Hermite
      settled $e$ in 1873, and Lindemann settled $\pi$ in 1882.
    rubric:
      - >
        Splits $\mathbb{R}$ into the algebraic and the transcendental reals and
        derives the contradiction from the countability of a union of two
        countable sets.
      - >
        Notes that this union is finite, so no appeal to countable choice is
        made.
      - >
        Explains the non-constructivity precisely — the argument refutes a
        statement about cardinality and never names a number — rather than
        saying the example is merely hard to find.
    targets:
      - foundations.cardinality.transcendental-exist
    exercises:
      - foundations.cardinality.algebraic-countable
      - foundations.cardinality.r-uncountable
      - foundations.proof.existence-nonconstructive
    connects: []
    tags: []

  - id: cardinality-transcendental-exist-02
    kind: decide
    difficulty: standard
    statement: >
      The counting argument compares the countable set of real algebraic
      numbers with the uncountable set $\mathbb{R}$. Which of the following
      conclusions does it *not* license?
    answer: >
      It does not license the transcendence of $\pi$. The argument establishes
      that transcendental reals exist, because a countable set cannot exhaust an
      uncountable one; that they are uncountable, because $\mathbb{R}$ would
      otherwise be a union of two countable sets; and that the irrationals are
      uncountable, since every rational is algebraic and so the transcendentals
      are among the irrationals. What it never does is examine any particular
      number. To conclude that $\pi$ is transcendental one must show that $\pi$
      satisfies no nonzero integer polynomial, which is a statement about
      $\pi$ alone and was proved by Lindemann in 1882, nearly a decade after
      Cantor's counting argument and by completely different means. This is the
      characteristic shape of a non-constructive existence proof: it settles
      that something is there without giving any way to point at it.
    choices:
      - text: >
          The number $\pi$ is transcendental
        correct: true
        feedback: >
          True, but not from counting. It is a statement about one specific
          number, proved by Lindemann in 1882.
      - text: >
          Some real number is transcendental
        feedback: >
          Licensed: a countable subset cannot exhaust an uncountable set, so
          something is left over.
      - text: >
          The transcendental reals are uncountable
        feedback: >
          Licensed: were they countable, $\mathbb{R}$ would be a union of two
          countable sets and hence countable.
      - text: >
          The irrational numbers are uncountable
        feedback: >
          Licensed: every rational is algebraic, so the transcendentals are
          irrational, and an uncountable subset makes the whole set
          uncountable.
    rubric:
      - >
        Separates existence claims about a set from claims about a named
        number.
      - >
        Recognises the three licensed conclusions as consequences of the two
        counts, and attributes the transcendence of $\pi$ to a separate
        theorem.
    targets:
      - foundations.cardinality.transcendental-exist
