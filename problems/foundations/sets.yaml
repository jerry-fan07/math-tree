# problems targeting foundations.sets — naive set theory.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# the mastery set — which reads hardest-first — never opens with something the
# lesson has just handed over, and a `standard` or `routine` one, so the unit
# test has something fair to ask. Every `work` and `decide` problem is
# machine-checked; `justify` is reserved for the proofs the unit actually
# wants written out. No problem here reuses a lesson's worked example or a
# card's instance. Tagging rules are design.md §5.2; see ../README.md.

problems:
  # --- membership and set-builder notation ------------------------------------

  - id: sets-def-set-membership-01
    kind: work
    difficulty: demanding
    statement: >
      How many elements does $S = \{5, \{5\}, \{5,7\}, \{7,5\}, \{\{5\}\}\}$
      have?
    answer: >
      $4$. Count top-level entries and then ask which of them are the same
      object. The listing has five entries, but $\{5,7\}$ and $\{7,5\}$ are the
      same set — extensionality says a set is fixed by which objects belong to
      it, and both answer yes to exactly $5$ and $7$ — so those two entries
      contribute one element between them. The remaining three entries are
      pairwise different: $5$ is a number, $\{5\}$ is a set whose only element
      is that number, and $\{\{5\}\}$ is a set whose only element is $\{5\}$.
      Nothing else collapses, so $S$ has $4$ elements. Answering $5$ counts the
      reordered pair twice; answering $3$ treats $5$, $\{5\}$ and $\{\{5\}\}$ as
      one object, losing two levels.
    expects: "4"
    rubric:
      - >
        Identifies $\{5,7\}$ and $\{7,5\}$ as one entry, and says why — order
        carries no information.
      - >
        Keeps $5$, $\{5\}$ and $\{\{5\}\}$ apart as three different objects
        rather than collapsing the nesting.
    targets:
      - foundations.sets.def-set-membership
    exercises: []
    connects: []
    tags: []

  - id: sets-def-set-membership-02
    kind: decide
    difficulty: standard
    statement: >
      Let $T = \{4, \{4,9\}, \emptyset\}$. Exactly one of the following is
      true. Which?
    answer: >
      $\emptyset \in T$. Membership reads the top-level entries of $T$, and
      there are three of them: the number $4$, the set $\{4,9\}$, and
      $\emptyset$. The third of those is listed outright, so $\emptyset \in T$
      holds. The number $9$ appears on the page, but only inside the entry
      $\{4,9\}$, and an object one level down is not an entry — so $9 \notin T$.
      The set $\{4\}$ was never listed either: what appears is the number $4$,
      and a box is not its contents.
    choices:
      - text: >
          $9 \in T$
        feedback: >
          $9$ occurs only inside the entry $\{4,9\}$. The entries of $T$ are
          $4$, $\{4,9\}$ and $\emptyset$, and membership looks at those alone.
      - text: >
          $\emptyset \in T$
        correct: true
        feedback: >
          $\emptyset$ is listed as an entry, so it is one of the three elements
          of $T$ — a set with no elements is still a perfectly good object.
      - text: >
          $\{4\} \in T$
        feedback: >
          The number $4$ is an entry of $T$; the one-element set $\{4\}$ that
          boxes it is a different object, and that box was never listed.
    rubric:
      - >
        Reads entries rather than ink: rejects $9$ because it sits one level
        down inside $\{4,9\}$.
      - >
        Distinguishes the entry $4$ from the set $\{4\}$.
    targets:
      - foundations.sets.def-set-membership
    exercises: []
    connects: []
    tags: []

  - id: sets-def-set-membership-03
    kind: work
    difficulty: routine
    statement: >
      How many elements does $\{6, 6, \{6\}, 8, \{8,8\}, \{6,8\}\}$ have?
    answer: >
      $5$. Repetition carries no information, so the two listings of $6$ record
      one element, and $\{8,8\}$ is the same set as $\{8\}$ for the same reason.
      After those collapses the distinct entries are $6$, $\{6\}$, $8$, $\{8\}$
      and $\{6,8\}$ — five objects, no two of them equal, since a number is
      never a set and the three sets listed disagree about which numbers belong
      to them. Answering $6$ counts a repeated entry twice; answering $3$
      confuses a number with the singleton that holds it.
    expects: "5"
    rubric:
      - >
        Collapses the repeated $6$ and rewrites $\{8,8\}$ as $\{8\}$ before
        counting.
      - >
        Counts $6$ and $\{6\}$ as two separate elements, and likewise $8$ and
        $\{8\}$.
    targets:
      - foundations.sets.def-set-membership
    exercises: []
    connects: []
    tags: []

  - id: sets-set-builder-01
    kind: work
    difficulty: demanding
    statement: >
      Let $A = \{\, n \in \mathbb{Z} : -6 \le n \le 6 \,\}$ and let
      $S = \{\, x \in A : x^{2} \in A \,\}$. How many elements does $S$ have?
    answer: >
      $5$. Membership in $S$ unfolds into two conditions joined by "and": $x$
      must lie in the host set $A$, and $x$ must pass the test, which is itself
      a membership question about $x^{2}$. The host condition allows the
      thirteen integers from $-6$ to $6$. The test asks $-6 \le x^{2} \le 6$;
      the left half is automatic, since a square is never negative, so what
      bites is $x^{2} \le 6$. That holds for $x = 0, \pm 1, \pm 2$, since
      $2^{2} = 4 \le 6$ while $3^{2} = 9 > 6$. Hence $S = \{-2,-1,0,1,2\}$,
      which has $5$ elements. Answering $3$ drops the negative candidates, but
      $(-2)^{2} = 4$ passes exactly as $2^{2}$ does.
    expects: "5"
    rubric:
      - >
        Unfolds membership into both conditions — $x \in A$ and $x^{2} \in A$ —
        rather than testing only the property.
      - >
        Reads $x^{2} \in A$ as the inequality $-6 \le x^{2} \le 6$ and keeps the
        negative values of $x$ that satisfy it.
    targets:
      - foundations.sets.set-builder
    exercises:
      - foundations.sets.def-set-membership
    connects: []
    tags: []

  - id: sets-set-builder-02
    kind: decide
    difficulty: standard
    statement: >
      Let $A = \{-3,-1,0,2,3\}$. Which set is $\{\, x^{2} : x \in A \,\}$?
    answer: >
      $\{0,1,4,9\}$. This is the value form: it collects everything the rule
      $x \mapsto x^{2}$ produces as $x$ ranges over $A$, not the inputs and not
      the elements of $A$ that pass a test. Applying the rule entry by entry
      gives $9, 1, 0, 4, 9$. Five inputs, but only four different outputs, since
      $-3$ and $3$ share a square and a set records membership rather than
      multiplicity. So the answer is $\{0,1,4,9\}$, a four-element set.
    choices:
      - text: >
          $\{0,1,4,9\}$
        correct: true
        feedback: >
          The four distinct values the rule produces. $-3$ and $3$ both give
          $9$, and the set records that value once.
      - text: >
          $\{0,1,4,9,9\}$
        feedback: >
          Repeating an entry does not create a second element, so this is
          $\{0,1,4,9\}$ written wastefully — the value form can genuinely
          shrink, and here it does.
      - text: >
          $\{-3,-1,0,2,3\}$
        feedback: >
          That is $A$ itself. The value form collects what the rule produces,
          not the inputs it was applied to; the form that keeps inputs is
          $\{\, x \in A : P(x) \,\}$.
    rubric:
      - >
        Applies the rule to every element of $A$ and collects the outputs, not
        the inputs.
      - >
        Records the shared value $9$ once, so the answer has four elements and
        not five.
    targets:
      - foundations.sets.set-builder
    exercises:
      - foundations.sets.def-set-membership
    connects: []
    tags: []

  # --- subsets, equality, and the double-inclusion template --------------------

  - id: sets-def-subset-01
    kind: decide
    difficulty: demanding
    statement: >
      Let $C = \{1, \{1\}, \{1,2\}\}$. Exactly one of the following is false.
      Which?
    answer: >
      $\{1,2\} \subseteq C$ is the false one. Containment tests the elements of
      the left set one at a time against the entries of $C$, whose entries are
      $1$, $\{1\}$ and $\{1,2\}$. For $\{1,2\}$: $1 \in C$, but $2 \notin C$ —
      the $2$ appears only inside the entry $\{1,2\}$ — and one escapee is a
      complete refutation. The other three hold. $\{1\} \in C$ because $\{1\}$
      is listed. $\{1\} \subseteq C$ because its only element is $1$ and
      $1 \in C$; note that this holds for a completely different reason from the
      previous claim, so $\{1\}$ is simultaneously an element and a subset of
      $C$. And $\{\{1\}\} \subseteq C$ because its only element is $\{1\}$,
      which is an entry of $C$.
    choices:
      - text: >
          $\{1\} \in C$
        feedback: >
          True: $\{1\}$ is listed as an entry of $C$. Membership compares an
          object with the entries, and this object is one of them.
      - text: >
          $\{1\} \subseteq C$
        feedback: >
          True, and for an unrelated reason: the only element of $\{1\}$ is
          $1$, and $1 \in C$, so nothing escapes.
      - text: >
          $\{1,2\} \subseteq C$
        correct: true
        feedback: >
          False. Its element $2$ is not an entry of $C$ — it occurs only inside
          the entry $\{1,2\}$ — and a single escapee refutes a containment.
      - text: >
          $\{\{1\}\} \subseteq C$
        feedback: >
          True: its single element is $\{1\}$, and $\{1\}$ is an entry of $C$,
          so the one element to test lands inside.
    rubric:
      - >
        Tests each containment element by element against the entries of $C$,
        rather than by eye.
      - >
        Sees that $2$ is not an entry of $C$ even though it is visible inside
        one, and refutes the containment with that single witness.
    targets:
      - foundations.sets.def-subset
    exercises:
      - foundations.sets.def-set-membership
    connects: []
    tags: []

  - id: sets-def-subset-02
    kind: decide
    difficulty: standard
    statement: >
      Let $A = \{1,3\}$, $B = \{1,2,3\}$, $C = \{1,2,3,4\}$ and $D = \{2,5\}$.
      Which of the following is true?
    answer: >
      $A \subseteq C$. Both elements of $A$ lie in $C$, so the containment holds
      directly; it also follows from transitivity, since $A \subseteq B$ and
      $B \subseteq C$, and implications chain. The others all fail. $D \subseteq
      C$ fails on the witness $5$, which is in $D$ and not in $C$. Neither
      $A \subseteq D$ nor $D \subseteq A$ holds — $1$ is in $A$ and not in $D$,
      while $2$ is in $D$ and not in $A$ — so containment is not a total order
      and two sets may simply be incomparable. And $B \in C$ fails because the
      entries of $C$ are the numbers $1,2,3,4$ and none of them is the set
      $\{1,2,3\}$.
    choices:
      - text: >
          $A \subseteq C$
        correct: true
        feedback: >
          Both $1$ and $3$ lie in $C$. Transitivity gives the same conclusion
          through $B$, since $A \subseteq B$ and $B \subseteq C$.
      - text: >
          $D \subseteq C$
        feedback: >
          $5 \in D$ and $5 \notin C$. One escapee refutes a containment, however
          many other elements behave.
      - text: >
          At least one of $A \subseteq D$ and $D \subseteq A$ holds
        feedback: >
          $1$ lies in $A$ but not in $D$, and $2$ lies in $D$ but not in $A$, so
          both fail. Containment is not a total order.
      - text: >
          $B \in C$
        feedback: >
          The entries of $C$ are the four numbers, and none of them is the set
          $\{1,2,3\}$. Membership compares an object with entries; containment
          compares entries with entries.
    rubric:
      - >
        Distinguishes $\in$ from $\subseteq$ when judging the claim about $B$
        and $C$.
      - >
        Refutes the failing containments by naming a specific escaping element.
    targets:
      - foundations.sets.def-subset
    exercises:
      - foundations.sets.def-set-membership
    connects: []
    tags: []

  - id: sets-set-equality-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $A$ and $B$ be sets, and suppose that for every set $S$ the
      equivalence "$S \subseteq A$ if and only if $S \subseteq B$" holds. Prove
      that $A = B$.
    answer: >
      Instantiate the hypothesis twice. Taking $S = A$, the equivalence reads
      "$A \subseteq A$ if and only if $A \subseteq B$". Containment is
      reflexive, so the left side is true, and therefore $A \subseteq B$. Now
      take $S = B$: the equivalence reads "$B \subseteq A$ if and only if
      $B \subseteq B$", whose right side is true by reflexivity, so
      $B \subseteq A$. Both containments hold, and by set equality as mutual
      containment, $A = B$. The whole proof is the choice of the two
      instantiations: the hypothesis is a statement about *every* set $S$, and
      the two useful instances are the two sets already named. Notice also that
      only one direction of each equivalence was used, and that reflexivity of
      containment is what supplies the true side each time.
    rubric:
      - >
        Instantiates the universally quantified hypothesis at $S = A$ and at
        $S = B$ — this is the load-bearing step, and no other instance is
        needed.
      - >
        Uses reflexivity, $A \subseteq A$ and $B \subseteq B$, to activate each
        equivalence.
      - >
        Concludes $A = B$ from the two containments by citing mutual
        containment, not by asserting the sets look alike.
    targets:
      - foundations.sets.set-equality
    exercises:
      - foundations.sets.def-subset
    connects: []
    tags: []

  - id: sets-set-equality-02
    kind: decide
    difficulty: standard
    statement: >
      Let $A = \{\, x \in \mathbb{Z} : x = 4m + 2 \text{ for some } m \in
      \mathbb{Z} \,\}$ and let $B$ be the set of even integers. Which
      containments hold?
    answer: >
      Only $A \subseteq B$. For the containment that holds, take an arbitrary
      $x \in A$, so $x = 4m + 2$ for some integer $m$; then $x = 2(2m + 1)$,
      which exhibits $x$ as even, so $x \in B$. For the containment that fails,
      one witness suffices: $4 \in B$, and $4 = 4m + 2$ would force $4m = 2$,
      which no integer $m$ satisfies, so $4 \notin A$. Since exactly one
      containment holds, the two sets are not equal — which is the point.
      Equality needs both directions, and half of the evidence is no evidence at
      all. (Concretely, $A$ is the integers leaving remainder $2$ on division by
      $4$, and $B$ also contains those leaving remainder $0$.)
    choices:
      - text: >
          $A \subseteq B$ only
        correct: true
        feedback: >
          Every $4m + 2 = 2(2m+1)$ is even, so the forward containment holds;
          and $4$ is even without being of the form $4m + 2$, so the reverse
          fails and the sets differ.
      - text: >
          Both, so $A = B$
        feedback: >
          The witness $4$ breaks the second containment: it is even, but
          $4m + 2$ is never a multiple of $4$. One containment alone never gives
          equality.
      - text: >
          $B \subseteq A$ only
        feedback: >
          Backwards. $A$ is the smaller set here — every element of it is even —
          so the containment that survives runs from $A$ into $B$.
      - text: >
          Neither
        feedback: >
          $A \subseteq B$ does hold: writing $4m + 2 = 2(2m+1)$ shows every
          element of $A$ is even, and that is a complete containment proof.
    rubric:
      - >
        Proves $A \subseteq B$ by taking an arbitrary element and rewriting
        $4m + 2$ as $2(2m+1)$.
      - >
        Refutes $B \subseteq A$ with a single explicit witness, and concludes
        that one containment does not give equality.
    targets:
      - foundations.sets.set-equality
    exercises:
      - foundations.sets.def-subset
    connects: []
    tags: []

  - id: sets-double-inclusion-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove by double inclusion that
      $\{\, x \in \mathbb{Z} : x = 3s + 5t \text{ for some } s, t \in
      \mathbb{Z} \,\} = \mathbb{Z}$.
    answer: >
      Call the left-hand set $L$. First pass. Let $x$ be arbitrary with
      $x \in L$; then $x = 3s + 5t$ for some integers $s$ and $t$, and a sum of
      products of integers is an integer, so $x \in \mathbb{Z}$. That gives
      $L \subseteq \mathbb{Z}$. Second pass. Let $x$ be an arbitrary integer.
      Take $s = 2x$ and $t = -x$, both integers. Then
      $3s + 5t = 6x - 5x = x$, so $x$ has the required form and $x \in L$; that
      gives $\mathbb{Z} \subseteq L$. Both containments hold, so $L =
      \mathbb{Z}$. The two passes are genuinely different arguments: the first
      is a one-line closure remark, while the second has to *construct* the
      witnesses $s$ and $t$, and there is nothing in the first pass to run
      backwards to obtain them. (Any pair with $3s + 5t = 1$ would do just as
      well, scaled by $x$; the choice $3 \cdot 2 + 5 \cdot (-1) = 1$ is the
      convenient one.)
    rubric:
      - >
        Runs two separate passes, each opening with an arbitrary $x$ assumed to
        lie in one side.
      - >
        Exhibits explicit integers $s$ and $t$ in the second pass — this is the
        load-bearing step, and no reversal of the first pass supplies them.
      - >
        Checks that the constructed $s$ and $t$ really are integers, so the
        membership condition is met as stated.
    targets:
      - foundations.sets.double-inclusion
    exercises:
      - foundations.sets.set-equality
    connects: []
    tags: []

  - id: sets-double-inclusion-02
    kind: decide
    difficulty: standard
    statement: >
      A student offers this proof that
      $\{\, n \in \mathbb{Z} : n^{2} > n \,\} = \{\, n \in \mathbb{Z} :
      n > 1 \,\}$: "Let $n$ lie in the left set, so $n^{2} > n$. Dividing by
      $n$ gives $n > 1$, so $n$ lies in the right set. Every step reverses, so
      the sets are equal." Which objection is decisive?
    answer: >
      Dividing by $n$ silently assumes $n > 0$, and the assumption is false for
      part of the left set. Factoring instead, $n^{2} > n$ is equivalent to
      $n(n-1) > 0$, which holds exactly when $n < 0$ or $n > 1$. So $-3$ lies in
      the left set, since $9 > -3$, and not in the right set. The two sets are
      therefore not equal, and no repair of the write-up can prove otherwise —
      the objection is decisive because it exhibits a counterexample, not merely
      a gap. The other complaints are real but weaker: a genuinely reversible
      chain would license a single pass, and choosing a special $n$ would be a
      separate error that this proof did not commit.
    choices:
      - text: >
          Dividing by $n$ assumes $n > 0$; taking $n = -3$ gives $9 > -3$ with
          $-3 \le 1$, so the sets are not even equal
        correct: true
        feedback: >
          The step is not a valid implication at all, and the witness $-3$ shows
          the identity itself is false. Factoring gives $n(n-1) > 0$, so the
          left set is the negatives together with the integers above $1$.
      - text: >
          Only one containment was written out; the return trip is missing
        feedback: >
          If every step really were an equivalence, one pass would prove both
          containments — that shortcut is legitimate. What fails here is that
          one step is not even a one-way implication.
      - text: >
          The element $n$ should have been taken to be the smallest element of
          the left set
        feedback: >
          Exactly backwards. The element must stay arbitrary; fixing a special
          one would reduce a universal claim to a single instance and prove
          nothing.
      - text: >
          Set identities cannot be proved by chasing elements
        feedback: >
          Element chasing is the standard and correct method for a set identity.
          The fault lies in one algebraic step inside the chase, not in the
          method.
    rubric:
      - >
        Names the division by $n$ as the invalid step, and says why: the sign of
        $n$ was never established.
      - >
        Produces a specific negative witness lying in one set and not the other,
        so the identity is refuted rather than merely doubted.
    targets:
      - foundations.sets.double-inclusion
    exercises:
      - foundations.sets.set-equality
    connects: []
    tags: []

  - id: sets-empty-set-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $\emptyset$ is the only set $E$ with the property that
      $E \subseteq A$ for every set $A$.
    answer: >
      Two things must be shown: that $\emptyset$ has the property, and that
      nothing else does. Existence: for any set $A$, refuting $\emptyset
      \subseteq A$ would require an $x$ with $x \in \emptyset$ and $x \notin A$,
      and no object satisfies the first demand, so the containment holds
      vacuously for every $A$. Uniqueness: suppose $E \subseteq A$ for every set
      $A$. The hypothesis is universal, so instantiate it at the one set that
      pins $E$ down, $A = \emptyset$, giving $E \subseteq \emptyset$. That says
      every element of $E$ lies in $\emptyset$; since $\emptyset$ has no
      elements, $E$ can have none either, so $E$ is a set with no elements and
      hence is $\emptyset$, the empty set being unique. The load-bearing step is
      the instantiation at $A = \emptyset$: any other choice of $A$ leaves $E$
      free.
    rubric:
      - >
        Proves $\emptyset \subseteq A$ vacuously, by observing that the
        refuting witness would have to lie in $\emptyset$.
      - >
        Instantiates the universal hypothesis at $A = \emptyset$ — the
        load-bearing step — rather than at an arbitrary $A$.
      - >
        Concludes $E = \emptyset$ from "$E$ has no elements" by citing
        uniqueness of the empty set, not by inspection.
    targets:
      - foundations.sets.empty-set
    exercises:
      - foundations.sets.def-subset
    connects: []
    tags: []

  - id: sets-empty-set-02
    kind: decide
    difficulty: standard
    statement: >
      Which one of these sets is empty?
    answer: >
      $\{\, n \in \mathbb{Z} : n^{2} < 0 \,\}$. A separation keeps exactly the
      elements of the host set that pass the test, and no integer has a negative
      square, so nothing passes and the result is a set with no elements — which
      is $\emptyset$ itself, since the empty set is unique. The three others are
      all nonempty, each for its own reason: $\{\emptyset\}$ has exactly one
      entry, namely $\emptyset$, so a box holding an empty box is not itself
      empty; $\{0\}$ has one entry, the number zero, which is a number and not
      the absence of one; and $n^{3} = 4n$ is satisfied by $-2$, $0$ and $2$, so
      that set has three elements.
    choices:
      - text: >
          $\{\emptyset\}$
        feedback: >
          It has exactly one entry, namely $\emptyset$, so it is nonempty. An
          empty box and a box holding an empty box are different objects.
      - text: >
          $\{\, n \in \mathbb{Z} : n^{2} < 0 \,\}$
        correct: true
        feedback: >
          No integer has a negative square, so the separation keeps nothing and
          the result is the set with no elements.
      - text: >
          $\{0\}$
        feedback: >
          A one-element set whose entry happens to be the number $0$. Zero is a
          number, not the absence of one, and $\{0\} \ne \emptyset$.
      - text: >
          $\{\, n \in \mathbb{Z} : n^{3} = 4n \,\}$
        feedback: >
          Factoring, $n^{3} - 4n = n(n-2)(n+2)$, so $-2$, $0$ and $2$ all pass
          and this set has three elements.
    rubric:
      - >
        Tests each candidate by asking what its elements actually are, rather
        than by how empty the notation looks.
      - >
        Keeps $\emptyset$, $\{\emptyset\}$ and $\{0\}$ apart: only the first has
        no elements.
    targets:
      - foundations.sets.empty-set
    exercises:
      - foundations.sets.def-subset
    connects: []
    tags: []

  # --- the Boolean operations -------------------------------------------------

  - id: sets-def-union-01
    kind: work
    difficulty: demanding
    statement: >
      Inside $X = \{1, 2, \dots, 60\}$, let $A$ be the multiples of $4$ and $B$
      the multiples of $6$. How many elements does $A \cup B$ have?
    answer: >
      $20$. An object lies in $A \cup B$ as soon as it lies in at least one of
      them, and an object lying in both is recorded once, not twice — which is
      exactly why adding the two sizes is wrong. Counting: $|A| = 15$, since
      $60/4 = 15$; and $|B| = 10$, since $60/6 = 10$. The overlap $A \cap B$
      consists of the numbers divisible by both $4$ and $6$, which is
      divisibility by $12$ and not by $24$ — the two factors share a $2$ — so
      $|A \cap B| = 60/12 = 5$. Hence $|A \cup B| = 15 + 10 - 5 = 20$. The two
      neighbouring wrong answers are instructive: $25$ adds the sizes and
      double-counts the overlap, and $23$ uses $24$ in place of $12$, finds only
      the two multiples $24$ and $48$, and so subtracts too little.
    expects: "20"
    rubric:
      - >
        Subtracts the overlap once, rather than adding $|A|$ and $|B|$ — an
        element in both sets belongs to the union once.
      - >
        Identifies the overlap as the multiples of $12$, not of $24$.
    targets:
      - foundations.sets.def-union
    exercises: []
    connects: []
    tags: []

  - id: sets-def-union-02
    kind: decide
    difficulty: standard
    statement: >
      Which statement holds for all sets $A$ and $B$?
    answer: >
      $B \subseteq A \cup B$. Take an arbitrary $x$ with $x \in B$; then
      "$x \in A$ or $x \in B$" is true on its right disjunct alone, so
      $x \in A \cup B$. That single line is a complete containment proof, and
      the same argument with the disjuncts swapped gives $A \subseteq A \cup B$
      — a union sits outside both of its inputs. The others fail. $A \cup B
      \subseteq A$ is the reverse of what is true: with $A = \{1\}$ and
      $B = \{2\}$ the union is $\{1,2\}$, which escapes $A$. Sizes do not simply
      add, because elements in both sets are recorded once. And $A \cup B = A$
      says only $B \subseteq A$: for $A = \{1,2\}$ and $B = \{1\}$ the
      hypothesis holds while $A \ne B$.
    choices:
      - text: >
          $A \cup B \subseteq A$
        feedback: >
          Backwards. A union sits outside each input: with $A = \{1\}$ and
          $B = \{2\}$, the element $2$ is in the union and not in $A$.
      - text: >
          $B \subseteq A \cup B$
        correct: true
        feedback: >
          If $x \in B$ then "$x \in A$ or $x \in B$" already holds on its second
          disjunct, so $x \in A \cup B$ — a one-line containment proof.
      - text: >
          $|A \cup B| = |A| + |B|$ whenever $A$ and $B$ are finite
        feedback: >
          Only when the two share nothing. Elements lying in both are counted
          twice by the sum, which is the double-count inclusion–exclusion
          exists to correct.
      - text: >
          $A \cup B = A$ forces $A = B$
        feedback: >
          It forces only $B \subseteq A$. Take $A = \{1,2\}$ and $B = \{1\}$:
          the union is $A$, and the sets differ.
    rubric:
      - >
        Justifies the true containment by unfolding membership: one disjunct
        suffices for a union.
      - >
        Refutes each false option with an explicit small counterexample rather
        than by feel.
    targets:
      - foundations.sets.def-union
    exercises: []
    connects: []
    tags: []

  - id: sets-def-intersection-01
    kind: work
    difficulty: demanding
    statement: >
      Inside $X = \{1, 2, \dots, 200\}$, let $A$ be the multiples of $6$ and $B$
      the multiples of $10$. How many elements does $A \cap B$ have?
    answer: >
      $20$. Unfolding, $x \in A \cap B$ if and only if $x \in A$ and $x \in B$,
      so a survivor must be divisible by $6$ and by $10$. Divisibility by both
      is divisibility by their least common multiple, which is $30$ and not the
      product $60$: $6 = 2 \cdot 3$ and $10 = 2 \cdot 5$ share a factor of $2$,
      which must not be demanded twice. The multiples of $30$ up to $200$ are
      $30, 60, 90, 120, 150, 180$ — that is $30 \cdot 1$ through $30 \cdot 6$,
      and $30 \cdot 7 = 210$ overshoots — so $|A \cap B| = 6$. Using the product
      $60$ instead would give $3$ and lose half the answer; adding the two
      sizes, which is a union habit, would give a number larger than either set.
    expects: "6"
    rubric:
      - >
        Reads the intersection as the two divisibility conditions holding at
        once, and converts that into divisibility by the least common multiple.
      - >
        Uses $30$, not the product $60$ — the shared factor of $2$ must not be
        demanded twice.
    targets:
      - foundations.sets.def-intersection
    exercises: []
    connects: []
    tags: []

  - id: sets-def-intersection-02
    kind: decide
    difficulty: standard
    statement: >
      Let $A$ be the set of odd integers and $B$ the set of multiples of $4$.
      What is $A \cap B$?
    answer: >
      $\emptyset$. A survivor would have to be odd and a multiple of $4$ at
      once, and every multiple of $4$ is even, so no integer qualifies. An
      intersection with nothing in it is a perfectly good answer: two sets need
      have nothing in common, which is the one way intersection differs sharply
      from union. Note that the answer is $\emptyset$ and not $\{\emptyset\}$ —
      the latter is a one-element set whose entry is the empty set. Note also
      that intersection only shrinks: $A \cap B \subseteq A$ always, so the
      answer could never have been the even integers, none of which lie in $A$.
    choices:
      - text: >
          $\emptyset$
        correct: true
        feedback: >
          Every multiple of $4$ is even, so nothing is both odd and in $B$; the
          separation keeps nothing, and a set with no elements is $\emptyset$.
      - text: >
          $\{\emptyset\}$
        feedback: >
          That is a one-element set whose entry is the empty set. An empty
          answer is $\emptyset$ itself, not a box containing it.
      - text: >
          the set of even integers
        feedback: >
          An intersection sits inside each input, and no even integer lies in
          the odd integers, so this set cannot be $A \cap B$.
      - text: >
          $\mathbb{Z}$
        feedback: >
          That is larger than either input. Even the union of these two sets
          misses $2$, and an intersection is smaller still.
    rubric:
      - >
        Argues from the membership rule — odd *and* a multiple of $4$ — rather
        than from a picture.
      - >
        Answers $\emptyset$ and not $\{\emptyset\}$, and notes that an empty
        intersection is a legitimate outcome.
    targets:
      - foundations.sets.def-intersection
    exercises: []
    connects: []
    tags: []

  - id: sets-def-difference-01
    kind: work
    difficulty: demanding
    statement: >
      Let $X = \{1, 2, \dots, 50\}$, let $E$ be the set of even integers and $T$
      the set of multiples of $3$. How many elements does $(X \setminus E)
      \setminus T$ have?
    answer: >
      $17$. Work outward from the inner difference. $X \setminus E$ keeps the
      elements of $X$ that avoid $E$, namely the $25$ odd numbers from $1$ to
      $49$; note that $E$ has infinitely many elements outside $X$ and they cost
      nothing, since they were never available to delete. Now remove $T$ from
      that: what goes is the odd multiples of $3$ in range. The multiples of $3$
      up to $50$ number $16$, of which the even ones are the multiples of $6$,
      numbering $8$; so $16 - 8 = 8$ of them are odd. Hence the answer is
      $25 - 8 = 17$. Deleting all $16$ multiples of $3$ would give $9$ and
      double-count the even ones, which the first difference had already
      removed.
    expects: "17"
    rubric:
      - >
        Applies the two differences in order, keeping only elements of $X$ — a
        difference never adds anything.
      - >
        Removes only the *odd* multiples of $3$ at the second stage, since the
        even ones were already gone.
    targets:
      - foundations.sets.def-difference
    exercises: []
    connects: []
    tags: []

  - id: sets-def-difference-02
    kind: decide
    difficulty: standard
    statement: >
      Let $A$ be the set of nonnegative integers and $B$ the set of even
      integers. Which description of $B \setminus A$ is right?
    answer: >
      The negative even integers. Unfolding, $x \in B \setminus A$ if and only
      if $x \in B$ and $x \notin A$: the element must be even and must fail to
      be nonnegative, that is, must be negative. So $B \setminus A =
      \{-2, -4, -6, \dots\}$, an infinite set. Two structural facts are visible
      here. A difference never leaves its first set, so every element of
      $B \setminus A$ is even, which rules out any answer containing an odd
      number. And the operation is not symmetric: $A \setminus B$ is the
      nonnegative odd integers, a different set sharing not a single element
      with $B \setminus A$.
    choices:
      - text: >
          the negative even integers
        correct: true
        feedback: >
          Even, from membership in $B$; negative, from failing membership in the
          nonnegative integers. Both conditions, as always with a difference.
      - text: >
          the odd integers
        feedback: >
          A difference stays inside its first set, so every element here is
          even. Complementing $B$ would give the odds; removing $A$ does not.
      - text: >
          the nonnegative odd integers
        feedback: >
          That is $A \setminus B$, the other order. The operation is not
          symmetric, and these two answers share no element at all.
      - text: >
          $\emptyset$
        feedback: >
          $-2$ is even and not nonnegative, so it survives; the difference is in
          fact infinite.
    rubric:
      - >
        Unfolds membership into "in $B$ and not in $A$" and reads off both
        conditions.
      - >
        Distinguishes $B \setminus A$ from $A \setminus B$ rather than treating
        them as one answer up to sign.
    targets:
      - foundations.sets.def-difference
    exercises: []
    connects: []
    tags: []

  - id: sets-def-complement-01
    kind: decide
    difficulty: demanding
    statement: >
      Let $A = \{2,3\}$. Someone writes $A^{c} = \{1,4,5\}$. Under what
      circumstances is that correct?
    answer: >
      Exactly when the universe is $U = \{1,2,3,4,5\}$. The notation $A^{c}$
      abbreviates $U \setminus A$, so it has no value until $U$ is named, and
      the value it then takes is determined: $A^{c} = \{1,4,5\}$ says that the
      elements of $U$ outside $A$ are precisely $1$, $4$ and $5$, while
      $A \subseteq U$ contributes $2$ and $3$. Together those account for $U$
      exactly, so $U = \{1,2,3,4,5\}$ and nothing else will do. Change the
      universe and the answer changes with it: inside $\{1,2,3,4,5,6\}$ the
      complement is $\{1,4,5,6\}$, and inside $\mathbb{Z}$ it is infinite. Same
      $A$, three different complements — which is why the universe is an input
      to the operation and not a convention that can be left implicit.
    choices:
      - text: >
          Never; the complement of a two-element set is always infinite
        feedback: >
          Only if the universe is infinite. Inside a finite $U$ the complement
          is finite, and its size is $|U| - 2$.
      - text: >
          Exactly when the universe is $U = \{1,2,3,4,5\}$
        correct: true
        feedback: >
          $A^{c} = U \setminus A$, so the stated complement together with
          $A \subseteq U$ reconstructs $U$ exactly — the universe is an input,
          determined here rather than assumed.
      - text: >
          Always, since $\{1,4,5\}$ is simply what is left over
        feedback: >
          Left over from what? Inside $\{1,2,3,4,5,6\}$ the complement is
          $\{1,4,5,6\}$, and inside $\mathbb{Z}$ it is infinite. "Everything
          else" does not determine a set.
      - text: >
          Never, since complements are defined only for infinite universes
        feedback: >
          No such restriction exists. Any set $U$ with $A \subseteq U$ serves as
          a universe, however small.
    rubric:
      - >
        Treats $A^{c}$ as an abbreviation for $U \setminus A$, so that the
        universe has to be supplied before the symbol has a value.
      - >
        Reconstructs $U$ from $A$ together with the asserted complement, instead
        of accepting "everything not in $A$" as an answer.
    targets:
      - foundations.sets.def-complement
    exercises:
      - foundations.sets.def-difference
    connects: []
    tags: []

  - id: sets-def-complement-02
    kind: work
    difficulty: standard
    statement: >
      Let $U = \{\, n \in \mathbb{Z} : 1 \le n \le 30 \,\}$ and let
      $A = \{\, n \in U : n \text{ is a perfect square} \,\}$. How many elements
      does $A^{c}$ have?
    answer: >
      $25$. First identify $A$: the perfect squares in range are $1, 4, 9, 16$
      and $25$, since $5^{2} = 25 \le 30$ while $6^{2} = 36$ overshoots, so
      $|A| = 5$. Now $A^{c} = U \setminus A$, and $A$ and $A^{c}$ are disjoint
      with union $U$ — every element of $U$ either is or is not a perfect square
      — so their sizes add to $|U| = 30$. Hence $|A^{c}| = 30 - 5 = 25$. The
      answer depends on the universe as much as on $A$: inside
      $\{1, 2, \dots, 100\}$ the same rule would give $100 - 10 = 90$.
    expects: "25"
    rubric:
      - >
        Lists the perfect squares up to $30$ and stops at $25$, since $36$ lies
        outside the universe.
      - >
        Uses that $A$ and $A^{c}$ partition $U$, so the two sizes add to $|U|$.
    targets:
      - foundations.sets.def-complement
    exercises:
      - foundations.sets.def-difference
    connects: []
    tags: []

  - id: sets-algebra-of-sets-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that for all sets $A$ and $B$: $A \subseteq B$ if and only if
      $A \cap B = A$.
    answer: >
      Forward. Suppose $A \subseteq B$ and prove the equality by double
      inclusion. One containment is free: $x \in A \cap B$ gives $x \in A$ and
      $x \in B$, and the first conjunct alone yields $x \in A$, so
      $A \cap B \subseteq A$ for any sets whatever. For the other, let $x \in A$
      be arbitrary; the hypothesis gives $x \in B$ as well, so $x$ satisfies
      both conjuncts and $x \in A \cap B$. Hence $A \subseteq A \cap B$, and the
      two containments give $A \cap B = A$. Backward. Suppose $A \cap B = A$ and
      let $x \in A$ be arbitrary. Then $x \in A \cap B$ by the assumed equality,
      so unfolding gives $x \in B$. Hence $A \subseteq B$. The load-bearing step
      in each direction is the same one used in opposite order: the hypothesis
      is what upgrades the free containment $A \cap B \subseteq A$ into an
      equality, and the equality is what lets an arbitrary element of $A$ be
      read as an element of $A \cap B$.
    rubric:
      - >
        Proves both directions of the biconditional, and proves the equality
        inside the forward direction by two containments.
      - >
        Notes that $A \cap B \subseteq A$ holds for all sets and needs no
        hypothesis, so only the reverse containment uses $A \subseteq B$.
      - >
        In the backward direction, uses the equality to move an arbitrary
        $x \in A$ into $A \cap B$ before unfolding.
    targets:
      - foundations.sets.algebra-of-sets
    exercises:
      - foundations.sets.def-intersection
      - foundations.sets.def-subset
    connects: []
    tags: []

  - id: sets-algebra-of-sets-02
    kind: work
    difficulty: standard
    statement: >
      Let $A = \{1, 2, \dots, 9\}$ and $B = \{7, 8, \dots, 20\}$. How many
      elements does $(A \cap B) \cup (A \cap (A \cup B))$ have?
    answer: >
      $9$. Simplify with the laws rather than computing. Absorption gives
      $A \cap (A \cup B) = A$, since anything in $A$ is already in the union and
      the intersection with $A$ throws away everything else. That reduces the
      expression to $(A \cap B) \cup A$, and the other absorption law —
      $A \cup (A \cap B) = A$, using commutativity of union to reorder — reduces
      it to $A$. So the answer is $|A| = 9$, and $B$ never entered. Computing
      the long way agrees: $A \cap B = \{7,8,9\}$ and $A \cup B = \{1, \dots,
      20\}$, so $A \cap (A \cup B) = A$, and $\{7,8,9\} \cup A = A$.
    expects: "9"
    rubric:
      - >
        Applies both absorption laws, so the expression collapses to $A$ and the
        answer does not depend on $B$.
      - >
        Reports $|A| = 9$, counting $A$ rather than the larger $A \cup B$.
    targets:
      - foundations.sets.algebra-of-sets
    exercises:
      - foundations.sets.def-union
      - foundations.sets.def-intersection
    connects: []
    tags: []

  - id: sets-distributive-laws-01
    kind: justify
    difficulty: demanding
    statement: >
      Show that $A \cap (B \cup C) = (A \cap B) \cup C$ fails for some sets $A$,
      $B$, $C$, and prove that it holds whenever $C \subseteq A$.
    answer: >
      Counterexample. Take $A = \emptyset$, $B = \emptyset$, $C = \{1\}$. The
      left side is $\emptyset \cap \{1\} = \emptyset$ and the right side is
      $\emptyset \cup \{1\} = \{1\}$, so the two differ. The failure is exactly
      the standard slip: $A$ was distributed into one branch of the union and
      not the other. Now the conditional claim, by double inclusion, assuming
      $C \subseteq A$. First pass: let $x \in A \cap (B \cup C)$, so $x \in A$
      and $x$ lies in $B$ or in $C$. If $x \in B$ then $x \in A \cap B$; if
      $x \in C$ then $x \in C$ directly. Either branch lands in $(A \cap B) \cup
      C$, and this pass never used the hypothesis. Second pass: let $x \in
      (A \cap B) \cup C$. If $x \in A \cap B$ then $x \in A$ and
      $x \in B \subseteq B \cup C$, so $x$ is on the left. If $x \in C$, then
      $x \in A$ *because* $C \subseteq A$, and $x \in B \cup C$ on the second
      disjunct, so again $x$ is on the left. Both containments hold, so the sets
      are equal. The hypothesis is used once, in the second pass, and that is
      precisely where the counterexample bites.
    rubric:
      - >
        Gives explicit sets on which the identity fails, and computes both sides
        rather than asserting the failure.
      - >
        Proves the conditional version by two passes, splitting into cases on
        which disjunct holds.
      - >
        Names the second pass, case $x \in C$, as the one step where
        $C \subseteq A$ is used — the load-bearing appeal to the hypothesis.
    targets:
      - foundations.sets.distributive-laws
    exercises:
      - foundations.sets.double-inclusion
    connects: []
    tags: []

  - id: sets-distributive-laws-02
    kind: work
    difficulty: standard
    statement: >
      Let $A = \{1, 2, \dots, 12\}$, let $B$ be the multiples of $3$ in
      $\{1, 2, \dots, 20\}$ and let $C$ be the multiples of $5$ in the same
      range. How many elements does $(A \cup B) \cap (A \cup C)$ have?
    answer: >
      $13$. The second distributive law says $(A \cup B) \cap (A \cup C) =
      A \cup (B \cap C)$, which turns two unions and an intersection into one
      small computation. Here $B \cap C$ is the set of numbers up to $20$
      divisible by $3$ and by $5$, hence by $15$, so $B \cap C = \{15\}$. Then
      $A \cup \{15\} = \{1, 2, \dots, 12, 15\}$, which has $12 + 1 = 13$
      elements. The long route agrees: $A \cup B = \{1, \dots, 12, 15, 18\}$ and
      $A \cup C = \{1, \dots, 12, 15, 20\}$, whose intersection is
      $\{1, \dots, 12, 15\}$. Answering $14$ typically comes from keeping $18$
      or $20$, each of which is missing from one of the two factors.
    expects: "13"
    rubric:
      - >
        Uses the law $ (A \cup B) \cap (A \cup C) = A \cup (B \cap C)$, or
        computes both unions and intersects them correctly.
      - >
        Finds $B \cap C = \{15\}$ by asking for divisibility by $15$, not by
        $3$ or $5$ separately.
    targets:
      - foundations.sets.distributive-laws
    exercises:
      - foundations.sets.def-union
      - foundations.sets.def-intersection
    connects: []
    tags: []

  - id: sets-de-morgan-01
    kind: justify
    difficulty: demanding
    statement: >
      Fix a universe $U$ and let $A, B \subseteq U$. Prove that
      $(A \setminus B)^{c} = A^{c} \cup B$.
    answer: >
      Note first that inside $U$ the difference is an intersection,
      $A \setminus B = A \cap B^{c}$: any element of $A$ lies in $U$, because
      $A \subseteq U$, so an element of $A$ fails to lie in $B$ exactly when it
      lies in $B^{c}$. Now chase an arbitrary $x$. Membership
      $x \in (A \setminus B)^{c}$
      says $x \in U$ and it is not the case that both $x \in A$ and $x \notin
      B$. De Morgan for statements turns the denial of that conjunction into a
      disjunction: $x \notin A$ or $x \in B$. Combining each disjunct with
      $x \in U$: the first gives $x \in A^{c}$, and the second gives $x \in B$.
      So $x \in A^{c} \cup B$. Conversely, suppose $x \in A^{c} \cup B$. If
      $x \in A^{c}$ then $x \in U$ and $x \notin A$, so $x \notin A \setminus
      B$. If $x \in B$ then $x \in U$ — here the hypothesis $B \subseteq U$ is
      load-bearing, since otherwise $x$ need not be in the universe at all — and
      $x \notin A \setminus B$ because every element of that set avoids $B$.
      Either way $x \in (A \setminus B)^{c}$. Both containments hold. The
      identity is De Morgan applied to the intersection $A \cap B^{c}$, together
      with the involution $(B^{c})^{c} = B$.
    rubric:
      - >
        Rewrites $A \setminus B$ as $A \cap B^{c}$, or works directly with the
        conditions "$x \in A$ and $x \notin B$".
      - >
        Negates the conjunction into a disjunction, and swaps the operation —
        the complement of an intersection is a union of complements.
      - >
        Uses $B \subseteq U$ in the reverse containment, and says where: an
        element of $B$ has to be known to lie in $U$ before it can lie in a
        complement taken inside $U$.
    targets:
      - foundations.sets.de-morgan
    exercises:
      - foundations.sets.def-complement
      - foundations.sets.def-difference
    connects: []
    tags: []

  - id: sets-de-morgan-02
    kind: work
    difficulty: standard
    statement: >
      Let $U = \{1, 2, \dots, 60\}$, let $A$ be the multiples of $4$ in $U$ and
      $B$ the multiples of $10$ in $U$. How many elements does $A^{c} \cap
      B^{c}$ have?
    answer: >
      $42$. De Morgan converts the awkward side into an easy one: $A^{c} \cap
      B^{c} = (A \cup B)^{c}$, so count the union and subtract from $|U| = 60$.
      Now $|A| = 60/4 = 15$ and $|B| = 60/10 = 6$, and their overlap is the
      multiples of $20$, the least common multiple of $4$ and $10$, of which
      there are $60/20 = 3$. So $|A \cup B| = 15 + 6 - 3 = 18$ and the answer is
      $60 - 18 = 42$. Complementing without swapping the operation is the error
      the law exists to prevent: $(A \cap B)^{c}$ has $60 - 3 = 57$ elements,
      nowhere near $42$.
    expects: "42"
    rubric:
      - >
        Rewrites $A^{c} \cap B^{c}$ as $(A \cup B)^{c}$ rather than as
        $(A \cap B)^{c}$ — the operation swaps.
      - >
        Counts $|A \cup B|$ with the overlap subtracted once, using multiples of
        $20$ and not of $40$.
    targets:
      - foundations.sets.de-morgan
    exercises:
      - foundations.sets.def-complement
      - foundations.sets.def-union
    connects: []
    tags: []

  - id: sets-intuition-venn-01
    kind: work
    difficulty: demanding
    statement: >
      In a fully general Venn diagram of three sets $A$, $B$, $C$ inside a
      universe, how many of the eight atoms does $(A \cup B) \cap C^{c}$ shade?
    answer: >
      $3$. Label each atom by the complete answer to "which of the three sets
      contains this element?", so the atoms correspond to the eight subsets of
      $\{A, B, C\}$. An element lies in the expression exactly when it lies in
      $A$ or in $B$, and does not lie in $C$. The condition on $C$ removes the
      four atoms in which $C$ is present, leaving the four atoms with $C$
      absent: none, $A$ only, $B$ only, and $A$ and $B$. Of those four, the
      condition "in $A$ or in $B$" keeps three and discards the atom belonging
      to no set. So the expression shades $3$ atoms. Answering $6$ counts the
      atoms of $A \cup B$ and forgets $C^{c}$; answering $4$ applies $C^{c}$ and
      forgets to discard the atom outside both $A$ and $B$.
    expects: "3"
    rubric:
      - >
        Treats an atom as one complete inside-or-outside answer for all three
        sets, so there are $2^{3} = 8$ of them.
      - >
        Applies both conditions — at least one of $A$, $B$ present, and $C$
        absent — instead of only one.
    targets:
      - foundations.sets.intuition-venn
    exercises:
      - foundations.sets.def-union
      - foundations.sets.def-complement
    connects: []
    tags: []

  - id: sets-intuition-venn-02
    kind: work
    difficulty: standard
    statement: >
      In a fully general Venn diagram of four sets, how many atoms consist of
      the elements lying in exactly two of the four sets?
    answer: >
      $6$. Each atom is one complete answer to "which of the four sets contains
      this element?", so the atoms correspond to the subsets of the
      four-element collection of sets, and there are $2^{4} = 16$ of them. The
      atoms wanted are those naming exactly two of the four, and the number of
      two-element subsets of a four-element collection is $\binom{4}{2} = 6$.
      As a check, grouping all sixteen atoms by how many sets they name gives
      $1, 4, 6, 4, 1$, which sums to $16$. A practical warning goes with the
      count: no arrangement of four circles in the plane realizes all sixteen
      regions, so at $n = 4$ the diagram silently drops cases and the argument
      must return to symbols.
    expects: "6"
    rubric:
      - >
        Identifies atoms with complete membership answers, giving $2^{4} = 16$
        in total.
      - >
        Counts the atoms naming exactly two sets as $\binom{4}{2} = 6$, and
        checks the row $1, 4, 6, 4, 1$ against the total.
    targets:
      - foundations.sets.intuition-venn
    exercises: []
    connects: []
    tags: []

  # --- indexed families -------------------------------------------------------

  - id: sets-indexed-family-01
    kind: work
    difficulty: demanding
    statement: >
      Let $I = \{1, 2, 3, 4, 5, 6, 7, 8\}$ and, for $i \in I$, let $A_i$ be the
      set of multiples of $3$ lying in $\{\, n \in \mathbb{Z} : 0 \le n \le i
      \,\}$. How many *distinct* sets occur among the eight members of the
      family?
    answer: >
      $3$. Write the members out. For $i = 1$ and $i = 2$ the only multiple of
      $3$ in range is $0$, so $A_1 = A_2 = \{0\}$. From $i = 3$ up to $i = 5$
      the number $3$ has joined and $6$ has not, so $A_3 = A_4 = A_5 =
      \{0, 3\}$. From $i = 6$ to $i = 8$ the set is $\{0, 3, 6\}$, since $9$ is
      still out of range. Eight indices, so eight members — a family is the
      assignment, and its size is the size of $I$ — but only three different
      sets occur among them: $\{0\}$, $\{0,3\}$ and $\{0,3,6\}$. Answering $8$
      counts members rather than values, which is the distinction the question
      turns on; a family is not the collection of its distinct values, and the
      same set may be carried by several indices.
    expects: "3"
    rubric:
      - >
        Computes each $A_i$ and notices which indices repeat a value.
      - >
        Counts distinct values, not members — the family still has eight
        members, one per index.
    targets:
      - foundations.sets.indexed-family
    exercises: []
    connects: []
    tags: []

  - id: sets-indexed-family-02
    kind: decide
    difficulty: standard
    statement: >
      Which one of the following fails to be an indexed family of sets?
    answer: >
      The assignment $x \mapsto \{x\}$ taken over all sets whatsoever. A family
      is an assignment of a set to each element of an *index set*, so the labels
      must themselves form a set before anything can be assigned — and there is
      no set of all sets, as Russell's argument shows. The other three are
      ordinary families. Indices need not be numbers: colours do perfectly well.
      They need not be countable: the assignment $t \mapsto [0,t]$ over the
      positive reals is a standard example, and handling index sets that large
      is the whole reason for the definition. And distinct indices need not
      carry distinct sets, so a constant family is legitimate.
    choices:
      - text: >
          $t \mapsto [0, t]$, for $t$ ranging over the positive real numbers
        feedback: >
          A perfectly ordinary family. Nothing in the definition asks the index
          set to be finite or countable; that generality is the point.
      - text: >
          $c \mapsto S_c$, for $c$ ranging over a set of three colours
        feedback: >
          Indices are labels and need not be numbers. Any set at all may serve
          as an index set.
      - text: >
          $x \mapsto \{x\}$, for $x$ ranging over all sets whatsoever
        correct: true
        feedback: >
          There is no set of all sets, so there is no index set here. A family
          needs its labels to form a set before it can assign anything to them.
      - text: >
          $n \mapsto \emptyset$, for $n \in \mathbb{N}$
        feedback: >
          A constant family. Repeated values are allowed and change nothing —
          the family still has one member per index.
    rubric:
      - >
        Checks the index set is a set, not merely a description, before checking
        the assignment.
      - >
        Accepts uncountable index sets, non-numeric labels and repeated values
        as ordinary.
    targets:
      - foundations.sets.indexed-family
    exercises: []
    connects: []
    tags: []

  - id: sets-indexed-union-01
    kind: work
    difficulty: demanding
    statement: >
      Let $I = \{2, 3, 4, 5\}$ and, for $i \in I$, let $A_i$ be the set of
      multiples of $i$ in $X = \{1, 2, \dots, 20\}$. How many elements does
      $\bigcup_{i \in I} A_i$ have?
    answer: >
      $14$. Membership in the union needs one witnessing index, so the union is
      the set of elements of $X$ divisible by at least one of $2, 3, 4, 5$.
      The index $4$ contributes nothing new, since every multiple of $4$ is
      already a multiple of $2$ — that is, $A_4 \subseteq A_2$ — so the
      condition reduces to divisibility by $2$, $3$ or $5$. Counting the
      complement is quickest: the elements of $X$ divisible by none of them are
      $1, 7, 11, 13, 17, 19$, six numbers, so the union has $20 - 6 = 14$
      elements. Counting directly agrees, with the overlaps removed once each:
      $10 + 6 + 4 - 3 - 2 - 1 + 0 = 14$, the subtracted terms being the
      multiples of $6$, $10$ and $15$ and no number up to $20$ being a multiple
      of $30$.
    expects: "14"
    rubric:
      - >
        Uses that one index suffices, so the union asks for divisibility by at
        least one of the four.
      - >
        Notices $A_4 \subseteq A_2$, so the index $4$ adds nothing, and removes
        the remaining overlaps exactly once.
    targets:
      - foundations.sets.indexed-union
    exercises:
      - foundations.sets.indexed-family
    connects: []
    tags: []

  - id: sets-indexed-union-02
    kind: decide
    difficulty: standard
    statement: >
      For each integer $n \ge 1$ let $A_n = \{\, x \in \mathbb{R} : -n < x < n
      \,\}$. What is $\bigcup_{n \ge 1} A_n$?
    answer: >
      $\mathbb{R}$. Membership in an indexed union is witnessed by a single
      index, so it is enough to produce, for a given real $x$, one $n$ with
      $x \in A_n$ — and any integer $n$ exceeding $|x|$ will do. That covers
      every real number, so $\mathbb{R} \subseteq \bigcup_{n \ge 1} A_n$; the
      reverse containment is immediate, since each $A_n$ consists of reals.
      Notice what the union does that no single member does: every member is
      bounded, and the union is not. A property shared by every member of a
      family need not survive the pooling.
    choices:
      - text: >
          $\mathbb{R}$
        correct: true
        feedback: >
          Any real $x$ lies in $A_n$ as soon as $n > |x|$, and one witnessing
          index is all a union asks for. Boundedness of each member does not
          survive.
      - text: >
          $\{\, x \in \mathbb{R} : -1 < x < 1 \,\}$
        feedback: >
          That is $A_1$, the smallest member, and it is what the *intersection*
          of this family comes to. A union is at least as large as every member.
      - text: >
          It is undefined, because the index set is infinite
        feedback: >
          Nothing limits the size of the index set — handling infinitely many
          sets at once is why families were introduced. Only the *intersection*
          carries a hypothesis, and it excludes an empty index set, not an
          infinite one.
    rubric:
      - >
        Establishes membership by exhibiting a single index, not by checking
        every member.
      - >
        Distinguishes the union from the intersection of the same family, and
        notes that boundedness is not inherited.
    targets:
      - foundations.sets.indexed-union
    exercises:
      - foundations.sets.indexed-family
    connects: []
    tags: []

  - id: sets-indexed-intersection-01
    kind: work
    difficulty: demanding
    statement: >
      Let $I = \{2, 3, 4, 5\}$ and, for $i \in I$, let $A_i$ be the set of
      multiples of $i$ in $X = \{1, 2, \dots, 300\}$. How many elements does
      $\bigcap_{i \in I} A_i$ have?
    answer: >
      $5$. Membership in the intersection is a universal claim: $x$ must lie in
      $A_i$ for *every* $i \in I$, so $x$ must be divisible by $2$, $3$, $4$ and
      $5$ at once. That is divisibility by the least common multiple of the
      four, which is $60$ — the index $4$ demands two factors of $2$, and the
      primes $3$ and $5$ are demanded once each — and not by the product
      $2 \cdot 3 \cdot 4 \cdot 5 = 120$, which counts the factor $2$ twice
      over. The multiples of $60$ up to $300$ are $60, 120, 180, 240, 300$, so
      the intersection has $5$ elements. Note how cheap refutation is by
      comparison: confirming that $180$ belongs meant checking all four
      indices, while ruling out $90$ needed only the single observation that
      $4$ does not divide it.
    expects: "5"
    rubric:
      - >
        Reads the intersection as all four divisibility conditions holding at
        once, and converts that into divisibility by their least common
        multiple.
      - >
        Uses $60$, not the product $120$ — the index $4$ subsumes the index $2$.
    targets:
      - foundations.sets.indexed-intersection
    exercises:
      - foundations.sets.indexed-family
    connects: []
    tags: []

  - id: sets-indexed-intersection-02
    kind: decide
    difficulty: standard
    statement: >
      For each integer $n \ge 1$ let $A_n = \{\, k \in \mathbb{Z} : k \ge n
      \,\}$. What is $\bigcap_{n \ge 1} A_n$?
    answer: >
      $\emptyset$. Membership demands $k \in A_n$ for every $n \ge 1$, and any
      particular integer $k$ fails that as soon as $n > k$: it lies outside
      $A_{k+1}$. One failing index is a complete refutation, so no integer
      survives and the intersection is empty. Every member of the family is
      nonempty and the family is decreasing, $A_1 \supseteq A_2 \supseteq
      \cdots$, so this is the warning the definition carries: a shrinking family
      of nonempty sets can share nothing at all. The index set here is infinite,
      which is permitted; only an *empty* index set is excluded, and for a
      different reason — over an empty family the condition would be satisfied
      vacuously by every object.
    choices:
      - text: >
          $\emptyset$
        correct: true
        feedback: >
          Each integer $k$ drops out at the index $k+1$, and one failing index
          suffices to keep it out — so nothing survives every member.
      - text: >
          $\{1\}$
        feedback: >
          $1 \notin A_2$, since $A_2$ starts at $2$. Membership in an
          intersection needs every index, and this one already fails.
      - text: >
          $A_1$, the integers $k \ge 1$
        feedback: >
          That is the largest member, which is what the *union* of this
          decreasing family comes to. An intersection sits inside every member.
      - text: >
          Undefined, since the index set is infinite
        feedback: >
          Only an empty index set is excluded, and because the condition would
          then hold vacuously for everything. Infinite index sets are exactly
          what the definition is for.
    rubric:
      - >
        Refutes membership with a single failing index rather than checking all
        of them.
      - >
        Says explicitly that nonemptiness of every member does not force a
        nonempty intersection.
    targets:
      - foundations.sets.indexed-intersection
    exercises:
      - foundations.sets.indexed-family
    connects: []
    tags: []

  - id: sets-de-morgan-indexed-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $C$ be a set and let $\{A_i\}_{i \in I}$ be a family of subsets of
      $C$ with $I$ nonempty. Prove that
      $\bigcap_{i \in I} A_i = C \setminus \bigcup_{i \in I} (C \setminus A_i)$.
    answer: >
      Apply the indexed De Morgan law to the right-hand side: for any family
      $\{B_i\}$ of sets, $C \setminus \bigcup_{i \in I} B_i = \bigcap_{i \in I}
      (C \setminus B_i)$, because "no index puts $x$ in some $B_i$" is the same
      statement as "every index keeps $x$ out of $B_i$" — negating "there
      exists" gives "for all, not". Taking $B_i = C \setminus A_i$ turns the
      right-hand side into the intersection over $i \in I$ of the sets
      $C \setminus (C \setminus A_i)$. Now evaluate that inner double
      difference. By definition
      $C \setminus (C \setminus A_i) = \{\, x \in C : x \notin C \setminus A_i
      \,\}$, and for $x \in C$ the condition $x \notin C \setminus A_i$ says
      exactly $x \in A_i$; hence the inner set is $A_i \cap C$, which is $A_i$
      *because* $A_i \subseteq C$. That hypothesis is load-bearing: without it,
      elements of $A_i$ outside $C$ would be lost and the identity would fail.
      Substituting, the right-hand side is $\bigcap_{i \in I} A_i$, as claimed.
      The hypothesis $I \ne \emptyset$ is what makes both intersections sets at
      all.
    rubric:
      - >
        Applies the indexed De Morgan law with the operation swapped — a
        complemented union becomes an intersection of complements.
      - >
        Justifies the swap by negating the existential quantifier, not by
        analogy with the two-set law.
      - >
        Evaluates $C \setminus (C \setminus A_i)$ as $A_i$ and names
        $A_i \subseteq C$ as the step that needs it.
    targets:
      - foundations.sets.de-morgan-indexed
    exercises:
      - foundations.sets.indexed-union
      - foundations.sets.indexed-intersection
    connects: []
    tags: []

  - id: sets-de-morgan-indexed-02
    kind: work
    difficulty: standard
    statement: >
      Let $C = \{1, 2, \dots, 100\}$, let $I = \{2, 5, 7\}$ and, for $i \in I$,
      let $A_i$ be the set of multiples of $i$ in $C$. How many elements does
      $\bigcap_{i \in I} (C \setminus A_i)$ have?
    answer: >
      $34$. De Morgan for families turns the intersection of differences into a
      single difference: $\bigcap_{i \in I} (C \setminus A_i) = C \setminus
      \bigcup_{i \in I} A_i$, so the answer counts the elements of $C$
      divisible by none of $2$, $5$, $7$. Size the union with the overlaps
      removed exactly once. Singly: $100/2 = 50$, $100/5 = 20$, and $14$
      multiples of $7$ up to $100$. Pairwise: $10$ multiples of $10$, $7$
      multiples of $14$, $2$ multiples of $35$. Triply: $1$ multiple of $70$. So
      the union has $50 + 20 + 14 - 10 - 7 - 2 + 1 = 66$ elements, and the
      answer is $100 - 66 = 34$. Complementing without swapping the operation
      would compute $C \setminus \bigcap_{i} A_i$ instead, which has $99$
      elements — only $70$ is divisible by all three.
    expects: "34"
    rubric:
      - >
        Rewrites the intersection of the differences as $C \setminus
        \bigcup_{i \in I} A_i$, swapping the operation.
      - >
        Counts the union with each overlap removed exactly once, including the
        multiples of $70$ added back at the end.
    targets:
      - foundations.sets.de-morgan-indexed
    exercises:
      - foundations.sets.indexed-union
      - foundations.sets.de-morgan
    connects: []
    tags: []

  # --- power sets, pairs and products -----------------------------------------

  - id: sets-power-set-01
    kind: decide
    difficulty: demanding
    statement: >
      Let $A = \{1, \{1\}\}$. Exactly one of the following is false. Which?
    answer: >
      $1 \in \mathcal{P}(A)$ is the false one. The translation rule is that
      $S \in \mathcal{P}(A)$ means exactly $S \subseteq A$, and the number $1$
      is not a set, so it has no elements to chase and $\subseteq$ does not
      apply to it. What corresponds to the element $1$ of $A$ is the singleton
      $\{1\}$, one level up. The other three hold. $\{1\} \subseteq A$ because
      $1 \in A$; $\{\{1\}\} \subseteq A$ because $\{1\} \in A$; and
      $A \subseteq A$ always, so a set always belongs to its own power set.
      Writing $\mathcal{P}(A)$ out settles it: its four elements are
      $\emptyset$, $\{1\}$, $\{\{1\}\}$ and $\{1, \{1\}\}$, and the number $1$
      is not among them.
    choices:
      - text: >
          $\{1\} \in \mathcal{P}(A)$
        feedback: >
          True: it says $\{1\} \subseteq A$, and the only element of $\{1\}$ is
          $1$, which is an entry of $A$.
      - text: >
          $\{\{1\}\} \in \mathcal{P}(A)$
        feedback: >
          True: it says $\{\{1\}\} \subseteq A$, and the only element of that
          set is $\{1\}$, which is an entry of $A$.
      - text: >
          $1 \in \mathcal{P}(A)$
        correct: true
        feedback: >
          False. Elements of a power set are subsets, and $1$ is a number, not
          a set — what corresponds to it is the singleton $\{1\}$.
      - text: >
          $A \in \mathcal{P}(A)$
        feedback: >
          True: $A \subseteq A$ always, so a set is always a member of its own
          power set.
    rubric:
      - >
        Converts each claim $S \in \mathcal{P}(A)$ into $S \subseteq A$ before
        judging it.
      - >
        Sees that passing to the power set raises every level by one, so an
        element $x$ of $A$ appears there as $\{x\}$ and not as $x$.
    targets:
      - foundations.sets.power-set
    exercises:
      - foundations.sets.def-subset
    connects: []
    tags: []

  - id: sets-power-set-02
    kind: work
    difficulty: standard
    statement: >
      A set $A$ has $7$ elements and $a$ is one of them. How many elements of
      $\mathcal{P}(A)$ contain $a$?
    answer: >
      $64$. An element of $\mathcal{P}(A)$ is a subset of $A$, and building one
      means deciding independently for each of the $7$ elements whether to
      include it. Requiring $a$ to be included fixes one decision and leaves the
      other $6$ free, so there are $2^{6} = 64$ such subsets. Equivalently, the
      subsets containing $a$ and those omitting it are in one-to-one
      correspondence — delete $a$, or put it back — so exactly half of the
      $2^{7} = 128$ subsets contain $a$, and $128/2 = 64$. Answering $128$
      counts every subset and forgets the constraint; answering $6$ counts the
      remaining elements rather than the subsets they generate.
    expects: "64"
    rubric:
      - >
        Treats a subset as one independent include-or-not decision per element,
        with $a$'s decision fixed.
      - >
        Reports $2^{6} = 64$, not $2^{7}$ and not $6$.
    targets:
      - foundations.sets.power-set
    exercises:
      - foundations.sets.def-subset
    connects: []
    tags: []

  - id: sets-ex-power-set-01
    kind: work
    difficulty: demanding
    statement: >
      How many subsets of a five-element set have an odd number of elements?
    answer: >
      $16$. Sort the subsets by size, which is the discipline that stops one
      being dropped: the counts are $\binom{5}{k}$ for $k = 0, \dots, 5$, namely
      $1, 5, 10, 10, 5, 1$, and they sum to $2^{5} = 32$ as they must. The odd
      sizes are $k = 1, 3, 5$, contributing $5 + 10 + 1 = 16$. The even sizes
      contribute $1 + 10 + 5 = 16$ as well, and that is not an accident: pairing
      each subset with the one obtained by adding or removing a fixed element
      changes the parity of its size, so it matches the odd subsets with the
      even ones exactly. Answering $15$ usually comes from forgetting that the
      whole five-element set is itself a subset of odd size.
    expects: "16"
    rubric:
      - >
        Lists the subsets by size and uses the row $1, 5, 10, 10, 5, 1$, whose
        total is $2^{5} = 32$.
      - >
        Includes the size-$5$ subset — the whole set — among the odd ones.
    targets:
      - foundations.sets.ex-power-set
    exercises:
      - foundations.sets.power-set
    connects: []
    tags: []

  - id: sets-ex-power-set-02
    kind: work
    difficulty: standard
    statement: >
      How many elements does $\mathcal{P}(\mathcal{P}(\{a\}))$ have?
    answer: >
      $4$. Work outwards. The inner power set is $\mathcal{P}(\{a\}) =
      \{\emptyset, \{a\}\}$: the subsets of a one-element set are the empty set
      and the set itself, and those are two different objects, one with no
      elements and one with an element. So the inner power set has $2$ elements,
      and the outer one has $2^{2} = 4$; written out, they are $\emptyset$,
      $\{\emptyset\}$, $\{\{a\}\}$ and $\{\emptyset, \{a\}\}$. Answering $2$
      applies the power-set operation only once; answering $1$ usually comes
      from the slip $\mathcal{P}(\emptyset) = \emptyset$, which is false —
      $\emptyset$ has exactly one subset, itself.
    expects: "4"
    rubric:
      - >
        Evaluates the inner power set first and finds it has two elements, not
        one.
      - >
        Applies the doubling rule once per level, giving $2^{2} = 4$ rather than
        $2$.
    targets:
      - foundations.sets.ex-power-set
    exercises:
      - foundations.sets.power-set
      - foundations.sets.empty-set
    connects: []
    tags: []

  - id: sets-ordered-pair-01
    kind: justify
    difficulty: demanding
    statement: >
      Kuratowski's encoding sets $(a,b) = \{\{a\}, \{a,b\}\}$. Suppose $a \ne b$
      and $c \ne d$, and suppose $\{\{a\}, \{a,b\}\} = \{\{c\}, \{c,d\}\}$.
      Prove that $a = c$ and $b = d$.
    answer: >
      Since $a \ne b$, the two entries on the left have different sizes:
      $\{a\}$ has one element and $\{a,b\}$ has two. The same holds on the
      right, using $c \ne d$. Now use extensionality on the outer sets: equal
      sets have the same elements, so $\{a\}$, being an element of the left-hand
      set, is an element of the right-hand set, hence equal to $\{c\}$ or to
      $\{c,d\}$. It cannot be $\{c,d\}$, which has two elements while $\{a\}$
      has one. So $\{a\} = \{c\}$, and comparing elements gives $a = c$. The
      same argument applied to $\{a,b\}$ rules out $\{c\}$ on size grounds, so
      $\{a,b\} = \{c,d\}$; substituting $c = a$, this reads $\{a,b\} =
      \{a,d\}$. Finally $b \in \{a,b\} = \{a,d\}$, so $b = a$ or $b = d$; the
      first is excluded by $a \ne b$, so $b = d$. The load-bearing move
      throughout is the size argument: it is what forces the one-element entries
      to match each other, and once they do, the two-element entries must match
      as well.
    rubric:
      - >
        Uses $a \ne b$ and $c \ne d$ to give the entries different sizes, and
        matches one-element entry to one-element entry on that ground.
      - >
        Deduces $a = c$ from $\{a\} = \{c\}$ before comparing the two-element
        entries.
      - >
        Excludes $b = a$ at the last step by invoking the hypothesis $a \ne b$,
        rather than assuming $b = d$ directly.
    targets:
      - foundations.sets.ordered-pair
    exercises:
      - foundations.sets.def-set-membership
    connects: []
    tags: []

  - id: sets-ordered-pair-02
    kind: work
    difficulty: standard
    statement: >
      For how many ordered pairs $(a,b)$ with $a$ and $b$ both drawn from
      $\{1,2,3\}$ does $(a,b) = (b,a)$ hold?
    answer: >
      $3$. The defining property compares coordinates in order: $(a,b) = (b,a)$
      holds if and only if $a = b$ and $b = a$, which is the single condition
      $a = b$. With both coordinates drawn from a three-element set, the pairs
      satisfying it are $(1,1)$, $(2,2)$ and $(3,3)$, so there are $3$ of them.
      Answering $9$ treats every pair as symmetric, which is what the unordered
      $\{a,b\}$ would do — $\{1,2\} = \{2,1\}$, whereas $(1,2) \ne (2,1)$
      because the first coordinates differ. Note also that $(1,1)$ is a
      perfectly good pair with two coordinates that happen to agree, unlike
      $\{1,1\}$, which collapses to the one-element set $\{1\}$.
    expects: "3"
    rubric:
      - >
        Reduces $(a,b) = (b,a)$ to $a = b$ using the defining property,
        coordinate by coordinate.
      - >
        Counts the three diagonal pairs, and does not discard $(1,1)$ on the
        grounds that its coordinates repeat.
    targets:
      - foundations.sets.ordered-pair
    exercises: []
    connects: []
    tags: []

  - id: sets-cartesian-product-01
    kind: work
    difficulty: demanding
    statement: >
      Let $A = \{1,2,3,4\}$ and $B = \{1,2,3\}$. How many elements $(a,b)$ of
      $A \times B$ satisfy $a > b$?
    answer: >
      $6$. The elements of $A \times B$ are the ordered pairs with first entry
      in $A$ and second in $B$, so there are $|A| \cdot |B| = 4 \cdot 3 = 12$
      of them in all; the condition $a > b$ selects some of those. Count by
      first entry, which is legitimate because a pair is determined by its two
      coordinates and no pair is counted twice: $a = 1$ admits no $b$, since no
      element of $B$ is below $1$; $a = 2$ admits $b = 1$, one pair; $a = 3$
      admits $b = 1, 2$, two pairs; $a = 4$ admits $b = 1, 2, 3$, three pairs.
      The total is $0 + 1 + 2 + 3 = 6$. As a cross-check, the pairs with
      $a = b$ number $3$ and those with $a < b$ number $3$, and
      $6 + 3 + 3 = 12$.
    expects: "6"
    rubric:
      - >
        Treats an element of the product as an ordered pair, so that $(3,1)$ and
        $(1,3)$ are different objects and only one of them is counted.
      - >
        Counts systematically by first entry and checks the total against
        $|A| \cdot |B| = 12$.
    targets:
      - foundations.sets.cartesian-product
    exercises:
      - foundations.sets.ordered-pair
    connects: []
    tags: []

  - id: sets-cartesian-product-02
    kind: work
    difficulty: standard
    statement: >
      A set $A$ has $7$ elements, and $A \times B$ has $42$ elements. How many
      elements does $B$ have?
    answer: >
      $6$. For finite factors the product has $|A \times B| = |A| \cdot |B|$
      elements, because choosing a pair means choosing a first entry in $|A|$
      ways and then, independently, a second in $|B|$ ways — and different
      choices give different pairs, since pairs agree only coordinate by
      coordinate, so nothing is counted twice. Here $7 \cdot |B| = 42$, so
      $|B| = 6$. The relation is multiplicative, never additive: answering $35$
      would come from $42 - 7$, which would be the size of a difference rather
      than of a factor. Note that $B \times A$ also has $42$ elements, since
      multiplication does not care about order — but it is a different set,
      because its pairs are reversed.
    expects: "6"
    rubric:
      - >
        Uses $|A \times B| = |A| \cdot |B|$ and solves for $|B|$ by division,
        not by subtraction.
      - >
        Justifies the product rule by the independence of the two coordinate
        choices.
    targets:
      - foundations.sets.cartesian-product
    exercises:
      - foundations.sets.ordered-pair
    connects: []
    tags: []

  - id: sets-cartesian-product-03
    kind: decide
    difficulty: routine
    statement: >
      Let $A = \{0,1\}$ and $B = \{1,2\}$. Which of the following is an element
      of $A \times B$?
    answer: >
      $(1,2)$. Membership in $A \times B$ asks for an ordered pair whose first
      entry lies in $A$ and whose second lies in $B$, and $(1,2)$ satisfies
      both: $1 \in A$ and $2 \in B$. The others fail one test each. In $(2,1)$
      the first entry $2$ is not in $A$, so it cannot be a first entry here;
      that pair lies in $B \times A$, a different set. The object $\{1,2\}$ is a
      two-element set, not a pair, and the product's elements are pairs — the
      construction exists precisely to record which entry comes first. And in
      $(0,0)$ the first entry is fine but $0 \notin B$, so the second entry
      disqualifies it. Writing the product out, $A \times B = \{(0,1), (0,2),
      (1,1), (1,2)\}$.
    choices:
      - text: >
          $(1,2)$
        correct: true
        feedback: >
          $1 \in A$ and $2 \in B$, which is exactly what membership in
          $A \times B$ requires of the two entries.
      - text: >
          $(2,1)$
        feedback: >
          $2 \notin A$, so it cannot be a first entry. This pair belongs to
          $B \times A$, which is a different set — the product does not commute.
      - text: >
          $\{1,2\}$
        feedback: >
          The elements of a product are ordered pairs, not two-element sets. An
          unordered pair records no first entry.
      - text: >
          $(0,0)$
        feedback: >
          The first entry is in $A$, but $0 \notin B$, so the second entry
          fails. Both coordinates have to come from the right factor.
    rubric:
      - >
        Tests both coordinates against the correct factor, in the correct order.
      - >
        Rejects the unordered $\{1,2\}$ as the wrong kind of object.
    targets:
      - foundations.sets.cartesian-product
    exercises:
      - foundations.sets.ordered-pair
    connects: []
    tags: []

  # --- disjointness, partitions, and the limits of comprehension --------------

  - id: sets-disjoint-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $A_1$, $A_2$, $A_3$ be sets. Prove that if the family is pairwise
      disjoint then $A_1 \cap A_2 \cap A_3 = \emptyset$, and show by an explicit
      example that the converse fails.
    answer: >
      Forward. Suppose the family is pairwise disjoint; in particular
      $A_1 \cap A_2 = \emptyset$. Any $x$ lying in all three sets lies in
      particular in $A_1$ and in $A_2$, hence in $A_1 \cap A_2$, which has no
      elements — so no such $x$ exists and $A_1 \cap A_2 \cap A_3 = \emptyset$.
      Only one of the three pairwise conditions was needed, which already
      signals that the implication is lossy. Converse. Take $A_1 = \{1,2,3\}$,
      $A_2 = \{3,4\}$ and $A_3 = \{4,1\}$. An element of all three would have to
      lie in $A_1$ and $A_3$, so it is $1$; but $1 \notin A_2$, so the triple
      intersection is empty. Yet no two of these sets are disjoint:
      $A_1 \cap A_2 = \{3\}$, $A_2 \cap A_3 = \{4\}$ and $A_1 \cap A_3 =
      \{1\}$. So empty intersection over the whole family is strictly weaker
      than pairwise disjointness, and the two must never be interchanged — it is
      pairwise disjointness that licenses adding sizes and splitting into
      non-overlapping cases.
    rubric:
      - >
        Proves the implication from a single pairwise condition, by showing any
        common element would lie in $A_1 \cap A_2$.
      - >
        Exhibits three concrete sets and computes all three pairwise
        intersections, not just one, to establish that none is empty.
      - >
        Checks that the triple intersection of the example really is empty,
        rather than asserting it.
    targets:
      - foundations.sets.disjoint
    exercises:
      - foundations.sets.def-intersection
      - foundations.sets.empty-set
    connects: []
    tags: []

  - id: sets-disjoint-02
    kind: work
    difficulty: standard
    statement: >
      $A$ and $B$ are disjoint subsets of $X = \{1, 2, \dots, 20\}$ with
      $|A| = 8$ and $|B| = 7$. How many elements of $X$ lie in neither $A$ nor
      $B$?
    answer: >
      $5$. Disjointness says $A \cap B = \emptyset$, so every element of
      $A \cup B$ lies in exactly one of the two and no element is counted twice:
      $|A \cup B| = 8 + 7 = 15$, with no correction term. Since both sets sit
      inside $X$, the elements lying in neither are those of $X \setminus
      (A \cup B)$, numbering $20 - 15 = 5$. The hypothesis is doing real work
      here. Without it, all that could be said is $|A \cup B| \le 15$, so the
      answer would only be known to be at least $5$ — and if, say, $A$ and $B$
      shared three elements, it would be $8$ instead.
    expects: "5"
    rubric:
      - >
        Uses disjointness to add the two sizes with no correction term.
      - >
        Subtracts from $|X| = 20$, and notes that without disjointness only an
        inequality would follow.
    targets:
      - foundations.sets.disjoint
    exercises:
      - foundations.sets.def-intersection
    connects: []
    tags: []

  - id: sets-partition-01
    kind: work
    difficulty: demanding
    statement: >
      How many partitions does the set $\{1,2,3\}$ have?
    answer: >
      $5$. A partition splits the set into nonempty, pairwise disjoint blocks
      whose union is everything, so every element lies in exactly one block;
      enumerate by the number of blocks. One block: the whole set, $\{1,2,3\}$
      — one partition. Two blocks: one block has a single element and the other
      has the remaining two, and the choice of the lone element determines
      everything, giving $\{1\}, \{2,3\}$; $\{2\}, \{1,3\}$; $\{3\}, \{1,2\}$ —
      three partitions. Three blocks: each block must then be a singleton,
      giving $\{1\}, \{2\}, \{3\}$ — one partition. Four or more blocks is
      impossible, since a fourth nonempty block would need a fourth element.
      Total $1 + 3 + 1 = 5$. Note that the blocks are unordered, so listing
      $\{1\}, \{2,3\}$ and $\{2,3\}, \{1\}$ twice would double-count; and
      $\emptyset$ may never be added as an extra block, which is what stops the
      count from being infinite.
    expects: "5"
    rubric:
      - >
        Enumerates by number of blocks and checks each candidate against all
        three conditions.
      - >
        Counts a partition once regardless of the order its blocks are listed
        in, and refuses to pad any partition with an empty block.
    targets:
      - foundations.sets.partition
    exercises:
      - foundations.sets.disjoint
    connects: []
    tags: []

  - id: sets-partition-02
    kind: decide
    difficulty: standard
    statement: >
      A family $\{A_i\}_{i \in I}$ of subsets of $X$ is pairwise disjoint and
      satisfies $\bigcup_{i \in I} A_i = X$, but one of its members is
      $\emptyset$. Which account of the situation is right?
    answer: >
      Only the nonemptiness condition fails, and the cost is bookkeeping rather
      than coverage. An empty block contributes nothing to the union, so
      existence is untouched — every element of $X$ still lies in some block —
      and it meets no other block, since $A_i \cap \emptyset = \emptyset$, so
      disjointness is untouched too. Every element therefore still lies in
      exactly one block, and a case analysis over this family would be perfectly
      sound. What the condition buys is elsewhere: without it, any partition
      could be padded with arbitrarily many empty blocks, and the exact
      correspondence between partitions of $X$ and equivalence relations on $X$
      would be destroyed. So the family is not a partition, and it fails on the
      one condition whose violation is otherwise harmless.
    choices:
      - text: >
          Nonemptiness fails; every element still lies in exactly one block, but
          the correspondence with equivalence relations on $X$ is lost
        correct: true
        feedback: >
          An empty block changes neither the union nor the disjointness. The
          condition exists to stop a partition being padded, which is what
          would break the correspondence.
      - text: >
          Nonemptiness fails, and some element of $X$ now lies in no block
        feedback: >
          The union condition is given as holding, so every element is still
          covered. An empty block takes nothing away.
      - text: >
          Disjointness fails, since the empty block meets every other block
        feedback: >
          $A_i \cap \emptyset = \emptyset$ for every $i$, so an empty block is
          disjoint from everything. It cannot break that condition.
      - text: >
          Nothing fails; an empty block is permitted
        feedback: >
          The definition requires each block to be nonempty, so this family is
          not a partition — even though it is harmless in every other respect.
    rubric:
      - >
        Checks all three conditions separately and locates the failure in
        nonemptiness alone.
      - >
        Says what the nonemptiness condition actually buys, rather than
        attributing a coverage or overlap failure to it.
    targets:
      - foundations.sets.partition
    exercises:
      - foundations.sets.disjoint
      - foundations.sets.indexed-union
    connects: []
    tags: []

  - id: sets-russell-paradox-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $A$ be a set. Prove that there is no set $N$ whose elements are
      exactly the objects not in $A$ — that is, the absolute complement of $A$
      is not a set.
    answer: >
      Suppose such an $N$ existed and put $V = A \cup N$, which is a set,
      unions of sets being an admitted construction. Then $V$ contains every
      object whatsoever: given any $x$, either $x \in A$, and then $x \in V$, or
      $x \notin A$, and then $x \in N$ by the defining property of $N$, so again
      $x \in V$. Now separate inside $V$, which is legitimate because $V$ is a
      set already in hand: let $R = \{\, x \in V : x \notin x \,\}$. Ask whether
      $R \in R$. Unfolding the set-builder, $R \in R$ holds exactly when
      $R \in V$ and $R \notin R$. But $R$ is a set, hence an object, hence an
      element of $V$; so the first condition is true and the equivalence reduces
      to "$R \in R$ if and only if $R \notin R$", which is a contradiction. The
      only assumption used was the existence of $N$, so no such $N$ exists. This
      is exactly why a complement must be taken relative to a named universe:
      $U \setminus A$ is a legitimate separation inside $U$, while "everything
      not in $A$" is the object this argument forbids.
    rubric:
      - >
        Builds a set of all objects from $A$ and the assumed $N$, and checks
        that it really does contain everything.
      - >
        Forms $R$ by separation inside that set, so the construction used is one
        naive set theory allows — the contradiction must not come from an
        illegal step.
      - >
        Derives "$R \in R$ if and only if $R \notin R$" and discharges the
        assumption, concluding that $N$ does not exist rather than that sets are
        inconsistent.
    targets:
      - foundations.sets.russell-paradox
    exercises:
      - foundations.sets.set-builder
      - foundations.proof.contradiction
    connects: []
    tags: []

  - id: sets-russell-paradox-02
    kind: decide
    difficulty: standard
    statement: >
      Which of the following is a legitimate set formation in naive set theory
      as this unit develops it?
    answer: >
      $\{\, x \in \mathbb{Z} : x \notin x \,\}$. It is a separation: it carves a
      subset out of $\mathbb{Z}$, a set already known to exist, so it is exactly
      the admitted form and no contradiction can arise. (It happens to equal
      $\mathbb{Z}$, since no integer is a set having itself as a member, and
      that is the point — the dangerous property is harmless once it is confined
      to a host set.) The other three all drop the host set. There is no set of
      all sets, since separating Russell's collection out of it would reproduce
      the contradiction; the absolute complement is the object shown not to
      exist; and "$x = x$" is satisfied by everything, so the third would be a
      set of all objects. What is inconsistent is unrestricted comprehension,
      not any particular property.
    choices:
      - text: >
          $\{\, x \in \mathbb{Z} : x \notin x \,\}$
        correct: true
        feedback: >
          A separation inside a set already in hand, which is the safe form. The
          property "$x \notin x$" is dangerous only when it is allowed to range
          over everything.
      - text: >
          $\{\, x : x \text{ is a set} \,\}$
        feedback: >
          There is no set of all sets: separating $\{\, x \in V : x \notin x
          \,\}$ out of such a $V$ reproduces Russell's contradiction exactly.
      - text: >
          $\{\, x : x \notin A \,\}$, for a given set $A$
        feedback: >
          The absolute complement, with no host set. This is precisely the
          object that does not exist, which is why a complement needs a named
          universe.
      - text: >
          $\{\, x : x = x \,\}$
        feedback: >
          Everything satisfies this, so it would be the set of all objects. The
          innocence of the property is not the issue; the missing host set is.
    rubric:
      - >
        Applies the separation test — is there a host set already known to
        exist? — to each candidate.
      - >
        Locates the inconsistency in unrestricted comprehension rather than in
        the property "$x \notin x$".
    targets:
      - foundations.sets.russell-paradox
    exercises:
      - foundations.sets.set-builder
    connects: []
    tags: []

  - id: sets-russell-paradox-03
    kind: work
    difficulty: routine
    statement: >
      Let $A$ be a set with $9$ elements, none of which is a member of itself,
      and put $R_A = \{\, x \in A : x \notin x \,\}$. How many elements does
      $R_A$ have?
    answer: >
      $9$. Membership in $R_A$ unfolds into two conditions: $x \in A$, and
      $x \notin x$. By hypothesis every element of $A$ satisfies the second, so
      every element of $A$ passes and $R_A = A$, a set with $9$ elements.
      Nothing paradoxical has happened, because the construction is a separation
      inside a set already in hand. The theorem that goes with it says
      $R_A \notin A$, and here that reads $A \notin A$ — which is consistent
      with the hypothesis rather than in tension with it, and shows that $A$ is
      an example of a set omitted by itself. Answering $0$ reads the condition
      $x \notin x$ as excluding everything; it excludes only the objects that
      are members of themselves, and $A$ was assumed to contain none.
    expects: "9"
    rubric:
      - >
        Unfolds membership in $R_A$ into both conditions and checks the second
        against the hypothesis.
      - >
        Concludes $R_A = A$, and notes that the construction is a legal
        separation, so no contradiction follows.
    targets:
      - foundations.sets.russell-paradox
    exercises:
      - foundations.sets.set-builder
    connects: []
    tags: []
