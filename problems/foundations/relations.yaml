  - id: relations-zorn-01
    kind: decide
    difficulty: demanding
    statement: >
      A student applies Zorn's lemma to the poset $A$ of all *finite* subsets of
      $\mathbb{N}$ ordered by $\subseteq$ and concludes that $A$ has a maximal
      element. Where does the argument break?
    answer: >
      The chain hypothesis fails. Consider the chain
      $\{1\} \subseteq \{1,2\} \subseteq \{1,2,3\} \subseteq \cdots$ inside $A$;
      it is totally ordered by inclusion, so it is a chain, but an upper bound for
      it would have to contain every $\{1,\ldots,k\}$ and hence be infinite, and
      no infinite set belongs to $A$. So the hypothesis "every chain has an upper
      bound in $A$" is not satisfied and Zorn says nothing. And the conclusion is
      genuinely false: for any finite $S \subseteq \mathbb{N}$ the set
      $S \cup \{m\}$ with $m$ larger than everything in $S$ is a strictly bigger
      finite set, so $A$ has no maximal element. The other diagnoses miss.
      $A$ is not empty — $\emptyset$ lies in it. Zorn never asks the poset to be
      totally ordered; that would make the conclusion trivial. And it never asks
      the poset to be finite, which would make it useless.
    choices:
      - text: >
          $A$ is empty
        feedback: >
          $\emptyset$ is a finite subset of $\mathbb{N}$, so $A$ is nonempty. That
          hypothesis holds.
      - text: >
          The chain $\{1\} \subseteq \{1,2\} \subseteq \cdots$ has no upper bound
          in $A$, because its union is infinite
        correct: true
        feedback: >
          Exactly the hypothesis that fails. An upper bound would have to contain
          every initial segment, and $A$ holds only finite sets.
      - text: >
          $A$ is not totally ordered
        feedback: >
          Zorn never requires that. Its whole purpose is to produce maximal
          elements in posets that branch.
      - text: >
          Zorn's lemma requires the poset to be finite
        feedback: >
          The opposite: for finite nonempty posets a maximal element exists with no
          appeal to choice at all.
    rubric:
      - >
        Locates the failure in the chain hypothesis and exhibits a specific
        unbounded chain.
      - >
        Confirms independently that the conclusion is false here, so the gap is
        real and not a defect of the proof.
    targets:
      - foundations.relations.zorn
    exercises:
      - foundations.relations.def-chain
      - foundations.relations.def-bounds-poset
    connects: []
    tags: []

  - id: relations-zorn-02
    kind: justify
    difficulty: demanding
    statement: >
      Let $(A, \le)$ be a poset in which every chain has an upper bound in $A$,
      and let $a_{0} \in A$. Prove that $A$ has a maximal element $m$ satisfying
      $a_{0} \le m$.
    answer: >
      Work in $B = \{x \in A : a_{0} \le x\}$ with the order inherited from $A$.
      It is nonempty, since $a_{0} \le a_{0}$ puts $a_{0}$ in $B$. Now check the
      chain hypothesis inside $B$. Let $C \subseteq B$ be a chain. It is also a
      chain in $A$, so it has an upper bound $b \in A$. If $C$ is nonempty, pick
      $c \in C$; then $a_{0} \le c$ because $c \in B$, and $c \le b$ because $b$
      bounds $C$, so $a_{0} \le b$ by transitivity and $b \in B$. If $C$ is empty,
      $a_{0}$ itself is an upper bound lying in $B$. Either way $C$ has an upper
      bound in $B$, so Zorn's lemma applies to $B$ and yields a maximal element
      $m$ of $B$; and $a_{0} \le m$ because $m \in B$. Finally, $m$ is maximal in
      the whole of $A$: if $m < x$ for some $x \in A$, then $a_{0} \le m \le x$
      gives $x \in B$, contradicting the maximality of $m$ in $B$. So $m$ is the
      required element. The device — restrict the poset, check the hypothesis
      survives, transfer the conclusion back — is how Zorn is used in practice.
    rubric:
      - >
        Applies Zorn to the restricted poset $\{x : a_{0} \le x\}$ rather than to
        $A$, and checks that it is nonempty.
      - >
        Verifies that an upper bound of a chain in $B$ can be taken inside $B$,
        handling the empty chain separately.
      - >
        Transfers maximality back to $A$ by showing any $x$ above $m$ would itself
        lie in $B$.
    targets:
      - foundations.relations.zorn
    exercises:
      - foundations.relations.def-chain
      - foundations.relations.def-bounds-poset
      - foundations.relations.def-maximal-greatest
    connects: []
    tags: []

  - id: relations-zorn-03
    kind: decide
    difficulty: standard
    statement: >
      Zorn's lemma is applied to a nonempty poset in which every chain has an
      upper bound. Which conclusion does it deliver?
    answer: >
      A maximal element exists. That is the exact form of the conclusion, and the
      exactness matters. Zorn does not deliver a greatest element: the poset of
      proper subsets of a set with at least two elements satisfies the hypotheses
      when finite, yet has several pairwise incomparable maximal elements and no
      greatest one. Nor does it deliver uniqueness, for the same reason — the
      conclusion is an existence statement, and typically many maximal elements
      exist. Nor does it well-order anything; the well-ordering theorem is
      equivalent to Zorn's lemma but is a separate statement, and Zorn applied to
      a poset says nothing about ordering that poset linearly. Existence of a
      maximal element is also all that its standard applications need: a maximal
      linearly independent set is a basis, a maximal proper ideal is a maximal
      ideal, and neither claim asks for a greatest object.
    choices:
      - text: >
          A greatest element
        feedback: >
          Too strong. Maximal means nothing lies strictly above; greatest means
          everything lies below, and incomparable maximal elements are common.
      - text: >
          A maximal element
        correct: true
        feedback: >
          Precisely the conclusion, and precisely what applications such as "every
          vector space has a basis" require.
      - text: >
          A unique maximal element
        feedback: >
          Uniqueness is never claimed. The proper subsets of a finite set have
          many maximal elements.
      - text: >
          A well-ordering of the poset
        feedback: >
          That is the well-ordering theorem — equivalent to Zorn's lemma, but a
          different statement, and not what an application of Zorn produces.
    rubric:
      - >
        States the conclusion as maximal, not greatest, and can say what the
        difference costs.
      - >
        Does not confuse Zorn's lemma with the equivalent well-ordering theorem.
    targets:
      - foundations.relations.zorn
    exercises:
      - foundations.relations.def-maximal-greatest
    connects: []
    tags: []
