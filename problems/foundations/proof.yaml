  # --- the quantifier disciplines ---------------------------------------------

  - id: proof-universal-proof-01
    kind: justify
    difficulty: standard
    statement: >
      Prove that $\frac{2x}{1 + x^{2}} \le 1$ for every real number $x$. Point
      out the step that would fail if it needed anything about $x$ beyond its
      being real.
    answer: >
      Let $x$ be an arbitrary real number. First, $1 + x^{2} > 0$: the square of
      a real number is at least $0$, so $1 + x^{2} \ge 1 > 0$, and this holds for
      every real $x$ with no side condition whatever. That is the load-bearing
      observation, because it licenses multiplying both sides of the desired
      inequality by $1 + x^{2}$ without reversing it. So it suffices to prove
      $2x \le 1 + x^{2}$, which rearranges to $0 \le x^{2} - 2x + 1 = (x-1)^{2}$,
      and a real square is at least $0$. Reading the chain forwards:
      $(x-1)^{2} \ge 0$, hence $1 + x^{2} \ge 2x$, hence — dividing by the
      positive number $1 + x^{2}$ — $1 \ge \frac{2x}{1 + x^{2}}$. Nothing in the
      argument used positivity, nonzeroness or rationality of $x$, only that it
      is real, which is exactly the membership the quantifier granted. Had the
      denominator been $x^{2} - 1$, the multiplication step would have required
      knowing its sign, and an arbitrary real does not supply that.
    rubric:
      - >
        Opens by taking $x$ arbitrary in $\mathbb{R}$ and uses no property of $x$
        beyond that.
      - >
        Establishes $1 + x^{2} > 0$ for every real $x$ before multiplying by it,
        rather than multiplying and hoping.
      - >
        Reduces to $(x-1)^{2} \ge 0$ and writes the final chain in the forward
        direction.
    targets:
      - foundations.proof.universal-proof
    exercises:
      - foundations.logic.quantifier-universal
    connects: []
    tags: []

  - id: proof-universal-proof-02
    kind: decide
    difficulty: demanding
    statement: >
      A proof of a claim about every real number opens "let $x$ be an arbitrary
      real number" and, some lines later, multiplies both sides of an inequality
      by $x$, keeping the direction of the inequality. What is wrong?
    answer: >
      Multiplying an inequality by $x$ and keeping its direction is valid only
      when $x > 0$, and an arbitrary real need not be positive. So the step
      quietly assumes something extra about the element that was supposed to be
      arbitrary, and the proof now covers only part of the domain. Concretely, at
      a negative $x$ the direction reverses — from $1 < 2$ multiplying by $-1$
      gives $-1 > -2$, not $-1 < -2$ — and at $x = 0$ both sides collapse to $0$
      and the strict inequality is lost entirely. So two whole regions of the
      domain are unproved, and they are the regions where a claim of this shape
      typically fails. The repair is either to prove that $x > 0$ from the
      hypotheses, if that is available, or to split into cases $x > 0$, $x = 0$
      and $x < 0$ and argue each. Restricting the claim to positive $x$ is not a
      repair; it is a different, weaker statement.
    choices:
      - text: >
          Multiplying preserves the direction only for $x > 0$, and an arbitrary
          real need not be positive — at $x < 0$ it reverses and at $x = 0$ it
          collapses.
        correct: true
        feedback: >
          Right, and note both failures: the sign case reverses the inequality
          and the zero case destroys strictness. Either one leaves part of the
          domain unproved.
      - text: >
          Nothing — multiplying both sides of an inequality by the same quantity
          is always legitimate.
        feedback: >
          It is legitimate only with the sign known. $1 < 2$ multiplied by $-1$
          gives $-1 > -2$, so the direction is not preserved.
      - text: >
          The proof should have taken $x$ to be positive from the outset, which
          costs nothing.
        feedback: >
          That proves a different and weaker claim. The statement quantifies over
          every real, so the negative and zero cases are part of what was
          promised.
      - text: >
          The error is that $x$ appears at all after being declared arbitrary;
          an arbitrary element may not be operated on.
        feedback: >
          Arbitrary elements are operated on constantly — that is how universal
          proofs work. What is barred is using a property they were not granted.
    rubric:
      - >
        Names the missing hypothesis, $x > 0$, and identifies it as a property an
        arbitrary real need not have.
      - >
        Treats $x = 0$ separately from $x < 0$, since the failures there are
        different.
    targets:
      - foundations.proof.universal-proof
    exercises: []
    connects: []
    tags: []

  - id: proof-existence-constructive-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that for every positive integer $k$ there exist $k$ consecutive
      composite positive integers. Make both verifications a constructive
      existence proof owes, and say what your witness is allowed to depend on.
    answer: >
      Let $k$ be an arbitrary positive integer. The witness may depend on $k$,
      since $k$ was introduced before the existence claim is billed, so build it
      out of $k$: take the $k$ consecutive integers $(k+1)! + 2$, $(k+1)! + 3$,
      $\ldots$, $(k+1)! + (k+1)$. Verification one, membership: these are $k$
      consecutive integers, since the terms increase by $1$ from $j = 2$ to
      $j = k+1$, and each is positive because $(k+1)!$ is. Verification two, the
      property: fix $j$ with $2 \le j \le k+1$. Then $j$ is one of the factors of
      $(k+1)! = 1 \cdot 2 \cdots (k+1)$, so $j$ divides $(k+1)!$, and $j$ divides
      itself, so $j$ divides $(k+1)! + j$. Since $2 \le j$ and
      $j < (k+1)! + j$, this exhibits a divisor strictly between $1$ and the
      number itself, so $(k+1)! + j$ is composite. Every one of the $k$ numbers
      is therefore composite. Both checks done, the claim is proved — and
      constructively, since the proof is a machine: feed it $k = 4$ and it hands
      back $122, 123, 124, 125$. Note that the search that found the
      construction never appears; only the two verifications are owed.
    rubric:
      - >
        Exhibits the witness as an explicit formula in $k$, and says that the
        witness may depend on $k$ because $k$ was introduced first.
      - >
        Verifies membership — that the numbers are $k$ consecutive positive
        integers — and does not treat that check as scenery.
      - >
        Verifies compositeness by naming the divisor $j$ and checking it lies
        strictly between $1$ and the number.
    targets:
      - foundations.proof.existence-constructive
    exercises:
      - foundations.logic.quantifier-existential
    connects: []
    tags: []

  - id: proof-existence-constructive-02
    kind: work
    difficulty: standard
    statement: >
      Prove that there exist three consecutive composite positive integers all
      smaller than $12$, by exhibiting a witness and verifying it. Enter the
      first of the three.
    answer: >
      $8$. The witness is the run $8, 9, 10$, and a constructive existence proof
      owes two verifications. Membership: $8$, $9$ and $10$ are consecutive
      positive integers, each smaller than $12$. The property: $8 = 2 \cdot 4$,
      $9 = 3 \cdot 3$ and $10 = 2 \cdot 5$, so each has a divisor strictly
      between $1$ and itself and all three are composite. That is the entire
      proof. It is worth seeing that nothing else in range works, which is why
      the answer is forced: a run starting at $2$, $3$, $5$ or $7$ contains a
      prime immediately, $4, 5, 6$ contains the prime $5$, $6, 7, 8$ contains
      $7$, and $9, 10, 11$ contains $11$. Note also what the proof does not owe —
      an account of how the run was found, which was by scanning the small
      integers, plays no part in the argument.
    expects: "8"
    rubric:
      - >
        Exhibits an actual run rather than arguing that one must exist.
      - >
        Carries out both verifications: that the three numbers are consecutive
        positive integers under $12$, and that each is composite, with a divisor
        named.
    targets:
      - foundations.proof.existence-constructive
    exercises: []
    connects: []
    tags: []

  - id: proof-existence-nonconstructive-01
    kind: justify
    difficulty: standard
    statement: >
      Prove that among any $13$ people, two were born in the same calendar
      month. Then say precisely what the proof leaves you unable to do.
    answer: >
      Suppose, for contradiction, that no two of the $13$ were born in the same
      month. Then the map sending each person to their birth month is injective,
      so the $13$ people occupy $13$ distinct months. But there are only $12$
      months, so at most $12$ distinct months are available, and
      $13 \le 12$ is false. The assumption fails, so two of the people share a
      month. Equivalently and without the contradiction wrapper: the $13$ people
      are distributed among $12$ months, so if every month held at most one
      person the total would be at most $12$, short of $13$. What the proof
      leaves you unable to do is name the pair. It establishes that a coincident
      pair exists while identifying neither person and not even the month; to
      find them you must go and ask, which is separate work using data the proof
      never touched. That is the whole difference between knowing something
      exists and holding it, and the proof is not defective for stopping where it
      does — producing the pair was never part of the statement.
    rubric:
      - >
        Runs the counting argument with the right strict comparison: $13$ people
        against $12$ months, so at most one per month gives at most $12$.
      - >
        States explicitly that the argument identifies no pair and no month, and
        that this is a property of the argument rather than a gap in it.
    targets:
      - foundations.proof.existence-nonconstructive
    exercises:
      - foundations.proof.contradiction
    connects: []
    tags: []

  - id: proof-existence-nonconstructive-02
    kind: decide
    difficulty: demanding
    statement: >
      A counting argument establishes that at most $2^{n}$ of a collection of
      $2^{n}$ objects fail to have property $P$. Does it follow that some object
      has $P$?
    answer: >
      No. The counting route to a non-constructive existence proof works by
      showing that the objects failing $P$ are too few to be all of them, and
      that requires the comparison to be strict. Here the bound permits the
      failures to number exactly $2^{n}$, which is every object in the
      collection, so the bound is consistent with nothing at all having $P$ and
      establishes nothing. The bound is also trivially true of every collection,
      which is a useful smell test: a count that could not have come out any
      other way cannot have ruled anything out. Had the argument shown at most
      $2^{n} - 1$ failures, or at most $2^{n-1}$, the conclusion would follow
      immediately, since the objects failing $P$ would then be fewer than all of
      them and at least one would be left over — still without identifying which
      one, which is the characteristic limitation of the route rather than a
      defect in it.
    choices:
      - text: >
          No — the bound allows every object to fail, so nothing has been ruled
          out.
        correct: true
        feedback: >
          Exactly. The counting route needs the failures to be strictly fewer
          than the whole collection; a bound equal to the total is vacuous.
      - text: >
          Yes — a finite bound on the failures always leaves something over.
        feedback: >
          Only if the bound is smaller than the total. Here it equals the total,
          so the count is consistent with universal failure.
      - text: >
          Yes, and moreover the argument identifies an object with $P$.
        feedback: >
          Two errors at once. The bound is too weak to conclude anything, and
          even a strict bound would name no object — that is what makes the
          route non-constructive.
      - text: >
          The question cannot be settled without knowing what $P$ is.
        feedback: >
          The verdict is about the shape of the count, not the content of $P$. A
          bound equal to the total is uninformative whatever $P$ says.
    rubric:
      - >
        Identifies the strictness of the comparison as the requirement that
        fails.
      - >
        Says what a sufficient bound would look like, and notes that even then no
        witness would be named.
    targets:
      - foundations.proof.existence-nonconstructive
    exercises: []
    connects: []
    tags: []

  - id: proof-ex-irrational-power-01
    kind: justify
    difficulty: demanding
    statement: >
      Adapt the two-case device to a different conclusion: prove that there exist
      irrational numbers $a$ and $b$ such that $a^{b}$ is *irrational*. You may
      use that $\sqrt{2}$ is irrational, and that a nonzero rational times an
      irrational is irrational.
    answer: >
      Put $t = \sqrt{2}^{\sqrt{2}}$ and split on whether $t$ is rational — a list
      that is exhaustive for the cheapest possible reason, since every real is
      rational or it is not, and no work is needed to see that. Case one, $t$
      irrational: take $a = b = \sqrt{2}$. Both are irrational, and
      $a^{b} = t$ is irrational by the case assumption, so the pair works. Case
      two, $t$ rational: take $a = \sqrt{2}$ and $b = 1 + \sqrt{2}$. Both are
      irrational — $a$ by the granted fact, and $b$ because if $1 + \sqrt{2}$
      were a rational $r$ then $\sqrt{2} = r - 1$ would be a difference of
      rationals and so rational, which it is not. Then
      $a^{b} = \sqrt{2}^{\,1 + \sqrt{2}} = \sqrt{2} \cdot
      \sqrt{2}^{\sqrt{2}} = \sqrt{2} \cdot t$. Here $t$ is rational by the case
      assumption and nonzero, since $\sqrt{2}^{\sqrt{2}} > 0$, so
      $\sqrt{2} \cdot t$ is a nonzero rational times an irrational, hence
      irrational. That pair works instead. One of the two cases holds, so a
      qualifying pair exists. As with the original argument, the proof names no
      pair: it offers two candidates and shows that at least one qualifies,
      without ever determining which, and determining which would need to settle
      the rationality of $\sqrt{2}^{\sqrt{2}}$ — a far deeper question that plays
      no part in the argument's validity.
    rubric:
      - >
        Justifies exhaustiveness of the split in one sentence — every real is
        rational or not — rather than leaving it implicit.
      - >
        In each case verifies both memberships (that $a$ and $b$ are irrational)
        as well as the property of $a^{b}$.
      - >
        In case two, uses that $t$ is nonzero as well as rational, which the
        multiplication fact requires.
      - >
        Concludes that a pair exists while stating that the argument identifies
        neither candidate.
    targets:
      - foundations.proof.ex-irrational-power
    exercises:
      - foundations.proof.cases
      - foundations.proof.existence-nonconstructive
    connects: []
    tags: []

  - id: proof-ex-irrational-power-02
    kind: decide
    difficulty: standard
    statement: >
      What would it take to upgrade the two-case argument — the one that names
      $t = \sqrt{2}^{\sqrt{2}}$ and splits on its rationality — into an argument
      that hands over a specific pair?
    answer: >
      A determination of whether $t$ is rational. The two-case argument is valid
      because its cases are exhaustive, and it stops short of naming a pair
      because it never finds out which case obtains; supplying that fact would
      select one of the two candidate pairs and turn the proof constructive. The
      determination is available — $t$ is irrational, by the
      Gelfond–Schneider theorem — but that theorem is far deeper than the claim
      being proved, and importing it would be paying a great deal for something
      the statement never asked for. Note what is not required. The argument does
      not need repair: exhaustive cases are enough for an existence claim, and
      validity never depended on identifying the case. And no further fact about
      $\sqrt{2}$ is needed, since its irrationality is already used and already
      established.
    choices:
      - text: >
          A determination of whether $\sqrt{2}^{\sqrt{2}}$ is rational — supplied
          by a theorem far deeper than the claim, and used nowhere in the
          argument.
        correct: true
        feedback: >
          Right. The two-case proof is complete without it; settling the case is
          what an upgrade to a constructive proof would cost.
      - text: >
          Nothing — the argument already names a specific pair, namely $a = b =
          \sqrt{2}$.
        feedback: >
          That pair qualifies only in the case where $t$ is rational. Since the
          argument never establishes which case holds, it never establishes that
          this pair works.
      - text: >
          A proof that $\sqrt{2}$ is irrational, which the argument assumes
          without justification.
        feedback: >
          That is already available and already used, in checking that the
          candidates are irrational. It is not what stands between the proof and
          a named pair.
      - text: >
          A repair of the case split, which is not exhaustive as it stands.
        feedback: >
          The split is exhaustive for the cheapest possible reason: every real
          number is rational or it is not. Exhaustiveness was never the issue.
    rubric:
      - >
        Identifies the missing ingredient as the rationality status of $t$, not
        as a defect in the argument.
      - >
        States that the existing proof is valid as it stands, since exhaustive
        cases suffice for an existence claim.
    targets:
      - foundations.proof.ex-irrational-power
    exercises:
      - foundations.proof.existence-nonconstructive
    connects: []
    tags: []

  - id: proof-ex-infinitude-primes-01
    kind: justify
    difficulty: demanding
    statement: >
      Adapt Euclid's construction to prove that no finite list contains every
      prime of the form $4k + 3$. Say which step of your argument the original
      construction did not need.
    answer: >
      Let $p_1, \ldots, p_n$ be an arbitrary finite list of primes of the form
      $4k + 3$, and put $N = 4 p_1 p_2 \cdots p_n - 1$. Then $N \ge 11$, and
      $N = 4(p_1 \cdots p_n - 1) + 3$, so $N$ itself has the form $4k + 3$; in
      particular $N$ is odd, so every prime dividing it is odd and therefore of
      the form $4k+1$ or $4k+3$. Here is the extra step the original argument did
      not need: some prime divisor of $N$ must be of the form $4k + 3$. For if
      every prime factor were of the form $4k + 1$, then, since $(4r+1)(4s+1) =
      4(4rs + r + s) + 1$ is again of that form, the product of all of them —
      that is, $N$ — would be of the form $4k + 1$, contradicting $N$ being of the
      form $4k+3$. So fix a prime $q$ dividing $N$ with $q = 4k + 3$. If $q$ were
      one of the $p_i$ it would divide $4 p_1 \cdots p_n$ and it divides $N$, so
      it would divide their difference, which is $1$ — impossible for a prime. So
      $q$ is a prime of the required form outside the list, and no finite list is
      complete. The argument is constructive, taking any finite list to a new
      prime; it does not claim $N$ is prime, and the new prime need not exceed
      the ones you started from.
    rubric:
      - >
        Builds $N$ so that it is congruent to $3$ modulo $4$ and is coprime to
        every listed prime.
      - >
        Proves that some prime factor of $N$ has the form $4k+3$, using that a
        product of numbers of the form $4k+1$ is again of that form — the step
        the plain construction does not need.
      - >
        Closes by the divides-their-difference argument, concluding that a common
        prime would divide $1$.
    targets:
      - foundations.proof.ex-infinitude-primes
    exercises:
      - foundations.proof.existence-constructive
    connects: []
    tags: []

  - id: proof-ex-infinitude-primes-02
    kind: work
    difficulty: standard
    statement: >
      Run Euclid's construction on the list of primes $5, 11$: form
      $N = 5 \cdot 11 + 1$. Give the value of $N$.
    answer: >
      $N = 56$. The construction multiplies the listed primes and adds one:
      $5 \cdot 11 = 55$, so $N = 56$. Now read off what the argument promises and
      what it does not. It promises that any prime divisor of $N$ is off the
      list, and that is what happens: $56 = 2^{3} \cdot 7$, so its prime divisors
      are $2$ and $7$, neither of which is $5$ or $11$ — as guaranteed, since a
      prime dividing both $56$ and $55$ would divide their difference $1$. It
      does not promise that $N$ is prime, and indeed $56$ is not. It does not
      promise that the new prime is larger than everything on the list, and
      indeed both $2$ and $7$ are smaller than $11$. Feed $5, 11, 2, 7$ back in
      and the machine produces another prime, and so on without end.
    expects: "56"
    rubric:
      - >
        Computes the product before adding one, rather than adding one to each
        prime.
      - >
        Notes that $N$ is composite here and that its prime divisors, both off
        the list, are smaller than the largest listed prime.
    targets:
      - foundations.proof.ex-infinitude-primes
    exercises: []
    connects: []
    tags: []

  - id: proof-uniqueness-01
    kind: justify
    difficulty: demanding
    statement: >
      Using only that addition of real numbers is associative and commutative and
      that $0$ is an additive identity, prove that a real number $x$ has at most
      one additive inverse: if $x + y = 0$ and $x + z = 0$ then $y = z$. Do not
      use subtraction.
    answer: >
      Assume $x + y = 0$ and $x + z = 0$; both hypotheses are needed and the
      argument consists of playing them against each other. Start from $y$ and
      travel to $z$: $y = y + 0$, since $0$ is an identity; $= y + (x + z)$,
      substituting the second hypothesis for $0$; $= (y + x) + z$, by
      associativity; $= (x + y) + z$, by commutativity; $= 0 + z$, substituting
      the first hypothesis; $= z$, since $0$ is an identity. Hence $y = z$. Every
      step cites one of the three permitted facts, and subtraction never appears
      — which matters, since subtraction is *defined* through additive inverses,
      so using it here would presuppose the very uniqueness being established.
      Notice the shape: the second hypothesis enters by rewriting the identity
      element, and the first leaves by the same door. An attempted proof that
      looked only at $y$ could not work, because nothing about $y$ alone
      distinguishes it from any other real. And this establishes only "at most
      one"; that an inverse exists at all is a separate claim, proved by
      exhibiting one.
    rubric:
      - >
        Uses both hypotheses, entering with one and leaving with the other,
        rather than examining a single one.
      - >
        Cites associativity and commutativity at the steps that use them, and
        avoids subtraction, which is defined in terms of the inverses at issue.
      - >
        States that only uniqueness has been proved, and that existence is a
        separate obligation.
    targets:
      - foundations.proof.uniqueness
    exercises: []
    connects: []
    tags: []

  - id: proof-uniqueness-02
    kind: decide
    difficulty: standard
    statement: >
      An author proves that if $g$ and $h$ are both greatest elements of a set
      $S$ of real numbers then $g = h$, and concludes that "the greatest element
      of $S$" is now a legitimate phrase. What is wrong?
    answer: >
      Only uniqueness has been proved, and "at most one" is compatible with
      "none". The argument compares two hypothetical greatest elements and shows
      they coincide; it produces nothing, and it would run word for word on a set
      with no greatest element at all. The open interval $S = (0,1)$ is such a
      set: for every $s$ in $S$ the number $(s+1)/2$ lies in $S$ and exceeds $s$,
      so no element of $S$ is greatest — yet the author's proof, applied to this
      $S$, is perfectly correct and perfectly empty, since it is vacuously true
      that any two greatest elements coincide. The definite article is earned
      only when existence has been proved as well, normally by exhibiting a
      witness and verifying it. Until then the honest phrase is "a greatest
      element of $S$, if one exists".
    choices:
      - text: >
          Only "at most one" has been shown; existence is a separate claim, and a
          set such as $(0,1)$ has no greatest element at all.
        correct: true
        feedback: >
          Right, and note that the author's argument is still correct on
          $(0,1)$ — it is vacuously true there, which is exactly why it cannot
          produce anything.
      - text: >
          Nothing is wrong — showing that any two candidates coincide is what
          "the" asserts.
        feedback: >
          "The" asserts existence as well as uniqueness. A phrase naming an
          object that may not exist is not yet meaningful.
      - text: >
          The argument also establishes existence, since it reasons about two
          greatest elements and so assumes there are some.
        feedback: >
          Assuming two hypothetical objects for the sake of comparison does not
          produce one. If there are none, the implication holds vacuously.
      - text: >
          The proof is circular, since it uses the greatest element to prove the
          greatest element exists.
        feedback: >
          It is not circular; it is incomplete. Supposing two candidates in order
          to force them together is the standard and legitimate shape of a
          uniqueness proof.
    rubric:
      - >
        Separates the two halves of an "exactly one" claim and says which one has
        been done.
      - >
        Gives a concrete set where uniqueness holds vacuously and existence
        fails.
    targets:
      - foundations.proof.uniqueness
    exercises: []
    connects: []
    tags: []

  # --- refutation, form, and the errors ---------------------------------------

  - id: proof-counterexample-01
    kind: justify
    difficulty: demanding
    statement: >
      Two claims. (i) For every positive integer $n$, $n^{2} + n + 1$ is odd.
      (ii) For every real $x$, if $x^{2} > x$ then $x > 1$. Decide each, proving
      the true one and disproving the false one, and say why the two verdicts
      cost such different amounts of work.
    answer: >
      (i) is true. Let $n$ be an arbitrary positive integer. Then
      $n^{2} + n = n(n+1)$ is a product of consecutive integers, one of which is
      even, so $n^{2} + n = 2m$ for some integer $m$ and $n^{2} + n + 1 = 2m + 1$
      is odd. The argument used nothing about $n$ beyond membership, so it covers
      the whole domain. (ii) is false, and one instance kills it. Take
      $x = -2$. Membership: $-2$ is a real number, so the claim speaks about it.
      Failure of the property: $x^{2} = 4 > -2 = x$, so the hypothesis holds,
      while $x = -2$ is not greater than $1$, so the conclusion fails; hence the
      implication is false at this $x$ and the universal claim is refuted. Both
      verifications are needed and the membership one is the easy one to skip.
      The asymmetry in cost is entirely a matter of quantifiers: proving
      $\forall x, P(x)$ over an infinite domain needs an argument reaching every
      element, whereas its negation is $\exists x, \neg P(x)$, and an existential
      claim is settled by one verified witness. Note also what the counterexample
      does not deliver: it does not say that the repaired claim "if $x^{2} > x$
      then $x > 1$ or $x < 0$" is true, which would need its own proof.
    rubric:
      - >
        Proves (i) for an arbitrary $n$ rather than checking instances, using
        that one of $n$ and $n+1$ is even.
      - >
        Refutes (ii) with a single value, and verifies both that it lies in the
        domain and that the implication fails there — the hypothesis holds and
        the conclusion does not.
      - >
        Explains the cost asymmetry through the quantifiers, and does not claim
        the counterexample repairs or diagnoses anything.
    targets:
      - foundations.proof.counterexample
    exercises:
      - foundations.proof.universal-proof
    connects: []
    tags: []

  - id: proof-counterexample-02
    kind: decide
    difficulty: standard
    statement: >
      To refute "for every prime $p$, the number $2^{p} - 1$ is prime", someone
      offers $p = 9$, observing that $2^{9} - 1 = 511 = 7 \cdot 73$. Is the claim
      refuted?
    answer: >
      No. A counterexample owes two verifications, and this candidate fails the
      first: the domain is the primes, and $9 = 3 \cdot 3$ is not prime, so the
      claim never spoke about $p = 9$. The property does genuinely fail there —
      $511$ really is composite — but a property failing outside the domain
      refutes a claim nobody made. The claim is nonetheless false, and the
      smallest witness is $p = 11$: it is prime, so membership holds, and
      $2^{11} - 1 = 2047 = 23 \cdot 89$, so $2047$ is composite and the property
      fails. Both checks pass, and that pair of one-line verifications is the
      entire disproof. Note the shape of the mistake: it is not that the
      arithmetic was wrong, but that the candidate was never an element the
      quantifier ranged over.
    choices:
      - text: >
          No — $9$ is not prime, so it lies outside the domain; $p = 11$ does the
          job, since $2^{11} - 1 = 2047 = 23 \cdot 89$.
        correct: true
        feedback: >
          Exactly. The membership check is the one that failed, and repairing it
          means finding a candidate that is genuinely prime.
      - text: >
          Yes — the property fails at $9$, and that is what a counterexample
          needs.
        feedback: >
          A counterexample needs both checks. Failing the property at a number
          outside the domain leaves the claim entirely untouched.
      - text: >
          No — and the claim is true, since $2^{p} - 1$ is prime whenever $p$ is.
        feedback: >
          The claim is false; $p = 11$ refutes it. That the offered candidate is
          bad says nothing about whether a good one exists.
      - text: >
          Yes — $511$ is composite, so the claim fails for at least one value,
          which is all that is required.
        feedback: >
          The value has to be one the claim quantifies over. "At least one
          value" means at least one prime, and $9$ is not one.
    rubric:
      - >
        Identifies the membership check as the one that fails, not the property
        check.
      - >
        Supplies a candidate that passes both checks, with the factorisation that
        verifies the property fails.
    targets:
      - foundations.proof.counterexample
    exercises: []
    connects: []
    tags: []

  - id: proof-ex-failed-pattern-01
    kind: justify
    difficulty: demanding
    statement: >
      The numbers $2^{2^{n}} + 1$ are prime for $n = 0, 1, 2, 3, 4$, taking the
      values $3, 5, 17, 257, 65537$; and $2^{2^{5}} + 1 = 4294967297 = 641 \cdot
      6700417$. Say exactly what the five successes established and exactly what
      the sixth value establishes, and explain why the two do such different
      amounts of work.
    answer: >
      The five successes established five statements: that $3$ is prime, that $5$
      is prime, and so on for $17$, $257$ and $65537$. Each is a small theorem
      about one number, and together they are five theorems about five numbers.
      They establish nothing about the claim "$2^{2^{n}} + 1$ is prime for every
      $n \ge 0$", whose domain is infinite, so the untested part of it is still
      infinite; and being the first five cases gives them no extra weight, since
      a universal claim has no notion of a case being representative. The sixth
      value establishes the whole of the negation. The negation of
      $\forall n, P(n)$ is $\exists n, \neg P(n)$, and an existential claim is
      settled by one verified witness, so it suffices to check that $n = 5$ lies
      in the domain — it is an integer with $n \ge 0$ — and that the property
      fails there, which the factorisation $4294967297 = 641 \cdot 6700417$ does,
      both factors exceeding $1$. The claim is therefore false, permanently. The
      asymmetry is entirely in the quantifiers: refuting needs one element,
      confirming needs an argument that reaches every element, and no finite
      batch of checks is such an argument.
    rubric:
      - >
        Says the successes are five statements about five numbers, not partial
        progress towards the universal claim.
      - >
        Treats the failure as a counterexample and carries out both
        verifications, membership and the failure of the property.
      - >
        Grounds the cost asymmetry in the quantifier structure — the negation of
        a universal claim is existential.
    targets:
      - foundations.proof.ex-failed-pattern
    exercises:
      - foundations.proof.counterexample
    connects: []
    tags: []

  - id: proof-ex-failed-pattern-02
    kind: work
    difficulty: standard
    statement: >
      The value $n^{2} - 79n + 1601$ is prime for every integer $n$ with
      $0 \le n \le 79$. Find the least integer $n \ge 0$ at which the claim
      "$n^{2} - 79n + 1601$ is prime for all $n \ge 0$" fails, and verify the
      failure.
    answer: >
      $n = 80$. Since the statement is given as holding for $n = 0$ through
      $n = 79$, the least possible failure is at $n = 80$, and it is one: group
      the terms as $n(n - 79) + 1601$, which at $n = 80$ gives
      $80 \cdot 1 + 1601 = 1681$. That is not prime, since $1681 = 41 \cdot 41$,
      a divisor strictly between $1$ and the number itself. Both verifications
      for a counterexample are in place — $80$ is an integer with $80 \ge 0$, so
      it lies in the domain, and the property fails there — so the universal
      claim is refuted, after eighty consecutive confirmations. The failure is
      not an accident of arithmetic either: the polynomial equals
      $(n - 40)^{2} + (n - 40) + 41$, so it is the same forty-value pattern
      shifted, and it collapses for the same reason. Eighty verified instances
      remain eighty true statements about eighty integers, and never became
      evidence for the eighty-first.
    expects: "80"
    rubric:
      - >
        Evaluates at the first untested value rather than searching at random,
        and computes $1681$.
      - >
        Verifies compositeness by exhibiting the factor $41$, not by asserting
        that the number "looks composite".
      - >
        States that the eighty successful checks are eighty instances and no more.
    targets:
      - foundations.proof.ex-failed-pattern
    exercises:
      - foundations.proof.counterexample
    connects: []
    tags: []

  - id: proof-nested-quantifiers-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove: for every $\varepsilon > 0$ there is a $\delta > 0$ such that for
      every real $x$ with $\lvert x - 2 \rvert < \delta$ we have
      $\lvert x^{2} - 4 \rvert < \varepsilon$. State what your $\delta$ is
      allowed to mention, and why.
    answer: >
      The quantifiers are read left to right, so $\varepsilon$ is introduced
      first, $\delta$ is billed second and may mention $\varepsilon$, and $x$
      arrives last — after $\delta$ is already fixed — so $\delta$ may not
      mention $x$. Scratch work, backwards: $\lvert x^{2} - 4 \rvert =
      \lvert x - 2 \rvert \, \lvert x + 2 \rvert$, and the second factor is not
      bounded on its own, so bound it first by restricting how far $x$ may roam.
      Now the proof, forwards. Let $\varepsilon > 0$ be arbitrary and put
      $\delta = \min(1, \varepsilon/5)$, which is positive because both entries
      are. Let $x$ be any real with $\lvert x - 2 \rvert < \delta$. Since
      $\delta \le 1$ we get $\lvert x - 2 \rvert < 1$, so $1 < x < 3$ and hence
      $3 < x + 2 < 5$, giving $\lvert x + 2 \rvert < 5$. Therefore
      $\lvert x^{2} - 4 \rvert = \lvert x - 2 \rvert \, \lvert x + 2 \rvert <
      5\delta \le 5 \cdot \varepsilon/5 = \varepsilon$. The witness mentions
      $\varepsilon$ and nothing else, as the order requires. Taking
      $\delta = \varepsilon / \lvert x + 2 \rvert$ would be the classic error: it
      is positive and it makes the final line come out, but it reads a variable
      introduced after it, and so answers a different and much weaker statement.
    rubric:
      - >
        States $\delta$ before introducing $x$, and as a formula in $\varepsilon$
        alone.
      - >
        Takes the minimum with a constant so that $\lvert x + 2 \rvert$ is
        bounded uniformly, rather than leaving an unbounded factor in the
        estimate.
      - >
        Presents the argument forwards, with the backwards scratch work marked as
        scratch work.
    targets:
      - foundations.proof.nested-quantifiers
    exercises:
      - foundations.logic.nested-quantifiers
    connects: []
    tags: []

  - id: proof-nested-quantifiers-02
    kind: decide
    difficulty: standard
    statement: >
      A function $f$ on $\mathbb{R}$ is called bounded when there is a real $M$
      such that for every real $x$, $\lvert f(x) \rvert \le M$. A student writes
      the condition the other way round — for every real $x$ there is a real $M$
      with $\lvert f(x) \rvert \le M$ — and says it comes to the same thing.
      Which functions satisfy the student's version?
    answer: >
      All of them. In the student's version $M$ is billed after $x$ has been
      introduced, so the witness may depend on $x$, and the choice
      $M = \lvert f(x) \rvert$ works for every function and every $x$. The
      condition is therefore satisfied by every function whatsoever and
      distinguishes nothing — it is not a weaker version of boundedness, it is
      empty. The real definition puts $\exists M$ outermost, so $M$ is chosen
      before $x$ arrives and must work for all $x$ at once; that single $M$ is
      the entire content of the notion. This is the same phenomenon as the
      difference between "for each real there is a larger one", which is true,
      and "there is a real larger than every real", which is false: swapping
      adjacent unlike quantifiers changes the claim, and moving $\exists$
      outwards always makes it stronger.
    choices:
      - text: >
          Every function, since $M$ may be chosen after $x$ — take $M = \lvert
          f(x) \rvert$.
        correct: true
        feedback: >
          Right, and that is what makes the student's version empty rather than
          merely weaker: it rules out nothing at all.
      - text: >
          Exactly the bounded ones, since the two conditions say the same thing
          in a different order.
        feedback: >
          Order is content. With $\exists M$ inside, a different $M$ is allowed
          at each $x$; boundedness needs one $M$ serving every $x$ at once.
      - text: >
          Only the constant functions, since $M$ must not vary.
        feedback: >
          Nothing in the student's version prevents $M$ from varying — that is
          precisely its defect. And boundedness itself is satisfied by many
          non-constant functions.
      - text: >
          Only the functions that are bounded on every bounded interval.
        feedback: >
          No interval appears in either statement. The student's condition places
          no restriction whatever on $f$.
    rubric:
      - >
        Identifies that the witness $M$ may depend on $x$ in the student's
        version, and produces such a witness.
      - >
        Says that the reordered statement is empty rather than weaker, and that
        moving $\exists$ outwards strengthens a claim.
    targets:
      - foundations.proof.nested-quantifiers
    exercises:
      - foundations.logic.nested-quantifiers
    connects: []
    tags: []

  - id: proof-form-dictates-proof-01
    kind: justify
    difficulty: demanding
    statement: >
      Claim: for every real $x$ that is not an integer, there is exactly one
      integer $n$ with $n < x < n + 1$. Write down the skeleton the logical form
      dictates — every opening line and every separate obligation — before doing
      any mathematics, then fill the holes.
    answer: >
      The form is: for all $x$ (real), if $x$ is not an integer, then there is
      exactly one $n$ (integer) with $n < x < n+1$. Reading it from the outside
      in, the skeleton writes itself. Line one, from the universal quantifier:
      let $x$ be an arbitrary real number. Line two, from the implication: assume
      $x$ is not an integer. Then "exactly one" splits into two separate
      obligations: existence, produce an integer $n$ with $n < x < n+1$; and
      uniqueness, suppose $n$ and $m$ are integers that both satisfy the
      condition and show $n = m$. That is four lines of scaffolding written with
      no mathematical thought at all, and the holes are now visible and small.
      Filling them: for existence take $n = \lfloor x \rfloor$, the greatest
      integer with $n \le x$; then $n \le x < n+1$, and $n \ne x$ because $x$ is
      not an integer, so $n < x < n+1$. For uniqueness suppose $n < x < n+1$ and
      $m < x < m+1$ with $n$ and $m$ integers, and suppose $n \ne m$; without
      loss of generality $n < m$, since the statement of this sub-claim is
      symmetric in the two names. Then $n + 1 \le m$, because integers with
      $n < m$ satisfy that, and so $x < n + 1 \le m < x$, giving $x < x$, which
      is false. Hence $n = m$. The skeleton cost nothing and each hole took one
      sentence.
    rubric:
      - >
        Produces the opening lines in the order the form dictates: arbitrary $x$
        first, then the hypothesis, and does not bill the witness before $x$
        exists.
      - >
        Splits "exactly one" into two obligations and gives a separate argument
        for each, rather than treating a witness as settling uniqueness.
      - >
        In the uniqueness half, uses both assumed integers against each other and
        reaches a contradiction from $x < x$ or an equivalent.
    targets:
      - foundations.proof.form-dictates-proof
    exercises:
      - foundations.proof.universal-proof
      - foundations.proof.existence-constructive
    connects: []
    tags: []

  - id: proof-form-dictates-proof-02
    kind: decide
    difficulty: standard
    statement: >
      Claim: for every integer $n$, if $3$ does not divide $n$ then $3$ divides
      $n^{2} - 1$. Which opening does the logical form dictate?
    answer: >
      Let $n$ be an arbitrary integer; assume $3$ does not divide $n$; produce an
      integer $t$ with $n^{2} - 1 = 3t$. The universal quantifier is outermost,
      so the arbitrary element comes first; the implication comes next, so the
      hypothesis is assumed second; and the conclusion is unfolded into a
      concrete target, an integer $t$, so that you know what object you owe. The
      order of the first two lines is not decoration — the hypothesis is about
      $n$, so $n$ must exist before it can be assumed. With the skeleton in place
      the mathematics is short: $n$ leaves remainder $1$ or $2$ on division by
      $3$, so $n = 3k+1$ gives $n^{2} - 1 = 9k^{2} + 6k = 3(3k^{2} + 2k)$, and
      $n = 3k+2$ gives $n^{2} - 1 = 9k^{2} + 12k + 3 = 3(3k^{2} + 4k + 1)$. In
      each case $t$ is an integer.
    choices:
      - text: >
          Let $n$ be an arbitrary integer; assume $3$ does not divide $n$;
          produce an integer $t$ with $n^{2} - 1 = 3t$.
        correct: true
        feedback: >
          Outermost first: the universal quantifier, then the implication's
          hypothesis, then the conclusion unfolded into the object you owe.
      - text: >
          Assume $3$ divides $n^{2} - 1$ and derive that $3$ does not divide $n$.
        feedback: >
          That is the converse — the implication has been read backwards. The
          hypothesis is about $n$ and the conclusion about $n^{2} - 1$.
      - text: >
          Choose an integer $n$ not divisible by $3$ and check that $3$ divides
          $n^{2} - 1$.
        feedback: >
          Choosing an $n$ proves one instance. The universal quantifier demands
          an element you may assume nothing about beyond membership.
      - text: >
          Assume $3$ does not divide $n$, then let $n$ be an arbitrary integer.
        feedback: >
          The two lines are in the wrong order: the hypothesis speaks about $n$,
          so $n$ has to be introduced before anything can be assumed about it.
    rubric:
      - >
        Puts the arbitrary element first and the hypothesis second, in that
        order.
      - >
        Unfolds the conclusion into a named object rather than leaving it as a
        divisibility word.
    targets:
      - foundations.proof.form-dictates-proof
    exercises:
      - foundations.proof.universal-proof
    connects: []
    tags: []

  - id: proof-err-affirming-consequent-01
    kind: justify
    difficulty: demanding
    statement: >
      A student proves that $\frac{a+b}{2} \ge \sqrt{ab}$ for positive reals $a$
      and $b$ as follows. "Square both sides: $(a+b)^{2}/4 \ge ab$. Multiply by
      $4$: $a^{2} + 2ab + b^{2} \ge 4ab$. Rearrange: $a^{2} - 2ab + b^{2} \ge 0$,
      that is $(a-b)^{2} \ge 0$, which is true." Say exactly what this
      establishes as written, and repair it.
    answer: >
      As written it establishes that the claim implies a truth, which is no
      evidence for the claim: every false statement implies truths too, since
      squaring the false equation $-1 = 1$ yields $1 = 1$. Each line of the
      student's chain follows from the line above it, so the chain runs from the
      claim to $(a-b)^{2} \ge 0$; what a proof needs is a chain running the other
      way, from established facts to the claim. The repair is to check that every
      step reverses and then write the argument in reverse order. Start from
      $(a-b)^{2} \ge 0$, true for all reals. Expanding, $a^{2} - 2ab + b^{2} \ge
      0$, hence $a^{2} + 2ab + b^{2} \ge 4ab$, that is $(a+b)^{2} \ge 4ab$, so
      $(a+b)^{2}/4 \ge ab$. Now take square roots, and this is the step needing
      the hypothesis: $a$ and $b$ are positive, so $(a+b)/2 > 0$ and
      $\sqrt{ab} \ge 0$, and for nonnegative quantities $u^{2} \ge v^{2}$ gives
      $u \ge v$. Hence $\frac{a+b}{2} \ge \sqrt{ab}$. Same five lines, opposite
      order, and now each follows from its predecessor. Note where the positivity
      hypothesis was spent: nowhere in the algebra, and entirely in the square
      root step — which is precisely the step the original write-up performed
      first and never justified.
    rubric:
      - >
        Names the defect as reasoning from the goal, and says what a chain ending
        at a truth does and does not show.
      - >
        Checks reversibility of the square-root step explicitly, using positivity
        of $a$ and $b$, rather than asserting that all the steps are
        equivalences.
      - >
        Rewrites the argument forwards, so that every line follows from the one
        above it.
    targets:
      - foundations.proof.err-affirming-consequent
    exercises: []
    connects: []
    tags: []

  - id: proof-err-affirming-consequent-02
    kind: decide
    difficulty: standard
    statement: >
      Theorem: if a positive integer ends in the digit $0$ then it is divisible
      by $5$. You are told that $n$ is divisible by $5$. What follows about the
      last digit of $n$?
    answer: >
      Nothing. An implication combined with the truth of its conclusion licenses
      no inference about its hypothesis; concluding that $n$ ends in $0$ is
      affirming the consequent, which silently substitutes the converse "if $n$
      is divisible by $5$ then it ends in $0$" — a different statement, and here
      a false one, since $n = 35$ is divisible by $5$ and ends in $5$. Concluding
      instead that $n$ does not end in $0$ is equally unsupported: $n = 40$ is
      divisible by $5$ and ends in $0$. Only two inferences are available from an
      implication. Forwards from the hypothesis, modus ponens: if you knew that
      $n$ ended in $0$ you could conclude divisibility by $5$. Backwards from the
      negated conclusion, modus tollens: if you knew $n$ were not divisible by
      $5$, you could conclude it does not end in $0$. Knowing the conclusion
      leaves the hypothesis exactly where it was.
    choices:
      - text: >
          Nothing — $35$ is divisible by $5$ and ends in $5$, while $40$ is
          divisible by $5$ and ends in $0$.
        correct: true
        feedback: >
          Both examples are needed to show the conclusion leaves the hypothesis
          entirely open in either direction.
      - text: >
          That $n$ ends in $0$.
        feedback: >
          That is affirming the consequent — using the converse, which has not
          been proved and is false here, as $n = 35$ shows.
      - text: >
          That $n$ does not end in $0$.
        feedback: >
          Equally unsupported: $n = 40$ is divisible by $5$ and does end in $0$.
          Knowing the conclusion forces neither answer.
      - text: >
          That $n$ ends in $0$ or in $5$, by the contrapositive.
        feedback: >
          True as a fact about multiples of $5$, but not obtained from this
          theorem. Its contrapositive runs from "not divisible by $5$" to "does
          not end in $0$".
    rubric:
      - >
        Answers that nothing follows, and names the fallacy as affirming the
        consequent.
      - >
        Exhibits instances on both sides, so that neither answer about the last
        digit is forced.
    targets:
      - foundations.proof.err-affirming-consequent
    exercises:
      - foundations.logic.contrapositive
    connects: []
    tags: []

  - id: proof-err-circular-01
    kind: justify
    difficulty: demanding
    statement: >
      A textbook proves (A) "every integer $n > 1$ has a factorization into
      primes" by repeatedly extracting a least prime divisor, citing (B) "every
      integer $n > 1$ has a least prime divisor". It then proves (B) by saying:
      "take a prime factorization of $n$ and choose the smallest prime in it."
      Diagnose the argument and repair it.
    answer: >
      The argument is circular at a distance. Neither proof mentions its own
      conclusion, and each reads perfectly well on its own — which is exactly why
      this form is dangerous. But the chain of citations does not terminate: the
      proof of (A) rests on (B), the proof of (B) rests on (A), and following the
      dependencies never reaches an axiom or a definition. Nothing has been
      established about either statement. The repair is to prove (B) without
      (A). Let $n > 1$ be an integer. The set of divisors of $n$ that are greater
      than $1$ is nonempty, since $n$ itself is one, so by well-ordering it has a
      least element $d$. Then $d$ is prime: if $d$ had a divisor $e$ with
      $1 < e < d$, then $e$ would divide $n$ as well, since divisibility is
      transitive, and $e$ would be a divisor of $n$ greater than $1$ and smaller
      than $d$, contradicting the choice of $d$. So $d$ is a prime divisor of
      $n$, and it is the least one, being least among all divisors above $1$.
      That derivation cites well-ordering and the transitivity of divisibility,
      and mentions factorization nowhere, so (A) may now be proved from it and
      the chain terminates. The general defence is the same: for every line, name
      what licenses it, and check that the licence does not lead back to where
      you are standing.
    rubric:
      - >
        Names the defect as circularity at a distance, and says that the loop is
        invisible inside either argument taken alone.
      - >
        Repairs by proving (B) from well-ordering, with no appeal to
        factorization.
      - >
        Justifies the primality of the least divisor above $1$, rather than
        asserting it — a smaller divisor of it would divide $n$ too.
    targets:
      - foundations.proof.err-circular
    exercises: []
    connects: []
    tags: []

  - id: proof-err-circular-02
    kind: decide
    difficulty: standard
    statement: >
      An author defines a sequence to be *settled* if it converges, and then
      states as a theorem "every settled sequence converges", proving it by
      unfolding the definition. What is the best description of the situation?
    answer: >
      The conclusion was built into the definition, so the statement is a
      restatement of that definition and no mathematics has been done. It is not
      false — a definition asserts nothing and cannot be false, and unfolding one
      is a licensed step, so the argument commits no error of inference. What has
      gone wrong is that there was never a gap between the hypothesis and the
      conclusion for a proof to cross, so the "theorem" carries no information
      and cannot be used to learn anything about a sequence you did not already
      know converged. This is the smuggling variant of circular reasoning: the
      step that would have needed real work is never written down, because a
      definition was arranged so that it disappears. The diagnostic is to ask
      what the statement rules out. Here, nothing — every sequence either
      converges, and then satisfies both sides, or does not, and then satisfies
      neither.
    choices:
      - text: >
          The statement restates the definition, so it is true and empty — no
          mathematics has been done.
        correct: true
        feedback: >
          Right. The unfolding step is licensed; the defect is that there was no
          gap between the two sides for a proof to cross.
      - text: >
          The argument is circular in the vicious sense, and so establishes
          nothing about convergent sequences.
        feedback: >
          Close but not right. A vicious circle leans on the conclusion to
          support it; here the conclusion is the hypothesis by stipulation, so
          the statement is true, just uninformative.
      - text: >
          It is a legitimate theorem, since unfolding a definition is one of the
          five licences a proof line may claim.
        feedback: >
          The step is licensed, but that does not make the statement a theorem
          with content. A definition asserts nothing, so reading it back gives
          nothing new.
      - text: >
          The definition is ill-posed, since it names a property through an
          arbitrary choice.
        feedback: >
          No choice is made here — every sequence either converges or does not.
          Well-posedness is a different failure from emptiness.
    rubric:
      - >
        Says the statement is true and empty rather than false or invalid.
      - >
        Identifies the mechanism as smuggling the conclusion into a definition,
        so that the load-bearing step is never written down.
    targets:
      - foundations.proof.err-circular
    exercises:
      - foundations.proof.def-definition
    connects: []
    tags: []
