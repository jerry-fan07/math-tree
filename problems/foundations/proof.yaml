# problems targeting foundations.proof — the vocabulary of an argument and the
# standard proof shapes.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so the
# mastery set never opens with something the lesson has just handed over, and at
# least one problem per node is machine-checked. No problem reuses a lesson's
# worked example or a card's instance. Tagging rules are design.md §5.2:
# `targets` is what the problem primarily tests, `exercises` what it necessarily
# drills in passing. See ../README.md for the authoring checklist.

problems:
  # --- the vocabulary: definition, axiom, theorem, proof ----------------------

  - id: proof-def-definition-01
    kind: justify
    difficulty: demanding
    statement: >
      Two attempted definitions, each about a positive rational number $q$.
      (i) Call $q$ *low-bottomed* if $q$ can be written as $a/b$ with $a$ and $b$
      positive integers and $b \le 10$. (ii) Call $q$ *even-bottomed* if, writing
      $q = a/b$ with $a$ and $b$ positive integers, the denominator $b$ is even.
      Exactly one of these defines a property of $q$. Say which, and prove that
      the other one does not.
    answer: >
      (i) is well posed and (ii) is not. Definition (i) is an existential
      statement about $q$: it asserts that among the many ways of writing $q$ as
      a ratio of positive integers, at least one has denominator at most $10$.
      Whether such a representation exists is a fact about the number $q$ itself,
      so any two people testing the same $q$ reach the same verdict, whatever
      representation they happen to start from. Definition (ii) instead reads a
      feature off a representation that was chosen arbitrarily, and the choice
      changes the answer. Take $q = 1/3$. Written as $1/3$ the denominator is
      $3$, which is odd, so the definition says $q$ is not even-bottomed. Written
      as $2/6$ — the same number — the denominator is $6$, which is even, so the
      definition says $q$ is even-bottomed. One number, two verdicts, so the name
      attaches to the writing rather than to the object and (ii) defines nothing
      at all. It is not false: a definition asserts nothing and so cannot be
      false. It simply fails to name a property. The repair is to remove the
      choice, for instance by requiring the fraction to be in lowest terms, after
      which each positive rational has exactly one representation to consult.
    rubric:
      - >
        Exhibits two representations of one and the same rational number that
        give opposite verdicts under (ii) — a single number, not two numbers.
      - >
        Explains why (i) escapes the same objection: its condition is "there
        exists a representation with ...", whose truth depends on $q$ alone.
      - >
        Says that (ii) is not false but fails to define anything, and names the
        repair as pinning down the representation.
    targets:
      - foundations.proof.def-definition
    exercises: []
    connects: []
    tags: []

  - id: proof-def-definition-02
    kind: decide
    difficulty: standard
    statement: >
      Call an integer $n$ *balanced* if $n = 3k + 1$ for some integer $k$. You
      are told that $m$ is balanced and asked to prove that $m^{2}$ is balanced.
      Which pair of lines does the definition license you to write down before
      any mathematics is done?
    answer: >
      The first option. A definition works in both directions. Unfolding the
      hypothesis converts the word "balanced" into an equation you can compute
      with, $m = 3k + 1$ for some integer $k$; unfolding the conclusion tells you
      exactly what object you must produce, an integer $t$ with $m^{2} = 3t + 1$.
      With both ends open the middle is arithmetic: $m^{2} = (3k+1)^{2} = 9k^{2}
      + 6k + 1 = 3(3k^{2} + 2k) + 1$, and $3k^{2} + 2k$ is an integer, so
      $t = 3k^{2} + 2k$ works and folding the definition back gives "$m^{2}$ is
      balanced". Starting from $m^{2} = 3t + 1$ would assume the conclusion, and
      testing values of $m$ would establish instances rather than the claim.
    choices:
      - text: >
          Data: $m = 3k + 1$ for some integer $k$. Target: an integer $t$ with
          $m^{2} = 3t + 1$.
        correct: true
        feedback: >
          Right — unfold at both ends. The hypothesis becomes an equation, the
          conclusion becomes a named object to produce, and the middle is then
          $m^{2} = 9k^{2} + 6k + 1 = 3(3k^{2} + 2k) + 1$.
      - text: >
          Data: $m^{2} = 3t + 1$ for some integer $t$. Target: an integer $k$
          with $m = 3k + 1$.
        feedback: >
          That unfolds the two ends into the wrong roles: it assumes the
          conclusion and sets out to re-derive the hypothesis, which was granted
          for free.
      - text: >
          Data: the values $m = 1, 4, 7$. Target: a pattern in $m^{2}$.
        feedback: >
          Those are instances. The claim is about every balanced $m$, so
          confirming three of them leaves infinitely many untouched — and a
          definition is unfolded, not sampled.
    rubric:
      - >
        Unfolds the hypothesis into an equation and the conclusion into a named
        object, rather than only one of the two.
      - >
        Produces the witness $t = 3k^{2} + 2k$ and checks it is an integer before
        folding the definition back.
    targets:
      - foundations.proof.def-definition
    exercises:
      - foundations.logic.def-biconditional
    connects: []
    tags: []

  - id: proof-def-axiom-01
    kind: justify
    difficulty: demanding
    statement: >
      An axiomatic system has primitive terms *club*, *member* and "belongs to",
      with three axioms. B1: every club has exactly three members. B2: every
      member belongs to exactly two clubs. B3: there are exactly four members.
      Show that the system is inconsistent, and say what that verdict is a
      verdict about.
    answer: >
      Count the pairs (member, club) in which the member belongs to the club, in
      two ways. Grouping by club, each club contributes exactly three such pairs
      by B1, so if $c$ is the number of clubs the total is $3c$. Grouping by
      member, each member contributes exactly two pairs by B2, and there are four
      members by B3, so the total is $2 \cdot 4 = 8$. The two counts count the
      same set, so $3c = 8$. Now $c$ is a number of clubs, hence a nonnegative
      integer, so $3$ divides $8$. But $8 = 3 \cdot 2 + 2$, so $3$ does not
      divide $8$. Both a statement and its negation are derivable, which is
      precisely inconsistency. Note what has been established and what has not.
      Nothing here is a mistake in arithmetic or a false theorem: the axioms were
      a choice, and this choice turns out to derive everything, so it
      distinguishes nothing and no structure satisfies it. Dropping or weakening
      any one of B1, B2, B3 gives a different theory that may well be perfectly
      good — replacing B3 by "there are exactly six members" gives $3c = 12$ and
      $c = 4$, with no contradiction in sight.
    rubric:
      - >
        Counts the incidences in two ways and equates the counts, rather than
        arguing informally that the numbers "do not fit".
      - >
        Uses that the number of clubs is an integer, and states the contradiction
        as a statement and its negation ($3$ divides $8$, and it does not).
      - >
        Locates the verdict in the axiom system rather than in any single axiom,
        and notes that a different choice of axioms is a different theory rather
        than a correction.
    targets:
      - foundations.proof.def-axiom
    exercises: []
    connects: []
    tags: []

  - id: proof-def-axiom-02
    kind: decide
    difficulty: standard
    statement: >
      A system has axioms $B$ and $C$, and $A$ is a further statement in the same
      language. What must you exhibit to establish that $A$ is *independent* of
      $B$ and $C$?
    answer: >
      The first option. Independence means that neither $A$ nor its negation
      follows from $B$ and $C$, so it is two claims and needs two witnesses. A
      structure in which $B$ and $C$ hold and $A$ fails shows that $A$ is not
      derivable, since anything derivable from $B$ and $C$ holds wherever they
      do. A structure in which $B$, $C$ and $A$ all hold shows, by the same
      argument, that the negation of $A$ is not derivable either. With both in
      hand, adding $A$ and adding its negation are equally available, and each
      continuation is as consistent as the other — which is exactly the situation
      the parallel postulate is in. Exhibiting only the first structure proves
      the weaker claim that $A$ is unprovable, which is half the job.
    choices:
      - text: >
          A structure in which $B$ and $C$ hold and $A$ fails, and a structure in
          which $B$, $C$ and $A$ all hold.
        correct: true
        feedback: >
          Both halves, and each rules out one direction: the first shows $A$ is
          not derivable, the second shows the negation of $A$ is not derivable.
      - text: >
          A structure in which $B$ and $C$ hold and $A$ fails, and nothing more.
        feedback: >
          That establishes only that $A$ is unprovable from $B$ and $C$. The
          negation of $A$ might still be derivable, in which case $A$ is refuted
          rather than independent.
      - text: >
          A proof that no finite derivation of $A$ from $B$ and $C$ exists,
          obtained by inspecting the possible derivations.
        feedback: >
          There are infinitely many candidate derivations, so inspection is not
          available. Exhibiting a structure is what converts "no derivation" into
          something finite you can check.
    rubric:
      - >
        Names both structures, and says which direction of underivability each
        one settles.
      - >
        Uses the principle that anything derivable from the axioms holds in every
        structure satisfying them.
    targets:
      - foundations.proof.def-axiom
    exercises: []
    connects: []
    tags: []

  - id: proof-def-theorem-01
    kind: justify
    difficulty: demanding
    statement: >
      Theorem (cancellation): if $c$, $a$, $b$ and $m$ are integers with $m > 0$,
      $\gcd(c, m) = 1$ and $ca \equiv cb \pmod m$, then $a \equiv b \pmod m$.
      Show that the hypothesis $\gcd(c, m) = 1$ is carrying the result rather
      than decorating it, and say what that shows about dropping hypotheses in
      general.
    answer: >
      Take $c = 3$, $m = 6$, $a = 1$, $b = 3$. The remaining hypotheses hold:
      $m > 0$, and $ca = 3$ while $cb = 9$, with $9 - 3 = 6$, so
      $ca \equiv cb \pmod 6$. The conclusion fails: $b - a = 2$ and $6$ does not
      divide $2$, so $a \equiv b \pmod 6$ is false. The discarded hypothesis is
      genuinely discarded here, since $\gcd(3, 6) = 3$ rather than $1$. So the
      statement obtained by deleting the coprimality hypothesis is not a stronger
      theorem; it is a false statement, and the example is a counterexample to
      it. This is the normal case rather than an accident. A theorem's hypotheses
      are part of what it asserts, so deleting one enlarges the set of situations
      the claim ranges over, and the enlargement is exactly where the proof no
      longer runs — here, the step that would multiply by an inverse of $c$
      modulo $m$, which exists only when $c$ and $m$ are coprime.
    rubric:
      - >
        Exhibits concrete integers and verifies both halves: the surviving
        hypotheses hold, and the conclusion fails.
      - >
        Checks that the deleted hypothesis really fails in the example, so that
        the example is a counterexample to the weakened statement and not to the
        theorem.
      - >
        States the general moral in the right direction: dropping a hypothesis
        usually produces a false statement, not a stronger true one.
    targets:
      - foundations.proof.def-theorem
    exercises:
      - foundations.proof.def-definition
    connects: []
    tags: []

  - id: proof-def-theorem-02
    kind: decide
    difficulty: standard
    statement: >
      Theorem: if a positive integer has an odd number of positive divisors then
      it is a perfect square. You are looking at $n = 12$, whose positive
      divisors are $1, 2, 3, 4, 6, 12$. What does the theorem tell you about
      $12$?
    answer: >
      Nothing. The hypothesis is "$n$ has an odd number of positive divisors",
      and $12$ has six, an even number, so the hypothesis fails and the theorem
      does not engage. A theorem whose hypothesis fails is silent: it does not
      assert the conclusion, and it does not assert the negation of the
      conclusion either. It happens to be true that $12$ is not a perfect square,
      but that fact was established by looking at $12$, not by the theorem, and
      the theorem would have been equally silent about $16$, which has five
      divisors and is a square, or about $36$, which has nine. Reading the
      theorem as though a failed hypothesis reversed the conclusion is reading
      its converse, a separate statement carrying its own burden of proof.
    choices:
      - text: >
          Nothing at all — its hypothesis fails at $n = 12$.
        correct: true
        feedback: >
          Exactly. Six is even, so the theorem never engages, and you may learn
          about $12$ by other means but not from this result.
      - text: >
          That $12$ is not a perfect square.
        feedback: >
          A failed hypothesis withdraws the conclusion, it does not negate it.
          That $12$ is not a square is true and was found by inspection, not
          supplied by the theorem.
      - text: >
          That the theorem is false, since $12$ is not a perfect square.
        feedback: >
          The theorem says nothing about $12$, so $12$ cannot refute it. A
          counterexample would need a number with an odd divisor count that is
          not a square.
    rubric:
      - >
        Counts the divisors and identifies the hypothesis as the clause that
        fails.
      - >
        States the silence precisely: neither the conclusion nor its negation is
        asserted where a hypothesis fails.
    targets:
      - foundations.proof.def-theorem
    exercises: []
    connects: []
    tags: []

  - id: proof-def-proof-01
    kind: justify
    difficulty: demanding
    statement: >
      Claim: if $m$ is an even integer then $m^{2} + 2m$ is divisible by $4$.
      Write out a proof as a numbered sequence of assertions, naming for each
      line which of the five licences it claims — axiom, definition, hypothesis
      of the claim, previously proved theorem, or inference from earlier lines.
    answer: >
      (1) $m$ is an even integer — hypothesis of the claim. (2) $m = 2k$ for some
      integer $k$ — definition of "even", unfolded, applied to line 1. (3)
      $m^{2} + 2m = (2k)^{2} + 2(2k)$ — inference from line 2 by substitution.
      (4) $(2k)^{2} + 2(2k) = 4k^{2} + 4k$ — previously proved arithmetic
      identities. (5) $4k^{2} + 4k = 4(k^{2} + k)$ — the distributive law, an
      axiom of arithmetic. (6) $k^{2} + k$ is an integer — previously proved
      theorem, that the integers are closed under multiplication and addition.
      (7) $m^{2} + 2m = 4t$ for the integer $t = k^{2} + k$ — inference from lines
      3, 4, 5 and 6. (8) $4$ divides $m^{2} + 2m$ — definition of divisibility,
      folded, applied to line 7. Every line looks only backwards, so checking any
      one of them needs nothing but the lines above it and no ingenuity at all.
      Line 6 is the one that is easiest to leave out and is genuinely required:
      without it line 7 has produced a number, not an integer, and the definition
      of divisibility could not be folded.
    rubric:
      - >
        Names a licence for every line, drawn from the five and no others — in
        particular the closure line, that $k^{2} + k$ is an integer, is present
        rather than assumed silently.
      - >
        Opens with the hypothesis and closes with the claim, with each line
        justified only by lines above it.
      - >
        Uses the definition of "even" in the unfolding direction and the
        definition of divisibility in the folding direction.
    targets:
      - foundations.proof.def-proof
    exercises:
      - foundations.proof.def-definition
    connects: []
    tags: []

  - id: proof-def-proof-02
    kind: decide
    difficulty: demanding
    statement: >
      A theorem published in 1965 has been cited in hundreds of later papers.
      A referee now finds a step in its proof that cannot be expanded into
      licensed lines. What is the theorem's status?
    answer: >
      It is unproved. A proof is a chain in which every assertion carries a
      licence, and a step that cannot be expanded has no licence, so the chain is
      broken and the statement at the end of it has not been established. That is
      a claim about the argument, not about the world: the theorem may well be
      true, and it may have another proof, but until the gap is filled or another
      proof is produced its status is that of a conjecture — believed, and usable
      in no proof. The number of citations changes nothing, because citation is
      not one of the five licences; what it does change is the amount of later
      work now resting on a conjecture, which is why the gap matters. Nor is the
      theorem false. Falsity would need a counterexample or a proof of the
      negation, and a gap supplies neither.
    choices:
      - text: >
          Unproved — it reverts to a conjecture unless the gap is filled or
          another proof exists.
        correct: true
        feedback: >
          Right. A step with no licence breaks the chain, and a broken chain
          establishes nothing, however long the statement has been believed.
      - text: >
          False, since its proof is defective.
        feedback: >
          A gap shows the argument fails, not that the statement fails. Refuting
          it would take a counterexample or a proof of its negation, neither of
          which a missing step provides.
      - text: >
          Still proved, since hundreds of results depend on it and none has run
          into trouble.
        feedback: >
          Dependence is not a licence, and a proof is not evidence that
          accumulates. If the cited theorem is unproved, everything resting on it
          is conditional on it too.
    rubric:
      - >
        Answers about the argument rather than about the truth of the statement,
        and does not slide from "unproved" to "false".
      - >
        Names the consequence for the citing papers: their results become
        conditional on the gap being fillable.
    targets:
      - foundations.proof.def-proof
    exercises: []
    connects: []
    tags: []

  - id: proof-def-proof-03
    kind: decide
    difficulty: routine
    statement: >
      Which of the following may appear as a line in a proof of a statement $S$
      with no further justification?
    answer: >
      A hypothesis of $S$. The definition lists exactly five licences for a line:
      it is an axiom, a definition, a hypothesis of $S$, a previously proved
      theorem, or a consequence of earlier lines by a rule of inference. A
      hypothesis is on that list and costs nothing, because the proof never
      claims the hypothesis is true — it claims the conclusion holds wherever the
      hypothesis does, and the assumption is discharged when the proof ends. A
      statement checked in a thousand cases is not on the list: over an infinite
      domain those checks are a thousand small theorems about a thousand
      instances, so citing the general statement is citing a conjecture. And $S$
      itself is not on the list either; helping yourself to it makes the argument
      circular, since $S \Rightarrow S$ holds for every statement whatever.
    choices:
      - text: >
          A hypothesis of $S$.
        correct: true
        feedback: >
          One of the five licences. It is granted for free precisely because the
          proof establishes a conditional, and the assumption is discharged at
          the end.
      - text: >
          A general statement that has been verified in its first thousand cases.
        feedback: >
          Verified instances are theorems about those instances. The general
          statement is a conjecture until proved, and a conjecture may be used in
          no proof.
      - text: >
          The statement $S$ itself, on the grounds that it is what is being
          proved.
        feedback: >
          That is circular: assuming $S$ and concluding $S$ establishes nothing,
          because the implication holds whether $S$ is true or false.
    rubric:
      - >
        Recalls the five licences and places the hypothesis among them.
      - >
        Says why verified instances are not a licence, and why assuming $S$ is
        not one either.
    targets:
      - foundations.proof.def-proof
    exercises: []
    connects: []
    tags: []

  # --- the standard shapes: direct, contraposed, by contradiction -------------

  - id: proof-direct-proof-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that the product of any two integers of the form $6k + 5$ is of the
      form $6k + 1$. Open both ends before doing any arithmetic, and say what
      your target was.
    answer: >
      Let $m$ and $n$ be integers of the given form. Unfolding the hypotheses
      gives the data: $m = 6a + 5$ and $n = 6b + 5$ for some integers $a$ and
      $b$. Unfolding the conclusion gives the target: an integer $t$ with
      $mn = 6t + 1$. Now work forwards. $mn = (6a+5)(6b+5) = 36ab + 30a + 30b +
      25$. The awkward term is the constant, and $25 = 24 + 1$ is what makes the
      whole thing land: $mn = 36ab + 30a + 30b + 24 + 1 = 6(6ab + 5a + 5b + 4) +
      1$. Since $a$ and $b$ are integers, so is $t = 6ab + 5a + 5b + 4$, and
      $mn = 6t + 1$, which is the target. Note that the hypothesis was used
      twice and the target told you what to aim the algebra at — without it,
      $36ab + 30a + 30b + 25$ is just an expression, and with it the only
      question is what remainder the constant leaves on division by $6$.
    rubric:
      - >
        Names the target explicitly as an integer $t$ with $mn = 6t + 1$ before
        multiplying out, rather than expanding and hoping.
      - >
        Splits $25$ as $24 + 1$, so that every term but the last is a multiple of
        $6$.
      - >
        Checks that the witness $t = 6ab + 5a + 5b + 4$ is an integer before
        folding the definition back.
    targets:
      - foundations.proof.direct-proof
    exercises:
      - foundations.proof.def-definition
    connects: []
    tags: []

  - id: proof-direct-proof-02
    kind: work
    difficulty: standard
    statement: >
      Here $x \mid y$ means $y = xk$ for some integer $k$. A direct proof of "if
      $a \mid b$ and $a \mid c$ then $a \mid (5b - 3c)$" produces, from the data,
      an explicit integer $t$ with $5b - 3c = at$. Run that proof with $a = 7$,
      $b = 21$ and $c = 14$, and give the value of $t$ it produces.
    answer: >
      $t = 9$. The general proof unfolds the two hypotheses into $b = aj$ and
      $c = ak$ for integers $j$ and $k$, and unfolds the conclusion into the
      target: an integer $t$ with $5b - 3c = at$. Working forwards,
      $5b - 3c = 5aj - 3ak = a(5j - 3k)$, and $5j - 3k$ is an integer, so
      $t = 5j - 3k$. Now instantiate: $21 = 7 \cdot 3$ gives $j = 3$, and
      $14 = 7 \cdot 2$ gives $k = 2$, so $t = 5 \cdot 3 - 3 \cdot 2 = 15 - 6 =
      9$. The arithmetic confirms it directly: $5 \cdot 21 - 3 \cdot 14 = 105 -
      42 = 63 = 7 \cdot 9$. A direct proof usually hands the witness over like
      this, because the target named the object it had to produce.
    expects: "9"
    rubric:
      - >
        Extracts $j$ and $k$ from the hypotheses before combining them, rather
        than dividing $63$ by $7$ and stopping.
      - >
        Reaches the witness in the general form $t = 5j - 3k$ and then
        instantiates, so the same proof would run for any $a$, $b$, $c$.
    targets:
      - foundations.proof.direct-proof
    exercises:
      - foundations.proof.def-definition
    connects: []
    tags: []

  - id: proof-direct-proof-03
    kind: decide
    difficulty: routine
    statement: >
      A direct proof of $P \Rightarrow Q$ has just ended. What has it
      established?
    answer: >
      That $Q$ holds wherever $P$ does, and nothing about whether either of them
      holds. The assumption $P$ was made at the start in order to be discharged
      at the end: inside the proof you reason as though $P$ were given, and what
      leaves the proof is the conditional, not its parts. This is why a direct
      proof of a conditional is available even when the hypothesis is never
      satisfied — the implication is then vacuously true and the proof has
      nothing to do. It is also why a proof of $P \Rightarrow Q$ tells you
      nothing on its own about a situation where $P$ fails, and why you may not
      detach $Q$ until you have separately established $P$, which is exactly what
      modus ponens requires.
    choices:
      - text: >
          That $Q$ holds wherever $P$ does; neither $P$ nor $Q$ has been asserted.
        correct: true
        feedback: >
          Right — the assumption is discharged when the proof ends, so what has
          been established is the conditional itself.
      - text: >
          That $P$ and $Q$ are both true.
        feedback: >
          $P$ was assumed, not proved, and the proof never claimed it. If $P$
          happens to be false the conditional is still established.
      - text: >
          That $Q$ is true.
        feedback: >
          $Q$ becomes available only once $P$ has been established separately —
          that detachment step is modus ponens, and it is not part of this proof.
    rubric:
      - >
        States the conclusion as a conditional, and says that the assumption is
        discharged rather than retained.
      - >
        Notes that detaching $Q$ needs $P$ established independently.
    targets:
      - foundations.proof.direct-proof
    exercises:
      - foundations.logic.def-conditional
    connects: []
    tags: []

  - id: proof-contraposition-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that for all integers $a$ and $b$, if $ab$ is odd then $a$ is odd and
      $b$ is odd. Write down the contrapositive explicitly before you start.
    answer: >
      The conclusion is a conjunction, so its negation is a disjunction: "not
      ($a$ odd and $b$ odd)" is "$a$ is even or $b$ is even". The contrapositive
      to prove is therefore: if $a$ is even or $b$ is even, then $ab$ is even.
      Getting this negation right is the whole difficulty, since "$a$ is even and
      $b$ is even" would be a strictly stronger hypothesis and would leave the
      mixed pairs unproved. Now prove the contrapositive, and since the
      hypothesis is a disjunction it is used by taking each disjunct in turn.
      Suppose $a$ is even, so $a = 2r$ for some integer $r$. Then $ab = 2(rb)$
      and $rb$ is an integer, so $ab$ is even. Suppose instead $b$ is even, so
      $b = 2s$; then $ab = 2(as)$ with $as$ an integer, and again $ab$ is even.
      One of the two disjuncts holds, so in either case $ab$ is even, which is
      the negation of the original hypothesis. Since a statement and its
      contrapositive are logically equivalent, the claim is proved. Contraposing
      paid here because "$ab$ is odd" hands over an equation about the product
      and nothing about the factors, whereas the negated conclusion hands over an
      equation for one factor.
    rubric:
      - >
        Negates the conjunction into a disjunction — "$a$ is even or $b$ is
        even", not "both are even".
      - >
        Uses the disjunctive hypothesis by deriving the conclusion from each
        disjunct separately, rather than choosing one.
      - >
        Says why contraposition is the profitable direction here: the negated
        conclusion is the end that unfolds into an equation.
    targets:
      - foundations.proof.contraposition
    exercises:
      - foundations.logic.contrapositive
    connects: []
    tags: []

  - id: proof-contraposition-02
    kind: decide
    difficulty: standard
    statement: >
      For a real number $x$, consider the claim "if $x^{3} > 8$ then $x > 2$".
      Which of the following is its contrapositive?
    answer: >
      "If $x \le 2$ then $x^{3} \le 8$." Contraposing means negating both sides
      and reversing them, and both operations must be carried out. The negation
      of "$x > 2$" over the reals is "$x \le 2$", not "$x < 2$"; the negation of
      "$x^{3} > 8$" is "$x^{3} \le 8$". Reversing puts the negated conclusion
      first. The two statements listed alongside are the usual impostors:
      swapping without negating gives the converse "if $x > 2$ then $x^{3} > 8$",
      and negating without swapping gives the inverse "if $x^{3} \le 8$ then
      $x \le 2$". Converse and inverse are equivalent to each other and not to
      the claim, so proving either of them would leave the original untouched —
      here all four statements happen to be true, which is exactly why the
      distinction has to be made by form rather than by feel.
    choices:
      - text: >
          If $x \le 2$ then $x^{3} \le 8$.
        correct: true
        feedback: >
          Both sides negated and the order reversed. Note $\le$ rather than
          $<$: the negation of "greater than" is "less than or equal to".
      - text: >
          If $x > 2$ then $x^{3} > 8$.
        feedback: >
          That is the converse — the sides are swapped but not negated. It is a
          separate claim with its own burden of proof.
      - text: >
          If $x^{3} \le 8$ then $x \le 2$.
        feedback: >
          That is the inverse — both sides negated, but left in the original
          order. The inverse is equivalent to the converse, not to the claim.
      - text: >
          If $x < 2$ then $x^{3} < 8$.
        feedback: >
          The order and the negation are both right, but the negation of
          "$x > 2$" is "$x \le 2$"; this version silently drops the case
          $x = 2$.
    rubric:
      - >
        Negates and reverses, and does not stop after doing only one of the two.
      - >
        Negates the strict inequalities correctly, to $\le$ rather than $<$.
    targets:
      - foundations.proof.contraposition
    exercises:
      - foundations.logic.contrapositive
    connects: []
    tags: []

  - id: proof-contradiction-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that there are no integers $x$ and $y$ with $x^{2} - y^{2} = 2$. Say
      why a direct proof is not on offer here, and identify the false statement
      your argument arrives at.
    answer: >
      The claim denies existence, so there is no object to construct and nothing
      to derive forwards to: a direct proof would need a target, and the target
      here is the absence of a target. That is exactly the situation
      contradiction is for. Suppose then that integers $x$ and $y$ satisfy
      $x^{2} - y^{2} = 2$. Factor the left side: $(x - y)(x + y) = 2$. Now
      compare the parities of the two factors. Their sum is $(x - y) + (x + y) =
      2x$, which is even, and two integers with an even sum are either both even
      or both odd. If both are even, write $x - y = 2u$ and $x + y = 2v$; then
      their product is $4uv$, so $4$ divides $2$, which is false since
      $2 = 4 \cdot 0 + 2$. If both are odd, their product is odd, so $2$ is odd,
      which is false since $2 = 2 \cdot 1$. Either way a false statement has been
      derived from the supposition, so no such integers exist. Two remarks. The
      case split is exhaustive precisely because of the parity observation, which
      is the load-bearing step and is easy to leave out. And the contradiction is
      with an established arithmetic fact rather than with the hypothesis, which
      is the sign that the argument is not a contraposition wearing a wrapper.
    rubric:
      - >
        Says why contradiction rather than a direct proof: the claim denies
        existence, so there is no object to produce and nothing to derive
        forwards to.
      - >
        Establishes that $x - y$ and $x + y$ have the same parity, from their sum
        being $2x$, rather than assuming it.
      - >
        Runs both parity cases and names the false statement each one reaches —
        that $4$ divides $2$, and that $2$ is odd.
    targets:
      - foundations.proof.contradiction
    exercises:
      - foundations.proof.direct-proof
    connects: []
    tags: []

  - id: proof-contradiction-02
    kind: decide
    difficulty: demanding
    statement: >
      You are to prove by contradiction that if $r$ is irrational then $r + 3$ is
      irrational. What do you assume at the start, and what breaks?
    answer: >
      Assume $r$ is irrational and $r + 3$ is rational: the hypothesis is kept
      and only the conclusion is negated, because the negation of $P \Rightarrow
      Q$ is "$P$ and $\neg Q$". Now $r + 3 = p/q$ for integers $p$ and $q$ with
      $q \ne 0$, so $r = p/q - 3 = (p - 3q)/q$. The numerator $p - 3q$ is an
      integer and the denominator $q$ is a nonzero integer, so $r$ is rational —
      contradicting the assumption that $r$ is irrational. Hence $r + 3$ is
      irrational. Note that the contradiction lands on the hypothesis $P$, which
      is the structural warning sign: what the argument really proved is "if
      $r + 3$ is rational then $r$ is rational", the contrapositive, and it reads
      more cleanly written that way with the contradiction wrapper stripped out.
      Assuming instead that $r$ is rational would negate the hypothesis and
      abandon the only data available.
    choices:
      - text: >
          Assume $r$ is irrational and $r + 3$ is rational; then $r = (r+3) - 3$
          is a difference of rationals, hence rational.
        correct: true
        feedback: >
          Right, and worth noticing that the contradiction lands on the
          hypothesis — so this is a contraposition wearing a wrapper, and reads
          better with the wrapper removed.
      - text: >
          Assume $r$ is rational and $r + 3$ is rational, and derive a
          contradiction from the pair.
        feedback: >
          That negates the hypothesis instead of the conclusion. The negation of
          a conditional keeps the hypothesis exactly as it stood, and there is
          nothing contradictory about both being rational.
      - text: >
          Assume $r + 3$ is rational, and nothing else.
        feedback: >
          Dropping the hypothesis discards the fact you need to contradict.
          Without "$r$ is irrational" on the page, deriving that $r$ is rational
          contradicts nothing.
      - text: >
          Assume $r$ is irrational and $r + 3$ is irrational, and look for an
          absurdity.
        feedback: >
          That assumes the conclusion rather than its negation, which is
          circular. A contradiction proof assumes what it intends to refute.
    rubric:
      - >
        Negates the conditional correctly: hypothesis retained, conclusion
        negated.
      - >
        Derives rationality of $r$ from rationality of $r + 3$ by exhibiting it
        as a ratio of integers with nonzero denominator.
      - >
        Observes that the contradiction lands on the hypothesis, so the argument
        is a contraposition in disguise.
    targets:
      - foundations.proof.contradiction
    exercises:
      - foundations.logic.conditional-as-disjunction
    connects: []
    tags: []

  - id: proof-contradiction-03
    kind: decide
    difficulty: routine
    statement: >
      Halfway through a proof by contradiction you derive $2 = 3$. What may you
      conclude?
    answer: >
      That either the assumed negation is false or one of your own steps is
      wrong, so every line must now be checked. This is the standing cost of the
      method. In a direct proof a mistake usually leaves you stuck, and being
      stuck is a visible signal; in a proof by contradiction a mistake typically
      manufactures an absurdity, which looks exactly like success. So the arrival
      of $2 = 3$ certifies nothing about the lines above it: the argument is
      finished only once each of those lines has been checked against its
      licence. The absurdity itself is perfectly serviceable, incidentally — any
      false statement will do, and it need not be presented as some $R$ together
      with the negation of $R$, since $2 = 3$ is already the negation of the
      previously proved $2 \ne 3$.
    choices:
      - text: >
          Either the assumption is false or the argument contains an error, so
          every line needs checking.
        correct: true
        feedback: >
          Exactly. An error inside a contradiction proof produces a contradiction
          too, so reaching one is not evidence that the steps were sound.
      - text: >
          The proof is complete, and the absurdity confirms that the reasoning
          was sound.
        feedback: >
          It confirms nothing about the reasoning. That is precisely the asymmetry
          with a direct proof, where a mistake tends to leave you stuck instead.
      - text: >
          Nothing, since a usable contradiction must have the form "$R$ and not
          $R$".
        feedback: >
          Any statement known to be false will do. $2 = 3$ already contradicts
          the proved fact $2 \ne 3$, so it is of that form in substance.
    rubric:
      - >
        Names both possibilities — a false assumption, or an error in the
        argument — rather than only the first.
      - >
        States the resulting obligation: check every line, since the method does
        not check them for you.
    targets:
      - foundations.proof.contradiction
    exercises: []
    connects: []
    tags: []

  - id: proof-ex-sqrt-two-irrational-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that no rational number has square $3$. Your proof must include a
      proof of the divisibility step it leans on, rather than citing it.
    answer: >
      Suppose some rational number has square $3$, and write it in lowest terms
      as $p/q$ with $p$ and $q$ integers and $q \ne 0$; in particular $p$ and $q$
      are not both divisible by $3$. Clearing the denominator in $(p/q)^{2} = 3$
      gives $p^{2} = 3q^{2}$, so $3$ divides $p^{2}$. Now the step the argument
      leans on: if $3$ divides $p^{2}$ then $3$ divides $p$. Prove it by
      contraposition. If $3$ does not divide $p$ then $p = 3k + 1$ or
      $p = 3k + 2$ for some integer $k$, those being the only remainders left. In
      the first case $p^{2} = 9k^{2} + 6k + 1 = 3(3k^{2} + 2k) + 1$; in the
      second, $p^{2} = 9k^{2} + 12k + 4 = 3(3k^{2} + 4k + 1) + 1$. Either way
      $p^{2}$ leaves remainder $1$, so $3$ does not divide $p^{2}$. Applying the
      step, $3$ divides $p$, say $p = 3r$. Substituting, $9r^{2} = 3q^{2}$, hence
      $q^{2} = 3r^{2}$, so $3$ divides $q^{2}$ and, by the same step again, $3$
      divides $q$. So $3$ divides both $p$ and $q$, contradicting lowest terms.
      No such rational exists. The step is where all the real content sits, and
      its converse — that $3$ divides the square of any multiple of $3$ — is the
      easy direction and is useless here.
    rubric:
      - >
        Proves the step "$3$ divides $p^{2}$ implies $3$ divides $p$" rather than
        asserting it, and does so by ruling out both nonzero remainders.
      - >
        Applies the step twice, to $p$ and then to $q$, since the contradiction
        needs both.
      - >
        Identifies the contradiction as being with the lowest-terms
        normalization, which the prover imposed for free at the start.
    targets:
      - foundations.proof.ex-sqrt-two-irrational
    exercises:
      - foundations.proof.contradiction
      - foundations.proof.contraposition
    connects: []
    tags: []

  - id: proof-ex-sqrt-two-irrational-02
    kind: decide
    difficulty: standard
    statement: >
      The proof that no rational number has square $2$ begins "write it as $p/q$
      in lowest terms". A reader objects that the claim said nothing about lowest
      terms, so the proof has quietly strengthened its hypothesis. What is the
      correct reply?
    answer: >
      That every rational number has such a representation, so assuming it costs
      nothing and loses no generality — and that the normalization is not
      incidental but is precisely what the contradiction destroys. The claim
      denies that any rational squares to $2$; if one did, it could be written
      with numerator and denominator having no common factor, since cancelling
      common factors terminates. So the supposed rational may be taken in that
      form without weakening what is being refuted. The argument then derives
      that $p$ and $q$ are both even, which contradicts the form we granted
      ourselves. That is the characteristic shape of this kind of proof: the
      contradiction is not with an axiom or with the hypothesis, but with a
      convenience the prover imposed at the start, and if the convenience had not
      been imposed there would have been nothing for the argument to break.
    choices:
      - text: >
          Every rational has a lowest-terms representation, so nothing is
          assumed — and it is that free normalization the contradiction destroys.
        correct: true
        feedback: >
          Both halves matter. The assumption is free because cancellation
          terminates, and it is load-bearing because "both even" is absurd only
          relative to it.
      - text: >
          The claim is only about fractions already in lowest terms, so no extra
          assumption is being made.
        feedback: >
          The claim is about every rational number. The reply is not to narrow
          the claim but to observe that every rational admits the
          representation.
      - text: >
          The objection is right, and the proof needs repair by treating
          fractions not in lowest terms separately.
        feedback: >
          There is no separate case: a fraction not in lowest terms names the
          same rational as one that is, and the claim is about the number, not
          about the way it is written.
    rubric:
      - >
        Says why the assumption is free — every rational has such a
        representation — rather than restricting the claim.
      - >
        Identifies the normalization as the thing the contradiction attacks.
    targets:
      - foundations.proof.ex-sqrt-two-irrational
    exercises:
      - foundations.proof.contradiction
    connects: []
    tags: []

  - id: proof-biconditional-01
    kind: justify
    difficulty: standard
    statement: >
      Prove that for every integer $n$, $4$ divides $n^{2}$ if and only if $n$ is
      even. Label the two directions and say which technique each one uses.
    answer: >
      ($\Leftarrow$) Assume $n$ is even, so $n = 2k$ for some integer $k$. Then
      $n^{2} = 4k^{2}$ and $k^{2}$ is an integer, so $4$ divides $n^{2}$. That
      direction is direct. ($\Rightarrow$) Assume $4$ divides $n^{2}$ and show
      $n$ is even. Directly this is awkward, since $n^{2} = 4t$ says little about
      $n$, so contrapose: assume $n$ is odd, so $n = 2k + 1$, and then
      $n^{2} = 4k^{2} + 4k + 1 = 4(k^{2} + k) + 1$, which leaves remainder $1$ on
      division by $4$, so $4$ does not divide $n^{2}$. That is the negation of
      the hypothesis of this direction, so the contrapositive is proved and with
      it the direction itself. Both directions are now established, so the
      biconditional holds. Two features are typical: the halves used different
      techniques, and neither could be obtained by reading the other backwards —
      reading ($\Leftarrow$) backwards would be assuming exactly what
      ($\Rightarrow$) is there to prove.
    rubric:
      - >
        Gives two separate arguments, each opening from its own hypothesis, and
        labels which is which.
      - >
        Proves the harder direction by contraposition (or by an equivalent
        argument) rather than by reversing the easy one.
      - >
        In the contraposed half, computes the remainder $1$ rather than merely
        observing that $n^{2}$ is odd.
    targets:
      - foundations.proof.biconditional
    exercises:
      - foundations.proof.direct-proof
    connects: []
    tags: []

  - id: proof-biconditional-02
    kind: decide
    difficulty: demanding
    statement: >
      For real $x$, a proof of "$x = 3$ if and only if $x^{2} - 9 = 0$" is
      offered as the chain $x = 3 \iff x - 3 = 0 \iff (x-3)(x+3) = 0 \iff
      x^{2} - 9 = 0$. Where does it break?
    answer: >
      At the middle link. Going left to right, $x - 3 = 0$ certainly gives
      $(x-3)(x+3) = 0$, since multiplying an equation by anything preserves it.
      Going right to left it fails: $(x-3)(x+3) = 0$ holds at $x = -3$, where
      $x - 3 = -6$ is not $0$. Multiplying by a quantity that can vanish is a
      one-way step, and writing $\iff$ over it asserts a reversibility that has
      not been checked. The first and third links are genuine equivalences —
      adding $3$ to both sides reverses, and expanding a product is an identity —
      so the chain does prove $x = 3 \Rightarrow x^{2} - 9 = 0$, one direction
      and no more. That is the most it could prove, because the biconditional
      itself is false: $x = -3$ satisfies $x^{2} - 9 = 0$ and is not $3$. A chain
      of equivalences is legitimate only when every link has been checked in both
      directions, and the safe habit is to write $\Rightarrow$ until the check
      has been made.
    choices:
      - text: >
          The step from $x - 3 = 0$ to $(x-3)(x+3) = 0$ runs one way only —
          $x = -3$ satisfies the right side and not the left.
        correct: true
        feedback: >
          Multiplying by $x + 3$, which can be zero, is not reversible. The chain
          proves one direction, and the biconditional is in fact false.
      - text: >
          Nothing breaks; every link is an algebraic identity, so both directions
          are proved at once.
        feedback: >
          If that were so the biconditional would be true, and it is not: $x =
          -3$ gives $x^{2} - 9 = 0$ while $x \ne 3$. Exactly one link is to
          blame.
      - text: >
          The step from $(x-3)(x+3) = 0$ to $x^{2} - 9 = 0$ is invalid, since
          expanding changes the equation.
        feedback: >
          Expanding a product is an identity, true for every real $x$, so that
          link reverses freely. The failure is one step earlier.
      - text: >
          The chain is fine but incomplete: it needs a fourth link back to
          $x = 3$ to close the loop.
        feedback: >
          A chain of genuine equivalences needs no return trip — it already runs
          both ways. The defect is that one of its links does not.
    rubric:
      - >
        Locates the single non-reversible link and names the operation that
        breaks it, multiplication by a possibly zero quantity.
      - >
        Exhibits $x = -3$ as the value witnessing the failure, and concludes that
        the biconditional itself is false.
    targets:
      - foundations.proof.biconditional
    exercises: []
    connects: []
    tags: []

  - id: proof-cases-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that for every integer $n$, $n^{2}$ leaves remainder $0$ or $1$ on
      division by $4$. Justify the exhaustiveness of your case list as part of
      the proof, and say what the result rules out.
    answer: >
      Let $n$ be an arbitrary integer and split on its parity. The list is
      exhaustive because every integer leaves remainder $0$ or $1$ on division by
      $2$ and no other remainder is available, so $n$ is even or odd; that
      sentence is part of the proof, not a preliminary. Case one, $n$ even: then
      $n = 2k$ for some integer $k$, and $n^{2} = 4k^{2}$, which is $4k^{2} + 0$,
      so the remainder is $0$. Case two, $n$ odd: then $n = 2k + 1$, and
      $n^{2} = 4k^{2} + 4k + 1 = 4(k^{2} + k) + 1$ with $k^{2} + k$ an integer
      and the remainder $1$ lying in the required range $0 \le 1 < 4$. Every
      integer falls into at least one case and in each case the claim holds, so
      the claim holds for every integer. What this rules out is any square
      leaving remainder $2$ or $3$: no integer squares to a number of the form
      $4m + 3$, so for instance $2027$, which is $4 \cdot 506 + 3$, is not a
      perfect square, and that follows without examining a single square root.
    rubric:
      - >
        Justifies exhaustiveness explicitly — every integer is even or odd — as a
        step of the proof rather than as an assumption.
      - >
        Computes both cases, and checks in the odd case that the remainder is $1$
        rather than merely that the value is odd.
      - >
        Draws the negative consequence: no perfect square leaves remainder $2$ or
        $3$ on division by $4$.
    targets:
      - foundations.proof.cases
    exercises:
      - foundations.proof.direct-proof
    connects: []
    tags: []

  - id: proof-cases-02
    kind: decide
    difficulty: standard
    statement: >
      A proof of a claim about every integer $n$ is organised into the two cases
      "$n > 0$" and "$n$ is even". Is that a legitimate case split?
    answer: >
      No, and the defect is a gap rather than the overlap. The two conditions do
      overlap — $n = 2$ satisfies both — but overlap costs only a duplicated
      paragraph and never validity. What sinks the split is that some integers
      satisfy neither condition: $n = -3$ is not positive and is not even, so
      under $n = -3$ the argument has proved nothing at all, and the claim is
      simply unestablished there. That is where a false statement would hide, and
      it is not a blemish to be patched afterwards. A legitimate split for the
      integers might be "$n$ is even" and "$n$ is odd", or "$n > 0$", "$n = 0$",
      "$n < 0$" — in each case the list is exhaustive, and saying why it is
      exhaustive is itself part of the proof.
    choices:
      - text: >
          No — the cases leave a gap, for instance $n = -3$, which is neither
          positive nor even.
        correct: true
        feedback: >
          Exactly. Exhaustiveness is about covering the domain, and the claim
          goes unproved at every negative odd integer.
      - text: >
          No — the cases overlap at $n = 2$, and a case split must partition the
          domain.
        feedback: >
          Overlap is free: two branches both covering $n = 2$ costs a repeated
          paragraph and nothing else. The cases need to cover, not to partition.
      - text: >
          Yes — every integer is covered, since a negative integer is handled by
          the even case.
        feedback: >
          Negative odd integers, such as $-3$, are in neither branch. Being
          negative does not make an integer even.
    rubric:
      - >
        Identifies the failure as a gap and names an integer in neither case.
      - >
        States that overlap between cases is harmless, so the objection is not
        that the branches meet.
    targets:
      - foundations.proof.cases
    exercises: []
    connects: []
    tags: []

  - id: proof-wlog-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $\lvert x \rvert + \lvert y \rvert \ge \lvert x - y \rvert$ for
      all real $x$ and $y$, using "without loss of generality" once. Name the
      transformation that licenses it before you use it.
    answer: >
      First the licence. Exchange the names $x$ and $y$ throughout the statement.
      The left side becomes $\lvert y \rvert + \lvert x \rvert$, which is the
      same number, and the right side becomes $\lvert y - x \rvert$, which equals
      $\lvert x - y \rvert$ since a number and its negative have the same
      absolute value. So the swap carries the statement to itself, and it carries
      the case $x < y$ onto the case $x \ge y$. That is the transformation, and
      naming it is the whole content of the phrase. So, without loss of
      generality, assume $x \ge y$. Then $x - y \ge 0$, so $\lvert x - y \rvert
      = x - y$. Now $x \le \lvert x \rvert$ and $-y \le \lvert y \rvert$, since
      every real is at most its own absolute value; adding these two inequalities
      gives $x - y \le \lvert x \rvert + \lvert y \rvert$. Hence
      $\lvert x - y \rvert \le \lvert x \rvert + \lvert y \rvert$, as required.
      The case $x < y$ is not being skipped: it is this proved case read with the
      names exchanged.
    rubric:
      - >
        States the transformation — the swap of $x$ and $y$ — and checks that it
        preserves both sides of the statement, using
        $\lvert y - x \rvert = \lvert x - y \rvert$.
      - >
        Uses the assumption $x \ge y$ to remove the absolute value on the right,
        which is the only thing the assumption is for.
      - >
        Bounds $x$ and $-y$ separately by their absolute values rather than
        assuming signs for $x$ and $y$ individually.
    targets:
      - foundations.proof.wlog
    exercises:
      - foundations.proof.cases
    connects: []
    tags: []

  - id: proof-wlog-02
    kind: decide
    difficulty: standard
    statement: >
      A claim concerns two integers $m$ and $n$, and the only symmetry available
      is that the statement is unchanged when the names $m$ and $n$ are
      exchanged. Which of the following uses of "without loss of generality" is
      illegitimate?
    answer: >
      "WLOG $m$ and $n$ are both positive" is the illegitimate one. WLOG is
      compressed case analysis, licensed only when an explicit transformation
      carries the discarded cases onto the retained one. The name swap is the
      only transformation on offer here, and it does not turn a negative integer
      into a positive one — exchanging the names of $-4$ and $7$ gives the pair
      $7$ and $-4$, which is still not a pair of positive integers. So the cases
      where one or both are negative are thrown away rather than reduced, and
      those are usually the cases where an argument breaks. The other two are
      licensed by the swap alone: given any pair, either $m \le n$ already or the
      swap makes it so, and the same applies to $\lvert m \rvert \le \lvert n
      \rvert$, since the swap exchanges the two absolute values. The test is
      blunt and always applies — produce the transformation, or write the cases
      out.
    choices:
      - text: >
          "WLOG $m$ and $n$ are both positive."
        correct: true
        feedback: >
          No transformation available carries a pair containing a negative
          integer to a pair of positive ones, so the negative cases are deleted
          rather than reduced.
      - text: >
          "WLOG $m \le n$."
        feedback: >
          This is the licensed use. If $m \le n$ fails then $n < m$, and the swap
          turns that pair into one satisfying the assumption.
      - text: >
          "WLOG $\lvert m \rvert \le \lvert n \rvert$."
        feedback: >
          Also licensed by the same swap, which exchanges $\lvert m \rvert$ and
          $\lvert n \rvert$; one of the two orderings must hold.
    rubric:
      - >
        Tests each candidate by asking whether the given swap carries the skipped
        cases onto the kept one.
      - >
        Says what goes wrong in the illegitimate case: the discarded cases are
        deleted, so the claim is unproved there.
    targets:
      - foundations.proof.wlog
