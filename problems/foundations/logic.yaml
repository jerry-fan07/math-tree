# problems targeting foundations.logic — the propositional and predicate calculus.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's ending
# with something the lesson has just handed over, and a `standard` or `routine`
# one, so the unit test has something fair to ask. Every `work` and `decide`
# problem is machine-checked; `justify` is where the proofs live. No problem
# reuses a lesson's worked example or a card's instance. See ../README.md.

problems:
  # --- propositions, and the four connectives ---------------------------------

  - id: logic-def-proposition-01
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of the four sentences below is *not* a proposition. Which one?
    answer: >
      "$3n + 1$ is even" is not a proposition. The test is whether the sentence
      carries a truth value as it stands, and the only defect that blocks one is
      an unassigned variable: with $n$ left open the sentence is true at $n = 3$
      and false at $n = 4$, so it has no verdict of its own. The other three all
      have verdicts, and each illustrates something that does *not* disqualify a
      sentence. "Every integer greater than $1$ has a prime divisor" contains a
      variable, but the variable is bound by "every", so the sentence closes and
      is in fact true. "There are infinitely many primes $p$ with $p + 2$ also
      prime" is unsettled mathematics, and ignorance is not a third truth value —
      it is true or false as a matter of fact, and so a proposition. "The number
      $2^{89} - 1$ is prime" is a proposition whose verdict takes work to
      discover, which again is beside the point.
    choices:
      - text: >
          Every integer greater than $1$ has a prime divisor
        feedback: >
          The "every" binds the variable, closing the sentence. A bound variable
          leaves nothing unassigned, so this is a proposition — a true one.
      - text: >
          $3n + 1$ is even
        correct: true
        feedback: >
          $n$ is unassigned, so there is nothing to evaluate: true at $n = 3$,
          false at $n = 4$, and no verdict for the bare sentence.
      - text: >
          There are infinitely many primes $p$ with $p + 2$ also prime
        feedback: >
          Nobody knows whether this is true, and that is irrelevant. Not knowing
          the verdict is different from there being no verdict.
      - text: >
          The number $2^{89} - 1$ is prime
        feedback: >
          Hard to check is not the same as undefined. The sentence is
          declarative and definite, so it is a proposition.
    rubric:
      - >
        Rejects the sentence with a free variable, not the unsettled one — an
        unproved conjecture is a perfectly good proposition.
      - >
        Notices that a variable bound by a quantifier does not leave the
        sentence open.
    targets:
      - foundations.logic.def-proposition
    exercises: []
    connects: []
    tags: []

  - id: logic-def-proposition-02
    kind: work
    difficulty: routine
    statement: >
      A compound proposition is built from the five propositional variables
      $p, q, r, s, t$. How many distinct truth assignments to those variables
      are there?
    answer: >
      $32$. A truth assignment picks one of the two values $\mathrm{T}$,
      $\mathrm{F}$ for each variable, and the choices are independent — nothing
      about $p$ constrains $q$. So the count is $2$ multiplied by itself five
      times, $2^5 = 32$. Bivalence is what makes the count finite and exact:
      because each variable takes exactly one of two values and never a third,
      there are no further cases to include, and because the compound's value is
      fixed once every variable is assigned, these $32$ assignments settle every
      question about it that truth values can settle. Answering $10$ mistakes
      $2 \cdot 5$ for $2^5$, and answering $25$ reverses base and exponent.
    expects: "32"
    rubric:
      - >
        Raises $2$ to the number of variables rather than multiplying $2$ by it.
      - >
        Says why the choices multiply: each variable is assigned independently
        of the others.
    targets:
      - foundations.logic.def-proposition
    exercises: []
    connects: []
    tags: []

  - id: logic-def-negation-01
    kind: decide
    difficulty: demanding
    statement: >
      For a fixed real number $t$, which sentence is the negation of
      "$-1 \le t < 4$"?
    answer: >
      "$t < -1$ or $t \ge 4$". A negation must be true in exactly the cases
      where the original is false, with nothing left over and nothing counted
      twice, so work case by case at the two boundaries. The original is a
      conjunction of $-1 \le t$ and $t < 4$; it fails when $t$ is below $-1$ or
      when $t$ is $4$ or above. At $t = -1$ the original is true, so its
      negation must be false — which rules out any answer containing
      $t \le -1$. At $t = 4$ the original is false, so its negation must be
      true — which rules out any answer containing only $t > 4$. Both boundary
      points therefore move exactly one step, and the endpoint that was included
      becomes excluded while the endpoint that was excluded becomes included.
      Every real number satisfies exactly one of "$-1 \le t < 4$" and
      "$t < -1$ or $t \ge 4$", which is the signature of a correct negation.
    choices:
      - text: >
          $t < -1$ or $t \ge 4$
        correct: true
        feedback: >
          Both boundaries flip their strictness. At $t = -1$ this is false and
          the original true; at $t = 4$ this is true and the original false.
      - text: >
          $t \le -1$ or $t > 4$
        feedback: >
          At $t = -1$ this and the original are both true, and a statement can
          never be true alongside its negation. The same fault appears at
          $t = 4$, where both are false.
      - text: >
          $t < -1$ or $t > 4$
        feedback: >
          The lower end is right, but $t = 4$ now satisfies neither this nor the
          original, so the two do not cover every case between them.
      - text: >
          $t < -1$ and $t \ge 4$
        feedback: >
          No real number satisfies both clauses, so this sentence is never true
          — it cannot be the negation of a sentence that is sometimes false.
    rubric:
      - >
        Tests both boundary values $t = -1$ and $t = 4$ explicitly, rather than
        flipping the inequality signs by reflex.
      - >
        Produces a sentence true in exactly the cases the original is false:
        every $t$ makes precisely one of the two true.
    targets:
      - foundations.logic.def-negation
    exercises: []
    connects: []
    tags: []

  - id: logic-def-negation-02
    kind: work
    difficulty: routine
    statement: >
      Let $p$ be the sentence "$x > 7$". For how many of the integers $x$ with
      $1 \le x \le 10$ is $\neg p$ true?
    answer: >
      $7$. Negation reverses the verdict, so $\neg p$ is true at exactly the
      integers where "$x > 7$" is false — that is, where $x \le 7$. In the range
      $1 \le x \le 10$ those are $1, 2, 3, 4, 5, 6, 7$, which is $7$ values, and
      the remaining three, $8, 9, 10$, make $p$ true. The count $7 + 3 = 10$ is
      the check that the negation partitions the range correctly: every integer
      in it makes exactly one of $p$, $\neg p$ true. The boundary is where the
      answer is decided. Writing the negation as "$x < 7$" instead of
      "$x \le 7$" loses the value $x = 7$ and gives $6$; that value makes
      "$x > 7$" false, so it must make the negation true.
    expects: "7"
    rubric:
      - >
        Negates $x > 7$ to $x \le 7$, keeping the boundary value $x = 7$.
      - >
        Checks the partition: the counts for $p$ and $\neg p$ add to the $10$
        integers in the range.
    targets:
      - foundations.logic.def-negation
    exercises: []
    connects: []
    tags: []

  - id: logic-def-conjunction-01
    kind: decide
    difficulty: demanding
    statement: >
      Let $p$ be "the alarm sounded" and $q$ be "the door locked". Which English
      sentence asserts the conjunction $\neg p \land \neg q$?
    answer: >
      "Neither the alarm sounded nor the door locked." A conjunction is a list of
      demands, all of which must be met, so $\neg p \land \neg q$ asserts two
      things at once: that the alarm did not sound, and that the door did not
      lock. "Neither ... nor ..." is exactly that double denial in one idiom, and
      it is true in only one of the four combinations, the one where $p$ and $q$
      are both false. Contrast the near misses. "The alarm did not sound or the
      door did not lock" is $\neg p \lor \neg q$, which is satisfied by three of
      the four combinations and is much weaker — it is true when the alarm was
      silent and the door locked. "The alarm did not sound, although the door
      locked" is $\neg p \land q$: the "although" is contrast, so the sentence is
      a conjunction, but its second conjunct is $q$ rather than $\neg q$. "The
      alarm sounded but the door did not lock" is $p \land \neg q$, a conjunction
      with the negations on the wrong halves.
    choices:
      - text: >
          Neither the alarm sounded nor the door locked
        correct: true
        feedback: >
          Two denials joined by "and", true only in the single combination where
          both $p$ and $q$ are false.
      - text: >
          The alarm did not sound or the door did not lock
        feedback: >
          This is $\neg p \lor \neg q$, true in three of the four combinations —
          one denial is enough for it, whereas the conjunction demands both.
      - text: >
          The alarm did not sound, although the door locked
        feedback: >
          "Although" is a conjunction, so the shape is right, but this asserts
          $q$ rather than denying it: $\neg p \land q$.
      - text: >
          The alarm sounded but the door did not lock
        feedback: >
          A conjunction again, and again the wrong halves are negated — this is
          $p \land \neg q$, which requires the alarm to have sounded.
    rubric:
      - >
        Reads "neither ... nor ..." as a conjunction of two negations, not as a
        negated disjunction left in "or" form.
      - >
        Distinguishes $\neg p \land \neg q$ from $\neg p \lor \neg q$ by naming
        a combination where the two differ.
    targets:
      - foundations.logic.def-conjunction
    exercises: []
    connects: []
    tags: []

  - id: logic-def-conjunction-02
    kind: work
    difficulty: standard
    statement: >
      Let $p$ be "$m$ is a multiple of $4$" and $q$ be "$m$ is a multiple of
      $6$". For how many integers $m$ with $1 \le m \le 100$ is $p \land q$
      true?
    answer: >
      $8$. A conjunction is true only when both conjuncts are, so the question
      asks for the integers in the range that are multiples of $4$ *and*
      multiples of $6$ — which is to say multiples of their least common
      multiple, $12$, not of their product $24$. An integer divisible by $12$ is
      divisible by $4$ and by $6$, and conversely an integer divisible by both is
      divisible by $12$. The multiples of $12$ up to $100$ are
      $12, 24, 36, 48, 60, 72, 84, 96$, so there are $8$. Two slips are worth
      naming. Adding the two counts, $25$ multiples of $4$ plus $16$ multiples of
      $6$, answers the question for $\lor$ and double counts the overlap
      besides. Using $4 \cdot 6 = 24$ gives $4$, which omits $12, 36, 60, 84$ —
      the multiples of $12$ that are not multiples of $24$.
    expects: "8"
    rubric:
      - >
        Reads $\land$ as an intersection: the integers counted must satisfy both
        conjuncts, not either one.
      - >
        Uses the least common multiple $12$ rather than the product $24$, and
        can name an integer such as $36$ that the product would wrongly exclude.
    targets:
      - foundations.logic.def-conjunction
    exercises: []
    connects: []
    tags: []

  - id: logic-def-disjunction-01
    kind: work
    difficulty: demanding
    statement: >
      Let $p$ be "$m$ is a multiple of $3$" and $q$ be "$m$ is a multiple of
      $5$". For how many integers $m$ with $1 \le m \le 90$ is $p \lor q$ true?
    answer: >
      $42$. The disjunction is true when at least one disjunct is, and
      "at least one" includes "both" — that is the inclusive reading, and it is
      what makes the count an inclusion–exclusion rather than a sum. There are
      $90/3 = 30$ multiples of $3$ and $90/5 = 18$ multiples of $5$ in the
      range. Adding those gives $48$, but every multiple of $15$ has been
      counted in both lists, and there are $90/15 = 6$ of them, so the honest
      total is $30 + 18 - 6 = 42$. The overlap is exactly the case an exclusive
      "or" would throw away: reading the sentence as "one but not both" would
      give $42 - 6 = 36$ and would declare $15$, $30$, $45$, $60$, $75$, $90$ to
      fail a sentence they plainly satisfy. Answering $48$ makes the opposite
      error, counting those six twice.
    expects: "42"
    rubric:
      - >
        Counts the multiples of $15$ once, not twice and not zero times — the
        overlap is included by an inclusive "or" and subtracted only to correct
        the double count.
      - >
        States that $m = 30$ satisfies $p \lor q$, so the exclusive reading is
        not in play.
    targets:
      - foundations.logic.def-disjunction
    exercises: []
    connects: []
    tags: []

  - id: logic-def-disjunction-02
    kind: decide
    difficulty: standard
    statement: >
      For which real numbers $x$ is the sentence "$x \ge 1$ or $x \le 3$"
      false?
    answer: >
      For no real number at all. A disjunction is false in exactly one of the
      four combinations, the one where both disjuncts fail, so the sentence is
      false only at an $x$ with $x < 1$ and $x > 3$ simultaneously — and no real
      number is both. Every real number satisfies at least one half: anything
      below $1$ satisfies $x \le 3$, anything above $3$ satisfies $x \ge 1$, and
      everything in between satisfies both. That last remark is where the
      exclusive reading of "or" goes wrong. Under "one but not both" the
      sentence would be false throughout the interval $1 \le x \le 3$, which is
      precisely the region where it is most obviously true. Mathematical "or" is
      inclusive by default, so overlap is permitted and never counted against
      the statement.
    choices:
      - text: >
          For no real number — the sentence is true everywhere
        correct: true
        feedback: >
          Falsity needs both halves to fail, so it needs $x < 1$ and $x > 3$ at
          once, and no number manages that.
      - text: >
          Exactly for the $x$ with $1 \le x \le 3$
        feedback: >
          That is the exclusive reading: those are the $x$ satisfying *both*
          halves, and an inclusive "or" counts both as success.
      - text: >
          Exactly for the $x$ with $x < 1$ or $x > 3$
        feedback: >
          Each of those numbers still satisfies one of the two halves — $x = 0$
          satisfies $x \le 3$ — and one half is all a disjunction asks.
      - text: >
          For every real number, since the two halves contradict each other
        feedback: >
          They do not contradict: the halves overlap on $1 \le x \le 3$, and in
          any case a disjunction does not require its halves to be exclusive.
    rubric:
      - >
        Answers "no real number", and justifies it by the single false
        combination: both disjuncts would have to fail.
      - >
        Does not treat the overlap $1 \le x \le 3$ as a failure — the default
        "or" is inclusive.
    targets:
      - foundations.logic.def-disjunction
    exercises: []
    connects: []
    tags: []

  # --- truth tables and the classification of a column ------------------------

  - id: logic-truth-table-01
    kind: work
    difficulty: demanding
    statement: >
      In how many of the eight truth assignments to $p, q, r$ is
      $(p \lor \neg q) \land (q \lor r)$ true?
    answer: >
      $4$. Build the subformula columns rather than guessing at the whole. The
      statement is a conjunction, so it is true exactly in the rows where both
      brackets are true. The first bracket $p \lor \neg q$ fails only when $p$ is
      false and $q$ is true, which kills the two rows $\mathrm{FTT}$ and
      $\mathrm{FTF}$. The second bracket $q \lor r$ fails only when $q$ and $r$
      are both false, which kills $\mathrm{TFF}$ and $\mathrm{FFF}$. The
      remaining four rows are $\mathrm{TTT}$, $\mathrm{TTF}$, $\mathrm{TFT}$ and
      $\mathrm{FFT}$, and in each of them both brackets are true, so the
      conjunction is true: $4$ rows out of $8$. Note that killing rows bracket by
      bracket is legitimate precisely because the outer connective is $\land$ —
      the same shortcut applied to a disjunction would count the rows that
      survive nothing at all.
    expects: "4"
    rubric:
      - >
        Computes the two bracket columns separately before combining them, using
        the defining condition of each outermost connective.
      - >
        Finds the failing rows of each bracket — $p \lor \neg q$ fails only at
        $p$ false with $q$ true, $q \lor r$ only at $q$ and $r$ both false — and
        removes both sets.
    targets:
      - foundations.logic.truth-table
    exercises:
      - foundations.logic.def-negation
      - foundations.logic.def-conjunction
      - foundations.logic.def-disjunction
    connects: []
    tags: []

  - id: logic-truth-table-02
    kind: decide
    difficulty: standard
    statement: >
      Under the precedence order $\neg$ tightest, then $\land$, then $\lor$,
      which reading does the unparenthesised $\neg p \lor q \land r$ have?
    answer: >
      $(\neg p) \lor (q \land r)$. Precedence says which subformula is built
      when, and the tightest binder grabs its argument first: $\neg$ takes only
      the letter beside it, giving $\neg p$, never the whole rest of the line.
      Next tightest is $\land$, which joins $q$ and $r$ into $q \land r$. What is
      left is a disjunction of those two pieces, so $\lor$ is the outermost
      connective and the statement is $(\neg p) \lor (q \land r)$. The readings
      genuinely differ, which is why the order is not a matter of taste. Take $p$
      true, $q$ true, $r$ false: the correct reading gives
      $\mathrm{F} \lor \mathrm{F} = \mathrm{F}$, while $((\neg p) \lor q) \land
      r$ gives $\mathrm{T} \land \mathrm{F} = \mathrm{F}$ as well but disagrees
      at $p$ false, $q$ false, $r$ false, where the correct reading is
      $\mathrm{T}$ and that one is $\mathrm{F}$.
    choices:
      - text: >
          $(\neg p) \lor (q \land r)$
        correct: true
        feedback: >
          $\neg$ takes only $p$, $\land$ binds $q$ with $r$, and the loosest
          connective $\lor$ ends up outermost.
      - text: >
          $\neg (p \lor (q \land r))$
        feedback: >
          This gives $\neg$ the loosest grip, the reverse of its actual
          precedence. Negating the whole line requires parentheses that are not
          written.
      - text: >
          $((\neg p) \lor q) \land r$
        feedback: >
          This lets $\lor$ bind before $\land$. It disagrees with the correct
          reading at $p$ false, $q$ false, $r$ false.
      - text: >
          $(\neg (p \lor q)) \land r$
        feedback: >
          Two errors at once: $\neg$ is given the disjunction to swallow, and
          $\land$ is left outermost.
    rubric:
      - >
        Applies the order $\neg$, then $\land$, then $\lor$, so the loosest
        connective is the outermost one.
      - >
        Confirms the readings differ by exhibiting an assignment where two of
        them disagree.
    targets:
      - foundations.logic.truth-table
    exercises:
      - foundations.logic.def-negation
      - foundations.logic.def-conjunction
      - foundations.logic.def-disjunction
    connects: []
    tags: []

  - id: logic-def-conditional-01
    kind: decide
    difficulty: demanding
    statement: >
      A booking office states: "Paying the deposit is necessary for the booking
      to be confirmed." Writing $d$ for "the deposit was paid" and $c$ for "the
      booking is confirmed", which conditional does that sentence assert?
    answer: >
      $c \to d$: if the booking is confirmed then the deposit was paid. "Necessary
      for" points the arrow away from the necessary condition, not toward it. The
      reason is the single forbidden combination: to say $d$ is necessary for $c$
      is to say that $c$ without $d$ cannot occur, and the conditional whose one
      false row is "$c$ true, $d$ false" is $c \to d$. Equivalently, "$c$ only if
      $d$" is $c \to d$, and "necessary" and "only if" are the same English
      device. What the office has *not* said is that paying the deposit
      guarantees confirmation; $d \to c$ is the sufficiency claim, and an office
      may take a deposit and still refuse the booking for other reasons. Nor has
      it asserted the biconditional, which would be both claims at once. Note
      that the contrapositive of the correct answer, "if the deposit was not paid
      then the booking is not confirmed", says the same thing, whereas the
      contrapositive of the converse does not.
    choices:
      - text: >
          If the booking is confirmed then the deposit was paid
        correct: true
        feedback: >
          Necessity rules out confirmation without payment, and that is the one
          combination $c \to d$ forbids.
      - text: >
          If the deposit was paid then the booking is confirmed
        feedback: >
          This reads "necessary" as "sufficient". It promises confirmation to
          everyone who pays, which the office never undertook.
      - text: >
          If the booking is not confirmed then the deposit was not paid
        feedback: >
          This is the contrapositive of the previous choice, so it is the
          sufficiency claim in disguise — it wrongly forbids paying without
          being confirmed.
      - text: >
          The booking is confirmed if and only if the deposit was paid
        feedback: >
          Two claims where one was made. The office gave a necessary condition
          only, and said nothing about what payment guarantees.
    rubric:
      - >
        Identifies the forbidden combination — booking confirmed with no deposit
        paid — and reads the arrow off it.
      - >
        Does not add the converse: necessity is one direction, and sufficiency
        would have to be stated separately.
    targets:
      - foundations.logic.def-conditional
    exercises: []
    connects: []
    tags: []

  - id: logic-def-conditional-02
    kind: work
    difficulty: standard
    statement: >
      Suppose $p$ is false, $q$ is true and $r$ is false. Of the four
      conditionals $p \to q$, $q \to p$, $q \to r$ and $r \to p$, how many are
      true?
    answer: >
      $2$. A conditional is false in exactly one situation — true hypothesis with
      false conclusion — so check each one against that single pattern. For
      $p \to q$ the hypothesis $p$ is false, so the forbidden combination cannot
      arise and the conditional is true. For $q \to p$ the hypothesis $q$ is true
      and the conclusion $p$ is false: that is the forbidden combination, so it
      is false. For $q \to r$ the hypothesis is true and the conclusion $r$ is
      false, so it too is false. For $r \to p$ both halves are false, and a false
      hypothesis makes the conditional true regardless of the conclusion. So
      $p \to q$ and $r \to p$ are true and the other two false: $2$ of the four.
      Answering $1$ usually comes from refusing $r \to p$, whose two false halves
      look like they should give a false verdict; answering $3$ comes from
      treating $q \to p$ and $p \to q$ as interchangeable.
    expects: "2"
    rubric:
      - >
        Checks the hypothesis first in each case: a false hypothesis settles the
        conditional as true without looking further.
      - >
        Counts $r \to p$, with both halves false, as true.
    targets:
      - foundations.logic.def-conditional
    exercises: []
    connects: []
    tags: []

  - id: logic-def-conditional-03
    kind: decide
    difficulty: routine
    statement: >
      What is the truth value of "if $15$ is even then $15$ is a multiple of
      $4$"?
    answer: >
      True. Work the hypothesis first. "$15$ is even" is false, since
      $15 = 2 \cdot 7 + 1$, and a conditional is false only in the single
      combination where the hypothesis is true and the conclusion is false. With
      the hypothesis false that combination cannot occur, so the conditional is
      true — and it is true whatever the conclusion happens to be. Here the
      conclusion is false as well, since $15$ is not a multiple of $4$, and that
      changes nothing: two false halves give the vacuous case, which is one of
      the three true rows. The material conditional claims no connection between
      its halves, only that the forbidden combination does not occur, and here it
      demonstrably does not, because the hypothesis never holds.
    choices:
      - text: >
          True: the hypothesis fails, so the forbidden combination cannot occur
        correct: true
        feedback: >
          $15$ is odd, so the promise is never called in and cannot be broken.
      - text: >
          False, since both halves are false
        feedback: >
          Two false halves are the vacuous case, which is true. Only a *true*
          hypothesis with a false conclusion makes a conditional false.
      - text: >
          False, since the conclusion is false
        feedback: >
          A false conclusion sinks a conditional only when the hypothesis holds,
          and here it does not.
      - text: >
          Neither, since a conditional joining two false statements makes no
          claim
        feedback: >
          It is a proposition and takes one of the two values. It claims exactly
          that the forbidden combination does not occur, which is true here.
    rubric:
      - >
        Evaluates the hypothesis first and stops there once it is false.
      - >
        Does not read the false conclusion as decisive: it is decisive only
        alongside a true hypothesis.
    targets:
      - foundations.logic.def-conditional
    exercises: []
    connects: []
    tags: []

  - id: logic-def-biconditional-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $(p \leftrightarrow q) \leftrightarrow r$ and
      $p \leftrightarrow (q \leftrightarrow r)$ are logically equivalent, and
      describe in one sentence the rows in which both are true.
    answer: >
      Both statements are true in exactly the rows where an odd number of
      $p, q, r$ are true. Take the left one first. $p \leftrightarrow q$ is true
      when $p$ and $q$ agree, which is when the number of true entries among
      $p, q$ is even, namely $0$ or $2$; so $p \leftrightarrow q$ is true exactly
      when $p, q$ contribute an even count. The outer biconditional with $r$ is
      then true when that value and $r$ agree, which happens either when
      $p, q$ contribute an even count and $r$ is true — total count $1$ or $3$,
      odd — or when $p, q$ contribute an odd count and $r$ is false — total count
      $1$, odd. Either way the total number of true letters is odd. Running the
      same argument on $p \leftrightarrow (q \leftrightarrow r)$ groups the pair
      $q, r$ instead, and the description that comes out is the same: true
      exactly when the total count of true letters among $p, q, r$ is odd. Two
      statements with the same description have the same column in all eight
      rows, so they are equivalent. Checking the eight rows directly confirms it:
      $\mathrm{TTT}$ true, $\mathrm{TTF}$ false, $\mathrm{TFT}$ false,
      $\mathrm{TFF}$ true, $\mathrm{FTT}$ false, $\mathrm{FTF}$ true,
      $\mathrm{FFT}$ true, $\mathrm{FFF}$ false — the same four true rows on both
      sides. So the biconditional is associative, and the unparenthesised
      $p \leftrightarrow q \leftrightarrow r$ is unambiguous in truth value even
      though nothing in the precedence rules says so.
    rubric:
      - >
        Establishes agreement in all eight rows, either by tabulating both
        columns or by the parity argument.
      - >
        States the criterion correctly: true exactly when an odd number of the
        three letters are true, so $\mathrm{TTT}$ is true and $\mathrm{TTF}$ is
        false.
      - >
        Does not assume associativity from the notation — the claim is what is
        being proved.
    targets:
      - foundations.logic.def-biconditional
    exercises: []
    connects: []
    tags: []

  - id: logic-def-biconditional-02
    kind: work
    difficulty: standard
    statement: >
      In how many of the eight truth assignments to $p, q, r$ is
      $(p \leftrightarrow q) \land r$ true?
    answer: >
      $2$. The statement is a conjunction, so both halves must hold. The second
      half forces $r$ true, cutting the eight rows to four. The first half,
      $p \leftrightarrow q$, is true when $p$ and $q$ carry the same truth value,
      which of the four combinations of $p$ and $q$ happens in two: both true and
      both false. Combining, the surviving rows are $\mathrm{TTT}$ and
      $\mathrm{FFT}$, so the count is $2$. Two wrong answers are worth naming.
      Answering $4$ treats $p \leftrightarrow q$ as though it were satisfied
      whenever the letters take any values at all, forgetting that it fails in
      the two mixed rows. Answering $1$ reads the biconditional as though it
      demanded both letters be *true* rather than merely equal — but $p$ and $q$
      both false is agreement, and agreement is what the connective asks for.
    expects: "2"
    rubric:
      - >
        Uses $r$ to halve the table before evaluating the biconditional.
      - >
        Counts both agreement rows for $p \leftrightarrow q$, the all-true one
        and the all-false one.
    targets:
      - foundations.logic.def-biconditional
    exercises: []
    connects: []
    tags: []

  - id: logic-tautology-contradiction-01
    kind: work
    difficulty: demanding
    statement: >
      How many satisfying assignments does
      $(p \lor q) \land (\neg p \lor r) \land (\neg q \lor \neg r)$ have, among
      the eight assignments to $p, q, r$?
    answer: >
      $2$. A satisfying assignment is a row making the statement true, and since
      the statement is a conjunction of three brackets, a row must satisfy all
      three. Walk the eight rows. $\mathrm{TTT}$: the third bracket is
      $\mathrm{F} \lor \mathrm{F} = \mathrm{F}$, so it fails. $\mathrm{TTF}$: the
      second bracket is $\mathrm{F} \lor \mathrm{F} = \mathrm{F}$, fails.
      $\mathrm{TFT}$: brackets are $\mathrm{T}$, $\mathrm{T}$, $\mathrm{T}$ —
      satisfying. $\mathrm{TFF}$: the second bracket fails. $\mathrm{FTT}$: the
      third bracket fails. $\mathrm{FTF}$: brackets are $\mathrm{T}$,
      $\mathrm{T}$, $\mathrm{T}$ — satisfying. $\mathrm{FFT}$ and $\mathrm{FFF}$:
      the first bracket is $\mathrm{F} \lor \mathrm{F} = \mathrm{F}$, so both
      fail. That leaves the two rows $\mathrm{TFT}$ and $\mathrm{FTF}$, so the
      statement is satisfiable with $2$ satisfying assignments; having some false
      rows it is not a tautology, and having some true rows it is not a
      contradiction, so it is a contingency. Answering $0$ — declaring it a
      contradiction — is the error that follows from checking a few rows and
      generalising before the table is finished.
    expects: "2"
    rubric:
      - >
        Requires a satisfying assignment to make every bracket true, not merely
        one of them.
      - >
        Names both surviving rows, $p$ true with $q$, $r$ false and $q$ true
        with $p$, $r$ false, rather than stopping at the first.
      - >
        Concludes the statement is a satisfiable contingency: some rows true,
        some false.
    targets:
      - foundations.logic.tautology-contradiction
    exercises:
      - foundations.logic.truth-table
    connects: []
    tags: []

  - id: logic-tautology-contradiction-02
    kind: decide
    difficulty: standard
    statement: >
      Classify $(p \land \neg q) \lor (\neg p \lor q)$ as a tautology, a
      contradiction, or a contingency.
    answer: >
      It is a tautology. The quickest route is to notice the shape: the second
      disjunct $\neg p \lor q$ is false in exactly one row, the row with $p$ true
      and $q$ false, and the first disjunct $p \land \neg q$ is true in exactly
      that same row. So the two disjuncts between them cover every row, and a
      disjunction needs only one true part. Row by row: at $p$ true, $q$ true the
      second disjunct is $\mathrm{F} \lor \mathrm{T} = \mathrm{T}$; at $p$ true,
      $q$ false the first disjunct is $\mathrm{T} \land \mathrm{T} = \mathrm{T}$;
      at $p$ false, $q$ true and at $p$ false, $q$ false the second disjunct is
      carried by $\neg p$. All four rows true, so the column is uniformly
      $\mathrm{T}$ and the statement is a tautology — which also makes it
      satisfiable, since every tautology is, though satisfiability is the weaker
      report.
    choices:
      - text: >
          A tautology
        correct: true
        feedback: >
          The two disjuncts cover complementary sets of rows — the second fails
          only where the first succeeds — so no row is left false.
      - text: >
          A contradiction
        feedback: >
          A contradiction has no true row; here $p$ false, $q$ false already
          gives $\mathrm{T}$ through $\neg p$.
      - text: >
          A contingency, false only when $p$ is true and $q$ is false
        feedback: >
          That is the row where the *second* disjunct fails, but the first
          disjunct is true exactly there, so the disjunction survives it.
      - text: >
          Satisfiable but not a tautology, since it fails when $p$ and $q$ are
          both false
        feedback: >
          At $p$ false, $q$ false the disjunct $\neg p \lor q$ is
          $\mathrm{T} \lor \mathrm{F} = \mathrm{T}$, so that row is true too.
    rubric:
      - >
        Checks all four rows, or argues that the two disjuncts fail in
        complementary rows.
      - >
        Reports the strongest true classification: tautology, not merely
        satisfiable.
    targets:
      - foundations.logic.tautology-contradiction
    exercises:
      - foundations.logic.truth-table
    connects: []
    tags: []

  - id: logic-logical-equivalence-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $(p \to q) \land (\neg p \to r)$ and
      $(p \land q) \lor (\neg p \land r)$ are logically equivalent.
    answer: >
      Split on the value of $p$; this reduces eight rows to two cases and each
      case is a line. Suppose $p$ is true. Then $p \to q$ takes the value of $q$,
      since a conditional with a true hypothesis is true exactly when its
      conclusion is; and $\neg p \to r$ has a false hypothesis, so it is true
      whatever $r$ says. The left-hand statement is therefore
      $q \land \mathrm{T}$, which is $q$. On the right, $p \land q$ is $q$ and
      $\neg p \land r$ is $\mathrm{F} \land r = \mathrm{F}$, so the disjunction is
      $q \lor \mathrm{F} = q$. Both sides equal $q$. Now suppose $p$ is false.
      Then $p \to q$ is vacuously true and $\neg p \to r$ has a true hypothesis,
      so it takes the value of $r$; the left-hand statement is
      $\mathrm{T} \land r = r$. On the right, $p \land q$ is false and
      $\neg p \land r$ is $r$, so the disjunction is $r$. Both sides equal $r$.
      The two cases exhaust the assignments, and in each the two columns agree,
      so the statements agree in all eight rows and are logically equivalent.
      Since equivalence is a congruence, either expression may now be substituted
      for the other inside any larger statement without changing its value.
    rubric:
      - >
        Splits on $p$ and treats both cases, rather than checking a sample of
        rows.
      - >
        Uses the vacuous case correctly: with $p$ true the conditional
        $\neg p \to r$ is true regardless of $r$, and with $p$ false $p \to q$ is
        true regardless of $q$.
      - >
        Concludes agreement in *every* row — equivalence is a claim about the
        whole column, not about the rows checked.
    targets:
      - foundations.logic.logical-equivalence
    exercises: []
    connects: []
    tags: []

  - id: logic-logical-equivalence-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of these four pairs is *not* a logical equivalence. Which
      pair?
    answer: >
      $\neg(p \lor q)$ and $\neg p \lor \neg q$ are not equivalent. Take $p$ true
      and $q$ false: the left side is $\neg \mathrm{T} = \mathrm{F}$ while the
      right side is $\mathrm{F} \lor \mathrm{T} = \mathrm{T}$, so the columns
      differ in that row, and one differing row is enough to destroy an
      equivalence. The other three pairs agree in every row. $p \land (p \lor q)$
      and $p$: if $p$ is false both are false, and if $p$ is true then
      $p \lor q$ is true and the conjunction is true. $\neg(p \land \neg q)$ and
      $\neg p \lor q$: the left side is false only when $p$ is true and $q$ is
      false, and so is the right side. $(p \lor q) \land \neg q$ and
      $p \land \neg q$: both require $q$ false, and with $q$ false the first
      reduces to $p \land \mathrm{T}$. Equivalence is a claim about the whole
      column, so verifying it means checking all rows, while refuting it costs a
      single row — the same asymmetry that governs any universal claim.
    choices:
      - text: >
          $p \land (p \lor q)$ and $p$
        feedback: >
          Absorption. When $p$ is true the bracket is true as well, and when $p$
          is false the conjunction fails — the columns match.
      - text: >
          $\neg(p \land \neg q)$ and $\neg p \lor q$
        feedback: >
          Both are false in exactly one row, $p$ true with $q$ false, so their
          columns are identical.
      - text: >
          $\neg(p \lor q)$ and $\neg p \lor \neg q$
        correct: true
        feedback: >
          At $p$ true, $q$ false the left side is $\mathrm{F}$ and the right is
          $\mathrm{T}$. Negating a disjunction must flip the connective, not
          keep it.
      - text: >
          $(p \lor q) \land \neg q$ and $p \land \neg q$
        feedback: >
          The second conjunct forces $q$ false in both, and then $p \lor q$
          reduces to $p$ — same column.
    rubric:
      - >
        Refutes the failing pair with one explicit assignment rather than an
        appeal to shape.
      - >
        Checks the other three pairs across all four rows before calling them
        equivalences.
    targets:
      - foundations.logic.logical-equivalence
    exercises: []
    connects: []
    tags: []

  - id: logic-double-negation-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove $\neg(\neg p) \equiv p$ from the definition of negation, and then
      deduce $\neg\neg\neg\neg\neg p \equiv \neg p$ from that law alone —
      without building a new truth table.
    answer: >
      For the law itself there are two rows, since only one letter occurs. If $p$
      is $\mathrm{T}$ then $\neg p$ is $\mathrm{F}$ by the defining condition of
      negation, and $\neg(\neg p)$ is the negation of $\mathrm{F}$, which is
      $\mathrm{T}$ — matching $p$. If $p$ is $\mathrm{F}$ then $\neg p$ is
      $\mathrm{T}$ and $\neg(\neg p)$ is $\mathrm{F}$ — matching again. The two
      columns agree in both rows, so $\neg(\neg p) \equiv p$. For the deduction,
      use the property that makes equivalence a calculus: equivalence is a
      congruence, so replacing a subformula by an equivalent one leaves the value
      of the whole unchanged in every row. The expression
      $\neg\neg\neg\neg\neg p$ contains $\neg\neg(\neg\neg\neg p)$ as its outer
      two negations applied to the rest; applying the law with $\neg\neg\neg p$
      in the role of $p$ replaces $\neg\neg(\neg\neg\neg p)$ by
      $\neg\neg\neg p$. Applying it once more, now with $\neg p$ in that role,
      replaces $\neg\neg(\neg p)$ by $\neg p$. Two substitutions, five negations
      reduced by four, and $\neg\neg\neg\neg\neg p \equiv \neg p$. The general
      rule is parity: an even number of negations leaves $p$, an odd number
      leaves $\neg p$, and $5$ is odd, so one negation survives.
    rubric:
      - >
        Argues the base law by both rows of the one-letter table, not by appeal
        to "two flips cancel" alone.
      - >
        Justifies the deduction by substitution of an equivalent subformula,
        naming the congruence property, and applies the law with a compound
        statement in the role of $p$.
      - >
        Ends at $\neg p$, not $p$: five is odd, so one negation is left over.
    targets:
      - foundations.logic.double-negation
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  - id: logic-double-negation-02
    kind: work
    difficulty: routine
    statement: >
      A statement is written as $101$ negation symbols in front of the letter
      $p$. After cancelling negations in pairs, how many negation symbols
      remain?
    answer: >
      $1$. Each application of $\neg(\neg P) \equiv P$ removes two negation
      symbols and nothing else, so the number remaining is whatever $101$ leaves
      after repeated subtraction of $2$ — that is, the remainder of $101$ on
      division by $2$, which is $1$. Fifty pairs cancel, using $100$ symbols, and
      a single negation is left standing, so the statement is equivalent to
      $\neg p$ and not to $p$. The rule to carry away is parity: an even count of
      negations returns the original letter and an odd count returns its
      negation, so only the remainder matters and the size of the stack does not.
      Answering $0$ is the arithmetic slip of assuming the stack empties, which
      happens only for an even count.
    expects: "1"
    rubric:
      - >
        Cancels in pairs and reads off the parity of $101$ rather than assuming
        the stack empties.
      - >
        Concludes the statement is equivalent to $\neg p$.
    targets:
      - foundations.logic.double-negation
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  # --- the rewriting laws -----------------------------------------------------

  - id: logic-de-morgan-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove, by induction on $n$, that for every $n \ge 2$ and all propositions
      $p_1, \dots, p_n$,
      $\neg(p_1 \land p_2 \land \cdots \land p_n) \equiv \neg p_1 \lor \neg p_2
      \lor \cdots \lor \neg p_n$.
    answer: >
      Base case $n = 2$. This is the two-term law
      $\neg(p_1 \land p_2) \equiv \neg p_1 \lor \neg p_2$, and four rows settle
      it. With $p_1, p_2$ both true the left side is $\neg \mathrm{T} =
      \mathrm{F}$ and the right side is $\mathrm{F} \lor \mathrm{F} = \mathrm{F}$.
      With $p_1$ true and $p_2$ false the conjunction is false, so the left side
      is $\mathrm{T}$, and the right side is $\mathrm{F} \lor \mathrm{T} =
      \mathrm{T}$. The row with $p_1$ false and $p_2$ true is the mirror image,
      and with both false the left side is $\mathrm{T}$ and the right side is
      $\mathrm{T} \lor \mathrm{T} = \mathrm{T}$. Columns identical.

      Inductive step. Suppose the law holds for some $n \ge 2$, and consider
      $n + 1$ propositions. Regroup the conjunction as
      $(p_1 \land \cdots \land p_n) \land p_{n+1}$, which is legitimate because
      $\land$ is associative. Applying the two-term law with
      $p_1 \land \cdots \land p_n$ in the role of the first argument gives
      $\neg(p_1 \land \cdots \land p_{n+1}) \equiv \neg(p_1 \land \cdots \land
      p_n) \lor \neg p_{n+1}$. By the induction hypothesis the first disjunct is
      equivalent to $\neg p_1 \lor \cdots \lor \neg p_n$, and since equivalence
      is a congruence that subformula may be substituted inside the disjunction
      without changing any row. The result is
      $\neg p_1 \lor \cdots \lor \neg p_n \lor \neg p_{n+1}$, which is the claim
      for $n + 1$. By induction the law holds for every $n \ge 2$.

      The dual law follows by the same argument with $\land$ and $\lor$
      exchanged, or from this one by negating both sides and cancelling double
      negations. In words the content is unchanged by the generalisation: a
      conjunction of any finite length fails as soon as one conjunct fails.
    rubric:
      - >
        States and proves the two-term base case by its four rows rather than
        assuming it.
      - >
        In the step, regroups $n + 1$ conjuncts as a two-term conjunction and
        applies the base law with a *compound* statement in the role of one
        argument.
      - >
        Invokes the induction hypothesis by substituting an equivalent
        subformula, and says why that substitution is legitimate.
    targets:
      - foundations.logic.de-morgan
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  - id: logic-de-morgan-02
    kind: decide
    difficulty: standard
    statement: >
      Pushing the negation all the way inward, $\neg((p \land \neg q) \lor r)$
      is equivalent to which statement?
    answer: >
      $(\neg p \lor q) \land \neg r$. Work outside in. The outermost connective
      inside the negation is $\lor$, so the second De Morgan law applies:
      $\neg((p \land \neg q) \lor r) \equiv \neg(p \land \neg q) \land \neg r$,
      with the connective flipped from $\lor$ to $\land$ and a negation handed to
      each part. The first part now has a negation sitting on a conjunction, so
      the first law applies to it: $\neg(p \land \neg q) \equiv \neg p \lor
      \neg\neg q$, and the double negation on $q$ cancels, giving
      $\neg p \lor q$. Substituting back, the whole statement is
      $(\neg p \lor q) \land \neg r$ — every negation now sits on a letter. Read
      in words: either $p$ fails or $q$ holds, and $r$ fails. Each of the wrong
      answers omits exactly one of the three moves: flipping the outer
      connective, flipping the inner one, or cancelling the double negation.
    choices:
      - text: >
          $(\neg p \lor q) \land \neg r$
        correct: true
        feedback: >
          Outer $\lor$ becomes $\land$, inner $\land$ becomes $\lor$, and
          $\neg\neg q$ cancels to $q$.
      - text: >
          $(\neg p \land q) \lor \neg r$
        feedback: >
          Both connectives kept their original places instead of swapping. This
          is true when $r$ is false and $p$ is true, where the original is false.
      - text: >
          $(\neg p \lor \neg q) \land \neg r$
        feedback: >
          The outer flip is right, but the negation landing on $\neg q$ was
          stacked rather than cancelled — $\neg\neg q$ is $q$.
      - text: >
          $(\neg p \lor q) \lor \neg r$
        feedback: >
          The inner work is right and the outer connective was left as $\lor$.
          Negating a disjunction must produce a conjunction.
    rubric:
      - >
        Applies the law to the outermost connective first, then to the inner
        one, rather than negating every letter in place.
      - >
        Cancels the double negation that lands on $q$.
    targets:
      - foundations.logic.de-morgan
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  - id: logic-de-morgan-03
    kind: decide
    difficulty: routine
    statement: >
      What is the negation of "the applicant holds a degree or has three years
      of experience"?
    answer: >
      "The applicant does not hold a degree and does not have three years of
      experience." The original is a disjunction, and a disjunction is false in
      exactly one of its four combinations — the one where both disjuncts fail.
      So its denial asserts both failures at once, which is the second De Morgan
      law, $\neg(p \lor q) \equiv \neg p \land \neg q$: to deny an "or", deny
      every part. The connective flips from "or" to "and" as the negation moves
      inward, and that flip is the whole content of the law. Keeping the "or" and
      negating both parts gives a much weaker sentence, true of an applicant with
      a degree but no experience — someone who plainly satisfies the original and
      so cannot satisfy its denial. Negating only one part is weaker still, and
      leaves the other half of the disjunction free to make the original true.
    choices:
      - text: >
          The applicant does not hold a degree and does not have three years of
          experience
        correct: true
        feedback: >
          Both parts denied, joined by "and" — exactly the one combination in
          which a disjunction is false.
      - text: >
          The applicant does not hold a degree or does not have three years of
          experience
        feedback: >
          The connective was not flipped. An applicant with a degree and no
          experience satisfies this *and* the original, so it is not a denial.
      - text: >
          The applicant holds a degree but does not have three years of
          experience
        feedback: >
          Only the second part was denied, and the first was asserted. Such an
          applicant makes the original disjunction true.
      - text: >
          The applicant has three years of experience but holds no degree
        feedback: >
          Same fault on the other side: this satisfies the original through its
          second disjunct.
    rubric:
      - >
        Flips the connective from "or" to "and" while pushing the negation in.
      - >
        Denies every part, since a disjunction fails only when all of its parts
        fail.
    targets:
      - foundations.logic.de-morgan
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  - id: logic-distributive-laws-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that
      $(p \land q) \lor (\neg p \land r) \lor (q \land r) \equiv
      (p \land q) \lor (\neg p \land r)$ — so the third disjunct on the left may
      always be dropped.
    answer: >
      Split on $p$; two cases replace eight rows. Suppose $p$ is true. Then
      $p \land q$ takes the value of $q$ and $\neg p \land r$ is false, since its
      first conjunct fails. The left side becomes $q \lor \mathrm{F} \lor
      (q \land r)$, which is $q \lor (q \land r)$, and absorption
      $q \lor (q \land r) \equiv q$ collapses it to $q$. The right side becomes
      $q \lor \mathrm{F} = q$. Both sides equal $q$. Now suppose $p$ is false.
      Then $p \land q$ is false and $\neg p \land r$ takes the value of $r$. The
      left side is $\mathrm{F} \lor r \lor (q \land r)$, which is
      $r \lor (q \land r)$, and absorption collapses it to $r$. The right side is
      $\mathrm{F} \lor r = r$. Both sides equal $r$. The two cases cover every
      assignment, and in each the two expressions agree, so they agree in all
      eight rows and are equivalent.

      The content is worth naming: the dropped disjunct $q \land r$ is redundant
      because whenever it holds, one of the two kept disjuncts holds as well. If
      $q$ and $r$ are both true then either $p$ is true, making $p \land q$ true,
      or $p$ is false, making $\neg p \land r$ true — there is no third
      possibility, by bivalence. Note that the collapse used absorption in both
      cases; carrying out the same argument by expanding with distribution
      instead produces the same result with more terms to cancel.
    rubric:
      - >
        Splits on $p$ and disposes of both cases, rather than checking a
        selection of the eight rows.
      - >
        Uses absorption $q \lor (q \land r) \equiv q$ (or an equivalent
        simplification) and names it.
      - >
        Explains the redundancy: whenever $q \land r$ holds, bivalence forces
        one of the two remaining disjuncts to hold too.
    targets:
      - foundations.logic.distributive-laws
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  - id: logic-distributive-laws-02
    kind: decide
    difficulty: standard
    statement: >
      Which statement is $(p \land q) \lor r$ equivalent to?
    answer: >
      $(p \lor r) \land (q \lor r)$. This is the distribution of $\lor$ over
      $\land$, read with $r$ as the outside term: $r \lor (p \land q) \equiv
      (r \lor p) \land (r \lor q)$, and commutativity of $\lor$ puts $r$ on the
      right of each bracket. It is the law with no arithmetic analogue —
      addition does not distribute over multiplication — so it must be checked
      rather than assumed. Split on $r$: if $r$ is true, the left side is true
      and both brackets on the right are true, so the right side is true; if $r$
      is false, the left side reduces to $p \land q$ and the right side reduces
      to $p \land q$ as well. Both cases match, so all eight rows do. The
      characteristic error is copying the outside term onto only one of the two
      terms inside, which produces $(p \lor r) \land q$ — true when $r$ and $q$
      hold and $p$ fails, where the original is true as well, but false when $r$
      holds and $q$ fails, where the original is true.
    choices:
      - text: >
          $(p \lor r) \land (q \lor r)$
        correct: true
        feedback: >
          $r$ is copied onto both terms inside the conjunction, and the inner
          connective $\land$ is kept between the copies.
      - text: >
          $(p \lor r) \land q$
        feedback: >
          The outside term was copied onto only one term. At $r$ true with $q$
          false this is false while the original is true.
      - text: >
          $p \land (q \lor r)$
        feedback: >
          This regroups rather than distributes. At $p$ false with $r$ true it is
          false, while the original is true.
      - text: >
          $(p \land r) \lor (q \land r)$
        feedback: >
          This distributes $r$ with the wrong connective, using $\land$ where the
          law calls for $\lor$. At $p$, $q$ true and $r$ false it is false, while
          the original is true.
    rubric:
      - >
        Copies the outside term onto *both* terms inside, keeping the inner
        connective between the copies.
      - >
        Does not import the arithmetic analogue: this is the distribution with
        no counterpart in algebra, so it is checked, not assumed.
    targets:
      - foundations.logic.distributive-laws
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  - id: logic-conditional-as-disjunction-01
    kind: decide
    difficulty: demanding
    statement: >
      What is the negation of $p \to (q \to r)$, with every negation pushed onto
      a letter?
    answer: >
      $p \land q \land \neg r$. Apply the rule $\neg(A \to B) \equiv A \land \neg
      B$ to the outer conditional, with $A$ the letter $p$ and $B$ the compound
      $q \to r$: the negation is $p \land \neg(q \to r)$. Now the same rule
      applies to the inner conditional, giving $\neg(q \to r) \equiv q \land \neg
      r$, and substituting produces $p \land (q \land \neg r)$, which
      associativity writes as $p \land q \land \neg r$. Every negation now sits on
      a letter. The sanity check is a row count: $p \to (q \to r)$ is false in
      exactly one of the eight assignments, the row $p$ true, $q$ true, $r$
      false, and $p \land q \land \neg r$ is true in exactly that row. The moral
      is the one that matters for proof by contradiction — the denial of a
      conditional is never another conditional. It is the flat assertion that
      each hypothesis holds and the final conclusion fails, which is why a
      contradiction argument for this statement opens by assuming $p$, assuming
      $q$, and assuming $\neg r$, all three unconditionally.
    choices:
      - text: >
          $p \land q \land \neg r$
        correct: true
        feedback: >
          Both conditionals are negated by the same rule, and what survives is
          true in exactly the one row where the original is false.
      - text: >
          $\neg p \lor (q \land \neg r)$
        feedback: >
          This is the original statement rewritten, not its negation: $p \to X$
          is $\neg p \lor X$, and the inner part was negated instead of kept.
      - text: >
          $p \land (\neg q \lor r)$
        feedback: >
          The outer step is right and the inner one is not — this negates
          $\neg(q \to r)$ rather than $q \to r$, so it asserts the inner
          conditional again.
      - text: >
          $(p \land \neg q) \to r$
        feedback: >
          The answer is still a conditional, which the denial of a conditional
          never is. It is true whenever $p$ fails, where the original is true.
    rubric:
      - >
        Applies $\neg(A \to B) \equiv A \land \neg B$ with a *compound* $B$ at
        the first step, then again to the inner conditional.
      - >
        Ends with a conjunction, not a conditional, and can name the single row
        of the eight in which it is true.
    targets:
      - foundations.logic.conditional-as-disjunction
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  - id: logic-conditional-as-disjunction-02
    kind: decide
    difficulty: standard
    statement: >
      Which sentence is the negation of "if the matrix is invertible then its
      determinant is nonzero"?
    answer: >
      "The matrix is invertible and its determinant is zero." Write $p$ for "the
      matrix is invertible" and $q$ for "its determinant is nonzero". The
      original is $p \to q$, which is false in exactly one situation, and
      $\neg(p \to q) \equiv p \land \neg q$ names that situation outright: the
      hypothesis holds and the conclusion fails. Notice what changed. The
      original asserted nothing about whether the matrix is invertible; its
      denial asserts invertibility flatly, because there is only one way for a
      conditional to fail and that way requires the hypothesis. So to refute the
      claim you would have to produce one invertible matrix with determinant
      zero — a single object, not a rule. The near miss "the matrix is not
      invertible or its determinant is nonzero" is worth naming: it is
      $\neg p \lor q$, which is the *original statement* rewritten by the
      equivalence $p \to q \equiv \neg p \lor q$, so choosing it asserts exactly
      what was to be denied.
    choices:
      - text: >
          The matrix is invertible and its determinant is zero
        correct: true
        feedback: >
          Hypothesis asserted, conclusion denied — the one combination a
          conditional forbids, stated as a conjunction.
      - text: >
          The matrix is not invertible or its determinant is nonzero
        feedback: >
          This is $\neg p \lor q$, which *is* the original conditional rewritten.
          Nothing has been negated.
      - text: >
          If the matrix is invertible then its determinant is zero
        feedback: >
          Only the conclusion was negated and the arrow kept, so this is still a
          conditional — true of every non-invertible matrix, which proves
          nothing.
      - text: >
          If the matrix is not invertible then its determinant is zero
        feedback: >
          Negating both halves and keeping the arrow gives a different statement
          altogether, one about the matrices the original never spoke of.
    rubric:
      - >
        Produces a conjunction, not a conditional.
      - >
        Asserts the hypothesis outright, and says why: the original claimed
        nothing about it, and the denial must.
    targets:
      - foundations.logic.conditional-as-disjunction
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  - id: logic-contrapositive-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that for every integer $n$, if $n^3 + 5$ is odd then $n$ is even.
    answer: >
      Prove the contrapositive, which is legitimate because a conditional is
      logically equivalent to it: $p \to q \equiv \neg q \to \neg p$. Here $p$ is
      "$n^3 + 5$ is odd" and $q$ is "$n$ is even", so the contrapositive reads:
      if $n$ is not even — that is, if $n$ is odd — then $n^3 + 5$ is not odd,
      that is, $n^3 + 5$ is even. Suppose $n$ is odd, say $n = 2k + 1$ for an
      integer $k$. Then $n^3$ is a product of three odd numbers and is therefore
      odd; explicitly, $n^3 = (2k+1)^3 = 8k^3 + 12k^2 + 6k + 1 = 2(4k^3 + 6k^2 +
      3k) + 1$, which is $2m + 1$ with $m = 4k^3 + 6k^2 + 3k$ an integer. Hence
      $n^3 + 5 = 2m + 6 = 2(m + 3)$, an even integer. That establishes the
      contrapositive for every integer $n$, and by the equivalence the original
      conditional holds for every integer $n$ as well.

      The direct route is what makes the choice worth making: starting from
      "$n^3 + 5$ is odd" gives $n^3$ even, and one would then have to argue that
      an even cube forces an even root — true, but a further step. Choosing the
      easier of two equivalent directions is a standard move, not a compromise,
      and nothing about the contrapositive assumes more than the original did.
    rubric:
      - >
        States the contrapositive correctly — swapping *and* negating, so the
        hypothesis becomes "$n$ is odd" and the conclusion "$n^3 + 5$ is even" —
        rather than proving the converse or the inverse.
      - >
        Says explicitly that the contrapositive is equivalent to the original,
        so proving it finishes the proof.
      - >
        Carries out the arithmetic: writes $n = 2k + 1$ and exhibits $n^3 + 5$ as
        $2$ times an integer.
    targets:
      - foundations.logic.contrapositive
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  - id: logic-contrapositive-02
    kind: decide
    difficulty: standard
    statement: >
      Consider the conditional "if a quadrilateral is a square then it has four
      right angles". Which statement is its *inverse*?
    answer: >
      "If a quadrilateral is not a square then it does not have four right
      angles." With $p$ for "is a square" and $q$ for "has four right angles",
      the original is $p \to q$; the inverse negates both halves without swapping
      them, $\neg p \to \neg q$. The three relatives are easy to confuse, so fix
      them by what each operation does. The converse $q \to p$ swaps only: "if it
      has four right angles then it is a square". The contrapositive $\neg q \to
      \neg p$ swaps and negates: "if it does not have four right angles then it
      is not a square". The inverse negates only. Here the original is true and
      the inverse is false — a non-square rectangle has four right angles — which
      is exactly as it should be, since the inverse is equivalent to the converse
      and not to the original. The same rectangle refutes the converse, and it
      must, because converse and inverse are each other's contrapositive.
    choices:
      - text: >
          If a quadrilateral is not a square then it does not have four right
          angles
        correct: true
        feedback: >
          Both halves negated, neither swapped — that is the inverse, and a
          non-square rectangle refutes it.
      - text: >
          If a quadrilateral has four right angles then it is a square
        feedback: >
          That is the converse: swapped, not negated. It is equivalent to the
          inverse, but it is not the inverse.
      - text: >
          If a quadrilateral does not have four right angles then it is not a
          square
        feedback: >
          Swapped *and* negated, so this is the contrapositive — equivalent to
          the original, hence true.
      - text: >
          If a quadrilateral is a square then it does not have four right angles
        feedback: >
          Only the conclusion was negated. That is none of the three relatives,
          and it is simply false.
    rubric:
      - >
        Negates both halves without swapping them.
      - >
        Keeps the three relatives apart, and can say which of them is equivalent
        to the original.
    targets:
      - foundations.logic.contrapositive
    exercises:
      - foundations.logic.logical-equivalence
    connects: []
    tags: []

  # --- valid inference --------------------------------------------------------

  - id: logic-def-validity-01
    kind: work
    difficulty: demanding
    statement: >
      An argument has premises $p \lor q$, $q \to r$ and $\neg r$, and
      conclusion $p$. In how many of the eight truth assignments to $p, q, r$
      are all three premises true at once?
    answer: >
      $1$. Validity is checked by looking only at the rows where every premise
      holds, so narrow the table premise by premise. The third premise $\neg r$
      forces $r$ false, halving the eight rows to four. The second premise
      $q \to r$ with $r$ false is true only when its hypothesis fails, so $q$
      must be false, leaving two rows. The first premise $p \lor q$ with $q$
      false needs $p$ to carry the disjunction, so $p$ must be true, leaving the
      single row $p$ true, $q$ false, $r$ false. In that row the conclusion $p$
      is true, so no assignment makes every premise true and the conclusion
      false, and the argument form is valid — equivalently,
      $((p \lor q) \land (q \to r) \land \neg r) \to p$ is a tautology. Note what
      the count does *not* tell you: validity would still follow if no row made
      all the premises true, since there would then be no row to violate the
      definition, and it would fail if some surviving row had $p$ false.
    expects: "1"
    rubric:
      - >
        Narrows the table one premise at a time and identifies the surviving row
        as $p$ true, $q$ false, $r$ false.
      - >
        Concludes validity from the definition — no row with all premises true
        and the conclusion false — rather than from the conclusion being
        plausible.
    targets:
      - foundations.logic.def-validity
    exercises:
      - foundations.logic.tautology-contradiction
      - foundations.logic.def-conditional
    connects: []
    tags: []

  - id: logic-def-validity-02
    kind: decide
    difficulty: standard
    statement: >
      An argument's premises are all in fact false, and no truth assignment
      makes every premise true while the conclusion is false. What can be said
      about the argument?
    answer: >
      Its form is valid, but the argument is not sound. Validity is defined
      purely by the second condition — no assignment with all premises true and
      the conclusion false — and that condition is stated about the form, so it
      is checked by a truth table without consulting any fact. It is met here by
      hypothesis, so the argument is valid. Soundness is the stronger property:
      valid *and* premises actually true. The premises are false, so the argument
      is unsound, and an unsound argument establishes nothing about its
      conclusion, which may be true or false for reasons of its own. The division
      matters because the two halves are checked by different means. A table
      settles validity; whether a premise is true is a question about the
      mathematics or the world, and no table will answer it. Note also that
      false premises do not damage validity — an argument whose premises are
      never all true satisfies the definition trivially.
    choices:
      - text: >
          The form is valid, but the argument is not sound
        correct: true
        feedback: >
          Validity is met by the stated condition; soundness additionally
          demands true premises, which fail here.
      - text: >
          The form is invalid, since the premises are false
        feedback: >
          Falsity of the premises is irrelevant to validity, which is a property
          of the form and is checked without any facts.
      - text: >
          The argument is sound, since validity plus a conclusion is all
          soundness requires
        feedback: >
          Soundness requires validity *and* true premises. With false premises
          nothing is established.
      - text: >
          Nothing can be said until the conclusion's truth value is known
        feedback: >
          Validity never depends on the conclusion's actual truth value; the
          table covers every possibility at once.
    rubric:
      - >
        Separates validity, a property of form, from soundness, which adds the
        factual truth of the premises.
      - >
        Does not let false premises revoke validity.
    targets:
      - foundations.logic.def-validity
    exercises:
      - foundations.logic.tautology-contradiction
      - foundations.logic.def-conditional
    connects: []
    tags: []

  - id: logic-modus-ponens-01
    kind: justify
    difficulty: demanding
    statement: >
      Show that the argument form "from $p \to q$, $q \to r$ and $p$, infer $r$"
      is valid, and identify where modus ponens is applied.
    answer: >
      Check the rows where all three premises hold. The third premise $p$ forces
      $p$ true, cutting the eight assignments to four. Given $p$ true, the first
      premise $p \to q$ is a conditional with a true hypothesis, so it is true
      only when $q$ is true — that removes the two rows with $q$ false and leaves
      two. Given $q$ true, the second premise $q \to r$ is again a conditional
      with a true hypothesis, so it is true only when $r$ is true, leaving the
      single row $p$, $q$, $r$ all true. In that row the conclusion $r$ is true.
      No assignment makes all three premises true while the conclusion is false,
      so the form is valid; equivalently
      $((p \to q) \land (q \to r) \land p) \to r$ is a tautology.

      Operationally the same argument is two applications of modus ponens. The
      first takes the conditional $p \to q$ together with its hypothesis $p$ and
      delivers $q$. The second takes the conditional $q \to r$ together with the
      $q$ just obtained and delivers $r$. Nothing else is used, and no assumption
      is made and later withdrawn — each step holds a conditional and its
      hypothesis, which is exactly what the rule requires. This chaining is what
      a long proof mostly consists of: the conclusion gained from one theorem
      becomes the checked hypothesis of the next.
    rubric:
      - >
        Argues validity from the definition, by narrowing to the rows where all
        three premises hold and checking the conclusion there.
      - >
        Uses each conditional with its own hypothesis in hand — $p$ for the
        first, the derived $q$ for the second — rather than running either arrow
        backwards.
      - >
        Notes that the intermediate $q$ is obtained, not assumed.
    targets:
      - foundations.logic.modus-ponens
    exercises:
      - foundations.logic.def-validity
    connects: []
    tags: []

  - id: logic-modus-ponens-02
    kind: decide
    difficulty: standard
    statement: >
      A theorem states: every integer of the form $6k + 3$ is odd. You verify
      that $2025 = 6 \cdot 337 + 3$. What does modus ponens deliver?
    answer: >
      That $2025$ is odd. The theorem supplies the conditional "if $n$ has the
      form $6k + 3$ then $n$ is odd", and applying it to the particular integer
      $2025$ gives a conditional about that integer. Verifying $2025 = 6 \cdot
      337 + 3$ establishes its hypothesis. Holding a conditional and its
      hypothesis, the rule delivers the conclusion for that integer, and nothing
      more: $2025$ is odd. Notice how narrow the delivery is. The rule says
      nothing about integers in general, so it does not license the converse
      claim that every odd integer has the form $6k + 3$ — false, since $5$ does
      not. It does not license conclusions the theorem never mentioned, such as
      divisibility by $6$, which in fact fails here. And "nothing follows, because
      the theorem is a general statement" misreads what a general statement is
      for: a claim about all integers of a form applies to each one, and applying
      it is precisely this step.
    choices:
      - text: >
          $2025$ is odd
        correct: true
        feedback: >
          Hypothesis verified, conditional in hand, conclusion taken — for that
          one integer, which is all the rule promises.
      - text: >
          Every odd integer has the form $6k + 3$
        feedback: >
          That is the converse, and it is false: $5$ is odd and is not $6k + 3$
          for any integer $k$. The rule never runs the arrow backwards.
      - text: >
          $2025$ is divisible by $6$
        feedback: >
          Nothing in the conditional mentions divisibility by $6$, and the
          remainder $3$ shows it fails. Only the stated conclusion is delivered.
      - text: >
          Nothing, since the theorem speaks of a general form rather than this
          number
        feedback: >
          A statement about every integer of that form applies to each such
          integer; that is what makes general theorems useful.
    rubric:
      - >
        Checks the hypothesis as written and then takes exactly the theorem's
        conclusion, for the one object in question.
      - >
        Does not import the converse or any claim the conditional did not make.
    targets:
      - foundations.logic.modus-ponens
    exercises:
      - foundations.logic.def-validity
    connects: []
    tags: []

  - id: logic-modus-tollens-01
    kind: justify
    difficulty: demanding
    statement: >
      Show that the argument form "from $p \to q$, $r \to \neg q$ and $r$, infer
      $\neg p$" is valid, naming the rule used at each step.
    answer: >
      Two steps, each an inference rule of this unit. First, the premises
      $r \to \neg q$ and $r$ are a conditional together with its hypothesis, so
      modus ponens delivers the conclusion $\neg q$. Second, the premise
      $p \to q$ together with the $\neg q$ just obtained is a conditional
      together with the denial of its conclusion, so modus tollens delivers
      $\neg p$. That is the argument.

      The truth-table check confirms it. Restrict to the rows where all three
      premises hold. The premise $r$ forces $r$ true; then $r \to \neg q$ has a
      true hypothesis, so $\neg q$ must be true and $q$ must be false. With $q$
      false, the premise $p \to q$ is a conditional with a false conclusion, so
      it can only be true if its hypothesis fails — $p$ must be false. Exactly
      one pattern of $p, q, r$ survives, namely $p$ false, $q$ false, $r$ true,
      and there the conclusion $\neg p$ is true. No assignment makes the premises
      true and the conclusion false, so the form is valid.

      Modus tollens is not a second principle here: since $p \to q \equiv \neg q
      \to \neg p$, the second step is the forward rule applied to the
      contrapositive of the first premise. The shape of the whole argument is the
      shape of indirect reasoning — derive a consequence of $p$, show that
      consequence fails, and $p$ falls with it.
    rubric:
      - >
        Applies modus ponens to $r \to \neg q$ with $r$ before touching the
        other premise, obtaining $\neg q$ rather than assuming it.
      - >
        Applies modus tollens to $p \to q$ using the *denied conclusion*
        $\neg q$, not a denied hypothesis.
      - >
        Confirms validity by exhibiting the one surviving row, or by noting that
        modus tollens is the forward rule on the contrapositive.
    targets:
      - foundations.logic.modus-tollens
      - foundations.logic.modus-ponens
    exercises:
      - foundations.logic.def-validity
    connects: []
    tags: []

  - id: logic-modus-tollens-02
    kind: decide
    difficulty: standard
    statement: >
      A theorem states: if a positive integer is a perfect square then its last
      digit is one of $0, 1, 4, 5, 6, 9$. The integer $4832$ ends in $2$. What
      follows?
    answer: >
      $4832$ is not a perfect square. The theorem is a conditional $p \to q$ with
      $p$ the statement "$4832$ is a perfect square" and $q$ the statement "the
      last digit of $4832$ is one of $0, 1, 4, 5, 6, 9$". The last digit is $2$,
      which is not on the list, so $q$ is false and $\neg q$ holds. A conditional
      together with the denial of its conclusion refutes its hypothesis, so
      $\neg p$ follows: $4832$ is not a perfect square. That conclusion was
      reached without extracting a single square root — the economy of the rule
      is that testing a consequence is enough. The tempting refusal, "nothing
      follows, since the theorem gives only a necessary condition", inverts the
      situation: a necessary condition is exactly what modus tollens consumes.
      Having the last digit on the list would tell you nothing, since that is the
      conclusion and running the arrow backwards is the fallacy of affirming the
      consequent; but *failing* the list is decisive.
    choices:
      - text: >
          $4832$ is not a perfect square
        correct: true
        feedback: >
          The conclusion of the conditional fails, so its hypothesis cannot
          hold — no square root needed.
      - text: >
          $4832$ is a perfect square
        feedback: >
          That is the hypothesis affirmed, which nothing here supports; the
          evidence points the other way.
      - text: >
          Nothing, since the theorem gives only a necessary condition
        feedback: >
          A necessary condition is precisely what this rule uses: fail the
          necessary condition and the hypothesis is refuted.
      - text: >
          Nothing, since the last-digit list might be incomplete
        feedback: >
          The theorem is given, so the list is taken as stated; the inference
          asks only what follows from the premises in hand.
    rubric:
      - >
        Uses the failure of the *conclusion*, not of the hypothesis.
      - >
        Concludes the negation of the hypothesis, and notes that satisfying the
        digit condition would have licensed nothing.
    targets:
      - foundations.logic.modus-tollens
    exercises:
      - foundations.logic.def-validity
      - foundations.logic.contrapositive
    connects: []
    tags: []

  - id: logic-ex-converse-fallacy-01
    kind: decide
    difficulty: demanding
    statement: >
      Four arguments all use the conditional "if the tap is open then the tank
      drains". Exactly one of them is valid. Which?
    answer: >
      "The tap is open, so the tank drains" is the valid one: it holds the
      conditional together with its hypothesis, which is modus ponens. Each of
      the others is a valid rule aimed at the wrong piece. "The tank drains, so
      the tap is open" affirms the consequent — it applies the forward rule to
      the converse. "The tap is not open, so the tank does not drain" denies the
      antecedent — the forward rule applied to the inverse. "The tank does not
      drain, so the tap is open" is worse still: it takes the denied conclusion
      and affirms the hypothesis, where modus tollens denies it. A single truth
      assignment refutes the two classic fallacies at once, namely tap closed and
      tank draining: the conditional is true, since its hypothesis fails; the
      second premise of the first fallacy — the tank drains — is true, and its
      conclusion, the tap is open, is false; the second premise of the second
      fallacy — the tap is not open — is true, and its conclusion, the tank does
      not drain, is false. Concretely a second inflow would drain the tank with
      the tap shut, and the conditional never denied that.
    choices:
      - text: >
          The tap is open, so the tank drains
        correct: true
        feedback: >
          Conditional plus its hypothesis: modus ponens, and the only one of the
          four with no assignment making the premises true and the conclusion
          false.
      - text: >
          The tank drains, so the tap is open
        feedback: >
          Affirming the consequent — the forward rule pointed at the converse.
          Tap closed with the tank draining refutes it.
      - text: >
          The tap is not open, so the tank does not drain
        feedback: >
          Denying the antecedent — the forward rule pointed at the inverse. The
          same assignment, tap closed and tank draining, refutes it.
      - text: >
          The tank does not drain, so the tap is open
        feedback: >
          This denies the conclusion and then *affirms* the hypothesis, where
          modus tollens denies it. Tap closed with the tank not draining refutes
          it.
    rubric:
      - >
        Identifies the valid argument as the one pairing the conditional with
        its hypothesis.
      - >
        Names the two fallacies structurally, as the forward rule applied to the
        converse and to the inverse.
      - >
        Produces the single assignment — tap closed, tank draining — that
        refutes both.
    targets:
      - foundations.logic.ex-converse-fallacy
    exercises:
      - foundations.logic.modus-ponens
      - foundations.logic.modus-tollens
    connects: []
    tags: []

  - id: logic-ex-converse-fallacy-02
    kind: work
    difficulty: standard
    statement: >
      Consider the argument "from $p \to q$ and $\neg p$, infer $\neg q$". In how
      many of the four truth assignments to $p, q$ are both premises true while
      the conclusion is false?
    answer: >
      $1$. A row of that kind is a counterexample to validity, and finding one is
      a complete refutation. The premise $\neg p$ restricts attention to the two
      rows where $p$ is false. In both of them the other premise $p \to q$ is
      true, since a conditional with a false hypothesis cannot be broken. So both
      rows have all premises true. Now look at the conclusion $\neg q$ in each.
      In the row $p$ false, $q$ false, the conclusion $\neg q$ is true, so that
      row is no counterexample. In the row $p$ false, $q$ true, the conclusion
      $\neg q$ is false — premises true, conclusion false. That is exactly one
      row, so the count is $1$ and the form, denying the antecedent, is invalid.
      Answering $0$ usually comes from forgetting that a false hypothesis makes
      the conditional true, so that both $p$-false rows really do satisfy every
      premise; answering $2$ counts the row $p$ false, $q$ false, where the
      conclusion happens to hold.
    expects: "1"
    rubric:
      - >
        Recognises that $p \to q$ is true in both rows with $p$ false, so both
        satisfy the premises.
      - >
        Isolates the single row $p$ false, $q$ true as the counterexample, and
        concludes the form is invalid.
    targets:
      - foundations.logic.ex-converse-fallacy
    exercises:
      - foundations.logic.modus-ponens
      - foundations.logic.modus-tollens
    connects: []
    tags: []

  # --- predicates and quantifiers ---------------------------------------------

  - id: logic-def-predicate-01
    kind: work
    difficulty: demanding
    statement: >
      Let the domain of both slots be $\{2, 3, 4, 6\}$ and let $Q(x, y)$ be the
      predicate "$x$ divides $y$". Of the $16$ ordered pairs $(a, b)$ drawn from
      that domain, how many make $Q(a, b)$ true?
    answer: >
      $7$. A two-slot predicate becomes a proposition only when both slots are
      filled, so the objects being counted are ordered pairs, and $Q(2, 4)$ and
      $Q(4, 2)$ are different propositions with different truth values. Go
      through the four choices of $a$. With $a = 2$: $2$ divides $2$, $4$ and
      $6$, but not $3$ — three true instances. With $a = 3$: $3$ divides $3$ and
      $6$ but not $2$ or $4$ — two. With $a = 4$: $4$ divides $4$ only, since
      $2$, $3$ and $6$ are not multiples of $4$ — one. With $a = 6$: $6$ divides
      $6$ only — one. The total is $3 + 2 + 1 + 1 = 7$. The instances with
      $a = b$ are easy to lose and account for four of the seven, since every
      integer divides itself; dropping them gives $3$. Counting unordered pairs
      instead gives a smaller number still and answers a different question,
      because the predicate is not symmetric — $Q(2, 6)$ is true and $Q(6, 2)$
      is false.
    expects: "7"
    rubric:
      - >
        Counts ordered pairs, treating $Q(a, b)$ and $Q(b, a)$ as separate
        instances.
      - >
        Includes the four instances with $a = b$.
      - >
        Fills both slots before assigning a truth value — $Q(2, y)$ is still a
        predicate, not an instance.
    targets:
      - foundations.logic.def-predicate
    exercises:
      - foundations.logic.def-proposition
    connects: []
    tags: []

  - id: logic-def-predicate-02
    kind: decide
    difficulty: standard
    statement: >
      Over the domain of positive integers, let $R(x, y)$ be the predicate
      "$x^y = y^x$". Which of the following has a truth value?
    answer: >
      $R(2, 4)$. A predicate of $n$ variables becomes a proposition only when all
      $n$ variables are assigned values from the domain, and $R(2, 4)$ has both
      slots filled: it says $2^4 = 4^2$, that is $16 = 16$, so it is a
      proposition, and a true one. The others are all short of that. $R(x, 4)$
      has one slot filled and one open, so it is still a predicate — true at
      $x = 2$ and false at $x = 3$, with no verdict of its own. $R(x, y)$ has
      both slots open, which is the predicate itself. And $x^y$ is not a sentence
      at all but a number-valued expression; there is no assertion in it to be
      true or false, so it is not even a candidate. The general rule is that a
      partially filled predicate is still waiting: one open slot is enough to
      leave a sentence without a truth value, exactly as in the one-variable
      case.
    choices:
      - text: >
          $R(2, 4)$
        correct: true
        feedback: >
          Both slots filled, so it is a proposition: it asserts $16 = 16$, which
          is true.
      - text: >
          $R(x, 4)$
        feedback: >
          One slot is still open. It holds at $x = 2$ and fails at $x = 3$, so
          the sentence has no verdict of its own.
      - text: >
          $R(x, y)$
        feedback: >
          That is the bare predicate, with both slots open — nothing to
          evaluate.
      - text: >
          $x^y$
        feedback: >
          A number-valued expression rather than a sentence. Only sentences can
          be true or false.
    rubric:
      - >
        Requires *every* slot filled before granting a truth value.
      - >
        Distinguishes a sentence from a number-valued expression.
    targets:
      - foundations.logic.def-predicate
    exercises:
      - foundations.logic.def-proposition
    connects: []
    tags: []

  - id: logic-quantifier-universal-01
    kind: work
    difficulty: demanding
    statement: >
      Let $D = \{-3, -2, -1, 0, 1, 2, 3\}$ and let $P(x)$ be the predicate
      "$x^3 \ge x$". How many elements of $D$ fail $P$?
    answer: >
      $2$. Over a finite domain the universal claim $\forall x\, P(x)$ unpacks as
      the conjunction of the seven instances, so a single failing instance sinks
      it; the question asks how many such failures there are. Evaluate each
      element. At $x = -3$: $(-3)^3 = -27$, and $-27 \ge -3$ is false — a
      failure. At $x = -2$: $-8 \ge -2$ is false — a failure. At $x = -1$:
      $-1 \ge -1$ is true, since the inequality is not strict. At $x = 0$:
      $0 \ge 0$ is true. At $x = 1$: $1 \ge 1$ is true. At $x = 2$: $8 \ge 2$ is
      true. At $x = 3$: $27 \ge 3$ is true. So exactly two elements, $-3$ and
      $-2$, fail, and $\forall x\, P(x)$ is false over $D$ — either failure alone
      is a complete refutation, and the second adds nothing to the verdict. The
      negative entries are where the answer is decided: cubing a number below
      $-1$ makes it far smaller, whereas the reflex from the positive integers
      says cubing only grows things. Answering $0$ is that reflex; answering $3$
      wrongly counts $x = -1$, where equality holds and the non-strict $\ge$ is
      satisfied.
    expects: "2"
    rubric:
      - >
        Tests every element of the stated domain, negatives included, rather
        than sampling the positive ones.
      - >
        Treats $x = -1$ as satisfying $P$, since $\ge$ admits equality.
      - >
        Concludes $\forall x\, P(x)$ is false over $D$, one counterexample being
        enough.
    targets:
      - foundations.logic.quantifier-universal
    exercises:
      - foundations.logic.def-predicate
      - foundations.logic.def-conjunction
    connects: []
    tags: []

  - id: logic-quantifier-universal-02
    kind: decide
    difficulty: standard
    statement: >
      Consider the claim "for every non-negative integer $n$, the value
      $n^2 + n + 41$ is prime". The values at $n = 0$ through $n = 39$ are all
      prime, and the value at $n = 40$ is $41^2 = 1681$. Is the claim true?
    answer: >
      False. A universal claim over a domain asserts that no element of the
      domain violates it, so it is destroyed by exactly one element that does,
      and $n = 40$ is such an element: $40^2 + 40 + 41 = 1600 + 81 = 1681 =
      41 \cdot 41$, which is composite. That single counterexample is a complete
      refutation — there is nothing further to check, and no other value of $n$
      is examined. The forty successes are the trap. Over an infinite domain no
      finite collection of confirmations settles a universal statement, because
      the claim ranges over elements the check never reached; forty is no closer
      to "every" than four is. The asymmetry is the practical point: proving
      $\forall x\, P(x)$ means covering every element, while refuting it costs
      one, so a run of confirmations is evidence about where to look next and
      never a proof.
    choices:
      - text: >
          False — $n = 40$ is a counterexample, and the forty successes do not
          matter
        correct: true
        feedback: >
          $1681 = 41 \cdot 41$ is composite. One violating element refutes a
          universal claim completely.
      - text: >
          True, since the claim holds for the first forty values
        feedback: >
          Finitely many confirmations never settle a claim over an infinite
          domain, and here the very next value breaks it.
      - text: >
          True for the integers but false over a larger domain
        feedback: >
          The counterexample $n = 40$ is itself a non-negative integer, so the
          claim already fails on the stated domain.
      - text: >
          Undecided, since only finitely many values have been checked
        feedback: >
          One counterexample decides a universal claim outright; no further
          checking is needed once it is in hand.
    rubric:
      - >
        Refutes the claim with the single element $n = 40$, and verifies that
        $1681$ is composite.
      - >
        Does not treat the forty confirmations as evidence for a universal claim
        over an infinite domain.
    targets:
      - foundations.logic.quantifier-universal
    exercises:
      - foundations.logic.def-predicate
      - foundations.logic.def-conjunction
    connects: []
    tags: []

  - id: logic-quantifier-existential-01
    kind: decide
    difficulty: demanding
    statement: >
      Over the domain of all integers, let $P(x)$ be the predicate
      "$x^2 + x + 1$ is even". Is $\exists x\, P(x)$ true?
    answer: >
      No, it is false. Refuting an existential claim means ruling out the entire
      domain, not failing to find a witness, and here the whole domain can be
      ruled out in one line. Write $x^2 + x + 1 = x(x + 1) + 1$. The factors $x$
      and $x + 1$ are consecutive integers, so exactly one of them is even and
      their product $x(x + 1)$ is even for every integer $x$. Adding $1$ to an
      even number gives an odd number, so $x^2 + x + 1$ is odd for every integer
      $x$, and no element of the domain satisfies $P$. Hence
      $\exists x\, P(x)$ is false and, by the negation law, $\forall x\, \neg
      P(x)$ is true. Note the economics that make this problem hard in the way it
      is: an existential is proved cheaply, by exhibiting one witness, and
      refuted expensively, by an argument covering everything. Testing $x = 1$
      and $x = 2$, which give $3$ and $7$, is not a refutation of anything — it
      leaves infinitely many integers unexamined.
    choices:
      - text: >
          True — take $x = 1$, since $1 + 1 + 1 = 3$
        feedback: >
          $3$ is odd, so $P(1)$ is false and this is not a witness at all.
      - text: >
          False — $x(x + 1)$ is even for every integer $x$, so $x^2 + x + 1$ is
          always odd
        correct: true
        feedback: >
          Consecutive integers include an even one, so the product is even and
          the sum with $1$ is odd throughout the domain.
      - text: >
          True — take $x = 2$, since $4 + 2 + 1 = 7$
        feedback: >
          $7$ is odd as well. Producing a value is not producing a witness
          unless the predicate actually holds there.
      - text: >
          Undecidable without restricting to a finite domain
        feedback: >
          An infinite domain does not block a verdict; it only means the
          refutation must be an argument rather than a search.
    rubric:
      - >
        Rules out the whole domain by an argument, rather than by checking
        sample values.
      - >
        Uses the parity of $x(x+1)$, or an equivalent case split on $x$ even and
        $x$ odd, to show the expression is always odd.
    targets:
      - foundations.logic.quantifier-existential
    exercises:
      - foundations.logic.def-predicate
      - foundations.logic.def-disjunction
    connects: []
    tags: []

  - id: logic-quantifier-existential-02
    kind: work
    difficulty: standard
    statement: >
      Let $D = \{1, 2, 3, \dots, 12\}$ and let $P(x)$ be the predicate
      "$x^2 + 1$ is prime". How many elements of $D$ satisfy $P$?
    answer: >
      $5$. Over a finite domain $\exists x\, P(x)$ is the disjunction of the
      instances, so a single true instance already settles it; the count here
      asks for more than the quantifier does. Evaluate $x^2 + 1$ at each element:
      $x = 1$ gives $2$, prime; $x = 2$ gives $5$, prime; $x = 3$ gives $10 = 2
      \cdot 5$, not prime; $x = 4$ gives $17$, prime; $x = 5$ gives $26 = 2 \cdot
      13$, not prime; $x = 6$ gives $37$, prime; $x = 7$ gives $50$, not prime;
      $x = 8$ gives $65 = 5 \cdot 13$, not prime; $x = 9$ gives $82 = 2 \cdot
      41$, not prime; $x = 10$ gives $101$, prime; $x = 11$ gives $122 = 2 \cdot
      61$, not prime; $x = 12$ gives $145 = 5 \cdot 29$, not prime. The witnesses
      are $1, 2, 4, 6, 10$, so the count is $5$. Note that every odd $x$ beyond
      $1$ makes $x^2 + 1$ even and greater than $2$, hence composite, which
      explains why no odd element after $x = 1$ appears on the list.
    expects: "5"
    rubric:
      - >
        Tests every element of the stated domain rather than stopping at the
        first witness, which is what the count asks for.
      - >
        Rejects the composite values correctly, in particular $65$ and $145$,
        which are not divisible by $2$ or $3$.
    targets:
      - foundations.logic.quantifier-existential
    exercises:
      - foundations.logic.def-predicate
      - foundations.logic.def-disjunction
    connects: []
    tags: []

  - id: logic-quantifier-negation-01
    kind: decide
    difficulty: demanding
    statement: >
      Push the negation all the way inward: which statement is equivalent to
      $\neg \forall x\, \exists y\, (P(x, y) \to Q(y))$?
    answer: >
      $\exists x\, \forall y\, (P(x, y) \land \neg Q(y))$. Move the negation
      rightwards one quantifier at a time. Passing the leading $\forall x$ turns
      it into $\exists x$ and leaves the negation on what follows:
      $\exists x\, \neg \exists y\, (P(x,y) \to Q(y))$. Passing the $\exists y$
      turns it into $\forall y$: $\exists x\, \forall y\, \neg (P(x,y) \to
      Q(y))$. Now the negation sits on a conditional, and the denial of a
      conditional is not another conditional but the conjunction asserting its
      hypothesis and denying its conclusion: $\neg(A \to B) \equiv A \land \neg
      B$. So the body becomes $P(x,y) \land \neg Q(y)$, and the whole statement
      is $\exists x\, \forall y\, (P(x, y) \land \neg Q(y))$. Two things stayed
      put throughout, and both are worth naming: the variables kept their names
      and their order, and the domain was never touched — negating a statement
      never negates what it quantifies over.
    choices:
      - text: >
          $\exists x\, \forall y\, (P(x, y) \land \neg Q(y))$
        correct: true
        feedback: >
          Both quantifiers flip in order, and the negated conditional becomes a
          conjunction.
      - text: >
          $\exists x\, \forall y\, (P(x, y) \to \neg Q(y))$
        feedback: >
          The quantifiers are right but the body is still a conditional. Denying
          $A \to B$ gives $A \land \neg B$, never $A \to \neg B$.
      - text: >
          $\forall x\, \exists y\, (P(x, y) \land \neg Q(y))$
        feedback: >
          The body is right and the quantifiers were left alone. Every
          quantifier the negation passes must flip.
      - text: >
          $\exists x\, \forall y\, (\neg P(x, y) \lor \neg Q(y))$
        feedback: >
          The hypothesis has been negated as well. The denial asserts $P(x,y)$
          outright, since that is the only way the conditional can fail.
    rubric:
      - >
        Flips both quantifiers, in order, as the negation passes each one.
      - >
        Negates the conditional body into a conjunction, asserting the
        hypothesis rather than denying it.
      - >
        Leaves the variables, their order and the domain unchanged.
    targets:
      - foundations.logic.quantifier-negation
    exercises:
      - foundations.logic.quantifier-universal
      - foundations.logic.quantifier-existential
    connects: []
    tags: []

  - id: logic-quantifier-negation-02
    kind: work
    difficulty: standard
    statement: >
      The statement $\exists x\, \forall y\, \exists z\, \forall w\, P(x,y,z,w)$
      is negated and the negation is pushed all the way in. In the resulting
      statement, how many of the four quantifier symbols are $\forall$?
    answer: >
      $2$. The rule is that a negation travelling rightwards flips every
      quantifier it passes, turning each $\forall$ into $\exists$ and each
      $\exists$ into $\forall$, and negates the body at the end. Applying it to
      the string $\exists x\, \forall y\, \exists z\, \forall w$ gives
      $\forall x\, \exists y\, \forall z\, \exists w\, \neg P(x,y,z,w)$. Reading
      off the result, the quantifiers are $\forall$, $\exists$, $\forall$,
      $\exists$, so two of the four are universal. Two checks are worth doing.
      The order of the variables is unchanged — $x$ still comes first — since
      flipping a quantifier is not the same as moving it, and moving two unlike
      quantifiers would change the statement. And the original had two $\exists$
      and two $\forall$, so the flipped string has two of each as well; a string
      with three $\exists$ and one $\forall$ would negate to one $\exists$ and
      three $\forall$.
    expects: "2"
    rubric:
      - >
        Flips all four quantifiers rather than only the outermost one.
      - >
        Keeps the variables in their original order, and negates the body once
        at the end.
    targets:
      - foundations.logic.quantifier-negation
    exercises:
      - foundations.logic.quantifier-universal
      - foundations.logic.quantifier-existential
    connects: []
    tags: []

  - id: logic-quantifier-negation-03
    kind: decide
    difficulty: routine
    statement: >
      What is the negation of "every rectangle with equal diagonals is a
      square"?
    answer: >
      "Some rectangle has equal diagonals and is not a square." Symbolically the
      claim is $\forall x\, (P(x) \to Q(x))$ over the rectangles, with $P(x)$ for
      "$x$ has equal diagonals" and $Q(x)$ for "$x$ is a square". Negating swaps
      $\forall$ for $\exists$ and negates the body, and the negated body is the
      denial of a conditional, namely $P(x) \land \neg Q(x)$. So the negation is
      $\exists x\, (P(x) \land \neg Q(x))$: some rectangle satisfies the
      hypothesis and fails the conclusion. As it happens the negation is true —
      every rectangle has equal diagonals, and a two-by-three rectangle is not a
      square — so the original claim is false, which is exactly the sort of thing
      writing the negation out is for. Two traps are visible in the wrong
      answers: keeping the quantifier and negating only the body gives the far
      stronger contrary, and changing what is quantified over replaces the claim
      with a different one, since a negation never touches the domain.
    choices:
      - text: >
          Some rectangle has equal diagonals and is not a square
        correct: true
        feedback: >
          $\neg \forall$ becomes $\exists$, and the negated conditional becomes
          "hypothesis holds, conclusion fails".
      - text: >
          Every rectangle with equal diagonals fails to be a square
        feedback: >
          The quantifier was kept and only the body negated. That is the
          contrary, and it is far stronger than the denial.
      - text: >
          Some rectangle with unequal diagonals is a square
        feedback: >
          This negates the hypothesis instead of the conclusion, and it speaks
          about rectangles the original claim never mentioned.
      - text: >
          No rectangle has equal diagonals
        feedback: >
          This denies the domain condition rather than the claim. A negation
          leaves what you quantify over exactly where it was.
    rubric:
      - >
        Swaps $\forall$ for $\exists$ rather than keeping the universal
        quantifier.
      - >
        Turns the conditional body into a conjunction that asserts the
        hypothesis and denies the conclusion.
    targets:
      - foundations.logic.quantifier-negation
    exercises:
      - foundations.logic.quantifier-universal
      - foundations.logic.quantifier-existential
    connects: []
    tags: []

  - id: logic-nested-quantifiers-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $\exists y\, \forall x\, P(x,y) \Rightarrow \forall x\, \exists
      y\, P(x,y)$ holds for every domain and every predicate $P$, and give a
      domain and predicate for which the converse implication fails.
    answer: >
      For the implication, suppose $\exists y\, \forall x\, P(x,y)$ is true. Then
      some element $y_0$ of the domain satisfies $\forall x\, P(x, y_0)$; that is,
      $P(c, y_0)$ holds for every $c$ in the domain. Now take an arbitrary $c$.
      Since $P(c, y_0)$ holds, the element $y_0$ is a witness for the inner claim
      $\exists y\, P(c, y)$, so that claim is true. As $c$ was arbitrary,
      $\forall x\, \exists y\, P(x, y)$ holds. The whole content of the argument
      is that a witness allowed to depend on $x$ may perfectly well ignore $x$:
      the constant choice $y_0$ is a legal answer at every $x$.

      The converse fails. Take the domain $\{1, 2, 3\}$ and let $P(x, y)$ be
      "$x \ne y$". Then $\forall x\, \exists y\, P(x,y)$ is true: given $x$,
      choose any of the two other elements of the domain — for $x = 1$ take
      $y = 2$, for $x = 2$ take $y = 1$, for $x = 3$ take $y = 1$. But
      $\exists y\, \forall x\, P(x, y)$ is false: a witness $y_0$ would have to
      satisfy $P(c, y_0)$ for *every* $c$ in the domain, including $c = y_0$
      itself, which would require $y_0 \ne y_0$. So no witness exists. One
      predicate, one domain, two quantifier orders, two different truth values —
      which is what makes the implication one-directional.
    rubric:
      - >
        Extracts a single witness $y_0$ from the existential premise and reuses
        it at every $x$, saying explicitly that a constant witness is permitted.
      - >
        Takes $x$ arbitrary in the conclusion, rather than proving the inner
        claim for one particular $x$.
      - >
        Supplies a concrete domain and predicate where $\forall \exists$ holds
        and $\exists \forall$ fails, and shows the failure by testing the
        candidate witness against every element, itself included.
    targets:
      - foundations.logic.nested-quantifiers
    exercises:
      - foundations.logic.quantifier-universal
      - foundations.logic.quantifier-existential
    connects: []
    tags: []

  - id: logic-nested-quantifiers-02
    kind: decide
    difficulty: standard
    statement: >
      Over the domain of positive integers, let $P(x, y)$ be the predicate
      "$x$ divides $y$". Which of the following is correct?
    answer: >
      $\forall x\, \exists y\, P(x,y)$ is true and $\exists y\, \forall x\,
      P(x,y)$ is false. Read each order by what may depend on what. In the first,
      $y$ is chosen after $x$ is known, so it may vary with $x$: given a positive
      integer $x$, take $y = x$, which $x$ certainly divides — or take $y = 2x$
      if a distinct witness is wanted. Either way a witness exists for every $x$,
      so the statement holds. In the second, a single $y_0$ is fixed in advance
      and must then be divisible by *every* positive integer. No such integer
      exists: whatever $y_0$ is, the integer $y_0 + 1$ is a positive integer
      larger than $y_0$, and a positive integer cannot be divided by something
      strictly larger than itself. So the second order is false. The predicate
      and the domain are identical in the two statements; only the order of the
      quantifiers changed, and that alone changed the verdict.
    choices:
      - text: >
          $\forall x\, \exists y\, P(x,y)$ is true and $\exists y\, \forall x\,
          P(x,y)$ is false
        correct: true
        feedback: >
          A witness that may depend on $x$ is easy to supply; a single integer
          divisible by every positive integer does not exist.
      - text: >
          Both are true
        feedback: >
          The second would require an integer $y_0$ divisible by every positive
          integer, and $y_0 + 1$ already defeats any candidate.
      - text: >
          Both are false
        feedback: >
          The first is true: given $x$, the choice $y = x$ works, since every
          integer divides itself.
      - text: >
          $\forall x\, \exists y\, P(x,y)$ is false and $\exists y\, \forall x\,
          P(x,y)$ is true
        feedback: >
          This reverses the two. The order with the *later* witness is the
          weaker and easier claim, not the harder one.
    rubric:
      - >
        Reads the first order as permitting a witness that depends on $x$, and
        supplies one.
      - >
        Refutes the second order by showing no single $y_0$ can serve every
        $x$, testing a value larger than the candidate.
    targets:
      - foundations.logic.nested-quantifiers
    exercises:
      - foundations.logic.quantifier-universal
      - foundations.logic.quantifier-existential
    connects: []
    tags: []

  - id: logic-ex-quantifier-order-01
    kind: work
    difficulty: demanding
    statement: >
      Let the domain be $\{1, 2, 3, 4\}$ for both slots and let $P(x, y)$ be the
      predicate "$x + y$ is even". Of the $16$ ordered pairs $(x, y)$ from that
      domain, how many satisfy $P$?
    answer: >
      $8$. A sum of two integers is even exactly when the two have the same
      parity, so the satisfying pairs are those with both entries odd or both
      even. The domain holds two odd elements, $1$ and $3$, giving
      $2 \cdot 2 = 4$ ordered pairs, and two even elements, $2$ and $4$, giving
      another $4$; the total is $8$, which is half of the $16$ pairs. The count
      is what separates the two quantifier orders on this predicate. Every $x$
      appears as the first entry of some satisfying pair — for $x = 1$ take
      $y = 3$, for $x = 2$ take $y = 4$ — so $\forall x\, \exists y\, P(x,y)$ is
      true, with the witness depending on the parity of $x$. But no single $y_0$
      appears as the second entry of a satisfying pair for *every* $x$: a fixed
      $y_0$ works only for the two elements sharing its parity, and fails for the
      other two. So $\exists y\, \forall x\, P(x,y)$ is false. Same predicate,
      same domain, two orders, two verdicts — and the $8$ satisfying pairs are
      exactly the bookkeeping that shows why.
    expects: "8"
    rubric:
      - >
        Counts ordered pairs and groups them by parity, giving $4$ odd-odd and
        $4$ even-even.
      - >
        Reads the count as the reason $\forall x \exists y$ holds while
        $\exists y \forall x$ fails: every $x$ has a partner, but no $y_0$
        partners every $x$.
    targets:
      - foundations.logic.ex-quantifier-order
    exercises:
      - foundations.logic.nested-quantifiers
    connects: []
    tags: []

  - id: logic-ex-quantifier-order-02
    kind: decide
    difficulty: standard
    statement: >
      Over the domain of all real numbers, let $P(x, y)$ be the predicate
      "$xy = 1$". Which of $\forall x\, \exists y\, P(x,y)$ and
      $\exists y\, \forall x\, P(x,y)$ is true?
    answer: >
      Neither. The $\exists \forall$ order fails for the usual reason: a single
      $y_0$ would have to satisfy $x y_0 = 1$ for every real $x$, and the demands
      at $x = 1$ and $x = 2$ force $y_0 = 1$ and $y_0 = 1/2$, which no number
      satisfies at once. The $\forall \exists$ order is the interesting one,
      because the reflex is to say it is true — given $x$, take $y = 1/x$. That
      answer is legitimate for every $x$ except one. At $x = 0$ the demand is
      $0 \cdot y = 1$, and $0 \cdot y = 0$ for every real $y$, so no witness
      exists there. A universal claim is destroyed by one bad element, and
      $x = 0$ is one, so $\forall x\, \exists y\, P(x,y)$ is false as well. The
      lesson is that the standing implication runs only one way: $\exists
      \forall$ implies $\forall \exists$, so the failure of the weaker order
      guarantees the failure of the stronger, while the failure of the stronger
      would have told you nothing about the weaker.
    choices:
      - text: >
          Both are false
        correct: true
        feedback: >
          The $\exists \forall$ order fails as usual, and the $\forall \exists$
          order fails too, at the single element $x = 0$.
      - text: >
          $\forall x\, \exists y\, P(x,y)$ is true and $\exists y\, \forall x\,
          P(x,y)$ is false
        feedback: >
          The witness $y = 1/x$ covers every real except $x = 0$, and one
          uncovered element refutes a universal claim.
      - text: >
          Both are true
        feedback: >
          No single $y_0$ can satisfy $x y_0 = 1$ at both $x = 1$ and $x = 2$,
          so the $\exists \forall$ order fails outright.
      - text: >
          $\exists y\, \forall x\, P(x,y)$ is true and $\forall x\, \exists y\,
          P(x,y)$ is false
        feedback: >
          That combination is impossible in principle: $\exists \forall$ always
          implies $\forall \exists$, so the first can never hold while the
          second fails.
    rubric:
      - >
        Tests the $\forall \exists$ order at $x = 0$ rather than accepting
        $y = 1/x$ as covering the whole domain.
      - >
        Notes that $\exists \forall$ implies $\forall \exists$, so the fourth
        combination could have been ruled out without computation.
    targets:
      - foundations.logic.ex-quantifier-order
    exercises:
      - foundations.logic.nested-quantifiers
    connects: []
    tags: []

  - id: logic-vacuous-truth-01
    kind: decide
    difficulty: demanding
    statement: >
      Let $D$ be the set of prime numbers $p$ with $23 < p < 29$. Which
      statement about $D$ is correct?
    answer: >
      Both "every element of $D$ is even" and "every element of $D$ is odd" are
      true. First establish that $D$ is empty: the integers strictly between $23$
      and $29$ are $24, 25, 26, 27, 28$, and each is composite —
      $24, 26, 28$ are even and larger than $2$, $25 = 5 \cdot 5$ and $27 = 3
      \cdot 3 \cdot 3$. So $D$ has no elements. Now a universal statement over
      $D$ asserts only that no element of $D$ violates it, and where there is
      nothing to violate a claim, nothing does: refuting "every element of $D$ is
      even" would require exhibiting an element of $D$ that is odd, and $D$
      supplies no element at all. The same argument works verbatim for the other
      claim. That two apparent contraries hold together is not a contradiction,
      because each is a claim about the elements of $D$ and there are none for
      either to be about; a genuine contradiction would need an element making
      one true and the other false. The mirror fact completes the picture:
      $\exists x \in D$ is false for every predicate, since there is nothing to
      disjoin.
    choices:
      - text: >
          Both "every element of $D$ is even" and "every element of $D$ is odd"
          are true, since $D$ is empty
        correct: true
        feedback: >
          Each universal claim asserts only that no element violates it, and $D$
          offers no element to serve as a violation.
      - text: >
          "Every element of $D$ is even" is false, since $2$ is the only even
          prime
        feedback: >
          The fact about $2$ is true and irrelevant: $2$ is not in $D$, and
          falsity would require an odd element *of $D$*.
      - text: >
          $D$ has an element that is even
        feedback: >
          That is an existential claim, and over an empty domain every
          existential claim is false — there is nothing to disjoin.
      - text: >
          Neither claim has a truth value, since $D$ is empty
        feedback: >
          Both are perfectly good propositions. The convention assigns them a
          value, and bivalence leaves no third option.
    rubric:
      - >
        Checks that $D$ is empty by ruling out each of $24$ through $28$.
      - >
        Grants both universal claims, and explains why holding both is not a
        contradiction: a contradiction would need a witnessing element.
      - >
        Notes that the corresponding existential claims are all false over the
        empty domain.
    targets:
      - foundations.logic.vacuous-truth
    exercises:
      - foundations.logic.def-conditional
      - foundations.logic.quantifier-universal
    connects: []
    tags: []

  - id: logic-vacuous-truth-02
    kind: decide
    difficulty: standard
    statement: >
      Over the domain of all integers, is $\forall n\, (n^2 = 2 \to n^3 = 8)$
      true or false?
    answer: >
      True, vacuously. The statement is universal with a conditional body, so it
      is false exactly when some integer makes the hypothesis true and the
      conclusion false — that is the one combination a conditional forbids, and a
      universal claim fails only at a violating element. A violating integer here
      would have to satisfy $n^2 = 2$, and no integer does: $1^2 = 1$ and
      $2^2 = 4$, and squaring is increasing on the non-negative integers, so
      nothing lands on $2$, while negative integers square to the same values.
      With no integer satisfying the hypothesis, every instance $n^2 = 2 \to
      n^3 = 8$ has a false hypothesis and is therefore true, so the conjunction
      of all the instances is true and the universal statement holds. Nothing is
      thereby claimed about any integer, because there are no integers the claim
      touches — which is precisely the point of the convention: the statement
      keeps working in the degenerate case instead of needing it excluded by
      hand.
    choices:
      - text: >
          True, vacuously — no integer satisfies the hypothesis
        correct: true
        feedback: >
          Every instance has a false hypothesis, so every instance is true and
          the universal claim holds.
      - text: >
          False, since $n^3 = 8$ forces $n = 2$ and $2^2 = 4 \ne 2$
        feedback: >
          That argues from the conclusion backwards. Falsity needs an integer
          with $n^2 = 2$ and $n^3 \ne 8$, and no integer meets the first demand.
      - text: >
          True, because $n = \sqrt{2}$ satisfies both sides
        feedback: >
          $\sqrt{2}$ is not an integer, so it is not in the domain — and it does
          not satisfy $n^3 = 8$ either.
      - text: >
          Neither, since the statement is about a number that does not exist
        feedback: >
          A universal statement over a domain with no qualifying element is a
          proposition and is true; it simply claims nothing.
    rubric:
      - >
        Locates the failure condition correctly: a universal conditional fails
        only at an element satisfying the hypothesis and failing the conclusion.
      - >
        Shows no integer satisfies $n^2 = 2$, and concludes the statement is
        true rather than undefined.
    targets:
      - foundations.logic.vacuous-truth
    exercises:
      - foundations.logic.def-conditional
      - foundations.logic.quantifier-universal
    connects: []
    tags: []
