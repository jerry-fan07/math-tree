problems:
  # --- supremum and infimum ---------------------------------------------------

  - id: real-sup-inf-01
    kind: decide
    difficulty: routine
    statement: >
      Let $S = \{\, 1 - 1/n : n \in \mathbb{N},\ n \ge 1 \,\}$. Which
      description of $\sup S$ and $\inf S$ is correct?
    answer: >
      $\sup S = 1$ with $1 \notin S$, and $\inf S = 0$ with $0 \in S$. Every
      element is $1 - 1/n < 1$, so $1$ is an upper bound; and no smaller number
      bounds $S$, since for $b < 1$ the element $1 - 1/n$ exceeds $b$ as soon as
      $1/n < 1 - b$. That makes $1$ the least upper bound, yet $1 - 1/n = 1$
      would force $1/n = 0$, so the supremum is not attained and $S$ has no
      maximum. At the other end $1/n \le 1$ gives $1 - 1/n \ge 0$, so $0$ is a
      lower bound, and it is attained at $n = 1$; a lower bound that lies in the
      set is automatically the greatest one, so $\inf S = 0$ and it is the
      minimum of $S$. The asymmetry is the whole point of the definition: one
      end is reached and the other is not, and both are legitimate.
    choices:
      - text: >
          $\sup S = 1$ with $1 \notin S$; $\inf S = 0$ with $0 \in S$.
        correct: true
        feedback: >
          Right on both counts. The supremum is a fact about the bounds, so it
          is free to sit outside $S$, while the infimum here is attained at
          $n = 1$ and so is a genuine minimum.
      - text: >
          $\sup S = 1$ with $1 \in S$; $\inf S = 0$ with $0 \in S$.
        feedback: >
          This assumes a supremum must be attained. It is not: $1 - 1/n = 1$
          would need $1/n = 0$, which no $n$ delivers, so $1 \notin S$ even
          though $1 = \sup S$.
      - text: >
          $\sup S = 1$ with $1 \notin S$; $\inf S = 0$ with $0 \notin S$.
        feedback: >
          The first half is right and the second over-corrects. Having learned
          that a supremum can miss the set, it is tempting to assume the
          infimum does too — but $n = 1$ gives $1 - 1/1 = 0$, so $0$ really is
          an element.
      - text: >
          $\sup S$ does not exist, since $S$ has no largest element.
        feedback: >
          This confuses the maximum with the supremum. The minimum is taken
          over the upper bounds of $S$, not over $S$ itself, and those upper
          bounds are the numbers $\ge 1$, whose least member is $1$.
    rubric:
      - >
        Gives $\sup S = 1$ and argues both halves — $1$ is an upper bound, and
        nothing smaller is.
      - >
        Gives $\inf S = 0$ and notes it is attained, so it is a minimum.
      - >
        Says correctly which of the two lies in $S$: a supremum need not be an
        element, and that is the point of the definition.
    targets:
      - foundations.real.sup-inf
    exercises: []
    connects: []
    tags: []

  - id: real-sup-inf-02
    kind: justify
    difficulty: standard
    statement: >
      Let $S$ be non-empty and bounded above, and let $u = \sup S$. Prove that
      for every $\varepsilon > 0$ there exists $s \in S$ with $s > u - \varepsilon$.
    answer: >
      Suppose not: there is $\varepsilon > 0$ such that every $s \in S$ satisfies
      $s \le u - \varepsilon$. Then $u - \varepsilon$ is an upper bound for $S$,
      and $u - \varepsilon < u$, contradicting that $u$ is the least upper bound.
      Hence some $s \in S$ satisfies $s > u - \varepsilon$.
    rubric:
      - >
        Uses *least* upper bound, not merely upper bound — the argument is exactly
        that a smaller upper bound cannot exist.
      - >
        Negates the statement correctly: the negation is that $u - \varepsilon$
        bounds $S$ above, for some fixed $\varepsilon$.
      - >
        Does not assume $\sup S \in S$ at any point.
    targets:
      - foundations.real.sup-inf
    exercises: []
    connects: []
    tags: []

  - id: real-sup-inf-03
    kind: work
    difficulty: demanding
    statement: >
      Let $S = \{\, (-1)^n + 1/n : n \in \mathbb{N},\ n \ge 1 \,\}$. Compute
      $\sup S + \inf S$.
    answer: >
      $1/2$. Split the set by the parity of $n$, because $(-1)^n$ does two
      different things. For even $n$ the element is $1 + 1/n$, a value that
      shrinks as $n$ grows, so the largest of these is $1 + 1/2 = 3/2$ at
      $n = 2$; for odd $n$ the element is $-1 + 1/n$, which is at most
      $-1 + 1 = 0$. So $3/2$ is an upper bound and it is an element, which makes
      it the maximum and therefore the supremum: $\sup S = 3/2$. At the bottom,
      every element satisfies $(-1)^n + 1/n > -1$, since $1/n > 0$ and
      $(-1)^n \ge -1$, so $-1$ is a lower bound. No larger number is one: given
      $c > -1$, pick an odd $n$ with $1/n < c + 1$ and the element $-1 + 1/n$
      falls below $c$. Hence $\inf S = -1$, which is not attained — no element
      equals $-1$, since that would need $1/n = 0$. The sum is
      $3/2 + (-1) = 1/2$.
    expects: "1/2"
    rubric:
      - >
        Splits on the parity of $n$ rather than treating $(-1)^n + 1/n$ as one
        monotone family.
      - >
        Identifies $\sup S = 3/2$ as attained at $n = 2$, and does not mistake
        the value $1$ that the even terms approach for the supremum.
      - >
        Shows $-1$ is the *greatest* lower bound, by exhibiting an element below
        any proposed larger bound, and notes that it is not attained.
    targets:
      - foundations.real.sup-inf
    exercises: []
    connects: []
    tags: []

  - id: real-sup-inf-04
    kind: decide
    difficulty: standard
    statement: >
      Let $S$ and $T$ be non-empty subsets of $\mathbb{R}$, both bounded above,
      with $\sup S = \sup T = 10$. Which of the following must be true?
    answer: >
      $\sup(S \cup T) = 10$ must hold; nothing else on the list does. For the
      union: every element of $S \cup T$ lies in $S$ or in $T$, so it is at most
      $10$ either way, making $10$ an upper bound. It is the least one, because
      for any $\varepsilon > 0$ the set $S$ already supplies an element above
      $10 - \varepsilon$, and that element belongs to the union too. The
      intersection can be empty — take $S$ to be the numbers below $10$ that are
      rational and $T$ the ones that are irrational — and an empty set has no
      supremum at all, so no claim about $\sup(S \cap T)$ survives. Equal
      suprema say nothing about equal sets, and neither set need contain $10$:
      $S = T = \{\, x \in \mathbb{R} : x < 10 \,\}$ has supremum $10$ with
      $10$ in neither.
    choices:
      - text: >
          $\sup(S \cup T) = 10$.
        correct: true
        feedback: >
          Both clauses check out: $10$ bounds the union because it bounds each
          piece, and it is least because $S$ alone already pushes elements
          above $10 - \varepsilon$ for every $\varepsilon > 0$.
      - text: >
          $\sup(S \cap T) = 10$.
        feedback: >
          The intersection can be empty, and then it has no supremum whatever.
          Even when it is non-empty its elements can all sit far below $10$;
          suprema of two sets say nothing about where the sets overlap.
      - text: >
          $10 \in S \cup T$.
        feedback: >
          A supremum need not be attained. If $S = T$ is the set of reals below
          $10$, the supremum is $10$ and no element equals it, so the union
          misses $10$ as well.
      - text: >
          $S = T$.
        feedback: >
          A supremum records one number, not the set that produced it. The set
          of reals below $10$ and the single point $\{10\}$ share the supremum
          $10$ and have nothing else in common.
    rubric:
      - >
        Verifies both defining clauses for the union rather than asserting that
        suprema pass through unions.
      - >
        Rejects the intersection claim by noticing the intersection may be
        empty, so the hypotheses of the definition fail.
      - >
        Does not assume $\sup S \in S$ anywhere in the argument.
    targets:
      - foundations.real.sup-inf
    exercises: []
    connects: []
    tags: []

  # --- the completeness axiom -------------------------------------------------

  - id: real-completeness-01
    kind: justify
    difficulty: standard
    statement: >
      The set $A = \{\, q \in \mathbb{Q} : q > 0,\ q^2 < 2 \,\}$ is non-empty and
      bounded above within $\mathbb{Q}$, yet has no least upper bound in
      $\mathbb{Q}$. Which axiom does this show $\mathbb{Q}$ fails, and what does
      $\mathbb{R}$ supply in its place?
    answer: >
      It shows $\mathbb{Q}$ fails the least-upper-bound axiom: any rational upper
      bound of $A$ can be replaced by a strictly smaller rational upper bound, so
      no least one exists in $\mathbb{Q}$. The completeness axiom is precisely the
      assertion that in $\mathbb{R}$ every non-empty set bounded above does have a
      supremum; here that supremum is $\sqrt{2}$, which is not rational. This is
      the axiom that separates $\mathbb{R}$ from $\mathbb{Q}$ as ordered fields.
    rubric:
      - >
        Names the least-upper-bound (completeness) axiom, not merely "$\mathbb{R}$
        has more numbers".
      - >
        States the axiom with both hypotheses: non-empty *and* bounded above.
      - >
        Identifies the missing supremum as $\sqrt{2}$ and notes it is irrational.
    targets:
      - foundations.real.completeness
    exercises:
      - foundations.real.sup-inf
    connects: []
    tags: []

  - id: real-completeness-02
    kind: work
    difficulty: demanding
    statement: >
      For how many of these four sets does the completeness axiom guarantee a
      supremum in $\mathbb{R}$? (i) $\{\, x \in \mathbb{R} : x^2 < 0 \,\}$; (ii)
      $\{\, q \in \mathbb{Q} : q^2 < 3 \,\}$, regarded as a subset of
      $\mathbb{R}$; (iii) $\{\, x \in \mathbb{R} : x^3 > 8 \,\}$; (iv)
      $\{\, -n^2 : n \in \mathbb{N},\ n \ge 1 \,\}$.
    answer: >
      Two — sets (ii) and (iv). The axiom has exactly two hypotheses, non-empty
      and bounded above, so check both on each set. Set (i) looks like an
      interval but is empty: no real number has $x^2 < 0$. Emptiness is fatal,
      because every real is vacuously an upper bound of $\emptyset$, so the
      upper bounds form all of $\mathbb{R}$ and have no least member. Set (ii)
      contains $0$ and is bounded above by $2$, since $q \ge 2$ forces
      $q^2 \ge 4 > 3$; both hypotheses hold, so the supremum exists in
      $\mathbb{R}$ — it is $\sqrt{3}$, which is irrational, and that is exactly
      the point. The axiom is a statement about $\mathbb{R}$, and it does not
      care that the set was carved out of $\mathbb{Q}$. Set (iii) is the reals
      above $2$, since $x^3 > 8$ is equivalent to $x > 2$; it is non-empty but
      unbounded above, as $b + 1$ beats any proposed bound $b > 2$. Set (iv) is
      $-1, -4, -9, \dots$, non-empty and bounded above by $-1$, so it qualifies
      and its supremum is $-1$. Being infinite and running downwards forever is
      no obstacle; only an upper bound is asked for. Count: $0 + 1 + 0 + 1 = 2$.
    expects: "2"
    rubric:
      - >
        Notices that set (i) is empty and rejects it for failing the non-empty
        hypothesis, not for some property of its elements.
      - >
        Accepts set (ii) even though its supremum is irrational — the axiom is
        applied inside $\mathbb{R}$, where the set is an ordinary bounded set.
      - >
        Rejects set (iii) for being unbounded above, and accepts set (iv)
        despite its being unbounded *below*, which the axiom never asks about.
    targets:
      - foundations.real.completeness
    exercises:
      - foundations.real.sup-inf
    connects: []
    tags: []

  - id: real-completeness-03
    kind: decide
    difficulty: standard
    statement: >
      Which of these statements is true of $\mathbb{R}$ but false of
      $\mathbb{Q}$?
    answer: >
      Only the least-upper-bound property: every non-empty subset that is
      bounded above has a supremum lying in the field itself. The set
      $\{\, q \in \mathbb{Q} : q > 0,\ q^2 < 2 \,\}$ is non-empty and bounded
      above by $2$, yet every rational upper bound of it admits a strictly
      smaller rational upper bound, so no least one exists inside $\mathbb{Q}$.
      The other three statements hold in both fields, and that is what makes the
      example decisive: $\mathbb{Q}$ is a densely ordered field whose order is
      total and compatible with its arithmetic, so no amount of arguing from
      order and arithmetic alone can produce a supremum. Completeness has to be
      assumed separately, which is why it is stated as an axiom rather than
      proved.
    choices:
      - text: >
          Between any two distinct elements there is a third.
        feedback: >
          True in both. For rationals $a < b$ the average $(a + b)/2$ is again
          rational and lies strictly between them, so density is not what
          $\mathbb{Q}$ lacks — a field can be full of holes and still dense.
      - text: >
          Every non-empty subset that is bounded above has a least upper bound
          within the field.
        correct: true
        feedback: >
          This is the completeness axiom, and it is exactly the statement that
          fails in $\mathbb{Q}$: the positive rationals with square below $2$
          are bounded above and have no least rational upper bound.
      - text: >
          Every non-empty finite subset has a greatest element.
        feedback: >
          True in both, and for a reason that has nothing to do with
          completeness — a finite non-empty set of any totally ordered field has
          a greatest element, found by comparing its members in turn.
      - text: >
          If $a < b$ then $a + c < b + c$ for every $c$.
        feedback: >
          True in both. This is one of the ordered-field axioms, which
          $\mathbb{Q}$ satisfies in full; the gap between the two fields lies
          entirely outside the arithmetic and order rules.
    rubric:
      - >
        Picks the least-upper-bound property and says why the other three hold
        in $\mathbb{Q}$ as well.
      - >
        Names a concrete witness set in $\mathbb{Q}$ that is bounded above with
        no least rational upper bound.
      - >
        States the property with the phrase "within the field" — $A$ does have a
        supremum, just not a rational one.
    targets:
      - foundations.real.completeness
    exercises: []
    connects: []
    tags: []
