# Problems targeting foundations.number-systems — the tower ℕ → ℤ → ℚ → ℝ → ℂ.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's
# ending with something the lesson just handed over, and one that is not, so
# the unit test has something fair to ask. Every `work` and `decide` problem is
# machine-checked; `justify` is reserved for the actual proofs, where the
# rubric is the whole instrument. No problem reuses a lesson's worked example
# or a card's instance. See ../README.md for the authoring checklist.

problems:
  # --- addition on ℕ ----------------------------------------------------------

  - id: number-systems-def-nat-addition-01
    kind: work
    difficulty: demanding
    statement: >
      An operation $\oplus$ on $\mathbb{N}$ is defined by recursion on the
      second argument exactly as addition is, but with a doubled step:
      $m \oplus 0 = m$ and $m \oplus S(n) = S(S(m \oplus n))$. Unwind the
      clauses to compute $4 \oplus 3$.
    answer: >
      $10$. Peel the second argument, reading $3$ as $S(S(S(0)))$. Each
      application of the step clause parks *two* successors outside instead of
      one: $4 \oplus S(S(S(0))) = S(S(4 \oplus S(S(0))))$, then
      $S(S(S(S(4 \oplus S(0)))))$, then $S(S(S(S(S(S(4 \oplus 0))))))$. The
      base clause bottoms it out at $4 \oplus 0 = 4$, leaving $4$ with six
      successors applied, which is $10$. In closed form the recursion computes
      $m \oplus n = m + 2n$, and the whole content of the exercise is that the
      *shape* of the recursion — one base clause, one step clause consuming the
      value built so far — is what the Recursion theorem licenses; nothing
      about the step being $S$ rather than $S \circ S$ was ever used. Answering
      $7$ treats the step as a single successor, that is, computes $4 + 3$;
      answering $8$ computes $2 \cdot 4$ by doubling the wrong argument.
    expects: "10"
    rubric:
      - >
        Applies the step clause once per successor in $3$, three times, and
        emits two successors on each application rather than one.
      - >
        Bottoms the recursion out on $m \oplus 0 = m$ with $m = 4$, not on
        $0$.
      - >
        Reads off $m \oplus n = m + 2n$ and checks it against the computed
        value.
    targets:
      - foundations.number-systems.def-nat-addition
    exercises:
      - foundations.induction.recursion-theorem
    connects: []
    tags: []

  - id: number-systems-def-nat-addition-02
    kind: decide
    difficulty: standard
    statement: >
      A colleague defines an operation by recursion on the *first* argument
      instead, freezing $n$: $0 \ast n = n$ and $S(m) \ast n = S(m \ast n)$.
      Which verdict is correct?
    answer: >
      The second: $\ast$ is the same function as $+$, but the two clauses that
      come for free have swapped places. The Recursion theorem is a statement
      about one varying argument, so freezing $n$ and recursing on $m$ is a
      perfectly legal instantiation — take $X = \mathbb{N}$, initial value
      $a = n$ and step $g(m, x) = S(x)$ — and unwinding gives
      $m \ast n = S(S(\cdots S(n)))$ with $m$ successors, which is $m + n$. So
      the operations agree everywhere. What differs is the accounting: with
      these clauses $0 \ast n = n$ is the base clause, true by definition, and
      it is $m \ast 0 = m$ that now costs an induction on $m$. Neither
      definition is more correct than the other; each makes one of the two
      identities free and charges an induction for the other, which is a
      symptom of the asymmetry in the recursion itself rather than of anything
      asymmetric about addition.
    choices:
      - text: >
          $\ast$ is a genuinely different operation from $+$, since it recurses
          on a different argument.
        feedback: >
          Unwinding gives $m \ast n = n$ with $m$ successors applied, which is
          $m + n$; recursing on the other argument changes which identities are
          free, not the function.
      - text: >
          $\ast$ agrees with $+$ everywhere, but now $0 \ast n = n$ is the base
          clause and $m \ast 0 = m$ is what needs an induction.
        correct: true
        feedback: >
          Exactly the trade. Whichever argument the recursion consumes, the
          identity on the *other* side becomes a theorem.
      - text: >
          The definition is illegitimate: the Recursion theorem only recurses
          on the second argument.
        feedback: >
          The theorem knows nothing about first or second. It defines a
          function of one variable; here that variable is $m$, with $n$ frozen
          as the initial value.
    rubric:
      - >
        Recognises that $\ast$ and $+$ are the same function, by unwinding
        $m \ast n$ to $n$ with $m$ successors applied.
      - >
        Identifies which identity is now free and which now costs an
        induction, rather than declaring one definition wrong.
    targets:
      - foundations.number-systems.def-nat-addition
    exercises:
      - foundations.induction.recursion-theorem
    connects: []
    tags: []

  # --- the laws of addition ---------------------------------------------------

  - id: number-systems-nat-addition-laws-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove the cancellation law for addition on $\mathbb{N}$: for all
      $m, n, k \in \mathbb{N}$, if $m + k = n + k$ then $m = n$. Work from the
      recursive clauses and the Peano axioms alone, and say which axiom the
      inductive step consumes.
    answer: >
      Induct on $k$, with $m$ and $n$ universally quantified inside the
      induction — the statement being inducted on is "for all $m, n$, if
      $m + k = n + k$ then $m = n$". Base $k = 0$: the first clause turns the
      hypothesis $m + 0 = n + 0$ into $m = n$ directly, so there is nothing to
      prove. Step: assume the statement for $k$ and suppose
      $m + S(k) = n + S(k)$. The second clause rewrites both sides, giving
      $S(m + k) = S(n + k)$. Now apply the injectivity of the successor —
      Peano axiom (P2), that $S(x) = S(y)$ implies $x = y$ — to strip the
      outer $S$, leaving $m + k = n + k$; the inductive hypothesis then gives
      $m = n$. By induction the law holds for every $k$. The injectivity of
      $S$ is genuinely load-bearing and not decoration: a "successor" that
      collapsed two naturals together would make $m + k = n + k$ possible with
      $m \ne n$, and the whole cancellation law would be false. Note also what
      the law does *not* give: it says $m + k = n + k$ forces $m = n$, not that
      $m + k = n$ can be solved for a difference. $\mathbb{N}$ has cancellation
      without inverses, and that gap is the defect $\mathbb{Z}$ repairs.
    rubric:
      - >
        Inducts on $k$ with $m$ and $n$ quantified *inside* the inductive
        statement, so the hypothesis is available for every pair.
      - >
        Names injectivity of $S$ — Peano axiom (P2) — as the step that strips
        the outer successor, rather than asserting the equality termwise.
      - >
        Uses the base clause $m + 0 = m$, not $0 + m = m$, in the base case.
      - >
        Does not silently invoke commutativity or a subtraction operation,
        neither of which is available.
    targets:
      - foundations.number-systems.nat-addition-laws
    exercises:
      - foundations.number-systems.def-nat-addition
      - foundations.induction.peano-axioms
      - foundations.induction.induction-principle
    connects: []
    tags: []

  - id: number-systems-nat-addition-laws-02
    kind: decide
    difficulty: standard
    statement: >
      A student writes: "$0 + n = n$ holds because $n + 0 = n$ is the first
      clause and addition is commutative." What is wrong with the argument?
    answer: >
      It is circular. Commutativity is not an axiom here; it is a proposition
      proved by induction on top of the recursive clauses, and that proof needs
      $0 + n = n$ as its base case, together with the auxiliary lemma
      $S(m) + n = S(m + n)$ for its step. So the student is deriving the base
      case of commutativity from commutativity. The conclusion is true and the
      route to it is not: $0 + n = n$ has its own induction on $n$, with base
      $0 + 0 = 0$ from the first clause and step
      $0 + S(n) = S(0 + n) = S(n)$, using only the second clause and the
      hypothesis. This is the standard trap of the whole node — the clauses
      take apart the second argument only, so every statement about the first
      argument costs work, and the order in which the laws are established is
      not free to be rearranged.
    choices:
      - text: >
          Nothing — the argument is a legitimate one-line proof.
        feedback: >
          It would be, if commutativity were available. It is not: its own
          proof rests on $0 + n = n$, so using it here assumes what is being
          proved.
      - text: >
          The argument is circular: the induction proving commutativity uses
          $0 + n = n$ as its base case, so commutativity is not yet available.
        correct: true
        feedback: >
          Right. The laws have a forced order, and this is the first place the
          order bites.
      - text: >
          Commutativity of addition is false in $\mathbb{N}$, so the appeal is
          simply wrong.
        feedback: >
          Commutativity is perfectly true in $\mathbb{N}$; the objection is to
          when it becomes available, not to whether it holds.
    rubric:
      - >
        Names the circularity: commutativity's own induction has $0 + n = n$ as
        its base case.
      - >
        Does not reject the conclusion — $0 + n = n$ is true; only the route is
        illegitimate.
    targets:
      - foundations.number-systems.nat-addition-laws
    exercises:
      - foundations.number-systems.def-nat-addition
    connects: []
    tags: []

  # --- multiplication on ℕ ----------------------------------------------------

  - id: number-systems-def-nat-multiplication-01
    kind: work
    difficulty: demanding
    statement: >
      An operation $\otimes$ on $\mathbb{N}$ copies the recursive clauses of
      multiplication but changes the base value: $m \otimes 0 = m$ and
      $m \otimes S(n) = m \otimes n + m$. Compute $4 \otimes 3$ from the
      clauses.
    answer: >
      $16$. The step clause is identical to multiplication's — add $m$ once
      more — so three peels give
      $4 \otimes 3 = 4 \otimes 2 + 4 = (4 \otimes 1 + 4) + 4
      = ((4 \otimes 0 + 4) + 4) + 4$. The base clause now returns $4$ rather
      than $0$, so the additions run back up from $4$ instead of from $0$:
      $4 + 4 = 8$, then $12$, then $16$. In closed form
      $m \otimes n = m + n m = m (n + 1)$, one copy of $m$ more than the
      product at every $n$. The point is that the initial value of a recursion
      is as much a part of the definition as the step: keeping the step and
      moving the base from $0$ to $m$ does not produce a distorted
      multiplication, it produces a different operation, one that is not even
      associative — $2 \otimes (1 \otimes 1) = 2 \otimes 4 = 10$ while
      $(2 \otimes 1) \otimes 1 = 4 \otimes 1 = 8$. Answering $12$ computes
      $4 \cdot 3$ and ignores the changed base; answering $20$ adds one copy of
      $m$ too many by miscounting the peels as four.
    expects: "16"
    rubric:
      - >
        Applies the step clause exactly three times, once per successor in $3$,
        and bottoms out on $m \otimes 0 = m$ rather than on $0$.
      - >
        Runs the additions back up from the base value $4$, so the total is
        $4 + 3 \cdot 4$ and not $3 \cdot 4$.
      - >
        States the closed form $m \otimes n = m(n + 1)$ and checks it against
        the computed value.
    targets:
      - foundations.number-systems.def-nat-multiplication
    exercises:
      - foundations.number-systems.def-nat-addition
      - foundations.induction.recursion-theorem
    connects: []
    tags: []

  - id: number-systems-def-nat-multiplication-02
    kind: decide
    difficulty: standard
    statement: >
      The Recursion theorem takes an initial value $a$ and a step function
      $g(n, x)$ and returns the unique $f$ with $f(0) = a$ and
      $f(S(n)) = g(n, f(n))$. Which instantiation returns
      $f(n) = m \cdot n$, multiplication by a fixed $m$?
    answer: >
      Initial value $a = 0$, step $g(n, x) = x + m$. Read the two defining
      clauses in the theorem's own shape: $m \cdot 0 = 0$ is $f(0) = a$, which
      forces $a = 0$; and $m \cdot S(n) = m \cdot n + m$ is
      $f(S(n)) = g(n, f(n))$ with $g(n, x) = x + m$, a step that consumes the
      value built so far and adds one further copy of $m$. That is the precise
      sense in which multiplication is repeated addition: the *step*, not the
      result, is an addition of $m$. Notice how little slack there is. Moving
      the initial value to $m$ contradicts the first clause outright and
      defines $n \mapsto m(n + 1)$; changing the step to $x \cdot m$ defines a
      function stuck at $0$ forever, because $0 \cdot m = 0$, and it is the
      step that belongs to exponentiation, which is why exponentiation must
      start at $1$.
    choices:
      - text: >
          $a = 0$, $g(n, x) = x + m$
        correct: true
        feedback: >
          Exactly: the base clause fixes $a = 0$ and the step clause is
          "add one more $m$ to what you have".
      - text: >
          $a = m$, $g(n, x) = x + m$
        feedback: >
          That contradicts the first clause, which says $m \cdot 0 = 0$. This
          instantiation defines $n \mapsto m(n + 1)$ instead.
      - text: >
          $a = 0$, $g(n, x) = x \cdot m$
        feedback: >
          Starting at $0$ with a multiplicative step leaves the value at $0$ for
          every $n$. That step belongs to exponentiation, whose initial value
          is $1$.
    rubric:
      - >
        Matches $m \cdot 0 = 0$ to $f(0) = a$, forcing the initial value to be
        $0$ and not $m$.
      - >
        Reads the step as $g(n, x) = x + m$, a function of the value built so
        far, not of the index.
    targets:
      - foundations.number-systems.def-nat-multiplication
    exercises:
      - foundations.induction.recursion-theorem
    connects: []
    tags: []

  # --- the laws of multiplication ---------------------------------------------

  - id: number-systems-nat-multiplication-laws-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that $\mathbb{N}$ has no zero divisors: if $m \cdot n = 0$ then
      $m = 0$ or $n = 0$. Use only the recursive clauses, the laws of addition,
      and the Peano axioms.
    answer: >
      Argue by contraposition: assume $m \ne 0$ and $n \ne 0$, and show
      $m \cdot n \ne 0$. Since $n \ne 0$, the Peano axioms give that $n$ is a
      successor — every natural is either $0$ or of the form $S(j)$, which is
      the induction axiom applied to the predicate "$x = 0$ or $x$ is a
      successor". So write $n = S(j)$. The second clause then gives
      $m \cdot n = m \cdot S(j) = m \cdot j + m$. Now use the addition law that
      $a + b = 0$ only when $a = b = 0$: if $m \cdot j + m$ were $0$, both
      summands would have to vanish, in particular $m = 0$, contrary to
      assumption. Hence $m \cdot n \ne 0$, which is the contrapositive of the
      claim. Two details carry the argument. The first is that a nonzero
      natural is a successor — without it there is no way to apply the
      recursive clause at all, and the statement is not provable from the
      clauses alone. The second is the addition law $a + b = 0 \implies a = b = 0$,
      itself proved by induction, which is what converts "the product is a sum
      ending in $m$" into "$m$ is zero".
    rubric:
      - >
        Uses that a nonzero natural is a successor, $n = S(j)$, and says which
        axiom supplies it, rather than assuming $n$ has a predecessor.
      - >
        Applies the recursive clause to get $m \cdot n = m \cdot j + m$, so the
        product is exhibited as a sum with $m$ as one summand.
      - >
        Invokes the addition law "$a + b = 0$ only if $a = b = 0$" to conclude
        $m = 0$, rather than cancelling or dividing.
      - >
        Handles the logic correctly: contraposition of "or" is a conjunction of
        two negations.
    targets:
      - foundations.number-systems.nat-multiplication-laws
    exercises:
      - foundations.number-systems.def-nat-multiplication
      - foundations.number-systems.nat-addition-laws
      - foundations.induction.peano-axioms
    connects: []
    tags: []

  - id: number-systems-nat-multiplication-laws-02
    kind: decide
    difficulty: standard
    statement: >
      Distributivity $m \cdot (n + k) = m \cdot n + m \cdot k$ is proved by
      induction on $k$. The step runs
      $m \cdot (n + S(k)) = m \cdot S(n + k) = m \cdot (n + k) + m
      = (m \cdot n + m \cdot k) + m = m \cdot n + (m \cdot k + m)
      = m \cdot n + m \cdot S(k)$. Which fact justifies the fourth equality,
      the regrouping?
    answer: >
      Associativity of addition on $\mathbb{N}$, and nothing more. The bracket
      moves from $(m \cdot n + m \cdot k) + m$ to
      $m \cdot n + (m \cdot k + m)$, which is exactly the associative law with
      $a = m \cdot n$, $b = m \cdot k$ and $c = m$. Nothing is reordered, so
      commutativity of addition is not needed either. This matters because of
      the order in which the laws of multiplication become available:
      distributivity is proved first, from the recursive clause alone, and
      associativity and commutativity of *multiplication* are then proved
      through it. An argument for distributivity that leaned on commutativity
      of multiplication would be circular in exactly the way the addition laws
      already warned about. What the proof does use freely is the addition
      laws, all of which are established before multiplication is introduced —
      which is the precise sense in which multiplication is built on top of
      addition rather than beside it.
    choices:
      - text: >
          Associativity of addition on $\mathbb{N}$.
        correct: true
        feedback: >
          Right: only the bracket moves, so the associative law for $+$ is the
          whole justification.
      - text: >
          Commutativity of multiplication.
        feedback: >
          Not available — commutativity of multiplication is proved *after*
          distributivity, through it. And nothing here is reordered; the
          bracket only moves.
      - text: >
          Injectivity of the successor function.
        feedback: >
          Injectivity of $S$ is what cancellation of addition consumes. No
          successor is stripped in this step.
    rubric:
      - >
        Names associativity of addition, and does not also claim commutativity
        of addition is needed — nothing is reordered.
      - >
        Rules out commutativity of multiplication on the ground that it is
        proved after distributivity, through it.
    targets:
      - foundations.number-systems.nat-multiplication-laws
    exercises:
      - foundations.number-systems.def-nat-multiplication
      - foundations.number-systems.nat-addition-laws
    connects: []
    tags: []

  # --- the order on ℕ ---------------------------------------------------------

  - id: number-systems-def-nat-order-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove directly from the definition $m \le n \iff m + k = n$ for some
      $k \in \mathbb{N}$ that the order on $\mathbb{N}$ is *discrete*: if
      $m < n$ then $m + 1 \le n$, so no natural number lies strictly between
      $m$ and $m + 1$.
    answer: >
      By definition $m < n$ means $m + k = n$ for some $k \ne 0$. Since $k$ is
      nonzero it is a successor — every natural is $0$ or of the form $S(j)$,
      by induction on the predicate "$x = 0$ or $x$ is a successor" — so write
      $k = S(j)$. Then
      $n = m + S(j) = S(m + j)$ by the recursive clause, and
      $S(m + j) = S(m) + j$ by the auxiliary lemma $S(a) + b = S(a + b)$ read
      backwards. Since $S(m) = m + 1$, this says $(m + 1) + j = n$, and $j$ is
      a witness for $m + 1 \le n$. For the second half, suppose $m < x < m + 1$.
      The first half applied to $m < x$ gives $m + 1 \le x$, while $x < m + 1$
      gives $x \le m + 1$ as well, and antisymmetry forces $x = m + 1$ —
      contradicting $x < m + 1$, which requires a nonzero witness. So the
      interval is empty. Notice what the argument consumes: the fact that a
      nonzero natural is a successor, which is a Peano fact and not an order
      fact, and the lemma $S(a) + b = S(a + b)$ from the addition laws. Both
      fail to have analogues once $\mathbb{Q}$ arrives, which is exactly why
      discreteness is the property the second construction destroys.
    rubric:
      - >
        Turns the nonzero witness $k$ into a successor $S(j)$, and names the
        axiom or induction that licenses it.
      - >
        Moves the successor from the right of the sum to the left using
        $S(a) + b = S(a + b)$, rather than asserting $m + S(j) = (m + 1) + j$
        without justification.
      - >
        Exhibits $j$ explicitly as the witness for $m + 1 \le n$, so the
        conclusion is read off the definition of $\le$ and not from intuition.
      - >
        Closes the "strictly between" half by antisymmetry or an equivalent,
        not by appeal to a picture of the number line.
    targets:
      - foundations.number-systems.def-nat-order
    exercises:
      - foundations.number-systems.nat-addition-laws
      - foundations.induction.induction-principle
    connects: []
    tags: []

  - id: number-systems-def-nat-order-02
    kind: work
    difficulty: standard
    statement: >
      In $\mathbb{N}$ the inequality $5 \le 9$ is witnessed by $k = 4$, since
      $5 + 4 = 9$. Compatibility of the order with multiplication is proved by
      transporting that witness. What is the witness establishing
      $5 \cdot 6 \le 9 \cdot 6$?
    answer: >
      $24$. Multiply the witnessing equation $5 + 4 = 9$ through by $6$ and
      distribute: $(5 + 4) \cdot 6 = 5 \cdot 6 + 4 \cdot 6$, so
      $30 + 24 = 54 = 9 \cdot 6$. The natural number $4 \cdot 6 = 24$ is
      therefore a $k$ with $5 \cdot 6 + k = 9 \cdot 6$, which is precisely what
      $5 \cdot 6 \le 9 \cdot 6$ asserts. The witness is *computed*, not merely
      asserted to exist, and that is how every compatibility proof at this
      level goes: the definition of $\le$ is existential, so proving an
      inequality means producing the object the existential quantifier asks
      for. Distributivity is the only law used. The same transport shows
      strictness survives: $24 \ne 0$ because $4 \ne 0$ and $6 \ne 0$ and
      $\mathbb{N}$ has no zero divisors, so $5 \cdot 6 < 9 \cdot 6$. Answering
      $4$ forgets to multiply the witness; answering $54$ names the right-hand
      side rather than the difference.
    expects: "24"
    rubric:
      - >
        Multiplies the witnessing *equation* by $6$ and distributes, rather
        than guessing a witness and checking it.
      - >
        Reports the witness $4 \cdot 6 = 24$, not the endpoint $54$ and not the
        original witness $4$.
    targets:
      - foundations.number-systems.def-nat-order
    exercises:
      - foundations.number-systems.nat-multiplication-laws
    connects: []
    tags: []

  # --- ℕ is unique up to isomorphism ------------------------------------------

  - id: number-systems-nat-categorical-01
    kind: work
    difficulty: demanding
    statement: >
      Let $N'$ be the set of powers of two, $\{1, 2, 4, 8, \ldots\}$, with
      $0' = 1$ and $S'(x) = 2x$. This satisfies the Peano axioms, so the
      unique structure-preserving $f : \mathbb{N} \to N'$ exists. Transport
      addition along $f$, defining $u \oplus v = f(f^{-1}(u) + f^{-1}(v))$ for
      $u, v \in N'$. Compute $f(3) \oplus f(4)$.
    answer: >
      $128$. The recursion gives $f(0) = 1$ and $f(S(n)) = 2 f(n)$, so
      $f(n) = 2^{n}$, and $f$ is a bijection onto $N'$. Transporting addition
      means: undo $f$, add in $\mathbb{N}$, redo $f$. So
      $f(3) \oplus f(4) = f(3 + 4) = f(7) = 2^{7} = 128$. Concretely
      $f(3) = 8$ and $f(4) = 16$, and $8 \oplus 16 = 128$ — the transported
      "addition" on $N'$ is ordinary *multiplication* of powers of two, since
      $2^{m} \cdot 2^{n} = 2^{m+n}$. That is the content of the theorem in
      miniature: which set and which operations are used to implement
      $\mathbb{N}$ carries no mathematical information, because the unique
      isomorphism carries the whole recursive structure across. Answering $24$
      adds $8$ and $16$ in the ambient integers, which is not the transported
      operation; answering $12$ computes $f(3) + f(4)$ in $\mathbb{N}$ and then
      forgets to apply $f$.
    expects: "128"
    rubric:
      - >
        Solves the recursion to $f(n) = 2^{n}$, from $f(0) = 1$ and
        $f(S(n)) = 2 f(n)$ — not $f(n) = 2n$.
      - >
        Computes the transported sum as $f(3 + 4)$, adding in $\mathbb{N}$
        before applying $f$, rather than adding the images in the ambient
        integers.
      - >
        Observes that the transported addition is multiplication in $N'$, so
        the "same" operation looks different in a different implementation.
    targets:
      - foundations.number-systems.nat-categorical
    exercises:
      - foundations.induction.recursion-theorem
      - foundations.functions.def-bijective
    connects: []
    tags: []

  - id: number-systems-nat-categorical-02
    kind: decide
    difficulty: standard
    statement: >
      Which of these triples $(N', 0', S')$ does *not* satisfy the Peano
      axioms?
    answer: >
      $(\mathbb{Z}, 0, x \mapsto x + 1)$ fails. Axiom (P1) says $0'$ is not a
      successor, and in $\mathbb{Z}$ the element $0$ is the successor of $-1$,
      so (P1) is violated immediately. Induction fails too, and for the same
      underlying reason: the set $\{0, 1, 2, \ldots\}$ contains $0'$ and is
      closed under $S'$, yet is not all of $\mathbb{Z}$, so the induction axiom
      would be false. The other two are genuine models. The odd naturals with
      $0' = 1$ and $S'(x) = x + 2$ satisfy (P1) because $1$ is not $x + 2$ for
      any odd $x \ge 1$, satisfy (P2) since $x + 2 = y + 2$ forces $x = y$, and
      satisfy induction because every odd number is reached from $1$ by
      repeated addition of $2$. The naturals from $3$ upwards with $0' = 3$ and
      $S'(x) = x + 1$ are the same story with the chain restarted. Both are
      therefore isomorphic to $\mathbb{N}$, by the theorem, however unlike
      $\mathbb{N}$ they look.
    choices:
      - text: >
          The odd natural numbers, with $0' = 1$ and $S'(x) = x + 2$.
        feedback: >
          This is a model: $1$ is not a successor within the odds, doubling
          back is impossible, and every odd number is reached from $1$, so
          induction holds.
      - text: >
          $\mathbb{Z}$, with $0' = 0$ and $S'(x) = x + 1$.
        correct: true
        feedback: >
          Right: $0 = S'(-1)$, so (P1) fails. Induction fails with it — the
          nonnegative integers are closed under $S'$ and contain $0'$ without
          exhausting $\mathbb{Z}$.
      - text: >
          The set $\{3, 4, 5, \ldots\}$, with $0' = 3$ and $S'(x) = x + 1$.
        feedback: >
          This is a model — the chain simply starts its labelling at $3$. The
          axioms never say what the elements are called.
    rubric:
      - >
        Locates the failure in (P1), that $0'$ is not a successor, and gives
        $-1$ as the offending predecessor.
      - >
        Does not reject a model merely for having unfamiliar elements or gaps
        in the ambient ordering.
    targets:
      - foundations.number-systems.nat-categorical
    exercises:
      - foundations.induction.peano-axioms
    connects: []
    tags: []

  # --- ℤ as a quotient --------------------------------------------------------

  - id: number-systems-def-integers-01
    kind: work
    difficulty: demanding
    statement: >
      An integer is an entire equivalence class of pairs of naturals under
      $(a, b) \sim (c, d) \iff a + d = c + b$. How many pairs $(a, b)$ with
      $a \le 20$ and $b \le 20$ belong to the class of $(10, 3)$?
    answer: >
      $14$. Unfold the relation: $(a, b) \sim (10, 3)$ means $a + 3 = 10 + b$,
      that is $a = b + 7$. So the class is the set of pairs whose first
      coordinate exceeds the second by exactly $7$ — an infinite set, of which
      the constraint $a \le 20$, $b \le 20$ selects finitely many. Taking
      $b = 0, 1, \ldots, 13$ gives $a = 7, 8, \ldots, 20$, all within range,
      and $b = 14$ would force $a = 21$, which is not. That is $14$ pairs:
      $(7, 0), (8, 1), \ldots, (20, 13)$. The class as a whole is the integer
      $7$, whose normal form is the unique member of the shape $(n, 0)$, here
      $(7, 0)$. The counting is the point: $7$ is not the pair $(7, 0)$ and not
      the natural number $7$ with a sign attached — it is the whole family of
      differences that agree, and $(7, 0)$ is merely the representative the
      construction singles out. Answering $21$ counts $b = 0, \ldots, 20$ and
      forgets that $a = b + 7$ must also stay under $20$; answering $1$ counts
      only the normal form.
    expects: "14"
    rubric:
      - >
        Unfolds $\sim$ correctly to $a + 3 = 10 + b$, hence $a = b + 7$, using
        the additive form of the relation rather than a subtraction.
      - >
        Applies *both* bounds, so $b$ runs to $13$ and not to $20$.
      - >
        Identifies the class as the integer $7$ with normal form $(7, 0)$,
        without confusing the class with that representative.
    targets:
      - foundations.number-systems.def-integers
    exercises:
      - foundations.relations.def-quotient-set
      - foundations.number-systems.nat-addition-laws
    connects: []
    tags: []

  - id: number-systems-def-integers-02
    kind: decide
    difficulty: standard
    statement: >
      The relation on $\mathbb{N} \times \mathbb{N}$ is written
      $a + d = c + b$ rather than the more suggestive $a - b = c - d$. Why?
    answer: >
      Because subtraction does not yet exist. The construction is being carried
      out inside $\mathbb{N}$, where the only operations available are those
      built in the previous nodes — addition, multiplication, order — and
      $a - b$ is not among them; for $a < b$ there is no natural number it
      could name, so the expression is not merely inconvenient but undefined.
      The whole purpose of the quotient is to *manufacture* a system in which
      differences make sense, and a construction may not presuppose the object
      it is built to produce. Rewriting the intended condition
      $a - b = c - d$ by adding $b + d$ to both sides gives $a + d = c + b$,
      which mentions only addition, is defined for every pair of pairs, and
      agrees with the intended reading wherever the intended reading makes
      sense. That rewriting trick — clear the operation you do not have by
      moving it to the other side — is the standard move, and it recurs
      verbatim in the construction of $\mathbb{Q}$, where $a/b = c/d$ becomes
      $a d = c b$ to avoid division.
    choices:
      - text: >
          Because subtraction is not defined in $\mathbb{N}$, and the
          construction may not use the operation it exists to create.
        correct: true
        feedback: >
          Exactly. Adding $b + d$ to both sides of $a - b = c - d$ clears the
          undefined operation and leaves a condition expressible in
          $\mathbb{N}$.
      - text: >
          Because $a + d = c + b$ is a strictly stronger condition than
          $a - b = c - d$, so it produces smaller classes.
        feedback: >
          The two conditions are equivalent wherever both are defined — the
          rewriting is reversible. The issue is expressibility, not strength.
      - text: >
          Because $\sim$ would otherwise fail to be transitive.
        feedback: >
          Transitivity holds for either reading; it is proved here by adding
          the two defining equations and cancelling. Only definedness forces
          the additive form.
    rubric:
      - >
        Says that $a - b$ is undefined in $\mathbb{N}$, not merely that it
        might be negative.
      - >
        Shows the additive form is obtained from the intended one by adding
        $b + d$ to both sides, so the two agree where both make sense.
    targets:
      - foundations.number-systems.def-integers
    exercises:
      - foundations.number-systems.nat-addition-laws
    connects: []
    tags: []

  # --- arithmetic on ℤ --------------------------------------------------------

  - id: number-systems-integers-operations-01
    kind: justify
    difficulty: demanding
    statement: >
      Multiplication on $\mathbb{Z}$ is declared through representatives by
      $[(a, b)] \cdot [(c, d)] = [(a c + b d,\, a d + b c)]$. Prove that it is
      well defined: if $(a, b) \sim (a', b')$ then
      $(a c + b d,\, a d + b c) \sim (a' c + b' d,\, a' d + b' c)$ for every
      $(c, d)$. Say which law of $\mathbb{N}$ each step consumes.
    answer: >
      The hypothesis is $a + b' = a' + b$; the goal, unfolding $\sim$, is
      $(a c + b d) + (a' d + b' c) = (a' c + b' d) + (a d + b c)$. Multiply the
      hypothesis by $c$ and distribute: $a c + b' c = a' c + b c$. Multiply it
      by $d$ and distribute: $a d + b' d = a' d + b d$. Now add
      $b d + a' d$ to both sides of the first of these. The left becomes
      $a c + b' c + b d + a' d$, which is the goal's left side after
      commuting and reassociating; the right becomes
      $a' c + b c + b d + a' d$. It remains to check that this equals the
      goal's right side $a' c + b' d + a d + b c$, and cancelling the common
      $a' c + b c$ from both reduces that to $b d + a' d = b' d + a d$, which
      is the second multiplied equation rearranged. So the two pairs are
      equivalent. The laws consumed are distributivity of multiplication over
      addition — used twice, to multiply an equation through — together with
      associativity and commutativity of addition to move summands about, and
      cancellation of addition to strip the common terms. Symmetry of the
      formula in its two arguments handles the second slot, so replacing both
      representatives at once follows by doing it one at a time. The obligation
      is not a formality: the rule "$(a, b) \mapsto a$" is a perfectly good
      function on pairs and defines nothing at all on classes, and only a check
      of this kind distinguishes the two cases.
    rubric:
      - >
        States the goal by unfolding $\sim$ on the *outputs*, so what is to be
        proved is an equation between cross-sums, not between pairs.
      - >
        Multiplies the defining equation $a + b' = a' + b$ by $c$ and by $d$,
        naming distributivity as the law that licenses it.
      - >
        Uses only laws already available in $\mathbb{N}$ — no subtraction and
        no negatives appear anywhere in the argument.
      - >
        Explains why one slot suffices: the formula is symmetric in its two
        arguments, so replacing both representatives follows by two
        applications.
    targets:
      - foundations.number-systems.integers-operations
    exercises:
      - foundations.number-systems.def-integers
      - foundations.relations.well-defined-on-quotient
      - foundations.number-systems.nat-multiplication-laws
    connects: []
    tags: []

  - id: number-systems-integers-operations-02
    kind: work
    difficulty: standard
    statement: >
      Using the formula
      $[(a, b)] \cdot [(c, d)] = [(a c + b d,\, a d + b c)]$, compute
      $[(2, 5)] \cdot [(6, 1)]$ and report the integer it names.
    answer: >
      $-15$. The formula gives
      $(2 \cdot 6 + 5 \cdot 1,\; 2 \cdot 1 + 5 \cdot 6) = (12 + 5,\; 2 + 30)
      = (17, 32)$. To read off the integer, find the normal form: since
      $17 + 15 = 32$, the pair $(17, 32)$ is equivalent to $(0, 15)$, which is
      the integer $-15$. The reading $[(a, b)] = a - b$ confirms it, since
      $(2 - 5)(6 - 1) = (-3) \cdot 5 = -15$ — and the formula is exactly what
      expanding that product forces, which is why it is not arbitrary. Well
      definedness can be checked here on the spot: $(2, 5) \sim (0, 3)$ and
      $(6, 1) \sim (5, 0)$, and the second computation gives
      $(0 \cdot 5 + 3 \cdot 0,\; 0 \cdot 0 + 3 \cdot 5) = (0, 15)$, the same
      class. Answering $15$ drops a sign by reading the pair in the wrong
      order; answering $-45$ multiplies $-3$ by $15$, using $(6, 1)$ as though
      it were the pair sum.
    expects: "-15"
    rubric:
      - >
        Uses the four-term formula, not componentwise multiplication.
      - >
        Reduces $(17, 32)$ to its normal form $(0, 15)$ and reports the integer
        $-15$ with the correct sign.
    targets:
      - foundations.number-systems.integers-operations
    exercises:
      - foundations.number-systems.def-integers
    connects: []
    tags: []

  # --- what ℤ fixes and what it costs -----------------------------------------

  - id: number-systems-integers-ordered-ring-01
    kind: justify
    difficulty: demanding
    statement: >
      Argument by minimal counterexample is illegal in $\mathbb{Z}$, because
      $\mathbb{Z}$ is not well ordered. Prove that it becomes legal again under
      one hypothesis: every nonempty set $T \subseteq \mathbb{Z}$ that is
      bounded below has a least element. Then say why the unrestricted
      statement fails.
    answer: >
      Let $N \in \mathbb{Z}$ be a lower bound, so $t \ge N$ for every
      $t \in T$. Consider $T' = \{t - N : t \in T\}$. Each $t - N \ge 0$, and
      the nonnegative integers are exactly the image of $\mathbb{N}$ under the
      embedding $n \mapsto [(n, 0)]$, so $T'$ may be regarded as a nonempty
      subset of $\mathbb{N}$. By the well-ordering of $\mathbb{N}$ it has a
      least element $s$. Put $t_0 = s + N \in T$. For any $t \in T$ we have
      $t - N \in T'$, so $s \le t - N$; adding $N$ to both sides is legal
      because the order on $\mathbb{Z}$ is preserved by adding any element, and
      gives $t_0 \le t$. So $t_0$ is least in $T$. The unrestricted statement
      fails because $\mathbb{Z}$ itself is nonempty and has no least element:
      given any $x$, the element $x - 1$ is strictly smaller, since
      $x - (x - 1) = 1 > 0$. The same holds for the set of negative integers.
      This is precisely the price of the construction — subtraction became
      total, and totality of subtraction is what lets you always step down. The
      surviving form is the one analysis actually uses, and it is why "let $n$
      be the least integer exceeding $n x$" is a legal move in the density
      proof: that set of integers is bounded below.
    rubric:
      - >
        Translates $T$ into $\mathbb{N}$ by subtracting a lower bound, and says
        that the nonnegative integers are the embedded copy of $\mathbb{N}$.
      - >
        Cites the well-ordering of $\mathbb{N}$ as the source of the least
        element, rather than assuming one exists in $\mathbb{Z}$.
      - >
        Translates back using compatibility of the order with addition, so the
        minimality of $s$ transfers to $t_0$.
      - >
        Exhibits a concrete failure for the unrestricted claim — $x - 1 < x$
        for every $x$ — and ties it to the availability of subtraction.
    targets:
      - foundations.number-systems.integers-ordered-ring
    exercises:
      - foundations.number-systems.integers-operations
      - foundations.induction.well-ordering
    connects: []
    tags: []

  - id: number-systems-integers-ordered-ring-02
    kind: work
    difficulty: standard
    statement: >
      Subtraction on $\mathbb{Z}$ is defined by $x - y = x + (-y)$, with
      $-[(c, d)] = [(d, c)]$ and
      $[(a, b)] + [(c, d)] = [(a + c,\, b + d)]$. Compute
      $[(2, 7)] - [(6, 1)]$ and report the integer it names.
    answer: >
      $-10$. First negate: $-[(6, 1)] = [(1, 6)]$, the pair reversed. Then add:
      $[(2, 7)] + [(1, 6)] = [(2 + 1,\, 7 + 6)] = [(3, 13)]$. For the normal
      form, $3 + 10 = 13$, so $(3, 13) \sim (0, 10)$, the integer $-10$.
      Reading the classes as differences confirms it: $[(2, 7)] = -5$,
      $[(6, 1)] = 5$, and $-5 - 5 = -10$. The whole exercise is one step of the
      gain the construction delivers. In $\mathbb{N}$ the equation
      $x + 6 = 2$ has no solution at all; in $\mathbb{Z}$ every class has an
      additive inverse — obtained, remarkably cheaply, by swapping the two
      coordinates, since $[(c, d)] + [(d, c)] = [(c + d,\, c + d)]$ and any
      pair with equal coordinates is equivalent to $(0, 0)$ — so subtraction is
      total and $x + a = b$ always solves. Answering $10$ swaps the operands;
      answering $0$ negates both classes.
    expects: "-10"
    rubric:
      - >
        Forms the additive inverse by reversing the pair, $-[(6, 1)] = [(1, 6)]$,
        and not by negating coordinates.
      - >
        Adds componentwise and then reduces $(3, 13)$ to normal form, reporting
        $-10$ rather than $10$.
    targets:
      - foundations.number-systems.integers-ordered-ring
    exercises:
      - foundations.number-systems.integers-operations
    connects: []
    tags: []

  # --- the ordered field axioms -----------------------------------------------

  - id: number-systems-def-ordered-field-01
    kind: decide
    difficulty: demanding
    statement: >
      Let $D$ be the set of terminating decimals — the rationals expressible as
      $a / 10^{k}$ with $a \in \mathbb{Z}$ and $k \in \mathbb{N}$ — with the
      arithmetic and order inherited from $\mathbb{Q}$. Exactly one ordered
      field axiom fails. Which?
    answer: >
      (F2), the existence of multiplicative inverses. $D$ is closed under
      addition and multiplication — $a/10^{j} + b/10^{k}$ and
      $(a/10^{j})(b/10^{k})$ are again of the required shape — and it contains
      $0$ and $1$ with $0 \ne 1$, so (F1) and (F3) hold, and the order
      inherited from $\mathbb{Q}$ satisfies (O1) and (O2) because those are
      inherited along with it. But $3 \in D$ is nonzero and its inverse $1/3$
      is not in $D$: if $1/3 = a/10^{k}$ then $10^{k} = 3a$, and $3$ divides no
      power of $10$. So a nonzero element lacks an inverse. The example is
      worth having because it shows the axioms are genuinely independent — $D$
      is not a pathological object but the number system a calculator actually
      implements — and because it fails in exactly the place $\mathbb{Z}$ does.
      A field is not obtained by collecting enough numbers; it is obtained by
      closing under the operation you want to be total, which is what the
      quotient construction of $\mathbb{Q}$ does in one step.
    choices:
      - text: >
          (F1), because $D$ has no additive identity or lacks additive
          inverses.
        feedback: >
          $0 = 0/10^{0}$ lies in $D$, and $-a/10^{k}$ is again a terminating
          decimal, so (F1) holds in full.
      - text: >
          (F2), because a nonzero element of $D$ can fail to have an inverse in
          $D$.
        correct: true
        feedback: >
          Right — $1/3$ is not a terminating decimal, since $3$ divides no
          power of $10$, so $3$ has no inverse in $D$.
      - text: >
          (O2), because a product of nonnegative terminating decimals can fail
          to be nonnegative.
        feedback: >
          The order is inherited from $\mathbb{Q}$, where (O2) holds, and $D$
          is closed under multiplication — so (O2) is inherited intact.
    rubric:
      - >
        Names (F2) and exhibits a specific element of $D$ whose inverse leaves
        $D$.
      - >
        Justifies the exclusion by divisibility — $3$ divides no power of $10$
        — rather than by inspecting a decimal expansion informally.
      - >
        Checks that the remaining axioms are inherited, so the answer is "one
        fails" and not "several might".
    targets:
      - foundations.number-systems.def-ordered-field
    exercises:
      - foundations.relations.def-total-order
    connects: []
    tags: []

  - id: number-systems-def-ordered-field-02
    kind: decide
    difficulty: standard
    statement: >
      Which of these statements is *not* one of the ordered field axioms, but a
      proposition derived from them?
    answer: >
      $x \cdot 0 = 0$ is derived. It is nowhere on the list: the axioms say
      what $+$ and $\cdot$ do to each other (F3), what identities and inverses
      exist (F1, F2), and how the order interacts with both (O1, O2), but they
      never mention the product of anything with $0$. The derivation is short
      and worth carrying: $x \cdot 0 = x \cdot (0 + 0) = x \cdot 0 + x \cdot 0$
      by (F1) and (F3), and adding $-(x \cdot 0)$ — which exists by (F1) — to
      both sides gives $0 = x \cdot 0$. By contrast $x (y + z) = x y + x z$ is
      (F3) verbatim, and "$0 \le x$ and $0 \le y$ imply $0 \le x y$" is (O2)
      verbatim. Knowing which line is an axiom and which is a theorem is not
      pedantry: the axioms are the interface every ordered field satisfies, and
      anything derived from them holds in $\mathbb{Q}$ and in $\mathbb{R}$
      alike — which is precisely why no consequence of this list can separate
      the two, and why completeness has to be added from outside.
    choices:
      - text: >
          $x \cdot 0 = 0$
        correct: true
        feedback: >
          Derived: expand $0 = 0 + 0$, distribute, and cancel using the
          additive inverse guaranteed by (F1).
      - text: >
          $x (y + z) = x y + x z$
        feedback: >
          This is (F3) itself, the distributive axiom — the single line that
          ties the two operations together.
      - text: >
          If $0 \le x$ and $0 \le y$ then $0 \le x y$
        feedback: >
          This is (O2) verbatim, one of the two order axioms.
    rubric:
      - >
        Identifies $x \cdot 0 = 0$ as derived and gives the two-line derivation
        from (F1) and (F3).
      - >
        Recognises the other two rows as (F3) and (O2) stated verbatim.
    targets:
      - foundations.number-systems.def-ordered-field
    exercises: []
    connects: []
    tags: []

  # --- consequences of the axioms ---------------------------------------------

  - id: number-systems-ordered-field-consequences-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $F$ be an ordered field and let $0 < x < y$. Prove that
      $0 < y^{-1} < x^{-1}$, using only the axioms and the facts already
      derived from them.
    answer: >
      First, inverses of positives are positive. $x \ne 0$, so $x^{-1}$ exists
      and $x^{-1} \ne 0$, since $x x^{-1} = 1 \ne 0$. Suppose $x^{-1} < 0$.
      Then $-x^{-1} > 0$, and (O2) applied to the nonnegative $x$ and
      $-x^{-1}$ gives $x \cdot (-x^{-1}) \ge 0$, that is $-1 \ge 0$. But
      $1 = 1^{2} > 0$, because every square is nonnegative and $1 \ne 0$, so
      $-1 < 0$ — a contradiction. Hence $x^{-1} > 0$, and the same argument
      gives $y^{-1} > 0$. Next, the product $c = x^{-1} y^{-1}$ is positive,
      being a product of two positives. Multiply the hypothesis $x < y$ by $c$.
      Multiplication by a positive element preserves the inequality and its
      strictness: $y - x > 0$ gives $c(y - x) > 0$ by (O2) together with
      $c(y-x) \ne 0$, since a product of nonzero elements in a field is
      nonzero; distributing, $c y - c x > 0$. Now
      $c x = x^{-1} y^{-1} x = y^{-1}$ and $c y = x^{-1} y^{-1} y = x^{-1}$, so
      the conclusion reads $x^{-1} - y^{-1} > 0$, that is
      $y^{-1} < x^{-1}$. Combined with $y^{-1} > 0$ this is the claim. Two
      steps carry the argument and are the usual casualties: establishing the
      sign of the inverses *before* multiplying by them, and noting that
      strictness survives only because the multiplier is invertible, so the
      product cannot collapse to zero.
    rubric:
      - >
        Proves $x^{-1} > 0$ before using it, by contradiction from (O2) and
        $1 > 0$, rather than assuming the sign of an inverse.
      - >
        Multiplies by the positive element $x^{-1} y^{-1}$, and says why
        strictness is preserved — the multiplier is nonzero and invertible.
      - >
        Simplifies $x^{-1} y^{-1} x$ and $x^{-1} y^{-1} y$ correctly, so the
        inequality lands on $y^{-1} < x^{-1}$ and not the reverse.
      - >
        Uses $1 = 1^{2} > 0$, and does not assume the order is the familiar one
        on $\mathbb{R}$.
    targets:
      - foundations.number-systems.ordered-field-consequences
    exercises:
      - foundations.number-systems.def-ordered-field
    connects: []
    tags: []

  - id: number-systems-ordered-field-consequences-02
    kind: decide
    difficulty: standard
    statement: >
      Every ordered field contains an isomorphic copy of $\mathbb{Q}$. Which
      account of *why* is correct?
    answer: >
      Because $1 > 0$ forces the sums $1, 1 + 1, 1 + 1 + 1, \ldots$ to be
      strictly increasing, hence pairwise distinct and all nonzero, so the map
      sending $n$ to the $n$-fold sum embeds $\mathbb{N}$; negatives supply
      $\mathbb{Z}$, and since every nonzero element of a field is invertible,
      closing under quotients supplies $\mathbb{Q}$. Each step leans on the
      order: $1 = 1^{2}$ is a nonzero square hence positive, and (O1) then
      turns $0 < 1$ into $s < s + 1$ for every $s$, which is what makes the
      chain strict and prevents it from wrapping around. Wrapping around is not
      a hypothetical worry — in the field of two elements $1 + 1 = 0$, and that
      field is precisely one that admits no compatible order. The other
      accounts get the direction wrong. Characteristic zero is the conclusion
      drawn from $1 > 0$, not a separate hypothesis; and completeness is not
      needed at all, since $\mathbb{Q}$ is itself an ordered field that
      contains $\mathbb{Q}$ and is famously not complete.
    choices:
      - text: >
          Because $1 > 0$ makes the sums $1 + \cdots + 1$ strictly increasing,
          hence distinct and nonzero, so $\mathbb{Z}$ embeds and closing under
          quotients gives $\mathbb{Q}$.
        correct: true
        feedback: >
          Right, and the order is what does the work: (O1) turns $0 < 1$ into
          $s < s + 1$, so the chain can never close up.
      - text: >
          Because every ordered field has characteristic zero by definition,
          and $\mathbb{Q}$ is the smallest field of characteristic zero.
        feedback: >
          Characteristic zero is not an axiom here — it is exactly the
          conclusion that the repeated sums are distinct, derived from
          $1 > 0$.
      - text: >
          Because completeness forces the field to contain every rational.
        feedback: >
          Completeness is not needed: $\mathbb{Q}$ itself is an ordered field
          containing $\mathbb{Q}$, and it is not complete.
    rubric:
      - >
        Starts from $1 = 1^{2} > 0$ and uses (O1) to make the chain of sums
        strictly increasing.
      - >
        Gets the order of construction right: $\mathbb{N}$, then $\mathbb{Z}$,
        then quotients for $\mathbb{Q}$.
    targets:
      - foundations.number-systems.ordered-field-consequences
    exercises:
      - foundations.number-systems.def-ordered-field
    connects: []
    tags: []

  # --- ℚ as a quotient --------------------------------------------------------

  - id: number-systems-def-rationals-01
    kind: work
    difficulty: demanding
    statement: >
      Each class of
      $\mathbb{Z} \times (\mathbb{Z} \setminus \{0\})$ under
      $(a, b) \sim (c, d) \iff a d = c b$ contains exactly one pair in lowest
      terms with positive second coordinate. Give that representative for the
      class of $(-84, -196)$, written as $a/b$.
    answer: >
      $3/7$. Two moves, and the order does not matter. Fixing the sign first:
      $(-84, -196) \sim (84, 196)$, since $(-84) \cdot 196 = -16464$ and
      $84 \cdot (-196) = -16464$ agree — negating both coordinates always
      produces an equivalent pair, which is the general fact that makes a
      positive denominator available in every class. Reducing next:
      $\gcd(84, 196) = 28$, since $84 = 28 \cdot 3$ and $196 = 28 \cdot 7$, so
      $(84, 196) \sim (3, 7)$, the cross-products being
      $84 \cdot 7 = 588 = 3 \cdot 196$. The pair $(3, 7)$ has positive second
      coordinate and $\gcd(3, 7) = 1$, so it is the lowest-terms
      representative, and the class is the rational $3/7$. Both signs cancel:
      $-84$ and $-196$ are negative together, so the rational is positive, and
      answering $-3/7$ negates only one coordinate. Answering $21/49$ divides
      by the common factor $4$ rather than by the greatest common divisor and
      stops short of lowest terms.
    expects: "3/7"
    rubric:
      - >
        Negates *both* coordinates to obtain a positive second coordinate, and
        checks the result is equivalent by cross-multiplication.
      - >
        Divides by $\gcd(84, 196) = 28$, not by a smaller common factor, so the
        representative really is in lowest terms.
      - >
        Reports a positive rational, recognising that two negative coordinates
        cancel.
    targets:
      - foundations.number-systems.def-rationals
    exercises:
      - foundations.number-systems.integers-ordered-ring
    connects: []
    tags: []

  - id: number-systems-def-rationals-02
    kind: decide
    difficulty: standard
    statement: >
      In the construction of $\mathbb{Q}$, the class $[(a, b)]$ is written
      $a / b$ and is meant to name the solution of a particular equation over
      $\mathbb{Z}$. Which equation?
    answer: >
      $b x = a$. The rationals are built to repair the one defect
      $\mathbb{Z}$ still has: $\mathbb{Z}$ can solve $x + a = b$ for every $a$
      and $b$, but $b x = a$ has no solution in general — $2 x = 1$ is the
      standard witness. So the class $[(a, b)]$ is introduced precisely as a
      name for the missing solution, and everything about the construction
      follows from that reading. The relation $a d = c b$ is what
      $a / b = c / d$ becomes once division is cleared, exactly as
      $a + d = c + b$ was what $a - b = c - d$ becomes once subtraction is
      cleared. The bar on $b = 0$ is forced by the same reading: $0 \cdot x = a$
      has no solution to name when $a \ne 0$, and infinitely many when
      $a = 0$, so in neither case is there a single solution for a class to
      denote. And the multiplicative inverse of $[(a, b)]$ is $[(b, a)]$
      because swapping the roles of the two coordinates swaps the equation
      $b x = a$ for $a x = b$ — legal exactly when $a \ne 0$, which is what
      $[(a, b)] \ne 0$ says.
    choices:
      - text: >
          $b x = a$
        correct: true
        feedback: >
          Right — the class names the solution $\mathbb{Z}$ could not supply,
          which is why $b = 0$ has to be barred.
      - text: >
          $a x = b$
        feedback: >
          That equation is solved by $b / a$, the reciprocal of the intended
          class. Reading the pair in this order would also put the bar on the
          wrong coordinate.
      - text: >
          $x + b = a$
        feedback: >
          That is the reading behind the *integers*, where $[(a, b)]$ names
          $a - b$. The rationals repair division, not subtraction.
    rubric:
      - >
        Names $b x = a$ and ties it to the defect of $\mathbb{Z}$ that the
        construction repairs.
      - >
        Explains the bar on $b = 0$ through that reading: no solution to name,
        or no unique one.
    targets:
      - foundations.number-systems.def-rationals
    exercises:
      - foundations.number-systems.integers-ordered-ring
    connects: []
    tags: []

  # --- arithmetic and order on ℚ ----------------------------------------------

  - id: number-systems-rationals-operations-01
    kind: justify
    difficulty: demanding
    statement: >
      The order on $\mathbb{Q}$ is declared by: $[(a, b)] \ge 0$, *for a
      representative with $b > 0$*, means $a \ge 0$. Prove that this is a
      definition — that such a representative always exists, and that the
      verdict does not depend on which one is chosen.
    answer: >
      Existence first. Let $(a, b)$ represent the class; by construction
      $b \ne 0$, so $\mathbb{Z}$'s totality of order gives $b > 0$ or $b < 0$.
      In the first case there is nothing to do. In the second, $(-a, -b)$ has
      $-b > 0$, and it is equivalent to $(a, b)$ because
      $a \cdot (-b) = -ab = (-a) \cdot b$. So every class has at least one
      representative with positive second coordinate. Independence next.
      Suppose $(a, b) \sim (c, d)$ with $b > 0$ and $d > 0$; the relation says
      $a d = c b$. Assume $a \ge 0$. Then $a d \ge 0$, since a product of
      nonnegatives is nonnegative in $\mathbb{Z}$, hence $c b \ge 0$. If
      $c < 0$ then $c b < 0$, because $b > 0$ and a negative times a positive
      is negative; that contradicts $c b \ge 0$, so $c \ge 0$. The converse is
      the same argument with the roles of $(a, b)$ and $(c, d)$ exchanged, the
      relation being symmetric. So the two representatives agree, and the
      declaration decides the class rather than the pair. The hypothesis
      $b > 0$ is doing real work and cannot be dropped: $(-3, -4)$ and
      $(3, 4)$ are the same rational, and reading the sign off the first
      coordinate alone would call it negative in one representative and
      positive in the other.
    rubric:
      - >
        Proves existence by negating both coordinates, and verifies that the
        negated pair is equivalent by cross-multiplication.
      - >
        Proves independence from $a d = c b$ using the sign rules of
        $\mathbb{Z}$, with $b > 0$ and $d > 0$ both used.
      - >
        Says explicitly where the positivity hypothesis is needed, for instance
        by exhibiting a pair like $(-3, -4)$ that would otherwise be misread.
      - >
        Treats both directions of the equivalence, not only one.
    targets:
      - foundations.number-systems.rationals-operations
    exercises:
      - foundations.number-systems.def-rationals
      - foundations.relations.well-defined-on-quotient
    connects: []
    tags: []

  - id: number-systems-rationals-operations-02
    kind: work
    difficulty: standard
    statement: >
      Apply the addition formula
      $[(a, b)] + [(c, d)] = [(a d + c b,\, b d)]$ to
      $[(2, -5)] + [(3, 4)]$, and report the result in lowest terms with
      positive denominator, written as $a/b$.
    answer: >
      $7/20$. The formula gives
      $(2 \cdot 4 + 3 \cdot (-5),\; (-5) \cdot 4) = (8 - 15,\, -20)
      = (-7, -20)$. The second coordinate is negative, so negate both to reach
      a legal representative for the order: $(7, 20)$, which is equivalent
      since $(-7) \cdot 20 = -140 = 7 \cdot (-20)$. As $\gcd(7, 20) = 1$ this
      is already in lowest terms, so the sum is $7/20$. Checking against the
      intended reading, $[(2, -5)]$ is $-2/5$ and $[(3, 4)]$ is $3/4$, and
      $-2/5 + 3/4 = -8/20 + 15/20 = 7/20$. Note that the formula never asks
      for a common denominator and never asks for the representatives to be in
      lowest terms — it works on whatever pairs it is handed, which is exactly
      what well definedness buys. Answering $-7/20$ keeps the negative sign
      attached to the wrong coordinate; answering $5/(-1)$ adds numerators and
      denominators separately, a rule that is not even well defined on classes.
    expects: "7/20"
    rubric:
      - >
        Uses the cross-multiplying formula rather than adding coordinates
        separately.
      - >
        Handles the negative second coordinate by negating both, and reports a
        positive final denominator.
      - >
        Reduces to lowest terms and reports $7/20$, with the sign coming out
        positive.
    targets:
      - foundations.number-systems.rationals-operations
    exercises:
      - foundations.number-systems.def-rationals
    connects: []
    tags: []

  # --- ℚ is an ordered field --------------------------------------------------

  - id: number-systems-q-ordered-field-01
    kind: work
    difficulty: demanding
    statement: >
      Density in an ordered field is proved by taking midpoints: $x < y$ gives
      $x < (x + y)/2 < y$. Starting from $x_0 = 2/5$ and $y = 1/2$, form the
      midpoint $x_1$ of $x_0$ and $y$, then the midpoint $x_2$ of $x_0$ and
      $x_1$. Give $x_2$ in lowest terms as $a/b$.
    answer: >
      $17/40$. First midpoint: $x_1 = (2/5 + 1/2)/2 = (4/10 + 5/10)/2
      = (9/10)/2 = 9/20$, and indeed $8/20 < 9/20 < 10/20$. Second midpoint,
      now between $x_0 = 2/5 = 8/20$ and $x_1 = 9/20$:
      $x_2 = (8/20 + 9/20)/2 = (17/20)/2 = 17/40$, with $\gcd(17, 40) = 1$, so
      that is lowest terms. Checking, $16/40 < 17/40 < 18/40$, so $x_2$ lies
      strictly between $x_0$ and $x_1$ as it must. The construction never
      terminates and never repeats, which is the whole point: halving is
      available because $1 + 1$ is positive, hence nonzero, hence invertible by
      (F2), so *every* ordered field is densely ordered and none is discretely
      ordered. That is the property $\mathbb{Q}$ loses relative to
      $\mathbb{N}$ and $\mathbb{Z}$, and it is lost not because of anything
      particular to $\mathbb{Q}$ but as soon as division becomes total.
      Answering $9/20$ stops after one midpoint; answering $19/40$ averages
      $x_1$ with $y$ rather than with $x_0$.
    expects: "17/40"
    rubric:
      - >
        Computes $x_1 = 9/20$ first, and takes the second midpoint between
        $x_0$ and $x_1$ rather than between $x_1$ and $y$.
      - >
        Reports $17/40$ in lowest terms, and verifies it lies strictly between
        the two endpoints it was built from.
      - >
        Attributes the availability of halving to invertibility of $1 + 1$,
        which needs $1 + 1 \ne 0$ and hence the order.
    targets:
      - foundations.number-systems.q-ordered-field
    exercises:
      - foundations.number-systems.rationals-operations
      - foundations.number-systems.def-ordered-field
    connects: []
    tags: []

  - id: number-systems-q-ordered-field-02
    kind: work
    difficulty: standard
    statement: >
      Axiom (F2) is what the construction of $\mathbb{Q}$ was for: it makes
      $a x = b$ uniquely solvable whenever $a \ne 0$. Solve
      $[(3, 4)] \cdot x = [(2, 7)]$ in $\mathbb{Q}$, giving $x$ in lowest terms
      as $a/b$.
    answer: >
      $8/21$. The class $[(3, 4)]$ is $3/4$ and is nonzero, since its first
      coordinate is nonzero, so by (F2) it has an inverse — and the
      construction hands it over explicitly by swapping coordinates:
      $[(3, 4)]^{-1} = [(4, 3)]$. Multiplying both sides on the left by that
      inverse gives $x = [(4, 3)] \cdot [(2, 7)] = [(4 \cdot 2,\, 3 \cdot 7)]
      = [(8, 21)]$, and $\gcd(8, 21) = 1$ with positive denominator, so
      $x = 8/21$. The check is immediate: $(3/4) \cdot (8/21) = 24/84 = 2/7$.
      Uniqueness comes free from the same inverse — if $a x = a x'$ with
      $a \ne 0$, multiply by $a^{-1}$ — and this is exactly what $\mathbb{Z}$
      could not deliver, since $3 x = 2$ has no integer solution. Answering
      $21/8$ divides the wrong way round, computing $(3/4)/(2/7)$; answering
      $6/28$ multiplies instead of dividing, forming
      $[(3,4)] \cdot [(2,7)]$ rather than solving for $x$.
    expects: "8/21"
    rubric:
      - >
        Forms the inverse by swapping coordinates, $[(3, 4)]^{-1} = [(4, 3)]$,
        and notes that this is legal exactly because $3 \ne 0$.
      - >
        Multiplies rather than divides coordinatewise, reaching $[(8, 21)]$,
        and reduces to lowest terms.
      - >
        Verifies the answer by substituting back.
    targets:
      - foundations.number-systems.q-ordered-field
    exercises:
      - foundations.number-systems.rationals-operations
    connects: []
    tags: []

  # --- the gap in ℚ -----------------------------------------------------------

  - id: number-systems-q-not-complete-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $C = \{q \in \mathbb{Q} : q > 0$ and $q^{2} < 3\}$. Prove that $C$ is
      nonempty and bounded above in $\mathbb{Q}$ but has no least upper bound
      in $\mathbb{Q}$. Prove in full the arithmetic fact your argument needs
      about $3$.
    answer: >
      $C$ is nonempty since $1 \in C$, and bounded above since $q \ge 2$ gives
      $q^{2} \ge 4 > 3$, so every element of $C$ is below $2$. Suppose
      $b \in \mathbb{Q}$ were a least upper bound. Then $b \ge 1$ because
      $1 \in C$, so $b > 0$. No rational squares to $3$: if $a / c$ were one,
      in lowest terms, then $a^{2} = 3 c^{2}$, so $3 \mid a^{2}$. Now
      $3 \mid a^{2}$ forces $3 \mid a$, and this needs cases rather than the
      parity shortcut — writing $a = 3k$, $a = 3k + 1$ or $a = 3k + 2$ gives
      $a^{2} = 9k^{2}$, $9k^{2} + 6k + 1$ or $9k^{2} + 12k + 4$, whose
      remainders on division by $3$ are $0$, $1$ and $1$, so only $a = 3k$
      leaves $a^{2}$ divisible by $3$. Then $9 k^{2} = 3 c^{2}$ gives
      $c^{2} = 3 k^{2}$, so by the same step $3 \mid c$, contradicting lowest
      terms. Hence $b^{2} < 3$ or $b^{2} > 3$. Put
      $b' = (3 b + 3)/(b + 3)$, a positive rational since $b > 0$, and compute
      $b' - b = (3 - b^{2})/(b + 3)$ and
      $(b')^{2} - 3 = 6 (b^{2} - 3)/(b + 3)^{2}$. If $b^{2} < 3$ then
      $b' > b$ and $(b')^{2} < 3$, so $b' \in C$ and $b$ was not even an upper
      bound. If $b^{2} > 3$ then $b' < b$ and $(b')^{2} > 3$; and $b'$ is still
      an upper bound, since $q \in C$ and $b' > 0$ with
      $q^{2} < 3 < (b')^{2}$ force $q < b'$. So $b$ was not the least upper
      bound. Either way a contradiction. Nothing here is special to $3$: the
      defect is in the order of $\mathbb{Q}$, not in its arithmetic, and no
      consequence of the ordered field axioms can exclude it, because
      $\mathbb{Q}$ satisfies them all.
    rubric:
      - >
        Proves $3 \mid a^{2} \implies 3 \mid a$ by cases on the remainder of
        $a$, rather than asserting it by analogy with parity.
      - >
        Splits on $b^{2} < 3$ and $b^{2} > 3$ only after ruling out $b^{2} = 3$,
        so the two cases are exhaustive.
      - >
        Verifies both identities for $b' = (3b + 3)/(b + 3)$, and uses the sign
        of $b + 3$ to read off the direction of each inequality.
      - >
        In the case $b^{2} > 3$, argues that $b'$ is still an upper bound —
        from $q^{2} < 3 < (b')^{2}$ with both positive — rather than assuming
        it.
    targets:
      - foundations.number-systems.q-not-complete
    exercises:
      - foundations.number-systems.q-ordered-field
      - foundations.relations.def-lub-poset
      - foundations.proof.ex-sqrt-two-irrational
    connects: []
    tags: []

  - id: number-systems-q-not-complete-02
    kind: work
    difficulty: standard
    statement: >
      In the proof that $A = \{q \in \mathbb{Q} : q > 0$ and $q^{2} < 2\}$ has
      no supremum, a candidate $b$ is replaced by
      $b' = (2 b + 2)/(b + 2)$. Take $b = 5/4$ and compute $b'$, giving it in
      lowest terms as $a/b$.
    answer: >
      $18/13$. Substituting, $b' = (2 \cdot 5/4 + 2)/(5/4 + 2)
      = (5/2 + 2)/(13/4) = (9/2)/(13/4) = (9/2) \cdot (4/13) = 36/26 = 18/13$.
      The candidate $b = 5/4$ has $b^{2} = 25/16 < 2$, so it is the first case
      of the proof, and the two identities predict what happens:
      $b' - b = (2 - b^{2})/(b + 2)$ is positive, and indeed
      $18/13 \approx 1.3846$ exceeds $5/4 = 1.25$; while
      $(b')^{2} - 2 = 2(b^{2} - 2)/(b + 2)^{2}$ is negative, and indeed
      $(18/13)^{2} = 324/169$ is below $2 = 338/169$. So $b'$ is a member of
      $A$ strictly larger than $b$, which shows $b$ was not even an upper
      bound, let alone the least one. Feeding $18/13$ back in produces a larger
      member again, and the process never arrives: the sequence climbs towards
      a number that is not there. Answering $12/13$ mishandles the compound
      fraction; answering $5/4$ reports the input.
    expects: "18/13"
    rubric:
      - >
        Evaluates the compound fraction correctly, dividing by $13/4$ rather
        than multiplying.
      - >
        Reduces $36/26$ to $18/13$.
      - >
        Identifies which case of the proof $b = 5/4$ falls into by comparing
        $b^{2}$ with $2$, and checks $b' > b$ against the identity.
    targets:
      - foundations.number-systems.q-not-complete
    exercises:
      - foundations.number-systems.q-ordered-field
    connects: []
    tags: []

  # --- the two constructions of ℝ ---------------------------------------------

  - id: number-systems-dedekind-cuts-01
    kind: decide
    difficulty: demanding
    statement: >
      A cut is a set $\alpha \subseteq \mathbb{Q}$ that is (i) neither empty
      nor all of $\mathbb{Q}$, (ii) closed downwards, and (iii) without a
      greatest element. Which of these sets of rationals is a cut?
    answer: >
      $\{p \in \mathbb{Q} : p^{3} < 8\}$ is a cut. Cubing is strictly
      increasing on $\mathbb{Q}$, so the condition $p^{3} < 8$ is equivalent to
      $p < 2$, and the set is $2^{\ast}$ in disguise: nonempty because
      $0$ belongs, not all of $\mathbb{Q}$ because $3$ does not, downward
      closed because $q < p < 2$ gives $q < 2$, and without a greatest element
      because any $p < 2$ is beaten by $(p + 2)/2$. The second set fails (ii)
      badly, and the failure is instructive: $p^{2} < 9$ excludes $-4$ while
      including $0$, so a member has a smaller non-member below it, and the set
      is an interval rather than an initial segment — squaring is not monotone
      across zero. The third fails (iii): $\{p \le 3\}$ has the greatest
      element $3$. That clause is not decoration either. Without it the
      rational $3$ would be represented by two different sets, $\{p < 3\}$ and
      $\{p \le 3\}$, and the map from $\mathbb{Q}$ into the reals would stop
      being injective.
    choices:
      - text: >
          $\{p \in \mathbb{Q} : p^{3} < 8\}$
        correct: true
        feedback: >
          Right: cubing is strictly increasing, so this is exactly
          $\{p : p < 2\}$, and all three clauses hold.
      - text: >
          $\{p \in \mathbb{Q} : p^{2} < 9\}$
        feedback: >
          Downward closure fails: $0$ is in the set and $-4$ is below it but
          not in, because squaring is not monotone across zero.
      - text: >
          $\{p \in \mathbb{Q} : p \le 3\}$
        feedback: >
          Downward closed and proper, but it has a greatest element, $3$, so
          clause (iii) fails — and that clause is what keeps the embedding of
          $\mathbb{Q}$ injective.
    rubric:
      - >
        Checks all three clauses on the chosen set, not only nonemptiness.
      - >
        Locates the failure of the squaring set in downward closure, with a
        specific witness below zero.
      - >
        Locates the failure of $\{p \le 3\}$ in clause (iii), and says what
        goes wrong without that clause.
    targets:
      - foundations.number-systems.dedekind-cuts
    exercises:
      - foundations.relations.def-lub-poset
      - foundations.number-systems.q-ordered-field
    connects: []
    tags: []

  - id: number-systems-dedekind-cuts-02
    kind: work
    difficulty: standard
    statement: >
      Addition of cuts is defined by
      $\alpha + \beta = \{p + q : p \in \alpha,\, q \in \beta\}$, and a
      rational $r$ embeds as $r^{\ast} = \{p \in \mathbb{Q} : p < r\}$. The sum
      $2^{\ast} + 3^{\ast}$ is $r^{\ast}$ for which rational $r$?
    answer: >
      $r = 5$. Every element of the sum has the form $p + q$ with $p < 2$ and
      $q < 3$, so $p + q < 5$ and the sum is contained in $5^{\ast}$.
      Conversely, if $s < 5$ put $\varepsilon = 5 - s > 0$ and take
      $p = 2 - \varepsilon/2$ and $q = 3 - \varepsilon/2$; then $p < 2$,
      $q < 3$, and $p + q = 5 - \varepsilon = s$, so $s$ lies in the sum. The
      two inclusions give $2^{\ast} + 3^{\ast} = 5^{\ast}$. Two things are
      worth noticing. The definition never mentions a supremum or a limit — the
      sum of two sets of rationals is again a set of rationals, and the
      verification is pure set containment — and the second inclusion is where
      the work is, because it needs the halving trick to split the slack, which
      is exactly the density of $\mathbb{Q}$ doing service. This also shows the
      embedding $r \mapsto r^{\ast}$ preserves sums, so $\mathbb{Q}$ sits
      inside the cuts as a sub-ordered-field rather than merely as a subset.
    expects: "5"
    rubric:
      - >
        Argues both inclusions, not just that every $p + q$ is below $5$.
      - >
        For the reverse inclusion, exhibits explicit $p$ and $q$ splitting the
        slack $5 - s$, rather than appealing to a limit.
      - >
        Concludes that the embedding of $\mathbb{Q}$ preserves addition.
    targets:
      - foundations.number-systems.dedekind-cuts
    exercises:
      - foundations.number-systems.q-ordered-field
    connects: []
    tags: []

  - id: number-systems-cauchy-reals-01
    kind: justify
    difficulty: demanding
    statement: >
      In the Cauchy construction, $[(a_n)] \cdot [(b_n)] = [(a_n b_n)]$ is only
      a definition if the termwise product of two Cauchy sequences of rationals
      is Cauchy. Prove that it is, and identify the step that has no analogue
      in the proof for sums.
    answer: >
      First, every Cauchy sequence is bounded. Apply the Cauchy condition with
      $\varepsilon = 1$ to get $N$ with $|a_m - a_n| < 1$ for $m, n \ge N$; in
      particular $|a_n| < |a_N| + 1$ for all $n \ge N$, and the finitely many
      earlier terms are bounded because a finite set of rationals has a
      largest absolute value. So there is a rational $M_a > 0$ with
      $|a_n| \le M_a$ for every $n$, and likewise $M_b$ for $(b_n)$. Now split
      the difference by adding and subtracting a mixed term:
      $a_m b_m - a_n b_n = (a_m - a_n) b_m + a_n (b_m - b_n)$, whence
      $|a_m b_m - a_n b_n| \le M_b |a_m - a_n| + M_a |b_m - b_n|$. Given a
      rational $\varepsilon > 0$, set $M = M_a + M_b$, which is positive, and
      choose $N_1$ making $|a_m - a_n| < \varepsilon / (2 M)$ beyond it and
      $N_2$ doing the same for $(b_n)$; for $m, n \ge \max(N_1, N_2)$ the bound
      above is below $M_b \varepsilon/(2M) + M_a \varepsilon/(2M) \le
      \varepsilon$. So the product is Cauchy. The step with no analogue for
      sums is boundedness. For sums, $|(a_m + b_m) - (a_n + b_n)| \le
      |a_m - a_n| + |b_m - b_n|$ directly, with no factors in front; for
      products the differences are multiplied by terms of the *other* sequence,
      and unless those are known to stay bounded there is no way to convert a
      small difference into a small difference of products. The same
      boundedness is what makes the class of a product independent of the
      representatives chosen, by exactly the same estimate.
    rubric:
      - >
        Proves boundedness of a Cauchy sequence first, using $\varepsilon = 1$
        and handling the finitely many initial terms separately.
      - >
        Uses the add-and-subtract identity
        $a_m b_m - a_n b_n = (a_m - a_n) b_m + a_n (b_m - b_n)$ rather than
        multiplying the two Cauchy estimates together.
      - >
        Chooses the tolerance as $\varepsilon$ divided by a bound built from
        $M_a$ and $M_b$, with a positive denominator.
      - >
        Names boundedness as the ingredient the additive case does not need,
        and says why: the additive estimate carries no coefficients.
    targets:
      - foundations.number-systems.cauchy-reals
    exercises:
      - foundations.functions.def-sequence
      - foundations.number-systems.q-ordered-field
    connects: []
    tags: []

  - id: number-systems-cauchy-reals-02
    kind: work
    difficulty: standard
    statement: >
      Let $a_n = 2 + 1/n$ and $b_n = 3 - 1/n$ for $n \ge 1$, both sequences of
      rationals. Their product class $[(a_n)] \cdot [(b_n)] = [(a_n b_n)]$ is
      the class of a constant sequence. Which constant?
    answer: >
      $6$. Expand termwise: $a_n b_n = (2 + 1/n)(3 - 1/n)
      = 6 - 2/n + 3/n - 1/n^{2} = 6 + 1/n - 1/n^{2}$. To decide which class
      this is, compare with the constant sequence $c_n = 6$ using the
      definition of $\sim$: $|a_n b_n - c_n| = |1/n - 1/n^{2}| \le 1/n$, and
      for any rational $\varepsilon > 0$ the Archimedean choice of $N$ with
      $1/N < \varepsilon$ makes this smaller than $\varepsilon$ for all
      $n \ge N$. So $(a_n b_n) \sim (6, 6, 6, \ldots)$ and the product class is
      the real number $6$. Notice that no limits were taken and no completed
      infinity was invoked — "equals $6$" here means precisely that the two
      sequences eventually stay within any prescribed rational tolerance of
      each other, which is the definition of the equivalence relation.
      Answering $5$ multiplies the limits as $2 \cdot 3$ but then subtracts a
      stray term; answering $6 - 1/n$ reports a sequence rather than the
      constant its class contains.
    expects: "6"
    rubric:
      - >
        Expands the product termwise and keeps both correction terms, obtaining
        $6 + 1/n - 1/n^{2}$.
      - >
        Decides equality of classes by the definition of $\sim$ — the
        difference eventually below every positive rational — not by asserting
        a limit.
    targets:
      - foundations.number-systems.cauchy-reals
    exercises:
      - foundations.functions.def-sequence
    connects: []
    tags: []

  # --- ℝ exists ---------------------------------------------------------------

  - id: number-systems-r-existence-01
    kind: justify
    difficulty: demanding
    statement: >
      A complete ordered field is one in which every nonempty subset bounded
      above has a least upper bound. Prove that in such a field every nonempty
      subset bounded *below* has a greatest lower bound, so that completeness
      as stated already delivers both halves.
    answer: >
      Let $F$ be complete and let $S \subseteq F$ be nonempty and bounded
      below. Let $L = \{c \in F : c \le s$ for every $s \in S\}$ be the set of
      lower bounds of $S$. Then $L$ is nonempty, precisely because $S$ is
      bounded below. And $L$ is bounded above: pick any $s_0 \in S$, which
      exists since $S$ is nonempty; every $c \in L$ satisfies $c \le s_0$, so
      $s_0$ is an upper bound for $L$. Completeness therefore supplies
      $g = \sup L$. Claim: $g = \inf S$. First, $g$ is a lower bound of $S$.
      Let $s \in S$. Every $c \in L$ satisfies $c \le s$, so $s$ is an upper
      bound of $L$, and $g$, being the *least* upper bound, satisfies
      $g \le s$. As $s$ was arbitrary, $g \in L$. Second, $g$ is the greatest
      lower bound: any lower bound $c$ of $S$ lies in $L$, and $g$ is an upper
      bound of $L$, so $c \le g$. Hence $g$ is a lower bound at least as large
      as every other, which is the definition of the infimum. The argument is
      worth its length because of what it does not need: no construction, no
      sequences, no cuts — only the least-upper-bound property applied to the
      right set. The move of applying completeness to the set of bounds rather
      than to $S$ itself is the reusable idea, and it recurs whenever an
      extremum is needed on the wrong side of an inequality.
    rubric:
      - >
        Applies completeness to the set of lower bounds $L$, not to $S$, and
        checks that $L$ is nonempty and bounded above using both hypotheses on
        $S$.
      - >
        Proves that $\sup L$ is a lower bound of $S$ by observing that each
        $s \in S$ is an upper bound of $L$.
      - >
        Proves maximality among lower bounds from $\sup L$ being an upper bound
        of $L$.
      - >
        Keeps the two roles of "least upper bound" straight — least when
        showing $g \le s$, upper when showing $c \le g$.
    targets:
      - foundations.number-systems.r-existence
    exercises:
      - foundations.relations.def-lub-poset
      - foundations.relations.def-bounds-poset
    connects: []
    tags: []

  - id: number-systems-r-existence-02
    kind: decide
    difficulty: standard
    statement: >
      Which of these is a complete ordered field — an ordered field in which
      every nonempty subset bounded above has a least upper bound in it?
    answer: >
      $\mathbb{R}$, and the theorem is that it exists at all: both the cut
      construction and the Cauchy construction produce one from $\mathbb{Q}$ by
      explicit means, so the least-upper-bound property is a theorem about a
      built object rather than an article of faith. $\mathbb{Q}$ is an ordered
      field and fails completeness — the set of positive rationals with square
      below $2$ is nonempty and bounded above with no rational supremum, which
      is the whole content of the previous node. $\mathbb{Z}$ fails for the
      opposite reason and is the more interesting distractor: it actually
      *satisfies* the least-upper-bound property, since a nonempty set of
      integers bounded above has a greatest element, which is then its
      supremum; what it fails is (F2), because $2 x = 1$ has no solution. So
      "complete" and "field" are independent conditions, and only the
      conjunction pins $\mathbb{R}$ down — which the uniqueness theorem then
      shows it does, up to a unique isomorphism.
    choices:
      - text: >
          $\mathbb{Q}$
        feedback: >
          An ordered field, but not complete: $\{q > 0 : q^{2} < 2\}$ is
          nonempty and bounded above and has no least upper bound in
          $\mathbb{Q}$.
      - text: >
          $\mathbb{R}$
        correct: true
        feedback: >
          Right, and existence is exactly what the theorem provides — the cut
          and Cauchy constructions each build one out of $\mathbb{Q}$.
      - text: >
          $\mathbb{Z}$
        feedback: >
          $\mathbb{Z}$ does satisfy the least-upper-bound property — a bounded
          nonempty set of integers has a greatest element — but it is not a
          field, since $2x = 1$ has no solution.
    rubric:
      - >
        Rejects $\mathbb{Q}$ by naming a specific bounded set with no rational
        supremum.
      - >
        Rejects $\mathbb{Z}$ on the field axiom (F2), and does not claim it
        fails completeness.
    targets:
      - foundations.number-systems.r-existence
    exercises:
      - foundations.number-systems.q-ordered-field
      - foundations.relations.def-lub-poset
    connects: []
    tags: []

  - id: number-systems-r-existence-03
    kind: work
    difficulty: routine
    statement: >
      Let $S = \{3 - 1/n : n \in \mathbb{N},\, n \ge 1\} \subseteq \mathbb{R}$.
      Completeness guarantees $\sup S$ exists. What is it?
    answer: >
      $3$. It is an upper bound, since $1/n > 0$ gives $3 - 1/n < 3$ for every
      $n \ge 1$. It is the least one: if $t < 3$ then $3 - t > 0$, and some
      $n \ge 1$ has $1/n < 3 - t$, whence $3 - 1/n > t$ and $t$ fails to be an
      upper bound. So no number below $3$ bounds $S$, and $\sup S = 3$. What
      makes the example worth stating is that $3 \notin S$: no $n$ gives
      $3 - 1/n = 3$. A supremum need not be attained, and that is the entire
      difference between a supremum and a maximum — the set has no greatest
      element at all, yet completeness still hands over a least upper bound.
      That is what an ordered field with gaps cannot promise, and it is the
      single property distinguishing $\mathbb{R}$ from $\mathbb{Q}$.
      Answering $2$ reports the smallest element, $3 - 1/1$; answering "no
      supremum" confuses the absence of a maximum with the absence of a least
      upper bound.
    expects: "3"
    rubric:
      - >
        Shows $3$ is an upper bound and that nothing smaller is, rather than
        only the first half.
      - >
        Notes that $\sup S \notin S$, so the supremum is not a maximum.
    targets:
      - foundations.number-systems.r-existence
    exercises: []
    connects: []
    tags: []

  # --- ℝ is unique ------------------------------------------------------------

  - id: number-systems-r-uniqueness-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $F$ and $F'$ be complete ordered fields and let $f : F \to F'$ be a
      field isomorphism — a bijection preserving $+$ and $\cdot$, with no
      hypothesis about the orders. Prove that $f$ automatically preserves
      order.
    answer: >
      The key is that in a complete ordered field the nonnegative elements are
      exactly the squares. One inclusion is an ordered field fact: every square
      is nonnegative, by (O2) for nonnegative $x$ and by
      $(-x)(-x) = x^{2}$ for negative $x$. The other needs completeness: given
      $y \ge 0$, the set $\{t \ge 0 : t^{2} \le y\}$ is nonempty and bounded
      above, its supremum $s$ exists, and the two-sided squeeze that produced
      $\sqrt{2}$ shows $s^{2} = y$. So "$y \ge 0$" is equivalent to
      "$y = t^{2}$ for some $t$" in both fields — and the right-hand phrasing
      mentions only multiplication. Now let $x \le y$ in $F$. Then
      $y - x \ge 0$, so $y - x = t^{2}$ for some $t \in F$. Applying $f$, which
      is additive and multiplicative, gives
      $f(y) - f(x) = f(y - x) = f(t^{2}) = f(t)^{2} \ge 0$ in $F'$, since
      squares are nonnegative there too. Hence $f(x) \le f(y)$. The same
      argument run on $f^{-1}$, also an isomorphism, gives the converse, so $f$
      reflects order as well as preserving it. The moral is that the order on a
      complete ordered field is not extra data at all: it is definable from the
      arithmetic, so no isomorphism has any freedom to disturb it. That is what
      makes "the" real numbers legitimate, and it is exactly what fails for
      $\mathbb{C}$, where the nonzero squares are everything.
    rubric:
      - >
        Establishes that the nonnegative elements are exactly the squares, and
        says which half needs completeness.
      - >
        Reduces order to a statement about a difference, $x \le y$ if and only
        if $y - x \ge 0$, so additivity of $f$ can be used.
      - >
        Uses multiplicativity to get $f(t^{2}) = f(t)^{2}$, and the ordered
        field fact in $F'$ to conclude nonnegativity there.
      - >
        Notes that $f^{-1}$ is an isomorphism too, so the implication runs both
        ways.
    targets:
      - foundations.number-systems.r-uniqueness
    exercises:
      - foundations.number-systems.r-existence
      - foundations.number-systems.def-ordered-field
    connects: []
    tags: []

  - id: number-systems-r-uniqueness-02
    kind: work
    difficulty: standard
    statement: >
      How many field isomorphisms are there from $\mathbb{R}$ to itself?
    answer: >
      $1$ — the identity, and nothing else. The uniqueness theorem says that
      between any two complete ordered fields there is *exactly one* field
      isomorphism; taking both to be $\mathbb{R}$, there is exactly one
      isomorphism $\mathbb{R} \to \mathbb{R}$, and since the identity is one,
      it is the only one. The forcing can be traced directly: $f(1) = 1$, so
      additivity fixes $f$ on $\mathbb{N}$ and then on $\mathbb{Z}$;
      multiplicativity fixes it on $\mathbb{Q}$; and every real is the
      supremum of the rationals below it, with order preserved for free because
      the nonnegatives are the squares, so $f$ is determined everywhere. There
      is no room anywhere for a choice. The contrast with $\mathbb{C}$ is
      sharp: $\mathbb{C}$ has the conjugation automorphism besides the
      identity, and in fact wildly many more, precisely because it carries no
      compatible order to pin things down. Answering $2$ imports conjugation
      from the complex case, where it belongs; answering "infinitely many"
      imports the situation for fields with no definable order.
    expects: "1"
    rubric:
      - >
        Cites the uniqueness theorem with both fields equal to $\mathbb{R}$,
        and observes the identity is one such map.
      - >
        Explains the forcing: $f(1) = 1$, then $\mathbb{Q}$, then suprema —
        with order preservation coming free rather than assumed.
    targets:
      - foundations.number-systems.r-uniqueness
    exercises: []
    connects: []
    tags: []

  # --- the Archimedean property -----------------------------------------------

  - id: number-systems-archimedean-01
    kind: work
    difficulty: demanding
    statement: >
      The Archimedean property in its working form says: for real $x > 0$ and
      any real $y$ there is $n \in \mathbb{N}$ with $n x > y$. With
      $x = 3/7$ and $y = 22/5$, what is the smallest such $n$?
    answer: >
      $11$. The condition $n \cdot 3/7 > 22/5$ clears to $15 n > 154$ after
      multiplying both sides by the positive number $35$, so
      $n > 154/15 = 10.2\overline{6}$ and the least natural number satisfying
      it is $n = 11$. Checking the boundary from both sides confirms it:
      $15 \cdot 11 = 165 > 154$, while $15 \cdot 10 = 150 < 154$, so $n = 10$
      fails. Equivalently $11 \cdot 3/7 = 33/7 \approx 4.714$ exceeds
      $22/5 = 4.4$ while $30/7 \approx 4.286$ does not. Two remarks. Clearing
      the denominators by a *positive* factor is what keeps the inequality
      pointing the same way — the ordered field consequence that multiplying by
      a positive element preserves inequalities. And the existence of some such
      $n$, which is all the theorem claims, is not an arithmetic fact but a
      consequence of completeness: were $\mathbb{N}$ bounded above in
      $\mathbb{R}$ it would have a supremum $s$, and then $m > s - 1$ for some
      natural $m$ would give $m + 1 > s$ with $m + 1$ natural. Answering $10$
      takes the floor of $154/15$ rather than the next integer above it.
    expects: "11"
    rubric:
      - >
        Clears denominators by a positive factor, so the inequality direction
        is preserved, reaching $15n > 154$.
      - >
        Takes the least integer *strictly* above $154/15$, and checks that
        $n = 10$ fails.
      - >
        Attributes the existence of such an $n$ to completeness rather than to
        the ordered field axioms.
    targets:
      - foundations.number-systems.archimedean
    exercises: []
    connects: []
    tags: []

  - id: number-systems-archimedean-02
    kind: decide
    difficulty: standard
    statement: >
      The rational functions with real coefficients, ordered by their behaviour
      for large arguments, form an ordered field in which the element $x$
      exceeds every constant and $1/x$ is positive but smaller than every
      $1/n$. What does that example establish?
    answer: >
      That the Archimedean property does not follow from the ordered field
      axioms alone. The field of rational functions satisfies every one of
      (F1), (F2), (F3), (O1) and (O2) — it is a field, and the ordering by
      eventual behaviour is total and compatible with the operations — yet it
      contains an element larger than every natural number, so no $n$ has
      $n > x$. Hence the Archimedean property is genuinely additional
      information, and the proof of it for $\mathbb{R}$ must use something
      beyond the axioms, which it does: it uses completeness, in the form of a
      supremum for $\mathbb{N}$ that then fails to be an upper bound. The
      example does not say $\mathbb{R}$ is non-Archimedean, and it does not
      exhibit an ordered field without a copy of $\mathbb{Q}$; on the contrary,
      every ordered field contains $\mathbb{Q}$, this one included — the
      constants sit inside it. What it exhibits is an ordered field where
      $\mathbb{Q}$ sits *bounded*, with elements beyond all of it, which is
      precisely the possibility completeness rules out.
    choices:
      - text: >
          That the Archimedean property does not follow from the ordered field
          axioms alone, so proving it for $\mathbb{R}$ must use completeness.
        correct: true
        feedback: >
          Exactly — the example satisfies every axiom and still has an
          infinitely large element, so something beyond the axioms is needed.
      - text: >
          That there is an ordered field containing no copy of $\mathbb{Q}$.
        feedback: >
          Every ordered field contains $\mathbb{Q}$, this one included: the
          constant functions form that copy. What is unusual is that
          $\mathbb{Q}$ sits bounded inside it.
      - text: >
          That $\mathbb{R}$ itself fails to be Archimedean.
        feedback: >
          A different field failing a property says nothing about $\mathbb{R}$,
          which is Archimedean — and provably so, from completeness.
    rubric:
      - >
        Identifies the example as an independence result about the axioms, not
        a claim about $\mathbb{R}$.
      - >
        Names completeness as the extra ingredient the proof for $\mathbb{R}$
        uses.
    targets:
      - foundations.number-systems.archimedean
    exercises:
      - foundations.number-systems.def-ordered-field
    connects: []
    tags: []

  # --- ℚ is dense in ℝ --------------------------------------------------------

  - id: number-systems-q-dense-01
    kind: work
    difficulty: demanding
    statement: >
      Run the density proof on $x = 5/7$ and $y = 8/11$. Take $n$ to be the
      smallest natural number with $1/n < y - x$, let $m$ be the least integer
      strictly greater than $n x$, and report the rational $m/n$ in lowest
      terms as $a/b$.
    answer: >
      $28/39$. First the gap: $y - x = 8/11 - 5/7 = (56 - 55)/77 = 1/77$, so
      $1/n < 1/77$ requires $n > 77$ and the smallest choice is $n = 78$. Next
      the integer: $n x = 78 \cdot 5/7 = 390/7 = 55 + 5/7$, whose least strict
      upper integer is $m = 56$. The theorem's rational is
      $m/n = 56/78$, and $\gcd(56, 78) = 2$, so in lowest terms it is
      $28/39$. Verify the conclusion rather than trusting it:
      $28/39 \approx 0.71795$, while $5/7 \approx 0.71429$ and
      $8/11 \approx 0.72727$, so $x < m/n < y$ as claimed. The proof's two
      inequalities are visible here. Minimality of $m$ gives $m - 1 \le n x$,
      hence $m \le n x + 1$; and $n(y - x) > 1$ makes $n x + 1 < n y$, so
      $n x < m < n y$, and dividing by the positive $n$ gives the result —
      the interval from $n x$ to $n y$ has been stretched past length $1$ so
      that it cannot step over every integer. Answering $56/78$ stops before
      lowest terms; answering $55/78$ takes the greatest integer below $n x$
      instead of the least above it, and $55/78 \approx 0.7051$ is below $x$.
    expects: "28/39"
    rubric:
      - >
        Computes $y - x = 1/77$ and takes the smallest $n$ with $1/n$ strictly
        below it, namely $78$ rather than $77$.
      - >
        Takes $m$ to be the least integer *strictly above* $n x$, so $m = 56$,
        not the floor $55$.
      - >
        Reduces $56/78$ to lowest terms and checks the result really lies
        strictly between $x$ and $y$.
    targets:
      - foundations.number-systems.q-dense
    exercises:
      - foundations.number-systems.archimedean
    connects: []
    tags: []

  - id: number-systems-q-dense-02
    kind: decide
    difficulty: standard
    statement: >
      The irrationals are dense in $\mathbb{R}$ as well. Which argument
      establishes it?
    answer: >
      Shift the interval by $\sqrt{2}$, apply the density of $\mathbb{Q}$, and
      shift back. Given $x < y$, the reals $x - \sqrt{2}$ and $y - \sqrt{2}$
      still satisfy $x - \sqrt{2} < y - \sqrt{2}$, so there is a rational $q$
      with $x - \sqrt{2} < q < y - \sqrt{2}$; adding $\sqrt{2}$ throughout —
      legal by (O1), which preserves the order under addition — gives
      $x < q + \sqrt{2} < y$. And $q + \sqrt{2}$ is irrational: were it a
      rational $r$, then $\sqrt{2} = r - q$ would be a difference of rationals
      and hence rational, contradicting the irrationality of $\sqrt{2}$. So
      every nonempty open interval contains an irrational as well as a
      rational. The cardinality argument is not a substitute: knowing there are
      more irrationals than rationals says nothing about any particular
      interval, and a set can be uncountable while missing an interval
      entirely. Nor does the rational case alone suffice; it is the shift that
      converts it.
    choices:
      - text: >
          Apply the theorem to $x - \sqrt{2} < y - \sqrt{2}$, get a rational
          $q$ there, and note $q + \sqrt{2}$ lies in $(x, y)$ and is
          irrational.
        correct: true
        feedback: >
          Right, and the irrationality of $q + \sqrt{2}$ needs its own line:
          otherwise $\sqrt{2}$ would be a difference of two rationals.
      - text: >
          Because there are strictly more irrationals than rationals, every
          interval must contain one.
        feedback: >
          Cardinality gives no interval-by-interval information — an
          uncountable set can miss an interval entirely, so this proves
          nothing about $(x, y)$.
      - text: >
          Because every nonempty open interval contains a rational.
        feedback: >
          That is the theorem already proved, and it says nothing about
          irrationals. The shift by $\sqrt{2}$ is what converts it.
    rubric:
      - >
        Translates the interval, applies the rational case, and translates
        back, citing (O1) for the shift.
      - >
        Justifies that the result is irrational, rather than asserting it.
    targets:
      - foundations.number-systems.q-dense
    exercises: []
    connects: []
    tags: []

  # --- √2 exists in ℝ ---------------------------------------------------------

  - id: number-systems-ex-sqrt-two-in-r-01
    kind: work
    difficulty: demanding
    statement: >
      In the proof that $s = \sup \{x \in \mathbb{R} : x > 0$ and
      $x^{2} < 2\}$ satisfies $s^{2} = 2$, the case $s^{2} > 2$ is closed by
      choosing $n$ with $1/n < (s^{2} - 2)/(2 s)$ and showing $s - 1/n$ is a
      smaller upper bound. For the candidate $s = 8/5$, what is the smallest
      $n$ that condition allows?
    answer: >
      $6$. Compute the threshold: $s^{2} = 64/25$, so
      $s^{2} - 2 = 64/25 - 50/25 = 14/25$, and $2 s = 16/5$, giving
      $(s^{2} - 2)/(2 s) = (14/25) \cdot (5/16) = 70/400 = 7/40$. The
      requirement $1/n < 7/40$ means $n > 40/7 = 5.714\ldots$, so the smallest
      natural number allowed is $n = 6$. Check that it does the job:
      $s - 1/6 = 8/5 - 1/6 = 43/30 \approx 1.4333$, and
      $(43/30)^{2} = 1849/900 \approx 2.054$, comfortably above $2$. So every
      $x$ in the set has $x^{2} < 2 < (s - 1/n)^{2}$ with both numbers
      positive, forcing $x < s - 1/n$; that makes $s - 1/6$ an upper bound
      strictly smaller than $s$, so $s = 8/5$ was not the supremum. The
      algebra behind the threshold is
      $(s - 1/n)^{2} = s^{2} - 2s/n + 1/n^{2} > s^{2} - 2 s / n$, which
      exceeds $2$ exactly when $2 s / n < s^{2} - 2$. Answering $5$ takes
      $n \ge 40/7$ rather than strictly greater and lands on a value where
      $1/n = 0.2$ exceeds the threshold; answering $40/7$ reports the threshold
      rather than the integer.
    expects: "6"
    rubric:
      - >
        Evaluates $(s^{2} - 2)/(2s)$ exactly as $7/40$, not as a truncated
        decimal.
      - >
        Takes the least natural number strictly exceeding $40/7$, so $n = 6$
        and not $5$.
      - >
        Confirms $(s - 1/n)^{2} > 2$ for the chosen $n$, so the candidate
        really is refuted.
    targets:
      - foundations.number-systems.ex-sqrt-two-in-r
    exercises:
      - foundations.number-systems.archimedean
    connects: []
    tags: []

  - id: number-systems-ex-sqrt-two-in-r-02
    kind: decide
    difficulty: standard
    statement: >
      What is the characteristic feature of this existence proof — the thing it
      does *not* do?
    answer: >
      It never writes $\sqrt{2}$ down. The number is produced as the supremum
      of a set, an object completeness guarantees exists without saying what it
      looks like, and only afterwards is it shown to have the property wanted,
      by ruling out $s^{2} < 2$ and $s^{2} > 2$ in turn. No formula in
      rationals appears anywhere, and none could: that is the content of the
      irrationality of $\sqrt{2}$. This shape — produce the object by an
      existence principle, then verify its property — is the standard form of
      an existence proof in analysis, and it recurs for extrema, for limits and
      for roots of continuous functions. The argument is also more general than
      it looks: replacing $x^{2}$ by $x^{k}$ and adjusting the two estimates
      produces a $k$-th root of every positive real, odd $k$ included. And it
      does not need the density of $\mathbb{Q}$ — only completeness, to
      produce $s$, and the Archimedean property, to choose the $1/n$ in each
      case.
    choices:
      - text: >
          It never exhibits $\sqrt{2}$ by a formula: the number is produced as
          a supremum and only then shown to square to $2$.
        correct: true
        feedback: >
          Exactly the shape of an existence proof in analysis — the existence
          principle first, the property second.
      - text: >
          It fails for cube roots and other odd exponents.
        feedback: >
          The same argument with $x^{k}$ in place of $x^{2}$ produces a $k$-th
          root of every positive real, odd $k$ included.
      - text: >
          It depends on the density of $\mathbb{Q}$ in $\mathbb{R}$.
        feedback: >
          Density is never used. Completeness produces $s$ and the Archimedean
          property supplies the $1/n$ in each case; nothing else is needed.
    rubric:
      - >
        Identifies the two-stage shape — existence by supremum, then
        verification of the property.
      - >
        Names completeness and the Archimedean property as the ingredients, and
        does not add density.
    targets:
      - foundations.number-systems.ex-sqrt-two-in-r
    exercises:
      - foundations.number-systems.archimedean
    connects: []
    tags: []

  # --- ℂ ----------------------------------------------------------------------

  - id: number-systems-def-complex-01
    kind: work
    difficulty: demanding
    statement: >
      In $\mathbb{C} = \mathbb{R} \times \mathbb{R}$ with
      $(a, b) \cdot (c, d) = (a c - b d,\, a d + b c)$, find the real number
      $t$ for which the product $(1, 2) \cdot (3, t)$ lies in the embedded copy
      of $\mathbb{R}$, that is, has second coordinate $0$.
    answer: >
      $t = -6$. Apply the rule: $(1, 2) \cdot (3, t)
      = (1 \cdot 3 - 2 t,\; 1 \cdot t + 2 \cdot 3) = (3 - 2t,\; t + 6)$. The
      second coordinate vanishes exactly when $t + 6 = 0$, so $t = -6$, and the
      product is then $(3 + 12,\, 0) = (15, 0)$, which is the real number $15$.
      In the $a + b i$ notation this is the familiar conjugate trick:
      $(1 + 2i)(3 - 6i) = 3 - 6i + 6i - 12 i^{2} = 3 + 12 = 15$, the imaginary
      parts cancelling because $3 - 6i$ is a real multiple of the conjugate
      $1 - 2i$. That is also why the inverse formula has the shape it does —
      $(a, b)^{-1} = (a/(a^{2} + b^{2}),\, -b/(a^{2} + b^{2}))$ multiplies by
      the conjugate to force the second coordinate to zero, and the denominator
      $a^{2} + b^{2}$ is nonzero for $(a, b) \ne (0, 0)$ because squares are
      nonnegative *in $\mathbb{R}$* — a fact about the reals, borrowed, not a
      fact about $\mathbb{C}$. Answering $6$ solves $t - 6 = 0$ and misreads
      the sign in the second coordinate; answering $3/2$ zeroes the first
      coordinate instead.
    expects: "-6"
    rubric:
      - >
        Uses the given product rule, so the second coordinate is $ad + bc$ and
        not $bd$.
      - >
        Sets the *second* coordinate to zero, and reports $t = -6$ with the
        correct sign.
      - >
        Recognises the answer as multiplication by a real multiple of the
        conjugate, which is the mechanism behind the inverse formula.
    targets:
      - foundations.number-systems.def-complex
    exercises: []
    connects: []
    tags: []

  - id: number-systems-def-complex-02
    kind: work
    difficulty: standard
    statement: >
      Working entirely with ordered pairs and the rule
      $(a, b) \cdot (c, d) = (a c - b d,\, a d + b c)$, compute $(0, 1)^{3}$
      and report its second coordinate.
    answer: >
      $-1$. Square first: $(0, 1) \cdot (0, 1)
      = (0 \cdot 0 - 1 \cdot 1,\; 0 \cdot 1 + 1 \cdot 0) = (-1, 0)$, which is
      the embedded real $-1$ — this is the whole design goal of the
      multiplication rule, that one particular pair squares to $-1$. Multiply
      once more: $(-1, 0) \cdot (0, 1)
      = ((-1) \cdot 0 - 0 \cdot 1,\; (-1) \cdot 1 + 0 \cdot 0) = (0, -1)$. So
      $(0, 1)^{3} = (0, -1)$ and its second coordinate is $-1$. In the other
      notation this is $i^{3} = i^{2} \cdot i = -i$, and the pair
      $(0, -1) = -i$ is the additive inverse of $(0, 1)$, which is why the
      powers of $i$ cycle with period four: $(1, 0)$, $(0, 1)$, $(-1, 0)$,
      $(0, -1)$, and back. Answering $1$ computes $(0,1)^{4}$ or drops a sign;
      answering $0$ reports the first coordinate.
    expects: "-1"
    rubric:
      - >
        Computes $(0, 1)^{2} = (-1, 0)$ from the rule rather than quoting
        $i^{2} = -1$ as an assumption.
      - >
        Reports the second coordinate, $-1$, not the first.
    targets:
      - foundations.number-systems.def-complex
    exercises: []
    connects: []
    tags: []

  - id: number-systems-def-complex-03
    kind: decide
    difficulty: routine
    statement: >
      The same field $\mathbb{C}$ is obtained by taking real polynomials modulo
      the multiples of a single quadratic. Which quadratic?
    answer: >
      $x^{2} + 1$. Working modulo its multiples means declaring
      $x^{2} + 1 = 0$, that is $x^{2} = -1$, and then every polynomial reduces
      to the form $a + b x$ with $a, b$ real; multiplying two such and reducing
      reproduces exactly the rule
      $(a + bx)(c + dx) = ac + (ad + bc)x + bd x^{2}
      = (ac - bd) + (ad + bc)x$. So $x$ plays the part of $i$, and the
      ordered-pair description is the same construction with the polynomial
      bookkeeping stripped out — which is why it needs no ring theory. The
      choice of quadratic matters. Modulo $x^{2} - 1$ one gets
      $(x - 1)(x + 1) = 0$ with neither factor zero, so the result has zero
      divisors and is not a field. Modulo $x^{2}$ one gets a nonzero element
      $x$ with $x^{2} = 0$, which therefore has no inverse. Only an
      *irreducible* quadratic produces a field, and $x^{2} + 1$ is irreducible
      over $\mathbb{R}$ precisely because squares of reals are nonnegative.
    choices:
      - text: >
          $x^{2} + 1$
        correct: true
        feedback: >
          Right: declaring $x^{2} = -1$ and reducing reproduces the
          ordered-pair multiplication exactly, and irreducibility over
          $\mathbb{R}$ is what makes the quotient a field.
      - text: >
          $x^{2} - 1$
        feedback: >
          This factors as $(x - 1)(x + 1)$, so the quotient has zero divisors —
          two nonzero elements with product $0$ — and cannot be a field.
      - text: >
          $x^{2}$
        feedback: >
          Then $x$ is a nonzero element with $x^{2} = 0$, so $x$ has no
          inverse. The quotient is a ring with nilpotents, not a field.
    rubric:
      - >
        Names $x^{2} + 1$ and checks that reducing $(a + bx)(c + dx)$
        reproduces the ordered-pair rule.
      - >
        Explains why the two distractors fail — zero divisors in one case, a
        nilpotent in the other — rather than only naming the right answer.
    targets:
      - foundations.number-systems.def-complex
    exercises: []
    connects: []
    tags: []

  - id: number-systems-complex-no-order-01
    kind: justify
    difficulty: demanding
    statement: >
      Prove that no total order on $\mathbb{C}$ makes it an ordered field. Then
      state the general fact your proof establishes about which fields can be
      ordered, and diagnose the proposal that ranks $(a, b)$ against $(c, d)$
      by real part alone — declaring $(a, b) \le_{r} (c, d)$ when $a \le c$ —
      saying which requirement it breaks and at what point.
    answer: >
      Suppose $\le$ were a total order on $\mathbb{C}$ satisfying (O1) and
      (O2). In any ordered field every square is nonnegative: if $x \ge 0$ then
      $x^{2} \ge 0$ by (O2), and if $x \le 0$ then $-x \ge 0$ by (O1), so
      $x^{2} = (-x)(-x) \ge 0$ again. Also $1 > 0$, since $1 = 1^{2} \ge 0$ and
      $1 \ne 0$ by the axioms, and therefore $-1 < 0$ by (O1). But
      $i = (0, 1)$ satisfies $i^{2} = -1$, so $-1$ is a square and must be
      $\ge 0$. That is a contradiction, and it did not depend on which order
      was proposed. The general fact is stronger than the statement about
      $\mathbb{C}$: *no* field containing a square root of $-1$ admits a
      compatible order, because the argument used nothing about $\mathbb{C}$
      beyond $i^{2} = -1$. The comparison by real part alone fails earlier than
      that, and for a different reason: it is not an order at all. It is
      reflexive and transitive, and it does satisfy (O1), since adding a fixed
      pair shifts both real parts equally; but antisymmetry breaks, because
      $(0, 1) \le_{r} (0, 2)$ and $(0, 2) \le_{r} (0, 1)$ both hold — the real
      parts are equal — while $(0, 1) \ne (0, 2)$. So $\le_{r}$ cannot even be
      called a total order, and the theorem above never has to be invoked. The
      lesson is that a candidate can be disqualified at two quite separate
      levels: by failing to be an order, or by being an order incompatible with
      the arithmetic.
      What $\mathbb{C}$ retains is the absolute value
      $|a + b i| = \sqrt{a^{2} + b^{2}}$, so magnitudes may still be compared;
      what is gone is any order on the numbers themselves, and with it
      monotonicity, suprema, and the intermediate value theorem.
    rubric:
      - >
        Proves that squares are nonnegative from (O1) and (O2), covering both
        the case $x \ge 0$ and the case $x \le 0$.
      - >
        Derives $1 > 0$ from $1 = 1^{2}$ and $1 \ne 0$, hence $-1 < 0$, rather
        than assuming the sign of $1$.
      - >
        Quantifies over all proposed orders, so the conclusion is that no order
        works and not merely that a particular one fails.
      - >
        Diagnoses the real-part comparison specifically: it fails antisymmetry,
        with a named pair of distinct elements comparing both ways, so it is
        disqualified before (O2) is even reached.
    targets:
      - foundations.number-systems.complex-no-order
    exercises:
      - foundations.number-systems.def-complex
      - foundations.number-systems.ordered-field-consequences
    connects: []
    tags: []

  - id: number-systems-complex-no-order-02
    kind: decide
    difficulty: standard
    statement: >
      Losing the order costs $\mathbb{C}$ some machinery and leaves other
      machinery intact. Which of these survives the passage from $\mathbb{R}$
      to $\mathbb{C}$?
    answer: >
      The absolute value survives, and with it every statement that compares
      *magnitudes* rather than numbers. Setting
      $|a + b i| = \sqrt{a^{2} + b^{2}}$ gives a nonnegative real for each
      complex number, with $|zw| = |z||w|$ and the triangle inequality intact,
      so inequalities like $|z| < 1$ or $|z - w| < \varepsilon$ remain
      perfectly meaningful — the inequality lives in $\mathbb{R}$, where the
      order still exists, and only the *inputs* are complex. That is enough for
      all of complex analysis to be built. What is gone is every statement
      comparing two complex numbers directly. The intermediate value theorem
      needs an ordered codomain to say a value lies between two others;
      suprema and infima need an order on the set itself; monotonicity needs
      both. None of these has a complex analogue, and that is why the step from
      $\mathbb{R}$ to $\mathbb{C}$ is different in kind from the three before
      it — those added structure, this one trades some away in exchange for
      every polynomial having a root.
    choices:
      - text: >
          The absolute value $|a + b i| = \sqrt{a^{2} + b^{2}}$, and with it
          inequalities between magnitudes.
        correct: true
        feedback: >
          Right — the inequality itself lives in $\mathbb{R}$, so only the
          inputs are complex and nothing is being compared inside
          $\mathbb{C}$.
      - text: >
          The intermediate value theorem.
        feedback: >
          It asserts that a value lies *between* two others, which needs an
          order on the codomain. There is none on $\mathbb{C}$.
      - text: >
          Least upper bounds of bounded subsets.
        feedback: >
          A supremum is defined through the order on the set itself, so with no
          compatible order on $\mathbb{C}$ the notion does not even get stated.
    rubric:
      - >
        Distinguishes comparing magnitudes, which is an inequality in
        $\mathbb{R}$, from comparing complex numbers, which is not available.
      - >
        Rejects the other two on the ground that each is phrased through an
        order on the set itself.
    targets:
      - foundations.number-systems.complex-no-order
    exercises:
      - foundations.number-systems.def-complex
    connects: []
    tags: []

  # --- reading the tower ------------------------------------------------------

  - id: number-systems-intuition-tower-01
    kind: decide
    difficulty: demanding
    statement: >
      Consider the property: *every nonempty subset that is bounded below has a
      least element*. At which step of the tower
      $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$ is
      it first lost?
    answer: >
      At $\mathbb{Z} \to \mathbb{Q}$. The property is more careful than plain
      well-ordering, and the care is what makes the question interesting.
      $\mathbb{N}$ has it, since every nonempty subset has a least element
      outright. $\mathbb{Z}$ still has it: a nonempty set of integers bounded
      below by $N$ can be translated by $-N$ into $\mathbb{N}$, where
      well-ordering applies, and translated back. What $\mathbb{Z}$ loses is
      well-ordering of the *whole* set — $\mathbb{Z}$ itself is nonempty with
      no least element — but that is a weaker loss, and the surviving form is
      exactly what the density proof uses when it takes the least integer
      exceeding $n x$. In $\mathbb{Q}$ the property genuinely fails:
      $\{q \in \mathbb{Q} : q > 0\}$ is nonempty and bounded below by $0$, and
      it has no least element, because $q/2$ is a smaller member for every
      member $q$. That failure is the loss of discreteness, and it is forced —
      halving is available in every ordered field, so no ordered field is
      discretely ordered. By the time $\mathbb{R}$ arrives the property is
      already gone, so the last step cannot be where it is first lost.
    choices:
      - text: >
          $\mathbb{N} \to \mathbb{Z}$
        feedback: >
          $\mathbb{Z}$ still has this property: translate a set bounded below
          into $\mathbb{N}$, apply well-ordering, translate back. What is lost
          here is well-ordering of the whole set, which is weaker.
      - text: >
          $\mathbb{Z} \to \mathbb{Q}$
        correct: true
        feedback: >
          Right: $\{q > 0\}$ is bounded below with no least element, since
          $q/2$ always beats $q$. This is the loss of discreteness, and it is
          forced in any ordered field.
      - text: >
          $\mathbb{Q} \to \mathbb{R}$
        feedback: >
          The property was already gone in $\mathbb{Q}$, so it cannot be first
          lost here. What this step costs is countability.
    rubric:
      - >
        Distinguishes well-ordering of the whole set from the bounded-below
        form, and notes $\mathbb{Z}$ keeps the latter.
      - >
        Exhibits a specific failing set in $\mathbb{Q}$ with a witness that it
        has no least element.
      - >
        Attributes the failure to discreteness, and to halving being available
        in every ordered field.
    targets:
      - foundations.number-systems.intuition-tower
    exercises:
      - foundations.number-systems.integers-ordered-ring
      - foundations.number-systems.q-ordered-field
    connects: []
    tags: []

  - id: number-systems-intuition-tower-02
    kind: decide
    difficulty: standard
    statement: >
      Each system in the tower is the cheapest repair of one named defect.
      Stated precisely, which defect of $\mathbb{Q}$ does $\mathbb{R}$ repair?
    answer: >
      That some nonempty set of rationals which is bounded above has no least
      upper bound in $\mathbb{Q}$. That is a statement about the *order*, not
      about any particular missing number, and it is what completeness is
      defined to fix. The distinction from "$\sqrt{2}$ is not rational" is the
      point of the question. Irrationality of $\sqrt{2}$ is a symptom, and
      patching it is not a repair: adjoining $\sqrt{2}$ to $\mathbb{Q}$ gives
      a perfectly good ordered field in which $\sqrt{3}$ is still missing, and
      the set of its elements with square below $3$ is still bounded above with
      no supremum, so the gap is exactly as bad as before. The defect is that
      the order has holes everywhere, and only a construction that fills all of
      them at once — cuts, or Cauchy classes — repairs it. The countability of
      $\mathbb{Q}$ is not the defect either; uncountability is what
      $\mathbb{R}$ *pays*, since most reals can never be written down, in the
      same way that $\mathbb{Z}$ paid well-ordering and $\mathbb{Q}$ paid
      discreteness.
    choices:
      - text: >
          Some nonempty set of rationals bounded above has no least upper bound
          in $\mathbb{Q}$.
        correct: true
        feedback: >
          Right — a defect of the order itself, which is why the repair is the
          least-upper-bound property rather than the addition of particular
          numbers.
      - text: >
          $\sqrt{2}$ is not rational.
        feedback: >
          A symptom rather than the defect. Adjoin $\sqrt{2}$ to $\mathbb{Q}$
          and the enlarged ordered field still has bounded sets with no
          supremum.
      - text: >
          $\mathbb{Q}$ is countable.
        feedback: >
          Countability is not a defect, and uncountability is what $\mathbb{R}$
          pays rather than what it repairs.
    rubric:
      - >
        States the defect as a property of the order — a bounded set without a
        supremum — not as a missing number.
      - >
        Explains why adjoining $\sqrt{2}$ would not suffice, so the symptom is
        distinguished from the defect.
    targets:
      - foundations.number-systems.intuition-tower
    exercises:
      - foundations.number-systems.q-not-complete
    connects: []
    tags: []
