# problems targeting analysis.svc — the single-variable calculus corpus.
#
# Tagging rules are design.md §5.2: `targets` is what the problem primarily
# tests, `exercises` is what it necessarily drills in passing. See
# ../README.md for the authoring checklist.

problems:
  # --- limits and continuity -------------------------------------------------

  - id: svc-def-limit-01
    kind: justify
    difficulty: standard
    statement: >
      Working directly from the $\varepsilon$–$\delta$ definition, prove that
      $\lim_{x \to 3} (2x - 1) = 5$.
    answer: >
      Let $\varepsilon > 0$ and put $\delta = \varepsilon/2 > 0$. If
      $0 < |x - 3| < \delta$ then $|(2x - 1) - 5| = |2x - 6| = 2|x - 3| < 2\delta
      = \varepsilon$. Since $\varepsilon$ was arbitrary, the limit is $5$.
    rubric:
      - >
        Produces $\delta$ as an explicit function of $\varepsilon$, chosen before
        the estimate is carried out.
      - >
        Runs the implication in the correct direction: $0 < |x - 3| < \delta$
        implies $|f(x) - 5| < \varepsilon$.
      - >
        Quantifies correctly — for every $\varepsilon$ there exists $\delta$, not
        the reverse.
    targets:
      - analysis.svc.def-limit
    exercises: []
    connects: []
    tags: []

  - id: svc-def-limit-02
    kind: decide
    difficulty: routine
    statement: >
      Define $f$ on $\mathbb{R}$ by $f(x) = 0$ for $x \ne 0$ and $f(0) = 7$. Does
      $\lim_{x \to 0} f(x)$ exist, and if so what is its value?
    answer: >
      The limit exists and equals $0$. The definition constrains $f$ only at points
      with $0 < |x - 0| < \delta$, which excludes $x = 0$, and at every such point
      $f(x) = 0$; so any $\delta$ works. The value $f(0) = 7$ is irrelevant to the
      limit.
    choices:
      - text: >
          The limit exists and equals $0$
        correct: true
        feedback: >
          Every $x$ with $0 < |x| < \delta$ has $f(x) = 0$, so any $\delta$ at
          all satisfies the definition.
      - text: >
          The limit exists and equals $7$
        feedback: >
          $7$ is the value $f(0)$, and the neighbourhood in the definition is
          punctured — it never looks at $x = c$.
      - text: >
          The limit does not exist, because $f$ jumps at $0$
        feedback: >
          A jump at the point itself is invisible to the limit, which reads only
          the punctured neighbourhood, where $f$ is identically $0$.
    rubric:
      - >
        Answers $0$, not $7$ and not "does not exist".
      - >
        Justifies it by the punctured neighbourhood: the definition never looks at
        $x = c$.
    targets:
      - analysis.svc.def-limit
    exercises: []
    connects: []
    tags: []

  - id: svc-def-limit-03
    kind: work
    difficulty: demanding
    statement: >
      For $f(x) = 1/x$ at $c = 2$ the limit is $L = 1/2$. An opponent names
      $\varepsilon = 0.05$. What is the largest $\delta$ that answers it — the
      largest $\delta$ for which $0 < |x - 2| < \delta$ forces
      $|1/x - 1/2| < 0.05$? Give it exactly, as a fraction.
    answer: >
      $2/11$. The requirement $|1/x - 1/2| < 0.05$ says $0.45 < 1/x < 0.55$, and
      since $x$ is near $2$ it is positive, so inverting reverses the
      inequalities: $20/11 < x < 20/9$, that is $1.8181\ldots < x < 2.2222\ldots$
      The good set is an interval around $2$ but not a symmetric one — it reaches
      $2/11 \approx 0.1818$ to the left of $2$ and $2/9 \approx 0.2222$ to the
      right. A single $\delta$ has to work on both sides, so it is the smaller of
      the two distances, $\delta = 2/11$. Taking $2/9$ instead admits points just
      below $20/11$, where $1/x$ exceeds $0.55$ and the estimate fails. The
      asymmetry is the point: $1/x$ steepens to the left of $2$, so the left side
      is the binding constraint.
    expects: "2/11"
    tolerance: 0.0005
    rubric:
      - >
        Solves the two-sided inequality for $x$, rather than treating
        $|1/x - 1/2|$ as though it were proportional to $|x - 2|$.
      - >
        Takes the *smaller* of the two distances from $2$ to the endpoints, since
        one $\delta$ must serve both sides.
      - >
        Reports $2/11$, not $2/9$.
    targets:
      - analysis.svc.def-limit
    exercises: []
    connects: []
    tags: []

  - id: svc-def-continuity-01
    kind: decide
    difficulty: standard
    statement: >
      With $f$ as above — $f(x) = 0$ for $x \ne 0$ and $f(0) = 7$ — is $f$
      continuous at $0$? Name the clause of the definition that fails.
    answer: >
      No. Continuity at $0$ requires three things: that $f(0)$ is defined, that
      $\lim_{x \to 0} f(x)$ exists, and that the two are equal. The first two hold
      — $f(0) = 7$ and the limit is $0$ — and the third fails, since $0 \ne 7$.
    choices:
      - text: >
          No — the limit and the value both exist but differ, so the equality
          clause fails
        correct: true
        feedback: >
          $\lim_{x \to 0} f(x) = 0$ while $f(0) = 7$; continuity needs the two to
          agree, and $0 \ne 7$.
      - text: >
          No — the limit fails to exist at $0$
        feedback: >
          The limit does exist and equals $0$. What fails is its *agreement* with
          $f(0)$, not its existence.
      - text: >
          No — $f$ is not defined at $0$
        feedback: >
          $f(0) = 7$ is perfectly well defined, so the first clause holds.
      - text: >
          Yes — the limit exists and $f(0)$ is defined
        feedback: >
          Both of those hold and neither is enough: continuity is the third
          clause, $\lim_{x \to 0} f(x) = f(0)$.
    rubric:
      - >
        Answers no, and locates the failure in the equality clause rather than in
        the existence of the limit.
      - >
        Does not claim the limit fails to exist; the distinction between "limit
        exists" and "limit equals the value" is the whole content of the problem.
    targets:
      - analysis.svc.def-continuity
    exercises:
      - analysis.svc.def-limit
    connects: []
    tags: []

  - id: svc-def-continuity-02
    kind: justify
    difficulty: standard
    statement: >
      Prove directly from the definition that $f(x) = x^2$ is continuous at
      $x = 2$.
    answer: >
      Let $\varepsilon > 0$. For $|x - 2| < 1$ we have $|x + 2| \le 5$, so
      $|x^2 - 4| = |x - 2|\,|x + 2| \le 5|x - 2|$. Put
      $\delta = \min(1, \varepsilon/5)$. Then $|x - 2| < \delta$ gives
      $|x^2 - 4| \le 5|x - 2| < \varepsilon$.
    rubric:
      - >
        Factors $x^2 - 4$ and bounds the second factor, rather than trying to solve
        the inequality exactly.
      - >
        Takes a minimum with a constant so the bound on $|x + 2|$ is legitimate —
        a $\delta$ depending on the unbounded factor is the standard error here.
      - >
        Uses $|x - 2| < \delta$ without excluding $x = 2$: continuity, unlike a
        limit, includes the point.
    targets:
      - analysis.svc.def-continuity
    exercises:
      - analysis.svc.def-limit
    connects: []
    tags: []

  - id: svc-def-continuity-03
    kind: decide
    difficulty: demanding
    statement: >
      Define $f$ on $\mathbb{R}$ by $f(x) = x$ when $x$ is rational and
      $f(x) = 0$ when $x$ is irrational. At which points is $f$ continuous?
    answer: >
      Only at $x = 0$. Every interval, however short, contains both rationals and
      irrationals, so arbitrarily close to any $c$ the function takes values
      arbitrarily close to $c$ (at the rationals) and the value $0$ (at the
      irrationals). For a limit at $c$ to exist those two families must agree, so
      $c = 0$ is the only candidate. At $0$ it works: $|f(x) - f(0)| = |f(x)|$ is
      either $|x|$ or $0$, so it is at most $|x|$ in every case, and $\delta =
      \varepsilon$ gives $|f(x) - f(0)| \le |x| < \varepsilon$. At any $c \ne 0$
      the irrational points near $c$ hold $f$ at $0$ while $f(c)$ is either $c$ or
      $0$ and the rational points push toward $c \ne 0$, so no limit exists and
      continuity fails.
    choices:
      - text: >
          Only at $x = 0$
        correct: true
        feedback: >
          The bound $|f(x)| \le |x|$ holds at every point, so $\delta =
          \varepsilon$ works at $0$; and at any other $c$ the two families of
          nearby values pull apart.
      - text: >
          At every rational point
        feedback: >
          At a rational $c \ne 0$ the irrationals arbitrarily close to $c$ carry
          the value $0 \ne c = f(c)$, so the limit cannot equal $f(c)$.
      - text: >
          Nowhere
        feedback: >
          At $0$ the single estimate $|f(x) - f(0)| \le |x|$ covers both cases at
          once, so $f$ is genuinely continuous there.
      - text: >
          Everywhere, since $x$ and $0$ are each continuous functions
        feedback: >
          Continuity is a property of the assembled function, not of the pieces;
          every neighbourhood of every point mixes the two formulas.
    rubric:
      - >
        Uses density of both the rationals and the irrationals in every interval,
        rather than reasoning about the two formulas separately.
      - >
        Produces the estimate $|f(x) - f(0)| \le |x|$ at the one good point.
      - >
        Rules out every $c \ne 0$, including irrational $c$, where $f(c) = 0$ but
        nearby rationals carry values near $c$.
    targets:
      - analysis.svc.def-continuity
    exercises:
      - analysis.svc.def-limit
    connects: []
    tags: []

  - id: svc-evt-01
    kind: decide
    difficulty: standard
    statement: >
      For $f(x) = 1/x$ on $(0, 1]$ and $g(x) = x$ on $[0, \infty)$, say for each
      which hypothesis of the Extreme Value Theorem fails, and which part of the
      conclusion fails with it.
    answer: >
      $f$ is continuous, but $(0,1]$ is not closed. The conclusion fails outright:
      $f$ is unbounded above, so it is neither bounded nor attains a maximum.
      $g$ is continuous, but $[0,\infty)$ is not bounded. Here $g$ attains its
      minimum at $0$, and the failure is one-sided — $g$ is unbounded above and
      attains no maximum.
    choices:
      - text: >
          For $f$ the interval is not closed and the conclusion fails outright;
          for $g$ the interval is not bounded and only the maximum fails
        correct: true
        feedback: >
          $(0,1]$ is bounded but not closed, and $f$ is unbounded there;
          $[0,\infty)$ is closed but not bounded, and $g$ still attains its
          minimum at $0$.
      - text: >
          For $f$ continuity fails at $0$; for $g$ the interval is not bounded
        feedback: >
          $0$ is not a point of $(0,1]$, so $f$ is continuous at every point of
          its domain — the hypothesis that fails is the interval's, not the
          function's.
      - text: >
          Both intervals fail to be closed, and in both cases the conclusion
          fails outright
        feedback: >
          $[0,\infty)$ *is* closed; and $g$ does attain its minimum, so there the
          conclusion fails only on one side.
      - text: >
          For $f$ the interval is not bounded; for $g$ it is not closed
        feedback: >
          Exactly reversed — $(0,1]$ is the bounded one and $[0,\infty)$ the
          closed one.
    rubric:
      - >
        Identifies the failed hypothesis separately in each case: not closed, then
        not bounded.
      - >
        Notes that the interval must be both closed and bounded; naming only
        "not an interval" or "not continuous" misses it.
      - >
        Observes that the conclusion can fail partially — $g$ still attains its
        minimum.
    targets:
      - analysis.svc.evt
    exercises:
      - analysis.svc.def-continuity
    connects: []
    tags: []

  - id: svc-evt-02
    kind: justify
    difficulty: demanding
    statement: >
      Let $f$ be continuous on $[a,b]$ with $f(x) \ne 0$ for every $x$ in
      $[a,b]$. Prove there is a constant $m > 0$ with $|f(x)| \ge m$ throughout
      $[a,b]$, and show by example that the conclusion fails on $(0,1]$.
    answer: >
      The function $|f|$ is continuous on $[a,b]$, being the composition of $f$
      with the continuous map $t \mapsto |t|$. The interval is closed and
      bounded, so by the Extreme Value Theorem $|f|$ attains its minimum: there is
      $p \in [a,b]$ with $|f(p)| \le |f(x)|$ for every $x$. Put $m = |f(p)|$. Since
      $p$ lies in $[a,b]$ and $f$ vanishes nowhere there, $f(p) \ne 0$ and so
      $m > 0$, which is exactly the claim. The attainment is the whole argument:
      the infimum of $|f|$ exists for any bounded $f$, but an infimum can be $0$
      without being a value. On $(0,1]$ the function $f(x) = x$ is continuous and
      never zero, yet $\inf |f| = 0$ is not attained, and no positive $m$ bounds
      $|f|$ below — the interval is not closed, and the Extreme Value Theorem does
      not apply.
    rubric:
      - >
        Applies the Extreme Value Theorem to $|f|$, and says why $|f|$ is
        continuous.
      - >
        Gets $m > 0$ from the minimum being *attained* at a point of the interval
        — an infimum alone could equal $0$.
      - >
        Gives an example on a non-closed interval where the infimum is not
        attained, so the failed hypothesis is visible.
    targets:
      - analysis.svc.evt
    exercises:
      - analysis.svc.def-continuity
    connects: []
    tags: []

  - id: svc-ivt-01
    kind: justify
    difficulty: standard
    statement: >
      Show that $x^3 + x - 1 = 0$ has a solution in the interval $(0, 1)$. Name
      the theorem you use and check each of its hypotheses.
    answer: >
      Let $p(x) = x^3 + x - 1$. Polynomials are continuous, so $p$ is continuous on
      the closed interval $[0, 1]$. We have $p(0) = -1$ and $p(1) = 1$, so $0$ lies
      strictly between $p(0)$ and $p(1)$. By the Intermediate Value Theorem there
      is $c \in (0,1)$ with $p(c) = 0$.
    rubric:
      - >
        Names the Intermediate Value Theorem and checks continuity on a *closed*
        interval.
      - >
        Evaluates at both endpoints and observes the sign change.
      - >
        Claims existence only — the IVT locates no root and gives no uniqueness.
    targets:
      - analysis.svc.ivt
    exercises:
      - analysis.svc.def-continuity
    connects: []
    tags: []

  - id: svc-ivt-02
    kind: decide
    difficulty: demanding
    statement: >
      Let $f : [0,1] \to [0,1]$ be continuous. Which argument proves that $f$ has
      a fixed point, a $c$ with $f(c) = c$?
    answer: >
      Set $g(x) = f(x) - x$, continuous as a difference of continuous functions.
      Because $f$ takes values in $[0,1]$, we have $g(0) = f(0) \ge 0$ and
      $g(1) = f(1) - 1 \le 0$, so $0$ lies between $g(1)$ and $g(0)$ and the
      Intermediate Value Theorem supplies $c \in [0,1]$ with $g(c) = 0$, that is
      $f(c) = c$. The inequalities are not strict, and they cannot be made so: if
      $f(0) = 0$ then $c = 0$ is the fixed point and it sits at an endpoint. So the
      form of the theorem needed is the one allowing $c$ in the closed interval;
      the strict-inequality form, which places $c$ inside $(0,1)$, is unavailable
      here. Applying the theorem to $f$ itself proves nothing, since the value one
      wants, $c$, is not known in advance.
    choices:
      - text: >
          Apply the theorem to $g(x) = f(x) - x$: $g(0) \ge 0$ and $g(1) \le 0$, so
          $g$ vanishes somewhere in $[0,1]$
        correct: true
        feedback: >
          The codomain $[0,1]$ is what forces the two sign conditions, and the
          closed-interval form of the theorem covers the case of equality at an
          endpoint.
      - text: >
          Apply the theorem to $f$ itself: $f$ takes every value between $f(0)$
          and $f(1)$, and $c$ is one of them
        feedback: >
          That would require knowing $c$ lies between $f(0)$ and $f(1)$ before
          finding it; the theorem produces a point from a *given* target value.
      - text: >
          Apply the theorem to $g(x) = f(x) + x$, which runs from $f(0) \ge 0$ to
          $f(1) + 1 > 0$
        feedback: >
          Both endpoint values are non-negative, so there is no sign change to
          exploit — and a zero of $f(x) + x$ is not a fixed point anyway.
      - text: >
          Apply the theorem to $g(x) = f(x) - x$, and note $g(0) > 0$ and
          $g(1) < 0$ strictly, so the fixed point is interior
        feedback: >
          The inequalities can be equalities: $f(0) = 0$ is allowed, and then the
          only fixed point guaranteed is the endpoint $0$.
    rubric:
      - >
        Builds the auxiliary function $g = f - x$ and checks its continuity.
      - >
        Derives the two endpoint sign conditions from the codomain $[0,1]$, not
        from any extra assumption on $f$.
      - >
        Uses the closed-interval form of the theorem, since a fixed point may sit
        at an endpoint.
    targets:
      - analysis.svc.ivt
    exercises:
      - analysis.svc.def-continuity
    connects: []
    tags: []

  # --- differentiation -------------------------------------------------------

  - id: svc-def-derivative-01
    kind: work
    difficulty: routine
    statement: >
      Compute $f'(2)$ for $f(x) = x^2$ straight from the difference quotient,
      without using any differentiation rule.
    answer: >
      $f'(2) = \lim_{h \to 0} \frac{(2 + h)^2 - 2^2}{h}
      = \lim_{h \to 0} \frac{4h + h^2}{h} = \lim_{h \to 0} (4 + h) = 4$.
      The cancellation is legitimate because the limit never evaluates at $h = 0$.
    expects: "4"
    rubric:
      - >
        Writes the difference quotient with a limit, and does not differentiate by
        rule.
      - >
        Cancels $h$ and says why that is allowed — the limit looks only at
        $h \ne 0$.
      - >
        Reaches $4$.
    targets:
      - analysis.svc.def-derivative
    exercises:
      - analysis.svc.def-limit
    connects: []
    tags: []

  - id: svc-def-derivative-02
    kind: decide
    difficulty: standard
    statement: >
      Examine the difference quotient of $f(x) = |x|$ at $0$. What do its
      one-sided limits do, and what does that settle about $f'(0)$?
    answer: >
      The quotient at $0$ is $\frac{|h| - 0}{h} = \frac{|h|}{h}$, which equals $1$
      for every $h > 0$ and $-1$ for every $h < 0$. The one-sided limits are $1$
      and $-1$; since they differ, the two-sided limit does not exist, so $f'(0)$
      does not exist.
    choices:
      - text: >
          They are $1$ from the right and $-1$ from the left; since they differ,
          $f'(0)$ does not exist
        correct: true
        feedback: >
          The quotient $|h|/h$ is constantly $1$ for $h > 0$ and constantly $-1$
          for $h < 0$, so the two-sided limit cannot exist.
      - text: >
          They are $1$ and $-1$, so $f'(0)$ is their average, $0$
        feedback: >
          A two-sided limit is not an average of one-sided limits; when they
          disagree there is no limit at all.
      - text: >
          Both are $0$, so $f'(0) = 0$
        feedback: >
          The quotient never takes the value $0$ — it is $\pm 1$ for every
          $h \ne 0$.
      - text: >
          Neither one-sided limit exists, since $|h|/h$ is undefined at $h = 0$
        feedback: >
          The limit deliberately ignores $h = 0$; on each side the quotient is a
          constant, so both one-sided limits exist.
    rubric:
      - >
        Forms the difference quotient rather than appealing to a picture of the
        corner.
      - >
        Computes both one-sided limits and states they disagree.
      - >
        Concludes about the *limit*, not about $f$ being discontinuous — $|x|$ is
        continuous at $0$.
    targets:
      - analysis.svc.def-derivative
    exercises:
      - analysis.svc.def-limit
    connects: []
    tags: []

  - id: svc-def-derivative-03
    kind: work
    difficulty: demanding
    statement: >
      Let $f(x) = x^2\sin(1/x)$ for $x \ne 0$ and $f(0) = 0$. Compute $f'(0)$
      from the difference quotient.
    answer: >
      $f'(0) = 0$. The quotient at $0$ is
      $\dfrac{f(h) - f(0)}{h} = \dfrac{h^2\sin(1/h)}{h} = h\sin(1/h)$ for every
      $h \ne 0$, which is all the limit examines. The factor $\sin(1/h)$ has no
      limit as $h \to 0$ — it oscillates through every value in $[-1,1]$
      infinitely often — so it must be bounded rather than evaluated:
      $|h\sin(1/h)| \le |h|$, and $|h| \to 0$, so the quotient is squeezed to $0$.
      Hence $f'(0)$ exists and equals $0$. Note what this does *not* say. For
      $x \ne 0$ the derivative is $f'(x) = 2x\sin(1/x) - \cos(1/x)$, which has no
      limit as $x \to 0$; so $f$ is differentiable at $0$ while $f'$ is
      discontinuous there. Differentiability at a point is a statement about one
      limit of quotients, not about the behaviour of $f'$ nearby.
    expects: "0"
    rubric:
      - >
        Forms the quotient at $0$ and simplifies it to $h\sin(1/h)$, without
        appealing to a product or chain rule.
      - >
        Bounds $|\sin(1/h)| \le 1$ and squeezes — the oscillating factor has no
        limit, so the estimate has to do the work.
      - >
        Reaches $f'(0) = 0$, and does not confuse it with the non-existent
        $\lim_{x \to 0} f'(x)$.
    targets:
      - analysis.svc.def-derivative
    exercises:
      - analysis.svc.def-limit
    connects: []
    tags: []

  - id: svc-linearization-01
    kind: work
    difficulty: routine
    statement: >
      Use the linear approximation to $f(x) = \sqrt{x}$ at $a = 9$ to estimate
      $\sqrt{9.2}$, giving the estimate to four decimal places, and say what role
      the derivative plays in it.
    answer: >
      $f'(x) = \frac{1}{2\sqrt{x}}$, so $f'(9) = \frac{1}{6}$ and the linear
      approximation is $L(x) = 3 + \frac{1}{6}(x - 9)$. Then
      $\sqrt{9.2} \approx L(9.2) = 3 + \frac{0.2}{6} \approx 3.0333$, against the
      true value $3.03315\ldots$. The derivative is the slope of the line that best
      approximates $f$ near $a$: locally $f$ looks linear, and $f'(a)$ is the
      magnification factor of that line.
    expects: "3.0333"
    tolerance: 0.0005
    rubric:
      - >
        Builds the tangent line at the right base point and evaluates it at $9.2$.
      - >
        Interprets $f'(a)$ as the slope of the best local linear approximation,
        which is the idea being tested rather than the arithmetic.
      - >
        Notes that the approximation is local — its accuracy degrades as $x$ moves
        away from $a$.
    targets:
      - analysis.svc.intuition-linearization
    exercises:
      - analysis.svc.def-derivative
    connects: []
    tags: []

  - id: svc-linearization-02
    kind: work
    difficulty: demanding
    statement: >
      Take $f(x) = x^3$ at $c = 2$ and write $f(2 + h) = f(2) + mh + r(h)$. Only
      one $m$ makes $r(h)/h \to 0$. For that $m$, compute
      $\lim_{h \to 0} r(h)/h^2$.
    answer: >
      Expanding, $f(2+h) = 8 + 12h + 6h^2 + h^3$. Matching against
      $8 + mh + r(h)$ with $m = 12$ leaves $r(h) = 6h^2 + h^3$, so
      $r(h)/h = 6h + h^2 \to 0$ as required; and $m = 12$ is forced, since any
      other $m$ leaves a term $(12 - m)h$ in $r(h)$ and then
      $r(h)/h \to 12 - m \ne 0$. That $m$ is of course $f'(2)$. Now divide by the
      square instead: $r(h)/h^2 = 6 + h \to 6$. So the error of the tangent line
      is not merely small compared with $h$ — it is proportional to $h^2$, with
      constant $6$. Halving the step quarters the error, which is what makes local
      linearization worth using. The constant $6$ is the leading curvature term,
      $f''(2)/2 = 12/2$.
    expects: "6"
    rubric:
      - >
        Expands $(2+h)^3$ and reads $m$ off the coefficient of $h$, checking that
        no other $m$ kills $r(h)/h$.
      - >
        Divides the remainder by $h^2$, not by $h$, before taking the limit.
      - >
        Reaches $6$, and reads it as saying the tangent-line error is quadratic in
        the step.
    targets:
      - analysis.svc.intuition-linearization
    exercises:
      - analysis.svc.def-derivative
