# problems targeting analysis.mvc
#
# Authored mastery-first (§6.7): both nodes carry a `demanding` problem, so the
# mastery set never opens with something the lesson has just handed over, and a
# `standard` or `routine` one, so the unit test has something fair to ask. No
# problem here reuses a lesson's worked example or a card's numbers.
#
# `mvc-leibniz-01` is the bank's one `connects` problem: §4.4 says an edge review
# happens when a problem explicitly exercises the connection, so a problem that
# works both sides of the FTC/Leibniz relation is the only thing that can score
# that edge.

problems:
  # --- the partial derivative --------------------------------------------------

  - id: mvc-partial-derivative-01
    kind: work
    difficulty: routine
    statement: >
      For $f(x, y) = x^2 y + \sin y$, compute $\partial f/\partial x$ and
      $\partial f/\partial y$, and say what is held fixed in each.
    answer: >
      $\partial f/\partial x = 2xy$, computed with $y$ held fixed, so $\sin y$ is a
      constant and differentiates away. $\partial f/\partial y = x^2 + \cos y$,
      computed with $x$ held fixed, so $x^2$ is the constant coefficient of $y$.
    choices:
      - text: >
          $\partial f/\partial x = 2xy$ and
          $\partial f/\partial y = x^2 + \cos y$.
        correct: true
        feedback: >
          With $y$ frozen, $x^2 y$ is $y$ times $x^2$ and $\sin y$ is a constant,
          giving $2xy$. With $x$ frozen, $x^2 y$ is $x^2$ times $y$ and the
          sine is finally the variable term, giving $x^2 + \cos y$.
      - text: >
          $\partial f/\partial x = 2xy + \cos y$ and
          $\partial f/\partial y = x^2 + \cos y$.
        feedback: >
          $\sin y$ was differentiated while $y$ was supposed to be frozen. Held
          fixed, $\sin y$ is a constant and contributes $0$ to the $x$-partial.
      - text: >
          $\partial f/\partial x = 2xy$ and
          $\partial f/\partial y = x^2 y + \cos y$.
        feedback: >
          The $y$ in $x^2 y$ was left undifferentiated. With $x$ frozen, $x^2 y$
          is the constant $x^2$ times $y$, whose $y$-derivative is $x^2$.
      - text: >
          $\partial f/\partial x = x^2 + \cos y$ and
          $\partial f/\partial y = 2xy$.
        feedback: >
          The two partials are swapped. The subscript on $\partial$ names the
          variable that *moves*, not the one held fixed.
    rubric:
      - >
        Gets both partials right, including the vanishing of $\sin y$ in the first.
      - >
        States which variable is held fixed in each, which is the content of the
        definition rather than a side remark.
      - >
        Treats each partial as an ordinary one-variable derivative of a restricted
        function.
    targets:
      - analysis.mvc.def-partial-derivative
    exercises:
      - analysis.svc.def-derivative
    connects: []
    tags: []

  - id: mvc-partial-derivative-02
    kind: work
    difficulty: demanding
    statement: >
      Let $f(x,y) = \dfrac{x^3 + 2y^3}{x^2 + y^2}$ for $(x,y) \ne (0,0)$, with
      $f(0,0) = 0$. Compute $\dfrac{\partial f}{\partial y}(0,0)$.
    answer: >
      $2$. The quotient rule is no help here: differentiating the formula and
      then substituting $(0,0)$ produces $\dfrac{0}{0}$, because the formula is
      not the function at the origin — the value there was assigned separately.
      Go back to the definition instead, which asks only for an ordinary
      derivative along the $y$-axis. For $h \ne 0$,
      $f(0,h) = \dfrac{2h^3}{h^2} = 2h$, so
      $\dfrac{f(0,h) - f(0,0)}{h} = \dfrac{2h - 0}{h} = 2$ for every $h \ne 0$,
      and the limit as $h \to 0$ is $2$. The same route along the other axis
      gives $f(h,0) = h$ and $\dfrac{\partial f}{\partial x}(0,0) = 1$. The
      lesson is that freezing a coordinate reduces the problem to a
      one-variable derivative, and when the rules do not apply the difference
      quotient still does.
    expects: "2"
    rubric:
      - >
        Restricts $f$ to the $y$-axis first, obtaining the one-variable function
        $h \mapsto 2h$, rather than differentiating the quotient formula.
      - >
        Uses the assigned value $f(0,0) = 0$ in the difference quotient, not a
        value read off the formula.
      - >
        Says why the quotient rule is unavailable at the origin: the formula does
        not define $f$ there.
    targets:
      - analysis.mvc.def-partial-derivative
    exercises:
      - analysis.svc.def-derivative
    connects: []
    tags: []

  - id: mvc-partial-derivative-03
    kind: work
    difficulty: standard
    statement: >
      For $f(x,y) = y\,e^{xy} + x^2$, compute $\dfrac{\partial f}{\partial x}$ at
      the point $(0,3)$.
    answer: >
      $9$. Freeze $y$. The leading $y$ is then a constant multiplier, and
      $e^{xy}$ is an exponential whose exponent moves at rate $y$ as $x$ moves,
      so the chain rule gives
      $\dfrac{\partial}{\partial x}\left(y\,e^{xy}\right) = y \cdot y\,e^{xy}
      = y^2 e^{xy}$. The term $x^2$ contributes $2x$. So
      $\dfrac{\partial f}{\partial x} = y^2 e^{xy} + 2x$, and at $(0,3)$ this is
      $9 \cdot e^{0} + 0 = 9$. The usual slip is to answer $3$, which forgets
      the inner factor $y$ from the chain rule and reports $y\,e^{xy}$ instead.
    expects: "9"
    rubric:
      - >
        Applies the chain rule to $e^{xy}$ with $y$ frozen, producing the inner
        factor $y$ and hence $y^2 e^{xy}$ rather than $y\,e^{xy}$.
      - >
        Treats the leading $y$ as a constant multiplier rather than
        differentiating it.
      - >
        Evaluates at $(0,3)$ only after differentiating, so that $e^{0} = 1$ is
        used at the end rather than at the start.
    targets:
      - analysis.mvc.def-partial-derivative
    exercises: []
    connects: []
    tags: []

  - id: mvc-partial-derivative-04
    kind: decide
    difficulty: standard
    statement: >
      Define $g$ on $\mathbb{R}^2$ by $g(x,y) = 1$ whenever $xy = 0$, and
      $g(x,y) = 0$ otherwise. What is true of $g$ at the origin?
    answer: >
      Both partials exist at the origin and equal $0$, and $g$ is not continuous
      there. The whole $x$-axis satisfies $xy = 0$, so $g(h,0) = 1$ for every
      $h$, including $h = 0$; the difference quotient
      $\dfrac{g(h,0) - g(0,0)}{h} = \dfrac{1 - 1}{h}$ is $0$ for every
      $h \ne 0$, so $\dfrac{\partial g}{\partial x}(0,0) = 0$, and the identical
      argument along the $y$-axis gives $\dfrac{\partial g}{\partial y}(0,0) = 0$.
      Continuity fails all the same: at every point of the line $y = x$ with
      $x \ne 0$ the product $xy$ is nonzero, so $g = 0$ there, and those points
      come arbitrarily close to the origin where $g = 1$. A partial derivative
      only ever reads $g$ along its own axis, and this $g$ is constant on both
      axes — the axes are exactly where it cannot see the trouble.
    choices:
      - text: >
          Both partials exist at the origin and equal $0$, yet $g$ is not
          continuous at the origin.
        correct: true
        feedback: >
          $g$ is constantly $1$ on each axis, so both difference quotients at the
          origin are identically $0$. Along $y = x$ with $x \ne 0$ the value is
          $0$, arbitrarily close to a point where $g$ is $1$, so no limit at the
          origin can equal $g(0,0)$.
      - text: >
          Neither partial exists at the origin, because $g$ is not continuous
          there.
        feedback: >
          Continuity is not required for a partial derivative to exist. The
          restriction of $g$ to the $x$-axis is the constant function $1$, and a
          constant has a derivative.
      - text: >
          Both partials exist at the origin, so $g$ is continuous there.
        feedback: >
          That implication holds in one variable and fails here. The partials
          inspect two lines; continuity is a claim about every direction, and the
          line $y = x$ refutes it.
      - text: >
          $g$ is continuous at the origin, but neither partial exists there.
        feedback: >
          Both halves are backwards. $g$ jumps between $1$ on the axes and $0$
          just off them, and the two partials are the derivatives of constant
          functions, so both exist and are $0$.
    rubric:
      - >
        Computes both partials from the difference quotient at the origin, using
        $g(0,0) = 1$ and the constancy of $g$ on each axis.
      - >
        Refutes continuity with an explicit approach — points on $y = x$, where
        $g$ is $0$ — rather than asserting it.
      - >
        Does not claim that a discontinuity blocks the existence of a partial
        derivative.
    targets:
      - analysis.mvc.def-partial-derivative
    exercises:
      - analysis.svc.def-limit
    connects: []
    tags: []

  # --- the Leibniz integral rule -----------------------------------------------

  - id: mvc-leibniz-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $I(y) = \int_0^1 (x^2 + y^2)\,dx$. Compute $I'(y)$ twice — once by
      evaluating the integral and then differentiating, once by differentiating
      under the integral sign — and say what their agreement illustrates.
    answer: >
      Evaluating first: $I(y) = \frac{1}{3} + y^2$, so $I'(y) = 2y$.
      Differentiating under the sign:
      $I'(y) = \int_0^1 \frac{\partial}{\partial y}(x^2 + y^2)\,dx
      = \int_0^1 2y\,dx = 2y$. The two agree, which is the Leibniz rule in the
      simplest case: the derivative and the integral may be interchanged when the
      integrand and its partial derivative are continuous. It is the same
      interchange the Fundamental Theorem states in one variable — there the
      derivative is taken in the limit of integration, here in a parameter, but
      both say that differentiation passes through the integral sign.
    rubric:
      - >
        Carries out both computations independently and gets $2y$ from each.
      - >
        Names the continuity hypothesis on the integrand and its partial derivative
        — the interchange is not free.
      - >
        Articulates the connection to the Fundamental Theorem as the shared
        derivative–integral interchange, rather than treating the agreement as a
        coincidence.
    targets:
      - analysis.mvc.leibniz-rule
      - analysis.svc.ftc-part-2
    exercises:
      - analysis.mvc.def-partial-derivative
      - analysis.svc.def-riemann-integral
    connects:
      - "analysis.mvc.leibniz-rule ~ analysis.svc.ftc-part-2"
    tags: []

  - id: mvc-leibniz-02
    kind: work
    difficulty: standard
    statement: >
      Let $I(t) = \int_0^1 e^{tx}\,dx$. Compute $I'(0)$.
    answer: >
      $\dfrac{1}{2}$. Both $e^{tx}$ and its parameter derivative
      $\dfrac{\partial}{\partial t}e^{tx} = x\,e^{tx}$ are continuous on the
      closed bounded rectangle $[0,1] \times [-1,1]$, so the rule applies and
      $I'(t) = \int_0^1 x\,e^{tx}\,dx$. At $t = 0$ the exponential is $1$ and
      what remains is $\int_0^1 x\,dx = \dfrac{1}{2}$. Evaluating the integral
      first is the harder road and confirms the answer: $I(t)
      = \dfrac{e^{t} - 1}{t}$ for $t \ne 0$, with $I(0) = 1$, and the expansion
      $\dfrac{e^{t} - 1}{t} = 1 + \dfrac{t}{2} + \dfrac{t^2}{6} + \dots$ has
      derivative $\dfrac{1}{2}$ at $t = 0$. That gap in effort — a one-line
      integral against a quotient with a removable singularity — is exactly why
      the rule is worth having.
    expects: "1/2"
    rubric:
      - >
        Differentiates the integrand with respect to $t$ while $x$ is frozen,
        obtaining $x\,e^{tx}$ and not $t\,e^{tx}$.
      - >
        Checks the two continuity hypotheses on a closed bounded rectangle
        containing $t = 0$ before interchanging.
      - >
        Substitutes $t = 0$ after differentiating, not before — setting $t = 0$
        in the integrand first gives the constant $1$ and loses the derivative.
    targets:
      - analysis.mvc.leibniz-rule
    exercises:
      - analysis.mvc.def-partial-derivative
    connects: []
    tags: []

  - id: mvc-leibniz-03
    kind: work
    difficulty: demanding
    statement: >
      Evaluate $\int_0^1 \dfrac{1}{(x + 2)^2}\,dx$ by planting a parameter:
      start from $I(t) = \int_0^1 \dfrac{1}{x + t}\,dx$, differentiate in $t$,
      and then set $t = 2$.
    answer: >
      $\dfrac{1}{6}$. On the rectangle $[0,1] \times [1,3]$ the integrand
      $\dfrac{1}{x + t}$ and its parameter derivative
      $-\dfrac{1}{(x + t)^2}$ are both continuous, since $x + t \ge 1 > 0$
      throughout, so the rule applies. Evaluating the integral directly gives
      $I(t) = \ln(1 + t) - \ln t$, hence
      $I'(t) = \dfrac{1}{1 + t} - \dfrac{1}{t}$. Differentiating under the sign
      gives $I'(t) = -\int_0^1 \dfrac{1}{(x + t)^2}\,dx$. Equating the two and
      changing sign,
      $\int_0^1 \dfrac{1}{(x + t)^2}\,dx = \dfrac{1}{t} - \dfrac{1}{1 + t}$, and
      $t = 2$ yields $\dfrac{1}{2} - \dfrac{1}{3} = \dfrac{1}{6}$. A direct
      check agrees: an antiderivative of $(x + 2)^{-2}$ is $-(x + 2)^{-1}$, and
      $-\dfrac{1}{3} + \dfrac{1}{2} = \dfrac{1}{6}$.
    expects: "1/6"
    rubric:
      - >
        Verifies both continuity hypotheses on a closed bounded rectangle of
        parameters bounded away from $t = 0$, where $x + t$ could vanish.
      - >
        Keeps the minus sign from
        $\dfrac{\partial}{\partial t}\dfrac{1}{x + t} = -\dfrac{1}{(x + t)^2}$,
        so the final answer is positive.
      - >
        Differentiates $\ln(1 + t) - \ln t$ correctly and only substitutes
        $t = 2$ at the end.
    targets:
      - analysis.mvc.leibniz-rule
    exercises:
      - analysis.mvc.def-partial-derivative
    connects: []
    tags: []

  - id: mvc-leibniz-04
    kind: decide
    difficulty: standard
    statement: >
      Let $f$ be a continuous function of one variable. Does the Leibniz
      integral rule, as stated, justify
      $\dfrac{d}{dt}\int_0^t f(x)\,dx
      = \int_0^t \dfrac{\partial f}{\partial t}(x)\,dx$?
    answer: >
      No. The rule moves a derivative past a parameter sitting inside the
      integrand while the limits of integration stay fixed; here the parameter
      is the upper limit instead, and the integrand does not depend on $t$ at
      all. That mismatch is easy to expose. Since $f(x)$ carries no $t$, the
      right-hand side is $\int_0^t 0\,dx = 0$ for every $t$, so the proposed
      identity claims that every such integral is constant in $t$. Take
      $f \equiv 1$: then $\int_0^t f(x)\,dx = t$, whose derivative is $1$, not
      $0$. What actually governs a variable endpoint is the Fundamental Theorem
      of Calculus, which gives $f(t)$ — and indeed $f(t) = 1$ here. The two
      results are cousins, both licensing a derivative to pass an integral sign,
      but they answer different questions and their hypotheses are not
      interchangeable.
    choices:
      - text: >
          Yes: $f$ is continuous, so the rule applies, and the right-hand side
          is $0$ because $f$ does not depend on $t$.
        feedback: >
          The right-hand side is indeed $0$, and that is the tell. With
          $f \equiv 1$ the integral is $t$, whose derivative is $1$. A rule that
          returns $0$ for it is being applied where it does not live.
      - text: >
          No: the rule needs constant limits of integration and moves the
          derivative past a parameter in the integrand only. A $t$ in the upper
          limit is the Fundamental Theorem's business, and contributes $f(t)$.
        correct: true
        feedback: >
          Exactly the distinction. The Leibniz rule differentiates in a
          parameter carried by the integrand over a fixed interval; a moving
          endpoint is a different mechanism with a different answer, $f(t)$.
      - text: >
          No: the rule requires $f$ to be a function of two variables, and
          $f(x)$ is a function of one.
        feedback: >
          That is not the obstruction. A one-variable $f$ can be read as a
          function of $(x,t)$ that happens to be constant in $t$, and over fixed
          limits the rule would apply and correctly report $0$. The moving
          endpoint is what disqualifies the setup.
      - text: >
          No: the rule fails because $f$ is only assumed continuous, not
          differentiable.
        feedback: >
          The rule asks for continuity of the integrand and of its
          $t$-derivative, not for differentiability in $x$. Here the
          $t$-derivative is the constant $0$, which is perfectly continuous.
    rubric:
      - >
        Answers no, and locates the failure in the variable upper limit rather
        than in a hypothesis about $f$ itself.
      - >
        Exhibits a counterexample, such as $f \equiv 1$, showing the proposed
        identity gives $0$ where the true derivative is $1$.
      - >
        Names the Fundamental Theorem of Calculus as the statement that does
        govern a variable endpoint, giving $f(t)$.
    targets:
      - analysis.mvc.leibniz-rule
    exercises: []
    connects: []
    tags: []
