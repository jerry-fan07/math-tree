# Problems targeting algebra.groups — the group axioms through the first
# isomorphism theorem.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's
# ending with something the lesson has just handed over, and a `standard` or
# `routine` one so the unit test has something fair to ask. Every `work` and
# `decide` problem is machine-checked; `justify` is reserved for the proofs
# that carry the unit — the subgroup test, Lagrange's coset count, normality
# of a kernel, the first isomorphism theorem on a concrete map. No problem
# here reuses a lesson's worked example or a card's instance: the lessons live
# in $\{1,-1,i,-i\}$, $\mathbb{Z}/12\mathbb{Z}$, $(\mathbb{Z}/15\mathbb{Z})^{\times}$,
# $S_3$ and $D_4$, so the bank works in other groups throughout. Every
# permutation product is read right to left. See ../README.md.

problems:
  # --- binary operations ------------------------------------------------------

  - id: groups-def-binary-operation-01
    kind: work
    difficulty: demanding
    statement: >
      On the set $Q$ of nonzero rational numbers define
      $a \ast b = \frac{ab}{2}$. This is a binary operation on $Q$, it is
      associative and commutative, and it has an identity. What is the inverse
      of $8$ under $\ast$? Give a fraction or a decimal.
    answer: >
      $1/2$. Three checks, in order. It is a binary operation: a product of
      nonzero rationals is a nonzero rational and halving keeps it there, so
      the value never leaves $Q$ — closure is part of the definition and it is
      the clause a rule most often fails. It is associative:
      $(a \ast b) \ast c = \frac{ab}{2} \ast c = \frac{abc}{4}$ and
      $a \ast (b \ast c) = a \ast \frac{bc}{2} = \frac{abc}{4}$, the same
      value, so the bracketing is irrelevant. The identity is not $1$: solving
      $a \ast e = \frac{ae}{2} = a$ for all $a$ gives $e = 2$, and indeed
      $2 \ast a = a$. Only now can the inverse question be asked, because an
      inverse is defined relative to *that* identity: we need $b$ with
      $8 \ast b = \frac{8b}{2} = 4b = 2$, so $b = 1/2$. Answering $1/8$ is the
      standard slip — it inverts $8$ for ordinary multiplication, whose
      identity is $1$, not for $\ast$.
    expects: "1/2"
    rubric:
      - >
        Finds the identity by solving $a \ast e = a$ for all $a$, obtaining
        $e = 2$ rather than assuming the identity is $1$.
      - >
        Solves $8 \ast b = e$ with that identity, so the answer is $1/2$ and
        not $1/8$.
    targets:
      - algebra.groups.def-binary-operation
    exercises: []
    connects: []
    tags: []

  - id: groups-def-binary-operation-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of the four rules below fails to be a binary operation on
      the set named. Which one, and what fails?
    answer: >
      The averaging rule $(a,b) \mapsto \frac{a+b}{2}$ on $\mathbb{Z}$. A
      binary operation on $X$ is a function $X \times X \to X$, so the
      codomain is $X$ itself and closure is not an extra axiom but part of the
      definition. Here $a = 1$ and $b = 2$ give $3/2$, which is not an integer,
      so the rule is not a function into $\mathbb{Z}$ at all — it is perfectly
      well behaved as a map $\mathbb{Z} \times \mathbb{Z} \to \mathbb{Q}$,
      which is exactly the point: an operation is a rule *together with* the
      set it lands in. The other three land where they must: a product of two
      odd integers is odd, since $(2m+1)(2k+1) = 2(2mk+m+k)+1$; $\max(a,b)$ of
      two integers is one of the two, hence an integer; and a quotient of two
      nonzero reals is a nonzero real. Note what is *not* being asked —
      $\max$ has no inverses and division is not associative, so neither gives
      a group, but both are perfectly good binary operations. The definition of
      an operation asks only that the output stay inside the set.
    choices:
      - text: >
          Multiplication on the odd integers
        feedback: >
          A product of odd integers is odd: $(2m+1)(2k+1) = 2(2mk+m+k)+1$. The
          output never leaves the set, so this is a binary operation.
      - text: >
          $(a,b) \mapsto \frac{a+b}{2}$ on $\mathbb{Z}$
        correct: true
        feedback: >
          Right. Taking $a = 1$ and $b = 2$ gives $3/2$, which is not an
          integer, so the rule is not a function into $\mathbb{Z}$ — and
          landing in the set is what the definition demands.
      - text: >
          $(a,b) \mapsto \max(a,b)$ on $\mathbb{Z}$
        feedback: >
          The output is one of the two inputs, hence an integer. This operation
          has no inverses, so it gives no group — but the question is only
          whether it is an operation, and it is.
      - text: >
          Division on the nonzero real numbers
        feedback: >
          A quotient of nonzero reals is a nonzero real, so this is a binary
          operation. It fails associativity, which is a different clause
          altogether.
    rubric:
      - >
        Tests each rule for closure — whether the output can leave the named
        set — rather than for the group axioms.
      - >
        Does not disqualify $\max$ or division for lacking inverses or
        associativity; those are properties an operation may or may not have.
    targets:
      - algebra.groups.def-binary-operation
    exercises: []
    connects: []
    tags: []

  # --- the group axioms -------------------------------------------------------

  - id: groups-def-group-01
    kind: decide
    difficulty: demanding
    statement: >
      Let $M = \{[1],[2],[3],[4],[5]\}$ inside $\mathbb{Z}/6\mathbb{Z}$, with
      multiplication of classes modulo $6$. Which requirement fails first, and
      why?
    answer: >
      Closure fails, and it is the first thing to go: $[2][3] = [6] = [0]$, and
      $[0]$ is not in $M$. Because the codomain of an operation is the set
      itself, this failure means $M$ does not even carry a binary operation, so
      the three axioms are never reached. The other clauses are worth checking
      to see that they would have survived: multiplication of classes is
      associative, inherited from $\mathbb{Z}$; $[1]$ is an identity; and
      $[1][1] = [1]$, $[5][5] = [25] = [1]$ give two elements their inverses.
      It is the elements $[2]$, $[3]$, $[4]$ — precisely those with
      $\gcd(a,6) > 1$ — that both break closure and lack inverses. Deleting
      them leaves $\{[1],[5]\}$, which really is a group of order $2$. The
      lesson to carry forward: when a candidate group is a subset of a larger
      structure, check closure before anything else, because a failure there
      is a failure of the definition rather than of an axiom.
    choices:
      - text: >
          Closure, since $[2][3] = [0]$ lies outside $M$
        correct: true
        feedback: >
          Right. The product of two members leaves the set, so multiplication
          is not an operation on $M$ at all, and no axiom is ever tested.
      - text: >
          (G1), associativity of multiplication of classes
        feedback: >
          Associativity is inherited from $\mathbb{Z}$: $([a][b])[c] = [abc] =
          [a]([b][c])$. It holds on any set of classes.
      - text: >
          (G2), the existence of an identity
        feedback: >
          $[1]$ lies in $M$ and $[1][a] = [a][1] = [a]$ for every class, so an
          identity is present.
      - text: >
          (G3), the existence of inverses
        feedback: >
          Inverses do fail — $[2]$ has none modulo $6$ — but that is not the
          *first* failure. Closure already broke, and it breaks in the
          definition of the operation rather than in an axiom.
    rubric:
      - >
        Checks closure before the axioms, and exhibits a specific product
        $[2][3] = [0]$ that leaves $M$.
      - >
        Recognises that associativity and the identity survive, so the answer
        is not simply "the first axiom I could not verify".
    targets:
      - algebra.groups.def-group
    exercises:
      - algebra.groups.def-binary-operation
    connects: []
    tags: []

  - id: groups-def-group-02
    kind: work
    difficulty: standard
    statement: >
      How many of these five structures are groups?
      (i) $(\mathbb{Z}, -)$, the integers under subtraction;
      (ii) the positive rational numbers under multiplication;
      (iii) $\{-1, 1\}$ under multiplication;
      (iv) all $2 \times 2$ real matrices under matrix multiplication;
      (v) the even integers under addition.
    answer: >
      $3$, namely (ii), (iii) and (v). Take them in turn. (i) fails (G1):
      $(8 - 5) - 2 = 1$ while $8 - (5 - 2) = 5$, so subtraction is not
      associative, and it is the associativity axiom rather than the identity
      that goes first. (ii) is a group: products and quotients of positive
      rationals are positive rationals, $1$ is the identity, and $p/q$ has
      inverse $q/p$. (iii) is a group of order $2$: the four products
      $1 \cdot 1 = 1$, $1 \cdot (-1) = -1$, $(-1)(-1) = 1$ stay inside, and
      each element is its own inverse. (iv) fails (G3): the zero matrix has no
      inverse, and neither does any singular matrix — deleting them is exactly
      what produces $\operatorname{GL}_2(\mathbb{R})$. (v) is a group: a sum of
      even integers is even, $0$ is even, and $-a$ is even whenever $a$ is.
      Answering $4$ usually means counting (i), whose identity $0$ and
      apparent inverses disguise the failure of associativity.
    expects: "3"
    rubric:
      - >
        Rules out subtraction by exhibiting a bracketing that changes the
        answer, not by an appeal to the identity or to inverses.
      - >
        Rules out the full matrix set by naming an element with no inverse,
        and accepts (ii), (iii) and (v) after checking closure, identity and
        inverses for each.
    targets:
      - algebra.groups.def-group
    exercises:
      - algebra.groups.def-binary-operation
    connects: []
    tags: []

  - id: groups-def-group-03
    kind: justify
    difficulty: demanding
    statement: >
      Let $G$ be a nonempty set with an associative operation for which there
      is an element $e$ with $ea = a$ for every $a \in G$ (a left identity),
      and for which every $a \in G$ has some $a'$ with $a'a = e$ (a left
      inverse). Prove that $G$ is a group — that is, that $e$ is a two-sided
      identity and each $a'$ is a two-sided inverse.
    answer: >
      Fix $a$ and a left inverse $a'$ of it, and let $a''$ be a left inverse of
      $a'$. First show $aa' = e$: compute
      $aa' = e(aa') = (a''a')(aa') = a''((a'a)a') = a''(ea') = a''a' = e$,
      where associativity was used to re-bracket and the left-inverse property
      twice. So $a'$ is a right inverse as well. Now show $ae = a$:
      $ae = a(a'a) = (aa')a = ea = a$, using the fact just proved. Hence $e$ is
      a two-sided identity and every $a'$ is a two-sided inverse, so (G1), (G2)
      and (G3) all hold and $G$ is a group. Two remarks on what the argument
      needs. Associativity does all the work — it is the only tool used to move
      brackets, and without it the conclusion is false. And the hypotheses must
      be on the *same* side: a set with a left identity and *right* inverses
      need not be a group, as the operation $a \ast b = b$ on any set with two
      or more elements shows: it is associative, every element is a left
      identity, and every element has a right inverse (any element at all
      does), yet no element is a *right* identity, since $a \ast e = e \ne a$
      whenever $e \ne a$.
    rubric:
      - >
        Proves $aa' = e$ first, introducing a left inverse $a''$ of $a'$ and
        re-bracketing with associativity; does not assume $aa' = e$ while
        proving $ae = a$.
      - >
        Deduces $ae = a$ from $aa' = e$, so the identity is shown two-sided
        only after the inverse is.
      - >
        Uses associativity explicitly at every re-bracketing, and claims
        nothing that the one-sided hypotheses do not supply.
    targets:
      - algebra.groups.def-group
    exercises:
      - algebra.groups.def-binary-operation
    connects: []
    tags: []

  # --- commutativity ----------------------------------------------------------

  - id: groups-def-abelian-01
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four groups is abelian. Which?
    answer: >
      $(\mathbb{Z}/16\mathbb{Z})^{\times}$. Multiplication of residue classes
      is commutative because multiplication of integers is:
      $[a][b] = [ab] = [ba] = [b][a]$, and restricting to the eight classes
      $[1],[3],[5],[7],[9],[11],[13],[15]$ coprime to $16$ changes nothing. The
      other three all fail, and each failure is exhibited by a single pair.
      In $S_4$, reading products right to left, $(1\,2\,3\,4)(1\,3)$ sends
      $1 \mapsto 3 \mapsto 4$ while $(1\,3)(1\,2\,3\,4)$ sends
      $1 \mapsto 2 \mapsto 2$, so the two products differ. In $D_6$ the
      relation $srs^{-1} = r^{-1}$ gives $sr = r^{-1}s = r^{5}s \ne rs$, since
      $r$ has order $6$. In $\operatorname{GL}_2(\mathbb{R})$ a shear and a
      transposed shear fail to commute. Note that being abelian is not a
      matter of size: $(\mathbb{Z}/16\mathbb{Z})^{\times}$ has order $8$ and
      $S_3$ has order $6$, and it is the smaller of the two that fails to
      commute.
    choices:
      - text: >
          $S_4$, the symmetric group on four letters
        feedback: >
          $(1\,2\,3\,4)(1\,3)$ sends $1$ to $4$ and $(1\,3)(1\,2\,3\,4)$ sends
          $1$ to $2$, so these two elements do not commute. $S_n$ is
          non-abelian for every $n \ge 3$.
      - text: >
          $D_6$, the symmetries of a regular hexagon
        feedback: >
          The defining relation $srs^{-1} = r^{-1}$ gives $sr = r^{5}s$, which
          is not $rs$ because $r$ has order $6$. Every dihedral group is
          non-abelian.
      - text: >
          $(\mathbb{Z}/16\mathbb{Z})^{\times}$, the units modulo $16$ under
          multiplication
        correct: true
        feedback: >
          Right. $[a][b] = [ab] = [ba] = [b][a]$, inherited from
          commutativity of multiplication in $\mathbb{Z}$.
      - text: >
          $\operatorname{GL}_2(\mathbb{R})$, the invertible $2 \times 2$ real
          matrices
        feedback: >
          Matrix multiplication is non-commutative for $n \ge 2$: the matrix
          with rows $(1,1)$ and $(0,1)$ times the one with rows $(1,0)$ and
          $(2,1)$ has top-left entry $3$, while the product in the other order
          has top-left entry $1$.
    rubric:
      - >
        Justifies the abelian case by commutativity of integer multiplication,
        not by checking a table.
      - >
        Refutes each of the other three with one explicit non-commuting pair.
    targets:
      - algebra.groups.def-abelian
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  - id: groups-def-abelian-02
    kind: work
    difficulty: standard
    statement: >
      In $S_4$, which has $24$ elements, how many elements commute with
      $\sigma = (1\,2\,3\,4)$? Count $\sigma$ itself and the identity.
    answer: >
      $4$. The elements commuting with $\sigma$ form a subgroup, and it
      certainly contains every power of $\sigma$: $e$, $(1\,2\,3\,4)$,
      $(1\,3)(2\,4)$ and $(1\,4\,3\,2)$, four elements in all, since powers of
      a fixed element always commute with it. There are no others. If
      $\tau\sigma\tau^{-1} = \sigma$, then because conjugation relabels the
      entries of a cycle — $\tau(a_1\,a_2\,a_3\,a_4)\tau^{-1} =
      (\tau(a_1)\,\tau(a_2)\,\tau(a_3)\,\tau(a_4))$ — the permutation $\tau$
      must carry the cyclic word $1 \to 2 \to 3 \to 4 \to 1$ to itself, and the
      only relabellings that do so are the four rotations of that word, which
      are exactly the four powers of $\sigma$. So the count is $4$ out of
      $24$: an element of a non-abelian group typically commutes with very
      little, and here with only one sixth of the group. Answering $24$ is the
      slip of assuming that a group with *some* commuting pairs is abelian;
      answering $1$ forgets that $\sigma$ and $e$ commute with $\sigma$.
    expects: "4"
    rubric:
      - >
        Lists the four powers of $\sigma$ and checks that each commutes with
        it, including $e$ and $\sigma$ itself.
      - >
        Argues that nothing else commutes, using that conjugation relabels the
        entries of the cycle, so only the four rotations of the cyclic word
        survive.
    targets:
      - algebra.groups.def-abelian
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  # --- what the axioms already force ------------------------------------------

  - id: groups-uniqueness-identity-inverse-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $G$ be a group. Prove that $(abc)^{-1} = c^{-1}b^{-1}a^{-1}$ for all
      $a,b,c \in G$, and then prove that if $x^2 = e$ for every $x \in G$ then
      $G$ is abelian. Say where uniqueness of inverses is used.
    answer: >
      For the first part it is enough to exhibit one element that multiplies
      $abc$ to $e$ on both sides, because inverses are unique: if $y$ and $z$
      both invert $w$ then $y = ye = y(wz) = (yw)z = ez = z$. Now compute
      $(abc)(c^{-1}b^{-1}a^{-1}) = ab(cc^{-1})b^{-1}a^{-1} =
      a(bb^{-1})a^{-1} = aa^{-1} = e$, and symmetrically
      $(c^{-1}b^{-1}a^{-1})(abc) = e$. Uniqueness upgrades "an inverse" to
      "the inverse", which is what licenses writing $(abc)^{-1}$ for it; note
      that the order reverses, exactly as when undoing a sequence of
      reversible steps. For the second part, suppose $x^2 = e$ for every $x$.
      Then every element is its own inverse, since $x^{-1} = x^{-1}(xx) = x$.
      Apply this to $ab$: $ab = (ab)^{-1} = b^{-1}a^{-1} = ba$, the last step
      because $b^{-1} = b$ and $a^{-1} = a$. As $a$ and $b$ were arbitrary, $G$
      is abelian. The whole argument is the reversal rule plus uniqueness;
      nothing about finiteness or about the specific group is used.
    rubric:
      - >
        Verifies $c^{-1}b^{-1}a^{-1}$ as a two-sided inverse of $abc$ by
        cancelling from the inside out, using associativity.
      - >
        States explicitly that uniqueness of inverses is what turns "is an
        inverse" into "is the inverse", so the notation $(abc)^{-1}$ is
        justified.
      - >
        Derives $x^{-1} = x$ from $x^2 = e$ and applies it to $ab$, $a$ and
        $b$ separately to reach $ab = ba$.
    targets:
      - algebra.groups.uniqueness-identity-inverse
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  - id: groups-uniqueness-identity-inverse-02
    kind: work
    difficulty: standard
    statement: >
      In the group $\mathbb{Z}/26\mathbb{Z}$ under addition, solve
      $[7] + x = [3]$. Give the answer as the representative $k$ with
      $0 \le k < 26$.
    answer: >
      $k = 22$. The equation $ax = b$ has exactly one solution in any group,
      namely $x = a^{-1}b$: applying $a^{-1}$ on the left gives $x = a^{-1}b$,
      so there is at most one solution, and substituting shows that this
      element works, so there is at least one. Here the operation is addition,
      so $a^{-1}$ means $-[7] = [-7] = [19]$, and
      $x = [-7] + [3] = [-4]$. Reducing to the canonical representative,
      $-4 + 26 = 22$, so $x = [22]$. Check it: $7 + 22 = 29 = 26 + 3$, whose
      class is $[3]$. Two things the uniqueness statement buys here. Because
      the solution is unique, $[22]$ is the *only* class that works, so no
      search is needed once one answer is found. And because the same argument
      runs in every row of the table, each class appears exactly once in the
      row of $[7]$ — the Latin-square property of a group table.
    expects: "22"
    rubric:
      - >
        Solves by adding the inverse of $[7]$, citing that $ax = b$ has the
        unique solution $x = a^{-1}b$ rather than searching the $26$ classes.
      - >
        Reduces $[-4]$ to the canonical representative $22$ and checks
        $7 + 22 \equiv 3$ modulo $26$.
    targets:
      - algebra.groups.uniqueness-identity-inverse
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  # --- order, of a group and of an element ------------------------------------

  - id: groups-def-group-order-01
    kind: work
    difficulty: standard
    statement: >
      Inside $\mathbb{Z}/20\mathbb{Z}$, the classes $[a]$ that have a
      multiplicative inverse modulo $20$ form a group under multiplication of
      classes. List them and give the order of that group.
    answer: >
      The order is $8$. A class $[a]$ is invertible modulo $20$ exactly when
      $\gcd(a,20) = 1$, since $\gcd(a,20) = 1$ supplies integers $x,y$ with
      $ax + 20y = 1$ and hence $[a][x] = [1]$, while a common factor $d > 1$
      makes every multiple of $a$ share it and $[1]$ does not. Sieving
      $1,\ldots,20$ for the integers divisible by neither $2$ nor $5$ leaves
      $1, 3, 7, 9, 11, 13, 17, 19$ — eight classes, so $|G| = 8$. It is worth
      seeing what the number $8$ does and does not tell you. It says the table
      has $64$ entries and that every element appears exactly once in each row.
      It says nothing whatever about the operation: here $[3]^2 = [9]$,
      $[3]^3 = [27] = [7]$ and $[3]^4 = [21] = [1]$, so $[3]$ has order $4$,
      whereas in the units modulo $24$ — also a group of order $8$ — every
      single element squares to $[1]$. Two groups of the same order with quite
      different tables, which is why the order is the crudest invariant a group
      carries. Answering $10$ counts the odd classes and forgets to remove the
      multiples of $5$; answering $20$ forgets the invertibility condition
      altogether.
    expects: "8"
    rubric:
      - >
        Uses $\gcd(a,20) = 1$ as the test for invertibility, and justifies it
        in at least one direction.
      - >
        Removes both the multiples of $2$ and the multiples of $5$, arriving
        at eight classes rather than ten.
    targets:
      - algebra.groups.def-group-order
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  - id: groups-def-group-order-02
    kind: work
    difficulty: demanding
    statement: >
      Let $G$ be a group with $|G| = 10$. What is the smallest possible number
      of elements $g \in G$ satisfying $g^2 = e$?
    answer: >
      $2$. Split $G$ into the elements with $g = g^{-1}$, which is the same
      condition as $g^2 = e$, and those with $g \ne g^{-1}$. The second kind
      come in genuine pairs $\{g, g^{-1}\}$: the pairing is well defined
      because inverses are unique, and it has no fixed points by the choice of
      the class, so the number of such elements is even. Hence
      $\#\{g : g^2 = e\} = 10 - (\text{an even number})$ is itself even. It is
      not zero, because $e^2 = e$ always. An even positive number is at least
      $2$, so the count is at least $2$ — and $2$ is attained, since in
      $\mathbb{Z}/10\mathbb{Z}$ the classes with $x + x = [0]$ are exactly
      $[0]$ and $[5]$. So the minimum is $2$. The argument is worth keeping:
      it says that a group of even order always contains an element of order
      exactly $2$, from nothing but the pairing of each element with its
      inverse. Answering $1$ overlooks that the total $10$ is even, which is
      what forces a partner for the identity.
    expects: "2"
    rubric:
      - >
        Pairs each $g \ne g^{-1}$ with $g^{-1}$ and concludes that the number
        of such elements is even, using uniqueness of inverses.
      - >
        Deduces that $\#\{g : g^2 = e\}$ is even, notes that it contains $e$,
        and exhibits $\mathbb{Z}/10\mathbb{Z}$ to show $2$ is attained.
    targets:
      - algebra.groups.def-group-order
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  - id: groups-def-element-order-01
    kind: work
    difficulty: standard
    statement: >
      An element $g$ of a group has order $24$. What is the order of $g^{9}$?
    answer: >
      $8$. Write $|g^{9}| = m$. The defining property of $|g| = 24$ is that
      $g^{k} = e$ if and only if $24 \mid k$; so $(g^{9})^{m} = g^{9m} = e$
      holds exactly when $24 \mid 9m$. Divide out the common factor:
      $24 \mid 9m$ says $8 \mid 3m$, and since $\gcd(8,3) = 1$ this says
      $8 \mid m$. The least positive such $m$ is $8$, so $|g^{9}| = 8$. In
      general $|g^{k}| = n/\gcd(n,k)$ when $|g| = n$, and here
      $24/\gcd(24,9) = 24/3 = 8$. Sanity check by listing the exponents that
      $g^{9}$ visits modulo $24$: $9, 18, 3, 12, 21, 6, 15, 0$ — eight steps
      before returning to the identity, as claimed. Answering $24$ assumes a
      power has the same order as the element, which happens only when the
      exponent is coprime to $24$; answering $3$ reports $\gcd(24,9)$ instead
      of the quotient.
    expects: "8"
    rubric:
      - >
        Uses that $g^{k} = e$ if and only if $|g|$ divides $k$, rather than
        multiplying out powers of an unnamed element.
      - >
        Reaches $24/\gcd(24,9) = 8$, and does not report $\gcd(24,9) = 3$.
    targets:
      - algebra.groups.def-element-order
    exercises:
      - algebra.groups.def-group-order
      - number-theory.divisibility.def-divisibility
    connects: []
    tags: []

  - id: groups-def-element-order-02
    kind: work
    difficulty: demanding
    statement: >
      An element $g$ of a group satisfies $g^{18} = e$ and $g^{30} = e$, and
      $g \ne e$. How many different values can $|g|$ take?
    answer: >
      $3$. Let $n = |g|$, which is finite because some positive power of $g$ is
      the identity. The criterion says $g^{k} = e$ if and only if $n \mid k$,
      so the two hypotheses read $n \mid 18$ and $n \mid 30$, and therefore
      $n \mid \gcd(18,30) = 6$. That is the whole force of the hypotheses: the
      set of exponents killing $g$ is closed under differences, so it is
      exactly the multiples of $n$, and two members $18$ and $30$ pin $n$ to a
      divisor of their greatest common divisor. The divisors of $6$ are $1, 2,
      3, 6$, and $n = 1$ is excluded because $g \ne e$ and only the identity
      has order $1$. That leaves $2$, $3$ and $6$ — three values, each of them
      genuinely attainable, as the classes $[3]$, $[2]$ and $[1]$ of
      $\mathbb{Z}/6\mathbb{Z}$ show. Answering $4$ forgets to exclude the
      identity; answering $1$ assumes $g^{18} = e$ forces $|g| = 18$.
    expects: "3"
    rubric:
      - >
        Converts both hypotheses into divisibility statements about $|g|$ and
        combines them into $|g| \mid \gcd(18,30) = 6$.
      - >
        Excludes $|g| = 1$ using $g \ne e$, and confirms that $2$, $3$ and $6$
        all occur, so the count is exactly $3$.
    targets:
      - algebra.groups.def-element-order
    exercises:
      - algebra.groups.def-group-order
      - number-theory.divisibility.def-divisibility
    connects: []
    tags: []

  # --- the stock of examples --------------------------------------------------

  - id: groups-ex-standard-examples-01
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four sets is a group under the operation named.
      Which one?
    answer: >
      $\operatorname{SL}_2(\mathbb{R})$, the real $2 \times 2$ matrices of
      determinant $1$, under matrix multiplication. Multiplicativity of the
      determinant gives closure, $\det(AB) = \det A \det B = 1$; the identity
      matrix has determinant $1$; and $\det(A^{-1}) = 1/\det A = 1$, so
      inverses stay inside. Each of the other three fails a different clause.
      The irrational numbers are not closed under addition —
      $\sqrt{2} + (-\sqrt{2}) = 0$ is rational — and they do not contain the
      identity $0$ either. The singular matrices, those of determinant $0$,
      have no inverses at all, and they are not closed either since the
      identity is not among them. The positive rationals under *addition* have
      no identity, because $0$ is not positive, and hence no inverses; they
      are closed and associative, which is exactly the trap. Notice that the
      four failures are of three different kinds — closure, identity,
      inverses — which is why each candidate has to be run past all of them.
    choices:
      - text: >
          The irrational numbers under addition
        feedback: >
          Not closed: $\sqrt{2} + (-\sqrt{2}) = 0$ is rational. The identity
          $0$ is missing too.
      - text: >
          $\operatorname{SL}_2(\mathbb{R})$, the real $2 \times 2$ matrices of
          determinant $1$, under multiplication
        correct: true
        feedback: >
          Right. $\det(AB) = \det A \det B$ gives closure and
          $\det(A^{-1}) = 1/\det A$ gives inverses; the identity matrix has
          determinant $1$.
      - text: >
          The real $2 \times 2$ matrices of determinant $0$, under
          multiplication
        feedback: >
          A matrix of determinant $0$ has no inverse, so (G3) fails outright;
          the identity matrix is not in the set either.
      - text: >
          The positive rational numbers under addition
        feedback: >
          Closed and associative, but $0$ is not positive, so there is no
          identity — and without one, inverses cannot even be stated. Under
          multiplication this same set *is* a group.
    rubric:
      - >
        Verifies closure, identity and inverses for the determinant-$1$
        matrices using multiplicativity of the determinant.
      - >
        Names the specific failing clause for each of the other three, and
        does not reject the positive rationals for being closed.
    targets:
      - algebra.groups.ex-standard-examples
    exercises:
      - algebra.groups.def-abelian
    connects: []
    tags: []

  - id: groups-ex-standard-examples-02
    kind: work
    difficulty: standard
    statement: >
      In $\operatorname{GL}_2(\mathbb{R})$, let $A$ be the matrix with rows
      $(2,1)$ and $(3,2)$. What is the top-left entry of $A^{-1}$?
    answer: >
      $2$. First check that $A$ really lies in the group:
      $\det A = 2 \cdot 2 - 1 \cdot 3 = 1$, which is nonzero, so $A$ is
      invertible and the question is meaningful. For a $2 \times 2$ matrix
      with rows $(a,b)$ and $(c,d)$ the inverse is
      $\frac{1}{ad-bc}$ times the matrix with rows $(d,-b)$ and $(-c,a)$;
      here $ad - bc = 1$, so $A^{-1}$ has rows $(2,-1)$ and $(-3,2)$ and the
      top-left entry is $2$. Verify by multiplying: the top-left entry of
      $AA^{-1}$ is $2 \cdot 2 + 1 \cdot (-3) = 1$ and the top-right is
      $2 \cdot (-1) + 1 \cdot 2 = 0$, and the second row gives
      $3 \cdot 2 + 2 \cdot (-3) = 0$ and $3 \cdot (-1) + 2 \cdot 2 = 1$, so
      the product is the identity. Since $\det A = 1$ the matrix and its
      inverse both lie in $\operatorname{SL}_2(\mathbb{R})$. Answering $1/2$
      inverts the entry rather than the matrix, which is not how matrix
      inverses work.
    expects: "2"
    rubric:
      - >
        Computes $\det A = 1$ first, so that invertibility is established
        rather than assumed.
      - >
        Applies the $2 \times 2$ inverse formula — swap the diagonal, negate
        the off-diagonal, divide by the determinant — and checks the product
        is the identity.
    targets:
      - algebra.groups.ex-standard-examples
    exercises:
      - algebra.groups.def-abelian
    connects: []
    tags: []

  - id: groups-ex-integers-mod-n-01
    kind: work
    difficulty: standard
    statement: >
      In the additive group $\mathbb{Z}/24\mathbb{Z}$, what is the order of the
      element $[20]$?
    answer: >
      $6$. The order of $[a]$ in $\mathbb{Z}/n\mathbb{Z}$ is $n/\gcd(a,n)$,
      because the multiples $k[a] = [ka]$ return to $[0]$ exactly when
      $n \mid ka$, and the least positive such $k$ is $n/\gcd(a,n)$. Here
      $\gcd(20,24) = 4$, so the order is $24/4 = 6$. Confirm it by adding:
      $[20]$, $[40] = [16]$, $[60] = [12]$, $[80] = [8]$, $[100] = [4]$,
      $[120] = [0]$ — six steps, and none of the first five is $[0]$. Notice
      that the multiples visited are exactly the multiples of
      $\gcd(20,24) = 4$, so $\langle [20] \rangle = \langle [4] \rangle$: an
      element and its greatest common divisor with $n$ generate the same
      subgroup. Answering $24$ treats every nonzero class as a generator, which
      only classes coprime to $24$ are; answering $4$ reports the greatest
      common divisor instead of the quotient.
    expects: "6"
    rubric:
      - >
        Uses $|[a]| = n/\gcd(a,n)$, or derives it from $n \mid ka$, rather
        than only listing multiples.
      - >
        Computes $\gcd(20,24) = 4$ and divides, giving $6$ and not $4$.
    targets:
      - algebra.groups.ex-integers-mod-n
    exercises:
      - algebra.groups.def-element-order
      - number-theory.divisibility.def-gcd
    connects: []
    tags: []

  - id: groups-ex-integers-mod-n-02
    kind: work
    difficulty: demanding
    statement: >
      How many elements of $\mathbb{Z}/30\mathbb{Z}$ have order exactly $10$?
    answer: >
      $4$. The order of $[a]$ is $30/\gcd(a,30)$, so $|[a]| = 10$ says
      $\gcd(a,30) = 3$. Among $a = 0,1,\ldots,29$ the integers with
      $\gcd(a,30) = 3$ are the multiples of $3$ that are divisible by neither
      $2$ nor $5$: from $3, 6, 9, 12, 15, 18, 21, 24, 27$ discard the even ones
      $6, 12, 18, 24$ and the multiple of $5$, namely $15$, leaving $3, 9, 21,
      27$ — four classes. Check one: $\gcd(21,30) = 3$ and $30/3 = 10$, and
      indeed $10 \cdot 21 = 210 = 7 \cdot 30$. The general statement behind the
      count is that a cyclic group of order $n$ has exactly $\varphi(d)$
      elements of order $d$ for each divisor $d$ of $n$, and here
      $\varphi(10) = 4$. Answering $3$ counts the divisors instead of the
      elements; answering $10$ confuses the number of elements of order $10$
      with the order itself.
    expects: "4"
    rubric:
      - >
        Translates "order $10$" into $\gcd(a,30) = 3$ using
        $|[a]| = 30/\gcd(a,30)$.
      - >
        Lists the classes with that greatest common divisor and discards
        $6, 12, 15, 18, 24$, arriving at exactly $[3], [9], [21], [27]$.
    targets:
      - algebra.groups.ex-integers-mod-n
    exercises:
      - algebra.groups.def-element-order
      - number-theory.divisibility.def-gcd
    connects: []
    tags: []

  - id: groups-ex-units-mod-n-01
    kind: work
    difficulty: standard
    statement: >
      What is the order of the group $(\mathbb{Z}/36\mathbb{Z})^{\times}$ of
      units modulo $36$?
    answer: >
      $12$. The group consists of the classes $[a]$ with $\gcd(a,36) = 1$, so
      its order is $\varphi(36)$. Since $36 = 2^2 \cdot 3^2$, an integer in
      $\{1,\ldots,36\}$ is coprime to $36$ exactly when it is divisible by
      neither $2$ nor $3$. Count by inclusion and exclusion: there are $18$
      multiples of $2$ and $12$ multiples of $3$, and $6$ multiples of $6$
      counted twice, so $18 + 12 - 6 = 24$ integers are excluded and
      $36 - 24 = 12$ remain. They are $1, 5, 7, 11, 13, 17, 19, 23, 25, 29, 31,
      35$ — twelve classes, as the count promised. Each really is invertible:
      $\gcd(a,36) = 1$ gives integers $x,y$ with $ax + 36y = 1$, so
      $[a][x] = [1]$. Answering $35$ counts every nonzero class, forgetting
      that $[2]$, $[3]$ and their relatives are not units; answering $18$
      removes only the even classes.
    expects: "12"
    rubric:
      - >
        Identifies the group as the classes coprime to $36$ and its order as
        $\varphi(36)$.
      - >
        Excludes both the multiples of $2$ and the multiples of $3$ without
        double-counting the multiples of $6$, reaching $12$ rather than $18$.
    targets:
      - algebra.groups.ex-units-mod-n
    exercises:
      - algebra.groups.ex-integers-mod-n
    connects: []
    tags: []

  - id: groups-ex-units-mod-n-02
    kind: work
    difficulty: demanding
    statement: >
      In $(\mathbb{Z}/26\mathbb{Z})^{\times}$, the inverse of $[7]$ is $[k]$
      with $0 \le k < 26$. What is $k$?
    answer: >
      $k = 15$. First the entry condition: $\gcd(7,26) = 1$, so $[7]$ really
      is a unit and has an inverse. Bézout's identity is what produces it. Run
      the Euclidean algorithm: $26 = 3 \cdot 7 + 5$, $7 = 1 \cdot 5 + 2$,
      $5 = 2 \cdot 2 + 1$. Back-substitute:
      $1 = 5 - 2 \cdot 2 = 5 - 2(7 - 5) = 3 \cdot 5 - 2 \cdot 7 =
      3(26 - 3 \cdot 7) - 2 \cdot 7 = 3 \cdot 26 - 11 \cdot 7$. So
      $-11 \cdot 7 \equiv 1$ modulo $26$, and $-11 + 26 = 15$ gives the
      representative in range. Check: $7 \cdot 15 = 105 = 4 \cdot 26 + 1$, so
      $[7][15] = [1]$. The same answer comes out of the group structure:
      $\varphi(26) = 12$, so $[7]^{12} = [1]$ by Lagrange and
      $[7]^{-1} = [7]^{11}$ — correct but far more work than Bézout. Answering
      $19$ inverts $7$ additively, giving $[-7]$ rather than the multiplicative
      inverse.
    expects: "15"
    rubric:
      - >
        Checks $\gcd(7,26) = 1$ before looking for an inverse, since
        coprimality is the entry condition for the group.
      - >
        Produces the inverse by Bézout or by an equivalent search, and
        verifies $7 \cdot 15 \equiv 1$ modulo $26$.
    targets:
      - algebra.groups.ex-units-mod-n
    exercises:
      - algebra.groups.ex-integers-mod-n
      - number-theory.divisibility.def-gcd
    connects: []
    tags: []

  # --- subgroups --------------------------------------------------------------

  - id: groups-def-subgroup-01
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four subsets of $\mathbb{Z}/24\mathbb{Z}$ is a
      subgroup under addition of classes. Which one?
    answer: >
      $\{[0],[6],[12],[18]\}$. It contains the identity $[0]$; it is closed,
      since a sum of multiples of $6$ is a multiple of $6$ and the four
      multiples of $6$ below $24$ are exactly the listed classes — for
      instance $[18] + [12] = [30] = [6]$; and it is closed under inverses,
      since $-[6] = [18]$ and $-[12] = [12]$. It is $\langle [6] \rangle$, of
      order $4$. Each of the others fails a specific clause. In
      $\{[0],[8],[16],[20]\}$ closure breaks: $[8] + [20] = [28] = [4]$, which
      is absent. In $\{[1],[5],[7],[11]\}$ the identity $[0]$ is missing, and
      that alone is fatal — a subgroup must contain the identity of the whole
      group. In $\{[0],[3],[6],[9],[12]\}$ closure breaks again:
      $[6] + [9] = [15]$ is absent, the set being a truncation of the genuine
      subgroup $\langle [3] \rangle$, which has eight elements. The habit worth
      forming is to look for the identity first and then to try the two
      largest elements, because that is where closure most often gives way.
    choices:
      - text: >
          $\{[0],[6],[12],[18]\}$
        correct: true
        feedback: >
          Right. These are the multiples of $6$; sums and negatives of
          multiples of $6$ are multiples of $6$, and $[0]$ is present. It is
          $\langle [6] \rangle$.
      - text: >
          $\{[0],[8],[16],[20]\}$
        feedback: >
          Not closed: $[8] + [20] = [28] = [4]$, which is not in the set.
          $\langle [8] \rangle = \{[0],[8],[16]\}$ has only three elements, and
          adding $[20]$ to it does not repair the closure.
      - text: >
          $\{[1],[5],[7],[11]\}$
        feedback: >
          The identity $[0]$ is missing, so this cannot be a subgroup whatever
          else it does. Closure fails too: $[5] + [7] = [12]$.
      - text: >
          $\{[0],[3],[6],[9],[12]\}$
        feedback: >
          Not closed: $[6] + [9] = [15]$ is absent. This is the first half of
          $\langle [3] \rangle$, which has eight elements, not five — and $5$
          does not divide $24$, a warning sign in itself.
    rubric:
      - >
        Checks the identity, closure and inverses for the winning set, and
        recognises it as $\langle [6] \rangle$.
      - >
        Exhibits one explicit failing sum for each of the two sets that break
        closure, rather than rejecting them by size alone.
    targets:
      - algebra.groups.def-subgroup
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  - id: groups-def-subgroup-02
    kind: work
    difficulty: standard
    statement: >
      The group $\mathbb{Z}/6\mathbb{Z}$ under addition has $64$ subsets. How
      many of them are subgroups?
    answer: >
      $4$. Work upward by what a subgroup must contain. Every subgroup contains
      $[0]$, which gives $\{[0]\}$. Suppose a subgroup $H$ contains $[1]$: then
      repeated addition puts $[2], [3], [4], [5]$ in $H$, so $H$ is everything;
      the same happens if $H$ contains $[5]$, since $[5] + [5] = [4]$,
      $[5] + [4] = [3]$, and so on down. Suppose $H$ contains $[2]$: closure
      forces $[4]$ and $[0]$, and $\{[0],[2],[4]\}$ is closed under addition
      and negation, so it is a subgroup; containing $[4]$ gives the same set.
      Suppose $H$ contains $[3]$: then $[3] + [3] = [0]$ and $\{[0],[3]\}$ is a
      subgroup. Any $H$ containing two classes from different rows of this
      analysis, say $[2]$ and $[3]$, also contains $[2] + [3] = [5]$ and hence
      everything. So the complete list is $\{[0]\}$, $\{[0],[3]\}$,
      $\{[0],[2],[4]\}$ and $\mathbb{Z}/6\mathbb{Z}$ — four subgroups, of
      orders $1, 2, 3, 6$, one for each divisor of $6$. Answering $2$ counts
      only the trivial subgroup and the whole group; answering $64$ forgets
      that a subset must be closed.
    expects: "4"
    rubric:
      - >
        Argues from what closure forces once a given class is admitted, rather
        than testing subsets one by one.
      - >
        Produces the four sets $\{[0]\}$, $\{[0],[3]\}$, $\{[0],[2],[4]\}$ and
        the whole group, and rules out every other subset.
    targets:
      - algebra.groups.def-subgroup
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  - id: groups-subgroup-criterion-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $G$ be a group and let
      $Z(G) = \{z \in G : zg = gz \text{ for all } g \in G\}$ be its centre.
      Use the one-step subgroup criterion — $H \le G$ if and only if
      $H \ne \emptyset$ and $ab^{-1} \in H$ for all $a,b \in H$ — to prove
      that $Z(G) \le G$. Then say why the criterion's nonemptiness clause
      cannot be dropped.
    answer: >
      Nonemptiness first, and it is not a formality: $e \in Z(G)$, because
      $eg = g = ge$ for every $g$, so $Z(G) \ne \emptyset$. Now take
      $a, b \in Z(G)$ and any $g \in G$; we must show $ab^{-1}$ commutes with
      $g$. Since $b$ is central, $bg = gb$; multiplying on both sides by
      $b^{-1}$ gives $gb^{-1} = b^{-1}g$, so $b^{-1}$ is central too — this
      little step is where the inverse enters, and it is the only place the
      argument needs care. Then
      $(ab^{-1})g = a(b^{-1}g) = a(gb^{-1}) = (ag)b^{-1} = (ga)b^{-1} =
      g(ab^{-1})$, using centrality of $b^{-1}$ and then of $a$. So
      $ab^{-1} \in Z(G)$, and the criterion gives $Z(G) \le G$. Three checks
      have collapsed into one: closure, the identity and inverses are all
      consequences of the single condition, because $a = b$ yields
      $e = aa^{-1} \in Z(G)$, then $a = e$ yields $b^{-1} \in Z(G)$, and
      finally $ab = a(b^{-1})^{-1} \in Z(G)$. Nonemptiness cannot be dropped
      because the empty set satisfies "$ab^{-1} \in H$ for all $a,b \in H$"
      vacuously, there being no such $a$ and $b$, and the empty set is not a
      group: it has no identity. Note also that $Z(G) = G$ exactly when $G$ is
      abelian, so this proposition is only interesting for non-abelian $G$.
    rubric:
      - >
        Verifies $e \in Z(G)$ explicitly, so the nonemptiness clause of the
        criterion is discharged rather than assumed.
      - >
        Shows that $b \in Z(G)$ forces $b^{-1} \in Z(G)$, and uses that to
        prove $(ab^{-1})g = g(ab^{-1})$ for an arbitrary $g \in G$.
      - >
        Explains that the empty set satisfies the closure clause vacuously and
        is not a group, so nonemptiness is doing real work.
    targets:
      - algebra.groups.subgroup-criterion
    exercises:
      - algebra.groups.def-subgroup
      - algebra.groups.uniqueness-identity-inverse
    connects: []
    tags: []

  - id: groups-subgroup-criterion-02
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of these four subsets of $\operatorname{GL}_2(\mathbb{R})$
      passes the one-step test $AB^{-1} \in H$ and so is a subgroup. Which one?
    answer: >
      The matrices with $\det A = \pm 1$. The set is nonempty, containing the
      identity matrix, and if $\det A = \pm 1$ and $\det B = \pm 1$ then
      $\det(AB^{-1}) = \det A / \det B = \pm 1$, so the one-step condition
      holds and the criterion applies at once. The others fail. The matrices
      with $\det A \ge 1$ are closed under products but not under inverses:
      $\det A = 2$ gives $\det(A^{-1}) = 1/2 < 1$, so $AB^{-1}$ escapes — this
      is the same shape of failure as the positive integers inside
      $(\mathbb{Z},+)$, and it is why the finite shortcut, where closure alone
      suffices, needs finiteness. The invertible integer matrices are closed
      under products but not inverses either: the matrix with rows $(2,0)$ and
      $(0,1)$ has inverse with rows $(1/2, 0)$ and $(0,1)$. The trace-zero
      matrices are not closed under multiplication and do not contain the
      identity, whose trace is $2$. The moral of the two middle options is
      that closure under the operation is not enough in an infinite group.
    choices:
      - text: >
          The matrices with $\det A = \pm 1$
        correct: true
        feedback: >
          Right. $\det(AB^{-1}) = \det A/\det B = \pm 1$, and the identity
          matrix is in the set, so the one-step test is satisfied.
      - text: >
          The matrices with $\det A \ge 1$
        feedback: >
          Closed under products, but $\det A = 2$ gives $\det(A^{-1}) = 1/2$,
          so inverses leave the set. Closure alone is enough only for a finite
          nonempty subset.
      - text: >
          The invertible matrices with integer entries
        feedback: >
          The matrix with rows $(2,0)$ and $(0,1)$ is invertible with integer
          entries, but its inverse has the entry $1/2$. Closure under products
          does not rescue it.
      - text: >
          The matrices of trace $0$
        feedback: >
          The identity matrix has trace $2$, so it is not in the set, and the
          set is not closed under multiplication either.
    rubric:
      - >
        Applies the test in the form $AB^{-1} \in H$, using multiplicativity of
        the determinant for the winning set.
      - >
        Names the specific inverse that escapes for each rejected set, and
        does not accept a set merely for being closed under products.
    targets:
      - algebra.groups.subgroup-criterion
    exercises:
      - algebra.groups.def-subgroup
    connects: []
    tags: []

  # --- permutations -----------------------------------------------------------

  - id: groups-def-symmetric-group-01
    kind: work
    difficulty: standard
    statement: >
      How many elements of $S_5$ send $5$ to $5$?
    answer: >
      $24$. A permutation fixing $5$ is determined by what it does to
      $\{1,2,3,4\}$, and it must permute that set, since it is a bijection of
      $\{1,2,3,4,5\}$ and $5$ is already accounted for. So such permutations
      correspond exactly to the elements of $S_4$, and there are
      $4! = 24$ of them: four choices for the image of $1$, then three for the
      image of $2$, then two, then one. As a fraction of $S_5$ this is
      $24/120 = 1/5$, which is what one should expect — by symmetry each of the
      five possible images of $5$ is taken equally often. Two further remarks.
      This set of $24$ permutations is a subgroup of $S_5$, being closed under
      composition and inverses and containing the identity, and it is a copy of
      $S_4$ sitting inside $S_5$; the same construction embeds $S_{n-1}$ in
      $S_n$ for every $n$. Answering $120$ counts all of $S_5$; answering $4$
      counts only the images of a single point.
    expects: "24"
    rubric:
      - >
        Recognises that fixing $5$ leaves a bijection of $\{1,2,3,4\}$, so the
        count is $|S_4| = 4!$.
      - >
        Reaches $24$, not $120$, and can say why the answer is one fifth of
        $|S_5|$.
    targets:
      - algebra.groups.def-symmetric-group
    exercises:
      - algebra.groups.def-group-order
    connects: []
    tags: []

  - id: groups-def-symmetric-group-02
    kind: work
    difficulty: demanding
    statement: >
      How many elements $\sigma$ of $S_4$ satisfy $\sigma^2 = \mathrm{id}$?
      Count the identity itself.
    answer: >
      $10$. The condition $\sigma^2 = \mathrm{id}$ says $\sigma$ is its own
      inverse, so $\sigma$ sends each point either to itself or to a partner
      that it sends back. The elements therefore split by how many points are
      moved. Nothing moved: the identity, $1$ element. Two points moved:
      $\sigma$ swaps them and fixes the other two, and there are
      $\binom{4}{2} = 6$ pairs, so $6$ elements. Four points moved: the four
      points split into two swapped pairs, and there are $3$ ways to split four
      objects into two unordered pairs, so $3$ elements. Three points cannot be
      moved, since the partners come two at a time. Total
      $1 + 6 + 3 = 10$ out of $24$. This is a striking number: nearly half of
      $S_4$ consists of elements that undo themselves, and the count is even,
      as the pairing argument for any group of even order forces. Answering
      $6$ counts only the swaps and forgets both the identity and the double
      swaps; answering $9$ forgets the identity alone.
    expects: "10"
    rubric:
      - >
        Classifies the solutions by how many points they move, using that
        $\sigma^2 = \mathrm{id}$ makes every moved point half of a swapped
        pair.
      - >
        Counts $1 + 6 + 3$, including the identity and the three products of
        two disjoint swaps.
    targets:
      - algebra.groups.def-symmetric-group
    exercises:
      - algebra.groups.def-group-order
    connects: []
    tags: []

  - id: groups-cycle-notation-01
    kind: work
    difficulty: standard
    statement: >
      What is the order of $(1\,4\,7)(2\,5\,3\,6)$ in $S_7$?
    answer: >
      $12$. The two cycles are disjoint — the first moves $1, 4, 7$ and the
      second moves $2, 5, 3, 6$ — so they commute, and a power of the product
      is the product of the powers:
      $\sigma^{k} = (1\,4\,7)^{k}(2\,5\,3\,6)^{k}$. Since the two factors move
      disjoint sets of points, this is the identity exactly when both factors
      are, that is when $3 \mid k$ and $4 \mid k$. The least such positive $k$
      is $\lcm(3,4) = 12$, so the order is $12$. Spot-check the near misses:
      $\sigma^{3}$ returns the $3$-cycle to rest but leaves the $4$-cycle
      advanced by three places, and $\sigma^{4}$ does the reverse, so neither
      is the identity. Answering $7$ adds the cycle lengths, which is what
      counts moved points, not the order; answering $12$ from
      $3 \cdot 4 = 12$ happens to agree here only because $3$ and $4$ are
      coprime — for $(1\,4\,7)(2\,5\,3)$ the least common multiple is $3$,
      not $9$.
    expects: "12"
    rubric:
      - >
        Notes that the cycles are disjoint and therefore commute, so the
        product is the identity exactly when both factors are.
      - >
        Takes the least common multiple of the cycle lengths, $\lcm(3,4) = 12$,
        rather than a sum or an unjustified product.
    targets:
      - algebra.groups.cycle-notation
    exercises:
      - algebra.groups.def-symmetric-group
      - algebra.groups.def-element-order
      - number-theory.divisibility.def-lcm
    connects: []
    tags: []

  - id: groups-cycle-notation-02
    kind: decide
    difficulty: demanding
    statement: >
      In $S_4$, compute the product $(1\,4\,2)(3\,4)$, reading it right to left
      as composition of functions. Which permutation is it?
    answer: >
      $(1\,4\,3\,2)$. Track each point through the right factor first and then
      the left. Point $1$: $(3\,4)$ fixes it, then $(1\,4\,2)$ sends
      $1 \mapsto 4$, so $1 \mapsto 4$. Point $4$: $(3\,4)$ sends it to $3$,
      then $(1\,4\,2)$ fixes $3$, so $4 \mapsto 3$. Point $3$: $(3\,4)$ sends
      it to $4$, then $(1\,4\,2)$ sends $4 \mapsto 2$, so $3 \mapsto 2$. Point
      $2$: $(3\,4)$ fixes it, then $(1\,4\,2)$ sends $2 \mapsto 1$, so
      $2 \mapsto 1$. Reading the chain $1 \to 4 \to 3 \to 2 \to 1$ gives the
      single cycle $(1\,4\,3\,2)$, of order $4$. The order is a useful check:
      a $3$-cycle and a transposition that share a point can compose to a
      $4$-cycle, and here the product has order $4$ while neither factor does.
      Composing in the other order gives $(3\,4)(1\,4\,2) = (1\,3\,4\,2)$, a
      different $4$-cycle, which is the concrete reason $S_4$ is non-abelian.
    choices:
      - text: >
          $(1\,4\,3\,2)$
        correct: true
        feedback: >
          Right. Following $1 \to 4 \to 3 \to 2 \to 1$ closes a single
          $4$-cycle, since the transposition and the $3$-cycle share the point
          $4$.
      - text: >
          $(1\,3\,4\,2)$
        feedback: >
          This is the product taken in the other order, $(3\,4)(1\,4\,2)$.
          Reading right to left means applying $(3\,4)$ first.
      - text: >
          $(1\,4\,2)(3\,4)$ is already in disjoint cycle form
        feedback: >
          The two cycles share the point $4$, so they are not disjoint and the
          expression is a product still waiting to be evaluated.
      - text: >
          $(1\,2)(3\,4)$
        feedback: >
          Check point $1$: $(3\,4)$ fixes it and $(1\,4\,2)$ sends it to $4$,
          so $1 \mapsto 4$, not $1 \mapsto 2$.
    rubric:
      - >
        Applies the right-hand factor first at every point, as composition of
        functions requires.
      - >
        Closes the orbit of $1$ into a single $4$-cycle and does not stop at
        the unevaluated product of two non-disjoint cycles.
    targets:
      - algebra.groups.cycle-notation
    exercises:
      - algebra.groups.def-symmetric-group
    connects: []
    tags: []

  - id: groups-cycle-notation-03
    kind: work
    difficulty: demanding
    statement: >
      How many elements of $S_6$ have order exactly $6$?
    answer: >
      $240$. The order is the least common multiple of the cycle lengths, so
      list the cycle types of $S_6$ whose lengths have least common multiple
      $6$. There are two: a single $6$-cycle, and a $3$-cycle together with a
      disjoint transposition, since $\lcm(3,2) = 6$. Nothing else works —
      $\lcm$ of parts from $\{1,2,3,4,5,6\}$ summing to $6$ is $6$ only for
      those two shapes. Count the $6$-cycles: a $6$-cycle may be written
      starting at $1$, and then the remaining five entries may be arranged
      freely, so there are $5! = 120$. Count the type $(3,2,1)$: choose the
      three points of the $3$-cycle in $\binom{6}{3} = 20$ ways and orient it
      in $2$ ways, giving $40$ three-cycles; choose the two points of the
      transposition from the remaining three in $\binom{3}{2} = 3$ ways. That
      is $40 \cdot 3 = 120$. Total $120 + 120 = 240$ elements of order $6$, out
      of $720$. Answering $120$ counts only one of the two cycle types —
      usually the $6$-cycles, forgetting that a $3$-cycle and a transposition
      also take six steps to return.
    expects: "240"
    rubric:
      - >
        Identifies both cycle types with least common multiple $6$: the
        $6$-cycles and the disjoint $3$-cycle-plus-transposition.
      - >
        Counts each type correctly — $5! = 120$ six-cycles and
        $20 \cdot 2 \cdot 3 = 120$ of the other — without double counting the
        two orientations of a cycle.
    targets:
      - algebra.groups.cycle-notation
    exercises:
      - algebra.groups.def-symmetric-group
      - algebra.groups.def-element-order
      - number-theory.divisibility.def-lcm
    connects: []
    tags: []

  - id: groups-sign-of-permutation-01
    kind: work
    difficulty: standard
    statement: >
      Let $\sigma = (1\,4\,7\,2)(3\,6)$ in $S_7$. What is $\sgn(\sigma)$?
      Answer $1$ or $-1$.
    answer: >
      $1$; the permutation is even. A $k$-cycle has sign $(-1)^{k-1}$, because
      $(a_1\,a_2\,\ldots\,a_k) = (a_1\,a_k)(a_1\,a_{k-1})\cdots(a_1\,a_2)$
      uses $k-1$ transpositions. So the $4$-cycle has sign $(-1)^{3} = -1$ and
      the transposition has sign $(-1)^{1} = -1$, and the sign is
      multiplicative, giving $\sgn(\sigma) = (-1)(-1) = +1$. Counting
      transpositions confirms it: $(1\,4\,7\,2) = (1\,2)(1\,7)(1\,4)$ uses
      three and $(3\,6)$ uses one, four in all, and $(-1)^{4} = +1$. The
      general rule is worth extracting: a permutation is even exactly when its
      decomposition contains an even number of cycles of *even* length. Here
      there are two such cycles, the $4$-cycle and the $2$-cycle, so $\sigma$
      is even. Answering $-1$ usually comes from counting the cycles rather
      than the transpositions, or from assuming that a $4$-cycle is even
      because $4$ is.
    expects: "1"
    rubric:
      - >
        Uses $(-1)^{k-1}$ for a $k$-cycle, so the $4$-cycle is odd and the
        transposition is odd.
      - >
        Multiplies the signs, or counts $3 + 1 = 4$ transpositions, reaching
        $+1$ rather than $-1$.
    targets:
      - algebra.groups.sign-of-permutation
    exercises:
      - algebra.groups.cycle-notation
    connects: []
    tags: []

  - id: groups-sign-of-permutation-02
    kind: work
    difficulty: demanding
    statement: >
      How many elements of $S_6$ are odd permutations of order $4$?
    answer: >
      $90$. Order $4$ forces the cycle lengths to have least common multiple
      $4$, and within six points the only shapes are a single $4$-cycle with
      two fixed points, and a $4$-cycle together with a disjoint
      transposition. Now separate them by sign. The $4$-cycle alone has sign
      $(-1)^{3} = -1$, so it is odd; the $4$-cycle with a transposition has
      sign $(-1)(-1) = +1$, so it is even and must be discarded. Count the odd
      ones: choose the four moved points in $\binom{6}{4} = 15$ ways and
      arrange them into a cycle in $3! = 6$ ways, giving
      $15 \cdot 6 = 90$. So $90$ of the $180$ elements of order $4$ in $S_6$
      are odd, and the other $90$ — the type with an extra transposition — are
      even. Answering $180$ counts every element of order $4$ and forgets the
      sign; answering $15$ counts the choices of moved points and forgets the
      $3!$ cyclic arrangements of them.
    expects: "90"
    rubric:
      - >
        Lists both cycle types of order $4$ in $S_6$ and computes the sign of
        each, keeping only the plain $4$-cycles.
      - >
        Counts the $4$-cycles as $\binom{6}{4} \cdot 3! = 90$, not
        $\binom{6}{4} \cdot 4!$ and not $\binom{6}{4}$ alone.
    targets:
      - algebra.groups.sign-of-permutation
    exercises:
      - algebra.groups.cycle-notation
    connects: []
    tags: []

  # --- dihedral groups, generation, cyclic groups -----------------------------

  - id: groups-def-dihedral-01
    kind: work
    difficulty: standard
    statement: >
      In $D_7$, the symmetry group of a regular heptagon, how many elements
      have order exactly $7$?
    answer: >
      $6$. The group has $|D_7| = 2 \cdot 7 = 14$ elements: the seven rotations
      $e, r, r^2, \ldots, r^{6}$ through multiples of $2\pi/7$, and the seven
      reflections $r^{i}s$. Every reflection has order $2$, since $s^2 = e$ and
      $(r^{i}s)^2 = r^{i}sr^{i}s = r^{i}r^{-i}ss = e$ using
      $sr^{i}s^{-1} = r^{-i}$; so no reflection has order $7$. Among the
      rotations, $|r| = 7$ and hence $|r^{k}| = 7/\gcd(7,k)$, which equals $7$
      for every $k = 1,\ldots,6$ because $7$ is prime, while $|e| = 1$. That
      gives exactly $6$ elements of order $7$. The tally for the whole group is
      one element of order $1$, seven of order $2$ and six of order $7$, which
      sums to $14$ as it must. Answering $7$ counts $e$ as having order $7$;
      answering $14$ forgets that the reflections are involutions.
    expects: "6"
    rubric:
      - >
        Separates the seven rotations from the seven reflections and shows
        every reflection has order $2$.
      - >
        Uses $|r^{k}| = 7/\gcd(7,k)$ with $7$ prime to get six rotations of
        order $7$, excluding the identity.
    targets:
      - algebra.groups.def-dihedral
    exercises:
      - algebra.groups.def-element-order
    connects: []
    tags: []

  - id: groups-def-dihedral-02
    kind: work
    difficulty: demanding
    statement: >
      In $D_6$, the symmetry group of a regular hexagon, how many elements have
      order exactly $2$?
    answer: >
      $7$. The group has twelve elements: the six rotations
      $e, r, r^2, r^3, r^4, r^5$ with $|r| = 6$, and the six reflections. Every
      reflection squares to the identity and is not the identity, so all six
      have order $2$. Among the rotations, $|r^{k}| = 6/\gcd(6,k)$, which is
      $2$ only when $\gcd(6,k) = 3$, that is when $k = 3$; so $r^{3}$, the
      half-turn, is the single rotation of order $2$. Total
      $6 + 1 = 7$. Two checks. The full order profile of $D_6$ is one element
      of order $1$, seven of order $2$, two of order $3$ (namely $r^2$ and
      $r^4$) and two of order $6$ (namely $r$ and $r^{5}$), summing to $12$.
      And the count $7$ is odd, so the number of elements $g$ with $g^2 = e$ is
      $7 + 1 = 8$, which is even, as the pairing of each element with its
      inverse demands. Answering $6$ counts only the reflections and misses the
      half-turn; answering $8$ counts the identity as having order $2$.
    expects: "7"
    rubric:
      - >
        Shows that all six reflections have order $2$, using $s^2 = e$ and
        $sr^{i}s^{-1} = r^{-i}$.
      - >
        Finds the one rotation of order $2$ by $|r^{k}| = 6/\gcd(6,k)$, and
        does not include the identity.
    targets:
      - algebra.groups.def-dihedral
    exercises:
      - algebra.groups.def-element-order
    connects: []
    tags: []

  - id: groups-def-generated-subgroup-01
    kind: work
    difficulty: standard
    statement: >
      Inside $\mathbb{Z}/40\mathbb{Z}$ under addition, how many elements does
      $\langle [15] \rangle$ have?
    answer: >
      $8$. The subgroup generated by a single element is the set of all its
      integer multiples, here $\{k[15] : k \in \mathbb{Z}\}$, and its size is
      the order of $[15]$, namely $40/\gcd(15,40) = 40/5 = 8$. Listing the
      multiples confirms it: $[15], [30], [45] = [5], [20], [35], [10], [25],
      [0]$, and then the list repeats — eight distinct classes, all of them
      multiples of $5$. Indeed the set obtained is exactly
      $\{[0],[5],[10],[15],[20],[25],[30],[35]\} = \langle [5] \rangle$, which
      illustrates the general fact that
      $\langle [a] \rangle = \langle [\gcd(a,n)] \rangle$ in
      $\mathbb{Z}/n\mathbb{Z}$: the smallest subgroup containing $[a]$ is
      forced to contain everything Bézout builds out of $a$ and $n$. Answering
      $40$ assumes every element generates; answering $5$ reports the greatest
      common divisor rather than the quotient.
    expects: "8"
    rubric:
      - >
        Identifies $\langle [15] \rangle$ with the set of multiples of $[15]$
        and its size with $|[15]| = 40/\gcd(15,40)$.
      - >
        Recognises the resulting set as the multiples of $5$, so that
        $\langle [15] \rangle = \langle [5] \rangle$.
    targets:
      - algebra.groups.def-generated-subgroup
    exercises:
      - algebra.groups.def-subgroup
    connects: []
    tags: []

  - id: groups-def-generated-subgroup-02
    kind: work
    difficulty: demanding
    statement: >
      Inside $\mathbb{Z}/40\mathbb{Z}$ under addition, how many elements does
      $\langle [12], [18] \rangle$ have?
    answer: >
      $20$. A subgroup containing both $[12]$ and $[18]$ contains their
      difference $[18] - [12] = [6]$, then $[12] - [6] = [6]$ again, and more
      usefully every integer combination $[12x + 18y]$. As $x$ and $y$ range
      over $\mathbb{Z}$ the integers $12x + 18y$ are exactly the multiples of
      $\gcd(12,18) = 6$, so the subgroup contains $\langle [6] \rangle$; and
      conversely $\langle [6] \rangle$ contains both generators, since
      $[12] = 2[6]$ and $[18] = 3[6]$. Hence
      $\langle [12],[18] \rangle = \langle [6] \rangle$, whose size is
      $40/\gcd(6,40) = 40/2 = 20$. The subgroup is therefore
      $\{[0],[2],[4],\ldots,[38]\}$, all twenty even classes — larger than
      either $\langle [12] \rangle$ (which has $40/4 = 10$ elements) or
      $\langle [18] \rangle$ (which has $40/2 = 20$), and equal to the second
      of those. The general rule is
      $\langle [a],[b] \rangle = \langle [\gcd(a,b,n)] \rangle$, and here
      $\gcd(12,18,40) = 2$. Answering $10$ takes only the subgroup generated by
      $[12]$; answering $40$ assumes two generators must sweep everything.
    expects: "20"
    rubric:
      - >
        Reduces the two generators to $\gcd(12,18) = 6$ using that the
        subgroup is closed under integer combinations.
      - >
        Computes the size as $40/\gcd(6,40) = 20$, or equivalently identifies
        the subgroup with the even classes.
    targets:
      - algebra.groups.def-generated-subgroup
    exercises:
      - algebra.groups.def-subgroup
    connects: []
    tags: []

  - id: groups-def-cyclic-01
    kind: work
    difficulty: standard
    statement: >
      How many generators does $\mathbb{Z}/20\mathbb{Z}$ have?
    answer: >
      $8$. A class $[a]$ generates when $\langle [a] \rangle$ is all of
      $\mathbb{Z}/20\mathbb{Z}$, that is when $|[a]| = 20$. Since
      $|[a]| = 20/\gcd(a,20)$, this happens exactly when $\gcd(a,20) = 1$, so
      the generators are the classes coprime to $20$ and there are
      $\varphi(20)$ of them. Sieving $0,\ldots,19$ for the integers divisible
      by neither $2$ nor $5$ leaves $1, 3, 7, 9, 11, 13, 17, 19$ — eight
      classes. Check one: $\gcd(9,20) = 1$, and the multiples of $[9]$ run
      $9, 18, 7, 16, 5, 14, 3, 12, 1, 10, \ldots$, visiting all twenty classes
      before returning. Note that generators come in pairs $\{[a], -[a]\}$,
      since $\langle g \rangle = \langle g^{-1} \rangle$; here
      $[1]$ pairs with $[19]$, $[3]$ with $[17]$, $[7]$ with $[13]$ and $[9]$
      with $[11]$, four pairs making eight. Answering $1$ counts only the
      obvious generator $[1]$; answering $19$ counts every nonzero class.
    expects: "8"
    rubric:
      - >
        Translates "generates" into $|[a]| = 20$ and hence into
        $\gcd(a,20) = 1$.
      - >
        Counts the classes coprime to $20$, excluding the multiples of $2$ and
        of $5$, to reach $\varphi(20) = 8$.
    targets:
      - algebra.groups.def-cyclic
    exercises:
      - algebra.groups.def-generated-subgroup
      - algebra.groups.def-element-order
    connects: []
    tags: []

  - id: groups-def-cyclic-02
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four groups is cyclic. Which?
    answer: >
      $(\mathbb{Z}/9\mathbb{Z})^{\times}$, the units modulo $9$. It has order
      $\varphi(9) = 6$, with elements $[1],[2],[4],[5],[7],[8]$, and $[2]$
      generates: its powers are $2, 4, 8, 16 \equiv 7, 14 \equiv 5,
      10 \equiv 1$, six distinct classes, so $|[2]| = 6$ and
      $\langle [2] \rangle$ is the whole group. The others fail for two
      different reasons. $(\mathbb{Z}/16\mathbb{Z})^{\times}$ is abelian of
      order $8$, but every element has order at most $4$ — for instance
      $3^2 = 9$ and $3^4 = 81 \equiv 1$, $7^2 = 49 \equiv 1$,
      $15^2 = 225 \equiv 1$ — so no element generates, and this is the
      standard reminder that abelian does not imply cyclic. $S_4$ and $D_5$ are
      not even abelian, and every cyclic group is abelian because
      $g^{i}g^{j} = g^{i+j} = g^{j}g^{i}$; so both are excluded before any
      element orders are computed. That is the efficient route through this
      question: discard the non-abelian candidates first, then hunt for an
      element whose order equals the order of the group.
    choices:
      - text: >
          $S_4$, the symmetric group on four letters
        feedback: >
          $S_4$ is non-abelian and every cyclic group is abelian, since
          $g^{i}g^{j} = g^{j}g^{i}$. No computation of orders is needed.
      - text: >
          $D_5$, the symmetries of a regular pentagon
        feedback: >
          Non-abelian, since $sr = r^{-1}s \ne rs$, so it cannot be cyclic.
          Its cyclic subgroup $\langle r \rangle$ of order $5$ is proper.
      - text: >
          $(\mathbb{Z}/16\mathbb{Z})^{\times}$, the units modulo $16$
        feedback: >
          Abelian of order $8$, but every element has order at most $4$:
          $3^4 \equiv 1$, $7^2 \equiv 1$, $15^2 \equiv 1$. Abelian does not
          imply cyclic.
      - text: >
          $(\mathbb{Z}/9\mathbb{Z})^{\times}$, the units modulo $9$
        correct: true
        feedback: >
          Right. The powers of $[2]$ are $2, 4, 8, 7, 5, 1$ — all six elements
          — so $[2]$ is a generator.
    rubric:
      - >
        Excludes the two non-abelian candidates by the fact that every cyclic
        group is abelian.
      - >
        Distinguishes the two abelian candidates by exhibiting an element
        whose order equals the group order in one, and bounding every element
        order in the other.
    targets:
      - algebra.groups.def-cyclic
    exercises:
      - algebra.groups.def-generated-subgroup
      - algebra.groups.def-element-order
      - algebra.groups.def-abelian
    connects: []
    tags: []

  # --- homomorphisms and isomorphisms -----------------------------------------

  - id: groups-def-homomorphism-01
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four maps is a group homomorphism. Which?
    answer: >
      $\varphi : \mathbb{Z}/6\mathbb{Z} \to \mathbb{Z}/6\mathbb{Z}$,
      $[a] \mapsto [4a]$. It is well defined, since replacing $a$ by $a + 6k$
      changes $4a$ by $24k$, a multiple of $6$; and it respects the operation,
      since $\varphi([a] + [b]) = [4(a+b)] = [4a] + [4b] =
      \varphi([a]) + \varphi([b])$. The forced consequences duly hold:
      $\varphi([0]) = [0]$ and $\varphi(-[a]) = -\varphi([a])$. The other three
      fail. The map $[a] \mapsto [a] + [1]$ sends the identity $[0]$ to $[1]$,
      and a homomorphism must send identity to identity — this is the quickest
      test there is, and it disposes of every translation. The map
      $x \mapsto x + 1$ on $\mathbb{R}^{\times}$ fails likewise, sending the
      identity $1$ to $2$, and it is not even a map into the nonzero reals,
      since $-1 \mapsto 0$. The map $\sigma \mapsto \sigma^{-1}$ on $S_4$
      satisfies $(\sigma\tau)^{-1} = \tau^{-1}\sigma^{-1}$, which is the
      required identity only when the two commute; taking
      $\sigma = (1\,2)$ and $\tau = (1\,3)$ gives different answers, so it
      fails. Inversion is a homomorphism exactly on abelian groups.
    choices:
      - text: >
          $\mathbb{Z}/6\mathbb{Z} \to \mathbb{Z}/6\mathbb{Z}$,
          $[a] \mapsto [a] + [1]$
        feedback: >
          It sends the identity $[0]$ to $[1]$, and every homomorphism must
          send identity to identity. Translations are never homomorphisms
          unless the shift is trivial.
      - text: >
          $\mathbb{Z}/6\mathbb{Z} \to \mathbb{Z}/6\mathbb{Z}$,
          $[a] \mapsto [4a]$
        correct: true
        feedback: >
          Right. It is well defined because $4 \cdot 6k$ is a multiple of $6$,
          and $[4(a+b)] = [4a] + [4b]$ is exactly the homomorphism property.
      - text: >
          $\mathbb{R}^{\times} \to \mathbb{R}^{\times}$, $x \mapsto x + 1$
        feedback: >
          The identity $1$ goes to $2$, so this fails at once; and
          $-1 \mapsto 0$ leaves the target group altogether.
      - text: >
          $S_4 \to S_4$, $\sigma \mapsto \sigma^{-1}$
        feedback: >
          $(\sigma\tau)^{-1} = \tau^{-1}\sigma^{-1}$, which equals
          $\sigma^{-1}\tau^{-1}$ only when the two commute. Take
          $\sigma = (1\,2)$ and $\tau = (1\,3)$ to see it fail.
    rubric:
      - >
        Checks $\varphi(ab) = \varphi(a)\varphi(b)$ for the winning map, and
        also that it is well defined on classes.
      - >
        Rejects the two translations by the forced condition
        $\varphi(e) = e$, and inversion by the reversal of order in
        $(\sigma\tau)^{-1}$.
    targets:
      - algebra.groups.def-homomorphism
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  - id: groups-def-homomorphism-02
    kind: work
    difficulty: standard
    statement: >
      How many group homomorphisms are there from $\mathbb{Z}/10\mathbb{Z}$ to
      $\mathbb{Z}/4\mathbb{Z}$?
    answer: >
      $2$. A homomorphism $\varphi$ out of $\mathbb{Z}/10\mathbb{Z}$ is
      determined by $\varphi([1])$, since every class is a multiple of $[1]$
      and $\varphi(k[1]) = k\varphi([1])$. So the question is which elements
      $y \in \mathbb{Z}/4\mathbb{Z}$ can be $\varphi([1])$. The constraint is
      $10[1] = [0]$, which forces $10y = 0$ in $\mathbb{Z}/4\mathbb{Z}$; and
      once that holds the map $k[1] \mapsto ky$ is well defined, because
      $k \equiv l$ modulo $10$ gives $ky - ly = (k-l)y$, a multiple of $10y = 0$.
      Now $10y = 0$ in $\mathbb{Z}/4\mathbb{Z}$ says $4 \mid 10y$, that is
      $2 \mid 5y$, that is $2 \mid y$, leaving $y \in \{[0],[2]\}$ — two
      choices, so two homomorphisms: the trivial one and $[k] \mapsto [2k]$.
      In general the count is $\gcd(m,n)$ for maps
      $\mathbb{Z}/m\mathbb{Z} \to \mathbb{Z}/n\mathbb{Z}$, and
      $\gcd(10,4) = 2$. Answering $4$ counts every element of the target as a
      possible image of $[1]$, forgetting the order constraint; answering $1$
      remembers only the trivial homomorphism.
    expects: "2"
    rubric:
      - >
        Observes that $\varphi$ is determined by $\varphi([1])$, because
        $[1]$ generates the source.
      - >
        Imposes $10\varphi([1]) = [0]$ in $\mathbb{Z}/4\mathbb{Z}$ and solves
        it, obtaining the two images $[0]$ and $[2]$.
    targets:
      - algebra.groups.def-homomorphism
    exercises:
      - algebra.groups.def-group
    connects: []
    tags: []

  - id: groups-def-isomorphism-01
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four pairs of groups is a pair of isomorphic
      groups. Which?
    answer: >
      $(\mathbb{Z}/9\mathbb{Z})^{\times}$ and $\mathbb{Z}/6\mathbb{Z}$. The
      first has order $\varphi(9) = 6$ and is generated by $[2]$, whose powers
      run $2, 4, 8, 7, 5, 1$; so $[k] \mapsto [2]^{k}$ is a well-defined
      bijection from $\mathbb{Z}/6\mathbb{Z}$ turning addition into
      multiplication, which is precisely an isomorphism. Each of the other
      pairs is separated by a property that any isomorphism would have to
      preserve. $\mathbb{Z}/8\mathbb{Z}$ has an element of order $8$ while
      $(\mathbb{Z}/16\mathbb{Z})^{\times}$, also of order $8$, has none, every
      element there satisfying $x^{4} = [1]$. $\mathbb{Z}/6\mathbb{Z}$ is
      abelian and $S_3$ is not, and commutativity transfers across an
      isomorphism. $(\mathbb{R},+)$ has no element of order $2$ — $x + x = 0$
      forces $x = 0$ — while $(\mathbb{R}^{\times},\cdot)$ has one, namely
      $-1$. The recipe is always the same: to *prove* an isomorphism, exhibit
      the map and check it; to *refute* one, name a property expressible in
      terms of the operation alone that the two groups do not share, and equal
      order is never enough.
    choices:
      - text: >
          $\mathbb{Z}/8\mathbb{Z}$ and $(\mathbb{Z}/16\mathbb{Z})^{\times}$
        feedback: >
          Both have order $8$, but the first has an element of order $8$ and
          in the second every element satisfies $x^{4} = [1]$. An isomorphism
          preserves the order of each element.
      - text: >
          $\mathbb{Z}/6\mathbb{Z}$ and $S_3$
        feedback: >
          Both have order $6$, but $S_3$ is non-abelian and
          $\mathbb{Z}/6\mathbb{Z}$ is abelian. Commutativity is expressible in
          terms of the operation alone, so it transfers across isomorphisms.
      - text: >
          $(\mathbb{Z}/9\mathbb{Z})^{\times}$ and $\mathbb{Z}/6\mathbb{Z}$
        correct: true
        feedback: >
          Right. $[2]$ generates the units modulo $9$, so $[k] \mapsto [2]^{k}$
          is a bijective homomorphism from $\mathbb{Z}/6\mathbb{Z}$.
      - text: >
          $(\mathbb{R},+)$ and $(\mathbb{R}^{\times},\cdot)$
        feedback: >
          In the multiplicative group $-1$ has order $2$; in the additive group
          $x + x = 0$ forces $x = 0$, so no element other than the identity has
          finite order.
    rubric:
      - >
        Exhibits an explicit isomorphism for the correct pair, rather than
        arguing only that both groups have order $6$.
      - >
        Refutes each other pair by naming one property preserved by
        isomorphism — an element order, or commutativity — on which they
        differ.
    targets:
      - algebra.groups.def-isomorphism
    exercises:
      - algebra.groups.def-homomorphism
      - algebra.groups.def-element-order
    connects: []
    tags: []

  - id: groups-def-isomorphism-02
    kind: work
    difficulty: standard
    statement: >
      How many isomorphisms are there from $\mathbb{Z}/10\mathbb{Z}$ to
      itself?
    answer: >
      $4$. Such a map $\varphi$ is determined by $\varphi([1])$, since $[1]$
      generates and $\varphi(k[1]) = k\varphi([1])$. For $\varphi$ to be a
      bijection its image $\langle \varphi([1]) \rangle$ must be the whole
      group, so $\varphi([1])$ must itself be a generator; conversely, sending
      a generator to a generator gives a surjective map between finite sets of
      equal size, hence a bijection, and it is a homomorphism by construction.
      So the isomorphisms correspond exactly to the generators of
      $\mathbb{Z}/10\mathbb{Z}$, of which there are $\varphi(10) = 4$, namely
      $[1], [3], [7], [9]$. Concretely the four maps are
      $[k] \mapsto [k], [3k], [7k], [9k]$, the first being the identity and the
      last being $[k] \mapsto -[k]$. Answering $10$ counts every possible image
      of $[1]$ and forgets that a non-generator collapses the group; answering
      $1$ remembers only the identity map. These four maps form a group in
      their own right under composition, the automorphism group of
      $\mathbb{Z}/10\mathbb{Z}$.
    expects: "4"
    rubric:
      - >
        Notes that the map is determined by the image of the generator $[1]$.
      - >
        Requires that image to be a generator, so the count is the number of
        generators $\varphi(10) = 4$, not $10$.
    targets:
      - algebra.groups.def-isomorphism
    exercises:
      - algebra.groups.def-homomorphism
      - algebra.groups.def-element-order
    connects: []
    tags: []

  - id: groups-cyclic-classification-01
    kind: work
    difficulty: standard
    statement: >
      How many subgroups does $\mathbb{Z}/36\mathbb{Z}$ have?
    answer: >
      $9$. Every subgroup of a cyclic group is cyclic: if $H \le \langle g
      \rangle$ is nontrivial, take the least $m > 0$ with $g^{m} \in H$, and
      division with remainder shows every element of $H$ is a power of
      $g^{m}$. In a cyclic group of order $n$ this gives exactly one subgroup
      of order $d$ for each divisor $d$ of $n$, so the subgroups are in
      bijection with the divisors. The divisors of $36 = 2^2 \cdot 3^2$ are
      $1, 2, 3, 4, 6, 9, 12, 18, 36$ — nine of them, since the count is
      $(2+1)(2+1) = 9$. Concretely the subgroup of order $d$ is
      $\langle [36/d] \rangle$: for $d = 9$ it is $\langle [4] \rangle$, for
      $d = 4$ it is $\langle [9] \rangle$, and so on. Answering $36$ confuses
      the number of subgroups with the order of the group; answering $2$
      remembers only the trivial subgroup and the whole group, which is the
      right answer only when the order is prime.
    expects: "9"
    rubric:
      - >
        Uses that a cyclic group of order $n$ has exactly one subgroup for
        each divisor of $n$, and says why every subgroup is cyclic.
      - >
        Counts the divisors of $36$ as $(2+1)(2+1) = 9$ from
        $36 = 2^2 \cdot 3^2$, rather than listing them incompletely.
    targets:
      - algebra.groups.cyclic-classification
    exercises:
      - algebra.groups.def-cyclic
      - number-theory.divisibility.division-algorithm
    connects: []
    tags: []

  - id: groups-cyclic-classification-02
    kind: work
    difficulty: demanding
    statement: >
      Let $G$ be a cyclic group of order $60$. How many elements of $G$ have
      order exactly $12$?
    answer: >
      $4$. The classification says $G \cong \mathbb{Z}/60\mathbb{Z}$, so the
      question may be asked there and the answer transfers, orders being
      preserved by an isomorphism. Now $|[a]| = 60/\gcd(a,60)$, so
      $|[a]| = 12$ says $\gcd(a,60) = 5$: the elements of order $12$ are the
      classes of $5, 25, 35, 55$, the multiples of $5$ below $60$ that are
      divisible by neither $2$ nor $3$. That is four elements. The structural
      way to see the same number: since $12 \mid 60$, the group has exactly one
      subgroup of order $12$, itself cyclic, and every element of order $12$
      lies in it — an element of order $12$ generates a subgroup of order $12$,
      and there is only one. A cyclic group of order $12$ has $\varphi(12) = 4$
      generators, so there are $4$ elements of order $12$ in all of $G$.
      Answering $12$ confuses the order with the count; answering $5$ counts
      the divisor rather than the classes.
    expects: "4"
    rubric:
      - >
        Uses the classification to work inside $\mathbb{Z}/60\mathbb{Z}$, or
        equivalently uses the uniqueness of the subgroup of order $12$.
      - >
        Arrives at $\varphi(12) = 4$, either by listing the classes with
        $\gcd(a,60) = 5$ or by counting the generators of the order-$12$
        subgroup.
    targets:
      - algebra.groups.cyclic-classification
    exercises:
      - algebra.groups.def-cyclic
      - algebra.groups.def-isomorphism
      - algebra.groups.ex-integers-mod-n
    connects: []
    tags: []

  # --- cosets and Lagrange ----------------------------------------------------

  - id: groups-def-coset-01
    kind: work
    difficulty: standard
    statement: >
      Let $H = \langle [10] \rangle$ inside $\mathbb{Z}/45\mathbb{Z}$ under
      addition. What is the index $[\mathbb{Z}/45\mathbb{Z} : H]$?
    answer: >
      $5$. First find $H$. Its size is the order of $[10]$, namely
      $45/\gcd(10,45) = 45/5 = 9$, and the multiples of $[10]$ are exactly the
      multiples of $[5]$, so $H = \{[0],[5],[10],\ldots,[40]\}$ with nine
      elements. The index is the number of distinct cosets $a + H$. Two
      elements lie in the same coset when their difference lies in $H$, that
      is when they are congruent modulo $5$, so the cosets are
      $H, [1]+H, [2]+H, [3]+H, [4]+H$ — five of them, and $[5]+H = H$ because
      $[5] \in H$. Each has nine elements, being a translate of $H$ by a
      bijection, and $5 \cdot 9 = 45$ accounts for the whole group with no
      overlap. Answering $9$ reports $|H|$ rather than the number of cosets;
      answering $45$ forgets that cosets are sets, not elements.
    expects: "5"
    rubric:
      - >
        Computes $|H| = 45/\gcd(10,45) = 9$ before counting cosets.
      - >
        Identifies the cosets as the classes modulo $5$ and checks
        $[G:H]\,|H| = 5 \cdot 9 = 45$.
    targets:
      - algebra.groups.def-coset
    exercises:
      - algebra.groups.def-subgroup
    connects: []
    tags: []

  - id: groups-def-coset-02
    kind: justify
    difficulty: demanding
    statement: >
      Let $H \le G$ and $a, b \in G$. Prove that $aH = bH$ if and only if
      $a^{-1}b \in H$, and deduce that a left coset $aH$ is a subgroup of $G$
      only when $aH = H$.
    answer: >
      Suppose $aH = bH$. Since $e \in H$, the element $b = be$ lies in $bH$ and
      therefore in $aH$, so $b = ah$ for some $h \in H$, whence
      $a^{-1}b = h \in H$. Conversely suppose $a^{-1}b = h \in H$, so
      $b = ah$. Then every element of $bH$ has the form $bk = ahk \in aH$,
      because $hk \in H$ by closure; so $bH \subseteq aH$. For the other
      inclusion, $a = bh^{-1}$ and the same computation with $h^{-1} \in H$
      gives $aH \subseteq bH$. Hence $aH = bH$. Now the deduction. Suppose
      $aH$ is a subgroup of $G$. Then $e \in aH$, so $e = ah$ for some
      $h \in H$, giving $a = h^{-1} \in H$. But $a \in H$ makes
      $a^{-1}e = a^{-1} \in H$, so by the criterion just proved
      $aH = eH = H$. Conversely $H$ itself is of course a subgroup. So among
      all the cosets of $H$ exactly one — $H$ itself — is a subgroup, and the
      others are merely translates: they are the same size as $H$, since
      $h \mapsto ah$ is a bijection of $H$ onto $aH$ with inverse
      $x \mapsto a^{-1}x$, but they miss the identity and are closed under
      nothing. This is why the coset decomposition tiles $G$ with equal blocks
      of which only one is a group.
    rubric:
      - >
        Proves both directions of $aH = bH \iff a^{-1}b \in H$, using
        $e \in H$ in one direction and closure of $H$ in the other.
      - >
        Deduces the subgroup claim from $e \in aH$, concluding $a \in H$ and
        hence $aH = H$; does not merely assert that cosets are not subgroups.
      - >
        Notes that every coset has $|H|$ elements via the bijection
        $h \mapsto ah$.
    targets:
      - algebra.groups.def-coset
    exercises:
      - algebra.groups.def-subgroup
    connects: []
    tags: []

  - id: groups-lagrange-01
    kind: work
    difficulty: standard
    statement: >
      A finite group $G$ has $|G| = 84$ and a subgroup $H$ with
      $[G:H] = 7$. What is $|H|$?
    answer: >
      $12$. Lagrange's theorem is the identity $|G| = [G:H]\,|H|$, obtained by
      counting $G$ block by block: the left cosets of $H$ partition $G$ into
      $[G:H]$ blocks, and every block has exactly $|H|$ elements because
      $h \mapsto ah$ is a bijection from $H$ onto $aH$. So
      $84 = 7 \cdot |H|$ and $|H| = 12$. Both factors are forced to divide
      $84$, which is the content usually quoted — the order of a subgroup
      divides the order of the group — and here $12 \mid 84$ as promised.
      Note that Lagrange gives no help in the other direction: knowing
      $12 \mid 84$ would not by itself produce a subgroup of order $12$, since
      the converse of Lagrange is false. Answering $77$ subtracts the index
      instead of dividing by it; answering $7$ reports the index back.
    expects: "12"
    rubric:
      - >
        Applies $|G| = [G:H]\,|H|$ as a product, not a sum or a difference.
      - >
        Divides to get $|H| = 84/7 = 12$ and checks that $12$ divides $84$.
    targets:
      - algebra.groups.lagrange
    exercises:
      - algebra.groups.def-coset
      - algebra.groups.def-group-order
    connects: []
    tags: []

  - id: groups-lagrange-02
    kind: justify
    difficulty: demanding
    statement: >
      Prove Lagrange's theorem: if $G$ is a finite group and $H \le G$ then
      $|G| = [G:H]\,|H|$. Say exactly where finiteness is used, and give an
      example showing the converse fails.
    answer: >
      Two facts about cosets do all the work. First, the left cosets of $H$
      partition $G$. Define $a \sim b$ to mean $a^{-1}b \in H$; this is
      reflexive because $e \in H$, symmetric because $H$ is closed under
      inverses and $(a^{-1}b)^{-1} = b^{-1}a$, and transitive because $H$ is
      closed under products and
      $(a^{-1}b)(b^{-1}c) = a^{-1}c$. So $\sim$ is an equivalence relation, and
      its class containing $a$ is exactly $aH$; the classes of an equivalence
      relation partition the set, so the cosets partition $G$. Second, all
      cosets have the same size: $h \mapsto ah$ is a map $H \to aH$, surjective
      by the definition of $aH$ and injective by cancellation, so
      $|aH| = |H|$. Now count. Let $[G:H] = k$ be the number of distinct
      cosets and write them $a_1H, \ldots, a_kH$. Because they are disjoint and
      cover $G$, $|G| = \sum_{i} |a_iH| = k|H| = [G:H]\,|H|$. Finiteness is
      used exactly here, in the step that adds finitely many finite block sizes
      to a finite total; the partition and the equal-size facts hold in any
      group, and for infinite $G$ the identity survives only as a statement
      about cardinals — indeed $[\mathbb{Z}:3\mathbb{Z}] = 3$ with both groups
      infinite. The converse fails: $A_4$ has order $12$, and $6$ divides $12$,
      yet $A_4$ has no subgroup of order $6$. Lagrange restricts which orders
      can occur without producing subgroups of those orders.
    rubric:
      - >
        Proves that the left cosets partition $G$, either by exhibiting the
        equivalence relation $a^{-1}b \in H$ or by showing two cosets that
        meet are equal.
      - >
        Proves $|aH| = |H|$ via the bijection $h \mapsto ah$, with injectivity
        from cancellation.
      - >
        Adds the block sizes and identifies finiteness as what makes the count
        meaningful; cites a counterexample to the converse.
    targets:
      - algebra.groups.lagrange
    exercises:
      - algebra.groups.def-coset
      - algebra.groups.def-group-order
    connects: []
    tags: []

  - id: groups-lagrange-03
    kind: work
    difficulty: demanding
    statement: >
      Let $G$ be a group of order $77$ and let $H \le G$ with $H \ne \{e\}$ and
      $H \ne G$. What is the largest possible value of $|H|$?
    answer: >
      $11$. By Lagrange $|H|$ divides $|G| = 77 = 7 \cdot 11$, so
      $|H| \in \{1, 7, 11, 77\}$. The hypotheses remove $1$, which would make
      $H$ trivial, and $77$, which would make $H$ the whole group; the largest
      of the two survivors is $11$. Whether a subgroup of order $11$ exists is a
      separate question that Lagrange does not answer — the theorem restricts,
      it does not construct — but the question asks only for the largest
      possible value, and $11$ is achievable: take $g \ne e$ of order $11$, if
      one exists, and $\langle g \rangle$ works. The interesting distractor is
      $38$: it is the largest integer strictly below $77$ that one might reach
      by halving, but $38$ does not divide $77$, and a proper subgroup can be
      far smaller than half the group. In fact for $|G| = 77$ the largest
      proper subgroup has at most $11/77 = 1/7$ of the elements. Answering $76$
      forgets that $|H|$ must divide, not merely be smaller.
    expects: "11"
    rubric:
      - >
        Restricts $|H|$ to the divisors of $77$ by Lagrange, listing
        $1, 7, 11, 77$.
      - >
        Excludes $1$ and $77$ by the hypotheses and takes the largest
        remaining divisor, not the largest integer below $77$.
    targets:
      - algebra.groups.lagrange
    exercises:
      - algebra.groups.def-coset
      - algebra.groups.def-group-order
      - number-theory.divisibility.def-divisibility
    connects: []
    tags: []

  - id: groups-lagrange-corollaries-01
    kind: work
    difficulty: standard
    statement: >
      A group $G$ has order $13$. How many subgroups does $G$ have in total?
    answer: >
      $2$. By Lagrange the order of a subgroup divides $13$, which is prime, so
      every subgroup has order $1$ or $13$ — that is, it is $\{e\}$ or $G$
      itself, and both certainly occur. So there are exactly two subgroups, and
      the count does not depend on which group of order $13$ is meant, because
      there is only one: for $g \ne e$ the subgroup $\langle g \rangle$ has
      order dividing $13$ and greater than $1$, hence equal to $13$, so
      $\langle g \rangle = G$ and $G$ is cyclic. Every one of the twelve
      non-identity elements is therefore a generator. This is the strongest of
      the corollaries — prime order leaves a group no freedom whatever, and
      $G \cong \mathbb{Z}/13\mathbb{Z}$. Answering $13$ counts elements rather
      than subgroups; answering $1$ forgets that $\{e\}$ and $G$ are different
      subgroups when $|G| > 1$.
    expects: "2"
    rubric:
      - >
        Uses Lagrange plus primality to restrict subgroup orders to $1$ and
        $13$.
      - >
        Notes that both occur and that they are distinct, so the total is $2$;
        may also observe that $G$ is forced to be cyclic.
    targets:
      - algebra.groups.lagrange-corollaries
    exercises:
      - algebra.groups.lagrange
      - algebra.groups.def-cyclic
      - number-theory.divisibility.def-prime
    connects: []
    tags: []

  - id: groups-lagrange-corollaries-02
    kind: work
    difficulty: demanding
    statement: >
      What is the remainder of $7^{222}$ on division by $25$?
    answer: >
      $24$. Check the hypothesis first: $\gcd(7,25) = 1$, so $[7]$ lies in the
      group $(\mathbb{Z}/25\mathbb{Z})^{\times}$ of units modulo $25$. That
      group has order $\varphi(25) = 20$, since exactly the five multiples of
      $5$ among $1,\ldots,25$ are excluded. Lagrange's corollary
      $g^{|G|} = e$ — the order of $g$ divides $|G|$, and $g^{|g|} = e$ — is
      Euler's theorem here: $7^{20} \equiv 1$ modulo $25$. Now reduce the
      exponent: $222 = 20 \cdot 11 + 2$, so
      $7^{222} = (7^{20})^{11} \cdot 7^{2} \equiv 1 \cdot 49 = 49 \equiv 24$
      modulo $25$. The remainder is $24$, equivalently $-1$. It is worth
      noticing that $|[7]|$ might be a proper divisor of $20$, and in fact
      $7^{4} = 2401 = 96 \cdot 25 + 1$, so $|[7]| = 4$ and $222 = 4 \cdot 55 +
      2$ gives the same answer more cheaply. Either route works, because
      Lagrange guarantees only that $|[7]|$ divides $20$. Answering $49$ stops
      before reducing modulo $25$; answering $7$ reduces $222$ modulo $25$
      rather than modulo the group order.
    expects: "24"
    rubric:
      - >
        Checks $\gcd(7,25) = 1$ and computes $\varphi(25) = 20$, so Euler's
        theorem applies.
      - >
        Reduces the exponent modulo $20$ (or modulo the true order $4$) rather
        than modulo $25$, and finishes with $7^{2} = 49 \equiv 24$.
    targets:
      - algebra.groups.lagrange-corollaries
    exercises:
      - algebra.groups.lagrange
      - algebra.groups.ex-units-mod-n
    connects: []
    tags: []

  # --- normality, quotients, the isomorphism theorem ---------------------------

  - id: groups-def-normal-01
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four subgroups is normal in the group containing
      it. Which?
    answer: >
      $\langle r \rangle \le D_5$, the five rotations inside the ten
      symmetries of a regular pentagon. Its index is $10/5 = 2$, and a subgroup
      of index $2$ is always normal: it has exactly two left cosets, $H$ and
      $G \setminus H$, and exactly two right cosets, which must be the same two
      sets, so $gH = Hg$ for every $g$. One can also see it directly, since
      conjugation sends a rotation to a rotation. Each of the others fails,
      and the failure is exhibited by one conjugate. In $D_5$,
      $r\,s\,r^{-1} = r^{2}s$, which is not in $\{e, s\}$, so $\langle s
      \rangle$ is not normal. In $S_4$, conjugation relabels cycle entries:
      $(1\,3)(1\,2)(1\,3)^{-1} = (3\,2)$, which is not in
      $\{e, (1\,2)\}$. And $\langle (1\,2\,3\,4) \rangle$, though of index $3$,
      is not normal either, since
      $(1\,2)(1\,2\,3\,4)(1\,2)^{-1} = (2\,1\,3\,4) = (1\,3\,4\,2)$, which is
      not among $e$, $(1\,2\,3\,4)$, $(1\,3)(2\,4)$, $(1\,4\,3\,2)$. Note what
      the index does and does not give: index $2$ forces normality, index $3$
      does not.
    choices:
      - text: >
          $\langle s \rangle = \{e, s\}$ inside $D_5$
        feedback: >
          $r\,s\,r^{-1} = r^{2}s$, a different reflection, so conjugation does
          not carry the subgroup to itself.
      - text: >
          $\langle r \rangle$, the rotations, inside $D_5$
        correct: true
        feedback: >
          Right. Its index is $2$, and a subgroup of index $2$ is always
          normal, its two left cosets and its two right cosets being the same
          pair of sets.
      - text: >
          $\langle (1\,2) \rangle = \{e, (1\,2)\}$ inside $S_4$
        feedback: >
          Conjugation relabels the entries of a cycle:
          $(1\,3)(1\,2)(1\,3)^{-1} = (2\,3)$, which is not in the subgroup.
      - text: >
          $\langle (1\,2\,3\,4) \rangle$ inside $S_4$
        feedback: >
          Its index is $3$, and index $3$ does not force normality:
          $(1\,2)(1\,2\,3\,4)(1\,2)^{-1} = (1\,3\,4\,2)$, which is not a power
          of $(1\,2\,3\,4)$.
    rubric:
      - >
        Uses the index-$2$ argument, or conjugation of rotations, for the
        subgroup that is normal.
      - >
        Exhibits one explicit conjugate leaving the subgroup for each of the
        other three, and does not treat index $3$ as sufficient.
    targets:
      - algebra.groups.def-normal
    exercises:
      - algebra.groups.def-coset
    connects: []
    tags: []

  - id: groups-def-normal-02
    kind: work
    difficulty: standard
    statement: >
      In $S_4$, the subgroup
      $V = \{e, (1\,2)(3\,4), (1\,3)(2\,4), (1\,4)(2\,3)\}$ is normal, because
      conjugation preserves cycle type and $V$ contains every element of its
      type. How many of the $24$ elements $g \in S_4$ satisfy
      $g\,(1\,2)(3\,4)\,g^{-1} = (1\,2)(3\,4)$?
    answer: >
      $8$. Normality of $V$ says that conjugation permutes $V$ as a set, not
      that it fixes each member, and this question measures the difference.
      Conjugation relabels entries:
      $g\,(1\,2)(3\,4)\,g^{-1} = (g(1)\,g(2))(g(3)\,g(4))$. This equals
      $(1\,2)(3\,4)$ exactly when $g$ preserves the partition
      $\{\{1,2\},\{3,4\}\}$ — it may swap $1$ with $2$, swap $3$ with $4$, and
      swap the two pairs wholesale. Counting those: $2$ choices inside the
      first pair, $2$ inside the second, $2$ for whether the pairs are
      exchanged, giving $2 \cdot 2 \cdot 2 = 8$ elements, namely
      $e$, $(1\,2)$, $(3\,4)$, $(1\,2)(3\,4)$, $(1\,3)(2\,4)$, $(1\,4)(2\,3)$,
      $(1\,3\,2\,4)$ and $(1\,4\,2\,3)$. So $8$ of the $24$ elements fix
      $(1\,2)(3\,4)$ under conjugation, and the remaining $16$ move it to one
      of the other two double transpositions — $8$ to each, which is why all
      three stay inside $V$ and $V$ is normal. Answering $24$ confuses
      normality of $V$ with elementwise fixing; answering $4$ counts only $V$
      itself.
    expects: "8"
    rubric:
      - >
        Uses $g\sigma g^{-1} = (g(1)\,g(2))(g(3)\,g(4))$ to turn the condition
        into preserving the partition $\{\{1,2\},\{3,4\}\}$.
      - >
        Counts $2 \cdot 2 \cdot 2 = 8$, and distinguishes normality of $V$ as a
        set from conjugation fixing each of its elements.
    targets:
      - algebra.groups.def-normal
    exercises:
      - algebra.groups.def-coset
    connects: []
    tags: []

  - id: groups-quotient-group-01
    kind: work
    difficulty: demanding
    statement: >
      Let $G = \mathbb{Z}/36\mathbb{Z}$ and $N = \langle [9] \rangle =
      \{[0],[9],[18],[27]\}$, which is normal because $G$ is abelian. What is
      the order of the element $[2] + N$ in the quotient group $G/N$?
    answer: >
      $9$. The quotient has $[G:N] = 36/4 = 9$ elements, and its identity is
      the coset $N$ itself. The order of $[2] + N$ is the least $k > 0$ with
      $k([2]+N) = [2k] + N = N$, that is the least $k$ with $[2k] \in N$. Since
      $N$ consists of the classes of multiples of $9$, we need $2k$ to be
      congruent to $0$, $9$, $18$ or $27$ modulo $36$. As $2k$ is even, the
      odd targets $9$ and $27$ are unreachable, leaving $2k \equiv 0$ or
      $2k \equiv 18$; the first needs $k = 18$ and the second needs $k = 9$.
      The least is $k = 9$. So $[2]+N$ has order $9$ and generates the whole
      quotient, which is therefore cyclic of order $9$ and isomorphic to
      $\mathbb{Z}/9\mathbb{Z}$. Notice how the order dropped: $[2]$ has order
      $18$ in $G$, and passing to the quotient collapsed it to $9$. Orders can
      only fall in a quotient, never rise, since $g^{k} = e$ already forces
      $(gN)^{k} = N$. Answering $18$ reports the order of $[2]$ in $G$;
      answering $4$ reports $|N|$.
    expects: "9"
    rubric:
      - >
        Computes in the quotient, seeking the least $k$ with $[2k] \in N$
        rather than the least $k$ with $[2k] = [0]$.
      - >
        Rules out the odd multiples of $9$ because $2k$ is even, and concludes
        $k = 9$, not $18$.
    targets:
      - algebra.groups.quotient-group
    exercises:
      - algebra.groups.def-normal
      - algebra.groups.def-coset
    connects: []
    tags: []

  - id: groups-quotient-group-02
    kind: work
    difficulty: standard
    statement: >
      In $D_6$, the symmetry group of a regular hexagon, the subgroup
      $N = \{e, r^{3}\}$ is the centre and is therefore normal. How many
      elements does the quotient group $D_6/N$ have?
    answer: >
      $6$. The quotient's elements are the left cosets of $N$, and there are
      $[D_6:N]$ of them; Lagrange gives $[D_6:N] = |D_6|/|N| = 12/2 = 6$. Each
      coset $gN = \{g, gr^{3}\}$ pairs an element with its composite with the
      half-turn, so the six cosets are $\{e, r^{3}\}$, $\{r, r^{4}\}$,
      $\{r^{2}, r^{5}\}$ and three cosets of reflections. That $N$ is normal is
      immediate here because $N$ is the centre — $gng^{-1} = ngg^{-1} = n$ for
      central $n$ — and normality is exactly what makes $(aN)(bN) = abN$ well
      defined, so the quotient is a group at all. Its structure is worth
      naming: it has order $6$ and is non-abelian, since the images of $r$ and
      $s$ still fail to commute, $sr N = r^{5}sN = r^{2}sN \ne rsN$, so
      $D_6/N \cong S_3$. Answering $12$ counts the elements of $D_6$;
      answering $2$ counts $|N|$.
    expects: "6"
    rubric:
      - >
        Computes the size of the quotient as the index $|D_6|/|N| = 6$, not as
        $|D_6|$ or $|N|$.
      - >
        Says why $N$ is normal — it is the centre — and links normality to the
        coset product being well defined.
    targets:
      - algebra.groups.quotient-group
    exercises:
      - algebra.groups.def-normal
      - algebra.groups.def-coset
    connects: []
    tags: []

  - id: groups-kernel-image-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $\varphi : G \to H$ be a group homomorphism. Prove that
      $\ker\varphi$ is a normal subgroup of $G$, and prove that $\varphi$ is
      injective if and only if $\ker\varphi = \{e_G\}$.
    answer: >
      Subgroup first, by the one-step criterion. The kernel is nonempty:
      $\varphi(e_G) = e_H$, because
      $\varphi(e_G)\varphi(e_G) = \varphi(e_Ge_G) = \varphi(e_G)$ and
      cancelling gives $\varphi(e_G) = e_H$; so $e_G \in \ker\varphi$. If
      $a, b \in \ker\varphi$ then
      $\varphi(ab^{-1}) = \varphi(a)\varphi(b)^{-1} = e_He_H^{-1} = e_H$, using
      that a homomorphism carries inverses to inverses; so
      $ab^{-1} \in \ker\varphi$ and the criterion applies. Normality next: for
      $g \in G$ and $a \in \ker\varphi$,
      $\varphi(gag^{-1}) = \varphi(g)\varphi(a)\varphi(g)^{-1} =
      \varphi(g)e_H\varphi(g)^{-1} = e_H$, so
      $g(\ker\varphi)g^{-1} \subseteq \ker\varphi$ for every $g$ — and that
      one-sided containment suffices, since applying it to $g^{-1}$ as well
      gives the reverse inclusion. Now injectivity. If $\varphi$ is injective
      then $\varphi(a) = e_H = \varphi(e_G)$ forces $a = e_G$, so the kernel is
      trivial. Conversely suppose $\ker\varphi = \{e_G\}$ and
      $\varphi(a) = \varphi(b)$. Then
      $\varphi(ab^{-1}) = \varphi(a)\varphi(b)^{-1} = e_H$, so
      $ab^{-1} \in \ker\varphi = \{e_G\}$, giving $ab^{-1} = e_G$ and $a = b$.
      The value of this is that a statement about all pairs of elements has
      been replaced by a statement about one subgroup, which is usually far
      cheaper to check.
    rubric:
      - >
        Establishes $\varphi(e_G) = e_H$ rather than assuming it, and uses the
        one-step criterion with $\varphi(ab^{-1}) = \varphi(a)\varphi(b)^{-1}$.
      - >
        Proves normality by computing $\varphi(gag^{-1}) = e_H$, and notes
        that the one-sided containment suffices.
      - >
        Proves both directions of the injectivity criterion, deriving
        $ab^{-1} \in \ker\varphi$ from $\varphi(a) = \varphi(b)$.
    targets:
      - algebra.groups.kernel-image
    exercises:
      - algebra.groups.def-homomorphism
      - algebra.groups.def-normal
      - algebra.groups.subgroup-criterion
    connects: []
    tags: []

  - id: groups-kernel-image-02
    kind: work
    difficulty: standard
    statement: >
      Let $\varphi : \mathbb{Z}/30\mathbb{Z} \to \mathbb{Z}/30\mathbb{Z}$ send
      $[a]$ to $[12a]$. How many elements does $\ker\varphi$ have?
    answer: >
      $6$. The map is a homomorphism, since
      $[12(a+b)] = [12a] + [12b]$, and well defined, since changing $a$ by a
      multiple of $30$ changes $12a$ by a multiple of $30$ times $12$. Its
      kernel is $\{[a] : 30 \mid 12a\}$. Divide by $\gcd(12,30) = 6$: the
      condition $30 \mid 12a$ says $5 \mid 2a$, and since $\gcd(2,5) = 1$ it
      says $5 \mid a$. So the kernel is
      $\{[0],[5],[10],[15],[20],[25]\}$ — six elements, and it is
      $\langle [5] \rangle$, cyclic of order $6$. Check against the fibre
      count: the image is $\langle [12] \rangle = \langle [6] \rangle$, of size
      $30/\gcd(12,30) = 5$, and $|\ker\varphi| \cdot |\im\varphi| = 6 \cdot 5 =
      30 = |G|$, as the partition of $G$ into fibres demands. Answering $5$
      reports the size of the image; answering $12$ reads the coefficient off
      the formula.
    expects: "6"
    rubric:
      - >
        Writes the kernel as $\{[a] : 30 \mid 12a\}$ and simplifies the
        divisibility with $\gcd(12,30) = 6$.
      - >
        Reaches the six classes that are multiples of $5$, and may check
        $|\ker\varphi|\cdot|\im\varphi| = 30$.
    targets:
      - algebra.groups.kernel-image
    exercises:
      - algebra.groups.def-homomorphism
    connects: []
    tags: []

  - id: groups-first-iso-01
    kind: justify
    difficulty: demanding
    statement: >
      Let $\varphi : \mathbb{Z}/36\mathbb{Z} \to \mathbb{Z}/36\mathbb{Z}$ send
      $[a]$ to $[12a]$. Compute $\ker\varphi$ and $\im\varphi$, then apply the
      First Isomorphism Theorem to identify
      $(\mathbb{Z}/36\mathbb{Z})/\ker\varphi$ concretely, checking the
      counting identity $|G| = |\ker\varphi|\cdot|\im\varphi|$.
    answer: >
      The map is well defined and a homomorphism, since $12(a + 36k) =
      12a + 36 \cdot 12k$ and $12(a+b) = 12a + 12b$. Kernel: $[a] \in
      \ker\varphi$ means $36 \mid 12a$, that is $3 \mid a$, so
      $\ker\varphi = \{[0],[3],[6],\ldots,[33]\} = \langle [3] \rangle$, with
      $12$ elements. Image: $\im\varphi = \{[12a]\} = \langle [12] \rangle =
      \{[0],[12],[24]\}$, with $3$ elements, since
      $|[12]| = 36/\gcd(12,36) = 3$. The counting identity holds:
      $12 \cdot 3 = 36 = |G|$, which is the fibre picture — three fibres, each
      a coset of the kernel and so of size $12$. Now the theorem. It asserts
      that $\bar{\varphi}(a + \ker\varphi) = \varphi(a)$ is a well-defined
      isomorphism from $G/\ker\varphi$ onto $\im\varphi$: well defined and
      injective at once, because $\varphi(a) = \varphi(b)$ holds precisely when
      $a + \ker\varphi = b + \ker\varphi$; a homomorphism, because
      $\bar{\varphi}((a + K) + (b + K)) = \varphi(a+b) = \varphi(a) +
      \varphi(b)$; and surjective onto the image by construction. Hence
      $(\mathbb{Z}/36\mathbb{Z})/\langle [3] \rangle \cong \langle [12]
      \rangle \cong \mathbb{Z}/3\mathbb{Z}$, the last step by the
      classification of cyclic groups, $\langle [12] \rangle$ being cyclic of
      order $3$. The quotient has been identified without listing a single
      coset product: quotienting out exactly what $\varphi$ forgets leaves a
      perfect copy of what $\varphi$ sees.
    rubric:
      - >
        Computes $\ker\varphi = \langle [3] \rangle$ of order $12$ and
        $\im\varphi = \langle [12] \rangle$ of order $3$, with the
        divisibility argument shown.
      - >
        States the theorem's map $\bar{\varphi}(aK) = \varphi(a)$ and says why
        it is well defined and injective for the same reason.
      - >
        Concludes $(\mathbb{Z}/36\mathbb{Z})/\ker\varphi \cong
        \mathbb{Z}/3\mathbb{Z}$ and verifies $12 \cdot 3 = 36$.
    targets:
      - algebra.groups.first-iso
    exercises:
      - algebra.groups.kernel-image
      - algebra.groups.quotient-group
      - algebra.groups.def-isomorphism
    connects: []
    tags: []

  - id: groups-first-iso-02
    kind: work
    difficulty: standard
    statement: >
      A homomorphism $\varphi$ out of a group $G$ with $|G| = 84$ has an image
      of order $14$. What is $|\ker\varphi|$?
    answer: >
      $6$. The First Isomorphism Theorem gives
      $G/\ker\varphi \cong \im\varphi$, and isomorphic groups have equal
      order, so $|G/\ker\varphi| = 14$. The quotient has
      $[G : \ker\varphi]$ elements, so $[G:\ker\varphi] = 14$, and Lagrange
      turns that into $|G| = [G:\ker\varphi]\cdot|\ker\varphi|$, that is
      $84 = 14 \cdot |\ker\varphi|$ and $|\ker\varphi| = 6$. The identity
      $|G| = |\ker\varphi| \cdot |\im\varphi|$ is worth remembering in this
      compact form: the source splits into fibres, one for each point of the
      image, all of them cosets of the kernel and so all of size
      $|\ker\varphi|$. A consistency check falls out for free — $14$ must
      divide $84$, and it does, $84 = 14 \cdot 6$; had the stated image order
      been $5$, no such homomorphism could exist. Answering $70$ subtracts
      instead of dividing; answering $14$ reports the image order back.
    expects: "6"
    rubric:
      - >
        Uses $G/\ker\varphi \cong \im\varphi$ to identify the index with the
        image order.
      - >
        Divides rather than subtracts, reaching $84/14 = 6$, and may note that
        $|\im\varphi|$ must divide $|G|$.
    targets:
      - algebra.groups.first-iso
    exercises:
      - algebra.groups.kernel-image
      - algebra.groups.quotient-group
    connects: []
    tags: []

  - id: groups-first-iso-03
    kind: decide
    difficulty: demanding
    statement: >
      A regular hexagon has three long diagonals, and every symmetry of the
      hexagon permutes them, which gives a homomorphism
      $\varphi : D_6 \to S_3$. It is surjective, and its kernel is
      $\{e, r^{3}\}$. Which group is $D_6/\{e, r^{3}\}$ isomorphic to?
    answer: >
      $S_3$. The First Isomorphism Theorem says
      $D_6/\ker\varphi \cong \im\varphi$, and here $\ker\varphi = \{e, r^{3}\}$
      while $\im\varphi = S_3$ by surjectivity, so
      $D_6/\{e,r^{3}\} \cong S_3$ immediately. The orders agree, as they must:
      $|D_6|/|\ker\varphi| = 12/2 = 6 = |S_3|$. Everything can be checked by
      hand. The half-turn $r^{3}$ maps each long diagonal to itself, so it is
      in the kernel, and no other non-identity symmetry fixes all three
      diagonals; the rotation $r$ cycles them, giving a $3$-cycle, and a
      reflection through a diagonal fixes it and swaps the other two, giving a
      transposition — so the image contains a $3$-cycle and a transposition and
      is all of $S_3$. The quotient is therefore non-abelian, which already
      rules out $\mathbb{Z}/6\mathbb{Z}$: in the quotient
      $srN = r^{5}sN = r^{2}sN$, which is not $rsN$. The theorem replaces the
      whole coset multiplication table with the observation that a natural map
      exists and the identification of what it kills.
    choices:
      - text: >
          $\mathbb{Z}/6\mathbb{Z}$
        feedback: >
          The order is right but the structure is not: the quotient is
          non-abelian, since the images of $r$ and $s$ still fail to commute,
          $srN = r^{2}sN \ne rsN$.
      - text: >
          $S_3$
        correct: true
        feedback: >
          Right. The map onto $S_3$ is surjective with kernel $\{e,r^{3}\}$, so
          the theorem gives the isomorphism directly, and $12/2 = 6 = |S_3|$.
      - text: >
          $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/2\mathbb{Z}$
        feedback: >
          This has order $4$, but the quotient has order
          $|D_6|/|\ker\varphi| = 12/2 = 6$. The orders alone rule it out.
      - text: >
          $D_6$ itself
        feedback: >
          A quotient by a subgroup of order $2$ has half as many elements, not
          the same number; $D_6/\{e,r^{3}\}$ has $6$ elements, not $12$.
    rubric:
      - >
        Applies $G/\ker\varphi \cong \im\varphi$ with the given kernel and the
        stated surjectivity, rather than building the coset table.
      - >
        Checks the order $12/2 = 6$ and rules out the abelian candidate by
        exhibiting two cosets that fail to commute.
    targets:
      - algebra.groups.first-iso
    exercises:
      - algebra.groups.kernel-image
      - algebra.groups.quotient-group
      - algebra.groups.def-isomorphism
    connects: []
    tags: []

  # --- direct products --------------------------------------------------------

  - id: groups-def-direct-product-01
    kind: work
    difficulty: standard
    statement: >
      What is the order of the element $([3],[4])$ in
      $\mathbb{Z}/9\mathbb{Z} \times \mathbb{Z}/10\mathbb{Z}$?
    answer: >
      $15$. The operation is componentwise, so
      $k([3],[4]) = (k[3], k[4])$, and this is the identity $([0],[0])$ exactly
      when both coordinates vanish — that is when $|[3]|$ divides $k$ and
      $|[4]|$ divides $k$. Hence $|(g,h)| = \lcm(|g|,|h|)$. Compute the two
      orders: in $\mathbb{Z}/9\mathbb{Z}$, $|[3]| = 9/\gcd(3,9) = 3$; in
      $\mathbb{Z}/10\mathbb{Z}$, $|[4]| = 10/\gcd(4,10) = 10/2 = 5$. So the
      order is $\lcm(3,5) = 15$. Check: $15([3],[4]) = ([45],[60]) =
      ([0],[0])$, while $3([3],[4]) = ([0],[12]) = ([0],[2])$ and
      $5([3],[4]) = ([15],[20]) = ([6],[0])$ are both nontrivial. Answering
      $90$ multiplies the group orders instead of taking a least common
      multiple of element orders; answering $12$ multiplies the two element
      orders $3$ and $4$, using the label $[4]$ rather than its order $5$.
    expects: "15"
    rubric:
      - >
        Uses $|(g,h)| = \lcm(|g|,|h|)$, justified by the componentwise
        operation.
      - >
        Computes $|[4]| = 5$ in $\mathbb{Z}/10\mathbb{Z}$ rather than reading
        the order off the label, and takes $\lcm(3,5) = 15$.
    targets:
      - algebra.groups.def-direct-product
    exercises:
      - algebra.groups.ex-integers-mod-n
      - number-theory.divisibility.def-lcm
    connects: []
    tags: []

  - id: groups-def-direct-product-02
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these four groups is isomorphic to
      $\mathbb{Z}/60\mathbb{Z}$. Which?
    answer: >
      $\mathbb{Z}/4\mathbb{Z} \times \mathbb{Z}/15\mathbb{Z}$. All four
      candidates have order $60$, so the order settles nothing; what decides is
      whether an element of order $60$ exists, since
      $\mathbb{Z}/60\mathbb{Z}$ is cyclic and cyclic-ness transfers across an
      isomorphism. Because $|(g,h)| = \lcm(|g|,|h|)$, a product
      $\mathbb{Z}/m\mathbb{Z} \times \mathbb{Z}/n\mathbb{Z}$ is cyclic exactly
      when $\lcm(m,n) = mn$, that is when $\gcd(m,n) = 1$. Here
      $\gcd(4,15) = 1$, so $([1],[1])$ has order $\lcm(4,15) = 60$ and the
      product is cyclic of order $60$, hence isomorphic to
      $\mathbb{Z}/60\mathbb{Z}$ by the classification of cyclic groups. The
      others all have a repeated prime across the factors:
      $\gcd(6,10) = 2$, so every element order divides $\lcm(6,10) = 30$;
      $\gcd(2,30) = 2$, so every element order divides $30$ again; and in
      $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/2\mathbb{Z} \times
      \mathbb{Z}/15\mathbb{Z}$ every element order divides $30$ as well. None
      of the three has an element of order $60$.
    choices:
      - text: >
          $\mathbb{Z}/6\mathbb{Z} \times \mathbb{Z}/10\mathbb{Z}$
        feedback: >
          $\gcd(6,10) = 2$, so every element order divides $\lcm(6,10) = 30$
          and no element has order $60$. The group is not cyclic.
      - text: >
          $\mathbb{Z}/4\mathbb{Z} \times \mathbb{Z}/15\mathbb{Z}$
        correct: true
        feedback: >
          Right. $\gcd(4,15) = 1$, so $([1],[1])$ has order
          $\lcm(4,15) = 60$ and generates the whole product.
      - text: >
          $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/30\mathbb{Z}$
        feedback: >
          $\gcd(2,30) = 2$, so element orders divide $\lcm(2,30) = 30$. Equal
          order is never enough for isomorphism.
      - text: >
          $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/2\mathbb{Z} \times
          \mathbb{Z}/15\mathbb{Z}$
        feedback: >
          Every element order divides $\lcm(2,2,15) = 30$, so again there is
          no element of order $60$.
    rubric:
      - >
        Recognises that all four have order $60$, so the test must be the
        existence of an element of order $60$.
      - >
        Uses $|(g,h)| = \lcm(|g|,|h|)$ and the coprimality criterion
        $\gcd(m,n) = 1$ to pick out the one cyclic product.
    targets:
      - algebra.groups.def-direct-product
    exercises:
      - algebra.groups.def-isomorphism
      - algebra.groups.ex-integers-mod-n
      - number-theory.divisibility.def-lcm
    connects: []
    tags: []
