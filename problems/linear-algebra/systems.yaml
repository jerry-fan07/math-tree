# Problems targeting linear-algebra.systems — linear systems and elimination.
#
# Authored mastery-first (§6.7): every node carries a `demanding` problem, so
# `masterySet(for:)` — which reads hardest-first — never opens a lesson's
# ending with something the lesson has just handed over, and a `standard` or
# `routine` one so the unit test has something fair to ask. Every `work` and
# `decide` problem is machine-checked; `justify` is reserved for the three
# proofs of the unit — row operations preserve the solution set, uniqueness of
# the reduced form, and more unknowns than equations — where the rubric is the
# whole instrument. Matrices are written as row lists, since the renderer has
# no matrix environment. No problem here reuses a lesson's worked example or a
# card's instance, and every number was checked by row-reducing over the
# rationals. See ../README.md.

problems:
  # --- what a linear equation is ----------------------------------------------

  - id: systems-def-linear-equation-01
    kind: decide
    difficulty: standard
    statement: >
      Exactly one of these is a linear equation in the unknowns
      $x_1, x_2, x_3$. Which one?
    answer: >
      $\sqrt{7} x_1 - \frac{2}{5} x_2 + 0 x_3 = 11$ is the linear one. The test
      is a condition on how the *unknowns* occur: each must appear to the first
      power, multiplied by a constant and touched by nothing else. Here $x_1$
      carries the constant $\sqrt{7}$, $x_2$ carries $-\frac{2}{5}$ and $x_3$
      carries $0$, and an irrational or fractional coefficient is still just a
      number, so nothing about the unknowns has been disturbed. A coefficient of
      $0$ is allowed too — the equation is then silent about $x_3$, which is
      precisely the convention that lets every equation of a system speak about
      all $n$ unknowns. The three rejects fail in three different ways:
      $x_1 x_3$ multiplies two unknowns together, $x_2^2$ raises one to a power,
      and $\frac{1}{x_1}$ buries one in a denominator, which is $x_1$ to the
      power $-1$.
    choices:
      - text: >
          $\sqrt{7} x_1 - \frac{2}{5} x_2 + 0 x_3 = 11$
        correct: true
        feedback: >
          Right. Ugly constants never break linearity, and a coefficient of $0$
          is a legitimate way for an equation to ignore an unknown.
      - text: >
          $x_1 x_3 + 2x_2 = 11$
        feedback: >
          Each unknown appears to the first power, but $x_1 x_3$ is a product of
          two unknowns rather than a constant times an unknown. Not linear.
      - text: >
          $3x_1 + x_2^2 - x_3 = 11$
        feedback: >
          The square is the fault. Linearity asks for the first power of each
          unknown; $x_2^2$ is the second.
      - text: >
          $\frac{1}{x_1} + x_2 + x_3 = 11$
        feedback: >
          An unknown in a denominator is $x_1$ raised to the power $-1$, so it
          is not a constant times $x_1$. Compare $\frac{1}{5} x_1$, which is
          linear — there the fraction is the coefficient, not the unknown.
    rubric:
      - >
        Judges each candidate by how the *unknowns* appear, not by how the
        constants look, so $\sqrt{7}$ and $\frac{2}{5}$ are not held against it.
      - >
        Accepts a coefficient of $0$ as legitimate rather than treating the
        missing unknown as a defect.
    targets:
      - linear-algebra.systems.def-linear-equation
    exercises: []
    connects: []
    tags: []

  - id: systems-def-linear-equation-02
    kind: work
    difficulty: demanding
    statement: >
      Consider the equation $(c - 4) x_1 + (c^2 - 16) x_2 = c + 4$, where $c$ is
      a real number fixed before the equation is posed. For exactly one value of
      $c$ the solution set is empty. What is that value of $c$?
    answer: >
      $c = 4$. A linear equation has an empty solution set only in the degenerate
      case: if some coefficient is nonzero the equation can always be solved for
      that unknown once the others are chosen, so emptiness requires *every*
      coefficient to vanish and the constant not to. Setting both coefficients to
      zero, $c - 4 = 0$ forces $c = 4$, and $c^2 - 16 = 0$ forces
      $c = 4$ or $c = -4$; both must hold, so $c = 4$ is the only candidate.
      Check it: at $c = 4$ the equation reads $0 x_1 + 0 x_2 = 8$, and since the
      left side is $0$ for every pair, the statement is $0 = 8$, which is false
      for every pair — the solution set is $\emptyset$. The near miss is
      instructive. At $c = -4$ the second coefficient vanishes but the first is
      $-8 \ne 0$, and the equation $-8x_1 = 0$ has the infinitely many solutions
      $(0, t)$. So a vanishing coefficient is not by itself a degeneracy; all of
      them must go, and the constant must survive.
    expects: "4"
    rubric:
      - >
        Recognises that a linear equation is unsolvable only when every
        coefficient is $0$ and the constant is not.
      - >
        Requires both coefficients to vanish simultaneously, so that $c = -4$ is
        rejected, and checks that the surviving constant $c + 4 = 8$ is nonzero.
    targets:
      - linear-algebra.systems.def-linear-equation
    exercises: []
    connects: []
    tags: []

  # --- systems -----------------------------------------------------------------

  - id: systems-def-linear-system-01
    kind: work
    difficulty: standard
    statement: >
      The system $4x_1 - x_2 + 2x_3 = 3$, $x_2 - 7x_3 = 1$, $6x_1 = 5$ has three
      equations in the three unknowns $x_1, x_2, x_3$, so it has nine
      coefficients $a_{ij}$. How many of those nine are zero?
    answer: >
      $3$. Write each equation out in full, supplying a $0$ wherever an unknown
      is absent, because an unknown missing from an equation has coefficient $0$
      there rather than no coefficient at all. The first equation is already
      complete: $a_{11} = 4$, $a_{12} = -1$, $a_{13} = 2$, none of them zero. The
      second is $0 x_1 + x_2 - 7 x_3 = 1$, so $a_{21} = 0$, $a_{22} = 1$,
      $a_{23} = -7$ — one zero. The third is $6 x_1 + 0 x_2 + 0 x_3 = 5$, so
      $a_{31} = 6$, $a_{32} = 0$, $a_{33} = 0$ — two more. That is $0 + 1 + 2 =
      3$ zeros in all. The count matters because those zeros are exactly the
      entries that must be written into the coefficient matrix: leave one out and
      every entry to its right slides into the wrong unknown's column.
    expects: "3"
    rubric:
      - >
        Supplies a $0$ for every absent unknown rather than treating the
        equation as having fewer coefficients.
      - >
        Counts across all three equations — one zero in the second, two in the
        third — and reports $3$, not $2$ or $4$.
    targets:
      - linear-algebra.systems.def-linear-system
    exercises: []
    connects: []
    tags: []

  - id: systems-def-linear-system-02
    kind: decide
    difficulty: demanding
    statement: >
      Consider the system $2x_1 - x_2 + x_3 = 3$, $x_1 + x_2 - 2x_3 = -3$,
      $3x_1 + 2x_2 + x_3 = 10$. Which of the four tuples below is a solution of
      the system?
    answer: >
      $(1, 2, 3)$. A solution must clear every equation, so test all three each
      time. For $(1, 2, 3)$: $2 - 2 + 3 = 3$, true; $1 + 2 - 6 = -3$, true;
      $3 + 4 + 3 = 10$, true. The other three each fail somewhere, and they fail
      in the three ways worth knowing. $(2, 7, 6)$ satisfies the first two —
      $4 - 7 + 6 = 3$ and $2 + 7 - 12 = -3$ — because the first two equations
      alone leave a whole family of solutions, but the third gives
      $6 + 14 + 6 = 26 \ne 10$. $(4, 1, -4)$ satisfies the first and the third —
      $8 - 1 - 4 = 3$ and $12 + 2 - 4 = 10$ — but the second gives
      $4 + 1 + 8 = 13 \ne -3$. And $(3, 2, 1)$ is $(1, 2, 3)$ with its first and
      last entries exchanged, which fails the first equation, $6 - 2 + 1 = 5$:
      the tuple is *ordered*, and the first slot belongs to $x_1$.
    choices:
      - text: >
          $(1, 2, 3)$
        correct: true
        feedback: >
          All three checks pass: $2 - 2 + 3 = 3$, $1 + 2 - 6 = -3$, and
          $3 + 4 + 3 = 10$.
      - text: >
          $(2, 7, 6)$
        feedback: >
          It clears the first two equations, and stopping there is the classic
          error. The third gives $6 + 14 + 6 = 26$, not $10$, and one failure
          disqualifies a candidate however many equations it passes.
      - text: >
          $(4, 1, -4)$
        feedback: >
          The first and third equations hold, but the second gives
          $4 + 1 + 8 = 13$, not $-3$. Two out of three is not a solution.
      - text: >
          $(3, 2, 1)$
        feedback: >
          These are the right three numbers in the wrong order. Substituting in
          order gives $6 - 2 + 1 = 5$ for the first equation, not $3$; the first
          slot belongs to $x_1$ and the third to $x_3$.
    rubric:
      - >
        Substitutes each candidate into all three equations rather than stopping
        at the first success.
      - >
        Treats the tuple as ordered, so that a permutation of a solution's
        entries is not itself accepted.
    targets:
      - linear-algebra.systems.def-linear-system
    exercises: []
    connects: []
    tags: []

  # --- solution sets -----------------------------------------------------------

  - id: systems-def-solution-set-01
    kind: work
    difficulty: routine
    statement: >
      Let $S_1$ be the solution set of $x_1 + x_2 + x_3 = 6$ and $S_2$ the
      solution set of $x_1 - x_2 = 0$, both inside $\mathbb{R}^3$. How many of
      the four tuples $(2, 2, 2)$, $(3, 3, 0)$, $(1, 1, 4)$, $(4, 2, 0)$ lie in
      $S_1 \cap S_2$?
    answer: >
      $3$. The solution set of the two-equation system is $S_1 \cap S_2$, so a
      tuple qualifies exactly when it satisfies both conditions. Test each.
      $(2,2,2)$: the sum is $6$ and $2 - 2 = 0$, so it lies in both. $(3,3,0)$:
      the sum is $6$ and $3 - 3 = 0$, in both. $(1,1,4)$: the sum is $6$ and
      $1 - 1 = 0$, in both. $(4,2,0)$: the sum is $6$, so it lies in $S_1$, but
      $4 - 2 = 2 \ne 0$, so it is outside $S_2$ and therefore outside the
      intersection. Three of the four qualify. Notice what the fourth tuple
      shows: membership in one of the sets says nothing about membership in the
      intersection, which is why solving a system is never a matter of solving
      its equations one at a time.
    expects: "3"
    rubric:
      - >
        Reads the system's solution set as the intersection $S_1 \cap S_2$ and
        tests each tuple against both equations.
      - >
        Excludes $(4,2,0)$ on the strength of the second equation alone, even
        though it satisfies the first.
    targets:
      - linear-algebra.systems.def-solution-set
    exercises: []
    connects: []
    tags: []

  - id: systems-def-solution-set-02
    kind: decide
    difficulty: demanding
    statement: >
      Which system is equivalent to $x_1 + 2x_2 - x_3 = 1$,
      $2x_1 + 3x_2 + x_3 = 4$ — that is, which one has exactly the same solution
      set?
    answer: >
      The pair $x_1 + 5x_3 = 5$, $x_2 - 3x_3 = -2$. Solve the original first.
      Subtracting twice the first equation from the second gives
      $-x_2 + 3x_3 = 2$, so $x_2 = 3x_3 - 2$; substituting into the first,
      $x_1 = 1 - 2(3x_3 - 2) + x_3 = 5 - 5x_3$. With $x_3 = t$ the solution set
      is every $(5 - 5t,\ 3t - 2,\ t)$. The winning pair says $x_1 = 5 - 5x_3$
      and $x_2 = -2 + 3x_3$, which is that same family written out, so the two
      systems are equivalent — and note they need not resemble each other, only
      agree as sets. Of the rest: keeping only the first equation *enlarges* the
      set, since $(1, 0, 0)$ then qualifies and it fails
      $2x_1 + 3x_2 + x_3 = 4$; adjoining $3x_1 + 5x_2 = 6$ empties it, because
      the sum of the two original equations is $3x_1 + 5x_2 = 5$ and no tuple
      makes the same expression equal both $5$ and $6$; and $x_2 - 3x_3 = 2$
      has the sign of the constant wrong, so it excludes $(5, -2, 0)$, which
      does solve the original.
    choices:
      - text: >
          $x_1 + 5x_3 = 5$, $x_2 - 3x_3 = -2$
        correct: true
        feedback: >
          Exactly the family $(5 - 5t, 3t - 2, t)$, written with each basic
          variable isolated. Same set, different appearance — which is all
          equivalence asks.
      - text: >
          $x_1 + 2x_2 - x_3 = 1$
        feedback: >
          Dropping an equation can only enlarge the solution set, and here it
          does: $(1, 0, 0)$ satisfies this one and gives $2 \ne 4$ in the
          discarded second equation.
      - text: >
          $x_1 + 2x_2 - x_3 = 1$, $2x_1 + 3x_2 + x_3 = 4$, $3x_1 + 5x_2 = 6$
        feedback: >
          Adding the two original equations gives $3x_1 + 5x_2 = 5$, so the
          third equation here demands that the same expression equal $6$ as
          well. The solution set is empty, not unchanged.
      - text: >
          $x_1 + 5x_3 = 5$, $x_2 - 3x_3 = 2$
        feedback: >
          One sign off. The tuple $(5, -2, 0)$ solves the original system, and
          here the second equation would require $x_2 = 2$ when $x_3 = 0$.
    rubric:
      - >
        Solves the original system to a parametric description before comparing,
        rather than judging by how the equations look.
      - >
        Says why each rejected system fails as a set — one too large, one empty,
        one shifted — not merely that it differs in form.
    targets:
      - linear-algebra.systems.def-solution-set
    exercises: []
    connects: []
    tags: []

  # --- consistency -------------------------------------------------------------

  - id: systems-def-consistent-01
    kind: work
    difficulty: standard
    statement: >
      For exactly one value of $k$ the system $x_1 + 2x_2 + x_3 = 3$,
      $2x_1 + 5x_2 - x_3 = 4$, $3x_1 + 7x_2 + k x_3 = 8$ is inconsistent. What is
      that value of $k$?
    answer: >
      $k = 0$. Combine the equations until the unknowns are gone and see what the
      constants are forced to say. Subtracting twice the first equation from the
      second leaves $x_2 - 3x_3 = -2$; subtracting three times the first from the
      third leaves $x_2 + (k - 3) x_3 = -1$. Subtracting the first of those from
      the second leaves $k x_3 = 1$. If $k \ne 0$ this is a perfectly solvable
      equation, $x_3 = \frac{1}{k}$, and the system is consistent. If $k = 0$ it
      reads $0 = 1$, which no tuple satisfies, so the system is inconsistent.
      Check $k = 0$ directly: the third equation is then
      $3x_1 + 7x_2 = 8$, while the first two force $3x_1 + 7x_2 = 3 + 4 = 7$,
      and $7 \ne 8$. Note that the inconsistency needed all three equations —
      no pair of them contradicts anything, and no single equation is
      unsolvable.
    expects: "0"
    rubric:
      - >
        Eliminates until an equation with no unknowns is reached, rather than
        inspecting the equations one at a time.
      - >
        Identifies $k = 0$ as the case in which the surviving equation reads
        $0 = 1$, and notes that every other $k$ leaves it solvable.
    targets:
      - linear-algebra.systems.def-consistent
    exercises: []
    connects: []
    tags: []

  - id: systems-def-consistent-02
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of the systems below is inconsistent. Which one?
    answer: >
      The system $2x_1 + x_2 = 3$, $x_2 - x_3 = 1$, $2x_1 + 2x_2 - x_3 = 6$ is
      the inconsistent one, and no two of its equations reveal it. Add the first
      two: $2x_1 + 2x_2 - x_3 = 4$. Any tuple satisfying both must satisfy that,
      while the third equation demands $2x_1 + 2x_2 - x_3 = 6$; subtracting gives
      $0 = 2$, so no tuple can do all three. Every pair, by contrast, is
      solvable: equations one and two alone are satisfied by $(1, 1, 0)$,
      equations one and three by $(0, 3, 0)$, and equations two and three by
      $(2, 1, 0)$. Changing the third constant from $6$ to $4$ makes the whole
      system consistent, with solution set every
      $(\frac{2 - t}{2},\ 1 + t,\ t)$. The other candidates: the two-equation
      system $x_1 + 3x_2 = 2$, $2x_1 - x_2 = 4$ has the unique solution
      $(2, 0)$, and a single equation with a nonzero coefficient always has
      solutions.
    choices:
      - text: >
          $2x_1 + x_2 = 3$, $x_2 - x_3 = 1$, $2x_1 + 2x_2 - x_3 = 6$
        correct: true
        feedback: >
          Adding the first two gives $2x_1 + 2x_2 - x_3 = 4$, and the third
          demands $6$. Note that you had to combine all three equations — no
          pair is in conflict.
      - text: >
          $2x_1 + x_2 = 3$, $x_2 - x_3 = 1$, $2x_1 + 2x_2 - x_3 = 4$
        feedback: >
          Here the third equation is exactly the sum of the first two, so it
          imposes nothing new. The system is consistent, with $x_3$ free.
      - text: >
          $x_1 + 3x_2 = 2$, $2x_1 - x_2 = 4$
        feedback: >
          Two equations in two unknowns with a unique solution: $x_1 = 2$ and
          $x_2 = 0$, since $2 + 0 = 2$ and $4 - 0 = 4$.
      - text: >
          $x_1 + x_2 + x_3 = 0$
        feedback: >
          One equation with nonzero coefficients is always solvable — $(0,0,0)$
          and $(1, -1, 0)$ both work. A single equation can only be unsolvable
          in the degenerate case $0 = b$ with $b \ne 0$.
    rubric:
      - >
        Combines all three equations of the inconsistent system, and does not
        conclude consistency from every pair being solvable.
      - >
        Confirms that the near-miss system, differing only in the last constant,
        really is consistent rather than assuming it from the shape.
    targets:
      - linear-algebra.systems.def-consistent
    exercises: []
    connects: []
    tags: []

  # --- the augmented matrix ----------------------------------------------------

  - id: systems-def-augmented-matrix-01
    kind: work
    difficulty: routine
    statement: >
      A system consists of $6$ linear equations in $9$ unknowns. How many entries
      does its augmented matrix have?
    answer: >
      $60$. The augmented matrix has one row per equation, so $m = 6$ rows. It
      has one of its first $n$ columns per unknown and one final column for the
      constants, so $n + 1 = 9 + 1 = 10$ columns. That is a $6 \times 10$ array,
      with $6 \cdot 10 = 60$ entries. The two counts that go wrong are worth
      naming. Using $9$ columns instead of $10$ gives $54$ and amounts to
      discarding the constant column, which would leave you reducing the
      coefficient matrix alone — a different system, the one with every
      right-hand side $0$. And swapping the roles of $m$ and $n$ gives a
      $9 \times 7$ array; the number of rows is the number of equations and has
      nothing to do with $n + 1$.
    expects: "60"
    rubric:
      - >
        Uses $m$ rows and $n + 1$ columns, keeping the constant column in the
        count.
      - >
        Does not interchange the roles of the equation count and the unknown
        count.
    targets:
      - linear-algebra.systems.def-augmented-matrix
    exercises: []
    connects: []
    tags: []

  - id: systems-def-augmented-matrix-02
    kind: work
    difficulty: demanding
    statement: >
      The system $x_1 + 5x_2 - 2x_3 = 7$, $3x_2 + 6x_3 = 0$, $4x_1 - x_2 = 2$ is
      to be written as an augmented matrix, but with the unknowns taken in the
      order $x_3$, then $x_1$, then $x_2$ — so the first column belongs to $x_3$,
      the second to $x_1$ and the third to $x_2$. In that array, what is the
      entry in row $2$, column $1$?
    answer: >
      $6$. Row $2$ is the second equation, $0 x_1 + 3 x_2 + 6 x_3 = 0$, written
      with every position filled. Column $1$ now belongs to $x_3$, so the entry
      asked for is the coefficient of $x_3$ in the second equation, which is $6$.
      For the whole array, reading each equation off in the order
      $x_3, x_1, x_2$: row $1$ is $(-2, 1, 5 \mid 7)$, row $2$ is
      $(6, 0, 3 \mid 0)$, and row $3$ is $(0, 4, -1 \mid 2)$. Compare the
      standard order $x_1, x_2, x_3$, which gives rows $(1, 5, -2 \mid 7)$,
      $(0, 3, 6 \mid 0)$ and $(4, -1, 0 \mid 2)$ — the same nine coefficients,
      permuted within each row. The answer $3$ is what you get by reading row $2$
      as though the order were unchanged, and that is the whole point of the
      exercise: the array carries no record of which unknown owns which column,
      so the order has to be fixed before the array means anything at all.
    expects: "6"
    rubric:
      - >
        Fills in the missing $x_1$ of the second equation as a $0$ before
        rearranging, so the row has three coefficient entries.
      - >
        Places the coefficient of $x_3$ in the first column, as the stated order
        demands, rather than reading off the standard order.
    targets:
      - linear-algebra.systems.def-augmented-matrix
    exercises: []
    connects: []
    tags: []

  # --- the three moves ---------------------------------------------------------

  - id: systems-row-operations-01
    kind: work
    difficulty: standard
    statement: >
      A matrix has rows $(2, -3, 5 \mid 1)$ and $(6, -4, 0 \mid 7)$. After the
      replacement $R_2 \to R_2 - 3R_1$, what is the entry in row $2$, column $3$?
    answer: >
      $-15$. A replacement rewrites only the row named on the left of the arrow,
      and it does so slot by slot, subtracting three times the corresponding
      entry of $R_1$. Working across: $6 - 3(2) = 0$, then $-4 - 3(-3) = -4 + 9 =
      5$, then $0 - 3(5) = -15$, then $7 - 3(1) = 4$. So the new second row is
      $(0, 5, -15 \mid 4)$ and the entry in column $3$ is $-15$. Row $1$ is
      copied down untouched as $(2, -3, 5 \mid 1)$; that is what makes the
      operation reversible, since $R_2 \to R_2 + 3R_1$ now restores the original
      second row exactly. Two slips to avoid: the sign in the second slot, where
      subtracting $3(-3)$ *adds* $9$, and the last column, which is an ordinary
      entry as far as the arithmetic is concerned even though it plays a
      different role in the system.
    expects: "-15"
    rubric:
      - >
        Computes entry by entry across the whole row, including the constant
        column.
      - >
        Leaves row $1$ unchanged, and handles $-4 - 3(-3) = 5$ with the right
        sign.
    targets:
      - linear-algebra.systems.row-operations
    exercises: []
    connects: []
    tags: []

  - id: systems-row-operations-02
    kind: decide
    difficulty: demanding
    statement: >
      Exactly one of these is *not* an elementary row operation. Which one?
    answer: >
      $R_2 \to R_2 - R_2$ is the illegal one. Replacement is
      $R_i \to R_i + c R_j$ with $j \ne i$, and here the row being added is the
      row being rewritten. The side condition $j \ne i$ is not fastidiousness:
      it is what makes replacement reversible. When $j \ne i$, row $j$ survives
      the operation untouched, so $R_i \to R_i - c R_j$ afterwards restores row
      $i$ exactly. With $j = i$ the row is consumed by its own repair —
      $R_2 - R_2$ is the zero row, and no sequence of operations can reconstruct
      what was there, since a zero row added to anything contributes nothing.
      The equation that row recorded is simply gone, and the array afterwards can
      admit tuples the original refused. The other three are all legitimate.
      $R_3 \to R_3 - 7R_1$ is a replacement with $c = -7$ and $j = 1 \ne 3$.
      $R_1 \to -R_1$ is a scaling with $c = -1$, which is nonzero, and it undoes
      itself. $R_4 \leftrightarrow R_2$ is an interchange, which also undoes
      itself. Note that a replacement may use $c = 0$ — it is only *scaling* that
      requires $c \ne 0$.
    choices:
      - text: >
          $R_2 \to R_2 - R_2$
        correct: true
        feedback: >
          Replacement requires $j \ne i$, and this adds a multiple of row $2$ to
          row $2$ itself. It flattens the row to zeros irreversibly, which is
          exactly the damage the condition exists to prevent.
      - text: >
          $R_3 \to R_3 - 7R_1$
        feedback: >
          A replacement with $c = -7$ and $j = 1 \ne 3$: both conditions hold.
          The constant in a replacement may be any scalar, including $0$.
      - text: >
          $R_1 \to -R_1$
        feedback: >
          A scaling by $c = -1$. Scaling only requires $c \ne 0$ so that
          $\frac{1}{c}$ exists, and $-1$ is its own reciprocal.
      - text: >
          $R_4 \leftrightarrow R_2$
        feedback: >
          An interchange, the tamest of the three operations: performing it
          again puts both rows back.
    rubric:
      - >
        Names $j \ne i$, not $c \ne 0$, as the condition that is violated.
      - >
        Explains the fault as loss of reversibility — the row becomes zero and
        cannot be recovered — rather than as a formal breach of notation.
    targets:
      - linear-algebra.systems.row-operations
    exercises: []
