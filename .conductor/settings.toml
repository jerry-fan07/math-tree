"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Every workspace runs its own app instance against its own state under build/,
# so nothing is shared between them — see Scripts/run-app.sh.
run_mode = "concurrent"

[scripts.run.app]
# macOS-only: SwiftUI + Metal, and the bundle step needs codesign.
available_in = [ "local" ]
command = "Scripts/run-app.sh"
default = true
icon = "play"

[scripts.run.test]
available_in = [ "local" ]
command = "swift test"
icon = "test-tube"
